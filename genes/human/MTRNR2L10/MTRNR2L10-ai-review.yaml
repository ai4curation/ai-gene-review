id: P0CJ77
gene_symbol: MTRNR2L10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MTRNR2L10 is a nuclear human locus on the X chromosome that resembles the humanin small
  open reading frame of the mitochondrial large-subunit rRNA gene MT-RNR2, one of thirteen such
  MT-RNR2-like sequences in the human genome that are generally interpreted as nuclear insertions of
  mitochondrial DNA. Its predicted product, humanin-like 10 (HN10), is a 24-residue peptide
  (MTTRGFSCLLLLIREIDLSAKRRI) that matches humanin at 17 of 24 aligned positions, differing by
  Ala2->Thr, Pro3->Thr, Thr13->Ile, Ser14->Arg, Pro19->Ser, Val20->Ala and Ala24->Ile; it retains the
  Leu9-Leu12 stretch but is the only member of the family that alters both residues of the
  Pro19-Val20 segment humanin requires for secretion, and it carries substitutions at three positions
  whose mutation abolishes or reduces humanin activity. The locus is transcribed: RT-PCR detects it in
  human tissues, most strongly in testis, and its transcript is down-regulated 6 hours and
  up-regulated 24 hours after staurosporine treatment of cultured cells. Whether a peptide is
  actually made from this transcript, and what it does, is unestablished: no HN10 peptide has been
  detected by mass spectrometry in human tissue or fluid, no molecular activity has been measured for
  it, and no binding partner or receptor interaction has been reported; reports of reduced serum
  humanin-like 10 in restless legs syndrome rest on an immunoassay that has not been shown to
  discriminate this peptide from humanin or from its nuclear siblings. The humanin peptide from which
  it is named is cytoprotective and antiapoptotic, binds BAX, BID, BIM and IGFBP3 intracellularly and
  signals through FPRL1/FPR2 and a CNTFR-alpha/WSX-1/gp130 complex when secreted, but those
  properties were measured on the mitochondrially encoded peptide and on synthetic analogues of it,
  not on this gene product.'
