- term:
    id: GO:1900118
    label: negative regulation of execution phase of apoptosis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002141596
  - UniProtKB:P0CJ72
  review:
    summary: Phylogenetic propagation of negative regulation of the execution phase of apoptosis to
      MTRNR2L10 from the humanin-family node. The co-listed donor is UniProtKB:P0CJ72 (MTRNR2L5),
      whose own evidence for this term is an IMP from an assay on synthetic HN5 peptide
      [PMID:19477263].
    action: REMOVE
    reason: 'The antiapoptotic function is the best-supported property of this family, and the IBD
      placement is sensible: humanin blocks BAX, BID and BIM and is antiapoptotic in many systems, and
      synthetic HN5 peptide - the product of one of these very nuclear loci - is cytoprotective against
      staurosporine-induced apoptosis [PMID:19477263]. For HN10, though, that same HN5 experiment is
      the argument against the row rather than for it. The HN5 variant that was measured to be less
      cytoprotective is the one carrying Thr13->Ile [PMID:19477263], which is exactly the substitution
      HN10 carries, and HN10 adds Ser14->Arg, listed in UniProt among the humanin substitutions that
      abolish neuroprotective activity, plus the loss of Pro3
      (file:human/MT-RNR2__Q8IVG9/MT-RNR2__Q8IVG9-uniprot.txt). The usual mitigation for this family
      does not apply, because HN10 retains Leu12 and diverges instead at the positions HN5 kept. What
      the row also lacks is anything specific to this locus. Its transcript is detectable and
      staurosporine-responsive [PMID:19477263], but a transcript is not a peptide, no apoptosis assay
      has used HN10, and the systematic human-genetics lookup across all thirteen loci found no
      association with disease and no expression QTL that would argue for a functional product
      [PMID:31753007]. The one clinical paper that names this locus as neuroprotective selected it out
      of a differential-expression list by this very GO term [PMID:38630326], so it cannot be used as
      independent support without closing a loop. I remove the row.'
    supported_by:
