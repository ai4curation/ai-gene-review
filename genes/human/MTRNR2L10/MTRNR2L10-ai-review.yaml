suggested_questions:
- question: Is a peptide produced from the MTRNR2L10 locus at all? Everything annotated to this gene
    follows from the assumption that it is, and the assumption rests on an intact open reading frame
    plus RT-PCR detection of the transcript [PMID:19477263]. Targeted mass spectrometry of testis for
    the HN10-specific tryptic peptides would settle it, and HN10 is unusually tractable for this
    because the IREIDLSA region differs from humanin at four positions.
  experts:
  - Alan Saghatelian
  - Pinchas Cohen
  - Jonathan Wren
- question: What does the serum humanin-like 10 ELISA actually measure? Reduced levels are reported in
    restless legs syndrome [PMID:38630326], but HN10 matches humanin at 17 of 24 positions and its
    nuclear siblings more closely, and no locus-specific immunodetection has been demonstrated
    anywhere in this family. Epitope mapping of the antibody against synthetic HN1-HN13 and humanin
    would establish what the clinical literature on humanin-like peptides is reporting.
  experts:
  - Pinchas Cohen
- question: How should GO treat a family in which one member has all the experimental evidence and
    twelve nuclear copies have none? The present solution propagates humanin's activity to every copy
    through PANTHER:PTN002141596, which produces thirteen gene products annotated as receptor
    antagonists and apoptosis regulators on the strength of one mitochondrial peptide. A node
    restricted to MT-RNR2 plus MTRNR2L5, the two sequences with functional data, would say what is
    actually known. MTRNR2L10 shows the downstream cost - a clinical study selected this locus for
    investigation on the basis of the propagated term [PMID:38630326], so the annotation is now
    generating the literature that appears to confirm it.
- question: Do the rat sequences manipulated in the status-epilepticus study [PMID:42289503]
    correspond to human MTRNR2L1 and MTRNR2L10? These are pericentromeric nuclear insertions of
    mitochondrial rRNA, so one-to-one orthology across rodents and primates should not be assumed, and
    knockdown constructs against one such sequence may hit several. Stating the rat loci and the
    construct specificity controls would make that work interpretable for human gene annotation.
suggested_experiments:
- description: Targeted (PRM) mass spectrometry of human testis and of plasma for peptides unique to
    HN10, using the positions at which it differs from humanin (Ala2->Thr, Pro3->Thr, Thr13->Ile,
    Ser14->Arg, Pro19->Ser, Val20->Ala and Ala24->Ile) to design discriminating transitions. This is
    the one experiment that would convert the entire annotation set on this gene from inference to
    observation.
- description: Ribosome profiling or ORF-capture of the MTRNR2L10 transcript in testis, to test
    whether the predicted ORF is translated rather than merely transcribed.
- description: Synthesise the HN10 peptide and test it side by side with humanin and with HN5 in the
    secretion assay used to map the humanin Pro19-Val20 determinant, and in staurosporine- and
    amyloid-beta-induced death, FPRL1 competition and BAX binding. HN10 is the natural test of whether
    the Pro19-Val20 segment is required for secretion in a natural sequence context rather than only
    in arginine-substituted mutants, and whether Thr13->Ile plus Ser14->Arg together abolish
    cytoprotection as the single-substitution data predict.
- description: Epitope mapping of the commercial humanin-like 10 antibody against synthetic humanin
    and all thirteen HN-like peptides, to determine whether published serum measurements
    [PMID:38630326] are locus-specific. This is a prerequisite for interpreting any clinical study of
    this family.
