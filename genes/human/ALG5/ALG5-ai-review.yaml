- id: PMID:10359825
  title: A mutation in the human ortholog of the Saccharomyces cerevisiae ALG6 gene causes carbohydrate-deficient
    glycoprotein syndrome type-Ic.
  findings:
  - statement: Human ALG5 cDNA was cloned and partially complemented the CPY hypoglycosylation of an S.
      cerevisiae alg5 deletion strain; ALG5 was not mutated in the CDGS-Ic patients (the causal gene was
      ALG6). The paper contains no direct localization or topology experiment for ALG5.
    supporting_text: Expression of the humanALG5andALG6cDNA partially complemented the respective yeast
      mutations, as shown by the improved glycosylation of CPY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text now cached (an earlier note recorded it as abstract-only). Titled for ALG6,
      but the full text clones and functionally characterizes human ALG5 by yeast complementation. The
      1999 cDNA is reported to encode 242 amino acids, shorter than the 324-aa canonical Q9Y673; the complementation
      therefore used that clone. The ER-membrane and cytoplasmic-side CC annotations attributed to this
      paper are not directly tested in it, though both claims are correct on other grounds.
