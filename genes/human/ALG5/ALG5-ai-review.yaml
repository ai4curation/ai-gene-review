      among 1843 proteins; supports bulk membrane localization only.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: High-throughput membrane proteome; ALG5 detected but only supports the generic membrane
      term, less informative than ER membrane.
