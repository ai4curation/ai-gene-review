- id: PMID:35896117
  title: Monoallelic pathogenic ALG5 variants cause atypical polycystic kidney disease and interstitial
    fibrosis.
  findings:
  - statement: Monoallelic ALG5 variants in five families cause an ADPKD-spectrum disorder with interstitial
      fibrosis; ALG5 haploinsufficiency alters N-glycan synthesis in renal epithelial cells and ALG5 is
      required for polycystin-1 maturation and membrane and ciliary localization.
    supporting_text: We demonstrate that ALG5 haploinsufficiency is sufficient to alter
      the synthesis of the N-glycan chain in renal epithelial cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache (PMC9388391). Establishes the PKD7 disease association and the
      downstream polycystin-1 maturation defect; the PC1 effect is a downstream consequence of reduced
      N-glycosylation, not an ALG5 process annotation.
- id: file:human/ALG5/ALG5-deep-research-falcon.md
  title: Falcon deep research report on human ALG5
  findings:
  - statement: Summarizes the Dol-P-Glc synthase reaction and its cytosolic-face orientation, notes that
      detailed topology data come mainly from yeast Alg5, and reviews the 2024 p.Arg79Trp kidney-disease
      pedigrees.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Machine-generated synthesis; used only for the topology framing. Its disease claims
      about p.Arg79Trp (Elhassan et al. 2024) were not independently verified here.
