id: Q9Y673
gene_symbol: ALG5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALG5 is an endoplasmic reticulum membrane glycosyltransferase of the GT2 family (dolichyl-phosphate
  beta-glucosyltransferase, Dol-P-Glc synthase, EC 2.4.1.117). Anchored in the ER membrane by an N-terminal
  hydrophobic segment, with its catalytic domain facing the cytosol, it transfers glucose from cytosolic
  UDP-glucose to dolichyl phosphate to form dolichyl beta-D-glucosyl phosphate (Dol-P-Glc). After translocation
  to the lumenal leaflet, Dol-P-Glc is the glucose donor used by ALG6, ALG8 and ALG10 to add the three
  terminal glucoses that complete the Glc3Man9GlcNAc2-PP-dolichol precursor of asparagine-linked glycans.
  Human ALG5 partially complements the hypoglycosylation of yeast alg5 mutants. Monoallelic loss-of-function
  ALG5 variants cause an autosomal dominant polycystic kidney disease with interstitial fibrosis (PKD7);
  ALG5 haploinsufficiency alters N-glycan synthesis in renal epithelial cells and impairs maturation and
  ciliary delivery of polycystin-1.
