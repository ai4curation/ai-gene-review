      UDP-glucose + dolichyl phosphate to form Dol-P-Glc on the cytosolic face of the ER membrane.
- id: Reactome:R-HSA-480985
  title: Synthesis of dolichyl-phosphate-glucose
  findings:
  - statement: Reactome pathway describing synthesis of Dol-P-Glc and its role as glucose donor in three
      steps of N-glycan precursor biosynthesis.
suggested_questions:
- question: Does isoform 2 (Q9Y673-2), which lacks residues 95-124 within the GT2 catalytic domain including
    the conserved 108-VVDDGSKD-115 stretch, retain any Dol-P-Glc synthase activity, or is it a non-catalytic
    product?
- question: How is Dol-P-Glc, made on the cytosolic face, translocated to the lumenal leaflet, and does
    ALG5 associate with the flippase or with the lumenal glucosyltransferases?
- question: Why is renal epithelium particularly sensitive to ALG5 haploinsufficiency, given that other
    tissues of PKD7 carriers show no overt glycosylation defect?
suggested_experiments:
- description: Reconstitute purified recombinant human ALG5 (canonical 324-aa isoform and isoform 2)
    with dolichyl phosphate and UDP-glucose to measure Dol-P-Glc synthase kinetics, and test the PKD7
    missense variants (R208H, R212H) and the R79W variant for loss of catalytic activity.
  hypothesis: PKD7-associated ALG5 missense variants reduce or abolish Dol-P-Glc synthase activity, and
    isoform 2 is catalytically inactive.
- description: Use protease-protection or glycosylation-reporter topology mapping of tagged human ALG5
    in mammalian cells to confirm the cytosolic orientation of the catalytic domain.
  hypothesis: The human ALG5 catalytic domain faces the cytosol, as predicted and as shown for yeast Alg5.
