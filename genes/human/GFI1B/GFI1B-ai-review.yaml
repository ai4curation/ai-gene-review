core_functions:
- description: Recognizes regulatory DNA and assembles repressive transcriptional complexes in the nucleus,
    regulating erythrocyte and megakaryocyte differentiation. SNAG-dependent corepressor recruitment couples
    GFI1B recognition to chromatin regulation; associated enzymes perform the chromatin-modifying chemistry.
    Human p32 has a demonstrated erythroid requirement, while autonomous p37 sufficiency and identical lineage
    roles for both products are not established.
