  review:
    summary: Refine blood-cell developmental regulation to erythrocyte and megakaryocyte differentiation.
    action: MODIFY
    reason: The actual AN29/PTN008616677 IBD supports inherited regulation of hemopoiesis without a phylogenetic
      failure. Target-specific evidence permits two more precise regulatory processes. In human UT-7 cells,
      p32-selective depletion impairs erythroid differentiation and p32 expression induces it without EPO (PMID:22399799);
      p37 overexpression also raises endogenous p32, so autonomous p37 sufficiency is unresolved. Human GFI1B
      mutations alter transcriptional activity and accompany abnormal megakaryocyte development and marker
      expression (PMID:23927492; PMID:24325358). The latter abstracts support a regulatory role with full experimental
