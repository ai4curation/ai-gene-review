id: Q5VTD9
gene_symbol: GFI1B
aliases:
- ZNF163B
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
status: COMPLETE
description: GFI1B is a nuclear zinc-finger transcription factor that recognizes regulatory DNA and recruits
  transcriptional corepressors through its N-terminal SNAG region. Its regulation of gene expression supports
  erythroid and megakaryocytic development. Repression is its principal characterized activity, while activation
  depends on promoter and cellular context. Alternative splicing produces the 330-residue p37 and 284-residue
  p32 proteins, which differ in their zinc-finger region and in experimentally observed corepressor recruitment
  and erythroid differentiation activity.
functional_isoforms:
- id: GFI1B_P37
  name: p37
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q5VTD9-1
  description: The 330-residue displayed sequence equals the direct Q5VTD9-1 FASTA; Q5VTD9 is the same sequence,
    not an additional product. The longer natural product contains six annotated C2H2 zinc fingers. Its overexpression
    can increase endogenous p32, so that experiment does not isolate autonomous p37 sufficiency for erythroid
    differentiation.
- id: GFI1B_P32
  name: p32
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q5VTD9-2
  description: The 284-residue direct FASTA equals the displayed sequence after deletion of residues 171–216
    (VSP_028459), disrupting the first two zinc-finger regions. The shorter natural product retains sequence-specific
    DNA recognition and recruits the LSD1–CoREST complex efficiently in the tested human cell systems. Selective
    depletion impairs erythroid differentiation; these results are distinct from effects of engineered SNAG
    mutants.
