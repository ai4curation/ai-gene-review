- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:2578891
  qualifier: part_of
  review:
    summary: TGM2 has a plasma-membrane/cell-surface pool, but this CACAO evidence belongs on TGM1.
    action: ACCEPT
    reason: The plasma-membrane claim is independently supportable for TGM2 from UniProt
      cell-surface evidence, so the term is retained; PMID:2578891 itself described the
      keratinocyte-specific particulate enzyme used for cross-linked envelope formation and should
      be repointed to TGM1 upstream.
    supported_by:
    - reference_id: PMID:2578891
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: CACAO
      slot: DB_Object_ID
      requested_change: REPOINT
      asserted_value: UniProtKB:P21980
      cause: LEGACY_ALIAS
      confidence: PROBABLE
      explanation: The cited Cell paper assayed keratinocyte-specific particulate transglutaminase
        in cross-linked envelope formation, matching the epidermal TGM1 enzyme rather than tissue
        transglutaminase/TGM2.
      corrected_value: UniProtKB:P22735
      corrected_label: TGM1
      supported_by:
      - reference_id: PMID:2578891
        supporting_text: 'Keratinocyte-specific transglutaminase of cultured human epidermal cells: relation
          to cross-linked envelope formation and terminal differentiation.'
