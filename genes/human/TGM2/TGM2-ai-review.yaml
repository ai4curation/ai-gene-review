id: P21980
gene_symbol: TGM2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TGM2 encodes tissue transglutaminase, a calcium-activated and GTP-inhibited enzyme that
  crosslinks peptide-bound glutamine to lysine and other primary amines. Secreted TGM2 remodels extracellular
  matrices by crosslinking fibronectin, osteopontin and other substrates, while intracellular TGM2 can
  crosslink cytosolic and mitochondrial-proximal substrates during stress and apoptosis. The same catalytic
  core also deamidates glutaminyl peptides, including gliadin in celiac disease, and transfers serotonin,
  dopamine, histamine or noradrenaline to protein glutamines, with histone H3 monoaminylation providing
  a nuclear chromatin-regulatory output. Independently of transamidation, TGM2 binds GTP as the historical
  Gh protein in alpha1-adrenergic receptor to phospholipase C signaling.'
