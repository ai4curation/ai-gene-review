suggested_questions:
- question: Which extracellular and intracellular TGM2 substrates are recurrent physiological
    targets rather than stress- or assay-specific targets?
- question: How is TGM2 partitioned among cytosol, nucleus, mitochondria, cell surface, and
    extracellular matrix, and which trafficking machinery externalizes it?
- question: Which TGM2 monoaminylation reactions beyond histone serotonylation and dopaminylation
    occur at stoichiometries high enough to regulate endogenous substrates in human cells?
suggested_experiments:
- description: Profile TGM2-dependent isopeptide and monoaminylated glutamine sites by quantitative
    mass spectrometry in matched TGM2 wild-type, catalytic-dead, and knockout human cells under
    basal, calcium-stress, and matrix-remodeling conditions.
