      more precisely.'
    supported_by:
    - reference_id: PMID:30487600
      supporting_text: NLRP3 is recruited to the dispersed TGN (dTGN) through ionic bonding between
        its conserved polybasic region and negatively charged phosphatidylinositol-4-phosphate (PtdIns4P)
        on the dTGN.
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: Extracellular localisation of NLRP3, from the observation that oligomeric inflammasome
      particles are released by activated macrophages and act extracellularly.
    action: KEEP_AS_NON_CORE
    reason: A genuine and well-controlled finding - released oligomeric NLRP3 particles stimulate
      caspase-1 activation in bystander cells and ASC particles are detectable in the serum of patients
