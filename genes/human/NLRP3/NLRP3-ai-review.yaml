- term:
    id: GO:0005815
    label: microtubule organizing center
  evidence_type: IDA
  original_reference_id: PMID:39173637
  qualifier: located_in
  review:
    summary: NLRP3 is transported along microtubules to the microtubule organising centre, where
      it forms condensates and assembles with NEK7 into the inflammasome.
    action: ACCEPT
    reason: 'A well-supported and mechanistically important site, with two independent IDAs (MARK4-driven
      delivery; palmitoylation- and LATS1/2-dependent trafficking) and now a 2026 study placing microtubule
      transport, NEK7 localisation, priming and NLRP3 abundance together at the pericentriolar material.
      Recorded with the caveat that the MTOC route is not obligatory: a parallel MTOC-distal pathway
      exists and predominates in human neutrophils.'
    supported_by:
    - reference_id: PMID:28656979
      supporting_text: Here we show that microtubule-affinity regulating kinase 4 (MARK4) binds to
        NLRP3 and drives it to the microtubule-organizing centre, enabling the formation of one large
        inflammasome speck complex within a single cell.
    - reference_id: PMID:42378282
      supporting_text: Microtubules, priming, and NEK7 synergistically converge on PCM abundance,
        thereby creating a permissive centrosomal environment for NLRP3 condensation and inflammasome
