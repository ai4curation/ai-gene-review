- description: 'NLRP3 scaffolds a biomolecular condensate at the pericentriolar material of the microtubule
    organising centre, into which microtubule-dependent transport delivers both NLRP3 and the licensing
    kinase NEK7, and within which the inflammasome assembles. Priming, microtubule transport, NEK7
    and NLRP3 abundance all converge on making this environment permissive, which sets the activation
    threshold. This route is important but not obligatory: low-molecular-weight, non-cage NLRP3 species
    support a slower trans-Golgi- and MTOC-distal pathway that dominates in human neutrophils.'
