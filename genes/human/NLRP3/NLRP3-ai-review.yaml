core_functions:
- description: 'NLRP3 nucleates the inflammasome that activates caspase-1. Its N-terminal pyrin domains
    stack into a filament on the activated oligomer, and that filament seeds unidirectional polymerisation
    of the adaptor ASC, which recruits procaspase-1 and permits proximity-induced autoprocessing.
    NLRP3 has no catalytic activity of its own in this step: it supplies the geometry.'
