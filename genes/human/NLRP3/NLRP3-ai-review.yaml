- term:
    id: GO:1901223
    label: negative regulation of non-canonical NF-kappaB signal transduction
  evidence_type: IDA
  original_reference_id: PMID:14662828
  qualifier: involved_in
  review:
    summary: 'Suppression of NF-kappaB signalling by cryopyrin, reported in 2003: full-length CIAS1
      and two natural short isoforms inhibited TNF-alpha-induced NF-kappaB reporter activity and
      p65 nuclear translocation.'
    action: KEEP_AS_NON_CORE
    reason: An early, inflammasome-independent activity that has not been integrated into the modern
      picture of NLRP3 and sits awkwardly beside the opposite-direction annotation this gene also
      carries (GO:1901224, positive regulation of the same pathway). GOA thus holds both signs simultaneously,
      on evidence from overexpression-based reporter assays in both cases. Retained on both sides
      rather than adjudicated, because neither has been tested at endogenous expression levels and
      the honest reading is that the NF-kappaB regulatory role of NLRP3 is unsettled.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15030775
  qualifier: enables
  review:
    summary: Bare protein binding from twenty-four separate interaction studies.
    action: MARK_AS_OVER_ANNOTATED
    reason: Uninformative as a molecular function. Several of the underlying interactions are biologically
      important - NEK7, ASC, MAVS, MARK4, BTK, SHP2, TRIM65 - but each is captured by a specific
      process or complex annotation elsewhere in this set; the bare term adds nothing.
- term:
    id: GO:0032731
    label: positive regulation of interleukin-1 beta production
  evidence_type: IDA
  original_reference_id: PMID:15030775
  qualifier: involved_in
  review:
    summary: The NLRP3 inflammasome drives caspase-1-dependent maturation and release of interleukin-1
      beta.
    action: ACCEPT
    reason: Core biological process and the principal physiological output of NLRP3, supported by
      thirteen annotations. The clinical corollary is that CAPS patients carrying gain-of-function
      NLRP3 mutations respond to interleukin-1 blockade.
    supported_by:
    - reference_id: PMID:15030775
      supporting_text: Macrophages from Muckle-Wells patients spontaneously secrete active IL-1beta.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: TAS
  original_reference_id: PMID:15967716
  qualifier: located_in
  review:
    summary: NLRP3 is a cytosolic protein; resting NLRP3 is soluble in the cytoplasm before stimulus-induced
      relocalisation.
    action: ACCEPT
    reason: Correct and uncontroversial across six independent annotations, though the cytosol (GO:0005829)
      annotation this gene also carries is the more informative statement of the same fact.
- term:
    id: GO:0006952
    label: defense response
  evidence_type: TAS
  original_reference_id: PMID:15967716
  qualifier: involved_in
  review:
    summary: Defense response, from a review of NLR biology.
    action: ACCEPT
    reason: Correct but very general; retained as a true high-level statement, with the informative
      detail supplied by the inflammasome-assembly and interleukin-1 beta terms.
- term:
    id: GO:0009595
    label: detection of biotic stimulus
  evidence_type: TAS
  original_reference_id: PMID:15967716
  qualifier: involved_in
  review:
    summary: Detection of biotic stimulus, from the silica and aluminium salt study and from a review
      of NLR biology.
    action: KEEP_AS_NON_CORE
    reason: Two problems, neither fatal. The agonists in the cited experimental study - silica crystals
      and aluminium salts - are abiotic, so they cannot support a biotic-stimulus term; and the paper's
      own conclusion is that what is sensed is lysosomal damage, an endogenous event downstream of
      the particle. NLRP3 genuinely does respond to biotic stimuli such as pore-forming toxins and
      viral proteins, which is why this is retained rather than removed, but as a downstream and
      indirect participation rather than as detection in the strict sense.
    supported_by:
    - reference_id: PMID:18604214
      supporting_text: Our results indicate that the NALP3 inflammasome senses lysosomal damage as
        an endogenous 'danger' signal.
- term:
    id: GO:0042834
    label: peptidoglycan binding
  evidence_type: TAS
  original_reference_id: PMID:15967716
  qualifier: enables
  review:
    summary: Peptidoglycan binding, asserted by a curator from a 2005 review of NLR biology.
    action: REMOVE
    reason: No experimental support exists for this, in this reference or elsewhere. The annotation
      is TAS from a review, not an experimental call, so no curator's reading of a primary dataset
      is being second-guessed. It descends from the mid-2000s proposal that NALP3 senses bacterial
      peptidoglycan and muramyl dipeptide; direct binding of peptidoglycan to NLRP3 was never demonstrated,
      the dedicated peptidoglycan sensors were subsequently established to be NOD1 and NOD2, and
      the modern model has NLRP3 responding to a common downstream perturbation rather than to any
      specific microbial polymer. Leaving a ligand-binding molecular function asserted for a protein
      with no known direct ligand is actively misleading, and it is the kind of claim that downstream
      tooling will believe.
- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: NAS
  original_reference_id: PMID:12032915
  qualifier: involved_in
  review:
    summary: Apoptotic process, asserted by a curator from the 2002 CINCA syndrome gene-identification
      paper.
    action: MARK_AS_OVER_ANNOTATED
    reason: A non-traceable author statement from the era when NACHT-domain proteins were assumed
      to be APAF1-like apoptosis regulators - the protein family names of the period, PYPAF and Apaf1-like,
      record that assumption. The death modality NLRP3 actually drives is gasdermin-D-dependent pyroptosis,
      which is separately and correctly annotated; no evidence that NLRP3 promotes apoptosis has
      accumulated since.
- term:
    id: GO:0006954
    label: inflammatory response
  evidence_type: IMP
  original_reference_id: PMID:12093792
  qualifier: involved_in
  review:
    summary: NLRP3 participates in the inflammatory response.
    action: ACCEPT
    reason: Correct general parent, supported by six annotations; the specific positive-regulation
      and interleukin-1 beta terms carried by this gene are the informative statements.
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: NAS
  original_reference_id: PMID:11786556
  qualifier: involved_in
  review:
    summary: Signal transduction, from the original PYPAF1 characterisation.
    action: KEEP_AS_NON_CORE
    reason: A root-level term that conveys nothing NLRP3-specific. Retained because it is not wrong,
      but it is superseded entirely by the inflammasome assembly, adaptor and caspase-activator annotations
      this gene carries.
