- term:
    id: GO:1901223
    label: negative regulation of non-canonical NF-kappaB signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Suppression of NF-kappaB signalling by cryopyrin, reported in 2003: full-length CIAS1
      and two natural short isoforms inhibited TNF-alpha-induced NF-kappaB reporter activity and
      p65 nuclear translocation.'
    action: KEEP_AS_NON_CORE
    reason: An early, inflammasome-independent activity that has not been integrated into the modern
      picture of NLRP3 and sits awkwardly beside the opposite-direction annotation this gene also
      carries (GO:1901224, positive regulation of the same pathway). GOA thus holds both signs simultaneously,
      on evidence from overexpression-based reporter assays in both cases. Retained on both sides
      rather than adjudicated, because neither has been tested at endogenous expression levels and
      the honest reading is that the NF-kappaB regulatory role of NLRP3 is unsettled.
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: On activation NLRP3 is recruited to Golgi membranes, specifically the dispersed trans-Golgi
      network.
    action: ACCEPT
    reason: 'Correct, and mechanistically central rather than incidental: recruitment happens through
      ionic bonding between the NLRP3 polybasic region and PtdIns4P on the dispersed TGN. The trans-Golgi
