- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IDA
  original_reference_id: PMID:23582325
  qualifier: located_in
  review:
    summary: Recruitment of NLRP3 to mitochondria, reported in two independent studies (mitochondrial
      ROS and damage; MAVS-dependent recruitment).
    action: KEEP_AS_NON_CORE
    reason: Contested, and GOA carries the competing localisations side by side. Zhou et al. placed
      resting NLRP3 on ER structures and activated NLRP3 at perinuclear ER-mitochondria clusters,
      and Subramanian et al. showed MAVS-dependent recruitment to mitochondria; the later dispersed-TGN
      and MTOC work, which accounts for activation by structurally unrelated stimuli, has displaced
      the mitochondrion as the principal assembly site, and neither 2026 study invokes it. Retained
      rather than removed because these are experimental annotations and mitochondrial damage is
      a genuine upstream input to NLRP3; demoted because it is not where the inflammasome is now
      thought to assemble.
    supported_by:
    - reference_id: PMID:23582325
      supporting_text: MAVS mediates recruitment of NLRP3 to mitochondria, promoting production of
        IL-1β and the pathophysiologic activity of the NLRP3 inflammasome in vivo.
- term:
    id: GO:0005815
    label: microtubule organizing center
  evidence_type: IDA
  original_reference_id: PMID:28656979
  qualifier: located_in
  review:
    summary: NLRP3 is transported along microtubules to the microtubule organising centre, where
      it forms condensates and assembles with NEK7 into the inflammasome.
    action: ACCEPT
    reason: 'A well-supported and mechanistically important site, with two independent IDAs (MARK4-driven
      delivery; palmitoylation- and LATS1/2-dependent trafficking) and now a 2026 study placing microtubule
      transport, NEK7 localisation, priming and NLRP3 abundance together at the pericentriolar material.
