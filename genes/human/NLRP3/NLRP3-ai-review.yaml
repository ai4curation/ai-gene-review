- term:
    id: GO:0032588
    label: trans-Golgi network membrane
  evidence_type: IDA
  original_reference_id: PMID:30487600
  qualifier: is_active_in
  review:
    summary: NLRP3 is active at the membrane of the dispersed trans-Golgi network, where PtdIns4P
      binding concentrates it and the dTGN serves as the aggregation scaffold.
    action: ACCEPT
    reason: The most informative localisation annotation NLRP3 carries, and the one that matches
      the current activation model. Qualified by the 2026 finding that a trans-Golgi-distal route
      also exists and dominates in human neutrophils, so this is a major site of activation rather
      than the only one.
    supported_by:
    - reference_id: PMID:30487600
      supporting_text: These results indicate that recruitment of NLRP3 to dTGN is an early and common
        cellular event that leads to NLRP3 aggregation and activation in response to diverse stimuli.
    - reference_id: PMID:42215451
      supporting_text: 'nigericin, a K+-dependent NLRP3 stimulus, can trigger two distinct activation
        pathways: (i) the rapidly engaged decameric cage-dependent pathway; and (ii) a decameric
        cage-independent, TGN/MTOC-distal, and slow-reacting pathway employed by low molecular weight
        NLRP3 species, that dominates in human neutrophils.'
- term:
    id: GO:0072559
    label: NLRP3 inflammasome complex
  evidence_type: IDA
  original_reference_id: PMID:16407889
  qualifier: part_of
  review:
    summary: NLRP3 is the defining sensor subunit of the NLRP3 inflammasome, together with ASC and
      caspase-1.
    action: ACCEPT
    reason: 'Core, and about as securely established as any complex membership in GO: six annotations
      including the founding biochemical reconstitution, cryo-EM of the active disc and the phylogenetic
      inference.'
    supported_by:
    - reference_id: PMID:15030775
      supporting_text: Here, we report that NALP2 and NALP3 associate with ASC, the CARD-containing
        protein Cardinal, and caspase-1 (but not caspase-5), thereby forming an inflammasome with
        high proIL-1beta-processing activity.
- term:
    id: GO:0140608
    label: cysteine-type endopeptidase activator activity
  evidence_type: IDA
  original_reference_id: PMID:16407889
  qualifier: enables
  review:
    summary: The assembled NLRP3 inflammasome activates procaspase-1, the proximate output of NLRP3
      function.
    action: ACCEPT
    reason: Core. NLRP3 does not itself cleave caspase-1; it nucleates the platform on which proximity-induced
      caspase-1 autoprocessing occurs, which is exactly what an activator activity term asserts.
      Supported by the crystal-activation work and by the NEK7-licensed activation structure.
    supported_by:
    - reference_id: PMID:16407889
      supporting_text: Here we show that MSU and CPPD engage the caspase-1-activating NALP3 (also
        called cryopyrin) inflammasome, resulting in the production of active interleukin (IL)-1beta
        and IL-18.
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: EXP
  original_reference_id: PMID:30487600
  qualifier: located_in
  review:
    summary: On activation NLRP3 is recruited to Golgi membranes, specifically the dispersed trans-Golgi
      network.
    action: ACCEPT
    reason: 'Correct, and mechanistically central rather than incidental: recruitment happens through
      ionic bonding between the NLRP3 polybasic region and PtdIns4P on the dispersed TGN. The trans-Golgi
      network membrane annotation (GO:0032588) that this gene also carries states the same localisation
      more precisely.'
    supported_by:
    - reference_id: PMID:30487600
      supporting_text: NLRP3 is recruited to the dispersed TGN (dTGN) through ionic bonding between
        its conserved polybasic region and negatively charged phosphatidylinositol-4-phosphate (PtdIns4P)
        on the dTGN.
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:24952504
  qualifier: located_in
  review:
    summary: Extracellular localisation of NLRP3, from the observation that oligomeric inflammasome
      particles are released by activated macrophages and act extracellularly.
    action: KEEP_AS_NON_CORE
    reason: A genuine and well-controlled finding - released oligomeric NLRP3 particles stimulate
      caspase-1 activation in bystander cells and ASC particles are detectable in the serum of patients
      with active CAPS - but it describes the fate of the assembled complex after pyroptosis, not
      a compartment in which NLRP3 performs its function.
    supported_by:
    - reference_id: PMID:24952504
      supporting_text: Here we found that upon activation of caspase-1, oligomeric NLRP3 inflammasome
        particles were released from macrophages.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: Nuclear localisation, from the UniProt mapping and transferred by similarity from mouse
      Nlrp3.
    action: KEEP_AS_NON_CORE
    reason: 'Part of the inflammasome-independent transcriptional-cofactor claim: mouse Nlrp3 was
      reported to enter the nucleus of T helper 2 cells, bind the Il4 promoter and transactivate
      it with IRF4. That is a single-laboratory result, carries a published corrigendum, and has
      no independent human corroboration, so it is retained but kept well away from the core. Note
      the human annotation is orthology-based only.'
    additional_reference_ids:
    - PMID:26098997
    - PMID:26580508
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: EXP
  original_reference_id: PMID:21124315
  qualifier: located_in
  review:
    summary: Recruitment of NLRP3 to mitochondria, reported in two independent studies (mitochondrial
      ROS and damage; MAVS-dependent recruitment).
    action: KEEP_AS_NON_CORE
    reason: Contested, and GOA carries the competing localisations side by side. Zhou et al. placed
      resting NLRP3 on ER structures and activated NLRP3 at perinuclear ER-mitochondria clusters,
      and Subramanian et al. showed MAVS-dependent recruitment to mitochondria; the later dispersed-TGN
      and MTOC work, which accounts for activation by structurally unrelated stimuli, has displaced
      the mitochondrion as the principal assembly site, and neither 2026 study invokes it. Retained
      rather than removed because these are experimental annotations and mitochondrial damage is
      a genuine upstream input to NLRP3; demoted because it is not where the inflammasome is now
      thought to assemble.
    supported_by:
    - reference_id: PMID:23582325
      supporting_text: MAVS mediates recruitment of NLRP3 to mitochondria, promoting production of
        IL-1β and the pathophysiologic activity of the NLRP3 inflammasome in vivo.
- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: Endoplasmic reticulum localisation, from the UniProt subcellular-location mapping and
      by similarity to mouse Nlrp3.
    action: KEEP_AS_NON_CORE
    reason: 'Traceable to the report that resting NLRP3 associates with ER structures and redistributes
      to perinuclear ER-mitochondria clusters on activation. Same status as the mitochondrial annotation:
      a real observation from the pre-dispersed-TGN era that is not part of the current activation
      model.'
    supported_by:
    - reference_id: PMID:21124315
      supporting_text: Resting NLRP3 localizes to endoplasmic reticulum structures, whereas on inflammasome
        activation both NLRP3 and its adaptor ASC redistribute to the perinuclear space where they
        co-localize with endoplasmic reticulum and mitochondria organelle clusters.
