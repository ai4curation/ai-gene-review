      not a catalytic output in its own right.
    supported_by:
    - reference_id: PMID:17483456
      supporting_text: We demonstrate that purified cryopyrin binds ATP, dATP, and ATP-agarose, but
        not CTP, GTP, or UTP, and exhibits ATPase activity.
- term:
