    label: detection of biotic stimulus
  evidence_type: IDA
  original_reference_id: PMID:18604214
  qualifier: involved_in
  review:
    summary: Detection of biotic stimulus, from the silica and aluminium salt study and from a review
      of NLR biology.
    action: KEEP_AS_NON_CORE
    reason: Two problems, neither fatal. The agonists in the cited experimental study - silica crystals
      and aluminium salts - are abiotic, so they cannot support a biotic-stimulus term; and the paper's
      own conclusion is that what is sensed is lysosomal damage, an endogenous event downstream of
      the particle. NLRP3 genuinely does respond to biotic stimuli such as pore-forming toxins and
      viral proteins, which is why this is retained rather than removed, but as a downstream and
      indirect participation rather than as detection in the strict sense.
    supported_by:
