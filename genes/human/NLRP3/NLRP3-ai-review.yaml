      inflammasome speck complex within a single cell.
  - reference_id: PMID:42215451
    supporting_text: 'nigericin, a K+-dependent NLRP3 stimulus, can trigger two distinct activation
      pathways: (i) the rapidly engaged decameric cage-dependent pathway; and (ii) a decameric cage-independent,
