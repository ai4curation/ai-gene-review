  evidence_type: NAS
  original_reference_id: PMID:29255148
  qualifier: involved_in
  review:
    summary: NLRP3 activation amplifies inflammation through caspase-1-dependent release of interleukin-1
      beta and interleukin-18 and through pyroptosis.
    action: ACCEPT
    reason: Core biological process, supported by nine annotations including the pharmacological
      demonstration that a selective NLRP3 inhibitor is anti-inflammatory in disease models.
- term:
    id: GO:0070269
    label: pyroptotic inflammatory response
  evidence_type: NAS
  original_reference_id: PMID:26611636
  qualifier: involved_in
  review:
    summary: NLRP3 inflammasome activation culminates in gasdermin-D-dependent pyroptosis.
    action: ACCEPT
