- description: 'The central NACHT domain binds and hydrolyses ATP, and the nucleotide state is the
    conformational switch of the protein: the resting oligomer is ADP-bound with the pyrin domains
    sequestered, while the active disc holds an ATP-bound NACHT whose subdomains have rotated by
    about 85 degrees. Nucleotide binding is required for caspase-1 activation and for the constitutive
    activity of disease-associated mutants, and the ATP-hydrolysis motif is where the clinical inhibitor
    MCC950 acts.'
