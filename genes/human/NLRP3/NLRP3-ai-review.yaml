- term:
    id: GO:0043565
    label: sequence-specific DNA binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: Sequence-specific DNA binding, inferred phylogenetically and by orthology from mouse
      Nlrp3, which was reported to bind the Il4 promoter in T helper 2 cells.
    action: KEEP_AS_NON_CORE
    reason: 'Surprising for an inflammasome sensor, and it deserves the scrutiny. Tracing it back:
      both the IBA (node PTN000648032, donor MGI:2653833) and the ISS (donor UniProtKB:Q8R4B8) rest
      on a single underlying result - Bruchard et al. 2015 reported that mouse Nlrp3 in CD4+ T cells
      binds the Il4 promoter and transactivates it with IRF4, independently of ASC and caspase-1.
      That is a real experimental claim, with a plausible molecular reading (the NACHT-LRR architecture
      is shared with the transcriptional activator CIITA), so it is not dismissed. But it is one
      laboratory, it carries a published corrigendum, no human experimental evidence exists, and
      no NLRP3 DNA-binding domain or NLRP3-DNA structure has been described in the decade since,
      despite intensive structural work on the protein. Kept as a non-core, cell-type-restricted,
      inflammasome-independent activity rather than accepted alongside the inflammasome functions
      or removed on grounds of surprise alone. The IBA is not challenged on propagation grounds:
      the node placement follows correctly from the mouse experimental annotation, so the question
      is the strength of that source, not the phylogeny.'
    additional_reference_ids:
    - PMID:26098997
    - PMID:26580508
