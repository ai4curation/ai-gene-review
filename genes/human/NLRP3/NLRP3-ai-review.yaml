- description: 'A conserved polybasic region of NLRP3 binds phosphatidylinositol-4-phosphate on the
    dispersed trans-Golgi network through ionic interaction, and this is what recruits and concentrates
    NLRP3 at the membrane scaffold on which it aggregates. It is the one well-established direct
    binding event in NLRP3 activation, and the reason the protein can respond to structurally unrelated
    agonists without binding any of them: diverse stimuli converge on trans-Golgi disassembly. Charge
    neutralisation of the same linker by BTK phosphorylation tunes the interaction.'
