    label: negative regulation of acute inflammatory response
  evidence_type: IMP
  original_reference_id: PMID:11687797
  qualifier: involved_in
  review:
    summary: Negative regulation of acute inflammatory response, annotated from the founding paper
      identifying CIAS1 mutations in familial cold autoinflammatory syndrome and Muckle-Wells syndrome.
    action: MODIFY
    reason: Same inverted direction. The mutations described are dominant gain-of-function alleles
