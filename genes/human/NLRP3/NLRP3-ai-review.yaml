- term:
    id: GO:0140299
    label: molecular sensor activity
  evidence_type: IDA
  original_reference_id: PMID:16407889
  qualifier: enables
  review:
    summary: NLRP3 assigned as a molecular sensor on the basis of inflammasome activation by uric
      acid and calcium pyrophosphate crystals, silica, asbestos and aluminium salts.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The biology is right but the term is not. GO:0140299 is defined as ''Binding to a molecule
      and eliciting a change in the protein''s activity in response to the intracellular level of
      that molecule'' - it requires that the sensed species be bound. No direct NLRP3 agonist ligand
      has ever been identified, and the three papers cited here argue the opposite of direct binding:
      Hornung et al. state that activation required phagocytosis of crystals leading to lysosomal
      damage and rupture, and conclude that NLRP3 senses lysosomal damage as an endogenous danger
      signal. The field position is that NLRP3 reads a shared downstream cellular perturbation -
      potassium efflux, trans-Golgi disassembly, organelle damage - common to structurally unrelated
      agonists. Flagged as over-annotated rather than removed, because these are experimental annotations
      recording real activation events and because one NLRP3 binding event does fit the definition:
      PtdIns4P on the dispersed TGN, which is separately and correctly annotated as GO:0070273.'
    supported_by:
    - reference_id: PMID:18604214
      supporting_text: NALP3 activation required phagocytosis of crystals, and this uptake subsequently
        led to lysosomal damage and rupture.
    - reference_id: PMID:18604214
      supporting_text: Our results indicate that the NALP3 inflammasome senses lysosomal damage as
        an endogenous 'danger' signal.
