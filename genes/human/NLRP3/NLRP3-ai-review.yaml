- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: The NACHT domain of NLRP3 hydrolyses ATP; MCC950 inhibits the inflammasome by targeting
      the ATP-hydrolysis motif.
    action: ACCEPT
    reason: Core enzymatic property of the NACHT module, demonstrated with purified protein and independently
      corroborated by two structure-guided studies of the MCC950 mechanism. This is the switch that
