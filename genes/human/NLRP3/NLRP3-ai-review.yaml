      exists and predominates in human neutrophils.'
    supported_by:
    - reference_id: PMID:28656979
      supporting_text: Here we show that microtubule-affinity regulating kinase 4 (MARK4) binds to
        NLRP3 and drives it to the microtubule-organizing centre, enabling the formation of one large
        inflammasome speck complex within a single cell.
    - reference_id: PMID:42378282
      supporting_text: Microtubules, priming, and NEK7 synergistically converge on PCM abundance,
        thereby creating a permissive centrosomal environment for NLRP3 condensation and inflammasome
        assembly.
