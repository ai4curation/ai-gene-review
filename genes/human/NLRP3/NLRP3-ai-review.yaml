- term:
    id: GO:0050728
    label: negative regulation of inflammatory response
  evidence_type: IMP
  original_reference_id: PMID:12483741
  qualifier: involved_in
  review:
    summary: Negative regulation of inflammatory response, annotated from three cryopyrin-associated
      periodic syndrome cohorts.
    action: MODIFY
    reason: 'Same directional problem as GO:0032691, and from the same class of evidence: patients
      carrying NLRP3 mutations have excessive, not deficient, inflammation, and two of the three
      cited studies are reports of clinical improvement on interleukin-1 receptor antagonism. GOA
      carries the positive term for this gene with nine annotations. One alternative reading is recorded
      for completeness: early work did report that wild-type cryopyrin suppresses NF-kappaB signalling,
      which could motivate a negative regulatory annotation - but that is captured separately by
      GO:1901223, and these three references are CAPS genotype-phenotype studies rather than NF-kappaB
      assays.'
    proposed_replacement_terms:
    - id: GO:0050729
      label: positive regulation of inflammatory response
