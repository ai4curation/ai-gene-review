- term:
    id: GO:0007231
    label: osmosensory signaling pathway
  evidence_type: NAS
  original_reference_id: PMID:22981536
  qualifier: involved_in
  review:
    summary: Osmosensory signalling, from the finding that a fall in extracellular osmolarity triggers
      a potassium-dependent conformational change in preassembled NLRP3 and activates caspase-1.
    action: KEEP_AS_NON_CORE
    reason: A real and mechanistically interesting result that fits the modern picture - cell swelling
      is one more perturbation converging on potassium efflux - but it is a stimulus context, and
      'osmosensory signaling pathway' overstates the specificity of a protein that responds to swelling
      only through the same common intermediate it uses for every other agonist.
    supported_by:
    - reference_id: PMID:22981536
      supporting_text: We found that a decrease in extracellular osmolarity induced a K(+)-dependent
        conformational change of the preassembled NLRP3-inactive inflammasome during cell swelling,
        followed by activation of the NLRP3 inflammasome and caspase-1, which was controlled by transient
        receptor potential channels during RVD.
