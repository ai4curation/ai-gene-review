- term:
    id: GO:0043531
    label: ADP binding
  evidence_type: IDA
  original_reference_id: PMID:35114687
  qualifier: enables
  review:
    summary: The inactive NLRP3 oligomer is ADP-bound; the ADP-to-ATP exchange at the NACHT domain
      is the conformational switch that licenses activation.
    action: ACCEPT
    reason: 'Established by two independent cryo-EM structures of full-length inactive human NLRP3.
      Not a trivial nucleotide-binding annotation: which nucleotide is bound defines the resting
      versus active state, and it is the site where the clinical inhibitor MCC950 acts.'
    supported_by:
    - reference_id: PMID:35114687
      supporting_text: Inactive, ADP-bound NLRP3 is a decamer composed of homodimers of intertwined
        leucine-rich repeat (LRR) domains that assemble back-to-back as pentamers.
    - reference_id: PMID:35254907
      supporting_text: The inactive NLRP3 oligomer represents the NLRP3 resting state, capable of
        binding to membranes and is likely disrupted for its activation.
