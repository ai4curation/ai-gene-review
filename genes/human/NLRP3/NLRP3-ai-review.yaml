- term:
    id: GO:0051260
    label: protein homooligomerization
  evidence_type: IDA
  original_reference_id: PMID:35114687
  qualifier: involved_in
  review:
    summary: NLRP3 homo-oligomerises, both into the inactive cage and into the active disc and pyrin
      filament.
    action: ACCEPT
    reason: 'Core, and the direct process counterpart of the self-association activity. Note for
      context, not as a reason to change the term: the oligomeric state of resting NLRP3 is itself
      contested - one cryo-EM study describes a decamer and another a dodecamer - and a 2026 study
      shows that low-molecular-weight, non-cage NLRP3 species can form functional inflammasomes through
      a trans-Golgi/MTOC-distal route that dominates in human neutrophils.'
