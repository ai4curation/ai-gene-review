- term:
    id: GO:0044546
    label: NLRP3 inflammasome complex assembly
  evidence_type: IDA
  original_reference_id: PMID:17483456
  qualifier: involved_in
  review:
    summary: NLRP3 nucleates assembly of its own inflammasome, the process on which every other NLRP3
      function depends.
    action: ACCEPT
    reason: Core biological process, carried by nineteen annotations spanning structural biology,
      trafficking, phosphoregulation and pharmacology. The unresolved questions in the 2026 literature
      concern where and in what oligomeric state assembly happens, not whether NLRP3 drives it.
    supported_by:
    - reference_id: PMID:31189953
      supporting_text: These data suggest that NEK7 bridges adjacent NLRP3 subunits with bipartite
        interactions to mediate the activation of the NLRP3 inflammasome.
    - reference_id: PMID:39173637
      supporting_text: This dynamic trafficking culminates in the localization of NLRP3 to the MTOC,
        where LATS1/2, pre-recruited to MTOC during priming, phosphorylates NLRP3 to further facilitate
        its interaction with NIMA-related kinase 7 (NEK7), ultimately leading to full NLRP3 activation.
