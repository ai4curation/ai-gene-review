      that dominates in human neutrophils.'
proposed_new_terms:
- proposed_name: inflammasome sensor activity
  proposed_definition: The activity of a protein that detects a perturbation of cytoplasmic or organellar
    homeostasis - for example ion flux, membrane or organelle damage, or a change in a compartment's
    identity - and responds by changing conformation and nucleating assembly of an inflammasome.
    Unlike molecular sensor activity, this function does not require the protein to bind the agonist
    or the sensed species.
  justification: 'GO:0140299 molecular sensor activity is defined as binding a molecule and responding
    to its intracellular level, and is therefore inapplicable to NLRP3, which is activated by structurally
    unrelated agonists - crystals, pore-forming toxins, extracellular ATP, cell swelling - that it
    does not bind, via shared downstream perturbations such as potassium efflux and trans-Golgi disassembly.
    Curators are left choosing between a term that asserts a ligand that does not exist and no molecular-function
    term at all. The gap is general: NLRP1, NLRP6, NLRC4 and pyrin present the same problem.'
  proposed_parent:
    id: GO:0038187
    label: pattern recognition receptor activity
  supported_by:
  - reference_id: PMID:30487600
    supporting_text: These results indicate that recruitment of NLRP3 to dTGN is an early and common
      cellular event that leads to NLRP3 aggregation and activation in response to diverse stimuli.
  - reference_id: PMID:18604214
    supporting_text: Our results indicate that the NALP3 inflammasome senses lysosomal damage as
      an endogenous 'danger' signal.
suggested_questions:
- question: Is NEK7 required for NLRP3 activation, and under what conditions? The 2026 PNAS study
    reports that elevated NLRP3 expression renders K+-efflux-driven activation independent of both
    NEK7 and priming, while only partially bypassing NEK7 for imiquimod; the 2026 Nature Communications
    study describes a cage-independent, MTOC-distal pathway in which the structural basis of NEK7
    engagement is unclear because NEK7 cannot bind the inactive oligomer. Are these two descriptions
    of one abundance-threshold phenomenon, or genuinely different pathways?
- question: What is the resting oligomeric state of NLRP3 in cells? Cryo-EM has yielded a decamer
    and a dodecamer for the same inactive species, and a 2026 study shows that low-molecular-weight
    non-cage species are competent to form inflammasomes and predominate in human neutrophils. Is
    the cage a storage form whose disassembly is required, an obligate intermediate, or one of several
    interchangeable resting states?
- question: Should NLRP3 carry any ligand-binding molecular function at all? No direct agonist has
    been identified, PtdIns4P is the only well-established direct binding partner, and GO:0140299
    molecular sensor activity presupposes a bound ligand. Would the field support a molecular function
    for inflammasome sensors that is explicitly not ligand-based?
- question: Does human NLRP3 have a nuclear, transcriptional role? The claim that NLRP3 binds the
    Il4 promoter and transactivates it with IRF4 in T helper 2 cells rests on a single mouse study
    from 2015, carries a corrigendum, and has never been reproduced in human cells or given a structural
    basis - yet it is the sole source of six current human annotations propagated by IBA and ISS.
    Is there unpublished replication, or should these be retired?
- question: Why do the cryopyrin-associated periodic syndrome cohort papers support negative-regulation
    annotations for interleukin-1 beta production and inflammatory response, when the mutations concerned
    are gain-of-function and the patients respond to interleukin-1 blockade? Is this a systematic
    sign error in the annotations, or does it record an intended reading that is not recoverable
    from the text?
- question: Does NLRP3 regulate NF-kappaB, and in which direction? GOA carries both positive and
    negative regulation of non-canonical NF-kappaB signalling, each from overexpression-based reporter
    assays of the early 2000s. Has either been tested at endogenous expression levels?
suggested_experiments:
- hypothesis: The cage-dependent and MTOC-distal activation routes are distinguished by NLRP3 concentration
    rather than by cell type, and NEK7 dependence tracks with the route rather than with the stimulus.
  description: Place NLRP3 under a titratable degron-plus-inducible-promoter system in NEK7-null
    and NEK7-competent human macrophages and neutrophil-like cells, and scan expression across two
    orders of magnitude. At each level, measure the decamer-to-low-molecular-weight ratio by native
    gradient fractionation and mass photometry, score speck position relative to the pericentriolar
    material by live imaging, and read out caspase-1 activation for nigericin (K+-dependent) and
    imiquimod (K+-independent) in parallel. If abundance alone moves cells between the two routes,
    the two 2026 papers are describing one threshold phenomenon.
- hypothesis: NLRP3 requires no agonist-specific binding event; a single common membrane or ionic
    perturbation is sufficient for activation.
  description: In cells expressing a NLRP3 conformational FRET reporter, impose candidate common
    intermediates one at a time in the absence of any agonist - controlled K+ efflux via a selective
    ionophore at defined concentration, acute PtdIns4P depletion or forced dTGN dispersal by rapamycin-inducible
    phosphatase recruitment, and selective lysosomal permeabilisation - and ask which are individually
    sufficient. Combine with photo-crosslinking mass spectrometry from NLRP3 under each condition
    to look, without prior hypothesis, for any small molecule or lipid that becomes bound.
- hypothesis: Human NLRP3 does not act as a sequence-specific DNA-binding transcriptional cofactor.
  description: In primary human CD4+ T cells differentiated to a T helper 2 phenotype, perform CUT&RUN
    and ChIP-seq for endogenous, epitope-tagged NLRP3 alongside IRF4, with NLRP3-knockout cells as
    the specificity control, and test IL4 locus output after acute NLRP3 degradation. Complement
    with in vitro binding of purified full-length NLRP3 to the IL4 promoter by EMSA and fluorescence
    anisotropy. A clean negative in human cells would justify retiring six propagated annotations;
    a positive would supply the human evidence the claim has lacked for a decade.
- hypothesis: Condensate formation at the pericentriolar material is required for a distinct, high-magnitude
    mode of NLRP3 signalling and not merely a consequence of local concentration.
  description: Use optogenetic clustering to nucleate NLRP3 condensates at defined subcellular positions
    - centrosome, dispersed TGN, or a neutral cytosolic anchor - in the absence of any inflammasome
    stimulus, and measure ASC speck formation, caspase-1 activity and interleukin-1 beta release
    from each position. Pair with in vitro reconstitution of NLRP3 condensates from purified components
    to establish which partners are needed for the material properties, and test whether pericentriolar-material
    scaffolding proteins alter the threshold.
