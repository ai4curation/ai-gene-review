    label: signaling adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:35114687
  qualifier: enables
  review:
    summary: 'NLRP3 acts as a signalling adaptor: its pyrin domain filament nucleates ASC polymerisation,
      which in turn recruits procaspase-1.'
    action: ACCEPT
    reason: Core molecular function and the mechanistic heart of inflammasome assembly. Supported
      by NMR and analytical ultracentrifugation of the NLRP3-ASC pyrin-domain interaction, by cryo-EM
      of the NLRP3 pyrin-domain filament showing directional ASC elongation, and by the active-disc
      structure.
    supported_by:
    - reference_id: PMID:35559676
      supporting_text: Coupling a titration polymerization assay to cryo-EM, we demonstrate that
        ASC adaptor protein elongation on NLRP3PYD nucleation seeds is unidirectional, associating
        exclusively to the B-end of the filament.
    - reference_id: PMID:36442502
      supporting_text: The N-terminal PYDs from all NLRP3 subunits combine to form a PYD filament
        that recruits ASC PYD to elicit downstream signalling.
