- term:
    id: GO:0035591
    label: signaling adaptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: 'NLRP3 acts as a signalling adaptor: its pyrin domain filament nucleates ASC polymerisation,
      which in turn recruits procaspase-1.'
    action: ACCEPT
    reason: Core molecular function and the mechanistic heart of inflammasome assembly. Supported
      by NMR and analytical ultracentrifugation of the NLRP3-ASC pyrin-domain interaction, by cryo-EM
