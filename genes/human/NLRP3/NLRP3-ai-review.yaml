      structure.
    supported_by:
    - reference_id: PMID:35559676
      supporting_text: Coupling a titration polymerization assay to cryo-EM, we demonstrate that
        ASC adaptor protein elongation on NLRP3PYD nucleation seeds is unidirectional, associating
        exclusively to the B-end of the filament.
    - reference_id: PMID:36442502
      supporting_text: The N-terminal PYDs from all NLRP3 subunits combine to form a PYD filament
        that recruits ASC PYD to elicit downstream signalling.
- term:
    id: GO:0044546
    label: NLRP3 inflammasome complex assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: NLRP3 nucleates assembly of its own inflammasome, the process on which every other NLRP3
      function depends.
    action: ACCEPT
    reason: Core biological process, carried by nineteen annotations spanning structural biology,
      trafficking, phosphoregulation and pharmacology. The unresolved questions in the 2026 literature
