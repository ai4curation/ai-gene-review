- term:
    id: GO:0032691
    label: negative regulation of interleukin-1 beta production
  evidence_type: IMP
  original_reference_id: PMID:12483741
  qualifier: involved_in
  review:
    summary: Negative regulation of interleukin-1 beta production, annotated from patients with neonatal-onset
      multisystem inflammatory disease carrying de novo CIAS1 mutations.
    action: MODIFY
    reason: 'The direction is inverted relative to the biology of the mutations described. CAPS-associated
      NLRP3 mutations, including the NOMID mutations in this study, are gain-of-function: they cause
      constitutive inflammasome activity and excess interleukin-1 beta, which is why interleukin-1
      blockade is effective. GOA already carries the positive term with thirteen independent annotations
      including an IMP. Proposed as a correction of sign rather than a removal, since the underlying
      patient data are sound and it is only the direction of the inference that is at issue.'
    proposed_replacement_terms:
