- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:23582325
  qualifier: enables
  review:
    summary: 'NLRP3 self-associates: into the autoinhibited resting cage and, on activation, into
      the NACHT-mediated disc and the pyrin-domain filament.'
    action: ACCEPT
    reason: 'Unlike bare protein binding, homotypic self-association is the mechanism here rather
      than an incidental interaction, and it is resolved at near-atomic detail in three cryo-EM structures.
      Note for context, not as a reason to change the term: the oligomeric state of resting NLRP3
      is itself contested - one cryo-EM study describes a decamer and another a dodecamer - and a
      2026 study shows that low-molecular-weight, non-cage NLRP3 species can form functional inflammasomes
      through a trans-Golgi/MTOC-distal route that dominates in human neutrophils.'
