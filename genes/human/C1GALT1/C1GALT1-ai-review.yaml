- term:
    id: GO:0001525
    label: angiogenesis
  evidence_type: IMP
  original_reference_id: PMID:17228361
  qualifier: involved_in
  review:
    summary: >-
      The cited reference is a case-control study of 670 IgA nephropathy patients
      and 494 controls that genotyped five SNPs in C1GALT1 and reported haplotype
      frequency differences. It contains no angiogenesis experiment and no mutant
      phenotype in the usual sense; the inference is from disease-susceptibility
      genetics. Vascular consequences of losing core 1 O-glycans are independently
      reported in the mouse literature, so the term is not biologically absurd,
      but it is downstream physiology rather than something this enzyme does.
    action: KEEP_AS_NON_CORE
    reason: >-
      Keep as a plausible downstream, pleiotropic consequence of losing core 1
      O-glycans on vascular glycoproteins, not as a core function. C1GALT1's
      molecular role is a single galactosyl transfer in the Golgi; every tissue
      phenotype that follows from losing that transfer is a consequence of altered
      glycan structures on other proteins. The supporting reference does not
      demonstrate participation in angiogenesis, which is recorded in its
      reference_review.
    supported_by:
    - reference_id: PMID:17228361
      supporting_text: >-
        The present study suggested that the polymorphisms of C1GALT1 gene were
        associated with the genetic susceptibility to IgAN in Chinese population
- term:
    id: GO:0001822
    label: kidney development
  evidence_type: IMP
  original_reference_id: PMID:17228361
  qualifier: involved_in
  review:
    summary: >-
      Drawn from the same IgA nephropathy association study. IgA nephropathy is an
      acquired adult glomerular disease driven by deposition of
      galactose-deficient IgA1 immune complexes; susceptibility to it is not
      evidence of participation in kidney development.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This term overreaches in a way the angiogenesis row does not. There is no
      developmental phenotype at issue: the association is with a disease of the
      mature kidney, and the mechanism runs through under-galactosylated IgA1
      produced by plasma cells, not through renal morphogenesis. Reading a
      developmental process term out of a susceptibility association conflates the
      organ affected by a disease with the organ's formation.
    supported_by:
    - reference_id: PMID:17228361
      supporting_text: >-
        A case-control association study was performed
