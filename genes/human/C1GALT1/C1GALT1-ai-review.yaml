- term:
    id: GO:0016266
    label: protein O-linked glycosylation via N-acetylgalactosamine
  evidence_type: IDA
  original_reference_id: PMID:11677243
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. C1GALT1 has no mucin-type O-glycosylation process
      annotation at all in GOA: its only two biological-process rows are
      angiogenesis and kidney development, both from a SNP association study. The
      enzyme that performs the committed galactosylation step of the pathway is
      therefore absent from the pathway's own process term.
    action: NEW
    reason: >-
      The participation test is met directly rather than by necessity: C1GALT1
      itself catalyses a step of this process, transferring galactose onto the
      protein-linked alpha-GalNAc, and the term's definition explicitly covers the
      GalNAc-initiated glycan "further elongated with the sequential addition of"
      residues. The comparator check confirms this is a gap rather than a
      convention: the enzyme immediately upstream (GALNT1) carries GO:0016266, the
      enzyme immediately downstream (GCNT1) carries GO:0016266, and even this
      gene's own non-catalytic chaperone (C1GALT1C1) carries the parent term
      GO:0006493 three times. A pathway in which the initiating enzyme, the
      branching enzyme and a chaperone are annotated to the process but the
      committed enzyme is not reflects an omission, not a deliberate curatorial
      line. The direct assay in PMID:11677243 confirmed that the product formed on
      a Thr-linked GalNAc glycopeptide has the core 1 structure, which is this
      process.
    supported_by:
    - reference_id: PMID:11677243
      supporting_text: >-
        generated core 1 beta3-Gal-T activity that transferred galactose from
        UDP-Gal to GalNAcalpha1-O-phenyl
    - reference_id: PMID:11677243
      supporting_text: >-
        The common core 1 O-glycan structure Galbeta1--> 3GalNAc-R is the precursor
        for many extended mucin-type O-glycan structures in animal cell surface and
        secreted glycoproteins
