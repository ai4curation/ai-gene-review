gene_symbol: C1GALT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  C1GALT1 (core 1 beta-1,3-galactosyltransferase, T-synthase; EC 2.4.1.122) is a
  Golgi-resident, single-pass type II membrane glycosyltransferase that catalyses
  the committed step of mucin-type O-glycan elongation. It transfers galactose
  from UDP-galactose in a beta-1,3 linkage onto the alpha-linked
  N-acetylgalactosamine that polypeptide GalNAc-transferases have already
  attached to serine or threonine, converting the truncated Tn antigen
  (GalNAc-alpha1-O-Ser/Thr) into the core 1 disaccharide
  Gal-beta1-3-GalNAc-alpha1-O-Ser/Thr, known as the T antigen. Core 1 is the
  precursor from which most extended mucin-type O-glycans are built, including
  the core 2 branch and the sialylated and fucosylated structures that serve as
  selectin ligands, so this single enzyme controls the fate of the great majority
  of O-glycans on cell-surface and secreted glycoproteins. Unusually among
  glycosyltransferases, its folding depends absolutely on one dedicated
  endoplasmic reticulum chaperone, Cosmc (C1GALT1C1); without Cosmc the enzyme
  misfolds and no activity is produced. The enzyme is widely expressed, most
  strongly in kidney, heart, placenta and liver, and orthologues are present
  across metazoans including Drosophila and C. elegans. Loss of core 1 O-glycans
  exposes the Tn antigen and is associated with ulcerative colitis, Tn syndrome,
  and the galactose-deficient IgA1 that initiates IgA nephropathy.
