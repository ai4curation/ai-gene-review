core_functions:
- description: >-
    C1GALT1 catalyses the committed step of mucin-type O-glycan elongation,
    transferring galactose from UDP-galactose in a beta-1,3 linkage onto the
    alpha-GalNAc that polypeptide GalNAc-transferases have attached to serine or
    threonine, to form the core 1 disaccharide (T antigen). It acts as a type II
    membrane enzyme in the Golgi, and its activity determines whether O-glycans
    remain as the truncated Tn antigen or are elaborated into core 1-derived
    extended structures. Attaining this active state requires co-translational
    folding by its dedicated ER chaperone Cosmc.
