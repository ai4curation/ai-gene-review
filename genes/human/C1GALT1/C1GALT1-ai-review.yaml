      to GalNAcalpha1-O-phenyl
  - reference_id: PMID:37216524
    supporting_text: >-
      requires the action of a single Golgi enzyme T-synthase (encoded by C1GALT1)
suggested_questions:
- question: >-
    Why does C1GALT1 carry no mucin-type O-glycosylation biological-process
    annotation in GOA, when the enzyme upstream of it, the enzyme downstream of it
    and its own chaperone all do? If this is an intentional curatorial position
    rather than an omission, the reasoning would be worth recording, because the
    committed enzyme of a pathway being absent from that pathway's process term is
    a pattern that would mislead any pathway-completeness analysis.
- question: >-
    Are the angiogenesis and kidney development annotations on this gene intended
    to be supported by the cited association study, or were they meant to cite the
    mouse conditional-knockout literature on core 1 O-glycan loss? The evidence
    code (IMP) fits the latter but the reference is the former.
suggested_experiments:
- description: >-
    Glycoproteomic comparison of C1GALT1-null and Cosmc-null cells to establish
    how much of the O-glycoproteome depends on the T-synthase specifically, which
    would quantify how much downstream physiology should be attributed to this
    single enzyme rather than to the pathway as a whole.
- description: >-
    Endothelium-restricted C1GALT1 deletion with direct vascular readouts, to test
    whether the angiogenesis annotation reflects a cell-autonomous requirement for
    core 1 O-glycans in endothelial cells rather than a systemic consequence.
