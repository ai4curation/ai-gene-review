  review:
    summary: >-
      The partner is Q96EU7, Cosmc, the dedicated folding chaperone for this
      enzyme. The cited paper shows in a cell-free translation system that Cosmc
      must be present during C1GalT translation for active enzyme to be produced.
      From C1GALT1's side, this is the interaction of a client with its chaperone,
      which GO can express specifically.
    action: MODIFY
    reason: >-
      Generic protein binding conveys no functional information, but here the
      cited publication supports a specific molecular function term for the
      client side of the interaction. GO:0051087 protein-folding chaperone binding
      is defined as binding to a chaperone protein, which is exactly what is
      demonstrated. The reciprocal annotation on Cosmc should carry the chaperone
      activity itself.
    proposed_replacement_terms:
