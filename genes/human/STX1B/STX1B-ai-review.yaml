  review:
    summary: Regulation of gene expression, transferred from mouse Stx1 titration experiments.
    action: MARK_AS_OVER_ANNOTATED
    reason: Syntaxin-1B has no known role in regulating gene expression. The source study used hypomorphic
      Stx1b expression and RNAi to titrate syntaxin-1 levels; altered syntaxin-1 protein levels are an
      experimental manipulation, not a function of the gene product. Loss of syntaxin-1 does reduce Munc18-1
      protein, but that reflects mutual stabilization, not regulation of expression.
