id: P61266
gene_symbol: STX1B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Syntaxin-1B is a neuronal Qa-SNARE (t-SNARE) anchored in the presynaptic plasma membrane by a C-terminal
  transmembrane segment (tail-anchored, type IV topology). Its cytoplasmic region contains a short N-terminal peptide,
  a three-helix Habc domain that folds back onto the SNARE motif to give a closed conformation bound by Munc18-1
  (STXBP1), and the H3 SNARE motif, which supplies the Qa helix of the four-helix neuronal SNARE bundle with SNAP-25
  (Qb and Qc) and synaptobrevin-2/VAMP2 (R). Zippering of this bundle drives fusion of synaptic vesicles with the
  active-zone plasma membrane, and syntaxin-1 is also required for vesicle docking and priming; the switch between
  the closed and open conformations gates the initiation of fusion. Syntaxin-1B is partly redundant with syntaxin-1A,
  but in mice it is the paralog required for postnatal survival, normal spontaneous and evoked release and readily
  releasable pool size at central synapses, and efficient transmission at the neuromuscular junction; loss of both
  paralogs abolishes fusion-competent vesicles and compromises neuronal viability. Heterozygous loss-of-function
  and missense variants in human STX1B cause fever-associated epilepsy syndromes (GEFS+ type 9). An alternatively
  spliced human isoform lacking the transmembrane anchor (STX1B-DeltaTMD) localizes to the nucleus and the pericentrosomal
  spindle region; its function is unknown.'
