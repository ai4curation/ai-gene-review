  review:
    summary: SNARE binding; syntaxin-1B binds its cognate SNAREs SNAP-25 and VAMP2 to form the fusion complex.
    action: ACCEPT
    reason: Binding to the cognate SNAREs is how syntaxin-1B assembles the trans-SNARE complex, and SNARE
      binding is as specific as the claim warrants for a protein whose partners are both a Qbc- and an
      R-SNARE. Interaction screens of the human protein recover VAMP1/2 and other SNAREs. Accepted for
      consistency with the unc-64 and STXBP1 reviews; the fusogenic activity (GO:0005484) remains the primary
      MF.
    supported_by:
    - reference_id: PMID:38225382
      supporting_text: STX1B-VAMP2
- term:
    id: GO:0001956
    label: positive regulation of neurotransmitter secretion
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P61264
  - ensembl:ENSMUSP00000101874
  review:
    summary: Positive regulation of neurotransmitter secretion, transferred from mouse Stx1 titration (IGI).
    action: MODIFY
    reason: Syntaxin-1 is a core component of the release machinery rather than a regulator of it; graded loss
      reduces release because the fusion machinery itself is depleted. The claim is better stated as direct
      involvement in synaptic vesicle exocytosis, consistent with how the STXBP1 review treated
      regulation-of-priming terms.
    proposed_replacement_terms:
    - id: GO:0016079
      label: synaptic vesicle exocytosis
    supported_by:
    - reference_id: PMID:24133272
      supporting_text: overall release efficiency of affected neurons was severely impaired
