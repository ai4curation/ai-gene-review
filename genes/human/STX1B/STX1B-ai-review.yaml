  review:
    summary: SNARE (SNAP receptor) fusogenic activity of the syntaxin-1B Qa-SNARE motif.
    action: ACCEPT
    reason: 'This is the core molecular function of syntaxin-1B: its H3 SNARE motif supplies the Qa helix of the
      neuronal SNARE complex whose zippering drives synaptic vesicle fusion. Mouse genetics shows syntaxin-1B acts
      as a neuronal t-SNARE and that complete SNARE complex formation is required for fusion. The IBA (PAINT node
      over syntaxins) and the InterPro-based IEA make the same claim and are both accepted.'
    supported_by:
    - reference_id: PMID:24587181
      supporting_text: STX1A and 1B share a basic function as neuronal t-SNAREs
    - reference_id: PMID:27466336
      supporting_text: complete SNARE complex formation is required for vesicle fusion and priming
    - reference_id: file:human/STX1B/STX1B-deep-research-claude-code.md
      supporting_text: its molecular function is SNAP receptor (SNARE) activity
