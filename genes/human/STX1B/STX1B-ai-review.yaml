    supporting_text: loss of Stx1 completely abolished fusion-competent vesicles and severely impaired vesicle
      docking
  - reference_id: PMID:27466336
    supporting_text: Putative partial SNARE complex assembly with the SNARE motif mutant Stx1A(AV) (A240V,
