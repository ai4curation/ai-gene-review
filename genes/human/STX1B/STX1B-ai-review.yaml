core_functions:
- description: Presynaptic plasma-membrane Qa-SNARE that contributes the syntaxin helix to the trans-SNARE
    complex with SNAP-25 and VAMP2; zippering of this complex drives fusion of synaptic vesicles with the
    active-zone membrane in spontaneous and Ca2+-evoked neurotransmitter release, and full SNARE assembly is
    also needed to prime vesicles into the readily releasable pool.
  molecular_function:
    id: GO:0005484
    label: helical-bundle zippering fusogenic activity
  directly_involved_in:
  - id: GO:0031629
    label: synaptic vesicle fusion to presynaptic active zone membrane
  - id: GO:0016082
    label: synaptic vesicle priming
  - id: GO:0016079
    label: synaptic vesicle exocytosis
  locations:
  - id: GO:0048787
    label: presynaptic active zone membrane
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0031201
    label: SNARE complex
  supported_by:
  - reference_id: PMID:24587181
    supporting_text: STX1A and 1B share a basic function as neuronal t-SNAREs
  - reference_id: PMID:27466336
    supporting_text: complete SNARE complex formation is required for vesicle fusion and priming
  - reference_id: PMID:18703708
    supporting_text: Although SNARE complexes containing open syntaxin-1 and Munc18-1 are essential for
      exocytosis
  - reference_id: PMID:24133272
    supporting_text: overall release efficiency of affected neurons was severely impaired, as demonstrated by
      a smaller readily releasable pool size, slower refilling rate of primed vesicles, and lower release
      probability
- description: Required at the plasma membrane for docking of synaptic vesicles (and, as shown with an open
    syntaxin-1B mutant, of chromaffin granules); partial SNARE assembly suffices for docking, which is
    separable from the fusion step.
  molecular_function:
    id: GO:0160321
