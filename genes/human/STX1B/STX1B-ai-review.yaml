suggested_questions:
- question: Which features of syntaxin-1B, as opposed to syntaxin-1A, make it indispensable for postnatal
    survival and normal readily releasable pool size in mice, given that the two paralogs share the same SNARE
    motif function?
- question: How do the GEFS+ type 9 missense variants in STX1B change the closed/open conformational
    equilibrium or Munc18-1 binding, and why is the resulting seizure phenotype temperature-sensitive?
- question: Does the nuclear STX1B-DeltaTMD splice isoform have a function at the nuclear lamina or mitotic
    spindle, or is it a non-functional splicing product?
suggested_experiments:
- description: Express STX1B and STX1A individually in Stx1a/Stx1b double-knockout neurons at matched levels
    and compare readily releasable pool size, release probability and Munc18-1 levels, to separate
    expression-level effects from paralog-specific properties.
- description: Introduce GEFS+ STX1B missense variants into Stx1b-null neurons and measure spontaneous GABA
    release and evoked release at physiological and febrile temperatures.
- description: Deplete the STX1B-DeltaTMD isoform specifically (splice-switching oligonucleotide) in a human
    cell line that expresses it and assess nuclear envelope and mitotic spindle phenotypes.
