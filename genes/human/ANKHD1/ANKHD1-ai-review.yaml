  qualifier: involved_in
  review:
    summary: Proposed. ANKHD1/MASK1 is a YAP-TEAD cofactor required for full expression of YAP target
      genes.
    action: NEW
    reason: 'Knocking down MASK1 (ANKHD1) in HEK293T cells lowers YAP target-gene expression while leaving
      non-targets unchanged [PMID:23333314 "We found that the expression of the YAP target genes CTGF,
      ANKRD1, FN1, CYR61 were significantly reduced while non-target genes such as KRAS, NRAS and MYC,
      as well as YAP and TAZ themselves, were not affected"]. ANKHD1 does part of the work: it is in the
      YAP-TEAD complex [PMID:23333314 "The human Mask homolog MASK1 complexes with YAP and is required
      for the full activity of YAP."] [PMID:23333314 "In addition, we found that immunoprecipitation of
      MASK1 also co-purified endogenous TEAD3"], as fly Mask is on target promoters with Yorkie and Scalloped
      [PMID:23333315 "We show that Drosophila Mask forms a complex with Yki and its binding partner, Scalloped
      (Sd), on target-gene promoters and is essential for Yki to drive transcription of target genes and
      tissue growth."]. Comparator: fly Mask carries GO:0045944 by IGI from the same pair of papers. Nothing
      in the existing ANKHD1 annotations is an ancestor or descendant of this term.'
    supported_by:
    - reference_id: PMID:23333314
      supporting_text: We found that the expression of the YAP target genes CTGF, ANKRD1, FN1, CYR61 were
        significantly reduced while non-target genes such as KRAS, NRAS and MYC, as well as YAP and TAZ
        themselves, were not affected
    - reference_id: PMID:23333314
      supporting_text: The human Mask homolog MASK1 complexes with YAP and is required for the full activity
        of YAP.
    - reference_id: PMID:23333314
      supporting_text: In addition, we found that immunoprecipitation of MASK1 also co-purified endogenous
        TEAD3
    - reference_id: PMID:23333315
      supporting_text: We show that Drosophila Mask forms a complex with Yki and its binding partner,
        Scalloped (Sd), on target-gene promoters and is essential for Yki to drive transcription of target
        genes and tissue growth.
