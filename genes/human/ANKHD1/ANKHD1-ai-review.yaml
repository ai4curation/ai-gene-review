taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ANKHD1 (ankyrin repeat and KH domain-containing protein 1, MASK1) is a large protein with
  two blocks of ankyrin repeats and a C-terminal KH RNA-binding domain. It is one of two human homologs
  of Drosophila Mask, with its paralog ANKRD17 (MASK2). Like fly Mask, ANKHD1 is a cofactor of the Hippo-pathway
  effector YAP: it forms a complex with YAP and TEAD and is needed for full expression of YAP target genes.
  It is mainly cytoplasmic but shuttles into the nucleus, and it binds RNA. It is overexpressed in several
  cancers, where it promotes proliferation.'
