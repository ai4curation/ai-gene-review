suggested_questions:
- question: Does ANKHD1 promote YAP activity in the nucleus on chromatin, or in the cytoplasm by stabilizing
    YAP-TEAD assembly? And does its KH domain bind RNA as part of that role?
suggested_experiments:
- description: ChIP ANKHD1 at YAP-TEAD target promoters, and test whether KH-domain mutants still support
    YAP target-gene expression.
