    label: host-mediated suppression of viral transcription
  evidence_type: IDA
  original_reference_id: PMID:10841574
  qualifier: involved_in
  review:
    summary: Annotation from the HIV-2/HIV-1 cross-protection study; peripheral blood mononuclear cells
      from HIV-2-infected subjects resisted CCR5-dependent HIV-1 challenge, resistance correlated with
      beta-chemokine levels and was abrogated by anti-beta-chemokine antibodies. The same term was assigned
      from this paper to CCL3 and CCL5.
