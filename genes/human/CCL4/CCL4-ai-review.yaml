id: P13236
gene_symbol: CCL4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CCL4 (MIP-1-beta, ACT-2, LAG-1) is a small secreted CC chemokine produced by activated T
  lymphocytes, monocytes/macrophages, NK cells, dendritic cells and other leukocytes. It is synthesized
  as a 92-residue precursor with a signal peptide; after secretion the N-terminal two residues are frequently
  removed to give MIP-1-beta(3-69), which is the predominant natural form. The mature protein adopts the
  canonical chemokine fold, forms homodimers and heterodimers with CCL3/MIP-1-alpha, and reversibly polymerizes
  into rod-shaped double-helical polymers that bury the receptor-binding surface and protect the chemokine
  from proteolysis, thereby shaping the chemotactic gradient. Its principal receptor is CCR5, a Gi-coupled
  GPCR: ligand binding triggers calcium mobilization, cytoskeletal polarization and directed migration
  of CCR5-bearing cells, chiefly monocytes/macrophages, effector and memory T cells, NK cells and immature
  dendritic cells, and also drives rapid internalization and down-modulation of the receptor. The naturally
  truncated MIP-1-beta(3-69) broadens receptor usage to CCR1 and CCR2 isoform B. CCL4 is a central mediator
  of the inflammatory response, recruiting leukocytes to sites of infection and tissue damage and promoting
  leukocyte adhesion and NK-target cell interactions. Because it occupies and down-regulates CCR5, CCL4
  is also one of the three major HIV-suppressive factors released by CD8+ T cells and restricts entry
  of R5-tropic HIV-1 into target cells. Reported ligand activity at CCR8 was not reproduced and is not
  considered established.'
