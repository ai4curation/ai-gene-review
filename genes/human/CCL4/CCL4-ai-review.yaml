    summary: Binary yeast two-hybrid interaction between CCL4 and SLC30A2 (Q9BRI3), reported by a CCSB
      proteome-scale interactome screen. No follow-up study links the two proteins functionally.
    action: REMOVE
    reason: 'Generic protein binding carries no functional information, so the annotation is uninformative
      rather than wrong; removal is not a claim that the reported interaction is false. No more specific
      molecular function can be derived from a screen hit: SLC30A2 is an intracellular or integral-membrane
      protein with no known role in chemokine biology, whereas CCL4 is a secreted CCR5 agonist, so there
      is no biological context for the pair. CCL4''s informative binding activities are already captured
      by GO:0031730 CCR5 chemokine receptor binding and GO:0048020 CCR chemokine receptor binding.'
