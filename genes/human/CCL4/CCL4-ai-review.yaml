  evidence_type: TAS
  original_reference_id: PMID:2462251
  qualifier: enables
  review:
    summary: Original Act-2 cloning paper showing that this activation-induced gene encodes a secreted
      product proposed to be a cytokine. CCL4 is a chemokine, a subclass of cytokines.
    action: ACCEPT
    reason: Cytokine activity is a correct, if general, parent of chemokine activity (GO:0008009), which
      is also annotated and is the core term.
    supported_by:
    - reference_id: PMID:2462251
      supporting_text: It is therefore possible that Act-2 represents a newly discovered cytokine.
    - reference_id: file:human/CCL4/CCL4-uniprot.txt
      supporting_text: Monokine with inflammatory and chemokinetic properties.
