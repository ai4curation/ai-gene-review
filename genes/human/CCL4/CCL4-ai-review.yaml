- term:
    id: GO:2000503
    label: positive regulation of natural killer cell chemotaxis
  evidence_type: IDA
  original_reference_id: PMID:7545673
  qualifier: involved_in
  review:
    summary: Chemokine binding and migration assays in the NK-like YT cell line and in CCR1 transfectants
      derived from it. Independent work shows that chemokines acting through CCR5, including MIP-1beta,
      recruit and polarize NK cells.
    action: ACCEPT
    reason: NK cells express CCR5 and are recruited by MIP-1beta, so positive regulation of natural killer
      cell chemotaxis is a function CCL4 performs directly as the chemoattractant ligand. The same term
      is annotated to CCL3 and CCL5. Accepted, with the caveat that in the cited CCR1-transfectant assay
      full-length MIP-1beta was the weaker competitor; the curator read the full text and the function
      is independently supported.
    supported_by:
    - reference_id: PMID:9759849
      supporting_text: 'Chemokines induce the formation of two specialized regions in the NK cell: the
        advancing front or leading edge, where chemokine receptors CCR2 and CCR5 cluster, which might
        guide the cells toward the chemotactic source'
    - reference_id: PMID:7545673
      supporting_text: All three C-C chemokines were able to cross-compete for binding sites on YT4/293
        cells and induced directional migration of YT4/293 cells in vitro
