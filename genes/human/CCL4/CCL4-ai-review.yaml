core_functions:
- description: CCL4 acts in the extracellular region as a secreted chemoattractant cytokine. It establishes
    chemotactic gradients that direct the migration of CCR5-expressing leukocytes - monocytes/macrophages,
    effector and memory T cells, NK cells and immature dendritic cells - to sites of inflammation and
    infection, and this activity is the basis of its role in the inflammatory response. Gradient shape
    is itself regulated by reversible polymerization of the chemokine and by selective degradation of
    its monomer.
  molecular_function:
    id: GO:0008009
    label: chemokine activity
  directly_involved_in:
  - id: GO:0070098
    label: chemokine-mediated signaling pathway
  - id: GO:0006954
    label: inflammatory response
  - id: GO:0030335
    label: positive regulation of cell migration
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:8699119
    supporting_text: MIP-1beta, and RANTES were all potent agonists for CC CKR5
  - reference_id: file:human/CCL4/CCL4-uniprot.txt
    supporting_text: Monokine with inflammatory and chemokinetic properties.
- description: CCL4 binds the Gi-coupled chemokine receptor CCR5 on the surface of target leukocytes.
    Receptor engagement requires the extracellular disulfide-bonded architecture of CCR5 and elicits pertussis-toxin-sensitive
    calcium mobilization together with receptor internalization and surface down-modulation. The same
    ligand occupancy and down-modulation of the coreceptor underlies the ability of CCL4 to block entry
    of R5-tropic HIV-1, making it one of the major CD8+ T-cell-derived HIV-suppressive factors. The naturally
    secreted truncated form MIP-1-beta(3-69) additionally engages CCR1 and CCR2 isoform B.
  molecular_function:
    id: GO:0031730
    label: CCR5 chemokine receptor binding
  directly_involved_in:
  - id: GO:0070098
    label: chemokine-mediated signaling pathway
  - id: GO:0051928
    label: positive regulation of calcium ion transport
  - id: GO:0051607
    label: defense response to virus
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:10383387
    supporting_text: All cysteine mutants were unable to bind detectable levels of MIP-1beta, and did
      not respond functionally to CCR5 agonists.
  - reference_id: PMID:12070155
    supporting_text: MIP-1 beta(3-69) retains the abilities to induce down-modulation of surface expression
      of the chemokine receptor CCR5 and to inhibit the CCR5-mediated entry of HIV-1 in T cells.
  - reference_id: PMID:8525373
    supporting_text: The chemokines RANTES, MIP-1 alpha, and MIP-1 beta were identified as the major HIV-SF
      produced by CD8+ T cells.
suggested_questions:
- question: Does the IDA evidence in PMID:10841574 that produced the GO:0043922 (host-mediated suppression
    of viral transcription) and GO:0009636 (response to toxic substance) annotations for CCL3, CCL4 and
    CCL5 actually concern a transcriptional step, or is it coreceptor-level entry blockade that would
    be better captured by GO:0051607 or GO:0046597? The cached record is abstract-only, so these rows
    were left UNDECIDED.
- question: Should the receptor-binding and signaling annotations of CCL4 be split by proteoform? Full-length
    CCL4 is essentially CCR5-selective, whereas the predominant secreted form MIP-1-beta(3-69) also signals
    through CCR1 and CCR2b, so some receptor annotations arguably belong to the processed chain PRO_0000005165
    rather than to the gene product as a whole.
- question: Is there a GO term, or should one exist, for ligand-induced down-modulation of a chemokine
    receptor as a distinct regulatory output of chemokine action? This is the mechanistic basis of CCL4's
    antiviral activity but is currently only captured indirectly.
- question: Does CCL4 have any direct microbicidal activity of its own, as the family-level IBA for GO:0061844
    implies, or is that node assertion carried by other CC chemokines?
suggested_experiments:
- hypothesis: The antiviral activity of CCL4 against R5-tropic HIV-1 is entirely accounted for by CCR5
    occupancy and internalization, with no effect on steps after entry such as viral transcription.
  description: 'Compare CCL4 treatment of primary CD4+ T cells challenged with R5-tropic HIV-1 against
    entry-independent readouts: use VSV-G-pseudotyped or CCR5-independent virus, or post-entry addition
    of CCL4, and quantify integrated provirus and LTR-driven transcription (e.g. nascent viral RNA) separately
    from entry measured by fusion reporter assays. Include a CCR5 internalization-deficient receptor mutant
    to test whether down-modulation rather than simple competition is required.'
  experiment_type: functional assay
- hypothesis: Eosinophils do not respond chemotactically to CCL4, contrary to the family-level GO:0048245
    inference.
  description: Assay purified human eosinophils in transwell and real-time chemotaxis assays against a
    CCL4 dose range, with CCL11 as a positive CCR3 control and CCL3 as a CCR1 comparator, and confirm
    receptor expression by flow cytometry for CCR1, CCR3 and CCR5. A negative result would justify removing
    the propagated eosinophil chemotaxis annotation.
  experiment_type: chemotaxis assay
- hypothesis: Polymerization of CCL4 regulates its in vivo chemotactic potency and half-life, as has been
    shown for CCL3.
  description: Generate structure-guided depolymerizing mutants of CCL4 using the double-helical polymer
    interfaces defined crystallographically, verify oligomeric state by SEC and analytical ultracentrifugation,
    then compare monomer and polymer-competent forms for CCR5 binding, calcium flux, monocyte arrest on
    activated endothelium, susceptibility to insulin-degrading enzyme, and leukocyte recruitment in vivo.
  experiment_type: structure-function analysis
- hypothesis: Receptor usage differs between full-length CCL4 and the natural MIP-1-beta(3-69) form in
    primary cells, not only in transfectants.
  description: Produce both proteoforms homogeneously, confirm the N-terminus by mass spectrometry, and
    compare calcium flux, beta-arrestin recruitment and chemotaxis in primary monocytes and T cells with
    selective CCR1, CCR2 and CCR5 antagonists, to establish which annotations belong to which proteoform.
  experiment_type: receptor pharmacology
