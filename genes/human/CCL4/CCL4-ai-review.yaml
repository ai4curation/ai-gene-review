  review:
    summary: Antimicrobial peptide-mediated humoral immune response propagated across the CC chemokine
      family. Several CC chemokines have direct microbicidal activity in vitro, but no such activity has
      been reported specifically for CCL4.
    action: KEEP_AS_NON_CORE
    reason: The node assertion is plausible for a small cationic chemokine, and the review does not have
      target-specific evidence against it, but CCL4 is characterized as a CCR5 agonist and leukocyte chemoattractant
