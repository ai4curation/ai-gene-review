      manner. In testis it degrades the transition protein TNP2. Core process.
    action: ACCEPT
    reason: '[PMID:25654263 "ASB9 binds to creatine kinase (CK) and targets it for degradation; however,
      the way in which ASB9 interacts with CK is not yet known."] [PMID:17148442 "This interaction increases
      the polyubiquitylation of CKB and decreases total CKB levels within the cell."] [PMID:17148442 "The
      targeting of CKB for degradation by Asb-9 was primarily SOCS box-dependent and suggests that Asb-9
      acts as a specific ubiquitin ligase regulating levels of this evolutionarily conserved enzyme."]
      [PMID:41915740 "Mechanistically, we found that ASB9 assembles a testis-specific Cullin-RING ligase
      (CRL) complex-TNP2-ASB9-ELOB/C-CUL5-RBX1-that mediates the ubiquitin-dependent degradation of TNP2
      to facilitate the histone-to-protamine transition during spermiogenesis."]'
    supported_by:
