    label: sperm DNA condensation
  evidence_type: IMP
  original_reference_id: PMID:41915740
  qualifier: involved_in
  review:
    summary: 'Sperm DNA condensation (NEW, IMP). ASB9 assembles a testis-specific CRL5 complex that ubiquitinates
      and degrades the transition protein TNP2. ASB9 deficiency in a patient and in knockout mice causes
      TNP2 retention, failure of the histone-to-protamine transition, sperm head malformation and male
      infertility. ASB9 performs the TNP2-removal step of the transition. Comparators: the E3 RNF8 and
      the proteasome activator PSME4 carry this term for the same chromatin-protein exchange.'
    action: NEW
    reason: '[PMID:41915740 "Mechanistically, we found that ASB9 assembles a testis-specific Cullin-RING
      ligase (CRL) complex-TNP2-ASB9-ELOB/C-CUL5-RBX1-that mediates the ubiquitin-dependent degradation
      of TNP2 to facilitate the histone-to-protamine transition during spermiogenesis."] [PMID:41915740
      "In this study, we investigated the role of the ankyrin repeat-containing SOCS box protein 9 (ASB9)
      during spermiogenesis and found that its deficiency causes TNP2 retention, leading to a failure
      of the histone-to-protamine transition in both humans and mice."] [PMID:41915740 "This disruption
      consequently causes male infertility, characterized by sperm head malformation and impairments in
      fertilization and early embryonic development."]'
    supported_by:
    - reference_id: PMID:41915740
      supporting_text: Mechanistically, we found that ASB9 assembles a testis-specific Cullin-RING ligase
        (CRL) complex-TNP2-ASB9-ELOB/C-CUL5-RBX1-that mediates the ubiquitin-dependent degradation of
        TNP2 to facilitate the histone-to-protamine transition during spermiogenesis.
    - reference_id: PMID:41915740
      supporting_text: In this study, we investigated the role of the ankyrin repeat-containing SOCS box
