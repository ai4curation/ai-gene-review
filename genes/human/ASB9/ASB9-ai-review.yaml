id: Q96DX5
gene_symbol: ASB9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASB9 is an ankyrin repeat and SOCS box protein that serves as the substrate-recognition subunit
  of a Cullin 5-RBX2 (CRL5) E3 ubiquitin ligase. It forms a stable complex with Elongin B/C that binds
  Cullin 5, and the reconstituted ASB9-CUL5-RBX2 ligase has been characterized biochemically and by cryo-EM.
  Its ankyrin repeats bind creatine kinases, one ASB9 per creatine kinase dimer. ASB9 targets brain-type
  creatine kinase (CKB) and ubiquitous mitochondrial creatine kinase for ubiquitination and degradation,
  and it colocalizes with the mitochondrial enzyme in mitochondria. A splice variant lacking the SOCS
  box binds creatine kinase but cannot recruit Elongin B/C and may act as a dominant-negative regulator.
  In vitro the ASB9-CUL5 ligase also polyubiquitylates free histones H3 and H4. In spermatids, a testis-specific
  ASB9-CRL5 complex degrades the transition protein TNP2 to allow the histone-to-protamine transition;
  ASB9 deficiency causes male infertility in humans and mice.
