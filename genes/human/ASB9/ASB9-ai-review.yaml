suggested_questions:
- question: Are free histones H3/H4 physiological ASB9 substrates, for example during spermiogenic histone
    eviction alongside TNP2?
- question: What physiological signal induces ASB9-mediated creatine kinase degradation, and does the
    SOCS-box-less splice variant protect creatine kinase in proliferating cells?
suggested_experiments:
- description: Measure CKB and mitochondrial creatine kinase turnover and cellular energy buffering in
    ASB9-null cells, with rescue by full-length versus SOCS-box-less ASB9.
