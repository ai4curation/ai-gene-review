- id: file:human/AGO4/AGO4-deep-research-falcon.md
  title: Falcon deep research report for AGO4
  findings:
  - statement: Falcon research supports the reviewed core function of AGO4.
    supporting_text: Human AGO4 (EIF2C4; UniProt Q9HCK5) is best supported (in the retrieved
      literature set) as a **small-RNA-binding Argonaute paralog** that contributes to gene
      regulation largely through **non-slicing mechanisms**
- id: file:human/AGO4/AGO4-hypotheses/function-hypothesis-go-0004521/openscientist.md
  title: OpenScientist hypothesis report for AGO4 GO:0004521
  publication_type: DEEP_RESEARCH
  findings:
  - statement: OpenScientist refutes RNA endonuclease activity for AGO4.
    supporting_text: Human AGO4 does **not** have RNA endonuclease (slicer) activity.
  - statement: The report identifies loss of the AGO2-equivalent catalytic Asp and His (AGO4 Gly671
      and Arg809) and separately describes TNRC6-dependent translational repression and mRNA decay.
      Its conclusion concerns slicing, not all RNA processing or decay.
    supporting_text: AGO4's genuine molecular role is as a slicer-independent miRNA effector that
      silences targets by recruiting the TNRC6/GW182 machinery
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Focused OpenScientist report directly evaluates the GO:0004521 IBA and supports
      removal as AGO2/AGO3 paralog over-propagation onto slicer-dead AGO4.
- id: PMID:19838187
  title: Ago-TNRC6 triggers microRNA-mediated decay by promoting two deadenylation steps.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identifier/title verified; cached full text read. Human AGO paralogs were
      tethered to reporter mRNAs in mouse NIH3T3 fibroblasts. This establishes AGO4 decay capacity,
      not an endogenous guide/target assignment. The study itself did not favor direct deadenylase
      recruitment from its co-IP results.
  findings:
  - statement: All four tethered human AGO proteins can accelerate biphasic deadenylation; AGO4
      slicing inactivity does not imply absence of mRNA decay capacity.
    supporting_text: "all four human Ago proteins and \nTNRC6C are each able to recapitulate the two deadenylation
      steps."
- id: file:human/AGO4/AGO4-hypotheses/mrna-destabilization-versus-slicer-loss/openscientist.md
  title: OpenScientist AGO4 mRNA destabilization versus slicer-loss adjudication
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Read complete report and CSV tables. Useful PMID:19838187 tethering evidence independently
      verified. Material error: report asserts no GO:0035279/GO:0090625 negative annotations, but live
      QuickGO retains both BHF-UCL NOT IDA rows. Definitions of both terms explicitly concern cleavage;
      related deadenylation synonyms for GO:0035279 do not automatically broaden its formal definition.
      Reject confident removal/re-scoping of source NOT based on names or presumed annotation absence;
      retain uncertainty and request ontology/assay clarification.'
  findings:
  - statement: The report distinguishes artificial tethering sufficiency from natural guide-target
      recruitment.
    supporting_text: Tethering bypasses guide:target recognition, and paralogs differ
      quantitatively.
core_functions:
- description: AGO4 binds small RNAs and acts in RISC loading and activation, translational
    repression, and recruitment of non-slicing mRNA decay. Its RNA-guided endonuclease active site
    is inactive.
  molecular_function:
    id: GO:0035198
    label: miRNA binding
  directly_involved_in:
  - id: GO:0035194
    label: regulatory ncRNA-mediated post-transcriptional gene silencing
  - id: GO:0035278
    label: miRNA-mediated gene silencing by inhibition of translation
  in_complex:
    id: GO:0016442
    label: RISC complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0000932
    label: P-body
  supported_by:
  - reference_id: PMID:19966796
    supporting_text: "all four human AGO \nproteins show remarkably similar structural preferences for
      small-RNA duplexes"
  - reference_id: PMID:22795694
    supporting_text: Thus, Ago1/3/4-ΔPAZ maintained their ability to physically associate with
      small-RNA duplexes, but not the ability to unwind and form active RISC.
  - reference_id: PMID:18771919
    supporting_text: the four tethered proteins caused nearly equal reductions in cytoplasmic mRNA
      concentration, suggesting that each has a similar capacity to destabilize mRNA.
  - reference_id: PMID:19383768
    supporting_text: "the \nN-terminal GW-repeat-containing regions of all three TNRC6s interact with
      the \nfour human Argonaute proteins (AGO1-AGO4)."
proposed_new_terms: []
suggested_questions:
- question: Which endogenous human tissues or stress states require AGO4-specific RISC activity
    rather than redundant activity from other AGO paralogs?
- question: Which protein cofactors determine guide loading, localization, and non-core nuclear or
    granule-associated functions of AGO4?
- question: Do GO:0035279 and GO:0090625 formally denote cleavage-specific pathways despite their
    destabilization names, and should their original AGO4 NOT assertions be retained on that scope?
    GO:0035279 also has related deadenylation synonyms; clarification should distinguish this from
    the verified tethering-based decay capacity.
suggested_experiments:
- description: Endogenous tagging of AGO4 followed by small-RNA CLIP, target RNA profiling, and
    paralog-specific rescue in AGO-depleted human cells.
  experiment_type: genome editing/RNA-protein interaction profiling
  hypothesis: AGO4 has paralog-specific guide, target, and compartment preferences within human RISC
    biology.
- description: Biochemical reconstitution of AGO4-RISC with representative miRNA and siRNA guides to
    compare target repression, target cleavage, and TNRC6 recruitment.
  experiment_type: biochemical reconstitution
  hypothesis: AGO4 activity is best explained by guide-loaded RISC function rather than generic RNA
    or protein binding.
