- term:
    id: GO:0004521
    label: RNA endonuclease activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: RNA endonuclease activity is not supported as a physiological activity for AGO4.
    action: REMOVE
    reason: AGO4-specific loss of the conserved catalytic Asp/His, corroborated by human Argonaute
      cleavage experiments, contradicts retention of ancestral slicer activity. The existing
      OpenScientist report identifies AGO4 Gly671 and Arg809 in aligned catalytic windows. This is a
      target-specific challenge to the inherited catalytic assertion; the PAINT node placement was
      not independently reconstructed. Non-slicing RNA binding, RISC maturation and decay
      recruitment remain supported.
