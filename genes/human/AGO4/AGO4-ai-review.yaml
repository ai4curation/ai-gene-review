- term:
    id: GO:0006402
    label: mRNA catabolic process
  evidence_type: IDA
  original_reference_id: PMID:18771919
  review:
    summary: AGO4 contributes to mRNA decay through its non-slicing RISC effector function.
    action: ACCEPT
    reason: In PMID:18771919 each tethered human Argonaute, including AGO4, lowers reporter mRNA
      abundance; PMID:19383768 supplies a compatible TNRC6 recruitment mechanism. Target recognition
      and recruitment of the decay machinery constitute participation in mRNA catabolism. Lack of an
      endonuclease active site does not exclude this core effector role.
    supported_by:
    - reference_id: PMID:18771919
      supporting_text: the four tethered proteins caused nearly equal reductions in cytoplasmic mRNA
        concentration, suggesting that each has a similar capacity to destabilize mRNA.
    - reference_id: PMID:19383768
      supporting_text: "the \nN-terminal GW-repeat-containing regions of all three TNRC6s interact with
        the \nfour human Argonaute proteins (AGO1-AGO4)."
- term:
    id: GO:0035278
    label: miRNA-mediated gene silencing by inhibition of translation
  evidence_type: IDA
  original_reference_id: PMID:18771919
  review:
    summary: miRNA-mediated gene silencing by inhibition of translation is consistent with AGO4 as a
      small-RNA-loaded Argonaute/RISC effector.
    action: ACCEPT
