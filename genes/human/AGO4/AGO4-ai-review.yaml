- term:
    id: GO:0031054
    label: pre-miRNA processing
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: AGO4 participates in miRNA maturation by binding precursor-derived duplexes and
      promoting passenger-strand unwinding/ejection during RISC activation.
    action: ACCEPT
    reason: QuickGO defines miRNA processing as generation of a functional miRNA and pre-miRNA
      processing as conversion to a mature miRNA molecule; neither is restricted to endonucleolytic
      cleavage. PMID:19966796 and PMID:22795694 demonstrate loading and slicing-independent
      maturation by Ago1/3/4. AGO4 supplies RNA binding and structural activity that performs part
      of this process, rather than merely being its substrate. This does not assign Drosha/Dicer
      catalysis to AGO4.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000527278
        source_status: SUPPORTS_TRANSFER
        comment: Proximate IBA node verified in the cached GOA WITH/FROM field. Direct AGO4
          RNA-binding and slicing-independent RISC-maturation experiments support this inherited
          noncatalytic function; the former granularity/role objection was too strong.
    supported_by:
    - reference_id: PMID:19966796
      supporting_text: "all four human AGO \nproteins show remarkably similar structural preferences for
        small-RNA duplexes"
    - reference_id: PMID:22795694
      supporting_text: Thus, Ago1/3/4-ΔPAZ maintained their ability to physically associate with
        small-RNA duplexes, but not the ability to unwind and form active RISC.
