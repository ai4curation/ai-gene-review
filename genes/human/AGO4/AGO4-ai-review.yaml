- term:
    id: GO:0090625
    label: siRNA-mediated gene silencing by mRNA destabilization
  evidence_type: IDA
  original_reference_id: PMID:15260970
  negated: true
  review:
    summary: 'The source NOT assertion remains unresolved: cleavage-specific ontology wording and slicing-independent
      decay must be distinguished.'
    action: UNDECIDED
    reason: Live QuickGO (2026-09-21) retains this BHF-UCL NOT|involved_in IDA row citing
      PMID:15260970, contrary to the new OpenScientist report's claim that no such negative
      annotation exists. GO:0090625 explicitly defines siRNA-directed target cleavage and cites
      PMID:15260970; its name alone cannot be read as a generic deadenylation process. The cached
      2004 paper is abstract-only and establishes AGO2-specific endonuclease activity, which can
      support a cleavage-scoped negative. Full-text PMID:19838187 independently shows that tethered
      human AGO4 can promote biphasic deadenylation in mouse NIH3T3 cells; this establishes decay
      capacity but does not directly test natural guide-dependent recruitment or contradict a
      cleavage-specific NOT. Keep the original negation and UNDECIDED pending clarification of
      intended term scope and access to the original assay details. The report's blanket
      recommendation to move all negative claims to molecular function is not adopted.
    supported_by:
    - reference_id: PMID:15260970
      supporting_text: endonuclease activity is exclusively associated with Ago2.
    - reference_id: PMID:18771919
      supporting_text: the four tethered proteins caused nearly equal reductions in cytoplasmic mRNA
        concentration, suggesting that each has a similar capacity to destabilize mRNA.
    - reference_id: PMID:19383768
      supporting_text: "the \nN-terminal GW-repeat-containing regions of all three TNRC6s interact with
        the \nfour human Argonaute proteins (AGO1-AGO4)."
    - reference_id: PMID:19838187
      supporting_text: "all four human Ago proteins and \nTNRC6C are each able to recapitulate the two
        deadenylation steps."
    - reference_id:
        file:human/AGO4/AGO4-hypotheses/mrna-destabilization-versus-slicer-loss/openscientist.md
      supporting_text: Tethering bypasses guide:target recognition, and paralogs differ
        quantitatively.
