id: Q9HCK5
gene_symbol: AGO4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AGO4 encodes human Argonaute-4, a small-RNA-binding Argonaute paralog that contributes
  to RISC-mediated gene regulation primarily through non-slicing mechanisms. Evidence supports
  miRNA/RISC-associated translational repression, cytoplasmic miRISC/P-body-associated function, and
  a non-core mammalian antiviral role rather than canonical AGO2-like slicing. Its lack of slicer
  activity does not prevent precursor-derived duplex unwinding during RISC maturation or recruitment
  of TNRC6-dependent mRNA decay.
