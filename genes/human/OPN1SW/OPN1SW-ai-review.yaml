    reason: 'Organism-level process for which the gene is essential: missense variants in the blue-sensitive opsin
      segregate with autosomal dominant tritanopia (PMID:1531728). The row-18 TAS reference (PMID:9089077) is a
      gene-evolution paper that does not assay vision, but the claim stands.'
