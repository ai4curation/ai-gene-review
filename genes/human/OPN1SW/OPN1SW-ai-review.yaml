- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: EXP
  original_reference_id: PMID:2937147
  qualifier: located_in
  review:
    summary: OPN1SW is a plasma membrane, membrane and ciliary membrane protein; the specific membrane is the cone
      photoreceptor disc membrane.
    action: MODIFY
    reason: 'True but general. Cone discs arise as evaginations of the ciliary plasma membrane and stay contiguous
      with it, so GO:0120201 cone photoreceptor disc membrane is an is_a descendant of plasma membrane, ciliary
      membrane and membrane; the gene already carries it (row 43) and the GO-CAM uses it. The blue pigment is measured
      in human cone outer segments (PMID:6140680). The cited sources are weak for any membrane: PMID:2937147 (EXP)
      and PMID:9089077 (TAS) are cloning and gene-evolution papers that assay no location, and the dermal fibroblast
      and melanocyte papers (PMID:31380578, PMID:31730232) are OPN3 studies that stained with an antibody named
      only "anti-OPN1", which does not say which cone opsin it detects, without a knockdown control. They do not
      change the claim. Same decision as OPN1LW and OPN1MW.'
    proposed_replacement_terms: &id003
    - id: GO:0120201
      label: cone photoreceptor disc membrane
    supported_by: &id004
    - reference_id: PMID:6140680
      supporting_text: transverse measurements were made of the absorbance spectra of the outer segments of the
        rods and cones
    - reference_id: PMID:31730232
      supporting_text: Rabbit monoclonal antihuman OPN1 (1:1000; MDL, MDL11128)
