id: P03999
gene_symbol: OPN1SW
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: OPN1SW encodes the short-wavelength-sensitive (S, "blue") cone opsin, the visual pigment apoprotein
  of S cones. It is a seven-transmembrane G protein-coupled receptor of the opsin family that binds 11-cis-retinal
  covalently through a Schiff base at Lys-290, forming a pigment that absorbs maximally near 419-420 nm. Photoisomerization
  of the chromophore converts the pigment into an active receptor that catalyses GDP-GTP exchange on cone transducin,
  initiating the cGMP cascade that hyperpolarizes the cone; receptor phosphorylation and cone arrestin terminate
  the signal. The pigment resides in the disc membranes of the cone outer segment, which are continuous with the
  plasma membrane. The gene is autosomal and the protein only about 43 percent identical to the L and M pigments.
  Dominant missense variants cause tritan colour vision deficiency, a selective loss of blue spectral sensitivity.
  Transcripts and opsin-like immunoreactivity have also been reported in human skin cells, where no function has
  been established.
