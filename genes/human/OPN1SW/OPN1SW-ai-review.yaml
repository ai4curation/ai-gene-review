  review:
    summary: OPN1SW acts in G protein-coupled opsin signalling (phototransduction); the specific pathway is transducin-mediated
      opsin signalling.
    action: MODIFY
    reason: Each term (signal transduction, GPCR signaling pathway, phototransduction, cellular response to light
      stimulus) is a true ancestor of GO:0141190 transducin-mediated opsin signaling pathway, which the gene already
      carries (row 44) and the GO-CAM uses. No cached paper assays transducin activation by the human S pigment;
      the pathway rests on the opsin-clade IBA, transfer from the human L opsin (assayed directly in COS-1 membranes
      with bovine rod transducin; see the OPN1LW review) and Reactome. PMID:2937147 and PMID:9089077 (TAS) are cloning
      and evolution papers. Consistent with the other cone opsins and RHO.
