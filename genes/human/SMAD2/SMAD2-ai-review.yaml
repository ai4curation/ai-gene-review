id: Q15796
gene_symbol: SMAD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SMAD2 is a receptor-regulated SMAD transcription factor that transduces activin, Nodal and
  TGF-beta signals. Activated type I receptors phosphorylate its C-terminal serines, enabling association
  with SMAD4 and other SMADs, nuclear accumulation, and context-dependent transcription with partners
  such as FOXH1. SMAD2 binds DNA directly when properly folded; the exon-3-encoded E3 insert in the long
  isoform regulates its conformation and affinity, while the shorter isoform lacks this insert. SMAD2
  cycles between cytosol and nucleus, and its phosphorylation, ubiquitination and interactions with phosphatases
  regulate signal duration. Its outputs include embryonic mesendoderm specification, epithelial remodeling
  and tissue differentiation; vascular BMP9 responses and miRNA-processing functions represent additional
  contexts.
