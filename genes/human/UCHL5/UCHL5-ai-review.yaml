    summary: Cysteine-type deubiquitinase activity propagated from PTN000063280.
    action: ACCEPT
    reason: The PAINT node PTN000063280 spans the UCH family, whose members are thiol proteases acting at the ubiquitin
      C terminus; UCHL5 itself is among the experimental seeds. The human protein retains the catalytic residues
      and has direct biochemical evidence. UCHL5 is a peptidase C12 (UCH) cysteine protease with a Cys88/His164
      catalytic dyad; purified and proteasome-bound UCH37 hydrolyses ubiquitin-AMC and disassembles K48-linked polyubiquitin,
      and the C88A mutant is inactive. This is the core activity of the gene, experimentally established for the
      human protein (PMID:16906146, PMID:18922472, PMID:33156996).
    supported_by:
    - reference_id: PMID:16906146
      supporting_text: We show that Uch37 is responsible for the ubiquitin isopeptidase activity in the PA700 (19S)
        proteasome regulatory complex.
