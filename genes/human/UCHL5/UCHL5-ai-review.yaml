suggested_questions:
- question: Does UCHL5 have any catalytic role within the INO80 complex, given that NFRKB holds it inactive there,
    or does INO80 act as a nuclear reservoir that hands UCHL5 to proteasomes?
- question: Do the INO80-phenotype annotations to UCHL5 from PMID:25016522, PMID:26340092 and PMID:27641337 rest
    on UCHL5-specific knockdowns? The cached full text of PMID:25016522 reports only Ino80 and Arp8 knockdowns.
- question: Which substrates does UCHL5 rescue from degradation by distal-end chain editing, and which does it help
    degrade by debranching? Answering this would reconcile the opposite knockdown effects reported for UCHL5.
suggested_experiments:
- description: Separation-of-function UCHL5 alleles that bind NFRKB but not ADRM1, and the reverse, combined with
    catalytic-dead C88A, to test whether INO80-associated UCHL5 contributes to chromatin remodeling or DNA replication
    phenotypes independently of the proteasome.
