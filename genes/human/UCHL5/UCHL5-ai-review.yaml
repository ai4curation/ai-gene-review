- term:
    id: GO:1990380
    label: K48-linked deubiquitinase activity
  evidence_type: IDA
  original_reference_id: PMID:16906146
  review:
    summary: UCHL5 disassembles Lys48-linked polyubiquitin from the distal end and debranches K48 chains.
    action: NEW
    reason: The 19S isopeptidase activity attributable to UCH37 disassembles K48-linked chains from the distal end,
      and proteasome-bound UCHL5 cleaves K48 linkages in branched chains using a K48-chain-specific binding site.
      This linkage preference is the defining biochemical property of the human enzyme and refines GO:0004843.
    supported_by:
    - reference_id: PMID:16906146
      supporting_text: PA700 isopeptidase disassembles Lys 48-linked polyubiquitin specifically from the distal
        end of the chain
    - reference_id: PMID:33156996
      supporting_text: we report that UCH37/UCHL5, a proteasome-associated deubiquitinase, cleaves K48 branched
        chains.
    - reference_id: PMID:35451368
      supporting_text: By debranching ubiquitin chains composed of K48 linkages, the proteasome-associated ubiquitin
        C-terminal hydrolase UCHL5/UCH37 serves as a positive regulator of protein degradation.
- term:
    id: GO:0005838
    label: proteasome regulatory particle
  evidence_type: IDA
  original_reference_id: PMID:16906146
  review:
    summary: UCHL5 is a subunit of the 19S (PA700) regulatory particle, docked via ADRM1/RPN13.
    action: NEW
    reason: UCH37 is the isopeptidase subunit of purified PA700 and binds the 19S through ADRM1, which sits on RPN2.
      The gene carries proteasome binding but no proteasome component term; comparator 19S DUBs (PSMD14, a lid subunit)
      carry proteasome complex terms. UCHL5 is substoichiometric and its docking site ADRM1 is itself not present
      on every proteasome, so the general regulatory particle term is used rather than base or lid.
    supported_by:
    - reference_id: PMID:16906146
      supporting_text: Uch37 binds through Adrm1, a previously unrecognized orthologue of Saccharomyces cerevisiae
        Rpn13p, which in turn is bound to the S1 (also known as Rpn2) subunit of the 19S complex.
    - reference_id: PMID:9034192
      supporting_text: This enzyme is an intrinsic subunit of PA700, the 19S regulatory complex of the 26S proteasome.
