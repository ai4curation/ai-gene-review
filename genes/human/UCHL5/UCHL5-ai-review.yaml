core_functions:
- description: Proteasome-associated K48-linkage-preferring deubiquitinase. Recruited to the 19S regulatory particle
    by ADRM1/RPN13, which activates it. It edits and debranches substrate-attached K48 chains, setting substrate
    fate at the proteasome. Experimentally established for the human protein by purified-enzyme, reconstituted-proteasome
    and catalytic-mutant (C88A) studies.
  molecular_function:
    id: GO:1990380
    label: K48-linked deubiquitinase activity
