id: Q9Y5K5
gene_symbol: UCHL5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: UCHL5 (UCH37) is a ubiquitin C-terminal hydrolase (peptidase C12, UCH family) cysteine protease that
  removes ubiquitin from polyubiquitin chains. A UCH catalytic domain with a Cys88/His164 dyad is followed by a
  C-terminal ULD/KEKE region that autoinhibits the enzyme and mediates partner binding. In the cytoplasm and nucleus
  UCHL5 docks onto the 19S regulatory particle of the 26S proteasome through the DEUBAD domain of ADRM1/RPN13, which
  relieves autoinhibition. Proteasome-bound UCHL5 trims K48-linked chains from the distal end and preferentially
  debranches K48-containing branched chains. This can either rescue poorly ubiquitinated substrates from degradation
  or promote degradation and proteasome recycling, depending on the substrate. In the nucleus UCHL5 is also a subunit
  of the INO80 chromatin-remodeling complex. There the related DEUBAD domain of NFRKB (INO80G) binds the same C-terminal
  region and holds the enzyme inactive, though transient contact with the proteasome can activate it. Reported substrates
  include Smoothened, which UCHL5 deubiquitinates and stabilises to support Hedgehog signalling.
