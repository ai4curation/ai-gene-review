- term:
    id: GO:0004866
    label: endopeptidase inhibitor activity
  evidence_type: IMP
  original_reference_id: PMID:18162577
  qualifier: enables
  review:
    summary: Endopeptidase inhibitor activity inferred from UCH37 RNAi accelerating cellular protein degradation.
    action: REMOVE
    reason: The cited abstract itself reports that UCH37 knockdown had no detectable effect on proteasome proteolytic
      capacity; what changed was the cellular rate of protein degradation. An inhibitor of the proteasome's peptidase
      activity would alter proteolytic capacity. UCHL5 is a deubiquitinase that edits substrate ubiquitin chains,
      and the degradation effect is captured as regulation of proteasomal protein catabolic process (GO:0061136)
      from the same paper. Later work shows UCHL5 can also promote degradation by debranching chains (PMID:33156996),
      which is inconsistent with an intrinsic protease inhibitor function.
    supported_by:
    - reference_id: PMID:18162577
      supporting_text: In contrast, RNAi of Uch37 or Usp14 had no detectable effect on cell growth, proteasome structure
        or proteolytic capacity, but accelerated cellular protein degradation.
