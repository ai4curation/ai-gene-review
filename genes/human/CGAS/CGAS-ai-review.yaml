- term:
    id: GO:0071360
    label: cellular response to exogenous dsRNA
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2442261
  - PANTHER:PTN002579681
  review:
    summary: 'Human cGAS is a DNA sensor and does not bind or respond to RNA; a ''response to exogenous dsRNA'' role is not supported for human cGAS.'
    action: MARK_AS_OVER_ANNOTATED
    reason: cGAS specifically binds dsDNA and not RNA, and RNA does not stimulate its activity. This term most plausibly reflects over-propagation from RNA-sensing cGAS-like receptors (cGLRs) elsewhere in the mab-21/cGLR family (e.g., invertebrate cGLRs) rather than a function of human cGAS. Marking as over-annotated rather than removing, since the family-level ancestral association is not baseless.
    supported_by: &id001
    - reference_id: PMID:23258413
      supporting_text: biotinylated RNA did not bind cGAS
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: PANTHER:PTN002579681
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral cGAS/cGLR node spans RNA-sensing cGAS-like receptors; human cGAS is DNA-specific and does not bind or respond to RNA, so a dsRNA-response term should not transfer to it.
      - source_id: MGI:MGI:2442261
        source_label: Cgas
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mouse cGAS is likewise a DNA sensor; the dsRNA-response term is not a demonstrated cGAS function.
