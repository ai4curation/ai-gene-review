description: APRG1 (AP20 region protein 1, C3orf35) is an uncharacterized gene in the 3p21.3 AP20 region,
  which is frequently deleted in epithelial cancers. It produces several tissue-specific splice variants,
  with low expression in all tissues tested and relatively higher expression in pancreas, kidney and placenta.
  Isoform B encodes a 170-residue protein whose N-terminal part resembles the eukaryotic translation initiation
  factor 6 family and which ends in a predicted transmembrane helix. The protein is supported only at
  the transcript level, and no function has been established.
