knowledge_gaps:
- gap_statement: APRG1 has no measured function, location or interaction, and its protein has not been
    detected; even its existence as a stable protein is supported only at the transcript level.
  boundary: 'Established: the gene, its splice variants and low, broad expression; a predicted 170-residue
    isoform with an eIF6-like N-terminal segment, an RGD motif and a C-terminal transmembrane helix. Not
    established: protein detection, location, binding partners, and any role in tumour suppression beyond
    lower transcript levels in breast tumours (PMID:16187228).'
