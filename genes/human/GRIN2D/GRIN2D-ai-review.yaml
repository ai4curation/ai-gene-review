id: O15399
gene_symbol: GRIN2D
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRIN2D encodes GluN2D, a glutamate-binding GluN2 subunit of NMDA-type ionotropic glutamate receptors. GluN2D co-assembles with GluN1 to form heterotetrameric plasma-membrane channels gated by glutamate and glycine or D-serine; channel opening conducts Na+, K+, and Ca2+ and is shaped by voltage-dependent Mg2+ block. GluN2D-containing receptors have high agonist potency and slow deactivation kinetics relative to GluN2A/GluN2B receptors, are most widely expressed in early brain and then in selected neuronal populations, and contribute to excitatory synaptic transmission and calcium-dependent plasticity. The C-terminal tail contains a PDZ-binding motif that supports interactions with postsynaptic scaffold proteins.
