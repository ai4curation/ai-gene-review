suggested_questions:
- question: Which adult human neuronal populations retain functional GluN2D-containing NMDA receptors, and are they primarily synaptic or extrasynaptic?
- question: How do disease-associated GluN2D gating variants change calcium influx, excitability, and neuronal survival in human neurons?
suggested_experiments:
- hypothesis: Epileptic-encephalopathy GRIN2D gain-of-function variants cause neuronal injury by prolonging GluN2D-dependent calcium entry.
  description: Knock recurrent M3-helix GRIN2D variants into human iPSC-derived neurons, then measure NMDA-evoked currents, calcium transients, and rescue by clinically used NMDA channel blockers.
  experiment_type: isogenic variant electrophysiology and calcium imaging
