suggested_questions:
- question: How do full-length human CEP290 conformation and CEP162/other partners regulate
    access to the separately measured microtubule- and lipid-binding regions, and do native
    Y-links use simultaneous binding by one molecule?
- question: Can the neutrophil proteomic CEP290 peptides and fraction assignment be reproduced,
    and do they establish specific-granule lumen residence and extracellular release rather
    than another granule-associated pool?
- question: Which direct target experiment underlies the CEP290 cilium-assembly IDA linked to
    PMID:26386044, whose inspected main experiments focus on KIAA0586?
suggested_experiments:
- description: Reconstitute full-length human CEP290 with defined membranes, microtubules and
    recruitment partners to distinguish simultaneous bridging from separate domain capabilities;
    measure accessibility and test the predicted amphipathic segment by targeted mutations.
- description: Use targeted peptide confirmation, granule subfractionation and topology/release
    assays in primary human neutrophils to test the precise Reactome granule-lumen and extracellular
    CEP290 assignments.
