id: O15078
gene_symbol: CEP290
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEP290 (NPHP6) is a very large (~290 kDa) coiled-coil protein of the centrosome, centriolar
  satellites and proximal ciliary transition zone. At the transition zone it binds axonemal microtubules
  directly through a central myosin-tail-homology region and the ciliary membrane through an N-terminal
  amphipathic helix, so it can bridge the two in the Y-link region. It organizes recruitment of MKS-module
  proteins to the TZ downstream of RPGRIP1L/MKS5, and it is part of the ciliary gate that controls membrane-protein
  entry and exit. In centriolar satellites it works with PCM1, CEP131 and CCDC66. CP110 restrains its
  ciliogenic activity, and it is needed for ciliary vesicle maturation, Rab8a recruitment and BBSome integrity
  together with NPHP5. Mutations cause Leber congenital amaurosis, Joubert, Senior-Loken and Meckel-Gruber
  syndromes and nephronophthisis.
