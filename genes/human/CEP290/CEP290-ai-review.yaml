- description: Binds lipid membranes through the directly assayed human N-terminal region (residues
    1–580), providing membrane-association capacity for ciliary organization. Human-cell CEP290
    also contributes to ciliary-vesicle maturation and Rab8a/BBSome recruitment. The purified
    mixed-liposome assay does not establish lipid selectivity, an essential isolated amphipathic
    helix, direct fusion catalysis or simultaneous full-length membrane–microtubule bridging.
