- term:
    id: GO:0036038
    label: MKS complex
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: part_of
  supporting_entities:
  - UniProtKB:Q6A078
  review:
    summary: MKS complex (ISS from mouse Cep290).
    action: KEEP_AS_NON_CORE
    reason: Cep290 co-purifies with the Tctn1 complex (Garcia-Gonzalo et al. 2011), but in the modular
      view of the transition zone CEP290 is treated as its own module, distinct from the MKS and NPHP
      modules, and it is not a stoichiometric member of the B9/TMEM/TCTN MKS complex. Physical association
      is real, so the annotation is kept as non-core rather than removed.
    supported_by:
    - reference_id: PMID:21725307
      supporting_text: Tctn1 forms a complex with multiple ciliopathy proteins associated with Meckel
        and Joubert syndromes, including Mks1, Tmem216, Tmem67, Cep290, B9d1, Tctn2 and Cc2d2a
    - reference_id: PMID:28401750
      supporting_text: revealed the existence of three main TZ modules, MKS, NPHP and CEP290
