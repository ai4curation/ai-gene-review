  supporting_entities:
  - UniProtKB:A2RUB6
  review:
    summary: Generic protein binding (IPI, PMID:36606424) with CCDC66.
    action: REMOVE
    reason: Here CCDC66 co-immunoprecipitates with CEP290 and PCM1 at centriolar satellites and is required
      for TZ protein recruitment. The bare 'protein binding' term carries no functional information and
      no more specific molecular-function term is supported for CEP290 (a large coiled-coil scaffold);
      the biological content is better captured by the location and process annotations (centriolar satellite,
      transition zone, transition zone assembly). Removal does not mean the interaction is false.
    supported_by:
    - reference_id: PMID:28235840
      supporting_text: co-immunoprecipitation experiments revealed interactions between CCDC66, CEP290
        and PCM1
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6798749
  qualifier: located_in
  review:
    summary: Extracellular region / specific granule lumen, TAS from the Reactome neutrophil degranulation
      reaction.
    action: REMOVE
    reason: CEP290 is a large cytoplasmic coiled-coil centrosomal/transition-zone protein without a signal
      peptide. Its inclusion among 'specific granule lumen' proteins derives from bulk neutrophil granule
      proteomics, which captures many contaminating cytoplasmic proteins. There is no evidence that CEP290
      is a granule cargo or is exocytosed.
    supported_by:
    - reference_id: PMID:16682973
      supporting_text: NPHP6 is found at centrosomes and in the nucleus of renal epithelial cells in a
        cell cycle-dependent manner and in connecting cilia of photoreceptors
