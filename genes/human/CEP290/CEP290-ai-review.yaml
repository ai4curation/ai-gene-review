- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6798749
  qualifier: located_in
  review:
    summary: Reactome assigns CEP290 to the extracellular region as a neutrophil specific-granule lumen
      protein.
    action: REMOVE
    reason: CEP290 is a 290-kDa cytoplasmic coiled-coil centrosome/TZ protein with no signal peptide.
      Its presence in the neutrophil degranulation event comes from granule proteomics; secretion has
      not been shown and it is biologically implausible. The location is contradicted by every targeted
      localization study.
    supported_by:
    - reference_id: Reactome:R-HSA-6798749
    - reference_id: PMID:28401750
      supporting_text: CEP290’s signal had a width close to that of the axoneme, and occupied a proximal
        position close to the BB and transition fiber markers centrin and CEP164 respectively.
