- term:
    id: GO:0001822
    label: kidney development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2384917
  - PANTHER:PTN002706047
  - ZFIN:ZDB-GENE-041111-243
  review:
    summary: Kidney development (IBA).
    action: KEEP_AS_NON_CORE
    reason: CEP290 loss causes nephronophthisis and renal cysts and zebrafish knockdown gives pronephric
      defects, but these are organ-level consequences of defective cilia rather than a direct developmental
      activity. Non-core.
    supported_by:
    - reference_id: PMID:16682973
      supporting_text: Abrogation of its function in zebrafish recapitulates the renal, retinal and cerebellar
        phenotypes of Joubert syndrome
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16682973
  qualifier: enables
  supporting_entities:
  - UniProtKB:P18848
  review:
    summary: Generic protein binding (IPI, PMID:16682973) with ATF4.
    action: REMOVE
    reason: Here CEP290 was reported to bind and modulate ATF4 transcriptional activity (Sayer et al.
      2006); this has not been followed up as a core function. The bare 'protein binding' term carries
      no functional information and no more specific molecular-function term is supported for CEP290 (a
      large coiled-coil scaffold); the biological content is better captured by the location and process
      annotations (centriolar satellite, transition zone, transition zone assembly). Removal does not
      mean the interaction is false.
    supported_by:
    - reference_id: PMID:16682973
      supporting_text: CEP290 (also known as NPHP6) interacts with and modulates the activity of ATF4,
        a transcription factor implicated in cAMP-dependent renal cyst formation
