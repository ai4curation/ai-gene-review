core_functions:
- description: Core scaffold of the ciliary transition zone that bridges axonemal microtubules and the
    ciliary membrane, required to assemble transition-zone Y-link connectors and to control ciliary protein
    composition (CEP290 module).
  directly_involved_in:
  - id: GO:1905349
    label: ciliary transition zone assembly
  - id: GO:1905515
    label: non-motile cilium assembly
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  - id: GO:0032391
    label: photoreceptor connecting cilium
  supported_by:
  - reference_id: PMID:20819941
    supporting_text: CEP290 is required to form microtubule-membrane linkers that tether the flagellar
      membrane to the transition zone microtubules, and is essential for controlling flagellar protein
      composition
  - reference_id: PMID:20819941
    supporting_text: CEP290 is located in the flagellar transition zone in close association with the
      prominent microtubule-membrane links there
  - reference_id: PMID:24051377
    supporting_text: CEP290 directly binds to cellular membranes through an N-terminal domain that includes
      a highly conserved amphipathic helix motif and to microtubules through a domain located within its
      myosin-tail homology domain
  - reference_id: PMID:28401750
    supporting_text: CEP290’s signal had a width close to that of the axoneme, and occupied a proximal
      position close to the BB and transition fiber markers centrin and CEP164 respectively
- description: Centriolar-satellite and mother-centriole scaffold that promotes ciliogenesis by enabling
    ciliary vesicle maturation and RAB8A recruitment to the centrosome and cilium; this activity is held
    in check by CP110 in cycling cells.
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0034451
    label: centriolar satellite
  - id: GO:0005814
    label: centriole
  supported_by:
  - reference_id: PMID:18694559
    supporting_text: Ablation of CEP290 prevents ciliogenesis without affecting centrosome function or
      cell-cycle progression
  - reference_id: PMID:18694559
    supporting_text: Depletion of CEP290 diminishes the localization of Rab8a to centrosomes and prevents
      its entry into the cilium
  - reference_id: PMID:24421332
    supporting_text: Talpid3 is required for centriolar satellite dispersal, which precedes the formation
      of mature ciliary vesicles, a process requiring Cep290
  - reference_id: PMID:18694559
    supporting_text: CP110 interacts with CEP290--a protein whose deficiency is implicated in human ciliary
      disease--in a discrete complex separable from other CP110 complexes
  - reference_id: PMID:23943788
    supporting_text: co-localizes with CEP290 to the transition zone (TZ) of primary cilia and centriolar
      satellites in ciliated cells, as well as to the connecting cilium in photoreceptor cells
suggested_questions:
- question: Which CEP290 domains form the Y-link connectors in mammalian cells, and does CEP290 itself
    span the microtubule-to-membrane distance or recruit other Y-link components?
- question: Is the nuclear pool of CEP290 and its reported effect on ATF4-dependent transcription physiologically
    relevant in renal epithelia?
- question: Is CEP290's role in ciliary vesicle maturation/RAB8A recruitment separable from its structural
    role in transition-zone assembly (e.g. by separation-of-function alleles)?
suggested_experiments:
- description: Cryo-electron tomography of the transition zone in CEP290-null RPE1 cells rescued with
    membrane-binding (amphipathic helix) or microtubule-binding deletion mutants, to map which domains
    are needed for Y-link formation.
  experiment_type: cryo-electron tomography and genetic rescue
- description: Correlative light/electron microscopy time course of ciliogenesis in CEP290-KO cells to
    determine whether distal appendage vesicles fuse into a ciliary vesicle but fail to recruit RAB8A,
    positioning CEP290 relative to EHD1-dependent CV formation.
  experiment_type: correlative light-electron microscopy
