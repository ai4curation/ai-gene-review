id: O15078
gene_symbol: CEP290
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEP290 is a large coiled-coil protein at the ciliary transition zone, centriolar
  satellites and photoreceptor connecting cilium. Its microtubule-binding and membrane-binding
  domains support ciliary organization and compartmentalization. CEP290 associates with PCM1,
  CEP131 and CCDC66 at centriolar satellites and helps recruit proteins needed for primary-cilium
  formation. Its interaction with CP110 contributes to the restraint of ciliogenesis. Conserved
  transition-zone assembly involves a hierarchy in which the Caenorhabditis elegans RPGRIP1L/RPGRIP1
  ortholog MKS-5 recruits CEP-290, which organizes MKS-module proteins. CEP290 also modulates
  ATF4-dependent transcription in human cells. Biallelic pathogenic variants cause a spectrum
  including Joubert, Meckel, Senior-Loken and Bardet-Biedl syndromes and Leber congenital amaurosis.
