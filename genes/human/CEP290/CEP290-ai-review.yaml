  review:
    summary: Conserved contribution to kidney development.
    action: KEEP_AS_NON_CORE
    reason: Retain the PAINT inference at PTN002706047. Zebrafish morpholino experiments in
      PMID:16682973 produce pronephric cysts; this supports a developmental contribution compatible
      with the conserved ciliary role, without making CEP290 a kidney-specific developmental
      regulator. The historical node reconstruction was not independently recovered; the extant
      evidence count is not a reason to reject the phylogenetic judgment.
