- description: Binds polymerized microtubules through a directly assayed human CEP290 domain
    (residues 1695–1966), contributing to the structural organization of the ciliary transition
    zone and its protein-localization barrier. The purified domain assay uses bovine microtubules;
    full-length cellular recruitment can depend on CEP162 and other partners. Together with
    separate lipid-binding activity this supports, but does not reconstitute, a native Y-link
    tether. The detailed MKS-module assembly hierarchy is supported in C. elegans rather than
    proven in full for human CEP290.
