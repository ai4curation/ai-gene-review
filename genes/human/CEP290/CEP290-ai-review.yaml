  review:
    summary: Nucleus (IDA from Sayer et al. 2006; IEA; ISS from mouse).
    action: KEEP_AS_NON_CORE
    reason: Sayer et al. reported cell-cycle-dependent nuclear CEP290 in renal epithelial cells. A nuclear
      pool is possible but its function (ATF4 modulation) has not been substantiated; the main functional
      sites are the centriolar satellites and the transition zone.
