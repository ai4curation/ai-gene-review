id: O15078
gene_symbol: CEP290
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEP290 (NPHP6, BBS14) is a very large (~290 kDa) coiled-coil scaffold protein that shuttles
  between centriolar satellites, the distal end of the mother centriole/basal body, and the ciliary transition
  zone, where it occupies a proximal core position close to the axoneme. It binds membranes through a
  conserved N-terminal amphipathic helix and microtubules through its central region, and in Chlamydomonas
  it is required to build the microtubule-to-membrane Y-link connectors that tether the ciliary membrane
  to transition-zone microtubules and to control ciliary protein composition. In mammalian cells CEP290
  is needed for ciliary vesicle maturation, for centrosomal and ciliary recruitment of RAB8A, and for
  ciliogenesis; this activity is restrained in cycling cells by CP110. It interacts with NPHP5/IQCB1 and
  the BBSome and supports ciliary trafficking of BBSome cargo. Mutations cause a spectrum of ciliopathies
  from Leber congenital amaurosis to nephronophthisis, Joubert, Senior-Loken, Bardet-Biedl and Meckel
  syndromes.
