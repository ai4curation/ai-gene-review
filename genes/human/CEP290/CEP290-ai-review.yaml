core_functions:
- description: CEP290 is a structural component of the proximal ciliary transition zone. It binds microtubules
    directly through its central myosin-tail-homology region and membranes through an N-terminal amphipathic
    helix, which allows it to bridge the axoneme and ciliary membrane at the Y-links. It assembles MKS-module
    proteins at the TZ downstream of RPGRIP1L/MKS5 and acts in the ciliary gate that controls membrane-protein
    entry and exit.
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  directly_involved_in:
  - id: GO:1905349
    label: ciliary transition zone assembly
  - id: GO:1904491
    label: protein localization to ciliary transition zone
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  supported_by:
  - reference_id: PMID:24051377
    supporting_text: Region M was found to directly and robustly bind to microtubules in a concentration-dependent
      manner (Figure 7 D).
  - reference_id: PMID:24051377
    supporting_text: we have shown that CEP290 is capable of directly binding to both cellular membranes
      and microtubules, possibly anchoring the two to each other and likely playing a key structural role
      in the maintenance of the cilium
  - reference_id: PMID:26982032
    supporting_text: we reveal Caenorhabditis elegans CEP-290 (mammalian Cep290/Mks4/Nphp6 orthologue)
      as a central assembly factor that is specific for established MKS module components and depends
      on the coiled coil region of MKS-5 (Rpgrip1L/Rpgrip1) for TZ localisation
- description: Through its N-terminal amphipathic-helix domain CEP290 binds lipid membranes directly;
    this membrane anchoring is part of its structural role at the TZ. Before ciliogenesis CEP290 cycles
    through centriolar satellites, where it helps maturation of the ciliary vesicle and ciliary recruitment
    of Rab8a and the BBSome. CP110 restrains this activity.
  molecular_function:
    id: GO:0008289
    label: lipid binding
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  - id: GO:0034451
    label: centriolar satellite
  supported_by:
  - reference_id: PMID:24051377
    supporting_text: CEP290 aa 1–580 associated with liposomes robustly, with a majority of the protein
      found in the liposome-associated fraction (Figure 3 A).
  - reference_id: PMID:18694559
    supporting_text: Ablation of CEP290 prevents ciliogenesis without affecting centrosome function or
      cell-cycle progression
  - reference_id: PMID:24421332
    supporting_text: Cep290 also acts subsequently, participating in the transition from PCV to CCV, downstream
      of centriolar satellite dispersal.
suggested_questions:
- question: Is the reported nuclear pool and ATF4 activation by CEP290 reproducible at endogenous levels,
    and does it have any role independent of cilia?
- question: How do the N- and C-terminal autoinhibitory domains of CEP290 regulate its microtubule- and
    membrane-binding activities in vivo, and is CP110 binding part of that switch?
suggested_experiments:
- description: Cryo-ET of transition zones in CEP290 knockout human cells rescued with microtubule-binding-deficient
    or amphipathic-helix mutants, to test whether each binding activity is needed to build Y-links.
