- term:
    id: GO:0005813
    label: centrosome
  evidence_type: IDA
  original_reference_id: PMID:14654843
  qualifier: located_in
  review:
    summary: Centrosome (IDA from several studies, including colocalization; IEA).
    action: ACCEPT
    reason: Multiple independent studies, including centrosome proteomics and the HPA (centrosome, Approved),
      detect CEP290 at the centrosome. In ciliated cells it sits at the distal end of the mother centriole/basal
      body where it nucleates the transition zone, and in cycling cells it is held there in a CP110 complex.
      A legitimate location for this centrosome-to-cilium protein.
    supported_by:
    - reference_id: PMID:16682973
      supporting_text: NPHP6 is found at centrosomes and in the nucleus of renal epithelial cells in a
        cell cycle-dependent manner and in connecting cilia of photoreceptors
    - reference_id: PMID:18694559
      supporting_text: CP110 interacts with CEP290--a protein whose deficiency is implicated in human
        ciliary disease--in a discrete complex separable from other CP110 complexes
