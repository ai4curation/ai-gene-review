    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9NRD5
  review:
    summary: CEP290 interaction with PICK1. High-throughput interactome screen; no functional characterization
      of the pair.
    action: REMOVE
    reason: GO:0005515 protein binding records that an interaction was detected but not what CEP290 does.
      Removing the generic term does not mean the interaction is false. The biologically important partnerships
      (CP110 at the centriole, PCM1/CEP131/CCDC66/CCDC13 at satellites, NPHP5 and the BBSome at the transition
      zone) are captured by localization and process annotations. CEP290's characterized molecular activities
      are direct microtubule and membrane binding, proposed here as NEW annotations.
