  review:
    summary: PAINT inference of kidney development.
    action: KEEP_AS_NON_CORE
    reason: Renal (pronephric) cysts follow CEP290 loss in zebrafish and nephronophthisis in patients.
      This is a downstream developmental consequence of cilium/TZ dysfunction, not a process CEP290 executes
      directly.
