- id: PMID:32415067
  title: Cooperative transport mechanism of human monocarboxylate transporter 2.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cryo-EM structure plus functional assays of human MCT2. Establishes homodimeric
      architecture, functionally required dimerization with strong positive cooperativity
      (Hill ~1.6), H+-coupled (proton-dependent) symport via Asp293, plasma-membrane
      localization, and substrate recognition. Full text verified.
- id: PMID:36115835
  title: Quantitative fragmentomics allow affinity mapping of interactomes.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Quantitative affinity mapping of PDZ-domain interactomes. The large set of MCT2 partners
      are PDZ scaffolds engaging its C-terminal PDZ-binding motif; yields only generic
      protein-binding rows.
- id: PMID:9786900
  title: Human monocarboxylate transporter 2 (MCT2) is a high affinity pyruvate transporter.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cloning and functional characterization of human MCT2 as an H+/monocarboxylate transporter
      with uniquely high pyruvate affinity (apparent Km 25 uM) and lactate transport activity.
      Abstract-only in cache; title/abstract support the pyruvate and lactate transporter
      activities and transport processes. PubMed-verified.
