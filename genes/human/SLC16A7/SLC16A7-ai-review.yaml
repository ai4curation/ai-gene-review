- id: PMID:26590417
  title: Establishment and Dysfunction of the Blood-Brain Barrier.
  findings: []
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      General review of blood-brain barrier biology; does not establish an MCT2-specific
      BBB-endothelial transport function. The BBB monocarboxylate transporter is MCT1; MCT2 is
      the neuronal/post-synaptic transporter. Used as the NAS basis for GO:0150104, which is an
      over-annotation for this gene.
- id: PMID:30126976
  title: Proteome-wide analysis of phospho-regulated PDZ domain interactions.
