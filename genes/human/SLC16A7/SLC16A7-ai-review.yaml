id: O60669
gene_symbol: SLC16A7
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC16A7 encodes monocarboxylate transporter 2 (MCT2), a plasma-membrane, proton-coupled
  (H+-linked) symporter that moves short-chain monocarboxylates - L-lactate, pyruvate and the
  ketone bodies acetoacetate and beta-hydroxybutyrate - across the membrane in an electroneutral
  1:1 H+:monocarboxylate symport. MCT2 is a 12-transmembrane major facilitator superfamily
  protein (monocarboxylate porter family) that functions as a homodimer with strong positive
  inter-subunit cooperativity. Among the MCTs it has the highest affinity for pyruvate
  (apparent Km ~25 uM) and lactate, making it the principal high-affinity monocarboxylate uptake
  transporter. It is prominently expressed in neurons, where it is the post-synaptic transporter
  of the astrocyte-neuron lactate shuttle, and in testis, kidney and sperm. Like other MCTs it
  associates with a single-pass ancillary glycoprotein for plasma-membrane trafficking - EMBIGIN
  (gp70) for MCT2, analogous to basigin/CD147 for MCT1/3/4 - forming a heteromeric transmembrane
  transporter complex.
