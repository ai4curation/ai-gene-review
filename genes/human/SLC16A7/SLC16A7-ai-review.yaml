- term:
    id: GO:0005477
    label: pyruvate secondary active transmembrane transporter activity
  evidence_type: TAS
  original_reference_id: PMID:9786900
  qualifier: enables
  review:
    summary: >-
      Secondary-active (proton-coupled) pyruvate transporter activity - the high-affinity
      pyruvate symport that defines MCT2.
    action: ACCEPT
    reason: >-
      Core molecular function. GO:0005477 is_a GO:0050833 pyruvate transmembrane transporter
      activity and is_a GO:0015355 secondary active monocarboxylate transmembrane transporter
      activity (QuickGO), so it correctly captures the proton-coupled/secondary-active character
      of MCT2's uniquely high-affinity pyruvate transport. The specific proton-coupled nature is
      confirmed structurally and functionally (Asp293-dependent H+ coupling).
    supported_by:
    - reference_id: PMID:9786900
      supporting_text: unique biochemical feature of human MCT2 is its high affinity for the transport
    - reference_id: PMID:32415067
      supporting_text: These data confirm an H+-coupled pyruvate transport of MCT2
