  qualifier: part_of
  review:
    summary: >-
      NEW. MCT2 is the transporter subunit of a heteromeric plasma-membrane transporter complex with
      its ancillary single-pass glycoprotein EMBIGIN (EMB), analogous to MCT1/3/4-basigin.
    action: NEW
    reason: >-
      MCT2 associates with the ancillary chaperone EMBIGIN (gp70), which mediates its plasma-membrane
      targeting (UniProt curated SUBUNIT, By similarity to rodent MCT2), analogous to the basigin
      (CD147) partner of MCT1/3/4. This heteromeric transporter complex is modeled as complex
      membership (GO:1902495 transmembrane transporter complex, part_of), mirroring the B0AT1-ACE2/
      collectrin treatment, rather than as a bare protein-binding row; EMBIGIN is not among the GOA
      IntAct partners, so there is no existing row to retain. Note the requirement is debated - the
      human cryo-EM study observed plasma-membrane localization without embigin co-expression in
      HEK293 cells.
    supported_by:
    - reference_id: UniProtKB:O60669
      supporting_text: Interacts with EMB; interaction mediates SLC16A7 targeting
      record_section:
      - CC:SUBUNIT
