proposed_new_terms: []
suggested_questions:
- question: >-
    Is EMBIGIN obligatory for MCT2 plasma-membrane trafficking and activity in native human tissues
    (neurons, testis, kidney), given that the human cryo-EM study observed surface localization without
    embigin in HEK293 cells?
- question: >-
    What is the quantitative substrate selectivity and H+:monocarboxylate stoichiometry of human MCT2
    for ketone bodies (acetoacetate, beta-hydroxybutyrate) relative to lactate and pyruvate?
suggested_experiments:
- description: >-
    Reconstitute human MCT2 with and without EMBIGIN in a defined system (proteoliposomes or
    surface-biotinylation in cells lacking endogenous MCTs/ancillary proteins) to resolve whether
    EMBIGIN is required for surface delivery and for catalytic activation.
- description: >-
    Electrophysiology and radiotracer flux assays across the monocarboxylate substrate range (lactate,
    pyruvate, acetoacetate, beta-hydroxybutyrate) to determine substrate-specific kinetics and confirm
    the 1:1 H+:monocarboxylate coupling of the cooperative MCT2 homodimer.
