id: Q9H3H1
gene_symbol: TRIT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TRIT1 is the human tRNA isopentenyltransferase (IPTase), the homolog of bacterial
  MiaA and yeast Mod5. It transfers the dimethylallyl group of dimethylallyl diphosphate onto
  N6 of adenosine 37, adjacent to the anticodon, forming N6-isopentenyladenosine (i6A37). Alternative
  splicing gives isoforms with or without an N-terminal mitochondrial targeting sequence, so
  TRIT1 acts both in the cytosol and in the mitochondrial matrix. Its substrate set is small
  - cytosolic tRNA(Ser) (AGA, CGA, UGA anticodons), partial modification of selenocysteine tRNA(Sec),
  and mitochondrial tRNA(Ser)(UCN) and tRNA(Trp) - and i6A37 supports translation efficiency
  and fidelity, selenoprotein expression and subsequent METTL8-dependent m3C32 modification
  of mt-tRNA(Ser)(UCN). The enzyme has a P-loop isopentenyltransferase domain that binds DMAPP
  and a C-terminal matrin-type zinc finger. Biallelic TRIT1 variants abolish i6A37 in cytosolic
  and mitochondrial tRNAs and cause combined oxidative phosphorylation deficiency 35 (developmental
  delay, microcephaly, seizures).
