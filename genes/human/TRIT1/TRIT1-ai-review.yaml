suggested_questions:
- question: What restricts human TRIT1 to so few A36-A37-A38 tRNAs compared with the yeast enzymes,
    and does the C-terminal zinc finger contribute to substrate selection?
- question: Do the cytosolic and mitochondrial TRIT1 pools contribute differently to COXPD35
    pathology?
suggested_experiments:
- description: Compartment-restricted rescue of TRIT1-null cells (mitochondrially targeted versus
    cytosol-only TRIT1) followed by i6A37 mapping and mitochondrial translation assays.
- description: In vitro binding and activity assays of TRIT1 lacking the zinc finger, with substrate
    and non-substrate A36-A38 tRNAs.
