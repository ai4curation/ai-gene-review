  review:
    summary: InterPro mapping of ATP binding from the P-loop NTPase fold of the isopentenyltransferase
      domain.
    action: REMOVE
    reason: tRNA isopentenyltransferases (MiaA/Mod5/TRIT1) retain a P-loop NTPase fold, but
      the P-loop binds the pyrophosphate of the prenyl donor dimethylallyl diphosphate (DMAPP),
      not ATP. TRIT1 transfers the dimethylallyl group of DMAPP to A37; no ATP-binding or ATP-dependent
      step is part of the reaction. The generic P-loop to ATP binding mapping is a known electronic
      over-reach.
