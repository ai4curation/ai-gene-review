core_functions:
- description: Oligomerizes at membrane necks and couples GTP hydrolysis to membrane remodeling and vesicle
    scission during endocytosis. PH-domain lipid binding and partner interactions recruit and regulate
    the machinery. In macroautophagy, SNX18-dependent recruitment supports an early ATG9A membrane-carrier
    route, whereas LC3-dependent recruitment supports release of nascent autophagosomes from recycling
    endosomes. The GTPase also supports cortactin-dependent remodeling of actin bundles.
  molecular_function:
    id: GO:0061791
    label: GTPase motor activity
  directly_involved_in:
  - id: GO:0099050
    label: vesicle scission
  - id: GO:0006898
    label: receptor-mediated endocytosis
  - id: GO:0016236
    label: macroautophagy
  - id: GO:0061572
    label: actin filament bundle organization
  locations:
  - id: GO:0005905
    label: clathrin-coated pit
  - id: GO:0055038
    label: recycling endosome membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:34744632
  - reference_id: PMID:19623537
  - reference_id: PMID:32315611
    supporting_text: This process is regulated by DNM2 binding to LC3
  - reference_id: PMID:19605363
    supporting_text: dynamin2 GTPase remodels actin filaments
  - reference_id: PMID:24970086
  - reference_id: PMID:36445308
  - reference_id: PMID:29437695
suggested_questions:
- question: How do sequence-authenticated human splice products partition between plasma-membrane endocytosis,
    Golgi export and recycling-endosome scission at endogenous abundance?
- question: Which cortactin-dependent actin-remodeling effects persist when membrane scission and receptor
    trafficking are experimentally separated?
- question: What controls the relative affinities and cellular recruitment effects of LC3B versus individual
    GABARAP-family partners?
suggested_experiments:
- hypothesis: Alternative stalk and PH-region segments alter recruitment or trafficking context without
    abolishing the shared motor chemistry.
  description: Compare the five sequence-authenticated human products at matched endogenous expression
    in DNM2 replacement cells, measuring receptor uptake, Golgi export, recycling-endosome scission and
    purified membrane fission in parallel.
  experiment_type: Isoform-resolved rescue and biochemical reconstitution
- hypothesis: DNM2 can remodel cortactin-containing actin bundles through a separable mechanochemical
    output.
  description: Use matched purified human DNM2 constructs and validated separation-of-function mutants
    to compare actin-bundle remodeling with membrane binding, GTP hydrolysis and fission; test the same
    constructs in controlled cellular rescue.
  experiment_type: Separation-of-function reconstitution
