  sequence_note: VSP_001325
  description: 866-residue splice product lacking canonical residues 516–519 (GEIL) in the pleckstrin-homology
    region.
- name: '3'
  id: P50570-3
  sequence_note: VSP_044280, VSP_001325
  description: 866-residue splice product with the alternative segment corresponding to canonical residues
