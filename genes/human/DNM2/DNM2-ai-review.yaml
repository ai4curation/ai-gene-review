- term:
    id: GO:0006914
    label: autophagy
  evidence_type: IDA
  original_reference_id: PMID:32315611
  qualifier: involved_in
  review:
    summary: DNM2 releases nascent autophagosomes from recycling endosomes during macroautophagy.
    action: MODIFY
    reason: The original study places DNM2 at LC3/RAB11A junctions and supports LC3-dependent scission
      and release with live imaging, depletion and recruitment-defective rescue. The HaloTag completion
      assay found unchanged open-phagophore numbers but accumulated completed autophagosomes and fewer
      autolysosomes; LC3 vesicles failed to detach. This supports macroautophagy, rather than assigning
      DNM2 the formation or closure of the double membrane. The paper explicitly separates this LC3 route
      from SNX18-dependent ATG9A traffic, which was not disrupted by these mutants. PI3P/Atg8 removal
      and directed autophagosome transport were not demonstrated, so maturation or localization terms
      are not substituted. Human endogenous evidence, rat HA constructs, current human recombinant-protein
      identity and unresolved gifted GFP-template species remain distinct.
    proposed_replacement_terms:
    - id: GO:0016236
      label: macroautophagy
    supported_by:
    - reference_id: PMID:32315611
- term:
    id: GO:0006914
    label: autophagy
  evidence_type: IMP
  original_reference_id: PMID:29437695
  qualifier: involved_in
  review:
    summary: DNM2 recruitment supplies membrane carriers for autophagosome assembly.
    action: MODIFY
    reason: Human-cell SNX18 WT versus DNM2-binding-deficient W38K experiments connect DNM2 recruitment
      to ATG9A exit from recycling endosomes, ATG16L1 recruitment and autophagic flux. DNM2 contributes
      mechanical carrier production supplying membranes for autophagosome assembly; it is not simply a
      cargo or a generic perturbation requirement. These are interaction-dependent trafficking/rescue
      assays, not a purified DNM2 fission assay. The later LC3-dependent release of completed autophagosomes
      in PMID:32315611 is a separate route and is not used to establish early formation here. The gifted
      dynamin-template species remains unresolved; no lipidation, engulfment or final closure activity
      is inferred.
    additional_reference_ids:
    - PMID:32315611
    proposed_replacement_terms:
    - id: GO:0000045
      label: autophagosome assembly
    supported_by:
    - reference_id: PMID:29437695
      supporting_text: Dynamin‐2 is involved in formation of ATG9A vesicles destined for the autophagosomes.
