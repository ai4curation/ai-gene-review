id: P50570
gene_symbol: DNM2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Dynamin-2 is a widely expressed mechanochemical GTPase that assembles on membranes and couples
  GTP hydrolysis to membrane remodeling and vesicle scission. Its pleckstrin-homology domain binds membrane
  lipids, while its proline-rich region engages recruitment and regulatory partners. It supports receptor-mediated
  endocytosis and recycling-endosome scission during autophagic membrane formation, and participates in
  cortactin-dependent actin-bundle remodeling. Cytosolic, membrane-associated and specialized neuronal
  or adhesion pools provide distinct cellular contexts for this machinery.
