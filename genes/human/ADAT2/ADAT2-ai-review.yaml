id: Q7Z6V5
gene_symbol: ADAT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ADAT2 is the catalytic subunit of the human ADAT2:ADAT3 tRNA-specific adenosine-34 deaminase
  complex. In the nucleus, the heterodimer converts adenosine 34 to inosine in eight precursor tRNA families,
  expanding wobble decoding capacity; ADAT3 supplies the non-catalytic tRNA-recognition partner that positions
  the anticodon loop in the ADAT2 active site.'
