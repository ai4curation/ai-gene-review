- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1914007
  - PANTHER:PTN000118391
  - PomBase:SPCC965.14c
  review:
    summary: Cytoplasmic localization is reported for ADAT2/ADAT3 but the curated reaction occurs in
      the nucleus.
    action: KEEP_AS_NON_CORE
    reason: Supported as a non-core localization. ADAT proteins can be detected diffusely in
      cytoplasm and nucleus, but the best-defined deamination of human A34-containing tRNAs acts on
      nuclear precursor tRNAs, so cytoplasm is retained as peripheral rather than as the core site
      of activity.
    supported_by:
    - reference_id: file:genes/human/ADAT2/ADAT2-uniprot.txt
      supporting_text: diffused expression pattern in both the cytoplasm and the nucleus
      record_section:
      - CC:SUBCELLULAR LOCATION
    - reference_id: file:interpro/panther/PTHR11079/PTHR11079-paint.tsv
      supporting_text: "PTHR11079\tPTN000118391"
