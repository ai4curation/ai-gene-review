- term:
    id: GO:0021852
    label: pyramidal neuron migration to cerebral cortex
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6P6J0
  - ensembl:ENSMUSP00000019944
  review:
    summary: ADAT2 is required for neuronal migration through tRNA I34-dependent translation, not by
      executing the migration program directly.
    action: MARK_AS_OVER_ANNOTATED
    reason: The ADAT2/ADAT3 enzyme modifies tRNAs. Mouse depletion and rescue data show that the
      complex activity is necessary for radial projection-neuron migration, but the paper argues for
      an indirect translational mechanism in which affected neuronal-migration transcripts are
      enriched for ADAT-dependent codons; the enzyme is therefore upstream of, rather than a direct
      participant in, pyramidal neuron migration.
    supported_by:
    - reference_id: PMID:40120092
      supporting_text: specific translational impairment of neuronal migration genes
    - reference_id: PMID:40120092
      supporting_text: Yet, the identity of affected proteins and how mutant ADAT3 impairs
