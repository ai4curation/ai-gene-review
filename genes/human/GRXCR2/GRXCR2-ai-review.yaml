id: A6NFK2
gene_symbol: GRXCR2
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRXCR2 supports hearing and stereocilia organization. Mouse studies place the protein at
  the stereocilium base and link it to restricted taperin distribution. A recessive human variant causes
  sensorineural hearing loss; its biochemical activity remains unresolved.
