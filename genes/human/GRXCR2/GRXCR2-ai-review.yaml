id: A6NFK2
gene_symbol: GRXCR2
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRXCR2 supports hearing and stereocilia organization. Mouse studies associate it with basal
  taperin restriction. A human recessive variant causes hearing loss; GRXCR2’s biochemical activity remains
  unresolved. It lacks a canonical glutaredoxin domain.
