suggested_questions:
- question: Is the natural 405-residue P18074-2 product expressed as a stable protein, and can it assemble
    into TFIIH or perform any ATPase, helicase or adaptor function?
- question: Which original microscopy, purification and perturbation controls in PMID:20797633 establish XPD
    spindle localization and a complete MMXD assembly separately from transient CIA-client complexes?
- question: What exact ERCC2–GTF2H2C record in PMID:25416956 and ERCC2–BRAF WT-versus-mutant record in PMID:35512704
    support the imported interaction assertions?
- question: Which cell type and primary differentiation experiment underlie the hair-cell annotation from PMID:11335038,
    given the current epidermal-cell and neuron-differentiation parents of GO:0035315?
- question: How does purified human XPD discriminate damaged DNA under controlled nucleotide and DNA-topology
    conditions, beyond the ancestral yeast RAD3 evidence and lesion-free human TFIIH structures?
- question: Which human transcription-coupled-repair experiments distinguish XPD DNA unwinding from XPB translocation
    and directly test the proposed RNA-polymerase-backtracking steps?
core_functions:
- description: Canonical full-length XPD uses ATP to unwind DNA in the 5′–3′ direction within TFIIH, contributing
    DNA opening during nucleotide-excision repair. Human XPD-dependent motor and repair assays establish this
    catalytic role separately from XPB translocation and the downstream incision reactions.
  molecular_function:
    id: GO:0043139
    label: 5'-3' DNA helicase activity
  directly_involved_in:
  - id: GO:0006289
    label: nucleotide-excision repair
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0000439
    label: transcription factor TFIIH core complex
  supported_by:
