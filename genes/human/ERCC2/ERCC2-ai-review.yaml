id: P18074
gene_symbol: ERCC2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ERCC2 encodes XPD, an iron–sulfur DNA helicase and structural subunit of the general transcription
  factor TFIIH. The canonical 760-residue protein uses ATP to unwind DNA in the 5′–3′ direction during nucleotide-excision
  repair. Its repair activity is coordinated with XPB, XPA and XPG, while the nuclease reactions are performed
  by other repair proteins. In RNA-polymerase-II transcription initiation, XPD helps organize TFIIH and connect
  its core to the CDK-activating kinase module through protein contacts; XPD itself is not the associated protein
  kinase. XPD is predominantly nuclear, with a cytoplasmic pool that interacts with the CIA iron–sulfur maturation
  machinery as a client. A reported 405-residue splice isoform lacks much of the canonical C-terminal region,
  and its biochemical activity and cellular roles remain unestablished.
