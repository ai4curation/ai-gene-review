  supporting_entities:
  - UniProtKB:P51948
  review:
    summary: XPD–MAT1 association supports the scaffold connection between CAK and core TFIIH.
    action: MODIFY
    reason: The cited original reports MAT1–XPD interaction, but the complete publisher article was not recovered;
      for PMID:11445587 only indexed original Methods/initial Results were recovered. Independent human CAK–ERCC2
      purification and transcription reconstitution in PMID:8692842 Figures 3–6, together with the XPD–MAT1
      interface and module-dependent architecture in PMID:31253769 Figure 4, support the more informative adaptor
      role. This is complex organization, not XPD kinase activity. Current GO:0030674 explicitly distinguishes
      integral protein-complex scaffolds from generic adaptors. XPD is an integral TFIIH subunit whose human
      assembly/reconstitution and interface evidence supports holding the p44-associated core and CAK module
      together. Refine this structural role to GO:0140378 protein complex scaffold activity. This does not
      claim transient recruitment of a particular kinase substrate, kinase catalysis by XPD, or equivalent
      function of the 405-residue natural product.
