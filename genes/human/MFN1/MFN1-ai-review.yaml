suggested_questions:
- question: Why does human MFN2, rather than MFN1, acquire specialized roles in Charcot-Marie-Tooth neuropathy,
    Miro/TRAK transport, and PINK1/Parkin mitophagy despite sharing the core outer-membrane fusion mechanism
    with MFN1?
suggested_experiments:
- description: Compare acute, single-endogenous-locus depletion and rescue of MFN1 and MFN2 in a matched
    human cell type to separate shared outer-membrane fusion activity from MFN2-specific ER-contact, transport,
    or mitophagy functions.
