id: Q8IWA4
gene_symbol: MFN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Mitofusin 1 (MFN1) is a dynamin-superfamily GTPase anchored in the mitochondrial outer membrane
  by paired transmembrane helices, with its catalytic G domain and helical bundle regions facing the cytosol.
  MFN1 oligomerizes on opposing mitochondria, uses nucleotide-dependent G-domain dimerization and GTP
  hydrolysis to tether membranes in trans, and drives mitochondrial outer-membrane fusion together with
  its paralog MFN2 and OPA1-dependent inner-membrane fusion.
