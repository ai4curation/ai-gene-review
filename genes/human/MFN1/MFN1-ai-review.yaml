- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IDA
  original_reference_id: PMID:27920125
  qualifier: enables
  review:
    summary: Accepted MFN1 GTPase activity.
    action: ACCEPT
    reason: MFN1 has a core dynamin-family GTPase activity. Purified human MFN1 GTPase-domain constructs
      bind guanine nucleotides and hydrolyze GTP, and MFN1 catalytic-site or G-domain interface substitutions
      impair GTPase activity and mitochondrial elongation in Mfn1/2-null rescue assays.
    supported_by:
    - reference_id: PMID:27920125
      supporting_text: Consistently, the GTPase activity of MFN1 was lower than that of Sey1p
    - reference_id: PMID:28114303
      supporting_text: Both Mfn1E209A and Mfn1R238A, as well as the corresponding Mfn2 mutants Mfn2E230A
        and Mfn2R259A, failed to elongate mitochondria
    - reference_id: file:human/MFN1/MFN1-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: GTP + H2O = GDP + phosphate + H(+)
