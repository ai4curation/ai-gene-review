core_functions:
- description: Catalyzes NADPH-dependent reduction of the sterol side-chain delta-24 double bond during
    cholesterol biosynthesis, including conversion of desmosterol to cholesterol at the endoplasmic reticulum
    membrane. FAD supports catalytic activity.
  molecular_function:
    id: GO:0050614
    label: Delta24-sterol reductase activity
  directly_involved_in:
  - id: GO:0006695
    label: cholesterol biosynthetic process
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  substrates:
  - id: CHEBI:17737
    label: desmosterol
  supported_by:
  - reference_id: PMID:11519011
    supporting_text: Conversion of desmosterol to cholesterol by DHCR24 in vitro
  - reference_id: PMID:11007892
  - reference_id: UniProt:Q15392
- description: Binds p53 during oncogenic and oxidative stress and interferes with its association with
    MDM2, supporting p53 accumulation. Human recombinant binding experiments and separation-of-function
    mutants distinguish this interaction mechanism from sterol reductase activity. Broader growth responses
    and reported nuclear localization remain context-dependent; they are not separate core processes or
    an established location of the binding event.
  molecular_function:
    id: GO:0002039
    label: p53 binding
  supported_by:
  - reference_id: PMID:15577914
    supporting_text: Seladin-1 binds p53 amino terminus and displaces E3 ubiquitin ligase Mdm2 from p53
  knowledge_gaps:
  - gap_statement: The compartment and trafficking route in which endogenous membrane-associated DHCR24
      engages p53 during stress remain unresolved.
    boundary: Human recombinant competition assays and catalytically inactive N294T/K306N separation-of-function
      experiments support the binding mechanism. Human stress-associated nuclear fractionation is reported,
      but it does not localize the interaction itself or establish how the ER-associated pool reaches p53.
    resolution: Resolve endogenous DHCR24–p53 association and DHCR24 membrane topology in the same human
      cells before and after defined stress, with compartment and isoform controls.
    provenance:
    - reference_id: PMID:15577914
    - reference_id: PMID:27919032
