id: Q15392
gene_symbol: DHCR24
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DHCR24 encodes an FAD-associated, NADPH-dependent sterol reductase that reduces side-chain
  delta-24 double bonds during cholesterol biosynthesis, including conversion of desmosterol to cholesterol.
  It associates strongly with the endoplasmic reticulum membrane, with a Golgi pool also observed in human
  cells; its precise membrane topology remains incompletely resolved. Sterol synthesis supports membrane
  organization and influences protein partitioning and amyloid precursor protein processing. A separable
  p53-binding mechanism contributes to oncogenic and oxidative stress responses in experimental cell systems.
  Biallelic loss of function causes desmosterolosis.
