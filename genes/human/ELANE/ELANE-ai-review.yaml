core_functions:
- description: Catalyzes serine-dependent cleavage of internal peptide bonds in host and microbial proteins,
    contributing to antibacterial defense and extracellular matrix disassembly. In defined NET-formation
    pathways, cytosolic actin and nuclear histone cleavage support progression to chromatin decondensation
    and NET release.
