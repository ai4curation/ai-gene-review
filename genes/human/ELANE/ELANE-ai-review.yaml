    summary: The cited interaction concerns cleavage of a protease inhibitor, not binding to a protease
      partner.
    action: REMOVE
    reason: GO:0002020 requires a protease or peptidase as the binding partner. The imported partner P08697
      is human SERPINF2/alpha-2-antiplasmin. In the original study, purified human leukocyte elastase
      cleaves and inactivates plasma alpha-2-plasmin inhibitor; the inhibitor does not inhibit elastase
      amidolytic activity under the tested conditions. This is positive enzyme–substrate evidence but
      does not support this source-specific protease-binding assertion. The demonstrated proteolysis is
