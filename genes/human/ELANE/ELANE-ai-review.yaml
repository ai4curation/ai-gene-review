id: P08246
gene_symbol: ELANE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ELANE encodes neutrophil elastase, a serine endopeptidase produced as a precursor and stored
  predominantly in azurophilic granules of neutrophils. Proteolysis of microbial and host proteins contributes
  to antibacterial defense and extracellular matrix breakdown, with catalytically active enzyme also present
  at the cell surface and in the extracellular region. During defined neutrophil activation pathways,
  a transient cytosolic and nuclear pool cleaves actin and histones and promotes chromatin decondensation
  and neutrophil extracellular trap formation.
