  review:
    summary: ELANE enhances GFI1-mediated transcriptional repression in the reported cellular assays.
    action: KEEP_AS_NON_CORE
    reason: Human ELANE constructs increase GFI1-dependent reporter repression in mouse NIH 3T3 cells,
      and ELANE knockdown increases AZU1 transcript abundance in human HL-60 cells. The latter assay uses
      AZU1 as a feedback readout rather than directly measuring autorepression of ELANE after its depletion.
      Reporter activity is retained by an author-numbered S173A catalytically inactive construct, separating
      the measured coregulatory effect from proteolysis. This experimentally supported context is retained
      without making it the principal protease function or claiming a direct DNA-binding activity.
