    - reference_id: Reactome:R-HSA-9932836
      supporting_text: "cBAF assembly continues with the addition of a DPF protein (Double\
        \ PHD Finger),\n  a defining constituent of the complex (Mashtalir et al, 2018; Mashtalir\
        \ et al, 2020).\n  Three mutually exclusive DPF proteins may form part of the cBAF\
        \ complex, DPF1 (also\n  known as BAF45B), DPF2 (BAF45D) or DPF3 (BAF45C). The DPF\
        \ subunit forms part of\n  the base module of the SWI/SNF complex that contacts the\
        \ nucleosome, and DPF proteins\n  are recruited through interaction with ARID and\
        \ SMARCC proteins (He et al, 2020).\n  DPF proteins bind to acetylated tails of histone\
        \ H3 and H4 (Hyun et al, 2024; Lange\n  et al, 2008; Huber et al, 2017). Selective\
        \ incorporation of DPF1, 2 or 3 in the\n  cBAF complex may reflect cell type specificity\
        \ or stage in development (Lange et\n  al, 2008 Lessard et al, 2007)."
