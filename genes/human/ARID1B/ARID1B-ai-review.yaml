taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARID1B (BAF250B/p250R) is a nuclear DNA-binding and assembly subunit of canonical
  mammalian SWI/SNF chromatin-remodeling complexes. Its ARID region binds DNA without an established
  sequence preference, and other regions associate with the SMARCA2 or SMARCA4 ATPase and
  additional complex subunits. ARID1B and ARID1A are mutually exclusive alternatives in these
  assemblies, coupling DNA engagement and regulatory recruitment to ATP-dependent nucleosome
  remodeling. Human ARID1B also supports steroid-receptor transcriptional coactivation in
  tested cellular contexts. ARID1B-dependent gene regulation is important in development,
  and pathogenic loss of function causes Coffin–Siris syndrome.
