  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9932437
  qualifier: located_in
  review:
    summary: ARID1B-containing cBAF assembly is consistent with nucleoplasmic localization.
    action: ACCEPT
    reason: The actual event explicitly distinguishes ARID1A- and ARID1B-containing cBAF assembly
      and DNA/ATPase contacts. Independent human localization supports its nucleoplasmic pool;
      ARID1B is not assigned ATP hydrolysis.
    supported_by:
    - reference_id: file:human/ARID1B/ARID1B-notes.md
      supporting_text: The inspected Human Protein Atlas ARID1B table reports supported nucleoplasm
        localization; plasma-membrane and cytosolic signals are uncertain. This supports a
        human nuclear pool without assigning exclusive localization or reinterpreting image
        pixels.
    - reference_id: Reactome:R-HSA-9932437
      supporting_text: "Recruitment of ARID1A or ARID1B to the forming cBAF complex represent\
        \ a branching\n  point that distinguishes it from pBAF, which contains ARID2 (Mashtalir\
        \ et al, 2018;\n  Mashtalir et al, 2020; He et al, 2020; Euskirchen et al, 2012).\
        \ ARID1A and ARID1B\n  extensively cross-link with core components of the assembling\
        \ complex including\n  SMARCC, SMARCD, SMARCB1 and SMARCE1 (Mashtalir et al, 2018).\
        \ The ARID subunit in\n  turn is responsible for making many of the contacts with\
        \ the catalytic ATPase module\n  as well as non-specifically with DNA (Mashtalir et\
        \ al, 2018; Mashtalir et al 2020;\n  reviewed in Euskirchen et al, 2012). <br>The\
        \ functions of ARID1A- versus ARID1B\n  -containing complexes are overlapping yet\
        \ distinct, with both shared and unique\n  genomic targets and different expression\
        \ patterns. ARID1A expression is high in\n  embryonic stem cells and ARID1B expression\
        \ is activated during differentiation (Staahl\n  et al, 2013; Staahl and Crabtree,\
        \ 2013; Raab et al, 2015; reviewed in Pagliaroli\n  and Trizzino, 2021). ARID1A and\
        \ ARID1B are highly mutated in many cancers and in\n  a range of neurodevelopmental\
        \ disorders (reviewed in Bogershausen and Wollnick,\n  2018; Pagliaroli and Trizzino,\
        \ 2021; Cenik and Shilatifard, 2021; Wang and Tang,\n  2023)"
