id: Q99943
gene_symbol: AGPAT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AGPAT1, also called LPAAT-alpha, is an endoplasmic-reticulum membrane
  lysophosphatidic acid acyltransferase. It transfers acyl groups from acyl-CoA
  donors to the sn-2 position of lysophosphatidic acid, producing phosphatidic
  acid for de novo glycerophospholipid synthesis and the CDP-diacylglycerol
  branch.
