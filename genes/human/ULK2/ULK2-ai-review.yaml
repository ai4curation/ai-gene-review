id: Q8IYT8
gene_symbol: ULK2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ULK2 is an ATP-dependent serine/threonine kinase in the mammalian Atg1/ULK
  autophagy-initiation branch. During starvation-regulated autophagy, ULK2 uses
  its kinase activity and C-terminal membrane-association region to promote
  autophagosome assembly at the phagophore assembly site and early autophagic
  membranes. The conserved ULK2 pathway can be redeployed in selective autophagy
  contexts, and the ULK1/2 kinase clade also has a non-core neuronal role in
  axon growth.
