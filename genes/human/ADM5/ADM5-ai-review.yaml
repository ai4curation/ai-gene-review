id: C9JUS6
gene_symbol: ADM5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ADM5 is the human member of the adrenomedullin-5 branch of the calcitonin gene-related peptide
  (CGRP)/adrenomedullin peptide family, and in humans it is almost certainly a non-functional remnant
  rather than a working hormone gene. In vertebrates that retain it, AM5 is a secreted prohormone whose
  mature peptide sits in the middle of the precursor, is closed by an intramolecular disulfide ring and
  is C-terminally alpha-amidated; it lowers arterial pressure and total peripheral resistance and raises
  cardiac output and plasma renin activity when given peripherally, while central administration is vasopressor
  and drives oxytocin release. In teleost fish and amphibians AM5 signals through the calcitonin receptor-like
  receptor with RAMP3, but the mammalian peptide activates no CLR or CTR/RAMP combination, so its mammalian
  receptor is unidentified. The human gene is the exception within the family: a nucleotide deletion in
  the mature AM5 coding sequence occurred in anthropoids after divergence from the rhesus monkey, and
  the human protein, while retaining an N-terminal signal peptide and the disulfide ring cysteines, has
  lost the glycine-dibasic amidation signal that every active peptide of this family requires - it contains
  no such motif anywhere, whereas the functional pig orthologue has two. Human ADM5 is therefore best
  understood as a degenerate prohormone locus: still transcribed and still carrying a secretion signal,
  but unable to yield an amidated adrenomedullin-family peptide. Its functional paralogues ADM and ADM2
  carry out the corresponding physiology in humans.'
