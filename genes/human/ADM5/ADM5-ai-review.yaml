  supporting_entities:
  - PANTHER:PTN000602075
  - RGD:2047
  - UniProtKB:P35318
  - UniProtKB:Q7Z4H4
  review:
    summary: 'Extracellular region. This is the one propagated feature the human sequence still supports:
      the signal peptide is intact, so if the transcript is translated the product would enter the secretory
      pathway.'
    action: ACCEPT
    reason: 'Unlike every functional term on this gene, secretion does not depend on the mature peptide
      surviving. UniProt annotates a signal peptide over residues 1-18 [file:genes/human/ADM5/ADM5-uniprot.txt
      "SIGNAL          1..18"] and places the product in the secreted compartment [file:genes/human/ADM5/ADM5-uniprot.txt
      "SUBCELLULAR LOCATION: Secreted"]. A degenerate prohormone that retains its signal peptide is still
      routed for secretion, so this annotation remains defensible even though the peptide it would release
      is non-functional. Worth noting that the donors here are all ADM/ADM2 paralogs rather than ADM5
      orthologs, so the term is accepted on the human sequence''s own features rather than on the strength
      of the propagation.'
    additional_reference_ids:
    - file:genes/human/ADM5/ADM5-uniprot.txt
    supported_by:
    - reference_id: file:genes/human/ADM5/ADM5-uniprot.txt
      supporting_text: SIGNAL          1..18
    - reference_id: file:genes/human/ADM5/ADM5-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Secreted'
