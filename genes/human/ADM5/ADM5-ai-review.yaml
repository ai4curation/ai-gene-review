- id: PMID:18434369
  title: Central and peripheral cardiovascular actions of adrenomedullin 5, a novel member of the calcitonin
    gene-related peptide family, in mammals.
  findings:
  - statement: The mature AM5 coding sequence is deleted in anthropoids, including human, after divergence
      from the rhesus monkey. This is the basis for treating human ADM5 as a non-functional remnant.
    supporting_text: In primates, nucleotide deletion occurred in the mature AM5 sequence in anthropoids
      (human and chimp) during transition from the rhesus monkey.
  - statement: A functional AM5 prohormone carries signals for ring formation and C-terminal amidation,
      the two features tested against the human sequence in this review.
    supporting_text: Putative mature AM5 was localized in the middle of prohormone and had potential signals
      for intermolecular ring formation and C-terminal amidation.
  - statement: Mammalian AM5 does not activate any CLR or CTR combination with RAMP1-3, so it does not
      act through the adrenomedullin receptor.
    supporting_text: did not induce appreciable increases in cAMP production in any combination
  - statement: The authors conclude AM5 acts through an unidentified receptor rather than CLR/CTR+RAMP.
    supporting_text: These data indicate that AM5 seems to act on as yet unknown receptor(s) for AM5,
      other than CLR/CTR+RAMP, to exert central and peripheral cardiovascular actions in mammals.
  - statement: Intravenous synthetic AM5 lowers arterial pressure in rats without changing heart rate.
    supporting_text: Synthetic mature AM5 injected intravenously into rats induced dose-dependent decreases
      in arterial pressure at 0.1-1 nmol/kg without apparent changes in heart rate.
  - statement: AM5 produced no change in urine flow or urinary sodium at any dose in rats.
    supporting_text: AM5 did not cause significant changes in urine flow and urine Na+ concentration at
      any dose.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached record is abstract-only; every quote above is from the abstract and was checked
      verbatim. This is the single most important reference for the review and is also the paper UniProt
      cites with an experimental evidence code for its 'probable non-functional remnant' statement about
      human ADM5. It is simultaneously the best evidence that AM5 is a real mammalian hormone and the
      best evidence that the human gene is not one.
- id: PMID:21436721
  title: Hemodynamic, hormonal, and renal actions of adrenomedullin-5 in normal conscious sheep.
  findings:
  - statement: AM5 infusion lowers mean arterial pressure and peripheral resistance and raises heart rate
      and cardiac output in normal sheep.
    supporting_text: intravenous infusions of AM-5 administered to normal conscious sheep induced significant
      hemodynamic actions including reduced mean arterial pressure and calculated total peripheral resistance
      and increased heart rate and cardiac output
  - statement: Urine volume and sodium excretion were unchanged, contradicting the regulation of urine
      volume annotation in a second mammal.
    supporting_text: Urine volume and sodium excretion were unchanged.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached record is abstract-only. Establishes the cardiovascular actions of the AM5 peptide
      in a second mammal, and independently contradicts the urine-volume annotation. Relevance is MEDIUM
      rather than HIGH because it concerns the sheep peptide, not the human gene product, which cannot
      be produced.
- id: PMID:17092606
  title: Evolutionary history of the calcitonin gene-related peptide family in vertebrates revealed by
    comparative genomic analyses.
  findings:
  - statement: AM5 is an ancestral member of the CGRP/adrenomedullin family, identified as a distinct
      gene in several mammalian species.
    supporting_text: we identified a novel AM5 gene in several mammalian species as we previously did
      for AM2
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached record is abstract-only. Supplies the phylogenetic framing that makes the PANTHER
      node placement reasonable. Note that the primate-deletion detail attributed to this paper in the
      affinage record is not in the cached abstract; the quotable statement of it is in PMID:18434369,
      which is what this review cites for that claim.
- id: file:genes/human/ADM5/ADM5-bioinformatics/RESULTS.md
  title: Does human ADM5 retain what a functional adrenomedullin-family peptide needs?
  findings:
  - statement: The disulfide ring is retained in human ADM5, which is why similarity- and phylogeny-based
      methods still reach this gene.
    supporting_text: '| Disulfide ring | C38–C43 | C39–C44 | **retained** |'
  - statement: Human ADM5 contains no glycine-dibasic amidation motif anywhere in its sequence, while
      the functional pig orthologue contains two. This test does not depend on the alignment.
    supporting_text: '| `G[KR][KR]` anywhere in the protein | **two** (pos 68 `GRK`, pos 78 `GRR`) | **none**
      | **lost** |'
  - statement: 'The combination of a retained ring and a lost amidation signal is the informative one:
      the feature that keeps the sequence looking plausible survived, the feature that licenses receptor
      activation did not.'
    supporting_text: '**The ring survived; the amidation signal did not.**'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Analysis written for this review; script, raw output and stated limitations are in
      genes/human/ADM5/ADM5-bioinformatics/. Sequences and features are fetched live from the UniProt
      REST API and the alignment is computed, so nothing is hardcoded. It reaches UniProt''s ''non-functional
      remnant'' conclusion independently. Its limitations are recorded in the file: two sequences only,
      a motif argument rather than a measurement, and it cannot exclude an unrelated acquired function.'
- id: file:genes/human/ADM5/ADM5-uniprot.txt
  title: UniProtKB C9JUS6 (ADM5_HUMAN) flat file
  findings:
  - statement: UniProt's curated function line calls human ADM5 a probable non-functional remnant.
    supporting_text: Probable non-functional remnant of adrenomedullin-5.
  - statement: The signal peptide is intact, which is why the extracellular-region annotations survive
      this review.
    supporting_text: SIGNAL          1..18
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Machine-fetched UniProt record. The function statement carries an experimental evidence
      code pointing at PMID:18434369. The entry has no mature-peptide feature and no amidation site, in
      contrast to the pig orthologue A5LHG2, which annotates both.
- id: file:genes/human/ADM5/ADM5-deep-research-affinage.md
  title: Affinage mechanistic annotation for ADM5 (human)
  findings:
  - statement: The affinage narrative describes AM5 biology as though it applied to the human gene, opening
      by asserting that ADM5 functions as a secreted regulator of cardiovascular, fluid and neuroendocrine
      homeostasis.
    supporting_text: ADM5 (adrenomedullin 5) is an evolutionarily ancient member of the calcitonin gene-related
      peptide (CGRP)/adrenomedullin peptide family that functions as a secreted regulator of cardiovascular,
      fluid, and neuroendocrine homeostasis
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Automated trust gates passed (accession matches C9JUS6, no non-human organism token,
      pairwise self-evaluation ''win''), and its nine citations are all real and correctly summarised
      - precision is not the problem. The problem is framing. Every functional experiment it cites is
      in pufferfish, medaka, Xenopus, pig, rat or sheep, yet the narrative is written as a description
      of the human gene and never mentions that the human mature peptide is deleted, even though its own
      2006 dated finding records the anthropoid deletion. Taken at face value this record would have produced
      eight ACCEPTs. Marked DISPUTED for that reason: correctly cited, but the claim it advances about
      this gene is contested by UniProt and by the sequence. Used here for literature discovery only.'
