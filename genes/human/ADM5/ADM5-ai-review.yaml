      "In primates, nucleotide deletion occurred in the mature AM5 sequence in anthropoids (human and
      chimp) during transition from the rhesus monkey."]. (2) UniProt's curated function line for C9JUS6
      reads [file:genes/human/ADM5/ADM5-uniprot.txt "Probable non-functional remnant of adrenomedullin-5."],
      attributed with an experimental evidence code to that same study, and the entry carries no mature-peptide
      feature, no amidation site and protein existence only at transcript level. (3) An independent sequence
      analysis run for this review finds the ring intact but the amidation signal gone [file:genes/human/ADM5/ADM5-bioinformatics/RESULTS.md
