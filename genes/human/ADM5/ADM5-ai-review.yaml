      test is decisive [file:genes/human/ADM5/ADM5-bioinformatics/RESULTS.md "| `G[KR][KR]` anywhere in
      the protein | **two** (pos 68 `GRK`, pos 78 `GRR`) | **none** | **lost** |"]. C-terminal alpha-amidation
      is required for receptor activation throughout the CGRP/adrenomedullin family. Separately, the donor
      set for this row is dominated by paralogs rather than by ADM5 orthologs. PANTHER node PTN000602075
      spans ADM, ADM2 and ADM5, so the functions of the well-characterised human paralogs ADM (P35318)
      and ADM2/intermedin (Q7Z4H4) are propagating onto the ADM5 remnant. This is the best-evidenced of
      the propagated functions and it is still not transferable. The vasodepressor effect is real for
      synthetic mature AM5 [PMID:18434369 "Synthetic mature AM5 injected intravenously into rats induced
      dose-dependent decreases in arterial pressure at 0.1-1 nmol/kg without apparent changes in heart
      rate."] and in sheep [PMID:21436721 "intravenous infusions of AM-5 administered to normal conscious
      sheep induced significant hemodynamic actions including reduced mean arterial pressure and calculated
      total peripheral resistance and increased heart rate and cardiac output"]. Every one of those experiments
