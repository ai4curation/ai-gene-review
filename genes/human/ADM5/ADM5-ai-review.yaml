suggested_questions:
- question: Should human ADM5 be reclassified as a pseudogene or unitary pseudogene? UniProt already calls
    it a probable non-functional remnant and gives it protein existence at transcript level only, but
    HGNC and Ensembl still treat it as protein-coding, and it retains seven GO annotations describing
    hormone physiology.
- question: Is the ADM5 transcript translated at all in human tissues, and is any product detectable by
    mass spectrometry? The signal peptide and disulfide ring are intact, so a secreted but inactive polypeptide
    is possible, and that is the only scenario in which the extracellular-region annotations retained
    here have real content.
- question: What is the mammalian AM5 receptor? The peptide has clear cardiovascular actions in pig, rat
    and sheep yet activates no CLR or CTR/RAMP combination, so the pathway term applied to this family
    may be wrong for AM5 in every mammal, not only in human.
- question: Should PANTHER node PTN000602075 be split? Propagating ADM and ADM2 physiology across a node
    that also contains a degenerate ADM5 is what produced six unsupportable annotations here, and the
    same node will do the same for ADM5 in other anthropoids.
suggested_experiments:
- description: Targeted mass spectrometry of human plasma and of spleen/thymus tissue - the sites where
    pig ADM5 is most abundant - for peptides from the human ADM5 ORF, to establish whether anything is
    translated and secreted.
- description: Synthesise the human ADM5 sequence corresponding to the pig mature peptide, with and without
    artificial C-terminal amidation, and test both for vasoactivity and for cAMP generation alongside
    pig AM5. This would convert the motif argument in the bioinformatics analysis into a measurement.
- description: Reconstruct the primate ADM5 locus across rhesus, chimpanzee and human to date the deletion
    precisely and confirm it is a unitary pseudogenisation event rather than an annotation artefact of
    one reference assembly.
- description: Deorphanise the mammalian AM5 receptor by expression cloning or affinity capture with labelled
    pig AM5, since the current pathway annotation across the whole family rests on a receptor assignment
    that failed in mammalian cells.
