- term:
    id: GO:1990410
    label: adrenomedullin receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000602075
  - UniProtKB:P35318
  - UniProtKB:Q7Z4H4
  review:
    summary: Adrenomedullin receptor signaling, propagated only from ADM and ADM2. The one mammalian experiment
      on AM5 itself explicitly failed to activate any CLR/CTR-RAMP combination.
    action: REMOVE
    reason: Human ADM5 is not a functional adrenomedullin-family hormone, so no activity or process that
      depends on the mature amidated peptide can be executed by this gene product. Three independent lines
      converge. (1) The mature peptide coding sequence is deleted in our lineage specifically [PMID:18434369
      "In primates, nucleotide deletion occurred in the mature AM5 sequence in anthropoids (human and
      chimp) during transition from the rhesus monkey."]. (2) UniProt's curated function line for C9JUS6
      reads [file:genes/human/ADM5/ADM5-uniprot.txt "Probable non-functional remnant of adrenomedullin-5."],
      attributed with an experimental evidence code to that same study, and the entry carries no mature-peptide
      feature, no amidation site and protein existence only at transcript level. (3) An independent sequence
      analysis run for this review finds the ring intact but the amidation signal gone [file:genes/human/ADM5/ADM5-bioinformatics/RESULTS.md
      "**The ring survived; the amidation signal did not.**"]; the alignment-independent form of that
      test is decisive [file:genes/human/ADM5/ADM5-bioinformatics/RESULTS.md "| `G[KR][KR]` anywhere in
      the protein | **two** (pos 68 `GRK`, pos 78 `GRR`) | **none** | **lost** |"]. C-terminal alpha-amidation
      is required for receptor activation throughout the CGRP/adrenomedullin family. Separately, the donor
      set for this row is dominated by paralogs rather than by ADM5 orthologs. PANTHER node PTN000602075
      spans ADM, ADM2 and ADM5, so the functions of the well-characterised human paralogs ADM (P35318)
      and ADM2/intermedin (Q7Z4H4) are propagating onto the ADM5 remnant. This row is doubly unsupported.
      No ADM5 donor appears among the sources, and the mammalian AM5 peptide - the functional pig version,
      not the human remnant - was tested against the adrenomedullin receptor combinations and did not
      activate them [PMID:18434369 "did not induce appreciable increases in cAMP production in any combination"],
      leading the authors to conclude it acts through something else entirely [PMID:18434369 "These data
      indicate that AM5 seems to act on as yet unknown receptor(s) for AM5, other than CLR/CTR+RAMP, to
      exert central and peripheral cardiovascular actions in mammals."]. The CLR-RAMP3 evidence behind
      this term is teleost and amphibian. So even a fully functional mammalian AM5 should probably not
      carry this term.
    additional_reference_ids:
    - PMID:18434369
    - file:genes/human/ADM5/ADM5-bioinformatics/RESULTS.md
    - file:genes/human/ADM5/ADM5-uniprot.txt
    supported_by:
    - reference_id: PMID:18434369
      supporting_text: did not induce appreciable increases in cAMP production in any combination
    - reference_id: PMID:18434369
      supporting_text: These data indicate that AM5 seems to act on as yet unknown receptor(s) for AM5,
        other than CLR/CTR+RAMP, to exert central and peripheral cardiovascular actions in mammals.
    - reference_id: PMID:18434369
      supporting_text: In primates, nucleotide deletion occurred in the mature AM5 sequence in anthropoids
        (human and chimp) during transition from the rhesus monkey.
    - reference_id: file:genes/human/ADM5/ADM5-uniprot.txt
      supporting_text: Probable non-functional remnant of adrenomedullin-5.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000602075
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Family-level node spanning ADM, ADM2 and ADM5. The ancestral peptide-hormone function
          is correctly placed at this node, but human ADM5 sits in it as a degenerate remnant; the node
          placement is sound and the transfer to this leaf is not.
      - source_id: UniProtKB:P35318
        source_label: ADM
        source_status: NOT_RELEVANT
        comment: Human adrenomedullin, the cognate ligand for the CLR-RAMP2/3 adrenomedullin receptors.
          Its signalling is real; transferring it to ADM5 conflates the ligand that defines the pathway
          with a family member shown not to use it.
      - source_id: UniProtKB:Q7Z4H4
        source_label: ADM2
        source_status: NOT_RELEVANT
        comment: Human ADM2/intermedin, likewise a CLR-RAMP ligand and not an ADM5 ortholog.
