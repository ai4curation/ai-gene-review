id: Q9UGM1
gene_symbol: CHRNA9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHRNA9 encodes the alpha9 subunit of an acetylcholine-gated cation channel associated with
  efferent signaling to inner-ear hair cells. Human alpha10 strongly promotes functional alpha9-containing
  receptor expression; functional properties of isolated domains or chimeras are not equivalent to a native
  pentamer. Calcium entry through the receptor recruits calcium-dependent potassium channels, allowing
  a cation channel to mediate net inhibition of hair cells. Rat/chicken comparisons establish species
  differences in calcium permeability and choline efficacy; those numerical results are not direct human
  measurements. Nicotine antagonizes the ordinary alpha9/alpha10 channel rather than serving as its canonical
  activating agonist.
