core_functions:
- description: 'Human alpha9 contributes to the alpha9/alpha10 receptor pore and ACh-dependent gating.
    Native auditory inhibition results from coupling this cation current to a separate potassium conductance;
    the receptor is not itself a potassium channel or primary mechanical sound sensor. Human alpha10 strongly
    promotes functional alpha9-containing receptor expression; functional properties of isolated domains
    or chimeras are not equivalent to a native pentamer. '
