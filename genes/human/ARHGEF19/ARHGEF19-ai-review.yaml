id: Q8IW93
gene_symbol: ARHGEF19
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
aliases:
- WGEF
- Ephexin-2
description: >-
  ARHGEF19 (WGEF, "weak-similarity GEF"; also called Ephexin-2) is a Dbl-family guanine nucleotide exchange factor built from a tandem DH-PH catalytic module followed by a C-terminal SH3 domain, preceded by a long disordered region that keeps the enzyme autoinhibited. Its established activity is nucleotide exchange on RhoA: in side-by-side pulldowns the human protein raises RhoA-GTP but not Rac1-GTP or Cdc42-GTP, and it co-precipitates strongly with RhoA, weakly with Rac1 and not at all with Cdc42. Exchange is held off by two independent brakes typical of the Ephexin subfamily, an N-terminal inhibitory helix anchored by a conserved tyrosine (Y295 in human) whose phosphorylation releases the DH domain, and a C-terminal SH3-mediated mode; Dishevelled binding relieves the autoinhibited state. Through Dishevelled and Daam1, ARHGEF19 supplies the RhoA activation step of the Wnt/planar-cell-polarity branch, which drives convergent extension during vertebrate gastrulation, kidney tubule morphogenesis, and the actin remodelling and polarised migration that epidermal keratinocytes need to close a wound, where its transcription is directly driven by GRHL3. A separate, RhoA-independent activity has been reported in carcinoma cells, where the DH and PH domains engage BRAF or HRAS and raise MEK/ERK phosphorylation. The protein is expressed most strongly in intestine, liver, heart and kidney, and in skin.
