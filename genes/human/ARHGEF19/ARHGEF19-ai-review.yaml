- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:18256687
  qualifier: enables
  supporting_entities:
  - UniProtKB:P61586
  review:
    summary: >-
      The interaction is real and well characterised, but "protein binding" throws away everything informative about it. The partner is RhoA, this protein's exchange substrate, and the binding was mapped to the DH-PH module.
    action: MODIFY
    reason: >-
      PMID:18256687 did not merely detect an interaction; it measured specificity across the three candidate GTPases with GST fusions. hWGEF co-precipitated strongly with RhoA, weakly with Rac1 and not at all with Cdc42, and a construct lacking most of DH-PH lost the interaction, placing the binding site in the catalytic module. GO:0031267 small GTPase binding records that the partner is a small GTPase, which GO:0005515 does not. The term one would actually want, GO:0017048 Rho GTPase binding, is obsolete and merged into GO:0031267 - confirmed against EBI OLS4 (is_obsolete true, term_replaced_by GO:0031267), the GO API (no record returned) and this repository's own cache/go/terms.csv (no row), with QuickGO silently resolving the merge and returning the replacement's live record, which is why it was not relied on. GO:0031267 is therefore the most specific available term, not a compromise.
    proposed_replacement_terms:
    - id: GO:0031267
      label: small GTPase binding
    supported_by:
    - reference_id: PMID:18256687
      supporting_text: >-
        We found that hWGEF and XWGEF strongly co-precipitated with RhoA at a level comparable to Ephexin, whereas hWGEFΔGEF did not
    - reference_id: PMID:18256687
      supporting_text: >-
        hWGEF but not XWGEF showed a very weak interaction with Rac-1, and neither WGEF bound to Cdc42
