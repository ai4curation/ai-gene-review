      Knockdown of Grhl3 or RhoGEF19 in keratinocytes induced defects in actin polymerization, cellular polarity, and wound healing, and re-expression of RhoGEF19 rescued these defects in Grhl3-kd cells
  - reference_id: PMID:20643356
    supporting_text: >-
      we utilized the shRNA lentivirus to target the RhoGEF19 transcript in the human keratinocyte cell line, HaCAT
  knowledge_gaps:
  - gap_statement: >-
      Where in the cell the human protein performs this exchange is unmeasured. No human localisation experiment on ARHGEF19 has been published.
    boundary: >-
      The Xenopus orthologue is preferentially at the plasma membrane and colocalises with cortical F-actin, which is where a RhoGEF must be to reach prenylated RhoA. In human cells the only report is qualitative: WGEF shows a broad distribution in proliferating SH-SY5Y cells and concentrates in neurites on differentiation. The three GO cytosol rows are Reactome compartment conventions attached to GEF sets, not observations.
    gap_kind:
    - BIOLOGY
    dark_aspect: CC_DARK
    status: OPEN
    significance: >-
      Autoinhibition release by Dishevelled is a membrane-recruitment event, so whether the active pool is membrane-associated is not a detail but the crux of the regulatory model.
    resolution: >-
      Endogenous immunofluorescence or a knock-in tag in a human epithelial line, with and without Wnt/Frizzled stimulation, plus fractionation to quantify the membrane-associated pool.
    provenance:
    - reference_id: PMID:18256687
      supporting_text: >-
        These results suggest that XWGEF is associated with the plasma membrane in the Xenopus embryo.
knowledge_gaps:
- gap_statement: >-
    The best-established fact about this protein - that it is a RhoA exchange factor and specifically not a Rac1 or Cdc42 exchange factor - cannot be stated in a GO term.
  boundary: >-
    The biology is not in doubt. The human protein was tested against all three GTPases side by side with Ephexin-1 as an internal positive control: it raised RhoA-GTP, it did not raise Rac1-GTP or Cdc42-GTP, and its binding followed the same order. What is missing is vocabulary.
  gap_kind:
  - ONTOLOGY
  status: OPEN
  significance: >-
    GO:0005085 guanyl-nucleotide exchange factor activity is now a leaf: the GTPase-family-specific children (GO:0005089 Rho, GO:0005088 Ras, GO:0030676 Rac) are obsolete and merged into it, and GO:0017048 Rho GTPase binding is likewise merged into GO:0031267 small GTPase binding. Verified across three independent services - OLS4 reports is_obsolete with term_replaced_by, the GO API returns no record, and this repository's cache/go/terms.csv has no row - while QuickGO silently resolves each merge and returns the replacement as a live term, so it cannot be read at face value in either direction. The practical consequence is that every one of the roughly seventy human Dbl-family GEFs now carries the identical molecular-function term regardless of which GTPase it acts on, and the substrate distinction that took a decade of biochemistry to establish is invisible in a GAF.
  resolution: >-
    No new term is proposed here: the merges look deliberate rather than accidental, and re-proposing what was just collapsed would be arguing with an ontology decision rather than filling a hole. The expressive route that already exists is an annotation extension or a GO-CAM activity with has_input(UniProtKB:P61586), and the useful action is to record the substrate that way rather than to reinstate a term.
  provenance:
  - reference_id: PMID:18256687
    supporting_text: >-
      hWGEF but not XWGEF showed a very weak interaction with Rac-1, and neither WGEF bound to Cdc42
- gap_statement: >-
    Almost none of the published experimental work on this gene has reached GO. Eleven of the fourteen primary papers on ARHGEF19 have produced no GO annotation of any gene in any species, and twelve of fourteen have produced no annotation of ARHGEF19 itself.
  boundary: >-
    This is not a dark gene in the usual sense - it has a measured activity, a mapped regulatory mechanism, identified partners and a developmental role. The literature exists; the annotations do not.
  gap_kind:
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    The single richest paper, PMID:18256687, yielded exactly one ARHGEF19 annotation - GO:0005515 protein binding with RhoA. The same figure panel that supports that IPI sits beside a RhoA activation assay, a Rac1/Cdc42 negative, a Dishevelled domain mapping, a Daam1 co-immunoprecipitation, a human MCF-7 RNAi experiment and an autoinhibition mapping, none of which reached GO. Uncurated alongside it are the first characterisation of the activity (PMID:15485661), the autoinhibition mechanism (PMID:18537266), the 2024 structural and activity study (PMID:38714795), three cancer-pathway papers, the ciliogenesis study and the only published negative result (PMID:20810787). The consequence is that the gene currently reads as electronically inferred when it is in fact experimentally characterised.
  resolution: >-
    Direct curation of PMID:18256687 would by itself convert the molecular-function evidence from IBA to IDA, add Dishevelled and Daam1 as partners, and support the planar-cell-polarity term with experiment rather than an author statement. The counts are reproducible from ARHGEF19-bioinformatics/go_coverage_by_reference.py. Even the one paper that did produce annotations is under-curated on the human side: PMID:20643356 knocked RhoGEF19 down in human HaCaT keratinocytes and measured failed wound closure with rescue, yet the human gene carries GO:0042060 only as an IBA projected from the mouse orthologue in the same paper. That single row would convert to a human IMP on evidence already published.
  provenance:
  - reference_id: file:human/ARHGEF19/ARHGEF19-bioinformatics/RESULTS.md
    supporting_text: >-
      11 have produced no GO annotation of any gene in any species.
- gap_statement: >-
    Which region of ARHGEF19 binds Dishevelled is disputed between the two papers that measured it, and neither result has been independently reproduced.
  boundary: >-
    That Dishevelled binds ARHGEF19 and relieves its autoinhibition is agreed by both. The disagreement is over the site.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    PMID:18256687 mapped binding to the N-terminal 1-213 by deletion analysis, and built its autoinhibition model on that colocation - the Dishevelled-binding region and the inhibitory region being the same region is what makes "binding releases the brake" mechanistically natural. PMID:38714795 instead identifies an internal PDZ-binding motif at residues 349-359 and says explicitly that this contradicts the earlier mapping. The two are not reconcilable as stated, and the second paper's exchange assays were performed on Xenopus rather than human protein because the human constructs were insoluble in E. coli. A further trap for anyone reading the database rather than the paper: UniProt lists PDB 8YR7 under Q8IW93, which looks like a structure of human ARHGEF19, but the authors report that this fusion approach failed to yield the complex, and the WGEF peptide is not usefully resolved.
  resolution: >-
    Isothermal titration calorimetry or NMR with full-length human ARHGEF19 against the Dvl2 PDZ domain, and a cellular rescue assay comparing the 1-213 deletion with a 349-359 point mutant.
  provenance:
  - reference_id: PMID:38714795
    supporting_text: >-
      This observation is contrary to the previous study in which the Dvl2PDZ binding was mapped towards the N-terminus of hWGEF
  - reference_id: PMID:38714795
    supporting_text: >-
      Since some of these hWGEF constructs were found to be insoluble and/or poorly expressed in E. coli, we used WGEF from Xenopus laevis (xWGEF) as a surrogate system for further studies.
- gap_statement: >-
    The physiological input that relieves the C-terminal SH3 brake on ARHGEF19 is unidentified, and no Eph receptor partner has ever been found despite the protein being named Ephexin-2.
  boundary: >-
    The architecture is understood at family level. Ephexins carry two independent autoinhibitory modes: an N-terminal inhibitory helix released by phosphorylation of a conserved tyrosine - Y295 in human ARHGEF19, confirmed present in the current UniProt sequence - and a C-terminal SH3-mediated mode. For Ephexin-4 and SGEF the C-terminal brake is released by PDZ proteins binding a motif at the extreme C-terminus. ARHGEF19 has no such C-terminal motif; it ends in an SH3 domain.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    The family's structural study leaves the activating input for the non-Ephexin-4 members explicitly undefined, and the kinase that phosphorylates Y295 in ARHGEF19 has not been identified either - Src does this for Ephexin-1 downstream of Eph receptors, but the family review is explicit that no Eph receptor interacting with Ephexin-2 has been identified. The protein is therefore named for a receptor connection it has never been shown to have, which is a standing invitation to transfer Eph-pathway annotations to it by homology.
  resolution: >-
    A phosphoproteomic survey of Y295 occupancy under candidate stimuli, a kinase screen against the isolated N-terminal inhibitory domain, and a pulldown of the ARHGEF19 SH3 domain against a receptor-tail library.
  provenance:
  - reference_id: PMID:18537266
    supporting_text: >-
      we show that the C-terminal SH3 domain binding to a polyproline region N-terminal to the DH domain of the Tim subgroup of Dbl-family proteins provides a unique mechanism of regulated autoinhibition of exchange activity
  - reference_id: PMID:33597305
    supporting_text: >-
      This double inhibition mechanism is commonly employed by other Ephexins and SGEF, another RhoGEF for RhoG.
- gap_statement: >-
    How ARHGEF19 activates MEK/ERK is unexplained, and whether the reported BRAF and HRAS interactions are direct is untested.
  boundary: >-
    The cellular phenotype is reproduced in three independent human cancer settings, and two of them agree that both the DH and the PH domain are required. Nothing beyond co-immunoprecipitation supports a physical interface.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    A DH-PH module binding a RAF kinase or a Ras GTPase in a manner that does not involve nucleotide exchange would be a genuinely novel use of the fold, and the papers explicitly rule out RhoA as the intermediate. The alternative - that the interaction is indirect and the domain requirement reflects folding or scaffolding rather than contact - is equally consistent with the published data and has not been excluded.
  resolution: >-
    Recombinant binding assays with purified ARHGEF19 DH-PH against BRAF and HRAS, and a catalytically dead DH mutant to separate scaffolding from exchange.
  provenance:
  - reference_id: PMID:29164615
    supporting_text: >-
      ARHGEF19 activated the mitogen-activated protein kinase (MAPK) pathway in a RhoA-independent manner
suggested_questions:
- question: >-
    Should the 2004 report that WGEF activates Cdc42 and Rac1 (PMID:15485661) be treated as superseded by the 2008 side-by-side retest with an internal positive control (PMID:18256687), or as evidence of genuinely broader specificity under different conditions - for example the autoinhibited versus the released conformation?
  experts:
  - Dawid IB
  - Sondek J
- question: >-
    With the GTPase-family-specific GEF activity terms merged into GO:0005085, is an annotation extension or a GO-CAM has_input the intended way to record that ARHGEF19 is a RhoA-specific exchange factor, and if so should the roughly seventy human Dbl-family GEFs be revisited systematically?
  experts: []
- question: >-
    Does the internal PDZ-binding motif at 349-359 replace the earlier N-terminal Dishevelled-binding assignment, or do Dishevelled and ARHGEF19 make two contacts, only one of which each study detected?
  experts:
  - Kulkarni K
  - Dawid IB
suggested_experiments:
- description: >-
    Repeat the three-GTPase pulldown panel of PMID:18256687 with purified full-length human ARHGEF19 and defined phosphorylation states of Y295, using RhoA, Rac1, Cdc42 and RhoG, to settle the substrate question quantitatively and to test whether the broader specificity reported in 2004 reflects the autoinhibited versus released conformation rather than a discrepancy between laboratories.
- description: >-
    Reconcile the two Dishevelled-binding maps directly: measure the affinity of the Dvl2 PDZ domain for full-length human ARHGEF19, for the 1-213 fragment and for the 349-359 peptide in the same assay, then test which mutation abolishes Wnt-induced RhoA activation in cells.
- description: >-
    Determine whether the DH-PH interaction with BRAF is direct, using purified components, and whether a catalytically inactivated DH domain still supports MEK1/2 phosphorylation. This separates a scaffolding function from an exchange-dependent one and would decide whether the MAPK branch deserves a molecular-function term of its own.
- description: >-
    Localise endogenous human ARHGEF19 in a keratinocyte or epithelial line with and without Wnt/Frizzled stimulation, by knock-in tagging and fractionation, to replace the Reactome-derived cytosol assignment with a measurement.
