      Mouse 3T3-L1 only, and no human counterpart has been reported, so it informs the gene's regulation rather than supporting any human annotation. PubMed- and PMC-verified (PMC2686168); full text cached. Listed here chiefly because it is one of the eleven primary papers that have produced no GO annotation in any species.
- id: PMID:20643356
