  review:
    summary: >-
      Proposed new annotation. Three independent human cancer studies report that ARHGEF19 raises MEK/ERK phosphorylation, and two of them map the effect to the DH and PH domains binding BRAF or HRAS rather than to RhoA.
    action: NEW
    reason: >-
      This is a second activity, explicitly RhoA-independent, that GO does not represent at all. In non-small-cell lung cancer, ARHGEF19 overexpression promotes MEK1/2 phosphorylation, ARHGEF19 co-immunoprecipitates with BRAF, and deletion of either the DH or the PH domain abolishes the effect; in small-cell lung cancer the same two domains are reported to engage HRAS and activate MAPK/ERK in cells and xenografts; in breast cancer ARHGEF19 activates the MAPK pathway and promotes growth. All three are human. Three caveats argue for non-core rather than core status: the lung-cancer papers share an institution, the breast-cancer paper is in a low-visibility journal, and no structural or direct-binding work explains how a DH-PH module could engage a kinase or a Ras GTPase, so the interaction may be indirect. Two of the three nonetheless commit to the same specific domain requirement, which is a mechanistic claim rather than a correlation, and none of these papers has produced a single GO annotation in any species. On the evidence code: IDA is chosen for the arm this row rests on - overexpression of ARHGEF19 raising MEK1/2 phosphorylation, with the BRAF co-immunoprecipitation alongside it. Each of the three papers also has a knockdown arm, and a curator taking this forward may prefer to split the row and record those as IMP; the underlying claim is the same either way. All three sources are cached abstract-only, so no figure-level detail is asserted.
