    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-419166
  qualifier: located_in
  review:
    summary: >-
      Reactome compartment convention for a RhoA-GEF reaction, not a localisation experiment on this protein. Keep, but not as a core location.
    action: KEEP_AS_NON_CORE
    reason: >-
      "GEFs activate RhoA,B,C" is the right pathway for this protein, and Reactome assigns GEF catalytic activity to the cytosol as a modelling convention. No human localisation experiment on ARHGEF19 exists. The only positive localisation data are Xenopus, where WGEF sits preferentially at the plasma membrane and colocalises with cortical actin, plus a qualitative human observation of broad distribution in proliferating SH-SY5Y cells that concentrates into neurites on differentiation. Since a RhoGEF has to reach membrane-anchored RhoA to work, cytosol is at best half the story; it is retained as non-core rather than removed because a soluble pool is entirely plausible. The Affinage deep-research record for this gene grounds its localisation in plasma membrane and cilium; both are declined here, the first because the only evidence is amphibian and the second because the ciliary phenotype is in dog and mouse cell lines whose result the same paper's Xenopus arm did not reproduce.
