  - statement: >-
      RhoGEF19-knockdown human keratinocytes form only rudimentary, misdirected stress fibres at the wound edge.
    supporting_text: >-
      RhoGEF19-kd cells formed only rudimentary stress fibers that showed irregular organization and were not directed towards the scratched area
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The source of both the human IGI (GO:0032956 with GRHL3) and, via mouse Arhgef19, of the human wound-healing IBA. Anchored to a checkable fact: MGI:1925912, the sole gene-product donor on the IBA row, resolves at MGI to mouse Arhgef19 itself, whose IMP for GO:0042060 comes from this paper. A correction worth recording for anyone who works from the cache: this entry was originally cached abstract-only, and on that basis an earlier revision of this review stated that no human wound-healing experiment on ARHGEF19 existed. The abstract says "keratinocytes" without a species and the paper is framed around mouse genetics, so the inference was natural and wrong - the full text, re-fetched from PMC2965174 and now cached, names the line as human HaCaT and carries a knockdown-with-rescue scratch assay. Every quote used here is from the cached full text. Note the published erratum adding an author, which does not affect any content used.
- id: PMID:20810787
  title: Involvement of p114-RhoGEF and Lfc in Wnt-3a- and dishevelled-induced RhoA
    activation and neurite retraction in N1E-115 mouse neuroblastoma cells.
  findings:
  - statement: >-
      In N1E-115 mouse neuroblastoma cells, WGEF knockdown has no effect on Dishevelled-induced neurite retraction, while p114-RhoGEF and Lfc knockdowns do; the authors conclude WGEF is not the relevant GEF in this context.
    supporting_text: >-
      WGEF shRNA had no apparent effect on Dvl-induced neurite retraction in N1E-115 cells
  - statement: >-
      The WGEF shRNA was shown to be effective in the same cells, so the negative result is not a knockdown failure.
    supporting_text: >-
      the shRNA targeting WGEF effectively suppressed the expression of HA-WGEF
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The only published negative result on this gene, and a well-controlled one. It is mouse neuroblastoma, so it cannot license a human NOT annotation, but it does establish that the Wnt-Dishevelled-RhoA role is context-dependent rather than universal. PubMed- and PMC-verified; full text cached and read.
- id: PMID:21686262
  title: Grhl3 and GEF19 in the front rho.
  findings:
  - statement: >-
      Commentary from the authors of PMID:20643356 framing GRHL3-driven transcription of RhoGEF19 as tissue-specific control of Rho GTPase activity in wound repair.
    supporting_text: >-
      the recently described regulation of RhoGEF19, an activator of RhoA, by the epidermal-specific transcription factor GRHL3
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Secondary commentary, carrying no new data, and cited here for one reason: its title spells the gene "GEF19", so no ARHGEF19 or WGEF PubMed query returns it. It is recorded as a retrieval blind spot for anyone re-running literature discovery on this gene. PubMed- and PMC-verified (PMC3116594); cached as abstract only.
- id: PMID:21804089
  title: Pronephric tubulogenesis requires Daam1-mediated planar cell polarity signaling.
  findings:
  - statement: >-
      The developing pronephric anlagen expresses Daam1 together with WGEF, and inhibiting this branch of the planar-cell-polarity pathway reduces pronephric tubulogenesis in Xenopus and zebrafish.
    supporting_text: >-
      the developing pronephric anlagen expresses Daam1 and its interacting Rho-GEF (WGEF), which compose one PCP/noncanonical Wnt pathway branch
  - statement: >-
      Tubulogenesis requires the Daam1/WGEF/Rho branch specifically.
    supporting_text: >-
      These data indicate that pronephric tubulogenesis requires the Daam1/WGEF/Rho PCP pathway.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Amphibian and fish only; supports the developmental role of the Daam1-WGEF-Rho module but provides no human or mammalian evidence. PubMed- and PMC-verified (PMC3171937); cached as abstract only. QuickGO shows this paper produced six annotations, all on zebrafish daam1a and none on any ARHGEF19 orthologue.
- id: PMID:24405610
  title: miR-503 regulates metastatic function through Rho guanine nucleotide exchanger
    factor 19 in hepatocellular carcinoma.
  findings:
  - statement: >-
      ARHGEF19 is a direct target of miR-503 in hepatocellular carcinoma cells, and its overexpression counteracts miR-503-mediated suppression of proliferation and metastasis.
    supporting_text: >-
      we demonstrated that ARHGEF19 is a direct target gene of miR-503
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Establishes post-transcriptional regulation of the gene rather than a function of the protein, so it supports no GO annotation directly. PubMed-verified; cached as abstract only, no PMC record.
- id: PMID:24431302
  title: Wnt signaling in midbrain dopaminergic neuron development and regenerative
    medicine for Parkinson's disease.
  findings:
  - statement: >-
      A review of Wnt signalling in midbrain dopaminergic neurons, cited by ParkinsonsUK-UCL as the author-statement source for placing ARHGEF19 in the planar-cell-polarity pathway. The cached record is abstract only and the abstract does not mention ARHGEF19 or planar cell polarity, so the supporting statement is in full text that was not accessible here.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      The identifier resolves to the intended paper - title and journal match - but whether it supports the annotation could not be checked: only the abstract is cached, and that abstract mentions neither ARHGEF19 nor planar cell polarity. Marked UNVERIFIED rather than MISCITED for exactly that reason; the curator who made the NAS read the full text and I did not. The substantive point stands regardless of how it resolves, which is that a review is doing work the primary literature (PMID:18256687) could do far better.
- id: PMID:29164615
  title: ARHGEF19 interacts with BRAF to activate MAPK signaling during the tumorigenesis
    of non-small cell lung cancer.
  findings:
  - statement: >-
      ARHGEF19 activates MEK1/2 phosphorylation independently of RhoA, through an interaction with BRAF that requires both the DH and the PH domain.
    supporting_text: >-
      ARHGEF19 interacted with BRAF and facilitated the phosphorylation of its downstream kinase MEK1/2; both the Dbl homology (DH) and Pleckstrin homology (PH) domains of ARHGEF19 were indispensable for the phosphorylation of MEK1/2
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The strongest of the three MAPK papers and the only one that maps the requirement to specific domains. PubMed-verified; cached as abstract only (no PMC record), so all claims used here are abstract-level and no figure is cited. The mechanism remains unexplained - nothing beyond co-immunoprecipitation supports a direct DH-PH:BRAF interface - which is why the proposed annotation is non-core.
- id: PMID:30682817
  title: Emerging Roles of Ephexins in Physiology and Disease.
  findings:
  - statement: >-
      Ephexin-2 is the least studied member of the family, and no Eph receptor interacting with it has been identified.
    supporting_text: >-
      Studies on Ephexin2 have not extensively been done compared with Ephexin1.
  - statement: >-
      The Ephexin family is defined by homology, and for Ephexin-2 specifically no Eph receptor partner is known.
    supporting_text: >-
      although an Eph receptor interacting with Ephexin2 has not been identified
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      A family review, used only for two things this review states on its authority: that Ephexin-2 is sparsely characterised relative to its paralogues, and that the Ephexin name is homology-based rather than evidence of an Eph receptor partner. Both are corroborated independently - the first by the measured annotation counts in ARHGEF19-bioinformatics, the second by the absence of any Eph-ARHGEF19 paper in the PubMed sweep. PubMed- and PMC-verified; full text cached and read.
- id: PMID:31469868
  title: Divergent roles of the Wnt/PCP Formin Daam1 in renal ciliogenesis.
  findings:
  - statement: >-
      Knockdown of ArhGEF19 in MDCKII cells causes loss of primary cilia, as does knockdown of its partner Daam1; knockdown in Xenopus kidney does not reproduce the effect.
    supporting_text: >-
      Additionally, the Daam1 partner, ArhGEF19, is also required for proper cilia formation in MDCKII cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Dog (MDCKII) and mouse (IMCD3) cell lines, and the paper's own Xenopus arm gives a discordant result, which the title's word divergent reflects. No cilium or ciliogenesis term is proposed for human ARHGEF19 on this basis. PubMed- and PMC-verified; full text cached and read.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: >-
      A proteome-scale binary interaction map, HuRI, which is the source of the reported ARHGEF19-PAK5 interaction.
    supporting_text: >-
      With approximately 53,000 protein-protein interactions, HuRI has approximately four times as many such interactions as there are high-quality curated interactions from small-scale studies.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      A proteome-scale screen, not a study of this gene; the source of the second GO:0005515 IPI row. UniProt records the ARHGEF19-PAK5 pair with NbExp=3 so it is not a single-assay artefact, but nothing has followed it up and it stays non-core. PubMed-verified.
- id: PMID:32993957
  title: ARHGEF19 regulates MAPK/ERK signaling and promotes the progression of small
    cell lung cancer.
  findings:
  - statement: >-
      In small-cell lung cancer cells and xenografts, the DH and PH domains of ARHGEF19 interact with HRAS and activate MAPK/ERK signalling.
    supporting_text: >-
      ARHGEF19-DH and -PD domain interacts with HRAS and activates the MAPK/ERK pathway in SCLC cells and SCLC xenografts.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Corroborates the domain requirement reported for BRAF in PMID:29164615, with a different partner and a different tumour type. Two caveats: it shares an institution with that paper, so the two are not fully independent, and the abstract's "-PD domain" is a typographical error for the PH domain - read as written it names a domain ARHGEF19 does not have. PubMed-verified; cached as abstract only.
- id: PMID:33597305
  title: Double inhibition and activation mechanisms of Ephexin family RhoGEFs.
  findings:
  - statement: >-
      Ephexin-family RhoGEFs are held inactive by two independent modules, an N-terminal inhibitory helix and a C-terminal SH3-mediated mode, each relieved separately.
    supporting_text: >-
      This double inhibition mechanism is commonly employed by other Ephexins and SGEF, another RhoGEF for RhoG.
  - statement: >-
      Phosphorylation of a conserved tyrosine in the N-terminal inhibitory domain and binding of PDZ proteins to a C-terminal PDZ-binding motif relieve the two brakes independently in Ephexin-4.
    supporting_text: >-
      phosphorylation of a conserved tyrosine residue in its N-terminal inhibitory domain and association of PDZ proteins with its C-terminal PDZ-binding motif may respectively relieve the two autoinhibitory modes in Ephexin4
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Structural work on Ephexin-4; ARHGEF19 is discussed as a family member but is not assayed, so this supports the architectural framing and nothing gene-specific. Cached as abstract only - the publisher restricts PMC full-text access - so both quotes are from the abstract, and statements this review takes from the full text (that Ephexin-2's biological functions remain elusive, and that the activating input for the non-Ephexin-4 members is undefined) are attributed in the notes file rather than quoted as supporting_text here.
- id: PMID:34813497
  title: ARHGEF19 promotes the growth of breast cancer in vitro and in vivo by the
    MAPK pathway.
  findings:
  - statement: >-
      ARHGEF19 is overexpressed in human breast cancer, promotes proliferation and suppresses apoptosis, and activates the MAPK pathway.
    supporting_text: >-
      we found that ARHGEF19 could activate the MAPK pathway in breast cancer cells
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      The third independent tumour type showing the same MAPK effect, which is why it is cited, but it is the weakest of the three: a low-visibility journal, no mechanism beyond immunoblot, and no domain mapping. Marked LOW_QUALITY for that reason rather than because the citation is wrong - PubMed-verified, cached as abstract only. It contributes convergence, not evidence.
- id: PMID:38714795
  title: Dishevelled2 activates WGEF via its interaction with a unique internal peptide
    motif of the GEF.
  findings:
  - statement: >-
      Dvl2-PDZ binding to an internal motif at residues 349-359 of human WGEF relieves autoinhibition and raises exchange activity.
    supporting_text: >-
      whereas the motif identified by us is present between amino acid residues 349–359 of hWGEF
  - statement: >-
      This mapping contradicts the earlier assignment of Dishevelled binding to the N-terminal 1-213, and the authors say so explicitly.
    supporting_text: >-
      This observation is contrary to the previous study in which the Dvl2PDZ binding was mapped towards the N-terminus of hWGEF
  - statement: >-
      The exchange assays were performed on Xenopus rather than human protein because the human constructs were insoluble or poorly expressed.
    supporting_text: >-
      Since some of these hWGEF constructs were found to be insoluble and/or poorly expressed in E. coli, we used WGEF from Xenopus laevis (xWGEF) as a surrogate system for further studies.
  - statement: >-
      The conserved N-terminal inhibitory tyrosine of human WGEF is Y295; the phosphomimetic Y295E is reported to be autoinhibition-free.
    supporting_text: >-
      This particular tyrosine (Y353xWGEF/295hWGEF) of hWGEF is present in NID and locks the GEF by interacting with its DH domain.
  - statement: >-
      Neither crystallisation route produced a WGEF peptide-Dvl2PDZ complex structure, including the fusion construct deposited as PDB 8YR7.
    supporting_text: >-
      Even this approach failed to produce the WGEFpep–Dvl2PDZ complex structure (PDB ID: 8YR7)
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Important and carefully done, but it contradicts PMID:18256687 on where Dishevelled binds and neither mapping has been reproduced independently, so DISPUTED records a live disagreement rather than a fault. Two things a reader of the database rather than the paper would get wrong: the activity measurements are on Xenopus protein, and PDB 8YR7 - which UniProt lists under Q8IW93, implying a human ARHGEF19 structure - is the failed fusion, with the WGEF peptide not usefully resolved. The residue claims were checked against the current UniProt sequence: position 295 is Y and residues 349-359 read GSTFSLWQDIP. PubMed- and PMC-verified (PMC11076555); full text cached and read.
- id: PMID:39409035
  title: ANKK1 Is a Wnt/PCP Scaffold Protein for Neural F-ACTIN Assembly.
  findings:
  - statement: >-
      ANKK1 binds WGEF in human SH-SY5Y cells, confirmed by co-immunoprecipitation and proximity ligation, and the WGEF-RhoA interaction increases when ANKK1 is knocked down.
    supporting_text: >-
      Co-IP and PLA experiments confirmed ANKK1–WGEF interaction
  - statement: >-
      In differentiated cells both ANKK1 and WGEF localise to neurites, although they colocalise poorly.
    supporting_text: >-
      Although both proteins localize to neurites, colocalization was low
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      One of the small number of human-cell interaction studies on this protein, alongside PMID:18256687, the interactome screen, and the BRAF and HRAS co-immunoprecipitations in PMID:29164615 and PMID:32993957. It is the only source of a human localisation observation of any kind - qualitative, and in a neuroblastoma line, so it is recorded as context rather than annotated. It has produced no GO annotation in any species, and neither ANKK1 nor the human WGEF-RhoA interaction it reports is in the GO record. PubMed- and PMC-verified; full text cached and read.
- id: Reactome:R-HSA-205039
  title: p75NTR indirectly activates RAC and Cdc42 via a guanyl-nucleotide exchange
    factor
  findings:
  - statement: >-
      A reaction whose catalyst is an undifferentiated cytosolic GEF set and whose output is RAC1-GTP; ARHGEF19 participates only by membership of that set.
    supporting_text: >-
      Following NGF binding, p75NTR activates the RAC (Ras-related C3 botulinum toxin substrate) GTPase.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      The reaction itself is fine; using it as a source for ARHGEF19 is not. Its output is RAC1-GTP and human WGEF does not activate Rac1 (PMID:18256687, Fig. 2B), so the protein is attached here by set membership rather than by evidence. The derived GO annotation is only the cytosol compartment, which is why the row is marked over-annotated rather than removed.
- id: Reactome:R-HSA-419166
  title: GEFs activate RhoA,B,C
  findings:
  - statement: >-
      Generic statement that Rho-family GEFs catalyse GDP-GTP exchange, noting that some GEFs are GTPase-specific and others broad.
    supporting_text: >-
      Guanine nucleotide exchange factors (GEFs) activate GTPases by enhancing the exchange of bound GDP for GTP.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Appropriate pathway assignment for this protein. The cytosol compartment it carries is a Reactome modelling convention for GEF catalytic activity, not a localisation observation, which is why the derived cellular-component row is kept as non-core.
- id: Reactome:R-HSA-8980691
  title: RHOA GEFs activate RHOA
  findings:
  - statement: >-
      Reactome lists ARHGEF19 as a RHOA GEF set member on the evidence of Wang et al. 2004 and Muller et al. 2020.
    supporting_text: >-
      The following guanine nucleotide exchange factors (GEFs) were shown to bind RHOA and catalyze GDP to GTP exchange on RHOA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Verified by reading the reaction's own summary, which names its evidence protein by protein; for ARHGEF19 it cites Wang et al. 2004, which is PMID:15485661. That paper has produced no GO annotation in any species, so this Reactome TAS is currently the only route by which its content reaches GO at all.
- id: Reactome:R-HSA-9012999
  title: RHO GTPase cycle
  findings:
  - statement: >-
      The parent pathway describing the GDP-GTP cycle of RHO GTPases, within which ARHGEF19 acts as an activator.
    supporting_text: >-
      RHO GTPase cycle
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correct pathway placement. Because both the pathway and the reaction through which ARHGEF19 enters it are RHO-specific and describe activation, the derived GO:0051056 row is refined to the Rho-specific positive-regulation term rather than left at the small-GTPase level.
- id: file:interpro/panther/PTHR12845/PTHR12845-paint.tsv
  title: PANTHER PTHR12845 PAINT (IBD) annotations
  findings:
  - statement: >-
      The wound-healing IBD sits on a Euteleostomi-level node seeded by exactly one gene product, mouse Arhgef19.
    supporting_text: >-
      PTHR12845 PTN002656130 GO:0042060 P IBD false MGI:MGI:1925912 taxon:117571
  - statement: >-
      The actin-cytoskeleton IBD is seeded at the eukaryote root by three gene products, one of which is ARHGEF19 itself.
    supporting_text: >-
      PTHR12845 PTN002656129 GO:0032956 P IBD false UniProtKB:O94989|UniProtKB:Q12774|UniProtKB:Q8IW93 taxon:2759
  - statement: >-
      The guanyl-nucleotide-exchange IBD is also at the eukaryote root, seeded entirely by mammalian ephexins.
    supporting_text: >-
      PTHR12845 PTN002656129 GO:0005085 F IBD false MGI:MGI:3045246|UniProtKB:O94989|UniProtKB:Q12774|UniProtKB:Q5VV41|UniProtKB:Q8N5V2 taxon:2759
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The repository's cached PAINT table for this family, used to resolve what the two PANTHER node identifiers in the GOA with/from sets actually are, rather than characterising them from the family name. It supplies the taxon scope of each ancestral node and its seed set, which is what makes the two observations in this review checkable: that PTN002656130 has a single seed, and that PTN002656129's GO:0032956 seed set includes the target's own accession.
- id: file:human/ARHGEF19/ARHGEF19-deep-research-affinage.md
  title: Affinage mechanistic annotation for ARHGEF19 (human)
  findings:
  - statement: >-
      Affinage's own GO grounding for this gene places it at the plasma membrane and the cilium, and assigns only high-level molecular-function terms.
    supporting_text: >-
      GO:0005886 plasma membrane, GO:0005929 cilium
  - statement: >-
      The narrative correctly records the published negative result, noting that the Wnt/Dvl-induced RhoA activation role is dispensable in N1E-115 cells.
    supporting_text: >-
      it is dispensable in N1E-115 cells where other RhoGEFs predominate
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The machine-fetched Affinage record, run with its trust gates clear (accession Q8IW93 matched, organism human, self-evaluation "win"). Its eleven citations were checked one by one against PubMed and all resolve to real papers about this gene, so as a precision claim it holds. Recall is a different matter and the gate says nothing about it. Those eleven citations omit three of the fourteen primary papers, plus one commentary. Their titles were checked against the gene's synonyms by go_coverage_by_reference.py rather than characterised by hand, because an earlier revision of this note generalised that every miss had an unfindable title and the list below contains a counterexample. Two of the four are genuinely unfindable by symbol: PMID:20643356 "Epidermal wound repair is regulated by the planar cell polarity signaling pathway", which is the one paper that has produced informative GO annotations for this gene in any species, and PMID:18537266, titled for Tim, a paralogue, and load-bearing for the regulatory section of this review. A third, the commentary PMID:21686262, names the gene only as the abbreviation "GEF19", which no ARHGEF19 or WGEF query returns. The fourth has no retrieval explanation at all: PMID:34813497 is titled "ARHGEF19 promotes the growth of breast cancer in vitro and in vivo by the MAPK pathway", the symbol is its first word, and the simplest possible query returns it. The record's GO grounding is not imported either: the molecular-function terms it offers (GO:0098772, GO:0060089) are less specific than what GOA already carries, and its localisation terms rest on non-human evidence. Used here as a literature index and a cross-check on the narrative, not as an evidence source.
- id: file:human/ARHGEF19/ARHGEF19-bioinformatics/RESULTS.md
  title: 'ARHGEF19 bioinformatics: DH-PH exchange-surface panel and GO literature coverage'
  findings:
  - statement: >-
      ARHGEF19 presents a complete Dbl-family exchange surface, spanning 24 of the 25 DH positions that contact RhoA in both solved RhoA complexes - the same coverage as the weakest verified-active comparator in the panel.
    supporting_text: >-
      24 of the 25 RhoA-contacting positions are present
  - statement: >-
      The same analysis cannot assign a substrate: identity at the exchange surface is 36% for ARHGEF19 against LARG and 36% for Tiam1, a GEF for a different GTPase.
    supporting_text: >-
      Identity at the exchange surface is 36% for ARHGEF19 against LARG
  - statement: >-
      A Pfam DH hit is not evidence of exchange competence: ARHGEF19 isoform 2 clears the gathering threshold at 65.5 bits despite losing half the DH domain plus all of PH and SH3, spanning only 5 of the 25 contact positions.
    supporting_text: >-
      still clears the Pfam gathering threshold
  - statement: >-
      Eleven of fourteen primary experimental papers on ARHGEF19 have produced no GO annotation of any gene in any species, and twelve of fourteen have produced none on ARHGEF19 itself.
    supporting_text: >-
      11 have produced no GO annotation of any gene in any species.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Analyses written for this review; both scripts fetch every input live and exit non-zero if an assertion fails. The panel test carries five positive comparators with substrate co-crystals and measured activity plus three negative controls, and selftest_guards.py mutation-tests all seventeen guards - twelve against the panel test and five against the quote checker - including two negative controls that must stay silent. Every quote above is checked against the committed file by verify_quotes.py, which also checks the file: and Reactome: quotes CI does not.
