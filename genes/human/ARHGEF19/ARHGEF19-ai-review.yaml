- term:
    id: GO:0032956
    label: regulation of actin cytoskeleton organization
  evidence_type: IGI
  original_reference_id: PMID:20643356
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - UniProtKB:Q8TE85
  review:
    summary: >-
      Well supported. GRHL3 (Q8TE85) drives RhoGEF19 transcription, and knocking down either one produces the same actin and polarity defects in keratinocytes, with rescue by RhoGEF19 re-expression.
    action: ACCEPT
    reason: >-
      This is the strongest experimental row on the gene and the genetic-interaction qualifier is used correctly: GRHL3 was identified as a direct transcriptional activator of RhoGEF19 by phylogenetic analysis and chromatin immunoprecipitation, and the two knockdowns phenocopy. The rescue experiment is what turns a correlation into a genetic ordering. Note that acts_upstream_of_or_within, rather than involved_in, is the appropriate qualifier here because the readout is a whole-cell actin and polarity phenotype rather than a demonstration that the protein acts within the actin-organising machinery itself. Worth recording that the keratinocytes are human: the abstract says only "keratinocytes", but the full text identifies the line as HaCaT and describes the leading-edge polarity analysis as being done on human cells, so this row rests on human-cell evidence and not on a mouse assay read across.
    supported_by:
    - reference_id: PMID:20643356
      supporting_text: >-
        Knockdown of Grhl3 or RhoGEF19 in keratinocytes induced defects in actin polymerization, cellular polarity, and wound healing, and re-expression of RhoGEF19 rescued these defects in Grhl3-kd cells
    - reference_id: PMID:20643356
      supporting_text: >-
        RhoGEF19-kd cells formed only rudimentary stress fibers that showed irregular organization and were not directed towards the scratched area
    - reference_id: PMID:20643356
      supporting_text: >-
        We analyzed the polarity of leading edge cells 6 hours following scratch wounding of human Grhl3-kd, RhoGEF19-kd, and Scr control keratinocytes
- term:
    id: GO:0042060
    label: wound healing
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1925912
  - PANTHER:PTN002656130
  review:
    summary: >-
      Correct, but GOA has the wrong evidence code on it. The donor is mouse Arhgef19 itself, so the orthologue transfer is sound - and the same paper also knocked RhoGEF19 down in a human keratinocyte line and watched the scratch fail to close, so the human annotation should not be inferential at all.
    action: ACCEPT
    reason: >-
      The single gene-product donor resolves to mouse Arhgef19, the direct orthologue, whose experimental annotation comes from PMID:20643356 - the same paper that supports the human IGI two rows above. Mouse and human ARHGEF19 are 1:1 orthologues and the mouse experiment was done in keratinocytes, a cell type the human gene is also expressed in (UniProt records tissue-enhanced expression in skin). This is exactly the case IBA exists for, and the PAINT table shows PTN002656130 seeded by that single gene product and propagated across taxon:117571 (Euteleostomi). The single seed is recorded as a fact about the shape of the ancestral call and explicitly not as a weakness, since donor count is not a proxy for evidential strength and a node seeded by one well-characterised MOD gene can be entirely sound. This one is: the seed is an experimental IMP in the direct orthologue. What is wrong here is the evidence code, and it is the sharpest single instance of this gene's coverage problem. The same paper that produced the mouse IMP also did the experiment in human cells: shRNA against RhoGEF19 in the human keratinocyte line HaCaT left the scratch 20% closed where controls closed completely, activated RhoA fell in those cells, and re-expressing RhoGEF19 in Grhl3-knockdown HaCaT restored closure from 10% to 73%. That is a human knockdown-with-rescue for this exact term, in the paper GOA already cites for the mouse orthologue, and the human gene carries only an IBA. An earlier revision of this review asserted that no human wound-healing experiment on ARHGEF19 had been published; that was wrong, and it was wrong because the cached record was abstract-only and the abstract says "keratinocytes" without naming a species. The full text names it.
    additional_reference_ids:
    - PMID:20643356
    - file:interpro/panther/PTHR12845/PTHR12845-paint.tsv
    supported_by:
    - reference_id: PMID:20643356
      supporting_text: >-
        we identified RhoGEF19, a homolog of a RhoA activator involved in PCP signaling in Xenopus, as a direct target of GRHL3
    - reference_id: PMID:20643356
      supporting_text: >-
        we utilized the shRNA lentivirus to target the RhoGEF19 transcript in the human keratinocyte cell line, HaCAT
    - reference_id: PMID:20643356
      supporting_text: >-
        unlike the Scr cells, which migrated to completely close the scratch within 24 hours
    - reference_id: PMID:20643356
      supporting_text: >-
        re-expression of RhoGEF19 substantially rescued the wound healing phenotype observed with the Grhl3-kd cells (10% closure versus 73%)
    - reference_id: file:interpro/panther/PTHR12845/PTHR12845-paint.tsv
      supporting_text: >-
        PTHR12845 PTN002656130 GO:0042060 P IBD false MGI:MGI:1925912 taxon:117571
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:1925912
        source_label: Arhgef19 (mouse) - the direct orthologue
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Resolved at MGI: MGI:1925912 is mouse Arhgef19, not a paralogue. Its IMP to GO:0042060 derives from PMID:20643356.
      - source_id: PANTHER:PTN002656130
        source_label: PTHR12845 ancestral node, taxon:117571 (Euteleostomi)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The node carries exactly one seed, MGI:MGI:1925912, and spans Euteleostomi. Recorded as a fact about the shape of the ancestral call and not as a weakness: donor count is not a proxy for evidential strength, and no failure_modes value fits either, because the seed is an experimental IMP in the 1:1 orthologue and is therefore neither inferred, statement-level, stale nor otherwise too weak for confident propagation, which is what SOURCE_EVIDENCE_WEAK would assert.
- term:
    id: GO:0051056
    label: regulation of small GTPase mediated signal transduction
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9012999
  qualifier: involved_in
  review:
    summary: >-
      Right idea, needlessly generic. Both the Reactome source and the experimental data are Rho-specific and directional, so a Rho-specific positive-regulation term is available and better.
    action: MODIFY
    reason: >-
      The cited Reactome pathway is R-HSA-9012999 "RHO GTPase cycle", and the reaction through which ARHGEF19 enters it is "RHOA GEFs activate RHOA" - both Rho-specific, and both describing activation rather than regulation of unspecified sign. Independently, the experiments are directional in the same way: overexpression of human WGEF raises RhoA-GTP, and RNAi against it lowers Wnt-1-stimulated RhoA activation in MCF-7 cells. GO:0035025 positive regulation of Rho protein signal transduction is current and non-obsolete in OLS4, the GO API and QuickGO alike, and captures both the family and the sign. Unlike the molecular-function branch, where the GTPase-specific GEF terms have been merged away, the Rho-specific biological-process terms survive, so this refinement is actually available.
    proposed_replacement_terms:
    - id: GO:0035025
      label: positive regulation of Rho protein signal transduction
    additional_reference_ids:
    - PMID:18256687
    supported_by:
    - reference_id: PMID:18256687
      supporting_text: >-
        depletion of WGEF with the aid of RNA interference (RNAi) attenuates Rho activation in response to Wnt-1
- term:
    id: GO:0060071
    label: Wnt signaling pathway, planar cell polarity pathway
  evidence_type: NAS
  original_reference_id: PMID:24431302
  qualifier: involved_in
  review:
    summary: >-
      The right term on evidence that cannot be checked. It rests on an author statement in a Parkinson's-disease Wnt review whose cached abstract does not mention planar cell polarity or ARHGEF19 at all, while the primary paper that established the fact - complete with human-cell loss of function - is cited nowhere in GO.
    action: ACCEPT
    reason: >-
      There is no doubt the term belongs: WGEF binds Dishevelled through the Dvl PDZ domain and binds Daam1, Frizzled-7 drives Dvl-WGEF colocalisation at the membrane, WGEF overexpression rescues convergent extension suppressed by dominant-negative Wnt-11, depletion blocks convergent extension and is rescued by RhoA or Rho-kinase, and RNAi in human MCF-7 cells attenuates Wnt-1-induced RhoA activation. All of that is PMID:18256687. What GO has instead is a non-traceable author statement in PMID:24431302, a review of Wnt signalling in midbrain dopaminergic neurons; its abstract, which is all that is cached, does not mention ARHGEF19 or planar cell polarity, so the statement the annotation rests on is in full text I could not access and I do not second-guess the ParkinsonsUK-UCL curator who read it. The annotation is accepted because the term is correct and removing it would leave the pathway unrepresented. The defect is that the evidence code understates what is known, and this schema has no way to propose an evidence-code upgrade on a term already present in GOA, so it is recorded as a curation knowledge gap instead.
