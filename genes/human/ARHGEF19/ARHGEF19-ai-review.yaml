- id: PMID:15485661
  title: WGEF is a novel RhoGEF expressed in intestine, liver, heart, and kidney.
  findings:
  - statement: >-
      First description of the protein: a Dbl-family RhoGEF with a DH-PH tandem and a C-terminal SH3 domain, reported to activate RhoA, Cdc42 and Rac1 by pulldown, with forced expression rearranging the actin cytoskeleton.
    supporting_text: >-
      WGEF was shown to activate RhoA, Cdc42, and Rac1 by pulldown assay, and forced expression of WGEF resulted in marked rearrangement of the actin cytoskeleton
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:18256687
      review_notes: >-
        The Cdc42 and Rac1 half of this claim does not survive the better-controlled retest. PMID:18256687 assayed all three GTPases side by side, lowered serum to suppress background Rac and Cdc42 activation, and included Ephexin-1 as a positive control that did activate all three; under those conditions human WGEF activated only RhoA. The RhoA activity and the actin phenotype stand.
  - statement: >-
      Expression is highest in intestine, with liver, heart and kidney also positive.
    supporting_text: >-
