- id: PMID:18256687
  title: WGEF activates Rho in the Wnt-PCP pathway and controls convergent extension
    in Xenopus gastrulation.
  findings:
  - statement: >-
      Human WGEF raises RhoA-GTP in HEK293T cells, and a construct lacking most of the DH-PH module does not.
    supporting_text: >-
      Expression of hWGEF and XWGEF increased the level of active RhoA, whereas expression of hWGEFΔGEF did not
  - statement: >-
      Neither human nor Xenopus WGEF activates Rac1 or Cdc42, under conditions where Ephexin-1 in the same experiment does.
    supporting_text: >-
      we find that hWGEF and XWGEF did not activate Rac or Cdc42 above control levels, whereas Ephexin did
  - statement: >-
      Binding specificity mirrors exchange specificity: strong for RhoA, very weak for Rac1, absent for Cdc42.
    supporting_text: >-
      hWGEF but not XWGEF showed a very weak interaction with Rac-1, and neither WGEF bound to Cdc42
  - statement: >-
      Dishevelled binds WGEF through its PDZ domain, and WGEF binds the N-terminal portion of Daam1 but not the C-terminal portion.
    supporting_text: >-
      These results indicate that Dvl interacts with WGEF through the PDZ domain.
  - statement: >-
      Loss of WGEF in human MCF-7 cells reduces Wnt-1-stimulated RhoA activation.
    supporting_text: >-
      depletion of WGEF with the aid of RNA interference (RNAi) attenuates Rho activation in response to Wnt-1
  - statement: >-
      The N-terminal region is autoinhibitory; deleting it makes the protein hyperactive in RhoA binding, RhoA activation and embryonic phenotype.
    supporting_text: >-
      These results suggest that the N-terminal domain of WGEF has an autoinhibitory function, which may be released by Dvl binding.
  - statement: >-
      The Dishevelled-binding determinant was mapped by deletion to the N-terminal region, since constructs lacking residues 1-213 or comprising only DH-PH failed to bind.
    supporting_text: >-
      We found that hWGEFΔN and hWGEFDH–PH could not bind Dvl, whereas the other mutants tested, in particular the N-terminal domain itself, retained binding activity
    finding_review:
      finding_status: DISPUTED
      review_notes: >-
        PMID:38714795 maps Dvl2-PDZ binding instead to an internal motif at residues 349-359 and states the contradiction explicitly. Both mappings are single-laboratory results and neither has been reproduced independently; recorded here as a live disagreement rather than an error in either paper.
  - statement: >-
      Xenopus WGEF localises preferentially to the plasma membrane and colocalises with cortical actin.
    supporting_text: >-
      These results suggest that XWGEF is associated with the plasma membrane in the Xenopus embryo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The single most important paper on this gene, and the one the review's molecular-function conclusion rests on. PubMed- and PMC-verified (PMC2262038); full text cached and read. Anchored independently to a checkable fact: it is the GOA reference for the existing GO:0005515 IPI with UniProtKB:P61586, and the RhoA co-precipitation it describes is exactly what that IPI records. Note that the human-specific experiments (Figs 2A-C, 5B-D, 6) are substantial despite the Xenopus-forward title.
- id: PMID:18537266
  title: Role of the C-terminal SH3 domain and N-terminal tyrosine phosphorylation
    in regulation of Tim and related Dbl-family proteins.
  findings:
  - statement: >-
      Wgef, like Ngef and Tim, is activated by tyrosine phosphorylation of an N-terminal helix that otherwise blocks the DH domain.
    supporting_text: >-
      Here we show that two other Dbl-family proteins, Ngef and Wgef, which like Tim contain a C-terminal SH3 domain, are also activated by tyrosine phosphorylation of a blocking helix.
  - statement: >-
      In the Tim subgroup, which includes Wgef, the C-terminal SH3 domain binds a polyproline region N-terminal to the DH domain, providing a second, independent autoinhibitory mode.
    supporting_text: >-
      we show that the C-terminal SH3 domain binding to a polyproline region N-terminal to the DH domain of the Tim subgroup of Dbl-family proteins provides a unique mechanism of regulated autoinhibition of exchange activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Retrieval note worth recording: this paper is titled for Tim, a paralogue, and is returned by no ARHGEF19 query - it surfaces only on a WGEF search. It is nevertheless one of only two studies that assay Wgef autoinhibition biochemically, and it is the source later work cites for the human Y295E phosphomimetic being autoinhibition-free. PubMed- and PMC-verified (PMC2655348); cached as abstract only, so both quotes are taken from the abstract and no figure-level claim is made from it.
