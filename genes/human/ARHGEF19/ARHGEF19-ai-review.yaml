core_functions:
- description: >-
    RhoA-specific guanine nucleotide exchange downstream of Dishevelled in the Wnt/planar-cell-polarity branch. Frizzled activation recruits Dishevelled to the plasma membrane, where it and Daam1 bind ARHGEF19 and relieve its autoinhibition; the freed DH-PH module then loads GTP onto RhoA, and RhoA-ROCK signalling reorganises the actin cytoskeleton. The output is polarised, directed cell movement - convergent extension of the notochord and neural plate during gastrulation, kidney tubule morphogenesis, and the polarised keratinocyte migration that closes an epidermal wound, where GRHL3 supplies the transcriptional input. Specificity is narrow and was tested directly: the human protein activates RhoA but not Rac1 or Cdc42, and binds RhoA strongly, Rac1 weakly and Cdc42 not at all. The wound-repair arm is not read across from mouse: knocking RhoGEF19 down in the human keratinocyte line HaCaT leaves a scratch 20% closed where controls close it completely, lowers activated RhoA, and leaves the cells with only rudimentary, misdirected stress fibres, while re-expressing RhoGEF19 in GRHL3-knockdown cells restores closure.
