    action: ACCEPT
    reason: >-
      The transfer is sound on every axis. All five donor accessions are Ephexin-family RhoGEFs (ARHGEF15, ARHGEF5, ARHGEF16, NGEF, plus mouse Arhgef15), and the target carries an intact DH-PH module: Pfam PF00621 scores 137.0 bits over residues 382-558, inside the 134.6-166.9 range spanned by five Dbl-family GEFs that have both a substrate co-crystal and measured exchange activity, and 24 of the 25 DH positions that contact RhoA in both 1X86 (LARG:RhoA) and 1LB1 (Dbs:RhoA) are present. The bioinformatics is deliberately not treated as proof of activity - identity at that surface is 36% for ARHGEF19 against LARG and also 36% for Tiam1, a GEF for a different GTPase, so it cannot assign a substrate - but it removes any reason to suspect a pseudo-GEF. The activity itself is measured directly in human cells (PMID:18256687, Fig. 2A). The only defect here is one of evidence code, not of term: a gene with a published human IDA is carrying an IBA.
