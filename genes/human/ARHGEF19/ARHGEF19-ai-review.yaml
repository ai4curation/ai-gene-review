  review:
    summary: >-
      Correct domain-to-term mapping. IPR000219 is the DH domain and IPR047271 is the Ephexin-like family; both are genuinely present.
    action: ACCEPT
    reason: >-
      The DH domain called by InterPro is confirmed independently by Pfam PF00621 at the gathering threshold (137.0 bits, residues 382-558) and by structural mapping of the exchange surface. This is the weakest evidence code on the row but it is not a false mapping. Worth noting for anyone auditing IEA quality on this protein: the same domain signature also fires on isoform 2 (Q8IW93-2) at 65.5 bits even though that isoform deletes residues 484-783 and so loses half the DH domain plus all of PH and SH3, retaining only 5 of the 25 GTPase-contact positions. A domain-to-term mapping cannot see that, which is an argument for keeping the IEA subordinate to experimental evidence rather than for removing it.
