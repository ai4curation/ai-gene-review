  review:
    summary: >-
      Correct. Reactome places ARHGEF19 in its RHOA GEF set on the strength of the 2004 characterisation paper, which is the same paper GO itself never annotated.
    action: ACCEPT
    reason: >-
      The Reactome reaction "RHOA GEFs activate RHOA" lists its evidence gene by gene, and for this protein it cites Wang et al. 2004, which is PMID:15485661. That paper has produced zero GO annotations in any species, so Reactome's secondary assertion is currently the only route by which its content reaches the GO record at all. Accepting it is right; it would be better still for GO to annotate the primary paper directly. One caution for anyone reading the quotes below: the activity sentence from PMID:15485661 also names Cdc42 and Rac1, and that half of it is superseded - see the finding_review on PMID:15485661, which marks it OVERTURNED by the side-by-side retest in PMID:18256687. Only the RhoA clause and the domain architecture are load-bearing here, and neither was overturned; the quote is left whole rather than trimmed because truncating it at "RhoA" would misrepresent what the sentence says.
