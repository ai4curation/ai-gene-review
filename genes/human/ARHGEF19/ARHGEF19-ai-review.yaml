- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-205039
  qualifier: located_in
  review:
    summary: >-
      The compartment is not false, but the route by which ARHGEF19 acquired it is. This Reactome reaction produces RAC1-GTP, and human WGEF does not activate Rac1.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      R-HSA-205039 is "p75NTR indirectly activates RAC and Cdc42 via a guanyl-nucleotide exchange factor". Its catalyst is a generic set, "guanyl-nucleotide exchange factor activity of GEFs [cytosol]", and its output is RAC1:GTP. ARHGEF19 reaches the reaction only by membership of that undifferentiated GEF set, and the one experiment that tested the question found that human WGEF does not raise Rac1-GTP above control while Ephexin-1 in the same panel does. The cellular-component term is a compartment label attached to the set, not a localisation measurement on this protein, and it inherits a substrate assignment the protein does not support. Removing it would overstate the case, since cytosol is where an unengaged GEF plausibly sits, but a curator should know this row carries no evidence about ARHGEF19 specifically. This is why the three cytosol rows do not all carry the same action: the other two come from RhoA reactions that ARHGEF19 genuinely belongs to, and only this one is grounded in a reaction whose output the protein cannot produce.
    additional_reference_ids:
    - PMID:18256687
    supported_by:
    - reference_id: PMID:18256687
      supporting_text: >-
        we find that hWGEF and XWGEF did not activate Rac or Cdc42 above control levels, whereas Ephexin did
- term:
