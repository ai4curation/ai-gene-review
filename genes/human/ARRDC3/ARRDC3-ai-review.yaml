id: Q96B67
gene_symbol: ARRDC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ARRDC3 is an alpha-arrestin (arrestin domain-containing) protein at the plasma membrane
  and mainly on early endosomes. Through two C-terminal PPxY motifs it binds NEDD4-family HECT ubiquitin
  ligases (NEDD4, WWP2, ITCH) and links them to cargo. It is required for WWP2-dependent ubiquitination
  of ALIX, which sorts the GPCR PAR1 at late endosomes for lysosomal degradation. It promotes ubiquitination
  and degradation of phosphorylated beta-4 integrin, and ITCH-mediated degradation of YAP. It sequesters
  TAZ through PPxY-WW contacts independently of trafficking. ARRDC3 binds beta2-adrenergic receptor directly
  and ligand-independently via a basic patch in its N-terminal lobe. Its role there is debated: early
  work saw NEDD4 recruitment for receptor degradation, while later studies place it as a secondary endosomal
  adaptor or as a brake on SNX27-mediated recycling. ARRDC3 is itself ubiquitinated through its PPxY motifs,
  and phosphorylation of Tyr394 switches its binding from WWP2 to c-Src. Arrdc3-deficient mice resist
  obesity with higher energy expenditure and adipocyte Ucp1, and ARRDC3 loss in invasive breast cancer
  causes persistent PAR1 signalling.'
