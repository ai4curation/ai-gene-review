id: Q96B67
gene_symbol: ARRDC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARRDC3 is an alpha-arrestin (arrestin domain-containing) protein at the plasma membrane and
  on endosomes. Through two PPxY motifs it binds NEDD4-family HECT ubiquitin ligases, and it recruits
  NEDD4 to activated beta2-adrenergic receptors, promoting receptor ubiquitination and lysosomal degradation.
  One study places it as a secondary adaptor that moves NEDD4-receptor complexes to early endosomes after
  beta-arrestin2 acts. It binds beta-adrenergic receptors and dampens their signalling in adipose tissue;
  Arrdc3-deficient mice resist obesity through higher energy expenditure. It also binds and promotes degradation
  of phosphorylated beta-4 integrin and of YAP, consistent with tumour-suppressive roles in breast and
  colorectal cancer.
