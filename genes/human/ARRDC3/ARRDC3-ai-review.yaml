  supported_by:
  - reference_id: PMID:20559325
    supporting_text: The ARRDC3 protein interacts with ubiquitin ligase neural precursor development downregulated
      protein 4 (NEDD4) through two conserved PPXY motifs and recruits NEDD4 to the activated receptor.
  - reference_id: PMID:26490116
    supporting_text: We found that ARRDC3 is required for ALIX ubiquitination induced by activation of
      PAR1.
  - reference_id: PMID:26490116
    supporting_text: Moreover, activation of PAR1 increases ALIX ubiquitination that is dependent on ARRDC3
      and WW domain–containing E3 ubiquitin protein ligase 2 (WWP2).
  - reference_id: PMID:20603614
    supporting_text: Our data indicates ARRDC3 directly binds to a phosphorylated form of ITGbeta4 leading
      to its internalization, ubiquitination and ultimate degradation.
  - reference_id: PMID:29416926
    supporting_text: Mechanically, ARRDC1/3 negatively regulates YAP1 protein stability by facilitating
      E3 ubiquitin ligase Itch-mediated ubiquitination and degradation of YAP1.
