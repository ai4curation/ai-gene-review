core_functions:
- description: Alpha-arrestin adaptor that links NEDD4-family E3 ligases (NEDD4, WWP2, ITCH) to cargo
    and sorting factors such as ALIX, beta-4 integrin and YAP, promoting their ubiquitination and endolysosomal
    sorting or degradation.
