  findings:
  - statement: ARRDC3 ubiquitination via PPxY motifs governs its degradation, localization and WWP2 binding.
    supporting_text: Additionally, ubiquitination and the PPXY motifs mediate ARRDC3 protein degradation,
      dictate ARRDC3 subcellular localization, and are required for interaction with the NEDD4-family
      E3 ubiquitin ligase WWP2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:40409556
  title: ARRDC3 tyrosine phosphorylation functions as a switch to control c-Src versus WWP2 interactions
    and distinct scaffolding functions.
  findings:
  - statement: Y394 phosphorylation switches ARRDC3 from WWP2 to c-Src binding.
    supporting_text: We found that ARRDC3 Y394 phosphorylation promotes interaction with c-Src via its
      SH2 domain, whereas the non-phosphorylated form binds to WWP2.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:29416926
  title: ARRDC1 and ARRDC3 act as tumor suppressors in renal cell carcinoma by facilitating YAP1 degradation.
  findings:
  - statement: ARRDC3 promotes ITCH-mediated YAP1 ubiquitination and degradation.
    supporting_text: Mechanically, ARRDC1/3 negatively regulates YAP1 protein stability by facilitating
      E3 ubiquitin ligase Itch-mediated ubiquitination and degradation of YAP1.
  - statement: YAP1 binding uses ARRDC3 PPxY motifs.
    supporting_text: Binding of ARRDC1/3 to YAP1 is mediated through the WW domains of YAP1 and the PPXY
      motifs of ARRDC1/3.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; renal carcinoma cells.
  full_text_unavailable: true
