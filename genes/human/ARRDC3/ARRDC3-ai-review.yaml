- id: PMID:28291835
  title: Adipocyte arrestin domain-containing 3 protein (Arrdc3) regulates uncoupling protein 1 (Ucp1)
    expression in white adipose independently of canonical changes in β-adrenergic receptor signaling.
  findings:
  - statement: Adipocyte Arrdc3 deletion raises Ucp1.
    supporting_text: We generated a mouse with conditional deletion of Arrdc3, and here we present evidence
      that genetic ablation of Arrdc3 specifically in adipocytes results in increased Ucp1 expression
      in subcutaneous and parametrial adipose tissue.
  - statement: Canonical beta-adrenergic signalling is unchanged in Arrdc3-null adipocytes.
    supporting_text: Additionally, canonical β-adrenergic receptor signaling was not different in Arrdc3-null
      adipocytes.
  - statement: Agonist-treated null adipocytes show decreased Ucp1.
    supporting_text: It was previously hypothesized that Arrdc3 ablation leads to increased β-adrenergic
      receptor sensitivity; however, in vitro experiments show that Arrdc3-null adipocytes responded to
      β-adrenergic receptor agonist with decreased Ucp1 levels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse adipocytes. Disputes the beta-adrenergic mechanism proposed in PMID:21982743.
