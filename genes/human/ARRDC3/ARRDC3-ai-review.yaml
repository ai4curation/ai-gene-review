suggested_questions:
- question: Is ARRDC3 a primary or a secondary adaptor for beta2AR ubiquitination, given the conflicting
    RNAi, beta-arrestin-knockout and SNX27-recycling results?
- question: How does ARRDC3 restrain thermogenesis and Ucp1 in adipocytes if canonical beta-adrenergic
    signalling is unchanged without it?
- question: Should ARRDC3's role in GPCR lysosomal sorting (PAR1 via ALIX) be captured as a process annotation,
    and which term fits an adaptor that ubiquitinates a sorting factor rather than the receptor?
suggested_experiments:
- description: Compare beta2AR ubiquitination and degradation in beta-arrestin2-null versus ARRDC3-null
    cells, with PPxY-mutant rescue.
