  title: The α-Arrestin ARRDC3 Regulates the Endosomal Residence Time and Intracellular Signaling of the
    β2-Adrenergic Receptor.
  findings:
  - statement: ARRDC3 binds beta2AR ligand-independently and sits on EEA1 early endosomes.
    supporting_text: We find that ARRDC3 primarily localizes to EEA1-positive early endosomes and directly
      interacts with the β2AR in a ligand-independent manner.
  - statement: ARRDC3 restrains beta2AR entry into SNX27 tubules without affecting degradation.
    supporting_text: Although ARRDC3 has no effect on β2AR endocytosis or degradation, it negatively regulates
      β2AR entry into SNX27-occupied endosomal tubules.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; contrasts with PMID:20559325 on degradation.
  full_text_unavailable: true
- id: PMID:26490116
  title: The α-arrestin ARRDC3 mediates ALIX ubiquitination and G protein-coupled receptor lysosomal sorting.
  findings:
  - statement: ARRDC3 regulates ALIX in GPCR sorting via ubiquitination.
    supporting_text: Here we show that the mammalian α-arrestin arrestin domain-containing protein-3 (ARRDC3)
      regulates ALIX function in GPCR sorting via ubiquitination.
  - statement: ARRDC3 is required for PAR1-induced ALIX ubiquitination.
    supporting_text: We found that ARRDC3 is required for ALIX ubiquitination induced by activation of
      PAR1.
  - statement: ALIX ubiquitination depends on ARRDC3 and WWP2.
    supporting_text: Moreover, activation of PAR1 increases ALIX ubiquitination that is dependent on ARRDC3
      and WW domain–containing E3 ubiquitin protein ligase 2 (WWP2).
  - statement: ARRDC3 is required for PAR1 sorting and degradation.
    supporting_text: ARRDC3 colocalizes with ALIX and is required for PAR1 sorting at late endosomes and
      degradation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; HeLa cells.
- id: PMID:29348172
