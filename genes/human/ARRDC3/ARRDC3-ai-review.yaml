    supporting_text: Additionally, ARRDC3 suppresses PAR1-induced Hippo signaling via sequestration of
      TAZ, which occurs independently of ARRDC3-regulated PAR1 trafficking.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; triple-negative breast cancer.
