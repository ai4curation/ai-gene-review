    supporting_text: Using a lentiviral doxycycline-inducible system, we demonstrate that re-expression
      of ARRDC3 in invasive breast carcinoma is sufficient to restore normal PAR1 trafficking through
      the ALG-interacting protein X (ALIX)-dependent lysosomal degradative pathway.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; breast cancer cells.
  full_text_unavailable: true
