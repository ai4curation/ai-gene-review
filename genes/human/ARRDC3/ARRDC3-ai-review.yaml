    label: protein ubiquitination
  evidence_type: IMP
  original_reference_id: PMID:26490116
  qualifier: involved_in
  review:
    summary: 'Protein ubiquitination (NEW, IMP). ARRDC3 is required for WWP2-dependent ALIX ubiquitination
      after PAR1 activation, and its inactivation blocks beta2AR ubiquitination. As the ligase-substrate
      adaptor, ARRDC3 contributes to the ubiquitination step itself. Comparator check: the alpha-arrestins
      ARRDC1 and ARRDC4 and both beta-arrestins carry GO:0016567.'
    action: NEW
    reason: '[PMID:26490116 "We found that ARRDC3 is required for ALIX ubiquitination induced by activation
      of PAR1."] [PMID:26490116 "Moreover, activation of PAR1 increases ALIX ubiquitination that is dependent
      on ARRDC3 and WW domain–containing E3 ubiquitin protein ligase 2 (WWP2)."] [PMID:20559325 "Furthermore,
      functional inactivation of ARRDC3, either through small interfering RNA (siRNA)-mediated knockdown
      or overexpression of a mutant that does not interact with NEDD4, blocks receptor ubiquitination
      and degradation."]'
    supported_by:
    - reference_id: PMID:26490116
      supporting_text: We found that ARRDC3 is required for ALIX ubiquitination induced by activation
        of PAR1.
    - reference_id: PMID:26490116
      supporting_text: Moreover, activation of PAR1 increases ALIX ubiquitination that is dependent on
        ARRDC3 and WW domain–containing E3 ubiquitin protein ligase 2 (WWP2).
