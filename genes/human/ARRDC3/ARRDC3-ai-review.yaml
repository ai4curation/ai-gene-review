    reason: '[PMID:25220262 "Residues within the basic patch were shown to be important for binding to
      β2AR, similar to the situation with β-arrestins."] [PMID:27226565 "We find that ARRDC3 primarily
      localizes to EEA1-positive early endosomes and directly interacts with the β2AR in a ligand-independent
      manner."] [PMID:23208550 "The arrestin-domain-containing (ARRDC) proteins 2, 3 and 4 are secondary
      adaptors recruited to internalized β(2)AR-Nedd4 complexes on endosomes and do not affect the adaptor
      roles of β-arrestin2."]'
    proposed_replacement_terms:
