- term:
    id: GO:0120163
    label: negative regulation of cold-induced thermogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q7TPQ9
  - ensembl:ENSMUSP00000096957
  review:
    summary: Negative regulation of cold-induced thermogenesis (IEA, from mouse Arrdc3). Arrdc3-deficient
      mice resist obesity through increased energy expenditure, with greater thermogenesis of brown and
      white fat, and adipocyte-specific deletion raises Ucp1. The mechanism is disputed. An early study
      attributed the effect to stronger beta-adrenergic responses, but canonical beta-adrenergic signalling
      is unchanged in Arrdc3-null adipocytes. The phenotype stands; the mechanism does not. A physiological,
      non-core role.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:21982743 "Mice with decreased ARRDC3 levels were protected from obesity due to increased
      energy expenditure through increased activity levels and increased thermogenesis of both brown and
      white adipose tissues."] [PMID:28291835 "We generated a mouse with conditional deletion of Arrdc3,
      and here we present evidence that genetic ablation of Arrdc3 specifically in adipocytes results
      in increased Ucp1 expression in subcutaneous and parametrial adipose tissue."] [PMID:28291835 "Additionally,
      canonical β-adrenergic receptor signaling was not different in Arrdc3-null adipocytes."]'
    supported_by:
    - reference_id: PMID:21982743
      supporting_text: Mice with decreased ARRDC3 levels were protected from obesity due to increased
        energy expenditure through increased activity levels and increased thermogenesis of both brown
        and white adipose tissues.
    - reference_id: PMID:28291835
      supporting_text: We generated a mouse with conditional deletion of Arrdc3, and here we present evidence
        that genetic ablation of Arrdc3 specifically in adipocytes results in increased Ucp1 expression
        in subcutaneous and parametrial adipose tissue.
    - reference_id: PMID:28291835
      supporting_text: Additionally, canonical β-adrenergic receptor signaling was not different in Arrdc3-null
        adipocytes.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      residue_claims_not_applicable: No residue-level claim is propagated.
      source_entities:
      - source_id: UniProtKB:Q7TPQ9
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Arrdc3; knockout phenotype of increased thermogenesis and energy expenditure (PMID:21982743).
