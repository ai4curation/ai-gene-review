core_functions:
- description: NOS3 catalyzes endothelial nitric oxide production from L-arginine at Golgi and caveolar
    plasma-membrane sites after lipidation, calmodulin binding and regulatory phosphorylation tune electron
    transfer through the zinc-stabilized heme, FAD, FMN and tetrahydrobiopterin-dependent NOS core.
  molecular_function:
    id: GO:0004517
    label: nitric-oxide synthase activity
  directly_involved_in:
  - id: GO:0006809
    label: nitric oxide biosynthetic process
  locations:
  - id: GO:0005901
    label: caveola
  - id: GO:0000139
    label: Golgi membrane
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:human/NOS3/NOS3-uniprot.txt
    record_section:
    - CC:CATALYTIC ACTIVITY
    supporting_text: Reaction=2 L-arginine + 3 NADPH + 4 O2 + H(+) = 2 L-citrulline + 2 nitric oxide + 3
      NADP(+) + 4 H2O
  - reference_id: Reactome:R-HSA-203567
    supporting_text: ZDHHC21, associated with the Golgi membrane, palmitoylates cytosolic eNOS (Nitric oxide
      synthase 3), enabling its localization to plasmalemmal caveolae
- description: Endothelial NO produced by NOS3 activates soluble guanylate cyclase and other local targets to
    maintain vascular relaxation, blood pressure control, vessel growth and aortic-valve endothelial
    signaling.
  molecular_function:
    id: GO:0004517
    label: nitric-oxide synthase activity
  directly_involved_in:
  - id: GO:0038060
    label: nitric oxide-cGMP-mediated signaling
  - id: GO:0042311
    label: vasodilation
  - id: GO:0045766
    label: positive regulation of angiogenesis
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005901
    label: caveola
  supported_by:
  - reference_id: PMID:1378832
    supporting_text: In co-culture assays, nitric oxide production by transfected cells increased guanylate
      cyclase activity in reporter rat fetal lung fibroblasts.
  - reference_id: PMID:23583836
    supporting_text: Notch1 and NOS3 (endothelial NO synthase) display an in vivo genetic interaction critical
      for proper valve morphogenesis and the development of aortic valve disease.
suggested_questions:
- question: Which NOS3 functions require Golgi-to-caveola trafficking rather than soluble cytosolic enzyme
    activity in primary human endothelial cells?
suggested_experiments:
- description: Endogenously mutate the NOS3 myristoylation and palmitoylation sites in human endothelial cells
    and assay caveolar localization, NO output, valve-signaling markers and angiogenic migration in parallel.
