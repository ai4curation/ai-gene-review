id: P29474
gene_symbol: NOS3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NOS3 encodes endothelial nitric-oxide synthase, a myristoylated and palmitoylated homodimeric flavoheme
  enzyme that cycles between Golgi and caveolar plasma-membrane compartments and produces nitric oxide from L-arginine
  in response to calcium/calmodulin and phosphorylation signals. Endothelial nitric oxide made by NOS3 drives cGMP-dependent
  vascular smooth-muscle relaxation and contributes to vessel diameter, blood-pressure, angiogenic and valve-signaling
  pathways.'
