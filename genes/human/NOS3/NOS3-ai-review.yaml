- term:
    id: GO:0004517
    label: nitric-oxide synthase activity
  evidence_type: EXP
  original_reference_id: PMID:1378832
  qualifier: enables
  review:
    summary: nitric-oxide synthase activity is part of the conserved NOS3 nitric-oxide synthase catalytic
      apparatus.
    action: ACCEPT
    reason: NOS3 is a bona fide nitric-oxide synthase whose L-arginine oxidation depends on heme, FAD, FMN,
      NADPH, tetrahydrobiopterin and calmodulin; the PMID:1378832 EXP row is therefore kept as a core
      enzymatic or cofactor annotation.
    supported_by:
    - reference_id: file:human/NOS3/NOS3-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=2 L-arginine + 3 NADPH + 4 O2 + H(+) = 2 L-citrulline + 2 nitric oxide + 3
        NADP(+) + 4 H2O
