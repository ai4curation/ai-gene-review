      captured (only nucleus/nucleoplasm/chromatin). Comparator check (QuickGO, Oct 2026): other NHEJ/DSB factors XRCC4, NHEJ1/XLF,
      PAXX, TP53BP1 and ATM carry this term by IDA, while XRCC5, XRCC6 and LIG4 do not, so its absence for PRKDC is not a
      systematic convention. A cellular component, so the process participation test does not apply.'
    supported_by:
    - *id011
    - *id013
