suggested_questions:
- question: Under which cell types and conditions does DNA-PKcs promote (as a cytoplasmic DNA sensor or HDP-RNP component)
    versus suppress (by cGAS phosphorylation) DNA-triggered innate immune signalling, and is this governed by its cytoplasmic
    pool?
- question: How much does DNA-PKcs contribute to AKT Ser473 phosphorylation relative to mTORC2 outside of DNA damage, and
    does its activation by short DNA fragments (e.g. lysosome-derived oligonucleotides after efferocytosis) involve direct
    binding by the DNA-PK holoenzyme?
- question: Is the Ku- and U3 snoRNA-dependent rRNA processing role conserved in human haematopoietic cells, and does it contribute
    to the neurological and growth phenotypes of PRKDC-deficient patients?
- question: Should GO capture the reported role in alternative end joining as negative regulation (suppression of alt-EJ by
    classical NHEJ) rather than participation?
suggested_experiments:
- hypothesis: Short DNA oligonucleotides released in phagolysosomes activate DNA-PKcs directly through Ku-dependent end binding.
  description: Reconstitute purified DNA-PK (DNA-PKcs plus Ku) with DNase II-generated oligonucleotides of defined length
    and measure kinase activity and S2056/T2609 autophosphorylation; complement in macrophages with Ku-binding-deficient or
    kinase-dead DNA-PKcs and test AKT S473 and proliferation after efferocytosis.
  experiment_type: biochemical reconstitution and genetic complementation
- hypothesis: cGAS phosphorylation by DNA-PK is the main mechanism by which DNA-PKcs restrains interferon responses in human
    cells.
  description: Knock-in phospho-null (T68A/S213A) cGAS in human monocytes with and without DNA-PKcs inhibition and measure
    cGAMP, IRF3 activation and ISG expression after DNA virus infection.
  experiment_type: knock-in mutagenesis and signalling assays
- hypothesis: DNA-PKcs pre-rRNA processing function is conserved in human haematopoietic progenitors.
  description: Express T2609-cluster phospho-null or kinase-dead DNA-PKcs in human CD34+ progenitors and measure pre-rRNA
    intermediates by northern blot, nucleolar localization and global translation.
  experiment_type: genetic perturbation in primary cells
