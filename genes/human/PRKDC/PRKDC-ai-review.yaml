id: P78527
gene_symbol: PRKDC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PRKDC encodes DNA-PKcs, the ~470 kDa catalytic subunit of the DNA-dependent protein kinase (DNA-PK), a member
  of the phosphatidylinositol 3-kinase-related kinase (PIKK) family with a HEAT-repeat solenoid, FAT, kinase and FATC domains.
  At DNA double-strand breaks the Ku70/Ku80 heterodimer binds the DNA ends and recruits DNA-PKcs; DNA end binding allosterically
  activates its serine/threonine kinase activity (preference for S/T-Q motifs). DNA-PKcs holds and protects the ends, forms
  long-range synaptic complexes with XRCC4, XLF and DNA ligase IV, and phosphorylates itself in trans (T2609 and S2056 clusters)
  to remodel the complex for end processing and ligation in classical non-homologous end joining. In V(D)J recombination it
  phosphorylates and activates the Artemis nuclease to open RAG-generated coding hairpins, so loss of function causes radiosensitive
  severe combined immunodeficiency. Further substrates include H2AX, RPA2, LIG4, ASF1A and p53. DNA-PKcs is mainly nuclear.
  Context-dependent roles are reported in transcriptional activation (USF-1, AR), AKT Ser473 phosphorylation, Ku- and U3 snoRNA-dependent
  pre-rRNA processing in nucleoli, telomere stability, and both positive and negative regulation of DNA-triggered innate immune
  signalling (including inhibitory phosphorylation of cGAS).
