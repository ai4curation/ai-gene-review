core_functions:
- description: DNA end-activated serine/threonine protein kinase of the DNA-PK holoenzyme. Recruited by Ku to DNA double-strand
    break ends, DNA-PKcs protects and synapses the ends with XRCC4-LIG4-XLF and autophosphorylates in trans to allow end processing
    and ligation in classical non-homologous end joining.
  molecular_function:
    id: GO:0004677
    label: DNA-dependent protein kinase activity
  directly_involved_in:
  - id: GO:0006303
    label: double-strand break repair via nonhomologous end joining
  locations:
  - id: GO:0035861
    label: site of double-strand break
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0070418
    label: DNA-dependent protein kinase complex
  supported_by:
  - reference_id: PMID:28840859
    supporting_text: Structural and biochemical analyses indicate that KU70/80 and DNA coordinately induce conformational
      changes of DNA-PKcs and allosterically stimulate its kinase activity.
  - reference_id: PMID:12231622
    supporting_text: These findings establish that Ku-dependent phosphorylation of DNA-PKcs at Thr2609 is required for the
      repair of DSBs by NHEJ.
  - reference_id: PMID:10207111
    supporting_text: These results indicate that the protein kinase activity of DNA-PKcs is essential for the rejoining of
      DNA DSBs in mammalian cells.
  - reference_id: PMID:33854234
    supporting_text: The relative orientation of the DNA-PKcs molecules suggests a mechanism for autophosphorylation in trans,
      which leads to the dissociation of DNA-PKcs and the transition into the short-range synaptic complex.
  - reference_id: file:human/PRKDC/PRKDC-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Must be bound to DNA to express its catalytic properties
- description: In V(D)J recombination, DNA-PKcs forms a complex with Artemis and phosphorylates it, activating the Artemis
    endonuclease that opens RAG-generated coding-end hairpins; human PRKDC mutations cause radiosensitive SCID.
  molecular_function:
