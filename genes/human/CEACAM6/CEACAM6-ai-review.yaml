suggested_questions:
- question: Which heterophilic partner dominates in vivo for CEACAM6 on neutrophils - CEACAM8 in cis on
    the same cell, or CEACAM1 in trans on endothelium?
- question: How does a GPI-anchored protein without a cytoplasmic tail deliver the anti-anoikis and promigratory
    signals attributed to CEACAM6?
suggested_experiments:
- hypothesis: CEACAM6 cis-heterodimers with CEACAM8 on neutrophils limit the trans-adhesive pool available
    for endothelial engagement.
  description: Quantify cis versus trans CEACAM6 complexes in resting and activated human neutrophils
    by crosslinking plus FRET, and test adhesion to CEACAM1-expressing endothelium after CEACAM8 knockdown.
