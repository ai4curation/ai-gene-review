core_functions:
- description: 'GPI-anchored CEACAM adhesion molecule on the external face of the plasma membrane: its
    IgV domain homodimerizes and heterodimerizes with CEACAM8, CEACAM1 and CEACAM5, mediating calcium-independent
    homophilic and heterophilic intercellular adhesion, including neutrophil adhesion to activated endothelium
    and tumour cell adhesion to endothelium.'
