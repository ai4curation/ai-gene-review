id: P40199
gene_symbol: CEACAM6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEACAM6 (NCA, CD66c) is a glycosylphosphatidylinositol-anchored member of the carcinoembryonic
  antigen family, composed of an N-terminal IgV-like domain and two IgC2-like domains displayed on the
  outer leaflet of the plasma membrane. It is expressed on granulocytes, where it is stored in secretory
  granules and delivered to the surface on activation, and on epithelia, where it is concentrated in the
  apical glycocalyx; it is strongly overexpressed in pancreatic, colorectal, lung and breast carcinomas.
  Through its IgV domain it homodimerizes and heterodimerizes with other CEACAMs, notably CEACAM8 on activated
  neutrophils and CEACAM5 and CEACAM1, mediating calcium-independent homophilic and heterophilic intercellular
  adhesion. These interactions support neutrophil adhesion to cytokine-activated endothelium and, in tumour
  cells, adhesion to endothelium, migration, invasion and resistance to anoikis, which makes the protein
  an antibody target.
