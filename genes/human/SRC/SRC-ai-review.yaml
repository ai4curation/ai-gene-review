suggested_questions:
- question: Was Csk phosphorylation of the Src tail already strongly inhibitory before animals? Monosiga ovata and
    M. brevicollis studies (PMID:16873552, PMID:18390552) found partial or weak inhibition, whereas a later yeast/in
    vitro study (PMID:28939764) reported Csk-mediated inhibition for Capsaspora and M. brevicollis proteins. Which
    assay conditions explain the difference? (The CSK review in this repository records the same dispute.)
- question: Which tyrosine-phosphorylated proteins does Src phosphorylate or bind in choanoflagellates and Capsaspora,
    and do any correspond to the animal focal-adhesion substrates (FAK, p130Cas, paxillin)? Capsaspora phosphoproteomics
    shows life-stage-specific tyrosine kinase phosphorylation (PMID:27746046) but not Src substrates specifically.
- question: Is the SRC C-terminal PDZ-binding motif conserved outside vertebrates, and does PDZ binding (AF-6, LNX1,
    MPP2, syntenin) represent a general SRC regulatory mechanism or a vertebrate addition?
- question: Should GO:0042169 SH2 domain binding (IPI, PMID:8070403, partner p130Cas) be retained, given that p130Cas
    lacks an SH2 domain and the cached abstract does not describe SRC binding an SH2 domain?
suggested_experiments:
- description: Side-by-side kinetic and cellular comparison of human SRC, Monosiga and Capsaspora Src with their
    cognate Csk, using identical purified proteins and SYF-cell rescue, to settle whether tail phosphorylation was
    inhibitory before animals.
- description: Src knockout or knockdown in Capsaspora owczarzaki or Salpingoeca rosetta, followed by phosphotyrosine
    proteomics and imaging of adhesion structures (filopodia, substrate contacts, aggregates or rosettes), to test
    whether Src controls cell-substrate adhesion in unicellular holozoans.
- description: Swap experiments placing choanoflagellate Src SH2 or SH2-kinase linker into human SRC to map which
    residues couple SH2 engagement to catalytic regulation in animal SRC (PMID:18390552 found this coupling absent
    in MbSrc1).
