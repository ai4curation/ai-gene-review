- id: PMID:16873552
  title: Functional development of Src tyrosine kinases during evolution from a unicellular ancestor to multicellular
    animals.
  findings:
  - statement: Src and Csk-mediated regulation present in the unicellular choanoflagellate Monosiga ovata; unicellular
      Src retains substantial activity when Csk-phosphorylated
    supporting_text: It can be phosphorylated by Csk at the negative regulatory site but still exhibits substantial
      activity even in the phosphorylated form.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches cached record; full text cached and read.
- id: PMID:18390552
  title: Signaling properties of a non-metazoan Src kinase and the evolutionary history of Src negative regulation.
  findings:
  - statement: M. brevicollis Src1 has mammalian-like SH3, SH2 and catalytic domain functions but SH2 and catalytic
      domains are not functionally coupled
    supporting_text: In contrast to mammalian c-Src, the SH2 and catalytic domains of MbSrc1 do not appear to be
      functionally coupled.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title matches cached record; full text cached and read.
- id: PMID:28939764
  title: Early emergence of negative regulation of the tyrosine kinase Src by the C-terminal Src kinase.
  findings:
  - statement: Csk-Src negative regulation reported for Capsaspora and M. brevicollis proteins (abstract only read)
    supporting_text: Our results suggest that negative regulation of Src by Csk is more ancient than previously
      thought and that it might be conserved across all holozoan species.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Abstract only read; conclusion conflicts with PMID:16873552 and PMID:18390552 on whether premetazoan
      Csk inhibits Src.
