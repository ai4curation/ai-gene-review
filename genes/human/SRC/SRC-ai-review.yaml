    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:21531765
  qualifier: involved_in
  review:
    summary: IMP annotation to negative regulation of transcription by RNA polymerase II (GO:0000122) from PMID:21531765.
      From a kinome-wide RNAi screen for regulators of telomerase activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: From a kinome-wide RNAi screen for regulators of telomerase activity; any effect of SRC knockdown on
      TERT transcription is an indirect consequence of signalling. SRC is not a transcriptional repressor, so this
      process term over-states its role.
