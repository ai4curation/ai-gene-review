id: P12931
gene_symbol: SRC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SRC (proto-oncogene c-Src) is a non-receptor protein tyrosine kinase of 536 residues built from an
  N-terminal myristoylated SH4/unique region, an SH3 domain, an SH2 domain, a tyrosine kinase domain and a short
  C-terminal regulatory tail. Myristoylation anchors it to the cytoplasmic face of the plasma membrane and endosomal
  membranes. Its activity is controlled by two intramolecular clamps: phosphorylation of the tail tyrosine (Tyr530)
  by CSK lets the SH2 domain bind the tail, and the SH3 domain binds the SH2-kinase linker, holding the kinase inactive;
  dephosphorylation of the tail (e.g. by PTPRA), or competing SH2/SH3 ligands, release the clamps and allow activation-loop
  autophosphorylation (Tyr419). The SH2 domain recruits SRC to phosphotyrosine sites on activated receptor tyrosine
  kinases, FAK/PYK2, PTPRA and other partners, the SH3 domain binds proline-rich motifs, and the C-terminus is a
  PDZ-binding motif. Once recruited, SRC phosphorylates many substrates at focal adhesions, adherens and gap junctions,
  podosomes and receptor complexes, transducing signals from integrins, growth factor, cytokine, G protein-coupled
  and immune receptors to control adhesion turnover, cytoskeletal organisation, migration, survival, proliferation
  and, in osteoclasts, bone resorption. Src kinases with the same SH3-SH2-kinase architecture and tail phosphorylation
  by Csk are present in choanoflagellates, unicellular relatives of animals; in those organisms Csk phosphorylation
  inhibits Src only weakly or partially, and the adhesion-junction and tissue-level roles of SRC are documented
  only in animals.'
