core_functions:
- description: Non-receptor protein tyrosine kinase that phosphorylates substrates in integrin, receptor tyrosine
    kinase and other receptor complexes at the plasma membrane and focal adhesions; activity is gated by CSK phosphorylation
    of the C-terminal tail and by activation-loop autophosphorylation. The kinase and its regulation by Csk tail
    phosphorylation predate animals (choanoflagellate Src), although the strength of Csk-mediated inhibition outside
    animals is disputed.
  molecular_function:
    id: GO:0004715
    label: non-membrane spanning protein tyrosine kinase activity
  directly_involved_in:
  - id: GO:0018108
    label: peptidyl-tyrosine phosphorylation
  - id: GO:0007229
    label: integrin-mediated signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005925
    label: focal adhesion
  supported_by:
  - reference_id: PMID:7525268
    supporting_text: Mutation of this tyrosine dramatically redistributes c-Src from endosomal membranes to focal
