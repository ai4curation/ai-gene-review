    id: GO:0046777
    label: protein autophosphorylation
  evidence_type: IDA
  original_reference_id: PMID:17491594
  review:
    summary: SRC autophosphorylates its activation-loop tyrosine (Tyr419 in human, Tyr416 in chicken numbering),
      the step that fully activates the kinase once the SH2-tail and SH3-linker clamps are released.
    action: NEW
    reason: 'Participation test: SRC itself catalyses the step (it phosphorylates its own activation loop). Comparator
      check: LYN carries GO:0046777 (IDA) whereas LCK and FYN do not, so there is no convention against the term
      for Src-family kinases. Not an ancestor or descendant of any term SRC already carries. Activation-loop autophosphorylation
      is also predicted for choanoflagellate Src (MbSrc1 phosphorylates a Tyr419-site peptide; PMID:18390552).'
    supported_by:
    - reference_id: PMID:17491594
      supporting_text: Binding of c-Src to the AF-6 PDZ domain interferes with phosphorylation of c-Src at Tyr527
        by the C-terminal kinase, and reduces c-Src autophosphorylation at Tyr416, resulting in a moderately activated
        c-Src kinase.
    - reference_id: PMID:18390552
      supporting_text: MbSrc1 phosphorylated a peptide modeled on the Tyr-419 autophosphorylation sequence of mammalian
        Src, suggesting that MbSrc1 might also be capable of autophosphorylation.
