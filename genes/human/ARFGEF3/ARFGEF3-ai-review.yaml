gene_symbol: ARFGEF3
product_type: PROTEIN
aliases:
- BIG3
- C6orf92
- KIAA1244
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ARFGEF3 (BIG3) is a 2177-residue cytoplasmic protein of the Sec7/BIG family that,
  unlike its paralogues BIG1 (ARFGEF1) and BIG2 (ARFGEF2), does not act as a guanine
  nucleotide exchange factor. Its Sec7 domain has lost the invariant "glutamic finger"
  glutamate that Sec7 GEFs use to destabilise ARF-bound GDP, carrying asparagine at
  the equivalent position, and the loss is shared with the mouse orthologue. The
  protein instead works through an armadillo/HEAT-type alpha-helical repeat region in
  its N-terminal third, which binds prohibitin 2 (PHB2). By holding PHB2 in the
  cytoplasm and occluding the surface through which PHB2 engages karyopherin-alpha
  import receptors, ARFGEF3 prevents oestradiol-driven nuclear entry of PHB2 and so
  relieves PHB2-mediated repression of oestrogen receptor alpha. A second scaffolding
  role operates on the same complex: ARFGEF3 is an A-kinase anchoring protein that
  binds protein kinase A through predicted RII-binding regions and docks the protein
  phosphatase 1 catalytic subunit PP1C-alpha through a canonical RVxF motif,
  inhibiting PP1C-alpha until PKA phosphorylation of ARFGEF3 relieves that inhibition.
  Expression is largely restricted to pancreatic islets, brain and salivary gland, with
  strong ectopic expression in breast carcinoma. In rodent islets the protein sits on
  immature insulin- and glucagon-containing secretory granules at the trans-Golgi
  network and restrains granule biogenesis, so that its loss raises hormone content
  and stimulated secretion and disturbs systemic glucose homeostasis. Reported
  localisation is cell-type dependent: diffusely cytoplasmic in breast carcinoma,
  granule- and TGN-associated in islet cells, lysosomal in hippocampal neurons, and
  mitochondrial in osteosarcoma lines.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      The pipeline itself is sound and correctly applied: ARFGEF3 genuinely carries
      InterPro IPR000904 (Sec7 domain). What is disputed is the inference the mapping
      encodes for this entry, namely that presence of the Sec7 domain implies exchange
      factor activity. ARFGEF3's Sec7 domain has lost the catalytic glutamate, so both
      GO terms this reference supplies (GO:0005085 and GO:0032012) overstate what the
      domain can do here. Recorded as DISPUTED rather than MISCITED because the defect
      is in a domain-to-activity rule, not in the citation.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Verified by resolving every WITH/FROM token on both IBA rows: 19 tokens each,
      10 shared, so 28 distinct (32 across all seven GOA rows that carry one), with
      zero unresolved. The node
      placements are well founded: every one of the 18 protein donors of the GO:0005085
      row carries its own experimental evidence for that term and 15 carry their own
      IDA. The GO:0016192 row's donors are heterogeneous in process, so that broad term
      is the genuine LCA. The problem on the GO:0005085 row is target-side loss of the
      catalytic residue, not a defect in this reference or in the node.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      The SL-0086 (Cytoplasm) mapping is exact. The SL-0244 and SL-0245 mappings are
      not: UniProt's own definition of SL-0244 describes regulated exocytosis of
      hormones and neurotransmitters, but the mapping sends it to GO:0030133 transport
      vesicle, which GO defines as the constitutive secretory pathway. GO:0030141
      secretory granule and GO:0030133 are disjoint sibling branches under GO:0031410,
      verified against QuickGO's is_a/part_of closure, so this is a wrong-branch
      mapping rather than a coarse one. Affects the vocabulary rule, not this gene
      alone.
- id: PMID:19496786
  title: Activation of an estrogen/estrogen receptor signaling by BIG3 through its
    inhibitory effect on nuclear transport of PHB2/REA in breast cancer.
  findings:
  - statement: >-
      Endogenous BIG3 is detected in the cytoplasm of human breast carcinoma tissue by
      immunohistochemistry, and is absent from normal breast, heart, lung and liver.
    supporting_text: showed its strong staining in the cytoplasm of two different
      histological subtypes of breast cancer
    reference_section_type: RESULTS
  - statement: >-
      BIG3 retains PHB2 in the cytoplasm, preventing its oestradiol-driven nuclear
      translocation and thereby increasing ERalpha transcriptional activity.
    supporting_text: BIG3 trapped PHB2/REA in the cytoplasm and inhibited its nuclear
      translocation, and caused enhancement of ERα transcriptional activity
    reference_section_type: ABSTRACT
  - statement: >-
      A direct BIG3-ERalpha interaction was looked for and not found, so the ERalpha
      effect is downstream of PHB2 rather than a direct activity of BIG3.
    supporting_text: we investigated the possibility of a direct interaction between
      BIG3 and ERα, but failed to indicate their interaction (data not shown)
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The founding functional paper on human BIG3 and the source of the single EXP
      annotation in GOA. Human cell lines and human tumour tissue throughout;
      localisation rests on endogenous protein with a validated antibody. The negative
      BIG3-ERalpha result is recorded because it constrains which terms are defensible.
- id: PMID:24997568
  title: Brefeldin A-inhibited guanine nucleotide-exchange protein 3 (BIG3) is predicted
    to interact with its partner through an ARM-type α-helical structure.
  findings:
  - statement: >-
      Alignment of BIG3 against characterised Sec7 domains shows it lacks the conserved
      Sec7 motif and the glutamate essential for exchange activity.
    supporting_text: they showed that BIG3 lacked the conserved motif and critically,
      the essential glutamate residue
    reference_section_type: RESULTS
  - statement: The loss of the catalytic motif is shared by BIG3 orthologues, so it is
      a clade-level feature rather than a human-specific artefact.
    supporting_text: This region is conserved among the BIG3 orthologues, all of which
      lack the functional motif.
    reference_section_type: RESULTS
  - statement: The PHB2-binding region of BIG3 was delimited experimentally to residues
      86-434.
    supporting_text: a series of co-immunoprecipitation assays identified residues 86-434
      to be responsible for the binding of BIG3 to PHB2
    reference_section_type: INTRODUCTION
  - statement: >-
      Alanine substitution of Q165, D169 and Q173 within the predicted binding helix
      strongly reduces PHB2 binding, mapping the interface to specific side chains.
    supporting_text: with alanine reduced the binding affinity to PHB2 dramatically
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The decisive sequence analysis for this review, and independently reproduced in
      ARFGEF3-bioinformatics/ as a precondition of that script running at all (7/7 of
      the paper's other Sec7 domains score positive, BIG3 negative). Two caveats
      recorded rather than glossed. First, the Methods give GEP100 as Swiss-Prot Q6ND90,
      which is a Rhodopseudomonas palustris succinate dehydrogenase subunit; the
      intended accession is Q6DN90. Second, the paper states its conclusion is
      consistent with a previous GST-GAT pull-down demonstration and the PMC
      cross-reference resolves that to PMID:24711543, but no such assay is locatable in
      that paper's accessible text, so the direct experimental demonstration of absent
      GEF activity remains unverified here.
- id: PMID:24711543
  title: BIG3 inhibits insulin granule biogenesis and insulin secretion.
  findings:
  - statement: BIG3 localises to insulin- and clathrin-positive trans-Golgi network
      compartments in insulin-secreting cells.
    supporting_text: BIG3 is predominantly localized to insulin- and clathrin-positive
      trans-Golgi network (TGN) compartments.
    reference_section_type: ABSTRACT
  - statement: Loss of BIG3 raises insulin content, granule number and stimulated
      secretion, identifying BIG3 as a negative regulator of granule biogenesis.
    supporting_text: BIG3-deficient insulin-secreting cells display increased insulin
      content and granule number and elevated insulin secretion upon stimulation.
    reference_section_type: ABSTRACT
  - statement: The authors' overall conclusion is that BIG3 restrains insulin granule
      biogenesis and secretion and contributes to systemic glucose homeostasis.
    supporting_text: these results demonstrate that BIG3 negatively modulates insulin
      granule biogenesis and insulin secretion and participates in the regulation of
      systemic glucose homeostasis
    reference_section_type: ABSTRACT
  - statement: The authors state that BIG3's Sec7 domain carries a non-functional
      catalytic motif.
    supporting_text: It is worth noting that the single known functional domain in BIG3
      by sequence analysis, the Sec7 domain, has a non-functional catalytic motif
    reference_section_type: DISCUSSION
  - statement: >-
      The authors propose, as an explicitly untested hypothesis, that BIG3 acts as a
      competitive dead Arf-GEF; this is a model, not a result, and no annotation here
      rests on it.
    supporting_text: one of our hypotheses is that BIG3 acts as a competitive
      non-functional Arf-GEF, thereby negatively modulating granule production
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The principal functional characterisation of the protein, but performed in mouse
      (MIN6 cells, BIG3-knockout mice), which is why the granule-pathway annotations
      proposed from it carry ISS with the mouse accession rather than IMP. Note the
      paper does contain a human element - exogenous human BIG3 rescues the knockdown
      phenotype - but that is a rescue experiment in a mouse cell line, not a
      measurement of the human protein's own behaviour in human cells.
- id: PMID:25139048
  title: Detection of insulin granule exocytosis by an electrophysiology method with
    high temporal resolution reveals enlarged insulin granule pool in BIG3-knockout
    mice.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Corroborates PMID:24711543 by localising the defect to granule number rather than
      to release kinetics, which is what makes "regulates biogenesis" preferable to
      "regulates exocytosis". Abstract-only in the cache and mouse-based, so nothing in
      this review rests on it alone.
- id: PMID:25737957
  title: Increased biogenesis of glucagon-containing secretory granules and glucagon
    secretion in BIG3-knockout mice.
  findings:
  - statement: BIG3 is expressed in pancreatic alpha cells as well as beta cells, and
      not in delta cells.
    supporting_text: BIG3 is highly expressed in pancreatic alpha-cells in addition to
      beta-cells, but is absent in delta-cells.
    reference_section_type: ABSTRACT
  - statement: Depleting BIG3 from alpha cells increases glucagon production and
      secretion, mirroring its effect on insulin in beta cells.
    supporting_text: Depletion of BIG3 in alpha-cells leads to elevated glucagon
      production and secretion.
    reference_section_type: ABSTRACT
  - statement: The phenotype is reproduced in whole animals under hypoglycaemic
      challenge.
    supporting_text: Consistently, BIG3-knockout (BKO) mice display increased glucagon
      release under hypoglycemic conditions.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Important because it generalises the granule phenotype beyond insulin: the same
      negative regulation applies to glucagon granules in a different islet cell type.
      That is what licenses the broader GO:1904410 rather than an insulin-specific term.
      Mouse throughout, hence ISS.
- id: PMID:28555617
  title: A-kinase anchoring protein BIG3 coordinates oestrogen signalling in breast
    cancer cells.
  findings:
  - statement: Endogenous BIG3 and PP1C-alpha interact in human ERalpha-positive breast
      cancer cell lines.
    supporting_text: We detected an endogenous interaction between BIG3 and PP1Cα in
      the ERα-positive breast cancer cell lines MCF-7 and KPL-3C, which highly express
      both proteins
    reference_section_type: RESULTS
  - statement: >-
      BIG3 inhibits PP1C-alpha catalytic activity, and the inhibition requires BIG3's
      RVxF docking motif, since the motif-deleted mutant neither binds nor inhibits.
    supporting_text: This showed that the introduction of WT-BIG3 inhibited endogenous
      PP1Cα activity in a dose-dependent manner, while ΔPP1Cα-BIG3 did not
    reference_section_type: RESULTS
  - statement: Endogenous BIG3 interacts with protein kinase A in human breast cancer
      cells.
    supporting_text: We found that endogenous BIG3 interacts with PKA in breast cancer
      cells
    reference_section_type: RESULTS
  - statement: >-
      The PKA-binding determinant is two predicted RII-binding domains; the subunit
      specificity is in silico, whereas the interaction itself was measured.
    supporting_text: BIG3 contains two potential RII-binding domains (RIIBDs) that bind
      to the RII subunit of PKA
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The source of three molecular functions that GOA does not record at all, all of
      them measured on endogenous human proteins in human cells. Note the level at
      which each claim is safe: the PKA interaction was measured but the RII-subunit
      specificity is predicted, so this review annotates the parent GO:0051018 rather
      than GO:0034237.
- id: PMID:26052702
  title: BIG3 Inhibits the Estrogen-Dependent Nuclear Translocation of PHB2 via Multiple
    Karyopherin-Alpha Proteins in Breast Cancer Cells.
  findings:
  - statement: BIG3 blocks oestradiol-dependent nuclear import of PHB2, acting through
      the karyopherin-alpha import receptors.
    supporting_text: Here, we report that BIG3 blocks the estrogen (E2)-dependent nuclear
      import of PHB2 via the karyopherin alpha (KPNA) family in breast cancer cells.
    reference_section_type: ABSTRACT
  - statement: >-
      The mechanism is occlusion of the KPNA-binding surface of PHB2 by BIG3, rather
      than a generic cytoplasmic tether.
    supporting_text: These data indicated that BIG3 may block the KPNAs (KPNA1, KPNA5,
      and KPNA6) binding region(s) of PHB2, thereby leading to inhibition of
      KPNAs-mediated PHB2 nuclear translocation in the presence of E2 in breast cancer
      cells.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      This is what converts "BIG3 keeps PHB2 cytoplasmic" into a specific molecular
      function: BIG3 prevents PHB2 from engaging its import receptors, which is the
      GO:0140311 definition almost word for word. Human cell lines throughout.
- id: PMID:24051437
  title: Targeting BIG3-PHB2 interaction to overcome tamoxifen resistance in breast
    cancer cells.
  findings:
  - statement: >-
      Disrupting the BIG3-PHB2 complex with the ERAP peptide releases PHB2 to bind
      ERalpha, confirming that sequestration by BIG3 is what normally prevents it.
    supporting_text: Intrinsic PHB2 released from BIG3 by ERAP directly binds to both
      nuclear- and membrane-associated ERα
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The loss-of-interaction complement to PMID:19496786: a targeted disruption of the
      interface releases the ligand and reverses the downstream effect, which is
      stronger evidence for a sequestering function than either knockdown or
      overexpression alone.
- id: PMID:25736224
  title: Therapeutic advances in BIG3-PHB2 inhibition targeting the crosstalk between
    estrogen and growth factors in breast cancer.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Downstream pharmacology of the released PHB2 rather than a statement about BIG3's
