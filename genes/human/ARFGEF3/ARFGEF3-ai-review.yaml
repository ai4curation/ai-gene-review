- term:
    id: GO:0140311
    label: protein sequestering activity
  evidence_type: IMP
  original_reference_id: PMID:19496786
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q99623
  review:
    summary: >-
      ARFGEF3's best-evidenced molecular function, and GOA records nothing like it. BIG3
      binds PHB2 and holds it away from the compartment where PHB2 acts, which is the
      GO:0140311 definition almost word for word.
    action: NEW
    reason: >-
      GO:0140311 is the exact-fit child of GO:0140313: the same definition with
      "a specific molecule" narrowed to "a protein". The sequestered species here is
      PHB2, a protein, so the child adds no claim beyond the one the ligand's identity
      already fixes - which is precisely why the child is right here and the parent is
      right on the GO:0051018 row, where the child would have asserted an unproven
      subunit specificity. GO defines it as binding a protein to
      prevent it from interacting with other partners or to inhibit its localisation to
      the area of the cell where it is active. Both clauses are satisfied and each is
      separately demonstrated. Depleting BIG3 by siRNA in human breast cancer cell lines
      releases PHB2 into the nucleus on oestradiol stimulation, and re-expressing BIG3
      holds it in the cytoplasm even with stimulation, which is the localisation clause.
      The partner-occlusion clause is established by the karyopherin work, which shows
      BIG3 blocks the surface through which PHB2 engages its import receptors, so this
      is not a generic tether. Targeted disruption of the interface with the ERAP
      peptide, and independently with xanthohumol, releases PHB2 and reverses the
      downstream effect, which is stronger than knockdown or overexpression alone. The
      interface is mapped to residues 86-434 by co-immunoprecipitation and to Q165, D169
      and Q173 by alanine scanning. Evidence code is IMP rather than IDA because the
      demonstrations are knockdown, re-expression and targeted disruption in human cells
      rather than a direct assay on purified components. The experiments are human
      throughout, so an experimental code is appropriate here.
    supported_by:
    - reference_id: PMID:19496786
      supporting_text: BIG3 trapped PHB2/REA in the cytoplasm and inhibited its nuclear
        translocation, and caused enhancement of ERα transcriptional activity
    - reference_id: PMID:26052702
      supporting_text: These data indicated that BIG3 may block the KPNAs (KPNA1, KPNA5,
        and KPNA6) binding region(s) of PHB2, thereby leading to inhibition of
        KPNAs-mediated PHB2 nuclear translocation in the presence of E2 in breast cancer
        cells.
    - reference_id: PMID:24051437
      supporting_text: Intrinsic PHB2 released from BIG3 by ERAP directly binds to both
        nuclear- and membrane-associated ERα
- term:
