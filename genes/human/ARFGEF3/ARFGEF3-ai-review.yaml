      endogenous proteins in two human ERalpha-positive lines, and deleting the
      canonical RVxF motif at residues 1228-1232 abolishes it. RVxF is the standard
      docking motif by which PP1 regulatory subunits engage the PP1 catalytic subunit,
      so the structural basis is the recognised one rather than an inference from
      co-precipitation. Annotated as IPI with the human PPP1CA accession, and the
      experiment really was human protein with human protein in human cells.
    supported_by:
    - reference_id: PMID:28555617
      supporting_text: We detected an endogenous interaction between BIG3 and PP1Cα in
        the ERα-positive breast cancer cell lines MCF-7 and KPL-3C, which highly express
        both proteins
- term:
    id: GO:0004865
    label: protein serine/threonine phosphatase inhibitor activity
  evidence_type: IMP
  original_reference_id: PMID:28555617
  qualifier: enables
  supporting_entities:
  - UniProtKB:P62136
  review:
    summary: >-
      BIG3 does not merely bind PP1C-alpha, it inhibits its catalytic activity, and the
      inhibition depends on the docking motif. A second molecular function absent from
      GOA.
    action: NEW
    reason: >-
      GO:0004865 rather than its parent GO:0004864 for the same reason the
      sequestering row uses GO:0140311: PPP1CA is a serine/threonine phosphatase by
      definition (UniProt "Serine/threonine-protein phosphatase PP1-alpha catalytic
      subunit", EC 3.1.3.16), so naming the substrate class adds no claim the inhibited
      enzyme's identity did not already fix. Binding and inhibiting are separate claims
      and the paper separates them. Titrating
      wild-type BIG3 into cells reduces endogenous PP1C-alpha phosphatase activity in a
      dose-dependent manner against a defined substrate, while the RVxF-deleted mutant
      at equivalent expression does not, so the inhibition tracks the docking
      interaction rather than expression level. Removing endogenous BIG3 by siRNA in two
      human breast cancer lines relieves the inhibition, which is the reciprocal test.
      Evidence code IMP rather than IDA because the readouts are transfection and
      knockdown in cells rather than an assay on purified proteins. This is also what
      makes the AKAP description mechanistically coherent: BIG3 holds a kinase and a
      phosphatase on the same scaffold and gates the phosphatase, with PKA
      phosphorylation of BIG3 relieving the gate.
    supported_by:
    - reference_id: PMID:28555617
      supporting_text: This showed that the introduction of WT-BIG3 inhibited endogenous
        PP1Cα activity in a dose-dependent manner, while ΔPP1Cα-BIG3 did not
- term:
    id: GO:0051018
    label: protein kinase A binding
  evidence_type: IPI
  original_reference_id: PMID:28555617
  qualifier: enables
  review:
    summary: >-
      Endogenous BIG3 interacts with PKA in human breast cancer cells, which together
      with the PP1 binding is what makes it an A-kinase anchoring protein. Missing from
      GOA.
    action: NEW
    reason: >-
      Annotated at the parent term rather than at GO:0034237 protein kinase A regulatory
      subunit binding, deliberately. What was measured is an interaction between
      endogenous BIG3 and PKA; the assignment to the RII regulatory subunit comes from
      in silico identification of two candidate RII-binding domains at residues 318-338
      and 1225-1245 and was not itself demonstrated. Annotating the child would assert a
      subunit specificity the data do not establish, so the claim is pitched at the
      level the evidence supports and the predicted specificity is recorded as a
      question instead. No supporting_entities are given for the same reason: naming a
      specific PKA subunit accession would encode the unproven half of the claim.
      Anchoring both a kinase and a phosphatase places ARFGEF3 in the same functional
      class as its paralogues BIG1 and BIG2, which carry AKAP sequences too, so this is
      the part of the family inheritance that survived the loss of catalysis.
    supported_by:
    - reference_id: PMID:28555617
      supporting_text: We found that endogenous BIG3 interacts with PKA in breast cancer
        cells
    - reference_id: PMID:28555617
      supporting_text: BIG3 contains two potential RII-binding domains (RIIBDs) that bind
        to the RII subunit of PKA
- term:
    id: GO:1904410
    label: negative regulation of secretory granule organization
  evidence_type: ISS
  original_reference_id: PMID:24711543
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q3UGY8
  review:
    summary: >-
      The best-characterised physiological role of the protein: it restrains biogenesis
      of hormone-containing secretory granules, so losing it increases hormone content
      and stimulated release. Established in mouse, hence ISS.
    action: NEW
    reason: >-
      Chosen at this level rather than as an insulin-specific term because the same
      effect is seen for two different hormones in two different islet cell types.
      Knocking BIG3 down in beta cells raises insulin content, granule number and
      stimulated secretion and accelerates proinsulin processing; depleting it from
      alpha cells raises glucagon production and secretion, and knockout animals release
      more glucagon under hypoglycaemic challenge. An insulin-only term would understate
      that. Chosen as biogenesis-level regulation rather than exocytosis because
      capacitance measurements localise the change to granule number rather than to the
      release kinetics of individual granules. That measurement is what decides between
      two terms that are not interchangeable: GO:1903306 negative regulation of
      regulated secretory pathway was considered and rejected, because it targets the
      release step the capacitance data specifically exonerate, and QuickGO's is_a and
      part_of closure confirms it is neither an ancestor nor a descendant of GO:1904410
      - the two are disjoint, so choosing the wrong one asserts a different claim rather
      than a coarser one. GO:1904410's target GO:0033363 is defined as the assembly and
      arrangement of a secretory granule, which is exactly what changes when BIG3 is
      removed. No regulation-of-secretory-granule-maturation term exists, so the
      accelerated proinsulin and chromogranin A processing seen on knockdown is not
      separately annotated. Evidence code is ISS with the mouse
      accession, not IMP: every one of these experiments was performed in mouse cells or
      mice, and the human protein has never been tested in this pathway. The one human
      reagent involved is exogenous human BIG3 rescuing the knockdown in a mouse cell
      line, which is a cross-species rescue and is exactly what ISS is for.
    supported_by:
    - reference_id: PMID:24711543
      supporting_text: these results demonstrate that BIG3 negatively modulates insulin
        granule biogenesis and insulin secretion and participates in the regulation of
        systemic glucose homeostasis
    - reference_id: PMID:24711543
      supporting_text: BIG3-deficient insulin-secreting cells display increased insulin
        content and granule number and elevated insulin secretion upon stimulation.
    - reference_id: PMID:25737957
      supporting_text: Depletion of BIG3 in alpha-cells leads to elevated glucagon
        production and secretion.
    - reference_id: PMID:25737957
      supporting_text: Consistently, BIG3-knockout (BKO) mice display increased glucagon
        release under hypoglycemic conditions.
core_functions:
- description: >-
    Sequesters prohibitin 2 in the cytoplasm by binding it through an armadillo/HEAT-type
    alpha-helical repeat region and occluding the surface through which PHB2 engages
    karyopherin-alpha import receptors, thereby preventing oestradiol-driven nuclear
    entry of PHB2 and relieving PHB2-mediated repression of nuclear oestrogen receptor
    alpha.
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  directly_involved_in:
  - id: GO:0042308
    label: negative regulation of protein import into nucleus
  locations:
  - id: GO:0005737
    label: cytoplasm
  substrates:
  - id: UniProtKB:Q99623
    label: PHB2
  supported_by:
  - reference_id: PMID:19496786
    supporting_text: BIG3 trapped PHB2/REA in the cytoplasm and inhibited its nuclear
      translocation, and caused enhancement of ERα transcriptional activity
  - reference_id: PMID:26052702
    supporting_text: These data indicated that BIG3 may block the KPNAs (KPNA1, KPNA5,
      and KPNA6) binding region(s) of PHB2, thereby leading to inhibition of
      KPNAs-mediated PHB2 nuclear translocation in the presence of E2 in breast cancer
      cells.
- description: >-
    Acts as an A-kinase anchoring protein that docks the protein phosphatase 1 catalytic
    subunit PP1C-alpha through a canonical RVxF motif and inhibits its phosphatase
    activity, while separately binding protein kinase A, so that PKA phosphorylation of
    the scaffold releases the phosphatase onto its substrate.
  molecular_function:
    id: GO:0004865
    label: protein serine/threonine phosphatase inhibitor activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  substrates:
  - id: UniProtKB:P62136
    label: PPP1CA
  supported_by:
  - reference_id: PMID:28555617
    supporting_text: This showed that the introduction of WT-BIG3 inhibited endogenous
      PP1Cα activity in a dose-dependent manner, while ΔPP1Cα-BIG3 did not
  - reference_id: PMID:28555617
    supporting_text: We detected an endogenous interaction between BIG3 and PP1Cα in the
      ERα-positive breast cancer cell lines MCF-7 and KPL-3C, which highly express both
      proteins
- description: >-
    Associates with immature hormone-containing secretory granules at the trans-Golgi
    network and restrains their biogenesis, limiting insulin and glucagon content and
    stimulated secretion by islet beta and alpha cells and thereby contributing to
    systemic glucose homeostasis. Established in mouse; the human protein has not been
    tested in this pathway.
  directly_involved_in:
  - id: GO:1904410
