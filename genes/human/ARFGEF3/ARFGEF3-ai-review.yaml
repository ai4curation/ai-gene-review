  supported_by:
  - reference_id: PMID:24711543
    supporting_text: these results demonstrate that BIG3 negatively modulates insulin
      granule biogenesis and insulin secretion and participates in the regulation of
      systemic glucose homeostasis
  - reference_id: PMID:25737957
    supporting_text: BIG3 is highly expressed in pancreatic alpha-cells in addition to
      beta-cells, but is absent in delta-cells.
knowledge_gaps:
- gap_statement: >-
    No experiment has directly measured whether ARFGEF3 can load GTP onto any ARF
    protein. The conclusion that it cannot rests on absence of the catalytic glutamate
    and on the authors' repeated sequence-level statements. PMID:24997568 asserts a
    prior GST-GAT pull-down demonstration and its cross-reference resolves to
    PMID:24711543, but no such assay is locatable in that paper's accessible text.
  boundary: >-
    Established: the Sec7 catalytic glutamate is absent in human and mouse ARFGEF3 and
    present in 17 of 17 catalytically verified relatives. Not established: that ARFGEF3
    fails a direct exchange assay, or whether its Sec7 domain still binds ARF without
    catalysing exchange.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Decides whether GO:0032012 should be restored. A dead Sec7 domain that still binds
    ARF would make ARFGEF3 a genuine regulator of ARF signalling; one that binds nothing
    would make the whole ARF connection an artefact of the family name.
- gap_statement: >-
    ARFGEF3 is reported in four different compartments in four cell types - cytoplasm in
    breast carcinoma, TGN and secretory granules in islet cells, lysosomes in
    hippocampal neurons, mitochondria in osteosarcoma lines - and no study has compared
    them in one system.
  boundary: >-
    Each individual report is internally consistent and the osteosarcoma paper
    explicitly contrasts its result with the breast cancer localisation rather than
    disputing it. What is missing is whether these are genuinely different pools, a
    single pool differently detected, or an antibody artefact.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Only the cytoplasmic assignment is supported in human cells, so three of the four
    compartments cannot presently be annotated. A comparative study would either license
    three new CC terms or retire them.
- gap_statement: >-
    UniProt's SubCell mapping sends SL-0244 Secretory vesicle to GO:0030133 transport
    vesicle and SL-0245 to GO:0030658, but the secretory-granule and transport-vesicle
    branches are disjoint in GO, so the mapping places proteins in the constitutive
    pathway when the SubCell term's own definition describes regulated exocytosis.
  boundary: >-
    Verified against QuickGO's is_a and part_of closure that GO:0030141 is neither an
    ancestor nor a descendant of GO:0030133. Not established: how many of the 130685
    entries carrying SL-0244 are actually in the regulated pathway, which would need
    case-by-case review.
  gap_kind:
  - CURATION
  status: OPEN
  significance: >-
    A single vocabulary-level rule, so a fix propagates to every affected entry at once
    rather than needing per-gene correction.
- gap_statement: >-
    The interpro2go line mapping IPR000904 to GO:0005085 fires on a profile match to the
    Sec7 fold without testing whether the catalytic glutamate is present, so it assigns
    exchange activity to Sec7-fold pseudo-GEFs.
  boundary: >-
    Demonstrated for ARFGEF3, where the domain is genuinely present and the catalytic
    residue genuinely absent. Not quantified: how many other IPR000904 members lack the
    glutamic finger.
  gap_kind:
  - CURATION
  status: OPEN
  significance: >-
    Gating the mapping on the catalytic motif rather than on the domain match would fix
    every Sec7-fold pseudo-GEF in one edit, in the same way that a catalytic-residue
    gate would help the metalloprotease and serine-hydrolase families.
suggested_questions:
- question: >-
    Does purified ARFGEF3, or its isolated Sec7 domain, bind ARF1 or ARF6 at all, and
    does it inhibit exchange catalysed by BIG1 or BIG2 in trans? This distinguishes a
    genuine competitive dead GEF - the model its characterisers proposed but never
    tested - from a protein whose Sec7 region has simply become a structural element.
  experts:
  - Catherine Jackson
  - Weiping Han
- question: >-
    Is the PKA contact really made through the predicted RII-binding domains at residues
    318-338 and 1225-1245? The interaction was measured but the subunit specificity was
    only predicted, which is why this review annotates GO:0051018 rather than its child
    GO:0034237.
  experts:
  - Toyomasa Katagiri
- question: >-
    Are the cytoplasmic, granule, lysosomal and mitochondrial pools of ARFGEF3 the same
    protein in different cell types, or does the protein have compartment-specific
    isoforms or modifications? A single comparative study across islet, neuronal and
    carcinoma cells would settle three currently unannotatable localisations.
  experts:
  - Weiping Han
- question: >-
    Is ARFGEF3 an integral membrane protein? UniProt records single-pass topology from a
    predicted helix at 1492-1512 with ECO:0000255 and marks the membrane localisation
    ECO:0000305, while PMID:24997568's own analysis found no evidence for any predicted
    helix being transmembrane. The two computational assessments disagree and neither is
    a measurement.
  experts:
  - Weiping Han
- question: >-
    Should PAINT reconsider what node PTN008950430 donates to Mon2-like members? Yeast
    MON2 is a WITH/FROM donor for GO:0005085 on this row despite having no annotated
    SEC7 domain and no IPR000904, and holding the term only by IGI, IPI and ISS. MON2
    and ARFGEF3 share IPR015403, so the same node may be donating exchange activity to a
    second member that does not perform it.
  experts:
  - Pascale Gaudet
- question: >-
    ARFGEF1 and ARFGEF2 carry the identical GO:0005085 IBA row from the identical
    PANTHER node, and should keep it: their glutamic fingers are intact at E793 and E738
    respectively, and both hold their own IDA. Reviews of the three paralogues should
    diverge on this row for a stated structural reason rather than silently.
  experts:
  - Pascale Gaudet
suggested_experiments:
- hypothesis: >-
    ARFGEF3's Sec7 domain retains ARF binding but cannot catalyse exchange, allowing it
    to act as a competitive inhibitor of BIG1 and BIG2 at the trans-Golgi network.
  description: >-
    Express and purify the ARFGEF3 Sec7 domain (residues 583-796) alongside the
    equivalent BIG1 domain as a positive control and a BIG1 E793A mutant as the dead
    control. Measure ARF1 nucleotide exchange by tryptophan fluorescence or mant-GTP
    loading, and ARF binding independently by isothermal titration calorimetry or
    surface plasmon resonance, so that binding and catalysis are separated. Then test
    whether adding the ARFGEF3 domain slows BIG1-catalysed exchange in trans. The
    controls matter more than the query here: without the E793A mutant the assay cannot
    demonstrate that it is capable of reporting zero activity.
  experiment_type: biochemical assay
- hypothesis: >-
    The change in insulin granule number on ARFGEF3 loss is caused by altered ARF1
    activation at the trans-Golgi network.
  description: >-
    Measure ARF1-GTP levels in ARFGEF3-knockout and wild-type islets and MIN6 cells by
    GGA-GAT domain pull-down, with brefeldin A treatment as the positive control for a
    reduction in active ARF1. This is the experiment the literature already cites as
    having been done but which is not locatable in the cited paper, so performing and
    reporting it would close the review's principal evidential gap.
  experiment_type: biochemical assay
- hypothesis: >-
    ARFGEF3's sequestering function is not restricted to PHB2 and not restricted to
    breast carcinoma.
  description: >-
    Perform proximity labelling with ARFGEF3 as bait in an islet beta cell line, a
    hippocampal neuron culture and an ERalpha-positive breast cancer line in parallel,
    and compare the interactomes. Consistent recovery of PHB2 across all three would
    argue for one conserved function detected in different compartments; cell-type
    specific partner sets would argue for genuinely distinct roles and would explain the
    four reported localisations.
  experiment_type: proteomics
- hypothesis: >-
    ARFGEF3 localises to lysosomes in neurons and this pool regulates inhibitory
    neurotransmission.
  description: >-
    Replicate the lysosomal assignment in human neurons, ideally iPSC-derived, using a
    knockout-validated antibody or an endogenously tagged allele rather than
    overexpression, with LAMP1 co-staining and with the islet granule markers as a
    negative control. A single mouse report is currently the only evidence, which is why
    no lysosome term is proposed in this review.
  experiment_type: imaging
