- term:
    id: GO:0030133
    label: transport vesicle
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0244
  review:
    summary: >-
      Right organelle family, wrong branch. The underlying evidence is insulin and
      glucagon granules, which are regulated secretory granules, whereas GO:0030133 is
      defined as the constitutive secretory pathway. The two terms are disjoint
      siblings, so this is not merely a coarse assignment.
    action: MODIFY
    reason: >-
      The row comes from UniProt's SL-0244, which UniProt itself names Secretory vesicle
      and defines in regulated-pathway language, as a vesicle that carries cargo such as
      hormones or neurotransmitters to the cell membrane where it docks and fuses to
      release its content. The SubCell-to-GO mapping nonetheless sends SL-0244 to
      GO:0030133, whose GO definition is any of the vesicles of the constitutive
      secretory pathway. Checked rather than assumed: querying QuickGO's is_a and
      part_of closure shows GO:0030141 secretory granule is not an ancestor or a
      descendant of GO:0030133, both instead descending separately from GO:0031410
      cytoplasmic vesicle. So the mapping crosses into a disjoint branch and the fix is
      a replacement, not a refinement. The primary evidence behind UniProt's statement
      is the mouse work, where immuno-EM puts the protein on insulin granules and where
      its loss changes granule number, which is squarely the regulated secretory granule
      branch. Proposing GO:0030141. The defect is in the vocabulary mapping rather than
      in this gene's curation, and it is applied to 130685 UniProtKB entries, which is
      the scale at which it would need fixing wherever the regulated reading applies -
      not a claim that all of those entries are mis-annotated.
