- id: PMID:14657013
  title: 'BIG-3, a novel WD-40 repeat protein, is expressed in the developing growth
    plate and accelerates chondrocyte differentiation in vitro.'
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: NONE
    correctness: MISCITED
    review_notes: >-
      Not this gene. The affinage record presents this paper's chondrocyte
      differentiation results as ARFGEF3 findings, but its "BIG-3" is BMP-2-induced gene
      3 kb, a 34 kDa protein with seven WD-40 repeats (PMID:11551928). ARFGEF3/BIG3 is
      2177 residues with Sec7 and armadillo-type repeats and no WD-40 domain. A pure
      symbol collision. Nothing in this review rests on it; listed so the collision is
      recorded rather than silently dropped.
