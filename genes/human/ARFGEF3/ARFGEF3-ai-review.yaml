  - AGI_LocusCode:AT5G39500
  - FB:FBgn0028538
  - PANTHER:PTN008950430
  - PomBase:SPBC211.03c
  - RGD:631430
  - SGD:S000000748
  - SGD:S000002577
  - SGD:S000003792
  - SGD:S000005241
  - SGD:S000006299
  - UniProtKB:O43739
  - UniProtKB:Q92538
  - UniProtKB:Q9Y6D5
  - WB:WBGene00007703
  - dictyBase:DDB_G0272486
  review:
    summary: >-
      Correct and core. ARFGEF3 sits on immature secretory granules at the trans-Golgi
      network and sets how many of them are made, which is participation in vesicular
      traffic even though it contributes no catalysis. The broad term is the right level
      here, not a failure to be specific.
    action: ACCEPT
    reason: >-
      This is the one family function ARFGEF3 demonstrably retained. Immuno-EM places it
      on insulin granules and on clathrin-positive TGN compartments, and removing it
      raises granule number, hormone content and stimulated secretion in beta cells,
      with the same sign in alpha cells for glucagon. So the protein does part of the
      work of the pathway rather than merely being required for it. On whether the term
      is too general: resolving all 18 protein donors shows they hold thirteen different
      descendant processes between them, spanning anterograde ER-to-Golgi, retrograde,
      intra-Golgi, endosome-to-Golgi and exocytic steps, so GO:0016192 is the genuine
      least common ancestor of the donor set rather than a coarse stand-in for one of
      them. A granularity mismatch requires the donors to agree, and here they
      emphatically do not, so no specificity upgrade is proposed on this row. The
      specific, better-evidenced process is instead proposed separately as GO:1904410
      with ISS from the mouse work, which keeps the phylogenetic inference and the
      species-specific evidence in their own rows.
    supported_by:
    - reference_id: PMID:24711543
      supporting_text: BIG3 is predominantly localized to insulin- and clathrin-positive
        trans-Golgi network (TGN) compartments.
    - reference_id: PMID:24711543
      supporting_text: Furthermore, BIG3 predominantly localized to insulin granules of
        islet β-cells, as revealed by immuno-EM
    - reference_id: PMID:24711543
      supporting_text: BIG3-deficient insulin-secreting cells display increased insulin
        content and granule number and elevated insulin secretion upon stimulation.
    - reference_id: file:human/ARFGEF3/ARFGEF3-bioinformatics/RESULTS.md
      supporting_text: '`GO:0016192` is therefore the genuine **LCA** of a heterogeneous donor set, not a'
