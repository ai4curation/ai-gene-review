existing_annotations:
- term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G13980
  - FB:FBgn0028538
  - FB:FBgn0264560
  - MGI:MGI:1334257
  - MGI:MGI:1918215
  - PANTHER:PTN008950430
  - PomBase:SPAC11E3.11c
  - SGD:S000000748
  - SGD:S000002577
  - SGD:S000003792
  - SGD:S000005241
  - SGD:S000006299
  - UniProtKB:A5PKW4
  - UniProtKB:O43739
  - UniProtKB:Q15438
  - UniProtKB:Q5JU85
  - UniProtKB:Q9UIA0
  - UniProtKB:Q9Y6D5
  - UniProtKB:Q9Y6D6
  review:
    summary: >-
      ARFGEF3 has never been shown to catalyse nucleotide exchange on any ARF, and its
      Sec7 domain lacks the invariant glutamate that performs the reaction. The
      ancestral node is correctly placed and the donors are genuine GEFs; ARFGEF3 is the
      descendant that lost the catalytic residue.
    action: REMOVE
    reason: >-
      Sec7-domain exchange factors act through a single invariant glutamate, the
      glutamic finger, which inserts into the ARF nucleotide pocket to destabilise bound
      GDP. Re-deriving this from live sequence rather than taking it on the literature's
      word, with the comparison panel built from this row's own WITH/FROM field: all 17
      donors that have an annotated SEC7 domain carry glutamate at the derived
      glutamic-finger column, whereas ARFGEF3 carries asparagine at Q5TH69 position 692
      and matches the Sec7 catalytic motif zero times anywhere in its SEC7 domain. Mouse
      Arfgef3 carries serine at the equivalent position, so the loss is clade-level and
      not a human annotation artefact. The check is controlled in both directions - a
      verified-active paralogue scores positive, and the same sequence with its glutamic
      finger mutated to alanine scores negative - so it is capable of reporting the
      opposite result and does not here. This reproduces the published alignment of
      PMID:24997568 and matches what the group that characterised the protein states in
      two further papers. Note the asymmetry being relied on: losing the catalytic
      residue is strong evidence against the activity, whereas retaining it would not
      have been evidence for it, so only the negative direction is claimed. REMOVE
      rather than MARK_AS_OVER_ANNOTATED because the term asserts a specific chemical
      activity that the protein is structurally unable to perform, which is a different
      situation from a term that merely exceeds its evidence. The node itself should not
      be changed: the other members really are GEFs, and this row is the single member
      that should not inherit.
    supported_by:
    - reference_id: PMID:24997568
      supporting_text: they showed that BIG3 lacked the conserved motif and critically,
        the essential glutamate residue
    - reference_id: PMID:24997568
      supporting_text: This region is conserved among the BIG3 orthologues, all of which
        lack the functional motif.
    - reference_id: PMID:24711543
      supporting_text: It is worth noting that the single known functional domain in
        BIG3 by sequence analysis, the Sec7 domain, has a non-functional catalytic motif
    - reference_id: PMID:27696409
      supporting_text: we recently identified BIG3 as a novel ARF GEF protein with a
        non-functional catalytic motif in the SEC7 domain
    - reference_id: file:human/ARFGEF3/ARFGEF3-bioinformatics/RESULTS.md
      supporting_text: '| known-active donors (own experimental GEF evidence) | 17 | **E in 17/17** |'
    propagation_review:
