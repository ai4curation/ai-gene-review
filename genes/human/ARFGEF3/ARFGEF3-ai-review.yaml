- id: PMID:34363714
  title: The survival and proliferation of osteosarcoma cells are dependent on the
    mitochondrial BIG3-PHB2 complex formation.
  findings:
  - statement: >-
      In osteosarcoma cell lines the BIG3-PHB2 complex is mainly mitochondrial, which
      the authors explicitly contrast with its cytoplasmic distribution in breast cancer
      cells.
    supporting_text: BIG3-PHB2 complexes were localized mainly in mitochondria in OS
      cells, unlike in estrogen-dependent breast cancer cells.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      A genuine fourth compartment, and the paper itself frames it as cell-type
      dependent rather than as a correction of the earlier work. Raised as a question
      rather than annotated, because it rests on one paper in one tumour lineage and
      would otherwise import a mitochondrial localisation into the gene's general
      record.
- id: PMID:27696409
  title: Brefeldin A-inhibited guanine nucleotide exchange protein 3 is localized in
    lysosomes and regulates GABA signaling in hippocampal neurons.
  findings:
  - statement: >-
      In hippocampal neurons BIG3 is mainly lysosomal, and its loss selectively impairs
      inhibitory synaptic transmission.
    supporting_text: In hippocampal neurons, BIG3 is mainly localized in lysosomes, and
      its depletion selectively impairs inhibitory synaptic transmission.
    reference_section_type: ABSTRACT
  - statement: >-
      The group that characterised BIG3 restates that its SEC7 domain carries a
      non-functional catalytic motif.
    supporting_text: we recently identified BIG3 as a novel ARF GEF protein with a
      non-functional catalytic motif in the SEC7 domain
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The single most compartment-informative paper on this gene, and affinage did not
      return it; it was found only by an independent PubMed sweep. It adds a fourth
      localisation and an entire tissue context (brain) that GOA does not cover. Not
      annotated here because it is mouse, abstract-only in the cache, and the lysosomal
      assignment has not been replicated; recorded instead as a knowledge gap and a
      question.
