    action: NEW
    reason: >-
      ARFGEF3 does the work of this process rather than merely being required for it: it
      is the entity that binds the cargo and occludes the receptor-binding surface, and
      the import that is prevented is measured directly as PHB2 nuclear signal. Knocking
      BIG3 down increases the proportion of cells with nuclear PHB2 after oestradiol,
      re-expressing it abolishes that increase, and knocking down KPNA1, KPNA5 or KPNA6
