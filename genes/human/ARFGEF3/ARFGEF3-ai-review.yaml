- term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000904
  review:
    summary: >-
      The InterPro Sec7 signature matches ARFGEF3, but the signature detects the fold,
      not the catalytic residue, and ARFGEF3's copy of the fold has lost it. A textbook
      domain-implied catalytic over-annotation.
    action: REMOVE
    reason: >-
      IPR000904 is genuinely present, so the match is not in dispute; what is wrong is
      the inference that presence of the domain implies exchange activity. The residue
      that performs the reaction is absent from ARFGEF3 and from its mouse orthologue
      (asparagine at Q5TH69 692, serine at Q3UGY8 688, against glutamate in 17 of 17
      catalytically verified relatives), and no experiment has measured exchange
      activity for this protein. The published alignment reached the same conclusion,
      noting that the Sec7 region of BIG3 does not even align significantly to those of
      BIG1 and BIG2. This is the same defect as the IBA row and is removed for the same
      reason, but the mechanism differs and is worth separating: the IBA inherits from a
      correctly placed ancestral node, whereas this row comes from a domain-to-activity
      rule that cannot see catalytic competence. The rule is the thing that needs
      amending, which is why the propagation review points at IPR000904 itself.
    supported_by:
    - reference_id: PMID:24997568
      supporting_text: they showed that BIG3 lacked the conserved motif and critically,
        the essential glutamate residue
    - reference_id: PMID:24997568
      supporting_text: This region is conserved among the BIG3 orthologues, all of which
        lack the functional motif.
    - reference_id: PMID:24997568
      supporting_text: BIG3, unlike BIG1 and BIG2, potentially lacks GEF activity, despite
        being annotated to contain the Sec7 domain (based on sequence similarity).
    - reference_id: PMID:24997568
      supporting_text: BIG3 showed only 21% identities to BIG1 and BIG2, with ~30% identity
        in DUF1981 and no significant similarity (i.e., a BLAST e-value of > 10) found
        in the Sec7 domain.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      residue_claims:
      - claim_type: SUBSTITUTED
        role: Sec7 glutamic finger, the residue IPR000904 does not require a match to
          carry
        anchor:
          accession: Q9Y6D5
          position: 738
          residue: E
          sequence_version: 3
        target:
          accession: Q5TH69
          position: 692
          residue: N
          sequence_version: 3
        method: MSA
        comment: >-
          Anchored on ARFGEF2/BIG2 here rather than ARFGEF1, to show the result does not
          depend on which catalytically verified paralogue is used as the reference.
          Same alignment and same derived column as the IBA row.
      source_entities:
      - source_id: InterPro:IPR000904
        source_label: Sec7 domain
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The signature match is real: ARFGEF3 residues 583-796 are an annotated SEC7
          domain. The interpro2go line mapping IPR000904 to GO:0005085 is what
          over-reaches, because a profile match to the domain does not establish that
          the catalytic glutamate is present. Amending that mapping, or gating it on the
          motif, would fix every Sec7-fold pseudo-GEF at once.
- term:
    id: GO:0032012
    label: regulation of ARF protein signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000904
  review:
    summary: >-
      Unlike the molecular function rows, this one is not refuted - a catalytically dead
      Sec7 domain could still engage ARF and modulate its signalling. But nothing has
      tested it, and the term reaches ARFGEF3 from the same domain rule that produced
      the false activity call.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Kept distinct from the two GO:0005085 rows deliberately, because the evidence
      differs in kind. Those rows assert a chemical reaction that the residue analysis
      shows the protein cannot catalyse, so they are removed. This row asserts only that
      ARFGEF3 modulates ARF signalling somehow, which a dead Sec7 domain acting as a
      decoy or competitor plausibly could do. That is in fact the model the protein's
      own characterisers propose, and they are explicit that it is a hypothesis. No
      experiment has measured ARF-GTP loading, ARF binding, or any ARF-dependent readout
      in response to ARFGEF3 in any system, so there is no evidence either way. Marked
      as over-annotated rather than removed: it is unsupported rather than contradicted,
      and it comes from the same interpro2go inference whose premise about this protein
      has already failed once. If the competitive-decoy model is ever tested, this term
      is the right one to restore.
    supported_by:
    - reference_id: PMID:24711543
      supporting_text: one of our hypotheses is that BIG3 acts as a competitive
        non-functional Arf-GEF, thereby negatively modulating granule production
    - reference_id: PMID:24997568
      supporting_text: they showed that BIG3 lacked the conserved motif and critically,
        the essential glutamate residue
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      residue_claims_not_applicable: >-
        No residue-level claim is made on this row. The catalytic-residue analysis
        refutes the exchange reaction, not the broader proposition that ARFGEF3
        participates in regulating ARF signalling, which no residue can settle and no
        experiment has addressed.
      source_entities:
      - source_id: InterPro:IPR000904
        source_label: Sec7 domain
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Same domain-to-process rule as the GO:0005085 IEA row. It fires on the fold
          alone, and for this protein the fold's catalytic machinery is absent, so the
          process inference inherits an assumption that has already been shown false at
          the activity level.
- term:
