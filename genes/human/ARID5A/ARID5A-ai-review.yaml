knowledge_gaps:
- gap_statement: High-resolution atomic coordinates of the extended human ARID5A domain (aa 37-183) bound to an intact 3'-UTR stem-loop RNA (such as IL6 or OX40 ADE) have not yet been determined, leaving the exact spatial interplay between the folded six-helix core and basic C-terminal IDR contacts unresolved.
  boundary: NMR chemical-shift perturbations, mutagenesis, RNA Bind-n-Seq, and iCLIP2 define the DNA- versus RNA-contacting surfaces of ARID5A (PMID:38866324), but no high-resolution NMR or cryo-EM/X-ray co-structure of the ARID5A-RNA complex has been solved.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Explains at atomic resolution how basic disordered flanking extensions convert a canonical AT-rich dsDNA-binding ARID fold into a nanomolar stem-loop RNA binder.
suggested_questions:
- question: Does the basic C-terminal disordered extension (aa 150-183, including Lys152/Leu154) fold into an induced alpha-helix or beta-hairpin upon engaging the major/minor groove of the IL6 and OX40 3'-UTR stem-loops?
- question: Which post-translational modification triggers dissociation of nuclear ARID5A from promoter chromatin to initiate CRM1-dependent export upon TLR4 stimulation?
suggested_experiments:
- description: Determine the solution NMR structure of human ARID5A(37-183) bound to the 25-nt OX40 ADE or minimal IL6 3'-UTR stem-loop using intermolecular NOEs and paramagnetic relaxation enhancement.
- description: Perform phosphoproteomic mapping of endogenous nuclear versus cytosolic ARID5A within 0-60 minutes of LPS stimulation in human macrophages, coupled with leptomycin B export trapping.
