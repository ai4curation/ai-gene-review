- id: PMID:12363408
  title: ATP selectively suppresses the synthesis of the inflammatory protein microglial response factor (MRF)-1 through Ca(2+) influx via P2X(7) receptors in cultured microglia.
  full_text_unavailable: true
  findings:
  - statement: Studies rat microglial 17-kDa EF-hand calcium-binding protein mrf-1 (Aif1), NOT human ARID5A.
    supporting_text: The mrf-1 gene encodes a 17-kDa protein with a single calcium-binding (EF-hand) motif and is expressed specifically in microglia.
  reference_review:
    relevance: NONE
    correctness: MISCITED
    review_notes: 'Included solely to document the MRF-1 symbol collision in ARID5A-deep-research-affinage.md: rat microglial mrf-1 encodes a 17-kDa single EF-hand protein (Aif1/Iba1, UniProtKB:P55009), unrelated to 64-kDa ARID5A.'
- id: PMID:12420315
  title: Selective inflammatory stimulations enhance release of microglial response factor (MRF)-1 from cultured microglia.
  full_text_unavailable: true
  findings:
  - statement: Reports extracellular release of rat microglial 17-kDa EF-hand protein mrf-1 (Aif1), NOT human ARID5A.
    supporting_text: Here we show that MRF-1 is released from cultured rat microglia, and its release is greatly enhanced under inflammatory conditions.
  reference_review:
    relevance: NONE
    correctness: MISCITED
    review_notes: Off-target rat microglial mrf-1/Aif1 paper erroneously ingested by Affinage under legacy alias MRF-1, causing false extracellular region (GO:0005576) grounding.
- id: PMID:21346191
  title: Arid5a cooperates with Sox9 to stimulate chondrocyte-specific transcription.
  findings:
  - statement: Shows nuclear Arid5a binds directly to the Col2a1 promoter with Sox9 and stimulates histone H3 acetylation and chondrocyte transcription.
    supporting_text: In addition, Arid5a binds directly to the promoter region of the Col2a1 gene and stimulates acetylation of histone 3 in the region.
- id: PMID:23676272
  title: Arid5a controls IL-6 mRNA stability, which contributes to elevation of IL-6 level in vivo.
  findings:
  - statement: Identifies Arid5a as an LPS/IL-1beta/IL-6-inducible RNA-binding protein that binds the IL-6 3'-UTR to stabilize IL-6 mRNA and antagonize Regnase-1.
    supporting_text: Here, we identified AT-rich interactive domain-containing protein 5A (Arid5a) as a unique RNA binding protein, which stabilizes IL-6 but not TNF-α mRNA through binding to the 3' untranslated region of IL-6 mRNA.
  - statement: Shows Arid5a neither binds the TNF-alpha 3'-UTR nor regulates TNF-alpha production in cultured macrophages.
    supporting_text: We found that Arid5a regulates IL-6 but not TNF-α production in vitro ( Fig. S6 ).
- id: PMID:27022145
  title: Arid5a regulates naive CD4+ T cell fate through selective stabilization of Stat3 mRNA.
  findings:
  - statement: Demonstrates selective stabilization of Stat3 mRNA (over Stat1/Stat5) by Arid5a via 3'-UTR stem-loop binding to drive Th17 differentiation.
    supporting_text: Here, we demonstrate that AT-rich interactive domain-containing protein 5a (Arid5a) in T cells directs naive CD4(+)T cells to differentiate into inflammatory CD4(+)T cells, especially Th17 cells, through selective stabilization of Stat3(but not Stat1 and Stat5) mRNA in an IL-6-dependent manner.
- id: PMID:27671645
  title: Arid5a exacerbates IFN-γ-mediated septic shock by stabilizing T-bet mRNA.
  findings:
  - statement: Shows Arid5a binds the conserved 3'-UTR stem-loop of Tbx21 (T-bet) mRNA to stabilize it and promote Th1 IFN-gamma production.
    supporting_text: Arid5a bound to the conserved stem loop structure of the 3'UTR of T-bet and stabilized its mRNA.
- id: PMID:29244194
  title: Arid5a stabilizes OX40 mRNA in murine CD4(+) T cells by recognizing a stem-loop structure in its 3'UTR.
  full_text_unavailable: true
  findings: []
- id: PMID:29358370
  title: Regulation of inflammatory responses by dynamic subcellular localization of RNA-binding protein Arid5a.
  findings:
  - statement: Establishes importin-alpha/beta1 nuclear import and LPS-triggered CRM1/UPF1-dependent nuclear export of Arid5a to the cytoplasm for mRNA stabilization.
    supporting_text: We also found that Arid5a is imported into the nucleus via a classical importin-α/β1-mediated pathway. On stimulation, nuclear Arid5a levels were decreased, while there was a concomitant increase in cytoplasmic Arid5a. Arid5a is associated with up-frameshift protein 1, and its nuclear export is regulated by a nuclear export receptor, chromosomal region maintenance 1.
- id: PMID:30301788
  title: IL-17 integrates multiple self-reinforcing, feed-forward mechanisms through the RNA binding protein Arid5a.
  findings:
  - statement: Shows IL-17-induced Arid5a stabilizes target 3'-UTR mRNAs against Regnase-1 and promotes translation of Nfkbiz and Cebpb.
    supporting_text: Arid5a stabilized IL-17-induced cytokine transcripts by binding to their 3' untranslated regions and also counteracted mRNA degradation mediated by the endoribonuclease MCPIP1 (Regnase-1).
- id: PMID:38866324
  title: Arid5a uses disordered extensions of its core ARID domain for distinct DNA- and RNA-recognition and gene regulation.
  findings:
  - statement: Dissects by NMR, EMSA, RNA Bind-n-Seq, and iCLIP2 how ARID5A's core ARID domain recognizes AT-rich dsDNA while flanking basic IDRs enable high-affinity stem-loop and (A)U-rich RNA binding.
    supporting_text: We find that the intrinsically disordered regions flanking the ARID domain modulate the specificity and affinity of DNA binding, while they appear crucial for RNA interactions. Ultimately, our data suggest that Arid5a uses its extended ARID domain for bifunctional gene regulation
- id: file:human/ARID5A/ARID5A-deep-research-affinage.md
  title: Affinage mechanistic annotation for ARID5A (human, UniProtKB:Q03989)
  findings:
  - statement: Synthesizes dynamic nucleocytoplasmic shuttling of ARID5A and its dual roles as a cytoplasmic 3'-UTR mRNA-stabilizing factor and nuclear transcription regulator.
    supporting_text: ARID5A (Arid5a) is a bifunctional nucleic acid-binding protein that governs inflammatory gene expression by acting either as a cytoplasmic RNA-stabilizing factor or as a nuclear transcription factor, depending on its subcellular localization [PMID:29358370, PMID:38866324].
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: Captures ARID5A's core dual biology well—covering cytoplasmic 3'-UTR stem-loop stabilization against Regnase-1/Roquin-1 (PMID:23676272, PMID:27022145, PMID:27671645, PMID:29244194), CRM1-mediated shuttling (PMID:29358370), extended-ARID NMR/iCLIP2 biophysics (PMID:38866324), and nuclear SOX9 coactivation (PMID:21346191). However, it suffers a classic MRF-1 homonym collision, ingesting two 2002 rat microglia papers on the 17-kDa EF-hand calcium-binding protein mrf-1/Aif1 (PMID:12363408, PMID:12420315) and thereby falsely adding GO:0005576 (extracellular region) to ARID5A's localization profile, while also misgrounding competitive 3'-UTR RNA protection as GO:0140313 (molecular sequestering activity) and omitting nuclear receptor corepression (PMID:15941852).
