id: Q03989
gene_symbol: ARID5A
aliases:
- MRF1
- MRF-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Bifunctional nucleocytoplasmic DNA- and RNA-binding protein (594 aa) built around an N-terminal AT-rich interaction domain (ARID, aa 58-150) flanked by basic intrinsically disordered extensions. In the nucleoplasm under basal conditions, ARID5A binds AT-rich cis-regulatory promoter DNA (via Thr125/Ser126 in Loop L2/Helix 5) to coactivate SOX9-driven chondrogenic transcription or corepress estrogen and other nuclear hormone receptors; upon Toll-like receptor or cytokine (LPS, IL-1beta, IL-6, IL-17) signaling, ARID5A exports via CRM1 to the cytosol, where its extended ARID module binds conserved stem-loop and AU-rich elements in the 3'-UTRs of pro-inflammatory mRNAs (including IL6, STAT3, TBX21, and TNFRSF4/OX40) to protect them from Regnase-1-mediated endoribonucleolytic degradation.
core_functions:
- description: Binds conserved stem-loop and AU-rich cis-regulatory elements in the 3'-UTRs of inflammatory mRNAs (IL6, STAT3, TBX21, OX40) in the cytosol via its IDR-extended ARID domain to antagonize Regnase-1 cleavage and stabilize target transcripts.
  molecular_function:
    id: GO:0035613
    label: RNA stem-loop binding
  locations:
  - id: GO:0005829
    label: cytosol
  directly_involved_in:
  - id: GO:1905870
    label: positive regulation of 3'-UTR-mediated mRNA stabilization
  supported_by:
  - reference_id: PMID:23676272
    supporting_text: Here, we identified AT-rich interactive domain-containing protein 5A (Arid5a) as a unique RNA binding protein, which stabilizes IL-6 but not TNF-α mRNA through binding to the 3' untranslated region of IL-6 mRNA.
  - reference_id: PMID:27671645
    supporting_text: Arid5a bound to the conserved stem loop structure of the 3'UTR of T-bet and stabilized its mRNA.
  - reference_id: PMID:29358370
    supporting_text: We also found that Arid5a is imported into the nucleus via a classical importin-α/β1-mediated pathway. On stimulation, nuclear Arid5a levels were decreased, while there was a concomitant increase in cytoplasmic Arid5a. Arid5a is associated with up-frameshift protein 1, and its nuclear export is regulated by a nuclear export receptor, chromosomal region maintenance 1.
  - reference_id: PMID:38866324
    supporting_text: We find that the intrinsically disordered regions flanking the ARID domain modulate the specificity and affinity of DNA binding, while they appear crucial for RNA interactions. Ultimately, our data suggest that Arid5a uses its extended ARID domain for bifunctional gene regulation
  - reference_id: file:human/ARID5A/ARID5A-deep-research-affinage.md
    supporting_text: ARID5A (Arid5a) is a bifunctional nucleic acid-binding protein that governs inflammatory gene expression by acting either as a cytoplasmic RNA-stabilizing factor or as a nuclear transcription factor, depending on its subcellular localization [PMID:29358370, PMID:38866324].
- description: Recognizes AT-rich cis-regulatory promoter DNA in the nucleoplasm via its Loop-L2/Helix-5 major-groove head (Thr125, Ser126) and cooperates with SOX9 or nuclear hormone receptors to regulate RNA polymerase II transcription.
  molecular_function:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  locations:
  - id: GO:0005654
    label: nucleoplasm
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  supported_by:
  - reference_id: PMID:21346191
    supporting_text: In addition, Arid5a binds directly to the promoter region of the Col2a1 gene and stimulates acetylation of histone 3 in the region.
  - reference_id: PMID:38866324
    supporting_text: We find that the intrinsically disordered regions flanking the ARID domain modulate the specificity and affinity of DNA binding, while they appear crucial for RNA interactions. Ultimately, our data suggest that Arid5a uses its extended ARID domain for bifunctional gene regulation
  - reference_id: PMID:15941852
    supporting_text: Transient transfection studies show that MRF1 represses transcription by ERalpha activated by estradiol in a dose-dependent manner, as well as by the selective ER modulators 4-hydroxy-tamoxifen and raloxifene.
- description: Binds estrogen receptor alpha and selective nuclear hormone receptors in the nucleoplasm to act as an HDAC-independent transcriptional corepressor.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  locations:
  - id: GO:0005654
    label: nucleoplasm
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  supported_by:
  - reference_id: PMID:15941852
    supporting_text: Here we report the identification of modulator recognition factor 1 (MRF1) as an ERalpha-interacting corepressor protein. Full-length MRF1 binds to both the N terminus and the C terminus of ERalpha.
  - reference_id: PMID:15941852
    supporting_text: Transient transfection studies show that MRF1 represses transcription by ERalpha activated by estradiol in a dose-dependent manner, as well as by the selective ER modulators 4-hydroxy-tamoxifen and raloxifene.
