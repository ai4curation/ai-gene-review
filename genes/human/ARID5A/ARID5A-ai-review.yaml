  review:
    summary: IBA annotation (GO_REF:0000033) localizing ARID5A to the nucleus.
    action: KEEP_AS_NON_CORE
    reason: Under basal conditions ARID5A is imported into the nucleus via importin-alpha/beta1; broad nuclear localization is retained as non-core alongside nucleoplasm (GO:0005654) and cytosol (GO:0005829).
    supported_by:
    - reference_id: PMID:29358370
      supporting_text: We also found that Arid5a is imported into the nucleus via a classical importin-α/β1-mediated pathway. On stimulation, nuclear Arid5a levels were decreased, while there was a concomitant increase in cytoplasmic Arid5a. Arid5a is associated with up-frameshift protein 1, and its nuclear export is regulated by a nuclear export receptor, chromosomal region maintenance 1.
    - reference_id: PMID:21346191
      supporting_text: Furthermore, Arid5a physically interacted with Sox9 in nuclei and up-regulated the chondrocyte-specific action of Sox9.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000359478
        source_label: PTN000359478
        source_status: SUPPORTS_TRANSFER
        comment: UniProtKB:Q03989 (ARID5A) is a direct experimental seed anchoring nuclear localization on PTN000359478.
