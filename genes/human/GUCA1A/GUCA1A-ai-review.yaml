id: P43080
gene_symbol: GUCA1A
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GUCA1A encodes GCAP1, an EF-hand calcium sensor in retinal photoreceptors. It regulates membrane
  guanylate cyclases to restore cGMP during photoresponse recovery. Pathogenic variants can impair calcium-dependent
  cyclase control and cause cone or cone-rod dystrophy.
alternative_products: []
