core_functions:
- description: Binds GTP as a constituent of the U5 snRNP protein core that participates in spliceosomal
    pre-mRNA splicing. Native human U5 nucleotide-binding and splicing experiments establish the biochemical
    interaction and process involvement, while human tri-snRNP structures place EFTUD2 alongside PRPF8
    in the assembled machinery. This nucleotide-bound role does not require assuming a demonstrated human
    GTPase motor cycle. Its structural participation includes snRNP and tri-snRNP assembly within the
    spliceosomal pathway; the process summary encompasses these assembly steps without assigning EFTUD2
    the catalytic work of other subunits.
  molecular_function:
    id: GO:0005525
    label: GTP binding
  directly_involved_in:
  - id: GO:0000398
    label: mRNA splicing, via spliceosome
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0005682
    label: U5 snRNP
  supported_by:
  - reference_id: PMID:9233818
  - reference_id: PMID:26912367
  - reference_id: PMID:30975767
  - reference_id: PMID:28515276
  - reference_id: file:human/EFTUD2/EFTUD2-source-evidence.yaml
- description: Contacts U5 snRNA as part of the conserved Snu114 ribonucleoprotein interface in the spliceosome.
    Direct crosslinking to U5 RNA is established in yeast, and the experimentally grounded PAINT placement
    supports inheritance by human EFTUD2. Human RNA-capture experiments independently support RNA binding,
    without resolving the same nucleotide contact or proving the proposed translocase mechanism.
  molecular_function:
    id: GO:0030623
    label: U5 snRNA binding
  directly_involved_in:
  - id: GO:0000398
    label: mRNA splicing, via spliceosome
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0005682
    label: U5 snRNP
  supported_by:
  - reference_id: GO_REF:0000033
  - reference_id: PMID:9848662
  - reference_id: PMID:22658674
  - reference_id: file:human/EFTUD2/EFTUD2-source-evidence.yaml
  - reference_id: file:human/EFTUD2/EFTUD2-bioinformatics/evidence/RESULTS.md
suggested_questions:
- question: Does human EFTUD2 hydrolyze GTP during a defined stage of spliceosome assembly or catalysis,
    and how does PRPF8 binding influence that activity?
- question: How do the three natural EFTUD2 protein products differ in U5 assembly, RNA contacts and spliceosomal
    function?
- question: Which EFTUD2 contacts contribute directly to activation of the minor spliceosome and release
    of U11 and U4atac?
suggested_experiments:
- description: Measure nucleotide occupancy and GTP turnover of sequence-verified human EFTUD2 alone,
    with its PRPF8-binding region and in reconstituted U5 assemblies, using catalytic controls and parallel
    measurements of complex integrity.
- description: Map human EFTUD2 contacts to U5 RNA by targeted crosslinking in defined spliceosomal stages,
    distinguishing direct nucleotide contacts from copurification.
