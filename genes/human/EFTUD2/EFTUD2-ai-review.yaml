  review:
    summary: Conserved intrinsic GTPase capacity is retained with complex-state limits.
    action: KEEP_AS_NON_CORE
    reason: The literal GTPase IBD lies at ancestral PTN000562745 and is inherited by the EFTUD2 branch;
      no same-term loss is placed on the target path. The separate translation-factor losses at PTN000562846
      do not negate GTPase activity. Purified yeast Snu114 residues 72–1008 have weak measured hydrolysis,
      with Km 578.4 micromolar and kcat 1.012 × 10^-3 s^-1, suppressed by the Prp8 Snu114-binding region.
