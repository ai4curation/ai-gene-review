id: Q15029
gene_symbol: EFTUD2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EFTUD2 encodes Snu114, the GTP-binding 116-kDa subunit of the U5 small nuclear ribonucleoprotein
  particle. Together with PRPF8 and other U5 proteins, it organizes spliceosomal machinery used in major
  and minor pre-mRNA splicing. The protein is predominantly nuclear, with a smaller cytoplasmic pool associated
  with U5 particle assembly. Its conserved nucleotide-binding fold and RNA contacts support this ribonucleoprotein
  role; an active GTP-hydrolysis cycle in the human spliceosome remains unresolved. Pathogenic variants
  cause mandibulofacial dysostosis with microcephaly.
