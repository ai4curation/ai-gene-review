id: O00116
gene_symbol: AGPS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AGPS encodes alkylglycerone-phosphate synthase, a peroxisomal enzyme that creates the
  ether bond of ether-lipid precursors. It replaces the acyl group of acyl-dihydroxyacetone
  phosphate with a long-chain fatty alcohol, releasing a fatty acid and forming
  alkyl-dihydroxyacetone phosphate. FAD supports covalent catalysis without a net change in
  substrate oxidation state. The enzyme acts at the luminal surface of the peroxisomal membrane
  alongside GNPAT, which supplies its acyl-dihydroxyacetone phosphate substrate. AGPS is synthesized
  with a cleavable N-terminal PTS2 targeting sequence and imported through the PEX7 pathway; the
  precursor already has catalytic activity before processing. Its products feed ether phospholipid
  and plasmalogen synthesis. Biallelic loss of AGPS function causes rhizomelic chondrodysplasia
  punctata type 3, linking deficient ether-lipid production to skeletal, ocular and
  neurodevelopmental abnormalities.
