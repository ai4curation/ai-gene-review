- description: Catalyzes the FAD-dependent exchange of the acyl group of acyl-dihydroxyacetone
    phosphate for a long-chain fatty alcohol, forming the ether-linked precursor of ether
    phospholipids and plasmalogens at the luminal surface of the peroxisomal membrane. Oxidized FAD
    supports covalent catalysis without net substrate oxidation-reduction.
