    summary: >-
      Rank 5 (score 16.53, tied with rank 4). Poly(C) RNA binding is the PCBP/hnRNP K specificity.
      Offering poly(G) and poly(C) at identical scores for a protein whose UG preference is one of
      the best-characterised RNA-protein interactions in neurodegeneration shows the model resolving
      the RRM fold but not the motif. The PANTHER family for this entry is the generic 'RNA-binding
      (RRM/RBD/RNP motifs) family protein', which points the same way.
