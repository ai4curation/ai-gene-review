id: Q13148
gene_symbol: TARDBP
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens (Human)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for TDP-43. The result is dominated by ontology drift: ranks
  1, 2 and 3 are all obsolete GO terms, the joint-highest obsolete rate in the cohort alongside cytochrome
  c. The two resolvable calls at ranks 4 and 5 are RNA homopolymer binding specificities that are
  not TDP-43's - it binds UG-rich RNA and TG-rich ssDNA through its two RRMs. None of this review's
  three core functions is retrieved, though the free-text channel describes the RRM binding correctly
  at 18.78. Assessment: 1 uncertain (UNC), 2 paralog incorrect (PLI).
