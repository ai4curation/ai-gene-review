    id: GO:0034046
    label: poly(G) binding
  predicted_term_type: GO_MF
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 4 (score 16.53), reviewed in place of ranks 1 to 3 which are all obsolete in the current
      GO release. Poly(G) binding is characteristic of hnRNP proteins with G-quadruplex affinity;
      TDP-43's defining sequence preference is UG/TG-rich, which is the basis of its cryptic-exon
      repression at STMN2 and UNC13A. Scored MORE_SPECIFIC as a descendant of nucleic acid binding,
      so closure would credit it while the actual sequence specificity is wrong.
    supported_by:
