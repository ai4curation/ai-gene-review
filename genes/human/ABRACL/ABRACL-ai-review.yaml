core_functions:
- description: ABRACL binds filamentous actin weakly and associates with the actin-severing protein cofilin-1
    at the leading edge of lamellipodia, where it reduces cofilin-stimulated filament disassembly without
    displacing cofilin from the filament. Through this it tunes the balance between filamentous and globular
    actin and modulates cell migration. The molecular function recorded here is the one GO can currently
    express; the activity that carries the mechanism - inhibiting a cofilin-type severing protein - has
    no term, and is proposed as a new one.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  directly_involved_in:
  - id: GO:0032970
    label: regulation of actin filament-based process
  - id: GO:0030335
    label: positive regulation of cell migration
  locations:
  - id: GO:0030027
    label: lamellipodium
  supported_by:
  - reference_id: PMID:33670794
    supporting_text: These results indicated that purified recombinant ABRACL bound to F-actin, although
      very weakly, under the in vitro experimental conditions.
  - reference_id: PMID:33670794
    supporting_text: the addition of ABRACL in the reaction blunted this effect of cofilin in a dose-dependent
      manner
  - reference_id: PMID:33670794
    supporting_text: We found that ABRACL did not inhibit the co-sedimentation of cofilin with F-actin
  - reference_id: file:human/ABRACL/ABRACL-uniprot.txt
    supporting_text: CC       with CFL1; this interaction decreases CFL1-mediated actin
knowledge_gaps:
- gap_statement: GO cannot express what ABRACL does. It binds cofilin and reduces cofilin-stimulated filament
    disassembly without competing for the filament, which is an inhibitor activity directed at an actin-severing
    protein. GO carries the activator of exactly this activity, GO:0000513 actin severing activator activity,
    defined as binding to and increasing the activity of an actin severing protein, and no inhibitor counterpart.
  boundary: 'What is established is the effect and its independence from displacement: ABRACL blunts cofilin-stimulated
    pyrene F-actin depolymerisation dose-dependently, and does not prevent cofilin from co-sedimenting
    with F-actin. What is missing is a term, not an experiment.'
  gap_kind:
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: 'This is a large part of why a protein with a solved structure, a named partner and two
    assays on purified protein carries no molecular function annotation at all. The gap is not specific
    to ABRACL: any protein that dampens a severing factor rather than sequestering actin faces the same
    missing branch.'
  resolution: Create the sibling term, actin severing inhibitor activity, under GO:0140678 molecular function
    inhibitor activity, mirroring GO:0000513.
