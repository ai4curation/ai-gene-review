- id: PMID:33670794
  title: Human Costars Family Protein ABRACL Modulates Actin Dynamics and Cell Migration and Associates
    with Tumorigenic Growth.
  findings:
  - statement: Purified untagged recombinant ABRACL binds F-actin directly in a co-sedimentation assay,
      though weakly.
    supporting_text: These results indicated that purified recombinant ABRACL bound to F-actin, although
      very weakly, under the in vitro experimental conditions.
  - statement: ABRACL and cofilin interact in cells, shown by proximity ligation that is lost on knockdown
      of either partner and by co-immunoprecipitation of endogenous cofilin.
    supporting_text: Fluorescence PLA signals were detected in the control cells but greatly diminished
      in ABRACL- or cofilin-knockdown cells
  - statement: ABRACL inhibits cofilin-stimulated depolymerisation of pyrene F-actin in a dose-dependent
      manner.
    supporting_text: the addition of ABRACL in the reaction blunted this effect of cofilin in a dose-dependent
      manner
  - statement: The inhibition is not simple displacement - ABRACL does not prevent cofilin from binding
      F-actin.
    supporting_text: We found that ABRACL did not inhibit the co-sedimentation of cofilin with F-actin
  - statement: ABRACL alone inhibits actin polymerisation in vitro, which the authors note is inconsistent
      with the direction of the cellular F/G-actin phenotype.
    supporting_text: These in vitro results appeared to contradict the above-mentioned finding of decreased
      F/G-actin ratios in cells lacking ABRACL
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The one substantial functional paper on human ABRACL, full text available and read in
      full. Title matches the cached record. Its central claims are supported by the figures described,
      and it is unusually candid about the internal inconsistency between its in vitro and cellular results,
      which is why this review declines to give the process annotation a sign. Note that the F-actin binding
      it reports is explicitly weak and the cofilin interaction is established in cells rather than by
      a binary assay on purified proteins.
- id: PMID:20940261
  title: Costars, a Dictyostelium protein similar to the C-terminal domain of STARS, regulates the actin
    cytoskeleton and motility.
  findings:
  - statement: cosA-null Dictyostelium cells move more slowly toward cAMP but steer normally, indicating
      a motility-machinery defect rather than a chemotactic-orientation defect.
    supporting_text: Analysis of cell motion in cAMP gradients revealed decreased speed but wild-type-like
      directional persistence of cosA(-) cells, suggesting a defect in the cellular machinery for motility
      rather than for chemotactic orientation.
  - statement: Loss of Costars increases cytoskeleton-associated actin, the opposite sign to the human
      knockdown phenotype.
    supporting_text: cosA(-) cells exhibited changes in the actin cytoskeleton, showing aberrant distribution
      of F-actin in fluorescence cell staining and an increased amount of cytoskeleton-associated actin.
  - statement: The human ortholog functionally replaces Costars in Dictyostelium, which is the strongest
      available warrant for the phylogenetic transfer.
    supporting_text: Expressing cosA or its human counterpart mCostars eliminated abnormalities of cosA(-)
      cells.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached title matches. Abstract only, but the three claims used here are all stated in
      the abstract itself, so no full-text access is needed to support them. This is the donor evidence
      behind the IBA and the source of the cross-species complementation result; it is also the source
      of the sign discrepancy with the human data, which is why it is cited on both sides of that argument
      rather than only in support.
- id: PMID:37759737
  title: Characterization of the Abracl-Expressing Cell Populations in the Embryonic Mammalian Telencephalon.
  findings:
  - statement: The paper's only statement linking Abracl to cilia is a citation of a third-party high-throughput
      proteomics study, not an observation of its own.
    supporting_text: a high-throughput proteomics study in non-neuronal cell lines has shown that Abracl
      is associated with the primary cilia
  - statement: Its own data place Abracl outside the ventricular zone, where the ciliated progenitors
      reside.
    supporting_text: our results show that neither Abracl mRNA nor Abracl were expressed in the VZ
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: 'Cached title matches and the paper itself is sound - a careful expression and co-labelling
      study of mouse and cat embryonic forebrain. It is marked MISCITED for the use made of it elsewhere,
      not for anything it does wrong: UniProt cites it as the evidence for Cell projection, cilium on
      human ABRACL, and it contains no such observation. It reports somebody else''s proteomics result
      in its Discussion and, in the same paragraph, data that argue against the protein being in the ciliated
      ventricular zone. It is also a mouse and cat study, so even a genuine localisation finding would
      need an ISS-style transfer rather than a direct human location. Note on the enum: MISCITED is defined
      as ''right paper, but it does not support the claim'', which strictly describes how a citation is
      used rather than a property of the paper. It is applied here to record that this reference is cited
      elsewhere in GOA for something it does not show; within this document the paper is cited only for
      what it does report. Flagged because a reader aggregating correctness values could otherwise read
      it as a defect in this review''s own use of the reference.'
- id: PMID:26638075
  title: A Dynamic Protein Interaction Landscape of the Human Centrosome-Cilium Interface.
  findings: []
