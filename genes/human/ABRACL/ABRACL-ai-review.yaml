gene_symbol: ABRACL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABRACL is an 81-residue protein and the human member of the Costars family, a small eukaryotic
  family that is usually but not universally single-copy per genome (PANTHER PTHR46334 resolves into two
  subfamilies, and Arabidopsis carries two members) and absent from fungi. Its NMR structure is a winged
  helix-like fold - three alpha-helices packed against four antiparallel beta-strands - but it lacks DNA-binding
  activity, and the surface that in canonical winged-helix proteins accommodates the DNA backbone is instead
  a conserved hydrophobic groove, taken to be a protein-interaction site. ABRACL binds filamentous actin
  directly but weakly in vitro, and in cells it associates with the actin-severing protein cofilin-1 (CFL1),
  with which it colocalises at the leading edge of lamellipodia in migrating cells. On purified proteins
  it blunts cofilin-stimulated depolymerisation of F-actin in a dose-dependent way without displacing
  cofilin from filaments, so it acts on cofilin's activity rather than competing for the filament. Cells
  depleted of ABRACL migrate less and change shape, and in Dictyostelium loss of the ortholog Costars
  (cosA) slows chemotactic movement and disturbs F-actin distribution, defects that expression of the
  human protein reverses. The direction in which ABRACL shifts the F-/G-actin balance differs between
  the Dictyostelium and human systems, so the protein is best described as a modulator of actin filament
  dynamics whose sign is context-dependent. It is broadly expressed across human tissues, elevated in
  several carcinomas, and in the embryonic mammalian forebrain it marks subpallial progenitors, migrating
  interneurons and postmitotic neurons.
existing_annotations:
- term:
    id: GO:0032970
    label: regulation of actin filament-based process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Accepted as the core process, and deliberately left at this level of specificity.


      The transfer itself is as clean as phylogenetic transfers get. PANTHER PTHR46334 does contain two
      subfamilies, but the transfer stays inside one of them: both the donor and the target are PTHR46334:SF1,
      while the separate SF3 is plant-restricted (Arabidopsis Q8LBN7, Eutrema B4YYA9). So no subfamily
      boundary is crossed, and the WITH/FROM donor dictyBase:DDB_G0272861 is Dictyostelium cosA, which
      carries its own experimental annotation to this same term. More than that, the transfer has been
      tested directly: the human protein expressed in cosA-null Dictyostelium restores the mutant''s motility
      and actin phenotypes. Functional complementation across that distance is a stronger warrant for
      an ortholog transfer than any sequence statistic, and independent human experimental work reaches
      the same conclusion from the other direction.


      The interesting question is whether to make the term more specific, and the answer is no. Three
      lines of evidence disagree about the SIGN of ABRACL''s effect on the filamentous/globular actin
      balance. Deleting the Dictyostelium ortholog RAISES cytoskeleton-associated actin; depleting human
      ABRACL LOWERS the cellular F-/G-actin ratio; and purified human ABRACL on its own INHIBITS actin
      polymerisation, a result the authors themselves flag as contradicting their cellular data. Only
      in the presence of cofilin does ABRACL clearly favour F-actin. So GO:0030835 negative regulation
      of actin filament depolymerization and GO:0030837 negative regulation of actin filament polymerization
      are each supported by one part of the evidence and contradicted by another. The unsigned parent
      is not an under-annotation here; it is the strongest claim every dataset supports, and the PAINT
      curator was right to stop at it.'
