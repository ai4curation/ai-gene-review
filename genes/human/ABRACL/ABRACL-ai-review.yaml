- term:
    id: GO:0005929
    label: cilium
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: 'Removed. Traced back, this annotation rests on nothing that was ever a localisation observation.


      The chain has four links. GOA maps UniProtKB-SubCell:SL-0066 mechanically, as GO_REF:0000044 is
      designed to do. The UniProt line it maps is flagged ECO:0000305 - a curator inference, not an experimental
      record - and cites PubMed:37759737. That paper is an expression study of mouse and cat embryonic
      telencephalon which reports no ciliary localisation of its own; its single sentence on the subject
      attributes the claim to somebody else''s high-throughput proteomics. In the same paragraph it reports
      evidence pointing the other way, that neither the transcript nor the protein is present in the ventricular
      zone, which is precisely where the ciliated progenitors sit. The proteomics study being cited is
      PMID:26638075, the Gupta et al. centrosome-cilium BioID interactome, and it is the only source of
      physical-interaction data for ABRACL in IntAct at all: five proximity hits, one publication, one
      detection method.


      Proximity-dependent biotinylation labels whatever comes within roughly ten nanometres of the bait
      over hours, so its output is a neighbourhood rather than a compartment assignment, and three of
      the four baits (SASS6, CNTRL, DCTN1) are centriolar or dynactin proteins rather than ciliary ones.
      The fourth, RPGRIP1L, IS genuinely ciliary - a transition-zone protein - so the bait panel is not
      uniformly non-ciliary and that should be conceded. It does not rescue the annotation: proximity
      to one ciliary bait over hours of labelling is still a neighbourhood observation, not a localisation
      call. A family-level check points the same way: Costars is retained in Arabidopsis, rice, maize
      and Dictyostelium, none of which builds a cilium, basal body or centriole, while IFT88, IFT52, BBS1
      and ARL13B are absent from every one of those proteomes.


      None of this proves ABRACL never enters a human cilium, and a lineage-specific role would not show
      up in a phyletic comparison. What it establishes is that no evidence for the annotation exists at
      any link in the chain, and that the conserved function of the family cannot be ciliary. An unsupported
      compartment assignment on an otherwise sparsely annotated protein is worse than no assignment, because
      it is the kind of statement downstream tools propagate.'
    action: REMOVE
    reason: The UniProt subcellular location this IEA maps is a curator inference (ECO:0000305) whose
      cited paper reports no ciliary localisation and in fact places the protein outside the ciliated
      ventricular zone. The only primary data behind it are proximity-labelling hits from a single BioID
      screen with centriolar baits, which do not establish a localisation, and the Costars family is retained
      in four proteomes that build no cilium at all.
    supported_by:
    - reference_id: file:human/ABRACL/ABRACL-uniprot.txt
      supporting_text: CC       {ECO:0000305|PubMed:37759737}.
    - reference_id: PMID:37759737
      supporting_text: a high-throughput proteomics study in non-neuronal cell lines has shown that Abracl
        is associated with the primary cilia
    - reference_id: PMID:37759737
      supporting_text: our results show that neither Abracl mRNA nor Abracl were expressed in the VZ
    - reference_id: file:human/ABRACL/ABRACL-bioinformatics/RESULTS.md
      supporting_text: 'Detection methods observed: proximity-dependent biotin identification.'
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - SOURCE_MISCITATION
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0066
        source_label: Cilium (UniProt subcellular location)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The GOA row is a faithful mapping of this location term; the fault is upstream, in the
          ECO:0000305 statement being mapped, not in the mapping.
      - source_id: PMID:37759737
        source_label: Troumpoukis et al. 2023, Abracl-expressing populations in embryonic telencephalon
        source_status: SOURCE_BAD
        comment: Cited by UniProt as the evidence for cilium, but it reports no ciliary localisation and
