    supporting_text: These in vitro results appeared to contradict the above-mentioned finding of decreased
      F/G-actin ratios in cells lacking ABRACL
  - reference_id: PMID:20940261
    supporting_text: cosA(-) cells exhibited changes in the actin cytoskeleton, showing aberrant distribution
      of F-actin in fluorescence cell staining and an increased amount of cytoskeleton-associated actin.
proposed_new_terms:
- proposed_name: actin severing inhibitor activity
  proposed_definition: Binds to and decreases the activity of an actin severing protein.
  proposed_parent:
    id: GO:0140678
    label: molecular function inhibitor activity
  justification: 'GO already contains the positive half of this pair - GO:0000513 actin severing activator
    activity, defined as binding to and increasing the activity of an actin severing protein - but no
    inhibitor. ABRACL is a clean instance of the missing half: it binds cofilin, blunts cofilin-stimulated
    F-actin depolymerisation dose-dependently, and does so without preventing cofilin from binding the
    filament, so it is acting on the severing protein''s activity rather than competing for actin. The
    proposed definition is the existing activator definition with the sign reversed, so the term needs
    no new modelling machinery. Without it, a protein whose entire known function is dampening a severing
    factor can be annotated only to actin filament binding, which is true of ABRACL but conveys none of
    the mechanism, or to nothing at all, which is the current state.'
  supported_by:
  - reference_id: PMID:33670794
    supporting_text: the addition of ABRACL in the reaction blunted this effect of cofilin in a dose-dependent
      manner
  - reference_id: PMID:33670794
    supporting_text: We found that ABRACL did not inhibit the co-sedimentation of cofilin with F-actin
suggested_questions:
- question: 'Does ABRACL bind cofilin directly? Every line of evidence for the interaction is in cells
    - colocalisation, proximity ligation, co-immunoprecipitation - and the in vitro experiment that follows
    is functional rather than binary: ABRACL blunts cofilin''s effect on filaments. A direct binary binding
    measurement between the two purified proteins, with an affinity, has not been reported, so it remains
    possible that the two meet on the filament rather than in solution.'
- question: Which way does ABRACL push the actin balance, and why do the systems disagree? Deleting the
    Dictyostelium ortholog raises cytoskeleton-associated actin, depleting human ABRACL lowers the F-/G-actin
    ratio, and purified ABRACL alone inhibits polymerisation. The authors of the human study flag the
    contradiction themselves. Until it is resolved, no signed regulatory term can be justified.
- question: What occupies the conserved hydrophobic groove? The NMR structure identifies a groove shared
    with the ABRA C-terminal domain and proposes it as a protein-interaction site, but no residue in it
    has been mutated and no partner has been mapped onto it. Whether cofilin binds there is the obvious
    first test.
- question: 'Is there anything to the centrosome connection? The cilium annotation should go, but the
    underlying BioID data are real: ABRACL was labelled by SASS6, CNTRL, DCTN1 and RPGRIP1L baits. Cofilin
    and actin have roles at the centrosome, so a genuine centrosomal pool is not absurd - it has simply
    never been tested by any method other than proximity labelling.'
- question: Is the nuclear pool reported in neural progenitors real, and is it functional? A 9 kDa protein
    diffuses through nuclear pores whether or not it is targeted, and the supporting experiment is overexpression
    in a neuroblastoma line. Distinguishing passive equilibration from active retention needs endogenous
    tagging.
suggested_experiments:
- hypothesis: ABRACL binds cofilin directly, through the conserved hydrophobic groove identified in the
    NMR structure.
  description: Measure the affinity of purified ABRACL for purified CFL1 by ITC or SPR in the absence
    of actin, then map the interface by NMR chemical-shift perturbation onto the 2L2O structure and test
    predicted groove residues by mutation, scoring loss of cofilin binding and loss of the inhibitory
    effect on depolymerisation together. A separation-of-function mutant that binds F-actin but not cofilin
    would settle which activity carries the cellular phenotype.
  experiment_type: biophysics
- hypothesis: ABRACL reduces cofilin-mediated severing rather than altering filament elongation or cofilin
    binding.
  description: Use single-filament TIRF microscopy with fluorescently labelled actin and cofilin, titrating
    ABRACL, and measure severing events per filament length per unit time, cofilin cluster nucleation
    density, and elongation rate as separate observables. Bulk pyrene assays cannot distinguish these,
    which is why the sign of ABRACL's effect is currently ambiguous.
  experiment_type: in vitro reconstitution
- hypothesis: The cilium and nucleus localisations attributed to ABRACL are artefacts of proximity labelling
    and of overexpression respectively.
  description: Knock a fluorescent tag into the endogenous ABRACL locus in a ciliated human line such
    as RPE-1, serum-starve to induce primary cilia, and image the tagged protein against ciliary and centriolar
    markers, alongside neural progenitors for the nuclear question. A negative result is as useful as
    a positive one and would close the question that the current annotation leaves open.
  experiment_type: cell biology
- hypothesis: The opposite sign of the Dictyostelium and human actin phenotypes reflects a difference
    in cofilin regulation between the two systems rather than a divergence in ABRACL itself.
  description: Perform the same F-/G-actin fractionation in both systems side by side, then repeat in
    Dictyostelium cells whose cofilin has been replaced with the human protein, and in human cells expressing
    the Dictyostelium ortholog. Because the human protein already rescues cosA-null cells, the reciprocal
    swap tests whether the partner rather than the Costars protein sets the direction.
  experiment_type: comparative cell biology
