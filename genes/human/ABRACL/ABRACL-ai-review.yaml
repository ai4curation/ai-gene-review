- term:
    id: GO:0030027
    label: lamellipodium
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: 'Accepted, and worth separating sharply from the cilium row it was generated alongside. Both
      are IEA mappings of UniProt subcellular locations under GO_REF:0000044, but the statements being
      mapped are not comparable: the cilium line is ECO:0000305, a curator inference, whereas the lamellipodium
      line is ECO:0000269, backed by experiment.


      The experiment is a good one for a localisation call. Endogenous ABRACL was stained with a specific
      antibody in migrating MDA-MB-231 cells fixed during wound closure, and the signal coincided with
      F-actin at the leading edge; ABRACL/cofilin colocalisation in the same cells was likewise concentrated
      at lamellipodia. This is a direct assay on the untagged protein at native levels, so the annotation
      would properly be IDA against PMID:33670794 rather than IEA against a location vocabulary. The recommendation
      is to upgrade the evidence code, not to change the term.'
    action: ACCEPT
    supported_by:
