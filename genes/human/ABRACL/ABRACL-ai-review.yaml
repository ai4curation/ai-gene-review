- id: PMID:26537243
  title: HSPC280, a winged helix protein expressed in the subventricular zone of the developing ganglionic
    eminences, inhibits neuronal differentiation.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: Cached title matches. Abstract only; not used to support any annotation. Recorded because
      it reports a nuclear pool of the protein in neural progenitors and an anti-differentiation effect
      on overexpression in Neuro2a cells, both of which sit awkwardly with the lamellipodial pool that
      the human functional work establishes. At 9 kDa the protein would enter nuclei by passive diffusion
      regardless of any targeting, so an overexpression result is a weak basis for a nuclear location
      and none is proposed. Marked UNVERIFIED rather than VERIFIED because the localisation claim was
      not checkable from the abstract.
- id: file:human/ABRACL/ABRACL-bioinformatics/RESULTS.md
  title: What actually places ABRACL in the cilium?
  findings:
  - statement: The entire physical-interaction record for ABRACL in IntAct is one proximity-labelling
      experiment.
    supporting_text: 'Detection methods observed: proximity-dependent biotin identification.'
  - statement: The Costars family is retained in four proteomes that build no cilium, while four cilium-core
      control families are absent from all of them.
    supporting_text: Costars distribution therefore does not track cilium presence in either direction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Analysis written for this review; the script queries IntAct and UniProt live and hard-codes
      no results. It was designed to be able to fail: had the family turned out to be absent from angiosperms,
      or had IntAct returned affinity-capture or two-hybrid evidence alongside the BioID hits, the cilium
      annotation would have been left standing. It also records the one observation that cuts against
      a tidy story - Costars is not cross-referenced in the Chlamydomonas proteome - and declines to lean
      on it, since a cross-reference count is not a homology search.'
- id: file:human/ABRACL/ABRACL-deep-research-affinage.md
  title: Affinage mechanistic annotation for ABRACL (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Machine-fetched Affinage record; gates passed, all eight citations are genuine numeric
      PMIDs, and the mechanistic narrative matches the primary literature on the points this review uses.
      Two cautions. Its own GO grounding proposes GO:0005634 nucleus as a localisation, which rests on
