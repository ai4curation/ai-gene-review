- gap_statement: The direction in which ABRACL shifts the filamentous/globular actin balance is unresolved.
    Losing the Dictyostelium ortholog raises cytoskeleton-associated actin; depleting human ABRACL lowers
    the F-/G-actin ratio; and purified human ABRACL on its own inhibits polymerisation. No single signed
    statement fits all three.
  boundary: That ABRACL modulates actin filament dynamics is established from three independent systems,
    and the cofilin-dependent arm of the mechanism is established on purified proteins. Only the sign
    of the net cellular effect is unsettled.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: BP_DARK
  status: OPEN
  significance: It determines whether the correct process term is negative regulation of actin filament
    depolymerization, negative regulation of actin filament polymerization, or neither, and it is the
    reason this review leaves the annotation at the unsigned parent rather than refining it.
  resolution: Single-filament TIRF microscopy with purified actin, cofilin and ABRACL at defined ratios,
    measuring severing frequency, elongation rate and cofilin cluster nucleation separately, rather than
    inferring the sign from bulk pyrene traces or from steady-state cellular fractionation.
  provenance:
