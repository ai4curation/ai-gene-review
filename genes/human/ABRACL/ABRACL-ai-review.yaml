- term:
    id: GO:0051015
    label: actin filament binding
  evidence_type: IDA
  original_reference_id: PMID:33670794
  qualifier: enables
  review:
    summary: 'Proposed new annotation, and the first molecular function this gene would carry. ABRACL
      currently has none at all, which is the largest single gap in its record: a protein with a solved
      structure, a named interaction partner and two in vitro assays on purified protein has no MF row.


      The assay is direct and on the right material. GST-ABRACL was expressed in E. coli, cleaved with
      Factor Xa and the tag removed, so the co-sedimentation was performed on untagged protein; the pellet
      signal was quantified across independent experiments against a no-F-actin control. UniProt records
      the same conclusion in its SUBUNIT line.


      The annotation is offered with its limitation stated rather than buried: the authors describe the
      binding as very weak, and the fraction of ABRACL recovered in the pellet was small. That is a reason
      to record the activity honestly, not to omit it - a weak direct binding measured against a proper
      control is evidence, and it is the only representable molecular function this protein has. The activity
      that actually matters mechanistically, inhibition of a cofilin-type severing protein, has no GO
      term at all and is proposed as a new one below.'
    action: NEW
    supported_by:
    - reference_id: PMID:33670794
      supporting_text: These results indicated that purified recombinant ABRACL bound to F-actin, although
        very weakly, under the in vitro experimental conditions.
    - reference_id: file:human/ABRACL/ABRACL-uniprot.txt
      supporting_text: 'CC   -!- SUBUNIT: Weakly interacts with F-actin (PubMed:33670794). Interacts'
- term:
    id: GO:0030335
    label: positive regulation of cell migration
  evidence_type: IMP
  original_reference_id: PMID:33670794
  qualifier: involved_in
  review:
    summary: 'Proposed new annotation. The migration phenotype is the best-replicated thing known about
      this gene and it is not represented in GO at all.


      The evidence is bidirectional and uses more than one perturbation. Transient overexpression increases
      Transwell migration of MDA-MB-231 cells; two independent shRNAs reduce it in HCT116; re-expression
      from an RNAi-resistant construct restores it, which excludes off-target knockdown; and five independent
      CRISPR knockout clones reduce it again. The Dictyostelium ortholog gives the same sign - cosA-null
      cells move more slowly toward cAMP - so this is not a cancer-cell-line peculiarity.


      One qualification belongs on the record rather than in a footnote: in MDA-MB-231 the basal migration
      of knockout cells was unaffected, and the defect appeared only under EGF stimulation. ABRACL is
      therefore a modulator of stimulated migration in at least some contexts rather than a component
      required for baseline motility, and the positive-regulation term rather than a participation term
      is the right shape for that.'
    action: NEW
    supported_by:
    - reference_id: PMID:33670794
      supporting_text: All five ABRACL-knockout clones examined displayed significantly reduced migration
        in the Transwell assay
    - reference_id: PMID:33670794
      supporting_text: In this cell line, depletion of ABRACL expression did not affect the basal migration
        activity
    - reference_id: PMID:33670794
      supporting_text: ABRACL-knockout cells exhibited significantly decreased migration compared to the
        parental control cells
    - reference_id: PMID:20940261
      supporting_text: Analysis of cell motion in cAMP gradients revealed decreased speed but wild-type-like
        directional persistence of cosA(-) cells, suggesting a defect in the cellular machinery for motility
        rather than for chemotactic orientation.
