- id: PMID:21082705
  title: Solution structure of the human HSPC280 protein.
  findings:
  - statement: The fold is winged helix-like but the protein does not bind DNA, which forecloses the annotation
      a winged-helix fold would otherwise invite.
    supporting_text: However, HEPC280 is not a typical DNA-binding winged helix protein in that it lacks
