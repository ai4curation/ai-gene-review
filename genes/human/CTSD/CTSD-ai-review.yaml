  review:
    summary: A mixed Reactome catalyst set incorrectly assigns a cysteine mechanism to CTSD.
    action: REMOVE
    reason: Both modeled reactions use catalyst 2130638, whose cysteine-specific GO:0004197 activity is attached to mixed cathepsin CandidateSet 2130682. Its actual hasMember 1181223 resolves to human P07339. CTSD instead uses the aspartic mechanism, with catalytic Asp97/Asp295 and independent human structural evidence. The incompatible nucleophile assignment is a demonstrated mapping error; this does not deny general antigen proteolysis, remove the positive location assertion, or rewrite the original TAS source.
