core_functions:
- description: Cathepsin D hydrolyzes internal peptide bonds through an aspartic mechanism in acidic endolysosomal compartments, supporting protein turnover. The human precursor is proteolytically matured into active single-chain and light/heavy-chain forms; these chains derive from one precursor rather than alternative splice products.
  molecular_function: *id001
  directly_involved_in:
  - id: GO:0006508
    label: proteolysis
  locations:
  - id: GO:0043202
    label: lysosomal lumen
  - id: GO:0031904
    label: endosome lumen
  supported_by:
