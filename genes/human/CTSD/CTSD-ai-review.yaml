suggested_questions:
- question: Which CTSD-specific perturbations establish return of the insulin receptor to the signal-ready plasma membrane, distinct from endosomal insulin proteolysis and receptor dephosphorylation?
- question: Do the original membrane-localization experiments distinguish CTSD bound to endosomal/lysosomal membranes from lumenal enzyme or vesicle contents?
- question: Which positive interactome pairs persist for mature CTSD under endogenous cellular conditions, and which represent precursor, fragment or heterologous assay interactions?
- question: Can the Reactome mixed cathepsin sets be split or their catalyst assignments corrected so that the cysteine-specific activities R-HSA-2130349 and R-HSA-2130706 do not propagate to the aspartic protease CTSD, while preserving valid antigen-processing context?
