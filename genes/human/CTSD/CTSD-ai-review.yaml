gene_symbol: CTSD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Cathepsin D is a lysosomal aspartic endopeptidase that cleaves internal peptide bonds during protein turnover. The human 412-residue precursor enters the secretory pathway and is processed to active single-chain and mature light/heavy-chain forms. Its two catalytic aspartates support acidic-compartment proteolysis, including degradation of defined substrates such as apolipoprotein E and internalized insulin. Cathepsin D also occurs in extracellular and secretory-granule compartments. Release from lysosomes into the cytosol can promote mitochondrial cytochrome-c release and caspase-dependent apoptosis.
