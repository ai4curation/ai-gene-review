- term:
    id: GO:0031635
    label: adenylate cyclase-inhibiting opioid receptor signaling pathway
  evidence_type: IC
  original_reference_id: PMID:18384820
  qualifier: involved_in
  review:
    summary: PENK-derived Met-enkephalin, Leu-enkephalin, and extended opioid peptides directly initiate
      the adenylate cyclase-inhibiting opioid receptor signaling pathway via Gi/o-coupled OPRD1 and OPRM1.
    action: NEW
    reason: Met-enkephalin and Leu-enkephalin cleaved from proenkephalin-A (PMID:7057924) are the prototypical
      endogenous agonists of Gi/o-coupled delta (OPRD1) and mu (OPRM1) opioid receptors, which couple
      to pertussis-toxin-sensitive Galpha(i/o) subunits to inhibit forskolin-stimulated adenylyl cyclase
      activity (PMID:18384820, PMID:22437502). Inferred from GO:0001515 (opioid peptide activity), GO:0031628
      (opioid receptor binding), and GO:0038003 (G protein-coupled opioid receptor signaling pathway).
    supported_by:
    - reference_id: PMID:18384820
      supporting_text: In control animals, the mu-opioid selective agonists, sufentanil and DAMGO, stimulated
        [35S]5'-(gamma-thio)-triphosphate ([35S]GTP gamma S) binding and inhibited forskolin-stimulated
        adenylyl cyclase activity, through a mechanism involving pertussis toxin (PTX) sensitive G alpha(i/o)
        subunits.
    - reference_id: PMID:22437502
      supporting_text: The μOR couples predominantly to Gi, the inhibitory G protein for adenylyl cyclase.
        μOR signaling through Gi is responsible for its analgesic properties4.
    - reference_id: PMID:7057924
      supporting_text: The corresponding amino acid sequence shows that the precursor is 267 amino acids
        long and contains six interspersed Met-enkephalin sequences and one Leu-enkephalin sequence.
