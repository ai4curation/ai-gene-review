- id: PMID:18384820
  title: Supersensitivity to mu-opioid receptor-mediated inhibition of the adenylyl cyclase pathway
    involves pertussis toxin-resistant Galpha protein subunits.
  findings:
  - statement: Mu-opioid receptor agonists stimulate [35S]GTPgammaS binding and inhibit forskolin-stimulated
      adenylyl cyclase activity via pertussis-toxin-sensitive Galpha(i/o) subunits.
    supporting_text: In control animals, the mu-opioid selective agonists, sufentanil and DAMGO, stimulated
      [35S]5'-(gamma-thio)-triphosphate ([35S]GTP gamma S) binding and inhibited forskolin-stimulated
      adenylyl cyclase activity, through a mechanism involving pertussis toxin (PTX) sensitive G alpha(i/o)
      subunits.
- id: PMID:22437502
  title: Crystal structure of the µ-opioid receptor bound to a morphinan antagonist.
  findings:
  - statement: The mu-opioid receptor couples predominantly to Gi, the inhibitory G protein for adenylyl
      cyclase.
    supporting_text: The μOR couples predominantly to Gi, the inhibitory G protein for adenylyl cyclase.
      μOR signaling through Gi is responsible for its analgesic properties4.
- id: PMID:36302898
  title: Ligand recognition and allosteric modulation of the human MRGPRX1 receptor.
  findings:
  - statement: Cryo-EM structures of human MRGPRX1-Gq bound to PENK-derived BAM8-22 reveal the mechanism
      of pruritogenic peptide recognition.
    supporting_text: Here we report three high-resolution cryogenic electron microscopy structures of
      MRGPRX1-Gαq in complex with BAM8-22 alone, with BAM8-22 and ML382 simultaneously as well as with
      a synthetic agonist compound-16.
- id: PMID:37591889
  title: Ligand recognition and G protein coupling of the human itch receptor MRGPRX1.
  findings:
  - statement: Human MRGPRX1 is an itch receptor activated by the endogenous PENK-derived cleavage product
      BAM8-22.
    supporting_text: In particular, MRGPRX1, one of the itch receptors in humans, is able to respond to
      endogenous peptides, such as γ2-melanocyte-stimulating hormone (γ2-MSH)7, bovine adrenal medulla
      peptide (BAM) 8-228, and the antimalarial drug chloroquine (CQ)6, which has an intolerant itch side
      effect.
- id: PMID:7057924
  title: Primary structure of the human Met- and Leu-enkephalin precursor and its mRNA.
  findings:
  - statement: Cloning of human pheochromocytoma proenkephalin cDNA revealed a 267-residue precursor containing
      six Met-enkephalin sequences and one Leu-enkephalin sequence.
    supporting_text: The corresponding amino acid sequence shows that the precursor is 267 amino acids
      long and contains six interspersed Met-enkephalin sequences and one Leu-enkephalin sequence.
