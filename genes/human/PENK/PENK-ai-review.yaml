- term:
    id: GO:0001515
    label: opioid peptide activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:104629
  - PANTHER:PTN000153716
  - RGD:68946
  - UniProtKB:P01211
  review:
    summary: Core molecular function of PENK-derived Met-enkephalin, Leu-enkephalin, BAM-22P, and extended
      enkephalin peptides.
    action: ACCEPT
    reason: Human proenkephalin-A is processed into six Met-enkephalin-containing peptides (including
      four copies of Met-enkephalin, MEAP, Met-enkephalin-Arg-Gly-Leu, and BAM peptides) and one copy
      of Leu-enkephalin that act as endogenous opioid peptide agonists at OPRD1 and OPRM1 (PMID:7057924).
    supported_by:
    - reference_id: PMID:7057924
      supporting_text: The corresponding amino acid sequence shows that the precursor is 267 amino acids
        long and contains six interspersed Met-enkephalin sequences and one Leu-enkephalin sequence.
