suggested_questions:
- question: Which tissue-specific aminopeptidases or endopeptidases convert full-length BAM-22P (a dual
    opioid receptor and MRGPRX1 agonist) into BAM8-22 (a selective MRGPRX1 pruritogen lacking the N-terminal
    opioid message) in human skin and dorsal root ganglia?
  experts:
  - Xinzhong Dong
  - Bryan L. Roth
  - Lakshmi A. Devi
suggested_experiments:
- hypothesis: Differential proteolytic processing of BAM-22P in inflamed human skin shifts the balance
    from N-terminal OPRM1/OPRD1 analgesia to C-terminal MRGPRX1 pruritus.
  description: Perform targeted LC-MS/MS peptidomics and protease-inhibitor profiling on human skin interstitial
    fluid and cultured primary human keratinocytes/sensory neurons to quantify the ratio of BAM-22P to
    BAM8-22.
  experiment_type: TargetedLC-MS/MS peptidomics and GPCR signaling assay
