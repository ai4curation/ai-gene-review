id: P01210
gene_symbol: PENK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Proenkephalin-A (PENK) encodes a 267-amino-acid preproprotein that is proteolytically processed
  by prohormone convertases (PCSK1, PCSK2) and carboxypeptidase E (CPE) within neuronal dense-core vesicles
  and adrenal chromaffin granules into multiple bioactive opioid and sensory peptides, including four
  copies of Met-enkephalin (YGGFM), one copy of Leu-enkephalin (YGGFL), the C-terminally extended opioid
  peptides Met-enkephalin-Arg-Phe (MEAP) and Met-enkephalin-Arg-Gly-Leu, and bovine adrenal medulla peptides
  (BAM-22P, BAM-18P, BAM-12P, and BAM8-22). Released into the extracellular synaptic and perivascular
  space, the N-terminal Tyr-Gly-Gly-Phe-Met/Leu motif of PENK-derived enkephalins and BAM-22P binds and
  activates Gi/o-coupled delta (OPRD1) and mu (OPRM1) opioid receptors to inhibit adenylate cyclase and
  modulate nociception and synaptic transmission, whereas the C-terminal region of BAM-22P (and its N-terminally
  truncated fragment BAM8-22) potently activates the Gq/11-coupled primate itch receptor MRGPRX1 to mediate
  non-histaminergic pruritus.
