    summary: PENK-derived Met-enkephalin, Leu-enkephalin, and extended opioid peptides directly initiate
      the adenylate cyclase-inhibiting opioid receptor signaling pathway via Gi/o-coupled OPRD1 and OPRM1.
    action: NEW
    reason: Met-enkephalin and Leu-enkephalin cleaved from proenkephalin-A (PMID:7057924) are the prototypical
      endogenous agonists of Gi/o-coupled delta (OPRD1) and mu (OPRM1) opioid receptors, directly triggering
      Gi/o-mediated inhibition of adenylate cyclase. Inferred from GO:0001515 (opioid peptide activity),
      GO:0031628 (opioid receptor binding), and GO:0038003 (G protein-coupled opioid receptor signaling
      pathway).
