- description: EHMT1 also methylates the nonhistone substrate p53 at lysine 373. Purified human GLP assays
    and cellular coexpression support formation of the dimethylated product in this substrate context.
    This catalytic function is distinct from histone H3K9 methylation; its physiological effects depend
    on the cellular setting and are not assigned to every natural splice product.
