suggested_questions:
- question: Can purified human EHMT1 catalyze conversion of H3K9me2 to H3K9me3 under defined conditions,
    distinct from complex-mediated changes in mark abundance?
- question: Which natural EHMT1 splice products are expressed as stable proteins, and which retain catalytic
    or methyl-histone-recognition activity?
- question: What is the contribution of endogenous EHMT1-dependent p53 K373 methylation relative to EHMT2
    and other p53 modifications in defined cell states?
suggested_experiments:
- hypothesis: Direct final-step H3K9 methylation can be distinguished from complex and cellular effects.
  description: Compare sequence-confirmed purified human EHMT1 and EHMT1/EHMT2 complexes on defined H3K9me0,
    me1 and me2 substrates, measuring products by mass spectrometry with catalytic controls.
  experiment_type: Defined-substrate enzymology
- hypothesis: Natural splice products differ in stability and retained biochemical activities.
  description: Confirm endogenous product-specific transcripts and peptides, then test sequence-verified
    proteins for H3K9 methyl transfer and mono/di-H3K9 binding without assigning activity solely from
    sequence length.
