id: Q9H9B1
gene_symbol: EHMT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EHMT1, also called GLP, is a nuclear SET-domain protein lysine methyltransferase that cooperates
  with EHMT2/G9a in histone H3 lysine 9 methylation and epigenetic repression of gene expression. Its
  ankyrin-repeat region recognizes mono- and dimethylated H3K9 peptides. EHMT1 also methylates nonhistone
  substrates, including p53 at lysine 373. These chromatin and protein-modification activities contribute
  to transcriptional programs that vary with cell type and developmental context. Its natural splice products
  differ substantially in sequence extent and retention of the C-terminal catalytic region.
alternative_products:
- name: '1'
  id: Q9H9B1-1
  description: Displayed 1298-residue reference product containing the ankyrin-repeat region and C-terminal
    pre-SET and SET domains.
- name: '2'
  id: Q9H9B1-2
  sequence_note: VSP_002222, VSP_002223
  description: Described 66-residue product with an alternative sequence at reference residues 8–66 and
    absence of residues 67–1298. It lacks the ankyrin-repeat and SET regions of the displayed product;
    methyltransferase activity is not inferred for this short product.
- name: '3'
  id: Q9H9B1-3
  sequence_note: VSP_002224, VSP_002225
  description: Described 1184-residue product with an alternative terminal sequence at reference residues
    1181–1184 and loss of residues 1185–1298. It retains the ankyrin-repeat region but truncates the reference
    SET domain. Its catalytic competence is not established by the full-length or isolated-domain assays.
- name: '4'
  id: Q9H9B1-4
  sequence_note: VSP_040717, VSP_040718
  description: Described 808-residue product with an alternative sequence at reference residues 795–808
    and loss of residues 809–1298. It terminates within the reference ankyrin-repeat region and lacks
    the pre-SET and SET domains; functional equivalence to the displayed product is not inferred.
