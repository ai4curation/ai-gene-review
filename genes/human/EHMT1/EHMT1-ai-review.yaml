core_functions:
- description: EHMT1 catalyzes histone H3K9 methylation and cooperates with EHMT2/G9a in chromatin-mediated
    repression at selected gene loci. Conserved complex activity supports euchromatic H3K9 mono- and dimethylation.
    The complex also supports locus-specific DNA methylation through a contribution separable from histone
    methyltransferase activity in mouse embryonic stem cells.
  molecular_function:
