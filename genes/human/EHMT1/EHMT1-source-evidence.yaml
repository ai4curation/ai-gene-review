      value: Component of the NF-kappa-B p65-p50 complex. Component of the NF-kappa-B p65-c-Rel complex.
        Homodimer; component of the NF-kappa-B p65-p65 complex. Component of the NF-kappa-B p65-p52 complex.
        May interact with ETHE1. Binds TLE5 and TLE1. Interacts with TP53BP2. Binds to and is phosphorylated
        by the activated form of either RPS6KA4 or RPS6KA5. Interacts with ING4 and this interaction may
        be indirect. Interacts with CARM1, USP48 and UNC5CL. Interacts with IRAK1BP1 (By similarity).
        Interacts with NFKBID (By similarity). Interacts with NFKBIA (PubMed:1493333). Interacts with
        GSK3B. Interacts with NFKBIB (By similarity). Interacts with NFKBIE. Interacts with NFKBIZ. Interacts
        with EHMT1 (via ANK repeats) (PubMed:21515635). Part of a 70-90 kDa complex at least consisting
        of CHUK, IKBKB, NFKBIA, RELA, ELP1 and MAP3K14. Interacts with HDAC3; HDAC3 mediates the deacetylation
        of RELA. Interacts with HDAC1; the interaction requires non-phosphorylated RELA. Interacts with
        CBP; the interaction requires phosphorylated RELA. Interacts (phosphorylated at 'Thr-254') with
        PIN1; the interaction inhibits p65 binding to NFKBIA. Interacts with SOCS1. Interacts with UXT.
        Interacts with MTDH and PHF11. Interacts with ARRB2. Interacts with NFKBIA (when phosphorylated),
        the interaction is direct; phosphorylated NFKBIA is part of a SCF(BTRC)-like complex lacking CUL1.
        Interacts with RNF25. Interacts (via C-terminus) with DDX1. Interacts with UFL1 and COMMD1. Interacts
        with BRMS1; this promotes deacetylation of 'Lys-310'. Interacts with NOTCH2 (By similarity). Directly
        interacts with MEN1; this interaction represses NFKB-mediated transactivation. Interacts with
        AKIP1, which promotes the phosphorylation and nuclear retention of RELA. Interacts (via the RHD)
        with GFI1; the interaction, after bacterial lipopolysaccharide (LPS) stimulation, inhibits the
        transcriptional activity by interfering with the DNA-binding activity to target gene promoter
        DNA. Interacts (when acetylated at Lys-310) with BRD4; leading to activation of the NF-kappa-B
        pathway. Interacts with MEFV. Interacts with CLOCK (By similarity). Interacts (via N-terminus)
        with CPEN1; this interaction induces proteolytic cleavage of p65/RELA subunit and inhibition of
        NF-kappa-B transcriptional activity (PubMed:18212740). Interacts with FOXP3. Interacts with CDK5RAP3;
        stimulates the interaction of RELA with HDAC1, HDAC2 and HDAC3 thereby inhibiting NF-kappa-B transcriptional
        activity (PubMed:17785205). Interacts with DHX9; this interaction is direct and activates NF-kappa-B-mediated
        transcription (PubMed:15355351). Interacts with LRRC25 (PubMed:29044191). Interacts with TBX21
        (By similarity). Interacts with KAT2A (By similarity). Interacts with ZBTB7A; involved in the
        control by RELA of the accessibility of target gene promoters (PubMed:29813070). Directly interacts
        with DDX3X; this interaction may trap RELA in the cytoplasm, impairing nuclear relocalization
        upon TNF activating signals (PubMed:27736973). Interacts with PHF2 (By similarity). Interacts
        with MKRN2; the interaction leads to its polyubiquitination and proteasome-dependent degradation
        (By similarity). Interacts with ECSIT (PubMed:25355951). Interacts with RAB28; the interaction
        contributes to RELA transport from cytoplasm to nucleus (By similarity). Interacts with FBXO16
        (PubMed:40529355). Interacts with FOXM1 isoform 5 (FOXM1D); this promotes nuclear translocation
        of RELA/p65 along with the NFKB1/p50 subunit, leading to increased VEGFA transcription (PubMed:33314660)
