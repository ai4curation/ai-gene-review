      value: Homodimer (PubMed:21419134, PubMed:22022377, PubMed:22086334, PubMed:39638237). Interacts
        (via chromo domain) with histone H3K9me3 (PubMed:20871592). Has the highest affinity for H3K9me3,
        and lesser affinity for H3K9me2 and H3K9me1 (PubMed:20871592). Component of the HUSH complex;
        composed of TASOR, PPHLN1 and MPHOSPH8 (PubMed:26022416, PubMed:39013473, PubMed:39489739). Component
        of the HUSH2 complex; composed of TASOR2, PPHLN1 and MPHOSPH8 (PubMed:39013473, PubMed:39489739).
        Interacts with DNMT3, EHMT1 and SETDB1 (PubMed:20871592, PubMed:22086334). Interacts with MORC2;
        the interaction associates MORC2 with the HUSH complex which recruits MORC2 to heterochromatic
        loci (PubMed:28581500). Interacts with ZNF638; leading to recruitment of the HUSH complex to unintegrated
        retroviral DNA (PubMed:30487602). Interacts with humanin (PubMed:23532874). Interacts with HDGFL2
        (PubMed:34415726)
