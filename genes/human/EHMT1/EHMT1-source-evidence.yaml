      - evidenceCode: ECO:0000269
        source: PubMed
        id: '28803779'
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '29177481'
      value: 'Chromatin reader protein that recognizes and binds histone H3 trimethylated at ''Lys-9'',
        dimethylated at ''Lys-27'' and trimethylated at ''Lys-27'' (H3K9me3, H3K27me2 and H3K27me3, respectively)
        (PubMed:19808672, PubMed:28402439). Part of multimeric repressive chromatin complexes, where it
        is required for transmission and restoration of repressive histone marks, thereby preserving the
        epigenetic landscape (PubMed:28402439). Required for chromatin targeting and maximal enzymatic
        activity of Polycomb repressive complex 2 (PRC2); acts as a positive regulator of PRC2 activity
        by bridging the pre-existing histone H3K27me3 and newly recruited PRC2 on neighboring nucleosomes
        (PubMed:22009739). Acts as a corepressor for REST by facilitating histone-lysine N-methyltransferase
        EHMT2 recruitment and H3K9 dimethylation at REST target genes for repression (PubMed:19061646).
        Involved in X chromosome inactivation in females: recruited to Xist RNA-coated X chromosome and
        facilitates propagation of H3K9me2 by anchoring EHMT2 (By similarity). Promotes EZH2 accumulation
        and H3K27me3 methylation at DNA double strand breaks (DSBs), thereby facilitating transcriptional
        repression at sites of DNA damage and homology-directed repair of DSBs (PubMed:29177481). Required
        for neuronal migration during brain development by repressing expression of RHOA (By similarity).
        By repressing the expression of SCN8A, contributes to the inhibition of intrinsic neuronal excitability
        and epileptogenesis (By similarity). In addition to acting as a chromatin reader, acts as a hydro-lyase
        (PubMed:28803779). Shows crotonyl-coA hydratase activity by mediating the conversion of crotonyl-CoA
        ((2E)-butenoyl-CoA) to beta-hydroxybutyryl-CoA (3-hydroxybutanoyl-CoA), thereby acting as a negative
        regulator of histone crotonylation (PubMed:28803779). Histone crotonylation is required during
        spermatogenesis; down-regulation of histone crotonylation by CDYL regulates the reactivation of
        sex chromosome-linked genes in round spermatids and histone replacement in elongating spermatids
        (By similarity). By regulating histone crotonylation and trimethylation of H3K27, may be involved
        in stress-induced depression-like behaviors, possibly by regulating VGF expression (By similarity)'
    commentType: FUNCTION
    molecule: Isoform 2
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '19808672'
      value: Not able to recognize and bind histone H3K9me3, histone H3K27me2 and histone H3K27me3, due
        to the presence of a N-terminal extension that inactivates the chromo domain (PubMed:19808672)
    commentType: FUNCTION
    molecule: Isoform 1
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '19808672'
      value: Not able to recognize and bind histone H3K9me3, histone H3K27me2 and histone H3K27me3, due
        to the absence of the chromo domain (PubMed:19808672). Acts as a negative regulator of isoform
        2 by displacing isoform 2 from chromatin
    commentType: FUNCTION
    molecule: Isoform 3
  - texts:
    - evidences:
      - evidenceCode: ECO:0000250
        source: UniProtKB
        id: Q9WTK2
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '19061646'
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '19808672'
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '22009739'
      - evidenceCode: ECO:0000269
        source: PubMed
        id: '28402439'
      value: Forms multimers and multimerization is required for stable binding to chromatin (PubMed:19808672).
        Interacts with HDAC1 and HDAC2 via its C-terminal acetyl-CoA-binding domain (By similarity). Interacts
        with EZH2, EED, SUZ12, REST, EHMT1 and EHMT2 (PubMed:19061646). Part of a complex containing at
        least CDYL, REST, WIZ, SETB1, EHMT1 and EHMT2. Part of a complex containing at least CDYL, MIER1,
        MIER2, HDAC1 and HDAC2 (PubMed:22009739). Interacts with CHAF1A and CHAF1B; bridging the CAF-1
        complex to the MCM2-7 (MCM) complex (PubMed:28402439). Interacts with MCM3 and MCM5; bridging
        the CAF-1 complex to the MCM2-7 (MCM) complex (PubMed:28402439). Recruited to Xist RNA-coated
        X chromosome (By similarity). Interacts with EHMT2 and PRDM9; interaction only takes place when
        PRDM9 is bound to hotspot DNA (By similarity)
    commentType: SUBUNIT
- accession: Q99549
  url: https://www.uniprot.org/uniprotkb/Q99549/entry
  function_evidence:
  - texts:
    - evidences:
      - evidenceCode: ECO:0000269
        source: PubMed
