- accession: Q9Y232
  url: https://www.uniprot.org/uniprotkb/Q9Y232/entry
  function_evidence:
  - texts:
    - evidences:
      - evidenceCode: ECO:0000250
        source: UniProtKB
        id: Q9WTK2
      - evidenceCode: ECO:0000269
