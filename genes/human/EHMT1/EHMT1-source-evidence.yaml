product_scope: Natural reference products are reconstructed exactly. Historical human GLP 1–1299 and SET 951–1235
  assays do not by themselves sequence-identify a current product; mouse constructs and G9a numbering
  remain separate.
unresolved:
- row: 52
  term:
    id: GO:0140947
    label: histone H3K9me2 methyltransferase activity
  reason: GO0140947 means methylating an already dimethylated H3K9 input, not producing dimethyl H3K9.
    The Rhea mapping therefore requires direct final-step chemistry. Inspected human GLP evidence supports
    H3K9 methylation but does not resolve that step; the trimethylation-enabling mutant in PMID20084102
    is G9a. Retain the electronic source assertion pending adequate target-specific reaction evidence.
- row: 53
  term:
    id: GO:0140947
    label: histone H3K9me2 methyltransferase activity
  reason: The current Q5DW34 record links this reaction-specific term to PMID24196706. That study measures
    promoter H3K9me2/me3 and methylation by an immunopurified complex; loss of a cellular me3 mark does
    not isolate GLP catalysis on a me2 substrate. The positive chromatin phenotype is preserved, while
    direct human final-step activity remains unresolved.
- row: 54
  term:
    id: GO:0140948
    label: histone H3K9 monomethyltransferase activity
  reason: The protected PMID12004135 cache is abstract-only and bounded original recovery did not yield
    its operative assays. Its H3K9 methyltransferase finding and other GLP evidence support the broad
    writer function, but the exact source-specific assay behind this narrower EXP reaction is not visible.
    This uncertainty is not a claim that EHMT1 cannot produce H3K9me1.
- row: 56
  term:
    id: GO:0140949
    label: histone H3K9 trimethyltransferase activity
  reason: GO0140949 requires all three methyl additions to unmethylated H3K9. The mouse donor PMID24196706
    reports me3 ChIP changes and bulk complex activity, not a purified GLP three-step reaction. Earlier
    mouse GLP loss leaves global me3 unchanged in ES cells, which is context-specific rather than universal
    absence. Retain the imported ISS assertion as unresolved without manufacturing a negative catalytic
    claim.
ontology_limits:
- GO:0140947 consumes H3K9me2 and produces H3K9me3; it is not a generic dimethylation label.
- GO:0062072 requires H3K9me3 recognition in human; mono/di-selective GLP binding is not sufficient.
- GO:0140566 requires chromatin-adaptor activity; peptide recognition alone does not establish it.
