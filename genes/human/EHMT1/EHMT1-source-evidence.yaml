      value: Forms homodimers and homotetramers (PubMed:19011621). Binds DNA as a homotetramer (PubMed:36108750).
        Interacts with AXIN1. Probably part of a complex consisting of TP53, HIPK2 and AXIN1 (By similarity).
        Interacts with histone acetyltransferases EP300 and methyltransferases HRMT1L2 and CARM1, and
        recruits them to promoters. Interacts (via C-terminus) with TAF1; when TAF1 is part of the TFIID
        complex. Interacts with ING4; this interaction may be indirect. Found in a complex with CABLES1
        and TP73. Interacts with HIPK1, HIPK2, and TP53INP1. Interacts with WWOX. May interact with HCV
        core protein. Interacts with USP7 and SYVN1. Interacts with HSP90AB1. Interacts with CHD8; leading
        to recruit histone H1 and prevent transactivation activity (By similarity). Interacts with ARMC10,
        CDKN2AIP, NUAK1, STK11/LKB1, UHRF2 and E4F1. Interacts with YWHAZ; the interaction enhances TP53
        transcriptional activity. Phosphorylation of YWHAZ on 'Ser-58' inhibits this interaction. Interacts
        (via DNA-binding domain) with MAML1 (via N-terminus). Interacts with MKRN1. Interacts with PML
        (via C-terminus). Interacts with MDM2; leading to ubiquitination and proteasomal degradation of
        TP53 (PubMed:10570149, PubMed:19880522, PubMed:22914926, PubMed:8875929). Interacts with PDCD5;
        the interaction is direct and prevents the interaction between TP53 and MDM2, thereby stabilizing
        TP53 (PubMed:22914926). Directly interacts with FBXO42; leading to ubiquitination and degradation
        of TP53. Interacts (phosphorylated at Ser-15 by ATM) with the phosphatase PP2A-PPP2R5C holoenzyme;
        regulates stress-induced TP53-dependent inhibition of cell proliferation. Interacts with PPP2R2A.
        Interacts with AURKA, DAXX, BRD7 and TRIM24. Interacts (when monomethylated at Lys-382) with L3MBTL1.
        Isoform 1 interacts with isoform 2 and with isoform 4. Interacts with GRK5. Binds to the CAK complex
        (CDK7, cyclin H and MAT1) in response to DNA damage. Interacts with CDK5 in neurons. Interacts
        with AURKB, SETD2, UHRF2 and NOC2L. Interacts (via N-terminus) with PTK2/FAK1; this promotes ubiquitination
        by MDM2. Interacts with PTK2B/PYK2; this promotes ubiquitination by MDM2. Interacts with PRKCG.
        Interacts with PPIF; the association implicates preferentially tetrameric TP53, is induced by
        oxidative stress and is impaired by cyclosporin A (CsA). Interacts with SNAI1; the interaction
        induces SNAI1 degradation via MDM2-mediated ubiquitination and inhibits SNAI1-induced cell invasion.
        Interacts with UBC9. Interacts with ZNF385B; the interaction is direct. Interacts (via DNA-binding
        domain) with ZNF385A; the interaction is direct and enhances p53/TP53 transactivation functions
        on cell-cycle arrest target genes, resulting in growth arrest. Interacts with ANKRD2. Interacts
        with RFFL and RNF34; involved in p53/TP53 ubiquitination. Interacts with MTA1 and COP1. Interacts
        with CCAR2 (via N-terminus). Interacts with MORC3 (PubMed:17332504). Interacts (via C-terminus)
        with POU4F2 isoform 1 (via C-terminus) (PubMed:17145718). Interacts (via oligomerization region)
        with NOP53; the interaction is direct and may prevent the MDM2-mediated proteasomal degradation
        of TP53 (PubMed:22522597). Interacts with AFG1L; mediates mitochondrial translocation of TP53
        (PubMed:27323408). Interacts with UBD (PubMed:25422469). Interacts with TAF6 isoform 1 and isoform
        4 (PubMed:20096117). Interacts with C10orf90/FATS; the interaction inhibits binding of TP53 and
        MDM2 (By similarity). Interacts with NUPR1; interaction is stress-dependent (PubMed:18690848).
        Forms a complex with EP300 and NUPR1; this complex binds CDKN1A promoter leading to transcriptional
        induction of CDKN1A (PubMed:18690848). Interacts with PRMT5 in response to DNA damage; the interaction
        is TTC5/STRAP dependent (PubMed:19011621). Interacts with PPP1R13L (via SH3 domain and ANK repeats);
        the interaction inhibits pro-apoptotic activity of p53/TP53 (PubMed:12524540). Interacts with
        PPP1R13B/ASPP1 and TP53BP2/ASPP2; the interactions promotes pro-apoptotic activity (PubMed:12524540).
        When phosphorylated at Ser-15, interacts with DDX3X and gamma-tubulin (PubMed:28842590). Interacts
        with KAT7/HBO1; leading to inhibit histone acetyltransferase activity of KAT7/HBO1 (PubMed:17954561).
        Interacts (via N-terminus) with E3 ubiquitin-protein ligase MUL1; the interaction results in ubiquitination
        of cytoplasmic TP53 at Lys-24 and subsequent proteasomal degradation (PubMed:21597459). Interacts
        with S100A4; this interaction promotes TP53 degradation (PubMed:23752197, PubMed:32442400). Interacts
        with BANP (By similarity). Interacts with TTC5/STRAP; the interaction may result in increased
        mitochondrial-dependent apoptosis (PubMed:25168243). Interacts with NQO1; this interaction is
        NADH-dependent, stabilizes TP53 in response to oxidative stress and protects it from ubiquitin-independent
        degradation by the 20S proteasome (PubMed:15687255). Interacts with DAZAP2 at TP53 target gene
        promoters; the interaction is triggered by DNA damage and leads to modulation of the expression
        of a subset of TP53 target genes, reducing DNA damage-induced cell death by limiting the expression
        of cell death-mediating TP53 target genes (PubMed:33591310). Interacts (via N-terminus) with ZNF768
        (via zinc-finger domains); interaction might be facilitated by TP53 oligomerization state (PubMed:34404770).
        Forms a ternary complex with ALDOB and G6PD; this interaction is direct. ALDOB stabilizes the
        complex inhibiting G6PD activity and keeping oxidative pentose phosphate metabolism in check.
        Interacts with MORN3; the interactions mediate post-transcriptional modifications of TP53 by MDM2
        and SIRT1 (PubMed:29681526). Interacts with HSPA9/MOT-2; the interaction promotes the degradation
        of TP53 (PubMed:24625977). Interacts with FBXO22; this interaction promotes TP53 proteasomal degradation
        (PubMed:26868148)
