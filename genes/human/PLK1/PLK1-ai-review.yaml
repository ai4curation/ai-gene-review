- term:
    id: GO:0000070
    label: mitotic sister chromatid segregation
  evidence_type: IMP
  original_reference_id: PMID:23455478
  qualifier: involved_in
  review:
    summary: PLK1 is a core mitotic kinase whose dynamic localization to kinetochores, centrosomes and
      the spindle midzone is required for chromosome alignment and faithful segregation; a non-ubiquitylatable
      PLK1-K492R mutant that cannot be removed from kinetochores by CUL3-KLHL22 causes chromosome alignment
      defects and SAC activation.
    action: ACCEPT
    reason: Kinetochore-localized PLK1 promotes stable kinetochore-microtubule attachment and sister chromatid
      segregation (via BUB1/BUBR1, CENP-U and cohesin-related substrates); the IMP evidence from the PLK1-K492R
      mutant directly implicates PLK1 dynamics in segregation fidelity. Core mitotic function.
    supported_by:
    - reference_id: PMID:23455478
      supporting_text: Polo-like kinase 1 (PLK1) critically regulates mitosis through its dynamic localization
        to kinetochores, centrosomes and the midzone.
    - reference_id: PMID:23455478
      supporting_text: Expression of a non-ubiquitylatable PLK1-K492R mutant phenocopies inactivation
        of CUL3-KLHL22.
