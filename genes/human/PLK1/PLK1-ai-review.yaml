        degradation of Plk1, a prominent mitotic kinase. This process induces the stabilization of Claspin,
        an activator of the DNA-damage checkpoint, and Wee1, an inhibitor of cell-cycle progression, and
        allows an efficient G2 checkpoint.
    - reference_id: PMID:16885022
      supporting_text: Phosphorylation of Claspin is mediated by Plk1 and is essential for binding to
