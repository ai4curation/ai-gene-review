    summary: In G2-damaged cells CDC14B activates APC/C-CDH1, which degrades PLK1; loss of PLK1 stabilizes
      CLASPIN and WEE1 and permits the G2 checkpoint. PLK1 is thus the antagonist that the checkpoint
      must remove, and it drives checkpoint recovery by phosphorylating CLASPIN and WEE1 for SCF(beta-TrCP)
      degradation.
