- description: 'Mitotic-entry kinase: after Aurora A/BORA-dependent Thr210 phosphorylation, PLK1 phosphorylates
    and activates CDC25C, primes WEE1 for SCF(beta-TrCP) degradation, inactivates PKMYT1 and phosphorylates
    cyclin B1/FOXM1, driving switch-like CDK1-cyclin B activation and nuclear envelope breakdown at the
    G2/M transition.'
