    reason: PLK1 does not execute G2 DNA-damage checkpoint signaling; it opposes and terminates it (PMID:18662541,
      PMID:16885022, PMID:20126263). 'involved_in mitotic G2 DNA damage checkpoint signaling' misrepresents
      the direction of its action. The better term is negative regulation of DNA damage checkpoint.
