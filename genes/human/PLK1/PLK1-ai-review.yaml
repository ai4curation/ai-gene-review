id: P53350
gene_symbol: PLK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Polo-like kinase 1 (PLK1) is the founding human member of the Polo kinase family, a serine/threonine
  protein kinase composed of an N-terminal catalytic domain and a C-terminal tandem polo-box domain (PBD).
  The PBD binds Ser-[pThr/pSer]-Pro/X docking motifs, typically primed by CDK1, and thereby couples PLK1
  catalysis to specific mitotic structures; PLK1 can also generate its own docking sites. PLK1 protein
  accumulates from S phase, peaks in G2/M and is activated in late G2 by Aurora A/BORA-dependent phosphorylation
  of Thr210; it is degraded by APC/C-CDH1 at mitotic exit. During the G2/M transition nuclear PLK1 phosphorylates
  and activates CDC25C, primes WEE1 for SCF(beta-TrCP)-mediated destruction, inhibits PKMYT1 and phosphorylates
  cyclin B1 and FOXM1, reinforcing the switch-like activation of CDK1-cyclin B. At centrosomes PLK1 drives
  pericentriolar material expansion and gamma-tubulin recruitment (via NEDD1, KIZ, NINL and pericentrin),
  promotes centrosome disjunction (via MST2/NEK2A and NEK9/EG5) and coordinates Aurora A localization
  through BORA turnover, all required for bipolar spindle assembly. At kinetochores, where it docks on
  BUB1, CENP-U and SGO1-dependent receptors, PLK1 promotes kinetochore-microtubule attachment, chromosome
  congression and spindle-checkpoint regulation; it also phosphorylates the cohesin subunit STAG2 to remove
  arm cohesin in prophase and phosphorylates EMI1 and APC/C to allow APC/C activation at the metaphase/anaphase
  transition. In anaphase PLK1 relocates to the spindle midzone by docking on PRC1 and KIF20A, phosphorylates
  the centralspindlin subunit RACGAP1 to recruit the RhoGEF ECT2, and thereby triggers RhoA-dependent
  cleavage-furrow formation; it persists at the midbody through abscission. Beyond these core mitotic
  roles, PLK1 promotes recovery from the G2 DNA damage checkpoint (by targeting CLASPIN, WEE1, 53BP1,
  CHK2 and MRE11), phosphorylates RAD51, POLQ and RHNO1 to modulate DNA double-strand break repair, antagonizes
  p53/p73, and has secondary roles in Golgi fragmentation, primary cilium disassembly and meiotic synaptonemal
  complex disassembly. PLK1 is essential for proliferation, is over-expressed in many cancers and is the
  target of clinical ATP-competitive inhibitors.
