- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:18174154
  qualifier: involved_in
  review:
    summary: PLK1 phosphorylates p73/TP73 at Thr-27 and blocks p73-mediated transcriptional activation
      in reporter assays; PLK1 knockdown increases p73-dependent apoptosis.
    action: MARK_AS_OVER_ANNOTATED
    reason: The molecular event is phosphorylation of a transcription factor; the reduction in Pol II-dependent
      transcription of p73 targets is a downstream readout, and PLK1 is not a transcriptional regulator.
      Peripheral to the mitotic core function and one of many PLK1 substrates whose downstream consequences
      should not each become a process annotation.
    supported_by:
    - reference_id: PMID:18174154
      supporting_text: Luciferase reporter assay and reverse transcription-PCR analysis revealed that
        Plk1 is able to block the p73-mediated transcriptional activation.
