proposed_new_terms: []
suggested_questions:
- question: Which PLK1 outputs at kinetochores are executed by PLK1 itself versus by MPS1 or Aurora B
    acting downstream of PLK1-dependent priming, and does PLK1 belong under 'mitotic spindle assembly
    checkpoint signaling' as a participant or only as a regulator whose removal permits SAC satisfaction?
- question: GO lacks a 'centrosome maturation' (pericentriolar material expansion) term; PLK1's best-documented
    centrosomal function is currently annotated to the broader 'centrosome cycle'. Would a dedicated child
    term be warranted for PLK1, AURKA, CEP192 and pericentrin?
- question: Should the many individual substrate-derived process annotations (p73/apoptosis, MDM2/TOPORS/p53
    turnover, GTSE1 nuclear localization, GORASP1/Golgi) be consolidated, given that each reflects one
    phosphorylation event downstream of the mitotic kinase rather than an independently evolved PLK1 function?
suggested_experiments:
- description: Analog-sensitive PLK1 (as-PLK1) combined with stage-resolved mitotic phosphoproteomics
    to distinguish direct PLK1 substrates from CDK1-, MPS1- and Aurora-dependent secondary events at centrosomes,
    kinetochores and the midzone.
- description: Separation-of-function alleles (kinase-dead, PBD H538A/K540M, K492R) scored in isogenic
    cells for centrosome maturation, spindle bipolarity, chromosome congression, SAC silencing and furrow
    induction to map which functions require catalysis versus PBD docking.
- description: Endogenous degron-tagged PLK1 depleted acutely in G2-arrested (DNA-damaged) cells with
    time-lapse imaging of CLASPIN/WEE1 levels and mitotic entry, to quantify PLK1's contribution to checkpoint
    termination versus recovery.
