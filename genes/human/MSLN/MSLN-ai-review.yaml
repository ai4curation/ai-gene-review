suggested_questions:
- question: Does mesothelin have a physiological function in mesothelium beyond CA125-mediated adhesion,
    given that Msln-deficient mice show no overt phenotype?
- question: What is the receptor and in vivo relevance of megakaryocyte-potentiating factor activity?
suggested_experiments:
- description: Map the CA125-binding surface of mesothelin by mutagenesis of the N-terminal region (around
    the MORAb-009 epitope) and test heterotypic adhesion of MUC16-expressing ovarian cancer cells to mesothelin-expressing
    cells.
