id: Q13421
gene_symbol: MSLN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MSLN encodes a 71-kDa precursor that is cleaved by a furin-like convertase into a secreted
  N-terminal fragment, megakaryocyte-potentiating factor (MPF), and mature mesothelin, a ~40-kDa glycosylphosphatidylinositol
  (GPI)-anchored glycoprotein displayed on the outer surface of the plasma membrane. Mesothelin is expressed
  by mesothelial cells lining the pleural, peritoneal and pericardial cavities and is highly overexpressed
  in mesothelioma, ovarian, pancreatic and other carcinomas. Its superhelical N-terminal region binds
  the mucin CA125/MUC16, mediating heterotypic cell adhesion that is thought to promote peritoneal implantation
  of ovarian cancer. Soluble mesothelin and MPF released into serum are tumour biomarkers, and cell-surface
  mesothelin is a major target of antibody, immunotoxin and CAR-T therapies.
