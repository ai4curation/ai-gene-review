id: Q03135
gene_symbol: CAV1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Caveolin-1 is an oligomeric membrane protein that forms the membrane-embedded structural
  framework of caveolae together with caveolin and cavin partners. Its tightly associated protomers
  support a stable coat that can insert into the cytoplasmic membrane leaflet. Separate interactions
  organize selected receptors, channels and trafficking proteins, while direct inhibition of nitric-oxide
  synthase provides a defined enzyme-regulatory activity. Partner recruitment and regulatory direction
  depend on the cellular context, phosphorylation and relative protein abundance. The alpha and beta
  products arise from alternative translation initiation. Biallelic loss of CAV1 causes generalized
  lipodystrophy, and heterozygous variants are associated with incompletely penetrant pulmonary arterial
  hypertension; evidence for dominant lipodystrophy and amyotrophic lateral sclerosis is more limited.
