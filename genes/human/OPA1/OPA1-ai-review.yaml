id: O60313
gene_symbol: OPA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: OPA1 is a dynamin-related mechanochemical GTPase of the mitochondrial inner membrane, imported
  via an N-terminal presequence and anchored by a transmembrane segment with its GTPase, stalk and lipid-binding
  paddle domains in the intermembrane space. Alternative splicing and proteolytic processing by the inner-membrane
  proteases YME1L and OMA1 generate long, membrane-anchored (L-OPA1) and short, soluble (S-OPA1) forms.
  L-OPA1 on one membrane and cardiolipin on the opposing membrane are sufficient for GTP hydrolysis-dependent
  fusion of inner membranes, which follows mitofusin-mediated outer-membrane fusion, and S-OPA1 enhances
  this reaction. Independently of fusion, OPA1 oligomers bend cardiolipin-rich membranes and, with the
  MICOS complex, maintain crista junctions and cristae architecture, which supports respiratory efficiency,
  retains cytochrome c within cristae and so restrains apoptosis, and contributes to mtDNA maintenance.
  Heterozygous OPA1 mutations cause autosomal dominant optic atrophy, sometimes with multisystem "plus"
  features and mtDNA deletions.
