  - reference_id: PMID:37612504
    supporting_text: the membrane-bending OPA1 oligomer undergoes conformational changes that pull the
      membrane-inserting loop out of the outer leaflet
  - reference_id: PMID:32245890
    supporting_text: S-OPA1, despite its inability to mediate mitochondrial fusion, is fully competent
