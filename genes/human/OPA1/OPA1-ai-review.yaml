existing_annotations:
- term:
    id: GO:0000266
    label: mitochondrial fission
  evidence_type: TAS
  original_reference_id: PMID:12509422
  qualifier: involved_in
  review:
    summary: Mitochondrial fission (TAS) based on fragmentation of the mitochondrial network after OPA1
      knockdown.
    action: REMOVE
    reason: Fragmentation after OPA1 loss reflects loss of inner-membrane fusion with ongoing DRP1-mediated
      fission, not a role of OPA1 in fission; the cited abstract describes OPA1 as an inner-membrane organizer.
      OPA1 is a fusion GTPase and the annotation is contradicted by the mechanism.
    supported_by:
    - reference_id: PMID:12509422
      supporting_text: down-regulation of OPA1 in HeLa cells using specific small interfering RNA (siRNA)
        leads to fragmentation of the mitochondrial network
    - reference_id: PMID:12509422
      supporting_text: These results suggest that OPA1 is a major organizer of the mitochondrial inner
        membrane from which the maintenance of the cristae integrity depends.
