  - reference_id: PMID:32567732
    supporting_text: OPA1 works in concert with the Mic10‐subcomplex to stabilize tubular CJs
suggested_questions:
- question: How do L-OPA1 and S-OPA1 ratios, set by YME1L and OMA1, tune the balance between inner-membrane
    fusion and cristae maintenance in vivo?
- question: Why are retinal ganglion cells selectively vulnerable to OPA1 haploinsufficiency?
suggested_experiments:
- description: In situ cryo-ET of crista junctions in cells expressing only L-OPA1 or S-OPA1 to determine
    the oligomeric arrangement responsible for junction stability versus fusion.
