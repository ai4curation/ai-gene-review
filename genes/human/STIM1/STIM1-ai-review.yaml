id: Q13586
gene_symbol: STIM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: STIM1 (stromal interaction molecule 1) is a single-pass type I endoplasmic
  reticulum membrane protein that acts as the ER calcium sensor for store-operated
  calcium entry (SOCE). Its lumenal EF-hand/SAM region binds Ca(2+); depletion of
  ER Ca(2+) causes STIM1 to oligomerize and undergo a conformational change that exposes
  the cytoplasmic SOAR/CAD domain. STIM1 then accumulates at ER-plasma membrane junctions
  (cortical ER), where it directly binds and gates the ORAI1/2/3 CRAC channel pore
  subunits to drive calcium influx. STIM1 also regulates adenylyl cyclase and TRPC
  channels, tracks growing microtubule plus-ends via an EB1-binding motif, and in
  muscle resides in the sarcoplasmic reticulum. Gain-of-function mutations cause tubular
  aggregate myopathy/Stormorken syndrome and loss of function causes a CRAC channelopathy.
