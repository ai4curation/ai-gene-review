id: Q9NQ11
gene_symbol: ATP13A2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP13A2 is a P5B-type ATPase that uses ATP hydrolysis to export polyamines, especially
  spermine, from late endolysosomal compartments into the cytosol. Its membrane-associated N-terminal
  region binds phosphatidic acid and phosphatidylinositol 3,5-bisphosphate, coupling the transporter
  to its endolysosomal lipid environment. ATP13A2-dependent lysosomal homeostasis affects autophagic
  trafficking, exosomal secretion and neuronal survival. Loss-of-function variants cause Kufor-Rakeb
  syndrome and other neurodegenerative phenotypes. Potassium-dependent membrane ATPase activity and
  cellular potassium-surrogate transport have also been reported.
