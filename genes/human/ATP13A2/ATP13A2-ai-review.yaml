suggested_questions:
- question: How do the reported potassium-dependent membrane ATPase and cellular 86Rb-transport observations
    relate mechanistically to ATP13A2-mediated polyamine export, and is proton coupling intrinsic
    or indirect?
- question: Are the metal-binding sites assayed in synthetic yeast YPK9 peptides conserved and functional
    in intact human ATP13A2?
- question: Which ATP13A2 constructs and cell conditions account for the different SYT11 association
    results, and which interaction partners support direct binary binding?
- question: How do the three annotated alternative products differ in localization, lipid regulation
    or transport, given that assaying one isoform does not establish an exclusive function?
suggested_experiments:
- hypothesis: Matched transport measurements can distinguish intrinsic polyamine or potassium/proton
    coupling from effects of the cellular membrane environment.
  description: Compare matched reconstituted wild-type and catalytic-control ATP13A2 preparations,
    measuring polyamine, potassium and proton flux separately under defined gradients, with ATP and
    no-ATP controls and verified protein orientation. Relate each flux to ATP hydrolysis to distinguish
    intrinsic coupled transport from cellular effects. This is a proposed experiment and is not claimed
    to have been performed.
  experiment_type: Controlled membrane reconstitution and independent substrate-flux assays
