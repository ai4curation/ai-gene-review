id: P17706
gene_symbol: PTPN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PTPN2 encodes TC-PTP, a non-receptor protein tyrosine phosphatase that removes phosphotyrosine
  from receptor tyrosine kinases, JAK kinases, Src-family kinases and STAT transcription factors. Alternative
  isoforms direct the same catalytic domain to ER/ERGIC membranes or to a nuclear-cytoplasmic pool, allowing
  TC-PTP to terminate cytokine, interferon, insulin, EGFR, PDGFRB, MET, CSF1R and T-cell receptor signaling
  in different compartments.'
