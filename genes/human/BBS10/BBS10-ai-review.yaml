description: BBS10 is a divergent type II chaperonin-like protein that helps assemble the BBSome,
  a complex involved in ciliary membrane protein trafficking. It associates with BBS6/MKKS, BBS12
  and BBSome proteins and regulates formation of the BBS-chaperonin machinery containing CCT/TRiC
  proteins. Its association with that machinery is transient or substoichiometric; it is not a stable
  subunit of the mature BBSome. These assembly interactions support the stability and incorporation
  of BBSome subunits. BBS10 has been detected at ciliary basal bodies in human cell models. Its chaperonin-like
  sequence does not by itself establish autonomous ATP hydrolysis or protein-folding activity. Biallelic
  loss-of-function variants cause Bardet-Biedl syndrome type 10, with ciliary dysfunction affecting
  multiple tissues.
