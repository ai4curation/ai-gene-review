core_functions:
- description: Facilitates BBSome assembly by associating with BBS proteins and regulating formation
    of the BBS-chaperonin assembly machinery. Human BBS10 knockdown and overexpression alter association
    of BBS6 with CCT proteins, and loss of BBS10 disrupts BBSome assembly. These experiments support
    an assembly role without establishing that BBS10 independently catalyses ATP-dependent folding.
    The molecular activity is therefore left unresolved instead of assigning a conventional folding-chaperone
    activity or stable membership in the mature BBSome.
  directly_involved_in:
  - id: GO:0051131
    label: chaperone-mediated protein complex assembly
  - id: GO:0043254
    label: regulation of protein-containing complex assembly
  supported_by:
  - reference_id: PMID:22500027
    supporting_text: BBS10 regulates the formation of the BBS-chaperonin complex.
  knowledge_gaps:
  - gap_statement: The molecular step performed by BBS10 during formation of the BBS-chaperonin machinery
      remains unresolved by the reviewed experiments, including whether nucleotide binding contributes
      directly to its assembly function.
    boundary: BBS10-dependent complex formation and partner association are established in human
      cells. Those measurements do not distinguish direct substrate folding from recruitment or conformational
      regulation of the assembly machinery.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    resolution: Reconstitute BBS10 and defined partners to measure nucleotide binding, hydrolysis,
      substrate folding and complex assembly independently, with controls for the activity of CCT
      and for mutant-protein stability.
    provenance:
    - reference_id: PMID:22500027
      supporting_text: key regulatory component
proposed_new_terms: []
suggested_questions:
- question: Which physical step does BBS10 perform when promoting the association of BBS6-BBS12-BBS7
    with CCT proteins, and does nucleotide binding contribute to that step independently of protein
    stability?
- question: Which cell-state differences explain impaired ciliogenesis after BBS10 depletion in differentiating
    preadipocytes but retained cilia formation in the patient fibroblasts studied in PMID:22500027?
- question: What functional consequence does the observed BBS10-RNF2 association have in human cells,
    beyond the BBS7-specific transcriptional experiments reported in PMID:22302990?
suggested_experiments:
- description: Reconstitute BBS10 with BBS6, BBS12, BBS7 and CCT in defined combinations. Measure
    nucleotide binding and hydrolysis separately from substrate conformation and BBSome assembly,
    controlling for ATPase activity contributed by CCT and for purified-protein quality.
  experiment_type: in vitro biochemistry and reconstitution
  hypothesis: BBS10 promotes assembly through a specific recruitment or regulatory interaction that
    can be separated experimentally from CCT-mediated folding.
- description: Compare wild-type BBS10, engineered D81N and verified patient variants with matched
    expression, folding and localization controls before interpreting changes in partner association
    or BBSome assembly.
  experiment_type: structure-function analysis
  hypothesis: Some interaction defects arise from altered BBS10 conformation rather than loss of
    a nucleotide-dependent catalytic step.
