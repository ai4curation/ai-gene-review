description: BBS10 is a divergent member of the type II TCP-1/CCT chaperonin family
  that helps assemble the BBSome, a complex involved in ciliary membrane protein trafficking.
  It associates with BBS6/MKKS, BBS12 and BBSome proteins and regulates formation
  of assembly machinery containing CCT/TRiC proteins. These interactions support BBS7
  stability and assembly of the BBS7-BBS2-BBS9 intermediate from which the mature
  BBSome forms. BBS10 associates transiently or substoichiometrically with the assembly
  machinery and is not a stable subunit of the mature BBSome. It localizes to ciliary
  basal bodies in human cell models. Biallelic loss-of-function variants cause Bardet-Biedl
  syndrome type 10, with ciliary dysfunction affecting multiple tissues.
