gene_symbol: C2CD3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: C2CD3 is a C2-domain-rich protein that organizes the distal region of centrioles and supports
  their elongation and maturation into ciliary basal bodies. Its radially arranged molecules link the
  distal luminal protein network to the machinery that recruits appendages and other ciliogenesis factors.
  C2CD3 associates with OFD1 and helps coordinate centriole length with distal architecture. Loss of C2CD3
  disrupts appendage recruitment and primary-cilium formation, while initial procentriole formation can
  persist. Pathogenic variants cause an oral-facial-digital ciliopathy with variable brain and skeletal
  abnormalities.
