core_functions:
- description: C2CD3 contributes structural organization at the distal centriole, positioning a radial
    luminal network that supports centriole elongation and recruitment or retention of distal ciliogenesis
    machinery. This integrates appendage maturation and primary-cilium formation; it does not assign C2CD3
    to every ring node or hook, require loss of initial procentriole formation, or infer catalytic activity
    from recruited partners.
