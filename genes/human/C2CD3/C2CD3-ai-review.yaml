- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: IDA
  original_reference_id: PMID:41364719
  review:
    summary: C2CD3 contributes to the structural organization of the distal-centriolar luminal network.
    action: NEW
    reason: PMID:41364719 combines human C2CD3 epitope mapping in a radial arrangement with loss of luminal
      and appendage-recruitment architecture after depletion. Physical placement within that architecture
      plus its organizing effect supports a cytoskeletal structural function, beyond a ciliogenesis-necessity
      phenotype alone. Mouse cryo-electron tomography is complementary structural context; it does not
      identify every ring node or hook as C2CD3. GO:0005200 specifically concerns structural integrity
      of a cytoskeletal structure; the distal centriole is that structure here. It is a child of structural
      molecule activity and does not require direct tubulin affinity. This specifies the demonstrated
      architectural role without asserting a finer protein adapter, catalytic activity or calcium-dependent
      lipid binding. This is a new molecular-function assertion, not an additional process annotation.
    supported_by:
    - reference_id: PMID:41364719
      supporting_text: destabilizes the luminal ring network
