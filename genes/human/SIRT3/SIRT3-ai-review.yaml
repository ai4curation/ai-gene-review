id: Q9NTG7
gene_symbol: SIRT3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SIRT3 is a mitochondrial matrix NAD+-dependent protein lysine deacetylase and delactylase that is imported as
  an inactive precursor and activated by mitochondrial processing peptidase cleavage. It removes acetyl groups from metabolic
  enzymes such as ACSS1, GLUD1, IDH2, SOD2, LCAD, SDHA, MRPL12, and ATP synthase subunits, adjusting oxidative phosphorylation,
  antioxidant defense, and fuel oxidation during nutrient and stress responses, and more recent work also shows lysine delactylase
  activity on CCNE2 and H4K16la.
