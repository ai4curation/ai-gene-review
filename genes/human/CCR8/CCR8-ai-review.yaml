id: P51685
gene_symbol: CCR8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CCR8 (C-C chemokine receptor 8) is a class A seven-transmembrane G protein-coupled receptor
  in the plasma membrane that binds CC chemokines, chiefly CCL1 (I-309), and also CCL8, CCL16 and CCL18,
  at its extracellular face. It couples to Gi, triggering calcium flux and chemotaxis. CCR8 is preferentially
  expressed on Th2 cells and on skin and tumor-infiltrating regulatory T cells, making it a cancer immunotherapy
  target. It mediates monocyte and eosinophil chemotaxis and Th2 recruitment, and in microglia CCL18-CCR8
  promotes phagocytosis. CCR8 is also exploited as an entry coreceptor by some HIV-1/HIV-2 strains and
  binds the Kaposi-virus chemokine vCCL1/K6.
