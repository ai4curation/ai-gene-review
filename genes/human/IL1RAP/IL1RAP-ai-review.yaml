core_functions:
- description: 'Shared signalling co-receptor of the IL-1 receptor family: recruited by ligand-bound IL1R1,
    IL1RL1 (ST2) or IL1RL2 to form the high-affinity signalling heterodimer at the plasma membrane, whose
    paired TIR domains recruit MYD88 and TOLLIP-IRAK to initiate IL-1, IL-33 and IL-36 signalling.'
  molecular_function:
    id: GO:0015026
    label: coreceptor activity
  directly_involved_in:
  - id: GO:0070498
    label: interleukin-1-mediated signaling pathway
  - id: GO:0038172
    label: interleukin-33-mediated signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0045323
    label: interleukin-1 receptor complex
  supported_by:
  - reference_id: PMID:9065432
    supporting_text: These results proved that IL-1RAcP is an indispensible molecule in the IL-1 receptor
      signal transduction complex, necessary to link events on the plasma membrane level to downstream
      signaling pathways
  - reference_id: PMID:10854325
    supporting_text: recruitment of Tollip-IRAK complexes to the activated receptor complex occurs through
      association of Tollip with IL-1RAcP
  - reference_id: PMID:22426547
    supporting_text: Here we present the crystal structure of IL-1β bound to its primary receptor IL-1RI
      and its receptor accessory protein IL-1RAcP
  - reference_id: PMID:17675517
    supporting_text: IL-33-mediated signal transduction can be inhibited by dominant-negative IL-1RAcP
  - reference_id: PMID:21965679
    supporting_text: IL-36Ra binds to IL-1Rrp2 and prevents IL-1RAcP recruitment and the formation of
      a functional signaling complex
suggested_questions:
- question: Should GO add terms for interleukin-36-mediated signaling and the IL-36 receptor complex,
    so that IL1RAP and IL1RL2 participation in IL-36 signalling can be annotated specifically rather than
    to cytokine-mediated signaling pathway and signaling receptor complex?
- question: Does the IL1RAP TIR domain, which carries the PROSITE-predicted catalytic glutamate, have
    any NAD+ hydrolase activity, or is the EC 3.2.2.6 assignment a rule artefact for IL-1 receptor family
    TIR domains?
- question: Which GOA source produced the NAS annotations from PMID:23847621 to monocyte differentiation
    and negative regulation of IL-1alpha/IL-1beta production, which in that review describe IL1R2 rather
    than IL1RAP?
- question: 'GO practice for the qualifier on receptor-activity terms of non-ligand-selecting co-receptor
    chains is mixed: IL1RAP and IL18RAP carry `enables` IL-1/IL-33/IL-18 receptor activity, whereas IL2RG,
    CSF2RB and IL6ST mostly carry `contributes_to` for the ligand-specific receptor activities. Should
    IL-1 family accessory chains use `contributes_to` for the receptor activity and `enables` only for
    coreceptor activity?'
suggested_experiments:
- description: Assay purified IL1RAP TIR domain (wild type and catalytic-glutamate mutant), alongside
    SARM1 TIR as positive control, for NAD+ cleavage and cyclic ADP-ribose formation, with and without
    induced TIR oligomerisation.
- description: Test whether human IL1RAP or its AcPb isoform drives PTPRD-dependent synapse formation
    in human iPSC-derived neurons (co-culture synaptogenesis assay with IL1RAP knockout and rescue).
