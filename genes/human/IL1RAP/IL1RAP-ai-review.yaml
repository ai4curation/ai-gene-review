id: Q9NPH3
gene_symbol: IL1RAP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IL1RAP (IL-1 receptor accessory protein, IL-1R3, IL-1RAcP) is a type I transmembrane protein
  of the IL-1 receptor family with three extracellular Ig-like domains and a cytoplasmic TIR domain. It
  does not bind cytokine on its own; instead it is recruited by a cytokine-bound primary receptor and
  supplies the second TIR domain of the signalling heterodimer. It is the shared co-receptor for IL-1alpha/IL-1beta
  (with IL1R1), IL-33 (with IL1RL1/ST2) and IL-36alpha/beta/gamma (with IL1RL2). Ligand-induced juxtaposition
  of the two receptor TIR domains recruits MYD88 and TOLLIP-IRAK complexes, nucleating the Myddosome that
  drives NF-kappaB and MAPK activation and inflammatory gene expression. IL1RAP also joins IL-1-bound
  IL1R2 in a non-signalling decoy complex, and a secreted splice isoform raises the affinity of soluble
  IL1R2 for IL-1, aiding IL-1 neutralisation. In neurons (shown in mouse), IL1RAP and its AcPb isoform
  act as a trans-synaptic adhesion partner of presynaptic PTPRD that promotes synapse formation.
