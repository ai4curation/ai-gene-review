        by down-regulation of expression, whereas it stimulated the expression of IL-1RI, AcP and the
        adapter protein MyD88
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: OTHER
      slot: DB_Object_ID
      requested_change: DELETE_ROW
      asserted_value: UniProtKB:Q9NPH3
      cause: OTHER
      confidence: PROBABLE
      explanation: ComplexPortal (assigned_by ComplexPortal, ECO:0005547 inferred from complex membership;
        SourceResourceEnum has no ComplexPortal value) propagates monocyte differentiation to IL1RAP from
        a complex record citing PMID:23847621. That review links monocyte differentiation to increased
        expression of the decoy receptor IL1R2 and says only that LPS induces IL1RAP expression in monocytes;
        IL1RAP does not take part in monocyte differentiation.
