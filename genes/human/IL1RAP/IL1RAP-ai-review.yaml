  sequence_note: VSP_008050, VSP_008051
- name: 3 (Soluble IL-1RAcP-beta, sIL-1RAcP-beta)
  id: Q9NPH3-3
  sequence_note: VSP_008052
- name: 4 (AcPb, mIL-1RAcP687)
  id: Q9NPH3-5
  sequence_note: VSP_041256
functional_isoforms:
- id: IL1RAP_MEMBRANE
  name: membrane-bound IL-1RAcP (mIL-1RAcP and neuronal AcPb)
  type: SPLICE_CLASS
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q9NPH3-1
    - Q9NPH3-5
  description: Transmembrane forms. Isoform 1 is the signalling co-receptor that is recruited by cytokine-bound
    IL1R1, IL1RL1 or IL1RL2 and supplies the second TIR domain of the receptor heterodimer; it carries
    the core coreceptor and IL-1/IL-33/IL-36 signalling functions of the gene. The AcPb isoform (Q9NPH3-5)
    has a distinct C-terminus and, in mouse neurons, acts with isoform 1 as a trans-synaptic partner of
    PTPRD.
  isoform_specific_terms:
  - id: GO:0015026
    label: coreceptor activity
  - id: GO:0070498
    label: interleukin-1-mediated signaling pathway
- id: IL1RAP_SOLUBLE
  name: soluble IL-1RAcP (sIL-1RAcP)
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q9NPH3-2
  description: Secreted isoform lacking the transmembrane and TIR regions. It associates with secreted
    ligand-bound IL1R2 and raises its affinity for IL-1 by about two orders of magnitude, making soluble
    IL1R2 a potent IL-1 inhibitor (PMID:23847621; UniProt isoform 2 FUNCTION, PubMed:12530978). It therefore
    acts opposite to the membrane isoform, and it is the basis for keeping negative regulation of interleukin-1-mediated
    signaling pathway (GO:2000660) on this gene. Isoform 3 (sIL-1RAcP-beta, Q9NPH3-3) is also secreted
    but has no characterised function.
  isoform_specific_terms:
  - id: GO:2000660
    label: negative regulation of interleukin-1-mediated signaling pathway
existing_annotations:
- term:
    id: GO:0002114
    label: interleukin-33 receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q61730
  - ensembl:ENSMUSP00000023156
  review:
    summary: Ensembl Compara transfer from mouse Il1rap of interleukin-33 receptor activity. IL1RAP is
      the signalling co-receptor that joins IL-33-bound ST2 (IL1RL1) to form the IL-33 receptor.
    action: ACCEPT
    reason: 'IL1RAP does not bind IL-33 on its own, but it is the second, TIR-bearing chain of the heterodimeric
      IL-33 receptor and is required for IL-33 signalling (PMID:17675517); coreceptor activity (GO:0015026,
      IDA row) is the more exact MF. The transfer is sound. On the qualifier: IL1RAP does not bind cytokine
      alone, but in the ternary complex it contacts both the ligand and the primary chain (PMID:22426547),
      so it is part of the ligand-receptor interface. A comparator check of QuickGO (2026-11-06) shows
      that GO''s practice is mixed. Within the IL-1 receptor family the non-ligand-selecting accessory
      chain IL18RAP carries `enables` interleukin-18 receptor activity by both IBA and IDA (PMID:25500532),
      as IL1RAP does here; the ligand-binding chains IL1RL1 and IL1RL2 also carry `enables`. The class
      I cytokine shared chains IL2RG, CSF2RB and IL6ST mostly carry `contributes_to` for the ligand-specific
      receptor activities (IL2RG for IL-2/IL-4/IL-7, CSF2RB for IL-3/IL-5, IL6ST for IL-6/IL-11/LIF/oncostatin-M),
      but also `enables` on some (IL2RG IL-15, IL6ST oncostatin-M, CNTF and IL-27 receptor activity).
      Because the IL-1 family convention, including the PAINT node for this family, is `enables` for the
      accessory chain, the row is accepted as it stands and no qualifier defect is recorded; coreceptor
      activity (GO:0015026) is used as the core MF, and the qualifier convention is raised in suggested_questions.'
    supported_by:
    - reference_id: PMID:17675517
      supporting_text: IL-33 and ST2 form a complex with IL-1R accessory protein (IL-1RAcP), a signaling
        receptor subunit that is also a member of the IL-1R complex
    - reference_id: file:human/IL1RAP/IL1RAP-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Coreceptor for IL1RL1 in the IL-33 signaling system.
    - reference_id: PMID:22426547
      supporting_text: The rotation of the third immunoglobulin domain in IL-1RAcP is necessary for it
        to touch the composite face of IL-1RI and IL-1β
