      is consistent with human experimental data; GO:0015026 coreceptor activity (IDA) describes the accessory
      role more precisely and both are kept. On the qualifier: IL1RAP does not bind cytokine alone, but
      in the ternary complex it contacts both the ligand and the primary chain (PMID:22426547), so it
      is part of the ligand-receptor interface. A comparator check of QuickGO (2026-11-06) shows that
      GO''s practice is mixed. Within the IL-1 receptor family the non-ligand-selecting accessory chain
      IL18RAP carries `enables` interleukin-18 receptor activity by both IBA and IDA (PMID:25500532),
      as IL1RAP does here; the ligand-binding chains IL1RL1 and IL1RL2 also carry `enables`. The class
      I cytokine shared chains IL2RG, CSF2RB and IL6ST mostly carry `contributes_to` for the ligand-specific
      receptor activities (IL2RG for IL-2/IL-4/IL-7, CSF2RB for IL-3/IL-5, IL6ST for IL-6/IL-11/LIF/oncostatin-M),
      but also `enables` on some (IL2RG IL-15, IL6ST oncostatin-M, CNTF and IL-27 receptor activity).
      Because the IL-1 family convention, including the PAINT node for this family, is `enables` for the
      accessory chain, the row is accepted as it stands and no qualifier defect is recorded; coreceptor
      activity (GO:0015026) is used as the core MF, and the qualifier convention is raised in suggested_questions.'
    supported_by:
    - reference_id: PMID:9065432
      supporting_text: These results proved that IL-1RAcP is an indispensible molecule in the IL-1 receptor
        signal transduction complex, necessary to link events on the plasma membrane level to downstream
        signaling pathways
    - reference_id: PMID:22426547
      supporting_text: Here we present the crystal structure of IL-1β bound to its primary receptor IL-1RI
        and its receptor accessory protein IL-1RAcP
    - reference_id: PMID:22426547
      supporting_text: The rotation of the third immunoglobulin domain in IL-1RAcP is necessary for it
        to touch the composite face of IL-1RI and IL-1β
