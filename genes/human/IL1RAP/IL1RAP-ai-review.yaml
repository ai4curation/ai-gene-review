    reason: The full text of PMID:23847621 discusses regulation of IL1R2 expression during monocyte activation
      and differentiation; it makes no statement that IL1RAP takes part in monocyte differentiation. The
      only nearby statement about IL1RAP is that LPS stimulates its expression in monocytes. No other
