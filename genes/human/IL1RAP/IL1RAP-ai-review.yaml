- term:
    id: GO:0061809
    label: NAD+ nucleosidase activity, cyclic ADP-ribose generating
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:3.2.2.6
  review:
    summary: EC-number mapping (EC 3.2.2.6) to NAD+ nucleosidase activity, cyclic ADP-ribose generating.
    action: MARK_AS_OVER_ANNOTATED
    reason: The EC number and the active site in UniProt come only from the PROSITE TIR-domain rule (ECO:0000255),
      which assigns NADase chemistry to every TIR domain. NADase activity is established for SARM1 and
      plant and bacterial TIR proteins, but no IL-1 receptor family TIR domain has been shown to hydrolyse
      NAD+; in IL1RAP the TIR domain acts as a scaffold that recruits MYD88 and TOLLIP. The cyclic ADP-ribose-generating
      subtype is a further unsupported refinement. Retaining it as a predicted capability only.
    supported_by:
    - reference_id: file:human/IL1RAP/IL1RAP-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Signaling involves the recruitment of adapter molecules such as TOLLIP, MYD88,
        and IRAK1 or IRAK2 via the respective TIR domains of the receptor/coreceptor subunits.
