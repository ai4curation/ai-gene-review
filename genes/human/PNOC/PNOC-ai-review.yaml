- id: PMID:10419552
  title: Agonistic effect of buprenorphine in a nociceptin/OFQ receptor-triggered reporter gene assay.
  findings:
  - statement: N/OFQ inhibits cAMP-driven reporter expression through ORL1 at subnanomolar potency.
    supporting_text: N/OFQ and N/OFQ(1-13)NH(2) inhibited the forskolin-induced luciferase gene expression with
      IC(50) values of 0.81 +/- 0.5 and 0.87 +/- 0.16 nM, respectively.
- id: PMID:9521323
  title: Nocistatin, a peptide that blocks nociceptin action in pain transmission.
  findings:
  - statement: Nocistatin, from the same precursor, blocks nociceptin-induced allodynia and does not bind NOP.
    supporting_text: Although nocistatin does not bind to the nociceptin receptor, it binds to the membrane of mouse
      brain and of spinal cord with high affinity.
