- term:
    id: GO:0001515
    label: opioid peptide activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:104629
  - PANTHER:PTN000153716
  - RGD:68946
  - UniProtKB:P01211
  review:
    summary: Family-level PAINT propagation of opioid peptide activity to prepronociceptin.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0001515 is defined as a peptide with an opiate-like effect reversible by naloxone or another morphine
      antagonist. Nociceptin acts through OPRL1 (NOP), its action is not affected by opioid ligands, and it does
      not activate the classical opioid receptors (PMID:7481766); behaviourally it is hyperalgesic and anti-analgesic
      rather than opiate-like (PMID:7566152, Reactome:R-HSA-374723). The PAINT node PTN000153716 correctly groups
      PNOC with PENK and PDYN, but PNOC has diverged from the defining opioid property. The ligand activity itself
      is captured by neuropeptide hormone activity. Not REMOVE because the minor precursor peptide orphanin FQ2
      is reported analgesic (rat ortholog evidence) and its pharmacology was not assessed here.
    supported_by:
    - reference_id: PMID:7481766
      supporting_text: This inhibitory activity was not affected by the addition of opioid ligands, nor did the
        peptide activate opioid receptors.
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN000153716
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Opioid peptide activity holds for the proenkephalin and prodynorphin descendants that seed the
          node; the prepronociceptin clade (PTHR11438:SF2) encodes the naloxone-insensitive NOP agonist nociceptin.
- term:
    id: GO:0005184
    label: neuropeptide hormone activity
  evidence_type: TAS
  original_reference_id: PMID:10419552
  qualifier: enables
  review:
    summary: 'Core molecular function: nociceptin is a CNS neuropeptide acting as the NOP receptor agonist.'
    action: ACCEPT
    reason: Nociceptin/orphanin FQ is the endogenous ligand of ORL1/NOP and potently inhibits forskolin-driven cAMP
      signalling through it at subnanomolar concentrations (PMID:10419552, PMID:7566152). It is made predominantly
      in brain and spinal cord (PMID:8710928). Neuropeptide hormone activity is a child of neuropeptide activity
      and hormone activity, both under receptor ligand activity (GO:0048018).
    supported_by:
    - reference_id: PMID:10419552
      supporting_text: N/OFQ and N/OFQ(1-13)NH(2) inhibited the forskolin-induced luciferase gene expression with
        IC(50) values of 0.81 +/- 0.5 and 0.87 +/- 0.16 nM, respectively.
    - reference_id: PMID:7566152
      supporting_text: Taken together, these data indicate that the newly discovered heptadecapeptide is an endogenous
        agonist of the ORL1 receptor and that it may be endowed with pro-nociceptive properties.
