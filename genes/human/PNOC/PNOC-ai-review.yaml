        mimicked by the specific NociR synthetic agonist, Ro 64-6198.
    - reference_id: PMID:7481766
      supporting_text: Nanomolar concentrations of orphanin FQ inhibited forskolin-stimulated adenylyl cyclase activity
        in cells transfected with LC132.
    - reference_id: PMID:7566152
      supporting_text: The synthetic heptadecapeptide potently inhibits adenylate cyclase in CHO(ORL1+) cells in
        culture and induces hyperalgesia when administered intracerebroventricularly to mice.
