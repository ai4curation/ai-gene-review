suggested_questions:
- question: GO:0001515 opioid peptide activity is defined by naloxone-reversible opiate-like effect, yet GO classes
    the nociceptin receptor as an opioid receptor; should the PTHR11438 PAINT node be scoped so that the prepronociceptin
    clade receives neuropeptide (hormone) activity rather than opioid peptide activity?
- question: Is the analgesic activity reported for orphanin FQ2 mediated by classical opioid receptors, NOP, or
    another receptor?
suggested_experiments:
- hypothesis: Nocistatin acts through a specific membrane receptor distinct from NOP.
  description: Use photo-crosslinkable nocistatin analogues on spinal cord membranes followed by mass spectrometry
    to identify the nocistatin binding protein, then test its knockout on nocistatin's anti-allodynic effect.
  experiment_type: Affinity crosslinking proteomics and genetic validation
