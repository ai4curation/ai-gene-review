      supporting_text: Taken together, these data indicate that the newly discovered heptadecapeptide is an endogenous
        agonist of the ORL1 receptor and that it may be endowed with pro-nociceptive properties.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN000153716
        source_status: SUPPORTS_TRANSFER
        comment: Receptor engagement is shared by all PTHR11438 descendants and PNOC sits inside the node; the issue
          is the binding term, which the project convention replaces by the ligand-activity term.
