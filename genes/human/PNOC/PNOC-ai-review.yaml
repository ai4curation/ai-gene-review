  title: The Ligand:GPCR:Gi complex dissociates
  findings: []
- id: Reactome:R-HSA-749456
  title: Liganded Gi-activating GPCRs bind inactive heterotrimeric G-protein Gi
  findings: []
- id: PMID:7481766
  title: 'Orphanin FQ: a neuropeptide that activates an opioidlike G protein-coupled receptor.'
  findings:
  - statement: Orphanin FQ inhibits adenylyl cyclase through the orphan opioid-like receptor LC132 (OPRL1).
    supporting_text: Nanomolar concentrations of orphanin FQ inhibited forskolin-stimulated adenylyl cyclase activity
      in cells transfected with LC132.
  - statement: Orphanin FQ action is insensitive to opioid ligands and it does not activate opioid receptors.
    supporting_text: This inhibitory activity was not affected by the addition of opioid ligands, nor did the peptide
      activate opioid receptors.
- id: PMID:7566152
  title: Isolation and structure of the endogenous agonist of opioid receptor-like ORL1 receptor.
  findings:
  - statement: Nociceptin is the endogenous agonist of ORL1 and is pro-nociceptive in vivo.
    supporting_text: Taken together, these data indicate that the newly discovered heptadecapeptide is an endogenous
      agonist of the ORL1 receptor and that it may be endowed with pro-nociceptive properties.
- id: PMID:8710928
  title: Structure, tissue distribution, and chromosomal localization of the prepronociceptin gene.
  findings:
  - statement: Human PNOC gene cloned; expressed predominantly in brain and spinal cord.
    supporting_text: Nociceptin is derived from a larger precursor, prepronociceptin (PPNOC), whose human, mouse,
      and rat genes we have now isolated.
- id: PMID:12950177
  title: 'Human neutrophils as a source of nociceptin: a novel link between pain and inflammation.'
  findings:
  - statement: Human neutrophils secrete nociceptin, which lowers neutrophil cAMP via NociR.
    supporting_text: nociceptin prevented intracellular accumulation of cAMP in fMLP-stimulated PMNs, an effect
      mimicked by the specific NociR synthetic agonist, Ro 64-6198.
- id: PMID:10468628
  title: Targeted disruption of the orphanin FQ/nociceptin gene increases stress susceptibility and impairs stress
    adaptation in mice.
  findings:
  - statement: Pnoc-null mice show increased anxiety, impaired stress adaptation and elevated basal pain threshold.
    supporting_text: OFQ/N-null mice show elevated basal pain threshold but develop normal stress-induced analgesia.
