  review:
    summary: Nociceptin binds the NOP receptor (classed by GO as an opioid receptor); per project convention this
      is ligand activity.
    action: MODIFY
    reason: Nociceptin is the endogenous agonist of OPRL1/NOP (PMID:7566152), which GO places under opioid receptors,
      so opioid receptor binding is true. Following the LIGANDS_IN_SIGNALING decision that ligands are annotated
      to receptor ligand activity or a child rather than receptor-specific binding terms, this is MODIFIED to neuropeptide
      hormone activity (GO:0005184), the ligand-activity term accepted on the TAS row. Lateral correction, not a
      descendant.
