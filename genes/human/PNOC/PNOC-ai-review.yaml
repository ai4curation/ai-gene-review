  review:
    summary: Nociceptin activates NOP to inhibit adenylate cyclase and lower cAMP, shown in human neutrophils.
    action: NEW
    reason: Nociceptin prevents cAMP accumulation in human neutrophils, mimicked by the selective NOP agonist Ro
      64-6198 (PMID:12950177); the peptide inhibits forskolin-stimulated adenylate cyclase in cells expressing ORL1
      (PMID:7566152, PMID:7481766). The ligand initiates the pathway (project ligand convention); the comparator
      ligands PENK and PDYN carry the same term, and the opioid module already lists PNOC on this step.
    supported_by:
