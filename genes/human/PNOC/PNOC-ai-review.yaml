id: Q13519
gene_symbol: PNOC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PNOC encodes prepronociceptin, a 176-residue neuropeptide precursor of the opioid neuropeptide precursor
  family (with proenkephalin and prodynorphin) that is expressed mainly in neurons of the brain and spinal cord
  and also in neutrophils. Processing at paired basic residues releases nociceptin (orphanin FQ, FGGFTGARKSARKLANQ),
  nocistatin and orphanin FQ2. Secreted nociceptin is the endogenous agonist of the nociceptin/orphanin FQ receptor
  OPRL1 (NOP), a Gi/o-coupled receptor of the opioid receptor family; it inhibits adenylate cyclase and modulates
  ion channels and transmitter release, but unlike classical opioid peptides its actions are not reversed by naloxone
  and it does not activate mu, delta or kappa receptors. Through NOP, nociceptin modulates pain processing (pro-nociceptive
  and anti-opioid in the brain), locomotion, anxiety, stress adaptation and reward. Nocistatin, from the same precursor,
  opposes nociceptin's pain-promoting effects through an unidentified binding site.
