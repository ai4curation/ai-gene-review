  label: Homo sapiens
description: ORAI3 encodes a four-pass plasma-membrane ORAI channel paralog. It forms STIM1-gated
  store-operated CRAC channels and ORAI1-ORAI3 heteromers, including store-independent arachidonate-regulated
  channels, and contributes strong calcium-dependent inactivation to receptor-evoked calcium
  signaling.
