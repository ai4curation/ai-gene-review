id: P15309
gene_symbol: ACP3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACP3 encodes prostatic acid phosphatase, a secreted and type I transmembrane histidine acid
  phosphatase. The secreted PAP isoform is abundant in seminal plasma and hydrolyzes phosphomonoesters
  including lysophosphatidic acid, whereas the transmembrane isoform is expressed in dorsal
  root ganglion neurons where it functions as an ecto-5-prime-nucleotidase that generates
  adenosine and suppresses pain signaling; cellular PAP can also dephosphorylate ERBB2 in
  prostate cells.
