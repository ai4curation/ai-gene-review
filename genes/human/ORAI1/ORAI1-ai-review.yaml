  - WB:WBGene00015648
  review:
    summary: Accept store-operated calcium entry as the core ORAI channel process.
    action: ACCEPT
    reason: ORAI1 is a STIM-gated ORAI pore subunit that conducts calcium into the cytosol
      after endoplasmic-reticulum calcium-store depletion; PAINT places the SOCE IBD on PTN001267146,
      there are no PAINT losses on the human ORAI1 lineage, and direct ORAI-family studies
      support the three human paralogs.
    supported_by:
    - &id001
      reference_id: PMID:16921383
      supporting_text: These changes in ion selectivity provide strong evidence that Orai1
        is a pore subunit of the CRAC channel
    - &id002
      reference_id: PMID:19182790
      supporting_text: All Orai channels are fully activated by the conserved STIM1 amino
        acid fragment 344-442
    - &id003
      reference_id: file:human/ORAI1/ORAI1-uniprot.txt
      supporting_text: Assembles with ORAI2 and ORAI3 to form hexameric CRAC channels that
        mediate Ca(2+) influx upon depletion
