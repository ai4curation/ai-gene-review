core_functions:
- description: ORAI1 forms the pore of plasma-membrane CRAC channels, conducting extracellular
    calcium into the cytosol after ER store depletion and STIM activation.
  molecular_function:
    id: GO:0015279
    label: store-operated calcium channel activity
  locations:
