id: Q96D31
gene_symbol: ORAI1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ORAI1 encodes the best-characterized pore-forming subunit of calcium release-activated
  calcium (CRAC) channels. It is a four-pass plasma-membrane channel protein that forms
  homomers and heteromers with ORAI2 and ORAI3 subunits in store-operated channels opened
  by STIM proteins after endoplasmic-reticulum calcium depletion; ORAI1 also contributes
  to arachidonate-regulated, store-independent ORAI1-ORAI3 channels and to localized calcium
  signals that couple to NFAT and adenylyl cyclase signaling.
alternative_products:
