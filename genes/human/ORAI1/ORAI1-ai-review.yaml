    label: store-operated calcium entry
  supported_by: *id006
suggested_questions:
- question: How do native ORAI homo- and heteromeric stoichiometries vary across cell types
    and activation regimes?
suggested_experiments:
- description: Use endogenous tagging plus single-molecule or cryo-EM-informed stoichiometry
    assays to quantify ORAI1/2/3 subunit composition in receptor-activated native CRAC channels.
