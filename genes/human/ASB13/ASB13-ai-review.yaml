- id: PMID:32943576
  title: ASB13 inhibits breast cancer metastasis through promoting SNAI2 degradation and relieving its
    transcriptional repression of YAP.
  findings:
  - statement: ASB13 ubiquitinates SNAI2 for degradation.
    supporting_text: We performed a dual-luciferase-based, genome-wide E3 ligase siRNA library screen
      and identified ASB13 as an E3 ubiquitin ligase that targets SNAI2 for ubiquitination and degradation.
  - statement: The SOCS box is required for SNAI2 ubiquitination.
    supporting_text: A significant increase of polyubiquitinated SNAI2 protein was observed in ASB13-transfected
      cells, whereas the SOCS domain (ElonginB/C–Culin5–SOCS complex formation, interacting domain for
      E3 complex formation) deletion mutant of ASB13 (ASB13-ΔSOCS) was not able to promote SNAI2 ubiquitination
      (Fig.
  - statement: ANK3-6 mediate SNAI2 binding.
    supporting_text: Deletion of either ANK3-4 or ANK5-6 almost completely diminished ASB13's interaction
      with SNAI2 (Supplemental Fig.
  - statement: ASB13 is in the nucleus and cytoplasm.
    supporting_text: Interestingly, in SUM159 cells stably expressing HA-ASB13, immunofluorescent staining
      demonstrated that ASB13 was localized in both nucleus and cytoplasm (Supplemental Fig.
  - statement: ASB13 loss lowers YAP through SNAI2.
    supporting_text: Furthermore, ASB13 knockout decreased YAP expression, and such regulation is dependent
      on an increased protein level of SNAI2, which in turn represses YAP transcription.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; human breast cancer and HEK293T cells. The only mechanistic study of ASB13.
