id: Q8WXK3
gene_symbol: ASB13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASB13 is an ankyrin repeat and SOCS box protein of the ASB family, whose members serve as
  substrate receptors of Elongin B/C-Cullin 5 E3 ubiquitin ligases. ASB13 binds the transcription factor
  SNAI2 (Slug) through its ankyrin repeats and promotes SNAI2 polyubiquitination and proteasomal degradation,
  which requires its SOCS box. It is found in the nucleus and cytoplasm. In breast cancer cells, ASB13
  loss stabilizes SNAI2, lowers YAP expression and increases migration, while its overexpression suppresses
  lung metastasis.
