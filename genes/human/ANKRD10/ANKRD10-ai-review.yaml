suggested_questions:
- question: Is ANKRD10-2 a general transcription co-regulator? Its binary partners are rich in homeodomain
    and zinc-finger transcription factors, and one study reports MYC co-activation.
suggested_experiments:
- description: Validate the isoform-2 interactions with transcription factors (e.g. TLX3, PITX1) by co-immunoprecipitation,
    and test whether ANKRD10-2 changes their target-gene expression, alongside MYC targets, after isoform-specific
    knockdown.
