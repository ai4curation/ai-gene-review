description: ANKRD10 (ankyrin repeat domain-containing 10) is an uncharacterized ankyrin-repeat protein,
  detected in the nucleoplasm. In bladder cancer cells, the splicing regulator RBPMS controls the balance
  of ANKRD10 isoforms, and the ANKRD10-2 isoform is reported to act as a transcriptional co-activator
  of MYC. Its normal function is unknown.
