knowledge_gaps:
- gap_statement: ANKRD10's molecular activity and normal biological role are unknown.
  boundary: 'Reported: a nucleoplasmic location (HPA), one cancer-cell study of isoform ANKRD10-2 co-activating
    MYC, and a binary interaction map in which isoform 2 binds 17 partners, nine of them sequence-specific
    DNA-binding transcription factors (e.g. TLX3, PITX1, PITX2, OTX1, ZIC1). None of these interactions
    has been tested functionally. PAN-GO assigns no annotations, and although PANTHER PTHR24201 has six
    PAINT-annotated nodes, ANKRD10 receives no IBA from any of them.'
