core_functions:
- description: 'DNA break-activated NAD+ poly-ADP-ribosyltransferase: PARP1 binds DNA strand breaks, becomes
    catalytically activated, and synthesises poly(ADP-ribose) on itself and chromatin proteins, recruiting
    XRCC1 and other factors to repair single-strand breaks/BER intermediates and double-strand breaks;
    automodification then releases PARP1 from DNA.'
  molecular_function:
    id: GO:0003950
    label: NAD+ poly-ADP-ribosyltransferase activity
  directly_involved_in:
  - id: GO:0000012
    label: single strand break repair
  - id: GO:0006302
    label: double-strand break repair
  - id: GO:0006974
    label: DNA damage response
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0090734
    label: site of DNA damage
  supported_by:
  - reference_id: PMID:19764761
    supporting_text: Stimulated by binding to nicked DNA, PARP-1 catalyzes poly(ADP-ribosyl)ation of the
      acceptor proteins and itself using NAD(+) as a substrate.
  - reference_id: PMID:7852410
    supporting_text: Glu988 of the human polymerase aligns with the catalytic glutamic acid of the toxins,
      and replacement of this residue with Gln, Asp, or Ala caused major reductions in synthesis of enzyme-linked
      poly-ADP-ribose.
  - reference_id: PMID:22683995
    supporting_text: Poly(ADP-ribose) polymerase 1 (PARP1) is a primary DNA damage sensor whose (ADP-ribose)
      polymerase activity is acutely regulated by interaction with DNA breaks.
  - reference_id: PMID:34102106
    supporting_text: Consequently, PARP1 deletion rescues BER and resistance to base damage in XRCC1-/-
      cells.
- description: 'HPF1-dependent serine ADP-ribosylation: in complex with HPF1, PARP1 modifies serine residues
    of histones (H2B Ser6, H3 Ser10) and of itself, the predominant DNA damage-induced ADP-ribosylation,
    which recruits chromatin remodelers such as ALC1.'
  molecular_function:
    id: GO:0140805
    label: NAD+-protein-serine ADP-ribosyltransferase activity
  directly_involved_in:
  - id: GO:0006974
    label: DNA damage response
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:28190768
    supporting_text: Moreover, adding HPF1 to in vitro PARP-1/PARP-2 reactions is necessary and sufficient
      for serine-specific ADPr of histones and PARP-1 itself.
  - reference_id: PMID:32028527
    supporting_text: These post-translational modifications are predominantly serine-linked and require
      the accessory factor HPF1, which is specific for the DNA damage response and switches the amino
      acid specificity of PARP1 and PARP2 from aspartate or glutamate to serine residues5-10.
  - reference_id: PMID:33589610
    supporting_text: Serine is the major residue for ADP-ribosylation upon DNA damage, which strictly
      depends on HPF1.
  - reference_id: PMID:34874266
    supporting_text: Serine ADP-ribosylation (ADPr) is a DNA damage-induced post-translational modification
      catalyzed by the PARP1/2:HPF1 complex.
- description: 'DNA strand-break sensing: N-terminal zinc fingers bind and kink single-strand break DNA
    and drive stepwise assembly of the remaining domains, coupling break recognition to catalytic activation.'
  molecular_function:
    id: GO:1990165
    label: single-strand break-containing DNA binding
  directly_involved_in:
  - id: GO:0000012
    label: single strand break repair
  locations:
  - id: GO:0090734
    label: site of DNA damage
  supported_by:
  - reference_id: PMID:36323657
    supporting_text: Quantitative smFRET and structural ensemble calculations reveal how PARP-1's N-terminal
      zinc fingers convert DNA SSBs from a largely unperturbed conformation, via an intermediate state
      into the highly kinked DNA conformation.
  - reference_id: PMID:26626479
    supporting_text: Two flexibly linked N-terminal zinc fingers recognize the extreme deformability of
      SSBs and drive co-operative, stepwise self-assembly of remaining PARP-1 domains to control the activity
      of the C-terminal catalytic domain.
- description: 'Nucleosome binding and chromatin modulation: PARP1 binds nucleosomes specifically and
    promotes compact chromatin, modulated by NAD+-dependent automodification.'
  molecular_function:
    id: GO:0031491
    label: nucleosome binding
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:15607977
    supporting_text: PARP-1 binds in a specific manner to nucleosomes and modulates chromatin structure
      through NAD+-dependent automodification, without modifying core histones or promoting the disassembly
      of nucleosomes.
  - reference_id: PMID:15607977
    supporting_text: Herein, we describe previously uncharacterized nucleosome binding properties of PARP-1
      that promote the formation of compact, transcriptionally repressed chromatin structures.
- description: 'Parthanatos: under severe genotoxic stress, hyperactivated PARP1 synthesises PAR that
    acts as the death signal, binding AIF and triggering its mitochondrial release and caspase-independent
    cell death; AIF release and chromatinolysis are performed by AIFM1 and MIF.'
  molecular_function:
    id: GO:0003950
    label: NAD+ poly-ADP-ribosyltransferase activity
  directly_involved_in:
  - id: GO:0060545
    label: positive regulation of necroptotic process
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:12114629
    supporting_text: We show that PARP-1 activation is required for translocation of apoptosis-inducing
      factor (AIF) from the mitochondria to the nucleus and that AIF is necessary for PARP-1-dependent
      cell death.
  - reference_id: PMID:17116882
    supporting_text: Here, we identify poly(ADP-ribose) (PAR) polymer, a product of PARP-1 activity, as
      a previously uncharacterized cell death signal.
  - reference_id: PMID:21467298
    supporting_text: We show that AIF is a high-affinity poly(ADP-ribose) (PAR)-binding protein and that
      PAR binding to AIF is required for parthanatos both in vitro and in vivo.
proposed_new_terms: []
suggested_questions:
- question: How should parthanatos be represented in GO, given that there is no dedicated term and PARP1/AIFM1
    are currently annotated to positive regulation of necroptotic process?
  experts:
  - GO cell death curators
  - parthanatos researchers
- question: What fraction of PARP1 catalytic output in human cells is HPF1-dependent serine mono-ADP-ribosylation
    versus Asp/Glu-linked poly-ADP-ribosylation, and should both be considered core?
  experts:
  - ADP-ribosylation biochemists
- question: Is the reported intra-mitochondrial PARP1 pool physiologically relevant, given conflicting
    reports on mitochondrial PARylation and mtDNA repair?
  experts:
  - mitochondrial DNA repair experts
- question: Should DNA end ADP-ribosylation (GO:0140294) by PARP1 be considered physiological in human
    cells?
  experts:
  - DNA repair biochemists
suggested_experiments:
- description: Quantify serine versus Asp/Glu ADP-ribosylation and chain length on endogenous PARP1 substrates
    in HPF1-knockout and catalytic-mutant (E988Q) knock-in human cells after defined DNA lesions.
  hypothesis: HPF1-dependent serine mono-ADP-ribosylation is the dominant PARP1 output for DNA repair
    signalling, while Asp/Glu PAR mainly mediates PARP1 release and parthanatos signalling.
  experiment_type: quantitative ADP-ribosylome mass spectrometry
- description: Use mitochondria-targeted versus nuclear-restricted PARP1 rescue constructs in PARP1-null
    cells and measure mtDNA repair, mitochondrial PARylation and parthanatos sensitivity.
  hypothesis: Nuclear PAR synthesis, not an intra-mitochondrial PARP1 pool, accounts for PARP1 effects
    on mitochondria and AIF release.
  experiment_type: compartment-restricted rescue
