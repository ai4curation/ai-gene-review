id: P09874
gene_symbol: PARP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PARP1 (poly[ADP-ribose] polymerase 1, ARTD1) is an abundant ~113 kDa nuclear enzyme that
  acts as a primary sensor of DNA strand breaks. Its N-terminal zinc fingers (Zn1, Zn2) and Zn3 recognise
  single- and double-strand breaks and drive a cooperative domain assembly that relieves autoinhibition
  of the C-terminal catalytic domain (helical subdomain plus ART fold with catalytic Glu988). Activated
  PARP1 uses NAD+ to transfer ADP-ribose to itself (mainly within its BRCT-containing automodification
  domain) and to histones and other chromatin proteins, and elongates and branches poly(ADP-ribose) (PAR)
  chains. Alone it modifies aspartate and glutamate residues; with its accessory factor HPF1, which completes
  a shared active site, it modifies serine residues (e.g. histone H2B Ser6 and H3 Ser10), the predominant
  DNA damage-induced mark. PAR recruits repair and chromatin factors such as XRCC1 and ALC1, promoting
  single-strand break and base excision repair, double-strand break repair and replication-fork responses,
  while automodification releases PARP1 from DNA; PARP inhibitors trap PARP1 on DNA. PARP1 also binds
  nucleosomes and modulates chromatin structure and transcription (e.g. NELF and P-TEFb regulation), and
  cytoplasmic PARP1 can ADP-ribosylate cGAS to restrain innate immune signalling. Excessive activation
  depletes NAD+ and ATP and generates PAR that triggers AIF (AIFM1) release and caspase-independent cell
  death (parthanatos). During apoptosis PARP1 is cleaved by caspases-3/7 at Asp214.
