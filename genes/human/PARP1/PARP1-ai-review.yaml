    label: damaged DNA binding
  evidence_type: IDA
  original_reference_id: PMID:22683995
  qualifier: enables
  review:
    summary: PARP1 zinc fingers recognise damaged DNA (single- and double-strand breaks and other lesions),
      which activates its catalytic domain.
    action: ACCEPT
    reason: Damaged-DNA binding is the sensor half of PARP1 core function, demonstrated with purified
      protein and structural/biophysical studies of break recognition.
    supported_by:
    - reference_id: PMID:22683995
      supporting_text: Poly(ADP-ribose) polymerase 1 (PARP1) is a primary DNA damage sensor whose (ADP-ribose)
        polymerase activity is acutely regulated by interaction with DNA breaks.
    - reference_id: PMID:22683995
      supporting_text: Upon activation at sites of DNA damage, PARP1 modifies itself and other proteins
        by covalent addition of long, branched polymers of ADP-ribose, which in turn recruit downstream
        DNA repair and chromatin remodeling factors.
    - reference_id: PMID:26626479
      supporting_text: Poly(ADP-ribose)polymerase 1 (PARP-1) is a key eukaryotic stress sensor that responds
        in seconds to DNA single-strand breaks (SSBs), the most frequent genomic damage.
