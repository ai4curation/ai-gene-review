- term:
    id: GO:0000012
    label: single strand break repair
  evidence_type: IDA
  original_reference_id: PMID:34102106
  qualifier: involved_in
  review:
    summary: PARP1 senses single-strand breaks and synthesises PAR that recruits XRCC1 and other repair
      factors, accelerating single-strand break repair; it must then be released from DNA.
    action: ACCEPT
    reason: Core process. PARP1 directly performs the sensing and signalling step of SSB repair (binding
      breaks and catalysing PAR synthesis that recruits XRCC1).
    supported_by:
    - reference_id: PMID:34102106
      supporting_text: PARPs are sensors that detect single-strand break intermediates, but the critical
        role of XRCC1 during BER is unknown.
    - reference_id: PMID:34102106
      supporting_text: Consequently, PARP1 deletion rescues BER and resistance to base damage in XRCC1-/-
        cells.
    - reference_id: PMID:36323657
      supporting_text: Quantitative smFRET and structural ensemble calculations reveal how PARP-1's N-terminal
        zinc fingers convert DNA SSBs from a largely unperturbed conformation, via an intermediate state
        into the highly kinked DNA conformation.
