- term:
    id: GO:0006629
    label: lipid metabolic process
  evidence_type: TAS
  original_reference_id: PMID:8093033
  qualifier: involved_in
  review:
    summary: >-
      True but uninformative. Lipid metabolic process is a high-level parent that is correct for
      any apolipoprotein; the specific process this protein participates in is captured by the
      cholesterol metabolic process rows and by the regulation term proposed on the GO:0006869
      row.
    action: KEEP_AS_NON_CORE
    reason: >-
      There is nothing wrong with this annotation - apoF is unambiguously a participant in lipid
      metabolism - but it sits far above the level at which this protein's biology is
      understood, and the paper it is attributed to is a purification and cloning study whose
      lipid content is the observation that the protein was obtained from HDL. Retained for
      completeness and marked non-core, since the core statements about this gene are the
      LDL-selective inhibition of CETP-mediated transfer and the cholesterol metabolism it
      controls, both of which are recorded on other rows at a useful granularity.
    supported_by:
    - reference_id: PMID:8093033
      supporting_text: Apolipoprotein F, with an apparent molecular mass of 29 kilodaltons, was 
        purified from human high density lipoproteins using a modified two dimensional 
        electrophoresis procedure.
- term:
    id: GO:0006869
    label: lipid transport
  evidence_type: TAS
  original_reference_id: PMID:6816269
  qualifier: involved_in
  review:
    summary: >-
      Apolipoprotein F is a regulator of inter-lipoprotein lipid movement, not an agent of it. It
      inhibits the transfer protein that performs the movement, so the process term should be a
      negative regulation term. This row is where the protein's defining activity belongs, and
      at present it says the opposite.
    action: MODIFY
    reason: >-
      GO:0006869 asserts that the gene product effects the directed movement of lipids. What
      apoF does is reduce that movement: it is the lipid transfer inhibitor protein, it equally
      inhibits CE and TG transfer by CETP, and in vivo knockdown in a CETP-expressing species
      increases CETP-mediated cholesteryl ester transfer from HDL to LDL up to two-fold and
      raises LDL cholesterol by 40%. GO already carries the mirror image of this annotation on
      the target enzyme: CETP holds GO:0032376 positive regulation of cholesterol transport by
      IDA. The matching negative term, GO:0032375 negative regulation of cholesterol transport,
      is the correct replacement. Its parent GO:0032369 negative regulation of lipid transport is
      also true, because the inhibition extends to triglyceride and phospholipid transfer, but
      the cholesterol child is both more informative and the better evidenced. One caveat is
      recorded rather than hidden: the inhibition is not uniform in sign across all lipoprotein
      pairs - transfer from VLDL to HDL3 is stimulated - so the protein is better described as
      retargeting CETP than as switching it off. The net effect on cholesterol movement in plasma
      and in vivo is nonetheless inhibitory, which is what the replacement term asserts.
    proposed_replacement_terms:
    - id: GO:0032375
      label: negative regulation of cholesterol transport
    supported_by:
    - reference_id: PMID:32520778
      supporting_text: We identified a novel, acidic protein called lipid transfer inhibitor protein
        (LTIP) (9) that equally inhibits the transfer of both CE and TG by CETP.
    - reference_id: PMID:31511396
      supporting_text: ApoF knockdown in fat-fed male hamsters created a phenotype in which 
        endogenous CETP-mediated CE transfer from HDL to LDL increased up to 2-fold, LDL cholesterol
        increased 40%, HDL declined 25%, LDL and HDL lipid compositions were altered, and hepatic 
        LDLR gene expression was decreased.
    - reference_id: PMID:12907677
      supporting_text: In contrast, VLDL to HDL3 transfer was stimulated, resulting in a CETP 
        preference for HDL3 that was 3-fold greater than that for LDL or HDL2.
    additional_reference_ids:
    - PMID:9880564
    - PMID:8071606
- term:
    id: GO:0008203
    label: cholesterol metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:104539
  - PANTHER:PTN002687490
  review:
    summary: >-
      Correct inference at the right level of generality. The IBD at PTN002687490 (taxon:117571,
      Euteleostomi) is seeded by mouse Apof, whose own GO:0008203 is an IMP from the knockout:
      female null mice accumulate hepatic cholesteryl ester. Human APOF sits inside the clade and
      has independent, direct evidence for a role in cholesterol metabolism.
    action: ACCEPT
    reason: >-
      There is one gene donor on this row, MGI:MGI:104539, which resolves through the UniProt
      cross-reference search to Swiss-Prot Q91V80 APOF_MOUSE (two hits; the second, A0A0R4J0M4,
      is TrEMBL), so the singular "the IBD seed" is accurate here. Two features of the transfer
      are worth stating explicitly rather than objecting to. First, the seed phenotype is
      CETP-independent, because mice carry no CETP gene at all, and sex-specific; the human
      function is CETP-dependent. Second, the node spans Euteleostomi, which contains both
      CETP-less rodents and CETP-bearing fish and primates, so a broad cholesterol-metabolism
      term is the correct least-common-denominator call across the clade rather than an
      under-call. This is not a granularity mismatch: with a single gene donor there is no donor
      agreement to appeal to, and no more specific term is true of the whole clade. Independently
      of the mouse, human apoF controls the CETP-mediated redistribution of cholesteryl ester
      among plasma lipoproteins, which is cholesterol metabolism by any reading of the term
      definition. Core.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      residue_claims_not_applicable: >-
        The argument turns on whether the human protein is inside the clade that inherited a role
        in cholesterol metabolism and on the presence or absence of CETP in each lineage, not on
        retention of any particular residue. There is no structure of apolipoprotein F and no
