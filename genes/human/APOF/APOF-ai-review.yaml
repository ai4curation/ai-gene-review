- term:
    id: GO:0034364
    label: high-density lipoprotein particle
  evidence_type: IDA
  original_reference_id: PMID:18369235
  review:
    summary: >-
      Most of the apolipoprotein F in normolipidaemic plasma is not on LDL at all but in a
      roughly 470 kDa, apolipoprotein A-I-containing particle of HDL density in which it is
      inactive. This is the pool the 1978, 1982, 1989 and 1994 isolations were working with, and
      it is not recorded anywhere in the current annotation.
    action: NEW
    reason: >-
      The HDL assignment is not an obsolete claim superseded by the LDL one; the two coexist and
      differ in activity. He et al. resolved the second apoF peak as a particle of density
      1.134 g/ml containing apolipoprotein A-I along with apoC-II, apoD, apoE, apoJ and
      paraoxonase 1, which places it squarely inside the GO:0034364 definition (density
      1.063-1.21 g/ml, contains APOAs, may contain APOCs and APOE), and showed that it does not
      inhibit CETP. Independent antibody-based fractionation of human lipoproteins put more than
      90% of apoF on HDL3, and the earliest activity measurements put around 85% of functional
