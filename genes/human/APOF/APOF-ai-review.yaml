id: Q13790
gene_symbol: APOF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Apolipoprotein F is a liver-specific, secreted plasma glycoprotein that governs where
  cholesteryl ester goes once cholesteryl ester transfer protein (CETP) has removed it from
  HDL. It is translated as a 326-residue precursor whose C-terminal 162 residues are released
  by proprotein-convertase cleavage after Arg-164 and secreted as the mature, N- and
  O-glycosylated protein; the mature chain is strongly acidic while the propeptide it is cut
  from is basic, and the protein shares no sequence or architectural relationship with the
  amphipathic-helix apolipoproteins of the APOA, APOC and APOE families. In plasma it occupies
  two pools. Most of the protein rides in a roughly 470 kDa, apolipoprotein A-I-containing
  particle of HDL density in which it is inactive; a minority binds LDL, and only this
  LDL-bound form inhibits CETP. Binding to LDL, and therefore activation, is set by LDL
  particle size and surface lipid packing, so the active fraction rises in hypercholesterolaemia
  and falls in hypertriglyceridaemia. The inhibition is selective rather than global: transfers
  involving LDL are suppressed most, transfers between VLDL and HDL least, and transfer from
  VLDL to HDL3 is stimulated, so the protein retargets CETP rather than switching it off. It
  achieves this by occupying and altering the lipoprotein surface on which CETP must dock, not
  by binding CETP, so it changes which particles take part in lipid transfer without changing
  what CETP does to them. The net consequence in an animal that expresses CETP is to limit the
  movement of HDL-derived cholesteryl ester into LDL; loss of the protein raises LDL cholesterol
  and lowers HDL cholesterol. Orthologues occur throughout bony vertebrates, including rodents
  that have no CETP at all, so at least one further, CETP-independent role is expected and has
  not yet been identified.
existing_annotations:
- term:
    id: GO:0005102
    label: signaling receptor binding
  evidence_type: TAS
  original_reference_id: PMID:8093033
  qualifier: enables
  review:
    summary: >-
      No interaction between apolipoprotein F and any receptor has ever been reported, and the
      cited paper contains no receptor experiment. This is a legacy ProtInc statement-level
      annotation dated 2003 whose source is a 1994 purification and cDNA cloning study.
    action: REMOVE
    reason: >-
      GO:0005102 is defined as "Binding to one or more specific sites on a receptor molecule, a
      macromolecule that undergoes combination with a hormone, neurotransmitter, drug or
      intracellular messenger to initiate a change in cell function", i.e. a signalling receptor.
      Day et al. purified apoF from HDL, cloned its cDNA, ran a Northern blot and mapped the gene
      to chromosome 12; there is no receptor binding assay, no candidate receptor, and no
      signalling readout in the paper. Nor is any such interaction reported in the three decades
      of literature since: the 2020 expert review of this protein describes its mechanism as
      acting on the lipoprotein surface and states that much of it remains undetermined, and
      names no receptor. Even on the most charitable reading of what ProtInc may have intended -
      a lipoprotein receptor rather than a signalling receptor - the appropriate term would be
      GO:0070325 lipoprotein particle receptor binding, which is equally unsupported. The
      molecular interaction this protein actually makes is with the LDL particle surface, which
      is captured by the GO:0030169 row added in this review.
    supported_by:
    - reference_id: PMID:8093033
      supporting_text: Apolipoprotein F, with an apparent molecular mass of 29 kilodaltons, was 
        purified from human high density lipoproteins using a modified two dimensional 
        electrophoresis procedure.
    - reference_id: PMID:32520778
      supporting_text: While much remains to be determined about the mechanism of LTIP's action, the
        data suggest LTIP blocks CETP activity by disrupting and/or preventing the binding of CETP 
        to the lipoprotein surface
    additional_reference_ids:
    - PMID:32520778
- term:
    id: GO:0005319
    label: lipid carrier activity
  evidence_type: TAS
  original_reference_id: PMID:6816269
  qualifier: enables
  review:
    summary: >-
      The essence is right - this protein's molecular function is exercised on lipid moving
      between lipoproteins - but the polarity is inverted. GO:0005319 is the parent class of the
      lipid transfer activity that CETP has and that apolipoprotein F exists to suppress. The
      demonstrated molecular activity is binding the LDL particle.
    action: MODIFY
    reason: >-
      GO:0005319 is defined as "Directly binding to a specific lipid and delivering it either to
      an acceptor molecule or to a specific location", and the QuickGO ancestor list for
      GO:0120013 lipid transfer activity contains GO:0005319, so lipid carrier activity is the
      superclass of the transfer branch that holds GO:0120020 cholesterol transfer activity -
      CETP's own IDA-supported molecular function. Assigning it to apoF gives the inhibitor the
      parent class of its target's activity. No study has shown apoF binding a lipid and
      delivering it to an acceptor. The cited 1982 paper did not test this either: it isolated
      three apoF-containing particles by immunosorption and determined their lipid composition by
      thin-layer chromatography, concluding with an explicit suggestion about the particles, not
      the protein. What has been measured, repeatedly and in human plasma, is that apoF binds
      LDL, and that this binding is what the inhibitory activity requires. GO:0030169 low-density
      lipoprotein particle binding is the molecular function supported by the evidence.
    proposed_replacement_terms:
    - id: GO:0030169
      label: low-density lipoprotein particle binding
    supported_by:
    - reference_id: PMID:6816269
      supporting_text: It is suggested that ApoF-containing lipoproteins may be involved in 
        transport and/or esterification of cholesterol.
    - reference_id: PMID:6816269
      supporting_text: Their lipid composition was determined by thin-layer chromatography.
    - reference_id: PMID:35016907
      supporting_text: Apolipoprotein F (ApoF) modulates lipoprotein metabolism by selectively 
        inhibiting cholesteryl ester transfer protein activity on LDL. This ApoF activity requires 
        that it is bound to LDL.
    additional_reference_ids:
    - PMID:35016907
    - PMID:9880564
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:28514442
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8N4A0
  review:
    summary: >-
      A BioPlex 2.0 affinity-purification hit with GALNT4, a Golgi polypeptide
      N-acetylgalactosaminyltransferase. ApoF is an O-GalNAc glycoprotein that transits the Golgi
      en route to secretion, so this reads as an enzyme-substrate encounter rather than a binding
      activity of apoF, and the bare term carries no functional information either way.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The partner UniProtKB:Q8N4A0 is GALNT4, polypeptide N-acetylgalactosaminyltransferase 4
      (EC 2.4.1.41), a Golgi apparatus membrane enzyme that catalyses the initial transfer of
      GalNAc to serine or threonine in O-linked glycan biosynthesis. ApoF carries an
      experimentally mapped O-GalNAc glycan at Thr-274, and its secreted form is maturely
      glycosylated, so the two proteins are expected to meet in the Golgi lumen with apoF as
      substrate. A post-translational modification a protein receives is not a binding activity
      it has, and a substrate is not the agent. The reference is also a whole-proteome
      projection: counted by full pagination of QuickGO, PMID:28514442 supplies 3731 GO
      annotations across 2324 distinct gene products, all to GO:0005515. There has been no
      functional follow-up on an apoF-GALNT4 pair, so there is no informative molecular function
      to modify to; the row is left in place but flagged. Note that UniProt records NbExp=2 for
      this pair, which is the same interaction seen in two BioPlex releases, not two independent
      studies.
    supported_by:
    - reference_id: PMID:28514442
      supporting_text: Here we present BioPlex 2.0 (Biophysical Interactions of ORFeome-derived 
        complexes), which uses robust affinity purification-mass spectrometry methodology to 
        elucidate protein interaction networks and co-complexes nucleated by more than 25% of 
        protein-coding genes from the human genome
    - reference_id: PMID:19008531
      supporting_text: Apo F in the media was PNGase F-sensitive but Endo H-resistant, indicating 
        that the secreted forms of Apo F are maturely glycosylated
    additional_reference_ids:
    - PMID:19008531
