- term:
    id: GO:0034362
    label: low-density lipoprotein particle
  evidence_type: IDA
  original_reference_id: PMID:9880564
  review:
    summary: >-
      The active pool of apolipoprotein F is a component of LDL. This is where the protein
      exercises its function, and no current row records it; the five GO:0005576 rows only state
      that the protein is outside the cell.
    action: NEW
    reason: >-
      Wang et al. purified LTIP from ultracentrifugally isolated LDL that had been further
      cleared of apoE and apoA-I on affinity columns, sequenced it, and found it to be apoF; they
      reported the protein associated almost exclusively with LDL, matching the distribution of
      the inhibitory activity. Later work by the same group resolved the apparent conflict with
      the earlier HDL literature into two pools and established that only the LDL-associated pool
      is active. Gel filtration independently localises one of the two apoF peaks to LDL. The
      term is a descendant of GO:0005576 and of GO:0032991, and records component membership of
      the particle rather than a location in the loose sense.
    supported_by:
