- term:
    id: GO:0008203
    label: cholesterol metabolic process
  evidence_type: TAS
  original_reference_id: PMID:6816269
  qualifier: involved_in
  review:
    summary: >-
      The cited statement is a 1982 suggestion about the apoF-containing particles rather than a
      demonstration about the protein, but the conclusion it reaches is right and is now
      supported by much stronger evidence. Accepted as core.
    action: ACCEPT
    reason: >-
      Koren et al. isolated three apoF-containing lipoprotein species and found cholesteryl ester
      and free cholesterol to be their predominant lipids, and closed with a suggestion that such
      particles may function in cholesterol transport or esterification. On its own that is a
      statement-level inference about particles. It is nevertheless the correct conclusion: apoF
      is now known to set how much HDL-derived cholesteryl ester reaches LDL, in vitro, in human
      plasma and in a CETP-expressing animal model. Cholesterol metabolic process is the right
      process term and this is a core role of the gene, so the row is accepted, with the weakness
      of its own evidence recorded here rather than used as grounds to remove a correct
      annotation.
    supported_by:
    - reference_id: PMID:6816269
      supporting_text: It is suggested that ApoF-containing lipoproteins may be involved in 
