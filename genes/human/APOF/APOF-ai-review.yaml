      supporting_text: In contrast to that previously reported, apoF was shown to be associated 
        almost exclusively with LDL, identical to the distribution of LTIP activity.
    - reference_id: PMID:18369235
      supporting_text: Plasma fractionated by gel filtration chromatography revealed two LTIP 
        protein peaks, one coeluting with LDL, and another of approximately 470 kDa.
    - reference_id: PMID:32520778
