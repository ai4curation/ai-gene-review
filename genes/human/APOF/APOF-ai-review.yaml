- term:
    id: GO:0015485
    label: cholesterol binding
  evidence_type: TAS
  original_reference_id: PMID:6816269
  qualifier: enables
  review:
    summary: >-
      No assay of apolipoprotein F binding cholesterol has ever been performed. The cited paper
      measured the lipid composition of apoF-containing particles by thin-layer chromatography,
      which reports what the particle contains, not what the protein binds.
    action: REMOVE
    reason: >-
      Three independent arguments converge. First, the evidence: Koren et al. determined particle
      lipid composition by TLC, finding cholesteryl ester and free cholesterol to predominate;
      no binding measurement of any kind appears in the paper, and the annotation converts a
      property of the particle into a property of one of its passengers. Second, what has actually
      been measured about apoF binding points elsewhere - the determinant of apoF association with
      LDL is particle size and surface lipid packing, not cholesterol content, with LDL size the
      only correlate of binding capacity found in a systematic survey. Third, the protein lacks
      the structural feature that mediates lipid binding in the apolipoproteins that do have it:
      apoF is predicted to lack strong amphipathic alpha helices, and the sequence analysis in
      this review quantifies that, giving 7.6% strongly amphipathic 18-residue windows for mature
      apoF against 21.3-49.2% for APOA1, APOA2, APOE and APOC3. For contrast, GO:0015485 is
      carried correctly elsewhere in this same pathway: CETP holds it by IDA from a direct assay.
      The molecular binding activity that apoF does have is to the LDL particle, which the new
      GO:0030169 row records.
