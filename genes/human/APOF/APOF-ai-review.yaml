core_functions:
- description: >-
    LDL-bound, substrate-directed inhibition of CETP-mediated lipid transfer. Apolipoprotein F
    binds the surface of the LDL particle, and only the LDL-bound form is active; binding is
    governed by LDL particle size and surface lipid packing rather than by the particle's
    cholesterol content. The bound protein reduces the participation of that particle in
    cholesteryl ester and triglyceride transfer reactions mediated by CETP, without altering
    what CETP does to the particles it can still act on and without binding CETP itself. The
    consequence is a redistribution rather than a blockade: transfers involving LDL are
    suppressed most, VLDL-to-HDL3 transfer is stimulated, and less HDL-derived cholesteryl ester
    reaches the LDL compartment. In an animal expressing CETP, removing the protein raises LDL
    cholesterol and lowers HDL cholesterol.
  molecular_function:
    id: GO:0030169
    label: low-density lipoprotein particle binding
  directly_involved_in:
  - id: GO:0032375
    label: negative regulation of cholesterol transport
  - id: GO:0008203
    label: cholesterol metabolic process
  locations:
  - id: GO:0005576
    label: extracellular region
  in_complex:
    id: GO:0034362
    label: low-density lipoprotein particle
  supported_by:
  - reference_id: PMID:35016907
    supporting_text: Apolipoprotein F (ApoF) modulates lipoprotein metabolism by selectively 
      inhibiting cholesteryl ester transfer protein activity on LDL. This ApoF activity requires 
      that it is bound to LDL.
  - reference_id: PMID:10073979
    supporting_text: LTIP had no effect on the selection of CE or TG by CETP or its mechanism of 
      action.
  - reference_id: PMID:32520778
    supporting_text: We hypothesize that LTIP binds to the surface of lipoproteins and modifies this
      molecular organization.
  - reference_id: PMID:8071606
    supporting_text: Inhibition followed the order of very low density lipoprotein (VLDL)-low 
      density lipoprotein (LDL) transfers > LDL-high density lipoprotein (HDL) transfers > VLDL-HDL 
      transfers.
  - reference_id: PMID:31511396
    supporting_text: These in vivo data validate in vitro findings that ApoF regulates lipid 
      transfer to LDL.
proposed_new_terms:
- proposed_name: regulation of low-density lipoprotein particle remodeling
  proposed_definition: Any process that modulates the frequency, rate or extent of low-density 
    lipoprotein particle remodeling.
  justification: >-
    GO carries remodeling terms for all four plasma lipoprotein classes (GO:0034372 VLDL,
    GO:0034373 IDL, GO:0034374 LDL, GO:0034375 HDL) but regulation children for only one of them,
    VLDL (GO:0010901 regulation, GO:0010902 positive regulation, GO:0010903 negative regulation).
    The definition of GO:0034374 names the very reaction apolipoprotein F regulates - "the
    transfer of cholesterol esters from LDL to a triglyceride-rich lipoprotein particle by
    cholesteryl ester transfer protein (CETP)" - so the process is in GO but its regulation is
    not, for the one particle class where this gene acts. Apolipoprotein F is the paradigm gene
    for the missing term and currently has to be annotated to the coarser GO:0032375 negative
    regulation of cholesterol transport, which loses the particle specificity that is the whole
    point of this protein. A matching regulation branch under GO:0034375 high-density lipoprotein
    particle remodeling is needed for the same reason, since the same protein stimulates
    VLDL-to-HDL3 transfer.
  proposed_parent:
    id: GO:0034374
    label: low-density lipoprotein particle remodeling
  supported_by:
  - reference_id: PMID:12907677
    supporting_text: these results show that LTIP tailors CETP-mediated remodeling of HDL3 and HDL2 
      particles in subclass-specific ways
  - reference_id: PMID:8071606
    supporting_text: Thus, LTIP alters the pattern of lipid transfer reactions in plasma by uniquely
      affecting the individual transfer events mediated by LTP.
- proposed_name: lipid transfer inhibitor activity by lipoprotein surface modification
  proposed_definition: Binding to a lipid particle and thereby stopping, preventing or reducing the 
    transfer of lipid to or from that particle by a lipid transfer protein, without binding the 
    lipid transfer protein itself.
  justification: >-
    GO's molecular-function-regulator branch assumes the regulator binds its target: GO:0098772
    is defined as regulating "the activity of its target via non-covalent binding", and its
    descendant GO:0141110 transporter inhibitor activity as "Binds to and stops, prevents, or
    reduces the activity of a transporter". Apolipoprotein F reduces CETP's transfer activity
    without binding CETP; it binds the lipoprotein particle that CETP must dock on and alters
    that surface. No GO term expresses substrate-directed inhibition of a transfer reaction, so
    the best available molecular function for this protein is the plain binding term GO:0030169,
    which records the interaction but not the consequence. Applying GO:0141110 or GO:0004857
    instead would assert a protein-protein interaction that has never been demonstrated, or a
    catalytic activity that CETP does not have. The proposal is deliberately phrased around what
    is established; the physical mechanism by which the bound protein alters the surface is still
    unknown.
  proposed_parent:
    id: GO:0098772
    label: molecular function regulator activity
  supported_by:
  - reference_id: PMID:32520778
    supporting_text: While much remains to be determined about the mechanism of LTIP's action, the 
      data suggest LTIP blocks CETP activity by disrupting and/or preventing the binding of CETP to 
      the lipoprotein surface
  - reference_id: PMID:10073979
    supporting_text: LTIP had no effect on the selection of CE or TG by CETP or its mechanism of 
      action.
knowledge_gaps:
- gap_statement: >-
    How apolipoprotein F, once bound to LDL, prevents CETP from acting on that particle is
    unknown at the molecular level. There is no structure of apolipoprotein F, no mapped
    LDL-binding surface, no mapped inhibitory determinant, and no demonstration that the two
    proteins ever touch.
  boundary: >-
    Firmly established: the protein binds LDL; binding is required for inhibition; binding
    capacity tracks LDL particle size and surface lipid packing and not cholesterol content;
    inhibition is selective among lipoprotein pairs; and the inhibitor does not change CETP's
    choice of lipid or its exchange mechanism. Equally firmly established: binding and inhibition
    are separable, since oleate abolishes activity without reducing binding. What is missing is
    everything between binding and inhibition.
  gap_kind:
  - BIOLOGY
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    This is the mechanism that makes the protein interesting as a therapeutic model. Global
    pharmacological CETP inhibition has repeatedly failed in clinical trials, whereas this
    protein inhibits CETP only where LDL is involved, which is the selectivity those drugs
    lacked. Reproducing that selectivity requires knowing how it is achieved. It is also the
    reason no molecular function term fits: the inhibition is directed at the substrate particle,
    and GO's regulator terms all require the regulator to bind the target.
  resolution: >-
    A structure of apolipoprotein F, alone or on a reconstituted LDL-like particle, and a direct
    test for a CETP-apoF interaction by a method that would detect a transient one. Failing
    those, mapping the LDL-binding region by truncation or chimaera with the mouse orthologue,
    which is only about 60% identical, and asking whether CETP binding to LDL is reduced in the
    presence of apoF under conditions where transfer is abolished.
  provenance:
  - reference_id: PMID:32520778
    supporting_text: While much remains to be determined about the mechanism of LTIP's action, the 
      data suggest LTIP blocks CETP activity by disrupting and/or preventing the binding of CETP to 
      the lipoprotein surface
  - reference_id: PMID:12951364
    supporting_text: LTIP binding to LDL was not decreased by oleate.
  - reference_id: PMID:10073979
    supporting_text: LTIP had no effect on the selection of CE or TG by CETP or its mechanism of 
      action.
- gap_statement: >-
    What apolipoprotein F does in species that have no CETP is unknown, and since the family is
    conserved across bony vertebrates while CETP is absent from mice and rats and defective in
    several other mammals, there is probably a second function that no one has identified.
  boundary: >-
    Firmly established: apolipoprotein F orthologues are present in mammals and fish, including
    rodents with no CETP gene; mouse knockouts are viable and fertile with essentially normal
    plasma lipids, HDL size and HDL composition; the one reproducible lipid phenotype is a
    female-specific increase in hepatic cholesteryl ester; and the mouse orthologue's molecular
    function is formally recorded in GO as unknown (GO:0003674 ND). What is missing is any
    positive account of the CETP-independent activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    The entire GO record for this gene, including the phylogenetic inference that spans
    Euteleostomi, rests on a CETP-dependent function in the species that have CETP and on a
    single sex-specific hepatic lipid phenotype in a species that does not. If the ancestral
    function is something else, the family-level inference is describing a consequence rather
    than the conserved activity.
  resolution: >-
    Characterisation of the mouse or zebrafish protein on its own terms rather than as a CETP
    inhibitor: what it binds in a CETP-free plasma, and what changes in the knockout beyond
    hepatic cholesteryl ester. The existing knockout line is not ideal for this, since its
    non-lipid phenotypes were traced to hypomorphic expression of Stat2, a gene 425 base pairs
    downstream, so an independently derived allele would be needed.
  provenance:
  - reference_id: PMID:22363685
    supporting_text: This lack of a consistent requirement for plasma CE transfer activity across 
      species suggests that ApoF has been conserved throughout evolution for a purpose distinct from
      CETP inhibition.
  - reference_id: PMID:22363685
    supporting_text: In contrast to other apolipoproteins, ApoF is predicted to lack strong 
      amphipathic alpha helices and its true physiological function remains unknown.
  - reference_id: PMID:24529150
    supporting_text: These effects were attributable to hypomorphic expression of Stat2 in the ApoF 
      KO mice, a critical gene in the Type I IFN pathway that is situated just 425 base pairs 
      downstream of ApoF.
  - reference_id: PMID:35735979
    supporting_text: These data reveal a previously undescribed role for ApoF in the control of 
      plasma and hepatic lipoprotein metabolism by favoring VLDL-TG secretion and hepatic 
      lipoprotein remnant particle clearance.
- gap_statement: >-
    Why most of the plasma pool sits inactive in a 470 kDa apolipoprotein A-I-containing particle,
    what holds it there, and whether that pool has a function of its own rather than being a
    reservoir, are all unresolved.
  boundary: >-
    Firmly established: two pools exist; the LDL-bound one is active and the 470 kDa one is not;
    more than 85% of the protein is in the inactive pool in normolipidaemic plasma and about 50%
    in hypercholesterolaemia; redistribution between pools happens on incubation of plasma at
    37 degrees and requires LCAT or CETP activity; and the trigger is modification of LDL, not
    release from the complex. What is missing is the composition and organisation of the complex
    at a level that would explain why the protein is inactive in it.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Activity of this protein is regulated by partition between two particles rather than by
    abundance, so plasma concentration is a poor guide to function; this is directly relevant to
    its use as a biomarker, where total protein is what gets measured. It also means the two
    cellular component annotations added in this review describe states with opposite functional
    consequences.
  resolution: >-
    Reconstitution: rebuild the 470 kDa particle from defined components and ask which of them
    suppresses activity, and determine whether the suppression is steric occlusion of the
    CETP-relevant surface or a conformational change in apolipoprotein F.
  provenance:
  - reference_id: PMID:18369235
    supporting_text: Unlike LDL-associated LTIP, the 470 kDa LTIP complex does not inhibit CETP 
      activity.
  - reference_id: PMID:32520778
    supporting_text: In normolipidemic plasma, more than 85% of ApoF is contained in the inactive 
      complex (40).
  - reference_id: PMID:21937674
    supporting_text: We conclude that LTIP translocation is dependent on LDL lipid composition, not 
      on its release from the inactive complex.
- gap_statement: >-
    Whether apolipoprotein F associates with VLDL at all is unsettled, and the disagreement is
    between a direct negative result and a secondary report of a weak positive.
  boundary: >-
    Firmly established: the protein is on LDL and on an HDL-density particle. Direct antibody
    fractionation of human lipoproteins detected none on VLDL. A later lipoproteomic survey,
    cited only at second hand in the 2020 review, reports VLDL-associated apolipoprotein F at
    5-fold lower abundance than on LDL. UniProt's FUNCTION line states that the protein also
    associates to a lesser degree with VLDL, citing PMID:9880564, whose abstract does not mention
    VLDL.
  gap_kind:
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    VLDL is the acceptor to which apolipoprotein F redirects HDL-derived cholesteryl ester, so
    whether the protein is physically present on that acceptor bears on whether it acts only from
    the LDL side. No GO:0034361 very-low-density lipoprotein particle annotation is proposed in
    this review for exactly this reason.
  resolution: >-
    A direct, quantitative measurement of apolipoprotein F on VLDL in human plasma by the same
    ELISA used for the LDL-bound pool, reported alongside the LDL and HDL pools rather than
    inferred from proteomic detection.
  provenance:
  - reference_id: PMID:32520778
    supporting_text: Although ApoF was not detected on VLDL in that study, a recent lipoproteomic 
      analysis showed that ApoF in VLDL is 5-fold lower that than associated with LDL (39).
  - reference_id: PMID:19008531
    supporting_text: Apo F was not detected on VLDL or HDL2.
- gap_statement: >-
    The direction in which apolipoprotein F affects reverse cholesterol transport is not a fixed
    property of the protein: knockdown impairs it on one diet and enhances it on another, and no
    account of the switch exists.
  boundary: >-
    Firmly established: in fat-fed hamsters, knockdown impairs the excretion of HDL-derived
    cholesteryl ester into faeces; in chow-fed hamsters, the same knockdown increases sterol
    excretion. Both results are from the same study and the same genetic background.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    This is why no reverse cholesterol transport term appears in this review. A process whose
    sign inverts with diet cannot be annotated with a positive- or negative-regulation term, and
    the unsigned parent would assert only that the protein is somehow involved. It also bears
    directly on whether raising apolipoprotein F would be beneficial, which is the translational
    question the field is asking.
  resolution: >-
    Identify the diet-dependent variable. The candidates are LDL abundance, LDL composition and
    hence the active fraction of the protein, and hepatic LDL receptor expression, all of which
    change with fat feeding; a knockdown series across a graded fat load, with the LDL-bound
    fraction measured in each arm, would separate them.
  provenance:
  - reference_id: PMID:31511396
    supporting_text: Notably, ApoF knockdown impaired HDL RCT in fat-fed hamsters but increased 
      sterol excretion in chow-fed animals.
  - reference_id: PMID:32520778
    supporting_text: Conversely, ApoF knockdown in chow-fed animals increased reverse cholesterol 
      transport.
- gap_statement: >-
    The post-translational maturation of this precursor is only partly captured and its
    functional consequences are untested: the N-glycosylation sites of the mature circulating
    protein are absent from UniProt, the one site UniProt does annotate lies inside the propeptide
    and cannot be on the mature protein, and nothing is known about what either the propeptide
    cleavage or the glycans contribute beyond allowing secretion.
  boundary: >-
    Firmly established: the precursor contains exactly three N-X-S/T sequons, at Asn-118,
    Asn-139 and Asn-267; the first two are inside the propeptide and the third is the only one in
    the mature chain; mutagenesis shows the proprotein is glycosylated at Asn-118 and Asn-139 and
    the mature form variably at Asn-267; mutating Arg-164 abolishes maturation, and the
    proprotein convertase PC7 processes apolipoprotein F; the mature chain also carries an
    O-GalNAc glycan at Thr-274; and glycosylation accounts for the gap between the 17.4 kDa
    polypeptide mass and the 29-33 kDa apparent mass. UniProt Q13790 annotates only Asn-118, by
    sequence-analysis prediction, and Thr-274.
  gap_kind:
  - CURATION
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    The glycans are most of the mass of the mature protein and are responsible for its strongly
    acidic character, which is the property that named it. Whether they participate in LDL
    binding or in partition between the active and inactive pools is unknown, and the
    under-annotation means the question is invisible to anyone reading the feature table.
  resolution: >-
    Curation: add Asn-267 and Asn-139 to the Q13790 feature table with the mutagenesis evidence,
    and mark Asn-118 as propeptide-resident. Biology: compare LDL binding and CETP inhibition of
    the Asn-267 mutant, which is already constructed, against wild type.
  provenance:
  - reference_id: PMID:19008531
    supporting_text: Two of these sites are in the proprotein (N118 and N139), and one lies in the 
      mature peptide (N267).
  - reference_id: PMID:19008531
    supporting_text: The mature form of Apo F appears to be variably glycosylated at N267, as 
      mutation of this residue abolished the upper band of the doublet in the media
  - reference_id: PMID:25349778
    supporting_text: Our present results show that PC7 and PC7-R504H exhibit similar processing of 
      transferrin receptor-1, proSortilin, and apolipoprotein-F.
  - reference_id: file:human/APOF/APOF-bioinformatics/RESULTS.md
    supporting_text: UniProt's glycosylation feature table for Q13790 annotates one predicted site 
      that cannot be on the mature protein, and omits the two sites with experimental support on it.
suggested_questions:
- question: >-
    Does apolipoprotein F ever contact CETP directly, even transiently, or is the inhibition
    entirely substrate-directed? Every published statement of the mechanism is framed as an
    effect on the lipoprotein surface, and the answer decides whether any existing GO molecular
    function regulator term can be applied to this protein.
  experts:
  - Richard E. Morton
  - Yan Liu
- question: >-
    What holds apolipoprotein F inactive in the 470 kDa apolipoprotein A-I-containing particle?
    Is it steric occlusion of the same surface that engages LDL, or a conformational state of the
    protein?
  experts:
  - Richard E. Morton
  - Diane J. Greene
- question: >-
    What is the function of apolipoprotein F in mice and rats, which have no CETP? The
    phylogenetic inference behind both of this gene's IBA annotations is seeded at a node
    spanning bony vertebrates, most of which cannot be using the protein as a CETP inhibitor.
  experts:
  - William R. Lagor
  - Daniel J. Rader
- question: >-
    Is the Asn-267 glycan of the mature protein required for LDL binding or for partition between
    the active and inactive pools? The mutant was made and shown to lose the upper band of the
    secreted doublet, but its lipoprotein behaviour was not reported.
  experts:
  - William R. Lagor
suggested_experiments:
- hypothesis: >-
    Apolipoprotein F inhibits CETP without binding it, by altering the LDL surface that CETP must
    engage.
  description: >-
    Measure CETP association with LDL directly, by surface plasmon resonance or by
    ultracentrifugal re-isolation of labelled CETP, in the presence and absence of saturating
    apolipoprotein F on the same LDL preparation, under conditions where lipid transfer is
    abolished. In parallel, test for a direct apoF-CETP interaction with a method sensitive to
    transient complexes, such as crosslinking mass spectrometry or microscale thermophoresis with
    purified components in the absence of lipoprotein. A reduction in CETP-LDL association
    without any detectable apoF-CETP complex would establish the substrate-directed mechanism and
    justify the new molecular function term proposed here.
  experiment_type: binding and transfer assay with purified components
- hypothesis: >-
    The LDL-binding determinant of apolipoprotein F lies in a discrete region of the mature chain
    and is separable from whatever confers inhibition.
  description: >-
    Build chimaeras between human apolipoprotein F and the mouse orthologue, which is about 60%
    identical over the precursor and functions in an animal with no CETP, and between human
    apolipoprotein F and progressive N- and C-terminal truncations of the mature chain. Express
    each in a mammalian secretory line, recover the conditioned medium, and assay LDL binding by
    ELISA and CETP inhibition in the LDL-only transfer assay. Constructs that bind LDL but do not
    inhibit would separate the two activities and locate the inhibitory determinant.
  experiment_type: chimaera and truncation mutagenesis with functional assay
- hypothesis: >-
    The 470 kDa particle inactivates apolipoprotein F by occluding its LDL-binding surface rather
    than by changing its conformation.
  description: >-
    Reconstitute the inactive complex from defined components - apolipoprotein A-I, phospholipid,
    cholesterol and recombinant apolipoprotein F - and test each component for its ability to
    suppress CETP inhibition. Compare the hydrogen-deuterium exchange profile of apolipoprotein F
    in the reconstituted complex, free, and bound to LDL. Regions protected in both the complex
    and on LDL would indicate a shared binding surface and competition; regions that change only
    in the complex would indicate a conformational mechanism.
  experiment_type: reconstitution with hydrogen-deuterium exchange mass spectrometry
- hypothesis: >-
    Apolipoprotein F has a CETP-independent function that a clean mouse knockout would reveal.
  description: >-
    Generate an Apof null allele by CRISPR that leaves the Stat2 promoter region intact, since the
    existing line is confounded by hypomorphic Stat2 expression from a gene 425 base pairs
    downstream, and characterise it against the existing line. Profile the hepatic and plasma
    lipidome in both sexes, measure hepatic cholesteryl ester directly, and determine what
    apolipoprotein F associates with in CETP-free mouse plasma by immunoaffinity capture followed
    by mass spectrometry of the co-isolated particle.
  experiment_type: mouse genetics with lipidomics and particle proteomics
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The PAINT/IBA method reference for both of this gene's phylogenetic annotations. Verified
      against the committed PAINT slice interpro/panther/PTHR15011/PTHR15011-paint.tsv, which
      shows the single node PTN002687490 at taxon:117571 and the two IBD assertions the IBAs
      descend from.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary 
    mapping, accompanied by conservative changes to GO terms applied by UniProt
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The UniProt subcellular-location mapping reference. Verified against the UniProt locations
      REST record for SL-0243, which declares "Secreted" and its GO mapping to GO:0005576. The
      mapping is correct and the underlying UniProt annotation is experimentally supported, so
      this electronic row adds no unsupported claim.
- id: PMID:204339
  title: Isolation and partial characterization of a new acidic apolipoprotein (apolipoprotein F) 
    from high density lipoproteins of human plasma.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The original isolation of apolipoprotein F, and one of the three ECO:0000269 citations
      behind UniProt's Secreted line. This 1978 Biochemistry paper has no abstract in PubMed, so
      the cached record contains only the citation and title; the supporting_text used for it is
      taken from the title, which itself states the isolation from human plasma HDL. Historically
      important and correctly cited, but it cannot support anything finer than the localisation
      claim it is used for here.
- id: PMID:2715721
  title: Inhibition of lipid transfer by a unique high density lipoprotein subclass containing an 
    inhibitor protein.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The original purification of lipid transfer inhibitor protein, published ten years before
      anyone knew it was apolipoprotein F. Missed by the deep research report, which is the
      general pattern for this gene: the mechanistic literature is titled for LTIP. Verified
      against PubMed. Supplies the 29 kDa mass, the pI of 4.6, the demonstration that inhibition
      covers cholesteryl ester, triglyceride and phospholipid transfer, and the measurement that
      85% of functional activity is in the HDL density range - the last of which is the earliest
      evidence for the HDL pool annotated in this review.
- id: PMID:6816269
  title: Isolation and characterization of simple and complex lipoproteins containing apolipoprotein
    F from human plasma.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited and scientifically sound for what it did, which was to resolve three
      apoF-containing particles and determine their lipid composition by thin-layer
      chromatography. It is the sole source of four GOA rows, and its own conclusion is an
      explicit suggestion about the particles rather than a measurement of the protein. Used here
      to support the cholesterol metabolic process row, which its conclusion does reach, and
      cited against the lipid carrier activity and cholesterol binding rows, which it does not
      support.
- id: PMID:8071606
  title: 'Regulation of lipid transfer between lipoproteins by an endogenous plasma protein: selective
    inhibition among lipoprotein classes.'
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes the selectivity that defines this protein - the inhibition order VLDL-LDL >
      LDL-HDL > VLDL-HDL - and the consequence that inhibiting LDL transfers enhances cholesteryl
      ester removal from HDL. Missed by the deep research report. Verified against PubMed;
      published under the LTIP name, five years before the identity with apoF was established.
- id: PMID:8093033
  title: Purification and molecular cloning of human apolipoprotein F.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The cloning paper, and the source of three GOA rows. Correctly cited for extracellular
      localisation and for lipid metabolic process. Its use for GO:0005102 signaling receptor
      binding is the problem: the abstract describes purification from HDL, cDNA cloning, a
      Northern blot and chromosome mapping, with no receptor experiment of any kind, and no
      receptor for this protein has been reported since. The paper is sound; the annotation drawn
      from it is not.
- id: PMID:9880564
  title: Molecular cloning and expression of lipid transfer inhibitor protein reveals its identity 
    with apolipoprotein F.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The single most important paper for this gene, and it carries zero GO annotations anywhere
      in the GO corpus - checked directly against QuickGO by reference, which returns no hits. It
      establishes that LTIP and apolipoprotein F are the same protein, that recombinant human
      apoF secreted from transfected cells has CETP inhibitor activity, and that the protein is
      associated almost exclusively with LDL. The one caution: UniProt cites it for the statement
      that apoF also associates to a lesser degree with VLDL, Apo-AI and Apo-AII, and the
      abstract does not mention VLDL, so that part of the UniProt summary could not be verified
      from the cached record and no VLDL annotation was made on it.
- id: PMID:10073979
  title: 'Lipid transfer inhibitor protein defines the participation of lipoproteins in lipid transfer
    reactions: CETP has no preference for cholesteryl esters in HDL versus LDL.'
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Decisive for the mechanism and for the molecular function analysis: it shows that the
      preference of CETP for HDL seen in plasma is created by this protein rather than being a
      property of CETP, and that the protein does not change CETP's selection of lipid or its
      mechanism. That last finding is what rules out describing apolipoprotein F as an enzyme or
      transporter inhibitor in the GO sense. Missed by the deep research report; verified against
      PubMed.
- id: PMID:12907677
  title: Lipid transfer inhibitor protein defines the participation of high density lipoprotein 
    subfractions in lipid transfer reactions mediated by cholesterol ester transfer protein (CETP).
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The reason this review describes the protein as retargeting CETP rather than simply
      inhibiting it: within HDL the effect changes sign, with VLDL-to-HDL3 transfer stimulated
      while VLDL-to-HDL2 is inhibited. Cited on the GO:0006869 MODIFY row as the caveat attached
      to the negative-regulation replacement term. Missed by the deep research report; verified
      against PubMed.
- id: PMID:12951364
  title: CETP and lipid transfer inhibitor protein are uniquely affected by the negative charge 
    density of the lipid and protein domains of LDL.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Separates binding from activity - oleate abolishes inhibitory activity without reducing
      binding to LDL - which is why the molecular function added in this review is a binding term
      and the inhibition is recorded as a separate, currently unrepresentable activity. Also
      establishes that LDL surface lipid charge, not protein charge, controls the activity.
      Missed by the deep research report; verified against PubMed.
- id: PMID:18369235
  title: Control of cholesteryl ester transfer protein activity by sequestration of lipid transfer 
    inhibitor protein in an inactive complex.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Resolves the long-standing conflict between the HDL and LDL literature by showing there are
      two pools with opposite activity, and characterises the 470 kDa particle well enough
      (density 1.134 g/ml, apolipoprotein A-I-containing) to match the GO:0034364 definition.
      Used as the primary reference for the new HDL particle row. Missed by the deep research
      report, whose GO grounding nonetheless contains GO:0140313 molecular sequestering activity,
      apparently drawn from this paper's title - an inversion, since the protein is what gets
      sequestered, not the sequestering agent. Verified against PubMed.
- id: PMID:19008531
  title: Overexpression of apolipoprotein F reduces HDL cholesterol levels in vivo.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cited here for its human protein biochemistry rather than for its mouse overexpression
      result. The full text contains the mutagenesis that fixes the proprotein cleavage site at
      Arg-164, the demonstration that the secreted protein is Endo H-resistant and therefore
      Golgi-matured, the site-by-site N-glycosylation analysis identifying Asn-118 and Asn-139 in
      the proprotein and Asn-267 in the mature chain, and the fractionation putting more than 90%
      of human plasma apoF on HDL3. The overexpression result itself is AAV-driven ectopic
      expression in a CETP-free animal and is treated as IMP-grade context, not as evidence for a
      human function; no annotation in this review rests on it.
- id: PMID:21937674
  title: Conversion of lipid transfer inhibitor protein (apolipoprotein F) to its active form 
    depends on LDL composition.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Shows that the active and inactive pools interconvert and that the trigger is modification
      of LDL rather than release from the complex, which is the basis for the knowledge gap about
      the inactive particle. Missed by the deep research report; verified against PubMed.
- id: PMID:22363685
  title: The effects of apolipoprotein F deficiency on high density lipoprotein cholesterol 
    metabolism in mice.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The source of the mouse IMP that seeds the GO:0008203 IBD node, confirmed by querying
      QuickGO for Q91V80, which returns GO:0008203 IMP from this PMID with allele MGI:3800154.
      Its introduction is also the clearest published statement that apolipoprotein F is
      unrelated to the classical apolipoproteins and lacks their amphipathic helices, and that
      the family's conservation in CETP-free species implies a second function. The lipid
      phenotype is modest and sex-specific, which is recorded in the propagation review rather
      than used against the transfer.
- id: PMID:24529150
  title: Genetic manipulation of the ApoF/Stat2 locus supports an important role for type I 
    interferon signaling in atherosclerosis.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited only for the caveat it supplies: the non-lipid phenotypes of the ApoF knockout line
      are attributable to hypomorphic Stat2 expression from a gene 425 base pairs downstream. The
      authors invoke this for the interferon and macrophage phenotypes, not for hepatic
      cholesteryl ester, so it does not void the GO:0008203 seed, but it means the line is
      confounded and the 39% lesion reduction in the double knockout should not be read as an
      apolipoprotein F lipid effect. Verified against the cached full text.
- id: PMID:25349778
  title: Is there a link between proprotein convertase PC7 activity and human lipid homeostasis?
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Identifies PCSK7/PC7 as a protease that processes apolipoprotein F. Relevant to the
      description of precursor maturation and cited there; deliberately not used to generate any
      annotation, because apolipoprotein F is the substrate of this cleavage, not its agent.
      Verified against the cached full text.
- id: PMID:28514442
  title: Architecture of the human interactome defines protein communities and disease networks.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      BioPlex 2.0. Correctly cited for a real affinity-purification observation, but a
      whole-proteome projection: full pagination of QuickGO by reference gives 3731 annotations
      across 2324 distinct gene products, every one of them to GO:0005515. Contains no
      APOF-specific text - a grep of the cached full text for APOF or GALNT returns nothing - so
      the partner identity was resolved from the GOA WITH/FROM column and UniProt rather than
      from the paper.
- id: PMID:28935895
  title: Absolute quantitation of disease protein biomarkers in a single LC-MS acquisition using 
    apolipoprotein F as an example.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      A methods paper that happens to be a clean direct detection of the protein in human serum
      and plasma, which is what the IDA row rests on. Also an unexpectedly useful source on
      glycosylation: it records that the tryptic peptide DANISQPETTK had to be excluded because
      it was glycosylated, and that peptide maps to precursor positions 265-275, spanning both
      the mature chain's only N-glycosylation sequon and its mapped O-GalNAc site. Its biomarker
      conclusion, that apoF falls across NAFLD stages, is not used for any annotation.
- id: PMID:31511396
  title: ApoF knockdown increases cholesteryl ester transfer to LDL and impairs cholesterol 
    clearance in fat-fed hamsters.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The in vivo validation of the inhibitory function, in the hamster because it expresses CETP
      and the mouse does not. Supports the negative-regulation replacement term. It also supplies
      the reverse cholesterol transport result that inverts with diet, which is why no RCT term
      appears anywhere in this review. Verified against PubMed.
- id: PMID:32520778
  title: 'Apolipoprotein F: a natural inhibitor of cholesteryl ester transfer protein and a key regulator
    of lipoprotein metabolism.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The authoritative review, by the group responsible for most of the mechanistic work, with
      full text available. Used for the mechanism statement, the two-pool resolution, the
      precursor architecture and the field's own admission of what remains unknown. One internal
      discrepancy is recorded rather than smoothed over: it describes the precursor as 308 amino
      acids with a 286-residue proprotein, whereas UniProt and PMID:19008531 give 326 and 290;
      all sources agree on 162 residues for the mature chain. Being a review, it is used for
      framing and for statements it makes in its own voice, with primary references cited
      alongside wherever an annotation depends on the claim. Missed by the deep research report.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      BioPlex 3.0, and the larger of the two projections: 9514 annotations across 4757 distinct
      gene products by full QuickGO pagination, of which 9508 are GO:0005515. Reports the same
      GALNT4 partner as PMID:28514442 from a successor release of the same pipeline, so the two
      rows are one interaction seen twice, consistent with UniProt's NbExp=2 for the pair.
      Contains no APOF-specific text.
- id: PMID:35016907
  title: Apolipoprotein F concentration, activity, and the properties of LDL controlling ApoF 
    activation in hyperlipidemic plasma.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The primary reference for the new GO:0030169 low-density lipoprotein particle binding row.
      Quantifies LDL-bound apolipoprotein F by ELISA across 200 donors, states that the activity
      requires LDL binding, and identifies LDL particle size as the sole correlate of binding
      capacity among the physicochemical properties surveyed - which is also the positive
      argument against the cholesterol binding annotation. Present in the deep research report.
- id: PMID:35735979
  title: Apolipoprotein F is reduced in humans with steatosis and controls plasma triglyceride-rich 
    lipoprotein metabolism.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Reports that hepatic APOF expression is the strongest negative correlate of plasma
      triglyceride among liver-regulated genes in two obese cohorts, and that adenoviral human
      apolipoprotein F in mice increases VLDL-triglyceride secretion and remnant clearance. The
      human data are correlative and the functional data are ectopic overexpression in a
      CETP-free animal, so no annotation in this review rests on it; it is cited as evidence that
      CETP-independent roles exist, which is one of the knowledge gaps.
- id: file:human/APOF/APOF-deep-research-affinage.md
  title: Affinage mechanistic annotation for APOF (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Trust gates clear per .affinage.log, self_evaluation_pairwise win, faith_pct 100, 16
      citations all with numeric PMIDs, and the record describes the correct protein with no
      symbol collision. Accurate and useful on transcriptional regulation and the in vivo mouse
      and hamster work. Two limitations were worked around rather than inherited. Its
      mechanism_profile GO grounding was not imported: GO:0140313 molecular sequestering activity
      inverts the finding it comes from, since apolipoprotein F is sequestered into the inactive
      complex rather than being the sequestering agent. And its recall is poor on the mechanism:
      of the ten Morton-group papers that carry the mechanistic argument, it cites one, because
      they are titled for lipid transfer inhibitor protein rather than for apolipoprotein F. No
      supporting_text in this review is taken from it.
- id: file:human/APOF/APOF-bioinformatics/RESULTS.md
  title: APOF (Q13790) sequence analysis — results
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Local reproducible analysis written for this review; all sequences fetched live from the
      UniProt REST API at run time, with feature boundaries asserted against the record rather
      than assumed. Supports the amphipathicity deficit cited on the cholesterol binding row and
      the precursor arithmetic cited on the IBA row. Its N-glycosylation sequon inventory was
      computed independently and was afterwards found to match, site for site, the experimental
      mutagenesis in PMID:19008531, which is the strongest available check on it.
