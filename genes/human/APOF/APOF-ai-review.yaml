- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN002687490
  - UniProtKB:Q13790
  review:
    summary: >-
      Correct and well-placed family inference. The committed PAINT slice for PTHR15011 shows a
      single node, PTN002687490 at taxon:117571 (Euteleostomi), whose GO:0005576 IBD is seeded by
      UniProtKB:Q13790 - the target's own experimentally grounded secretion. The node asserts
      that secretion is ancestral to the vertebrate apolipoprotein F family rather than a human
      innovation.
    action: ACCEPT
    reason: >-
      The self-referential WITH/FROM is expected and is a marker of experimental grounding on the
      target, not circularity: human APOF's own secretion evidence is one of the descendant
      evidences the PAINT curator used to place the IBD, and the node then adds the claim that
      the property is inherited. Human APOF sits inside the inheriting clade by definition, and
      there is no evidence of divergence: the 35-residue signal peptide is present, the protein
      is recovered from plasma by several independent groups, and the mouse and rat orthologues
      that make up the rest of the family are likewise secreted plasma proteins. PTHR15011 is a
      single-subfamily family with no paralogue to confuse, and the slice contains no IRD or IKR
      anywhere. Secretion is not incidental for this protein - it is a plasma lipid-transfer
      regulator and has no known intracellular activity - so this is core rather than
      contextual.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      residue_claims_not_applicable: >-
        The question is presence of a cleaved signal peptide and recovery of the protein from
        plasma, not the identity of a residue at a conserved position, so there is no point
        mutation whose gain or loss would decide it.
      source_entities:
      - source_id: PANTHER:PTN002687490
        source_label: PTHR15011 apolipoprotein F IBD node (taxon:117571, Euteleostomi)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The family's only PAINT node. The committed slice interpro/panther/PTHR15011/PTHR15011-paint.tsv
          shows its GO:0005576 IBD seeded by UniProtKB:Q13790, at Euteleostomi. Human APOF is inside the
          inheriting clade, and the family contains no IRD or IKR and no paralogous subfamily to confuse.
      - source_id: UniProtKB:Q13790
        source_label: APOF (Homo sapiens), the target itself
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The target's own accession, which is expected rather than circular: its experimental secretion
