- term:
    id: GO:0030169
    label: low-density lipoprotein particle binding
  evidence_type: IDA
  original_reference_id: PMID:35016907
  review:
    summary: >-
      The molecular function this protein actually has, missing from the record entirely.
      Apolipoprotein F binds the LDL particle, and that binding is the prerequisite for its
      inhibition of CETP; the amount bound is set by LDL particle size and is measurable by ELISA
      in human plasma.
    action: NEW
    reason: >-
      Direct evidence in human plasma and with human protein, from several groups and over two
      decades. The original identification of LTIP as apoF exploited the tight association of the
      protein with LDL as a purification step and reported the protein to be associated almost
      exclusively with LDL, matching the distribution of the activity. Morton and Mihna
      quantified LDL-bound apoF by ELISA in 200 donors, showed that hypercholesterolaemic LDL
      carries about twice as much apoF per particle as normolipidaemic LDL while
      hypertriglyceridaemic LDL carries under 20% of control, and identified LDL particle size as
      the determinant: enlarging LDL in vitro increased apoF binding capacity and shrinking it
      again with lipoprotein lipase reduced binding by 90%. Earlier work showed binding can be
      separated from activity, since oleate blocks activity without reducing binding, which is
      further evidence that binding is a distinct molecular event rather than a restatement of
      the inhibition. This is the replacement term proposed on the GO:0005319 and GO:0015485 rows
      and is added here as a positive annotation in its own right.
    supported_by:
    - reference_id: PMID:35016907
      supporting_text: Apolipoprotein F (ApoF) modulates lipoprotein metabolism by selectively 
        inhibiting cholesteryl ester transfer protein activity on LDL. This ApoF activity requires 
        that it is bound to LDL.
    - reference_id: PMID:35016907
      supporting_text: Similarly, when in vitro produced and enlarged LDLs with elevated ApoF 
        binding capacity were incubated with LPL to reduce their size, ApoF binding was reduced by 
        90%.
    - reference_id: PMID:9880564
      supporting_text: Purification of LTIP, in contrast to other published protocols, took 
        advantage of the tight association of this protein with LDL.
