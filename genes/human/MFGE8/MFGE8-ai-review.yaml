suggested_questions:
- question: Does MFG-E8 opsonization of synapses in human Alzheimer disease depend on phosphatidylserine
    exposure on those synapses, and is it independent of, additive to, or redundant with C1q/C3-dependent
    synapse tagging?
- question: Should GO capture phosphatidylserine-bridging opsonins (MFG-E8, GAS6, PROS1) with a dedicated
    molecular function term for apoptotic-cell/phagocyte bridging rather than only paired lipid- and receptor-binding
    terms?
- question: Which protease(s) liberate medin from the lactadherin C2 domain in the vessel wall, and does
    medin generation reduce the phosphatidylserine-binding/opsonin capacity of vascular MFG-E8?
suggested_experiments:
- description: Treat human iPSC-derived microglia and astrocytes with AD-derived synaptoneurosomes pre-incubated
    with wild-type MFG-E8, an RGE (integrin-dead) mutant, or a C2-domain PS-binding mutant, combined with
    annexin V masking of PS, to test whether synapse engulfment requires both halves of the bridge.
- description: Compare synapse loss in amyloid mouse models crossed onto Mfge8-null, C3-null and double-null
    backgrounds to determine whether MFG-E8 and complement act in the same or parallel synapse-elimination
    pathways.
