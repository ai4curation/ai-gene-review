core_functions:
- description: 'Phosphatidylserine-recognition half of the MFG-E8 bridge: the C-terminal discoidin domains
    (mainly C2) bind phosphatidylserine exposed on the outer leaflet of apoptotic cells, extracellular
    vesicles and stressed neurons/synapses, opsonizing them for engulfment. This makes MFG-E8 a phosphatidylserine-bridging
    opsonin; it is not a complement component, and the same opsonin mechanism has been implicated in glial
    ingestion of synapses in human Alzheimer disease tissue ex vivo.'
