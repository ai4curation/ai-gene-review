id: Q08431
gene_symbol: MFGE8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MFGE8 encodes lactadherin (milk fat globule-EGF factor 8, MFG-E8), a secreted peripheral-membrane
  glycoprotein made by macrophages, microglia, astrocytes, mammary epithelium, vascular smooth muscle
  and other cells. It consists of an N-terminal EGF-like domain carrying an RGD motif followed by two
  discoidin (F5/8 type C) domains. The discoidin domains, chiefly C2, bind phosphatidylserine exposed
  on apoptotic cells, extracellular vesicles, milk fat globules and stressed neurons or synapses, while
  the RGD motif binds alphav-beta3 and alphav-beta5 integrins on phagocytes. MFG-E8 thereby acts as a
  bridging opsonin that tethers phosphatidylserine-exposing targets to engulfing cells and promotes their
  phagocytic clearance; loss of this clearance in mice leads to accumulation of unengulfed apoptotic cells
  and lupus-like autoimmunity. The same opsonophagocytic mechanism can drive microglial and astrocytic
  engulfment of viable neurons and synapses under inflammatory or amyloid-beta stress. Additional reported
  roles, mostly from mouse studies, include intestinal epithelial repair, VEGF-dependent neovascularization,
  macrophage uptake of collagen, and sperm-zona pellucida adhesion. A 50-residue internal fragment of
  the C2 domain, medin, forms aortic medial amyloid, the most common human amyloid, and co-aggregates
  with vascular amyloid-beta in cerebral amyloid angiopathy.
