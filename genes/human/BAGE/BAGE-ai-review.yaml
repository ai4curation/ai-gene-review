suggested_questions:
- question: Is the BAGE miniprotein secreted (as its predicted signal peptide suggests) or cytosolic,
    and does it have any function in spermatogenesis?
suggested_experiments:
- description: Detect endogenous BAGE peptides in testis and BAGE-positive melanoma lysates and conditioned
    media by targeted mass spectrometry, and test signal-peptide-dependent secretion of tagged BAGE.
