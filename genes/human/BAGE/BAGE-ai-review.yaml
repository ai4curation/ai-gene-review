knowledge_gaps:
- gap_statement: Whether BAGE is translated as a functional protein in testis or tumours, where it localizes,
    and what it does are unknown.
  boundary: 'Established: a 43-residue ORF whose peptide AARAVFLAL is presented on HLA-Cw16 to cytolytic
    T cells, so the ORF is translated in melanoma. Expression is restricted to testis and tumours and
    is controlled by promoter methylation. Not established: the endogenous protein''s location (a signal
    peptide is only predicted), any binding partner with functional follow-up, or any cellular function.'
  gap_kind:
  - BIOLOGY
