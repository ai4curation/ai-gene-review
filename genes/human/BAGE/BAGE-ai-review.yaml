suggested_questions:
- question: Is the predicted mature BAGE miniprotein from residues 18-43 produced, secreted and functional
    in spermatogenesis or BAGE-positive tumours?
suggested_experiments:
- description: Detect mature-chain peptides EESPVVSWR and LEPEDGTALCFIF in testis and BAGE-positive melanoma
    lysates and conditioned media by targeted mass spectrometry or peptidomics, first establishing proteotypicity
    against the near-identical BAGE2-5 paralogs; separately test signal-peptide-dependent secretion of
    tagged BAGE.
