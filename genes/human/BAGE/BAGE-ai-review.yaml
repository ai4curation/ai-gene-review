  label: Homo sapiens
description: 'BAGE (B melanoma antigen 1) encodes a putative 43-residue protein, one of a family of nearly
  identical BAGE sequences in the juxtacentromeric regions of chromosomes 9, 13, 18 and 21. It is a cancer/testis
  antigen: silent in normal somatic tissues apart from testis, but re-expressed in melanomas and other
  cancers, where promoter hypomethylation accompanies expression. Its peptide AARAVFLAL, presented on
  HLA-Cw16, is recognized by autologous cytolytic T lymphocytes. A signal peptide is predicted, but no
  biochemical function is known.'
