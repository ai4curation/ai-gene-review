knowledge_gaps:
- gap_statement: Whether the mature BAGE chain is produced and functional in testis or tumours, where it
    localizes, and what it does are unknown.
  boundary: 'Established: a 43-residue ORF whose signal-peptide segment AARAVFLAL is presented on HLA-Cw16
    to cytolytic T cells, so the N terminus is translated in melanoma. Expression is restricted to testis
    and tumours and is controlled by promoter methylation. UniProt predicts a 1-17 signal peptide and a
    26-residue mature chain from residues 18-43. Not established: whether that mature chain is produced,
    stable or secreted, any binding partner with functional follow-up, or any cellular function. The
    BAGE-like/PF08180 family assignment has no known functional signature, Pharos classifies BAGE as Tdark,
    and PAN-GO assigns no evolutionary-model annotations.'
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
