- id: PMID:10624965
  title: Caspr2, a new member of the neurexin superfamily, is localized at the juxtaparanodes of
    myelinated axons and associates with K+ channels.
  findings:
  - statement: Human Caspr2 was cloned, while endogenous rat brain localization and biochemical assays
      showed juxtaparanodal enrichment and Kv1.2/Kvβ2-associated complexes. Reconstitution with only
      the tested channel subunits did not yield a stable complex, and occasional outermost glial
      paranodal loops were labeled.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The selected cache remains the original abstract. A separately authenticated institutional
      full PDF provides the original rat-brain co-immunoprecipitation, peptide pull-down and heterologous-association
      limits. Selected extracted Results and Discussion passages and Figure 8 legends were read;
      no new figure-pixel inspection is claimed in this follow-up.
- id: PMID:11352571
  title: The human contactin-associated protein-like 2 gene (CNTNAP2) spans over 2 Mb of DNA at chromosome
    7q35.
  findings:
  - statement: The paper defines the large human CNTNAP2 genomic locus and its predicted Caspr2 protein
      architecture. The available abstract does not establish an experimentally performed nerve-impulse
      transmission step.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Complete selected abstract read; full text not recovered. Gene identity and membrane
      architecture are relevant, but the exact NAS impulse-transmission relationship remains unresolved.
  full_text_unavailable: true
- id: PMID:18179893
  title: Linkage, association, and gene-expression analyses identify CNTNAP2 as an autism-susceptibility
    gene.
  findings:
  - statement: Human association and fetal-expression analyses relate CNTNAP2 to autism/language
      context. Regional fetal RNA distribution, childhood first-word measures and reported recessive
      regression do not separately demonstrate regional developmental participation or adult behavior.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual selected full Methods/Results and discussion read, including cohort ascertainment,
      fetal expression and association limits. Common-variant association is not treated as causal
      functional proof.
- id: PMID:18179895
  title: Molecular cytogenetic analysis and resequencing of contactin associated protein-like 2 in
    autism spectrum disorders.
  findings:
  - statement: Mouse limbic and human temporal-cortex expression are distinct observations. Rat P9
      brain fractionation supports a synaptic plasma-membrane pool, while human variant association
      remains limited by segregation and population context.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual selected full Methods/Results read; the rat synaptic fractionation is distinguished
      from human and mouse expression and the human genetic cohort.
- id: PMID:18987363
  title: A functional genetic link between distinct developmental language disorders.
  findings:
  - statement: FOXP2 binds and regulates CNTNAP2 in human neuronal cells; fetal cortical expression
      and language-associated variation connect the genes biologically. The assayed DNA-regulatory
      step is performed by FOXP2, not evidence by itself of CNTNAP2-driven cortical development.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual selected full Methods/Results read, including ChIP/EMSA, expression, fetal
      sections and quantitative language association.
- id: PMID:19166515
  title: Contactin-associated protein (Caspr) 2 interacts with carboxypeptidase E in the CNS.
  findings:
  - statement: The complete abstract reports Caspr2–carboxypeptidase E association by two-hybrid,
      GST pull-down and co-immunoprecipitation, with neuronal and transfected-cell colocalization.
      These data support positive protease binding without establishing catalytic regulation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete selected abstract read. Bounded publisher/author-page recovery did not
      yield actual full Results; exact construct species and detailed assay-to-cell mapping remain
      unverified. The explicit positive abstract and curated partner identity are retained.
  full_text_unavailable: true
- id: PMID:19706678
  title: Axonal targeting of Caspr2 in hippocampal neurons via selective somatodendritic endocytosis.
  findings:
  - statement: Human HA-tagged Caspr2 in rat hippocampal neurons reaches the axonal surface through
      selective somatodendritic endocytosis. Tail and motif manipulations, surface labeling and early-endosomal
      observations distinguish trafficking pools from polarized surface residence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Selected normal abstract is unchanged. Actual indexed author-uploaded full text
      was recovered and read: Results lines 281–550, Discussion 1202–1315 and Methods 1317–1350/1400–1548
      in the saved web responses. This is external full-text access, not a claim that the selected
      cache contains the body or that PDF pixels were inspected.'
- id: PMID:19896112
  title: CNTNAP2 and NRXN1 are mutated in autosomal-recessive Pitt-Hopkins-like mental retardation
    and determine the level of a common synaptic protein in Drosophila.
  findings:
  - statement: Human biallelic CNTNAP2 defects cause severe neurodevelopmental disease with speech
      impairment and variable autistic features. Separate Drosophila neurexin-IV experiments concern
      synaptic organization; speech loss in patients is not an imitation-learning assay.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual selected full clinical/genetic Methods/Results and separate fly experiments
      read; no human complementation assay is inferred.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings:
  - statement: HI-II-14 provides positive human CNTNAP2–MEOX2 pair records with validated, array
      and pooling two-hybrid evidence. General orthogonal validation of the map is not claimed as
      an additional exact-pair assay.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Protected selected main cache retains its limited body. Genuine fresh normal full-text
      variant is archived separately; its Results paragraphs 23/27 and assay Methods paragraph 62
      were read, alongside exact 42-field interaction records.
- id: PMID:26721881
  title: Structural Characterization of the Extracellular Domain of CASPR2 and Insights into Its
    Association with the Novel Ligand Contactin1.
  findings:
  - statement: Human CASPR2 ectodomain binds CNTN1 directly in biolayer interferometry and in cell-surface
      assays. Purified contactin-family comparisons were negative for other tested contactins under
      those conditions, which does not erase positive CNTN2 results obtained with different presentations.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full construct Methods and binding Results, including paragraphs 23/56/57/61,
      establish the tested human ectodomain and cell-based interactions. The purified CNTN1 affinity
      and negative TAG-1 assay are kept at their preparation-specific scope.
- id: PMID:29028946
  title: Mouse Cntnap2 and Human CNTNAP2 ASD Alleles Cell Autonomously Regulate PV+ Cortical Interneurons.
  findings:
  - statement: Mouse Cntnap2 loss and human CNTNAP2 rescue alter PV expression and interneuron maturation/physiology.
      MGE proliferation and survival were reported unchanged, and fate-mapped interneuron numbers
      were normal.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual selected full Methods/Results read, including human constructs, lineage
      counts, proliferation/survival limits and rescue. The negative proliferation statement is explicitly
      data not shown, not a claim of an inspected quantitative panel.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: HuRI supports the positive CNTNAP2–POLR2G and CNTNAP2–GORASP2 pairs. The screen records
      do not themselves locate an interface or demonstrate a native transcriptional or Golgi function
      for CNTNAP2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual selected Results/Discussion and assay/validation text read, with all six
      exact 42-field target/reference/pair records. No separate supplementary Methods or native-mechanism
      inspection is claimed.
- id: PMID:33238150
  title: NLR-1/CASPR Anchors F-Actin to Promote Gap Junction Formation.
  findings:
  - statement: Human CNTNAP2 transgenes rescue junction morphology and locomotion in nlr-1-deficient
      worms and restore Cx43-based junction assembly. The direct actin-binding experiments are on
      worm NLR-1 and are not relabeled as human CNTNAP2 biochemical measurements.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected human-transgene Results paragraphs 36/37 and the relevant construct/method
      context support human CNTNAP2 rescue in worms. Native human gap-junction physiology and transfer
      of worm NLR-1 actin-binding chemistry remain unestablished.
- id: PMID:36115835
  title: Quantitative fragmentomics allow affinity mapping of interactomes.
  findings:
  - statement: Quantitative holdup assays directly test the human CNTNAP2 terminal peptide against
      isolated human PDZ domains. Positive records define the binding class without establishing
      all full-length cellular complexes or their physiological importance.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual selected full assay Methods/Results read, including peptide/domain preparation
      and affinity interpretation. Exact target/reference/partner joins and construct features remain
      literal; no isolated-domain record is silently converted to full-length binding.
- id: PMID:12963709
  title: Juxtaparanodal clustering of Shaker-like K+ channels in myelinated axons depends on Caspr2
    and TAG-1.
  findings:
  - statement: Mouse Caspr2 loss redistributes juxtaparanodal Kv1 channels without lowering total
      Kv1.2. Rat brain and transfected-cell association with TAG-1 supports a structural complex;
      the experiments do not completely distinguish initial recruitment from maintenance.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full complex Results, biochemical Methods, nerve-conduction Results/Methods
      and Discussion were read. Rat brain association is distinguished from reduced heterologous
      reconstitution; mouse loss redistributes channels without an apparent conduction defect under
      the tested conditions. Human scaffold assignment is ISS from mouse Q9CPW0, not human IDA.
- id: PMID:26217189
  title: Inhibitory axons are targeted in hippocampal cell culture by anti-Caspr2 autoantibodies
    associated with limbic encephalitis.
  findings:
  - statement: Human Caspr2-Fc and TAG-1 constructs support presentation-dependent binding in transfected
      cells and rodent neurons. Endogenous rat neuronal labeling identifies presynaptic and glutamatergic/GABAergic
      sites, with effects on inhibitory contacts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual selected full construct/culture Methods and localization/binding Results
      read. Human Fc constructs are distinguished from rat endogenous localization and mouse Tag1-null
      rescue context.
- id: PMID:19109503
  title: Multiple molecular interactions determine the clustering of Caspr2 and Kv1 channels in myelinated
    axons.
  findings:
  - statement: The complete abstract reports that the Caspr2 cytoplasmic region is required for juxtaparanodal
      organization, whereas removal of the terminal PDZ-binding sequence still permits rescue. PSD93/PSD95
      loss does not abolish the Caspr2–Kv1 complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete genuine normal abstract read; detailed full-text Methods and panels remain
      unavailable. This limits, rather than abolishes, the positive ortholog support.
  full_text_unavailable: true
- id: PMID:25378149
  title: Caspr and caspr2 are required for both radial and longitudinal organization of myelinated
    axons.
  findings:
  - statement: Mouse Caspr/Caspr2 double-mutant experiments support axonal domain organization. The
      abstract explicitly reports Caspr2 at paranodes in Caspr-deficient nerves, without restoration
      of a distinct paranodal junction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete genuine normal abstract read; full panels remain unavailable. Single-gene,
      double-mutant and compensatory localization contexts are not conflated.
  full_text_unavailable: true
- id: PMID:30126973
  title: Altered Auditory Processing, Filtering, and Reactivity in the Cntnap2 Knock-Out Rat Model
    for Neurodevelopmental Disorders.
  findings:
  - statement: Cntnap2-deficient rats show altered acoustic startle and progressively impaired prepulse
      inhibition, accompanied by auditory timing changes. These support organismal circuit context
      rather than an independent molecular activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual selected full animal/cohort Methods and behavioral/auditory Results read,
      with age and sensorimotor measures distinguished.
- id: PMID:19458237
  title: Lewis(x) and alpha2,3-sialyl glycans and their receptors TAG-1, Contactin, and L1 mediate
    CD24-dependent neurite outgrowth.
  findings:
  - statement: Mouse DRG antibody and genetic-context experiments support Caspr2 participation in
      CD24-dependent neurite responses. The source uses Caspr1 knockout and explicitly lacks Caspr2-null
      neurons; these experiments are not renamed Caspr2 knockouts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full mouse DRG antibody-blockade Results and culture Methods were read,
      including contactin/TAG-1 backgrounds and the Caspr1/Caspr2 distinction. Caspr2-deficient neurons
      were not tested; cerebellar responses were Caspr2 independent. Initial failed retrieval and
      later genuine full recovery remain documented separately.
core_functions:
- description: Full-length Caspr2 and TAG-1 form a membrane-associated scaffold that organizes and
    maintains Kv1 channels at neuronal juxtaparanodes. Native rat brain co-immunoprecipitation places
    this scaffold in a larger channel-associated assembly, but the connection to Kv subunits can
    be indirect and additional components were needed beyond the tested heterologous combinations.
    The core therefore identifies the Caspr2/TAG-1 scaffold and its channel-positioning work without
    assigning Caspr2 a defined channel-subunit stoichiometry or ion conductance. Human assignment
    is an ortholog inference, complemented by direct human ectodomain and tail-interaction evidence;
    no equivalent scaffold activity is assumed for the short product.
  molecular_function:
    id: GO:0140378
    label: protein complex scaffold activity
