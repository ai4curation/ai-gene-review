  review:
    summary: Accept the experimentally observed early-endosomal pool.
    action: ACCEPT
    reason: The original full text uses HA-tagged human Caspr2 in rat hippocampal neurons and follows
      selective somatodendritic internalization, including early-endosome colocalization. This trafficking
      pool is compatible with predominant axonal surface localization; it is not evidence that the
      whole protein is an endosomal resident.
