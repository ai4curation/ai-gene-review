id: Q9UHC6
gene_symbol: CNTNAP2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CNTNAP2 encodes Caspr2, a single-pass neuronal membrane protein with a large extracellular
  adhesion domain and a short intracellular interaction tail. Caspr2 organizes contactin-associated
  Kv1 potassium-channel assemblies at juxtaparanodes of myelinated axons and also occupies context-dependent
  synaptic and intracellular trafficking pools. Its extracellular domain binds contactin family proteins
  under defined conditions, while its terminal peptide binds PDZ domains. These interactions support
  neuronal membrane organization and circuit maturation. Biallelic loss of CNTNAP2 causes severe
  neurodevelopmental disease with seizures and language impairment; broader common-variant associations
  have more limited causal resolution.
alternative_products:
- name: '1'
  id: Q9UHC6-1
  description: The 1331-residue canonical membrane product supplies the large extracellular domain,
    single transmembrane segment and cytoplasmic interaction tail used in the full-length Caspr2
    model. Individual assays use defined tagged or truncated constructs rather than all products.
- name: '2'
  id: Q9UHC6-2
  sequence_note: VSP_014976
  description: The official 108-residue product is reconstructed by VSP_014976 deletion of canonical
    residues 1–1223. It retains the canonical C-terminal sequence, including the PDZ-binding peptide,
    but lacks most of the extracellular adhesion architecture. Its ability to perform the full-length
    scaffold function has not been established.
