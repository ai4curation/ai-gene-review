suggested_questions:
- question: Which components physically bridge the Caspr2 cytoplasmic tail to Kv1 channels, and which
    steps establish versus maintain the juxtaparanodal assembly?
- question: What functions and membrane topology does the 108-residue human product have in native
    cells?
- question: Which neuronal functions explain the clinical learning, social and speech phenotypes
    without treating regional expression as direct developmental participation?
- question: How do construct presentation and cis versus trans geometry explain the different reported
    contactin-binding outcomes?
suggested_experiments:
- hypothesis: Caspr2 contributes a defined structural linkage rather than autonomous channel activity.
  description: Reconstitute sequence-verified human full-length Caspr2, CNTN2 and Kv1 complexes with
    candidate cytoplasmic adaptors, and compare assembly and channel localization after targeted
    interface disruption while measuring total channel abundance.
  experiment_type: Complex reconstitution and neuronal targeting
- hypothesis: The short human product retains a subset of tail interactions but not the full extracellular
    scaffold function.
  description: Compare native expression, topology and PDZ-domain binding of both sequence-verified
    human products, then test rescue of juxtaparanodal assembly at matched expression levels.
  experiment_type: Product-resolved localization and rescue
