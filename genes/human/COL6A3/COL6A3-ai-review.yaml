core_functions:
- description: Alpha3(VI) contributes the long structural chain of canonical alpha1/alpha2/alpha3
    collagen VI units. N-terminal and C-terminal interfaces support extracellular end-to-end tetramer
    association and beaded-microfibril deposition. The two short products lacking the collagenous
    and C-terminal regions have not been shown to substitute for the assembled long chain.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  in_complex:
    id: GO:0005589
    label: collagen type VI trimer
  locations:
  - id: GO:0001527
    label: microfibril
  supported_by:
  - reference_id: PMID:11027693
  - reference_id: PMID:16613849
  - reference_id: PMID:23869615
suggested_questions:
- question: Which native assemblies or matrix functions, if any, contain the two short alpha3 products
    lacking the collagenous and C-terminal regions?
- question: How should GO microfibril assembly distinguish the directly demonstrated collagen VI
    interfaces from the current fibrillin-associated annotation convention?
- question: Does sequence-defined human free C5 reproduce the mouse endothelial migration response,
    and what receptor or relay and directional-migration mechanism mediates it?
- question: How do the N-terminal heparin and hyaluronan interactions change after native collagen
    VI assembly and alpha3 processing?
suggested_experiments:
- description: Compare all five sequence-defined human products with alpha1/alpha2 using pulse-chase
    secretion, chain-specific peptides and matrix electron microscopy.
  hypothesis: Products retaining the collagenous/C-terminal regions differ from the two short products
    in incorporation and beaded-microfibril assembly.
- description: Test purified sequence-defined human C5 alongside the published mouse construct in
    concentration-gradient and checkerboard migration assays, with matched fold/purity controls.
  hypothesis: Fragment sequence, processing state or an indirect relay determines the migration response
    independently of the disputed ANTXR-binding model.
status: DRAFT
