  review:
    summary: The native human C5 Kunitz fold does not justify this automatic inhibitor assignment.
    action: REMOVE
    reason: Current InterPro IPR002223 and IPR036880 map the fold to serine-type endopeptidase inhibitor
      activity. Original human recombinant C5 assays instead show no trypsin binding at 7 micromolar
      and no inhibition in peptide and nidogen-cleavage assays; engineered loop mutants and known
      inhibitors provide positive controls. This contradicts the electronic functional mapping at
      the tested native sequence. It neither negates all possible protease interactions nor claims
      that every splice product was tested. The successful engineered mutants are not native COL6A3
      activity.
