id: P12111
gene_symbol: COL6A3
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL6A3 encodes the alpha3 chain of collagen VI, an extracellular matrix protein with
  an extended array of N-terminal von Willebrand factor A domains, a short collagenous region and
  C-terminal globular domains. Long alpha3 products associate with alpha1 and alpha2 chains to form
  collagen VI units that assemble into dimers, tetramers and extracellular beaded microfibrils. Specific
  N- and C-terminal regions support higher-order assembly and matrix deposition. Human recombinant
  N-terminal domains bind heparin and hyaluronan. Proteolytic processing releases C-terminal fragments,
  including C5/endotrophin; experimentally studied fragments differ from the intact matrix chain.
  Alternative splicing produces five recorded human products, two of which lack the collagenous and
  C-terminal regions. Pathogenic COL6A3 variants cause collagen VI-related muscular dystrophies.
alternative_products:
- name: '1'
  id: P12111-1
  description: Displayed 3177-aa product with N10 through N1, the collagenous region and C-terminal
    domains. The historical N9-C5 and engineered N6-C5 assembly constructs are not silently equated
    to this complete sequence.
- name: '2'
  id: P12111-2
  sequence_note: VSP_001172
  description: 2971-aa product reconstructed by the exact VSP_001172 deletion. It retains N5, the
    collagenous region and C-terminal domains; architectural similarity to a historical N9-C5 construct
    is not proof of identical assayed sequence or activity.
- name: '3'
  id: P12111-3
  sequence_note: VSP_001172, VSP_043434, VSP_043435, VSP_043436
  description: 1036-aa product reconstructed from its four official VSP edits. It retains N5 but
    terminates before the collagenous region and every C-terminal domain. N5 retention alone does
    not establish canonical collagen VI incorporation.
- name: '4'
  id: P12111-4
  sequence_note: VSP_045718, VSP_045719
  description: 2570-aa product with the two official internal N-terminal deletions. N5, the collagenous
    region and C-terminal domains remain; its complete assembly phenotype was not independently established
    by the historical deletion series.
- name: '5'
  id: P12111-5
  sequence_note: VSP_001172, VSP_043435, VSP_043436
  description: 1237-aa product reconstructed from three official VSP edits. It retains N5 but lacks
    the collagenous and C-terminal regions. The historical urinary-proteomics label isoform5/NP_476508
    is not assumed to identify this modern product.
