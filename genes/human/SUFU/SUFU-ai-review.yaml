    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - FB:FBgn0005355
  - MGI:MGI:1345643
  - PANTHER:PTN000859153
  - UniProtKB:Q9UMX1
  review:
    summary: Phylogenetic inference from PTHR10928 node PTN000859153, which carries an IBD for nucleus
      seeded by Drosophila Su(fu), mouse Sufu and human SUFU.
    action: ACCEPT
    reason: 'Accepted. This is a node assertion, not a similarity transfer: the PAINT curator judged that
      nuclear localisation is ancestral within the Suppressor of fused family and human SUFU descends
      from that node. Human SUFU appears in the WITH/FROM because its own experimental localisation is
      one of the descendant evidences used to place the IBD - that is the expected pattern for a gene
      with direct evidence, and the IBA then adds the further claim that the localisation is inherited
      rather than vertebrate-specific. Independent human experimental rows (EXP, IDA, IMP) agree.'
    supported_by:
    - reference_id: file:human/SUFU/SUFU-notes.md
      supporting_text: those experimental rows
    - reference_id: file:human/SUFU/SUFU-notes.md
      supporting_text: then says something *additional*
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000859153
        source_label: PTN000859153
        source_status: SUPPORTS_TRANSFER
