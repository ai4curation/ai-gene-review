- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - FB:FBgn0005355
  - MGI:MGI:1345643
  - PANTHER:PTN000859153
  - UniProtKB:Q9UMX1
  review:
    summary: Phylogenetic inference from PTHR10928 node PTN000859153, which carries an IBD for cytoplasm
      seeded by Drosophila Su(fu), mouse Sufu and human SUFU.
    action: ACCEPT
    reason: 'Accepted as the primary site of the core activity. Sequestration is definitionally a statement
      about location: SUFU holds GLI1/2/3 in the cytoplasm and thereby blocks their nuclear translocation,
      so the cytoplasmic pool is where the molecular function is executed. All five curated GO-CAM models
      that contain SUFU place its protein sequestering activity in the cytoplasm, and the PTHR10928 node
      carries an IBD for this term. The IBA is a node assertion rather than a pairwise transfer, and the
      appearance of human SUFU in its own WITH/FROM reflects that its experimental localisation helped
      place the node.'
    supported_by:
