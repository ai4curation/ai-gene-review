- term:
    id: GO:0005654
    label: nucleoplasm
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: An immunofluorescence-based localisation (GO_REF:0000052, the Human Protein Atlas curation
