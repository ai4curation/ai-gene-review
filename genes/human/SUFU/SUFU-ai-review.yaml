      nevertheless a downstream tissue-level consequence of SUFU restraining GLI activity in a particular
      cell type, not a distinct thing SUFU does: the molecular event is the same GLI-sequestering step
      already annotated, read out through an osteogenic differentiation assay. SUFU has no osteoblast-specific
      mechanism and no bone-restricted partner in the record. This is the standard treatment for the developmental
      outputs of a pleiotropic signalling regulator.'
