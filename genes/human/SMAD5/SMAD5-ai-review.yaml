suggested_questions:
- question: Which human BMP target loci are driven redundantly by SMAD1 and SMAD5, and which require a SMAD5-containing
    complex?
  experts: []
- question: Which submitochondrial compartment contains the reported mitochondrial SMAD5 pool, and does that pool have a
    direct molecular activity or represent a stimulus-specific inactive reservoir?
  experts: []
suggested_experiments:
- hypothesis: SMAD5-containing complexes bind a distinct subset of BMP-responsive enhancers from otherwise similar SMAD1
    complexes.
  description: Use endogenous SMAD5 and SMAD1 CUT&RUN after BMP4 stimulation in a human BMP-responsive cell type, then
    pair acute SMAD5 or SMAD1 degradation with nascent RNA-seq to separate redundant target binding from targets that
    specifically require SMAD5.
- hypothesis: Mitochondrial SMAD5 is a regulated noncanonical pool distinct from the nuclear BMP-transcriptional
    effector state.
  description: Perform endogenous SMAD5 proximity labeling and submitochondrial protease-protection assays before and
    after BMP stimulation in chondrogenic cells to test whether SMAD5 is imported, surface-associated, or contaminating
    a crude mitochondrial fraction.
