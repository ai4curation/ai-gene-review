id: Q99717
gene_symbol: SMAD5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SMAD5 is a BMP-branch receptor-regulated SMAD transcription factor. BMP-family type I serine/threonine kinase
  receptors phosphorylate SMAD5, enabling it to form SMAD4-containing complexes that accumulate in the nucleus, bind BMP-responsive
  cis-regulatory DNA through the MH1 domain, and regulate RNA polymerase II transcription. SMAD5 also has a non-phosphorylated
  cytoplasmic pH-sensing role that binds hexokinase 1 to promote glycolysis, and it contributes to AMH, developmental, and
  noncanonical miRNA-processing contexts.'
