  - statement: The reviewed UniProt entry identifies SMAD5 as a BMP-activated receptor-regulated SMAD with MH1 and MH2
      domains, SMAD4 complex formation, cytoplasmic and nuclear states, a reported mitochondrial pool, and a
      non-phosphorylated cytoplasmic HK1-linked glycolysis function.
    supporting_text: Non-phosphorylated SMAD5 has a cytoplasmic role in energy metabolism
