    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P97454
  - ensembl:ENSMUSP00000105502
  review:
    summary: SMAD5-dependent repression is a contextual transcriptional output.
    action: KEEP_AS_NON_CORE
    reason: The Ensembl IEA is retained as a broad contextual negative Pol II regulation claim, and human granulosa-cell
      SMAD5 knockdown raises Fas/FasL protein and apoptotic markers, but the DNA-binding Pol II repressor MF row remains
      undecided because these perturbation data do not directly establish DNA-bound SMAD5 repression.
    supported_by:
    - reference_id: PMID:26400397
      supporting_text: knocking down SMAD5 expression increased the rate of apoptosis, as well as the levels of Fas,
        FasL, cleaved caspase-8, and cleaved caspase-3 protein
