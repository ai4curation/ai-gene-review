- description: Acyl-CoA-dependent monolysocardiolipin reacylation to cardiolipin. Full-length recombinant
    HADHA transfers linoleoyl, oleoyl or palmitoyl groups to MLCL, with highest measured activity for
    linoleoyl-CoA in PMID:23152787. The tested other lysophospholipids showed no detectable activity;
    the broader molecular-function term does not imply use of every lysophospholipid. Human cardiomyocyte
    mutant phenotypes support involvement in cardiolipin remodeling, while mechanistic separation from
    beta-oxidation and the proposed relationship to tafazzin need further testing. The full-length enzyme
    is distinct from the previously described N-terminally truncated MLCLAT1 protein.
  supported_by:
