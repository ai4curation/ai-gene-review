      supporting_text: employing 2-enoyl-CoA hydratase (ECH), 3-hydroxyl-CoA dehydrogenase (HAD), and
        3-ketothiolase (KT) activities consecutively.
      full_text_unavailable: true
    - reference_id: PMID:1550553
      supporting_text: None of these enzymes show activity with C4 substrates but all are active with
