id: P40939
gene_symbol: HADHA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HADHA encodes the alpha subunit of mitochondrial trifunctional protein, which associates
  with HADHB in an alpha2-beta2 complex on the matrix face of the mitochondrial inner membrane. HADHA
  catalyzes enoyl-CoA hydration and NAD+-dependent 3-hydroxyacyl-CoA oxidation, two successive reactions
  of fatty acid beta-oxidation; HADHB supplies the subsequent thiolase activity. The human membrane-associated
  enzyme favors medium- and long-chain substrates, with measured activity on C6 and longer substrates
  and maximal dehydrogenase activity at C10–C16. Full-length HADHA also catalyzes acyl-CoA-dependent reacylation
  of monolysocardiolipin to cardiolipin, linking fatty acid oxidation with mitochondrial membrane lipid
  remodeling. HADHA deficiency disrupts fatty acid oxidation and cardiolipin composition in human cardiomyocytes.
  Biallelic pathogenic variants can cause isolated long-chain 3-hydroxyacyl-CoA dehydrogenase deficiency
  or mitochondrial trifunctional protein deficiency.
