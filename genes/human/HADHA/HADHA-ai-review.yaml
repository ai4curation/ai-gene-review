    label: mitochondrial fatty acid beta-oxidation multienzyme complex
- description: NAD+-dependent 3-hydroxyacyl-CoA dehydrogenase activity catalyzes the third reaction of
    mitochondrial fatty acid beta-oxidation. Human alpha-subunit expression establishes the catalytic
    assignment; the purified human complex has maximal measured dehydrogenase activity at C10-C16 and
    also processes C6 substrates. Long-chain activity is a core capability rather than an exclusive chain-length
    range.
  supported_by:
