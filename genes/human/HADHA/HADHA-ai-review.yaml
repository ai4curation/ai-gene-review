suggested_questions:
- question: Can the HADHA GO:0052816/PMID:22586271 assertion and GO-CAM 67b1629100002092 activity 67b1629100002145
    be reconciled with the original experimental record? The model gives tetralinoleoyl cardiolipin as
    output, whereas this hydrolase term produces fatty acid and CoA. Does the unresolved activity/reference/output
    mapping instead concern MLCL reacylation? The unavailable supplementary evidence should be checked
    before assigning a source defect.
- question: Which residues mediate full-length HADHA MLCL acyltransferase activity, and can this activity
    be separated genetically from hydration/dehydrogenation without destabilizing the complex? What establishes
    its relationship to tafazzin in vivo?
- question: What supports HADHA association with nucleoid preparations, and is there a reproducible function
    beyond proximity to the mitochondrial inner membrane? Current purification evidence does not establish
    direct nucleic-acid binding.
suggested_experiments:
- description: Reconstitute recombinant HADHA alone and as the alpha2-beta2 complex with HADHB and assay
    enoyl-CoA hydratase and 3-hydroxyacyl-CoA dehydrogenase activities across a chain-length series (C4-C20)
    to quantitatively define substrate specificity.
  hypothesis: Chain-length response profiles will distinguish preference from absolute substrate exclusion
    and may differ between isolated alpha subunit and assembled complex; the outcome should be measured
    rather than presupposing a C10 threshold.
- description: Test whether the MLCL acyltransferase / cardiolipin remodeling activity of HADHA can be
    genetically separated from its hydratase/dehydrogenase activities using active-site point mutants
    in HADHA-deficient cardiomyocytes.
  hypothesis: Mutants that preserve folding and complex assembly may separate MLCL reacylation from beta-oxidation
    activities; a failure to separate them would also constrain the mechanistic model.
