- term:
    id: GO:0003985
    label: acetyl-CoA C-acetyltransferase activity
  evidence_type: TAS
  original_reference_id: PMID:8135828
  qualifier: enables
  review:
    summary: GO:0003985 describes the C4 acetyl-CoA/acetoacetyl-CoA thiolase reaction. Human alpha-subunit
      expression establishes hydratase and dehydrogenase activities, whereas the beta subunit provides
      long-chain thiolase activity (PMID:8135828).
    action: REMOVE
    reason: 'The subunit-specific expression evidence and structural assignment do not support thiolase
      catalysis by HADHA. In addition, the purified human complex lacked activity with C4 substrates (PMID:1550553).
      These are positive biochemical distinctions, not an inference from a paper title. Do not automatically
      transfer GO:0003985 to HADHB: this particular term has a C4 reaction scope, distinct from long-chain
      thiolysis.'
    supported_by:
    - reference_id: PMID:8135828
      supporting_text: Expression of this cDNA in mammalian cells yielded a polypeptide with the long-chain
        enoyl-CoA hydratase and long-chain 3-hydroxyacyl-CoA dehydrogenase activities.
      full_text_unavailable: true
