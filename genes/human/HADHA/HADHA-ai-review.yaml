- term:
    id: GO:0052816
    label: long-chain fatty acyl-CoA hydrolase activity
  evidence_type: IDA
  original_reference_id: PMID:22586271
  qualifier: enables
  review:
    summary: The current UniProt/GOA IDA assertion for HADHA cites PMID:22586271. The accessible original
      main article assays recombinant THEM4/THEM5 and THEM5 mutants; it also mentions MLCLAT1 in a pathway
      diagram. The complete supplement could not be inspected, so the earlier categorical wrong-gene conclusion
      is not established.
    action: UNDECIDED
    reason: The retained cache omits Methods and Results despite its full-text flag. Original main-text
      inspection did not resolve the HADHA assay, and supplement access failed. MLCLAT1 pathway context
      is not an assay of canonical full-length HADHA. Moreover, GO-CAM 67b1629100002092 assigns HADHA
      this same hydrolase term and PMID while giving tetralinoleoyl cardiolipin as output; GO:0052816
      instead describes fatty acyl-CoA hydrolysis to fatty acid and CoA. This warrants curator clarification
      of the activity/reference/output mapping. Preserve the original assertion and use UNDECIDED rather
      than asserting a definite gene-product error.
    supported_by:
    - reference_id: PMID:22586271
      supporting_text: Here, we present a structural and functional analysis of a new mammalian mitochondrial
        thioesterase, Them5.
