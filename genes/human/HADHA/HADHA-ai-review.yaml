core_functions:
- description: HADHA catalyzes the second reaction of mitochondrial fatty acid beta-oxidation, hydrating
    (2E)-enoyl-CoA to (3S)-3-hydroxyacyl-CoA within mitochondrial trifunctional protein. GO:0018812 names
    the reversible reaction in its dehydration direction; physiological beta-oxidation uses reverse hydration.
    Medium/long-chain preference does not imply an absolute C10–C16 cutoff.
  supported_by:
  - reference_id: PMID:8135828
    supporting_text: Expression of this cDNA in mammalian cells yielded a polypeptide with the long-chain
      enoyl-CoA hydratase and long-chain 3-hydroxyacyl-CoA dehydrogenase activities.
    full_text_unavailable: true
  - reference_id: PMID:30850536
    supporting_text: employing 2-enoyl-CoA hydratase (ECH), 3-hydroxyl-CoA dehydrogenase (HAD), and 3-ketothiolase
      (KT) activities consecutively.
    full_text_unavailable: true
  molecular_function:
    id: GO:0018812
    label: 3-hydroxyacyl-CoA dehydratase activity
