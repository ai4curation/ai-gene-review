- id: PMID:1550553
  title: Human liver long-chain 3-hydroxyacyl-coenzyme A dehydrogenase is a multifunctional membrane-bound
    beta-oxidation enzyme of mitochondria.
  findings:
  - statement: The purified human liver mitochondrial complex has hydratase, dehydrogenase and thiolase
      activities. It is active with C6 and longer substrates, has maximal measured dehydrogenase activity
      at C10-C16, and lacks C4-substrate activity. Subunit-specific assignment comes from the later expression
      study PMID:8135828.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Retained PubMed abstract explicitly distinguishes activity with C6 and longer substrates
      from maximal activity at C10-C16. Do not turn preference into exclusion of other chain lengths.
      Full article remains unavailable in the cache.
- id: PMID:8135828
  title: Structural analysis of cDNAs for subunits of human mitochondrial fatty acid beta-oxidation trifunctional
    protein.
  findings:
  - statement: Definitive subunit-activity assignment. Expression of the alpha-subunit cDNA yielded long-chain
      enoyl-CoA hydratase and long-chain 3-hydroxyacyl-CoA dehydrogenase activities; expression of the
      beta-subunit cDNA yielded only long-chain 3-ketoacyl-CoA thiolase activity.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. The key reference establishing that HADHA carries hydratase + dehydrogenase
