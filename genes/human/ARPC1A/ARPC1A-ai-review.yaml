core_functions:
- description: >-
    ARPC1A is an interchangeable WD-repeat subunit of the Arp2/3 complex. Within
    ARPC1A-containing complexes it contributes to WASP/WAVE-stimulated actin-branch
    nucleation and cortical actin cytoskeleton organization.
  molecular_function:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  in_complex:
    id: GO:0005885
    label: Arp2/3 protein complex
  directly_involved_in:
  - id: GO:0034314
    label: Arp2/3 complex-mediated actin nucleation
  - id: GO:0030866
    label: cortical actin cytoskeleton organization
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0015629
    label: actin cytoskeleton
  supported_by:
  - reference_id: PMID:26655834
    supporting_text: We found that Arp2/3 complexes containing ARPC1B and ARPC5L are significantly
      better at promoting actin assembly than those with ARPC1A and ARPC5
    full_text_unavailable: true
  - reference_id: Reactome:R-HSA-2029466
    supporting_text: Once activated, the ARP2/3 complex nucleates new actin filaments that
      extend from the sides of pre-existing mother actin filaments at a 70-degree angle to
      form Y-branched networks
suggested_questions:
- question: >-
    Which human cell types assemble ARPC1A-containing versus ARPC1B-containing Arp2/3 complexes
    in the nucleus, endocytic actin networks and other specialized locations?
  experts:
  - Arp2/3 complex isoform specialists
suggested_experiments:
- description: >-
    Use endogenous, isoform-specific ARPC1A and ARPC1B tags in matched cell lines to map their
    incorporation into cytosolic and nuclear Arp2/3 complexes after endocytic, protrusive and
    DNA-damage stimuli.
  hypothesis: >-
    ARPC1A-containing Arp2/3 complexes occupy overlapping cytoplasmic actin networks with ARPC1B
    but differ in a subset of stimulus- or compartment-specific assemblies.
  experiment_type: Endogenous tagging and isoform-specific proteomics/localization
