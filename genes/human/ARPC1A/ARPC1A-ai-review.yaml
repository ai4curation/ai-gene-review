    label: actin binding
  evidence_type: TAS
  original_reference_id: PMID:8978670
  qualifier: enables
  review:
    summary: The old Sop2Hs citation does not establish direct human ARPC1A actin binding.
    action: UNDECIDED
    reason: >-
      PMID:8978670 identified the human SOP2 Hs cDNA and showed conservation with fission-yeast
      Sop2p, but the cached paper reports the Arp3p/profilin/actin interaction for the yeast
      Sop2p complex. ARPC1A almost certainly contributes to Arp2/3 mother-filament engagement
      as a complex member, but the inspected source does not resolve an isolated ARPC1A actin-binding
      activity. Leave this molecular-function row UNDECIDED rather than converting a conserved
      subunit relationship into a direct enables assertion.
    supported_by:
    - reference_id: PMID:8978670
      supporting_text: Biochemical analyses demonstrate that Sop2p is present in a complex which
        also contains the actin-related protein, Arp3p.
      full_text_unavailable: true
    - reference_id: file:human/ARPC1A/ARPC1A-notes.md
      supporting_text: The old SOP2 Hs paper supports human ARPC1A family conservation and
        fission-yeast Sop2p complex biology, not a direct actin-binding assay on human ARPC1A.
