id: Q92747
gene_symbol: ARPC1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ARPC1A is a WD-repeat p41 subunit that can replace ARPC1B within the seven-subunit
  Arp2/3 complex. ARPC1A-containing complexes support branched actin filament
  nucleation and cytoskeletal remodeling, but in the mammalian isoform comparison
  they promote actin assembly less strongly than ARPC1B/ARPC5L-containing complexes
  and are not stabilized by cortactin against coronin-mediated disassembly to the
  same extent.
alternative_products:
- name: '1'
  id: Q92747-1
- name: '2'
  id: Q92747-2
  sequence_note: VSP_056389, VSP_056390
existing_annotations:
- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: IC
  original_reference_id: PMID:26655834
  qualifier: enables
  review:
    summary: ARPC1A is a structural subunit of an actin-nucleating Arp2/3 complex.
    action: NEW
    reason: >-
      GOA lacks the structural-constituent term that ARPC1B already carries for the p41 Arp2/3
      subunit role. PMID:26655834 supports mammalian ARPC1A-containing Arp2/3 complexes as
      assembled complexes that promote actin assembly in cells and in vitro, justifying a
      conservative inferred structural-constituent annotation for ARPC1A within the Arp2/3
      cytoskeletal complex.
    supported_by:
    - reference_id: PMID:26655834
      supporting_text: We found that Arp2/3 complexes containing ARPC1B and ARPC5L are significantly
        better at promoting actin assembly than those with ARPC1A and ARPC5
      full_text_unavailable: true
- term:
