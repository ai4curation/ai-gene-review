    - reference_id: PMID:15866167
      supporting_text: Here we show that GEF-H1/Lfc, a guanine nucleotide exchange factor for RhoA, directly interacts with cingulin, a junctional adaptor. Cingulin binding inhibits RhoA activation and signaling, suggesting that the increase in cingulin expression in confluent cells causes downregulation of RhoA by inhibiting GEF-H1/Lfc.
