- term:
    id: GO:0000132
    label: establishment of mitotic spindle orientation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q60875
  - ensembl:ENSMUSP00000029694
  review:
    summary: Cortical/precerebellar neurodevelopmental role (establishment of mitotic spindle orientation, IEA, GO_REF:0000107).
    action: KEEP_AS_NON_CORE
    reason: Genetic knockdown in embryonic mouse cortex (PMID:19448628) and homozygous human ARHGEF2 loss-of-function mutation recapitulated in Arhgef2-mutant mice (PMID:28453519) demonstrate that spindle-associated GEF-H1/Lfc regulates radial precursor mitotic spindle orientation, asymmetric neurogenic division, neuronal differentiation, and precerebellar neuron migration via RhoA/ROCK/MLC. Retained as downstream developmental manifestations of core microtubule-coupled RhoGEF activity.
    supported_by:
    - reference_id: PMID:19448628
      supporting_text: Moreover, Lfc and Tctex-1 were required to determine the orientation of mitotic precursor cell divisions in vivo.
- term:
    id: GO:0000902
    label: cell morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:11912491
  qualifier: involved_in
  review:
    summary: Cell morphogenesis (IMP, PMID:11912491) downstream of GEF-H1/Lfc-driven RhoA actomyosin remodeling.
    action: KEEP_AS_NON_CORE
    reason: Microtubule-released GEF-H1/Lfc drives RhoA-dependent contractile cell shape remodeling in fibroblasts/epithelial cells (PMID:11912491) and dendritic spine morphogenesis in neurons (PMID:15996550); retained as a non-core cellular-level outcome of RhoA/F-actin regulation.
    supported_by:
    - reference_id: PMID:11912491
      supporting_text: Here we show that the Rho guanine nucleotide exchange factor (GEF)-H1 is regulated by an interaction with microtubules. GEF-H1 mutants that are deficient in microtubule binding have higher activity levels than microtubule-bound forms.
- term:
    id: GO:0002102
    label: podosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q60875
  - ensembl:ENSMUSP00000029694
  review:
    summary: Podosome localization / negative regulation of podosome assembly (IEA, GO_REF:0000107) via ASAP1 BAR-domain binding.
    action: KEEP_AS_NON_CORE
    reason: Shiba and Randazzo (PMID:21352810) demonstrated that endogenous mouse GEF-H1 binds the BAR domain of ASAP1, colocalizes at Src-induced podosomes in NIH 3T3 fibroblasts, and negatively regulates podosome assembly rate upon siRNA knockdown or overexpression. Retained as a specialized cell-type/structure-specific role.
    supported_by:
    - reference_id: PMID:21352810
      supporting_text: We validated the interaction of endogenous GEFH1 with ASAP1 by immunoprecipitation, and found GEFH1 colocalized with ASAP1 in podosomes.
