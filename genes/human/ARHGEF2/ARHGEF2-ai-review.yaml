  review:
    summary: Bicellular tight junction localization (IEA, GO_REF:0000044) in polarized epithelia.
    action: ACCEPT
    reason: In polarized mammalian epithelial monolayers and mouse blastocyst trophectoderm, endogenous GEF-H1/Lfc is recruited to bicellular tight junctions via direct binding to cingulin and paracingulin/JACOP, sequestering GEF-H1 to downregulate junctional RhoA and control paracellular permeability (PMID:12604587, PMID:15866167).
    supported_by:
    - reference_id: PMID:12604587
