id: Q92974
gene_symbol: ARHGEF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARHGEF2 (GEF-H1; also known as Lfc) is a 986-residue microtubule-regulated Dbl-homology/pleckstrin-homology (DH/PH) guanine nucleotide exchange factor that couples microtubule organization and epithelial junctional architecture directly to RhoA-subfamily GTPase signaling. Under basal conditions, ARHGEF2 is sequestered in an autoinhibited state on interphase microtubules, mitotic spindles, or cingulin/paracingulin-containing bicellular tight junctions through direct docking of its N-terminal C1 zinc-finger domain (residues 39-86, including Cys53) onto the microtubule lattice together with C-terminal coiled-coil and 14-3-3-binding determinants (gated by PAK1/Aurora/PKA phosphorylation at Ser886). Microtubule depolymerization, pre-anaphase dephosphorylation, or stimulatory ERK1/2 phosphorylation (Thr679) releases active ARHGEF2 to catalyze GDP-to-GTP exchange on RhoA (and RhoB/RhoC, without intrinsic exchange activity toward Rac1 or Cdc42), driving ROCK-myosin II actomyosin contractility, stress fiber assembly, cleavage furrow ingression, neural progenitor spindle orientation, and epithelial barrier remodeling, alongside specialized scaffolding roles in NOD1/NOD2/RLR innate immune and KSR1-PP2A signaling.
