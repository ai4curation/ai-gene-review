- term:
    id: GO:0014069
    label: postsynaptic density
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q60875
  - ensembl:ENSMUSP00000029694
  review:
    summary: Neuronal/synaptic compartmentalization (postsynaptic density, IEA, GO_REF:0000107) of Lfc/GEF-H1.
    action: KEEP_AS_NON_CORE
    reason: In mammalian central neurons, Lfc/GEF-H1 resides on microtubules in the neuronal soma and dendritic shaft under basal conditions and translocates into glutamatergic dendritic spines and the postsynaptic density (associating with neurabin/spinophilin and AMPA receptor GluR1 complexes, and detected in synaptosomal phosphoproteomics) upon synaptic activity (PMID:15996550, PMID:17114649, PMID:19208802). Retained as specialized neuronal sub-compartmentalization.
