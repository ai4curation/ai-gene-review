core_functions:
- description: Catalyzes GDP-to-GTP exchange selectively on RhoA-subfamily GTPases via its tandem DH/PH module upon release from microtubule or tight-junction sequestration, driving positive regulation of RhoA-ROCK-actomyosin signaling and actin filament organization.
  molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  directly_involved_in:
  - id: GO:0035025
    label: positive regulation of Rho protein signal transduction
  - id: GO:0007015
    label: actin filament organization
  locations:
  - id: GO:0005874
    label: microtubule
  - id: GO:0005819
    label: spindle
  - id: GO:0005923
    label: bicellular tight junction
  substrates:
  - id: UniProtKB:P61586
    label: RHOA
  supported_by:
  - reference_id: PMID:8910315
    supporting_text: We show here that Lfc and Lsc, like their closest relative Lbc, are highly specific guanine nucleotide exchange factors (GEFs) for Rho, causing a >10-fold stimulation of [3H]GDP dissociation from Rho and a marked stimulation of GDP-[35S]GTPgammas (guanosine 5'-O-(3-thiotriphosphate) exchange.
  - reference_id: PMID:18287519
    supporting_text: Furthermore, the nocodazole-induced activation of RhoA and Rho-associated kinase (ROCK) that mediates phosphorylation of myosin regulatory light chain (MLC) is impaired in GEF-H1-depleted cells. Conversely, RhoA activation and contractility are rescued by reintroduction of siRNA-resistant GEF-H1.
  - reference_id: PMID:41365297
    supporting_text: We show that specific features of the microtubule lattice bind the C1 domain of GEFH1, leading to the sequestration and inactivation of this signaling protein. Targeted mutations in C1 residues disrupt this interaction, triggering GEFH1 release and activation of RhoA-dependent immune responses.
  - reference_id: file:human/ARHGEF2/ARHGEF2-deep-research-affinage.md
    supporting_text: ARHGEF2 (GEF-H1/Lfc) is a Dbl-family guanine nucleotide exchange factor that catalytically and specifically activates RhoA (and to a lesser extent Rac1) to drive actin stress fiber formation, cell contractility, mitotic spindle assembly, epithelial barrier regulation, and innate immune signaling [PMID:8910315, PMID:9857026, PMID:9890991].
- description: Directly binds the microtubule lattice via its N-terminal Zn2+-coordinating C1 domain (Cys53) and C-terminal flanking region, sequestering and autoinhibiting GEF-H1 until microtubule depolymerization or kinase/phosphatase switching triggers release.
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  directly_involved_in:
  - id: GO:0035025
    label: positive regulation of Rho protein signal transduction
  locations:
  - id: GO:0005874
    label: microtubule
  - id: GO:0005819
    label: spindle
  supported_by:
  - reference_id: PMID:11912491
    supporting_text: Here we show that the Rho guanine nucleotide exchange factor (GEF)-H1 is regulated by an interaction with microtubules. GEF-H1 mutants that are deficient in microtubule binding have higher activity levels than microtubule-bound forms.
  - reference_id: PMID:41365297
    supporting_text: We show that specific features of the microtubule lattice bind the C1 domain of GEFH1, leading to the sequestration and inactivation of this signaling protein. Targeted mutations in C1 residues disrupt this interaction, triggering GEFH1 release and activation of RhoA-dependent immune responses.
suggested_questions:
- question: How do the C-terminal coiled-coil/14-3-3 phospho-Ser886 (Ser885) region and the N-terminal C1 zinc-finger domain cooperate sterically on intact microtubules to occlude the catalytic DH/PH RhoA-binding surface?
  experts:
  - Michel O. Steinmetz, cryo-EM structure of microtubule-bound GEF-H1 C1 domain
  - Gary M. Bokoch / Celine DerMardirossian, GEF-H1 microtubule and 14-3-3 regulation
- question: What structural determinants allow non-catalytic nucleotide-independent Rac1 binding to Lfc/GEF-H1 without permitting GDP-to-GTP exchange on Rac1?
  experts:
  - Richard A. Cerione, Lbc/Lfc/Lsc Rho-subfamily GTPase specificity
  - Karl Matter, epithelial tight-junction and stress signaling by GEF-H1
suggested_experiments:
- description: Determine a cryo-EM structure of full-length 14-3-3-bound phospho-Ser886 ARHGEF2 docked onto GDP-taxol microtubules to resolve how the C1 anchor and C-terminal 14-3-3 dimer jointly autoinhibit the central DH/PH cassette.
- description: Compare RhoA-biosensor FRET dynamics and innate-immune RIPK2/MAVS signaling in knock-in cells carrying C53R (microtubule-unbound, GEF-active) versus Y394A (microtubule-bound, GEF-dead) mutations at the endogenous locus to separate catalytic RhoA exchange from non-catalytic scaffolding.
