- id: PMID:26820534
  title: Crystal structure of hGEF-H1 PH domain provides insight into incapability in phosphoinositide binding.
  findings:
  - statement: Solves the 2.45-angstrom crystal structure of the human ARHGEF2 PH domain (PDB 5EFX) and proves by ITC and thermal shift assay that steric closure between the beta3/beta4 and beta6/beta7 loops prevents phosphoinositide binding.
    supporting_text: Here we report the crystal structure of human GEF-H1 PH domain to 2.45 Å resolution. A conserved surface is formed by β8, β9, β10, and it may mediate protein-protein interactions. Although the folding resembles other PH domains that have defined structures, superposition of different PH domains clearly shows that the loop between β6/β7 and the loop between β3/β4 are so close that they will prevent its binding with phosphoinositide due to steric hindrance, and this has been proved by isothermal titration calorimetry (ITC) and thermal shift assay (TSA).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Explains structurally why ARHGEF2's PH domain mediates protein-protein interactions rather than phosphoinositide binding; missed by Affinage.
- id: PMID:41365297
  title: Structural basis of microtubule-mediated signal transduction.
  findings:
  - statement: Cryo-EM and NMR structures reveal how the N-terminal C1 zinc-finger domain of GEF-H1 binds directly to the microtubule lattice to sequester and autoinhibit GEF-H1, with targeted C1 mutations triggering release and RhoA-dependent signaling.
    supporting_text: We show that specific features of the microtubule lattice bind the C1 domain of GEFH1, leading to the sequestration and inactivation of this signaling protein. Targeted mutations in C1 residues disrupt this interaction, triggering GEFH1 release and activation of RhoA-dependent immune responses.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Resolves the structural mechanism of microtubule-mediated sequestration of GEF-H1; missed by Affinage.
