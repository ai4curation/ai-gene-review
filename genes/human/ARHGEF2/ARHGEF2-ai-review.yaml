- id: file:human/ARHGEF2/ARHGEF2-deep-research-affinage.md
  title: Affinage mechanistic annotation for ARHGEF2 (human)
  findings:
  - statement: Synthesizes microtubule-sequestration gating of ARHGEF2 RhoA-ROCK-myosin II signaling, tight-junction cingulin/paracingulin regulation, innate immune NOD1/NOD2/RLR/STING scaffolding, KSR1-PP2A adaptor function, and NEDMHM disease.
    supporting_text: ARHGEF2 (GEF-H1/Lfc) is a Dbl-family guanine nucleotide exchange factor that catalytically and specifically activates RhoA (and to a lesser extent Rac1) to drive actin stress fiber formation, cell contractility, mitotic spindle assembly, epithelial barrier regulation, and innate immune signaling [PMID:8910315, PMID:9857026, PMID:9890991].
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Passed blocking trust gates (accession Q92974, human, self_evaluation_pairwise: win, 64 citations). Strengths: broad literature synthesis across 64 papers spanning RhoA activation, mitotic/interphase kinase phosphoregulation, tight-junction sequestration, macrophage NOD1/NOD2/RLR innate immune signaling, KSR1-PP2A oncogenic RAS signaling, and human neurodevelopmental disorder (PMID:28453519). Weaknesses causing DISPUTED grading: (1) structured molecular_activity is emitted as ''*(none)*'', completely omitting GO:0005085 guanyl-nucleotide exchange factor activity; (2) misses both experimental structures of human ARHGEF2—the 2.45-angstrom PH domain crystal structure explaining lack of phosphoinositide binding (PDB 5EFX, PMID:26820534) and the cryo-EM/NMR microtubule-bound C1 domain structures (PDB 9H1O/9H75, PMID:41365297)—and consequently states in its summary that microtubule binding occurs ''through its C-terminal coiled-coil region'', omitting the essential N-terminal C1 zinc-finger lattice-docking domain (Cys53, PMID:11912491, PMID:41365297); (3) mixes three incompatible residue coordinate frames without warning—86-aa-truncated KIAA0651/BAA31626 numbering (''Ser810'' from PMID:15827085, which is Gln810 in canonical Q92974-1 and maps to Ser896), 985-aa Q92974-2 numbering (Ser885, Thr678, Ser959), and 986-aa canonical Q92974-1 numbering (Ser886, Ser645, Ser151); and (4) asserts in its opening sentence that ARHGEF2 ''catalytically and specifically activates RhoA (and to a lesser extent Rac1)'' despite purified-protein assays in PMID:8910315 showing zero Rac1 exchange activity.'
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: OTHER
