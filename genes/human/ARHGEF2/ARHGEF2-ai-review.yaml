- id: PMID:11912491
  title: Nucleotide exchange factor GEF-H1 mediates cross-talk between microtubules and the actin cytoskeleton.
  findings:
  - statement: 'Establishes that GEF-H1 links microtubule dynamics to Rho-dependent actin stress fiber assembly: N-terminal C1 (C53R) or C-terminal microtubule-binding-deficient mutants are constitutively active, whereas the DH-domain CR3 mutant Y393A (canonical Tyr394) acts as a catalytically inactive dominant negative.'
    supporting_text: Here we show that the Rho guanine nucleotide exchange factor (GEF)-H1 is regulated by an interaction with microtubules. GEF-H1 mutants that are deficient in microtubule binding have higher activity levels than microtubule-bound forms.
    residue_mappings:
    - as_reported:
        accession: UniProtKB:Q92974-2
        position: 393
        residue: Y
        sequence_version: 4
      canonical:
        accession: UniProtKB:Q92974
        position: 394
        residue: Y
        sequence_version: 4
      note: Krendel et al. number dominant-negative Y393A on the 985-aa isoform Q92974-2 (lacking Ala194), mapping to Tyr394 in canonical 986-aa Q92974.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Landmark paper establishing microtubule-sequestration gating of GEF-H1.
- id: PMID:14970201
  title: p21-activated kinase 1 phosphorylates and regulates 14-3-3 binding to GEF-H1, a microtubule-localized Rho exchange factor.
  findings:
  - statement: PAK1 phosphorylates human GEF-H1 at Ser885 (canonical Ser886 in RRRSLP) to recruit 14-3-3 proteins to microtubules.
    supporting_text: We show that phosphorylation of GEF-H1 at Ser(885) by PAK1 induces 14-3-3 binding to the exchange factor and relocation of 14-3-3 to microtubules.
    residue_mappings:
    - as_reported:
        accession: UniProtKB:Q92974-2
        position: 885
        residue: S
        sequence_version: 4
      canonical:
        accession: UniProtKB:Q92974
        position: 886
        residue: S
        sequence_version: 4
      note: Ser885 in 985-aa isoform Q92974-2 corresponds to Ser886 in canonical 986-aa Q92974 (and Ser885 in 985-aa mouse Q60875 and rat Q5FVC2).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Defines the SF20-conserved 14-3-3-docking phosphoserine switch.
