      asserted_value: '*(none)*'
      corrected_value: GO:0005085
      corrected_label: guanyl-nucleotide exchange factor activity
      cause: OTHER
      confidence: CONFIRMED
      explanation: Affinage emitted an empty molecular_activity field ('*(none)*') for ARHGEF2 even though its own summary identifies ARHGEF2 as a catalytic RhoA guanine nucleotide exchange factor.
      supported_by:
