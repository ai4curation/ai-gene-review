core_functions:
- description: >-
    Structural subunit of the perinuclear theca of the sperm head. ACTRT2 is one of two major
    acidic proteins of the detergent- and high-salt-resistant cytoskeletal calyx purified from
    mammalian sperm heads, and in developing spermatids it forms a multimeric complex with
    ACTRT1, ACTRT3, ACTL7A and ACTL9 in the subacrosomal layer, as well as binding calicin, the
    apparent organiser of theca assembly. The molecular function is stated as structural
    constituent of cytoskeleton because the perinuclear theca is classified under cytoskeleton
    and ACTRT2 is a bulk component of it by abundance in a purified fraction, not because the
    protein behaves like actin. It does not: of 38 protomer-protomer contact positions computed
    from the F-actin filament, only 14 are identical and 18 differ non-conservatively, the D-loop
    docking triad Met44/Val45/Met47 is replaced by Ser/Ala/Ala, and the residues that couple
    filament incorporation to ATP hydrolysis (Ala108, Pro109, His161) are all lost. The
    nucleotide pocket itself is fully retained - all ten literature-named nucleotide positions
    are identical to actin's - but no nucleotide binding or hydrolysis has ever been measured, so
    no nucleotide function is claimed.
  molecular_function:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  directly_involved_in:
  - id: GO:0007283
    label: spermatogenesis
