    label: cytoskeleton organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      An automatic inter-ontology inference whose sole input is this gene's own GO:0005200 row -
      the WITH/FROM field is literally the GO term GO:0005200 - so it carries no evidence
      independent of that row. That matters here, because this review generalises GO:0005200 to
      GO:0005198, from which no such inter-ontology link runs: the row's machine provenance lapses.
      It survives on the compartment's own classification rather than on the pipeline, since ACTRT2
      is a bulk component of the perinuclear theca and GO places the theca under GO:0005856
      cytoskeleton. ACTRT2 has never been shown to organise or remodel anything.
    action: KEEP_AS_NON_CORE
    reason: >-
      True at this level of generality and not to be removed, but derivative. It is kept rather
      than removed as ACTL7B's identical row was, because there the removal followed from removing
      the GO:0005200 input outright, whereas here that input is generalised rather than deleted and
      the gene really is a component of a structure GO classifies as cytoskeletal. It is not
      refined to GO:0030036 actin cytoskeleton organization as ACTL7A's was, because ACTL7A had a
      measured F-actin phenotype - complete, spatially restricted loss of subacrosomal F-actin in
      the knockout - and ACTRT2 has nothing equivalent; the only actin-remodelling report in this
      clade concerns heterologous expression of Actrt3, not Actrt2. This matches the actions of both
      the merged ACTR10 and merged ACTRT3 reviews on the identical row, and the propagation
      classification follows ACTRT3's, which is the more accurate of the two now that the
      molecular-function input has been generalised. It should not be read as ACTRT2 having a
      demonstrated cytoskeletal-remodelling role. If a specific process term is ever warranted it
      will come from the theca literature, and the concrete route to it is the annotation gap
      recorded in suggested_questions.
    propagation_review:
      root_cause: EVIDENCE_CIRCULAR_OR_REDUNDANT
      failure_modes:
