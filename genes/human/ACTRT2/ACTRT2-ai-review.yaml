      The partner resolves to Q9H2J4 = PDCL3 (phosducin-like protein 3 / PhLP2A, Swiss-Prot, 239
      aa), from BioPlex 3.0 affinity-purification mass spectrometry. This is not screen noise,
      and reading the whole experiment rather than the single imported pair is what shows why.
      IntAct returns 10 records for ACTRT2, all from this one publication and all anti tag coip;
      the nine partners besides PDCL3 include TCP1(CCT1), CCT2, CCT3, CCT6A, CCT6B and CCT7 -
      the CCT/TRiC chaperonin, together with its co-chaperone. Querying PDCL3 itself confirms the
      reading: across all of IntAct it has 91 partners including 12 actin-superfamily proteins
      (ACTA2, ACTB, ACTBL2, ACTG1, ACTR1A, ACTR1B, ACTR2, ACTRT1, ACTRT2, ACTRT3, POTEF, POTEI),
      all nine CCT subunits and three tubulins. So the row records a chaperonin-client contact of
      the pathway that folds the actin fold, shared with beta-actin itself.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept because the interaction is real and mechanistically interpretable rather than an
      unreplicated adventitious hit, and because it corroborates that ACTRT2 is handled by the
      actin folding route despite its divergence. Marked non-core, and not upgraded to an
      informative molecular function, because being a chaperonin substrate is not a molecular
      function of the substrate and GO offers no term for it - the same conclusion the merged
      ACTL7A review reached for its genuine-partner-but-no-term rows, and the same verdict the
      merged ACTR1B review gave to its row from this identical publication. Two caveats recorded
      rather than glossed: all ten records come from one experiment, nine of them spoke-expanded
      at MI-score 0.35 with the PDCL3 pair also present non-expanded at 0.50, so this is one
      co-purification and not ten independent observations; and ACTRT1 and ACTRT3 hit PDCL3 in
      the same experiment, so the finding is about the ACTRT clade rather than about ACTRT2
      specifically, and the same verdict should hold for all three. Separately, ACSL4 appears
      among the nine spoke partners and is also the pro-ferroptotic enzyme reported as
      upregulated in ACTRT2-deficient testis; that coincidence is a hypothesis worth testing,
      not evidence, and it is filed in suggested_experiments rather than annotated.
    supported_by:
