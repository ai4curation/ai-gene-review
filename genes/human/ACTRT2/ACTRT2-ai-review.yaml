- id: file:human/ACTRT2/ACTRT2-deep-research-affinage.md
  title: Affinage mechanistic annotation for ACTRT2 (human)
  findings:
  - statement: >-
      The provider's own GO grounding proposes structural molecule activity together with
      cytoskeletal protein binding as ACTRT2's molecular activity. The first is the parent term
      that PAINT independently chose for the ACTL7A/ACTL7B clade, so it is a third voice for
      pitching the structural claim at the general level; the second is a fold-to-activity leap,
      since no actin-binding or cytoskeletal-protein-binding measurement exists for ACTRT2.
    supporting_text: '**molecular_activity:** GO:0005198 structural molecule activity, GO:0008092
      cytoskeletal protein binding'
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Machine-fetched precomputed research, gates_passed true with 6 citations, used as a lead
      rather than as evidence. Two concrete defects. One of its six citations,
      PMID:bio_10.1101_2025.03.27.645694, is a bioRxiv DOI in a PMID-shaped field rather than a
      PubMed identifier, and nothing in this review rests on it. More importantly it omits
      PMID:35793634, the calicin paper that is the actual source of mouse Actrt2's GO:0033011 IDA
      and of its only curated protein interaction - the paper that both of this gene's
      perinuclear-theca annotations are ultimately transferred from. That was found by querying
      the ortholog's own GOA record, not from the narrative. Its GO grounding is also engaged with
      above rather than imported.
