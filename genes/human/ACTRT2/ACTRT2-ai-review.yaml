        source_label: structural constituent of cytoskeleton
        source_status: CIRCULAR_OR_REDUNDANT
        comment: >-
          The WITH/FROM source of this row is a GO term rather than a gene product, namely this
          gene's own molecular-function IBA, so the process claim inherits whatever support that
          row has and adds none of its own.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:33961781
  qualifier: enables
  review:
    summary: >-
      The partner resolves to Q9H2J4 = PDCL3 (phosducin-like protein 3 / PhLP2A, Swiss-Prot, 239
      aa), from BioPlex 3.0 affinity-purification mass spectrometry. This is not screen noise,
      and reading the whole experiment rather than the single imported pair is what shows why.
      IntAct returns 10 records for ACTRT2 covering 9 distinct partners, all from this one
      publication and all anti tag coip; the eight partners besides PDCL3 are TCP1(CCT1), CCT2,
      CCT3, CCT6A, CCT6B, CCT7, SLC25A19 and ACSL4 - six of them CCT/TRiC chaperonin subunits,
      alongside the chaperonin's co-chaperone. Querying PDCL3 itself confirms the
      reading: across all of IntAct it has 91 partners including 12 actin-superfamily proteins
      (ACTA2, ACTB, ACTBL2, ACTG1, ACTR1A, ACTR1B, ACTR2, ACTRT1, ACTRT2, ACTRT3, POTEF, POTEI),
      all nine CCT subunits and three tubulins. So the row records a chaperonin-client contact of
      the pathway that folds the actin fold, shared with beta-actin itself. Querying QuickGO by
      reference rather than by gene puts a number on how little the term conveys: PMID:33961781 is
      the source of 9,514 GOA annotations, every one of them GO:0005515 and every one assigned by
      IntAct.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This row is byte-identical to ACTRT3's - same publication, same partner Q9H2J4 - and the
      merged ACTRT3 review marked it over-annotated. That verdict is adopted here, and the
      evidence found for this gene strengthens rather than weakens it. ACTRT3's argument was that
      the partner explains the observation away: PDCL3 is a CCT/TRiC co-chaperone that modulates
      cytoskeletal actin folding, actin is an obligate CCT client, and BioPlex was run in HEK293T
      and HCT116, whereas ACTRT2 is testis-enriched by HPA - so co-purification of an
      over-expressed tagged actin-fold polypeptide with the folding machinery is the expected
      behaviour of the assay rather than a physiological partnership. ACTRT3 had to infer the
      chaperonin from PDCL3's identity, having only two IntAct records; ACTRT2 has ten records over
      nine partners, and the eight besides PDCL3 include six CCT subunits, so for this gene the
      holo-chaperonin is directly observed and that inference is confirmed. This follows the merged
      ACTL8, ACTR10 and ACTRT3 reviews rather than the merged ACTR1B review, which kept its row
      from this same publication - the difference being that ACTR1B's partner set was coherent with
      assembled dynactin, its own complex, whereas here the partner set is the folding pathway.
      What survives is modest and is stated as such: the row indicates that the ACTRT2 polypeptide
      is recognised as a foldable actin-fold client. No MODIFY target exists, because being a
      chaperonin substrate is not a molecular function of the substrate. Two further caveats: nine
      of the ten records are spoke-expanded, eight of those at MI-score 0.35 and the PDCL3 spoke
      row at 0.50, with a single further non-expanded PDCL3 record also at 0.50 - so this is one
      co-purification and not ten observations; and ACTRT1 and ACTRT3 hit PDCL3 in the same
      experiment, so the same verdict should hold for all three. Separately, ACSL4 appears among
      the eight non-PDCL3 partners and is also the pro-ferroptotic
      enzyme reported as upregulated in ACTRT2-deficient testis; that coincidence is a hypothesis
      worth testing, not evidence, and it is filed in suggested_experiments rather than annotated.
    supported_by:
    - reference_id: PMID:33961781
      supporting_text: mass spectrometry, we have created two proteome-scale, cell-line-specific
    - reference_id: file:human/ACTRT2/ACTRT2-bioinformatics/RESULTS.md
      supporting_text: 'What that partner interacts with across all of IntAct: **91 partners** in
        156 records.'
