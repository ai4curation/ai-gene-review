      genes, and no equivalent experiment has been reported for Actrt2, so transferring them
      would be complex-membership reasoning rather than evidence. ISS with mouse Actrt2
      (UniProtKB:Q9D9L5, ACTT2_MOUSE, Swiss-Prot, 377 aa) as the supporting entity, because the
      phenotype is murine. Two caveats stated rather than hidden: the in vivo busulfan
      comparison used heterozygotes rather than nulls, and the mechanism the paper argues for -
      protection of spermatogonia from ferroptosis - sits several stages earlier than the
      spermatid stage at which the perinuclear theca forms, so it is not obviously the same
