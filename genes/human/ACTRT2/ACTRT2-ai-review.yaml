- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Generalise to the parent that PAINT itself substituted for the adjacent clade. The WITH/FROM
      field of this row is byte-identical to ACTRT3's (11 of 11 tokens, node PTN000940351) and to
      ACTR10's, and the two merged reviews of those rows disagree: ACTR10 accepted it, ACTRT3
      modified it to GO:0005198. ACTRT3's is the one that governs here, and the reason is a
      checkable fact rather than a preference. ACTR10's ACCEPT rests on yeast ARP10 being ACTR10's
      own ortholog inside the seed set; resolving all ten seeds gives mouse and rat Actg1, human
      ACTB, yeast ACT1, yeast ARP1, yeast ARP10, human ARP2, human ARP3 and two Dictyostelium
      actins - no ARP-T donor of any kind. ACTRT2 therefore has no ortholog-strength donor, and
      the ACTR10 precedent does not transfer to it.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0005198
      label: structural molecule activity
    reason: >-
      What does not transfer from the donors is polymerisation, and this review measured that
      rather than assuming it. Of 38 protomer-protomer contact positions computed from the
      cryo-EM F-actin filament PDB 6DJO, ACTRT2 matches actin at 14 identically and 6
      conservatively with 18 non-conservative changes, and only 2 of the 10 D-loop contacts are
      identical - Pro38 and His40 are lost, the Met44/Val45/Met47 hydrophobic docking triad
      becomes Ser/Ala/Ala, and a proline enters at position 43 inside the loop that must dock
      into the neighbouring protomer. Counting identical positions only - the metric is named because
      a looser one, identical plus conservative, is used elsewhere in this review and the two are
      not interchangeable - that is below every panel member known to build a helical filament
      (lowest is ACTR1A at 20 of 38 identical, with Arp53D at 29 and beta-actin at 37 as positive
      controls). Bounding this honestly, it is NOT below the Arp2/3 subunits, which nucleate a
      filament without extending one (Arp2 15, Arp3 5), so the measurement
      argues against ACTRT2 extending F-actin and does not exclude an Arp2/3-like role, for
      which nothing has ever been proposed. Donor quality is not at issue: all 10
      resolved WITH/FROM sources carry their own experimental evidence for the term, and they
      include yeast ARP1/centractin (P38696, IDA) and yeast ARP10 (Q04549, IPI) alongside the
      conventional actins and Arp2/Arp3, so SOURCE_EVIDENCE_WEAK would be contradicted by
      measurement, so the objection is to propagation rather than to the donors. What the node
      cannot license is the specific child for a member with no ARP-T donor and a protomer
      interface this degenerate, and at the nearest adjudicated neighbour PTN008986528 PAINT did
      not merely reject the child - it substituted the parent GO:0005198 on the same day, which is
      the level adopted here. GO:0005198 is well supported: ACTRT2 contributes to the structural
      integrity of the perinuclear theca's protein scaffold. Three independent sources converge on
      that level - PAINT's substitution for the adjacent clade, the merged ACTRT3 review's MODIFY
      on this byte-identical row, and the precomputed affinage record's own GO grounding.
      An earlier round of this review ACCEPTed the row, arguing that read by its definition rather
      than its label GO:0005200 asks only for a contribution to the structural integrity of a
      cytoskeletal structure, and that ACTRT2 supplies exactly that as one of two major acidic
      components of the purified calyx, the theca being a GO:0005856 descendant. That argument is
      withdrawn as the basis for this row, for the reason the merged ACTRT3 review gives: it would
      license the row on grounds unrelated to the evidence chain the row actually carries, leaving
      the false reading that ACTRT2 is a filament constituent inferred from actin. The evidence
      itself is not withdrawn, and within this set it is ACTRT2's alone - ACTRT3 is not one of
      Heid's two major acidic components, and ACTL7A's review explicitly withdrew a
      residence-based version of the same argument. What the withdrawal costs is worth naming
      precisely, because it is the strongest thing that could have been said for keeping the child:
      ACTRT2 is a bulk constituent of that structure by abundance in a purified fraction and a
      member of a multimeric complex within it, and on GO:0005200's definition alone the enables
      qualifier would have followed established structural-constituent-of practice, as for
      ribosomal proteins. None of that is asserted here as justification for a row being replaced.
      It is carried instead into the open question of whether the theca proteins can re-earn
      GO:0005200 on evidence of their own, which the merged ACTRT3 review raises and to which this
      review contributes the strongest instance.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: MGI:MGI:87906
        source_label: Mus musculus Actg1 (P63260, Swiss-Prot; cross-reference also maps to 4 TrEMBL entries)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Carries its own experimental evidence for the term, earned through filament formation or
          nucleation; the protomer-interface measurement shows that route is not available to ACTRT2, and
          no ARP-T donor is present in the seed set to supply an ortholog-strength inference instead.
      - source_id: PANTHER:PTN000940351
        source_label: PANTHER ancestral node PTN000940351
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: PANTHER internal tree node, not a protein. The single node from which GO:0005200 propagates
          anywhere in PTHR11937; the same term is explicitly negated as an IRD at eight other nodes of the
          family, and this clade has not yet been given a decision. At the nearest adjudicated neighbour,
          PTN008986528, PAINT substituted the parent GO:0005198 on the same day, which is the level this review
          adopts.
      - source_id: RGD:1304556
        source_label: Rattus norvegicus Actg1 (P63259, Swiss-Prot; cross-reference also maps to 1 TrEMBL entry)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Carries its own experimental evidence for the term, earned through filament formation or
