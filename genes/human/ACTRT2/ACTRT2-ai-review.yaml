      G-to-F transition shifts Gln137 and His161 to relocate the attacking and helping waters.
    supporting_text: This mechanical work is driven by the ATPase activity at the catalytic site
      in the F-form.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, no retraction. Abstract only. Corroborates the previous reference on the
      point that matters here, that hydrolysis is a property of the filamentous state, and is
      cited for that alone.
