- id: PMID:37009486
  title: Mutagenic analysis of actin reveals the mechanism of His161 flipping that triggers
    ATP hydrolysis.
  findings:
  - statement: >-
      Actin's ATP hydrolysis is triggered by flipping of the His161 side chain toward ATP, which
      occurs as part of the conformational change from monomeric G-actin to filamentous F-actin.
    supporting_text: Upon polymerization, actin undergoes a conformational change from the
      monomeric G-form to the fibrous F-form, which is associated with the flipping of the side
      chain of His161 toward ATP.
  - statement: >-
      The flip rearranges the active-site waters, including the attacking water W1, into an
      orientation capable of hydrolysis.
    supporting_text: His161 flipping from the gauche-minus to gauche-plus conformation leads to a
      rearrangement of the active site water molecules, including ATP attacking water (W1), into
      an orientation capable of hydrolysis.
  - statement: >-
      Gln137 and His161 are the two active-site residues implicated in actin's hydrolysis, and
      the rotameric state of His161 is governed by the Pro-rich loop at Ala108/Pro109. ACTRT2
      retains Gln137 but has lost His161, Ala108 and Pro109.
    supporting_text: our results support the hypothesis that the rotameric conformation of
      His161, which is a key determinant of the configuration of the active site water molecules
      that catalyze hydrolysis, is governed by the Pro-rich loop.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, no retraction, full text available in the cache. Not about ACTRT2 at all;
      cited to establish what actin's His161 and Pro-rich loop do, so that the residue census in
      the bioinformatics analysis rests on a stated mechanism rather than on a residue name. The
      important consequence, read from the surrounding text rather than the single sentence, is
      that hydrolysis is coupled to filament incorporation - which is why the lost trigger and
      the degenerate protomer interface are one observation, not two.
