- id: file:human/ACTRT2/ACTRT2-bioinformatics/RESULTS.md
  title: 'ACTRT2 bioinformatics: nucleotide site, filament interface, IBA source audit, PAINT
    node audit, interaction and annotation censuses'
  findings:
  - statement: >-
      ACTRT2 is identical to actin at all ten literature-named nucleotide-contacting positions
      (D11, S14, G15, K18, Q137, D154, G156, D157, V159, R183), confirming the 2001
      sequence-inspection claim from structure-derived contacts, while retaining the pocket makes
      nucleotide binding untested rather than demonstrated.
    supporting_text: '**The pocket is intact.** Of the 10 literature-named nucleotide-binding
      positions (D11, S14, G15, K18, Q137, D154, G156, D157, V159, R183), ACTRT2 matches actin at
      **10 identically**, 0 conservatively, 0 non-conservatively.'
  - statement: >-
      All five reported members of the sperm perinuclear-theca ARP complex have lost His161,
      while every panel member that extends or nucleates a filament retains it; ACTL7B, which is
      testis-specific but not a reported complex member, retains it too.
    supporting_text: 'Internal control: ACTL7B is testis-specific but is not a reported member of
      that complex, and it **retains** His161'
  - statement: >-
      ACTRT2's protomer-protomer interface is below every filament builder in the panel but not
      below the Arp2/3 subunits, so the measurement argues against filament extension without
      excluding an Arp2/3-like role.
    supporting_text: So the measurement argues against ACTRT2 extending an F-actin filament; it
      does not exclude an Arp2/3-like role, and no such role has been proposed for it.
  - statement: >-
      Every resolved WITH/FROM source on both IBA rows carries its own experimental evidence for
      the term it donated, so any objection to those rows must concern propagation rather than
      donor quality.
    supporting_text: So any objection to these rows has to be about propagation, not about donor
      quality.
  - statement: >-
      ACTRT2 and ACTRT3 are the only reported perinuclear-theca complex members with no
      experimental biological-process annotation in either human or mouse.
    supporting_text: 'Reported PT-complex members with no experimental biological-process
      annotation in either human or mouse: **ACTRT2, ACTRT3**.'
  - statement: >-
      ACTRT2's GO:0015629 IBA row is byte-identical to ACTL8's and its GO:0005200 IBA row is
      byte-identical to ACTR10's, so those two merged reviews' verdicts are verdicts on the same
      rows and must agree.
    supporting_text: '| ACTL8 | GO:0015629 (IBA) | **True** | 25 / 25 |'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reproducible analysis written for this review; a fresh run of analyze_actrt2.py reproduces
      both RESULTS.md and results.json byte-identically. Guards were tested by breaking them - a
      deliberately wrong named-site residue raises, a missing input names its fix command, and
      the dead-accession guard failed its first break test (a MERGED accession returns a row
      whose primaryAccession matches the request) and was strengthened to check entryType and
      sequence length.
