id: Q8TDY3
gene_symbol: ACTRT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACTRT2 (ARP-T2, ARPM2) is a divergent member of the actin family, about 48 per cent identical
  to beta-actin, whose expression is enriched in testis and whose protein appears late in
  spermatid differentiation. It is a bulk structural component of the perinuclear theca, the
  condensed cytoskeletal shell that encases the sperm nucleus: it was originally identified,
  together with ARP-T1/ACTRT1, as one of two major acidic proteins of the detergent- and
  salt-resistant cytoskeletal calyx purified from mammalian sperm heads. In developing spermatids
  ACTRT2 forms a multimeric complex with ACTRT1, ACTRT3, ACTL7A and ACTL9 in the subacrosomal
  layer of the perinuclear theca, and it also binds calicin, the protein that appears to organise
  theca assembly. This complex holds the growing acrosome against the nuclear envelope, and loss
  of individual members causes the acrosome to detach and the sperm head to malform. In mature
  human spermatozoa ACTRT2 is found in the post-acrosomal region and, additionally, in the
  flagellar midpiece; its abundance is reduced in obesity-associated asthenozoospermia. Mice
  lacking ACTRT2 have markedly shrunken seminiferous tubules, and reduced ACTRT2 sensitises
  spermatogonia to iron-dependent cell death. The protein retains most of actin's
  nucleotide-binding pocket - every phosphate-binding-loop residue, the divalent-cation ligand and
  the sensor arginine are unchanged, while the adenine/ribose region has diverged - but it has lost
  actin's ATP-hydrolysis trigger histidine and most of the surface by which actin protomers contact
  one another, and no nucleotide binding, hydrolysis or polymerisation has been demonstrated for
  it.
  Its role appears to be architectural rather than dynamic: a non-filamentous scaffold subunit of
  a rigid, non-motile structure.
