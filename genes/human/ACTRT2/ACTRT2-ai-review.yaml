- term:
    id: GO:0005856
    label: cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      True but strictly redundant. The WITH/FROM token UniProtKB-SubCell:SL-0090 is a controlled
      vocabulary identifier rather than another gene's evidence, and it renders the single
      subcellular-location line in the UniProt entry, which is itself flagged ECO:0000250, by
      similarity, with no source entry cited. The QuickGO ancestor list for GO:0033011
      perinuclear theca contains GO:0005856, so this term is a strict ancestor of an annotation
      ACTRT2 already carries on better evidence.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept because it is true by subsumption and asserts nothing wrong, and marked non-core
      because it adds no information over GO:0033011. This is the same situation as the merged
      ACTL7A review, which reached the same verdict for the same reason; it is deliberately not
      treated as ACTL7B's identical row was, because ACTL7B has no more specific compartment
      annotation for the parent to be redundant with, whereas ACTRT2 does. No MODIFY is proposed
      because the more specific term is already present twice on this record, so replacing this
      row would only duplicate it.
    propagation_review:
      root_cause: EVIDENCE_CIRCULAR_OR_REDUNDANT
      failure_modes:
      - GRANULARITY_MISMATCH
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0090
        source_label: UniProt subcellular location Cytoskeleton
        source_status: CIRCULAR_OR_REDUNDANT
        comment: >-
          A controlled-vocabulary identifier, not a gene product, so there is no donor to
          interrogate. It renders a UniProt location line that is itself flagged ECO:0000250, by
          similarity, with no source entry cited.
    supported_by:
    - reference_id: file:human/ACTRT2/ACTRT2-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cytoplasm, cytoskeleton {ECO:0000250}.'
- term:
    id: GO:0007010
    label: cytoskeleton organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      An automatic inter-ontology inference whose sole input is this gene's own GO:0005200 row -
      the WITH/FROM field is literally the GO term GO:0005200. No observation enters the chain.
      It is defensible in the weak sense that ACTRT2 is a constituent of the perinuclear theca,
      a cytoskeletal structure that is assembled and remodelled during spermiogenesis, but
      ACTRT2 has never been shown to organise or remodel anything.
    action: KEEP_AS_NON_CORE
    reason: >-
      This is the same treatment the merged ACTR10 review gave the identical inference row, and
      the reasoning transfers: the molecular function it derives from stands, so the inference is
      not left dangling, but the gene's contribution is to be part of a structure rather than to
      build or rearrange one. It is deliberately not removed as ACTL7B's identical row was -
      there, the removal followed from removing the GO:0005200 input, which does not apply here -
      and deliberately not modified to GO:0030036 actin cytoskeleton organization as ACTL7A's
      was, because ACTL7A had a measured F-actin phenotype (complete, spatially restricted loss
      of subacrosomal F-actin in the knockout) and ACTRT2 has nothing equivalent. The one report
      that touches actin remodelling in this clade is the Actrt3 knockout, where heterologous
      expression of Actrt3, not Actrt2, altered F-actin distribution. If a specific process term
      is ever warranted for ACTRT2 it will come from the perinuclear-theca literature, and the
      concrete route to it is the annotation gap recorded in suggested_questions.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - CIRCULAR_PROPAGATION
      source_entities:
      - source_id: GO:0005200
        source_label: structural constituent of cytoskeleton
        source_status: CIRCULAR_OR_REDUNDANT
        comment: >-
          The WITH/FROM source of this row is a GO term rather than a gene product, namely this
          gene's own molecular-function IBA, so the process claim inherits whatever support that
          row has and adds none of its own.
