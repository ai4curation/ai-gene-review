- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      ACTRT2's core molecular function, but the route by which the annotation arrived is not the
      route that justifies it. The WITH/FROM field is byte-identical to ACTR10's corresponding
      row (11 of 11 tokens, PANTHER node PTN000940351), and that merged review accepted it as
      core for a non-polymerising ARP that is a structural subunit of a defined cytoskeletal
      assembly. ACTRT2 is the same case with the perinuclear theca in place of dynactin: it was
      identified as one of two major acidic components of the purified sperm cytoskeletal calyx,
      and GO classifies the perinuclear theca as a cytoskeletal structure. The term's definition
      asks for contribution to the structural integrity of a cytoskeletal structure, not for
      polymerisation.
    action: ACCEPT
    reason: >-
      What does not transfer from the donors is polymerisation, and this review measured that
      rather than assuming it. Of 38 protomer-protomer contact positions computed from the
      cryo-EM F-actin filament PDB 6DJO, ACTRT2 matches actin at 14 identically and 6
      conservatively with 18 non-conservative changes, and only 2 of the 10 D-loop contacts are
      identical - Pro38 and His40 are lost, the Met44/Val45/Met47 hydrophobic docking triad
      becomes Ser/Ala/Ala, and a proline enters at position 43 inside the loop that must dock
      into the neighbouring protomer. That is below every panel member known to build a helical
      filament (lowest is ACTR1A at 20/38, with Arp53D at 29/38 and beta-actin at 37/38 as
      positive controls). Bounding this honestly, it is NOT below the Arp2/3 subunits, which
      nucleate a filament without extending one (Arp2 15/38, Arp3 5/38), so the measurement
      argues against ACTRT2 extending F-actin and does not exclude an Arp2/3-like role, for
      which nothing has ever been proposed. The term is nonetheless earned on ACTRT2's own
      evidence - it is a bulk constituent, by abundance in a purified fraction, of a structure
      that GO places under cytoskeleton, and it is a member of a multimeric complex there. The
      enables qualifier follows the established practice for structural-constituent-of terms, as
      for ribosomal proteins and as accepted on ACTR10. Donor quality is not at issue: all 10
      resolved WITH/FROM sources carry their own experimental evidence for the term, and they
      include yeast ARP1/centractin (P38696, IDA) and yeast ARP10 (Q04549, IPI) alongside the
      conventional actins and Arp2/Arp3, so SOURCE_EVIDENCE_WEAK would be contradicted by
      measurement. One counterweight is recorded rather than suppressed: the precomputed affinage
      record independently pitches this gene's structural claim at the parent level, GO:0005198,
      which is also the level PAINT chose for the ACTL7A/ACTL7B clade, so two independent sources
      prefer the general term. GO:0005200 is kept over it because the calyx fractionation gives
      ACTRT2 something ACTL7A does not have - direct evidence of bulk constituency of a structure
      GO classifies as cytoskeletal - and because the ACTR10 precedent on this identical row
      turns on exactly that distinction. See suggested_questions for the PAINT node question this
      row raises.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:87906
        source_label: Mus musculus Actg1 (P63260, Swiss-Prot; cross-reference also maps to 4 TrEMBL entries)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Carries its own experimental evidence for the term, earned through filament formation or
          nucleation; the protomer-interface measurement shows that route is not available to ACTRT2, which
          earns the term instead as a bulk constituent of the perinuclear theca.
      - source_id: PANTHER:PTN000940351
        source_label: PANTHER ancestral node PTN000940351
        source_status: SUPPORTS_TRANSFER
        comment: PANTHER internal tree node, not a protein. The single node from which GO:0005200 propagates
          anywhere in PTHR11937; the same term is explicitly negated as an IRD at eight other nodes of the
          family, and this clade has not yet been given a decision.
      - source_id: RGD:1304556
        source_label: Rattus norvegicus Actg1 (P63259, Swiss-Prot; cross-reference also maps to 1 TrEMBL entries)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Carries its own experimental evidence for the term, earned through filament formation or
          nucleation; the protomer-interface measurement shows that route is not available to ACTRT2, which
          earns the term instead as a bulk constituent of the perinuclear theca.
      - source_id: SGD:S000001171
        source_label: Saccharomyces cerevisiae (strain ATCC 204508 / S288c) ARP1 (P38696, Swiss-Prot)
        source_status: SUPPORTS_TRANSFER
        comment: S. cerevisiae ARP1/centractin (P38696, Swiss-Prot; IDA). Builds the dynactin minifilament
          as a non-canonical actin-like assembly rather than F-actin, which is the analogous route by which
