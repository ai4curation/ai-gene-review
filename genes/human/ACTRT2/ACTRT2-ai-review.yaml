  review:
    summary: >-
      Family-level inference from PANTHER node PTN002631484, the deepest node in this gene's
      record. The WITH/FROM field of this row is byte-identical to the corresponding row on
      ACTL8 (25 of 25 tokens), and that merged review reached KEEP_AS_NON_CORE on the grounds
      that the node is the true last common ancestor of a heterogeneous donor set. The same
      reasoning applies here and the verdict is deliberately the same. Retained because nothing
      in the sequence contradicts a generic actin-cytoskeleton compartment claim; marked
      non-core because ACTRT2's evidenced compartment is the perinuclear theca, which QuickGO's
      ancestor list shows is a descendant of GO:0005856 cytoskeleton but NOT of GO:0015629
      actin cytoskeleton.
    action: KEEP_AS_NON_CORE
    reason: >-
      Three separate checks were run and all point the same way. First, donor quality is not the
      issue: all 25 WITH/FROM tokens were resolved programmatically, 24 resolve to protein
      entries spanning 12 organisms, and every one of those 24 carries its own experimental
      evidence for GO:0015629 or a descendant. Second, the node is genuinely deep - PTN002631484
      donates GO:0015629 to 18 human genes running from 33.7 to 100 per cent identity to
      beta-actin - so the generic term it carries is the correct LCA of a heterogeneous set, not
      a granularity failure, and no specificity upgrade is warranted. Third, and this is what
      distinguishes ACTRT2's situation from ACTL8's, ACTRT2 does have a specific evidenced
      compartment, and it is disjoint from this term in the ontology: the QuickGO ancestor list
      for GO:0033011 perinuclear theca contains GO:0005856 but not GO:0015629. So unlike the
      GO:0005856 row below, this row is not a redundant ancestor of something better on the
      gene - it is an independent compartment claim that no experiment supports. It is kept
      rather than marked over-annotated because ACTRT2 is an actin-family protein sitting in a
      structure whose reported composition includes two actin-capping proteins, so the claim is
      not contradicted; it simply is not where the evidence points, which is what non-core
      records.
