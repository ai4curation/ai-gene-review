core_functions:
- description: >-
    Structural subunit of the perinuclear theca of the sperm head. ACTRT2 is one of two major
    acidic proteins of the detergent- and high-salt-resistant cytoskeletal calyx purified from
    mammalian sperm heads, and in developing spermatids it forms a multimeric complex with
    ACTRT1, ACTRT3, ACTL7A and ACTL9 in the subacrosomal layer, as well as binding calicin, the
    apparent organiser of theca assembly. The molecular function is stated at the level of
    structural molecule activity rather than structural constituent of cytoskeleton. The theca is
    classified under cytoskeleton and ACTRT2 is a bulk component of it by abundance in a purified
    fraction, so the specific term is arguable on its definition, but it additionally implies the
    filament-constituent role that the structure audit excludes, no ARP-T donor supports it in the
    PANTHER seed set, and PAINT substituted the same parent for the adjacent ACTL7A/ACTL7B clade.
    ACTRT2 does not behave like actin: of 38 protomer-protomer contact positions computed from the
    F-actin filament only 14 are identical and 18 differ non-conservatively, the D-loop docking
    triad Met44/Val45/Met47 is replaced by Ser/Ala/Ala, and actin's ATP-hydrolysis trigger His161
    is replaced by cysteine. The nucleotide pocket is largely but not wholly retained: of the 19
    residues within 4 angstrom of ATP or the divalent cation, 13 are identical and 4 conservative,
    with every phosphate-binding-loop residue, the cation ligand Asp154, the catalytic-water
    glutamine Gln137 and the sensor Arg183 identical to actin, while the adenine/ribose region
    carries two non-conservative substitutions, Glu214 to Lys and Lys336 to Trp. No nucleotide
    binding or hydrolysis has ever been measured, so no nucleotide function is claimed.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0007283
    label: spermatogenesis
  locations:
  - id: GO:0033011
    label: perinuclear theca
  - id: GO:0033150
    label: cytoskeletal calyx
  supported_by:
  - reference_id: PMID:12243744
    supporting_text: In our calyx preparations from bull spermatozoa we have noted two major
      acidic
  - reference_id: PMID:12243744
    supporting_text: strength and detergents and by a special protein composition, including the
  - reference_id: PMID:35616329
    supporting_text: Here, we reveal that ACTRT1, ACTRT2, ACTL7A and ACTL9 proteins
  - reference_id: PMID:41668650
    supporting_text: interaction of ACTRT3 with the PT proteins ACTRT1, ACTRT2, ACTL7A, SPEM2 and
      the
  - reference_id: PMID:35793634
    supporting_text: components, indicating it may serve as an organizing center of the PT
      assembly.
  - reference_id: file:human/ACTRT2/ACTRT2-bioinformatics/RESULTS.md
    supporting_text: '**Whole computed contact set first, so no sub-selection can flatter the
      result.** Of the 19 residues within 4.0 A of ATP or the divalent cation in PDB 2BTF, ACTRT2
      matches actin at **13 identically** and 4 conservatively, with **2 non-conservative**
      substitutions.'
  knowledge_gaps:
  - gap_statement: >-
      It is not known what ACTRT2 itself contributes to the perinuclear theca, as distinct from
      what the complex contributes. No Actrt2 knockout has been examined for perinuclear-theca
      architecture, acrosome attachment or sperm-head shape, the phenotypes by which the roles
      of ACTRT1, ACTRT3, ACTL7A, ACTL9 and calicin were established.
    boundary: >-
      Established: ACTRT2 is a major acidic component of the purified calyx, is present in a
      multimeric complex with four other actin-related proteins in the subacrosomal layer, binds
      calicin, and its loss in mice shrinks the seminiferous tubules. Unknown: whether removing
      ACTRT2 alone destabilises the complex, detaches the acrosome or deforms the head, and
      whether its role is load-bearing or regulatory within the assembly.
  - gap_statement: >-
      Whether ACTRT2 binds a nucleotide, and in what state, is untested. The phosphate-binding, cation
      and sensor positions are retained while the hydrolysis trigger is not, which predicts a
      nucleotide-bound but non-cycling fold, but no structure, no bound ligand and no binding measurement exists for
      ACTRT2 or for any of its perinuclear-theca partners.
    boundary: >-
      Established by measurement: 13 of the 19 computed ATP-contacting positions are identical and
      4 conservative, with all ten named phosphate-loop, cation-site and sensor positions identical
      to actin's, while the adenine/ribose region carries two non-conservative substitutions
      (Glu214 to Lys, Lys336 to Trp) and the hydrolysis trigger His161 is replaced by cysteine.
      Ala108 and Pro109, the Pro-rich loop that governs the His161 rotamer, are also substituted,
      but that is context rather than evidence: the corresponding actin mutants polymerise and
      hydrolyse like wild type, so His161 carries the argument alone. Not established: any nucleotide occupancy, affinity or turnover. Note that the annotation gap
      is family-wide rather than specific to ACTRT2 - QuickGO returns no ATP-binding annotation
      for beta-actin either.
  - gap_statement: >-
      How the reported protection of spermatogonia from ferroptosis relates to the structural
      role is unresolved. Reducing ACTRT2 in a spermatogonial line increases busulfan-induced
      death with reactive-oxygen accumulation and mitochondrial changes, and heterozygous testis
      shows upregulation of ACSL4 and ALOX15 with downregulation of SLC7A11 and GPX4, but the
      cell type is several stages earlier than the spermatids in which the perinuclear theca
      forms.
    boundary: >-
      Established: reduced ACTRT2 sensitises a spermatogonial line to busulfan, and heterozygous
      testis shows the expected direction of change in four ferroptosis regulators. Unknown:
      whether ACTRT2 acts on ferroptosis at all rather than the effect being an indirect
      consequence of impaired spermatogenesis; the readout is the expression of regulators rather
      than any demonstrated activity of ACTRT2, a single study reports it, and the in vivo arm
      uses heterozygotes rather than nulls. No GO term is proposed for it.
proposed_new_terms:
- proposed_name: perinuclear theca actin-related protein complex
  proposed_definition: >-
    A multimeric protein complex of divergent actin-related proteins that assembles in the
    subacrosomal layer of the perinuclear theca of developing spermatids, and which holds the
    growing acrosome against the nuclear envelope. In mouse it comprises ACTRT1, ACTRT2, ACTRT3,
    ACTL7A and ACTL9, and it interacts with the inner acrosomal membrane protein SPACA1 and with
    nuclear envelope proteins.
  justification: >-
    The complex is defined by reciprocal co-immunoprecipitation and shared localisation across
    two studies, and its loss-of-function phenotype is consistent between members - acrosome
    detachment from the nucleus and malformed sperm heads. GO currently offers only GO:0032991
    protein-containing complex for it, which is what ACTL7A has been given by IDA, and that term
    records nothing about what the complex is or does. A specific term would serve at least five
    human genes (ACTRT1, ACTRT2, ACTRT3, ACTL7A, ACTL9) and their mouse orthologs, and would give
    the members' shared structural role a machine-readable home, which matters here because
    ACTRT2 and ACTRT3 have no experimental biological-process annotation in either species and
    complex membership is the strongest fact known about them. Searching OLS and QuickGO for
    perinuclear theca returns only GO:0033011 and GO:0033150, neither of which is a complex term,
    and no protein-complex term in GO names any of these gene products. This is distinct from,
    and complementary to, the acroplaxome cellular-structure term already proposed in the merged
    ACTL7A review, which names the compartment rather than the complex.
  proposed_parent:
    id: GO:0032991
    label: protein-containing complex
  supported_by:
  - reference_id: PMID:35616329
    supporting_text: Here, we reveal that ACTRT1, ACTRT2, ACTL7A and ACTL9 proteins
  - reference_id: PMID:35616329
    supporting_text: interact to form a multimeric complex and localize to the subacrosomal
      region of
  - reference_id: PMID:35616329
    supporting_text: that the sperm PT-specific ARP complex mediates the acrosome-nucleus
      connection.
  - reference_id: PMID:41668650
    supporting_text: interaction of ACTRT3 with the PT proteins ACTRT1, ACTRT2, ACTL7A, SPEM2 and
      the
  - reference_id: PMID:41668650
    supporting_text: sperm surface protein ZPBP. This suggested that ACTRT3 is a part of the
      complex
suggested_questions:
- question: >-
    Can the perinuclear-theca proteins re-earn GO:0005200 on evidence of their own, and if so
    should ACTL7A's removal be revisited at the same time? The merged ACTRT3 review raises this
    question and this review contributes what is, within the whole ARP-T and theca set, the
    strongest single instance of such evidence: ACTRT2 is not merely resident in the theca but is
    one of the two major acidic components of the purified, detergent- and salt-resistant
    cytoskeletal calyx, identified by fractionation and partial protein sequencing. That is bulk
    structural constituency of a structure GO places under GO:0005856 cytoskeleton, which is what
    GO:0005200's definition asks for, and it is evidence neither ACTRT3 nor ACTL7A has - ACTRT3 is
    not one of Heid's two components, and ACTL7A's own review explicitly withdrew a
    residence-based version of the argument. The reason this review nonetheless generalises its
    row rather than accepting it is that the row's own evidence chain runs from polymerising
    actins, so accepting it would publish a filament-constituent inference that the structure
    audit excludes. The question is therefore whether GO should have a route to assert
    GO:0005200 from theca evidence directly, independent of the actin node - and if it does, the
    ARP-T set and ACTL7A should be decided together rather than one gene at a time.
- question: >-
    The eight-node GO:0005200 rejection sweep in PTHR11937 is independently confirmed here, from
    the cached PAINT table: the term propagates at exactly one node (PTN000940351) and is negated
    as an IRD with negated=true at PTN000233596 (Arp2), PTN000233796 (Arp3), PTN000233752,
    PTN000233887, PTN000234048 and PTN001732543 (the nuclear ARPs of the Ino80, Swr1, NuA4 and
    SWI/SNF complexes), PTN007551901, and PTN008986528 (ACTL7A/ACTL7B) - the last of which alone
    received the parent GO:0005198 as a replacement, and GO:0005198 occurs nowhere else in the
    family. The merged ACTRT3 review asks whether the sweep should be extended to the ARP-T
    branch; the recommendation is not repeated here, only corroborated, with one addition. If the
    IRD is applied to that branch, GO:0005198 should be substituted at the same time as it was at
    PTN008986528, not merely rejected - otherwise ACTRT1, ACTRT2, ACTRT3, ACTL9 and ACTL10 lose
    their only molecular function outright, and four of the five reported members of one
    perinuclear-theca complex would then be annotated at one level while ACTR10, on the same
    un-adjudicated path but with an ortholog in the seed set, keeps the child.
- question: >-
    Have the perinuclear-theca actin-related proteins convergently lost actin's
    polymerisation-coupled ATPase, and does the retained nucleotide pocket still bind a
    nucleotide? Actin's hydrolysis is triggered when His161 flips on incorporation into the
    filament, and the flip is governed by the Pro-rich loop at Ala108/Pro109. All five reported
    members of the sperm perinuclear-theca ARP complex have lost His161 - ACTRT1 to Cys, ACTRT2
    to Cys, ACTRT3 to Gln, ACTL7A to Tyr, ACTL9 to Tyr - while every panel member that extends or
    nucleates a filament retains it, and ACTL7B, which is testis-specific but is not a reported
    member of that complex, also retains it. ACTRT2 has additionally lost both Pro-rich loop
    residues - context rather than evidence, since the corresponding actin mutants polymerise and
    hydrolyse like wild type - while remaining identical to actin at all ten named phosphate-loop,
    cation-site and sensor positions, the adenine/ribose region carrying two non-conservative
    substitutions. The
    merged ACTL7A review raised this for that gene alone; the census generalises it to the whole
    complex. The testable prediction is a nucleotide-bound but non-hydrolysing fold, and no
    member of the set has ever been assayed for nucleotide binding.
- question: >-
    Should GO:0033150 cytoskeletal calyx be extended, in both its definition and its annotation
    set, beyond the three basic proteins? The term's definition states that the calyx contains
    calicin and basic cylicin proteins, and in human it is annotated to exactly CYLC1, CYLC2 and
    CCIN. The paper that named ARP-T1 and ARP-T2 reported them as two major acidic components of
    the purified calyx and listed two major actin-capping proteins there as well; CAPZA3 and
    CAPZB carry GO:0033011 but not GO:0033150. So the term has not tracked the composition of
    the structure it names.
- question: >-
    Why has the perinuclear-theca literature not reached ACTRT2 and ACTRT3 in either species? Of
    the six reported members of the theca complex, these two are the only ones with no
    experimental biological-process annotation in human or mouse (ACTRT2 has one BP row in human
    and two in mouse, all automatic). The reference that establishes the complex names ACTRT2
    explicitly and has produced acrosome-assembly, spermatid-development and fertilization
    annotations for ACTL7A and ACTL9 but none for Actrt1 or Actrt2; the calicin paper gave mouse
    Actrt2 a cellular-component IDA and a protein-interaction row but no process term; and the
    Actrt2 knockout paper has not been curated at all. Because the human record here is fed by
    ortholog transfer, closing the mouse gap would close the human one.
- question: >-
    Where do ACTRT2 and ACTRT3 genuinely differ, given that they were reviewed independently and
    share three byte-identical annotation rows? Recorded so the contrast is not lost. The two
    reviews agree on every shared row and their two structural analyses agree numerically on every
    shared panel member - on ACTRT3's chemically-compatible metric, which counts identical plus
    conservative and so is not the identical-only metric used on the GO:0005200 row: Arp53D 33 of
    38, the dynactin Arp1 paralogue 28, conventional actins 38, ACTRT2 20 and ACTRT3 18. Computed
    independently on both sides, which is a mutual validation worth noting. The differences are all in evidence, not in method. ACTRT2 is one of Heid's two
    major acidic calyx components and ACTRT3 is not, which is why only this review can supply the
    bulk-constituency evidence bearing on the GO:0005200 question. ACTRT3 has a knockout with
    acrosome and Golgi phenotypes and an informative binding partner in PFN3, so its new
    annotations are GO:0001675 acrosome assembly and GO:0005522 profilin binding; ACTRT2's
    knockout reports only shrunken seminiferous tubules, so its new process term is the more
    general GO:0007283 spermatogenesis - a difference in evidence, not a disagreement about level.
    ACTRT2 additionally has ten IntAct records including six CCT subunits where ACTRT3 has two,
    and it is the only one of the pair for which GO:0033150 cytoskeletal calyx is supported.
    ACTRT3 has nuclear and male-germ-cell-nucleus annotations that ACTRT2 lacks entirely.
- question: >-
    What is ACTRT2 doing in the flagellar midpiece? The only human protein-level localisation
    reports ACTRT2 in the post-acrosomal region and the middle piece, and the midpiece is not a
    perinuclear-theca compartment. No current annotation accounts for it, and it is unclear
    whether it reflects a genuine second pool, residual cytoplasm, or antibody cross-reactivity
    with another actin-family protein - the last being a real concern for a protein 48 per cent
    identical to beta-actin.
- question: >-
    Is ACTRT2 protein testis-restricted or merely testis-enriched? The 2001 cloning paper reports
    that hArpM1 and hArpM2 mRNAs are expressed in all tested human tissues, at lower levels than
    actin, whereas the calyx paper reports specific synthesis in the testis and the knockout
    paper describes testis-specific expression; HPA calls the gene tissue-enriched rather than
    tissue-specific. Low ubiquitous transcript with testis-restricted protein reconciles all
    three, but that has not been tested directly, and it matters for whether any non-germline
    function should be entertained.
suggested_experiments:
- description: >-
    Generate an Actrt2 knockout and examine the perinuclear theca directly, using the assays that
    defined the roles of the other complex members: transmission electron microscopy of the
    subacrosomal space and acroplaxome through the cap and elongation phases, immunofluorescence
    for acrosome-nucleus attachment, sperm-head morphometry, and quantification of ACTRT1,
    ACTRT3, ACTL7A, ACTL9 and calicin protein levels in the knockout. This is the single largest
    gap: the strongest biological-process claims for this gene family all come from such
    knockouts, and the one available for ACTRT2 reports only tubule size.
- description: >-
    Test nucleotide binding by recombinant ACTRT2. The phosphate-binding, cation and sensor
    positions are identical to actin's while the hydrolysis trigger His161 is not, so measure ATP
    and ADP binding by isothermal
    titration calorimetry or a fluorescent-nucleotide exchange assay, and assay phosphate release
    to test whether hydrolysis is in fact absent. Doing the same for ACTRT1 and ACTL7A would
    establish whether the retained-pocket, lost-trigger pattern is a shared property of the theca
    complex.
- description: >-
    Test the polymerisation prediction directly. The computed protomer interface predicts that
    ACTRT2 cannot extend an F-actin filament, so assay purified ACTRT2 by pyrene-actin
    polymerisation, sedimentation and negative-stain electron microscopy, alone and mixed with
    beta-actin, with Drosophila Arp53D as the divergent-but-polymerising positive control. A
    reconstitution of the five-member theca complex would also test whether the assembly, rather
    than any single member, forms an ordered polymer.
- description: >-
    Establish whether the ACTRT2-CCT/PDCL3 co-purification is a folding relationship. Deplete
    PDCL3 or individual CCT subunits and follow newly synthesised ACTRT2 by pulse-chase for
    misfolding and degradation, with beta-actin as the positive control and a non-CCT client as
    the negative. This would determine whether ACTRT2 is an obligate CCT client like conventional
    actin, and would settle whether the annotation should remain a bare protein-binding row.
- description: >-
    Test the ACSL4 lead, which is currently only a coincidence between one spoke-expanded
    affinity-purification association and one expression change. Confirm or exclude a direct
    ACTRT2-ACSL4 interaction by reciprocal co-immunoprecipitation from testis and by proximity
    ligation in staged tubules, and ask whether the busulfan sensitivity of ACTRT2-low
    spermatogonia is rescued by ACSL4 inhibition. A negative result would be worth recording, as
    it would remove the only proposed mechanism for the ferroptosis phenotype.
