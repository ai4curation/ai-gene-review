- term:
    id: GO:0005856
    label: cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      True but strictly redundant. The WITH/FROM token UniProtKB-SubCell:SL-0090 is a controlled
      vocabulary identifier rather than another gene's evidence, and it renders the single
      subcellular-location line in the UniProt entry, which is itself flagged ECO:0000250, by
      similarity, with no source entry cited. The QuickGO ancestor list for GO:0033011
      perinuclear theca contains GO:0005856, so this term is a strict ancestor of an annotation
      ACTRT2 already carries on better evidence.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept because it is true by subsumption and asserts nothing wrong, and marked non-core
      because it adds no information over GO:0033011. This is the same situation as the merged
      ACTL7A review, which reached the same verdict for the same reason; it is deliberately not
      treated as ACTL7B's identical row was, because ACTL7B has no more specific compartment
      annotation for the parent to be redundant with, whereas ACTRT2 does. No MODIFY is proposed
      because the more specific term is already present twice on this record, so replacing this
      row would only duplicate it.
    propagation_review:
      root_cause: EVIDENCE_CIRCULAR_OR_REDUNDANT
      failure_modes:
      - GRANULARITY_MISMATCH
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0090
        source_label: UniProt subcellular location Cytoskeleton
        source_status: CIRCULAR_OR_REDUNDANT
