id: P14138
gene_symbol: EDN3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Endothelin-3 (EDN3) encodes a secreted vasoactive and developmental peptide hormone synthesized
  as a 238-amino-acid preproprotein that is proteolytically cleaved by furin-like proprotein convertases
  into big endothelin-3 and subsequently converted by endothelin-converting enzymes (ECE-1, ECE-2) or
  the Kell metalloendopeptidase (KEL) into the mature 21-residue bicyclic peptide endothelin-3 (ET-3),
  stabilized by two intramolecular disulfide bonds (Cys1-Cys15 and Cys3-Cys11). Mature ET-3 acts in the
  extracellular space as a high-affinity agonist of the endothelin B receptor (EDNRB, equipotent with
  ET-1 and ET-2) and a lower-affinity agonist of the endothelin A receptor (EDNRA). Through Gq/11-coupled
  phospholipase C activation, IP3-mediated intracellular calcium mobilization, and MAPK signaling, EDN3-EDNRB
  signaling regulates systemic arterial blood pressure, vein smooth muscle contraction, and the proliferation,
  migration, and differentiation of enteric neural crest-derived precursors and melanoblasts; loss-of-function
  mutations in EDN3 cause Waardenburg syndrome type 4B and congenital central hypoventilation syndrome.
