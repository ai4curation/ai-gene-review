      and proliferation of neural crest-derived cells.
- id: PMID:2649896
  title: 'The human endothelin family: three structurally and pharmacologically distinct isopeptides predicted
    by three separate genes.'
  findings:
  - statement: Genomic cloning and synthesis of human ET-1, ET-2, and ET-3 demonstrated strong vasoconstrictor
      and systemic arterial pressor responses.
    supporting_text: Synthetic ET-1, ET-2, and ET-3 were prepared according to the deduced amino acid
      sequences, and the biological activities were assayed by contraction of isolated porcine coronary
      artery strips and by intravenous injection to anesthetized rats. All these synthetic peptides produced
      strong vasoconstrictor and pressor responses.
