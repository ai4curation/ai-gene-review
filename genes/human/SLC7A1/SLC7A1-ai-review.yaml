- term:
    id: GO:0001618
    label: virus receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q09143
  - ensembl:ENSMUSP00000046714
  review:
    summary: Virus (ecotropic murine leukemia virus) receptor activity, propagated by IEA from the mouse
      ortholog.
    action: KEEP_AS_NON_CORE
    reason: The receptor function for ecotropic MLV is established for the rodent ortholog (mCAT-1, Q09143);
      SLC7A1 was cloned as a homolog of the murine ecotropic retroviral receptor (PMID:1718082). This
      capacity is peripheral to the transporter's core cationic-amino-acid function, concerns a non-human
      (mouse) pathogen, and is retained as non-core rather than a core molecular function.
    supported_by:
    - reference_id: PMID:1718082
      supporting_text: 'The human gene is ubiquitously expressed in human tissues and

        conserved among mammalian species'
- term:
    id: GO:0005290
    label: L-histidine transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:11591158
  qualifier: enables
  review:
    summary: L-histidine listed as a CAT-1 transported substrate (IDA); histidine is a minor, pH-dependent
      cationic substrate of system y+.
    action: KEEP_AS_NON_CORE
    reason: The cited paper (PMID:11591158) principally characterizes hCAT-3 (SLC7A3) but the curator
      (ARUK-UCL, IDA) had the full text; histidine is transported by the hCAT family. Histidine is only
      partly cationic near physiological pH and is a secondary substrate relative to the core arginine/lysine/ornithine
      activities, so it is kept as a non-core transport capability rather than a defining function.
