- term:
    id: GO:0032991
    label: protein-containing complex
  evidence_type: IDA
  original_reference_id: PMID:28246125
  qualifier: part_of
  review:
    summary: Generic protein-containing complex (part_of, IDA) citing an IFITM3/ZMPSTE24 interactome study.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0032991 is an uninformative generic term, and the cited paper (PMID:28246125) characterizes
      ZMPSTE24-IFITM antiviral complexes, not a functional CAT-1 complex. Unlike the heteromeric SLC7
      light chains, CAT-1 functions independently of SLC3 heavy chains (it works as a homo-oligomer);
      there is no evidence it is an obligate member of a defined multiprotein complex. Over-annotation.
- term:
    id: GO:0042102
    label: positive regulation of T cell proliferation
  evidence_type: IMP
  original_reference_id: PMID:26449889
  qualifier: acts_upstream_of
  review:
    summary: CAT-1 arginine uptake is required for human T-cell proliferation (IMP, acts_upstream_of).
    action: KEEP_AS_NON_CORE
    reason: Activated T cells upregulate hCAT-1 and its knockdown impairs arginine uptake and proliferation
      (PMID:26449889). CAT-1 supplies arginine but does not itself execute a step of the proliferation
      program, so it does not pass the participation test for a core process; the acts_upstream_of qualifier
      captures this genuine but non-core causal role.
    supported_by:
    - reference_id: PMID:26449889
      supporting_text: When hCAT-1 induction was suppressed via siRNA transfection, arginine uptake, and
        cellular proliferation were impaired
    - reference_id: PMID:26449889
      supporting_text: activation via CD3 and CD28 induces arginine transport into primary human T cells
