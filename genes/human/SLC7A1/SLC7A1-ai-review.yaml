- term:
    id: GO:0098655
    label: monoatomic cation transmembrane transport
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:88117
  review:
    summary: Monoatomic cation transmembrane transport, propagated by ISS from the mouse ortholog.
    action: REMOVE
    reason: Incorrect substrate class. CAT-1 transports cationic (organic) amino acids, not monoatomic
      (single-atom, inorganic) cations such as Na+/K+. This ISS appears to be a mis-mapping of 'cationic
      amino acid' onto 'monoatomic cation transport'; no evidence supports monoatomic cation transport
      by CAT-1.
