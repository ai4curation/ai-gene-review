id: P30825
gene_symbol: SLC7A1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC7A1 (CAT-1) is a polytopic plasma-membrane transport protein of the amino acid-polyamine-organocation
  (APC) superfamily, cationic amino acid transporter (CAT) family. It is the principal high-affinity,
  low-capacity system y+ carrier mediating sodium-independent facilitated diffusion of the cationic L-amino
  acids L-arginine, L-lysine and L-ornithine (and, more weakly, L-homoarginine and L-histidine) across
  the plasma membrane. Transport is pH-insensitive and subject to trans-stimulation (accelerated exchange
  when substrate is present on the opposite side), and the carrier operates as a facilitative uniporter
  that, unlike the heteromeric SLC7 light chains, functions independently of the SLC3 heavy chains. CAT-1
  is expressed broadly across tissues except adult liver and supplies arginine and other cationic amino
  acids for protein synthesis, nitric oxide production, polyamine synthesis and cell growth; in polarized
  epithelia it localizes predominantly to the basolateral membrane. The rodent ortholog additionally serves
  as the cell-surface receptor for ecotropic murine leukemia virus.
