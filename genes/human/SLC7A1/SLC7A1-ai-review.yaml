proposed_new_terms: []
suggested_questions:
- question: >-
    Does human CAT-1 function at all as a receptor for any human-tropic retrovirus, or is the receptor role
    restricted to the rodent ortholog and ecotropic MLV?
- question: >-
    What is the physiological significance, if any, of CAT-1 L-histidine transport relative to its arginine/lysine/ornithine
    activities?
suggested_experiments:
- description: >-
    Cryo-EM of human CAT-1 with and without bound arginine to define the uniport/trans-stimulation mechanism
    and oligomeric state.
- description: >-
    Quantitative comparison of CAT-1 substrate selectivity and apparent affinities (arginine, lysine, ornithine,
    histidine, homoarginine) in a single reconstituted/HEK overexpression system.
