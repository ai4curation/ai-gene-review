  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:88117
  - MGI:MGI:99828
  - PANTHER:PTN008450038
  review:
    summary: CAT-1 transports L-ornithine, a core cationic (basic) amino acid substrate of system y+.
    action: ACCEPT
    reason: 'L-ornithine is an established substrate of CAT-1: UniProt records the catalytic activity
      L-ornithine(in)=L-ornithine(out), and siRNA knockdown of CAT-1 reduces L-ornithine uptake in human
      RPE cells (PMID:17197568). The IBA rests on the CAT clade node (PANTHER:PTN008450038) with experimental
      ornithine-transport grounding across orthologs; the IEA/ISS rows from the mouse ortholog (Q09143)
      agree. A core molecular function.'
