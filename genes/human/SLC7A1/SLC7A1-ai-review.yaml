- term:
    id: GO:0061459
    label: L-arginine transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:88117
  - MGI:MGI:99828
  - PANTHER:PTN008450038
  - RGD:3716
  - RGD:68387
  - UniProtKB:B3TP03
  - UniProtKB:P30825
  - UniProtKB:P52569
  review:
    summary: CAT-1 transports L-arginine - the central, highest-affinity system y+ activity.
    action: ACCEPT
    reason: Direct oocyte transport assays show hCAT-1 arginine transport with KM ~0.11 mM and y+ properties
      (PMID:9174363), and arginine uptake is lost on CAT-1 knockdown (PMID:26449889). UniProt records
      the L-arginine(in)=L-arginine(out) reaction. The IBA (PANTHER:PTN008450038; P30825 appears in WITH/FROM
      as experimental grounding, not circularity) and mouse-ortholog IEA/ISS agree. Core molecular function.
    supported_by:
    - reference_id: PMID:9174363
      supporting_text: When expressed in Xenopus oocytes, hCAT-1 and hCAT-2B demonstrated transport properties
        consistent with y+
    - reference_id: file:human/SLC7A1/SLC7A1-uniprot.txt
      record_section: &id003
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=L-arginine(in) = L-arginine(out)
