    summary: >-
      Top-ranked hit (score 9.85). The pi-body (piP-body) is a germ-granule compartment housing the
      piRNA machinery. BRCA2 is a nuclear HR mediator that loads RAD51 onto RPA-coated ssDNA; it has
      no piRNA role. The score is in the abstention band identified in the other cohort, where nothing
      below 10 was correct, so the failure is at least visible.
