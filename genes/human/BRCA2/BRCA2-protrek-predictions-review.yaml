    summary: >-
      Rank 2 (score 9.65). The inner acrosomal membrane is a sperm-specific structure. BRCA2 does
      have meiotic recombination functions and Brca2 hypomorphs cause infertility, which may be the
      thread the retrieval followed, but placing the protein in the acrosome is a compartment error
      of a different order.
