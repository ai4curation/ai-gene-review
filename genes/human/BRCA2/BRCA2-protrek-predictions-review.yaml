  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:1990470
    label: piRNA cluster binding
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 3 (score 9.58). piRNA cluster binding is scored MORE_SPECIFIC as a descendant of DNA binding,
      so a closure-based metric would credit it - and BRCA2 does bind DNA, through the OB folds and
      tower domain of its DBD, but it binds single-stranded DNA at resected breaks, not piRNA clusters.
      This is the sharpest illustration in the cohort of why ontology-closure agreement is not a substitute
      for reading the call: the parent is right, the child is unrelated, and the protein is one of
      the best-characterised in human genetics.
    supported_by:
    - reference_id: file:human/BRCA2/BRCA2-uniprot.txt
      supporting_text: >-
        Breast cancer type 2 susceptibility protein
