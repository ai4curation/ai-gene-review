  label: Homo sapiens (Human)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for BRCA2. This is the cohort's worst result: top-five scores run from
  9.85 down to 9.40, the lowest of any ARGO139 gene, and all five calls concern piRNA biology,
  spermatogenesis and acrosome structures. Length alone does not explain it - across both cohorts
  top-1 score correlates only weakly with length (Spearman 0.19), and NOTCH1 at 2555 aa and Dscam1
  at 2016 aa score 15.9 and 17.2. What the four sub-10 outliers share (LRRK2, TOR1, BRCA2 and HTT,
  all above 2400 aa) is a large multi-domain architecture with no single dominant repeat type,
  whereas the long proteins that score well are built from many copies of one domain. None of the homologous-recombination biology that defines BRCA2 appears,
  and the free-text channel is equally lost, returning post-meiotic spermatogenesis descriptions at
  11.87. BRCA2 was also one of the seven inputs the BioReason benchmark flagged as truncated at that
  model's 2000-residue limit; here the full sequence was supplied and the failure is the model's,
  not the input's. Assessment: 3 nonparalog incorrect (NPI).
