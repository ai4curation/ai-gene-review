id: P51587
gene_symbol: BRCA2
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BRCA2 is a predominantly nuclear genome-maintenance protein that promotes
  homologous recombination by binding RAD51 and single-stranded DNA and assembling
  productive RAD51 filaments on RPA-coated DNA. Its BRC repeats, DNA-binding regions
  and C-terminal RAD51-binding region coordinate this mediator activity with partners
  including PALB2 and DSS1. RAD51 performs the DNA strand-exchange reaction, which
  BRCA2 stimulates. BRCA2 also stabilizes RAD51 at reversed replication forks to protect
  nascent DNA from nucleolytic degradation, a role distinct from fork reversal itself.
  Its recombination functions extend to telomere maintenance and meiosis. Pathogenic
  variants cause BRCA2-related cancer predisposition, while biallelic variants can
  cause Fanconi anemia complementation group D1.
