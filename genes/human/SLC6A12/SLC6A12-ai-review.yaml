suggested_questions:
- question: >-
    What is the physiological significance of guanidinoacetate transport by human BGT1,
    given that it is a minor contributor relative to GAT2/GAT3?
- question: >-
    Is human BGT1 genuinely presynaptic in vivo, or is its brain role primarily
    osmoregulatory and non-neuronal (leptomeningeal/extrasynaptic glial)?
suggested_experiments:
- description: >-
    Determine the endogenous subcellular and cell-type localization of BGT1 in human brain
    (neuronal presynaptic vs glial/leptomeningeal) with validated antibodies or tagged
    knock-in, to resolve the presynapse annotation.
- description: >-
    Compare conditional BGT1 knockouts for osmoregulatory phenotypes (renal medullary
    betaine accumulation, hepatic osmolyte handling) versus GABAergic transmission
    phenotypes, to establish the dominant physiological branch.
