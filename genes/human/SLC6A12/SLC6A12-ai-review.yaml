id: P48065
gene_symbol: SLC6A12
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC6A12 (BGT1) is a plasma-membrane, sodium- and chloride-dependent symporter of
  the SLC6 (neurotransmitter:sodium symporter, SNF) family that couples the inward
  movement of its organic substrate to the Na+ electrochemical gradient together with
  chloride. It transports the compatible osmolyte glycine betaine and the amino-acid
  neurotransmitter GABA; in human cells GABA is the higher-affinity substrate
  (Km ~20 uM) while betaine is a lower-affinity substrate. Betaine transport serves
  cellular osmoregulation, most prominently in the hyperosmotic renal medulla and in
  liver, where BGT1 resides in the basolateral membrane of epithelial cells, and GABA
  transport contributes to GABA uptake/clearance. It is a single-chain polytopic
  membrane protein with twelve transmembrane helices and no obligate accessory subunit
  (it is not an antiporter, uniporter, or heteromeric transporter). It is expressed in
  kidney, liver, heart, skeletal muscle, placenta and broadly in brain, and can
  additionally transport guanidinoacetate as a minor secondary substrate.
