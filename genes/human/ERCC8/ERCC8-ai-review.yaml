  review:
    summary: A contextual cytoplasmic pool is supported by rat neurons and human cell-line immunofluorescence.
    action: KEEP_AS_NON_CORE
    reason: The exact rat donor G3V7B8/ENSRNOP00000013598 carries direct PMID:22900489 annotations. The
      original Methods pp. 758–760 and Results/Figures 3–8 pp. 761–764 use male Long-Evans rats, anti-CSA
      sc-25369 at 1:100, omission controls and blinded neuronal-pattern scoring. The study distinguishes
      diffuse, cytoplasmic, nuclear and perinuclear staining; it does not assay human CSA or resolve isoforms.
      CSA-positive spiral-ganglion neurons show cytoplasmic staining under control and noise-exposed conditions
      (Figures 3–5). Independently, current HPA029328 approved ICC/IF records include cytosol in human
      A-549 cells, alongside nuclear-speckle staining. These observations support a cytoplasmic pool outside
      the principal nuclear repair setting, without claiming cytoplasmic repair catalysis or neuronal
      localization in all human tissues. HPA antigen residues 28–166 are shared by the reported products,
