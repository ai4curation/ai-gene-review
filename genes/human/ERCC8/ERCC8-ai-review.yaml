  original_reference_id: PMID:29545921
  qualifier: involved_in
  review:
    summary: CSA contributes to recovery from single-strand breaks in the tested human-cell context.
    action: KEEP_AS_NON_CORE
    reason: PMID:29545921 Results and alkaline-comet Methods compare resting G1 primary CSA-deficient
      patient and control human fibroblasts after methyl methanesulfonate. Delayed removal of alkaline-comet-detected
      breaks supports the existing single-strand-break repair assertion as a contextual contribution.
      A separate transformed-cell wild-type complementation experiment is reported in the main text as
      Supplementary Figure S1, which was not independently recovered. This does not identify CSA as a
      strand-break ligase, glycosylase or end-processing enzyme. Its experimentally defined core work
      remains substrate recruitment and repair-complex assembly in transcription-coupled NER. The neutral-comet
      double-strand-break and irradiation signaling experiments are distinct readouts and do not replace
      the single-strand-break result.
    supported_by:
