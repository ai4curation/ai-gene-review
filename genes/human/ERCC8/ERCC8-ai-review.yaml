core_functions:
- description: Full-length CSA recruits and positions the CUL4A–DDB1–RBX1 ubiquitin ligase at stalled
    RNA polymerase II repair assemblies, supporting substrate ubiquitination and transcription-coupled
    nucleotide-excision repair. CSA contacts CSB and UVSSA and is stabilized by ELOF1; its adaptor interfaces
    organize the reaction without independently catalyzing ubiquitin transfer. Direct reconstitution uses
    human CSA with mouse RBX1 and pig polymerase, complemented by human-cell recruitment and repair assays.
  molecular_function:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  directly_involved_in:
