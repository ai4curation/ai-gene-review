suggested_questions:
- question: Does the 205-residue CSA product accumulate endogenously and assemble a functional DDB1–CUL4A
    substrate-adaptor complex, or does it have a different molecular role?
- question: Does CSA actively recruit or position a CSA molecule for its own ubiquitination, and how does
    that event relate to repair-complex assembly and turnover?
- question: Does CSA contribute directly to classical nonhomologous end joining under defined conditions,
    and how can this be separated from its effects on DNA-damage signaling?
suggested_experiments:
- hypothesis: The two natural CSA products differ in stable ligase assembly and repair activity.
  description: First establish endogenous abundance of each product using product-specific transcript
    analysis and proteotypic peptides. Compare the 396- and 205-residue products at matched near-endogenous
    expression in CSA-null human cells, measuring DDB1/CUL4A assembly, recruitment to stalled polymerase,
    RPB1 ubiquitination and strand-specific excision repair. Include full-length rescue, empty-vector
    and expression/stability controls.
  experiment_type: Product-resolved expression, complex assembly and repair complementation
- hypothesis: CSA ubiquitination can be distinguished mechanistically from passive modification of CSA
    as a nearby substrate.
  description: Reconstitute CRL4CSA with separately distinguishable ligase-bound and candidate substrate
    CSA molecules. Combine CSA interface mutants with verified folding and complex-assembly controls,
    map modified lysines and quantify ubiquitin transfer to each CSA species alongside RPB1 and CSB substrates.
    Compare substrate recruitment with modification to determine whether CSA supplies a specific adaptor
    step in its own ubiquitination.
  experiment_type: Defined-complex reconstitution and ubiquitination-site mapping
- hypothesis: A CSA-dependent double-strand-break phenotype may reflect signaling rather than direct classical
    end-joining work.
  description: Use acute CSA depletion and wild-type rescue in cell-cycle-matched human cells. Measure
    a defined end-joining reporter and repair-junction sequences with KU/LIG4 perturbations as pathway
    controls, alongside physical break-resolution and gamma-H2AX/53BP1 signaling time courses. A repair-specific
    change should be separated from altered signaling, viability or cell-cycle distribution before assigning
    a direct end-joining mechanism.
  experiment_type: Pathway-controlled end-joining and damage-signaling assays
