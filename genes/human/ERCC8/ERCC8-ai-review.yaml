id: Q13216
gene_symbol: ERCC8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ERCC8 encodes CSA, a WD-repeat substrate adaptor of the CUL4A–DDB1–RBX1 ubiquitin ligase.
  In the nucleus, CSA connects this ligase to CSB, UVSSA and the stalled RNA polymerase II repair assembly.
  Its recruitment and positioning interfaces support ubiquitination of polymerase and associated repair
  proteins, TFIIH recruitment and transcription-coupled nucleotide-excision repair. CSA supplies substrate
  recognition and assembly; CSB supplies the DNA motor activity and the RING/E2 machinery mediates ubiquitin
  transfer. These mechanisms are established for full-length CSA, whereas equivalent activity of the 205-residue
  alternative product remains unestablished.
