core_functions:
- description: MTLN is a cardiolipin-binding single-pass membrane microprotein of mitochondria that supports
    the assembly and/or stability of respiratory chain supercomplexes (respirasomes), thereby sustaining
    complex I-linked respiration. It acts structurally at the membrane level rather than as a subunit
    or catalytic component of the complexes.
  molecular_function:
    id: GO:1901612
    label: cardiolipin binding
  directly_involved_in:
  - id: GO:0097250
    label: mitochondrial respirasome assembly
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - *id003
  - *id018
  - *id015
  - *id016
  - reference_id: PMID:41555203
    supporting_text: Together, our results support a model in which Mtln interacts with and protects mitochondrial
      CL pools to reinforce cristae structure, while Mtln loss enhances mitochondrial vulnerability to
      membrane insults and I/R injury.
- description: MTLN enhances mitochondrial fatty acid beta-oxidation, associating with the mitochondrial
    trifunctional protein (HADHA/HADHB) and CPT1B without being required for MTP assembly; loss of MTLN
    lowers fatty acid oxidation in muscle, heart and adipocytes. The molecular activity underlying this
    effect is not established.
  directly_involved_in:
  - id: GO:0032000
    label: positive regulation of fatty acid beta-oxidation
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
