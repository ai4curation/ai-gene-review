- term:
    id: GO:1901612
    label: cardiolipin binding
  evidence_type: ISS
  original_reference_id: PMID:29949756
  qualifier: enables
  review:
    summary: 'Proposed new annotation: mitoregulin binds cardiolipin, the signature phospholipid of the
      inner mitochondrial membrane.'
    action: NEW
    reason: 'Cardiolipin binding is the most direct molecular activity reported for MTLN: cardiolipin-coated
      beads pull down Mtln at least as well as ATP synthase subunit c, a lipid-strip assay shows preference
      for cardiolipin over other membrane lipids, and synthetic human Mtln inserts into mitochondrial-like
      lipid monolayers and alters their packing. The binding assays used mouse tissue lysate, so ISS from
      mouse (identical membrane-proximal basic residues) is used for human. This is a molecular function,
      so the process-participation test does not apply; the binding is plausibly the basis for the supercomplex
      and membrane-stability phenotypes.'
    supported_by:
    - &id018
      reference_id: PMID:29949756
      supporting_text: cardiolipin-coated beads pulled down Mtln from wild-type mouse cardiac tissue lysates
        to a similar or greater degree compared to subunit c, an ATP synthase subunit with high affinity
        for cardiolipin (Figure 2F)
    - reference_id: PMID:29949756
      supporting_text: A lipid-strip binding assay further supported that Mtln preferentially engages
        cardiolipin relative to other common cell membrane lipids (Figure 2G).
    - reference_id: PMID:41555203
      supporting_text: Mtln strongly binds CL,1 and our Langmuir analyses demonstrate that Mtln adsorbs
        onto (and/or into) mitochondrial-like lipid monolayers and alters monolayer properties, reducing
        lipid density and enhancing elasticity.
