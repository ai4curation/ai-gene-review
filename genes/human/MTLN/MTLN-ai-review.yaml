      supporting_text: MOXI exhibited a PK proteolysis resistance pattern similar to that of the IMM marker
        HADHA, and distinct from the OMM protein TOMM20 (Figure 2B), thus substantiating the sub-mitochondrial
        localization of MOXI to the IMM.
    - *id003
    - &id005
      reference_id: PMID:30796188
      supporting_text: Our results perfectly match the conclusions of two independent groups, which showed
        that Mtln localizes in the inner membrane of mitochondria (25, 26).
    - reference_id: PMID:37664623
      supporting_text: Here, by applying multiple orthogonal methods, we concluded that MTLN is primarily
        localized to the mitochondrial outer membrane and has a cytosolic tail.
