  review:
    summary: PAINT/IBA inner mitochondrial membrane for the vertebrate mitoregulin family (PTN002201359),
      grounded in mouse Mtln experimental data.
    action: ACCEPT
    reason: Three independent groups (Stein 2018, Makarewich 2018, Chugunova 2019) placed Mtln in the
      inner mitochondrial membrane by protease protection/fractionation, it binds the IMM-specific lipid
      cardiolipin, and it co-migrates with IMM respiratory complexes. Zhang et al. 2023 reported, using
      split-GFP topology reporters in human cells, that MTLN is primarily in the outer membrane; this
      remains unresolved and is raised in suggested_questions, but it is not sufficient to remove the
      IMM annotations, which are supported by several orthogonal datasets and by later work from the Boudreau
      lab on cristae/cardiolipin.
    supported_by:
    - &id004
