    action: REMOVE
    reason: 'The MTLN-MTP association is reproducible across labs (Friesen 2020 in human adipocytes; Makarewich
      2018 in mouse muscle and HEK293 cells) and is the best mechanistic link between MTLN and fatty acid
      beta-oxidation. However, protein binding is uninformative, and the interaction does not define a
      molecular activity: MTLN is not required for MTP formation or stability, and whether it modulates
