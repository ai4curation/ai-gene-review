  - *id008
  - *id019
suggested_questions:
- question: Is MTLN primarily an inner- or outer-mitochondrial-membrane protein, and does the answer differ
    by cell type or expression level? Split-GFP topology in human cells (Zhang 2023) conflicts with protease-protection
    data from three other groups; should GO:0005741 mitochondrial outer membrane be added alongside or
    instead of GO:0005743?
- question: Is the MTLN effect on fatty acid beta-oxidation a direct modulation of MTP or CPT1B activity,
    or a secondary consequence of improved respiratory chain and membrane organisation, as the Stein 2018
    authors argue?
- question: Does the ~66 kDa MTLN homo-oligomer have an activity of its own (e.g. a pore or channel),
    which would give a more informative molecular function than cardiolipin binding?
suggested_experiments:
- description: Reconstitute purified MTLN with cardiolipin-containing liposomes and isolated complexes
    I, III and IV (or MTP) to test whether MTLN directly promotes supercomplex formation or MTP activity,
    including cardiolipin-binding-deficient mutants of the basic C-terminal tail.
- description: Resolve submitochondrial localisation of endogenous MTLN in human muscle cells and adipocytes
    by APEX2 proximity labelling targeted to matrix, IMS and cytosol, combined with cryo-ET immunogold,
    without overexpression.
