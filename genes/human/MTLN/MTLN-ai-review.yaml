- term:
    id: GO:0097250
    label: mitochondrial respirasome assembly
  evidence_type: IDA
  original_reference_id: PMID:29949756
  qualifier: involved_in
  review:
    summary: Mitochondrial respirasome assembly, from Stein et al. 2018 (supercomplex loss in Mtln-KO
      tissues, co-migration of Mtln with supercomplexes).
    action: ACCEPT
    reason: 'Mtln knockout mice show reduced respiratory supercomplexes and reduced complex I activity
      within I+III2 and respirasome (I+III2+IV) bands, while individual complex levels are unchanged;
      Mtln co-migrates with supercomplexes and the complex I assembly module on BN-PAGE and binds cardiolipin,
      a lipid required for supercomplex stability. This is consistent with a structural, membrane-organising
      contribution to supercomplex assembly/stability rather than a downstream effect, and it is the most
      specific process term for MTLN. Caveats: evidence is from loss-of-function and co-migration rather
      than reconstitution; human overexpression did not change supercomplex levels; and Chugunova 2019
      found complex I+III activity independent of Mtln. The UniProt function line (assembly "and/or stability")
      reflects this uncertainty.'
    supported_by:
    - &id015
