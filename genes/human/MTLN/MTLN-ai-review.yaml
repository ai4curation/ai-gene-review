id: Q8NCU8
gene_symbol: MTLN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Mitoregulin (MTLN; also MOXI, MPM, LEMP, SMIM37) is a 56-amino-acid, vertebrate-conserved
  microprotein translated from a short ORF in a transcript long annotated as the non-coding RNA LINC00116.
  It is most abundant in heart, skeletal muscle and adipose tissue and is induced during myogenic and
  adipogenic differentiation. The peptide has a single transmembrane helix followed by a basic C-terminal
  tail and resides in mitochondrial membranes, most studies placing it in the inner membrane (one study
  places it mainly in the outer membrane). MTLN binds cardiolipin, self-associates into a ~66 kDa, probably
  hexameric, complex, and co-migrates with respiratory supercomplexes, complex I assembly intermediates
  and ATP synthase. It associates with the mitochondrial trifunctional protein (HADHA/HADHB), CPT1B and
  cytochrome b5 reductase CYB5R3. Loss of MTLN reduces respiratory supercomplex levels and complex I-linked
  respiration, lowers fatty acid beta-oxidation, destabilises cristae and cardiolipin, and leads to triglyceride
  accumulation, reduced exercise capacity and impaired muscle differentiation, whereas overexpression
  raises respiration, membrane potential, mitochondrial Ca2+ retention and fatty acid oxidation. It has
  no known catalytic activity and is thought to act as a membrane-organising factor that supports respiratory
  supercomplex assembly or stability and enhances fatty acid oxidation.
