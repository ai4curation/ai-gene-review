    supporting_text: Excited pigment molecules induce both the exchange of GDP to GTP at the guanosine-binding site
      of the transducin
  - reference_id: PMID:12077706
    supporting_text: We therefore argue that the mutations represent functional null alleles of GNAT2
suggested_questions:
- question: Is native GNAT2 expressed in taste receptor cells and does it couple to T2R receptors in vivo, or does
    the bitter-taste annotation rest only on chimera experiments?
suggested_experiments:
- hypothesis: Endogenous cone transducin couples to T2R bitter receptors in taste cells.
  description: Test bitter-taste responses and T2R-evoked signalling in taste cells of Gnat2-null mice, with and
    without gustducin (Gnat3) deletion.
