    label: detection of chemical stimulus involved in sensory perception of bitter taste
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002566474
  - RGD:1309514
  review:
    summary: Bitter taste rests on a chimeric Galpha16 construct, not on GNAT2 acting in taste cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: Both rows trace to one rat IDA (PMID:12917372), propagated by Ensembl and by PAINT, which places the
      term on the GNAT2 node with that rat paper as its only donor. The experiment expressed Galpha16 chimeras carrying
      the C-terminal tail of cone transducin in heterologous cells and found they coupled to T2R bitter receptors;
      the authors say only that Galpha-t2 may be involved in bitter taste. No human or animal evidence shows GNAT2
      itself mediating bitter taste. Consistent with GNAT1, whose taste row is also marked over-annotated.
    supported_by: &id001
    - reference_id: PMID:12917372
      supporting_text: Because Galpha(t2) and Galpha(i2) are expressed in the taste receptor cells, these G-protein
        alpha(i) subunits may also be involved in bitter taste perception via T2R receptors.
