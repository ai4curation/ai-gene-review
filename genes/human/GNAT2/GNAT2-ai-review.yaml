id: P19087
gene_symbol: GNAT2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNAT2 encodes the alpha subunit of cone transducin (Galpha-t2), the heterotrimeric G protein of cone
  photoreceptors, present in all three human cone classes. Photoactivated cone opsins catalyse GDP-GTP exchange
  on GNAT2; the GTP-bound alpha subunit separates from G beta-gamma and activates the cone cGMP phosphodiesterase
  PDE6 by displacing its inhibitory gamma subunit, lowering cGMP and closing the cGMP-gated channels. Intrinsic
  GTPase activity, accelerated by RGS9, returns it to the inactive GDP state. It is N-terminally acylated and acts
  on the cytoplasmic face of the cone outer segment disc membranes, which are infoldings of the plasma membrane;
  under very bright light part of it moves to inner compartments. Biallelic loss of function causes achromatopsia.
