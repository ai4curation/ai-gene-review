core_functions:
- description: 'Alpha subunit of cone transducin: activated by photoexcited cone opsins (GDP-GTP exchange), it activates
    cone PDE6 on the cytoplasmic face of the cone disc membranes and terminates by intrinsic GTP hydrolysis.'
  molecular_function:
    id: GO:0003925
    label: G protein activity
  directly_involved_in:
