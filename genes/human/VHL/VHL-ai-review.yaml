- description: Compare HIF-alpha, RAPTOR, MAP1LC3B, and JADE1 turnover in cells reconstituted with VHL mutants that selectively
    disrupt Elongin B/C, hydroxylated-HIF binding, or the reported LC3B LIR to separate core CRL2 substrate recognition from
    peripheral branches.
