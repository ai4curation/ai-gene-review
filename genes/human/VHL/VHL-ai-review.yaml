id: P40337
gene_symbol: VHL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: VHL is a cytosolic and nucleoplasmic substrate-recognition subunit of an Elongin B/C-CUL2-RBX1 Cullin-RING ubiquitin
  ligase. It binds prolyl-hydroxylated HIF-alpha transcription factors in oxygenated cells and presents them for ubiquitination
  and proteasomal degradation, thereby restraining HIF-driven hypoxic transcription programs. VHL also has supported peripheral
  substrate or partner branches, including RAPTOR/mTORC1 regulation, MAP1LC3B-dependent autophagy regulation, JADE1 stabilization,
  and transcriptional repression through FIH-1.
