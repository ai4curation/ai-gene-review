suggested_questions:
- question: 'Which molecular step connects nuclear ChAT catalytic competence to SLC5A7 expression:
    acetylcholine production, acetyl-CoA availability, another substrate, or a partner-dependent
    mechanism?'
- question: How do the three current human CHAT products differ in endogenous localization and catalytic
    contribution across motor neurons, other cholinergic neurons and non-neuronal cells?
- question: Which CHAT-3 yeast two-hybrid partners interact endogenously, and do the transcription-factor
    associations affect ChAT activity or gene expression without confounding substrate or product
    effects?
suggested_experiments:
- description: Measure endogenous product-specific localization and compartmental acetylcholine synthesis
    using validated N-terminal reagents and sequence-verified rescue constructs, separating nuclear
    import from catalytic competence.
- description: Validate selected source-matched CHAT-3 interactions in human cholinergic cells at
    endogenous abundance, retaining exact partner isoforms and testing whether the associations alter
    catalysis rather than inferring function from partner identity.
