      not establish CHAT performing PC-forming chemistry, a structural/cofactor step in that synthesis,
      or regulation of that process. Mark this source-scoped pathway projection as over-annotated,
      while retaining the independently supported acetylcholine-biosynthesis assertion already present.
      This does not assert that CHAT can never influence choline or lipid metabolism.
