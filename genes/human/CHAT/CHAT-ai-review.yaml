id: P28329
gene_symbol: CHAT
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Choline acetyltransferase catalyses transfer of an acetyl group from acetyl-CoA to choline,
  producing acetylcholine. It supplies the neurotransmitter in cholinergic neurons, including motor-neuron
  terminals, and is essential for normal neuromuscular transmission. Human CHAT produces proteins
  with distinct N-terminal extensions. The common smaller enzyme is principally cytoplasmic and can
  shuttle through the nucleus; the larger primate product is enriched in neuronal nuclei. Nuclear
  ChAT can affect choline-transporter expression in human neuronal cells, although the molecular
  connection remains unresolved. Pathogenic variants impair acetylcholine synthesis and can cause
  congenital myasthenic syndrome with episodic apnea.
