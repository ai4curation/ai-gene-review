- description: Catalyses acetyl-CoA-dependent acetylation of choline to supply acetylcholine for
    cholinergic neurotransmission, including the neuromuscular junction. This is intrinsic enzyme
    activity; synaptic vesicle loading and transmitter release are performed by other machinery.
