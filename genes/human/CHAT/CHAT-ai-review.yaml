  review:
    summary: Parent-pathway membership extends the annotation beyond the CHAT-catalysed reaction.
    action: MARK_AS_OVER_ANNOTATED
    reason: R-HSA-1483191 genuinely includes R-HSA-264622 among PC-synthesis, lipid-transport and
      choline-recycling events. Its exact CHAT catalyst264613 consumes choline and acetyl-CoA and
      produces acetylcholine and CoA in the cytosol. GO:0006656 denotes formation of phosphatidylcholine,
