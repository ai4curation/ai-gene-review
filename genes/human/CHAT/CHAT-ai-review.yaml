    label: choline O-acetyltransferase activity
  evidence_type: EXP
  original_reference_id: PMID:17144655
  qualifier: enables
  review:
    summary: Human CHAT catalyses acetylcholine synthesis.
    action: ACCEPT
    reason: The original human structural paper identifies the substrate-binding enzyme and models
      direct acetyl transfer. Its full original Methods were not recovered, so no experimentally
      solved ternary intermediate is claimed. Independent full primary experiments with purified
      human ChAT measure conversion of choline and acetyl-CoA to acetylcholine, supporting the correct
      catalytic assertion.
    supported_by:
    - reference_id: PMID:17144655
      supporting_text: structure of human ChAT
    - reference_id: PMID:11172068
