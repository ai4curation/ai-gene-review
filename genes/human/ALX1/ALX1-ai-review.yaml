core_functions:
- description: Binds regulatory DNA through its paired-like homeodomain and regulates RNA 
    polymerase II transcription in the nucleus. Human hCART1 activates selected-site reporters 
    and represses a distinct promoter; endogenous ALX1 chromatin occupancy and perturbation in 
    human cranial neural crest cells connect this activity to developmental transcriptional 
    programs. This synthesis does not impose a universal oligomeric stoichiometry or borrow ALX4
    structural measurements.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
