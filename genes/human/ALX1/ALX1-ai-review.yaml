id: Q15699
gene_symbol: ALX1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALX1 (CART1) is a paired-like homeodomain transcription factor that recognizes 
  regulatory DNA and can activate or repress transcription depending on the promoter and 
  cellular context. It acts in the nucleus and is enriched at developmental regulatory chromatin
  in human cranial neural crest cell models. ALX1 contributes to craniofacial mesenchymal and 
  skeletal patterning; biallelic human variants cause frontonasal dysplasia, while mouse and 
  zebrafish studies resolve additional lineage and developmental-stage requirements. In 
  responsive human epithelial and ovarian cancer models, ALX1 promotes SNAI1 expression and 
  epithelial-to-mesenchymal transition. Its sequence recognition and transcriptional activity 
  are established, whereas native oligomeric stoichiometry and the physiological roles of many 
  high-throughput interaction partners remain less well resolved.
existing_annotations:
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:8756334
  qualifier: acts_upstream_of_or_within
  review:
    summary: Human ALX1 represses a promoter through a defined AT-rich regulatory element.
    action: ACCEPT
    reason: The original human Cart1 cDNA study measures repression of a rat prolactin promoter 
      through footprint II. The promoter species does not change the identity of the human 
      protein tested. The abstract does not identify the reporter host, so it is not inferred 
      from the separate HeLa/GH3/10T1/2 expression survey. This positive repression result 
      complements activation on other promoters (PMID:9753625).
    supported_by:
    - reference_id: PMID:8756334
      full_text_unavailable: true
      supporting_text: "Cotransfection studies show that Cart-1 inhibits the rat\nprolactin promoter
        and that this repression is mediated by footprint II, an\nAT-rich element that functions as
        an inhibitory site of prolactin gene\nexpression in nonpituitary cells and which was used
        to clone Cart-1."
- term:
