suggested_questions:
- question: Which physiological ALX1 cofactors and regulatory DNA architectures determine 
    activation versus repression in human craniofacial mesenchymal lineages?
- question: Does human ALX1 form an obligatory DNA-bound homodimer, or do its oligomeric 
    partners and stoichiometry vary across endogenous regulatory sites?
- question: Which ancestral-clade experiments support the PAINT neuron-development assertion, 
    and does ALX1 regulate neuronal maturation independently of its neural crest and cranial 
    mesenchyme functions?
- question: Which curated ALX1 interaction partners have a reproducible physiological role in 
    its nuclear localization or transcriptional regulation, beyond pairwise high-throughput 
    detection?
- question: How does the early mouse cranial-mesoderm requirement for Alx1 relate to human 
    extraocular muscle development and ALX1-associated disease?
