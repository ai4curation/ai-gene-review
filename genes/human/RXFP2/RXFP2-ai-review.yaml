  review:
    summary: Mark oocyte maturation as over-annotated for human RXFP2.
    action: MARK_AS_OVER_ANNOTATED
    reason: This Ensembl Compara row is transferred from rat RXFP2. A search for human RXFP2 oocyte-maturation evidence did not find a direct human counterpart to the rat INSL3/Lgr8 follicle work, so the tissue process remains over-propagated to human.
