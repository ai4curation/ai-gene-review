  review:
    summary: Keep adenylate cyclase-inhibiting GPCR signaling as a secondary RXFP2 branch.
    action: KEEP_AS_NON_CORE
    reason: The Ensembl Compara row is transferred from rat RXFP2, and human RXFP2 also has an inhibitory GalphaoB/G-betagamma branch that modulates Gs-driven cAMP accumulation; keep the term as a secondary signaling branch rather than marking it over-annotated.
