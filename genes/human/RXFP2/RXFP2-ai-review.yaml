description: RXFP2 encodes relaxin family peptide receptor 2, a plasma-membrane leucine-rich-repeat GPCR activated by insulin-like peptide 3 and relaxin-family peptides. Ligand binding stimulates adenylate-cyclase signaling and a GalphaoB-linked inhibitory cAMP branch, with INSL3/RXFP2 signaling contributing to reproductive tract development.
