suggested_questions:
- question: >-
    Should relaxin-family two-chain protein hormones and their LGR-family GPCRs be
    classified under GO:0008528 G protein-coupled peptide receptor activity, under
    GO:0016500 protein-hormone receptor activity by analogy to insulin receptor
    activity, or under a new relaxin/INSL3 receptor branch that avoids choosing one
    side of GO's peptide-versus-protein hormone split?
