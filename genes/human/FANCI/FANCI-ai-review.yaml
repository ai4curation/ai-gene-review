  review:
    summary: FANCI makes a structural and regulatory contribution to interstrand cross-link repair.
    action: ACCEPT
    reason: 'PMID:19965384 directly establishes the ID2 requirement for replication-coupled ICL repair
      in Xenopus extracts: FANCD2 depletion also removes much FANCI, recombinant WT ID2 restores repair,
