  review:
    summary: Independent human imaging supports a cytosolic FANCI pool; the original IDA paper remains
      an access-limited source.
    action: MODIFY
    reason: 'PMID:18445686 was verified by identifier and abstract, but its operative FANCI localization
      material was not recovered through the finite publisher/author routes. An EML3-focused title
      and a predominantly nuclear repair role do not disprove the curator’s experimental cytoplasmic
      annotation. Independently inspected current Human Protein Atlas XML and the selected HPA040379
      A-431 and U-251MG images support nucleoplasm plus cytosol. This positive target evidence supports
      refinement to GO:0005829 for the cytosolic pool without retrospectively claiming to have read
      the 2008 FANCI experiment. Enhanced antibody validation does not establish absolute specificity:
      the HeLa BAC-GFP validation is mainly nuclear and the XML explicitly notes additional antibody
      locations. The refinement is neither exclusive localization nor a denial of other cytoplasmic
      pools, and it does not resolve natural-product identities. The inherited assertion that a cytoplasmic
      pool is necessarily nonfunctional is unsupported and is withdrawn.'
    supported_by:
    - reference_id: PMID:18445686
