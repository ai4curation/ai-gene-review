core_functions:
- description: Binds DNA secondary structures and contributes the DNA-contacting architecture of the FANCI–FANCD2
    repair complex. Purified human FANCI binds junction and Y DNA; unmodified human ID2 has modest branched-substrate
    preference, whereas ubiquitination remodels ID2 into a DNA-encircling clamp with reduced branched
    preference. A complex with ubiquitin on FANCD2 alone can close, so FANCI Lys523 modification is not
    an absolute prerequisite for the observed ring. FANCI DNA binding and phosphorylation also promote
    FANCD2 monoubiquitination, supporting repair beyond merely serving as a ubiquitination substrate.
    The structural/regulatory contribution supports ICL repair and broader repair participation; FANCL/UBE2T
    and downstream nucleases/polymerases perform their respective chemistry. The DNA-binding Methods retain
    substrate length/charge caveats, and clamp sliding does not establish polymerase-processivity activity.
