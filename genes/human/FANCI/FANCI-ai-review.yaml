gene_symbol: FANCI
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FANCI is a DNA-binding protein that forms the FANCI–FANCD2 (ID2) complex and helps
  organize DNA interstrand cross-link repair. It contacts branched DNA and contributes to the DNA-encircling
  architecture of ubiquitinated ID2. FANCI DNA binding and phosphorylation promote FANCD2 monoubiquitination,
  while FANCL and UBE2T catalyze ubiquitin transfer; the principal FANCI acceptor site is Lys523.
  FANCI also has FANCD2-independent functions: it promotes dormant replication-origin firing during
  mild replication stress and supports recruitment of the FA core complex to damage sites. A nucleolar
  pool associates with RNA polymerase I and ribosome-biogenesis factors and supports pre-rRNA production
  and processing. Purified FANCI binds RNA, while human ID2 recognizes single-stranded RNA and exposed
  single strands in R-loops. In p53-deficient cells with persistent cross-links, FANCI can recruit
  PIDD1 to initiate pro-apoptotic signaling. FANCI occupies nucleoplasmic, chromatin-associated and
  nucleolar pools; a cytosolic pool has also been observed. Biallelic defects cause Fanconi anaemia
  complementation group I.'
