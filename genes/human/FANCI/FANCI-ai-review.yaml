suggested_questions:
- question: How do the four natural FANCI products differ in DNA binding, ID2 assembly, modification
    and repair activity at endogenous abundance?
- question: What biochemical role, if any, does the independently observed cytosolic FANCI pool perform,
    and does it vary with cell state?
suggested_experiments:
- hypothesis: Natural FANCI splice products differ in the DNA-contacting or partner-assembly properties
    measured with full-length constructs.
  description: Compare sequence-verified 1328-, 1268-, 1267- and 252-residue products at matched
    near-endogenous abundance in a defined FANCI-loss background. Measure localization, FANCD2 association,
    DNA binding and FANCD2 monoubiquitination alongside ICL survival and an independent HR reporter.
    Include empty-vector and full-length rescue controls; separate instability from loss of a particular
    activity.
- hypothesis: The cytosolic signal represents a regulated FANCI pool distinguishable from antibody
    cross-reactivity and preparation-induced redistribution.
  description: Combine endogenous tagging, orthogonal antibodies and controlled nuclear/cytosolic
    fractionation across cell-cycle and damage conditions. Confirm the protein species by targeted
    proteomics before testing partner interactions or biochemical activity; do not infer function
    from localization alone.
