      human FANCI/ID2 DNA-binding and clamp experiments (PMID:19589784; PMID:32269332) establish the target’s
      own structural work, rather than only its necessity or substrate status. Retain GO:0036297 for that
      repair contribution, without transferring every downstream enzyme step to FANCI or treating all
      natural products as experimentally equivalent.'
