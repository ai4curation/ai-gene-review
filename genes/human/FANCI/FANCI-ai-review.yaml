  review:
    summary: Retain the inherited DNA secondary structure binding proposal with direct human evidence
      and state-specific limits.
    action: NEW
    reason: 'Retain this inherited authored proposal rather than create another annotation. Current GO:0000217
      covers binding to DNA secondary structures, including branched/junction substrates. Purified human
      1328-residue FANCI and C-terminal fragments in PMID:19589784 bind DNA directly and preferentially
      bind Holliday-junction/Y substrates in the inspected competition assays and Figure 2. That paper
      calls the 1328-residue reagent isoform 1; this historical label must not be equated with today’s
      1268-residue Q9NVI1-1. PMID:32269332 supplies independent human ID2 structures and binding assays:
      unmodified ID2 has modest branched-substrate preference, while monoubiquitination remodels it into
      a clamp on ordinary duplex DNA and reduces that preference. The term therefore describes an experimentally
      demonstrated activity, not an invariant preference of every modification state. PMID:27694619 additionally
      tests purified chicken FANCI DNA-binding mutants in RAD51-filament protection; those assays are
      conserved support rather than human mutant experiments. The same-role comparator check finds current
      four-way-junction-binding annotations on RAD51C and XRCC2; its child GO:0000400 would represent
      only part of FANCI’s tested substrate range. The current FANCD2 query did not verify the inherited
      claim that it carries GO:0003697, so that claim is not retained. The fixed current GO-CAM index
      has no FANCI/Q9NVI1 entry; this is not evidence of curator omission. No imported annotation or other
      proposed replacement in this file is an ancestor/descendant DNA-binding assertion. The independent
      target assays, not pathway completeness, justify retaining the single existing proposal. All four
      historical supporting quotations retain their exact paths and reference associations.'
    supported_by:
    - reference_id: PMID:32269332
      supporting_text: FANCI and FANCD2 are paralogs that bind to DNA with preference for branched structures
        including Holliday junction, overhang and replication fork DNA
    - reference_id: PMID:32269332
      supporting_text: the monoubiquitinated ID complex loses its preference for ICL and related branched
        DNA structures, and becomes a sliding DNA clamp that can coordinate the subsequent repair reactions
    - reference_id: PMID:19589784
      supporting_text: We show that FANCI and its C-terminal fragment possess a DNA binding activity that
        prefers branched structures.
    - reference_id: PMID:27694619
      supporting_text: The DNA binding activity of FANCI is required for the I-D complex-mediated stabilization
        of the RAD51-DNA filament.
