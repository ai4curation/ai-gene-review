id: Q9NVI1
gene_symbol: FANCI
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FANCI is a DNA-binding component of the FANCI–FANCD2 (ID2) complex that helps organize DNA
  repair in nuclear and chromatin-associated pools. Human FANCI binds DNA, including branched junction
  substrates. Ubiquitination remodels ID2 into a closed DNA-encircling clamp, with altered substrate preference.
  FANCI DNA binding and phosphorylation also promote FANCD2 monoubiquitination; FANCL and UBE2T catalyze
  ubiquitin transfer. These structural and regulatory functions support interstrand cross-link repair,
  while human perturbation studies also implicate FANCI in homologous-recombination repair and DNA-damage
  checkpoints. A cytosolic pool has been observed, but its biochemical role is less clear. FANCI defects
  underlie Fanconi anaemia complementation group I. The activities and localization of the four natural
  splice products have not been established as equivalent to the full-length and engineered proteins used
  in these experiments.
