  qualifier: acts_upstream_of_or_within
  review:
    summary: FANCI positively regulates FANCD2 monoubiquitination, supporting the specific process
      term.
    action: MODIFY
    reason: 'PMID:18931676 separately tests chicken DT40 cells and human U2OS cells. The actual human
      Figure 6 and Methods show that FANCI phosphosite substitutions reduce FANCD2 monoubiquitination
      and foci; the chicken phosphomimetic and knockout/rescue experiments have their own organism
      and mutant scope. The specific supported outcome is monoubiquitination, matching current GO:1902527,
      an is_a child of GO:0031398. Independent purified assays in PMID:22287633 use chicken FANCI/FANCD2/FANCL
      with human E1/UBE2T: the FANCI Ex6 DNA-binding-defective mutant retains complex formation but
      loses efficient stimulation of FANCD2 monoubiquitination, whereas FANCI K525R can still stimulate
      it. Thus FANCI contributes DNA-dependent organization/regulation and is not merely the ubiquitination
      substrate. FANCL and UBE2T execute ubiquitin transfer; neither their catalytic activity nor
      uniform behavior of the four natural human products is assigned to FANCI.'
    supported_by:
    - reference_id: PMID:18931676
      supporting_text: FANCI phosphorylation exerts an evolutionarily conserved function in inducing
        FANCD2 monoubiqutination in human cells as well.
    - reference_id: PMID:22287633
      supporting_text: The DNA-binding activity of FANCI is required to stimulate FANCD2 monoubiquitylation
    proposed_replacement_terms:
