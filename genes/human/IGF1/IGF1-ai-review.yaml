id: P05019
gene_symbol: IGF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IGF1 encodes insulin-like growth factor 1, a small secreted peptide hormone
  and growth factor structurally related to insulin. Produced largely by the liver
  under growth-hormone control and circulating bound to IGF-binding proteins and the
  acid-labile subunit in a ternary complex, it acts as the principal ligand for the
  cell-surface receptor tyrosine kinase IGF1R (and binds the insulin receptor and
  alphav-beta3 integrin), triggering PI3K-AKT and Ras-MAPK cascades. IGF1 drives somatic,
  skeletal and muscle growth, cell proliferation, survival and differentiation, and
  anabolic metabolism across many tissues.
