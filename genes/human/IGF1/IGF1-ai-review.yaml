    supporting_text: Acts as a ligand for IGF1R
suggested_questions:
- question: How do specific IGFBPs and the ternary complex quantitatively partition
    IGF1 between endocrine reserve and local receptor activation in different tissues?
- question: Which IGF1 activities require integrin (alphav-beta3) co-engagement versus
    IGF1R alone?
suggested_experiments:
- description: Tissue-specific IGF1 or IGF1R knockouts with matched growth, metabolic
    and survival readouts to separate endocrine from autocrine/paracrine actions.
  experiment_type: in vivo physiology
- description: Structure-guided IGF1 mutants that selectively disrupt IGF1R versus
    insulin-receptor or integrin binding, assayed for downstream PI3K-AKT and Ras-MAPK
    output.
  experiment_type: biochemistry
