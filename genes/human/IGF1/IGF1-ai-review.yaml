core_functions:
- description: Secreted peptide hormone and growth factor that acts as the principal
    ligand for IGF1R, triggering PI3K-AKT and Ras-MAPK signaling that drives growth,
    proliferation and survival.
  molecular_function:
    id: GO:0005179
    label: hormone activity
