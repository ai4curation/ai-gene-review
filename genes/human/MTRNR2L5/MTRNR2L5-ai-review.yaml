- term:
    id: GO:0072734
    label: cellular response to staurosporine
  evidence_type: IMP
  original_reference_id: PMID:19477263
  qualifier: involved_in
  review:
    summary: 'UniProt curation of the Bodzioch data: MTRNR2L5 transcript falls 6 h and rises 24 h after
      staurosporine treatment, and synthetic HN5 peptide protects cells against staurosporine-induced
      apoptosis.'
    action: KEEP_AS_NON_CORE
    reason: 'Two different observations stand behind this row and they differ in strength. That the transcript
      changes level after staurosporine [PMID:19477263] is regulation of the gene, which on its own is
      thin support for involvement in a cellular response. The stronger part is that the synthetic HN5
      peptide actively limits staurosporine-induced death [PMID:19477263], which is participation rather
      than mere responsiveness. I keep the term on that basis but mark it non-core: staurosporine is a
      laboratory kinase inhibitor, so the term records the assay in which the activity was seen rather
      than a physiological role, and the physiologically meaningful statement is the apoptosis term.'
    supported_by:
    - reference_id: PMID:19477263
      supporting_text: Cytoprotection against the STS-induced apoptosis conferred by the polymorphic
        HN5 variant, in which threonine in position 13 is replaced with isoleucine, is reduced 
        compared to the wild type HN5 peptide.
    - reference_id: PMID:19477263
      supporting_text: At least ten of these nuclear genes are expressed in human tissues, and 
        respond to staurosporine (STS) and beta-carotene.
- term:
