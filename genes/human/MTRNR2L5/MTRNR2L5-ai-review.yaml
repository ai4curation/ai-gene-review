id: P0CJ72
gene_symbol: MTRNR2L5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MTRNR2L5 is a nuclear human locus on chromosome 10 that resembles the humanin small open
  reading frame of the mitochondrial large-subunit rRNA gene MT-RNR2, one of thirteen such MT-RNR2-like
  sequences in the human genome that are generally interpreted as nuclear insertions of mitochondrial
  DNA. Its predicted product, humanin-like 5 (HN5), is a 24-residue peptide (MATPGFSCLLLSTSEIDLPMKRRV)
  that matches humanin at 19 of 24 aligned positions, differing by Pro3->Thr, Arg4->Pro, Leu12->Ser, Val20->Met
  and Ala24->Val. The locus is transcribed: RT-PCR detects it in human tissues, most strongly in testis
  and brain, and its transcript level changes after staurosporine and beta-carotene treatment of cultured
  cells (down-regulated 6 h and up-regulated 24 h after staurosporine, and persistently down-regulated
  by beta-carotene). Whether a peptide is actually made from this transcript, and what it does, is unestablished:
  no HN5 peptide has been detected in human tissue or fluid, no molecular activity has been measured for
  it, and no binding partner or receptor interaction has been reported. The humanin peptide from which
  it is named is cytoprotective and antiapoptotic, binds BAX, BID, BIM and IGFBP3 intracellularly and
  signals through FPRL1/FPR2 and a CNTFR-alpha/WSX-1/gp130 complex when secreted, but those properties
  were measured on the mitochondrially encoded peptide and on synthetic analogues of it, not on this gene
  product.'
