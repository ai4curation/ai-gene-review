- term:
    id: GO:0048019
    label: receptor antagonist activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002141596
  - UniProtKB:Q8IVG9
  review:
    summary: Phylogenetic propagation of humanin's receptor antagonist activity to MTRNR2L5 from the
      humanin-family node PANTHER:PTN002141596. The grounding experiment is humanin competing with 
      amyloid-beta at FPRL1 [PMID:15153530]; nothing comparable has been done with HN5.
    action: MARK_AS_OVER_ANNOTATED
    reason: "The IBD behind this row places the activity at the humanin-family node, and the placement
      is reasonable for the mitochondrial peptide: humanin is a genuine FPRL1 ligand and the antagonism
      of amyloid-beta at that receptor is directly observed [PMID:15153530]. Arguing with the row means
      asking whether MTRNR2L5 sits inside the clade that inherited the function, and the difficulty is
      that the question is not really phylogenetic. The nuclear MT-RNR2-like loci are copies of a mitochondrial
      rRNA segment, so descent in this tree tracks genomic sequence rather than a protein-coding lineage,
      and membership of the node does not establish that the ORF is translated, that the peptide is stable,
      or that it reaches a receptor. On residues: HN5 keeps Thr13 and Ser14 and is the one nuclear humanin-like
      peptide that has been synthesised and assayed: the wild-type peptide is cytoprotective against staurosporine-induced
      apoptosis and the common Thr13->Ile variant (dbSNP rs11004928) is less so [PMID:19477263]. Bodzioch
      et al., who defined these loci, singled out position 13 as the one that may matter for cell-surface
      receptor binding [PMID:19477263]. A second, term-level point applies to every member of this node:
      receptor antagonist activity describes humanin's competition with amyloid-beta at FPRL1, which is
      a property measured in a specific assay, whereas humanin also carries receptor ligand activity by
      IDA - so even for the donor the term captures one facet of the interaction. The node placement is
      defensible and the row may yet prove right, so this is an over-annotation rather than an error:
      it states an activity for a gene product that has never been shown to exist, let alone to engage
      a receptor."
    supported_by:
    - reference_id: PMID:15153530
      supporting_text: Humanin shares human FPRL1 and mouse FPR2 with Abeta(42) and suggest that 
        Humanin may exert its neuroprotective effects by competitively inhibiting the access of 
        FPRL1 to Abeta(42).
    - reference_id: PMID:19477263
      supporting_text: Proline vs serine in position 19 may determine whether the peptide is 
        secreted or not, while threonine in position 13 may be important for cell surface receptor 
        binding.
    - reference_id: PMID:35372353
      supporting_text: It is predicted that these various isoforms might contribute to differential 
        neuroprotective effects and receptor binding, but their individual roles remain to be 
        investigated.
    propagation_review:
