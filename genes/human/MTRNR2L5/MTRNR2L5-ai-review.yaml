    label: negative regulation of mitochondrial membrane permeability involved in apoptotic process
  evidence_type: IMP
  original_reference_id: PMID:19477263
  qualifier: involved_in
  review:
    summary: UniProt curation from the same study. The cached record for PMID:19477263 is 
      abstract-only and the abstract reports cytoprotection against staurosporine-induced apoptosis 
      without mentioning mitochondrial membrane permeability or any mitochondrial readout.
    action: UNDECIDED
    reason: 'I cannot adjudicate this row. The curator who made it had the full text, which is not in
      the publication cache here, and mitochondrial outer-membrane permeabilisation is the standard readout
      in staurosporine apoptosis experiments, so a cytochrome c release or membrane-potential measurement
      on HN5-treated cells is entirely plausible and would support the term directly. It is also the most
      mechanistically specific claim made about any nuclear humanin-like peptide, and it is not derivable
      from the abstract. Following the rule for unverifiable experimental annotations, I leave it UNDECIDED
      rather than guess: resolving it needs the figure in which permeability was measured, and whether
      it was measured with HN5 or with humanin.'
    supported_by:
