      MTRNR2L5, Leu9-Leu11 and Pro19 are intact; Val20 is replaced by methionine within the Pro19-Val20
      secretion segment. The claim may well be right if the peptide exists, so I mark it as an over-annotation
      rather than removing it: what is wrong is that it is asserted of this locus on the strength of humanin
      alone."
