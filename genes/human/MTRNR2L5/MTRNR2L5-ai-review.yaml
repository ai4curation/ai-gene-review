core_functions:
- description: 'The HN5 peptide encoded by this locus is cytoprotective: synthesised and applied to cells,
    it limits staurosporine-induced apoptosis, and a common natural Thr13->Ile substitution reduces that
    protection. No molecular activity, receptor interaction or binding partner has been identified for
    it, so no molecular function term is asserted here; the humanin activities (BAX/BID/BIM binding, FPRL1
    engagement) were measured on the mitochondrially encoded peptide and are not evidence about this one.
    Whether the locus produces the peptide in vivo remains open.'
  directly_involved_in:
  - id: GO:1900118
    label: negative regulation of execution phase of apoptosis
  supported_by:
  - reference_id: PMID:19477263
    supporting_text: Cytoprotection against the STS-induced apoptosis conferred by the polymorphic 
      HN5 variant, in which threonine in position 13 is replaced with isoleucine, is reduced 
      compared to the wild type HN5 peptide.
proposed_new_terms: []
suggested_questions:
- question: Is a peptide produced from the MTRNR2L5 locus at all? Everything annotated to this gene 
    follows from the assumption that it is, and the assumption rests on an intact open reading frame
    plus RT-PCR detection of the transcript [PMID:19477263]. Targeted mass spectrometry of testis 
    and brain for the HN5-specific tryptic peptides would settle it.
  experts:
  - Alan Saghatelian
  - Pinchas Cohen
  - Jonathan Wren
- question: How should GO treat a family in which one member has all the experimental evidence and 
    twelve nuclear copies have none? The present solution propagates humanin's activity to every 
    copy through PANTHER:PTN002141596, which produces thirteen gene products annotated as receptor 
    antagonists and apoptosis regulators on the strength of one mitochondrial peptide. A node 
    restricted to MT-RNR2 plus MTRNR2L5, the two sequences with functional data, would say what is 
    actually known.
- question: Can any assay distinguish HN5 from humanin and from the other nuclear humanin-like 
    peptides? HN5 matches humanin at 19 of 24 positions, so ELISA and antibody-based measurements of
    circulating humanin-like peptides - which exist in the clinical literature for other members of 
    this family - cannot be assumed to be locus-specific. This question governs how all biomarker 
    reports about this family should be read.
  experts:
  - Pinchas Cohen
- question: Was mitochondrial membrane permeability measured directly in the HN5 experiments, and 
    with which peptide? The answer decides whether GO:1902109 belongs on this gene; it is left 
    UNDECIDED here because the cached record is abstract-only.
  experts:
  - Marek Bodzioch
suggested_experiments:
- description: Targeted (PRM) mass spectrometry of human testis and brain and of plasma for peptides
    unique to HN5, using the positions at which it differs from humanin (Pro3->Thr, Arg4->Pro, 
    Leu12->Ser, Val20->Met and Ala24->Val) to design discriminating transitions. This is the one 
    experiment that would convert the entire annotation set on this gene from inference to 
    observation.
- description: Ribosome profiling or ORF-capture of the MTRNR2L5 transcript in a tissue where it is 
    expressed, to test whether the predicted ORF is translated rather than merely transcribed.
- description: Synthesise the HN5 peptide and run it side by side with humanin in the assays that 
    define humanin activity - staurosporine- and amyloid-beta-induced death, FPRL1 competition, BAX 
    binding - as was done for HN5 alone [PMID:19477263]. Side-by-side potencies would show whether 
    the shared annotations are warranted and would put numbers on the contribution of the 
    substituted residues.
- description: CRISPR deletion of the MTRNR2L5 locus in a human cell line that expresses it, with 
    apoptosis challenge, to test whether the locus contributes to cytoprotection as a gene rather 
    than as a synthetic peptide. The thirteen near-identical loci make guide design the hard part, 
    and off-target cutting at the paralogs is the control that matters.
