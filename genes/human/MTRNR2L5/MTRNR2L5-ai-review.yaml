- term:
    id: GO:1900118
    label: negative regulation of execution phase of apoptosis
  evidence_type: IMP
  original_reference_id: PMID:19477263
  qualifier: involved_in
  review:
    summary: 'UniProt experimental annotation from the HN5 cytoprotection assay: synthetic wild-type HN5
      peptide reduces staurosporine-induced apoptosis, and the Thr13->Ile variant peptide (dbSNP rs11004928)
      does so less effectively.'
    action: ACCEPT
    reason: 'This is the only experimentally grounded functional annotation on any of MTRNR2L1-7, and
      it is the reason MTRNR2L5 is the donor for the family-wide IBA rows. The assay is informative in
      both directions: the wild-type peptide protects, and a single natural substitution at position 13
      reduces protection, which is a structure-activity result rather than a bare phenotype [PMID:19477263].
      I accept it, with the caveat that the experiment establishes an activity of the HN5 sequence as
      a synthetic peptide and does not show that the MTRNR2L5 locus produces that peptide in cells - the
      gap that runs through this whole gene family. The evidence code IMP is generous for a synthetic-peptide
      experiment, but the cached record is abstract-only, so whether cells were also manipulated for MTRNR2L5
      expression cannot be checked here.'
    supported_by:
    - reference_id: PMID:19477263
      supporting_text: Cytoprotection against the STS-induced apoptosis conferred by the polymorphic
        HN5 variant, in which threonine in position 13 is replaced with isoleucine, is reduced 
        compared to the wild type HN5 peptide.
    - reference_id: PMID:19477263
      supporting_text: Humanin (HN) is a recently identified neuroprotective and antiapoptotic 
        peptide derived from a portion of the mitochondrial MT-RNR2 gene.
