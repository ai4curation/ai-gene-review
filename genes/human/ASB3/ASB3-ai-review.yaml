      of ASB3 inhibits type I IFN (IFN-I) responses induced by Sendai virus (SeV) and IAV, and ablation
      of ASB3 restores SeV and H9N2 infection-mediated transcription of IFN-β and its downstream interferon-stimulated
      genes (ISGs)."]'
    supported_by:
