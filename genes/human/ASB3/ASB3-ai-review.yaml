core_functions:
- description: ASB-family CRL5 substrate receptor that binds TNF-R2, MAVS, TRAF6 and DR5 through its ankyrin
    repeats and targets them for ubiquitination and proteasomal degradation.
  molecular_function:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  substrates:
  - id: UniProtKB:P20333
    label: TNFRSF1B
  - id: UniProtKB:Q7Z434
    label: MAVS
  - id: UniProtKB:Q9Y4K3
    label: TRAF6
  directly_involved_in:
  - id: GO:0016567
    label: protein ubiquitination
  - id: GO:0043161
    label: proteasome-mediated ubiquitin-dependent protein catabolic process
  - id: GO:0039536
    label: negative regulation of RIG-I signaling pathway
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:15899873
    supporting_text: While the ankyrin repeats of ASB3 interact with the C-terminal 37 amino acids of
      TNF-R2, the SOCS box of ASB3 is responsible for recruiting the E3 ubiquitin ligase adaptors Elongins-B/C,
      leading to TNF-R2 ubiquitination on multiple lysine residues within its C-terminal region.
  - reference_id: PMID:15899873
    supporting_text: ASB3 expression and activities are required for (i) TNF-R2 ubiquitination both in
      vivo and in vitro, (ii) TNF-R2 proteolysis via the proteasome pathway, and (iii) the inhibition
      of TNF-R2-mediated Jun N-terminal protein kinase (JNK) activation.
  - reference_id: PMID:39266719
    supporting_text: Mechanistically, ASB3 interacts with MAVS and directly mediates K48-linked polyubiquitination
      and degradation of MAVS at K297, thereby inhibiting the phosphorylation of TBK1 and IRF3 and downregulating
      downstream antiviral signaling.
  - reference_id: PMID:39162488
    supporting_text: Mechanistically, ASB3 specifically catalyzes K48-linked polyubiquitination of TRAF6
      in intestinal epithelial cells.
proposed_new_terms: []
suggested_questions:
- question: How does a single ASB3 receptor select substrates as diverse as TNF-R2, MAVS, TRAF6 and DR5,
    and are these targets cell-type specific?
suggested_experiments:
- description: Map the ankyrin-repeat contacts for each ASB3 substrate and test substrate-selective ASB3
    mutants for antiviral versus inflammatory phenotypes.
