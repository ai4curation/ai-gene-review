  evidence_type: IMP
  original_reference_id: PMID:39266719
  qualifier: involved_in
  review:
    summary: 'Negative regulation of RIG-I signaling pathway (NEW, IMP). ASB3 directly mediates K48-linked
      ubiquitination and degradation of MAVS at K297, inhibiting TBK1/IRF3 phosphorylation. Its ablation
      restores virus-induced IFN-beta transcription, and Asb3-null mice resist influenza. ASB3 performs
      the inhibitory step itself by degrading MAVS. Comparator: RNF125, an E3 that degrades RIG-I pathway
      components, carries this term.'
