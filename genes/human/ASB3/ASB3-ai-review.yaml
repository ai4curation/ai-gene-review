id: Q9Y575
gene_symbol: ASB3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASB3 is an ankyrin repeat and SOCS box protein of the ASB family that serves as the substrate-recognition
  subunit of an Elongin B/C-Cullin 5 E3 ubiquitin ligase. Its ankyrin repeats bind substrates and its
  SOCS box recruits Elongin B/C. It targets TNF receptor 2 (TNF-R2) for ubiquitination and proteasomal
  degradation, limiting TNF-R2-mediated JNK activation. It mediates K48-linked ubiquitination and degradation
  of MAVS, dampening RIG-I-like receptor antiviral signalling and type I interferon production, and of
  TRAF6, influencing NF-kB signalling and intestinal inflammation. In hepatocellular carcinoma cells it
  promotes ubiquitination and degradation of death receptor 5 (DR5).
