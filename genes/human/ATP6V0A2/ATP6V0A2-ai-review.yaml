suggested_questions:
- question: Which human cell types place a2-containing V-ATPase in lysosomal or phagocytic membranes,
    and how does this differ from the a1 and a3 isoforms?
- question: What molecular role does the a2–ARNO interaction perform beyond binding and recruitment,
    and can it support a specific molecular-function annotation?
- question: Does the human ATP6V0A2 oxygen-response annotation refer to an actual change in
    oxygen concentration or to HIF stabilization under steady aerobic culture?
suggested_experiments:
- description: Combine endogenous a2 tagging with organelle-specific calibrated pH reporters
    in human cells, comparing ATP6V0A2 loss and rescue with a1/a3 controls.
  hypothesis: The a2-containing pump contributes most strongly to Golgi and early-endosome acidification,
    with cell-dependent contributions elsewhere.
- description: Separate proton pumping from ARNO recruitment using a2 cytoplasmic-interface
    mutants that retain V-ATPase assembly and membrane targeting.
  hypothesis: Specific a2 interfaces couple endosomal acidification to recruitment of trafficking
    machinery.
