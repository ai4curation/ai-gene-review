  label: Homo sapiens
description: ATP6V0A2 encodes the a2 isoform of the membrane-embedded a subunit of vacuolar
  H+-ATPase. Within the V0 sector, it contributes to proton translocation driven by ATP hydrolysis
  in the V1 sector. The a2-containing pump acts especially at Golgi and early-endosome membranes,
  where lumen acidification supports glycosylation and membrane trafficking. Its cytoplasmic
  N-terminal domain binds phosphatidylinositol 4-phosphate, providing a lipid-recognition mechanism
  implicated in Golgi targeting. This region also associates with ARNO/PSCD2 and participates
  in pH-dependent recruitment of endosomal trafficking machinery. Disruption of ATP6V0A2 causes
  a glycosylation disorder with cutis laxa and neurological involvement.
