id: Q14376
gene_symbol: GALE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GALE is a cytosolic UDP-sugar 4-epimerase that forms a homodimer and uses a bound nicotinamide
  adenine dinucleotide cofactor. It reversibly interconverts UDP-glucose with UDP-galactose, recycling
  UDP-glucose in the Leloir pathway and supporting nucleotide-sugar supply for glycoconjugate synthesis.
  It also interconverts UDP-GlcNAc with UDP-GalNAc. Epimerase deficiency causes type III galactosemia.
  Alternative splicing produces a shorter protein with a different N-terminal region.
