- description: Catalyses reversible UDP-GlcNAc/UDP-GalNAc epimerization in the cytosol, contributing to
    the balance of N-acetylated nucleotide-sugar precursors. This is a second established catalytic specificity
    of human GALE and is not unique to humans.
