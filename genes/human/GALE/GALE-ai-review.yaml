- id: PMID:11279032
  title: Human UDP-galactose 4-epimerase. Accommodation of UDP-N-acetylglucosamine within the active site.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Authentic abstract and selected Methods/Results/Discussion of the author-hosted original
      reprint read: https://holdenlab.biochem.wisc.edu/wp-content/uploads/sites/1467/2020/09/99Thoden_et_al_2001.pdf.
      Human UDP-GlcNAc-bound structure and turnover context support the second activity; human UDP-GalNAc
      co-crystallization failed. The Cys307-versus-E. coli Tyr299 explanation is a structural hypothesis,
      not a completed mutagenesis result. Deposited 1HZJ differs from current canonical sequence only
      at position 180 A-to-V despite its zero mutation-count metadata. The paper calls the cofactor NADH
      while the deposited ligand dictionary is NAD; retain that distinction without inferring redox from
      metadata. No phenotype is assigned to the sequence discrepancy. The genuine native cache is abstract-only;
      the selected full-text reading remains the external author-hosted reprint. Its 13-word catalytic
      excerpt is verified in the native abstract, with the native line break retained.'
- id: PMID:22654673
  title: UDP-galactose 4'-epimerase activities toward UDP-Gal and UDP-GalNAc play different roles in the
    development of Drosophila melanogaster.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Authentic PMC3359975 original XML selected Results/Methods read: https://pmc.ncbi.nlm.nih.gov/articles/PMC3359975/.
      Human GALE transgene controls in Drosophila knockdown lysates were directly assayed for both UDP-Gal
      and UDP-GalNAc epimerase activities and rescue outcomes. Endogenous fly GALE also has both activities.
      This is direct human-protein evidence in a fly host, not purified human protein or a human-only
      specificity. No target natural short-product assay is established. The genuine native cache now
      contains PMC XML full text. The scientific reading scope remains the selected original Results/Methods
      above, not a claim to have inspected every figure or supplement.'
