core_functions:
- description: Catalyses reversible UDP-glucose/UDP-galactose epimerization in a cytosolic homodimer,
    using a bound NAD cofactor and recycling UDP-glucose in the Leloir pathway. The reversible reaction
    also contributes to nucleotide-sugar supply.
