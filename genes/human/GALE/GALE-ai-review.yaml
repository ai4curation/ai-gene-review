  review:
    summary: Human GALE binds its nicotinamide adenine dinucleotide cofactor as part of epimerase catalysis.
    action: NEW
    reason: Retain the inherited proposal separately from the 18 current GOA rows. The authentic PMID:10801319
      abstract and official 1EK5/1EK6 structures establish bound NAD/NAI in exact current canonical human
      GALE; current UniProt binding features agree. GO:0051287 includes oxidized and reduced nicotinamide
      adenine dinucleotide. This is a supported cofactor-binding context within the catalytic mechanism,
      not a separate physiological core or a claim of net NAD consumption. Full subscription-paper experimental
      details were not recovered, but the accessible direct ligand and sequence records establish this
      bounded claim.
    supported_by:
