core_functions:
- description: Binds phospholipids, with phosphatidic acid and cardiolipin preferences inferred
    for human CFAP418 from full-length mouse ortholog overlay assays. Cytoplasmic and photoreceptor
    inner-segment localization provides the cellular context; the physiological membrane mechanism
    remains unresolved.
  molecular_function:
    id: GO:0005543
    label: phospholipid binding
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0001917
    label: photoreceptor inner segment
  supported_by:
  - reference_id: PMID:37971880
    supporting_text: CFAP418 binds prominently to PA and CL
  - reference_id: PMID:29440555
  - reference_id: PMID:22177090
suggested_questions:
- question: How does CFAP418 binding to phosphatidic acid and cardiolipin alter membrane composition
    or protein association, and which of these mechanisms is conserved in the human protein?
- question: What determines ciliary-base enrichment versus broad cytoplasmic distribution, and
    can endogenous tagging resolve the antibody- and species-dependent localization results?
- question: Does CFAP418–FAM161A association contribute to the lipid-binding function or to
    a separate activity, and can this be distinguished from downstream transport phenotypes?
suggested_experiments:
- description: Compare purified human and mouse CFAP418 using quantitative membrane-vesicle
    binding assays with phosphatidic acid or cardiolipin, matched controls, and disease variants.
- description: Use endogenous tags and matched knockout controls in human retinal organoids
    to resolve subcellular localization and test whether lipid-binding-defective variants rescue
    lipid and outer-segment phenotypes.
status: DRAFT
