    action: KEEP_AS_NON_CORE
    reason: The original human hTERT-RPE1 study reports ciliary-base staining after serum starvation
      using a commercial antibody tested on bovine retinal extracts; mouse retinal staining
      is separate. PMID:29440555 later found nonspecific staining with the same commercial antibody
