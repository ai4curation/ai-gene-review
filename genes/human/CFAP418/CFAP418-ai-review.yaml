id: Q96NL8
gene_symbol: CFAP418
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CFAP418, formerly C8orf37, is a ciliary-base and photoreceptor-inner-segment
  protein required for normal photoreceptor integrity. Recessive loss-of-function
  variants in CFAP418/C8orf37 cause retinal dystrophy and Bardet-Biedl syndrome,
  and immunostaining places the protein at primary-cilium bases in human retinal
  pigment epithelial cells and at the base of mouse and primate photoreceptor
  connecting cilia. Human CFAP418 binds the ciliary protein FAM161A through its
  N-terminal region, but the direct molecular activity that explains how CFAP418
  supports ciliary or photoreceptor morphogenesis remains unresolved.
existing_annotations:
- term:
    id: GO:0001917
    label: photoreceptor inner segment
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  review:
    summary: >-
      The UniProt SubCell-derived IEA row is consistent with direct immunostaining.
      Estrada-Cuzcano et al. localized C8orf37 to the base of connecting cilia in
      mouse photoreceptors, and Liu et al. reported C8orf37 enrichment in the
      marmoset photoreceptor inner segment including the ciliary base and axoneme.
    action: ACCEPT
    reason: >-
      Keep the row: the automated location is not the primary evidence, but the
      photoreceptor inner-segment localization is experimentally supported and is
      a relevant context for CFAP418 function.
    supported_by:
    - reference_id: PMID:22177090
      supporting_text: >-
        C8orf37 localization at the base of the primary cilium of human retinal
        pigment epithelium cells and at the base of connecting cilia of mouse
        photoreceptors
    - reference_id: PMID:36233334
      supporting_text: >-
        C8orf37 immunoreactivity was enriched at the inner segment, including
        the ciliary base
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: >-
      CFAP418 is detected at cytoplasmic ciliary-base structures, but the broad
      cytoplasm term loses the key subcellular context that is already captured by
      the direct ciliary-base row.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Replace the broad computational cytoplasm row with GO:0097546 ciliary base:
      the measured localization is at the base of primary and photoreceptor
      connecting cilia, not diffuse cytoplasm.
    proposed_replacement_terms:
    - id: GO:0097546
      label: ciliary base
    supported_by:
    - reference_id: PMID:22177090
      supporting_text: >-
        C8orf37 localization at the base of the primary cilium of human retinal
        pigment epithelium cells and at the base of connecting cilia of mouse
        photoreceptors
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:27173435
  review:
    summary: >-
      PMID:27173435 is a high-throughput ciliary-protein interaction survey. Its
      CFAP418 protein-binding row records an interaction but does not by itself
      identify the molecular function of CFAP418.
    action: REMOVE
    reason: >-
      Remove the bare GO:0005515 row because it is not functionally informative.
      The removal is not a claim that the interaction is false; there is simply no
      specific evidence-backed molecular-function term to replace this
      high-throughput protein-binding assertion.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:36233334
  review:
    summary: >-
      Liu et al. provide direct support for a CFAP418-FAM161A interaction by
      yeast two-hybrid mapping and proximity-ligation assays in marmoset retina
      and transfected HEK293 cells.
    action: REMOVE
    reason: >-
      The FAM161A interaction is real and relevant, but GO:0005515 is still too
      generic. GO:0097110 scaffold protein binding would be the wrong
      replacement because the experiment measured binding to FAM161A, not binding
      to a scaffold protein or an independently demonstrated CFAP418 scaffold
      activity. Record the interaction as supporting evidence and leave the direct
      molecular mechanism open.
    supported_by:
    - reference_id: PMID:36233334
      supporting_text: >-
        FAM161A, a microtubule-binding protein localized at the photoreceptor
        cilium required for photoreceptor survival, was identified as one of the
        preys.
    - reference_id: PMID:36233334
      supporting_text: >-
        the N-terminal region of C8orf37 and amino acid residues 341-517 within
        the PFAM UPF0564 domain of FAM161A were critical for C8orf37-FAM161A
        interaction.
- term:
    id: GO:0001917
    label: photoreceptor inner segment
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: >-
      The sequence-similarity transfer agrees with direct localization studies in
      mouse and primate retina.
    action: ACCEPT
    reason: >-
      Keep the ISS row because the transferred location is supported by
      independent immunostaining of C8orf37/CFAP418 in photoreceptor inner
      segments and ciliary bases.
    supported_by:
    - reference_id: PMID:36233334
      supporting_text: >-
        C8orf37 protein has been previously reported to be highly enriched at the
        ciliary base at the junction between the outer and inner segments of
        photoreceptors
- term:
    id: GO:0008594
    label: photoreceptor cell morphogenesis
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  review:
    summary: >-
      CFAP418 disease alleles cause retinal dystrophy, and the orthologous mouse
      evidence that underlies this ISS row makes photoreceptor morphogenesis a
      plausible conserved role.
    action: ACCEPT
    reason: >-
      Keep the curated ISS row. Human genetics and mouse/retina localization
      support a conserved photoreceptor role, even though the specific direct
      molecular activity of CFAP418 is still unknown.
    supported_by:
    - reference_id: PMID:22177090
      supporting_text: >-
        These results underline the importance of disrupted ciliary processes in
        the pathogenesis of retinal dystrophies.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:22177090
  review:
    summary: >-
      The directly assayed localization was to the base of the primary cilium and
      connecting cilium. Cytoplasm is a broad parent context for that signal but
      not the informative cellular component.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Replace the broad cytoplasm row with GO:0097546 ciliary base, which matches
      the localization reported in the cited paper.
    proposed_replacement_terms:
    - id: GO:0097546
      label: ciliary base
    supported_by:
    - reference_id: PMID:22177090
      supporting_text: >-
        C8orf37 localization at the base of the primary cilium of human retinal
        pigment epithelium cells and at the base of connecting cilia of mouse
        photoreceptors
- term:
    id: GO:0097546
    label: ciliary base
  evidence_type: IDA
  original_reference_id: PMID:22177090
  review:
    summary: >-
      Estrada-Cuzcano et al. directly localized C8orf37 to the base of primary
      cilia in human RPE cells and the base of connecting cilia in mouse
      photoreceptors.
    action: ACCEPT
    reason: >-
      This is the best-supported and most specific cellular-component annotation
      for CFAP418.
    supported_by:
    - reference_id: PMID:22177090
      supporting_text: >-
        C8orf37 localization at the base of the primary cilium of human retinal
        pigment epithelium cells and at the base of connecting cilia of mouse
        photoreceptors
references:
- id: GO_REF:0000024
  title: >-
    Manual transfer of experimentally-verified manual GO annotation data to
    orthologs by curator judgment of sequence similarity.
  findings: []
- id: GO_REF:0000044
  title: >-
    Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied
    by UniProt.
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods.
  findings: []
- id: PMID:22177090
  title: >-
    Mutations in C8orf37, encoding a ciliary protein, are associated with
    autosomal-recessive retinal dystrophies with early macular involvement.
  findings:
  - statement: >-
      C8orf37/CFAP418 localizes to primary-cilium bases in human RPE cells and
      to connecting-cilium bases in mouse photoreceptors.
    supporting_text: >-
      Immunohistochemical studies revealed C8orf37 localization at the base of
      the primary cilium of human retinal pigment epithelium cells and at the
      base of connecting cilia of mouse photoreceptors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Directly supports the GO:0097546 ciliary-base row and the CFAP418 retinal
      disease context.
- id: PMID:27173435
  title: >-
    An organelle-specific protein landscape identifies novel diseases and
    molecular mechanisms.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Source of one high-throughput protein-binding row. Useful as interaction
      provenance, but the GO:0005515 row does not define a CFAP418 molecular
      function.
- id: PMID:36233334
  title: Interactions between C8orf37 and FAM161A, Two Ciliary Proteins Essential for
    Photoreceptor Survival.
  findings:
  - statement: >-
      Full-length human C8orf37/CFAP418 was used as yeast two-hybrid bait and
      recovered a FAM161A fragment within the FAM161A UPF0564 region.
    supporting_text: >-
      A yeast two-hybrid screen of human retinal library, using full length human
      C8orf37 as a bait, identified 28 potential interactions
  - statement: >-
      C8orf37/CFAP418 and FAM161A co-localize at the ciliary base in marmoset
      photoreceptors by immunofluorescence and proximity-ligation assay.
    supporting_text: >-
      Together, these data indicate that C8orf37 and FAM161A immunoreactivity
      was co-localized in the marmoset retina, including photoreceptors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Directly supports the FAM161A interaction and independent
      photoreceptor-inner-segment/ciliary-base localization.
- id: PMID:27008867
  title: Mutations in C8ORF37 cause Bardet Biedl syndrome (BBS21).
  findings:
  - statement: >-
      Zebrafish c8orf37 knockdown produces Bardet-Biedl-related phenotypes and
      delayed retrograde transport, but this does not establish direct
      CFAP418 participation in intraciliary transport.
    supporting_text: >-
      Knockdown of c8orf37 resulted in impaired visual behavior and BBS-related
      phenotypes, specifically, defects in the formation of Kupffer's vesicle and
      delays in retrograde transport.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Supports a conserved ciliary phenotype and a suggested follow-up question;
      used here as perturbation evidence, not as sufficient support for a new
      intraciliary transport process annotation.
- id: file:human/CFAP418/CFAP418-bioinformatics/RESULTS.md
  title: CFAP418 Bioinformatics Analysis Results
  findings: []
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      Exploratory 2024 report with the wrong hardcoded UniProt accession
      Q6ZT21, simplified heptad and regular-expression motif scans, and internal
      caveats that WD40/TPR-like and coiled-coil calls need validation with
