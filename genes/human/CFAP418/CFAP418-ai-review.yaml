core_functions:
- description: >-
    CFAP418 localizes to the ciliary base and photoreceptor inner segment, binds
    FAM161A, and is required for normal photoreceptor morphogenesis. Its direct
    molecular function at the ciliary base is not yet known.
  directly_involved_in:
  - id: GO:0008594
    label: photoreceptor cell morphogenesis
  locations:
  - id: GO:0097546
    label: ciliary base
  - id: GO:0001917
    label: photoreceptor inner segment
  supported_by:
  - reference_id: PMID:22177090
    supporting_text: >-
      C8orf37 localization at the base of the primary cilium of human retinal
      pigment epithelium cells and at the base of connecting cilia of mouse
      photoreceptors
  - reference_id: PMID:36233334
    supporting_text: >-
      the N-terminal region of C8orf37 and amino acid residues 341-517 within
      the PFAM UPF0564 domain of FAM161A were critical for C8orf37-FAM161A
      interaction.
suggested_questions:
- question: >-
    What direct molecular activity does CFAP418 carry out at the ciliary base,
    and is the FAM161A interaction required for that activity in photoreceptors?
- question: >-
    Does CFAP418 directly participate in intraflagellar transport, or are the
    retrograde-transport phenotypes of c8orf37-deficient zebrafish secondary to a
    ciliary-base defect?
suggested_experiments:
- description: >-
    Rescue CFAP418-null photoreceptor or retinal-organoid models with
    FAM161A-binding-defective CFAP418 alleles to test whether the mapped
    interaction is required for ciliary localization and photoreceptor outer
    segment maintenance.
- description: >-
    Use proximity labeling or affinity purification from photoreceptors carrying
    endogenous epitope tags to identify native CFAP418 interactors without
    overexpression of either binding partner.
status: COMPLETE
