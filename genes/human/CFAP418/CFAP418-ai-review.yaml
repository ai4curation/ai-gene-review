id: Q96NL8
gene_symbol: CFAP418
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CFAP418 (C8orf37) is a small, conserved protein associated with inherited retinal
  degeneration and Bardet–Biedl syndrome. It is distributed in the photoreceptor cell body,
  including the inner segment, and has also been detected at ciliary bases. Mouse CFAP418 binds
  phosphatidic acid and cardiolipin in vitro; loss of the protein disrupts retinal lipid composition,
  membrane-protein abundance and outer-segment disc organization. Human CFAP418 interacts with
  FAM161A, while its precise membrane-associated mechanism and the relationship between lipid
  binding and photoreceptor maintenance remain unresolved.
