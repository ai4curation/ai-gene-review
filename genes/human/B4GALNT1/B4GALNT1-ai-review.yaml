core_functions:
- description: At the Golgi membrane, B4GALNT1 transfers N-acetylgalactosamine from UDP-GalNAc onto glycolipid
    acceptors in beta-1,4 linkage. Its GM3-to-GM2 and GD3-to-GD2 reactions generate precursors of complex
    gangliosides; substrate availability also supports the neutral LacCer-to-GA2 branch.
