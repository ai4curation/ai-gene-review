    review_notes: PubMed-verified abstract identifies recessive B4GALNT1 variants in complex hereditary
      spastic paraplegia. Variant-specific structural interpretations are supplied by PMID:40593514, not
      inferred from this abstract. Disease context supports the biological summary rather than a new downstream
      GO process.
- id: PMID:40593514
  title: Conformational dynamics and membrane insertion mechanism of B4GALNT1 in ganglioside synthesis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official primary article identity and selected Results, Discussion, figure legends and
      complete relevant expression, crystallography, activity-assay and MD Methods verified. Human ΔN27/ΔN46
      proteins were expressed in HEK293-F cells. Liposome-based UDP-Glo endpoint assays and crystallography
      reinforce glycolipid GalNAc transfer by a homodimer. Membrane insertion is a simulation-supported
      model; extracellular remodeling remains proposed. R300C misfolding and D433A dimer destabilization
      are structural predictions, distinct from the tested R288H/R505H/D358A panel. Figures, supplementary
      source data and coordinates were not independently analyzed.
