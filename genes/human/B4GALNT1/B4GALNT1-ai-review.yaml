- id: PMID:11018043
  title: Disulfide bonds of GM2 synthase homodimers. Antiparallel orientation of the catalytic domains.
  findings:
  - statement: The study assigns C80/C82-to-C412/C529 disulfides between subunits and attributes homodimer
      formation to those bonds.
    supporting_text: the intersubunit disulfides formed by both
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:40593514
      review_notes: The 2025 human lumenal-domain structure places these bonds within chains. Its authors
        acknowledge the unresolved disagreement between electron density and nonreducing gel behavior.
        This contests the interchain assignment, not homodimerization or the entire paper.
      supported_by:
      - reference_id: PMID:40593514
        supporting_text: In the experimental structure, all are intramolecular disulphide bonds
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Identifier and cached abstract verified. The study supports homodimerization but its
      specific interchain disulfide assignment is disputed by the 2025 crystal structure. The latter also
      reports nonreducing gel behavior it cannot reconcile with the electron density. Keep the homodimeric
      enzyme model and qualify the bond topology; the older construct species and full Methods were not
      established from the abstract.
