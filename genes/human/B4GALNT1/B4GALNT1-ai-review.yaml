  label: Homo sapiens
description: B4GALNT1 is a Golgi type II membrane glycosyltransferase, also called GM2/GD2 synthase. It
  transfers N-acetylgalactosamine from UDP-GalNAc in beta-1,4 linkage to glycolipid acceptors, generating
  GM2 from GM3 and GD2 from GD3. It also supports GT2 synthesis from GT3 and the neutral GA2 branch from
  lactosylceramide. Its lumen-facing catalytic domain acts as a homodimer. These reactions supply precursors
  for complex glycosphingolipids abundant in the nervous system. Biallelic loss-of-function variants cause
  hereditary spastic paraplegia type 26, linking impaired ganglioside synthesis to neurological dysfunction.
