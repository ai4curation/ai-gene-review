suggested_questions:
- question: The 2025 structure predicts misfolding for R300C and dimer destabilization for D433A. How
    do these defects affect full-length cellular stability, Golgi retention and ganglioside versus neutral
    GA2 synthesis?
- question: How do acceptor availability and competing sialyltransferases determine GM3-to-GM2, GD3-to-GD2
    and LacCer-to-GA2 flux in neurons, and their downstream complex glycosphingolipid products?
suggested_experiments:
- description: Test the predicted R300C folding defect and D433A dimer defect with full-length proteins
    in B4GALNT1-null cells. Compare abundance, folding, oligomerization and Golgi retention alongside
    lipidomic GM2, GD2 and neutral GA2 output, with wild-type rescue and a catalytic-site control.
- description: Measure acceptor competition across GM3, GD3, GT3 and LacCer using membrane-associated
    B4GALNT1 and defined liposomes. Vary lipid composition and quantify products over time; account for
    membrane tethering before inferring kinetic preferences from endpoint activities.
