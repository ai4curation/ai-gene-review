suggested_questions:
- question: Which ABCA1 extracellular-domain contacts with apoA-I are required for JAK2/STAT3 activation as opposed
    to lipid efflux, and does lipidated (HDL-bound) apoA-I retain signaling capacity?
- question: Should the eight UniProt annotations citing PMID:23726972 (apolipoprotein(a) chemorepulsion) be moved
    from APOA1 to LPA?
suggested_experiments:
- hypothesis: Lipid-free apoA-I activates STAT3 in human primary macrophages through direct ABCA1 binding independently
    of cholesterol efflux.
  description: Compare wild-type apoA-I with apoA-I mutants defective in ABCA1 binding or lipidation in ABCA1-knockout
    versus efflux-dead/STAT3-competent ABCA1 knock-in human iPSC-derived macrophages, measuring JAK2/STAT3 phosphorylation
    and LPS-induced cytokines.
  experiment_type: Genetic complementation and phospho-signaling assays
