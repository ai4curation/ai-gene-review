- term:
    id: GO:0038027
    label: apolipoprotein A-I-mediated signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:19783654
  qualifier: involved_in
  review:
    summary: ApoA-I is the ligand that initiates ABCA1-dependent JAK2/STAT3 (and Cdc42) signaling in macrophages
      and fibroblasts.
    action: NEW
    reason: ApoA-I binding to ABCA1 stimulates JAK2 autophosphorylation (PMID:14668333) and STAT3 activation through
      STAT3 docking sites on ABCA1, independent of lipid transport (PMID:19783654, PMID:26989082); in human THP-1
      macrophages blocking the apoA-I/ABCA1 interaction abolishes the signaling output (PMID:21339300), and apoA-I
      activates Cdc42 only in ABCA1-expressing cells (PMID:16443932). ApoA-I does the ligand work of the first step
      (binding and activating the receptor), the role GO assigns to receptor ligands, so it participates in the
      pathway rather than merely being required for it. Non-core facet of apoA-I biology.
    supported_by:
    - *id027
    - reference_id: PMID:19783654
      supporting_text: Thus, the apoA-I/ABCA1 pathway in macrophages functions as an anti-inflammatory receptor
        through activation of JAK2/STAT3.
    - reference_id: PMID:26989082
      supporting_text: We showed that activation of STAT3 by the interaction of apoA-I/ABCA1 without cholesterol
        efflux could significantly decrease proinflammatory cytokine expression in macrophages.
    - reference_id: PMID:14668333
      supporting_text: Acute incubation of ABCA1-expressing cells with apoA-I had no effect on ABCA1 phosphorylation
        but stimulated JAK2 autophosphorylation.
    - &id028
      reference_id: PMID:21339300
      supporting_text: When blocking interaction of apoA-I with ATP-binding membrane cassette transporter A1 (ABCA1),
        a major receptor for apoA-I in macrophages, it would almost totally abolish the effect of apoA-I on tristetraprolin
        expression.
    - *id011
    additional_reference_ids:
    - PMID:14668333
    - PMID:26989082
    - PMID:21339300
    - PMID:16443932
