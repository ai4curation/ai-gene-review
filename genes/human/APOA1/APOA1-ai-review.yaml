    supported_by:
    - &id006
      reference_id: PMID:23726972
      supporting_text: The aims of this study were to determine functional effects of recombinant apo(a) on human
        vascular SMC motility
    source_defects:
    - &id007
      defect_type: WRONG_GENE_PRODUCT
      resource: UNIPROT
      slot: DB_Object_ID
      requested_change: REPOINT
      asserted_value: UniProtKB:P02647
      corrected_value: UniProtKB:P08519
      corrected_label: LPA, apolipoprotein(a)
      confidence: CONFIRMED
      explanation: PMID:23726972 (Riches et al. 2013) studies recombinant apolipoprotein(a), the LPA gene product
        (UniProtKB:P08519), as a chemorepellent for human vascular smooth muscle cells. The cached full text (PMC3731554)
        was read and never mentions apolipoprotein A-I. All eight UniProt rows citing this paper on APOA1 (P02647),
        made on 2014-07-30, describe apo(a) biology and should be moved to LPA (P08519), which does not currently
        carry them (QuickGO, 2026-11-23).
