- term:
    id: GO:0006656
    label: phosphatidylcholine biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:4335615
  qualifier: involved_in
  review:
    summary: Annotated from the identification of apoA-I as the LCAT cofactor.
    action: REMOVE
    reason: LCAT transfers an acyl chain from phosphatidylcholine to cholesterol, consuming PC to make lysophosphatidylcholine
      and cholesteryl ester. A cofactor of LCAT is therefore not involved in PC biosynthesis; the activator role
      is captured by GO:0060228.
    supported_by:
    - &id010
      reference_id: PMID:4335615
      supporting_text: A protein cofactor of lecithin:cholesterol acyltransferase.
    source_defects:
    - defect_type: WRONG_TERM
      resource: ARUK_UCL
      requested_change: DELETE_ROW
      asserted_value: GO:0006656
      confidence: PROBABLE
      explanation: BHF-UCL annotates APOA1 (P02647) to phosphatidylcholine biosynthetic process by IDA from PMID:4335615,
        which identifies apoA-I as the protein cofactor of LCAT. The LCAT reaction consumes phosphatidylcholine
        (acyl transfer to cholesterol), so this process term inverts the biochemistry; the activator role is already
        annotated (GO:0060228). Based on the abstract-only record and the defined LCAT reaction.
