  review:
    summary: 'NOT TGF-beta receptor signaling: apo(a) chemorepulsion was TGF-beta-independent; not about apoA-I.'
    action: REMOVE
    reason: Wrong gene product. PMID:23726972 is about apolipoprotein(a) (LPA), not apolipoprotein A-I; the full
