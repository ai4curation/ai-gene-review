id: P02647
gene_symbol: APOA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Apolipoprotein A-I (APOA1) is the major protein of plasma high-density lipoprotein (HDL). It is synthesized
  as a preproprotein in liver and small intestine and secreted as a 243-residue protein built from amphipathic alpha-helical
  repeats. Lipid-poor apoA-I accepts phospholipid and cholesterol from cells through the ABCA1 transporter, forming
  discoidal nascent HDL, and two or more apoA-I molecules wrap each particle as an antiparallel belt. On HDL it
  is the main activator of lecithin:cholesterol acyltransferase (LCAT), which esterifies cholesterol and matures
  discoidal into spherical HDL, and it is the HDL ligand for scavenger receptor SR-BI, which mediates hepatic selective
  uptake of cholesteryl ester. Through these activities apoA-I drives reverse cholesterol transport from peripheral
  tissues to the liver. ApoA-I binding to ABCA1 also initiates intracellular signaling (JAK2/STAT3, Cdc42) with
  anti-inflammatory effects in macrophages, and apoA-I stabilizes ABCA1 and ABCA7 at the cell surface. Loss-of-function
  variants cause HDL deficiency (hypoalphalipoproteinemia) with premature atherosclerosis, and certain missense
  variants cause hereditary apoA-I amyloidosis.
