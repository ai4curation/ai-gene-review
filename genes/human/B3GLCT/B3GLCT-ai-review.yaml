description: 'B3GLCT is an endoplasmic-reticulum glycosyltransferase that extends O-linked fucose on folded
  thrombospondin type 1 repeat (TSR) domains. It transfers glucose from UDP-glucose in a beta-1,3 linkage
  to the fucose installed by POFUT2, forming the Glc-beta-1,3-Fuc disaccharide. Its adjoining GT-A domains
  form the acceptor-binding cleft: the C-terminal domain catalyzes transfer, while the inactive N-terminal
  domain contributes substrate recognition. Glucose addition stabilizes modified TSRs and can support
  secretion of selected TSR-containing proteins; the requirement varies among substrates. B3GLCT has a
  C-terminal ER retention signal. Biallelic pathogenic variants cause Peters plus syndrome, a congenital
  disorder with ocular, growth, and developmental abnormalities.'
