- id: PMID:18798333
  title: Mutation analysis of B3GALTL in Peters Plus syndrome.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official identity, complete abstract, molecular screening Methods and selected Results
      checked in the normal full-text cache. This small clinical series supports typical Peters plus syndrome
      association; it supplies no additional enzymatic activity. Truncation and nonsense-mediated-decay
      consequences are predictions. Individual clinical histories and supplements were not fully reviewed.
  findings:
  - statement: All four patients with typical Peters plus syndrome in this eight-patient clinical series
      had B3GALTL variants; the four overlapping cases had no causative variants detected.
    supporting_text: four of four patients with typical Peters Plus syndrome had mutations in B3GALTL
    reference_section_type: RESULTS
    full_text_unavailable: false
- id: PMID:25544610
  title: Peters plus syndrome mutations disrupt a noncanonical ER quality-control mechanism.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official identity, abstract, selected secretion and unfolding Results, plasmid/siRNA
      and folding Methods checked. Glucose-dependent TSR stabilization remains supported. The ADAMTSL2
      secretion inference is disputed at finding level by PMID:32913123. POFUT2 refolding assays are not
      B3GLCT assays. The inspected ADAMTSL2 plasmid paragraph does not establish construct species.
  findings:
  - statement: In the purified TSP1-TSR3 unfolding assay, glucose extension further increased the stability
      conferred by O-fucose.
    supporting_text: The addition of the glucose further increases the resistance to chemical denaturation.
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: The siRNA experiment was interpreted as evidence that B3GLCT is required for ADAMTSL2 secretion.
    supporting_text: significant reduction in secretion of ADAMTSL1, ADAMTSL2, and TSP1(TSR1-3)
    reference_section_type: RESULTS
    full_text_unavailable: false
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:32913123
      review_notes: The later CRISPR knockout experiment found mouse ADAMTSL2 secretion unchanged in HEK293T
        cells. This limits the earlier ADAMTSL2 inference, without invalidating other substrates or the
        glycan-stabilization result. The 2015 construct species is unresolved in the inspected Methods,
        and an siRNA off-target mechanism is not established by this comparison.
      supported_by:
      - reference_id: PMID:32913123
        supporting_text: knocking out B3GLCT did not affect ADAMTSL2 secretion
- id: PMID:27687499
  title: 'Impaired ADAMTS9 secretion: A potential mechanism for eye defects in Peters Plus Syndrome.'
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official identity, abstract and selected ADAMTS9 modification/secretion Results and
      construct/siRNA Methods checked. Human recombinant ADAMTS9 fragment assays are distinct from mouse
      eye phenotypes. The abstract names HEK293F, but the knockdown Methods specify HEK293T; the review
      keeps that discrepancy explicit without changing the cache. Full-length secretion and a universal
      mechanism are not established.
  findings:
  - statement: B3GLCT knockdown reduced secretion of the tested human ADAMTS9-N-L2 fragment; separate
      mass spectrometry detected the Glc-Fuc glycan on recombinant ADAMTS9 TSRs.
    supporting_text: statistically significant reduction of ADAMTS9 secretion
    reference_section_type: RESULTS
    full_text_unavailable: false
- id: PMID:32913123
  title: O-Fucosylation of ADAMTSL2 is required for secretion and is impacted by geleophysic dysplasia-causing
    mutations.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PMID/DOI/PMCID and exact imported title checked. Selected Results, Discussion
      and construct/secretion Methods establish mouse ADAMTSL2 expression in HEK293T cells. B3GLCT knockout
      did not reduce secretion in that assay. The proposed explanation involving nonspecific siRNA effects
      is the authors' interpretation, not independently demonstrated here.
  findings:
  - statement: Mouse ADAMTSL2 secretion in HEK293T cells required POFUT2-mediated O-fucosylation, but
      persisted after B3GLCT knockout.
    supporting_text: B3GLCT was dispensable for proper secretion
    reference_section_type: RESULTS
    full_text_unavailable: false
- id: PMID:34058199
  title: Peters plus syndrome mutations affect the function and stability of human β1,3-glucosyltransferase.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official identity, abstract, selected enzyme/rescue/stability Results and assay/modeling
      Methods checked. Human mutagenesis supports C-terminal catalysis; structures were homology models.
      The earlier metal-independence suggestion is disputed at finding level by PMID:42575440, while the
      mutation results remain useful. Effects apply to the tested variant panel.
  findings:
  - statement: The human C-terminal D349N substitution abolished glucose-transfer activity, whereas the
      tested N-terminal E132A substitution retained activity.
    supporting_text: D349N mutant completely lost catalytic activity
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: The 2021 EDTA experiment prompted a suggestion that B3GLCT catalysis might not require
      a metal ion.
    supporting_text: B3GLCT may not require a metal ion
    reference_section_type: RESULTS
    full_text_unavailable: false
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:42575440
      review_notes: The 2026 UDP-Mn complex and stronger chelation experiment support metal-dependent
        catalysis. The earlier paper itself allowed tightly bound metal as an alternative; the observed
        activity under its EDTA conditions is not discarded.
      supported_by:
      - reference_id: PMID:42575440
        supporting_text: B3GLCT activity is metal dependent
- id: PMID:42575440
  title: Crystal structure of a β1,3-Glucosyltransferase reveals an unusual substrate recognition by a
    two-domain GT-A fold glycosyltransferase.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official identity and imported PMC13597200 text checked. Selected crystallographic,
      binding, metal-chelation and mutagenesis Results and Methods support active C-terminal catalysis
      and inactive N-terminal substrate recognition. The experimental protein is truncated; inconsistent
      printed residue boundaries are not reconciled here. The UDP-glucose reaction model uses AlphaFold3;
      no coordinate or supplement reanalysis was performed.
  findings:
  - statement: The experimental enzyme-TSR complex shows a substrate-recognition role for the inactive
      N-terminal GT-A domain beside the active C-terminal domain.
    supporting_text: 'essential for

      substrate binding but is catalytically inactive'
    reference_section_type: ABSTRACT
    full_text_unavailable: false
core_functions:
- description: B3GLCT uses UDP-glucose to add beta-1,3-linked glucose to the O-fucose on folded TSR domains
    in the endoplasmic reticulum. This directly extends the glycan installed by POFUT2.
