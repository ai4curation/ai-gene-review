  review:
    action: ACCEPT
    summary: B3GLCT directly catalyzes extension of the O-linked fucose glycan on TSR domains.
    reason: POFUT2 first attaches fucose to the protein. B3GLCT then performs the glucose-addition step
      of that same O-fucose glycosylation pathway, as shown by the recombinant-enzyme assay. It is a catalyst
      of the process, not merely a substrate or a downstream requirement.
