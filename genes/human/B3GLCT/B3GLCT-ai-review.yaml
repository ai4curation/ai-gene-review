suggested_questions:
- question: Which TSR sequence or structural features make secretion dependent on B3GLCT-mediated glucose
    addition, and how do these requirements vary with the expressing cell type?
- question: Which client-specific glycosylation defects explain the ocular and skeletal features of Peters
    plus syndrome independently of the initial POFUT2-catalyzed fucosylation step?
- question: Does endogenous B3GLCT retain its predicted N-terminal membrane anchor, or undergo processing
    that yields a soluble ER-resident enzyme? Direct topology and N-terminus measurements could resolve
    the differing source descriptions.
suggested_experiments:
- description: Compare TSR glycosylation occupancy and secretion of defined clients in matched B3GLCT-null
    cells rescued with wild-type or catalytically impaired B3GLCT, controlling expression, folding and
    ER localization.
