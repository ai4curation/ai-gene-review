id: O60906
gene_symbol: SMPD2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SMPD2 encodes neutral sphingomyelinase 1 (nSMase1), a magnesium-dependent membrane phosphodiester hydrolase. It cleaves sphingomyelin to ceramide and phosphocholine and also hydrolyzes sphingosylphosphocholine and lysoglycerophosphocholine substrates, including lyso-platelet-activating factor. Its substrate use and contribution to cellular lipid metabolism depend on the cellular state: unstimulated overexpression experiments emphasize lyso-PAF hydrolysis, whereas stress and Fas stimulation in human Jurkat T cells reveal SMPD2-dependent ceramide generation downstream of JNK signaling. The protein is associated with intracellular membranes, including the endoplasmic reticulum and Golgi; plasma-membrane association is also supported by ortholog-based annotations. These activities connect membrane lipid turnover with context-dependent ceramide signaling.'
