core_functions:
- description: Hydrolyzes sphingomyelin to ceramide and phosphocholine. The membrane-associated activity contributes to lipid turnover and, in stressed human Jurkat T cells, to JNK-dependent ceramide generation.
  molecular_function:
    id: GO:0004767
    label: sphingomyelin phosphodiesterase activity
  directly_involved_in:
  - id: GO:0006685
    label: sphingomyelin catabolic process
  - id: GO:0046513
    label: ceramide biosynthetic process
  locations:
  - id: GO:0005783
    label: endoplasmic reticulum
  supported_by:
  - reference_id: PMID:25168245
    supporting_text: nSMase activity (Figure 7c) and ceramide levels (Figure 7d) were induced by stress and Fas stimuli
  - reference_id: file:human/SMPD2/SMPD2-uniprot.txt
    supporting_text: Catalyzes, at least in vitro, the hydrolysis of sphingomyelin
- description: Cleaves phosphocholine from lysoglycerophospholipids such as lyso-PAF and lyso-PC, producing the corresponding monoalkyl- or monoacylglycerol. Overexpression experiments support this activity in the cellular conditions tested. The separately observed hydrolysis of sphingosylphosphocholine belongs to the broader phosphodiester-hydrolase activity and is not a glycerophospholipase reaction.
  molecular_function:
    id: GO:0004629
    label: C-type glycerophospholipase activity
  supported_by:
  - reference_id: PMID:10608884
    supporting_text: activating factor (lyso-PAF)) are good substrates of the protein.
