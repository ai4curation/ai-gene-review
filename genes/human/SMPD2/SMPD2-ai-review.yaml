    reason: 'Sphingomyelin hydrolysis is itself a ceramide-producing reaction, within the GO:0046513 definition. Full PMID:25168245 Fig. 7 directly tests endogenous human SMPD2 RNAi in Jurkat T cells: stress/Fas-induced nSMase activity and ceramide accumulation are reduced after depletion, while upstream JNK/c-jun phosphorylation persists. Baseline ceramide is comparable in controls and depleted cells. Earlier unstimulated overexpression results and the importance of SMPD3 in other settings do not negate this conditional human SMPD2 function. The enzyme performs the lipid cleavage; it is not merely a substrate or a marker of the process.'
