- id: PMID:10608884
  title: Function of the cloned putative neutral sphingomyelinase as lyso-platelet activating factor-phospholipase C.
  findings:
  - statement: In the tested unstimulated overexpression experiments, bulk sphingomyelin and ceramide metabolism were not apparently changed, whereas lyso-PAF metabolism increased; lyso-PC and lyso-PAF were good in vitro substrates. This supports context-dependent substrate use, not a universal absence of cellular nSMase activity.
    reference_section_type: ABSTRACT
    supporting_text: these results suggest that the protein acts as lyso-PAF-PLC rather than
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier and abstract checked. The overexpression results support lyso-PAF metabolism in the tested setting; the abstract-only cache cannot establish its dominance in all cell states. Full PMID:25168245 directly documents endogenous human SMPD2-dependent stress-induced ceramide production.
- id: PMID:14741383
  title: Hydrolysis of sphingosylphosphocholine by neutral sphingomyelinases.
  findings:
  - statement: Human nSMase1 and nSMase2 hydrolyze sphingosylphosphocholine efficiently under detergent-free conditions; substrate specificity for sphingomyelin, sphingosylphosphocholine, and monoradyl glycerophosphocholine (but not diradyl species) indicates a required hydrogen-bond donor at the C-2/sn-2 position.
    reference_section_type: ABSTRACT
    supporting_text: efficiently under detergent-free conditions
  reference_review:
