id: P40967
gene_symbol: PMEL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PMEL (premelanosome protein, Pmel17, gp100, ME20, silver) is a pigment cell-specific single-pass
  type I membrane glycoprotein that forms the functional amyloid fibrils of melanosomes. It is synthesized
  in the ER as a disulfide-linked dimer, glycosylated in the Golgi, briefly reaches the cell surface and
  is delivered via endocytosis to multivesicular early (stage I) melanosomes, where it is sorted onto
  intraluminal vesicles with the help of CD63 and ApoE. Sequential cleavage by proprotein convertase,
  ADAM/BACE2 at the juxtamembrane site and gamma-secretase releases luminal fragments whose repeat (RPT)
  domain assembles at acidic pH into parallel amyloid sheets that elongate the organelle into a striated
  stage II premelanosome and serve as a scaffold on which eumelanin is deposited. PMEL is also a major
  melanoma-specific antigen (gp100) recognized by cytotoxic T cells.
