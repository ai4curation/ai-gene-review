core_functions:
- description: Secreted CC chemokine that binds and activates the Gi-coupled receptor CCR7 (P32248) on
    T cells, B cells and mature dendritic cells, initiating the CCL19-activated CCR7 signaling pathway;
    it is a biased agonist that, unlike CCL21, also drives robust beta-arrestin recruitment and CCR7 internalization.
  molecular_function: *id002
  directly_involved_in:
  - *id001
  - id: GO:0070098
    label: chemokine-mediated signaling pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:9153236
    supporting_text: ELC-SEAP was found to bind specifically to an orphan receptor EBI1
  - reference_id: PMID:9153236
    supporting_text: ELC-Flag-induced transient calcium mobilization and chemotactic responses in EBI1-transfected
      cells
  - reference_id: PMID:15054093
    supporting_text: Both CCL19 and CCL21 induce G protein activation and calcium mobilization with equal
      potency
  - reference_id: PMID:15054093
    supporting_text: only activation by CCL19, not CCL21, promotes robust desensitization of endogenous
      CCR7 in the human T cell lymphoma cell line H9
  - reference_id: PMID:14592837
    supporting_text: stimulation with CCR7 ligands led to enhanced phosphatidylinositol-3-kinase-mediated
      phosphorylation of protein kinase B when MoDCs were matured in the presence of PGE2
- description: 'Directional cue for lymphocyte and mature dendritic cell homing: CCL19 produced by T-zone
    stromal cells attracts CCR7+ naive T cells, B cells and antigen-bearing dendritic cells into the T-cell
    zones of secondary lymphoid organs.'
  molecular_function: *id002
  directly_involved_in:
  - id: GO:0048247
    label: lymphocyte chemotaxis
  - id: GO:0002407
    label: dendritic cell chemotaxis
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:9498785
    supporting_text: showed potent chemotactic activity for T cells and B cells but not for granulocytes
      and monocytes
  - reference_id: PMID:15778365
    supporting_text: CCR7 activates two independent signaling modules, one involving G(i) and a hierarchy
      of MAPK family members and another involving Rho/Pyk2/cofilin, which control, respectively, chemotaxis
      and the migratory speed of DCs
  - reference_id: PMID:11070085
    supporting_text: we show in wild-type mice that ELC is expressed by T zone stromal cells that also
      make SLC
suggested_questions:
- question: Should GO adopt a convention for representing biased agonism, given that CCL19 and CCL21 activate
    CCR7 G protein signaling equally but only CCL19 drives beta-arrestin recruitment, internalization
    and ERK activation?
- question: What is the relative physiological contribution of CCL19 versus CCL21 to lymphocyte and DC
    homing in vivo, given that plt/plt mice lack both and single Ccl19 knockouts have mild phenotypes?
suggested_experiments:
- description: Compare lymph node homing of T cells and DCs in Ccl19-only knockout mice with plt/plt and
    Ccl21a knockouts, combined with CCR7 phospho-site mutant knock-in mice, to separate CCL19-specific
    beta-arrestin signaling from shared G protein signaling in vivo.
