      and memory T cells and for B cells.
    action: NEW
    reason: 'Lymphocyte homing to secondary lymphoid organs is a primary physiological role of CCL19,
      and GOA has no lymphocyte-, T- or B-cell chemotaxis row on human CCL19. Chemokines are conventionally
      annotated to chemotaxis of their target cells (CXCL12 carries T cell chemotaxis by IDA; CXCL8 neutrophil
      chemotaxis). The chemokine performs the step: it is the directional cue whose receptor engagement
      directs the cells. Covers both T and B cells, so the shared parent term is used.'
