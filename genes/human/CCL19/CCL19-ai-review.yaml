id: Q99731
gene_symbol: CCL19
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CCL19 (EBI1-ligand chemokine, ELC; MIP-3-beta) is a small secreted CC chemokine of 98 residues
  (signal peptide 1-21) that is constitutively produced by fibroblastic T-zone stromal cells of lymph
  nodes and spleen, by thymic medullary epithelium and, to a lesser extent, by mature dendritic cells.
  It is a high-affinity, specific agonist of the Gi-coupled chemokine receptor CCR7, which it shares with
  CCL21. CCL19-CCR7 signaling (Gi and Gbetagamma, phospholipase C and calcium, PI3K-Akt, Rho GTPases and
  MAPKs) directs chemotaxis of naive and central-memory T cells, B cells and antigen-bearing mature dendritic
  cells into the T-cell zones of secondary lymphoid organs and of mature thymocytes, positioning DCs and
  T cells for priming. Unlike CCL21, CCL19 drives robust GRK-dependent CCR7 phosphorylation, beta-arrestin
  recruitment, receptor internalization and desensitization, and beta-arrestin-dependent ERK activation,
  making it a biased CCR7 agonist. In CCR7-positive dendritic cells it also promotes survival, dendrite
  extension, endocytosis and maturation. CCL19 additionally binds the non-signaling atypical receptors
  ACKR4 (CCX-CKR) and CCRL2, which scavenge or present it and shape its gradients.
