core_functions:
- description: 'Cas-family docking/scaffold protein in integrin and receptor tyrosine-kinase signalling:
    at focal adhesions NEDD9 binds FAK via its SH3 domain, is tyrosine-phosphorylated on its substrate
    domain by FAK/Src-family/Abl kinases, and assembles SH2-protein complexes (CRK/CRKL, SHP-2, BCAR3/NSP)
    that drive adhesion, spreading and migration.'
  supported_by:
  - *id017
  - *id018
  - *id011
  - *id009
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0007229
    label: integrin-mediated signaling pathway
  - id: GO:0016477
    label: cell migration
  locations:
  - id: GO:0005925
    label: focal adhesion
- description: 'Secondary, non-dominant function: NEDD9 binds and activates Aurora A kinase - at centrosomes
    in G2/M and at the ciliary basal body in ciliated cells, where NEDD9-dependent AURKA activation leads
    to HDAC6 phosphorylation and primary cilium disassembly.'
  supported_by:
  - *id019
  - *id020
  - *id013
  molecular_function:
    id: GO:0043539
    label: protein serine/threonine kinase activator activity
  directly_involved_in:
  - id: GO:0061523
    label: cilium disassembly
  locations:
  - id: GO:0036064
    label: ciliary basal body
suggested_questions:
- question: Does NEDD9 activate Aurora A at the basal body through the same N-terminal (1-363) interaction
    surface used at mitotic centrosomes, and is NEDD9 required for cilium disassembly in vivo (e.g. in
    Nedd9-null tissues) or only in serum-stimulated cultured cells, given partial redundancy with Pitchfork/CIMAP3
    and Ca2+/calmodulin?
- question: Should NEDD9's scaffold role be captured by 'protein-macromolecule adaptor activity' or by
    'signaling adaptor activity', given that it acts as a phosphotyrosine docking platform in integrin
    and receptor signalling?
suggested_experiments:
- description: Rescue of NEDD9-knockout RPE1 cells with NEDD9 variants lacking the AURKA-binding region
    versus the FAK-binding SH3 domain, scoring serum-induced cilium resorption and focal-adhesion signalling
    to separate the two functions.
