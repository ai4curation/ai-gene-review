id: Q14511
gene_symbol: NEDD9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NEDD9 (HEF1, CAS-L, CASS2) is a member of the Cas (Crk-associated substrate) family of multidomain
  docking proteins, with an N-terminal SH3 domain, a substrate domain carrying many YxxP tyrosine motifs,
  a serine-rich four-helix bundle and a conserved C-terminal FAT-like domain that binds NSP proteins (BCAR3,
  SH2D3C). Full-length NEDD9 localizes mainly to focal adhesions and the cell periphery, where it binds
  FAK and is tyrosine-phosphorylated by FAK, Src-family and Abl kinases after integrin, TCR/BCR or chemokine
  stimulation, recruiting SH2-containing partners to promote adhesion, spreading and migration of fibroblasts,
  lymphocytes and tumor cells. NEDD9 levels are cell-cycle regulated and controlled by SMAD3/ITCH-mediated
  ubiquitination and caspase cleavage; at mitosis a pool relocalizes to centrosomes and the spindle, where
  NEDD9 binds and activates Aurora A kinase and influences RhoA activation via ECT2. In ciliated cells,
  NEDD9-dependent activation of Aurora A at the basal body triggers HDAC6-mediated axonemal deacetylation
  and primary cilium disassembly. NEDD9 is overexpressed in several metastatic cancers.
