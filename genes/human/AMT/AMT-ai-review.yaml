id: P48728
gene_symbol: AMT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AMT is the mitochondrial aminomethyltransferase (T-protein) of the glycine cleavage
  system. After GLDC decarboxylates glycine and loads its remaining aminomethyl group onto
  lipoylated GCSH, AMT transfers the one-carbon unit to tetrahydrofolate and releases ammonia,
  producing 5,10-methylenetetrahydrofolate and reduced lipoyl-GCSH. DLD subsequently reoxidizes the
  carrier. This matrix-localized enzyme directly couples glycine degradation to folate-mediated
  one-carbon metabolism. The mature human enzyme has a three-domain fold enclosing a folate-binding
  cavity. Biallelic pathogenic AMT variants cause glycine encephalopathy (nonketotic
  hyperglycinemia), with variable clinical severity.
