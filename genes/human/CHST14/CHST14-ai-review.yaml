  qualifier: enables
  review:
    summary: The cited PAPS-motif evidence does not establish separate phosphate-ion
      binding.
    action: MARK_AS_OVER_ANNOTATED
    reason: The actual PMID:11470797 source identifies putative binding regions for
      the 5-prime and 3-prime phosphate groups of the molecular donor PAPS by sequence
      comparison and presents these assignments as hypotheses. GO:0042301 refers to
      binding a phosphate ion. Catalytic utilization of phosphate-bearing PAPS and
      predicted PAPS-contact motifs do not demonstrate that separate ligand activity.
      This is an evidence-scope judgment, not a claim that phosphate interaction is
      biochemically impossible or that the sulfotransferase activity is absent.
