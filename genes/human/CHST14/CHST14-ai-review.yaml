- id: PMID:11470797
  title: Molecular cloning and characterization of a dermatan-specific N-acetylgalactosamine 4-O-sulfotransferase.
  findings:
  - statement: Human CHST14 catalyzes GalNAc C4 sulfation of dermatan; substrate specificity and type-II
      topology were distinguished experimentally versus computationally.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The genuine Manchester repository final-published PDF was read at selected Methods/Results/Discussion
      and independently checked in the catalytic peer, including Table I and Figures 4/7/8. Normal cache
      remains abstract-only. Human AF401222 376-aa ORF in CHO/Tag extracts and medium establishes sulfate-transfer
      chemistry; topology and PAPS-site motifs are predictions, and shedding remains untested.
- id: PMID:19199708
  title: Proteomic analysis of human parotid gland exosomes by multidimensional protein identification
    technology (MudPIT).
  findings:
  - statement: CHST14 was identified by two matching peptides in a human parotid exosome-rich fraction.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The selected exact-main source is marked full but omits detailed Methods/Results. Its
      separately archived genuine normal full variant was read, and authentic ACS Figshare Tables S1/S2
      resolve the exact CHST14 entry and peptides. Single-donor fraction proteomics supports detection,
      not CHST14-specific imaging, exosome function or enzyme activity.
- id: PMID:35156780
  title: CFTR interactome mapping using the mammalian membrane two-hybrid high-throughput screening system.
  findings:
  - statement: Human CHST14 and CFTR have positive mammalian ubiquitin-reconstruction interaction records.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Actual selected full Methods for MaMTH-HTS/traditional MaMTH and Results validation
      scope were read. Three exact MINT records confirm the CFTR pair, including WT/F508del and tag features.
      Original target rows of Dataset EV2/EV5 were not independently recovered; the curated target records
      are not conflated with dataset-level co-IP or trafficking validation.
