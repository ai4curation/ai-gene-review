suggested_questions:
- question: How do the topology, proteolytic processing and Golgi retention of endogenous CHST14 control
    its activity and association with dermatan sulfate epimerase 1?
- question: What stoichiometry and interaction surfaces couple CHST14 sulfation to epimerase activity,
    and how does pre-existing chain sulfation affect substrate preference?
- question: Does the screen-supported CHST14–CFTR association occur at endogenous expression levels, and
    does it influence either protein without simply reflecting tagged-protein proximity?
suggested_experiments:
- description: Use endogenous tagging, membrane-protection assays and pulse-chase measurements to distinguish
    full-length Golgi-associated CHST14 from released catalytic fragments, with catalytic activity measured
    for each fraction.
- description: Compare purified CHST14 with and without DS-epi1 using defined glycan substrates and interface
    mutants; measure sulfate transfer, epimerization and chain-product structures separately to distinguish
    catalytic coupling from physical association.
