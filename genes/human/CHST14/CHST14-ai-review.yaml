    that generate long epimerized 4-O-sulfated blocks.
  findings:
  - statement: CHST14 and DS-epi1 cooperate to form long sulfated iduronic-acid blocks
      and associate in Golgi-localized cellular assays.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal full primary source read through selected Results/Discussion
      and actual cloning, purification, enzyme, microscopy, FRET and co-IP Methods.
      Human D4ST1 61–376-His8 is used for biochemical reconstitution; full-length
      1–376 fluorescent/HA constructs are used in COS-7. Endogenous MCF10a localization
      is separate from overexpression. FRET/co-IP/crosslinking does not supply a purified
      structural interface or exact native stoichiometry.
