id: Q8NCH0
gene_symbol: CHST14
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHST14 encodes dermatan 4-O-sulfotransferase 1, a Golgi-associated carbohydrate
  sulfotransferase with a predicted type-II membrane topology. It transfers sulfate
  from PAPS to the C4 hydroxyl of N-acetylgalactosamine next to iduronic acid in dermatan
  chains. Its catalytic activity cooperates with dermatan sulfate epimerase 1 to generate
  extended sulfated iduronic-acid regions of dermatan sulfate proteoglycans. Biallelic
  loss-of-function variants cause musculocontractural Ehlers-Danlos syndrome, with
  congenital contractures and connective-tissue fragility; affected fibroblasts show
  deficient dermatan sulfate and increased chondroitin sulfate.
