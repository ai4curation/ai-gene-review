core_functions:
- description: CHST14 catalyzes PAPS-dependent GalNAc 4-O-sulfation during dermatan sulfate proteoglycan
    biosynthesis. Human full-length recombinant enzyme assays establish the chemical specificity, and
    a purified human 61–376 construct cooperates with DS-epi1 to form extended sulfated iduronic-acid
    blocks. Endogenous human-cell microscopy supports a Golgi location; type-II membrane topology remains
    sequence-based. Cellular FRET/co-immunoprecipitation supports enzyme association, without assigning
    epimerase activity or a defined complex stoichiometry to CHST14.
