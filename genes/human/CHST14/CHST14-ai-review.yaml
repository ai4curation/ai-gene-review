  title: Dermatan 4-O-sulfotransferase 1 is pivotal in the formation of iduronic acid blocks in dermatan
    sulfate.
  findings:
  - statement: CHST14 depletion reduces sulfated iduronic-acid blocks in human fibroblast dermatan sulfate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic normal PubMed abstract read; complete Methods were not inspected. The reported
      human lung-fibroblast RNAi and chain analyses support iduronic-acid block formation without a measured
      change in epimerase activity. Later full reconstitution is independently available in PMID:29976758.
- id: PMID:20004762
  title: Loss of dermatan-4-sulfotransferase 1 function results in adducted thumb-clubfoot syndrome.
  findings:
  - statement: Biallelic CHST14 variants cause a connective-tissue disorder; studied patient fibroblasts
      lack detectable newly synthesized dermatan sulfate and show increased chondroitin sulfate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual full Methods, biochemical Results and Discussion read. Human families, tagged
      WT/mutant HEK293T proteins and patient fibroblast isotope/LC-MS glycan analysis are distinguished.
      The paper retains possible residual activity and does not establish that every mutant loses Golgi
      delivery.
- id: PMID:20533528
  title: Loss-of-function mutations of CHST14 in a new type of Ehlers-Danlos syndrome.
  findings:
  - statement: CHST14 loss of function causes a form of Ehlers-Danlos syndrome associated with loss of
      decorin dermatan chains.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic normal PubMed abstract read; no full-Methods claim. Human genetics, mutant/fibroblast
      enzyme assays and decorin chain replacement support the disease/catalytic connection. Collagen effects
      are downstream context, not an intrinsic CHST14 fibril-assembly activity.
- id: PMID:29976758
  title: Dermatan sulfate epimerase 1 and dermatan 4-O-sulfotransferase 1 form complexes that generate
    long epimerized 4-O-sulfated blocks.
  findings:
  - statement: CHST14 and DS-epi1 cooperate to form long sulfated iduronic-acid blocks and associate in
      Golgi-localized cellular assays.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal full primary source read through selected Results/Discussion and actual
      cloning, purification, enzyme, microscopy, FRET and co-IP Methods. Human D4ST1 61–376-His8 is used
      for biochemical reconstitution; full-length 1–376 fluorescent/HA constructs are used in COS-7. Endogenous
      MCF10a localization is separate from overexpression. FRET/co-IP/crosslinking does not supply a purified
      structural interface or exact native stoichiometry.
