    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:15023334
  qualifier: located_in
  review:
    summary: Nuclear localization is supported.
    action: ACCEPT
    reason: The abstract reports CBP/PCAF acetylation of Ku70 K542, association with Ku70 and cytoplasmic
      CBP accumulation as Ku70–BAX binding is disrupted. The curated nuclear annotation is retained with
      curator deference; the directly stated positive cytoplasmic observation does not establish exclusive
      localization.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:15488321
  qualifier: located_in
  review:
    summary: Nuclear localization is supported.
    action: ACCEPT
    reason: The abstract reports CREST recruitment of CBP to nuclear bodies and explicitly distinguishes
      them from PML bodies. Rat PC12 and HEK293 assay hosts do not by themselves establish CBP insert
      species. The positive localization assertions remain at gene-product resolution, without product
      exclusivity.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IC
  original_reference_id: PMID:12169688
  qualifier: located_in
  supporting_entities:
  - GO:0003713
  review:
    summary: Nuclear localization is supported.
    action: ACCEPT
    reason: The actual indexed original and abstract report Sp1/AP-2 control of the rat SPT promoter in
      HepG2 assays, with CBP enhancing Sp1/PKA-driven transcription. This is promoter coactivation, not
      proof that CBP itself binds the Sp1 recognition sequence.
