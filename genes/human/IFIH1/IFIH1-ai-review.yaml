- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: DNA binding assigned electronically from an InterPro signature.
    action: REMOVE
    reason: 'This is an InterPro2GO artefact, not a claim about MDA5. GO_REF:0000002 maps IPR006935
      (Helicase/UvrB, N-terminal; Pfam PF04851 ResIII) to GO:0003677, GO:0005524 and GO:0016787,
      because that domain family is dominated by DNA-acting enzymes such as UvrB and type III restriction
      endonucleases. MDA5 is a cytosolic RNA sensor: every characterised ligand is RNA, the C-terminal
      regulatory domain and the helicase core are structurally resolved in complex with dsRNA, and
      no study reports direct DNA binding by MDA5. MDA5 is activated by some DNA viruses, but the
      accepted mechanism is indirect, via RNA produced during those infections. Removing an electronic
      inference that can be argued against on biological grounds; no experimental annotation is being
      overruled.'
- term:
    id: GO:0003724
    label: RNA helicase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  review:
    summary: RNA helicase activity, defined as ATP-driven unwinding of an RNA helix. MDA5 has a bona
      fide DExD/H ATPase that is stimulated by duplex RNA, but processive duplex unwinding is not
      what the ATPase does.
    action: MODIFY
    reason: The cited IMP (PMID:19211564) mutated the conserved helicase motifs and measured ATP
      hydrolysis and signalling, not duplex unwinding, and concluded that interferon induction is
      independent of helicase catalytic activity. In MDA5 the ATPase powers filament dynamics and
      length-dependent proofreading. The ATP-hydrolysis term the gene already carries (GO:0016887)
      states what was measured; 'ATP-dependent activity, acting on RNA' (GO:0008186) captures the
      RNA-dependence without asserting unwinding.
    supported_by: &id003
    - reference_id: PMID:19211564
      supporting_text: type I interferon production mediated by full-length MDA5 and RIG-I is independent
        of the helicase domain catalytic activity
    - reference_id: PMID:19211564
      supporting_text: Results indicate that all targeted motifs are required for ATP hydrolysis,
        but a subset is involved in RNA binding.
    proposed_replacement_terms: &id004
    - id: GO:0008186
      label: ATP-dependent activity, acting on RNA
