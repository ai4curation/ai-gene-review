      hydrolysis and signalling, not duplex unwinding, and concluded that interferon induction is
      independent of helicase catalytic activity. In MDA5 the ATPase powers filament dynamics and
      length-dependent proofreading. The ATP-hydrolysis term the gene already carries (GO:0016887)
      states what was measured; 'ATP-dependent activity, acting on RNA' (GO:0008186) captures the
      RNA-dependence without asserting unwinding.
