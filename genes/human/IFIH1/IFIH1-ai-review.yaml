core_functions:
- description: 'MDA5 binds the internal stem of long double-stranded RNA and polymerises head-to-tail
    along it. Unlike RIG-I it reads duplex length rather than a terminal chemical mark, and it is
    the RNA-binding event that licenses everything downstream. The duplexes it engages in cells are
    not necessarily viral: iCLIP of endogenous MDA5 during SARS-CoV-2 and encephalomyocarditis virus
    infection recovers host transcripts, concentrated in introns and near inverted Alu repeats, which
    are themselves capable of base-pairing.'
  molecular_function:
    id: GO:0003725
    label: double-stranded RNA binding
  directly_involved_in:
  - id: GO:0039530
    label: MDA-5 signaling pathway
  - id: GO:0071360
    label: cellular response to exogenous dsRNA
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:23273991
    supporting_text: MDA5 recognizes the internal duplex structure, whereas RIG-I recognizes the
      terminus of dsRNA
  - reference_id: PMID:42581186
    supporting_text: upon infection with SARS-CoV-2 or encephalomyocarditis virus, MDA5 bound overwhelmingly
      to cellular RNAs
- description: Duplex-RNA-stimulated ATP hydrolysis by the DExD/H helicase core. The ATPase does
    not act as a processive duplex unwindase; it drives the assembly and disassembly of MDA5 filaments,
    and this turnover is the proofreading step that makes signalling depend on duplex length. Helicase
    catalytic activity is dispensable for interferon induction by full-length MDA5, so the ATPase
    tunes rather than transmits the signal.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  directly_involved_in:
  - id: GO:0039530
    label: MDA-5 signaling pathway
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:22160685
    supporting_text: Cooperative assembly and dynamic disassembly of MDA5 filaments for viral dsRNA
      recognition.
  - reference_id: PMID:19211564
    supporting_text: type I interferon production mediated by full-length MDA5 and RIG-I is independent
      of the helicase domain catalytic activity
- description: 'Ligand-activated innate immune receptor activity: ligand binding occurs in the cytosol,
    where filament assembly clusters the tandem CARDs; the clustered CARDs then nucleate MAVS polymers
    at the mitochondrial outer membrane and drive TBK1/IKBKE and IRF3/IRF7 activation, inducing interferon-alpha/beta.
    This is MDA5''s defining role, and is recorded here with an explicit caveat: GO:0038187 is defined
    as combining with a pathogen-associated molecular pattern, and whether MDA5''s activating ligand
    is pathogen-derived is unsettled. Viral mRNA lacking 2''-O-methylation and long viral duplexes
    activate it, but in infected cells the bound RNA is predominantly host, gain-of-function variants
    cause sterile interferonopathy, and ADAR1 editing exists to keep endogenous duplexes from triggering
    it.'
  molecular_function:
    id: GO:0038187
    label: pattern recognition receptor activity
  directly_involved_in:
  - id: GO:0140374
    label: antiviral innate immune response
