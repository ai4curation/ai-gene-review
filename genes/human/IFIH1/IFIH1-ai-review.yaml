- term:
    id: GO:0038187
    label: pattern recognition receptor activity
  evidence_type: IDA
  original_reference_id: PMID:21217758
  qualifier: enables
  review:
    summary: 'Pattern recognition receptor activity: MDA5 binds an RNA ligand and, through its tandem
      CARDs, initiates MAVS-dependent innate immune signalling. The GO definition requires the ligand
      to be a pathogen-associated molecular pattern, and that requirement is exactly what the 2026
      iCLIP data call into question.'
    action: ACCEPT
    reason: 'Retained, but this is the annotation on which the contested question turns, and both
      sides are recorded here rather than resolved. FOR the term: GOA''s own supporting experiments
      are real - Zuest et al. 2011 (PMID:21217758) show MDA5-dependent interferon induction by viral
      mRNA lacking the host 2''-O-methyl cap mark (self/non-self discrimination), and Wu et al. 2013
      (PMID:23273991) show recognition of the internal duplex of long dsRNA, a canonical microbial
      pattern. AGAINST the term as defined: Sampaio et al. 2026 (PMID:42581186) applied iCLIP to
      endogenous MDA5 in SARS-CoV-2- and EMCV-infected cells and recovered essentially no viral RNA:
      the bound population was host RNA, enriched in introns, Alu-proximal regions and predicted
      duplexes, and MDA5 activation was abolished by SRSF3 overexpression, which restores splicing
      fidelity. The authors frame MDA5 as surveying RNA processing fidelity (''guarding'') rather
      than detecting a pathogen-encoded pattern, and state plainly that they cannot exclude direct
      viral dsRNA detection in other settings. This reframes which RNA activates MDA5; it does not
      challenge the biochemistry of duplex-RNA binding. The same paper calls MDA5 one of the few
      remaining ''orphan'' pattern recognition receptors because no PAMP has been pinned down. Independently,
      IFIH1 gain-of-function variants cause Aicardi-Goutieres syndrome and related interferonopathies
      through excessive signalling in the absence of infection (PMID:24686847), and ADAR1 editing
      exists to stop MDA5 sensing endogenous duplex RNA (PMID:26275108) - both are evidence that
      the physiological ligand pool includes self RNA distinguished by processing state rather than
      by pathogen origin. ACCEPT rather than MODIFY or REMOVE because (i) these are IDA annotations
      whose full experimental basis stands, and (ii) the mismatch is with the wording of GO:0038187,
      not with this gene: no existing MF term describes a receptor that senses aberrantly processed
      cellular RNA. A replacement term is proposed under proposed_new_terms and the question is raised
      in suggested_questions rather than being settled by an edit here.'
    supported_by: *id006
