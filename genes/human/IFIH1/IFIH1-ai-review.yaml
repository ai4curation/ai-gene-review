proposed_new_terms:
- proposed_name: aberrant cellular RNA sensor activity
  proposed_definition: Binding to improperly processed or mislocalised cellular RNA, such as intron-retaining
    or unspliced transcripts accumulating in the cytoplasm, and thereby initiating an innate immune
    response. Unlike pattern recognition receptor activity, this activity does not require the bound
    ligand to be of pathogen origin; the discriminating feature is the processing state of the RNA
    rather than its provenance.
  justification: GO:0038187 pattern recognition receptor activity is defined as combining with a
    pathogen-associated molecular pattern. MDA5 is annotated to it, yet the PAMP has never been identified
    - it is described in the 2026 literature as one of the few remaining 'orphan' PRRs - and crosslinking
    of endogenous MDA5 in virus-infected cells recovers host rather than viral RNA. Sterile activation
    in ADAR1 deficiency and in IFIH1 gain-of-function interferonopathies points the same way. There
    is currently no molecular function term for a receptor that initiates innate immunity by detecting
    the processing state of self RNA, so curators must either use a term whose definition does not
    fit or leave the activity unannotated. The same gap affects ZBP1 and OAS1, for which comparable
    host-RNA and transcription-termination sensing has been reported.
  proposed_parent:
    id: GO:0003725
    label: double-stranded RNA binding
  supported_by:
  - reference_id: PMID:42581186
    supporting_text: we propose that MDA5 surveys RNA processing fidelity and can detect infections
      by sensing perturbations of post-transcriptional events such as splicing.
  - reference_id: PMID:42581186
    supporting_text: We did not detect MDA5 binding sites in viral RNA; instead, MDA5 bound only
      host RNA.
suggested_questions:
- question: Should IFIH1 keep GO:0038187 pattern recognition receptor activity, whose definition
    requires the ligand to be a pathogen-associated molecular pattern, when the RNA occupied by endogenous
    MDA5 during SARS-CoV-2 and EMCV infection is host-derived, and when the activating signal can
    be removed simply by restoring splicing fidelity with SRSF3? Or does GO need a molecular function
    term for a receptor that reads the processing state of self RNA?
  experts:
  - GO innate immunity curators
  - Jan Rehwinkel
  - Sun Hur
- question: Are the viral-ligand results and the host-RNA results in conflict, or are they measuring
    different things? Purified MDA5 demonstrably binds long viral duplexes and unmethylated viral
    mRNA in vitro, while iCLIP measures which RNAs MDA5 is crosslinked to in an infected cell, where
    viral RNA may be sequestered in replication organelles and coated by viral proteins. A direct
    test would be whether MDA5 activation survives in cells where host splicing is protected but
    viral replication proceeds normally.
  experts:
  - Jan Rehwinkel
  - Sun Hur
  - Michaela Gack
- question: If MDA5 is a guard rather than a PAMP receptor, is the gain-of-function interferonopathy
    phenotype better described as loss of a threshold on normal self-RNA surveillance than as inappropriate
    self recognition? That distinction matters for how the Aicardi-Goutieres and Singleton-Merten
    alleles should be annotated with respect to this gene's normal function.
  experts:
  - Yanick Crow
  - Sun Hur
- question: Does MDA5 have any physiologically relevant duplex-unwinding activity? GO:0003724 RNA
    helicase activity asserts ATP-driven unwinding of an RNA helix, but the IMP behind it measured
    ATP hydrolysis and signalling, and concluded that helicase catalytic activity is dispensable
    for interferon induction.
  experts:
  - Sun Hur
  - Anna Marie Pyle
suggested_experiments:
- hypothesis: MDA5 activation during infection requires accumulation of unspliced or aberrantly processed
    host transcripts in the cytoplasm, and is not triggered by viral RNA per se.
  description: Uncouple viral replication from host RNA-processing failure. In MDA5-competent cells,
    infect with EMCV or SARS-CoV-2 while restoring splicing fidelity (SRSF3 overexpression, or complementation
    of the virus-encoded splicing antagonist) and measure IFNB1 induction, CARD oligomerisation and
    MDA5 filament formation. Conversely, induce intron retention pharmacologically in the absence
    of infection and ask whether MDA5 is activated to the same extent. A clean dissociation in either
    direction would settle whether the activating ligand is viral.
  experiment_type: infection plus splicing-modulation, with interferon and MDA5 oligomerisation readouts
- hypothesis: The RNAs bound by MDA5 in gain-of-function interferonopathy patients are the same aberrantly
    processed host transcripts identified during infection.
  description: Apply the published endogenous-MDA5 iCLIP protocol to uninfected patient-derived cells
    carrying AGS/Singleton-Merten IFIH1 alleles and to ADAR1-deficient cells, and compare the bound
    RNA populations with those recovered from infected wild-type cells. Overlap in intronic and inverted-Alu
    binding sites would argue that infection and interferonopathy converge on one ligand class, which
    would in turn argue that the molecular function term should not presuppose pathogen origin.
  experiment_type: iCLIP on patient-derived and ADAR1-deficient cells
- hypothesis: MDA5 does not unwind RNA duplexes processively; its ATPase serves filament proofreading
    only.
  description: Run side-by-side single-molecule unwinding assays on purified full-length MDA5 and
    on a bona fide processive RNA helicase using identical duplex substrates and ATP concentrations,
    and compare with filament assembly/disassembly kinetics on the same substrates. A clear absence
    of unwinding would justify replacing GO:0003724 with a term that asserts ATP-dependent activity
    on RNA without asserting unwinding.
  experiment_type: single-molecule helicase assay
