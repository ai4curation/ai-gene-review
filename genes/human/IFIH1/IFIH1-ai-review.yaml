- term:
    id: GO:0003725
    label: double-stranded RNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: MDA5 binds long double-stranded RNA and cooperatively assembles head-to-tail filaments
      along the duplex; this is its core ligand-binding activity.
    action: ACCEPT
    reason: 'Core molecular function, established structurally and biochemically and not in dispute.
      What is disputed is the origin of the duplex RNA that engages MDA5 in infected cells, not the
      binding activity itself. Sampaio et al. 2026 (PMID:42581186) applied iCLIP to endogenous MDA5
      in SARS-CoV-2- and EMCV-infected cells and recovered essentially no viral RNA: the bound population
      was host RNA, enriched in introns, Alu-proximal regions and predicted duplexes, and MDA5 activation
      was abolished by SRSF3 overexpression, which restores splicing fidelity. The authors frame
      MDA5 as surveying RNA processing fidelity (''guarding'') rather than detecting a pathogen-encoded
      pattern, and state plainly that they cannot exclude direct viral dsRNA detection in other settings.
      This reframes which RNA activates MDA5; it does not challenge the biochemistry of duplex-RNA
      binding. The host ligands it identifies - inverted Alu repeats and structured intronic RNA
      - are themselves double-stranded, so this term remains correct under either model.'
    supported_by: &id007
    - reference_id: PMID:23273991
      supporting_text: MDA5 recognizes the internal duplex structure, whereas RIG-I recognizes the
        terminus of dsRNA
    - reference_id: PMID:22160685
      supporting_text: Cooperative assembly and dynamic disassembly of MDA5 filaments for viral dsRNA
        recognition.
    - reference_id: PMID:42581186
      supporting_text: upon infection with SARS-CoV-2 or encephalomyocarditis virus, MDA5 bound overwhelmingly
        to cellular RNAs
