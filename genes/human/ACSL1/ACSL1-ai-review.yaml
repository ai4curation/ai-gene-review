id: P33121
gene_symbol: ACSL1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACSL1 (long-chain-fatty-acid--CoA ligase 1) is a Mg2+-dependent member of the ANL superfamily
  of adenylate-forming enzymes and one of five mammalian long-chain acyl-CoA synthetases. It catalyzes
  the ATP-dependent thioesterification of long-chain fatty acids (preferentially C16-C18 unsaturated fatty
  acids such as palmitoleate, oleate and linoleate, as well as palmitate and arachidonate) with coenzyme
  A, forming acyl-CoAs that are the obligatory activated intermediates for both catabolism and lipid synthesis.
  ACSL1 is an integral membrane protein anchored by an N-terminal segment with its active site facing
  the cytosol; it resides on the outer mitochondrial membrane, where it channels fatty acids into carnitine-dependent
  mitochondrial beta-oxidation, and on the endoplasmic reticulum membrane, where its acyl-CoAs feed glycerolipid
  (triacylglycerol and phospholipid) synthesis; a peroxisomal pool is reported in rodents. Highly expressed
  in liver, heart, skeletal muscle, kidney and adipose tissue, it contributes most of the long-chain acyl-CoA
  synthetase activity of heart and adipose tissue and about half of that of liver, and tissue-specific
  loss in mice impairs fatty acid oxidation, causing cold intolerance (adipose) and cardiac hypertrophy
  (heart). By trapping incoming fatty acids as acyl-CoA it indirectly increases cellular fatty acid uptake.
  ACSL1 expression is induced in inflammatory macrophages and in microglia, where it drives triacylglycerol
  synthesis and associated lipid droplet accumulation.
