suggested_questions:
- question: Does ACSL1 protein associate with the lipid droplet surface (as ACSL3 does) in microglia or
    hepatocytes, or does it drive lipid droplet accumulation solely by supplying acyl-CoA for ER triacylglycerol
    synthesis?
- question: What determines partitioning of ACSL1 between the outer mitochondrial membrane and ER (about
    50% ER in liver), and does this switch its acyl-CoA product between oxidation and esterification?
- question: Are the branched-chain (phytanate, pristanate) and eicosanoid (EET/HETE) activities inferred
    from rat Acsl1 conserved in human ACSL1?
suggested_experiments:
- description: Immunogold EM or super-resolution imaging of endogenous ACSL1 with lipid droplet (PLIN2)
    and ER/mitochondrial markers in fibrillar amyloid-beta-treated human iPSC-derived microglia, plus
    lipid droplet fractionation proteomics, to test whether ACSL1 is LD-resident.
- description: Purified human ACSL1 kinetic profiling across saturated, unsaturated, branched-chain and
    oxidized fatty acid substrates to confirm substrate specificity inferred from rat.
