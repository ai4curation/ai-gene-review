- description: Mg2+/ATP-dependent long-chain fatty acid-CoA ligase that thioesterifies long-chain fatty
    acids (preferentially palmitoleate, oleate, linoleate; also palmitate and arachidonate) with CoA on
    the cytosolic face of the outer mitochondrial membrane, generating the acyl-CoAs that are channelled
    into carnitine-dependent mitochondrial beta-oxidation.
