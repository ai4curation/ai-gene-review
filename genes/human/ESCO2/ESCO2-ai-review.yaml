id: Q56NI9
gene_symbol: ESCO2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ESCO2 is a chromatin-associated protein-lysine acetyltransferase that uses acetyl-CoA to
  establish sister-chromatid cohesion during the mitotic cell cycle. It contributes to SMC3 acetylation
  and Sororin association with cohesin. Human depletion experiments establish a cohesion requirement that
  ESCO1 does not fully replace; mouse Esco2 loss particularly disrupts pericentric cohesion and reduces
  Smc3 acetylation and chromatin-bound Sororin. Human ESCO2 also promotes replication-fork progression
  through cohesin regulation. ESCO2 associates with interphase chromatin and changes localization and
  abundance during cell division. Biallelic defects cause Roberts syndrome, with impaired chromatid cohesion
  and developmental abnormalities.
