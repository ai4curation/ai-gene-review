      inspection. Only combined depletion substantially reduced the measured acetyl-SMC3 endpoint in this
      particular S-phase HeLa immunoblot; it does not establish general interchangeability in cohesion,
      given the independent human and mouse single-gene loss experiments. Figure 3B/D separately relates
      acetylation to Sororin association.
