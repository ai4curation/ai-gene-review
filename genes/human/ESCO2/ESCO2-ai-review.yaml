      the modified residue; human PMID:21111234 Figure 3A/B independently shows the ESCO1/2-dependent
      protein-lysine endpoint on SMC3. The purified-enzyme experiment in the latter paper uses ESCO1 and
      Xenopus chromatin and is not relabeled as an ESCO2 reconstitution. This is a reaction-class correction,
      not evidence that the ortholog lacks acetyltransferase activity. The imported term and donor identifiers
      remain unchanged.
