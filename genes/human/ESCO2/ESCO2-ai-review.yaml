    reason: 'The HPA target record and inspected U2OS images from HPA027243 and HPA053679 provide positive
      nucleoplasmic immunofluorescence evidence. Their antigens map to canonical ESCO2 residues 313–395
      and 4–86. This additional, imaging-defined location is retained as non-core: the principal cohesion/acetylation
