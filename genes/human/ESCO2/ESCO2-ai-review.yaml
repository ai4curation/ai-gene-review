- id: PMID:15958495
  title: Two human orthologues of Eco1/Ctf7 acetyltransferases are both required for proper sister-chromatid
    cohesion.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual original main Methods, operative Results and figure captions were recovered from
      PMC1182326; Figures 1B and 2A/B pixels were inspected. https://doi.org/10.1091/mbc.e04-12-1063.
      Human 601-residue EFO2 was cloned using a fetal-thymus cDNA library; purified EFO2-C2 residues 215–601
      autoacetylate with [14C]acetyl-CoA. EFO1, not EFO2, supplies the catalytic-mutant series. Endogenous
      HeLa/293T fractionation and tagged human EFO2 imaging support chromosome/chromatin and interphase
      nuclear association; little soluble nucleoplasmic signal was reported. The current 239-residue natural
      product is not a tested deletion construct. The normal cache remains abstract-only and unchanged;
      actual reviewer access is recorded here. No complete supplementary-material or sequence-equivalence
      claim is made. The public original is https://pmc.ncbi.nlm.nih.gov/articles/PMC1182326/; Methods
      on RNA interference and Results/Figure 3 independently show cohesion defects after either EFO1 or
      EFO2 depletion. The reviewer-access flag describes that recovered original, while the unchanged
      normal-cache flag describes its narrower extraction. The feedback reread used main text and captions;
      the previously documented Figure 1B/2A/B pixel inspection is retained, not newly claimed.
  full_text_unavailable: false
- id: PMID:19907496
  title: Cohesin acetylation speeds the replication fork.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual main original, Figures 3–4 captions, and Methods Summary read at https://doi.org/10.1038/nature08550
      (PMC2777716). Human RPE-derived DCC1 perturbation/fractionation is distinct from ESCO2 RNAi in HeLa
      and patient-cell fiber assays. Figures 3d/e and 4e support chromatin localization and positive regulation
      of fork velocity through cohesin acetylation; the proposed physical occlusion model is not directly
      resolved. Detailed online Methods/supplement requests returned HTML challenge pages instead of the
      requested DOC/PDF; those materials and figure pixels were not inspected. No isoform-specific outcome
      is established.
  full_text_unavailable: false
- id: PMID:21111234
  title: Sororin mediates sister chromatid cohesion by antagonizing Wapl.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual author-institution copy of the main original was recovered at https://publications.mpi-cbg.de/Nishiyama_2010_4332.pdf;
      DOI https://doi.org/10.1016/j.cell.2010.10.031. Operative Results pp. 741–742, Figure 3 caption
      and pixels, plus main Experimental Procedures pp. 748–749 were read. Human S-phase HeLa ESCO1/ESCO2
      combined RNAi lowers chromatin SMC3 K105/K106 acetylation. The reconstituted enzymatic experiment
