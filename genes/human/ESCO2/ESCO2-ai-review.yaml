core_functions:
- description: Catalyzes acetyl-CoA-dependent protein-lysine acetylation on chromatin, supporting mitotic
    sister-chromatid cohesion and replication-fork progression through cohesin regulation. Human ESCO2-fragment
    autoacetylation establishes acetyl-transfer capacity. A specific S-phase HeLa combined ESCO1/ESCO2-depletion
    immunoblot links these enzymes to SMC3 acetylation; separate human cohesion experiments and mouse
    Esco2 loss establish nonredundant ESCO2 requirements, especially at mouse pericentric chromatin. Human
    ESCO2 depletion also slows replication forks, with suppression by WAPL or PDS5A depletion. These complementary
    assays do not constitute purified full-length human ESCO2–SMC3 reconstitution.
