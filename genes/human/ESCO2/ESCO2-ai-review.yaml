      GO:0005654 excludes chromosomes, so the staining category is not substituted for the chromatin activity
      site. Little soluble nucleoplasmic ESCO2 in PMID:15958495 Figure 5A does not negate all other imaging
      conditions. The two assays have different operational resolutions; neither resolves the natural
