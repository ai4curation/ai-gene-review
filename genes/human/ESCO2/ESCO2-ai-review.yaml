      40–47; actual Figure 3/4/7 captions separately read. Mouse Esco2 is enriched at pericentric heterochromatin/chromocenter
      cores; loss reduces Smc3 K105/K106 acetylation and Sororin recruitment. This is protein acetylation
      evidence, not acetyl-phosphate/free-lysine chemistry. No figure pixels or supplementary Methods
      inspected. Human short-product compensation in Discussion 32 is explicitly a hypothesis, not observed
      activity. Mouse and limited human HeLa supplemental statements remain distinct. Original: https://pmc.ncbi.nlm.nih.gov/articles/PMC3252581/;
      DOI: 10.1038/emboj.2011.381. See the public source guide for source and product distinctions. Mouse
      Esco2 loss reduces Smc3 acetylation from mid S phase into early mitosis and Sororin association
      at pericentric and some other chromatin regions; it demonstrates a function not fully replaced by
      Esco1, rather than general ESCO1/2 redundancy.'
