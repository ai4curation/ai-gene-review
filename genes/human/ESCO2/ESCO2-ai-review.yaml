- term:
    id: GO:0006275
    label: regulation of DNA replication
  evidence_type: IMP
  original_reference_id: PMID:19907496
  qualifier: involved_in
  review:
    summary: Specify positive regulation of replication-fork progression.
    action: MODIFY
    reason: 'PMID:19907496 Figure 3e measures reduced fork velocity in cells from two Roberts syndrome
      patients; Figure 4e independently shows slowing after ESCO2 RNAi in human HeLa cells and reversal
      after WAPL or PDS5A depletion. The Results relate this to the acetylation state of cohesin, supported
      by the non-acetylatable SMC3 comparison. Thus ESCO2 promotes replication progression through protein
      acetylation and cohesin regulation, rather than executing DNA polymerization. GO:0045740 captures
      the experimentally positive direction of the imported regulation term. The proposed fork-occlusion
      geometry remains a model, and the data do not show that every ESCO2 product has this effect. Public
      locator: https://doi.org/10.1038/nature08550, Figures 3e and 4c–e and Methods Summary (IdU/CldU
      fiber measurements).'
    supported_by:
    - reference_id: PMID:19907496
    proposed_replacement_terms:
    - id: GO:0045740
      label: positive regulation of DNA replication
