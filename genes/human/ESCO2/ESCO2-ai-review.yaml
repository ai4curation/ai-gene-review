    reason: The current GO:0004468 definition specifies acetyl phosphate and free L-lysine; GO:0061733
      instead specifies acetyl-CoA and a protein lysyl residue. The mouse IMP in PMID:22101327 measures
      reduced chromatin Smc3 K105/K106 acetylation after Esco2 deletion (Results 25, Figure 7), not an
