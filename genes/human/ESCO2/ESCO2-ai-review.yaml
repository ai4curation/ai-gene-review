suggested_questions:
- question: Which ESCO2 recruitment or regulatory features account for its nonredundant pericentric-cohesion
    requirement, and how do those features differ from ESCO1 across cell types and cell-cycle stages?
- question: Is the reported 239-residue ESCO2 product translated and stable, and does it retain chromatin
    association or acetyltransferase activity? The 601-residue protein and engineered catalytic fragments
    do not establish the answer.
- question: Does ESCO2’s mouse oocyte break-associated chromatin or spermatocyte XY-body localization
    support a distinct meiotic function, beyond the location measured by immunofluorescence?
- question: How does ESCO2-dependent cohesin regulation change replication-fork velocity, the specific
    endpoint in the human fiber assay, and how is that effect separated from replication initiation or
    total DNA synthesis?
