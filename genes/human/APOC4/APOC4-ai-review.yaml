- description: 'Exchangeable apolipoprotein constituent of plasma very-low-density lipoprotein. ApoC-IV
    is synthesised by hepatocytes, secreted into blood, and carried on triglyceride-rich lipoprotein particles,
    with a smaller, non-core pool on HDL; it is a minor protein constituent of VLDL, about 0.7% of apoVLDL,
    and its measured concentration in plasma and in the lipoprotein fractions scales with plasma triglyceride.
    This is the apolipoprotein role in the GO sense - the protein binds lipid and travels with it in the
    circulation - and it is the one function of apoC-IV that has been established on the native human
    protein rather than inferred from sequence or from overexpression. Its consequence for whole-body
    lipid handling is real but quantitatively unsettled: increasing apoC-IV increases plasma triglyceride,
    while its contribution at endogenous concentration is unmeasured.'
