- term:
    id: GO:0006629
    label: lipid metabolic process
  evidence_type: TAS
  original_reference_id: PMID:8530039
  qualifier: involved_in
  review:
    summary: Author statement, from the gene-identification paper, that APOC4 belongs to the apolipoprotein
      gene family on the basis of its hepatic expression and predicted structure [PMID:8530039]. The inference
      to lipid metabolic process is sound but generic.
    action: KEEP_AS_NON_CORE
    reason: 'GO:0006629 lipid metabolic process is true of APOC4 but says almost nothing: its definition
      spans every reaction involving any lipid. It is worth being exact about why it is uninformative,
      because the obvious justification is wrong. This is not a broad parent sitting above more specific
      children already on the gene: the two particle rows are cellular components and so cannot be descendants
      of a biological-process term at all, and neither of APOC4''s other process terms is under it either
      - GO:0070328 triglyceride homeostasis descends through lipid homeostasis (GO:0055088) and GO:0019915
      lipid storage through cellular process, with GO:0006629 in neither ancestry (checked against the
      QuickGO ancestors endpoint). So the row is not redundant with anything; it is simply the most general
      true statement that can be made about the gene, and it is the only metabolic-process term APOC4
      carries. Retained because it is not incorrect and removing a true term buys nothing, but it carries
      no information a reader could act on and is not a core function statement. That a generic parent
      is still the gene''s only metabolic-process annotation is a fact about the evidence rather than
      about the curation: the affinage deep-research record, working independently from the literature,
      reaches the same conclusion about how little has been established.'
    additional_reference_ids:
    - file:human/APOC4/APOC4-deep-research-affinage.md
    supported_by:
    - reference_id: PMID:8530039
      supporting_text: Since its hepatic expression and predicted protein structure are characteristic
        of the other genes in this cluster, we propose that the APOC4 gene is a member of the apolipoprotein
        gene family.
    - reference_id: PMID:8530039
      supporting_text: RNase protection analysis indicated relatively low apoC-IV mRNA levels in human
        liver, compared to apoC-II mRNA levels.
    - reference_id: file:human/APOC4/APOC4-deep-research-affinage.md
      supporting_text: Beyond this molecular characterization and its association with lipid traits, no
        enzymatic activity, receptor interaction, or reconstituted mechanism for apoC-IV has been characterized
        in the available corpus.
- term:
    id: GO:0019915
    label: lipid storage
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000792756
  - UniProtKB:P55056
  review:
    summary: 'Phylogenetic propagation of lipid storage from the PTHR32288 apolipoprotein C-IV node. The
      PAINT slice shows this IBD carries a single seed, UniProtKB:P55056 - the human gene itself - and
      is dated 2025-06-24, seven months after the BHF-UCL IMP (2024-11-01) it rests on. That IMP is one
      experiment: transient transfection of the APOC4 cDNA into Huh-7 hepatoma cells produced cytoplasmic
      lipid droplets and about a 2.7-fold rise in triglyceride [PMID:18809223].'
    action: KEEP_AS_NON_CORE
    reason: 'The node placement is not the problem - the family is eutherian and human APOC4 is squarely
      inside the clade. The problem is the depth of the assertion relative to its evidence. The whole
      IBD, and the eleven IBA rows that follow from it, rest on one ectopic gain-of-function in a transformed
      hepatoma line, with no loss-of-function for APOC4 in any species and no independent replication
      in any other eutherian. It is worth separating this row from the IMP that seeds it, because the
      two are graded the same way for different reasons: the IMP is a real, conservatively coded experiment
      and is non-core because one ectopic overexpression does not establish a physiological role, whereas
      this IBA is a propagation whose reach - eleven eutherian species - is what over-extends. On the
      propagation considered alone MARK_AS_OVER_ANNOTATED would be arguable. KEEP_AS_NON_CORE is used
      instead because the term is not wrong for the target, because the two rows carrying this term should
      carry one action, and because the over-reach is recorded where it belongs - in propagation_review
      as SOURCE_WEAK_OR_INFERRED - rather than by downgrading a claim the evidence does support at the
      level of the target itself. Intracellular lipid storage is also at a tangent to everything else
      established about apoC-IV, which is a secreted plasma apolipoprotein: in that paper APOC4 is mostly
      the regulated readout, with HCV core protein, Ku antigen and PPARgamma/RXRalpha as the agents, and
      the in vivo arm is explicitly a correlation between transcript level and hepatic triglyceride. Kept,
      because an overexpression phenotype is real evidence and the claim is not contradicted, but not
      as a core function.'
    additional_reference_ids:
    - PMID:18809223
    - PMID:37226733
    supported_by:
    - reference_id: PMID:18809223
      supporting_text: Considering the transfection efficiency of about 40%, the triglyceride content
        in ApoC-IV transfected cells was approximately 2.7-fold higher than that in vector transfected
        cells.
    - reference_id: PMID:18809223
      supporting_text: we identified host transcription factors regulating the ApoC-IV gene expression
    - reference_id: PMID:37226733
      supporting_text: Endogenous APOC4 is thought to increase plasma triglyceride levels because overexpression
        of human APOC4 at supraphysiological levels in mice causes elevated levels of VLDL.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN000792756
        source_label: PTHR32288 APOLIPOPROTEIN C-IV IBD node at taxon:9347 (Eutheria)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Node placement is sound - see the VLDL row for the taxonomic argument - but for this
          term the node has exactly one seed, read directly from interpro/panther/PTHR32288/PTHR32288-paint.tsv,
          and that seed's evidence is a single cell-culture overexpression. The IBD nonetheless asserts
          that lipid storage is an ancestral eutherian property of apoC-IV and propagates it to all eleven
          descendants. That is a large taxonomic reach for one transfection experiment, which is what
          makes the source weak rather than the propagation wrong.
      - source_id: UniProtKB:P55056
        source_label: APOC4 (human, the target)
        source_status: SUPPORTS_TRANSFER
        comment: 'The target''s own accession among the sources is expected and not circular: human APOC4''s
          experimental annotations are among the descendant evidences the PAINT curator used to place
          the IBD, so it legitimately appears among the sources of the IBA it later receives. Here that
          evidence is the BHF-UCL IMP from PMID:18809223 and it is the only seed the IBD has for this
          term. It supports the transfer in the sense that the descendant evidence is genuine and experimental;
          what it does not support is treating lipid storage as a core function, which is why the row
          is kept as non-core rather than accepted.'
      residue_claims_not_applicable: 'The reservation is about evidential depth and physiological context,
        not about sequence divergence: apoC-IV''s amphipathic-helix architecture is intact in human (file:human/APOC4/APOC4-bioinformatics/RESULTS.md),
        so no residue-level argument bears on this row.'
- term:
