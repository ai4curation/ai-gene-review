knowledge_gaps:
- gap_statement: What apolipoprotein C-IV does at its endogenous concentration is unknown. Every functional
    claim about the protein comes from adding more of it - a supraphysiological transgene in mouse, or
    a transient transfection of a hepatoma line - and no loss-of-function experiment has ever been performed
    on APOC4 in any species.
  boundary: 'Firmly established: apoC-IV is made by the liver, secreted, and recovered from human plasma,
    where more than 80% of it is on VLDL and most of the rest on HDL; its plasma concentration (0.1-1.9
    mg/dl) rises with plasma triglyceride; and raising it experimentally raises plasma triglyceride with
    the excess in VLDL. Equally firmly established: it is present at roughly a tenth the concentration
    of the other apoCs, and no knockout, knockdown or naturally occurring null allele has been reported.'
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: The direction of the gain-of-function effect is what all four of APOC4's IBAs ultimately
    encode, and it is what propagates to ten other eutherian orthologues. If endogenous apoC-IV is functionally
    negligible at a tenth the abundance of its relatives, then triglyceride homeostasis and lipid storage
    are properties of overexpressed apoC-IV rather than of the gene, and the whole node's process assertions
    are describing an artefact of dose.
  resolution: An Apoc4 knockout or conditional hepatic knockdown in mouse, phenotyped for plasma triglyceride,
    VLDL secretion rate and VLDL clearance, would settle it in one experiment. A knock-in expressing human
    APOC4 at its own promoter, rather than from a strong transgene, would separate dose from function.
  provenance:
  - reference_id: PMID:37226733
    supporting_text: Endogenous APOC4 is thought to increase plasma triglyceride levels because overexpression
      of human APOC4 at supraphysiological levels in mice causes elevated levels of VLDL.
  - reference_id: PMID:37226733
    supporting_text: The biological functions of endogenous APOC4 as well as its potential role in diabetes
      and diabetes complications need further study.
  - reference_id: PMID:37226733
    supporting_text: Contrarily, almost nothing is known about APOC4.
- gap_statement: The mechanism by which apoC-IV raises plasma triglyceride has never been measured for
    apoC-IV. The apoE-displacement model is asserted for APOC1, APOC3 and APOC4 as a group, and the experimental
    work behind it is on the relatives, not on apoC-IV.
  boundary: 'Established: transgenic apoC-IV overexpression elevates VLDL triglyceride, and the elevation
    is attributed to reduced hepatic clearance rather than to reduced lipase activity. Not established:
    that apoC-IV displaces apoE from the particle, that it interferes with LDLR or LRP1 binding, or that
    it binds any receptor or enzyme at all. No receptor, lipase or other protein partner of apoC-IV has
    been demonstrated in a physiologically relevant assay - the 23 GO:0005515 rows on the gene come from
    a single yeast two-hybrid screen whose partners are all intracellular.'
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: This is the difference between apoC-IV having a molecular function in lipoprotein clearance
    and apoC-IV being a passive surface passenger whose presence displaces other apolipoproteins by mass
    action. GO currently expresses neither, and cannot until the experiment exists - which is the correct
    outcome, but it means the gene's molecular-function record stops at 'binds lipid and rides on particles'.
  resolution: Surface plasmon resonance or competition experiments measuring apoE displacement from reconstituted
    VLDL-like particles by apoC-IV, and VLDL clearance assays in Ldlr-/- and Lrp1-deficient backgrounds,
    would test the proposed mechanism directly. A positive result would support a receptor-binding-regulator
    molecular function; a negative one would make the case that apoC-IV's effect is non-specific surface
    occupancy.
  provenance:
  - reference_id: PMID:37226733
    supporting_text: The mechanism of the elevated VLDL levels in APOC4 transgenic mice was suggested
      to be due to displacement of APOE, resulting in reduced hepatic clearance of VLDL, rather than to
      a reduction in lipase activity
  - reference_id: PMID:37226733
    supporting_text: APOC1, APOC3 and APOC4 are believed to slow the clearance of TRLs and their remnants
      in part by interfering with APOE binding to the hepatic receptors
- gap_statement: The only direct lipid-binding measurement anywhere in the apolipoprotein C-IV family
    is uncurated in GO, so the family's experimental anchor is invisible to every inference pipeline that
    uses GO as input.
  boundary: 'Established in the literature: rabbit apoC-IV forms discoidal micelles with phosphatidylcholine,
    associates with plasma VLDL and HDL, is transcribed only in liver, and is secreted from transfected
    mammalian cells. Established about the GO record: UniProtKB:P55057 carries five GO annotations and
    all five are IEA - four from the GO_REF:0000118 PANTHER ancestral-node pipeline and one from the subcellular-location
    mapping. The rabbit protein therefore could not be, and was not, an IBD seed for PTN000792756.'
  gap_kind:
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: Three of the four IBDs at this node rest on a single human seed, and two of those seeds
    are overexpression experiments. A curated rabbit IDA for phospholipid binding and for VLDL and HDL
    membership would give the node independent, biochemical, non-human descendant evidence, which is exactly
    what it currently lacks - and it would turn the ISS row proposed in this review into something better
    grounded than a similarity inference.
  resolution: 'Curation, not new experiments: annotate PMID:8576182 to UniProtKB:P55057 for GO:0005543
    (IDA), GO:0034361 and GO:0034364 (IDA), and GO:0005576 (IDA), then re-examine whether the PTN000792756
    IBDs should be re-seeded.'
  provenance:
  - reference_id: PMID:8576182
    supporting_text: It contains two potential amphipathic helices characteristic of plasma apolipoproteins
      and forms discoidal micelles with phosphatidylcholine.
  - reference_id: PMID:8576182
    supporting_text: The mature protein of 97 amino acids, designated apolipoprotein C-IV, is associated
      with the lipoproteins of blood plasma, primarily very low density and high density lipoproteins.
  - reference_id: PMID:8576182
    supporting_text: Northern analysis shows a single 0.6-kilobase apolipoprotein C-IV mRNA, detected
      only in the liver
- gap_statement: Why apoC-IV is abundant in rabbit plasma and a trace protein in human plasma is unexplained,
    and so is the function of the conserved N-glycan and sialoform heterogeneity the protein carries in
    both species.
  boundary: 'Established: the gene is highly conserved across mammals and arose in Eutheria; the human
    protein exists in two major glycoforms, one N-glycosylated at Asn-63 and both variably sialylated,
    and the rabbit protein in up to five sialoforms; human apoC-IV mRNA is low in liver relative to apoC-II.
    A promoter explanation has been proposed - neither gene has a TATA box, and the rabbit 5'' UTR carries
    a GAGA-box-like purine-rich repeat absent from the human gene - but it has not been tested.'
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: A large species difference in abundance in an otherwise conserved gene - a major apoC
    component of rabbit plasma, a trace protein in human plasma - is either a regulatory accident or a
    real difference in how much the protein matters, and which it is determines how far rabbit biochemistry
    can be transferred to the human protein - which is precisely what the proposed ISS annotation does.
  resolution: Reporter assays comparing the human and rabbit APOC4 promoters in the same hepatocyte background,
    with and without the purine-rich repeat, would test the promoter model. Enzymatic deglycosylation
    and desialylation of purified apoC-IV followed by particle-binding and clearance assays would test
    whether the glycan does anything.
  provenance:
  - reference_id: PMID:8530039
    supporting_text: RNase protection analysis indicated relatively low apoC-IV mRNA levels in human liver,
      compared to apoC-II mRNA levels.
  - reference_id: PMID:12700345
    supporting_text: The protein exhibits two major isoforms; one is N-glycosylated, and both are variably
      sialylated.
  - reference_id: PMID:12700345
    supporting_text: Neither the human nor rabbit apoC-IV gene contains a typical TATA box in the 5'-flanking
      region, but the 5'-untranslated region of the rabbit gene contains a unique purine-rich sequence,
      GGGACAG(G/A), repeated nine times in tandem, with an additional two within the 5'-flanking sequence.
suggested_questions:
- question: 'For the PAINT curators of PTHR32288: the GO:0019915 lipid storage IBD at PTN000792756, added
    2025-06-24, has a single seed - the human gene''s own IMP from one transient transfection of Huh-7
    cells (PMID:18809223) - and it now propagates intracellular lipid storage to eleven eutherian orthologues
    of a secreted plasma apolipoprotein. Is that the intended reach for an overexpression phenotype in
    a transformed line, given that the same paper''s main finding is what regulates APOC4 rather than
    what APOC4 does?'
- question: 'For GOC and MGI jointly: human APOC4 carries GO:0034361 twice over by orthology (GO_REF:0000107
    from mouse Q61268) while mouse Apoc4 carries the reciprocal transfer from human ENSP00000468236, and
    the single experimental annotation underlying both is the same IDA from PMID:12700345. Is there value
    in a Compara transfer whose donor''s evidence is the same publication as the recipient''s own direct
    annotation, and should such reciprocal pairs be suppressed?'
- question: 'For UniProt and GOA: rabbit APOC4 (P55057) has five GO annotations, all IEA, yet it is the
    species where apoC-IV was purified, shown to form discoidal micelles with phosphatidylcholine, localised
    to VLDL and HDL, and shown to be secreted (PMID:8576182). Could this paper be curated to P55057? It
    would give PTN000792756 its only non-human, non-overexpression descendant evidence.'
- question: 'For IntAct: all 23 GO:0005515 rows on APOC4 come from HuRI, and none of the 23 partners has
    a curated secreted or extracellular location while ten are mitochondrial. For a protein whose mature
    form exists only outside the cell, is there a case for withholding GO protein-binding annotations
    from nuclear-compartment two-hybrid data unless an orthogonal assay in a compatible compartment supports
    them?'
- question: 'For the GO ontology editors: GO:0005319 was renamed to ''lipid carrier activity'' in February
    2026 and now carries ''apolipoprotein'' as a narrow synonym, having absorbed several obsoleted apolipoprotein
    terms. Is a single term the right granularity for a class that spans apoB (structural, non-exchangeable),
    the exchangeable apoCs, and intracellular lipid-transfer proteins, or would a child term for exchangeable
    apolipoprotein surface residence be useful?'
suggested_experiments:
- description: Make the loss-of-function measurement that does not exist. Generate an Apoc4 knockout mouse,
    or an AAV8-delivered hepatocyte-specific knockdown in adult mice, and measure fasting and post-prandial
    plasma triglyceride, VLDL triglyceride secretion rate by Poloxamer-407 block, and VLDL turnover by
    labelled-particle clearance. The prediction from every existing gain-of-function result is lower plasma
    triglyceride and faster VLDL clearance; a null result at endogenous expression would be equally informative
    and would argue that the current process annotations describe overexpressed protein.
- description: Test the apoE-displacement mechanism directly. Reconstitute triglyceride-rich particles
    of defined composition, titrate purified recombinant apoC-IV onto them, and measure apoE occupancy
    by immunoblot and particle binding to immobilised LDLR and LRP1 ectodomains by surface plasmon resonance.
    Run apoC-I as the positive control, since the displacement model was established there. This distinguishes
    a specific molecular function from non-specific surface crowding, and only the former would justify
    a receptor-binding-regulator annotation.
- description: 'Convert the proposed ISS phospholipid-binding annotation into an IDA on the human protein.
    Express and purify the mature human apoC-IV chain, in both the glycosylated and unglycosylated forms,
    and run the standard exchangeable-apolipoprotein panel: DMPC clearance kinetics, discoidal complex
    formation assayed by native gel and negative-stain electron microscopy, and circular dichroism before
    and after lipid addition to measure helix induction. Rabbit apoC-IV is the built-in positive control,
    since the assay has already been run on it.'
- description: Settle whether the human-versus-rabbit abundance difference is transcriptional. Clone the
    human and rabbit APOC4 promoters, including the rabbit purine-rich repeat and a version with it deleted,
    into matched luciferase reporters and assay them in the same human and rabbit hepatocyte lines. Pair
    this with quantitative measurement of apoC-IV protein and mRNA in matched liver samples from both
    species, so that transcription rate, transcript abundance and plasma protein concentration can be
    compared on the same axis.
- description: Replace the 23 two-hybrid interactions with partners that exist in plasma. Immunoprecipitate
    native apoC-IV from human plasma, and separately from isolated VLDL and HDL fractions, using an antibody
    raised against the mature chain, and identify co-eluting proteins by mass spectrometry in normolipidaemic
    and hypertriglyceridaemic donors. The other apoCs and apoE serve as the internal positive control,
    since they are known to share the same particles, and any reproducible non-apolipoprotein partner
    would be the first physiologically plausible interaction for this protein.
