id: P55056
gene_symbol: APOC4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Apolipoprotein C-IV is a small, liver-secreted plasma apolipoprotein and the fourth and
  least abundant member of the low-molecular-weight apoC group. It is encoded within the APOE/APOC1/APOC4/APOC2
  cluster on chromosome 19, immediately upstream of APOC2 and in the same transcriptional orientation,
  and is translated as a 127-residue precursor whose 27-residue signal peptide is cleaved to give a 100-residue
  mature chain carrying an N-glycosylation site at Asn-63. In plasma the protein circulates as two major
  glycoforms, both variably sialylated. No experimental structure has been determined for apoC-IV in any
  species, but the sequence has the architecture of an exchangeable apolipoprotein - predicted amphipathic
  helices that would lie on the phospholipid monolayer of a lipoprotein particle rather than fold into
  a globular domain - and the rabbit orthologue forms discoidal complexes with phosphatidylcholine in
  vitro.


  More than 80% of plasma apoC-IV rides on very-low-density lipoprotein, where it accounts for about 0.7%
  of total apoVLDL protein, with most of the remainder on high-density lipoprotein; the same distribution
  is seen in monkey and mouse plasma and in rabbit, where the protein is far more abundant. Its plasma
  concentration, which is roughly an order of magnitude below that of apoC-I, apoC-II and apoC-III, rises
  in proportion to plasma triglyceride. Raising apoC-IV experimentally raises triglyceride: mice carrying
  a human apoC-IV transgene become hypertriglyceridaemic with the excess triglyceride in VLDL, and coding
  polymorphisms in the human gene associate weakly with plasma triglyceride. The mechanism proposed for
  this is displacement of apolipoprotein E from the particle surface, slowing hepatic clearance, rather
  than any effect on lipoprotein lipase, but it has not been measured for apoC-IV directly. APOC4 transcription
  is induced by the liver X receptors NR1H2 and NR1H3, which act on the APOE/APOC1/APOC2/APOC4 cluster
  in macrophages, and in hepatocytes by PPAR-gamma/RXR-alpha together with Ku antigen; the transcript
  rises in steatotic and hepatitis C virus-infected liver.


  Beyond this the protein is genuinely uncharacterised. There is no loss-of-function model in any species,
  no measured receptor or enzyme partner, and no reconstituted mechanism, so what apoC-IV contributes
  to lipoprotein metabolism at its native concentration remains open.'
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The PAINT/IBA methods reference for the four phylogenetic rows. Traced to the actual
      IBD assertions in interpro/panther/PTHR32288/PTHR32288-paint.tsv rather than taken on trust; node,
      seeds, taxon and dates are recorded in each row's propagation_review.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The UniProt subcellular-location-to-GO mapping reference. The source term SL-0243 was
      resolved to 'Secreted' against the UniProt locations service, and the underlying keyword is independently
      supported by isolation of the protein from plasma.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl
    Compara
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: The Ensembl Compara ortholog-transfer reference. Correctly applied - the donor really
      is the mouse orthologue - but in this instance it re-derives a term the target already holds by
      direct experiment from the same publication, which is why the row's propagation_review records EVIDENCE_CIRCULAR_OR_REDUNDANT.
- id: PMID:10996355
  title: DNA sequence variation in human apolipoprotein C4 gene and its effect on plasma lipid profile.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The APOC4 coding-variant study cited in UniProt for VAR_012081, VAR_012082 and VAR_012068.
      Abstract-only in cache; verified that the triglyceride association is reported for Leu36Pro and
      Leu96Arg in women specifically. Graded MEDIUM because the effect is small - a later review puts
      APOC4 variation at about 2% of plasma triglyceride variance - and because the paper itself frames
      the functional role as unknown. The verbatim quote used here retains the original's typographical
      error ('reveled'). Cited by the affinage report.
- id: PMID:12700345
  title: 'Human apoC-IV: isolation, characterization, and immunochemical quantification in plasma and
    plasma lipoproteins.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The decisive experimental paper for this gene and the anchor of the review. Cached
      abstract only (full_text_available: false), but the abstract itself carries the quantitative claims
      used here: purification of human apoC-IV from apoVLDL, identification by microsequencing four tryptic
      peptides, the >80% VLDL / remainder HDL distribution, and the 0.1-1.9 mg/dl concentration range
      tracking plasma triglyceride. It also supplies the mouse-plasma observation that grounds the MGI:87878
      IBA donor. Absent from the affinage report.'
- id: PMID:17154273
  title: Proteomic analysis of human very low-density lipoprotein by two-dimensional gel electrophoresis
    and MALDI-TOF/TOF.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Independent 2-DE/MALDI-TOF-TOF confirmation that apoC-IV is present on human VLDL, in
      three isoforms. Abstract-only in cache; the abstract states the identification explicitly. Its main
      subject is the VLDL proteome generally rather than apoC-IV, so it corroborates rather than establishes.
      Absent from the affinage report.
- id: PMID:18809223
  title: Expression of apolipoprotein C-IV is regulated by Ku antigen/peroxisome proliferator-activated
    receptor gamma complex and correlates with liver steatosis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Full text available and read. Correctly cited for the GO:0019915 IMP: the ApoC-IV transfection
      experiment and its 2.7-fold triglyceride increase are real and statistically supported. The relevance
      grade is MEDIUM rather than HIGH because the paper is principally about what regulates APOC4 transcription
      (HCV core protein, Ku antigen, PPARgamma/RXRalpha) rather than about APOC4''s own function; APOC4
      is the readout in most of it. Absent from the affinage report.'
- id: PMID:31722659
  title: Gain and loss events in the evolution of the apolipoprotein family in vertebrata.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available. Vertebrate-wide phylogeny of the apolipoprotein family, cited for
      the single claim that apoC-IV arose in Eutheria - which independently corroborates the taxon:9347
      placement of the PAINT node PTN000792756 and the family taxonomic span computed here. The paper
      is a comparative-genomics survey, not an experimental study of apoC-IV, and is used for nothing
      else. Absent from the affinage report.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'HuRI, the CCSB yeast two-hybrid reference interactome. Correctly cited - the 23 APOC4
      GO:0005515 rows really do come from it - but it is a maximal-projection reference: a full QuickGO
      export returns 85,343 annotations over 6,769 gene products, 84,937 of them GO:0005515. Full text
      read to confirm the assay (Y2H, Gal4 fusions) and the single-screen caveat. Not miscited; simply
      uninformative about this gene, which is why relevance is LOW rather than the correctness flag being
      set.'
- id: PMID:32844720
  title: High-Density Lipoprotein Carries Markers That Track With Recovery From Stroke.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text available. A second, independent human HDL proteomic dataset in which APOC4
      is among the HDL cargo proteins measured. Used only as corroboration that apoC-IV is detectable
      on HDL; the paper's stroke-recovery correlations are not used and support no annotation here. Absent
      from the affinage report.
- id: PMID:36173828
  title: Differences in HDL-Bound Apolipoproteins in Patients With Advanced Liver Fibrosis Due to Nonalcoholic
    Fatty Liver Disease.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text available and read. Independent human HDL proteomics detecting ApoC-IV as
      an HDL-bound apolipoprotein, used here to corroborate the GO:0034364 rows, which otherwise rest
      on one clause of one 2003 abstract. Its own subject is NAFLD fibrosis rather than apoC-IV; it states
      it found no prior reports on apoC-IV in liver disease. Absent from the affinage report.
- id: PMID:37226733
  title: Quartet of APOCs and the Different Roles They Play in Diabetes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text available and read; a 2023 review of the four apoCs. Secondary source, cited
      here for statements it makes explicitly and that no primary paper on apoC-IV makes: the supraphysiological-dose
      caveat on the transgenic result, the apoE-displacement mechanism and its explicit contrast with
      a lipase effect, the order-of-magnitude abundance gap, and the field''s own assessment that almost
      nothing is known about APOC4. Because it is a review, the mechanistic claims it reports are treated
      as hypotheses and are deliberately not annotated. Absent from the affinage report.'
- id: PMID:8530039
  title: Identification and characterization of a new human gene (APOC4) in the apolipoprotein E, C-I,
    and C-II gene locus.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The gene-identification paper, correctly cited by both TAS rows. Its contribution is
      sequence-level prediction - 127 residues, a putative 25-residue signal peptide (UniProt now places
      the cleavage after residue 27 by similarity to the rabbit protein), two potential amphipathic helices
      - plus the locus structure and the observation that apoC-IV mRNA is low in human liver. TAS is the
      right evidence code for it. This is the paper the affinage report leads with.
- id: PMID:8576182
  title: Identification, characterization, cloning, and expression of apolipoprotein C-IV, a novel sialoglycoprotein
    of rabbit plasma lipoproteins.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The rabbit apoC-IV characterisation, and the only direct lipid-binding measurement anywhere
      in this family. Abstract-only in cache; the abstract states the discoidal-micelle result, the VLDL/HDL
      association, liver-restricted expression, secretion from transfected cells and the mammalian conservation
      claim. Basis of the proposed ISS row. Absent from the affinage report, and - more consequentially
      - absent from the GO record for P55057 entirely.
- id: PMID:8827523
  title: Expression of a novel human apolipoprotein (apoC-IV) causes hypertriglyceridemia in transgenic
    mice.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The transgenic-mouse study behind two IMP rows. Abstract-only in cache. Verified that
      its own abstract states the lipid-binding conclusion and the hypertriglyceridaemia phenotype, and
      also the earlier negative - apoC-IV not detectable in normal adult human plasma by immunoblot -
      which PMID:12700345 later superseded. Graded here as gain-of-function evidence at supraphysiological
      dose rather than as evidence about endogenous protein. Absent from the affinage report.
- id: Reactome:R-HSA-8854408
  title: APOBR dimer binds VLDLs
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Cached Reactome reaction 'APOBR dimer binds VLDLs'. APOC4 participates as a VLDL constituent;
      supports only the extracellular-region assignment. Verified that the cached summary is about VLDL
      and macrophage APOBR as the display name states.
- id: Reactome:R-HSA-8854462
  title: VLDLR binds VLDL
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Cached Reactome reaction 'VLDLR binds VLDL'. Its summary names APOC4 explicitly as a
      minor VLDL constituent and cites Kotite et al. 2003, the same primary evidence as the IDA row, so
      this is not a generic pathway projection.
- id: Reactome:R-HSA-8866321
  title: VLDL binds APOC1 and APOC4
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached Reactome reaction 'VLDL binds APOC1 and APOC4' - the one Reactome event in which
      APOC4 is the acting participant rather than a bystander component, again citing Kotite et al. 2003.
- id: Reactome:R-HSA-9035279
  title: Expression of APOC4 regulated by NR1H2 or NR1H3
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Cached Reactome event 'Expression of APOC4 regulated by NR1H2 or NR1H3'. A gene-expression
      event; it records that liver X receptors induce the APOE/APOC1/APOC2/APOC4 cluster in macrophages,
      which is about APOC4 regulation rather than APOC4 function, and supports only the extracellular-region
      assignment for the product.
- id: file:human/APOC4/APOC4-bioinformatics/RESULTS.md
  title: APOC4 (P55056) - bioinformatics support for the annotation review
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Bioinformatics performed for this review. Two live analyses: the taxonomic span of
      PTHR32288, which corroborates the Eutheria placement of the PAINT node, and a hydrophobic-moment
      scan of mature chains, which places human apoC-IV inside the exchangeable-apolipoprotein band. Both
      fetch inputs at run time and assert on them; neither is an experiment, and RESULTS.md says so explicitly
      where it matters.'
- id: file:human/APOC4/APOC4-deep-research-affinage.md
  title: Affinage mechanistic annotation for APOC4 (human)
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'Trust gates cleared (.affinage.log records ''APOC4: trust gates clear''), faith_pct
      100.0, self_evaluation_pairwise empty, and the narrative describes the correct protein with no symbol
      collision - so no LOW_QUALITY flag is warranted on correctness. Its problem is recall, not accuracy:
      its four citations are PMID:8530039, PMID:10996355, PMID:29580721 and PMID:33705959, so it missed
      every paper that measured the protein: none of its citations is among the four references (PMID:12700345,
      PMID:8827523, PMID:18809223, PMID:17154273) behind all six of APOC4''s experimental GOA rows outside
      the 23-row HuRI two-hybrid set. Its mechanism_profile is empty, so no GO grounding was available
      to import even had that been appropriate. Cited here for provenance only; no claim in this review
      rests on it.'
- id: file:human/APOC4/APOC4-uniprot.txt
  title: UniProtKB P55056 (APOC4_HUMAN) flat file
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The machine-fetched UniProtKB flat file for P55056. Confirmed to be the expected entry
      (APOC4_HUMAN, reviewed, 127 aa) and not a merged redirect. Used for the signal peptide boundary,
      the N-glycosylation site, the secreted location, the liver-and-plasma tissue specificity, and the
      PANTHER family assignment. Its FUNCTION line is a single hedged sentence, which is itself informative
      about the state of knowledge.
existing_annotations:
- term:
    id: GO:0005319
    label: lipid carrier activity
  evidence_type: TAS
  original_reference_id: PMID:8530039
  qualifier: enables
  review:
    summary: Apolipoprotein C-IV binds lipid and rides on plasma lipoprotein particles. The cited 1995
      paper is prediction-level - it inferred the activity from two potential amphipathic alpha-helical
      domains in the translated sequence and from hepatic expression [PMID:8530039] - but the claim has
      since been made experimentally. Transgenic expression of the human protein gave what its authors
      called unequivocal evidence that apoC-IV is a lipid-binding protein of the apolipoprotein family
      [PMID:8827523], the rabbit orthologue forms discoidal micelles with phosphatidylcholine [PMID:8576182],
      and the human protein was isolated from plasma VLDL by microsequencing [PMID:12700345].
    action: ACCEPT
    reason: 'GO:0005319 is the designated apolipoprotein molecular function. Its definition - ''Directly
      binding to a specific lipid and delivering it either to an acceptor molecule or to a specific location''
      - was checked against QuickGO, as was its history: the term was renamed from ''lipid transporter
      activity'' to ''lipid carrier activity'' on 2026-02-09 and carries ''apolipoprotein'' and ''lipophorin''
      as narrow synonyms. Its replaces list covers the obsoleted GO:0005321 and GO:0005323 - the old high-density
      and very-low-density lipoprotein molecular-function terms - and it is the ''consider'' target for
      the obsoleted GO:0005320 ''apolipoprotein''. APOE and APOA1 carry it by IDA and IEA respectively.
      TAS is the honest code for a 1995 author inference, and the inference turned out to be right, so
      the row stands as written rather than being weakened to a bare lipid-binding term. Independently,
      a hydrophobic-moment scan of the mature chain places APOC4 inside the exchangeable-apolipoprotein
      band and well clear of globular controls (file:human/APOC4/APOC4-bioinformatics/RESULTS.md).'
    additional_reference_ids:
    - PMID:8827523
    - PMID:8576182
    - PMID:12700345
    - file:human/APOC4/APOC4-bioinformatics/RESULTS.md
    supported_by:
    - reference_id: PMID:8530039
      supporting_text: The predicted apoC-IV protein sequence, comprising 127 amino acid residues, contains
        a putative 25-residue signal peptide and two potential amphipathic alpha-helical domains.
    - reference_id: PMID:8827523
      supporting_text: our analysis of transgenic mice provides unequivocal evidence that human apoC-IV
        is a lipid-binding protein belonging to the apolipoprotein family and that it has the potential
        to alter lipoprotein metabolism.
    - reference_id: PMID:8576182
      supporting_text: It contains two potential amphipathic helices characteristic of plasma apolipoproteins
        and forms discoidal micelles with phosphatidylcholine.
    - reference_id: file:human/APOC4/APOC4-bioinformatics/RESULTS.md
      supporting_text: 'Human apoC-IV sits at 0.0300 — inside the

        apolipoprotein band, between APOC2/C3 (0.0253) and APOC1 (0.0351), about three

        times the controls (2.97–3.12×), and differing by 0.0009 from rabbit apoC-IV

        (0.0309)'
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:P07204
  review:
    summary: Binary yeast two-hybrid interaction with THBD (Thrombomodulin), reported only in the HuRI
      reference interactome [PMID:32296183]. UniProt curates THBD to Membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'All 23 GO:0005515 rows on APOC4 come from one reference, PMID:32296183 (HuRI), a systematic
      yeast two-hybrid screen. A full QuickGO export for that reference returns 85,343 annotations across
      6,769 distinct gene products, 84,937 of them GO:0005515 - this is a maximal-projection reference,
      and APOC4''s 23 rows are 23 of those. Resolving all 23 partners in UniProt, none has a curated Secreted
      or Extracellular subcellular location, 10 are curated mitochondrial and 10 carry a transmembrane
      segment (file:human/APOC4/APOC4-bioinformatics/RESULTS.md). Two points follow, and they are not
      equally firm. The firm one does not depend on any partner''s membrane topology: not one of the 23
      is a plasma protein of the kind apoC-IV actually encounters, and every pair was scored by a Gal4
      two-hybrid, which reports interactions reconstituted in the yeast nucleus - a compartment APOC4''s
      mature chain cannot occupy at all. The softer one is each partner''s own compartment, and it is
      graded rather than blanket: strongest for the ten curated mitochondrial partners, weakest for the
      ER- and Golgi-membrane ones, because APOC4 does transit those organelles on its way out of the hepatocyte
      and the argument then turns on which face of the membrane the partner works on - which is not settled
      for every partner here. Where that per-partner point is strong it is made in the row itself. HuRI
      itself notes that most of its pairs were seen in a single screen, and no functional follow-up exists
      for any APOC4 pair; the NbExp=3 shown against each of these pairs in the UniProt INTERACTION block
      is HuRI''s own screen-and-retest count from this one publication, not three independent studies.
      Per project policy an experimental row is not removed on this basis; the term is also uninformative,
      and there is no better MF to MODIFY it to, so it is marked as over-annotated. THBD is the one partner
      of the 23 with a cleaved signal peptide, and as a single-pass type I membrane protein it does present
      an extracellular domain to flowing blood, so an encounter with a plasma apolipoprotein is not topologically
      absurd the way it is for the mitochondrial partners. But that topology is precisely what a Gal4
      two-hybrid assay in the yeast nucleus cannot test, and no follow-up experiment has examined an APOC4-THBD
      interaction in plasma or on endothelium.'
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: yeast two-hybrid (Y2H) represents the only binary PPI assay that can be operated
        at sufficient throughput to systematically screen the human proteome for binary PPIs
    - reference_id: PMID:32296183
      supporting_text: the majority of PPIs in HuRI were found in only one screen
    - reference_id: file:human/APOC4/APOC4-uniprot.txt
      supporting_text: FT   SIGNAL          1..27
