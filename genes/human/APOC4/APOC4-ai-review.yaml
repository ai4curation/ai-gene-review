    action: KEEP_AS_NON_CORE
    reason: 'This is a genuine, statistically supported gain-of-function result and BHF-UCL coded it conservatively.
      It is retained. But it is a single ectopic overexpression in a transformed line: there is no knockdown
      of APOC4 itself anywhere in the paper (the silencing experiments target Ku70), no loss-of-function
      model for APOC4 in any species, and the in vivo evidence is a correlation. The bulk of the paper
      establishes what controls APOC4 expression rather than what APOC4 does. Intracellular lipid droplet
      accumulation is also hard to reconcile mechanistically with a protein whose mature form is secreted
      into plasma, which is a further reason to treat it as peripheral until a physiological-dose experiment
      exists.'
