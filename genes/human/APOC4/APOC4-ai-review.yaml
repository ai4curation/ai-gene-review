core_functions:
- description: 'Phospholipid-surface binding through amphipathic helices - the step by which apoC-IV attaches
    to and remains on a plasma lipoprotein particle. No experimental structure of apoC-IV exists in any
    species; like the other exchangeable apolipoproteins it is built from helical segments with a hydrophobic
    face that inserts into the phospholipid monolayer of the particle and a polar face that stays in contact
    with plasma. The rabbit orthologue demonstrates the activity directly, forming discoidal complexes
    with phosphatidylcholine, and the human mature chain has the same architecture: a hydrophobic-moment
    scan puts its density of high-moment segments at 0.0300 per residue, 0.0009 from the rabbit protein
    and 0.0021 from APOA1, and about three times that of globular controls, with no overlap between the
    apolipoprotein and globular groups. This is the molecular event that makes everything else about the
    protein possible, and it is the reason apoC-IV is recovered with particles rather than as free plasma
    protein.'
