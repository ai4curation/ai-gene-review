  original_reference_id: PMID:18809223
  qualifier: acts_upstream_of
  review:
    summary: Transient transfection of the APOC4 cDNA into Huh-7 hepatoma cells produced lipid droplets
      in the cytoplasm and perinuclear space and raised cell triglyceride roughly 2.7-fold after correcting
      for a 40% transfection efficiency [PMID:18809223]. In the same study APOC4 transcript level correlated
