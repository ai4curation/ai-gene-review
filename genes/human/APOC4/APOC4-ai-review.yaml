  review:
    summary: 'Proposed new molecular function. After review, APOC4''s only molecular-function row that
      survives as informative is GO:0005319 lipid carrier activity, which states the role but not the
      binding step that underlies it. The binding step has been measured, on the rabbit orthologue: apoC-IV
      ''contains two potential amphipathic helices characteristic of plasma apolipoproteins and forms
      discoidal micelles with phosphatidylcholine'' [PMID:8576182]. Discoidal-complex formation with phosphatidylcholine
      is the classical demonstration that an exchangeable apolipoprotein binds and solubilises phospholipid.
      The rabbit and human proteins are the same PANTHER family and subfamily (PTHR32288:SF0), the gene
      is ''highly conserved during mammalian evolution'' [PMID:8576182], and a hydrophobic-moment scan
      places the human mature chain 0.0009 segments per residue from the rabbit protein and 0.0021 from
      APOA1, inside an exchangeable-apolipoprotein band that does not overlap the globular controls (file:human/APOC4/APOC4-bioinformatics/RESULTS.md).'
    action: NEW
    reason: 'Coded ISS with the rabbit orthologue as the supporting entity, deliberately not IDA or IMP:
      the discoidal-micelle measurement is on P55057, not on the human protein, and the sequence analysis
      done here is a statistic rather than an assay. GO:0005543 ''Binding to a phospholipid'' is the right
      level - phosphatidylcholine binding (GO:0031210) would over-specify from a single lipid used in
      one reconstitution, and lipid binding (GO:0008289) would lose the information that the ligand is
      the particle''s phospholipid monolayer. APOC3 carries GO:0005543 by IDA and IBA and APOA1 by IDA
      and IBA, so this places apoC-IV at the same resolution as its characterised relatives. The annotation
      also fills a real gap: without it the mechanism by which apoC-IV stays on a lipoprotein surface
      is unrepresented in GO. One ordering caveat, stated because it affects how the row should be actioned:
      under GOA''s ISS convention the WITH/FROM source is expected to carry the transferred term experimentally,
      and P55057 currently carries no experimental GO annotation of any kind. This row is therefore contingent
      on PMID:8576182 first being curated to P55057 - the curation request recorded here as a CURATION
      knowledge gap and as a suggested question. The measurement exists; it is the GO record of it that
      does not yet.'
