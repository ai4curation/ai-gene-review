ontology_boundaries:
  GO:0046578: Ras-subfamily regulation does not encompass Rag solely because Rag belongs to the broader
    Ras superfamily. Empirical replacement is GO:1904263.
  GO:0035556: Replacement with GO:1904263 uses combined experimental evidence; no unsupported formal child
    path is asserted.
  GO:0032006: Both retained positive TORC1 and contextual negative TOR terms have verified ancestry to
    broad TOR regulation.
  GO:0045892: The retained GO:0000122 RNA polymerase II repression term is a verified is_a child.
  GO:1902532: Negative Rho signaling GO:0035024 is_a GO:0051058 is_a GO:1902532. Positive Rag function
    does not refute the negative Rho branch.
  locations: GO:0072686 mitotic spindle refines spindle; cytosol and lysosomal membrane refine broad cytoplasm.
    The informative lysosome organelle term is retained under the root-organelle exception.
interaction_scope: The 20 generic-binding rows preserve exact partner/source contexts. Bounded official
  IntAct queries returned records but no exact requested PMID/partner joins; this absence is not a refutation.
  Actual primary interaction assays and independent same-pair evidence support retention. Co-complex association
  is not automatically binary contact.
