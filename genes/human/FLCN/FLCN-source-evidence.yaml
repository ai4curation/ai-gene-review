  audit_access: selected actual primary Methods/Results/captions or Discussion, including independent
    consultations
  scope: Separate Bhd-null allele developmental findings and late mouse renal lesions were studied. Actual
    human BHD tumors show increased AKT protein/phosphorylation without matched mRNA elevation. Several
    Methods defer to uninspected supplementary protocols. This is not the current mouse donor for embryo/hemopoiesis
    rows.
- reference_id: PMID:18182616
  title: 'Kidney-targeted Birt-Hogg-Dube gene inactivation in a mouse model: Erk1/2 and Akt-mTOR activation,
    cell hyperproliferation, and polycystic kidneys.'
  normal_cache: publications/PMID_18182616.md
  normal_sha256: 62173b2efe1a8ac024636c71b679fb04395b52b0c6414385cb53c8ba63ea29b4
  normal_full_text_available: false
  audit_access: selected actual primary Methods/Results/captions or Discussion, including independent
    consultations
  scope: Selected original Results/captions show increased Raf/MEK/ERK and Akt readouts in a postnatal
    kidney-specific mouse knockout. This supports contextual regulation, not direct kinase inhibition;
    rapamycin is not claimed to specifically rescue Akt or ERK signaling.
- reference_id: PMID:18974783
  title: Deficiency of FLCN in mouse kidney led to development of polycystic kidneys and renal neoplasia.
  normal_cache: publications/PMID_18974783.md
  normal_sha256: c5cedb8fcde45134f8cb95c1fc6d06b4ddff57a51ae1a57d5e57d4441ea813fb
  normal_full_text_available: true
  audit_access: selected actual primary Methods/Results/captions or Discussion, including independent
    consultations
  scope: Actual mouse kidney knockout Results and rapamycin experiments support renal hyperproliferation/pathology
    and contextual TOR regulation. They do not make FLCN a direct mTOR inhibitor or establish a universal
    signaling direction.
- reference_id: PMID:21258407
  title: Loss of the Birt-Hogg-Dubé tumor suppressor results in apoptotic resistance due to aberrant TGFβ-mediated
    transcription.
  normal_cache: publications/PMID_21258407.md
  normal_sha256: 0e8d493a9a72994b4db95754e21bf507e76494ac6c15a91d6c6ce1e49b009e0b
  normal_full_text_available: true
  audit_access: selected actual primary Methods/Results/captions or Discussion, including independent
    consultations
  scope: Mouse embryo/ES-cell differentiation, Bim and TGF-beta response experiments support contextual
    development, hemopoiesis and apoptosis. E6.5 abnormal embryos were not individually genotyped. Hemoglobinized
    colonies/Gata1/CD34 are differentiation readouts; CD34 is not HSC-specific. Persistent nuclear phosphorylated
    Smad, deficient promoter acetylation and HDAC-inhibitor response do not demonstrate a TFE3 mechanism.
    Apoptosis rescue is not an embryoid-body rescue.
- reference_id: PMID:22709692
  title: The folliculin-FNIP1 pathway deleted in human Birt-Hogg-Dubé syndrome is required for murine
    B-cell development.
  normal_cache: publications/PMID_22709692.md
  normal_sha256: 9a10336ac155bd5450bccf2780e12ea6f9ddb6e132140e8c2627bc4180d57c9e
  normal_full_text_available: true
  audit_access: selected actual primary Methods/Results/captions or Discussion, including independent
    consultations
  scope: Conditional adult ubiquitous CreER-mediated Flcn deletion directly produces pro-B arrest and
    peripheral B-cell loss. Most mechanistic transplantation, receptor/V(D)J, caspase, Bcl2 and rapamycin
    experiments concern Fnip1. Retention of the Flcn phenotype does not transfer those partner rescue
    results or resolve survival/differentiation/autonomy.
- reference_id: PMID:23150719
  title: Regulation of mitochondrial oxidative metabolism by tumor suppressor FLCN.
  normal_cache: publications/PMID_23150719.md
  normal_sha256: 5a6c0fc077c3569e3b0b642661efedb38a061dedc0c9d58511124d8abf1e913a
  normal_full_text_available: false
  audit_access: selected actual primary Methods/Results/captions or Discussion, including independent
    consultations
  scope: Separately recovered original Methods/Results support mouse muscle metabolic remodeling and Ppargc1a
    codeletion, plus inducible full-length FLCN restoration with controls in human UOK257. Kidney rescue
    is partial and is not demonstrated prevention of malignant tumors. These data do not localize FLCN
    to mitochondria or make it an OXPHOS enzyme.
- reference_id: PMID:27913603
  title: The tumor suppressor FLCN mediates an alternate mTOR pathway to regulate browning of adipose
    tissue.
  normal_cache: publications/PMID_27913603.md
  normal_sha256: 320211eddb8e7e2c00b14739bd59ae2a8c8c200ae460fe3326ef2c8ecb56ed4e
  normal_full_text_available: true
  audit_access: selected actual primary Methods/Results/captions or Discussion, including independent
    consultations
  scope: Mouse adipose Flcn/Tfe3 epistasis supports the Rag-TFE3-PGC1beta program. This is distinct from
    PMID27151976 AMPK-PGC1alpha-ERRalpha and does not establish a universal human lineage-commitment mechanism.
- reference_id: PMID:27072130
  title: Tumor Suppressor Folliculin Regulates mTORC1 through Primary Cilia.
  normal_cache: publications/PMID_27072130.md
  normal_sha256: f25ec2ad6b4a2baf1591bbbb3982c1ee59db15094affefeb51f0fe54beaa335e
  normal_full_text_available: true
  audit_access: selected actual primary Methods/Results/captions or Discussion, including independent
    consultations
  scope: Actual human flow/no-flow and LKB1/AMPK/TSC2 experiments support ciliary, context-dependent suppression
    of mTORC1. The proposed FLCN-mediated LKB1 recruitment model is a hypothesis, not a demonstrated transport
    activity. This negative context coexists with positive Rag/TFEB regulation.
