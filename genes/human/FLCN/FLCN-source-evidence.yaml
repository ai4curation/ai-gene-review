- reference_id: PMID:23784378
  title: Birt-Hogg-Dube syndrome is a novel ciliopathy.
  normal_cache: publications/PMID_23784378.md
  normal_sha256: 95000daf3ae95fe3be8e064190ea0dd79c66bebcf3ec4859aede56994d8b6fbf
  normal_full_text_available: false
  audit_access: selected actual primary Methods/Results/captions or Discussion, including independent
    consultations
  scope: Selected actual original Methods/Results identify human EGFP-FLCN in MDCK centrosome experiments,
    separate endogenous mouse IMCD3 observations, human HK2 spindle/cilium and nasal cilium observations.
    Approximately 50% HK2 knockdown delays rather than abolishes ciliogenesis. Residual wild-type FLCN
    concerns this paper's UOK257 stock only, not every other study. No figure pixels or supplements were
    independently inspected.
- reference_id: PMID:24081491
  title: Recruitment of folliculin to lysosomes supports the amino acid-dependent activation of Rag GTPases.
  normal_cache: publications/PMID_24081491.md
  normal_sha256: b20ce2a850a510be76a0433e185183cf6af028b8a433ff9804d994dccd486265
  normal_full_text_available: true
  audit_access: selected actual primary Methods/Results/captions or Discussion, including independent
    consultations
  scope: Overexpressed tagged and purified GST-FLCN constructs are mouse; recombinant Rags are human.
    Separate CRISPR tagging of endogenous human FLCN in HeLa, with other alleles frameshifted and specificity/function
    controls, supports dynamic localization. Nucleotide-free RagA-domain binding is not a GEF assay. Human
    depletion affects S6K/S6 in this context, so later selective TFEB results do not establish a universal
    S6K negative.
- reference_id: PMID:24095279
  title: The folliculin tumor suppressor is a GAP for the RagC/D GTPases that signal amino acid levels
    to mTORC1.
  normal_cache: publications/PMID_24095279.md
  normal_sha256: 39fd1a4b45217873277bcfd16c7a9391fbed0b869a6414c767989f07306affe6
  normal_full_text_available: true
  audit_access: selected actual primary Methods/Results/captions or Discussion, including independent
    consultations
  scope: Direct purified FLCN-FNIP2 GAP activity is specific for RagC/D under tested conditions; isolated
    subunits are inactive and no GEF/GDI was observed. Localization/Rag association respond to amino-acid
    availability. Later active structural states are not attributed to this paper.
- reference_id: PMID:25126726
  title: FLCN, a novel autophagy component, interacts with GABARAP and is regulated by ULK1 phosphorylation.
  normal_cache: publications/PMID_25126726.md
  normal_sha256: 1a6409efcdb637f6f7c1c046ca9521614b65ab8bd34644b76d796e67588ca013
  normal_full_text_available: true
  audit_access: selected actual primary Methods/Results/captions or Discussion, including independent
    consultations
  scope: Separately recovered original Methods/Results show HK2 basal autophagic-flux perturbation, LC3/chloroquine
    and SQSTM1 restoration, plus cell-lysate GST pull-down/coimmunoprecipitation. Binding is not purified
    binary FLCN-GABARAP proof. Kinase assays use immunoprecipitated ULK1 and HEK293-purified GST substrates;
    FLCN is a substrate. Ser406 versus Ser407 is ambiguous; triple-site mutation has partial effects and
    does not fully explain dissociation.
- reference_id: PMID:27113757
  title: Folliculin directs the formation of a Rab34-RILP complex to control the nutrient-dependent dynamic
