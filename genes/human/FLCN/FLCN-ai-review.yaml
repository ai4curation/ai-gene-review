- id: file:human/FLCN/FLCN-source-evidence.yaml
  title: FLCN source evidence, assay boundaries, phylogenetic replay and conservation policy
  findings: []
core_functions:
- description: Partner-dependent GTPase-activating activity for RagC/D in the FLCN-FNIP1/2 complex. FLCN
    supplies the catalytic Arg164 contribution, converting RagC/D toward the GDP-bound state that supports
    mTORC1 phosphorylation and cytoplasmic retention of TFEB/TFE3. Nutrient-dependent lysosomal recruitment,
    inhibitory-complex assembly and activation regulate this activity; effects on other mTORC1 substrates
    depend on cellular conditions.
  molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  directly_involved_in:
  - id: GO:1904263
    label: positive regulation of TORC1 signaling
  - id: GO:0034198
    label: cellular response to amino acid starvation
  locations:
  - id: GO:0005765
    label: lysosomal membrane
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:1990877
    label: FNIP-folliculin RagC/D GAP
  supported_by:
  - reference_id: PMID:24095279
    supporting_text: Moreover, we identified the FLCN-FNIP complex as a potent GTPase activating protein
      (GAP) for RagC/D that interacts with the Rag heterodimer in an amino acid-sensitive fashion and
      localizes to the lysosomal surface upon amino acid starvation.
  - reference_id: PMID:31672913
    supporting_text: First, we identified Arg164 of FLCN as a catalytically required arginine residue
      for GAP activity.
  - reference_id: PMID:31704029
    supporting_text: Furthermore, we identified the catalytic residue necessary for the GAP activity,
      which leads us to interpret our structure as an on-pathway intermediate.
  - reference_id: PMID:32612235
    supporting_text: Importantly, expression of active RagCS75L or RagDS77L mutants in FLCN KO cells rescued
      TFEB phosphorylation
  - reference_id: PMID:36103527
    supporting_text: Conversion between active and inactive states is regulated by the RagA/B-specific
      GAP, GAP activity towards Rags 1 (GATOR1), and by the RagC/D-specific GAP, FLCN:FLCN-interacting
      protein 2 (FNIP2)
  - reference_id: file:human/FLCN/FLCN-source-evidence.yaml
- description: Direct binding and uncompetitive inhibition of human LDHA, demonstrated with purified proteins
    and accompanied by reduced glycolytic activity in tested cells. This measured molecular capacity is
    distinct from the Rag GAP function; its physiological range and behavior at endogenous stoichiometry
    require further testing. Synthetic inhibitory-loop constructs are not natural FLCN products.
  molecular_function:
    id: GO:0160193
    label: L-lactate dehydrogenase inhibitor activity
  directly_involved_in:
  - id: GO:0045820
    label: negative regulation of glycolytic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:34381247
    supporting_text: Here, we identify the human tumor suppressor folliculin (FLCN) as a binding partner
      and uncompetitive inhibitor of LDHA.
  - reference_id: PMID:34381247
    supporting_text: Together, FLCN-mediated inhibition of LDHA provides a new paradigm for the regulation
      of glycolysis.
  - reference_id: file:human/FLCN/FLCN-source-evidence.yaml
suggested_questions:
- question: How broadly does the directly measured LDHA-inhibitory activity operate at endogenous FLCN:LDHA
    stoichiometry, independently of FNIP1/2 and Rag signaling?
- question: Which FLCN-dependent developmental and B-cell phenotypes reflect lineage-autonomous differentiation,
    survival or intercellular signals, and which mechanisms are conserved in humans?
- question: What is the chemistry of the unidentified higher-mass TFE3 modification suppressed by FLCN,
    distinct from the phosphorylation promoted by FLCN?
- question: Do the three natural FLCN products differ in partner assembly, localization and catalytic
    activity? Canonical Arg164 and synthetic-peptide results cannot establish the functions of the truncated
    products.
- question: Under which conditions does endogenous FLCN occupy a nuclear pool, and does that pool have
    an activity distinct from cytosolic/lysosomal signaling?
suggested_experiments:
- description: Compare endogenous-level wild-type and R164A FLCN restoration for RagC hydrolysis, TFEB
    localization, LDHA activity and lactate production, with independent FNIP and LDHA interaction controls.
  experiment_type: structure-function rescue
  hypothesis: LDHA inhibition and RagC/D GAP activity are separable molecular capacities.
- description: Combine lineage-restricted Flcn deletion with survival measurements, differentiation trajectories
    and matched restoration, testing TFEB/TFE3 dependence separately in each tissue.
  experiment_type: conditional genetics and rescue
  hypothesis: Distinct survival and differentiation mechanisms contribute to the contextual developmental
    phenotypes.
- description: Express sequence-verified natural FLCN products individually at matched levels and assay
    FNIP assembly, RagC/D turnover, LDHA inhibition and localization.
  experiment_type: product-resolved functional comparison
  hypothesis: Truncation and alternative sequence segments alter functions independently rather than retaining
    all canonical activities.
