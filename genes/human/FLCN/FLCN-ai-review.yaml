- term:
    id: GO:1990877
    label: FNIP-folliculin RagC/D GAP
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN002833743
  - PomBase:SPBC24C6.08c
  - SGD:S000003289
  - UniProtKB:Q8NFG4
  review:
    summary: FLCN forms a heterodimeric complex with FNIP1 or FNIP2 through their C-terminal DENN domains;
      this complex is the RagC/D GAP.
    action: ACCEPT
    reason: Core complex membership. Supported by FNIP1/FNIP2 interaction studies (PMID:17028174, PMID:18403135)
      and by the GAP biochemistry and structures of FLCN-FNIP2 (PMID:24095279, PMID:31704029, PMID:36103527).
      The IBA at PTN002833743 reflects conservation with the yeast Lst4-Lst7 complex. IBA from PAINT;
      FLCN (Q8NFG4) appears in its own WITH/FROM as experimental grounding for the node.
    supported_by:
    - *id042
    - *id043
    - &id044
      reference_id: PMID:36103527
      supporting_text: Conversion between active and inactive states is regulated by the RagA/B-specific
        GAP, GAP activity towards Rags 1 (GATOR1), and by the RagC/D-specific GAP, FLCN:FLCN-interacting
        protein 2 (FNIP2)
