- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2442184
  - PANTHER:PTN001265854
  - UniProtKB:Q8NFG4
  review:
    summary: FLCN loss increases TFE3/TFEB nuclear localization and transcription of their targets (e.g.
      GPNMB); FLCN restores repression in FLCN-null cells.
    action: KEEP_AS_NON_CORE
    reason: 'FLCN is not a DNA-binding or chromatin-associated transcription regulator. Its effect on
      RNA polymerase II transcription is indirect: its RagC/D GAP activity licenses mTORC1 phosphorylation
      of TFE3/TFEB, which retains them in the cytoplasm. The repression of MiT/TFE target genes is experimentally
      supported in human cells (PMID:21209915) and mouse, and the IBA reflects a PAINT decision at the
      vertebrate node PTN001265854, so the term is kept, but as a downstream consequence of the core GAP
      function rather than a core function. IBA from PAINT; FLCN (Q8NFG4) appears in its own WITH/FROM
      as experimental grounding for the node.'
    supported_by:
    - &id001
      reference_id: PMID:21209915
      supporting_text: Conversely, wildtype FLCN suppressed GPNMB expression in FLCN-null cells.
    - &id002
      reference_id: PMID:21209915
      supporting_text: FLCN inactivation was correlated with increased TFE3 transcriptional activity accompanied
        by its nuclear localization
    - &id003
      reference_id: PMID:24081491
      supporting_text: In this study, we show that FLCN regulates lysosome function by promoting the mTORC1-dependent
        phosphorylation and cytoplasmic sequestration of transcription factor EB (TFEB).
