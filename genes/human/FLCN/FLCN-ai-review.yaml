- term:
    id: GO:1905672
    label: negative regulation of lysosome organization
  evidence_type: IDA
  original_reference_id: PMID:34597140
  qualifier: involved_in
  review:
    summary: FLCN-dependent mTORC1 phosphorylation keeps TFEB/TFE3 cytoplasmic and so restrains lysosomal
      biogenesis; GABARAP sequestration or AMPK phosphorylation of FNIP1 relieves this restraint.
    action: KEEP_AS_NON_CORE
