  review:
    summary: Transferred from mouse; the source is PMID:21209915, where FLCN loss was associated with
      decreased TFE3 phosphorylation.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The source study shows the opposite direction: FLCN loss reduces TFE3 phosphorylation, so
