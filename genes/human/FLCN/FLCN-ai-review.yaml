- term:
    id: GO:0120163
    label: negative regulation of cold-induced thermogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8QZS3
  - ensembl:ENSMUSP00000099758
  review:
    summary: 'Transferred from mouse: adipose-specific Flcn knockout induces beige fat and resistance
      to cold exposure.'
    action: KEEP_AS_NON_CORE
    reason: Two independent mouse studies show adipocyte FLCN restrains the thermogenic/browning program
      through mTOR-dependent cytoplasmic retention of TFE3 and repression of PGC-1 (PMID:27151976, PMID:27913603).
      The mechanism runs through FLCN's core RagC/D-TFE3 axis, so the regulatory role is credible, but
      it is a tissue-specific downstream role shown only in mouse. Non-core for human.
    additional_reference_ids:
    - PMID:27913603
    supported_by:
    - &id037
      reference_id: PMID:27151976
      supporting_text: underlying the increased resistance of Adipoq-FLCN knockout mice to cold exposure
    - &id038
      reference_id: PMID:27913603
      supporting_text: Adipose-specific deletion of FLCN relieves mTOR-dependent cytoplasmic retention
        of TFE3, leading to direct induction of the PGC-1 transcriptional coactivators, drivers of mitochondrial
        biogenesis and the browning program.
