- term:
    id: GO:0001701
    label: in utero embryonic development
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8QZS3
  review:
    summary: Transferred from mouse, where Flcn-null embryos die at E5.5-E6.5 with visceral endoderm defects.
    action: MARK_AS_OVER_ANNOTATED
    reason: Embryonic lethality of the knockout shows that FLCN is necessary for development; it does
      not show that FLCN performs a step of embryonic development. The mouse donor annotation (Q8QZS3)
      is itself a phenotype-based IMP with the acts_upstream_of_or_within relation; the ISS/IEA transfer
      restates it as involved_in for human, which overstates what the knockout showed. The lethality is
      most plausibly a downstream consequence of unrestrained TFE3 activity and failed exit from pluripotency.
      No human evidence exists.
    additional_reference_ids:
    - PMID:19850877
    supported_by:
    - reference_id: PMID:19850877
      supporting_text: BHD homozygous null (BHD(d/d)) mice displayed early embryonic lethality at E5.5-E6.5,
        showing defects in the visceral endoderm.
