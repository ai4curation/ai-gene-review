    reason: The current mouse donor PMID:21258407 reports early embryo abnormalities and lethality together
      with yolk-sac and embryoid-body differentiation defects in Bhd-null ES cells. These developmental
      endpoints provide positive support for retaining the curated ortholog association as non-core, beyond
