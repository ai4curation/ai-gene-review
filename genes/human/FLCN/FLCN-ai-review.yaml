id: Q8NFG4
gene_symbol: FLCN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Folliculin (FLCN) is a 579-residue cytosolic protein with longin and DENN domains. With
  FNIP1 or FNIP2 it forms a heterodimer that is the GTPase-activating protein (GAP) for the lysosomal
  Rag GTPases RagC and RagD. When amino acids are scarce, FLCN-FNIP is recruited to the lysosome surface,
  where it binds GDP-bound RagA/B with Ragulator in the lysosomal folliculin complex (LFC), a state in
  which its GAP activity is held off. When amino acids return, the LFC disassembles and FLCN stimulates
  GTP hydrolysis by RagC/D through its catalytic Arg164. GDP-bound RagC/D lets mTORC1 bind and phosphorylate
  the MiT/TFE transcription factors TFEB and TFE3, which keeps them in the cytoplasm. FLCN is therefore
  required for this substrate-specific branch of mTORC1 signalling, but not for phosphorylation of S6K1
  or 4E-BP1. Loss of FLCN leaves TFEB/TFE3 constitutively nuclear, which drives lysosomal and mitochondrial
  biogenesis, adipose browning and renal hyperproliferation. FLCN''s activity is restrained by sequestration
  on lipidated GABARAP and by AMPK phosphorylation of FNIP1. Other reported activities are less established:
  FLCN promotes starvation-induced perinuclear lysosome clustering by loading active Rab34 onto RILP,
  and it binds and inhibits lactate dehydrogenase A. It is also found at cilia, centrosomes and the mitotic
  spindle. FLCN is a tumour suppressor, and germline loss-of-function variants cause Birt-Hogg-Dube syndrome
  (fibrofolliculomas, lung cysts, pneumothorax and renal tumours).'
