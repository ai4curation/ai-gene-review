- term:
    id: GO:0032007
    label: negative regulation of TOR signaling
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8QZS3
  review:
    summary: Early studies proposed FLCN as a negative regulator of mTOR because FLCN-null kidneys and
      tumours show mTORC1 hyperactivation.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The molecular evidence points the other way: FLCN''s RagC/D GAP activity is required for
      mTORC1 phosphorylation of TFEB/TFE3 (PMID:32612235, PMID:24095279). The mTORC1 hyperactivation in
      FLCN-null kidneys is secondary to constitutive TFEB activity, which induces RagC/D expression, and
      is rescued by TFEB deletion (PMID:32612235). The ISS source is a mouse acts_upstream_of_or_within
      phenotype annotation, and the NAS rows rest on author statements (PMID:17028174 offered it as a
      hypothesis). Not wrong as a phenotype, but an over-annotation of FLCN''s direct role.'
    additional_reference_ids:
    - PMID:32612235
    supported_by:
    - &id029
      reference_id: PMID:32612235
      supporting_text: TFEB is constitutively nuclear and active in Flcn-KO kidneys and its depletion
        rescues mTORC1 hyperactivation.
    - &id030
      reference_id: PMID:32612235
      supporting_text: Finally, the levels of RagC and RagD were increased, as well as the levels of other
        previously described TFEB targets
