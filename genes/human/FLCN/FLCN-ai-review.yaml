- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IDA
  original_reference_id: PMID:24095279
  qualifier: enables
  review:
    summary: FLCN (with FNIP1 or FNIP2) is the GTPase-activating protein for RagC/RagD; Arg164 of FLCN
      is the catalytic arginine, and structures of FLCN-FNIP2 bound to Rag-Ragulator show the mechanism.
    action: ACCEPT
    reason: Core molecular function, established in human proteins by in vitro GAP assays (PMID:24095279),
      catalytic-residue mutagenesis (R164A; PMID:31672913, PMID:31704029) and cryo-EM of the GAP-competent
      state (PMID:36103527). It is the activity behind FLCN's control of mTORC1-dependent TFEB/TFE3 phosphorylation
      (PMID:32612235, PMID:37079666). FLCN carries the catalytic residue, so enables (rather than contributes_to)
      is appropriate even though activity requires FNIP.
    supported_by: &id004
    - &id021
      reference_id: PMID:24095279
      supporting_text: Moreover, we identified the FLCN-FNIP complex as a potent GTPase activating protein
        (GAP) for RagC/D that interacts with the Rag heterodimer in an amino acid-sensitive fashion and
        localizes to the lysosomal surface upon amino acid starvation.
    - &id046
      reference_id: PMID:31672913
      supporting_text: First, we identified Arg164 of FLCN as a catalytically required arginine residue
        for GAP activity.
    - &id047
      reference_id: PMID:31704029
      supporting_text: Furthermore, we identified the catalytic residue necessary for the GAP activity,
        which leads us to interpret our structure as an on-pathway intermediate.
