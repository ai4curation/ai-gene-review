core_functions:
- description: GTPase-activating protein for the Rag GTPases RagC and RagD, acting as the FLCN-FNIP1/2
    heterodimer. FLCN supplies the catalytic arginine (Arg164); the activity is held off in the starvation-induced
    lysosomal folliculin complex and released on amino acid refeeding. It converts RagC/D to the GDP-bound
    state needed for substrate-specific mTORC1 phosphorylation and cytoplasmic retention of TFEB/TFE3.
  molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  directly_involved_in:
  - *id031
  - *id022
  locations:
  - *id012
  - *id011
  in_complex:
    id: GO:1990877
    label: FNIP-folliculin RagC/D GAP
  supported_by:
  - *id021
  - *id046
  - *id047
  - *id032
  - *id044
- description: Uncompetitive inhibitor of lactate dehydrogenase A that binds LDHA directly and restrains
    glycolytic flux (a single-laboratory finding, non-core relative to the Rag GAP function).
  molecular_function: *id025
  directly_involved_in:
  - id: GO:0045820
    label: negative regulation of glycolytic process
  locations:
  - *id011
  supported_by:
  - *id026
  - *id048
suggested_questions:
- question: Is the LDHA-inhibitory activity of FLCN (PMID:34381247) reproducible at endogenous stoichiometry,
    and is it independent of FNIP1/2 and of the Rag GAP function?
- question: Should the mouse-to-human ISS transfers of knockout phenotype terms (embryonic development,
    haemopoiesis, kidney proliferation, ERK/AKT regulation) be withdrawn, given that the mouse source
    annotations are acts_upstream_of_or_within?
- question: Does FLCN have a nuclear function, given that overexpressed FLCN without FNIP partners is
    largely nuclear?
- question: The mouse IBA for GO:0005096 uses contributes_to, while human IDA rows use enables. Should
    the qualifier be harmonized, given that FLCN carries the catalytic Arg164 but needs FNIP for activity?
suggested_experiments:
- description: Express endogenous-level FLCN R164A versus wild type in FLCN-null cells and measure LDHA
    activity, lactate output and TFEB localization side by side.
  experiment_type: structure-function rescue
  hypothesis: LDHA inhibition and RagC/D GAP activity are separable FLCN functions.
- description: Use conditional, tissue-specific FLCN deletion combined with TFE3/TFEB co-deletion to test
    whether the developmental and B-cell phenotypes depend on MiT/TFE.
  experiment_type: genetic epistasis
  hypothesis: The pleiotropic knockout phenotypes of FLCN are MiT/TFE-dependent consequences of loss of
    RagC/D GAP activity.
