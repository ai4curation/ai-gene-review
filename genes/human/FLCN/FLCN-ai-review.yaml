gene_symbol: FLCN
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Folliculin (FLCN) is a tumor-suppressor protein with Longin and DENN domains. In complexes
  with FNIP1 or FNIP2, it stimulates GTP hydrolysis by RagC and RagD, enabling Rag-dependent mTORC1 phosphorylation
  and cytoplasmic retention of TFEB and TFE3. Its cytosolic and lysosomal-membrane pools respond to nutrient
  availability: starvation promotes an inhibited lysosomal complex, while refeeding permits catalytic
  activation. Effects on other mTORC1 substrates vary with cellular conditions. GABARAP-dependent sequestration
  and AMPK phosphorylation of FNIP1 regulate this pathway. FLCN also directly binds and inhibits LDHA
  in biochemical and cellular experiments, restraining glycolysis. It participates in nutrient-dependent
  lysosome positioning through RILP/Rab34 and has additional context-dependent roles in ciliary signaling,
  epithelial junctions, metabolism and differentiation. Germline loss-of-function variants cause Birt-Hogg-Dube
  syndrome, characterized by fibrofolliculomas, pulmonary cysts and pneumothorax, and renal tumors.'
