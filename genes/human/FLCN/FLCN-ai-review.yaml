- term:
    id: GO:1904263
    label: positive regulation of TORC1 signaling
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002833743
  - PomBase:SPBC24C6.08c
  - SGD:S000003289
  - UniProtKB:Q8NFG4
  review:
    summary: Through its RagC/D GAP activity, FLCN-FNIP converts RagC/D to the GDP-bound state required
      for mTORC1 to bind and phosphorylate TFEB/TFE3; this substrate-specific mTORC1 branch is lost in
      FLCN-null cells, while S6K/4E-BP1 phosphorylation persists.
    action: ACCEPT
    reason: Core process, which FLCN performs directly by catalysing the RagC/D nucleotide switch. Supported
      by human biochemistry, structure and cell biology (PMID:32612235, PMID:36103527, PMID:37079666),
      regulation by GABARAP sequestration (PMID:34597140, PMID:39423796), and the PAINT IBA at PTN002833743,
      the ancestral node shared with yeast Lst7 and fission yeast Bhd1. PMID:39423796 is mainly a STING
      paper and supports this term only through the GABARAP-FLCN axis it builds on. IBA from PAINT; FLCN
      (Q8NFG4) appears in its own WITH/FROM as experimental grounding for the node.
    supported_by:
    - *id032
    - *id039
    - &id040
      reference_id: PMID:34597140
      supporting_text: This disrupts FLCN/FNIP GAP function toward RagC/D, resulting in impaired substrate-specific
        mTOR-dependent phosphorylation of TFEB.
