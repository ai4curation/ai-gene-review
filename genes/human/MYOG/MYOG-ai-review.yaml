description: 'MYOG/myogenin is a nuclear bHLH transcriptional activator that homodimerizes or heterodimerizes with E-proteins, binds E-box-containing regulatory DNA, and drives terminal skeletal-muscle differentiation, cell-cycle exit, and late myogenic gene expression.'
