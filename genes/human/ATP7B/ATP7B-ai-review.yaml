suggested_questions:
- question: Which ATP7B construct and localization/response experiments underpin the original PMID:15269005
    ATP7B annotations, especially basolateral plasma membrane?
- question: Which MitoCoP target-table evidence class and ATP7B product underpin PMID:34800366, and does
    it independently measure ATP7B or inherit literature localization?
- question: What processing event produces mitochondrial WND/140 kDa, and is its copper-transport function
    demonstrable independently of Golgi ATP7B?
- question: Under what endogenous hepatocyte conditions does ATP7B occupy apical plasma membrane, and
    how much copper elimination is attributable to direct membrane transport versus vesicular sequestration/exocytosis?
suggested_experiments:
- description: Compare endogenous ATP7B localization and copper elimination in polarized human hepatocyte
    models across copper-loading and chelation time courses. Combine compartment-resolved imaging with
    copper flux and selective perturbation of vesicular exocytosis to distinguish direct surface transport
    from vesicular delivery.
  experiment_type: endogenous localization and compartment-resolved copper transport
- description: Use orthogonal antibodies, intact-mass or peptide mapping and fractionation controls to
    identify the mitochondrial 140-kDa ATP7B product, then test its localization and copper-transport
    activity independently of the full-length Golgi product.
  experiment_type: protein-product mapping and functional transport assay
