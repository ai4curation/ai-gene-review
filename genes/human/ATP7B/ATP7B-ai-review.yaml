id: P35670
gene_symbol: ATP7B
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP7B is a P1B-type copper(I)-transporting ATPase (EC 7.2.2.8) that uses ATP hydrolysis to
  move cytosolic copper into the secretory and vesicular pathways. At the trans-Golgi network it supplies
  copper for secretory cuproproteins, including ceruloplasmin. Elevated copper promotes redistribution
  to post-Golgi compartments, where copper sequestration and subsequent exocytosis contribute to copper
  detoxification and biliary elimination. Six amino-terminal heavy metal-associated domains receive copper
  from ATOX1 and participate in regulation of the transport cycle; the transmembrane CPC motif is essential
  for transport. ATP7B localization varies with cell type, copper conditions and protein product. Loss
  of ATP7B function causes Wilson disease (MIM:277900), with impaired copper homeostasis and progressive
  copper accumulation, particularly in liver and brain.
