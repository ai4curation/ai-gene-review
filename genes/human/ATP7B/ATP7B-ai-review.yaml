core_functions:
- description: ATP-driven copper(I) translocation from the cytosol into Golgi and vesicular compartments
    supports secretory copper delivery, copper homeostasis and removal of excess cellular copper. Organelle
    copper import and subsequent vesicular exocytosis describe different boundaries of this route; the
    export process does not require universal ATP7B residence at the plasma membrane.
  molecular_function:
    id: GO:0140581
    label: P-type monovalent copper transporter activity
  directly_involved_in:
  - id: GO:0060003
    label: copper ion export
