suggested_questions:
- question: Which YWHAH neuronal and cardiac channel annotations are eta-specific under endogenous
    expression?
suggested_experiments:
- description: Use endogenous tagging plus phosphosite mutants of representative YWHAH clients to
    separate paralog-specific 14-3-3 regulation from redundant binding by other human 14-3-3 dimers.
