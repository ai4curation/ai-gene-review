id: Q04917
gene_symbol: YWHAH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'YWHAH encodes 14-3-3 protein eta, a dimeric phosphoprotein-binding adaptor expressed strongly
  in brain and at lower levels in other tissues. Like other 14-3-3 proteins, it binds phosphorylated client
  motifs and changes client localization or activity; human evidence supports client-specific regulation
  of the Nav1.5 sodium channel, HERG/KCNH2, the glucocorticoid receptor, and phosphodiesterase 3B.'
existing_annotations:
- term:
    id: GO:0002028
    label: regulation of sodium ion transport
  evidence_type: IDA
  original_reference_id: PMID:16728661
  qualifier: involved_in
  review:
    summary: 14-3-3 eta regulates the cardiac Nav1.5 sodium channel.
    action: KEEP_AS_NON_CORE
    reason: PMID:16728661 directly supports a Nav1.5 channel-regulation branch, but channel gating
      is client-specific rather than the core 14-3-3 function.
    supported_by:
    - reference_id: PMID:16728661
      supporting_text: 14-3-3eta induced a negative shift in the inactivation curve of the Na(+)
        current
- term:
    id: GO:0003779
    label: actin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P68510
  - ensembl:ENSMUSP00000019109
  review:
    summary: actin binding is not an established 14-3-3 molecular function for YWHAH.
    action: MARK_AS_OVER_ANNOTATED
    reason: The IEA evidence is an ortholog projection and does not establish direct,
      physiologic actin binding for this phosphoprotein adaptor.
    supported_by:
    - reference_id: file:human/YWHAH/YWHAH-notes.md
      supporting_text: >-
        The IEA actin-binding, synapse, presynapse, glutamatergic-synapse and cerebellar granule
        cell to Purkinje cell synapse rows are Ensembl ortholog projections from mouse or rat Ywhah
- term:
    id: GO:0005159
    label: insulin-like growth factor receptor binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P61981
  review:
    summary: insulin-like growth factor receptor binding is a supported client-class or
      client-specific binding branch.
    action: KEEP_AS_NON_CORE
    reason: This row is more specific than bare protein binding and fits a non-core branch of the
      broad 14-3-3 phosphoprotein-binding repertoire.
    supported_by:
    - reference_id: file:human/YWHAH/YWHAH-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Binds to a large number of partners, usually by recognition of a
        phosphoserine or phosphothreonine motif
