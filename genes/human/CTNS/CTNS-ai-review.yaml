  review:
    summary: Amino acid metabolic process is too general; cystinosin transports rather than metabolises
      cystine.
    action: MODIFY
    reason: The specific process is lysosomal L-cystine export.
    proposed_replacement_terms:
    - id: GO:1904919
      label: L-cystine transmembrane transport from lysosomal lumen to cytosol
