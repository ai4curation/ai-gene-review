id: O60931
gene_symbol: CTNS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CTNS encodes cystinosin, a seven-transmembrane PQ-loop family transporter of the lysosomal
  membrane that exports L-cystine, generated by lysosomal proteolysis, from the lysosomal lumen to the
  cytosol by proton symport, coupling cystine binding to protonation of a buried aspartate. Lysosomal
  sorting depends on a C-terminal GYDQL motif recognised by AP-3 and a second conformational motif; an
  alternatively spliced isoform (cystinosin-LKG) lacking GYDQL also reaches the plasma membrane. Cystinosin
  is also present in melanosomes and engages the Ragulator-Rag complex, linking lysosomal amino acid efflux
  to mTORC1 signalling. Biallelic loss of CTNS causes cystinosis, with intralysosomal cystine accumulation
  that damages kidney (renal Fanconi syndrome), eye and other organs.
