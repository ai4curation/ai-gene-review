      supporting_text: showed that cystinosin-green fluorescent protein colocalizes with lysosomal-associated
        membrane protein 2 (LAMP-2) to lysosomes
    - reference_id: PMID:25753619
      supporting_text: the tyrosine-based motif of cystinosin is a 'strong' AP-3 interacting motif responsible
        for lysosomal targeting of cystinosin by a direct intracellular pathway
