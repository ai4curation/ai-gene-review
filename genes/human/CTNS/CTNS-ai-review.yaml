  negated: true
  review:
    summary: 'NOT early endosome: wild-type cystinosin is targeted to lysosomes rather than residing in
      early endosomes.'
    action: ACCEPT
    reason: The negative annotation from the targeting-motif study is consistent with a direct AP-3-dependent
      intracellular route to lysosomes; we defer to the curator who read the full text.
    supported_by:
