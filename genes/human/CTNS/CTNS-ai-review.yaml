- term:
    id: GO:0006749
    label: glutathione metabolic process
  evidence_type: IMP
  original_reference_id: PMID:15956064
  qualifier: involved_in
  review:
    summary: Altered glutathione redox status in cystinotic cells is a downstream consequence of cystine
      storage.
    action: MARK_AS_OVER_ANNOTATED
    reason: The study measures GSH/GSSG in patient cells; cystinosin does not perform any step of glutathione
      metabolism.
    supported_by:
    - reference_id: PMID:15956064
      supporting_text: Although no reduction of total intracellular GSH content was found in cystinotic
        cells, it inversely correlated with cystine levels.
- term:
    id: GO:0007420
    label: brain development
  evidence_type: IMP
  original_reference_id: PMID:17471495
  qualifier: involved_in
  review:
    summary: Based on psychometric testing of children with cystinosis.
    action: MARK_AS_OVER_ANNOTATED
    reason: Non-verbal cognitive deficits in patients do not show that cystinosin participates in brain
      development; the inference is indirect.
    supported_by:
    - reference_id: PMID:17471495
      supporting_text: the cystinosis group performed significantly more poorly than controls on the performance
        and processing speed subtests
