  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The protected normal cache remains abstract-only. Separately recovered original main
      Methods, functional Results, Discussion and Figure 1 were inspected in the independent core consultation.
      CMV-driven human DPH1 complementation in MCF7 knockout cells is scored through toxin-dependent labeling
      of EEF2 in extracts; this is not purified human ACP-transfer chemistry. Modelled gates/interfaces
      are hypotheses. Supplement downloads failed, and no supplementary methods are claimed. The separate
      correction concerns clinical Table 1 epilepsy frequency.
- id: Reactome:R-HSA-5358494
  title: DPH2 transfers a 3-amino-3-carboxypropyl group from AdoMet to residue 715 of nascent EEF2
  findings: []
