- id: PMID:10519411
  title: Expression of OVCA1, a candidate tumor suppressor, is reduced in tumors and inhibits growth of
    ovarian cancer cells.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
