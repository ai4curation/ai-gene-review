id: Q9BZG8
gene_symbol: DPH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DPH1 is an iron–sulfur protein that acts with DPH2 to initiate diphthamide modification of
  translation elongation factor 2 (EEF2). The complex transfers an aminocarboxypropyl group from S-adenosylmethionine
  to a conserved EEF2 histidine. DPH1 supplies the catalytic contribution, supported by human-cell complementation
  and subunit-resolved biochemistry of the yeast heterodimer. Cytosolic, nucleoplasmic and perinuclear
  pools have been reported. Biallelic pathogenic variants cause a developmental disorder with short stature,
  craniofacial and ectodermal abnormalities. Alternative transcripts encode products differing in their
  N termini and internal or C-terminal sequences; their functional equivalence is unresolved.
alternative_products:
- name: '4'
  id: Q9BZG8-4
  description: Displayed 438-residue protein. The current record supplies the reference coordinates; older
    443-residue DPH1 numbering is shifted by five residues relative to this product. Reference matching
    does not authenticate every historical experimental construct.
- name: '1'
  id: Q9BZG8-1
  sequence_note: VSP_061761
  description: 443-residue product with the MRRQV extension before the complete displayed sequence. The
    numbering in the human variant study matches this longer product, including Met6 at the displayed
    product initiation position. Exogenous expression of Met6Lys retained the measured endpoint, which
    does not resolve endogenous initiation or expression effects.
- name: '2'
  id: Q9BZG8-2
  sequence_note: VSP_061760
  description: 363-residue product lacking displayed residues 1–75. The remaining sequence retains the
    three currently annotated cluster-binding positions, but that retention alone does not establish folding,
    complex assembly or catalytic activity.
- name: '5'
  id: Q9BZG8-5
  sequence_note: VSP_061761, VSP_061762, VSP_061763
  description: 215-residue product combining the N-terminal extension with replacement of displayed residues
    93–210 and loss of residues 211–438. Its architecture differs substantially from the full-length products.
    The inspected full-length variant assays do not establish its activity or inactivity.
