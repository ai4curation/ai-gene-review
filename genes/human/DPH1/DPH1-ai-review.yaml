  review:
    summary: Retain the first-step synthase activity mapping.
    action: ACCEPT
    reason: The current GO:0090560 definition specifies transfer of the SAM-derived 3-amino-3-carboxypropyl
      group to EEF2 histidine, not a later methylation or amidation step. Human DPH1 complementation of
      deficient MCF7 cells restores a toxin-reactive diphthamide endpoint; the subunit-resolved yeast
      Dph1–Dph2 study uses reconstituted SAM transfer and distinguishes catalytic Dph1 cluster function
      from Dph2-dependent use of the physiological reducing system. Together they support DPH1 as the
      catalytic component of this machinery. Retain the activity in its complex-dependent context; this
      does not claim autonomous purified human catalysis, identify all natural products as active, or
      make human DPH2 catalytic merely because an archaeal enzyme is called Dph2.
