      supplies Subcellular Fractionation, Subcellular Localization and Figure 4C caption. Human ovarian
      epithelial fractionation detects the approximately 50-kDa species in nuclear and cytoplasmic pools;
      COS-1 and human HOSE tagged-protein imaging shows diffuse/perinuclear patterns. These are positive
      localization results, not purified chemistry or proof that p70/p85 bands are distinct natural splice
      products.
