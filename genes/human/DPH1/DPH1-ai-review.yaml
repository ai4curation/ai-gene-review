core_functions:
- description: DPH1 supplies the catalytic subunit of the DPH1–DPH2 complex that transfers an aminocarboxypropyl
    group from S-adenosylmethionine to elongation factor 2, initiating diphthamide formation. Human DPH1
    complementation restores the toxin-reactive diphthamide endpoint in deficient cells. Purified yeast
    heterodimer reconstitution separates the catalytic role of the Dph1 iron–sulfur cluster from the Dph2-dependent
    reducing-system requirement; this is ortholog biochemical evidence, not a purified human-subunit assay.
  contributes_to_molecular_function:
    id: GO:0090560
    label: 2-(3-amino-3-carboxypropyl)histidine synthase activity
  directly_involved_in:
  - id: GO:0017183
    label: protein histidyl modification to diphthamide
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0120513
    label: 2-(3-amino-3-carboxypropyl)histidine synthase complex
  supported_by:
  - reference_id: PMID:30877278
  - reference_id: PMID:31463593
    supporting_text: The cluster in Dph1 is the catalytic site.
  - reference_id: Reactome:R-HSA-5358494
suggested_questions:
- question: How do the four natural DPH1 products differ in cluster occupancy, DPH2 association, stability
    and support of diphthamide synthesis?
- question: What biological roles, if any, distinguish the nucleoplasmic and perinuclear DPH1 pools from
    the cytosolic biosynthetic machinery?
- question: Does the reproducible DPH1–TFCP2 binary interaction occur endogenously in a defined human-cell
    context, and what consequence does it have?
