    relevance: HIGH
    correctness: VERIFIED
    review_notes: The genuine cached reaction and live ContentService chain contain human DPH1 as a component
      of the cytosolic DPH1:DPH2:DPH3 model. Its activeUnit field names DPH2, based on archaeal homology,
      and should not be conflated with subunit-resolved eukaryotic biochemistry. The modeled location
      and membership are evaluated separately from this catalytic attribution.
- id: PMID:31463593
  title: The asymmetric function of Dph1-Dph2 heterodimer in diphthamide biosynthesis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The genuine full XML cache is byte-identical to the existing main and pending yeast-review
      copies. The independently inspected original operative Methods/Results and Figure 6 test Saccharomyces
      cerevisiae heterodimers, cluster mutants, anaerobic SAM transfer and reductant dependence. They
      distinguish Dph1 catalytic cluster function from the Dph2 requirement for the Dph3/Cbr1/NADH system.
      This supports a conserved complex-dependent catalytic contribution, not isolated human-subunit activity.
