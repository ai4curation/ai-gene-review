id: P25092
gene_symbol: GUCY2C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GUCY2C encodes guanylyl cyclase C (GC-C), a single-pass type I transmembrane receptor guanylyl
  cyclase expressed mainly on the apical (brush-border) plasma membrane of intestinal epithelial cells.
  Its glycosylated extracellular domain binds the endogenous peptides guanylin and uroguanylin and the
  Escherichia coli heat-stable enterotoxin STa; ligand binding activates the cytoplasmic guanylyl cyclase
  domain to convert GTP to cGMP. An intervening ATP-binding pseudokinase (kinase-homology) domain regulates
  cyclase activity. GC-C-derived cGMP activates CFTR-dependent chloride and fluid secretion; gain-of-function
  variants cause familial diarrhea and loss-of-function variants cause meconium ileus. An ER-resident
  high-mannose precursor matures into the cell-surface form.
