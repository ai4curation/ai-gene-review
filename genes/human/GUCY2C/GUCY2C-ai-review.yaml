core_functions:
- description: Cell-surface receptor guanylyl cyclase. The extracellular domain binds guanylin, uroguanylin
    or E. coli STa, activating the cytoplasmic catalytic domain to make cGMP, which drives CFTR-dependent
    intestinal chloride and fluid secretion.
  molecular_function:
    id: GO:0004383
    label: guanylate cyclase activity
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  directly_involved_in:
  - id: GO:0007168
    label: receptor guanylyl cyclase signaling pathway
  - id: GO:0006182
    label: cGMP biosynthetic process
  supported_by:
  - reference_id: PMID:1680854
    supporting_text: respond to STa by dramatically increasing (approximately 50-fold) cellular cGMP levels
  - reference_id: PMID:22521417
    supporting_text: the encoded protein activates the CFTR protein through local generation of cGMP
- description: Peptide receptor activity for the guanylin family and heat-stable enterotoxin through the
    glycosylated extracellular domain.
  molecular_function:
    id: GO:0001653
    label: peptide receptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:23269669
    supporting_text: following activation by its ligands guanylin, uroguanylin, or the heat-stable enterotoxin
      peptide (ST)
suggested_questions:
- question: How does ATP binding to the kinase-homology domain couple ligand binding to activation of
    the cyclase domain in the GC-C homotrimer?
- question: What fraction of GC-C in native enterocytes is the ER-resident 130 kDa precursor, and is its
    maturation regulated physiologically?
suggested_experiments:
- description: Cryo-EM of full-length GC-C with and without uroguanylin and ATP to define the activation
    mechanism transmitted through the pseudokinase domain.
  experiment_type: structural biology
- description: Surface biotinylation and polarized-trafficking assays in human intestinal organoids to
    quantify apical versus intracellular GC-C pools and the role of NHERF4 and VIP36.
  experiment_type: cell biology
