id: Q99440
gene_symbol: LINC01587
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LINC01587 (formerly C4orf6, AC1) is a long intergenic non-coding RNA locus on chromosome
  4p16 that contains a 93-codon open reading frame, recorded by UniProt as an uncharacterised protein.
  The predicted product has no recognised domain, family membership or transmembrane segment. The transcript
  was first cloned as a differentially expressed band during retinoic-acid differentiation of SH-SY5Y
  neuroblastoma cells. Patients homozygous for a deletion removing this locus together with EVC, EVC2
  and STK32B have Ellis-van Creveld syndrome with at most mild intellectual deficit. No function of the
  RNA or of the putative protein is known.
existing_annotations:
- term:
    id: GO:0007399
    label: nervous system development
  evidence_type: TAS
  original_reference_id: PMID:9016955
  qualifier: involved_in
  review:
    summary: Traceable author statement (ProtInc) of nervous system development, based on the original
      cloning paper, which detected the transcript as differentially expressed during retinoic-acid-induced
      differentiation of a neuroblastoma line.
    action: REMOVE
    reason: A change in transcript level during neuroblastoma differentiation is not evidence that the
      gene product does any of the work of nervous system development, and the paper did not study the
      protein at all. The locus is classified by HGNC and Ensembl as a long non-coding RNA, and no protein-level
      study is cited by the UniProt entry. Human homozygous deletion of the locus (with three other genes)
      produces at most a mild neurological phenotype. Nothing specific to this product supports the process
      term.
    supported_by:
    - reference_id: PMID:9016955
      supporting_text: we analyzed the gene expression profile in the retinoic acid-induced differentiation
        of a human neuroblastoma cell line SH-SY5Y
    - reference_id: PMID:18454448
      supporting_text: loss of the novel genes C4orf6 and STK32B causes at most mild mental deficit
