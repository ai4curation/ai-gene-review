id: Q86SJ6
gene_symbol: DSG4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Desmoglein-4 is a desmosomal cadherin whose expression is concentrated in
  the hair follicle, where it is found in the inner root sheath and in all layers of the
  matrix and precortex, with lower expression in other stratified epithelia. Like the
  other desmogleins it is a single-pass type I membrane glycoprotein with
  calcium-binding extracellular cadherin domains that face the extracellular space, and
  a cytoplasmic tail that binds plakoglobin and couples the junction to the desmosomal
  plaque. Recessive loss-of-function mutations cause hypotrichosis and monilethrix, and
  a disease mutation that abolishes plakoglobin binding disrupts desmosomes in the hair
  shaft, placing DSG4 in the control of keratinocyte adhesion and differentiation during
  hair-shaft formation.
