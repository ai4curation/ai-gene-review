core_functions:
- description: Desmosomal cadherin of the hair follicle. Its calcium-binding extracellular
    domains mediate adhesion between keratinocytes of the inner root sheath, matrix and
    precortex, while the cytoplasmic tail binds plakoglobin and anchors the junction to
    the desmosomal plaque; loss of that coupling disrupts desmosomes and produces fragile,
    beaded hair.
  molecular_function:
    id: GO:0045295
    label: gamma-catenin binding
  locations:
  - id: GO:0030057
    label: desmosome
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0098609
    label: cell-cell adhesion
  supported_by:
  - reference_id: PMID:21495994
    supporting_text: we show that the mutant DSG4 protein with the mutation p.W823X severely
      affects the affinity to plakoglobin protein, which may contribute to disruption of
      desmosomes in the patient's hair shaft
  - reference_id: file:human/DSG4/DSG4-uniprot.txt
    supporting_text: Note=Colocalizes with JUP at desmosomes.
suggested_questions:
- question: Does DSG4 form homophilic trans-interactions of its own, or does it function
    mainly by heterophilic pairing with DSG1, DSG3 or desmocollins in follicular
    desmosomes?
- question: Is the reported effect of DSG4 on lymphocyte migration to inflamed skin a
    direct function, or a secondary consequence of impaired follicular and epidermal
    barrier integrity?
- question: How does DSG4 coordinate the transition from proliferation to differentiation
    in hair follicle keratinocytes, and is that role separable from its adhesive function?
suggested_experiments:
- hypothesis: DSG4 mediates calcium-dependent trans-adhesion with measurable binding
    forces comparable to other desmogleins.
  description: Single-molecule atomic force spectroscopy with recombinant DSG4 ectodomains
    against DSG1, DSG3 and DSC1-3 ectodomains and against DSG4-expressing keratinocytes,
    with and without calcium.
- hypothesis: The hair-shaft phenotype of DSG4 loss is caused specifically by failure of
    plakoglobin recruitment rather than by loss of extracellular adhesion.
  description: Express DSG4 variants that separate the plakoglobin-binding tail from the
    adhesive ectodomain in DSG4-null follicular keratinocytes, then assay desmosome
    ultrastructure, plaque composition and adhesion strength for each variant.
- hypothesis: DSG4 is absent from the cornified envelope.
  description: Immunogold electron microscopy and sequential extraction of human scalp
    skin and hair follicles, comparing DSG4 with DSG1 and corneodesmosin across follicular
    and interfollicular compartments.
