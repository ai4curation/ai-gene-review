core_functions:
- description: >-
    LRP10 acts as a membrane cargo receptor for APP. Its ectodomain binds APP,
    while cytoplasmic DXXLL-dependent trafficking returns LRP10 and associated
    APP from early endosomes to the trans-Golgi network, retaining APP away from
    compartments that favor amyloidogenic processing. This core function is
    supported directly in human cells and is distinct from an autonomous adaptor
    or signaling-receptor activity.
