- id: PMID:11123907
  title: A novel low-density lipoprotein receptor-related protein mediating cellular uptake of apolipoprotein E-enriched beta-VLDL in vitro.
  findings:
  - statement: >-
      The original study characterized the mouse LRP10 ortholog, then called
      LRP9, rather than directly assaying human Q7Z4F1.
    supporting_text: |-
      screening of a mouse lymphocyte cDNA library. The protein was termed LDL
      receptor-related protein 9 (LRP9).
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Expression of mouse LRP9 in ldl-A7 cells supported uptake-related handling
      of apoE-enriched beta-VLDL, specifically bounding the tested lipoprotein
      cargo to beta-VLDL.
    supporting_text: |-
      Apolipoprotein E (apoE)-enriched beta-VLDL stimulated cellular
      cholesteryl ester formation in ldl-A7/LRP9.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
