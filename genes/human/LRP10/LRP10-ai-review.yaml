      PubMed-verified primary study and the decisive experimental source for the
      mouse-ortholog lipoprotein-uptake inference. It supports transfer of a
      beta-VLDL receptor activity within the narrow LRP10 subfamily, not direct
      human evidence or blanket LDL-particle receptor activity.
- id: PMID:22734645
  title: "LDLR-related protein 10 (LRP10) regulates amyloid precursor protein (APP) trafficking and processing: evidence for a role in Alzheimer's disease."
  findings:
  - statement: >-
      Human LRP10 binds APP primarily through their ectodomains in the reported
      biochemical assays.
    supporting_text: These results indicated that LRP10 interacts directly and predominantly with the ectodomain of APP in vitro.
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: >-
      Surface-exposed LRP10 is rapidly internalized into early endosomes and
      recycled to the Golgi through a cytoplasmic-tail DXXLL-dependent step.
    supporting_text: >-
      These results suggested that LRP10 moves through the secretory pathway to
      the cell surface. After rapid internalization in early endosomes, LRP10 is
      recycled back to the Golgi, a step that requires the DXXLL motifs in the
      cytoplasmic tail of LRP10 .
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: >-
      In human neuroblastoma cells, increasing LRP10 retained mature APP in the
      Golgi and reduced amyloidogenic processing, whereas LRP10 depletion
      increased Aβ production.
    supporting_text: |-
      Increased
      expression of LRP10 in human neuroblastoma SH-SY5Y cells induces the
      accumulation of mature APP in the Golgi and reduces its presence at the cell
      surface and its processing into Aβ, while knockdown of LRP10 expression
      increases Aβ production.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human primary evidence for APP binding, TGN/endosome/plasma-membrane
      cycling, DXXLL-dependent retrograde trafficking, and effects on APP
      processing. Most assays use tagged or overexpressed proteins in cultured
      HEK293, HeLa, or SH-SY5Y cells, so the disease interpretation is not a
      universal in-vivo mechanism.
- id: PMID:29887161
  title: "LRP10 genetic variants in familial Parkinson's disease and dementia with Lewy bodies: a genome-wide linkage and sequencing study."
  findings:
  - statement: >-
      Rare LRP10 variants showed limited familial co-segregation across the
      reported Parkinson disease and Lewy-body-disease cohorts.
    supporting_text: |-
      The LRP10 variants were present in nine of these ten relatives,
      providing independent-albeit limited-evidence of co-segregation with disease.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Different reported variants affected mRNA abundance, protein stability, or
      subcellular localization in the study's cell-based assays.
    supporting_text: |-
      severe Lewy body pathology. Of nine variants identified in total (one in the
      initial family and eight in stage 2), three severely affected LRP10 expression
      and mRNA stability (1424+5delG, 1424+5G→A, and Ala212Serfs*17, shown by cDNA
      analysis), four affected protein stability (Tyr307Asn, Gly603Arg, Arg235Cys, and
      Pro699Ser, shown by cycloheximide-chase experiments), and two affected protein
      localisation (Asn517del and Arg533Leu; shown by immunocytochemistry), pointing
      to loss of LRP10 function as a common pathogenic mechanism.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified human genetic and functional study. It supports
      variant-specific effects and a proposed loss-of-function model, but the
      segregation evidence is explicitly limited, one carrier occurred among
      controls, and disease association does not establish LRP10's normal core
      molecular function.
- id: PMID:33913039
  title: LRP10 interacts with SORL1 in the intracellular vesicle trafficking pathway in non-neuronal brain cells and localises to Lewy bodies in Parkinson's disease and dementia with Lewy bodies.
  findings:
  - statement: >-
      Endogenous LRP10 was detected mainly in astrocytes and neurovasculature in
      adult human brain and in iPSC-derived astrocytes, but not in the examined
      neurons.
    supporting_text: |-
      In adult human brain, LRP10 is mainly expressed in astrocytes and
      neurovasculature but undetectable in neurons. Similarly, LRP10 is highly
      expressed in iPSC-derived astrocytes but cannot be observed in iPSC-derived
      neurons.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      In astrocytes, endogenous LRP10 occupies TGN, plasma-membrane, retromer,
      and early-endosome compartments and partially colocalizes and interacts
      with SORL1.
    supporting_text: |-
      In astrocytes, LRP10 is present at trans-Golgi network, plasma
      membrane, retromer, and early endosomes. Interestingly, LRP10 also partially
      co-localises and interacts with sortilin-related receptor 1 (SORL1).
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Strong direct human evidence using post-mortem brain and control
      iPSC-derived cells with knockout-validated antibodies. It establishes
      cell-type and trafficking-compartment context plus an SORL1 association;
      Lewy-body localization and disease hypotheses remain pathological context,
      not proof of a normal neuronal core function.
- id: PMID:38315424
  title: LRP10 and α-synuclein transmission in Lewy body diseases.
  findings:
  - statement: >-
      In the reported cell and organoid systems, wild-type LRP10 was released in
      extracellular vesicles and could be internalized by clathrin-dependent
      endocytosis.
    supporting_text: |-
      Here, we demonstrate that
      wild-type LRP10 is secreted via extracellular vesicles (EVs) and can be
      internalised via clathrin-dependent endocytosis.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      The α-synuclein experiments provide initial model-dependent evidence and
      are explicitly limited by overexpression, non-neural cell lines, and lack
      of aging context.
    supporting_text: >-
      our model to study LRP10 and α-synuclein has important limitations,
      including overexpression, the use of non-neural cell lines, and the lack of
      the aging component of LBDs
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Direct mechanistic evidence for extracellular-vesicle release, uptake, and
      context-dependent effects on α-synuclein, plus a patient splice-variant
      model. The authors explicitly frame the work as initial and identify major
      model limitations; it should not be generalized into a constitutive normal
      LRP10 secretion or α-synuclein-regulation function.
