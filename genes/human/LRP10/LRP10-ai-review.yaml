proposed_new_terms: []
suggested_questions:
- question: >-
    Which endogenous human cargos, beyond APP, are directly bound and sorted by
    LRP10, and does human LRP10 mediate apoE-rich beta-VLDL uptake?
- question: >-
    Does SORL1 recruit LRP10 into a shared trafficking route, does LRP10 recruit
    SORL1, or do the two receptors associate indirectly through common machinery?
- question: >-
    How does deletion of residues 557-713 alter the localization, cargo binding,
    and transport kinetics of LRP10 isoform 2?
- question: >-
    Which trafficking defect caused by disease-associated LRP10 variants is
    necessary and sufficient to perturb alpha-synuclein handling in human brain
    cell types?
suggested_experiments:
- description: >-
    Perform quantitative surface-cargo capture, internalization, and pulse-chase
    proteomics in endogenous LRP10-knockout and rescued human astrocytes, testing
    APP, apoE-rich beta-VLDL, and unbiased candidate cargos.
  hypothesis: >-
    Human LRP10 directly sorts a restricted cargo set that includes APP, while
    beta-VLDL uptake is cargo- and cell-context dependent rather than a general
    LDL-receptor-family property.
  experiment_type: Endogenous cargo-binding and trafficking assay
- description: >-
    Map the endogenous LRP10-SORL1 interface and combine acute depletion of each
    receptor with live-cell cargo tracking and rescue by interaction- or
    DXXLL-motif-defective alleles in human iPSC-derived astrocytes.
  hypothesis: >-
    LRP10 and SORL1 cooperate in endosome-to-Golgi cargo sorting without LRP10
    functioning as an autonomous macromolecular adaptor.
  experiment_type: Endogenous interaction and epistasis analysis
- description: >-
    Introduce isoform-specific endogenous tags and compare full-length LRP10 with
    isoform 2 for organelle residence, APP sorting, SORL1 association, and surface
    recycling, using isoform-selective knockout and rescue.
  hypothesis: >-
    Loss of residues 557-713 changes trafficking kinetics or partner engagement,
    producing a functionally distinct isoform rather than a passive truncation.
  experiment_type: Isoform-resolved trafficking analysis
- description: >-
    Generate isogenic human astrocyte-neuron cocultures carrying representative
    stability- and localization-defective LRP10 variants, age the cultures, and
    measure APP/cargo traffic, extracellular-vesicle flux, and alpha-synuclein
    transfer at endogenous expression levels.
  hypothesis: >-
    Disease-associated loss of LRP10 perturbs a defined astrocytic cargo-sorting
    step that secondarily alters alpha-synuclein handling.
  experiment_type: Endogenous disease-variant mechanism study
