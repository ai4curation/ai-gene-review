gene_symbol: LRP10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRP10 is a 713-residue type-I membrane sorting receptor with an extracellular
  region containing two CUB domains and four LDL-receptor class A repeats, a
  single transmembrane helix, and a long cytoplasmic tail. It cycles among the
  trans-Golgi network, plasma membrane, and early endosomes. In human cells its
  ectodomain binds amyloid-beta precursor protein (APP), while tail-dependent
  trafficking promotes APP return from endosomes to the Golgi and limits
  amyloidogenic processing. Endogenous human-brain expression is strongest in
  astrocytes and the neurovasculature, where LRP10 shares trafficking
  compartments and associates with SORL1. Mouse Lrp10 supports uptake of
  apoE-enriched beta-VLDL, providing ortholog-level evidence for lipoprotein
  particle receptor activity but not direct human uptake. Isoform 2 lacks
  residues 557-713 of the
  cytoplasmic tail, but no distinct isoform-specific function has been
  demonstrated.
