knowledge_gaps:
- gap_statement: >-
    The physiological human cargo repertoire of LRP10, including whether it
    directly internalizes apoE-rich beta-VLDL in relevant human cell types, is
    unresolved.
  boundary: >-
    APP is a directly bound human cargo whose intracellular distribution depends
    on LRP10, whereas beta-VLDL uptake has been demonstrated only for mouse
    Lrp10 in a reconstituted cell system.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Defining endogenous cargos is necessary to distinguish the conserved sorting
    function of LRP10 from family-wide LDL-receptor assumptions.
  resolution: >-
    Quantitative endogenous cargo-binding and uptake assays in human astrocytes
    and other LRP10-expressing cells, coupled to LRP10 knockout and rescue, would
    establish cargo specificity and transport direction.
  provenance:
  - reference_id: PMID:22734645
    supporting_text: These results indicated that LRP10 interacts directly and predominantly with the ectodomain of APP in vitro.
    reference_section_type: RESULTS
  - reference_id: PMID:11123907
    supporting_text: |-
      Apolipoprotein E (apoE)-enriched beta-VLDL stimulated cellular
      cholesteryl ester formation in ldl-A7/LRP9.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
- gap_statement: >-
    How SORL1 participates in LRP10-dependent sorting, and whether either receptor
    recruits the other or a shared trafficking complex, has not been established.
  boundary: >-
    Endogenous LRP10 and SORL1 partially colocalize and interact in human
    astrocytes, but this observation does not demonstrate retromer membership or
    protein-macromolecule adaptor activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the interaction mechanism would explain how two sorting receptors
    coordinate cargo traffic in the human brain without overcalling complex
    membership.
  resolution: >-
    Endogenous reciprocal interaction mapping, acute depletion, and trafficking
    rescue with interface- and tail-motif mutants in human astrocytes would test
    directionality and dependence on retromer-associated machinery.
  provenance:
  - reference_id: PMID:33913039
    supporting_text: |-
      In astrocytes, LRP10 is present at trans-Golgi network, plasma
      membrane, retromer, and early endosomes. Interestingly, LRP10 also partially
      co-localises and interacts with sortilin-related receptor 1 (SORL1).
    reference_section_type: ABSTRACT
- gap_statement: >-
    The cellular itinerary, cargo selectivity, and physiological consequences of
    LRP10 isoform 2 are unknown.
  boundary: >-
    Isoform 2 lacks residues 557-713 of the cytoplasmic tail, but no direct
    isoform-specific localization or functional experiment is available.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The deletion removes much of the tail that could encode trafficking control,
    so treating isoform 2 as functionally equivalent to the full-length product
    is not yet justified.
  resolution: >-
    Endogenous isoform-specific tagging and knockout-rescue trafficking assays
    should compare APP sorting, SORL1 association, and organelle residence times.
  provenance:
  - reference_id: file:human/LRP10/LRP10-uniprot.txt
    supporting_text: |-
      FT   VAR_SEQ         557..713
      FT                   /note="Missing (in isoform 2)"
      FT                   /evidence="ECO:0000303|PubMed:15489334"
      FT                   /id="VSP_009820"
- gap_statement: >-
    The causal route from disease-associated LRP10 loss or mislocalization to
    Lewy-body disease phenotypes remains unresolved, and the reported
    alpha-synuclein effects have not been established as a universal normal
    function of LRP10.
  boundary: >-
    Several disease-associated variants reduce RNA or protein stability or alter
    localization, while the available alpha-synuclein study used overexpression
    and model systems with acknowledged limitations.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Mechanistic resolution is required before disease association or extracellular
    vesicle observations can be promoted to a constitutive core function.
  resolution: >-
    Isogenic patient-variant knock-in models at endogenous abundance, evaluated
    in aged human astrocyte-neuron cocultures for cargo trafficking and
    alpha-synuclein handling, would test causality.
  provenance:
