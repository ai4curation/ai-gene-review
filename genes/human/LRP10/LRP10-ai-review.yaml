        These results suggested that LRP10 moves through the secretory pathway to the cell surface. After rapid internalization in early endosomes, LRP10 is recycled back to the Golgi, a step that requires the DXXLL motifs in the cytoplasmic tail of LRP10 .
      reference_section_type: RESULTS
