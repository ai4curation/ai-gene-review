    label: GMP biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:27590927
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      From the CRISPR knockout study; loss of PFAS depletes de novo purine synthesis and
      thereby the downstream GMP branch.
    action: KEEP_AS_NON_CORE
    reason: >-
      PFAS acts upstream of GMP synthesis - it makes the IMP precursor, from which GMP is
      subsequently derived - so the acts_upstream_of_or_within qualifier is appropriate. It is
      not itself a GMP-biosynthesis enzyme, so this is a valid but non-core downstream-branch
      annotation.
    supported_by:
    - reference_id: PMID:27590927
      supporting_text: >-
        CRISPR-Cas9 genome-edited HeLa
        cells deficient for the individual steps
        of DNPS
