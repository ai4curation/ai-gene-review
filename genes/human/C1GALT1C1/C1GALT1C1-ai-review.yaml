- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21496458
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9NS00
  review:
    summary: >-
      The interaction partner is C1GALT1 (Q9NS00), Cosmc's only known client.
      The cited paper does not merely report an interaction: using a wheat-germ
      cell-free translation system it shows that Cosmc must be present during
      C1GalT translation to yield active enzyme, and is ineffective when added
      afterwards. That is chaperone activity, not generic binding.
    action: MODIFY
    reason: >-
      Generic protein binding carries no functional information, and here the
      cited publication supports a specific and much more informative molecular
      function. The co-translational requirement, and the inference that Cosmc
      prevents unfavourable aggregation of its client, are exactly what
      GO:0044183 protein folding chaperone denotes. This is the annotation that
      should carry Cosmc's molecular function.
    proposed_replacement_terms:
    - id: GO:0044183
      label: protein folding chaperone
    supported_by:
    - reference_id: PMID:21496458
      supporting_text: >-
        These results indicate that Cosmc mediates the co-translational activation of C1GalT
    - reference_id: PMID:21496458
      supporting_text: >-
        Core 1 synthase specific molecular chaperone (Cosmc), a molecular chaperone
        specific for C1GalT, is essential for the expression of functional C1GalT in
        mammalian cells.
- term:
    id: GO:0006493
    label: protein O-linked glycosylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027289
  review:
    summary: >-
      Cosmc is a dedicated single-client chaperone whose entire biological role is
      to produce functional T-synthase, the committed enzyme of core 1 mucin-type
      O-glycan biosynthesis. Although it transfers no sugar itself, it supplies the
      folding activity on which the pathway's committed step depends, which meets
      the bar for involvement rather than mere necessity.
    action: ACCEPT
    reason: >-
      The rule-based assignment lands on the right process at a defensible
      altitude. Cosmc has no function outside O-glycosylation, so this is not an
      over-broad pathway attribution of the kind that afflicts promiscuous
      enzymes; it is the process this protein exists to serve.
    supported_by:
    - reference_id: PMID:21496458
      supporting_text: >-
        Core 1 synthase specific molecular chaperone (Cosmc), a molecular chaperone
        specific for C1GalT, is essential for the expression of functional C1GalT in
        mammalian cells.
