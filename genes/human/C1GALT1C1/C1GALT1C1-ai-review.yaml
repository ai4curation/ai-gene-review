core_functions:
- description: >-
    C1GALT1C1 (Cosmc) acts in the endoplasmic reticulum membrane as the dedicated co-translational
    folding chaperone for core 1 beta-1,3-galactosyltransferase (C1GALT1). It engages the
    nascent T-synthase polypeptide during translation, prevents its aggregation and enables
    it to reach a stable, active conformation. It has no catalytic activity of its own, and
    no client other than C1GALT1 is known, so its molecular function is exercised entirely
    in the service of core 1 mucin-type O-glycan biosynthesis. It is retained in the ER by
    a determinant within its own 18-residue transmembrane domain, and although it belongs
    to the GT31 glycosyltransferase family it has no transferase activity of its own.
  molecular_function:
    id: GO:0044183
    label: protein folding chaperone
  directly_involved_in:
  - id: GO:0006493
    label: protein O-linked glycosylation
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:21496458
    supporting_text: These results indicate that Cosmc mediates the co-translational activation
      of C1GalT
  - reference_id: PMID:37216524
    supporting_text: Cosmc is an ER-localized molecular chaperone required for T-synthase
      function.
  - reference_id: PMID:21262965
    supporting_text: >-
      Here we show that the 18 amino acid transmembrane domain (TMD) of Cosmc is essential
      for ER localization and confers ER retention to select chimeras.
suggested_questions:
- question: >-
    Should a dedicated, single-client glycosyltransferase folding chaperone such as Cosmc
    be annotated to protein O-linked glycosylation with involved_in, or only with acts_upstream_of_or_within?
    GOA currently uses both qualifiers for the same term on this gene, which suggests the
    convention is unsettled for chaperones that enable rather than catalyse a pathway step.
- question: >-
    Is there a case for a molecular function term more specific than GO:0044183 protein folding
    chaperone, capturing chaperones committed to a single glycosyltransferase client? Cosmc
    is the best-characterised example, but generalising from one protein risks a term with
    no second member.
suggested_experiments:
- description: >-
    Direct biochemical test of whether purified Cosmc has any galactosyltransferase activity
    in the absence of C1GALT1, which would settle the catalytic-activity annotation on evidence
    rather than on inference from the chaperonopathy.
- description: >-
    Proximity labelling or co-translational crosslinking in the ER to establish whether Cosmc
    engages clients other than C1GALT1, testing the assumption that its molecular function
    is exclusively dedicated to the T-synthase.
