  - reference_id: PMID:37216524
    supporting_text: >-
      Cosmc is an ER-localized molecular chaperone required for T-synthase function.
suggested_questions:
- question: >-
    Should a dedicated, single-client glycosyltransferase folding chaperone such
    as Cosmc be annotated to protein O-linked glycosylation with involved_in, or
    only with acts_upstream_of_or_within? GOA currently uses both qualifiers for
    the same term on this gene, which suggests the convention is unsettled for
    chaperones that enable rather than catalyse a pathway step.
- question: >-
    Is there a case for a molecular function term more specific than GO:0044183
    protein folding chaperone, capturing chaperones committed to a single
    glycosyltransferase client? Cosmc is the best-characterised example, but
    generalising from one protein risks a term with no second member.
suggested_experiments:
- description: >-
    Direct biochemical test of whether purified Cosmc has any galactosyltransferase
    activity in the absence of C1GALT1, which would settle the catalytic-activity
    annotation on evidence rather than on inference from the chaperonopathy.
- description: >-
    Proximity labelling or co-translational crosslinking in the ER to establish
    whether Cosmc engages clients other than C1GALT1, testing the assumption that
    its molecular function is exclusively dedicated to the T-synthase.
