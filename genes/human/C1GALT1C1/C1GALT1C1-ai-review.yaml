    label: Golgi membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1964505
  qualifier: located_in
  review:
    summary: >-
      Reactome places Cosmc in the Golgi membrane because that is the compartment of the reaction
      it is modelling (C1GALT1 transferring galactose to the Tn antigen). Cosmc itself is
      an endoplasmic reticulum protein: it acts co-translationally on nascent T-synthase,
      and it is the folded client, not the chaperone, that travels on to the Golgi. The compartment
      assignment has been inherited from the client's site of action.
    action: MODIFY
    reason: >-
      ER residence is not merely asserted in review prose: the 18-residue transmembrane domain
      of Cosmc is itself the ER-retention determinant, and is sufficient to confer ER retention
      on chimeras, while a single TMD cysteine is required for the disulfide-bonded dimer
      and for retention. Cosmc is therefore actively held in the ER by a mapped signal rather
      than passing through it. Replacing Golgi membrane with endoplasmic reticulum membrane
      keeps the type II membrane topology that UniProt supports while correcting the organelle.
      Note that UniProt itself asserts only the generic "Membrane" here and commits to neither
      compartment, so this correction does not contradict it.
    proposed_replacement_terms:
    - id: GO:0005789
      label: endoplasmic reticulum membrane
    supported_by:
