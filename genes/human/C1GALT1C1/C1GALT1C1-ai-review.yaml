- term:
    id: GO:0016263
    label: N-acetylgalactosaminide beta-1,3-galactosyltransferase activity
  evidence_type: IMP
  original_reference_id: PMID:37216524
  qualifier: enables
  negated: true
  review:
    summary: >-
      This is a NOT annotation: GOA explicitly asserts that C1GALT1C1 does not enable N-acetylgalactosaminide
      beta-1,3-galactosyltransferase activity. The curators drew exactly the right distinction
      from this paper. Patient cells carrying hypomorphic C1GALT1C1 variants show substantially
      reduced T-synthase activity, but the paper's conclusion is that this is a chaperonopathy:
      Cosmc is required for the activity to be present, while the activity itself belongs
      to C1GALT1.
    action: ACCEPT
    reason: >-
      Negative annotations of this kind are valuable and, here, correct. A mutant-phenotype
      assay that reads out a client enzyme's activity cannot distinguish necessity from possession.
      Crucially, Cosmc is not a protein from an unrelated fold class: UniProt assigns it to
      the glycosyltransferase 31 family, Beta3-Gal-T subfamily, the same family as its client
      C1GALT1, and it was originally published as a glycosyltransferase before being shown
      to have none. It is a degenerate GT31 member -- a pseudoenzyme that retains the family
      fold while having lost catalysis -- which is precisely why the negation is needed: sequence-
      and family-based inference will keep proposing the activity, and only an explicit NOT
      stops it. By recording the negation, GOA prevents the client's activity from being attributed
      to its chaperone and blocks the error from propagating by orthology or by rule-based
      inference. Cosmc's genuine molecular function is the chaperone activity proposed on
      the GO:0005515 row above; this row is the complementary statement of what it is not.
    supported_by:
    - reference_id: PMID:37216524
      supporting_text: Cosmc is an ER-localized molecular chaperone required for T-synthase
        function.
    - reference_id: PMID:37216524
      supporting_text: >-
        This variant leads to a significant loss of Cosmc chaperone expression and subsequently
        causes a substantial reduction in T-synthase activity
    - reference_id: PMID:37216524
      supporting_text: requires the action of a single Golgi enzyme T-synthase (encoded by
        C1GALT1)
    - reference_id: PMID:18695044
      supporting_text: >-
        We show that Cosmc is an endoplasmic reticulum (ER)-localized adenosine triphosphate
        binding chaperone that binds directly to human T-synthase.
    - reference_id: file:human/C1GALT1C1/C1GALT1C1-hypotheses/function-hypothesis-go-0016263/openscientist.md
      supporting_text: >-
        The catalytic activity GO:0016263 (synthesis of Galβ1-3GalNAc-α-Ser/Thr, the T antigen)
        belongs to **C1GALT1, the client enzyme — not to C1GALT1C1**.
