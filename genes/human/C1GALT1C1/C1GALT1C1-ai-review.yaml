core_functions:
- description: >-
    C1GALT1C1 (Cosmc) acts in the endoplasmic reticulum membrane as the dedicated
    co-translational folding chaperone for core 1 beta-1,3-galactosyltransferase
    (C1GALT1). It engages the nascent T-synthase polypeptide during translation,
    prevents its aggregation and enables it to reach a stable, active
    conformation. It has no catalytic activity of its own, and no client other
    than C1GALT1 is known, so its molecular function is exercised entirely in the
    service of core 1 mucin-type O-glycan biosynthesis.
  molecular_function:
    id: GO:0044183
    label: protein folding chaperone
  directly_involved_in:
  - id: GO:0006493
    label: protein O-linked glycosylation
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
