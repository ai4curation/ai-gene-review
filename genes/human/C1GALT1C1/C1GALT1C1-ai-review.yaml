  original_reference_id: Reactome:R-HSA-1964505
  qualifier: located_in
  review:
    summary: >-
      Reactome places Cosmc in the Golgi membrane because that is the compartment
      of the reaction it is modelling (C1GALT1 transferring galactose to the Tn
      antigen). Cosmc itself is an endoplasmic reticulum protein: it acts
      co-translationally on nascent T-synthase, and it is the folded client, not
      the chaperone, that travels on to the Golgi. The compartment assignment has
      been inherited from the client's site of action.
    action: MODIFY
    reason: >-
      The primary literature is explicit that Cosmc is ER-localised while the
      T-synthase is the Golgi enzyme, and the two statements appear in the same
      sentence pair of the paper describing the chaperonopathy. Replacing Golgi
      membrane with endoplasmic reticulum membrane keeps the type II membrane
      topology that UniProt supports while correcting the organelle.
    proposed_replacement_terms:
    - id: GO:0005789
      label: endoplasmic reticulum membrane
    supported_by:
    - reference_id: PMID:37216524
      supporting_text: >-
        Cosmc is an ER-localized molecular chaperone required for T-synthase function.
    - reference_id: PMID:37216524
      supporting_text: >-
        requires the action of a single Golgi enzyme T-synthase (encoded by C1GALT1)
