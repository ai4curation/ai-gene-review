id: Q96EU7
gene_symbol: C1GALT1C1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  C1GALT1C1 (Cosmc) is an X-linked, endoplasmic-reticulum-localised molecular
  chaperone that is dedicated to a single client protein: core 1
  beta-1,3-galactosyltransferase (C1GALT1, the T-synthase). It is a single-pass
  type II membrane protein with no catalytic activity of its own. Cosmc binds
  nascent C1GALT1 co-translationally and is required for its correct folding,
  stability and oligomerisation; in the absence of Cosmc the T-synthase misfolds,
  aggregates and is degraded, so no functional enzyme reaches the Golgi. Because
  the T-synthase performs the committed galactosylation step that converts the
  Tn antigen (GalNAc-alpha1-O-Ser/Thr) into the core 1 structure
  (Gal-beta1-3-GalNAc-alpha1-O-Ser/Thr, the T antigen), Cosmc controls flux
  through essentially all extended mucin-type O-glycan biosynthesis without
  itself transferring any sugar. Loss of Cosmc function therefore phenocopies
  loss of C1GALT1: cells expose the truncated Tn antigen instead of elaborating
  core 1-derived O-glycans. Somatic Cosmc mutations underlie Tn-positive
  epithelium in a subset of ulcerative colitis patients and the Tn syndrome, and
  germline hypomorphic variants cause a multisystem chaperonopathy presenting as
  a congenital disorder of glycosylation. Reduced Cosmc function in
  IgA-producing plasma cells is one route to the galactose-deficient IgA1 that
  initiates IgA nephropathy.
