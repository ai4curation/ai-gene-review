    label: extracellular exosome
  evidence_type: HDA
  original_reference_id: PMID:19199708
  qualifier: located_in
  review:
    summary: >-
      Detection in a shotgun proteomic catalogue of 491 proteins from a human
      parotid saliva exosome fraction. No Cosmc-specific experiment was performed
      and no function is implied by presence in that fraction.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Large exosome and secretome proteomic catalogues routinely recover abundant
      ER residents, and an ER-resident co-translational chaperone has no
      established function in the extracellular space. The observation is not
      disputed, but as a localisation claim for this protein it is an artefact of
      the method's coverage rather than evidence of an extracellular pool.
    supported_by:
    - reference_id: PMID:19199708
      supporting_text: >-
        we catalogued 491 proteins in the exosome fraction of human parotid saliva
