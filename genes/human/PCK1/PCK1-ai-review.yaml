suggested_questions:
- question: Can the GTP-dependent protein serine kinase activity of PCK1 on INSIG1 Ser207 and INSIG2 Ser151
    (PMID:32322062) be independently reproduced with purified recombinant PCK1 and INSIG proteins? The
    test needs mutants that separate kinase activity from PEPCK activity (a PEPCK-dead but kinase-competent
    mutant, and the reverse) and controls that exclude co-purifying kinases.
- question: Does the AKT1 -> PCK1 (pSer90) -> INSIG1/2 -> SCAP-SREBP axis operate in non-transformed human
    hepatocytes or adipocytes under physiological insulin signalling, or is it specific to hepatocellular
    carcinoma cells and virus-infected cell lines (PMID:39433189)?
- question: Because PCK1 opposes SREBP-SCAP retention in the ER (it releases SCAP-SREBP), should the GO-CAM
    export that produced acts_upstream_of_or_within GO:0036316 'SREBP-SCAP complex retention in endoplasmic
    reticulum' for PCK1, propagated by ISO to mouse Pck1, be corrected? Would a negative-regulation relation,
    or only GO:0046889 positive regulation of lipid biosynthetic process, represent the model correctly?
- question: How does PCK1 partition between the gluconeogenic (OAA to PEP) and anaplerotic (PEP to OAA)
    directions in vivo, given acetylation-dependent switching shown with purified enzyme (PMID:30193097)?
suggested_experiments:
- description: In vitro kinase assays with purified recombinant human PCK1 (wild type, S90D/S90A, and
    active-site mutants that abolish PEPCK activity), radiolabelled [gamma-32P]GTP and purified INSIG1/INSIG2
    peptides or proteins, analysed by mass spectrometry for site-specific Ser207/Ser151 phosphorylation.
  experiment_type: in vitro biochemical reconstitution
  hypothesis: If PCK1 is a bona fide GTP-dependent protein kinase, phospho-transfer to INSIG Ser207/Ser151
    will be direct, stoichiometric, dependent on GTP, and separable from PEPCK catalysis.
- description: Knock-in of PCK1 S90A or a kinase-specific mutant in primary human hepatocytes or iPSC-derived
    hepatocytes, then measurement of INSIG phosphorylation, SREBP1/2 processing and de novo lipogenesis
    under insulin stimulation.
  experiment_type: genome editing / metabolic flux
  hypothesis: The PCK1-INSIG axis contributes to insulin-stimulated SREBP activation in non-transformed
    human liver cells.
