- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IDA
  original_reference_id: PMID:32322062
  qualifier: located_in
  review:
    summary: pSer90-PCK1 translocates to the endoplasmic reticulum in HCC cells.
    action: KEEP_AS_NON_CORE
    reason: Per PMID:32322062, a pool of PCK1 relocates to the ER only after AKT phosphorylates Ser90,
      where it is proposed to phosphorylate INSIG1/2. The localisation is conditional and tied to the
      non-core moonlighting kinase function, so it is kept as non-core. The GTP-dependent protein serine
      kinase activity of PCK1 rests on a single study in human hepatocellular carcinoma cells (PMID:32322062;
      our cached copy is abstract-only, so the curator's IDA, made from the full text, is retained). The
      only follow-up found (PMID:39433189, PRRSV-infected MARC-145 monkey cells) invokes the same AKT/PCK1/INSIG/SREBP
      axis but is not an independent reconstitution with purified enzyme, and no other laboratory has
      separated the proposed kinase activity from PEPCK catalysis with kinase-dead/PEPCK-competent mutants.
      The activity is therefore kept as a non-core, conditional (pSer90-dependent) moonlighting function;
      the core function of PCK1 is GTP-dependent PEP carboxykinase activity in gluconeogenesis, glyceroneogenesis
      and cataplerosis.
    supported_by:
    - reference_id: PMID:32322062
      supporting_text: Phosphorylated PCK1 translocates to the endoplasmic reticulum, where it uses GTP
        as a phosphate donor to phosphorylate INSIG1 at Ser207 and INSIG2 at Ser151
