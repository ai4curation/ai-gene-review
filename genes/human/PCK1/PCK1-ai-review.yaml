- description: Catalyses the GTP-dependent decarboxylation and phosphorylation of oxaloacetate to phosphoenolpyruvate
    in the cytosol, the committed and rate-limiting step of gluconeogenesis in liver and kidney. Mn2+
    is bound as cofactor and GTP as phosphoryl donor.
  molecular_function:
    id: GO:0004613
    label: phosphoenolpyruvate carboxykinase (GTP) activity
  directly_involved_in:
  - id: GO:0006094
    label: gluconeogenesis
  - id: GO:0006107
    label: oxaloacetate metabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:11851336
    supporting_text: These structures are the first to be determined for a GTP-dependent PEPCK, and provide
      the first view of a novel GTP-binding site unique to the GTP-dependent PEPCK family
  - reference_id: PMID:11851336
    supporting_text: PEPCK catalyzes the rate-limiting step in the metabolic pathway that produces glucose
      from lactate and other precursors derived from the citric acid cycle
  - reference_id: PMID:26971250
    supporting_text: Whole exome sequencing revealed a homozygous 12-bp deletion in PCK1 (MIM 614168)
      encoding cytosolic phosphoenolpyruvate carboxykinase (PEPCK); enzymatic studies subsequently confirmed
      its pathogenic nature
  - reference_id: Reactome:R-HSA-70241
    supporting_text: The transfer of a high-energy phosphate bond from GTP to oxaloacetate (OA), to form
      phosphoenolpyruvate (PEP), GDP, and CO2, is catalyzed by cytosolic phosphoenolpyruvate carboxykinase
      PCK1
- description: In adipose tissue and liver, the same PEPCK reaction supplies PEP for glyceroneogenesis,
    the synthesis of glycerol-3-phosphate used to re-esterify fatty acids into triglyceride.
  molecular_function:
    id: GO:0004613
    label: phosphoenolpyruvate carboxykinase (GTP) activity
  directly_involved_in:
  - id: GO:0006114
    label: glycerol biosynthetic process
  - id: GO:0046166
    label: glyceraldehyde-3-phosphate biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:11792850
