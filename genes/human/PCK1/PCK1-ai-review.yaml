id: P35558
gene_symbol: PCK1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PCK1 encodes cytosolic phosphoenolpyruvate carboxykinase [GTP] (PEPCK-C), a monomeric, Mn2+-dependent
  enzyme that converts oxaloacetate and GTP to phosphoenolpyruvate, GDP and CO2. Expressed mainly in liver,
  kidney cortex, small intestine and adipose tissue, it catalyses the committed, rate-limiting step of
  gluconeogenesis. It also drives glyceroneogenesis (glycerol-3-phosphate synthesis for triglyceride re-esterification)
  and cataplerotic removal of citric-acid-cycle intermediates. Hormones regulate PCK1 mainly at the transcriptional
  level (induction by glucagon/cAMP and glucocorticoids, repression by insulin and glucose). Lysine acetylation
  can switch the enzyme toward the reverse, anaplerotic PEP-to-oxaloacetate reaction. One study in hepatocellular
  carcinoma cells reports that AKT-phosphorylated PCK1 (Ser90) moves to the endoplasmic reticulum and
  acts as a GTP-dependent protein kinase on INSIG1/2, releasing SCAP-SREBP and promoting lipogenesis.
  Biallelic loss-of-function variants cause cytosolic PEPCK deficiency, with hypoglycemia, liver dysfunction
  and urinary excretion of citric-acid-cycle intermediates.
