        of melanin pigment in the skin, hair, and eye
- term:
    id: GO:0004097
    label: catechol oxidase activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8878581
  qualifier: enables
  review:
    summary: Reactome describes TYRP1 as a DHICA oxidase (oxidation of DHICA to IQCA).
    action: KEEP_AS_NON_CORE
    reason: Purified human TYRP1 contains zinc and lacks DHICA oxidase activity, which appears only after
      copper substitution; the native activity in melanosomes remains disputed. Retained as a possible,
      non-core activity rather than removed.
    supported_by:
    - reference_id: Reactome:R-HSA-8878581
    - reference_id: PMID:28661582
      supporting_text: We show that the active site contains two zinc ions, rather than copper ions as
        in tyrosinases, which makes it unlikely that human TYRP1 is a redox enzyme
    - reference_id: PMID:28661582
      supporting_text: exchanging the Zn2+/Cu2+ cofactors of TYRP1/TYR for Cu2+/Zn2+ conferred
- term:
