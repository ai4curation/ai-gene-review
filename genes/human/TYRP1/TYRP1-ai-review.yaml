    label: tyrosinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:98880
  - PANTHER:PTN000895596
  - UniProtKB:P14679
  - UniProtKB:P17643
  review:
    summary: PAINT propagation of tyrosinase activity across the tyrosinase family.
    action: REMOVE
    reason: 'TYRP1 has diverged from TYR: its binuclear site binds zinc and the purified lumenal domain
      lacks tyrosine hydroxylase and L-DOPA oxidase activity. Tyrosinase activity is a TYR function not
      retained by TYRP1.'
    supported_by:
    - reference_id: PMID:28661582
      supporting_text: We show that the active site contains two zinc ions, rather than copper ions as
        in tyrosinases, which makes it unlikely that human TYRP1 is a redox enzyme
    - reference_id: PMID:28661582
      supporting_text: the intramelanosomal domain of TYRP1 did not display any DHICA activity nor tyrosine
        hydroxylase or l
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000895596
        source_status: SOURCE_BAD
        comment: 'The ancestral node places tyrosinase activity across the family, but the TYRP1 subfamily
          has diverged: the human protein binds zinc rather than copper and the purified lumenal domain
          shows no tyrosine hydroxylase or L-DOPA oxidase activity.'
