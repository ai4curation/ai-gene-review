core_functions:
- description: Melanosomal membrane protein required for normal eumelanin synthesis; proposed to oxidize
    DHICA (copper-dependent) and to stabilize tyrosinase within the melanosome.
  directly_involved_in:
  - id: GO:0042438
    label: melanin biosynthetic process
  - id: GO:0048023
    label: positive regulation of melanin biosynthetic process
  locations:
  - id: GO:0033162
    label: melanosome membrane
  supported_by:
  - reference_id: PMID:21996312
    supporting_text: the missense mutation, p.C30R, was functionally incapable of melanin synthesis with
      in vitro experiments
  - reference_id: PMID:28661582
    supporting_text: the effect of mutations in the TYRP1 gene suggest the utmost importance of TYRP1
      for the biosynthesis of melanin
  - reference_id: Reactome:R-HSA-8878581
    supporting_text: is an abundant protein in the melanosome membrane
- description: Cytoplasmic tail binds PDZ-domain adaptors (GIPC) through its C-terminal Ser-Val-Val motif,
    directing biosynthetic sorting of TYRP1 to melanosomes.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  locations:
  - id: GO:0033162
    label: melanosome membrane
  supported_by:
  - reference_id: PMID:11441007
    supporting_text: Carboxyl-terminal amino acid residues, Ser-Val-Val, of gp75 are necessary and sufficient
      for interaction of gp75 with the single PDZ domain in GIPC.
  - reference_id: PMID:21291857
    supporting_text: GIPC interacts with newly synthesized melanosomal protein TRP1 in the Golgi region
suggested_questions:
- question: Does melanosomal TYRP1 acquire copper in vivo (for example through ATP7A) and thereby function
    as a genuine DHICA oxidase, or is its contribution to pigmentation structural?
- question: What fraction of TYRP1 reaches the plasma membrane in normal melanocytes versus melanoma cells,
    and what trafficking step determines this?
suggested_experiments:
- description: Measure metal content and DHICA oxidase activity of TYRP1 immunopurified from human melanosomes
    (rather than from insect-cell expression) to settle the native cofactor and activity.
- description: Quantify surface versus melanosomal TYRP1 by surface biotinylation and antibody binding
    in primary melanocytes and matched melanoma lines, testing dependence on AP-1 and the cytoplasmic
    sorting motifs.
