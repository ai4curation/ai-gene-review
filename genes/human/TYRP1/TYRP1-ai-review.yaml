id: P17643
gene_symbol: TYRP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TYRP1 (tyrosinase-related protein 1, gp75) is a single-pass type I membrane glycoprotein
  of melanocytes and pigmented epithelia, and the most abundant protein of the melanosome membrane. Its
  large lumenal domain contains a cysteine-rich EGF-like subdomain and a tyrosinase-like subdomain with
  a binuclear metal site, while its short cytoplasmic tail carries sorting signals, including a C-terminal
  PDZ-binding motif recognized by GIPC and an AP-1-dependent signal, that route the protein from the Golgi
  through endosomes to maturing melanosomes. TYRP1 is required for normal eumelanin synthesis and influences
  the type of melanin produced; mouse Tyrp1 oxidizes DHICA, whereas purified human TYRP1 binds zinc and
  shows this activity only after copper substitution, so whether the human protein is catalytic or acts
  mainly by stabilizing tyrosinase remains unsettled. Biallelic loss-of-function variants cause oculocutaneous
  albinism type 3. In melanoma cells a minor pool of TYRP1 is exposed at the plasma membrane, which is
  why it is used as an antibody and CAR-T target.
