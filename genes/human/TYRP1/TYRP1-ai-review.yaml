  review:
    summary: Ortholog-transferred eye development.
    action: MARK_AS_OVER_ANNOTATED
    reason: Loss of TYRP1 reduces eye pigmentation (OCA3) but TYRP1 does not execute eye morphogenesis;
      the pigmentation aspect is captured by eye pigmentation.
