id: Q14028
gene_symbol: CNGB1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CNGB1 encodes beta subunits of sensory cyclic-nucleotide-gated cation channels and the
  soluble glutamic acid-rich product GARP2. In rod photoreceptors, CNGB1 assembles with three CNGA1
  subunits at the outer-segment plasma membrane, contributing to the pore, cGMP recognition, gating
  and channel targeting. Olfactory beta-containing channels assemble with CNGA2 and CNGA4 and couple
  cAMP signals to depolarizing cation currents under calcium/calmodulin feedback. Human CNGB1 variants
  cause recessive retinitis pigmentosa. The separate GARP2 product is inferred to restrain basal
  rod PDE6 activity from biochemical studies of its bovine ortholog.
