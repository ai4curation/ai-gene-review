- description: The soluble human GARP2 product Q14028-3 is inferred to inhibit basal, nonactivated
    rod PDE6 through orthologous protein interaction. Purified native bovine GARP2/Q28181-5 associates
    with PDE6 and suppresses basal activity, but does not significantly inhibit the tested transducin-
    or trypsin-activated enzyme. Human and bovine GARP2 architectures are authenticated but their
    sequences differ; direct human inhibition, identical kinetics and physiological dark-noise suppression
    have not been established. This activity is separate from the membrane-channel products. The
    human outer-segment location is likewise ortholog-inferred from the bovine rod material, not
    a direct human localization assay in that study.
