  title: A new subunit of the cyclic nucleotide-gated cation channel in retinal rods.
  findings:
  - statement: Cloned human beta does not produce functional channels alone but confers native-like
      behavior when coexpressed with human alpha.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete authentic abstract was read; no full-paper Methods/Results read is
      claimed. It explicitly describes cloned human retinal beta, outer-segment labeling and alpha/beta
      functional coexpression. Later full human structural studies corroborate the role.
