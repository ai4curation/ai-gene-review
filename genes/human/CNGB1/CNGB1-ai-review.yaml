- id: PMID:11379879
  title: Segregation of a mutation in CNGB1 encoding the beta-subunit of the rod cGMP-gated channel
    in a family with autosomal recessive retinitis pigmentosa.
  findings:
  - statement: Human CNGB1 G993V cosegregates with recessive retinitis pigmentosa in the studied
      family.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The genuine abstract cache is unchanged. Authentic original PDF text was fully
      read in the preceding CNGA1 assessment and its CNGB1 mutation/segregation Results reread here.
      This is human family genetics, not direct mutant-channel electrophysiology.
- id: PMID:15557452
  title: A homozygosity-based search for mutations in patients with autosomal recessive retinitis
    pigmentosa, using microsatellite markers.
  findings:
  - statement: A patient with a homozygous CNGB1 splice-donor variant has retinal degeneration and
      nonrecordable electroretinograms.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The genuine abstract cache is unchanged. Actual indexed author-uploaded full Methods,
      Results and table text were inspected; direct publisher retrieval failed. No PDF figure-pixel
      read is claimed. Family DNA was unavailable for the CNGB1 patient, so no CNGB1 segregation
      or assayed splice defect is claimed.
- id: PMID:19299621
  title: Ankyrin-G promotes cyclic nucleotide-gated channel transport to rod photoreceptor sensory
    cilia.
  findings:
  - statement: Human CNGB1 C-terminal sequences bind ankyrin-G and support targeting of assembled
      rod channels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete primary Methods/Results and captions were read from the genuine
      full cache. Human beta constructs, native bovine association and Xenopus targeting experiments
      are distinguished. No independent native human-retina imaging or figure-pixel inspection is
      claimed.
- id: PMID:20890309
  title: 'Growth factor receptor-bound protein 14: a new modulator of photoreceptor-specific cyclic-nucleotide-gated
    channel.'
  findings:
  - statement: GRB14 associates with rod-channel beta-containing preparations; exact human beta construct
      and interface scope remain limited.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The selected cache remains abstract-only. Authentic publisher text and original
      supplementary Methods/captions were read separately. Positive beta co-immunoprecipitation is
      supported; exact donated beta-plasmid species and beta-specific two-hybrid testing remain unresolved
      despite the curated human pair mapping.
- id: PMID:24164424
  title: Cyclic nucleotide-gated channel subunit glycosylation regulates matrix metalloproteinase-dependent
    changes in channel gating.
  findings:
  - statement: Mixed human-beta/bovine-alpha channels conduct cGMP-dependent cation currents and
      show altered gating after matrix metalloproteinase treatment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected actual Methods and Results from the genuine full cache were read. HA-tagged
      human beta plus bovine alpha in Xenopus oocytes is the explicit preparation; no complete beta
      accession or all-product comparison was given. Beta-specific cGMP occupancy is corroborated
      independently by the later human structure.
- id: PMID:34699778
  title: Structural mechanisms of assembly, permeation, gating, and pharmacology of native human
    rod CNG channel.
  findings:
  - statement: Human rod CNGA1/CNGB1 forms a 3:1 cGMP-gated cation channel; beta contributes ligand
      recognition, the pore and asymmetric gating.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Selected complete Methods, Results and captions in the genuine full cache were
      read. Human CNGB1 NP_001288.3 residues456–1251 and full-length functional comparisons are explicit.
      No whole-supplement or figure-pixel inspection is claimed. This paper supports rod assembly,
      ligand binding and gating, not an independently inspected calmodulin-binding assay; the later
      olfactory study revises the earlier beta-helix assignment. The saved UniProt SUBUNIT paragraph
      combines evidence from different claims: its CaM modulation clause is explicitly by similarity,
      and the separate CaM1/CaM2 feature records cite bovine Q28181 with ECO:0000250. The paragraph-level
      PMID/ECO list therefore does not by itself establish that this rod study performed the CaM
      experiment. Direct human-construct CaM support comes from PMID:41131016.'
- id: PMID:7479749
  title: Mutations in the gene encoding the alpha subunit of the rod cGMP-gated channel in autosomal
    recessive retinitis pigmentosa.
  findings:
  - statement: Human CNGA1 mutations impair channel function and targeting; this is not a direct
      CNGB1 perturbation experiment.
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: The selected cache remains abstract-only. Original scanned pages10177,10178,10180
      were personally inspected in the prior CNGA1 assessment, including Methods, Results, Fig3 and
      Table2. Their direct mutation and expression experiments concern CNGA1 rather than CNGB1. Independent
      CNGB1 evidence supports the existing visual annotation.
