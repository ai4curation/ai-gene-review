core_functions:
- description: 'Channel-bearing CNGB1 contributes to an assembled intracellular cyclic-nucleotide-gated
    cation channel: rod complexes contain three CNGA1 and one CNGB1, whereas the tested human olfactory
    complex contains two CNGA2, one CNGA4 and one CNGB1. Rod cGMP gating and olfactory cAMP gating
    belong to this integrated activity. Human structural preparations use CNGB1 456–1251, with full-length
    functional comparisons in the rod study; this engineered sequence is not the complete RCNC2A
    product. Rat native B1b is independently sequence-defined and must not be assigned to a human
    isoform solely by name. In the tested human olfactory complex, the CNGB1 456–1251 construct binds
    calmodulin through N- and C-terminal sites and supports calcium-dependent channel inhibition.
    The interface assignment combines a locally low-resolution map, prediction-assisted modeling,
    beta-specific cross-links and deletion tests; it is not an all-product binding claim. The shared
    ciliary-membrane location includes rod outer-segment plasma membrane and olfactory sensory-cilium
    membrane. Human-beta targeting in Xenopus rods and native rodent localization support these specific
    contexts; the rod-specific GO:0042622 source assertions remain explicit, without duplicating
    its GO:0060170 parent in this integrated core.'
