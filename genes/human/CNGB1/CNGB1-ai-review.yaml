- id: PMID:16407240
  title: The glutamic acid-rich protein-2 (GARP2) is a high affinity rod photoreceptor phosphodiesterase
    (PDE6)-binding protein that modulates its catalytic properties.
  findings:
  - statement: Native bovine GARP2 binds PDE6 and suppresses nonactivated basal activity, without
      significant suppression of the tested activated enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete primary Methods/Results and Discussion were read from the genuine
      full cache, including purification controls, native bovine source, PDE6 association and basal-versus-activated
      assays. Human activity is an explicit ortholog inference for Q14028-3, not IDA.
- id: PMID:7590744
  title: cDNA, gene structure, and chromosomal localization of human GAR1 (CNCG3L), a homolog of
    the third subunit of bovine photoreceptor cGMP-gated channel.
  findings:
  - statement: The historical human GARP clone corresponds to the current GARP2 architecture with
      the documented R100H sequence difference.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The available genuine abstract is explicitly truncated; full primary text was not
      recovered. Official legacy nucleotide/protein records independently authenticate the 299-aa
      human architecture, with H100 versus current R100 matching UniProt VAR_058691. This source
      establishes product identity, not PDE6 inhibition.
- id: PMID:15634774
  title: Impaired channel targeting and retinal degeneration in mice lacking the cyclic nucleotide-gated
    channel subunit CNGB1.
  findings:
  - statement: Mouse Cngb1 channel disruption reduces rod current and channel abundance before progressive
      retinal degeneration, while soluble GARP expression remains.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete mouse Methods/Results and captions from the authenticated genuine
      full cache were read. Exon26 disruption removes functional channel beta while soluble GARPs
      persist. Shared publication bytes are identical to published CNGA1 PR4746; no weaker incidental
      abstract is selected.
- id: PMID:10352032
  title: Divalent cation selectivity is a function of gating in native and recombinant cyclic nucleotide-gated
    ion channels from retinal photoreceptors.
  findings:
  - statement: Recombinant bovine alpha/beta rod channels conduct sodium and calcium, with ligand-
      and assembly-dependent relative permeability.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Methods and recombinant-channel Results from the genuine full
      cache were read. Bovine alpha/beta oocyte experiments are distinguished from native salamander
      rods and fish cones; historical assumed stoichiometry is not imported.
- id: PMID:16980309
  title: Loss of CNGB1 protein leads to olfactory dysfunction and subciliary cyclic nucleotide-gated
    channel trapping.
  findings:
  - statement: Mouse Cngb1 is required for normal ciliary channel abundance, cAMP sensitivity and
      kinetics of olfactory electrical signaling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete mouse Methods/Results and relevant Discussion from the genuine
      full cache were read. Actual olfactory cAMP currents, localization, calcium responses and behavioral
      assays support the ortholog role; human physiological isoform identity is not inferred from
      the rodent B1b name.
- id: PMID:10377344
  title: The native rat olfactory cyclic nucleotide-gated channel is composed of three distinct subunits.
  findings:
  - statement: Rat olfactory B1b assembles with the olfactory alpha subunits and contributes native-like
      cAMP sensitivity, sodium/potassium conduction and gating.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete rat cloning, localization and electrophysiological Methods/Results
      in the genuine full cache were read. Rat AF068572/AAC19120.1 is858aa; native and recombinant
      channel comparisons are explicit. Historical alpha numbering differs from current gene names.
- id: PMID:28053034
  title: Simultaneous Loss of NCKX4 and CNG Channel Desensitization Impairs Olfactory Sensitivity.
  findings:
  - statement: CNGB1 CaM-site/NCKX4 perturbation alters adult olfactory responses and OMP amount,
      without a reduced OMP-positive neuron fraction or changed GAP43 signal.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected actual full Methods, Results and Discussion were read from authentic PMC5214624
      HTML, separately from the unchanged normal abstract. The failed BioC error body and publisher403
      page are excluded. Adult2–6month mouse experiments are not a developmental maturation assay.
- id: PMID:21809342
  title: Functional cGMP-gated channels in cerebellar granule cells.
  findings:
  - statement: Rat cultured granule cells show beta-containing CNG-channel signals at presynaptic
      sites and channel-associated calcium responses.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The complete genuine abstract explicitly reports cultured rat cerebellar granule-cell
      expression, synapsin colocalization and functional calcium responses. Bounded publisher/repository
      attempts did not recover full Results; exact neuronal beta splice form is only presumed in
      the abstract.
- id: PMID:41131016
  title: Structural mechanisms of assembly, gating, and calmodulin modulation of human olfactory
    CNG channel.
  findings:
  - statement: The engineered human olfactory 2:1:1 channel binds calmodulin at beta-subunit N- and
      C-terminal regions; cross-linking and deletion tests support calcium-dependent inhibition,
      alongside direct cAMP-dependent channel activation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete primary Methods/Results and captions from the genuine normal
      full cache were read. Human CNGB1 residues456–1251 are expressed with CNGA2/CNGA4; the engineered796aa
      sequence does not match complete RCNC2A. Low-resolution CaM regions use prediction-assisted
      modeling, deletion tests and crosslinking; not every interface is atomically resolved.
