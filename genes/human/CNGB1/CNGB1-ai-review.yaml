- term:
    id: GO:0005222
    label: intracellularly cAMP-activated cation channel activity
  evidence_type: IDA
  original_reference_id: PMID:34699778
  qualifier: enables
  review:
    summary: Retain directly measured secondary cAMP activation of the rod channel.
    action: ACCEPT
    reason: Human rod CNGA1/CNGB1 channels carry cAMP-activated currents at high cAMP concentrations
      (PMID:34699778), although cAMP is a partial agonist and the captured cAMP-bound structure is
      closed. This positive capability belongs to the gene-level cyclic-nucleotide channel function,
      whose physiological cAMP role is independently demonstrated in human olfactory CNGA2/CNGA4/CNGB1
      complexes (PMID:41131016). The rod experiment does not establish cAMP as the physiological
      rod agonist.
    supported_by:
    - reference_id: PMID:34699778
    - reference_id: PMID:41131016
