core_functions:
- description: Phosphorylates light-activated rhodopsin (and cone opsins) on C-terminal serine and threonine residues
    at the photoreceptor outer segment disc membrane, enabling arrestin capping and thereby terminating opsin signaling
    and allowing photoresponse recovery. Regulated by Ca2+-recoverin (inhibitory in darkness; bovine) and PKA phosphorylation
    of Ser-21; membrane-anchored by C-terminal farnesylation (bovine).
  molecular_function:
    id: GO:0050254
    label: rhodopsin kinase activity
  directly_involved_in:
  - id: GO:0016059
    label: negative regulation of opsin-mediated signaling pathway
  - id: GO:0036368
    label: photoresponse recovery
  locations:
  - id: GO:0097381
    label: photoreceptor disc membrane
  - id: GO:0001750
    label: photoreceptor outer segment
  supported_by:
  - reference_id: PMID:15946941
    supporting_text: In rod cells of the vertebrate retina, phosphorylation of rhodopsin is mediated by GRK1.
  - reference_id: PMID:9419375
    supporting_text: The role of RK in rods would thus be to accelerate inactivation of activated rhodopsin molecules
      that in concert with regeneration leads to the normal rate of recovery of sensitivity.
  - reference_id: PMID:10097103
    supporting_text: These data suggest that RK is solely responsible for normal rhodopsin deactivation in the dark-adapted
      rod.
suggested_questions:
- question: Is the Ca2+-recoverin inhibition and farnesyl anchoring characterized on bovine GRK1 conserved quantitatively
    in human GRK1, and how is the GRK1/GRK7 division of labour set in human cones?
suggested_experiments:
- hypothesis: Human GRK1 is inhibited by human recoverin with a Ca2+ sensitivity like the bovine enzyme.
  description: Reconstitute farnesylated recombinant human GRK1 with human recoverin and rod outer segment membranes
    and measure rhodopsin phosphorylation across free Ca2+ concentrations, with an N-terminal (residues 1-15) deletion
    as control.
status: COMPLETE
