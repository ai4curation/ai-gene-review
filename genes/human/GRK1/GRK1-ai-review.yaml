- id: PMID:10097103
  title: Abnormal photoresponses and light-induced apoptosis in rods lacking rhodopsin kinase.
  findings:
  - statement: Mouse Grk1 knockout abolishes light-dependent rhodopsin phosphorylation and prolongs single-photon
      responses.
    supporting_text: These data suggest that RK is solely responsible for normal rhodopsin deactivation in the dark-adapted
      rod.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mouse; full text cached.
- id: PMID:1730692
  title: Isoprenylation of a protein kinase. Requirement of farnesylation/alpha-carboxyl methylation for full enzymatic
    activity of rhodopsin kinase.
  findings:
  - statement: Bovine GRK1 is farnesylated and carboxyl-methylated; non-processed kinase is about 4-fold less active.
    supporting_text: A time course of Rho* phosphorylation revealed that non-processed RK is approximately 4-fold
      less active than wild-type RK.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Bovine enzyme.
- id: PMID:7629115
  title: Ca(2+)-dependent interaction of recoverin with rhodopsin kinase.
  findings:
  - statement: Recoverin makes rhodopsin kinase activity Ca2+-sensitive (inhibition at high Ca2+).
    supporting_text: When recoverin was added, the activity of RK became sensitive to free Ca2+, with EC50 = 3 microM.
