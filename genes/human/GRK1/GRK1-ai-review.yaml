  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008271
  review:
    summary: 'True but general: protein kinase activity, protein serine/threonine kinase activity and G protein-coupled
      receptor kinase activity are all is_a ancestors of rhodopsin kinase activity (GO:0050254), the specific activity
      of GRK1.'
    action: MODIFY
    reason: GO:0050254 rhodopsin kinase activity (ATP + rhodopsin = ADP + phosphorhodopsin) is_a GO:0004703 G protein-coupled
      receptor kinase activity, is_a GO:0004674 protein serine/threonine kinase activity, is_a GO:0004672 protein
      kinase activity. The human enzyme phosphorylates rhodopsin (PMID:15946941; recombinant enzyme, bovine rod
      outer segment substrate) and the gene already carries GO:0050254 (IDA, IBA, IEA, TAS). The generic rows are
      therefore refined to that descendant rather than removed. No other physiological GPCR substrate of GRK1 is
      established beyond rod and cone opsins, which the GO:0050254 definition covers through its narrow synonym
      cone opsin kinase activity. The TAS rows cite PMID:1656454, the RK cDNA cloning paper whose abstract does
      not name a species (human GRK1 was cloned later, PMID:8812493); the claim itself is sound.
    proposed_replacement_terms: &id003
    - id: GO:0050254
      label: rhodopsin kinase activity
    supported_by: &id004
    - reference_id: PMID:15946941
      supporting_text: In rod cells of the vertebrate retina, phosphorylation of rhodopsin is mediated by GRK1.
