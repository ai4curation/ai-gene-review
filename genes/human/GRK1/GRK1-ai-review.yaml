- term:
    id: GO:0002029
    label: desensitization of G protein-coupled receptor signaling pathway
  evidence_type: IC
  original_reference_id: PMID:15946941
  qualifier: involved_in
  supporting_entities:
  - GO:0050254
  review:
    summary: GRK1-mediated phosphorylation of light-activated rhodopsin rapidly desensitizes the receptor so that
      arrestin can quench it; this is homologous receptor desensitization.
    action: ACCEPT
    reason: The human cloning paper describes rhodopsin kinase as mediating rapid desensitization of rods by phosphorylating
      rhodopsin (PMID:8812493), and the human enzyme phosphorylates rhodopsin in vitro (PMID:15946941). Human cone
      physiology in ESCS and Oguchi patients (PMID:12601058) shows deactivation is slowed without GRK1. The IC and
      IMP rows are consistent with each other and with GO:0016059, which the gene also carries.
    supported_by: &id002
    - reference_id: PMID:8812493
      supporting_text: In rod photoreceptors rhodopsin kinase (RK) mediates rapid desensitization of rod photoreceptors
        to light by catalyzing phosphorylation of the visual pigment rhodopsin.
    - reference_id: PMID:12601058
      supporting_text: Normal deactivation kinetics in human L/M cones can occur without GRK7 when GRK1 is present
        in ESCS, but does not occur when GRK7 is present but GRK1 is deficient in Oguchi disease.
