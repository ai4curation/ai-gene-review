- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - FB:FBgn0261988
  - PANTHER:PTN001219785
  - UniProtKB:P32298
  review:
    summary: GRK1 is a cytoplasmic-facing, prenylated peripheral membrane protein of the photoreceptor outer segment;
      cytoplasm is true at the family level but not where its function is specified.
    action: KEEP_AS_NON_CORE
    reason: The IBA comes from PTN001219785, a deep GRK-family node (donors include Drosophila Gprk2 and human GRK4);
      no PAINT loss lies on the GRK1 lineage. GRK1 is a soluble kinase that associates with membranes through its
      farnesyl anchor and is bound by recoverin in the outer segment, so a cytoplasmic location is not wrong. GO:0001750
      photoreceptor outer segment is not a descendant of cytoplasm, so the row is not refined; the specific sites
      of action are carried by the outer segment and disc membrane rows.
    supported_by:
    - reference_id: Reactome:R-HSA-2581474
      supporting_text: A substantial fraction of rhodopsin kinase (GRK1) is bound to recoverin (RCVRN) in darkness,
        when internal Ca2+ levels are high.
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000239
  review:
    summary: GRK1 terminates (switches off) opsin signaling; the broad terms signal transduction, regulation of
      signal transduction, regulation of GPCR signaling, regulation of opsin-mediated signaling and the forward
      G protein-coupled opsin signaling pathway are refined to negative regulation of opsin-mediated signaling pathway
      (GO:0016059).
    action: MODIFY
    reason: 'Phosphorylation of light-activated rhodopsin by GRK1 is the first step of its inactivation; in the
      mouse knockout rhodopsin is not phosphorylated and single-photon responses are larger and longer lasting (PMID:10097103),
      and human RK null mutation slows rod recovery (PMID:9419375). The sign of the effect is known, so the specific
      term is GO:0016059, which the gene already carries (IC, IMP) and which is a descendant of GO:0022400, GO:0008277
      and GO:0009966. For GO:0007165 and GO:0016056 (the forward pathway) the refinement is lateral: in human GOA
      the signal terminators (GRK1, GRK7, SAG, ARR3) carry GO:0016059, while the activation chain carries the pathway
      term. The IBA (PTN001219785, a deep GRK node; no PAINT loss on this lineage) and the IEA and TAS rows are
      true at their level and are refined, not removed.'
    proposed_replacement_terms: &id006
    - id: GO:0016059
      label: negative regulation of opsin-mediated signaling pathway
    supported_by: &id007
    - reference_id: PMID:10097103
      supporting_text: This eliminated the light-dependent phosphorylation of rhodopsin and caused the single-photon
        response to become larger and longer lasting than normal.
    - reference_id: Reactome:R-HSA-2581474
      supporting_text: GRK1 is activated by MII whereupon it phosphorylates MII at multiple serine and threonine
        sites on its C terminus.
- term:
    id: GO:0007601
    label: visual perception
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR037716
  review:
    summary: GRK1 is required for normal rod and cone recovery after light, and its loss causes Oguchi disease (night
      blindness with slowed dark adaptation); visual perception is a true but organism-level consequence of its
      signal-terminating activity.
    action: KEEP_AS_NON_CORE
    reason: Null mutations in human GRK1 cause Oguchi disease (PMID:9020843, PMID:9419375). The gene's direct role
      is termination of opsin signaling (GO:0016059) and photoresponse recovery; visual perception is a whole-organism
      process downstream of that and is kept as non-core for both the IEA and TAS rows.
    supported_by: &id005
    - reference_id: PMID:9020843
      supporting_text: Our results indicate that null mutations in the rhodopsin kinase gene are a cause of Oguchi
        disease and extend the known genetic heterogeneity in congenital stationary night blindness.
