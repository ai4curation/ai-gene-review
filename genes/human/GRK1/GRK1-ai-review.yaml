id: Q15835
gene_symbol: GRK1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRK1 (rhodopsin kinase) is a retina-specific serine/threonine protein kinase of the G protein-coupled
  receptor kinase (GRK) family, AGC kinase group. It is expressed in rod photoreceptors and, in primates and rodents,
  also in cones, where it is co-expressed with GRK7 in humans. GRK1 binds light-activated rhodopsin (metarhodopsin
  II) through its N-terminal helix, which docks into the opened cytoplasmic cleft of the receptor, and phosphorylates
  serine and threonine residues in the receptor C-terminal tail. Phosphorylated rhodopsin is then capped by rod
  arrestin (SAG), which blocks further transducin activation; this terminates the single-photon response and is
  required for normal recovery of rod sensitivity after light. GRK1 likewise phosphorylates light-activated cone
  opsins. The C-terminal CaaX cysteine is farnesylated and carboxyl-methylated, anchoring the kinase to photoreceptor
  outer segment membranes; prenylation is needed for full activity and for binding of the prenyl-binding protein
  PDE6D. In darkness, Ca2+-bound recoverin binds the GRK1 N-terminus and inhibits it; the fall in Ca2+ after illumination
  releases the kinase. Phosphorylation of Ser-21 by PKA reduces activity. Much of the mechanistic biochemistry is
  on the bovine enzyme; human GRK1 activity has been measured on recombinant protein. Loss-of-function mutations
  in human GRK1 cause Oguchi disease type 2, a form of congenital stationary night blindness with slowed rod recovery
  and dark adaptation.
