  title: Cone deactivation kinetics and GRK1/GRK7 expression in enhanced S cone syndrome caused by mutations in
    NR2E3.
  findings:
  - statement: GRK1 is present in normal human cone outer segments, and human L/M cone deactivation requires GRK1
      when GRK7 is absent.
    supporting_text: Normal human retina revealed strongly labeled cone outer segments with anti-GRK1 and anti-GRK7.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human ERG and post-mortem immunocytochemistry; patients carry NR2E3 mutations, compared with GRK1-deficient
      Oguchi patients. Abstract only.
- id: PMID:15946941
  title: Phosphorylation of GRK1 and GRK7 by cAMP-dependent protein kinase attenuates their enzymatic activities.
  findings:
  - statement: Recombinant GRK1 phosphorylates rhodopsin; Km and Vmax measured for ATP and rhodopsin; PKA phosphorylates
      GRK1 Ser-21 and reduces its activity.
    supporting_text: Phosphorylation of GRK1 and GRK7 by PKA reduces the ability of GRK1 and GRK7 to phosphorylate
      rhodopsin in vitro.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; species of the recombinant kinase not stated in the abstract, UniProt attributes
      the kinetics to the human entry.
