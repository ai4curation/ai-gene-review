  label: Homo sapiens
description: CC2D1A, also called Freud-1 or Aki1, is a multidomain regulatory protein with nuclear and cytoplasmic
  functions. In the nucleus it participates in sequence-dependent transcriptional repression, including regulation
  of HTR1A with cell-dependent chromatin-remodeling partners. In the cytoplasm it coordinates PDK1 and Akt in an
  EGF-responsive signaling complex without supplying their kinase activity. CC2D1A also associates with CHMP4B and
  localizes to centrosomes. Biallelic loss of function causes a complex neurodevelopmental disorder.
