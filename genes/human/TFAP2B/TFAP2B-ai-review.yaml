- description: Neural crest specifier. As the TFAP2A partner in TFAP2A/TFAP2B heterodimers, AP-2beta targets crest specification
    enhancers and drives the switch from border induction (TFAP2A/C) to crest specification, repressing TFAP2C. It is a direct
    target of Pax3/Zic1 and activates Ets1 in the cranial crest.
