- term:
    id: GO:0014036
    label: neural crest cell fate specification
  evidence_type: ISS
  original_reference_id: PMID:31848212
  review:
    summary: AP-2beta is a neural crest specifier. In chick it comes on only at the onset of specification, heterodimerizes
      with TFAP2A, recruits TFAP2A to specification enhancers (FOXD3 NC1, SOX9, SNAI2, SOX10), represses TFAP2C to complete
      the partner switch, and is required and rate-limiting for specification; knockdown spares the neural plate border. In
      frog, Pax3 and Zic1 activate tfap2b directly.
    action: NEW
    reason: 'Human TFAP2B has no neural crest term. Layer: crest specifier, not border specifier, so GO:0014036 rather than
      GO:0014029 (the project convention for specifiers); TFAP2B is absent at border stages and its knockdown leaves border
      markers intact. GO:0014034 is not added because GO:0014036 is part_of it. Participation: TFAP2B is a DNA-binding heterodimer
      partner that itself occupies, and targets TFAP2A to, specification enhancers, so it does part of the work. Comparator
      (QuickGO 2026-10-08): no TFAP2B ortholog in any species carries a crest-branch term, but zebrafish tfap2a and tfap2c
      carry GO:0014036 (IMP/IGI) and frog crest specifiers (sox10, sox9-a, sox8, snai2) carry it. The absence is explained:
      the paralog-specific evidence is a 2020 chick paper and chicken TFAP2B has no manual curation, while mouse and zebrafish
      single mutants are masked by TFAP2A redundancy. ISS because the experiments are on chick TFAP2B. Caveat for sign-off:
      in mouse TFAP2B is redundant with TFAP2A, so necessity is shown only in chick; human Char syndrome is a disorder of
      crest derivatives.'
    supported_by:
    - reference_id: PMID:31848212
      supporting_text: TFAP2B transcripts were not detected until just before the onset of specification, when the gene became
        robustly expressed in the neural crest lineage
    - &id030
      reference_id: PMID:31848212
      supporting_text: TFAP2B knockdown produced no effects on the neural plate border but resulted in the disruption of the
        specification program
    - *id029
    - &id031
      reference_id: PMID:31848212
      supporting_text: These results indicate that TFAP2B is specialized in its ability to promote neural crest specification.
    - reference_id: PMID:31848212
      supporting_text: this manipulation resulted in a premature onset of specification, with early activity of NC1 in the
        reprogrammed side of the embryo
    - &id032
      reference_id: PMID:24360906
      supporting_text: We demonstrated that the neural border specifiers Pax3 and Zic1 are direct upstream regulators of neural
        crest specifiers Snail1/2, Foxd3, Twist1, and Tfap2b.
    - *id014
    additional_reference_ids:
    - PMID:24360906
    - PMID:27339986
