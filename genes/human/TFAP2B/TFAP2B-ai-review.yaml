suggested_questions:
- question: The crest-specification role of TFAP2B is necessary only in chick; in mouse TFAP2B is redundant with TFAP2A and
    no AP-2alpha/beta heterodimer function is irreplaceable. Is ISS transfer of GO:0014036 from chick to human acceptable,
    or should the term sit on chicken TFAP2B only (currently unreviewed TrEMBL)?
- question: Do TFAP2A/TFAP2B heterodimers occupy crest specification enhancers in human (hPSC-derived) or mouse neural crest,
    as in chick?
- question: Zebrafish tfap2b crispants have fewer enteric neurons and one human TFAP2B haploinsufficient patient has intestinal
    pseudo-obstruction. Is the evidence enough for enteric nervous system development (GO:0048484) on human TFAP2B, or should
    it wait for replication?
- question: Duan & Clemmons 1995 (PMID:7559606) is about AP-2alpha and its dominant-negative splice isoform 'AP-2B'. Should
    other TFAP2B annotations sourced from papers that use the 'AP-2B' name be audited for the same confusion?
- question: The Sox8-Tfap2b-Ets1 cranial circuit reprograms trunk crest only in combination. Does TFAP2B carry a cranial skeletal/chondrogenic
    process term on its own (e.g. GO:0048701), or is this a property of the circuit best represented in a GO-CAM?
suggested_experiments:
- description: CUT&RUN for TFAP2B and TFAP2A (with and without TFAP2B knockdown) in human pluripotent stem cell-derived neural
    crest, to test whether TFAP2B redirects TFAP2A to specification enhancers in human.
- description: Conditional neural-crest Tfap2b deletion in a Tfap2a-heterozygous mouse background, scored at specification
    stages (Foxd3, Sox10, Snai2), to expose a mammalian specification role masked by redundancy.
- description: Express lamprey Tfap2 and amphioxus AP-2 in chick in place of TFAP2B to ask whether the single pre-duplication
    AP-2 can perform the TFAP2B-specific recruitment of TFAP2A to specification enhancers.
