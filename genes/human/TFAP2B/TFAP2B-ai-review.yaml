- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:7559606
  qualifier: involved_in
  review:
    summary: Duan & Clemmons 1995 used a human AP-2 (AP-2alpha) expression construct and 'AP-2B', a dominant-negative AP-2
      form, on the IGFBP5 promoter. AP-2B is an alternatively spliced product of the AP-2alpha gene (TFAP2A), not AP-2beta.
    action: REMOVE
    reason: Name confusion visible in the cached text. The repression attributed here is the effect of AP-2B, a dominant-negative
      AP-2alpha splice isoform that lacks the dimerization domain, on AP-2 activity. It is not repression by TFAP2B. Buettner
      et al. 1993 show AP-2B is spliced from the single AP-2 (TFAP2A) gene. AP-2beta (TFAP2B) was first cloned in the preceding
      month (PMID:7555706). TFAP2B-mediated repression is supported elsewhere (chick TFAP2C, mouse Bmp4), so removing this
      row loses nothing true.
    additional_reference_ids:
    - PMID:8321221
    supported_by:
    - &id002
      reference_id: PMID:7559606
      supporting_text: In AP-2 abundant fibroblasts, expression of AP-2B, a dominant-negative inhibitor of AP-2, suppressed
        IGFBP-5 promoter activity.
    - &id003
      reference_id: PMID:8321221
      supporting_text: Analysis of overlapping genomic clones spanning the entire AP-2 gene proves that AP-2A and AP-2B transcripts
        are alternatively spliced from the same gene.
