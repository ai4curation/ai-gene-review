gene_symbol: TFAP2B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Transcription factor AP-2 beta (TFAP2B) is a sequence-specific DNA-binding transcription factor of the AP-2
  family. It binds GCC(N3)GGC-type elements as a homodimer or as a heterodimer with AP-2alpha (TFAP2A), formed through a conserved
  C-terminal helix-span-helix domain beside a basic DNA-binding region, and mainly activates RNA polymerase II target genes
  with the coactivator CITED2 and p300/CBP; it also represses selected targets. SUMOylation and the inhibitor KCTD1 dampen
  its activity. In vertebrate embryos AP-2beta is a neural crest specifier: it is switched on in neural crest progenitors
  at the onset of specification, downstream of the neural plate border factors Pax3, Zic1 and AP-2alpha/AP-2gamma, and as
  a TFAP2A/TFAP2B heterodimer it opens and activates crest specification enhancers while repressing TFAP2C. In chick cranial
  crest it activates Ets1 and, with Sox8 and Ets1, confers cranial chondrogenic potential. It later supports the survival
  of sympathetic neuron progenitors and noradrenergic neurons, enteric neuron numbers, and the development of the ductus arteriosus
  smooth muscle, the face and the limbs; in the kidney it is required for survival of distal tubule and collecting duct epithelia.
  Heterozygous dominant-negative or haploinsufficient TFAP2B variants cause Char syndrome (patent ductus arteriosus, facial
  dysmorphism, fifth-finger anomalies) and isolated patent ductus arteriosus. Much of its developmental function overlaps
  with AP-2alpha, and the degree of redundancy differs between species.'
