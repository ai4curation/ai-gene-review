id: Q9Y2T1
gene_symbol: AXIN2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AXIN2 (conductin) is a nonenzymatic scaffold of the cytosolic beta-catenin destruction complex. It organizes beta-catenin with APC and regulatory kinases, promoting beta-catenin phosphorylation and subsequent ubiquitin-dependent proteasomal turnover. Induction of AXIN2 by beta-catenin/TCF establishes negative feedback on canonical Wnt signaling. AXIN2 also occurs in nuclei and at centrosomes in defined cellular contexts; centrosomal AXIN2 coordinates GSK3-dependent beta-catenin phosphorylation to restrain premature centrosome separation. Changes in AXIN2 signaling contribute to developmental phenotypes, including tooth agenesis, and to tumor susceptibility.
