- term:
    id: GO:0003180
    label: aortic valve morphogenesis
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O88566
  review:
    summary: Mouse Axin2 loss supports an inferred role in aortic valve development.
    action: KEEP_AS_NON_CORE
    reason: Retain the mouse-to-human ISS inference as a developmental role. The complete official abstract of PMID:28069701 reports abnormal aortic and mitral valve maturation in Axin2-knockout mice. This is mouse perturbation evidence and not a human valve assay or a separate molecular activity.
- term:
    id: GO:0003183
    label: mitral valve morphogenesis
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O88566
  review:
    summary: Mouse Axin2 loss supports an inferred role in mitral valve development.
    action: KEEP_AS_NON_CORE
    reason: Retain the mouse-to-human ISS inference as a mouse developmental result. Axin2-knockout mice develop enlarged, abnormal mitral valves with altered Wnt activity and extracellular matrix remodeling; the principal AXIN2 activity remains signaling-complex scaffolding.
