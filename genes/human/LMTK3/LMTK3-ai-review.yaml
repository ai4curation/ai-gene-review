- term:
    id: GO:1905750
    label: negative regulation of endosome to plasma membrane protein transport
  evidence_type: IMP
  original_reference_id: PMID:28294115
  qualifier: involved_in
  extensions:
  - predicate: RO:0002233
    term:
      id: UniProtKB:P29317
      label: Ephrin type-A receptor 2
  review:
    summary: >-
      In human cancer cells, LMTK3 depletion or substitution of RAB11FIP1/RCP Ser435
      blocks diversion of EPHA2 into a slower RAB14-dependent perinuclear route.
    action: NEW
    reason: >-
      Add the direction-specific transport annotation. Genetic perturbation,
      phosphosite detection, and phosphosite-mutant experiments show that LMTK3 and
      RAB11FIP1 Ser435 reduce EPHA2 return from endosomes to the plasma membrane; the
      extension records EPHA2 as the tested cargo. Purified LMTK3-RAB11FIP1 catalysis
      was not demonstrated.
    supported_by:
    - reference_id: PMID:28294115
      supporting_text: >-
        HGF signalling achieves this by concomitant activation of two parallel
        phosphorylation cascades. HGF activates Akt to phosphorylate EphA2 on Ser897
        and, in parallel with this, HGF signalling promotes LMTK3-mediated
        phosphorylation of RCP on Ser435 to favour RCP/Rab14 association and both of
        these events are necessary to divert EphA2 through a slower recycling pathway
        and promote cytoskeletal responses which enable cells to move apart.
- term:
    id: GO:1902823
    label: negative regulation of late endosome to lysosome transport
  evidence_type: IMP
  original_reference_id: PMID:40405280
  qualifier: involved_in
  review:
    summary: >-
      LMTK3-dependent RAB7A Ser72 phosphorylation reduces endocytic-cargo degradation
      and disrupts late-endosome trafficking in human breast-cancer cells.
    action: NEW
    reason: >-
      Add the direction-specific process annotation supported by LMTK3 perturbation,
      RAB7A Ser72 mutants, reduced EGFR degradation, and enlarged multivesicular bodies.
      This term captures impaired late-endosome-to-lysosome transport without asserting
      an increase in extracellular-vesicle number.
    supported_by:
    - reference_id: PMID:40405280
      supporting_text: >-
        Mechanistically, we provide evidence that LMTK3 phosphorylates Rab7, a key
        regulator of multivesicular body (MVB) trafficking, thereby reducing the fusion
        of MVBs with lysosomes and subsequent degradation of intralumenal vesicles,
        resulting in altered EV release.
- term:
    id: GO:0008157
    label: protein phosphatase 1 binding
  evidence_type: IPI
  original_reference_id: PMID:26212333
  qualifier: enables
  supporting_entities:
  - UniProtKB:P62136
  review:
    summary: >-
      Human LMTK3 participates with PPP1CA/PP1alpha in a nuclear
      LMTK3-TRIM28/KAP1-PP1alpha scaffolding mechanism in breast-cancer cells, and
      cached full-text evidence independently states that the LMTK3 C-terminus binds
