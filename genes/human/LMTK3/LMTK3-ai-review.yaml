- id: PMID:21602804
  title: Kinome screening for regulators of the estrogen receptor identifies LMTK3
    as a new therapeutic target in breast cancer.
  full_text_unavailable: true
  findings:
  - statement: >-
      LMTK3 phosphorylates ESR1/ERalpha in vitro and protects it from proteasomal
      degradation; the abstract does not identify the directly phosphorylated
      residue.
    supporting_text: >-
      LMTK3 phosphorylated ERα, protecting it from proteasomal degradation in vitro.
    reference_section_type: ABSTRACT
  - statement: >-
      In ERalpha-positive breast-cancer models, LMTK3 also regulates ESR1 abundance
      indirectly through the PKC-AKT-FOXO3 transcriptional pathway.
    supporting_text: >-
      LMTK3 acts by decreasing the activity of protein kinase C (PKC) and the
      phosphorylation of AKT (Ser473), thereby increasing binding of forkhead box O3
      (FOXO3) to the ESR1 promoter.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Foundational experimental study of human LMTK3 in ERalpha-positive breast-cancer
      systems. Only the abstract is cached. It supports direct in-vitro ESR1
      phosphorylation, but neither the abstract nor the curated record identifies the
      LMTK3-dependent ESR1 phosphosite; do not present ESR1 Ser167 as a mapped direct
      LMTK3 site.
