gene_symbol: LMTK3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LMTK3 is a single-pass membrane protein serine/threonine kinase with a
  membrane-proximal catalytic domain that phosphorylates protein substrates including
  RAB7A, HSPB1, CDC37,
  and ESR1. In human cell models it regulates endosomal cargo transport through
  RAB11FIP1-RAB14-EPHA2 and RAB7A pathways, and a nuclear pool binds PPP1CA/PP1alpha
  to scaffold TRIM28/KAP1 dephosphorylation and transcriptional repression. LMTK3
  also sustains ESR1 abundance and signaling in estrogen-receptor-positive
  breast-cancer cells. Neuronal receptor-trafficking and KCC2-linked PP1-scaffold
  roles are established primarily in rodents and remain unverified in human neurons.
