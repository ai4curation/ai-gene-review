- id: PMID:24760852
  title: >-
    LMTK3 deficiency causes pronounced locomotor hyperactivity and impairs endocytic
    trafficking.
  findings:
  - statement: >-
      Lmtk3 knockout in mice alters behavior and dopamine turnover, while primary
      knockout neurons show impaired N-methyl-D-aspartate receptor endocytic
      trafficking.
    supporting_text: >-
      In addition, using cultured primary neurons from Lmtk3(-/-) mice, we found that
      LMTK3 is involved in the endocytic trafficking of N-methyl-d-aspartate receptors,
      a type of ionotropic glutamate receptor.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Direct mouse knockout and primary-neuron evidence for a neuronal trafficking role.
      The PMC full text is cached; the findings remain ortholog evidence rather than a
      direct assay of human Q96Q04.
- id: PMID:26212333
  title: >-
    LMTK3 Represses Tumor Suppressor-like Genes through Chromatin Remodeling in Breast
    Cancer.
  full_text_unavailable: true
  findings:
  - statement: >-
      Nuclear LMTK3 binds KAP1/TRIM28 in breast-cancer cells, with PP1alpha stabilizing
      the interaction and promoting KAP1 dephosphorylation at LMTK3-associated chromatin.
    supporting_text: >-
      The LMTK3/KAP1 interaction is stabilized by PP1α, which suppresses KAP1
      phosphorylation specifically at LMTK3-associated chromatin regions, inducing
      chromatin condensation and resulting in transcriptional repression of LMTK3-bound
      tumor suppressor-like genes.
    reference_section_type: ABSTRACT
  - statement: >-
      The authors propose a nuclear scaffolding function for LMTK3 in chromatin
      remodeling and transcriptional repression.
    supporting_text: >-
      In summary, we propose a model where a scaffolding function of nuclear LMTK3
      promotes cancer progression through chromatin remodeling.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human breast-cancer-cell evidence for a context-specific LMTK3-KAP1-PP1alpha
      chromatin scaffold. Only the abstract is cached, but independent inspection of the
      primary full PDF verified that endogenous LMTK3 immunoprecipitation recovers PP1alpha
      in MCF7 cells, GST pull-down supports direct binding, and RVxF-motif substitutions
      weaken the interaction. The paper's old LMTK3 motif coordinates 1376-1382 map to
      residues 1347-1353 in current Q96Q04. KAP1 is the PP1-regulated partner, not an
      established direct phosphorylation substrate of LMTK3.
- id: PMID:28294115
  title: >-
    Phosphorylation of Rab-coupling protein by LMTK3 controls Rab14-dependent EphA2
    trafficking to promote cell:cell repulsion.
  findings:
  - statement: >-
      Human cancer-cell perturbations attribute HGF-induced RCP/RAB11FIP1 Ser435
      phosphorylation specifically to LMTK3 rather than LMTK1.
    supporting_text: >-
      The LMTK family comprises three members, and siRNA experiments indicated that
      LMTK3 is responsible for HGF-induced phosphorylation of RCP's Ser435. Indeed,
      siRNA of LMTK3 (Fig. 4c,d), but not LMTK1 (Fig. 4d) opposed HGF-driven
      phosphorylation of RCP at Ser435.
    reference_section_type: RESULTS
  - statement: >-
      LMTK3-dependent RCP Ser435 phosphorylation enables assembly of an
      RCP-Rab14-EphA2 complex, EphA2 accumulation in perinuclear endosomes, and
      HGF-induced cell repulsion.
    supporting_text: >-
      Taken together these data indicate that HGF signalling promotes LMTK3-mediated
      phosphorylation of RCP at Serine435 which leads to assembly of an
      RCP/Rab14/EphA2 complex and accumulation of EphA2 within perinuclear endosomes.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Strong human cancer-cell evidence using LMTK3-versus-LMTK1 siRNA, phosphosite
      detection, an RCP S435A mutant, trafficking assays, and functional rescue logic.
      The study does not show purified recombinant LMTK3 phosphorylating RCP, so Ser435
      is a strong cellular LMTK3-dependent site but should not be described as
      biochemically purified-direct.
- id: PMID:30944027
  title: >-
    The lncRNA MIR2052HG regulates ERα levels and aromatase inhibitor resistance
    through LMTK3 by recruiting EGR1.
  findings:
  - statement: >-
      MIR2052HG recruits EGR1 to the LMTK3 promoter and thereby regulates LMTK3
      transcription in human ER-positive breast-cancer cells.
    supporting_text: >-
      Mechanistically, MIR2052HG interacts with EGR1 and facilitates its recruitment to
      the LMTK3 promoter.
    reference_section_type: ABSTRACT
  - statement: >-
      LMTK3 sustains ERalpha through PKC-AKT-FOXO3-dependent ESR1 transcription and the
      downstream PKC-MEK-ERK-RSK1 degradation pathway.
    supporting_text: >-
      LMTK3 sustains ERα levels by reducing protein kinase C (PKC) activity, resulting
      in increased ESR1 transcription mediated through AKT/FOXO3 and reduced ERα
      degradation mediated by the PKC/MEK/ERK/RSK1 pathway.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Direct human ER-positive breast-cancer-cell evidence for upstream control of LMTK3
      expression and downstream ERalpha regulation. The ERalpha Ser167 signal discussed
      in this paper is mediated through the downstream MEK-ERK-RSK1 axis and is not a
      mapped direct LMTK3 phosphorylation site.
- id: PMID:31310731
  title: >-
    Lmtk3-KO Mice Display a Range of Behavioral Abnormalities and Have an Impairment in
    GluA1 Trafficking.
  full_text_unavailable: true
  findings:
  - statement: >-
      Lmtk3 knockout mice have impaired long-term potentiation and abnormal
      stimulus-dependent GluA1 trafficking in neurons.
    supporting_text: >-
      Further investigation revealed abnormalities in GluA1 trafficking after AMPA
      stimulation in Lmtk3-KO neurons, along with a reduction in GluA1 expression in the
      post-synaptic density.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Direct mouse knockout evidence for neuronal AMPA-receptor trafficking and synaptic
      plasticity. Only the abstract is cached; it is ortholog evidence and does not
      establish the same role for human Q96Q04.
- id: PMID:33188023
  title: The structure-function relationship of oncogenic LMTK3.
  findings:
  - statement: >-
      The human LMTK3 kinase-domain structure adopts an inactive DYG-out conformation.
    supporting_text: >-
      We find that LMTK3cat adopts an inactive conformation, with the key DYG motif (more
      commonly DFG motif) stabilized in the “DYG-out” conformation
    reference_section_type: RESULTS
  - statement: >-
      Recombinant LMTK3 directly phosphorylates HSPB1/HSP27 in vitro, principally at
      Ser15 and Ser82.
    supporting_text: >-
      We also pinpointed Ser15 and Ser82 as the main HSP27 residues phosphorylated by
      LMTK3 in vitro, using site-directed mutagenesis
    reference_section_type: RESULTS
  - statement: >-
      Recombinant LMTK3 phosphorylates CDC37 in vitro, although the CDC37 phosphosite was
      not mapped.
    supporting_text: >-
      LMTK3 was able to phosphorylate CDC37 in vitro, suggesting a previously unidentified
      role for LMTK3 within the chaperone regulatory pathway.
    reference_section_type: RESULTS
  - statement: >-
      LMTK3 is an HSP90 client, and the ATP-competitive compound C28 also promotes
      proteasome-mediated LMTK3 degradation.
    supporting_text: >-
      Functional and mechanistic studies reveal LMTK3 is a heat shock protein 90 (HSP90)
      client protein, requiring HSP90 for folding and stability, while C28 promotes
      proteasome-mediated degradation of LMTK3.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Strong direct structural and biochemical evidence for human LMTK3. The paper used
      the older 1489-aa NP_001073903.1 sequence with a 29-aa N-terminal extension absent
      from current Q96Q04/NP_001073903.2; its LMTK3 residue numbers therefore require a
      29-residue offset before use with the current 1460-aa record. Substrate-site
      numbering is unaffected. CDC37 is directly phosphorylated in vitro but its site is
      unknown. Because C28 both inhibits the kinase and disrupts HSP90-CDC37-dependent
      LMTK3 stability, C28 phenotypes alone do not isolate catalytic inhibition.
- id: PMID:38715938
  title: >-
    The brain-specific kinase LMTK3 regulates neuronal excitability by decreasing
    KCC2-dependent neuronal Cl(-) extrusion.
  findings:
  - statement: >-
      The large disordered cytoplasmic C-terminal region of LMTK3 binds PP1.
    supporting_text: >-
      LMTK3 consists of 1,460 amino acids with a small extracellular N-terminus, a
      single transmembrane domain, an adjacent catalytic domain, and large highly
      disordered cytoplasmic C-terminus that binds PP1
    reference_section_type: RESULTS
  - statement: >-
      In mouse neurons, LMTK3 acts as a scaffold that recruits PP1 to KCC2/SLC12A5 and
      promotes dephosphorylation of KCC2 Ser940, decreasing transporter activity.
    supporting_text: >-
      LMTK3 acts to promote the association of KCC2 with PP1 to promote the
      dephosphorylation of S940 within its C-terminal cytoplasmic domain, a process the
      diminishes KCC2 activity.
    reference_section_type: ABSTRACT
  - statement: >-
      The physiological loss-of-function analysis used adult Lmtk3 knockout mice and
      acute hippocampal slices.
    supporting_text: >-
      To investigate the effects of LMTK3 inactivation on KCC2 activity, we performed
      whole-cell patch-clamp Cl− loading experiments on dentate gyrus granule cells
      (DGGCs) in acute hippocampal slices from adult LMTK3 control and KO mice.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Strong mouse-brain and neuronal evidence for a context-specific LMTK3-PP1-KCC2
      scaffold. The mechanistic physiology is based on mouse tissue, knockout mice, and
      neuronal preparations; conservation of this scaffold function in human neurons is
      unresolved and should not be presented as direct human evidence.
- id: PMID:40405280
  title: >-
    LMTK3 regulation of EV biogenesis and cargo sorting promotes tumour growth by
    reducing monocyte infiltration and driving pro-tumourigenic macrophage polarisation
    in breast cancer.
  findings:
  - statement: >-
      Recombinant LMTK3 directly phosphorylates RAB7A in vitro, and site-specific assays
      identify RAB7A Ser72 as the phosphoacceptor.
    supporting_text: >-
      To elucidate if Rab7 is directly or indirectly phosphorylated by LMTK3, we performed
      in vitro kinase assays, using recombinant LMTK3 kinase domain as source of enzyme
      activity and Rab7 as substrate.
    reference_section_type: RESULTS
  - statement: >-
      Human T47D and MDA-MB-231 imaging places LMTK3 with RAB7A-positive late endosomes.
    supporting_text: >-
      Following immunofluorescence staining, our analysis showed overlapping localisation
      between LMTK3 and Rab7, confirming that LMTK3 is present in late endosomes
    reference_section_type: RESULTS
  - statement: >-
      In human breast-cancer cells, LMTK3-dependent RAB7A Ser72 phosphorylation disrupts
      late-endosome trafficking and enlarges multivesicular bodies, producing larger EVs
      with altered cargo rather than necessarily increasing EV number.
    supporting_text: >-
      In summary, our findings demonstrate that LMTK3 overexpression in breast cancer
      cells promotes the phosphorylation of Rab7 at Ser72, which in turn disrupts late
      endosome trafficking and results in the formation of enlarged MVBs.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct recombinant kinase evidence plus human T47D and MDA-MB-231 cellular evidence
      for RAB7A Ser72 phosphorylation, late-endosome localization, and MVB/EV remodeling.
      The paper distinguishes EV size, subpopulation, and cargo effects from particle
      concentration; it does not support a blanket claim that LMTK3 increases EV number.
core_functions:
- description: >-
    Purified-domain biochemistry establishes direct LMTK3 protein-serine-kinase
    activity on HSPB1/HSP27 at Ser15 and Ser82 and on CDC37 at an unmapped site.
    These substrate reactions define core enzymology; their downstream physiological
    consequences remain unresolved.
  molecular_function:
    id: GO:0106310
    label: protein serine kinase activity
  substrates:
  - id: UniProtKB:P04792
    label: Heat shock protein beta-1
  - id: UniProtKB:Q16543
    label: Hsp90 co-chaperone Cdc37
  supported_by:
  - reference_id: PMID:33188023
    supporting_text: >-
      We also pinpointed Ser15 and Ser82 as the main HSP27 residues phosphorylated by
      LMTK3 in vitro, using site-directed mutagenesis
  - reference_id: PMID:33188023
    supporting_text: >-
      LMTK3 was able to phosphorylate CDC37 in vitro, suggesting a previously unidentified
      role for LMTK3 within the chaperone regulatory pathway.
- description: >-
    At RAB7A-positive late endosomes in human breast-cancer cells, LMTK3
    catalyzes RAB7A Ser72 phosphorylation. This reduces late-endosome-to-lysosome
    transport and remodels multivesicular-body and extracellular-vesicle size and cargo;
    an increase in extracellular-vesicle number is not established.
  molecular_function:
    id: GO:0106310
    label: protein serine kinase activity
  directly_involved_in:
  - id: GO:1902823
    label: negative regulation of late endosome to lysosome transport
  locations:
  - id: GO:0005770
    label: late endosome
  substrates:
  - id: UniProtKB:P51149
    label: Ras-related protein Rab-7a
  supported_by:
  - reference_id: PMID:40405280
    supporting_text: >-
      Our results demonstrated that LMTK3 directly phosphorylates Rab7 in vitro and
      that this effect is abolished following LMTK3 pharmacological inhibition
      (Fig. 2j and Figure S2).
  - reference_id: PMID:40405280
    supporting_text: >-
      Mechanistically, we provide evidence that LMTK3 phosphorylates Rab7, a key
      regulator of multivesicular body (MVB) trafficking, thereby reducing the fusion
      of MVBs with lysosomes and subsequent degradation of intralumenal vesicles,
      resulting in altered EV release.
- description: >-
    In human cancer cells, LMTK3-dependent phosphorylation of RAB11FIP1/RCP at Ser435
    promotes assembly of a RAB11FIP1-RAB14-EPHA2 module and RAB14-dependent EPHA2
    trafficking into perinuclear endosomes. Knockdown and phosphosite-mutant evidence
    establishes a cellular LMTK3-dependent site, but purified LMTK3-RAB11FIP1 catalysis
    has not been demonstrated; EPHA2 and RAB14 are cargo/pathway partners rather than
    LMTK3 substrates in this mechanism.
  molecular_function:
    id: GO:0106310
    label: protein serine kinase activity
  directly_involved_in:
  - id: GO:1905750
    label: negative regulation of endosome to plasma membrane protein transport
  substrates:
  - id: UniProtKB:Q6WKZ4
    label: Rab11 family-interacting protein 1
  supported_by:
  - reference_id: PMID:28294115
    supporting_text: >-
      HGF signalling achieves this by concomitant activation of two parallel
      phosphorylation cascades. HGF activates Akt to phosphorylate EphA2 on Ser897
      and, in parallel with this, HGF signalling promotes LMTK3-mediated
      phosphorylation of RCP on Ser435 to favour RCP/Rab14 association and both of
      these events are necessary to divert EphA2 through a slower recycling pathway
      and promote cytoskeletal responses which enable cells to move apart.
- description: >-
    The large disordered cytoplasmic C-terminus of LMTK3 binds PP1. In human
    breast-cancer cells, a nuclear pool participates in a PP1alpha-TRIM28/KAP1 scaffold
    that promotes KAP1 dephosphorylation and transcriptional repression. Mouse-neuron
    studies extend this architecture to a PP1-SLC12A5/KCC2 module, but conservation in
    human neurons is unresolved. This is a binding/scaffold activity, not phosphatase
    activity by LMTK3, and no universal stable complex is asserted.
  molecular_function:
    id: GO:0008157
    label: protein phosphatase 1 binding
  supported_by:
