      chromatin condensation and resulting in transcriptional repression of
      LMTK3-bound tumor suppressor-like genes.
  - reference_id: PMID:38715938
    supporting_text: >-
      LMTK3 consists of 1,460 amino acids with a small extracellular N-terminus, a
      single transmembrane domain, an adjacent catalytic domain, and large highly
      disordered cytoplasmic C-terminus that binds PP1
  - reference_id: PMID:38715938
    supporting_text: >-
      LMTK3 acts to promote the association of KCC2 with PP1 to promote the
      dephosphorylation of S940 within its C-terminal cytoplasmic domain, a process the
      diminishes KCC2 activity.
knowledge_gaps:
- gap_statement: >-
    Whether current-sequence human LMTK3 has intrinsic protein tyrosine kinase activity
    remains unresolved.
  boundary: >-
    Direct assays establish serine phosphorylation, whereas the historical "lemur
    tyrosine kinase" name, an active-site signature, and predicted dual specificity do
    not establish a tyrosine phosphoacceptor reaction.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving phosphoacceptor specificity is necessary to define the enzyme without
    perpetuating a historical naming inference.
  resolution: >-
    Compare purified current Q96Q04 kinase activity on matched serine, threonine, and
    tyrosine substrates with kinase-dead controls and phospho-amino-acid analysis.
- gap_statement: >-
    Directness and site resolution remain incomplete for several proposed human LMTK3
    substrates.
  boundary: >-
    RAB7A Ser72 and HSPB1 Ser15/Ser82 are purified-enzyme-supported sites; CDC37 is
    phosphorylated directly at an unmapped site, ESR1 is phosphorylated in vitro at an
    unmapped site, and RAB11FIP1 Ser435 is strongly LMTK3-dependent in cells but lacks a
    purified-enzyme assay.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Direct substrate maps are needed to connect LMTK3 catalysis to its distinct cellular
    pathways and to separate direct targets from indirect phosphoproteomic changes.
  resolution: >-
    Use endogenous LMTK3 knockout and catalytic-dead rescue, purified current-sequence
    kinase assays, phosphosite mapping, and phosphosite-mutant rescue for each candidate.
- gap_statement: >-
    Endogenous human LMTK3 topology and localization outside cancer-cell models are
    incompletely established.
  boundary: >-
    Current human membrane, Golgi, axon, and dendrite statements are transferred from
    mouse Q5XJV6; direct human imaging places LMTK3 at RAB7A-positive late endosomes in
    two breast-cancer cell lines.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Direct localization is needed to determine where the kinase and PP1-scaffold modules
    operate physiologically in human cells.
  resolution: >-
    Use validated endogenous Q96Q04 reagents, protease-protection topology assays, and
    quantitative colocalization in non-transformed human cells and iPSC-derived neurons.
- gap_statement: >-
    The breadth and kinase dependence of LMTK3's PP1-targeting scaffold function remain
    unresolved.
  boundary: >-
    Human breast-cancer cells support a PPP1CA-TRIM28/KAP1 chromatin module, whereas the
    PP1-SLC12A5/KCC2 mechanism and neuronal physiology are established mainly in mouse
    tissue and neurons.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This determines whether PP1 targeting is a conserved, catalytic-independent core
    activity or a collection of tissue-specific interactions.
  resolution: >-
    Mutate the current-sequence PP1-docking motif, compare wild-type and kinase-dead
    rescue, and assay endogenous chromatin and KCC2 modules in human cells and neurons.
- gap_statement: >-
    Biologically relevant alternative human LMTK3 protein products have not been
    established.
  boundary: >-
    The reviewed 1460-residue Q96Q04 record has no curated ALTERNATIVE PRODUCTS section;
    transcript cross-references and older 1489-residue experimental constructs do not
    justify numbered protein isoforms or unconverted residue coordinates.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Product-level resolution is required before assigning isoform-specific topology,
    localization, or function and before reusing historical residue numbers.
  resolution: >-
    Combine long-read transcript sequencing, protein N-terminomics, and targeted
    proteomics, and report all constructs against the current Q96Q04 sequence.
- gap_statement: >-
    The physiological scope of the RAB7A-dependent multivesicular-body and
    extracellular-vesicle phenotype is unknown.
  boundary: >-
    Current direct evidence comes from LMTK3 overexpression and perturbation in human
    breast-cancer cells and supports altered vesicle size, subpopulation, and cargo, not
    a general increase in extracellular-vesicle number.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This distinguishes a general endosomal function from an overexpression- or
    cancer-specific consequence.
  resolution: >-
    Quantify endogenous RAB7A Ser72 phosphorylation, endosome-to-lysosome flux, and
    vesicle number, size, and cargo after genetic LMTK3 perturbation across normal and
    disease-relevant human cell types.
proposed_new_terms: []
suggested_questions:
- question: >-
    Does purified current-sequence human LMTK3 phosphorylate tyrosine as well as serine
    and threonine substrates?
- question: >-
    What ESR1 and CDC37 residues are directly phosphorylated by LMTK3, and is
    RAB11FIP1 Ser435 a purified-enzyme substrate or a cellularly indirect site?
- question: >-
    Where does endogenous LMTK3 localize and orient in non-transformed human cells and
    human neurons?
- question: >-
    Is PP1 targeting a kinase-independent, conserved LMTK3 activity in both the human
    TRIM28/KAP1 and neuronal SLC12A5/KCC2 modules?
- question: >-
    Do translated human LMTK3 products exist beyond the current unnumbered 1460-residue
    UniProt product?
- question: >-
    Are RAB7A-dependent changes in multivesicular bodies and extracellular vesicles
    physiological outside LMTK3-overexpressing breast-cancer models?
suggested_experiments:
- description: >-
    Test purified current Q96Q04 kinase on matched serine, threonine, and tyrosine
    phosphoacceptor libraries with current-coordinate kinase-dead controls,
    phospho-amino-acid analysis, and an active-state structural determination.
- description: >-
    Map ESR1 and CDC37 phosphosites and test RAB11FIP1 Ser435 using purified proteins,
    endogenous LMTK3 knockout, wild-type versus catalytic-dead rescue, and
    phosphosite-mutant functional rescue.
- description: >-
    Determine endogenous LMTK3 topology and Golgi, late-endosome, recycling-endosome,
    axonal, dendritic, and nuclear localization in non-transformed human cells and
    iPSC-derived neurons using validated Q96Q04 reagents.
- description: >-
    Mutate the current Q96Q04 PP1-docking motif and compare wild-type and kinase-dead
    rescue for PPP1CA binding, TRIM28/KAP1 dephosphorylation and chromatin repression,
    and SLC12A5/KCC2 dephosphorylation and chloride extrusion in human neurons.
- description: >-
    Use long-read RNA sequencing, protein N-terminomics, and targeted proteomics to
    determine whether alternative human LMTK3 protein products exist, mapping every
    construct and residue to the current 1460-residue Q96Q04 sequence.
- description: >-
    Compare endogenous genetic perturbation with acute catalytic inhibition across
    normal and breast-cancer cell models while measuring RAB7A Ser72 phosphorylation,
    endosome-to-lysosome flux, and extracellular-vesicle number, size, and cargo; include
    controls that separate C28-mediated catalytic inhibition from LMTK3 destabilization.
