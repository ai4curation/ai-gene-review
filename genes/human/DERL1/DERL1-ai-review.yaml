id: Q9BUN8
gene_symbol: DERL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'DERL1 is a multi-pass endoplasmic-reticulum membrane rhomboid pseudoprotease that helps
  assemble ERAD retrotranslocation complexes. It links luminal or membrane ERAD substrates to VIMP, p97/VCP
  ATPase, ER-resident ubiquitin ligases, and accessory factors, forming DERL1-centered complexes that
  extract misfolded proteins into the cytosol for ubiquitin-proteasome degradation. DERL1 also binds SRP/SRPR
  during ER stress-induced pre-emptive quality control and can be recruited by viral US11 to drive MHC
  class I heavy-chain dislocation.'
alternative_products:
