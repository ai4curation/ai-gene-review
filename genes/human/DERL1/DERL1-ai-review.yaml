    label: protease binding
  evidence_type: IPI
  original_reference_id: PMID:25239945
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8TCT9
  review:
    summary: Keep the HM13/SPP protease interaction as a non-core XBP1u-processing role.
    action: KEEP_AS_NON_CORE
    reason: DERL1 binds the signal peptide peptidase HM13/SPP in the TRC8-Derlin1-SPP complex that 
      cleaves membrane-tethered XBP1u; this is a specific but substrate-focused role outside the 
      main misfolded-protein ERAD retrotranslocon.
    supported_by:
    - &id012
      reference_id: PMID:25239945
      supporting_text: SPP forms a complex with the ERAD factor Derlin1 and the E3 ubiquitin ligase 
        TRC8 to cleave the unfolded protein response (UPR) regulator XBP1u
    - &id013
      reference_id: PMID:25239945
      supporting_text: Derlin1 acts in the complex as a substrate receptor by recognizing the 
        luminal tail of XBP1u
- term:
