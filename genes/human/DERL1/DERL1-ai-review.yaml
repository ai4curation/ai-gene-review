  review:
    summary: Keep the cytoplasm projection as too general.
    action: TOO_GENERAL
    reason: DERL1 is an integral endoplasmic-reticulum membrane retrotranslocation component. 
      Cytoplasm is only a broad parent of the accepted ER-membrane and cytosolic-face 
      VCP-DERL1-complex locations, not a precise standalone compartment for DERL1.
