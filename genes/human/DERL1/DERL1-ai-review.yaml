    label: signal recognition particle binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000109990
  - UniProtKB:Q96Q80
  - UniProtKB:Q9BUN8
  - UniProtKB:Q9GZP9
  review:
    summary: Accept SRP binding in stress-induced pre-emptive quality control.
    action: ACCEPT
    reason: Human DERL1 directly binds the signal recognition particle and SRP receptor to reroute 
      selected nascent secretory proteins from ER import to cytosolic proteasomal degradation during
      ER stress. The cached IBA points at PTN000109990 even though the current PTHR11009 PAINT slice
      no longer contains a GO:0005047 IBD, but the human IDA evidence supports retaining the term 
      for DERL1.
    supported_by:
    - &id001
      reference_id: PMID:26565908
      supporting_text: Derlin family proteins (Derlins), which are ER-associated degradation 
        components, reroute specific ER proteins, but not ER chaperones, from the translocon to the 
        proteasome through interactions with the signal recognition particle (SRP)
    - &id002
