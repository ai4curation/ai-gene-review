- term:
    id: GO:0001819
    label: positive regulation of cytokine production
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q03526
  review:
    summary: 'Transferred from mouse Itk (Q03526): Itk-deficient T cells produce less IL-2 and Th2 cytokines.'
    action: KEEP_AS_NON_CORE
    reason: Cytokine output is a downstream consequence of ITK-dependent TCR signaling (PLCG1/Ca2+/NFAT). The knockout
      data record necessity rather than a direct step performed by ITK in cytokine production, so this is kept as
      non-core.
    supported_by:
    - &id001
      reference_id: PMID:18443296
      supporting_text: T cells from ITK-deficient mice show decreases in IL-2 production and proliferation and defects
        in T H 2 cytokine production
- term:
    id: GO:0001865
    label: NK T cell differentiation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:96621
  - PANTHER:PTN002815374
  review:
    summary: IBA for NK T cell differentiation, grounded in mouse Itk knockout data (absence of iNKT cells).
    action: KEEP_AS_NON_CORE
    reason: Itk-deficient mice and ITK-deficient patients lack NKT cells, so ITK signaling is required for iNKT
      development. This is a requirement downstream of its TCR-signaling kinase activity rather than a step that
      ITK executes; kept as non-core per the project rule that knockout phenotypes record necessity.
    supported_by:
    - reference_id: PMID:19425169
      supporting_text: Characteristics of ITK deficiency in mouse models, such as absence of NKT cells and high
        levels of eomesodermin in CD8+ cells, were seen in either one or both of the girls.
