core_functions:
- description: Tec-family cytoplasmic protein tyrosine kinase that, once recruited to the LAT-SLP-76 signalosome
    and activated by LCK, phosphorylates PLCG1 on Tyr783 and Tyr775 to switch on PIP2 hydrolysis and calcium/NFAT
    signaling downstream of the TCR; it also phosphorylates LAT and SLP-76 (Tyr173).
  molecular_function:
    id: GO:0004715
    label: non-membrane spanning protein tyrosine kinase activity
  directly_involved_in: &id009
  - id: GO:0050852
    label: T cell receptor signaling pathway
  locations: &id010
  - id: GO:0005886
    label: plasma membrane
  substrates:
  - id: UniProtKB:P19174
    label: 1-phosphatidylinositol 4,5-bisphosphate phosphodiesterase gamma-1
  - id: UniProtKB:O43561
    label: Linker for activation of T-cells family member 1
  - id: UniProtKB:Q13094
    label: Lymphocyte cytosolic protein 2
  supported_by:
  - reference_id: PMID:17420479
    supporting_text: ITK efficiently phosphorylated Y(783) and Y(775) of PLC-gamma1, two phosphorylation sites that
      are critical for its activation, whereas ZAP-70 did not
  - reference_id: PMID:12186560
    supporting_text: the Syk-family kinase ZAP-70 and the Tec-family kinase Itk favor phosphorylation of carboxy-terminal
      tyrosines in LAT
  - reference_id: PMID:21725281
    supporting_text: Itk, a kinase that selectively phosphorylated Y173 in vitro
  - reference_id: PMID:9312162
    supporting_text: The major site of Lck phosphorylation on Itk was mapped to the conserved tyrosine (Tyr511)
      in the activation loop of the Itk kinase domain.
  - reference_id: Reactome:R-HSA-202248
    supporting_text: The phosphorylation of the tyrosine residues and the activation of PLC-gamma1 is mediated by
      both Syk tyrosine kinase ZAP-70 and Tec kinase ITK.
- description: The ITK SH2 domain docks on the ZAP70-phosphorylated N-terminal tyrosines of SLP-76 (LCP2) after
    TCR stimulation; this phosphotyrosine-dependent binding, together with PH-domain recruitment to PIP3 at the
    plasma membrane, places ITK in the signalosome and is required to activate and maintain its kinase activity.
  molecular_function:
    id: GO:0001784
    label: phosphotyrosine residue binding
  directly_involved_in: *id009
  locations: *id010
  supported_by:
  - reference_id: PMID:21725281
    supporting_text: Catalytic activation of Itk depends on the inducible interaction of its SH2 domain with the
      N-terminal tyrosines of SLP-76
  - reference_id: PMID:17420479
    supporting_text: We propose that SLP-76 is required for ITK activation; furthermore, an ongoing physical interaction
      between SLP-76 and ITK is required to maintain ITK in an active conformation
  - reference_id: PMID:17060314
    supporting_text: Itk is activated by receptors via a phosphatidylinositol 3-kinase-mediated pathway, which results
      in recruitment of Itk to the plasma membrane via its pleckstrin homology domain.
suggested_questions:
- question: ITK has a kinase-independent scaffolding role in localizing VAV1 for TCR-induced actin polarization
    (PMID:15661896, PMID:12682224). Should this be captured with an MF term (e.g. a signaling adaptor activity),
    or is it adequately covered by the SH2 phosphotyrosine binding plus TCR signaling annotations?
- question: Two GOA IPI rows (PMID:18443296, PMID:31585087) name UniProtKB:P10686 as the PLCG1 partner; IntAct flags
    this interaction as cross-species (Xeno). Should the human annotation be made against human PLCG1 (P19174),
    or dropped as an enzyme-substrate relationship?
- question: ITK phosphorylates TBX21 (T-bet) Tyr530 to promote its interaction with GATA3 in mouse (UniProt, by
    similarity). Is this a direct, physiologically relevant ITK substrate in human T helper cells, and how much
    of the Th2/Th17 versus Treg skewing of ITK deficiency it explains?
suggested_experiments:
- hypothesis: ITK kinase activity and its SH2/PH-dependent scaffolding make separable contributions to calcium/NFAT
    signaling and actin polarization in human T cells.
