id: Q08881
gene_symbol: ITK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ITK (IL-2-inducible T cell kinase, also EMT/TSK) is a Tec-family non-receptor protein tyrosine kinase
  expressed mainly in T cells, NK cells and mast cells. It has an N-terminal pleckstrin homology (PH) domain, a
  Tec homology region with a proline-rich motif, SH3 and SH2 domains and a C-terminal kinase domain. On T cell receptor
  (TCR) engagement, PI3K-generated PIP3 recruits ITK to the plasma membrane through its PH domain, and its SH2 domain
  docks on the ZAP70-phosphorylated N-terminal tyrosines of the adaptor SLP-76 (LCP2) within the LAT-SLP-76 signalosome.
  LCK then phosphorylates the activation-loop tyrosine (Tyr512 in human, Tyr511 in mouse), followed by autophosphorylation
  of Tyr180 in the SH3 domain. Active ITK phosphorylates phospholipase C gamma 1 (PLCG1) on Tyr783 and Tyr775, switching
  on PIP2 hydrolysis to IP3 and diacylglycerol and thus calcium/NFAT and DAG-dependent signaling; it also phosphorylates
  LAT and SLP-76 (Tyr173). Independently of its kinase activity, ITK helps localize VAV1 for TCR-induced actin polarization.
  ITK signaling tunes T helper differentiation (Th2/Th17 versus regulatory T cells) and is required for invariant
  NKT cell development. Biallelic loss-of-function ITK variants in humans cause a primary immunodeficiency with
  fatal EBV-driven lymphoproliferation and absent NKT cells.
