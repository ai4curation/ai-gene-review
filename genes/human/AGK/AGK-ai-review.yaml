- id: PMID:15939762
  title: A novel acylglycerol kinase that produces lysophosphatidic acid modulates cross talk with
    EGFR in prostate cancer cells.
  findings:
  - statement: Human AGK phosphorylates monoacylglycerol and diacylglycerol to generate LPA and PA.
    supporting_text: AGK, that phosphorylates monoacylglycerol and diacylglycerol to form LPA and
      PA, respectively
  - statement: The same study did not support ceramide or sphingosine as AGK substrates.
    supporting_text: Significant phosphorylated products were only detected with monoacylglycerols
      and diacylglycerols as substrates, but not with any other lipid tested, including ceramide and
      sphingosine
  - statement: AGK localizes to mitochondria in microscopy and fractionation assays.
    supporting_text: Confocal microscopy and subcellular fractionation suggest that AGK is localized
      to the mitochondria
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full local Results and Methods checked: human cDNA expressed in mammalian cells, positive
      MAG/DAG assays, negative ceramide/sphingosine assays and mitochondrial enrichment. Figure 2 measures
      protein and MOG activity across fractions, with highest AGK-specific activity in P2. The smaller
      P4 protein signal and unresolved P4-specific activity/purity do not establish either a functional
      plasma-membrane pool or contamination. The manuscript explicitly discusses the conflicting bacterial
      mouse-MuLK result.'
- id: PMID:16269826
  title: 'Further characterization of mammalian ceramide kinase: substrate delivery and (stereo)specificity,
    tissue distribution, and subcellular localization studies.'
  findings:
  - statement: This ceramide kinase study argues against assigning ceramide kinase activity to the
      multiple lipid kinase now curated as AGK.
    supporting_text: No evidence for phosphorylation of ceramide by the recently described multiple
      lipid kinase was found
  - statement: The study notes that the multiple lipid kinase is mitochondrial.
    supporting_text: The latter kinase is localized in the mitochondria
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract and indexed publisher discussion checked. Human MuLK is discussed
      and assayed despite the CERK-centered title; negative activity is explicitly qualified by the
      authors. Local full text is unavailable. The quoted abstract establishes mitochondrial
      context, not membrane association or a membrane leaflet; the retained curated membrane
      annotation is independently corroborated by other human AGK studies.
- id: PMID:22284826
  title: Lack of the mitochondrial protein acylglycerol kinase causes Sengers syndrome.
  full_text_unavailable: true
