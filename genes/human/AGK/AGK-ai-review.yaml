- id: file:human/AGK/AGK-hypotheses/function-hypothesis-go-0001729/openscientist.md
  title: OpenScientist hypothesis report for AGK ceramide kinase activity
  publication_type: DEEP_RESEARCH
  findings:
  - statement: OpenScientist classified AGK ceramide kinase activity as over-annotated and
      recommended removing GO:0001729.
    supporting_text: The assignment of ceramide kinase activity (GO:0001729) to human AGK (Q53H12)
      is not supported by direct experimental evidence and is contradicted by the available
      biochemical literature.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Read and reused the existing report. Its human ceramide-kinase conclusion is supported
      by direct negative substrate assays. However, the report incorrectly presents the PAINT assertion
      as CERK-to-AGK propagation: PTN008994514 is supported by mouse Agk and fly Mulk. It also does not
      independently resolve ceramide/sphingosine biosynthetic-process annotations. Retain the biochemical
      observations and exact report excerpt while rejecting those overextended phylogenetic/pathway explanations.
      The report also says Bektas did not mention ceramide and describes limited human testing; the cached
      human Results explicitly tested it. Therefore primary assay text supplies the revised supporting
      quotes.'
