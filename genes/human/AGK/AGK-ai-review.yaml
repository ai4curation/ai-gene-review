suggested_experiments:
- hypothesis: Human AGK does not catalyze physiologically meaningful ceramide phosphorylation in
    native mitochondrial membranes.
  description: Purify or reconstitute human AGK in mitochondrial membrane-like liposomes and compare
    phosphorylation of monoacylglycerol, diacylglycerol, ceramide, and sphingosine using matched
    substrate presentation and kinase-dead AGK controls.
  experiment_type: enzyme reconstitution
- hypothesis: AGK has separable catalytic and TIM22-stabilizing surfaces.
  description: Use endogenous AGK knockout cells rescued with catalytic-site, TIM22-interface, and
    Sengers syndrome variants, then assay lipid products, TIM22 complex stability, and
    import/assembly of carrier substrates such as SLC25A4.
  experiment_type: structure-guided rescue and import assay
- hypothesis: AGK loss impairs sideroflexin biogenesis and one-carbon metabolism via the TIM22
    import pathway.
  description: In AGK knockout cells, quantify steady-state SFXN protein levels and TIM22-dependent
    SFXN import, and test whether serine-restricted proliferation defects are rescued by formate
    supplementation or by re-expression of kinase-dead AGK.
  experiment_type: import assay with metabolic rescue
