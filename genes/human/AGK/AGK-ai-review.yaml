id: Q53H12
gene_symbol: AGK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AGK is an ATP-dependent lipid kinase that converts monoacylglycerols and
  diacylglycerols to lysophosphatidic acid and phosphatidic acid. It is enriched in mitochondria
  and, independently of its kinase activity, forms part of the TIM22 complex at the inner membrane,
  with a large domain exposed to the intermembrane space. This structural role supports import and
  assembly of mitochondrial carrier proteins and sideroflexins. AGK-generated lipids also influence
  cellular signaling in defined cancer-cell contexts. Biallelic loss of AGK causes Sengers syndrome,
  characterized by congenital cataracts, cardiomyopathy, skeletal myopathy and lactic acidosis.
alternative_products:
