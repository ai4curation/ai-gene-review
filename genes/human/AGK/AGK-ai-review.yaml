    summary: Human AGK substrate assays detected phosphorylation of monoacylglycerols and
      diacylglycerols but not ceramide.
    action: REMOVE
    reason: Human AGK expressed in mammalian cells produced MAG- and DAG-phosphorylation products
      but no significant ceramide product in PMID:15939762, which explicitly discusses the positive
