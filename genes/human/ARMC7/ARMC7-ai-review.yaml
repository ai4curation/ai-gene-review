id: Q9H6L4
gene_symbol: ARMC7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARMC7 is a small armadillo-repeat protein that is a component of the activated human minor
  (U12-type) spliceosome. There it forms a complex with RBM48 that binds the gamma-monomethyl phosphate
  cap at the 5' end of U6atac snRNA, helping to stabilize the catalytic centre. The RBM48-ARMC7 interaction
  is conserved in plants, where RBM48 is required for U12 intron splicing.
