    supporting_text: It binds to the C2 domain of Suz12 and relocates the latter to a unique position in S12R4J2A2 to promote nucleosome binding
  - reference_id: PMID:29499137
    supporting_text: while S12R4J2A2d lost binding to mononucleosomes, S12R4J2A2a exhibited a 2-fold enhancement of nucleosome binding compared to the wild-type counterpart
  - reference_id: PMID:29499137
    supporting_text: In stark contrast, S12R4J2A2 displayed robust binding towards mononucleosomes, with a low micromolar binding affinity
  - reference_id: file:human/AEBP2/AEBP2-uniprot.txt
    supporting_text: 'monomeric PRC2.2 (class 2) complex consisting of at least SUZ12, RBBP4,'
- description: >-
    Intrinsic restraint on PRC2 by the long protein form. The vertebrate-specific acidic
    N-terminal region present in isoforms 1 and 2 - the forms found in essentially all human
    tissues - takes the complex's histone methyltransferase activity below the level of the core
    complex alone, and in cells lowers the amount of core complex on chromatin below that of cells
    expressing no AEBP2 at all. On a naked-DNA probe in vitro the effect is not below baseline:
    complexes carrying either long isoform bind no better than the core complex does, and it is
    the short form that raises affinity. This is an activity of AEBP2 acting on the complex it
    belongs to, so it is recorded as a molecular function the protein enables rather than as a
    contribution to a complex activity. It does not apply to the short form, isoform 3, which in
    humans is largely confined to testis and which instead raises the complex's affinity for
    DNA. It
    rests on a single 2025 study that reverses the field's earlier reading, which is recorded as a
    knowledge gap rather than smoothed over.
