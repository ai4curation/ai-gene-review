id: Q6ZN18
gene_symbol: AEBP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AEBP2 is a nuclear C2H2 zinc-finger protein that acts as an accessory subunit of Polycomb
  repressive complex 2 (PRC2), the histone methyltransferase that mono-, di- and trimethylates
  lysine 27 of histone H3. Together with JARID2 it defines the PRC2.2 holo-complex, which is
  mutually exclusive with the PCL/PALI1-containing PRC2.1 assembly. AEBP2 docks through its
  C-terminal region onto the non-canonical C2 domain of SUZ12, competing there with PHF19 and
  repositioning that domain; its extreme C-terminus extends into the histone-H3-tail pocket of
  RBBP4, where its own Lys502 and Arg503 occupy the site normally used by H3 Lys4 and Arg2, so
  that H3K4 recognition by the complex is progressively excluded. The same C-terminal segment
  contributes to the nucleosome-binding activity of the assembled complex, and on
  H2AK119-ubiquitylated nucleosomes AEBP2 and JARID2 each contact a ubiquitin moiety and the
  H2A-H2B surface, coupling PRC1-deposited H2A ubiquitylation to H3K27 methylation. The gene
  produces developmentally regulated long and short protein forms with opposite effects on the
  complex. The long form carries a vertebrate-specific acidic N-terminal extension and is the form
  present in essentially all human tissues; complexes containing it are almost inactive as
  histone methyltransferases, below the activity of the core complex alone, they gain none of the
  DNA-binding affinity the short form confers, and in cells they lower the amount of core complex
  on chromatin below that of cells expressing no AEBP2 at all. The short form lacks that
  extension, is in humans largely confined to testis, raises the complex's affinity for DNA by
  roughly ninetyfold and is required for de novo silencing of Polycomb target genes during the
  exit from naive pluripotency. In mouse the gene is essential for embryogenesis and is expressed mainly
  in neural-crest-derived cells, and its loss produces a Trithorax-like phenotype with increased
  H3K27 methylation at Polycomb targets. The protein localises to chromatin at PRC2 target loci,
  including the inactive X chromosome.
