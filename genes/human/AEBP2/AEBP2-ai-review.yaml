- term:
    id: GO:0035098
    label: ESC/E(Z) complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: part_of
  supporting_entities:
  - ARBA:ARBA00089504
  - UniProtKB:Q9Z248
  - ensembl:ENSMUSP00000084896
  review:
    summary: >-
      The term is correct and independently established by an IDA, two IPI rows and an IBA on
      this gene, so this row is accepted. Its inference route is nonetheless worth recording: the
      named ARBA rule grants membership of a specific multiprotein complex from structural-family
      membership plus taxon, inspecting no interaction evidence.
    action: ACCEPT
    reason: >-
      Every token was resolved, which is the point of a combinatorial reference: two of the three
      reduce to the same entity, because ensembl:ENSMUSP00000084896 is UniProtKB:Q9Z248, mouse
      Aebp2. So this row records one protein counted twice plus one rule, not three independent
      pipelines agreeing. Fetching the rule shows ARBA00089504 asserts exactly one annotation,
      GO:0035098, from 8 alternative condition sets, each a conjunction of FunFam
      identifiers and a taxon clause with no residue, interaction or assay condition anywhere in
      it. The set that fires on AEBP2 requires FunFam 3.30.160.60:FF:000323 AND FunFam
      3.30.160.60:FF:000471 AND Eukaryota AND NOT Ascomycota, and AEBP2's own cross-references
      are exactly those two FunFams. Requiring two co-occurring AEBP2-specific FunFams is what
      keeps the rule from over-reaching, and the remaining seven condition sets key on other PRC2
      subunits' folds (2.170.270.10 for the SET-domain subunits, 2.130.10.10 for the WD40
      subunits), each with its own taxon restriction. Since the conclusion is true and separately
      demonstrated, this is documented rather than filed as a rule defect.
    supported_by:
    - reference_id: file:human/AEBP2/AEBP2-bioinformatics/RESULTS.md
      supporting_text: '| [3] (fires on Q6ZN18) | `[''3.30.160.60:FF:000323'', ''3.30.160.60:FF:000471'']` | `[''Eukaryota'', ''NOT Ascomycota'']` |'
    propagation_review:
      root_cause: NO_FAILURE_CORE
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: ARBA:ARBA00089504
        source_label: ARBA rule asserting GO:0035098 from FunFam identifiers plus taxon
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The rule's entire condition set is structural-family membership and taxon. It happens
          to reach the right answer for AEBP2 because it demands two AEBP2-specific FunFams
          simultaneously, but it inspects no evidence that the protein is in the complex.
      - source_id: UniProtKB:Q9Z248
        source_label: mouse Aebp2 (reviewed, 504 aa)
        source_status: SUPPORTS_TRANSFER
        comment: Carries GO:0035098 by IDA from three independent references.
      - source_id: ensembl:ENSMUSP00000084896
        source_label: mouse Aebp2 - the same entity as UniProtKB:Q9Z248
        source_status: CIRCULAR_OR_REDUNDANT
        comment: >-
          Not an independent witness. This Ensembl protein identifier resolves to Q6ZN18's mouse
          ortholog Q9Z248, the token listed alongside it, so the reference records one source
          twice. The transfer itself is supported; it is the appearance of independent agreement
          that is not.
