      and SUZ12, and with IDA, ISS or IBA only on EED, EZH1 and EZH2 - the term tracks complex
      membership, not per-subunit evidence. Third, the definition: GO:0031507 requires a process
      that starts with heterochromatin nucleation, spreads, and ends with boundary formation, and
