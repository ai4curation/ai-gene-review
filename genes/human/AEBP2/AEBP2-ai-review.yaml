      orthologs, with one experimental anchor, human EZHIP Q86X51 by IDA, so AEBP2 would be the
      second protein to hold the term and the first that is itself a subunit of the complex it
      inhibits. The isoform field records Q6ZN18-1 because that is the construct the
      methyltransferase experiment is reported for. A limitation worth stating rather than
      glossing: the HMTase result is reported for "PRC2-AEBP2L" without separating the two long
      isoforms, so Q6ZN18-2's methyltransferase behaviour is inferred rather than measured - the
      two were separately measured only in the DNA-binding arm, where they were
      indistinguishable. The short form Q6ZN18-3 must not carry this term.
