core_functions:
- description: >-
    Accessory subunit of the PRC2.2 holo-complex. AEBP2 binds the non-canonical C2 domain of
    SUZ12, competing there with PHF19, and its C-terminal segment contributes to the
    nucleosome-binding activity of the assembled complex; on H2AK119-ubiquitylated nucleosomes it
    contacts a ubiquitin moiety and the H2A-H2B surface alongside JARID2. The nucleosome-binding
    contribution is a property of the assembled module rather than of AEBP2 alone, which is why it
    is recorded as a contribution and not as an activity the protein enables by itself. The
    isoform difference is quantitative rather than qualitative: it is strongest in the isoforms
    that retain the full C-terminus, isoforms 1 and 3, and isoform 2 supports the activity but
    roughly twofold less well.
  contributes_to_molecular_function:
    id: GO:0031491
    label: nucleosome binding
  directly_involved_in:
