    reason: >-
      Three independent lines. First, the projection test: this reference annotates nine entities
      and gives all nine - including the CPX-2212 and CPX-2330 complexes themselves - the same
      NAS term set, while the functional rows it carries (GO:0031491, GO:0046976, GO:0140693, all
      IMP) sit on EZH1 alone. So ComplexPortal projected the process terms and withheld the
      catalytic ones, and AEBP2's GO:0031507 is the projected kind. Second, the census across the
