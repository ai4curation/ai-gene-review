      be used because a query containing the inner colon returns HTTP 400, and three additional
      TrEMBL candidates were returned and are reported rather than hidden. Queried for its own
      evidence, that donor carries GO:0035098 by IDA three times over, from PMID:20064375,
      PMID:20064376 and PMID:31451685; the EZH2 positive control returns a non-zero from the same
      query pattern, so this is a real count. UniProtKB:Q6ZN18 is a self-reference, which is
      valid for an IBA and is recorded as NO_FAILURE_CORE rather than as circularity.
      PANTHER:PTN002323211 is a tree node, not a protein. Reciprocally, the node reaches 117
