- gap_statement: >-
    AEBP2 has no molecular function annotation in GOA, and the measured molecular activities that
    could fill the gap are either isoform-specific, complex-level, or measured only on the mouse
    protein.
  boundary: >-
    Established: it is the only one of the 12 PRC2-associated human proteins surveyed with
    zero molecular_function rows, against 94 for EZH2 and 5 for MTF2. Established: it contributes to
    the assembled complex's nucleosome binding, and the long isoform inhibits the complex's
    methyltransferase activity - the two annotations proposed here. Not established: whether the
