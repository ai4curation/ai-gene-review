    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      gates_passed is True and faith_pct 100, and recall was unusually good on this gene: the
      record surfaced PMID:41168462, which is the reference that reframes the annotation set.
      Marked LOW_QUALITY for two specific defects rather than as a blanket judgement. First, two
      of its 24 citations are bioRxiv DOIs in a PMID-shaped field
      (PMID:bio_10.1101_2025.11.09.687442, PMID:bio_10.1101_2025.10.14.682307); both concern the
      isoform story and no claim in this review rests on either. Second, its GO grounding block
      lists GO:0042393 histone binding, which the structural papers it cites do not support
      (they show AEBP2 mimicking a histone tail, not binding one) and GO:0003677 DNA binding,
      which GOA carries for no member of this family. It is cited here only as the source of
      those declined proposals, never for a mechanistic claim; the record's own caveat that the
      grounding block is coarse is accurate. Its framings also needed re-deriving: describing
      the short isoform as promoting PRC2 activity conflates a DNA-binding result with an HMTase
      result whose baseline differs.
