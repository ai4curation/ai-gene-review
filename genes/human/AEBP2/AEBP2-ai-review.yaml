proposed_new_terms:
- proposed_name: PRC2.2 complex
  proposed_definition: >-
    A Polycomb repressive complex 2 holo-complex containing the core subunits EED, EZH1 or EZH2,
    SUZ12 and RBBP4 or RBBP7 together with the accessory subunits AEBP2 and JARID2, and lacking
    the Polycomb-like and PALI1 accessory subunits characteristic of PRC2.1.
  justification: >-
    GO:0035098 has no children at all, so the ontology cannot express the PRC2.1/PRC2.2
    distinction even though it is an organising fact of current PRC2 biology: the two assemblies
    are mutually exclusive, use different recruitment logic, and their balance is required for
    correct regulation of Polycomb targets during differentiation. ComplexPortal already models
    the distinction, with CPX-2209, CPX-2212, CPX-2213 and CPX-2330 all named as PRC2.2 variants
    and all listed as AEBP2's complexes in UniProt. Without child terms, an AEBP2 or JARID2
    annotation is indistinguishable from a PHF19 or MTF2 annotation, and the subcomplex-specific
    literature cannot be captured. A sibling PRC2.1 term would be needed at the same time.
  proposed_parent:
    id: GO:0035098
    label: ESC/E(Z) complex
  supported_by:
  - reference_id: file:human/AEBP2/AEBP2-uniprot.txt
    supporting_text: 'monomeric PRC2.2 (class 2) complex consisting of at least SUZ12, RBBP4,'
  - reference_id: file:human/AEBP2/AEBP2-uniprot.txt
    supporting_text: 'ComplexPortal; CPX-2209; Polycomb repressive complex 2.2, EZH2-RBBP4 variant.'
- proposed_name: histone methyltransferase activator activity
  proposed_definition: >-
    Binds to and increases the activity of a histone methyltransferase.
  justification: >-
    A specificity gap rather than a blocking one, and an asymmetry in the ontology rather than an
    oversight in any one annotation. GO has GO:0180000 histone methyltransferase inhibitor
    activity for the negative direction, and GO:0010698 acetyltransferase activator activity for
    the analogous positive direction on a different class of histone-modifying enzyme, but the
    only methyltransferase activator term is GO:0141106, restricted to tRNA methyltransferases.
    The consequence is visible inside this complex: EED and SUZ12 both carry the generic parent
    GO:0008047 enzyme activator activity for their stimulation of EZH2, and any annotation of the
    short isoform of AEBP2 could only be made the same way. Because the direction of AEBP2's own
    effect is disputed, this term is proposed for the ontology's benefit rather than for use on
    this gene, and no activator annotation is proposed for AEBP2 here. Note that the
    molecular-function route is the only one GO now offers for this kind of claim: the whole
    biological-process branch for regulating histone methylation has been obsoleted without
    replacement - GO:0016571 histone methylation, GO:0031056 regulation of histone modification,
    GO:0031060/0031061/0031062 regulation of histone methylation, and the H3-K27-specific
    GO:0061085/0061086/0061087 are all obsolete and none carries a term_replaced_by. A search of
    live biological_process terms returns no non-obsolete regulation-of-histone-methylation term,
    controlled against a search for heterochromatin formation that does return live terms. So a
    process-level term for restraining H3K27 methylation cannot be requested in a branch GO has
    deliberately dismantled, and the inhibitor and activator molecular functions are where the
    claim belongs.
  proposed_parent:
    id: GO:0008047
    label: enzyme activator activity
  supported_by:
  - reference_id: file:human/AEBP2/AEBP2-bioinformatics/RESULTS.md
    supporting_text: '`GO:0180000` **histone methyltransferase inhibitor activity**'
suggested_questions:
- question: >-
    Is the absence of any DNA-binding annotation on AEBP2 deliberate? Neither human AEBP2, mouse
    Aebp2 nor Drosophila jing carries GO:0003677 or any descendant, verified with a positive
    control that returns 15 rows for human TP53 from the identical query, yet the protein's DNA
    binding has been measured twice - to the AE-1 element of the aP2 promoter, and to a bipartite
    CTT(N)15-23cagGCC motif derived from ChIP-cloned loci. PMID:19293275, the study that defined
    that motif, has zero annotations anywhere in GOA. If DNA binding is being withheld because
    both measurements are on the mouse protein and use GST fusions, that judgement is defensible
    and worth recording; if the reference was simply never curated, it is a gap.
  experts:
  - GO Central
  - MGI
- question: >-
    Should UniProt's FUNCTION and SUBUNIT lines record the isoform dependence of AEBP2's effect on
    PRC2? The entry currently states that AEBP2 acts as an accessory subunit of PRC2 leading to
    transcriptional repression, citing PMID:15225548, PMID:29499137 and PMID:31959557.
    PMID:41168462 reports that complexes containing the broadly expressed long isoform are almost
    inactive as histone methyltransferases and gain none of the DNA-binding affinity the short
    isoform confers, and it attributes the earlier stimulation results to use of the short isoform
    or of N-terminally truncated protein. Note the two arms differ: the methyltransferase result
    is below the core-complex baseline, whereas on naked DNA the long-isoform complexes sit at
    that baseline and it is the short isoform that raises affinity, so "inhibits DNA binding"
    holds for chromatin occupancy in cells rather than for the in vitro probe. That attribution is checkable and largely checks
    out: of 17 PDB entries resolving an AEBP2 chain, 15 declare an N-terminally truncated
    construct starting at residue 209 or later.
  experts:
  - UniProt
- question: >-
    Should a complex-level biological process be projected onto an accessory subunit that
    restrains the complex? AEBP2's only support for GO:0031507 heterochromatin formation is two
    ComplexPortal NAS rows, each of which gives an identical term set to the complex plus all
    seven of its subunits. Across the 12 PRC2-associated proteins surveyed, 11 carry the term
    (EPOP carries none) and 8 of those 11 hold it by NAS alone. Both references are structural studies that assay no step of heterochromatin
    assembly, and the isoform that human tissues predominantly express renders PRC2 nearly
    inactive.
  experts:
  - ComplexPortal
  - GO Central
- question: >-
    Is UniProt's GO:0003712 transcription coregulator activity for human AEBP2, listed in the
    entry as IEA:Ensembl, intended to reach GOA? It is absent from GOA, while mouse Aebp2 carries
    GO:0003712 by both IDA and IMP from PMID:10329662. Two considerations argue against simply
    importing it: no human PRC2 subunit carries the term, and its definition requires modulating
    transcription via binding to a DNA-binding transcription factor, which is not how PRC2 is
    recruited. Resolving the divergence one way or the other would be more useful than leaving the
    two records disagreeing. Separately, the entry's three IEA:UniProtKB-KW molecular function
    rows (GO:0003677, GO:0008270, GO:0006351) are absent from GOA because the keyword route was
    retired, so they are noted rather than acted on.
  experts:
  - UniProt
  - GO Central
suggested_experiments:
- hypothesis: >-
    The MANE-Select protein form of human AEBP2, isoform 2, supports weaker nucleosome binding by
    PRC2 than isoform 1, because its VSP_034359 deletion removes 14 of the 23 residues UniProt
    annotates as important for that activity.
  description: >-
    Reconstitute PRC2.2 with recombinant AEBP2 isoform 1 versus isoform 2 and measure
    mononucleosome binding by EMSA or a fluorescence-based assay, and H3K27 methyltransferase
    activity on a nucleosomal substrate. PMID:29499137 already showed that adding the 14 residues
    back to an isoform-2-derived construct doubles nucleosome binding, but the comparison has not
    been made between the two natural full-length isoforms, and isoform 2 is the product of the
    reference transcript.
  experiment_type: in vitro reconstitution
- hypothesis: >-
    The short protein form of AEBP2 is expressed at protein level in human tissues other than
    testis; or it is not, in which case the gene's PRC2-promoting activity is essentially
    testis-restricted in humans.
  description: >-
    An isoform-resolved proteomic or immunoblot survey of human tissues using antibodies or
    peptides that discriminate the N-terminal extension, complementing the transcript-level CAGE
    data. This determines whether the PRC2-promoting arm of AEBP2 biology exists outside testis in
    humans at all, which decides whether GO:0000122 is a whole-gene or a tissue-restricted
    statement.
  experiment_type: isoform-resolved proteomics
- hypothesis: >-
    The acidic N-terminal region of the long isoform inhibits PRC2 by competing with nucleic-acid
    or nucleosome binding surfaces rather than by disrupting complex assembly.
  description: >-
    Compare complex stoichiometry, SUZ12 C2 occupancy and JARID2 incorporation between PRC2
    reconstituted with the long and the short isoform, and test whether the isolated acidic region
    inhibits in trans. An in-trans effect would separate an autoinhibitory-module mechanism from a
    steric one, and would determine whether GO:0180000 is the right molecular function or whether
    a nucleic-acid-mimicry description is closer.
  experiment_type: biochemical reconstitution and mutagenesis
- hypothesis: >-
    Human AEBP2 occupies a sequence-defined subset of PRC2 target loci, as its mouse counterpart
    does.
  description: >-
    ChIP-seq or CUT&RUN for endogenous AEBP2 in a human cell line, with motif analysis, alongside
    SUZ12 and H3K27me3. All existing occupancy and motif data for this protein are mouse, which is
    why no DNA-binding annotation is proposed for the human gene despite two published
    measurements.
  experiment_type: genomics
knowledge_gaps:
- gap_statement: >-
    Whether AEBP2 stimulates or inhibits PRC2 is unresolved as a statement about the gene, because
    the answer depends on which protein isoform is present and the two directions rest on
    different bodies of work.
  boundary: >-
    Established: the complex containing the long isoform is almost inactive as a
    methyltransferase, below the level of the core complex alone, and loss of that isoform raises
    PRC2 occupancy and H3K27me3 at target genes. Also established: earlier work reporting
    stimulation used the short isoform or N-terminally truncated protein, a claim that survives a
    census of the deposited structures. Not established: whether the inhibition result replicates
    outside the single 2025 study, and what the short isoform does to methyltransferase activity,
    which against core complex alone was comparable rather than stimulatory. The DNA-binding arm
    is not the ambiguous one: there the short isoform raised affinity from above 4000 nM to
    45.5 nM, roughly ninetyfold, so it is strongly stimulatory.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: MF_DARK
  status: NARROWING
  significance: >-
    It decides the sign of every regulatory annotation on the gene, and it is why the
    direction-neutral GO:0006357 is the accepted core process while GO:0000122 is kept as
    non-core.
