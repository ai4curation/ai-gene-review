id: Q96RP9
gene_symbol: GFM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GFM1 encodes mitochondrial elongation factor G1 (EF-G1mt, mEF-G1), a nuclear-encoded translational
  GTPase of the EF-G/EF-2 family that is imported into the mitochondrial matrix via an N-terminal targeting
  presequence. On the 55S mitoribosome it catalyses the GTP-dependent translocation step of the elongation
  cycle, moving the A-site peptidyl-tRNA and P-site deacylated tRNA to the P and E sites together with
  the mRNA. In human mitochondria the two functions of bacterial EF-G are split between paralogs; EF-G1mt
  performs translocation only, whereas EF-G2mt (GFM2) acts with mitochondrial ribosome recycling factor
  in ribosome recycling. A mitochondria-specific C-terminal extension contacts the A-site tRNA acceptor
  arm during translocation. EF-G1mt is required for synthesis of the 13 mtDNA-encoded OXPHOS subunits,
  and biallelic GFM1 variants cause combined oxidative phosphorylation deficiency 1 (COXPD1), typically
  a rapidly progressive neonatal hepatoencephalopathy.
