core_functions:
- description: GTP-dependent translocase of the mitochondrial elongation cycle. Bound to the 55S mitoribosome
    after peptide-bond formation, EF-G1mt hydrolyses GTP to move the A-site peptidyl-tRNA and P-site deacylated
    tRNA, with the mRNA, into the P and E sites. Unlike bacterial EF-G it does not act in ribosome recycling,
    which is performed by its paralog EF-G2mt (GFM2).
  molecular_function:
    id: GO:0003746
    label: translation elongation factor activity
  directly_involved_in:
  - id: GO:0070125
    label: mitochondrial translational elongation
