    supporting_text: EF-G1mt specifically catalyzes translocation, whereas EF-G2mt mediates ribosome recycling
      with human mitochondrial RRF but lacks translocation activity
  - reference_id: PMID:32737313
    supporting_text: the mito-specific C-terminal extension in EF-G1mt is directly involved in translocation
      of the acceptor arm of the A-site tRNAmt
- description: Ribosome-stimulated GTP hydrolysis by the tr-type G domain, which powers and gates translocation
    on the mitoribosome.
