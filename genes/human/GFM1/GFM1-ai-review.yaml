suggested_questions:
- question: Why do some GFM1 variants produce an OXPHOS defect in fibroblasts but not in muscle, and does
    tissue-specific expression of GFM1 or GFM2 explain the hepatocerebral predominance of COXPD1?
- question: Does the mitochondria-specific lysine-rich C-terminal extension of EF-G1mt contribute to translocation
    fidelity or reading-frame maintenance on the leaderless mt-mRNAs?
suggested_experiments:
- description: Reconstituted single-turnover translocation kinetics on human mitoribosomes with wild-type
    EF-G1mt, a C-terminal-extension deletion and COXPD1 patient variants (e.g. R250W in subdomain G'),
    to separate defects in GTP hydrolysis from defects in tRNA movement.
- description: Mitoribosome profiling in patient fibroblasts and Gfm1 mutant mouse liver to test whether
    EF-G1mt deficiency causes codon- or transcript-specific elongation stalls.
