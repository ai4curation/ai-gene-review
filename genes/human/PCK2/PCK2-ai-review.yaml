id: Q16822
gene_symbol: PCK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PCK2 encodes the mitochondrial GTP-dependent phosphoenolpyruvate carboxykinase
  isozyme, a Mn2+-dependent matrix enzyme that converts oxaloacetate and GTP to phosphoenolpyruvate,
  GDP and CO2. Human liver contains both the cytosolic PEPCK-C isozyme PCK1 and the mitochondrial
  PEPCK-M isozyme PCK2, while PCK2 is expressed in several tissues and can support gluconeogenic,
  glyceroneogenic and cataplerotic phosphoenolpyruvate production from mitochondrial oxaloacetate.
  A more recent cancer-cell study reported a noncanonical GTP-dependent protein kinase activity in
  which PCK2 phosphorylates ACSL4 and thereby increases ferroptosis-associated phospholipid remodeling.
