proposed_new_terms: []
suggested_questions:
- question: Is the ACSL4 Thr679 kinase activity of PCK2 reproducible with fully recombinant PCK2
    and ACSL4, and is GTP the direct phosphoryl donor in the absence of contaminating kinases?
- question: Does human pancreatic PCK2 make the same quantitative contribution to the mitochondrial
    GTP/PEP cycle and glucose-stimulated insulin secretion that has been inferred from rodent beta-cell
    studies?
suggested_experiments:
- description: Reconstitute purified human PCK2 with recombinant ACSL4 C-terminal substrate,
    guanine nucleotides and active-site PEPCK mutants, then quantify ACSL4 Thr679 phosphorylation
    by targeted mass spectrometry.
  experiment_type: in vitro biochemical reconstitution
  hypothesis: PCK2 directly transfers phosphate from GTP to ACSL4 Thr679, and mutations that
    abolish the PEPCK active site will also abolish ACSL4 phosphorylation.
- description: Knock out PCK2 in human islet beta cells or stem-cell-derived beta-like cells,
    rescue with mitochondrial PCK2, and measure mitochondrial GTP/PEP cycling and glucose-stimulated
    insulin release.
  experiment_type: genome editing / metabolic flux
  hypothesis: Human PCK2 supports glucose-stimulated insulin secretion by coupling succinyl-CoA
    synthetase-derived mitochondrial GTP to anaplerotic PEP cycling.
