    action: KEEP_AS_NON_CORE
    reason: A 2024 study found that PCK2 directly phosphorylates ACSL4 on Thr679 and used PCK2
      knockout/rescue to connect this noncanonical activity to ferroptosis sensitivity. The
      activity is kept as a conditional, non-core moonlighting function because the core activity
