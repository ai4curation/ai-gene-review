# Variants reported in the literature for D-lactate dehydrogenase deficiency
# (D-lactic aciduria, MIM 245450). Values are AS REPORTED by the cited paper;
# analyze_variants.py checks each one against both RefSeq coding transcripts and
# the UniProt isoforms, and reports which numbering the paper used.
variants:
