    hgvs_c: c.1122G>T
    hgvs_p: p.Trp374Cys
    reported_transcript: NM_153486
    source: PMID:30931947
    zygosity: homozygous
    note: Patient 2 (consanguineous Moluccan parents); West syndrome, developmental delay, plasma D-lactate 1.1-1.2 mM (also de novo CACNA1B variant)
  - id: T463M
    hgvs_c: c.1388C>T
