      c with D-lactate (PMID:38413804), and wild-type but not patient-variant human LDHD clears D-lactate in ldhd-null
      zebrafish (PMID:30931947).
    action: ACCEPT
    reason: Core molecular function. The FAD-dependent D-lactate dehydrogenase reaction is demonstrated on the human
      protein by three independent groups, the catalytic machinery (Arg370, His421, His428, Glu465, His466 in the
      displayed isoform) is identical to that of the structurally characterised mouse enzyme, and loss of this activity
      is what defines D-lactate dehydrogenase deficiency. FADH2 is reoxidised by cytochrome c in the physiological
      reaction, which the cytochrome-specific term GO:0004458 captures; the two terms describe the two halves of
      one catalytic cycle. Transferred from mouse LDHD (Q7TNG8), the structurally and kinetically characterised
      ortholog; the human enzyme now has its own direct evidence.
    supported_by:
    - *id010
    - *id007
    - *id003
    - *id011
