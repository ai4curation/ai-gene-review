  - PANTHER:PTN000202298
  review:
    summary: PAINT propagates the NAD+-dependent D-lactate dehydrogenase term from node PTN000202298, where its
      only seed is an Arabidopsis D-LDH annotation.
    action: MODIFY
    reason: 'The reaction is right but the acceptor is wrong: LDHD is a flavoenzyme that uses FAD and passes the
      electrons to cytochrome c, and members of this family do not use NAD+ (NAD+-dependent D-lactate dehydrogenases
      belong to the unrelated D-isomer-specific 2-hydroxyacid dehydrogenase superfamily). This is a lateral correction
      of the acceptor, to GO:0140170, which the gene already carries with experimental evidence. The fault lies
      in the term chosen at the PAINT node, not in the placement of the node; the PTHR11748 family review records
      the requested change.'
