        position: 351
        residue: W
        sequence_version: 1
      canonical:
        accession: UniProtKB:Q86WU2
        position: 374
        residue: W
        sequence_version: 1
      note: ClinVar VCV000586968 gives p.Trp351Cys on NM_194436 (isoform 2).
  - statement: ldhd-null zebrafish accumulate D-lactate but not L-lactate and are otherwise normal.
    supporting_text: metabolic analysis revealed elevated levels of D-lactate, but not L-lactate, in ldhd−/− larvae
      compared to wildtype (Fig. 4b, c)
  - statement: Wild-type human LDHD mRNA restores D-lactate to baseline in the mutant fish; the two patient variants
      do not.
    supporting_text: microinjection of variant Thr463Met LDHD or Trp374Cys LDHD mRNA did not rescue the metabolic
      phenotype (Fig. 4b)
  - statement: Both patients also accumulate the branched-chain D-2-hydroxy acids.
    supporting_text: Increased levels of D-2-hydroxyisovaleric acid and D-2-hydroxyisocaproic acid were observed
      in both of our patients.
  - statement: Both patients carry a second genetic finding that may explain their neurological features, and the
      authors leave open whether LDHD deficiency has a clinical phenotype.
