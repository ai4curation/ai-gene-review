id: Q86WU2
gene_symbol: LDHD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LDHD encodes the mitochondrial D-lactate dehydrogenase, a flavoprotein of the PCMH/VAO fold that oxidises
  D-lactate to pyruvate and passes the electrons through its bound FAD to cytochrome c. The enzyme requires a divalent
  metal, Mn2+ in the characterised mouse ortholog, which is held by two histidines and a glutamate and coordinates
  the carboxylate and C2 hydroxyl of the substrate; a neighbouring histidine acts as the catalytic base. It is strictly
  specific for the D (2R) configuration and also oxidises other (2R)-2-hydroxy acids with small hydrophobic side
  chains, including the branched-chain D-2-hydroxyisovalerate and D-2-hydroxyisocaproate, but not D-2-hydroxyglutarate.
  The protein is imported into mitochondria by an N-terminal presequence and associates peripherally with the inner
  membrane. It is most abundant in liver, heart, skeletal muscle and kidney. LDHD is the only human enzyme that
  clears D-lactate, which arises from methylglyoxal detoxification by the glyoxalase system, from gut bacteria and
  from the diet. Biallelic loss-of-function variants cause D-lactate dehydrogenase deficiency (D-lactic aciduria),
  with persistently raised plasma and urinary D-lactate, hyperuricaemia and early-onset gout in some families, and
  neurodevelopmental features of uncertain causal link in others. Two splice isoforms differ by a 23-residue surface
  segment encoded by an alternative acceptor site of exon 6; the shorter isoform corresponds to the protein found
  in other vertebrates.
alternative_products:
- name: 1 (hDLDH-1)
  id: Q86WU2-1
  description: 507 residues, encoded by NM_153486; the sequence UniProt displays and the numbering used for all
    published missense variants.
- name: 2 (hDLDH-2)
  id: Q86WU2-2
