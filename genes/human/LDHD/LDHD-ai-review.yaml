- term:
    id: GO:0140170
    label: D-lactate dehydrogenase (FAD) activity
  evidence_type: EXP
  original_reference_id: PMID:30931947
  qualifier: enables
  review:
    summary: Human LDHD oxidises D-lactate to pyruvate with FAD as the bound cofactor. Recombinant human enzyme
      is strictly D-stereospecific and FAD-containing (PMID:38373542), purified human isoform 2 reduces cytochrome
      c with D-lactate (PMID:38413804), and wild-type but not patient-variant human LDHD clears D-lactate in ldhd-null
      zebrafish (PMID:30931947).
    action: ACCEPT
    reason: 'Core molecular function. The FAD-dependent D-lactate dehydrogenase reaction is demonstrated on the
      human protein by three independent groups, the catalytic machinery (Arg370, His421, His428, Glu465, His466
      in the displayed isoform) is identical to that of the structurally characterised mouse enzyme, and loss of
      this activity is what defines D-lactate dehydrogenase deficiency. FADH2 is reoxidised by cytochrome c in the
      physiological reaction, which the cytochrome-specific term GO:0004458 captures; the two terms describe the
      two halves of one catalytic cycle. This row cites the paper that defined the human deficiency: it contains
      no in vitro assay of the human enzyme, and the activity is inferred from rescue of D-lactate accumulation
      in ldhd-null zebrafish by wild-type but not variant human LDHD, an in vivo readout of the same activity.'
    supported_by:
    - *id010
    - *id007
    - *id003
    - &id011
      reference_id: PMID:30931947
      supporting_text: uninjected embryos showed a significant D-lactate increase that was restored to baseline
        levels by mRNA microinjection of the wildtype LDHD sequence
