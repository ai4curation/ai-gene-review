  review:
    summary: 'PAINT propagates the cytochrome c-dependent D-lactate dehydrogenase activity of yeast Dld1 and Arabidopsis
      D-LDH from node PTN000202298. For the human protein the activity is now shown directly: purified human LDHD
      reduces cytochrome c with D-lactate (kcat 103 per min, KM 112 micromolar) and LDHD knockout cells lose D-lactate-driven
