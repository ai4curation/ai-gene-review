    reason: 'Bare protein binding says nothing about what LDHD does, and the evidence does not support a more informative
      molecular function for LDHD: it is the enzyme, not an adaptor, and the proposed consequence of the interaction
      (CSRP3 raising LDHD activity) would be a function of CSRP3. Removal follows the protein-binding policy and
      does not dispute the interaction, which is recorded in the findings and may be regulatory. Only the abstract
