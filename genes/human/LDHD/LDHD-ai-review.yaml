- id: PMID:37863926
  title: Lactate dehydrogenase D is a general dehydrogenase for D-2-hydroxyacids and is associated with D-lactic
    acidosis.
  findings:
  - statement: Mouse LDHD is a Mn2+-dependent dehydrogenase for D-lactate and other D-2-hydroxy acids with hydrophobic
      side chains, inactive on L-isomers and on hydrophilic D-2-hydroxy acids.
    supporting_text: We demonstrate that mLDHD is an Mn2+-dependent general dehydrogenase which exhibits catalytic
      activity for D-lactate and other D-2-hydroxyacids containing hydrophobic moieties, but no activity for their
      L-isomers or D-2-hydroxyacids containing hydrophilic moieties.
  - statement: Glycolate, D-malate and D-2-hydroxyglutarate are not substrates, which separates LDHD from D2HGDH.
    supporting_text: The results show that mLDHD has no activity towards these hydroxyacids (Fig. 1d).
  - statement: Mn2+ is bound by His398, His405 and Glu442 (human His421, His428, Glu465), the flavin O4 and the
      substrate.
    supporting_text: Mn2+ forms six coordination bonds in an octahedral geometry with the side chains of His398,
      His405, and Glu442, the O4 atom of the flavin moiety of FAD, and the C1-carboxyl and C2-hydroxyl groups of
      D-lactate (Fig. 3b)
  - statement: His443 (human His466) is the catalytic base and the hydride goes to FAD N5.
    supporting_text: The sidechain of His443 recognizes the C2-hydroxyl group and acts as a Lewis base to extract
      a proton from the hydroxyl group.
  - statement: The four human disease substitutions were made in the mouse enzyme at the equivalent positions.
    supporting_text: The T251M, R370W, W374C, and T463M mutations of hLDHD correspond to T228M, R347W, W351C, and
      T440M of mLDHD, respectively.
  - statement: All four mouse mutants lose about 90% of activity and 10-15 degrees of thermal stability.
    supporting_text: the activity assay shows that all the mutants lose about 90% of the activity towards D-lactate,
      D-2-hydroxyisovalerate and DL-2-hydroxyisocaproate (Fig. 4a and Supplementary Table 1)
  - statement: R347W and W351C keep FAD and lose substrate binding; T228M and T440M lose FAD.
    supporting_text: the disease-associated mutations either disrupt the substrate binding (R347W and W351C) or
      the FAD binding (T228M and T440M), leading to abolishment of the enzymatic activity
  - statement: The 23-residue human insertion is a surface element away from both binding sites.
    supporting_text: This insertion is positioned far away from the FAD-binding site and the substrate-binding site,
      and thus is unlikely to affect the binding of FAD and/or substrate as well as the catalytic reaction (Supplementary
      Fig. 11).
  - statement: The authors regard the physiological electron acceptor as unknown.
    supporting_text: However, the primary oxidant under physiological conditions is unknown
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. All residue numbers are mouse LDHD (Q7TNG8), which equal human isoform 2 numbers
      and are 23 lower than the displayed human numbering after residue 233. The paper uses artificial acceptors
      (PMS/DCIP) and leaves the physiological acceptor open. The cached text has no Ldhd knockout mouse.
- id: PMID:38413804
  title: 'PMF-seq: a highly scalable screening strategy for linking genetics to mitochondrial bioenergetics.'
  findings:
  - statement: Purified human LDHD transfers electrons from D-lactate directly to cytochrome c.
    supporting_text: Using the purified LDHD, we could confirm direct electron transfer from d-lactate to cytochrome
      c by monitoring its haem absorbance (Fig. 3f).
  - statement: LDHD-knockout human cells lose D-lactate-driven membrane potential but still respond to ascorbate/TMPD.
    supporting_text: their response to d-lactate was blunted (Fig. 3c)
  - statement: D-2-hydroxybutyrate is also a substrate of the human enzyme.
    supporting_text: we identified d-2-hydroxybutyrate as another LDHD substrate that can be used to reduce cytochrome
      c (Fig. 3g)
  - statement: Purified human isoform 2 runs as a dimer.
    supporting_text: ran as a dimer during gel filtration chromatography (Fig. 3d,e).
  - statement: LDHD knockout does not change methylglyoxal sensitivity of the cell lines tested.
    supporting_text: we tested the wild-type and KO cells’ sensitivity to methylglyoxal but saw little difference
      (Extended Data Fig. 5b,c)
  - statement: The recombinant protein was isoform 2.
    supporting_text: followed by human LDHD isoform 2, a C-terminal TEV cleavage site, and a 10× histidine tag
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. The only direct demonstration of cytochrome c reduction by the human enzyme; the
      protein was isoform 2 expressed in Pichia with a yeast presequence. UniProt does not yet cite this paper.
