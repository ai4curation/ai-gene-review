functional_isoforms:
- id: LDHD_ISO2
  name: LDHD isoform 2 (484 residues, MANE Select, conserved form)
  type: SPLICE_VARIANT
  description: Isoform lacking residues 211-233 of the displayed sequence, produced by the downstream alternative
    3' splice site of exon 6. It is the product of the MANE Select transcript NM_194436, aligns residue for residue
    with mouse LDHD (the crystallised enzyme), and is the form whose cytochrome c reductase activity was measured
    (PMID:38413804) and that rescued ldhd-null zebrafish (PMID:30931947, construct NM_194436.1). Residue numbers
    in ClinVar and gnomAD refer to this isoform and are 23 lower than the displayed numbering after residue 233.
    Both isoforms are catalytically active (PMID:38373542), so no GO term is isoform-specific.
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q86WU2-2
  - type: REFSEQ_PROTEIN
    ids:
    - NP_919417.1
- id: LDHD_ISO1
  name: LDHD isoform 1 (507 residues, displayed sequence)
  type: SPLICE_VARIANT
  description: Isoform carrying the 23-residue segment FGFWPEIPHHTAWYSPCVSLGRR (residues 211-233) from the upstream
    acceptor site of exon 6. The segment has no counterpart in mouse, rat, cow, chicken, Xenopus, zebrafish, yeast
    or Arabidopsis orthologs, is modelled with very low confidence by AlphaFold and lies more than 20 A from the
    active site (bioinformatics RESULTS, section 1). Recombinant isoform 1 is reported to be more active on D-lactate
    than isoform 2 and to differ in oligomeric state (PMID:38373542). The most frequent stop-gain allele in gnomAD
    (p.Trp223Ter, one homozygote) falls in this segment and leaves isoform 2 intact, which argues that isoform 1
    is not required for D-lactate clearance.
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q86WU2-1
  - type: REFSEQ_PROTEIN
    ids:
    - NP_705690.2
