      in LDHD, encoding lactate dehydrogenase D, in two unrelated patients with elevated D-lactate urinary excretion
      and plasma concentrations
  - statement: Patient 1 (the 1977 index case, Sicilian parents) is homozygous for c.1388C>T p.(Thr463Met) on NM_153486.3;
      both parents are carriers. This is Thr440 in isoform 2 and in ClinVar/gnomAD.
    supporting_text: identified a homozygous LDHD nonsynonymous variant NM_153486.3:c.1388C>T
    residue_mappings:
    - as_reported:
        accession: UniProtKB:Q86WU2-2
        position: 440
        residue: T
        sequence_version: 1
      canonical:
        accession: UniProtKB:Q86WU2
        position: 463
        residue: T
        sequence_version: 1
      note: ClinVar VCV000586969 and gnomAD give this residue as p.Thr440Met on the MANE Select transcript NM_194436
        (isoform 2); the paper and UniProt use isoform 1.
  - statement: Patient 2 (consanguineous Moluccan parents) is homozygous for c.1122G>T p.(Trp374Cys) on NM_153486.3.
      This is Trp351 in isoform 2.
    supporting_text: identifies a separate novel, homozygous nonsynonymous variant NM_153486.3:c.1122G>T, p.(Trp374Cys).
      Both the mother and the father are heterozygous carriers of the variant.
    residue_mappings:
    - as_reported:
