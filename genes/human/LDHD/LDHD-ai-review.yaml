- id: file:human/LDHD/LDHD-uniprot.txt
  title: UniProtKB entry Q86WU2 for human LDHD
  findings:
  - statement: UniProt writes the reaction with FAD as acceptor.
    supporting_text: Reaction=(R)-lactate + FAD + H(+) = FADH2 + pyruvate;
    record_section:
    - CC:CATALYTIC ACTIVITY
  - statement: Subcellular location is given as mitochondrion by similarity to mouse.
    supporting_text: 'SUBCELLULAR LOCATION: Mitochondrion {ECO:0000250|UniProtKB:Q7TNG8}.'
    record_section:
    - CC:SUBCELLULAR LOCATION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Entry version 171. Displays isoform 1 although MANE Select is isoform 2; the FUNCTION text does
      not mention cytochrome c as the electron acceptor (PMID:38413804 is not cited); subcellular location is by
      similarity although human proteomic and overexpression data exist.
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q86WU2
      slot: CC FUNCTION / CATALYTIC ACTIVITY
      requested_change: ADD
      asserted_value: Catalytic activity written only with FAD as acceptor (RHEA:82479); no statement of the physiological
        electron acceptor
      corrected_value: 'RHEA reaction for D-lactate dehydrogenase (cytochrome), EC 1.1.2.4: (R)-lactate + 2 Fe(III)-[cytochrome
        c] = pyruvate + 2 Fe(II)-[cytochrome c] + 2 H(+), with PMID:38413804 as evidence'
      confidence: CONFIRMED
      explanation: PMID:38413804 (full text read) shows that purified human LDHD isoform 2 reduces cytochrome c
        with D-lactate (kcat 103 per min, KM 112 micromolar) and that LDHD knockout abolishes D-lactate-driven membrane
        potential in two human cell lines. The UniProt entry does not cite this paper, so the FAD-level half-reaction
        is the only catalytic activity recorded and the GO cytochrome-specific term reaches the human protein only
        by IBA.
      supported_by:
      - reference_id: PMID:38413804
        supporting_text: Using the purified LDHD, we could confirm direct electron transfer from d-lactate to cytochrome
          c by monitoring its haem absorbance (Fig. 3f).
- id: file:human/LDHD/LDHD-bioinformatics/RESULTS.md
  title: LDHD variant placement, isoform and population analysis (this review)
  findings:
  - statement: Isoform 2 arises from an alternative 3' splice site within exon 6.
    supporting_text: The extra 69 nt are the first 69 nt of exon 6 and end in AG, so isoform 2 uses an alternative
      3' splice site 69 nt downstream of the one used by isoform 1.
  - statement: Mouse numbering equals human isoform 2 numbering.
    supporting_text: Mouse LDHD (Q7TNG8, 484 aa) aligns with human isoform 2 without a gap, so mouse numbering (used
      in PDB 8JDB-8JDZ and in PMID:37863926) equals human isoform 2 numbering at every position (413 of 484 residues
      identical).
  - statement: The commonest stop-gain allele in gnomAD is specific to isoform 1.
    supporting_text: The most frequent stop-gain allele in gnomAD, c.669G>A p.Trp223Ter (563 alleles, frequency
      3.5e-04, one homozygote), lies in the isoform-1-only segment and is intronic in the MANE Select transcript,
      so it is not a loss-of-function allele of the conserved isoform 2.
  - statement: LDHD tolerates heterozygous loss of function.
    supporting_text: 'gnomAD v4 shows no constraint against heterozygous loss of function: pLI = 0.00, LOEUF = 1.36
      (58 observed against 52.9 expected), missense Z = -1.30.'
  - statement: Thr463 caps the turn that carries the Mn2+ ligand and the catalytic base.
    supporting_text: 'Thr440 (human Thr463) is the N-cap of the turn carrying Glu442 and His443: its hydroxyl bonds
      the backbone amides of His443 and Gly444 and the carboxylate of Asp367.'
  - statement: Arg370 and Trp374 line the substrate pocket.
    supporting_text: Arg347 and Trp351 (human Arg370 and Trp374) line the substrate pocket itself, so the structure
      supports a substrate-binding defect for R370W and W374C, not a defect of a separate electron-acceptor site.
  - statement: MitoCarta3.0 places LDHD at the inner membrane without APEX evidence for either face.
    supporting_text: LDHD was detected in neither the APEX matrix proteome nor the APEX intermembrane-space proteome,
      so MitoCarta3.0 does not say which face of the inner membrane it occupies.
