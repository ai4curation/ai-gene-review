proposed_new_terms:
- proposed_name: D-lactate catabolic process
  proposed_definition: The chemical reactions and pathways resulting in the breakdown of D-lactate, the (R) enantiomer
    of 2-hydroxypropanoate, for example its oxidation to pyruvate by a D-lactate dehydrogenase.
  justification: 'D-lactate and L-lactate are made and removed by different, non-overlapping enzymes: LDHD loss
    raises D-lactate and leaves L-lactate unchanged, and the disease that results is defined by the D enantiomer.
    GO has enantiomer-specific activity terms (GO:0047809 and its children) but only the unspecific process GO:1903457,
    so D-lactate clearance by LDHD, yeast Dld1 or bacterial Dld cannot be distinguished from L-lactate catabolism
    at the process level.'
  proposed_parent:
    id: GO:1903457
    label: lactate catabolic process
  supported_by:
  - reference_id: PMID:30931947
    supporting_text: levels of L-lactate were not significantly altered among the different conditions, establishing
      that LDHD is stereospecific for D-lactate only (Fig. 4c)
  - *id016
proposed_ontology_changes:
- change_type: NODE_TEXT_DEFINITION_CHANGE
  ontology: GO
  about_node:
    id: GO:0004457
    label: lactate dehydrogenase activity
  old_value: 'Catalysis of the reaction: lactate + NAD+ = H+ + NADH + pyruvate.'
  new_value: Catalysis of the oxidation of lactate to pyruvate, with the concomitant reduction of an electron acceptor.
  origin: SELF_PROPOSED
  justification: GO:0004457 is the is_a parent of GO:0140170 D-lactate dehydrogenase (FAD) activity and GO:0004458
    D-lactate dehydrogenase (cytochrome) activity (QuickGO ancestors, checked 2026-11-26), but its text definition
    names NAD+ as the acceptor. A flavoenzyme such as LDHD that never uses NAD+ therefore inherits a parent whose
    definition it does not satisfy, and the human GO:0004457 IDA annotation from PMID:38373542 is true of the label
    and false of the definition. Either the definition should be made acceptor-neutral, or the NAD+ reaction should
    be confined to a child term and the FAD and cytochrome terms moved out from under it.
  confidence: PROBABLE
  affected_annotations:
  - UniProtKB:Q86WU2 GO:0004457 IDA PMID:38373542
  supported_by:
  - *id007
  - *id006
  request_status: NOT_FILED
knowledge_gaps:
- gap_statement: Which face of the mitochondrial inner membrane human LDHD occupies is not established. Rat liver
    fractionation places the activity on the matrix side (active in inside-out submitochondrial particles, absent
    from mitoplasts), whereas direct reduction of cytochrome c by the purified human enzyme and LDHD-dependent,
    D-lactate-driven membrane potential imply access to the intermembrane space. LDHD is absent from both the APEX
    matrix and the APEX intermembrane-space proteomes compiled in MitoCarta3.0, and no protease-protection or import
    study of the human protein was found.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Topology decides whether D-lactate must be imported into the matrix before oxidation and which carriers
    are part of the clearance pathway.
  provenance:
  - *id004
  - *id003
  - reference_id: file:human/LDHD/LDHD-bioinformatics/RESULTS.md
    supporting_text: LDHD was detected in neither the APEX matrix proteome nor the APEX intermembrane-space proteome,
      so MitoCarta3.0 does not say which face of the inner membrane it occupies.
- gap_statement: Whether LDHD deficiency itself causes neurological disease is unknown. D-lactate elevation is found
    in every patient, but the families with the highest D-lactate have gout and no neurological signs, and three
    of the patients with neurodevelopmental features carry a second plausible cause.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  provenance:
  - reference_id: PMID:30931947
    supporting_text: it remains to be elucidated whether LDHD deficiency is a biochemical anomaly only, or if it
      contributes to a human clinical phenotype
  - reference_id: PMID:40678184
    supporting_text: Altogether, there is no obvious correlation between the type of pathogenic variant of the LDHD
      gene and the phenotype.
- gap_statement: The renal transporter that couples D-lactate secretion to urate reabsorption in LDHD deficiency
    has not been identified; the exchange mechanism is inferred from hyperuricaemia in patients and in mice injected
    with D-lactate.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  provenance:
  - reference_id: PMID:31638601
    supporting_text: Consequent excessive renal secretion of d-lactate in exchange for uric acid reabsorption culminated
      in hyperuricemia and gout.
- gap_statement: The function of the human-specific 23-residue segment of isoform 1 is unknown. It is reported to
    raise activity and change the oligomeric state of the recombinant enzyme, yet it is absent from every other
    species examined and from the MANE Select transcript, and a stop codon within it is carried homozygously in
    the general population.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  provenance:
  - *id010
  - reference_id: file:human/LDHD/LDHD-bioinformatics/RESULTS.md
    supporting_text: None of the eight non-human orthologs examined (mouse, rat, cow, chicken, Xenopus, zebrafish,
      yeast Dld1, Arabidopsis D-LDH) has residues aligned to the isoform-1-only segment.
suggested_questions:
- question: Does human LDHD face the intermembrane space or the matrix, and is D-lactate import across the inner
    membrane required for its oxidation?
- question: Is the urate retention of LDHD deficiency mediated by URAT1 (SLC22A12) or another apical anion exchanger
    using D-lactate as counter-ion, and would uricosuric drugs acting on that exchanger correct it?
- question: Should the displayed UniProt isoform of Q86WU2 be isoform 2 (the MANE Select, cross-species conserved
    form) so that variant numbering agrees between UniProt, ClinVar and gnomAD?
- question: Do the branched-chain D-2-hydroxy acids that accumulate in LDHD deficiency come from host metabolism
    or from gut bacteria, and do they contribute to the phenotype?
suggested_experiments:
- hypothesis: The catalytic domain of human LDHD faces the intermembrane space.
  description: Protease-protection and carbonate-extraction assays on mitoplasts and intact mitochondria from human
    hepatocyte-derived cells with endogenously tagged LDHD, combined with matrix- and IMS-targeted APEX2 proximity
    labelling.
  experiment_type: subcellular fractionation and proximity labelling
- hypothesis: p.Thr463Met and p.Thr251Met destabilise FAD binding in the human enzyme, whereas p.Arg370Trp and p.Trp374Cys
    retain FAD but lose substrate binding; p.Val69Ala reduces protein stability.
  description: Express the five human missense variants in the isoform 2 background, measure FAD occupancy, melting
    temperature and cytochrome c reductase kinetics with D-lactate and D-2-hydroxyisovalerate, and quantify steady-state
    protein in LDHD-knockout cells.
  experiment_type: enzyme kinetics and protein stability
- hypothesis: Isoform 1 is dispensable for D-lactate clearance.
  description: Measure plasma and urinary D-lactate in carriers homozygous for the isoform-1-specific stop-gain
    allele p.Trp223Ter (recallable from biobanks), and compare D-lactate-driven membrane potential in LDHD-knockout
    cells re-expressing isoform 1 or isoform 2.
  experiment_type: human genetics recall and cell complementation
