- id: PMID:38373542
  title: The catalytic action of human d-lactate dehydrogenase is severely inhibited by oxalate and is impaired
    by mutations triggering d-lactate acidosis.
  findings:
  - statement: Both recombinant human isoforms are strictly D-stereospecific; isoform 1 is the more active.
    supporting_text: hDLDH is strictly stereospecific, with the larger isoform (hDLDH-1) featuring higher activity
      at the expense of d-lactate when compared to its smaller counterpart (hDLDH-2)
  - statement: FAD is the cofactor of the human enzyme.
    supporting_text: we identified FAD as the cofactor of hDLDH, and we report here a model of FAD binding by the
      human d-lactate dehydrogenase
  - statement: Oxalate is a potent inhibitor.
    supporting_text: hDLDH is strongly inhibited by oxalate, as indicated by a Ki equal to 1.2 μM for this dicarboxylic
      acid
  - statement: Isoform 1 behaves as a hexamer and isoform 2 as a tetramer by gel filtration and light scattering;
      other groups report a monomer (mouse) or dimer (human isoform 2), so the oligomeric state is unsettled.
    supporting_text: hDLDH-1 and hDLDH-2 were determined, by means of gel filtration and dynamic light scattering
      experiments, to be a hexamer and a tetramer, respectively
  - statement: The two Monroe variants, here numbered W323C and T412M (Trp374 and Thr463 of the displayed sequence),
      reduce activity.
    supporting_text: the mutations W323C and T412 M negatively affect the activity of hDLDH, most likely by impairing
      the enzyme electron-acceptor site
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in the cache. The variant names W323C and T412M are 51 lower than the isoform 1
      numbers (374, 463), consistent with numbering from the start of the presequence-less construct; the abstract
      does not explain this. Its attribution of the defects to an electron-acceptor site is not supported by the
      mouse crystal structures, where both residues are at the substrate and catalytic sites.
