- term:
    id: GO:0005743
    label: mitochondrial inner membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9837978
  qualifier: located_in
  review:
    summary: Reactome lists LDHD among the mitochondrial inner-membrane proteins bound and degraded by the LONP1
      protease (LDHD is in the participant set of both reactions, checked through the Reactome participants service
      on 2026-11-26; the event summaries do not name it).
    action: ACCEPT
    reason: 'Inner-membrane association is the consistent biochemical picture: rat liver D-lactate dehydrogenase
      activity fractionates with inner-membrane vesicles (PMID:11955284), the human enzyme behaves as a membrane
      flavoprotein in prostate-cell mitochondria (PMID:23333299), and the enzyme passes electrons to cytochrome
      c, a carrier that works at the inner membrane (PMID:38413804). MitoCarta3.0 also assigns LDHD to the inner
      membrane. LDHD has no predicted transmembrane segment, so the association is peripheral. Which face of the
      membrane it sits on is unresolved: the rat fractionation places it on the matrix side, whereas direct reduction
      of cytochrome c argues for the intermembrane-space side (recorded as a knowledge gap). The Reactome rows themselves
      rest on a LONP1 substrate set, not on a localisation experiment.'
    supported_by:
    - &id004
      reference_id: PMID:11955284
      supporting_text: the activity of the putative flavoprotein (D-lactate dehydrogenase) was detected in inside-out
        submitochondrial particles, but not in mitochondria and mitoplasts, as it is localized in the matrix phase
        of the mitochondrial inner membrane
    - &id005
      reference_id: PMID:23333299
      supporting_text: This is due to the mitochondrial D-lactate dehydrogenase, a membrane flavoprotein, the activity
        and protein level of which are higher in PC-3 than in PNT1A cells, as detected by both kinetic and immunological
        analysis.
    - *id003
    - reference_id: file:human/LDHD/LDHD-bioinformatics/RESULTS.md
      supporting_text: MitoCarta3.0 assigns LDHD to the mitochondrial inner membrane (MIM), with evidence "literature,
        yeast mito homolog+, mito protein domain, MS/MS++".
