    - *id007
    - *id003
    - reference_id: PMID:37863926
      supporting_text: The NAD-dependent D-LDHs were found in some bacteria and belong to the D-isomer specific
        2-hydroxyacid dehydrogenase superfamily
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - ROLE_CONFLATION
      source_entities:
