- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1201406
  - PANTHER:PTN000040759
  - RGD:3681
  - RGD:3682
  - UniProtKB:Q14973
  - UniProtKB:Q96EP9
  review:
    summary: PAINT places plasma-membrane localization at PANTHER:PTN000040759, the ancestral SLC10 node, from experimentally
      grounded rodent and human descendants; SLC10A6 inherits it. Human SOAT is directly shown to sort to the plasma
      membrane in transfected cells, and every functional assay for the protein is an uptake measurement on intact
      cells, which requires the carrier to be at the cell surface [PMID:37373074, PMID:28743544].
    action: ACCEPT
    reason: 'The node placement is sound and the target is squarely inside the clade: all functionally characterized
      SLC10 carriers are plasma-membrane transporters. For SLC10A6 specifically, sorting studies in HEK293 cells
      localize the protein to the plasma membrane [PMID:37373074], the mouse ortholog is described as a plasma membrane
      transporter in germ cells [PMID:28743544], and immunohistochemistry places it in the apical membrane of placental
      syncytiotrophoblasts [PMID:24717977]. This is the location where the gene''s core activity is executed, so
      it is retained as core.'
    supported_by:
    - reference_id: PMID:37373074
      supporting_text: Sorting studies in transfected HEK293 cells clearly localized the SOAT protein to the plasma
        membrane
    - reference_id: PMID:28743544
      supporting_text: SOAT (gene name SLC10A6 in man and Slc10a6 in mice) is a plasma membrane transporter for
        sulfated steroids, which is highly expressed in germ cells of the testis.
    - reference_id: PMID:24717977
      supporting_text: Immunohistochemical studies and in situ hybridization of formalin fixed and paraffin embedded
        sections of human late term placenta showed expression of SOAT in syncytiotrophoblasts, predominantly at
        the apical membrane as well as in the vessel endothelium.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000040759
        source_status: SUPPORTS_TRANSFER
        comment: Ancestral SLC10 node; plasma-membrane residence is experimentally established in both the rodent
          and human descendants used to place the IBD, and independently for SLC10A6 itself.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-433089
  qualifier: located_in
  review:
    summary: 'Reactome asserts plasma-membrane localization for SOAT as part of its taurolithocholate-3-sulphate
      uptake reaction [Reactome:R-HSA-433089]. Independent experimental data agree: transfected human SOAT sorts
      to the plasma membrane and placental SOAT is apical-membrane localized [PMID:37373074, PMID:24717977].'
