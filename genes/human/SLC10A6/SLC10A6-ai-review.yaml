      any molecular function of SLC10A6. The source is a systematic proteome-scale yeast two-hybrid map [PMID:32296183]
      that assigns no function to either partner, and nothing in it supports a more specific molecular-function
      term for SLC10A6, so MODIFY is not available. Removing the annotation does not assert that the reported interaction
      is false; it removes a row that adds no functional knowledge beyond SLC10A6''s established activity as a sodium-coupled
      importer of sulfated steroid hormones [PMID:17491011, PMID:34079822]. Note that informative, hypothesis-driven
      interaction data do exist for this protein - SOAT homo-oligomerizes and heterodimerizes with other SLC10 carriers,
      and co-immunoprecipitates with NTCP without impairing its transport [PMID:22029531, PMID:31256060] - but those
      studies are not the source of these rows and still do not establish a binding-based molecular function for
      SOAT.'
