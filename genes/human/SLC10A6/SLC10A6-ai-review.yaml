  review:
    summary: PAINT places bile acid:sodium symporter activity at PANTHER:PTN000040761, the ancestor of the sodium-dependent
      SLC10 clade (human SLC10A1, SLC10A2, SLC10A4 and SLC10A6 all receive rows from this node), seeded by the rat
      descendants Ntcp (RGD:3681) and Asbt (RGD:3682). SLC10A6/SOAT inherits it by descent. The canonical bile acids
      are not SOAT substrates [PMID:17491011, PMID:34079822], but one bile salt, taurolithocholate, is transported
      sodium-dependently with Km 19.3 uM, comparable to NTCP and ASBT [PMID:34079822].
    action: KEEP_AS_NON_CORE
    reason: 'Challenging an IBA means arguing with the node placement, and that argument does not succeed here.
      SLC10A6 is inside the clade descending from PTN000040761, and the inherited activity has been narrowed rather
      than lost: cholate, chenodeoxycholate, taurocholate, taurochenodeoxycholate and taurodeoxycholate are not
      transported [PMID:17491011, PMID:34079822], but taurolithocholate - a genuine taurine-conjugated bile salt
      - is a sodium-coupled SOAT substrate, and the restriction is positional rather than categorical, since adding
      a 7'' and/or 12'' hydroxyl abolishes transport [PMID:34079822]. The authors of that systematic three-carrier
      comparison explicitly leave open whether taurolithocholate transport is ancestral to NTCP/ASBT/SOAT or acquired
      independently, so there is no basis for asserting functional loss at this node. REMOVE would therefore overstate
      what the evidence shows. What is wrong is only the implication that this is what SOAT is for: the carrier
      is a specific transporter of 3''- and 17''-monosulfated steroids [PMID:28951227, PMID:37373074], a chemistry
      this term cannot express (its definition is the bile acid/Na+ symport reaction and it sits under GO:0015355
      secondary active monocarboxylate transmembrane transporter activity, verified via OLS; steroid sulfate esters
      are neither bile acids nor monocarboxylates). The row is therefore retained as a real but peripheral activity,
      and the core activity is raised as a proposed new term, steroid sulfate:sodium symporter activity, since GO
      has no term for it.'
