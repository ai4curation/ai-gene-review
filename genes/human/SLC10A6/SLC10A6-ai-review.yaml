core_functions:
- description: Sodium-coupled import of mono-sulfated steroid hormones across the plasma membrane. SOAT co-transports
    an intact steroid sulfate with sodium ions, driven by the inward sodium gradient and without hydrolysing the
    sulfate ester, delivering circulating biologically inert steroid sulfates into target cells where steroid sulfatase
    can reactivate them. Substrate recognition requires a planar lipophilic steroid backbone and a single negatively
    charged sulfate at the 3' or 17' position; characterized substrates include dehydroepiandrosterone sulfate (Km
    28.7 uM), estrone-3-sulfate (12.0 uM) and pregnenolone sulfate (11.3 uM), and a second sulfate group abolishes
    transport.
  proposed_molecular_function: steroid sulfate:sodium symporter activity
  directly_involved_in:
  - id: GO:0043251
    label: sodium-dependent organic anion transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:17491011
    supporting_text: We established a stable SOAT-HEK293 cell line that showed sodium-dependent transport of dehydroepiandrosterone
      sulfate, estrone-3-sulfate, and pregnenolone sulfate with apparent K(m) values of 28.7, 12.0, and 11.3 microm,
      respectively.
  - reference_id: PMID:28951227
    supporting_text: SOAT substrates from the group of sulfated steroids are characterized by a planar and lipophilic
      steroid backbone in trans-trans-trans conformation of the rings and a negatively charged mono-sulfate group
      at positions 3' or 17' with flexibility for α- or β- orientation.
  - reference_id: PMID:37373074
    supporting_text: The sodium-dependent organic anion transporter (SOAT, gene symbol SLC10A6) specifically transports
      3'- and 17'-monosulfated steroid hormones, such as estrone sulfate and dehydroepiandrosterone sulfate, into
      specific target cells.
  - reference_id: PMID:23667501
    supporting_text: With this technique, the cellular inward-directed SOAT transport was verified for the established
      substrates dehydroepiandrosterone sulfate and estrone-3-sulfate.
proposed_new_terms:
- proposed_name: steroid sulfate:sodium symporter activity
  proposed_definition: 'Enables the transfer of a solute or solutes from one side of a membrane to the other according
    to the reaction: steroid sulfate(out) + Na(+)(out) = steroid sulfate(in) + Na(+)(in).'
  justification: 'GO has no molecular-function term for sodium-coupled transport of steroid sulfate esters, which
    is the defining activity of SLC10A6/SOAT and of its rodent orthologs. Checked against OLS: the only existing
    term that GOA assigns to this gene is GO:0008508 bile acid:sodium symporter activity, whose definition is the
    bile acid/Na+ symport reaction and which is classified under GO:0015125 bile acid transmembrane transporter
    activity and GO:0015355 secondary active monocarboxylate transmembrane transporter activity - steroid sulfates
    are neither bile acids nor monocarboxylates. The generic alternative GO:0008514 organic anion transmembrane
    transporter activity is obsolete and was replaced by the uninformative GO:0022857 transmembrane transporter
    activity, and text searches of GO for ''steroid sulfate'', ''estrone sulfate'' and organosulfate transport return
    only sulfotransferase and sulfatase activities. The existing children of GO:0015370 solute:sodium symporter
    activity cover amino acids, sugars, nucleosides, bile acids, monocarboxylates, taurine, ascorbate, inositol,
    choline and inorganic ions, with no term for sulfate esters of steroids. The activity is directly demonstrated,
    with sodium dependence and kinetics, for the human protein, so it is not a speculative request. Candidate specific
    children, if wanted, would be estrone 3-sulfate:sodium symporter activity and dehydroepiandrosterone 3-sulfate:sodium
    symporter activity; a matching biological-process term (steroid sulfate import across plasma membrane) would
    also be useful, although GO:0043251 sodium-dependent organic anion transport is an adequate process term today.'
  proposed_parent:
    id: GO:0015370
    label: solute:sodium symporter activity
  supported_by:
  - reference_id: PMID:17491011
    supporting_text: We established a stable SOAT-HEK293 cell line that showed sodium-dependent transport of dehydroepiandrosterone
      sulfate, estrone-3-sulfate, and pregnenolone sulfate with apparent K(m) values of 28.7, 12.0, and 11.3 microm,
      respectively.
  - reference_id: PMID:28951227
    supporting_text: The sodium-dependent organic anion transporter SOAT/Soat shows highly specific transport activity
      for sulfated steroids.
  - reference_id: PMID:28951227
    supporting_text: SOAT substrates from the group of sulfated steroids are characterized by a planar and lipophilic
      steroid backbone in trans-trans-trans conformation of the rings and a negatively charged mono-sulfate group
      at positions 3' or 17' with flexibility for α- or β- orientation.
  - reference_id: PMID:34079822
    supporting_text: In addition, sodium-dependent organic anion transporter SOAT specifically transports sulfated
      steroid hormones, but not bile acids.
  - reference_id: PMID:37373074
    supporting_text: The sodium-dependent organic anion transporter (SOAT, gene symbol SLC10A6) specifically transports
      3'- and 17'-monosulfated steroid hormones, such as estrone sulfate and dehydroepiandrosterone sulfate, into
      specific target cells.
suggested_questions:
- question: Should GO create a molecular-function term for sodium-coupled steroid sulfate symport (and a matching
    import process term)? At present the only molecular function GOA gives SLC10A6 is GO:0008508 bile acid:sodium
    symporter activity, which cannot express transport of a steroid sulfate ester, while the generic GO:0008514
    was obsoleted to GO:0022857.
  experts:
  - Joachim Geyer
  - Gary Grosser
- question: Is bile acid:sodium symporter activity (GO:0008508) ancestral at PANTHER:PTN000040761, or did taurolithocholate
    transport arise independently in NTCP, ASBT and SOAT? Grosser et al. state that this cannot currently be decided,
    which bears directly on whether the IBA row should be retained for SLC10A6 at all.
  experts:
  - Gary Grosser
  - Joachim Geyer
- question: Would GO prefer to record SOAT's substrate scope through has_input extensions on the transporter activity
    annotation (CHEBI:17474 estrone 3-sulfate, CHEBI:57905 dehydroepiandrosterone 3-sulfate, CHEBI:133000 pregnenolone
    sulfate) rather than relying on the broad process term GO:0043251?
  experts: []
- question: SOAT homo-oligomerizes and heterodimerizes with other SLC10 carriers, co-immunoprecipitating with NTCP
    without impairing its transport [PMID:22029531, PMID:31256060]. Is there enough evidence for a protein-containing
    complex annotation, or is the physiological relevance of SLC10 heterodimers still too uncertain?
  experts:
  - Joachim Geyer
- question: Where does the elevated serum cholesterol sulfate of Slc10a6-/- mice come from, and is cholesterol sulfate
    itself a SOAT substrate? If so, the substrate definition would need to extend beyond steroid hormone sulfates.
  experts:
  - Joachim Geyer
suggested_experiments:
- description: Reconstitute purified human SOAT into proteoliposomes and measure transport of a defined panel (DHEAS,
    estrone-3-sulfate, pregnenolone sulfate, taurolithocholate, taurolithocholate-3-sulfate, taurocholate, cholesterol
    sulfate) with sodium-stoichiometry determination for each substrate class. This would establish in a cell-free
    system both the 2 Na+:1 steroid sulfate stoichiometry inferred from UniProt/Rhea and whether bile salt and steroid
    sulfate transport use the same translocation cycle.
- description: 'Determine cryo-EM structures of human SOAT with DHEAS and with taurolithocholate bound, and test
    the two competing explanations offered for the shared taurolithocholate substrate: a single site that accommodates
    the bile salt in antiparallel orientation to DHEAS, versus a separate taurolithocholate site conserved across
    NTCP, ASBT and SOAT. Structure-guided mutants that abolish steroid sulfate transport while retaining taurolithocholate
    transport (and the converse) would settle whether the two activities should be annotated separately.'
- description: Reconstruct the SLC10 family phylogeny with ancestral sequence reconstruction and resurrect the PTN000040761
    ancestral carrier, then assay it for taurocholate, taurolithocholate and DHEAS transport. This directly tests
    the PAINT node placement of bile acid:sodium symporter activity and would determine whether SOAT's steroid sulfate
    preference is a derived narrowing or an independent gain.
- description: Phenotype Slc10a6-/- mice in the tissues with highest Soat expression outside the testis (skin, lung,
    adipose, pancreas, placenta) with targeted steroid-sulfate and cholesterol-sulfate flux measurements, and cross
    them to Sts or Slco6a1 mutants to test the redundancy that must underlie their normal spermatogenesis.
- description: Quantify the contribution of SOAT to estrone-3-sulfate uptake in primary hormone-dependent breast
    tumour cells using the published SOAT-selective inhibitors alongside OATP and OAT inhibitors, to establish whether
    SOAT-mediated uptake is rate-limiting for intracrine estrogen formation in a native setting rather than in transfected
    cell lines.
