- id: PMID:28951227
  title: Transport of steroid 3-sulfates and steroid 17-sulfates by the sodium-dependent organic anion transporter
    SOAT (SLC10A6).
  findings:
  - statement: SOAT shows highly specific transport activity for sulfated steroids.
    supporting_text: The sodium-dependent organic anion transporter SOAT/Soat shows highly specific transport activity
      for sulfated steroids.
  - statement: SOAT substrate recognition requires a planar lipophilic steroid backbone and a single negatively
      charged sulfate group at position 3' or 17'; a second sulfate abolishes transport.
    supporting_text: SOAT substrates from the group of sulfated steroids are characterized by a planar and lipophilic
      steroid backbone in trans-trans-trans conformation of the rings and a negatively charged mono-sulfate group
      at positions 3' or 17' with flexibility for α- or β- orientation.
