- id: Reactome:R-HSA-433089
  title: SOAT can transport taurolithocholate-3-sulphate
  findings:
  - statement: Reactome's own summary of this reaction states that SOAT, unlike other SLC10A proteins, has no affinity
      for bile acids and transports sulfo-conjugated bile acids such as taurolithocholate 3-sulphate.
    supporting_text: Unlike the other SLC10A gene products, SOAT shows no affinity for binding bile acids. However,
      SOAT is able to transport sulpho-conjugated bile acids such as taurolithocholate 3-sulphate (Geyer J et al,
      2007).
  - statement: Reactome notes that SOAT also transports structurally similar sulfated steroids and may deliver these
      prohormones to testis, pancreas and placenta.
    supporting_text: It can also transport the structurally similar sulphated steroids (not shown here), thus SOAT
      may play a role in delivery of these prohormones to testis, pancreas and placenta.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached Reactome reaction, grounded in PMID:17491011. The reaction itself (taurolithocholate-3-sulphate
      uptake) is correct, but its own summary states SOAT has no affinity for bile acids, which argues against treating
      the derived GO:0008508 annotation as this gene's core function.
