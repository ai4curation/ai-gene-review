references:
- id: PMID:17491011
  title: Cloning and functional characterization of human sodium-dependent organic anion transporter (SLC10A6).
  findings:
  - statement: Human SOAT expressed in HEK293 cells mediates sodium-dependent uptake of DHEA sulfate, estrone-3-sulfate
      and pregnenolone sulfate with low-micromolar affinity.
    supporting_text: We established a stable SOAT-HEK293 cell line that showed sodium-dependent transport of dehydroepiandrosterone
      sulfate, estrone-3-sulfate, and pregnenolone sulfate with apparent K(m) values of 28.7, 12.0, and 11.3 microm,
      respectively.
  - statement: Unconjugated and taurine-conjugated trihydroxy/dihydroxy bile acids are not SOAT substrates, whereas
      the sulfoconjugated bile acid taurolithocholic acid-3-sulfate is transported sodium-dependently.
    supporting_text: Although bile acids, such as taurocholic acid, cholic acid, and chenodeoxycholic acid, were
      not substrates of SOAT, the sulfoconjugated bile acid taurolithocholic acid-3-sulfate was transported by SOAT-HEK293
      cells in a sodium-dependent manner
  - statement: SOAT is most highly expressed in testis, then placenta and pancreas.
    supporting_text: SOAT mRNA is most highly expressed in testis. Relatively high SOAT expression was also detected
      in placenta and pancreas.
  - statement: SOAT is a close paralog of the bile acid carriers ASBT and NTCP.
    supporting_text: SOAT shows 42% sequence identity to the ileal apical sodium-dependent bile acid transporter
      ASBT and 33% sequence identity to the hepatic Na(+)/taurocholate-cotransporting polypeptide NTCP.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary cloning and functional characterization of human SOAT; PubMed-verified. Abstract-only
      in the cache, but the abstract itself states both the steroid-sulfate kinetics and the negative bile-acid
      result that the review turns on.
- id: PMID:23667501
  title: Membrane transporters for sulfated steroids in the human testis--cellular localization, expression pattern
    and functional analysis.
  findings:
  - statement: LC-MS/MS profiling of cell lysates confirms inward-directed SOAT transport of DHEAS and estrone-3-sulfate
      and identifies beta-estradiol-3-sulfate and androstenediol-3-sulfate as new substrates.
    supporting_text: With this technique, the cellular inward-directed SOAT transport was verified for the established
      substrates dehydroepiandrosterone sulfate and estrone-3-sulfate.
  - statement: beta-Estradiol-3-sulfate and androstenediol-3-sulfate are SOAT substrates.
    supporting_text: Additionally, β-estradiol-3-sulfate and androstenediol-3-sulfate were identified as novel SOAT
      substrates.
  - statement: SOAT mRNA is reduced in testis biopsies showing hypospermatogenesis.
    supporting_text: Only SOAT was significantly lower expressed in biopsies showing hypospermatogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Source of the UniProt subcellular-location evidence and of the germ-cell localization;
      extends the substrate list by mass spectrometry rather than radiotracer uptake.
- id: PMID:24717977
  title: Transport of the placental estriol precursor 16α-hydroxy-dehydroepiandrosterone sulfate (16α-OH-DHEAS)
    by stably transfected OAT4-, SOAT-, and NTCP-HEK293 cells.
  findings:
  - statement: SOAT transports the estriol precursor 16alpha-OH-DHEAS strictly sodium-dependently, with low affinity
      (Km 319 uM) but high capacity.
    supporting_text: stably transfected SOAT- and NTCP-HEK293 cells showed uptake only under sodium conditions with
      Km of 319.0 ± 59.5 μM and Vmax of 1465.8 ± 118.8 pmol/mg protein/min for SOAT
  - statement: SOAT protein is located in the apical membrane of human placental syncytiotrophoblasts and in vessel
