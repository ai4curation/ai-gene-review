- id: PMID:34079822
  title: Substrate Specificities and Inhibition Pattern of the Solute Carrier Family 10 Members NTCP, ASBT and SOAT.
  findings:
  - statement: SOAT specifically transports sulfated steroid hormones and not bile acids, despite being the closest
      paralog of ASBT.
    supporting_text: In addition, sodium-dependent organic anion transporter SOAT specifically transports sulfated
      steroid hormones, but not bile acids.
  - statement: Taurolithocholic acid is nevertheless a sodium-dependent SOAT substrate and is the only substrate
      shared by NTCP, ASBT and SOAT.
    supporting_text: Surprisingly, SOAT showed significant sodium-dependent uptake of TLC and, therefore, TLC is
      the only common substrate of all three carriers NTCP, ASBT and SOAT, identified so far.
  - statement: Additional 7'- and/or 12'-hydroxylation blocks SOAT transport, which is why TCA, TCDCA and TDCA are
      not substrates.
    supporting_text: This is, however, not possible when TLC is additionally hydroxylated at the 7′ and/or 12’ positions,
      as it is the case for the BAs TCA, TCDCA, or TDCA, which all are not transported by SOAT.
  - statement: Whether taurolithocholate transport was present in the common NTCP/ASBT/SOAT ancestor or arose independently
      in the three carriers cannot currently be decided.
    supporting_text: However, the question if TLC was also a substrate of the common NTCP/ASBT/SOAT ancestor or
      if all three carriers later acquired the TLC transport function cannot be finally answered.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; the single most decision-relevant reference for this review. It both confirms
      that SOAT is not a bile acid transporter in the NTCP/ASBT sense and shows that one bile salt (taurolithocholate)
      is a genuine sodium-coupled substrate, which is why the family-level bile-acid terms are kept as non-core
