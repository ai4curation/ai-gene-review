  review:
    summary: 'Ensembl Compara transfers the sodium-dependent organic anion transport annotation from the rat ortholog
      Soat (UniProtKB:Q70EX6, SOAT_RAT, gene Slc10a6) to human SLC10A6. The human protein independently and directly
      performs this process: it mediates strictly sodium-dependent uptake of steroid sulfate anions - DHEAS, estrone-3-sulfate,
      pregnenolone sulfate and many others - across the plasma membrane [PMID:17491011, PMID:28951227].'
    action: ACCEPT
    reason: This is the best-fitting existing GO process term for SLC10A6 and the one that matches the gene's own
      name. Steroid 3'- and 17'-mono-sulfates are organic anions, their transport by SOAT is obligatorily sodium-dependent
      in every assay reported, and the activity is demonstrated directly for the human protein, not merely inferred
      [PMID:17491011, PMID:28951227, PMID:37373074]. The orthology is one-to-one (rat Slc10a6/Soat to human SLC10A6),
      so the propagation is also sound on its own terms. Verified against OLS that GO:0043251 is current (its only
      parent is GO:0055085 transmembrane transport, so it is neither ancestor nor descendant of the bile-acid process
      terms also annotated), while the candidate alternatives GO:0015711 organic anion transport and GO:0008514
      organic anion transmembrane transporter activity are obsolete. Retained as the core process.
