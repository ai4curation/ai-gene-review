id: Q3KNW5
gene_symbol: SLC10A6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC10A6 encodes SOAT (sodium-dependent organic anion transporter), a 377-residue, N-glycosylated, multi-pass
  plasma membrane carrier belonging to the bile acid:sodium symporter (BASS/SLC10, TC 2.A.28) family, in which its
  closest relatives are the bile salt carriers ASBT (SLC10A2, 48% identity) and NTCP (SLC10A1) [PMID:17491011, PMID:34079822].
  SOAT imports sulfoconjugated steroid hormones from the extracellular space into the cytosol, co-transporting the
  intact steroid sulfate with sodium ions down the inward sodium gradient and without hydrolysing the sulfate ester
  [PMID:17491011, PMID:23667501]. Characterized substrates are mono-sulfated steroids bearing the sulfate at the
  3' or 17' position - dehydroepiandrosterone sulfate, estrone-3-sulfate and pregnenolone sulfate with low-micromolar
  Km values, plus 17beta-estradiol-3-sulfate, androstenediol-3-sulfate, androsterone and epiandrosterone sulfate,
  testosterone, epitestosterone and dihydrotestosterone 17-sulfates, 17alpha-hydroxypregnenolone sulfate and the
  placental estriol precursor 16alpha-hydroxy-DHEA sulfate; a second sulfate group abolishes recognition [PMID:17491011,
  PMID:23667501, PMID:28951227, PMID:24717977]. Despite the family name, the canonical bile acids (cholate, chenodeoxycholate,
  taurocholate, taurochenodeoxycholate, taurodeoxycholate) are not transported; the exceptions are taurolithocholate
  and its 3-sulfate, which lack 7'/12' hydroxylation and are taken up sodium-dependently [PMID:17491011, PMID:34079822].
  Expression is highest in testis, where the protein is present in germ cells from zygotene spermatocytes to round
  spermatids, followed by placenta - where it occupies the apical membrane of syncytiotrophoblasts and the vessel
  endothelium - and pancreas, with lower levels in many hormone-responsive peripheral tissues [PMID:17491011, PMID:23667501,
  PMID:24717977]. Physiologically, SOAT is thought to deliver circulating, biologically inert steroid sulfates into
  specific target cells, where steroid sulfatase can reactivate them to free estrogens and androgens for intracrine
  signalling [PMID:23667501, PMID:37373074]. Loss of the mouse ortholog is nevertheless compatible with normal fertility
  and spermatogenesis and produces a peripheral lipid phenotype (raised serum cholesterol sulfate), indicating redundancy
  in the testis [PMID:28743544]. SOAT homo-oligomerizes and forms heterodimers with other SLC10 carriers including
  NTCP, without impairing NTCP transport [PMID:22029531, PMID:31256060]. Because SOAT-mediated estrone-3-sulfate
  uptake drives proliferation of hormone-dependent breast cancer cells, the transporter is of interest as an endocrine
  drug target [PMID:30186172, PMID:37373074].
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:A0A0C4DFN3
  review:
    summary: High-throughput binary interaction screen (HuRI) reports an interaction between SLC10A6 and this partner
      [PMID:32296183]. The annotation records only the generic term protein binding and says nothing about what
      SLC10A6 does.
    action: REMOVE
    reason: 'GO:0005515 protein binding is uninformative: it records that a binding event was detected without identifying
      any molecular function of SLC10A6. The source is a systematic proteome-scale yeast two-hybrid map [PMID:32296183]
      that assigns no function to either partner, and nothing in it supports a more specific molecular-function
      term for SLC10A6, so MODIFY is not available. Removing the annotation does not assert that the reported interaction
      is false; it removes a row that adds no functional knowledge beyond SLC10A6''s established activity as a sodium-coupled
      importer of sulfated steroid hormones [PMID:17491011, PMID:34079822]. Note that informative, hypothesis-driven
      interaction data do exist for this protein - SOAT homo-oligomerizes and heterodimerizes with other SLC10 carriers,
      and co-immunoprecipitates with NTCP without impairing its transport [PMID:22029531, PMID:31256060] - but those
      studies are not the source of these rows and still do not establish a binding-based molecular function for
      SOAT.'
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: Here we present a human 'all-by-all'
    - reference_id: PMID:17491011
      supporting_text: We established a stable SOAT-HEK293 cell line that showed sodium-dependent transport of dehydroepiandrosterone
        sulfate, estrone-3-sulfate, and pregnenolone sulfate with apparent K(m) values of 28.7, 12.0, and 11.3 microm,
        respectively.
    - reference_id: PMID:34079822
      supporting_text: In addition, sodium-dependent organic anion transporter SOAT specifically transports sulfated
        steroid hormones, but not bile acids.
