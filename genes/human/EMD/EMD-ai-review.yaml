core_functions:
- description: 'Inner-nuclear-membrane actin capping and envelope organization: emerin binds F-actin, caps pointed
    filament ends, and supports a cortical actin network and NEMP1-dependent stiffness at the nuclear inner membrane.'
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  directly_involved_in:
