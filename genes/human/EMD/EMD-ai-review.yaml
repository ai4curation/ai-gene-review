id: P50402
gene_symbol: EMD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'EMD encodes emerin, a LEM-domain tail-anchored membrane protein enriched at the nuclear inner membrane
  with its actin-, beta-catenin- and lamin-binding N terminus facing the nucleoplasm. Emerin binds and caps the
  pointed ends of actin filaments and helps organize a nuclear cortical actin network at the inner nuclear membrane;
  together with NEMP1 it also contributes to nuclear-envelope stiffness. A smaller outer-nuclear-membrane and peripheral-ER
  pool links the centrosome to the nuclear envelope through tubulin, and emerin has secondary signaling roles including
  direct beta-catenin binding that limits canonical Wnt activity. Loss of emerin causes X-linked Emery-Dreifuss
  muscular dystrophy.'
existing_annotations:
- term:
    id: GO:0003779
    label: actin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000389408
  - UniProtKB:P50402
  review:
    summary: Actin binding through pointed-end F-actin capping.
    action: MODIFY
    reason: The cited pointed-end capping study directly supports actin filament binding rather than only
      the broad actin-binding parent.
    proposed_replacement_terms:
    - id: GO:0051015
      label: actin filament binding
    supported_by:
    - reference_id: PMID:15328537
      supporting_text: emerin binds and stabilizes the pointed end of actin filaments
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000389408
        source_label: emerin PAINT node
        source_status: SUPPORTS_TRANSFER
        comment: The PAINT node supports the actin-binding activity, but the evidence supports the more
          specific child term actin filament binding.
