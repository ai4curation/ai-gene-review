suggested_questions:
- question: Which in vivo emerin actin-binding mutants specifically uncouple pointed-end F-actin capping from
    lamin, BAF and beta-catenin binding?
- question: Is the outer-nuclear-membrane and peripheral-ER pool of emerin a regulated pool or a small
    steady-state escape fraction of the tail-anchored protein biogenesis pathway?
suggested_experiments:
- experiment_type: inner-nuclear-membrane actin rescue
  description: Rescue EMD-null human myotubes or fibroblasts with F-actin-binding and non-binding emerin
    mutants and quantify nuclear cortical actin, nuclear stiffness, and envelope rupture under cyclic strain.
- experiment_type: NEMP1 epistasis under force
  description: Use EMD and NEMP1 single and double knockouts with atomic-force microscopy to test whether the
    NEMP1-emerin complex accounts for all emerin-dependent nuclear-envelope stiffness in mechanically stressed
    cells.
