- id: PMID:38693257
  title: Structural and molecular basis of choline uptake into the brain by FLVCR2.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Identifier and selected original Results/Methods were checked after genuine fetch recovered
      the full normal text. Adult endothelial-knockout mouse brain uptake, human brain immunostaining
      and human iHBEC siRNA uptake are distinct experiments. HEK293 overexpression, purified binding,
      liposome transport and structures use mouse FLVCR2. Inward proton gradients enhance mouse proteoliposome
      uptake, while sodium gradients do not; these measurements are not a human coupling or natural-product
      assignment. No figure-pixel, supplement-table or source-data reanalysis is claimed. The authors
      leave facilitative uniport versus proton coupling unresolved and report robust transport without
      a proton gradient.
