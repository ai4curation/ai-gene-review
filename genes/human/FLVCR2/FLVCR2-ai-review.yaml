id: Q9UPI3
gene_symbol: FLVCR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FLVCR2 is a major facilitator superfamily membrane protein whose full-length product transports
  choline and ethanolamine. It supports precursor movement across the plasma membrane, and mouse brain-endothelial
  studies demonstrate a role in choline exchange at the blood–brain barrier. Choline movement is facilitative
  and depends on substrate gradients and metabolic consumption. Disease-associated variants can impair
  transport. A shorter alternatively spliced product lacks a substantial N-terminal region; its transport
  properties remain unresolved.
