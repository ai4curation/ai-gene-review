suggested_questions:
- question: What determines net FLVCR2-mediated choline flux at the blood–brain barrier, and does clearance
    deliver choline to plasma or retain it in endothelium?
- question: Do purified full-length human FLVCR2 assays reproduce the historical heme-uptake observations
    and the differential paralog-export result under physiological substrate conditions?
- question: Which membrane bilayer contains the contextual organellar FLVCR2 pool, and what localization
    and transport functions are demonstrated for the321-residue natural product?
- question: Which exact FLVCR2 assays underlie PMID:14729055 and PMID:40972734, beyond the accessible
    abstract-level material?
suggested_experiments:
- description: Compare sequence-verified full-length and short human FLVCR2 products for substrate flux
    and localization under matched expression, with controls for metabolic trapping and membrane targeting.
  experiment_type: product-resolved transport and localization
  hypothesis: The short natural product may differ from the characterized full-length transporter and
    from engineered N-terminal deletions.
- description: Measure choline and heme flux separately in purified full-length human FLVCR2 reconstituted
    with defined membrane orientation, substrate gradients and matched FLVCR1 controls.
  experiment_type: direct substrate-direction discrimination
  hypothesis: Cellular substrate accumulation and paralog-specific heme-washout observations may have
    distinct mechanistic determinants.
