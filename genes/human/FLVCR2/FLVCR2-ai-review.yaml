- term:
    id: GO:0097037
    label: heme export
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000858905
  - UniProtKB:Q9Y5Y0
  review:
    summary: Target-specific paralog comparison contradicts propagated heme export under tested conditions.
    action: REMOVE
    reason: 'Although the heme-export IBD at PTN000858905 is correctly on the human FLVCR2 path, its placement
      across this paralog split is challenged by target-specific functional evidence. PMID:15369674 compares
      human FLVCR with the chromosome-14q paralog in rat NRK cells: radiolabeled heme decreases during
      washout for FLVCR1 but not the 14q construct. PMID:20823265 explicitly identifies that construct
      as human FLVCR2 and independently demonstrates import-associated uptake. Thus the ancestor-propagated
      export annotation is not supported for this paralog and contradicts the comparative export result
      under the tested conditions. This judgment is about functional divergence at the propagated node,
      not donor count or generic sequence similarity. It does not claim that import logically excludes
      export, that all possible heme-export conditions were tested, or that choline bidirectionality establishes
      heme bidirectionality.'
    supported_by:
    - reference_id: PMID:15369674
    - reference_id: PMID:20823265
    - reference_id: file:human/FLVCR2/FLVCR2-source-evidence.md
    - reference_id: file:human/FLVCR2/FLVCR2-source-guide.md
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN000858905
        source_label: PTN000858905
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Original IBD origin lies on the exact526-residue human target path. The human14q comparator
          in PMID:15369674, identified as FLVCR2 by PMID:20823265, challenges heme-export inheritance
          under the tested conditions; the source FLVCR1 export evidence is not declared false.
      failure_modes:
