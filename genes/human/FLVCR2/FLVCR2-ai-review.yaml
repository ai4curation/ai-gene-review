core_functions:
- description: The characterized full-length FLVCR2 protein facilitates choline movement across the plasma
    membrane. Uptake and release depend on substrate gradients and metabolic consumption; mouse endothelial
    studies support a physiological role in choline exchange at the blood–brain barrier.
  molecular_function:
    id: GO:0015220
    label: choline transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015871
    label: choline transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:38302740
  - reference_id: PMID:38778100
  - reference_id: file:human/FLVCR2/FLVCR2-source-evidence.md
- description: The characterized full-length human FLVCR2 protein transports ethanolamine across the plasma
    membrane in cellular uptake assays. Measured accumulation depends on assay and metabolic conditions;
    a separate kinase performs phosphoethanolamine synthesis.
  molecular_function:
    id: GO:0034228
    label: ethanolamine transmembrane transporter activity
  directly_involved_in:
  - id: GO:0034229
    label: ethanolamine transport
  locations:
