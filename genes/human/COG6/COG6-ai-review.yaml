id: Q9Y2V7
gene_symbol: COG6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COG6 is a peripheral Golgi-associated subunit of the conserved oligomeric Golgi complex.
  It contributes to the lobe-B assembly and recognizes Golgi SNARE proteins through an N-terminal interaction
  region. These contacts help maintain SNARE abundance and organization, support retrograde membrane traffic
  and preserve Golgi architecture and glycosylation. Human COG6 deficiency can disrupt COG-complex organization
  and cause multisystem congenital glycosylation disorders or a hypohidrosis–intellectual disability syndrome.
  Clinical and biochemical severity varies among alleles. Three annotated protein products differ substantially
  in length; the shortest ends before the mapped SNARE-binding region.
