    label: retrograde transport, vesicle recycling within Golgi
  evidence_type: IMP
  original_reference_id: PMID:27066481
  qualifier: involved_in
  review:
    summary: COG6 supports the COG-dependent recycling machinery.
    action: ACCEPT
    reason: The human knockout source directly tests COG6-dependent complex stability and Golgi architecture.
      Its toxin assays use representative COG knockouts, so an uninspected SubAB panel is not assigned
      to COG6. Retain the curator's intra-Golgi recycling assertion in the integrated COG machinery context.
      Independent PMID:21807881 establishes endosome-to-TGN retrieval, while PMID:23057818 supports COG6
      recognition of Golgi SNAREs; these are complementary mechanisms, not an intra-Golgi cargo-flux measurement.
    supported_by:
    - reference_id: PMID:27066481
    - reference_id: PMID:23057818
