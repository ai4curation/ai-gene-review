suggested_questions:
- question: Which SNARE contacts occur simultaneously on one COG6 molecule, and which require different
    COG-complex conformations?
- question: Are the 615-residue and short 75-residue products translated in relevant human tissues, and
    how do they affect COG assembly and SNARE recognition?
- question: Which separation-of-function variants distinguish COG6-dependent SNARE stabilization from
    vesicle tethering and Golgi architecture?
suggested_experiments:
- description: Compare sequence-verified COG6 products and SNARE-binding-region variants at matched expression
    in deficient human cells, measuring COG assembly, STX6/GS27 association and defined retrograde cargo
    flux.
  hypothesis: SNARE recognition can be separated experimentally from other cooperative COG6 assembly contacts.
