    id: GO:0042147
    label: retrograde transport, endosome to Golgi
  evidence_type: IMP
  original_reference_id: PMID:21807881
  qualifier: involved_in
  review:
    summary: COG6 performs SNARE-recognition work supporting endosome-to-TGN retrieval.
    action: NEW
    reason: Human HeLa COG6 depletion delays STx-B and TGN38 delivery to the TGN. Combined with endogenous
      association, purified N-terminal COG6–STX6 binding and disruption of STX6-containing SNARE assemblies,
      this identifies COG6 as part of the transport machinery rather than the transported substrate. The
      mechanism is complex-mediated; depletion also affects other COG subunits, and no isolated fusion
      activity or equal activity of all isoforms is inferred. Exact-term comparator records for VPS53/VPS54
      show that analogous SNARE-recognizing tether components can carry this process; COG3/COG4 lack it
      in the checked snapshot. Typed is_a/part_of closure finds no ancestor/descendant overlap with the
      original or replacement annotations or core terms. The current GO-CAM index has no target entry.
    supported_by:
    - reference_id: PMID:21807881
      supporting_text: depletion of Cog6 markedly attenuates endosome-to-TGN trafficking of STx-B.
