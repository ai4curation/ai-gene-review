  - UniProtKB:Q9Y2V7
  review:
    summary: Conserved COG6 participation in retrograde Golgi traffic.
    action: ACCEPT
    reason: The inherited intra-Golgi recycling process is retained on the integrated COG6/COG trafficking
      evidence, including the target experimental premises, Golgi SNARE recognition and curated intra-Golgi
      complex events. PMID:21807881 directly tests endosome-to-TGN cargo retrieval; its BFA assay instead
      concerns Golgi-to-ER redistribution. Neither readout is relabeled as intra-Golgi flux. The historical
      PAINT node placement remains uninspected, distinct from the positive current target evidence.
    supported_by:
    - reference_id: PMID:23057818
    - reference_id: PMID:20605848
    - reference_id: Reactome:R-HSA-8847544
    propagation_review:
      root_cause: NO_FAILURE_CORE
      failure_modes: []
      source_entities:
      - source_id: PANTHER:PTN000487537
        source_status: UNRESOLVED
        comment: Current human Q9Y2V7 records include transport IMP premises; COG6–SNARE experiments support
          target participation. The historical PTN000487537 IBD placement/tree was not recovered.
- term:
    id: GO:0000301
    label: retrograde transport, vesicle recycling within Golgi
  evidence_type: IMP
  original_reference_id: PMID:20605848
  qualifier: involved_in
  review:
    summary: COG6 deficiency compromises retrograde trafficking.
    action: ACCEPT
    reason: The original patient study reports reduced COG6, altered COG-complex fractionation and rescue
      by wild-type COG6. Its BFA/GM130 assay measures Golgi-to-ER redistribution, not an isolated intra-Golgi
      COPI step. Retain the curator’s intra-Golgi assertion in the integrated COG6/SNARE context while
      keeping that actual assay boundary explicit.
    supported_by:
    - reference_id: PMID:20605848
      supporting_text: occurrence of COG complex fragments
    - reference_id: PMID:23057818
- term:
