core_functions:
- description: Recognizes Golgi SNAREs including STX5, STX6, GS27 and SNAP29 as a COG-complex component,
    helping organize membrane-fusion machinery for intra-Golgi recycling and endosome-to-TGN retrieval.
    COG6 also contributes cooperatively to complex assembly; activity of the short alternative product
    lacking the mapped interaction region remains unresolved.
  molecular_function:
    id: GO:0000149
    label: SNARE binding
