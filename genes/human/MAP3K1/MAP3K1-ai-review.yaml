core_functions:
- description: MAP kinase kinase kinase that directly phosphorylates and activates MAP2Ks, preferentially
    MKK4/SEK1 (and more weakly MKK7), thereby initiating the JNK/stress-activated MAPK cascade; also activates
    MKK3/6 (p38) and, contextually, MKK1/2 (ERK).
