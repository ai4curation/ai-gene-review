id: Q13233
gene_symbol: MAP3K1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MAP3K1 encodes MEKK1, a large (1512 aa, ~196 kDa) cytoplasmic serine/threonine mitogen-activated
  protein kinase kinase kinase of the STE family. Its C-terminal kinase domain directly phosphorylates
  and activates MAP kinase kinases, with MKK4 (MAP2K4/SEK1/JNKK1) as the preferred substrate and a direct,
  stable MEKK1:MKK4 complex, and also MKK7, MKK3/MKK6 and, in some contexts, MKK1/2; MEKK1 therefore mainly
  drives the JNK (stress-activated protein kinase) cascade and, more variably, p38, ERK and IKK/NF-kB
  outputs. MEKK1 is activated by oligomerisation and activation-loop autophosphorylation downstream of
  TNF, EGF, TGF-beta, TRAF2/TRAF6 and cytoskeletal or osmotic stress. The large N-terminal regulatory
  region contains a SWIM zinc finger, a PHD/RING-type zinc finger with E3 ubiquitin ligase activity (ubiquitinating
  ERK1/2, c-Jun, TAB1 and MEKK1 itself), a tubulin-binding TOG domain, and a caspase-3 cleavage site at
  Asp878 whose cleavage releases a pro-apoptotic kinase fragment. Germline variants cause 46,XY disorders
  of sex development, and truncating somatic mutations are frequent in luminal breast cancer.
