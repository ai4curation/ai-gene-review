suggested_questions:
- question: Which MEKK1 functions depend on its PHD/RING E3 activity in human cells (c-Jun, ERK1/2 and
    TAB1 ubiquitination), and are these substrates targeted by the same E2 (UbcH5 versus UBE2N) and chain
    type?
- question: Does tubulin binding by the TOG domain regulate MEKK1 kinase activation in response to microtubule-targeting
    drugs, and do tumor-derived TOG-interface mutations alter JNK output?
- question: Is IKK phosphorylation by MEKK1 (Reactome R-HSA-933530) physiologically relevant in human
    cells, given that MAP3K7/TAK1 is the dominant IKK kinase in most receptor pathways?
- question: What is the evidential basis of the IEP annotation to cellular response to mechanical stimulus
    citing PMID:19593445, which does not appear to discuss MAP3K1?
suggested_experiments:
- description: Knock-in of E3-dead (C433A/C478A) versus kinase-dead (D1369A) MAP3K1 into human MAP3K1-null
    epithelial cells, followed by phosphoproteomics and ubiquitinomics after osmotic stress and TNF, to
    separate kinase-dependent and E3-dependent outputs.
- description: In vitro reconstitution with purified full-length MEKK1, MKK4, MKK7 and JNK, with and without
    tubulin, to test whether curved-tubulin binding by the TOG domain modulates MEKK1 autophosphorylation
    and MAP2K phosphorylation.
