- term:
    id: GO:0015631
    label: tubulin binding
  evidence_type: IDA
  original_reference_id: PMID:32817551
  review:
    summary: The MEKK1 TOG domain (residues ~542-888, crystal structure solved) binds soluble alpha/beta-tubulin
      heterodimers 1:1 with KD ~0.63 uM by ITC, preferring curved (non-polymerised) tubulin over paclitaxel-stabilised
      microtubules.
    action: NEW
    reason: Direct, quantitative binding of purified human MEKK1 TOG domain to tubulin, with structural
      and mutational support; not represented in GOA. This is a binding MF of MEKK1 itself (not a process
      claim), and plausibly links MEKK1 activation to microtubule perturbation.
    supported_by:
    - reference_id: PMID:32817551
      supporting_text: Here we show that MEKK1 contains a previously unidentified tumor overexpressed
        gene (TOG) domain.
    - reference_id: PMID:32817551
      supporting_text: clearly shows 1:1 stoichiometric binding with a calculated dissociation constant
