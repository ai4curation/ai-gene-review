      and the same reference supports the identical IEP term on several unrelated JNK-pathway genes (FAS,
      GADD45A, MAP2K4, MAP3K2, MAPK8, TNFRSF1A), suggesting a batch annotation whose basis we cannot see
      (possibly supplementary data or a mis-cited reference). MEKK1 is plausibly activated by cytoskeletal
      and shape-changing stresses, but IEP in any case records a response, not participation. Unable to
      verify, hence UNDECIDED.
    supported_by:
    - reference_id: PMID:19593445
      supporting_text: Expression of the Bcl-2 protein BAD promotes prostate cancer growth.
