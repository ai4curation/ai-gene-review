- id: PMID:41511346
  title: Dissecting the Biological Functions of Various Isoforms of Ferredoxin Reductase for Cell Survival
    and DNA Damage Response.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PMID/title/DOI verified against actual PubMed/PMC metadata. Full original main text was
      read for Methods 2.4, Results 3.1 and relevant Discussion, with Figure 1 caption/pixels and actual supplemental
      Figure S1 alignment pixels. C-terminal Flag-tagged human paper isoforms 1/4 colocalize with MitoTracker
      in MCF7, whereas paper isoform 7 is predominantly cytosolic. Paper Entrez numbering 4/7 is explicitly
      reversed from UniProt: 522 aa paper 4 matches P22570-7 by the inspected 27–34 alternative segment, and
      439 aa paper 7 matches P22570-4 by replacement 1–59 with MEDKDRE. This is sequence-feature/alignment
      correspondence, not plasmid resequencing. The paper’s Results call Figure 1F cells 293T while its caption
      says MCF7; Figure 1H/Methods localization consistently use MCF7. Cleavage explanations are inferred from
      mobility/sequence, with no mapped endogenous cleavage terminus for the altered products. Viability, damage-response
      and heterologous mouse 4T1 rescue observations do not establish direct DNA-repair chemistry or a defined
      cytosolic substrate. The failed PMC supplemental URL returned HTML; the genuine EPMC supplementary ZIP
      and embedded PDF supplied the actual S1 images. No new GO row is proposed.'
