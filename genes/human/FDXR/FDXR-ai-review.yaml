id: P22570
gene_symbol: FDXR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FDXR encodes a FAD-containing ferredoxin reductase that transfers reducing equivalents from NADPH
  to ferredoxins. Its mitochondrial electron-transfer activity supports steroid biosynthesis through mitochondrial
  cytochrome P450 enzymes and ubiquinone biosynthesis through ferredoxin-dependent reduction of COQ6. Human
  FDXR is detected in mitochondria, while an N-terminally shortened splice product shows predominantly cytosolic
  localization in tagged-cell studies. Biallelic FDXR variants cause mitochondrial disease that can include
  optic atrophy and neurological impairment.
