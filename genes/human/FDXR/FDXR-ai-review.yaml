  review:
    summary: Inner-membrane association is retained as a curated cross-species inference.
    action: ACCEPT
    reason: The actual human UniProt inner-membrane annotation cites yeast P48360 (ARH1/YDR376W, Saccharomyces
      cerevisiae), and the imported ISS names the same donor. In the recovered original PMID:9727014 Results
      and Figure 7 caption, endogenous yeast Arh1 antigen co-fractionates almost exclusively with the inner-membrane
      fraction, with ATP/ADP carrier and porin as inner/outer-membrane controls. Antiserum specificity was
      checked against recombinant protein and control extracts. This is positive donor evidence, distinct from
      the heterologous reductase assays. The bovine P08165 location also points to P48360 and is not independent
      mammalian localization. The conserved mitochondrial ferredoxin-reductase role and human mitochondrial
      observations support retaining the curator’s inference; a direct human submitochondrial fractionation
      or membrane topology was not established by this donor experiment. It does not assert a transmembrane
      helix, exclusive membrane residence, or the same localization for the N-terminally altered cytosolic
      splice product. The seven source products and imported annotation fields remain unchanged.
