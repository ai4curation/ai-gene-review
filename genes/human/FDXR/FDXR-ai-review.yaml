  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID/DOI/PMC identity verified against the actual original header and genuine repository-fetched
      normal (10.1172/jci.insight.179071; PMC11383170). Read original Introduction electron-supply context,
      Results for three patient-derived adrenal-like cell lines and male FdxrR389W mice, Figures 1–4 captions,
      relevant steroid-profiling/cell-context Methods, and mechanistic Discussion. The patient-derived lines
      show reduced steroid output relative to one sex-matched healthy control; cortisol was below accurate
      quantification and cortisone was used as a proxy. Slower growth was addressed by GAPDH-transcript normalization
      as a cell-number proxy. Male mutant mice show lower corticosterone with largely preserved adrenal organization.
      These are positive functional consequences of FDXR variants, not purified reconstitution of individual
      CYP inhibition. The proposed contribution of disturbed redox balance remains a mechanistic interpretation.
      Human, reprogrammed-cell and male-mouse contexts remain distinct; no natural isoform-specific activity,
      treatment recommendation or new GO process is asserted.
