- index: 8
  original_source_object:
    term:
      id: GO:0005739
      label: mitochondrion
    evidence_type: IDA
    original_reference_id: GO_REF:0000052
    qualifier: located_in
  review:
    summary: HPA supports mitochondrial FDXR localization.
    action: ACCEPT
    reason: Actual HPA ICC/IF records report supported U2OS mitochondria with CAB008597 and enhanced A-549, Hep-G2
      and U2OS mitochondria with HPA044393 and HPA053673. HPA044393 also supports the iPSC mitochondrial call; HPA053673
      sperm images are reported as no positivity, a distinct context. The two HPA antigens match canonical residues
      1–134 and 372–464. Three selected original somatic-cell composite images were viewed and show a mitochondrial-type
      reticular/punctate signal. They do not independently resolve matrix versus inner membrane, prove exclusive
      localization, or distinguish every splice product; the composite channels are target, nucleus and microtubules,
      not a dedicated mitochondrial co-stain. The actual assay supports the informative root organelle term and
      is not refined to an unresolved submitochondrial compartment.
