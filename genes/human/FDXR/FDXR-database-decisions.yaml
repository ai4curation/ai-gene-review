    - UniProtKB:P22570
  review:
    summary: FDXR catalyzes electron transfer between NADP(H) and ferredoxin.
    action: ACCEPT
    reason: The GO definition specifies the reversible ferredoxin/NADP redox reaction. Human target enzyme evidence
      is independently represented by PMID:2845396, and PMID:38425362 provides reconstitution with reconstructed
      tetrapod-ancestral FDXR/FDX2 rather than extant human proteins. The actual target UniProt catalytic entries
      and Reactome FDXR catalyst agree. Retain the phylogenetic assertion with its unreplayed placement limitation.
      The imported PTN is preserved, but the literal IBD row, target ancestry and MSA were not independently recovered.
      The global PAINT download was rejected before its body because its declared 401,856,535 bytes exceeded the
      100 MiB cap. The live release-19 gene record places P22570 in PTHR11938:SF91, whereas current InterPro/UniProt
      place it in PTHR48467; bounded requests for the release-19 family tree and MSA timed out. Those versions are
      not conflated. These access limits do not establish functional loss or invalidate the curator’s node judgment;
      donor count and expected target self-WITH are not criticisms.
    additional_reference_ids:
    - PMID:2845396
    - PMID:38425362
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000941138
        source_label: PTN000941138
        source_status: UNRESOLVED
        comment: GOA supplies this ancestral node; literal IBD, leaf path and alignment are unavailable. Independent
          target activity and curated chemistry support retention.
      - source_id: UniProtKB:P22570
        source_label: human FDXR
        source_status: SUPPORTS_TRANSFER
        comment: Target self-WITH is expected descendant experimental grounding, not circularity.
