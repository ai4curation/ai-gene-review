      imported PTN is preserved, but the literal IBD row, target ancestry and MSA were not independently recovered.
      The global PAINT download was rejected before its body because its declared 401,856,535 bytes exceeded the
      100 MiB cap. The live release-19 gene record places P22570 in PTHR11938:SF91, whereas current InterPro/UniProt
