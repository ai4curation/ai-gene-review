gene: FDXR
index_basis: Zero-based accepted intake source order; source_annotation excludes only review.
rows:
- index: 1
  source_annotation:
    term:
      id: GO:0004324
      label: ferredoxin-NADP+ reductase activity
    evidence_type: IDA
    original_reference_id: PMID:38425362
    qualifier: enables
  review:
    summary: FDXR supplies NADPH-derived electrons to ferredoxin; ancestral reconstitution directly resolves
      this catalytic role.
    action: ACCEPT
    reason: PMID:38425362 Results, C5 transformation requires a ferredoxin couple, and Extended Data Figure
      3 show FDXR reduction followed by FDX2-dependent reoxidation, NADPH turnover, and coupled electron transfer.
      The assayed FDXR and FDX2 are reconstructed tetrapod ancestors, not extant human proteins. This supports
      the conserved reductase function; the human assignment is also consistent with the fully read human cDNA
      study PMID:2845396 and the established enzyme identity. Retain the gene-level function without calling
      the ancestral preparation a human direct assay or assigning the measurements to all seven human splice
      products. The evidence-code concern is separately recorded as a PROBABLE source-level CHECK request,
      not an established ISS correction.
    supported_by:
    - reference_id: PMID:38425362
    - reference_id: PMID:2845396
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: UNIPROT
      slot: Evidence_Code
      requested_change: CHECK
      asserted_value: IDA
      confidence: PROBABLE
      explanation: PMID:38425362 Results, C5 transformation requires a ferredoxin couple, explicitly identifies
        the assayed FDXR and FDX2 as reconstructed tetrapod ancestors; Methods, Ancestral sequence reconstruction,
        and Extended Data Figure 3 describe that preparation and its direct activity measurements. The enclosing
        annotation assigns IDA to extant human P22570. Please assess how this ancestral-protein evidence should
        be represented for the human record. The conserved gene-level function remains supported, but these
        measurements are not an extant-human assay. A replacement evidence code or construct-to-human mapping
        has not been established here, so no ISS value is asserted and no source field is rewritten.
      supported_by:
      - reference_id: PMID:38425362
      report_status: NOT_REPORTED
- index: 3
  source_annotation:
    term:
      id: GO:0004324
      label: ferredoxin-NADP+ reductase activity
    evidence_type: TAS
    original_reference_id: PMID:2845396
    qualifier: enables
  review:
    summary: Human FDXR is the NADPH-dependent reductase of the mitochondrial ferredoxin electron-transfer
      system.
    action: ACCEPT
    reason: The complete original PMID:2845396 identifies human adrenal and testicular adrenodoxin reductase
      cDNAs and explicitly describes electron transfer from NADPH through FDXR and adrenodoxin to mitochondrial
      P450scc (page 7104). This supports the traceable author statement. Its original experiments characterize
      sequences, alternative splicing, gene location and RNA expression; they do not measure catalytic differences
      between the two splice forms. The conserved catalytic role is independently resolved in the ancestral
      FDXR/FDX2 reconstitution in PMID:38425362. The GO reaction is reversible notation and is consistent with
      physiological NADPH oxidation coupled to ferredoxin reduction.
    supported_by:
    - reference_id: PMID:2845396
    - reference_id: PMID:38425362
- index: 6
  source_annotation:
    term:
      id: GO:0005739
      label: mitochondrion
    evidence_type: HTP
    original_reference_id: PMID:34800366
    qualifier: located_in
  review:
    summary: FDXR is included in the human mitochondrial proteome and shows mitochondrial enrichment in the
      exact target dataset.
    action: ACCEPT
    reason: The original MitoCoP Table S1 workbook, sheet B row 343, names FDXR and P22570 and marks MitoCoP
      membership. Table S2 sheet G row 3234 joins the P22570-containing protein group to FDXR and positive
      mitochondrial clusters in HEK, HeLa, Huh7 and U2OS cells, with positive normalized pure/crude mitochondrial
      ratios. The group includes multiple FDXR isoform accessions and does not separately establish every splice
      product. The study combines experimental enrichment and curated prior knowledge; the Table S1 membership
      flag alone is not treated as a new localization experiment. These exact target data support mitochondrion
      without establishing a submitochondrial compartment or exclusive localization.
    supported_by:
    - reference_id: PMID:34800366
- index: 9
  source_annotation:
    term:
      id: GO:0005739
      label: mitochondrion
    evidence_type: IDA
    original_reference_id: PMID:29040572
    qualifier: is_active_in
  review:
    summary: Endogenous human FDXR overlaps the mitochondrial marker in control and patient fibroblasts.
    action: ACCEPT
    reason: "PMID:29040572 Results and Figure 2C\u2013D directly report FDXR immunofluorescence overlapping\
      \ MitoTracker in human control and patient fibroblasts; the Methods describe the paired staining and\
      \ confocal imaging. The same Results explicitly acknowledge additional nuclear and cytoplasmic signal,\
      \ so this positive mitochondrial annotation is not an exclusivity claim. The mitochondrial-matrix statement\
      \ in that paragraph is attributed to earlier work, rather than measured by the confocal experiment. PMID:29554255\
      \ corrects three family genotype labels in Figure 1, not the Figure 2 localization result."
    supported_by:
    - reference_id: PMID:29040572
    - reference_id: PMID:29554255
- index: 11
  source_annotation:
    term:
      id: GO:0005739
      label: mitochondrion
    evidence_type: TAS
    original_reference_id: PMID:2845396
    qualifier: located_in
  review:
    summary: The mitochondrial location of human adrenodoxin reductase is supported as a traceable author statement.
    action: ACCEPT
    reason: "The complete original PMID:2845396 describes adrenodoxin reductase as a mitochondrial flavoprotein,\
      \ places its electron-transfer function in the mitochondrial P450 system, and depicts a precursor targeting\
      \ segment (pages 7104\u20137106). It does not perform a new microscopy localization assay. Independent\
      \ human fibroblast imaging in PMID:29040572 and exact FDXR mitochondrial enrichment in PMID:34800366\
      \ corroborate the organelle-level claim. No exclusive location or function for every splice form is inferred."
    supported_by:
    - reference_id: PMID:2845396
    - reference_id: PMID:29040572
    - reference_id: PMID:34800366
- index: 20
  source_annotation:
    term:
      id: GO:0006091
      label: generation of precursor metabolites and energy
    evidence_type: TAS
    original_reference_id: PMID:2845396
    qualifier: involved_in
  review:
    summary: Broad precursor and energy metabolism is retained as context for FDXR electron supply, rather
      than a defining core process.
    action: KEEP_AS_NON_CORE
    reason: PMID:2845396 describes FDXR supplying electrons through adrenodoxin to the mitochondrial P450 reactions
      that convert cholesterol to pregnenolone and other metabolites. This is an actual catalytic contribution,
      not only a loss-of-function requirement, but the broad term is less informative than the resolved reductase
      role and its pathway contexts. It does not mean that FDXR itself generates ATP or is an oxidative-phosphorylation
      complex subunit. The verified ontology does not place the existing steroid or ubiquinone biosynthetic
      terms beneath GO:0006091, so a redundancy-based TOO_GENERAL action would not be justified by either of
      those annotations. Retain the curator-supported broad metabolic context as non-core. The saved official
      QuickGO is_a/part_of ancestor response for GO:0006744 lists 12 identifiers including itself, with neither
      GO:0006091 nor the suggested intermediary GO:0006733. The steroid term GO:0006694 also lacks GO:0006091
      in that response; the exact query and snapshot limits are given in FDXR-direct-source-guide.md.
    supported_by:
    - reference_id: PMID:2845396
- index: 23
  source_annotation:
    term:
      id: GO:0006694
      label: steroid biosynthetic process
    evidence_type: TAS
    original_reference_id: PMID:1863359
    qualifier: involved_in
  review:
    summary: FDXR participates in steroid biosynthesis by supplying reducing equivalents to the mitochondrial
      P450 system.
    action: ACCEPT
    reason: 'The verified PMID:1863359 abstract explicitly places adrenodoxin reductase upstream of adrenodoxin
      and P450scc in human steroidogenesis. Its own reported study is regional gene mapping; full text remained
      inaccessible after a publisher attempt. The same gene-level biochemical contribution is independently
      stated in the fully read original PMID:2845396, page 7104: FDXR performs electron transfer from NADPH
      through adrenodoxin to the P450scc reactions that form pregnenolone. Retain the TAS claim on that matching
      positive evidence and curator judgment, without inventing a steroid-conversion assay in the mapping study
      or assigning P450 cleavage chemistry to FDXR. Independent PMID:38885337 adds human patient-derived adrenal-like
      cell steroid-output measurements and male mutant-mouse serum profiles. These corroborate pathway impairment
      but do not directly reconstitute purified FDXR-dependent CYP chemistry; altered mitochondrial redox balance
      can also contribute.'
    supported_by:
    - reference_id: PMID:1863359
    - reference_id: PMID:2845396
    - reference_id: PMID:38885337
- index: 24
  source_annotation:
    term:
      id: GO:0006744
      label: ubiquinone biosynthetic process
    evidence_type: IDA
    original_reference_id: PMID:38425362
    qualifier: acts_upstream_of_positive_effect
  review:
    summary: FDXR provides catalytic reducing equivalents for COQ6-dependent ubiquinone biosynthesis.
    action: ACCEPT
    reason: "PMID:38425362 Results and Figures 2 and 4 resolve the NADPH\u2013FDXR\u2013FDX2 electron supply\
      \ to COQ6: coupled reduction accompanies C5 hydroxylation, substrate product is detected by mass spectrometry,\
      \ and conversion is absent without the ferredoxin pair. The corresponding C1 hydroxylation also uses\
      \ this electron supply. FDXR therefore performs part of the biosynthetic work rather than merely being\
      \ necessary for a phenotype. The proteins are reconstructed tetrapod ancestors and the reactions use\
      \ short-chain CoQ intermediates; retaining the human gene-level claim relies on conserved enzyme function\
      \ and the curated transfer, not a purported extant-human cellular experiment. No natural human isoform-specific\
      \ CoQ activity or stable metabolon membership is established. The ACCEPT action retains the biological\
      \ gene-level claim; it does not endorse the imported acts_upstream_of_positive_effect relation as a complete\
      \ description of pathway participation. The unchanged source relation is less specific about participation\
      \ than cached GO-CAM 675b862c00001470 activity 675b862c00001526: FDXR GO:0004324 is part_of GO:0006744\
      \ and directly_positively_regulates FDX2 activity 675b862c00001519. That curated model corroborates the\
      \ core directly_involved_in synthesis from the electron-transfer assays; it is not independent experimental\
      \ replication. Evidence-code representation remains a PROBABLE curator CHECK request."
    supported_by:
    - reference_id: PMID:38425362
