limitations:
- Figure 1H and Methods 2.4 consistently identify MCF7; Results describe Figure 1F as 293T while its caption says
  MCF7.
- Only paper isoforms 1, 4 and 7 were compared in the inspected localization panels; this is not a direct localization
  assay of every product.
- Processing explanations from sequence and mobility are not endogenous cleavage-site mapping.
- No cytosolic molecular substrate or new GO annotation is asserted.
