core_functions:
- description: Cyclin D-dependent serine/threonine protein kinase that phosphorylates retinoblastoma-family pocket proteins (RB1, RBL1, RBL2) in G1 to derepress E2F and drive the G1/S transition.
  molecular_function:
    id: GO:0004693
    label: cyclin-dependent protein serine/threonine kinase activity
