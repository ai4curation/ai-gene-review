  - UniProtKB:O75832
  review:
    summary: Experimental physical interaction between CDK4 and PSMD10 (gankyrin/p28GANK), captured as the generic term 'protein binding'.
    action: REMOVE
    reason: Per repository curation policy, bare 'protein binding' (GO:0005515) is uninformative about CDK4's molecular function. The CDK4-PSMD10 (gankyrin/p28GANK) interaction is genuine and documented in UniProt, but no specific molecular function should be invented from interaction evidence alone; removal does not assert the interaction is false. Where a partner defines a functional relationship (D-type cyclins, INK4/CIP-KIP regulators, Hsp90-Cdc37 chaperone, cyclin D-CDK4 complexes) that relationship is captured by the dedicated cyclin-binding, complex and holoenzyme terms already annotated.
