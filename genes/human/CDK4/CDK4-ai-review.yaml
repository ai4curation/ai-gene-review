suggested_questions:
- question: Given that CDK4 and CDK6 are largely redundant metazoan G1 kinases, which CDK4-specific substrates or contexts (e.g. tissue-restricted D-cyclin partners) justify CDK4-specific rather than CDK4/6-shared annotation?
  experts:
  - Sicinski P
  - Malumbres M
- question: Should the many CDK4 'protein binding' (IPI) interactions with substrates, regulators and interactome-screen partners be systematically re-curated to has_input / substrate or regulatory relationships on the appropriate activity, rather than left as uninformative GO:0005515?
  experts:
  - Thomas PD
suggested_experiments:
- hypothesis: Cyclin D-CDK4 phosphorylates a specific, partner-directed set of nuclear substrates beyond the RB family in G1.
  description: Analog-sensitive (as-CDK4) chemical-genetic phosphoproteomics in synchronized cells to map direct cyclin D-CDK4 substrates in G1 and distinguish them from CDK6- and CDK2-specific targets.
  experiment_type: phosphoproteomics
- hypothesis: Thr172 activation-loop phosphorylation is rate-limiting for cyclin D-CDK4 activation in vivo.
  description: Quantify Thr172 phosphorylation stoichiometry and CDK4 activity across the G1/S transition using phospho-specific and separation-of-function alleles.
  experiment_type: biochemical/genetic separation-of-function analysis
