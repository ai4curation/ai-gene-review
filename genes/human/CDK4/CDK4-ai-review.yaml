    reason: "The functionally meaningful relationship is cyclin binding: CDK4's obligate D-type cyclin partner assembles the active holoenzyme. Replace the uninformative bare 'protein binding' with cyclin binding (GO:0030332), which is evidence-backed and separately annotated."
