- term:
    id: GO:0005923
    label: bicellular tight junction
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P30285
  - ensembl:ENSMUSP00000006911
  review:
    summary: Bicellular tight junction, from automatic ortholog transfer (Ensembl Compara).
    action: MARK_AS_OVER_ANNOTATED
    reason: Spurious over-propagation via orthology; there is no evidence that CDK4 functions at tight junctions, and it is inconsistent with the established nuclear/cytoplasmic cell-cycle biology.
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT1G20930
  - AGI_LocusCode:AT1G76540
  - MGI:MGI:1277162
  - MGI:MGI:88357
  - PANTHER:PTN000623979
  - PomBase:SPBC11B10.09
  - UniProtKB:P24941
  review:
    summary: Signal transduction (broad), inherited via the CDK PAINT node.
    action: KEEP_AS_NON_CORE
    reason: Cyclin D-CDK4 integrates mitogenic signals to control G1 progression, so a signalling role is defensible, but 'signal transduction' is a high-level term; the specific, informative function is the G1/S RB-kinase activity. Retain as non-core.
- term:
    id: GO:0008284
    label: positive regulation of cell population proliferation
  evidence_type: IMP
  original_reference_id: PMID:7603984
  qualifier: involved_in
  review:
    summary: Positive regulation of cell population proliferation.
    action: KEEP_AS_NON_CORE
    reason: A genuine downstream consequence of CDK4-driven G1/S progression, demonstrated by p16-mediated growth suppression requiring functional RB; retained as a non-core outcome rather than the direct molecular function.
    supported_by:
    - reference_id: PMID:7603984
      supporting_text: the pRB is the critical target acted upon by cyclin D-dependent kinases in the G1 phase of the cell cycle.
- term:
    id: GO:0009410
    label: response to xenobiotic stimulus
  evidence_type: IEP
  original_reference_id: PMID:18291362
  qualifier: involved_in
  review:
    summary: Response to xenobiotic stimulus (IEP), from a study where cdk4 mRNA falls after sulindac treatment.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited work shows cdk4 expression is suppressed downstream of sulindac-induced beta-catenin repression; CDK4 is a downstream target of the drug response, not an executor of a xenobiotic-response process. Over-annotation of an expression change.
- term:
    id: GO:0010468
    label: regulation of gene expression
  evidence_type: IMP
  original_reference_id: PMID:17420273
  qualifier: involved_in
  review:
    summary: Regulation of gene expression (broad), via RB phosphorylation and E2F derepression.
    action: KEEP_AS_NON_CORE
    reason: CDK4 regulates gene expression indirectly by inactivating RB-family repressors, releasing E2F-dependent transcription. Real but high-level and downstream; the informative annotations are the kinase activity and G1/S process.
- term:
    id: GO:0010971
    label: positive regulation of G2/M transition of mitotic cell cycle
  evidence_type: IDA
  original_reference_id: PMID:19124461
  qualifier: involved_in
  review:
    summary: Positive regulation of G2/M transition (IDA), from an INSM1 cell-cycle-arrest study.
    action: MARK_AS_OVER_ANNOTATED
    reason: In this study overexpressed cyclin D1-CDK4 reversed an INSM1-imposed G1/S block, so cells progressed and were scored in G2/M by flow cytometry. CDK4's direct action is at G1/S; appearance of cells in G2/M is a downstream readout of resumed cycling, not a CDK4-specific G2/M function.
    supported_by:
    - reference_id: PMID:19124461
      supporting_text: "INSM1 binding\nto cyclin D1 interrupts its association with CDK4 and induces hypophosphorylation of\nthe retinoblastoma protein."
