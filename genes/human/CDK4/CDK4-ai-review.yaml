- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000623979
  - PomBase:SPBC11B10.09
  - SGD:S000000364
  review:
    summary: G2/M transition of mitotic cell cycle, inherited via the pan-CDK PAINT node.
    action: KEEP_AS_NON_CORE
    reason: This IBA descends from the ancestral cyclin-dependent kinase node (PANTHER:PTN000623979), whose deepest members include the single essential yeast/animal mitotic CDK. CDK4 itself is a dedicated G1 kinase and is not the driver of the G2/M transition (that is CDK1); retain as a phylogenetically-inherited non-core process rather than a CDK4-specific function.
