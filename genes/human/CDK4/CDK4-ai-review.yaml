  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0000307
    label: cyclin-dependent protein kinase holoenzyme complex
  supported_by:
  - reference_id: PMID:19237555
    supporting_text: Cyclin-dependent kinase 4 (CDK4)/cyclin D complexes are expressed early in the G(1) phase of the cell cycle and stimulate the expression of genes required for G(1) progression by phosphorylation of the product of the retinoblastoma gene, pRb.
  - reference_id: PMID:22094256
    supporting_text: These complexes promote G1-S transition in cancer cells by phosphorylating critical substrates, of which the Retinoblastoma tumor suppressor protein, RB1, as well as the related family members, RBL1 (p107) and RBL2 (p130), remain best characterized.
- description: Binds D-type cyclins (CCND1/2/3); cyclin binding is obligatory for assembly and activation of the CDK4 holoenzyme.
