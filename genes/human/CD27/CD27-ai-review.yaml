id: P26842
gene_symbol: CD27
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD27 (TNFRSF7) is a type I transmembrane costimulatory receptor of the tumor necrosis factor
  receptor superfamily. Its extracellular region recognizes CD70, while its short cytoplasmic tail couples
  ligand engagement to intracellular signaling partners including TRAF2. Cell-surface CD27 supports T-cell
  activation and expansion together with antigen-receptor signals, and contributes to context-dependent
  B-cell differentiation, antibody responses, survival and T-cell memory programs. Soluble CD27 also occurs
  extracellularly. Recessive loss of human CD27 impairs immune control of Epstein–Barr virus and causes
  lymphoproliferative syndrome 2.
