knowledge_gaps:
- gap_statement: APCDD1L has no experimentally established function, binding partner or location. Every
    functional GO term it carries is transferred from its paralog APCDD1 by the shared InterPro family
    signature.
  boundary: 'Established: membrane-protein topology (signal peptide, single C-terminal TM helix, N-glycosylation
    site) and membership of the APCDD1 family. Not established: Wnt or LRP5 binding, any effect on Wnt
    signalling, subcellular location, and expression pattern at the protein level. PAINT seeded Wnt-related
    function only on the APCDD1 clade.'
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: APCDD1 is a Wnt inhibitor whose loss causes hereditary hypotrichosis; whether APCDD1L
    shares, opposes or lacks that activity determines whether the paralog annotations can stand.
  resolution: Test APCDD1L binding to WNT3A and LRP5 and its effect on Wnt reporter activity alongside
    APCDD1, and localize tagged APCDD1L.
suggested_questions:
- question: Did APCDD1L retain the Wnt-binding and Wnt-inhibitory activity of APCDD1 after the duplication,
    given that PAINT confined those annotations to the APCDD1 clade?
suggested_experiments:
- description: Co-express APCDD1L with WNT3A or LRP5 for binding assays and TOPflash reporter tests, with
    APCDD1 as a positive control.
