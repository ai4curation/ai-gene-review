description: APCDD1L (APCDD1-like) is an uncharacterized paralog of the Wnt inhibitor APCDD1. It is a
  predicted single-pass type I membrane glycoprotein, with an N-terminal signal peptide, two APCDD1-family
  (APCDDC) domains, an N-linked glycosylation site and a single C-terminal transmembrane helix. Its paralog
  APCDD1 is a plasma-membrane glycoprotein that binds WNT3A and LRP5 and inhibits Wnt signalling upstream
  of beta-catenin. No function, binding partner or location has been established experimentally for APCDD1L
  itself; published work under the APCDD1L name concerns the antisense and divergent lncRNAs at its locus.
