- description: Binds PI(4,5)P2-containing membranes through a conserved cationic pocket in its atypical TBC
    domain, which localizes it to presynaptic terminals, where it restrains endosomal sorting of synaptic
    vesicles and is required for efficient synaptic vesicle endocytosis.
