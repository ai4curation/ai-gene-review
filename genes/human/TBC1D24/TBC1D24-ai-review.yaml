- term:
    id: GO:0005546
    label: phosphatidylinositol-4,5-bisphosphate binding
  evidence_type: ISS
  original_reference_id: PMID:27669036
  review:
    summary: Phosphatidylinositol-4,5-bisphosphate binding through the conserved cationic pocket of the TBC
      domain, shown by co-crystallization and biochemistry for the Drosophila ortholog Skywalker.
    action: NEW
    reason: The pocket is conserved among TBC1D24 homologs, the residues lining it are mapped onto the human
      sequence, and the most prevalent patient mutations fall in it and abolish lipid binding. This is the
      best-supported molecular activity of the TBC domain, which lacks the catalytic machinery of a Rab GAP.
      Evidence is from the fly ortholog, hence ISS.
    supported_by:
    - reference_id: PMID:27669036
      supporting_text: revealing an unanticipated cationic pocket conserved among TBC1D24 homologs
    - reference_id: PMID:27669036
      supporting_text: The most prevalent patient mutations affect the phosphoinositide-binding pocket and
        inhibit lipid binding
- term:
    id: GO:1903421
    label: regulation of synaptic vesicle recycling
  evidence_type: ISS
  original_reference_id: PMID:30335140
  review:
    summary: Regulation of synaptic vesicle recycling. Mouse Tbc1d24 is required for efficient synaptic
      vesicle endocytosis and a normal endosomal compartment, and the fly ortholog Skywalker restrains
      endosomal sorting of synaptic vesicles at presynaptic boutons.
    action: NEW
    reason: Two independent model systems show that TBC1D24 itself acts at the presynaptic terminal on the
      vesicle recycling route, membrane-anchored by its phosphoinositide pocket; it is a regulator rather than
      a component of the endocytic machinery, so the regulation term is used. Evidence is from mouse and fly
      orthologs, hence ISS.
    supported_by:
    - reference_id: PMID:30335140
      supporting_text: genetic disruption of Tbc1d24 expression in the mouse leads to an impairment of
        endocytosis and an enlarged endosomal compartment in neurons
    - reference_id: PMID:21458671
      supporting_text: facilitates endosomal trafficking of synaptic vesicles at Drosophila neuromuscular
        junction boutons, chiefly by controlling Rab35 GTPase activity
