suggested_questions:
- question: Does human TBC1D24 stimulate GTP hydrolysis by any Rab (Rab35, RAB22A) or by ARF6 in
    purified-protein assays, given that its TBC domain lacks the arginine finger?
- question: Does TBC1D24 promote or inhibit V-ATPase assembly in neurons in vivo, and does its TLDc domain
    bind the V1 sector directly?
- question: 'How does TBC1D24 suppress ARF6 activation: by competing with ARF6 guanine nucleotide exchange factors,
    by sequestering ARF6, or through another mechanism?'
suggested_experiments:
- description: Single-turnover GTPase assays with purified human TBC1D24 TBC domain and a panel of Rab and ARF
    GTPases (including Rab35, RAB22A and ARF6), with a canonical TBC GAP as positive control.
  hypothesis: TBC1D24 has no or very weak GAP activity and acts as a lipid-anchored binding partner rather
    than a catalytic GAP.
- description: Reconstitute purified V-ATPase with full-length TBC1D24 and its isolated TLDc domain, and
    measure V1-V0 assembly and proton pumping; compare with Tbc1d24 knockout neuron organelle pH.
  hypothesis: TBC1D24 binds V1 subunits directly and its net effect on assembly depends on cellular context.
