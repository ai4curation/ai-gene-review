id: Q9ULP9
gene_symbol: TBC1D24
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TBC1D24 is a 559-residue peripheral membrane protein of neurons that combines an N-terminal TBC (Tre2/Bub2/Cdc16)
  domain with a C-terminal TLDc domain, a pairing unique among TBC proteins. The TBC domain lacks the catalytic
  arginine finger of canonical Rab GTPase-activating proteins; instead it carries a conserved cationic pocket that,
  in the Drosophila ortholog Skywalker, binds phosphoinositides phosphorylated at the 4 and 5 positions, such as
  PI(4,5)P2, and anchors the protein to presynaptic membranes. Skywalker restrains endosomal sorting of synaptic
  vesicles through Rab35 at the fly neuromuscular junction, and loss of mouse Tbc1d24 impairs synaptic vesicle endocytosis
  and enlarges the endosomal compartment. TBC1D24 binds the small GTPase ARF6 and suppresses its activation, a relationship
  that underlies its roles in neurite and axon growth, radial migration of cortical neurons and maintenance of dendritic
  spines at excitatory postsynapses. It also binds RAB22A and promotes tubular recycling endosomes that return clathrin-independent
  cargo to the plasma membrane. The TLDc domain confers resistance to oxidative stress and interacts with the vacuolar
  ATPase, although whether TBC1D24 promotes or inhibits V-ATPase assembly differs between studies. Biallelic variants
  cause a spectrum of epileptic encephalopathies, DOORS syndrome and nonsyndromic hearing loss.'
