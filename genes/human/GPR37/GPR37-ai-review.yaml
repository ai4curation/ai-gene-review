core_functions:
- description: Gi-coupled receptor for the secreted neuroprotective glycoprotein prosaposin and its
    peptide fragment prosaptide. Ligand binding drives receptor endocytosis, GTPgammaS loading on
    Gi, inhibition of forskolin-stimulated cAMP production and pertussis-toxin-sensitive ERK phosphorylation,
    and raises intracellular calcium. The receptor operates at the plasma membrane of neurons, oligodendrocytes,
    astrocytes, sensory neurons and macrophages, where this signalling supports protection against
    oxidative stress, macrophage phagocytosis and the resolution of inflammatory and neuropathic
    pain. This is the only GPR37 ligand pairing supported by work from more than one laboratory,
    including conditional knockout in a defined cell population in vivo, and it is the pairing GOA
    already carries. Competing pairings with the lipid mediator protectin D1 and with osteocalcin
    are not included here because neither has independent replication of the direct binding step.
  molecular_function:
    id: GO:0036505
    label: prosaposin receptor activity
  directly_involved_in:
  - id: GO:0007193
    label: adenylate cyclase-inhibiting G protein-coupled receptor signaling pathway
  - id: GO:0043410
    label: positive regulation of MAPK cascade
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:23690594
    supporting_text: 'We screened these receptors for potential activation by various orphan neuropeptides,
      and these screens yielded a single positive hit: prosaptide, which promoted the endocytosis
      of GPR37 and GPR37L1, bound to both receptors and activated signaling in a GPR37- and GPR37L1-dependent
      manner.'
  - reference_id: PMID:23690594
    supporting_text: Prosaptide stimulation of cells transfected with GPR37 or GPR37L1 induced the
      phosphorylation of ERK in a pertussis toxin-sensitive manner, stimulated 35 S-GTPγS binding,
      and promoted the inhibition of forskolin-stimulated cAMP production.
  - reference_id: PMID:30010619
    supporting_text: NPD1 and TX14 also bind to GPR37 and cause GPR37-dependent iCa2+ increases in
      peritoneal MΦs.
  - reference_id: PMID:42144155
    supporting_text: Global GPR37 knockout or conditional knockout of GPR37 in TRPV1-lineage sensory
      neurons abolished the long-term inhibitory effect and unpriming effect of i.th. TX14A, confirming
      that GPR37 in this specific cellular population mediates these effects.
proposed_new_terms:
- proposed_name: protectin D1 receptor activity
  proposed_definition: Combining with protectin D1 (neuroprotectin D1), a docosahexaenoic-acid-derived
    specialized pro-resolving lipid mediator, and transmitting the signal across the membrane by
    activating an associated G-protein.
  justification: GPR37 is reported to be activated by protectin D1/neuroprotectin D1 in binding and
    calcium assays, and PD1's actions on macrophage phagocytosis, sepsis survival, chemotherapy-induced
    neuropathy, inflammatory pain resolution and efferocytosis are lost in Gpr37 knockout mice. No
    GO term exists for a protectin D1 receptor, so this activity currently has nowhere to go and
    is instead absorbed into generic GPCR terms. Proposed rather than asserted as a core function,
    because the claim carries a real chemical-class problem - the same receptor is asserted to be
    activated by a peptide (prosaptide) and by a lipid, and most of the supporting work shares a
    senior author. The decisive experiment, competition binding of protectin D1 against labelled
    prosaptide on the same receptor preparation, has not been reported.
  proposed_parent:
    id: GO:0045125
    label: bioactive lipid receptor activity
  supported_by:
  - reference_id: PMID:30010619
    supporting_text: Neuroprotectin D1 (NPD1) and prosaptide TX14 increase intracellular Ca2+ (iCa2+)
      levels in GPR37-transfected HEK293 cells.
  - reference_id: PMID:40287118
    supporting_text: NPD1 treatment also mitigated mechanical allodynia and prevented the loss of
      intraepidermal nerve fibers in hind paw skins in wild-type mice undergoing chemotherapy, but
      these protective effects are absent in Gpr37 knockout mice.
  - reference_id: PMID:42649016
    supporting_text: Prosaposin (PSAP), a secreted glycoprotein with neurotrophic activity, and protectin
      D1, a docosahexaenoic acid-derived lipid mediator, are endogenous ligands of G protein-coupled
      receptor 37 (GPR37).
- proposed_name: osteocalcin receptor activity
  proposed_definition: Combining with osteocalcin, a bone-derived peptide hormone, and transmitting
    the signal across the membrane by activating an associated G-protein.
  justification: Osteocalcin has been proposed as an endogenous ligand of GPR37, first in oligodendrocytes,
    where GPR37 was identified as an OCN receptor controlling differentiation and myelination, and
    more recently in ventral tegmental area GABAergic neurons, where OCN suppresses THIK-1 potassium
    currents through GPR37-mediated cAMP reduction. No osteocalcin receptor term exists in GO, although
    two other receptors, GPRC6A and GPR158, have been proposed for the same hormone. Proposed rather
    than asserted as a core function because the two GPR37 studies share senior authors and therefore
    corroborate rather than independently replicate one another, and because the 2026 study carries
    a substantial published erratum.
  proposed_parent:
    id: GO:0008528
    label: G protein-coupled peptide receptor activity
  supported_by:
  - reference_id: PMID:34678058
    supporting_text: GPR37 is identified as a previously unknown receptor for OCN, thus regulating
      OL differentiation and CNS myelination.
  - reference_id: PMID:41679312
    supporting_text: Here, we demonstrate that osteocalcin (OCN), a bone-derived hormone, permits
      rapid visual escape by enhancing the excitability of a ventral tegmental area (VTA) GABAergic
      neuron subpopulation through the OCN-G Protein-Coupled Receptor 37 (GPR37)-cAMP-TWIK-related
      halothane-inhibited potassium channel (THIK-1) pathway.
  - reference_id: PMID:41679312
    supporting_text: Loss of OCN, loss of its receptor GPR37, or conditional deletion of GPR37 in
      VTA GABAergic or glutamatergic neurons delays escape responses, while reconstituting OCN-GPR37
      signaling in the VTA restores normal behavior.
suggested_questions:
- question: Can a single receptor really be both a peptide receptor and a lipid receptor? Prosaptide/TX14A
    and protectin D1 are asserted to activate GPR37 in the same assays and often in the same papers,
    yet they belong to entirely different chemical classes. Nobody has reported competition binding
    of protectin D1 against labelled prosaptide, or mutagenesis separating the two responses, so
    it is unresolved whether GPR37 has two distinct sites, whether one of the two acts indirectly,
    or whether the shared calcium/phagocytosis readout is simply not a clean measure of orthosteric
    occupancy.
- question: Is the osteocalcin-GPR37 pairing independently replicable? The 2021 oligodendrocyte study
    and the 2026 ventral tegmental area study share senior authors and the same institute, so they
    corroborate rather than replicate. Given that osteocalcin already has two other claimed receptors
    (GPRC6A and GPR158), a demonstration of direct OCN binding to purified GPR37 from a laboratory
    with no stake in the original claim is needed before a molecular function term is justified.
- question: Does prosaposin agonise GPR37 or chaperone it? The alternative reading of the prosaposin
    data, raised in the 2015 review of this receptor and never formally excluded, is that prosaposin
    improves GPR37 folding and cell-surface delivery, and that downstream readouts follow from increased
    surface receptor rather than from orthosteric activation. Agonist-independent and agonist-dependent
    effects have not been separated.
- question: Has the IUPHAR Nomenclature Committee ratified any GPR37 deorphanization? As of the most
    recent authoritative review of this receptor the prosaposin pairing had not been ratified. Whether
    that position has changed matters directly for how confidently GO:0036505 should be treated as
    core.
- question: Is being a parkin and HRD1 substrate a function or a liability? The Pael-R work is the
    most reproducible molecular observation about GPR37, but it describes ER quality control of a
    protein that folds badly under overexpression. Whether endogenous GPR37 is a physiological ERAD
    client at normal expression levels, or whether the phenomenon is an artefact of overexpression
    that happens to be disease-relevant, has not been settled.
- question: What does constitutive N-terminal shedding do? GPR37 is cleaved by metalloproteinase
    between E167 and Q168 and the ectodomain is released, so most surface receptor is N-terminally
    truncated. Whether the shed ectodomain has activity of its own, and whether the truncated receptor
    differs pharmacologically from the full-length form, is unknown and could explain discrepant
    ligand results between laboratories.
suggested_experiments:
- hypothesis: Prosaptide and protectin D1 occupy the same site on GPR37.
  description: Perform saturation and competition radioligand or fluorescence-polarisation binding
    on purified GPR37 in nanodiscs, using labelled TX14A and unlabelled protectin D1 and vice versa,
    in parallel with GPR37L1 and an unrelated class A GPCR as controls. Mutually competitive displacement
    would establish a shared site; non-competitive behaviour would point to two sites and would justify
    two separate molecular function terms.
  experiment_type: binding
- hypothesis: Protectin D1 activates GPR37 directly rather than through an intermediate.
  description: Reconstitute purified GPR37 with heterotrimeric Gi in nanodiscs and measure GTP turnover
    or conformational change (BRET/FRET sensor, or HDX-MS) in response to protectin D1 in a system
    containing no other cellular protein. A cell-free response would settle the direct-agonism question
    that cell-based calcium assays cannot.
  experiment_type: biochemistry
- hypothesis: Osteocalcin binds GPR37 directly.
  description: In an independent laboratory, test binding of labelled osteocalcin to purified GPR37
    and to GPRC6A and GPR158 side by side, and test whether osteocalcin-evoked cAMP reduction survives
    in cells expressing GPR37 but lacking GPR158 and GPRC6A. Include the carboxylated and uncarboxylated
    forms, since these differ in the peripheral osteocalcin literature.
  experiment_type: binding
- hypothesis: Prosaposin acts as a chaperone for GPR37 as well as, or instead of, as an agonist.
  description: Compare surface GPR37 by biotinylation and by a non-permeabilised antibody feed after
    short (minutes) and long (hours) prosaposin exposure, and test whether prosaposin still produces
    ERK and cAMP responses when surface receptor number is clamped, for example by using a receptor
    construct with a trafficking-independent surface anchor or by pre-saturating the surface pool.
  experiment_type: cell biology
- hypothesis: Head activator has no action at human GPR37.
  description: A definitive negative would let the GO:0008188, GO:0007218 and GO:0042923 annotations
    be retired with a citable modern reference rather than a chain of secondary assertions. Test
    synthetic head activator across a modern transducer panel (TRUPATH, arrestin recruitment, calcium,
    cAMP) on human GPR37, with prosaptide as the positive control, in a GPR37-null background.
  experiment_type: pharmacology
- hypothesis: N-terminal shedding changes GPR37 pharmacology.
  description: Compare ligand responses of full-length GPR37 with a receptor whose shedding site
    is mutated, and with a construct beginning at Q168, for prosaptide, protectin D1 and osteocalcin.
    If the truncated and full-length forms differ, the proportion of each form in a given expression
    system would explain much of the inter-laboratory disagreement about this receptor.
  experiment_type: pharmacology
