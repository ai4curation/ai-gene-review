id: O15354
gene_symbol: GPR37
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Brain-enriched class A seven-transmembrane receptor, originally cloned as an endothelin-B-receptor-like
  gene and independently identified as the parkin substrate Pael-R. It has a long extracellular N-terminus
  that is constitutively cleaved by metalloproteinase and shed, so the receptor is present at the
  cell surface mainly in a truncated form, and it carries a C-terminal PDZ-binding motif through
  which MUPP1/MPDZ delivers it to dendrites and synapses in a complex with CASPR2. GPR37 signals
  through Gi, inhibiting adenylate cyclase and raising intracellular calcium and ERK phosphorylation,
  and is expressed in neurons, oligodendrocytes, astrocytes, sensory neurons and macrophages. The
  receptor is also strongly prone to misfolding: overexpressed or mutant GPR37 aggregates and is
  retained in the endoplasmic reticulum, where it is ubiquitinated by parkin together with CHIP/STUB1
  and Hsp70, and by the ER ligase HRD1/SYVN1, and its accumulation triggers ER stress and dopaminergic
  cell death, linking it to autosomal-recessive juvenile parkinsonism. Its endogenous ligand is disputed.
  The secreted glycoprotein prosaposin and its peptide fragment prosaptide activate GPR37 and are
  the pairing recorded in current annotation; the docosahexaenoic-acid-derived lipid mediator protectin
  D1 (neuroprotectin D1) is reported to activate the same receptor in the same assays, which would
  make GPR37 a receptor for both a peptide and a lipid; the bone-derived hormone osteocalcin has
  been proposed as a third ligand acting through GPR37 in oligodendrocytes and in ventral tegmental
  area neurons; and an earlier pairing with the invertebrate peptide head activator was not reproduced
  and the peptide has no human gene. Loss of GPR37 in mice delays resolution of inflammatory and
  neuropathic pain, impairs macrophage phagocytosis and defence against infection, and alters oligodendrocyte
  differentiation and myelination.'
