- term:
    id: GO:0036505
    label: prosaposin receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Phylogenetic propagation of prosaposin receptor activity.
    action: ACCEPT
    reason: Core molecular function, and the only proposed GPR37 ligand pairing with support from
      more than one laboratory. The original screen (Hall lab) found prosaptide to be the single
      hit among orphan neuropeptides, showed binding, receptor-dependent endocytosis, pertussis-toxin-sensitive
      ERK phosphorylation, GTPgammaS loading and cAMP inhibition, and reproduced the effects with
      purified full-length prosaposin. The Ji lab subsequently reproduced TX14 binding and GPR37-dependent
      calcium signalling in an independent system, and in 2026 showed that the in vivo actions of
      intrathecal TX14A require GPR37 specifically in TRPV1-lineage sensory neurons. Reservations
      remain and are recorded rather than suppressed - the agonist concentration needed is around
      100 nM, higher than is usual for peptide/GPCR pairs; the pairing had not been ratified by the
      IUPHAR Nomenclature Committee as of the 2015 review of this receptor; and prosaposin may additionally
      act as a folding chaperone that increases GPR37 cell-surface expression, which would produce
      some of the same readouts without orthosteric agonism. The WITH/FROM field of this IBA contains
      UniProtKB:O15354, GPR37 itself, which is expected and correct - GPR37 carries its own IDA for
      this term and is therefore one of the descendant evidences the PAINT curator used to place
      the ancestral node. That is a marker of experimental grounding on the target, not circularity.
    supported_by: &id001
    - reference_id: PMID:23690594
      supporting_text: 'We screened these receptors for potential activation by various orphan neuropeptides,
        and these screens yielded a single positive hit: prosaptide, which promoted the endocytosis
        of GPR37 and GPR37L1, bound to both receptors and activated signaling in a GPR37- and GPR37L1-dependent
        manner.'
    - reference_id: PMID:30010619
      supporting_text: NPD1 and TX14 also bind to GPR37 and cause GPR37-dependent iCa2+ increases
        in peritoneal MΦs.
    - reference_id: PMID:42144155
      supporting_text: Global GPR37 knockout or conditional knockout of GPR37 in TRPV1-lineage sensory
        neurons abolished the long-term inhibitory effect and unpriming effect of i.th. TX14A, confirming
        that GPR37 in this specific cellular population mediates these effects.
