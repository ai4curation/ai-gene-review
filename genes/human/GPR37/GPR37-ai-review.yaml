- term:
    id: GO:0042923
    label: neuropeptide binding
  evidence_type: IPI
  original_reference_id: PMID:16443751
  qualifier: enables
  review:
    summary: Neuropeptide binding asserted from the 2006 report that the Hydra peptide head activator
      binds GPR37 with nanomolar affinity. The WITH/FROM entity is UniProtKB:P69251, the Hydra vulgaris
      head-activator peptide.
    action: REMOVE
    reason: 'The sole evidence is the 2006 head-activator (HA) pairing, which has since been contradicted
      from three directions. (i) Dunham et al. 2009 attempted to replicate it and found no HA-mediated
      internalisation, ERK1/2 phosphorylation or cAMP stimulation. (ii) HA was included in a screen
      across all remaining orphan GPCRs and was not a hit for any receptor (Southern et al. 2013).
      (iii) Head activator is a Hydra undecapeptide and no corresponding gene has been found in the
      human genome (Davenport et al. 2013) - note that the WITH/FROM field of the GOA row is literally
      UniProtKB:P69251, MORN_HYDVU, the Hydra vulgaris morphogenetic neuropeptide. Even the prosaposin
      paper, which is sympathetic to the HA result, concedes that HA is not a true ortholog of prosaptide
      and proposes only that it may act as an agonist by similarity. This is a published, direct
      failure to replicate rather than a disagreement with a curator over a paper I have not read,
      so REMOVE is appropriate. No content is lost: the peptide-receptor function of GPR37 is retained
      by the GO:0008528 and GO:0036505 annotations, which rest on the prosaposin work.'
    supported_by: &id002
    - reference_id: PMID:26635605
      supporting_text: These studies contrast with that of Dunham et al. (2009), who attempted to
        replicate the finding that HA was a ligand for GPR37 but found no evidence of HA-mediated
        internalization, ERK1/2 phosphorylation or cAMP stimulation.
    - reference_id: PMID:26635605
      supporting_text: perhaps the most damning evidence against HA as the endogenous ligand for
        GPR37 is the fact that it has not been found in the human genome (Davenport et al., 2013).
        Thus, it appears that HA is unlikely to be an agonist at GPR37 and is certainly not its endogenous
        ligand.
    - reference_id: PMID:23690594
      supporting_text: HA does not seem to be a true ortholog of prosaptide, but nonetheless we propose
        that this invertebrate peptide may possess the ability to act as a GPR37 agonist owing to
        its similarity to prosaptide and prosaposin.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:16443751
  qualifier: located_in
  review:
    summary: Cytoplasmic localisation observed when GPR37 is overexpressed, where the receptor aggregates
      and is retained intracellularly.
    action: MODIFY
    reason: The observation is real but the term misdescribes it. GPR37 is a multi-pass membrane
      protein; what the authors saw was intracellular retention of an aggregation-prone receptor,
      which other work localises specifically to the endoplasmic reticulum, where GPR37 is a substrate
      for parkin- and HRD1-mediated degradation and where disease-associated variants accumulate.
      Endoplasmic reticulum membrane is the accurate compartment.
    supported_by:
    - reference_id: PMID:16443751
      supporting_text: Overexpression of GPR37 led to aggregate formation, retention of the receptor
        in the cytoplasm and low survival rates of transfected cells
    - reference_id: PMID:17059562
      supporting_text: This study shows that HRD1 was expressed in substantia nigra pars compacta
        (SNC) dopaminergic neurons and interacted with Pael-R through the HRD1 proline-rich region,
        promoting the ubiquitylation and degradation of Pael-R.
    proposed_replacement_terms:
