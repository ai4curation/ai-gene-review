id: Q14435
gene_symbol: GALNT3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'GALNT3 encodes polypeptide N-acetylgalactosaminyltransferase 3 (GalNAc-T3, EC 2.4.1.41), one of about
  twenty Golgi-resident GT-A-fold glycosyltransferases that initiate mucin-type O-glycosylation by transferring
  N-acetylgalactosamine from UDP-GalNAc to serine and threonine residues of secretory and membrane proteins. It
  is a type II transmembrane protein with a luminal catalytic domain and a C-terminal ricin-type lectin domain that
  binds previously added GalNAc and directs long-range follow-on glycosylation; activity requires Mn2+. GalNAc-T3
  has broad acceptor specificity (including mucin tandem-repeat peptides), but its physiologically non-redundant
  substrate is the phosphaturic hormone FGF23: it O-glycosylates Thr178 within the RHTR/S proprotein convertase
  site, which shields FGF23 from furin cleavage and allows secretion of intact, active hormone. Biallelic loss-of-function
  variants therefore cause excess FGF23 cleavage, low intact FGF23, hyperphosphatemia and ectopic calcification
  (hyperphosphatemic familial tumoral calcinosis / hyperostosis-hyperphosphatemia syndrome).'
