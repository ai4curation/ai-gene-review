- id: Reactome:R-HSA-190372
  title: FGFR3c ligand binding and activation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Immutable summary and successful official ContentService event hierarchy read. The pathway
      explicitly includes GALNT3-dependent FGF23 glycosylation 8851619 before secretion, ligand binding
