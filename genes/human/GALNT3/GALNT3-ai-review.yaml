id: Q14435
gene_symbol: GALNT3
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
status: DRAFT
description: GALNT3 encodes GalNAc-T3, a Golgi membrane glycosyltransferase that initiates mucin-type
  protein O-glycosylation by transferring N-acetylgalactosamine from UDP-GalNAc to serine and threonine
  residues. Its lumenal catalytic region works with a C-terminal lectin domain that recognizes prior glycosylation
  and directs additional modification. Manganese supports catalysis. Substrates include mucin sequences
  and FGF23, whose Thr178 glycosylation limits proteolytic processing and helps preserve intact extracellular
  hormone. GALNT3 loss of function can cause hyperphosphatemic familial tumoral calcinosis and hyperostosis-hyperphosphatemia
  syndrome.
alternative_products:
- name: '1'
  id: Q14435-1
  sequence_note: Displayed 633-residue product with the membrane anchor, catalytic region and C-terminal
    lectin domain. Engineered soluble constructs in biochemical studies are distinguished from natural
    products.
- name: '2'
  id: Q14435-2
  sequence_note: 'Verified 192-residue product: canonical 173–192 replaced by YVEEYLLFILYHQALQGREG and
    193–633 absent (VSP_011202, VSP_011203). Most of the catalytic region and the lectin domain are absent;
    equivalent catalytic function has not been established.'
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Official method description read: PAINT places ancestral assertions using experimentally
      annotated descendants and propagates them through the curated phylogeny. The actual PTHR11675 tree/alignment
      and literal IBD records were inspected for all three GALNT3 contexts. Target sequence and ancestry
      match; no target-path loss was found. Target self-evidence is legitimate grounding, not circularity.
      Individual donor experiments were not all reread.'
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Official method description read: electronic mapping from curated UniProt subcellular-location
      vocabulary, with conservative term changes. The GALNT3 cisterna annotation maps SL-0136; the human
      localization abstract independently supports Golgi-stack residence. The mapping itself is not an
      experimental assay.'
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official method description and current HPA GALNT3 subcellular page read. The method
      curates immunofluorescence observations; the current page lists supported Golgi apparatus localization.
      Individual microscopy images were not independently scored. Original human localization is corroborated
      by PMID:9394011.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl
    Compara
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official Ensembl Compara transfer-method description, mouse P70419 identity and complete
      current donor GOA were read. The source contains experimental O-glycosylation and cytoplasm annotations,
      but those donor papers were not independently read. Current human experiments support the narrower
      O-GalNAc process and Golgi location; neither donor count nor incomplete access is treated as a propagation
      defect.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Official ARBA method description read: association rules learned from curated UniProt
      data, with ontology-based expansion. The human GALNT3 O-GalNAc process is independently established.
      The complete conditions of ARBA00086939 were not individually audited, and this record is not counted
      as independent experimental confirmation.'
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official combined-IEA method description read. It consolidates identical assertions
      supported by multiple electronic methods. The literal GALNT3 ARBA, orthology and EC inputs are preserved;
      their concurrence does not manufacture independent experimental support. Human biochemical evidence
      validates the activity.
- id: PMID:12506059
  title: The cell-layer- and cell-type-specific distribution of GalNAc-transferases in the
    ocular surface epithelia is altered during keratinization.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic PubMed-derived abstract and publisher identity verified. The study
      used isoenzyme-specific monoclonal antibodies including GALNT3 in human ocular epithelia
      and reports positive GALNT3 distribution. Complete original localization panels remain
      inaccessible after publisher and author-indexed attempts. The non-core perinuclear assignment
      defers to the curator in the context of independent human Golgi evidence; it does not
      claim independent inspection of the target perinuclear panel or convert the abstract's
      GALNT2 supranuclear sentence into a GALNT3 result.
- id: PMID:16638743
  title: Polypeptide GalNAc-transferase T3 and familial tumoral calcinosis. Secretion of fibroblast growth
    factor 23 requires O-glycosylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic abstract and selected author-indexed original Methods/Results read, including
      human transfection and peptide glycosylation; complete original figure inspection was not achieved.
      Supports GALNT3-dependent FGF23 O-GalNAc modification and resistance to processing. The title and
      older secretion wording are interpreted together with PMID:31932717, whose short pulse assay did
      not show a marked secretion-rate increase and attributed later intact-hormone accumulation mainly
      to extracellular stability.
- id: PMID:17129170
  title: 'Hyperostosis-hyperphosphatemia syndrome: a congenital disorder of O-glycosylation associated
    with augmented processing of fibroblast growth factor 23.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native cache is abstract-only; selected authentic author-uploaded original Methods/Results
      and captions were read externally (DOI 10.1359/jbmr.061105, Methods 411–598, Results 823–1118 in
      the retained indexed text). Human HOS-TE85 GALNT3-siRNA/FGF23 experiments and patient evidence support
      altered glycosylation/processing. CHO-expressed FGF23 preparations and site variants are distinguished
      from the human-cell silencing system. No source figure images or raw MS data were independently
      inspected.
- id: PMID:18570454
  title: Proteomic analysis of exosomes from human neural stem cells by flow field-flow fractionation
    and nanoflow liquid chromatography-tandem mass spectrometry.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Native cache is abstract-only. Selected Methods/Results and Tables 1–2 were
      read from the authentic author-hosted original (DOI 10.1021/pr800225z; https://chem.yonsei.ac.kr/~mhmoon/pdf/Papers/81_JPR_exosome.pdf);
      the complete Table 2 page 3478 was previously visually inspected. GI1617312/CAA63371.1
      resolves to human GALNT3/Q14435, with one peptide in fraction 3. Table 1 reports fraction-3
      diameters 34.0 ± 1.40 nm (16 particles). The Results p3480 require Mascot score above
      50 and repeated detection across three shotgun analyses for single-peptide identifications.
      TEM and size fractionation support the vesicle assignment; raw GALNT3 spectra were not
      independently inspected. This supports bounded fraction membership, not purity, topology,
      catalytic activity or biogenesis. The attempted supplementary challenge HTML remains
      excluded.
- id: PMID:31932717
  title: Molecular basis for fibroblast growth factor 23 O-glycosylation by GalNAc-T3.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete cached original Methods/Results and discussion read, covering human
      soluble-enzyme assays, CHO-cell experiments, AFM/SAXS and the secretion/stability comparison. The
      complex crystal structures use zebra finch GALNT3, not human GALNT3; human crystallization attempts
      failed. Human soluble92–633 and finch91–631 constructs are engineered and not the natural short
      isoform. The two-hour pulse experiment did not show marked increased secretion; the later difference
      was mainly attributed to stability after secretion. No independent source-image or raw-dataset analysis
      is claimed.
- id: PMID:8663203
  title: cDNA cloning and expression of a novel human UDP-N-acetyl-alpha-D-galactosamine. Polypeptide
    N-acetylgalactosaminyltransferase, GalNAc-t3.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native cache is abstract-only; authentic author-indexed original Methods 532–670, Results
      825–940 and Table I 1164–1205 were read externally. An engineered soluble human enzyme lacking its
      membrane anchor was expressed in Sf9 cells; culture supernatants were tested by radiolabeled donor
      incorporation into synthetic acceptor peptides with controls. No physiological HIV-infection role
      or natural-short-isoform activity follows from these assays. Source figure images were not independently
      inspected.
- id: PMID:9295285
  title: Substrate specificities of three members of the human UDP-N-acetyl-alpha-D-galactosamine:Polypeptide
    N-acetylgalactosaminyltransferase family, GalNAc-T1, -T2, and -T3.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native cache is abstract-only. Selected Methods and Results of the author-uploaded
      original were read at https://www.researchgate.net/publication/232284848_Substrate_Specificities_of_Three_Members_of_the_Human_UDP-N-Acetyl-_-D-galactosaminePolypeptide_N-Acetylgalactosaminyltransferase_Family_GalNAc-T1_-T2_and_-T3
      (enzyme preparation, peptide assay and metal-ion replacement sections). Purified soluble
      human enzymes support UDP-GalNAc transfer and manganese-dependent activity. Calcium/magnesium
      replacement at 5, 10 or 20 mM produced no detectable activity, reported as data not
