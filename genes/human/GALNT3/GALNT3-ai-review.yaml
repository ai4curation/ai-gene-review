core_functions:
- description: Golgi-resident polypeptide N-acetylgalactosaminyltransferase that initiates mucin-type O-glycosylation;
    its non-redundant physiological role is O-glycosylation of FGF23 at Thr178 in the proprotein convertase site,
    which protects FGF23 from furin cleavage and permits secretion of intact hormone.
  molecular_function:
    id: GO:0004653
    label: polypeptide N-acetylgalactosaminyltransferase activity
  directly_involved_in:
  - id: GO:0016266
    label: protein O-linked glycosylation via N-acetylgalactosamine
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
