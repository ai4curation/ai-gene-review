suggested_questions:
- question: Beyond FGF23, which GalNAc-T3-specific O-glycosites (non-redundant with other GALNTs) contribute to
    the phenotype of GALNT3 deficiency, e.g. in skin or testis where GALNT3 is highly expressed?
- question: Is the calcium ion binding IDA from PMID:9295285 supported by data in the full text, given that Mn2+
    is the characterized cofactor?
suggested_experiments:
- description: Quantitative O-glycoproteomics (e.g. SimpleCell) of GALNT3-knockout versus wild-type osteocyte-like
    cells to define the full set of GalNAc-T3-dependent sites, including FGF23 Thr178.
  experiment_type: glycoproteomics
