suggested_questions:
- question: Does GALNT3 bind calcium under any directly measured condition, even though calcium did not
    replace manganese in the reported Muc2 turnover assay?
- question: Which original GALNT3 ocular-localization panel supports the perinuclear annotation from PMID:12506059?
- question: What cellular function, stability and localization does the natural 192-residue GALNT3 product
    have?
- question: Which GALNT3-dependent sites beyond FGF23 account for tissue-specific phenotypes, and how
    do glycosylation, proteolysis and extracellular hormone stability contribute separately?
suggested_experiments:
- description: Compare direct calcium binding with manganese-dependent turnover using purified human canonical
    GALNT3 under matched conditions; distinguish binding from catalytic metal substitution.
  experiment_type: biochemistry
