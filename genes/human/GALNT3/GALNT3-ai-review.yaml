- id: Reactome:R-HSA-5096537
  title: Defective GALNT3 does not transfer GalNAc to mucins
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Immutable summary and successful official event/catalyst/member records read. This is
      a FailedReaction using Q14435 variants C574G/Q592*/R162*/T272K, with normalReaction 913675. Variant
      failure must not be cited as positive wild-type catalysis. Independent normal human enzyme evidence
      supports the gene-level function and location.
- id: Reactome:R-HSA-8851619
  title: GALNT3 transfers GalNAc to FGF23
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Immutable summary and official direct participant chain read: catalyst 8851625 to entity
      913620 to human Q14435, at Golgi membrane; FGF23 and nucleotide-sugar reactants are lumenal. Supports
      the curated target reaction, independently corroborated by human experiments. It is a model record,
      not another assay.'
- id: Reactome:R-HSA-913675
  title: GALNTs transfer GalNAc to Mucins to form Tn antigens
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Immutable summary and official catalyst/set/member chain read: catalyst 913697 to set
      913644, which explicitly lists GALNT3 entity 913620 as hasMember. This is actual target membership,
      not merely a candidate inferred from a family label. It does not assert identical site preferences
      for every listed transferase.'
- id: Reactome:R-HSA-913709
  title: O-linked glycosylation of mucins
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Immutable summary and official hasEvent chain read. The mucin O-glycosylation pathway
      includes normal reaction 913675 and its explicit human GALNT3 catalyst member. This supports direct
      participation in O-GalNAc biosynthesis; no additional process annotation is proposed.
- id: PMID:9394011
  title: Localization of three human polypeptide GalNAc-transferases in HeLa cells suggests initiation
    of O-linked glycosylation throughout the Golgi apparatus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic complete abstract verified and read; direct publisher access was restricted
      and the accessible publisher page remained abstract-level. It explicitly reports endogenous and
      tagged human GALNT1/2/3 localization in HeLa cells by fractionation, immunofluorescence and immunoelectron
      microscopy. GALNT3 preferential medial-stack localization is reported, not exclusivity. Individual
      original images and full Methods were not inspected.
- id: Reactome:R-HSA-5083625
  title: Defective GALNT3 causes HFTC
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Successful official ContentService disease-pathway record read privately; it contains
      the failed GALNT3 reaction 5096537. The official disease-pathway summary is now also present in
      the native cache, with the same assessed title. Its disease hierarchy is corroborating provenance,
