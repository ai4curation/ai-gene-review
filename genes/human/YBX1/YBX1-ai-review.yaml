id: P67809
gene_symbol: YBX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: YBX1 is a broadly expressed cold-shock-domain DNA/RNA-binding protein that shuttles
  between cytoplasm and nucleus, assembles in cytoplasmic ribonucleoprotein granules, stabilizes
  selected mRNAs, recognizes C5-methylcytosine-containing RNAs, and helps sort miRNAs and other
  small noncoding RNAs into extracellular vesicles. It also binds Y-box and other single-stranded or
  structured DNA elements to modulate transcription in specific promoter contexts and can be
  non-classically secreted by inflammatory cells as a peripheral extracellular signaling pool.
