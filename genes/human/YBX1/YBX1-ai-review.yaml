- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:12604611
  qualifier: located_in
  review:
    summary: Keep nuclear YBX1 localization.
    action: ACCEPT
    reason: PMID:12604611 supports the YBX1 nucleus row; human YBX1 shuttles between a cytoplasmic
      pool and nuclear pools reached through regulated relocalization.
    supported_by:
    - reference_id: PMID:12604611
      supporting_text: We show that the subcellular YB-1 localization is dependent on the cellular
        SRp30c content. In proliferating cells, YB-1 localizes to the cytoplasm, whereas FLAG-SRp30c
        protein is detected in the nucleus. After overexpression of YB-1 and FLAG-SRp30c, both
        proteins are co-localized in the nucleus, and this requires the N-terminal region of YB-1.
    - reference_id: PMID:14718551
      supporting_text: immunofluorescence studies have shown that YB-1 re-localizes from the
        cytoplasm to nuclear areas containing either Ku80 or MSH2 proteins in human 293 embryonic
        kidney cells.
