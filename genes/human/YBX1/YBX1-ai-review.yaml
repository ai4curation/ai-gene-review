suggested_questions:
- question: Which YBX1 RNA targets are selected through direct m5C recognition rather than through
    the basic C-terminal tail or other RNP partners?
- question: How are the cytosolic mRNA-stabilization, stress-granule and exosome-sorting pools of
    YBX1 partitioned under stress and inflammatory stimuli?
suggested_experiments:
- description: Map YBX1-bound methylated RNAs in cytosol and purified exosomes after NSUN2
    perturbation, using W65 mutant rescue to separate direct m5C reading from indirect RNP effects.
