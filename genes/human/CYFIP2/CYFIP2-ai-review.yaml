id: Q96F07
gene_symbol: CYFIP2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYFIP2 (PIR121) is a cytoplasmic component of the WAVE regulatory complex
  that couples Rac signaling to actin-dependent cellular organization. It associates
  with Rac1 and ABI/WAVE proteins, balances WAVE restraint and activation, and contributes
  to cell shape, neuronal projections and synaptic organization. CYFIP2 also forms
  RNA-sensitive complexes with FMRP. Soluble and particulate cytoplasmic pools coexist
  with synaptic and membrane-associated pools, and nuclear accumulation increases
  when nuclear export is inhibited. Human cells show context-dependent effects on
  fibronectin adhesion and apoptosis. Disease-associated variants disturb this regulatory
  balance and can also destabilize CYFIP2. The two splice products contain 1278 and
  1253 residues; the shorter product lacks an internal 25-residue segment.
alternative_products:
- name: '1'
  id: Q96F07-1
  description: Displayed 1278-residue product. Its official sequence is independently
    reconstructed; equal function with the shorter product has not been established.
- name: '2'
  id: Q96F07-2
  sequence_note: VSP_052349
  description: 1253-residue product lacking displayed-product residues 558–582 (VSP_052349).
    The deposited 2001 human clone AF160973.1 translates exactly to this product.
    The 2017 human construct has matching length/phosphosite numbering, which is strong
    correspondence rather than full clone-sequence proof.
