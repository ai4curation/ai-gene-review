core_functions:
- description: CYFIP2 is a Rac-binding regulatory component of the SCAR/WAVE complex
    that balances WAVE restraint and activation, connecting small-GTPase signaling
    to regulated actin assembly and cell morphogenesis. This unit also contributes
    to neuronal projection and synaptic organization, with soluble and particulate
    cytoplasmic pools. Mouse CYFIP2-R87C rescue increases lamellipodia formation under
    reduced Rac; human patient fibroblasts show disturbed actin remodeling. These
    results support regulated WRC output without implying that all variants have the
    same effect. WAVE and ARP2/3 execute downstream actin nucleation. Purified CYFIP1
    studies provide family context; activation need not entail complex disassembly.
  molecular_function:
    id: GO:0031267
    label: small GTPase binding
  directly_involved_in:
  - id: GO:0030833
    label: regulation of actin filament polymerization
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0045202
    label: synapse
  in_complex:
    id: GO:0031209
    label: SCAR complex
