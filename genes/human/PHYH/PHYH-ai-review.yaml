id: O14832
gene_symbol: PHYH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PHYH is human phytanoyl-CoA 2-hydroxylase (phytanoyl-CoA dioxygenase;
  EC 1.14.11.18), a peroxisomal matrix enzyme of the Fe(II)/2-oxoglutarate-dependent
  dioxygenase superfamily. It is synthesised with a cleavable N-terminal PTS2
  targeting signal and imported into the peroxisome by the PEX7 receptor. PHYH
  catalyses the first and committed step of the peroxisomal alpha-oxidation of
  3-methyl-branched fatty acids: the 2-hydroxylation of phytanoyl-CoA using
  molecular oxygen and 2-oxoglutarate as co-substrate, yielding
  2-hydroxyphytanoyl-CoA together with succinate and CO2. Catalysis depends on an
  active-site mononuclear iron centre and is stimulated by ascorbate. The enzyme
  acts not only on phytanoyl-CoA but on a range of other mono-branched
  3-methylacyl-CoA and straight-chain acyl-CoA esters. Because branched-chain fatty
  acids such as phytanic acid carry a 3-methyl group that blocks classical
  beta-oxidation, this alpha-oxidation step is essential for their degradation.
  Loss-of-function mutations abolish activity and cause the autosomal recessive
  peroxisomal disorder Refsum disease, in which phytanic acid accumulates in blood
  and tissues, producing retinitis pigmentosa, peripheral neuropathy, cerebellar
  ataxia and ichthyosis. The fold and active site are defined by a crystal
  structure, and many disease variants map to the iron- and 2-oxoglutarate-binding
  residues.
