    supporting_text: "phytanoyl-CoA + 2-oxoglutarate + O2 = 2-hydroxyphytanoyl-CoA"
  - reference_id: file:human/PHYH/PHYH-uniprot.txt
    supporting_text: "SUBCELLULAR LOCATION: Peroxisome"
