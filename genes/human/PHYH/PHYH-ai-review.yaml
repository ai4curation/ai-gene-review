      peroxisomal evidence; treated as over-annotation from a high-throughput
      proteomic survey.
core_functions:
- description: >-
    PHYH catalyses the 2-hydroxylation of phytanoyl-CoA and other 3-methyl-branched
    acyl-CoA esters, using molecular oxygen and 2-oxoglutarate as co-substrate and a
    mononuclear Fe(II) centre, to give the 2-hydroxyacyl-CoA plus succinate and CO2.
  molecular_function:
    id: GO:0048244
    label: phytanoyl-CoA dioxygenase activity
  directly_involved_in:
  - id: GO:0001561
    label: fatty acid alpha-oxidation
  locations:
