    and blood-cerebral-spinal fluid barrier by in vivo biotinylation.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Found rat Mrp5 NOT on the microvessel luminal surface but in ependymal
      cells; supports plasma-membrane residence with context-dependent polarity.
- id: PMID:24836561
  title: Control of metazoan heme homeostasis by a conserved multidrug resistance
    protein.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Establishes the conserved heme-export role of MRP-5/ABCC5 and its
      plasma-membrane, endosomal and Golgi/secretory-pathway localization.
- id: PMID:25344911
  title: Methylation of miR-129-5p CpG island modulates multi-drug resistance in gastric
