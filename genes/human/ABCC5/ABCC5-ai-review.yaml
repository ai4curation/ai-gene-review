id: O15440
gene_symbol: ABCC5
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ABCC5 (MRP5) is a plasma-membrane ATP-binding cassette (ABC) efflux transporter of the
  ABCC/MRP subfamily. Using two nucleotide-binding domains that hydrolyse ATP, it actively
  extrudes a broad range of small organic anions from the cytosol against a concentration
  gradient. Characterized substrates include the cyclic nucleotides cGMP and cAMP, nucleotide
  and nucleoside-monophosphate drug analogs (thiopurine monophosphates, the acyclic phosphonate
  PMEA), glutathione and glutathione conjugates, and folates and antifolates (methotrexate). It
  also exports cytosolic heme into the lumen of the secretory pathway, a conserved role important
  for systemic heme homeostasis and development.
  The protein is multi-pass and localizes mainly to the basolateral plasma membrane in most cell
  types, to the apical (luminal) membrane of brain-capillary endothelial cells at the blood-brain
  barrier, and additionally to endosomal and Golgi membranes. It is ubiquitously expressed with
  especially high levels in brain and muscle.
