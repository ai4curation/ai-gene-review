core_functions:
- description: GTPase subunit of the mitochondrial GTPBP3-MTO1 complex; GTP hydrolysis by GTPBP3
    is required for the complex to synthesize 5-taurinomethyluridine at the U34 wobble position
    of mitochondrial tRNAs, using 5,10-methylene-THF and taurine.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  contributes_to_molecular_function:
    id: GO:0160236
    label: tRNA 5-taurinomethyluridine synthase activity
  directly_involved_in:
  - id: GO:0070899
    label: mitochondrial tRNA wobble uridine modification
  locations:
  - id: GO:0005739
    label: mitochondrion
  in_complex:
    id: GO:7770010
    label: GTPBP3-MTO1 complex
  supported_by:
  - reference_id: PMID:33619562
    supporting_text: Here, we identified the mature form of hGTPBP3 and showed that hGTPBP3
      is an active GTPase in vitro that is critical for tRNA modification in vivo
  - reference_id: PMID:29390138
    supporting_text: we successfully reconstituted τm5U34 formation in mt-tRNA in vitro in a
      system consisting of GTPBP3 and MTO1 in the presence of taurine, the methylene-THF, guanosine
      triphosphate (GTP) and other co-factors
  - reference_id: PMID:29390138
    supporting_text: we clearly showed that τm5U34 was absent from five mt-tRNAs in GTPBP3 KO
      cells
proposed_new_terms: []
suggested_questions:
- question: How is GTP hydrolysis by GTPBP3 coupled to methylene transfer by MTO1, given that
    human GTPBP3 hydrolyses GTP far more slowly than bacterial MnmE and lacks potassium-stimulated
    G-domain activation?
- question: Does the cytoplasmic GTPBP3 splice isoform (isoform 4) have any tRNA-modification
    or other function outside mitochondria?
suggested_experiments:
- description: Efficient in vitro reconstitution of taum5U34 with purified mature GTPBP3 and
    MTO1 and individual mt-tRNA substrates, comparing GTPase-dead GTPBP3 mutants, to define
    the stoichiometric role of GTP hydrolysis in the reaction.
- description: Isoform-specific knockout or knockdown of the cytoplasmic GTPBP3 isoform followed
    by tRNA modification mapping (LC-MS) of cytosolic tRNAs and proteomics.
