existing_annotations:
- term:
    id: GO:0002098
    label: tRNA wobble uridine modification
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000182687
  - SGD:S000004625
  - UniProtKB:P25522
  - UniProtKB:Q969Y2
  review:
    summary: PAINT inference that GTPBP3 participates in wobble uridine (U34) modification,
      inherited from the MnmE/MSS1 clade. Human GTPBP3 is required, together with MTO1, for
      5-taurinomethyluridine (taum5U) formation at U34 of five mitochondrial tRNAs.
    action: ACCEPT
    reason: Correct and phylogenetically sound. The more specific mitochondrial child term GO:0070899
      is separately annotated by IMP, so this IBA is consistent with the experimental picture;
      the IBA parent is retained as is.
    supported_by:
    - reference_id: PMID:29390138
      supporting_text: we clearly showed that τm5U34 was absent from five mt-tRNAs in GTPBP3
        KO cells
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004520
  review:
    summary: InterPro-based mapping of GTPase activity from the TrmE/MnmE G domain.
    action: ACCEPT
    reason: Human GTPBP3 hydrolyses GTP in vitro (Km 9.5 uM; kcat 1.49 min-1 for the mature
      enzyme), so the domain-based inference is correct.
    supported_by:
    - reference_id: PMID:33619562
      supporting_text: Here, we identified the mature form of hGTPBP3 and showed that hGTPBP3
        is an active GTPase in vitro that is critical for tRNA modification in vivo
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IMP
  original_reference_id: PMID:29390138
  qualifier: enables
  review:
    summary: Asano et al. reconstituted taum5U34 formation in vitro with the GTPBP3-MTO1 complex
      in a reaction requiring GTP, and GTPBP3 knockout abolished taum5U in five mt-tRNAs.
    action: ACCEPT
    reason: GTPase activity of GTPBP3 is directly shown elsewhere (PMID:33619562, PMID:18852288)
      and the GTP requirement of the reconstituted reaction is consistent with it. Accepted
      as a core molecular function of the protein.
    supported_by:
    - reference_id: PMID:29390138
      supporting_text: we successfully reconstituted τm5U34 formation in mt-tRNA in vitro in
        a system consisting of GTPBP3 and MTO1 in the presence of taurine, the methylene-THF,
        guanosine triphosphate (GTP) and other co-factors
    - reference_id: PMID:18852288
      supporting_text: We show that the two most abundant GTPBP3 isoforms exhibit moderate affinity
        for guanine nucleotides like their bacterial homologue, MnmE, although they hydrolyze
        GTP at a 100-fold lower rate
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IMP
  original_reference_id: PMID:33619562
  qualifier: enables
  review:
    summary: Peng et al. purified the mature (MTS-cleaved) human GTPBP3 and showed it is an
      active GTPase; catalysis-defective G-domain mutants (N259A, E315A) failed to complement
      yeast mss1 deletion.
    action: ACCEPT
    reason: Direct biochemical demonstration of GTP hydrolysis by the human protein with kinetic
      parameters, plus mutational evidence that GTP hydrolysis is required for tRNA modification
      in vivo. Core function.
    supported_by:
    - reference_id: PMID:33619562
      supporting_text: As expected, catalysis-defective N259A and E315A mutants failed to support
        yeast growth in YPG medium (Figure 4C), suggesting a crucial role of GTP hydrolysis
        in tRNA modification in vivo
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:P17858
  review:
    summary: Generic protein binding from high-throughput yeast two-hybrid interactome screens
      (HuRI and predecessors; a neurodegeneration interactome). The reported partners (e.g.
      TARDBP, PARP11, DDIT4L, RALY, zinc-finger proteins) are not mitochondrial tRNA-modification
      partners, and MTO1, the physiological partner, is captured by the GTPBP3-MTO1 complex
      annotation.
    action: REMOVE
    reason: protein binding (GO:0005515) is uninformative about GTPBP3 function, and these binary-screen
      interactions with mostly nuclear/cytosolic proteins have no established functional consequence
      for the mitochondrial enzyme. Removal does not imply the interactions are false. The informative
      interaction (with MTO1) is already represented by GO:7770010 GTPBP3-MTO1 complex.
