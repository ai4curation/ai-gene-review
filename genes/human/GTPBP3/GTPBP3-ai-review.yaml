id: Q969Y2
gene_symbol: GTPBP3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GTPBP3 (GTP-binding protein 3, mitochondrial) is the human ortholog of bacterial
  MnmE and yeast MSS1, a TrmE-family TRAFAC GTPase with an N-terminal folate-binding domain,
  a helical domain and a G domain. After import into mitochondria (removal of an N-terminal
  targeting sequence) it forms a complex with the FAD-dependent enzyme MTO1 (the MnmG homolog).
  The GTPBP3-MTO1 complex installs 5-taurinomethyluridine (taum5U) at the wobble position U34
  of five mitochondrial tRNAs (Leu(UUR), Trp, Lys, Glu, Gln), using 5,10-methylene-tetrahydrofolate
  and taurine as substrates and requiring GTP hydrolysis by GTPBP3. This modification supports
  accurate and efficient decoding of NNA/NNG codons; loss of GTPBP3 abolishes taum5U34, impairs
  mitochondrial translation and respiratory complexes I and IV, and biallelic GTPBP3 variants
  cause combined oxidative phosphorylation deficiency 23 (hypertrophic cardiomyopathy, lactic
  acidosis, encephalopathy). A minor splice isoform lacking the targeting sequence resides in
  the cytoplasm and has no known function.
