- id: PMID:10610180
  title: The pallid gene encodes a novel, syntaxin 13-interacting protein involved in platelet storage
    pool deficiency.
  findings:
  - statement: Pallid mouse phenotypes include platelet storage-pool deficiency, pigment dilution and
      abnormal otolith formation; pallidin interacts with syntaxin 13.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete canonical normal abstract read. It reports two-hybrid and co-immunoprecipitation
      support, but the full article and all species-specific constructs were not inspected.
- id: PMID:12019270
  title: BLOC-1, a novel complex containing the pallidin and muted proteins involved in the biogenesis
    of melanosomes and platelet-dense granules.
  findings:
  - statement: Human pallidin has soluble and peripheral membrane pools, self-associates and occurs in
      BLOC-1; pallidin-containing cytosol associates with F-actin.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Canonical normal cache is abstract-only. Separately indexed original-paper Methods/Results/Discussion
      passages were read, including human constructs and F-actin sedimentation. The paper explicitly leaves
      direct versus mediated actin binding unresolved. No full figure/supplement claim.
- id: PMID:12191018
  title: Pallidin is a component of a multi-protein complex involved in the biogenesis of lysosome-related
    organelles.
  findings:
  - statement: Human pallidin is a component of a heterooligomer containing Muted; muted mouse cells have
      reduced pallidin.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete canonical abstract read. Exact pair-level assays and full paper were not independently
      inspected.
- id: PMID:15102850
  title: Identification of snapin and three novel proteins (BLOS1, BLOS2, and BLOS3/reduced pigmentation)
    as subunits of biogenesis of lysosome-related organelles complex-1 (BLOC-1).
  findings:
  - statement: Endogenous complex biochemistry and interaction analysis identify the eight-subunit BLOC-1
      assembly.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete canonical abstract read; no independent reading of every two-hybrid pair matrix.
- id: PMID:16189514
  title: Towards a proteome-scale map of the human protein-protein interaction network.
  findings:
  - statement: A human interaction map supplies curated pallidin partner and self-interaction records.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Canonical abstract and assay scope read; individual supplementary interaction rows were
      not independently inspected.
- id: PMID:17182842
  title: BLOC-1 is required for cargo-specific sorting from vacuolar early endosomes toward lysosome-related
    organelles.
  findings:
  - statement: Human PaHA restores pigmentation and Tyrp1 cargo routing in pallid mouse melanocytes.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Canonical cache remains abstract-only. Selected authenticated Seed55 HTML Methods/Results/Discussion
      were read separately, including pallid rescue and Tyrp1 routing; no complete figures or supplementary
      images were inspected. The 2017 correction (PMID:28137951) invalidates the original transferrin-FITC
      control and reports a mild early recycling defect with corrected reagent, while retaining the central
      cargo conclusion. Whole-melanosome movement and pigment-cell differentiation are not resolved by
      the inspected rescue alone.
- id: PMID:19546860
  title: 'The dysbindin-containing complex (BLOC-1) in brain: developmental regulation, interaction with
    SNARE proteins and role in neurite outgrowth.'
  findings:
  - statement: Native brain BLOC-1 associates selectively with SNARE proteins; pallid mouse primary neurons
      have modest neurite-extension defects.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Canonical full text: selected complete relevant Methods, Results and Discussion read.
      Native-complex anti-pallidin detection is distinguished from isolated pallidin binding; no whole-paper
      image coverage claimed.'
- id: PMID:21998198
  title: The schizophrenia susceptibility factor dysbindin and its associated complex sort cargoes from
    cell bodies to the synapse.
  findings:
  - statement: Pallidin-containing BLOC-1 participates in neuronal cargo sorting and AP-3-associated complexes.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Canonical full text: selected Results and Methods read, including actual pallid mouse
      experiments and human SH-SY5Y complex assays. Other experiments use muted, dysbindin or AP-3 mutants.
      Intracellular PC12 microvesicle preparations are not extracellular microvesicles.'
- id: PMID:22203680
  title: Assembly and architecture of biogenesis of lysosome-related organelles complex-1 (BLOC-1).
  findings:
  - statement: Human pallidin, Cappuccino and BLOS1 form a stable subassembly within the reconstituted
      BLOC-1 octamer.
