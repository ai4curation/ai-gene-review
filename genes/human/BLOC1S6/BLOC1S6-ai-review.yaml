core_functions:
- description: Pallidin contributes a structural adaptor within BLOC-1, forming a pallidin–Cappuccino–BLOS1
    subassembly that supports sorting of endosomal membrane cargo toward melanosomes and other lysosome-related
    organelles. Human pallidin complementation restores cargo sorting in pallid melanocytes; this assembly-mediated
    role is distinct from an autonomous transporter or motor.
