id: Q9UL45
gene_symbol: BLOC1S6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BLOC1S6, also called pallidin, is a small coiled-coil protein in the eight-subunit BLOC-1
  complex. It forms a stable assembly with BLOS1 and Cappuccino and links this machinery to membrane-trafficking
  proteins, including syntaxins. Pallidin occurs in cytosolic and peripheral membrane-associated pools.
  BLOC-1 supports sorting of endosomal cargo toward melanosomes and other lysosome-related organelles,
  including platelet dense granules. Human pallidin restores pigmentation and cargo sorting in pallid
  mouse melanocytes. Pallidin-containing complexes also support selected neuronal cargo-trafficking and
  neurite-development functions. Biallelic BLOC1S6 defects are associated with Hermansky-Pudlak syndrome
  type 9; the cellular and clinical manifestations vary with the experimental and patient context.
