    supporting_text: stable subcomplexes were defined, pallidin-Cappuccino-BLOS1
  - reference_id: UniProt:Q9UL45
  knowledge_gaps:
  - gap_statement: How pallidin-specific interfaces couple BLOC-1 assembly to SNARE-associated cargo sorting
      remains incompletely resolved.
    boundary: Defined human pallidin–BLOS1 and pallidin–Cappuccino interfaces and functional rescue support
      the assembly role. Whole-complex SNARE/AP-3 association and F-actin sedimentation do not map every
      contact to isolated pallidin or establish actin remodelling chemistry.
    gap_kind:
    - BIOLOGY
    status: OPEN
    resolution: Separate interface mutations that disrupt BLOC-1 stability from those that selectively
      alter cargo sorting or partner recognition.
suggested_questions:
- question: Which direct pallidin interfaces connect the BLOC-1 scaffold to syntaxins, AP-3 and actin-associated
    machinery without merely destabilizing the octamer?
- question: Which mouse-derived developmental, spatial and metabolic annotations reflect a direct pallidin
    activity, and which are downstream consequences of organelle dysfunction?
