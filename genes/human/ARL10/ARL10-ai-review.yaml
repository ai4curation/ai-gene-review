knowledge_gaps:
- gap_statement: ARL10 binds GTP and sits on mitochondria and peroxisomes, but whether it hydrolyses GTP,
    what activates it, and which effectors it engages are unknown; no biological process has been assigned.
  boundary: 'Established: a signal-anchor-like N-terminal transmembrane segment required for mitochondrial
    targeting, peroxisomal presence, GDP/GTP binding in cells, and a proximity network including mitochondrial-dynamics
    proteins and mTORC2. Not established: GTPase activity (it lacks the catalytic glutamine), effectors,
    or a loss-of-function phenotype.'
