description: ARL10 is an uncharacterized ARF-like small GTPase of 244 residues. Instead of the usual short
  ARF N-terminal extension it has a 76-residue N-terminal region containing a transmembrane segment, which
  targets it to mitochondria, consistent with a signal-anchored outer membrane protein; it is also found
  on peroxisomes. It binds GDP and GTP in cells, but lacks the catalytic glutamine used by ARF-family
  GTPases for hydrolysis. Proximity labelling places it near proteins involved in mitochondrial dynamics
  and mTORC2. Its biological function is unknown.
