  significance: ARL10 is one of several ARF-family members with no assigned function; its organelle anchoring
    and mTORC2 proximity suggest a role at mitochondria-peroxisome contacts.
  resolution: Measure intrinsic and GAP-stimulated GTP hydrolysis of purified ARL10, and test mitochondrial
