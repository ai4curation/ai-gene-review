taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EBF3 is a sequence-specific nuclear transcription factor of the early B-cell factor family.
  It binds cis-regulatory DNA and regulates RNA polymerase II-dependent gene expression through a DNA-binding
  region and dimerization domains. EBF3 associates with chromatin and can activate target promoters, with
  regulatory effects that depend on the target and cellular context. Disruption of its transcriptional
  function is associated with a neurodevelopmental disorder involving hypotonia, ataxia and developmental
  delay.
