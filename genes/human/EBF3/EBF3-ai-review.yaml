- term:
    id: GO:0045893
    label: positive regulation of DNA-templated transcription
  evidence_type: IMP
  original_reference_id: PMID:28017370
  qualifier: involved_in
  review:
    summary: Refine EBF3-dependent transcriptional activation to positive regulation of Pol II transcription.
    action: MODIFY
    reason: PMID:28017370 expressed human EBF3 in μM2.21 plasmacytoma cells and measured surface IgM as
      the Cd79a-linked transcriptional readout. Wild-type protein activated the response at low and intermediate
      expression, while high expression reduced it; R163P lacked activity and P177L/K193N retained activity
      at high dosage. This is direct functional support for positive regulation of a Pol II-transcribed
      target in the tested setting, rather than purified DNA-affinity measurement or proof of a native
      human neuronal program. GO:0045944 preserves this positive effect with the appropriate polymerase
      specificity and is a descendant of GO:0045893.
    supported_by:
    - reference_id: PMID:28017370
    proposed_replacement_terms:
    - id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
