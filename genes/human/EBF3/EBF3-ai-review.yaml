- id: PMID:28017370
  title: De Novo Mutations in EBF3 Cause a Neurodevelopmental Syndrome.
  findings:
  - statement: Human EBF3 activated a Cd79a-linked surface-IgM readout at low/intermediate dosage; high
      WT dosage reduced the response, and tested mutants retained WT association in tagged co-IP.
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Bibliographic identity verified and genuine PMC original recovered separately from the
      abstract-only normal cache. Selected operative Results and Figure 3/4 captions contain cloning,
      dose-controlled flow-cytometry and co-IP methods. Human EBF3 transactivation is dose dependent;
      all tested mutant proteins still coimmunoprecipitate with WT. The measured surface-IgM endpoint
      is linked to Cd79a activation, not purified DNA affinity. No figure pixels or supplementary original
      were independently assessed.
  full_text_unavailable: false
- id: PMID:28017372
  title: A Syndromic Neurodevelopmental Disorder Caused by De Novo Variants in EBF3.
  findings:
  - statement: The deposited human Short-product templates supported a controlled HEK293 COE-site reporter
      assay; WT and variant constructs were separately evaluated by tagged fly complementation.
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Bibliographic identity verified and genuine PMC original recovered separately from the
      abstract-only normal cache. Selected Results and embedded assay captions were read. Untagged human
      EBF3 activated a synthetic COE-site reporter in HEK293 cells; separate HA-tagged constructs were
      tested in fly rescue. Both cited deposited template translations match Short551, without proving
      every experimental vial or equivalence to Long. No figure-pixel claim.
  full_text_unavailable: false
- id: PMID:28017373
  title: Mutations in EBF3 Disturb Transcriptional Profiles and Cause Intellectual Disability, Ataxia,
    and Facial Dysmorphism.
  findings:
  - statement: Human WT EBF3 was nuclear and chromatin associated in the tested cell systems, activated
      a CDKN1A reporter and showed cis-regulatory binding linked to transcriptional changes.
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Bibliographic identity verified; operative original main-text Methods/Results were independently
      read from the genuine HTML-derived cache. Supports human WT nuclear localization, tight chromatin
      association, CDKN1A reporter activation and SK-N-SH binding/transcription effects. Mutant localization,
      residual activity and coexpression effects vary. The independently obtained abstract-only cache
      variant is preserved privately; detailed supplementary Methods and figure pixels were not independently
      assessed.
  full_text_unavailable: false
- id: PMID:20592035
  title: Structural determination of functional domains in early B-cell factor (EBF) family of transcription
    factors reveals similarities to Rel DNA-binding proteins and a novel dimerization motif.
  findings:
  - statement: Human EBF3 TIG-HLH/HLHLH structures support a dimeric helical architecture, distinct from
      the EBF1 DNA-binding-domain structural experiments.
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Bibliographic identity verified and operative main-text Methods/domain Results independently
      read from the genuine XML-derived cache. Human EBF3 supplied the TIG-HLH/HLHLH fragments expressed
      in E. coli, whereas the DBD and isolated IPT/TIG constructs were EBF1. The EBF3 structures support
      dimerization architecture; the EBF1 zinc-bearing DBD is not a direct EBF3 metal-occupancy assay.
      Fragment evidence does not establish natural-product equivalence.
  full_text_unavailable: false
core_functions:
- description: EBF3 recognizes cis-regulatory DNA and regulates RNA polymerase II transcription in the
    nucleus. Human EBF3 activates COE-site and CDKN1A reporters, while chromatin association and genome-wide
    binding/transcription measurements link DNA recognition to gene regulation. Its EBF-family DNA-binding
    region and dimerization architecture support this integrated transcription-factor role; regulatory
    effects depend on target, dosage and cellular context.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
