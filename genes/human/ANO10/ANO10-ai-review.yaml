id: Q9NW15
gene_symbol: ANO10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANO10 (TMEM16K) is an integral membrane phospholipid scramblase that acts predominantly in
  the endoplasmic reticulum. It moves phospholipids between membrane leaflets, with activity modulated
  by calcium and membrane lipid composition. The protein also permits nonselective ion flux in reconstituted
  membranes, while surface localization and cellular currents vary with expression context. ANO10 supports
  endosomal trafficking through ER–endosome contacts, although the connection between lipid scrambling
  and sorting remains unresolved. Biallelic pathogenic variants cause autosomal recessive spinocerebellar
  ataxia.
