      N-terminal lipid overlay, membrane contacts, scrambling-domain chimeras and human disease variants;
      Discussion; exact plasmid, cell culture, BioID, protein purification, overlay and split-GFP Methods.
      Supplementary Table1 and image pixels not separately inspected. Methods explicitly identifies mouse
      TMEM16K cDNA, Genscript OMu10422D, pCDNA3.1-TMEM16K-FLAG. Mouse KO MEF phenotypes and constructs
      expressed in human/monkey cell hosts must remain distinct. Split-GFP/10-nm BioID establishes proximity/contact,
