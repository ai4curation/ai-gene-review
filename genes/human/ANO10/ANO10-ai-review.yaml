suggested_questions:
- question: How are ANO10 lipid scrambling and ion permeability coupled in native ER membranes, and which
    conditions explain its variable surface localization and cellular channel activity?
- question: Does ANO10 contribute a defined molecular step at ER–endosome contacts that directly explains
    its effects on endosomal sorting?
- question: Which expression backgrounds and current phases explain the reported effects of ANO10 on ANO1,
    and are they mediated directly or through calcium handling and membrane composition?
suggested_experiments:
- hypothesis: ANO10-associated cellular currents and ANO1 modulation depend on membrane targeting and
    other anoctamins.
  description: Compare defined human ANO10 constructs with matched surface/ER abundance in ANO6-present
    and ANO6-null cells, measuring quenching and time-resolved currents at controlled calcium. Combine
    ANO1 coexpression with rescue and purified-protein reconstitution to separate direct permeation from
    effects on another channel.
  experiment_type: Controlled electrophysiology and reconstitution
- hypothesis: ER lipid scrambling contributes to sorting independently of mere contact-site proximity.
  description: Compare wild-type and independently validated scrambling-deficient ANO10 at matched abundance
    and ER targeting, measuring lipid redistribution, split-GFP contact abundance and cargo sorting separately.
    Confirm the biochemical defect in purified protein before interpreting rescue failure.
  experiment_type: Separation-of-function rescue
