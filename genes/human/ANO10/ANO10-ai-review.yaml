- id: PMID:31477691
  title: The structural basis of lipid scrambling and inactivation in the endoplasmic reticulum scramblase
    TMEM16K.
  findings:
  - statement: Purified human TMEM16K directly scrambles lipids, with calcium modulation.
    supporting_text: Without Ca2+, the rate constant decreased ~4-fold, indicating that TMEM16K scramblase
      activity is Ca2+ regulated.
  - statement: Human localization supports predominant ER membrane residence.
    supporting_text: Together, these data are consistent with TMEM16K primarily residing in the ER membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached full text read for localization, scrambling and ion-flux Results; cell culture,
      electrophysiology, immunostaining, cloning, purification, scrambling and chloride-flux Methods.
      Earlier original PDF read independently corroborates these. Not all structural processing sections
      or supplementary images. Explicit human NM_018075, Q9NW15 Met1-Thr660 protein; insect and mammalian
      cells are expression hosts. Purified protein directly scrambles lipids, with calcium modulation
      and lipid-chain-length dependence. Chloride-release/KCl-gradient assay supports nonselective salt
      flux, not a selective cation-channel recording; calcium dependence of flux is minimal. Endogenous
      human U2OS staining and tagged construct/ER-marker colocalization support ER membrane.
  full_text_unavailable: false
