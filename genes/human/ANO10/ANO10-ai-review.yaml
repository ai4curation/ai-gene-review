- term:
    id: GO:0017128
    label: phospholipid scramblase activity
  evidence_type: IDA
  original_reference_id: PMID:31477691
  qualifier: enables
  review:
    summary: Purified human ANO10 directly scrambles membrane phospholipids.
    action: NEW
    reason: PMID:31477691 studies full-length human TMEM16K expressed in insect or mammalian hosts and
      reconstituted into lipid vesicles. Dithionite-accessibility assays demonstrate transbilayer phospholipid
      movement, modulated by calcium and lipid composition, with residual activity without added calcium.
      This is direct biochemical activity distinct from the seeded channel terms. Plasma-membrane scrambling
      negatives in engineered cellular assays do not contradict an ER-like reconstituted lipid activity.
    supported_by:
    - reference_id: PMID:31477691
      full_text_unavailable: false
      supporting_text: Thus, the slow rates of scrambling in 16:0–18:1 lipids reflect an intrinsic property
        of purified TMEM16K.
    - reference_id: PMID:39337485
      full_text_unavailable: false
      supporting_text: our results do not exclude PL scrambling by ANO4, -8, or -10 in intracellular membranous
        compartments.
