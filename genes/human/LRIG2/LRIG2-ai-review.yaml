knowledge_gaps:
- gap_statement: >-
    The endogenous receptor partners and direction of LRIG2-mediated signaling
    regulation in normal human tissues are unknown.
  boundary: >-
    Human glioblastoma-cell perturbations support EGFR and PDGFRB binding and positive
    pathway regulation, whereas the human developmental evidence establishes disease
    causality and neural localization without identifying a receptor mechanism.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving this gap is necessary to distinguish a general physiological receptor
    regulator from a signaling behavior created or amplified by glioblastoma context.
  resolution: >-
    Perturb endogenous LRIG2 in normal human neural and lower-urinary-tract models and
    quantify candidate-receptor binding, abundance, activation, and downstream signaling
    with receptor-specific rescue and epistasis.
  provenance:
  - reference_id: PMID:30015847
    supporting_text: >-
      our knowledge on the biological and molecular functions of mammalian LRIG2 in
      tumors is limited.
- gap_statement: >-
    The cellular mechanism that releases the soluble LRIG2 ectodomain is unknown.
  boundary: >-
    A tagged fragment of the expected ectodomain size was recovered from conditioned
    medium after full-length LRIG2 expression, but this does not distinguish proteolytic
    cleavage from vesicular or other release routes.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    The release route determines how extracellular LRIG2 is generated and regulated and
    whether its abundance can be manipulated independently of full-length LRIG2.
  resolution: >-
    Use endogenous dual-terminal tagging, pulse-chase analysis, extracellular-vesicle
    fractionation, unbiased terminomics, and perturbation of candidate release pathways
    to identify the released species and its route without presupposing a protease.
  provenance:
  - reference_id: PMID:25353163
    supporting_text: >-
      the mechanism underlying the release of the soluble LRIG2 ectodomain is not
      addressed and deserves further study.
- gap_statement: >-
    How LRIG2 loss causes urofacial syndrome type 2 at the molecular and circuit levels
    remains unresolved.
  boundary: >-
    Biallelic human LRIG2 variants establish disease causality, and LRIG2 is detected in
    developing bladder nerve fascicles, but neither observation identifies the relevant
    receptor partner, cell type, or signaling defect.
