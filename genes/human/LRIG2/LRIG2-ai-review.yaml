  review:
    summary: >-
      A broad PANTHER IBA assigns signaling receptor activity from a mixed LRR
      receptor-family node rather than from LRIG2-specific receptor evidence.
    action: REMOVE
    reason: >-
      Signaling receptor activity requires receiving and transmitting a signal. Human
      LRIG2 is instead experimentally supported as a single-pass modulator that binds
      EGFR and PDGFRB and alters their signaling. The IBA source set includes bona fide
      receptors TLR3, CD180, RTN4RL1, and RTN4RL2, so receptor activity must not be
      transferred across this broad family boundary to LRIG2. LRIG1/3 biology likewise
      does not establish LRIG2 as a receptor.
