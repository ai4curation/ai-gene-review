proposed_new_terms: []
suggested_questions:
- question: >-
    Which endogenous receptors does LRIG2 bind and regulate in normal human neural and
    lower-urinary-tract cells, and is the direction of regulation the same as in
    glioblastoma cells?
- question: >-
    By what route is the soluble LRIG2 ectodomain released, and what sequence or cellular
    determinants govern release without assuming LRIG1-like proteolysis?
- question: >-
    Which LRIG2-dependent receptor and circuit defects cause urofacial syndrome type 2,
    and do they involve Neogenin regulation in humans?
- question: >-
    Is the shorter predicted human LRIG2 alternative product expressed as a stable
    protein, and if so, what topology, localization, and function does it have without
    the canonical N-terminal signal peptide and initial LRR region?
suggested_experiments:
- hypothesis: >-
    Endogenous LRIG2 regulates a restricted receptor set in normal human neural and
    lower-urinary-tract cells, with effects that differ from glioblastoma signaling.
  description: >-
    Endogenously tag and acutely deplete LRIG2 in human autonomic-neuron and bladder
    organoid co-cultures, identify surface-proximal partners by quantitative proximity
    labeling, and test receptor abundance, phosphorylation, and downstream signaling
    after wild-type rescue. Include EGFR, PDGFRB, and Neogenin as prespecified candidates
    and LRIG1/3 perturbations as paralog controls.
  experiment_type: endogenous perturbation, proximity proteomics, and signaling analysis
- hypothesis: >-
    Soluble LRIG2 ectodomain is generated by a regulated release pathway and retains a
    receptor-binding activity distinct from extracellular vesicle-associated full-length
    protein.
  description: >-
    Introduce separate extracellular and cytoplasmic tags at the endogenous LRIG2 locus,
    perform pulse-chase sampling with soluble and extracellular-vesicle fractionation,
    map released termini by N-terminomics and C-terminomics, and perturb candidate
    protease and vesicle pathways before testing purified fractions for EGFR binding.
  experiment_type: endogenous tagging, secretion-route analysis, and terminomics
- hypothesis: >-
    Urofacial-syndrome LRIG2 loss disrupts a receptor-dependent developmental program in
    autonomic neurons that innervate the bladder.
  description: >-
    Generate patient-derived and isogenic-corrected induced pluripotent stem cell models,
    differentiate autonomic neurons, and co-culture them with bladder smooth-muscle
    organoids. Measure neurite targeting, synaptic connectivity, evoked muscle responses,
    and candidate-receptor signaling, with canonical LRIG2 rescue and pathway epistasis.
  experiment_type: disease modeling, genetic rescue, and neural circuit physiology
- hypothesis: >-
    The shorter predicted LRIG2 transcript does not produce a normally trafficked
    cell-surface receptor regulator because it lacks the canonical signal peptide and
    part of the LRR region.
  description: >-
    Establish transcript structure and translation by long-read RNA sequencing,
    ribosome profiling, and isoform-specific targeted proteomics in relevant human
    tissues; if protein is detected, compare its membrane topology, glycosylation,
    localization, and receptor binding with canonical LRIG2 using isoform-specific
    knockout and rescue.
  experiment_type: isoform-resolved expression and topology analysis
