references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PAN-GO uses curator-selected GO terms on PANTHER phylogenetic trees to make
      traceable IBA annotations from biological ancestors.
    supporting_text: >-
      The GO terms are manually selected by a curator and used to annotate ancestral
      genes in the phylogenetic tree using the evidence code IBA (Inferred from
      Biological Ancestor).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Live Gene Ontology reference page verified. This is the provenance method for
      LRIG2's three IBA rows; the individual PANTHER/WITH-FROM source sets were
      adjudicated in the annotation reviews rather than treated as LRIG2-specific
      experiments.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: >-
      This pipeline maps UniProtKB/Swiss-Prot Subcellular Location vocabulary terms
      to corresponding GO cellular-component terms.
    supporting_text: >-
      When a UniProtKB Subcellular Location term describes a concept that is within
      the scope of the Gene Ontology, a mapping is made to the corresponding GO term.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Live Gene Ontology reference page verified. This mapping method accounts for
      LRIG2's cytoplasm and plasma-membrane IEA rows; it is method provenance, not an
      independent experiment.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to
    orthologs using Ensembl Compara
  findings:
  - statement: >-
      Ensembl Compara transfers selected experimentally supported annotations between
      orthologs while retaining the source identifier in WITH/FROM.
    supporting_text: >-
      GO terms from a source species are projected onto one or more target species
      based on gene orthology obtained from Ensembl Compara.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Live Gene Ontology reference page verified. This is the method source for six
      LRIG2 IEA rows, all transferred from mouse Lrig2 rather than LRIG1 or LRIG3;
      species transfer remains explicit in their reviews.
