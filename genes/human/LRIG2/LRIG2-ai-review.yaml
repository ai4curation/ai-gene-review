id: O94898
gene_symbol: LRIG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRIG2 is an N-glycosylated type-I single-pass membrane protein whose extracellular
  region contains 15 leucine-rich repeats and three immunoglobulin-like domains.
  It acts as a context-dependent regulator of cell-surface receptors through its
  ectodomain rather than as a signaling receptor or enzyme itself. In human
  glioblastoma models, full-length LRIG2 binds EGFR and PDGFRB and increases their
  abundance and signaling, while a soluble LRIG2 ectodomain recovered from conditioned
  medium retains EGFR binding and growth-promoting activity. Biallelic loss of LRIG2
  causes urofacial syndrome type 2, and LRIG2 is present in developing human bladder
  nerve fascicles, linking it to neural development of the lower urinary tract. Mouse
  Lrig2 additionally supports auditory neuronal output and regulates Neogenin shedding
  during neuronal development; these mouse mechanisms have not been demonstrated for
  human LRIG2. Functional experiments have examined canonical full-length LRIG2 or an
  engineered ectodomain, whereas a shorter predicted human alternative product has not
  been functionally characterized.
