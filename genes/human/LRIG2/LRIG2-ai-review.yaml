- id: PMID:24086156
  title: In vivo analysis of Lrig genes reveals redundant and independent functions
    in the inner ear.
  findings:
  - statement: >-
      In mice, Lrig2 is broadly expressed in the developing inner ear and becomes
      enriched in neurons and sensory epithelia at later stages.
    supporting_text: Lrig2 levels are enhanced in neurons
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      Mouse Lrig2 loss preserves sound-detection sensitivity but attenuates the later
      auditory neuronal response.
    supporting_text: >-
      Specifically, although mutant animals can detect sounds with normal sensitivity,
      the subsequent neuronal response is attenuated, as evidenced by significantly
      decreased ABR amplitudes across multiple frequencies.
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  - statement: >-
      Mouse genetics distinguishes Lrig2 from Lrig1 and Lrig3 while revealing limited
      redundancy with Lrig1 in vestibular and cochlear-innervation phenotypes.
    supporting_text: emerging as the most functionally distinct family member.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC record and cached full text verified. This is direct mouse Lrig2
      genetics supporting same-ortholog auditory transfer, not direct human evidence;
      it also supplies an explicit warning against transferring LRIG1/LRIG3 mechanisms.
- id: PMID:25353163
  title: Soluble LRIG2 ectodomain is released from glioblastoma cells and promotes
    the proliferation and inhibits the apoptosis of glioblastoma cells in vitro and
    in vivo in a similar manner to the full-length LRIG2.
  findings:
  - statement: >-
      Soluble LRIG2 ectodomain is released from human glioblastoma cells, although the
      release mechanism was not established.
    supporting_text: that soluble LRIG2 ectodomain was capable of being released from glioblastoma
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      In engineered U87 and U251 glioblastoma cells, both full-length LRIG2 and its
      ectodomain physically interact with EGFR.
    supporting_text: >-
      Consistent with the immunofluorescence results, this analysis revealed that LRIG2
      physically interacted with EGFR (Figure 7B). Most strikingly, we found that the
      LRIG2 ectodomain was also capable of interacting physically with EGFR (Figure
      7B), which indicates that the full-length LRIG2 interacts with EGFR through the
      recognition of the ectodomain of LRIG2 and EGFR.
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: >-
      LRIG2 and its ectodomain increased EGFR abundance and activation and downstream
      PI3K/Akt signaling in the glioblastoma models.
    supporting_text: >-
      Remarkably, in the present study we for the first time demonstrated that
      full-length LRIG2 and LRIG2 ectodomain both could physically interact with EGFR,
      increase the level of EGFR and enhance the activation of EGFR and its downstream
      PI3K/Akt pathway, resulting in increment of pro-proliferative and anti-apoptotic
      proteins and attenuation of pro-apoptotic proteins.
    reference_section_type: DISCUSSION
