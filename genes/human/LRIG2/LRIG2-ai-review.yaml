core_functions:
- description: >-
    In mouse neurons, Lrig2 binds Neogenin and prevents premature ADAM17-mediated
    Neogenin ectodomain shedding. RGMa weakens the interaction to permit cleavage, and
    this control contributes to neurite-growth inhibition and cortical-neuron migration.
    The exact-ortholog transfer supports a conserved LRIG2 function, but direct human
    Neogenin binding, shedding control, and neuronal outputs remain untested.
