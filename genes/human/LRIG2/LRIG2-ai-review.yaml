- term:
    id: GO:0045742
    label: positive regulation of epidermal growth factor receptor signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:25353163
  qualifier: involved_in
  review:
    summary: >-
      Overexpression of full-length human LRIG2 or its ectodomain in U87 and U251
      glioblastoma cells increased EGFR abundance and phosphorylation and enhanced
      downstream PI3K/Akt signaling.
    action: NEW
    reason: >-
      Direct perturbation and pathway readouts support positive regulation of the
      EGFR signaling pathway in the tested glioblastoma models. This annotation does
      not establish the same regulatory direction in normal human cells and does not
      transfer the negative EGFR-regulatory mechanism of LRIG1.
    supported_by:
    - reference_id: PMID:25353163
      supporting_text: >-
        Remarkably, in the present study we for the first time demonstrated that
        full-length LRIG2 and LRIG2 ectodomain both could physically interact with EGFR,
        increase the level of EGFR and enhance the activation of EGFR and its downstream
        PI3K/Akt pathway, resulting in increment of pro-proliferative and anti-apoptotic
        proteins and attenuation of pro-apoptotic proteins.
