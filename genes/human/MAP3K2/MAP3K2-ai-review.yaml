core_functions:
- description: MEKK2 is a MAP kinase kinase kinase that binds MEK5 (MAP2K5) through PB1-PB1 heterodimerization and
    phosphorylates its activation loop (Ser311/Thr315), initiating the MEK5-ERK5 cascade; it also phosphorylates
    MKK6 and, in some cells (e.g. mast cells), MKK7, feeding p38 and JNK signalling.
  molecular_function:
    id: GO:0004709
    label: MAP kinase kinase kinase activity
  directly_involved_in:
  - id: GO:0070375
    label: ERK5 cascade
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:41318559
    supporting_text: we find that MEKK2 efficiently phosphorylates MEK5, but that its inactivation by D483N mutation
      results in loss of MEK5 phosphorylation
  - reference_id: PMID:41318559
    supporting_text: we find that MEKK2 efficiently phosphorylates MKK6, but that its inactivation by D483N mutation
      results in loss of MKK6 phosphorylation
  - reference_id: PMID:12912994
    supporting_text: Deletion or mutation of the MEKK2 PB1 domain abolishes MEKK2-MEK5 complexes, demonstrating
      that the PB1 domain interaction is required for MEKK2-MEK5 interactions
  - reference_id: PMID:12912994
    supporting_text: The free PB1 domain of MEKK2 or MEKK3 functions effectively to inhibit the ERK5 pathway but
      not the p38 or JNK pathways
  - reference_id: PMID:14515274
    supporting_text: these data define an activation module, MEKK2-MEK5-ERK5-MEF2C in the transcriptional activation
      of c-Jun in mast cells
  - reference_id: PMID:11274363
    supporting_text: MKK7 is activated in response to cross-linking of FcepsilonRI, and this activation is inhibited
      by MAP/ERK kinase (MEK) kinase 2 (MEKK2) gene disruption
suggested_questions:
- question: Under which physiological stimuli is MEKK2, rather than MEKK3, the dominant MAP3K for MEK5-ERK5 activation,
    given that kinase-inactive MEKK3 but not MEKK2 blocked EGF-induced ERK5 activation in Cos7/HEK293 cells whereas
    the reverse held in T cells?
- question: Is the MKK7-JNK branch a direct physiological output of MEKK2 only in specific cell types (mast cells),
    given that Mekk2-/- T cells show enhanced rather than reduced JNK activation?
- question: Does the PMID:19593445 citation for MAP3K2 "cellular response to mechanical stimulus" reflect an identifier
    error, and is there primary evidence for MEKK2 responding to mechanical stimuli?
suggested_experiments:
- description: Quantitative in vitro kinase assays of purified full-length MEKK2 and MEKK3 against MEK5, MKK6, MKK7,
    MKK4 and MEK1, with and without PB1 mutations, to define relative substrate preference.
- description: Endothelial and immune-cell MAP3K2/MAP3K3 single and double knockouts with phospho-MEK5/ERK5, p38
    and JNK read-outs to separate paralog-specific from redundant functions.
