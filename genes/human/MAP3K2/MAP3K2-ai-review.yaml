- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15778465
  qualifier: enables
  supporting_entities:
  - UniProtKB:P31947
  review:
    summary: Affinity-purification/mass-spectrometry interaction of MEKK2 with the 14-3-3 isoform SFN (14-3-3 sigma)
      (PMID:15778465).
    action: MODIFY
    reason: Bare protein binding is uninformative. The partner is a 14-3-3 protein; phospho-dependent 14-3-3 docking
      is a well-documented regulatory mode for MEKK2 and its paralog MEKK3 (14-3-3 restrains MEKK2 dimerization
      via phospho-Thr283; for MEKK3 via pThr294/pSer526), and 14-3-3 isoforms are recovered repeatedly with MEKK2
      across independent interactome studies. 14-3-3 protein binding (GO:0071889) captures the specific, recurrent
      interaction. This is a regulatory property, not a core function.
    proposed_replacement_terms:
    - id: GO:0071889
      label: 14-3-3 protein binding
    supported_by:
    - reference_id: file:human/MAP3K2/MAP3K2-deep-research-falcon.md
      supporting_text: Phosphorylated **Thr283** recruits 14-3-3 proteins. Binding limits MAP3K2 homodimerization
        and activation-loop phosphorylation.
    - reference_id: PMID:15778465
      supporting_text: The majority of identified proteins contained one or several phosphorylatable 14-3-3-binding
        sites indicating a potential direct interaction with 14-3-3 sigma.
