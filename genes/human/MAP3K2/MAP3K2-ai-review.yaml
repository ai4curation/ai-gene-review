gene_symbol: MAP3K2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MAP3K2 (MEKK2) is a STE11-family serine/threonine protein kinase of the MAP kinase kinase kinase tier.
  It has an N-terminal PB1 domain, a regulatory linker and a C-terminal kinase domain that is about 94% identical
  to that of its paralog MEKK3. MEKK2 phosphorylates and activates MAP kinase kinases on their activation loops.
  Its best-established substrate is MEK5 (MAP2K5): the MEKK2 and MEK5 PB1 domains heterodimerize, and MEKK2 then
  phosphorylates MEK5 on Ser311/Thr315 to drive the MEK5-ERK5 (BMK1) cascade. MEKK2 can also phosphorylate MKK6
  (p38 pathway) and, depending on cell context, MKK7 (JNK pathway) and MEK1. Activation involves dimerization through
  an alphaG-helix surface and trans-autophosphorylation of the activation loop. Activity and abundance are tuned
  by 14-3-3 binding, STK38 binding, SMYD3 methylation, and ubiquitination and degradation by CHIP (STUB1) and NEDD4L.
  MEKK2 is mainly cytosolic and can enter the nucleus after growth-factor stimulation. It relays signals from receptors
  including the mast-cell IgE receptor, T-cell receptor, EGF receptor, IL-17 receptor and hyperosmotic stress.'
