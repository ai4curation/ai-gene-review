suggested_questions:
- question: >-
    Do Q92633-1 and Q92633-2 differ in maturation, plasma-membrane delivery, LPA
    affinity, G-protein coupling, or tissue distribution?
- question: >-
    What are the relative Gi/Go, Gq/11, G12/13, and beta-arrestin coupling
    efficacies of endogenous human LPAR1 in physiologically relevant cell types?
- question: >-
    Do RAMP1-3 alter LPAR1 ligand pharmacology, surface residence, coupling bias,
    or desensitization in cells that naturally coexpress the proteins?
- question: >-
    Which PDZ-domain scaffolds bind full-length endogenous LPAR1 strongly enough
    to control receptor trafficking or signaling?
suggested_experiments:
- hypothesis: >-
    The alternative LPAR1 N termini produce isoform-specific differences in
    receptor maturation and signaling.
  description: >-
    Express Q92633-1 and Q92633-2 from matched genomic landing sites and, where
    possible, tag endogenous isoforms selectively. Quantify glycosylation, total
    and surface abundance, LPA-binding affinity, G-protein and beta-arrestin
    recruitment, internalization, and recycling under identical conditions.
  experiment_type: isoform-resolved receptor pharmacology and trafficking
- hypothesis: >-
    Native LPAR1 coupling is cell-context dependent, with Gi/o dominating the
    PLC/calcium response in some human cells and Gq/11 or G12/13 dominating in
    others.
  description: >-
    Use CRISPR-tagged endogenous LPAR1 in neuronal, mesenchymal, epithelial, and
    fibroblast models with multiplexed conformational or BRET biosensors for Gi/o,
    Gq/11, G12/13, beta-arrestin, cAMP, IP3, calcium, and Rho. Resolve ligand-dose
    and time-course responses with selective G-alpha knockouts and rescue.
  experiment_type: endogenous multiplexed GPCR coupling analysis
- hypothesis: >-
    RAMP proteins create distinct LPAR1 trafficking or signaling states rather
    than serving only as detectable membrane contacts.
  description: >-
    In human cells with endogenous LPAR1 and RAMP expression, knock out each RAMP
    singly and in combination, restore wild-type or interaction-defective RAMPs,
    and measure LPA affinity, surface residence, internalization, recycling,
    G-protein bias, and beta-arrestin recruitment.
  experiment_type: RAMP genetic epistasis and receptor pharmacology
- hypothesis: >-
    A restricted subset of PDZ proteins binds the intact LPAR1 C-terminal motif in
    cells and controls agonist-induced receptor trafficking.
  description: >-
    Compare endogenous proximity labeling and affinity purification for wild-type
    LPAR1 and a precise PDZ-binding-motif mutant before and after LPA stimulation.
    Validate motif-dependent partners individually and test their requirement for
    surface delivery, endocytosis, recycling, and signaling resensitization.
  experiment_type: endogenous receptor-scaffold interactome and functional validation
