core_functions:
- description: >-
    Acts at the plasma membrane as an LPA-activated GPCR, coupling ligand occupancy
    to Gi/Go, Gq/11, and G12/13 heterotrimeric G proteins. Proximal outputs include
    Gi-dependent inhibition of adenylyl cyclase and cAMP/PKA signaling and
    phospholipase-C-dependent inositol-phosphate production and cytosolic calcium
    elevation. G12/13-linked Rho signaling and the many resulting cytoskeletal,
    migratory, developmental, and disease phenotypes are context-dependent outputs
    of this receptor activity, not additional core molecular functions.
