knowledge_gaps:
- gap_statement: >-
    Functional differences between Q92633-1 and Q92633-2 have not been
    established.
  boundary: >-
    Two alternatively spliced products are recorded, and isoform 2 replaces the
    first 15 residues, but none of the audited ligand-binding, signaling,
    trafficking, localization, or phenotype studies compares the isoforms.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    The altered N terminus could affect receptor maturation, surface delivery, or
    ligand access, so assuming identical biology may conceal a regulatory product
    distinction.
  resolution: >-
    Compare endogenous or equivalently expressed tagged isoforms for glycosylation,
    surface abundance, LPA affinity, G-protein coupling, internalization, and
    tissue-specific expression.
  provenance:
  - reference_id: file:human/LPAR1/LPAR1-uniprot.txt
    supporting_text: 'Event=Alternative splicing; Named isoforms=2;'
- gap_statement: >-
    The quantitative contributions of Gi/Go, Gq/11, and G12/13 to native human
    LPAR1 signaling remain incompletely resolved across cell types and ligand
    concentrations.
  boundary: >-
    Direct recombinant-human evidence strongly supports pertussis-toxin-sensitive
    Gi-dependent PLC/calcium signaling, while integrated pathway and UniProt
    records support the broader coupling repertoire; these sources do not provide
    matched quantitative coupling measurements in native cells.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Branch-specific coupling determines whether LPAR1 primarily alters cAMP,
    calcium, Rho signaling, or a combination in each physiological setting.
  resolution: >-
    Measure endogenous receptor coupling with parallel Gi/o, Gq/11, G12/13,
    beta-arrestin, cAMP, IP3, calcium, and Rho biosensors under matched ligand-dose
    and time-course conditions.
- gap_statement: >-
    The physiological effects of LPAR1 interactions with RAMP1, RAMP2, and RAMP3
    are unknown.
  boundary: >-
    A systematic plasma-membrane interactome detects all three RAMP contacts, but
    the accessible evidence does not establish an LPAR1-specific change in ligand
    affinity, surface delivery, internalization, G-protein preference, or
    beta-arrestin recruitment.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    RAMP-dependent modulation could explain cell-type differences in LPAR1
    pharmacology and signaling without constituting a universal stable complex.
  resolution: >-
    Test each RAMP by endogenous knockout and add-back in coexpressing human cells,
    quantifying receptor surface abundance, LPA binding, coupling bias,
    internalization, and desensitization.
- gap_statement: >-
    Which PDZ-domain interactions occur with full-length endogenous LPAR1 and
    materially regulate receptor trafficking or signaling is unresolved.
  boundary: >-
    The LPAR1 C-terminal motif binds a broad panel of isolated PDZ domains with
    measured affinities, but fragment binding alone does not establish every
    full-length interaction in a shared physiological compartment.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Identifying the load-bearing scaffolds would distinguish receptor-specific
    trafficking control from a promiscuous motif-level interactome.
  resolution: >-
    Combine endogenous LPAR1 proximity labeling and coimmunoprecipitation with
    C-terminal motif mutants, then test validated partners for effects on surface
    delivery, endocytosis, recycling, and branch-specific signaling.
  provenance:
  - reference_id: PMID:36115835
    supporting_text: PDZ-PBM interactions are rather transient and promiscuous
