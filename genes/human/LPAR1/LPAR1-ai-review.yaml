  - UniProtKB:P25098
  review:
    summary: Modified because protein binding is valid in essence but less informative than the established LPAR1-specific term or partner class.
    action: MODIFY
    reason: The two normalized partners are the small GTPase RALA and G-protein-coupled receptor kinase 2. The paper directly studies both interactions in receptor trafficking/signaling, so GO:0031267 and GO:0019901 retain the distinct informative binding activities hidden by generic protein binding.
    proposed_replacement_terms:
    - id: GO:0031267
      label: small GTPase binding
    - id: GO:0019901
      label: protein kinase binding
- term:
    id: GO:0009986
    label: cell surface
  evidence_type: IDA
  original_reference_id: PMID:19306925
  qualifier: located_in
  review:
    summary: 'Accepted as a core component of LPAR1 ligand recognition, membrane localization, or proximal G-protein signaling: cell surface.'
    action: ACCEPT
    reason: Direct human localization and UniProt mapping place unstimulated LPAR1 at the cell surface, where ligand is encountered. Ligand-induced internalization does not negate this core steady-state functional location.
- term:
    id: GO:0030139
    label: endocytic vesicle
  evidence_type: IDA
  original_reference_id: PMID:19306925
  qualifier: colocalizes_with
  review:
    summary: 'Retained as a valid but contextual or downstream aspect of LPAR1 biology: endocytic vesicle.'
    action: KEEP_AS_NON_CORE
    reason: The receptor colocalizes with RALA in endocytic vesicles after LPA treatment. The qualifier correctly limits the claim to colocalization, and the trafficking state is retained as contextual rather than core.
- term:
    id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  evidence_type: IEP
  original_reference_id: PMID:12761501
  qualifier: involved_in
  review:
    summary: The accessible abstract does not expose the LPAR1-specific evidence for this experimental NF-kappaB-response annotation.
    action: UNDECIDED
    reason: The IEP annotation indicates that the curator had experimental expression-pattern evidence, but the cached PMID:12761501 record is abstract-only and does not name LPAR1. Without the relevant full-text result, the gene-specific support cannot be independently assessed. Curator deference precludes removal, while the inaccessible evidence precludes accepting or retaining the downstream process as established.
- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: TAS
  original_reference_id: PMID:8922387
  qualifier: enables
  review:
    summary: Modified because G protein-coupled receptor activity is valid in essence but less informative than the established LPAR1-specific term or partner class.
    action: MODIFY
    reason: The GPCR-family assignment is correct but unnecessarily broad for this well-characterized receptor. Direct human ligand-response studies and the existing specific annotations establish lysophosphatidic acid receptor activity, so GO:0070915 preserves the valid receptor claim while adding the known ligand specificity.
    proposed_replacement_terms:
    - id: GO:0070915
      label: lysophosphatidic acid receptor activity
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: TAS
  original_reference_id: PMID:9070858
  qualifier: located_in
  review:
    summary: 'Accepted as a core component of LPAR1 ligand recognition, membrane localization, or proximal G-protein signaling: plasma membrane.'
    action: ACCEPT
    reason: The plasma membrane is the core site at which this seven-transmembrane receptor binds extracellular LPA and activates heterotrimeric G proteins. IBA, electronic, Reactome, and multiple direct human localization rows provide convergent support.
- term:
    id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  evidence_type: TAS
  original_reference_id: PMID:8922387
  qualifier: involved_in
  review:
    summary: 'Accepted as a core component of LPAR1 ligand recognition, membrane localization, or proximal G-protein signaling: G protein-coupled receptor signaling pathway.'
    action: ACCEPT
    reason: LPAR1 is a ligand-activated heterotrimeric-G-protein-coupled receptor. This broad signaling process is directly demonstrated in human cells and remains a valid core parent of its Gi-, Gq-, and G12/13-dependent signaling branches.
- term:
    id: GO:0007204
    label: positive regulation of cytosolic calcium ion concentration
  evidence_type: TAS
  original_reference_id: PMID:9804623
  qualifier: involved_in
  review:
    summary: 'Accepted as a core component of LPAR1 ligand recognition, membrane localization, or proximal G-protein signaling: positive regulation of cytosolic calcium ion concentration.'
    action: ACCEPT
    reason: LPA stimulation through human LPAR1 increases cytosolic calcium through a directly demonstrated pertussis-toxin-sensitive Gi-to-PLC/IP3 route. Broader evidence also supports parallel Gq coupling, but the direct human calcium experiment is not attributed to Gq alone. The electronic and TAS rows represent a core second-messenger response.
