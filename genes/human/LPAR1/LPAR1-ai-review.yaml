id: Q92633
gene_symbol: LPAR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPAR1 is a class-A seven-transmembrane G protein-coupled receptor that binds
  extracellular lysophosphatidic acid at the plasma membrane and converts ligand
  occupancy into heterotrimeric G-protein signaling. Integrated human evidence
  supports coupling to Gi/Go, Gq/11, and G12/13; direct recombinant-human studies
  particularly establish a pertussis-toxin-sensitive Gi route to
  phospholipase-C-dependent inositol-phosphate production and cytosolic calcium
  elevation. Gi signaling also inhibits adenylyl cyclase, lowering cAMP and PKA
  activity, while Gq- and G12/13-linked branches connect the receptor to calcium
  and Rho-family cytoskeletal responses. LPAR1 is delivered to the cell surface
  through regulated biosynthetic trafficking and undergoes agonist-induced
  internalization to endosomes; RalA and GRK2 regulate signaling output and
  desensitization. Downstream LPAR1-dependent migration, actin remodeling,
  ciliogenesis inhibition, inflammatory
  and fibrotic responses, and nervous-system development are tissue-, disease-,
  or organism-specific outcomes of this receptor mechanism rather than separate
  core molecular activities. UniProt records two splice products, Q92633-1 and
  Q92633-2; Q92633-2 replaces the first 15 residues, but no direct study has
  established isoform-specific ligand binding, coupling, trafficking, or tissue
  function.
