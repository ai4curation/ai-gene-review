- id: PMID:14702039
  title: Complete sequencing and characterization of 21,243 full-length human cDNAs.
  findings:
  - statement: >-
      This large-scale human cDNA sequencing project is the sequence source underlying
      UniProt's second LPAR1 transcript model, not a functional isoform comparison.
    supporting_text: >-
      We determined the entire sequence of 21,243 selected clones and found that 14,490
      cDNAs (10,897 clusters) were unique to the FLJ collection.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correct primary sequencing source cited by UniProt for the Q92633-2 N-terminal
      sequence change. The paper supplies transcript sequence, not evidence that the two
      LPAR1 isoforms differ in ligand binding, trafficking, coupling, or expression.
- id: PMID:19306925
  title: Dual regulation of lysophosphatidic acid (LPA1) receptor signalling by Ral
    and GRK.
  findings:
  - statement: >-
      In HEK293 cells, LPA1 associates with RalA; LPA stimulation activates RalA and
      promotes Ral-dependent phospholipase C activity.
    supporting_text: >-
      We show that the small GTPase RalA associates with both LPA(1) and LPA(2) in human
      embryonic kidney (HEK 293) cells and that stimulation of LPA(1) receptors with LPA
      triggers the activation of RalA.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: >-
      GRK2 is required for LPA1 desensitization and forms an activity-promoted complex
      with RalA.
    supporting_text: >-
      Furthermore, we found that GRK2 is required for the desensitization of LPA(1) and
      LPA(2) and have identified a novel interaction between RalA and GRK2, which is
      promoted by LPA(1) receptor activity.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human-cell mechanistic study supporting agonist-dependent RalA/PLC signaling,
      GRK2 desensitization, receptor trafficking, and RalA/GRK2 interactions. Cache is
      abstract-only, so claims are limited to the accessible text and UniProt summary.
- id: PMID:19733258
  title: Lysophosphatidic acid mediates migration of human mesenchymal stem cells
    stimulated by synovial fluid of patients with rheumatoid arthritis.
  findings:
  - statement: >-
      Endogenous LPA1 is required for rheumatoid-arthritis synovial-fluid-induced human
      mesenchymal stem-cell migration and acts through calcium/calmodulin-dependent kinase II.
    supporting_text: >-
      These results suggest that LPA-LPA(1) plays a key role in the migration of hBMSCs
      induced by SF from RA patients through LPA(1)-dependent activation of
      calmodulin-dependent protein kinase II.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Human endogenous loss-of-function/pharmacology evidence for LPA1-dependent calcium
      signaling and chemotaxis. Ki16425 also inhibits LPA3, but LPAR1 RNA silencing supplies
      receptor-specific support.
- id: PMID:25025571
  title: Molecular regulation of lysophosphatidic acid receptor 1 trafficking to the
    cell surface.
  findings:
  - statement: >-
      Tyr85, Leu87, and Ile325 are required for LPA1 maturation and cell-surface trafficking;
      disruptive mutants remain predominantly in the ER.
    supporting_text: >-
      Further, site-directed mutagenesis analysis of the LPA1 revealed that Ile325, Tyr85,
      and Leu87 within these two fragments regulate LPA1 maturation and trafficking to the
      cell surface.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: >-
      Trafficking-defective LPA1 mutants fail to activate ERK or cytokine release after LPA.
    supporting_text: >-
      Further, we found that all these mutants failed to increase phosphorylation of Erk,
      and the cytokine release in response to LPA treatment.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached full text directly supports LPA1 biosynthetic maturation, N-glycosylation,
      COPII/Sar1-dependent export, ER retention of folding mutants, cell-surface location,
      and functional consequences of failed trafficking.
- id: PMID:26091040
  title: Crystal Structure of Antagonist Bound Human Lysophosphatidic Acid Receptor
    1.
  findings:
  - statement: >-
      Three antagonist-bound human LPA1 crystal structures define the receptor's ligand
      pocket.
    supporting_text: >-
      Herein, we present three crystal structures of LPA1 in complex with antagonist tool
      compounds selected and designed through structural and stability analyses.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: >-
      Structural and molecular-dynamics analysis supports ligand access from the
      extracellular space.
    supporting_text: >-
      Structural analysis combined with molecular dynamics identified a basis for ligand
      access to the LPA1 binding pocket from the extracellular space contrasting with the
      proposed access for the sphingosine 1-phosphate receptor.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Decisive human structural and antagonist-pharmacology source. The full text also
      contains functional calcium, cAMP, neurite-retraction, and stress-fiber assays, but
      speculative phosphorylated-endocannabinoid promiscuity is not treated as core.
- id: PMID:31204173
  title: Akt Regulates a Rab11-Effector Switch Required for Ciliogenesis.
  findings:
  - statement: >-
      LPA signaling through LPAR1 inhibits ciliogenesis initiation through PI3K/Akt and a
      Rab11-effector switch.
    supporting_text: >-
      Here, we demonstrate that through the LPA receptor 1 (LPAR1), serum lysophosphatidic
      acid (LPA) inhibits Rab11a-Rabin8 interaction and ciliogenesis. LPA/LPAR1 regulates
      ciliogenesis initiation via downstream PI3K/Akt activation, independent of effects
      on cell cycle.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Mechanistic cellular evidence for an LPAR1-PI3K-Akt branch controlling ciliogenesis.
      The cache is abstract-only, so the exact experimental species/cell-context details
      should be checked before broad developmental generalization.
- id: PMID:36115835
  title: Quantitative fragmentomics allow affinity mapping of interactomes.
  findings:
  - statement: >-
      The paper measures affinities between PDZ domains and PDZ-binding motifs at
      interactome scale rather than establishing a receptor-signaling function for LPAR1.
    supporting_text: >-
      Here, we measure the affinities of 65,000 interactions involving PDZ domains and
      their target PDZ-binding motifs (PBM) within a human interactome region particularly
      relevant for viral infection and cancer.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Valid source for the GOA/IntAct panel of LPAR1 C-terminal PDZ-motif contacts, but the
      paper does not make those individual contacts core receptor activities or establish
      their physiological co-occurrence.
- id: PMID:36577757
  title: LPA receptor 1 (LPAR1) is a novel interaction partner of Filamin A that promotes
    Filamin A phosphorylation, MRTF-A transcriptional activity and oncogene-induced
    senescence.
  findings:
  - statement: >-
      LPAR1 interacts with FLNA and MRTF-A in HCC cells and organoids.
    supporting_text: >-
      We identified the G protein-coupled lysophosphatidic acid receptor 1 (LPAR1) as a
      novel interaction partner of MRTF-A and Filamin A (FLNA) using fluorescence resonance
      energy transfer-(FRET) and proximity ligation assay (PLA) in vitro in HCC cells and
      in vivo in organoids.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: >-
      LPAR1 promotes FLNA Ser2152 phosphorylation, FLNA-MRTF-A complex formation, actin
      polymerization, and MRTF transcriptional activity.
    supporting_text: >-
      We found that LPAR1 promotes FLNA phosphorylation at S2152 which enhances the complex
      formation of FLNA and MRTF-A, actin polymerization, and MRTF transcriptional activity.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human HCC-cell and organoid evidence for a contextual LPAR1-FLNA-MRTF-A
      signaling branch. It supports the FLNA interaction and actin/SRF consequences, not a
      universal developmental function.
- id: PMID:39083597
  title: Multiplexed mapping of the interactome of GPCRs with receptor activity-modifying
    proteins.
  findings:
  - statement: >-
      A multiplexed screen found strong evidence for RAMP association across 122 GPCRs.
    supporting_text: >-
      Screening the GPCR-RAMP pairs with customized multiplexed suspension bead array (SBA)
      immunoassays, we identified 122 GPCRs that showed strong evidence for interaction with
      at least one RAMP.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Valid systematic source for candidate LPAR1-RAMP1/2/3 contacts captured by GOA. The
      paper does not establish an LPAR1-specific trafficking or pharmacological consequence,
      so these interactions remain non-core candidates.
- id: PMID:8922387
  title: Ventricular zone gene-1 (vzg-1) encodes a lysophosphatidic acid receptor
    expressed in neurogenic regions of the developing cerebral cortex.
  findings:
  - statement: >-
      Vzg-1/Lpar1 overexpression increases specific LPA binding and sensitizes Gi
      activation and cell rounding to LPA.
    supporting_text: >-
      Vzg-1 overexpression decreased the EC50 of both cell rounding and Gi activation in
      response to LPA. Pertussis toxin treatment inhibited vzg-1-dependent LPA-mediated Gi
      activation, but had no effect on cell rounding. Membrane binding studies indicated
      that vzg-1 overexpression increased specific LPA binding.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: >-
      Vzg-1 expression is enriched in cortical neurogenic regions, suggesting a developmental
      role for LPA signaling in cortical neurogenesis.
    supporting_text: >-
      These analyses identify the vzg-1 gene product as a receptor for LPA, suggesting the
      operation of LPA signaling mechanisms in cortical neurogenesis.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Founding functional Lpar1/Vzg-1 study, but the experiments and embryonic brain
      expression are mouse. It supports conserved receptor biochemistry and an orthologous
      developmental context, not direct human cortical-development claims.
- id: PMID:9070858
  title: Molecular cloning of the human Edg2 protein and its identification as a functional
    cellular receptor for lysophosphatidic acid.
  findings:
  - statement: >-
      Human EDG2/LPAR1 expression confers concentration-dependent, LPA-selective signaling
      and increases specific radiolabeled-LPA binding.
    supporting_text: >-
      HEK293 cells expressing the human Edg2 protein showed an elevated response to
      lysophosphatidic acid (LPA) in a serum response element reporter gene assay, which was
      LPA concentration-dependent and specific to LPA compared to other lysophospholipids.
      Over-expression of human Edg2 in CHO cells correlated with increases in specific
      binding of [3H]-LPA.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: >-
      Human EDG2 mRNA is broadly distributed, with highest abundance in brain.
    supporting_text: >-
      Human Edg2 mRNA is widely distributed in human tissues with the highest abundance in
      brain.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Decisive primary human receptor-identification paper: direct LPA binding, selective
      LPA-responsive signaling, sequence identity, and tissue-expression evidence.
- id: PMID:9804623
  title: Recombinant human G protein-coupled lysophosphatidic acid receptors mediate
    intracellular calcium mobilization.
  findings:
  - statement: >-
      Recombinant human EDG2/LPAR1 mediates LPA-dependent intracellular calcium mobilization
      through PLC-generated IP3.
    supporting_text: >-
      The coincident production of inositol phosphates and the inhibition of Ca2+
      mobilization by the phospholipase C inhibitor U73122 strongly suggested that Edg2 and
      Edg4 mobilize Ca2+ through inositol trisphosphate generated by phospholipase C activation.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: >-
      EDG2 calcium signaling is largely mediated by pertussis-toxin-sensitive Gi proteins.
    supporting_text: >-
      Pertussis toxin almost completely blocked LPA-induced Ca2+ mobilization by Edg2 but
      only partially blocked that by Edg4, which suggests that Edg2 transduces Ca2+
      mobilization largely through pertussis toxin-sensitive Gi proteins, whereas Edg4
      requires both Gi and Gq.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct recombinant-human comparison supporting LPAR1 coupling to Gi-sensitive
      PLC/IP3/calcium signaling. It also shows that compounds described as Xenopus LPA
      receptor antagonists acted as EDG2 agonists/partial agonists, a species/receptor
      pharmacology warning.
- id: Reactome:R-HSA-379048
  title: Liganded Gq/11-activating GPCRs act as GEFs for Gq/11
  findings:
  - statement: >-
      Reactome models liganded Gq/11-coupled receptors as activating PLC, IP3/DAG, and
      cytosolic calcium signaling.
    supporting_text: >-
      PLC hydrolyzes phosphatidylinositol (PIP2) to diacyl glycerol (DAG) and inositol
      triphosphate (IP3).
    reference_section_type: OTHER
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Curated human pathway reaction containing LPAR1, but it is generic Gq/11 mechanism;
      primary LPAR1 papers should carry the mechanistic weight.
- id: Reactome:R-HSA-380073
  title: Liganded Gi-activating GPCR acts as a GEF for Gi
  findings:
  - statement: >-
      Reactome models liganded Gi-coupled receptors as stimulating GDP-GTP exchange on the
      G-alpha subunit.
    supporting_text: >-
      This stimulates the exchange of GDP for GTP in the G-protein alpha subunit, activating
      the G-protein.
    reference_section_type: OTHER
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Curated human Gi reaction containing LPAR1; useful pathway context but not independent
      evidence for receptor specificity.
- id: Reactome:R-HSA-419389
  title: LPA-binding receptors bind LPA
  findings:
  - statement: >-
      Reactome identifies human EDG2 as LPA1, an LPA-binding GPCR, and links its downstream
      signaling to Gi.
    supporting_text: >-
      EDG2 is a human gene encoding a GPCR, LPA1 (as this receptor binds LPA) (An S et al,
      1997). Downstream effects such as inhibition of adenylyl cyclase are mediated by
      binding to Gi proteins (An S et al, 1998).
    reference_section_type: OTHER
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      LPAR1-specific curated reaction consistent with the direct human EDG2 papers. It is a
      secondary pathway source rather than a substitute for PMID:9070858 and PMID:9804623.
- id: Reactome:R-HSA-749448
  title: Liganded Gq-activating GPCRs bind inactive heterotrimeric Gq
  findings:
  - statement: >-
      Reactome models functionally diverse GPCRs as coupling to heterotrimeric Gq.
    supporting_text: Numerous functionally unrelated GPCRs couple with the Gq G-protein subtype.
    reference_section_type: OTHER
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Generic curated Gq-binding event; direct human LPAR1 evidence is stronger for Gi-sensitive
      PLC/calcium signaling, while broader Gq coupling is supported at pathway/family level.
- id: Reactome:R-HSA-749452
  title: The Ligand:GPCR:Gq complex dissociates
  findings:
  - statement: >-
      Reactome models activated G-alpha-q and beta-gamma as entering separate signaling cascades.
    supporting_text: >-
      Activated G alpha (q) and the beta:gamma dimer then participate in separate signaling cascades.
    reference_section_type: OTHER
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Generic downstream GPCR-cycle step, not LPAR1-specific functional evidence.
- id: Reactome:R-HSA-749454
  title: The Ligand:GPCR:Gi complex dissociates
  findings:
  - statement: >-
      Reactome models activated G-alpha-i and beta-gamma as entering separate signaling cascades.
    supporting_text: >-
      Activated G alpha (i) and the beta:gamma dimer then participate in separate signaling cascades.
    reference_section_type: OTHER
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Generic downstream GPCR-cycle step, not LPAR1-specific functional evidence.
- id: Reactome:R-HSA-749456
  title: Liganded Gi-activating GPCRs bind inactive heterotrimeric G-protein Gi
  findings:
  - statement: >-
      Reactome models Gi alpha as inhibiting cAMP production and thereby decreasing PKA activity.
    supporting_text: >-
      The G-alpha (i) subunit inhibits the production of cAMP from ATP. In turn, this results
      in decreased activity of cAMP-dependent protein kinase.
    reference_section_type: OTHER
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Generic Gi pathway step containing LPAR1 and consistent with receptor pharmacology;
      it does not by itself establish a direct LPAR1-Gi physical interaction.
- id: file:human/LPAR1/LPAR1-uniprot.txt
  title: UniProtKB entry Q92633 (LPAR1_HUMAN), lysophosphatidic acid receptor 1
  findings:
  - statement: >-
      UniProt summarizes LPAR1 as an LPA receptor coupled to Gi/Go, G12/G13, and Gq-family
      heterotrimeric G proteins.
    supporting_text: G(i)/G(o), G(12)/G(13), and G(q) families of
    reference_section_type: OTHER
  - statement: >-
