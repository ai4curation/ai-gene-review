gene_symbol: SERPINA6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Corticosteroid-binding globulin (CBG, transcortin) is the high-affinity plasma carrier of glucocorticoids
  and progesterone. It is a glycoprotein of 383 residues after removal of a 22-residue signal peptide, made mainly
  by hepatocytes and secreted into blood, where it holds most circulating cortisol in a single steroid-binding site
  and so sets the size of the circulating hormone pool and the fraction that is free. CBG has the serpin fold but
  does not inhibit proteases: its exposed reactive-centre loop is a substrate for neutrophil elastase and other
  proteases, and cleavage drives the serpin stressed-to-relaxed transition, which lowers steroid affinity through
  helix D and releases cortisol at sites of inflammation. Affinity also falls as temperature rises, releasing hormone
  in fever. N-glycosylation is required for steroid binding and tunes loop proteolysis. Loss-of-function variants
  that abolish production, impair secretion or weaken cortisol binding cause corticosteroid-binding globulin deficiency,
  in which total cortisol is low while free cortisol is usually normal.'
