- id: file:human/SERPINA6/SERPINA6-bioinformatics/RESULTS.md
  title: 'SERPINA6 bioinformatics: structural placement of CBG variants'
  findings:
  - statement: Literature variant numbering verified against P08185; steroid pocket, RCL register, burial, conservation
      and population frequencies computed.
    supporting_text: 20 of 20 literature variants have a reference residue that matches the canonical sequence after
      conversion.
- id: file:human/SERPINA6/SERPINA6-deep-research-openscientist.md
  title: OpenScientist deep research for SERPINA6
  findings:
  - statement: 'Independent synthesis: CBG is a non-inhibitory serpin carrier that uses the S-to-R transition for
      regulated cortisol release.'
    supporting_text: It retained the full serpin stressed-to-relaxed (S-to-R) conformational machinery and repurposed
      it from protease trapping to regulated ligand release.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Provider report (2026-11-28), used as corroboration and not as primary evidence. Its conclusions
      agree with this review: carrier function, no protease inhibition, liver-made and extracellular, Lyon at the
      pocket wall and Leuven on helix D. Checked points: its residue numbering matches P08185; its pocket set at
      4.5 A contains the 13 core residues found locally at 4.0 A; its contact distances (for example Trp371 at 1.85
      A) are shorter than the local heavy-atom values (2.87 A) because the 4C49 cortisol model includes hydrogen
      atoms, which was confirmed by recomputing with hydrogens. Its statement that a membrane CBG receptor is unsupported
      was not independently reviewed here.'
- id: file:human/SERPINA6/SERPINA6-hypotheses/helix-d-allosteric-variant-cluster/openscientist.md
  title: 'OpenScientist hypothesis report: helix D allosteric variant cluster'
  findings:
  - statement: The three remote binding-variant positions do not contact the steroid and form one cluster, but a
      single helix D mechanism is not supported.
    supporting_text: The claim that these residues do not contact the steroid is confirmed by direct measurement
      on experimental coordinates.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Hypothesis run launched from this review without the local RESULTS.md (2026-11-28); verdict partially
      supported. Its distances agree with the local analysis (His14 9.3 A, His89 12.9 A, Leu93 13.2 A against 9.2,
      12.9 and 13.0 A). Its observation that tyrosine is wild type at the His89 position in rodent CBG was re-checked
      in the local orthologue alignment (rat and mouse Tyr; 10 of 73 orthologues). Its proposal that coupling runs
      through the N-terminal segment and the Phe369-Thr370 strand is a structural inference and is recorded as a
      lead, not asserted.
