  review:
    summary: PAINT assigns serine-type endopeptidase inhibitor activity to every descendant of the chordate clade-A
      serpin node PTN008970140. CBG sits in that clade but is a hormone carrier whose reactive-centre loop is cut
      by proteases without inhibiting them.
    action: REMOVE
    reason: 'The ancestral assertion is sound for the inhibitory clade-A serpins that seed it (alpha-1-antitrypsin,
      protein C inhibitor and others), and CBG is inside the clade, so this is an argument for a loss on the CBG
      branch, not against the node. The loss is supported by direct evidence on the human protein: neutrophil elastase
      cleaves CBG at a single site and its activity is unchanged, in explicit contrast to alpha-1-proteinase inhibitor
      tested alongside (PMID:2370299). Later work treats CBG as a non-inhibitory serpin whose loop is a substrate
      for neutrophil elastase, chymotrypsin and Pseudomonas LasB (PMID:19011238, PMID:24424442, PMID:25322275),
      and no paper found in the literature search reports inhibition of any protease. The retained serpin S-to-R
      transition is used to release cortisol, not to trap a protease (PMID:18513745). The CBG clade is PANTHER node
      PTN008322172 (14 leaves, all subfamily SF34); the family review interpro/panther/PTHR11461/PTHR11461-review.yaml
      requests an IRD there.'
