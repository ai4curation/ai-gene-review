      carrier activity) applies. GO has no steroid hormone carrier term; one is proposed in proposed_new_terms and
      would be the better replacement once it exists. The alternative considered was to leave the row on molecular
      carrier activity and declare the proposed term as the core function (proposed_molecular_function); the refinement
      was preferred because an existing, correct descendant is available now, at the cost that lipid carrier activity
      is mostly used for lipoprotein and fatty-acid carriers and does not by itself say hormone.'
