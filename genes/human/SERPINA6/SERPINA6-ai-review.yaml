proposed_new_terms:
- proposed_name: steroid hormone carrier activity
  proposed_definition: Directly binding to a steroid hormone and delivering it either to an acceptor molecule or
    to a specific location.
  proposed_parent:
    id: GO:0005319
    label: lipid carrier activity
  justification: Plasma steroid-binding globulins (CBG, SHBG) are annotated only to the root molecular carrier activity
    or to steroid binding. A cargo-specific carrier term would let GO state what is carried, as it does for oxygen,
    lipids and proteins.
  supported_by:
  - reference_id: PMID:18513745
    supporting_text: Corticosteroids are transported in the blood by a serpin, corticosteroid-binding globulin (CBG)
- proposed_name: steroid hormone transport
  proposed_definition: The directed movement of a steroid hormone into, out of or within a cell, or between cells,
    by means of some agent such as a transporter, carrier protein or pore.
  proposed_parent:
    id: GO:0009914
    label: hormone transport
  justification: GO has thyroid hormone transport (GO:0070327), used for thyroxine-binding globulin, but no equivalent
    for steroid hormones carried by CBG and SHBG.
  supported_by:
  - reference_id: PMID:19011238
    supporting_text: Corticosteroid-binding globulin (CBG) is a non-inhibitory serine proteinase inhibitor (serpin)
      that transports cortisol and progesterone in blood
suggested_questions:
- question: Should PAINT record a loss of serine-type endopeptidase inhibitor activity on the CBG clade (PTN008322172),
    and likewise on the thyroxine-binding globulin and angiotensinogen clades, which inherit the same IBD from PTN008970140?
- question: Is lipid carrier activity (GO:0005319) the intended home for plasma steroid-hormone carriers, or should
    a steroid hormone carrier term be added beneath it?
- question: Proteolytic release of cortisol depends on CBG being a substrate of neutrophil elastase. GO records
    substrates on the enzyme (has input); should ELANE carry an annotation with SERPINA6 as input for this regulated
    release?
suggested_experiments:
- description: Measure free cortisol dynamics (ultradian pulses, stress surge, tissue interstitial levels by microdialysis)
    in carriers of null and binding-defective SERPINA6 alleles and matched non-carrier relatives ascertained by
    genotype, not symptoms, to test whether loss of the CBG-bound reservoir explains fatigue and pain when resting
    free cortisol is normal.
- description: Determine cortisol affinity, thermal stability and the native-to-cleaved affinity ratio of recombinant
    CBG H14Q, H89Y and L93H side by side, with a crystal structure or hydrogen-deuterium exchange of one variant,
    to test whether the helix D cluster acts allosterically.
- description: Re-measure recombinant CBG D367N binding under matched glycosylation and temperature to reconcile
    the reported 4-fold affinity reduction with the later report of no measurable binding.
knowledge_gaps:
- gap_statement: How loss of CBG produces fatigue, chronic pain and low blood pressure in some carriers is unknown,
    because their free cortisol and ACTH are usually normal.
  boundary: Null and binding-defective alleles lower total cortisol with normal free cortisol; CBG-deficient mice
    show a blunted corticosterone surge after stress and a smaller circulating reservoir, and people without functional
    CBG lack the releasable bound pool. Whether this reservoir loss, altered pulsatility or ascertainment explains
    human symptoms has not been tested, and penetrance is low.
  gap_kind:
  - BIOLOGY
  provenance:
  - reference_id: PMID:11502797
    supporting_text: The mechanism of the association between fatigue and relative hypotension is not established
      by these studies.
  - reference_id: PMID:20610591
    supporting_text: we suggest that this may influence glucocorticoid signaling and contribute to symptoms previously
      associated with CBG deficiency
- gap_statement: The mechanism by which variants distant from the steroid site (mature His14, His89, Leu93, Glu102,
    Ile279) lower cortisol binding has not been determined experimentally.
  boundary: 'His14, His89 and Leu93 form a side-chain contact cluster where helix D meets the N-terminal segment,
    9 to 13 A from the steroid, and helix D is the element that couples the reactive loop to the steroid site. A
    single shared allosteric mechanism is nevertheless not established: H14R lowers capacity while H14Q and H89Y
    lower affinity, and tyrosine, the residue H89Y introduces, is the wild-type residue in rat and mouse CBG and
    in 10 of 73 orthologues. No structure or conformational measurement of any variant exists, and Glu102 and Ile279
    are not explained by position.'
  gap_kind:
  - BIOLOGY
