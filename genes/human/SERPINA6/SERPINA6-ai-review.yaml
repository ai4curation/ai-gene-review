core_functions:
- description: 'High-affinity plasma carrier of cortisol and progesterone: binds the steroid in a single pocket
    formed by the N-terminal segment, strands of beta-sheet B and the C-terminal loop carrying Trp371 (mature numbering),
    holds most circulating cortisol, and releases it by equilibrium dissociation, on proteolytic cleavage of the
    reactive-centre loop, or as temperature rises. Steroid binding is the first step of the carrier activity and
    not a separate role: loss of direct contact residues (mature Trp371, Arg260) abolishes cortisol binding.'
  molecular_function:
    id: GO:0005319
    label: lipid carrier activity
  directly_involved_in:
  - id: GO:0009914
    label: hormone transport
  locations:
  - id: GO:0005576
    label: extracellular region
  substrates:
