  qualifier: involved_in
  review:
    summary: Reactome assigns the pathway term because the plasma-binding reaction is filed inside its glucocorticoid
      biosynthesis pathway. CBG synthesises nothing.
    action: REMOVE
    reason: A gene product is involved in a process only if it does some of the work. The steps of glucocorticoid
      biosynthesis are carried out by HSD3B, CYP21A2 and CYP11B1 inside adrenocortical cells; CBG is a liver-made
      plasma protein that binds the finished hormone. Its only reaction in the pathway is "Corticosteroids bind
      to CBG in blood", which is transport after secretion. The mouse GO-CAM for this pathway (gomodel:68b0f0d000007538)
      includes Serpina6 as a carrier activity in the extracellular region and gives it no part_of process, the same
      judgement made by a curator who modelled the pathway. Rodent knockouts change adrenal growth and steroidogenic
      gene expression (PMID:31570737, PMID:36112420), but that is an endocrine feedback consequence of losing the
      carrier, not participation in synthesis. The carrier role is captured by the molecular carrier rows and the
      proposed hormone transport annotation.
    source_defects:
    - defect_type: WRONG_TERM
      resource: REACTOME
      record: R-HSA-194002
      slot: term
      requested_change: DELETE_ROW
      asserted_value: GO:0006704
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      report_status: NOT_REPORTED
      explanation: 'SERPINA6 receives glucocorticoid biosynthetic process from membership of pathway R-HSA-194002.
        Its sole event there is R-HSA-1449687 "Corticosteroids bind to CBG in blood", a plasma transport step that
        follows biosynthesis and secretion; the pathway summary itself lists only the steroidogenic enzymes as carrying
        out the synthesis. The process term should not be exported for this participant. How this was checked: on
        2026-11-28 the nine events of R-HSA-194002 were listed through the Reactome ContentService (data/pathway/R-HSA-194002/containedEvents)
        and the reference entities of each were retrieved (data/participants/<event>/referenceEntities); UniProt
        P08185 is a participant of R-HSA-1449687 only, and the other eight events are the enzymatic and translocation
        steps. The repository cache holds the pathway and reaction summaries, not the event list.'
      supported_by:
