      below, would be more informative still; the choice between this refinement and keeping the root term with
      a proposed core function is explained on the experimental row.'
    proposed_replacement_terms:
    - id: GO:0005319
      label: lipid carrier activity
    supported_by:
    - reference_id: PMID:16980625
      supporting_text: Corticosteroid binding globulin (CBG) is the carrier for glucocorticoids in plasma.
    - reference_id: file:human/SERPINA6/SERPINA6-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Major transport protein for glucocorticoids and progestins in the blood of almost all vertebrate
        species.
- term:
    id: GO:0009914
    label: hormone transport
  evidence_type: IMP
  original_reference_id: PMID:11502797
  qualifier: involved_in
  review:
    summary: CBG carries cortisol and progesterone through the blood; people with no CBG have almost no protein-bound,
      and therefore very low total, circulating cortisol.
    action: NEW
    reason: 'Human SERPINA6 has no biological-process annotation apart from the Reactome biosynthesis row removed
      above, although carriage of hormone between tissues is what the protein is for. Participation test: CBG itself
      does the work, binding the hormone and holding the circulating pool; it is not a substrate or a bystander.
      Homozygotes for the null allele have undetectable CBG and morning total cortisol below 1.8 microg/dl, heterozygotes
      have half the CBG and total cortisol in proportion (PMID:11502797), and people without functional CBG lack
      the CBG-bound pool of releasable cortisol (PMID:21054475). Comparator check (QuickGO, exact term, 2026-11-26):
      the other hormone-carrier serpin, thyroxine-binding globulin SERPINA7 (P05543), carries the child term GO:0070327
      thyroid hormone transport by IMP; that term has 39 human annotations, so the query returns positives; vitamin
      D-binding protein GC (P02774) carries GO:0051180 vitamin transport. The convention for plasma carrier globulins
      is therefore to annotate the transport process, and CBG is the gap. GO has no glucocorticoid or steroid hormone
      transport term, so the parent hormone transport is used and a child term is proposed.'
    supported_by:
    - reference_id: PMID:11502797
      supporting_text: Plasma immunoreactive corticosteroid-binding globulin was undetectable in null homozygotes
    - reference_id: PMID:11502797
      supporting_text: Morning total plasma cortisol levels were less than 1.8 microg/dl in homozygotes and were
        positively correlated to the plasma corticosteroid-binding globulin level in heterozygotes.
    - reference_id: PMID:21054475
      supporting_text: CBG null patients lack a CBG-bound pool of readily releasable cortisol
    - reference_id: PMID:18513745
      supporting_text: Corticosteroids are transported in the blood by a serpin, corticosteroid-binding globulin
        (CBG)
