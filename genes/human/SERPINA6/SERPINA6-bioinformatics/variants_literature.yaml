# Input for 02_analyze.py: SERPINA6 / CBG variants reported in the literature.
# These are INPUTS transcribed from the cited papers (as each paper wrote them), not results.
# `numbering: mature` means the paper counts from the first residue of secreted CBG
# (precursor position = mature position + signal peptide length); `precursor` means HGVS p. numbering
# on the 405-residue precursor (UniProt P08185 / NP_001747). The script checks every reference
# residue against the canonical sequence and reports any mismatch.
variants:
  - name: CBG Null/Adelaide
    numbering: precursor
    ref: W
    pos: 11
    alt: "*"
    hgvs_c: c.32G>A
    kind: nonsense
    as_reported: "premature termination codon corresponding to residue -12 of the procorticosteroid-binding globulin molecule (c.121G-->A)"
    reported_effect: "no immunoreactive CBG in homozygotes; ~50% CBG in heterozygotes"
    effect_class: NO_PROTEIN
    references: [PMID:11502797, PMID:34308089]
  - name: CBG Santiago
    numbering: precursor
    ref: L
    pos: 5
    alt: fs
    hgvs_c: c.13delC
    kind: frameshift
    as_reported: "c.13delC ... frameshift generating a stop codon within the signal peptide coding region (p.Leu5CysfsX26)"
    reported_effect: "50% reduced CBG levels in heterozygotes"
    effect_class: NO_PROTEIN
    references: [PMID:22013108]
  - name: CBG Montevideo
    numbering: precursor
    ref: V
    pos: 55
    alt: fs
    hgvs_c: c.164_165del
    kind: frameshift
    as_reported: "c.164_165del (p.V55fs ...)"
    reported_effect: "plasma CBG reduced ~50% in heterozygous proband and mother"
    effect_class: NO_PROTEIN
    references: [PMID:34308089]
  - name: CBG Leuven (L93H)
    numbering: mature
    ref: L
    pos: 93
    alt: H
    hgvs_c: c.344T>A
    kind: missense
    as_reported: "Leu----His substitution at residue 93"
    reported_effect: "reduced cortisol-binding affinity (recombinant Kd 2.24 vs 0.64 nM)"
    effect_class: REDUCED_AFFINITY
    references: [PMID:1504007, PMID:8212073, PMID:7061486]
  - name: CBG Lyon (D367N)
    numbering: mature
    ref: D
    pos: 367
    alt: N
    hgvs_c: c.1165G>A
    kind: missense
    as_reported: "Asp367-->Asn substitution"
    reported_effect: "about 4-fold lower cortisol-binding affinity (PMID:10634411); no measurable cortisol binding of the recombinant protein in a later study (PMID:22948765)"
    effect_class: REDUCED_AFFINITY
    references: [PMID:10634411, PMID:22948765, PMID:17245537, PMID:40365551]
  - name: CBG G237V
    numbering: mature
    ref: G
    pos: 237
    alt: V
    hgvs_c: c.776G>T
    kind: missense
    as_reported: "c.776g>t transversion in exon 3 ... p.Gly237Val substitution"
    reported_effect: "immunoreactive CBG present but no cortisol-binding capacity"
    effect_class: NO_BINDING
    references: [PMID:20610591]
  - name: CBG Athens (W371S)
    numbering: mature
    ref: W
    pos: 371
    alt: S
    hgvs_c: c.1282G>C
    kind: missense
    as_reported: "c.1282G>C transversion in exon 5 ... p.Trp393Ser (W371S) substitution"
    reported_effect: "no measurable cortisol-binding activity; normal immunoreactive CBG"
    effect_class: NO_BINDING
    references: [PMID:22948765]
  - name: CBG A51V
    numbering: mature
    ref: A
    pos: 51
    alt: V
    kind: missense
    as_reported: "CBG A51V"
    reported_effect: "binds steroid normally but production/secretion severely impaired; ~50% plasma CBG in heterozygotes; carrier frequency ~1:36 in Han Chinese"
    effect_class: SECRETION_DEFECT
    references: [PMID:22337907, PMID:25695888]
  - name: CBG E102G
    numbering: mature
    ref: E
    pos: 102
    alt: G
    hgvs_c: c.371A>G
    kind: missense
    as_reported: "CBG E102G"
    reported_effect: "produced normally; abnormally low cortisol-binding capacity"
    effect_class: REDUCED_CAPACITY
    references: [PMID:22337907]
  - name: CBG R64Q
    numbering: mature
    ref: R
    pos: 64
    alt: Q
    kind: missense
    as_reported: "CBG R64Q"
    reported_effect: "produced and bound cortisol normally"
    effect_class: NO_EFFECT
    references: [PMID:22337907]
  - name: CBG R64W
    numbering: mature
    ref: R
    pos: 64
    alt: W
    kind: missense
    as_reported: "CBG R64W"
    reported_effect: "produced and bound cortisol normally"
    effect_class: NO_EFFECT
    references: [PMID:22337907]
  - name: CBG H14Q
    numbering: mature
    ref: H
    pos: 14
    alt: Q
    kind: missense
    as_reported: "CBG H14Q"
    reported_effect: "markedly reduced cortisol-binding affinity"
    effect_class: REDUCED_AFFINITY
    references: [PMID:25322275]
  - name: CBG H14R
    numbering: mature
    ref: H
    pos: 14
    alt: R
    kind: missense
    as_reported: "CBG H14R"
    reported_effect: "decreased cortisol-binding capacity"
    effect_class: REDUCED_CAPACITY
    references: [PMID:25322275]
  - name: CBG H89Y
    numbering: mature
    ref: H
    pos: 89
    alt: Y
    kind: missense
    as_reported: "CBG H89Y"
    reported_effect: "markedly reduced cortisol-binding affinity"
    effect_class: REDUCED_AFFINITY
    references: [PMID:25322275]
  - name: CBG R260L
    numbering: mature
    ref: R
    pos: 260
    alt: L
    kind: missense
    as_reported: "CBG R260L"
    reported_effect: "undetectable cortisol binding"
    effect_class: NO_BINDING
    references: [PMID:25322275]
  - name: CBG I279F
    numbering: mature
    ref: I
    pos: 279
    alt: F
    kind: missense
    as_reported: "CBG I279F"
    reported_effect: "moderately decreased cortisol-binding affinity; slower loss of binding after protease exposure"
    effect_class: REDUCED_AFFINITY
    references: [PMID:25322275]
  - name: CBG I48N
    numbering: mature
    ref: I
    pos: 48
    alt: N
    kind: missense
    as_reported: "CBG I48N"
    reported_effect: "secretion defect"
    effect_class: SECRETION_DEFECT
    references: [PMID:25322275]
  - name: CBG P246Q
    numbering: mature
    ref: P
    pos: 246
    alt: Q
    kind: missense
    as_reported: "CBG P246Q"
    reported_effect: "secretion defect"
    effect_class: SECRETION_DEFECT
    references: [PMID:25322275]
  - name: CBG I179V
    numbering: mature
    ref: I
    pos: 179
    alt: V
    kind: missense
    as_reported: "CBG I179V"
    reported_effect: "reduced rate of cortisol-binding loss after protease exposure; binding otherwise normal"
    effect_class: PROTEASE_RESISTANCE
    references: [PMID:25322275]
  - name: CBG S224A polymorphism ("A224S")
    numbering: mature
    ref: S
    pos: 224
    alt: A
    kind: missense
    as_reported: "Ser----Ala substitution at residue 224 (PMID:1504007)"
    # Later papers name the same polymorphism the other way round; checked by the script.
    also_reported_as:
      - {ref: A, pos: 224, alt: S, label: "CBG A224S", references: [PMID:22948765, PMID:34308089]}
    reported_effect: "no effect on cortisol-binding affinity (Kd 0.63 vs 0.64 nM)"
    effect_class: NO_EFFECT
    references: [PMID:1504007, PMID:22948765]
# Reactive-centre-loop register stated in PMID:19011238 (mature numbering), used only as an
# independent check of the alignment-derived P-site numbering.
rcl_register_reported:
  reference: PMID:19011238
  numbering: mature
  sites: {P16: [E, 334], P15: [G, 335], P14: [V, 336], P12: [T, 338], P10: [G, 340], P8: [T, 342]}
# Protease cleavage sites in the reactive-centre loop as stated in the literature (mature numbering);
# used to check residues against the canonical sequence and to express them as P-sites.
cleavage_sites_reported:
  - protease: neutrophil elastase
    after: [V, 344]
    before: [T, 345]
    numbering: mature
    reference: PMID:38042488
