    action: MODIFY
    reason: 'GluD1 is not a G-protein-coupled receptor. It is a tetrameric assembly of subunits with three
      transmembrane segments and a re-entrant pore loop, the canonical ionotropic glutamate receptor fold
      - not a seven-transmembrane GPCR - and no G-protein coupling by GluD1 itself has ever been reported.
      What the cited paper actually shows is the opposite arrangement: a genuine GPCR (mGlu1) signals
      through Gaq, PLC and PKC to open the GluD channel. The GPCR activity belongs to mGlu1; GluD is the
      downstream effector. This is a role conflation in which the effector has been annotated as the agent.
      A second caveat, recorded but not used as the basis for the action: the direct electrophysiology
      in that paper is on GluD2 in HEK293 cells and Purkinje cells. Following project policy this experimental
      annotation is re-pointed rather than removed - the underlying observation, that a GluD cation current
      is opened downstream of Gq signalling, is sound and is what GO:0005261 records.'
