    dark_aspect: MF_DARK
    status: OPEN
    significance: GOA currently carries mutually exclusive molecular-function claims for this protein
      - GABA receptor, AMPA receptor, G-protein-coupled receptor and transmitter-gated channel. Which,
      if any, of the gating claims is correct determines whether GluD1 should be annotated as an ionotropic
      receptor at all.
    resolution: Single-channel or fast-perfusion recordings of wild-type GluD1 at 37 degrees C with the
      controls used in PMID:39052831 (untransfected cells and GluD1-null neurons run in parallel), combined
      with direct binding measurements for acetylcholine rather than an indirect conformational proxy,
      and identification of the PKC substrate that couples Gq signalling to pore opening.
