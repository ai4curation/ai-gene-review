- term:
    id: GO:0030545
    label: signaling receptor regulator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: contributes_to
  review:
    summary: GluD1 regulates the levels and activity of other postsynaptic receptors as part of the trans-synaptic
      complex; this is its best-supported molecular role.
    action: ACCEPT
    reason: Of everything GOA asserts about the molecular function of GluD1, this is the one that best
      matches the experimental picture. Within the neurexin-cerebellin-GluD1 trans-synaptic complex, GluD1
