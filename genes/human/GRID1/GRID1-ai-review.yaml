- description: 'GluD1 forms a cation-conducting pore that is functional in native neurons but is not opened
    by direct transmitter binding in any well-replicated preparation. In dorsal raphe serotonin neurons
    GluD1 channels are constitutively active, carrying a tonic inward current that sets subthreshold excitability;
    the current is largely G-protein-independent yet is augmented by alpha-1 adrenergic (Gq-coupled) receptor
    activation, and the equivalent GluD2 current in Purkinje cells is opened downstream of mGlu1 through
    Gq, PLC and PKC. The conductance is inhibited by physiological falls in extracellular pH. Listed as
    a genuine but secondary activity: it is circuit-restricted, it is dispensable for the trans-synaptic
    organiser function, and the question of what, if anything, gates it directly remains open.'
