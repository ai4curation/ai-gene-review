core_functions:
- description: 'GluD1 is the postsynaptic receiver of a trans-synaptic signal. Its amino-terminal domain
    binds the secreted proteins cerebellin-1 and cerebellin-2, which bridge to presynaptic neurexins carrying
    the splice-site-4 insert. Binding of that presynaptic complex is converted, through conserved short
    motifs in the GluD1 cytoplasmic tail, into changes in the amount of NMDA and AMPA receptor held at
    the postsynapse - with neurexin-1 and neurexin-3 complexes acting on the two receptor types differentially,
    and without changing synapse number. The transduction does not pass through the channel: constructs
    retaining only the cerebellin-binding and cytoplasmic domains, joined by an unrelated transmembrane
    segment, are fully active. This is the least contested and most mechanistically dissected GluD1 function,
    and it is the reason family membership in the ionotropic glutamate receptors does not determine what
    this protein does.'
