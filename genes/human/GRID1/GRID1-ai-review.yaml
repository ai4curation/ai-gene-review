  review:
    summary: A hit in a urinary exosome proteome; not a meaningful location for a brain postsynaptic receptor.
    action: MARK_AS_OVER_ANNOTATED
    reason: High-throughput mass-spectrometry detection in exosomes purified from urine (PMID:19056867).
      GluD1 expression is essentially restricted to the central nervous system and its established location
