    summary: GluD1 is not a subunit of an AMPA receptor complex; this is inherited from a PAINT node whose
      donors are exclusively AMPA receptor subunits.
    action: REMOVE
    reason: 'GluD1 does not assemble into AMPA receptor complexes. Delta receptors form their own homomeric
      (and GluD1/GluD2 heteromeric) tetramers and their defining partners are the secreted cerebellins
      and presynaptic neurexins, not GRIA subunits; the GO definition of this complex requires a glutamate-gated
      ion channel. The propagation is traceable: every WITH/FROM donor for this term is an AMPA receptor
