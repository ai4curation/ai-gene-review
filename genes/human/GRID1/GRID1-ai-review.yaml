  knowledge_gaps:
  - gap_statement: What, if anything, directly gates the GluD1 pore is undetermined. No agonist has been
      shown to open wild-type GluD1 in a preparation that survives the appropriate negative controls,
      and the coupling between the Gq-PLC-PKC cascade and pore opening has no identified molecular step.
    boundary: 'Firmly established: GluD1 has an intact clamshell ligand-binding domain that binds D-serine,
      glycine and GABA; GluD1 carries a real, blocker-sensitive cation current in dorsal raphe neurons
      that is tonic and partly G-protein-independent; and the trans-synaptic organiser function proceeds
      with the transmembrane region replaced by an unrelated segment, so it does not depend on the pore.'
