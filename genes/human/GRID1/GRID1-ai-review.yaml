- term:
    id: GO:1904315
    label: transmitter-gated monoatomic ion channel activity involved in regulation of postsynaptic membrane
      potential
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Whether GluD1 is directly gated by a neurotransmitter is unresolved; the strongest recent
      evidence points to indirect (Gq-coupled or tonic) activation of a real pore, with one 2026 report
      claiming direct ACh gating.
    action: UNDECIDED
    reason: 'This is the central contested claim about GluD1 and the evidence is genuinely split, so neither
      ACCEPT nor REMOVE is honest. AGAINST: a dedicated study with the controls the original glycine/D-serine
      gating reports lacked found identical currents in naive HEK293 cells and in GluD2-null Purkinje
      neurons, and concluded that extracellular ligands do not directly gate wild-type GluD; UniProt carries
      this as an explicit CAUTION on Q9ULK0. The GABA effect that GluD1 does mediate is stated by its
      discoverers to be non-ionotropic. A 2026 review from the field says GluD1 lacks classical ion channel
      activity. FOR: a 2026 report describes ACh-evoked, NASPM-sensitive currents in medium spiny neurons
      that are absent in GluD1 knockouts and rescued by GluD1 re-expression - although those authors themselves
      hedge ("suggesting potential conductance"), and their ligand-binding evidence is an indirect conformational
      assay. Separately, GluD1 unquestionably carries current in native neurons, but tonically and/or
      downstream of Gq-coupled receptors, which is not what "transmitter-gated" means. A further proposal
      is that the channel is simply silent at room temperature because of a high energetic activation
      barrier. The phylogenetic node behind this IBA (PANTHER:PTN001826301) spans the whole iGluR family
      including GRID2, so the node placement is not the problem; whether the delta branch retained direct
      transmitter gating is the problem.'
    supported_by:
    - &id004
      reference_id: PMID:39052831
      supporting_text: these results cast doubt on the previously proposed hypothesis that extracellular
        ligands directly gate wild-type GluD channels
    - &id017
