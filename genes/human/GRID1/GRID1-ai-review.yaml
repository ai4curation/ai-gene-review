id: Q9ULK0
gene_symbol: GRID1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Delta-1 glutamate receptor (GluD1), a member of the ionotropic glutamate receptor family
  that is expressed throughout the central nervous system and concentrated in the postsynaptic membrane
  and postsynaptic density of both excitatory and inhibitory synapses. GluD1 has the full iGluR architecture
  - amino-terminal domain, clamshell ligand-binding domain, pore-forming transmembrane region and a long
  cytoplasmic tail - and assembles as a tetramer, but it does not bind glutamate and does not behave like
  its AMPA, kainate and NMDA relatives. Its best-established role is as a trans-synaptic organiser and
  signal transducer: the amino-terminal domain binds the secreted proteins cerebellin-1 and cerebellin-2,
  which in turn bind presynaptic neurexins carrying the splice-site-4 insert, and the resulting neurexin-cerebellin-GluD1
  bridge is transduced through short motifs in the cytoplasmic tail to control how much NMDA and AMPA
  receptor is present postsynaptically. This transduction does not use the channel: chimeras in which
  the whole transmembrane region is replaced by an unrelated segment remain fully active. GluD1 also binds
  GABA in its ligand-binding domain and, again non-ionotropically, drives long-lasting potentiation of
  GABAergic transmission, and it binds D-serine and glycine. Whether GluD1 additionally acts as a ligand-gated
  ion channel is disputed. Attempts to reproduce direct gating of wild-type receptors by glycine or D-serine
  found the same currents in untransfected cells and in receptor-null neurons, yet GluD1 demonstrably
  carries a cation current in native neurons - tonic, partly G-protein-independent, and augmented by Gq-coupled
  receptor activation - that sets subthreshold excitability and is inhibited by extracellular protons;
  a 2026 report further describes acetylcholine-evoked GluD1-dependent currents at striatal cholinergic
  synapses. Loss of GluD1 in rodents alters social behaviour, behavioural flexibility and anxiety-like
  behaviour, and the locus is associated with neuropsychiatric disease.'
