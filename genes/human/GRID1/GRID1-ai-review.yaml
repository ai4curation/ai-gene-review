- description: GluD1 is a GABA receptor. GABA binds the clamshell ligand-binding domain - a property not
    previously known for any ionotropic glutamate receptor - and GluD1 activation produces long-lasting
    enhancement of GABAergic synaptic currents in adult hippocampus. The mechanism is explicitly non-ionotropic
    and requires trans-synaptic anchoring, so the general GABA receptor activity term applies while the
    ionotropic GABA-A child term does not. GluD1 also binds D-serine and glycine in the same site, and
    a 2026 report adds acetylcholine with a distinct binding orientation, so the receptor is better described
    as a promiscuous small-molecule sensor than as a single-transmitter receptor.
