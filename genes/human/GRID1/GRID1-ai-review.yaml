suggested_questions:
- question: Is the acetylcholine-evoked, NASPM-sensitive current reported at striatal cholinergic synapses
    a current through the GluD1 pore, or a GluD1-dependent current carried by something else? The knockout
    and rescue controls establish GluD1 dependence but not that GluD1 is the conducting species, and the
    authors themselves write only of "potential conductance".
- question: How can the same group report, in the same year, that GluD1 is an acetylcholine receptor with
    measurable currents and that GluD1 has a "lack of classical ion channel activity"? Is the intended
    reconciliation that GluD1 conducts only when trans-synaptically anchored, or only at physiological
    temperature, or only in specific circuits?
- question: Does the delta-receptor pore require physiological temperature to open, as proposed for GluD2
    on thermodynamic grounds? If so, how much of the twenty-year "orphan receptor" literature is an artefact
    of recording at room temperature?
- question: Should GO create a molecular-function term for a receptor that binds a neurotransmitter and
    transduces the signal without conducting ions? GO:0016917 GABA receptor activity happens to accommodate
    this because its definition does not mention a channel, but that is fortuitous rather than deliberate,
    and there is no general term for non-ionotropic neurotransmitter reception.
- question: What couples Gq-PLC-PKC signalling to opening of the GluD channel - is there a phosphorylation
    site on the GluD cytoplasmic tail, or does an intermediary protein act on the pore?
- question: Given that GluD1 sits at glutamatergic, GABAergic and cholinergic synapses and binds GABA,
    D-serine, glycine and possibly acetylcholine, is the correct framing that GluD1 is a promiscuous sensor
    whose output is set by its trans-synaptic partners rather than by its ligand?
suggested_experiments:
- hypothesis: GluD1 itself is the conducting species in acetylcholine-evoked currents at striatal cholinergic
    synapses.
  description: Record acetylcholine-evoked currents in medium spiny neurons from mice in which GluD1 has
    been replaced by a pore-dead knock-in (a selectivity-filter or Q/R-site mutant that traffics and binds
    cerebellin normally) rather than deleted. If the current survives loss of the pore while trans-synaptic
    function is intact, GluD1 is required but is not the conducting species; if it is abolished while
    cerebellin binding is unaffected, GluD1 conducts.
- hypothesis: Direct ligand gating of wild-type GluD1 is masked at room temperature by a high activation
    energy barrier.
  description: Repeat the glycine/D-serine/GABA/acetylcholine application experiments on wild-type GluD1
    in parallel at 22 and 37 degrees C, always with untransfected cells and GluD1-null neurons recorded
    in the same sessions as required by PMID:39052831. Fit the temperature dependence to extract an activation
    energy and test whether it matches the barrier proposed for GluD2.
- hypothesis: The GABA, D-serine and acetylcholine effects on GluD1 are separable at the level of the
    binding site.
  description: Use the reported differences in binding orientation to design binding-site mutants that
    abolish GABA binding while preserving acetylcholine binding and vice versa (starting from R526K and
    D742A, which abolish the GABA effect), then test each mutant for inhibitory potentiation in hippocampus
    and for acetylcholine-evoked current in striatum. This separates the non-ionotropic GABA signal from
    the putative cholinergic conductance in one background.
- hypothesis: The Gq-PLC-PKC cascade opens the GluD channel through phosphorylation of the GluD cytoplasmic
    tail.
  description: Map PKC phosphosites on the GluD1 cytoplasmic tail by mass spectrometry after mGlu1 or
    alpha-1 adrenergic stimulation, then test phospho-null and phospho-mimetic tails for their effect
    on the tonic and Gq-augmented currents in dorsal raphe neurons, and separately for their effect on
    NMDA and AMPA receptor levels - determining whether the channel and organiser outputs share a regulatory
    node.
- hypothesis: GluD1 does not occupy AMPA receptor complexes, contrary to the propagated annotation.
  description: Native-source co-immunoprecipitation and blue-native PAGE from mouse forebrain using GluD1
    and GRIA1-4 antibodies, with GluD1-null tissue as the specificity control, to test directly whether
    GluD1 is ever found in a complex with AMPA receptor subunits or only in cerebellin/neurexin assemblies.
