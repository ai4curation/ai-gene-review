    supporting_text: Reaction=S-adenosyl-L-homocysteine + H2O = L-homocysteine + adenosine
  - reference_id: Reactome:R-HSA-174401
    supporting_text: Adenosylhomocysteinase (AHCY) is a tetrameric, NAD+-bound, cytosolic protein
  - reference_id: PMID:28647132
