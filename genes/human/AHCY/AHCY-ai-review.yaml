- question: What AHCY-specific peptide and localization controls support the unresolved melanosome,
    B-cell exosome and prostatic-secretion exosome assignments, and how does the tagged-expression
    ER result relate to endogenous AHCY distribution?
- question: How broadly does the adenosine-dependent AHCY/FTO mechanism operate outside the tested
    tumor models, and how do the corrected supplementary Figures S4 and S7 affect the quantitative
    dimerization evidence?
- question: How is SAH hydrolysis partitioned between endogenous nuclear and cytosolic AHCY pools,
    and do the alternative N-terminal isoforms alter this balance?
