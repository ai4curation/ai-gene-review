core_functions:
- description: AHCY hydrolyzes SAH to adenosine and L-homocysteine as a tightly NAD-bound enzyme,
    normally assembled as a homotetramer. This product-forming step sustains the L-methionine cycle
    and limits SAH inhibition of methyltransferases. Cytosolic and nuclear pools support the same
    catalytic chemistry; methyltransferases perform the subsequent methyl transfer.
  molecular_function:
    id: GO:0004013
    label: adenosylhomocysteinase activity
  directly_involved_in:
