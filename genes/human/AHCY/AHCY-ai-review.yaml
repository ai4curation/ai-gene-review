id: P23526
gene_symbol: AHCY
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AHCY encodes adenosylhomocysteinase, an NAD-dependent enzyme that reversibly hydrolyzes S-adenosyl-L-homocysteine
  (SAH) to adenosine and L-homocysteine. Its canonical catalytic assembly is a homotetramer with tightly
  bound nicotinamide cofactors. By removing SAH, a product inhibitor of SAM-dependent methyltransferases,
  AHCY supports cellular methylation and performs a step of the L-methionine cycle. The protein occurs
  in the cytoplasm and nucleus, where local SAH turnover can support methylation-associated processes.
  Adenosine-dependent AHCY interaction with the RNA demethylase FTO has also been reported in tumor-cell
  models, distinct from its hydrolase chemistry. Biallelic loss-of-function variants cause S-adenosylhomocysteine
  hydrolase deficiency, with abnormal methionine-cycle metabolites and variable hepatic, muscular and
  neurodevelopmental manifestations.
