id: Q9BY67
gene_symbol: CADM1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CADM1 (cell adhesion molecule 1; also Necl-2, SynCAM1, TSLC1, IGSF4) is a single-pass type
  I transmembrane glycoprotein of the nectin-like immunoglobulin superfamily, with an extracellular region
  of one V-type and two C2-type Ig domains and a short cytoplasmic tail carrying a protein 4.1-binding
  motif and a C-terminal class II PDZ-binding motif. It forms cis homodimers in the plasma membrane and
  mediates Ca2+-independent homophilic cell-cell adhesion, and also heterophilic adhesion with other nectin-like
  and nectin proteins (CADM3, NECTIN3, CADM2). Its cytoplasmic tail binds the 4.1B (EPB41L3/DAL-1) FERM
  domain, linking it to actin, and the MAGuK scaffolds MPP3 (and through it DLG1 and PI3K p85), MPP2 and
  PALS2. In epithelia it sits at the lateral (basolateral) membrane at cell-cell contacts; in human mast
  cells it is the receptor for homotypic aggregation and supports survival. CADM1 is also the ligand for
  the activating lymphocyte receptor CRTAM: expressed on tumour cells or CD8alpha+/BDCA3+ dendritic cells
  it promotes NK-cell cytotoxicity and IFN-gamma production by CD8+ T cells. In the nervous system the
  rodent ortholog (SynCAM 1) is a trans-synaptic adhesion molecule that drives synapse assembly. Loss
  of CADM1 expression is frequent in lung and other carcinomas, where it behaves as a tumour suppressor.'
