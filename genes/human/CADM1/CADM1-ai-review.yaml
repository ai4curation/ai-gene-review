  review:
    summary: Detection of stimulus, derived from the CRTAM recognition experiments.
    action: MARK_AS_OVER_ANNOTATED
    reason: IBA from PAINT node PTN002913382, whose descendant donors are mouse Cadm1, rat Cadm1 and human
      CADM1 itself (all PANTHER PTHR45889:SF2); human CADM1 appearing among the donors marks experimental
      grounding on the target. GO:0051606 describes receiving a stimulus and converting it into a molecular
      signal. In the CRTAM system the detecting cell is the CRTAM-bearing lymphocyte, and CADM1 is the
      ligand that is detected. CADM1 does transduce signals of its own (PI3K activation through MPP3/Dlg
      after trans-homophilic binding), but that is better captured by its adhesion terms. The term is
      not removed because a curator annotated it from the full text and PAINT propagated it at the CADM1
      node, but it overstates CADM1's role.
    supported_by:
    - *id002
