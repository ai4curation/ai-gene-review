    label: cell-cell adhesion mediator activity
  evidence_type: IDA
  original_reference_id: PMID:12050160
  qualifier: enables
  review:
    summary: CADM1 is a cell-surface Ig-superfamily adhesion protein whose extracellular domain binds
      the same or related molecules on neighbouring cells to mediate adhesion.
    action: NEW
    reason: GOA carries the adhesion processes (homophilic and heterophilic cell-cell adhesion) and binding
      terms but no adhesion MF. Human CADM1 directly mediates Ca2+-independent homophilic aggregation
      of MDCK cells and is the sole receptor for homotypic aggregation of human mast cells, which is exactly
      the activity defined by cell-cell adhesion mediator activity (binding by a cell-surface adhesion
      protein to an extracellular component of another cell). CADM1 performs the adhesion itself, so the
      participation test is met.
    supported_by:
    - reference_id: PMID:12050160
      supporting_text: TSLC1 mediates intracellular adhesion through homophilic interactions in a Ca(2+)/Mg(2+)-independent
        manner
    - reference_id: PMID:22438059
      supporting_text: CADM1 downregulation abolished homotypic adhesion, indicating that CADM1 is the
        sole receptor mediating mast cell aggregation
