suggested_questions:
- question: Does human CADM1 itself transduce a signal on CRTAM engagement (reverse signalling into the
    target or dendritic cell), or is it purely a ligand? This determines whether 'detection of stimulus'
    has any basis for CADM1.
- question: Which reference was intended for the UniProt IPI row linking CADM1 to MPP3 that currently
    cites PMID:29099056?
- question: Do the human CADM1 splice isoforms (SP1, SP4, SP6) that differ in the stalk region differ
    in CRTAM binding or synaptic function as they do in mast-cell homotypic adhesion?
suggested_experiments:
- description: Test whether CRTAM engagement triggers CADM1-dependent signalling (e.g. PI3K/Akt activation
    through the PDZ-binding motif) in CADM1-expressing epithelial or dendritic cells, comparing wild-type
    and tail-truncated CADM1.
- description: Assess synapse-inducing activity of human CADM1 isoforms in neuron/non-neuronal co-culture
    assays to confirm transfer of the rodent SynCAM 1 synaptogenic function.
