      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002913382
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The node carries detection of stimulus from the human CADM1 IDA (PMID:15811952), where
          CADM1 is the CRTAM ligand that lymphocytes detect; the descendant inherits the same role conflation
