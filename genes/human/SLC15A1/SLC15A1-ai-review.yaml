id: P46059
gene_symbol: SLC15A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC15A1 (PEPT1) is an electrogenic, proton-coupled oligopeptide transporter
  of the major facilitator superfamily (POT/PTR, TC 2.A.17 family). It is a 708-residue
  polytopic membrane protein that couples the inwardly directed transmembrane proton
  electrochemical gradient to the uphill uptake of di- and tripeptides (and, with
  lower efficiency, tetrapeptides), with a strong preference for dipeptides and a
  broad tolerance for peptide side-chain charge. It is expressed predominantly at
  the apical (brush-border) membrane of small-intestinal enterocytes, where it is
  the principal route for absorption of the di- and tripeptide products of luminal
  protein digestion. Because of its broad, low-affinity, high-capacity substrate
  recognition it also mediates oral uptake of many peptidomimetic drugs and prodrugs,
  including aminocephalosporin and aminopenicillin beta-lactam antibiotics, ACE
  inhibitors and antiviral prodrugs such as valaciclovir. It additionally transports
  bacterially derived peptides (N-formyl peptides such as fMLP and the NOD2 ligand
  muramyl dipeptide), linking luminal peptide sensing to mucosal immune responses.
