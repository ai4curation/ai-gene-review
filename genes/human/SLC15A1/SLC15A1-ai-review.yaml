suggested_questions:
- question: Does PEPT1-mediated apical uptake of the NOD2 ligand muramyl dipeptide and
    of N-formyl peptides constitute a distinct, annotatable role in innate immune
    sensing, or is it best represented purely as substrate specificity of the
    transport activity?
- question: What are the physiological proton:peptide stoichiometries (1:1 vs 2:1) for
    neutral versus charged peptide substrates, and should these be captured as
    distinct catalytic activities?
suggested_experiments:
- description: Generate SLC15A1 knockout intestinal organoids or Caco-2 lines and
    quantify apical-to-basolateral flux of representative di-/tripeptides and
    peptidomimetic drugs (e.g. cephalexin, valaciclovir) to define the in vivo
    substrate spectrum attributable specifically to PEPT1.
- description: Use cryo-EM structures of PEPT1 captured in multiple transport-cycle
    states with bound di- versus tripeptide substrates to map the determinants of the
    dipeptide preference and the proton-coupling pathway.
