  - *id008
  - *id002
  - *id004
- description: Binds two [4Fe-4S] clusters, the MTTase N-terminal-domain cluster and the SAM-binding
    radical SAM cluster, both needed for MiaB-type methylthiolation.
  molecular_function: *id014
  supported_by:
  - *id013
  - *id010
- description: Binds S-adenosyl-L-methionine as the radical-generating cosubstrate at the unique
    iron of the radical SAM [4Fe-4S] cluster, and uses a second SAM as the methyl donor for the
    methylthio group.
  molecular_function:
