taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CDK5RAP1 is a mitochondrial radical S-adenosyl-L-methionine (SAM) methylthiotransferase
  of the MiaB subfamily. It converts N6-isopentenyladenosine at position 37 (i6A37) into 2-methylthio-N6-isopentenyladenosine
  (ms2i6A37) in four mitochondrial DNA-encoded tRNAs (Ser(UCN), Phe, Tyr and Trp). It uses two [4Fe-4S]
  clusters: one bound by the MTTase N-terminal domain, and a radical SAM cluster that cleaves SAM. The
  protein has an N-terminal mitochondrial transit peptide, an MTTase N-terminal domain, a radical SAM
  core and a C-terminal TRAM domain, and acts in the mitochondrial matrix. The ms2 modification stabilizes
  codon-anticodon interaction and is needed for efficient and accurate mitochondrial protein synthesis.
  Cdk5rap1-deficient mice have respiratory defects and stress-induced myopathy and cardiac dysfunction,
  and ms2 levels are reduced in patients with mitochondrial disease. Splice variants lacking the transit
  peptide can be found in the cytoplasm and nucleus, but ms2i6A is restricted to mitochondrial tRNA. The
  protein was first identified as a binding partner of the CDK5 activator p35 (CDK5R1) that inhibits CDK5
  activation in vitro, which is the origin of its name. The physiological relevance of this interaction
  is unclear.'
