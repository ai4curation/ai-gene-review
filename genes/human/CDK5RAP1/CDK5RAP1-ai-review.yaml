- term:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  evidence_type: ISS
  original_reference_id: PMID:15339930
  qualifier: enables
  review:
    summary: CDK5RAP1 is a MiaB-subfamily radical SAM methylthiotransferase. SAM binds the unique
      iron of the radical SAM [4Fe-4S] cluster and is cleaved to the 5'-deoxyadenosyl radical; a
      second SAM supplies the methyl group.
    action: NEW
    reason: >-
      Not in GOA. Added for consistency with the RADICAL_SAM treatment rule (SAM binding is a core cosubstrate-binding
      function of every active radical SAM enzyme) and with the LIAS and ELP3 reviews. This is a molecular
      function, so CDK5RAP1 itself must bind SAM, and it does: its reaction (RHEA:37067) consumes two
      SAM, and UniProt (PROSITE-ProRule PRU00780) records an exchangeable SAM on the radical SAM cluster.
      The bacterial ortholog MiaB, reconstituted in vitro, cleaves one AdoMet to 5'-deoxyadenosine and
      uses a second as the methyl donor (PMID:15339930). Transferred by sequence similarity (ISS) from
      MiaB. Comparator check, against GOA rather than against this project's own proposals: GOA does annotate
      GO:1904047 to radical SAM enzymes in exactly this role, by UniRule -- ECOLI/queE (UR000100349),
      ECOLI/moaA and PSEPK/moaA (UR000101305), METEA/pqqE and PSEPK/pqqE (UR000098303). So the absence
      here is patchy UniRule coverage, which rules happen to carry the term, not a GO convention against
      annotating a radical SAM enzyme's own cosubstrate. That is also why those five genes have an existing
      row to ACCEPT or MODIFY while this one needs a NEW row.
    supported_by: &id015
    - reference_id: PMID:15339930
      supporting_text: we have reconstituted in vitro the conversion of i(6)A to ms(2)i(6)A within a
        tRNA substrate using the iron-sulfur MiaB protein, S-adenosylmethionine (AdoMet), and a
        reducing agent.
    - reference_id: PMID:15339930
      supporting_text: In this process, one molecule of AdoMet is converted to 5'-deoxyadenosine,
        probably through reductive cleavage and intermediate formation ofa5'-deoxyadenosyl radical
        as observed in other "Radical-AdoMet" enzymes, and a second molecule of AdoMet is used as a
        methyl donor as shown by labeling experiments.
    - reference_id: file:human/CDK5RAP1/CDK5RAP1-uniprot.txt
      supporting_text: Binds 2 [4Fe-4S] clusters. One cluster is coordinated with 3 cysteines and an
        exchangeable S-adenosyl-L-methionine.
