  supported_by: *id015
suggested_questions:
- question: Is the reported p35 (CDK5R1) binding and in vitro inhibition of CDK5 activation by
    CDK5RAP1 physiologically relevant, given that the mature enzyme is in the mitochondrial matrix?
    If so, which isoform does it, and where in the cell?
- question: Do the MTS-less splice variants (isoforms 2, 5, 6) have any catalytic activity or a
    non-catalytic role, given that they lack a conserved MTTase-domain cysteine?
suggested_experiments:
- description: In vitro reconstitution of purified mature human CDK5RAP1 with [4Fe-4S] clusters and
    i6A37-containing mitochondrial tRNA transcripts, with SAM and reductant, to measure kinetics,
    tRNA selectivity (Ser(UCN), Phe, Tyr and Trp versus other i6A tRNAs) and the sulfur source.
- description: Test whether CDK5RAP1 loss alters CDK5 activity in neurons by comparing CDK5 kinase
    activity and p35 complexes in Cdk5rap1-knockout and wild-type brain, and by rescuing with
    MTS-intact and MTS-less variants.
