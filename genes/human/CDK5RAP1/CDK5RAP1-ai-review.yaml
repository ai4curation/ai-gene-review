core_functions:
- description: Radical SAM methylthiotransferase that converts i6A37 to ms2i6A37 (EC 2.8.4.3) in
    mitochondrial tRNA-Ser(UCN), -Phe, -Tyr and -Trp, inside the mitochondrial matrix. The
    modification supports efficient and accurate mitochondrial translation.
