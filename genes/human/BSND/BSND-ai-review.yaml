core_functions:
- description: Binds ClC-Ka/ClC-Kb and regulates their channel activation and surface organization,
    contributing to chloride conductance by the assembled heteromeric complex. Barttin supplies accessory
    regulation rather than the chloride-conducting pore. This mechanism supports renal chloride transport
    and inner-ear ionic homeostasis.
