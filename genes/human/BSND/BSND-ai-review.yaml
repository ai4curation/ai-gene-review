core_functions:
- description: Binds ClC-Ka/ClC-Kb and regulates their activation and surface organization, contributing
    to chloride conductance by the heteromeric complex without forming the conducting pore. Electrophysiological
    studies distinguish trafficking from modulation of permeation and cooperative common gating.
    Barttin favors an open common-gate configuration; Cys54/Cys56 palmitoylation supports channel
    activation without requiring increased membrane insertion in the tested systems. This accessory
    mechanism supports renal chloride transport and inner-ear ionic homeostasis.
