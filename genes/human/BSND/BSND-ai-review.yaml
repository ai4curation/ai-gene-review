id: Q8WZ55
gene_symbol: BSND
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Barttin, encoded by BSND, is an integral membrane accessory subunit of the ClC-Ka and
  ClC-Kb chloride channels. It associates with these pore-forming subunits and regulates channel
  activation, surface abundance and polarized membrane sorting. Barttin modifies cooperative channel
  gating, favoring chloride conductance at physiological potentials; its palmitoylation at Cys54
  and Cys56 supports efficient activation. Trafficking and activation can be separated experimentally
  and by disease-associated variants. ClC-K/barttin complexes support renal chloride reabsorption
  and potassium recycling in the inner ear. Wild-type human barttin preferentially sorts basolaterally
  in polarized epithelial models. Loss of barttin function causes Bartter syndrome with sensorineural
  deafness, while some hypomorphic variants predominantly impair hearing.
