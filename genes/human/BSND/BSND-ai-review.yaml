id: Q8WZ55
gene_symbol: BSND
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Barttin is a small integral membrane accessory subunit of the ClC-Ka and ClC-Kb chloride
  channels, encoded by BSND. It associates with these pore-forming subunits and controls channel
  activation, surface abundance and polarized membrane sorting. Functional ClC-K/barttin complexes
  support renal chloride reabsorption and the ionic environment required for inner-ear hearing. Wild-type
  human barttin preferentially sorts basolaterally in polarized epithelial expression models; pathogenic
  variants can impair conductance, trafficking or sorting through distinct mechanisms. Loss of barttin
  function causes Bartter syndrome with sensorineural deafness.
existing_annotations:
- term:
    id: GO:0005254
    label: chloride channel activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: contributes_to
  supporting_entities:
  - UniProtKB:Q8VIM4
  - ensembl:ENSMUSP00000049563
  review:
    summary: Barttin contributes to the chloride conductance of ClC-K/barttin heteromeric channels.
    action: ACCEPT
    reason: 'The preserved contributes_to qualifier is essential: barttin is an accessory regulator
      of ClC-K channel trafficking and function, whereas ClC-K supplies the chloride-conducting pore.
      Coexpression increases current and surface abundance, and disease variants disrupt channel
      function. The ortholog-derived assertion is consistent with target-specific evidence; it does
      not assign autonomous pore activity to barttin.'
    supported_by:
    - reference_id: PMID:12111250
    - reference_id: PMID:18776122
