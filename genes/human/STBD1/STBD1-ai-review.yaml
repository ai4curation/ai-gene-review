id: O95210
gene_symbol: STBD1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  STBD1 (starch-binding domain-containing protein 1, genethonin-1) is the cargo receptor for
  glycophagy, the selective autophagic delivery of glycogen to lysosomes. It is a small
  single-pass type III membrane protein: an N-terminal hydrophobic segment anchors it to the
  endoplasmic reticulum and to perinuclear membranes, and a C-terminal CBM20 carbohydrate-binding
  module binds glycogen. An AIM/LIR motif binds the ATG8-family proteins GABARAP and GABARAPL1,
  so STBD1 physically bridges glycogen to the autophagic machinery. Deleting the membrane anchor
  disperses the protein; mutating CBM20 leaves it perinuclear but releases its glycogen cargo,
  separating targeting from binding. STBD1 is most studied in liver and skeletal muscle, where it
  is also found at the T-tubule near junctional sarcoplasmic reticulum.
