core_functions:
- description: >-
    Bridges glycogen to the autophagic machinery, binding the polysaccharide through its CBM20
    module and an ATG8-family protein through its AIM/LIR, so that glycogen is captured as
    autophagic cargo and delivered to lysosomes.
  molecular_function:
    id: GO:0038024
    label: cargo receptor activity
  directly_involved_in:
  - id: GO:0061723
    label: glycophagy
  - id: GO:0061753
    label: substrate localization to autophagosome
  - id: GO:0007041
    label: lysosomal transport
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0048471
    label: perinuclear region of cytoplasm
  supported_by:
  - reference_id: PMID:20810658
    supporting_text: When overexpressed in COSM9 cells, Stbd1 concentrated at enlarged perinuclear
      structures, co-localized with glycogen, the late endosomal/lysosomal marker LAMP1 and the
      autophagy protein GABARAPL1.
- description: >-
    Binds glycogen directly through the C-terminal CBM20 module; this is the cargo-recognition
    half of the receptor and is separable by point mutation from membrane targeting.
  molecular_function:
    id: GO:2001069
    label: glycogen binding
  directly_involved_in:
  - id: GO:0061723
    label: glycophagy
  locations:
  - id: GO:0048471
    label: perinuclear region of cytoplasm
  supported_by:
  - reference_id: PMID:20810658
    supporting_text: Point mutations in the CBM20 domain did not change the perinuclear localization
      of Stbd1, but glycogen was no longer concentrated in this compartment.
proposed_new_terms: []
suggested_questions:
- question: >-
    Is STBD1 the sole glycophagy receptor in mammals, or do other CBM-containing proteins act
    redundantly in tissues where Stbd1 loss has a mild phenotype?
  experts: []
suggested_experiments:
- hypothesis: >-
    STBD1's perinuclear glycogen compartment is a pre-lysosomal staging site rather than an
    autophagosome.
  description: >-
    Correlative light-electron microscopy of endogenously tagged STBD1 with glycogen and LAMP1
    under glucose starvation, scoring whether the perinuclear structures are double-membraned.
  experiment_type: imaging
