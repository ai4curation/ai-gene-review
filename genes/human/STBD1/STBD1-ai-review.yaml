- term:
    id: GO:0016020
    label: membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Bare membrane propagated phylogenetically; uninformative for a protein whose specific
      membrane anchor is known.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Same shape as the SL project's pattern A (bare parent retained alongside a specific
      child), reached here by phylogenetic propagation. STBD1 carries GO:0005789 endoplasmic
      reticulum membrane with experimental support and is a single-pass type III membrane
      protein, so the bare parent adds nothing. The objection is to granularity only; the
      IBA itself is sound, and the WITH/FROM column listing UniProtKB:O95210 alongside the
      PANTHER node reflects that this gene's own experimental annotation helped the curator
      place the ancestral assertion. See projects/SL.md for the pattern.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000386078
        source_label: STBD1/Stbd1 family node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The node-level assertion is sound; it is simply pitched at the bare membrane
          parent, which adds nothing over the experimentally supported GO:0005789 the target
          already carries. A granularity issue, not a propagation failure.
      - source_id: UniProtKB:O95210
        source_label: STBD1 (the target's own experimental evidence)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The target appears in its own WITH/FROM because its experimental annotation was one
          of the descendant evidences behind the curator's IBD. Not circular.
      - source_id: RGD:1311800
        source_label: Stbd1 (rat)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Rat ortholog is a genuine membrane protein, but transferring the bare parent rather
          than the specific membrane is the scoping problem, not the orthology.
