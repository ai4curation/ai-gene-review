- term:
    id: GO:0034045
    label: phagophore assembly site membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Phagophore assembly site membrane; the cited evidence shows perinuclear and lysosomal
      colocalization, not a PAS membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This is the STBD1 row of the section 5.4 triage in GO issue #29437, listed there under
      'no evident support - review for removal'. Reading the primary paper confirms that
      reading. PMID:20810658 places Stbd1 at enlarged perinuclear structures colocalized
      with glycogen, the late endosomal/lysosomal marker LAMP1, and GABARAPL1; it never
      examines the phagophore assembly site. Colocalization with an ATG8-family protein has
      been over-read into residence in a PAS membrane. GO:0034045 additionally asserts via
      bounding_layer_of a bounding membrane that the PAS, a protein condensate, does not
      have (PMID:32025038). No replacement term is proposed because the supported locations
      - GO:0048471 perinuclear region and the ER membrane - are already annotated on this
      gene, so there is nothing to move.
    supported_by:
    - reference_id: PMID:20810658
      supporting_text: When overexpressed in COSM9 cells, Stbd1 concentrated at enlarged perinuclear structures, co-localized with glycogen, the late endosomal/lysosomal marker LAMP1 and the autophagy protein GABARAPL1.
- term:
    id: GO:2001069
    label: glycogen binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Glycogen binding via the C-terminal CBM20 carbohydrate-binding module.
    action: ACCEPT
    reason: >-
      Direct and specific; the cargo half of the receptor function. CBM20 point mutations
      leave STBD1 perinuclear but abolish glycogen concentration there, separating binding
      from targeting.
- term:
    id: GO:2001070
    label: starch binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      Starch binding, a CBM20 domain-derived inference with no mammalian substrate.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The CBM20 module is named for starch binding in microbial and plant enzymes, and the
      term transfers with the domain. Mammals do not make starch; the physiological ligand
      is glycogen, already annotated as GO:2001069. This is a domain-family inference that
      does not survive organism context.
