suggested_questions:
- question: Which FRRS1L surfaces contact GluA subunits and CPT1c during receptor maturation, and how
    are these contacts released before mature receptor export? Coassembly and selective receptor association
    support the biogenesis role, but do not determine all pairwise contacts, stoichiometry or the transition
    mechanism.
- question: Does FRRS1L contact dynein intermediate chain directly, through an adaptor, or only share
    dynein-associated transport vesicles? Intact-vesicle immunoisolation in PMID:29276473 establishes
    carriage in a DIC-positive isolate without resolving the relevant binding interface.
- question: How does endogenous FRRS1L partition between somatic ER, dendritic or postsynaptic ER and
    the plasma membrane across neuronal types and maturation states? Selected older rodent localization
    experiments and expression-dependent surface observations leave the physiological distribution and
    compartment-specific roles incompletely resolved.
suggested_experiments:
- description: Reconstitute sequence-verified FRRS1L, CPT1c and defined GluA assemblies in a membrane-compatible
    system, with pairwise omissions and binding-interface mutations, to distinguish direct contacts from
    cooperative complex association.
- description: Compare intact-vesicle isolation with detergent-solubilized reciprocal association and
    purified-domain binding assays for FRRS1L and DIC; test candidate transport adaptors without equating
    vesicle recovery to direct binding.
- description: Use endogenous tagging and compartment-resolved imaging in human neurons, with rescue constructs
    tied to explicit sequence versions, to connect FRRS1L distribution to AMPAR maturation and surface
    delivery.
