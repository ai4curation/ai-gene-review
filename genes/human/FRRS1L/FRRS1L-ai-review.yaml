description: FRRS1L is a membrane-associated DOMON-domain protein that associates with AMPA-type glutamate
  receptors and supports their biogenesis in the endoplasmic reticulum. It cooperates with CPT1c in nascent
  receptor complexes and helps maintain functional receptor abundance at neuronal surfaces and postsynaptic
  membranes. Human neuronal-cell knockdown reduces AMPA-evoked responses, while rodent studies connect
  FRRS1L loss to impaired receptor maturation and reduced receptor levels. Biallelic loss-of-function
  variants cause severe neurodevelopmental disease with epilepsy and movement abnormalities.
