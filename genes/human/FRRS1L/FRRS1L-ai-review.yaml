core_functions:
- description: Binding to AMPA-type glutamate receptors within nascent ER-associated assemblies, cooperating
    with CPT1c to support receptor biogenesis and regulate receptor abundance and glutamatergic signaling.
    Receptor association is supported by selective affinity purification, co-IP and coassembly, including
    a reported human construct; the experiments do not resolve purified binary affinity. Endogenous localization
    and receptor-maturation mechanisms are principally established in rat and mouse preparations, with
    independent human SH-SY5Y functional support.
