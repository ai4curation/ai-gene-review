  review: &id003
    action: ACCEPT
    summary: Inherited control of postsynaptic receptor abundance is a characteristic FRRS1L function.
    reason: The actual PTHR46902 tree places human AN10/PTN002508553 below AN1/PTN002930507, and the literal
      IBD for GO:0099072 has RGD:1309978 as its descendant evidence. That rat identifier resolves to D3ZE85,
      whose exact current experimental records cite PMID:28675162. Rat perturbation and AMPAR-selective
      biochemical/electrophysiological experiments, independently complemented by mouse surface/total
      GluA1 deletion and rescue evidence in PMID:29276473 and receptor-maturation/fractionation evidence
      in PMID:30692144, support regulation of postsynaptic receptor levels. The role concerns AMPA receptors
      in the tested neuronal settings; it does not imply control of every receptor class or require FRRS1L
      itself to reside in the postsynaptic plasma membrane. The original ancestral node and literal donor
      remain intact.
    supported_by:
    - reference_id: PMID:28675162
    - reference_id: PMID:29276473
    - reference_id: PMID:30692144
