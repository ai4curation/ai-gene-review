    - ensembl:ENSMUSP00000052507
  review: &id001
    action: MODIFY
    summary: Refine complex binding to ionotropic glutamate receptor binding in AMPAR biogenesis.
    reason: 'The Ensembl IEA retains its mouse B1AXV0 orthology provenance. The exact mouse donor claim
      cites PMID:29276473: Figure 1A and the co-immunoprecipitation Methods show association of mouse
      FRRS1L with GluA1 or GluA2 in HEK cells. Independent PMID:28675162 identifies selective native rat
      AMPAR complexes and cooperative association with GluA1/A2 and CPT1c in heterologous experiments
      whose Methods list human FRRS1L NM_014334. GO:0035255 specifies the experimentally identified receptor
      partner more informatively than the original macromolecular-complex term. This is a biochemical
      association judgment based on co-IP, affinity purification and coassembly; it does not assert purified
      binary affinity, every pairwise contact, or sequence identity of the historical experimental clone
      to the current reference. Preserve the original evidence, qualifier and donor groups.'
    proposed_replacement_terms:
    - id: GO:0035255
      label: ionotropic glutamate receptor binding
    supported_by:
    - reference_id: PMID:29276473
    - reference_id: PMID:28675162
