biological_questions:
- question: Which FRRS1L surfaces contact GluA subunits and CPT1c during receptor maturation, and how
    are these contacts released before mature receptor export?
  rationale: Coassembly and selective receptor association support the biogenesis role, but do not determine
    all pairwise contacts, stoichiometry or the transition mechanism.
- question: Does FRRS1L contact dynein intermediate chain directly, through an adaptor, or only share
    dynein-associated transport vesicles?
  rationale: Intact-vesicle immunoisolation in PMID:29276473 establishes carriage in a DIC-positive isolate
    without resolving the relevant binding interface.
- question: How does endogenous FRRS1L partition between somatic ER, dendritic or postsynaptic ER and
    the plasma membrane across neuronal types and maturation states?
  rationale: Selected older rodent localization experiments and expression-dependent surface observations
    leave the physiological distribution and compartment-specific roles incompletely resolved.
