    - ensembl:ENSMUSP00000052507
  review: &id002
    action: UNDECIDED
    summary: Dynein intermediate-chain binding remains unresolved by the intact-vesicle assay.
    reason: This Ensembl IEA traces to mouse B1AXV0 IPI evidence in PMID:29276473. The selected Vesicle
      Immunoisolation Methods and Figure 2 describe anti-DIC isolation of detergent-free hippocampal membrane
      vesicles containing FRRS1L and AMPARs. The antibody target does not establish which vesicle protein
      contacts the intermediate chain. The exact GO term requires binding to that chain, whereas the inspected
      experiment resolves vesicle association. Retain the original assertion as undecided pending evidence
      that distinguishes direct or complex-mediated FRRS1L association with DIC from carriage in the same
      vesicle. This assay limitation neither demonstrates absence of the activity nor establishes a curation
      or species error.
    supported_by:
    - reference_id: PMID:29276473
