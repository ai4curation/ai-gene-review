  review:
    summary: FOXN1 is a DNA-binding transcriptional activator.
    action: ACCEPT
    reason: The exact mouse Q61575 donor has IDA and IMP annotations to this same term from PMID:9108066.
      Its selected original Methods and Results show sequence-specific mouse Whn binding and activation
      of a binding-site reporter in BHK cells. PMID:8790387 separately maps a transcriptional activation
      region using mouse and pufferfish GAL4 fusions. Direct human FOXN1–DNA structural and biochemical
      evidence in PMID:31914405 supports conservation of the binding function. Retain the human orthology
      assertion as a core capacity, while distinguishing the rodent activation experiments from the human
      binding experiments.
    supported_by:
    - reference_id: PMID:9108066
    - reference_id: PMID:8790387
    - reference_id: PMID:31914405
