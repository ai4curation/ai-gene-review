description: FOXN1 is a nuclear forkhead DNA-binding transcriptional activator that supports epithelial
  differentiation in the thymus and skin. Its central forkhead domain recognizes regulatory DNA motifs,
  while its C-terminal region contributes to transcriptional activation and efficient DNA binding. FOXN1-dependent
  epithelial programs establish and maintain a thymic environment that supports T-cell production and
  contribute to hair and keratinocyte differentiation. Human loss-of-function variants can cause thymic
  and ectodermal abnormalities. Effects on hematopoietic progenitors and thymic vascularization in mouse
  models can arise through the surrounding niche rather than through FOXN1 activity in the affected blood
  or endothelial cells.
