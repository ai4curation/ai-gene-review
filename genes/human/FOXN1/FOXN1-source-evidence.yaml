biological_questions:
- question: Which FOXN1-dependent signals from epithelial or marrow niche cells control progenitor production
    and lineage choice?
  rationale: The mouse niche experiments separate FOXN1-positive support cells from FOXN1-negative HSC/MPP,
    but do not by themselves identify direct target genes or the irreversible commitment step.
- question: Which FOXN1 partners participate in endogenous transcriptional complexes in thymic or skin
    epithelium?
  rationale: The exact HuRI interactions and partner isoforms are retained, but their physiological sites,
    targets and regulatory consequences remain unresolved.
- question: How do the C-terminal region and local DNA context regulate FOXN1 binding in cells?
  rationale: Human biochemical preparations support a C-terminal contribution to binding and sensitivity
    to motif methylation; their behavior does not establish the native oligomeric state or a causal mechanism
    of thymic aging.
