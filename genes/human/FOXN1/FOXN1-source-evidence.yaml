- raw_index: 0
  stored_index: 1
  review:
    summary: FOXN1 recognizes sequence-specific RNA polymerase II regulatory DNA.
    action: MODIFY
    reason: The original IBA is grounded in a literal positive IBD at PTN000930751 on the human FOXN1
      lineage. Human FOXN1 residues 270–366 directly recognize an FHL motif from the mouse Psmb11 promoter
      in PMID:31914405; longer human preparations also bind mouse Psma7 regulatory probes. Together with
      the rodent promoter-reporter experiments, these support the more specific RNA polymerase II cis-regulatory
      sequence-binding term GO:0000978. The promoter DNA is mouse, the structural protein is human, and
      the intended full-length bacterial preparation was truncated at residue 614; no natural isoform
      or direct human-cell reporter assay is inferred.
    supported_by:
    - reference_id: PMID:31914405
    - reference_id: PMID:9108066
    proposed_replacement_terms:
    - id: GO:0000978
      label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000930751
        source_label: PTN000930751
        source_status: SUPPORTS_TRANSFER
        comment: The literal positive GO:0000976 IBD at this node uses ZFIN:ZDB-GENE-021008-1 and lies
          on the verified human FOXN1 lineage in the retained PTHR46721 tree. The genuine normal PAINT
          slice preserves the same node, term and donor. Transfer of regulatory-region binding is supported;
          the refinement to GO:0000978 reflects independently established sequence specificity, not a
          bad source annotation or failed inheritance.
