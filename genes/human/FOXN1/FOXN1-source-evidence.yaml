  stored_index: 2
  review:
    summary: The inherited transcription-factor activity is retained through a more specific activator
      activity.
    action: TOO_GENERAL
    reason: The actual PTHR46721 tree and alignment place the human sequence below the positive PTN000930751
      IBD for this function. This is a sound phylogenetic assertion, rather than a weak pairwise transfer.
      GO:0001228, retained from the existing activator annotation, is an is_a child of GO:0000981 and
      better describes the supported positive transcriptional role. The granularity judgment does not
      reject the IBD or alter its donors.
    supported_by:
    - reference_id: PMID:9108066
    - reference_id: PMID:31914405
- raw_index: 2
  stored_index: 3
  review:
    summary: The transcription-factor classification is covered by the specific activator activity.
    action: TOO_GENERAL
    reason: The original tfclass:3.3.1 ISA classification agrees with the forkhead protein and its experimentally
      supported DNA-binding and activating functions. The existing GO:0001228 activator annotation is
      an is_a descendant of GO:0000981. Apply the same gene-level granularity judgment as for the independent
      IBA, without treating a different evidence method as a different biological function.
    supported_by:
    - reference_id: PMID:9108066
    - reference_id: PMID:31914405
