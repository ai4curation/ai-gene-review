    summary: FOXN1-dependent thymic epithelial signals support T-cell lineage commitment.
    action: KEEP_AS_NON_CORE
    reason: The original mouse Q61575 donor traces to PMID:24184560, whose marrow niche and progenitor
      results do not isolate irreversible T-lineage commitment. Independently, PMID:27548434 directly
      identifies Dll4 as a Foxn1 target in thymic epithelial cells and shows reduced early T-lineage progenitors
