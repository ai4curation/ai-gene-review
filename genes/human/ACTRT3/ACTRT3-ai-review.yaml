  knowledge_gaps:
  - gap_statement: >-
      It is not known what ACTRT3 does within the perinuclear theca beyond being present in it:
      whether it is a load-bearing element of the scaffold, an adaptor that recruits other theca
      proteins, or a nucleotide-dependent switch that changes the scaffold's state.
    boundary: >-
      Established: ACTRT3 is in the perinuclear theca by immunodetection in mouse spermatids;
      co-immunoprecipitates with ACTRT1, ACTRT2, ACTL7A, SPEM2 and ZPBP; its loss disrupts theca
      structure, acrosome biogenesis and ZPBP placement; and it retains 17 of 19 nucleotide-site
      contacts of beta-actin, the joint best of the eight divergent human actin-like proteins.
      Also established: it retains only 18 of 38 protomer-interface contacts, well below the 28 of
      the weakest polymerising actin-fold protein, so it is unlikely to be a filament subunit. Not
      established: whether it binds a nucleotide at all, whether it hydrolyses one, and whether any
      of its theca partnerships are direct.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    significance: >-
      The answer decides whether the correct molecular function stays at structural molecule
      activity or becomes a nucleotide-dependent activity or a protein-recruitment function, and it
      decides whether the acrosome phenotype is a direct consequence of scaffold failure or an
      indirect consequence of losing a partner such as PFN3.
    resolution: >-
      Measure nucleotide binding and any hydrolysis on recombinant ACTRT3 directly; test which
      theca co-immunoprecipitations survive purification of recombinant components; and separate
      the scaffold role from the PFN3 role with a targeted mutation in the profilin-binding
      surface, which this review's 2BTF analysis localises.
- description: >-
    Binds the testis-specific profilin PFN3, forming a mutually stabilising complex that is
    detected in the spermatid and sperm nucleus and not in the cytoplasm. The two proteins depend
    on each other for their levels: ARPM1 is undetectable in the nuclear fraction of Pfn3-null
    testes and sperm, and PFN3 levels are reduced in Actrt3-null mice. Because profilin normally
    binds actin's barbed-end face and sequesters monomers, this partnership is the clearest
    indication that ACTRT3 behaves as an actin-fold monomer engaging an actin-monomer-binding
    protein rather than as a filament subunit; the corresponding surface of beta-actin is retained
    in ACTRT3 at 16 of 21 contacts, and across the ARP-T clade generally.
