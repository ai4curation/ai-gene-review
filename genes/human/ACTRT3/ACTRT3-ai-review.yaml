  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: >-
      Ensembl Compara transfer from mouse Actrt3 (Q8BXF8), which holds this exact term by IDA from
      PMID:18692047. The donor is a genuine 1:1 orthologue and not a paralogue - 79.4 per cent
      globally identical to human ACTRT3 against 47.0 per cent local identity to beta-actin - so
      this is ortholog transfer of a directly observed location, the strongest row shape in this
      record. The ACRV1 check was run and comes back negative: the donor holds GO:0001673 itself,
      not a descendant, so the propagation lands at the donor's own level and no downward MODIFY is
      warranted. The underlying observation is that ArpM1 protein first appears in the round
      spermatid and changes its nuclear localisation dynamically through spermiogenesis, and the
      dependency is genetically corroborated: in Pfn3-null mice ARPM1 is undetectable in the
      nuclear fraction of testes and sperm, and the nuclei of Pfn3-null spermatozoa are devoid of
      ARPM1.
    action: ACCEPT
    reason: >-
      Ortholog transfer of an experimentally observed location, at the right level of specificity,
      corroborated by an independent genetic experiment in the same organism. This is one of the
      two locations that define where ACTRT3 acts.
