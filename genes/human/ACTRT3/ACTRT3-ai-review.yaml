- term:
    id: GO:0033011
    label: perinuclear theca
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: >-
      Ensembl Compara transfer from mouse Actrt3, which holds this exact term by IDA. The
      supporting reference on the donor is PMID:35793634, a 2022 Cell Reports paper titled for
      CCIN/Calicin - a different gene - which reports that Calicin interacts with itself and many
      other perinuclear-theca components; the Actrt3 localisation call was made by a curator from
      its full text, which is not in the cache and whose abstract does not name Actrt3, so the call
      is accepted rather than re-derived. Querying QuickGO by that reference rather than by gene
      establishes what kind of evidence it is, which matters because several rows in this family
      have turned out to be complex-to-subunit projections. PMID:35793634 carries GO:0033011 by IDA
      for 12 mouse perinuclear-theca proteins - Actl9, Actrt1, Actrt2, Actrt3, Capza3, Capzb, Ccin,
      Cylc1, Fabp9, Gsto2, H2bl1 and Wbp2nl - all assigned by UniProt rather than by ComplexPortal.
      The discriminating signal is that the paper's *functional* row, GO:0007286 spermatid
      development by IMP, is confined to Ccin alone, the one gene actually knocked out: a projection
      spreads the phenotype across the set, and this curator did not. So these are twelve
      per-protein localisation calls from one immunolocalisation study, not one finding written
      twelve times. It is also independently confirmed by the dedicated knockout study, which states
      that ACTRT3 is localized in the perinuclear theca of murine spermatids and places it in a
      theca assembly with ACTRT1, ACTRT2, ACTL7A and SPEM2. As with the nucleus row, the donor holds
      this exact term and not a descendant, so no downward refinement applies. A useful side effect
      of the same query: it puts ACTRT1, ACTRT2 and ACTL9 in the theca by IDA independently of the
      2026 co-immunoprecipitations, which is what makes the ARP-T clade a theca clade rather than an
      inference from one paper.
    action: ACCEPT
    reason: >-
      Ortholog transfer of a directly observed location, established in 2022 and independently
      confirmed by a 2026 knockout study, and the most specific compartment term GO offers for
      where this protein sits. This is the core location of ACTRT3.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q8BXF8
        source_status: SUPPORTS_TRANSFER
