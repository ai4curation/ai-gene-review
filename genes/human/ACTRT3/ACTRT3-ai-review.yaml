- id: PMID:11750065
  title: Identification of two cDNAs for human actin-related proteins (Arps) that have
    remarkable similarity to conventional actin.
  findings:
  - statement: >-
      The paper that named the gene, reporting hArpM1 (ACTRT3) and hArpM2 (ACTRT2) together. Any
      ARPM-keyed search therefore returns both genes and the M1/M2 suffixes must be resolved before
      a claim is attributed to either.
    supporting_text: We identified two cDNAs coding for the novel human actin-related proteins
      (Arps) hArpM1 and hArpM2.
  - statement: >-
      A sequence-level prediction that the nucleotide site is preserved, made in 2001 and confirmed
      by measurement in this review: 17 of 19 computed ATP/cation contacts of beta-actin are
      chemically compatible in ACTRT3, the joint-best score among the eight divergent human
      actin-like and actin-related-T proteins.
    supporting_text: Both of them show remarkable similarity to conventional actin, and the
      ATP-binding motif and nuclear-export signals of actin are highly conserved.
  - statement: >-
      The sole evidence behind UniProt's "Ubiquitously expressed" tissue-specificity line. It is an
      mRNA survey with an explicit abundance caveat, and the same UniProt entry's own
      cross-references record HPA "Tissue enriched (testis)".
    supporting_text: Their mRNAs are expressed in all tested human tissues, but in smaller amounts
      than that of actin.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, not retracted, abstract only. Sound for what it reports (two cDNAs, broad
      low-level transcript, conserved ATP motif). It is weaker than it is often used for: it is
      transcript-level, pre-dates quantitative RNA-seq, and says nothing about protein.
- id: PMID:18692047
  title: Nuclear localization of profilin III-ArpM1 complex in mouse spermiogenesis.
  findings:
  - statement: >-
      Establishes the mouse orthologue as testis-exclusive and confined to haploid germ cells,
      which is the protein-level counterpart to the transcript survey in PMID:11750065 and the
      main reason to read UniProt's "ubiquitously expressed" line narrowly.
    supporting_text: we demonstrate here that mouse ArpM1, which closely resembles the conventional
      actin, is expressed exclusively in the testis, particularly in haploid germ cells
  - statement: >-
      The source of the male-germ-cell-nucleus IDA that reaches human ACTRT3 by Compara transfer.
    supporting_text: ArpM1 protein first appears in the round spermatid and changes its
      localization dynamically in the nucleus during spermiogenesis.
  - statement: >-
      The experiment behind the ARP-T3-profilin interaction. GOA records it on the mouse entry as a
      bare GO:0005515 protein binding IPI with WITH/FROM UniProtKB:Q9DAD6, which resolves to
      PROF3_MOUSE (Pfn3, 137 aa, Swiss-Prot), so the partner is a profilin and the specific term
      GO:0005522 profilin binding is available on both the mouse and the human side.
    supporting_text: By co-immunoprecipitation analysis, profilin III was identified as
      ArpM1-interacting protein.
  - statement: >-
      The authors' own framing of the complex's role, stated as a suggestion rather than a
      demonstration.
    supporting_text: Our findings suggest that the testis-specific profilin III-ArpM1 complex may
      be involved in conformational changes in the organization of the sperm-specific nucleus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, not retracted, abstract only in the cache. Directly supports the GO:0001673
      IDA on the mouse orthologue and the proposed GO:0005522 row. The abstract states the
      co-immunoprecipitation result plainly, so no full-text inference is required for that claim.
- id: PMID:34869336
  title: Loss of Profilin3 Impairs Spermiogenesis by Affecting Acrosome Biogenesis, Autophagy,
    Manchette Development and Mitochondrial Organization.
  findings:
  - statement: >-
      Reciprocal genetic evidence for the PFN3-ARPM1 partnership: in the Pfn3 knockout, ARPM1 is
      undetectable in the nuclear fraction. This is a stability dependency, not merely
      co-purification, and it is the second independent strand supporting profilin binding.
    supporting_text: Western blot showed that ARPM1 could not be detected in the nuclear fraction
      of Pfn3-deficient testes and sperm, while cytoplasmic ARPM1 protein levels in testes are
      slightly reduced in Pfn3-deficient mice
  - statement: >-
      The same result confirmed by a second method, immunohistochemistry.
    supporting_text: the nucleus of spermatozoa in testes of Pfn3-deficient mice were devoid of
      ARPM1
  - statement: >-
      The complex is compartment-restricted, which matters for the nuclear-localisation rows: it is
      detected in the sperm nucleus and not in the cytoplasm.
    supporting_text: PFN3 is detected in a complex with ARPM1, specifically in the sperm nucleus,
      however, not in the cytoplasm
  - statement: >-
      The result that argues against refining the cytoskeleton-organization row to an
      actin-specific child. In the one in vivo setting where ARPM1 is depleted from the nuclear
      fraction, F-actin organisation was not altered. This does not contradict the Actrt3 knockout
      (different compartment, indirect depletion, and cytoplasmic ARPM1 persists) but it does mean
      the actin-remodelling link is not robust enough to license a specificity upgrade.
    supporting_text: Interestingly, in the mid-piece of the sperm flagellum, actin organization
      seemed not affected.
  - statement: >-
      The qualification that keeps the preceding result from being over-read: ARPM1 is not absent
      from Pfn3-null sperm, only from the nuclear fraction.
    supporting_text: In sperm cytoplasm of Pfn3–/– mice, a moderate signal of ARPM1 can still be
      detected
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, not retracted, full text cached and read. The only reference here with full
      text, and reading past the ARPM1 sentences was decisive: the section "F-Actin Organization Is
      Not Altered in Pfn3-Deficient Sperm" bears directly on the cytoskeletal rows and would have
      been missed by a symbol-keyed search.
- id: PMID:35793634
  title: The perinuclear theca protein Calicin helps shape the sperm head and maintain the
    nuclear structure in mice.
  findings:
  - statement: >-
      The reference cited by the mouse Actrt3 GO:0033011 perinuclear-theca IDA, and therefore the
      original basis for the two perinuclear-theca rows on human ACTRT3. The paper is titled for
      CCIN/Calicin, a different gene, and reports interactions among many perinuclear-theca
      components; the Actrt3 localisation call was made by a curator from its full text, which is
      not in the cache.
    supporting_text: We show that Calicin interacts with itself and many other PT components,
      indicating it may serve as an organizing center of the PT assembly.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, not retracted, abstract only. The cached abstract does not name Actrt3, so
      nothing about ACTRT3 is quoted from it and the curator's experimental call is not
      second-guessed. Listed because it establishes that the perinuclear-theca localisation dates
      from 2022, four years before the dedicated knockout paper, and because it is absent from the
      deep-research record - a paper titled for another gene holding this gene's evidence.
- id: PMID:41668650
  title: Actin-related protein T3 is required for acrosome biogenesis and sperm function in
    mice.
  findings:
  - statement: >-
      The dedicated knockout study. Confirms the perinuclear-theca localisation independently of
      PMID:35793634.
    supporting_text: Actin-related protein T3 (ACTRT3) is localized in the perinuclear theca (PT)
      of murine spermatids.
  - statement: >-
      The loss-of-function phenotype, which is entirely absent from the current GO record for this
      gene and is the basis for the proposed GO:0001675 acrosome assembly row.
    supporting_text: We generated Actrt3-/- male mice and showed that they are subfertile, with
      defects of the acrosome first observed during cap phase.
  - statement: >-
      The mechanism behind the acrosome defect, and the reason GO:0001675 (defined as formation of
      the acrosome from the spermatid Golgi) fits the phenotype's mechanism and not only its
      outcome.
    supporting_text: Actrt3 deficiency causes reduced protein levels of the trans-Golgi network
      markers TGN46 and GOPC and mislocalization of the cis-Golgi protein GM130.
  - statement: >-
      Places ACTRT3 in a perinuclear-theca protein assembly with ACTRT1, ACTRT2, ACTL7A and SPEM2 -
      i.e. its own clade plus another divergent actin-like theca protein - rather than with
      conventional actin.
    supporting_text: co-immunoprecipitation revealed interaction of ACTRT3 with the PT proteins
      ACTRT1, ACTRT2, ACTL7A, SPEM2 and the sperm surface protein ZPBP
  - statement: >-
      The authors' scaffold interpretation, which is what a structural-molecule-activity term
      expresses.
    supporting_text: This suggested that ACTRT3 is a part of the complex 3D scaffold of the PT and
      contributes to ZPBP localization.
  - statement: >-
      The actin-remodelling evidence, from over-expression in a heterologous cell line and hedged
      by the authors. Weighed against the contrary in vivo observation in PMID:34869336, it is not
      sufficient to refine the cytoskeleton-organization row to an actin-specific child.
    supporting_text: Expression of Actrt3 caused changes in HEK239T cell shape and F-actin filament
      distribution, suggesting a role in cytoskeletal shaping.
  - statement: >-
      Co-enrichment of two actin regulators, a further but indirect strand of the actin link.
    supporting_text: Mass spectrometry revealed enrichment of cytoskeletal regulators such as CFL1
      and CNN1.
  - statement: >-
      The authors' overall conclusion, which includes a contribution to perinuclear-theca structure
      - the fact that makes GO:0005200 arguable on grounds unrelated to the phylogenetic transfer
      that actually carries it.
    supporting_text: We conclude that lack of ACTRT3 affects acrosome biogenesis, PT structure and
      actin remodeling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Verified by efetch because esummary returned no record for this very recent PMID (Development
      153(3):dev205283, 1 Feb 2026; PublicationTypeList is Journal Article only, no
      CommentsCorrections, not retracted). Abstract only in the cache. Note that the
      deep-research record lists this study twice, once as PMID:41668650 and once as a bioRxiv DOI
      in a PMID-shaped field; the two are the same study, not independent corroboration.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: >-
      BioPlex 3.0, the source of the single GO:0005515 row. IntAct returns exactly two records for
      Q9BYD9 and both are this one anti-tag co-immunoprecipitation with PDCL3 (MI score 0.5), one
      of them a spoke expansion, so UniProt's NbExp=2 is one experiment counted twice.
    supporting_text: Dual proteome-scale networks reveal cell-specific remodeling of the human
      interactome
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, not retracted, full text cached. A high-quality dataset that here yields one
      partner and no complex. The contrast with the merged ACTR1B review, which kept its row from
      this same publication, is instructive: there the partner set was coherent with assembled
      dynactin (DCTN1-DCTN6, CAPZ, ACTR10, ACTR1A). The difference is the partner set, not the
