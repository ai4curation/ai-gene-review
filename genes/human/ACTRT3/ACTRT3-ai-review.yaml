- term:
    id: GO:0015629
    label: actin cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Family-level inference from the broad, pan-eukaryotic actin node PTN002631484, whose 24
      protein donors are 23 conventional actins spanning animals, fungi, amoebae, nematodes and an
      apicomplexan plus Drosophila Arp53D, and all 24 of which carry their own experimental
      annotation for this term or a descendant. So no source-weakness objection is available. Two
      considerations pull in opposite directions and neither wins outright. Against the row, the
      donor set is homogeneous - every donor is a filament-forming actin, so its actin-cytoskeleton
      residence is filament residence - and ACTRT3 retains only 18 of the 38 computed F-actin
      protomer-interface contacts as chemically compatible, against 38 for conventional actins, 33
      for the divergent but polymerising Arp53D and 28 for the dynactin Arp1 paralogues. For the
      row, GO:0015629 is defined to include actin-cytoskeleton-associated complexes and not only
      filaments, ACTRT3 is the highest-identity divergent member of this node at 49.7 per cent to
      beta-actin, and its score sits above ACTL8's 11 of 38 - while Arp3 scores 8 of 38 and Arp2
      22, yet both occupy protomer positions at an Arp2/3 branch. That last control is the reason
      the metric cannot be pushed further: it bounds canonical incorporation into a conventional
      two-stranded filament, not occupancy of any position in an actin-containing structure.
      Independent evidence is genuinely mixed - Actrt3 over-expression altered F-actin distribution
      in HEK293T cells and CFL1 and CNN1 are enriched interactors, but in Pfn3-null mice, where
      ARPM1 is lost from the nuclear fraction, sperm actin organisation was not affected. Also
      relevant to the qualifier: is_active_in asserts that the molecular function is executed here,
      and no activity of ACTRT3 has been measured anywhere; located_in would be the more defensible
      qualifier. Note finally that GO:0033011 perinuclear theca, which this gene does hold, is a
      descendant of GO:0005856 cytoskeleton but not of GO:0015629, so this row is an independent
      claim rather than a redundant ancestor of one already supported.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept because nothing contradicts it and the term is broad enough that an actin-associated
      protein qualifies without polymerising; marked non-core because no experiment has placed
      ACTRT3 in the actin cytoskeleton, the donor set supports filament residence that the
      interface measurement does not license, and this gene's core cellular location is the
      perinuclear theca. This matches the merged ACTL8 review, which gave the identical row - same
      node, same 25 WITH/FROM tokens - the same action on the same reasoning, and ACTL8 scores
      worse on the interface than ACTRT3 does.
