id: Q9BYD9
gene_symbol: ACTRT3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Actin-related protein T3 (ARP-T3, also called ARPM1) is a divergent member of the actin family,
  about 50 per cent identical to cytoplasmic beta-actin, whose transcript is broadly detectable but
  strongly testis-enriched and whose protein has so far been found only in haploid male germ cells.
  During spermiogenesis it appears in round spermatids, where it occupies the nucleus and forms a
  mutually stabilising complex with the testis-specific profilin PFN3, and the perinuclear theca,
  the condensed layer that encases the sperm nucleus. Within the theca it associates with the other
  theca proteins ACTRT1, ACTRT2, ACTL7A and SPEM2 and with the sperm-surface protein ZPBP, behaving
  as a component of the theca's three-dimensional scaffold and contributing to ZPBP placement. Loss
  of the mouse protein causes subfertility in which acrosome formation fails from the cap phase
  onward, trans-Golgi markers are depleted and a cis-Golgi marker is mislocalised, and autophagy
  markers fall, indicating that ARP-T3 supports the Golgi-derived membrane traffic on which
  acrosome biogenesis depends. Structurally it retains the nucleotide-binding core of the actin
  fold almost intact while having lost most of the residues by which conventional actins contact
  one another within a filament, a combination characteristic of a monomeric nucleotide-binding
  scaffold protein rather than a polymer subunit.
