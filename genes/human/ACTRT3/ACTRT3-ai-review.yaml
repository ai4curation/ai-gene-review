          Conventional actin (Actg1). QuickGO evidence for the donated term on this entry:
          IBA,IDA,ISO. The donor set spans three unrelated polymer systems, so GO:0005200 is a
          defensible least common ancestor for the node; what it does not do is license the
          specific term for a member that has lost the polymerisation interface and has no
          ARP-T donor in the set.
