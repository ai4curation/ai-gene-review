- term:
    id: GO:0007010
    label: cytoskeleton organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      An inter-ontology inference whose WITH/FROM is not a gene product but the GO term GO:0005200,
      so it carries no evidence independent of the molecular-function row above. That matters here
      because this review generalises GO:0005200 to GO:0005198, from which no such inter-ontology
      link runs - so the row's machine provenance lapses. The term nonetheless stands on its own
      merits, from evidence the pipeline never saw: the Actrt3 knockout disrupts perinuclear-theca
      structure, and GO classifies the perinuclear theca under GO:0005856 cytoskeleton. The
      merged ACTL7A review refined its identical row to GO:0030036 actin cytoskeleton organization;
      I decline that refinement here because the actin-specific evidence does not survive being
      read in full. Over-expression of Actrt3 in HEK293T altered F-actin distribution and CFL1 and
      CNN1 are enriched interactors, but in Pfn3-null mice, where ARPM1 is absent from the nuclear
      fraction, sperm actin organisation was explicitly reported as not affected. Those results are
      not strictly contradictory - different compartment, indirect versus direct perturbation, and
      cytoplasmic ARPM1 persists in the Pfn3 knockout - but together they are not a basis for
      asserting an actin-specific process.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is true at this level of generality and should not be removed, but it is derivative:
      it carries no evidence of its own, its inter-ontology basis lapses if GO:0005200 is
      generalised as proposed, and the specific process this gene is required for is acrosome
      assembly, proposed separately. It should not be read as ACTRT3 having a demonstrated
      cytoskeletal-remodelling role.
    propagation_review:
      root_cause: EVIDENCE_CIRCULAR_OR_REDUNDANT
      failure_modes:
      - CIRCULAR_PROPAGATION
      source_entities:
      - source_id: GO:0005200
        source_status: CIRCULAR_OR_REDUNDANT
        source_label: a GO term used as the WITH/FROM source, not a gene product
        comment: >-
          The inference runs from this gene's own molecular-function row, so it adds no
          independent evidence and its validity is entirely contingent on that row. This review
          proposes replacing GO:0005200 with GO:0005198, which has no inter-ontology link to
          GO:0007010, so the derivation would no longer hold even though the term itself remains
          defensible on knockout evidence.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:33961781
  qualifier: enables
  review:
    summary: >-
      One partner, PDCL3 (Q9H2J4, reviewed, 239 aa - canonical, so no unreviewed clone or ORFeome
      fragment has been substituted for the real gene), from one experiment. IntAct returns exactly
      two records for Q9BYD9 and both are the same BioPlex 3.0 anti-tag co-immunoprecipitation with
      an MI score of 0.5, one of them a spoke expansion of the bait-prey pull-down, so UniProt's
      NbExp=2 is a single experiment counted twice rather than a replicate. Querying QuickGO by the
      reference puts the row in proportion: PMID:33961781 accounts for 9514 GOA annotations in
      total, of which 9508 are GO:0005515 itself. Those are filtered-query totals rather than a
      page of results, and the distinction earns its keep here - a 200-row sample of that reference
      hid the other five, which are GO:0005813 centrosome rows assigned by ComplexPortal: one
      complex-level observation projected onto the ted-tubulin complex and its four subunits. None
      of them touches ACTRT3, but it is worth recording that the very reference used elsewhere in
      this review to illustrate what is *not* a projection does carry a projection tail. Assigning
      databases sum exactly to the total (IntAct 9509, ComplexPortal 5), so a claim that everything
      from this publication comes from IntAct would be false. What raises this above
      an unexplained screen hit is that the partner explains itself away: PDCL3, also called
      PhLP2A, is a CCT/TRiC co-chaperone which UniProt records as inhibiting the folding activity
      of the chaperonin-containing T-complex and thereby inhibiting cytoskeletal actin folding.
      Actin is an obligate CCT client, and BioPlex was run in HEK293T and HCT116, cell types in
      which ACTRT3 protein has not been detected - so co-purification of an over-expressed, tagged
      actin-fold polypeptide with a CCT co-chaperone is the most expected artefact of this assay
      rather than a physiological partnership. It is mildly informative in the other direction: it
      indicates the ACTRT3 polypeptide is recognised as a foldable actin-fold client. No MODIFY
      target exists, because the informative statement would be about the chaperonin machinery's
      activity on ACTRT3, not about a binding function of ACTRT3.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      An uninformative binding term resting on one high-throughput affinity-purification experiment
      with a single partner, in cell types where the protein is not natively expressed, and with a
      folding-pathway explanation that accounts for it without any biological interaction. This
      follows the merged ACTL8 and ACTR10 reviews rather than the merged ACTR1B review, which kept
      its row from this same publication - the difference is that ACTR1B's partner set was coherent
      with assembled dynactin, whereas here there is one partner and no complex. The gene's
      genuinely informative binding partner, PFN3, is absent from GOA entirely and is proposed
      below as GO:0005522.
    supported_by:
    - reference_id: file:human/ACTRT3/ACTRT3-bioinformatics/reference_scope.json
      supporting_text: 'PMID:33961781: 9514 annotations total, 200 rows examined (TRUNCATED), 2 terms seen, 1
        unaccounted; codes IPI; assignedBy ComplexPortal=5,IntAct=9509'
