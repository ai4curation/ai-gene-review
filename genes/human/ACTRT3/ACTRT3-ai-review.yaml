          same term the human row receives.
      - source_id: ensembl:ENSMUSP00000048360
        source_status: NOT_RELEVANT
        source_label: Ensembl protein identifier for the same mouse Actrt3 gene
        comment: >-
          The pipeline's internal handle on the same donor, not additional evidence.
    supported_by:
