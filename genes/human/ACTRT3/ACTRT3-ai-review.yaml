  - reference_id: file:human/ACTRT3/ACTRT3-bioinformatics/RESULTS.md
    supporting_text: '| profilin_interface | 21 | ACTRT1 17, ACTRT2 17, ACTRT3 16, ACTL7A 16,
      ACTL9 12, ACTL7B 10, ACTL8 10, ACTL10 4 |'
  knowledge_gaps:
  - gap_statement: >-
      Whether the PFN3-ARPM1 interaction is direct, and whether it uses the surface of ACTRT3 that
      corresponds to profilin's binding site on beta-actin.
    boundary: >-
      Established: the two proteins co-immunoprecipitate from mouse testis, each is required for
      the other's normal level, and the complex is nuclear rather than cytoplasmic. Also
      established computationally: 16 of the 21 residues by which beta-actin contacts profilin in
      PDB 2BTF are chemically compatible in ACTRT3. Not established: directness, stoichiometry,
      affinity, or which residues actually form the interface.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    significance: >-
      A direct interaction through the canonical profilin surface would make ACTRT3 a genuine
      actin-monomer mimic and would explain why it is nuclear only in the presence of PFN3; an
      indirect association within a larger theca assembly would make the mutual destabilisation a
      complex-assembly effect instead, and would remove the basis for a specific binding function.
    resolution: >-
      Pull-down and isothermal titration calorimetry with recombinant human ACTRT3 and PFN3,
      followed by mutation of the predicted contact residues identified from the 2BTF alignment.
suggested_questions:
- question: >-
    Should the GO:0005200 rejection sweep in PANTHER family PTHR11937 be extended to the ARP-T
    branch, and if so should the general parent GO:0005198 be substituted as it was for ACTL7A and
    ACTL7B? GO:0005200 is asserted once in this family, at PTN000940351, and has since been
    explicitly negated at eight descendant nodes covering thirteen human genes - ACTR5, ACTR6, ACTR8,
    ACTL6A, ACTL6B, ACTL7A and ACTL7B on 2025-08-05, then ACTR2, ACTR3, ACTR3B, ACTR3C, ACTR1A and
    ACTR1B on 2026-04-16. The genes still receiving it from that node are the conventional actins
    ACTA1, ACTA2, ACTC1 and ACTG2, ACTR10 (which has its own orthologue in the seed set), and five
    un-adjudicated divergent genes: ACTL9, ACTL10, ACTRT1, ACTRT2 and ACTRT3. One node-level edit at
    the ancestor of that divergent set would settle all five human genes at once, following the
    template PAINT already used at PTN008986528, where the specific term was negated and GO:0005198
    asserted in its place on the same day. Stated here once for all five genes rather than repeated
    per gene.
- question: >-
    Can GO:0005200 be re-earned by the perinuclear-theca proteins on evidence of their own, and if
    so should ACTL7A's removal be revisited at the same time? Read by its definition - the action of
    a molecule that contributes to the structural integrity of a cytoskeletal structure - GO:0005200
    arguably fits the theca proteins directly, because GO places GO:0033011 perinuclear theca under
    GO:0005856 cytoskeleton and knockouts of ACTRT3 and ACTL7A both disrupt theca or acroplaxome
    structure. That is a different and better basis than the phylogenetic transfer from filament
    actins that currently carries the term. It cannot be settled gene by gene: ACTL7A is a theca
    protein with GO:0033011 by IDA whose merged review removed GO:0005200, so acting on the theca
    argument for ACTRT3 alone would make the two reviews inconsistent. The set to decide together is
    ACTRT1, ACTRT2, ACTRT3, ACTL7A and ACTL9. Note the complication that GO:0033011's own definition
    cautions that most theca constituents are not traditional cytoskeletal proteins.
  experts:
  - Hubert Schorle
  - Su-Ren Chen
- question: >-
    Should UniProt's tissue-specificity line for ACTRT3, "Ubiquitously expressed", be revised? The
    line is attributed to PMID:11750065, whose actual statement is that the mRNAs are expressed in
    all tested human tissues but in smaller amounts than actin - a 2001 transcript survey with an
    explicit abundance caveat and no protein data. Three sources cross-referenced from the same
    UniProt entry point the other way: HPA records "Tissue enriched (testis)" with testis the only
    tissue above its specificity threshold at 54.1 nTPM; Bgee leads with sperm; and in mouse the
    orthologue protein is expressed exclusively in the testis, particularly in haploid germ cells. A
    phrase such as "broadly expressed at low level, strongly enriched in testis; protein detected in
    male germ cells" would carry the same evidence without the misleading summary. This matters
    beyond UniProt: the merged ACTL8 review quotes the line to argue that the divergent actin clade
    is not uniformly testis-restricted, an inference the underlying data do not support.
  experts:
  - Masahiko Harata
  - Tadashi Baba
- question: >-
    Should the mouse Actrt3 GO:0005515 protein binding rows be upgraded to GO:0005522 profilin
    binding? Both rows carry WITH/FROM UniProtKB:Q9DAD6, which is PROF3_MOUSE (Pfn3), so the partner
    is already recorded as a profilin and the specific molecular-function term is available. Making
    the change on the mouse entry would let the human annotation arrive by the normal ortholog route
    rather than needing to be proposed here, and would remove one more uninformative protein-binding
    row from this family.
  experts:
  - Tadashi Baba
- question: >-
    Does ACTRT3 actually bind a nucleotide, and does it hydrolyse one? ACTRT3 has the joint
    best-preserved nucleotide site of the eight divergent human actin-like and actin-related-T
    proteins - 17 of 19 computed beta-actin ATP and cation contacts chemically compatible, with the
    entire phosphate-binding P1 loop, the magnesium-coordinating glutamine and the adenine contacts
    conserved - which was predicted from sequence in 2001 and is confirmed by measurement here. No
    nucleotide-binding term is proposed, because following the merged ACTR1A and ACTR10 reviews the
    term should name the ligand actually observed, and no structure of ACTRT3 exists and no binding
    has been assayed. The question is therefore genuinely open rather than settled either way, and
    answering it would decide whether the family-wide absence of nucleotide-binding annotation
    across the human actin set is a curation gap or a biological fact.
  experts:
  - Masahiko Harata
- question: >-
    Is the qualifier on the GO:0015629 IBA row correct, given that no molecular activity of ACTRT3
    has been measured anywhere? The row uses is_active_in, which asserts that the gene product's
    molecular function is executed in the actin cytoskeleton. Nothing has been measured about
    ACTRT3's activity in any compartment, and its protomer interface argues against the filament
    role its donors have. located_in would state what the inference actually supports. The same
    observation applies to ACTL9, ACTL10, ACTRT1 and ACTRT2, which receive the identical row from
    the identical node.
suggested_experiments:
- hypothesis: >-
    ACTRT3 does not incorporate as a protomer into a canonical two-stranded actin filament, either
    alone or with conventional actin, because it retains only 18 of 38 protomer-interface contacts
    against 33 for Drosophila Arp53D and 28 for the dynactin Arp1 paralogues, both of which assemble.
  description: >-
    Purify recombinant human ACTRT3 and run pyrene-actin and total internal reflection fluorescence
    assays on it alone and in the presence of conventional actin, asking whether it homopolymerises,
    co-assembles as a minority protomer, or caps. This is the measurement that would convert the
    GO:0015629 and GO:0005200 rows from inference to evidence in whichever direction it falls, and
    it is the single experiment that would let the ARP-T branch of PTHR11937 be adjudicated on data
    rather than on comparative sequence.
  experiment_type: in vitro polymerisation assay
- hypothesis: >-
    ACTRT3 binds a nucleotide, because the nucleotide site is the best-preserved part of its fold -
    better preserved than in any other divergent human actin-like protein - even though no human
    actin-family member outside ACTA1 and yeast ACT1 carries a nucleotide-binding annotation.
  description: >-
    Assay nucleotide binding and hydrolysis on recombinant ACTRT3 - filter binding or a fluorescent
    ATP analogue titration for affinity, and a coupled phosphate-release assay for turnover - and
    attempt a structure with nucleotide bound. A measured affinity would license a nucleotide-binding
    term for the ligand actually observed, following the practice the ACTR1A and ACTR10 reviews
    established; a demonstrated failure to bind would be equally informative, and would explain why
    the annotation is absent across the family.
  experiment_type: nucleotide binding and ATPase assay, plus structure determination
- hypothesis: >-
    PFN3 binds ACTRT3 directly, through the surface that corresponds to profilin's binding site on
    beta-actin, of which 16 of 21 contacts are chemically compatible in ACTRT3.
  description: >-
    Combine pull-downs and isothermal titration calorimetry on purified human ACTRT3 and PFN3 with
    substitution of the residues that align to beta-actin's profilin contacts in PDB 2BTF, then ask
    in mouse whether such a mutant still reaches the spermatid nucleus. Separating a direct
    interaction from a complex-assembly effect decides whether GO:0005522 is the right molecular
    function and whether the nuclear pool and the perinuclear-theca pool are functionally distinct.
  experiment_type: quantitative binding assay with structure-guided mutagenesis
- hypothesis: >-
    The human ACTRT3 protein is restricted to male germ cells despite its transcript being
    detectable in many tissues, so UniProt's "ubiquitously expressed" statement describes the
    transcript rather than the protein.
  description: >-
    Survey the human protein directly by targeted mass spectrometry or with a validated antibody
    across a tissue panel that includes the tissues in which the 2001 transcript survey detected the
    mRNA. HPA, Bgee and the mouse protein data all indicate a germ-cell-restricted protein, and the
    discrepancy has already propagated into a sibling gene review as an argument about the whole
    clade's tissue distribution, so resolving it at the protein level would settle a question that
    currently affects annotation reasoning for more than one gene.
  experiment_type: targeted proteomics across a human tissue panel
- hypothesis: >-
    ACTRT3, ACTRT1 and ACTRT2 are partially redundant within the perinuclear theca, which is why the
    single Actrt3 knockout is subfertile rather than sterile.
  description: >-
    Generate double and triple mutant mice for the three ARP-T genes and compare the severity and
    stage of the acrosome defect with the single Actrt3 knockout. All three proteins are in the theca
    and co-immunoprecipitate with each other, and all three have nearly identical residue profiles -
    nucleotide site 17, 17 and 16 of 19; protomer interface 18, 21 and 20 of 38 - so redundancy is
    the obvious explanation for the mild phenotype. The answer would determine whether the three
    genes should share their annotations or be distinguished.
  experiment_type: combinatorial mouse knockout with acrosome ultrastructure
