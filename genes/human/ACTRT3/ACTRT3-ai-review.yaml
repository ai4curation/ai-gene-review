- term:
    id: GO:0005522
    label: profilin binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8BXF8
  review:
    summary: >-
      The interaction this gene is best known for is missing from its human record, while the one
      molecular-function row it does have is a bare protein-binding term for a chaperonin
      co-factor. Mouse Actrt3 carries GO:0005515 protein binding by IPI from PMID:18692047, with
      WITH/FROM UniProtKB:Q9DAD6, which resolves to PROF3_MOUSE, gene Pfn3, 137 aa, Swiss-Prot - a
      profilin. Querying QuickGO by that reference rather than by gene shows what the two rows on
      Actrt3 actually are: PMID:18692047 yields 5 annotations across just 2 entities, and the
      GO:0005515 rows are 4 protein-binding annotations spread over only 2 entities - the same
      co-immunoprecipitation logged once by UniProt and once by IntAct, and recorded reciprocally on
      Actrt3 and on Pfn3. Annotation rows and distinct entities are counted separately here on
      purpose: a hit count never collapses per gene product, and conflating the two is exactly how
      an apparent replicate appears. So it is one experiment recorded four ways, not two
      experiments - the ACRV1 pattern, checked here rather than assumed - and the case for the term
      therefore does not rest on an apparent replicate count. All three strands below still stand;
      the first is one co-immunoprecipitation rather than two. GO:0005522 profilin binding is a
      live molecular-function term and is already used with this same GO_REF:0000024 ISS route for
      DBN1, EVL and PCLO, so the row is ordinary practice rather than a novelty. Three independent
      strands support it.
      First the co-immunoprecipitation itself. Second a genetic dependency in the reciprocal
      knockout, which is a stability relationship and not merely co-purification: ARPM1 cannot be
      detected in the nuclear fraction of Pfn3-deficient testes and sperm, and Pfn3-null
      spermatozoan nuclei are devoid of ARPM1, while PFN3 levels are in turn reduced in Actrt3-null
      mice - the partnership is mutually stabilising. Third a directed structural prediction: PDB
      2BTF is the profilin:beta-actin complex, so the same coordinates that give the nucleotide
      site give the profilin-binding face, and ACTRT3 retains 16 of those 21 contacts as chemically
      compatible, against 21 for beta-actin, 20 for Arp53D and Arp1, 10 for ACTL8 and 8 for ACTR10.
      The surface is retained across the whole ARP-T trio (ACTRT1 17, ACTRT2 17, ACTRT3 16), so
      this looks like a clade property. ISS rather than IDA or IPI because the experiment is in
      mouse; UniProt already carries the human side as "Interacts with PFN3 {ECO:0000250}" with no
      source entry named, which is a by-similarity statement rather than evidence and is not
      offered as support here.
    action: NEW
    reason: >-
      Supplies the informative molecular function that GOA lacks, in place of a bare
      protein-binding term, and does so at the granularity the evidence supports. It is the same
      measurement that argues against the filament rows - the 2BTF contact analysis - that argues
      for this one, which is why both directions are reported from one structure rather than only
      the convenient one.
    supported_by:
    - reference_id: PMID:18692047
      supporting_text: By co-immunoprecipitation analysis, profilin III was identified as
        ArpM1-interacting protein.
    - reference_id: PMID:34869336
      supporting_text: Western blot showed that ARPM1 could not be detected in the nuclear fraction
        of Pfn3-deficient testes and sperm, while cytoplasmic ARPM1 protein levels in testes are
        slightly reduced in Pfn3-deficient mice
    - reference_id: PMID:34869336
      supporting_text: PFN3 is detected in a complex with ARPM1, specifically in the sperm nucleus,
        however, not in the cytoplasm
    - reference_id: file:human/ACTRT3/ACTRT3-bioinformatics/RESULTS.md
      supporting_text: '- Profilin surface, 21 contacts (same structure, profilin chain P): ACTRT3 =
        14 identical, 2 conservative, 5 non-conservative, 0 gaps.'
    - reference_id: file:human/ACTRT3/ACTRT3-bioinformatics/RESULTS.md
      supporting_text: "| GO:0005515 | MO | IPI | enables | PMID:18692047 | UniProtKB:Q9DAD6 |
        Q9DAD6 ['Pfn3'] (Swiss-Prot, Mus musculus) |"
    - reference_id: file:human/ACTRT3/ACTRT3-bioinformatics/reference_scope.json
      supporting_text: 'PMID:18692047: 5 annotations total, 5 rows examined, 2 terms seen, 0 unaccounted; codes IDA,IPI;
        assignedBy IntAct=2,UniProt=3'
- term:
    id: GO:0001675
    label: acrosome assembly
  evidence_type: ISS
  original_reference_id: PMID:41668650
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8BXF8
  review:
    summary: >-
      ACTRT3's only biological-process row is GO:0007010 cytoskeleton organization, inherited from
      a molecular function by an automatic inter-ontology step, so the loss-of-function phenotype
      is entirely absent from the record. Actrt3-null male mice are subfertile with acrosome
      defects first seen at cap phase, and the mechanism is Golgi: trans-Golgi network markers
      TGN46 and GOPC are reduced, the cis-Golgi protein GM130 is mislocalised, and the autophagy
      markers LC3B, CTSB and mTOR fall. GO:0001675 is defined as the formation of the acrosome from
      the spermatid Golgi, so it matches the mechanism as well as the outcome, which is why it is
      preferred over the parent GO:0007286 spermatid development. The same pathway is independently
      implicated through the partner: the Pfn3 knockout, in which ARPM1 is lost from the nuclear
      fraction, likewise shows impaired acrosome biogenesis and disturbed autophagic flux. ISS with
      the mouse orthologue as supporting entity because the knockout is in mouse; the orthologue is
      79.4 per cent identical to the human protein and the human gene has no phenotype data of its
      own.
    action: NEW
    reason: >-
      The gene's characterised biological role is missing from GO entirely. Adding it at the
      specific term the mechanism supports, rather than at the developmental parent, is the change
      that makes the record informative; the existing GO:0007010 row is retained but marked
      non-core because it is derivative and general.
    supported_by:
    - reference_id: PMID:41668650
      supporting_text: We generated Actrt3-/- male mice and showed that they are subfertile, with
