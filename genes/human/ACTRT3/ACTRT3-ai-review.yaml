core_functions:
- description: >-
    Structural component of the perinuclear theca, the condensed layer that encases the nucleus of
    the developing and mature spermatid, contributing to the structural integrity of the theca's
    three-dimensional protein scaffold together with ACTRT1, ACTRT2, ACTL7A and SPEM2, and required
    there for correct placement of the sperm-surface protein ZPBP. The molecular function is stated
    at the level of structural molecule activity rather than structural constituent of cytoskeleton
    for the same reasons the merged ACTL7A review gives for that clade: ACTRT3 is not established
    as a constituent of actin filaments themselves, GO's phylogenetic pipeline has negated the
    cytoskeletal-constituent term at eight neighbouring nodes in this family and replaced it with
    this parent at the nearest one, and the residue audit shows that the protomer interface by
    which real actins earn the specific term is not conserved - 18 of 38 contacts compatible,
    against 28 for the weakest actin-fold protein that does polymerise.
