- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      A correct but maximally general location. The gene already holds GO:0001673 male germ cell
      nucleus by transfer from a mouse IDA, and GO:0001673's ancestors include GO:0005634
      (verified via QuickGO), so this row is a redundant true ancestor of a better-evidenced one.
      Its provenance is nevertheless weak in a way worth recording: it re-codes the clause
      "Nucleus {ECO:0000250}" of a UniProt subcellular-location statement in which every clause is
      by similarity and no source entry is named, so it adds no evidence and must not be counted as
      a second, independently coded line of support for nuclear residence. The underlying biology
      is sound - mouse ArpM1 appears in round spermatids and changes its nuclear localisation
      through spermiogenesis, and the PFN3-ARPM1 complex is detected in the sperm nucleus and not
      the cytoplasm - but that support comes from the orthologue rows, not from this one.
    action: KEEP_AS_NON_CORE
    reason: >-
      True and subsumed by the male-germ-cell-nucleus row the review accepts as core. Retained
      rather than removed because it is not incorrect and because a parent and its descendant
      cannot be given opposite verdicts; non-core because the specific descendant carries the
      information.
    propagation_review:
      root_cause: EVIDENCE_CIRCULAR_OR_REDUNDANT
      failure_modes:
      - CIRCULAR_PROPAGATION
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0191
        source_status: NOT_RELEVANT
        source_label: UniProt controlled-vocabulary subcellular-location term "Nucleus"
        comment: >-
          A vocabulary term, not a gene product, so it carries no evidence of its own. The UniProt
          statement it maps reads "Nucleus {ECO:0000250}" with no source entry cited, which is why
          this row is treated as redundant re-coding rather than as support.
