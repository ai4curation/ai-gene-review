- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      GO:0005200 is asserted exactly once in PANTHER family PTHR11937, at PTN000940351 (IBD,
      2025-08-05, 10 seeds), and PAINT has since explicitly negated it at eight descendant nodes
      covering thirteen human genes, in two dated batches: the nuclear actin-related proteins ACTR5,
      ACTR6, ACTR8, ACTL6A and ACTL6B plus the testis clade ACTL7A/ACTL7B on 2025-08-05, then Arp2,
      the Arp3 paralogues and the dynactin Arp1 paralogues on 2026-04-16. Verified by exact-usage
      QuickGO query, the human genes still holding the term itself by IBA from this node are the
      conventional actins ACTA1, ACTA2, ACTC1 and ACTG2, plus ACTR10 - whose own orthologue, yeast
      Arp10, is in the seed set - plus the five un-adjudicated divergent genes ACTL9, ACTL10,
      ACTRT1, ACTRT2 and ACTRT3. The most useful datum is what PAINT did at PTN008986528, the
      nearest neighbour clade: it did not merely reject the specific term, it substituted the
      general parent GO:0005198 structural molecule activity on the same day, which is why ACTL7A
      and ACTL7B carry GO:0005198 by IBA today while ACTRT3 carries GO:0005200. The donor set here
      is genuinely heterogeneous - conventional actins, the Arp2/3 branch nucleator and the
      dynactin Arp1 filament, three unrelated polymer systems - so GO:0005200 is a defensible least
      common ancestor for the node; all 10 donors carry their own experimental evidence for it, so
      a source-weakness objection is factually unavailable. What the node cannot do is license the
      specific term for a member that contains no ARP-T donor and retains only 18 of 38
      protomer-interface contacts. On the other side, read by its definition rather than its label
      - the action of a molecule that contributes to the structural integrity of a cytoskeletal
      structure - GO:0005200 arguably does fit ACTRT3, because GO places the perinuclear theca under
      GO:0005856 cytoskeleton and the mouse knockout shows ACTRT3 contributes to theca structure. I
      have not taken that route here for two reasons: it would license the row on grounds entirely
      unrelated to the evidence chain the row carries, leaving the false reading that ACTRT3 is a
      filament constituent by inference from actin; and ACTL7A is a perinuclear-theca protein with
      GO:0033011 by IDA whose merged review nonetheless removed its GO:0005200, so accepting it
      here on the theca argument would create a cross-review inconsistency. The theca route is
      raised instead as a question for the whole ARP-T and theca set at once.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0005198
      label: structural molecule activity
    reason: >-
      Generalise to the parent that PAINT itself substituted for the adjacent clade on 2025-08-05.
      GO:0005198 is supported for ACTRT3 - it is a component of the perinuclear theca's protein
      scaffold and contributes to its structural integrity - while GO:0005200 additionally implies
      the filament-constituent role that the protomer-interface measurement excludes and that no
      ARP-T donor supports. This also aligns the row with the merged ACTL7A and ACTL7B reviews,
      both of which removed GO:0005200, and with ACTL7A's core function, which states GO:0005198
      for the same reasons. It does not conflict with the merged ACTR10 review's ACCEPT of this
      same row, because ACTR10 has an ortholog-strength donor in the seed set and ACTRT3 has none.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11937/PTHR11937-paint.tsv
      supporting_text: "PTHR11937\tPTN008986528\tGO:0005200\tF\tIRD\ttrue\tPANTHER:PTN000940351\ttaxon:\t20250805"
    - reference_id: file:interpro/panther/PTHR11937/PTHR11937-paint.tsv
      supporting_text: "PTHR11937\tPTN008986528\tGO:0005198\tF\tIBA\tfalse\tPANTHER:PTN000940351\ttaxon:\t20250805"
    - reference_id: file:human/ACTRT3/ACTRT3-bioinformatics/RESULTS.md
      supporting_text: '| filament_interface | 38 | ACTRT1 21, ACTRT2 20, ACTRT3 18, ACTL7B 16,
        ACTL9 16, ACTL7A 14, ACTL8 11, ACTL10 5 |'
