- id: file:human/ACTRT3/ACTRT3-uniprot.txt
  title: UniProt entry Q9BYD9 (ACTT3_HUMAN)
  findings:
  - statement: >-
      The human PFN3 interaction is recorded only by similarity and names no source entry, which is
      why the proposed profilin-binding row uses ISS with the mouse orthologue as its supporting
      entity rather than treating this line as evidence in itself.
    supporting_text: 'CC   -!- SUBUNIT: Interacts with PFN3. {ECO:0000250}.'
  - statement: >-
      The tissue-specificity line that a merged sibling review quotes as evidence the divergent
      actin clade is not uniformly testis-restricted.
    supporting_text: 'CC   -!- TISSUE SPECIFICITY: Ubiquitously expressed.'
  - statement: >-
      The same entry's own cross-reference, which says the opposite. HPA's API gives a single tissue
      above its specificity threshold, testis at 54.1 nTPM.
    supporting_text: DR   HPA; ENSG00000184378; Tissue enriched (testis).
  - statement: >-
      A family-specific CDD signature for the ARP-T1/2/3 clade rather than a bare actin fold, which
      is a materially better-founded starting point for a domain-derived inference than a generic
      fold hit.
    supporting_text: DR   CDD; cd13397; ASKHA_NBD_actin_Arp-T1-3; 1.
  - statement: >-
      The protein is detected, so any statement of absent data here must be scoped to functional
      and biochemical data rather than to evidence of existence.
    supporting_text: 'PE   1: Evidence at protein level;'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Machine-fetched record, used for provenance rather than for conclusions. Its three
      subcellular-location clauses are all ECO:0000250 with no source entry cited, which is the
      basis for the redundancy judgement on the three GO_REF:0000044 rows.
- id: file:interpro/panther/PTHR11937/PTHR11937-paint.tsv
  title: PANTHER PTHR11937 PAINT annotation table (cached in this repository)
  findings:
  - statement: >-
      GO:0005200 is asserted at exactly one node in this family, PTN000940351, the conventional-actin
      node, from ten seeds. Every other GO:0005200 row in the family is a negation of this one.
    supporting_text: "PTHR11937\tPTN000940351\tGO:0005200\tF\tIBD\tfalse"
  - statement: >-
      The nearest neighbour clade to ACTRT3's, PTN008986528, which covers ACTL7A and ACTL7B, carries
      the negation of GO:0005200 against that same node. This is the row the MODIFY on this gene
      follows.
    supporting_text: "PTHR11937\tPTN008986528\tGO:0005200\tF\tIRD\ttrue\tPANTHER:PTN000940351\ttaxon:\t20250805"
  - statement: >-
      And on the same day PAINT asserted the general parent GO:0005198 at that node in the specific
      term's place, which is why ACTL7A and ACTL7B hold structural molecule activity by IBA today.
      Substituting the parent rather than leaving the clade with no molecular function is the
      precedent this review applies to ACTRT3.
    supporting_text: "PTHR11937\tPTN008986528\tGO:0005198\tF\tIBA\tfalse\tPANTHER:PTN000940351\ttaxon:\t20250805"
  - statement: >-
      A second batch of rejections landed on 2026-04-16, reaching the Arp2, Arp3 and dynactin Arp1
      clades, so the sweep is ongoing rather than finished. The ARP-T branch has not been reached.
    supporting_text: "PTHR11937\tPTN007551901\tGO:0005200\tF\tIRD\ttrue\tPANTHER:PTN000940351\ttaxon:2759\t20260416"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The per-node PAINT assignments, without which an IBA row can only be read as a flat WITH/FROM
      list. The count derived here - one IBD assertion of GO:0005200 at PTN000940351 and eight IRD
      negations of it at divergent nodes, nine rows in total - was reached independently by the
      merged ACTR8 review from the same file, which is a useful cross-check because the two reviews
      approached the family from opposite ends.
- id: file:human/ACTRT3/ACTRT3-deep-research-affinage.md
  title: Affinage mechanistic annotation for ACTRT3 (human)
  findings:
  - statement: >-
      The provider's own summary of the gene, cited only because every clause of it was
      independently checked against the abstract of PMID:41668650 and against HPA. It is used as
      corroboration of location and process, never for a mechanistic detail.
    supporting_text: ACTRT3 (ARPM1) is a testis-enriched actin-related protein that functions as a
      structural component of the spermatid perinuclear theca (PT) required for acrosome biogenesis
      and male fertility
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Machine-generated, gates_passed true, and its narrative is broadly right. Two defects were
      found. Its four citations include one bioRxiv DOI in a PMID-shaped field, and comparing that
      entry with PMID:41668650 shows the two are the same study - the same theca localisation, the
      same cap-phase acrosome defect, the same GM130 and TGN46 result and the same
      co-immunoprecipitation set - so the record presents one study as two dated findings. It also
      omits PMID:35793634 entirely, which is the reference behind the perinuclear-theca IDA on the
      mouse orthologue and hence behind two of this gene's GOA rows; that paper is titled for a
      different gene, which is presumably why a symbol-keyed retrieval missed it. Marked LOW_QUALITY
      on those two counts rather than on any incorrect assertion.
- id: file:human/ACTRT3/ACTRT3-bioinformatics/RESULTS.md
  title: 'ACTRT3 bioinformatics: nucleotide site, profilin surface, filament interface, and
    PAINT''s own handling of GO:0005200'
  findings:
  - statement: >-
      The nucleotide site is essentially intact, so a "fold without function" reading is refuted
      for nucleotide binding. Controls in the same run: beta-actin and Drosophila Arp53D 19/19
      compatible, Arp1/ACTR1A 18/19, Arp11/ACTR10 11/19.
    supporting_text: '- Nucleotide site, 19 contacts (PDB 2BTF chain A): ACTRT3 = 15 identical, 2
      conservative, 2 non-conservative, 0 gaps.'
  - statement: >-
      The filament protomer interface is not intact. Every panel member known to assemble into a
      two-stranded actin-like filament scores far higher - conventional actins 38/38, the divergent
      but polymerising Arp53D 33/38, and the dynactin Arp1 paralogues 28/38 - so ACTRT3 sits ten
      below the weakest true polymeriser.
    supporting_text: '- Filament protomer interface, 38 contacts (PDB 6DJO, chain C): ACTRT3 = 13
      identical, 5 conservative, 19 non-conservative, 1 gaps.'
  - statement: >-
      The profilin-binding surface of beta-actin is largely retained, a directed structural
      prediction for the one interaction the gene has ortholog-level experimental support for.
      Comparators in the same run: beta-actin 21/21, Arp53D and Arp1 20/21, ACTL8 10/21,
      ACTR10 8/21.
    supporting_text: '- Profilin surface, 21 contacts (same structure, profilin chain P): ACTRT3 =
      14 identical, 2 conservative, 5 non-conservative, 0 gaps.'
  - statement: >-
      Within the eight divergent human actin-like and actin-related-T proteins, all scored in one
      run, ACTRT3 has the joint best-preserved nucleotide site. The ARP-T trio leads the ACTL set.
    supporting_text: '| nucleotide_site | 19 | ACTRT3 17, ACTRT2 17, ACTRT1 16, ACTL9 15, ACTL7A 14,
      ACTL8 14, ACTL7B 13, ACTL10 10 |'
  - statement: >-
      On the filament interface the same clade is uniformly poor, and ACTRT3 sits above ACTL8's 11,
      the score that with three additional deletions earned ACTL8's REMOVE. Retaining the
      nucleotide core while losing the protomer interface is the signature of a monomeric
      nucleotide-binding scaffold rather than a polymer subunit.
    supporting_text: '| filament_interface | 38 | ACTRT1 21, ACTRT2 20, ACTRT3 18, ACTL7B 16,
      ACTL9 16, ACTL7A 14, ACTL8 11, ACTL10 5 |'
  - statement: >-
      The profilin surface is retained across the ARP-T trio specifically, which is consistent with
      the profilin interaction being a clade property rather than a one-off.
    supporting_text: '| profilin_interface | 21 | ACTRT1 17, ACTRT2 17, ACTRT3 16, ACTL7A 16,
      ACTL9 12, ACTL7B 10, ACTL8 10, ACTL10 4 |'
  - statement: >-
      GO:0005200 is asserted once in PTHR11937 and then explicitly negated at eight descendant
      nodes covering thirteen human genes, in two dated batches (2025-08-05 and 2026-04-16). ACTRT3's
      own path carries no such negation, so its row is a survivor of an ongoing sweep rather than
      an adjudicated decision.
    supporting_text: "ACTRT3's own donating nodes are ['PTN000940351', 'PTN002631484']; GO:0005200
      is rejected on that path at: no node."
  - statement: >-
      At the nearest neighbour clade PAINT did not merely reject the specific term, it substituted
      the general parent GO:0005198 on the same day. That is the in-resource precedent for the
      MODIFY proposed on this gene, and it is why ACTL7A and ACTL7B hold GO:0005198 by IBA while
      ACTRT3 still holds GO:0005200.
    supporting_text: '| `PTN008986528` | 20250805 | GO:0005198 | ACTL7A, ACTL7B |'
  - statement: >-
      The mouse source of every experimental location on this gene is a genuine 1:1 orthologue, not
      a paralogue: 79.4 per cent identical to human ACTRT3 against 47.0 per cent to beta-actin.
    supporting_text: 'Global identity to human ACTRT3: 79.4%; local 78.8%. Local identity to
      beta-actin for comparison: 47.0%.'
  - statement: >-
      The mouse orthologue carries a protein-binding IPI whose partner resolves to profilin-3, and
      the human GOA has no counterpart row. This is the informative molecular function missing from
      the human record.
    supporting_text: "| GO:0005515 | MO | IPI | enables | PMID:18692047 | UniProtKB:Q9DAD6 |
      Q9DAD6 ['Pfn3'] (Swiss-Prot, Mus musculus) |"
  - statement: >-
      ACTL8's published census is reproduced independently here, including the figure it assigned
      ACTRT3. ACTRT3 sits under neither narrow beta/gamma-actin node, so the roughly five-fold
      record inflation ACTL8 documented does not affect this gene.
    supporting_text: ACTL8 carries 11 IBA rows; ACTRT3 carries 2; the median across the other seven
      divergent relatives is 2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reproducible analysis in this gene's folder; both results.json and RESULTS.md were confirmed
      byte-identical on a fresh run. Contact detection, alignment, substitution classing and the
      two-scheme sensitivity check are deliberately identical to the merged ACTL8 script so the
      tallies are comparable; the profilin contact set and the PAINT-negation survey are new here.
      All ACTRT3 tallies are unchanged under BLOSUM45/-14/-2 as well as BLOSUM62/-11/-1.
- id: file:human/ACTRT3/ACTRT3-bioinformatics/reference_scope.json
  title: 'ACTRT3 reference-scope audit: how many entities each cited reference annotates'
  findings:
  - statement: >-
      The perinuclear-theca reference annotates 19 entities across 3 terms, and every one of its
      rows was returned - 35 examined against 35 total. Row completeness, not term-list closure, is
      the precondition for asking the projection question, because the per-term entity counts are
      collected from the returned rows: a term list can close while the rows are still a sample, and
      a distinct-entity count taken from a sample is a lower bound rather than a total.
    supporting_text: 'PMID:35793634: 35 annotations total, 35 rows examined, 3 terms seen, 0 unaccounted; codes IDA,IMP,IPI; assignedBy UniProt=35'
  - statement: >-
      Within that reference, GO:0033011 reaches 12 distinct mouse proteins while the only functional
      row, GO:0007286, reaches exactly one - the gene that was knocked out. A complex-to-subunit
      projection spreads the phenotype across the whole set; this one does not, so the twelve
      localisation calls are twelve observations rather than one written twelve times.
    supporting_text: 'PMID:35793634 projection test on entities: GO:0005515=12, GO:0007286=1, GO:0033011=12; max functional 1, max localisation 12'
  - statement: >-
      The profilin reference covers only 2 entities in total, ACTRT3's orthologue and its partner,
      and is likewise complete. That is how the apparent duplicate IPI resolves into one
      co-immunoprecipitation logged by two databases and recorded reciprocally on both partners -
      note the assigning databases are UniProt and IntAct, not one source twice.
    supporting_text: 'PMID:18692047: 5 annotations total, 5 rows examined, 2 terms seen, 0 unaccounted; codes IDA,IPI; assignedBy IntAct=2,UniProt=3'
  - statement: >-
      The BioPlex reference behind the single GO:0005515 row accounts for 9514 annotations, of which
      9508 are protein binding itself. It is also the one reference here that a single page cannot
      cover, and the summary says so: 200 rows examined, TRUNCATED, 1 annotation still unaccounted.
      Its assigning databases are ComplexPortal 5 and IntAct 9509 - so this reference does contain a
      small complex-to-subunit projection, invisible in the sampled page, which is why the counts
      quoted in this review come from filtered count queries rather than from that page.
    supporting_text: 'PMID:33961781: 9514 annotations total, 200 rows examined (TRUNCATED), 2 terms seen, 1
      unaccounted; codes IPI; assignedBy ComplexPortal=5,IntAct=9509'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Written after the merged ACTR8 review showed that querying QuickGO by reference, rather than by
      gene, exposes complex-to-subunit projections a per-gene view cannot see. Run over every PMID
      this review cites. Two defects were fixed in it during review, both of the kind it exists to
      catch. First it counted bare GO:0005515 as a functional claim, which made every interaction
      paper look like a projection and mis-flagged PMID:35793634. Second, and worse, it reported
      per-term, per-code and per-database breakdowns from one 200-row page while taking the total
      from the API's hit count, silently mixing a true total with a 2 per cent sample on the one
      reference large enough for it to matter; every total is now its own filtered count query, the
      sampled fields are named *_seen, `truncated` and `unaccounted_annotations` are emitted, and
      ComplexPortal is probed unconditionally because a projected tail can sit entirely outside a
      sample. Its per-code totals are deliberately not used for any claim: QuickGO's evidenceCode
      filter is not exact-only, so they overlap and do not partition the total.
