id: P12644
gene_symbol: BMP4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BMP4 is a secreted, disulfide-linked growth factor of the TGF-beta superfamily. Proteolytic
  maturation of its precursor produces a ligand that engages type I and type II BMP receptor complexes,
  initiating receptor-mediated SMAD1/5/8 signaling and context-dependent noncanonical responses. Co-receptors
  and extracellular antagonists modulate receptor use and signal strength, while the prodomain can bind
  fibrillin matrix components. BMP4 directs cell-fate choices and tissue patterning in many embryonic
  organs and regulates proliferation, survival, migration and differentiation according to cell type,
  developmental stage and signaling environment.
