id: P35580
gene_symbol: MYH10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MYH10 encodes non-muscle myosin heavy chain IIB (NMHC II-B), the heavy chain of non-muscle
  myosin IIB, a conventional class II myosin. Two heavy chains dimerize through their coiled-coil rod
  and associate with essential and regulatory light chains; regulatory light chain phosphorylation (e.g.
  by MLCK or ROCK) unfolds the compact molecule into bipolar filaments. The N-terminal motor domain is
  an actin-activated MgATPase with high duty ratio and strong ADP affinity, suited to tension maintenance.
  NM IIB cross-links and contracts actin filaments in stress fibers, the cell cortex and the cleavage
  furrow, contributing to cytokinesis, cell shape, cell spreading and lamellipodial dynamics, and in secretory
  cells to regulated exocytosis. It is the predominant myosin II in the nervous system (with neuron-specific
  spliced isoforms) and is required for migration of several neuronal populations, where actomyosin contraction
  assists forward nuclear translocation, as well as for growth-cone and dendritic-spine actin dynamics;
  it is also essential for heart and brain development in mice. NM IIB also tethers LARP6-bound collagen
  mRNAs to coordinate type I collagen synthesis and can serve as an HSV-1 entry co-receptor. MYH10 variants
  are associated with intellectual disability, microcephaly and cerebral atrophy.
