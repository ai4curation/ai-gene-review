- term:
    id: GO:0001764
    label: neuron migration
  evidence_type: ISS
  original_reference_id: PMID:15034141
  qualifier: involved_in
  review:
    summary: Non-muscle myosin IIB generates actomyosin contractile force in migrating neurons, driving
      somal/nuclear translocation.
    action: NEW
    reason: Mouse NMHC II-B motor-domain mutants show defective migration of cerebellar granule, facial
      and pontine neurons, and myosin II inhibition blocks forward nuclear translocation in migrating
      neurons, with NM IIB the predominant neuronal myosin II localized to the leading process. MYH10
      does work in the process (it is the force-generating motor), so this passes the participation test;
      mouse Myh10 carries this term by IMP, but human MYH10 lacks it because rodent acts_upstream_of_or_within
      annotations are not propagated. Evidence is from mouse orthologue.
    supported_by:
    - reference_id: PMID:15034141
      supporting_text: These studies demonstrate that NMHC II-B is particularly important for normal migration
        of distinct groups of neurons during mouse brain development.
    - reference_id: PMID:15034141
      supporting_text: Analysis of the brains of homozygous mutant mice showed significant defects in
        neuronal migration involving granule cells in the cerebellum, the facial neurons, and the anterior
        extramural precerebellar migratory stream, including the pontine neurons.
    - reference_id: PMID:19607793
      supporting_text: By immunocytochemistry, Myosin IIB localizes to the leading process of migrating
        CGNs in vitro and in vivo
    - reference_id: PMID:19607793
      supporting_text: Myosin IIB is the predominant Myosin II motor expressed in the nervous system
    - reference_id: PMID:15958735
      supporting_text: The forward movement of the nucleus is blocked by blebbistatin, a specific inhibitor
        of nonmuscle myosin II.
