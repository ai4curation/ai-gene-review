gene_symbol: MT-RNR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Small humanin-like peptide 1 (SHLP1) is a predicted 24-residue peptide and a 16S-rRNA sORF
  peptide: its open reading frame lies inside MT-RNR2, the mitochondrial 16S ribosomal RNA gene, in the
  same stretch of mitochondrial DNA that encodes humanin. The six small humanin-like peptides SHLP1-SHLP6
  were identified by an in silico search of this region and named by analogy with humanin, with which
  they share a genomic neighbourhood rather than sequence similarity. Essentially nothing is known about
  what SHLP1 does. The peptide was detected by immunoblot in mouse heart, kidney and spleen, but in the
  panel of cell-viability, apoptosis and proliferation assays that assigned phenotypes to SHLP2, SHLP3,
  SHLP4 and SHLP6, synthetic SHLP1 produced no significant effect, and no receptor, binding partner, enzymatic
  activity or subcellular location has been reported for it. UniProt classifies the entry as PE4 (predicted)
  and records no function. How much of this is translated in vivo is unresolved. The peptides are read
  with the cytoplasmic genetic code, yet no route is known by which an mtDNA-encoded transcript reaches
  cytoplasmic ribosomes, nor by which a peptide made in the matrix would be exported; and the same region
  of mitochondrial DNA is present in the nuclear genome as MT-RNR2-like (NUMT-derived) copies, so antibody-based
  detection cannot be attributed to the mitochondrial locus with certainty.'
aliases:
- SHLP1
suggested_questions:
- question: Does SHLP1 exist as a peptide in human cells? The only existence evidence is an immunoblot
    in mouse tissues with a custom antibody (PMID:27070352), and the MT-RNR2-like nuclear copies make
    antibody attribution to the mitochondrial locus uncertain. UniProt lists the entry as PE4, predicted.
- question: Why does SHLP1 lack a phenotype in the assays where its neighbours have one? In the founding
    study SHLP1 did not change viability, apoptosis or proliferation at 100 nM, while SHLP2, SHLP3, SHLP4
    and SHLP6 did. Is SHLP1 inert, acting in a tissue or process not covered by those assays, or not made
    at all?
- question: Is the heart/kidney/spleen expression pattern reported for mouse SHLP1 reproducible with an
    independent reagent, and does it hold in human tissue?
suggested_experiments:
- description: Targeted mass spectrometry (parallel reaction monitoring) of human heart, kidney and spleen
    lysates and of plasma with a heavy-labelled synthetic SHLP1 standard, to establish whether the peptide
    exists and at what abundance.
  hypothesis: SHLP1 is translated and detectable as a discrete peptide species in the tissues where the
    antibody signal was reported.
- description: A GPCR deorphanization screen (beta-arrestin recruitment or cAMP across an arrayed receptor
    panel) with synthetic SHLP1, as was done successfully for SHLP2, to test whether SHLP1 is a receptor
    ligand with an output the viability assays would not have detected.
  hypothesis: SHLP1 is a ligand for a cell-surface receptor that the original phenotypic assays could
    not report on.
