- term:
    id: GO:0001889
    label: liver development
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR039066
  review:
    summary: Keep liver development as a non-core HNF1B context.
    action: KEEP_AS_NON_CORE
    reason: Conditional Hnf1b loss in mouse hepatocytes and bile duct cells disrupts duct organization during liver organogenesis, supporting this HNF1-family liver projection as a peripheral developmental context rather than the core renal HNF1B transcriptional program.
