  review:
    summary: Accept the HNF1B nephrogenesis role.
    action: ACCEPT
    reason: HNF1B directly regulates nephrogenic transcriptional programs, including lhx1 promoter activity, and human loss of function produces abnormal nephron development.
    supported_by: &id003
    - reference_id: PMID:10720943
      supporting_text: HNF-1 beta plays a central role in normal kidney development
    - reference_id: PMID:21281489
      supporting_text: HNF1B induces several genes important in nephrogenesis and regulates lhx1 expression by an HNF1 binding site in the lhx1 promoter
- term:
    id: GO:0001822
