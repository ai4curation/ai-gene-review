core_functions:
- description: HNF1B dimerizes through its N-terminal HNF1 domain, binds HNF1 cis-regulatory motifs in nuclear chromatin through its POU-like and homeodomain regions, and activates RNA polymerase II transcriptional programs required for renal and pancreatic epithelial development.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  - id: GO:0001822
    label: kidney development
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: file:human/HNF1B/HNF1B-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Transcription factor that binds to the inverted palindrome
  - reference_id: PMID:10720943
    supporting_text: HNF-1 beta plays a central role in normal kidney development
  - reference_id: PMID:21281489
    supporting_text: regulates lhx1 expression by an HNF1 binding site in the lhx1 promoter
suggested_questions:
- question: Which HNF1B developmental target genes in human renal epithelia are direct enough to annotate beyond the generic regulation of RNA polymerase II transcription process?
- question: Which PCBD1 and PCBD2 coactivator interactions are established for endogenous HNF1B in kidney or pancreas cells rather than only by reporter systems?
suggested_experiments:
- description: Profile endogenous HNF1B chromatin occupancy and perturbation-responsive nascent transcription in differentiating human kidney organoids to distinguish direct renal target genes from secondary cystic-disease expression changes.
- description: Test HNF1A/HNF1B and PCBD1/PCBD2 complex formation with endogenous proteins in renal epithelial and pancreatic progenitor models.
