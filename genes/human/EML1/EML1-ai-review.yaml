id: O00423
gene_symbol: EML1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EML1 is a microtubule-associated protein with an N-terminal self-association region and a
  C-terminal tandem beta-propeller (TAPE) domain. Its N-terminal region mediates binding to microtubule
  polymers, whereas the TAPE region associates with soluble alpha/beta-tubulin. EML1 contributes to microtubule
  cytoskeleton organization. Studies of mouse Eml1 connect this role to mitotic spindle orientation, cell-cycle
  progression and the positioning of cortical progenitors; biallelic human EML1 variants cause severe
  cortical malformations with heterotopia.
