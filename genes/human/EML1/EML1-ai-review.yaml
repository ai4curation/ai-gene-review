core_functions:
- description: Binds microtubule polymers through its N-terminal self-association region together
    with the adjacent basic region, contributing to organization of the microtubule cytoskeleton.
    Independently, the concave surface of the TAPE domain associates with soluble alpha/beta-tubulin
    dimers. The soluble interaction persists after removal of the N-terminal self-association region
    and is disrupted by the M7 surface mutant without reported loss of the TAPE fold; it does not
    itself establish an effect on microtubule polymerization.
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  directly_involved_in:
  - id: GO:0000226
    label: microtubule cytoskeleton organization
  locations:
  - id: GO:0005874
    label: microtubule
  supported_by:
  - reference_id: PMID:25740311
  - reference_id: PMID:24859200
  - reference_id: PMID:24706829
suggested_questions:
- question: Does human EML1 bind calcium directly, and if so, which region and physiological conditions
    support that activity? The existing NAS assertion remains unresolved from the accessible source.
- question: How does TAPE-mediated soluble alpha/beta-tubulin association cooperate with N-terminal
    self-association and microtubule binding during spindle organization? Can the soluble-dimer interaction
    be represented by a GO term distinct from polymer binding?
