id: Q6PJG6
gene_symbol: BRAT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BRAT1 is an ARM/HEAT-repeat assembly factor that binds the Integrator endonuclease INTS11
  and its partner INTS9. Its conserved C-terminal motif occupies the INTS11 active site, inhibiting premature
  RNA cleavage while stabilizing an assembly intermediate. BRAT1 acts predominantly in the cytoplasm and
  can assist nuclear delivery of the cleavage module; it dissociates as the mature INTS4–INTS9–INTS11
  module forms. Earlier studies also implicate BRAT1 in maintaining ATM and DNA-PK-associated damage signaling
  and in context-dependent cell survival, proliferation and mitochondrial homeostasis. Biallelic pathogenic
  variants cause a spectrum of neurological disease including neonatal rigidity with multifocal seizures
  and neurodevelopmental disease with cerebellar atrophy.
