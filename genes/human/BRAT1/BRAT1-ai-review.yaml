  evidence_type: IDA
  original_reference_id: PMID:39032489
  qualifier: involved_in
  review:
    summary: BRAT1 directly assists Integrator cleavage-module assembly.
    action: ACCEPT
    reason: The source identifies BRAT1 and WDR73 as biogenesis factors maintaining an inactive INTS9–INTS11
      intermediate, followed by nuclear delivery, INTS4 association and IP6-dependent BRAT1 release. Assembly-factor
