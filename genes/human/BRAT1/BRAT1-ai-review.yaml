  evidence_type: IDA
  original_reference_id: PMID:39032489
  qualifier: involved_in
  review:
    summary: BRAT1 can facilitate nuclear delivery of the cleavage module.
    action: ACCEPT
    reason: The source explicitly reports BRAT1-assisted import of INTS9–INTS11. Retain that assembly-pathway
      function without claiming BRAT1 is an importin or absolutely required for every import event. In
      the companion study, residual INTS11 remained nuclear after BRAT1 knockout in HCT116 cells; assistance
      and stabilization need not imply obligatory transport.
