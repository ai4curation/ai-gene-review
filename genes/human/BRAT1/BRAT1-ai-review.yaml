- term:
    id: GO:0051646
    label: mitochondrion localization
  evidence_type: IMP
  original_reference_id: PMID:25070371
  qualifier: involved_in
  review:
    summary: Altered mitochondrial distribution does not establish BRAT1 participation in positioning
      mitochondria.
    action: MARK_AS_OVER_ANNOTATED
    reason: The source reports more condensed mitochondria after BRAT1 depletion in HeLa cells, using
      a mitochondrial-dye morphology assay described in the main Results and Figure S2 caption. GO:0051646
      concerns establishing or maintaining mitochondrial position. The reported phenotype supports an
      effect on organelle distribution, but does not identify a positioning step performed by BRAT1
      or distinguish it from the broader mitochondrial dysfunction in the same cells. Mark the process
      assertion as over-annotated while preserving the reported phenotype; this is not a claim that
      the experimental observation is wrong or that BRAT1 localizes to mitochondria. The supplemental
      image itself was not inspected.
    supported_by:
    - reference_id: PMID:25070371
