- id: file:human/BRAT1/BRAT1-uniprot.txt
  title: Reviewed UniProt record Q6PJG6 (BRAT1_HUMAN)
  findings:
  - statement: BRAT1 is an Integrator assembly factor with three named products and experimental DNA-damage
      and trafficking literature.
core_functions:
- description: BRAT1 occupies the INTS11 active site through its conserved C-terminal motif, inhibiting
    premature endoribonuclease activity while stabilizing an INTS9–INTS11 assembly intermediate. This
    assembly-factor activity supports formation and nuclear delivery of the Integrator cleavage module;
    BRAT1 is released during maturation rather than retained as a catalytic subunit of mature Integrator.
  molecular_function:
    id: GO:0060698
    label: endoribonuclease inhibitor activity
  directly_involved_in:
  - id: GO:0160234
    label: integrator complex assembly
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:39032489
  - reference_id: PMID:39032490
suggested_questions:
- question: Which of the older ATM/DNA-PK, survival and metabolic effects depend on Integrator biogenesis,
    and which reflect separable BRAT1 interactions?
- question: How do the three named BRAT1 products differ in stability, binding and assembly activity?
    Existing unqualified GOA assertions do not establish equivalent activity of all three products.
- question: Can the original partner-specific HuRI/KLF11 records and the YTS membrane-proteome detection
    be inspected to resolve the remaining source assertions?
- question: Is there an appropriate cellular-component term for the transient BRAT1–WDR73–INTS9–INTS11
    assembly intermediate? Its composition and maturation role should be distinguished from mature Integrator
    before asserting complex membership.
