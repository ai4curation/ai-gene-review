- term:
    id: GO:0160234
    label: integrator complex assembly
  evidence_type: IDA
  original_reference_id: PMID:39032490
  qualifier: involved_in
  review:
    summary: The INTS9–INTS11 assembly intermediate is directly supported.
    action: ACCEPT
    reason: The human ternary structure, INTS9/INTS11 destabilization after BRAT1 loss, and wild-type-versus-DCY-mutant
      rescue support cleavage-module biogenesis. BRAT1-bound INTS9/INTS11 is structurally distinct from
      the mature INTS4-containing module, so this annotation does not imply stable membership or transcriptional
      cleavage catalysis by BRAT1.
    supported_by:
    - reference_id: PMID:39032490
