      supporting_text: Functional study showed that the mutant doublecortin protein had a significant
        reduction of its ability to bind microtubules.
    - &id007
      reference_id: PMID:15200960
      supporting_text: doublecortin binds between the protofilaments from which microtubules are built,
        a previously uncharacterized binding site that is ideal for microtubule stabilization
