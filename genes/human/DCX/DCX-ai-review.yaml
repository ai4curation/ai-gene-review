core_functions:
- description: Binds and stabilizes the microtubule lattice (between protofilaments, 13-pf selective)
    in migrating neurons, maintaining the microtubule arrays of the leading process and perinuclear cage
    needed for neuronal migration.
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  directly_involved_in:
  - id: GO:0007026
    label: negative regulation of microtubule depolymerization
  - id: GO:0001764
    label: neuron migration
  locations:
  - id: GO:0043005
    label: neuron projection
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id007
  - *id011
  - *id001
  - reference_id: PMID:15173193
    supporting_text: Dcx localized to a perinuclear cage-like MT structure intersecting the centrosome.
  - *id002
suggested_questions:
- question: Is DCX's contribution to nucleokinesis purely as a stabilizer of the perinuclear microtubule
    track, or does its reported association with LIS1/dynein directly affect dynein force generation on
    the nucleus?
- question: To what extent does DCLK1 redundancy explain the mild cortical phenotype of Dcx-null mice
    versus the severe human and rat RNAi phenotypes, and does this bear on nucleokinesis specifically?
- question: Does CDK5 phosphorylation of DCX (Ser297), which reportedly controls DCX association with
    thin perinuclear microtubules, regulate the perinuclear cage during nucleokinesis, and are DCX effects
    on kinesin-3 cargo transport direct?
suggested_experiments:
- description: Live imaging of nucleus-centrosome coupling in DCX-null human iPSC-derived cortical neurons,
    rescued with wild-type DCX or patient variants that selectively weaken microtubule binding versus
    LIS1 association, to separate track-stabilization from motor-associated roles.
