- term:
    id: GO:0035082
    label: axoneme assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR017302
  review:
    summary: InterPro2GO mapping (IPR017302) to axoneme assembly.
    action: REMOVE
    reason: No evidence links DCX to cilia or axonemes; DCX is a neuronal cytoplasmic MAP expressed in
      migrating and differentiating neurons. Axonemal/ciliary functions in the doublecortin superfamily
