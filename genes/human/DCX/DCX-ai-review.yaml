id: O43602
gene_symbol: DCX
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DCX (doublecortin) is a neuronal microtubule-associated protein built from two tandem doublecortin
  (DC) domains followed by a serine/proline-rich C-terminal region. It is expressed in migrating and differentiating
  neurons of the developing central and peripheral nervous system and in adult neurogenic niches. DCX
  binds the microtubule lattice in the groove between protofilaments, selectively and cooperatively recognizing
  13-protofilament microtubules; it promotes tubulin polymerization and nucleation of 13-protofilament
  microtubules in vitro and stabilizes microtubules against depolymerization. In cells it decorates the
  GDP lattice rather than growing plus ends, and is enriched in leading processes, growth cones and neurite
  tips. Phosphorylation by PKA, MARK/PAR-1 and other kinases lowers its microtubule affinity at the leading
  edge. In migrating neurons DCX outlines the perinuclear microtubule cage that converges on the centrosome
  and associates with LIS1 and dynein, supporting nucleus-centrosome coupling during nucleokinesis. DCX
  is required for radial migration of cortical neurons; loss-of-function variants cause X-linked lissencephaly
  in males and subcortical band heterotopia (double cortex) in females, many of which weaken microtubule
  binding.
