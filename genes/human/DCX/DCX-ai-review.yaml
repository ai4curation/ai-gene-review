- term:
    id: GO:0007026
    label: negative regulation of microtubule depolymerization
  evidence_type: IDA
  original_reference_id: PMID:10399933
  review:
    summary: DCX stabilizes microtubules against depolymerization by binding between protofilaments.
    action: NEW
    reason: DCX-decorated microtubules resist depolymerization, and structural work shows DCX binds the
      inter-protofilament groove, a site ideal for stabilization. DCX itself performs the stabilizing
      work (lattice binding), so it participates in the process. This is the process-level description
      of DCX's core activity and is how other stabilizing MAPs are annotated.
    supported_by:
    - &id011
      reference_id: PMID:10399933
      supporting_text: overexpression of DCX in heterologous cells leads to a dramatic microtubule phenotype
        that is resistant to depolymerization
    - *id007
    - reference_id: PMID:15200960
      supporting_text: Doublecortin stabilizes microtubules and stimulates their polymerization but has
        no homology with other MAPs.
    - reference_id: file:human/DCX/DCX-deep-research-falcon.md
      supporting_text: Early biochemical work showed that DCX colocalizes and coassembles with microtubules,
        promotes polymerization and bundling, and renders a fraction of microtubules resistant to colchicine
        and cold-induced depolymerization.
