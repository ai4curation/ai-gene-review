  review:
    summary: DCX stabilizes microtubules against depolymerization by binding between protofilaments.
    action: NEW
    reason: DCX-decorated microtubules resist depolymerization, and structural work shows DCX binds the
      inter-protofilament groove, a site ideal for stabilization. DCX itself performs the stabilizing
