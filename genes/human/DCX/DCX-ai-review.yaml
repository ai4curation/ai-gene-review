  review:
    summary: DCX is required for neuronal migration; its leading-process localization and phospho-regulation
      are linked to migration.
    action: ACCEPT
    reason: 'Neuron migration is the defining biological role of DCX: human mutations cause X-linked lissencephaly
      and subcortical band heterotopia, in utero RNAi in rat blocks radial migration, and DCX is enriched
      in leading processes of migrating neurons.'
