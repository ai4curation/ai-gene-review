review_followup_2026_10_17:
  reviewed_head: a6bfec16260557cf8df97e1e45dcfd67c772e08b
  scope: Clarify eleven qualitative partner-class refinements, unresolved axoneme mapping, original signal evidence and literal source anchors. No scientific action, source identity, product, description or core is changed.
  binding_interpretation: Controlled binary interaction plus a verified partner class supports the stated binding capacity. Native neuronal coexpression, endogenous complexes, binding affinity and quantitative stoichiometry are unestablished. Three curated PMID:25416956 stages are one study; dataset-level orthogonal validation is not assigned to these individual DCX pairs.
  context_limit: Official expression/location comments do not establish that a pair never meets. IKZF1 is the displayed product, not the cytoplasmic Ik6 variant; its retinal role by similarity is not a native-pair result. MEOX1 mesodermal and KRT40 hair-cuticle contexts make native neuronal relevance uncertain. SPAG5 also has reported nonmitotic localization. KIFC3 kidney-associated evidence by similarity is not an exclusive tissue rule.
  term_scope: The user’s NEW-process ancestor/descendant rule does not prohibit source-specific molecular-function refinements. Existing microtubule binding does not identify the KRT40 or SPAG5 pair; no new core or process coverage is asserted.
  kinesin_limit: GO:0019894 includes stoichiometric binding. The qualitative assay supports the kinesin-pair capacity but does not supply a numerical complex ratio or kinetic constant.
  raw_anchor_method: records.raw_fields contain literal MITAB fields, with source database, original line locator and line checksum. Quoted identifiers are external record fields; evidence_statement values are explicitly reviewer summaries. literal_mappings contains exact InterPro2GO rows that establish mapping provenance, not biological validity.
  public_source_urls:
    intact: https://www.ebi.ac.uk/Tools/webservices/psicquic/intact/webservices/current/search/query/identifier%3AO43602?format=tab27&firstResult=0&maxResults=1000
    mint: https://www.ebi.ac.uk/Tools/webservices/psicquic/mint/webservices/current/search/query/identifier%3AO43602?format=tab27&firstResult=0&maxResults=1000
  publication_quote_policy: No new publication quotation; original-source claims are paraphrased with figure/section locators.
