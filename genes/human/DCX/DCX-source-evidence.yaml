  decision: KEEP_AS_NON_CORE
  reason: The PMID:31515488 IntAct record identifies O43602/Q6NUQ1, is not negative, and marks the partner’s rs35531972 feature at residue 660 as “mutation with no effect”. The original Methods compare WT and mutant interactions and require reproducible growth reduction to call disruption; the paper title does not mean that this pair was disrupted. The feature belongs to RINT1, not DCX. Retain the positive variant-tested interaction without claiming the variant is generally benign, adding an isoform flag, or assigning DCX a membrane-tethering function.
