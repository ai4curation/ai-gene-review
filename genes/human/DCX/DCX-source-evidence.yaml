    decision: KEEP_AS_NON_CORE
    reason: The two domain mappings and target matches are real. In the separately recovered original PMID:22367209 Results and Figure 6B, DCX knockdown in mouse neuronal progenitors reduced PACAP-induced active Rac1 measured by GST-PAK-CRIB pulldown. Figure 6C–E separately shows phosphomutant/Asef2 effects in heterologous cells. These data support contextual signaling participation beyond phosphorylation alone. The normal publication cache remains abstract-only; the original supports this scoped claim. Native human mechanism, direct GEF activity and an exact adaptor mechanism are unestablished, so retain the existing broad IEA as non-core.
    evidence_statement_type: Reviewer summary; literal InterPro2GO rows are provided in literal_mappings.
