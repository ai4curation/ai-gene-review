    reason: IPR017302 is the chordate neuronal-migration doublecortin family, integrated from PIRSF037870, and matches the full 365-residue human DCX product. Its current mapping includes GO:0035082, whose definition concerns ciliary or flagellar axoneme assembly. The inspected source narrative does not identify the experiment or curator rationale for this particular mapping. General microtubule binding and neuronal localization neither establish nor contradict the process, and no target-specific negative result or wrong-paralog transfer was demonstrated. Biological applicability therefore remains unresolved.
