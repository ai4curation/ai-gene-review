  decision: KEEP_AS_NON_CORE
  reason: The exact O43602/O15062 pair has positive PMID:25416956 records for the screen, array and validated-Y2H phases. The official ZBTB5 record says that it may participate in transcriptional regulation; its zinc-finger/BTB architecture alone does not establish the sequence-specific DNA-binding transcription-factor class required by GO:0140297. Keep the supported interaction without inventing a transcriptional or adaptor activity for DCX.
