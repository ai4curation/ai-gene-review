    evidence_statement: 'Electronic source row 36: GO:0035556 is present in the inspected InterPro mapping(s), and the corresponding source entries match human DCX O43602.'
    decision: KEEP_AS_NON_CORE
    reason: 'The two domain mappings and target matches are real. PMID:22367209 reports mouse DCX experiments in neuronal progenitors and heterologous cells: DCX knockdown reduced PACAP-induced Rac1 activation, while the S47E phosphomimic associated with Asef2 and enhanced downstream Rac1 activation. This supports signaling participation beyond being a kinase substrate. The native human mechanism and details inferred from mutant/overexpression assays remain less direct. Retain the existing broad IEA as non-core; do not assign a GEF activity, an exact adaptor mechanism, or a new core.'
  - source_row: 39
    source_term:
