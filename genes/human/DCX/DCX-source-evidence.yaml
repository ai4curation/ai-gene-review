    evidence_statement: 'Electronic source row 39: GO:0060041 is present in the inspected InterPro mapping(s), and the corresponding source entries match human DCX O43602.'
    decision: UNDECIDED
    reason: IPR017302 is a DCX-specific chordate family with a full-length target match, and its current GO mapping includes GO:0060041; a wrong-paralog propagation error has not been established. The inspected abstract of PMID:12752371 documents DCX expression/localization during rat retinal development and proposes a role; it does not establish a developmental step performed by DCX, and the complete original was not reviewed. Cortical disease phenotypes do not exclude retinal function. The mapping therefore remains unresolved rather than being categorically removed or accepted solely from expression.
