- source_row: 3
  reference: PMID:21044950
  partner: Q9BSI4
  partner_symbol: TINF2
  partner_url: https://www.uniprot.org/uniprotkb/Q9BSI4/entry
  evidence_statement: 'Source row 3: PMID:21044950, DCX O43602 and TINF2 Q9BSI4; hit-level evidence for the annotated pair was not recovered.'
  decision: UNDECIDED
  reason: The cached PMID:21044950 body contains the Abstract and Discussion, not the hit-level evidence or complete Methods/Results. Full-original recovery attempts did not yield readable article text, and current target- and TINF2-scoped IntAct/MINT searches did not recover this pair. These are access and source-recovery limits, not evidence against the original curator. TINF2 is a shelterin component, but neither a telomere role nor a narrower binding activity for DCX can be assigned from that identity alone.
  records: []
- source_row: 4
  reference: PMID:21516116
  partner: Q08379
  partner_symbol: GOLGA2
  partner_url: https://www.uniprot.org/uniprotkb/Q08379/entry
  evidence_statement: 'Source row 4: PMID:21516116, DCX O43602 and GOLGA2 Q08379; 1 literal positive interaction record(s) recovered.'
  decision: MODIFY
  reason: 'The exact O43602/Q08379 pair is supported by the positive PMID:21516116 Y2H record(s). GOLGA2/GM130 is a cytoskeletal regulatory protein: PMID:26165940 shows that it relieves importin-mediated TPX2 inhibition, promotes microtubule nucleation, and captures/bundles microtubules; PMID:19242490 supports its role in Golgi-associated microtubule nucleation. This satisfies the partner class in GO:0005519, which is binding to a protein modulating cytoskeletal reorganization. The refinement assigns only binding to this regulatory protein, not Golgi tethering, microtubule nucleation or spindle assembly to DCX. A failed signaling-scaffold interpretation does not preclude this supported class-specific term.'
