      comment: Verified DCX-family entry, PIRSF037870 target match 1–365 and current term mapping. Entry narrative does not establish this target process; no wrong-paralog source was demonstrated.
    evidence_statement: 'Electronic source row 35: GO:0035082 is present in the inspected InterPro mapping(s), and the corresponding source entries match human DCX O43602.'
    decision: UNDECIDED
    reason: IPR017302 is the chordate neuronal-migration doublecortin family, integrated from PIRSF037870, and matches the full 365-residue human DCX product. Both the current InterPro entry and mapping file carry GO:0035082. This is not demonstrated to be a transfer from an RP1 paralog. The term concerns assembly/organization of the ciliary or flagellar axoneme; general microtubule binding and cortical neuronal expression neither establish that role nor refute it. The inspected source description and target evidence do not resolve DCX participation, so replace the unsupported categorical removal with UNDECIDED.
