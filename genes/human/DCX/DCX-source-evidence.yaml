primary_methods:
- reference: PMID:21044950
  pubmed_url: https://pubmed.ncbi.nlm.nih.gov/21044950/
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3033672/
  read_and_limit: Cached Abstract/Discussion only; original full-text attempts failed or returned challenge content. No current literal DCX/TINF2 hit was recovered. Hit-level adjudication remains unresolved.
- reference: PMID:21516116
  pubmed_url: https://pubmed.ncbi.nlm.nih.gov/21516116/
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3188388/
  read_and_limit: Original Methods and Results describe sequence identification, autoactivator controls and pairwise confirmation from archival constructs. Original JATS was available as a saved file; its initial retrieval receipt was absent, so provenance is bounded to that saved original and matching cached text. Pair records, rather than aggregate counts, establish these DCX identities.
- reference: PMID:25416956
  pubmed_url: https://pubmed.ncbi.nlm.nih.gov/25416956/
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4266588/
  read_and_limit: Original Results describe two systematic screens and fresh-colony pairwise quadruplicate retesting, requiring at least three positive results and confirmed identity. Dataset-level orthogonal validation is not attributed individually to every DCX pair. The three curated method phases are not counted as three independent publications.
  original_locator: Main-text Results, fresh-colony pairwise quadruplicate retesting paragraph (saved original lines 1299–1305); context-free biophysical map and sampled orthogonal validation sections. This criterion is in the main original, not a separately recovered supplement.
- reference: PMID:31515488
  pubmed_url: https://pubmed.ncbi.nlm.nih.gov/31515488/
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6742646/
  read_and_limit: Original Methods compare WT and mutant pairs with autoactivation controls; disruption requires at least 50% reduced growth reproduced in three screens. Positive/non-disrupted records must be distinguished from the paper’s disruptive examples.
- reference: PMID:33961781
  pubmed_url: https://pubmed.ncbi.nlm.nih.gov/33961781/
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8165030/
  read_and_limit: Original Methods describe tagged-bait anti-HA purification, mass-spectrometry quality controls, gene-level aggregation and confidence filtering. The Results explicitly discuss indirect co-complex edges. Cell line, bait/prey orientation and tags are retained for each DCX pair.
- reference: PMID:26165940
  pubmed_url: https://pubmed.ncbi.nlm.nih.gov/26165940/
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4506739/
  read_and_limit: Original Results and Methods demonstrate GM130-dependent TPX2 release, microtubule nucleation and capture/bundling. Assays include N-terminal 74-aa constructs, mitotic HeLa extracts and rat Golgi/cell material. Used only to establish the binding partner class, not a DCX spindle mechanism.
  original_locator: 'Original Results Figures 4–6 and Methods: TPX2/importin-alpha competition, TPX2 depletion, aster assembly, microtubule co-pelleting and bundling. Selected original body paragraphs 0–21,23,24,26,27 were read and matched to the genuine PMC JATS.'
- reference: PMID:19242490
  pubmed_url: https://pubmed.ncbi.nlm.nih.gov/19242490/
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2683699/
  read_and_limit: 'PubMed/PMC abstract read: GM130 depletion perturbs AKAP450 organization and Golgi microtubule nucleation. Full-body original was not recovered through PMC efetch; no complete Methods read claimed.'
- reference: PMID:22367209
  pubmed_url: https://pubmed.ncbi.nlm.nih.gov/22367209/
  original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3339951/
  read_and_limit: Indexed original Methods/Results inspected; direct downloads returned challenge pages or metadata/abstract only. Mouse cortical NPCs and mouse-brain cDNA, with HEK293T/COS7 host assays; S47 phosphomutants and downstream Rac1 readouts. An association/activation model is not proof of direct GEF catalysis or a fully established native human adaptor mechanism. The authors could not map the interaction/activation sites and left the physiological role of Asef2 in migration unresolved.
  original_locator: 'Original Results subsection on Gs-PKA signaling and Rac1, Figure 6B: shLuc/shDCX1 in neuronal progenitors, PACAP and GST-PAK-CRIB pulldown (saved indexed original lines 144 and 150). Figure 6C–E separately concerns HEK293T mutants/Asef2. Adjacent Methods identifies mouse DCX constructs and neuronal progenitor preparation.'
  access_distinction: The normal cached PMID record is abstract-only. The original Results, Figure 6 legend, Methods and Discussion were separately recovered as indexed original text; failed direct-download bodies were not used as original evidence.
- reference: PMID:12752371
  pubmed_url: https://pubmed.ncbi.nlm.nih.gov/12752371/
  original_url: https://doi.org/10.1046/j.1460-9568.2003.02583.x
  read_and_limit: Rat retinal immunocytochemistry/Western-blot abstract read. Expression/localization and the authors’ proposed role do not establish developmental participation; complete original unavailable in this audit.
