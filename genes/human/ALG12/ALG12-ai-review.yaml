id: Q9BV10
gene_symbol: ALG12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALG12 is a multipass endoplasmic reticulum membrane mannosyltransferase of
  glycosyltransferase family 22. At the lumenal face of the membrane it transfers mannose from
  dolichyl-phosphate-mannose to Man7GlcNAc2-PP-dolichol, adding the eighth mannose in an alpha-1,6
  linkage to form Man8GlcNAc2-PP-dolichol. This reaction builds the lipid-linked oligosaccharide
  precursor used for protein N-linked glycosylation. Biallelic loss of ALG12 activity causes ALG12
  congenital disorder of glycosylation, with defective precursor assembly and under-glycosylated
  proteins.
