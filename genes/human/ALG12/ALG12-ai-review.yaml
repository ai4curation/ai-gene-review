- id: PMID:41807832
  title: Structures of ALG3/9/12 reveal the assembly logic of the N-glycan oligomannose core.
  full_text_unavailable: false
  findings:
  - statement: The study tests chicken ALG12 rather than human ALG12; the human cell line is the
      expression host, and purified chicken enzyme processes shortened lipid-linked substrates.
    supporting_text: On the basis of these results, we selected ALG3 from Saccharomyces cerevisiae
      (ScALG3), ALG9 from Homo sapiens (HsALG9) and ALG12 from Gallus gallus (GgALG12) for structural
      and functional studies
  - statement: The E35Q ALG12 construct facilitates a substrate-bound structure and is distinguished
      from the wild-type enzyme used for the positive transfer assays.
    supporting_text: To facilitate the trapping of pseudo-Michaelis complexes, we substituted the
      residues providing the putative catalytic base in ScALG3 (D71N), HsALG9 (D82A) and GgALG12 (E35Q)
      to either an alanine or the corresponding carboxamide side chain.
  - statement: The pathway description places ALG12 C-branch initiation after completion of the B
      branch; this is an ordering claim, while the measured ALG12 enzyme in this study is the chicken
      ortholog.
    supporting_text: Only when the B branch is complete does ALG12 initiate the C branch with the
      addition of the α1,6-linked j mannose
  - statement: The chicken ALG12 ternary structure shows an acceptor cavity accommodating the completed
      B branch. This ortholog structure supports the specificity model without claiming a measured
      human ALG12 structure.
    supporting_text: The ALG12 ternary structure reveals that this is implemented by a deep binding
      cavity that accommodates the B branch of the acceptor glycan
  - statement: The discussion relates complete glycan branches to efficient processing by glucosidases
      and UGGT in the downstream folding cycle. It does not show that ALG12 itself folds polypeptides
      or that truncated glycans are universally inactive.
    supporting_text: the glucosidases and UGGT require a fully mannosylated glycan with complete
      B and C branches for efficient removal or addition of glucose
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The exact normal-fetch record now provides full Results, Methods and figure
      captions, independently reread after source7 recovery. Its PubMed metadata confirms the
      previously verified primary publisher DOI 10.1038/s41589-026-02164-7 and RCSB 9S6T linkage.
      Methods identify chicken GgALG12 (F1P077), human HsALG9 and yeast ScALG3 constructs expressed
      in human 293 c18 cells. Wild-type GgALG12 transfers mannose using synthetic Dol25-linked
      substrates; E35Q has strongly decreased activity and supports substrate-bound cryo-EM. The
      11-helix ALG12 structure and mapped disease substitutions are ortholog evidence, not a direct
      human ALG12 structural experiment. Fab/nanobody-assisted imaging does not establish a native
      ALG12 complex. This conserved-mechanism evidence corroborates the established chemistry;
      no new human annotation is manufactured from it.'
