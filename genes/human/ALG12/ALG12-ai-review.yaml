- term:
    id: GO:0006457
    label: protein folding
  evidence_type: NAS
  original_reference_id: PMID:12217961
  qualifier: involved_in
  review:
    summary: The original source does not yet resolve ALG12 participation in protein folding.
    action: UNDECIDED
    reason: The accessible original-paper preview establishes precursor glycosylation defects and
      complementation, but the complete Results and Discussion needed to adjudicate the NAS folding
      statement were not recovered. GO:0006457 concerns assistance in polypeptide assembly and is
      not restricted to classical chaperones; being a glycosyltransferase does not alone disprove
      participation. Retain uncertainty about the specific folding role while the precursor-assembly
      function remains established. The cached structural study places glycan processing by glucosidases
      and UGGT in the calnexin/calreticulin folding cycle, downstream of lipid-linked precursor synthesis.
      Its requirement for complete branches concerns efficient processing; human ALG12-deficient
      fibroblasts can still glucosylate truncated Man7 glycans (PMID:11983712). This distinguishes
      the established precursor reaction from an independently demonstrated ALG12 folding step without
      resolving the unread original NAS claim.
    supported_by:
    - reference_id: PMID:12217961
      supporting_text: a deficiency in the ALG12 ER alpha1,6-mannosyltransferase
    - reference_id: PMID:12217961
      supporting_text: expression of the normal ALG12 cDNA complemented the yeast mutation.
