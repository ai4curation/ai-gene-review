core_functions:
- description: Proton-coupled (H+ symport) transport of folates across the apical/brush-border
    plasma membrane of enterocytes, mediating intestinal absorption of dietary folate at acidic
    pH; the same activity transports antifolate drugs (methotrexate, pemetrexed) and operates at
    the choroid plexus and acidified endosomes.
