id: Q96NT5
gene_symbol: SLC46A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC46A1 (PCFT; historically HCP1) is a 12-transmembrane-helix member of
  the major facilitator superfamily that acts as a proton-coupled, high-affinity folate
  symporter. It uses the inwardly directed transmembrane H(+) gradient to drive uphill,
  electrogenic uptake of folates (folic acid, 5-methyltetrahydrofolate, 5-formyltetrahydrofolate)
  and antifolate drugs (methotrexate, pemetrexed), with an acidic pH optimum of about
  5.0-5.5 and negligible activity at neutral pH. It is most highly expressed at the apical
  (brush-border) membrane of enterocytes in the proximal small intestine (duodenum/jejunum),
  where it mediates the intestinal absorption of dietary folate, and at the choroid plexus,
  where it transports folate from blood into cerebrospinal fluid; it also exports folate
  from acidified endosomes during folate-receptor (FOLR1)-mediated endocytosis. Loss-of-function
  mutations cause the autosomal recessive disorder hereditary folate malabsorption (HFM),
  characterized by systemic and cerebrospinal-fluid folate deficiency, megaloblastic anemia,
  immunodeficiency and neurological disease. The protein was originally cloned as an intestinal
  heme carrier protein (HCP1); subsequent work established proton-coupled folate transport
  as its major physiological function, with heme transport being lower-affinity, pH-independent
  and contested.
