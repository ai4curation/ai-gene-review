proposed_new_terms: []
suggested_questions:
- question: Does PCFT transport heme (or related metabolites) at a level and in a physiological
    context that justifies retaining a heme-transporter annotation, or is the residual heme
    activity an artifact of overexpression, given that it was originally cloned as HCP1 but Qiu
    et al. established proton-coupled folate transport as its major function?
- question: What determines PCFT's tissue-specific apical versus basolateral targeting (apical in
    enterocytes, basolateral in choroid plexus), which is essential for vectorial folate transport?
suggested_experiments:
- description: Quantify endogenous heme and folate transport by PCFT in a native polarized intestinal
    model (e.g. primary enterocytes or intestinal organoids) with PCFT knockout/rescue, using isotopically
    labeled heme and folate, to resolve the physiological relevance and kinetics of each substrate and
    adjudicate the long-standing folate-versus-heme controversy.
  hypothesis: PCFT mediates high-affinity folate transport as its physiological function, while heme
    transport is low-affinity and of limited physiological relevance in intestine.
- description: Determine the structural and sequence determinants of apical versus basolateral sorting
    of PCFT in polarized epithelial cells by domain swapping and mutagenesis combined with surface
    biotinylation.
  hypothesis: Distinct cytoplasmic sorting signals direct PCFT to the apical membrane in enterocytes and
    the basolateral membrane in choroid plexus.
knowledge_gaps:
- gap_statement: Whether PCFT performs physiologically meaningful heme transport, and if so by what
    mechanism and with what affinity relative to its folate transport, remains unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
