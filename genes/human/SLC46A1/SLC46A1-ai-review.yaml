      reason: PCFT is not a physiologically significant / high-affinity heme transporter (this negated
        row, Qiu 2006), yet a low-affinity, pH-independent residual heme-carrier activity is reported
        in specific tissues (Latunde-Dada 2006; iron/hepatocyte data). The NOT (no significant/high-affinity
        heme transport) and the retained low-affinity heme row hold in different affinity/context regimes.
    supported_by:
    - reference_id: PMID:17129779
      supporting_text: the current study establishes that a major function of this gene product is
        proton-coupled folate transport required for folate homeostasis in man
