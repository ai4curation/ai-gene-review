  review:
    summary: Qiu et al. established that this gene product's major function is proton-coupled folate
      transport, correcting its original identification as the heme carrier protein HCP1 - i.e. it
      is not a physiologically significant / high-affinity heme transporter.
    action: ACCEPT
    reason: The definitive characterization by Qiu et al. reclassified the protein, showing that
      despite its prior report as a lower-affinity, pH-independent heme carrier protein (HCP1), a
      major function of the gene product is proton-coupled folate transport. The negated annotation
      records that PCFT is not a significant/high-affinity heme transporter. A low-affinity, contested
      residual heme-carrier activity is nonetheless reported by others; the two coexist in different
      affinity/context regimes (see consistency_exception).
