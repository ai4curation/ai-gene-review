    supporting_text: in synaptotagmin 1 knockout mice, the fast component of both Ca(2+)- and Sr(2+)-induced
      release is selectively impaired
  - reference_id: PMID:27191789
    supporting_text: Synaptotagmin I (Syt I) is a vesicle-localized integral membrane protein that senses the
      calcium ion (Ca(2+)) influx to trigger fast synchronous release of neurotransmitter.
  - reference_id: PMID:25973365
    supporting_text: Synaptotagmin is a synaptic vesicle membrane protein which changes conformation upon
      Ca(2+) binding and triggers the fast neuroexocytosis that takes place at synapses.
  - reference_id: Reactome:R-HSA-210430
    supporting_text: Ca2+ influx initiates a cascade of events in which the Ca2+ sensing protein,
      synaptotagmin-1 (sty-1) is central.
