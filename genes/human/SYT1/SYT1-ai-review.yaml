- id: PMID:25973365
  title: The synaptotagmin juxtamembrane domain is involved in neuroexocytosis.
  findings:
  - statement: The juxtamembrane segment of synaptotagmin binds anionic phospholipids, including
      phosphatidylserine and phosphoinositides, independently of Ca2+, and peptides derived from it inhibit
      neurotransmitter release at the neuromuscular junction.
    supporting_text: have found a defined interaction of JMS with anionic phospholipids, including PS and
      phosphorylated derivatives of phosphatidylinositols
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Supports a Ca2+-independent membrane contact by the juxtamembrane region
      and presynaptic membrane localization of the peptides; the Ca2+-dependent C2 lipid binding it describes
      is background from the cited literature rather than this study's own result.
- id: PMID:27191789
  title: Synaptotagmin I's Intrinsically Disordered Region Interacts with Synaptic Vesicle Lipids and Exerts
    Allosteric Control over C2A.
  findings:
  - statement: The disordered region between the transmembrane helix and C2A interacts with
      synaptic-vesicle-like lipid membranes and allosterically modulates Ca2+ binding by C2A.
    supporting_text: Syt I's IDR interacts with membranes whose lipid composition mimics that of a synaptic
      vesicle
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Calorimetry and NMR on the isolated region; supports lipid binding and allostery, not the
      vesicle organization claim the GOA row attaches to it.
