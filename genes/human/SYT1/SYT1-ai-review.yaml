    reason: 'GO:0005515 protein binding is uninformative as an annotation: it states that SYT1 binds some protein
      without saying which function that binding serves. None of the cited reports supports a more informative molecular
      function term for SYT1 itself - the Cav beta4a, SCAMP5, S100A13, NEMO, GPCR and binary-interactome studies
      identify partners rather than an activity - and the functionally meaningful binding activities SYT1 does have
      are annotated separately as SNARE binding, syntaxin-1 binding, calcium-dependent phospholipid binding and
      PI(4,5)P2 binding. Removing these rows is a statement about the term, not about the interactions, which are
      not being called false.'
