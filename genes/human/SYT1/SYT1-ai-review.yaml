- term:
    id: GO:0001786
    label: phosphatidylserine binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P21707
  - ensembl:ENSRNOP00000049624
  review:
    summary: Ca2+-dependent binding of phosphatidylserine by the C2 domains.
    action: ACCEPT
    reason: Phosphatidylserine binding is a specific, experimentally grounded property of the synaptotagmin
      cytoplasmic domain, shown for the human protein itself in the cloning study, and it is one half of the
      lipid interaction that drives membrane penetration during fusion.
    supported_by:
    - reference_id: PMID:1840599
      supporting_text: The cytoplasmic domains of human and Drosophila synaptotagmins produced as recombinant
        proteins in Escherichia coli specifically bound phosphatidylserine similar to rat synaptotagmin.
    - reference_id: PMID:25973365
      supporting_text: binds anionic PM phospholipids, including phosphatidylserine and
        phosphatidylinositol-4,5-biphosphate, in a Ca2+ dependent way
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:P21707
  - ensembl:ENSRNOP00000049624
  - UniProtKB:P46096
  - ensembl:ENSMUSP00000063293
  review:
    summary: Calcium ion binding by the C2A and C2B domains.
    action: MODIFY
    reason: 'The claim is true but less specific than the evidence supports: SYT1 does not merely bind Ca2+, it
      transduces the Ca2+ signal into membrane and SNARE engagement, which is exactly what calcium ion sensor activity
      describes. That term is already carried by this gene (IBA and IEA rows), so the replacement is a refinement
      to a descendant the annotation set already uses.'
    proposed_replacement_terms:
    - id: GO:0061891
      label: calcium ion sensor activity
    supported_by:
    - reference_id: PMID:12526776
      supporting_text: Both the C(2)A and the C(2)B domain of synaptotagmin 1 bind Ca(2+) in phospholipid
        complexes
    - reference_id: PMID:27191789
      supporting_text: Synaptotagmin I (Syt I) is a vesicle-localized integral membrane protein that senses
        the calcium ion (Ca(2+)) influx to trigger fast synchronous release of neurotransmitter.
    - reference_id: file:human/SYT1/SYT1-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 3 Ca(2+) ions per subunit. The ions are bound to the C2 domains.
- term:
    id: GO:0005513
    label: detection of calcium ion
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P21707
  - ensembl:ENSRNOP00000049624
  review:
    summary: Detection of the presynaptic Ca2+ transient by the C2 domains.
    action: KEEP_AS_NON_CORE
    reason: Detection of calcium ion is the biological-process restatement of the sensor activity that is
      captured as a core molecular function here, so it is true and as precise as warranted but is not where
      the review puts the core claim. The TAS row cites a RIM paper that reports Ca2+-modulated
      RIM-synaptotagmin binding rather than Ca2+ detection by SYT1; the term is still right for the gene, so
      it is kept rather than removed.
    supported_by:
    - reference_id: PMID:27191789
      supporting_text: Synaptotagmin I (Syt I) is a vesicle-localized integral membrane protein that senses
        the calcium ion (Ca(2+)) influx to trigger fast synchronous release of neurotransmitter.
    - reference_id: PMID:12526776
