- id: PMID:12526776
  title: Sr2+ binding to the Ca2+ binding site of the synaptotagmin 1 C2B domain triggers fast exocytosis
    without stimulating SNARE interactions.
  findings:
  - statement: In synaptotagmin-1 knockout mice the fast component of evoked release is selectively impaired,
      identifying SYT1 as the sensor for the fast phase.
    supporting_text: in synaptotagmin 1 knockout mice, the fast component of both Ca(2+)- and Sr(2+)-induced
      release is selectively impaired
  - statement: Both C2 domains form Ca2+/phospholipid complexes, and Ca2+ induces binding of the C2 domains to
      SNARE proteins.
    supporting_text: Ca(2+) induces binding of the synaptotagmin C(2) domains to SNARE proteins
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cation-substitution study that separates the lipid-complex and SNARE-binding arms of SYT1
      function; abstract alone supports both the knockout result and the Ca2+-induced SNARE binding quoted
      here.
