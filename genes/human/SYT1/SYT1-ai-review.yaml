- term:
    id: GO:0000149
    label: SNARE binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0004242
  - FB:FBgn0028400
  - MGI:MGI:1859545
  - MGI:MGI:1859546
  - MGI:MGI:1859547
  - MGI:MGI:1926368
  - MGI:MGI:1926373
  - MGI:MGI:99667
  - PANTHER:PTN000001283
  - RGD:3803
  - RGD:3804
  - RGD:3805
  - RGD:3806
  - RGD:62013
  - RGD:68397
  - UniProtKB:Q5T7P8
  review:
    summary: SYT1 binds the neuronal SNARE complex and its t-SNARE components through the C2B domain.
    action: ACCEPT
    reason: SNARE binding is a core molecular function of synaptotagmin-1 and is the contact that couples Ca2+
      sensing to the fusion machinery. It is supported directly for the protein (Ca2+-induced binding of the
      C2 domains to SNARE proteins) and by the Ca2+-independent syntaxin interaction recorded by UniProt, so
      the phylogenetic (IBA), ortholog (IEA) and sequence-similarity (ISS) rows all land on the right claim at
      the right level.
    supported_by:
    - reference_id: PMID:12526776
      supporting_text: Ca(2+) induces binding of the synaptotagmin C(2) domains to SNARE proteins
    - reference_id: file:human/SYT1/SYT1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: It can bind to at least three additional proteins in a Ca(2+)-independent manner; these
        are neurexins, syntaxin and AP2.
