id: P21579
gene_symbol: SYT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Synaptotagmin-1 is a single-pass transmembrane protein of synaptic vesicles and of neuroendocrine
  dense-core (chromaffin) granules. A short glycosylated N-terminal segment lies in the vesicle lumen; a charged
  juxtamembrane linker and two tandem cytoplasmic C2 domains (C2A and C2B) face the cytosol. The C2 domains bind
  several Ca2+ ions through conserved aspartate-lined loops, and on Ca2+ binding they insert into membranes rich
  in anionic phospholipids (phosphatidylserine and PI(4,5)P2); the C2B domain also binds PI(4,5)P2 through a Ca2+-independent
  polybasic patch and engages the neuronal SNARE complex (syntaxin-1, SNAP-25, synaptobrevin) directly. Through
  this coupling of Ca2+ sensing to membrane and SNARE binding, synaptotagmin-1 is the low-affinity Ca2+ sensor that
  triggers fast, synchronous neurotransmitter release at forebrain synapses and fast catecholamine release from
  chromaffin cells, and it also restrains spontaneous and asynchronous fusion before Ca2+ entry. After fusion it
  is transiently exposed on the presynaptic plasma membrane and is retrieved by clathrin-mediated endocytosis through
  stonin 2, SV2 and AP-2, and it promotes the rate of vesicle retrieval. Its lumenal domain, exposed at the surface
  after exocytosis, is a receptor for botulinum neurotoxins B and G. Heterozygous dominant-negative variants, mostly
  in C2B, cause Baker-Gordon syndrome, a neurodevelopmental disorder.'
