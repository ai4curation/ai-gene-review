- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:24327345
  qualifier: located_in
  review:
    summary: Cytoplasm.
    action: MODIFY
    reason: SYT1 is a single-pass integral membrane protein of synaptic vesicles whose C2 domains face the
      cytosol; that topology is not a cytoplasmic localization, and no primary evidence for a functional
      soluble pool has been found. The supported location is the synaptic vesicle membrane, which this gene
      already carries. The IDA row cites a study of DYRK1A subcellular distribution whose cached full text
      does not mention synaptotagmin at all, so it adds nothing to the cytoplasm claim either.
    proposed_replacement_terms:
    - id: GO:0030672
      label: synaptic vesicle membrane
    supported_by:
    - reference_id: file:human/SYT1/SYT1-deep-research-claude-code.md
      supporting_text: I found no primary evidence for a functional soluble pool.
    - reference_id: file:human/SYT1/SYT1-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Cytoplasmic vesicle, secretory vesicle, synaptic vesicle membrane
