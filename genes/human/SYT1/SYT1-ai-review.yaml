suggested_questions:
- question: By what physical step does Ca2+-bound C2B trigger fusion? Membrane bending, bridging of the two
    bilayers, release of an oligomeric or complexin clamp on SNARE zippering, and a lever-like reorientation
    of C2B on the SNARE complex are all still on the table, and recent all-atom simulations argue against
    curvature and bridging.
- question: Does human SYT1 have a functional cytosolic pool, or is the cytoplasm annotation an artefact of
    fractionating an integral vesicle membrane protein whose C2 domains face the cytosol?
- question: Is the reported requirement for synaptotagmin-1 in non-classical FGF1 release, and the melanocyte
    dendrite phenotype, a function of full-length SYT1 or of the alternatively translated p40 form and of
    paralogous C2 domains?
suggested_experiments:
- description: Knock in the individual Baker-Gordon C2A and C2B variants at the endogenous human SYT1 locus in
    iPSC-derived excitatory neurons and measure evoked, spontaneous and asynchronous release, to separate loss
    of Ca2+ triggering from loss of the clamp in a human genetic background.
- description: Reconstitute human SYT1 with neuronal SNAREs and complexin on PI(4,5)P2/PS-containing bilayers
    and follow C2B orientation by single-molecule FRET during Ca2+ jumps, to test the lever model against the
    clamp-release and bridging models directly.
- description: Deplete STON2, SV2A/B and AP-2 separately and together in human neurons and quantify surface
    versus vesicular endogenous SYT1 together with retrieval kinetics, to separate SYT1's role as endocytic
    cargo from its effect on the rate of vesicle retrieval.
