- term:
    id: GO:0061588
    label: calcium activated phospholipid scrambling
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P21707
  - ensembl:ENSRNOP00000049624
  review:
    summary: Calcium activated phospholipid scrambling.
    action: REMOVE
    reason: 'Scrambling is the collapse of bilayer lipid asymmetry carried out by dedicated scramblases, and SYT1
      has no such activity: its molecular function is Ca2+ sensing coupled to Ca2+-dependent binding and penetration
      of anionic phospholipid membranes, which changes neither leaflet composition nor requires lipid translocation.
      This row is an ortholog-based electronic inference with no human evidence, and the rat SYT1 review reached
      the same conclusion on the underlying rodent annotations.'
    supported_by:
    - reference_id: PMID:25973365
      supporting_text: binds anionic PM phospholipids, including phosphatidylserine and
        phosphatidylinositol-4,5-biphosphate, in a Ca2+ dependent way
    - reference_id: PMID:12526776
      supporting_text: Both the C(2)A and the C(2)B domain of synaptotagmin 1 bind Ca(2+) in phospholipid
        complexes
- term:
    id: GO:0061891
    label: calcium ion sensor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:99667
  - PANTHER:PTN000001283
  - RGD:3803
  - WB:WBGene00004921
  - WB:WBGene00004923
  review:
    summary: Calcium ion sensor activity.
    action: ACCEPT
    reason: This is the core molecular function. SYT1 binds Ca2+ at low affinity through both C2 domains and
      responds by inserting into anionic membranes and engaging the SNARE complex, which is what makes evoked
      release fast and Ca2+-dependent; the knock-in that lowers the apparent Ca2+ affinity of lipid binding
      lowers release probability to match, which is what makes the sensor claim rather than a cofactor claim.
    supported_by:
    - reference_id: PMID:27191789
      supporting_text: Synaptotagmin I (Syt I) is a vesicle-localized integral membrane protein that senses
        the calcium ion (Ca(2+)) influx to trigger fast synchronous release of neurotransmitter.
    - reference_id: PMID:12526776
      supporting_text: in synaptotagmin 1 knockout mice, the fast component of both Ca(2+)- and Sr(2+)-induced
        release is selectively impaired
    - reference_id: file:human/SYT1/SYT1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Calcium sensor that participates in triggering neurotransmitter release at the synapse
