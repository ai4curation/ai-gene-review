- term:
    id: GO:7770062
    label: vesicle membrane tethering activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P21707
  - ensembl:ENSRNOP00000049624
  review:
    summary: Vesicle membrane tethering activity.
    action: KEEP_AS_NON_CORE
    reason: SYT1 can bridge the vesicle and plasma membranes, holding its C2 domains on vesicle lipids and on
      the PI(4,5)P2-rich inner leaflet at the same time, and it contributes to docking, so the activity is not
      wrong. It is kept as non-core because bridging is one of several competing accounts of how Ca2+-bound
      SYT1 triggers fusion and recent all-atom simulations argue against it, whereas the Ca2+ sensing, lipid
      binding and SNARE binding activities are not in dispute.
    supported_by:
    - reference_id: PMID:25973365
      supporting_text: binds anionic PM phospholipids, including phosphatidylserine and
        phosphatidylinositol-4,5-biphosphate, in a Ca2+ dependent way
    - reference_id: PMID:25973365
      supporting_text: have found a defined interaction of JMS with anionic phospholipids, including PS and
        phosphorylated derivatives of phosphatidylinositols
