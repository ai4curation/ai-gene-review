core_functions:
- description: Low-affinity Ca2+ sensor for fast synchronous neurotransmitter release. Ca2+ binding to the C2A
    and C2B domains on the synaptic vesicle membrane triggers SNARE-mediated fusion of docked vesicles with
    the presynaptic active zone membrane within a millisecond of Ca2+ entry.
