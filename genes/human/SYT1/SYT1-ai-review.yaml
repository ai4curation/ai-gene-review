- term:
    id: GO:0006855
    label: xenobiotic transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P21707
  - ensembl:ENSRNOP00000049624
  review:
    summary: Xenobiotic transmembrane transport.
    action: MARK_AS_OVER_ANNOTATED
    reason: SYT1 has no transport activity. What underlies this claim is its role as the surface receptor
      whose lumenal domain botulinum neurotoxins B and G bind before being internalized and translocating
      their own light chain; the translocation is performed by the toxin heavy chain, not by SYT1. The
      receptor role is real, so the row is flagged rather than removed, but SYT1 is not the entity that
      carries out the transport.
    supported_by:
    - reference_id: Reactome:R-HSA-5244397
      supporting_text: binds ganglioside GT1b and syntagmin 1 or 2 (SYT1 or 2) on the plasma membrane of a
        human target cell
- term:
    id: GO:0006906
    label: vesicle fusion
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P21707
  - ensembl:ENSRNOP00000049624
  review:
    summary: Vesicle fusion.
    action: MODIFY
    reason: SYT1 does not execute fusion; the SNAREs do. Its contribution is to make fusion conditional on
      Ca2+ and to trigger it within a millisecond of Ca2+ entry, which is exactly what calcium-dependent
      activation of synaptic vesicle fusion describes, and that term is already carried by this gene.
    proposed_replacement_terms:
    - id: GO:0099502
      label: calcium-dependent activation of synaptic vesicle fusion
    supported_by:
    - reference_id: Reactome:R-HSA-210430
      supporting_text: Ca2+ influx initiates a cascade of events in which the Ca2+ sensing protein,
        synaptotagmin-1 (sty-1) is central.
    - reference_id: PMID:27191789
      supporting_text: Synaptotagmin I (Syt I) is a vesicle-localized integral membrane protein that senses
        the calcium ion (Ca(2+)) influx to trigger fast synchronous release of neurotransmitter.
- term:
    id: GO:0007268
    label: chemical synaptic transmission
  evidence_type: TAS
  original_reference_id: PMID:1840599
  qualifier: involved_in
  review:
    summary: Chemical synaptic transmission, cited to the human and Drosophila synaptotagmin cloning paper.
    action: MODIFY
    reason: "True but far more general than the evidence supports: SYT1's contribution to synaptic transmission
      is specifically the fast, synchronous phase of Ca2+-triggered transmitter release, which this gene already
      carries as a term, while the slow asynchronous phase persists without it."
    proposed_replacement_terms:
    - id: GO:0098746
      label: fast, calcium ion-dependent exocytosis of neurotransmitter
    supported_by:
    - reference_id: PMID:12526776
      supporting_text: in synaptotagmin 1 knockout mice, the fast component of both Ca(2+)- and Sr(2+)-induced
        release is selectively impaired
    - reference_id: PMID:27191789
      supporting_text: Synaptotagmin I (Syt I) is a vesicle-localized integral membrane protein that senses
        the calcium ion (Ca(2+)) influx to trigger fast synchronous release of neurotransmitter.
