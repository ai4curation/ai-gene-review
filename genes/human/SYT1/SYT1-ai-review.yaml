- id: PMID:1840599
  title: Structural and functional conservation of synaptotagmin (p65) in Drosophila and humans.
  findings:
  - statement: The recombinant cytoplasmic domain of human synaptotagmin binds phosphatidylserine, as the rat
      protein does, and the protein is an abundant synaptic vesicle protein conserved from Drosophila to
      human.
    supporting_text: The cytoplasmic domains of human and Drosophila synaptotagmins produced as recombinant
      proteins in Escherichia coli specifically bound phosphatidylserine similar to rat synaptotagmin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The human cloning paper, and one of the few sources of direct evidence on the human protein
      rather than an ortholog.
