- term:
    id: GO:0005543
    label: phospholipid binding
  evidence_type: IDA
  original_reference_id: PMID:25973365
  qualifier: enables
  review:
    summary: Phospholipid binding by the cytoplasmic region.
    action: MODIFY
    reason: Phospholipid binding is correct but more general than the evidence supports. The defining lipid
      interaction of SYT1 is Ca2+-dependent binding of anionic phospholipids by the C2 domain loops, for which
      calcium-dependent phospholipid binding is the supported specific term and is already carried by this
      gene. The Ca2+-independent binding of anionic lipids by the juxtamembrane segment reported in the cited
      study is additionally covered by the existing phosphatidylserine binding and PI(4,5)P2 binding rows.
    proposed_replacement_terms:
    - id: GO:0005544
      label: calcium-dependent phospholipid binding
    supported_by:
    - reference_id: PMID:25973365
      supporting_text: have found a defined interaction of JMS with anionic phospholipids, including PS and
        phosphorylated derivatives of phosphatidylinositols
    - reference_id: PMID:25973365
      supporting_text: binds anionic PM phospholipids, including phosphatidylserine and
        phosphatidylinositol-4,5-biphosphate, in a Ca2+ dependent way
    - reference_id: PMID:12526776
      supporting_text: Both the C(2)A and the C(2)B domain of synaptotagmin 1 bind Ca(2+) in phospholipid
        complexes
