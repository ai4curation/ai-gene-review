    reason: Binding of PDE6D to GTP-bound ARL2/ARL3 stabilizes the GTP state, and PDE6D has been described
      as a GDI-like factor. This is a consequence of effector binding, not the evolved function of PDE6D,
      which is to carry prenylated cargo. Kept, but non-core.
