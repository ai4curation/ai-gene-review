  evidence_type: IDA
  original_reference_id: PMID:22002721
  review:
    summary: PDE6D binds the farnesyl moiety of prenylated cargo in its hydrophobic pocket. This is shown
      by the crystal structure of fully modified farnesylated Rheb with PDEdelta, by prenylation-dependent
      binding of INPP5E, and by small molecules that compete for the prenyl-binding pocket and displace
      KRAS.
    action: NEW
    reason: This is the specific molecular basis of PDE6D's carrier activity, and it is supported directly
      by structural and biochemical evidence. GOA currently has only the generic molecular carrier activity
      and many protein-binding rows with prenylated partners (HRAS, RHEB, RAB13). Farnesylated protein
      binding (GO:0001918) records the cargo-recognition activity informatively.
    supported_by:
    - reference_id: PMID:22002721
      supporting_text: Here we report the structure of fully modified farnesylated Rheb-GDP in complex
        with PDEδ.
    - reference_id: PMID:23698361
      supporting_text: Correct localization and signalling by farnesylated KRAS is regulated by the prenyl-binding
        protein PDEδ, which sustains the spatial organization of KRAS by facilitating its diffusion in
        the cytoplasm.
    - reference_id: PMID:24166846
      supporting_text: Having determined that both the PDE6D-INPP5E interaction and proper INPP5E ciliary
        localization requires prenylation
