id: O43924
gene_symbol: PDE6D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PDE6D (PDEdelta, PrBP/delta) is a small (~17 kDa), ubiquitously expressed cytosolic prenyl-binding
  protein with an immunoglobulin-like beta-sandwich fold related to RhoGDI. Its deep hydrophobic pocket
  binds the farnesyl (and some geranylgeranyl) moiety of C-terminally prenylated proteins and solubilizes
  them from membranes. In this way it acts as a GDI-like carrier that lets lipidated cargo diffuse through
  the cytoplasm. Cargo is unloaded when the Arf-like GTPases ARL2 or ARL3 bind PDE6D in their GTP-bound
  state and allosterically eject the prenyl group. Two roles follow from this mechanism. In cilia, PDE6D
  delivers farnesylated cargo such as INPP5E and, in photoreceptors, GRK1 and PDE6 catalytic subunits;
  ciliary ARL3-GTP (activated by ARL13B) releases the cargo into the ciliary membrane, and the RCC1-like
  domain of RPGR can recruit cargo-loaded PDE6D near the transition zone. Outside cilia, PDE6D solubilizes
  farnesylated Ras-family proteins (KRAS, HRAS, RHEB, Rap1), and ARL2-mediated release on perinuclear
  membranes keeps them enriched at the plasma membrane and supports Ras signalling; small molecules that
  occupy the prenyl pocket displace KRAS. PDE6D was first described as a delta subunit that detaches PDE6
  from rod outer segment membranes. A homozygous PDE6D splice mutation causes Joubert syndrome, and Pde6d-null
  mice develop a slowly progressing rod/cone dystrophy.
