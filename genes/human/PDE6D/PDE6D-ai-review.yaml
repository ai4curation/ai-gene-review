core_functions:
- description: GDI-like prenyl-binding carrier. PDE6D binds farnesylated (and some geranylgeranylated)
    proteins in a hydrophobic pocket and moves them through the cytosol. Cargo is released when GTP-bound
    ARL2 or ARL3 binds and allosterically ejects the prenyl group.
  molecular_function:
    id: GO:0140104
    label: molecular carrier activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:22002721
    supporting_text: We demonstrate that the G proteins Arl2 and Arl3 act in a GTP-dependent manner as
      allosteric release factors for farnesylated cargo.
  - reference_id: PMID:11980706
    supporting_text: We suggest PDE delta to be a specific soluble transport factor for certain prenylated
      proteins and Arl2-GTP a regulator of PDE delta-mediated transport.
- description: Ciliary arm. PDE6D delivers farnesylated cargo (INPP5E; in photoreceptors GRK1 and PDE6
    catalytic subunits) to the cilium, where ARL13B-activated ARL3-GTP releases it into the ciliary membrane.
    This shapes ciliary membrane composition.
  molecular_function:
    id: GO:0001918
    label: farnesylated protein binding
  directly_involved_in:
  - id: GO:0061512
    label: protein localization to cilium
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:24166846
    supporting_text: depletion of PDE6D with two independent siRNAs led to a virtually complete loss of
      ciliary INPP5E, suggesting that PDE6D is indispensible for proper INPP5E ciliary targeting
  - reference_id: PMID:17496142
    supporting_text: Thus the absence of PrBP/delta in retina impairs transport of prenylated proteins,
      particularly GRK1 and cone PDE, to rod and cone outer segments
- description: Non-ciliary arm. PDE6D solubilizes farnesylated Ras-family GTPases (KRAS, HRAS, RHEB) and
    so sustains their spatial organization and plasma-membrane enrichment and supports oncogenic KRAS
    signalling. This arm is independent of cilia.
  molecular_function:
    id: GO:0001918
    label: farnesylated protein binding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:23698361
    supporting_text: Correct localization and signalling by farnesylated KRAS is regulated by the prenyl-binding
      protein PDEδ, which sustains the spatial organization of KRAS by facilitating its diffusion in the
      cytoplasm.
proposed_new_terms: []
suggested_questions:
- question: Should a process term for PDE6D-mediated maintenance of Ras plasma-membrane localization be
    annotated, or is the carrier activity alone the right representation? Other GDI-like carriers (RhoGDIs,
    UNC119) would be the comparators to check.
- question: Is RPGR binding (via its RCC1-like domain) a scaffold that recruits cargo-loaded PDE6D at
    the transition zone in non-photoreceptor cilia, or is it photoreceptor-specific?
suggested_experiments:
- hypothesis: The ciliary and Ras-trafficking roles of PDE6D can be separated by cargo-specific release
    factors (ARL3 versus ARL2).
  description: In PDE6D-knockout RPE1 cells, compare rescue of ciliary INPP5E and plasma-membrane KRAS
    localization by wild-type PDE6D and by mutants that selectively lose ARL3 or ARL2 binding.
  experiment_type: knockout rescue with separation-of-function mutants
