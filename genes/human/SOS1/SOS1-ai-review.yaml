core_functions:
- description: 'Ras guanine nucleotide exchange factor: the REM/CDC25 catalytic module inserts a helical hairpin into Ras,
    releasing GDP and allowing GTP loading at the plasma membrane, generating Ras-GTP that activates RAF-MEK-ERK and other
    effectors downstream of receptor tyrosine kinases and immunoreceptors.'
  molecular_function: *id012
  directly_involved_in:
  - *id028
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id003
  - *id027
  - *id002
- description: 'Adaptor-mediated recruitment: PXXP motifs in the C-terminal proline-rich region bind the SH3 domains of GRB2
    (and other SH3 adaptors such as NCK1/2, CRK and ABI1), coupling SOS1 to activated receptors and selecting between Ras-
    and Rac-directed complexes.'
  molecular_function: *id006
  directly_involved_in:
  - *id028
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - *id009
  - *id024
  - *id029
- description: 'Allosteric feedback activation: Ras (preferentially Ras-GTP) binds a distal allosteric site in the REM domain,
    relieving DH-PH/histone-domain autoinhibition and anchoring SOS1 to membrane Ras, which makes Ras activation self-reinforcing.'
  molecular_function: *id010
  directly_involved_in:
  - *id028
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - *id030
  - *id031
  - *id020
- description: 'Context-dependent Rac exchange factor: in a tricomplex with EPS8 and ABI1 (E3B1) the DH-PH unit catalyses
    nucleotide exchange on RAC1, coupling receptor signalling to Rac-driven actin remodelling.'
  molecular_function: *id012
  directly_involved_in:
  - id: GO:0035022
    label: positive regulation of Rac protein signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id005
  - *id029
  - reference_id: PMID:16520382
    supporting_text: p66shc, an adaptor protein that promotes oxidative stress, increases the rac1-specific GEF activity of
      sos1, resulting in rac1 activation
proposed_new_terms: []
suggested_questions:
- question: How much of SOS1-dependent RAC1 activation in vivo reflects direct DH-domain catalysis within the EPS8-ABI1 complex
    versus scaffolding or indirect Ras-PI3K-dependent Rac activation?
- question: Should the Ras:SOS1 catalytic intermediate be represented in GO-CAM as SOS1 GEF activity with Ras as has_input
    (and allosteric Ras-GTP as a positive regulator), rather than as a GTPase complex?
- question: Do Noonan syndrome SOS1 variants in the histone, PH and linker regions act solely by relieving autoinhibition,
    or do some also change Rac-GEF output or membrane residence time?
suggested_experiments:
- description: Reconstitute full-length SOS1 with EPS8 and ABI1 on supported lipid bilayers and measure RAC1 versus HRAS/KRAS
    exchange side by side, including DH-domain catalytic mutants, to quantify the Rac-GEF branch.
- description: Single-molecule imaging of wild-type and Noonan-variant SOS1 on membranes with controlled Ras-GTP and PIP2
    densities to relate allosteric-site occupancy to membrane dwell time and processive Ras activation.
