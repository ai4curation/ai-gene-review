- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: TAS
  original_reference_id: PMID:9790532
  qualifier: enables
  review:
    summary: Annotated as GTPase activator (GAP) activity, but SOS1 is a guanine-nucleotide exchange factor, not a GAP.
    action: MODIFY
    reason: 'GO:0005096 (GTPase activator activity) denotes stimulation of GTP hydrolysis (GAP function). SOS1 does the opposite regulatory chemistry: it accelerates GDP release/nucleotide exchange to activate RAS. This is a legacy ProtInc term-choice error; replace with guanyl-nucleotide exchange factor activity.'
    proposed_replacement_terms:
    - id: GO:0005085
      label: guanyl-nucleotide exchange factor activity
