    reason: SOS1 is a cytoplasmic RasGEF and performs no step of RNA Pol II transcription; any transcriptional effect is indirect via RAS-MAPK. The cited paper [PMID:23027131] concerns Wnt4/Ras control of cell motility, not SOS1 acting on transcription. Over-annotation of an indirect downstream effect.
