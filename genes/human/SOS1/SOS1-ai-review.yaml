core_functions:
- description: 'RAS guanyl-nucleotide exchange factor: catalyzes GDP release from H-/N-/K-RAS at the plasma membrane, activating RAS downstream of RTK/GRB2 in the RAS-ERK MAPK cascade.'
  supported_by:
  - reference_id: PMID:8493579
    supporting_text: This hSos1 domain specifically stimulated guanine nucleotide exchange on mammalian Ras proteins in vitro
  molecular_function:
