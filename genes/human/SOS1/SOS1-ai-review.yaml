id: Q07889
gene_symbol: SOS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Son of sevenless homolog 1 (SOS1) is a large cytosolic guanine nucleotide exchange factor that activates RAS
  (HRAS, KRAS, NRAS) downstream of receptor tyrosine kinases and immunoreceptors. It comprises an N-terminal tandem histone-fold
  region, a Dbl-homology (DH) and pleckstrin-homology (PH) unit, a catalytic module of Ras exchanger motif (REM) and CDC25-homology
  domains, and a C-terminal proline-rich tail. In resting cells SOS1 is autoinhibited: the histone and DH-PH domains occlude
  a distal allosteric Ras-binding site. On receptor activation the SH3 domains of the adaptor GRB2 bind PXXP motifs in the
  proline-rich tail and recruit SOS1 to phosphotyrosine sites at the plasma membrane, where PIP2 and Ras-GTP binding at the
  allosteric site relieve autoinhibition; the CDC25 domain then inserts a helical hairpin into Ras, displaces switch I and
  releases GDP so that GTP can load. Allosteric Ras-GTP binding makes SOS1 activation self-reinforcing, while ERK/RSK phosphorylation
  of the tail provides negative feedback. Through its DH-PH unit, SOS1 in a complex with EPS8 and ABI1 (E3B1) also acts as
  a context-dependent exchange factor for RAC1, coupling Ras and Rac signalling. SOS1 contributes to multivalent pLAT-GRB2-SOS1
  condensates in T cell receptor signalling. Heterozygous gain-of-function SOS1 variants, clustered in autoinhibitory interfaces,
  cause Noonan syndrome 4, and a C-terminal frameshift truncating the proline-rich region causes hereditary gingival fibromatosis
  1.'
