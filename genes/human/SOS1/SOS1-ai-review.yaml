- description: RAC-directed guanine-nucleotide exchange via the DH-PH module (acting in complexes such as EPS8-ABI1), promoting RAC1 activation and cytoskeletal/JNK signaling downstream of RAS (autonomous DH-domain Rho-GEF activity in isolation is context-dependent).
  supported_by:
  - reference_id: PMID:16475793
    supporting_text: by way of Grb2-Sos1-Rac1-PAK1-JNK ultimately results in the phosphorylation of c-jun on Ser(65)
