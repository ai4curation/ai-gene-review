id: P10721
gene_symbol: KIT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'KIT (CD117, SCFR, c-Kit) is a single-pass type I transmembrane class III receptor tyrosine kinase and the cell-surface receptor for stem cell factor (SCF, encoded by KITLG). Its extracellular region comprises five immunoglobulin-like domains (D1-D5) that bind SCF and mediate receptor-receptor contacts; a single transmembrane helix connects to a cytoplasmic juxtamembrane autoinhibitory segment and a split (kinase-insert-interrupted) tyrosine-protein kinase domain (EC 2.7.10.1). Binding of dimeric SCF brings two KIT molecules together and drives receptor homodimerization, relieving juxtamembrane autoinhibition and triggering reciprocal trans-autophosphorylation on cytoplasmic tyrosines. The resulting phosphotyrosines both increase catalytic activity and serve as docking sites that recruit SH2/PTB-domain effectors, activating the RAS-RAF-MEK-ERK (MAPK), PI3K-AKT, PLCgamma-PKC, SRC-family kinase and JAK-STAT pathways to promote cell survival, proliferation, adhesion, and migration. KIT acts principally at the plasma membrane. Signaling is terminated by protein tyrosine phosphatases (SHP-1/PTPN6, SHP-2/PTPN11) and by CBL-mediated ubiquitination followed by receptor internalization and degradation. KIT-SCF signaling is essential for hematopoietic stem/progenitor cells, mast cells, melanocytes, germ cells/gametogenesis, and gastrointestinal interstitial cells of Cajal. Loss-of-function variants cause piebaldism, whereas gain-of-function/constitutively activating mutations (e.g. D816V, juxtamembrane in-frame deletions/duplications) drive gastrointestinal stromal tumors, systemic mastocytosis, and subsets of acute myeloid leukemia and germ-cell tumors.'
