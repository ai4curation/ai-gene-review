- description: SCF-induced dimerization relieves juxtamembrane autoinhibition and triggers reciprocal trans-autophosphorylation of the split cytoplasmic tyrosine kinase domain (EC 2.7.10.1); the resulting phosphotyrosines increase catalytic activity and recruit SH2/PTB effectors, initiating MAPK, PI3K-AKT and JAK-STAT signaling.
