  - reference_id: PMID:17334805
    supporting_text: In this paper, we report on a gene in this region that shows reduced expression with
      increasing age, reduced expression in females across ages, and further reduction in LOAD patients.
  significance: The age- and LOAD-related expression change has no functional explanation; ASAH2B may
    act as an RNA or a non-catalytic fragment, or have no function.
  resolution: Test for endogenous ASAH2B protein by targeted mass spectrometry, and measure whether ASAH2B
    expression affects ASAH2 activity or ceramide levels.
suggested_questions:
- question: Is ASAH2B translated into a stable protein, and if so does its retained C-terminal calcium-binding
    segment interfere with ASAH2?
suggested_experiments:
- description: Detect endogenous ASAH2B peptides by targeted proteomics in human brain, and test ASAH2B
    co-expression effects on ASAH2 ceramidase activity.
