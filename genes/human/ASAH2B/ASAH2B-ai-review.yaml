  label: Homo sapiens
description: ASAH2B (ASAH2L) is a partial paralog of the neutral ceramidase ASAH2, arising from a segmental
  duplication on chromosome 10. Its 165-residue product corresponds only to the C-terminal region of ASAH2
  and lacks the catalytic nucleophile and zinc-binding residues, so it is predicted to be catalytically
  inactive. It is supported only at the transcript level. Its transcript is broadly expressed and decreases
  with age and further in late-onset Alzheimer disease. No function has been established.
