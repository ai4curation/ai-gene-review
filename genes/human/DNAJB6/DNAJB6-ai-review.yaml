id: O75190
gene_symbol: DNAJB6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAJB6 is a J-domain co-chaperone that suppresses aggregation of client proteins, regulates
  interactions with HSP70 and helps organize keratin intermediate filaments. Its products occupy nuclear
  and cytoplasmic pools, with DNAJB6 also detected at muscle Z discs. The serine/threonine-rich client-handling
  region supports antiaggregation, while the adjacent glycine/phenylalanine-rich region restrains access
  of the J-domain to HSP70. Disease-associated disruption of these functions or their regulation causes
  dominant DNAJB6-related myopathy.
alternative_products:
- name: A
  id: O75190-1
  description: Displayed 326-residue product A. Long nuclear DNAJB6 constructs can suppress nuclear-targeted
    polyglutamine aggregation; inactivity toward a cytoplasmic reporter is not general absence of antiaggregation.
    Historical lowercase a labels require construct-level mapping because current UniProt also lists a
    as a synonym of product C.
- name: B
  id: O75190-2
  sequence_note: VSP_001289, VSP_001290
  description: The 241-residue product B has an alternative short C terminus and corresponds to the commonly
    studied DNAJB6b class. Targeted studies demonstrate cytoplasmic and nuclear pools, polyglutamine antiaggregation
    and regulated J-domain interaction with HSP70. Engineered disease variants and domain deletions are
    distinct from this natural sequence.
- name: C (a)
  id: O75190-3
  sequence_note: VSP_026180
  description: The 325-residue product C, with official synonym a, differs from the displayed sequence
    by its documented alternative sequence event. Historical long-isoform a experiments are not assigned
    to this exact modern accession without a sequence-resolved construct match.
- name: D
  id: O75190-4
  sequence_note: VSP_053894
  description: The 277-residue product D replaces canonical residues 1–59 with a ten-residue alternative
    N terminus, removing most of the canonical J-domain and its HPD motif. Sequence structure alone establishes
    neither total inactivity nor equivalence to the other products; direct product-specific functional
    assays remain unresolved.
