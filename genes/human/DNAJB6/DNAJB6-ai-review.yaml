    reason: 'The current IBD at PTN002889875 and the target descendant path are verified. Its DNAJB8
      experimental grounding is retained, including the actual 23612975 antiaggregation assays. Current
      GO:0044183 explicitly describes binding a client to assist folding. Antiaggregation and proximity
