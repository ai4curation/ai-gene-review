  - statement: The nucleoplasmic ATP-hydrolysis event includes a DNAJB6 2–326 entity in its HSP40 co-chaperone
      set.
- id: Reactome:R-HSA-5251959
  title: HSP40s activate intrinsic ATPase activity of HSP70s in the cytosol
  findings:
  - statement: The cytosolic ATP-hydrolysis event includes a DNAJB6 2–326 entity in its HSP40 co-chaperone
      set.
- id: PMID:16260608
  title: The DnaJ-related factor Mrj interacts with nuclear factor of activated T cells c3 and mediates
    transcriptional repression through class II histone deacetylase recruitment.
  findings:
  - statement: Mrj interacts with NFATc3 and is recovered in an NFAT-associated TNF promoter complex in
      rat cardiomyocytes; the assays distinguish protein recruitment from an unresolved direct Mrj–DNA
      contact.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual original Methods/Results read from PMC1280278. Mouse Mrj adenovirus, human/mouse
      constructs and rat cardiomyocyte ChIP are distinguished. NFAT DNA-binding EMSA is not a purified
      Mrj DNA-binding assay.
- id: PMID:23612975
  title: The DNAJB6 and DNAJB8 protein chaperones prevent intracellular aggregation of polyglutamine peptides.
  findings:
  - statement: Human DNAJB6 and DNAJB8 suppress polyglutamine aggregation and show client-proximity and
      serine-rich-region dependence; these measurements do not themselves establish productive folding
      or destination-specific delivery.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual original Methods/Results read from PMC3682527. DNAJB8 donor grounding is real;
      target and donor antiaggregation/client-proximity assays are not automatically productive-folding
      measurements.
- id: PMID:28233300
  title: A novel DNAJB6 mutation causes dominantly inherited distal-onset myopathy and compromises DNAJB6
    function.
  findings:
  - statement: The DNAJB6 p.Pro96Leu myopathy variant has a dominant negative effect in the reported antiaggregation
      assays.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete genuine abstract inspected; publisher full original remained unavailable. Do
      not infer an ATPase assay is absent merely because the abstract foregrounds antiaggregation.
- id: PMID:37923706
  title: DNAJB6 mutants display toxic gain of function through unregulated interaction with Hsp70 chaperones.
  findings:
  - statement: An exposed DNAJB6 J-domain binds and activates HSP70, whereas WT JD-GF and full-length
      WT are autoinhibited in the tested assays. Tested disease variants release this regulation, while
      purified DNAJB6b retains intrinsic polyglutamine antiaggregation without added HSP70.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual original XML Results/captions/Methods/Discussion independently inspected. Recombinant
      b, 1–72 J-domain, 1–109 JD-GF and engineered variants are distinguished from natural products; native
      release of GF inhibition remains hypothetical.
suggested_questions:
- question: Which native clients or cofactors relieve GF-mediated J-domain autoinhibition, and when does
    WT DNAJB6 activate HSP70 in cells?
- question: Does DNAJB6 restore productive folding for any defined client, or deliver a maintained-unfolded
    client to a specific destination, beyond its demonstrated antiaggregation activity?
- question: Does Mrj directly contact promoter DNA in the NFATc3 complex, or is its ChIP enrichment mediated
    entirely by protein partners?
- question: Which exact products and biochemical fractions account for the reported sperm-nuclear and
    YTS membrane-proteome detections?
- question: What activities and localization distinguish the sequence-authenticated C and D products,
    and which modern accession corresponds to each historical long a construct?
suggested_experiments:
- hypothesis: Client engagement releases WT DNAJB6 J-domain autoinhibition under specific conditions.
  description: Compare sequence-authenticated full-length products with exposed-J-domain and HPD controls
    using client-dependent HSP70 binding, phosphate release and native-client activity measurements. Separate
    aggregation suppression from productive refolding and physical transfer to a destination.
  experiment_type: Purified-component mechanistic assays
- hypothesis: NFATc3 recruits Mrj to promoter chromatin without requiring direct Mrj–DNA recognition.
  description: Test purified Mrj, NFATc3 and defined promoter DNA separately and together, then compare
    promoter occupancy with protein-interface mutants while monitoring expression and localization.
  experiment_type: DNA-binding and recruitment reconstitution
