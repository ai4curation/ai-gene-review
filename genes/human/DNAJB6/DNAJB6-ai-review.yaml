core_functions:
- description: Suppresses aggregation and inclusion formation by aggregation-prone client proteins.
    The well-characterized DNAJB6b product can act independently of added HSP70 in purified antiaggregation
    assays; nuclear client suppression is also supported for the historical long a construct.
  directly_involved_in:
  - id: GO:0090084
    label: negative regulation of inclusion body assembly
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005654
    label: nucleoplasm
  - id: GO:0030018
    label: Z disc
  supported_by:
  - reference_id: PMID:20159555
  - reference_id: PMID:21231916
  - reference_id: PMID:22366786
  - reference_id: PMID:37923706
    supporting_text: DNAJB6 chaperones, in vitro, can operate in an Hsp70-independent manner
  - reference_id: PMID:28233300
  proposed_molecular_function: holdase chaperone activity
- description: Interacts with HSP70 through its J-domain as a regulated co-chaperone. The adjacent GF
    region masks the HSP70-binding surface in the tested WT protein. Exposed-domain and disease-mutant
    constructs can activate HSP70 ATPase, while native relief of this inhibition remains unresolved;
    that conditional activation is retained separately as non-core evidence.
  molecular_function:
    id: GO:0030544
    label: Hsp70 protein binding
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:10954706
  - reference_id: PMID:37923706
- description: Binds keratin intermediate filaments and contributes to organization of the K8/K18 network.
  molecular_function:
    id: GO:0019215
    label: intermediate filament binding
  directly_involved_in:
  - id: GO:0045109
    label: intermediate filament organization
  locations:
  - id: GO:0048471
    label: perinuclear region of cytoplasm
  supported_by:
  - reference_id: PMID:10954706
proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: Binding to an aggregation-prone protein to prevent its aggregation without itself
    catalyzing productive refolding. This activity does not require escorting the client to an acceptor
    molecule or destination.
  justification: DNAJB6 directly suppresses client aggregation, including in purified assays without
    added HSP70. Productive folding and client delivery are different mechanistic claims not established
    by those assays. The proposed term follows the existing unfolded-protein-binding project convention
    and does not assert a currently assigned GO identifier.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:21231916
  - reference_id: PMID:37923706

