products:
- id: O75190-1
  name: A
  length: 326
  sequence_sha256: 544d83a4568c1bd214032a65a1ea067210b1b0ee763a98689271a2688d5c87dd
  official_fasta: https://rest.uniprot.org/uniprotkb/O75190-1.fasta
  interpretation: Displayed 326-residue product A. Long nuclear DNAJB6 constructs can suppress nuclear-targeted
    polyglutamine aggregation; inactivity toward a cytoplasmic reporter is not general absence of antiaggregation.
    Historical lowercase a labels require construct-level mapping because current UniProt also lists
    a as a synonym of product C.
- id: O75190-2
  name: B
  length: 241
  sequence_sha256: 970bb2a057adf5a50b59bbab678bfa54c265204613c07c90333f9ff9cff518b3
  official_fasta: https://rest.uniprot.org/uniprotkb/O75190-2.fasta
  interpretation: The 241-residue product B has an alternative short C terminus and corresponds to the
    commonly studied DNAJB6b class. Targeted studies demonstrate cytoplasmic and nuclear pools, polyglutamine
    antiaggregation and regulated J-domain interaction with HSP70. Engineered disease variants and domain
    deletions are distinct from this natural sequence.
- id: O75190-3
  name: C
  length: 325
  sequence_sha256: 359fe292ce970fc8c8dd700b21f68c4e18c34519c53a821a602c5fd62195fc5f
  official_fasta: https://rest.uniprot.org/uniprotkb/O75190-3.fasta
  interpretation: The 325-residue product C, with official synonym a, differs from the displayed sequence
    by its documented alternative sequence event. Historical long-isoform a experiments are not assigned
    to this exact modern accession without a sequence-resolved construct match.
- id: O75190-4
  name: D
  length: 277
  sequence_sha256: 481dc492a2206a8a9da71f78d542f3a56edd28c522e179f8ded30eb0bbe116f2
  official_fasta: https://rest.uniprot.org/uniprotkb/O75190-4.fasta
  interpretation: The 277-residue product D replaces canonical residues 1–59 with a ten-residue alternative
    N terminus, removing most of the canonical J-domain and its HPD motif. Sequence structure alone
    establishes neither total inactivity nor equivalence to the other products; direct product-specific
    functional assays remain unresolved.
primary_sources:
- reference_id: PMID:10954706
  title: Identification of Mrj, a DnaJ/Hsp40 family protein, as a keratin 8/18 filament regulatory protein.
  source_url: https://pubmed.ncbi.nlm.nih.gov/10954706/
  read_locator: Complete abstract; curated KRT18/HSPA8 interaction records. Full original Methods unavailable.
  cached_full_text_available: false
  actual_access_and_limits: Complete genuine abstract and source-specific curated interaction records
    inspected; original full Methods remained unavailable after bounded publisher routes. No claim that
    absent abstract details refute an experimental annotation.
  biological_finding: Human Mrj binds K18 and Hsp/c70 through separable regions, colocalizes with K8/18
    filaments in HeLa cells, and its antibody perturbation disrupts that filament network.
- reference_id: PMID:11896048
  title: Characterization of a brain-enriched chaperone, MRJ, that inhibits Huntingtin aggregation and
    toxicity independently.
  source_url: https://pubmed.ncbi.nlm.nih.gov/11896048/
  read_locator: Complete abstract; full original unavailable. Do not assert missing assay from abstract
    silence.
  cached_full_text_available: false
  actual_access_and_limits: Complete genuine abstract inspected; full original unavailable. The source-specific
    nervous-system and productive-folding interpretations remain uncertain. The earlier claim that this
    paper lacks an ATPase assay is not supported by abstract-only access.
  biological_finding: MRJ is enriched in the central nervous system and suppresses polyglutamine-associated
    aggregation, caspase activity and toxicity in a cellular Huntington-disease model.
- reference_id: PMID:16919237
  title: Breast cancer metastasis suppressor 1 (BRMS1) is stabilized by the Hsp90 chaperone.
  source_url: https://pubmed.ncbi.nlm.nih.gov/16919237/
  read_locator: 'PMC1557677: Results BRMS1 interaction screen and MRJ co-IP; Methods yeast two-hybrid
    and immunoprecipitation.'
  cached_full_text_available: false
  actual_access_and_limits: Independent selected original Methods/Results read from PMC1557677. The
    MRJ fragment and historical sequence caveat are preserved; BRMS1-focused Hsp90 experiments are not
    transferred to DNAJB6.
  biological_finding: A BRMS1 interaction screen identifies MRJ, with controlled yeast two-hybrid and
    COS7 co-immunoprecipitation support for the association.
- reference_id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  source_url: https://pubmed.ncbi.nlm.nih.gov/19946888/
  read_locator: Complete abstract only. The YTS target table and full controls remain unavailable.
  cached_full_text_available: false
  actual_access_and_limits: Complete abstract inspected. Publisher full text and target-specific table
    were not recovered; an earlier saved HTML file was a challenge page, not an original. Membrane attachment
    is not excluded by absence of a transmembrane helix.
  biological_finding: YTS membrane enrichment detects a mixture of integral and associated proteins;
    the membrane proteome includes nonintegral species.
- reference_id: PMID:20159555
  title: A DNAJB chaperone subfamily with HDAC-dependent activities suppresses toxic protein aggregation.
  source_url: https://pure.rug.nl/ws/portalfiles/portal/156833194/A_DNAJB_Chaperone_Subfamily_with_HDAC_Dependent_Activities.pdf
  read_locator: Published PDF, Results on DNAJB6a/b compartment-dependent polyQ suppression and Figures
    1–2; selected J-domain, proteasome and HDAC analyses. Supplemental construct tables unavailable.
  cached_full_text_available: false
  actual_access_and_limits: Independent selected Results/Methods/captions read from the authentic Groningen-hosted
    published PDF. Detailed supplemental construct tables were not recovered. Broad TSA effects include
    DNAJB6b; selective HDAC4 and acetylation analyses largely concern DNAJB8.
  biological_finding: DNAJB6b suppresses polyglutamine aggregation, while the historical long a construct
    suppresses nuclear-targeted polyglutamine despite little effect on the cytoplasmic reporter. Some
    detailed HDAC and acetylation mechanisms in this paper concern DNAJB8.
- reference_id: PMID:20889486
  title: Molecular chaperone-mediated rescue of mitophagy by a Parkin RING1 domain mutant.
  source_url: https://pubmed.ncbi.nlm.nih.gov/20889486/
  read_locator: Results/Figure 3 mutant Parkin relocation; Discussion distinguishes DNAJB6 aggregation
    observation from HSJ1a clearance experiments; cell/transfection Methods.
  cached_full_text_available: true
  actual_access_and_limits: Selected original Results, Figure 3 context and Methods inspected in the
    genuine full cache. DNAJB6-specific relocation is separated from HSJ1a-specific clearance mechanisms
    and from aggregation data described as not shown.
  biological_finding: DNAJB6 expression partially improves relocation of aggregation-prone Parkin C289G
    to damaged mitochondria; stronger clearance and mitophagy experiments in the paper principally concern
    HSJ1a.
- reference_id: PMID:21231916
  title: The diverse members of the mammalian HSP70 machine show distinct chaperone-like activities.
  source_url: https://hal.science/hal-00576982/document
  read_locator: Accepted manuscript, target Results on PDF page 10; Figure 2C label on PDF page 23 and
    Figures 4–5. Actual target is DNAJB6b; purified sections use DNAJB1.
  cached_full_text_available: false
  actual_access_and_limits: Authentic HAL accepted-manuscript PDF recovered and read through OCR, with
    the relevant DNAJB6b Results and figure label visually confirmed independently. The repository cache
    remains abstract-only. Purified ATPase/refolding experiments in this paper use DNAJB1 rather than
    DNAJB6.
  biological_finding: DNAJB6b suppresses polyglutamine and heat-induced luciferase aggregation without
    improving luciferase refolding in the tested cellular assays.
- reference_id: PMID:21630459
  title: Proteomic characterization of the human sperm nucleus.
  source_url: https://pubmed.ncbi.nlm.nih.gov/21630459/
  read_locator: Complete abstract; human sperm nuclei purification. Exact DNAJB6 target table unavailable.
  cached_full_text_available: false
  actual_access_and_limits: Complete genuine abstract inspected; the target-specific sperm-proteome
    table remained unavailable. Retained source-specific broad nuclear detection with curator deference
    and independent gene-level localization.
  biological_finding: Proteomic analysis characterizes highly purified human sperm nuclei and provides
    the curated source for a DNAJB6 nuclear-detection annotation.
- reference_id: PMID:22366786
  title: Mutations affecting the cytoplasmic functions of the co-chaperone DNAJB6 cause limb-girdle
    muscular dystrophy.
  source_url: https://pubmed.ncbi.nlm.nih.gov/22366786/
  read_locator: Results human muscle localization/Figure1, cellular DNAJB6b co-IP and aggregation; Methods
    human constructs, COS1 co-IP, filter-trap assay and density gradients.
  cached_full_text_available: true
  actual_access_and_limits: Selected original human muscle localization, constructs, co-immunoprecipitation
    and cellular aggregation assays inspected. Human observations are distinguished from zebrafish rescue
    and rat-muscle proximity assays.
  biological_finding: DNAJB6-related myopathy variants alter cellular antiaggregation, DNAJB6 is detected
    at human muscle Z discs, and DNAJB6b associates with BAG3, HSPB8 and STUB1 in targeted assays.
- reference_id: PMID:23414517
