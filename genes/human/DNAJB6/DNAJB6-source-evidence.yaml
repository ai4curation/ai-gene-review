- reference_id: PMID:16260608
  title: The DnaJ-related factor Mrj interacts with nuclear factor of activated T cells c3 and mediates
    transcriptional repression through class II histone deacetylase recruitment.
  source_url: https://pubmed.ncbi.nlm.nih.gov/16260608/
  read_locator: 'PMC1280278: Methods constructs/GST, mouse Mrj adenovirus and ChIP; Results NFAT interaction,
    promoter association and NFAT DNA-binding EMSA.'
  cached_full_text_available: true
  actual_access_and_limits: Actual original Methods/Results read from PMC1280278. Mouse Mrj adenovirus,
    human/mouse constructs and rat cardiomyocyte ChIP are distinguished. NFAT DNA-binding EMSA is not
    a purified Mrj DNA-binding assay.
  biological_finding: Mrj interacts with NFATc3 and is recovered in an NFAT-associated TNF promoter
    complex in rat cardiomyocytes; the assays distinguish protein recruitment from an unresolved direct
    Mrj–DNA contact.
- reference_id: PMID:23612975
  title: The DNAJB6 and DNAJB8 protein chaperones prevent intracellular aggregation of polyglutamine
    peptides.
  source_url: https://pubmed.ncbi.nlm.nih.gov/23612975/
  read_locator: 'PMC3682527: Results polyQ aggregation and FRET-FLIM; Methods constructs, cell cultures,
    aggregation and microscopy; Discussion explicitly leaves client destination unresolved.'
  cached_full_text_available: false
  actual_access_and_limits: Actual original Methods/Results read from PMC3682527. DNAJB8 donor grounding
    is real; target and donor antiaggregation/client-proximity assays are not automatically productive-folding
    measurements.
  biological_finding: Human DNAJB6 and DNAJB8 suppress polyglutamine aggregation and show client-proximity
    and serine-rich-region dependence; these measurements do not themselves establish productive folding
    or destination-specific delivery.
- reference_id: PMID:28233300
  title: A novel DNAJB6 mutation causes dominantly inherited distal-onset myopathy and compromises DNAJB6
    function.
  source_url: https://pubmed.ncbi.nlm.nih.gov/28233300/
  read_locator: Complete abstract only; myopathy variant and antiaggregation assays. Full publisher
    original unavailable.
  cached_full_text_available: false
  actual_access_and_limits: Complete genuine abstract inspected; publisher full original remained unavailable.
    Do not infer an ATPase assay is absent merely because the abstract foregrounds antiaggregation.
  biological_finding: The DNAJB6 p.Pro96Leu myopathy variant has a dominant negative effect in the reported
    antiaggregation assays.
- reference_id: PMID:37923706
  title: DNAJB6 mutants display toxic gain of function through unregulated interaction with Hsp70 chaperones.
  source_url: https://pubmed.ncbi.nlm.nih.gov/37923706/
  read_locator: 'PMC10624832: Results/Figures 2, 4, 6; constructs, purification, phosphate-release and
    fluorescence-anisotropy Methods; Discussion of unresolved WT release mechanism.'
  cached_full_text_available: true
  actual_access_and_limits: Actual original XML Results/captions/Methods/Discussion independently inspected.
    Recombinant b, 1–72 J-domain, 1–109 JD-GF and engineered variants are distinguished from natural
    products; native release of GF inhibition remains hypothetical.
  biological_finding: An exposed DNAJB6 J-domain binds and activates HSP70, whereas WT JD-GF and full-length
    WT are autoinhibited in the tested assays. Tested disease variants release this regulation, while
    purified DNAJB6b retains intrinsic polyglutamine antiaggregation without added HSP70.
