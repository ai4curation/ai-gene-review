gene_symbol: NAGA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NAGA encodes lysosomal alpha-N-acetylgalactosaminidase (alpha-NAGAL, EC 3.2.1.49), a soluble
  homodimeric glycoside hydrolase family 27 exoglycosidase that removes terminal alpha-linked N-acetylgalactosamine
  residues from glycopeptides (including mucin-type O-glycans and blood group A determinants) and glycolipids
  such as blood group A glycolipids in the lysosomal lumen. It is a paralog of alpha-galactosidase A (GLA)
  and retains only a weak side activity toward alpha-galactosides. Biallelic loss of NAGA causes NAGA
  deficiency (Schindler disease type I, Kanzaki disease and the intermediate type III), with lysosomal
  storage and urinary excretion of alpha-GalNAc-terminated glycopeptides and oligosaccharides.
