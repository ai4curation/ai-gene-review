suggested_questions:
- question: Which glycoconjugates are the quantitatively dominant in vivo substrates of NAGA in neurons
    versus skin endothelium, and does this explain the divergent Schindler type I and Kanzaki phenotypes?
  experts:
  - lysosomal glycobiology experts
suggested_experiments:
- description: Glycomic profiling of lysosome-enriched fractions from NAGA-null human iPSC-derived neurons
    and endothelial cells.
  experiment_type: glycomics
  hypothesis: Different cell types accumulate different alpha-GalNAc-terminated glycoconjugates, accounting
    for tissue-specific disease.
