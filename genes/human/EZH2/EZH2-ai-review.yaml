id: Q15910
gene_symbol: EZH2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EZH2 is the catalytic lysine methyltransferase of Polycomb repressive complex 2 (PRC2). Its
  SET domain transfers methyl groups from S-adenosylmethionine to histone H3 lysine 27, producing mono-,
  di- and trimethylated states in a reaction supported by EED, SUZ12 and other complex components. On
  chromatin, EZH2 contacts nucleosomal DNA and the H3 tail, while partner proteins supply additional recognition
  and targeting functions. EED recognizes methylated ligands and allosterically stimulates the EZH2 catalytic
  site. This system contributes to facultative heterochromatin and repression of transcription, helping
  maintain regulated gene-expression programs. EZH2-containing complexes also methylate substrates including
  histone H1.4 and JARID2 in defined biochemical settings. EZH2 directly binds RNA, providing a further
  interface between PRC2 and regulatory transcripts; the consequences of this interaction depend on the
  RNA and complex context. Alternative EZH2 products are described, but equivalent catalytic, RNA-binding
  and regulatory properties have not been established for all of them.
