  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier/title checked against captured original/registry and the genuine normal record.
      Chaer RNA interaction and mouse/rat cells; EMSA uses mouse Ezh2 insert in a human in-vitro translation
      system, not a human protein. Human iPSC-CM RIP is separately reported in main; supplement12 not
      independently viewed. H19 targeting and H3K27 effects are cellular context, not intrinsic sequence
      recognition.
core_functions:
- description: Catalyzes successive methyl transfer to histone H3 lysine 27 within PRC2, including formation
    of H3K27me3. EZH2 supplies the catalytic SET site and contacts the nucleosomal DNA and H3 tail; EED
    and SUZ12 support the active complex, and accessory subunits influence substrate engagement and stimulation.
    This catalytic contribution promotes facultative heterochromatin and repression of RNA polymerase
    II transcription. It does not assign the methyl-lysine reader activity of EED or the targeting functions
