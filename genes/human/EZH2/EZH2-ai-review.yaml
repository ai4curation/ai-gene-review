suggested_experiments:
- description: Compare sequence-verified human EZH2 products in matched PRC2 reconstitutions, confirming
    complex integrity and measuring methyl transfer separately on H3K27me0, me1 and me2 substrates. Test
    RNA binding and methyltransferase output with defined RNAs in parallel, then assess selected RNA-contact
    mutants in human-cell rescue experiments while controlling protein abundance, complex assembly and
    catalytic-site integrity.
