references:
- id: file:human/COL1A2/COL1A2-deep-research-falcon.md
  title: Falcon deep research report for human COL1A2
  findings:
  - statement: Falcon deep research (completed after the review was drafted) agrees that COL1A2 supplies the alpha2(I)
      chain of the [alpha1(I)]2alpha2(I) type I collagen heterotrimer, assembled in the ER via the C-propeptide and acting
      extracellularly as a load-bearing fibrillar matrix component; it treats TGF-beta/SMAD and Rho programs as upstream
      regulators of COL1A2 expression and propeptide-processing enzymes as acting on, not by, COL1A2. No contradictions
      with the review were found.
    supporting_text: Its principal function is therefore as an integral component of mature type I collagen fibrils
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Reconciled after the fact. Consistent with UniProt and cached primary literature already in the review;
      no new claim required a change of action. Several cited sources are reviews or a preprint (Mariano 2023 bioRxiv)
      and were not added as separate references.
