suggested_questions:
- question: How does the alpha2 chain alter fibril packing, cross-link distribution and tensile behavior
    relative to alpha1 homotrimers in mineralized bone versus unmineralized tendon?
- question: Which precursor processing states, if any, mediate the COL1A2 associations with cytosolic
    proteostasis proteins during secretion stress?
- question: Is COL1A2 in trabecular-meshwork extracellular-vesicle fractions surface associated,
    lumenal or carried by co-isolated matrix assemblies, and does this distribution affect matrix
    turnover?
suggested_experiments:
- hypothesis: At matched collagen amount and processing, incorporation of alpha2 changes fibril architecture
    and mechanical response relative to alpha1 homotrimers.
  description: Compare purified human type I heterotrimers and alpha1 homotrimers with matched propeptide
    removal and cross-linking conditions. Quantify fibril diameter and packing by microscopy, tensile
    response by single-fibril mechanics, and protease susceptibility; measure assembly yield separately
    from the properties of assembled fibrils.
  experiment_type: Controlled collagen assembly and mechanical characterization
- hypothesis: Some screen associations depend on an intracellular precursor state exposed during
    secretion stress rather than persisting on extracellular mature collagen.
  description: Use endogenous tagging, pulse-chase labeling and compartment-resolved crosslinking
    in collagen-producing cells before and after a reversible secretion perturbation. Resolve signal/propeptide
    processing and compare SGTA association with ER entry, secretion and degradation, including tag-only
    and unrelated secretory-protein controls.
  experiment_type: Precursor-resolved interaction and trafficking analysis
- hypothesis: The positive COL1A2 vesicle-fraction signal includes a separable surface-associated
    pool whose distribution differs from protected lumenal cargo.
  description: Combine density flotation and particle markers with COL1A2 protease protection in
    the presence or absence of detergent, immunogold localization and matrix-only controls in human
    trabecular-meshwork conditioned medium. Test fraction association independently of any effect
    on vesicle biogenesis.
  experiment_type: Extracellular-vesicle topology and fractionation
