id: P08123
gene_symbol: COL1A2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL1A2 encodes the proalpha2(I) collagen chain, a secreted precursor that associates
  with two proalpha1(I) chains to form the usual type I procollagen heterotrimer. Its C-terminal
  propeptide contributes to chain recognition and assembly in the endoplasmic reticulum. After secretion
  and propeptide removal, alpha2-containing collagen molecules assemble into extracellular fibrils
  that provide tensile support to bone, tendon, skin and other connective tissues. Mutations that
  disrupt chain folding, processing or assembly can cause osteogenesis imperfecta or Ehlers–Danlos
  phenotypes.
