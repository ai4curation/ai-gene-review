    summary: 'Orthology transfer from mouse Col1a2 SMAD binding (IPI, PMID:14559231: Y2H and GST pull-down of in
      vitro translated collagens with Smad MH2 domains).'
    action: REMOVE
    reason: The source interaction was detected only with in vitro translated collagen and yeast two-hybrid. COL1A2
      is synthesized into the ER lumen and secreted, whereas SMADs are cytosolic/nuclear signal transducers, so
      the two are topologically separated in vivo. No physiological SMAD binding by the alpha2(I) chain is supported;
      the relationship between COL1A2 and SMADs is that SMAD3/4 activate COL1A2 transcription.
