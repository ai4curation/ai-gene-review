  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic complete abstract describes a fetal-murine-library screen and translated
      collagen/GST-SMAD MH2 assays. Exact mouse alpha2 attribution is supported by current MGI IPI
      donor records, not an independently inspected full-paper construct. Publisher/full-text recovery
