    label: skeletal system development
  evidence_type: IMP
  original_reference_id: PMID:18375391
  qualifier: involved_in
  review:
    summary: Dominant mutations in the proalpha2(I) C-propeptide impair heterotrimer assembly and cause OI type
      IV.
    action: KEEP_AS_NON_CORE
    reason: Disease mutations demonstrate that normal COL1A2 is needed for skeletal integrity. The primary defect
      is in procollagen assembly; skeletal development is a downstream tissue-level role and is kept as non-core.
    supported_by:
