- id: file:human/COL1A2/COL1A2-uniprot.txt
  title: UniProt entry P08123 (CO1A2_HUMAN)
core_functions:
- description: 'Structural constituent of fibrillar extracellular matrix: as the single alpha2 chain of the [alpha1(I)]2alpha2(I)
    type I collagen heterotrimer, COL1A2 is incorporated into cross-linked collagen fibrils that confer tensile
    strength on bone, tendon, ligament, skin and vessel walls. Its C-propeptide is required for efficient heterotrimer
    assembly in the ER.'
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  directly_involved_in:
  - id: GO:0030199
    label: collagen fibril organization
  locations:
  - id: GO:0031012
    label: extracellular matrix
  - id: GO:0098643
    label: fibrillar collagen complex
  in_complex:
    id: GO:0005584
    label: collagen type I trimer
  supported_by:
  - reference_id: file:human/COL1A2/COL1A2-uniprot.txt
    supporting_text: Trimers of one alpha 2(I) and two alpha 1(I) chains
  - reference_id: file:human/COL1A2/COL1A2-uniprot.txt
    supporting_text: Forms the fibrils of tendon, ligaments and bones.
  - reference_id: PMID:18375391
    supporting_text: These findings show that the C-propeptide of proalpha2(I), like that of the proalpha1(I) C-propeptide,
      is essential for efficient assembly of type I procollagen heterotrimers.
  - reference_id: PMID:1916105
    supporting_text: Most notable are 1) fibrils that are found in most connective tissues and are made by alloys
      of fibrillar collagens (types I, II, III, V, and XI)
suggested_questions:
- question: Does the alpha2(I) chain make a distinct mechanical or biological contribution to fibrils beyond being
    an assembly partner, given that alpha1(I) homotrimers (as in COL1A2-null EDS and oim mice) are secreted and
    form fibrils but are mechanically inferior and resist MMP cleavage?
- question: Should GO capture the binding of collagen receptors (DDR1/DDR2, integrin alpha11beta1, GPVI, LAIR1,
    OSCAR) to type I collagen fibrils on COL1A2 via a term such as collagen-receptor ligand activity, or should
    these remain on the receptors only, given that most receptor-binding motifs map to the alpha1(I) chain?
- question: Is the reported binding of Smads to collagen chains (mouse, Y2H/GST pull-down) physiologically meaningful
    for any cytosolic pool of procollagen, or is it purely an in vitro artefact as topology suggests?
- question: Should the MMP12/collagenase relationship be represented as has_input type I collagen on the proteases
    rather than as protease binding on COL1A2?
suggested_experiments:
- description: Compare tensile mechanics, cross-link profiles and MMP susceptibility of fibrils assembled from wild-type
    [alpha1(I)]2alpha2(I) heterotrimers versus alpha1(I) homotrimers produced by CRISPR COL1A2-null human fibroblasts
    or osteoblasts.
  hypothesis: The alpha2(I) chain contributes specific fibril mechanical properties and protease sensitivity independent
    of its role in trimer assembly.
- description: Systematically map the C-propeptide chain-recognition residues of proalpha2(I) by mutagenesis combined
    with heterotrimer assembly and ER retention assays (pulse-chase, TMEM131 co-IP).
  hypothesis: Specific C-propeptide residues determine chain selection and ER export competence of proalpha2(I),
    explaining the OI type IV phenotypes of C-propeptide variants.
