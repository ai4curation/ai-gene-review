id: P08123
gene_symbol: COL1A2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL1A2 encodes the pro-alpha2(I) chain of type I collagen, the most abundant protein in the human body.
  The precursor carries a signal peptide, an N-propeptide, a central uninterrupted Gly-X-Y triple-helical domain
  and a C-terminal propeptide (COLFI domain). In the endoplasmic reticulum one pro-alpha2(I) chain associates through
  its C-propeptide with two pro-alpha1(I) chains (COL1A1) to form the [alpha1(I)]2alpha2(I) heterotrimer, which
  folds into a triple helix after extensive prolyl and lysyl hydroxylation. After secretion and removal of the propeptides,
  type I collagen molecules self-assemble into cross-linked, banded fibrils, often co-assembled with other fibrillar
  collagens, that give tensile strength to bone (where they are mineralized with hydroxyapatite), tendon, ligament,
  skin, dentin, cornea and blood vessel walls. The fibrils also act as a substrate for collagen receptors, matricellular
  proteins, proteoglycans and collagenolytic MMPs, and can sequester growth factors such as PDGF. Dominant COL1A2
  variants cause osteogenesis imperfecta and arthrochalasia-type Ehlers-Danlos syndrome, and biallelic null alleles
  cause cardiac-valvular Ehlers-Danlos syndrome.
