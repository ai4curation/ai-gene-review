core_functions:
- description: As the alpha2 chain of the usual two-alpha1/one-alpha2 type I collagen heterotrimer,
    COL1A2 contributes the molecular structure that assembles into tensile extracellular fibrils.
    Its C-propeptide performs intrinsic chain-association work during precursor assembly; subsequent
    collagen-processing proteases perform the cleavages.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  directly_involved_in:
  - id: GO:0030199
    label: collagen fibril organization
  locations:
