- term:
    id: GO:0007179
    label: transforming growth factor beta receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:17217948
  qualifier: involved_in
  review:
    summary: TGF-beta2 induces COL1A2 mRNA and promoter activity in ARPE-19 retinal pigment epithelial cells.
    action: REMOVE
    reason: The study uses COL1A2 expression/promoter activity as the transcriptional readout of TGF-beta signaling.
      COL1A2 is a target gene of the pathway; the COL1A2 protein (a secreted structural collagen) performs no step
      in TGF-beta receptor signaling. Being the output of a pathway is not participation in it.
    supported_by:
    - reference_id: PMID:17217948
      supporting_text: To examine the effects of simvastatin or Y27632 on COL1A2 promoter activity induced by TGF-beta2,
        luciferase reporter assays were also performed.
    - reference_id: file:human/COL1A2/COL1A2-deep-research-falcon.md
      supporting_text: TGF-β/SMAD programs stimulate production of type I collagen during myofibroblast activation
        and repair.
- term:
    id: GO:0007266
    label: Rho protein signal transduction
  evidence_type: IDA
  original_reference_id: PMID:17217948
  qualifier: involved_in
  review:
    summary: RhoA/Rho-kinase activity is required for TGF-beta2-induced COL1A2 promoter activity in ARPE-19 cells.
    action: REMOVE
    reason: COL1A2 promoter-reporter activity is the downstream readout of RhoA signaling in this study; the secreted
      COL1A2 protein is not a component of the Rho signal transduction machinery. Target-gene expression does not
      constitute involvement in the signaling process.
    supported_by:
    - reference_id: PMID:17217948
      supporting_text: Constitutively active RhoA increased COL1A2 promoter activity in the presence or absence
        of TGF-beta2.
- term:
    id: GO:0008217
    label: regulation of blood pressure
  evidence_type: IMP
  original_reference_id: PMID:17334644
  qualifier: involved_in
  review:
    summary: Candidate-gene association of a COL1A2 (GT)n polymorphism with systolic and diastolic blood pressure
      in Japanese men.
    action: MARK_AS_OVER_ANNOTATED
    reason: The evidence is a population association of a non-coding repeat polymorphism; it does not show that
      the COL1A2 product acts in blood pressure regulation, and the authors conclude that QPCT and CYP11B2, not
      COL1A2, are determinants of BP. At most an indirect effect via vessel-wall mechanics.
    supported_by:
    - reference_id: PMID:17334644
      supporting_text: These results suggest that polymorphisms of QPCT and CYP11B2 are determinants of BP and the
        development of hypertension in Japanese men.
