  review:
    summary: The positive full-length SGTA interaction supports protein-folding chaperone binding.
    action: MODIFY
    reason: 'The positive screen pair is preserved at its source-specific assay scope: the literal
      records match the 313-aa SGTA O43765 and 1366-aa COL1A2 sequences, with no reported truncation.
      Independently, original PMID28104892 shows SGTA capturing hydrophobic tail-anchored clients
      and transferring them through targeting or quality-control modules. Current GO:0051087 covers
      binding to a chaperone that ensures folding or transport, so this evidence supports the partner-class
      refinement. SGTA does not insert or ubiquitinate the client by itself. The study did not test
      COL1A2 as a false-positive control, and its triage mechanism does not negate the separately
      recorded positive pair. Native processing, endogenous colocalization and a collagen-client
      pathway remain unestablished; none is being added as a process or core function. See the public
      source index followup2_4928 for exact assay records, sequence hashes, current definition and
      original assay locators.'
    supported_by:
