id: Q6ZMQ8
gene_symbol: AATK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AATK encodes the human LMTK1 member of the lemur-tail-kinase family, a
  single-pass membrane-associated protein kinase with a cytoplasm-facing
  catalytic domain and a long disordered C-terminal tail. Human AATK is active
  as a kinase in SH-SY5Y neuroblastoma cells, localizes to the cytoplasm with a
  predominantly perinuclear pool, promotes neuronal differentiation in that
  model, and is connected to the neuronal CDK5 pathway through a CDK5/p35
  interaction and phosphorylation.
