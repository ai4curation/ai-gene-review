- id: PMID:22573681
  title: LMTK1/AATYK1 is a novel regulator of axonal outgrowth that acts via Rab11 in
    a Cdk5-dependent manner.
  findings:
  - statement: >-
      Mouse LMTK1/AATYK1 is a Cdk5- and Rab11-dependent negative regulator of
      axonal outgrowth in cortical neurons.
    supporting_text: >-
      LMTK1 can negatively control axonal outgrowth by regulating Rab11A
      activity in a Cdk5-dependent manner
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Strong mouse ortholog evidence for the neuronal trafficking/development
      role behind the PAINT brain-development row. It was not converted into a
      new human axon-development annotation.
