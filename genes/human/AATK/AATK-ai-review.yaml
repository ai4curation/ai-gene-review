- id: PMID:10837911
  title: A novel kinase, AATYK induces and promotes neuronal differentiation in a human
    neuroblastoma (SH-SY5Y) cell line.
  findings:
  - statement: >-
      Human AATK expressed in SH-SY5Y cells was an active kinase, localized in
      the cytoplasm, and promoted neuronal differentiation and neurite elongation
      after longer expression.
    supporting_text: >-
      overexpression for longer periods (7-8 days) per se, significantly
      (P<0.05-0.001) increased the percent of differentiated cells as well as
      the neurite length
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The cached abstract supplies the only direct human AATK functional
      evidence used here. It supports kinase activity, cytoplasm/perinuclear
      localization and neuronal differentiation, but not residue specificity.
- id: PMID:11314040
  title: Characterization of the apoptosis-associated tyrosine kinase (AATYK) expressed
    in the CNS.
  findings:
  - statement: >-
      Mouse Aatk showed tyrosine autophosphorylation and contributed to apoptosis
      of mature cerebellar granule neurons.
    supporting_text: >-
      through its tyrosine kinase activity, AATYK is involved in the apoptosis
      of mature neurons
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The abstract supports the mouse PAINT seed for neuron apoptotic process
      and explains the old tyrosine-kinase assignment, but it is mouse evidence,
      not a direct human AATK assay.
- id: PMID:14521924
  title: Apoptosis-associated tyrosine kinase is a Cdk5 activator p35 binding protein.
  findings:
  - statement: >-
      Human AATYK isoforms bind the neuronal Cdk5/p35 complex and are
      phosphorylated by Cdk5/p35 in HEK293 cells.
    supporting_text: >-
      Both hAATYKs and KIAA0641 bound to and were phosphorylated by Cdk5/p35.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Useful evidence that AATK is connected to the CDK5 neuronal kinase
      pathway; the paper assays AATK as a CDK5 substrate, not as the active
      kinase in the row-level GOA annotations.
