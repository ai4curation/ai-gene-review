  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1197518
  - PANTHER:PTN002815112
  review:
    summary: >-
      PAINT transfers a historical mouse Aatk tyrosine-kinase assertion to the
      AATK/LMTK1 subfamily, but current LMTK nomenclature and the human UniProt
      entry favor serine/threonine kinase activity.
    action: UNDECIDED
    reason: >-
      The mouse PAINT seed is a close ortholog and the older mouse CNS paper
      reported AATYK tyrosine autophosphorylation, so this is not a clear
      wrong-branch propagation. However, the human UniProt record now assigns
      only EC 2.7.11.1 serine/threonine protein kinase chemistry, and the two
      human paralogs with direct enzymology, LMTK2 and LMTK3, are
      serine/threonine kinases. Leave human AATK tyrosine kinase activity
      unresolved rather than accepting it as core or requesting a PAINT prune.
    additional_reference_ids:
