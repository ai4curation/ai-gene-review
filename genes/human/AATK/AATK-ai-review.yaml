  id: Q6ZMQ8-1
- name: 2 (hAATYKs-p35BP)
  id: Q6ZMQ8-2
  sequence_note: VSP_020225, VSP_020226, VSP_020227, VSP_020228
- name: '3'
  id: Q6ZMQ8-3
  sequence_note: VSP_020226, VSP_020227, VSP_020228
