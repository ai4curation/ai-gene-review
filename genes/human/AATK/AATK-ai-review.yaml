core_functions:
- description: >-
    ATP-dependent protein serine/threonine kinase activity. Human AATK is
    curated with EC 2.7.11.1 protein-serine and protein-threonine phosphorylation
    reactions, its catalytic kinase domain conserves the ATP-binding site, and
    the characterized LMTK paralogs are serine/threonine kinases rather than
    canonical tyrosine kinases.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  supported_by:
  - reference_id: file:genes/human/AATK/AATK-uniprot.txt
    record_section:
    - CC:CATALYTIC ACTIVITY
    supporting_text: >-
      Reaction=L-seryl-[protein] + ATP = O-phospho-L-seryl-[protein] + ADP +
      H(+)
  - reference_id: file:genes/human/AATK/AATK-uniprot.txt
    record_section:
    - CC:CATALYTIC ACTIVITY
    supporting_text: >-
      Reaction=L-threonyl-[protein] + ATP = O-phospho-L-threonyl-[protein] +
      ADP + H(+)
- description: >-
    Promotion of neuronal differentiation in the SH-SY5Y human neuroblastoma
    model. AATK overexpression increases the fraction of differentiated cells
    and neurite length, consistent with the conserved neuronal LMTK1
    developmental role seen in mouse.
  directly_involved_in:
