      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: >-
        Reaction=L-seryl-[protein] + ATP = O-phospho-L-seryl-[protein] + ADP +
        H(+)
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
