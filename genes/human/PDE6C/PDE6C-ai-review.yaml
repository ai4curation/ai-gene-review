- term:
    id: GO:0070966
    label: nuclear-transcribed mRNA catabolic process, no-go decay
  evidence_type: IDA
  original_reference_id: PMID:21127010
  qualifier: involved_in
  review:
    summary: No-go mRNA decay; nothing in the cited study supports PDE6C taking part in mRNA decay.
    action: REMOVE
    reason: 'PDE6C is a cGMP phosphodiesterase. The cited study characterises ACHM mutations: nonsense and splice
      alleles (splicing tested with minigene assays) and the catalytic activity and Pgamma inhibition of recombinant
      missense mutants. Even if the full text, which is not cached, reports decay of a mutant PDE6C transcript,
      that would make the PDE6C mRNA the substrate of the decay machinery, not the PDE6C protein a participant in
      no-go decay, a process triggered by translation stalls. The term is wrong for this gene product.'
    supported_by:
    - reference_id: PMID:21127010
      supporting_text: Eleven different PDE6C mutations were found including two nonsense mutations, three mutations
        affecting transcript splicing as shown by minigene assays, one 1 bp-insertion and five missense mutations.
