id: P51160
gene_symbol: PDE6C
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PDE6C encodes the catalytic alpha' subunit of the cone photoreceptor cGMP phosphodiesterase (PDE6).
  Unlike the rod enzyme, cone PDE6 is a homodimer of PDE6C, each subunit associated with one inhibitory cone gamma
  subunit (PDE6H). Each PDE6C subunit has two N-terminal GAF domains, the first binding cGMP at a noncatalytic site
  that stabilises the regulatory domains and strengthens gamma-subunit binding, and a C-terminal Zn2+/Mg2+ phosphodiesterase
  domain that hydrolyses 3',5'-cyclic GMP to GMP. The protein is prenylated and anchored to the cone outer segment
  disc membranes; its folding requires the chaperone AIPL1, assisted by the gamma subunit. Light-activated cone
  transducin (GNAT2-GTP) relieves gamma-subunit inhibition, and the fall in cGMP closes the cone cGMP-gated channels.
  Biallelic loss-of-function variants cause achromatopsia and early-onset cone dystrophy.
