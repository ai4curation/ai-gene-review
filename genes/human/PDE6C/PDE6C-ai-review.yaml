proposed_new_terms:
- proposed_name: cone photoreceptor phosphodiesterase 6 complex
  proposed_definition: A heterotetrameric cGMP phosphodiesterase complex found in the disc membranes of cone photoreceptor
    outer segments, consisting of a homodimer of the catalytic subunit PDE6C and two inhibitory cone gamma subunits
    PDE6H; it hydrolyses cGMP in response to activation by cone transducin.
  justification: GO has GO:7770030 rod photoreceptor phosphodiesterase 6 complex but no cone counterpart, although
    the human cone holoenzyme has been purified and its structure determined.
suggested_questions:
- question: Does noncatalytic cGMP dissociate from the PDE6C GAF-A sites in living cones during bright light, and
    does that change Pgamma inhibition?
status: COMPLETE
