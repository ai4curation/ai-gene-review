- term:
    id: GO:0030553
    label: cGMP binding
  evidence_type: IDA
  original_reference_id: PMID:39739818
  review:
    summary: Noncatalytic cGMP binding by the GAF-A domain of human PDE6C.
    action: NEW
    reason: Cryo-EM of purified human holoPDE6C with and without noncatalytic cGMP shows cGMP bound in the GAF-A
      domains and disorganisation of GAF-A when it is absent; noncatalytic cGMP raises the affinity of PDE6C for
      Pgamma. This is direct evidence on the human protein. It is a regulatory binding function, non-core relative
      to catalysis; the same term is proposed (by ISS) for PDE6A and PDE6B.
    supported_by:
    - reference_id: PMID:39739818
      supporting_text: Notably, the GAF-A domains in PDE5 and PDE6 harbor noncatalytic cGMP-binding sites (8, 9).
    - reference_id: PMID:39739818
      supporting_text: Thus, disorder of a single empty-pocket GAF-A domain either leads to destabilization of a
        partner cGMP-occupied GAF-A domain or facilitates dissociation of cGMP from the second GAF-A site.
