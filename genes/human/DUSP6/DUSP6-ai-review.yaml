id: Q16828
gene_symbol: DUSP6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DUSP6 (MKP-3, PYST1) is a cytoplasmic dual-specificity protein phosphatase of the MAP kinase phosphatase (MKP) family that selectively inactivates the extracellular signal-regulated kinases ERK1 and ERK2. An N-terminal rhodanese-like domain carrying a kinase-interaction motif docks ERK2, which both confers substrate specificity and allosterically activates the C-terminal catalytic domain (catalytic Cys293), allowing DUSP6 to remove the phosphates from the threonine and tyrosine of the ERK activation-loop TEY motif. DUSP6 has little activity toward JNK or p38. A CRM1-dependent nuclear export signal keeps DUSP6 predominantly cytoplasmic, and through ERK docking it also retains ERK in the cytoplasm. DUSP6 transcription is induced by FGF receptor/ERK signalling through Ets factors, while ERK phosphorylation of DUSP6 promotes its proteasomal turnover, so DUSP6 acts as an ERK-dependent negative-feedback regulator that sets the amplitude and duration of growth-factor-driven ERK signalling. Loss of mouse Dusp6 raises ERK activity and causes FGFR gain-of-function-like phenotypes (dwarfism, craniosynostosis, hearing loss), and human DUSP6 variants are associated with congenital hypogonadotropic hypogonadism.
