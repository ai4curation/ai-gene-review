    label: nucleoplasm
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-203797
  qualifier: located_in
  review:
    summary: 'Reactome TAS: nucleoplasm, from a reaction grouping several ERK-directed DUSPs (R-HSA-203797).'
    action: MARK_AS_OVER_ANNOTATED
    reason: DUSP6 can transit the nucleus (it shuttles; nuclear accumulation is seen only when CRM1 export is blocked), but at steady state it is excluded from the nucleus and acts on ERK in the cytoplasm [PMID:15269220]. The nucleoplasm location derives from a Reactome reaction that groups nuclear and cytoplasmic DUSPs, and overstates the nuclear role of DUSP6.
    supported_by:
    - &id009
      reference_id: PMID:15269220
      supporting_text: the cytoplasmic localization of MKP-3 is mediated by a chromosome region maintenance-1 (CRM1)-dependent nuclear export pathway
    - reference_id: PMID:15269220
      supporting_text: indicating that MKP-3 shuttles between the nucleus and cytoplasm
