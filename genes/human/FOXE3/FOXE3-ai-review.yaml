id: Q13461
gene_symbol: FOXE3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FOXE3 is a nuclear forkhead transcription factor involved in lens epithelial maintenance
  and anterior-eye development. It recognizes regulatory DNA and controls target-gene expression; human
  FOXE3 associates with DNAJB1 regulatory chromatin and stimulates its promoter and RNA expression in
  tested cell systems. Mouse Foxe3 maintains lens epithelial proliferation and restrains premature fiber-cell
  differentiation, while supporting later tissue organization. Human FOXE3 variants are associated with
  congenital lens and anterior-segment abnormalities. Effects on neighboring ocular structures can involve
  interactions with the developing lens, and the relevant direct target program remains incompletely defined.
