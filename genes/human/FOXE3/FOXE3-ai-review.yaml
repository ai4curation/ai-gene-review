suggested_questions:
- question: Which endogenous FOXE3-bound genes directly maintain lens epithelial proliferation and the
    timing of fiber differentiation?
- question: How much of the iris, corneal and trabecular phenotype is mediated by lens-derived signals
    rather than FOXE3 action in the affected tissue?
- question: Which cofactor or DNA-recognition changes distinguish FOXE3 disease alleles at comparable
    endogenous abundance?
- question: To what extent does DNAJB1 mediate FOXE3-dependent lens epithelial survival and differentiation?
suggested_experiments:
- description: Combine acute, dosage-controlled FOXE3 depletion with early nascent-RNA profiling and endogenous
    FOXE3 CUT&RUN in a lens epithelial or lens-organoid system; test candidate regulatory elements before
    late tissue collapse.
  hypothesis: Early, occupied targets distinguish direct FOXE3 regulatory work from secondary changes
    caused by altered proliferation or differentiation.
- description: Use temporally controlled, lens-restricted perturbation and tissue-specific rescue with
    matched developmental staging to compare lens and neighboring anterior-segment outcomes.
  hypothesis: Separating perturbation timing and tissue expression can distinguish lens-mediated developmental
    effects from autonomous requirements.
- description: Compare selected WT and disease-variant FOXE3 alleles at matched protein abundance using
    DNA binding, endogenous occupancy and target transcription as separate readouts; include controlled
    DNAJB1 restoration after FOXE3 depletion.
  hypothesis: The measurements can distinguish recognition, cofactor/reporter and downstream-target contributions
    without equating nuclear localization with preserved function.
