core_functions:
- description: Recognizes regulatory DNA through its forkhead domain and controls Pol II transcription
    in the nucleus. Human FOXE3 chromatin occupancy and DNAJB1 promoter/RNA responses establish the regulatory
    activity; mouse fragment-binding and developmental genetics provide complementary evidence for lens
    epithelial maintenance and differentiation. The underlying target program and tissue interactions
    remain incompletely resolved.
