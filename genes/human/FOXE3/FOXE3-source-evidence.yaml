core_functions:
- description: Recognizes regulatory DNA through its forkhead domain and regulates Pol II transcription
    in the nucleus. Human FOXE3 chromatin occupancy and positive DNAJB1 promoter/RNA responses support
    a tested target-specific regulatory role. Mouse loss-of-function studies establish maintenance of
    lens epithelial proliferation and restraint of premature lens-fiber differentiation, with later fiber
    maturation also affected; human disease and cell studies provide complementary evidence. These linked
    lens-regulatory processes define the developmental core. The exact in vivo human target program, tissue
    interactions and regulatory signs at other targets remain unresolved.
