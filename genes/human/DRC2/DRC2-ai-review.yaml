core_functions:
- description: DRC2 is an integral structural subunit of the axonemal nexin-dynein regulatory complex.
    Its conserved coiled-coil arrangement with DRC1 and DRC4 forms a scaffold that organizes other N-DRC
    subunits and helps couple neighboring microtubule doublets. Detailed scaffold geometry is resolved
    in algae; human respiratory-axoneme models place homologous predicted subcomplexes in cryo-EM density.
    Human CCDC65 loss causes defective nexin links and abnormal ciliary bending, while algal FAP250 mutation
    and rescue establish structural participation in N-DRC and associated inner-arm assembly. Preserved
    outer dynein arms do not imply that the N-DRC is a motor complex or that every inner-arm component
    assembles normally. The specific dependence of human IDAe docking on N-DRC remains unresolved. This
    structural role does not imply autonomous dynein motor activity or an established capacitation mechanism.
