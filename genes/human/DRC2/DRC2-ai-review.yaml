core_functions:
- description: DRC2 is an integral structural subunit of the axonemal nexin-dynein regulatory complex.
    Its conserved coiled-coil arrangement with DRC1 and DRC4 provides binding sites for other N-DRC subunits
    and helps couple neighboring microtubule doublets during ciliary bending. Detailed scaffold geometry
    is resolved in algae; human respiratory-axoneme models place homologous predicted subcomplexes in
    cryo-EM density. Human CCDC65 loss disrupts nexin links and ciliary bending. Algal FAP250 mutation
    and rescue establish participation in N-DRC and selective inner-dynein-arm assembly, while the specific
    dependence of human IDAe docking on N-DRC remains unresolved. Axoneme assembly encompasses this associated
    dynein-complex assembly contribution (GO:0070286). Cilium movement also encompasses the sperm-flagellar
    application (GO:0030317), supported by conserved flagellar function and human sperm-tail localization
    rather than a human sperm perturbation assay. These process terms summarize the integrated scaffold
    role without repeating their descendant terms. The scaffold molecular function synthesizes resolved
    algal contacts with human structural placement and loss-of-function evidence; a separate human GO
    annotation is not proposed because the detailed scaffold contacts have not been independently resolved
    in human DRC2.
