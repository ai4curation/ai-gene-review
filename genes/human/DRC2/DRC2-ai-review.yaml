id: Q8IXS2
gene_symbol: DRC2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DRC2, also known as CCDC65 or NYD-SP28, is a coiled-coil structural protein of the nexin-dynein
  regulatory complex in motile ciliary axonemes. It works with other scaffold subunits to organize the
  complex, link neighboring microtubule doublets and coordinate dynein-driven bending. DRC2 is also present
  along human sperm tails. Its loss disrupts nexin-link architecture and ciliary beating, causing primary
  ciliary dyskinesia.
alternative_products:
- name: '1'
  id: Q8IXS2-1
  description: The official displayed product contains 484 residues. The 2006 human NYD-SP28 study identifies
    AF382188/AAK60542.1, also 484 residues, but its deposited translation carries N202D and A242T relative
    to this reference, both annotated as sequence conflicts by UniProt. The clone is not an exact current-reference
    match; endogenous antibody localization is not isoform-specific. The human respiratory structural
    table names Q8IXS2 and 484 residues without providing independent functional comparisons of natural
    isoforms.
- name: '2'
  id: Q8IXS2-2
  sequence_note: VSP_024644
  description: The official alternative product contains 497 residues. VSP_024644 replaces residues 478–484
    of the displayed product with STSPSAPWRDQRRSFFLGSS. These sources do not establish an isoform-specific
    function or demonstrate equivalent assembly or localization for the alternative C terminus. Clinical
    frameshift variants and engineered algal alleles are not additional natural products.
