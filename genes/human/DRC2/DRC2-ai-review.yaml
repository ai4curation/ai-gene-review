id: Q8IXS2
gene_symbol: DRC2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DRC2, also known as CCDC65 or NYD-SP28, is a coiled-coil structural protein of the nexin-dynein
  regulatory complex in motile ciliary axonemes. It works with other scaffold subunits to organize the
  complex, link neighboring microtubule doublets and coordinate dynein-driven bending. DRC2 is also present
  along human sperm tails. Its loss disrupts nexin-link architecture and ciliary beating, causing primary
  ciliary dyskinesia.
alternative_products:
- name: '1'
  id: Q8IXS2-1
  description: The displayed protein contains 484 residues. The historical AF382188/AAK60542.1 human clone
    also encodes 484 residues and differs at N202D and A242T, both documented UniProt sequence conflicts.
    The human respiratory structural inventory lists Q8IXS2 with 484 residues.
- name: '2'
  id: Q8IXS2-2
  sequence_note: VSP_024644
  description: 'This 497-residue product has an alternative C terminus: VSP_024644 replaces displayed
    residues 478–484 with STSPSAPWRDQRRSFFLGSS. Its distinct terminal segment has no established product-specific
    functional effect in the cited studies.'
