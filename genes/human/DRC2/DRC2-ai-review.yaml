- id: PMID:24094744
  title: Zebrafish Ciliopathy Screen Plus Human Mutational Analysis Identifies C21orf59 and CCDC65 Defects
    as Causing Primary Ciliary Dyskinesia.
  findings:
  - statement: Human CCDC65 truncations disrupt nexin links and ciliary beating; algal FAP250 mutation
      and genomic rescue establish N-DRC and associated inner-arm assembly participation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The machine cache remains abstract-only. The separately recovered original Results and
      Figure 6 were read. Human Results (PMC3791264, section sec3.4) report reduced inner arms with preserved
      outer arms; Figure 6B broadly describes normal arms. The assembly interpretation is anchored chiefly
      in algal FAP250 mutation/genomic rescue (section sec3.5 and Figure 6H–J), while human nexin-link
      and waveform defects support the target context. C21orf59 arm-loss/rescue experiments are distinct.
      Public source links resolve directly to these sections and the caption.
  full_text_unavailable: true
