  label: Homo sapiens
description: BRWD3 is a nuclear protein containing eight WD repeats and tandem bromodomains
  that participates in regulation of RNA polymerase II transcription. Mammalian studies
  connect its WD-repeat region to DDB1 binding and recruitment of transcriptional
  machinery to active promoters during early adipogenesis. The bromodomains are consistent
  with chromatin recognition, while the physiological histone-mark preferences and
  effector repertoire of the human protein remain incompletely resolved. Depletion
  of human BRWD3 alters cell morphology, and loss-of-function variants cause X-linked
  intellectual disability frequently accompanied by macrocephaly. The single Drosophila
  family homolog regulates histone deposition and KDM5 abundance; the conservation
  of its particular ubiquitin-ligase substrates among human BRWD3, BRWD1, and PHIP
  remains uncertain.
