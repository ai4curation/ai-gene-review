- id: PMID:37722046
  title: BRWD3 promotes KDM5 degradation to maintain H3K4 methylation levels.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and Introduction, material Results/Discussion,
      and relevant RNAi, construct, fly, IP, denaturing ubiquitylation, and cycloheximide-chase
      Methods read from the normal cache. Actual experiments are Drosophila embryos
      and S2 cells. The Discussion explicitly leaves human conservation unresolved
      and states direct targeting of KDM5 for polyubiquitylation is not yet conclusive
      even in the fly system. Figures/supplement images were not viewed. The Results
      explicitly attribute earlier human peptide-binding experiments to BRWD2/PHIP,
      whereas the Discussion uses BRWD3 when summarizing H3K4me3 binding (refs 19/20).
      The matching inspected primary reader studies assay human PHIP and a fly module;
      the exact numbered bibliography is absent from this cache. The Discussion also
      asserts human BRWD3-dependent CUL4 recruitment without an adjacent citation.
      Separately inspected human RepID/PHIP KO, rescue and WD40-fragment experiments
      establish that mechanism for PHIP, but the citation chain to this sentence remains
      unverified. These sentences therefore do not by themselves resolve selective
      human BRWD3 histone-reader or ligase-substrate-adaptor activity. This does not
      deny possible conserved functions or invalidate the fly experiments.
  findings:
  - statement: Drosophila BRWD3 promotes KDM5 K48-linked ubiquitylation and turnover
      and thereby influences H3K4 methylation. The paper does not establish that human
      BRWD3 or its paralogs degrades human KDM5.
- id: PMID:17668385
  title: Mutations in the BRWD3 gene cause X-linked mental retardation associated
    with macrocephaly.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete normal cached body read, including human family sequencing,
      splice/frameshift findings, and Discussion; figure images were not inspected.
      Two truncating-variant families support the disease association. The K1596E
      missense variant is explicitly uncertain. Proposed JAK/STAT and proliferation
      mechanisms are hypotheses, not demonstrated human molecular activities; old
      paralog-name prose is not used for modern gene identity.
  findings:
  - statement: Truncating BRWD3 variants segregate with X-linked intellectual disability
      and macrocephaly in the reported human families; phenotype evidence does not
      by itself identify a developmental molecular step.
core_functions:
- description: BRWD3 participates in nuclear chromatin-associated regulation of RNA
    polymerase II transcription. In mouse preadipocytes, BRWD3 binds DDB1 through
    its WD-repeat region and recruits it to immediate-early gene promoters, supporting
    transcriptional activation. This mammalian mechanism connects chromatin association
    to recruitment of transcription-regulatory machinery.
