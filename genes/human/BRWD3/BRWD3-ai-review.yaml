knowledge_gaps:
- gap_statement: Whether human BRWD3, BRWD1, or PHIP conserves the fly BRWD3-dependent
    degradation of KDM5-family demethylases remains unresolved.
  boundary: Fly BRWD3 associates with KDM5 and promotes its ubiquitylation and turnover
    in embryos/S2-cell experiments. The paper explicitly withholds a conclusion about
    conservation in human proteins.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  resolution: Test endogenous human BRWD3 loss and rescue separately from BRWD1/PHIP,
    measure individual KDM5-family protein turnover and ubiquitylation, and reconstitute
    any supported substrate-recruitment reaction with defined components.
  provenance:
  - reference_id: PMID:37722046
    supporting_text: whether BRWD3 or any of its orthologs promotes KDM5 homolog degradation
      in humans
- gap_statement: The histone-recognition and effector-recruitment activities of human
    BRWD3 are not yet resolved separately from the related PHIP and BRWD1 proteins
    in the inspected biochemical evidence.
  boundary: GO:0140566 histone reader activity requires bringing a protein together
    with a histone form; it does not require a particular quantitative affinity or
    a specific histone mark. The H3K4-binding claim summarized in PMID:37722046 draws
    on human PHIP and fly-module assays, while the target-specific human BRWD3 peptide-array
    signals in PMID:22464331 were not inspected. Mouse BRWD3-dependent DDB1 promoter
    recruitment supports a conserved chromatin-adaptor mechanism, but the examined
    data do not independently resolve histone engagement by human BRWD3. GO:1990756
    ubiquitin-like ligase-substrate adaptor activity requires bridging a ligase and
    its substrate; the inspected human CUL4-recruitment experiments concern PHIP,
    and the BRWD3-specific mammalian DDB1 transcription mechanism is CUL4-independent.
    These are limits on the present assignment, not evidence that human BRWD3 lacks
    either activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  resolution: Resolve human BRWD3 constructs and endogenous rescue separately from
    PHIP/BRWD1; directly measure nucleosome recognition and recruitment of DDB1 or
    a defined ligase-substrate pair.
  provenance:
  - reference_id: PMID:22464331
  - reference_id: PMID:34161765
  - reference_id: PMID:37722046
suggested_questions:
- question: Which histone modifications are recognized quantitatively by full-length
    human BRWD3 in nucleosomes, and how do these preferences differ from BRWD1 and
    PHIP?
- question: Does the DDB1 recruitment mechanism established in mouse preadipocytes
    operate at endogenous human BRWD3 target loci, including neural cells affected
    by BRWD3 loss?
- question: Which of the five annotated human protein products retain the same chromatin-recognition
    and effector-recruitment functions?
suggested_experiments:
- hypothesis: Human BRWD3 combines histone recognition with DDB1 recruitment in a
    context-dependent manner.
  description: Compare purified full-length human BRWD3 and domain variants on matched
    modified and unmodified nucleosomes, then test DDB1 recruitment and nascent transcription
    after endogenous BRWD3 depletion and rescue in a defined human cell type. Include
    BRWD1/PHIP and isoform controls.
  experiment_type: Biochemical binding and cellular separation-of-function rescue
