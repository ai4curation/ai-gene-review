  evidence_type: IDA
  original_reference_id: PMID:19805282
  qualifier: involved_in
  review:
    summary: EARS2 directly supplies charged mitochondrial tRNAs for translation.
    action: ACCEPT
    reason: The human enzyme catalyses the glutamate-loading step on mitochondrial tRNA-Glu and tRNA-Gln
      in PMID:19805282. This is direct biochemical participation in tRNA aminoacylation for mitochondrial
      translation, not an inference from disease necessity or from GatCAB knockdown. Natural alternative-product
      equivalence and detailed matrix imaging remain separate evidence questions.
