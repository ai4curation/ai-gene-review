  evidence_type: IDA
  original_reference_id: PMID:19805282
  qualifier: enables
  review:
    summary: Human EARS2 glutamylates mitochondrial tRNA-Gln.
    action: ACCEPT
    reason: PMID:19805282 demonstrates a nondiscriminating human mtGluRS that charges native mitochondrial
      tRNA-Gln with glutamate. GO:0050561 names this activity; its current definition uses the broader
      Glx wording, while Rhea:64612 explicitly describes the tRNA-Gln reaction. The product is Glu-tRNA-Gln,
      which GatCAB subsequently converts to Gln-tRNA-Gln. This does not assign glutaminyl-tRNA synthetase
      or amidotransferase activity to EARS2.
    supported_by:
    - reference_id: PMID:19805282
    - reference_id: file:human/EARS2/EARS2-bioinformatics/RESULTS.md
