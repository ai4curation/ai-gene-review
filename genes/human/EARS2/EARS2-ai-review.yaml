- id: PMID:19805282
  title: Biogenesis of glutaminyl-mt tRNAGln in human mitochondria.
  full_text_unavailable: false
  findings:
  - statement: Recombinant human EARS2 glutamylates native mitochondrial tRNA-Glu and tRNA-Gln. Full-length
      C-terminal EGFP fusion targets HeLa mitochondria; the separate GatCAB complex performs subsequent
      amidation.
    supporting_text: The mtGluRS efficiently glutamylated both mt tRNA Gln and mt tRNA Glu
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: "Relevant passages in the main-text Results, Discussion and Methods were read. Detailed supplementary Methods were not recovered. The matrix-specific assay was not independently reconstructed; the positive curated EXP/ECO:0000269 matrix assertion is retained with this limit. The named NP_001077083.1 reference parent matches Q5JPH6-1, not proof of the complete experimental insert."
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular context.
  full_text_unavailable: false
  findings:
  - statement: Human mitochondrial proteomics detects EARS2 group 6714, with Class 1 enrichment/importomics
      and Cluster 1 spatial profiling. Operational peripheral association does not identify a mitochondrial
      membrane face or provide separate isoform measurements.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: "The primary article was retrieved as XML and PMC HTML. Selected Methods and Results passages and publisher Table S1 were read. The table MD5 matches the article metadata. EARS2 appears at sheet (A) row 333 and sheet (B) row 301; the matrix GO column imports prior annotation. Figure images were not independently assessed."
- id: PMID:22492562
  title: Leukoencephalopathy with thalamus and brainstem involvement and high lactate 'LTBL' caused by
    EARS2 mutations.
  full_text_unavailable: true
  findings:
  - statement: Biallelic EARS2 variants were identified in patients with infantile-onset leukoencephalopathy,
      thalamic and brainstem abnormalities, elevated lactate and variable clinical severity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: "Identifier and title were verified against the cached publication record; the complete abstract was read. Full primary Methods/Results were not recovered or used to infer additional mechanistic functions."
