id: Q5JPH6
gene_symbol: EARS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EARS2 is the mitochondrial glutamyl-tRNA synthetase. It uses ATP to attach glutamate to both
  mitochondrial tRNA-Glu and mitochondrial tRNA-Gln. The first product supplies glutamate during mitochondrial
  protein synthesis; the second is converted to glutaminyl-tRNA-Gln by the separate GatCAB amidotransferase.
  EARS2 therefore supplies two aminoacyl-tRNA pathways that support mitochondrial translation.
alternative_products:
- name: '1'
  id: Q5JPH6-1
  description: 523-residue reference product. The named NP_001077083.1 parent sequence in the biochemical
    study matches this product. The assay used a transit-sequence-deleted recombinant enzyme; identity
    of the complete experimental insert was not independently established.
- name: '2'
  id: Q5JPH6-2
  sequence_note: VSP_057203
  description: '534-residue product with a distinct C-terminal segment: the displayed residues 497–523
    are replaced by 38 residues. The upstream sequence, including the annotated targeting and substrate-binding
    regions, is unchanged. Equivalent catalytic activity or localization has not been demonstrated by
    this sequence comparison.'
