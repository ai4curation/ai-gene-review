core_functions:
- description: EARS2 uses ATP to attach glutamate to mitochondrial tRNA-Glu, producing the charged tRNA
    required for mitochondrial protein synthesis. Recombinant human enzyme directly supports this reaction.
    Matrix localization follows the positive curated experimental annotation; the inspected primary main
    text directly establishes mitochondrial targeting.
  molecular_function:
    id: GO:0004818
    label: glutamate-tRNA ligase activity
  directly_involved_in: &id001
  - id: GO:0070127
    label: tRNA aminoacylation for mitochondrial protein translation
  locations: &id002
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by: &id003
  - reference_id: PMID:19805282
  - reference_id: file:human/EARS2/EARS2-uniprot.txt
- description: EARS2 also attaches glutamate to mitochondrial tRNA-Gln. This nondiscriminating charging
    reaction supplies Glu-tRNA-Gln for subsequent conversion to Gln-tRNA-Gln by the separate GatCAB amidotransferase.
    EARS2 performs the glutamate-loading step and does not itself catalyze that amidation.
  molecular_function:
    id: GO:0050561
    label: glutamate-tRNA(Gln) ligase activity
  directly_involved_in: *id001
  locations: *id002
  supported_by: *id003
suggested_questions:
- question: Does human EARS2 coordinate zinc, and which residues determine metal occupancy or dependence
    relative to bacterial glutamyl-tRNA synthetases?
- question: Do the 523- and 534-residue natural products differ in mitochondrial targeting, substrate
    specificity or catalytic efficiency?
- question: How is matrix-localized EARS2 associated with mitochondrial membranes, and does that organization
    affect access to its two tRNA substrates?
suggested_experiments:
- hypothesis: Human EARS2 retains a metal-binding site with coordination distinct from the bacterial four-ligand
    arrangement.
  description: Measure metal occupancy and aminoacylation of sequence-verified human enzyme under controlled
    metal depletion and add-back conditions, including matched ligand substitutions and folding controls.
  experiment_type: Biochemical metal and enzyme analysis
- hypothesis: The alternative C-terminal segment changes EARS2 localization or catalytic efficiency.
  description: Compare both complete sequence-verified natural products at matched expression, independently
    measuring mitochondrial subcompartment localization and glutamate charging of native mitochondrial
    tRNA-Glu and tRNA-Gln.
  experiment_type: Controlled product comparison
