access_cautions:
- The first EPMC XML route returned HTTP 406 with a JSON Accept header; the corrected XML request recovered
  the original.
- The PMC workbook route returned a challenge payload and the cloud route returned 404. The publisher
  workbook is authentic and matches the original supplementary-file MD5.
- No image pixels were interpreted.
- The normal 19805282 cache contains the main article; the unavailable SI prevents reconstruction of the
  matrix-specific assay, not retention of the positive curator assertion.
- The provider attempts failed authentically and supplied no research report.
