    publisher Table S1 were read. The table MD5 matches the article metadata. EARS2 appears at sheet (A)
    row 333 and sheet (B) row 301; the matrix GO column imports prior annotation. No figure-pixel interpretation
    is claimed.
  operative_finding: Human mitochondrial proteomics detects EARS2 group 6714, with Class 1 enrichment/importomics
    and Cluster 1 spatial profiling. Operational peripheral association does not identify a mitochondrial
    membrane face or provide separate isoform measurements.
