    experimental insert.
  operative_finding: Recombinant human EARS2 glutamylates native mitochondrial tRNA-Glu and tRNA-Gln.
    Full-length C-terminal EGFP fusion targets HeLa mitochondria; the separate GatCAB complex performs
    subsequent amidation.
