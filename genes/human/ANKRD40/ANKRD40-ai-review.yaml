knowledge_gaps:
- gap_statement: ANKRD40's molecular activity, location and biological role are unknown; whether its AHCY
    interaction affects methyl-cycle activity is untested.
  boundary: Of 18 protein-binding rows, only the AHCY interaction is reproducible across methods and is
    kept as enzyme binding; the rest are single-screen hits. PAN-GO assigns nothing and PTHR24192 has
    no annotated PAINT nodes. The literature is interactome listings only.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: A reproducible partnership with AHCY, the enzyme that clears S-adenosylhomocysteine, is
    a concrete lead for an otherwise unknown brain-enhanced protein.
  resolution: Test whether ANKRD40 alters AHCY activity, localization or stability, and localize endogenous
    ANKRD40.
  provenance:
  - reference_id: file:human/ANKRD40/ANKRD40-uniprot.txt
    supporting_text: 'CC       Q6AI12; P23526: AHCY; NbExp=10; IntAct=EBI-2838246, EBI-1053240;'
  - reference_id: file:human/ANKRD40/ANKRD40-uniprot.txt
