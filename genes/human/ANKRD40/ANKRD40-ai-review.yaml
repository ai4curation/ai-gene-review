id: Q6AI12
gene_symbol: ANKRD40
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD40 (ankyrin repeat domain-containing 40) is an uncharacterized ankyrin-repeat protein
  with brain-enhanced expression. Endogenously tagged, it localizes prominently to the Golgi apparatus.
  Its one reproducible interaction is with the enzyme S-adenosylhomocysteine hydrolase (AHCY), detected
  across several independent proteome-scale studies. It has also been listed among proteins associated
  with MZF1 nuclear bodies. No molecular activity or biological role has been established.
