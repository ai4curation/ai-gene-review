knowledge_gaps:
- gap_statement: ANKRD40's molecular activity and biological role are unknown; it is Golgi-localized,
    and whether its AHCY interaction affects methyl-cycle activity is untested.
  boundary: Of 18 protein-binding rows, only the AHCY interaction is reproduced across independent methods
    (yeast two-hybrid, affinity purification-mass spectrometry and endogenous tagging) and is kept as
    enzyme binding. Some of the others recur in two screens of the same kind (PIN1 in two yeast two-hybrid
    maps; LTA, RCBTB1 and ULK4 in two BioPlex releases), but none has cross-method support or follow-up.
    OpenCell places endogenous ANKRD40 prominently at the Golgi, while AHCY is cytoplasmic and nucleoplasmic.
    PAN-GO assigns nothing and PTHR24192 has no annotated PAINT nodes. The literature is interactome listings
    only.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: A reproducible partnership with AHCY, the enzyme that clears S-adenosylhomocysteine, is
    a concrete lead for an otherwise unknown brain-enhanced protein.
  resolution: Test whether ANKRD40 alters AHCY activity, localization or stability, and localize endogenous
    ANKRD40.
  provenance:
  - reference_id: file:human/ANKRD40/ANKRD40-uniprot.txt
    supporting_text: 'CC       Q6AI12; P23526: AHCY; NbExp=10; IntAct=EBI-2838246, EBI-1053240;'
