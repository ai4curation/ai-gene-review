    supporting_text: DR   PAN-GO; Q6AI12; 0 GO annotations based on evolutionary models.
  - reference_id: file:human/ANKRD40/ANKRD40-uniprot.txt
    supporting_text: DR   HPA; ENSG00000154945; Tissue enhanced (brain).
  - reference_id: file:human/ANKRD40/ANKRD40-deep-research-affinage.md
    supporting_text: Beyond this single interactome-based association, no direct experimental evidence
      in the available corpus has established ANKRD40's enzymatic activity
