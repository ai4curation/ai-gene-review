description: ANKRD40 (ankyrin repeat domain-containing 40) is an uncharacterized ankyrin-repeat protein
  with brain-enhanced expression. Its one reproducible interaction is with the enzyme S-adenosylhomocysteine
  hydrolase (AHCY), detected across several independent proteome-scale studies. It has also been listed
  among proteins associated with MZF1 nuclear bodies. No molecular activity, location or biological role
  has been established.
