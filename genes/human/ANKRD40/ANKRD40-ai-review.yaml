suggested_questions:
- question: Does ANKRD40 regulate AHCY activity or localization, and so influence cellular methylation
    potential?
suggested_experiments:
- description: Confirm the Golgi localization of endogenous ANKRD40 against Golgi markers, test where
    it meets AHCY (which OpenCell places in cytoplasm and nucleus), and measure AHCY activity and the
    SAM/SAH ratio in ANKRD40 knockout cells.
