id: Q8TEQ6
gene_symbol: GEMIN5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GEMIN5 (Gem-associated protein 5) is a 1508-residue RNA-binding subunit of the survival motor
  neuron (SMN) complex. Its N-terminal tandem WD40 beta-propellers (13 WD repeats) recognize the Sm site,
  adjacent 3' sequences and the 7-methylguanosine cap of small nuclear RNA precursors, allowing the SMN
  complex to distinguish Sm-class snRNAs from other cellular RNAs and deliver them for assembly of the
  heptameric Sm protein core, the key step in spliceosomal snRNP biogenesis. A central alpha-helical TPR-like
  module mediates homodimerization, and a C-terminal non-canonical RNA-binding region (RBS1/RBS2) binds
  structured mRNA elements, including its own mRNA and viral IRESs. GEMIN5 also binds the 3'-UTR of SMN
  mRNA to promote its translation and binds 60S ribosomal subunits, modulating global protein synthesis.
  It is predominantly cytoplasmic, with a smaller pool in the nucleoplasm and in gems. Biallelic loss-of-function
  variants cause a neurodevelopmental disorder with cerebellar atrophy and motor dysfunction.
existing_annotations:
- term:
    id: GO:0000340
    label: RNA 7-methylguanosine cap binding
  evidence_type: IDA
  original_reference_id: PMID:19750007
  qualifier: enables
  review:
    summary: GEMIN5 binds the 7-methylguanosine (m7G) cap of RNA directly through its tandem WD40 propellers.
    action: ACCEPT
    reason: Cap-affinity purification, UV crosslinking competed by free cap analog, and independent crystal
      structures of the WD40 region bound to m7G nucleotides establish direct cap recognition (PMID:19750007,
      PMID:27881600, PMID:27881601). Cap binding is not mediated by eIF4E, which the same study found
      does not tether GEMIN5 to m7G. Together with Sm-site recognition, cap binding is part of how GEMIN5
      discriminates pre-snRNAs, so this is a core molecular activity.
    supported_by:
    - reference_id: PMID:19750007
      supporting_text: Gemin5 binds directly to the m7G cap structure.
    - reference_id: PMID:27881600
      supporting_text: the WD40 domain of Gemin5 recognizes the Sm site and m7G cap of pre-snRNAs via
        two distinct binding sites
    - reference_id: PMID:19750007
      supporting_text: This observation indicates that eIF4E is not responsible for tethering gemin5 to
        m7G.
