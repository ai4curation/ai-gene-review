- term:
    id: GO:0017069
    label: snRNA binding
  evidence_type: IDA
  original_reference_id: PMID:16857593
  qualifier: enables
  review:
    summary: GEMIN5 directly and specifically binds Sm-class snRNAs and their precursors via its WD40
      domain.
    action: ACCEPT
    reason: 'GEMIN5 is the snRNA-binding subunit of the SMN complex: it binds directly to the Sm site
      and adjacent features of snRNAs through the 13-WD-repeat domain, which is necessary and sufficient
      for sequence-specific high-affinity binding (PMID:16857593, PMID:19377484, PMID:27881600). snRNA
      binding is kept rather than refined: GEMIN5 recognizes the Sm site/snRNP code shared by all Sm-class
      snRNAs (U1, U2, U4, U5, U11, U12, U4atac and their precursors), so the general term is the level
      that captures its specificity; the U1/U4/U4atac terms are individual substrate instances. This is
      also the family-wide function assessed for PTHR46362.'
    supported_by:
    - reference_id: PMID:16857593
      supporting_text: Gemin5 binds directly and specifically to the unique features, including the Sm
        site, of snRNAs.
    - reference_id: PMID:19377484
      supporting_text: The entire WD repeat domain, comprising 13 WD motifs, is both necessary and sufficient
        for sequence-specific, high-affinity binding of Gemin5 to its RNA targets.
    - reference_id: PMID:27881600
      supporting_text: the WD40 domain of Gemin5 is both necessary and sufficient for binding the Sm site
        of pre-snRNAs
