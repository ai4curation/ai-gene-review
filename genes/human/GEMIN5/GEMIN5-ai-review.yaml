- term:
    id: GO:0032797
    label: SMN complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - FB:FBgn0250850
  - PANTHER:PTN005299808
  - UniProtKB:Q8TEQ6
  review:
    summary: GEMIN5 is a (peripheral) subunit of the SMN complex.
    action: ACCEPT
    reason: GEMIN5 was identified as an SMN-complex component that binds SMN and Sm proteins (PMID:11714716).
      The SMN-complex interaction map places it as a peripheral component bound onto the SMN-Gemin8-Gemin7
      core and shows it contributes an essential activity (PMID:17178713); it is present hyper-stoichiometrically
      and delivers pre-snRNAs to the complex (PMID:20513430). The IBA node (PTN005299808) is seeded by
      Drosophila rig, which is an SMN-complex component in flies; consistent with conservation across
      PTHR46362:SF1.
    supported_by:
    - reference_id: PMID:11714716
      supporting_text: Gemin5 interacts with several of the snRNP core proteins including SmB, SmD1, SmD2,
        SmD3, and SmE, suggesting that it participates in the activities of the SMN complex in snRNP assembly.
    - reference_id: PMID:17178713
      supporting_text: Finally, we show that the peripheral component Gemin5 contributes an essential
        activity to the SMN complex
    - reference_id: PMID:20513430
      supporting_text: highlighting Gemin5's function in delivering pre-snRNAs as substrates for Sm core
        assembly and processing
