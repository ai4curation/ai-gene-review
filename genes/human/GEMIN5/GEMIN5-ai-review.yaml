- term:
    id: GO:0006417
    label: regulation of translation
  evidence_type: IMP
  original_reference_id: PMID:25911097
  qualifier: involved_in
  review:
    summary: GEMIN5 regulates translation in both directions, depending on the target.
    action: MODIFY
    reason: 'Regulation of translation is correct but both specific directions are directly supported,
      so per the refinement rule both descendants are listed: GEMIN5 binding to the SMN 3''-UTR increases
      SMN mRNA translation (positive regulation; PMID:25911097), whereas GEMIN5 binds ribosomes and its
      depletion enhances global protein synthesis (negative regulation of global translation; PMID:27507887).'
    proposed_replacement_terms:
    - id: GO:0045727
      label: positive regulation of translation
    - id: GO:0017148
      label: negative regulation of translation
    supported_by:
    - reference_id: PMID:25911097
      supporting_text: Gemin5 binding to the SMN 3′-UTR activates expression of SMN protein by increasing
        translation of the SMN mRNA.
    - reference_id: PMID:27507887
      supporting_text: His-Gemin5 binds to ribosome particles via its N-terminal domain.
    - reference_id: PMID:27507887
      supporting_text: Gemin5 siRNA depletion decreased the polysome/80S ratio, and enhanced global protein
        synthesis.
