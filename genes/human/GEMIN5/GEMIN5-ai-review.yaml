    label: RNA 7-methylguanosine cap binding
  evidence_type: IDA
  original_reference_id: PMID:19750007
  qualifier: enables
  review:
    action: ACCEPT
    summary: GEMIN5 recognizes the methylguanosine cap of RNA.
    reason: Biochemical binding and independent structural analyses establish a cap-binding site on the
      tandem WD40 region. This is a specific RNA-recognition activity, distinct from cap-dependent translation
      initiation by eIF4E.
    supported_by: &id001
