- term:
    id: GO:0000387
    label: spliceosomal snRNP assembly
  evidence_type: EXP
  original_reference_id: PMID:12067652
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: GEMIN5 selects snRNAs for SMN-mediated snRNP assembly.
    reason: Its RNA-binding role and interactions with Sm proteins support an upstream assembly function.
      The annotation does not imply that GEMIN5 independently catalyzes every assembly step.
    supported_by: &id002
    - &id004
      reference_id: PMID:27881600
      supporting_text: 'the WD40 domain of Gemin5 is both necessary and

        sufficient for binding the Sm site of pre-snRNAs'
    - &id003
      reference_id: PMID:11714716
      supporting_text: "Gemin5 interacts with several of the \nsnRNP core proteins including SmB, SmD1,\
        \ SmD2, SmD3, and SmE, suggesting that it \nparticipates in the activities of the SMN complex\
        \ in snRNP assembly."
