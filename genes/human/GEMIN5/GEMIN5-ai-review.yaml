- term:
    id: GO:0000398
    label: mRNA splicing, via spliceosome
  evidence_type: TAS
  original_reference_id: PMID:11714716
  qualifier: involved_in
  review:
    summary: Splicing is a downstream consequence of GEMIN5's role in producing spliceosomal snRNPs.
    action: MODIFY
    reason: GEMIN5 has no demonstrated role in the spliceosome's catalytic cycle; it acts upstream by
      selecting snRNAs for Sm core assembly in the cytoplasm. In GO, spliceosomal snRNP assembly (GO:0000387)
      is a descendant of mRNA splicing, via spliceosome, so the specific term the gene already carries
      captures this TAS statement precisely.
    proposed_replacement_terms:
    - id: GO:0000387
      label: spliceosomal snRNP assembly
    supported_by:
    - reference_id: PMID:16857593
      supporting_text: Gemin5 binds directly and specifically to the unique features, including the Sm
        site, of snRNAs.
    - reference_id: PMID:11714716
      supporting_text: Gemin5 interacts with several of the snRNP core proteins including SmB, SmD1, SmD2,
        SmD3, and SmE, suggesting that it participates in the activities of the SMN complex in snRNP assembly.
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: GEMIN5 is an RNA-binding protein; its RNA-binding activities are characterized at the level
      of specific substrates.
    action: MODIFY
    reason: 'RNA binding is correct but more general than the evidence supports. GEMIN5 binds Sm-class
      snRNAs through its WD40 domain (snRNA binding, already annotated) and binds mRNAs: the SMN mRNA
      3''-UTR, its own mRNA (H12 element, via the C-terminal RBS1 region), and viral IRES elements (PMID:25911097,
      PMID:34424823). The RNAcentral partner on the IPI row is such an RBS1 target. Replace with snRNA
      binding and mRNA binding (mRNA 3''-UTR binding is a further-specific child already annotated).'
    proposed_replacement_terms:
    - id: GO:0017069
      label: snRNA binding
    - id: GO:0003729
      label: mRNA binding
    supported_by:
    - reference_id: PMID:19377484
      supporting_text: The entire WD repeat domain, comprising 13 WD motifs, is both necessary and sufficient
        for sequence-specific, high-affinity binding of Gemin5 to its RNA targets.
    - reference_id: PMID:25911097
      supporting_text: Gemin5 directly binds to the mature SMN 3′-UTR immediately upstream of the poly(A)
        tail.
    - reference_id: PMID:34424823
      supporting_text: The RBS1 domain is involved in the recognition of viral IRES elements [9] and cellular
        RNAs [11], including an internal region of Gemin5 mRNA (designated H12).
