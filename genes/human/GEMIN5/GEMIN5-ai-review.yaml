  label: Homo sapiens
description: 'GEMIN5 encodes a 1,508-residue RNA-binding protein that helps select small nuclear RNAs for assembly
  into spliceosomal ribonucleoproteins. Its N-terminal region forms two seven-bladed WD-repeat propellers with
  distinct surfaces for Sm-site RNA recognition and 7-methylguanosine-cap binding. As a peripheral component
  of the SMN assembly machinery, GEMIN5 links RNA recognition to delivery and assembly in the cytoplasm; nuclear
  pools occur in the nucleoplasm and gems. GEMIN5 also regulates translation through RNA and ribosome interactions.
  The direction of this regulation depends on the transcript and experimental context: SMN mRNA translation
  can be promoted, whereas global protein synthesis is restrained under other tested conditions. C-terminal
  RNA-binding regions provide additional recognition capacity. Biallelic damaging variants impair assembly-system
  function and cause neurodevelopmental disease.'
status: DRAFT
