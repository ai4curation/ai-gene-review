id: Q8TEQ6
gene_symbol: GEMIN5
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GEMIN5 is an RNA-binding component of the SMN machinery that selects small nuclear RNAs for
  spliceosomal snRNP assembly. Its tandem WD40 propellers recognize snRNA sequence elements and the RNA
  cap, while additional regions support oligomerization and interactions with structured mRNAs and ribosomes.
  It regulates translation in a transcript- and context-dependent manner and occupies predominantly cytoplasmic
  pools with a smaller nuclear gem-associated pool.
