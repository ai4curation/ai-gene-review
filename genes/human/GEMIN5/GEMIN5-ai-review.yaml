- term:
    id: GO:0043022
    label: ribosome binding
  evidence_type: IDA
  original_reference_id: PMID:27507887
  qualifier: enables
  review:
    summary: GEMIN5 binds ribosomes directly.
    action: ACCEPT
    reason: GEMIN5 co-sediments with ribosomes and polysomes, interacts with ribosomal proteins L3 and
      L4 and the 60S subunit, and recombinant GEMIN5 binds ribosome particles via its N-terminal WD40
      region; an F381A substitution abolishes this (PMID:27507887). This underlies its effect on global
      translation.
    supported_by:
    - reference_id: PMID:27507887
      supporting_text: His-Gemin5 binds to ribosome particles via its N-terminal domain.
    - reference_id: PMID:27507887
      supporting_text: Gemin5 siRNA depletion decreased the polysome/80S ratio, and enhanced global protein
        synthesis.
    - reference_id: file:human/GEMIN5/GEMIN5-deep-research-falcon.md
      supporting_text: GEMIN5 also has an experimentally separable, SMN-complex-independent role in protein
        synthesis.
