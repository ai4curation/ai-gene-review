- term:
    id: GO:0003730
    label: mRNA 3'-UTR binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:2449311
  - PANTHER:PTN005299808
  - UniProtKB:Q8TEQ6
  review:
    summary: GEMIN5 binds the 3'-UTR of SMN mRNA and thereby stimulates its translation.
    action: ACCEPT
    reason: Direct binding to the mature SMN 3'-UTR, immediately upstream of the poly(A) tail, was shown
      biochemically and in cells, and this binding increases SMN translation without affecting mRNA stability
      (PMID:25911097). The IBA node (PTN005299808) is grounded on the human and mouse experimental annotations
      from the same study (mouse Gemin5 also has an IDA to PMID:25911097).
    supported_by:
    - reference_id: PMID:25911097
      supporting_text: Gemin5 directly binds to the mature SMN 3′-UTR immediately upstream of the poly(A)
        tail.
    - reference_id: PMID:25911097
      supporting_text: Gemin5 binding to the SMN 3′-UTR activates expression of SMN protein by increasing
        translation of the SMN mRNA.
