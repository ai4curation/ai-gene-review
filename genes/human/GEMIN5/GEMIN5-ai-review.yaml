suggested_questions:
- question: Which transcript features and cellular conditions determine whether GEMIN5 stimulates or represses
    translation, and how do N-terminal cap/ribosome contacts cooperate with C-terminal RNA recognition?
- question: When is GEMIN5 required for substrate selection in the cellular SMN pathway, given that simplified
    reconstituted complexes can assemble selected snRNP substrates without it?
- question: How stable and stoichiometric is GEMIN5 association with the SMN–GEMIN2 subcomplex in cells, compared
    with the positive purified-complex binding assay?
- question: 'What accounts for GEMIN5 recovery in the TFE-resistant NK-cell membrane fraction: a peripheral
    protein complex, direct lipid association, or another fractionation-dependent association?'
suggested_experiments:
- description: Compare capped snRNA and mRNA substrates using matched amounts of full-length human GEMIN5 and
    folding-verified site mutants. Measure RNA binding, SMN-dependent Sm loading and translation separately,
    keeping engineered fragments distinct from natural products.
- description: Use endogenous GEMIN5 perturbation with abundance-matched rescue and transcript-resolved translation
    measurements to distinguish direct target regulation from changes in SMN-complex abundance or global protein
    synthesis.
