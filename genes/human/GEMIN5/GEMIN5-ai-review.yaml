- term:
    id: GO:0016020
    label: membrane
  evidence_type: HDA
  original_reference_id: PMID:19946888
  qualifier: located_in
  review:
    summary: Detected in a membrane-fraction proteome of NK-like cells; no protein-specific evidence of
      membrane association.
    action: MARK_AS_OVER_ANNOTATED
    reason: The source study identified 1843 proteins in membrane preparations and notes that many are
      only transiently or peripherally associated. GEMIN5 is a soluble cytoplasmic/nuclear RNA-binding
      protein with no transmembrane segment and no targeted evidence for membrane association; the detection
      most likely reflects co-purifying RNP/ribosome material.
    supported_by:
    - reference_id: PMID:11714716
      supporting_text: Immunolocalization studies demonstrate that Gemin5 is found in the cytoplasm and
        in the nucleus, where it colocalizes with SMN in gems.
