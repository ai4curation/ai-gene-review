- term:
    id: GO:0034718
    label: SMN-Gemin2 complex
  evidence_type: IDA
  original_reference_id: PMID:19377484
  qualifier: part_of
  review:
    summary: GEMIN5 co-purifies with SMN-Gemin2-containing assemblies.
    action: KEEP_AS_NON_CORE
    reason: GO:0034718 is defined as a complex containing SMN and Gemin2 that may form the stable core
      of the larger SMN complex. GEMIN5 is a peripheral, readily dissociable subunit rather than part
      of that stable core (PMID:17178713), so SMN complex (GO:0032797) is the more accurate description
      of its membership. The curator read the full text of PMID:19377484, which is abstract-only here,
      so the row is not removed, but it is not core.
    supported_by:
    - reference_id: PMID:17178713
      supporting_text: Finally, we show that the peripheral component Gemin5 contributes an essential
        activity to the SMN complex
    - reference_id: PMID:19377484
      supporting_text: The entire WD repeat domain, comprising 13 WD motifs, is both necessary and sufficient
        for sequence-specific, high-affinity binding of Gemin5 to its RNA targets.
