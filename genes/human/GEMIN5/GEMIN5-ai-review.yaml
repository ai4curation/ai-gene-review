- term:
    id: GO:0000387
    label: spliceosomal snRNP assembly
  evidence_type: EXP
  original_reference_id: PMID:12067652
  qualifier: involved_in
  review:
    summary: GEMIN5 is the snRNA-selecting subunit of the SMN complex and directly participates in spliceosomal
      snRNP (Sm core) assembly.
    action: ACCEPT
    reason: 'GEMIN5 does part of the work of Sm core assembly: it recognizes the Sm site, adjacent 3''
      stem-loop and cap of pre-snRNAs and delivers them to the SMN complex, which then closes the Sm ring
      on the RNA (PMID:16857593, PMID:20513430, PMID:18984161). GEMIN5 depletion reduces snRNA binding
      by the SMN complex and Sm core assembly, and patient GEMIN5 variants reduce in vitro snRNP assembly
      (PMID:33963192). This is the best-established process for the gene. The cited source is a review
      of the SMN complex, consistent with the primary data cited here.'
    supported_by:
    - reference_id: PMID:16857593
      supporting_text: Gemin5 binds directly and specifically to the unique features, including the Sm
        site, of snRNAs.
    - reference_id: PMID:16857593
      supporting_text: Reduction of Gemin5 results in reduced capacity of the SMN complex to bind snRNAs
        and to assemble Sm cores.
    - reference_id: PMID:20513430
      supporting_text: highlighting Gemin5's function in delivering pre-snRNAs as substrates for Sm core
        assembly and processing
    - reference_id: PMID:33963192
      supporting_text: suggesting that loss of GEMIN5 in Leu1068Pro and His913Arg neurons leads to disruption
        of snRNP assembly formation
