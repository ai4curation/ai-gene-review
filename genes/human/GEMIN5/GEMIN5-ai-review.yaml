- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11714716
  qualifier: enables
  supporting_entities:
  - UniProtKB:O14893
  review:
    summary: Interaction with GEMIN2 reflects GEMIN5's place in the SMN snRNP-assembly machinery; generic
      protein binding is uninformative.
    action: REMOVE
    reason: Under the GO:0005515 policy, bare protein binding is removed as uninformative; removal does
      not deny the reported interaction with GEMIN2. GEMIN5's associations with SMN, the Gemins and Sm
      proteins are captured by its SMN complex / SMN-Sm protein complex membership and spliceosomal snRNP
      assembly; no more informative molecular-function term (e.g. a specific adaptor activity) is established
      for these contacts.
    supported_by:
    - reference_id: PMID:11714716
      supporting_text: Gemin5 interacts with several of the snRNP core proteins including SmB, SmD1, SmD2,
        SmD3, and SmE, suggesting that it participates in the activities of the SMN complex in snRNP assembly.
    - reference_id: PMID:17178713
      supporting_text: Finally, we show that the peripheral component Gemin5 contributes an essential
        activity to the SMN complex
