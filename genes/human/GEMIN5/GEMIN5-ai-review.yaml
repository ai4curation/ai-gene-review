    label: Gemini of Cajal bodies
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0127
  review:
    summary: GEMIN5 colocalizes with SMN in gems.
    action: KEEP_AS_NON_CORE
    reason: Supported by immunolocalization (PMID:11714716) and the curated UniProt subcellular location.
      Gems are a nuclear SMN-complex compartment; GEMIN5's characterized assembly and translation work
      is cytoplasmic, so this location is non-core.
    supported_by:
    - reference_id: PMID:11714716
      supporting_text: Immunolocalization studies demonstrate that Gemin5 is found in the cytoplasm and
        in the nucleus, where it colocalizes with SMN in gems.
    - reference_id: file:human/GEMIN5/GEMIN5-uniprot.txt
      supporting_text: Found both in the nucleoplasm and in nuclear bodies called gems (Gemini of Cajal
        bodies) that are often in proximity to Cajal (coiled) bodies.
