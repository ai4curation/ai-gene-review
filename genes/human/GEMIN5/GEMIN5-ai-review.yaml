- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - FB:FBgn0250850
  - PANTHER:PTN005299808
  - UniProtKB:Q8TEQ6
  review:
    summary: GEMIN5 has a nuclear pool, in the nucleoplasm and in gems.
    action: MODIFY
    reason: Nucleus is correct but general. Immunolocalization places the nuclear pool of GEMIN5 in the
      nucleoplasm and in gems (Gemini of Cajal bodies), both annotated elsewhere for this gene; the IBA
      (node PTN005299808, seeded by Drosophila rig nuclear localization) is consistent. Most characterized
      GEMIN5 activity (snRNA capture, ribosome binding) is cytoplasmic, so the nuclear locations are non-core.
    proposed_replacement_terms:
    - id: GO:0005654
      label: nucleoplasm
    - id: GO:0097504
      label: Gemini of Cajal bodies
    supported_by:
    - reference_id: PMID:11714716
      supporting_text: Immunolocalization studies demonstrate that Gemin5 is found in the cytoplasm and
        in the nucleus, where it colocalizes with SMN in gems.
    - reference_id: file:human/GEMIN5/GEMIN5-uniprot.txt
      supporting_text: Found both in the nucleoplasm and in nuclear bodies called gems (Gemini of Cajal
        bodies) that are often in proximity to Cajal (coiled) bodies.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN005299808
        source_status: SUPPORTS_TRANSFER
        comment: Gemin5 family node (PTHR46362, single subfamily SF1); human GEMIN5 and Drosophila rig
          both have experimentally observed nuclear pools, so the transfer is sound; only the granularity
          (nucleus vs nucleoplasm/gems) is refined.
      - source_id: FB:FBgn0250850
        source_label: rig
        source_status: SUPPORTS_TRANSFER
        comment: Drosophila Gemin5 ortholog with IDA/EXP nuclear localization; same PANTHER subfamily
          as the target.
      - source_id: UniProtKB:Q8TEQ6
        source_label: GEMIN5
        source_status: SUPPORTS_TRANSFER
        comment: Target's own immunolocalization (nucleoplasm and gems) is among the descendant evidence
          used for the node.
      residue_claims_not_applicable: Localization granularity question, not a residue-level argument.
- term:
    id: GO:0005654
    label: nucleoplasm
  evidence_type: IDA
  original_reference_id: PMID:11714716
  qualifier: located_in
  review:
    summary: GEMIN5 has a diffuse nucleoplasmic pool in addition to gems.
    action: KEEP_AS_NON_CORE
    reason: Curated UniProt localization (from PMID:11714716) records GEMIN5 both in the nucleoplasm and
      in gems; nucleoplasm is the appropriate term for the diffuse nuclear pool. The nuclear pool is minor
      relative to the cytoplasmic pool where snRNA selection and ribosome binding occur, so this is non-core.
    supported_by:
    - reference_id: PMID:11714716
      supporting_text: Immunolocalization studies demonstrate that Gemin5 is found in the cytoplasm and
        in the nucleus, where it colocalizes with SMN in gems.
