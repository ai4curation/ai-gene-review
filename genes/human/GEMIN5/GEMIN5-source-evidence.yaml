  - path: reactome/R-HSA-191763.md
    bytes: 1023
    sha256: b8ffbd0f0aae0e14fb62031364368f505bfd651ee46b63919f5c793f764b206a
    blob: bd584b0484b6109580c4780d53efa36d33b7d47c
    mode: '100644'
    header:
      stable_id: R-HSA-191763
      display_name: snRNP:Snurportin complex formation
      species: Homo sapiens
      summary: The nuclear import signal has two parts; Cap hypermethylation triggers nuclear import via snurportin1
        binding and by receptor recognition of the Sm proteins. Snurportin1 (SPN) is an adaptor that links
        the assembled snRNP to the nuclear transport machinery, recruiting importin beta for nuclear import.
        The import receptor that recognizes the Sm proteins is not yet known.
  - path: reactome/R-HSA-191784.md
    bytes: 588
    sha256: d695ac8285d05c4b615cea2dc387303e3c2563a4baaed55095d1a9ba95eaef73
    blob: d12e2f0a066e0eef5ec383a99ea2cc912357f290
    mode: '100644'
    header:
      stable_id: R-HSA-191784
      display_name: snRNA Cap hypermethylation
      species: Homo sapiens
      summary: 'The snRNA:SMN:SM protein complex is engaged by a hypermethylase that hypermethylates the snRNA
        cap from

        m7G (7-methylguanosine) to m3G (2,2,7-trimethylguanosine).'
  - path: reactome/R-HSA-191786.md
    bytes: 1129
    sha256: a33377b7bb39ba057b87b3874f95da12011705a2c30bd3222456a1f9a4f6f4fc
    blob: edd24d71a685f2152791085c96b5c7b17f5d0dc9
    mode: '100644'
    header:
      stable_id: R-HSA-191786
      display_name: snRNP complex assembly
      species: Homo sapiens
      summary: To facilitate snRNP assembly, the SMN complex must bring together the Sm proteins and a Sm-site-containing
        snRNA. The SMN:Sm protein complex binds to the m7G capped snRNAs in the cytoplasm.<p>SARS-CoV-2 nonstructural
        protein 16 (nsp16) binds to the 5′ splice site recognition sequence of U1 snRNA and the branchpoint
        recognition site of U2 snRNA, both parts of the spliceosome, disrupting global mRNA splicing (Banerjee
        et al, 2020).
  - path: reactome/R-HSA-191790.md
    bytes: 1929
    sha256: 57656b7c54d8f22b07651412d7e6c016086025083ea7b90dfcd5e05926bc653a
    blob: d6e374a0ac11c06779d49bbac57f98817a5630b9
    mode: '100644'
    header:
      stable_id: R-HSA-191790
      display_name: Loading and methylation of Sm proteins onto SMN Complexes
      species: Homo sapiens
      summary: The survival of motor neurons (SMN) complex binds to Sm proteins and small nuclear RNAs (snRNAs)
        in the cytoplasm. Sm is part the SMN multiprotein complex that contains Gemins 2 – 7, including the
        DEAD-box RNA helicase Gemin3. The binding of the SMN complex to the snRNAs depends on the presence
        of specific, high-affinity (nanomolar) binding domains in the snRNAs. The SMN complex binds the Sm
        proteins through the Sm domains interaction with the Gemins, the TUDOR domain, and through unique arginine-
        and glycine-rich (RG) domains found in three of these, SmB, SmD1 and SmD3. The association with RG
        domains is strongly enhanced by the post-translational symmetric dimethylation of specific arginines
        in these domains, a process that is carried out by the methylosome (JBP1 or PRMT5) complex.
  - path: reactome/R-HSA-191830.md
    bytes: 1397
    sha256: 1c1aae4285e8418cd26ceba59c2e1c8d94953c7674e6ce680f64ebb49f04a02a
    blob: af0c6a52fc9efd2f5fcf3b7bafd86851e1d992ed
    mode: '100644'
    header:
      stable_id: R-HSA-191830
      display_name: snRNP nuclear import and release
      species: Homo sapiens
      summary: ' A properly assembled Sm core and the m3G cap structure are prerequisites for small nuclear
        ribonucleoprotein (snRNP) import into the nucleus. Once imported into the nucleus, the snRNPs are initially
        concentrated in Cajal bodies (CBs), where there is further processing of the snRNAs plus binding of
        additional proteins, from CRBs they transit to "speckles", from where they are engaged for pre-mRNA
        splicing. The SMN complexes in the nucleus are found throughout the nucleoplasm but are particularly
        concentrated in Gems, the "twins" of the snRNP-rich CBs.'
  - path: reactome/R-HSA-191859.md
    bytes: 1689
    sha256: aa4ce0839209dd0935063846d95e7b57378b15f11d33920c39198640adb68e43
    blob: a0090ae1291c124cf5d569d9e98d265bb5c0485b
    mode: '100644'
    header:
      stable_id: R-HSA-191859
      display_name: snRNP Assembly
      species: Homo sapiens
      summary: Small nuclear ribonucleoproteins (snRNPs) are crucial for pre-mRNA processing to mRNAs. Each
        snRNP contains a small nuclear RNA (snRNA) and an extremely stable core of seven Sm proteins. The U6
        snRNA differs from the other snRNAs; it binds seven Sm-like proteins and its assembly does not involve
        a cytoplasmic phase. The snRNP biogenesis pathway for all of the other snRNAs is complex, involving
        nuclear export of snRNA, Sm-core assembly in the cytoplasm and re-import of the mature snRNP. The assembly
        of the snRNA:Sm-core is carried out by the survival of motor neurons (SMN) complex. The SMN complex
        stringently scrutinizes RNAs for specific features that define them as snRNAs and binds the RNA-binding
        Sm proteins.
  - path: reactome/R-HSA-9754678.md
    bytes: 1714
    sha256: 230559a8b10cd2be5a3a62a84d7ab46c8bbb4439d7a0b4c13a33fb677d46ab43
    blob: 5d2fbf565c06d3b49682f9386e2a2ea7696bb4d1
    mode: '100644'
    header:
      stable_id: R-HSA-9754678
      display_name: SARS-CoV-2 modulates host translation machinery
      species: Homo sapiens
      summary: SARS-CoV-2 encodes several proteins that have been implicated in shutting off host expression
        (Banerjee AK et al. 2020; Finkel Y et al. 2021). This Reactome module describes SARS-CoV-2 nonstructural
        protein 1 (nsp1)-mediated shutdown of host protein translation by binding to the mRNA entrance channel
        on the 40S subunit (Banerjee AK et al. 2020), SARS-CoV-2 nsp16-mediated disruption of global mRNA splicing
        via binding to the 5′ splice site recognition sequence of U1 snRNA and the branchpoint recognition
        site of U2 snRNA, both parts of the spliceosome (Banerjee et al, 2020), and SARS-CoV-2 nsp8, nsp9-mediated
        suppression of protein integration into the cell membrane (Banerjee et al, 2020).
