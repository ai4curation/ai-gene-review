  label: Homo sapiens (Human)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for SIRT1. All five calls are lysine deacetylation terms, so
  the enzymology is unambiguous and correctly resolved to the NAD-dependent class - but the histone
  substrate specificity is wrong: the model offers H3K18 and H3K56, whereas this review and GOA record
  H4K16 and H3K9 as the preferential substrates. Rank 4 (H3K14) is annotated and correct. The pattern
  is the familiar one for enzyme families whose members differ by substrate residue. Assessment: 2
  correct not novel (CNN), 1 paralog incorrect (PLI).
