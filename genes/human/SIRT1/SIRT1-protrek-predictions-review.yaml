- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0097372
    label: NAD-dependent histone H3K18 deacetylase activity
  predicted_term_type: GO_MF
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 2 (score 17.98). H3K18 deacetylation is characteristic of SIRT7, a different class of sirtuin;
      rank 3 offers H3K56, which is SIRT6's best-known histone mark. SIRT1's preferential histone
      substrates are H4K16, H3K9 and H3K14. Naming two other sirtuins' marks above SIRT1's own is
      a within-family substrate error, and for chromatin enzymes the residue is the whole content
      of the annotation.
    supported_by:
    - reference_id: file:human/SIRT1/SIRT1-uniprot.txt
      supporting_text: >-
        NAD-dependent protein deacetylase sirtuin-1
