id: Q9NR81
gene_symbol: ARHGEF3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARHGEF3 (XPLN) is a 526-residue cytoplasmic Rho guanine nucleotide exchange factor related
  to NET1, with a DH/PH catalytic module. It activates RhoA and RhoB but not RhoC (selectivity set by
  a single residue in RhoC), RhoG, Rac1 or Cdc42, and drives Rho kinase-dependent stress fibres and focal
  adhesions. Independently of its GEF activity, its N-terminal 125 residues bind mTORC2 and inhibit its
  kinase activity toward Akt, making XPLN an endogenous mTORC2 inhibitor that restrains myoblast differentiation.
  Through RhoA it supports transferrin uptake in erythroid cells, and its loss in mice enhances muscle
  regeneration through autophagy in a GEF-dependent manner.
