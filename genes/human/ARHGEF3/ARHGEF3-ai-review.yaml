- term:
    id: GO:0004860
    label: protein kinase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:24043828
  qualifier: enables
  review:
    summary: Protein kinase inhibitor activity (NEW, IDA). Purified XPLN inhibits mTORC2 kinase activity
      toward Akt in vitro without affecting mTORC1. An N-terminal 125-residue fragment is necessary and
      sufficient, independent of GEF activity. DEPTOR, the other endogenous mTOR complex inhibitor, carries
      this term.
    action: NEW
    reason: '[PMID:24043828 "In vitro, purified XPLN inhibits mTORC2 kinase activity toward Akt without
      affecting mTORC1 activity."] [PMID:24043828 "Interestingly, the GEF activity of XPLN is dispensable
