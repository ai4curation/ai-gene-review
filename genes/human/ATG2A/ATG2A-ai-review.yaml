- term:
    id: GO:0032266
    label: phosphatidylinositol-3-phosphate binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Direct ancestral PI3P-binding evidence supports retaining the molecular-function inference.
    action: ACCEPT
    reason: The PTN000324023 IBD is seeded by yeast ATG2. QuickGO traces its IDA to PMID:27498190, which
      directly shows phosphoinositide binding by an isolated Atg2 APT1-containing region, especially PI3P.
      Human ATG2A membrane recruitment is enhanced by WIPI proteins (PMID:31271352), but an adaptor-mediated
      recruitment route does not demonstrate loss of ATG2 lipid binding. Retain the family inference with
      the distinction between direct donor binding and human membrane-recruitment assays explicit.
    additional_reference_ids:
    - PMID:31271352
    - PMID:32483132
    supported_by:
    - reference_id: PMID:27498190
      supporting_text: 'this domain is able

        to bind phosphatidylinositol phosphates, especially PI3P'
    - reference_id: PMID:31271352
      supporting_text: WIPI4 and ATG2A cooperatively associate with PI3P-containing membranes
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000324023
        source_label: PTN000324023
        source_status: SUPPORTS_TRANSFER
        comment: Yeast ATG2 has direct IDA evidence from its isolated lipid-binding region (PMID:27498190);
          WIPI-dependent human recruitment is not a negative binding experiment.
- term:
