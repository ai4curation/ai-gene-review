- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Retain the selective-autophagy context for conserved membrane-supply machinery.
    action: KEEP_AS_NON_CORE
    reason: Participation in autophagy of mitochondrion does not require ATG2A to recognize the cargo
      or have a pathway-exclusive function. ATG2A performs lipid-transfer and membrane-tethering work
      during phagophore expansion, rather than merely being a consumed substrate. The PAINT assertion
      at PTN000324023 is consistent with this conserved contribution; the previous demand for ATG2A-specific
      cargo selection was not a valid reason to replace it with a generic process. Retain as a context
      of the core machinery without claiming a direct human cargo-recognition assay.
    additional_reference_ids:
    - PMID:30952800
    - PMID:31412244
    supported_by:
    - reference_id: PMID:30952800
      supporting_text: ATG2A can bind tens of glycerophospholipids at once and transfers lipids robustly
        in vitro
    propagation_review:
