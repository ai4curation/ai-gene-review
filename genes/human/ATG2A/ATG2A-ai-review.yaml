id: Q2TAZ0
gene_symbol: ATG2A
product_type: PROTEIN
status: COMPLETE
tags:
- proteostasis
- pn
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATG2A is a large lipid-transfer protein that bridges donor membranes and the phagophore
  during autophagosome biogenesis. It binds and transfers glycerophospholipids, cooperates with WIPI/Atg18-family
  phosphoinositide effectors and ATG9A, and supplies membrane for phagophore expansion. Characterized
  donor contacts include the endoplasmic reticulum and ANKFY1-dependent endosome-phagophore contacts.
  ATG2A also associates with lipid droplets and ER-mitochondria contact sites.
