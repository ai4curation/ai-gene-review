      source_entities:
      - source_id: PANTHER:PTN000324023
        source_label: PTN000324023
        source_status: SUPPORTS_TRANSFER
        comment: The cached IBD places selective-autophagy participation on the ATG2 ancestor. General
          lipid-supply work can be used by multiple cargo pathways; absence of exclusive cargo recognition
