proposed_new_terms:
- proposed_name: phagophore rim
  proposed_definition: The open edge of a phagophore at which its two apposed membrane sheets are
    joined, characterised by a dilated intermembrane lumen and by a distinct set of resident proteins,
    and which is sealed by membrane abscission at phagophore closure.
  justification: 'Cryo-electron tomography shows the intermembrane lumen is dilated specifically at
    the rim, and the rim is where the phagophore contacts the ER. The compartment is defined by residents,
    not only by shape - ATG2 with the Atg18/WIPI propellers, and Atg24/Snx4 with Atg20 or Snx41, are
    rim-localised. GO already models the analogous structure for an expanding cup-shaped membrane
    as GO:0097203 phagocytic cup lip. An alternative label, "phagophore edge", follows GO''s dominant
    naming for this pattern. See GO issue #29437 (recommendation R7).'
  proposed_parent:
    id: GO:0061908
    label: phagophore
- proposed_name: endoplasmic reticulum-phagophore membrane contact site
  proposed_definition: A zone of apposition between the endoplasmic reticulum membrane and the phagophore,
    bridged by ATG2-family lipid transfer proteins together with Atg18/WIPI-family PI3P effectors
    and the ATG9 scramblase, across which glycerophospholipids are delivered to support phagophore
    expansion.
  justification: 'GO models many other contact sites explicitly (GO:0044233, GO:0140268, GO:0120095
    vacuole-isolation membrane contact site) but has nothing for the phagophore-ER apposition, which
    is the best-characterised of the phagophore''s contacts. See GO issue #29437 (recommendation R7)
    and modules/phagophore_organelle_contact_site.yaml.'
  proposed_parent:
    id: GO:0044232
    label: organelle membrane contact site
suggested_questions:
- question: How is the direct PI3P-binding activity of the yeast Atg2 APT1 region conserved in human
    ATG2A, and how does it cooperate with WIPI- and ANKFY1-mediated recruitment?
  experts:
  - GO autophagy editors
  - autophagy lipid-transfer experts
- question: Does human ATG2A directly participate in nuclear microautophagy, and which selective macroautophagy
    contexts use its conserved lipid-supply activity? Cargo recognition is not required for participation
    by this membrane-supply machinery.
  experts:
  - GO autophagy editors
  - Proteostasis Consortium ALP curators
- question: Should GO:0062079 be updated to explicitly mention mammalian ATG2-WIPI complexes, since
    the current definition names the Saccharomyces cerevisiae ATG2-ATG18 composition?
  experts:
  - GO cellular-component editors
  - ComplexPortal curators
- question: What determines use of ER versus ANKFY1-dependent endosomal lipid donors by ATG2A during
    phagophore expansion?
  experts:
  - GO autophagy editors
  - autophagy membrane-contact-site experts
- question: Does human ATG2A (as opposed to ATG2B) have a direct, LIR/ATG8-dependent role in non-canonical
    autophagy (CASM) and lysosome repair upon lysosomal damage, distinct from its WIPI4-dependent
    canonical phagophore-expansion function?
  experts:
  - GO autophagy editors
  - lysosome biology experts
suggested_experiments:
- experiment_type: Selective-autophagy separation-of-function rescue
  description: >-
    Rescue ATG2A/ATG2B double-knockout human cells with ATG2A variants that selectively disrupt
    WIPI binding, TOM40/MAM targeting, or ATG9A association, then quantify mitophagy, pexophagy,
    ER-phagy, and glycophagy reporters alongside bulk autophagic flux.
  hypothesis: >-
    ATG2A is required for selective-autophagy reporter completion primarily through its general
    phagophore-expansion function, not through cargo-specific recognition.
- experiment_type: Endogenous ATG2-WIPI complex composition assay
  description: >-
    Use starvation time courses with endogenous tagging or proximity labeling of ATG2A, WIPI1/2/3/4,
    and ATG9A, followed by quantitative proteomics and imaging at ER-phagophore contact sites.
  hypothesis: >-
    Human ATG2A participates in condition- and stage-specific ATG2-WIPI/Atg18 complexes whose
    component composition explains the PN-projected ATG2-ATG18 complex annotation.
