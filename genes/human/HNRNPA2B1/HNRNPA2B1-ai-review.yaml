- term:
    id: GO:1990247
    label: N6-methyladenosine-containing RNA reader activity
  evidence_type: IDA
  original_reference_id: PMID:26321680
  qualifier: enables
  review:
    summary: m6A reader activity, from Alarcon et al. 2015 (PMID:26321680). The GO definition requires
      a protein adaptor that 'recognizes and binds' m6A-modified RNA; two independent studies find
      that HNRNPA2B1 binds such RNA without recognizing the methyl mark.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'GOA does carry an m6A-reader term for this gene, so there is a real annotation to adjudicate.
      The underlying observation is sound - HNRNPA2B1 binds m6A-bearing transcripts in vivo and in
      vitro, and its CLIP footprint overlaps the m6A consensus - but the inference from overlap to
      ''reader'' does not survive direct affinity measurement, and this was already flagged in 2018,
      not only in 2026. Wu et al. 2018 (PMID:29379020) solved crystal structures of the tandem RRMs
      on several RNAs, found sequence-specific recognition of AGG by RRM1 and UAG by RRM2, and concluded
      the protein acts through an ''m6A switch'' rather than as a direct reader. Park et al. 2026
      (PMID:41662154) combined MD simulation with microscale thermophoresis on the RRM1-RRM2 construct:
      with m6A placed in a GGACU motif between the two domains, affinity is nearly identical to and
      marginally worse than the unmodified sequence, and binding energy is dominated by the flanking
      AGG/UAG motifs rather than by the methylated adenine. The GGAC consensus written by METTL3
      overlaps the AGG/UAG motifs HNRNPA2B1 prefers, which is a sufficient explanation for the CLIP
      overlap without any methyl-specific recognition. MARK_AS_OVER_ANNOTATED rather than REMOVE:
      this is an IDA whose full experimental basis I have not read, HNRNPA2B1 genuinely does bind
      m6A-containing RNA and does mediate m6A-dependent effects on splicing and pri-miRNA processing,
      and the 2026 measurements used an isolated RRM1-RRM2 fusion rather than full-length protein
      with its low-complexity domain. What is over-stated is the selectivity that the word ''reader''
      asserts.'
    supported_by:
    - reference_id: PMID:41662154
      supporting_text: the binding affinity is nearly identical and slightly less favourable to the
        unmodified sequence
    - reference_id: PMID:41662154
      supporting_text: Our study suggests that HNRNPA2B1 is not a (selective) reader but has high
        affinity for m6A in a sequence-dependent manner.
    - reference_id: PMID:41662154
      supporting_text: This can be attributed to the strong interactions conferred by AGG and UAG
        motifs rather than adenine or m6A in the GGACU motif
    - reference_id: PMID:29379020
      supporting_text: elucidating specific recognitions of AGG and UAG motifs by RRM1 and RRM2 domains,
        respectively
    - reference_id: PMID:26321680
      supporting_text: We find that the RNA-binding protein HNRNPA2B1 binds m(6)A-bearing RNAs in
        vivo and in vitro and its biochemical footprint matches the m(6)A consensus motif.
