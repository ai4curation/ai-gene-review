id: P22626
gene_symbol: HNRNPA2B1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Heterogeneous nuclear ribonucleoprotein A2/B1 is an abundant, broadly expressed RNA-binding
  protein of the hnRNP A/B family. It has two N-terminal RNA recognition motifs and a C-terminal
  glycine-rich low-complexity domain, and the B1 and A2 isoforms differ by a 12-residue N-terminal
  insert. The tandem RRMs bind RNA in a sequence-specific way, with RRM1 reading an AGG motif and
  RRM2 a UAG motif; the protein associates with nascent pre-mRNA and packages it into hnRNP particles,
  is a component of the spliceosome including the catalytic step 2 complex, and influences splice-site
  selection. Through the same sequence preference it recognises the A2 response element, a 21-nucleotide
  motif in the 3' untranslated region of myelin basic protein mRNA and other localised transcripts,
  and escorts those mRNAs from the nucleus to the cytoplasm in oligodendrocytes and neurons; HIV-1
  genomic RNA carries the same element and is trafficked by the same route. It also binds primary
  microRNAs and promotes their processing by enhancing DGCR8 recruitment, and, when sumoylated, sorts
  specific microRNAs into exosomes. A second nucleic-acid-binding activity recognises single-stranded
  G-rich telomeric DNA, whose repeat matches the same consensus as the A2RE. The low-complexity domain
  drives liquid-liquid phase separation and assembly of RNA-processing granules; it is disordered
  both as a monomer and within the condensed phase, is regulated by arginine methylation, and contains
  a steric-zipper motif. Mutations that strengthen that motif convert condensation into self-seeding
  fibril formation and cause multisystem proteinopathy - inclusion body myopathy with Paget disease
  of bone and frontotemporal dementia, and amyotrophic lateral sclerosis - while frameshift variants
  in the same region cause oculopharyngeal muscular dystrophy. Two further roles are unsettled. The
  protein binds N6-methyladenosine-containing transcripts and mediates m6A-dependent effects on splicing
  and pri-miRNA processing, but direct affinity measurements find binding to methylated and unmethylated
  GGACU essentially equal, with binding energy supplied by the flanking AGG and UAG motifs, so whether
  it recognises the methyl mark itself or responds to an m6A-induced change in RNA structure is disputed.
  Separately, nuclear HNRNPA2B1 has been reported to act as a sensor of viral DNA that homodimerises,
  is demethylated at Arg226 by JMJD6, translocates to the cytoplasm and activates TBK1-IRF3 signalling
  to induce type I interferon; this role has been built upon by subsequent work but has not been
  independently re-tested.
