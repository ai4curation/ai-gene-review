    supported_by: &id003
    - reference_id: PMID:15659580
      supporting_text: Both the hnRNP A2-binding cis-acting element for the cytoplasmic RNA trafficking
        element, A2RE, and the ssDNA telomere repeat match a consensus sequence for binding to a
        second sequence-specific site identified by mutational analysis.
