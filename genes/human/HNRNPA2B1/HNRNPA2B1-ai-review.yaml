  qualifier: located_in
  review:
    summary: Nuclear localisation, the principal site of hnRNP particle assembly and splicing.
    action: ACCEPT
    reason: 'Correct and heavily supported. Worth flagging what GOA has and has not taken from one
      of these sources: PMID:31320558 (Wang, Wen & Cao, Science 2019) is the paper proposing hnRNPA2B1
