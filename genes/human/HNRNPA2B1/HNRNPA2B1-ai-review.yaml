existing_annotations:
- term:
    id: GO:0000398
    label: mRNA splicing, via spliceosome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: mRNA splicing via the spliceosome. HNRNPA2B1 binds intronic sequence and modulates splice-site
      choice.
    action: ACCEPT
    reason: Core biological process, supported by spliceosome composition, curator inference from
      those studies, and a loss-of-function experiment. Note that the IMP source (PMID:26321680)
      framed the splicing changes as m6A-dependent; the splicing role itself is independent of that
      framing and stands regardless of how the m6A-reader question resolves.
- term:
    id: GO:0003730
    label: mRNA 3'-UTR binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Binding to mRNA 3'-untranslated regions, notably the A2 response element (A2RE) of myelin
      basic protein mRNA.
    action: ACCEPT
    reason: 'Core and mechanistically specific: the A2RE is a 21-nucleotide 3'' UTR element, point
      mutations that abolish hnRNP A2 binding also abolish transport, and this is the basis of the
      mRNA-trafficking function.'
    supported_by: &id002
    - reference_id: PMID:10567417
      supporting_text: Point mutations of the A2RE11 that eliminated binding to hnRNP A2 also markedly
        reduced the ability of these oligoribonucleotides to support RNA transport.
- term:
    id: GO:0043047
    label: single-stranded telomeric DNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Single-stranded telomeric DNA binding.
    action: KEEP_AS_NON_CORE
    reason: A genuine second nucleic-acid-binding activity - the ssDNA telomere repeat matches the
      same consensus as the A2RE RNA element, so one sequence-specific site accommodates both - but
      peripheral to the hnRNP function that defines this protein, and demonstrated largely in rat
