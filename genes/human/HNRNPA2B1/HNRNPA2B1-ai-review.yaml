suggested_questions:
- question: Should HNRNPA2B1 retain GO:1990247 N6-methyladenosine-containing RNA reader activity?
    The term's definition requires a protein adaptor that recognizes m6A-modified RNA, but two independent
    studies - a 2018 crystallographic and biochemical analysis and a 2026 simulation-plus-thermophoresis
    study - find affinity for methylated GGACU that is equal to or marginally worse than for the
    unmodified sequence, with binding driven by the flanking AGG and UAG motifs. If the protein mediates
    m6A effects through an 'm6A switch' (a methylation-induced change in RNA structure that exposes
    its binding site) rather than by reading the mark, does GO need a distinct term for that indirect
    mode, so that 'reader' can be reserved for YTH-domain-style direct recognition?
  experts:
  - GO RNA-modification curators
  - Jiabin Ma
  - Samie Jaffrey
- question: Would the same conclusion hold for full-length HNRNPA2B1? The 2026 affinity measurements
    used an isolated RRM1-RRM2 fusion. The low-complexity domain drives phase separation and could
    plausibly contribute avidity or context effects that an isolated two-domain construct cannot
    show. A full-length comparison of methylated and unmethylated substrates, ideally in a condensate,
    would close the gap.
  experts:
  - Nicolas Fawzi
  - Lydia Contreras
- question: What should GO do about the nuclear DNA-sensor claim? UniProt states in its FUNCTION
    comment that HNRNPA2B1 senses viral DNA in the nucleus and activates TBK1-IRF3 signalling, citing
    PMID:31320558, and later papers build on that role. GOA cites the same paper only for nucleus
    and cytoplasm localisation and carries no DNA-binding, pattern-recognition or interferon-production
    annotation for this gene. Is that a deliberate curatorial hold pending independent replication,
    or an annotation gap? Either answer is worth recording explicitly, because the claim is widely
    cited.
  experts:
  - GO innate immunity curators
  - UniProt curators
- question: Are the telomeric DNA-binding annotations, which rest largely on rat brain hnRNP A2 and
    on sequence-similarity transfer, worth retaining for the human protein, and does GO:0032392 DNA
    geometric change overstate nuclease protection of a single-stranded repeat as a topological activity?
  experts:
  - GO telomere curators
suggested_experiments:
- hypothesis: HNRNPA2B1 does not discriminate m6A-modified from unmodified RNA; apparent m6A dependence
    in cells reflects an m6A-induced structural change that exposes AGG/UAG motifs.
  description: 'Measure binding of full-length HNRNPA2B1 (not the RRM1-RRM2 fusion) to a matched
    panel of transcripts in which the m6A site and the flanking AGG/UAG motifs are varied independently:
    methylated and unmethylated GGACU in an AGG/UAG context, and the same methylation states with
    the flanking motifs mutated. Pair equilibrium binding with structure probing (SHAPE or DMS) on
    the same RNAs to test whether methylation changes accessibility rather than affinity. A binding
    preference that tracks motif accessibility rather than methylation would confirm the switch model
    and settle the term.'
  experiment_type: quantitative binding plus RNA structure probing
- hypothesis: The m6A-dependent splicing and pri-miRNA processing effects attributed to HNRNPA2B1
    are mediated by RNA structural change, not by direct methyl recognition.
  description: Separate the two models in cells with RRM point mutants that abolish AGG or UAG binding
    without affecting folding (guided by the published crystal structures) and compare their effect
    on METTL3-dependent splicing and pri-miRNA processing with that of wild-type protein. If the
    motif-binding mutants phenocopy full loss of function while methylation is unchanged, the m6A
    dependence is indirect.
  experiment_type: structure-guided separation-of-function rescue
- hypothesis: The reported nuclear DNA-sensing activity of HNRNPA2B1 is reproducible and separable
    from its hnRNP function.
  description: 'Independently re-test the core claim in a second laboratory: HSV-1 or vaccinia infection
    in cells with HNRNPA2B1 knocked out and rescued with wild-type protein, with an Arg226 non-methylatable
    mutant, and with a dimerisation-defective mutant, reading out interferon induction, TBK1-IRF3
    activation and nucleocytoplasmic translocation. Include a construct carrying RRM mutations that
    abolish RNA binding, to ask whether the immune phenotype can be uncoupled from the splicing and
    transport functions. Independent replication is the precondition for GO annotating a molecular
    function here.'
  experiment_type: independent replication with separation-of-function mutants
