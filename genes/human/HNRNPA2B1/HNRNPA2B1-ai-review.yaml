    supporting_text: elucidating specific recognitions of AGG and UAG motifs by RRM1 and RRM2 domains,
      respectively
  in_complex:
    id: GO:0071013
    label: catalytic step 2 spliceosome
- description: 'Recognition of the A2 response element, a 21-nucleotide motif in the 3'' untranslated
    region of myelin basic protein mRNA and other localised transcripts, and escort of those mRNAs
    from the nucleus to the cytoplasm in oligodendrocytes and neurons. Binding and transport are
    coupled: point mutations that abolish binding abolish transport, and depleting the protein disrupts
    trafficking of injected MBP mRNA. HIV-1 genomic RNA carries the same element and is trafficked
    by the same activity.'
  molecular_function:
    id: GO:0003730
    label: mRNA 3'-UTR binding
  directly_involved_in:
  - id: GO:0051028
    label: mRNA transport
  - id: GO:0006406
    label: mRNA export from nucleus
