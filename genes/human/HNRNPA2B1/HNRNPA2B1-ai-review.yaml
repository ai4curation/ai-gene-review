- term:
    id: GO:0140693
    label: molecular condensate scaffold activity
  evidence_type: IDA
  original_reference_id: PMID:29358076
  qualifier: enables
  review:
    summary: 'Molecular condensate scaffold activity: the glycine-rich low-complexity domain drives
      liquid-liquid phase separation and assembly of RNA-processing granules.'
    action: ACCEPT
    reason: Core and uncontested. The LC domain is disordered as a monomer and stays largely disordered
      in the phase-separated state; disease mutations in it extend the aggregation-prone region and
      convert condensation into fibril formation, which is the molecular basis of multisystem proteinopathy.
      Arginine methylation of the same domain tunes phase separation.
    supported_by:
    - reference_id: PMID:29358076
      supporting_text: The hnRNPA2 low-complexity (LC) domain is compact and intrinsically disordered
        as a monomer, retaining predominant disorder in a liquid-liquid phase-separated form.
