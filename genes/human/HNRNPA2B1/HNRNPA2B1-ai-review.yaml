    label: nucleoplasm
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:10567417
    supporting_text: Point mutations of the A2RE11 that eliminated binding to hnRNP A2 also markedly
      reduced the ability of these oligoribonucleotides to support RNA transport.
  - reference_id: PMID:10567417
    supporting_text: Oligodendrocytes treated with antisense oligonucleotides directed against the
      translation start site of hnRNP A2 had reduced levels of this protein and disrupted transport
      of microinjected myelin basic protein RNA.
- description: 'Scaffolding of RNA-containing molecular condensates through the glycine-rich low-complexity
    domain. The domain is intrinsically disordered as a monomer and remains largely disordered within
    the phase-separated state, and arginine methylation tunes the arginine-mediated contacts that
    drive condensation. This activity is also where the protein''s pathology lives: a steric-zipper
    motif within the domain, strengthened by the multisystem-proteinopathy mutations, converts reversible
    condensation into self-seeding fibril formation.'
  molecular_function:
    id: GO:0140693
    label: molecular condensate scaffold activity
  locations:
  - id: GO:0005654
    label: nucleoplasm
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:29358076
    supporting_text: The hnRNPA2 low-complexity (LC) domain is compact and intrinsically disordered
      as a monomer, retaining predominant disorder in a liquid-liquid phase-separated form.
  - reference_id: PMID:23455423
    supporting_text: Wild-type hnRNPA2 (the most abundant isoform of hnRNPA2B1) and hnRNPA1 show
      an intrinsic tendency to assemble into self-seeding fibrils, which is exacerbated by the disease
      mutations.
- description: Binding of primary microRNA transcripts and promotion of their Microprocessor-dependent
