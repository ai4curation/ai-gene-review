- term:
    id: GO:0032392
    label: DNA geometric change
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: DNA geometric change, from a sequence-similarity transfer.
    action: MARK_AS_OVER_ANNOTATED
    reason: The term asserts an induced change in the twist or writhe of a DNA double helix. What
      the underlying observations show is that hnRNP A2 binds single-stranded DNA and protects the
      telomeric repeat from nuclease digestion. Single-stranded-nucleic-acid-binding proteins destabilise
      duplexes as a consequence of binding one strand, but that is not the same as carrying out a
      topological transformation, and no study assigns HNRNPA2B1 such an activity. The binding terms
      this gene already carries state the evidence accurately.
- term:
    id: GO:0070182
    label: DNA polymerase binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: DNA polymerase binding, from a sequence-similarity transfer (GO_REF:0000024).
    action: KEEP_AS_NON_CORE
    reason: 'Retained rather than removed - a curator made this transfer on explicit sequence-similarity
      judgment and I have not examined the source annotation - but it is the weakest annotation on
      this gene: no human experimental support, no partner named, and no mechanistic role in any
      of the established hnRNP functions. It should not be treated as part of the core function.'
