core_functions:
- description: Sequence-specific binding of nascent pre-mRNA through tandem RRM domains - RRM1 reading
    an AGG motif and RRM2 a UAG motif - packaging transcripts into hnRNP particles and modulating
    splice-site selection as a component of the spliceosome, including the catalytic step 2 complex.
    This is the activity from which the protein's name and most of its biology follow, and it is
    the same sequence preference that explains its apparent affinity for m6A consensus sites without
    requiring recognition of the methyl mark.
  molecular_function:
    id: GO:0097157
    label: pre-mRNA intronic binding
  directly_involved_in:
