id: Q04759
gene_symbol: PRKCQ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Protein kinase C theta (PKC-theta) is a novel-class PKC: a calcium-independent, diacylglycerol (DAG)- and phospholipid-activated
  serine/threonine protein kinase of the AGC family. It has an N-terminal C2-like domain that does not bind calcium, tandem
  DAG/phorbol-ester-binding C1 domains, a proline-rich V3 hinge and a C-terminal kinase domain. It is expressed mainly in
  T lymphocytes, platelets/megakaryocytes and skeletal muscle. In resting T cells PKC-theta is cytoplasmic. After TCR/CD28
  engagement it is recruited by DAG and by an Lck-SH3-mediated link to CD28 to lipid rafts and the central immunological synapse.
  There it phosphorylates the CARD11 linker to trigger CARD11-BCL10-MALT1 assembly and NF-kB activation, and phosphorylates
  SPAK for AP-1 activation. It also contributes to NFAT activation, IL-2 production and T cell survival, the latter through
  BAD phosphorylation and Bcl-xL induction. Its other substrates include CCDC88A/GIV (inhibiting its GEF activity), IRS1 (attenuating
  insulin signalling), HSF1, PKC-zeta and LRRK1. In mouse it is required for Th2 and Th17 responses and contributes to platelet
  signalling.'
