suggested_questions:
- question: Which PKC-theta substrates outside the CARD11 linker (SPAK, BAD, PKC-zeta, LRRK1, HSF1) are phosphorylated by
    endogenous PKC-theta in primary human T cells, as opposed to in vitro or on overexpression?
- question: Should GO represent the PKC-theta V3 PxxP-to-Lck-SH3 interaction as an adaptor-like activity of PKC-theta, or
    only as SH3 domain binding plus localisation?
- question: Is the HPA centriolar-satellite localisation of PRKCQ reproducible with independent antibodies, and does it have
    any functional basis?
suggested_experiments:
- hypothesis: PKC-theta directly phosphorylates the CARD11 linker in primary human T cells at the synapse.
  description: Use analogue-sensitive PKC-theta knock-in in primary human CD4+ T cells with thiophosphate labelling to identify
    direct substrates after TCR/CD28 stimulation, comparing with PKC-delta.
  experiment_type: Chemical-genetic substrate identification
