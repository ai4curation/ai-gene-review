- term:
    id: GO:0004699
    label: diacylglycerol-dependent, calcium-independent serine/threonine kinase activity
  evidence_type: EXP
  original_reference_id: PMID:16356856
  qualifier: enables
  review:
    summary: 'EXP from Matsumoto et al. 2005: PKC-theta phosphorylates CARMA1/CARD11 in vitro and in cells, an activity needed
      for TCR-induced NF-kB activation.'
    action: ACCEPT
    reason: This is the core activity. PKC-theta is a calcium-independent, DAG-activated Ser/Thr kinase, and its best-characterised
      physiological substrate is the CARD11 linker. Sommer et al. (PMID:16356855) showed that PKC-theta phosphorylates the
      same linker serines as PKC-beta. Calcium independence follows from the novel-PKC domain structure and was seen when
      the cloned cDNA was expressed.
    supported_by:
    - *id005
    - &id025
      reference_id: PMID:16356855
      supporting_text: both PKCbeta and PKCtheta phosphorylated identical serine residues (S564, S649, and S657) within this
        linker
    - *id006
