core_functions:
- description: DAG-activated, calcium-independent Ser/Thr kinase activity at the T cell immunological synapse. After TCR/CD28
    engagement PKC-theta is recruited to the plasma membrane and cSMAC and phosphorylates the CARD11 linker, triggering assembly
    of the CARD11-BCL10-MALT1 signalosome and NF-kB activation. It phosphorylates SPAK for AP-1 activation. The synapse recruitment
    depends on the PKC-theta-specific V3 PxxP motif.
  molecular_function:
    id: GO:0004699
    label: diacylglycerol-dependent, calcium-independent serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0050852
    label: T cell receptor signaling pathway
  substrates:
  - id: UniProtKB:Q9BXL7
    label: Caspase recruitment domain-containing protein 11
