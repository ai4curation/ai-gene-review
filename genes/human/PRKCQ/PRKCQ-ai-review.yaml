  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q02111
  - ensembl:ENSMUSP00000028118
  review:
    summary: IEA (Ensembl Compara from mouse) for membrane protein ectodomain proteolysis.
    action: MARK_AS_OVER_ANNOTATED
    reason: PKC activation can promote ADAM-mediated ectodomain shedding, and the mouse annotation presumably reflects such
      a study. PKC-theta is not a protease, and no direct PKC-theta substrate in the shedding machinery is established in
      the literature reviewed here. The process is at best a downstream effect of PKC signalling and is not a core activity
      of PRKCQ.
