  review:
    summary: Proposed new annotation. PKC-theta is the DAG-activated kinase of the TCR/CD28 signalosome. It phosphorylates
      the CARD11/CARMA1 linker, which converts CARD11 to its active conformer and recruits BCL10-MALT1, and it phosphorylates
      SPAK for the AP-1 branch.
    action: NEW
    reason: 'Participation test: PKC-theta does the work of a defined step in the pathway, the phosphorylation of CARD11 linker
      serines (PMID:16356856, PMID:16356855). That step is needed for TCR-induced NF-kB activation, so this is catalysis of
      a pathway step, not mere necessity. Comparator check: other signalling enzymes and scaffolds that do a step of the same
      pathway carry this term in human GOA (CARD11 Q9BXL7, BCL10 O95999, MALT1 Q9UDY8, ZAP70 P43403, LCK P06239; QuickGO,
      2026-10-21). Human PRKCQ currently has only regulation and outcome terms for this biology. The term is placed at the
      pathway level rather than as NF-kB-specific regulation, because PKC-theta also drives AP-1 through SPAK (PMID:14988727).'
    supported_by:
    - *id005
    - *id016
    - *id025
    - *id026
    - &id028
      reference_id: PMID:14988727
      supporting_text: Recombinant SPAK was phosphorylated on Ser-311 in its kinase domain by PKCtheta, but not by PKCalpha.
