- description: 'Sphingosine-1-phosphate sensor at the inner membrane. S1P produced in mitochondria by SPHK2 binds
    PHB2 with high affinity and specificity and does not bind PHB1, making this the one activity that distinguishes
    the two paralogs. The consequence is measurable on cytochrome-c oxidase: SPHK2 loss produces an aberrant COX
    species and sharply reduces the COX4I1-PHB2 interaction, and depleting either SPHK2 or PHB2 impairs respiration
    through cytochrome-c oxidase. GO has no sphingosine-1-phosphate binding term, so the sphingolipid-binding
    term is as precise as the ontology allows.'
