core_functions:
- description: 'Inner-membrane mitophagy receptor. A YQRL motif at residues 121-124, in a region of PHB2 facing
    the space between the inner and outer mitochondrial membranes, binds LC3-II directly once mitochondrial depolarisation
    and proteasome-dependent rupture of the outer membrane expose it, tethering the organelle to the forming autophagosome.
    The binding is the function, not a correlate: a Y121A/L124A mutant loses LC3 binding in vitro and in cells
    and fails to support mitophagy while still localising to mitochondria, and the same mutant leaves cristae
    morphology intact, so the receptor activity is separable from the scaffold activity below. The human experiments
    are Parkin- and depolarisation-driven (type 2 mitophagy), while the C. elegans requirement for paternal mitochondrial
    clearance is Parkin-independent, so the receptor operates in both settings. PHB2 is the inner-membrane counterpart
    of the outer-membrane receptors OPTN, CALCOCO2, BNIP3L and FUNDC1.'
