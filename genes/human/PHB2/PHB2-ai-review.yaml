- term:
    id: GO:1901224
    label: positive regulation of non-canonical NF-kappaB signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O35129
  - ensembl:ENSMUSP00000004375
  review:
    summary: The underlying mouse result is canonical NF-kappaB activation - IkappaB-alpha phosphorylation leading
      to p50/p65 - not the non-canonical pathway this term names.
    action: MODIFY
    reason: The mouse IDA that both the ISS and the IEA propagate (PMID:23241883) reports that Phb1/2 and the
      CD86 cytoplasmic domain are required for CD86-induced phosphorylation of IkappaB-alpha, which the authors
      had previously shown leads to NF-kappaB p50/p65 activation, and that Phb1/2 alone is required for PLC-gamma2
      and PKC-alpha/beta phosphorylation leading to p65 phosphorylation and nuclear translocation. IkappaB-alpha
      degradation and p50/p65 are the canonical pathway; the non-canonical pathway is NIK/IKK-alpha-driven p100-to-p52
      processing, which this paper does not assay. The claim is therefore right in substance and wrong in term
      choice, so the row is modified laterally to GO:0043123, and remains part of the non-core CD86/B-cell arm.
      UniProt's own summary of this work ('required to activate NF-kappa-B signaling pathway via phospholipase
      C and protein kinase C activation') does not specify a branch either.
    proposed_replacement_terms:
    - id: GO:0043123
      label: positive regulation of canonical NF-kappaB signal transduction
    additional_reference_ids:
    - PMID:23241883
    supported_by:
    - reference_id: PMID:23241883
      supporting_text: we also show that Phb1/2 and the CD86 cytoplasmic domain are required for the CD86-induced
        phosphorylation of IκBα, which we previously reported leads to NF-κB p50/p65 activation
    - reference_id: PMID:23241883
      supporting_text: Using a proteomics-based identification approach, we show that the tyrosine-containing
        transmembrane adaptor proteins prohibitin (Phb)1 and Phb2 bind to CD86.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:1901224
      corrected_value: GO:0043123
      corrected_label: positive regulation of canonical NF-kappaB signal transduction
      confidence: PROBABLE
      explanation: The human row is an ISS/IEA propagation of the mouse Phb2 IDA from PMID:23241883 (and the mouse
        row carries the same term). That paper's NF-kappaB readouts are IkappaB-alpha phosphorylation and p50/p65
        activation, i.e. the canonical pathway; it does not assay NIK/IKK-alpha-dependent p100 processing, which
        is what GO:1901224 names. The mouse IDA row should be re-pointed to GO:0043123, and the human propagations
        will follow. Confidence is PROBABLE rather than CONFIRMED because the claim rests on the abstract's description
        of the readouts; the full text could report a p100/p52 experiment the abstract omits.
