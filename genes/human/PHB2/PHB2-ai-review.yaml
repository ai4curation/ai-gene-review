- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IDA
  original_reference_id: PMID:28017329
  qualifier: involved_in
  review:
    summary: 'PHB2 is the inner-membrane mitophagy receptor: it binds LC3-II directly through a YQRL LIR at residues
      121-124 once the outer membrane is ruptured, and that binding is required for Parkin-driven mitophagy.'
    action: ACCEPT
    reason: Core function, established on this gene in this paper. Every human experiment behind this IDA is depolarisation-
      and Parkin-initiated (oligomycin/antimycin-treated HeLa/Parkin cells, Parkin-expressing Phb2flox/flox MEFs),
      with the receptor reachable only after proteasome-dependent outer-membrane rupture, so the row's own evidence
      is specifically GO:0061734 type 2 mitophagy. The term is nevertheless kept at GO:0000423 rather than refined,
      for two reasons. First, the same paper shows phb-2 is required for Parkin-independent paternal mitochondrial
      clearance in C. elegans, so narrowing the gene's mitophagy claim to type 2 would understate it, and GO:0061734
      is a descendant of a term the gene already carries - adding it would be redundancy rather than coverage.
      Second, the IEA row on the same term rests on the ortholog and cannot be narrowed, and rows sharing a term
      must be treated consistently. Whether the human and worm annotations should sit on different descendants
      of GO:0000423 is raised in suggested_questions instead.
    supported_by:
    - reference_id: PMID:28017329
      supporting_text: Here, we identify the inner mitochondrial membrane protein, prohibitin 2 (PHB2), as a crucial
        mitophagy receptor involved in targeting mitochondria for autophagic degradation.
    - reference_id: PMID:28017329
      supporting_text: Thus, PHB2 is essential for Parkin-mediated mitophagy.
    - reference_id: PMID:28017329
      supporting_text: PHB2 binds the autophagosomal membrane-associated protein LC3 through an LC3-interaction
        region (LIR) domain upon mitochondrial depolarization and proteasome-dependent outer membrane rupture.
    - reference_id: PMID:28017329
      supporting_text: Together, these data indicate that PHB2 functions in mitophagy via an interaction between
        its LIR domain and LC3, rather than indirectly as a result of other effects on mitochondrial structure
        or function.
