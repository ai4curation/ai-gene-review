suggested_questions:
- question: Should GO:0140580 mitochondrion autophagosome adaptor activity be annotated to PHB2? Its synonym is
    'mitophagy receptor' and its definition is the binding activity that brings a mitochondrial membrane and an
    autophagosome membrane together during mitophagy, which is precisely what the LIR evidence in PMID:28017329
    establishes. At present PHB2's LC3 binding is recorded in GOA only as a bare GO:0005515 IPI row with MAP1LC3B
    in WITH/FROM, while the outer-membrane receptor FUNDC1 already carries the MF term.
- question: Is there, or should there be, a molecular function for what the prohibitin ring does structurally?
    GO:0140378 protein complex scaffold activity fits PHB2 exactly - the heptad-repeat coiled-coil holds the complex
    together and PHB2 is an integral member - but the term has only two human annotations (CCDC6, CHIC2) and is
    used on no mitochondrial complex subunit, which looks like a convention rather than an oversight. Clarifying
    whether scaffold subunits of stable complexes are meant to carry it would settle a whole class of annotations,
    not just this one.
- question: Does PHB2 carry mitophagy terms beyond type 2? The human evidence is depolarisation- and Parkin-driven,
    but phb-2 is required for Parkin-independent paternal mitochondrial clearance in C. elegans. Should the worm
    annotation and the human annotation sit on different descendants of GO:0000423, and is a term needed for inner-membrane-receptor-mediated
    mitophagy as a mechanism distinct from the outer-membrane receptor route?
- question: Which prohibitin is the Chikungunya virus receptor? PMID:22997079 reports 'prohibitin (PHB)' and is
    annotated to both PHB1 and PHB2; the abstract does not resolve the paralog. The same question applies to several
    of the host-pathogen interactions on this entry, where the Phb1/Phb2 heterodimer was recovered rather than
    an individual protein.
- question: Is the CD86/B-cell arm correctly placed on the canonical NF-kappaB pathway? The mouse source (PMID:23241883)
    reports IkappaB-alpha phosphorylation and p50/p65 activation, but the propagated human rows carry GO:1901224
    for non-canonical signalling. Confirming whether p100-to-p52 processing was ever assayed would decide between
    GO:0043123 and GO:1901224 for both species.
suggested_experiments:
- hypothesis: A dedicated, ubiquitin-independent mechanism breaches or remodels the outer membrane to expose the
    PHB2 LIR during Parkin-independent mitophagy.
  description: In C. elegans zygotes, image the outer and inner membranes of sperm-derived mitochondria separately
    (outer-membrane and intermembrane-space reporters) alongside LGG-1/LGG-2 recruitment, and test candidate breaching
    activities - proteasome and p97/CDC-48 inhibition, loss of candidate pore or lipid-scramblase components -
    for their effect on LIR accessibility and on paternal mitochondrial clearance. Read out LIR dependence with
    a phb-2 YQRL-to-AQRA knock-in rather than knockdown, so scaffold loss is not confounded with receptor loss.
  experiment_type: Genetics and live imaging
- hypothesis: The PHB2 LIR is regulated, as the LIRs of FUNDC1 and BNIP3L are, rather than being constitutively
    competent and gated only by membrane access.
  description: Map phosphorylation and other modifications on the 115-130 region of endogenous PHB2 by targeted
    mass spectrometry in untreated cells and after depolarisation, and test phospho-mimetic and phospho-null substitutions
    adjacent to Y121 and L124 for LC3-II binding in vitro and for mitophagy rescue in Phb2-null MEFs reconstituted
    with PHB1.
  experiment_type: Proteomics and structure-function
- hypothesis: PHB2 contributes scaffold activity, not catalysis or signal transduction, to the processes that
    fail when it is lost (cardiolipin remodelling, RIG-I signalling, complex IV assembly).
  description: Reconstitute Phb2-null cells with PHB2 variants that separate the activities - the coiled-coil-disrupted
    HR mutant, the Y121A/L124A LIR mutant, and an S1P-binding-deficient mutant once the binding site is mapped
    - and score cardiolipin acyl-chain profiles, virus-induced IFN-beta production and MAVS-CLPB association,
    complex IV assembly by blue native PAGE, and mitophagy in parallel. A variant that separates any two of these
    outputs would show which are scaffold-dependent and which need a distinct PHB2 activity.
  experiment_type: Structure-function rescue panel
- hypothesis: The nuclear corepressor (REA) arm is a genuine function of endogenous PHB2 rather than an artefact
    of overexpression.
  description: In an ER-positive breast line, tag endogenous PHB2 and measure, without overexpression, estradiol-dependent
    nuclear accumulation, occupancy at ER target promoters by ChIP, and the effect of a PHB2 allele that cannot
    enter the nucleus on ER target-gene output - separating the nuclear effect from the mitochondrial consequences
    of reducing PHB2.
  experiment_type: Genome editing and ChIP
