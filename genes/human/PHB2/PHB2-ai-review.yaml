    reason: 'Core process. Losing PHB2 fragments mitochondria and destroys cristae architecture, and the prohibitin
      ring is the structure that holds the inner membrane organised - the function UniProt summarises as maintaining
      mitochondrial integrity in the inner membrane, required for mitochondrial morphogenesis. The term is kept
      rather than refined: the rows'' own evidence is loss of overall morphology and integrity, so a deeper term
      such as inner-membrane organisation or fission would assert more than the assays show. The IBA sits on a
      node whose descendants include experimentally annotated prohibitins in plants, yeast and nematodes, with
      the human gene among the WITH/FROM sources; the mitochondrion-organising role of the prohibitin ring is
      conserved across those lineages, so the node placement holds.'
