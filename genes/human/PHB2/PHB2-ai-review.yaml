- term:
    id: GO:0002639
    label: positive regulation of immunoglobulin production
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O35129
  - ensembl:ENSMUSP00000004375
  review:
    summary: Via the cell-surface prohibitin pair, PHB2 supports CD86-driven IgG1 production in primed B cells
      (shown for mouse Phb1/Phb2).
    action: KEEP_AS_NON_CORE
    reason: Real but peripheral. The mouse IDA this propagates from (PMID:23241883) shows Phb1/Phb2 acting as
      tyrosine-containing transmembrane adaptors for the CD86 cytoplasmic domain in CD40L/IL-4-primed B cells,
      where knocking Phb1/2 down lowers the CD86-induced rise in IgG1. That is a genuine plasma-membrane function
      of the prohibitin pair, but it is one cell type's signalling role, separate from the IMM scaffold and mitophagy-receptor
      functions that define the protein, so it is kept as non-core rather than accepted.
    additional_reference_ids:
    - PMID:23241883
    supported_by:
    - reference_id: PMID:23241883
      supporting_text: Using a proteomics-based identification approach, we show that the tyrosine-containing
        transmembrane adaptor proteins prohibitin (Phb)1 and Phb2 bind to CD86.
    - reference_id: PMID:23241883
      supporting_text: The CD86-induced increase in Oct-2 and IgG1 was less when either Phb1/2 expression was
        reduced by short hairpin RNA or the cytoplasmic domain of CD86 was truncated or mutated at serine/threonine
        protein kinase C phosphorylation sites, which did not affect Phb1/2 binding to CD86.
