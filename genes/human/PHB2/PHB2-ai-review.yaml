  supported_by:
  - reference_id: PMID:28017329
    supporting_text: Here, we identify the inner mitochondrial membrane protein, prohibitin 2 (PHB2), as a crucial
      mitophagy receptor involved in targeting mitochondria for autophagic degradation.
  - reference_id: PMID:28017329
    supporting_text: Thus, we conclude that amino acids 121–124 (YQRL) represent the PHB2 LIR domain.
  - reference_id: PMID:28017329
    supporting_text: Together, these data indicate that PHB2 functions in mitophagy via an interaction between
      its LIR domain and LC3, rather than indirectly as a result of other effects on mitochondrial structure or
      function.
  - reference_id: PMID:28017329
    supporting_text: PHB2 binds the autophagosomal membrane-associated protein LC3 through an LC3-interaction
      region (LIR) domain upon mitochondrial depolarization and proteasome-dependent outer membrane rupture.
  - reference_id: PMID:28017329
    supporting_text: Thus, sperm-derived phb-2 is essential for the proper degradation of paternal mitochondria.
  knowledge_gaps:
  - gap_statement: How the inner membrane, and with it the PHB2 LIR, becomes accessible to Atg8-family proteins
      during Parkin-independent mitophagy is unknown. In the Parkin-dependent case the route is proteasome-dependent
      outer-membrane rupture, but no equivalent mechanism has been identified for paternal mitochondrial clearance
      or other ubiquitin-independent mitophagy, where ubiquitination is not thought to be involved.
    boundary: 'Known: the LIR sequence and position, that the interaction requires outer-membrane rupture in Parkin-driven
      mitophagy, and that phb-2 is required in the worm. Unknown: what breaches or remodels the outer membrane
      in the Parkin-independent setting, and whether the LIR itself is regulated (no modification of the YQRL
      motif has been reported, unlike the phosphoswitches on FUNDC1 and BNIP3L).'
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: Determines whether PHB2 is a general mitophagy receptor downstream of any membrane-breaching
      event or whether a dedicated exposure mechanism exists per pathway, which in turn decides whether PHB2 should
      carry mitophagy terms beyond type 2.
    provenance:
    - reference_id: PMID:28017329
      supporting_text: It is not yet known how the IMM and its mitophagy receptor PHB2 become exposed during Parkin-independent
        mitophagy
- description: 'Scaffold of the inner-membrane prohibitin ring. PHB2 heterodimerises obligately with PHB1 - the
    two are always bound, with no free protein detectable - and its C-terminal heptad repeat, an antiparallel
    coiled-coil homodimer in the crystal, builds the resulting ring-shaped ~1 MDa supercomplex; disrupting the
    coiled-coil abolishes well-ordered complexes and the tubular mitochondrial network. The ring acts as a membrane
    platform rather than an enzyme: assembled with STOML2/SLP-2 into cardiolipin-enriched microdomains where electron-transport
    complexes form, it holds clients such as HAX1 and respiratory-chain subunits against proteolysis, is required
    for cristae morphogenesis and mitochondrial integrity, and with DNAJC19 sets the membrane context in which
    tafazzin remodels cardiolipin. GO:0140378 is this review''s own choice of molecular function: it fits the
    activity exactly but is essentially unused for complex subunits, so no new annotation is proposed from it.'
