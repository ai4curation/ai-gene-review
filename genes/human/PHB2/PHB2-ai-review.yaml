id: Q99623
gene_symbol: PHB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PHB2 (prohibitin-2, also known as BAP37, REA and ASURA) is a 299-residue single-span protein of
  the prohibitin (Band 7/SPFH) family. With its obligate partner PHB1 it assembles into a ring-shaped, roughly
  1 MDa supercomplex in the mitochondrial inner membrane; the two proteins are always bound to each other, and
  the C-terminal heptad-repeat coiled-coil, which crystallises as an antiparallel homodimer, is the element that
  builds the ring. The complex works as a membrane scaffold and chaperone-like platform: it sits in cardiolipin-enriched
  microdomains assembled with STOML2/SLP-2, holds respiratory-chain clients and HAX1 against proteolysis, supports
  cytochrome-c oxidase assembly and respiration, and is required for cristae morphogenesis and overall mitochondrial
  integrity. Together with DNAJC19 it sets the membrane context in which tafazzin remodels cardiolipin. Sphingosine-1-phosphate
  made in mitochondria by SPHK2 binds PHB2 specifically, and not PHB1, and tunes complex IV. Independently of
  this structural role, PHB2 is the inner membrane''s mitophagy receptor: a YQRL motif at residues 121-124, facing
  the intermembrane space, binds LC3-II directly once mitochondrial depolarisation and proteasome-dependent outer-membrane
  rupture expose it, and this binding is required for Parkin-driven mitophagy in mammalian cells and for the clearance
  of paternal mitochondria after fertilisation in C. elegans. Mutating the motif blocks mitophagy while leaving
  cristae morphology intact, so the receptor and scaffold activities are separable. Smaller pools of PHB2 act
  elsewhere: in the nucleus, where estrogen-receptor-dependent translocation produces a corepressor (REA) that
  represses liganded ER and sits in a ZNF703-DCAF7 assembly in the nuclear matrix; and at the cell surface of
  activated T cells and some tumour cells, where it serves as a CD86 signalling adaptor and as the IGFBP-6 receptor
  driving rhabdomyosarcoma migration. The prohibitin complex also scaffolds antiviral signalling, tethering CLPB
  to MAVS across the intermembrane space, and is exploited as a host factor by several viruses.'
