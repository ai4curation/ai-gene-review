    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: IDA
  original_reference_id: PMID:17008324
  qualifier: located_in
  review:
    summary: PHB2 is an inner-membrane protein; the outer-membrane row comes from a complex that spans a contact
      site.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The complex reported in this paper contains VDAC2 (outer membrane) together with ANT2 and PHB1 (inner
      membrane), i.e. it bridges the two membranes. Co-purification with an outer-membrane protein does not place
      PHB2 in the outer membrane, and every dedicated localisation study, the UniProt subcellular location and
      this review''s accepted GO:0005743 rows place it in the inner membrane. The mitophagy mechanism depends
      on that topology: PHB2''s LIR sits in the space between the inner and outer membranes and only becomes accessible
      to LC3 after the outer membrane ruptures, which would be unnecessary for an outer-membrane protein. Marked
      over-annotated rather than removed because the full text is not in the cache and the contact-site association
      it reports is real.'
    supported_by:
    - reference_id: PMID:17008324
      supporting_text: The mitochondrial complex of PHB2 consists of PHB1, voltage-dependent anion channel 2,
        adenine nucleotide translocator 2, and the anti-apoptotic Hax-1, which is a novel binding partner for
        PHB2.
    - reference_id: PMID:28017329
      supporting_text: This LIR domain lies within a region of PHB2 that is predicted to be exposed within the
        space between the IMM and OMM (Back et al., 2002).
    - reference_id: PMID:28017329
      supporting_text: The binding of PHB2, an IMM protein, to LC3-II during mitophagy suggested that OMM rupture
        was necessary for binding to occur.
