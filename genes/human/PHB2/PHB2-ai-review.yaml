- term:
    id: GO:0140374
    label: antiviral innate immune response
  evidence_type: IDA
  original_reference_id: PMID:31522117
  qualifier: involved_in
  review:
    summary: The prohibitin complex scaffolds the CLPB-MAVS link across the intermembrane space, and PHB2 loss
      attenuates virus-induced IFN-beta and IL-6 production.
    action: KEEP_AS_NON_CORE
    reason: 'Well supported but not a core function. Phb2-deleted MEFs mount a blunted IFN-beta and IL-6 response
      to Sendai virus, and the mechanism is scaffolding rather than signalling: the PHB complex binds CLPB through
      PHB2''s central coiled-coil, CLPB bridges the complex to MAVS across the intermembrane space with AKAP1
      and ATAD3A, and depleting the prohibitins abolishes the virus-induced MAVS-CLPB interaction. PHB2 contributes
      the platform; RIG-I, MAVS, IRF3 and the kinases do the signalling work. One of several processes that fail
      when the inner-membrane scaffold is lost, so it is kept as non-core.'
    supported_by:
    - reference_id: PMID:31522117
      supporting_text: We verified that Phb2flox/flox MEFs challenged with Sendai virus (SeV), a negative-stranded
        RNA virus of the Paramyxoviridae family, potently activated RIG-I-mediated signal transduction and the
        cells produced interferon β (IFN-β) and a proinflammatory cytokine interleukin-6, but the immune responses
        were attenuated when the Cre recombinase was expressed in the cells (Figure S3A).
    - reference_id: PMID:31522117
      supporting_text: Taken together, these results demonstrated that CLPB bridges PHB complexes (IMM) and MAVS
        (OMM) with the assistance of AKAP1 and ATAD3A at the IMS and invokes an immune response from the mitochondrial
        signalosome (Figure S5I).
