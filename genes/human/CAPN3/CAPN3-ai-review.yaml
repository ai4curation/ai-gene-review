  review:
    summary: CAPN3 makes a nonproteolytic contribution to muscle structural integrity.
    action: ACCEPT
    reason: GO:0008307 requires a contribution to muscle-fiber integrity, not exclusive load bearing
      or a completely resolved tether. PMID:21295580 explicitly contrasts sarcomere/thick-filament
      disorganization in null mice with preserved alignment in catalytically inactive C129S mice,
      and reports preserved triad morphology and calcium-release function with C129S. Together with
      CAPN3 binding and selective recruitment of aldolase A in PMID:18676612, this supports a physical
      organizing contribution rather than inferring structure only from dystrophy. Retain the existing
      ortholog-supported structural assignment. Its broad outcome overlaps the more informative adaptor
      mechanism summarized in the core; neither a direct CAPN3-RyR interface, a specific titin-to-triad
      bridge nor the withdrawn hexamer model is established.
