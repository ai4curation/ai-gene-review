core_functions:
- description: Catalyzes calcium-dependent endoproteolysis and self processing in the titin-associated
    muscle environment, supporting muscle-cell maintenance and adaptation. Substrate access and localization
    change with binding and the extent of autolysis; a complete physiological substrate repertoire
    is not established.
  molecular_function:
    id: GO:0004198
    label: calcium-dependent cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0006508
    label: proteolysis
  - id: GO:0046716
    label: muscle cell cellular homeostasis
  locations:
  - id: GO:0030016
    label: myofibril
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:9642272
    supporting_text: lose the proteolytic activity against a potential substrate, fodrin
  - reference_id: PMID:18310072
  - reference_id: PMID:20592470
  - reference_id: PMID:37298357
- description: Selectively binds aldolase A and promotes its recruitment into muscle protein complexes
    associated with calcium release. This broad adaptor function is supported mainly by mouse null-versus-C129S
    experiments and controlled recombinant binding. Direct RyR contact, a defined titin-to-triad
    bridge, exact stoichiometry and precise human subcompartment remain unresolved.
  molecular_function:
    id: GO:0060090
    label: molecular adaptor activity
  directly_involved_in:
  - id: GO:0051281
    label: positive regulation of release of sequestered calcium ion into cytosol
  - id: GO:0072657
    label: protein localization to membrane
  supported_by:
  - reference_id: PMID:18676612
  - reference_id: PMID:21295580
    supporting_text: calpain-3 functions as a nonenzymatic element for the Ca(2+) efflux machinery
suggested_questions:
- question: Which native human CAPN3 substrates and cleavage events directly account for muscle maintenance
    and exercise adaptation, distinct from overexpression or extract-based candidates?
- question: Which direct partners mediate the nonproteolytic SR/triad role, and does CAPN3 assemble
    a new complex, maintain an existing one, or both?
- question: Can sodium binding be measured directly under controlled calcium and physiological potassium
    conditions, separately from autolysis and nonspecific ionic perturbation?
- question: How do the five curated alternative products differ in tissue distribution, calcium regulation,
    localization and substrate access, especially relative to IS1-deleted experimental constructs?
- question: Does CAPN3 regulate adult human satellite-cell reserve-pool renewal, and how is that
    distinguished from activation out of quiescence?
- question: Which exact donor experiments support the unresolved plasma-membrane, Z-disc, T-tubule,
    myofibril-assembly and muscle-development annotations listed in the dated donor-row audit in
    CAPN3-notes.md?
