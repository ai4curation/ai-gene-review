id: P20807
gene_symbol: CAPN3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Calpain-3 (CAPN3/p94) is an intracellular calcium-dependent cysteine endopeptidase enriched
  in skeletal muscle. It binds titin and undergoes rapid, regulated autolysis, coupling proteolytic
  activity and changing sarcomeric localization to muscle maintenance and adaptation. Mouse genetic
  and biochemical studies also support a nonproteolytic contribution to the organization of sarcoplasmic-reticulum-associated
  proteins and calcium release. Other experimental contexts implicate CAPN3 in myoblast reserve-cell
  formation, selective signaling-protein turnover, and Def/UTP25-associated nucleolar p53 turnover.
  These activities depend on cell context and the CAPN3 construct or isoform examined. Pathogenic
  human CAPN3 variants cause calpainopathy, including recessive and dominant limb-girdle muscular
  dystrophy.
