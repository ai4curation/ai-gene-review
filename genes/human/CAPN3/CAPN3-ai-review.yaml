  - ensembl:ENSMUSP00000028749
  review:
    summary: Selective binding and nonproteolytic recruitment support a broad molecular-adaptor role
      in muscle protein complexes.
    action: ACCEPT
    reason: GO:0060090 describes selective noncovalent interactions that bring molecules together
      for coordinated function; it does not require a solved ternary structure. PMID:18676612 combines
      controlled recombinant CAPN3-C129S/aldolase-A binding with selective loss of triad-associated
      aldolase A in null mouse muscle, while total aldolase and triad GAPDH are retained. PMID:21295580
      finds recruitment and calcium release preserved with catalytically inactive CAPN3. Together
      these support CAPN3-mediated recruitment of aldolase A into a functional protein assembly and
      the existing ortholog transfer. CAPN3-RyR pull-down/co-IP can be indirect, so neither a direct
      RyR interface, simultaneous binary contacts, fixed stoichiometry nor a specific titin-to-triad
      bridge is asserted.
