- term:
    id: GO:0071472
    label: cellular response to salt stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q64691
  - ensembl:ENSMUSP00000028749
  review:
    summary: Ionic effects on CAPN3 autolysis do not adequately establish a cellular response to
      environmental salt stress.
    action: MARK_AS_OVER_ANNOTATED
    reason: The official term is a cellular response to altered environmental salt concentration,
      under osmotic-stress responses. PMID:20460380 measured autolysis in extracts and after monensin
      or ouabain treatment of mouse myotubes; those drugs perturb ion gradients and also increase
      intracellular calcium. PMID:37298357 shows that the sodium effect in rat muscle disappears
      with physiological potassium and is reproduced by potassium-free Tris conditions, whereas human
      CAPN3 responds to calcium. Calcium-mediated activation could occur downstream of an ionic insult,
      but these assays do not establish that CAPN3 performs a salt-stress response. Transferring
      the disputed sodium-enzyme interpretation as this specific process is over-annotation. This
      does not deny the reported autolysis or exclude nonphysiological sodium binding.
    supported_by:
    - reference_id: PMID:20460380
    - reference_id: PMID:37298357
