id: Q7Z3Z4
gene_symbol: PIWIL4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PIWIL4 (HIWI2) is a PIWI-clade Argonaute protein that in the mammalian male germline acts
  as the nuclear effector of the piRNA pathway. It is loaded with secondary, predominantly transposon-antisense
  piRNAs generated by PIWIL2-catalysed slicing in cytoplasmic nuage (piP-bodies), then enters the nucleus
  of fetal prospermatogonia, where it engages nascent transposon transcripts and directs de novo DNA methylation
  and heterochromatin formation at LINE1 and related elements. Unlike PIWIL1 and PIWIL2, its slicer activity
  is dispensable. Loss of the mouse ortholog Miwi2 causes transposon derepression and male sterility.
  PIWIL4 is also broadly expressed in somatic and cancer cells, where it is largely cytoplasmic and binds
  tRNA-derived small RNAs.
