  - reference_id: PMID:22467853
    supporting_text: OST48 and DAD1 are required for the assembly of both STT3A- and
      STT3B-containing OST complexes
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: >-
      InterPro2GO mapping of the DDOST/OST48 domain signature supplies the IEA annotation
      of DDOST to protein N-linked glycosylation (GO:0006487), which is consistent with the
      experimentally established role of OST48 as an OST subunit.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs
    by curator judgment of sequence similarity
  findings:
  - statement: >-
      Curator sequence-similarity transfer from experimentally characterized orthologs
      supplies the ISS annotations of DDOST to endoplasmic reticulum membrane (GO:0005789),
      oligosaccharyltransferase complex (GO:0008250) and glycoprotein biosynthetic process
      (GO:0009101); the first two are well corroborated by direct human evidence, the third
      is a broad parent of protein N-linked glycosylation.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PAINT phylogenetic inference places DDOST in the OST48/Wbp1 family clade whose members
      are OST subunits, supporting the IBA annotations to oligosaccharyltransferase complex
      (GO:0008250) and protein N-linked glycosylation (GO:0006487).
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings:
  - statement: >-
      Curated immunofluorescence data (Human Protein Atlas) support the IDA annotation of
      DDOST to endoplasmic reticulum (GO:0005783), agreeing with the UniProt ER-membrane
      subcellular location.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: >-
      An ARBA machine-learning rule supplies the IEA annotation of DDOST to the generic
      membrane term (GO:0016020); this is correct but far less informative than the
      ER-membrane localization supported by direct evidence.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      Combined automated IEA pipelines supply the annotation of DDOST to endoplasmic
      reticulum membrane (GO:0005789), redundant with but consistent with the ISS, NAS and
      TAS evidence for the same location.
- id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  full_text_unavailable: true
  findings:
  - statement: >-
      DDOST was detected in a high-throughput membrane-proteome survey of the NK-like YTS
      cell line; the study assigns no function and supports only generic membrane
      association.
    supporting_text: >-
      Mass spectrometric analysis identified 1843 proteins with high confidence scores. On
      the basis of the presence of transmembrane regions or evidence of posttranslational
      modifications and prediction algorithms, approximately 40% of the identified proteins
      were predicted as plausible membrane proteins.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: High-throughput NK-cell membrane proteome; supports only a generic
      membrane co-identification of DDOST, not a specific function or location.
- id: PMID:21903422
  title: Mapping a dynamic innate immunity protein interaction network regulating
    type I interferon production.
  findings:
  - statement: >-
      DDOST was identified in a large-scale affinity-purification map of innate-immunity
      protein complexes (the HI5 interactome), the source of its bare protein-binding IPI
      annotation.
    supporting_text: >-
      Fifty-eight baits were associated with 260 interacting proteins forming a human innate
      immunity interactome for type I interferon (HI5) of 401 unique interactions
    reference_section_type: ABSTRACT
  - statement: >-
      The DDOST-STING1 association falls within a set of shared STING1/UNC93B1 partners that
      are predominantly ER membrane proteins of the protein-translocation machinery,
      consistent with co-residence in the ER rather than a role in interferon signalling.
    supporting_text: >-
      STING and UNC93B1 interacted with 10 common binding partners and most of them are ER
      membrane proteins involved in protein translocation.
    reference_section_type: RESULTS
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Innate-immunity interactome (HI5); DDOST appears as a STING1/UNC93B1-associated
      ER membrane protein. Verified via UniProt IntAct record (P39656 with STING1
      Q86WV6). Supports a bare protein-binding IPI, not a core DDOST function.
- id: PMID:22467853
  title: The oligosaccharyltransferase subunits OST48, DAD1 and KCP2 function as ubiquitous
    and selective modulators of mammalian N-glycosylation.
  full_text_unavailable: true
  findings:
  - statement: >-
      siRNA depletion shows that OST48 (DDOST) is required for assembly of both the
      STT3A-containing and the STT3B-containing OST complexes, establishing it as a shared
      core subunit rather than a complex-specific accessory.
    supporting_text: >-
      Our results demonstrate that OST48 and DAD1 are required for the assembly of both
      STT3A- and STT3B-containing OST complexes.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Loss of OST48 structurally perturbs the OST complex and produces a pronounced global
      hypoglycosylation phenotype, so DDOST acts as a ubiquitous modulator of OST stability
      and hence of N-glycosylation.
    supporting_text: >-
      The structural perturbations of these complexes we observe in OST48- and
      DAD1-depleted cells underlie their pronounced hypoglycosylation phenotypes. Thus,
      OST48 and DAD1 are global modulators of OST stability and hence N-glycosylation.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Catalysis itself is supplied by the STT3 subunit; the non-catalytic subunits such as
      OST48 play structural roles or modulate efficiency for particular precursors, which is
      why DDOST is best modelled as contributing to, rather than carrying, the
      glycotransferase activity.
    supporting_text: >-
      Comparative studies have clearly shown that eukaryotic STT3 proteins alone can fulfil
      the enzymatic requirements for N-glycosylation, yet in many cases STT3 homologues form
      stable complexes with a variety of non-catalytic OST subunits. Whereas some of these
      additional components might play a structural role, others appear to increase or
      modulate N-glycosylation efficiency for certain precursors.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Directly studies human OST48/DDOST; siRNA knockdown shows OST48
      is required for assembly/stability of both STT3A- and STT3B-containing OST complexes
      and for N-glycosylation. Primary support for core function.
- id: PMID:29765154
  title: The cancer-associated microprotein CASIMO1 controls cell proliferation and
    interacts with squalene epoxidase modulating lipid droplet formation.
  findings:
  - statement: >-
      This paper characterizes the CASIMO1/SMIM22 microprotein and its effect on squalene
      epoxidase and lipid droplets; the DDOST-SMIM22 interaction it sources is incidental to
      the study's conclusions and does not define a DDOST function.
    supporting_text: >-
      Here, we report the identification and characterization of a novel microprotein of 10
      kDa, which we named Cancer-Associated Small Integral Membrane Open reading frame 1
      (CASIMO1).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Paper is about CASIMO1/SMIM22 and squalene epoxidase; cited by GOA
      only for the DDOST-SMIM22 interaction (bare protein binding). Not informative
      about DDOST's molecular function.
- id: PMID:31831667
  title: Cryo-electron microscopy structures of human oligosaccharyltransferase complexes
    OST-A and OST-B.
  full_text_unavailable: true
  findings:
  - statement: >-
      Cryo-EM structures of both human OST complexes resolve DDOST/OST48 as a subunit of the
      co-translational OST-A and the post-translocational OST-B.
    supporting_text: >-
      Mammals express two distinct OST complexes that act in a cotranslational (OST-A) or
      posttranslocational (OST-B) manner. Here, we present high-resolution cryo-electron
      microscopy structures of human OST-A and OST-B.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The two complexes share an overall architecture and differ mainly in the catalytic
      subunit and its complex-specific partner, so the core subunits including DDOST are
      common to both.
    supporting_text: >-
      Although they have similar overall architectures, structural differences in the
      catalytic subunits STT3A and STT3B facilitate contacts to distinct OST subunits, DC2
      in OST-A and MAGT1 in OST-B.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The activity of the DDOST-containing complexes is transfer of a high-mannose glycan
      onto secretory proteins in the endoplasmic reticulum.
    supporting_text: >-
      Oligosaccharyltransferase (OST) catalyzes the transfer of a high-mannose glycan onto
      secretory proteins in the endoplasmic reticulum.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cryo-EM structures of human OST-A (STT3A) and OST-B (STT3B) resolving
      DDOST as a subunit of both; primary support for complex-membership and N-glycosylation
      core assignments.
- id: PMID:36697828
  title: Visualization of translation and protein biogenesis at the ER membrane.
  findings:
  - statement: >-
      Cryo-electron tomography of native ER membranes yields an atomic model of the most
      abundant translocon variant, comprising SEC61, TRAP and the DDOST-containing
      oligosaccharyltransferase complex A.
    supporting_text: >-
      The near-complete atomic model of the most abundant ER translocon variant comprising
      the protein-conducting channel SEC61, TRAP and the oligosaccharyltransferase complex A
      (OSTA) reveals specific interactions of TRAP with other translocon components.
    reference_section_type: ABSTRACT
  - statement: >-
      The ribosome-translocon complex containing OST-A carries out N-glycosylation of
      nascent chains together with their synthesis, translocation, membrane insertion and
      folding.
    supporting_text: >-
      It governs the synthesis, translocation, membrane insertion, N-glycosylation, folding
      and disulfide-bond formation of nascent proteins.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cryo-EM visualization of the STT3A-containing OST bound to the ER
      translocon; corroborates DDOST membership in OST complex A.
- id: PMID:38670073
  title: Positive selection CRISPR screens reveal a druggable pocket in an oligosaccharyltransferase
    required for inflammatory signaling to NF-κB.
  full_text_unavailable: true
  findings:
  - statement: >-
      Genome-wide CRISPR screening shows the DDOST-containing OST-A complex is specifically
      required for N-glycosylation and cell-surface delivery of TLR4, evidence that the two
      OST complexes differ in substrate range.
    supporting_text: >-
      we discovered that the LPS receptor Toll-like receptor 4 (TLR4) is specifically
      dependent on the oligosaccharyltransferase complex OST-A for N-glycosylation and
      cell-surface localization
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Cryo-EM of the OST-A complex localizes the NGI-1 inhibitor to the STT3A catalytic
      site, confirming that catalysis resides in STT3A and not in accessory subunits such as
      DDOST.
    supporting_text: >-
      These variants, in conjunction with cryoelectron microscopy studies, revealed that
      NGI-1 binds the catalytic site of STT3A, where it traps a molecule of the donor
      substrate dolichyl-PP-GlcNAc2-Man9-Glc3, suggesting an uncompetitive inhibition
      mechanism.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: CRISPR screens plus cryo-EM of STT3A-containing OST-A; DDOST resolved
      as a complex A subunit. Supports OST-A membership.
- id: PMID:9642163
  title: 'Interleukin-2 induces N-glycosylation in T-cells: characterization of human
    lymphocyte oligosaccharyltransferase.'
  full_text_unavailable: true
  findings:
  - statement: >-
      DDOST/OST48 was identified as the 50-kDa Wbp1 homologue among the four predominant
      proteins of a purified human lymphocyte oligosaccharyltransferase preparation, giving
      direct biochemical evidence of OST-complex membership.
    supporting_text: >-
      After solubilization and 85-fold purification from salt-washed microsomes, the enzyme
      preparation contained four predominant proteins. N-terminal sequence analysis
      identified the proteins as ribophorin I, ribophorin II (doublet), and a 50-kDa
      homologue of Wbp1, a yeast protein essential for N-glycosylation.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      N-glycosylation activity in peripheral blood lymphocytes rises about ten-fold on
      mitogen activation and stays elevated under IL-2 support; this is a property of the
      T-cell system in which the OST enzyme was assayed, not a DDOST-intrinsic role in
      cytokine response or T-cell activation.
    supporting_text: >-
      N-glycosylation activity increased 10-fold after mitogen activation of PBLs.
      N-glycosylation activity remained elevated during long-term culture and expansion of
      human lymphocytes when growth was supported by interleukin-2.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The DDOST-containing enzyme fractionates predominantly with microsomes, consistent
      with the ER-membrane localization of the OST complex.
    supporting_text: >-
      The enzyme mediating N-glycosylation in lymphocytes was localized predominantly but
      not entirely to a microsomal organelle by subcellular fractionation.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Original purification/characterization of human lymphocyte OST;
      identified DDOST/OST48 (50-kDa Wbp1 homologue) as a component. Cytokine/T-cell
      GO annotations derived from this paper reflect the experimental system, not
      DDOST-intrinsic functions.
- id: Reactome:R-HSA-446209
  title: Transfer of N-glycan to the protein
  findings:
  - statement: >-
      Reactome lists DDOST (OST48) among the subunits of the ER-membrane OST complex that
      transfers the 14-sugar lipid-linked oligosaccharide en bloc onto nascent protein,
      with STT3A/STT3B carrying the catalytic domain.
    supporting_text: >-
      This reaction is catalyzed by the oligosaccharyltransferase (OST) complex, comprising
      at least seven proteins; DAD1 (Dolichyl-diphosphooligosaccharide--protein
      glycosyltransferase subunit DAD1), DDOST (OST48 in yeast), RPN1 (ribophorin 1), RPN2
      (ribophorin 2), OST4, TUSC3 (N33), MAGT1 (magnesium transporter protein 1) and either
      STT3A or STT3B
    reference_section_type: DATABASE_ENTRY
  - statement: >-
      Transfer occurs co-translationally in the ER lumen as the nascent chain emerges from
      the ribosome, which is the basis of the ER-membrane localization annotation.
    supporting_text: >-
      The reaction occurs cotranslationally as the growing peptide chain leaves a ribosome
      associated with the ER membrane and enters the ER lumen.
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-6798739
  title: Exocytosis of azurophil granule membrane proteins
  findings:
  - statement: >-
      DDOST is included in this neutrophil azurophil-granule membrane-proteome record, which
      is the source of the plasma membrane (GO:0005886) and azurophil granule membrane
      (GO:0035577) TAS annotations; the record describes granule biology and does not
      implicate DDOST's oligosaccharyltransferase function at those sites.
    supporting_text: >-
      Azurophil granules undergo limited exocytosis in response to stimulation (Sengelov et
      al. 1993, Faurschou et al. 2002), their primary role is believed to be killing and
      degradation of engulfed microbes in the phagolysosome (Joiner et al. 1989).
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9694793
  title: Spike protein gets N-glycosylated
  findings:
  - statement: >-
      DDOST is listed as an OST-complex participant in the ER N-glycosylation of the
      SARS-CoV-2 spike protein; a substrate-specific reaction record rather than evidence
      for a distinct DDOST function.
    supporting_text: >-
      Glycosyltransferases in the endoplasmatic reticulum are responsible for the attachment
      of numerous high-mannose N-glycans on the SARS-CoV-2 spike protein.
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9816276
  title: CDH1 is N-glycosylated on asparagine residues in endoplasmic reticulum
  findings:
  - statement: >-
      DDOST participates as an OST subunit in ER N-glycosylation of E-cadherin; a
      substrate-level reaction record supporting the ER-membrane localization rather than a
      CDH1-specific DDOST role.
    supporting_text: >-
      All four glycosylated asparagines in CDH1 conform with the glycosylation sequon
      Asn-X-Thr/Ser which is glycosylated in the endoplasmic reticulum (ER) through transfer
      of the preassembled, high-mannose oligosaccharide
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9918962
  title: E is N-glycosylated
  findings:
  - statement: >-
      DDOST appears as an OST-complex participant in ER N-glycosylation of the dengue virus
      E glycoprotein; a host-pathway reaction record, not evidence of a virus-specific DDOST
      function.
    supporting_text: >-
      DENV-2 E protein is known to be N-glycosylated at Asn-67 and Asn-153 (Asn-347 and
      Asn-433 of the polyprotein, respectively), a process requiring, among others, the
      oligosaccharyl transferase activity of the host OST complex
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9918988
  title: pre-M is N-glycosylated
  findings:
  - statement: >-
      DDOST appears as an OST-complex participant in ER N-glycosylation of the dengue virus
      prM protein; a substrate-level record supporting only ER-membrane localization.
    supporting_text: >-
      Dengue virus pre-prM is N-glycosylated at Asn-7, Asn-31, Asn-52, and Asn-69 (Asn-121,
      Asn-145, Asn-166 and Asn-183 of the polyprotein), requiring, among others, the
      oligosaccharyl transferase activity of the OST complex
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9919011
  title: Pre-NS1 folds and is N-glycosylated
  findings:
  - statement: >-
      DDOST appears as an OST-complex participant in the co-folding N-glycosylation of
      dengue virus NS1; a substrate-level record supporting ER-membrane localization only.
    supporting_text: >-
      Pre-NS1 protein, while being folded, is glycosylated at Asn-130 and Asn-207 (Asn-905
      and Asn-982 in the polyprotein, respectively).
    reference_section_type: DATABASE_ENTRY
- id: Reactome:R-HSA-9931286
  title: CD274 N-linked glycosylation in ER
  findings:
  - statement: >-
      DDOST appears as an OST-complex participant in ER N-glycosylation of PD-L1 (CD274);
      the record attributes catalysis to STT3A/STT3B, consistent with DDOST being a
      non-catalytic subunit.
    supporting_text: >-
      PD-L1 is N-glycosylated at N192, N200 and N219 by the OST complex (STT3A and STT3A) in
      the ER lumen.
    reference_section_type: DATABASE_ENTRY
suggested_questions:
- question: >-
    Roboti & High show OST48 depletion destabilizes both OST complexes and causes global
    hypoglycosylation. Is that phenotype fully explained by loss of complex assembly, or does
    OST48 make a separable contribution that would justify retaining the enzyme activator
    activity (GO:0008047) and regulation of protein stability (GO:0031647) annotations?
  experts:
  - Roboti P
  - High S
  - Gilmore R
- question: >-
    Do the neutrophil azurophil granule membrane (GO:0035577) and plasma membrane
    (GO:0005886) localizations of DDOST reflect a genuine post-ER pool of OST48, or are they
    carry-over from granule-proteome sweeps? Is there any evidence for OST activity outside
    the ER?
  experts:
  - Borregaard N
  - Rørvig S
- question: >-
    How does the CDG1R variant Gly217Asp compromise OST48 - by destabilizing the lumenal
    beta-propeller, by blocking incorporation into the OST core, or by reducing steady-state
    protein level - and does it affect OST-A and OST-B equally?
  experts:
  - Locher KP
  - Ramírez AS
  - Freeze HH
suggested_experiments:
- hypothesis: >-
    DDOST/OST48 is required for the structural integrity of the OST core, and its loss
    reduces N-glycosylation sequon occupancy globally rather than for a defined substrate
    class; the enzyme activator activity annotation reflects this structural role rather than
    an autonomous activating function.
  description: >-
    Use a degron-tagged DDOST line to deplete OST48 acutely, then measure (i) OST-A and
    OST-B complex integrity by blue-native PAGE and STT3A/STT3B steady-state levels, and
    (ii) site-specific N-glycosylation occupancy across the glycoproteome by intact
    glycopeptide mass spectrometry. Test whether adding back purified OST lacking OST48
    restores in vitro transferase activity on a synthetic acceptor peptide, which would
    separate an assembly requirement from a catalytic-activation requirement.
  experiment_type: degron depletion, native complex analysis, and in vitro OST activity assay
- hypothesis: >-
    The azurophil-granule and plasma-membrane assignments of DDOST are proteomic carry-over
    and there is no functional extra-ER pool of OST48.
  description: >-
    Fractionate primary human neutrophils into azurophil, specific and gelatinase granules
    plus secretory vesicles and plasma membrane, and quantify OST48 alongside STT3A, RPN1
    and a bona fide granule marker (MPO) by targeted mass spectrometry. Assay
    oligosaccharyltransferase activity in each fraction with a synthetic sequon acceptor to
    test whether any non-ER fraction carries activity.
  experiment_type: subcellular fractionation with targeted proteomics and enzyme assay
- hypothesis: >-
    The DDOST-CDG variant Gly217Asp acts by preventing incorporation of OST48 into the OST
    core rather than by abolishing an OST48-specific activity.
  description: >-
    Express wild-type and Gly217Asp OST48 in DDOST-null cells and compare protein
    half-life (cycloheximide chase), incorporation into STT3A- and STT3B-containing
    complexes (blue-native PAGE and reciprocal co-immunoprecipitation), and rescue of
    hypoglycosylation using a validated reporter substrate plus transferrin isoform
    profiling.
  experiment_type: variant complementation and complex-assembly analysis
