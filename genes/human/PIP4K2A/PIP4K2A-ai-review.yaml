id: P48426
gene_symbol: PIP4K2A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PIP4K2A is the high-activity alpha isoform of the type-II phosphatidylinositol
  5-phosphate 4-kinase family. It phosphorylates PI5P to generate PI(4,5)P2, localizes to cytosolic,
  nuclear, plasma-membrane, lysosomal, and specialized photoreceptor pools, and helps tune processes
  that depend on localized PI5P or PI(4,5)P2, including autophagosome-lysosome fusion,
  lysosome-peroxisome cholesterol transport, and catalytic-independent suppression of PIP5K-driven
  insulin signaling.
