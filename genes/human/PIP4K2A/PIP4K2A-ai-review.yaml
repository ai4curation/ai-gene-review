core_functions:
- description: High-activity type-II phosphatidylinositol kinase that phosphorylates
    phosphatidylinositol 5-phosphate at the 4-position to generate PI(4,5)P2 in cytosolic, nuclear,
    and membrane-associated pools.
  molecular_function:
    id: GO:0016309
    label: 1-phosphatidylinositol 5-phosphate 4-kinase activity
  directly_involved_in:
  - id: GO:1902635
    label: 1-phosphatidyl-1D-myo-inositol 4,5-bisphosphate biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9367159
    supporting_text: the type II enzyme, which is abundant in some tissues, phosphorylates
      PtdIns-5-P at the D-4 position, and thus should be considered as a 4-OH kinase, or PIP(4)K.
      The earlier error in characterizing the activity of the type II enzyme is due to the presence
      of contaminating PtdIns-5-P in commercial preparations of PtdIns-4-P.
  - reference_id: PMID:30718367
    supporting_text: They were also localised in a manner similar to that reported in mammalian
      cells with hPIP4K2A largely seen to be cytosolic, along with some plasma membrane
      localisation, whereas hPIP4K2B was present in nucleus along with cytosolic and membrane
      localisation
  - reference_id: PMID:20583997
    supporting_text: PIP4Kbeta can modulate the nuclear localization of PIP4Kalpha
suggested_questions:
- question: Which endogenous human PIP4K2A pools, rather than overexpressed or mouse-transferred
    pools, generate the PI(4,5)P2 used for autophagosome-lysosome fusion?
- question: Does photoreceptor inner/outer segment localization of mouse Pip4k2a reflect a conserved
    human retinal PIP4K2A function?
suggested_experiments:
- description: Use endogenous tagging and lipid reporters to compare PIP4K2A localization with local
    PI5P and PI(4,5)P2 turnover during basal growth, starvation, and insulin stimulation.
- description: Rescue PIP4K2A-depleted human cells with kinase-dead and PIP5K1A-binding-defective
    variants to separate catalytic PI5P 4-kinase functions from catalytic-independent PIP5K
    suppression.
