- term:
    id: GO:0016308
    label: 1-phosphatidylinositol 4-phosphate 5-kinase activity
  evidence_type: IDA
  original_reference_id: PMID:26774281
  qualifier: enables
  review:
    summary: Remove the historical PI4P 5-kinase activity assignment from this type-II PI5P
      4-kinase.
    action: REMOVE
    reason: PIP4K2A/B/C are type-II PIP4Ks that phosphorylate PI5P at the 4-position, not type-I
      PIP5Ks that phosphorylate PI4P at the 5-position. Rameh et al. showed that the older type-II
      PI4P 5-kinase activity assignment arose from contaminating PI5P in commercial PI4P, and PAINT
      now places an IRD for GO:0016308 at the PTN001132453 type-II clade.
    supported_by:
    - reference_id: PMID:9367159
      supporting_text: the type II enzyme, which is abundant in some tissues, phosphorylates
        PtdIns-5-P at the D-4 position, and thus should be considered as a 4-OH kinase, or PIP(4)K.
        The earlier error in characterizing the activity of the type II enzyme is due to the
        presence of contaminating PtdIns-5-P in commercial preparations of PtdIns-4-P.
    - reference_id: file:interpro/panther/PTHR23086/PTHR23086-paint.tsv
      supporting_text: "PTHR23086\tPTN001132453\tGO:0016308\tF\tIRD\ttrue"
