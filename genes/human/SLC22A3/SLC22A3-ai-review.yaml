    supporting_text: transport of a variety of organic cations
proposed_new_terms: []
suggested_questions:
- question: OCT3 binds many PDZ-domain scaffolds (PDZK1, DLG1-4, SCRIB, MPDZ, MAGI2) via its
    C-terminal class-I PDZ-binding motif (now captured by the NEW GO:0030165 annotation). Which
    of these scaffolds regulate OCT3's surface expression and polarized (apical vs basolateral)
    targeting in vivo, and in which tissues?
- question: What is the physiological significance of the intracellular (mitochondrial,
    nuclear, endomembrane) localizations attributed to OCT3 by similarity to the mouse
    ortholog - are they real for human OCT3, and do they support intracellular amine transport?
suggested_experiments:
- description: Endogenous subcellular localization of human OCT3 (validated antibody or
    knock-in tag) in a native uptake-2 tissue (e.g. placenta, adrenal, cardiomyocytes) with
    organelle markers, to test whether the mitochondrial/nuclear/endomembrane localizations
    inferred from mouse are genuine in human.
- description: Co-immunoprecipitation and surface-biotinylation assays of OCT3 with PDZK1 and
    other PDZ scaffolds, with and without disruption of the C-terminal PDZ ligand, to test
    whether PDZ binding controls OCT3 plasma-membrane abundance and apical/basolateral sorting.
- description: Tissue-specific conditional knockout or selective inhibition of OCT3 combined
    with microdialysis to quantify its contribution to extraneuronal clearance of histamine,
    noradrenaline and adrenaline relative to PMAT (SLC29A4) in vivo.
