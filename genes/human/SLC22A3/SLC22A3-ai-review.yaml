core_functions:
- description: Electrogenic, Na(+)- and Cl(-)-independent, bidirectional facilitated (uniport)
    transmembrane transport of biogenic monoamines across the plasma membrane - the
    extraneuronal monoamine transporter (EMT) / uptake-2 activity. OCT3 clears
    noradrenaline, adrenaline, dopamine, serotonin, histamine and tyramine from the
    extracellular space, with transport direction set by the membrane potential and the
    substrate concentration gradient. It is a low-affinity, high-capacity system that
    complements the high-affinity neuronal uptake-1 transporters (NET/DAT/SERT).
  molecular_function:
    id: GO:0008504
    label: monoamine transmembrane transporter activity
  directly_involved_in:
