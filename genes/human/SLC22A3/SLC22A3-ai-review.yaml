  - reference_id: PMID:20858707
    supporting_text: 'V(max)/K(m) rank order for hOCT3 is: histamine > norepinephrine, epinephrine >'
- description: Electrogenic, Na(+)-independent facilitated transport of polyspecific organic
    cations - quaternary ammonium compounds (tetraethylammonium), the neurotoxin MPP+, and
    cationic drugs/xenobiotics (metformin, cimetidine, oxaliplatin) - across the plasma
    membrane. This is the polyspecific organic-cation (and drug/xenobiotic) transport
    function of OCT3; it underlies renal, intestinal and hepatic handling of cationic drugs.
    The generic GO molecular-function term for organic cation transport (GO:0015101) is
    obsolete, so the quaternary-ammonium transporter term is used.
  molecular_function:
