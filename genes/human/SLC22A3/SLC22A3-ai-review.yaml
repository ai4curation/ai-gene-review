id: O75751
gene_symbol: SLC22A3
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC22A3 encodes OCT3 (organic cation transporter 3), also known as the
  extraneuronal monoamine transporter (EMT), a 556-residue polytopic membrane protein
  of the SLC22/organic-cation-transporter sub-branch within the major facilitator superfamily.
  It is the molecular basis of classical "uptake-2" - a low-affinity, high-capacity,
  corticosterone/steroid-sensitive clearance system that removes biogenic monoamines
  from the extracellular space, complementing the high-affinity neuronal uptake-1 transporters
  (NET/DAT/SERT). Mechanistically it is an electrogenic, voltage-dependent, Na(+)- and
  Cl(-)-independent, bidirectional facilitated uniporter whose direction is set by the
  membrane potential and substrate concentration gradient. Its substrates include the
  monoamines noradrenaline, adrenaline, dopamine, serotonin, histamine and tyramine, as
  well as a broad range of organic cations and cationic drugs/xenobiotics (tetraethylammonium,
  the neurotoxin MPP+, metformin, cimetidine, the platinum drug oxaliplatin), the polyamines
  agmatine and spermidine, guanidine, and choline (low affinity). OCT3 is expressed at the
  plasma membrane (apical or basolateral depending on tissue) of many tissues, including
  liver, kidney proximal tubule, intestine, placenta, heart, skeletal muscle, adrenal gland,
  respiratory epithelium, testis and brain glia, where it contributes to extraneuronal
  monoamine clearance, renal and intestinal handling of organic cations, and drug disposition.
