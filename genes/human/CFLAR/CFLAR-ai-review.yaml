id: O15519
gene_symbol: CFLAR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CFLAR encodes c-FLIP, a catalytically inactive caspase-8-like regulator of death-effector-domain
  signaling complexes. Tandem death effector domains recruit c-FLIP isoforms to FADD-,
  CASP8-, and CASP10-containing death-inducing signaling complexes, TNFR1 complex
  II, and ripoptosomes, where c-FLIP sets the amount and substrate selectivity of
  initiator-caspase activity. Long c-FLIP(L) additionally carries a pseudo-caspase
  domain that heterodimerizes with CASP8 or CASP10 to permit limited catalytic activity
  such as RIPK1 cleavage, whereas short c-FLIP isoforms cap DED filaments and block
  full CASP8 activation. Through these interactions, CFLAR restrains FAS, TNF, and
  TRAIL extrinsic apoptosis and modulates the switch between CASP8-dependent apoptosis
  and RIPK1/RIPK3/MLKL-dependent necroptosis.
