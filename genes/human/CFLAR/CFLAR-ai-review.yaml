functional_isoforms:
- id: CFLAR_FLIPL
  name: c-FLIP(L)
  type: SPLICE_CLASS
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - O15519-1
  description: >-
    Long c-FLIP isoforms contain tandem DEDs followed by a pseudo-caspase domain.
    The pseudo-caspase domain is catalytically inactive but heterodimerizes with CASP8
    or CASP10 to generate limited initiator-caspase activity that can cleave RIPK1
    without allowing full CASP8 homotetramerization and effector-caspase activation.
  isoform_specific_terms:
  - *id004
  - id: GO:0043027
    label: cysteine-type endopeptidase inhibitor activity involved in apoptotic 
      process
- id: CFLAR_FLIPS
  name: c-FLIP(S)
  type: SPLICE_CLASS
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - O15519-2
  description: >-
    Short c-FLIP isoforms contain the tandem DED region but lack the pseudo-caspase
    domain. They bind FADD/CASP8 DED assemblies, block DISC-dependent processing of
    procaspase-8, and can promote RIPK1-dependent necroptosis when CASP8 activity
    is suppressed.
  isoform_specific_terms:
  - id: GO:0043027
    label: cysteine-type endopeptidase inhibitor activity involved in apoptotic 
      process
core_functions:
- description: >-
    CFLAR binds FADD and initiator caspases through tandem death effector domains
    to assemble and cap receptor-proximal DISC, TNFR1 complex-II, and ripoptosome
    DED scaffolds.
  molecular_function: *id001
  directly_involved_in:
  - *id008
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0031264
    label: death-inducing signaling complex
  supported_by: *id003
- description: >-
    c-FLIP isoforms inhibit full CASP8 activation at FAS, TNFR1, and TRAIL death-receptor
    complexes, thereby limiting extrinsic apoptotic signaling.
  molecular_function:
    id: GO:0043027
    label: cysteine-type endopeptidase inhibitor activity involved in apoptotic 
      process
  directly_involved_in:
  - id: GO:1902042
    label: negative regulation of extrinsic apoptotic signaling pathway via 
      death domain receptors
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0031264
    label: death-inducing signaling complex
  supported_by: *id007
- description: >-
    FLIP(L)-CASP8 heterodimers provide limited initiator-caspase activation in cytosolic
    death complexes, allowing RIPK1 cleavage that restrains RIPK1/RIPK3-dependent
    necroptosis.
  molecular_function: *id004
  directly_involved_in:
  - id: GO:0060546
    label: negative regulation of necroptotic process
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0097342
    label: ripoptosome
  supported_by: *id006
proposed_new_terms: []
suggested_questions:
- question: >-
    Should GO or Reactome represent FLIP(L)-CASP8 limited heterodimers and FLIP(S)
    DED caps as separate complex variants so that c-FLIP activator, inhibitor, apoptosis,
    and necroptosis annotations can be made isoform-specifically?
  experts: []
- question: >-
    Should Reactome-to-GOA suppress catalytic peptidase exports for CFLAR while retaining
    death-effector-domain and CASP8-regulator assertions for the same CASP8-like family?
  experts: []
suggested_experiments:
- description: >-
    Use endogenous replacement of c-FLIP(L) and c-FLIP(S) DED-interface or pseudo-caspase-domain
    mutants to measure FAS, TRAIL, and TNF DISC recruitment, CASP8 p18/p10 production,
    RIPK1 cleavage, effector-caspase activation, and MLKL phosphorylation in the same
    cellular background.
  experiment_type: isoform-specific DISC/ripoptosome structure-function assay
