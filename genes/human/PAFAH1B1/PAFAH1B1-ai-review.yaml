core_functions:
- description: 'LIS1 dimers bind the cytoplasmic dynein-1 motor domain and dynactin p150 to regulate dynein:
    they promote assembly of active dynein-dynactin-adaptor complexes, target dynein to microtubule plus
    ends and cargos, and induce a persistent high-load force state. With NDEL1/NDE1 this drives dynein-dependent
    nuclear translocation toward the centrosome in migrating neurons and progenitors, mitotic spindle
    orientation and retrograde axonal transport.'
