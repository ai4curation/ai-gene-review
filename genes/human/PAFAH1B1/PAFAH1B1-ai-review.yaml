id: P43034
gene_symbol: PAFAH1B1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PAFAH1B1 encodes LIS1, a conserved WD40 beta-propeller protein with an N-terminal LisH dimerization
  domain. Its principal function is regulation of cytoplasmic dynein-1: LIS1 dimers bind the dynein motor
  domain and dynactin p150, promote assembly of active dynein-dynactin-adaptor complexes and dynein targeting
  to microtubule plus ends, cargos, kinetochores, the cell cortex and the nuclear envelope, and sustain
  dynein force production under load. Acting with NDEL1/NDE1 at the centrosome, LIS1 couples the nucleus
  to the centrosome during neuronal migration (nucleokinesis), drives interkinetic nuclear migration and
  division of neural progenitors, and supports mitotic spindle orientation, chromosome attachment and
  retrograde axonal transport. Heterozygous loss of PAFAH1B1 causes classical lissencephaly and subcortical
  band heterotopia, and deletion with neighbouring genes causes Miller-Dieker syndrome. Independently,
  LIS1 is the non-catalytic regulatory beta subunit of cytosolic platelet-activating factor acetylhydrolase
  Ib, binding the PAFAH1B2/PAFAH1B3 catalytic dimer that hydrolyses the sn-2 acetyl group of PAF.'
