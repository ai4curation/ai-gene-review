suggested_questions:
- question: Does binding of the PAF-AH alpha2/alpha2 dimer to LIS1 regulate the pool of LIS1 available
    to NDEL1/dynein in neurons, i.e. is there physiological cross-talk between PAF signalling and dynein-driven
    nucleokinesis?
  experts:
  - dynein/LIS1 structural biologists
  - PAF-AH biochemists
- question: Should LIS1's dynein role be captured as cytoskeletal motor activator activity (GO:0140660)
    rather than the regulator parent, given that LIS1 promotes dynein-dynactin assembly but also restrains
    motility in some assays?
  experts:
  - GO molecular-function editors
  - dynein motor biophysicists
- question: Is there evidence for a nucleoplasmic LIS1 pool (e.g. via INTS13) that would support the IBA
    nucleus annotation?
  experts:
  - PAINT curators
suggested_experiments:
- description: Express LIS1 mutants that selectively disrupt PAF-AH alpha-dimer binding versus dynein/NDEL1
    binding in cortical slices and image nucleus-centrosome coupling.
  hypothesis: Nucleokinesis requires the dynein-binding surface but not PAF-AH binding.
  experiment_type: in utero electroporation with separation-of-function mutants and live imaging
- description: Reconstitute dynein-dynactin-BICD2 motility with wild-type or lissencephaly-mutant LIS1
    under optical-trap load.
  hypothesis: Lissencephaly mutations impair LIS1-dependent dynein complex assembly and high-load force
    persistence.
  experiment_type: single-molecule reconstitution/optical trapping
