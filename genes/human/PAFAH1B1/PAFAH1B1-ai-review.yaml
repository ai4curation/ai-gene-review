  evidence_type: ISS
  original_reference_id: file:human/PAFAH1B1/PAFAH1B1-uniprot.txt
  qualifier: enables
  review:
    summary: LIS1 is the non-catalytic regulatory beta subunit of PAF-AH (I) and modulates the activity
      of the PAFAH1B2/PAFAH1B3 catalytic dimer.
    action: NEW
    reason: UniProt (by similarity to bovine/mouse) states the beta subunit has regulatory activity towards
      the catalytic dimer; the LIS1-alpha2 dimer crystal structure provides the physical basis. The broad
      enzyme regulator term is used because the direction of regulation depends on catalytic dimer composition.
      Captures the PAF-AH role without implying LIS1 catalysis.
