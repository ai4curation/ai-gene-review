- term:
    id: GO:0005819
    label: spindle
  evidence_type: IDA
  original_reference_id: PMID:18445686
  qualifier: located_in
  review:
    summary: Spindle (IDA). APC5 was found in a screen for nuclear proteins that bind spindle microtubules;
      kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: The source screen looked for interphase-nuclear proteins that act on the mitotic spindle [PMID:18445686
      "An important subset of mitotic microtubule-binding proteins localises to the nucleus in interphase
      and essentially contributes to spindle formation and function after nuclear envelope breakdown."].
      APC/C on the spindle is a known mitotic pool, but this is a location of the complex, not an APC5
      function. The curator saw the full data (only the abstract is cached).
    supported_by:
    - reference_id: PMID:18445686
      supporting_text: An important subset of mitotic microtubule-binding proteins localises to the nucleus
        in interphase and essentially contributes to spindle formation and function after nuclear envelope
        breakdown.
