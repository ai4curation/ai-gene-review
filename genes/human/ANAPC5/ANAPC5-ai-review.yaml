suggested_questions:
- question: Is APC5's reported direct binding of E2F1 a substrate-recognition role, or an indirect effect
    of its position in the platform?
suggested_experiments:
- description: Map the E2F1-binding surface on APC5 within the APC/C structure, and test whether mutating
    it changes E2F1 ubiquitination without affecting other substrates.
