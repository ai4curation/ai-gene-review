- term:
    id: GO:0007346
    label: regulation of mitotic cell cycle
  evidence_type: NAS
  original_reference_id: PMID:15678131
  qualifier: involved_in
  review:
    summary: Regulation of mitotic cell cycle (NAS, review). Correct, but less informative than the GO:0045842
      row in this review, which it subsumes; accepted.
    action: ACCEPT
    reason: APC5 is a platform subunit that forms the base of the APC/C with APC4 and APC1 [PMID:25043029
      "The base of the APC/C comprises the platform subunits of Apc4 and Apc5, together with two domains
      of Apc1."]; with the TPR lobe, these scaffolding subunits position the catalytic and substrate-recognition
      module [PMID:21307936 "Our structure explains how this TPR sub-complex, together with additional
      scaffolding subunits (Apc1, Apc4 and Apc5), coordinate the juxtaposition of the catalytic and substrate
      recognition module (Apc2, Apc11 and Apc10 (also known as Doc1))"]. GO:0045842 positive regulation
      of mitotic metaphase/anaphase transition is a descendant of this term (via GO:1901990 and GO:0030071,
      checked in OLS) and carries the specific content.
    supported_by:
    - reference_id: PMID:25043029
      supporting_text: The base of the APC/C comprises the platform subunits of Apc4 and Apc5, together
        with two domains of Apc1.
    - reference_id: PMID:21307936
      supporting_text: Our structure explains how this TPR sub-complex, together with additional scaffolding
        subunits (Apc1, Apc4 and Apc5), coordinate the juxtaposition of the catalytic and substrate recognition
        module (Apc2, Apc11 and Apc10 (also known as Doc1))
- term:
    id: GO:0016567
    label: protein ubiquitination
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00143
  review:
    summary: Protein ubiquitination (UniPathway IEA). Correct, general; accepted.
    action: ACCEPT
    reason: APC5 is needed for ubiquitination of the APC/C substrate E2F1 [PMID:22580462 "We also identify
      an APC/C subunit APC5 that binds to E2F1 and is essential for E2F1 ubiquitination."], and the platform
      it belongs to positions the catalytic module [PMID:21307936 "Our structure explains how this TPR
      sub-complex, together with additional scaffolding subunits (Apc1, Apc4 and Apc5), coordinate the
      juxtaposition of the catalytic and substrate recognition module (Apc2, Apc11 and Apc10 (also known
      as Doc1))"].
    supported_by:
    - reference_id: PMID:22580462
      supporting_text: We also identify an APC/C subunit APC5 that binds to E2F1 and is essential for
        E2F1 ubiquitination.
    - reference_id: PMID:21307936
      supporting_text: Our structure explains how this TPR sub-complex, together with additional scaffolding
        subunits (Apc1, Apc4 and Apc5), coordinate the juxtaposition of the catalytic and substrate recognition
        module (Apc2, Apc11 and Apc10 (also known as Doc1))
- term:
    id: GO:0019903
    label: protein phosphatase binding
  evidence_type: IPI
  original_reference_id: PMID:21241890
  qualifier: enables
  supporting_entities:
  - UniProtKB:P60484
  review:
    summary: Protein phosphatase binding (IPI) with PTEN. PTEN binds the APC/C but acts independently
      of its phosphatase activity; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: Nuclear PTEN promotes APC/C-CDH1 association [PMID:21241890 "In this study, we demonstrate
      that nuclear PTEN directly enhances the activity of APC/C by promoting its association with CDH1."].
      This is a regulatory input to the APC/C rather than an APC5 function.
    supported_by:
    - reference_id: PMID:21241890
      supporting_text: In this study, we demonstrate that nuclear PTEN directly enhances the activity
        of APC/C by promoting its association with CDH1.
- term:
    id: GO:0031145
    label: anaphase-promoting complex-dependent catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000302880
  - SGD:S000005775
  - UniProtKB:Q9UJX4
  review:
    summary: APC/C-dependent catabolic process. Accepted; APC5 is a core scaffold subunit and is needed
      for E2F1 ubiquitination.
    action: ACCEPT
    reason: APC/C-dependent degradation requires the platform to position the catalytic module [PMID:21307936
      "Our structure explains how this TPR sub-complex, together with additional scaffolding subunits
      (Apc1, Apc4 and Apc5), coordinate the juxtaposition of the catalytic and substrate recognition module
      (Apc2, Apc11 and Apc10 (also known as Doc1))"]. APC5 also binds the APC/C substrate E2F1 and is
      needed for its ubiquitination [PMID:22580462 "We also identify an APC/C subunit APC5 that binds
      to E2F1 and is essential for E2F1 ubiquitination."].
    supported_by:
    - reference_id: PMID:21307936
      supporting_text: Our structure explains how this TPR sub-complex, together with additional scaffolding
        subunits (Apc1, Apc4 and Apc5), coordinate the juxtaposition of the catalytic and substrate recognition
        module (Apc2, Apc11 and Apc10 (also known as Doc1))
    - reference_id: PMID:22580462
      supporting_text: We also identify an APC/C subunit APC5 that binds to E2F1 and is essential for
        E2F1 ubiquitination.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      residue_claims_not_applicable: APC5 is a non-catalytic subunit; the propagated term makes no residue-level
        claim.
