- id: PMID:25043029
  title: Molecular architecture and mechanism of the anaphase-promoting complex.
  findings:
  - statement: APC4 and APC5 form the APC/C platform with APC1.
    supporting_text: The base of the APC/C comprises the platform subunits of Apc4 and Apc5, together
      with two domains of Apc1.
  - statement: The catalytic module sits at the platform's periphery.
    supporting_text: APC/C’s catalytic subunits Apc2 (cullin) and Apc11 (RING) are positioned at the periphery
      of the platform
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Cryo-EM architecture of APC/C-CDH1.
- id: PMID:12956947
  title: TPR subunits of the anaphase-promoting complex mediate binding to the activator protein CDH1.
  findings:
  - statement: The APC1-APC4-APC5-APC2/11 subcomplex builds chains but cannot bind CDH1.
    supporting_text: One subcomplex, containing APC2/11, APC1, APC4, and APC5, can assemble multiubiquitin
      chains but is unable to bind CDH1 and to ubiquitinate substrates.
  - statement: APC1, APC4 and APC5 may connect APC2/11 to the TPR subunits.
    supporting_text: APC1, APC4, and APC5 may connect APC2/11 with TPR subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Biochemistry of human APC/C subcomplexes.
- id: PMID:21307936
  title: Structural basis for the subunit assembly of the anaphase-promoting complex.
  findings:
  - statement: Scaffolding subunits APC1, APC4 and APC5 position the catalytic and substrate-recognition
      module.
    supporting_text: Our structure explains how this TPR sub-complex, together with additional scaffolding
      subunits (Apc1, Apc4 and Apc5), coordinate the juxtaposition of the catalytic and substrate recognition
      module (Apc2, Apc11 and Apc10 (also known as Doc1))
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Reconstituted APC/C, EM and pseudo-atomic model.
- id: PMID:27601667
  title: WD40 domain of Apc1 is critical for the coactivator-induced allosteric transition that stimulates
    APC/C catalytic activity.
  findings:
  - statement: The platform and TPR lobe are the two scaffolding subcomplexes.
    supporting_text: 'The APC/C assembly comprises two scaffolding subcomplexes: the platform and the
      TPR lobe that together coordinate the juxtaposition of the catalytic and substrate-recognition modules.'
  - statement: The platform comprises APC1, APC4, APC5 and APC15.
    supporting_text: The platform comprises APC/C subunits Apc1, Apc4, Apc5, and Apc15.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. APC1 WD40 structure and platform function.
- id: PMID:20944012
  title: Functional redundancy of paralogs of an anaphase promoting complex/cyclosome subunit in Caenorhabditis
    elegans meiosis.
  findings:
  - statement: Co-depleting the worm APC5 paralogs causes meiotic arrest.
    supporting_text: Depletion of such-1 or gfi-3 alone does not have a notable effect on the meiotic
      divisions; however, codepletion of these two factors results in meiotic arrest.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. C. elegans such-1/gfi-3 genetics.
- id: PMID:22580462
  title: Regulation of E2F1 by APC/C Cdh1 via K11 linkage-specific ubiquitin chain formation.
  findings:
  - statement: APC5 binds E2F1 and is needed for its ubiquitination.
    supporting_text: We also identify an APC/C subunit APC5 that binds to E2F1 and is essential for E2F1
      ubiquitination.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. APC/C-CDH1 regulation of E2F1.
- id: PMID:11870214
  title: 'Phenotypic characterization of Drosophila ida mutants: defining the role of APC5 in cell cycle
    progression.'
  findings:
  - statement: Drosophila IDA is an APC5 homolog.
    supporting_text: IDA is homologous to APC5, a subunit of the anaphase-promoting complex (APC/cyclosome).
  - statement: ida mutants stabilize cyclin B but not sister-chromatid separation regulators.
    supporting_text: Interestingly, some APC/C-target substrates such as cyclin B are not degraded in
      ida mutants, whereas others controlling sister-chromatid separation appear to be turned over.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Drosophila genetics; the likely FlyBase basis of the GO:0045842 IBA.
- id: PMID:21241890
  title: Nuclear PTEN regulates the APC-CDH1 tumor-suppressive complex in a phosphatase-independent manner.
  findings:
  - statement: Nuclear PTEN promotes APC/C-CDH1 association.
    supporting_text: In this study, we demonstrate that nuclear PTEN directly enhances the activity of
      APC/C by promoting its association with CDH1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. Source of the PTEN IPI and a nucleus IDA.
- id: PMID:18445686
  title: EML3 is a nuclear microtubule-binding protein required for the correct alignment of chromosomes
    in metaphase.
  findings:
  - statement: The screen targeted nuclear proteins acting on the mitotic spindle.
    supporting_text: An important subset of mitotic microtubule-binding proteins localises to the nucleus
      in interphase and essentially contributes to spindle formation and function after nuclear envelope
      breakdown.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only. EML3 paper; source of the spindle and nucleus IDA rows.
- id: PMID:18485873
  title: Mechanism of ubiquitin-chain formation by the human anaphase-promoting complex.
  findings:
  - statement: The APC/C assembles K11-linked chains.
    supporting_text: We find that the APC/C triggers substrate degradation by assembling K11-linked ubiquitin
      chains
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Complex-level assay.
- id: PMID:29033132
  title: Assembly and Function of Heterotypic Ubiquitin Chains in Cell-Cycle and Protein Quality Control.
  findings:
  - statement: K11/K48-branched chains are made by essential ligases.
    supporting_text: We show that K11/K48-linked chains are synthesized and processed by essential ubiquitin
      ligases and effectors
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Complex-level assay.
- id: PMID:16364912
  title: Localization of the coactivator Cdh1 and the cullin subunit Apc2 in a cryo-electron microscopy
    model of vertebrate APC/C.
  findings:
  - statement: The APC/C has essential roles in mitosis, meiosis and G1.
    supporting_text: essential functions in mitosis, meiosis, and G1 phase of the cell cycle
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Vertebrate APC/C cryo-EM.
