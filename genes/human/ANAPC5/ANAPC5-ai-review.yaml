  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN000302880
  - PomBase:SPAC959.09c
  - SGD:S000005775
  - UniProtKB:Q9UJX4
  review:
    summary: Part of the anaphase-promoting complex. APC5 is a core platform subunit; accepted.
    action: ACCEPT
    reason: APC5 is a platform subunit that forms the base of the APC/C with APC4 and APC1 [PMID:25043029
      "The base of the APC/C comprises the platform subunits of Apc4 and Apc5, together with two domains
      of Apc1."]; with the TPR lobe, these scaffolding subunits position the catalytic and substrate-recognition
      module [PMID:21307936 "Our structure explains how this TPR sub-complex, together with additional
      scaffolding subunits (Apc1, Apc4 and Apc5), coordinate the juxtaposition of the catalytic and substrate
      recognition module (Apc2, Apc11 and Apc10 (also known as Doc1))"]. [PMID:27601667 "The platform
      comprises APC/C subunits Apc1, Apc4, Apc5, and Apc15."]
    supported_by:
    - reference_id: PMID:25043029
      supporting_text: The base of the APC/C comprises the platform subunits of Apc4 and Apc5, together
        with two domains of Apc1.
    - reference_id: PMID:21307936
      supporting_text: Our structure explains how this TPR sub-complex, together with additional scaffolding
        subunits (Apc1, Apc4 and Apc5), coordinate the juxtaposition of the catalytic and substrate recognition
        module (Apc2, Apc11 and Apc10 (also known as Doc1))
    - reference_id: PMID:27601667
      supporting_text: The platform comprises APC/C subunits Apc1, Apc4, Apc5, and Apc15.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      residue_claims_not_applicable: APC5 is a non-catalytic subunit; the propagated term makes no residue-level
        claim.
