id: Q9UJX4
gene_symbol: ANAPC5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANAPC5 (APC5) is a core subunit of the anaphase-promoting complex/cyclosome (APC/C), the
  E3 ubiquitin ligase that drives mitotic and meiotic progression and keeps cells in G1 by marking cyclins,
  securin and other cell-cycle regulators for proteasomal destruction. APC5 forms the platform at the
  base of the complex with APC4 and two domains of APC1, linking the catalytic cullin-RING module (APC2-APC11)
  to the TPR subunits that recruit the coactivators. APC5 also binds the substrate E2F1 and is needed
  for its K11-linked ubiquitination. Loss of the Drosophila ortholog IDA stabilizes cyclin B, causing
  mitotic defects in imaginal tissues.
