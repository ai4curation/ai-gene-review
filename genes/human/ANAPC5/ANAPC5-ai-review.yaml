- term:
    id: GO:0045842
    label: positive regulation of mitotic metaphase/anaphase transition
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0041147
  - PANTHER:PTN000302880
  review:
    summary: Positive regulation of mitotic metaphase/anaphase transition (IBA). Correct for a core APC/C
      scaffold subunit; accepted.
    action: ACCEPT
    reason: 'Anaphase onset is triggered when APC/C-CDC20 ubiquitinates securin and cyclin B (Reactome
      R-HSA-174144, R-HSA-174227, both cited in this review), and APC5 is a constitutive scaffold subunit
      of that ligase [PMID:21307936 "Our structure explains how this TPR sub-complex, together with additional
      scaffolding subunits (Apc1, Apc4 and Apc5), coordinate the juxtaposition of the catalytic and substrate
      recognition module (Apc2, Apc11 and Apc10 (also known as Doc1))"]. One caveat from the fly donor:
      ida mutants fail to degrade cyclin B but still turn over the substrates controlling sister-chromatid
      separation (PMID:11870214), so the fly phenotype is substrate-selective. That bears on how much
      APC5 contributes, not on whether the APC/C it belongs to drives the transition.'
    supported_by:
    - reference_id: PMID:21307936
      supporting_text: Our structure explains how this TPR sub-complex, together with additional scaffolding
        subunits (Apc1, Apc4 and Apc5), coordinate the juxtaposition of the catalytic and substrate recognition
        module (Apc2, Apc11 and Apc10 (also known as Doc1))
    - reference_id: PMID:25043029
      supporting_text: The base of the APC/C comprises the platform subunits of Apc4 and Apc5, together
        with two domains of Apc1.
    - reference_id: PMID:11870214
      supporting_text: IDA is homologous to APC5, a subunit of the anaphase-promoting complex (APC/cyclosome).
    propagation_review:
      root_cause: NO_FAILURE_CORE
      residue_claims_not_applicable: APC5 is a non-catalytic subunit; the propagated term makes no residue-level
        claim.
- term:
    id: GO:0051445
    label: regulation of meiotic cell cycle
  evidence_type: NAS
  original_reference_id: PMID:15678131
  qualifier: involved_in
  review:
    summary: Regulation of meiotic cell cycle (NAS, review). The APC/C acts in meiosis, but there is no
      human APC5-specific meiotic evidence; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: The APC/C has essential functions in meiosis [PMID:16364912 "essential functions in mitosis,
      meiosis, and G1 phase of the cell cycle"]. In C. elegans, co-depleting the two APC5 paralogs causes
      meiotic arrest [PMID:20944012 "Depletion of such-1 or gfi-3 alone does not have a notable effect
      on the meiotic divisions; however, codepletion of these two factors results in meiotic arrest."],
      which is ortholog-level evidence. No study tests human APC5 in meiosis, so the row stays non-core
      for human.
    supported_by:
    - reference_id: PMID:16364912
      supporting_text: essential functions in mitosis, meiosis, and G1 phase of the cell cycle
    - reference_id: PMID:20944012
      supporting_text: Depletion of such-1 or gfi-3 alone does not have a notable effect on the meiotic
        divisions; however, codepletion of these two factors results in meiotic arrest.
- term:
    id: GO:0070936
    label: protein K48-linked ubiquitination
  evidence_type: IDA
  original_reference_id: PMID:29033132
  qualifier: involved_in
  review:
    summary: Protein K48-linked ubiquitination (IDA). The APC/C builds K11 and branched K11/K48 chains;
      accepted.
    action: ACCEPT
    reason: K11/K48-branched chains are made on mitotic APC/C substrates [PMID:29033132 "We show that
      K11/K48-linked chains are synthesized and processed by essential ubiquitin ligases and effectors"].
      The APC1-APC4-APC5 platform subcomplex with APC2/APC11 can itself assemble ubiquitin chains [PMID:12956947
      "One subcomplex, containing APC2/11, APC1, APC4, and APC5, can assemble multiubiquitin chains but
      is unable to bind CDH1 and to ubiquitinate substrates."].
    supported_by:
    - reference_id: PMID:29033132
      supporting_text: We show that K11/K48-linked chains are synthesized and processed by essential ubiquitin
        ligases and effectors
    - reference_id: PMID:12956947
      supporting_text: One subcomplex, containing APC2/11, APC1, APC4, and APC5, can assemble multiubiquitin
        chains but is unable to bind CDH1 and to ubiquitinate substrates.
