core_functions:
  - description: Catalyzes ATP-dependent phosphorylation of protein serine and threonine
      residues within PI3K-AKT signaling, linking receptor activation to downstream
      growth, metabolic and survival regulators.
    molecular_function:
      id: GO:0004674
      label: protein serine/threonine kinase activity
    directly_involved_in:
      - id: GO:0043491
        label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
      - id: GO:0006468
        label: protein phosphorylation
    locations:
      - id: GO:0005829
        label: cytosol
      - id: GO:0005886
        label: plasma membrane
      - id: GO:0005634
        label: nucleus
    supported_by:
      - reference_id: PMID:16540465
        supporting_text: an Ordered Bi Bi sequential mechanism with ATP binding to the
          enzyme prior to peptide substrate and ADP being released after the
          phosphopeptide product
        full_text_unavailable: true
      - reference_id: PMID:8978681
        supporting_text: activation of PKBalpha by insulin or insulin-like growth factor-1
          (IGF-1) results from phosphorylation of both Thr308 and Ser473
        full_text_unavailable: true
  - description: Binds phosphatidylinositol-3,4,5-trisphosphate through its PH domain to
      couple PI3K lipid signaling to membrane recruitment and activation of AKT1. The PH
      domain also recognizes phosphatidylinositol-3,4-bisphosphate.
    molecular_function:
      id: GO:0005547
      label: phosphatidylinositol-3,4,5-trisphosphate binding
    directly_involved_in:
      - id: GO:0043491
        label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
    locations:
      - id: GO:0005886
        label: plasma membrane
    supported_by:
      - reference_id: PMID:19203586
        supporting_text: PHLDA3 competes with the PH domain of Akt for binding of membrane
          lipids, thereby inhibiting Akt translocation to the cellular membrane and
          activation
        full_text_unavailable: true
      - reference_id: file:human/AKT1/AKT1-uniprot.txt
        supporting_text: alpha (PIK3CA) activity results in its targeting to the plasma
          membrane
proposed_new_terms: []
suggested_questions:
  - question: Which physiological conditions recruit endogenous AKT1 to mitochondria or
      lysosomes, and how do those pools differ from the canonical plasma-membrane and
      cytoplasmic kinase pools?
  - question: How is the kinase-independent AKT1 control of TMEM175 coupled to
      growth-factor signaling in human neurons, and how much of the effect is shared with
      AKT2 or AKT3?
  - question: Which donor-specific neuronal, pain-response and growth-hormone observations
      conserve an AKT1-specific mechanism in human cells?
suggested_experiments:
  - description: Quantitative phosphoproteomics after endogenous AKT1 inhibition or
      degron-mediated depletion with AKT2/AKT3 controls.
    experiment_type: phosphoproteomics/genome editing
    hypothesis: Direct AKT1 substrates can be separated from broad downstream pathway
      responses.
  - description: Live-cell imaging of endogenous AKT1 membrane recruitment with PH-domain
      mutants and pathway activation markers.
    experiment_type: live-cell imaging/signaling assay
    hypothesis: PIP3 binding and membrane recruitment define the core activation step for
      AKT1 kinase signaling.
