id: P31749
gene_symbol: AKT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AKT1 (protein kinase B alpha) is an AGC-family serine/threonine kinase that
  couples insulin, growth-factor and other receptor signals to phosphorylation of
  intracellular proteins. Its PH domain binds 3-phosphoinositides and recruits the kinase
  to membranes, where activating phosphorylation controls its catalytic state. Cytoplasmic
  and nuclear substrate phosphorylation regulates mTOR signaling, metabolism, survival and
  cell movement. Context-dependent lysosomal functions include regulation of autophagy
  and ion-channel activity.
