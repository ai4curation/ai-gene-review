  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9662747
  qualifier: located_in
  review:
    summary: Reactome TAS annotation placing ADAM17 in the Golgi membrane in the context of 
      iRHOM2-dependent ER-to-Golgi transport.
    action: ACCEPT
    reason: 'ADAM17 traverses the Golgi, where the furin-type convertase removes its inhibitory pro-domain;
      Golgi membrane is therefore a genuine (transient) location of the protein, though not the compartment
      where it acts on substrates. Direct experimental support exists independently of the Reactome assertion:
      furin cleavage of the ADAM17 pro-domain was localised to Golgi-derived cholesterol-rich microdomains.'
