core_functions:
- description: Zinc-dependent metalloendopeptidase that cleaves the juxtamembrane stalk regions of 
    transmembrane proteins at the cell surface, releasing their ectodomains; this sheddase activity 
    is the single activity from which essentially all other ADAM17 biology follows.
