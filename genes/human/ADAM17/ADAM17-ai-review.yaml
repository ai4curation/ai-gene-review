  review:
    summary: Interaction with amyloid precursor protein (APP) from the TACE-knockout alpha-secretase
      study.
    action: REMOVE
    reason: GO:0005515 protein binding carries no functional information about ADAM17 and is removed
      per the project curation guideline. Removal does not dispute the reported interaction, which 
      remains recorded in IntAct and in the gene notes. The functional content - that ADAM17 
      performs regulated alpha-cleavage of APP - is already annotated from this same reference as 
      GO:0004222 and GO:0042987, and GO has no APP-binding molecular-function term that could serve 
      as a specific replacement.
    supported_by:
    - reference_id: PMID:9774383
      supporting_text: we now demonstrate that TACE (tumor necrosis factor alpha converting enzyme),
        a member of the ADAM family (a disintegrin and metalloprotease-family) of proteases, plays a
        central role in regulated alpha-cleavage of APP.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:25468996
  qualifier: located_in
  review:
    summary: ADAM17 detected among 561 proteins by proximity biotinylation of the E-cadherin 
      cytoplasmic tail.
    action: MARK_AS_OVER_ANNOTATED
    reason: ADAM17 is a single-pass type I membrane protein with a short cytosolic tail; proximity 
      labelling of a cytoplasmic bait detects that tail and does not establish a cytoplasmic pool of
      the protein. The informative locations are the plasma membrane and membrane rafts, both 
      already annotated.
    supported_by:
    - reference_id: PMID:25468996
      supporting_text: We used proximity biotinylation and quantitative proteomics to identify 561 
        proteins in the vicinity of the cytoplasmic tail of E-cadherin.
