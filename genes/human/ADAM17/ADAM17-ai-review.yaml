  - ensembl:ENSMUSP00000067953
  review:
    summary: Cytoplasm localisation transferred electronically from the mouse ortholog.
    action: MARK_AS_OVER_ANNOTATED
    reason: ADAM17 is an integral membrane protein whose only cytosolic element is its C-terminal 
      tail; a bare cytoplasm annotation misdescribes its topology, and UniProt records the protein 
      as a single-pass type I cell-membrane protein.
    supported_by:
    - reference_id: PMID:9034191
      supporting_text: TACE is a membrane-bound disintegrin metalloproteinase.
