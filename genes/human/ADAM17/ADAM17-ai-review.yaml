suggested_questions:
- question: Should ADAM17's regulated (stimulus-induced) alpha-secretase cleavage of APP be 
    annotated differently from ADAM10's constitutive activity, given that neuronal knockdown assigns
    the constitutive arm to ADAM10 and leaves the physiological relevance of ADAM17-mediated APP 
    cleavage explicitly open?
  experts:
  - Alzheimer disease curators
  - membrane proteolysis curators
- question: Is there a GO representation for a protease that functions only as the catalytic subunit
    of an obligate complex with a non-catalytic partner? ADAM17 requires an iRhom (RHBDF1/RHBDF2) 
    plus FRMD8 for surface delivery and activation, but no sheddase-complex cellular-component term 
    exists.
  experts:
  - GO cellular component curators
  - sheddase biology experts
- question: How should downstream signalling and proliferation terms be handled for sheddases 
    generally? ADAM17 carries several such annotations (PI3K/AKT signal transduction, G1/S 
    transition, cell growth and proliferation) that record requirement rather than participation.
  experts:
  - GO biological process curators
- question: Which of ADAM17's ~90 reported in vitro substrates are physiologically relevant in vivo,
    and should GO annotate substrate-specific shedding events only where in vivo evidence exists?
  experts:
  - ADAM/protease biologists
  - GO annotation consortium
suggested_experiments:
- description: Compare APP alpha-secretase product (sAPPalpha) generation in human iPSC-derived 
    neurons carrying catalytically inactive ADAM17, inactive ADAM10, or both, under basal conditions
    and after muscarinic M1 or PKC stimulation.
  hypothesis: ADAM10 accounts for constitutive neuronal alpha-cleavage while ADAM17 is required 
    specifically for the receptor- or PKC-stimulated arm.
  experiment_type: isogenic knock-in neuronal culture with stimulus-resolved sAPPalpha measurement
- description: Perform surface-proteome shedding profiling (secretome and surface proteomics) in 
    cells expressing ADAM17 with selective disruption of iRhom binding, raft targeting, or 
    tetraspanin association, to separate substrate repertoires attributable to each control layer.
  hypothesis: Substrate selectivity is set by the sheddase complex and membrane microenvironment 
    rather than by the catalytic domain's intrinsic specificity.
  experiment_type: quantitative secretome/surfaceome proteomics with separation-of-function mutants
- description: Test whether ADAM17-dependent TREM2 shedding is rate-limiting for microglial TREM2 
    signalling by comparing soluble and membrane TREM2, phagocytosis and ligand-induced signalling 
    in ADAM17-null versus ADAM10-null human microglia.
  hypothesis: ADAM17 is the principal TREM2 sheddase in microglia and sets the balance between 
    membrane TREM2 signalling and the soluble TREM2 pool measured in CSF.
  experiment_type: isogenic human microglial knockout with shedding and functional readouts
- description: Determine whether ADAM17 cleavage of a given substrate occurs in cis or in trans in 
    primary cells, using separated co-cultures of protease-null and substrate-null cells for TNF, 
    IL-6R, CD16A and TREM2.
  hypothesis: ADAM17 acts predominantly in cis, so substrate shedding reports on the activation 
    state of the same cell rather than of neighbouring cells.
  experiment_type: mixed-genotype co-culture shedding assay
