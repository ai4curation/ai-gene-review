- term:
    id: GO:0070573
    label: metallodipeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9Z0F8
  - ensembl:ENSMUSP00000067953
  review:
    summary: Metallodipeptidase activity propagated electronically from the mouse ortholog.
    action: REMOVE
    reason: 'The term denotes hydrolysis of a dipeptide, which is not what ADAM17 does: it is an endopeptidase
      that cleaves internal juxtamembrane peptide bonds in transmembrane proteins, with a defined cleavage
      site in pro-TNF (EC 3.4.24.86). The correct annotations GO:0004222 and GO:0004175 are already present,
      so this electronic inference is wrong in substance rather than merely imprecise.'
    supported_by:
