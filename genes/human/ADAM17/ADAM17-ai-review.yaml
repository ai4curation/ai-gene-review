gene_symbol: ADAM17
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ADAM17 (TACE, TNF-alpha converting enzyme) is a zinc-dependent, single-pass type I transmembrane
  metalloendopeptidase of the ADAM/adamalysin family and one of the two principal mammalian sheddases.
  After furin-type removal of its inhibitory pro-domain during transit through the Golgi, the mature enzyme
  reaches the plasma membrane, where it cleaves the juxtamembrane stalks of many transmembrane proteins
  and so releases their ectodomains. Its best-established substrates include the membrane-anchored precursor
  of TNF (which it converts to the soluble cytokine), the EGF-receptor ligands amphiregulin, TGF-alpha,
  HB-EGF, epigen and epiregulin, the interleukin-6 receptor alpha chain, TNF receptors 1 and 2, L-selectin,
  KIT, platelet glycoprotein V, FcgammaRIIIA/CD16A, MICA, CXCL16, vasorin, ACE2, TREM2, the DCC guidance
  receptor and the amyloid precursor protein. Through these cleavages ADAM17 governs the availability
  of soluble cytokines, growth factors and receptor ectodomains, and thereby acts upstream of EGFR, TNF-receptor,
  IL-6 trans-signalling, TGF-beta and Notch signalling. Its activity is tightly controlled rather than
  constitutive: trafficking and activation require an iRhom (RHBDF1/RHBDF2) partner with FRMD8, the enzyme
  is restrained by the tissue inhibitor TIMP3 and by integrin alpha5beta1 binding to its disintegrin domain,
  and substrate access is set by lipid-raft partitioning and tetraspanin association. ADAM17 also has
  a non-proteolytic role as an integrin alpha5beta1 ligand. Loss of activity in mouse is perinatally lethal
  with epithelial and immune defects and a lean, hypermetabolic phenotype, and a human CANDIS-domain variant
  that destabilises the protein causes hypotrichosis with woolly hair.'
