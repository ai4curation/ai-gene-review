- term:
    id: GO:0001666
    label: response to hypoxia
  evidence_type: IDA
  original_reference_id: PMID:18276953
  qualifier: involved_in
  review:
    summary: Hypoxia (2% O2) raises TACE/ADAM17 mRNA and protein in placental villous explants and 
      cytotrophoblasts, and TACE inhibition or knockdown reduces HB-EGF and amphiregulin shedding 
      there.
    action: KEEP_AS_NON_CORE
    reason: 'ADAM17 is a target of hypoxic regulation rather than an executor of a hypoxia-response programme:
      the measured effect is increased ADAM17 expression. The annotation is a fair record of the experiment
      but describes a condition that modulates the sheddase, not a core ADAM17 function.'
    supported_by:
    - reference_id: PMID:18276953
      supporting_text: Moreover, hypoxia (2% O(2)) caused an increase in the levels of TACE mRNA and
        protein in villous explants and primary cytotrophoblastic cells in vitro.
    - reference_id: PMID:18276953
      supporting_text: Preadministration of a TACE inhibitor in villous explant cultures or 
        transfection of cytotrophoblastic cells with TACE-specific small interference RNA decreased 
        the shedding of HBEGF and AREG.
