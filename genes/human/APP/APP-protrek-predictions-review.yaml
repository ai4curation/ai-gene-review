- genes/human/APP/APP-uniprot.txt
- genes/human/APP/APP-goa.tsv
predictions:
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0106003
    label: amyloid-beta complex
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      Top-ranked hit (score 15.76), an exact GOA match. The amyloid-beta complex is a real and specific
      assignment - it refers to the Abeta oligomers formed from APP cleavage products, which this
      review treats as a cleavage-product function rather than a property of full-length APP. Correct
      and already annotated; a curator would want the isoform/fragment distinction that the term itself
      does not carry.
    supported_by:
    - reference_id: file:human/APP/APP-uniprot.txt
      supporting_text: >-
        Belongs to the APP family
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0051394
    label: regulation of nerve growth factor receptor activity
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 2 (score 15.39) and absent from GOA. APP and its sAPPalpha ectodomain do participate in
      neurotrophic signalling and APP interacts with p75NTR in some reports, so a link to NGF receptor
      regulation is not fabricated; but it is not established, and this review's account of APP's
      signalling role is as a signaling receptor activator in axonogenesis rather than as a regulator
      of NGF receptor activity. Left uncertain.
    supported_by:
    - reference_id: file:human/APP/APP-uniprot.txt
      supporting_text: >-
        Amyloid-beta precursor protein
- source_method: ProTrek
  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:1902960
    label: negative regulation of aspartic-type endopeptidase activity involved in amyloid precursor
      protein catabolic process
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Rank 3 (score 15.36). Negative regulation of the beta-secretase step of APP catabolism is a
      coherent claim - APP is the substrate of BACE1 and several APP-derived fragments feed back on
      processing - but the term is obsolete in the current GO release and so cannot be entered, and
      it describes regulation of the pathway APP is processed by rather than a function APP performs.
      Recorded as uncertain on the ontology-drift ground.
    supported_by:
    - reference_id: file:human/APP/APP-uniprot.txt
      supporting_text: >-
        Amyloid-beta precursor protein
