id: P05067
gene_symbol: APP
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens (Human)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for human APP. Two of the top four are exact GOA matches, but
  they pick out narrow disease-associated corners of a protein with seven distinct core functions
  in this review - none of the adhesion, axonogenesis, synaptic, metal-binding, protease-inhibitor
  or heparin-binding roles is retrieved. One call is obsolete. The free-text channel returns the gamma-CTF/C31
  apoptosis comment, again the Alzheimer's-facing subset. For one of the most heavily annotated proteins
  in the cohort, the list captures the amyloid literature rather than the protein. Assessment: 1 correct
  not novel (CNN), 2 uncertain (UNC).
source_documents:
