core_functions:
- description: GRB2 SH2 domain recognizes phosphotyrosine motifs on activated receptor tyrosine kinases
    and phosphorylated scaffold proteins, providing conditional, phosphorylation-dependent docking that
    initiates assembly of receptor-proximal signaling complexes.
  molecular_function:
    id: GO:0001784
    label: phosphotyrosine residue binding
  supported_by:
  - reference_id: PMID:1322798
    supporting_text: GRB2 associates with tyrosine-phosphorylated epidermal growth factor receptors (EGFRs)
      and platelet-derived growth factor receptors (PDGFRs) via its SH2 domain
  directly_involved_in:
  - id: GO:0007173
    label: epidermal growth factor receptor signaling pathway
  - id: GO:0007165
    label: signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
- description: By binding an activated receptor phosphotyrosine through its SH2 domain and the proline-rich
    region of the Ras GEF SOS through its SH3 domains, GRB2 recruits SOS to the membrane and couples receptor
    activation to Ras-GTP loading and the RAF-MEK-ERK cascade.
  molecular_function:
    id: GO:0005091
    label: guanyl-nucleotide exchange factor adaptor activity
  supported_by:
  - reference_id: PMID:8386805
    supporting_text: Cellular Grb2 appears to form a complex with a guanine-nucleotide-exchange factor
      for Ras, which binds to the ligand-activated EGF receptor, allowing the tyrosine kinase to modulate
      Ras activity.
  - reference_id: PMID:8253073
    supporting_text: Ash plays a critical role in the signaling of both pathways downstream from growth
      factor receptors to Ras and Rac
  directly_involved_in:
  - id: GO:0007265
    label: Ras protein signal transduction
  - id: GO:0043408
    label: regulation of MAPK cascade
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005829
    label: cytosol
- description: GRB2 acts as a general protein-macromolecule adaptor, using its SH3 domains to bind proline-rich
    effectors and scaffolds and thereby nucleate and spatially organize receptor-proximal signaling complexes
    (e.g. LAT microclusters in immunoreceptor signaling, and recruitment of endocytic/ubiquitination machinery
    such as CBL for receptor internalization).
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  supported_by:
  - reference_id: PMID:25870599
    supporting_text: GRB2 regulates signaling downstream of adaptors and receptors by both recruiting
      effector proteins and regulating the formation of signaling complexes.
  - reference_id: PMID:19509291
    supporting_text: the proline-rich motifs of GAREM are recognized by the N- and C-terminal SH3 domains
      of Grb2
