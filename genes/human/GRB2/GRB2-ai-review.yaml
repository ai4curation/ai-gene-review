- term:
    id: GO:0001784
    label: phosphotyrosine residue binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0004638
  - PANTHER:PTN005273574
  - RGD:619758
  - UniProtKB:P62993
  review:
    summary: 'IBA: phosphotyrosine residue binding, the molecular activity of the GRB2 central SH2 domain
      that recognizes tyrosine-phosphorylated motifs on activated receptors and scaffolds.'
    action: ACCEPT
    reason: This is a core GRB2 molecular function. The SH2 domain binds receptor/scaffold phosphotyrosine;
      the IBA reflects a sound phylogenetic assignment across the GRB2/Sem-5/DRK family (GRB2 appears
      in its own WITH/FROM because it has direct experimental grounding, which is expected, not circular).
    supported_by:
    - reference_id: PMID:1322798
      supporting_text: GRB2 associates with tyrosine-phosphorylated epidermal growth factor receptors
        (EGFRs) and platelet-derived growth factor receptors (PDGFRs) via its SH2 domain
- term:
    id: GO:0001784
    label: phosphotyrosine residue binding
  evidence_type: IPI
  original_reference_id: PMID:20624904
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6GX35
  review:
    summary: 'IPI: GRB2 SH2 domain binding a phosphotyrosine-containing ligand, assayed on an SH2/PTB-domain
      protein microarray.'
    action: ACCEPT
    reason: Direct measurement of GRB2 SH2-domain phosphotyrosine binding; consistent with GRB2's core
      SH2 function. The specific partner (a Chlamydia Tarp phosphopeptide) is incidental to the molecular
      activity being demonstrated.
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: 'HDA: GRB2 identified as an RNA-binding protein in a proteome-wide mRNA interactome-capture
      (UV crosslinking) screen.'
    action: KEEP_AS_NON_CORE
    reason: A high-throughput identification, not a canonical or core GRB2 function; there is some corroboration
      that nuclear GRB2 influences microRNA expression (PMID:37328606), but RNA binding is not part of
      GRB2's adaptor role. Retained as non-core rather than removed, per the policy against overruling
      experimental/high-throughput assays on incomplete grounds.
- term:
    id: GO:0005068
    label: transmembrane receptor protein tyrosine kinase adaptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q60631
  - ensembl:ENSMUSP00000021090
  review:
    summary: 'IEA (ortholog transfer): transmembrane receptor protein tyrosine kinase adaptor activity.'
    action: ACCEPT
    reason: 'This precisely describes GRB2''s defining molecular function: coupling activated receptor
      tyrosine kinases to downstream effectors. Core.'
- term:
    id: GO:0005091
    label: guanyl-nucleotide exchange factor adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:8386805
  qualifier: enables
  review:
    summary: 'IDA: guanyl-nucleotide exchange factor adaptor activity - GRB2 couples activated RTKs to
      the Ras GEF (SOS), the canonical GRB2 output.'
    action: ACCEPT
    reason: Core GRB2 function. GRB2 forms a complex with a Ras GEF that binds the activated EGF receptor,
      coupling the kinase to Ras activation.
    supported_by:
    - reference_id: PMID:8386805
      supporting_text: Cellular Grb2 appears to form a complex with a guanine-nucleotide-exchange factor
        for Ras, which binds to the ligand-activated EGF receptor, allowing the tyrosine kinase to modulate
        Ras activity.
- term:
    id: GO:0005091
