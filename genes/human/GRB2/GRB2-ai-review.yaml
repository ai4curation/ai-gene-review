id: P62993
gene_symbol: GRB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRB2 (growth factor receptor-bound protein 2) is a ubiquitously expressed, non-catalytic
  cytoplasmic signaling adaptor built from an N-terminal SH3 domain, a central SH2 domain, and a C-terminal
  SH3 domain. Its SH2 domain recognizes phosphotyrosine motifs on activated receptor tyrosine kinases
  and phosphorylated scaffold proteins (e.g. SHC1, IRS1, LAT), while its two SH3 domains bind proline-rich
  motifs of downstream effectors, most notably the Ras guanine-nucleotide exchange factor SOS. By simultaneously
  engaging a phosphorylated receptor and SOS, GRB2 recruits SOS to the plasma membrane and couples receptor
  activation to Ras loading and the RAF-MEK-ERK (MAPK) cascade, the central mechanism by which extracellular
  growth-factor signals drive proliferation, differentiation, survival, and migration. GRB2 also assembles
  broader receptor-proximal signaling complexes (nucleating LAT microclusters in immunoreceptor signaling,
  linking receptors to Gab scaffolds and the PI3K-AKT branch, and binding partners such as CBL to promote
  receptor endocytosis and signal attenuation). It functions predominantly in the cytosol and at the cytoplasmic
  face of the plasma membrane, relocating to activated membrane receptors and to endosomes during receptor
  trafficking; nuclear pools have also been reported. GRB2 can homodimerize, and dimeric GRB2 can restrain
  basal signaling of some receptors such as FGFR2.
