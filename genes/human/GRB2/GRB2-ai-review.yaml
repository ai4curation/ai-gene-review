proposed_new_terms: []
suggested_questions:
- question: Should the many specific GRB2 receptor/partner interactions annotated only as protein binding
    be systematically captured under phosphotyrosine residue binding, SH3/proline-rich binding, or adaptor
    activity rather than removed?
- question: Is the COP9 signalosome (GO:0008180) annotation to GRB2 supportable in any organism, or is
    it a family-wide over-propagation that should be retired?
- question: Does GRB2 RNA binding (interactome capture) reflect a bona fide, functionally relevant activity
    connected to its reported nuclear microRNA-regulatory role?
suggested_experiments:
- description: Domain-resolved separation-of-function mutants (SH2-dead vs N-SH3 vs C-SH3) with endogenous
    tagging to map which core GRB2 activities (phosphotyrosine binding, SOS/Ras coupling, LAT cluster
    formation, receptor internalization) each interaction supports.
  hypothesis: Distinct GRB2 domains support separable core functions that current gene-level annotations
    conflate.
- description: Reconstituted membrane assays quantifying GRB2 monomer-dimer equilibrium effects on SOS
    recruitment versus basal receptor (e.g. FGFR2) restraint.
  hypothesis: GRB2 dimerization switches its role between promoting and restraining receptor signaling.
