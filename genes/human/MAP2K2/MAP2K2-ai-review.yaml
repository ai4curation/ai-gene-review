- term:
    id: GO:0005078
    label: MAP kinase scaffold activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00086240
  review:
    summary: MAP kinase scaffold activity (IMP, PMID:29433126; IEA ARBA). In Lavoie et al. 2018, MEK1/MEK2 binding
      to KSR1 drives KSR1-BRAF heterodimerization and BRAF activation; shMEK2 reduces BRAF-KSR1 association.
    action: KEEP_AS_NON_CORE
    reason: 'PMID:29433126 (full text read) shows a genuine non-catalytic MEK function: an ''activator'' MEK bound
      to KSR1 promotes assembly of the KSR1-BRAF dimer, i.e. MEK supports assembly of a multi-kinase MAPK module,
      which is the closest existing GO notion. The authors frame this as KSR acting as a MEK-dependent allosteric
      activator of BRAF rather than as classical scaffolding, so the term is an approximation; it is kept, as curated,
      but non-core relative to the catalytic MAP2K activity. A better-fitting term is raised as a suggested question.'
    supported_by:
    - &id006
      reference_id: PMID:29433126
      supporting_text: Reducing endogenous MEK1 and/or MEK2 levels by RNA interference (shMEK1 and/or shMEK2) decreases
        BRAF-KSR1 interaction by BRET
    - &id007
      reference_id: PMID:29433126
      supporting_text: support a model whereby KSRs function as MEK-dependent allosteric activators of BRAF
