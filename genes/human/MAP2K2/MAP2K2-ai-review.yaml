id: P36507
gene_symbol: MAP2K2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MAP2K2 (MEK2) is a cytosolic dual-specificity protein kinase of the STE7/MAP2K family that forms, with
  its paralog MAP2K1, the middle tier of the RAF-MEK-ERK (ERK1/ERK2) cascade. Phosphorylation of Ser222 and Ser226
  in its activation loop by RAF kinases switches it on, after which it phosphorylates the threonine and tyrosine
  of the TEY motif of ERK1 (MAPK3) and ERK2 (MAPK1), activating them. MEK2 is recruited to membranes and signalling
  complexes by scaffolds such as KSR1 and, through its C-terminal PDZ-binding motif (absent from MEK1), by DLG1/SAP97.
  Binding of MEK to KSR proteins also promotes KSR-BRAF heterodimerization and allosteric BRAF activation. Germline
  activating variants cause cardiofaciocutaneous syndrome type 4.
