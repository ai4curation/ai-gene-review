  review:
    action: ACCEPT
    summary: Recombinant human MEK2 phosphorylated ERK1 on threonine and tyrosine and activated its kinase
      activity over100-fold.
    supported_by:
    - reference_id: PMID:8388392
      supporting_text: "Both MEK1 \nand MEK2 were expressed in Escherichia coli and shown to be able to\
        \ activate \nrecombinant human ERK1 in vitro. The purified MEK2 protein stimulated threonine \n\
        and tyrosine phosphorylation on ERK1 and concomitantly activated ERK1 kinase \nactivity more than\
        \ 100-fold."
