core_functions:
- description: Dual-specificity MAP kinase kinase that phosphorylates the activation-loop Thr and Tyr of ERK1 and
    ERK2 in the cytosol, acting as the MAP2K tier of the ERK1/ERK2 cascade.
  molecular_function: *id003
  directly_involved_in:
  - id: GO:0070371
    label: ERK1 and ERK2 cascade
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id001
  - *id019
  - *id002
- description: Binds ERK-module scaffolds (KSR1, and DLG1 via its C-terminal RTAV PDZ-binding motif), which recruit
    MEK2 to membranes and, for KSR1, use MEK binding to drive KSR1-BRAF dimerization and BRAF activation.
  molecular_function:
    id: GO:0097110
    label: scaffold protein binding
  directly_involved_in:
  - id: GO:0070371
    label: ERK1 and ERK2 cascade
  supported_by:
  - *id020
  - *id022
  - *id006
suggested_questions:
- question: MEK binding to KSR1 drives KSR1-BRAF heterodimerization and BRAF activation (PMID:29433126). Is GO:0005078
    MAP kinase scaffold activity the intended term for this non-catalytic 'activator MEK' role, or should GO add
    a term for allosteric promotion of RAF dimerization?
- question: Which of the review-derived MEK2 localizations (mitochondrion, endosomes, Golgi, focal adhesion) rest
    on MEK2-specific data rather than MEK1 or pan-MEK antibodies?
suggested_experiments:
- description: Paralog-specific localization of endogenously tagged MEK2 versus MEK1 (e.g. knock-in tags with organelle
    markers) to test the endosomal, Golgi and mitochondrial assignments, and the contribution of the MEK2-specific
    C-terminal PDZ-binding motif.
