id: P08709
gene_symbol: F7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: F7 encodes coagulation factor VII, a secreted, vitamin K-dependent plasma glycoprotein that
  circulates predominantly as a zymogen. Its activated form, factor VIIa, is a serine endopeptidase that
  binds tissue factor and cleaves factors IX and X to their active forms, initiating the extrinsic coagulation
  pathway. Tissue factor binding enhances protease activity, while calcium coordination and the gamma-carboxyglutamate-rich
  domain support assembly at phospholipid surfaces. The resulting extracellular, membrane-associated reactions
  feed thrombin generation and fibrin formation. Tissue-factor-bound factor VIIa also participates in
  context-dependent cell signaling.
