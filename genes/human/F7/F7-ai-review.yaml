  review:
    summary: Retain context-dependent enhancement of human monocyte chemotaxis.
    action: KEEP_AS_NON_CORE
    reason: The inspected Methods and Results of PMID:17991872 identify recombinant human FVIIa and primary
      human blood monocytes, alongside human fibroblasts and engineered porcine aortic endothelial cells.
      TF/FVIIa enhances PDGF-BB-directed migration, with PAR2 and Src/PLC perturbations supporting the
      signaling context. This is a measured cellular response, not evidence that FVIIa is itself a chemoattractant
      or kinase. Retain it as a contextual consequence of receptor-associated protease signaling rather
      than the principal coagulation role. Complete article and supplement access remains unavailable;
      the positive judgment uses the recovered original operative pages.
    supported_by:
