      confidence: SUSPECTED
      explanation: 'The BHF-UCL human F7 GO:0004252 IDA assertion citing PMID:24998411 uses contributes_to.
        Independent human FVIIa S-2288 assays in PMID:7797546 (Methods and Results/Figures 5–6) demonstrate
