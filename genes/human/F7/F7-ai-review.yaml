suggested_questions:
- question: How do the two annotated F7 precursor products, A (466 residues) and B (444 residues), differ
    in secretion, maturation and production of active tissue-factor-bound enzyme under physiological expression
    conditions?
- question: Under which cell-surface conditions can signaling be assigned specifically to FVIIa, separately
    from signaling by the FXa generated in the same tissue-factor-associated assembly?
suggested_experiments:
- description: Express sequence-verified human A and B precursors separately in the same secretion-competent
    cell system. Measure transcript abundance, secreted protein, N-terminal processing and gamma-carboxylation
    before comparing activation cleavage, tissue factor binding and FIX/FX cleavage at matched active-site
    concentrations. Identify the mature chains directly by mass spectrometry rather than transferring
    precursor-A processing coordinates to precursor B.
- description: Compare purified human FVIIa with and without FX on cells bearing defined amounts of tissue
    factor and the relevant protease-activated receptor. Combine selective FVIIa and FXa inhibition with
    catalytic-site controls, direct receptor-cleavage measurements and downstream signaling readouts.
    Quantify generated FXa and keep coagulation endpoints separate from signaling so that an effect of
    the assembled system is not automatically assigned to FVIIa alone.
