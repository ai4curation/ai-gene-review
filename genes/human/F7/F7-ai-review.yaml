  review:
    summary: The rat hypoxia response does not yet resolve the human assertion.
    action: UNDECIDED
    reason: The actual Q8K3U6 donor GOA is IEP from PMID:9155722. Its positive abstract reports changes
      in rat coagulation during prolonged hypobaric hypoxia, including reduced FVII activity after eight
      weeks, with consumption during thrombosis considered. Complete original Methods/Results were not
      recovered. Preserve this observation without inferring oxygen sensing, dismissing the donor, or
      claiming that this particular response has been established for human F7.
