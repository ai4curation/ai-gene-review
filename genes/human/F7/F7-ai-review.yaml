core_functions:
- description: Factor VIIa catalyzes internal peptide-bond cleavage that activates factors IX and X in
    the tissue-factor-dependent extrinsic coagulation pathway, thereby increasing coagulation. FVIIa supplies
    the catalytic site and can hydrolyze a peptide substrate without tissue factor; TF strongly enhances
    activity and provides the receptor/cofactor context for physiological substrate recognition. Calcium
    coordination, TF binding and phospholipid association support this same extracellular catalytic unit
    at the external face of the plasma membrane. The structured substrates name the human FIX and FX gene
    products, not their activated products or an untested natural isoform. Zymogen activation describes
    the performed FIX/FX cleavage steps, distinct from processing FVII itself.
