  review:
    summary: Retain FVIIa serine endopeptidase activity and query the imported contribution qualifier.
    action: ACCEPT
    reason: Activated FVIIa supplies the catalytic site. In the actual PMID:7797546 S-2288 Methods and
      Results associated with Figures 5–6, human FVIIa hydrolyzes the peptide without tissue factor; TF
      and calcium strongly enhance that activity. This establishes catalytic capacity of FVIIa itself,
      not efficient tissue-factor-independent physiological coagulation. The source PMID:24998411 remains
