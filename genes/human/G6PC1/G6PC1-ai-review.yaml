suggested_questions:
- question: Is the 176-residue natural product expressed as a stable membrane protein, and what localization
    or biological role does it have? Its sequence lacks canonical His176 and much of the membrane architecture
    of the characterized enzyme.
- question: Does G6PC1 have a physiologically relevant phosphotransferase reaction under cellular substrate
    concentrations, beyond the glucose/carbamyl-phosphate activity measured in disrupted mouse microsomes?
- question: Does G6PC1 selectively bind inorganic phosphate as a distinct ligand, beyond its established
    contacts with the phosphate group of glucose-6-phosphate and the covalent His176 intermediate?
suggested_experiments:
- description: Compare expression, stability and localization of the two sequence-verified natural products
    in matched preparations. Any activity measurement for the short product should be interpreted in light
    of its missing canonical His176 and altered membrane architecture.
- description: Measure phosphate-ion association with purified catalytically active G6PC1 using an assay
    that distinguishes noncovalent binding from covalent phosphoenzyme formation, with active-site substitutions
    and substrate controls.
