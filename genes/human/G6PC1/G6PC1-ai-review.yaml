gene_symbol: G6PC1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
status: DRAFT
description: Glucose-6-phosphatase catalytic subunit 1 (G6PC1) is an integral endoplasmic reticulum membrane
  enzyme that hydrolyzes glucose 6-phosphate to glucose and inorganic phosphate. Its nine transmembrane
  helices surround a catalytic pocket facing the ER lumen. The glucose-6-phosphate transporter SLC37A4
  supplies substrate to that compartment. G6PC1 supports glucose production from gluconeogenesis and glycogen
  breakdown, principally in liver, kidney and intestine, and helps maintain blood glucose during fasting.
  Catalysis uses His176 to form a phosphohistidine intermediate, with His119 contributing proton transfer.
  Inactivating variants cause glycogen storage disease type Ia. The canonical 357-residue protein is experimentally
  characterized. The 176-residue alternative product lacks the canonical catalytic His176 and much of
  the C-terminal membrane architecture; equivalent catalysis has not been demonstrated.
