core_functions:
- description: Hydrolyzes glucose 6-phosphate to glucose and inorganic phosphate at the luminal face of
    the endoplasmic reticulum membrane, completing glucose production from gluconeogenic precursors and
    glycogen-derived glucose 6-phosphate.
