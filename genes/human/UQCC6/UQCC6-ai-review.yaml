- id: PMID:34969438
  title: Defining the interactome of the human mitochondrial ribosome identifies SMIM4
    and TMEM223 as respiratory chain assembly factors.
  findings:
  - statement: C12ORF73 is part of an early complex III assembly intermediate with UQCC1,
      UQCC2 and SMIM4 that binds newly synthesised cytochrome b.
    supporting_text: As expected, both immunoisolations clearly enriched newly synthesized
      CYTB.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Supports inner-membrane topology and an early complex III
      assembly role; the complex IV evidence is only a slight knockdown effect and the
      paper does not claim a complex IV assembly role for C12ORF73.
- id: PMID:35977508
  title: Mitochondrial microproteins link metabolic cues to respiratory chain biogenesis.
  findings:
  - statement: BRAWNIN and SMIM4 join COMA subunits to form the COMB complex, which
      stabilises and chaperones nascent cytochrome b.
    supporting_text: Furthermore, when nuclear CIII subunits are limiting, COMB is required
      to chaperone nascent CYTB to prevent OXPHOS collapse.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Liang et al. 2022 Cell Rep (mouse); abstract only in cache. Source of the
      mouse Q8BTC1 annotations used for the ISS row.
- id: PMID:37769950
  title: Knockdown of BRAWNIN minimally affect mitochondrial complex III assembly in human
    cells.
  findings:
  - statement: Knockout, but not knockdown, of BRAWNIN impairs complex III assembly in
      human cells.
    supporting_text: although only a minimal amount of BRAWNIN was required for CIII
      assembly
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Confirms the complex III requirement at knockout level
      while showing that knockdown phenotypes are weak, which cautions against
      interpreting knockdown effects on other complexes as function.
