  title: Mitochondrial peptide BRAWNIN is essential for vertebrate respiratory complex
    III assembly.
  findings:
  - statement: BRAWNIN is an inner-membrane microprotein essential for complex III assembly
      in human cells, zebrafish and mouse fibroblasts.
    supporting_text: In zebrafish, Brawnin deletion causes complete CIII loss, resulting
      in severe growth retardation, lactic acidosis and early death.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding paper (Zhang et al. 2020 Nat Commun); PMID, title and full text
      checked against the cached PMC record. The UQCRC1/UQCRQ interactions reported here
      were not reproduced as strong associations by PMID:34969438.
