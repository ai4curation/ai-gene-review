  label: Homo sapiens
description: >-
  UQCC6 (BRAWNIN, C12orf73) is a 71-amino-acid microprotein encoded by a small open
  reading frame and conserved across vertebrates. It is an integral protein of the
  mitochondrial inner membrane, anchored by a single N-terminal signal-anchor helix with its
  short N terminus in the matrix and its C-terminal region in the intermembrane space. UQCC6
  is a non-catalytic assembly factor for respiratory chain complex III (ubiquinol-cytochrome
  c reductase, cytochrome bc1). Together with the microprotein UQCC5 (SMIM4) and the
  cytochrome b translation/assembly factors UQCC1, UQCC2 and UQCC4 (C16orf91) it forms an
  early assembly intermediate (termed the COMB complex) that binds newly synthesised
  mitochondrially encoded cytochrome b (MT-CYB) and stabilises it before later subunits
  join. Loss of the protein in zebrafish or mouse cells causes near-complete loss of
  assembled complex III dimers with little effect on the other respiratory complexes,
  leading in zebrafish to lactic acidosis, growth retardation and early death; partial
  knockdown in human cells has much milder effects. Its expression is highest in cardiac
  and skeletal muscle and is induced by nutrient stress and AMPK activation, linking complex
  III biogenesis to cellular energy demand.
