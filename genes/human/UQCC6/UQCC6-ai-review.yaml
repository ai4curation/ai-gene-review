    action: REMOVE
    reason: >-
      Bare protein binding carries no functional information, and no more informative
      molecular function can be supported from this evidence, so the row is removed rather
      than rewritten. The functionally relevant partners of UQCC6 are early assembly
      factors (UQCC1, UQCC2, UQCC5/SMIM4) and nascent cytochrome b; an independent study
