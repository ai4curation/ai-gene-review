core_functions:
- description: >-
    Non-catalytic complex III (cytochrome bc1) assembly factor of the mitochondrial inner
    membrane. As part of the early COMB assembly intermediate with UQCC1, UQCC2, UQCC4 and
    UQCC5/SMIM4, UQCC6 binds and stabilises newly synthesised mitochondrially encoded
    cytochrome b before later complex III subunits are added. No molecular function term is
    assigned because no GO activity term captures this stabilising role and the only
    available molecular function annotation is bare protein binding.
  directly_involved_in:
  - id: GO:0034551
    label: mitochondrial respiratory chain complex III assembly
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:32161263
    supporting_text: we demonstrate that BRAWNIN, a 71 a.a. peptide encoded by C12orf73,
      is essential for respiratory chain complex III (CIII) assembly
  - reference_id: PMID:34969438
    supporting_text: These results demonstrate that C12ORF73FLAG forms a complex with UQCC1,
      UQCC2, and SMIM4 but not with UQCC3.
  - reference_id: PMID:35977508
    supporting_text: Subsequently, microproteins SMIM4 and BRAWNIN together with COMA
      subunits form the COMB complex to stabilize nascent CYTB.
proposed_new_terms: []
suggested_questions:
- question: >-
    Should GO add cellular component terms for the mammalian cytochrome b assembly
    intermediates (COMA, COMB, COMC), so that UQCC6 and UQCC5 can be annotated to COMB
    membership rather than only to the complex III assembly process?
  experts:
  - Lena Ho
  - David A Stroud
  - Peter Rehling
- question: >-
    Does UQCC6 have an intrinsic molecular activity (for example a chaperone-like activity
    toward nascent cytochrome b), or does it act solely as a structural component of the COMB
    intermediate? Its C terminus faces the intermembrane space, whereas cytochrome b is
    synthesised at the matrix face.
- question: >-
    Why is UQCC6 knockdown in human cells so much milder than knockout, and is this because
    only small amounts of the protein are needed or because it acts catalytically in
    successive assembly cycles?
suggested_experiments:
- hypothesis: UQCC6 contacts nascent cytochrome b directly within the membrane.
  description: >-
    Site-specific photo-crosslinking of UQCC6 (transmembrane and IMS-facing residues) in
    cells with pulse-labelled mitochondrial translation products, followed by identification
    of crosslinked partners, to test direct contact with MT-CYB versus contact via UQCC1/UQCC2
    or UQCC5.
  experiment_type: in organello crosslinking
- hypothesis: The complex IV decrease seen after UQCC6 knockdown is secondary to complex III loss.
  description: >-
    Compare complex IV assembly kinetics (pulse-chase of COX1 into assembled complex IV) in
    UQCC6-knockout cells with and without complementation of complex III by an alternative
    route, or against knockouts of other early complex III factors such as UQCC1.
  experiment_type: pulse-chase and BN-PAGE
