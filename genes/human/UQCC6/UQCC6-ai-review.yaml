- term:
    id: GO:0033617
    label: mitochondrial respiratory chain complex IV assembly
  evidence_type: IDA
  original_reference_id: PMID:34969438
  qualifier: involved_in
  review:
    summary: Based on a slight reduction of cytochrome c oxidase (together with complex I
      and ATP synthase) after siRNA knockdown of C12ORF73 in HEK293T cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The full text of PMID:34969438 was read. The only complex IV observation for
      C12ORF73 is a slight decrease in steady-state level after knockdown, reported in the
      same sentence as slight decreases in complex I and complex V; only complex III was
      significantly reduced, and the paper's own conclusions assign C12ORF73 a role in
      complex III (cytochrome c reductase) biogenesis only, attributing complex IV assembly
      to TMEM223. Such a small pleiotropic change is best explained as a secondary
      consequence of the complex III defect (complex III and IV are co-assembled in
      supercomplexes). In zebrafish knockouts complex IV activity is not significantly
      affected (PMID:32161263), and the mouse knockout work summarised by UniProt
      (PMID:35977508) reports complex IV subunits unaffected. UQCC6 is not shown to do any
      part of complex IV assembly. Because this is an experimental curation, it is flagged
      rather than removed.
    supported_by:
    - reference_id: PMID:34969438
      supporting_text: Knockdown of C12ORF73 impaired slightly the level of the
        NADH:ubiquinone oxidoreductase, cytochrome c oxidase, and the ATP synthase; however,
        the cytochrome c reductase was, similar to SMIM4 knockdown, significantly reduced
        (Figure 5E).
    - reference_id: PMID:34969438
      supporting_text: We show that TMEM223 is involved in assembly of the cytochrome c
        oxidase, while SMIM4 and the interacting C12ORF73 contribute to the biogenesis of
        the cytochrome c reductase.
    - reference_id: PMID:32161263
      supporting_text: while CI, CII, and CIV activities were not significantly affected
