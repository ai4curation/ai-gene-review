    label: extracellular region
  - id: GO:0009986
    label: cell surface
  supported_by:
  - reference_id: PMID:12782713
    supporting_text: MIF binds to the extracellular domain of CD74, and CD74 is required
      for MIF-induced activation of the extracellular signal-regulated kinase-1/2
      MAP kinase cascade, cell proliferation, and PGE2 production.
  - reference_id: PMID:17045821
    supporting_text: These data establish CD44 as an integral member of the CD74 receptor
      complex leading to MIF signal transduction.
- description: Non-cognate chemokine-like chemoattractant ligand that activates CXCR2
    and CXCR4 to promote leukocyte recruitment and cell migration.
  molecular_function:
    id: GO:0042056
    label: chemoattractant activity
  directly_involved_in:
  - id: GO:0050918
    label: positive chemotaxis
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:19602265
    supporting_text: Sharing an architectural 3D similarity with the atherogenic and
      angiogenic chemokine interleukin-8 (IL-8)/CXCL8, MIF was found to function as
      a non-cognate ligand of CXCR2 and as chemokine-like function (CLF) chemokine.
      Inflammatory leukocyte recruitment is dependent on MIF-CXCR2 and MIF-CXCR4 interactions
      [5].
- description: Homotrimeric keto-enol tautomerase and isomerase that catalyzes the
    tautomerization of phenylpyruvate and the isomerization of D-dopachrome via its
    catalytic N-terminal Pro-2 residue.
  molecular_function:
    id: GO:0050178
    label: phenylpyruvate tautomerase activity
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:11439086
    supporting_text: The catalytic specificity of recombinant TsMIF in the ketonization
      of phenylpyruvate (1.4x10(6) M(-1) x s(-1)) was comparable with that of human
      MIF, while that of p-hydroxyphenylpyruvate (9.1x10(4) M(-1) x s(-1)) was 71-fold
      lower.
  - reference_id: PMID:17526494
    supporting_text: We studied the crystal structures of MIF.OXIM-based inhibitors
      and found two opposite orientations for binding to the active site that were
      dependent on the chemical structures of an R-group. One orientation was completely
      unexpected based on previous studies with hydroxyphenylpyruvate and (S,R)-3-(4-hydroxyphenyl)-4,5-dihydro-5-isoxazole
      acetic acid methyl ester (ISO-1).
  - reference_id: PMID:21817065
    supporting_text: D-DT was named for its ability to tautomerize the nonnaturally
      occurring, D -stereoisomer of dopachrome, which is a catalytic property shared
      with MIF.
