- id: PMID:16285950
  title: Macrophage migration inhibitory factor promotes intestinal tumorigenesis.
  findings:
  - statement: MIF expression and phenylpyruvate tautomerase activity are elevated
      in human colorectal adenomas.
    supporting_text: MIF expression and tautomerase activity were increased in human
      and ApcMin/+ mouse intestinal adenomas compared with adjacent normal mucosa.
- id: PMID:17045821
  title: CD44 is the signaling component of the macrophage migration inhibitory factor-CD74
    receptor complex.
  findings:
  - statement: CD44 forms a signaling receptor complex with CD74 that is required
      for MIF-induced Src and ERK1/2 activation and protection from p53-dependent
      apoptosis.
    supporting_text: CD74 alone mediated MIF binding; however, MIF-induced ERK1 and
      ERK2 kinase phosphorylation required the coexpression of full-length CD44.
- id: PMID:17526494
  title: Alternative chemical modifications reverse the binding orientation of a pharmacophore
    scaffold in the active site of macrophage migration inhibitory factor.
  findings:
  - statement: Crystal structures of human MIF complexed with carbonyloxime (OXIM)
      inhibitors characterize the catalytic active site and demonstrate that active-site
      inhibition abolishes MIF counter-regulation of glucocorticoids.
    supporting_text: We studied the crystal structures of MIF.OXIM-based inhibitors
      and found two opposite orientations for binding to the active site that were
      dependent on the chemical structures of an R-group. One orientation was completely
      unexpected based on previous studies with hydroxyphenylpyruvate and (S,R)-3-(4-hydroxyphenyl)-4,5-dihydro-5-isoxazole
      acetic acid methyl ester (ISO-1).
