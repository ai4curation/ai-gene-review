id: P14174
gene_symbol: MIF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Macrophage migration inhibitory factor (MIF) is a homotrimeric pleiotropic
  proinflammatory cytokine and phenylpyruvate/D-dopachrome tautomerase secreted via
  a non-classical leaderless export pathway. In the extracellular space, MIF functions
  as the high-affinity agonistic ligand for the cell-surface receptor CD74 (the MHC
  class II invariant chain), recruiting the signaling co-receptor CD44 to activate
  Src-family tyrosine kinases and the sustained ERK1/2 MAP kinase cascade, and also
  acts as a non-cognate chemoattractant ligand for the chemokine receptors CXCR2 and
  CXCR4. Through receptor-mediated signaling and intracellular interactions with COPS5/JAB1
  and TP53, MIF promotes leukocyte recruitment and activation, counter-regulates glucocorticoid
  immunosuppression, and suppresses p53-dependent apoptosis.
