suggested_questions:
- question: How do the tautomerase catalytic pocket and the CD74-binding surface of
    MIF allosterically couple in vivo, and does an endogenous small-molecule tautomerase
    substrate physiological regulate MIF-CD74 signaling?
- question: What determines the partition of extracellular MIF signaling between the
    canonical CD74-CD44 complex and non-cognate CXCR2/CXCR4 heterocomplexes across
    distinct leukocyte subsets?
suggested_experiments:
- description: Determine cryo-EM or crystal structures of the ternary MIF homotrimer
    bound to the CD74 ectodomain trimer and CD44 to resolve the exact stoichiometry
    and conformational coupling between the Pro-2 catalytic pocket and receptor activation.
  hypothesis: Binding of the MIF homotrimer to the CD74 trimer induces a conformational
    rearrangement in the membrane-proximal stalk of CD74 that exposes the CD44 interaction
    interface and triggers Src-family kinase recruitment.
  experiment_type: Cryo-EM and X-ray crystallography of the MIF-CD74-CD44 extracellular
    complex combined with site-directed mutagenesis.
