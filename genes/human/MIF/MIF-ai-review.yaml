  evidence_type: IDA
  original_reference_id: PMID:12782713
  qualifier: involved_in
  review:
    summary: MIF stimulates prostaglandin E2 production and secretion via CD74-dependent
      signaling rather than catalyzing prostaglandin biosynthesis directly.
    action: MODIFY
    reason: PMID:12782713 demonstrates that extracellular MIF binding to CD74 induces
      ERK1/2 activation and downstream PGE2 secretion into the medium. MIF is an upstream
      signaling cytokine rather than an enzyme in the prostaglandin biosynthetic pathway,
      so this annotation should be refined to positive regulation of prostaglandin
      secretion (GO:0032308), which MIF already carries.
    proposed_replacement_terms:
