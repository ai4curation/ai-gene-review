- id: PMID:12782713
  title: MIF signal transduction initiated by binding to CD74.
  findings:
  - statement: MIF binds the extracellular domain of cell-surface CD74 with nanomolar
      affinity (Kd ~ 9 nM) to initiate ERK1/2 MAP kinase activation, cell proliferation,
      and PGE2 production.
    supporting_text: MIF binds to the extracellular domain of CD74, and CD74 is required
      for MIF-induced activation of the extracellular signal-regulated kinase-1/2
      MAP kinase cascade, cell proliferation, and PGE2 production.
- id: PMID:15908412
  title: Macrophage migration inhibitory factor reduces the growth of virulent Mycobacterium
    tuberculosis in human macrophages.
