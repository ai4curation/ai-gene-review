    homolog of macrophage migration inhibitory factor (MIF).
  findings:
  - statement: MIF and its homolog DDT bind CD74 with nanomolar affinity to activate
      CD74-CD44-dependent ERK1/2 MAP kinase signaling and share a conserved N-terminal
      Pro-2 tautomerase catalytic site.
