- id: PMID:10562313
  title: A proinflammatory cytokine inhibits p53 tumor suppressor activity.
  findings:
  - statement: MIF bypasses p53-mediated growth arrest and apoptosis and suppresses
      p53 transcriptional activity.
    supporting_text: Treatment with MIF overcame p53 activity in three different biological
      assays, and suppressed its activity as a transcriptional activator.
- id: PMID:11089976
  title: Intracellular action of the cytokine MIF to modulate AP-1 activity and the
      cell cycle through Jab1.
  findings:
  - statement: Cytosolic MIF binds JAB1/COPS5 and inhibits JAB1-enhanced AP-1 and
      JNK activity.
    supporting_text: MIF colocalizes with Jab1 in the cytosol, and both endogenous
      and exogenously added MIF following endocytosis bind Jab1.
- id: PMID:11439086
  title: Macrophage migration inhibitory factor of the parasitic nematode Trichinella
    spiralis.
  findings:
  - statement: Human MIF and Trichinella spiralis MIF catalyze the ketonization of
      phenylpyruvate and p-hydroxyphenylpyruvate.
    supporting_text: The catalytic specificity of recombinant TsMIF in the ketonization
      of phenylpyruvate (1.4x10(6) M(-1) x s(-1)) was comparable with that of human
      MIF, while that of p-hydroxyphenylpyruvate (9.1x10(4) M(-1) x s(-1)) was 71-fold
      lower.
