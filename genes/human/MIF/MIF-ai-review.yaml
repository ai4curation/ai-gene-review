- term:
    id: GO:0035691
    label: macrophage migration inhibitory factor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:12782713
  qualifier: involved_in
  review:
    summary: MIF is the canonical agonistic cytokine ligand that initiates the macrophage
      migration inhibitory factor signaling pathway by binding to CD74 and recruiting
      CD44.
    action: NEW
    reason: MIF directly initiates the macrophage migration inhibitory factor signaling
      pathway (GO:0035691) by binding the extracellular domain of CD74 (Kd ~ 9 nM)
      and recruiting the co-receptor CD44 to trigger Src and ERK1/2 MAP kinase activation
      (PMID:12782713; PMID:17045821; PMID:21817065). In GOA, GO:0035691 is annotated
      to the receptor CD74 and the paralogous ligand DDT (from PMID:21817065), whereas
      MIF itself was only annotated to the parent term GO:0007166 (cell surface receptor
      signaling pathway) in 2003 before GO:0035691 was created.
    supported_by:
    - reference_id: PMID:12782713
      supporting_text: Using expression cloning and functional analysis, we report
        herein that CD74, a Type II transmembrane protein, is a high-affinity binding
        protein for MIF. MIF binds to the extracellular domain of CD74, and CD74 is
        required for MIF-induced activation of the extracellular signal-regulated
        kinase-1/2 MAP kinase cascade, cell proliferation, and PGE2 production.
    - reference_id: PMID:17045821
      supporting_text: These data establish CD44 as an integral member of the CD74
        receptor complex leading to MIF signal transduction.
    - reference_id: PMID:21817065
      supporting_text: We produced recombinant D-DT and demonstrate that it binds
        with high affinity to CD74, activates the ERK1/2 MAP kinase signaling cascade,
        and recapitulates many of the inflammatory functions of MIF, including modulation
        of macrophage migration and glucocorticoid-induced immunosuppression.
core_functions:
- description: Extracellular proinflammatory cytokine and agonistic ligand that binds
    the cell-surface receptor CD74 and recruits the signaling co-receptor CD44 to
    initiate the macrophage migration inhibitory factor signaling pathway and activate
    the ERK1/2 MAP kinase cascade.
  molecular_function:
