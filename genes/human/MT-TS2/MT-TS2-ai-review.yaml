id: URS00002C130C_9606
gene_symbol: MT-TS2
product_type: TRNA
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MT-TS2 encodes mitochondrial tRNA-Ser(AGY), one of the 22 transfer RNAs encoded by mitochondrial
  DNA. After excision from the polycistronic mtDNA transcript and post-transcriptional maturation, it
  is charged with serine by the corresponding mitochondrial aminoacyl-tRNA synthetase and, in the mitochondrial
  matrix, acts as the adaptor that reads the serine codons AGU and AGC (AGY) of the 13 mtDNA-encoded mRNAs
  on the mitoribosome, delivering serine to the growing polypeptide. It lacks the entire D-arm, an unusual
  structure among tRNAs, yet still functions in translation on the mitoribosome, although with lower activity
  than tRNA-Ser(UCN) in vitro. It is one of two mitochondrial serine isoacceptors (the other is encoded
  by MT-TS1). Pathogenic variants in MT-TS2, like those in other mt-tRNA genes, impair mitochondrial translation
  and oxidative phosphorylation and cause maternally inherited mitochondrial disease.
references:
- id: PMID:21910628
  title: 'Human mitochondrial tRNAs: biogenesis, function, structural aspects, and diseases.'
  findings:
  - statement: The 22 mtDNA-encoded tRNAs are used by the mitochondrial protein synthesis machinery to
      translate the 13 mtDNA-encoded mRNAs.
    supporting_text: These mRNAs are translated by the mitochondrial protein synthesis machinery, which
      uses the 22 species of mitochondrial tRNAs (mt tRNAs) encoded by mtDNA.
  - statement: mt tRNA genes are frequent sites of pathogenic point mutations.
    supporting_text: The genes encoding mt tRNAs are highly susceptible to point mutations, which are
      a primary cause of mitochondrial dysfunction and are associated with a wide range of pathologies.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Suzuki, Nagao and Suzuki 2011 Annu Rev Genet, review); abstract only.
      Covers all 22 mtDNA-encoded tRNAs collectively rather than this tRNA specifically.
- id: PMID:7219534
  title: Sequence and organization of the human mitochondrial genome.
  findings:
  - statement: The human mitochondrial genome encodes 22 tRNAs.
    supporting_text: The genes for the 12S and 16S rRNAs, 22 tRNAs, cytochrome c oxidase subunits I, II
      and III, ATPase subunit 6, cytochrome b and eight other predicted protein coding genes have been
      located.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Anderson et al. 1981 Nature); the reference human mtDNA sequence that
      located the 22 tRNA genes.
- id: PMID:11737263
  title: Translation ability of mitochondrial tRNAsSer with unusual secondary structures in an in vitro
    translation system of bovine mitochondria.
  findings:
  - statement: Mammalian mt tRNA-Ser(AGY) lacks the entire D arm.
    supporting_text: The mammalian mt tRNASerGCU for AGY codons (Y = C or U) lacks the entire D arm, whereas
      tRNASerUGA for UCN codons (N = A, G, C or U) has an extended anti-codon stem.
  - statement: The D-arm-less tRNA-Ser(AGY) is nevertheless capable of translation on the ribosome.
    supporting_text: Both mt tRNASerGCU and tRNASerUGA analogues with unusual secondary structure were
      found to be capable of translation on the ribosome.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Hanada et al. 2001 Genes Cells); abstract only. Experiments used bovine
      mitochondrial tRNA-Ser analogues and a bovine in vitro translation system, so the support for the
      human tRNA is by close mammalian homology.
existing_annotations:
- term:
    id: GO:0030533
    label: triplet codon-amino acid adaptor activity
  evidence_type: TAS
  review:
    summary: No GOA annotation exists for MT-TS2 (RNAcentral/Rfam2GO supplies GO:0030533 for some but
      not all mt-tRNA sequences). Proposed to record the canonical tRNA adaptor function.
    action: NEW
    reason: MT-TS2 is one of the 22 mtDNA-encoded tRNAs used by the mitochondrial translation machinery;
      the codon-anticodon adaptor function is carried out by the tRNA itself. The same term is assigned
      by Rfam2GO to sister mt-tRNAs (e.g. MT-TQ, MT-TH, MT-TS1).
    supported_by: &id001
    - reference_id: PMID:11737263
      supporting_text: Both mt tRNASerGCU and tRNASerUGA analogues with unusual secondary structure were
        found to be capable of translation on the ribosome.
    - reference_id: PMID:21910628
      supporting_text: These mRNAs are translated by the mitochondrial protein synthesis machinery, which
        uses the 22 species of mitochondrial tRNAs (mt tRNAs) encoded by mtDNA.
- term:
    id: GO:0032543
    label: mitochondrial translation
  evidence_type: TAS
  review:
    summary: Proposed process annotation for the mitochondrial tRNA.
    action: NEW
    reason: The tRNA directly performs the decoding step of mitochondrial translation (it is not merely
      required for it), so involved_in mitochondrial translation is appropriate; this is the specific
      child of translation that sister mt-tRNAs receive via the MODIFY of their IEA translation annotation.
    supported_by: *id001
core_functions:
- description: Ser-accepting tRNA that reads the serine codons AGU and AGC (AGY) of mtDNA-encoded mRNAs
    on the mitoribosome, delivering serine during mitochondrial translation.
  molecular_function:
    id: GO:0030533
    label: triplet codon-amino acid adaptor activity
  directly_involved_in:
  - id: GO:0032543
    label: mitochondrial translation
  supported_by: *id001
suggested_questions:
- question: Should GO annotate all 22 mtDNA-encoded tRNAs, including MT-TS2, uniformly to triplet codon-amino
    acid adaptor activity and mitochondrial translation, rather than relying on Rfam2GO coverage that
    varies between mt-tRNA sequences?
  experts:
  - GO RNA annotation curators
