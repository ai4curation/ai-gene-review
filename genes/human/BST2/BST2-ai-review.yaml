core_functions:
- description: Interferon-induced virion tether. Using its two membrane anchors in a disulfide-linked
    homodimer, BST2 physically retains budding enveloped virions at the host plasma membrane, suppressing
    their release and dissemination.
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0009986
    label: cell surface
  - id: GO:0045121
    label: membrane raft
  directly_involved_in:
  - id: GO:0044790
    label: suppression of viral release by host
  - id: GO:0051607
    label: defense response to virus
  supported_by:
  - reference_id: PMID:19879838
    supporting_text: Tetherin inhibits HIV-1 release by directly tethering virions to cells
  - reference_id: PMID:20399176
    supporting_text: The restriction factor BST-2/tetherin contains two membrane anchors employed to retain
      some enveloped viruses, including HIV-1 tethered to the plasma membrane in the absence of virus-encoded
      antagonists
- description: Inhibitor of the cell-surface metalloprotease MT1-MMP (MMP14), binding its C-terminus to
    reduce MMP2 activation and restrain cell growth and migration.
  molecular_function:
    id: GO:0008191
    label: metalloendopeptidase inhibitor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:22065321
    supporting_text: decrease the activity of MMP2 via binding to cellular MT1-MMP on its C-terminus and
      inhibiting its proteolytic activity
suggested_questions:
- question: How is the balance between BST2 virion tethering, MT1-MMP inhibition and ILT7 signaling set
    in different cell types?
suggested_experiments:
- description: Domain-swap/GPI-anchor mutants of BST2 in polarized cells to separate apical tethering
    from TGN recycling, scored by surface biotinylation and virion-release assays.
