    label: metalloendopeptidase inhibitor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000390342
  - UniProtKB:Q10589
  review:
    summary: Metalloendopeptidase inhibitor activity. BST2 binds MT1-MMP and inhibits its proteolytic
      activity.
    action: ACCEPT
    reason: BST2 binds the C-terminus of cellular MT1-MMP (MMP14) and inhibits its protease activity,
      lowering MMP2 activation. The IBA agrees. This is a genuine molecular function distinct from tethering.
    supported_by:
    - reference_id: PMID:22065321
      supporting_text: both transient and IFN-α induced BST-2 could decrease the activity of MMP2 via
        binding to cellular MT1-MMP on its C-terminus and inhibiting its proteolytic activity
