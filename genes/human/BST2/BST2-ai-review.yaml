id: Q10589
gene_symbol: BST2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'BST2 (tetherin, CD317) is an interferon-induced antiviral restriction factor with an unusual
  topology: an N-terminal cytoplasmic tail, a single transmembrane domain, an extracellular coiled-coil
  ectodomain, and a C-terminal GPI anchor, so both ends are embedded in membrane. It assembles as a disulfide-linked
  homodimer and localizes to the plasma membrane (lipid rafts, apical surface), the trans-Golgi network
  and endosomes. By inserting one membrane anchor into the budding virion and the other into the cell
  membrane, it physically tethers nascent enveloped virions to the cell surface, blocking the release
  of a broad range of viruses (HIV, other retroviruses, filoviruses, arenaviruses and others); HIV-1 Vpu
  antagonizes it. BST2 also inhibits the cell-surface metalloprotease MT1-MMP (MMP14), restraining cell
  growth and migration, and engages the pDC receptor ILT7/LILRA4 to limit interferon production.'
