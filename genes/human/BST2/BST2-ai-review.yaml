    id: GO:0044790
    label: suppression of viral release by host
  evidence_type: IDA
  original_reference_id: PMID:19879838
  qualifier: involved_in
  review:
    summary: BST2 directly tethers nascent enveloped virions to the cell, suppressing their release.
    action: NEW
    reason: 'The existing antiviral process terms (defense response to virus, negative regulation of intracellular
      transport of viral material) do not capture the specific mechanism: BST2 itself performs the work
      of retaining budding virions at the host membrane, which is exactly suppression of viral release
      by host. BST2 contributes the structure (two membrane anchors in the dimer, one in the virion and
      one in the cell) that the step depends on.'
    supported_by:
    - reference_id: PMID:19879838
      supporting_text: Tetherin inhibits HIV-1 release by directly tethering virions to cells
