id: Q13309
gene_symbol: SKP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SKP2 (also known as FBXL1 or p45-SKP2) is the F-box/leucine-rich-repeat substrate-recognition
  subunit of an SCF cullin-RING E3 ubiquitin ligase (SKP1-CUL1-RBX1-SKP2). Its N-terminal F-box binds
  SKP1, which tethers it to the CUL1 scaffold, while its C-terminal leucine-rich-repeat solenoid, together
  with the accessory subunit CKS1B, forms a composite receptor for phosphorylated degrons. SKP2 has no
  catalytic activity itself: it selects substrates and positions them near the RBX1-bound, ubiquitin-charged
  E2 enzyme. Its best-characterised substrate is the CDK inhibitor p27/CDKN1B phosphorylated on Thr187
  by cyclin E/A-CDK2; its K48-linked polyubiquitination and proteasomal destruction in late G1 releases
  CDK2 activity and commits the cell to S phase, forming a positive-feedback switch at the G1/S transition.
  Other substrates include p21/CDKN1A, p57, p130/RBL2, the replication factors CDT1 and ORC1, FOXO1, MYC,
  MKP-1/DUSP1, RAG2 and E-cadherin, and the protein is itself degraded by APC/C-CDH1 during G1 so that
  its abundance peaks at S phase. SKP2 also has a non-degradative activity: after DNA double-strand breaks
  it catalyses K63-linked ubiquitination of NBN/NBS1, which is required for NBS1-ATM interaction, ATM
  recruitment to damage foci and homologous-recombination repair. SKP2 acts mainly in the nucleoplasm;
  p300-mediated acetylation of lysines in its nuclear localisation signal, and AKT-dependent phosphorylation,
  redistribute a pool to the cytoplasm where it directs degradation of substrates such as E-cadherin.
  SKP2 abundance is frequently elevated in human tumours, where it correlates with low p27 levels and
  increased proliferation.'
