suggested_questions:
- question: Should the many SKP2 substrate interactions currently recorded as bare protein binding (p27/CDKN1B,
    p21/CDKN1A, CDT1, ORC1, MYC, DUSP1, E-cadherin, HCV NS5A) be re-curated as has_input on the SCF(SKP2)
    ligase activity in GO-CAM, rather than as GO:0005515 rows on SKP2?
- question: Which reported SKP2 substrates meet a GO-CAM standard of evidence (reconstituted ubiquitination
    plus degron mutant plus loss-of-function stabilisation), and which rest only on co-immunoprecipitation
    or overexpression and should stay uncurated?
- question: Is the acetylation-dependent SKP2 dimerisation a functional requirement for substrate selection
    (as suggested for other F-box proteins), and if so should a homodimerisation activity be modelled
    alongside the adaptor activity?
suggested_experiments:
- hypothesis: The CKS1B-dependent phosphodegron pocket is required only for a defined subset of SKP2 substrates
    (p27 and other CIP/KIP proteins), while LRR-only contacts suffice for others.
  description: Rescue SKP2-null cells with separation-of-function alleles (D331A, LRR-surface mutants)
    and quantify the stability and ubiquitination of a panel of candidate substrates by pulse-chase and
    ubiquitin-remnant proteomics.
  experiment_type: separation-of-function rescue with degradation proteomics
- hypothesis: SKP2-dependent K63-linked ubiquitination of NBN, and not its proteolytic activity, is what
    confers resistance to ionising radiation.
  description: Compare NBN ubiquitin-site mutants and an SKP2 allele defective for K63 chain output (E2
    pairing) for ATM autophosphorylation, ATM foci, HR reporter activity and IR survival, with p27 turnover
    measured in parallel as a specificity control.
  experiment_type: linkage-specific ubiquitination and DNA-repair assay
- hypothesis: Cytoplasmic relocalisation of SKP2 driven by NLS acetylation re-targets the ligase to a
    distinct substrate set.
  description: Compare the ubiquitinated proteomes of cells expressing NLS-acetylation-mimetic (K68/K71)
    and non-acetylatable SKP2 alleles after compartment fractionation, to test whether E-cadherin and
    other cytoplasmic substrates are specifically enriched.
  experiment_type: compartment-resolved ubiquitinome comparison
