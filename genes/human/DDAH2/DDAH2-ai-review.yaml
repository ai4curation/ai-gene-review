core_functions:
- description: >-
    Relocates to mitochondria after viral infection and promotes nitric-oxide-dependent
    DNM1L/Drp1 activation and mitochondrial fission, attenuating MAVS-mediated innate
    antiviral signaling. The direct DDAH2 substrate or molecular activity remains unknown.
  directly_involved_in:
  - id: GO:0090141
    label: positive regulation of mitochondrial fission
  locations:
  - id: GO:0005739
    label: mitochondrion
knowledge_gaps:
- gap_statement: The direct molecular activity and substrate through which DDAH2 induces nitric oxide production and Drp1 activation remain unresolved.
  boundary: DDAH2 does not detectably hydrolyze ADMA or L-NMMA, but viral infection relocalizes DDAH2 to mitochondria upstream of NO-activated Drp1 mitochondrial fission.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Resolving the substrate would explain how DDAH2 retained signaling biology after losing DDAH1-like dimethylargininase activity.
suggested_questions:
- question: What small molecule or protein substrate, if any, is hydrolyzed by DDAH2 at mitochondria after viral infection?
- question: How does mitochondrial DDAH2 stimulate NO production without detectable ADMA or L-NMMA dimethylargininase activity?
suggested_experiments:
- description: >-
    Perform untargeted metabolomics and activity-based hydrolase profiling after acute
    mitochondrial DDAH2 recruitment, comparing wild-type DDAH2 to DDAH1-equivalent
    catalytic-site mutants.
- description: >-
    Reconstitute the DDAH2-dependent NO/Drp1 response in MAVS-competent cells with
    mitochondrial-targeted and cytosol-restricted DDAH2 variants to test whether
    mitochondrial localization is sufficient for fission signaling.
