id: O95865
gene_symbol: DDAH2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DDAH2 is a DDAH-family hydrolase-like protein of unknown direct substrate. Unlike
  DDAH1, human DDAH2 has no detectable ADMA or L-NMMA dimethylargininase activity.
  It is cytoplasmic at baseline and can relocalize to mitochondria after viral
  infection, where it promotes nitric-oxide-dependent DNM1L/Drp1 activation and
  mitochondrial fission that dampens MAVS-mediated innate antiviral signaling.
