suggested_questions:
- question: Can the original PMID:17408621 cyclin-fragment assay be reconciled with the curated O95067/CCNB2
    partner, given that the exact recorded Figure 3A fragment matches indexed CCNB1 Methods/Results? Preserve
    the original partner until curator resolution.
- question: Do the original occurrence extensions for PMID:16862148 (GO:0005642 annulate lamellae) and
    PMID:20458337 (CL:0000639 basophil cell of anterior pituitary) reflect the intended peripheral-lamella/B-cell
    contexts? The binding and exosome assertions remain separate from these extension questions.
- question: Can the source-specific nuclear extension of the PMID:28297718 DND1 association be verified
    independently of the later PMID:30021884 nuclear crosslink experiment?
- question: Can the original FLNA target evidence resolve cadherin binding (PMID:25468996), positive NF-kappaB
    signaling (PMID:12761501), megakaryocyte development and calcium-store release (PMID:16293600), and
    the positive neural-precursor proliferation direction transferred from PMID:22076441?
- question: Does FLNA perform directed Fc gamma RI transport in addition to surface retention and lysosomal
    protection, and what explains the isolated in-vitro sign discrepancy in PMID:22307607?
- question: Which endogenous contexts distinguish the three natural FLNA products? Engineered deletions
    and proteolytic C-terminal fragments should be separated from natural splice products.
