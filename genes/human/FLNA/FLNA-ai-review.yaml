id: P21333
gene_symbol: FLNA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Filamin A is a large dimeric actin-binding scaffold that connects actin filaments into networks
  and couples the cortical cytoskeleton to membrane-associated proteins. Its N-terminal actin-binding
  region and repeated immunoglobulin-like domains support filament crosslinking and interactions with
  receptors, adhesion proteins and signaling partners. Filamin A organizes actin at the cell cortex and
  adhesion sites, contributing to cell shape, mechanical stability and context-dependent migration and
  signaling. Additional nuclear and neuronal pools participate in specialized cellular responses.
