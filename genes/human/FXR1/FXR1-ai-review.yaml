id: P51114
gene_symbol: FXR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FXR1 encodes an FMR/FXR-family RNA-binding protein that binds selected mRNAs and regulates
  their translation, stability and cytoplasmic organization. It recognizes AU-rich 3''-UTR elements in
  target transcripts such as TNF and cMYC, can destabilize inflammatory mRNAs in vascular smooth muscle
  cells, and can promote translation of selected mRNAs in quiescent, cancer and germ-cell contexts. FXR1
  also assembles a cytoplasmic mRNP condensate network that scaffolds RhoA-pathway proteins for actomyosin
  remodeling. A separate nuclear-envelope-associated pool prevents ectopic cytoplasmic nucleoporin condensation
  and contributes to nuclear pore localization. Tissue- and isoform-specific roles include skeletal-muscle
  development, late spermatid translational activation, stress-granule recruitment after PAK1 phosphorylation,
  and nucleolar targeting of exon-15-containing isoforms.'
