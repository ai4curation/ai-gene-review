    label: regulation of mRNA stability
  - id: GO:0045727
    label: positive regulation of translation
  - id: GO:0061157
    label: mRNA destabilization
  locations:
  - id: GO:0036464
    label: cytoplasmic ribonucleoprotein granule
  supported_by:
  - reference_id: PMID:17382880
  - reference_id: PMID:30067974
  - reference_id: PMID:34731628
  - reference_id: PMID:7781595
- description: FXR1 assembles a cytoplasmic messenger ribonucleoprotein condensate network on long
    mRNAs. The network scaffolds FXR1 and associated proteins and supports RhoA-induced actomyosin
    remodeling by maintaining proximity between ROCK and non-muscle myosin II substrates.
  molecular_function:
    id: GO:0140693
    label: molecular condensate scaffold activity
  directly_involved_in:
  - id: GO:0140694
    label: membraneless organelle assembly
  - id: GO:0035025
    label: positive regulation of Rho protein signal transduction
  locations:
  - id: GO:0036464
    label: cytoplasmic ribonucleoprotein granule
  supported_by:
  - reference_id: PMID:39106863
- description: FXR1 localizes to the nuclear envelope and prevents ectopic condensation of soluble
    nucleoporins in the cytoplasm, thereby contributing to nuclear pore complex localization during
    early interphase.
  molecular_function:
    id: GO:0003723
    label: RNA binding
  directly_involved_in:
