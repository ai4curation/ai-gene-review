core_functions:
- description: FXR1 binds mRNAs through conserved KH/RGG-containing RNA-binding regions and
    regulates selected target 3'-UTRs. In human cells it binds TNF and cMYC 3'-UTR elements and can
    either destabilize inflammatory transcripts or promote translation depending on the target and
    cellular setting.
  molecular_function:
    id: GO:0003729
    label: mRNA binding
  directly_involved_in:
