suggested_questions:
- question: Which MYOD-family dimerization partners and chromatin cofactors define the direct human target-gene set of MYF5 rather than indirect differentiation-state effects?
suggested_experiments:
- hypothesis: Endogenous MYF5 directly controls a subset of E-box-bound skeletal-muscle cis-regulatory regions in primary human myoblasts.
  description: Perturb MYF5 in primary human myoblasts and combine CUT&RUN or CUT&Tag for the tagged endogenous protein with nascent RNA profiling to separate direct E-box-bound targets from secondary differentiation outputs.
  experiment_type: endogenous CUT&RUN and nascent transcriptomics
