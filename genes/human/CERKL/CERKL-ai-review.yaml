  review:
    summary: Do not infer CERKL catalytic activity from its kinase-family homology.
    action: REMOVE
    reason: The official current IPR001206 record genuinely maps its DAG-kinase catalytic-domain
      signature to GO:0016301, so the source chain is faithful. A domain match alone nevertheless
      does not establish catalysis in CERKL. Full target-specific studies PMID:19158957 and
      PMID:23501591 repeatedly failed to detect CERKL-dependent phosphorylation with working
      CERK controls across standard/retinal lipids and broader substrate panels. The source-supported
      lipid/RNA-related roles are separate from a kinase mechanism. Reject this catalytic
      transfer to CERKL rather than recasting the domain mapping as a typo. The negative assays
      are scoped to the tested constructs, substrates and conditions; they do not establish
      that every CERKL product is catalytically inactive on every possible substrate. Preserve
      the original source fields and do not create a NOT assertion.
