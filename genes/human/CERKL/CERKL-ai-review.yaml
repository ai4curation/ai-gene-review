id: Q49MI3
gene_symbol: CERKL
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CERKL is a retinal-disease-associated intracellular protein with multiple alternative
  products and dynamic nuclear and cytoplasmic distributions. The human 532-amino-acid CERKLa
  product binds mRNA directly through its N-terminal region and associates with compact messenger
  ribonucleoprotein particles. CERKL also supports resistance to oxidative-stress-induced
  apoptosis, with reported connections to thioredoxin redox state and SIRT1 stability. Sphingolipid
  association has been detected in protein-lipid overlays, but repeated assays have not established
  a kinase activity despite its kinase-family domain. Autophagy effects vary with cellular
  context, and the molecular connection between its RNA/lipid interactions and retinal protection
  remains unresolved.
