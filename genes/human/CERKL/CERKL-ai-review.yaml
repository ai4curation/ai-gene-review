core_functions:
- description: The human CERKLa product binds mRNA through its N-terminal region and associates
    with cytoplasmic compact messenger ribonucleoprotein particles. Direct binding was established
    with purified His-MBP-tagged Q49MI3-2 protein; cellular shuttling and granule associations
    supply context, while specific transcript selection, cap recognition and transport remain
    unresolved.
  molecular_function:
    id: GO:0003729
    label: mRNA binding
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:24498393
    supporting_text: Only the first peptide interacted with the mRNAs
- description: CERKL supports resistance to oxidative-stress-induced apoptosis. Human CERKLa
    reduces PARP cleavage in a 300 micromolar hydrogen-peroxide challenge over 12-24 hours;
    thioredoxin association and SIRT1 stability are reported regulatory connections. This
    protective role has no established intrinsic antioxidant or caspase-inhibitor molecular
    activity, and direct mRNA binding has not been shown to cause the survival effect.
  directly_involved_in:
  - id: GO:0043066
    label: negative regulation of apoptotic process
  supported_by:
  - reference_id: PMID:19158957
    supporting_text: preventing cells from entering apoptosis
  - reference_id: PMID:24735978
suggested_questions:
- question: Which endogenous mRNAs are bound by CERKLa, and is RNA binding necessary for oxidative-stress
    protection independently of its protein interactions?
  experts: []
- question: Which substrates or conditions, if any, support catalytic activity in sequence-defined
    CERKL products, despite repeated negative lipid-kinase assays?
  experts: []
- question: What explains opposite CERKL-dependent autophagy outcomes in retinal epithelial
    versus pancreatic cancer cells, and how do product identity and SIRT1 or lipid context
    contribute?
  experts: []
- question: Is nucleolar accumulation physiological in any retinal cell state, or chiefly
    a property of particular expressed products and overexpression conditions?
  experts: []
- question: Should the human CERKLa protein-lipid overlay in PMID:23501591 Figure 8 be captured
    as a direct human experimental sphingolipid-binding annotation, while retaining its lysate-association
    limits, instead of relying only on the current mouse-donor electronic transfer?
  experts: []
suggested_experiments:
- description: Compare matched expression of sequence-defined CERKL products in retinal cells
    using RNA-contact assays and rescue with RNA-binding-defective constructs; quantify PARP
    cleavage separately from RNA localization and stress-granule formation.
- description: Reconstitute binding to defined mRNAs and lipids with purified, tag-controlled
    CERKL products, measuring direct affinity independently from catalytic phosphate transfer
    under explicit substrate/cofactor panels.
- description: Compare CERKL perturbation in retinal and pancreatic cells using matched products,
    autophagic-flux controls, SIRT1 turnover and PI/PI3P measurements to distinguish cell
    context from product-specific mechanisms.
