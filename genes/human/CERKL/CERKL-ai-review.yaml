  title: Overexpression of CERKL, a gene responsible for retinitis pigmentosa in humans, protects
    cells from apoptosis induced by oxidative stress.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full selected kinase, localization and cell-death Methods/Results read.
      Four cloned human retinal a/b/c/d products are not all eight current products. CERK-positive-control
      kinase assays are negative; HeLa PARP protection has defined dose/time/stimulus limits.
      COS-7 propidium iodide is not apoptosis-specific. Localization Results, Figure 4E/5
      legends and the corresponding imaging/fractionation Methods explicitly support nonexclusive
      ER/Golgi overlap in transfected COS-7/HeLa assays. The no-precise-overlap statement
      concerns endosome/mitochondrial markers. Neither native retinal localization nor exclusive
      residence is established.
