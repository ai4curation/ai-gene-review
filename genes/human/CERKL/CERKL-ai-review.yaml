    label: sphingolipid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:A2AQH1
  - ensembl:ENSMUSP00000114325
  review:
    summary: CERKL associates with selected sphingolipids in protein-lipid overlays.
    action: KEEP_AS_NON_CORE
    reason: 'The exact mouse donor A2AQH1 annotation traces to PMID:23501591. Its Figure 8
      directly tests lysates of human HEK293T cells expressing human CERKLa or a mixture of
      four retinal products against immobilized lipids: sphingomyelin, glucosylceramide and
      galactosylceramide are positive, whereas the empty-vector background excludes the retinoic-acid
      signal. Retain binding at this assay resolution; the experiment does not isolate a purified
      binary interaction or establish lipid transport/catalysis. Earlier PMID:19158957 reported
      negative overlays with both purified GST-CERKLa and transfected HEK293T lysate, so binding
      is not uniformly observed across protocols. The retina lipidomics model retains roughly
      35% Cerkl transcription and is a knockdown rather than a complete null. The source transfer
      remains an unchanged mouse-donor IEA; the independently inspected positive lipid-overlay
      experiment itself used human CERKLa-containing lysate. Its negative lipid panel included
      ceramide, lactosylceramide, GM1 and free fatty acids, so this is not unrestricted lipid
      recognition.'
    supported_by:
    - reference_id: PMID:23501591
      supporting_text: CERKL consistently recognized SM, GlcCer
    - reference_id: PMID:19158957
