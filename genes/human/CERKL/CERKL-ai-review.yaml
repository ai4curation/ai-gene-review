  review:
    summary: CERKL reduces oxidative-stress-induced apoptosis in a defined human cell assay.
    action: ACCEPT
    reason: PMID:19158957 Figure 7 measures caspase-dependent PARP cleavage in human HeLa
      cells expressing human 532-aa CERKLa. Protection occurs at 300 micromolar hydrogen peroxide
      over 12-24 hours, but not significantly at 400 micromolar, at 48 hours, or with the
      other tested death stimuli. The separate COS-7 propidium-iodide readout includes necrotic
      as well as apoptotic death. These target experiments support the conserved negative-apoptosis
      assertion without assigning direct antioxidant chemistry or caspase inhibition. The
      PAINT node history was not reconstructed; self-target evidence is valid.
    supported_by:
