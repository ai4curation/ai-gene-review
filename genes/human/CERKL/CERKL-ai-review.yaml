  review:
    summary: Do not infer CERKL catalytic activity from its kinase-family homology.
    action: REMOVE
    reason: The PAINT assertion predicts lipid phosphorylation, but target-specific primary
      assays argue against transferring that catalytic function to CERKL. PMID:19158957 tested
      four human retinal CERKL variants in cell lysates and purified GST formats, with CERK
      controls, standard and photoreceptor-derived lipid substrates; long human variants were
      also tested by cellular phosphate labeling in murine 661W cells. No CERKL-dependent
      phosphorylation was detected. PMID:23501591 extended testing to very-long-chain ceramides
      and mixed-lipid phosphorus assays without positive CERKL activity. This is a target-function
      objection, not an objection to the number or identities of extant PAINT sources. PTN002285910
      historical node placement was not reconstructed. The negative assays are scoped to the
      tested constructs, substrates and conditions; they do not establish that every CERKL
      product is catalytically inactive on every possible substrate. Preserve the original
      source fields and do not create a NOT assertion.
    supported_by:
    - reference_id: PMID:19158957
      supporting_text: No kinase activity was detected
    - reference_id: PMID:23501591
    - reference_id: PMID:22678504
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002285910
        source_status: UNRESOLVED
        comment: Exact ancestral node is preserved from GOA. Historical node placement and
          its original experimental-evidence set were not reconstructed; rejection rests on
          target-specific functional assays rather than a claimed error in extant sources.
