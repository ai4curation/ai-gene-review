core_functions:
- description: Heavily glycosylated LAMP-family membrane protein of macrophage late endosomes and lysosomes,
    with a mucin-like ectodomain facing the organelle lumen (and the extracellular space in the surface
    pool). No catalytic or receptor activity has been established, so no molecular function term is asserted;
    the protein is best characterized as a lineage-restricted structural component of the macrophage endosomal/lysosomal
    membrane system.
  locations:
  - id: GO:0005765
    label: lysosomal membrane
  - id: GO:0031902
    label: late endosome membrane
  supported_by:
  - reference_id: PMID:7680921
    supporting_text: a membrane proximal domain that has significant sequence homology to a family of
      lysosomal/plasma membrane shuttling proteins known as the lamp 1 group
  - reference_id: file:human/CD68/CD68-uniprot.txt
    supporting_text: 'SUBCELLULAR LOCATION: [Isoform Long]: Endosome membrane; Single-pass'
suggested_questions:
- question: Does CD68 have any demonstrable ligand-binding activity in human cells, for example for tissue
    lectins, selectins or oxidized LDL, or is its mucin-like ectodomain purely structural?
- question: What fraction of CD68 is at the plasma membrane in resting versus activated human macrophages,
    and is that pool isoform-specific (short versus long)?
suggested_experiments:
- hypothesis: The CD68 surface pool is isoform-dependent and sufficient for antibody targeting of macrophages
    in situ.
  description: Express tagged long and short isoforms in human macrophages, quantify surface versus total
    protein by pH-sensitive fluorescent tags and surface biotinylation, and test accessibility of anti-CD68
    antibodies on intact versus permeabilized cells.
- hypothesis: CD68 contributes to lysosomal handling of phagocytosed oxidized LDL.
  description: Knock out CD68 in human monocyte-derived macrophages and compare uptake, lysosomal delivery
    and degradation of labelled oxidized LDL with wild-type cells, with rescue by each isoform.
