id: P34810
gene_symbol: CD68
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD68 (macrosialin in mouse) is a heavily glycosylated type I transmembrane protein of the
  LAMP family that is strongly and almost selectively expressed by monocytes, tissue macrophages and microglia,
  where it is the standard histological marker of the lineage. Its 298-residue ectodomain comprises a
  membrane-distal mucin-like region rich in serine and threonine with tandem repeats, a proline hinge,
  and a membrane-proximal LAMP-like domain; a short cytoplasmic tail carries lysosomal targeting information.
  The long isoform is predominantly on late endosomal and lysosomal membranes, consistent with the strongly
  granular cytoplasmic staining seen in macrophages, while a short isoform and a recirculating pool reach
  the plasma membrane. Its molecular function is not established; proposed roles include binding of tissue
  lectins or selectins and participation in the endosomal/lysosomal handling of phagocytosed material,
  including oxidized LDL in macrophage foam cells.
