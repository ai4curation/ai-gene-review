- term:
    id: GO:0006809
    label: nitric oxide biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q64429
  - ensembl:ENSMUSP00000024894
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: The donor study establishes NO regulation but not a CYP1B1-performed NO biosynthetic step.
    reason: 'The exact mouse Q64429 IMP source PMID:20032512 establishes regulation of endothelial NO
      availability: chronic Cyp1b1 knockout or siRNA reduces eNOS expression and NO-associated fluorescence,
      whereas acute CYP1B1 restoration raises NO availability without restoring eNOS. The DAF-FM assay
      reports NO-associated species, and the original retains synthesis and bioavailability as alternatives.
      The measured effects are consistent with redox/eNOS regulation, but no CYP1B1-performed chemical
      step, structural contribution or cofactor contribution to NO formation is established. The specific
      biosynthetic-process transfer therefore exceeds the performed role resolved by this source and is
      over-annotated. This does not deny the positive endothelial regulatory effects, prove that NO synthesis
      is unaffected, or require every valid participant in biosynthesis to be an NO synthase. No narrower
      regulation annotation is proposed because synthesis versus preservation remains unresolved.'
    supported_by:
    - reference_id: GO_REF:0000107
    - reference_id: PMID:20032512
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: UniProtKB:Q64429
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The genuine mouse IMP source supports endothelial NO regulation; the inference that CYP1B1
          performs a biosynthetic step is stronger than the resolved regulatory evidence. The experimental
          phenotype and donor identity remain positive.
      failure_modes:
      - ROLE_CONFLATION
