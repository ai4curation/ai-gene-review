    action: KEEP_AS_NON_CORE
    summary: CYP1B1 contributes to trabecular-meshwork development and maintenance.
    reason: 'The exact Q64429 mouse IMP record is supported by 23979599: Cyp1b1 loss alters trabecular-meshwork
      collagen organization, periostin expression and oxidative-stress responses. Human TM1 knockdown
      experiments provide additional cell-context evidence, while NAC and periostin experiments connect
      the phenotype to redox-dependent extracellular-matrix organization. Retain the developmental role
