- term:
    id: GO:0004497
    label: monooxygenase activity
  evidence_type: IDA
  original_reference_id: PMID:15258110
  qualifier: enables
  review:
    action: MODIFY
    summary: The arachidonate and retinoid assays support a reduced-flavoprotein-dependent monooxygenase.
    reason: The human CYP1B1 retinoid and arachidonate assays directly demonstrate NADPH/POR-supported
      monooxygenation. GO:0016712 identifies the immediate reduced-flavoprotein electron donor more precisely
      while retaining substrate breadth. The reconstituted system used rabbit POR and an N-terminally
      modified human enzyme; the human CYP1B1 Supersome product pattern corroborated the arachidonate
      result. GO:0016712 is already represented by other retained source assertions; this replacement
      refines the donor-dependent chemistry of this source and does not add a separate activity.
    supported_by:
    - reference_id: PMID:15258110
    proposed_replacement_terms:
    - id: GO:0016712
      label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular
        oxygen, reduced flavin or flavoprotein as one donor, and incorporation of one atom of oxygen
