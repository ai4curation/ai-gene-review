id: Q16678
gene_symbol: CYP1B1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CYP1B1 is a 543-residue, heme-dependent cytochrome P450 associated with the endoplasmic-reticulum
  membrane. With reducing equivalents supplied by NADPH-cytochrome P450 reductase, it oxidizes estrogens,
  retinoids, arachidonic acid and diverse xenobiotics. Human CYP1B1 preferentially forms 4-hydroxylated
  estrogens in studied enzyme systems and generates both hydroxylated and epoxidized fatty-acid products.
  It also converts fatty-acid hydroperoxides to oxo products through a distinct dehydration reaction demonstrated
  without added NADPH. These metabolic activities influence local redox balance and vascular and extracellular-matrix
  behavior; loss of function is associated with primary congenital glaucoma. Mitochondrial association
  has been demonstrated under induced conditions in mouse tissues, while its human physiological substrate
  and compartment contributions remain context dependent.
