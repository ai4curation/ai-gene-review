- term:
    id: GO:0008631
    label: intrinsic apoptotic signaling pathway in response to oxidative stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q64429
  - ensembl:ENSMUSP00000024894
  review:
    action: UNDECIDED
    summary: The specific oxidative intrinsic-apoptosis route is unresolved.
    reason: 'PMID:23568032 provides positive intrinsic-apoptosis context: Cyp1b1-null mouse pericytes
      have lower Bax and Bim expression and lower basal/staurosporine caspase-3/7 activity. Discussion
      explicitly proposes Bax/Bim loss as one explanation and increased Akt phosphorylation as another.
      The same cells have higher DHE-detected oxidative stress and lower viability after peroxide; NAC
      lowers the ROS signal, but the reported NAC experiment does not rescue an apoptotic endpoint or
      establish a ROS-to-Bax/Bim causal chain. Methods mention peroxide in the caspase protocol, while
      the reported Figure 3 comparison is basal/staurosporine and Figure 4 reports peroxide viability/ROS;
      Methods and Results also differ in peroxide viability dose. Thus the positive intrinsic machinery
      and redox observations remain insufficiently connected to resolve this specific oxidative-stress-induced
      intrinsic signaling route. The additional PMID:23979599 mouse trabecular-meshwork experiments directly
      show increased caspase-3/7 after peroxide or staurosporine in knockout cells, but do not independently
      identify the initiating intrinsic route. Retain UNDECIDED for this exact transfer while preserving
      both positive contexts; accessible full text does not eliminate biological uncertainty.'
    supported_by:
    - reference_id: GO_REF:0000107
    - reference_id: PMID:23568032
    - reference_id: PMID:23979599
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: UniProtKB:Q64429
        source_status: UNRESOLVED
        comment: The genuine mouse experimental sources support apoptosis/redox phenotypes and intrinsic-pathway
          context; the oxidative trigger-to-intrinsic signaling connection remains unresolved for this
          specific term.
