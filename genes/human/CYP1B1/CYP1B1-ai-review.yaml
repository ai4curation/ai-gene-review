- term:
    id: GO:0005506
    label: iron ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001128
  - InterPro:IPR002401
  - InterPro:IPR017972
  - InterPro:IPR036396
  review:
    action: ACCEPT
    summary: Catalytic heme supplies the iron cofactor.
    reason: CYP1B1 is a heme-thiolate enzyme whose catalytic heme contains iron. The authenticated official
      sequence has the heme axial-ligand cysteine at residue 470, and the human engineered CYP1B1 crystal
      structure contains heme. Retain iron-cofactor binding without implying transport, storage or a separate
      physiological iron-handling function.
    supported_by:
    - reference_id: GO_REF:0000002
    - reference_id: PMID:21147782
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: InterPro:IPR001128
        source_status: SUPPORTS_TRANSFER
        comment: The literal source and target identity were checked; biological and assay limits are
          described in the reason.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:28620713
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q02763
  review:
    action: MODIFY
    summary: CYP1B1 associates with the receptor tyrosine kinase TEK.
    reason: All six current literal IntAct records for the original Q16678/Q02763 pair agree with the
      inspected 28620713 co-immunoprecipitation study. HA-TEK and GFP-CYP1B1 associate in HEK293 cells;
      TEK intracellular residues 816–1124 retain the strong association whereas the extracellular fragment
      binds weakly. Official Q02763 is the angiopoietin receptor tyrosine kinase. GO:0030971 captures
      the experimentally supported partner class. Co-immunoprecipitation does not establish a purified
      binary interface, ligand agonism or activation of TEK by CYP1B1.
    supported_by:
    - reference_id: PMID:28620713
      supporting_text: 'the interactions of TEK and CYP1B1 by co-transfection and pull-down assays in

        HEK293 cells.'
    proposed_replacement_terms:
    - id: GO:0030971
      label: receptor tyrosine kinase binding
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:88590
  - PANTHER:PTN001210461
  - RGD:2458
  review:
    action: KEEP_AS_NON_CORE
    summary: Mitochondrial association is supported in a conditional mouse context.
    reason: The traced Q64429 IMP evidence in 23692925 uses female mouse WT/knockout tissues and TCDD
      induction. ER- and mitochondria-enriched fractions contain the induced CYP1B1 band, with knockout
      specificity controls and acknowledged fraction cross-contamination. Human HPA staining is labeled
      uncertain, not a strong independent localization assay. Retain mitochondrial association as contextual
      ortholog inference without a constitutive human mitochondrial core, an established import-cleavage
      site or a membrane-topology claim. The actual PTN001210461 mitochondrial IBD is on the reconstructed
      target path; its mouse and rat sources are not interpreted as pairwise similarity scores. ORGANELLES check (2026-10-25), the action holds. The ER/MAM confound is addressed in
      PMID:23692925, which used nonhepatic tissues, the microsomal marker POR and the
      mitochondrial marker PHB, and the internal control of Cyp1a1(mc/mc) mice whose ER-only
      CYP1A1 was absent from the mitochondrial fraction; TCDD-induced CYP1B1 was in both
      fractions and absent from Cyp1b1 knockouts. The organelle claim is therefore supported for
      the mouse ortholog, as an inducible, minor pool beside the ER. Stays at the root (rule 4).
      The only sub-mitochondrial line is by analogy to CYP1A1, which the Avadhani work places in
      the inner membrane via an N-terminal signal; no sub-mitochondrial assay exists for CYP1B1,
      and its UniProt topology is a peripheral ER-membrane protein. PAINT check, PTN001210461
      (taxon 6072) has two GO:0005739 IBD seeds, MGI:88590 (mouse Cyp1b1, the PMID:23692925
      data) and RGD:2458 (rat Cyp1a1), both direct mitochondrial cases, so the node placement is
      reasonable. Qualifier note (is_active_in), this review does not show CYP1B1 activity in
      the organelle; PMID:23692925 detects protein only, and mitochondrial monooxygenase
      activity with adrenodoxin is established for CYP1A1, not CYP1B1, so located_in would be
      the claim the evidence supports.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:23692925
      supporting_text: inducible CYP1B1 protein (60,581 Da) was more abundant in ER than MT in lung, spleen and uterus of TCDD-treated 1A1 KO, mt1A1, mc1A1, and WT mice
    - reference_id: PMID:23692925
      supporting_text: Inclusion of the microsomal marker POR and mitochondrial marker PHB
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN001210461
        source_status: SUPPORTS_TRANSFER
        comment: Literal IBD lies on the reconstructed Q16678 path; raw WITH/FROM and aspect are separately
          checked.
