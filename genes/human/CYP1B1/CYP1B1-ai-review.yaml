suggested_questions:
- question: Which endogenous CYP1B1 substrate reaction connects its catalytic activity to trabecular-meshwork
    matrix organization and glaucoma?
- question: How much does human CYP1B1 hydroperoxide dehydration contribute to oxo-lipid production in
    intact tissues, and how does this compare with its monooxygenase flux?
- question: Can compartment-resolved human experiments establish the conditions and catalytic partners
    of mitochondrial CYP1B1 without relying on tissue-fraction carryover?
- question: Do the endothelial NO and pericyte STAT3 phenotypes reflect altered synthesis, bioavailability
    or specific receptor pathways, and which CYP1B1 metabolites mediate them?
- question: Should the directly measured RHEA:47280 estradiol 4-hydroxylase reaction receive a specific
    GO molecular-function term under steroid hydroxylase activity, or is an equivalent current term or
    mapping located outside the inspected steroid-hydroxylase closure?
suggested_experiments:
- description: Use human trabecular-meshwork cells with endogenous CYP1B1 loss and catalytic rescue, coupled
    to isotope-resolved steroid/retinoid/lipid metabolomics and matrix-organization measurements, to identify
    a performed metabolite step underlying the developmental phenotype.
- description: Measure purified human CYP1B1 hydroperoxide turnover with independently varied POR, NADPH
    and oxygen conditions, then test the validated products in endogenous cellular flux experiments.
- description: Quantify human mitochondrial versus ER CYP1B1 by orthogonal localization and protease-protection
    controls while measuring compartment-specific activity; distinguish intact native protein from engineered
    N-terminal constructs.
proposed_new_terms:
- proposed_name: estradiol 4-hydroxylase activity
  proposed_definition: 'Catalysis of the reaction: 17beta-estradiol + reduced [NADPH--hemoprotein reductase]
    + O2 = 4-hydroxy-17beta-estradiol + oxidized [NADPH--hemoprotein reductase] + H2O + H(+).'
  justification: Human CYP1B1 product-resolved assays directly establish this reaction and distinguish
    it from the existing estrogen 2-hydroxylase activity GO:0101021. The official RHEA:47280 reaction
    supplies the chemical mapping. On 2026-10-16 the complete returned is_a closure of GO:0008395 contained
    38 terms including the parent, with no C4-specific estrogen or estradiol hydroxylase member. Broad
    keyword results are not treated as an exhaustive search of all GO; ontology maintainers should check
    an equivalent term or mapping elsewhere before creating this proposed term. The reduced-flavoprotein
    donor class GO:0016712 is also relevant. This proposal assigns no new GO identifier and creates no
    NEW annotation.
  proposed_parent:
    id: GO:0008395
    label: steroid hydroxylase activity
