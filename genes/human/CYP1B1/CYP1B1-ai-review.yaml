- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The exact InterPro-to-Q16678 matches and their actual GO outputs were read. P450 domains
      support catalytic class/cofactor binding, not arbitrary pathway specificity. Official method title
      was verified at https://geneontology.org/gorefs.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator
    judgment of sequence similarity
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: All literal Q64429 source objects and current same-term experimental records were reconstructed.
      Human claims remain ortholog inferences, with source-specific limits for NO biosynthesis, oxidative
      intrinsic apoptosis, lipid catabolism and receptor/JAK signaling.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: All seven exact IBDs were reconstructed from current raw GAF WITH/FROM column 8 (one-based),
      with aspect separately checked. Their ancestral nodes lie on the actual Q16678 path in PTHR24299;
