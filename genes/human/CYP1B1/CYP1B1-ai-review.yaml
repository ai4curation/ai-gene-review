- term:
    id: GO:0106256
    label: hydroperoxy icosatetraenoate dehydratase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:37947
  - RHEA:48632
  - RHEA:48636
  - EC:4.2.1.152
  review:
    action: KEEP_AS_NON_CORE
    summary: Human CYP1B1 has a directly measured secondary hydroperoxide-dehydration activity.
    reason: Actual PMID:21068195 Methods entry 23 and Table 2 assay CYP1B1 microsomes and report 5-, 12-
      and 15-HpETE conversion to the corresponding oxoETEs without added NADPH. Human CYP1B1 turnover
      is 11.8, 6.0 and 11.2/min, respectively. This fits hydroperoxy-icosatetraenoate dehydration and
      is not a CYP2S1-only result. The microsomes contained POR; no POR-removal or anaerobic test for
      CYP1B1 was reported, and physiological dominance is unestablished. This is a directly measured secondary
      catalytic mode; its contribution to oxo-lipid flux in intact human tissues is not established by
      the microsomal turnover assay, so it is retained without a separate dominant physiological core.
      KEEP_AS_NON_CORE retains this measured chemistry while distinguishing it from the three principal
      substrate-context cores. The target Table 2 cells and assay limits are transcribed with public original
      locators in CYP1B1-primary-source-notes.md; the paper, not that authored navigation, supplies the
      evidence.
    supported_by:
