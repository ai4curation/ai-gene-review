core_functions:
- description: Heme-dependent estrogen hydroxylation uses electrons supplied through P450 reductase. Human
    CYP1B1 favors estradiol 4-hydroxylation over 2-hydroxylation in product-resolved enzyme assays, generating
    catechol estrogens with distinct biological reactivity. The 4-hydroxylase reaction is represented
    by RHEA:47280; the current steroid-hydroxylase term provides the available activity class while a
    specific ontology proposal captures the C4 reaction. This human regioselectivity is not inferred from
    the differently selective rodent enzymes.
  molecular_function:
    id: GO:0008395
    label: steroid hydroxylase activity
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  directly_involved_in:
  - id: GO:0008210
    label: estrogen metabolic process
  supported_by:
