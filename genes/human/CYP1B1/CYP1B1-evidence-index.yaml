followup2_source_scope:
  apoptosis: Bax/Bim and Akt interpretations are weighed alongside the opposite basal-apoptosis and peroxide-viability
    phenotypes. NAC reduced ROS; no reported apoptosis rescue is inferred. GO:0008631 remains UNDECIDED.
  JAK_STAT: Positive STAT3/VEGF measurements remain valid; the receptor/JAK-specific transfer exceeds
    their demonstrated resolution. GO:0046427 becomes MARK_AS_OVER_ANNOTATED.
  source_note: The authored primary-source note remains navigation to measured primary table cells, not
    independent experimental evidence or a fabricated publication-cache quotation.
  monooxygenase_relation: The saved current GO:0004497 response explicitly lists GO:0016712 as an is_a
    child, also present in the returned ancestor closure. Existing refinement wording is retained.
followup3_source_scope:
  nitric_oxide: Rows 36/37 are MARK_AS_OVER_ANNOTATED for the performed-role distinction in PMID:20032512,
    not because all biosynthetic participants must themselves be NO synthases. Mouse donor identity and
    positive NO regulation remain intact.
  intrinsic_apoptosis: 'Rows 53/54 remain UNDECIDED: positive Bax/Bim/Akt and caspase evidence is relevant
    to intrinsic signaling, but the oxidative trigger-to-intrinsic route is unresolved. NAC reduced ROS;
    no NAC apoptosis-rescue experiment is inferred. Full access does not eliminate genuine biological
    uncertainty.'
  lipid_catabolism: Rows 58/59 remain UNDECIDED. PMID:23979599 measures peroxidation/redox phenotypes
    without resolving CYP1B1-performed lipid breakdown; PMID:19005183 remains abstract-only after unsuccessful
    original-access routes. Neither lack of a measured step nor a metabolic GO ancestor set proves absence
    of all catabolic participation.
  steroid_catabolism: Row 33 remains UNDECIDED. The actual PTN001210461 IBD is on the 18-node human Q16678
    path in the 585-node PTHR24299 tree and uses P05177. Its current experimental source is PMID:18356043;
    that full assay remains uninspected. No erroneous ancestry or donor-count weakness is asserted.
  integrated_cores: Three substrate-context cores are retained. Human estrogen C2 and C4 turnover are
    both measured (PMID:23821647 Results, 1.76 versus 0.38 min-1 for C4 versus C2 in the stated preparation).
    Six accepted GO:0101021 objects preserve C2 specificity, and the existing C4 term proposal preserves
    that ontology gap. The arachidonate core covers both HETE and EET production; accepted GO:0008404,
    GO:0008405 and GO:0106302 already carry its specific epoxide branches. Parent/child duplication or
    substitution of one product for a broader performed unit is avoided.
  checkpoint: 'This appendix supersedes earlier action-count checkpoints: five UNDECIDED remain (33,53,54,58,59).
    Historical notes remain append-only. No NEW annotations, source replacements, product changes or new
    quotations.'
