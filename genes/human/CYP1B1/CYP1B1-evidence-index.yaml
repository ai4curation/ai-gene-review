  mapping_access: Eleven direct Rhea page requests returned 403; the official UniProt reaction objects
    provide the inspected mapping. Specific reaction evidence was checked against actual sources.
  core_presentation:
    clusters:
    - Human estrogen hydroxylation, emphasizing the measured C4 preference.
    - Retinoid oxidation through a reduced-flavoprotein-supported catalytic system.
    - Arachidonate hydroxylation and epoxidation through the same donor-class chemistry in a distinct
      substrate context.
    secondary_activity: GO:0106256 is retained as KEEP_AS_NON_CORE with direct original Table 2 support.
      The positive secondary activity lacks an established dominant intact-tissue role; its exact quotation
      stays once on annotation row 110 and the three principal substrate-context cores remain unchanged.
    other_chemistry: Xenobiotic oxidation remains in the biological description and retained annotations;
      the compact core does not repeat every assayed substrate.
  primary_source_note: CYP1B1-primary-source-notes.md
