id: P02708
gene_symbol: CHRNA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CHRNA1 encodes the alpha1 subunit of the skeletal-muscle nicotinic acetylcholine receptor.
  Two alpha1 chains join beta1, delta and either fetal gamma or adult epsilon to form a ligand-gated cation
  channel at the postsynaptic neuromuscular junction. Alpha1 contributes acetylcholine-recognition interfaces
  and pore-gating elements that convert motor-neuron transmitter release into endplate depolarization
  and muscle contraction. The assembled receptor also conducts calcium, with permeability influenced strongly
  by the complementary subunits. Pathogenic variants can impair receptor expression or alter gating and
  agonist affinity, causing congenital myasthenic syndromes; severe biallelic defects can cause fetal
  akinesia. Human splice products differ: the P3A-containing alpha+ product was not incorporated into
  functional receptors in the tested heterologous system.'
