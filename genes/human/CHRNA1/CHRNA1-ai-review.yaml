  review:
    summary: Retain participation in skeletal muscle contraction.
    action: ACCEPT
    reason: Original PMID:9221765 measures human patient/control muscle endplates and human alpha/beta/delta/epsilon
      receptor reconstitution in HEK cells. Wild-type receptors carry acetylcholine-evoked currents; alpha
      V249F alters gating, desensitization and agonist affinity. The receptor is a heteropentamer containing
      two alpha1 subunits, not an isolated CHRNA1 homomer. Acetylcholine recognition and cation conduction
      supply the excitatory postsynaptic step that triggers muscle contraction. This is work performed
      by the receptor, not merely a loss-of-function necessity argument. The original PAINT identifier
      is preserved as a curated ancestral assertion, not a pairwise similarity vote. Current target biology
      corroborates applicability, but historical tree placement, MSA and IBD evidence were not independently
      reconstructed.
