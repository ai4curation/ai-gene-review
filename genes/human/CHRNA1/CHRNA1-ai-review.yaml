- term:
    id: GO:0048630
    label: skeletal muscle tissue growth
  evidence_type: IMP
  original_reference_id: PMID:18252226
  qualifier: involved_in
  review:
    summary: Do not equate fetal akinesia with direct skeletal-muscle growth.
    action: MARK_AS_OVER_ANNOTATED
    reason: The full PMID:18252226 study finds recessive human CHRNA1 variants, fetal hypokinesia/contractures
      and developmental abnormalities, with mouse somite expression. Results explicitly report reduced
      muscle mass in all affected individuals; this is a genuine positive phenotype. GO:0048630 specifies
      increased muscle size/mass through fiber number or size. The observed mass reduction does not distinguish
      a CHRNA1-performed growth step from a consequence of fetal immobility, and the paper explicitly
      calls an early mesodermal role speculative. Retain the positive movement/receptor evidence separately;
      this overannotation judgment is source-specific and does not deny that altered neuromuscular activity
      can affect muscle growth.
    supported_by:
    - reference_id: PMID:18252226
      supporting_text: the evidence is speculative
    - reference_id: file:human/CHRNA1/CHRNA1-source-evidence.json
