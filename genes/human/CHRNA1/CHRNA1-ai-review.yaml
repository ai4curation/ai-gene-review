core_functions:
- description: Alpha1 contributes ligand-recognition and pore-gating elements to the muscle acetylcholine
    receptor heteropentamer, directly converting acetylcholine binding into postsynaptic cation current.
    Human receptor reconstitution and patient endplate recordings establish the transmission mechanism;
    two alpha chains act with beta/delta and gamma or epsilon. Calcium conduction is real but the adult
    calcium fraction is strongly influenced by epsilon, not established as an alpha1-only property. The
    current displayed P02708-2 functional product must be distinguished from P3A-containing P02708-1;
    the latter was not incorporated into functional receptors in the original human-product expression
    study. Existing annotation relations are preserved, while this synthesis explicitly represents subunit
    contribution.
  contributes_to_molecular_function:
    id: GO:0022848
    label: acetylcholine-gated monoatomic cation-selective channel activity
  directly_involved_in:
  - id: GO:0007274
    label: neuromuscular synaptic transmission
  - id: GO:0003009
    label: skeletal muscle contraction
  - id: GO:0098655
    label: monoatomic cation transmembrane transport
  locations:
  - id: GO:0045211
    label: postsynaptic membrane
  - id: GO:0031594
    label: neuromuscular junction
  in_complex:
    id: GO:0005892
    label: acetylcholine-gated channel complex
  supported_by:
  - reference_id: PMID:9221765
    supporting_text: we recorded currents elicited by 3–100 n m ACh
  - reference_id: PMID:27375219
  - reference_id: PMID:16527851
  - reference_id: PMID:8788941
suggested_questions:
- question: How should the Reactome homomeric CHRNA1 complex532595 representation be reconciled with the
    established muscle heteropentamer, while preserving the supported plasma-membrane location?
- question: What direct alpha1-specific evidence and historical PAINT node placement support presynaptic
    modulation and the derived presynapse annotation?
- question: What is the endogenous cellular fate of the P3A-containing human alpha+ product, and does
    any defined context permit assembly or a separate biological function?
- question: How do alpha1 gating changes and complementary-subunit-dependent calcium permeability jointly
    determine endplate injury without conflating calcium fraction with prolonged total current?
suggested_experiments:
- hypothesis: P3A-containing alpha+ has trafficking or assembly behavior distinct from the functional
    alpha product.
  description: At matched endogenous expression in human myotubes, resolve both sequence-verified splice
    products and measure pentamer assembly, surface abundance and ligand-evoked currents separately; use
    product-specific rescue and unassembled-chain controls.
- hypothesis: An alpha1-specific presynaptic pool, if present, must be distinguished from muscle endplate
    receptors and neuronal nicotinic paralogs.
  description: Use isoform-aware alpha1 genetic tagging and loss/rescue in a defined human motor-neuron–myotube
    system, measuring presynaptic transmitter release and postsynaptic current separately with cell-type-specific
    perturbations and validated paralog controls.
