  review:
    summary: Refine the source endpoint to neuromuscular transmission.
    action: MODIFY
    reason: Actual original PMID:8872460 Results and Methods distinguish human patient muscle/endplate
      measurements from recombinant mouse alpha/beta/delta/epsilon receptors expressed in HEK cells. The
      alpha N217K patient has prolonged endplate currents and postsynaptic myopathy; the engineered mouse
      alpha mutant changes channel kinetics relative to wild type. Human host cells do not make these
      mouse constructs human. The original human recordings are compound muscle action potentials and
      endplate currents. The paper links prolonged postsynaptic potentials and endplate injury to transmission
      failure; it does not measure a CHRNA1-dependent neuronal action potential. GO:0007274 captures the
      demonstrated process. This source-specific correction does not assert that alpha1 can never have
      a neuronal role.
    supported_by:
    - reference_id: PMID:8872460
      supporting_text: prolonged end plate currents
