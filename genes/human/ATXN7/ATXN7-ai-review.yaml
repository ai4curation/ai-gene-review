- term:
    id: GO:0000124
    label: SAGA complex
  evidence_type: NAS
  original_reference_id: PMID:19114550
  qualifier: part_of
  review:
    summary: SAGA complex (NAS). ATXN7 is an integral subunit of the mammalian SAGA-like TFTC and STAGA
      complexes, and its immunoprecipitates retain HAT activity. It belongs to the deubiquitination module
      of the complex. Core.
    action: ACCEPT
    reason: '[PMID:15115762 "We show here that ataxin-7 is an integral component of the mammalian SAGA-like
      complexes, the TATA-binding protein-free TAF-containing complex (TFTC) and the SPT3/TAF9/GCN5 acetyltransferase
      complex (STAGA)."] [PMID:15115762 "In agreement, immunoprecipitation of ataxin-7 retained a histone
      acetyltransferase activity, characteristic for TFTC-like complexes."] [PMID:18206972 "Here we demonstrate
      that the 2 MDa GCN5 HAT-containing metazoan TFTC/STAGA complexes contain a histone H2A and H2B deubiquitinase
      activity."]'
    supported_by:
    - reference_id: PMID:15115762
      supporting_text: We show here that ataxin-7 is an integral component of the mammalian SAGA-like
        complexes, the TATA-binding protein-free TAF-containing complex (TFTC) and the SPT3/TAF9/GCN5
        acetyltransferase complex (STAGA).
    - reference_id: PMID:15115762
      supporting_text: In agreement, immunoprecipitation of ataxin-7 retained a histone acetyltransferase
        activity, characteristic for TFTC-like complexes.
    - reference_id: PMID:18206972
      supporting_text: Here we demonstrate that the 2 MDa GCN5 HAT-containing metazoan TFTC/STAGA complexes
        contain a histone H2A and H2B deubiquitinase activity.
