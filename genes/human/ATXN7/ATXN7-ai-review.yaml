  review:
    summary: Microtubule cytoskeleton organization (IBA). Cytoplasmic ATXN7 associates with microtubules,
      stabilizes them against nocodazole, and its knockdown enhances microtubule loss. This is a single
      study of a cytoplasmic pool, so it is kept as non-core.
