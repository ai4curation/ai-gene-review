id: O15265
gene_symbol: ATXN7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATXN7 (ataxin-7) is a subunit of the SAGA (TFTC/STAGA) transcriptional coactivator complex,
  which has GCN5 histone acetyltransferase and histone H2A/H2B deubiquitinase activities. ATXN7 is associated
  with the deubiquitination module formed by ATXN7L3, ENY2 and USP22. Its zinc-finger SCA7 domain binds
  nucleosomes through the H2A-H2B dimer. ATXN7 is mainly nuclear but shuttles to the cytoplasm, where
  it associates with and stabilizes microtubules. It binds the photoreceptor transcription factor CRX.
  Polyglutamine expansion of ATXN7 causes spinocerebellar ataxia type 7, with cerebellar and cone-rod
  retinal degeneration.
