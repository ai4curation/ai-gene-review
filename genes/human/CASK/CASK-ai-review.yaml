  supporting_entities:
  - ARBA:ARBA00086776
  review:
    summary: A GUK-like domain does not confer GMP kinase activity on CASK.
    action: REMOVE
    reason: GO:0004385 specifies ATP-dependent GMP-to-GDP catalysis. The C-terminal CASK-SH3GK construct
      lacked detectable guanylate kinase activity and GMP binding in the later biochemical study, with
      yeast guanylate kinase as a positive control. CASK protein phosphorylation uses its separate N-terminal
      kinase domain; it cannot rescue this electronic GMP-kinase assignment. The CASK-specific negative
      activity result and yeast-GK positive control were read in the official publisher Results/Fig. 1B
      of PMID:12482754, beyond its abstract-only cache; PSD95 mutational rescue and ligand-binding controls
      are not relabeled CASK experiments.
    supported_by:
    - reference_id: PMID:18423203
    - reference_id: PMID:12482754
      supporting_text: 'failed to detect GMP binding to the MAGUKs postsynaptic density-95 (PSD-95) and

        CASK'
