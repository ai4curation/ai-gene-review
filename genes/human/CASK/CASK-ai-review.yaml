  review:
    summary: The historical source did not demonstrate GMP kinase catalysis.
    action: REMOVE
    reason: The complete 1998 paper explicitly states that guanylate kinase activity had not been tested;
      its discussion is a sequence-based proposal. Later direct CASK-SH3GK assays found no detectable
      GMP kinase activity. This decision concerns the actual catalytic reaction, not the validity of the
      independently active N-terminal protein kinase. The CASK-specific negative activity result and yeast-GK
      positive control were read in the official publisher Results/Fig. 1B of PMID:12482754, beyond its
      abstract-only cache; PSD95 mutational rescue and ligand-binding controls are not relabeled CASK
      experiments.
