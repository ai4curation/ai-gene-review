core_functions:
- molecular_function:
    id: GO:0060090
    label: molecular adaptor activity
  description: Organizes membrane-associated protein assemblies through distinct interaction domains,
    connecting transmembrane partners to intracellular scaffolds and positioning partner proteins. Human
    CASK binding assays, mammalian complexes and conserved LIN2/CASK functional evidence support this
    mechanism; individual interactome hits are not assumed to participate in the same complex.
  directly_involved_in:
  - id: GO:0008104
    label: intracellular protein localization
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005911
    label: cell-cell junction
  supported_by:
  - reference_id: PMID:16688213
    supporting_text: LIN-2 CASK immuno-precipitates contained mEPS-8 and mLIN-7A
  - reference_id: PMID:18664494
  - reference_id: Reactome:R-HSA-5336443
  - reference_id: Reactome:R-HSA-6797568
- molecular_function:
    id: GO:0106310
    label: protein serine kinase activity
  description: Catalyzes ATP-dependent protein phosphotransfer through the N-terminal kinase domain, including
    neurexin-tail phosphorylation promoted by substrate recruitment. Magnesium is not required and inhibits
    the measured activity; calcium/calmodulin dependence is not implied by the protein name. The separate
    C-terminal GUK-like region is not assigned GMP kinase catalysis.
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:18423203
    supporting_text: ATP and catalyzes phosphotransfer without Mg2+.
  - reference_id: PMID:20424264
suggested_questions:
- question: 'Which exact assay and construct underlie each unresolved PMID:36115835 CASK interaction:
    isolated-domain holdup, cellular copurification, or a literature benchmark?'
- question: Do the basement-membrane annotations refer to extracellular matrix staining or to basal keratinocyte/basolateral
    membrane CASK, and what image or annotation extension supports that distinction?
- question: Which direct donor experiments support ciliary-membrane, vesicle and Schaffer collateral–CA1
    localization in human CASK transfers?
- question: How do native CASK protein-kinase activity and its separable scaffold interactions contribute
    to the different human neurodevelopmental phenotypes?
suggested_experiments:
- description: Resolve selected partner interactions with full-length CASK and matched domain mutants,
    reciprocal binding controls and endogenous complex measurements; distinguish loss of docking from
    loss of kinase activity.
- description: Test the proposed epithelial repair effect with a defined wound-restoration endpoint and
    CASK perturbation/rescue, separating proliferation, adhesion and migration contributions.
