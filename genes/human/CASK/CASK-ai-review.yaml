- id: PMID:20424264
  title: Evolution of CASK into a Mg2+-sensitive kinase.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete unique cached Introduction, Results and Discussion read, together with the
      independent primary-control consultation. Engineered quadruple-mutant CASK gains Mg-stimulated phosphotransfer;
      native CASK retains its distinct Mg-inhibited behavior. Cellular neurexin phosphorylation and kinase-truncation
      controls corroborate the earlier kinase mechanism. Supplementary Methods, raw structural data and
      figure pixels were not reanalysed; no new evolutionary family identifier is inferred.
