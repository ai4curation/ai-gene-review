id: O14936
gene_symbol: CASK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CASK is a multidomain intracellular scaffold and protein kinase of the membrane-associated
  guanylate kinase family. Its L27, PDZ, SH3 and guanylate-kinase-like regions organize membrane-associated
  protein complexes, including neurexin-, syndecan- and LIN7-containing assemblies. Its N-terminal kinase
  domain catalyzes protein phosphorylation without requiring magnesium; this activity is distinct from
  the inactive C-terminal guanylate-kinase-like domain. CASK occupies cytoplasmic, membrane and context-dependent
  nuclear pools and contributes to neuronal function and development. Pathogenic CASK variants cause X-linked
  neurodevelopmental disorders, including microcephaly with pontine and cerebellar hypoplasia and intellectual
  disability with or without nystagmus.
