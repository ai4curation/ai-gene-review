- id: PMID:10978331
  title: Retrovirally mediated complementation of the glyB phenotype. Cloning of a
    human gene encoding the carrier for entry of folates into mitochondria.
  findings:
  - statement: >-
      A human placental cDNA that complements the glycine auxotrophy of folate-transport-deficient
      glyB CHO cells encodes a 35 kDa protein homologous to inner mitochondrial membrane metabolite
      carriers; this is the gene later named SLC25A32/MFT.
    supporting_text: >-
      An open reading frame in this cDNA encoded a 35-kDa protein homologous to several inner
      mitochondrial wall transporters for intermediate metabolites.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Expression of the cloned cDNA restored mitochondrial folate accumulation in glyB cells, which
      is the original functional basis for treating SLC25A32 as a mitochondrial folate carrier.
    supporting_text: >-
      The subcloned cDNA complemented the glycine auxotrophy of glyB cells and reinstated folate
      accumulation in the mitochondria of transfected cells.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Original cloning of SLC25A32/MFT as the human mitochondrial folate carrier via complementation
      of the glyB glycine-auxotroph phenotype; reinstated mitochondrial folate accumulation. Establishes
      the historical folate-transporter model and inner-membrane localization. Abstract-only cache.
- id: PMID:15140890
  title: A mutation inactivating the mitochondrial inner membrane folate transporter
    creates a glycine requirement for survival of chinese hamster cells.
  findings:
  - statement: >-
      The glyB glycine requirement is caused by a point mutation in an inner mitochondrial membrane
      protein required for folate transport into mitochondria, placing the carrier in the inner
      membrane.
    supporting_text: >-
      the defect in glyB cells causative of this phenotype is a point mutation in an inner
      mitochondrial membrane protein required for transport of folates into mitochondria
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The causative change is a Gly192Glu substitution in a predicted transmembrane domain of
      hamster MFT, and wild-type but not Glu192 cDNA restored growth without glycine and
      mitochondrial folate accumulation.
    supporting_text: >-
      introduced a glutamate in place of the glycine in wild-type hamster MFT at codon 192 in a
      predicted transmembrane domain
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Maps the glyB defect to a Gly192Glu point mutation in the inner-membrane folate carrier that
      abolishes mitochondrial folate transport. Basis of the IGI inner-membrane annotation and of the
      UniProt CAUTION. Abstract-only cache.
- id: PMID:16165386
  title: Identification of the human mitochondrial FAD transporter and its potential
    role in multiple acyl-CoA dehydrogenase deficiency.
  findings:
  - statement: >-
      Of the two human FLX1 homologues tested by functional expression in an FLX1-mutant yeast
      strain, only MFT/SLC25A32 complemented the mutant, identifying it as the human mitochondrial
      FAD transporter.
    supporting_text: >-
      Of the two candidate genes, only the previously described mitochondrial folate transporter
      (MFT) was able to functionally complement the FLX1 mutant.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The complemented yeast function is FAD translocation across the mitochondrial inner membrane,
      which is what FLX1 performs, so the complementation assigns that activity to the human
      protein.
    supporting_text: >-
      In yeast, FAD is transported across the mitochondrial inner membrane by the FLX1 protein.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Shows SLC25A32 (MFT), but not N111, complements the yeast FLX1 FAD-carrier mutant, identifying it
      as the human mitochondrial FAD transporter. Primary support for the core FAD transporter activity
      and MADD relevance. Abstract-only cache.
- id: PMID:21956163
  title: Effect of chronic alcohol exposure on folate uptake by liver mitochondria.
  findings:
  - statement: >-
      Folate entry into mitochondria is a specific carrier-mediated process attributed to the
      mitochondrial folate transporter MFT/SLC25A32.
    supporting_text: >-
      Transport of folate from the cytoplasm into the mitochondria is via a specific
      carrier-mediated process involving the mitochondrial folate transporter (MFT).
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Chronic alcohol exposure inhibits carrier-mediated folate uptake by mitochondria isolated from
      rat liver and from HepG2 cells, with reduced MFT protein and mRNA and reduced SLC25A32
      promoter activity, so the carrier is regulated transcriptionally.
    supporting_text: >-
      chronic alcohol feeding of rats leads to a significant inhibition in mitochondrial
      carrier-mediated folate uptake
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Studies transcriptional regulation of human MFT/SLC25A32 and mitochondrial carrier-mediated folate
      uptake under chronic alcohol exposure. Supports mitochondrial localization and the folate-uptake
      association; does not directly test FAD transport. Abstract-only cache.
- id: PMID:29666258
  title: Formate rescues neural tube defects caused by mutations in Slc25a32.
  findings:
  - statement: >-
      Gene-trap inactivation of Slc25a32 in mice causes cranial neural tube defects that are not
      prevented by 5-methyltetrahydrofolate but are largely prevented by formate, and biallelic
      loss-of-function SLC25A32 variants were found in a human cranial NTD case.
    supporting_text: >-
      we show that gene trap inactivation of Slc25a32 (Mft) in mice induces NTDs that are folate
      (5-methyltetrahydrofolate, 5-mTHF) resistant yet are preventable by formate supplementation
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The study takes as its starting point the earlier in vitro identification of SLC25A32 as a
      mitochondrial folate transporter capable of moving tetrahydrofolate from cytoplasm into
      mitochondria.
    supporting_text: >-
      Previous studies have identified SLC25A32 as a mitochondrial folate transporter (MFT), which
      is capable of transferring tetrahydrofolate (THF) from cellular cytoplasm to the mitochondria
      in vitro.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Slc25a32 knockout mice die with folate-resistant, formate-preventable cranial NTDs; a biallelic LOF
      human NTD case was identified. Supports mitochondrial localization (IDA) and the one-carbon/NTD role.
      Abstract-only cache.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics
    in cellular context.
  findings:
  - statement: >-
      Combining subtractive proteomics, spatial proteomics, mitochondria-specific importomics and
      curation, the study defines MitoCoP, a high-confidence human mitochondrial proteome of 1,134
      protein-coding genes; membership of this set is what the HTP mitochondrion annotation rests
      on, and it reports organelle membership without resolving the sub-compartment.
    supporting_text: >-
      we combined subtractive proteomics, spatial proteomics, mitochondria-specific importomics, and
      literature/database curation by stringent criteria. We defined a human mitochondrial
      high-confidence proteome (MitoCoP) of 1,134 protein-coding genes
    reference_section_type: RESULTS
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Large-scale high-confidence mitochondrial-proteome dataset supporting SLC25A32's mitochondrial
      localization (HTP). Bulk proteomics; does not address substrate or specific function. The
      per-protein identification of SLC25A32 is in the study's supplementary tables rather than in
      the cached text, so the quoted finding describes the dataset and its resolution limit.
- id: PMID:35727412
  title: Mitochondrial FAD shortage in SLC25A32 deficiency affects folate-mediated
    one-carbon metabolism.
  findings:
  - statement: >-
      In patient-derived knock-in and knockout mice, mitochondrial FAD uptake was specifically
      blocked by the Slc25a32 mutations, identifying FAD as the transported substrate.
    supporting_text: >-
      the mitochondrial uptake of flavin adenine dinucleotide (FAD) was specifically blocked by
      Slc25a32Y174C/K235R, Slc25a32K235R/K235R, and Slc25a32-/- mutations
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      None of the Slc25a32 mutations impaired mitochondrial folate uptake, which separates the
      FAD-carrier function from the historical folate-carrier model.
    supporting_text: >-
      None of the Slc25a32 mutations hindered the mitochondrial uptake of folate.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Flavoenzymes of fatty acid beta-oxidation and amino acid metabolism were impaired, and in null
      embryos the glycine cleavage system subunit dihydrolipoamide dehydrogenase was damaged,
      linking the FAD shortage to glycine accumulation, reduced formate and disturbed
      folate-mediated one-carbon metabolism.
    supporting_text: >-
      Besides the flavoenzymes involved in fatty acid β-oxidation and amino acid metabolism being
      impaired, Slc25a32-/- embryos also had a subunit of glycine cleavage
      system-dihydrolipoamide dehydrogenase damaged
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Definitive mouse-genetic study: patient-derived knock-in and knockout mice show SLC25A32 mutations
      block mitochondrial FAD (not folate) uptake, impairing flavoenzymes including DLD of the glycine
      cleavage system and disrupting folate-mediated one-carbon metabolism. Strongest support for the core
      FAD transporter function. Abstract-only cache.
- id: Reactome:R-HSA-196757
  title: Metabolism of folate and pterines
  findings:
  - statement: >-
      The Reactome folate and pterine metabolism pathway covers intracellular folate transport as
      well as folate interconversion, which is the step SLC25A32 participates in.
    supporting_text: >-
      Processes annotated here include transport reactions by which folates are taken up by cells
      and moved intracellularly, folate conjugation with glutamate (required for folate retention
      within a cell), and some of the key reactions in the generation of reduced folates and
      one-carbon derivatives of folate.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Reactome pathway placing SLC25A32 in folate/pterine metabolism; basis of the folic acid metabolic
      process TAS annotation. Reflects the historical/consensus folate role.
- id: Reactome:R-HSA-200680
  title: SLC25A32 transports THF from cytosol to mitochondrial matrix
  findings:
  - statement: >-
      Reactome models SLC25A32 as an inner mitochondrial membrane protein mediating reversible
      tetrahydrofolate transport between cytosol and matrix, so the event asserts both the folate
      transporter activity and the inner-membrane location.
    supporting_text: >-
      SLC25A32 protein in the inner mitochondrial membrane mediates the reversible transport of
      tetrahydrofolate between the cytosol and the mitochondrial matrix.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction modeling SLC25A32 as a reversible THF carrier (cytosol-to-matrix); basis of the
      folic acid transporter activity and inner-membrane TAS annotations. Represents the original folate
      model, now non-core relative to FAD transport.
