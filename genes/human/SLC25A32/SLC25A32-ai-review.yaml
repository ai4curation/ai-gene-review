    label: nucleotide transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      Over-generalized InterPro-derived annotation. FAD is a flavin dinucleotide, so a
      generic "nucleotide transport" term is a distant, uninformative ancestor of the true
      FAD transport function and does not reflect the substrate specificity of SLC25A32.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The mapping comes from a generic mitochondrial-carrier InterPro signature, which is shared by
      carriers for ADP/ATP, phosphate, citrate and dicarboxylates alike and therefore carries no
      substrate information. SLC25A32's transported substrate is FAD; calling that nucleotide
      transport is formally defensible only because FAD contains an adenine nucleotide moiety, and
      it would equally be assigned to carriers with no overlap in substrate. The specific process
      GO:1990548 is asserted elsewhere in this review on experimental evidence, so this row adds a
      claim broader than the signature can support rather than a useful parent.
