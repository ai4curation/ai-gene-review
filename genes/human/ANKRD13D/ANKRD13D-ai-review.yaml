id: Q6ZTN6
gene_symbol: ANKRD13D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD13D (ankyrin repeat domain-containing 13D) is a ubiquitin-binding adaptor of the ANKRD13
  family, with N-terminal ankyrin repeats and C-terminal ubiquitin-interacting motifs (UIMs) that bind
  Lys63- but not Lys48-linked polyubiquitin chains. Endogenous ANKRD13D binds ligand-activated, ubiquitinated
  EGF receptor and is recruited to the plasma membrane after EGF stimulation. The ANKRD13 proteins regulate
  the rate of rapid EGFR internalization; overexpression blocks it, but because dominant-negative truncations
  block it too, the endogenous role is proposed to be positive. ANKRD13D also binds the E3 ligase RNF11
  through its UIMs and the endosomal ITCH activator ENTREP1. It has a cytoplasmic reticular distribution
  and, unlike ANKRD13A and ANKRD13B, only a minor late-endosome pool.
