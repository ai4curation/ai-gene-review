suggested_questions:
- question: Does ANKRD13D bridge ubiquitinated cargo to the ITCH ligase through ENTREP1, as ANKRD13A does
    with RNF11 and ITCH, and is that interaction EGF-regulated?
- question: Is the endogenous role of the ANKRD13 proteins in EGFR internalization positive, as the authors
    propose, given that both wild-type and truncated forms inhibit when overexpressed?
suggested_experiments:
- description: Measure EGFR internalization rates in ANKRD13A/B/D triple-knockout cells, since the siRNAs
    used so far failed to deplete all three paralogs and overexpression cannot fix the sign of regulation.
