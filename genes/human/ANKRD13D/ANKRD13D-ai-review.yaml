  review:
    summary: Protein binding (IPI) with ENTREP1 (FAM189A2), an endosomal ITCH activator. The interaction
      is reproducible but GO:0005515 carries no functional information and ENTREP1 has no activity term
      that would name it.
    action: REMOVE
    reason: 'UniProt records the pair across three experiments [file:human/ANKRD13D/ANKRD13D-uniprot.txt
      "Q6ZTN6; Q15884: ENTREP1; NbExp=3; IntAct=EBI-947028, EBI-8636612;"], from the BioPlex screens and
      the ENTREP paper, where [PMID:34927784 "we searched for its binding partners by yeast two‐hybrid
      screening"]. ENTREP1, in the words of that paper, [PMID:34927784 "FAM189A2, a downregulated gene
      in breast cancer, encodes a new type of ITCH"] activator. The pairing is biologically coherent with
      the ANKRD13 proteins'' links to ubiquitin ligases [PMID:31985874 "We show that ANKRD13A, ANKRD13B
      and ANKRD13D form a complex with RNF11 in vivo and that the UIMs are required for complex formation."],
      but no informative MF term exists for it; it is raised as a question instead.'
    supported_by:
