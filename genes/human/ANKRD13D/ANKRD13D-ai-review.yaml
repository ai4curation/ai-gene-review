- id: PMID:22298428
  title: The Ankrd 13 family of UIM-bearing proteins regulates EGF receptor endocytosis from the plasma
    membrane.
  findings:
  - statement: ANKRD13D binds Lys63- but not Lys48-linked chains.
    supporting_text: As shown in Figure 4A, Ankrd 13A, 13B, and 13D, but not 13C, pulled down Lys-63–linked,
      but not Lys-48–linked, Ub chains.
  - statement: Endogenous ANKRD13D binds EGFR after EGF.
    supporting_text: Blotting of the precipitates with the anti–Ankrd 13 antibodies showed that endogenous
      Ankrd 13A and 13D, but not 13C, bind to EGFR upon EGF treatment with the same time course as transfected
      Ankrd 13 proteins (Figure 2B).
  - statement: Endogenous ANKRD13D is at the plasma membrane, increased by EGF.
    supporting_text: Similarly, endogenous Ankrd 13A and 13D, but not 13C, were coprecipitated with biotinylated
      molecules from untransfected cells, and the amounts of plasma membrane-bound endogenous 13A and
      13D were elevated after 5 min of EGF stimulation (Figure 6B).
  - statement: Overexpression retains EGFR at the surface.
    supporting_text: In striking contrast, EGFR was mostly retained at the surface in cells overexpressing
      FLAG-tagged Ankrd 13A, 13B, or 13D (Figure 7, C–E′′).
  - statement: The sign of regulation is open because dominant-negative truncations also inhibit.
    supporting_text: raising the question of whether Ankrd 13 proteins have a stimulatory or inhibitory
      role in the process
  - statement: The authors propose a positive role in EGFR internalization.
    supporting_text: we propose that Ankrd 13A, 13B, and 13D positively regulate the internalization of
      ligand-activated EGFR
  - statement: ANKRD13D only marginally colocalizes with a late endosome marker.
    supporting_text: Ankrd 13D marginally colocalized with CI-M6PR (Supplemental Figure S1, C–C′′).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. HeLa cells; source of most GOA rows, and the only paper testing ANKRD13D
      endogenously.
- id: PMID:31985874
  title: Ring Finger Protein 11 acts on ligand-activated EGFR via the direct interaction with the UIM
    region of ANKRD13 protein family.
  findings:
  - statement: ANKRD13A, 13B and 13D bind RNF11 through their UIMs.
    supporting_text: We show that ANKRD13A, ANKRD13B and ANKRD13D form a complex with RNF11 in vivo and
      that the UIMs are required for complex formation.
  - statement: The transient RNF11-EGFR complex was shown for ANKRD13A.
    supporting_text: a complex formed by ANKRD13A, RNF11 and activated EGFR is transiently assembled in
      the early phases of receptor endocytosis
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. The ANKRD13-RNF11 complex covers ANKRD13D; the EGFR ternary complex is
      shown for ANKRD13A.
