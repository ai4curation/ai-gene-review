  review:
    summary: Negative regulation of receptor internalization (IEA). Overexpression of ANKRD13D blocks
      rapid EGFR internalization, but the source paper argues the endogenous role is positive, as UniProt's
      own function text says; the sign-neutral parent is the defensible term.
    action: MODIFY
    reason: The inhibition is an overexpression phenotype [PMID:22298428 "In striking contrast, EGFR was
      mostly retained at the surface in cells overexpressing FLAG-tagged Ankrd 13A, 13B, or 13D (Figure
      7, C–E′′)."]. Truncated mutants [PMID:22298428 "which were expected to act as dominant-negative
      versions"] inhibit as wild type does, which the authors read as [PMID:22298428 "ectopic overexpression
      of not only truncated but also wild-type Ankrd 13 inhibits the function of endogenous Ankrd 13"].
      They therefore pose the sign as open [PMID:22298428 "raising the question of whether Ankrd 13 proteins
      have a stimulatory or inhibitory role in the process"] and conclude [PMID:22298428 "we propose that
      Ankrd 13A, 13B, and 13D positively regulate the internalization of ligand-activated EGFR"]; UniProt
      follows this [file:human/ANKRD13D/ANKRD13D-uniprot.txt "ubiquitin. Positively regulates the internalization
      of ligand-activated"]. RNAi could not test it because the siRNAs [PMID:22298428 "failed to deplete
      the three Ankrd 13 mRNAs/proteins simultaneously"]. GO:0002090 regulation of receptor internalization
      keeps what is shown without asserting the direction.
    proposed_replacement_terms:
