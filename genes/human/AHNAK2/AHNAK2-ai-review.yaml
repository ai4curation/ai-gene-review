      locus-autonomous: a small nuclear isoform establishing a positive feedback
      loop on the splicing of its own locus, with the same shown separately for a
      17-kDa isoform of periaxin on the periaxin locus. Transferring that to
      AHNAK2 asserts something specific and untested, namely that AHNAK2 also
      produces a small nuclear isoform that feeds back on the AHNAK2 locus. Two
      things keep this at over-annotated rather than removed. The PAINT call is
      reasonable rather than careless: the same authors state that the gene
      architecture is shared with AHNAK2, and two of the three family members
      with that architecture do it, which is what IBA exists to capture. And the
      counter-argument is an absence - UniProt annotates no small N-terminal
      isoform for AHNAK2, its only short isoform Q8IVF2-2 being residues
      5003-5795 with no PDZ domain - and an unannotated transcript is not an
      absent one. Note also that PMID:21940993 produced 17 GO annotations over
      two entities, human AHNAK and mouse Ahnak, and none on AHNAK2: the curator
      who read the paper did not annotate AHNAK2, the phylogenetic pipeline did.
      The deciding experiment is named in suggested_experiments.
    supported_by:
    - reference_id: PMID:21940993
      supporting_text: "During muscle differentiation\nthe small AHNAK is strongly increased, thereby establishing a positive feedback\nloop to regulate mRNA splicing of its own locus."
    - reference_id: PMID:21940993
      supporting_text: "This genetic structure is shared by AHNAK2 and Periaxin,\nwhich share a common ancestor."
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - CIRCULAR_PROPAGATION
      source_entities:
      - source_id: MGI:MGI:108176
        source_label: Mus musculus Prx, periaxin (O55103, Swiss-Prot)
        source_status: CIRCULAR_OR_REDUNDANT
        comment: Holds GO:0043484 by IBA only - a recipient of the same propagation, not
          an independent source. Periaxin's own splicing-regulation result in
          PMID:21940993 has not been curated as an experimental annotation.
      - source_id: MGI:MGI:1316648
        source_label: Mus musculus Ahnak (E9Q616, TrEMBL - no Swiss-Prot entry exists)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The only donor with its own evidence - GO:0043484 by IDA from
          PMID:21940993. The annotation is sound for Ahnak; what it records is feedback on
          the Ahnak locus itself, by a small nuclear isoform.
      - source_id: PANTHER:PTN001156025
        source_label: PANTHER tree node, not a protein
        source_status: NOT_RELEVANT
        comment: The inference structure rather than an evidence source. The AHNAK2
          orthologue MGI:2144831 is on this gene's cytoplasm row but not on this one.
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IDA
  original_reference_id: PMID:24675079
  qualifier: enables
  review:
    summary: >-
      Proposed. A 1.75 A crystal structure of AHNAK2's PDZ domain shows an
      intertwined, domain-swapped homodimer, curated by UniProt at ECO:0000269,
      and the paper produced no GO annotation on any protein.
    action: NEW
    reason: >-
      This is the best-measured molecular property of human AHNAK2 and GO records
      none of it. PDB 4CN0 resolves residues 108-203 as two chains, A and B,
      forming a six-stranded antiparallel beta sheet in which every other strand
      comes from a different chain, and UniProt states it on the AHNAK2 entry as a
      homodimer via the PDZ domain with ECO:0000269|PubMed:24675079. Querying
      QuickGO by reference returns zero annotations for PMID:24675079 across all
      of GOA, and none of AHNAK2, PRX or AHNAK holds GO:0042803, GO:0046982 or
      GO:0051260, so this is a coverage gap rather than a curatorial judgement.
      It also gives the gene its first informative molecular function: AHNAK2's
      GOA molecular function content is otherwise two bare GO:0005515 rows, which
      state nothing. GO:0042803 is a descendant of GO:0042802 identical protein
      binding and of GO:0046983 protein dimerization activity, both under
      GO:0005515, so it refines rather than conflicts with what is already there.
    supported_by:
    - reference_id: PMID:24675079
      supporting_text: "The unique\nintertwined, domain-swapped dimers provide a structural basis for the\nhomodimerization of both proteins."
    - reference_id: PMID:24675079
      supporting_text: "We present the crystal structures of the PDZ-like domains\nfrom PRX and its homologue AHNAK nucleoprotein 2 (AHNAK2)."
- term:
    id: GO:0043034
    label: costamere
  evidence_type: ISS
  original_reference_id: PMID:20833135
  qualifier: located_in
  supporting_entities:
  - UniProtKB:A0A7N9VR94
  review:
    summary: >-
      Proposed. AHNAK2-specific antibodies place the mouse orthologue in the
      costameric network with vinculin, and the mouse entry holds GO:0043034 by
      IDA from this paper while human AHNAK2 has nothing from it.
    action: NEW
    reason: >-
      This is the only study that has imaged AHNAK2 in muscle with a reagent
      specific for AHNAK2 rather than for the family, and it is the source of the
      one localisation this gene has that is both specific and measured. Mouse
      Ahnak2 (A0A7N9VR94) holds GO:0043034 by IDA from PMID:20833135, and mouse
      Ahnak holds it by IDA from the same paper, yet QuickGO by reference shows
      the paper produced three annotations over two entities and none on human
      AHNAK2. Human AHNAK has picked the term up by ISS; human AHNAK2 has not,
      which looks like a coverage gap rather than a decision. ISS rather than IDA
      because the experiment is in mouse skeletal muscle. Note that GO does not
      place costamere under sarcolemma - its ancestors are cytoplasm, myofibril
      and contractile muscle fiber - so this is additive to the existing
      sarcolemma row rather than a replacement, and it is also a descendant of
      the GO:0005737 cytoplasm the IBA already gives, which is why that row was
      kept rather than narrowed.
    supported_by:
    - reference_id: PMID:20833135
      supporting_text: "We used specific AHNAK1 and AHNAK2\nantibodies to analyzed the detailed localization of both proteins in mouse\nskeletal muscle."
    - reference_id: PMID:20833135
      supporting_text: "Co-localization of AHNAK1 and AHNAK2 with vinculin clearly\ndemonstrates that both proteins are components of the costameric network."
- term:
    id: GO:0009306
    label: protein secretion
  evidence_type: ISS
  original_reference_id: PMID:25560297
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A0A7N9VR94
  review:
    summary: >-
      Proposed. Depleting AHNAK2 nearly abolishes stress-induced FGF1 export
      while leaving FGF2 export and Notch-induced FGF1 release intact. ISS
      because the knockdown was of the mouse protein.
    action: NEW
    reason: >-
      A specific, well-controlled loss-of-function result that produced no GO
      annotation anywhere - QuickGO returns zero annotations for PMID:25560297
      across all of GOA. The specificity controls are what make it worth
      annotating: AHNAK2 depletion did not affect spontaneous FGF2 export or the
      Notch-inhibition route of FGF1 release, so this is not a general secretory
      defect. The evidence code is decided by the paper's methods: the shRNA
      constructs suppress mouse AHNAK2 in NIH 3T3 cells, so for the human protein
      this is ISS with the mouse entry as supporting entity, not IMP. GO:0009306
      rather than GO:0050714 positive regulation of protein secretion because
      AHNAK2 physically associates with the cargo and co-translocates with it,
      which is participation rather than regulation; GO has no unconventional- or
      non-classical-secretion term, and the curated machinery of this pathway
      (S100A13, SYT1) carries exocytosis-branch terms rather than anything
      FGF-specific.
    supported_by:
    - reference_id: PMID:25560297
      supporting_text: "Depletion of AHNAK2 resulted in a drastic decrease of\nstress-induced FGF1 export but did not affect spontaneous FGF2 export and FGF1\nrelease induced by the inhibition of Notch signaling."
    - reference_id: PMID:25560297
      supporting_text: "Genetic constructs pGFP-V-RS expressing shRNAs that suppress the expression of mouse AHNAK2 were obtained from Origene (Rockville, MD)."
- term:
    id: GO:0017134
    label: fibroblast growth factor binding
  evidence_type: IPI
  original_reference_id: PMID:25560297
  qualifier: enables
  supporting_entities:
  - UniProtKB:P05230
  review:
    summary: >-
      Proposed, with its limitations stated. A heat-shock-dependent association
      between FGF1 and AHNAK2 was found by immunoprecipitation mass spectrometry
      and confirmed by reciprocal co-IP, but on an overexpressed tagged
      C-terminal fragment.
    action: NEW
    reason: >-
      Proposed because it is an informative molecular function where the
      alternative is another bare GO:0005515, and because the association was
      found by unbiased IP-MS and then confirmed reciprocally with anti-V5 and
      anti-HA antibodies. The limitations belong in the record rather than in a
      silent downgrade: the confirmation used an adenovirally overexpressed
      V5-tagged C-terminal 483-residue fragment of human AHNAK2 in mouse NIH 3T3
      cells, because the authors state that commercially available anti-AHNAK2
      antibodies failed to detect the protein reliably. So the interaction is
      established for a fragment under overexpression, the association is
      conditional on heat stress, and no affinity or stoichiometry has been
      measured. If a reviewer judges that too thin for a molecular function, the
      fallback is to drop this row and let GO:0009306 carry the finding; I have
      proposed it because an FGF-specific binding term is checkable whereas a
      bare protein binding row would not be.
    supported_by:
    - reference_id: PMID:25560297
      supporting_text: "The heat shock-dependent association of FGF1 with\nthe large protein AHNAK2 was observed."
    - reference_id: PMID:25560297
      supporting_text: "commercially available anti-AHNAK2 antibodies failed to reliably detect AHNAK2 both in immunoblotting and immunofluorescence"
core_functions:
- description: >-
    Homodimerises through its N-terminal PDZ domain by three-dimensional domain
    swapping, producing a tightly intertwined dimer whose two chains contribute
    alternating strands to a single six-stranded beta sheet. This is the only
    molecular activity of human AHNAK2 that has been measured directly, and the
    dimer is the presumed building block of whatever larger assemblies the
    protein scaffolds.
  molecular_function:
    id: GO:0042803
    label: protein homodimerization activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:24675079
    supporting_text: "The unique\nintertwined, domain-swapped dimers provide a structural basis for the\nhomodimerization of both proteins."
  knowledge_gaps:
  - gap_statement: >-
      No binding partner has been mapped to the AHNAK2 PDZ domain, so it is
      unknown what the protein scaffolds through the only interaction module it
      has.
    boundary: >-
      Firmly established: the domain folds, dimerises by domain swapping at
      1.75 A resolution, and its peptide-binding pocket is preformed and occupied
      by a class III ligand in the crystal. What is absent is any identification
      of a physiological ligand for that pocket.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      AHNAK2 is described throughout the literature as a scaffold, but with no
      mapped PDZ ligand the scaffolding claim rests on architecture rather than
      on evidence.
    resolution: >-
      A C-terminal peptide array or proteomic peptide-phage display screen
      against the purified 108-203 domain, with hits confirmed by holdup assay.
    provenance:
    - reference_id: PMID:24675079
      supporting_text: "The AHNAK2 PDZ domain structure contains a bound class III ligand peptide."
  - gap_statement: >-
      Whether the domain-swapped dimer forms at native concentrations in cells,
      or is a crystallisation-favoured state, has not been tested.
    boundary: >-
      Firmly established in the crystal and recorded by UniProt at ECO:0000269;
      untested in solution or in cells.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    resolution: >-
      SEC-MALS and native mass spectrometry across a concentration series, plus
      crosslinking of endogenous AHNAK2 followed by immunoblotting.
- description: >-
    Acts at the cytoplasmic face of the plasma membrane as a component of the
    stress-induced, non-classical FGF1 export pathway: on heat shock it
    associates with FGF1 and both partners redistribute into the submembrane,
    F-actin-rich cytoskeletal fraction, and AHNAK2 is required for FGF1 to reach
    the outside of the cell. The requirement is specific - it does not extend to
    FGF2 export or to Notch-inhibition-induced FGF1 release.
  molecular_function:
    id: GO:0017134
    label: fibroblast growth factor binding
  directly_involved_in:
  - id: GO:0009306
    label: protein secretion
  locations:
  - id: GO:0005886
    label: plasma membrane
  substrates:
  - id: UniProtKB:P05230
    label: FGF1
  supported_by:
  - reference_id: PMID:25560297
    supporting_text: "Thus, AHNAK2 is an\nimportant element of the FGF1 nonclassical export pathway."
  knowledge_gaps:
  - gap_statement: >-
      It is undetermined whether AHNAK2 acts as a translocation-machinery
      component, a submembrane tether that holds FGF1 at the membrane, or a
      carrier that delivers it there.
    boundary: >-
      Firmly established: the association with FGF1 is heat-shock-dependent, both
      proteins move into the cytoskeletal fraction on stress, and depleting
      AHNAK2 drastically reduces FGF1 export without affecting FGF2 export.
      Absent: any assay distinguishing the three mechanisms.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    provenance:
    - reference_id: PMID:25560297
      supporting_text: "Thus, AHNAK2 is an\nimportant element of the FGF1 nonclassical export pathway."
  - gap_statement: >-
      The role has not been tested on the full-length human protein at native
      levels: the loss of function is on mouse AHNAK2 and the binding on an
      overexpressed human C-terminal fragment.
    boundary: >-
      The mouse knockdown and the fragment co-IP are both solid within their own
      systems; what is missing is a human, endogenous, full-length test.
    gap_kind:
    - BIOLOGY
    - CURATION
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    provenance:
    - reference_id: PMID:25560297
      supporting_text: "commercially available anti-AHNAK2 antibodies failed to reliably detect AHNAK2 both in immunoblotting and immunofluorescence"
- description: >-
    In striated muscle, occupies the costameric network beneath the sarcolemma,
    co-distributing with vinculin at the sites that couple sarcomeric Z-discs
    laterally to the plasma membrane and the extracellular matrix, and
    associating with dysferlin. Recorded as a core localisation rather than a
    core activity because no molecular function has been measured for AHNAK2 in
    this compartment.
  locations:
  - id: GO:0043034
    label: costamere
  supported_by:
  - reference_id: PMID:20833135
    supporting_text: "Co-localization of AHNAK1 and AHNAK2 with vinculin clearly\ndemonstrates that both proteins are components of the costameric network."
  knowledge_gaps:
  - gap_statement: >-
      No force-transmission, membrane-repair or mechanical phenotype has been
      measured for AHNAK2 itself, so it is unknown whether AHNAK2 contributes to
      costamere function or merely resides there.
    boundary: >-
      Firmly established: AHNAK2 is a costameric protein by AHNAK2-specific
      antibody staining. The mechanical and wounding assays in the same study
      were done on AHNAK1-deficient fibres, and the wounding assay was negative
      even for AHNAK1.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: >-
      AHNAK2 loss-of-function variants cause a peripheral neuropathy, and the
      costamere is the only specific structure the protein is known to occupy, so
      the missing phenotype is the link between the two.
    provenance:
    - reference_id: PMID:20833135
      supporting_text: "A laser\nwounding assay with AHNAK1-deficient fibers suggests that AHNAK1 is not involved\nin membrane repair."
proposed_new_terms: []
suggested_questions:
- question: >-
    UniProt's only SUBCELLULAR LOCATION for AHNAK2 is Nucleus carrying a bare
    ECO:0000250 with no source accession, and the presumed donor - human AHNAK -
    carries an untagged Nucleus of its own. Can UniProt source this statement or
    withdraw it? It is the sole basis of the GO_REF:0000044 nucleus row, while
    HPA immunofluorescence at Enhanced reliability calls cytosol and plasma
    membrane with no nuclear compartment.
- question: >-
    PMID:24675079 solved the PDZ domains of periaxin and AHNAK2 at 1.75 A and
    reported the same domain-swapped homodimer for both, and UniProt curates it on
    both entries at ECO:0000269 - yet the paper has zero GO annotations in all of
    GOA, and neither PRX nor AHNAK2 holds any dimerisation term. This review
    proposes GO:0042803 for AHNAK2; PRX has the identical claim outstanding.
  experts:
  - Petri Kursula
  - Hongmin Han
- question: >-
    PAINT gives AHNAK2 three IBA rows, and the AHNAK2 orthologue (MGI:2144831,
    mouse Ahnak2) appears in only one of the three donor sets. Nucleus draws on
    three periaxins plus AHNAK; regulation of RNA splicing draws on mouse Ahnak
    plus a mouse Prx that holds the term only by IBA. Meanwhile mouse Ahnak2's own
    IDA-backed terms - costamere, Z disc, cytoplasmic vesicle membrane - have not
    propagated to human AHNAK2 at all. Should the node's term set be rebalanced
    toward what the orthologue actually carries?
- question: >-
    Several papers state that AHNAK2 binds directly to periaxin, including
    PMID:31011849, which uses it to explain a Charcot-Marie-Tooth phenotype. I
    cannot find a primary measurement of an AHNAK2-PRX heterodimer. The structural
    paper usually cited in this context reports domain-swapped homodimers of each
    protein separately. Is there a primary source for the heterotypic interaction,
    or has a two-homodimer paper been read as a heterodimer paper?
  experts:
  - Petri Kursula
  - Marina L Kennerson
- question: >-
    ARBA00026971 and ARBA00027801 supply AHNAK2's cytoplasm and plasma membrane
    IEA rows, but across 2388 and 686 condition sets neither rule's published
    conditions mention any of AHNAK2's InterPro, PANTHER or FunFam signatures. Is
    the REST view of these rules incomplete, or were the annotations applied under
    earlier conditions?
suggested_experiments:
- hypothesis: >-
    AHNAK2 produces a small N-terminal, PDZ-containing isoform analogous to the
    17-kDa AHNAK and periaxin species, and that isoform enters the nucleus.
  description: >-
    5'-RACE and long-read RNA-seq across the AHNAK2 locus, then immunoblotting of
    nuclear and cytoplasmic fractions with an antibody raised against residues
    1-200. This single experiment decides both nucleus rows and the
    regulation-of-RNA-splicing row: the mechanism transferred from AHNAK requires
    such an isoform, and UniProt annotates none for AHNAK2, whose only short
    isoform is C-terminal.
  experiment_type: transcript mapping and subcellular fractionation
- hypothesis: >-
    AHNAK2 regulates splicing at its own locus, as AHNAK does at AHNAK.
  description: >-
    Deplete AHNAK2 in differentiating myotubes and quantify the ratio of long to
    short AHNAK2 transcripts by isoform-specific RT-qPCR, with AHNAK as the
    positive control. A negative result would retire GO:0043484 on AHNAK2 rather
    than leaving it marked over-annotated.
  experiment_type: knockdown plus isoform-specific RT-qPCR
- hypothesis: >-
    The domain-swapped PDZ dimer exists at native concentrations and is not a
    crystallisation artefact.
  description: >-
    SEC-MALS and native mass spectrometry on the purified 108-203 fragment across
    a concentration series, plus crosslinking of endogenous AHNAK2 in cells
    followed by immunoblotting for a dimeric species.
  experiment_type: biophysics and crosslinking
- hypothesis: >-
    The preformed AHNAK2 PDZ pocket binds a physiological C-terminal peptide
    ligand.
  description: >-
    Screen a C-terminal peptide array or a proteomic peptide-phage display
    library against the purified domain, then test the top hits by holdup assay.
    This would convert AHNAK2's scaffold role from an architectural inference
    into a measured molecular function.
  experiment_type: peptide binding screen
- hypothesis: >-
    Full-length human AHNAK2 is required for stress-induced FGF1 export, and the
    C-terminal region is sufficient.
  description: >-
    CRISPR knockout of AHNAK2 in a human cell line that exports FGF1 under heat
    stress, with rescue by full-length AHNAK2 and by the C-terminal fragment
    separately. This would upgrade the ISS to direct human evidence.
  experiment_type: knockout and rescue
- hypothesis: >-
    The cardiac T-tubule signal attributed to AHNAK2 is real and tissue-specific
    rather than an artefact of pan-AHNAK reagents.
  description: >-
    Image AHNAK2 in Ahnak1-null mouse cardiomyocytes and skeletal fibres side by
    side using a validated AHNAK2-specific antibody, with the dihydropyridine
    receptor and vinculin as compartment markers.
  experiment_type: comparative immunofluorescence
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      Supplies AHNAK2's three IBA rows. Resolving the WITH/FROM tokens shows the
      AHNAK2 orthologue is present in only one of the three donor sets.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The GO_REF itself is sound; the per-row assessment is in each annotation's
      propagation_review.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: >-
      Maps SL-0191 (Nucleus) from UniProt's SUBCELLULAR LOCATION comment. For
      AHNAK2 that comment is a bare ECO:0000250 with no source accession, so the
      mapping is faithful but the input is the weakest statement UniProt makes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The pipeline did what it says; the defect is in the UniProt statement it
      consumed.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings:
  - statement: >-
      Human Protein Atlas immunofluorescence, reliability Enhanced for AHNAK2,
      main location Cytosol and additional location Plasma membrane, with no
      nuclear compartment called. These are the only two GOA rows on AHNAK2 that
      rest on a measurement of the human protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reliability tier confirmed directly against the HPA API for AHNAK2
      (ENSG00000185567) rather than assumed.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: >-
      Supplies the cytoplasm and plasma membrane IEA rows via ARBA00026971 and
      ARBA00027801. Neither rule's published condition sets - 2388 and 686
      respectively, over InterPro, PANTHER, FunFam and taxon - mentions any
      AHNAK2 signature.
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      The terms are right and independently supported by IDA, but the rule
      provenance could not be reproduced from the public rule definitions, so
      this is recorded as unverified rather than verified.
- id: PMID:17185750
  title: AHNAK, a novel component of the dysferlin protein complex, redistributes
    to the cytoplasm with dysferlin during skeletal muscle regeneration.
  findings:
  - statement: >-
      Identifies AHNAK as a dysferlin-interacting protein by co-IP/MS and maps the
      binding sites to dysferlin's C2A domain and AHNAK's carboxyterminal domain
      by GST pull-down. The abstract's myoferlin result is likewise attributed to
      AHNAK.
    supporting_text: "As\nexpected, the N-terminal domain of myoferlin also interacts with the\ncarboxyterminal domain of AHNAK."
  - statement: >-
      Places dysferlin and AHNAK at the sarcolemmal membrane and T-tubules of
      normal skeletal muscle. This is the observation behind AHNAK2's T-tubule and
      sarcolemma NAS rows, and the abstract attributes it to AHNAK.
    supporting_text: "In normal skeletal muscle, dysferlin and AHNAK\ncolocalize at the sarcolemmal membrane and T-tubules."
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The identifier and title are correct and the paper is genuinely the source
      of five AHNAK2 rows. Its abstract, which is all that is publicly available
      (Europe PMC inEPMC:N, hasPDF:N), reports only AHNAK. UniProt's AHNAK2 entry
      nevertheless carries the DYSF interaction at ECO:0000269|PubMed:17185750, so
      a curator with the full text did find AHNAK2 data; the DYSF row is therefore
      kept and the MYOF row, which UniProt did not carry across, is left
      UNDECIDED. Not marked MISCITED: the citation is not wrong, it is
      unverifiable at the level of detail the rows assert.
- id: PMID:24675079
  title: Periaxin and AHNAK nucleoprotein 2 form intertwined homodimers through domain
    swapping.
  findings:
  - statement: >-
      Crystal structures of the PDZ-like domains of periaxin and AHNAK2 (PDB 4CN0,
      1.75 A, chains A and B, residues 108-203) showing intertwined domain-swapped
      homodimers, with a six-stranded antiparallel beta sheet built from
      alternating strands of the two chains.
    supporting_text: "The unique\nintertwined, domain-swapped dimers provide a structural basis for the\nhomodimerization of both proteins."
  - statement: >-
      The AHNAK2 PDZ domain crystallised with a bound class III ligand peptide in
      a preformed pocket, with unusual features including two salt bridges and
      weak recognition of the peptide C terminus.
    supporting_text: "The AHNAK2 PDZ domain structure contains a bound class III ligand peptide."
  - statement: >-
      Frames both proteins as scaffolds in complexes linking the extracellular
      matrix to the cytoskeletal network, with tight homodimerisation as the
      central element.
    supporting_text: "Tight homodimerization may be central to the scaffolding functions of\nPRX and AHNAK2 in molecular complexes linking the extracellular matrix to the\ncytoskeletal network."
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The single most informative paper about human AHNAK2's molecular function,
      and the source of the GO:0042803 proposal. PDB accession and resolution
      cross-checked against the UniProt cross-reference line. Note for anyone
      citing it downstream: it reports a homodimer of periaxin and a homodimer of
      AHNAK2, not an AHNAK2-periaxin heterodimer, and AHNAK is not in the
      structure.
- id: PMID:20833135
  title: 'AHNAK1 and AHNAK2 are costameric proteins: AHNAK1 affects transverse skeletal
    muscle fiber stiffness.'
  findings:
  - statement: >-
      Uses antibodies specific for AHNAK1 and AHNAK2 - the only AHNAK2-specific
      localisation reagents used in any study reviewed here - and places both
      proteins in the costameric network of mouse skeletal muscle by
      co-localisation with vinculin.
    supporting_text: "Co-localization of AHNAK1 and AHNAK2 with vinculin clearly\ndemonstrates that both proteins are components of the costameric network."
  - statement: >-
      Reports no AHNAK signal in the T-tubule system, in contrast to the same
      study's positive costameric result.
    supporting_text: "In\ncontrast, no AHNAK expression was detected in the T-tubule system."
  - statement: >-
      A laser wounding assay on AHNAK1-deficient fibres found no membrane-repair
      role for AHNAK1, and AHNAK1-null fibres were significantly stiffer by atomic
      force microscopy. Both results concern AHNAK1, not AHNAK2.
    supporting_text: "A laser\nwounding assay with AHNAK1-deficient fibers suggests that AHNAK1 is not involved\nin membrane repair."
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Source of the costamere proposal. One caution recorded because the affinage
      record got it wrong: the abstract says "no AHNAK expression was detected in
      the T-tubule system", not "no AHNAK2 expression". The paper concerns both
      proteins and calls them AHNAK1 and AHNAK2, so the generic usage plausibly
      covers both, but the stronger paraphrase is not what is written and is not
      relied on here.
- id: PMID:15007166
  title: The AHNAKs are a class of giant propeller-like proteins that associate with
    calcium channel proteins of cardiomyocytes and other cells.
  findings:
  - statement: >-
      The AHNAK2 discovery paper - AHNAK2 was found as the protein still present
      in AHNAK-null mice.
    supporting_text: "Homozygous knockouts showed no obvious phenotype, but revealed instead a second\nAHNAK-like molecule, provisionally designated AHNAK2."
  - statement: >-
      Its localisation of AHNAK2 is hedged in the abstract itself and rests on
      cosedimentation with a dihydropyridine-receptor-containing vesicle fraction
      rather than on an AHNAK2-specific reagent. This is the only independent
      T-tubule evidence for AHNAK2, and it is in cardiomyocytes.
    supporting_text: "The localization of the AHNAKs in\nclose proximity to transverse tubule membranes and Z-band regions of cardiac\nsarcomeres raise the possibility that they might be involved in regulating\nexcitation/contraction coupling of cardiomyocytes"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Read specifically to test whether the T-tubule row could be removed. It
      could not: this paper is independent T-tubule evidence for AHNAK2 in a
      tissue the contrary study did not examine, which is why that row is marked
      over-annotated rather than removed. Mouse Ahnak2 holds GO:0030018 and
      GO:0030659 by IDA from this paper.
- id: PMID:21940993
  title: Self-regulated alternative splicing at the AHNAK locus.
  findings:
  - statement: >-
      Demonstrates a cis, locus-autonomous mechanism: a small AHNAK isoform
      accumulates during muscle differentiation and feeds back on the splicing of
      its own locus. This is the sole experimental basis of AHNAK2's GO:0043484
      IBA row, via mouse Ahnak.
    supporting_text: "During muscle differentiation\nthe small AHNAK is strongly increased, thereby establishing a positive feedback\nloop to regulate mRNA splicing of its own locus."
  - statement: >-
      Shows the same for a 17-kDa periaxin isoform on the periaxin locus, and
      locates the nuclear pool of these proteins in the small isoform rather than
      the giant chain.
    supporting_text: "A small 17-kDa isoform of\nPeriaxin similarly traffics between the cytoplasm and the nucleus to regulate\nmRNA splicing."
  - statement: >-
      States that the AHNAK gene architecture - one 17-kb exon flanked by multiple
      small exons - is shared with AHNAK2 and periaxin. This is what makes the
      PAINT transfer to AHNAK2 a reasonable inference rather than a careless one.
    supporting_text: "This genetic structure is shared by AHNAK2 and Periaxin,\nwhich share a common ancestor."
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Read because it is the single donor-evidence paper behind the splicing IBA.
      It produced 17 GO annotations over two entities, human AHNAK and mouse
      Ahnak, and none on AHNAK2 - so the term reached AHNAK2 only through PAINT.
- id: PMID:25560297
  title: AHNAK2 Participates in the Stress-Induced Nonclassical FGF1 Secretion Pathway.
  findings:
  - statement: >-
      Identifies a heat-shock-dependent association between FGF1 and AHNAK2 by
      immunoprecipitation mass spectrometry, confirmed reciprocally with anti-V5
      and anti-HA antibodies on an adenovirally expressed V5-tagged C-terminal
      fragment of human AHNAK2 in NIH 3T3 cells.
    supporting_text: "The heat shock-dependent association of FGF1 with\nthe large protein AHNAK2 was observed."
  - statement: >-
      shRNA depletion of AHNAK2 drastically reduces stress-induced FGF1 export
      without affecting spontaneous FGF2 export or Notch-inhibition-induced FGF1
      release - a specificity control that distinguishes this from a general
      secretory defect.
    supporting_text: "Depletion of AHNAK2 resulted in a drastic decrease of\nstress-induced FGF1 export but did not affect spontaneous FGF2 export and FGF1\nrelease induced by the inhibition of Notch signaling."
  - statement: >-
      The knockdown constructs target mouse AHNAK2, which is why the human
      annotation proposed here is ISS rather than IMP.
    supporting_text: "Genetic constructs pGFP-V-RS expressing shRNAs that suppress the expression of mouse AHNAK2 were obtained from Origene (Rockville, MD)."
  - statement: >-
      The authors record that commercially available anti-AHNAK2 antibodies could
      not detect the protein reliably, which is why a tagged fragment was used and
      why the evidence is weaker than the headline suggests.
    supporting_text: "commercially available anti-AHNAK2 antibodies failed to reliably detect AHNAK2 both in immunoblotting and immunofluorescence"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The only loss-of-function study of AHNAK2 outside cancer cell lines, and it
      produced no GO annotation anywhere. Full text read; the methods are what
      determined the ISS and IPI evidence codes rather than IMP and IDA.
- id: PMID:31011849
  title: Linkage analysis and whole exome sequencing reveals AHNAK2 as a novel genetic
    cause for autosomal recessive CMT in a Malaysian family.
  findings:
  - statement: >-
      Maps an autosomal recessive CMT locus to chromosome 14q32 in a consanguineous
      family and identifies two segregating AHNAK2 variants, p.T40P and p.H915Y,
      with reduced AHNAK2 mRNA and protein in patient fibroblasts. p.T40P lies
      N-terminal to the PDZ domain at 112-193.
    supporting_text: "Analysis of AHNAK2 expression in the AR-CMT patient fibroblasts showed\nsignificantly reduced mRNA and protein levels."
  - statement: >-
      Its mechanistic framing rests on an asserted direct AHNAK2-periaxin
      interaction, stated as background rather than measured here, and its own
      conclusion is hedged.
    supporting_text: "The altered expression of mutant AHNAK2 may disrupt the\nAHNAK2-PRX interaction in which one of its known functions is to regulate\nmyelination."
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      The genetic finding is sound and correctly cited. The disputed element is
      the background claim that AHNAK2 binds directly to periaxin: a Europe PMC
      search for AHNAK2 and periaxin returns nothing earlier than PMID:24675079,
      which reports domain-swapped homodimers of each protein separately rather
      than a heterodimer. No annotation in this review rests on the interaction
      claim; it is raised in suggested_questions instead. Separately, the affinage
      record describes these as compound heterozygous variants, whereas the
      abstract describes a consanguineous autosomal recessive family - not
      load-bearing, but noted.
- id: PMID:35158796
  title: The Obscure Potential of AHNAK2.
  findings:
  - statement: >-
      A dedicated AHNAK2 review, used as a secondary source for corpus-level
      statements and to locate primary papers. It records how little functional
      work exists on the protein, and states the cardiac-versus-skeletal T-tubule
      discrepancy directly in its text.
    supporting_text: "Little work has been done in exploring the function and\nrelation AHNAK2 has with cancer"
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Never used as evidence for an annotation. Its NLS claim for AHNAK2 sits in a
      paragraph the authors frame as hypothesis from similarity to AHNAK, and
      UniProt annotates no MOTIF or NLS feature on Q8IVF2, so it is not used here.
