id: Q8IVF2
gene_symbol: AHNAK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AHNAK2 is a 5795-residue human protein built from a short N-terminal segment
  carrying a single PDZ domain (residues 112-193), a very large central region of
  ~165-residue low-complexity repeats that occupies roughly two thirds of the
  chain, and a C-terminal segment of about 100 kDa. It has no catalytic domain,
  no nucleotide- or metal-binding site and no enzymatic activity of any kind; its
  architecture is that of a giant submembrane scaffold. The one molecular
  property measured directly is homodimerisation: the crystal structure of its
  PDZ domain is an intertwined, domain-swapped dimer in which a six-stranded
  antiparallel beta sheet is assembled from alternating strands of the two
  chains, with a preformed peptide-binding pocket occupied by a class III ligand.
  The same architecture is seen in the PDZ domain of periaxin, which is AHNAK2's
  closest structural relative.

  In cells AHNAK2 is cytosolic and plasma-membrane-associated. In mouse skeletal
  muscle, antibodies specific for AHNAK2 place it in the costameric network,
  co-distributing with vinculin at the sites that couple sarcomeric Z-discs
  laterally to the sarcolemma and the extracellular matrix, and it associates
  with dysferlin. Outside muscle, AHNAK2 is required for the stress-induced,
  non-classical export of fibroblast growth factor 1: on heat shock it associates
  with FGF1 and both move into the submembrane, F-actin-rich fraction, and loss
  of AHNAK2 largely abolishes stress-induced FGF1 release without affecting FGF2
  release or Notch-inhibition-induced FGF1 release. Loss-of-function variants
  segregate with autosomal recessive Charcot-Marie-Tooth disease, and AHNAK2
  expression is repeatedly associated with invasive behaviour in epithelial
  tumours. Beyond homodimerisation, the biochemical activity through which AHNAK2
  performs any of these roles has not been established.
