- term:
    id: GO:0030315
    label: T-tubule
  evidence_type: NAS
  original_reference_id: PMID:17185750
  qualifier: located_in
  review:
    summary: >-
      The cited paper's T-tubule observation is about AHNAK and dysferlin. The
      independent AHNAK2 evidence is a pan-AHNAK antibody plus a cosedimentation
      inference in cardiomyocytes, and the only study using AHNAK2-specific
      antibodies found no T-tubule signal in skeletal muscle.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Three separate things had to be checked before settling on over-annotated
      rather than removed. First, provenance: the row is NAS from a paper whose
      abstract places dysferlin and AHNAK, not AHNAK2, at the sarcolemmal
      membrane and T-tubules, and human AHNAK received the identical NAS row from
      the same reference. Second, the contrary evidence: the one study that used
      antibodies specific for AHNAK2 reports the costameric network and no
      T-tubule signal, with its own costameric result acting as the positive
      control that the reagent works. Third, and this is why REMOVE is not
      earned: AHNAK2 does have independent T-tubule evidence, from the AHNAK2
      discovery paper, in cardiomyocytes rather than skeletal muscle. That
      evidence is weak - the abstract itself says the AHNAKs only "appear to
      localize" and that the T-tubule proximity "raise the possibility" of a
      role, the localisation came from cosedimentation with a
      dihydropyridine-receptor vesicle fraction rather than from an
      AHNAK2-specific reagent, and the paper's discussion attributes the AHNAK2
      signal to residual staining in AHNAK1-null mice - but it is a real
      observation in a tissue the contrary study did not examine. Over-annotated
      is the calibrated call: not wrong, but resting on no AHNAK2-specific
      reagent, in a different tissue from the one the citing reference describes.
    supported_by:
    - reference_id: PMID:17185750
      supporting_text: "In normal skeletal muscle, dysferlin and AHNAK\ncolocalize at the sarcolemmal membrane and T-tubules."
    - reference_id: PMID:20833135
      supporting_text: "In\ncontrast, no AHNAK expression was detected in the T-tubule system."
    - reference_id: PMID:15007166
      supporting_text: "The localization of the AHNAKs in\nclose proximity to transverse tubule membranes and Z-band regions of cardiac\nsarcomeres raise the possibility that they might be involved in regulating\nexcitation/contraction coupling of cardiomyocytes"
