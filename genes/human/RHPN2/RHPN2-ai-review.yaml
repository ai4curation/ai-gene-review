      RhoA-binding domain but lacking other regions suggested that the disassembly of F-actin stress fibers
      was not simply caused by Rho sequestration.
  - reference_id: PMID:22445486
    supporting_text: Thus, it is evident that lipid binding of rhophilin2-PDZ is important for the physiological
      function of rhophilin2.
  - reference_id: PMID:12473120
    supporting_text: p76RBE is a specific binding protein of RhoB and binds selectively to the GTP-bound
      form of this small GTPase.
- description: >-
    Membrane-binding PDZ module. The C-terminal class B1 PDZ domain of RHPN2 binds anionic
    phospholipids through K576/K579, separately from its peptide-binding groove, and lipid binding
    increases its affinity for an ErbB2 C-terminal peptide. This dual binding targets RHPN2 to the
    plasma membrane and is needed for its effect on stress fibres. No physiological PDZ ligand of
    RHPN2 has been established.
  molecular_function:
    id: GO:0005543
    label: phospholipid binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
