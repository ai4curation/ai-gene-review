core_functions:
- description: >-
    Rho GTPase-binding adaptor that, when expressed in human cells, limits actin stress-fibre
    assembly. RHPN2 binds RhoA and GTP-bound RhoB through its N-terminal HR1/REM-1 region and
    associates with the plasma membrane through anionic-lipid binding by its PDZ domain. Its
    overexpression dissolves stress fibres, which needs the BRO1 and PDZ domains and PDZ-lipid
    binding and is not explained by RhoA sequestration. In human cells this is established
    experimentally for RHPN2 only by overexpression. The physiological requirement is untested in
    human, and Rhpn2-null mice have no overt phenotype. GTPase binding and stress-fibre inhibition
    are shared with the RHPN1 paralog (PAINT node PTN001126281).
  molecular_function:
    id: GO:0031267
    label: small GTPase binding
