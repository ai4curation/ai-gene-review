      RhoB, so it is not proposed as a constitutive location annotation.
- id: PMID:15767687
  title: Normal thyroid structure and function in rhophilin 2-deficient mice.
  findings:
  - statement: Rhpn2-null mice develop normally, are fertile and have normal thyroid structure and
      function.
    supporting_text: Mice lacking rhophilin 2 develop normally, have normal life spans, and are fertile.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Only in vivo loss-of-function study of mammalian Rhpn2 (mouse). It is negative, and it
      shows the TSH/cAMP-induced expression does not reflect an essential thyroid role.
- id: PMID:22445486
  title: Genome-wide functional annotation of dual-specificity protein- and lipid-binding modules that
    regulate protein interactions.
  findings:
  - statement: >-
      The RHPN2 PDZ domain binds anionic lipids through K576/K579. Mutating these lysines makes RHPN2
      cytosolic and abolishes its stress-fibre disassembly activity in HeLa cells.
    supporting_text: K576A/K579A and K576E/K579E with reduced membrane affinity show primarily cytosolic
      distribution with little membrane localization although they have intact protein binding activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Independent confirmation in human cells of the Peck et al. stress-fibre
      phenotype, plus mechanistic lipid-binding data.
- id: PMID:23774217
  title: RHPN2 drives mesenchymal transformation in malignant glioma by triggering RhoA activation.
  findings:
  - statement: >-
      RHPN2 amplification is associated with mesenchymal glioblastoma. Ectopic RHPN2 increases RhoA
      activity and invasion of astrocytes and neural stem cells, and the invasion depends on RhoA.
    supporting_text: these effects were implemented through RHPN2-mediated activation of RhoA, a master
      regulator of cell migration and invasion.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Overexpression in a cancer context. Consistent with Peck et al. finding raised RhoA-GTP
      in RHPN2-expressing cells. RHPN2 is not annotated to positive regulation of RhoA activity because
      the mechanism (direct GEF-like effect or indirect) is unknown.
- id: PMID:40254160
  title: Rhpn2 regulates the development and function of vestibular sensory hair cells through the RhoA
    signaling in zebrafish.
  findings:
  - statement: Zebrafish rhpn2 mutants have fewer vestibular hair cells with shorter stereocilia, and
      Rhpn2 co-immunoprecipitates RhoA.
    supporting_text: co-immunoprecipitation confirms that Rhpn2 directly binds to RhoA
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only cache. Organismal developmental phenotype in zebrafish, not annotated as
      process participation for human RHPN2; used only as corroboration of conserved RhoA binding.
