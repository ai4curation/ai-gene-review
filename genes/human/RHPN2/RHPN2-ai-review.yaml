- id: PMID:25071083
  title: Rhophilin-1 is a key regulator of the podocyte cytoskeleton and is essential
    for glomerular filtration.
  findings:
  - statement: >-
      Transfected human RHPN1 (not RHPN2) inhibits RhoA-dependent stress fibre formation in human
      podocytes. Rhpn1-null mice develop albuminuria and podocyte foot-process effacement.
      Rhophilin-2 is barely detected in glomeruli.
    supporting_text: Taken together, these results indicate that Rhophilin-1 is an inhibitor of Rho-dependent
      stress fiber formation in vitro .
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      Correct paper (PMC4341472, full text read), but it studies Rhophilin-1 only. The two MGI IDA
      rows that cite it for human RHPN2 (plasma membrane; negative regulation of stress fiber
      assembly) belong to human RHPN1 (Q8TCX5). The methods state that human Rhpn1 was the
      transfected cDNA. Kept as the GOA reference for those rows, with source_defects recorded. It is
      relevant to RHPN2 only as paralog evidence.
