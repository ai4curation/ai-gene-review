    supporting_text: 'DR   PANTHER; PTHR23031:SF5; RHOPHILIN-2-RELATED; 1.'
suggested_questions:
- question: >-
    PAINT node PTN001126281 propagates GO:0051497 using human RHPN2 as one seed, but that seed row
    (MGI IDA, PMID:25071083) is mis-keyed RHPN1 evidence. Should the node be re-seeded with the
    direct RHPN2 evidence of Peck et al. 2002 (PMID:12221077)?
- question: >-
    Peck et al. report that RHPN1 overexpression does not affect HeLa stress fibres, while Lal et
    al. report that RHPN1 strongly suppresses them in podocytes. Is stress-fibre inhibition
    shared by both paralogs, or does it depend on cell context and on RHPN1-specific partners?
- question: >-
    How can RHPN2 both increase RhoA-GTP levels (Peck 2002; glioma) and reduce stress fibres? Does it
    divert active RhoA away from ROCK-myosin output, or act through BRO1-dependent membrane
    trafficking?
suggested_experiments:
- description: >-
    Knock out or deplete endogenous RHPN2 in a cell type with high expression (e.g. thyroid,
    prostate or colon epithelium), then measure stress fibres, myosin RLC phosphorylation and
    RhoA-GTP. This would test whether the overexpression phenotype reflects a physiological
    function.
  experiment_type: loss-of-function cell biology
- description: >-
    Proximity labelling (BioID/TurboID) of RHPN2 with and without activated RhoB, to identify
    BRO1-domain partners (e.g. ESCRT-associated proteins) and physiological PDZ ligands on late
    endosomes and the plasma membrane.
  experiment_type: proteomics
