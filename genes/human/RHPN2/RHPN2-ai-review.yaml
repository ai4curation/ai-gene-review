- term:
    id: GO:0031267
    label: small GTPase binding
  evidence_type: IDA
  original_reference_id: PMID:12221077
  review:
    summary: >-
      RHPN2 binds RhoA (GST capture, nucleotide-independent in vitro; E58/N59 needed) and binds
      GTP-bound RhoB selectively (yeast two-hybrid and co-immunoprecipitation). Zebrafish Rhpn2
      co-immunoprecipitates RhoA.
    action: NEW
    reason: >-
      Rho GTPase binding is the defining molecular property of the rhophilin family and is shown
      directly for human RHPN2 in two independent studies. GOA has no informative MF annotation for
      RHPN2. GO:0031267 small GTPase binding is the most specific existing term, since GO has no
      Rho-specific GTPase binding term. The two studies disagree on the partner: Peck et al. found
      nucleotide-independent RhoA binding, while Mircescu et al. found RhoB-GTP binding and no RhoA
      binding. Either result supports small GTPase binding.
    supported_by:
    - reference_id: PMID:12221077
      supporting_text: Glutathione S-transferase-capture experiments revealed that Rhophilin-1 and Rhophilin-2
        interacted with both GDP- and GTP-bound RhoA in vitro.
    - reference_id: PMID:12473120
      supporting_text: By yeast two-hybrid screenings and coimmunoprecipitation, we show here that p76RBE
