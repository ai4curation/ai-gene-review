description: >-
  Rhophilin-2 (RHPN2, also called p76RBE) is a 686-residue cytoplasmic Rho GTPase-binding
  adaptor with an N-terminal HR1/REM-1 Rho-binding region, a central BRO1 domain and a
  C-terminal class B PDZ domain. It binds RhoA and the GTP-bound form of RhoB through its
  N-terminal region (E58/N59 are required for RhoA binding). It is largely cytosolic and
  perinuclear, associates with the plasma membrane through non-specific anionic phospholipid
  binding by its PDZ domain, and is recruited by activated RhoB to CD63-positive late-endosomal
  structures in a BRO1-dependent manner. When overexpressed in human cells, RHPN2 causes
  loss of actin stress fibres. This activity needs the BRO1 and PDZ domains and the
  membrane-binding lysines of the PDZ domain, and it is not explained by sequestration of
  RhoA or by a fall in RhoA-GTP. RHPN2 is therefore thought to limit stress fibre assembly or
  promote F-actin turnover downstream of Rho. Its physiological role is unclear. Expression is
  induced by TSH/cAMP in thyrocytes, yet Rhpn2-null mice have normal thyroid structure and
  function and no overt phenotype. Amplified or overexpressed RHPN2 in glioblastoma and other
  cancers is associated with increased RhoA activation and invasive behaviour.
