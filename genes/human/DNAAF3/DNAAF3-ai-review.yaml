  review:
    summary: Inherited participation in motile-cilium assembly through maturation of its dynein-arm components.
    action: ACCEPT
    reason: 'The human leaf PTN002502984 descends from PTN001858482 in PTHR22118, and the literal IBD
      grounding includes genuine human experimental evidence. DNAAF3 promotes maturation of the outer
      and inner dynein arms that form part of a functional motile cilium. Human patient cilia lack these
      arms, while ortholog rescue and biochemical experiments identify a cytoplasmic assembly defect:
      abnormal heavy/intermediate-chain complexes form but fail to become assembly competent. Persistent
      ciliary projections therefore do not negate participation in their constituent assembly. This is
      a core role. GO:0036158 and GO:0036159 are not current is_a/part_of descendants of GO:0044458, so
      those separately represented arm-assembly processes do not replace this inherited claim.'
