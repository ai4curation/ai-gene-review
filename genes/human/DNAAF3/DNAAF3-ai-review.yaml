core_functions:
- description: Promotes cytoplasmic maturation of assembly-competent outer and inner axonemal dynein arms,
    contributing these components to motile-cilium assembly, with conserved enrichment in DynAPs. Human
    arm defects and ortholog complementation/complex assays support the assembly role. DNAAF3/PF22 is
    a candidate arginine methyltransferase, supported by structural comparisons and loss of dynein arginine
    methylation in an algal null mutant; the intrinsic catalytic activity and its causal relationship
    to maturation remain unresolved.
  directly_involved_in:
  - id: GO:0036158
    label: outer dynein arm assembly
  - id: GO:0036159
    label: inner dynein arm assembly
  - id: GO:0044458
    label: motile cilium assembly
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0120293
    label: dynein axonemal particle
  supported_by:
  - reference_id: PMID:22387996
  - reference_id: PMID:30561330
  - reference_id: PMID:38261620
    supporting_text: no peptides containing methylated Arg
  - reference_id: PMID:39969973
  knowledge_gaps:
  - gap_statement: Whether human DNAAF3 intrinsically catalyses arginine methylation of dynein and whether
      that catalysis is separable from its assembly function.
    boundary: The conserved assembly role and ortholog genetic dependence of dynein arginine methylation
      are established; purified-enzyme turnover and catalytic-dead rescue have not separated these mechanisms
      in the evaluated studies.
    gap_kind:
    - BIOLOGY
    resolution: Compare purified human DNAAF3-dependent SAM turnover and site-resolved dynein methylation
      with catalytic-site and truncation variants, then test rescue with matched expression and localization
      controls.
    provenance:
    - reference_id: PMID:39969973
      supporting_text: the analysis of enzyme-dead and/or truncated forms of DNAAF3
suggested_questions:
- question: Which natural DNAAF3 protein products are expressed in human multiciliated cells, and do they
    share assembly activity and DynAP localization?
