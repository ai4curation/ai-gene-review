gene_symbol: DNAAF3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAAF3 is a cytoplasmic dynein assembly factor required for maturation of outer and inner
  dynein arms before their deployment in motile cilia. Deficiency disrupts respiratory ciliary beating
  and can alter left–right organ patterning, causing primary ciliary dyskinesia. The conserved protein
  concentrates in dynein assembly particles in multiciliated cells. Ortholog genetics, dynein mass spectrometry
  and structural comparisons support a candidate role in arginine methylation during dynein maturation;
  intrinsic human methyltransferase activity and its separation from noncatalytic assembly functions remain
  unresolved. Alternative transcripts encode five predicted products with distinct sequence boundaries.
alternative_products:
- name: '1'
  id: Q8N9W5-1
  description: Canonical 541-residue product. It contains the complete current reference sequence; ortholog
    assembly and methylation evidence does not independently establish intrinsic catalysis by purified
    human protein.
- name: '2'
  id: Q8N9W5-5
  sequence_note: VSP_039967, VSP_039968
  description: Predicted 95-residue product, officially named isoform 2 despite accession suffix -5. Canonical
    residues 77–95 are replaced and residues 96–541 are absent. The official record predicts low abundance
    through nonsense-mediated decay; stable protein expression and equivalent assembly activity are not
    established.
- name: '3'
  id: Q8N9W5-3
  sequence_note: VSP_042976, VSP_039966, VSP_039969
  description: Predicted 608-residue product with an extended N terminus, an insertion at canonical residue
    29 and deletion of canonical residue 350. These sequence changes are reconstructed from the official
    features; equivalent activity and localization are not established.
- name: '4'
  id: Q8N9W5-6
  sequence_note: VSP_042976
  description: Predicted 588-residue product, officially named isoform 4. Its sequence is an exact 47-residue
    N-terminal extension of the canonical product. Historical Leu108 numbering in PMID:22387996 corresponds
    to canonical Leu61, but the paper does not establish an accession-resolved functional comparison of
    natural products.
- name: '5'
  id: Q8N9W5-7
  sequence_note: VSP_055742
  description: Predicted 487-residue product, officially named isoform 5. Canonical residues 1–76 are
    replaced by a shorter distinct N terminus. Retention of downstream sequence does not establish shared
    assembly activity or DynAP localization.
