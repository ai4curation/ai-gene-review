  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative primary proteomics establishes widespread but nonuniversal dynein methylation,
      including the D. melanogaster versus D. willistoni distinction. The authors explicitly leave catalytic
      versus noncatalytic DNAAF3 assembly roles unresolved; these are not active-site-mutagenesis or purified-enzyme
      experiments.
