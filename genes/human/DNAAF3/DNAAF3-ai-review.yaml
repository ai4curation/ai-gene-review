- term:
    id: GO:0044458
    label: motile cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:22387996
  qualifier: involved_in
  review:
    summary: DNAAF3 contributes to assembly of functional motile cilia by maturing their axonemal dynein
      arms.
    action: ACCEPT
    reason: PMID:22387996 directly shows loss of both dynein-arm classes in human patient respiratory
      cilia; zebrafish knockdown leaves ciliary morphology and number largely intact while disrupting
      arms and motility. In Chlamydomonas, rescue and cytoplasmic heavy/intermediate-chain assays show
      that PF22/DNAAF3 supports maturation into assembly-competent motors. The performed work is dynein-component
      assembly, not merely an effect on beating or a claim that DNAAF3 builds the ciliary membrane. GO:0044458
      encompasses arrangement of components into a motile cilium, making this core participation despite
      persistence of projections. The specific arm terms are retained separately because neither is an
      is_a/part_of descendant of GO:0044458.
    supported_by:
    - reference_id: PMID:22387996
      supporting_text: cilia that lack both outer and inner dynein arms
    - reference_id: file:human/DNAAF3/DNAAF3-evidence-guide.md
