  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Bingham & Schroer 1999, the paper that purified native Arp1 and characterised its polymerisation.
      Load-bearing twice. It is the reason the proposed nucleotide term is GO:0043531 ADP binding and
      not GO:0005524 ATP binding: it states that Arp1 ''is predicted to bind ATP and possibly polymerize''
      on the basis of conserved sequence features, so ATP binding has never been demonstrated for Arp1,
      whereas ADP is resolved in all eight Arp1 protomers of PDB 9B85. It also bounds the polymerisation
      claim: Arp1 filaments annealed over time but never reached conventional actin-filament length, which
      is why no filament-dynamics term is proposed. Abstract-only in the cache; both claims used here
      are in the abstract.'
