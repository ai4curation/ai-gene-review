    action: KEEP_AS_NON_CORE
    reason: 'Genuine, direct, dynactin-internal interaction with the pointed-end capping Arp, but expressed
      through an uninformative term. Not downgraded further: per project policy an experimental annotation
      is not second-guessed on the basis of a full text I cannot read.'
    supported_by:
    - reference_id: PMID:12857853
      supporting_text: but Arp1 has a vanishingly low critical concentration for polymerization
