- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32814053
  qualifier: enables
  supporting_entities:
  - UniProtKB:P42858
  review:
    summary: The only non-dynactin partner among the five protein-binding rows, and the weakest. UniProt
      reports NbExp=3 for the ACTR1B-HTT pair, which reads like triplicate independent support, but all
      three IntAct records -- two hybrid array, two hybrid pooling and validated two hybrid -- come from
      PMID:32814053 alone, a single systematic yeast two-hybrid screen of neurodegeneration-associated
      proteins. Three Y2H formats in one study are not independent replication. Huntingtin's documented
      route to dynactin in the literature is indirect, via HAP1 to p150Glued, not via the Arp1 filament,
      and no orthogonal assay places HTT on Arp1.
    action: MARK_AS_OVER_ANNOTATED
    reason: Unreplicated yeast two-hybrid hit from a disease-focused screen, presented by UniProt's NbExp
      count as if it were three independent experiments when all three records share one publication.
      Not removed -- Y2H is an experimental assay and HTT is a plausible dynactin-pathway protein -- but
      it should not stand as an ACTR1B molecular function.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:33961781
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q14203
  review:
    summary: 'BioPlex 3.0 affinity-purification mass spectrometry. Taken together with the rest of that
      dataset this is the strongest modern evidence that ACTR1B is in assembled dynactin: IntAct returns
      ACTR1B partnered with DCTN1 through DCTN6, CAPZA1, CAPZA2, CAPZB, ACTR10 and ACTR1A itself, i.e.
      both filament ends, the shoulder and the pointed-end complex. The co-purification with ACTR1A in
      particular shows the two paralogs occupy the same filament rather than separate alpha-only and beta-only
      dynactins. All of that content belongs in the complex annotation, not in a bare binding term.'
    action: KEEP_AS_NON_CORE
    reason: Real co-complex partner from a high-quality AP-MS network; the biologically informative statement
      is dynactin membership, which is separately annotated.
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6798748
  qualifier: located_in
  review:
    summary: 'Topologically impossible for a cytosolic actin-fold protein. This extracellular region assertion
      comes from the Reactome Neutrophil degranulation pathway, where ACTR1B is modelled as a granule
      lumen protein released by exocytosis. The Reactome pathway model places ACTR1B among the neutrophil
      granule lumen proteins, membership that traces to granule subcellular-fraction proteomics (Reactome''s
      own summation for these reactions cites Rorvig et al. 2009, 2013). ACTR1B has no signal peptide
      and no transmembrane segment -- the P42025 feature table contains only CHAIN, MOD_RES and VARIANT
      -- and UniProt places it in the cytoplasm and cytoskeleton only, with the founding paper finding
      no free pool outside dynactin. A cytosolic actin-fold protein cannot be topologically inside a granule
      lumen or secreted. The decisive argument is the paralog pair: ACTR1A is in the same complex at roughly
      fifteen times the abundance, so if beta-centractin were genuinely granule-lumen cargo alpha-centractin
      would necessarily be too, and ACTR1A carries none of these four Reactome annotations. The asymmetry
      is detection stochasticity in a granule proteome, not localisation. If the proteomic observation
      is worth recording at all, the honest representation is a granule-associated cytoplasmic-face location
      or the extracellular-vesicle row already on this record, not a lumen or extracellular term.'
    action: REMOVE
    reason: 'Pathway-model-derived location that contradicts the protein''s topology: no signal peptide,
      no transmembrane segment, curated location is cytoplasm and cytoskeleton, no free pool outside dynactin.
      The paralog test settles it: ACTR1A, fifteen times more abundant in the same complex, carries none
      of these annotations, so the beta-only pattern reflects granule-proteome detection stochasticity
      rather than localisation.'
    supported_by:
    - reference_id: file:human/ACTR1B/ACTR1B-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cytoplasm, cytoskeleton. Cytoplasm, cytoskeleton,'
    - reference_id: PMID:7696711
      supporting_text: "Both isoforms were found predominantly in the \ncytosolic fraction as a part of\
        \ a previously identified 20S complex (referred to \nas the dynactin complex) with no evidence\
        \ for a free pool of either isoform."
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: Reactome:R-HSA-6798748
        source_label: Reactome reaction (Neutrophil degranulation)
        source_status: SOURCE_BAD
        comment: Pathway model, not a gene product. It places ACTR1B in the granule lumen compartment
          on the strength of granule-fraction proteomics; the compartment assignment does not hold for
          a cytosolic protein.
