- term:
    id: GO:0043531
    label: ADP binding
  evidence_type: ISS
  original_reference_id: file:human/ACTR1B/ACTR1B-bioinformatics/RESULTS.md
  qualifier: enables
  supporting_entities:
  - UniProtKB:P61163
  review:
    summary: 'Proposed restoration of a nucleotide-binding molecular function that GOA lost as collateral
      rather than by judgement, with the ligand corrected to the one actually observed. UniProt still
      records ATP binding for P42025 in its cross-reference block and still carries the ATP-binding and
      Nucleotide-binding keywords, but the term is absent from the current GOA download because the Swiss-Prot-keyword
      pipeline behind GO_REF:0000043 was retired wholesale. ADP rather than ATP is proposed because ATP
      binding by Arp1 has never been demonstrated: the paper that purified native Arp1 and showed it polymerises
      states that Arp1 ''is predicted to bind ATP and possibly polymerize'' on the basis of conserved
      sequence features. What has been observed is ADP: in the 2025 cryo-EM structure of human dynactin
      all eight Arp1 filament protomers are modelled with a bound ADP. Deriving the nucleotide-contact
      residues from that structure and testing retention in ACTR1B gives 17 of 18 identical, with no gaps,
      and the single difference is position 215 lysine to arginine -- where arginine is what S. pombe
      arp1, S. cerevisiae ARP1, C. elegans arp-1, A. nidulans AN1953 and conventional beta-actin all carry.
      ACTR1B holds the consensus residue and ACTR1A is the outlier, so beta-centractin''s nucleotide site
      is intact and arguably more canonical than alpha''s. The same substitution is fixed in mouse Actr1b,
      confirming it is a paralog feature and not human noise.'
    action: NEW
    reason: 'A well-supported nucleotide-binding function was removed by pipeline retirement, not refuted,
      and restoring it as GO:0043531 ADP binding keeps the annotation to what the evidence shows. ATP
      binding remains a prediction for Arp1 (PMID:10074429), whereas ADP is resolved in every Arp1 protomer
      of PDB 9B85. ISS is the honest code: the nucleotide is seen in the ACTR1A protomers and ACTR1B''s
      site is inferred from residue-level retention rather than measured, since ACTR1B appears in no deposited
      structure. The parallel, independent ACTR1A review reached the same ADP-over-ATP conclusion from
      the same structure, so the paralog pair should carry the same term. Two encoding notes. The ISS
      with/from is the sequence accession UniProtKB:P61163 alone; the structure PDB 9B85 is the evidence
      behind that choice and is cited as a reference rather than stuffed into with/from, where a PDB id
      would be unconventional. And if a curator objects even to ADP -- on the grounds that the nucleotide
      seen in the alpha protomers is being transferred to beta by similarity -- the fallback is the parent
      GO:0000166 nucleotide binding, which is still better than the current state of no nucleotide-binding
      MF at all. Two honesty notes on the ligand. ADP is the nucleotide resolved in 9B85, but that is
      a single post-hydrolysis structural state of a purified complex, so it evidences that the site is
      occupied by a nucleotide far more strongly than it evidences specificity for ADP over ATP; an actin-family
      protein would be expected to bind both, and the honest reading is ''ADP is what has been seen, ATP
      is what has been predicted''. And the UniProt DR line quoted in supported_by names ATP binding rather
      than ADP binding on purpose: it is cited as evidence that a nucleotide-binding MF was present and
      has been lost from GOA, not as evidence of which nucleotide is bound.'
