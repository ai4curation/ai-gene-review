- term:
    id: GO:0070062
    label: extracellular exosome
  evidence_type: HDA
  original_reference_id: PMID:23533145
  qualifier: located_in
  review:
    summary: Detected in a shotgun proteome of exosomes from expressed prostatic secretions in urine,
      a preparation in which roughly 900 proteins were reported. Unlike the neutrophil-granule rows this
      one is on both centractin paralogs from the same dataset, so it is at least internally consistent;
      but abundant cytosolic cytoskeletal complexes are the archetypal co-purifiers in bulk extracellular-vesicle
      preparations, and there is no orthogonal validation for ACTR1B.
    action: MARK_AS_OVER_ANNOTATED
    reason: Single high-throughput extracellular-vesicle proteome, no orthogonal confirmation, and dynactin
      is a cytosolic complex. Not removed, because EV packaging of cytosolic proteins is real and the
      observation is reproducible across the paralog pair -- but it is not part of ACTR1B's function.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: HDA
  original_reference_id: PMID:19946888
  qualifier: located_in
  review:
    summary: From an NK-cell membrane-proteome survey that identified 1843 proteins and itself estimated
      only about 40 per cent of them to be plausible membrane proteins, describing the remainder as species
      that might merely be transiently associated with membranes. ACTR1B has no transmembrane segment
      and no lipid anchor. ACTR1A, its partner in the same complex, did not pick up this annotation, which
      again points to detection stochasticity rather than membrane residence.
    action: MARK_AS_OVER_ANNOTATED
    reason: A generic membrane term from a fractionation proteome whose own authors caution that most
      of the list is not integral to membranes. Dynactin does work on membrane cargo, so peripheral association
      is not absurd, but located_in membrane overstates it.
    supported_by:
    - reference_id: PMID:19946888
      supporting_text: "The remaining species were largely involved in cellular processes and \nmolecular\
        \ functions that could be predicted to be transiently associated with \nmembranes."
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-2213248
  qualifier: located_in
  review:
    summary: Correct and well supported. Reactome places dynactin in the cytosol for the dynein-dependent
      transport of peptide-loaded MHC class II to the cell surface, and the founding beta-centractin paper
      found both centractin isoforms predominantly in the cytosolic fraction, entirely within the 20S
      dynactin complex, with no free pool. This is where ACTR1B does its work.
    action: ACCEPT
    reason: The primary compartment for ACTR1B, backed by direct human subcellular fractionation of the
      isoform itself, not only by pathway inference.
    supported_by:
    - reference_id: PMID:7696711
      supporting_text: "Both isoforms were found predominantly in the \ncytosolic fraction as a part of\
        \ a previously identified 20S complex (referred to \nas the dynactin complex) with no evidence\
        \ for a free pool of either isoform."
