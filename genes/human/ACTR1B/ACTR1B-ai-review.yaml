- term:
    id: GO:0005869
    label: dynactin complex
  evidence_type: TAS
  original_reference_id: PMID:7696711
  qualifier: part_of
  review:
    summary: 'The single most important annotation on this record, and the answer to whether ACTR1B''s
      dynactin membership is documented or merely assumed from paralogy. It is documented, in human, with
      reagents built specifically to avoid the paralog: the authors raised new antibodies precisely because
      existing anti-alpha-centractin reagents reacted only poorly with beta-centractin, combined them
      with two-dimensional gels, and found both isoforms in the cytosolic 20S dynactin complex with no
      free pool of either, at a constant ratio of about 15:1 alpha to beta. Over the eight Arp1 protomers
      of a dynactin particle that implies roughly one beta protomer per second complex -- a genuinely
      sub-stoichiometric subunit of a hetero-oligomeric filament. Modern AP-MS agrees and adds that ACTR1B
      co-purifies with ACTR1A, so the paralogs share one filament rather than forming separate alpha-only
      and beta-only dynactins. A second, modern instance of the same methodological point closes the case:
      the 2025 study that solved the human dynactin structure probed its effector''s binding with an **anti-Arp1b**
      antibody, testing Dre1 variants in co-transfection assays against p150glued, p50-dynamitin and Arp1b,
      and immunoblotting Strep affinity-purification eluates for Arp1b alongside p150glued, p50-dynamitin
      and dynein. Those two statements are Methods -- what was assayed and what was blotted -- so the
      result itself is carried by a third sentence: Dre1 variants predicted to disrupt the fold ''decreased
      binding of endogenous dynactin subunits and dynein'', and a conservative F195Y replacement did not,
      which presupposes baseline binding of the endogenous subunits assayed. Since Arp1b is one of the
      three dynactin subunits in that readout and is detected with a paralog-specific antibody, endogenous
      beta-centractin is among the dynactin subunits recovered on Dre1: a modern, human, paralog-resolved
      result independent of AP-MS, thirty years after the 2D-gel work. The per-subunit bands are in Figure
      2D, which the cached text does not render, so the claim is stated at exactly that strength and no
      further -- and note the irony that these authors chose anti-Arp1b as their Arp1-filament readout
      while depositing a structure that models every filament protomer as alpha.'
    action: ACCEPT
    reason: 'Core, and established by direct isoform-resolving experiment in human cells. One curation
      recommendation: the evidence code understates the evidence. PMID:7696711 is not a review being cited
      for a traceable statement -- it is the primary paper that generated isoform-specific antibodies
      and ran 2D gels on cytosolic fractions, so IDA is the appropriate code. ACTR1A''s row from the same
      paper should be re-coded with it.'
