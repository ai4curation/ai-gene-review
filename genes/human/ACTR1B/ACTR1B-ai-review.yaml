  review:
    summary: 'Proposed to fill a genuine gap: ACTR1B''s only biological process in GOA is the non-core
      GO:0030473 nuclear migration along microtubule, so the record carries nothing about the transport
      function dynactin actually exists to perform. This is inferred from curated complex membership,
      not from the paralog: ACTR1B''s own UniProt FUNCTION line states that it is a component of a multi-subunit
      complex involved in microtubule-based vesicle motility, and its membership in that complex is established
      directly in human cells by isoform-specific antibodies plus two-dimensional gels, and independently
      by AP-MS recovering the full dynactin roster. Standard GO practice attributes the process of a complex
      to its structural subunits with involved_in.'
    action: NEW
    reason: 'Dynactin''s core biological role is dynein-dependent minus-end transport of vesicles and
      organelles, and ACTR1B is a documented structural subunit of dynactin. IC with GO:0005869 as the
      supporting entity records exactly that reasoning: the inference is from complex membership, which
      is experimentally established for ACTR1B itself, rather than from similarity to ACTR1A. On term
      choice: dynactin''s cargo is heterogeneous (vesicles, organelles, nuclei, mRNA, viruses), so the
      parent GO:0030705 cytoskeleton-dependent intracellular transport would be the true LCA of everything
      dynactin moves. GO:0047496 is chosen instead because it is what the cited evidence actually states
      -- UniProt''s FUNCTION line for P42025 specifies microtubule-based vesicle motility, and ACTR1A
      carries GO:0016192 vesicle-mediated transport by TAS -- and because being specific where the evidence
      is specific is safer than asserting a breadth no ACTR1B-cited source supports. Happy to generalise
      if curators prefer the LCA framing.'
