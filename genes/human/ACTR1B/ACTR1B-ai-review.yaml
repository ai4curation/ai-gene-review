core_functions:
- description: 'Beta-centractin is a sub-stoichiometric protomer of the actin-like Arp1 mini-filament
    that forms the backbone of the dynactin complex. Its own activity is structural: like alpha-centractin
    it polymerises into the defined-length filament on which the dynactin shoulder, the pointed-end complex
    and the capping protein are assembled, and it thereby contributes to the complex-level activity of
    dynactin, which is to bind cytoplasmic dynein together with a coiled-coil adaptor and convert it into
    a fast, ultra-processive minus-end motor. Beta-centractin is not an independent actor: subcellular
    fractionation with isoform-specific antibodies found no free pool of either centractin isoform outside
    the 20S complex, and it co-purifies with alpha-centractin, so the two paralogs occupy the same filament
    at a fixed ratio of about one beta to fifteen alpha. Unlike conventional actin the Arp1 filament is
    a fixed-length, non-treadmilling ruler whose length is set by other dynactin subunits, so terms describing
    filament turnover do not apply. The nucleotide site is intact -- 17 of 18 nucleotide-contact residues
    of the ADP-bound Arp1 protomer in the human dynactin structure are conserved, and the one difference
    is to the residue carried by conventional actin and four Arp1 orthologues -- so nucleotide binding
    is a genuine molecular function of beta-centractin as well, though the ligand demonstrated for Arp1
    is ADP rather than ATP. One note on the terms chosen here: contributes_to GO:0140660 cytoskeletal
    motor activator activity is deliberately aspirational. It is the semantically correct complex-level
    activity for a dynactin subunit -- dynactin''s whole purpose is to bind cytoplasmic dynein and increase
    its processivity -- but the term currently has zero human annotations, so it is recorded here and
    raised as a complex-wide gap in suggested_questions rather than proposed as a NEW row for this one
    gene. The asymmetry with the structural MF, which does reach existing_annotations as a proposed replacement
    term, is intentional.'
