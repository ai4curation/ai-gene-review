- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12857853
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q14203
  review:
    summary: IntAct records this pair from a density-sedimentation experiment with both partners detected
      by western blot as neutral components, i.e. cytosolic beta-centractin co-sediments with p150Glued
      in the 20S complex. That is co-membership in dynactin, not a direct contact -- p150 is housed in
      the dynactin shoulder and reaches the filament through the four p50/DCTN2 subunits, and DCTN1 is
      not even modelled in the human dynactin cryo-EM structure. Bare protein binding therefore adds nothing
      beyond the part_of GO:0005869 annotation, which states the same fact informatively.
    action: KEEP_AS_NON_CORE
    reason: The partner is real and the experiment is real, so this is not over-annotation; but protein
      binding conveys no function, and the evidence is co-sedimentation rather than a demonstrated direct
      interface. Kept as non-core; the informative encoding is the dynactin complex term.
    supported_by:
    - reference_id: PMID:33734450
      supporting_text: The unique architecture of the shoulder securely houses the p150 subunit and positions
        the four identical p50 subunits in different conformations to bind dynactin's filament.
- term:
    id: GO:0005515
