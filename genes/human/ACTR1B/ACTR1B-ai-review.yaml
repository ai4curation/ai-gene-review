  knowledge_gaps:
  - gap_statement: No experiment has isolated beta-centractin's own contribution to dynactin. There is
      no beta-selective depletion, no dynactin reconstituted with a defined beta content, and no reported
      phenotype for loss of ACTR1B alone; ACTR1B scores as a hit in about 17 per cent of CRISPR screens
      against about 48 per cent for ACTR1A, so it appears dispensable in most cell lines. Everything annotated
      to ACTR1B beyond its physical presence in dynactin is therefore an inference from complex membership.
    boundary: 'What IS known: beta-centractin is physically in the cytosolic 20S dynactin complex in human
      cells, shown with isoform-specific antibodies and two-dimensional gels and confirmed by AP-MS recovery
      of the full dynactin roster including alpha-centractin itself; its abundance in the complex is about
      one fifteenth of alpha''s; its nucleotide site and Arp1 protomer interface are conserved. What is
      NOT known is whether the beta protomer does anything alpha does not.'
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: This is the gap that decides how much of ACTR1B's record is real. If beta is functionally
      interchangeable with alpha, its annotations are correct but wholly derivative of complex membership.
      If it is not interchangeable, then the five fixed, conservative substitutions at the Arp1-Arp1 interface
      -- a set invariant between human and pig alpha-centractin, yet all five present in mouse Actr1b
      -- are the candidate site of the difference, and no annotation currently captures it.
    resolution: Beta-selective knockout in cells with a quantitative dynactin readout, paired with isoform-resolved
      mass spectrometry of dynactin composition and with polymerisation assays on beta versus alpha and
      on an ACTR1A carrying the five beta interface residues.
