- id: PMID:40186871
  title: The Chlamydia effector Dre1 binds dynactin to reposition host organelles during infection.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The first cryo-EM structure of human dynactin (PDB 9B85, 9B7J), obtained by affinity
      purification with the Chlamydia effector Dre1. Three uses here, and the third was initially missed.
      (i) It states that dynactin binds betaIII spectrin on Golgi membranes through its Arp1 subunit,
      which is load-bearing for the GO:0106006 argument. (ii) The deposited coordinates supply the nucleotide-site
      and protomer-interface residues used in the bioinformatics analysis; all eight Arp1 protomers are
      modelled as ACTR1A with bound ADP, and at 3-5 A local filament resolution two 90-per-cent-identical
      paralogs could not be distinguished, so ACTR1B''s absence from the model is not evidence against
      its incorporation. (iii) The paper is NOT ACTR1A-only at the bench: it probes Dre1 binding with
      an anti-Arp1b antibody, testing Dre1 variants in co-transfection assays against p150glued, p50-dynamitin
      and Arp1b, and immunoblotting Strep affinity-purification eluates for Arp1b. Those are Methods statements;
      the result is carried by the accompanying report that fold-disrupting Dre1 substitutions ''decreased
      binding of endogenous dynactin subunits'' while a conservative F195Y replacement did not, both presupposing
      a baseline, in the same Figure 2D panel. So the paper does establish a 2025, human, paralog-resolved
      recovery of endogenous beta-centractin on Dre1, independent of AP-MS -- but the per-subunit bands
      are in Figure 2D, which the cached text does not render, so the claim is made at that strength and
      no further. This third use was added after review; it is a genuine strengthening of the GO:0005869
      case that the first pass overlooked because the paper writes ''Arp1b'' in lower case.'
