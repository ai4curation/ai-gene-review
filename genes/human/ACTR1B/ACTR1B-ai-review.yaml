  evidence_type: IPI
  original_reference_id: PMID:12857853
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9QZB7
  review:
    summary: 'A different experiment in the same paper: IntAct records this pair as a pull down, matching
      the reported coprecipitation of recombinant Arp11 and Arp1. The partner is mouse Actr10/Arp11, which
      UniProt flags as Xeno, and Arp11 is the genuine pointed-end cap of the Arp1 mini-filament, so this
      is a real and mechanistically meaningful dynactin-internal contact. Note that GOA''s seeding collapses
      the two PMID:12857853 rows into one; they are separate experiments with separate partners and are
      reviewed separately here. One limit I could not close: the cached full text lacks the Materials
