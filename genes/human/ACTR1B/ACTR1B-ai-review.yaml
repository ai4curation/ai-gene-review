id: P42025
gene_symbol: ACTR1B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ACTR1B encodes beta-centractin (Arp1B), one of two human actin-related protein 1 paralogs
  and a subunit of dynactin, the multiprotein cofactor that activates cytoplasmic dynein for long-range
  transport towards microtubule minus ends. Dynactin is built around a short, actin-like filament of eight
  Arp1 protomers plus one conventional actin, capped at the barbed end by capping protein and at the pointed
  end by Arp10/Arp11 with the p62-p25-p27 complex; this filament is the structural core on which the p150Glued-containing
  shoulder and the cargo-adaptor binding sites are assembled. Beta-centractin is 91 per cent identical
  to alpha-centractin and co-assembles with it into the same filament, but as a minor component: subcellular
  fractionation with isoform-specific antibodies places both isoforms entirely within the cytosolic 20S
  dynactin complex, with no free pool of either, at a constant ratio of roughly fifteen alpha to one beta.
  Both paralogs are ubiquitously expressed without tissue restriction -- it is a third, gamma-centractin
  mRNA species that is tissue-specific -- but beta is the minor of the two by protein abundance. Through
  dynactin, beta-centractin participates in dynein-dependent movement of vesicles and organelles, endosome
  and lysosome positioning, Golgi organisation and nuclear positioning, and the complex is found in the
  cytosol and at the centrosome. The Arp1 filament differs from conventional actin in being a fixed-length,
  non-dynamic polymer whose length is set by other dynactin subunits rather than by treadmilling, and
  its protomers each bind a nucleotide. No function has been demonstrated for beta-centractin outside
  dynactin, and no phenotype has been reported for its loss alone.'
