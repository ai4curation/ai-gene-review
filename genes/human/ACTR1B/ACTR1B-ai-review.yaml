suggested_questions:
- question: Should the GO:0106006 cytoskeletal protein-membrane anchor activity annotation be moved off
    the centractin PANTHER node? It reaches ACTR1A and ACTR1B from PTN007551901 with a single experimental
    donor, S. pombe arp1 (EXP, PMID:25736293), and that paper demonstrates a requirement for cortical
    dynein anchoring while showing that the cortical receptor Num1 binds dynein independently of dynactin.
    GO:0106006 requires a bridge to a plasma-membrane component maintaining the cytoskeleton at a cortical
    location; the only documented Arp1-membrane-skeleton bridge is to Golgi betaIII spectrin on intracellular
    membranes. Replacing it with GO:0005200 structural constituent of cytoskeleton (qualifier enables)
    would fix both human paralogs in one edit and restore a structural molecular function they currently
    lack entirely. GO:0005200 is the term beta-actin carries, that S. cerevisiae ARP1 holds by IDA, and
    that ACTR10/Arp11 -- the capping subunit of this very filament -- already holds by IBA with enables;
    GO:0140378 protein complex scaffold activity is a defensible alternative with a tighter definition
    but no family precedent. The independent review of ACTR1A converged on the same recommendation.
- question: The GO:0005869 dynactin complex row on PMID:7696711 is coded TAS for both ACTR1B and ACTR1A,
    but that paper is primary research that raised isoform-specific antibodies and ran two-dimensional
    gels on cytosolic fractions specifically to tell the two centractins apart. Should both rows be re-coded
    IDA? As it stands, the strongest and most paralog-specific evidence either gene has is recorded with
    the weakest applicable code.
- question: Pig ACTR1A (F2Z5G5) carries GO:0030989 dynein-driven meiotic oscillatory nuclear movement
    by IDA, assigned by ComplexPortal from PMID:36071160, a reconstituted dynein-dynactin-BICDR1 motility
    and cryo-EM study. GO:0030989 is defined by oscillation led by an astral array emanating from a spindle
    pole body during meiosis I, a structure absent from mammals, and the cited paper assays neither meiosis
    nor nuclei. Since F2Z5G5 is a WITH/FROM donor on both human centractins' GO:0030473 IBA, should that
    donor annotation be corrected?
- question: GO:0140660 cytoskeletal motor activator activity has zero human protein annotations, yet dynactin
    is the textbook activator of cytoplasmic dynein and GO:0034452 dynactin binding is defined as binding
    a complex that activates dynein-based motor activity. Should the dynactin subunits carry GO:0140660
    with contributes_to?
- question: Are the four Reactome Neutrophil degranulation annotations on ACTR1B (extracellular region
    twice, secretory granule lumen, ficolin-1-rich granule lumen) worth retiring pathway-wide rather than
    gene by gene? ACTR1B has no signal peptide or transmembrane segment and no free pool outside dynactin,
    and its partner in the same complex, ACTR1A, is fifteen times more abundant yet appears in none of
    these reactions -- so the pattern is granule-fraction carryover. The same asymmetry test could be
    applied systematically to other cytosolic complex subunits in that pathway.
- question: UniProt reports NbExp=3 for the ACTR1B-HTT interaction, but all three IntAct records come
    from one publication (PMID:32814053) as three yeast two-hybrid formats. Should NbExp distinguish independent
    publications from assay variants within a study, given that GO curators use it as a proxy for replication?
suggested_experiments:
- description: Isoform-resolved dynactin composition by targeted mass spectrometry. Purify dynactin from
    human cells and quantify paralog-distinguishing peptides for ACTR1A and ACTR1B by parallel reaction
    monitoring, to test the 1994 15:1 ratio with modern accuracy and to establish whether beta occupancy
    is bimodal (some particles with one beta, others with none) or graded. The prediction from the ratio
    and the eight-protomer filament is roughly one beta per two particles.
- description: Does beta occupy a defined position in the filament? Reconstitute dynactin, or immunoprecipitate
    it, using an epitope-tagged ACTR1B and determine the structure at a resolution sufficient to place
    the tag, or crosslink and map ACTR1B-ACTR1A and ACTR1B-CAPZ/ACTR10 crosslinks. The barbed and pointed
    ends are chemically distinct environments, so a preferred position would be functionally meaningful.
- description: Test whether the five conservative substitutions at the Arp1-Arp1 interface matter. The
    interface is 37/37 invariant between human and pig alpha-centractin at 90.3 per cent overall identity,
    yet ACTR1B differs at 5/37 at 90.4 per cent, which suggests relaxed constraint on a protomer that
    never has to tile the whole filament. Measure the critical concentration and elongation rate of homomeric
    beta-centractin filaments against alpha, and of an ACTR1A carrying the five beta residues (V45M, Y197L,
    S207T, I213V, I268V), to see whether beta is an intrinsically poorer polymer.
- description: A clean ACTR1B loss-of-function test. ACTR1B is a hit in only about 17 per cent of CRISPR
    screens against 48 per cent for ACTR1A, so knock out ACTR1B alone in cells where dynactin function
    can be read out quantitatively (single-molecule motility of purified dynactin, Golgi ribbon integrity,
    lysosome positioning) and ask whether anything changes. A genuinely null result would be worth recording,
    since it would mean the annotations on ACTR1B rest entirely on complex membership.
- description: Is the spectrin bridge paralog-specific? Golgi betaIII spectrin binds Arp1 directly, but
    that work used alpha-centractin reagents. Test recombinant ACTR1B against the two mapped Arp1-binding
    sites of betaIII spectrin alongside ACTR1A. This is the single experiment that would decide whether
    any membrane-anchor molecular function belongs on ACTR1B at all, rather than being inherited from
    its paralog.
