existing_annotations:
- term:
    id: GO:0030473
    label: nuclear migration along microtubule
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Dynein-dynactin does drive nuclear movement along microtubules, and this is the one propagated
      biological process on the record whose donors carry real experimental evidence for it. The strongest
      donor is the Aspergillus nidulans entry, whose IMP comes from the paper that cloned nudK and identified
      it as Arp1, giving the first evidence that dynactin acts in nuclear migration; the S. pombe donor
      adds IMP evidence for the meiotic descendant term. Human ACTR1A holds the identical IBA from the
      identical donor set, so this is a family-level term shared by both centractins rather than a transfer
      between them. Kept as non-core because nuclear migration is one downstream instance among many dynactin-dependent
      transport processes, and because ACTR1B is a sub-stoichiometric protomer of the filament rather
      than a dedicated nuclear-migration factor.
    action: KEEP_AS_NON_CORE
    reason: Term is correct in kind and its donors are experimentally supported in two fungi, but it names
      a single downstream process of the complex ACTR1B belongs to, not ACTR1B's core role. No human experimental
      evidence exists for either centractin paralog here.
    supported_by:
    - reference_id: PMID:10467007
      supporting_text: "We have cloned one of \nthe genes, nudK, and determined that it encodes the actin-related\
        \ protein Arp1, \nwhich is a component of the dynactin complex."
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000233666
        source_label: PANTHER tree node (pan-eukaryotic Arp1/centractin clade)
        source_status: UNRESOLVED
        comment: 'PANTHER tree node, not a protein: cannot itself carry evidence.'
      - source_id: PomBase:SPBC1347.12
        source_label: arp1, S. pombe (O94630, Swiss-Prot)
        source_status: SUPPORTS_TRANSFER
        comment: Carries IMP + NAS (PMID:25736293) for the descendant GO:0030989, so it has its own experimental
          evidence under this term.
      - source_id: UniProtKB:F2Z5G5
        source_label: ACTR1A, Sus scrofa (alpha-centractin, Swiss-Prot)
        source_status: SOURCE_BAD
        comment: Its only experimental annotation under GO:0030473 is a ComplexPortal IDA to the descendant
          GO:0030989 from PMID:36071160 -- a reconstituted dynein-dynactin-BICDR1 motility/structure paper.
          GO:0030989 is defined by movement led from a spindle pole body during meiosis I, which pig cells
          do not have; that donor row looks wrong. It does not undermine the organism-neutral parent term.
      - source_id: UniProtKB:Q5BBX7
        source_label: ANIA_01953 / AN1953, Aspergillus nidulans
        source_status: SUPPORTS_TRANSFER
        comment: 'UNREVIEWED (TrEMBL) and named ''Uncharacterized protein'', so its name is not evidence
          of function -- but its annotations are: it carries GO:0030473 by IMP (PMID:10467007, which identified
          nudK as Arp1).'
- term:
    id: GO:0106006
    label: cytoskeletal protein-membrane anchor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  review:
    summary: 'This is the substantive defect on the record, and it affects ACTR1A identically. GO:0106006
      is defined as the binding activity of a molecule that brings together a cytoskeletal protein or
      complex and a plasma membrane lipid or membrane-associated protein in order to maintain the cytoskeleton
      at a specific cortical membrane location. Three checks argue that this is the wrong activity for
      Arp1. First, the node is narrow and single-sourced: QuickGO shows GO:0106006 IBA reaches only five
      human proteins, and PTN007551901 delivers it to exactly ACTR1A and ACTR1B from one S. pombe donor.
      Second, that donor''s own experiment shows a process requirement, not a bridging activity -- the
      cortical receptor Num1/Mcp5 binds dynein independently of dynactin, and what the dynactin subunits
      were shown to do was regulate microtubule shrinkage and bundling, in fission-yeast meiotic prophase.
      Third, Arp1 does have a documented membrane-skeleton partner, Golgi-associated betaIII spectrin,
      but that recruits dynactin to intracellular membranes, not to a cortical membrane location, so the
      term''s differentia fails. What Arp1 demonstrably contributes is the backbone filament that the
      rest of dynactin is built on, which is the definition of protein complex scaffold activity.'
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0005200
      label: structural constituent of cytoskeleton
    - id: GO:0140378
      label: protein complex scaffold activity
    reason: 'Two candidate structural MFs fit Arp1, and GO:0005200 structural constituent of cytoskeleton
      is listed first on precedent. It is the term conventional beta-actin itself carries; S. cerevisiae
      ARP1 holds it by its own IDA (PMID:9658168); ACTR10/Arp11, the capping subunit of the very same
      filament, already holds it by IBA with the enables qualifier; and it is what this PANTHER family
      previously propagated to the human centractins, as UniProt''s cross-reference block for P42025 still
      shows even though it is absent from current GOA for both paralogs. It is also not a category error
      to call dynactin a cytoskeletal structure: GO''s own ancestor list places GO:0005869 under GO:0015629
      actin cytoskeleton. GO:0140378 protein complex scaffold activity is given as the second option because
      its definition names the role more exactly -- ''a structural molecule activity of a protein-containing
      complex component that serves to hold the complex together'' is verbatim the role UniProt records
      for the fungal Arp1 donors, that Arp1 forms the backbone filament of the dynactin rod and serves
      as the scaffold for the remaining subunits -- but it has no precedent in this family. Either is
      a large improvement on GO:0106006, which requires a bridge to a plasma membrane component holding
      the cytoskeleton at a cortical location, something no Arp1 experiment supports in any organism.
      Two notes for whoever applies this. (i) The qualifier should become ''enables'' rather than ''contributes_to'',
      because a structural constituent role is the subunit''s own activity, and that is the qualifier
      ACTR10 already carries for GO:0005200. (ii) Because the term arrives at both paralogs from the same
      PANTHER node, fixing it at PTN007551901 fixes ACTR1A and ACTR1B in one edit. The parallel, independent
      review of ACTR1A converged on GO:0005200 as the term to restore, which is corroboration rather than
      coordination -- so PAINT should receive one recommendation, not two competing ones. ACTR1B''s spectrin
      binding is itself untested, so ''spectrin binding'' is deliberately NOT proposed here.'
    supported_by:
    - reference_id: PMID:25736293
      supporting_text: "Cortical factor Num1 (also known as Mcp5), which was also required for dynein\
        \ \nanchoring, bound to dynein independently of dynactin."
    - reference_id: PMID:25736293
      supporting_text: "Whereas Num1 suppressed \nthe sliding of dynein foci along the cortex, Arp1, Mug5\
        \ and Jnm1 were involved \nin the regulation of shrinkage and bundling of microtubules."
    - reference_id: PMID:11461920
      supporting_text: "Here, we \ndemonstrate that Arp1 binds directly to the Golgi-associated betaIII\
        \ spectrin \nisoform."
    - reference_id: PMID:11461920
      supporting_text: "We hypothesize that the interaction between betaIII spectrin and Arp1 \nrecruits\
        \ dynein and dynactin to intracellular membranes and provides a direct \nlink between the microtubule\
        \ motor complex and its membrane-bounded cargo."
    - reference_id: PMID:40186871
      supporting_text: Dynactin binds MTs anchored at the GA as well as to βIII spectrin on GA membranes
        through its Arp1 subunit.
    - reference_id: file:human/ACTR1B/ACTR1B-uniprot.txt
      supporting_text: DR   GO; GO:0005200; F:structural constituent of cytoskeleton; IBA:GO_Central.
    additional_reference_ids:
    - PMID:9658168
    - PMID:8991093
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN007551901
        source_label: PANTHER tree node
        source_status: UNRESOLVED
        comment: PANTHER tree node, not a protein. QuickGO shows GO:0106006 IBA reaches only ACTR1A and
          ACTR1B from this node, so it is the centractin node and the whole human annotation rests on
          the single S. pombe donor.
      - source_id: PomBase:SPBC1347.12
        source_label: arp1, S. pombe (O94630, Swiss-Prot)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: 'The sole experimental donor: EXP from PMID:25736293. That paper shows the pombe dynactin
          subunits are required for cortical dynein anchoring during meiotic prophase, while Num1/Mcp5
          binds dynein independently of dynactin and the measured dynactin contribution was microtubule
