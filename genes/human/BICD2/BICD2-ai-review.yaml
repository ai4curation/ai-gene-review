id: Q8TD16
gene_symbol: BICD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BICD2 (protein bicaudal D homolog 2) is a coiled-coil cargo adaptor and activator of cytoplasmic
  dynein-1. Its N-terminal coiled coil binds the dynein light intermediate chain and tail and runs along
  the dynactin Arp1 filament, stabilizing a dynein-dynactin-BICD2 complex that moves processively toward
  microtubule minus ends; its C-terminal coiled coil selects cargo and, in the cargo-free state, folds
  back to autoinhibit motor binding. In interphase BICD2 binds GTP-bound RAB6 on Golgi membranes and Golgi-derived/secretory
  vesicles, stabilizing RAB6 on the Golgi and supporting COPI-independent Golgi-to-ER retrograde transport.
  In G2, CDK1- and PLK1-dependent phosphorylation activates BICD2 and promotes its binding to CDK1-phosphorylated
  RANBP2 at the cytoplasmic face of nuclear pores, where it recruits dynein-dynactin (and regulates kinesin-1)
  to keep centrosomes tethered to the nucleus, drive centrosome separation and power apical interkinetic
  nuclear migration in radial glial progenitors. In postmitotic migrating neurons, BICD2 is recruited
  to the nuclear envelope by the LINC-complex protein nesprin-2 and couples dynein and kinesin-1 to the
  nucleus for nucleokinesis. Heterozygous BICD2 variants that alter dynein or cargo binding cause lower-extremity-predominant
  spinal muscular atrophy (SMALED2) and hereditary spastic paraplegia, and some variants affect cortical
  development.
