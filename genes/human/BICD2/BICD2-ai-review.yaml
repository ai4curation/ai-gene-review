suggested_questions:
- question: Should activating dynein adaptors (BICD2, HOOK3, BICDR1, SPDL1, NINL) be consistently annotated
    to GO:0140660 cytoskeletal motor activator activity in addition to dynein/dynactin binding?
  experts:
  - GO molecular function editors
  - dynein motor biophysicists
- question: Is BICD2 required for nucleokinesis in human cortical neurons, and do cargo-selective SMA/brain-malformation
    variants (e.g. E770G, K785M) separate the RANBP2 and nesprin-2 routes in human cells?
  experts:
  - neuronal migration biologists
  - BICD2 clinical geneticists
suggested_experiments:
- description: Express cargo-selective BICD2 variants (RANBP2-binding-deficient vs nesprin-2-binding-deficient)
    in human iPSC-derived cortical organoids and image progenitor INM and neuronal nucleokinesis to test
    route specificity in human tissue.
  experiment_type: variant rescue with live imaging in organoids
