- term:
    id: GO:0007097
    label: nuclear migration
  evidence_type: IMP
  original_reference_id: PMID:32619477
  qualifier: involved_in
  review:
    summary: BICD2 couples dynein-dynactin and kinesin-1 to the nucleus (via nesprin-2 in neurons, RanBP2
      in G2 progenitors) and is required for nuclear movement.
    action: NEW
    reason: 'BICD2 does work in nuclear migration: it is the adaptor that physically links the nuclear-envelope
      cargo (nesprin-2 or RanBP2) to dynein-dynactin and kinesin-1 and activates dynein. Disrupting the
      nesprin-2/BicD2 interaction blocks nuclear movement in migrating rat cortical neurons, BicD2 RNAi
      arrests apical interkinetic nuclear migration in radial glial progenitors, and BICD2 depletion disrupts
      dynein- and kinesin-dependent nuclear movements in human G2 cells. Comparator check: other components
      in the same adaptor/motor role (HOOK3 for interkinetic nuclear migration; DYNC1H1, PAFAH1B1, SYNE2
      for nuclear migration) carry this branch in human GOA, so the absence for BICD2 is a gap rather
      than a convention. The rat evidence is from the orthologue.'
    supported_by:
    - &id019
      reference_id: PMID:32619477
      supporting_text: Although disruption of the Nesprin-2/BicD2 interaction severely inhibited nuclear
        movement, centrosome advance proceeded unimpeded
    - *id014
    - &id020
      reference_id: PMID:24034252
      supporting_text: BicD2 RNAi caused specific inhibition of apical, but not basal nuclear migration
        with nuclei arrested at least 30 μm from the ventricular surface throughout the recording period
    - reference_id: PMID:24034252
      supporting_text: two distinct G2-specific mechanisms for dynein nuclear pore recruitment are essential
        for apical nuclear migration
    - *id015
