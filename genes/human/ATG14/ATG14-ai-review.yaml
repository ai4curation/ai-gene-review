    id: GO:0035014
    label: phosphatidylinositol 3-kinase regulator activity
  in_complex: *id034
  description: ATG14 is the autophagy-specific PI3KC3-C1 regulatory subunit that recruits 
    and organizes the PIK3C3/VPS34 lipid-kinase complex at ER-associated 
    omegasome/phagophore membranes, enabling local PI3P production for autophagosome 
    assembly and macroautophagy initiation.
