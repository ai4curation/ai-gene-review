- term:
    id: GO:0000423
    label: mitophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: ATG14 contributes directly to the autophagic machinery used in 
      Parkin-mediated mitophagy.
    action: KEEP_AS_NON_CORE
    reason: 'The full PMID:23878393 tests human HCT116 ATG14 knockout cells expressing Parkin:
      mitochondrial clearance after 24 h valinomycin is impaired while early Parkin recruitment
      is preserved (Fig. 1G/H). ATG14 organizes the PI3KC3-C1 membrane-building machinery that
      executes mitochondrial sequestration; it need not itself be a cargo receptor. This conditional
      mitophagy role is retained alongside its broader core autophagy function.'
    additional_reference_ids:
    - GO_REF:0000033
    - PMID:18843052
    - PMID:19270696
    - PMID:20713597
    - PMID:40442316
    supported_by:
