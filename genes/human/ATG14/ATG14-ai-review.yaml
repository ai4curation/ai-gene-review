  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: The class III PI3K complex assignment is correct but should be narrowed to 
      the ATG14-containing PI3KC3-C1/type I autophagy complex. Cryo-EM of human PI3KC3-C1 
      (PDB 9MHF/9MHG/9MHH) resolves ATG14 as one of the four heterotetramer subunits 
      alongside VPS34, VPS15, and BECN1.
    action: MODIFY
    reason: ATG14 defines the autophagy-associated class III PI3K complex I. The parent 
      complex annotation is biologically correct; refinement to the established C1 term 
      records the demonstrated complex composition.
