id: Q6ZNE5
gene_symbol: ATG14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ATG14/Barkor is a regulatory and membrane-targeting subunit of human class III PI3K complex
  I (PI3KC3-C1). It recruits and organizes the VPS34–VPS15–BECN1 complex at ER-associated omegasome
  and phagophore membranes, supporting local PI3P production and autophagosome assembly. ATG14
  controls BECN1 complex stability and phosphorylation, and its autophagic machinery participates
  in Parkin-mediated mitophagy. It also binds the STX17–SNAP29 fusion machinery to promote autophagosome–endolysosome
  fusion and interacts with Snapin to support late endosomal trafficking.
