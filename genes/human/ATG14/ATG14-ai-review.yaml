      source_entities:
      - source_id: PANTHER:PTN001784663
        source_label: PTN001784663
        source_status: SUPPORTS_TRANSFER
        comment: The ATG14-node mitophagy assertion includes experimental evidence on 
          human Q6ZNE5 itself (PMID:23878393). The direct target evidence supports 
          participation; it is not a circular or unsupported family-only transfer.
