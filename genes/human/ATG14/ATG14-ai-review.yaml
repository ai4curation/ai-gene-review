    supporting_text: Required for both basal and inducible autophagy; determines the 
      localization of PI3KC3-C1
- molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  description: ATG14 uses membrane-targeting/curvature-sensing and oligomerization regions
    to bridge autophagy machinery to membranes. This includes BATS-domain targeting of 
    PI3P-rich autophagic membranes and STX17-SNAP29 binding on mature autophagosomes to 
    promote VAMP8-dependent autophagosome-endolysosome fusion. Through its separately 
    demonstrated interaction with Snapin, ATG14 also facilitates late endosome maturation 
    and lysosomal receptor degradation.
  directly_involved_in:
  - id: GO:0016240
    label: autophagosome membrane docking
  - id: GO:0097352
    label: autophagosome maturation
  - id: GO:0008333
    label: endosome to lysosome transport
  locations:
  - id: GO:0005776
    label: autophagosome
  - *id037
  - id: GO:0061908
    label: phagophore
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:21518905
    supporting_text: the BATS domain directly binds to the membrane
  - reference_id: PMID:25686604
    supporting_text: ATG14 promotes membrane tethering and fusion of autophagosomes to 
      endolysosomes
  - reference_id: PMID:25686604
    supporting_text: ATG14 binds to the SNARE core domain of STX17 through its coiled-coil
      domain
  - reference_id: PMID:25686604
    supporting_text: autophagosomes still efficiently form but their fusion with 
      endolysosomes is blocked
  - reference_id: PMID:22797916
    supporting_text: Atg14L binds to and colocalizes with the fusogenic SNARE effector 
      protein Snapin to facilitate endosome maturation
  - reference_id: file:human/ATG14/ATG14-uniprot.txt
    supporting_text: Binds to STX17-SNAP29 binary t-SNARE complex on autophagosomes and 
      primes it for VAMP8 interaction
proposed_new_terms: []
suggested_questions:
- question: Which membrane or receptor context accounts for the mouse ATG14 
    phagocytic-vesicle annotation, and is the same localization conserved in human cells?
- question: Does ATG14 regulate an RNA or translation step underlying the 
    post-transcriptional gene-expression annotation, or is the measured abundance change 
    entirely due to autophagic turnover and complex stabilization?
- question: How do phosphorylation of ATG14 and its BATS-domain membrane interactions 
    coordinate initiation, selective cargo sequestration and later fusion?
suggested_experiments:
- description: Use ATG14 knockout cells rescued with coiled-coil, BATS-domain, 
    ER-targeting, and cysteine-oligomerization mutants to measure DFCP1/WIPI recruitment, 
    PI3P production, LC3 lipidation, and autophagic flux.
  experiment_type: PI3KC3-C1 autophagy-initiation rescue assay
  hypothesis: ATG14 promotes autophagosome assembly by coupling PI3KC3-C1 to ER/phagophore
    membranes and enabling local PI3P production.
- description: Separate ATG14 initiation and fusion activities using 
    STX17-binding-defective and oligomerization-defective ATG14 mutants, then quantify 
    autophagosome number, autolysosome formation, and cargo degradation.
  experiment_type: autophagosome maturation separation-of-function assay
  hypothesis: ATG14 has separable early PI3KC3-C1 recruitment and late STX17-SNAP29/VAMP8 
    fusion functions.
- description: Compare wild-type ATG14 and Snapin-binding-deficient mutants in 
    synchronized endocytic receptor-degradation assays while monitoring autophagic flux in
    parallel.
  experiment_type: endocytic trafficking/autophagy separation assay
  hypothesis: ATG14-dependent endosome maturation is a supported secondary trafficking 
    function that can be separated from its core PI3KC3-C1 autophagy role.
- description: Express a non-phosphorylatable ATG14 Ser29Ala mutant (versus wild-type and 
    phosphomimetic) in ATG14-knockout cells and quantify starvation-induced VPS34 
    lipid-kinase activity, PI3P production, DFCP1/WIPI2 puncta, and LC3 lipidation.
  experiment_type: ULK1-ATG14 phosphosite separation-of-function assay
