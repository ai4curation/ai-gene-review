suggested_questions:
- question: Which endogenous protein obstacles are directly cleaved by FAM111A, and which TOP1cc-repair
    or PARP-trap phenotypes depend on cooperation with other degradation systems?
- question: How do DNA engagement, PCNA binding and cellular context regulate FAM111A autocleavage and
    protease activity without causing inappropriate nuclear damage?
- question: Which cytoplasmic factors connect FAM111A to I3 degradation during infection, and how does
    that route differ from its nuclear replication-associated role?
suggested_experiments:
- description: Reconstitute cleavage with purified full-length human FAM111A and defined covalent TOP1–DNA
    substrates, alongside noncovalent protein–DNA obstacles and FAM111A autocleavage controls. Compare
    WT with catalytic and DNA-binding mutants, with and without PCNA-loaded DNA and candidate degradation
    partners; measure peptide products and release of the DNA-linked adduct separately.
  hypothesis: If FAM111A directly attacks a lesion-bound protein, catalytic activity should generate mapped
    cleavage products in the defined system; a requirement for added partners would distinguish cooperative
    processing from autonomous turnover.
- description: Compare endogenous-level WT, catalytic, PIP-box and F231 mutant replacement in matched
    human cell backgrounds under untreated, TOP1-trapping and PARP-trapping conditions. Measure fork progression,
    chromatin PCNA, FAM111A cleavage products and nuclear integrity while controlling protein abundance
    and cell-cycle state.
  hypothesis: Cell context and protein-obstacle load determine when DNA and PCNA engagement are required,
    separating the 2014 basal replication phenotype from the 2020 obstacle-dependent phenotype and distinguishing
    controlled activity from toxicity.
- description: In infected human cells, compare endogenous-level WT FAM111A with protease-inactive and
    nuclear-export-targeted constructs, then perturb candidate autophagy and proteasome components while
    measuring FAM111A localization, I3 turnover and viral DNA accumulation separately.
  hypothesis: Cytoplasmic delivery and engagement of cellular degradation machinery can be separable from
    FAM111A peptide-bond cleavage, so I3 loss need not identify I3 as a direct protease substrate.
