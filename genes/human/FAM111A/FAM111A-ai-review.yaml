    with PCNA and DNA engagement to support replication through protein obstacles and repair of TOP1–DNA
    covalent complexes. Controlled purified autocleavage establishes protease activity; the cellular repair
    evidence does not identify TOP1 or PARP1 as directly reconstituted cleavage substrates.
