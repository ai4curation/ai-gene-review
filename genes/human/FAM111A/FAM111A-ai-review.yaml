gene_symbol: FAM111A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FAM111A is a nuclear serine endopeptidase that binds single-stranded DNA and associates with
  replication-associated chromatin through a PCNA-interacting motif. Its protease, DNA-binding and PCNA-interaction
  regions help replication forks traverse protein obstacles and support removal of covalent TOP1–DNA complexes.
  FAM111A can cleave itself, including between separate protein molecules. It also restricts selected
  DNA viruses through context-dependent interactions and redistribution to the cytoplasm; during vaccinia-virus
  infection, cytoplasmic FAM111A promotes loss of viral I3 through cellular degradation machinery. Disease-associated
  substitutions can increase proteolysis and disrupt nuclear functions in experimental systems.
