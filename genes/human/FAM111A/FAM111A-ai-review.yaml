  review:
    summary: Controlled cellular cleavage experiments support FAM111A proteolysis.
    action: ACCEPT
    reason: 'PMID:32165630 Figure 3 shows FAM111A cleavage in human 293T cells, loss of cleavage with
      S541A, increased cleavage with tested disease mutants, and intermolecular cleavage of inactive tagged
      FAM111A by an active counterpart. Edman sequencing of an R569H-derived fragment produced in Sf21
      maps an internal cut after Phe334; cleavage-site substitutions reduce processing. Thus FAM111A does
      the cleaving rather than merely serving as a substrate. Keep this performed chemistry broad enough
      to encompass its proteolytic role, while explicitly retaining the paper’s limit: purified recombinant
      FAM111A did not yield measurable in-vitro protease activity, and direct purified TOP1/PARP1 cleavage
      was not demonstrated. Independent PMID:32776417 Figure 1G and Figure EV1C/D/F reports positive autocleavage
      of yeast-purified full-length human FLAG-FAM111A, with catalytic D439N and AEBSF controls. This
      separate positive preparation supports intrinsic activity without changing the earlier paper’s result
      or establishing purified TOP1/PARP1 cleavage.'
    supported_by:
    - reference_id: PMID:32165630
    - reference_id: PMID:32776417
