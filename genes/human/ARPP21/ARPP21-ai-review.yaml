  review:
    summary: Positive regulation of dendrite morphogenesis (NEW, ISO from mouse Arpp21). In mouse cortical
      neurons, ARPP21 knockdown reduces dendritic complexity and ectopic ARPP21 increases it. ARPP21 promotes
      translation of shared targets of its host miRNA miR-128, through eIF4F. ARPP21 itself binds the
      target mRNAs, so it performs the regulatory step.
    action: NEW
    reason: '[PMID:29581509 "This molecular antagonism is reflected in inverse activities during dendritogenesis:
