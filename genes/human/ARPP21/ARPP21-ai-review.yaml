gene_symbol: ARPP21
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARPP21 (ARPP-21, TARPP) is a cytoplasmic R3H-domain RNA-binding protein, first identified
  as a cAMP-regulated phosphoprotein that PKA phosphorylates and that is enriched in dopamine-innervated
  striatal neurons. It binds uridine-rich sequences in 3' UTRs and acts as a positive post-transcriptional
  regulator, interacting with the translation initiation complex eIF4F. In neurons it opposes the miRNA
  it hosts, miR-128, by co-regulating shared target mRNAs, and promotes dendritic branching. In thymocytes
  it promotes the expression of target mRNAs that support TCR repertoire diversity. A short isoform has
  been proposed to inhibit calmodulin-dependent enzymes.
