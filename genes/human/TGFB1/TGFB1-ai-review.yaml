    supported_by:
    - reference_id: PMID:18548003
      supporting_text: >-
        TGF-β and BMP signalling promotes a rapid increase in expression of mature miR-21 through a post-transcriptional step, promoting the processing of primary transcripts of miR-21 (pri-miR-21) into precursor miR-21 (pre-miR-21) by the DROSHA (also known as RNASEN) complex
