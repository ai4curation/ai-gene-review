- term:
    id: GO:0001837
    label: epithelial to mesenchymal transition
  evidence_type: IDA
  original_reference_id: PMID:28373289
  qualifier: acts_upstream_of
  review:
    action: KEEP_AS_NON_CORE
    summary: epithelial to mesenchymal transition.
    reason: >-
      GO:0001837 epithelial to mesenchymal transition. In pancreatic cancer cells TGF-beta-1 is the secreted ligand whose binding to TGFBR2/TGFBR1 initiates SMAD2/3 signaling that drives the EMT program; this paper uses exogenous TGF-beta-1 as the canonical EMT inducer and shows miR-202-mediated knockdown of the receptors blocks that response. EMT itself is a downstream transcriptional/morphological program executed by Snail/ZEB/Twist transcription factors acting downstream of receptor engagement, not a molecular activity TGF-beta-1 performs; the gene product's role is restricted to the upstream ligand/receptor-binding step. Non-core because EMT is a context-specific (tumor) consequence of the core receptor-binding + SMAD signaling function rather than that function itself.
    supported_by:
    - reference_id: PMID:28373289
      supporting_text: >-
        Transforming Growth Factor-beta 1 (TGF-β1) is a multifunctional cytokine secreted into the tumor microenvironment which primarily promotes the EMT process
- term:
    id: GO:0001837
    label: epithelial to mesenchymal transition
  evidence_type: IDA
  original_reference_id: PMID:29529050
  qualifier: acts_upstream_of_or_within
  review:
    action: KEEP_AS_NON_CORE
    summary: epithelial to mesenchymal transition.
    reason: >-
      GO:0001837 epithelial to mesenchymal transition. In this study TGF-β1 (5 ng/mL) was applied to A549 alveolar epithelial cells as the positive control for EMT, where it strongly downregulated E-cadherin and raised α-SMA, i.e. drove the epithelial-to-mesenchymal phenotypic switch (the paper's own focus is TMPRSS4, which partially opposes this). EMT is a multi-gene transcriptional and phenotypic program executed downstream of TGFB1 receptor binding and SMAD signaling in the target epithelial cell, not a molecular activity the secreted ligand itself performs, so it is a non-core consequence of TGFB1's core receptor-binding/SMAD-initiating role.
    supported_by:
    - reference_id: PMID:29529050
      supporting_text: >-
        Since the activation of TGF-β signaling causes epithelial to mesenchymal transition (EMT), a process that include the downregulation of the expression of E-cadherin
