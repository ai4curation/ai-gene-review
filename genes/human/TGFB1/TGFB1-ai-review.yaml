- term:
    id: GO:0001837
    label: epithelial to mesenchymal transition
  evidence_type: IDA
  original_reference_id: PMID:25893292
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: epithelial to mesenchymal transition.
    reason: >-
      GO:0001837 epithelial to mesenchymal transition is supported by TGF-beta-1-mediated Smad activation driving EMT in A549 cells (E-cadherin repression, vimentin/Snail/Slug induction), modulated by syntenin's control of TbetaRI internalization. EMT is the canonical downstream SMAD-dependent program of the pathway, a consequence of the core receptor-binding function, so it is non-core.
