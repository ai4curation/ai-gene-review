- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:18040277
  qualifier: located_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: nucleus.
    reason: >-
      TGF-beta-1 is a secreted cytokine routed through the ER-Golgi secretory pathway, so a standalone nucleus term is an over-annotation of its functional site. The cited reference (full text unavailable in our cache) is an immunohistochemical study of injured human spinal cord reporting cell-type-level expression (TGF-beta-1 detected within neurons, astrocytes and invading macrophages); such cell-type IHC does not resolve a subcellular nuclear compartment, so it does not ground a nucleus annotation.
    supported_by:
    - reference_id: PMID:18040277
      supporting_text: detected within neurons, astrocytes and invading macrophages
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:18040277
  qualifier: located_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: cytoplasm.
    reason: >-
      For a secreted cytokine whose biosynthetic route is the ER-Golgi secretory pathway, a generic cytoplasm term is an over-annotation better captured by Golgi and extracellular terms. The cited reference (full text unavailable in our cache) is a cell-type-level immunohistochemical study of injured spinal cord (TGF-beta-1 detected within neurons, astrocytes and invading macrophages); such cell-type IHC does not resolve a free cytosolic pool at subcellular resolution.
    supported_by:
    - reference_id: PMID:18040277
      supporting_text: detected within neurons, astrocytes and invading macrophages
