id: P01137
gene_symbol: TGFB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TGFB1 encodes transforming growth factor beta-1, a secreted multifunctional cytokine of the
  TGF-beta superfamily. It is made as a proprotein cleaved in the Golgi into the latency-associated peptide
  (LAP) and the mature TGF-beta-1 chain, which stay associated as a latent complex stored in the extracellular
  matrix and tethered at the cell surface by LTBP, GARP (LRRC32) and NRROS (LRRC33); integrin-mediated
  force releases the active cytokine. Active TGF-beta-1 binds type I, II and III TGF-beta receptors to
  activate receptor serine/threonine kinase and SMAD signaling, controlling cell growth and differentiation,
  extracellular-matrix production and fibrosis, immune tolerance (regulatory T cells, IgA class switching),
  epithelial-to-mesenchymal transition, wound healing and many developmental processes.
