- term:
    id: GO:0002859
    label: negative regulation of natural killer cell mediated cytotoxicity directed against tumor cell
      target
  evidence_type: IDA
  original_reference_id: PMID:24586048
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: negative regulation of natural killer cell mediated cytotoxicity directed against tumor cell
      target.
    reason: >-
      GO:0002859 negative regulation of natural killer cell mediated cytotoxicity directed against tumor cell target. This is the central finding of the paper: TGF-β1-treated human NK cells show reduced tumor cytolysis and abrogated perforin polarization, because TGF-β1 induces miR-183 that represses the NK signaling adaptor DAP12. The suppression of NK anti-tumor killing is an indirect, cell-context-specific downstream consequence of TGFB1 receptor binding and SMAD signaling (operating through an induced microRNA), not a core molecular activity the ligand itself carries out, hence non-core.
    supported_by:
    - reference_id: PMID:24586048
      supporting_text: >-
        TGF-β–treated human NK cells exhibit reduced tumor cytolysis and abrogated perforin polarization to the immune synapse
