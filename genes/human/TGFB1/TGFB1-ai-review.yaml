    label: negative regulation of cell-cell adhesion mediated by cadherin
  evidence_type: IDA
  original_reference_id: PMID:18593713
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: negative regulation of cell-cell adhesion mediated by cadherin.
    reason: >-
      GO:2000048 negative regulation of cell-cell adhesion mediated by cadherin captures the loosening of adherens junctions during TGF-beta1 signaling. This study is actually about Smad7 (an inhibitory SMAD that antagonizes TGF-beta signaling) promoting cell-cell adhesion by stabilizing the beta-catenin/E-cadherin complex, so the negative-regulation annotation on TGFB1 is the inferred inverse: active TGF-beta/SMAD signaling reduces cadherin-mediated adhesion. The abstract describes Smad7's pro-adhesive effect, not a direct statement that TGF-beta1 negatively regulates cadherin adhesion, so that attribution rests on the uncached full text. The term is a downstream, indirect consequence of signaling (EMT-associated junction disassembly), peripheral to the core cytokine-receptor activity, and is retained as non-core.
