- term:
    id: GO:0006611
    label: protein export from nucleus
  evidence_type: IDA
  original_reference_id: PMID:17438144
  qualifier: involved_in
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: protein export from nucleus.
    reason: >-
      GO:0006611 protein export from nucleus. This Smad7-focused study reports that in COS1/COS7 cells TGF-beta-1 treatment triggers relocation of the inhibitory Smad7 from the nucleus to the cytoplasm. TGF-beta-1 does not itself execute nuclear export; it is the extracellular ligand whose receptor binding and SMAD signaling indirectly cause Smad7 nucleocytoplasmic redistribution, and the paper notes this behaviour is cell-type dependent (it does not occur in Hep3B/HeLa cells). Over-annotation because the nuclear-export phenotype is a far-downstream, cell-type-restricted consequence of TGF-beta-1 signaling that the ligand does not itself perform, not a molecular activity of the cytokine or a canonical signaling step it carries out.
    supported_by:
    - reference_id: PMID:17438144
      supporting_text: >-
        TGF-β treatment led to translocation of Smad7 to the cytoplasm in COS1 cells
