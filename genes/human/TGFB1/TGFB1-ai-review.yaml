core_functions:
- description: Secreted cytokine/growth factor that binds TGF-beta receptors to activate receptor Ser/Thr
    kinase and SMAD signaling.
  molecular_function:
    id: GO:0005160
    label: transforming growth factor beta receptor binding
  locations:
  - id: GO:0005576
    label: extracellular region
  directly_involved_in:
  - id: GO:0007179
    label: transforming growth factor beta receptor signaling pathway
  - id: GO:0060391
    label: positive regulation of SMAD protein signal transduction
  supported_by:
  - reference_id: file:human/TGFB1/TGFB1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Multifunctional protein that regulates the growth and differentiation of various
      cell types
- description: Acts as a cytokine regulating growth and differentiation of many cell types; its latent
    complex is stored in the extracellular matrix and activated by integrins.
  molecular_function:
    id: GO:0005125
    label: cytokine activity
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: file:human/TGFB1/TGFB1-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: results in distortion of the Latency-associated peptide chain and subsequent release
      of the active TGF-beta-1
suggested_questions:
- question: Which of the many TGF-beta-1-regulated processes reflect direct autocrine/paracrine signaling
    versus systemic or indirect effects, and how is context-specific SMAD output determined?
suggested_experiments:
- description: Cell-type-resolved profiling of SMAD target genes after acute, latency-bypassing TGF-beta-1
    stimulation to separate direct transcriptional responses from secondary effects.
