  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027239
  review:
    summary: JAK2 binds the cytoplasmic box1/box2 region of cytokine and hormone receptors.
    action: MODIFY
    reason: Correct but general. The receptors JAK2 binds are cytokine-family receptors (including GHR,
      EPOR, MPL, beta c, gp130, IL-23R); cytokine receptor binding is the appropriately specific term.
    proposed_replacement_terms: &id042
    - id: GO:0005126
      label: cytokine receptor binding
    supported_by: &id043
    - &id010
      reference_id: PMID:8007942
      supporting_text: JAK2 physically associates with the beta c chain but not with the alpha chain.
    - *id007
    - &id008
      reference_id: PMID:15899890
      supporting_text: Sequences encompassing Box1 and Box2 regions of the receptor cytosolic domain and
        an intact JAK2 or Tyk2 FERM domain are required for these effects.
- term:
    id: GO:0005102
    label: signaling receptor binding
  evidence_type: IPI
  original_reference_id: PMID:11201744
  qualifier: enables
  supporting_entities:
  - UniProtKB:P06800
  review:
    summary: Interaction with the transmembrane phosphatase CD45 (PTPRC), which dephosphorylates JAKs.
    action: MODIFY
    reason: The study shows the transmembrane phosphatase CD45 binding and dephosphorylating JAKs. JAK2
      is the substrate rather than a ligand of a signaling receptor, so the binding is better described
      as phosphatase binding.
    supported_by:
    - reference_id: PMID:11201744
      supporting_text: Here we show that CD45 suppresses JAK (Janus kinase) kinases and negatively regulates
        cytokine receptor signalling.
    proposed_replacement_terms:
    - id: GO:0019902
      label: phosphatase binding
