id: O60674
gene_symbol: JAK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: JAK2 is a Janus-family non-receptor tyrosine kinase composed of an N-terminal FERM and SH2-like
  region that binds the membrane-proximal box1/box2 motifs of cytokine receptors, a regulatory pseudokinase
  (JH2) domain, and a C-terminal tyrosine kinase (JH1) domain. It associates constitutively with the cytoplasmic
  tails of many class I and II cytokine receptors, including those for erythropoietin, thrombopoietin,
  growth hormone, prolactin, leptin, GM-CSF/IL-3/IL-5 (beta c), gp130-family cytokines, IL-12/IL-23 and
  interferon gamma. Ligand-induced receptor rearrangement brings JAK2 molecules together, allowing trans-autophosphorylation
  of the activation loop (Tyr1007), after which JAK2 phosphorylates receptor tyrosines that recruit STAT
  proteins and then phosphorylates the STATs, which dimerize and enter the nucleus to regulate transcription.
  JAK2 is a cytoplasmic protein acting at the inner face of the plasma membrane; a nuclear pool has been
  reported to phosphorylate histone H3 Tyr41. JAK2 is essential for definitive erythropoiesis, and gain-of-function
  mutations such as V617F in the pseudokinase domain drive myeloproliferative neoplasms.
