- id: file:human/JAK2/JAK2-uniprot.txt
  title: UniProt record O60674 (JAK2)
core_functions:
- description: Receptor-associated non-receptor tyrosine kinase that binds the box1/box2 region of cytokine
    receptors at the cytoplasmic face of the plasma membrane and, on ligand-induced receptor rearrangement,
    trans-autophosphorylates and phosphorylates receptor tails and STAT proteins to transduce cytokine
    and hormone signals (EPO, TPO, GH, prolactin, leptin, beta c cytokines, gp130 family, IL-12/IL-23,
    IFN-gamma).
  molecular_function:
    id: GO:0004715
    label: non-membrane spanning protein tyrosine kinase activity
  locations:
  - id: GO:0031234
    label: extrinsic component of cytoplasmic side of plasma membrane
  - id: GO:0005829
    label: cytosol
  directly_involved_in:
  - id: GO:0007259
    label: cell surface receptor signaling pathway via JAK-STAT
  - id: GO:0038162
    label: erythropoietin-mediated signaling pathway
  - id: GO:0060397
    label: growth hormone receptor signaling pathway via JAK-STAT
  supported_by:
  - *id005
  - *id020
  - *id010
- description: Binds the cytoplasmic membrane-proximal region of cytokine receptor chains via its FERM
    domain, stabilizing receptors and promoting their surface expression.
  molecular_function:
    id: GO:0005126
    label: cytokine receptor binding
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  supported_by:
  - *id008
  - *id007
suggested_questions:
- question: How physiologically significant is nuclear JAK2 and H3Y41 phosphorylation relative to the
    cytoplasmic receptor-bound pool?
- question: How does the JH2 pseudokinase's weak catalytic activity integrate with its autoinhibitory
    scaffolding role, and how does V617F disrupt both?
suggested_experiments:
- description: Quantify the nuclear versus receptor-bound JAK2 pools in primary human erythroid progenitors
    using endogenously tagged JAK2 and test H3Y41ph in JAK2-null versus rescued cells.
  experiment_type: imaging and genetic rescue
