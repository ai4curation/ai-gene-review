id: P56747
gene_symbol: CLDN6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CLDN6 (claudin-6) is a tetraspan tight-junction protein: four transmembrane helices, two
  extracellular loops and cytoplasmic termini ending in a PDZ-binding motif that engages the ZO scaffolds
  ZO-1, ZO-2 and ZO-3. Like other claudins it polymerizes into tight-junction strands and interacts in
  trans with claudins on the neighbouring cell, obliterating the intercellular space and establishing
  paracellular barrier properties. CLDN6 is an oncofetal protein: it is widely expressed in embryonic
  and fetal epithelia, essentially silent in normal adult tissue, and re-expressed in germ cell tumours,
  ovarian, endometrial, testicular and some lung and gastric cancers, which has made its exposed extracellular
  loops a target for antibodies and CAR-T cells. Its first extracellular loop also makes it one of the
  receptor-active claudins that associate with the tetraspanin CD81 and support hepatitis C virus entry.'
