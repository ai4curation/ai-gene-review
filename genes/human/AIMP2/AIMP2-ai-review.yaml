- term:
    id: GO:0006412
    label: translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: AIMP2 contributes structure to the aminoacylation machinery used in protein translation.
    action: ACCEPT
    reason: 'The translation keyword mapping is consistent with structural participation: AIMP2 connects
      synthetase subassemblies and retains KARS1 in the MSC. GO:0006418 tRNA aminoacylation for protein
      translation is part_of GO:0006412 in the live ontology. A structural participant can therefore carry
      the broader process without itself catalyzing tRNA charging. Human complex dissection (PMID:19131329)
      and the KARS1 anchoring structure (PMID:23159739) support this role; neither asserts that AIMP2
      is a ribosomal catalyst or universally required for growth in every culture condition.'
    supported_by:
    - reference_id: PMID:19131329
      supporting_text: with p38 connecting two subcomplexes that may form in the absence of p38
    - reference_id: PMID:23159739
      supporting_text: The crystal structure of an MSC subcomplex established that LysRS is held in the
        MSC by binding to the N terminus of the scaffold protein p38/AIMP2
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB-KW:KW-0648
        source_status: SUPPORTS_TRANSFER
        comment: The translation keyword is consistent with structural participation in tRNA aminoacylation,
          a part_of descendant of translation.
- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: AIMP2 promotes apoptosis through defined signaling mechanisms.
    action: MODIFY
    reason: The keyword-derived process is better represented by positive regulation of apoptotic process.
      Direct AIMP2–p53 binding prevents MDM2-mediated p53 degradation, and AIMP2 loss/rescue changes damage-induced
      apoptosis (PMID:18695251). A distinct TNF pathway study reports facilitation of TRAF2 association
      with c-IAP1 (PMID:19584093). These mechanisms support positive regulation without assigning AIMP2
      caspase or ubiquitin-ligase catalysis. This is a contextual signaling function.
    proposed_replacement_terms:
    - id: GO:0043065
      label: positive regulation of apoptotic process
    supported_by:
    - reference_id: PMID:18695251
      supporting_text: AIMP2 directly interacts with p53, thereby preventing MDM2-mediated ubiquitination
        and degradation of p53
    - reference_id: PMID:18695251
      supporting_text: Depletion of AIMP2 increased resistance to DNA damage-induced apoptosis, and introduction
        of AIMP2 into AIMP2-deficient cells restored the susceptibility to apoptosis
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: UniProtKB-KW:KW-0053
        source_status: SUPPORTS_TRANSFER
        comment: The apoptosis keyword captures a real positive signaling role; the human p53 and TRAF2
          mechanisms justify the proposed regulatory refinement.
