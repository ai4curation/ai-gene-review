core_functions:
- description: AIMP2 holds synthetase subassemblies together as an integral scaffold of the cytosolic
    MSC. Its N-terminal KARS1 anchor and contacts with other MSC components contribute structural work
    to complex assembly and the aminoacylation machinery. The synthetases perform amino acid activation
    and tRNA esterification; AIMP2 supplies organization and stabilization. Native assembly stoichiometry
    and the effects of particular truncated constructs are not assumed to be interchangeable.
  molecular_function: *id001
  directly_involved_in:
  - id: GO:0065003
    label: protein-containing complex assembly
  - id: GO:0006418
    label: tRNA aminoacylation for protein translation
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0017101
    label: aminoacyl-tRNA synthetase multienzyme complex
  supported_by:
  - reference_id: PMID:19131329
    supporting_text: with p38 connecting two subcomplexes that may form in the absence of p38
  - reference_id: PMID:23159739
    supporting_text: The crystal structure of an MSC subcomplex established that LysRS is held in the
      MSC by binding to the N terminus of the scaffold protein p38/AIMP2
  - reference_id: PMID:21536907
    supporting_text: Each of the N-terminal 48 residues of p38 binds one LysRS dimer
  - reference_id: PMID:39542129
    supporting_text: Here, we determined a crystal structure of the LZ complex of AIMP1 and AIMP2
      and revealed the interaction mode of a heterotrimeric complex of RARS1, AIMP1,
      and AIMP2.
    reference_section_type: ABSTRACT
  - reference_id: PMID:35133502
    supporting_text: The interaction with AIMP2 stabilizes the closed conformation of LysRS,
      thereby protects the essential aminoacylation activity under stressed conditions.
    reference_section_type: ABSTRACT
