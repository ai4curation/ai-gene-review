- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: AIMP2 can move from the cytoplasmic complex to the nucleus during stress responses.
    action: KEEP_AS_NON_CORE
    reason: The combined automatic source includes mouse Q8R010/ENSMUSP00000031613 and the UniProt nuclear-location
      vocabulary. Independent human-cell studies support nuclear AIMP2 in genotoxic and oxidative stress
