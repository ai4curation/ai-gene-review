  title: Assembly of the Human Multi-tRNA Synthetase Complex Through Leucine Zipper Motifs.
  full_text_unavailable: true
  findings:
  - statement: AIMP2 participates in a structurally characterized leucine-zipper assembly with AIMP1 and RARS1.
    supporting_text: Here, we determined a crystal structure of the LZ complex of AIMP1 and AIMP2
      and revealed the interaction mode of a heterotrimeric complex of RARS1, AIMP1,
      and AIMP2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source4 recovered the exact normal-fetched PubMed abstract on 2026-09-27;
      title and DOI 10.1016/j.jmb.2024.168865 match the earlier primary PubMed/ScienceDirect reading.
      AIMP1/AIMP2 leucine-zipper structure and the RARS1-containing coiled-coil model clarify
      assembly-state contacts. The local cache remains abstract-only. Abstract/highlights do not
      establish every native stoichiometric state, and the complete article was not recovered.
- id: PMID:35546148
  title: AIMP2-DX2 provides therapeutic interface to control KRAS-driven tumorigenesis.
  full_text_unavailable: false
  findings:
  - statement: In the tested CCD18CO expression comparison, DX2 increases KRAS protein abundance while full-length AIMP2 does not.
    supporting_text: The cells expressing DX2, but not AIMP2, increased the levels of both the wild-type (WT) and mutant forms of the KRAS, but not the N and H isoforms
  - statement: The cellular stabilization difference does not establish that full-length AIMP2 cannot bind KRAS in vitro.
    supporting_text: AIMP2 showed similar binding ability to KRAS4B as DX2 in in vitro binding assays because it also contains the GST domain
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Source4 recovered normal-fetched full PMC9095880 XML text on 2026-09-27;
      exact title and DOI 10.1038/s41467-022-30149-2 match the previously read primary source.
      Recovered Results/Figures 1–2 distinguish the DX2-dependent cellular KRAS increase from
      full-length AIMP2 in CCD18CO cells. The same source reports similar purified-protein KRAS4B
      binding by AIMP2 and DX2 and different MSC-associated versus free pools by gel filtration.
      The isoform boundary therefore concerns cellular stabilization in these comparisons, not
      intrinsic inability of full-length AIMP2 to bind KRAS. These findings inform isoform scope
      without adding a canonical AIMP2 function or changing seeded decisions.
- id: PMID:34523057
  title: Knockdown of Golgi Stress-Responsive Caspase-2 Ameliorates HLD17-Associated AIMP2 Mutant-Mediated
    Inhibition of Oligodendroglial Cell Morphological Differentiation.
  full_text_unavailable: true
  findings:
  - statement: The expressed Tyr35Ter mutant aggregates in Golgi bodies in a mouse oligodendroglial cell model.
    supporting_text: the
      HLD17-associated nonsense mutation (Tyr35-to-Ter [Y35X]) of AIMP2 localizes
      AIMP2 proteins as aggregates into the Golgi bodies in mouse oligodendroglial
      FBD-102b cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Source4 recovered the normal-fetched PubMed abstract on 2026-09-27;
      title and DOI 10.1007/s11064-021-03451-6 match the previously verified primary record.
      The study expresses Tyr35Ter AIMP2 in mouse FBD-102b cells and reports Golgi aggregation
      and caspase-2-dependent differentiation defects. This is separate from the clinical report
      PMID:29215095 and does not establish normal human AIMP2 Golgi localization. The recovered
      record remains abstract-only; full-paper construct and assay details were not recovered.
- id: PMID:25320310
  title: Interaction of NS2 with AIMP2 facilitates the switch from ubiquitination to SUMOylation of
    M1 in influenza A virus-infected cells.
  full_text_unavailable: false
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source11 recovered exact normal-fetch metadata; DOI and primary identity independently
      verified. Full PMC4301113 Methods and Results inspected. Human 293T/A549 expression, depletion,
      endogenous co-immunoprecipitation and NS2-binding deletion experiments support contextual AIMP2
      participation in influenza M1 stabilization and vRNP export. K242 mutants and modification assays
      connect this effect to reduced ubiquitination and increased SUMOylation. The source does not demonstrate
      intrinsic AIMP2 ubiquitin/SUMO conjugation or RdRp catalysis. Provider citation of this paper
      for TGF-beta/FUBP1 refers to its Introduction, not its new infection experiments.
- id: PMID:26325028
  title: 'Stepping Out of the Cytosol: AIMp1/p43 Potentiates the Link Between Innate and Adaptive Immunity.'
  full_text_unavailable: true
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Source11 recovered exact normal-fetch metadata; DOI and primary identity independently
      verified. The normal record is abstract-only and explicitly reviews AIMP1/p43 immune functions,
      while mentioning AIMP2/p38 as an MSC component and family context. This supports the provider
      background citation but does not independently establish AIMP2 cytokine release or immune-cell
      mechanisms. No wrong-gene rejection of unseen full-paper experiments is inferred; this review
      is not used as AIMP2 experimental support.
- id: PMID:37933844
  title: Human lysyl-tRNA synthetase phosphorylation promotes HIV-1 proviral DNA transcription.
  full_text_unavailable: false
  findings:
  - statement: An expressed, tagged AIMP2-N36 peptide suppresses HIV-1 replication in SupT1 cells;
      this is a peptide intervention rather than an assay of an endogenous full-length antiviral role.
    supporting_text: HIV-1 replication was suppressed in cells expressing the AIMP2-N36 peptide, compared
      with the EGFP control cells, as indicated by reduced Gag expression (Figure 3B).
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Source11 recovered exact normal-fetch metadata; DOI and primary identity independently
      verified. Full PMC10711549 Methods and Results, especially Figures 3-4, inspected. Human HEK293T
      and SupT1 cells express an AIMP2-N36 peptide fused to tags/EGFP. The peptide blocks LysRS nuclear
      relocation and decreases HIV-1 transcription/infectivity; LysRS phosphorylation and Ap4A synthesis
      are the mechanistic enzyme arm. This contextual perturbation supports the KARS1-retention model,
      without assigning LysRS catalysis, transcription-factor activity or a demonstrated endogenous
      full-length antiviral role to AIMP2.
- id: PMID:38172953
  title: Bi-directional regulation of AIMP2 and its splice variant on PARP-1-dependent neuronal cell
    death; Therapeutic implication for Parkinson's disease.
  full_text_unavailable: false
  findings:
  - statement: In the oxidative-stress human neuroblastoma comparison, full-length AIMP2 enhances PARylation
      whereas exon-2-skipped DX2 does not; this distinguishes regulation of PARP1 from AIMP2 catalytic
      activity.
    supporting_text: AIMP2 enhanced PARylation in the presence of H2O2, whereas DX2 had no effect (Fig. 2d).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source11 recovered exact normal-fetch metadata; DOI and primary identity independently
      verified. Full PMC10765824 Methods and Results inspected. Co-immunoprecipitation, DX2 depletion/overexpression,
      PARylation and AIF-localization assays in human neuroblastoma cells distinguish full-length AIMP2
      activation from exon-2-skipped DX2 antagonism under oxidative stress. Rat primary hippocampal
      neurons and mouse toxin/AAV models supply separate neuronal outcomes. Stronger recovery in co-immunoprecipitation
      is not a purified equilibrium-affinity measurement. PARP1 performs PAR synthesis; neither isoform
      is assigned that enzyme activity, and the protective DX2 phenotype is not transferred to canonical
      AIMP2.
- id: PMID:38835119
  title: Identification and structure of AIMP2-DX2 for therapeutic perspectives.
  full_text_unavailable: false
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Source11 recovered exact normal-fetch metadata; DOI and primary identity independently
      verified. Full PMC11289502 review inspected for the scaffold, p53/KRAS and DX2 claims. It summarizes
      earlier work rather than adding new AIMP2 experiments. Its abstract/introductory TNF-beta wording
      is inconsistent with its later TGF-beta/FBP and TNF-alpha/TRAF2 discussion, and its JAK/JNK nomenclature
      is imprecise; those statements are not adopted. The existing primary-source assessments and explicit
      full-length/DX2 distinctions remain controlling.
- id: PMID:38945214
  title: AIMP2 restricts EV71 replication by recruiting SMURF2 to promote the degradation of 3D polymerase.
  full_text_unavailable: false
  findings:
  - statement: In the transfected HEK293T ubiquitination assays, AIMP2 increases EV71 3D-polymerase
      ubiquitination through the reported K63 linkage rather than K48.
    supporting_text: The results suggest that AIMP2 can increase the ubiquitination of 3D polymerase
      via the K63 ubiquitin linkage but not the K48 ubiquitin linkage.
    reference_section_type: RESULTS
  - statement: AIMP2 supports recruitment of SMURF2 for EV71 3D-polymerase turnover; SMURF2 supplies
      the ligase activity. Pairwise interaction and reciprocal knockdown experiments support this context-specific
      mechanism.
    supporting_text: Taken together, these results demonstrate that AIMP2 recruits the E3 ligase SMURF2
      to promote the degradation of 3D polymerase.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Source11 recovered exact normal-fetch metadata; DOI and primary identity independently
      verified. Full PMC11401463 Methods and Results inspected. Methods explicitly clone human AIMP2
      and SMURF2 from HEK293T cDNA. Co-immunoprecipitation in transfected cells and infected human RD
      cells, turnover/inhibitor assays and reciprocal knockdowns support recruitment of SMURF2 for EV71
      3D polymerase degradation. Vero expression experiments are a separate monkey-cell context. The
      measured ubiquitin linkage is reported as K63, not silently rewritten to K48. AIMP2 supplies the
      recruiting interaction; SMURF2 performs ubiquitin ligation and the proteasome degradation. This
      context is distinct from the positive influenza-replication effect and does not establish a universal
      antiviral function.
proposed_new_terms: []
suggested_questions:
- question: How do native MSC stoichiometry and AIMP2 interaction partners vary across cell types and
    assembly states, and how do subcomplex structures relate to the complete complex?
- question: Which AIMP2 structural contacts account for altered protein synthesis in patient cells, and
    which developmental effects require additional signaling functions?
- question: What controls the relative abundance of MSC-bound and free AIMP2 during genotoxic, oxidative
    and TGF-beta responses, and which upstream kinases directly modify AIMP2 in each setting?
- question: How does the exon-2-skipped DX2 isoform retain or alter individual MSC contacts while acquiring
    different signaling interactions? Structural results obtained with DX2-derived constructs need comparison
    with intact canonical AIMP2.
- question: Can the AIMP2 peptide identification and fraction controls in the NK-cell membrane proteome
    be recovered to resolve the seeded membrane HDA assertion?
- question: Which AIMP2-dependent effects on FUBP1, TRAF2 and PARP1 occur at endogenous concentrations
    in human tissues, and how do these mechanisms relate to the inherited neurodevelopmental phenotype?
- question: What determines which substrates AIMP2 recruits to SMURF2, and how do the recruitment
    interfaces and cellular conditions differ from its integral MSC scaffold contacts?
suggested_experiments:
- description: Compare native MSC stoichiometry, KARS1 retention and aminoacylation in isogenic human
    cells carrying endogenous AIMP2 loss-of-function variants, with matched full-length rescue.
  hypothesis: Disease variants disrupt defined structural contacts whose functional consequences depend
    on nutrient and cell-type context.
- description: Quantify full-length AIMP2 and DX2 separately in purified endogenous complexes and soluble
    pools before and after defined stress treatments.
  hypothesis: Stress and isoform abundance alter the distribution among MSC-associated and signaling pools.
- description: Compare enzymatically phosphorylated AIMP2 with S156A, S156D and S156E constructs in reconstituted
    subcomplexes.
  hypothesis: Substitution-induced interface changes need not reproduce the physical effects of phosphorylation.
