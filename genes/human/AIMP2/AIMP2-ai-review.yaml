id: Q13155
gene_symbol: AIMP2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AIMP2 (p38/JTV1) is a nonenzymatic structural component of the cytosolic aminoacyl-tRNA synthetase
  multienzyme complex. Its N-terminal region anchors KARS1, while additional contacts involving its GST-like
  region connect other synthetase subassemblies. These interactions organize and stabilize the aminoacylation
  machinery used in protein synthesis. AIMP2 also performs context-dependent signaling functions. During
  genotoxic stress it can bind and stabilize p53 by limiting MDM2-mediated degradation; in an oxidative-stress
  response it coactivates FBP-dependent USP29 transcription. TGF-beta signaling promotes AIMP2-dependent
  association of FUBP1 with SMURF2 and FUBP1 turnover. AIMP2 accumulation can activate PARP1 and induce
  parthanatos in experimental neuronal models. Biallelic loss-of-function variants cause a severe neurodevelopmental
  disorder with hypomyelination, microcephaly, seizures and spasticity. The exon-2-skipped DX2 isoform
  has distinct interaction and tumor-associated properties.
