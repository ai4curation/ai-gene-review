proposed_new_terms:
- proposed_name: mitochondrial outer membrane phospholipid scrambling
  proposed_definition: The ATP-independent movement of a phospholipid molecule from one leaflet of
    the mitochondrial outer membrane to the opposite leaflet.
  justification: Human VDAC1 and VDAC2 dimers catalyze phospholipid scrambling across the
    mitochondrial outer membrane, whereas GO:0017121 is restricted to the plasma membrane and is too
    specific for mitochondrial outer-membrane scramblases.
  proposed_parent:
    id: GO:0045332
    label: phospholipid translocation
  supported_by:
  - reference_id: PMID:38065946
    supporting_text: 'human VDAC1 and VDAC2, as well as their yeast ortholog Por1, are phospholipid scramblases:
      on reconstitution into synthetic vesicles these proteins catalyze rapid transbilayer translocation
      of phospholipids'
suggested_questions:
- question: How large are the erythrocyte and sperm-head pools of VDAC2 relative to mitochondrial
    VDAC2, and are they delivered to those membranes by the same isoform-specific targeting signals?
- question: Does ceramide binding regulate VDAC2 channel gating, scramblase activity, or
    oligomerization separately during MOMP?
- question: 'Which GO term should capture VDAC2-dependent BAK and BAX targeting to mitochondrial VDAC
    complexes: a direct recruitment activity, an apoptosis process term, or a future term specific to
    pro-apoptotic BCL2-family protein insertion into the outer membrane?'
- question: Does VDAC2 directly regulate mitochondrial calcium uptake in mammalian cardiomyocytes
    under basal conditions, or is the efsevin-responsive calcium phenotype limited to pharmacologic
    potentiation and zebrafish rescue models?
suggested_experiments:
- description: Use VDAC2 Glu84 mutants that separate ceramide binding, pore conductance, and
    phospholipid scrambling in VDAC2-null cells to test which activity controls ceramide-induced
    MOMP.
- description: Quantify endogenous VDAC2 on purified human erythrocyte and sperm plasma membranes
    with isoform-specific antibodies and mitochondrial-contamination controls.
