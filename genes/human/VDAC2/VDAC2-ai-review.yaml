id: P45880
gene_symbol: VDAC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'VDAC2 is a multi-pass beta-barrel channel of the mitochondrial outer membrane. It forms
  a weakly anion-selective voltage-gated pore for ions and small metabolites, and VDAC2 dimers also catalyze
  phospholipid scrambling across the outer membrane to support lipid entry into mitochondria. VDAC2 recruits
  pro-apoptotic BAX and BAK to mitochondrial VDAC complexes, and it also binds ceramide, cholesterol,
  phosphatidylcholine and oxysterols; ceramide binding to a membrane-facing glutamate promotes mitochondrial
  outer membrane permeabilization during apoptosis. Minor non-mitochondrial pools have been reported,
  including human erythrocyte membranes and sperm-head localizations.'
