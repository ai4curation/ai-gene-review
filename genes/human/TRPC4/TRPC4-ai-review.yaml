id: Q9UBN4
gene_symbol: TRPC4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TRPC4 is a multi-pass plasma-membrane transient receptor potential canonical
  channel subunit that forms homomeric or heteromeric receptor-operated,
  calcium-permeant nonselective cation channels. Human TRPC4 can assemble with
  TRPC1 and TRPC5, and TRPC1/TRPC4 heteromers contain one TRPC1 and three TRPC4
  subunits. TRPC4 channel localization and function are regulated by scaffold
  and junctional partners including NHERF1, SESTD1, beta-catenin, VE-cadherin
  and protein 4.1-family proteins, placing the channel at the plasma membrane
  and, in endothelial cells, at immature cell-cell contacts. In mouse GnRH
  neurons, kisspeptin/KISS1R signaling activates receptor-operated TRPC-like
  currents and TRPC4alpha mRNA is detected, making TRPC4 a plausible but not
  individually loss-of-function-proven subunit of the KISS1R depolarizing
  current.
