core_functions:
- description: >-
    Plasma-membrane receptor-operated, calcium-permeant nonselective cation
    channel subunit that assembles into homomeric TRPC4 and heteromeric
    TRPC1/TRPC4/TRPC5 channel complexes. In GnRH neurons, orthology and mouse
    single-cell RT-PCR support TRPC4 as a candidate KISS1R-activated channel
    that depolarizes the membrane, although the subunit requirement has not been
    tested directly.
  molecular_function:
    id: GO:0005261
    label: monoatomic cation channel activity
  directly_involved_in:
  - id: GO:0070588
    label: calcium ion transmembrane transport
  - id: GO:0051899
    label: membrane depolarization
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - *mckay_cation
  - *trpc1_4_structure
  - *kisspeptin_trpc_like
suggested_questions:
- question: >-
    Which TRPC subunits are required for the kisspeptin-activated
    receptor-operated current in GnRH neurons, and does TRPC4 loss alone reduce
    KISS1R-driven membrane depolarization?
- question: >-
    Which physiological human contexts use TRPC4 as a store-operated endothelial
    ISOC subunit rather than as a receptor-operated TRPC1/TRPC4 channel?
suggested_experiments:
- description: >-
    Knock out or acutely inhibit Trpc4 in kisspeptin-responsive GnRH neurons and
    measure whether KISS1R still induces the sodium-dependent TRPC-like inward
    current.
- description: >-
    Reconstitute candidate GnRH-neuron TRPC1/TRPC4/TRPC5 heteromers and test
    activation by the KISS1R-GNAQ-PLC-PIP2/cSrc pathway.
