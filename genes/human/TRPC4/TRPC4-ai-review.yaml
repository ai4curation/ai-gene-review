- id: PMID:11042129
  title: 'Cloning and expression of the human transient receptor potential 4 (TRP4)
    gene: localization and functional expression of human TRP4 and TRP3.'
  findings:
  - statement: Heterologous hTRP4 mediated a nonselective cation current.
    supporting_text: >-
      Whole-cell patch-clamp studies of hTRP4 expressed in Chinese hamster
      ovary cells revealed a constitutively active non-selective cation current
  - statement: hTRP4 localized to the plasma membrane.
    supporting_text: >-
      green fluorescent protein fusions of both molecules localized similarly to
      the plasma-membrane
- id: PMID:11713258
  title: Functional differences between TRPC4 splice variants.
  findings:
  - statement: Human TRPC4beta formed receptor-regulated cation channels in HEK293 cells.
    supporting_text: rat and human TRPC4beta both formed receptor-regulated cation channels
  - statement: Human TRPC4alpha reached the plasma membrane but was poorly activated by H1 receptor stimulation.
    supporting_text: >-
      human TRPC4alpha was poorly activated by stimulation of an H(1) histamine
      receptor. This was not due to reduced expression or plasma membrane
      targeting
- id: PMID:12032305
  title: Subunit composition of mammalian transient receptor potential channels in
    living cells.
  findings:
  - statement: TRPC1 forms channel complexes with TRPC4 and TRPC5.
    supporting_text: TRPC1 has the ability to form channel complexes together with TRPC4 and TRPC5.
- id: PMID:12154080
  title: The PDZ-interacting domain of TRPC4 controls its localization and surface
    expression in HEK293 cells.
  findings:
  - statement: The TRPC4 C-terminal PDZ-interacting motif controls TRPC4 surface expression.
    supporting_text: wild-type channel was evenly distributed on the cell surface.
- id: PMID:15757897
  title: MxA, a member of the dynamin superfamily, interacts with the ankyrin-like
    repeat domain of TRPC.
  findings:
  - statement: MxA binds several TRPC proteins, including TRPC4.
    supporting_text: MxA interacted with TRPC1, -3, -4, -5, -6, and -7
- id: PMID:16144838
  title: Epidermal growth factor induces tyrosine phosphorylation, membrane insertion,
    and activation of transient receptor potential channel 4.
  findings:
  - statement: EGF receptor stimulation induces hTRPC4 insertion into the plasma membrane.
    supporting_text: >-
      EGF receptor stimulation induced the exocytotic insertion of hTRPC4 into
      the plasma membrane
- id: PMID:16254212
  title: Activation of the endothelial store-operated ISOC Ca2+ channel requires interaction
    of protein 4.1 with TRPC4.
  findings:
  - statement: Protein 4.1 interaction with TRPC4 is needed for endothelial ISOC channel activation.
    supporting_text: >-
      Deletion of the protein 4.1 binding domain on TRPC4 or peptide competition
      to the protein 4.1 binding domain prevents ISOC activation.
  - statement: Protein 4.1 links TRPC4 with the endothelial membrane skeleton.
    supporting_text: Protein 4.1 interacts with TRPC4 and the membrane skeleton.
- id: PMID:18434521
  title: Kisspeptin depolarizes gonadotropin-releasing hormone neurons through activation
    of TRPC-like cationic channels.
  findings:
  - statement: Mouse GnRH neurons express multiple TRPC subunit RNAs, including TRPC4.
    supporting_text: TRPC4, TRPC5, TRPC6, and TRPC7 subunits were expressed in GnRH neurons.
- id: PMID:19996314
  title: 'Cell-cell contact formation governs Ca2+ signaling by TRPC4 in the vascular
    endothelium: evidence for a regulatory TRPC4-beta-catenin interaction.'
  findings:
  - statement: Endothelial TRPC4 surface expression rises as cell-cell contacts form.
    supporting_text: >-
      TRPC4 surface expression in human microvascular endothelial cells (HMEC-1)
      increased with the formation of cell-cell contacts.
  - statement: TRPC4 associates with beta-catenin and VE-cadherin junctional complexes.
    supporting_text: TRPC4 co-precipitated with the junctional proteins beta-catenin and VE-cadherin.
  - statement: TRPC4 mediates stimulated calcium entry in proliferating endothelial clusters.
    supporting_text: >-
      both siRNA and dominant negative knockdown experiments revealed that TRPC4
      mediates stimulated Ca(2+) entry
- id: PMID:20164195
  title: The phospholipid-binding protein SESTD1 is a novel regulator of the transient
    receptor potential channels TRPC4 and TRPC5.
  findings:
  - statement: SESTD1 associates with the TRPC4/TRPC5 CIRB domain.
    supporting_text: >-
      SESTD1 was found to associate with TRPC4 and TRPC5 via the channel's
      calmodulin- and inositol 1,4,5-trisphosphate receptor-binding domain.
- id: PMID:22157757
  title: Transient receptor potential channel 1 (TRPC1) reduces calcium permeability
    in heteromeric channel complexes.
  findings:
  - statement: TRPC1 can form functional heteromers with TRPC4 and other TRPC-family channels.
    supporting_text: >-
      TRPC1 was shown to form functional heteromeric, receptor-operated channel
      complexes with TRPC3, -4, -5, -6, and -7
- id: PMID:23744639
  title: Kisspeptin activation of TRPC4 channels in female GnRH neurons requires PIP2
    depletion and cSrc kinase activation.
  findings:
  - statement: The kisspeptin-activated TRPC current in mouse GnRH neurons is receptor-operated rather than store-operated.
    supporting_text: >-
      TRPC channels in GnRH neurons are receptor-operated, and kisspeptin
      activates TRPC channels through PIP(2) depletion and cSrc tyrosine kinase
      activation
- id: PMID:39478185
  title: Cryo-EM structure of the heteromeric TRPC1/TRPC4 channel.
  findings:
  - statement: The human TRPC1/TRPC4 heteromer has one TRPC1 and three TRPC4 subunits.
    supporting_text: >-
      human TRPC1/TRPC4 heteromer in the apo and antagonist-bound states, both
      consisting of one TRPC1 subunit and three TRPC4 subunits
