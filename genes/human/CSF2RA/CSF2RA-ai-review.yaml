functional_isoforms:
- id: CSF2RA_MEMBRANE_SIGNALING
  name: Membrane receptor forms with canonical or alternate cytoplasmic tail
  type: SPLICE_CLASS
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P15509-1
    - P15509-2
  description: The 400-aa canonical precursor and 410-aa alternate-tail form retain membrane
    topology and recognize GM-CSF. Human alpha/common-beta reconstitution establishes the
    signaling receptor; the alternate human tail form also supported binding and growth in
    transfected mouse FDC-P1 cells in PMID:1715577. The distinct assays do not establish identical
    endogenous signaling kinetics.
- id: CSF2RA_SOLUBLE_LIGAND_BINDING
  name: Soluble splice receptor with demonstrated ligand binding
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P15509-3
  description: The official 333-aa form lacks the canonical transmembrane segment and has
    the 16-aa tail reported for the soluble construct in PMID:1832774. Conditioned-medium
    ligand binding was demonstrated after expression of human cDNA in mouse cells. A definite
    affinity constant and endogenous antagonist function were not established. This does not
    assign the same activity to other shortened products.
- id: CSF2RA_ALU_RELEASE_PRONE
  name: Alu-insertion receptor with increased ectodomain release
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P15509-7
  description: The 434-aa Alu-GMRalpha precursor contains a 34-aa extracellular juxtamembrane
    insertion. The complete PMID:17681666 abstract reports preserved ligand binding and preferential
    proteolytic ectodomain release in recombinant assays. The shedding is performed by proteases;
    this class does not assign protease activity or identify a native cleavage product sequence.
core_functions:
- description: CSF2RA directly recognizes GM-CSF at the extracellular face of the plasma membrane
    and contributes to the receptor activity of the cooperative alpha/common-beta complex.
    Alpha-mediated ligand recognition and productive receptor assembly support GM-CSF signaling
    and hematopoietic proliferation. The alpha chain participates in activation rather than
    serving only as a passive ligand tether; the complete transmembrane receptor activity
    is assigned as a contribution to the complex. This core concerns membrane receptor forms
    and does not imply intrinsic alpha-chain kinase activity.
  molecular_function:
    id: GO:0019955
    label: cytokine binding
  directly_involved_in:
  - id: GO:0038157
    label: granulocyte-macrophage colony-stimulating factor signaling pathway
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  in_complex:
    id: GO:0030526
    label: granulocyte macrophage colony-stimulating factor receptor complex
  supported_by:
  - reference_id: PMID:2555171
    supporting_text: specificity for human GM-CSF but not interleukin-3.
  - reference_id: PMID:27396825
    supporting_text: 'show GMRα

      interactions playing a major role in receptor signaling while βc interactions

      control high-affinity binding.'
  contributes_to_molecular_function:
    id: GO:0004901
    label: granulocyte macrophage colony-stimulating factor receptor activity
suggested_questions:
- question: Which endogenous tissues express the lesser-characterized CSF2RA products, and
    which retain ligand binding or productive common-beta signaling?
  experts: []
- question: Does the naturally soluble isoform 3 regulate GM-CSF availability at physiological
    concentrations, and how does it differ from proteolytically shed receptor?
  experts: []
- question: Does any defined endogenous CSF2RA product perform an activity in the cytosol,
    as distinct from ligand recognition at the cell surface, intracellular membrane localization,
    or detection of an inactive receptor pool?
  experts: []
- question: Should GO add a cytokine-binding child explicitly denoting binding to the GM-CSF
    ligand? The captured definition of GO:0042021 instead specifies a GM-CSF complex; its
    intended scope should be clarified before using it for the alpha-chain ligand interaction.
  experts: []
suggested_experiments:
- description: Compare sequence-verified official membrane and shortened products in matched
    expression systems using surface abundance, ligand affinity, common-beta assembly and
    STAT5 response, with expression-normalized controls.
  hypothesis: Sequence differences create measurable receptor-context differences without
    assuming all eight products have equivalent activity.
- description: Measure purified isoform 3 ligand binding and test whether physiological concentrations
    alter GM-CSF responses in primary myeloid cells, alongside a matched shed-ectodomain comparator.
  hypothesis: Soluble receptor binding can be separated experimentally from an inferred antagonist
    or carrier role.
status: DRAFT
