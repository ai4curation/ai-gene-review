  review:
    action: MODIFY
    reason: Human alpha receptor specifically binds GM-CSF in the original PMID:2555171 expression/cloning
      experiments. Together with common beta it forms the high-affinity signaling receptor
      demonstrated in PMID:1702217 and the 2016 binding/mutagenesis studies. The specific
      GM-CSF receptor MF refines cytokine receptor activity; this is receptor participation,
      not intrinsic kinase activity. The authored core represents this cooperative activity
      with contributes_to_molecular_function while retaining direct cytokine binding as the
      subunit molecular function; the literal source qualifier is preserved.
