- id: PMID:1702217
  title: 'Molecular cloning of a second subunit of the receptor for human granulocyte-macrophage
    colony-stimulating factor (GM-CSF): reconstitution of a high-affinity GM-CSF receptor.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete original PNAS page scans were independently read in the bounded
      core consultation. Human alpha and beta cDNAs were tested in COS/NIH3T3 cells; alpha
      alone supplies ligand binding and alpha plus beta reconstitutes high-affinity binding
      with altered dissociation kinetics. This is receptor assembly/function, not autonomous
      alpha-chain kinase activity. The repository cache remains abstract-only. The full_text_unavailable
      flag records reviewer access, independently of the cache coverage flag. Public source
      locators, retrieved-file hashes and exact read limits are recorded in CSF2RA-source-evidence.yaml
      under independent_core_primary_read or owner_original_page_reads; this does not upgrade
      the abstract-only cache or imply unrecorded pages were read.
