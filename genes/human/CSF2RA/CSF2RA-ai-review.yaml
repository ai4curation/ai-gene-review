        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Authentic on-path PTN002745520 carries current GO:0004903 IBD with GHR experimental
          grounding; target-specific GM-CSF ligand recognition does not support growth-hormone
          receptor activity.
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
