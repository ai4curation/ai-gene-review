- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN002745520
  - UniProtKB:O46600
  review:
    summary: Whether CSF2RA performs an activity in the cytosol remains unresolved.
    action: UNDECIDED
    reason: PTN002745520 genuinely carries the current cytosol IBD and lies on the exact CSF2RA
      path. The literal is_active_in assertion concerns a site of activity; detecting an intracellular
      receptor pool would not alone establish it. Human alpha-chain ligand binding and receptor
      assembly support activity at the extracellular plasma-membrane interface. The identified
      donor O46600 is bovine GHR; the verified abstract of PMID:16174355 reports membrane
      and cytoplasm localization, without distinguishing cytosol from intracellular membranes
      or demonstrating CSF2RA activity there. Its full text was not recovered, but access
      to donor experiments would still leave the target-specific inference to assess. Unlike
      the rejected growth-hormone-specific functions, different ligand recognition does not
      itself demonstrate loss of an ancestral compartment of activity. Retain UNDECIDED because
      the available evidence neither establishes nor contradicts activity of a defined CSF2RA
      product in cytosol; this is not an assertion that every intracellular pool is active
      or that an on-path IBA is invalid merely because direct target data are unavailable.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN002745520
        source_label: PTN002745520
        source_status: UNRESOLVED
        comment: The cytosol IBD and exact target descent are authentic. The unresolved issue
          is conservation of activity in this compartment in CSF2RA, rather than mere intracellular
          presence. Bovine GHR abstract-level localization and ligand divergence do not settle
          that issue; the donor full text remains unassessed.
    additional_reference_ids:
    - PMID:16174355
