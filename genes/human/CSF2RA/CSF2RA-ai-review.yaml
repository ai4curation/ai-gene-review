id: P15509
gene_symbol: CSF2RA
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CSF2RA encodes the ligand-recognizing alpha subunit of the granulocyte-macrophage
  colony-stimulating factor (GM-CSF) receptor. Its membrane form binds GM-CSF and assembles
  with the common beta subunit CSF2RB to form a signaling receptor that supports myeloid-cell
  proliferation and activation through pathways including JAK-STAT. Alternative splicing produces
  forms with different cytoplasmic tails or extracellular and membrane regions, including
  a soluble ligand-binding receptor. Defective GM-CSF receptor responses can impair pulmonary
  surfactant homeostasis and cause hereditary pulmonary alveolar proteinosis.
