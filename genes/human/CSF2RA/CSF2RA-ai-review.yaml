- term:
    id: GO:0004903
    label: growth hormone receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:95708
  - PANTHER:PTN002745520
  - RGD:2687
  - UniProtKB:P10912
  review:
    summary: The GHR-specific activity does not match the demonstrated ligand specificity
      of CSF2RA.
    action: REMOVE
    reason: The authentic PTHR23036 v19 tree contains the exact CSF2RA sequence below PTN002745520,
      and the captured current IBD for growth hormone receptor activity is genuinely on that
      path. Its extant GHR experimental support is real. Human CSF2RA instead recognizes GM-CSF
      and assembles with common beta, as directly demonstrated by PMID:2555171, PMID:1702217
      and PMID:27396825. This is a ligand-specific propagation error across diverged receptor
      functions, not a missing-node or donor-count objection. GM-CSF receptor activity is
      represented by the refinements of the existing broad receptor annotations.
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN002745520
