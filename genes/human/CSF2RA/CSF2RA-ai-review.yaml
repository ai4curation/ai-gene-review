- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0243
  review:
    action: KEEP_AS_NON_CORE
    reason: The official SL-0243 mapping explicitly concerns soluble isoforms 3/4/6, not merely
      the extracellular ectodomain of the membrane receptor. In PMID:1832774, human soluble-receptor
      cDNA expressed in mouse psi-AM and 32Dcl3 cells produced conditioned-medium GM-CSF binding
      with little surface binding; the original Figure 1 terminal sequence matches official
      isoform 3. This supports a distinct soluble-product location. The activities of isoforms
      4/6 and antagonism by the soluble form remain unproved here, so the broad gene-level
      location is retained as non-core without adding an isoform field to the original assertion.
    summary: Retain extracellular localization at soluble-product scope, distinct from the
      surface-exposed ectodomain of membrane isoform1.
    additional_reference_ids:
    - PMID:1832774
    - PMID:17681666
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0243
        source_status: SUPPORTS_TRANSFER
        comment: Official soluble-product location is supported by the original secretion/binding
          experiment for the form matching isoform 3; equivalent function of isoforms 4/6
          is not asserted.
    supported_by:
    - reference_id: PMID:1832774
      supporting_text: 'produced a secreted protein that

