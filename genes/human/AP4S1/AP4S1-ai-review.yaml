  review:
    summary: 'Correct but maximally coarse, and already entailed by the gene''s own IDA complex
      row: QuickGO''s ancestor closure places GO:0005737 above GO:0030124 AP-4 adaptor complex.
      AP4S1 is a cytosolic subunit of a peripheral membrane coat, present in both a soluble
      and a membrane-bound pool.'
    action: ACCEPT
    reason: 'Kept rather than trimmed for two reasons. First it is simply true: UniProt records
      AP-4 as a peripheral membrane protein of the TGN, and the 1999 characterisation found
      the complex in both soluble and membrane-associated forms, so a cytoplasmic (non-luminal,
      non-nuclear) assignment is right. Second it is the same topological fact that makes
      the endosome lumen row on this gene wrong, so removing it while removing that one would
      be inconsistent. That second point is what discriminates this row from the other ARBA
      row on this gene, which is MODIFIED rather than accepted: GO:0012505 is coarse and strictly
      subsumed by terms the gene already holds, adding nothing, whereas GO:0005737 is coarse
      but carries independently useful content - it is the topological fact the endosome-lumen
      removal rests on. Coarse-and-informative is kept; coarse-and-subsumed is sharpened.
      The annotation does carry a provenance weakness recorded in the propagation review:
      the ARBA rule''s own published condition sets do not fire on AP4S1''s three real InterPro
      matches. That is a reason to distrust the derivation, not the term.'
