suggested_questions:
- question: 'For the PAINT curators of PTHR11753: the family carries exactly one annotated
    node, PTN000204281, whose GO:0016192 IBD is seeded only by AP-1, AP-2 and AP-3 sigmas
    - no AP-4 sigma from any species is a seed. Now that AP4S1 has human loss-of-function
    data of its own (ATG9A retention in four patient fibroblast lines) and a cryo-EM structure
    of the complex, would the AP-4 sigma subclade support a node-level annotation more specific
    than vesicle-mediated transport, for example post-Golgi vesicle-mediated transport?'
- question: 'For the GO ontology editors: GO:0140312 cargo adaptor activity is defined as
    binding the structural scaffolding elements of a vesicle coat ''such as clathrin or COPII''.
    AP-3, AP-4 and AP-5 assemble coats without clathrin, and for AP-4 no scaffold partner
    is known. Should the definition be broadened, or should a sibling term exist for coat
    adaptors with no identified scaffold? ComplexPortal already annotates AP-4 (CPX-5151)
    to GO:0140312 by NAS.'
- question: 'For UniProt: the two ARBA rows on Q9Y587 (ARBA00026971 to cytoplasm, ARBA00028953
    to endomembrane system) cannot be reproduced from the condition sets those rules serve
    - the only sets naming an AP4S1 signature also require IPR027156, IPR010908 or IPR044565,
    none of which AP4S1 matches. Is the served condition set incomplete, or was annotation
    run against a different signature snapshot?'
- question: 'For Reactome: R-HSA-5229111 models its output as the complex AP4:APP in compartment
    ''endosome lumen'', which propagates GO:0031904 onto all four AP-4 subunits as well as
    APP. AP-4 is a cytosolic peripheral coat and cannot occupy a lumen. Could the compartment
    be carried by the cargo rather than by the whole complex, or the members excluded from
    the CC mapping for BlackBoxEvent outputs?'
- question: 'For the AP-4 structural community: sigma4 retains Arg15 of the dileucine basic
    patch, but epsilon carries Thr at the position where gamma1, alphaC and delta all carry
    the patch arginine (Arg15, Arg21 and Arg26 respectively). Does the AP-4 cryo-EM structure
    show a pocket at the epsilon-sigma4 interface that is geometrically capable of accepting
    a dileucine signal, and is Thr44 of epsilon positioned where those arginines sit?'
suggested_experiments:
- description: Test whether the AP-4 dileucine site is intact but half-built. Substitute Thr44
    of epsilon (AP4E1, Q9UPM8) to Arg, the residue that gamma1, alphaC and delta carry at
    the aligned position, and assay the epsilon(T44R)-sigma4 hemicomplex against the Nef ENTSLL,
    tyrosinase ERQPLL and LIMP-II ERAPLI signals by yeast three-hybrid, with wild-type epsilon-sigma4
    as the negative control and gamma1-sigma1A as the positive. Gain of binding would show
    that AP-4 lost dileucine recognition by losing one half of a two-part basic patch that
    sigma4 still supplies; no gain would move the explanation to the surrounding surface or
    to accessibility of the pocket, and would close off a line of speculation.
- description: Ask whether sigma4 has any function outside AP-4. Express BioID2- or TurboID-tagged
    sigma4 in wild-type and AP4E1-knockout cells, where no complex can assemble, and compare
    the labelled proteomes. Partners retained in the knockout are candidates for a complex-independent
    role; a proteome that collapses to nothing would argue that sigma4 is an obligate structural
    subunit and nothing else, which is the conclusion this review currently draws and which
    deserves a direct test.
- description: Separate the structural function from the transport function on AP4S1 itself.
    Using the cryo-EM structure of the AP-4 core, design sigma4 substitutions at the epsilon
    interface that are predicted to weaken but not abolish assembly, complement AP4S1-null
    cells with each, and score complex assembly by immunoprecipitation alongside the quantitative
    TGN-to-cytoplasm ATG9A ratio. A graded series relating residual assembly to residual cargo
    export would convert a binary disease gene into a structure-function map and give missense
    variant interpretation something to lean on, which it currently lacks.
- description: Determine which AP4S1 isoform matters. The clinical literature numbers variants
    on NM_007077 (Q9Y587-2) while MANE Select and the UniProt canonical sequence are Q9Y587-1,
    and isoforms 2, 3 and 4 all replace the C-terminal 42 to 46 residues. Establish by isoform-resolved
    proteomics which forms are made in brain and fibroblast, then complement AP4S1-null cells
    with each isoform and score complex assembly and the ATG9A ratio. If the isoforms differ,
    the annotation record needs isoform qualifiers it does not currently have.
