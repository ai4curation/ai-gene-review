- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IDA
  original_reference_id: PMID:11409905
  qualifier: enables
  review:
    summary: 'The molecular function the record is missing. Sigma4 is what holds the AP-4
      core together: in a yeast three-hybrid reconstitution the two large adaptins epsilon
      and beta4 associate with each other only when sigma4 is present, and in patient cells
      lacking sigma4 every other subunit falls and the complex does not assemble. GO:0005198
      is defined as ''The action of a molecule that contributes to the structural integrity
      of a complex'', which is precisely this.'
    action: NEW
    reason: 'GOA gives AP4S1 no molecular function at all, which for a protein with a solved
      structure and a named disease is a real gap. The evidence here is specific to this subunit
      and comes from three independent directions. First, reconstitution: the three-hybrid
      experiment is a direct assay of sigma4''s effect, not a binary interaction test - the
      readout is whether two other proteins can find each other, and they cannot without it.
      The same paper shows the identical dependence for AP-1 (gamma and beta1 need sigma1)
      and for the COPI F subcomplex (gamma-COP and beta-COP need zeta-COP), so this is the
      conserved architectural role of the small subunit across the superfamily rather than
      an idiosyncrasy of one assay. Second, human loss of function: in fibroblasts from a
      patient with compound-heterozygous nonsense and frameshift AP4S1 variants sigma4 is
      undetectable, all other AP-4 subunits are substantially reduced, hemicomplex and complete-complex
      assembly both fail, and the accessory protein tepsin loses its membrane recruitment
      - while AP-1 assembly in the same cells is normal, so this is not a general secretory
      collapse. Third, structure: the cryo-EM structure of the AP-4 core shows the epsilon
      N-terminal half wrapping around sigma4 to build the central core, and complex assembly
      is chaperoned by AAGAB, which stabilises epsilon and sigma4 specifically. IDA rather
      than IPI because the claim being annotated is an activity (conferring structural integrity)
      measured by its effect, not a physical interaction with a named partner. Deliberately
      not annotated as protein binding, which would say nothing. One bound on the claim, from
      the carrier study cited here: a single functional AP4S1 allele is enough, since 28 heterozygous
      carriers of a nonsense allele are asymptomatic - so the structural requirement is absolute
      but not dosage-limiting.'
    supported_by:
