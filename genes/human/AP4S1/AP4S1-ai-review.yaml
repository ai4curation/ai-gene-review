- id: PMID:14691137
  title: Recognition of dileucine-based sorting signals from HIV-1 Nef and LIMP-II by the
    AP-1 gamma-sigma1 and AP-3 delta-sigma3 hemicomplexes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'The 2003 yeast three-hybrid paper often cited as establishing that the
      epsilon-sigma4 hemicomplex does not bind dileucine signals. Correctly cited but weaker
      than it is usually taken to be, which is why it is MEDIUM rather than HIGH: it tested
      two signals and scored alphaC-sigma2 negative alongside epsilon-sigma4, and the alphaC-sigma2
      half did not hold. Its GST pull-down arm is weaker still for AP-4, since the input preparation
      contained only traces of AP-4. The paper says as much itself in the discussion. The
      load-bearing citation for the sigma4 negative is PMID:21097499.'
- id: PMID:20230749
  title: Sorting of the Alzheimer's disease amyloid precursor protein mediated by the AP-4
