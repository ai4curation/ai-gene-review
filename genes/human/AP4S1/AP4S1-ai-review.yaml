core_functions:
- description: 'Architectural subunit of the AP-4 core. Sigma4 is the small subunit that the
    epsilon trunk wraps around to form the central structural core of the complex, and it
    is required for the complex to exist at all: the two large adaptins epsilon and beta4
    associate with one another only in its presence, and in patient fibroblasts lacking sigma4
    every other AP-4 subunit is reduced, neither the hemicomplexes nor the tetramer assemble,
    and the accessory protein tepsin is no longer recruited to membranes, while AP-1 assembly
    in the same cells is unaffected. Assembly is chaperoned rather than spontaneous, and AAGAB
    holds epsilon and sigma4 specifically. This is a subunit-attributable molecular function,
    distinct from anything the complex does as a whole, and it is the reason a truncating
    AP4S1 allele phenocopies loss of any other subunit.'
