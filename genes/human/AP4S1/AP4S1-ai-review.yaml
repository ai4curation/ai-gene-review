  review:
    summary: 'Topologically impossible, and traceable to a specific mechanism: Reactome models
      the reaction''s output as the complex AP4:APP sitting in compartment ''endosome lumen'',
      and the Reactome-to-GO mapping gives that compartment to every member of the complex.
      AP-4 is a cytosolic peripheral membrane coat and never enters a lumen.'
    action: REMOVE
    reason: 'GO:0031904 is ''The volume enclosed by the membrane of an endosome''. A coat
      adaptor cannot be there. Everything known about AP-4''s topology puts it on the cytosolic
      face: UniProt calls it a peripheral membrane protein of the TGN membrane; it is recruited
      by membrane-anchored ARF1 and binds the cytosolic tails of cargo; and the cryo-EM structure
      locates the two ARF1 sites on epsilon and on the mu4 C-terminal domain, with the cargo
      site on mu4 facing the membrane. The Reactome summary itself describes APP being delivered
      to endosomes, not AP-4 entering their lumen. The reference projection confirms this
      is a single inherited compartment rather than five findings: QuickGO by reference=Reactome:R-HSA-5229111
      returns 11 annotations over 5 entities, the four AP-4 subunits plus APP, with GO:0031904
      on five of them. This is a positive biological argument against the term, not an absence
      of support, which is what REMOVE requires. The same defect sits on the other three AP-4
      subunits.'
