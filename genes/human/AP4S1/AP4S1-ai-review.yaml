- id: file:human/AP4S1/AP4S1-bioinformatics/RESULTS.md
  title: 'AP4S1 (sigma4): is the large-subunit half of the dileucine basic patch present in
    AP-4 epsilon?'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Analysis written for this review: does epsilon carry the large-subunit
      half of the dileucine basic patch? All eight sequences fetched live from UniProt with
      lengths asserted; a 6/6 method control on the three published anchors gates the answer;
      the finding is that all three anchors map to epsilon Thr44 while sigma4 retains the
      sigma-side Arg15. It supports no annotation - no cargo-binding function is proposed
      for AP4S1 either way - and the write-up states explicitly that it is a hypothesis consistent
      with the measured negative rather than a test of it.'
- id: file:human/AP4S1/AP4S1-deep-research-affinage.md
  title: Affinage mechanistic annotation for AP4S1 (human)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Machine-fetched Affinage record. Trust gates clear per .affinage.log, self_evaluation_pairwise
      ''win'', faith_pct 100, and all eight citations are numeric PMIDs with no preprints.
      It describes the right protein - no symbol collision - and each of its eight dated findings
      checks out against the cited paper. Its weakness is recall, not accuracy: it missed
      every paper that bears on sigma4''s own molecular function (PMID:11409905, PMID:41565640,
      PMID:21097499, PMID:35976721), the mu4 cargo-site work, and the 2025 negative on heterozygous
      carriers. Its mechanism_profile GO ids were not imported; both molecular-function terms
      used here were re-grounded from the primary literature and placed in different slots
      than a direct import would have given.'
- id: file:human/AP4S1/AP4S1-uniprot.txt
  title: UniProtKB Q9Y587 (AP4S1_HUMAN) flat file
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: UniProtKB flat file for Q9Y587, entry version 188, sequence version 1, 144
      aa. Confirmed to be the expected accession and protein (AP4S1_HUMAN) rather than a merged
      redirect. Its SUBUNIT, SUBCELLULAR LOCATION and DR lines are quoted directly; its FUNCTION
      text is treated as curator summary and its claims are traced to the primary papers rather
