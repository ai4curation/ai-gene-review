- gap_statement: GO has no molecular function that fits the complex-level activity of a non-clathrin
    AP coat. GO:0140312 cargo adaptor activity, the only term that names the coat-adaptor
    role, is defined in terms of binding the structural scaffolding elements of a vesicle
    coat such as clathrin or COPII - and for AP-4 no scaffold partner is known at all.
  boundary: 'Established: AP-4 does not bind clathrin and assembles a non-clathrin coat; recent
    vesicle proteomics states plainly that AP-4-mediated TGN export operates independently
    of clathrin and that the accessory factors responsible for its vesicle biogenesis are
    uncharacterised, naming PRRC1 and WDR44 as newly found cytosolic regulators. Also established:
    ComplexPortal nonetheless annotates the human AP-4 complex CPX-5151 to GO:0140312 by NAS.
    Unknown: what the scaffold of an AP-4 coat is, or whether one exists.'
  gap_kind:
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: It forces this review to express AP-4's complex-level activity with the generic
    parent GO:0060090 molecular adaptor activity rather than the specific child, losing the
    information that the activity is coat assembly and cargo capture. The same problem applies
    to AP-3 and AP-5, so a fix would be worth more than one gene. It is raised as an ontology
    observation rather than a proposed term, because the right repair depends on whether AP-4
    turns out to have a scaffold partner.
  resolution: Either broaden GO:0140312's definition so that the scaffolding element need
    not be clathrin or COPII, or create a sibling for coat adaptors that assemble without
    a known scaffold. Which is correct should follow identification of the AP-4 coat's structural
    component, if it has one.
