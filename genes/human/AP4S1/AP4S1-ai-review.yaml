- description: 'As part of AP-4, contributes to a coat adaptor activity that selects transmembrane
    cargo at the trans-Golgi network and packages it into non-clathrin-coated vesicles bound
    for peripheral compartments. Recruitment is cooperative: ARF1 and cargo each recruit the
    complex on their own, and together they do so synergistically, with two ARF1 sites on
    epsilon and on the mu4 C-terminal domain. Sigma4 contributes to this activity without
    possessing it - the cargo signals themselves are read by mu4, whether the canonical tyrosine-based
    motif, the non-canonical YKFFE signal of APP, or the ATG9A peptide - which is what the
    contributes-to relation expresses. The functional consequence is measurable on AP4S1 itself:
    bi-allelic loss leaves ATG9A trapped in the TGN and absent from the periphery. GO:0060090
    is used rather than its child GO:0140312 cargo adaptor activity because that term''s definition
    is framed as binding the scaffolding elements of a vesicle coat such as clathrin or COPII,
    and AP-4 uses neither; no scaffold partner for AP-4 is known.'
