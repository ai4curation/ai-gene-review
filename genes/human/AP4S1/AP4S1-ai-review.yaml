description: 'AP4S1 encodes sigma4-adaptin, the single small subunit of adaptor protein complex
  4 (AP-4), an obligate heterotetramer that also contains the large adaptins epsilon (AP4E1)
  and beta4 (AP4B1) and the medium adaptin mu4 (AP4M1). AP-4 assembles a non-clathrin coat
  on the cytosolic face of the trans-Golgi network, where the small GTPase ARF1 and membrane
  cargo recruit it cooperatively, and packages a defined set of transmembrane proteins into
  vesicles that leave the TGN for peripheral and axonal compartments. Its best-characterised
  client is ATG9A, the lipid scramblase required for autophagosome biogenesis; the amyloid
  precursor protein, SERINC1 and SERINC3, sortilin, and AMPA and delta-2 glutamate receptors
  have also been reported as AP-4-dependent, and the accessory proteins tepsin, RUSC1 and
  RUSC2 link AP-4 vesicles to microtubule motors. Within the complex sigma4 is the architectural
  subunit: the epsilon trunk wraps around it to build the central core, the two large adaptins
  cannot associate in its absence, and loss of sigma4 destabilises all four subunits, abolishes
  complex assembly and abolishes tepsin recruitment to membranes. Unlike the sigma subunits
  of AP-1, AP-2 and AP-3, sigma4 has no demonstrated role in recognising dileucine sorting
  signals; in AP-4 the tyrosine-based and non-canonical cargo signals are read by mu4. Bi-allelic
  loss-of-function variants in AP4S1 cause spastic paraplegia 52, one of four genetically
  distinct but clinically indistinguishable forms of AP-4 deficiency syndrome, a childhood-onset
  complex hereditary spastic paraplegia with intellectual disability, progressive lower-limb
  spasticity and developmental brain malformations. Heterozygous carriers are unaffected.'
