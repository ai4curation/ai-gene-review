knowledge_gaps:
- gap_statement: Sigma4 has no assigned molecular activity outside the AP-4 core, and the
    one question that could have given it one - whether it helps read a cargo sorting signal,
    as the sigma subunits of AP-1, AP-2 and AP-3 do - has been answered negatively for the
    complex but has never been tested by mutating sigma4 itself.
  boundary: 'Firmly established: epsilon and beta4 cannot associate without sigma4; loss of
    sigma4 destabilises all four subunits and abolishes assembly; the epsilon trunk wraps
    around sigma4 in the cryo-EM structure; AAGAB stabilises epsilon and sigma4 during assembly;
    and the epsilon-sigma4 hemicomplex does not bind three canonical (D/E)XXXL(L/I) signals
    in the assay where gamma1-sigma1A, alphaC-sigma2 and delta-sigma3A all do. Equally established:
    sigma4 retains the sigma-side residues of the dileucine site, including the Arg15 of the
    basic patch, so its sequence does not look like a non-binder. Unknown: whether sigma4
    has any partner or activity outside AP-4; whether any AP-4 cargo signal contacts sigma4
    at all; and whether the AP-4 negative is explained by the large subunit, since the bioinformatics
    here shows epsilon carries Thr where all three binding complexes carry the large-subunit
    Arg of the patch.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: NARROWING
  significance: This is essentially the entire molecular-function content of the gene. GOA
    currently records no molecular function for AP4S1 at all; this review proposes one (structural
    integrity of the complex), and whether there is a second, recognition-related function
    determines whether sigma4 is a scaffold or a specificity subunit. It also bears on variant
    interpretation, since missense alleles are enriched in sigma4 and cannot currently be
    reasoned about beyond predicted destabilisation.
  resolution: Two experiments settle it. For the binding question, substitute Thr44 of epsilon
    to Arg and assay the epsilon(T44R)-sigma4 hemicomplex against the same three signals by
    yeast three-hybrid; a gain of binding would show the site is intact but half-built, and
    no gain would move the explanation to the surrounding surface or to pocket accessibility.
    For the wider question, proximity labelling from sigma4 in AP4E1-null cells, where no
    complex can form, would reveal any partner sigma4 has on its own.
  provenance:
  - reference_id: PMID:21097499
    supporting_text: we found that all of these signals interact with the AP-1 γ1-σ1A, AP-2
      αC-σ2, and AP-3 δ-σ3A hemicomplexes but not with the homologous AP-4 ϵ-σ4 hemicomplex
  - reference_id: PMID:11409905
    supporting_text: two large subunits of the AP-4 complex, epsilon-adaptin and beta4-adaptin,
      are found to interact with each other only in the presence of the small subunit, sigma4
  - reference_id: PMID:41565640
    supporting_text: The disease-related mutations are not only enriched in the large subunit
      β4 and the small subunit σ4
  - reference_id: PMID:14691137
    supporting_text: are recognized by α–σ2 or ɛ–σ4, which tested negative in our assays despite
      having structures similar to γ1–σ1 and δ–σ3.
  - reference_id: file:human/AP4S1/AP4S1-bioinformatics/RESULTS.md
    supporting_text: 'In short: sigma4 retains Arg15 of the basic patch, epsilon carries Thr44
      where all three binding complexes carry Arg, and this analysis supports no cargo-signal-binding
      molecular function for AP4S1.'
- gap_statement: 'The causal step between ATG9A missorting and neurodegeneration in AP-4 deficiency
    is unidentified, and the obvious candidate has been excluded in the cells where the missorting
    is measured: bulk autophagic flux is intact in AP-4-deficient patient fibroblasts despite
    a complete redistribution of ATG9A.'
  boundary: 'Established: bi-allelic loss of any AP-4 subunit, AP4S1 included, retains ATG9A
    in the TGN and depletes it from the periphery in patient fibroblasts and iPSC-derived
    cortical neurons; whole-cell ATG9A rises three- to five-fold; the ratio of TGN to cytoplasmic
    ATG9A is a quantitative functional readout good enough to be used diagnostically. Also
    established: autophagic flux in those same fibroblasts is normal under nutrient-rich conditions
    and on stimulation. Unknown: which downstream event actually causes the axonal pathology,
    and whether it is autophagy-related at all rather than a consequence of losing one of
    AP-4''s other cargoes.'
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: It determines whether an autophagy biological-process term belongs on the
    AP-4 subunits at all. This review does not propose one for AP4S1, precisely because the
    human evidence stops at cargo missorting and the autophagy phenotypes are spatial, axonal
    and demonstrated in animal and neuronal models rather than by loss of function in human
    cells. It is also the gap that any therapeutic programme for AP-4 deficiency has to cross.
  resolution: Compartment-resolved rather than bulk autophagy measurements in AP4S1-null human
    neurons - axonal autophagosome biogenesis rates and autophagosome maturation along the
    axon, not whole-cell LC3-II - together with a cargo-swap test asking whether forcing ATG9A
    to the periphery in an AP-4-independent way rescues the axonal phenotype.
  provenance:
  - reference_id: PMID:31915823
    supporting_text: we found that fibroblast lines derived from AP-4-HSP patients showed
      intact autophagic flux despite the changes in ATG9A distribution.
  - reference_id: PMID:31915823
    supporting_text: We conclude that bi-allelic loss-of-function variants in any of the AP-4
      subunit genes lead to loss of AP-4 function and subsequently to accumulation of ATG9A
      in the TGN area and depletion from peripheral compartments.
  - reference_id: PMID:37767851
    supporting_text: The ap4s1 truncation led to motor impairment, delayed neurodevelopment,
      and distal axonal degeneration.
  - reference_id: PMID:32979048
    supporting_text: Exploring genotype-phenotype correlations, we found that disease severity
      and major phenotypes were equally distributed among the four subtypes
  - reference_id: PMID:31142229
    supporting_text: The reduction in the capacity to generate axonal autophagosomes leads
      to defective axonal extension and de novo generation of distal axonal swellings containing
      accumulated ER, underlying the impaired axonal integrity in AP-4 deficiency syndrome.
- gap_statement: Neither of the two ARBA-derived annotations on this gene can be reproduced
    from its own rule's published condition sets, so there is no recoverable reason why these
    particular terms were assigned to this particular protein.
  boundary: 'Checked and established: AP4S1 matches exactly three InterPro entries (IPR011012,
    IPR016635, IPR022775), confirmed live against the InterPro API and consistent with the
    DR lines in the UniProt flat file. ARBA00026971 (cytoplasm) publishes 2388 condition sets,
    of which the only one naming an AP4S1 signature additionally requires IPR027156, which
    AP4S1 does not match. ARBA00028953 (endomembrane system) publishes 533, of which the only
    candidate requires IPR010908 and IPR044565 as well, neither of which AP4S1 matches. Unknown:
    whether the rules'' served condition sets are incomplete, whether annotation used a different
    signature snapshot, or whether the mapping is looser than the published conditions imply.'
  gap_kind:
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: Both terms happen to be biologically correct here, so nothing is wrong on
    this gene - which is exactly why it is worth recording. A reviewer cannot tell a correct-by-luck
    ARBA row from a correct-by-derivation one, and the same opacity would hide a wrong one.
    This repository already carries a review of another ARBA rule whose annotations could
    not be reproduced from its condition sets, so the pattern is not specific to these two.
  resolution: UniProt would need to serve, per annotation, the condition set that actually
    fired, or ARBA would need to publish the signature snapshot the rule was evaluated against.
    Failing that, a systematic audit across many proteins would establish how often served
    conditions reproduce served annotations.
  provenance:
  - reference_id: file:human/AP4S1/AP4S1-uniprot.txt
    supporting_text: DR   InterPro; IPR016635; AP_complex_ssu.
  - reference_id: file:human/AP4S1/AP4S1-uniprot.txt
    supporting_text: DR   InterPro; IPR022775; AP_mu_sigma_su.
  - reference_id: file:human/AP4S1/AP4S1-uniprot.txt
    supporting_text: DR   InterPro; IPR011012; Longin-like_dom_sf.
- gap_statement: The clinical and the reference literature on AP4S1 number residues on different
    isoforms, and nothing in the annotation record says so. Variant nomenclature is standardised
    on NM_007077 (Q9Y587-2), while UniProt's canonical sequence and the MANE Select transcript
    are Q9Y587-1.
  boundary: 'Established: UniProt lists four isoforms, with isoforms 2, 3 and 4 all replacing
    the C-terminal 42 to 46 residues of the 144-residue canonical form; MANE Select is NM_001128126.3
    / NP_001121598.1, which is Q9Y587-1; the founding SPG52 report numbered its variant on
    NM_007077.3, and the AP-4 diagnostic assay paper drew its AP4S1 domain figure on Q9Y587-2.
    Unknown: whether the non-canonical isoforms are expressed at protein level in the tissues
    that matter, and whether any AP-4 function differs between them - no experiment has compared
    them.'
  gap_kind:
  - CURATION
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: None of the fourteen GOA rows on this gene carries an isoform qualifier and
    none of the annotations reviewed here is isoform-specific, so nothing in this review changes.
    But a published p.Arg97Ter mapped onto the canonical sequence lands in a different place,
    and the four patient fibroblast lines that supply this gene's only human functional data
    are described in the other frame. If any isoform-specific function is ever found, the
    existing record provides no basis for assigning annotations to isoforms.
  resolution: Isoform-resolved proteomics or long-read transcriptomics in brain and fibroblast,
    to establish which AP4S1 isoforms are actually made, followed by complementation of AP4S1-null
    cells with each isoform scored on the ATG9A readout.
