id: P29120
gene_symbol: PCSK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PCSK1 encodes prohormone convertase 1/3 (PC1/3, neuroendocrine convertase 1, EC 3.4.21.93), a calcium-dependent
  subtilisin/kexin-like serine endoprotease of the regulated secretory pathway. It is made as an inactive zymogen
  whose propeptide is removed autocatalytically in the endoplasmic reticulum, after which the mature enzyme is sorted
  into dense-core secretory granules of neurons and of endocrine and enteroendocrine cells, where the acidic, calcium-rich
  lumen permits catalysis. There it cleaves prohormone and proneuropeptide precursors at paired basic residues,
  acting with the partially complementary convertase PC2 and the downstream carboxypeptidase CPE. Characterised
  substrates include proopiomelanocortin (cleaved to ACTH and beta-lipotropin, the obligatory step before alpha-MSH
  can be produced), proinsulin, proglucagon-derived peptides, pro-GHRH, proAgRP, prorenin, prodynorphin, proenkephalin
  and provasopressin; in human beta cells PC1/3 rather than PC2 carries out proinsulin conversion. Biallelic loss-of-function
  PCSK1 mutations cause a pleiotropic prohormone-processing disorder with neonatal malabsorptive diarrhoea, early-onset
  obesity, hypogonadotropic hypogonadism, hypoadrenalism, altered thyroid function and reactive hypoglycaemia with
  a raised proinsulin-to-insulin ratio, and common nonsynonymous variants (N221D, Q665E-S690T) are associated with
  polygenic obesity risk. Several disease alleles act by misfolding and endoplasmic-reticulum retention or degradation
  rather than by direct loss of catalytic residues.
