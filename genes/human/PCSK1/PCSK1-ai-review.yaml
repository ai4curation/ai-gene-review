suggested_questions:
- question: Which PC1/3 substrate in enteroendocrine cells accounts for the neonatal malabsorptive diarrhoea of
    PCSK1 deficiency, given that small-intestinal morphology and the proGIP/GIP and proglucagon/GLP-1 ratios were
    reported as normal in at least one patient's colonic tissue?
- question: How much of the obesity in PCSK1 deficiency is attributable to failed POMC processing in hypothalamic
    neurons as opposed to failed processing of other energy-balance substrates such as proAgRP, pro-GHRH and the
    proglucagon-derived peptides?
- question: Why do individual disease alleles differ so markedly in which tissue's substrate processing they impair,
    and is that explained by allele-specific endoplasmic-reticulum retention rather than by differences in intrinsic
    catalytic activity?
suggested_experiments:
- description: Measure substrate-resolved processing (proinsulin, POMC, proAgRP, proGIP, proglucagon) in isogenic
    human iPSC-derived beta cells, hypothalamic neurons and enteroendocrine cells carrying a panel of patient PCSK1
    alleles, separating protein abundance, folding and catalytic turnover for each allele.
- description: Test whether chemical or pharmacological chaperones that relieve endoplasmic-reticulum retention
    restore prohormone processing for misfolding PCSK1 alleles, using a cell-based reporter of paired-basic-residue
    cleavage.
