- id: PMID:28860486
  title: A systematic analysis of orphan cyclins reveals CNTD2 as a new oncogenic driver in
    lung cancer.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete metadata/abstract and selected complete target Results, captions
      and Methods read from the normal full-text cache. CCNO was actually assayed despite
      the CNTD2-focused title; human tissue immunohistochemistry supports nucleolar localization.
      Overexpression constructs and tumor-context proliferation results are distinct, and
      no figure pixels or supplementary validation images were reanalyzed. Nucleolar staining
