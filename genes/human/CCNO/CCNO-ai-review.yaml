suggested_questions:
- question: Which CDK partner and immediate substrates mediate CCNO activity in human multiciliated
    epithelial cells?
- question: Does CCNO directly promote an ordinary mitotic G1/S transition in a defined human-cell
    context, separately from its role in the nonmitotic multiciliated-cell cycle variant?
- question: What functional roles, if any, distinguish the two reviewed CCNO splice products
    and the nuclear versus apical cytoplasmic pools?
- question: Do lymphoid intrinsic apoptosis and multiciliated-cell differentiation use the
    same CCNO-associated CDK and substrates, and what determines their different outcomes?
suggested_experiments:
- description: Identify endogenous CCNO-associated CDKs in staged human airway differentiation
    and test whether interaction-defective, expression-matched CCNO variants rescue centriole
    amplification after CCNO depletion.
- description: Compare endogenous isoform-specific localization and activity during human
    airway differentiation, separating the onset of multiciliated-cell markers from procentriole
    assembly and mature cilia production.
