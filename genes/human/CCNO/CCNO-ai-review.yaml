  review:
    summary: Human CCNO binding and kinase assays support the more specific CDK activator
      activity.
    action: MODIFY
    reason: 'The regulatory assignment is sound, and PMID:25364462 supplies a more precise
      activity: human CCNO associates with CDK2 and increases the histone H1 kinase activity
      recovered in anti-CDK2 immunoprecipitates. The S81A CCNO variant retains partial stimulation
