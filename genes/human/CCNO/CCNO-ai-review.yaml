id: P22674
gene_symbol: CCNO
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Cyclin O is a cyclin-family regulatory protein that associates with and activates
  cyclin-dependent kinase complexes. Acting downstream of MCIDAS, it promotes the progression
  of multiciliated epithelial cells into a specialized differentiation program that amplifies
  centrioles and produces multiple motile cilia. Human CCNO deficiency impairs centriole production
  and causes autosomal recessive primary ciliary dyskinesia with reduced generation of motile
  cilia. CCNO is found in the apical cytoplasm of multiciliated cells and can also accumulate
  in nuclear compartments in other cellular contexts. Human-cell biochemical experiments establish
  CDK2 association and activation, while the physiological CDK partner in differentiating
  multiciliated cells remains unresolved. Lymphoid-cell studies also implicate cyclin O in
  intrinsic apoptosis, including induction in mouse thymus and spleen, although apoptosis
  after CCNO overexpression appears context dependent. Its historical uracil-DNA glycosylase
  assignment is erroneous; the DNA-repair protein now called UNG2 is a product of a different
  gene.
