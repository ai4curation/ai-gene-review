  review:
    summary: The inherited mitotic G1/S assertion is not resolved by the specialized multiciliated-cell
      cycle.
    action: UNDECIDED
    reason: GO:0000082 describes entry into the DNA-replication phase of a mitotic cycle.
      PMID:39740663 instead studies a differentiation-associated cycle variant in which centriole
      amplification is uncoupled from DNA replication and mitosis. That result does not disprove
      a mitotic function in another context. The PAINT IBD placement behind PTN000019791 has
      not been reconstructed, and the accessible historical human study does not establish
      a causal mitotic transition. Preserve the phylogenetic assertion as unresolved rather
      than challenging it by donor count or transferring the nonmitotic endpoint into this
      term. PMID:18927588 separates its lymphoid apoptotic effect from cell-cycle perturbation;
      this context-specific result does not resolve all possible mitotic functions.
