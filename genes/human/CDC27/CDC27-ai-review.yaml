  review:
    summary: >-
      MAD2L1 co-immunoprecipitates with CDC27 because the mitotic checkpoint complex (BUBR1-BUB3-CDC20-MAD2)
      binds APC/C-CDC20 and CDC27 antibodies are the standard handle for purifying the APC/C. The study
      concerns USP44 stabilising MAD2-CDC20 complexes.
    action: REMOVE
    reason: >-
      Bare protein binding is uninformative and, for MAD2L1, does not describe a CDC27 function: MCC engagement
      of the APC/C is mediated through CDC20 and the APC6/APC8 TPR subunits, and depleting APC3 has no
      effect on MCC binding to the APC/C (PMID:21926987). CDC27's own role in this biology is captured
      by the APC/C membership and metaphase/anaphase transition annotations. Removal does not dispute
      the co-purification.
    additional_reference_ids:
    - PMID:21926987
    supported_by:
    - reference_id: PMID:17443180
      supporting_text: >-
        USP44 deubiquitinates the APC coactivator Cdc20 both in vitro and in vivo, and thereby directly
        counteracts the APC-driven disassembly of Mad2-Cdc20 complexes
    - reference_id: PMID:21926987
      supporting_text: >-
        Depleting APC3 had no effect, whereas depleting APC6 and APC8 strongly reduced MCC binding to
        the APC/C
