      Reactome places this APC/C-CDH1 reaction (coactivator loading/turnover, geminin, SKP2, EHMT1/2 and
      cyclin A/CDK2-CDH1 events) in the nucleoplasm, where the interphase APC/C-CDH1 acts from anaphase
      through G1.
