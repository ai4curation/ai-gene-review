  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - AGI_LocusCode:AT2G20000
  - AGI_LocusCode:AT3G16320
  - FB:FBgn0012058
  - PANTHER:PTN000285286
  - PomBase:SPAC17C9.01c
  - SGD:S000000180
  - UniProtKB:P30260
  - UniProtKB:Q389U4
  review:
    summary: >-
      PAINT node PTN000285286 (plant, fly, yeast, trypanosome and human seeds) places APC/C membership
      at the APC3/CDC27 ortholog clade; human CDC27 in its own WITH/FROM reflects experimental grounding
      on the target. CDC27/APC3 is a core tetratricopeptide-repeat subunit of the anaphase-promoting complex/cyclosome.
      Two copies form a homodimer in the TPR lobe, whose superhelix carries the IR-tail receptor for the
      coactivators and for APC10.
    action: ACCEPT
    reason: >-
      This is the defining cellular-component annotation for CDC27: cryo-EM structures of the recombinant
      human APC/C resolve APC3 in the TPR lobe, CDC27 antibodies are the standard handle for purifying
      the complex, and depleting APC3 inactivates the APC/C (stabilising cyclin B1 and delaying mitosis).
    supported_by:
    - reference_id: PMID:26083744
      supporting_text: >-
        These structures define the architecture of all APC/C subunits, the position of the catalytic
        module
    - reference_id: PMID:27120157
      supporting_text: >-
        Nonetheless, the crucial Ile-Arg interaction of Cdc20IR with the TPR superhelix of Apc3A is conserved
        between the two coactivators
    - reference_id: PMID:21926987
      supporting_text: inactivating the APC/C by depleting APC3 stabilised Cyclin B1 and severely delayed
        mitosis
    - reference_id: file:human/CDC27/CDC27-uniprot.txt
      supporting_text: Homodimer (PubMed:27120157, PubMed:27509861).
