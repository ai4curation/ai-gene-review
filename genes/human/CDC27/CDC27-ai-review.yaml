  review:
    summary: >-
      NEK2A, an early-mitotic APC/C substrate, binds the core APC/C directly through its C-terminal Met-Arg
      (MR) dipeptide tail, independently of CDC20; the authors liken this to the IR-tail docking of CDC20,
      CDH1 and APC10 on core subunits, and CDC27 is one of the subunits recovered.
    action: REMOVE
    reason: >-
      Bare protein binding is uninformative. The biology is substrate docking on the APC/C TPR lobe, which
      is captured at the process level by anaphase-promoting complex-dependent catabolic process (GO:0031145);
      the cached abstract does not identify CDC27 as the MR-tail receptor, so no specific molecular-function
      replacement can be asserted. The interaction is not disputed.
    supported_by:
    - reference_id: PMID:16648845
      supporting_text: >-
        Most importantly, we show that Nek2A binds directly to the APC/C, also in an MR-dependent manner,
        even in the absence of the adaptor protein Cdc20.
    - reference_id: PMID:16648845
      supporting_text: >-
        As similar C-terminal dipeptide tails promote direct association of Cdc20, Cdh1 and Apc10-Doc1
        with core APC/C subunits
