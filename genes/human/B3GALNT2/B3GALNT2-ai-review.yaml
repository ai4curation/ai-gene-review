    reference_section_type: RESULTS
    full_text_unavailable: false
suggested_questions:
- question: Which endogenous N-glycan substrates carry a chemically confirmed beta-1,3 GalNAc
    linkage attributable to B3GALNT2 under unperturbed conditions?
- question: How do the extensive sequence changes of Q8NCR0-2 affect catalytic activity, localization
    and protein stability?
- question: Does the current GO release contain a reaction-specific term for EC2.4.1.313/RHEA37667,
    and should the generic acetylgalactosaminyltransferase term be refined after that ontology
    check?
- question: Which exact B3GALNT2 and TMBIM1 constructs support the HuRI interaction, and can
    the interaction be reproduced under conditions that preserve their native membrane topology?
suggested_experiments:
- description: Compare endogenous B3GALNT2 loss and matched rescue in cells or tissues using
    linkage-resolved glycopeptide analysis, distinguishing type-I LacdiNAc from type-II LacdiNAc
    and measuring both alpha-dystroglycan and intracellular N-glycan substrates.
- description: Compare Q8NCR0-1 and Q8NCR0-2 at matched expression levels for stability, subcellular
    localization and GalNAc-transfer activity on defined glycopeptide and N-glycan acceptors,
    with catalytic controls.
- description: Extend the already demonstrated POMGNT2-B3GALNT2-POMK reaction sequence with
    quantitative substrate and kinetic comparisons, rather than treating its basic reconstitution
    as an unperformed experiment.
