core_functions:
- description: Transfers GalNAc from UDP-GalNAc in a beta-1,3 linkage to the terminal GlcNAc
    of the alpha-dystroglycan O-mannosyl glycan. This enzyme-catalyzed extension forms the core
    M3 trisaccharide required for subsequent POMK-dependent mannose phosphorylation and downstream
    functional glycosylation.
  molecular_function:
    id: GO:0008376
    label: acetylgalactosaminyltransferase activity
  directly_involved_in:
