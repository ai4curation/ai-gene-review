taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: B3GALNT2 is a membrane-associated glycosyltransferase that transfers N-acetylgalactosamine
  from UDP-GalNAc to terminal beta-linked N-acetylglucosamine, forming a beta-1,3 linkage. Its
  established physiological role is the assembly of the core M3 O-mannosyl glycan of alpha-dystroglycan
  in the endoplasmic reticulum. It extends the product of POMGNT2, producing the trisaccharide
  recognized by the mannose kinase POMK and enabling later glycan elaboration required for extracellular-matrix
  binding. Cultured-cell studies also support modification of N-glycans on intracellular glycoproteins,
  although the endogenous substrate range and physiological significance remain incompletely
  resolved. Biallelic loss of B3GALNT2 function causes dystroglycanopathy with muscle and, in
  severe cases, brain and eye abnormalities.
