core_functions:
- description: >-
    Predicted axonemal dynein motor heavy chain with a role in the sperm flagellar midpiece;
    required for normal sperm motility, correct positioning of the annulus and organization
    of the mitochondrial sheath. Its specific dynein arm and mechanism are unknown.
  molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
  - id: GO:0060294
    label: cilium movement involved in cell motility
  locations:
  - id: GO:0097225
    label: sperm midpiece
  in_complex:
    id: GO:0030286
    label: dynein complex
  supported_by:
  - reference_id: PMID:41686705
    supporting_text: >-
      Dnah14 KO mice exhibited subfertility, characterized by reduced sperm motility, sperm
      mitochondrial sheath anomaly, annulus mislocalization, and midpiece bending, whereas
      ciliogenesis in non-reproductive tissues remained unaffected.
suggested_questions:
- question: >-
    Where is DNAH14 in the sperm axoneme? It is absent from the assigned inner arm heavy chains
    of human respiratory axonemes. Is it a sperm-specific substitute heavy chain in one inner
    arm species of the midpiece, or is it peri-axonemal?
- question: >-
    How does an axonemal dynein heavy chain control annulus positioning and mitochondrial
    sheath assembly? Is this a direct structural link or a consequence of altered midpiece
    mechanics during spermiogenesis?
- question: >-
    Are the neurodevelopmental phenotypes reported with DNAH14 variants (PMID:35438214, PMID:41596228)
    caused by DNAH14 loss? DNAH14 expression and function in brain are unknown, and one family
    also carried FXN expansions.
- question: >-
    The canonical human isoform (3507 aa) is much shorter than mouse Dnah14 models (~4500
    aa); is the human N-terminal stem truly absent or is the canonical sequence incomplete?
suggested_experiments:
- description: >-
    Cryo-ET with subtomogram averaging of wild-type and Dnah14 knockout mouse sperm midpiece
    axonemes to identify which densities DNAH14 contributes.
  experiment_type: cryo-electron tomography
- description: >-
    IP-MS of DNAH14 from mouse testis to identify its light and intermediate chains and test
    the family-derived binding annotations.
  experiment_type: IP-MS
