id: Q0VDD8
gene_symbol: DNAH14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DNAH14 (dynein axonemal heavy chain 14) is the least characterised member of the axonemal
  dynein heavy chain family. The canonical UniProt isoform (3507 residues) contains the dynein
  motor region (AAA+ modules, the microtubule-binding stalk and the C-terminal domain) and
  several shorter splice isoforms exist; by sequence it groups with the inner-arm dynein heavy
  chains, which generate ATP-driven minus-end-directed force between doublet microtubules.
  Its place in the axoneme is not known: cryo-EM of human respiratory axonemes assigns every
  inner dynein arm species to other heavy chains (DNAH1, DNAH2, DNAH3, DNAH6, DNAH7, DNAH10,
  DNAH12), so DNAH14 is not a stoichiometric inner arm component of airway cilia. In sperm,
  DNAH14 is detected specifically in the flagellar midpiece of human and mouse sperm. Compound
  heterozygous variants were found in two men with asthenoteratozoospermia whose sperm showed
  reduced motility, disrupted annulus positioning and mitochondrial disorganization; Dnah14
  knockout male mice are subfertile, with reduced sperm motility, mitochondrial sheath anomalies,
  annulus mislocalization and midpiece bending, while cilia in other tissues are unaffected.
  ICSI achieves fertilization, but offspring of knockout males showed reduced survival and
  growth. Compound heterozygous and homozygous DNAH14 variants have also been reported in
  a few individuals with neurodevelopmental disorders, but causality and mechanism are unresolved.
