id: Q15043
gene_symbol: SLC39A14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC39A14 (ZIP14) is a broad-specificity divalent metal-ion importer of
  the LIV-1/ZIP (SLC39) solute-carrier family. It mediates electroneutral cellular
  uptake of Zn2+, Mn2+ and Fe2+, and can also import the toxic non-essential metal
  Cd2+, transporting an electroneutral complex of the divalent cation with two bicarbonate
  anions. It is a multipass membrane protein that acts chiefly at the plasma membrane
  (localizing basolaterally in polarized enterocytes and hepatocytes, and at both
  apical and basolateral faces of brain microvascular endothelium) and also at early
  and late endosomal and lysosomal membranes. Expression is highest in liver. Physiologically,
  ZIP14 is the principal transporter maintaining systemic manganese homeostasis; in
  enterocytes it localizes basolaterally and limits net manganese absorption by basolateral
  re-uptake, and biallelic loss-of-function causes hypermanganesemia with dystonia/parkinsonism
  (HMNDYT2). It also mediates hepatic zinc uptake, non-transferrin-bound and transferrin-derived
  iron assimilation, and through zinc delivery it modulates endosomal insulin-receptor
  trafficking and hepatic glucose metabolism. A dominant variant is associated with
  hyperostosis cranialis interna (HCIN).
