suggested_questions:
- question: What structural determinants give ZIP14 its physiological preference for
    manganese in vivo, given that in vitro it transports Zn2+, Mn2+, Fe2+ and Cd2+
    while the human loss-of-function phenotype is manganese-specific?
  experts: []
- question: What is the in vivo physiological significance of ZIP14-mediated iron
    transport, given that SLC39A14 patients show hypermanganesemia without disturbed
    blood iron levels?
  experts: []
suggested_experiments:
- hypothesis: ZIP14 is dispensable for systemic iron homeostasis despite mediating
    cellular iron uptake in vitro.
  description: Measure tissue and plasma iron parameters (transferrin saturation,
    ferritin, hepatic non-heme iron, NTBI handling) in tissue-specific and whole-body
    Slc39a14 knockout mice under iron-replete, iron-overload and inflammatory conditions,
    comparing with manganese handling in the same animals.
  experiment_type: in vivo metal homeostasis phenotyping
- hypothesis: The metal selectivity of ZIP14 at the plasma membrane is set by specific
    residues in the HHHGHXHX and metalloprotease-like motifs.
  description: Perform site-directed mutagenesis of the metal-coordinating histidine/glutamate
    residues in the transmembrane metal-binding motifs and measure Mn2+, Zn2+, Fe2+
    and Cd2+ transport kinetics in a heterologous uptake assay to map selectivity
    determinants.
  experiment_type: structure-function mutagenesis / transport kinetics
knowledge_gaps:
- gap_statement: The in vivo physiological role, if any, of ZIP14-mediated ferrous
    iron transport in human iron homeostasis is undetermined.
  boundary: ZIP14 demonstrably transports Fe2+ in vitro and contributes to cellular
    NTBI and transferrin-iron assimilation in hepatocyte models, and it is the principal
    physiological manganese transporter in vivo (loss causes hypermanganesemia). What
    is unresolved is whether iron transport by ZIP14 has a non-redundant physiological
    function, since patients with biallelic loss-of-function show manganese overload
    without a reported disturbance of blood iron.
  gap_kind:
  - BIOLOGY
  significance: Resolving this would clarify whether ZIP14 is a genuine in vivo iron
    transporter or whether iron (and cadmium) uptake is opportunistic polyspecificity
    of a transporter whose essential role is manganese, informing models of divalent-metal
    handling and iron-overload disorders.
