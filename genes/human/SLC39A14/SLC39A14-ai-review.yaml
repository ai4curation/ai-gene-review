core_functions:
- description: Manganese ion import across the plasma membrane. ZIP14 is the principal
    transporter maintaining systemic manganese homeostasis; it imports Mn2+ (as an
    electroneutral Mn2+/2 bicarbonate symport) at the basolateral membrane of enterocytes
    and hepatocytes and at the blood-brain barrier, and biallelic loss causes hypermanganesemia
    with dystonia/parkinsonism.
