      turnover by the L311V C4 variant. Retain the pharmacological metabolic capacity without
      making it the predominant endogenous role.
    supported_by:
    - reference_id: PMID:20837989
      supporting_text: "ns-SNPs in human AKR1C3, AKR1C4, and AKR7A2 significantly decrease the\
        \ in \nvitro metabolism of DOX and DAUN"
- term:
    id: GO:0071395
    label: cellular response to jasmonic acid stimulus
  evidence_type: IDA
  original_reference_id: PMID:19487289
  qualifier: involved_in
  review:
    summary: Jasmonic acid inhibits recombinant AKR1C4, but the C4-specific cellular-response
      interpretation is unresolved.
    action: UNDECIDED
    reason: Full PMID:19487289 shows inhibition of purified C4 in a quinone-reduction assay; the
      downstream cellular PGD2 experiments focus on C3. GO:0071395 is a cellular response term
      and does not require an endogenous plant signaling pathway. Biochemical inhibition alone
      does not settle whether C4 executes part of a cellular response, but neither human taxonomy
      nor steroid specialization proves the term wrong. Preserve uncertainty about the curated
      cellular interpretation.
- term:
    id: GO:0001758
    label: retinal dehydrogenase (NAD+) activity
  evidence_type: IDA
  original_reference_id: PMID:21851338
  qualifier: enables
  review:
    summary: The source demonstrates NADPH-dependent retinal reduction to retinol, not NAD+-dependent
      retinal oxidation to retinoate.
    action: MODIFY
    reason: Full PMID:21851338 uses purified C4, defined retinoid standards and HPLC to identify
      retinol formation from all-trans-retinaldehyde with NADPH. Live GO:0001758 describes retinal-to-retinoate
      oxidation; it is not the reverse of the demonstrated reaction. GO:0052650 captures all-trans-retinol/retinal
      interconversion with NADP(H), including the measured reductive direction. This is a secondary
      retinoid capability; the replacement does not assert efficient oxidative turnover in the
      tested assay.
    proposed_replacement_terms:
    - id: GO:0052650
      label: all-trans-retinol dehydrogenase (NADP+) activity
    supported_by:
    - reference_id: PMID:21851338
      supporting_text: retinaldehyde reductase activity with low Km values
- term:
    id: GO:0016655
    label: oxidoreductase activity, acting on NAD(P)H, quinone or similar compound as acceptor
  evidence_type: IDA
  original_reference_id: PMID:20837989
  qualifier: enables
  review:
    summary: AKR1C4 can reduce quinone substrates with NADPH.
    action: KEEP_AS_NON_CORE
    reason: In addition to the anthracycline experiments in the original source PMID:20837989,
      full PMID:19487289 and PMID:20003443 directly assay recombinant C4 reduction of 9,10-phenanthrenequinone.
      This independently fits the NAD(P)H-donor/quinone-acceptor reaction class. The former exclusion
      assumed an overly narrow interpretation of anthracycline chemistry and overlooked the direct
      quinone assay. Retain this secondary substrate capability.
    supported_by:
    - reference_id: PMID:20003443
      supporting_text: All purified proteins were able to reduce the pan-substrate 9, 10-phenanthrenequinone
- term:
    id: GO:0047023
    label: androsterone dehydrogenase [NAD(P)+] activity
  evidence_type: IDA
  original_reference_id: PMID:21851338
  qualifier: enables
  review:
    summary: Direct assay support for androsterone dehydrogenase activity for AKR1C4. Genuine
      specific instance of the core 3-alpha-hydroxysteroid dehydrogenase function; kept as non-core.
    action: ACCEPT
    reason: Androsterone/3-alpha-androstanediol interconversion is part of the established 3-alpha-hydroxysteroid
      dehydrogenase substrate range, not a different paralog-exclusive function. Direct steroid
      assays and the inherited androsterone IBD at PTN000199031 support this catalytic component
      of AKR1C4 steroid metabolism.
    supported_by:
    - reference_id: file:human/AKR1C4/AKR1C4-uniprot.txt
      supporting_text: androsterone + NADP(+) = 5alpha-androstan-3,17-dione + NADPH +
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: TAS
  original_reference_id: PMID:8172617
  qualifier: enables
  review:
    summary: AKR1C4 catalyzes electron transfer during NADP(H)-dependent substrate reduction and
      oxidation.
    action: ACCEPT
    reason: The live GO:0009055 definition includes enzymatic redox transformations, not only
      respiratory carriers. Hydride transfer between nicotinamide cofactor and carbonyl substrates
      is integral to the documented catalytic function. The previous removal imposed an unsupported
      restriction on this broad term.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: TAS
  original_reference_id: PMID:2187532
  qualifier: located_in
  review:
    summary: TAS cytoplasm localization from the chlordecone reductase cloning paper (describes
      a cytosolic enzyme). Correct but less precise than the cytosol annotation; retained as non-core
      (the cytosol term is the core CC).
    action: ACCEPT
    reason: Cytoplasm is a true broad compartment containing the established cytosolic enzyme.
      A narrower cytosol annotation does not make the parent location non-core.
    supported_by:
    - reference_id: PMID:2187532
      supporting_text: "This reaction is \ncontrolled by a \ncytosolic enzyme, chlordecone reductase\
        \ (CDR)"
- term:
    id: GO:0008106
    label: alcohol dehydrogenase (NADP+) activity
  evidence_type: TAS
  original_reference_id: PMID:7650035
  qualifier: enables
  review:
    summary: The broad redox or metabolic annotation accurately describes AKR1C4 catalytic function.
    action: ACCEPT
    reason: AKR1C4 catalyzes carbonyl/alcohol interconversion with NADP(H) and directly performs
      steroid-hormone and bile-acid pathway steps. The broad alcohol-dehydrogenase chemistry is
      applicable to these ketosteroid/hydroxysteroid pairs; it is not restricted to ethanol. Hormone
      and monocarboxylic-acid metabolism include the corresponding steroid and bile-acid pathways,
      without requiring the immediate enzyme substrate to be the final acid. Greater specificity
      elsewhere does not make a true core parent term an over-annotation.
- term:
    id: GO:0008202
    label: steroid metabolic process
  evidence_type: TAS
  original_reference_id: PMID:8274401
  qualifier: involved_in
  review:
    summary: TAS from the cDNA cloning paper describing enzymes structurally related to 3alpha-HSD.
      Steroid metabolic process is the central, well-supported biological process for AKR1C4.
      Accepted as core.
    action: ACCEPT
    reason: The enzyme directly transforms steroid substrates, including androgens, in the cited
      characterization studies. These are catalytic contributions to the named processes rather
      than a phenotype caused only by altered expression.
    supported_by:
    - reference_id: PMID:8274401
      supporting_text: 3 alpha-hydroxysteroid dehydrogenase
- term:
    id: GO:0008209
    label: androgen metabolic process
  evidence_type: TAS
  original_reference_id: PMID:7650035
  qualifier: involved_in
  review:
    summary: 'TAS androgen metabolic process, strongly supported: AKR1C4 inactivates 5alpha-DHT
      (to 3alpha/3beta-androstanediols) and interconverts testosterone/androstenedione, functioning
      in pre-receptor androgen regulation. A core biological process (a specific and well-supported
      subset of steroid metabolism).'
    action: ACCEPT
    reason: The enzyme directly transforms steroid substrates, including androgens, in the cited
      characterization studies. These are catalytic contributions to the named processes rather
      than a phenotype caused only by altered expression.
    supported_by:
    - reference_id: PMID:7650035
      supporting_text: "interconversion between 5 alpha-dihydrotestosterone and 5 \nalpha-androstane-3\
        \ alpha,17 beta-diol"
- term:
    id: GO:0015125
    label: bile acid transmembrane transporter activity
  evidence_type: TAS
  original_reference_id: PMID:8172617
  qualifier: enables
  review:
    summary: The original bile-acid transport assertions require full-source assessment independently
      of the catalytic role.
    action: UNDECIDED
    reason: PMID:8172617 distinguishes the C9 bile-acid-binder clone from C11/DD4, but the accessible
      abstract is not sufficient to determine every transport experiment or interpretation in
      the full paper. The relevant scanned full text was not obtained. Soluble localization does
      not categorically preclude ligand transport, and the broad transport process is not equivalent
      to intrinsic transmembrane-transporter activity. Withdraw the categorical misattribution/cannot-transport
      claim and leave each assertion unresolved pending source adjudication.
- term:
    id: GO:0015721
    label: bile acid and bile salt transport
  evidence_type: TAS
  original_reference_id: PMID:8172617
  qualifier: involved_in
  review:
    summary: The original bile-acid transport assertions require full-source assessment independently
      of the catalytic role.
    action: UNDECIDED
    reason: PMID:8172617 distinguishes the C9 bile-acid-binder clone from C11/DD4, but the accessible
      abstract is not sufficient to determine every transport experiment or interpretation in
      the full paper. The relevant scanned full text was not obtained. Soluble localization does
