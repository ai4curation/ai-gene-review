- id: PMID:7650035
  title: Substrate specificity, gene structure, and tissue-specific distribution of multiple
    human 3 alpha-hydroxysteroid dehydrogenases.
  findings:
  - statement: The expressed liver type 1 3alpha-HSD (AKR1C4) interconverts 5alpha-dihydrotestosterone
      and 5alpha-androstane-3alpha,17beta-diol and its mRNA is found only in the liver.
    reference_section_type: ABSTRACT
    supporting_text: "interconversion between 5 alpha-dihydrotestosterone and 5 \nalpha-androstane-3\
      \ alpha,17 beta-diol"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; establishes AKR1C4 (type 1 3alpha-HSD) DHT/3alpha-diol interconversion
      and liver-restricted expression.
- id: PMID:8172617
  title: Molecular cloning of two human liver 3 alpha-hydroxysteroid/dihydrodiol dehydrogenase
    isoenzymes that are identical with chlordecone reductase and bile-acid binder.
  findings:
  - statement: DD4 (= AKR1C4) is a human liver 3alpha-hydroxysteroid/dihydrodiol dehydrogenase
      whose cDNA is virtually identical with human chlordecone reductase; the related DD2 corresponds
      to the "bile-acid binder".
    reference_section_type: ABSTRACT
    supporting_text: "virtually identical with those of human bile-acid \nbinder and human chlordecone\
      \ reductase cDNAs"
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Accessible abstract distinguishes C9 bile-acid binder from C11/DD4. Relevant
      full scanned text unavailable; do not infer all transport evidence or declare misattribution
      from the abstract.
