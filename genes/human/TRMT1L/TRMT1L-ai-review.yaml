id: Q7Z2T5
gene_symbol: TRMT1L
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TRMT1L is the vertebrate paralog of TRMT1 that localizes predominantly to the
  nucleolus and nucleus and specifically dimethylates guanine-27 of tRNA(Tyr).
  The resulting m2,2G27 modification supports efficient translation of tyrosine
  codons and oxidative-stress survival, and TRMT1L also helps maintain acp3U in
  the D-loop of several cytoplasmic tRNAs through a separable mechanism.
