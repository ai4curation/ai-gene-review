  original_reference_id: PMID:39786990
  qualifier: involved_in
  review:
    summary: tRNA sequencing resolved TRMT1L as the G27 dimethyltransferase for
      tyrosine tRNAs.
    action: ACCEPT
    reason: >-
      Zhang et al. distinguished the paralogs: TRMT1 acts on G26-containing tRNAs,
      whereas TRMT1L installs the N2,N2-dimethylguanosine mark at G27 of tyrosine
      tRNAs. This is a core N2-guanine methylation process.
    supported_by:
    - reference_id: PMID:39786990
      supporting_text: TRMT1L represents the elusive enzyme catalyzing m2,2G at position
        27 in tyrosine tRNAs
