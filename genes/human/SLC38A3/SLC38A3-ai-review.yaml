proposed_new_terms: []
suggested_questions:
- question: Is the SNAT3 transport cycle best described as electroneutral (1 Na+:1 amino acid:1 H+ antiport,
    Chaudhry et al.) or electrogenic (2 Na+:1 amino acid, Fei et al.), and under what conditions does
    the amino-acid-gated H+ conductance contribute?
- question: Which specific residues (e.g. the position-77 site modulating glutamine-induced conductance
    and Na+ binding) determine substrate selectivity and the directionality switch between glutamine import
    and efflux?
suggested_experiments:
- description: Electrophysiological reconstitution of purified human SNAT3 in defined-lipid proteoliposomes
    with controlled Na+/H+/substrate gradients to resolve the stoichiometry and separate coupled transport
    from the uncoupled H+ conductance.
- description: Cell-type-specific conditional knockout / rescue of Slc38a3 in astrocytes vs hepatocytes
    vs proximal tubule to dissect its roles in the glutamine/glutamate-GABA cycle, hepatic ammonia handling
    and renal ammoniagenesis.
- description: Functional characterization of the DEE102 patient variants (e.g. R208G, A296T, T375P, P387Q,
    C-terminal truncations) in a transport assay to establish genotype-function relationships.
