- term:
    id: GO:0005295
    label: neutral L-amino acid:sodium symporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9JHZ9
  - ensembl:ENSRNOP00000023623
  review:
    summary: Neutral L-amino acid:sodium symporter activity propagated from rat ortholog; captures the
      Na+:amino-acid coupling but omits the defining H+ antiport of System N.
    action: MODIFY
    reason: 'SNAT3 is a System N transporter: amino-acid/Na+ cotransport is obligatorily coupled to H+
      antiport (electroneutral, 1 Na+ in : 1 H+ out), distinguishing it from the System A symporters (SLC38A1/2/4)
      for which a pure neutral-amino-acid:Na+ symporter term is appropriate. The mechanism-complete terms
      GO:0140830/0140831/0140832 (already annotated to this gene) better represent the activity. Lateral
      mechanistic correction, not a sign change.'
    proposed_replacement_terms:
    - id: GO:0140830
      label: L-glutamine, sodium:proton antiporter activity
    supported_by:
    - reference_id: PMID:10823827
      supporting_text: These data suggest that SN1 mediates the influx of two Na(+) and one amino acid
        substrate per transport cycle coupled to the efflux of one H(+), rendering the transport process
        electrogenic.
    - reference_id: file:human/SLC38A3/SLC38A3-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: The transport is electroneutral coupled to the cotransport of 1 Na(+) and the antiport
        of 1 H(+)
