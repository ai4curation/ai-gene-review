id: Q99624
gene_symbol: SLC38A3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SLC38A3 (SNAT3/SN1) is a sodium-coupled neutral amino acid transporter of the SLC38 family
  that mediates System N amino acid transport. It is a multi-pass plasma-membrane protein that transports
  the neutral amino acids L-glutamine (its principal substrate), L-histidine and L-asparagine, with lower
  efficiency for L-alanine. Transport couples cotransport of Na+ with the amino acid to antiport of a
  proton in the opposite direction, giving an electroneutral 1 Na+ : 1 amino acid : 1 H+ exchange; it
  is pH-dependent, Li+-tolerant and bidirectional, moving substrate into or out of the cell according
  to the prevailing ion and substrate gradients. This distinguishes System N (SLC38A3/A5) from the electrogenic
  Na+-cotransport System A transporters (SLC38A1/A2/A4). SNAT3 is central to the glutamine/glutamate-GABA
  cycle: in brain it exports glutamine from astrocytes for reuptake by neurons to replenish glutamate
  and GABA, and it is the major glutamine influx transporter in retinal ganglion cells. It is highly expressed
  in liver and kidney, where its basolateral localization in perivenous hepatocytes and S3 proximal-tubule
  cells supports hepatic and renal glutamine and ammonia handling and pH/nitrogen homeostasis, and it
  localizes to the CSF-facing membrane of choroid plexus epithelium and to blood-brain-barrier capillaries.
  Biallelic loss-of-function variants in SLC38A3 cause developmental and epileptic encephalopathy (DEE102).'
