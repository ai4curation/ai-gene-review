id: P62879
gene_symbol: GNB2
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNB2 encodes Gβ2, whose canonical product has a seven-bladed WD40 beta-propeller architecture.
  With a Gγ partner it forms the mature Gβγ signaling unit, which associates with inactive GDP-bound Gα
  in resting heterotrimers. Receptor activation promotes nucleotide exchange on Gα and allows Gβγ to regulate
  downstream effectors. Gβ2/γ2 regulates cardiac GIRK potassium channels. CCT and PDCL assist Gβ folding
  and assembly in the cytosol. A GNB2 variant causes familial cardiac conduction dysfunction. Recurrent
  de novo variants also cause syndromic developmental delay and intellectual disability.
