  review:
    summary: Mitochondrion (HTP).
    action: ACCEPT
    reason: QRSL1 is a nuclear-encoded mitochondrial protein; GatCAB charges the mitochondrially encoded
      tRNA(Gln) in mitochondria. Localization is supported by the human GatCAB characterisation, the mitochondrial
