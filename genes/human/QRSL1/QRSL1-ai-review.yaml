id: Q9H0R6
gene_symbol: QRSL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'QRSL1 (glutaminyl-tRNA amidotransferase subunit QRSL1, mitochondrial) is the human GatA
  subunit of the heterotrimeric mitochondrial glutamyl-tRNA(Gln) amidotransferase GatCAB, formed with
  GATB and GATC. Mammalian mitochondria lack a glutaminyl-tRNA synthetase: EARS2 misacylates tRNA(Gln)
  with glutamate, and GatCAB transamidates Glu-tRNA(Gln) to Gln-tRNA(Gln) using glutamine and ATP. QRSL1
  belongs to the amidase-signature family and, with a Ser-cisSer-Lys catalytic triad, hydrolyses glutamine
  and channels the ammonia to GATB, which activates and amidates the tRNA-bound glutamate. The complex
  is the only mitochondrial route to Gln-tRNA(Gln) and is required for mitochondrial protein synthesis.
  Biallelic QRSL1 variants cause combined oxidative phosphorylation deficiency 40 (COXPD40), a lethal
  infantile disorder with hypertrophic cardiomyopathy, lactic acidosis and multiple respiratory chain
  defects.'
