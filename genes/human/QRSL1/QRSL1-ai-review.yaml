suggested_questions:
- question: Does human QRSL1 hydrolyse glutamine only when GatCAB is bound to Glu-tRNA(Gln), as in bacterial
    GatCAB, so that the glutaminase activity is strictly coupled to transamidation?
- question: Why do QRSL1-deficient fibroblasts show near-normal tRNA(Gln) charging in high glutamine while
    heart is severely affected; is local glutamine availability in cardiomyocytes limiting for a partially
    active GatCAB?
suggested_experiments:
- description: Measure glutaminase and transamidation kinetics of purified recombinant human GatCAB carrying
    QRSL1 patient variants (for example Gly133 and Thr196 region substitutions) with and without Glu-tRNA(Gln),
    to test coupling and define the residual activity of each allele.
