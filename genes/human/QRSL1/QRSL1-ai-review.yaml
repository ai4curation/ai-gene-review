- term:
    id: GO:0006412
    label: translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004412
  review:
    summary: Translation from InterPro2GO mapping of the GatA family (IPR004412).
    action: MODIFY
    reason: Human QRSL1 acts only in mitochondria, so the generic translation term is refined to its
      descendant mitochondrial translation, which the gene already carries (IBA, IEA, IMP). As for those
      rows, the refined term is non-core context; GatCAB prepares the Gln-tRNA(Gln) that mitochondrial
      translation consumes and does not perform a translation step itself; the core process is GO:0019988
      charged-tRNA amino acid modification.
    proposed_replacement_terms:
    - id: GO:0032543
      label: mitochondrial translation
    supported_by:
    - reference_id: PMID:30283131
      supporting_text: Pulse labeling of mitochondrial proteins with [35S]-methionine in the presence
        of emetine, a cytoplasmic protein synthesis inhibitor, revealed a strong and generalized mtDNA-encoded
        protein synthesis defect after a 90-min pulse in P4B (GATC) and in P3A (QRSL1) patients’ fibroblasts
    - reference_id: PMID:30283131
      supporting_text: Therefore, mitochondria are exclusively dependent on the GatCAB complex for appropriate
        charging of mt-tRNAGln with glutamine.
