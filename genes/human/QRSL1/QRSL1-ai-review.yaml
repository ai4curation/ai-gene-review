core_functions:
- description: Glutaminase (A) subunit of the mitochondrial GatCAB glutamyl-tRNA(Gln) amidotransferase;
    hydrolyses glutamine and channels ammonia to GATB so that the complex transamidates misacylated Glu-tRNA(Gln)
    to Gln-tRNA(Gln), the only mitochondrial source of correctly charged glutaminyl-tRNA for mitochondrial
    protein synthesis.
