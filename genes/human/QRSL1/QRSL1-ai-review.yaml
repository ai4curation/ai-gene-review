- term:
    id: GO:0003824
    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000120
  review:
    summary: Catalytic activity from InterPro2GO mapping of the amidase signature domain (IPR000120).
    action: MODIFY
    reason: True but uninformative. QRSL1 carries the amidase-signature catalytic triad (Lys76, Ser171,
      Ser195 acyl-ester intermediate) and, as GatA, hydrolyses the amide donor glutamine within GatCAB.
      The specific activity of this subunit is glutaminase activity; the overall amidotransferase activity
      of the complex is captured by the contributes_to GO:0050567 annotations.
    proposed_replacement_terms:
    - id: GO:0004359
      label: glutaminase activity
    supported_by:
    - reference_id: file:human/QRSL1/QRSL1-uniprot.txt
      record_section: ["FT:ACT_SITE"]
      supporting_text: /note="Acyl-ester intermediate"
    - reference_id: file:human/QRSL1/QRSL1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: This subunit probably catalyzes the hydrolysis of the amido donor Gln, releasing
        ammonia that is sequestered within a channel in the GatCAB complex and made available to subunit
        B for downstream aminolysis of Glu-tRNA(Gln)
    - reference_id: PMID:26741492
      supporting_text: QRSL1 (hGatA) is a glutaminase that produces ammonia, which is then transferred
        to misacylated Glu-charged tRNAGln to synthesize Gln-tRNAGln, which interacts with PET112L (hGatB)
        and GATC (hGatC) to form a trimeric enzyme hGatCAB[23].
- term:
    id: GO:0004359
    label: glutaminase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:15889
  - EC:3.5.1.2
  - UniRule:UR000185079
  review:
    summary: Glutaminase activity from the HAMAP rule / EC 3.5.1.2 mapping.
    action: KEEP_AS_NON_CORE
    reason: QRSL1 catalyses the glutamine-hydrolysis half-reaction of GatCAB, so the term is not wrong.
      But the ammonia is sequestered in a channel and used by GATB to amidate Glu-tRNA(Gln), not released
      as a product; the physiologically meaningful activity is the complex-level glutaminyl-tRNA synthase
      (glutamine-hydrolyzing) activity. Kept as a non-core partial activity.
    supported_by:
    - reference_id: file:human/QRSL1/QRSL1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: This subunit probably catalyzes the hydrolysis of the amido donor Gln, releasing
        ammonia that is sequestered within a channel in the GatCAB complex and made available to subunit
        B for downstream aminolysis of Glu-tRNA(Gln)
    - reference_id: PMID:26741492
      supporting_text: QRSL1 (hGatA) is a glutaminase that produces ammonia, which is then transferred
        to misacylated Glu-charged tRNAGln to synthesize Gln-tRNAGln, which interacts with PET112L (hGatB)
        and GATC (hGatC) to form a trimeric enzyme hGatCAB[23].
    - reference_id: PMID:30283131
      supporting_text: In the bacterial GatCAB complex, GatA and GatB possess the catalytic amidase and
        kinase functions, respectively, while GatC serves as a stabilizing linker between them16.
