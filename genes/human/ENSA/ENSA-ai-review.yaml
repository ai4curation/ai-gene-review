  title: ARPP-16 Is a Striatal-Enriched Inhibitor of Protein Phosphatase 2A Regulated by
    Microtubule-Associated Serine/Threonine Kinase 3 (Mast 3 Kinase).
  findings:
  - statement: There is no evidence that ENSA is extracellular; the family's function appears limited
