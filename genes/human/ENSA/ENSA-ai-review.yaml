- id: PMID:21044950
  title: Genome-wide YFP fluorescence complementation screen identifies new regulators
    for telomere signaling in human cells.
  findings:
  - statement: Genome-wide BiFC screen of ~12,000 proteins against six telomeric baits; the authors
      caution that hits require secondary validation.
    supporting_text: Although PCA/BiFC does appear to be more tolerant of differences in expression,
      high expression levels of bait and prey may still result in false positives. Therefore,
      secondary screens are needed to validate the identified interactions.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified; full text cached. ENSA is not mentioned in the main text (the hit
      must be in the supplementary tables), so the ACD/TPP1 interaction is an unvalidated screen
      result with no bearing on ENSA function.
- id: PMID:9653196
  title: 'Human alpha-endosulfine, a possible regulator of sulfonylurea-sensitive
    KATP channel: molecular cloning, expression and biological properties.'
  findings:
  - statement: Recombinant human alpha-endosulfine displaces glibenclamide from beta-cell membranes,
      inhibits cloned Kir6.2/SUR1 K-ATP currents and stimulates insulin release from MIN6 cells.
    supporting_text: The recombinant protein displaces binding of the sulfonylurea [3H]glibenclamide
      to beta cell membranes, inhibits cloned KATP channel currents, and stimulates insulin
      secretion.
  - statement: The channel effect was selective for Kir6.2/SUR1 over Kir1.1 but the interacting
      subunit could not be identified.
    supporting_text: We therefore cannot exclude the alternative possibility that α-endosulfine
      binds to Kir6.2 and thereby displaces glibenclamide binding to SUR1.
  - statement: ENSA lacks a signal peptide and is predicted to be intracellular, yet blocked currents
      from either side of the membrane.
    supporting_text: On the other hand, we observed that α-endosulfine blocked K ATP currents when
      applied both intracellularly and extracellularly, and it stimulated insulin secretion when
      added to the extracellular solution.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; full text cached. The cloning paper for human ENSA. Its
      channel/insulin data are direct assays with recombinant protein but predate the discovery of
      the PP2A-B55 mechanism, use micromolar concentrations, and have not been mechanistically
      confirmed; they support historical, non-core annotations only.
- id: Reactome:R-HSA-2430535
  title: MASTL phosphorylates ENSA
  findings:
  - statement: MASTL phosphorylates ENSA on Ser67, activating it as a PP2A-B55 inhibitor.
    supporting_text: MASTL (GWL) activates ENSA by phosphorylating it on serine residue S67 (Mochida
      et al. 2010, Gharbi-Ayachi et al. 2010).
- id: PMID:21164013
  title: Greatwall phosphorylates an inhibitor of protein phosphatase 2A that is essential for mitosis.
  findings:
  - statement: Greatwall-phosphorylated Ensa is the mitotic PP2A-B55δ inhibitor in Xenopus egg extracts.
    supporting_text: We report that inhibition of PP2A-B55δ results from a small protein, known as
      α-endosulfine (Ensa), that is phosphorylated in mitosis by the protein kinase Greatwall (Gwl).
      This converts Ensa into a potent and specific inhibitor of PP2A-B55δ.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only cache. Source of the Xenopus Ensa annotations
      transferred by ISS; establishes the defining mechanism of the family.
- id: PMID:21164014
  title: "The substrate of Greatwall kinase, Arpp19, controls mitosis by inhibiting protein phosphatase 2A."
  findings:
  - statement: Both Arpp19 and α-endosulfine are Gwl substrates that inhibit PP2A when phosphorylated,
      but Arpp19 is the limiting inhibitor at mitotic entry in Xenopus egg extracts.
    supporting_text: Although both proteins can inhibit PP2A, endogenous Arpp19, but not
      α-Endosulfine, is responsible for PP2A inhibition at mitotic entry in Xenopus egg extracts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only cache. Companion paper to PMID:21164013; important
      for the paralog caveat.
- id: PMID:24120663
  title: The BEG (PP2A-B55/ENSA/Greatwall) pathway ensures cytokinesis follows chromosome separation.
  findings:
  - statement: In HeLa cells ENSA, not ARPP19, is the major MASTL substrate.
    supporting_text: Given that ARPP19 was not detected (Figure S3E) and that ARPP19 siRNA had
      little effect (Figure 4B), ENSA is the major target of Greatwall/MASTL in these cells.
  - statement: PP2A-B55 is the phosphatase that dephosphorylates ENSA Ser67 in human cell extracts.
    supporting_text: Furthermore, the removal of the PP2A regulatory subunits PPP2R2A–PPP2R2D
      stabilized both PRC1 pT481 and ENSA phosphorylation (Figure 4B), indicating that PP2A-B55 is
      the ENSA phosphatase in this system.
  - statement: The ENSA/Greatwall timer delays PP2A-B55 reactivation and PRC1 dephosphorylation so
      that cytokinesis follows chromosome separation.
    supporting_text: Removal of the ENSA/Greatwall (EG) timer module eliminates this second
      threshold, as well as associated delay in PRC1 dephosphorylation and initiation of
      cytokinesis, by uncoupling PP2A-B55 from Cdk1-cyclin B activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; full text cached. The key human-cell paper for ENSA's mitotic
      function and for the paralog question.
- id: PMID:24618897
  title: Greatwall-phosphorylated Endosulfine is both an inhibitor and a substrate of PP2A-B55 heterotrimers.
  findings:
  - statement: Phospho-endosulfine inhibits PP2A-B55 by unfair competition - it binds far more
      avidly and is dephosphorylated far more slowly than other substrates.
    supporting_text: As the name suggests, during M phase PP2A-B55's attention is diverted to
      pEndos, which binds much more avidly and is dephosphorylated more slowly than other
      substrates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; full text cached. Mechanistic basis of the inhibitor activity
      (Drosophila and human proteins).
- id: PMID:28785014
  title: Ensa controls S-phase length by modulating Treslin levels.
  findings:
  - statement: ENSA knockdown in human cells extends S phase and lowers Treslin levels; Treslin
      overexpression rescues.
    supporting_text: Unexpectedly, Ensa knockdown promotes a dramatic extension of S phase
      associated with a lowered density of replication forks. Notably, Ensa depletion results in a
      decrease of Treslin levels, a pivotal protein for the firing of replication origins.
  - statement: Nuclear localisation of ENSA increases in S phase.
    supporting_text: In contrast, nuclear localisation of Ensa was significantly increased in
      S-phase cells suggesting that Ensa is relocalised into the nucleus during DNA replication.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; full text cached. Only study of ENSA's S-phase role in human
      cells; supports the nucleoplasm annotation and the broad mitotic cell cycle term.
- id: PMID:32085646
  title: The Cell Cycle Checkpoint System MAST(L)-ENSA/ARPP19-PP2A is Targeted by cAMP/PKA and cGMP/PKG
    in Anucleate Human Platelets.
  findings:
  - statement: ENSA is present and phosphorylated in anucleate human platelets; only the
      MASTL-site-phosphorylated form inhibits PP2A.
    supporting_text: Our data also established that both MASTL- and PKA/PKG-phosphorylated
      ENSA/ARPP19 are PP2A substrates, whereas only MASTL-phosphorylated ENSA/ARPP19 are PP2A
      inhibitors.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; full text cached. Shows the module outside dividing cells and
      separates the Ser67 and Ser109 sites functionally.
- id: PMID:34346186
  title: Interaction mechanism of endogenous PP2A inhibitor protein ENSA with PP2A.
  findings:
  - statement: Human ENSA is intrinsically disordered with three transient helices and binds PP2A
      mainly via the A subunit in vitro.
    supporting_text: ENSA was observed to interact PP2A mainly via A-subunit, as the affinity with
      the A-subunit is significantly stronger than with any of the B56 subunits.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only cache. Structural characterisation of the human
      protein; note that B55 subunits were not among the B subunits tested.
- id: PMID:24354984
  title: Regulation of α-endosulfine, an inhibitor of protein phosphatase 2A, by multisite phosphorylation.
  findings:
  - statement: The conserved Ser67-containing middle region of ENSA binds PP2A-B55 at the B55/C
      subunit interface over the catalytic centre.
    supporting_text: Structural analyses revealed that the most-conserved middle region of ENSA
      containing S67 physically interacts with PP2A-B55 at the interface of the B55 and C
      subunits, where the catalytic centre of PP2A is located.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract-only cache. Xenopus ENSA; defines the binding interface
      and the modulatory Thr28/Ser109 sites.
