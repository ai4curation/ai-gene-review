- term:
    id: GO:0050796
    label: regulation of insulin secretion
  evidence_type: IDA
  original_reference_id: PMID:9653196
  qualifier: acts_upstream_of_or_within
  review:
    summary: Recombinant alpha-endosulfine added to the extracellular medium of MIN6 insulinoma cells
      at non-stimulatory glucose caused a dose-dependent increase in insulin release, interpreted as
      a consequence of K-ATP channel closure.
    action: MARK_AS_OVER_ANNOTATED
    reason: The observation is real, but a physiological role for ENSA in regulating insulin
      secretion has not been established. The effect was obtained by adding micromolar recombinant
      protein to the outside of a cell line, whereas ENSA is an intracellular protein with no signal
      peptide and no evidence of secretion; the authors themselves noted that either membrane
      crossing or an unidentified second site would be needed to explain it. No loss-of-function
      evidence (Ensa-deficient mice exist) has connected endogenous ENSA to insulin secretion in the
      intervening decades, and the field now treats the sulfonylurea-receptor ligand role as
      historical. The annotation therefore over-states a pharmacological observation as a process
      role of the gene.
    supported_by:
