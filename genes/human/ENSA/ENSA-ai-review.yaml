id: O43768
gene_symbol: ENSA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ENSA (alpha-endosulfine) is a small (121 residue), intrinsically disordered phosphoprotein of
  the endosulfine family, the paralog of ARPP19. Its defining activity is phosphorylation-gated
  inhibition of the PP2A-B55 serine/threonine phosphatase: when Greatwall kinase (MASTL)
  phosphorylates Ser67 in the conserved central region, phospho-ENSA binds the B55/catalytic
  interface of PP2A-B55 with very high affinity and is dephosphorylated only slowly, so that it
  occupies the enzyme and excludes its normal substrates ("inhibition by unfair competition").
  This allows cyclin B-CDK1-driven phosphorylations to accumulate and persist at mitotic entry and
  through mitosis; as MASTL is inactivated at anaphase, phospho-ENSA is turned over (by PP2A-B55
  itself and by Fcp1) and PP2A-B55 reactivation lets substrates such as PRC1 be dephosphorylated
  in an ordered way that couples cytokinesis to chromosome separation. In human cells ENSA is the
  predominant MASTL substrate in several lines, and it also acts in S phase, where nuclear
  phospho-ENSA restrains PP2A-mediated dephosphorylation and proteasomal turnover of the origin
  firing factor Treslin so that replication origins fire at a normal rate. A second, C-terminal
  site (Ser109) is phosphorylated by PKA/PKG and tunes but does not by itself confer PP2A
  inhibition. The protein is cytoplasmic and nuclear (nuclear accumulation increases in S phase),
  widely expressed with high levels in brain and skeletal muscle, and present in anucleate
  platelets. Historically, recombinant alpha-endosulfine was characterised as an endogenous
  sulfonylurea-like ligand that displaces glibenclamide from beta-cell membranes, inhibits
  Kir6.2/SUR1 K-ATP channel currents at micromolar concentrations and stimulates insulin release
  from a beta-cell line; a related ENSA-K-ATP-neprilysin axis has been described in mouse brain,
  but the physiological basis of these channel effects remains unresolved.
