- id: PMID:34737456
  title: 'Somatostatin-evoked Aβ catabolism in the brain: Mechanistic involvement of
    α-endosulfine-K(ATP) channel pathway.'
  findings:
  - statement: In mouse brain ENSA acts downstream of somatostatin as a negative regulator of
      neprilysin via a SUR1/Kir6.2 K-ATP channel.
    supporting_text: Here, we identified α-endosulfine (ENSA), an endogenous ligand of the
      ATP-sensitive potassium (KATP) channel, as a negative regulator of NEP downstream of SST
      signaling.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified; full text cached. Mouse work that keeps the K-ATP channel
      connection alive but does not demonstrate direct channel binding; not used for any human
      annotation decision beyond the non-core grading of GO:0019870.
- id: file:human/ENSA/ENSA-deep-research-falcon.md
  title: Deep research report for ENSA (human), Falcon provider
  findings:
  - statement: Summarises the phospho-ENSA/PP2A-B55 unfair-substrate mechanism and grades the K-ATP
      channel literature as provisional.
    supporting_text: Phosphorylated ENSA then binds PP2A-B55 as a high-affinity inhibitory
      substrate. Its phosphoserine occupies the phosphatase catalytic machinery, but
      dephosphorylation is unusually slow relative to ordinary substrates.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: LLM-generated literature synthesis; its key claims were checked against the primary
      papers cited in this review (Williams 2014, Cundell 2013, Charrasse 2017, Kumm 2020) and are
      consistent with them. Used only as corroboration, never as sole support.
