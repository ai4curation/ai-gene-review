proposed_new_terms: []
suggested_questions:
- question: In human somatic cells, which of ENSA and ARPP19 is the physiologically limiting PP2A-B55
    inhibitor at mitotic entry, and does this vary by cell type? HeLa data point to ENSA, Xenopus
    extract and mouse fibroblast data point to ARPP19, and most studies deplete both together.
  experts:
  - Francis A. Barr
  - Anna Castro
  - Thierry Lorca
- question: Is the S-phase function of ENSA (stabilisation of Treslin against PP2A-mediated
    dephosphorylation) a candidate for a regulation-of-DNA-replication annotation, and is it exerted
    through PP2A-B55 or a different PP2A holoenzyme? The mechanism is a single human study and no
    replication-related term is currently annotated.
  experts:
  - Anna Castro
  - Thierry Lorca
- question: Does ENSA bind directly to any K-ATP channel subunit (SUR1 or Kir6.2), and by what route
    would an intracellular protein without a signal peptide reach an extracellular or channel site
    in vivo? The 1998 channel and insulin data and the 2022 mouse neprilysin axis both presuppose a
    channel interaction that has never been shown biochemically.
  experts:
  - Frances M. Ashcroft
  - Takaomi C. Saido
suggested_experiments:
- hypothesis: ENSA and ARPP19 are partially redundant PP2A-B55 inhibitors whose relative importance
    for mitotic entry and for S-phase length differs between human cell types.
  description: Generate single and double CRISPR knockouts (or acute degron alleles) of ENSA and
    ARPP19 in several non-transformed and transformed human lines; measure G2/M entry timing, S-phase
    length, Treslin levels and PP2A-B55 substrate (PRC1 pT481) dephosphorylation kinetics, with
    rescue by Ser67 phospho-mimetic ENSA.
  experiment_type: genome editing / live-cell imaging
- hypothesis: Endogenous ENSA does not regulate insulin secretion through K-ATP channels in beta cells.
  description: Beta-cell-specific Ensa knockout mice and ENSA-null human stem-cell-derived beta cells
    assayed for K-ATP current density, glibenclamide sensitivity and glucose-stimulated insulin
    secretion; complement with proximity labelling or cross-linking to test for a physical
    ENSA-SUR1/Kir6.2 interaction in intact cells.
  experiment_type: mouse genetics / electrophysiology
