core_functions:
- description: Greatwall (MASTL)-phosphorylated inhibitor of the PP2A-B55 phosphatase. Once Ser67 is
    phosphorylated, ENSA binds the B55/catalytic-subunit interface of PP2A-B55 with very high
    affinity and is dephosphorylated only slowly, so it out-competes CDK1 substrates for the
    enzyme; this lets mitotic phosphorylation accumulate at the G2/M transition and persist until
    MASTL inactivation and phospho-ENSA turnover reactivate PP2A-B55 for an ordered mitotic exit.
    The same phospho-switch acts in S phase, where nuclear phospho-ENSA restrains PP2A-dependent
    dephosphorylation and degradation of Treslin to sustain replication-origin firing.
