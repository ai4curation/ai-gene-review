existing_annotations:
- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q7ZXH9
  review:
    summary: Transferred from Xenopus Ensa, which when phosphorylated by Greatwall becomes a potent
      PP2A-B55 inhibitor required for mitotic entry in egg extracts; the same mechanism operates in
      human cells, where ENSA is the major MASTL substrate in HeLa cells.
    action: ACCEPT
    reason: The Xenopus source annotation is sound (Mochida et al. 2010 showed that Gwl-phosphorylated
      Ensa is the PP2A-B55 inhibitor essential for mitosis), and the function is directly
      demonstrated for the human protein - ENSA Ser67 is phosphorylated by MASTL in mitotic HeLa
      cells, phospho-ENSA inhibits PP2A-B55, and ENSA rather than ARPP19 is the major MASTL target
      in those cells (Cundell et al. 2013). In Xenopus egg extracts endogenous Arpp19 rather than
      Ensa is rate-limiting for mitotic entry, so the relative contribution of the two paralogs is
      cell-type dependent, but the G2/M role of the phospho-ENSA/PP2A-B55 switch is the core
      function of the gene and the term is appropriate.
    supported_by: &gm_support
    - &q_mochida
      reference_id: PMID:21164013
      supporting_text: We report that inhibition of PP2A-B55δ results from a small protein, known as
        α-endosulfine (Ensa), that is phosphorylated in mitosis by the protein kinase Greatwall (Gwl).
        This converts Ensa into a potent and specific inhibitor of PP2A-B55δ.
    - &q_gharbi
      reference_id: PMID:21164014
      supporting_text: We identified cyclic adenosine monophosphate-regulated phosphoprotein 19
        (Arpp19) and α-Endosulfine as two substrates of Gwl that, when phosphorylated by this kinase,
        associate with and inhibit PP2A, thus promoting mitotic entry.
    - &q_cundell_major
      reference_id: PMID:24120663
      supporting_text: Given that ARPP19 was not detected (Figure S3E) and that ARPP19 siRNA had
        little effect (Figure 4B), ENSA is the major target of Greatwall/MASTL in these cells.
- term:
    id: GO:0000278
    label: mitotic cell cycle
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q7ZXH9
  review:
    summary: Broad parent term transferred from Xenopus Ensa; in human cells ENSA acts at more than
      one point of the cycle - the G2/M transition, the timing of mitotic exit, and S-phase
      progression via Treslin stabilisation.
    action: ACCEPT
    reason: Although general, the term is a fair summary rather than an over-generalisation, because
      human ENSA has documented roles in three phases of the mitotic cell cycle - mitotic entry and
      maintenance (Cundell et al. 2013), the ENSA/Greatwall timer that delays PP2A-B55 reactivation
      and PRC1 dephosphorylation until after chromosome separation (Cundell et al. 2013), and
      S-phase length control through Treslin (Charrasse et al. 2017). The more specific G2/M term is
      carried separately.
    supported_by:
    - &q_cundell_timer
      reference_id: PMID:24120663
      supporting_text: Removal of the ENSA/Greatwall (EG) timer module eliminates this second
        threshold, as well as associated delay in PRC1 dephosphorylation and initiation of
        cytokinesis, by uncoupling PP2A-B55 from Cdk1-cyclin B activity.
    - &q_charrasse_sphase
      reference_id: PMID:28785014
      supporting_text: Unexpectedly, Ensa knockdown promotes a dramatic extension of S phase
        associated with a lowered density of replication forks. Notably, Ensa depletion results in a
        decrease of Treslin levels, a pivotal protein for the firing of replication origins.
