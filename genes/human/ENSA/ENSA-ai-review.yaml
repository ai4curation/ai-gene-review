        substrates.
    - &q_kumm_inhib
      reference_id: PMID:32085646
      supporting_text: Our data also established that both MASTL- and PKA/PKG-phosphorylated
        ENSA/ARPP19 are PP2A substrates, whereas only MASTL-phosphorylated ENSA/ARPP19 are PP2A
        inhibitors.
    - &q_thapa_ser67
      reference_id: PMID:34346186
      supporting_text: ENSA inhibits PP2A activity when it is phosphorylated at Ser67 by Greatwall
