    - &q_falcon_mechanism
      reference_id: file:human/ENSA/ENSA-deep-research-falcon.md
      supporting_text: Phosphorylated ENSA then binds PP2A-B55 as a high-affinity inhibitory
        substrate. Its phosphoserine occupies the phosphatase catalytic machinery, but
        dephosphorylation is unusually slow relative to ordinary substrates.
- term:
    id: GO:0005102
    label: signaling receptor binding
  evidence_type: IDA
  original_reference_id: PMID:9653196
  qualifier: enables
  review:
    summary: Recombinant human alpha-endosulfine displaced [3H]glibenclamide from beta-cell membranes,
      which was read as binding to the sulfonylurea receptor SUR1 (ABCC8); direct binding was not
      shown and the authors could not exclude that the peptide acts on Kir6.2 instead.
    action: MODIFY
    reason: The evidence is a competitive ligand-displacement assay, not a demonstration of binding to
      a signalling receptor. SUR1 is an ABC-transporter regulatory subunit of the K-ATP channel that
      acts as a drug receptor, not a signalling receptor in the GO sense, and the paper itself
      states that binding to Kir6.2 cannot be excluded. What the study does establish directly is
      that ENSA reduces cloned Kir6.2/SUR1 K-ATP channel currents, which is captured by the
      potassium channel inhibitor activity annotation the gene already carries; that is the
      informative molecular-function reading of these data. The channel-regulatory role remains
      historical and non-core (see the GO:0019870 review).
    proposed_replacement_terms:
    - id: GO:0019870
      label: potassium channel inhibitor activity
    supported_by: &katp_support
    - &q_heron_abstract
      reference_id: PMID:9653196
      supporting_text: The recombinant protein displaces binding of the sulfonylurea [3H]glibenclamide
        to beta cell membranes, inhibits cloned KATP channel currents, and stimulates insulin
        secretion.
    - &q_heron_kir
      reference_id: PMID:9653196
      supporting_text: We therefore cannot exclude the alternative possibility that α-endosulfine
        binds to Kir6.2 and thereby displaces glibenclamide binding to SUR1.
