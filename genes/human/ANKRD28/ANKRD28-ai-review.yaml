- id: PMID:18186651
  title: Protein phosphatase 6 regulatory subunits composed of ankyrin repeat domains.
  findings:
  - statement: ANKRD28 co-purifies with PP6, PP6R1 and PP6R3 but not PP2A or PP4.
    supporting_text: Tagged Ankrd28 coprecipitated with PP6, not with PP2A or PP4, and with SAPS domain
      subunits PP6R1 and PP6R3.
  - statement: PP6R1 bridges PP6C and ANKRD28.
    supporting_text: The C-terminal region of PP6R1 was sufficient to coprecipitate Ankrd28, but not PP6,
      demonstrating that PP6R1 acts as a scaffold with separate regions for binding to PP6 and to Ankrd28.
  - statement: ANKRD28 knockdown enhances IkBe degradation.
    supporting_text: Knockdown of PP6R1 or Ankrd28, but not PP6R3, produced equivalent enhancement of
      IkappaBepsilon degradation in response to TNFalpha.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; defines the PP6 heterotrimer.
- id: PMID:19118547
  title: Ankyrin repeat domain 28 (ANKRD28), a novel binding partner of DOCK180, promotes cell migration
    by regulating focal adhesion formation.
  findings:
  - statement: ANKRD28 binds the DOCK180 SH3 domain.
    supporting_text: ANKRD28 associated with DOCK180 in an SH3-dependent manner and competed with ELMO,
      another protein bound to the SH3 domain of DOCK180.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only.
- id: PMID:21187329
  title: Protein phosphatase 6 regulates mitotic spindle formation by controlling the T-loop phosphorylation
    state of Aurora A bound to its activator TPX2.
  findings:
  - statement: ANKRD28 and ANKRD44 are required for PP6 function in mitosis.
    supporting_text: The results presented here suggest that the ANKRD28 and 44 subunits are required
      for PP6 function in mitosis, whereas ANKRD52 is not.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; source of one PPP6C IPI row.
