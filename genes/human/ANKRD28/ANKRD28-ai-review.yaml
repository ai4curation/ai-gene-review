suggested_questions:
- question: Is ANKRD28's described role as a PP1 targeting subunit (PITK) compatible with its PP6 scaffold
    role, and does endogenous ANKRD28 bind PP1C?
- question: Which focal-adhesion substrates does ANKRD28-containing PP6 dephosphorylate directly (FAK
    S910 is a candidate), and does the DOCK180 SH3 interaction contribute independently of PP6?
suggested_experiments:
- description: Map which PP6 substrates (MOB1, IkBe, FAK S910) require ANKRD28 rather than ANKRD44 or
    ANKRD52, using paralog-specific knockouts with phosphoproteomics.
