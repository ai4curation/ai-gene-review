id: O15084
gene_symbol: ANKRD28
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ANKRD28 (ankyrin repeat domain-containing 28; PITK) is a large protein of 26 ankyrin repeats.
  It is the ankyrin-repeat scaffolding subunit (ARS) of protein phosphatase 6: it associates with a SAPS-domain
  subunit (PPP6R1 or PPP6R3), which in turn binds the PPP6C catalytic subunit, forming a heterotrimer
  that helps set PP6 substrate specificity. ANKRD28-containing PP6 opposes TNF-induced degradation of
  IkBe, dephosphorylates the Hippo regulator MOB1 and acts in mitosis. Mostly cytosolic, with a fraction
  at lamellipodia, it influences focal adhesions and migration; it also binds the DOCK180 SH3 domain in
  competition with ELMO. Its level is controlled by the RAB40C-CUL5 ubiquitin ligase, which targets it
  for lysosomal degradation. As PITK it has also been described as a PP1 targeting subunit that directs
  PP1 to hnRNP K in nuclear foci.'
