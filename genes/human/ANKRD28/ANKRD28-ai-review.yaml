    helps select PP6 substrates such as MOB1 and IkBe.
  molecular_function:
    id: GO:0019888
    label: protein phosphatase regulator activity
  in_complex:
    id: GO:0008287
    label: protein serine/threonine phosphatase complex
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:18186651
    supporting_text: The results suggest that PP6 functions as a heterotrimer, composed of the PP6 catalytic
      subunit bound to a SAPS domain scaffold subunit that associates with Ankrd28.
  - reference_id: PMID:18186651
    supporting_text: The C-terminal region of PP6R1 was sufficient to coprecipitate Ankrd28, but not PP6,
      demonstrating that PP6R1 acts as a scaffold with separate regions for binding to PP6 and to Ankrd28.
  - reference_id: PMID:35512830
    supporting_text: ANKRD28 is an essential scaffolding component of the PP6 complex
  - reference_id: PMID:35512830
    supporting_text: in control cells knock-down of ANKRD28 increased the levels of pMOB1-T35
  - reference_id: PMID:18186651
    supporting_text: Knockdown of PP6R1 or Ankrd28, but not PP6R3, produced equivalent enhancement of
      IkappaBepsilon degradation in response to TNFalpha.
