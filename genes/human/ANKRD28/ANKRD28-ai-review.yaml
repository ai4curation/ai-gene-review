- term:
    id: GO:0051894
    label: positive regulation of focal adhesion assembly
  evidence_type: IMP
  original_reference_id: PMID:35512830
  qualifier: involved_in
  review:
    summary: Positive regulation of focal adhesion assembly (IMP). ANKRD28 knockdown gives smaller, mislocalized
      focal adhesions, and knockdown reverses the enlarged adhesions of RAB40C-knockout cells, in which
      ANKRD28 accumulates; the positive sign is correct. Kept as non-core, cell-migration context.
    action: KEEP_AS_NON_CORE
    reason: 'Two experiments agree: [PMID:35512830 "In this study we found that ANKRD28 knockdown leads
      to a decrease in FA size and a loss of polarized FA distribution at the leading edge of the migrating
      cell."] and, in the RAB40C-knockout background, [PMID:35512830 "ANKRD28 knockdown did decrease FA
      size in Rab40c-KO cells"] One introductory sentence of the paper reads [PMID:35512830 "Importantly,
      ANKRD28-containing PP6 complex inhibits FA formation"], but every experimental arm points the other
      way, so it is a framing slip rather than a conflicting result. An earlier knockdown also slowed
      HeLa migration [PMID:19118547 "Knockdown of ANKRD28 by RNA interference reduced the velocity of
      migration of HeLa cells"]'
    supported_by:
    - reference_id: PMID:35512830
      supporting_text: In this study we found that ANKRD28 knockdown leads to a decrease in FA size and
        a loss of polarized FA distribution at the leading edge of the migrating cell.
