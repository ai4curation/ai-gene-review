core_functions:
- description: PLK2 is an active centrosomal serine/threonine kinase that localizes to centrioles in early G1/S and promotes
    procentriole formation by phosphorylating centriole-duplication substrates including NPM1/B23 and CENPJ/CPAP.
  molecular_function:
    id: GO:0106310
    label: protein serine kinase activity
  directly_involved_in:
  - id: GO:0046599
    label: regulation of centriole replication
  locations:
  - id: GO:0005814
    label: centriole
  - id: GO:0005813
    label: centrosome
  supported_by:
  - reference_id: PMID:15242618
    supporting_text: the kinase activity of Plk2 is required for centriole duplication
  - reference_id: PMID:20531387
    supporting_text: PLK2 phosphorylates the S589 and S595 residues of CPAP in vitro and in vivo.
  - reference_id: PMID:20352051
    supporting_text: We show that Plk2 interacts with and phosphorylates NPM/B23 on S4 in both mitosis and S-phase while Plk1
      seems to be involved only in its mitotic phosphorylation.
- description: In neurons, PLK2 phosphorylates synaptic and alpha-synuclein substrates to tune synaptic Ras/Rap signaling
    and protein turnover, including selective autophagic clearance of alpha-synuclein after PLK2-dependent S129 phosphorylation.
  molecular_function:
    id: GO:0106310
    label: protein serine kinase activity
  directly_involved_in:
  - id: GO:0048167
    label: regulation of synaptic plasticity
  - id: GO:0010508
    label: positive regulation of autophagy
  locations:
  - id: GO:0030425
    label: dendrite
  supported_by:
  - reference_id: file:human/PLK2/PLK2-uniprot.txt
    supporting_text: 'Plays a key role in synaptic plasticity and memory by regulating the Ras and Rap protein signaling:
      required for overactivity-dependent spine remodeling by phosphorylating the Ras activator RASGRF1 and the Rap inhibitor
      SIPA1L1 leading to their degradation by the proteasome.'
  - reference_id: PMID:23983262
    supporting_text: Here, we report that Polo-like kinase 2 (PLK2), an enzyme up-regulated in synucleinopathy-diseased brains,
      interacts with, phosphorylates and enhances α-synuclein autophagic degradation in a kinase activity-dependent manner.
