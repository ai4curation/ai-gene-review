id: Q9NYY3
gene_symbol: PLK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PLK2 is a polo-like serine/threonine kinase with an N-terminal catalytic domain and C-terminal polo-box domains.
  It localizes to centrosomes and centrioles in early G1/S, where its kinase activity promotes centriole duplication by phosphorylating
  substrates including NPM1/B23 and CENPJ/CPAP. In neurons, PLK2 phosphorylates synaptic and alpha-synuclein substrates and
  contributes to synaptic homeostasis by regulating Ras/Rap signaling, dendritic-spine remodeling and selective autophagic
  clearance of alpha-synuclein.'
alternative_products:
