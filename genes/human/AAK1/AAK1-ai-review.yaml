- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0C1X8
  review:
    summary: >-
      Protein serine/threonine kinase activity transferred from rat Aak1 by
      curator-reviewed similarity. This is the defining catalytic activity and is
      independently established for human AAK1.
    action: ACCEPT
    reason: >-
      The rat ortholog is an appropriate donor, and direct biochemical and structural
      studies of human AAK1 confirm an active serine/threonine kinase
      (PMID:11877457, PMID:11877461, PMID:26853940). The same donor is reused for
      several localization rows, so those transfers are correlated rather than
      independent support.
    additional_reference_ids:
    - PMID:11877457
    - PMID:11877461
    - PMID:26853940
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:P0C1X8
        source_label: rat Aak1
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Rat Aak1 is a suitable orthologous donor; reuse of this one donor across
          kinase, presynapse, leading-edge, and bouton rows is correlated evidence.
    supported_by:
    - reference_id: PMID:11877457
      supporting_text: >-
        Together, these data suggest that AAK1 corresponds to the endogenous kinase responsible for phosphorylation of μ2 at Thr-156.
- term:
    id: GO:0005112
    label: Notch binding
  evidence_type: IDA
  original_reference_id: PMID:21464124
  qualifier: enables
  review:
    summary: >-
