id: Q2M2I8
gene_symbol: AAK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AAK1 is a cytosolic, peripheral-membrane serine/threonine kinase and endocytic
  scaffold of the Numb-associated kinase family. It is recruited through AP-2 and
  clathrin interactions and phosphorylates AP2M1/μ2 at Thr-156, increasing AP-2
  affinity for cargo sorting motifs; assembled clathrin stimulates this activity. The
  long AAK1L isoform has an additional C-terminal clathrin-binding region and contributes
  to both cargo internalization and rapid recycling from early/sorting endosomes. Effects
  on uptake depend on cargo and cellular context and overlap with other NAK-family
  kinases. AAK1 also localizes to focal adhesions, where its kinase activity promotes
  adhesion disassembly and cell migration; PDLIM5 Thr-290 and talin-1 Thr-2270 are
  direct in-vitro AAK1/BMP2K substrates implicated in this output. More
  context-specific outputs include activated NOTCH1 stabilization and endosomal
  routing, WNT-LRP6 internalization, and TFR1-dependent iron uptake during ferroptosis.
