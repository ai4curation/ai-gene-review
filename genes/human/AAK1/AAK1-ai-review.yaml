      of AAK1.
    supported_by:
    - reference_id: PMID:21464124
      supporting_text: >-
        We show here that AAK1, the adaptor-associated kinase 1, directly interacts with the membrane-tethered active form of Notch released by metalloprotease cleavage.
- term:
    id: GO:0006468
    label: protein phosphorylation
  evidence_type: IDA
  original_reference_id: PMID:17494869
  qualifier: involved_in
  review:
    summary: >-
      AAK1L and AAK1S were tested in kinase assays against the AP-2 mu2 subunit,
      supporting the broad protein-phosphorylation process annotation.
    action: ACCEPT
    reason: >-
      The study directly assayed both human splice forms and found basal and
      clathrin-stimulated AP2M1 kinase activity. Protein phosphorylation is broad but
      correctly captures the central catalytic process demonstrated by the source.
    supported_by:
    - reference_id: PMID:17494869
      supporting_text: >-
        However, in vitro kinase assays reveal little difference between AAK1 isoforms in their basal or clathrin-stimulated kinase activity toward the AP-2 micro2 subunit.
- term:
    id: GO:0006468
    label: protein phosphorylation
  evidence_type: IDA
  original_reference_id: PMID:18657069
  qualifier: involved_in
  review:
    summary: >-
      The source reports AAK1-dependent phosphorylation of NUMB and identifies T102
      as the relevant site. A 2026 biochemical study did not detect phosphorylation
      of a NUMB T102 peptide, creating substrate-site-specific counterevidence.
    action: ACCEPT
    reason: >-
      Retain the broad protein-phosphorylation annotation because AAK1 kinase activity
      is unequivocal and the original experimental annotation should not be overruled
      from an abstract-only cache. The precise NUMB-T102 mechanism is disputed by
      PMID:42082516 and should not be used as sole evidence for substrate specificity;
      AP2M1 T156 and newer PDLIM5/Talin1 sites independently establish the process.
    additional_reference_ids:
    - PMID:11877457
    - PMID:42082516
    supported_by:
    - reference_id: PMID:18657069
      supporting_text: >-
        In this study, we show that Numb binds to and is phosphorylated by adaptor-associated kinase 1 (AAK1), a key endocytic kinase.
    - reference_id: PMID:42082516
      supporting_text: >-
        This refined consensus sequence also explains why previously proposed substrates Dab2 T109, Arh T104, NUMB T102, and AP1μ T14426 showed no detectable phosphorylation in our in-vitro experiments
