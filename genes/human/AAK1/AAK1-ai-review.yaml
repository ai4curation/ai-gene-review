core_functions:
- description: >-
    At plasma-membrane clathrin-coated pits, AAK1 binds AP-2 and clathrin and
    uses clathrin-stimulated protein serine/threonine kinase activity to
    phosphorylate AP2M1/mu2 at Thr-156. This increases AP-2 cargo-sorting
    affinity and regulates clathrin-dependent cargo internalization; AAK1 also
    positively regulates return of internalized cargo from early/sorting
    endosomes to the cell surface.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:2000369
    label: regulation of clathrin-dependent endocytosis
  - id: GO:2001137
    label: positive regulation of endocytic recycling
  locations:
  - id: GO:0005905
    label: clathrin-coated pit
  substrates:
  - id: UniProtKB:Q96CW1
    label: AP-2 complex subunit mu
  supported_by:
  - reference_id: PMID:11877457
    supporting_text: >-
      Together, these data suggest that AAK1 corresponds to the endogenous kinase responsible for phosphorylation of μ2 at Thr-156.
  - reference_id: PMID:14617351
    supporting_text: >-
      Importantly, incubation of AAK1 with clathrin cages resulted in even greater stimulation when compared to that of unassembled clathrin triskelia.
  - reference_id: PMID:17494869
    supporting_text: >-
      Surprisingly, CBD2 overexpression or AAK1 depletion by RNA interference significantly impairs transferrin recycling from the early/sorting endosome.
- description: >-
    At mature focal adhesions, AAK1 kinase activity promotes timely release of
    adhesome components during focal-adhesion disassembly, increasing adhesion
    turnover and cell migration. PDLIM5 Thr-290 and talin-1 Thr-2270 are direct
    in-vitro substrates of both AAK1 and BMP2K and are jointly kinase-responsive
    in cells; the individual endogenous contribution of AAK1 to each phosphosite
    remains unresolved.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0120183
    label: positive regulation of focal adhesion disassembly
  - id: GO:0030335
    label: positive regulation of cell migration
  locations:
  - id: GO:0005925
    label: focal adhesion
  substrates:
  - id: UniProtKB:Q96HC4
    label: PDZ and LIM domain protein 5
  - id: UniProtKB:Q9Y490
    label: Talin-1
  supported_by:
  - reference_id: PMID:42082516
    supporting_text: >-
      Here, using motif-guided in silico, biochemical, and phosphoproteomic screens, we identify PDLIM5 and Talin1 as direct AAK1/BMP2K substrates.
  - reference_id: PMID:42082516
    supporting_text: >-
      Because rapid paxillin turnover is essential for efficient cell migration, these data position AAK1 as a positive regulator of FA disassembly and motility.
  - reference_id: PMID:42082516
    supporting_text: >-
      Thus, AAK1 is specifically recruited to mature, tension-bearing FAs and thereby positioned to efficiently phosphorylate substrates PDLIM5 and Talin1.
knowledge_gaps:
- gap_statement: >-
    The cargo- and cell-type-specific division of AP2M1 phosphorylation and
    clathrin-dependent endocytosis among AAK1, BMP2K, GAK, and other kinases is
    not resolved.
  boundary: >-
    AAK1 directly phosphorylates AP2M1 and regulates endocytosis and recycling in
    multiple systems, but in human RPE cells BMP2K is the dominant NAK for
    receptor internalization while AAK1 loss has only a modest effect on AP2M1
    phosphorylation.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: NARROWING
  significance: >-
    Resolving the division of labor is necessary to predict which cargos and
    tissues will respond to selective AAK1 perturbation and to avoid treating
    all NAK-family endocytic evidence as interchangeable.
  resolution: >-
    Parallel endogenous single- and combinatorial-kinase perturbations, coupled
    to AP2M1 phosphosite quantification and cargo-resolved uptake and recycling
    assays across cell types, would define nonredundant and compensatory roles.
  provenance:
  - reference_id: PMID:42082516
    supporting_text: >-
      Together, these data indicate that BMP2K, rather than AAK1, is the primary NAK regulating CME in RPE cells.
- gap_statement: >-
    The individual contribution of AAK1 versus BMP2K to endogenous PDLIM5
    Thr-290 and talin-1 Thr-2270 phosphorylation in intact cells remains
    unresolved.
  boundary: >-
    Recombinant kinase assays and double-knockout phosphoproteomics establish
    both sites as AAK1/BMP2K-responsive, while AAK1-specific loss and rescue
    establish the focal-adhesion turnover and migration phenotype.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: NARROWING
  significance: >-
    Site-specific kinase attribution would close the causal link between AAK1's
    focal-adhesion recruitment, its two proposed adhesome substrates, and the
    nonredundant migration phenotype.
  resolution: >-
    Quantify both phosphosites in matched AAK1 and BMP2K single knockouts and
    acute degron lines, followed by wild-type, kinase-dead, and
    recruitment-defective rescue and focal-adhesion lifetime measurements.
  provenance:
  - reference_id: PMID:42082516
    supporting_text: >-
      The use of double knock-out cells allowed us to capture phosphorylation driven by either kinase while mitigating potential paralogue redundancy.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which cargo classes and human cell types depend nonredundantly on AAK1,
    rather than BMP2K, GAK, or another kinase, for AP2M1 phosphorylation,
    internalization, and endocytic recycling?
- question: >-
    Do AAK1L and AAK1S differ in recruitment to coated pits, early endosomes,
    and focal adhesions, or in their relative contributions to recycling and
    adhesion turnover?
suggested_experiments:
- hypothesis: >-
    AAK1 and BMP2K make cell- and cargo-specific, partly compensatory
    contributions to AP2M1 phosphorylation and endocytic flux.
  description: >-
    Generate matched endogenous AAK1, BMP2K, GAK, and combinatorial acute-degron
    cell panels in several human lineages. Measure AP2M1 Thr-156 phosphorylation,
    coated-pit dynamics, and uptake/recycling kinetics for transferrin receptor,
    integrins, LRP6, and TFR1, with wild-type and kinase-dead rescues.
  experiment_type: >-
    Acute genetic perturbation, targeted phosphoproteomics, and quantitative
    live-cell endocytic trafficking
- hypothesis: >-
    AAK1 isoforms and C-terminal recruitment motifs partition its endocytic and
    focal-adhesion activities.
  description: >-
    Use isoform-selective CRISPR editing and endogenous fluorescent tagging to
    compare AAK1L and AAK1S recruitment at coated pits, early endosomes, and
    focal adhesions. Combine isoform-specific rescue with AP2M1, PDLIM5, and
    talin-1 phosphosite measurements, cargo recycling, focal-adhesion lifetime,
    and migration assays.
  experiment_type: >-
    Isoform-resolved genome editing, live-cell imaging, and targeted
    phosphoproteomics
