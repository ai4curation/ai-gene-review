    summary: >-
      NEW annotation. Live-cell imaging places AAK1 at mature, tension-bearing
      focal adhesions in collagen-adherent human RPE cells.
    action: NEW
    reason: >-
      The ECM-dependent localization was supported by paxillin colocalization and
      multiple illumination, membrane, and attachment controls. This is the site of
      AAK1's directly demonstrated adhesion-turnover activity.
    supported_by:
    - reference_id: PMID:42082516
      supporting_text: >-
        Thus, AAK1 is specifically recruited to mature, tension-bearing FAs and thereby positioned to efficiently phosphorylate substrates PDLIM5 and Talin1.
- term:
    id: GO:0120183
    label: positive regulation of focal adhesion disassembly
  evidence_type: IMP
  original_reference_id: PMID:42082516
  qualifier: involved_in
  review:
    summary: >-
      NEW annotation. AAK1 deletion increases focal-adhesion density and lifetime
      and slows paxillin exchange, while kinase- and phosphosite-dependent analyses
      support accelerated release of focal-adhesion components.
    action: NEW
    reason: >-
      Human-cell loss-of-function, live imaging, rescue, and phosphomutant evidence
      directly supports a positive regulatory role in focal-adhesion disassembly.
      This is a core AAK1 function distinct from its cargo-trafficking role.
    supported_by:
    - reference_id: PMID:42082516
      supporting_text: >-
        Because rapid paxillin turnover is essential for efficient cell migration, these data position AAK1 as a positive regulator of FA disassembly and motility.
- term:
    id: GO:0030335
    label: positive regulation of cell migration
  evidence_type: IMP
  original_reference_id: PMID:42082516
  qualifier: involved_in
  review:
    summary: >-
      NEW annotation. AAK1 knockout or knockdown slows human RPE-cell migration,
      with corroborating knockdown phenotypes in SH-SY5Y and MDA-MB-231 cells.
    action: NEW
    reason: >-
      Genetic loss and kinase-inhibitor phenotypes establish a positive,
      kinase-dependent contribution to cell migration. BMP2K loss did not reproduce
      the RPE phenotype, supporting an AAK1-specific core role.
    supported_by:
    - reference_id: PMID:42082516
      supporting_text: >-
        AAK1 deletion or siRNA-mediated knockdown reproducibly impaired RPE migration by ~25% (Fig. 3d, e and Supplementary Fig. 1h), whereas BMP2K loss had no measurable effect, revealing a specific and non-redundant role for AAK1 in cell motility.
- term:
    id: GO:0090090
    label: negative regulation of canonical Wnt signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:30605688
  qualifier: involved_in
  review:
    summary: >-
      NEW annotation. AAK1 loss or inhibition increases canonical WNT output in
      multiple human cell models, while AAK1 promotes LRP6 endocytosis and
      lysosomal degradation.
    action: NEW
    reason: >-
      Perturbation and mechanistic evidence support negative regulation of canonical
      WNT signaling. This is retained as a context- and cargo-specific output of the
      endocytic machinery, not as a universal core function of AAK1.
    supported_by:
    - reference_id: PMID:30605688
      supporting_text: >-
        Together, these results suggest that AAK1 inhibits WNT signaling by inducing CME endocytosis and lysosomal degradation of LRP6.
- term:
    id: GO:0160020
    label: positive regulation of ferroptosis
  evidence_type: IMP
  original_reference_id: PMID:41407700
  qualifier: involved_in
  review:
    summary: >-
      NEW annotation. In induced ferroptosis models, AAK1 loss reduces lipid
      peroxidation and ferroptotic death, whereas activated AAK1 drives
      AP2M1-dependent TFR1 internalization and iron accumulation.
    action: NEW
    reason: >-
      Genetic and mechanistic evidence supports positive regulation of ferroptosis
      in the tested cancer-cell and xenograft settings. This stimulus-dependent,
      cargo-specific role is non-core rather than a constitutive output of AAK1.
    supported_by:
    - reference_id: PMID:41407700
      supporting_text: >-
        Mechanistically, activated AAK1 phosphorylates AP2M1, which facilitates the recruitment of clathrin to mediate the endocytosis of TFR1, increasing the levels of both cellular total iron and ferrous iron and thereby promoting ferroptosis.
