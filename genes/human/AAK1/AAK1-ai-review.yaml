      phenotype or the broader process.
    additional_reference_ids:
    - PMID:11877461
    - PMID:17494869
    - PMID:42082516
    supported_by:
    - reference_id: PMID:18657069
      supporting_text: >-
        Overexpression of a Numb point mutant (T102A) that lacks the AAK1 phosphorylation site potently disrupts transferrin and low-density lipoprotein internalization but does not impact EGF uptake.
    - reference_id: PMID:42082516
      supporting_text: >-
        This refined consensus sequence also explains why previously proposed substrates Dab2 T109, Arh T104, NUMB T102, and AP1μ T14426 showed no detectable phosphorylation in our in-vitro experiments
- term:
    id: GO:0030276
    label: clathrin binding
  evidence_type: IDA
  original_reference_id: PMID:17494869
  qualifier: enables
  isoform: Q2M2I8-1
  review:
    summary: >-
      NEW annotation. The long AAK1 isoform contains a second C-terminal
      clathrin-binding region whose direct interaction with clathrin was tested in
      protein-interaction assays.
    action: NEW
    reason: >-
      Clathrin binding is an informative molecular function that helps recruit and
      stimulate AAK1 in the coated-pit machinery. The isoform field records that the
      tested CBD2 construct came from long isoform AAK1L/Q2M2I8-1; it does not claim
      that clathrin binding is unique to this isoform.
    supported_by:
    - reference_id: PMID:17494869
      supporting_text: >-
        Protein interaction studies demonstrate that AAK1L CBD2 directly binds clathrin.
- term:
    id: GO:2001137
    label: positive regulation of endocytic recycling
  evidence_type: IMP
  original_reference_id: PMID:17494869
  qualifier: involved_in
  isoform: Q2M2I8-1
  review:
    summary: >-
      NEW annotation. AAK1 depletion or interference with its second
      clathrin-binding region impairs transferrin recycling from early/sorting
      endosomes, and independent depletion experiments delay short-loop beta3
      integrin recycling to the cell surface.
    action: NEW
    reason: >-
      Loss-of-function evidence for two cargos supports a positive contribution to
      endocytic recycling, a process not captured by the existing annotation to
      regulation of clathrin-dependent endocytosis. The isoform field records the
      tested long AAK1L/Q2M2I8-1 constructs without claiming that the shorter isoform
      cannot contribute.
    additional_reference_ids:
    - PMID:23781025
    supported_by:
    - reference_id: PMID:17494869
      supporting_text: >-
        Surprisingly, CBD2 overexpression or AAK1 depletion by RNA interference significantly impairs transferrin recycling from the early/sorting endosome.
    - reference_id: PMID:23781025
      supporting_text: >-
        siRNA-mediated depletion of either factor delays short-loop β3 integrin recycling from the early endosome back to the cell surface.
