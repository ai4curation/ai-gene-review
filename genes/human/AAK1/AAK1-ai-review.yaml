- term:
    id: GO:2000369
    label: regulation of clathrin-dependent endocytosis
  evidence_type: IMP
  original_reference_id: PMID:17494869
  qualifier: involved_in
  review:
    summary: >-
      AAK1L-domain overexpression and AAK1 depletion perturb transferrin
      internalization and recycling, directly demonstrating regulation at multiple
      steps of the clathrin-dependent endocytic pathway.
    action: ACCEPT
    reason: >-
      This IMP annotation captures the central biological role established by
      perturbation of AAK1 constructs and abundance. Cargo and direction of effect
      vary with experimental context, so the sign-neutral regulatory GO term is
      appropriately scoped.
    supported_by:
    - reference_id: PMID:17494869
      supporting_text: >-
        These observations suggest that AAK1 functions at multiple steps of the endosomal pathway by regulating transferrin internalization and its rapid recycling back to the plasma membrane from early/sorting endosome.
- term:
    id: GO:2000369
    label: regulation of clathrin-dependent endocytosis
  evidence_type: IDA
  original_reference_id: PMID:18657069
  qualifier: involved_in
  review:
    summary: >-
      AAK1 perturbation and NUMB localization/mutant experiments support regulation
      of cargo-selective clathrin-dependent endocytosis and coated-pit maturation.
    action: ACCEPT
    reason: >-
