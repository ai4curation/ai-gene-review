- id: PMID:11877457
  title: "Phosphorylation of the AP2 mu subunit by AAK1 mediates high affinity binding to membrane protein sorting signals."
  findings:
  - statement: AAK1 is the endogenous candidate kinase for AP2M1/μ2 Thr156.
    supporting_text: >-
      Together, these data suggest that AAK1 corresponds to the endogenous kinase
      responsible for phosphorylation of μ2 at Thr-156.
    reference_section_type: RESULTS
  - statement: AAK1 phosphorylation of AP2M1/μ2 increases AP2 affinity for cargo sorting signals.
    supporting_text: >-
      Thus, our in vitro experiments demonstrate that AP2 affinity for sorting signals
      can be significantly regulated by AAK1-mediated phosphorylation of μ2.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct site-mapping and biochemical evidence for the core AAK1-AP2M1 mechanism.
      AP2 was purified from pig brain and tested with recombinant AAK1, so this is
      conserved mammalian biochemistry rather than a purely human-cell assay.
- id: PMID:11877461
  title: "Identification of an adaptor-associated kinase, AAK1, as a regulator of clathrin-mediated endocytosis."
  findings:
  - statement: AAK1 directly binds the AP2 α-adaptin subunit in vitro.
    supporting_text: Thus, these results demonstrate that AAK1 interacts directly with α-adaptin in vitro.
    reference_section_type: RESULTS
  - statement: AAK1 preferentially phosphorylates μ subunits of AP complexes.
    supporting_text: >-
      These results provide strong evidence that μ is a specific target of AAK1
      phosphorylation in CCVs and suggests that the observed phosphorylation of μ can be
      attributed to the presence of endogenous AAK1 in these samples (Fig. 4).
    reference_section_type: RESULTS
  - statement: AAK1 regulates an early AP2-dependent step of clathrin-mediated endocytosis.
    supporting_text: >-
      Collectively, these data provide functional evidence that AAK1 plays a role in
      AP2-stimulated endocytosis at an early step by specifically phosphorylating the μ
      subunit of the AP complex.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Foundational direct interaction, kinase, localization, and endocytosis evidence.
      The study uses human full-length AAK1 together with rat/bovine preparations and
      human HeLa/A431 cell assays, so individual findings retain their model context.
- id: PMID:12952931
  title: "Differential requirements for AP-2 in clathrin-mediated endocytosis."
  findings:
  - statement: Efficient AP2 recruitment and μ2 phosphorylation require AAK1's α-adaptin-interacting domain.
    supporting_text: >-
      We conclude that efficient recruitment of AAK1 to AP-2 and its phosphorylation of
      μ2 requires the AID and that each of the individual domains and truncated mutants
      retain their expected activities.
    reference_section_type: RESULTS
  - statement: Full-length AAK1 overexpression binds and disrupts AP2 function in human cells.
    supporting_text: These data establish that AAK1 can bind to and disrupt the function of AP-2 complexes in vivo.
    reference_section_type: RESULTS
  - statement: Approximately 80% AAK1 knockdown did not measurably change transferrin uptake, AP2 distribution, or μ2 phosphorylation in A549 or HeLa cells.
    supporting_text: >-
      Transfection of two different siRNAs that specifically target AAK1 reduced AAK1
      expression by ∼80% in either A549 or HeLa cells. However, in neither case did we
      observe an alteration in Tfn internalization, AP-2 distribution, or μ2
      phosphorylation (Fig. S2, available at
      http://www.jcb.org/cgi/content/full/jcb.200304069/DC1).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human-cell AP2/endocytosis study, but its positive phenotype is driven by
      full-length AAK1 overexpression and is kinase-independent; partial RNAi produced no
      phenotype, an important redundancy/residual-activity caveat.
- id: PMID:14617351
  title: "AAK1-mediated micro2 phosphorylation is stimulated by assembled clathrin."
  full_text_unavailable: true
  findings:
  - statement: Clathrin stimulates AAK1-dependent AP2 μ2 phosphorylation.
    supporting_text: >-
      Here, we report that AAK1 is an atypical kinase that is rate limited by its stable
      association with AP2 and that clathrin stimulates micro2 phosphorylation by AAK1.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Assembled clathrin cages stimulate AAK1 more strongly than unassembled triskelia.
    supporting_text: >-
      Importantly, incubation of AAK1 with clathrin cages resulted in even greater
      stimulation when compared to that of unassembled clathrin triskelia.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The cached abstract directly supports clathrin-dependent activation of AAK1, a
      core regulatory mechanism. Full experimental and species details are unavailable
      locally, so no assay context beyond the abstract is inferred.
- id: PMID:17494869
  title: "A novel AAK1 splice variant functions at multiple steps of the endocytic pathway."
  full_text_unavailable: true
  findings:
  - statement: The long AAK1 isoform has an extended C terminus with a second, directly clathrin-binding domain.
    supporting_text: >-
      Here we have identified a long form of AAK1 (AAK1L) that contains an extended
      C-terminus that encodes an additional clathrin-binding domain (CBD2) consisting of
      multiple low-affinity interaction motifs. Protein interaction studies demonstrate
      that AAK1L CBD2 directly binds clathrin.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The long and short AAK1 isoforms show similar basal and clathrin-stimulated kinase activity toward AP2 μ2 in vitro.
    supporting_text: >-
      However, in vitro kinase assays reveal little difference between AAK1 isoforms in
      their basal or clathrin-stimulated kinase activity toward the AP-2 micro2 subunit.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: AAK1 depletion impairs transferrin recycling from early/sorting endosomes, supporting an endosomal recycling role in addition to internalization.
    supporting_text: >-
      Surprisingly, CBD2 overexpression or AAK1 depletion by RNA interference
      significantly impairs transferrin recycling from the early/sorting endosome.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct isoform, clathrin-binding, AP2-kinase, and loss-of-function recycling
      evidence. The cache contains only the abstract plus a failed PDF placeholder, so
      detailed cell/species context cannot be independently audited.
- id: PMID:18657069
  title: "AAK1 regulates Numb function at an early step in clathrin-mediated endocytosis."
  full_text_unavailable: true
  findings:
  - statement: The paper reports AAK1-dependent redistribution of Numb between perinuclear endosomes and the plasma membrane; this localization phenotype remains usable with overexpression/depletion caveats.
    supporting_text: >-
      We find that AAK1 redistributes Numb to perinuclear endosomes when overexpressed,
      while kinase depletion causes Numb to accumulate at the plasma membrane.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The paper reports Numb Thr102 as an AAK1 phosphorylation site, but that substrate/site assignment is disputed by PMID:42082516.
    supporting_text: >-
      Overexpression of a Numb point mutant (T102A) that lacks the AAK1 phosphorylation
      site potently disrupts transferrin and low-density lipoprotein internalization but
      does not impact EGF uptake.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      The cached abstract supports the reported Numb localization and cargo-selective
      phenotypes, but the central Numb-T102 substrate claim is contradicted by
      PMID:42082516: purified AAK1/BMP2K did not phosphorylate the site, RPE
      phosphoproteomics did not detect it, and its sequence lacks the refined recognition
      motif. Preserve the localization phenotype; do not treat T102 phosphorylation as
      established.
- id: PMID:21464124
  title: "The adaptor-associated kinase 1, AAK1, is a positive regulator of the Notch pathway."
  findings:
  - statement: AAK1 directly interacts with the membrane-tethered activated form of Notch.
    supporting_text: >-
      We show here that AAK1, the adaptor-associated kinase 1, directly interacts with the
      membrane-tethered active form of Notch released by metalloprotease cleavage.
    reference_section_type: ABSTRACT
  - statement: Active AAK1 stabilizes activated and monoubiquitinated Notch upstream of γ-secretase cleavage.
    supporting_text: >-
      Active AAK1 acts upstream of the γ-secretase cleavage by stabilizing both the
      membrane-tethered activated form of Notch and its monoubiquitinated counterpart.
    reference_section_type: ABSTRACT
  - statement: AAK1 promotes activated Notch localization to Rab5-positive endosomes, whereas AAK1 depletion interferes with that localization.
    supporting_text: >-
      Moreover, transfected AAK1 increases the localization of activated Notch to
      Rab5-positive endocytic vesicles, while AAK1 depletion or overexpression of Numb,
      an inhibitor of the pathway, interferes with this localization.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct mammalian-cell evidence supports activated-Notch binding, stabilization,
      endosomal sorting, and positive pathway regulation. Its secondary Numb model is not
      propagated because that arm depends on the now-disputed PMID:18657069 claim.
- id: PMID:22645275
  title: "Identification of novel ATP13A2 interactors and their role in α-synuclein misfolding and toxicity."
  full_text_unavailable: true
  findings:
  - statement: A membrane yeast-two-hybrid screen reported 43 ATP13A2 interactors, but the cached abstract does not identify AAK1 among them.
    supporting_text: >-
      Utilizing a split-ubiquitin membrane yeast two-hybrid system that was developed to
      identify interacting partners of full-length integral membrane proteins, we
      identified 43 novel interactors that primarily implicate ATP13A2 in cellular
      processes such as endoplasmic reticulum (ER) translocation, ER-to-Golgi trafficking
      and vesicular transport and fusion.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: >-
      The cached abstract verifies the ATP13A2 interactor screen but contains no AAK1 or
      AAK1L mention. Because the full text and supplement are unavailable in cache, the
      pair cannot be evaluated mechanistically; the generic protein-binding term remains
      uninformative.
- id: PMID:23781025
  title: "Αvβ3-integrin-mediated adhesion is regulated through an AAK1L- and EHD3-dependent rapid-recycling pathway."
  full_text_unavailable: true
  findings:
  - statement: AAK1L and EHD3 are required for αvβ3-integrin-mediated adhesion in human HeLa cells.
    supporting_text: >-
      We discovered that two early endosome factors, AAK1L and EHD3, are critical for
      αvβ3-integrin-mediated cell adhesion in HeLa cells.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Depletion of either AAK1L or EHD3 delays short-loop β3-integrin recycling from early endosomes to the cell surface.
    supporting_text: >-
      siRNA-mediated depletion of either factor delays short-loop β3 integrin recycling
      from the early endosome back to the cell surface.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: AAK1L kinase activity and its C-terminal domain are required to maintain cell adhesion.
    supporting_text: >-
      Moreover, structure-function analysis reveals that AAK1L kinase activity, as well
      as its C-terminal domain, is essential for cell adhesion maintenance.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human HeLa-cell depletion and structure-function evidence for the long AAK1
      isoform. EHD3 is a cooperating factor, so the recycling phenotype is not
      attributable solely to AAK1L.
- id: PMID:26853940
  title: "Family-wide Structural Analysis of Human Numb-Associated Protein Kinases."
  findings:
  - statement: The human AAK1 kinase domain was structurally resolved at 1.95 Å in an inhibitor-bound complex.
    supporting_text: >-
      The structure of AAK1 was solved in complex with a small-molecule inhibitor to
      1.95 Å resolution in space group P212121 with two AAK1 kinase domains per
      asymmetric unit (chains A and B) (Table 1).
    reference_section_type: RESULTS
  - statement: Recombinant AAK1 directly phosphorylated an AP2-medium-subunit-derived peptide in vitro.
    supporting_text: >-
      A 17-mer synthetic peptide corresponding to the AAK1/BIKE phosphorylation site on
      the medium subunit of AP2 was used to test kinase activity. Phosphorylation of the
      substrate in the presence of AAK1 was confirmed by mass spectrometry (Figure S1).
    reference_section_type: RESULTS
  - statement: AAK1's assembled regulatory spine without activation-loop phosphorylation supports constitutive catalytic competence.
    supporting_text: >-
      Similarly, in structures of BIKE and AAK1 there is alignment of the R spine in the
      absence of phosphorylation, suggesting that NAK family members are constitutively
      active kinases (Figure 2C).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct structural and biochemical characterization of human AAK1. Constitutive
      activity is a kinase-domain structural inference; regulation of full-length AAK1
      in cells remains context dependent.
- id: PMID:30605688
  title: "WNT Activates the AAK1 Kinase to Promote Clathrin-Mediated Endocytosis of LRP6 and Establish a Negative Feedback Loop."
  findings:
  - statement: Human cell-line perturbations establish AAK1 as a negative regulator of WNT signaling across multiple tissue-derived models.
    supporting_text: Together, these data establish that AAK1 negatively regulates WNT signaling in cells derived from multiple tissue types.
    reference_section_type: RESULTS
  - statement: AAK1 promotes clathrin-mediated endocytosis and lysosomal degradation of LRP6, forming a negative-feedback mechanism for WNT signaling.
    supporting_text: >-
      Together, these results suggest that AAK1 inhibits WNT signaling by inducing CME
      endocytosis and lysosomal degradation of LRP6.
    reference_section_type: RESULTS
  - statement: Delayed WNT3A-induced phosphorylation of AP2M1 requires AAK1 expression and kinase activity.
    supporting_text: The WNT3A-induced phosphorylation of AP2M1 required AAK1 expression and activity.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct gain-of-function, knockdown, inhibitor, trafficking, and AP2M1-phosphorylation
      evidence in human HEK293T, HT1080, RKO, and related cell models.
- id: PMID:34315807
  title: "Dysregulation of the AP2M1 phosphorylation cycle by LRRK2 impairs endocytosis and leads to dopaminergic neurodegeneration."
  findings:
  - statement: With equimolar recombinant kinases, AAK1 phosphorylated AP2M1 more potently than LRRK2 in vitro.
    supporting_text: Our results showed that AAK1 was more potent than LRRK2 in phosphorylating AP2M1 in vitro.
    reference_section_type: RESULTS
  - statement: In human SH-SY5Y cells, AAK1 increased endogenous AP2M1 phosphorylation independently of LRRK2.
    supporting_text: >-
      We found that AAK1 increased the amount of endogenous AP2M1 phosphorylation in both
      LRRK2 WT and KO cells (Fig. 3, E and F), suggesting that AAK1 can phosphorylate
      AP2M1 independently of LRRK2.
    reference_section_type: RESULTS
  - statement: Mouse tissue evidence indicates low relative AAK1 abundance in brain but high abundance in thyroid.
    supporting_text: >-
      Notably, we found that unlike LRRK2, the expression of AAK1 was relatively low in
      mouse brain tissue (Fig. 3, I and J). In contrast, AAK1 was highly expressed in the
      mouse thyroid gland where LRRK2 expression was relatively low.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct AP2M1 kinase evidence includes recombinant assays and human SH-SY5Y cells.
      Tissue-distribution conclusions are specifically from mouse and are not presented
      as direct human tissue evidence.
- id: PMID:41407700
  title: "AAK1 activation-mediated iron trafficking drives ferroptotic cell death."
  findings:
  - statement: Recombinant active PKCβII directly phosphorylates AAK1; phosphatase treatment removes the signal.
    supporting_text: >-
      The level of Ser/Thr phosphorylation of AAK1 protein increased significantly in the
      presence of recombinant active PKCβII kinase, but was blocked in the addition of
      λ-phosphatase (Fig. 3E, F).
    reference_section_type: RESULTS
  - statement: Activated AAK1 phosphorylates AP2M1, promoting clathrin-dependent TFR1 endocytosis, cellular iron accumulation, and ferroptosis.
    supporting_text: >-
      Mechanistically, activated AAK1 phosphorylates AP2M1, which facilitates the
      recruitment of clathrin to mediate the endocytosis of TFR1, increasing the levels
      of both cellular total iron and ferrous iron and thereby promoting ferroptosis.
    reference_section_type: ABSTRACT
  - statement: In nude-mouse xenografts of human MDA-MB-231 cells, AAK1 loss reduced IKE-induced ferroptosis and increased tumor growth.
    supporting_text: >-
      To further confirm the role of AAK1 during the process of ferroptosis in vivo, we
      performed xenograft tumor model by inoculating AAK1-knockout MDA-MB-231 cells with
      or without transfecting plasmids of wild-type or S670/T674Ala mutant AAK1 into nude
      mice. These nude mice were treated with IKE (a lipid-soluble form of erastin for
      animal experiment) or DMSO as control. As expected, knockout of AAK1 significantly
      inhibited ferroptosis through resistance of lipid peroxidation induced by IKE and
      promoted tumor growth (Fig. 6G–J).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct mechanistic evidence in multiple human cancer cell lines identifies the
      PKCβII-AAK1-AP2M1-TFR1 iron-uptake axis. The tumor-growth result is a human-cell
      xenograft in mice, and ferroptosis is an induced contextual role rather than
      necessarily AAK1's basal core function.
- id: PMID:42082516
  title: "AAK1-mediated phosphorylation of PDLIM5 and Talin1 promotes focal adhesion disassembly to accelerate cell migration."
  findings:
  - statement: Biochemical and phosphoproteomic screens identify PDLIM5 and Talin1 as direct AAK1/BMP2K substrates.
    supporting_text: >-
      Here, using motif-guided in silico, biochemical, and phosphoproteomic screens, we
      identify PDLIM5 and Talin1 as direct AAK1/BMP2K substrates.
    reference_section_type: ABSTRACT
  - statement: AAK1 has a specific, nonredundant kinase-dependent role in focal-adhesion turnover and cell migration in human RPE cells.
    supporting_text: >-
      AAK1 deletion or siRNA-mediated knockdown reproducibly impaired RPE migration by
      ~25% (Fig. 3d, e and Supplementary Fig. 1h), whereas BMP2K loss had no measurable
      effect, revealing a specific and non-redundant role for AAK1 in cell motility.
    reference_section_type: RESULTS
  - statement: Human RPE-cell phosphoproteomics and in-vitro kinase assays failed to support NUMB Thr102 as an AAK1/BMP2K substrate, directly disputing the PMID:18657069 claim.
    supporting_text: >-
      Furthermore, our global phosphoproteome profiling of RPE cells failed to detect
      phosphorylation of the previously proposed substrates Dab2 T109, Arh T104, or NUMB
      T102. This conclusion is supported by both our in vitro kinase assays and the
      absence of phosphorylation evidence in high-throughput databases, such as
      PhosphoSitePlus (Fig. 1h, i), which suggests that Dab2 T109, Arh T104, and NUMB T102
      are unlikely to be physiological targets of AAK1 or BMP2K.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human RPE-cell genetics, biochemistry, phosphoproteomics, imaging, and
      focal-adhesion assays. The PDLIM5/Talin1 discovery initially combines AAK1 and
      BMP2K perturbation, but AAK1-specific genetics establish the migration role. Its
      negative NUMB Thr102 evidence materially disputes PMID:18657069 and is recorded as
      counterevidence rather than silently accepting the older claim.
