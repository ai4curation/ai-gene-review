- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: TAS
  original_reference_id: PMID:10339433
  qualifier: enables
  review:
    summary: TAS annotation of transcription coactivator activity based on the original RIP3 cloning paper.
    action: REMOVE
    reason: PMID:10339433 reports that the overexpressed RIP3 C-terminus activates NF-kappaB reporter
      activity; it does not show that RIPK3 binds transcription factors or the transcriptional machinery
      to coactivate transcription. NF-kappaB activation by RIPK3 is weak and indirect, and other work
      reports attenuation. No evidence supports coactivator activity.
    supported_by:
    - reference_id: PMID:10339433
      supporting_text: The carboxy-terminal domain of RIP3, like that of RIP, could activate the transcription
        factor NFkappaB and induce apoptosis when expressed in mammalian cells.
    - reference_id: PMID:10358032
      supporting_text: RIP3, however, attenuates both RIP and TNF receptor-1-induced NF-kappaB activation.
    - reference_id: PMID:21931591
      supporting_text: Because RIP3 is a weak inducer of NF-κB
