suggested_questions:
- question: Should RHIM-driven RIPK3 homo- and hetero-amyloid assembly be represented by a dedicated MF
    term (e.g. a signaling-scaffold or amyloid-forming activity) rather than through protein binding and
    amyloid fibril formation process terms?
  experts:
  - GO molecular function editors
  - necroptosis structural biologists
- question: Is the necrosome adequately represented in GO by GO:0097342 ripoptosome (necrosome as a synonym),
    given that the ripoptosome was originally defined as a RIPK1/FADD/caspase-8 platform that can signal
    apoptosis or necroptosis?
  experts:
  - GO cellular component editors
- question: Which mouse immune phenotypes transferred to human RIPK3 (lymphoid organ development, T cell
    homeostasis, cytotoxicity) reflect RIPK3 activity per se rather than unleashed necroptosis in Casp8/Fadd-deficient
    backgrounds?
  experts:
  - immunologists studying cell death in lymphocytes
suggested_experiments:
- description: Determine the functional significance of nuclear RIPK3 activation by comparing necroptosis
    kinetics and MLKL phosphorylation in human cells expressing nuclear-export-defective versus nuclear-import-defective
    RIPK3.
  hypothesis: Nuclear activation of RIPK3 accelerates, but is not required for, cytosolic necrosome formation.
  experiment_type: cell-based localization mutant rescue
- description: Map additional bona fide RIPK3 substrates beyond MLKL and RIPK1 in human necroptotic cells
    using kinase-dead and analog-sensitive RIPK3 with quantitative phosphoproteomics.
  hypothesis: RIPK3 has few direct substrates and MLKL phosphorylation accounts for its necroptotic output.
  experiment_type: chemical-genetic phosphoproteomics
