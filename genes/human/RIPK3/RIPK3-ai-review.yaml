  description: 'RHIM-mediated scaffold: the RIPK3 RHIM binds the RIPK1 RHIM (and those of ZBP1/TRIF) and
    polymerizes into hetero- and homo-amyloid fibrils that form the necrosome core; this assembly is required
    for RIPK3 kinase activation and necroptosis.'
  directly_involved_in:
