id: Q9Y572
gene_symbol: RIPK3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RIPK3 (receptor-interacting serine/threonine-protein kinase 3) is a cytosolic protein kinase
  with an N-terminal kinase domain and a C-terminal RIP homotypic interaction motif (RHIM). It is the
  essential kinase of necroptosis, a caspase-independent, lytic and inflammatory form of programmed cell
  death. Upon death-receptor (TNFR1), TLR3/4-TRIF or ZBP1 signaling under conditions of low caspase-8
  activity, RIPK3 is recruited through RHIM-RHIM interactions with RIPK1, TRIF or ZBP1 into the necrosome,
  a hetero-amyloid fibrillar signaling complex; RIPK3 RHIM polymerization drives RIPK3 autophosphorylation
  and activation. Activated RIPK3 phosphorylates the pseudokinase MLKL (T357/S358 in human), triggering
  MLKL oligomerization, plasma-membrane translocation and membrane rupture. RIPK3 also takes part in reciprocal
  phosphorylation with RIPK1. It shuttles between nucleus and cytoplasm, is restrained by caspase-8 cleavage
  and by E3 ligases such as PELI1 that degrade kinase-active RIPK3, and is targeted by herpesvirus RHIM
  proteins, consistent with a role of necroptosis in antiviral defense and inflammatory tissue injury.
