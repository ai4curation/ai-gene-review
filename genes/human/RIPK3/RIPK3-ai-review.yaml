- molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  description: 'Necroptotic effector kinase: within the necrosome, activated RIPK3 phosphorylates MLKL
    on T357/S358, the committing step that licenses MLKL oligomerization and membrane rupture, and participates
    in reciprocal phosphorylation with RIPK1.'
  directly_involved_in:
