  - ensembl:ENSMUSP00000022830
  review:
    summary: Electronic/ISS transfer from mouse Ripk3 of 'regulation of T cell mediated cytotoxicity'.
    action: MARK_AS_OVER_ANNOTATED
    reason: This is a mouse-to-human ortholog transfer (Ensembl Compara IEA or curator ISS from mouse
      Ripk3, Q9QZL0). Immune and lymphoid phenotypes of this kind in mice are best explained as indirect
      consequences of RIPK3-dependent necroptotic cell death (for example, lymphoaccumulation and T cell
      abnormalities when necroptosis is unleashed by loss of caspase-8/FADD), not as a distinct activity
      of RIPK3 within the named process. RIPK3's own molecular role is that of the necroptotic kinase
      acting on MLKL and RIPK1.
