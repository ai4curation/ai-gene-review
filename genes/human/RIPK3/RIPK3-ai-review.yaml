    supporting_text: MLKL was phosphorylated by RIP3 at the threonine 357 and serine 358 residues, and
      these phosphorylation events were critical for necrosis.
  - reference_id: PMID:19524512
    supporting_text: The kinase activity of RIP3 is essential for necrosis execution.
  - reference_id: PMID:19524513
    supporting_text: RIP3 regulates necrosis-specific RIP1 phosphorylation.
  - reference_id: Reactome:R-HSA-5218906
    supporting_text: Receptor-interacting serine/threonine-protein kinase 3 (RIPK3) was shown to activate
      mixed lineage kinase domain-like protein (MLKL) by phosphorylation of the threonine 357 (T357) and
      serine 358 (S358) residues
- molecular_function:
    id: GO:0120283
