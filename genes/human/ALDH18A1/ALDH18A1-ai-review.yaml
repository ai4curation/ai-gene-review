- question: Does endogenous human P5CS associate peripherally with the inner mitochondrial membrane
    in specific metabolic states, and which experiments underlie the Reactome compartment
    assignments?
- question: What is the target-level RNA crosslinking evidence for ALDH18A1 in the HeLa
    mRNA-interactome capture study, and does this binding have a functional role?
