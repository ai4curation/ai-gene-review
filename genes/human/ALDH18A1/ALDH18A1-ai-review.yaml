id: P54886
gene_symbol: ALDH18A1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALDH18A1 encodes mitochondrial delta-1-pyrroline-5-carboxylate synthase (P5CS), a
  bifunctional enzyme that converts L-glutamate to L-glutamate 5-semialdehyde. Its N-terminal
  glutamate 5-kinase domain uses ATP to form L-glutamyl 5-phosphate; its C-terminal gamma-glutamyl
  phosphate reductase domain uses NADPH to reduce this intermediate. The semialdehyde spontaneously
  cyclizes to pyrroline-5-carboxylate, which supplies proline synthesis and, through ornithine
  aminotransferase, ornithine synthesis. This pathway also supplies precursors for intestinal
  citrulline and arginine production. Human P5CS occupies the mitochondrial matrix and forms
  multimers and filaments whose organization changes with metabolic conditions. Alternative splice
  forms differ by two amino acids in the kinase region and have different ornithine-feedback
  sensitivities in mammalian isoform studies. Biallelic and heterozygous pathogenic variants cause
  forms of cutis laxa and hereditary spastic paraplegia. Reduced circulating proline and urea-cycle
  amino acids occur in some affected individuals, but are not universal across genotypes.
