id: P36896
gene_symbol: ACVR1B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACVR1B, also called ALK4 or ActRIB, is a single-pass type I membrane receptor with an intracellular
  serine/threonine kinase domain. It assembles with activin-bound type-II receptors ACVR2A or ACVR2B, which phosphorylate
  its regulatory GS domain. Activated ACVR1B phosphorylates SMAD2 and SMAD3 to couple extracellular ligand recognition
  to nuclear transcriptional responses. Its extracellular domain contacts activin within the assembled receptor
  complex, whereas the isolated type-I receptor does not efficiently capture ligand by itself. ACVR1B also transduces
  nodal signals with EGF-CFC coreceptors such as CRIPTO and can participate in myostatin/GDF signaling. These receptor
  pathways regulate cell growth, differentiation and developmental patterning, with context-dependent effects in
  erythroid, neural and trophoblast cells. FKBP12 and inhibitory SMAD7-associated complexes restrain receptor signaling;
  truncated kinase-domain isoforms can act as dominant-negative receptors.
