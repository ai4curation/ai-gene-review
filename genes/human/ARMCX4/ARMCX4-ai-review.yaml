description: ARMCX4 is a large (2,290-residue) X-linked protein of the eutherian ARMCX family, with three
  armadillo repeats near its C-terminus and a predicted N-terminal transmembrane helix. Low-frequency
  ARMCX4 variants were associated with male infertility, and knockdown of Armcx4 in mouse spermatogonial
  stem cells repressed their differentiation in vitro. Its molecular function and location are unknown.
