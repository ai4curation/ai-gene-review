knowledge_gaps:
- gap_statement: ARMCX4 has no known molecular activity or experimentally determined location; its only
    functional data are a male-infertility variant association and an in vitro mouse SSC differentiation
    phenotype.
  boundary: 'Established: X-linked ARMCX family member with C-terminal ARM repeats and a predicted N-terminal
    TM helix; protein-level evidence; a few interaction records (IntAct) and CRISPR screen hits (BioGRID-ORCS).
    Reported: infertility-associated variants and reduced SSC differentiation after Armcx4 knockdown in
    mouse SSCs. Not established: subcellular location, binding partners, molecular activity or an in vivo
    role.'
