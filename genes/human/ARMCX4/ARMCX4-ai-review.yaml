suggested_questions:
- question: The family review places ARMCX4 outside the mitochondria-targeted ARMCX subfamily. What membrane,
    if any, does its predicted N-terminal helix anchor it to, and does it share GPRASP-like roles in GPCR
    sorting?
suggested_experiments:
- description: Generate an Armcx4 knockout mouse and assess spermatogenesis and fertility.
