description: ARMCX4 is a large (2,290-residue) X-linked protein of the eutherian GPRASP/ARMCX family,
  with four armadillo repeats near its C-terminus and a predicted N-terminal transmembrane helix. It belongs
  to the subfamily that lacks the mitochondrial-targeting transmembrane domain of ARMCX1-3, ARMCX6 and
  ARMC10. A low-frequency ARMCX4 variant was associated with male infertility, and knockdown of Armcx4
  in mouse spermatogonial stem cells repressed their differentiation in vitro. Its molecular function
  and location are unknown.
