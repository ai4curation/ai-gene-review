knowledge_gaps:
- gap_statement: ARMCX4 has no known molecular activity or experimentally determined location; its only
    functional data are a male-infertility variant association and an in vitro mouse SSC differentiation
    phenotype.
  boundary: 'Established: X-linked GPRASP/ARMCX subfamily-1 member with four C-terminal ARM repeats and
    a predicted N-terminal TM helix, without the mitochondrial-targeting domain of subfamily 2; protein-level
    evidence; a few interaction records (IntAct: ATN1 and KLK6, both against isoform 2, which is likely
    subject to nonsense-mediated decay) and CRISPR screen hits (BioGRID-ORCS). Reported: an infertility-associated
    variant and reduced SSC differentiation after Armcx4 knockdown in mouse SSCs. Not established: subcellular
    location, binding partners, molecular activity or an in vivo role.'
