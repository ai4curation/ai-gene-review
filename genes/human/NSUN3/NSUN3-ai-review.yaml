id: Q9H649
gene_symbol: NSUN3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NSUN3 is a mitochondrial matrix RNA methyltransferase of the NOL1/NOP2/Sun (RsmB/NOP)
  family of class I-like AdoMet-dependent methyltransferases. It recognises the anticodon stem-loop
  of mitochondrial tRNA(Met) and methylates the wobble cytosine C34 to 5-methylcytidine (m5C34).
  m5C34 is then oxidised by the dioxygenase ALKBH1 to 5-formylcytidine (f5C34), which allows
  the single mitochondrial tRNA(Met) to read AUA as well as AUG codons in initiation and elongation
  of mitochondrial translation. Loss of NSUN3 abolishes m5C34 and f5C34, reduces mitochondrial
  protein synthesis and oxygen consumption, and biallelic NSUN3 variants cause combined oxidative
  phosphorylation deficiency 48, a mitochondrial encephalomyopathy.
