- term:
    id: GO:0070129
    label: regulation of mitochondrial translation
  evidence_type: IMP
  original_reference_id: PMID:27356879
  qualifier: involved_in
  review:
    summary: NSUN3 loss (patient cells, knockdown, knockout) strongly reduces mitochondrial
      protein synthesis, because unmodified mt-tRNA(Met) lacks m5C34/f5C34 needed to decode
      AUA and for efficient initiation.
    action: MODIFY
    reason: The phenotype shows NSUN3 is required for efficient mitochondrial translation, but
      NSUN3 does not regulate translation; it installs a constitutive tRNA modification. The
      process NSUN3 actually executes is methylation of a mitochondrial tRNA, so the annotation
      is better expressed as mitochondrial tRNA methylation (GO:0070901). The translational
      defect is a downstream consequence.
    proposed_replacement_terms: &id005
    - id: GO:0070901
      label: mitochondrial tRNA methylation
    supported_by: &id006
    - reference_id: PMID:27356879
      supporting_text: We show that NSun3 is required for deposition of m(5)C at the anticodon
        loop in the mitochondrially encoded transfer RNA methionine (mt-tRNA(Met))
    - reference_id: PMID:27497299
      supporting_text: Depletion of either NSUN3 or ABH1 strongly affects mitochondrial translation
        in human cells, implying that modifications generated by both enzymes are necessary
        for mt-tRNAMet function
