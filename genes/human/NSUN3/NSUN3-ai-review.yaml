core_functions:
- description: AdoMet-dependent methylation of cytosine 34 of mitochondrial tRNA(Met) to 5-methylcytidine
    in the mitochondrial matrix, initiating ALKBH1-dependent formation of 5-formylcytidine that
    expands codon recognition of mt-tRNA(Met).
  molecular_function:
    id: GO:0016428
    label: tRNA (cytidine-N5)-methyltransferase activity
  directly_involved_in:
  - id: GO:0002127
    label: tRNA wobble base cytosine methylation
  - id: GO:0070901
    label: mitochondrial tRNA methylation
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:27214402
    supporting_text: We reconstituted formation of 5-methylcytidine (m(5)C) at position 34 (m(5)C34)
      on mt-tRNA(Met) with recombinant NSUN3 in the presence of AdoMet, demonstrating that NSUN3-mediated
      m(5)C34 formation initiates f(5)C34 biogenesis
  - reference_id: PMID:27497299
    supporting_text: Together, our data reveal how modifications in mt-tRNAMet are generated
      by the sequential action of NSUN3 and ABH1, allowing the single mitochondrial tRNAMet
      to recognise the different codons encoding methionine
  - reference_id: PMID:27356879
    supporting_text: Both NSun3 and mtSSB1 were resistant to proteinase K treatment of the mitochondrial
      fraction
proposed_new_terms: []
suggested_questions:
- question: Does NSUN3 modify any mitochondrial RNA other than C34 of mt-tRNA(Met), and how
    does it discriminate mt-tRNA(Met) from other mt-tRNAs?
- question: Is m5C34 itself (before ALKBH1 oxidation) functionally sufficient for initiation-codon
    reading, given its preferential use in initiation in vitro?
suggested_experiments:
- description: Transcriptome-wide m5C mapping (bisulfite or methylation-iCLIP) in NSUN3-knockout
    versus rescued cells to define the complete NSUN3 target set.
- description: Mitochondrial ribosome profiling of NSUN3-null cells to quantify codon-specific
    (AUA versus AUG) translation defects.
