  - *id006
suggested_questions:
- question: Is the NECTIN4-TIGIT interaction reproducible with physiological expression levels, and does
    it act in vivo in NK-cell control of tumours?
- question: Which adhesion partners and afadin-dependent signals underlie the ectodermal dysplasia-syndactyly
    phenotype of NECTIN4 loss?
suggested_experiments:
- description: Surface plasmon resonance of purified NECTIN4 and TIGIT ectodomains alongside PVR controls,
    plus TIGIT reporter assays with NECTIN4-knockout tumour cells.
