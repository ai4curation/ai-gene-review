core_functions:
- description: Transmembrane Ig-superfamily adhesion molecule at adherens junctions that mediates homophilic
    and heterophilic (nectin-1) trans cell-cell adhesion via its extracellular IgV domain, linked intracellularly
    to afadin.
  molecular_function:
    id: GO:0098631
    label: cell adhesion mediator activity
