id: Q96NY8
gene_symbol: NECTIN4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NECTIN4 (nectin-4, PVRL4) is a single-pass type I transmembrane glycoprotein of the immunoglobulin
  superfamily with three extracellular Ig-like domains (V, C, C) and a cytoplasmic tail that binds afadin.
  It localizes to cadherin-based adherens junctions at the plasma membrane, where its N-terminal IgV domain
  mediates homophilic trans-interaction and heterophilic adhesion with nectin-1, contributing to epithelial
  cell-cell adhesion. It is expressed mainly in placenta and skin and is re-expressed in many carcinomas;
  its ectodomain can be shed by ADAM17. Loss-of-function mutations cause ectodermal dysplasia-syndactyly
  syndrome. Nectin-4 is the epithelial receptor for measles virus, a reported ligand for the inhibitory
  NK-cell receptor TIGIT, and the target of the antibody-drug conjugate enfortumab vedotin.
