id: P04406
gene_symbol: GAPDH
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens (Human)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for human GAPDH. The result is the mirror image of what a naive
  expectation would give: not one of the five calls is glycolytic. Instead the model returns the GAIT
  complex, S-nitrosylation chemistry and nitrosylase activity - three of this review's four moonlighting
  core functions - all as exact GOA matches. The glyceraldehyde-3-phosphate dehydrogenase activity
  that names the protein is absent from the top five, while the free-text channel returns the UniProt
  comment that pairs both activities. For a multifunctional protein this is unusually good coverage
  of the non-obvious half and a complete miss of the obvious half. Assessment: 2 correct not novel
  (CNN), 1 uncertain (UNC).
