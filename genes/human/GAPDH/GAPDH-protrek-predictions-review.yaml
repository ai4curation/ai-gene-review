    summary: >-
      Top-ranked hit (score 17.97), an exact GOA match and this review's third core function. The
      GAIT complex is the interferon-gamma-activated inhibitor of translation, in which GAPDH is a
      subunit regulating inflammatory mRNA translation - a highly specific moonlighting assignment
      that a family-level method would not reach. Correct and already annotated.
