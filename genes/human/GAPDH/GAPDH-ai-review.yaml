- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: GAPDH translocates to the nucleus under stress conditions where it functions
      as a S-nitrosylase to regulate apoptosis by modifying nuclear proteins through
      S-nitrosylation.
    action: ACCEPT
    reason: Nuclear localization is essential for GAPDH's moonlighting function as
      a peptidyl-cysteine S-nitrosylase that regulates apoptotic processes by S-nitrosylating
      nuclear target proteins.
    supported_by:
    - reference_id: PMID:38615102
      supporting_text: At the molecular levels such stressors lead to S-nitrosylation
        (or possibly oxidation) at Cys-150, which allows post-translationally modified
        GAPDH to interact with a chaperon protein Siah1 creating a protein complex
        of GAPDH-Siah1. Through this process, GAPDH loses its glycolytic activity and
        is translocated to the nucleus as a GAPDH-Siah1 complex
    - reference_id: PMID:38615102
      supporting_text: Our group also reported that the replacement of lysine 225 for
        alanine (K225A) on GAPDH abolished GAPDH-Siah1 binding
    - reference_id: PMID:38611852
      supporting_text: In the context of DNA repair, it is found that the activation
        of the tyrosine kinase Src occurs under DNA damage stress, leading to the phosphorylation
        of GAPDH at Tyr41. This phosphorylation event is crucial for the nuclear translocation
        of GAPDH.
