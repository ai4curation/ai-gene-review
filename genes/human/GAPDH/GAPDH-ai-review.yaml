- term:
    id: GO:0050661
    label: NADP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      InterPro-derived NADP binding. Human GAPDH is the NAD-dependent enzyme; the family
      signature also covers NADP-dependent dehydrogenases of other lineages.
    action: REMOVE
    reason: >-
      The term comes from an InterPro signature for the
      glyceraldehyde-3-phosphate/erythrose-4-phosphate dehydrogenase family, which also
      covers NADP-dependent enzymes of plants and bacteria, and the mapping assigns both
      NAD binding and NADP binding to every member. Human GAPDH is the NAD-dependent
      phosphorylating enzyme of glycolysis and uses NAD+ as its coenzyme; no evidence
      indicates that it binds NADP. The NAD binding annotation from the same signature
      is accepted, and the NADP half of the mapping is an over-propagation to an
      NAD-specific member, so it is removed.
