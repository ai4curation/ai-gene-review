- term:
    id: GO:0050821
    label: protein stabilization
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      Protein stabilization (ISS), inferred from the rodent ortholog, where GAPDH binds
      and stabilizes Siah1 (PMID:15951807).
    action: KEEP_AS_NON_CORE
    reason: >-
      The row is inferred from the rodent ortholog, annotated by direct assay in the
      study of the nitric oxide-GAPDH-Siah1 cell death cascade, which reports that GAPDH
      stabilizes the E3 ligase Siah1 after binding it (PMID:15951807). The claim
      therefore has direct experimental support and is not a duplicate of a location
      annotation. Stabilization of Siah1 is one step of a stress-induced moonlighting
      pathway rather than a core function of GAPDH, so the row is kept as non-core.
    supported_by:
    - reference_id: PMID:15951807
      supporting_text: GAPDH stabilizes Siah1, facilitating its degradation of nuclear proteins.
- term:
