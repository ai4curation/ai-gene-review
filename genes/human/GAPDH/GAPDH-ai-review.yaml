id: P04406
gene_symbol: GAPDH
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GAPDH (Glyceraldehyde-3-phosphate dehydrogenase) is a multifunctional
  protein best known for its role in glycolysis, catalyzing the oxidation and phosphorylation
  of glyceraldehyde-3-phosphate to 1,3-bisphosphoglycerate as a homotetramer in the
  cytosol. Beyond metabolism, GAPDH has extraordinary moonlighting functions including
  roles in transcription, apoptosis, DNA repair (via interaction with DNA polymerase
  β), membrane trafficking, cytoskeletal dynamics, and immune responses. It localizes
  to multiple cellular compartments (cytosol, nucleus, membrane, mitochondria) and
  its diverse functions are regulated by post-translational modifications including
  S-nitrosylation (at Cys-150), Src-mediated Tyr41 phosphorylation, acetylation, and
  oxidation. A key stress-responsive moonlighting axis is the nuclear-GAPDH (N-GAPDH)
  cascade in which S-nitrosylation at Cys-150 enables Siah1 binding (requiring Lys-225)
  and nuclear translocation of a small (~1-2%) signaling pool that is functionally
  separable from bulk glycolytic activity. This context-dependent multifunctionality
  makes GAPDH a prime example of protein moonlighting, where a single protein performs
  multiple unrelated functions depending on cellular conditions and localization.
