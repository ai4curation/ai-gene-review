  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      Neuron apoptotic process (ISS), inferred from the rodent ortholog, from the nitric
      oxide-GAPDH-Siah1 cell death cascade (PMID:15951807, PMID:19607794).
    action: KEEP_AS_NON_CORE
    reason: >-
      The row is inferred from the rodent ortholog, annotated from experiments in the
      nitric oxide-GAPDH-Siah1 cascade, in which S-nitrosylated GAPDH binds Siah1, moves
      to the nucleus and promotes cell death, including glutamate-induced death of
      neurons (PMID:15951807, PMID:19607794). The claim has experimental support and is
      consistent with the apoptotic process annotation that this review keeps as
      non-core; it is not a duplicate of a location annotation. It is kept as non-core
      with that row.
    supported_by:
