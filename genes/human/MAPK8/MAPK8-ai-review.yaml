core_functions:
- description: 'Terminal MAP kinase of the stress/cytokine-activated JNK cascade: dual phosphorylation
    of Thr183/Tyr185 by MKK4 and MKK7 (docked via D-sites and organised on JIP scaffolds) activates JNK1,
    which relays stress signals by phosphorylating Ser/Thr-Pro sites on downstream substrates.'
  molecular_function:
    id: GO:0004707
    label: MAP kinase activity
  directly_involved_in:
  - id: GO:0007254
    label: JNK cascade
  - id: GO:0051403
    label: stress-activated MAPK cascade
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: file:human/MAPK8/MAPK8-uniprot.txt
    supporting_text: Dually phosphorylated on Thr-183 and Tyr-185 by MAP2K7 and MAP2K4, which activates
      the enzyme
  - reference_id: PMID:11062067
    supporting_text: MKK4 shows a striking preference for the tyrosine residue (Tyr-185), and MKK7 a striking
      preference for the threonine residue (Thr-183)
  - reference_id: PMID:11062067
    supporting_text: MKK4 and MKK7 together produce a synergistic increase in the activity of each SAPK1/JNK
      isoform in vitro
  - reference_id: PMID:16533805
    supporting_text: Full-length MKK7 containing combined D1/D2 mutations was compromised for binding
      to JNK1 and exhibited reduced JNK1 kinase activity when compared with wild-type MKK7.
  - reference_id: PMID:8654373
    supporting_text: Treatment of cells with interleukin-1 (IL-1) caused activation of the JNK isoforms.
  - reference_id: file:human/MAPK8/MAPK8-deep-research-falcon.md
    supporting_text: It is activated by MKK4/MKK7-mediated phosphorylation of Thr183/Tyr185 and transmits
      stress and receptor signals to c-Jun, ATF2, and other substrates.
- description: Nuclear JNK1 phosphorylates AP-1 family and other transcription factors (c-Jun N-terminal
    Ser63/Ser73, ATF2, JDP2, Elk-1, NFAT3) to regulate stress-responsive transcription, and phosphorylates
    HSF1 to suppress its activity.
  molecular_function:
    id: GO:0004705
    label: JUN kinase activity
  directly_involved_in:
  - id: GO:0007258
    label: JUN phosphorylation
  - id: GO:0007254
    label: JNK cascade
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:8654373
    supporting_text: The protein kinase activity of these JNK isoforms was measured using the transcription
      factors ATF2, Elk-1 and members of the Jun family as substrates.
  - reference_id: PMID:18307971
    supporting_text: we were able to phosphorylate mouse and human Jun dimerization protein 2 (JDP2) and
      human activation transcription factor 2 (ATF-2) by the action of human JNK1 that was expressed simultaneously
  - reference_id: file:human/MAPK8/MAPK8-uniprot.txt
    supporting_text: MAPK8/JNK1 phosphorylates a number of transcription factors, primarily components
      of AP-1 such as JUN, JDP2 and ATF2 and thus regulates AP-1 transcriptional activity
  - reference_id: PMID:17875713
    supporting_text: the nuclear factor of activated T3 (NFAT3) is phosphorylated by JNK1 or JNK2 at Ser(213)
      and Ser(217)
  - reference_id: PMID:10747973
    supporting_text: JNK binds to HSF-1 in the conserved mitogen-activated protein kinases binding motifs
      and phosphorylates HSF-1 in the regulatory domain
  - reference_id: Reactome:R-HSA-168136
    supporting_text: JNK (c-Jun N-terminal Kinase) phosphorylates several transcription factors including
      c-Jun after translocation to the nucleus.
- description: Cytoplasmic JNK1 phosphorylates Bcl-2 family proteins, releasing BIM and BMF from motor
    complexes to promote intrinsic apoptosis, or inactivating BAD (Thr201) to promote survival, and phosphorylating
    BCL2 to free Beclin 1 for starvation-induced autophagy; the direction of the effect depends on stimulus
    and cell type.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:2001244
    label: positive regulation of intrinsic apoptotic signaling pathway
  - id: GO:0043066
    label: negative regulation of apoptotic process
  - id: GO:0016241
    label: regulation of macroautophagy
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:14967141
    supporting_text: JNK phosphorylates BAD at threonine 201, thereby inhibiting BAD association with
      the antiapoptotic molecule BCL-X(L)
  - reference_id: PMID:21095239
    supporting_text: Epo-activated JNK1 phosphorylated Bad at threonine 201, thereby inhibiting the association
      of Bad with the anti-apoptotic molecule B-cell lymphoma-extra large (Bcl-X(L))
  - reference_id: Reactome:R-HSA-139918
    supporting_text: MAPK8 (JNK) phosphorylates BCL2L11 (BIM) on a DLC-binding motif (DKSTQTP)
  - reference_id: Reactome:R-HSA-139908
    supporting_text: MAPK8 (JNK) phosphorylates BMF on a DLC binding motif DKATQTLSP
  - reference_id: PMID:26546165
    supporting_text: Phosphorylation of Bcl-2 in response to starvation is mediated by JNK1
suggested_questions:
- question: What is the correct source publication for the IEP 'cellular response to mechanical stimulus'
    row attributed to PMID:19593445 (a BAD/prostate cancer paper that does not mention JNK), and does
    the PAINT IBD for response to mechanical stimulus at PTN008602925 rest on any other verifiable descendant
    evidence?
- question: The GOA WITH/FROM for the JNK1-TAK1 interaction (PMID:11865055) is UniProtKB:P27448 (MARK3/C-TAK1),
    whereas the paper studies TAK1 = MAP3K7 (O43318); should the partner identifier be corrected?
- question: Many process rows (DR5 induction, CD38 cyclase activity, response to glutamine deprivation)
    rest on pan-JNK inhibitors or antibodies; which of these are JNK1-specific rather than shared with
    JNK2 (MAPK9)?
- question: Should the many JNK1 substrates (c-Jun, ATF2, BAD, BIM, BMF, SIRT1, SIRT6, NLRP3, ALKBH5,
    4E-T, YAP1) be captured as has_input on JUN/MAP kinase activity in JNK-cascade GO-CAMs rather than
    as regulator MFs or bare binding rows?
suggested_experiments:
- description: Analog-sensitive JNK1 (MAPK8) allele expressed in MAPK8/MAPK9 double-knockout cells, combined
    with thiophosphate labelling and quantitative phosphoproteomics after anisomycin, UV or TNF stimulation,
    to define direct JNK1 substrates and separate JNK1-specific from JNK2-shared outputs.
- description: Isoform-selective genetic perturbation (MAPK8 vs MAPK9 knockout with rescue) in cells subjected
    to cyclic stretch or shear stress to test whether JNK1 is required for mechanical-stimulus responses.
