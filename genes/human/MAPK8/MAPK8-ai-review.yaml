id: P45983
gene_symbol: MAPK8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MAPK8 encodes c-Jun N-terminal kinase 1 (JNK1, SAPK1c), a ubiquitously expressed, proline-directed
  serine/threonine protein kinase of the CMGC group and the JNK subfamily of mitogen-activated protein
  kinases. JNK1 is the terminal kinase of the stress-activated JNK cascade: pro-inflammatory cytokines
  (IL-1, TNF), oxidative, genotoxic, UV and other stresses activate MAP3Ks that act through the dual-specificity
  kinases MKK4 (MAP2K4) and MKK7 (MAP2K7), which phosphorylate the activation-loop Thr183-Pro-Tyr185 motif
  (MKK7 preferring Thr183 and MKK4 Tyr185). Docking interactions organise signalling on JIP-family scaffolds
  and direct JNK1 to substrates carrying D-motifs; activity is terminated by MAPK phosphatases such as
  DUSP16 (MKP-7) and DUSP8. Activated JNK1 enters the nucleus and phosphorylates AP-1 and related transcription
  factors (c-Jun Ser63/Ser73, ATF2, JDP2, Elk-1, NFAT3, HSF1), and in the cytoplasm phosphorylates Bcl-2
  family proteins (BAD, BIM, BMF, BCL2) and many other substrates (YAP1, SIRT1, SIRT6, CDT1, 4E-T, NLRP3,
  ALKBH5, BMAL1/CLOCK). Through these outputs JNK1 contributes, in a strongly context-dependent manner,
  to stress-induced apoptosis or survival, autophagy, inflammasome priming, circadian timing, DNA repair,
  neuronal development and metabolic homeostasis. JNK1 shares most substrates and functions with its paralog
  JNK2 (MAPK9).'
