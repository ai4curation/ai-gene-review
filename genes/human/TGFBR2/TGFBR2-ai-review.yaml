    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32814053
  qualifier: enables
  supporting_entities:
  - UniProtKB:P40227
  review:
    summary: bare protein binding from a neurodegeneration interactome screen
    action: REMOVE
    reason: This UniProtKB:P40227 row comes from a large neurodegeneration yeast-two-hybrid
      interactome. It does not identify a TGFBR2 catalytic, ligand-binding or adaptor activity, so
      bare GO:0005515 is removed as uninformative under the protein-binding policy while preserving
      the original partner row.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: Here, we report on an interactome map that focuses on neurodegenerative
        disease (ND), connects ∼5,000 human proteins via ∼30,000 candidate interactions and is
        generated by systematic yeast two-hybrid interaction screening of ∼500 ND-related proteins
        and integration of literature interactions.
