id: P37173
gene_symbol: TGFBR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TGFBR2 is the canonical type II transforming growth factor beta receptor. Its
  extracellular domain binds TGFB-family ligands at the cell surface and its constitutively active
  intracellular kinase recruits and phosphorylates TGFBR1, initiating SMAD2/3 signaling and
  non-canonical branches. The receptor is embedded in many regulatory membrane complexes, but its
  conserved molecular role is ligand recognition and activation of the type-I TGF-beta receptor.
