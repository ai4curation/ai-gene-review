id: Q15596
gene_symbol: NCOA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NCOA2 (SRC-2/TIF2/GRIP1) is a p160-family nuclear transcriptional coregulator. Its receptor-interaction
  region contains LXXLL motifs, while activation regions recruit CBP/p300 and other transcriptional cofactors.
  It enhances transcription by multiple nuclear receptors in ligand-, promoter- and cell-dependent settings
  and participates in metabolic and circadian transcriptional programs. NCOA2 can also inhibit GLI transcription
  factors and Hedgehog signaling in tested cellular contexts. Thus its regulatory sign and partner dependence
  vary with the transcription factor; it is neither restricted to androgen receptor signaling nor uniformly
  required for all androgen responses.
