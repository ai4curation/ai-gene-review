id: P07204
gene_symbol: THBD
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Thrombomodulin (CD141) is a type I transmembrane glycoprotein of vascular endothelial cells. Its extracellular
  region consists of an N-terminal C-type lectin-like domain, six EGF-like repeats and a Ser/Thr-rich stalk carrying
  a chondroitin sulfate chain, followed by a single transmembrane helix and a short cytoplasmic tail. It has no
  enzymatic activity of its own. It binds thrombin at anion-binding exosite I through EGF repeats 5-6, which blocks
  thrombin from fibrinogen, factors V and VIII and platelet PAR1. Through EGF repeats 4-5 it presents protein C
  and procarboxypeptidase B2 (TAFI) to the thrombin active site. This switches thrombin from a procoagulant to an
  anticoagulant and antifibrinolytic protease: the thrombin-thrombomodulin complex, helped by the endothelial protein
  C receptor, generates activated protein C, which inactivates factors Va and VIIIa, and it activates TAFI, which
  down-regulates fibrinolysis and inactivates the anaphylatoxins C3a and C5a. Thrombomodulin also accelerates factor
  I-mediated inactivation of C3b, and its lectin-like domain binds and sequesters the inflammatory mediator HMGB1,
  which gives it anti-inflammatory activity separate from its cofactor function. Loss of endothelial thrombomodulin
  increases barrier permeability and inflammatory signalling. Variants in THBD are associated with thrombophilia
  and with atypical hemolytic uremic syndrome.'
