  evidence_type: IDA
  original_reference_id: PMID:17379830
  qualifier: is_active_in
  review:
    summary: Plasma membrane location of THBD on human aortic endothelial cells, where it acts.
    action: ACCEPT
    reason: THBD is a single-pass type I membrane protein of the endothelial plasma membrane. PMID:17379830 shows
      it at the endothelial cell surface by immunofluorescence and coprecipitation, and it is active there (is_active_in).
      THBD spans the membrane, so plasma membrane is the precise location of the protein.
