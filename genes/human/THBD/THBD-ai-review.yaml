- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR015149
  review:
    summary: InterPro2GO mapping of the thrombomodulin EGF-like signature to transmembrane signaling receptor activity;
      THBD binds thrombin but transmits no signal across the membrane.
    action: MARK_AS_OVER_ANNOTATED
    reason: IPR015149 (Thrombomodulin-like, EGF-like) marks the EGF repeats that bind thrombin and present protein
      C and TAFI; they do not transduce a signal. THBD is called a thrombin receptor because it binds thrombin at
      the cell surface, but its demonstrated activity is cofactor enhancement of thrombin catalysis (captured here
      by GO:0061133). It is not shown to transmit a signal to the cytoplasm. The membrane-spanning claim is right;
      the signal transduction claim is not supported. Kept consistent with the GO:0038023 rows.
    supported_by:
    - &id008
      reference_id: PMID:10761923
      supporting_text: The Y-shaped thrombomodulin fragment binds to thrombin's anion-binding exosite-I, preventing
        binding of procoagulant substrates.
    - &id006
      reference_id: PMID:10761923
      supporting_text: profoundly alters the substrate specificity of thrombin from pro- to anticoagulant by activating
        protein C
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001881
  - InterPro:IPR018097
  review:
    summary: Calcium binding by the EGF-like repeats (consensus Ca2+ sites in EGF3 and EGF6); a structural requirement
      for cofactor activity.
    action: KEEP_AS_NON_CORE
    reason: The InterPro calcium-binding EGF signatures match THBD, and calcium binding has been measured directly
      on soluble THBD (PMID:10336638). Calcium supports thrombin binding and cofactor activity, but it is a structural
      property, not the function itself.
    supported_by:
    - &id001
      reference_id: PMID:10336638
      supporting_text: However, all three analogs still contained one tightly bound Ca2+ (Kd approximately 2 microm),
        which could only be removed by EDTA.
    - &id002
      reference_id: PMID:10336638
      supporting_text: A 75-fold decrease in the binding affinity of thrombin to TM was observed with immobilized
        solulin treated with EDTA to remove the high affinity Ca2+
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: TAS
  original_reference_id: PMID:10336638
  qualifier: enables
  review:
    summary: Direct equilibrium-dialysis measurement of two Ca2+ sites in the THBD EGF region; calcium is needed
      for high-affinity thrombin binding.
    action: KEEP_AS_NON_CORE
    reason: PMID:10336638 measures a tight Ca2+ site in EGF6 (Kd about 2 microM) and a weaker site attributed to
      EGF3. Removing the tight Ca2+ lowers thrombin affinity 75-fold. The binding is real and needed for activity,
      but it supports the cofactor function rather than being the function.
    supported_by:
    - *id001
    - *id002
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:14691232
  qualifier: enables
  supporting_entities:
  - UniProtKB:P00734
  review:
    summary: THBD binds thrombin at anion-binding exosite I; the cited paper measures this binding directly. Refine
      bare protein binding to protease binding.
    action: MODIFY
    reason: PMID:14691232 measures the kinetics and thermodynamics of soluble THBD binding to alpha-thrombin (Biacore,
      ITC, H/D exchange). The interaction is the basis of THBD function. Protease binding (GO:0002020) states what
      was measured; the cofactor consequence is captured by the NEW GO:0061133 row. The paper measures binding only,
      not activity enhancement, so the replacement stops at binding.
    supported_by:
    - &id012
      reference_id: PMID:14691232
      supporting_text: Thrombin binds thrombomodulin (TM) at anion binding exosite 1, an allosteric site far from
        the thrombin active site.
    proposed_replacement_terms:
    - id: GO:0002020
      label: protease binding
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:17379830
  qualifier: enables
  supporting_entities:
  - UniProtKB:P07093
  review:
    summary: Binding to protease nexin-1 (SERPINE2) through the THBD chondroitin sulfate chain; bare protein binding
      is uninformative.
    action: REMOVE
    reason: PMID:17379830 shows that PN-1 binds THBD, mainly through its chondroitin sulfate chain, and that the
      complex reduces protein C activation. The interaction is real, but bare GO:0005515 names no function, and
      THBD is the target of regulation here, not the regulator. Removed under the protein-binding policy. Removal
      does not mean the interaction is false.
    supported_by:
    - &id003
      reference_id: PMID:17379830
      supporting_text: Double immunofluorescence studies indicated that PN-1 and TM were colocalized at the endothelial
        cell surface from which they were coprecipitated.
