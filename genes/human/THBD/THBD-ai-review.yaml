suggested_questions:
- question: Should the endothelial protein C receptor (PROCR) and thrombomodulin be represented together as the
    protein C activation complex, so that the thrombin:thrombomodulin:EPCR assembly can be annotated?
- question: Is lectin-like domain binding to HMGB1 physiologically relevant in vivo, as distinct from the anti-inflammatory
    effects of activated protein C generated by thrombomodulin?
suggested_experiments:
- description: Compare endothelial cells expressing thrombomodulin lacking the lectin-like domain with cofactor-dead
    (EGF5-6 mutant) thrombomodulin, to separate HMGB1 sequestration from activated protein C-dependent anti-inflammatory
    signalling.
