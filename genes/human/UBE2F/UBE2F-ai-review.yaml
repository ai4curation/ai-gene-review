id: F8WDQ9
gene_symbol: UBE2F
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  UBE2F is one of the two human NEDD8-conjugating E2 enzymes. The reviewed full-length product
  (UniProt Q969M7, 185 residues) accepts NEDD8 from the NAE1-UBA3 E1 onto its catalytic Cys116 and,
  together with the RING protein RBX2 (RNF7) and N-terminal-acetylation-dependent DCNL co-E3s,
  neddylates cullin-5, thereby activating CUL5-RING ubiquitin ligases. F8WDQ9 is a 101-residue
  alternative product of the same gene (Ensembl ENSP00000389685): residues 1-94 are identical to the
  canonical protein, covering the N-terminal E1-docking extension and the first part of the UBC fold,
  and are followed by a seven-residue alternative C-terminal tail. It lacks catalytic Cys116 and more
  than half of the UBC core, so it cannot form a NEDD8 thioester. Whether it is expressed as a stable
  protein, and whether its retained N-terminal segment binds E1 or DCNL partners, is unknown.
