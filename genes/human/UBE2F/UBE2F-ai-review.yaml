suggested_questions:
- question: Is the 101-residue F8WDQ9 product expressed endogenously, and does it bind E1, NEDD8 or
    cullin-ligase partners despite lacking the catalytic E2 cysteine?
- question: Is the ENST00000455999 transcript translated to a stable protein at all, or is it
    removed by nonsense-mediated decay? Do the proteomics peptides assigned to F8WDQ9 map only to
    its unique splice junction and tail, or are they shared with canonical UBE2F residues 1-94?
- question: Could an N-terminally acetylated F8WDQ9 polypeptide compete with canonical UBE2F for
    UBA3 or DCNL co-E3s, as the isolated acetylated 1-25 peptide does in vitro?
suggested_experiments:
- hypothesis: >-
    F8WDQ9 is not made as a stable protein in human cells, so it does not take part in
    CUL5 neddylation.
  description: >-
    Use targeted proteomics (PRM) with peptides that span the F8WDQ9-specific splice
    junction (canonical residue 94 joined to the alternative tail) to test whether the
    product is present in cell lines that express UBE2F. Pair this with long-read RNA
    sequencing of UBE2F transcripts.
- hypothesis: >-
    Because F8WDQ9 keeps the N-terminal UBA3- and DCNL-binding segment, overexpressing it
    can reduce UBE2F-dependent CUL5 neddylation by competing for these partners.
  description: >-
    Express F8WDQ9 and a matched N-terminal canonical fragment in UBE2F-replete cells and
    measure CUL5 neddylation and NOXA levels. In parallel, run in vitro pulse-chase NEDD8
    transfer assays with purified UBE2F, NAE1-UBA3, CUL5-RBX2 and DCNL3, adding acetylated
    F8WDQ9.
