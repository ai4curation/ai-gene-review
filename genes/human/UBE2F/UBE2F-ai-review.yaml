id: F8WDQ9
gene_symbol: UBE2F
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: UBE2F encodes a NEDD8-conjugating E2 that supports cullin-RING ubiquitin ligase activation.
  The short human product F8WDQ9 contains the N-terminal portion of UBE2F but lacks the catalytic cysteine
  and much of the UBC core present in the 185-residue reference product. Its expression, intracellular
  distribution and biochemical role are unresolved.
references:
- id: PMID:19250909
  title: E2-RING expansion of the NEDD8 cascade confers specificity to cullin modification.
  findings:
  - statement: Biochemical and cellular experiments identify full-length UBE2F as a NEDD8-conjugating
      E2, not a ubiquitin E2.
    supporting_text: 'the previously uncharacterized E2 UBE2F is a NEDD8-conjugating enzyme in vitro

      and in vivo.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary report checked against the cached abstract/full text; the evidence scope is
      stated in the finding.
- id: PMID:23300442
  title: Inhibition of a NEDD8 Cascade Restores Restriction of HIV by APOBEC3G.
  findings:
  - statement: Full-length UBE2F indirectly enables a ubiquitin-ligase pathway through cullin neddylation;
      this is distinct from intrinsic ubiquitin transfer.
    supporting_text: 'conjugation of NEDD8 to Cullin-5 by the NEDD8-conjugating

      enzyme UBE2F is required for HIV Vif-mediated degradation'
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary report checked against the cached abstract/full text; the evidence scope is
      stated in the finding.
