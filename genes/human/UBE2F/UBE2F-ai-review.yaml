id: F8WDQ9
gene_symbol: UBE2F
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  UBE2F (HGNC:12480) encodes one of the two human NEDD8-conjugating E2 enzymes. The
  canonical 185-residue product (UniProt Q969M7) receives NEDD8 from the NAE1-UBA3 E1
  on its catalytic Cys116 and, mainly with the RING protein RBX2, transfers it to
  cullin-5, which activates CRL5 ubiquitin ligases. F8WDQ9 is a 101-residue product of
  an alternative Ensembl transcript (ENST00000455999/ENSP00000389685) of the same gene.
  It matches canonical residues 1-94, which include the N-terminal E1-docking extension
  and the start of the UBC fold. Canonical residues 95-178 are missing, and a divergent
  seven-residue tail follows. The missing segment holds the HPN motif and the catalytic
  Cys116, so this product cannot form the NEDD8 thioester that the E2 reaction needs. It
  has been detected in human proteomics data, but nothing is known about its expression
  level, location or any activity of its own.
references:
- id: PMID:19250909
  title: E2-RING expansion of the NEDD8 cascade confers specificity to cullin modification.
  findings:
  - statement: Full-length UBE2F is a NEDD8-conjugating E2, and UBE2F/RBX2 and UBE2M/RBX1
      have different target cullin specificities.
    supporting_text: 'the previously uncharacterized E2 UBE2F is a NEDD8-conjugating enzyme in vitro

      and in vivo.'
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The cached copy is abstract-only. It defines the gene-level activity of the
      canonical Q969M7 product. It does not test F8WDQ9, which lacks the catalytic core, so it
      gives context for the gene and is not evidence of any F8WDQ9 activity.
- id: PMID:23300442
  title: Inhibition of a NEDD8 Cascade Restores Restriction of HIV by APOBEC3G.
  findings:
  - statement: Full-length UBE2F neddylates CUL5, which is required for Vif-mediated degradation
      of APOBEC3G. UBE2F acts upstream of ubiquitin transfer; it is not itself a ubiquitin E2.
    supporting_text: 'conjugation of NEDD8 to Cullin-5 by the NEDD8-conjugating

      enzyme UBE2F is required for HIV Vif-mediated degradation'
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text is cached. This is gene-level context for the canonical product only;
      F8WDQ9 was not studied.
- id: PMID:23201271
  title: Structural conservation of distinctive N-terminal acetylation-dependent interactions
    across a family of mammalian NEDD8 ligation enzymes.
  findings:
  - statement: Canonical UBE2F keeps its initiator methionine, which is N-terminally acetylated.
      An acetylated peptide of UBE2F residues 1-25 binds the DCNL3 PONY domain. F8WDQ9 contains
      this whole N-terminal segment unchanged.
    supporting_text: LC-MS/MS analysis revealed UBE2F as retaining its N-terminal methionine and
      being N-terminally acetylated
  - statement: An N-terminally acetylated UBE2F peptide competitively inhibits DCNL-stimulated
      NEDD8 transfer in vitro. Any fragment that keeps this segment could, in principle, do the
      same, but this has not been tested for F8WDQ9.
    supporting_text: N-terminal acetylation was absolutely required for the UBE2F peptide mediated
      inhibition.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text is cached and both quotes were checked. The work used the canonical
      protein and synthetic peptides. It shows which N-terminal interaction surfaces F8WDQ9 keeps,
      but it does not show that F8WDQ9 binds DCNL proteins in cells.
- id: file:human/UBE2F/UBE2F-bioinformatics/RESULTS.md
  title: Exact UBE2F product-to-reference sequence mapping
  findings:
  - statement: F8WDQ9 residues 1-94 are identical to Q969M7 residues 1-94. Its residues 95-101
      align only weakly to Q969M7 residues 179-185 (2 of 7 identical). It covers 70 of the 154
      residues of the UBC core and does not include active-site Cys116.
    supporting_text: '| Active site: Glycyl thioester intermediate | 116–116 | 0 / 1 | 0 |'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: This is a local, reproducible alignment of F8WDQ9 against the reviewed Q969M7
      product. I checked the deleted interval again against the reference sequence in
      alignment.txt. Canonical residues 95-178 include the HPN motif (His106-Pro107-Asn108) and
      Cys116. Only the input sequence came from the sibling JSON file; no prediction content was
      used.
