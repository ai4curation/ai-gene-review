suggested_questions:
- question: Is the 101-residue ENSP00000389685 product (F8WDQ9) translated and stable in any human tissue,
    or is ENST00000455999 a transcript subject to nonsense-mediated decay or a gene-model artifact?
- question: Does the retained acetylated N-terminal segment of F8WDQ9 (identical to residues 1-94 of UBE2F)
    bind DCUN1D co-E3s or the UBA3 E1 and thereby compete with the full-length enzyme?
suggested_experiments:
- description: Targeted proteomics (PRM) for the unique junction peptide spanning residue 94 and the alternative
    C-terminal tail (...YNMV-FIERTFN) in human cell lines and tissues to establish whether the product exists.
- description: If detected, test binding of recombinant N-acetylated F8WDQ9 to DCUN1D1-5 and UBA3, and measure
    whether its overexpression reduces CUL5 neddylation.
