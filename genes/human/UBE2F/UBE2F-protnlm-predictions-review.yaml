  review:
    assessment: NPI
    error_type: DOMAIN_ARCHITECTURE_MISMATCH
    confidence_score: 0
    summary: F8WDQ9 is a 101-residue product that matches canonical Q969M7 residues 1-94 only. It lacks
      canonical residues 95-178, which hold the HPN motif and the catalytic thioester Cys116, so it covers
      only 70 of the 154 residues of the UBC core. The gene's only link to protein ubiquitination is indirect.
      Full-length UBE2F conjugates NEDD8 to cullin-5 through Cys116, and this activates CRL5 ubiquitin
      ligases. That route needs the catalytic E2 core, which this product lacks, and no other activity of
      F8WDQ9 is known that could place it in the process. The term is absent from GOA for both F8WDQ9 and
      canonical Q969M7, whose process annotations are protein neddylation.
