status: COMPLETE
description: The short UBE2F product lacks the catalytic cysteine and most of the E2 core. Intrinsic ubiquitin
  transfer is unsupported and contradicted by sequence and NEDD8 specificity; indirect ubiquitination
  involvement cannot be established for this product.
