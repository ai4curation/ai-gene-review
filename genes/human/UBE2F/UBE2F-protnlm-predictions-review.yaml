  review:
    assessment: UNC
    confidence_score: 1
    summary: F8WDQ9 is a 101-residue product that matches canonical Q969M7 residues 1-94 only. It lacks
      canonical residues 95-178, which hold the HPN motif and the catalytic thioester Cys116, so it covers
      only 70 of the 154 residues of the UBC core. The gene's known link to protein ubiquitination is indirect.
      Full-length UBE2F conjugates NEDD8 to cullin-5 through Cys116, and this activates CRL5 ubiquitin
      ligases. That catalytic route is not available to F8WDQ9. The product does keep the N-terminal
      UBA3-docking extension (residues 1-29) and the acetylated N-terminus that binds DCNL co-E3s, and
      UBE2F N-terminal peptides alone can inhibit DCNLs. A regulatory or competitive binding role in
      CRL5 activation, and so in ubiquitination, is therefore plausible but neither shown nor excluded.
      There is no positive refutation, so the call is uncertain. The term is absent from GOA for both
      F8WDQ9 and canonical Q969M7, whose process annotations are protein neddylation.
