id: F8WDQ9
gene_symbol: UBE2F
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
status: COMPLETE
description: The short UBE2F product lacks the catalytic cysteine and most of the E2 core. Intrinsic ubiquitin
  transfer is unsupported and contradicted by sequence and NEDD8 specificity. Indirect involvement in
  protein ubiquitination cannot be excluded, because the product keeps the N-terminal E1- and DCNL-binding
  segment, but no such role has been tested.
