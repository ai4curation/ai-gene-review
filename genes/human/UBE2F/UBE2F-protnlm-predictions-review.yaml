    summary: F8WDQ9 lacks the reference UBE2F catalytic Cys116 and a complete UBC core. Moreover, the
      characterized full-length enzyme conjugates NEDD8, not ubiquitin. A UBC-domain match does not establish
      ubiquitin-protein transferase activity. Neither F8WDQ9 nor the canonical Q969M7 product carries this
      term in GOA, where the gene's experimental MF is NEDD8 conjugating enzyme activity; a PubMed search
