suggested_questions:
- question: >-
    Has the 4-demethylwyosine synthase activity of human TYW1 been reconstituted in vitro,
    and does it require the flavodoxin domain or accept an external reductant?
  experts:
  - Bandarian V
- question: >-
    Did the TYW1 CRISPR knockout in hESCs also target the 95.7%-identical paralogue TYW1B?
    If not, does the complete loss of OHyW show that TYW1B cannot make up for TYW1 loss?
- question: >-
    Is human TYW1 attached to the ER membrane through its N-terminal hydrophobic segment,
    as yeast Tyw1 is localised to the ER?
suggested_experiments:
- hypothesis: Recombinant human TYW1 converts m1G37-tRNA(Phe) and pyruvate into imG-14
    in an NAD(P)H/FMN-dependent radical SAM reaction.
  description: >-
    Express and anaerobically reconstitute human TYW1 (wild type and C381A/C394A/C407A
    auxiliary-cluster or C416A radical-SAM mutants). Assay imG-14 formation on m1G37
    tRNA(Phe) by LC-MS, and track 5'-dA and CO2 from [1-13C]pyruvate.
  experiment_type: in vitro enzymology
- hypothesis: Human TYW1 is anchored at the cytoplasmic face of the ER membrane.
  description: >-
    Image endogenously tagged TYW1 in human cells with ER and cytosol markers, and use
    carbonate extraction and protease protection to test membrane integration of the
    N-terminal segment.
  experiment_type: cell biology
