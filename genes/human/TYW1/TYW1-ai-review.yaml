id: Q9NV66
gene_symbol: TYW1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TYW1 (tRNA-yW synthesizing protein 1) is a cytoplasmic radical S-adenosyl-L-methionine
  (SAM) flavoenzyme. It catalyses the second step of wybutosine (yW) biosynthesis, the
  hypermodification of guanosine 37 next to the anticodon of tRNA(Phe). Starting from
  N1-methylguanosine (m1G37), made by TRMT5, TYW1 condenses carbons 2 and 3 of pyruvate onto
  the base to form the tricyclic 4-demethylwyosine (imG-14), releasing carbon 1 of pyruvate
  as CO2. The enzyme has an N-terminal flavodoxin-like domain that binds FMN and supplies
  reducing equivalents from NAD(P)H, and a C-terminal radical SAM domain. The radical SAM
  domain carries two [4Fe-4S] clusters: one bound by the CX3CX2C motif that cleaves SAM to
  a 5'-deoxyadenosyl radical, and an auxiliary cluster that binds pyruvate. imG-14 is then
  elaborated by TYW2/TRMT12, TYW3, LCMT2/TYW4 and, in human, TYW5 to (hydroxy)wybutosine,
  which stabilises codon-anticodon pairing and keeps the reading frame at Phe codons. Most
  of the enzymology was established for the yeast and archaeal orthologues. In human cells,
  TYW1 knockout abolishes hydroxywybutosine and lowers UUU-codon translation. Biallelic
  loss-of-function variants cause primary microcephaly with intellectual disability and
  cerebral palsy. Human chromosome 7 also carries a closely related paralogue, TYW1B.
