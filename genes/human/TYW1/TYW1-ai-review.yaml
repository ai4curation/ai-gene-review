- term:
    id: GO:0102521
    label: tRNA-4-demethylwyosine synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:36347
  - EC:4.1.3.44
  review:
    summary: >-
      Combined IEA from the EC 4.1.3.44 / RHEA:36347 assignment: m1G37 in tRNA(Phe) +
      pyruvate + SAM = 4-demethylwyosine37 in tRNA(Phe) + 5'-deoxyadenosine + L-methionine +
      CO2 + H2O. This is the defining activity of the TYW1 family. It has been shown in
      vitro for archaeal and yeast TYW1 (pyruvate as the C2 donor, CO2 from C1), and TYW1
      is required for wybutosine in human cells.
    action: ACCEPT
    reason: >-
      This is the core molecular function. Human TYW1 conserves every catalytic element:
      the radical SAM triad, the auxiliary-cluster cysteines and the flavodoxin domain. The
      reaction stoichiometry is established in orthologues (PMID:22026549, PMID:36326713,
      PMID:34184886). Human TYW1 knockout abolishes the downstream OHyW (PMID:38706838).
      Direct in vitro assay of the human enzyme has not been reported, but the inference is
      strong.
    supported_by:
    - reference_id: PMID:22026549
      supporting_text: Of the potential substrates examined, only incubation with pyruvate
        resulted in formation of 4-demethylwyosine.
    - reference_id: PMID:36326713
      supporting_text: under conditions that preferentially transform CO2 and not formate
        to OAA
    - reference_id: file:human/TYW1/TYW1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Catalyzes the condensation of N-methylguanine with 2 carbon atoms
        from pyruvate to form the tricyclic 4-demethylwyosine
    - reference_id: PMID:38706838
      supporting_text: OHyW was completely undetectable in TYW1-knockout hESCs
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:38706838
  review:
    summary: >-
      Immunostaining of wild-type TYW1 (and two patient variants) in HeLa cells shows
      cytoplasmic, not nuclear, localisation. This fits the cytoplasmic stage of
      wybutosine formation on tRNA(Phe) and TYW1's identification as a client of the
      cytosolic iron-sulfur assembly (CIA) targeting complex.
    action: NEW
    reason: >-
      GOA has no cellular component annotation for TYW1. Direct human imaging places it in
      the cytoplasm (PMID:38706838). This is kept at the cytoplasm level: the
      cytoplasm-marker channel was an ER antibody, and yeast Tyw1 is ER-localised, so
      association with the ER membrane is possible but has not been shown for human TYW1.
    supported_by:
    - reference_id: PMID:38706838
      supporting_text: both wild-type (WT) and two variants of TYW1 showed clear
        localization in cytoplasm but not nucleus
    - reference_id: PMID:28178521
      supporting_text: 4-demethylwyosine synthase (TYW1)
