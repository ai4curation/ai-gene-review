    summary: >-
      InterPro2GO mapping from the flavodoxin-like domain signatures (IPR001094,
      IPR008254). Eukaryotic TYW1 proteins carry an N-terminal flavodoxin domain that the
      archaeal homologues lack. Recombinant yeast Tyw1 co-purifies with FMN and is active
