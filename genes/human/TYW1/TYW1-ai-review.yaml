      Human TYW1 keeps the flavodoxin domain, including the phosphate-binding loop at
      residues 85-89 annotated as an FMN-binding feature in UniProt. FMN binding has been
      shown biochemically for the yeast orthologue (PMID:34184886). The term is as specific
      as GO allows, and the cofactor is part of the enzyme's catalytic mechanism, so the
      row is core.
