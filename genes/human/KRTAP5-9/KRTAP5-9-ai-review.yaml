core_functions:
- description: 'KRTAP5-9 is a ultrahigh-sulfur (UHS) KAP5 family keratin-associated protein that acts as a structural matrix component of the hair fibre: it is deposited between trichocyte keratin intermediate filaments in the keratinizing zone and becomes cross-linked to them, mainly through disulfide bonds (HS/UHS KAPs) or additional non-covalent interactions (HGT KAPs), giving the hair shaft its rigidity and resistance.'
  molecular_function: *id002
  directly_involved_in:
  - *id003
  locations:
  - *id004
  anatomical_locations:
  - id: UBERON:0002076
    label: cuticle of hair
  supported_by:
  - *id001
  - reference_id: PMID:18721477
    supporting_text: 'KRTAP contains two major groups: high/ultrahigh cysteine (HS) and high glycine-tyrosine (HGT) that are considered to have originated independently, and are essential for the formation of rigid and resistant hair shafts through their extensive disulfide bond cross-linking with the abundant cysteine residues of hair keratins or hydrophobic interactions with keratins [23,26-28].'
  - reference_id: PMID:15144888
    supporting_text: all these KAP proteins were classified into an ultrahigh-sulfur (UHS) type KAP with high cysteine content (> 30 mol%).
suggested_questions:
- question: Does KAP5.9 cross-link specifically with cuticle keratins (e.g. K32/K82) in the exocuticle and A-layer?
- question: GO lacks a cellular component term for the keratin-associated interfilamentous matrix of the hair cortex/cuticle; should one be requested, as keratin filament is only an approximation?
suggested_experiments:
- hypothesis: KAP5.9 is a component of the exocuticle A-layer.
  description: Immunoelectron microscopy of human hair cuticle with a KAP5.9-specific antibody, plus proteomic analysis of isolated cuticle.
  experiment_type: immunolocalization
