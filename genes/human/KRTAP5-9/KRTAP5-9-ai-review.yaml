id: P26371
gene_symbol: KRTAP5-9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Keratin-associated protein 5-9 (KAP5.9; also KRN1/UHSK1, the human ultra-high-sulfur keratin originally cloned as a hair cuticle gene) is a 169-residue glycine- and cysteine-rich ultrahigh-sulfur keratin-associated protein of the KAP5 family, encoded on chromosome 11q13. It contains more than 30 mol% cysteine arranged in cysteine-rich and glycine-rich repeats. KRTAP5-9 transcripts are restricted to the hair root, where they are expressed late in fibre differentiation in the cuticle layers of the hair fibre. The protein is a constituent of the heavily disulfide cross-linked keratin-associated matrix that gives the protective hair cuticle its hardness.
