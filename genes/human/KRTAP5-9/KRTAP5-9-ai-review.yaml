- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6809663
  qualifier: located_in
  review:
    summary: "Reactome cytosol placement (Formation of hair keratin fibres); KAPs are synthesized in the cytoplasm of keratinizing cortical cells but act in the keratin matrix."
    action: KEEP_AS_NON_CORE
    reason: "Keratin-associated proteins are non-membrane proteins synthesized in the cytoplasm of differentiating (keratinizing) hair or wool cortical cells, so a cytoplasmic/cytosolic placement is true of the newly made protein. It is not the site of function: KAPs act in the interfilamentous matrix around trichocyte keratin intermediate filaments of the keratinized cell, which this review captures with keratin filament (GO:0045095). The placement is correct but peripheral, so it is kept as non-core rather than marked as over-annotated; ARBA IEA and Reactome TAS cytosol rows are treated identically across the KRTAP family reviews."
    supported_by:
    - reference_id: Reactome:R-HSA-6809663
      supporting_text: In the lower and middle cortex, keratin filaments are embedded in a matrix that consists of KAPs.
- term:
    id: GO:0008544
    label: epidermis development
  evidence_type: TAS
  original_reference_id: PMID:1703541
  qualifier: involved_in
  review:
    summary: TAS from MacKinnon et al. 1990, which cloned the human UHS cuticle gene and showed its late expression in the hair fibre cuticle.
    action: MODIFY
    reason: The cited paper shows expression in the differentiating hair fibre cuticle, not a role in development of the epidermis. The protein contributes structure to the keratinized hair; keratinization (GO:0031424), a descendant of epidermis development, is the accurate term.
    proposed_replacement_terms:
    - &id003
      id: GO:0031424
      label: keratinization
    supported_by:
    - reference_id: PMID:1703541
      supporting_text: Tissue in situ hybridization demonstrates that the expression of both genes is localized to the hair fiber cuticle and occurs at a late stage in fiber morphogenesis.
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:P26371
  review:
    summary: Self-interaction of KRTAP5-9 detected in a high-throughput binary interaction screen (PMID:32296183).
    action: KEEP_AS_NON_CORE
    reason: Homotypic association of keratin-associated proteins is plausible within the disulfide-bonded matrix, where KAPs cross-link with each other as well as with keratins, but the evidence is a single high-throughput screen in which cysteine-rich KAPs are promiscuous preys. The call is KEEP_AS_NON_CORE rather than MARK_AS_OVER_ANNOTATED because this is a direct experimental interactome hit on the protein itself, one step closer to the data than the ISO transfers of the same kind of HuRI self-interaction onto the mouse paralogues (e.g. Krtap12-1, Krtap6-5), which are marked as over-annotated. It is retained as non-core; it does not describe the structural function of the protein.
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: Specifically, yeast two-hybrid (Y2H) represents the only binary PPI assay that can be operated at sufficient throughput to systematically screen the human proteome for binary PPIs.
    - *id001
- term: &id002
    id: GO:0030281
    label: structural constituent of cutaneous appendage
  evidence_type: TAS
  original_reference_id: PMID:16939781
  review:
    summary: Proposed structural molecular function for KRTAP5-9 as a hair keratin-associated matrix protein.
    action: NEW
    reason: Keratin-associated proteins are the structural matrix proteins of the hair fibre that stabilise it by disulfide cross-linking with hair keratins. Structural constituent of cutaneous appendage (GO:0030281; contributes to the structural integrity of hairs) is the specific GO MF for this role. Related paralogues receive only the generic structural molecule activity by IEA.
    supported_by:
    - *id001
    - reference_id: PMID:29391282
      supporting_text: KAPs are the major constituent of the matrix between the hair keratin intermediate filaments (IFs), and stabilise hair structure by extensive disulfide bonding.
    - reference_id: PMID:18721477
      supporting_text: 'KRTAP contains two major groups: high/ultrahigh cysteine (HS) and high glycine-tyrosine (HGT) that are considered to have originated independently, and are essential for the formation of rigid and resistant hair shafts through their extensive disulfide bond cross-linking with the abundant cysteine residues of hair keratins or hydrophobic interactions with keratins [23,26-28].'
