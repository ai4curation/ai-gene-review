      supporting_text: FGF-19 is a high affinity, heparin dependent ligand for FGFR4 and is the first
        member of the FGF family to show exclusive binding to FGFR4.
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - &id007
      reference_id: PMID:17623664
      supporting_text: Both FGF19 and FGF21 can signal through FGFR1-3 bound by betaKlotho and increase
        glucose uptake in adipocytes expressing FGFR1.
      reference_section_type: ABSTRACT
