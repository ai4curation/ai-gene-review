- description: 'Postprandial, insulin-independent hepatic signal: FGF19 acting through hepatic FGFR (KLB-FGFR4)
    and Ras-ERK-p90RSK signaling increases glycogen synthase activity and hepatic glycogen and protein
    synthesis.'
