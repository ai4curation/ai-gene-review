id: O95750
gene_symbol: FGF19
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGF19 is an endocrine member of the fibroblast growth factor family (FGF19/FGF21/FGF23 subfamily;
  human ortholog of mouse FGF15). It is a secreted protein produced mainly by ileal enterocytes after
  bile acids activate the nuclear receptor FXR, and it circulates via the portal blood to the liver. Its
  atypical heparin-binding region gives low heparan sulfate affinity, allowing endocrine action, and it
  relies on the transmembrane co-receptor beta-Klotho (KLB) for high-affinity binding to and activation
  of FGF receptors, principally FGFR4 in hepatocytes but also KLB-FGFR1c/2c/3c complexes. In hepatocytes,
  FGF19-KLB-FGFR4 signaling (mainly via FRS2/ERK1/2, with contested JNK involvement) represses CYP7A1,
  the rate-limiting enzyme of bile acid synthesis, forming a gut-liver negative feedback loop; it also
  promotes gallbladder filling and stimulates insulin-independent hepatic protein and glycogen synthesis.
  Pharmacological FGF19 has additional effects on adipocyte glucose uptake and energy balance, and sustained
  FGF19-FGFR4 signaling is mitogenic in liver.
