  review:
    summary: 'Kir et al. 2011: human FGF19 stimulated hepatic glycogen synthase activity and glycogen
      synthesis in mice and rats, independently of insulin/Akt, via Ras-ERK-p90RSK; Fgf15-null mice have
      reduced postprandial liver glycogen.'
