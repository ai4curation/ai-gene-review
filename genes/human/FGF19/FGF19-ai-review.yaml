  review:
    summary: PAINT places FGF receptor binding at the FGF ligand family node PTN000160075; FGF19 is itself
      among the experimental seeds.
    action: ACCEPT
    reason: FGF19 is a bona fide FGFR ligand (FGFR4 with KLB, and KLB-FGFR1c/2c/3c). The IBA correctly
      reflects the ancestral ligand function of the family, and the target appearing in its own WITH/FROM
      list reflects its own experimental grounding.
    supported_by:
