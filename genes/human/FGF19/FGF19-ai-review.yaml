- description: 'Secreted endocrine FGFR ligand: FGF19 binds FGFR4 in complex with the beta-Klotho co-receptor
    on hepatocytes, activating FGFR signaling (FRS2/ERK1/2) that represses CYP7A1 and bile acid biosynthesis
    as the intestinal arm of the bile acid feedback loop.'
