suggested_questions:
- question: Should endocrine FGFs (FGF19, FGF21, FGF23) carry hormone activity (GO:0005179) in addition
    to FGF receptor binding? None currently do in GOA, although all three act as circulating hormones.
- question: Is JNK activation a genuine output of FGF19-KLB-FGFR4 signaling in human hepatocytes, given
    conflicting results (Holt 2003 vs Song 2009)?
- question: Which FGFR isoform(s) mediate FGF19-induced gallbladder filling, given that it persists in
    FGFR4-deficient mice?
- question: Does FGF19 act physiologically on adipocytes or the CNS via KLB-FGFR1c, or are these effects
    restricted to pharmacological concentrations?
suggested_experiments:
- hypothesis: ERK1/2 rather than JNK is the necessary mediator of FGF19 repression of CYP7A1 in human
    hepatocytes.
  description: Treat primary human hepatocytes with FGF19 and selectively inhibit or genetically ablate
    MEK/ERK versus JNK; quantify CYP7A1 mRNA and phospho-substrate levels to resolve the pathway conflict
    between the 2003 and 2009 studies.
- hypothesis: beta-Klotho availability is the tissue-selectivity switch that restricts physiological FGF19
    action to KLB-expressing tissues.
  description: Compare FGF19-induced FGFR/ERK signaling and metabolic readouts across primary hepatocytes,
    adipocytes and hypothalamic neurons after KLB knockdown/knockout, testing whether responses track
    KLB expression at physiological versus pharmacological FGF19 concentrations.
