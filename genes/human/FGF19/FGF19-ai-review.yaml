  review:
    summary: FGF19 stimulation of KLB/FGFR4-expressing cells induces receptor, FRS2 and ERK phosphorylation.
    action: KEEP_AS_NON_CORE
    reason: Correct but very general readout of FGFR activation (abstract-only reference; curator saw
      full text). The informative downstream events are already captured by positive regulation of ERK1
      and ERK2 cascade and FGFR signaling pathway, so this is retained as a non-core, general annotation
      rather than removed.
