  review:
    summary: Xie et al. 1999 showed FGF19 is a high-affinity, heparin-dependent ligand binding exclusively
      to FGFR4 (P22455) among FGFRs tested.
    action: ACCEPT
    reason: Direct binding evidence for the core molecular function. Later work showed KLB is required
      for high-affinity binding in cells and that KLB also enables binding/signaling through FGFR1c-3c,
      but FGFR4 binding is the physiological hepatic interaction.
    supported_by:
    - *id001
