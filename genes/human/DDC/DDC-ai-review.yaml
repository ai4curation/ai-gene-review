id: P20711
gene_symbol: DDC
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DDC encodes aromatic-L-amino-acid decarboxylase, a cytosolic PLP-dependent homodimer that
  converts L-DOPA to dopamine and 5-hydroxy-L-tryptophan to serotonin. These reactions supply the catecholamine
  and serotonin/melatonin biosynthetic pathways. The cofactor forms an internal aldimine with Lys303 and
  helps organize the catalytic sites. DDC also associates with tyrosine hydroxylase and DJ-1 in dopaminergic
  cells and can interact with androgen receptor in prostate-cell assays. Biallelic loss of function causes
  aromatic L-amino-acid decarboxylase deficiency, an inherited neurotransmitter disorder with combined
  catecholamine and serotonin deficiency.
