primary_sources:
  PMID:12864730:
    title: Isolation and identification of L-dopa decarboxylase as a protein that binds to and enhances
      transcriptional activity of the androgen receptor using the repressed transactivator yeast two-hybrid
      system.
    source_url: https://pubmed.ncbi.nlm.nih.gov/12864730/
    cache_full_text_unavailable: true
    read_scope: The complete abstract and source-specific curated human AR interaction records were inspected.
      Full original Methods remained unavailable; a separate rat-AR fragment pull-down and unresolved
      current rat sequence checksum are not described as verified full-length human assays.
    finding: DDC associates with androgen receptor and enhances ligand-dependent reporter activity in
      prostate-cell experiments; this supports contextual nuclear receptor binding.
  PMID:16338639:
    title: The assays of activities and function of TH, AADC, and GCH1 and their potential use in ex vivo
      gene therapy of PD.
    source_url: https://pubmed.ncbi.nlm.nih.gov/16338639/
    cache_full_text_unavailable: true
    read_scope: Complete abstract and genuine publisher-access failures inspected. Human AADC activity
      is explicit, but the substrate-specific 5-hydroxytryptophan assay was not independently recovered;
      retain that curated IDA assertion by deference.
    finding: The paper describes expressed human AADC activity assays in dopamine-synthesis experiments.
  PMID:19056867:
    title: Large-scale proteomics and phosphoproteomics of urinary exosomes.
    source_url: https://pubmed.ncbi.nlm.nih.gov/19056867/
    cache_full_text_unavailable: true
    read_scope: Selected original Methods/Results and the source-linked NHLBI target row were read. The
      table explicitly lists DDC/NP_000781 and 11 peptides; no extracellular catalysis, peptide-level
      product resolution or figure-image inspection is claimed.
    finding: DDC was detected in the urinary extracellular-vesicle proteomics dataset, supporting contextual
      localization.
    original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2637050/
    table_url: https://esbl.nhlbi.nih.gov/UrinaryExosomes/
    locators:
    - 'CONCISE METHODS: Urinary Exosome Isolation; Nanospray LC-MS/MS; Analysis of Data; Target-Decoy;
      Elimination of Ambiguous Protein Identifications'
    - 'NHLBI protein table: Gene Name DDC; RefSeq NP_000781; Peptide # 11; Reference 2.'
  PMID:19703902:
    title: Oxidative status of DJ-1-dependent activation of dopamine synthesis through interaction of
      tyrosine hydroxylase and 4-dihydroxy-L-phenylalanine (L-DOPA) decarboxylase with DJ-1.
    source_url: https://pubmed.ncbi.nlm.nih.gov/19703902/
    cache_full_text_unavailable: false
    read_scope: The cached abstract/Discussion and independently recovered full HTML Methods/Results were
      read. The main Results describe direct GST-DJ-1/DDC and GST-TH/DDC binding, cellular co-IP and human
      DDC-dependent HPLC dopamine assays. No supplementary figure-pixel inspection is claimed.
    finding: Human DDC converts L-DOPA to dopamine and interacts with DJ-1 and TH; DJ-1 modulates DDC
      activity.
    original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2781429/
    locators:
    - 'EXPERIMENTAL PROCEDURES: Cells; Pulldown Assay; In Vivo Binding Assay; Activities of Tyrosine Hydroxylase
      and l-Dopa Decarboxylase in Cells; Assays for TH and DDC Activities in Vitro'
    - 'RESULTS: Positive Regulation of TH and DDC Activities by DJ-1 through Direct Interactions'
    - Figure 2 and supplemental Figure 1B are described in the Results; separate figure pixels and supplement
      were not inspected.
  PMID:7567987:
    title: Aromatic-L-amino-acid decarboxylase, a pyridoxal phosphate-dependent enzyme, is a beta-cell
      autoantigen.
    source_url: https://pubmed.ncbi.nlm.nih.gov/7567987/
    cache_full_text_unavailable: true
    read_scope: Complete abstract only. The expression-library experiment used rat insulinoma cells; the
      two-substrate enzyme statement supports conserved TAS chemistry and is not a human purified-product
      assay.
    finding: The paper states the DOPA and 5-hydroxytryptophan decarboxylation reactions while identifying
      rat insulinoma AADC as an autoantigen.
  PMID:22143761:
    title: Open conformation of human DOPA decarboxylase reveals the mechanism of PLP addition to Group
      II decarboxylases.
    source_url: https://pubmed.ncbi.nlm.nih.gov/22143761/
    cache_full_text_unavailable: true
    read_scope: The genuine cache is abstract-only. ROOT independently recovered and read selected human
      apoenzyme original Methods/Results; human recombinant expression and PLP binding kinetics are distinguished
      from the pig holo reference structure.
    finding: Human DDC apoenzyme structures and PLP-addition kinetics explain cofactor-dependent organization
      of the catalytic sites.
    original_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3251144/
    locators:
    - 'Results: structure of the human apoenzyme and PLP-induced changes'
    - 'Materials and Methods: protein expression/purification, crystallization and stopped-flow measurements'
    - Independent ROOT consultation read selected original paragraphs; owner read the complete cached
      abstract and assessed the fixed consultation.
  PMID:15532536:
    title: Identification and characterization of a novel form of the human L-dopa decarboxylase mRNA.
    source_url: https://pubmed.ncbi.nlm.nih.gov/15532536/
    cache_full_text_unavailable: true
    read_scope: Complete abstract and publisher abstract preview only. Human placenta alt-DDC cDNA and
      kidney transcript expression are established; natural short-product enzyme activity is not.
    finding: An alternative coding transcript was isolated from human placenta and detected at high levels
      in human kidney.
  PMID:8670114:
    title: 'Cloning and expression of pig kidney dopa decarboxylase: comparison of the naturally occurring
      and recombinant enzymes.'
    source_url: https://pubmed.ncbi.nlm.nih.gov/8670114/
    cache_full_text_unavailable: true
    read_scope: The complete genuine abstract and current pig DDC experimental annotation records were
      read. Full substrate-specific methods were not recovered; native versus recombinant pig cofactor
      stoichiometry is not transferred as identical human kinetics.
    finding: Pig-kidney and recombinant DDC differ in cofactor occupancy and maximal activity, while supporting
      the conserved decarboxylase enzyme class.
