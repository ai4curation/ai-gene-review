- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22681889
  qualifier: enables
  review:
    summary: RNA binding from a single proteome-wide UV-crosslinking/oligo(dT) mRNA interactome capture
      in HEK293 cells.
    action: MARK_AS_OVER_ANNOTATED
    reason: The capture is genuine experimental data, but it is one high-throughput hit for a protein
      with no known RNA-binding domain, and nearly a third of the proteins in this capture had no prior
      RNA-binding annotation. Without a validation (e.g. CLIP or binding of recombinant protein) it does
      not establish RNA binding as a function of C2orf15.
    supported_by:
    - reference_id: PMID:22681889
      supporting_text: To our knowledge, nearly one-third were not previously annotated as RNA binding
