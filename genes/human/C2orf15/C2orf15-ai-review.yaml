suggested_questions:
- question: Is C2orf15 N-myristoylated at Gly2 (MGFSLSKS), and does that target it to membranes?
- question: Does C2orf15 bind RNA directly, as its capture on oligo(dT) in HEK293 cells suggests, and
    if so through which residues?
suggested_experiments:
- hypothesis: C2orf15 is a lipid-anchored membrane protein.
  description: Express C2orf15 wild type and a G2A mutant with metabolic myristate-analogue labelling;
    compare membrane association by fractionation and localisation by immunofluorescence.
