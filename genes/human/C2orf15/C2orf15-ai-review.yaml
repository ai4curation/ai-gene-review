  supporting_entities:
  - UniProtKB:P51808
  review:
    summary: Bare protein binding with DYNLT3 (P51808) from a proteome-scale yeast two-hybrid screen.
    action: REMOVE
    reason: Generic protein binding is uninformative and is removed under project policy; removal does
      not dispute the reported interaction. This is one of five unrelated Y2H partners (DYNLT3, EZR, PKN1,
      UQCRC1, AGER) that sit in different compartments, none followed up, so no informative molecular
      function can be inferred.
