gene_symbol: C2orf15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: C2orf15 is a 91-amino-acid protein of unknown function encoded on chromosome 2. Its only
  recognised feature is a DUF5547 domain (Pfam PF17701); it has no predicted transmembrane segment or
  signal peptide. The transcript is detected at low levels in many tissues. Proteome-wide studies have
  recorded yeast two-hybrid interactions with several unrelated proteins and its capture on polyadenylated
  mRNA in HEK293 cells, and it was reported as up-regulated in invasive pituitary adenomas, but no activity,
  subcellular location or biological role has been established.
