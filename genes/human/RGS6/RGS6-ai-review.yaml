id: P49758
gene_symbol: RGS6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RGS6 is a multidomain regulator of heterotrimeric G protein signaling in the R7 RGS subfamily.
  Its RGS domain accelerates G alpha inactivation, and its G gamma-like domain binds the atypical beta
  subunit GNB5 to assemble a signaling-regulatory complex. The RGS6–GNB5 complex has directly demonstrated
  GAP activity toward Go. DEP-domain partners and splice variation influence membrane, cytoplasmic and
  nuclear localization. RGS6 participates in neuronal signaling and in termination of cardiac muscarinic
  responses; native mouse experiments establish control of M2-dependent acetylcholine-activated potassium
  currents.
