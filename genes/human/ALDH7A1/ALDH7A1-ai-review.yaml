id: P49419
gene_symbol: ALDH7A1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ALDH7A1 (antiquitin) is a homomeric NAD+-dependent aldehyde dehydrogenase. It oxidizes alpha-aminoadipic
  semialdehyde (AASA), which equilibrates with delta-1-piperideine-6-carboxylate (P6C), to alpha-aminoadipate
  in L-lysine degradation. Mitochondrial and cytosolic forms are characterized, with an additional nuclear
  pool. The enzyme also oxidizes medium-chain and lipid-peroxidation-derived aldehydes and can use betaine
  aldehyde as a substrate. Stress-regulated membrane recruitment supports local NADH production: at Golgi membranes
  NADH inhibits BARS-dependent carrier fission, and membrane ALDH7A1 supports AIFM2/FSP1-mediated ferroptosis
  protection while also consuming reactive aldehydes. ALDH7A1 supplies NADH and promotes FSP1 recruitment;
  FSP1 performs quinone reduction. Human enzyme structures and solution studies connect active tetramer formation
  to catalysis. Biallelic pathogenic variants impair AASA oxidation to varying degrees, causing substrate accumulation
  and pyridoxine-dependent epilepsy associated with P6C-mediated inactivation of pyridoxal phosphate.'
