- id: PMID:32956737
  title: Impact of missense mutations in the ALDH7A1 gene on enzyme structure and catalytic function.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Primary PubMed DOI/identifier mapping verified in the source12 audit; full cached structural/biochemical
      review read. It explicitly distinguishes 539-residue isoform-1/HGVS numbering from the 28-residue-shorter
      structural convention. It summarizes variant-specific effects, including relatively retained activity
      for some active-site variants and impaired tetramer formation for several interface variants. These
      are a synthesis of original studies, not a new experiment on all alleles. It corroborates the existing
      human chemistry/assembly interpretation without transferring every variant effect or changing the
      seeded isoform records.
