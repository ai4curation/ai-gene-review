suggested_questions:
- question: Is the reported mitochondrial intermembrane-space pool of CEP89 genuine and functionally linked
    to complex IV, or does the complex IV defect reflect indirect effects of loss of cilia or of the co-deleted
    SLC7A9 locus?
- question: What does CEP89 contribute to ciliary vesicle formation that the other distal appendage proteins
    do not, given that it is dispensable for FBF1 and CEP164 recruitment?
suggested_experiments:
- description: Generate CEP89-knockout human cells and rescue with wild-type or centriole-targeting-deficient
    CEP89, then measure complex IV assembly by BN-PAGE alongside ciliogenesis, to separate centriolar
    and putative mitochondrial functions.
