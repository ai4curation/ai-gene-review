id: Q96ST8
gene_symbol: CEP89
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CEP89 (centrosomal protein of 89 kDa; also Cep123/CCDC123) is a coiled-coil component of the distal
  appendages (ciliary transition fibers) of the mother centriole and basal body of primary and motile
  cilia. It is recruited by CEP83 and forms part of the appendage blade backbone, but is not needed to
  recruit FBF1 or CEP164. CEP89 is required for formation of the ciliary vesicle and for assembly, but
  not maintenance, of primary cilia; it interacts with the centriolar satellite proteins PCM-1, OFD1 and
  CEP290. CEP89 binds and recruits the myristoylated calcium sensor NCS1 (and CEP15) to the distal appendages;
  NCS1 in turn captures RAB34-positive preciliary vesicles, so CEP89 acts as an adaptor that positions
  the vesicle-capture machinery. Super-resolution imaging shows CEP89 in two layers, at the distal and
  subdistal appendage levels. A cytosolic pool and a pool in the mitochondrial intermembrane space have
  been reported, and CEP89 depletion lowered cytochrome c oxidase (complex IV) activity in human cells
  and flies; a homozygous deletion including CEP89 was found in a patient with complex IV deficiency and
  intellectual disability.
