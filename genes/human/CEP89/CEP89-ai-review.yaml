- term:
    id: GO:0007005
    label: mitochondrion organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0266708
  - PANTHER:PTN002442439
  - UniProtKB:Q96ST8
  review:
    summary: >-
      IBA mitochondrion organization, propagated from Drosophila Cep89 and human CEP89.
    action: KEEP_AS_NON_CORE
    reason: >-
      Fly Cep89 knockdown impairs mitochondrial integrity and human CEP89 knockdown lowers complex IV
      activity. Mitochondrial roles rest on a single study (patient with a homozygous deletion that also
      removes SLC7A9, siRNA knockdown in cultured cells, and Drosophila knockdown); they have not been
      independently replicated, whereas the distal appendage role is supported by several independent
      laboratories.
    supported_by:
    - &id005
      reference_id: PMID:23575228
      supporting_text: Furthermore, Cep89 is required for mitochondrial integrity, membrane depolarization
        and synaptic transmission of photoreceptor neurons, and for (sub)synaptic organization of the
        larval neuromuscular junction.
    - &id006
      reference_id: PMID:23575228
      supporting_text: we ascertained in vitro that downregulation of CEP89 resulted in a severe decrease
        in complex IV in-gel activity and altered mobility, suggesting that the complex is aberrantly
        formed.
