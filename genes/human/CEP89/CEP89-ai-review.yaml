- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:39882855
  review:
    summary: 'Proposed: CEP89 directly binds NCS1 (via its N-terminal region) and is required to recruit
      NCS1 to the distal appendage, linking the appendage to the vesicle-capturing calcium sensor.'
    action: NEW
    reason: Kanie et al. 2025 identify NCS1 as a stoichiometric CEP89 interactor, show direct binding
      and that NCS1 centriolar localization is abolished in CEP89 knockouts and rescued by CEP89 re-expression,
      while NCS1 loss does not displace CEP89. This is an adaptor activity bridging the distal appendage
      and NCS1, and is more informative than protein binding.
    supported_by:
    - &id012
      reference_id: PMID:39882855
      supporting_text: This localization was completely abolished in CEP89 knockouts, suggesting that
        CEP89 recruits NCS1 to the distal appendage.
    - &id013
      reference_id: PMID:39882855
      supporting_text: The lack of a membrane-binding motif in CEP89 suggests that it may indirectly recruit
        preciliary vesicles via another binding partner. Here, we identify Neuronal Calcium Sensor-1 (NCS1)
        as a stoichiometric interactor of CEP89.
    - &id014
      reference_id: file:human/CEP89/CEP89-deep-research-falcon.md
      supporting_text: CEP89 bound NCS1 through its **N-terminal residues 1–343** and bound CEP15 independently
