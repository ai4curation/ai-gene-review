core_functions:
- description: "Distal appendage (ciliary transition fiber) blade component of the mother centriole that\
    \ acts as an\n   adaptor recruiting the myristoylated calcium sensor NCS1 (and CEP15) to the appendages,\
    \ where NCS1 captures RAB34-positive\n   preciliary vesicles; CEP89 is thereby required for efficient\
    \ ciliary vesicle formation and initiation of primary cilium\n   assembly. It is recruited by CEP83\
    \ but is dispensable for recruitment of FBF1 and CEP164."
