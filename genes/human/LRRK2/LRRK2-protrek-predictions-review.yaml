id: Q5S007
gene_symbol: LRRK2
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens (Human)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for LRRK2. This is the cohort's lowest-scoring query: top-1 is
  9.38 and all five calls concern cholesterol binding, homeostasis and transport - a coherent but
  entirely wrong theme, with no trace of the kinase or GTPase activities that are this review's three
  core functions and the reason LRRK2 is studied. The free-text channel scores 9.79 and returns a
  cholesterol-binding hair-cell protein. LRRK2 is a 2527-residue ROCO protein with ARM, ANK, LRR,
  ROC, COR, kinase and WD40 domains; like BRCA2, TOR1 and HTT, it is a large protein with no single
  dominant repeat, and all four fall below the score-10 threshold below which nothing in the other
  cohort was correct. Assessment: 1 uncertain (UNC), 2 nonparalog incorrect (NPI).
