    summary: >-
      Top-ranked hit (score 9.38, the lowest top-1 score in ARGO139). Response to sterol depletion
      has no reported connection to LRRK2, whose substrates are Rab8A, Rab10, Rab12 and Rab29. It
      is recorded as uncertain rather than as a substantive error because at this score the model
