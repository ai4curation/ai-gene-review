id: O60610
gene_symbol: DIAPH1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DIAPH1 is a diaphanous-related formin that couples Rho-family signaling to actin filament
  assembly. Its FH1–FH2 region promotes actin assembly, while an N-terminal regulatory region and C-terminal
  autoregulatory segment restrain activity until relieved by activated Rho proteins. Cytosolic and membrane-associated
  pools organize actin structures; additional nuclear, centrosomal and spindle-associated pools occur
  in specific cellular settings. DIAPH1 also participates in receptor-linked cytoskeletal signaling and
  PKD2 localization. Disruption of its regulation or expression affects platelet architecture, hearing
  and neurodevelopment. Alternative splicing produces three protein isoforms with differences in their
  internal sequences.
