core_functions:
- description: DIAPH1 is a Rho-regulated formin that binds actin and promotes filament assembly through
    its FH1–FH2 region. Its N-terminal regulatory region restrains the assembly module through a DID–DAD
    interaction; active Rho proteins relieve this inhibition. This activity organizes cytoplasmic actin
    structures, with cellular consequences for shape and adhesion. Human fragment biochemistry and cellular
    gain-of-function experiments support the integrated actin-assembly mechanism.
  molecular_function:
    id: GO:0003779
    label: actin binding
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005884
    label: actin filament
  directly_involved_in:
  - id: GO:0030041
    label: actin filament polymerization
  supported_by:
  - reference_id: PMID:18218625
    supporting_text: Both formins generated fluorescent filamentous structures on the beads.
  - reference_id: PMID:26912466
    supporting_text: Overexpression of DIAPH1 R1213* in cells reproduced the cytoskeletal alterations
      found in platelets.
suggested_questions:
- question: How do the three curated DIAPH1 products differ in Rho-dependent activation and localization,
    particularly in neuronal and platelet settings?
- question: Which RNA species and DIAPH1 region underlie the UV-capture signal, and does that contact
    have a regulatory consequence beyond the detected association?
