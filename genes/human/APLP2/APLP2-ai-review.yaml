    label: DNA binding
  evidence_type: NAS
  original_reference_id: PMID:7702756
  qualifier: enables
  review:
    summary: DNA binding (NAS). The statement infers DNA binding from sequence similarity to a mouse protein
      reported to bind the CDEI box. None of the papers reviewed here show the human protein binding DNA,
      and APLP2 is a type I membrane protein whose large ectodomain is extracellular; marked as over-annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: '[PMID:7702756 "Our results indicate that the highly conserved proteins human APPH, mouse
      CDEBP, and rat YWK-II are apparently homologues of a CDEI binding protein with indispensible function
      in mammalian genome segregation."] [PMID:8485127 "It is 763 amino acids in length and appears to
      encode a signal peptide, a large apparent extracellular domain including a Kunitz inhibitor domain,
      a transmembrane region, and a short cytoplasmic domain."]'
    supported_by:
    - reference_id: PMID:7702756
      supporting_text: Our results indicate that the highly conserved proteins human APPH, mouse CDEBP,
        and rat YWK-II are apparently homologues of a CDEI binding protein with indispensible function
        in mammalian genome segregation.
    - reference_id: PMID:8485127
      supporting_text: It is 763 amino acids in length and appears to encode a signal peptide, a large
        apparent extracellular domain including a Kunitz inhibitor domain, a transmembrane region, and
        a short cytoplasmic domain.
- term:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:25301953
  qualifier: enables
  review:
    summary: Serine-type endopeptidase inhibitor activity (IDA). Isoforms with the Kunitz (KPI) domain
      inhibit trypsin-like proteases, including factor XIa and kallikreins, at nanomolar Ki. The isolated
      KPI domain is a competitive mesotrypsin inhibitor that is also slowly cleaved by it. Accepted as
      a core activity of KPI-containing isoforms.
    action: ACCEPT
    reason: '[PMID:8307156 "APPH KPI was shown to inhibit proteases with trypsin-like specificity with
      an inhibitor profile resembling that of the APP KPI domain."] [PMID:8307156 "The affinity of factor
      XIa for APPH KPI is sufficiently high to allow for an interaction in the blood."] [PMID:25301953
      "In each case, our data were well fitted by the classic competitive model of inhibition and gave
      inhibition constants ( K i ) in the mid-nanomolar to mid-micromolar range ( Fig. 2 )."] [PMID:25301953
      "We find that Kunitz domains within APLP2, bikunin, and HAI2 are cleaved by mesotrypsin with kinetic
      profiles of specific substrates."]'
    supported_by:
    - reference_id: PMID:8307156
      supporting_text: APPH KPI was shown to inhibit proteases with trypsin-like specificity with an inhibitor
        profile resembling that of the APP KPI domain.
    - reference_id: PMID:8307156
      supporting_text: The affinity of factor XIa for APPH KPI is sufficiently high to allow for an interaction
        in the blood.
    - reference_id: PMID:25301953
      supporting_text: In each case, our data were well fitted by the classic competitive model of inhibition
        and gave inhibition constants ( K i ) in the mid-nanomolar to mid-micromolar range ( Fig. 2 ).
    - reference_id: PMID:25301953
      supporting_text: We find that Kunitz domains within APLP2, bikunin, and HAI2 are cleaved by mesotrypsin
        with kinetic profiles of specific substrates.
