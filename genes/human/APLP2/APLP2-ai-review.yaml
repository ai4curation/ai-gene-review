id: Q06481
gene_symbol: APLP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'APLP2 (amyloid beta precursor-like protein 2) is a type I transmembrane glycoprotein of
  the APP family, with an E1 domain (heparin- and copper-binding subdomains), a Kunitz protease inhibitor
  (KPI) domain in most isoforms, an E2 domain, a single transmembrane segment and a short cytoplasmic
  tail with an NPXY motif. Like APP it is shed by alpha- and beta-secretases and cleaved by gamma-secretase.
  Its KPI domain inhibits trypsin-like serine proteases, including factor XIa and kallikreins. APLP2 forms
  homo- and heterodimers with APP and APLP1 that promote trans-cellular adhesion. Its cytoplasmic NPXY
  region binds the PTB domains of the Fe65 family and Mint3, and the released intracellular domain can
  form transcriptionally active complexes with Mint3 and Taz or Yap. APLP2 is functionally redundant with
  APP: double knockout mice mostly die soon after birth and have defects in neuromuscular transmission,
  synaptic plasticity and learning.'
