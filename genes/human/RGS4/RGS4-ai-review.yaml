id: P49798
gene_symbol: RGS4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RGS4 is a GTPase-activating regulator of heterotrimeric Gi/o and Gq signaling. Its RGS domain
  binds the activated G alpha subunit and stabilizes the transition state for GTP hydrolysis, shortening
  receptor-driven signaling. RGS4 acts at the cytoplasmic plasma-membrane surface and in the cytoplasm,
  with regulated nuclear shuttling. It modulates neurotransmitter-receptor control of calcium and potassium
  channels and can restrain cardiac hypertrophic signaling; receptor and cellular context determine its
  physiological effects.
