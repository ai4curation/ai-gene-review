  - SGD:S000004249
  review:
    summary: Conflicting source experiments leave the intermembrane-space import inference unresolved.
    action: UNDECIDED
    reason: The cached PAINT IBD at PTN000143510 is seeded by yeast HSP60/SGD:S000004249. PMID:1347713
      proposes that matrix Hsp60 holds cytochrome b2 unfolded for export to the intermembrane space, whereas
      PMID:7911803 finds cytochrome-b2-presequence fusion proteins sorted by stop transfer without Hsp60
      exposure. These substrate/route-specific results require adjudication and human conservation evidence.
      Neither matrix localization nor a single yeast source settles the claim. A neutral focused OpenScientist
      report is queued.
