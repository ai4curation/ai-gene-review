- term:
    id: GO:0001819
    label: positive regulation of cytokine production
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028861
  review:
    summary: ARBA-predicted, too broad; the supported cytokine effect is IFN-alpha induction.
    action: MODIFY
    reason: Positive regulation of cytokine production is true for extracellular Hsp60 but too general. The best-controlled
      cytokine effect of LPS-free Hsp60 is IFN-alpha induction in APC. Endotoxin-free Hsp60 does not induce IL-6,
      IL-12 or TNF in APC.
    proposed_replacement_terms:
    - id: GO:0032727
      label: positive regulation of interferon-alpha production
    supported_by:
    - &id016
      reference_id: PMID:18256040
      supporting_text: LPS-free Hsp60 enhances IFN alpha expression in APC
    - &id020
      reference_id: PMID:18256040
      supporting_text: LPS-free Hsp60 did not induce IL-6, IL-12 or tumor necrosis factor alpha production in APC
- term:
    id: GO:0002039
    label: p53 binding
  evidence_type: IPI
  original_reference_id: PMID:18086682
  qualifier: enables
  supporting_entities:
  - UniProtKB:P04637
  review:
    summary: Hsp60 forms a complex with p53 in tumour cells and restrains p53 activity.
    action: KEEP_AS_NON_CORE
    reason: Ghosh et al. identified an Hsp60-p53 complex whose disruption by Hsp60 knockdown stabilises p53 and
      triggers Bax-dependent apoptosis in tumour cells. This is a specific, experimentally supported interaction
      in a cancer-cell context, secondary to mitochondrial folding.
    supported_by:
    - &id029
      reference_id: PMID:18086682
      supporting_text: This response involves disruption of an Hsp60-p53 complex
- term:
    id: GO:0002755
    label: MyD88-dependent toll-like receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:16148103
  qualifier: involved_in
  review:
    summary: TLR4/MyD88 dependence of Hsp60 effects is disputed by later endotoxin-free studies.
    action: MARK_AS_OVER_ANNOTATED
    reason: Cohen-Sfady et al. reported that human HSP60 activates mouse B cells through TLR4/MyD88 and stated that
      LPS contamination was excluded (PMID:16148103). Later work found that Hsp60 binds LPS tightly (PMID:17164250),
      that it does not bind B or T lymphocytes (PMID:17164250), and that endotoxin-free Hsp60 acts independently
      of TLR4/MyD88 and does not induce IL-6, IL-12 or TNF in APC (PMID:18256040). TLR4-dependent activities of
      recombinant Hsp60 preparations are therefore at least partly attributable to bound LPS. The annotation is
      not removed, because the curators read the full paper with its controls, but it is likely an over-annotation
      of HSPD1 function.
    supported_by:
    - &id021
      reference_id: PMID:16148103
      supporting_text: The effects of HSP60 were found to be largely dependent on TLR4 and MyD88 signaling
    - &id026
      reference_id: PMID:18256040
      supporting_text: T cell co-stimulation induced by LPS-free Hsp60 was independent of TLR4
    - *id002
- term:
    id: GO:0002842
    label: positive regulation of T cell mediated immune response to tumor cell
  evidence_type: IDA
  original_reference_id: PMID:10663613
  qualifier: involved_in
  review:
    summary: Tumour-surface Hsp60 is recognised by cytotoxic gamma-delta T cells.
    action: KEEP_AS_NON_CORE
    reason: Anti-Hsp60 antibody blocks gamma-delta T-cell lysis of oesophageal tumour cells that display surface
      Hsp60. Hsp60 here is the recognised target ligand that enables the response. This is a specific tumour-immunology
      context, not a recombinant-protein assay.
    supported_by:
    - reference_id: PMID:10663613
      supporting_text: Anti-hsp60 and anti-hsp70 mAb significantly inhibited the cytotoxicity of gammadelta T cells
        to both autologous and allogenic oesophageal tumours
    - &id012
      reference_id: PMID:10663613
      supporting_text: Surface expression of hsp60 and hsp70 on oesophageal tumours and Daudi cells was demonstrated
        by flow cytometry
- term:
    id: GO:0003688
    label: DNA replication origin binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P19882
  review:
    summary: Yeast Hsp60 binds mtDNA origin template single strands; human conservation is not shown.
    action: UNDECIDED
    reason: The ISS donor is yeast HSP60 (P19882), the mitochondrial Hsp60 ortholog in the same PANTHER family.
      Kaufman et al. showed crosslinking to mtDNA and specific single-stranded binding to the template strand of
      a putative yeast origin (PMID:10869431). Yeast ori elements have no direct counterpart in mammalian mtDNA,
      and no human binding assay was found. The activity is real in yeast but cannot yet be transferred, origin
      specificity least of all.
    supported_by:
    - &id003
      reference_id: PMID:10869431
      supporting_text: Hsp60p binds to single-stranded DNA with high specificity for the template strand of a putative
        origin of mtDNA replication.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: UniProtKB:P19882
        source_label: HSP60, Saccharomyces cerevisiae
        source_status: UNRESOLVED
        comment: Direct source IDA is PMID:10869431. Human conservation requires binding or interface evidence;
          primary folding function is not exclusion.
