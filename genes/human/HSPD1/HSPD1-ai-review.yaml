id: P10809
gene_symbol: HSPD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HSPD1 encodes Hsp60, the mitochondrial type I (GroEL-like) chaperonin. The 573-residue precursor carries
  an N-terminal matrix-targeting presequence. In the matrix, Hsp60 forms heptameric rings that associate with heptameric
  rings of the co-chaperonin HSPE1/Hsp10 to make single-ring half-football and double-ring football complexes. In
  an ATP-binding and hydrolysis cycle these complexes enclose newly imported or stress-denatured polypeptides and
  release them folded. Clients include matrix enzymes and respiratory-chain and ATP-synthase subunits. Hsp60 is
  essential, and its expression rises under mitochondrial proteotoxic stress. Missense variants that impair folding
  cause hereditary spastic paraplegia SPG13 and MitCHAP-60 hypomyelinating leukodystrophy. Smaller pools of Hsp60
  occur in the cytosol, at the cell surface and in plasma or extracellular vesicles. There, context-dependent effects
  have been reported on caspase-3 activation and tumour-cell survival, binding of HDL and bacterial LPS, and costimulation
  of T cells through antigen-presenting cells; some TLR4-dependent effects of recombinant Hsp60 are attributable
  to bound LPS.
