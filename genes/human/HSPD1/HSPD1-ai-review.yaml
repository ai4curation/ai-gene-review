  review:
    summary: Retain the cold-response transfer from its resolved vertebrate experiment.
    action: KEEP_AS_NON_CORE
    reason: The ISS donor Q5ZL72 is chicken HSPD1. PMID:23636703 reports increased Hsp60 expression during
