- term:
    id: GO:0032733
    label: positive regulation of interleukin-10 production
  evidence_type: IDA
  original_reference_id: PMID:16148103
  qualifier: involved_in
  review:
    summary: IL-10 induction in B cells by Hsp60 rests on the contested TLR4 B-cell study.
    action: MARK_AS_OVER_ANNOTATED
    reason: Cohen-Sfady et al. reported that human HSP60 activates mouse B cells through TLR4/MyD88 and stated that
      LPS contamination was excluded (PMID:16148103). Later work found that Hsp60 binds LPS tightly (PMID:17164250),
      that it does not bind B or T lymphocytes (PMID:17164250), and that endotoxin-free Hsp60 acts independently
      of TLR4/MyD88 and does not induce IL-6, IL-12 or TNF in APC (PMID:18256040). TLR4-dependent activities of
      recombinant Hsp60 preparations are therefore at least partly attributable to bound LPS. The annotation is
      not removed, because the curators read the full paper with its controls, but it is likely an over-annotation
      of HSPD1 function.
    supported_by:
    - &id024
      reference_id: PMID:16148103
      supporting_text: human HSP60 (but not the Escherichia coli GroEL or the Mycobacterial HSP65 molecules) induced
        naive mouse B cells to proliferate
    - &id025
      reference_id: PMID:17164250
      supporting_text: Hsp60 exclusively binds to macrophages and DC but not to T or B lymphocytes
