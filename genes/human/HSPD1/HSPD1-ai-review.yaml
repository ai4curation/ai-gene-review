- term:
    id: GO:0002039
    label: p53 binding
  evidence_type: IPI
  original_reference_id: PMID:18086682
  qualifier: enables
  supporting_entities:
  - UniProtKB:P04637
  review:
    summary: Retain the context-dependent cytosolic/apoptotic interaction or effect as non-core.
    action: KEEP_AS_NON_CORE
    reason: PMID:18086682 directly identifies Hsp60-associated survivin and an Hsp60-p53 complex in tumor
      cells. Acute Hsp60 loss destabilizes mitochondrial survivin and promotes p53/Bax-dependent apoptosis.
      This supports the specific binding, stabilization or survival context as ancillary to mitochondrial
      folding.
