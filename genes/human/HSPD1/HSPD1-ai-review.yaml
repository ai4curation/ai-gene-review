- term:
    id: GO:0003688
    label: DNA replication origin binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P19882
  review:
    summary: Direct yeast nucleoid-binding evidence is traced; conservation in human HSPD1 remains unresolved.
    action: UNDECIDED
    reason: The ISS donor is yeast Hsp60/P19882. QuickGO traces both DNA-binding activities to PMID:10869431,
      whose crosslinking and gel-shift experiments directly establish single-stranded origin-template
      binding. This is a real ancillary source function, not evidence inferred merely from chaperoning.
      Human conservation of the nucleoid-binding mechanism remains unresolved, especially for origin-specific
      recognition.
    supported_by:
    - reference_id: PMID:10869431
      supporting_text: 'Hsp60p binds to single-stranded DNA with high specificity for the

        template strand of a putative origin of mtDNA replication.'
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: UniProtKB:P19882
        source_label: HSP60, Saccharomyces cerevisiae
        source_status: UNRESOLVED
        comment: Direct source IDA is PMID:10869431. Human conservation requires binding or interface
          evidence; primary folding function is not exclusion.
