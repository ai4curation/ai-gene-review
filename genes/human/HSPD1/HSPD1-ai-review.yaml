      supporting_text: does not inhibit malate dehydrogenase refolding or ATP hydrolysis by mt-cpn60 in the presence
        of mt-cpn10
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IDA
  original_reference_id: PMID:18229457
  qualifier: located_in
  review:
    summary: Intact, presequence-free Hsp60 circulates in human plasma.
    action: KEEP_AS_NON_CORE
    reason: Circulating Hsp60 in human plasma is mostly the intact mature protein lacking the mitochondrial import
      peptide, so it comes from mitochondria. Its release mechanism and function are unclear. It is a non-core extracellular
      location.
    supported_by:
    - reference_id: PMID:18229457
      supporting_text: Mass spectrometric analysis of circulating immunoreactive Hsp60 reveal that it is predominantly
        the intact protein with no mitochondrial import peptide
