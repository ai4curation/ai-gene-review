    label: response to unfolded protein
  evidence_type: IDA
  original_reference_id: PMID:11050098
  qualifier: involved_in
  review:
    summary: Hsp60 participates in mitochondrial protein-folding stress responses.
    action: ACCEPT
    reason: Its chaperonin activity restores folding of nonnative proteins and supports mitochondrial
      proteostasis. The stress-response term is mechanistically grounded, while HSPD1 is not itself the
      transcriptional sensor of every unfolded-protein-response pathway.
