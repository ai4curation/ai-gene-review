- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002423
  - InterPro:IPR018370
  review:
    summary: Conserved nucleotide-binding residues support ATP binding.
    action: ACCEPT
    reason: The chaperonin fold and nucleotide-binding positions are conserved in the selected horse sequence,
      even though the internal deletion limits assessment of complete folding-cycle function. ATP binding
      is a narrower claim than efficient ATP-dependent substrate folding.
    supported_by:
    - reference_id: PMID:1346131
      supporting_text: 'facilitates the formation of catalytically active ribulose-bisphosphate

        carboxylase from an unfolded state in the presence of K+ and MgATP.'
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IDA
  original_reference_id: PMID:18229457
  qualifier: located_in
  review:
    summary: Retain the detected secondary cellular compartment or assembly as non-core.
    action: KEEP_AS_NON_CORE
    reason: Hsp60 can be detected outside its principal matrix pool, including stress-associated cytosolic,
      membrane and extracellular fractions. The curated observation is retained without inferring that
      Hsp60 is a constitutive secreted signal or a structural component of every detected vesicle. Physiological
      interpretation remains context-dependent.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IDA
  original_reference_id: PMID:21328542
  qualifier: located_in
  review:
    summary: Retain the context-dependent cytosolic/apoptotic interaction or effect as non-core.
    action: KEEP_AS_NON_CORE
    reason: The primary apoptosis study demonstrates cytosolic Hsp60 accumulation with either pro-death
      or pro-survival effects depending on the inducer and caspase-3 interaction. Opposite apoptotic-direction
      annotations need not conflict when contexts differ. These secondary roles do not replace the matrix
      folding function.
    supported_by:
    - reference_id: PMID:17823127
      supporting_text: 'the cytosolically accumulated HSP60 possesses

        either pro-survival or pro-death functions, which involves differential

        interactions with caspase-3.'
