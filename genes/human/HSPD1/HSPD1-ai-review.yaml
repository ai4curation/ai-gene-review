- term:
    id: GO:0001530
    label: lipopolysaccharide binding
  evidence_type: IDA
  original_reference_id: PMID:17164250
  qualifier: enables
  review:
    summary: Extracellular Hsp60 binds bacterial LPS and enhances LPS signalling.
    action: KEEP_AS_NON_CORE
    reason: Osterloh et al. showed specific binding of Hsp60 to LPS and Hsp60-specific, LPS-binding-dependent enhancement
      of APC responses. This may explain part of the controversy over Hsp60 as a TLR4 agonist. It is an extracellular,
      context-dependent activity, unrelated to the mitochondrial chaperonin function. The IEA row transfers the
      same claim from rodent orthologs.
    supported_by:
    - &id001
      reference_id: PMID:17164250
      supporting_text: Hsp60 specifically binds bacterial LPS
    - &id002
      reference_id: PMID:17164250
      supporting_text: This effect was Hsp60-specific and dependent on LPS-binding by Hsp60.
