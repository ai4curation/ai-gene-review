- term:
    id: GO:0045041
    label: protein import into mitochondrial intermembrane space
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000143510
  - SGD:S000004249
  review:
    summary: Contested yeast-derived claim about conservative sorting of cytochrome b2; left unresolved.
    action: UNDECIDED
    reason: The IBA at PTN000143510 is seeded only by yeast HSP60 (SGD:S000004249). The yeast evidence is that matrix
      Hsp60 holds imported cytochrome b2 unfolded before re-export across the inner membrane (PMID:1347713). Rospert
      et al. found that a b2-presequence fusion is sorted by stop-transfer and never meets Hsp60 (PMID:7911803).
      Which route authentic b2 takes was therefore disputed in the source organism. No human experiment addresses
      it, and the dedicated intermembrane-space import machinery (MIA40/CHCHD4) is unrelated. A focused OpenScientist
      audit reached the same conclusion. HSPD1 is inside the mitochondrial Hsp60 clade that inherited the node,
      so the transfer is not phylogenetically wrong; the source biology is contested.
    supported_by:
    - reference_id: PMID:1347713
      supporting_text: While in the matrix, the protein interacts with hsp60, which arrests its folding prior to
        export.
    - reference_id: PMID:7911803
      supporting_text: the cytochrome b2 presequence arrests import through the inner membrane, with the result
        that the attached passenger protein is never exposed to hsp60.
    - reference_id: file:human/HSPD1/HSPD1-hypotheses/function-hypothesis-go-0045041/openscientist.md
      supporting_text: The human annotation to GO:0045041 is **IBA-only** (phylogenetically inferred from a yeast
        ancestor via GO_Central)
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000143510
        source_label: PTN000143510
        source_status: UNRESOLVED
        comment: The yeast HSP60-seeded IBD is confirmed; antifolding/export and stop-transfer source experiments
          need route-specific comparison and human conservation assessment.
