  review:
    summary: Retain mitochondrial inner-membrane association as ancillary to matrix proteostasis.
    action: KEEP_AS_NON_CORE
    reason: Retain inner-membrane association as an ancillary location. The PAINT IBD PTN000143509 is
      seeded by experimental fly, rat and yeast membrane annotations; the separate ISS cites rat P63038.
      Matrix enrichment does not exclude peripheral membrane association, and this annotation does not
      assert an integral membrane-spanning chaperonin.
