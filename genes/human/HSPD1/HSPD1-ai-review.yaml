id: P10809
gene_symbol: HSPD1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HSPD1/Hsp60 is a mitochondrial type I chaperonin that cooperates with HSPE1/Hsp10 to
  fold imported or stress-unfolded proteins. ATP-dependent conformational cycling of Hsp60 oligomers
  and the Hsp10 cochaperonin provides a protected folding chamber. Additional cytosolic and cell-surface
  pools have context-dependent roles in apoptosis and extracellular interactions. Studies using human
  Hsp60 and endotoxin controls support immune costimulation, including direct LPS binding and LPS-dependent
  or independent effects on antigen-presenting cells and lymphocyte responses; these activities are
  distinct contexts of a protein whose principal function is mitochondrial proteostasis.

