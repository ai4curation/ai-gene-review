- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000143677
  - SGD:S000004249
  - UniProtKB:P0A6F5
  - UniProtKB:P10809
  - UniProtKB:P9WPE7
  - UniProtKB:P9WPE9
  review:
    summary: Hsp60/Hsp10 ATP-dependent folding is established for the intact mammalian chaperonin.
    action: ACCEPT
    reason: Purified mammalian Hsp60 with Hsp10 restores activity to unfolded substrate in an ATP-dependent
      reaction. This establishes folding/refolding, ATP-driven chaperoning and partner-assisted assembly.
      For the selected horse model, deletion of human 171–202 requires assessment of the apical-domain
      transition and oligomeric cycle before transferring full functional competence; conservation alone
      does not resolve that deletion.
    supported_by:
    - reference_id: PMID:1346131
      supporting_text: 'facilitates the formation of catalytically active ribulose-bisphosphate

        carboxylase from an unfolded state in the presence of K+ and MgATP.'
