  - SGD:S000004249
  - UniProtKB:P0A6F5
  - UniProtKB:P10809
  - UniProtKB:P9WPE7
  - UniProtKB:P9WPE9
  review:
    summary: Protein folding is the core process carried out by the HSPD1-HSPE1 chaperonin.
    action: ACCEPT
    reason: Human HSPD1 is the single mitochondrial type I (GroEL-like) chaperonin. With its HSPE1/Hsp10 co-chaperonin
      it encloses non-native polypeptides and folds them in an ATP-driven cycle (PMID:1346131, PMID:11422376, PMID:32317635).
      Disease variants D3G and V72I abolish refolding of malate dehydrogenase and the ATP synthase beta subunit
      (PMID:31444388). The PAINT node PTN000143677, seeded by E. coli GroEL, M. tuberculosis Cpn60s, yeast HSP60
      and HSPD1 itself, places folding at the root of the type I chaperonin family, and HSPD1 is inside that clade
      (PANTHER PTHR45633:SF17).
    supported_by:
    - &id011
      reference_id: PMID:1346131
      supporting_text: facilitates the formation of catalytically active ribulose-bisphosphate carboxylase from
        an unfolded state in the presence of K+ and MgATP.
    - *id005
    - *id007
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000143677
        source_label: PTN000143677
        source_status: SUPPORTS_TRANSFER
        comment: Root type I chaperonin node seeded by GroEL, mycobacterial Cpn60, yeast HSP60 and HSPD1; human
          HSPD1 has direct folding assays of its own.
