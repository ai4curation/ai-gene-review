- term:
    id: GO:0001530
    label: lipopolysaccharide binding
  evidence_type: IDA
  original_reference_id: PMID:17164250
  qualifier: enables
  review:
    summary: The extracellular innate/adaptive immune claim requires preparation-specific evidence.
    action: UNDECIDED
    reason: Hsp60 has extracellular immune literature, but an immune response to a protein preparation
      is not automatically an intrinsic signaling activity of the chaperonin. The exact preparation, contamination
      controls, receptor dependence and organism in the cited experiments need assessment. Neither acceptance
      nor removal follows from the intracellular folding role alone.
