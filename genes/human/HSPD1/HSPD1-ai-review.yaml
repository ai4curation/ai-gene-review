  review:
    summary: Retain the context-dependent cytosolic/apoptotic interaction or effect as non-core.
    action: KEEP_AS_NON_CORE
    reason: The primary apoptosis study demonstrates cytosolic Hsp60 accumulation with either pro-death
      or pro-survival effects depending on the inducer and caspase-3 interaction. Opposite apoptotic-direction
      annotations need not conflict when contexts differ. These secondary roles do not replace the matrix
      folding function.
    supported_by:
    - reference_id: PMID:17823127
      supporting_text: 'the cytosolically accumulated HSP60 possesses

        either pro-survival or pro-death functions, which involves differential

        interactions with caspase-3.'
