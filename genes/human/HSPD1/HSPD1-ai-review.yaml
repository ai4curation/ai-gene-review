- term:
    id: GO:0001530
    label: lipopolysaccharide binding
  evidence_type: IDA
  original_reference_id: PMID:17164250
  qualifier: enables
  review:
    summary: Retain the experimentally supported extracellular immune context.
    action: KEEP_AS_NON_CORE
    reason: PMID:17164250 directly reports Hsp60 binding to bacterial LPS and distinguishes LPS-independent
      IFN-alpha-linked costimulation from LPS-dependent enhancement of IL-12p40 and antigen-specific IFN-gamma.
      PMID:18256040 further tests endotoxin-free Hsp60. These specific positive assays support a context-dependent
      immune function; primary mitochondrial localization or hypothetical contamination alone is not a
      reason to withhold the annotation.
    supported_by:
