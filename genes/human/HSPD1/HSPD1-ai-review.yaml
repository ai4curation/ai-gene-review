id: P10809
gene_symbol: HSPD1
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HSPD1/Hsp60 is the mitochondrial type I chaperonin that cooperates with HSPE1/Hsp10 to fold
  imported or stress-unfolded proteins. ATP-dependent conformational cycling of oligomeric Hsp60 rings
  and the Hsp10 cochaperonin provides a protected folding chamber. Additional cytosolic or cell-surface
  pools can influence apoptosis and extracellular interactions, but the principal function is mitochondrial
  proteostasis.
