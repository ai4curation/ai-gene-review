- term:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  evidence_type: IDA
  original_reference_id: PMID:1346131
  qualifier: enables
  review:
    summary: 'Core activity: HSPD1 is the ATP-dependent type I chaperonin of the mitochondrial matrix.'
    action: ACCEPT
    reason: Human HSPD1 is the single mitochondrial type I (GroEL-like) chaperonin. With its HSPE1/Hsp10 co-chaperonin
      it encloses non-native polypeptides and folds them in an ATP-driven cycle (PMID:1346131, PMID:11422376, PMID:32317635).
      Disease variants D3G and V72I abolish refolding of malate dehydrogenase and the ATP synthase beta subunit
      (PMID:31444388). The PAINT node PTN000143677, seeded by E. coli GroEL, M. tuberculosis Cpn60s, yeast HSP60
      and HSPD1 itself, places folding at the root of the type I chaperonin family, and HSPD1 is inside that clade
      (PANTHER PTHR45633:SF17).
    supported_by:
    - *id011
    - *id013
    - &id033
      reference_id: PMID:32317635
      supporting_text: Refolding assays demonstrate obligate single- and double-ring mHsp60 variants are active
    - *id023
