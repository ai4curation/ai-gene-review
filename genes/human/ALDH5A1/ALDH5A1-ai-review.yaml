suggested_questions:
- question: How much GABA-derived carbon reaches succinate and the TCA cycle through ALDH5A1 in
    human neural versus non-neural tissues?
- question: Does endogenous Cys340-Cys342 redox switching quantitatively alter GABA-shunt flux
    in intact human mitochondria under physiological conditions?
- question: Which CNS developmental events, if any, require ALDH5A1 catalytic activity beyond
    the metabolic disturbances documented in SSADH-deficient patients?
suggested_experiments:
- description: Use labeled GABA tracing in matched human cells with ALDH5A1 loss and catalytic
    rescue to measure succinate production and downstream carbon flux across neural and non-neural
    contexts.
- description: Measure endogenous SSADH disulfide state, enzyme activity and isotope flux together
    during calibrated redox perturbations of intact mitochondria; distinguish reversible inhibition
    from irreversible oxidative damage.
