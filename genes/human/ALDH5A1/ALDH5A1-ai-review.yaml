- description: As a homotetramer in the mitochondrial matrix, ALDH5A1 oxidizes succinate semialdehyde
    with NAD+ to produce succinate and NADH. This catalytic step completes GABA degradation and
    connects the glutamate/GABA shunt to central carbon metabolism.
