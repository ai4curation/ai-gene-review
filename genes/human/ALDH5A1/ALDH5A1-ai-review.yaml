id: P51649
gene_symbol: ALDH5A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALDH5A1 encodes mitochondrial succinate-semialdehyde dehydrogenase (SSADH), an aldehyde
  dehydrogenase family enzyme with an N-terminal mitochondrial targeting sequence. The homotetramer
  oxidizes succinate semialdehyde with NAD+ to form succinate and NADH in the final step of GABA
  degradation. Its matrix reaction links the glutamate/GABA shunt to the tricarboxylic acid cycle.
  Reversible disulfide formation in a redox-sensitive catalytic loop inhibits enzyme activity.
  The protein is expressed in several tissues, including brain, liver, kidney and skeletal muscle.
  Biallelic loss of function causes SSADH deficiency, a disorder of GABA and gamma-hydroxybutyrate
  metabolism with variable neurological and developmental manifestations.
