- id: PMID:17854388
  title: 'Altered cerebral glucose and acetate metabolism in succinic semialdehyde dehydrogenase-deficient
    mice: evidence for glial dysfunction and reduced glutamate/glutamine cycling.'
  findings:
  - statement: Cortical isotope/metabolite measurements in SSADH-deficient mice support altered glutamate/glutamine
      pathway physiology, without measuring enzyme cofactor specificity.
    supporting_text: Our findings indicate that SSADH deficiency is associated with major alterations
      in glutamate and glutamine metabolism in glia and neurons with surprisingly lesser effects on GABA
      synthesis.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The recovered cached primary abstract was read alongside the prior primary
      PubMed/publisher assessment. MGI J:128716 is the mouse glutamate-process IMP source. The
      study measures cerebral glucose/acetate isotope incorporation and cortical metabolite pools
      in 17-day-old deficient and wild-type mice. This is pathway physiology, not direct glutamate
      turnover by SSADH. Its introductory NADP-dependent wording does not report a cofactor assay
      and cannot override direct human NAD+ enzymology. Full text remains unavailable.
