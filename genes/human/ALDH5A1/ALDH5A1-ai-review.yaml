    label: central nervous system development
  evidence_type: IMP
  original_reference_id: PMID:9683595
  qualifier: involved_in
  review:
    summary: Retain the human disease-development association as non-core.
    action: KEEP_AS_NON_CORE
    reason: The full PMID:9683595 study links SSADH-deficient genotypes and low enzyme activity
      to patients with developmental/speech delay and other neurological features. This supports
      the curator's phenotype-based developmental association, but the paper does not assay a
      particular CNS morphogenetic or differentiation step; it also reports no established correlation
      between residual activity or GHB level and clinical severity. Retain the existing IMP as
      non-core rather than adding a separate developmental core function or claiming an established
      developmental mechanism. The public original paper describes developmental and speech
      delays on journal page 407 (https://art.torvergata.it/retrieve/e291c0d3-7a76-cddb-e053-3a05fe0aa144/Chambliss_AJHG_1998.pdf);
