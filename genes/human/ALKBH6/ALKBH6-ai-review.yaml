- id: PMID:40885392
  title: Identification of ALKBH6 as a nucleotide demethylase with a distinct substrate preference.
  findings:
  - statement: ALKBH6 demethylates N7-methyl-GMP and N1-methyl-AMP.
    supporting_text: we demonstrate that ALKBH6 effectively demethylates N-7-methyl-GMP, and N-1-methyl-adenosine
      monophosphate.
  - statement: Methylated dNMPs and NMPs are its primary substrates.
    supporting_text: N-methylated dNMPs and NMPs are the primary substrates of ALKBH6
  - statement: Monophosphates are preferred.
    supporting_text: This result suggests that among different nucleotides, monophosphates could be preferentially
      demethylated by ALKBH6.
  - statement: A substrate phosphate is required; no activity on bases or nucleosides.
    supporting_text: We observed that the presence of a phosphate group in the substrate molecule is essential
      for ALKBH6 activity as it showed no activity toward methylated bases or the methylated nucleosides.
  - statement: These are endogenous substrates.
    supporting_text: we confirmed that N-7-methyl-GMP and N-1-methyl-AMP are also the endogenous substrates
      of ALKBH6.
