  knowledge_gaps:
  - gap_statement: Whether ALKBH6 protects against alkylation damage by sanitizing the nucleotide pool
      is untested.
    boundary: Loss of ALKBH6 increases alkylation damage and it complements E. coli alkB, but the purified
      enzyme acts on free methylated nucleotides rather than nucleic acids. Its substrates include methylated
      deoxynucleotides, which alkylating agents generate and polymerases could incorporate into DNA, so
      clearing them is a concrete candidate mechanism for the phenotype; it has not been tested.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
    provenance:
    - reference_id: PMID:33897761
      supporting_text: the loss of ALKBH6 in human pancreatic cancer cells increases alkylating agent-induced
        DNA damage and significantly decreases cell survival.
    - reference_id: PMID:40885392
      supporting_text: N-methylated dNMPs and NMPs are the primary substrates of ALKBH6
    - reference_id: PMID:40885392
      supporting_text: We observed that the presence of a phosphate group in the substrate molecule is
        essential for ALKBH6 activity as it showed no activity toward methylated bases or the methylated
        nucleosides.
suggested_questions:
- question: Does ALKBH6 protect DNA from alkylation by clearing methylated nucleotides before they are
    incorporated, or does it have an undetected nucleic-acid activity in cells?
suggested_experiments:
- description: Measure incorporation of methylated nucleotides into DNA and RNA in ALKBH6-null cells after
    alkylating-agent treatment.
