taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALKBH6 is a small Fe(II)- and 2-oxoglutarate-dependent dioxygenase of the AlkB family. Unlike
  the nucleic acid demethylases ALKBH2 and ALKBH3, it demethylates free methylated ribo- and deoxyribonucleotides,
  such as N7-methyl-GMP, N1-methyl-AMP and 3-methyl-dCMP. It requires a phosphate group, preferring monophosphates
  over triphosphates, and shows no activity on methylated bases or nucleosides; methylated nucleotides
  are its endogenous substrates, suggesting a role in sanitizing the methylated nucleotide pool. Crystal
  structures show unusual nucleotide-recognition lids and a unique Flip3 domain that excludes double-stranded
  nucleic acids and mediates protein interactions. ALKBH6 is found in nucleus and cytoplasm, complements
  an E. coli alkB mutant, and its loss sensitizes pancreatic cancer cells to alkylating agents.
