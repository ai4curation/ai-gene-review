proposed_new_terms:
- proposed_name: methylated nucleoside monophosphate demethylase activity
  proposed_definition: Catalysis of the oxidative removal of a methyl group from a free methylated ribonucleoside
    or deoxyribonucleoside monophosphate, such as N7-methyl-GMP, N1-methyl-AMP, 3-methyl-dCMP or N7-methyl-dGMP,
    coupled to the decarboxylation of 2-oxoglutarate.
  justification: ALKBH6 demethylates free N7-methyl-GMP and N1-methyl-AMP but not methylated bases, nucleosides
    or nucleic acids. Existing demethylase terms are defined on DNA, RNA or protein substrates, so the
    activity can only be annotated to the 2-oxoglutarate-dependent dioxygenase parent.
  proposed_parent:
    id: GO:0016706
    label: 2-oxoglutarate-dependent dioxygenase activity
  supported_by:
  - reference_id: PMID:40885392
    supporting_text: we demonstrate that ALKBH6 effectively demethylates N-7-methyl-GMP, and N-1-methyl-adenosine
      monophosphate.
  - reference_id: PMID:40885392
    supporting_text: N-methylated dNMPs and NMPs are the primary substrates of ALKBH6
  - reference_id: PMID:40885392
    supporting_text: We observed that the presence of a phosphate group in the substrate molecule is essential
      for ALKBH6 activity as it showed no activity toward methylated bases or the methylated nucleosides.
