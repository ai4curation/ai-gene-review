- id: PMID:33897761
  title: Human ALKBH6 Is Required for Maintenance of Genomic Stability and Promoting Cell Survival During
    Exposure of Alkylating Agents in Pancreatic Cancer.
  findings:
  - statement: ALKBH6 complements E. coli alkB.
    supporting_text: Using an E. coli strain deficient with ALKB, we found that ALKBH6 complements ALKB
      deficiency and increases resistance after alkylating agent treatment.
  - statement: Loss of ALKBH6 increases alkylation damage in pancreatic cancer cells.
    supporting_text: the loss of ALKBH6 in human pancreatic cancer cells increases alkylating agent-induced
      DNA damage and significantly decreases cell survival.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Cellular phenotype; mechanism not shown, and seemingly at odds with
      the absence of activity on nucleic acids.
