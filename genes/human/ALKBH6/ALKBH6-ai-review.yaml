- description: Fe(II)/2OG-dependent dioxygenase that demethylates free methylated ribo- and deoxyribonucleoside
    monophosphates (N7-methyl-GMP, N1-methyl-AMP, 3-methyl-dCMP and others), sanitizing the methylated
    nucleotide pool.
  molecular_function:
