suggested_questions:
- question: How do the original 2005 APOL1 construct and bilayer conditions compare with the later mature-protein
    cation measurements, and which conditions explain chloride versus cation selectivity?
- question: Which original APOL1-specific records support the FAM20C and CDC23 interactions, ER-lumen
    entity and plasma-microvesicle detection?
- question: Does APOL1 itself move lipid cargo or perform a lipoprotein metabolic step underlying the
    InterPro process mappings?
- question: Which physiological activities and compartment distributions distinguish the three annotated
    APOL1 products?
