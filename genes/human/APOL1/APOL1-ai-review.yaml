id: O14791
gene_symbol: APOL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Apolipoprotein L1 is a membrane-active component of human serum trypanosome lytic factors.
  It circulates on lipoprotein particles and acts after uptake by susceptible trypanosomes, disrupting
  parasite membrane ion homeostasis. Mature human APOL1 forms cation-selective channels after acidic membrane
  association and subsequent neutralization. Its carboxy-terminal region is recognized by the trypanosome
  serum resistance-associated protein, which counteracts host killing. Loss of circulating APOL1 can compromise
  innate protection against normally non-human-infective trypanosomes.
