- id: PMID:31478652
  title: Functional Annotation of ABHD14B, an Orphan Serine Hydrolase Enzyme.
  findings:
  - statement: >-
      Human ABHD14B catalyzes CoA-dependent deacetylation of post-translationally
      acetylated protein lysine residues via Ser111 to generate acetyl-CoA and
      free lysine amine, and knockdown in HEK293T cells elevates cellular lysine
      acetylation while lowering acetyl-CoA.
    supporting_text: >-
      Third, we show that genetically knocking down ABHD14B in human HEK293T
      cells, results in increased levels of protein lysine acetylation, and
      decreased cellular concentrations of acetyl-CoA, thereby confirming in
      cell physiological settings, that ABHD14B indeed functions as a novel
      lysine deacetylase (Figure 6).
  - statement: >-
      Endogenous ABHD14B localizes to both the nucleus and cytosol in HEK293T
      cells and is enriched in liver and kidney.
    supporting_text: >-
      Second, we report a selective anti-ABHD14B antibody, and show that this
      enzyme is present throughout the cell (nucleus and cytosol) (Figure 5),
      and is mostly expressed in metabolically rich tissues (kidney, liver)
      (Figure 4).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text primary enzymology study (PMC6976303) establishing ABHD14B's
      ping-pong CoA-dependent protein-lysine deacetylase (KDAC) reaction
      (RHEA:45950), active-site S111A loss of function, inability to act in the
      reverse KAT direction, and nucleocytoplasmic localization.
- id: PMID:35700823
  title: A multi-omics analysis reveals that the lysine deacetylase ABHD14B influences
    glucose metabolism in mammals.
  findings:
  - statement: >-
      Depletion of ABHD14B in human HEK293T cells reduces glycolytic and citric
      acid cycle flux (including an 85-95% drop in pyruvate), and hepatic
      knockdown in mice impairs fasting systemic glucose metabolism.
    supporting_text: >-
      We found from these complementary experiments in vivo that the loss of
      ABHD14B results in significantly altered glucose metabolism, specifically the
      decreased flux of glucose through glycolysis and the citric acid cycle.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text multi-omics and mouse physiological study (PMC9270251) linking
      ABHD14B KDAC activity to glycolytic/TCA flux and fasting hepatic glucose
      homeostasis.
- id: PMID:37974539
  title: Identification of sequence determinants for the ABHD14 enzymes.
  findings:
  - statement: >-
      Sequence determinants separate the mammalian lysine deacetylase ABHD14B
      from its closely related, functionally unannotated paralog ABHD14A, which
      automated databases frequently conflate.
    supporting_text: >-
      While ABHD14A still lacks any functional annotation to date, we 
      recently showed that ABHD14B functions as a lysine deacetylase in mammals. Given 
      their high sequence similarity, automated databases often wrongly assign ABHD14A 
      and ABHD14B as the same enzyme, and therefore, annotating functions to them in 
      various organisms has been problematic.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Defines the sequence and evolutionary boundary between soluble KDAC ABHD14B
      (PTHR46197:SF2) and membrane-anchored paralog ABHD14A (PTHR46197:SF1).
- id: PMID:40658808
  title: CRISPR-mediated proximity labeling unveils ABHD14B as a host factor to regulate
    HBV cccDNA transcriptional activity.
  findings:
  - statement: >-
      Host ABHD14B interacts with TFII-I (GTF2I) to associate with HBV cccDNA
      minichromosomes in human hepatocytes, deacetylating cccDNA-bound histones
      and repressing HBV RNA transcription.
    supporting_text: >-
      These results suggest that the host protein,
      ABHD14B, is recruited to cccDNA via the TFII-I protein, inhibiting HBV RNA
      transcription from cccDNA by deacetylating cccDNA histones.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text study (PMC12263051) demonstrating direct chromatin/minichromosome
      histone deacetylation by nuclear ABHD14B recruited via TFII-I to suppress
      HBV cccDNA transcription.
