      chromogenic assay byproduct p-nitrophenol.
    supported_by:
    - reference_id: Reactome:R-HSA-156584
      supporting_text: >-
        Two groups of sulfotransferease (SULT) enzymes catalyze the transfer of a
        sulfate group from 3-phosphoadenosine 5-phosphosulfate (PAPS) to a hydroxyl group
        on an acceptor molecule, yielding a sulfonated acceptor and 3-phosphoadenosine 5-phosphate
        (PAP).
    - reference_id: Reactome:R-HSA-5695964
      supporting_text: >-
        Alpha/beta hydrolase domain-containing protein 14B (ABHD14B) can hydrolyse
        the model substrate p-nitrophenyl butyrate (PNPB) to p-nitrophenol (PNP)
        and butyric acid (BUT)<br>(Padmanabhan et al. 2004). Its physiological
        substrate is unknown.
    source_defects:
