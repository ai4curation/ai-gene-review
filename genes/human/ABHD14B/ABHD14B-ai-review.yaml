    - reference_id: PMID:31478652
      supporting_text: >-
        To compare the relative production of acetyl-CoA from different
        acetyl-donors, we also ran that same assay with enzyme equimolar
        concentrations of pNp-acetate (instead of the acetyated-lysine peptide),
        and found that the formation of acetyl-CoA was ~ 3.5-fold more when the
        acetylated-lysine peptide was used as the acetyl donor (Figure 7A).
