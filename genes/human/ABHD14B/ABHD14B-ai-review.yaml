- term:
    id: GO:0050427
    label: 3'-phosphoadenosine 5'-phosphosulfate metabolic process
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-156584
  qualifier: involved_in
  review:
    summary: >-
      Spurious Reactome pathway-to-GO projection from R-HSA-156584 ('Cytosolic
      sulfonation of small molecules'). Reactome placed ABHD14B's artificial
      p-nitrophenyl butyrate hydrolysis reaction (R-HSA-5695964, which releases
