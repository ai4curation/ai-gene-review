- id: PMID:11053859
  title: Purification, crystallization and preliminary X-ray crystallographic analysis
    of human CCG1-interacting factor B.
  findings:
  - statement: >-
      Human CIB (ABHD14B, 22 kDa) was isolated in a yeast two-hybrid screen for
      CCG1/TAF1 interactors, expressed in E. coli, and crystallized to 2.2 A
      resolution.
    supporting_text: >-
      A novel human factor CIB (CCG1-interacting factor B) has been isolated using the
      yeast two-hybrid system. The 22 kDa CIB protein has been expressed in
      Escherichia coli, purified to homogeneity and crystallized in a form suitable
      for crystallographic studies.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Primary crystallization report introducing the CIB alias and yeast
      two-hybrid isolation with CCG1/TAF1.
- id: PMID:14672934
  title: The crystal structure of CCG1/TAF(II)250-interacting factor B (CIB).
  findings:
  - statement: >-
      The 2.2 A crystal structure of human CIB (ABHD14B; PDB:1IMJ) reveals an
      alpha/beta-hydrolase fold with a conserved Ser111-Asp162-His188 catalytic
      triad that lacks the canonical lid excursion, interacts with TFIID, and
      hydrolyzes surrogate esters in vitro.
    supporting_text: >-
      CIB possesses a conserved catalytic triad that is found in other
      alpha/beta-hydrolases, and our in vitro studies confirmed that it bears
      hydrolase activity. However, CIB differs from other alpha/beta-hydrolases
      in that it lacks a binding site excursion, which facilitates the substrate
      selectivity of the other alpha/beta-hydrolases.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Foundational structural and biochemical characterization of human ABHD14B
      (PDB:1IMJ), establishing the Ser111-Asp162-His188 triad, TAF1 association,
      and cytosolic/nuclear distribution; its model-substrate p-nitrophenyl
      butyrate esterase assay was later superseded mechanistically by CoA-dependent
      lysine deacetylation (PMID:31478652).
