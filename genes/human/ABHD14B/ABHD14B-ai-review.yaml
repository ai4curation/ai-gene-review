gene_symbol: ABHD14B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Soluble cytosolic and nuclear alpha/beta-hydrolase (210 aa; formerly
  CCG1/TAF(II)250-interacting factor B, CIB) that functions as an atypical
  coenzyme A-dependent protein-lysine deacetylase (KDAC). Using a conserved
  Ser111-Asp162-His188 charge-relay triad within a compact alpha/beta-hydrolase
  fold lacking a canonical lid excursion, ABHD14B catalyzes ping-pong transfer
  of an acetyl group from post-translationally N6-acetylated protein lysine
  residues onto CoA to yield acetyl-CoA and regenerate the free lysine amine
  (RHEA:45950). Through this deacetylation activity, ABHD14B regulates central
  carbon and glucose metabolism (promoting glycolytic and tricarboxylic acid
  cycle flux) and modulates transcription, interacting with the TFIID subunit
  TAF1 and, in hepatitis B virus-infected hepatocytes, associating via TFII-I
  (GTF2I) with viral covalently closed circular DNA (cccDNA) minichromosomes to
  deacetylate cccDNA-bound histones and repress viral transcription. Unlike its
  single-pass type II Golgi-membrane paralog ABHD14A, ABHD14B lacks any
  transmembrane segment and resides in the cytosol and nucleus, with highest
  expression in metabolically active tissues such as liver and kidney.
