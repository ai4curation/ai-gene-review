  title: Affinage mechanistic annotation for ABHD14B (human)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Machine-fetched Affinage synthesis passed all trust gates (self_evaluation_pairwise:
      win, faith_pct: 100.0, 4 real peer-reviewed PubMed citations: PMID:31478652,
      PMID:35700823, PMID:37974539, PMID:40658808; no preprint pseudo-PMIDs).
      Its prose narrative accurately captures CoA-dependent lysine deacetylation,
      central carbon and hepatic glucose metabolic regulation, TFII-I-mediated
      HBV cccDNA histone deacetylation, and sequence divergence from ABHD14A,
      though it omits the primary crystal structure and TAF1 interaction papers
      (PMID:11053859, PMID:14672934). Critically, its structured goslim_generic
      profile is not imported: molecular_activity collapses catalysis into coarse
      upper terms (GO:0140096, GO:0016787, GO:0016740) mixing surrogate hydrolase
      and transferase branches, localization is left completely empty despite
      strong cytosolic and nuclear evidence, and Reactome grounding gives only
      root pathways (Metabolism, Chromatin organization) while missing GOA's
      erroneous RHEA:45948 KAT and R-HSA-156584 PAPS annotations.
