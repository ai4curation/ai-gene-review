proposed_new_terms:
- proposed_name: CoA-dependent protein-lysine deacetylase activity
  proposed_definition: >-
    Catalysis of the reaction: N6-acetyl-L-lysyl-[protein] + coenzyme A =
    L-lysyl-[protein] + acetyl-CoA + H+, removing an N6-acetyl group from a
    protein lysine residue by transfer onto CoA rather than hydrolysis by water.
  justification: >-
    Required to represent RHEA:45950 (the physiological direction of RHEA:45948
    catalyzed by mammalian ABHD14B; PMID:31478652) without triggering either the
    false hydrolytic entailment of GO:0033558 (RHEA:58108) or the inverted
    protein-lysine-acetyltransferase (KAT) mapping GO:0061733 currently emitted
    by GO_REF:0000116.
  proposed_parent:
    id: GO:0016407
    label: acetyltransferase activity
  supported_by:
  - reference_id: PMID:31478652
    supporting_text: >-
      In this paper, we annotate ABHD14B as a lysine deacetylase (KDAC),
      showing this enzyme's ability to transfer an acetyl group from a
      post-translationally acetylated lysine to coenzyme A (CoA), to yield acetyl-CoA,
      while regenerating the free amine of protein lysine residues.
  - reference_id: file:human/ABHD14B/ABHD14B-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: "PhysiologicalDirection=right-to-left; Xref=Rhea:RHEA:45950;"
suggested_questions:
- question: >-
    Which specific endogenous human cytosolic and nuclear acetyl-lysine protein
    substrates are directly deacetylated by ABHD14B to control glycolytic and
    TCA cycle enzyme expression and flux?
- question: >-
    Does the N-terminally truncated splice isoform 2 (Q96IU4-2, lacking residues
    1-69 of the beta-sheet core) fold into a stable protein in vivo or undergo
    rapid proteasomal degradation?
suggested_experiments:
- hypothesis: >-
    Quantitative SILAC or TMT acetylome profiling comparing wild-type, ABHD14B
    knockout, and catalytic-dead S111A rescue hepatocytes will pinpoint direct
    metabolic enzyme and chromatin lysine sites deacetylated by ABHD14B.
  description: >-
    Perform anti-acetyl-lysine immunoaffinity enrichment LC-MS/MS in human
    hepatocytes expressing WT vs S111A ABHD14B, followed by in vitro CoA-dependent
    acetyl-CoA release kinetics with synthetic acetylated peptides spanning the
    top candidate sites.
  experiment_type: proteomics and enzymology
- hypothesis: >-
    Crystal or cryo-EM co-structures of catalytically inactive S111A ABHD14B
    bound to CoA and an H3K27ac or TAF1/GTF2I peptide will define the CoA tunnel
    and protein-substrate recognition surface that distinguish ABHD14B from
    ABHD14A.
  description: >-
    Co-crystallize human ABHD14B S111A with coenzyme A and acetylated histone H3
    peptide and validate key CoA-contacting residues by site-directed mutagenesis.
  experiment_type: structural biology
