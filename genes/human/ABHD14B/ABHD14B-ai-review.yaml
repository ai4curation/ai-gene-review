    reason: >-
      Directly contradicted by biochemical and cellular evidence in PMID:31478652
      and PMID:40658808: ABHD14B cannot use acetyl-CoA as an acetyl donor and
      catalyzes exclusively the reverse CoA-dependent lysine deacetylase (KDAC)
      direction, transferring acetyl groups from acetyl-lysine onto CoA to
      produce acetyl-CoA.
    supported_by:
    - reference_id: PMID:31478652
      supporting_text: >-
        That CoA binds more tightly to ABHD14B and accelerates the enzyme
        catalysed pNp-acetate hydrolysis reaction, and the inability of this
        enzyme to hydrolyze acetyl-CoA, suggested that ABHD14B might, contrary to
        previous speculation23, functions as a deacetylase rather than an
        acetyltransferase.
    - reference_id: PMID:31478652
      supporting_text: >-
        Third, we show that genetically knocking down ABHD14B in human HEK293T
        cells, results in increased levels of protein lysine acetylation, and
        decreased cellular concentrations of acetyl-CoA, thereby confirming in
        cell physiological settings, that ABHD14B indeed functions as a novel
        lysine deacetylase (Figure 6).
