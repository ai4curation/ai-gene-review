      resource: REACTOME
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0050427
      cause: SCOPE_OVER_REACH
      confidence: CONFIRMED
      explanation: >-
        Reactome reaction R-HSA-5695964 ('ABHD14B hydrolyses PNPB', modeling an
        artificial p-nitrophenyl butyrate esterase assay from PMID:14672934) is
        grouped under pathway R-HSA-156584 ('Cytosolic sulfonation of small
        molecules') solely because p-nitrophenol is a model substrate for SULT
        sulfotransferases, causing GO export to assign PAPS metabolic process
        (GO:0050427) to ABHD14B. ABHD14B is a CoA-dependent protein-lysine
        deacetylase (PMID:31478652) with no role in PAPS metabolism.
