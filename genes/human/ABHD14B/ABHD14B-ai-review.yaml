        showing this enzyme's ability to transfer an acetyl group from a
        post-translationally acetylated lysine to coenzyme A (CoA), to yield acetyl-CoA,
        while regenerating the free amine of protein lysine residues.
    - reference_id: file:human/ABHD14B/ABHD14B-uniprot.txt
      record_section: ["CC:CAUTION"]
      supporting_text: >-
        The protein-lysine deacetylase activity using CoA as substrate is unclear
        as this protein belongs to a family of serine hydrolases, and that the
        reaction shown in the publication is not hydrolyzing H(2)O.
