id: O14980
gene_symbol: XPO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: XPO1 encodes CRM1/exportin-1, a RanGTP-dependent karyopherin that recognizes leucine-rich nuclear export signal cargos in the nucleus and exports them through the nuclear pore to the cytoplasm. It is the principal receptor for cellular NES-containing protein cargos and also carries cargo-adaptor assemblies for ribosomal subunits, selected ribonucleoprotein particles, viral RNAs and specialized protein quality-control substrates.
