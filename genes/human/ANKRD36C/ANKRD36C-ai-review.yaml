- term:
    id: GO:0008200
    label: ion channel inhibitor activity
  evidence_type: NAS
  original_reference_id: PMID:8608414
  qualifier: enables
  review:
    summary: Ion channel inhibitor activity (NAS). The cited paper characterized a cDNA fragment of ANKRD36C
      as the source of PTH-immunoreactive material in a tumor, and found that its product does not inhibit
      phosphate transport. The phosphate-transport inhibitor in that study was a separate secreted factor,
      and phosphate transport is not ion-channel activity.
    action: REMOVE
    reason: 'The paper identified a secreted inhibitor of phosphate transport, [PMID:8608414 "We identified
      a heat labile, 8,000-25,000 dalton, inhibitor of renal epithelial phosphate transport in supernatants
      of cultured sclerosing hemangioma cells"], and separately cloned the cDNA behind PTH immunoreactivity:
      [PMID:8608414 "We have characterized a cDNA that encodes the PTH immunoreactive material."] That
      cDNA is the ANKRD36C fragment [file:human/ANKRD36C/ANKRD36C-uniprot.txt "RP   NUCLEOTIDE SEQUENCE
      [MRNA] OF 935-1305 (ISOFORM 1)."] [file:human/ANKRD36C/ANKRD36C-uniprot.txt "DE   AltName: Full=Protein
      immuno-reactive with anti-PTH polyclonal antibodies;"] When tested, it was inactive: [PMID:8608414
      "Opossum kidney cells transfected with the cDNA do not produce a product that inhibits phosphate
      transport."] The annotation is therefore contradicted by its own source, and the term would be wrong
      even for the true inhibitor, since renal phosphate uptake is a transporter process, not an ion channel.'
    supported_by:
    - reference_id: PMID:8608414
      supporting_text: We identified a heat labile, 8,000-25,000 dalton, inhibitor of renal epithelial
        phosphate transport in supernatants of cultured sclerosing hemangioma cells
    - reference_id: PMID:8608414
      supporting_text: We have characterized a cDNA that encodes the PTH immunoreactive material.
    - reference_id: file:human/ANKRD36C/ANKRD36C-uniprot.txt
      supporting_text: RP   NUCLEOTIDE SEQUENCE [MRNA] OF 935-1305 (ISOFORM 1).
    - reference_id: file:human/ANKRD36C/ANKRD36C-uniprot.txt
      supporting_text: 'DE   AltName: Full=Protein immuno-reactive with anti-PTH polyclonal antibodies;'
    - reference_id: PMID:8608414
      supporting_text: Opossum kidney cells transfected with the cDNA do not produce a product that inhibits
        phosphate transport.
