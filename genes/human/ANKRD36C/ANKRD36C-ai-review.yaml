  label: Homo sapiens
description: ANKRD36C (ankyrin repeat domain-containing 36C) is an uncharacterized ankyrin-repeat and
  coiled-coil protein of the ANKRD36 family. A cDNA fragment of it was first cloned as the source of parathyroid
  hormone (PTH)-immunoreactive material in a tumor causing osteomalacia, but its product did not inhibit
  renal phosphate transport. No molecular activity, location or biological role has been established.
