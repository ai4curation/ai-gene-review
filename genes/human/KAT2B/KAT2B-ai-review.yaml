  evidence_type: IDA
  original_reference_id: PMID:18838386
  qualifier: involved_in
  review:
    summary: Keep as non core negative regulation of transcription by RNA polymerase II.
    action: KEEP_AS_NON_CORE
    reason: Human ATAC complexes can include GCN5 or PCAF and can repress promoter transcription
      when recruited; this is real but peripheral to the core H3 acetyltransferase role.
    supported_by:
