suggested_questions:
- question: Which non-histone KAT2B substrates are directly acetylated in primary human cells?
- question: How do SAGA-bound and ATAC-bound KAT2B divide locus-specific H3K9/H3K14 acetylation?
suggested_experiments:
- description: Use endogenous tagging and complex-specific degrons to measure how SAGA- versus
    ATAC-associated KAT2B controls promoter and enhancer H3K9/H3K14 acetylation.
- description: Rescue KAT2B-depleted cells with catalytically inactive and bromodomain-mutant
    alleles and use quantitative acetyl-proteomics to separate direct substrates from downstream
    transcriptional effects.
