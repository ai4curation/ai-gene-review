- term:
    id: GO:0004468
    label: L-lysine N6-acetyltransferase activity, acting on acetyl phosphate as donor
  evidence_type: IDA
  original_reference_id: PMID:19303849
  qualifier: enables
  review:
    summary: Remove L-lysine N6-acetyltransferase activity, acting on acetyl phosphate as donor.
    action: REMOVE
    reason: The acetyl-phosphate donor term names the wrong reaction for KAT2B; the direct KAT2B
      reactions use acetyl-CoA to acetylate histones, proteins, or spermidine.
    source_defects:
    - defect_type: WRONG_TERM
      resource: ARUK_UCL
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0004468
      corrected_value: GO:0061733
      corrected_label: protein-lysine-acetyltransferase activity
      cause: OTHER
      confidence: CONFIRMED
      explanation: KAT2B/PCAF is a protein lysine acetyltransferase that uses acetyl-CoA. GO:0004468
        instead describes L-lysine N6-acetyltransferase activity using acetyl phosphate as the
        donor, which is a different reaction. Please re-point curated rows to GO:0061733 and check
        propagated rows after the source term is fixed.
      supported_by: &id002
      - reference_id: file:human/KAT2B/KAT2B-notes.md
        supporting_text: No KAT2B publication checked in this review used acetyl phosphate as the
          acyl donor.
      - reference_id: file:human/KAT2B/KAT2B-uniprot.txt
        record_section:
        - CC:CATALYTIC ACTIVITY
        supporting_text: Reaction=L-lysyl-[protein] + acetyl-CoA = N(6)-acetyl-L-lysyl-[protein]
    supported_by: *id002
