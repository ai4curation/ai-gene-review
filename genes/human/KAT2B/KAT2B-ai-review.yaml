id: Q92831
gene_symbol: KAT2B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KAT2B encodes PCAF, the vertebrate paralogue of KAT2A/GCN5 and an alternative
  GNAT-family catalytic subunit of SAGA and ATAC histone acetyltransferase complexes. KAT2B
  acetylates histone H3, especially H3K9, to support chromatin remodeling and RNAPII coactivation,
  and it also acetylates non-histone substrates including ACLY, MAPRE1/EB1, PLK4, RRP9, TBX5 and
  FSP1 in target-specific transcriptional, cell-cycle, lipid-metabolic and stress-response contexts.
