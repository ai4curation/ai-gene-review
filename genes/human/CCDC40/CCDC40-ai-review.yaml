suggested_questions:
- question: Which patient-level observations in the full PMID:22693285 report support CCDC40-specific
    lung development and digestive-tract laterality? The original human heart, pancreas and liver
    mappings also remain uninspected even though conserved involvement is retained from independent
    laterality evidence.
- question: How do the five human CCDC40 alternative products differ in expression, axonemal incorporation
    and partner recruitment? Existing evidence does not resolve these products separately.
- question: Does the observed cytoplasmic CCDC40 pool perform a defined preassembly or trafficking
    step, or mainly supply the axonemal scaffold? Partner localization defects alone do not establish
    active transport.
- question: Which historical IBD placements support the five PAINT rows, and which rule execution
    produced the process-to-extracellular-location inference? The accepted biology does not depend
    on assuming those uninspected details.
suggested_experiments:
- description: Compare endogenous, isoform-resolved human CCDC40 localization and rescue in patient-derived
    airway epithelia, measuring 96-nm organization, partner retention, ciliary frequency and waveform
    together. Distinguish axonemal assembly from cytoplasmic preassembly with temporally controlled rescue.
