id: Q4G0X9
gene_symbol: CCDC40
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CCDC40 is a coiled-coil structural component of the axoneme of motile cilia. Together with
  CCDC39, it forms part of the longitudinal scaffold organizing the 96-nm repeat and the positioning of
  inner dynein arms and associated regulatory structures. Human respiratory-cell studies link loss of
  CCDC40 to disrupted axonemal periodicity, defective inner dynein arms and ineffective ciliary beating,
  while the outer dynein-arm repeat can remain intact. CCDC40-dependent organization also supports recruitment
  or retention of other axonemal proteins. Its ciliary role contributes to mucociliary transport and embryonic
  left-right patterning. Biallelic loss-of-function variants cause primary ciliary dyskinesia, frequently
  with laterality abnormalities; the functions of its individual alternative products are not separately
  established.
