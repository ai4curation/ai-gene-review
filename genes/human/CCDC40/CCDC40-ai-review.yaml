core_functions:
- description: CCDC40 contributes the coiled-coil structural scaffold of the motile axoneme with
    CCDC39, organizing the 96-nm repeat and the docking or retention of inner dynein-arm and regulatory
    components. This physical organization supports effective ciliary movement. Human structures
    and mutant respiratory epithelia establish the target role; mouse localization and algal structural
    guidance are complementary rather than interchangeable evidence. The scaffold is not itself
    a dynein motor or an established active transporter.
  molecular_function:
    id: GO:0005200
    label: structural constituent of cytoskeleton
