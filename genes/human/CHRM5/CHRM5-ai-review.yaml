  review:
    summary: The documented M5 cyclic-nucleotide context is inhibition of cAMP accumulation.
    action: MODIFY
    reason: 'The human A2058 melanoma study resolves this particular cyclic-nucleotide response to the
      already-present cyclase-inhibiting muscarinic process. The response is calcium dependent and pertussis-toxin
      insensitive, so this refinement does not assert a conventional Gi mechanism. Original ancestral
      source: PANTHER:PTN000664111.'
    supported_by:
    - reference_id: PMID:8663391
    proposed_replacement_terms:
