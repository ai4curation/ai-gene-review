id: P08912
gene_symbol: CHRM5
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CHRM5 encodes the M5 muscarinic acetylcholine receptor, a seven-transmembrane receptor whose
  usual signaling preference is phosphoinositide turnover through Gq/11 pathways. It contributes to cholinergic
  signaling in the nervous system and other tissues. M5 physiology is context dependent: native human
  melanoma cells show calcium-dependent inhibition of cyclic-AMP accumulation and phospholipase A2 activation,
  whereas mouse studies implicate M5 in gastric acid secretion. These contexts do not imply identical
  downstream coupling in every M5-expressing cell.'
existing_annotations:
- term:
    id: GO:0001696
    label: gastric acid secretion
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000502
  review:
    summary: M5 contributes to cholinergic gastric acid secretion.
    action: KEEP_AS_NON_CORE
    reason: A direct mouse M5-knockout study found reduced carbachol-stimulated acid and histamine secretion.
      This independently supports the subtype-specific physiological inference beyond the InterPro mapping.
      M5 was detected in whole stomach but not isolated mucosa, so a neuronal/submucosal contribution
      is plausible and direct parietal-cell M5 action is not asserted.
    supported_by:
    - reference_id: PMID:15691866
      supporting_text: 'M(5) KO mice

        exhibited both significantly lower carbachol-stimulated gastric acid secretion

        and histamine-secretory responses to carbachol compared with WT mice.'
