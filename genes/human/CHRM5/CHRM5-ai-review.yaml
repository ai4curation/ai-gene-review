      label: adenylate cyclase-inhibiting G protein-coupled acetylcholine receptor signaling pathway
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000664111
        source_status: UNRESOLVED
        comment: The inherited broad function is retained as biologically sound and refined using independent
          target evidence. No failure of ancestral-node placement or donor count is alleged; the complete
          historical node reconstruction was not inspected.
