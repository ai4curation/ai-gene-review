  review:
    summary: Native human M5 can inhibit cAMP accumulation in a defined cell context.
    action: KEEP_AS_NON_CORE
    reason: 'The A2058 melanoma study sequences the endogenous M5 coding region and measures inhibition
      of forskolin-stimulated cAMP. This supports the existing process despite the usual Gq/PLC preference.
      The inhibition was pertussis-toxin insensitive and extracellular-calcium dependent; a universal
      M5-Gi-cyclase pathway would overstate the evidence. Original ancestral source: PANTHER:PTN001207082.'
    supported_by:
    - reference_id: PMID:8663391
      supporting_text: 'This m5AChR coupled to stimulation of

        arachidonic acid release and to a 50% inhibition of forskolin-stimulated cAMP

        accumulation.'
