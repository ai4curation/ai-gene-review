id: Q9BZE9
gene_symbol: ASPSCR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ASPSCR1 (TUG, ASPL, UBXD9) is a UBX-domain protein with two functions. As TUG, it tethers
  insulin-responsive GLUT4 storage vesicles intracellularly: its N-terminal region binds GLUT4 and its
  C-terminal region anchors to the Golgi matrix. Insulin triggers Usp25m-dependent endoproteolytic cleavage
  of TUG, releasing the vesicles for translocation to the cell surface of fat and muscle cells. As ASPL,
  it binds the AAA+ ATPase p97/VCP through an extended UBX domain and disassembles p97 hexamers into p97:ASPL
  heterotetramers; it resides at the ER-Golgi intermediate compartment. It also stimulates VCP lysine
  trimethylation by VCPKMT. Rearrangement fusing ASPSCR1 to TFE3 produces the ASPSCR1-TFE3 oncogenic transcription
  factor of alveolar soft part sarcoma.'
