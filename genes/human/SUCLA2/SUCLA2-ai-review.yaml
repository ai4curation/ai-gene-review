id: Q9P2R7
gene_symbol: SUCLA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SUCLA2 encodes the ATP-specific beta subunit (beta-A) of mitochondrial succinyl-CoA synthetase
  (succinate-CoA ligase, ADP-forming; EC 6.2.1.5). The beta-A subunit pairs with the shared
  alpha subunit SUCLG1 to form an alpha:beta heterodimer in the mitochondrial matrix; the
  beta subunit binds Mg2+, the nucleotide (conferring ATP/ADP rather than GTP/GDP specificity)
  and succinate, while the alpha subunit binds CoA and phosphate. The enzyme converts succinyl-CoA
  to succinate and CoA in the tricarboxylic acid cycle, coupled to ATP formation from ADP
  and phosphate, the only substrate-level phosphorylation step of the cycle. The ATP-forming
  isoform predominates in brain and skeletal muscle and is largely neuronal in the brain.
  The enzyme is promiscuous toward related dicarboxylates, producing malyl-CoA and itaconyl-CoA
  side products, and its activity is inhibited by itaconate. SUCLA2 associates with the erythroid
  aminolevulinate synthase ALAS2 and has been proposed to supply succinyl-CoA for heme synthesis,
  and the enzyme copurifies with mitochondrial nucleoside diphosphate kinase. Biallelic SUCLA2
  loss of function causes an encephalomyopathic mitochondrial DNA depletion syndrome with
  dystonia, deafness and mild methylmalonic aciduria; succinyl-CoA accumulation, protein hypersuccinylation
  and reduced mtDNA copy number accompany the enzyme defect.
