id: Q9P2R7
gene_symbol: SUCLA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SUCLA2 encodes the beta subunit of the ATP-specific (ADP-forming) succinyl-CoA synthetase, a mitochondrial
  matrix heterodimer formed with the alpha subunit SUCLG1. The enzyme converts succinyl-CoA to succinate
  and CoA while phosphorylating ADP to ATP, the only substrate-level phosphorylation step of the tricarboxylic
  acid cycle; the beta subunit determines nucleotide specificity, and a paralogous GTP-specific beta subunit
  (SUCLG2) forms the GTP-forming isoenzyme. SUCLA2 is highly expressed in brain and skeletal muscle. The
  enzyme associates with mitochondrial nucleoside diphosphate kinase, which has been proposed to link
  it to mitochondrial dNTP salvage. As a promiscuous enzyme it can also form malyl-CoA and itaconyl-CoA.
  Biallelic SUCLA2 loss-of-function variants cause an encephalomyopathic mtDNA depletion syndrome with
  mildly elevated methylmalonic acid, deafness, dystonia and Leigh-like lesions (MTDPS5).
