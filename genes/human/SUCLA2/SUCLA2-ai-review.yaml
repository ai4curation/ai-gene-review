core_functions:
- description: >-
    ATP-specific (ADP-forming) succinyl-CoA synthetase: as the nucleotide- and succinate-binding
    beta subunit of the SUCLG1:SUCLA2 heterodimer in the mitochondrial matrix, converts succinyl-CoA
    to succinate and CoA in the TCA cycle, coupled to substrate-level phosphorylation of ADP
    to ATP.
  molecular_function:
    id: GO:0004775
    label: succinate-CoA ligase (ADP-forming) activity
  directly_involved_in:
  - id: GO:0006099
    label: tricarboxylic acid cycle
  - id: GO:1901289
    label: succinyl-CoA catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  in_complex:
    id: GO:0009361
    label: succinate-CoA ligase complex (ADP-forming)
  supported_by:
  - reference_id: PMID:15877282
    supporting_text: >-
      Markedly decreased succinyl-CoA synthetase activity due to a deleterious mutation in
      SUCLA2
  - reference_id: PMID:39482887
    supporting_text: >-
      SCS catalyses the conversion of succinyl-CoA to succinate coupled with substrate-level
      phosphorylation of either ADP or GDP in the TCA cycle.
  - reference_id: PMID:17287286
    supporting_text: >-
      The SUCLA2 gene encodes the ATP-forming beta subunit of the Krebs cycle enzyme succinyl-CoA
      ligase.
suggested_questions:
- question: >-
    By what mechanism does SUCLA2 deficiency cause mtDNA depletion: loss of an SCS-nucleoside
    diphosphate kinase (NME4) complex that phosphorylates mitochondrial dNDPs, reduced matrix
    ATP, or succinyl-CoA-driven hypersuccinylation of proteins required for mtDNA maintenance?
- question: >-
    Does SUCLA2 supply succinyl-CoA to ALAS2 for erythroid heme synthesis in vivo, given the
    physical interaction, or is the interaction incidental?
- question: >-
    How much malyl-CoA and itaconyl-CoA does the ATP-specific SCS generate in vivo, and does
    this side activity contribute to the methylmalonic aciduria seen in SUCLA2 deficiency?
suggested_experiments:
- description: >-
    Measure mitochondrial dNTP pools and mtDNA copy number in SUCLA2-deficient neurons with
    and without NME4 co-depletion and with SIRT5 overexpression, to separate a dNTP salvage
    mechanism from a succinylation-driven mechanism of mtDNA depletion.
- description: >-
    Test for succinyl-CoA channelling between SUCLA2-containing SCS and ALAS2 by isotope tracing
    of 13C-succinate into heme in erythroid cells expressing wild-type or binding-deficient
    ALAS2.
