core_functions:
- description: >-
    ATP-specific beta subunit of the mitochondrial succinyl-CoA synthetase heterodimer (with SUCLG1),
    which couples succinyl-CoA cleavage to succinate and CoA to phosphorylation of ADP to ATP. This is
    the substrate-level phosphorylation step of the TCA cycle; the beta subunit sets ATP specificity and
    binds succinate.
  molecular_function:
    id: GO:0004775
    label: succinate-CoA ligase (ADP-forming) activity
  directly_involved_in:
  - id: GO:0006099
    label: tricarboxylic acid cycle
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  in_complex:
    id: GO:0009361
    label: succinate-CoA ligase complex (ADP-forming)
  substrates:
  - id: CHEBI:57292
    label: succinyl-CoA
  supported_by:
  - reference_id: PMID:15877282
    supporting_text: >-
      Markedly decreased succinyl-CoA synthetase activity due to a deleterious mutation in SUCLA2, the
      gene encoding the beta subunit of the ADP-forming succinyl-CoA synthetase ligase, was found in muscle
      mitochondria of patients with encephalomyopathy and mtDNA depletion.
  - reference_id: PMID:17287286
    supporting_text: >-
      The SUCLA2 gene encodes the ATP-forming beta subunit of the Krebs cycle enzyme succinyl-CoA ligase.
  - reference_id: PMID:32627745
    supporting_text: >-
      Succinyl-CoA synthetase (SCS) catalyzes the only substrate-level phosphorylation step in the tricarboxylic
      acid cycle.
  - reference_id: Reactome:R-HSA-70997
    supporting_text: >-
      The enzyme catalyzing the reaction in vertebrates is a heterodimer of SUCLG1 and SUCLA2 that occurs
      in two isoforms.
  - reference_id: file:human/SUCLA2/SUCLA2-uniprot.txt
    supporting_text: >-
      The beta subunit provides nucleotide specificity of the enzyme and binds the substrate succinate
suggested_questions:
- question: >-
    By what mechanism does loss of ATP-specific succinyl-CoA synthetase lead to mtDNA depletion: impaired
    mitochondrial NDPK-dependent dNTP salvage, protein hypersuccinylation, or reduced TCA flux?
- question: >-
    Does the SUCLA2-ALAS2 interaction channel succinyl-CoA into heme biosynthesis in erythroid cells in
    vivo?
suggested_experiments:
- description: >-
    Measure mitochondrial dNTP pools, mtDNA copy number and lysine succinylation in SUCLA2-null human
    iPSC-derived neurons, with rescue by wild-type SUCLA2 versus an NDPK-binding-deficient SUCLA2 mutant,
    to separate the dNTP-salvage and succinyl-CoA-accumulation hypotheses.
