id: Q5T9A4
gene_symbol: ATAD3B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATAD3B is a primate-specific AAA+ ATPase-family mitochondrial membrane protein, a paralog
  of ATAD3A, expressed mainly in pluripotent stem cells and re-expressed in cancers. It hetero-oligomerizes
  with ATAD3A, which places its C-terminus in the intermembrane space, and it limits ATAD3A's association
  with mtDNA nucleoids, favouring a fragmented mitochondrial network. When oxidative stress damages or
  depletes mtDNA, the hetero-oligomer dissociates and the ATAD3B C-terminus is exposed on the outer membrane.
  There its LC3-interacting region recruits LC3 and triggers PINK1-independent mitophagy that clears damaged
  mtDNA.
