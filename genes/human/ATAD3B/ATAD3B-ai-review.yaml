      the ubiquitous ATAD3A species, negatively regulates the interaction of ATAD3A with matrix nucleoid
      complexes and contributes to a mitochondria fragmentation phenotype.
  - reference_id: PMID:33665835
    supporting_text: Under normal conditions, ATAD3B hetero-oligomerizes with ATAD3A, thus promoting the
      targeting of the C-terminal region of ATAD3B to the mitochondrial intermembrane space.
