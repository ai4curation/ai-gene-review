core_functions:
- molecular_function:
    id: GO:0032977
    label: membrane insertase activity
  description: MTCH1 is an insertase of the mitochondrial outer membrane that mediates insertion of
    alpha-helical proteins - signal-anchored, tail-anchored and polytopic substrates - into the outer
    membrane, and does not act on beta-barrel proteins. It works in parallel with, and partially
    redundantly to, its paralogue MTCH2, with which it is synthetic lethal in human cells. Mechanism
    is inferred from the MTCH family fold - a diverged SLC25 scaffold in which loss of a transmembrane
    helix creates a lipid-accessible hydrophilic groove that lowers the barrier to transmembrane-helix
    integration. MTCH1 can carry out this activity by itself, as shown by its ability to replace the
    evolutionarily unrelated yeast Mim1/Mim2 complex and restore substrate biogenesis, TOM complex
    stability and mitochondrial morphology.
  directly_involved_in:
  - id: GO:0045040
    label: protein insertion into mitochondrial outer membrane
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:40704594
    supporting_text: These findings indicate that MTCH1, by itself, has insertase activity and is a
      functional equivalent for the MIM complex, despite the absence of any evolutionary relation
      between the mammalian and yeast insertases.
  - reference_id: PMID:42308315
    supporting_text: we observed that MTCH1 could partially rescue loss of MTCH2 for several
      α-helical OM substrates
  - reference_id: PMID:36264797
    supporting_text: We therefore propose that MTCH1/2 are the founding members of a unique class of
      membrane protein insertases that exploit the SLC25 transporter fold
suggested_questions:
- question: MTCH1 and MTCH2 retain the SLC25 fold but no transported substrate has ever been reported
    for either. Is the carrier activity genuinely lost, or has it simply never been assayed? The
    UniProt entry still carries the "Transport" keyword and the protein name asserts a carrier
    function; should both be retired?
  experts:
  - Voorhees RM
  - Guna A
- question: Why does MTCH1, but not MTCH2, complement the yeast MIM complex even after MTCH2 is
    redirected to mitochondria by an MTCH1 N-terminal fusion? Is this substrate recognition, helix
    packing, or lipid-environment compatibility - and does it imply that MTCH1 and MTCH2 have
    non-identical substrate ranges in human cells?
  experts:
  - Rapaport D
  - Dimogkioka AR
- question: Is the apoptosis induced by MTCH1 overexpression a consequence of its insertase activity
    (for example mis-insertion or saturation of outer-membrane protein biogenesis), or a separate
    activity? Does an insertase-dead MTCH1 groove mutant still kill cells?
  experts:
  - Voorhees RM
- question: Do MTCH1 and MTCH2 have distinct physiological substrate sets, and does MTCH1 loss
    produce a phenotype that MTCH2 overexpression cannot rescue?
  experts: []
suggested_experiments:
- hypothesis: MTCH1 has no transport activity and the SLC25-derived "carrier" assignment should be
    formally retired.
  description: Reconstitute purified MTCH1 into proteoliposomes and screen for transport of the
    standard SLC25 substrate panel (nucleotides, carboxylates, amino acids, carnitine, phosphate)
    under the same conditions used for canonical carriers, alongside a positive-control SLC25 carrier
    and the already-validated MTCH1 insertion assay as an activity control. A negative result with a
    demonstrably active preparation would be publishable evidence for loss of transport.
- hypothesis: MTCH1-induced apoptosis requires an intact insertase groove.
  description: Express wild-type MTCH1 and groove mutants (using the residue positions shown to
    modulate MTCH insertase activity) at matched levels, and compare insertion of a split-GFP
    outer-membrane reporter against cytochrome c release, caspase-3 activation and viability.
    Dissociation of the two readouts would establish a second, insertase-independent activity.
- hypothesis: MTCH1 and MTCH2 act on overlapping but non-identical substrate sets.
  description: Perform substrate-resolved insertion profiling (split-GFP reporters or proximity
    labelling across a panel of signal-anchored, tail-anchored and polytopic outer-membrane proteins)
    in single MTCH1 and MTCH2 knockdowns and in the double knockdown, and test cross-rescue by
    overexpressing each paralogue in the other's background.
