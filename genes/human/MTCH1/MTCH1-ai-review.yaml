gene_symbol: MTCH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Multi-pass protein of the mitochondrial outer membrane that acts as an insertase for
  alpha-helical outer-membrane proteins. MTCH1 is the vertebrate paralogue of MTCH2, and both belong
  to a holozoan-wide clade that retains the six-transmembrane SLC25 (mitochondrial carrier) fold while
  having diverged from the SLC25 transporters: the clade has lost transporter elements including the
  interhelical salt bridges required for alternating access, and insertase activity is associated with
  loss of a transmembrane helix that opens a lipid-accessible hydrophilic groove. Despite the name
  "mitochondrial carrier homolog", no transported substrate has ever been identified for MTCH1 or MTCH2,
  and there is no evidence that either protein is a carrier. Insertase capability of MTCH1 itself is
  supported by depletion phenotypes that are additive with loss of MTCH2 in human cells, by partial
  rescue of MTCH2 loss in human cells, and by the ability of MTCH1 alone to substitute for the
  unrelated yeast Mim1/Mim2 (MIM) insertase complex, restoring growth, substrate biogenesis, TOM complex
  stability and mitochondrial morphology. MTCH1 was originally described as presenilin-associated protein
  (PSAP), a putative PDZ-like presenilin-1 interactor; that domain assignment has not been borne out.
  Overexpression of MTCH1 triggers cytochrome c release, caspase-3 activation and apoptosis, but the
  mechanism connecting this to its insertase activity is not established.'
