    label: positive regulation of apoptotic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Phylogenetic propagation of the proapoptotic role, seeded in part by MTCH1's own
      experimental annotation and by the mouse orthologue.
    action: KEEP_AS_NON_CORE
    reason: The underlying observation is a gain-of-function phenotype (overexpression of MTCH1/PSAP
      causes cytochrome c release, caspase-3 activation and apoptosis), reproducible enough that a
      later study had to add a pan-caspase inhibitor merely to package MTCH1 lentivirus. But no
      mechanism links it to the established molecular function, and the alternative reading - that
      disrupting outer-membrane protein biogenesis secondarily triggers apoptosis - has not been
      excluded. Retained as a genuine but peripheral role rather than a core function. Deliberately
      NOT merged with the separate MTCH2/BAX-BAK pore literature (PMID:42056306), which has not been
      tested on MTCH1.
