- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8TBB1
  review:
    summary: A proteome-scale binary-interaction map detected LNX1 self-association
      (PMID:25416956).
    action: KEEP_AS_NON_CORE
    reason: Homomeric interaction is more informative than generic protein binding, but
      a high-throughput self-interaction does not by itself define the core E3-ligase function.
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:36115835
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8TBB1
  review:
    summary: Quantitative fragmentomics independently detected LNX1 self-association
      (PMID:36115835).
    action: KEEP_AS_NON_CORE
    reason: This corroborates homomeric binding, while its functional importance for
      substrate selection or ubiquitin transfer remains unresolved.
- term:
    id: GO:0004842
