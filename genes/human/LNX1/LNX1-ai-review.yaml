  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:O70263
  - ensembl:ENSMUSP00000113035
  review:
    summary: Mouse-ortholog transfer correctly identifies ubiquitin-protein transferase
      activity, but LNX1 is specifically a RING-type E3 ubiquitin ligase.
    action: MODIFY
