core_functions:
- description: >-
    Q8TBB1-1 (LNX1p80) uses its N-terminal Zn-RING-Zn module as an intrinsic
    ubiquitin protein ligase and its C-terminal PDZ domains to recruit selected
    substrates. It drives both substrate-specific degradative ubiquitination and
    non-degradative regulatory ubiquitination; these are alternative outcomes of
    the same core E3 activity rather than a universal commitment to proteolysis.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0016567
    label: protein ubiquitination
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:29496391
    supporting_text: The RING domain of LNX1 is embedded between two zinc-finger motifs (Zn-RING-Zn), both of which are crucial for its ubiquitination activity.
    reference_section_type: ABSTRACT
  - reference_id: PMID:17936276
    supporting_text: Moreover, c-Src itself is ubiquitinated by LNX1, suggesting an interdependent regulation of c-Src and LNX1.
    reference_section_type: ABSTRACT
  - reference_id: PMID:29121065
    supporting_text: We show that PPFIA1 (liprin-α1), KLHL11, KIF7 and ERC2 are substrates for ubiquitination by LNX1.
    reference_section_type: ABSTRACT
  - reference_id: PMID:36192543
    supporting_text: Co-transfection of HEK293T cells with 3xHA-RhoC and LNX1, LNX2 or Smurf1 followed by HA co-immunoprecipitation (IP), revealed robust monoubiquitination by LNX1, and to a lesser degree by LNX2 (Fig. 1B and S1B).
    reference_section_type: RESULTS
- description: >-
    Q8TBB1-2 (LNX1p70) lacks the Zn-RING-Zn catalytic module and therefore does
    not intrinsically enable ubiquitin protein ligase activity. Its retained PDZ-rich
    region functions as a multivalent scaffold for selected ligands and can promote
    their ubiquitination indirectly by recruiting other E3 ligases.
  molecular_function:
    id: GO:0140378
    label: protein complex scaffold activity
  directly_involved_in:
  - id: GO:0016567
    label: protein ubiquitination
  supported_by:
  - reference_id: PMID:29121065
    supporting_text: On this basis we propose a model whereby LNX1p70, despite lacking a catalytic RING domain, may function as a scaffold to promote ubiquitination of its ligands through recruitment of other E3-ligases.
    reference_section_type: ABSTRACT
knowledge_gaps:
- gap_statement: >-
    The endogenous, tissue-specific substrate hierarchy of LNX1p80 and the rules
    determining whether a recruited substrate undergoes degradative polyubiquitination,
    regulatory monoubiquitination, or another ubiquitin outcome remain unresolved.
  boundary: >-
    PDZ-dependent recruitment and ubiquitination are established for several substrates,
    including SRC, PPFIA1, KLHL11, KIF7, ERC2, and RHOC, but many reported partners
    come from interaction screens and only a subset has been validated as substrates.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this substrate-and-outcome code is necessary to distinguish LNX1's
    physiological proteostatic roles from its non-degradative signaling functions.
  resolution: >-
    Endogenous isoform-specific perturbation combined with ubiquitin-linkage,
    ubiquitin-remnant, protein-stability, and interaction proteomics across relevant
    cell types would identify direct substrates and classify their ubiquitin outcomes.
  provenance:
  - reference_id: PMID:29121065
    supporting_text: However, the physiological relevance of these interactions in vivo remain unclear.
    reference_section_type: ABSTRACT
- gap_statement: >-
    The identity of the E3 ligase or ligases recruited by RING-less LNX1p70, the
    ligand contexts in which recruitment occurs, and whether this indirect
    ubiquitination mechanism operates at endogenous abundance in vivo are unknown.
  boundary: >-
    LNX1p70 lacks the catalytic RING region, retains the PDZ scaffold region, and
    can promote lower-level ligand ubiquitination in human cells; the published
    mechanism is explicitly a recruitment model rather than demonstrated intrinsic
    E3 catalysis by p70.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Identifying the recruited catalyst is essential for understanding the distinct
    biological role of the neuronal p70 isoform without misassigning p80's intrinsic
    ligase activity to it.
  resolution: >-
    Compare endogenous p70 interactomes with ubiquitination phenotypes after targeted
    depletion of candidate E3 ligases, followed by rescue with interaction-defective
    p70 and catalytically inactive candidate-E3 mutants.
  provenance:
  - reference_id: PMID:29121065
    supporting_text: On this basis we propose a model whereby LNX1p70, despite lacking a catalytic RING domain, may function as a scaffold to promote ubiquitination of its ligands through recruitment of other E3-ligases.
    reference_section_type: ABSTRACT
- gap_statement: >-
    Endogenous expression, localization, and partner occupancy of LNX1p80 versus
    LNX1p70 across human tissues and cell states are insufficiently resolved.
  boundary: >-
    Human LNX1 is observed in the cytosol and at cell junctions, while p70 has been
    described as neuronal; current localization annotations do not distinguish the
    isoforms, and transferred synaptic biology is largely based on mouse evidence.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Isoform-resolved cellular context is required to connect the distinct catalytic
    and scaffold activities to physiological substrates and to evaluate proposed
    neuronal functions in humans.
  resolution: >-
    Introduce isoform-specific endogenous tags and use targeted transcript/protein
    quantification, imaging, and proximity labeling across epithelial and neuronal
    human models.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which endogenous human substrates are preferentially engaged by LNX1p80, and
    what determines degradative versus regulatory ubiquitination for each substrate?
- question: >-
    Which E3 ligase or ligases are recruited by LNX1p70, and is this recruitment
    required for endogenous ligand ubiquitination in neuronal cells?
- question: >-
    How do the abundance, localization, and partner networks of p80 and p70 differ
    across human tissues and cell states?
suggested_experiments:
- description: >-
    Generate isogenic human cells expressing endogenous p80-only, p70-only,
    Zn-RING-Zn-inactive, PDZ-ligand-binding-defective, and dimer-interface-defective
    LNX1 alleles; combine ubiquitin-remnant proteomics with quantitative protein
    stability measurements to identify direct substrates and distinguish degradative
    from regulatory ubiquitination.
  hypothesis: >-
    The Zn-RING-Zn module is required for p80's intrinsic ubiquitination program,
    whereas PDZ interactions specify the substrate set and ubiquitin outcome.
  experiment_type: Isoform-resolved structure-function proteomics
- description: >-
    Reconstitute purified human LNX1p80 with alternative E2 enzymes and defined
    PDZ-recruited substrates, then measure ubiquitin linkage type, mono- versus
    polyubiquitination, and substrate turnover coupling.
  hypothesis: >-
    E2 selection and substrate context jointly determine whether LNX1p80 produces
    degradative chains or non-degradative ubiquitin signals.
  experiment_type: Biochemical ubiquitination reconstitution
- description: >-
    Map the endogenous LNX1p70 interactome in human neuronal cells by proximity
    labeling and affinity purification, prioritize candidate E3 ligases, and test
    each by depletion and rescue with catalytic and p70-interaction mutants.
  hypothesis: >-
    LNX1p70 promotes ligand ubiquitination by recruiting one or more specific E3
    ligases rather than through residual intrinsic catalytic activity.
  experiment_type: Endogenous interactome mapping and genetic epistasis
- description: >-
    Endogenously tag each LNX1 isoform and quantify its expression, subcellular
    localization, and partner occupancy across epithelial and neuronal human cells
    under basal and signaling-stimulated conditions.
  hypothesis: >-
    p80 and p70 occupy distinct cellular niches that partition intrinsic E3-ligase
    and scaffold functions.
  experiment_type: Isoform-specific imaging and quantitative proteomics
