id: Q8TBB1
gene_symbol: LNX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LNX1 is a multidomain ubiquitin-system protein whose long p80 isoform combines
  an N-terminal Zn-RING-Zn E3 ligase module with four C-terminal PDZ domains that
  recruit selected substrates. It catalyzes both degradative ubiquitination, as
  shown for SRC and other context-dependent targets, and regulatory
  non-degradative ubiquitination, as shown for RHOC. The shorter p70 isoform
  replaces residues 1-127 and therefore lacks the RING catalytic module while
  retaining the PDZ-rich interaction region; it functions primarily as a
  multivalent scaffold and can promote ubiquitination indirectly by recruiting
  other E3 ligases. LNX1 is found broadly in the cytoplasm and at cell junctions,
  while reported synaptic roles and locations are supported mainly by
  model-organism evidence.
