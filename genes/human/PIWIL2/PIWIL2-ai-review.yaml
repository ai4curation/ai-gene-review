id: Q8TC59
gene_symbol: PIWIL2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PIWIL2 (HILI) is a germline PIWI-clade Argonaute protein expressed in fetal and adult male
  germ cells and in many tumors. It binds primary piRNAs via its PAZ (2-O-methyl 3-end recognition) and
  MID/PIWI domains and acts as the slicer-competent cytoplasmic PIWI protein in nuage granules (pi-bodies/intermitochondrial
  cement, chromatoid bodies). Guided by piRNAs, its RNase H-like PIWI domain cleaves complementary transposon
  transcripts; the cleavage products feed the ping-pong amplification loop and, with the PET complex (EXD1-TDRD12),
  generate secondary piRNAs loaded onto nuclear PIWIL4, which directs de novo DNA methylation of transposons.
  Loss of the mouse ortholog Mili causes transposon derepression and male sterility. Additional reported
  roles include translation regulation in germline stem cells and modulation of clock-protein stability.
