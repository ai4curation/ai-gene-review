suggested_questions:
- question: Is human PIWIL2 slicer activity required for PIWIL4 loading and transposon DNA methylation
    in human fetal germ cells, as in mouse?
- question: Are the circadian (BMAL1/CLOCK) and somatic tumor roles of PIWIL2 piRNA-dependent?
suggested_experiments:
- experiment_type: Catalytic-dead complementation in human germ cell models
  hypothesis: PIWIL2 slicing (DDH triad) is required for secondary piRNA production in human germ cells.
  description: Express PIWIL2 D-to-A catalytic mutants in human iPSC-derived primordial germ cell-like
    cells and sequence PIWIL4-bound piRNAs.
