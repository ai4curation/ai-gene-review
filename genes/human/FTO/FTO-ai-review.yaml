- term:
    id: GO:0016180
    label: snRNA processing
  evidence_type: IDA
  original_reference_id: PMID:30197295
  qualifier: involved_in
  review:
    summary: Captures the snRNA role but names the wrong process - the experiment shows covalent
      demodification of snRNA, not maturation of a primary snRNA transcript.
    action: MODIFY
    reason: 'GO:0016180 is defined as conversion of a primary snRNA transcript into a mature snRNA
      molecule. What was actually shown is demethylation of m6A in U6 snRNA and of internal and cap
      m6Am in snRNAs - covalent alteration of an already-transcribed snRNA. GO:0040031 snRNA
      modification is a child of GO:0016180 and is the accurate term; GO:0035513 oxidative RNA
      demethylation records the chemistry. This is the substrate class for which the evidence is
      strongest and least disputed, so getting the term right matters here.'
    proposed_replacement_terms:
