    label: mRNA N6-methyladenosine dioxygenase activity
  evidence_type: IMP
  original_reference_id: PMID:26458103
  qualifier: enables
  review:
    summary: FTO perturbation changes 5'UTR m6A on heat-shock transcripts, inferred as FTO acting
      as the m6A eraser on those mRNAs.
    action: KEEP_AS_NON_CORE
    reason: 'This is the mutant-phenotype leg of the contested claim, and it is the reason the term
      cannot simply be demoted without argument - GO:1990931 on this gene carries IBA, IDA, IEA and
      IMP. The experiment is genuine and the curator read the full text, so it is retained. The
      caveat is methodological rather than about this paper: the m6A changes here, as throughout
      the FTO mRNA literature, are read out by antibody-based mapping, the specificity of which for
      FTO-dependent changes is what the direct-sequencing reassessment challenges. Non-core, with
      the dispute recorded rather than resolved.'
    supported_by:
    - reference_id: PMID:26458103
      supporting_text: Upon heat shock stress, the nuclear YTHDF2 preserves 5'UTR methylation of
        stress-induced transcripts by limiting the m(6)A 'eraser' FTO from demethylation.
