  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human genetic proof that FTO catalytic activity is essential - homozygous R316Q
      causes a lethal recessive polymalformation syndrome. PubMed-verified (Am J Hum Genet 2009).
      Not currently used as a GOA source for this gene but decisive for the in vivo importance of
      the enzyme.
- id: PMID:20376003
  title: Crystal structure of the FTO protein reveals basis for its substrate specificity.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structural basis for single-strand selectivity. Cached record is abstract-only;
      the abstract does not state ferrous iron binding explicitly, so the GO:0008198 IDA is taken
      on the curator's reading of the full structure.
- id: PMID:22002720
  title: N6-methyladenosine in nuclear RNA is a major substrate of the obesity-associated
    FTO.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The in vitro m6A demethylation is not in question and the paper is correctly
      cited. Its central inference - that nuclear mRNA m6A is the major physiological substrate -
      is what the direct-sequencing reassessment (PMID:41279954) and the m6Am literature contest.
- id: PMID:25452335
  title: Meclofenamic acid selectively inhibits FTO demethylation of m6A over ALKBH5.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Sound inhibitor biochemistry and structure. Supports in vitro m6A turnover; the
      cellular m6A readout is antibody-based and so inherits the substrate dispute.
- id: PMID:26287746
  title: FTO Obesity Variant Circuitry and Adipocyte Browning in Humans.
  findings: []
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: Excellent paper, wrong gene for these annotations. It dissects the FTO locus and
      concludes the causal mechanism runs through IRX3 and IRX5; FTO protein is never perturbed.
      Used in GOA as the IMP source for two FTO biological-process annotations, which conflates
      locus with gene product. The annotations would be better re-homed to IRX3 and IRX5.
