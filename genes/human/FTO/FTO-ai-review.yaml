- term:
    id: GO:0035515
    label: oxidative RNA demethylase activity
  evidence_type: IDA
  original_reference_id: PMID:22002720
  qualifier: enables
  review:
    summary: The founding demonstration that FTO oxidatively demethylates m6A in RNA, in vitro and
      with a matching direction of effect in cells.
    action: ACCEPT
    reason: 'Core molecular function. Two caveats are worth recording without changing the action.
      First, chemistry: a 2025 study reports that isolated FTO predominantly forms the hemiaminal
      N6-hydroxymethyladenosine and that the demethylated product arises by slow non-enzymatic
      fragmentation, unlike ALKBH5 and AlkB - so "demethylase" may describe the net outcome rather
      than the catalysed step. Second, substrate: the cellular m6A changes reported here were
      measured on bulk mRNA. Neither caveat disturbs the substrate-generic claim that FTO
      oxidatively demethylates RNA, which is independently supported by the snRNA and tRNA work.'
    supported_by:
    - reference_id: PMID:22002720
      supporting_text: We report here that fat mass and obesity-associated protein (FTO) has
        efficient oxidative demethylation activity targeting the abundant N6-methyladenosine
        (m(6)A) residues in RNA in vitro.
    - reference_id: PMID:40874592
      supporting_text: The results imply that, at least in isolated form, FTO preferentially acts as
        a hydroxylase, producing a hemiaminal product, rather than a demethylase, distinguishing it
        from ALKBH5.
