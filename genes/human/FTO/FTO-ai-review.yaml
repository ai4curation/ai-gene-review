core_functions:
- molecular_function:
    id: GO:0035515
    label: oxidative RNA demethylase activity
  description: Fe(II)- and 2-oxoglutarate-dependent oxidative removal of methyl groups from
    adenosine residues in single-stranded RNA. The best-established cellular substrates are
    N6,2'-O-dimethyladenosine (m6Am) at the transcription-start nucleotide of snRNAs and of capped
    mRNAs, and N6-methyladenosine in U6 snRNA; FTO also oxidizes internal m6A in mRNA in vitro,
    though whether mRNA m6A is a physiological substrate is disputed. An active-site loop restricts
    FTO to single-stranded substrates. Recent chemistry indicates the isolated enzyme stops at the
    hemiaminal N6-hydroxymethyladenosine, with release of formaldehyde occurring by slow
    non-enzymatic fragmentation, so the demethylated product may form off-enzyme.
  directly_involved_in:
  - id: GO:0035513
    label: oxidative RNA demethylation
  - id: GO:0040031
    label: snRNA modification
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0016607
    label: nuclear speck
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:30197295
    supporting_text: We find that FTO binds multiple RNA species, including mRNA, snRNA, and tRNA,
      and can demethylate internal m6A and cap m6Am in mRNA, internal m6A in U6 RNA, internal and
      cap m6Am in snRNAs, and N1-methyladenosine (m1A) in tRNA.
  - reference_id: PMID:28002401
    supporting_text: Moreover, we find that m6Am is selectively demethylated by fat mass and
      obesity-associated protein (FTO). FTO preferentially demethylates m6Am rather than
      N6-methyladenosine (m6A), and reduces the stability of m6Am mRNAs.
  - reference_id: PMID:41279954
    supporting_text: We found that FTO primarily demethylates m6Am in snRNAs, with much more subtle
      activity towards m6Am in mRNA
  - reference_id: PMID:40874592
    supporting_text: The nascent hemiaminal product undergoes relatively slow non-enzyme catalysed
      fragmentation giving adenosine/formaldehyde.
- molecular_function:
    id: GO:1990984
    label: tRNA demethylase activity
  description: Removal of N1-methyladenosine from tRNA. FTO acts on both nuclear and cytoplasmic
    tRNA pools; loss of FTO raises tRNA m1A in human knockdown cells and in Fto-knockout mouse
    cells, and the effect size is substantially larger than the changes seen for m6A or cap m6Am in
    polyadenylated RNA. Demethylation of tRNA m1A by FTO directly represses translation, making
    this the FTO activity with the clearest cellular consequence.
  directly_involved_in:
  - id: GO:0035513
    label: oxidative RNA demethylation
  - id: GO:0006400
    label: tRNA modification
  - id: GO:0017148
    label: negative regulation of translation
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:30197295
    supporting_text: We also show that FTO can directly repress translation by catalyzing m1A tRNA
      demethylation.
  - reference_id: PMID:30197295
    supporting_text: Interestingly, the m1A level in tRNA is dramatically affected by FTO-mediated
      demethylation in comparison to m6A and cap m6Am in polyadenylated RNAs in Fto knockout mouse
      cells and tissues.
- molecular_function:
    id: GO:0016706
    label: 2-oxoglutarate-dependent dioxygenase activity
  description: The catalytic identity of FTO, and the one molecular-function statement untouched by
    either current dispute. FTO couples oxidation of a methyl group on a single-stranded nucleic
    acid to decarboxylation of 2-oxoglutarate at a mononuclear Fe(II) centre, releasing succinate
    and CO2. This holds whether the enzymatic product is the demethylated base or the hemiaminal,
    and whatever the physiological substrate turns out to be. Homozygous loss of this activity in
    humans (R316Q) causes a lethal polymalformation syndrome.
  directly_involved_in:
  - id: GO:0035513
    label: oxidative RNA demethylation
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:17991826
    supporting_text: We find that recombinant murine Fto catalyzes the Fe(II)- and 2OG-dependent
      demethylation of 3-methylthymine in single-stranded DNA, with concomitant production of
      succinate, formaldehyde, and carbon dioxide.
  - reference_id: PMID:19559399
    supporting_text: Here we show that a R316Q mutation, inactivating FTO enzymatic activity, is
      responsible for an autosomal-recessive lethal syndrome.
proposed_new_terms:
- proposed_name: RNA N6-methyladenosine hydroxylase activity
  proposed_definition: Catalysis of the hydroxylation of the N6-methyl group of N6-methyladenosine
    within an RNA molecule, using Fe(II), 2-oxoglutarate and O2, to give
    N6-hydroxymethyladenosine, with concomitant formation of succinate and CO2. The hemiaminal
    product may subsequently fragment non-enzymatically to adenosine and formaldehyde.
  justification: 'GO currently offers no term for a nucleic-acid m6A hydroxylase whose enzymatic
    product is the hemiaminal rather than the demethylated base. Both terms available for FTO
    assert methyl removal by the enzyme: GO:0035515 oxidative RNA demethylase activity is defined
    as "Catalysis of the removal of a methyl group", and GO:1990931 mRNA N6-methyladenosine
    dioxygenase activity as releasing "oxidized methyl group on N6-methyladenosine as
    formaldehyde". A 2025 comparative study of FTO, ALKBH5, ALKBH2/3 and bacterial AlkB finds that
    isolated FTO differs from all of the others in stopping at N6-hydroxymethyladenosine. If that
    behaviour is confirmed in cells, FTO would need a term distinguishing it from bona fide
    demethylases, and the hemiaminal would become a curatable RNA modification in its own right.
    Proposed now so the distinction is recorded, not asserted for FTO here.'
  proposed_parent:
    id: GO:0016706
    label: 2-oxoglutarate-dependent dioxygenase activity
  supported_by:
  - reference_id: PMID:40874592
    supporting_text: The results imply that, at least in isolated form, FTO preferentially acts as a
      hydroxylase, producing a hemiaminal product, rather than a demethylase, distinguishing it
      from ALKBH5.
  - reference_id: PMID:40874592
    supporting_text: While ALKBH5 has consistently been reported to catalyse m6A demethylation,
      there are conflicting reports concerning the FTO products.
- proposed_name: snRNA N6,2'-O-dimethyladenosine demethylase activity
  proposed_definition: Catalysis of the oxidative removal of the N6-methyl group from
    N6,2'-O-dimethyladenosine (m6Am) at the transcription-start nucleotide of a small nuclear RNA,
    yielding 2'-O-methyladenosine, with 2-oxoglutarate and O2 as co-substrates.
  justification: 'GO has terms for m6A dioxygenase activity on mRNA (GO:1990931) and for tRNA
    demethylase activity (GO:1990984), but no term for the m6Am cap-adjacent substrate, in either
    snRNA or mRNA - a QuickGO search for m6Am returns nothing. This is a curation gap precisely
    where the FTO evidence is strongest and least disputed: snRNA m6Am is the substrate whose
    stoichiometry rises reproducibly and by large margins on FTO depletion, in the same experiments
    that find no change in mRNA m6A. Without such a term, the best-supported activity of FTO can
    only be annotated with the substrate-generic GO:0035515, while the contested mRNA activity has
    a precise term of its own - an asymmetry that misrepresents the evidence.'
  proposed_parent:
    id: GO:0035515
    label: oxidative RNA demethylase activity
  supported_by:
  - reference_id: PMID:41279954
    supporting_text: All measured snRNA-associated m6Am sites exhibited large increases in
      stoichiometry upon FTO depletion
  - reference_id: PMID:30197295
    supporting_text: We further identified additional RNA substrates of FTO, including m1A in tRNA,
      m6A in U6 RNA, internal and cap m6Am in snRNAs.
suggested_questions:
- question: Is N6-hydroxymethyladenosine (hm6A) or its 2'-O-methyl counterpart detectable in
    cellular RNA, and if so is it the true physiological product of FTO rather than a transient
    intermediate? If the hemiaminal is the enzymatic product and demethylation completes
    non-enzymatically, should FTO be classified as a hydroxylase rather than a demethylase in GO?
  experts:
  - Christopher J Schofield
  - Wei Shen Aik
- question: Does any quantitative, antibody-independent method - direct RNA sequencing, or
    chemistry-based single-nucleotide mapping - detect FTO-dependent changes in internal mRNA m6A
    stoichiometry in any cell type or physiological condition? A positive result in some context
    would reconcile the two literatures; a consistent negative across contexts would mean the mRNA
    m6A eraser model should be retired.
  experts:
  - Samie R Jaffrey
  - Chuan He
- question: If FTO inhibitors such as FB23-2 remain cytotoxic in FTO-deficient AML cells, what
    target actually mediates their anti-leukemic effect, and do FTO degraders - which do not rely
    on active-site occupancy - act through mRNA m6A, through snRNA m6Am and splicing, or through
    tRNA m1A and translation?
  experts:
  - Jianjun Chen
  - Chuan He
- question: Does FTO-dependent snRNA m6Am affect pre-mRNA splicing, and is this the route by which
    FTO loss changes mRNA abundance without changing mRNA m6A stoichiometry?
  experts:
  - Samie R Jaffrey
- question: Which FTO activity accounts for the lethal human R316Q polymalformation syndrome and
    for the growth phenotypes of Fto-null mice - tRNA m1A demethylation and translational control,
    snRNA m6Am and splicing, or mRNA m6A?
  experts: []
suggested_experiments:
- hypothesis: FTO's enzymatic product on cellular RNA is the hemiaminal N6-hydroxymethyladenosine,
    and reported demethylation reflects non-enzymatic decay during sample handling.
  description: Quantify hm6A and hm6Am in RNA isolated from wild-type and FTO-knockout cells using
    workflows explicitly designed to preserve labile hemiaminal adducts (rapid quench, low
    temperature, avoidance of the acidic or aqueous steps shown to destroy these adducts), with
    isotopically labelled hm6A standards. Compare against the same samples processed by
    conventional LC-MS/MS workflows to measure how much signal the standard protocol destroys.
  experiment_type: quantitative LC-MS/MS of modified nucleosides
- hypothesis: Internal mRNA m6A is not a physiological FTO substrate; the reported FTO-dependent
    m6A changes are artefacts of antibody-based enrichment.
  description: Run matched quantitative m6A measurements on the same RNA samples from FTO-knockout,
    knockdown, inhibitor-treated and control cells by three orthogonal methods - direct RNA
    nanopore sequencing, an antibody-free chemical mapping method such as GLORI, and MeRIP-seq -
    across several cell types including primary cells and a tissue with high FTO expression.
    Include snRNA m6Am by CROWN-seq in every sample as the positive control for loss of FTO
    activity. Pre-register the analysis so that discordance between methods is interpretable.
  experiment_type: comparative transcriptome-wide RNA modification mapping
- hypothesis: The anti-leukemic activity of FTO inhibitors is largely FTO-independent.
  description: Test each published FTO inhibitor and degrader for cytotoxicity in isogenic
    FTO-knockout versus wild-type AML lines, and rescue with catalytically dead FTO (R316Q) versus
    wild-type FTO. Couple this to thermal proteome profiling or chemoproteomics in the knockout
    background to identify the off-target protein responsible for any FTO-independent killing.
  experiment_type: isogenic chemical-genetic target deconvolution
- hypothesis: The dominant cellular consequence of FTO loss is altered translation via tRNA m1A,
    not altered mRNA stability via m6A.
  description: In FTO-knockout and control cells, measure tRNA m1A stoichiometry per isoacceptor by
    misincorporation-based tRNA sequencing alongside ribosome profiling and matched RNA-seq.
    Determine whether translational-efficiency changes track the isoacceptors whose m1A changes,
    and whether they are rescued by wild-type but not R316Q FTO.
  experiment_type: ribosome profiling with tRNA modification sequencing
- hypothesis: FTO regulates splicing through snRNA m6Am rather than through mRNA m6A.
  description: Combine CROWN-seq quantification of snRNA m6Am with deep long-read transcriptome
    sequencing in FTO-knockout versus wild-type cells, and test whether U1 snRNA carrying a
    non-methylatable transcription-start nucleotide phenocopies FTO loss for the affected splicing
    events.
  experiment_type: snRNA modification mapping with long-read splicing analysis
