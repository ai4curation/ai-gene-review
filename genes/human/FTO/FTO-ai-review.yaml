- id: PMID:40162895
  title: Decoding m(6)Am by simultaneous transcription-start mapping and methylation
    quantification.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Describes CROWN-seq, the quantitative m6Am method used as the FTO-activity
