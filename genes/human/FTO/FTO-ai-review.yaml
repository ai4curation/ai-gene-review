- term:
    id: GO:1990931
    label: mRNA N6-methyladenosine dioxygenase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Phylogenetic assertion that the FTO clade acts on mRNA m6A.
    action: KEEP_AS_NON_CORE
    reason: 'This is the contested substrate claim, and it is contested at the cellular rather than
      the biochemical level: isolated FTO clearly oxidizes m6A in single-stranded RNA, so the node
      placement is not unreasonable. What is disputed is whether internal mRNA m6A is a
      physiological substrate. Quantitative direct-RNA nanopore sequencing reports no change in
      mRNA m6A stoichiometry on FTO knockout, knockdown or inhibition, in AML and non-AML cells,
      while the same cells show the expected large rise in snRNA m6Am - an internal positive
      control that FTO activity really was lost. That evidence is currently a bioRxiv preprint
      (PMID:41279954), so it is treated here as sufficient to demote the claim from core, not to
      remove it. GOA already hedges the substrate question by carrying both this term and
      GO:1990984 tRNA demethylase activity; this review makes that hedge explicit.'
    supported_by:
    - reference_id: PMID:41279954
      supporting_text: We find that the stoichiometry of m6A sites throughout the transcriptome and
        especially at MYC-specific sites are unaffected despite depletion of FTO activity by
        knockout, knockdown, or pharmacologic inhibition.
