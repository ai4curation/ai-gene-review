- id: PMID:40815637
  title: FTO degrader impairs ribosome biogenesis and protein translation in acute
    myeloid leukemia.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Peer-reviewed 2025 support for the m6A-eraser model in AML, and the stronger of
      the two pro-m6A 2025 papers because degradation does not depend on active-site occupancy, so
      it is not vulnerable to the inhibitor-specificity objection. Its m6A quantification is still
      antibody-dependent.
- id: PMID:40874592
  title: Evidence human FTO catalyses hydroxylation of N6-methyladenosine without direct
    formation of a demethylated product contrasting with ALKBH5/2/3 and bacterial AlkB.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Peer-reviewed comparative MS and real-time NMR study (Nucleic Acids Res 2025).
      Grounds the chemistry layer of the dispute - isolated FTO forms the hemiaminal hm6A rather
      than releasing formaldehyde itself. Its own caveat "at least in isolated form" is why the GO
      demethylase terms were not downgraded on this basis.
- id: PMID:41190354
  title: Structure-Based Design of a Highly Potent Dual-Competitive FTO Inhibitor for
    Targeted m(6)A Demethylase Inhibition in AML.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: Representative of the active drug-discovery literature that assumes the
      m6A-eraser model. Cited here to show that side of the dispute is current, not superseded.
      Its cellular m6A readouts are antibody-based, and the claim that FTO inhibitors act through
      FTO is exactly what PMID:41279954 challenges. Cached record is abstract-only.
- id: PMID:41279954
  title: 'FTO depletion does not alter m(6)A stoichiometry in AML mRNA: a reassessment
    using direct RNA nanopore sequencing.'
  findings: []
  publication_type: PREPRINT
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: 'PREPRINT (bioRxiv, Oct 2025) - not peer reviewed, and marked UNVERIFIED for that
      reason rather than for any identified defect. Weighed as substantial but not decisive: it is
      methodologically orthogonal to MeRIP rather than a failed replication, it carries an internal
      positive control (snRNA m6Am rises as expected, confirming FTO activity was abolished), and
      it converges with peer-reviewed prior work (PMID:28002401, PMID:30197295) and with an
      independent chemistry result (PMID:40874592). Used here to demote GO:1990931 from core, never
      to remove an annotation.'
