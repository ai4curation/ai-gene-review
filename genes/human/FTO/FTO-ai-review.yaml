- term:
    id: GO:0010883
    label: regulation of lipid storage
  evidence_type: IMP
  original_reference_id: PMID:26287746
  qualifier: involved_in
  review:
    summary: Lipid-storage phenotype attributed to FTO on the basis of a study of the FTO locus,
      whose own conclusion assigns the mechanism to IRX3 and IRX5.
    action: KEEP_AS_NON_CORE
    reason: 'The source paper perturbs an enhancer inside FTO intron 1, not FTO protein: the causal
      variant rs1421085 disrupts an ARID5B motif and derepresses a preadipocyte enhancer acting at
      1.2 Mb on IRX3 and IRX5, and the authors name those genes, not FTO, in their conclusion.
      Attributing the lipid-storage phenotype to the FTO gene product therefore conflates the locus
      with the protein - a confusion UniProt flags explicitly in its own OBESITY comment. The term
      is nonetheless retained as non-core because independent mouse Fto protein data support an
      adiposity role, which is what the IBA and orthology IEA rows for this term rest on. Per
      project policy an experimental annotation is not removed here; the cleanest curation fix
      would be to re-home this particular reference to IRX3 and IRX5.'
    supported_by:
    - reference_id: PMID:26287746
      supporting_text: The rs1421085 T-to-C single-nucleotide variant disrupts a conserved motif for
        the ARID5B repressor, which leads to derepression of a potent preadipocyte enhancer and a
        doubling of IRX3 and IRX5 expression during early adipocyte differentiation.
- term:
    id: GO:0090335
    label: regulation of brown fat cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:26287746
  qualifier: involved_in
  review:
    summary: Brown/beige adipocyte differentiation phenotype attributed to FTO, but demonstrated by
      the authors to be mediated by IRX3 and IRX5.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Unlike regulation of lipid storage, this term rests on this single reference, and this
      reference is a locus study whose experiments - haplotype-specific enhancer assays, CRISPR
      repair of rs1421085, IRX3/IRX5 knockdown and overexpression - never manipulate FTO protein.
      The beige-to-white shift is explicitly attributed to IRX3/IRX5 derepression. Marked as
      over-annotated rather than removed, in line with project policy on experimental annotations
      and because mouse Fto does have reported effects on adipocyte differentiation; but as it
      stands this annotation transfers a neighbouring genes phenotype onto FTO.'
    supported_by:
    - reference_id: PMID:26287746
      supporting_text: Our results point to a pathway for adipocyte thermogenesis regulation
        involving ARID5B, rs1421085, IRX3, and IRX5, which, when manipulated, had pronounced
        pro-obesity and anti-obesity effects.
    - reference_id: PMID:26287746
      supporting_text: This results in a cell-autonomous developmental shift from energy-dissipating
        beige (brite) adipocytes to energy-storing white adipocytes, with a reduction in
        mitochondrial thermogenesis by a factor of 5, as well as an increase in lipid storage.
