  qualifier: involved_in
  review:
    summary: Inherited AlkB-family alkylation-repair role, propagated from the FTO/Fto node.
    action: KEEP_AS_NON_CORE
    reason: FTO does demethylate 3-methylthymine in ssDNA in vitro, which is the ancestral AlkB
      activity and a reasonable node-level inference. But FTO is excluded from double-stranded DNA
