    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Correctly cited and a genuine mutant-phenotype experiment, but the m6A readout is
      antibody-based, which is the methodology under challenge. It is the IMP leg of the contested
      GO:1990931 annotation.
