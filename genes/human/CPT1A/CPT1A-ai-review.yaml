- term:
    id: GO:0032000
    label: positive regulation of fatty acid beta-oxidation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    action: UNDECIDED
    summary: The measured increase in fatty-acid oxidation does not yet resolve a distinct regulatory
      annotation.
    reason: The exact rat donor is grounded in PMID:19302064, whose abstract reports increased oleate
      beta-oxidation after expression of wild-type or malonyl-insensitive CPT1A in hepatocytes exposed
      to high glucose and insulin. This is positive control of pathway flux by changing CPT1A catalytic
      capacity and its susceptibility to inhibition. It does not by itself distinguish participation in
      the pathway from a regulatory mechanism represented by GO:0032000. The earlier rationale that any
      rate-controlling catalytic step establishes this regulation was too broad. Full original Methods
      were not recovered, so the source-specific regulatory interpretation remains unresolved rather than
