id: P50416
gene_symbol: CPT1A
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CPT1A is a malonyl-CoA-sensitive carnitine acyltransferase of the mitochondrial outer membrane.
  It converts long-chain acyl-CoA and L-carnitine into acylcarnitine and CoA, supplying the carnitine
  shuttle and mitochondrial fatty-acid oxidation. This catalytic entry step links lipid utilization to
  nutritional state; inherited loss of function causes CPT1A deficiency with impaired fasting adaptation
  and hypoketotic hypoglycemia. CPT1A also has experimentally demonstrated peptide-lysine succinyltransferase
  activity, including ENO1 modification, and a reported adaptor role recruiting ZDHHC4 to MAVS to sustain
  innate immune signaling. Its two human protein products differ at their C termini; equivalent full-length
  activity of both products has not been established.
