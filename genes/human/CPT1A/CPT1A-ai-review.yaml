core_functions:
- description: Transfers long-chain acyl groups from acyl-CoA to carnitine at the mitochondrial outer
    membrane, supplying the acylcarnitine-forming step of the malonyl-CoA-regulated carnitine shuttle.
    The translocase and CPT2 carry out distinct subsequent steps.
  molecular_function:
    id: GO:0004095
    label: carnitine O-palmitoyltransferase activity
  directly_involved_in:
  - id: GO:0006853
    label: carnitine shuttle
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:14517221
  - reference_id: PMID:7892212
- description: Catalyzes succinyl-CoA-dependent peptide-lysine succinylation, directly demonstrated with
    ENO1 and enzyme/substrate controls. The G710E separation from carnitine transfer and endogenous CPT1A
    depletion support this distinct activity; the proteomic substrate list is broader than the individually
    validated direct substrates.
  molecular_function:
    id: GO:0106076
    label: peptide-lysine-N-succinyltransferase activity
  supported_by:
  - reference_id: PMID:29425493
    supporting_text: 'CPT1A WT succinylated enolase 1 and reduced enolase

      enzymatic activity in cells and in vitro.'
- description: Acts as the reported molecular adaptor recruiting ZDHHC4 to MAVS, enabling MAVS palmitoylation
    and stabilization and sustaining the type I interferon response. ZDHHC4 performs the palmitoylation
    chemistry; this recruitment role is distinct from CPT1A acyl-transfer catalysis. This third activity
    is supported in the reported epigenetic-perturbation and antitumor-immunity setting; its generality
    across tissues and conditions is unresolved. The complete abstract and curated GO-CAM support the
    role, while full original Methods were not recovered.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0045089
    label: positive regulation of innate immune response
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:38016475
