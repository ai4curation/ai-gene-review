          and no target-path loss record is present. Descendant evidence is context, not a pairwise-transfer
          substitute.
- index: 3
  review:
    action: ACCEPT
    summary: CPT1A directly metabolizes carnitine by forming acylcarnitine.
    reason: The current GO:0009437 IBD at PTN001097100 lies on the target path with legitimate human and
      rat descendant evidence. Carnitine is a substrate in the directly measured acyl-transfer reaction,
      so this is performed metabolism rather than merely a requirement for transport.
