    relevance: HIGH
    correctness: VERIFIED
    review_notes: Two historical manual similarity transfers name mouse MGI:MGI:1098296; the outer-membrane
      transfer names rat P32198 and has independent target support. Complete current mouse/MGI records
      do not recover the intracellular-glucose-homeostasis term, while current beta-oxidation records
      are electronic. Human GO-CAM 69ea894900000564 preserves the same ISS context, not a separate direct
      mouse experiment. Target pathway evidence and unresolved historical source scope are distinguished.
