        checksum: E5DC9141B6301947
        comment:
        - FUNCTION Catalyzes the transfer of the acyl group of long-chain fatty acid-CoA conjugates onto
          carnitine, an essential step for the mitochondrial uptake of long-chain fatty acids and their
          subsequent beta-oxidation in the mitochondrion (PubMed:11350182, PubMed:14517221, PubMed:16651524,
          PubMed:9691089). Also possesses a lysine succinyltransferase activity that can regulate enzymatic
          activity of substrate proteins such as ENO1 and metabolism independent of its classical carnitine
          O-palmitoyltransferase activity (PubMed:29425493). Plays an important role in hepatic triglyceride
          metabolism (By similarity). Also plays a role in inducible regulatory T-cell (iTreg) differentiation
          once activated by butyryl-CoA that antagonizes malonyl-CoA-mediated CPT1A repression (By similarity).
          Sustains the IFN-I response by recruiting ZDHCC4 to palmitoylate MAVS at the mitochondria leading
          to MAVS stabilization and activation (PubMed:38016475). Promotes ROS-induced oxidative stress
          in liver injury via modulation of NFE2L2 and NLRP3-mediated signaling pathways (By similarity).CATALYTIC
          ACTIVITY (R)-carnitine + hexadecanoyl-CoA = O-hexadecanoyl-(R)-carnitine + CoACATALYTIC ACTIVITY
          succinyl-CoA + L-lysyl-[protein] = N(6)-succinyl-L-lysyl-[protein] + CoA + H(+)ACTIVITY REGULATION
          Inhibited by malonyl-CoA.BIOPHYSICOCHEMICAL PROPERTIES Lipid metabolism; fatty acid beta-oxidation.SUBUNIT
          Homohexamer and homotrimer (By similarity). Identified in a complex that contains at least CPT1A,
          ACSL1 and VDAC1 (By similarity). Also identified in complexes with ACSL1 and VDAC2 and VDAC3
          (By similarity). Interacts with ZDHHC4 (PubMed:38016475).SUBCELLULAR LOCATION Strong expression
          in kidney and heart, and lower in liver and skeletal muscle.INDUCTION Up-regulated by fatty
          acids.DOMAIN A conformation change in the N-terminal region spanning the first 42 residues plays
          an important role in the regulation of enzyme activity by malonyl-CoA.DISEASE The disease is
          caused by variants affecting the gene represented in this entry.SIMILARITY Belongs to the carnitine/choline
          acetyltransferase family.
