annotation_assessments:
- index: 0
  review:
    action: ACCEPT
    summary: The ancestral carnitine acyl-transfer activity is retained in human CPT1A.
    reason: The actual PTHR22589 tree places human P50416 below PTN001097100, whose current IBD explicitly
      assigns GO:0004095; no loss record lies on the target path. The target MSA reconstructs the official
      773-residue sequence. Human enzyme expressed in yeast and endogenous human fibroblast assays independently
      establish the reaction. The target's inclusion among descendant experimental sources is legitimate
      phylogenetic evidence.
    supported_by:
    - reference_id: file:human/CPT1A/CPT1A-source-evidence.yaml
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001097100
        source_status: SUPPORTS_TRANSFER
        comment: Actual PTN001097100 IBD is on the human target path; the MSA matches official P50416
          and no target-path loss record is present. Descendant evidence is context, not a pairwise-transfer
          substitute.
- index: 1
  review:
    action: MODIFY
    summary: Refine the valid ancestral mitochondrial location to the outer membrane.
    reason: The current PTN001097100 mitochondrial IBD is on the target path and remains valid. Human
      CPT1A enzymology, mitochondrial membrane preparations and established topology support the more
      specific outer membrane. This is target-level precision, not a claim that the ancestral placement
      was wrong or that CPT1A occurs exclusively in one context.
    proposed_replacement_terms:
    - id: GO:0005741
      label: mitochondrial outer membrane
    supported_by:
    - reference_id: file:human/CPT1A/CPT1A-source-evidence.yaml
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN001097100
        source_status: SUPPORTS_TRANSFER
        comment: Actual PTN001097100 IBD is on the human target path; the MSA matches official P50416
          and no target-path loss record is present. Descendant evidence is context, not a pairwise-transfer
          substitute.
- index: 2
  review:
    action: MODIFY
    summary: Specify the long-chain substrates of the conserved fatty-acid metabolic role.
    reason: The actual ancestral GO:0006631 IBD at PTN001097100 is inherited by CPT1A. Human CPT1A transfers
      long-chain acyl groups to carnitine; palmitoyl-CoA is directly assayed in the canonical literature.
      GO:0001676 captures this substrate scope more precisely without denying the broader inherited pathway
      assertion.
    proposed_replacement_terms:
    - id: GO:0001676
      label: long-chain fatty acid metabolic process
    supported_by:
    - reference_id: file:human/CPT1A/CPT1A-source-evidence.yaml
