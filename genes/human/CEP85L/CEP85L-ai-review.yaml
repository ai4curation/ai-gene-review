core_functions:
- description: CEP85L associates with CDK5 and supports its localization at the proximal
    mother-centriole region. This organizational role connects centrosomal migration-associated
    proteins to the microtubule organization used during cortical neuronal migration.
    Human cultured-cell association and recruitment assays complement mouse cortical
    knockdown/rescue evidence. The observed CDK5 phosphorylation changes support an
    activation model, while the direct molecular route and any purified binary interface
    remain unresolved.
