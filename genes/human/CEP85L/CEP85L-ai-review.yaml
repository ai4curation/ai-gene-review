  review:
    summary: CEP85L associates with CDK5 in a centrosomal recruitment mechanism.
    action: NEW
    reason: PMID:32097629 Figure 4E and the HeLa immunoprecipitation Methods establish
      CEP85L–CDK5 association. Depletion displaces centrosomal CDK5 without reducing
      total CDK5, connecting the association to its biological role. Add the experimentally
      supported serine/threonine-kinase-binding MF because the assayed partner is
      human CDK5 (Q00535), a serine/threonine kinase, and the five source annotations
      contain only location and migration terms. Co-immunoprecipitation does not resolve a purified
      binary interface. The pCDK5 changes support an activation model but do not by
      themselves establish an autonomous kinase-activator mechanism or substrate-turnover
      activity of CEP85L.
    supported_by:
    - reference_id: PMID:32097629
      supporting_text: CEP85L interacts with CDK5 using co-immunoprecipitation
- term:
    id: GO:0071539
    label: protein localization to centrosome
  evidence_type: IMP
  original_reference_id: PMID:32097629
  qualifier: involved_in
  review:
    summary: CEP85L helps maintain CDK5 at the centrosome.
    action: NEW
    reason: Human endogenous CEP85L associates with CDK5 by HeLa co-immunoprecipitation,
      and CEP85L depletion removes centrosomal CDK5 in U2OS cells while total CDK5
      remains unchanged. CEP85L remains centrosomal in CDK5-deficient patient fibroblasts.
      Together, this physical association and directional localization dependency
      support organizational work in maintaining another protein at the centrosome,
      rather than CEP85L merely being cargo or a necessary migration factor. The
      molecular tethering interface and whether retention or delivery is affected
      remain unresolved. Current same-role comparator annotations include CEP192,
      PCM1 and CEP83; negative exact-term results for CEP164 and CEP63 are retained
      in the source record. The term's localization/maintenance meaning and both
      typed hierarchy directions were checked against all existing and proposed
      terms, with no redundancy. The exact-head GO-CAM index has no target entry.
    supported_by:
    - reference_id: PMID:32097629
      supporting_text: CDK5’s localization requires CEP85L
