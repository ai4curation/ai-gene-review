id: Q5SZL2
gene_symbol: CEP85L
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEP85L is a centrosomal protein concentrated around the proximal region
  of the mother centriole. It associates with CDK5 and helps retain this kinase at
  the centrosome, linking centrosomal protein organization to the microtubule cytoskeleton
  used during neuronal migration. CEP85L depletion disrupts cortical neuronal migration
  in mice and alters centrosomal CDK5 localization and phosphorylation in human cultured
  cells. Heterozygous pathogenic CEP85L variants cause posterior-predominant lissencephaly.
  The effects of individual alternative products and the molecular mechanism coupling
  CEP85L to CDK5 activation remain incompletely resolved.
