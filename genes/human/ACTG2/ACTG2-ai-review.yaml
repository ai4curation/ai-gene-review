- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic inference placing ACTG2 in the extracellular region, from PANTHER node
      PTN004322804. The whole chain behind this row was traced and none of it survives.

      The node has a single IBD seed. The cached PAINT table records it as RGD:621676, which
      resolves to rat Acta2 (P62738, Swiss-Prot, 377 aa) - the other smooth muscle actin, not
      ACTG2's orthologue.

      Three things about that seed, stated separately because the first version of this review
      ran them together and a cross-check against the parallel ACTA2 review caught it.

      First, the seed gene is also a recipient. Rat Acta2's own GO:0005576 annotation is
      GO:0005576 IBA GO_REF:0000033 with PANTHER:PTN004322804 and RGD:621676 - the identical
      row human ACTG2 carries, citing this same node and rat Acta2's own identifier. A
      self-referential IBA is a normal PAINT construct and is not by itself a defect, but it
      does mean the seed's exact-term annotation is this node's own output and cannot be
      counted as independent support for the term.

      Second, no annotation anywhere in the chain carries experimental evidence for
      GO:0005576 at the node. Rat Acta2's only non-IBA annotation anywhere under GO:0005576 is
      GO:0005604 basement membrane, IDA, from PMID:30476341 - a fetal-rat-testis retinoic-acid
      and mono-(2-ethylhexyl)-phthalate toxicology study in which alpha-smooth-muscle actin
      marks the peritubular cells bounding the seminiferous cords. The PAINT table records
      which gene seeded an IBD, not which of that gene's annotations justified it, so the
      identification of that IDA as the underlying experimental basis is an inference - a
      well-constrained one, since it is the only candidate, but an inference, and it is labelled
      as one here rather than asserted.

      Third, and separately, that IDA does reach human by a different route which has nothing
      to do with this node: human ACTA2 carries GO:0005604 basement membrane IEA from
      GO_REF:0000107 with UniProtKB:P62738 - Ensembl Compara, a different term, a different
      evidence code and a different reference from the IBA. ACTG2 carries no such row at all.
      The two chains are independent and are not merged here.

      Which node matters. Scanning all 1420 human GO:0005576 IBA annotations shows PTN004322804
      reaches exactly two genes, ACTA2 and ACTG2. It is the only node in PTHR11937 that
      specifically covers the smooth muscle actin pair, and the only term it gives them puts
      them outside the cell - while GO:0005884 actin filament, which is true of both, is
      asserted on single-gene nodes that reach neither (see the NEW GO:0005884 row below).

      The reference-projection check on PMID:30476341 comes back negative and is reported
      because it was run: 13 annotations over 7 distinct entities, with only Acta2 receiving the
      localisation IDA and the other six receiving retinoic-acid-response IEP terms. So this is
      genuine per-protein curation at RGD, not a complex-to-subunit spread, and nothing here
      criticises the rat annotation. The objection is entirely to the propagation: a paralog, in
      a different organism and tissue, with the term broadened en route, and with a qualifier -
      is_active_in - that asserts ACTG2 carries out its molecular function in the extracellular
      region. A cytoplasmic filament protein does not.
    action: REMOVE
    reason: >-
      Single-seed propagation from the paralogous rat Acta2, and no non-IBA evidence for the
      term exists anywhere in the chain: the seed gene's own GO:0005576 row is this node's own
      output, and the only experimental anchor under that term anywhere is a basement-membrane
      immunolocalisation of the paralog in fetal rat testis - a descendant term, in another
      organism, in a tissue ACTG2 does not occupy. The receiving node covers only the two smooth
      muscle actins, so the defect is confined to and characteristic of this pair. No actin
      performs its function in the extracellular region, and ACTG2's only other extracellular
      support is bulk proteomics (rows 17-19), so nothing independent survives to keep the term.
    supported_by:
    - reference_id: file:human/ACTG2/ACTG2-bioinformatics/RESULTS.md
      supporting_text: 'reaches 2 human gene(s): ACTA2, ACTG2'
    - reference_id: file:human/ACTG2/ACTG2-bioinformatics/RESULTS.md
      supporting_text: '- asserted at **PTN004322804** (IBD, taxon `taxon:`, 20260528), seeds: RGD:621676'
    - reference_id: file:human/ACTG2/ACTG2-bioinformatics/RESULTS.md
      supporting_text: '| PMID:30476341 | 13 | 7 | GO:0005604: 1, GO:0032526: 6, GO:0080021: 6 |'
    - reference_id: PMID:30476341
      supporting_text: Humans are universally exposed to low levels of phthalate esters (phthalates),
        which are used to plasticize polyvinyl chloride.
    - reference_id: file:human/ACTG2/ACTG2-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cytoplasm, cytoskeleton.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - CONTEXT_OR_TISSUE_MISMATCH
