- term:
    id: GO:0015629
    label: actin cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phylogenetic inference from PANTHER node PTN002631484, the deep eukaryote-level actin
      node. Verified independently rather than read off a sibling review: QuickGO shows this
      node donates GO:0015629 to eighteen human genes - ACTA1, ACTA2, ACTB, ACTBL2, ACTC1,
      ACTG1, ACTG2, ACTL8, ACTL9, ACTL10, ACTRT1-3 and the five POTE genes - which is the same
      set the merged ACTL10 review reports, confirmed here rather than inherited.

      The donor set is strong. Of the 25 WITH/FROM tokens, 24 are protein identifiers, all 24
      resolve, and all 24 carry their own experimental-code annotation for this term or a
      descendant, across twelve organisms; yeast ACT1 alone carries nine IDAs. Two resolve only
      to unreviewed TrEMBL entries (Candida ACT1 and C. elegans act-5) - the same two the merged
      ACTL10 review reports for this node - and both still carry their own IDA, so the weakness
      is one of name provenance rather than evidence provenance.

      Unlike the divergent actin-like proteins that inherit this term at 33-50 per cent identity
      to beta-actin, ACTG2 is a conventional actin: 98.7 per cent identical to the alpha-actin
      of the F-actin structure used to define the protomer interface, and identical at all 38 of
      its interface positions. It is active in the actin cytoskeleton in the strongest available
      sense - its own filament has been reconstructed at 2.45 A - so is_active_in is exactly
      right here, where on ACTL10 it presupposes an unmeasured activity.

      The term is broad, but the node is deep and its human descendants span 33 to 100 per cent
      identity to beta-actin, so GO:0015629 is the genuine last common ancestor of the donor set
      and no granularity defect exists at the node. The specific structure ACTG2 occupies - the
      smooth muscle contractile apparatus - is captured additively on the MODIFY of row 10 and
      the NEW GO:0005884 row rather than by narrowing this one.
    action: ACCEPT
    reason: >-
      Correct, and core rather than peripheral: ACTG2 is a conventional filament-forming actin
      whose own cryo-EM structures place it in a two-stranded actin polymer. The breadth of the
      term reflects the depth of the node, which is the ontology working correctly, not a
      curator failing to be specific.
