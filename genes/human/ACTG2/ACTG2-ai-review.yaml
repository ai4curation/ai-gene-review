id: P63267
gene_symbol: ACTG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACTG2 encodes smooth muscle gamma-enteric actin (gamma-2 actin), one of the six conventional
  vertebrate actin isoforms and the actin of the contractile apparatus of visceral smooth
  muscle. Like all conventional actins it is a 376-residue ATP-binding protein of the actin
  fold that exists in equilibrium between a monomeric (G-actin) and a filamentous (F-actin)
  state: monomers add to the barbed end of a two-stranded helical polymer, hydrolyse their
  bound ATP shortly after incorporation, and release inorganic phosphate to leave an ADP-bound
  protomer, which is the state resolved in every deposited ACTG2 filament structure. Purified
  human ACTG2 polymerises with a critical concentration slightly higher and a polymerisation
  rate slightly lower than skeletal alpha-actin, is nucleated by the smooth muscle nucleator
  leiomodin-1, is decorated by the smooth muscle tropomyosin isoform Tpm1.4, and is propelled
  by smooth muscle myosin at a velocity indistinguishable from alpha-actin.

  In tissue, ACTG2 is the thin-filament actin of the enteric and urogenital smooth muscle
  contractile apparatus, where actin filaments anchored at dense bodies and dense plaques slide
  against smooth muscle myosin thick filaments to generate contraction. Expression is strongly
  restricted: abundant in the smooth muscle cells of intestinal muscularis mucosa and
  muscularis propria, in intestinal vascular smooth muscle, and in bladder, uterus and seminal
  vesicle. The protein carries the actin-family post-translational modifications, including
  N-terminal processing to a mature acidic N-terminus and SETD3-dependent methylation of
  His-74, which is resolved in its own cryo-EM structures.

  Heterozygous missense variants in ACTG2 are the commonest cause of visceral myopathy and of
  megacystis-microcolon-intestinal hypoperistalsis syndrome, acting dominant-negatively rather
  than by loss of function. Recurrent substitutions at a small set of conserved arginines (R40,
  R63, R148, R178, R211, R257) account for most cases and act by distinct biophysical routes -
  destabilising the monomer, blocking polymerisation, weakening intersubunit contacts within
  the filament, or impairing binding of actin-binding proteins - all converging on reduced
  visceral smooth muscle contractility.
