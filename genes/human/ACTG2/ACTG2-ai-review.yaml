      - source_id: RGD:621676
        source_label: Acta2 (Rattus norvegicus, P62738, Swiss-Prot, 377 aa)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Own evidence in QuickGO for this term or a descendant: IBAx1, IDAx1. The IBA is
          GO:0005576 from this same node, citing PTN004322804 and this gene's own RGD id, so the
          seed gene is also a recipient and its exact-term annotation is the node's own output -
          which is why CIRCULAR_PROPAGATION is listed. The IDA is GO:0005604 basement membrane
          from PMID:30476341, three levels below the term propagated, on a paralog, in rat fetal
