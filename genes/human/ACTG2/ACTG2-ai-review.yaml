        source_label: >-
          PANTHER pan-actin node; none of its eight IRD-negated descendant nodes contains ACTG2
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Not a protein. Recorded because the composition of its donor set - conventional actins
