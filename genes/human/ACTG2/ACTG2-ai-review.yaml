    Track for smooth muscle myosin. The structural role above is discharged against a motor:
    ACTG2 filaments are engaged and translocated by smooth muscle myosin, and it is that
    cyclical, ATP-dependent actomyosin interaction that converts filament integrity into force
    in the intestine, bladder and uterus. Measured directly on purified human protein - in a
    gliding assay on surfaces coated with a smooth muscle myosin motor-domain construct, ACTG2
    filaments move at a velocity indistinguishable from skeletal alpha-actin, with and without
    the smooth muscle tropomyosin Tpm1.4, and the same is true of filaments carrying the R40C
    and R257C disease variants. The myosin-binding surface is independently implicated by
    disease genetics: R148, one of the recurrent visceral-myopathy residues, lies on it. This is
    listed as a separate core function rather than folded into the structural one because it is
    the point at which ACTG2 stops being a scaffold and becomes part of a motor system, and
    because it is the property that the disease variants conspicuously do not break - the
    filaments still glide, so the lesion lies elsewhere.
