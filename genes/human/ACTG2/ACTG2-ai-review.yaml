      ATP + H2O reaction, and hydrolysis presupposes binding - but it rests on inference from
      the catalytic-activity statement rather than on a resolved observation. It is therefore
      proposed as a separate companion row below at the weaker evidence code it earns, ISS,
      rather than folded into this one, so that a curator can see which of the two nucleotide
      terms is observed and which is inferred. ACTA1 likewise carries both.
