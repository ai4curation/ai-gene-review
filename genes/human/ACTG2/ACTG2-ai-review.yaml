- term:
    id: GO:0005884
    label: actin filament
  evidence_type: IDA
  original_reference_id: PMID:38820162
  qualifier: is_active_in
  review:
    summary: >-
      Proposed new annotation, and the central gap in ACTG2's record. ACTG2 has no annotation to
      GO:0005884 or to any descendant of it, while every other conventional human actin has one.
      That is not a judgement anyone made about ACTG2; it is an artefact of node placement.

      In PANTHER family PTHR11937, GO:0005884 is asserted at exactly three nodes, all on
      2019-03-01: PTN000233075, whose sole IBD seed is ACTA1 and which reaches ACTA1 alone;
      PTN000748220, whose sole seed is ACTC1 and which reaches ACTC1 alone; and PTN002631586,
      seeded from ACTG1 and mouse Actg1, which reaches ACTB, ACTBL2, ACTG1, ACTL8 and the five
      POTE genes. Two singleton nodes plus one cytoplasmic-clade node, and no node covering the
      smooth muscle actins - so ACTA2 and ACTG2 both fall through. The only node in the family
      that does specifically cover the smooth muscle pair is PTN004322804, and what it gives
      them is extracellular region (row 1).

      For ACTG2 the gap can be closed with the gene's own data rather than with another
      inference. Ceron et al. expressed human ACTG2 in human cells, purified it, polymerised it,
      and solved three cryo-EM helical reconstructions of ACTG2 filaments at 2.45 to 2.72 A
      (PDB 8V2O wild type, 8V2Z R257C, 8V30 R40C), reporting that the structures are very
      similar to that of alpha-actin with no change in helical twist or rise. Independently, the
      38 protomer-interface positions computed from an F-actin structure are 38/38 identical in
      ACTG2, tying ACTA1 and ACTC1 at the top of a 16-protein panel whose bottom is ACTL10 at
      5/38; that panel is only reported because it first reproduces all 14 columns published in
      the merged ACTL8 review exactly.

      is_active_in rather than located_in, because ACTG2's molecular function - contributing
      structural integrity to a cytoskeletal structure - is discharged in the filament, and
      because that is the qualifier the conventional actins already carrying this term use.
    action: NEW
    reason: >-
      A concrete, structurally demonstrated annotation gap affecting exactly the two smooth
      muscle actins, traceable to which PANTHER node the term was attached to rather than to any
      assessment of the genes. Supported here by ACTG2's own cryo-EM filament structures, not by
      family inference, so it can be entered as IDA.
    supported_by:
    - reference_id: PMID:38820162
      supporting_text: structures of WT ACTG2, R40C, and R257C filaments using helical reconstruction
    - reference_id: PMID:38820162
      supporting_text: The three structures are very similar overall and also similar to that of
    - reference_id: PMID:38820162
      supporting_text: In the WT structure, residue R257 forms an important intrasubunit salt bridge
        with E196, located on a loop that contacts a protomer from the opposite long-pitch helix
    - reference_id: file:human/ACTG2/ACTG2-uniprot.txt
      supporting_text: 'DR   PDB; 8V2O; EM; 2.45 A; A/B/C/D/E=1-376.'
    - reference_id: file:human/ACTG2/ACTG2-bioinformatics/RESULTS.md
      supporting_text: ACTG2 scores **38/38** chemically compatible (38 identical, 0 conservative,
        0 non-conservative, 0 gaps) and ACTA2 **38/38**. Both sit with the conventional actins
    - reference_id: file:human/ACTG2/ACTG2-bioinformatics/RESULTS.md
      supporting_text: all 14 published columns reproduced exactly
