    summary: >-
      Ensembl Compara transfer from rat Actg2 (P63269), the genuine one-to-one orthologue, so
      the orthology step is sound. The problem is what is being transferred. Rat Actg2's own
      annotation is IEP - inferred from expression pattern, its only evidence for this term -
      from PMID:28320086, a study of ethanol-induced liver fibrosis in rats in which the actin
      readout is alpha-smooth muscle actin as a marker of hepatic stellate cell activation. The
      reference annotates three entities in total (Tgfb1, Il6, Actg2), all IEP, all to this same
      term.

      Two independent reasons not to carry it to human ACTG2. First, a change in the abundance
      of a structural protein under a chemical challenge does not make that protein involved in
      the response; IEP records co-behaviour, not participation, and this is the classic
      over-annotation shape for response-to-chemical terms. Second, ACTG2 is an enteric and
      urogenital smooth muscle actin and is not a hepatic stellate cell protein, so the cell
      type in which the observation was made is not one the human gene product occupies.

      A separate concern is recorded in the notes and raised as a question rather than asserted
      here: the paper measures alpha-SMA, which is the ACTA2 gene product, and rat Acta2
      received no annotation from it. Whether that is a symbol conflation at the rat end cannot
      be settled from the abstract, and the action taken here does not depend on it - it is a
      judgement about the propagation, not about the RGD curator's reading.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      An expression-level observation in rat hepatic stellate cells, transferred automatically
      to a human enteric smooth muscle actin. The orthology is right and the term is not
      fabricated, but neither the evidence type nor the cell type supports asserting that human
      ACTG2 is involved in the response to ethanol.
