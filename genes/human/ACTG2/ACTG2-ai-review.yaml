- description: >-
    Nucleotide-hydrolysing engine of its own filament turnover. ACTG2 binds ATP in the cleft of
    the actin fold and hydrolyses it shortly after a monomer is incorporated, releasing
    inorganic phosphate to leave an ADP-bound protomer; every protomer of every deposited ACTG2
    structure is ADP-Mg bound because hydrolysis and phosphate release ran to completion during
    sample preparation. This nucleotide cycle is what makes the filament dynamic rather than
    static, and its measurable consequences - polymerisation rate, depolymerisation rate and
    critical concentration - are the parameters that every characterised disease variant shifts
    and that the G-actin/F-actin ratio assays in the knock-in mouse models read out.
