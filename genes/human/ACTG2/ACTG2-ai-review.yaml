      The claim is true and, for this gene, more than usually meaningful. Actin exists in a
      monomer-polymer equilibrium, the monomeric G-actin pool is cytosolic, and that pool is the
      disease-relevant variable here: every characterised ACTG2 variant is assayed as a shift in
      the G-actin/F-actin ratio or in the critical concentration. It is nevertheless not the
      core location. ACTG2's function is discharged in the filament, in the contractile
      apparatus of visceral smooth muscle; cytosol is where the unpolymerised reserve sits.
