      is to distinguish the protein's function from the consequences of mutating it, since
      almost the entire ACTG2 literature is disease genetics: the claim made is that ACTG2
      participates in smooth muscle contraction, not that it participates in visceral myopathy.

      The evidence is a convergent human genetic series. Heterozygous missense variants at a
      small set of conserved arginines account for about half of a 53-family visceral myopathy
      cohort and are invariably the alleles behind the worst outcomes; the phenotype is loss of
      contractile function in bowel, bladder and uterus. Independently, two CRISPR knock-in
      mouse lines carrying human variants (R257C, D245G) reproduce it - reduced smooth muscle
      cell contraction in collagen gel assays, prolonged gastrointestinal transit, impaired
      voluntary urination - and in both the proximal defect is impaired actin polymerisation.

      The mechanism is dominant-negative rather than loss of function, which is why the
      annotation is stated at process-participation level: heterozygous truncating and
      frameshift ACTG2 alleles occur in healthy people, so a null allele is tolerated and the
      variants act by poisoning the filament. That does not weaken the inference that ACTG2 is
      the thin-filament actin of visceral smooth muscle - it is why poisoning it is so damaging
      - but it is the reason no haploinsufficiency-based claim is made.
    action: NEW
    reason: >-
      The gene's defining biological process, absent from GOA. Supported by a large human
      genotype-phenotype series and by two independent knock-in mouse models, with the
      biophysical route - impaired polymerisation, reduced contractility - measured in both.
      Stated as participation in contraction rather than as a disease term.
    supported_by:
    - reference_id: PMID:31769566
