- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Phylogenetic inference from PANTHER node PTN000940351. This is the term the PAINT curators
      have been actively pruning across this family, so whether ACTG2 is inside or outside the
      retained set was checked against primary data rather than assumed.

      From the cached PAINT table, GO:0005200 is asserted once, at PTN000940351 (IBD, 10 seeds),
      and negated by IRD at exactly eight descendant nodes - PTN000233596, PTN000233752,
      PTN000233796, PTN000233887, PTN000234048, PTN001732543, PTN007551901 and PTN008986528.
      ACTG2 sits under none of them. QuickGO confirms the surviving reach is ten human genes:
      ACTA1, ACTA2, ACTC1, ACTG2, ACTL9, ACTL10, ACTR10, ACTRT1, ACTRT2 and ACTRT3. So the four
      conventional actins in that set are ACTA1, ACTA2, ACTC1 and ACTG2 - ACTB and ACTG1 receive
      the term from a different node, PTN002631586 - and ACTG2 is in the retained set.

      The donor set is heterogeneous by design: yeast ACT1, human ACTB, mouse and rat Actg1 and
      two Dictyostelium actins, but also human Arp2 and Arp3 (branched-filament nucleators) and
      yeast ARP1 and ARP10 (subunits of dynactin's actin-like minifilament). At that depth
      "structural constituent of cytoskeleton" is the genuine last common ancestor of what the
      donors do, so GRANULARITY_MISMATCH does not apply and no more specific term could be
      chosen without arbitrarily privileging one donor lineage. All ten protein donors resolve
      and all ten carry their own experimental-code annotation for the term.

      Three merged sibling reviews resolved this identical row three different ways - ACTR10
      ACCEPT, ACTL10 MARK_AS_OVER_ANNOTATED, ACTRT3 MODIFY to GO:0005198 - and it is worth
      stating why that is not the AADACL-style inconsistency it resembles. There, three genes
      with identical donor sets and comparable evidence got three answers, at most one of which
      could be right. Here the recipients differ in precisely the property the term asserts. On
      the 38-position filament protomer interface, recomputed in this review's bioinformatics
      folder, ACTR10 scores 20 identical plus 8 conservative, ACTRT1 13 plus 8, ACTL10 3 plus 2,
      and ACTG2 38 plus 0. A term about contributing to the structural integrity of a
      cytoskeletal structure is a measured fact at 38/38 and an open question at 5/38. ACTG2
      therefore accepts it on its own evidence without disturbing the divergent-gene calls.
    action: ACCEPT
    reason: >-
      Verified to be in the retained rather than the IRD-negated set, from the PAINT table
      directly. The term is the true LCA of a heterogeneous donor set that mixes conventional
      actins with Arp2/3 and dynactin ARPs, so its breadth is correct rather than lazy, and for
      ACTG2 specifically it is backed by the gene's own cryo-EM filament structures and by
      complete conservation of the protomer interface. Core molecular function.
    supported_by:
    - reference_id: file:human/ACTG2/ACTG2-bioinformatics/RESULTS.md
      supporting_text: 'reaches 10 human gene(s): ACTA1, ACTA2, ACTC1, ACTG2, ACTL10, ACTL9, ACTR10,
        ACTRT1, ACTRT2, ACTRT3'
    - reference_id: file:human/ACTG2/ACTG2-bioinformatics/RESULTS.md
      supporting_text: ACTG2 scores **38/38** chemically compatible (38 identical, 0 conservative,
        0 non-conservative, 0 gaps) and ACTA2 **38/38**. Both sit with the conventional actins
    - reference_id: file:human/ACTG2/ACTG2-bioinformatics/RESULTS.md
      supporting_text: all 14 published columns reproduced exactly
    - reference_id: PMID:38820162
      supporting_text: structures of WT ACTG2, R40C, and R257C filaments using helical reconstruction
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
