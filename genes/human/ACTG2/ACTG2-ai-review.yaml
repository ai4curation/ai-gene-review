proposed_new_terms:
- proposed_name: smooth muscle thin filament
  proposed_definition: >-
    An actin filament of the smooth muscle contractile apparatus, composed of actin and
    associated proteins including tropomyosin and caldesmon, anchored at dense bodies and
    membrane-associated dense plaques, and interdigitating with smooth muscle myosin thick
    filaments during contraction. Unlike the striated counterpart it lacks troponin and is not
    organised into sarcomeres.
  justification: >-
    GO models the smooth muscle contractile apparatus at fibre level (GO:0030485 smooth muscle
    contractile fiber) and at anchor level (GO:0030486 smooth muscle dense body) but has no term
    at filament level, while the striated equivalent exists (GO:0005865 striated muscle thin
    filament). The filament is exactly the level at which the smooth muscle actins ACTG2 and
    ACTA2, the smooth muscle tropomyosins and caldesmon act, and the only compartment terms
    currently available to them are either too general (GO:0015629 actin cytoskeleton) or
    categorically wrong, as GO:0032982 myosin filament is on the ISS row reviewed here.
    Placement was checked rather than guessed: GO:0036379 myofilament is not available as a
    parent because its definition restricts it to the smallest contractile units of a myofibril
    (striated muscle fiber), and GO:0005865 is itself not currently a descendant of GO:0005884
    actin filament, so the natural placement is part_of GO:0030485 by analogy with GO:0030486,
    with the exact axiomatisation left to GO editors.
  proposed_parent:
    id: GO:0030485
    label: smooth muscle contractile fiber
  supported_by:
  - reference_id: PMID:8006065
    supporting_text: Using an antibody specific only for muscle actin, labelling was found generally
      around the myosin filaments of the contractile apparatus, but was absent from the core of the
      dense bodies that contained beta-actin.
  - reference_id: PMID:38820162
    supporting_text: Actin and myosin polymers form the thin and thick filaments of muscle cells that
      interact and slide past one another during muscle contraction, respectively
  - reference_id: PMID:24337657
    supporting_text: both ACTG2 mutants interfere with proper polymerization of ACTG2 into thin filaments,
      leading to impaired contractility of the smooth muscle
suggested_questions:
- question: >-
    For PAINT, stated once with all affected genes named. Inside PTHR11937, GO:0005884 actin
    filament is asserted at three nodes - PTN000233075 (seed ACTA1, reaches ACTA1 only),
    PTN000748220 (seed ACTC1, reaches ACTC1 only) and PTN002631586 (seeds ACTG1 and mouse Actg1,
    reaches ACTB, ACTBL2, ACTG1, ACTL8 and the five POTE genes) - so the two smooth muscle actins
    ACTA2 and ACTG2 receive it from nowhere and hold zero annotations to it or any descendant.
    The same node PTN000748220 likewise confines GO:0017022 myosin binding, GO:0033275
    actin-myosin filament sliding and GO:0007015 actin filament organization to ACTC1 alone.
    Would PAINT consider moving these four terms to a node that covers the muscle actins, or
    asserting them at a smooth-muscle node? One edit would fix two genes for four terms.
- question: >-
    For PAINT, the reciprocal half of the same finding. PTN004322804 is the only node in
    PTHR11937 whose human reach is exactly the smooth muscle actin pair, and the only term it
    carries is GO:0005576 extracellular region, from a single IBD seed, RGD:621676 = rat Acta2.
    No non-IBA evidence for that exact term exists anywhere in the chain: the seed gene is also a
    recipient of the resulting IBA - its GO:0005576 row cites this node and its own identifier -
    and its only non-IBA annotation anywhere under GO:0005576 is a basement-membrane IDA in
    fetal rat testis, three levels below the term asserted. Should that assertion be withdrawn?
    It is the only node-level statement PAINT makes specifically about the smooth muscle actins,
    and it places them outside the cell.
- question: >-
    For UniProt, on the AgBase-derived ISS block. Six ACTG2 rows are transferred from
    UniProtKB:P08023 (chicken ACTA2) although chicken has its own reviewed ACTG2 orthologue,
    P63270, and although human ACTA2 already carries five of the same rows from the same donor.
    Should the ACTG2 copies be withdrawn, and should GO_REF:0000024 transfers be constrained to
    the closest available orthologue when one exists in the source organism?
- question: >-
    For AgBase, a question rather than an assertion because only the abstract of the 1999 source
    was available. PMID:10633868 knocks down chick alpha-smooth-muscle actin with antisense
    oligonucleotides and reports reduced SMA expression and reduced mesenchymal formation; SMA is
    the target of TGF-beta-dependent induction throughout. On what basis was GO:0010628 positive
    regulation of gene expression assigned to chicken ACTA2 by IDA from that paper?
- question: >-
    For RGD. Rat Actg2 (P63269) carries GO:0045471, GO:0071354 and GO:1905641 by IEP from
    PMID:28320086 and PMID:21294755. Both papers measure alpha-smooth-muscle actin as a hepatic
    stellate cell activation marker - the ACTA2 gene product - and rat Acta2 (P62738) received no
    annotation from either. Were these intended for Acta2?
- question: >-
    For GOA and UniProt. ACTG2 carried GO:0016887 ATP hydrolysis activity but no
    nucleotide-binding term of any kind, and after the retirement of keyword-derived annotations
    the same is true of ACTA2, ACTB and ACTG1; only ACTA1 and ACTC1 among the conventional actins
    carry one, although UniProt's own DR block still lists GO:0005524 IEA:UniProtKB-KW for
    ACTG2. Both are proposed here - GO:0043531 as IDA on the ligand resolved in ACTG2's own
    structures and GO:0005524 as ISS on the catalytic-activity statement. Is the same gap worth
    closing across ACTA2, ACTB and ACTG1, which have identical evidence and identical silence?
- question: >-
    For GO ontology development. Is there appetite for a smooth muscle thin filament term? The
    smooth muscle branch is modelled at fibre and dense-body level but not at filament level,
    while the striated branch has GO:0005865, and the gap forces smooth muscle actins,
    tropomyosins and caldesmon onto terms that are either generic or wrong.
- question: >-
    For the ACTG2 field. Every characterised variant is assayed as a shift in polymerisation
    kinetics, yet ACTG2 filaments are propelled by smooth muscle myosin at wild-type velocity
    even when they carry R40C or R257C. Which downstream property of the mutant filament -
    fragility under load, tropomyosin occupancy, or nucleator engagement - dominates in intact
    muscle?
suggested_experiments:
- hypothesis: >-
    The ACTG2 disease variants impair contraction under load rather than unloaded sliding, which
    is why gliding velocity is normal while patients lose peristalsis.
  experiment_type: single-molecule mechanics on a reconstituted thin filament
  description: >-
    Reconstitute the visceral smooth muscle thin filament from purified human components -
    ACTG2, Tpm1.4, caldesmon and calponin - and measure force and duty ratio against smooth
    muscle myosin in an optical-trap assay, for wild type and for the four common arginine
    variants at the 50/50 wild-type/mutant ratio that heterozygotes actually have. The gliding
    assays reported so far measure unloaded velocity, which is precisely the parameter the
    mutants do not change.
- hypothesis: >-
    ACTG2 and ACTA2 co-polymerise into common thin filaments in visceral smooth muscle, so a
    dominant-negative ACTG2 allele can poison filaments containing either isoform.
  experiment_type: isoform-resolved super-resolution imaging of human tissue
  description: >-
    Determine whether ACTG2 and ACTA2 co-polymerise into common filaments in visceral smooth
    muscle or segregate into separate filament populations, using isoform-specific antibodies
    with expansion microscopy or immuno-electron tomography on human intestinal muscularis. Much
    of the annotation record treats the two genes as interchangeable, and the answer determines
    whether a dominant-negative ACTG2 allele can also poison ACTA2 filaments.
- hypothesis: >-
    SETD3-dependent His-74 methylation of ACTG2 is required for normal visceral smooth muscle
    contraction, not only for uterine contraction at parturition.
  experiment_type: mouse phenotyping plus in vitro polymerisation kinetics
  description: >-
    Test whether the SETD3-dependent His-74 methylation resolved in the ACTG2 cryo-EM structures
    is required for visceral smooth muscle function, by comparing gastrointestinal transit and
    bladder emptying in Setd3-null mice with the phenotype of the Actg2 knock-in lines, and by
    measuring polymerisation kinetics of unmethylated recombinant ACTG2 expressed in
    SETD3-deficient cells.
- hypothesis: >-
    ACTG2 and ACTA2 occupy distinct cell populations within the intestinal wall, so annotations
    transferred between them are transferred between different cell types.
  experiment_type: single-cell proteomics and isoform-resolved imaging
  description: >-
    Establish which cells in human intestine express ACTG2 versus ACTA2 at protein level, by
    single-cell proteomics or isoform-resolved imaging across muscularis mucosa, muscularis
    propria and intestinal vasculature. Several of the annotations reviewed here rest on treating
    the two as one protein, and UniProt's tissue-specificity statement rests on a single study.
