- term:
    id: GO:0017022
    label: myosin binding
  evidence_type: IDA
  original_reference_id: PMID:38820162
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation, and the second term stranded by the same node-placement problem
      as GO:0005884. GO:0017022 is asserted in PTHR11937 at PTN000748220 only, seeded from
      ACTC1, and reaches ACTC1 alone; the same node also carries GO:0033275 actin-myosin
      filament sliding and GO:0007015 actin filament organization, each likewise reaching only
      ACTC1. Nothing about myosin engagement is specific to cardiac actin.

      ACTG2's own evidence is direct. Ceron et al. ran in-vitro motility assays in which
      phalloidin-stabilised ACTG2 filaments were propelled across coverslips coated with a
      smooth muscle myosin construct comprising the motor domain and essential light chain MYL6,
      and found the gliding velocity indistinguishable from that of alpha-actin, with and
      without the smooth muscle tropomyosin Tpm1.4. Productive myosin-driven translocation of a
      filament requires the myosin motor to bind it. The same paper independently places one of
      the disease-mutated residues, R148, on the myosin-binding interface.

      Deliberately claimed at binding level only. The gliding assay uses a myosin fragment on a
      surface, so it demonstrates the interaction and its motor output but does not license a
      tissue-level term on its own; smooth muscle contraction is proposed separately, on genetic
      evidence.

      On the evidence code: IPI would be the convention if the interacting partner were
      identified, but the paper does not identify it. SMM-S1 is described only as a
      "smooth muscle myosin construct" from a baculovirus provided by a collaborator,
      coexpressed in Sf9 cells with the essential light chain MYL6; no heavy-chain gene or
      species is given, and MYH11 appears in the paper only in the introduction, as a
      visceral-myopathy disease gene, not as the identity of this construct. MYL6 is named but
      is a light chain, not the actin-binding moiety, so citing it as the interactor would
      misdescribe what was assayed. IDA is therefore used for a direct in vitro assay whose
      partner is characterised functionally but not by accession; a curator who can establish
      the construct's heavy chain from the cited methods reference should convert this to IPI.
    action: NEW
    reason: >-
      Direct in-vitro demonstration that smooth muscle myosin engages and translocates ACTG2
      filaments at wild-type velocity, filling a term that PAINT currently attaches only to
      ACTC1's own node despite it being a general property of muscle actins.
    supported_by:
    - reference_id: PMID:38820162
      supporting_text: The filament gliding velocity was similar for
    - reference_id: PMID:38820162
      supporting_text: we used smooth muscle myosin construct SMM-S1, comprising the motor domain
        and essential light chain (MYL6)
    - reference_id: PMID:38820162
      supporting_text: R148 also forms part of the myosin-binding interface
