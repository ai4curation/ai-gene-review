- term:
    id: GO:0032982
    label: myosin filament
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  review:
    summary: >-
      This row has the right biology attached to an impossible compartment, so it is repaired
      rather than removed.

      The donor, UniProtKB:F1P476, is an unreviewed TrEMBL chicken entry for ACTA2 - a second
      record for the same paralog used on rows 11-16 - carrying a single IDA for GO:0032982 from
      PMID:8006065, "Actin isoform compartments in chicken gizzard smooth muscle cells". The
      sentence behind the annotation reads that with a muscle-actin-specific antibody labelling
      was found generally around the myosin filaments of the contractile apparatus. Around, not
      within. GO:0032982 is defined as a supramolecular fiber containing myosin heavy chains in
      which the heavy chains are arranged into a filament; an actin cannot be located in one.
      What the observation describes is the actin filaments of the smooth muscle contractile
      apparatus interdigitating with the myosin filaments, which is GO:0030485 smooth muscle
      contractile fiber.

      Unusually for this donor, the underlying biology transfers better to ACTG2 than to ACTA2.
      Chicken gizzard is enteric smooth muscle, the paper states that differentiated smooth
      muscle contains both muscle actin isoforms, and the antibody used was pan-muscle-actin
      rather than alpha-specific, so gamma-enteric actin is among what was labelled. The
      compartment call therefore stands once the term is corrected.
    action: MODIFY
    reason: >-
      The term is not merely too general, it is categorically wrong: GO:0032982 is a
      myosin-heavy-chain polymer and cannot contain actin, and the source sentence says
      labelling was around the myosin filaments, not in them. GO:0030485 smooth muscle
      contractile fiber is what the observation supports and is the structure ACTG2 occupies in
      tissue.

      On why this row is repaired while five rows from the same chicken gene are removed: the
      split is not about the donor, it is about whether the observation is one that could have
      been made on gamma-enteric actin. Those five come from chick cardiac cushion mesenchyme
      using an antibody raised against alpha-smooth-muscle actin specifically, a cell type and a
      reagent that exclude ACTG2. This one comes from gizzard - enteric smooth muscle, where
      gamma-enteric actin is a major isoform - using a pan-muscle-actin antibody that does not
      discriminate the two. The paralogy of the donor is the same in both cases; the
      transferability of the observation is not.
    proposed_replacement_terms:
    - id: GO:0030485
      label: smooth muscle contractile fiber
    supported_by:
    - reference_id: PMID:8006065
      supporting_text: Using an antibody specific only for muscle actin, labelling was found generally
        around the myosin filaments of the contractile apparatus, but was absent from the core of
        the dense bodies that contained beta-actin.
    - reference_id: PMID:8006065
      supporting_text: Differentiated smooth muscle cells typically contain a mixture of muscle (alpha
        and gamma) and cytoplasmic (beta and gamma) actin isoforms.
    - reference_id: PMID:38820162
      supporting_text: Actin and myosin polymers form the thin and thick filaments of muscle cells
        that interact and slide past one another during muscle contraction, respectively
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - SOURCE_MISCITATION
      source_entities:
      - source_id: UniProtKB:F1P476
        source_label: ACTA2 (Gallus gallus, TrEMBL (unreviewed), 377 aa)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Unreviewed entry, and a duplicate record for the same chicken gene as the reviewed
          P08023 used on rows 11-16. Own evidence in QuickGO for this term: IDAx1 from
          PMID:8006065, whose own sentence describes labelling around rather than within the
          myosin filaments. The observation itself does apply to gamma-enteric actin, because the
          antibody was pan-muscle-actin and the tissue was gizzard.
