        or transplantation) were invariably due to one of the arginine missense alleles
    - reference_id: PMID:36264152
      supporting_text: The Actg2R257C heterozygous variant impairs SMCs contraction by interfering
        with actin polymerization, leading to GI motility disorders.
    - reference_id: PMID:40617346
      supporting_text: The Actg2D245G mutation affects intestinal motility by impairing actin polymerization
        and reducing cell contraction.
    - reference_id: PMID:26647307
      supporting_text: the identified variants not only impair ACTG2 polymerization, but also contribute
        to reduced cell contractility
    - reference_id: PMID:38820162
      supporting_text: These mutations are thought to cause disease through dominant-negative rather
        than loss-of-function mechanisms since heterozygous ACTG2 truncations and frameshifts have
        been documented in healthy individuals
core_functions:
- description: >-
    Thin-filament actin of the visceral smooth muscle contractile apparatus. ACTG2 monomers
    polymerise into the two-stranded helical filament that, anchored at dense bodies and
    membrane-associated dense plaques, slides against smooth muscle myosin thick filaments to
    generate contraction in the intestine, bladder and uterus. It contributes the structural
    integrity of that filament directly: its own cryo-EM reconstructions show a filament
    architecture indistinguishable from alpha-actin's, with no change in helical twist or rise,
    and all 38 protomer-interface positions of F-actin are identical in ACTG2. Assembly is
    nucleated by the smooth-muscle nucleator leiomodin-1 and the filaments are decorated by the
    smooth muscle tropomyosin isoform Tpm1.4; smooth muscle myosin translocates them at the same
    velocity as skeletal alpha-actin filaments. The disease variants define the same function
    negatively, each disabling a different step of it - D-loop intersubunit contacts (R40), the
    R257-E196 salt bridge holding the two long-pitch helices together (R257), actin-binding
    protein engagement (R148), or monomer stability (R178).
