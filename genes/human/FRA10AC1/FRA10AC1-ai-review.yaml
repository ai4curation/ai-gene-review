id: Q70Z53
gene_symbol: FRA10AC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  FRA10AC1 is a nuclear protein in the spliceosomal C complex. Biallelic loss-of-function
  variants reduce FRA10AC1 protein and cause a neurodevelopmental disorder, and functional
  data support a role in pre-mRNA splicing despite FRA10AC1 having diverged from the catalytic
  histidine acid-phosphatase branch of PTHR11567.
