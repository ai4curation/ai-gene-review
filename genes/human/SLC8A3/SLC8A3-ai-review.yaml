id: P57103
gene_symbol: SLC8A3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Sodium/calcium exchanger 3 (NCX3) is a multi-pass plasma-membrane
  antiporter that couples the electrogenic, Na+-gradient-driven countertransport of
  one Ca2+ against three Na+ (3Na+ to 1Ca2+ stoichiometry). It is one of the principal
  routes of Ca2+ extrusion in excitable cells and, like other NCX isoforms, can run
  in either direction depending on the transmembrane Na+ and Ca2+ gradients and
  membrane potential (forward mode extruding Ca2+, reverse mode importing Ca2+).
  Expression is largely restricted to brain/neurons and skeletal muscle (also retina),
  distinguishing it from the broadly expressed NCX1 and brain-restricted NCX2. Its
  cytoplasmic Calx-beta domains bind regulatory Ca2+ that gates exchange activity.
  In neurons it restores resting cytoplasmic Ca2+ after activity and contributes to
  synaptic Ca2+ handling; in skeletal muscle it participates in Ca2+ handling during
  excitation-contraction coupling. A notable biochemical feature is that NCX3 activity
  is relatively insensitive to ATP depletion, unlike NCX1 and NCX2, allowing it to
  operate under energy-limited conditions such as ischemia. NCX3 is required for normal
  oligodendrocyte differentiation and myelination, and its loss causes impaired
  neuromuscular transmission and increased neuronal vulnerability to hypoxic-ischemic
  injury.
