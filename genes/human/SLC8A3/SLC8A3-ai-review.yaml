- id: Reactome:R-HSA-5578775
  title: Ion homeostasis
  findings: []
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: Used as TAS support for regulation of cardiac conduction; this is a
      family/pathway-level ion-homeostasis annotation whose cardiac-conduction aspect
      reflects NCX1, not the brain/skeletal-muscle-restricted NCX3.
suggested_questions:
- question: Does human NCX3 genuinely reside and function at a mitochondrial membrane,
    and if so at the inner or outer membrane, or is the mitochondrial annotation an
    artefact of ortholog transfer and crude fractionation?
- question: Which NCX3 splice isoforms (the full-length NCX3.3 versus the truncated
    fetal-brain and skeletal-muscle isoforms) are catalytically active exchangers, and
    do the truncated isoforms have distinct or regulatory functions?
suggested_experiments:
- description: Measure endogenous NCX3-mediated Na+/Ca2+ exchange currents and Ca2+
    fluxes (patch clamp and Fura-2) in human neurons and skeletal myotubes, with
    isoform-specific knockdown, to quantify forward- versus reverse-mode contributions
    and ATP sensitivity relative to NCX1/NCX2.
- description: Perform sub-organellar fractionation plus immuno-electron microscopy of
    endogenous human NCX3 to test the reported mitochondrial and ER-membrane
    localizations and distinguish genuine residence from biosynthetic transit.
knowledge_gaps:
- gap_statement: Whether human NCX3 physically resides and transports Ca2+ at a
    mitochondrial membrane (and at which membrane), and the physiological significance
    of any such mitochondrial activity, is undetermined.
  boundary: The plasma-membrane Na+/Ca2+ antiporter activity of NCX3 is firmly
    established; the mitochondrial localization and Ca2+-efflux role rest entirely on
    similarity to the rodent ortholog, with no direct human evidence.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
