- id: PMID:21382638
  title: High levels of synaptosomal Na(+)-Ca(2+) exchangers (NCX1, NCX2, NCX3) co-localized
    with amyloid-beta in human cerebral cortex affected by Alzheimer's disease.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMC full text verified. Establishes NCX3 protein in human cortical
      synaptic terminals (synaptosomes) and states NCX3 expression is restricted to
      brain and skeletal muscle, that NCX extrudes Ca2+ at the plasma membrane using the
      Na+ gradient (forward mode) and can import Ca2+ in reverse mode, and that NCX3
      disruption causes defective neuromuscular transmission. Supports the synapse
      location and the transport/homeostasis terms.
- id: PMID:21959935
  title: Silencing or knocking out the Na(+)/Ca(2+) exchanger-3 (NCX3) impairs oligodendrocyte
    differentiation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMC full text verified; this is the UniProt experimental anchor
      (ECO:0000269). Direct human/rat evidence that NCX3 is required for oligodendrocyte
      differentiation and myelination (siRNA, overexpression, and ncx3-null
      hypo-myelination), plus immunofluorescence localizing NCX3 to the plasma membrane
      and perinuclear region. Also recounts NCX3-null phenotypes including impaired
      hippocampal LTP/learning/memory, hypoxic-ischemic vulnerability, and skeletal
      muscle necrosis/neuromuscular transmission defects.
