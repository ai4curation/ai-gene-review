suggested_questions:
- question: How much of cellular VDAC1 is genuinely in the plasma membrane, and by what route does a beta-barrel
    protein normally targeted to the outer mitochondrial membrane reach the cell surface?
- question: Does the scramblase activity require the same dimer interface in intact mitochondria, and
    is it regulated separately from channel gating?
suggested_experiments:
- description: Quantify surface VDAC1 in neurons and endothelial cells by surface biotinylation and antibody
    labelling of non-permeabilized cells, with VDAC1 knockout controls, to settle the size and reality
    of the plasmalemmal pool.
- description: Test dimer-interface mutants (scramblase-dead but conduction-competent) in VDAC1/2-null
    cells for mitochondrial phospholipid import versus metabolite flux.
