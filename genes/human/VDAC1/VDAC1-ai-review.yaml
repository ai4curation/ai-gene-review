id: P21796
gene_symbol: VDAC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: VDAC1 is the most abundant protein of the mitochondrial outer membrane and the major conduit
  between the cytosol and the intermembrane space. It folds as a 19-stranded beta barrel with an N-terminal
  helix inside the pore, forming a large voltage-gated channel that is open and weakly anion-selective
  near zero membrane potential and switches to a cation-selective, low-conductance closed state above
  about 30-40 mV. Through this channel VDAC1 passes ATP, ADP, phosphate, pyruvate, other small metabolites
  and ions, including the Ca2+ that the MCU then takes into the matrix. VDAC1 dimers additionally act
  as a phospholipid scramblase, translocating lipids across the outer membrane by a mechanism unrelated
  to channel conduction. The barrel binds cholesterol, oxysterol, phosphatidylcholine and ceramide, and
  its cytosolic face is a docking platform for hexokinases, BCL-2-family proteins and kinases; VDAC1 is
  a component of the mitochondrial permeability transition pore complex with SPG7 and PPIF, and is a Parkin
  substrate whose ubiquitination state sets the balance between mitophagy and apoptosis. A minor extramitochondrial
  pool has been reported in the plasma membrane, including neuronal lipid rafts.
