suggested_questions:
- question: Mouse Armcx1 co-immunoprecipitates with Miro1. Does human ARMCX1 bind MIRO1 directly, does
    it also bind TRAK or kinesin, and how does a mitochondrial outer-membrane protein recruit FBXW7 to
    c-Myc?
suggested_experiments:
- description: Map ARMCX1 binding partners on mitochondria by proximity labelling in neurons, and test
    whether its tumour-suppressor activity needs mitochondrial targeting.
