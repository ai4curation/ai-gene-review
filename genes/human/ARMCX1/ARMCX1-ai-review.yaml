- id: PMID:28009275
  title: The Mammalian-Specific Protein Armcx1 Regulates Mitochondrial Transport during Axon Regeneration.
  findings:
  - statement: Armcx1 is mitochondrial and enhances mitochondrial transport in RGCs.
    supporting_text: Armcx1 overexpression enhances mitochondrial transport in adult retinal ganglion
      cells (RGCs).
  - statement: Armcx1 co-immunoprecipitates with Miro1.
    supporting_text: Co-immunoprecipitation using Armcx1-HA and Miro1-Myc showed that Armcx1 interacted
      with Miro1 (Figure 1H), the protein linking mitochondria to the Trak1-Kinesin motor complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse retinal ganglion cells. An erratum exists (Neuron 2017;94(3):689);
      its content is not in the cache.
- id: PMID:37454781
  title: Armcx1 attenuates secondary brain injury in an experimental traumatic brain injury model in male
    mice by alleviating mitochondrial dysfunction and neuronal cell death.
  findings:
  - statement: Armcx1 protects against secondary brain injury after TBI.
    supporting_text: Armcx1 is highly expressed in the brain and is located in the mitochondrial outer
      membrane of neurons, where it mediates mitochondrial transport.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; mouse TBI with overexpression and knockdown.
  full_text_unavailable: true
- id: PMID:38492796
  title: Armcx1 Reduces Neurological Damage Via a Mitochondrial Transport Pathway Involving Miro1 After
    Traumatic Brain Injury.
  findings:
  - statement: Armcx1 knockdown impairs mitochondrial transport and lowers Miro1 after TBI.
    supporting_text: In addition, inhibition of Armcx1 expression further led to impaired mitochondrial
      transport, abnormal morphology, reduced ATP levels, aggravation of neuronal apoptosis and neurological
      dysfunction, and decrease Miro1 expression.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; mouse TBI.
  full_text_unavailable: true
- id: PMID:22569362
  title: The Eutherian Armcx genes regulate mitochondrial trafficking in neurons and interact with Miro
    and Trak2.
  findings:
  - statement: The Armcx family is mitochondrial and derived from Armc10.
    supporting_text: The Armcx cluster is unique to Eutherian mammals and evolved from a single ancestor
      gene (Armc10).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; mouse.
  full_text_unavailable: true
- id: PMID:39285446
  title: ARMCX1 inhibits lung adenocarcinoma progression by recruiting FBXW7 for c-Myc degradation.
  findings:
  - statement: ARMCX1 recruits FBXW7 for c-Myc degradation.
    supporting_text: ARMCX1 inhibits lung adenocarcinoma progression by recruiting FBXW7 for c-Myc degradation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; lung adenocarcinoma cell lines.
- id: PMID:11162520
  title: ALEX1, a novel human armadillo repeat protein that is expressed differentially in normal tissues
    and carcinomas.
  findings:
  - statement: ALEX1 expression is lost or reduced in many carcinomas.
    supporting_text: Expression of ALEX1 and ALEX2 mRNA is lost or significantly reduced in human lung,
      prostate, colon, pancreas, and ovarian carcinomas and also in cell lines established from different
      human carcinomas.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; ALEX1 cloning and loss in carcinomas.
  full_text_unavailable: true
