- term:
    id: GO:0019896
    label: axonal transport of mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1918953
  - PANTHER:PTN001038987
  review:
    summary: Axonal transport of mitochondrion (IBA). The node's seed is mouse Armcx3, which regulates
      neuronal mitochondrial trafficking through the Kinesin/Miro/Trak2 complex. Mouse Armcx1 itself binds
      Miro1, the adaptor that couples mitochondria to the Trak-kinesin motor, and enhances mitochondrial
      transport in retinal ganglion cell axons. Armcx1 knockdown after brain injury impairs mitochondrial
      transport and lowers Miro1. Participation rather than regulation is chosen because Armcx1 sits on
      the transported organelle and engages the transport adaptor, as Miro and TRAK do, although the papers
      describe its effect as controlling the motile pool. Accepted.
    action: ACCEPT
    reason: '[PMID:22569362 "Furthermore, we demonstrate that Armcx3 expression levels regulate mitochondrial
      dynamics and trafficking in neurons, and that Alex3 interacts with the Kinesin/Miro/Trak2 complex
      in a Ca(2+)-dependent manner."] [PMID:28009275 "Co-immunoprecipitation using Armcx1-HA and Miro1-Myc
      showed that Armcx1 interacted with Miro1 (Figure 1H), the protein linking mitochondria to the Trak1-Kinesin
      motor complex."] [PMID:28009275 "Armcx1 overexpression enhances mitochondrial transport in adult
      retinal ganglion cells (RGCs)."] [PMID:38492796 "In addition, inhibition of Armcx1 expression further
      led to impaired mitochondrial transport, abnormal morphology, reduced ATP levels, aggravation of
      neuronal apoptosis and neurological dysfunction, and decrease Miro1 expression."]'
    supported_by:
    - reference_id: PMID:22569362
      supporting_text: Furthermore, we demonstrate that Armcx3 expression levels regulate mitochondrial
        dynamics and trafficking in neurons, and that Alex3 interacts with the Kinesin/Miro/Trak2 complex
        in a Ca(2+)-dependent manner.
    - reference_id: PMID:28009275
      supporting_text: Co-immunoprecipitation using Armcx1-HA and Miro1-Myc showed that Armcx1 interacted
        with Miro1 (Figure 1H), the protein linking mitochondria to the Trak1-Kinesin motor complex.
    - reference_id: PMID:28009275
      supporting_text: Armcx1 overexpression enhances mitochondrial transport in adult retinal ganglion
        cells (RGCs).
    - reference_id: PMID:38492796
      supporting_text: In addition, inhibition of Armcx1 expression further led to impaired mitochondrial
        transport, abnormal morphology, reduced ATP levels, aggravation of neuronal apoptosis and neurological
        dysfunction, and decrease Miro1 expression.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      residue_claims_not_applicable: No residue-level claim is propagated.
      source_entities:
      - source_id: PANTHER:PTN001038987
