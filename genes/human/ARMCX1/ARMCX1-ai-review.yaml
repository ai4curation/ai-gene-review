id: Q9P291
gene_symbol: ARMCX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARMCX1 (ALEX1) is a eutherian-specific armadillo-repeat protein of the X-linked ARMCX cluster,
  which arose from the ancestral gene ARMC10. It has an N-terminal transmembrane segment with a predicted
  mitochondrial outer-membrane targeting sequence, and it localizes to mitochondria. In mouse retinal
  ganglion cells Armcx1 enhances mitochondrial transport and promotes neuronal survival and axon regeneration
  after injury, effects that depend on its mitochondrial localization. ARMCX1 expression is lost in many
  carcinomas. In lung adenocarcinoma cells it has been reported to recruit the E3 ligase FBXW7 for c-Myc
  degradation.
