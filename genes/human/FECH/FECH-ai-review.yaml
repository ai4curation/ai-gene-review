- term:
    id: GO:0009410
    label: response to xenobiotic stimulus
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Ensembl ortholog projection from rat. A general stress/toxicology response term
      not reflecting the molecular function of FECH.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Ensembl Compara projection (GO_REF:0000107) from the rat ortholog. Rat 'response to' annotations of this kind generally record that the ortholog's expression or activity changed after an exposure. No such effect of xenobiotics in general on ferrochelatase was found in the literature read for this review, and FECH is a constitutive mitochondrial enzyme of heme synthesis, so the projected process claim exceeds the evidence for the human gene. Marked as over-annotated rather than removed, because the rat observation may be real.
    supported_by:
