      supporting_text: To better understand the means by which heme synthesis is regulated during erythropoiesis, affinity purification coupled with mass spectrometry (MS) was carried out to identify putative protein partners interacting with ferrochelatase (FECH), the terminal enzyme in the heme biosynthetic pathway.
