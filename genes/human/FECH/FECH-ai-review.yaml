- term:
    id: GO:0010038
    label: response to metal ion
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Ensembl ortholog projection from rat; broad response-to-metal term.
    action: KEEP_AS_NON_CORE
    reason: >-
      Ensembl Compara projection (GO_REF:0000107) from the rat ortholog. The response definition covers a change in the activity of a gene product after a stimulus, and ferrochelatase activity is directly decreased by lead (rat liver pretreatment; inhibition of ferrochelatase is a clinically important consequence of lead poisoning). Kept as non-core toxicology-relevant biology; this is not a dedicated sensing or detoxification role.
