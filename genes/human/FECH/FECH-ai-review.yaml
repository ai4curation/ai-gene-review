  evidence_type: IPI
  original_reference_id: PMID:27599036
  qualifier: enables
  review:
    summary: >-
      IPI capturing the FECH-PGRMC1 (O00264) interaction. The bare protein binding
      term is uninformative; the biology (PGRMC1 regulation of FECH) is real but the
      term itself does not convey molecular function.
    action: REMOVE
    reason: >-
      Bare protein binding carries no functional information; per the protein-binding policy the row is removed. Removal does not dispute the interaction: the FECH-PGRMC1 interaction is real (PGRMC1 lowers FECH activity in vitro), but it describes a regulator acting on FECH and does not identify a more informative FECH molecular function to MODIFY to.
