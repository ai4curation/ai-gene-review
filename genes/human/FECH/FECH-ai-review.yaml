- term:
    id: GO:0051537
    label: 2 iron, 2 sulfur cluster binding
  evidence_type: IDA
  original_reference_id: PMID:8973195
  qualifier: enables
  review:
    summary: >-
      Proposed annotation: human FECH binds one [2Fe-2S] cluster per subunit, ligated by Cys403, Cys406 and Cys411 plus one non-cysteinyl ligand; the cluster is required for activity. The cluster-binding term is carried in UniProt only through a keyword mapping, not as an experimental GOA row.
    action: NEW
    reason: >-
      Direct mutagenesis and spectroscopy on human FECH show the three C-terminal cysteines ligate an essential [2Fe-2S] cluster (cysteine mutants are inactive and fail to assemble the cluster), and the human crystal structure confirms it. This cofactor-binding function supports the catalytic activity and is listed in core_functions.
    supported_by:
    - reference_id: PMID:8973195
      supporting_text: Mutations of cysteines at positions 403, 406, and 411 (C403D, C403H, C406D, C406H, C406S, C411H, and C411S mutants) all resulted in inactive enzyme that failed to assemble the [2Fe-2S] cluster as judged by whole-cell EPR studies.
    - reference_id: PMID:8973195
      supporting_text: The results indicate that three of the conserved cysteines in the 30-residue C-terminal extension of mammalian ferrochelatase are involved in ligating the [2Fe-2S] cluster.
