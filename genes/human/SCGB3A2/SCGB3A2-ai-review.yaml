  label: Homo sapiens
description: SCGB3A2 (Secretoglobin family 3A member 2), also known as uteroglobin-related
  protein 1 (UGRP1) or pneumo secretory protein 1 (PnSP-1), is a small (~10 kDa) secreted
  protein of the secretoglobin superfamily, UGRP subfamily. It is strongly lung- and
  trachea-enriched, produced by airway epithelial secretory cells (including club
  cells) and submucosal gland serous cells. The mature protein forms a disulfide-linked
  homodimer and acts as a secreted, cytokine-like factor. It binds the macrophage
  scavenger receptor MARCO and various pathogens, implicating it in innate airway
  defense and pathogen clearance, and it inhibits phospholipase A2, an activity shared
  with its paralog SCGB1A1 that underlies anti-inflammatory function. In rodent models
  the protein shows growth-factor activity promoting fetal lung development and antifibrotic
  activity. Reduced or altered SCGB3A2 has been linked to airway inflammatory disease
  and atopy/asthma.
