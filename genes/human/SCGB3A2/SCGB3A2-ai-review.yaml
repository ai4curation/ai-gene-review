- term:
    id: GO:0071682
    label: endocytic vesicle lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-2247510
  qualifier: located_in
  review:
    summary: Reactome annotation reflecting that SCGB3A2, bound as a ligand to the
      scavenger receptor MARCO, is endocytosed by alveolar macrophages and so transiently
      occupies the endocytic vesicle lumen.
    action: KEEP_AS_NON_CORE
    reason: This localization is real but peripheral to the protein's core function.
      It is a consequence of MARCO-mediated endocytic clearance of the secreted ligand
      by alveolar macrophages (Reactome event "MARCO:ligand is endocytosed"), not
      a compartment in which SCGB3A2 performs its characterized secreted/anti-inflammatory
      activity. It is retained as a valid but non-core location, consistent with the
      MARCO ligand-receptor pairing reported by Bin et al.
    supported_by:
    - reference_id: PMID:12847263
      supporting_text: collagenous structure (MARCO) as a receptor for UGRP1
- term:
    id: GO:0019834
    label: phospholipase A2 inhibitor activity
  evidence_type: IDA
  review:
    summary: Recombinant human SCGB3A2 directly inhibits phospholipase A2 activity
      in a quantitative biochemical assay, paralleling the established PLA2-inhibitor
      activity of the paralog SCGB1A1.
    action: NEW
    reason: Cai et al. biochemically demonstrated that purified human (and mouse)
      SCGB3A2 dimer exhibits phospholipase A2 inhibitory activity. This is the clearest
      molecular function of SCGB3A2, is not captured by any existing GOA annotation,
      and mechanistically underlies the protein's reported anti-inflammatory role
      in the airway. The paralog SCGB1A1 carries the same term (GO:0019834) with direct
      evidence, supporting conservation across the secretoglobin family.
    supported_by:
    - reference_id: PMID:24213919
      supporting_text: Human SCGB3A2, as well as mouse SCGB3A2, readily formed a dimer
        in solution and exhibited novel phospholipase A2 inhibitory activity
    - reference_id: file:human/SCGB3A2/SCGB3A2-deep-research-openscientist.md
      supporting_text: PLA2 inhibition is the single biochemical activity that mechanistically
        unifies the anti-inflammatory and anti-fibrotic phenotypes
- term:
    id: GO:0008083
    label: growth factor activity
  evidence_type: IDA
  original_reference_id: PMID:24213919
  qualifier: enables
  review:
    summary: Recombinant human SCGB3A2 exhibits growth factor activity, promoting
      embryonic lung development ex vivo and in vivo.
    action: NEW
    reason: Cai et al. (PMID:24213919) directly tested recombinant human SCGB3A2 and
      showed it exhibits growth factor activity, promoting mouse embryonic lung branching
      morphogenesis and development in both ex vivo organ culture and in vivo, comparable
      to recombinant mouse SCGB3A2. GO:0008083 is a molecular function term, and the
      secreted human protein itself drives the growth response, so an IDA NEW annotation
      is warranted. This matches the growth factor activity annotation on mouse Scgb3a2,
      which cites the same human-protein result; the activity is conserved across the
      two orthologs and is not captured by any existing GOA annotation.
    supported_by:
    - reference_id: PMID:24213919
      supporting_text: human SCGB3A2 exhibited growth factor activity by promoting embryonic
        lung development in both ex vivo and in vivo systems
    - reference_id: PMID:24213919
      supporting_text: To determine whether human SCGB3A2 exhibits growth factor activity,
        rhSCGB3A2 was added to the medium for mouse embryonic lung ex vivo organ culture
