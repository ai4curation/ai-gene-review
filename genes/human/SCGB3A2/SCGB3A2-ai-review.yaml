- id: PMID:12847263
  title: Identification of uteroglobin-related protein 1 and macrophage scavenger
    receptor with collagenous structure as a lung-specific ligand-receptor pair.
  findings:
  - statement: SCGB3A2/UGRP1 is a secreted lung-specific protein that binds the macrophage
      scavenger receptor MARCO, copurifies with APOA1, and binds bacteria and yeast,
      suggesting a role in airway inflammation and pathogen clearance.
    supporting_text: we identified macrophage scavenger receptor with collagenous
      structure (MARCO) as a receptor for UGRP1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary study; establishes the MARCO ligand-receptor
      pairing, APOA1 copurification, pathogen binding, and secreted localization of
      SCGB3A2 (UGRP1 = HIN-2).
- id: PMID:24213919
  title: Preclinical evaluation of human secretoglobin 3A2 in mouse models of lung
    development and fibrosis.
  findings:
  - statement: Purified human SCGB3A2 forms a dimer and has novel phospholipase A2
      inhibitory activity; in mouse models it shows growth-factor (lung development)
      and antifibrotic activity.
    supporting_text: Human SCGB3A2, as well as mouse SCGB3A2, readily formed a dimer
      in solution and exhibited novel phospholipase A2 inhibitory activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified primary study (PMC3920213, full text). Direct biochemical
      demonstration of PLA2 inhibitory activity of the human protein, and a direct
      demonstration that recombinant human SCGB3A2 has growth factor activity (GO:0008083,
      a molecular function) promoting embryonic lung development ex vivo and in vivo.
      Both support NEW molecular-function annotations here. The antifibrotic effect
      is an in vivo mouse phenotype of the human protein and is treated as supporting
      context rather than a directly annotated process.
