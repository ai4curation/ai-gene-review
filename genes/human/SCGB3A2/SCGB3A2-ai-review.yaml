suggested_questions:
- question: Does human SCGB3A2 signal through a specific receptor to exert its growth-factor/antifibrotic
    effects, or are these effects entirely attributable to PLA2 inhibition and ligand
    sequestration?
- question: What is the physiological spectrum of hydrophobic ligands bound by the
    SCGB3A2 homodimer cavity, and does ligand binding modulate its MARCO interaction?
suggested_experiments:
- description: Determine the crystal/cryo-EM structure of the SCGB3A2 homodimer with
    and without bound lipid to define the ligand-binding cavity.
- description: Generate SCGB3A2-knockout human airway organoids and test PLA2 activity,
    eicosanoid output, and inflammatory/fibrotic responses to confirm the anti-inflammatory
    mechanism in human cells.
