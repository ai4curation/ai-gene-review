- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: 'Membrane, from the UniProt SubCell mapping. The underlying assertion is ECO:0000305 - a
      curator inference rather than an observation - and no particular membrane is named, so the annotation
      places the protein in an unspecified bilayer. That is the grounds for marking it over-annotated:
      not that nothing is known about its membrane association, but that this term records none of what
      is.


      What is annotated, and is more informative than this term, is the topology: a signal-anchor transmembrane
      helix at residues 35-55 and single-pass type II orientation, with N-glycosylation at 67 and 201.
      A specific membrane and a topology-aware term would both be improvements; neither can be justified
      from an ECO:0000305 inference alone, and no experimental localisation exists for this protein.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Unspecified membrane from a curator-inferred UniProt statement. Marked over-annotated for
      lack of specificity rather than for lack of membrane association - the protein does carry an annotated
      signal-anchor and type II topology, which this term fails to convey.
    supported_by:
    - reference_id: file:human/ABHD14A/ABHD14A-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cytoplasm {ECO:0000250}. Membrane {ECO:0000305};'
    - reference_id: file:human/ABHD14A/ABHD14A-uniprot.txt
