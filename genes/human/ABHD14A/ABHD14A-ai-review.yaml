- id: PMID:37974539
  title: Identification of sequence determinants for the ABHD14 enzymes.
  findings:
  - statement: >-
      As of 2023, ABHD14A lacked functional annotation, in contrast to its
      mammalian lysine deacetylase paralog ABHD14B.
    supporting_text: >-
      While ABHD14A still lacks any functional annotation to date, we
  - statement: >-
      High sequence similarity causes automated databases to conflate ABHD14A
      and ABHD14B as the same enzyme across organisms.
    supporting_text: >-
      Given 
      their high sequence similarity, automated databases often wrongly assign ABHD14A 
      and ABHD14B as the same enzyme, and therefore, annotating functions to them in 
      various organisms has been problematic.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Defines sequence determinants separating type II membrane SF1 (ABHD14A)
      from soluble KDAC SF2 (ABHD14B) and documents the recurrent paralog
      conflation hazard across automated annotation pipelines.
- id: PMID:42469586
  title: Biochemical Characterization of ABHD14A, an Outlying Member of the Metabolic
    Serine Hydrolase Family.
  findings:
  - statement: >-
      An engineered soluble N-terminally truncated human ABHD14A variant turns
      over short-chain p-nitrophenyl esters with CoA-dependent enhancement in
      vitro, and full-length human ABHD14A-GFP localizes specifically to the
      Golgi apparatus in HEK293T cells, while physiological substrates remain
      to be identified.
    supporting_text: >-
      Together, these findings establish the enzymatic
      activity, mechanistic features, and subcellular localization of ABHD14A while
      providing essential biochemical tools that can now enable the systematic
      discovery of its physiological substrates and regulatory contexts.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Peer-reviewed 2026 primary biochemical characterization of human ABHD14A
      (superseding bioRxiv preprint 10.1101/2025.11.28.691245), demonstrating
      in vitro surrogate p-nitrophenyl ester turnover with CoA enhancement on a
      truncated soluble construct and Golgi localization of overexpressed
      ABHD14A-GFP in HEK293T cells while leaving native physiological
      substrates open.
