description: >-
  Single-pass type II membrane alpha/beta-hydrolase (271 aa) containing an
  N-terminal signal-anchor transmembrane helix (residues 35-55), predicted
  lumenal N-glycosylation sites at Asn67 and Asn201, and a conserved
  Ser171-Asp222-His249 charge-relay catalytic triad within a secretory-lumenal
  alpha/beta-hydrolase domain. Full-length human ABHD14A-GFP localizes to the
  Golgi apparatus upon expression in human HEK293T cells, and an engineered
  soluble N-terminally truncated human variant turns over synthetic short-chain
  p-nitrophenyl esters with coenzyme A-dependent enhancement in vitro, whereas
  its native physiological substrates and cellular biological process remain
  undetermined. Closely related in sequence to — yet topologically and
  compartmentally distinct from — its soluble cytosolic/nuclear lysine
  deacetylase paralog ABHD14B; its rodent ortholog Dorz1 is transcriptionally
  upregulated downstream of ZIC1 in differentiating embryonic cerebellar
  granule neuron precursors without an established protein-level phenotype.
