knowledge_gaps:
- gap_statement: >-
    The endogenous physiological acyl donor and acceptor substrates of human
    Golgi-localized type II membrane enzyme ABHD14A are unknown, and whether
    coenzyme A or another lumenal thiol/protein acceptor serves as cosubstrate
    for its predicted lumenal catalytic domain in vivo is unresolved.
  boundary: >-
    Human ABHD14A (Q9BUJ0) retains a complete Ser171-Asp222-His249 catalytic
    triad and N-terminal type II signal-anchor (residues 35-55; note UniProt
    also flags uncertainty between Met1 and Met30 initiation), and an
    engineered soluble N-terminally truncated human construct turns over
    short-chain p-nitrophenyl esters with CoA enhancement in vitro while
    full-length ABHD14A-GFP localizes to the Golgi apparatus in HEK293T cells
    (PMID:42469586).
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: NARROWING
  significance: >-
    Prevents premature assignment of a specific physiological molecular
    function from surrogate p-nitrophenyl acetate assays and guards against
    paralog conflation with cytosolic/nuclear KDAC ABHD14B (PMID:37974539).
  resolution: >-
    Perform untargeted lipidomic, glycoproteomic, and acyl-acceptor profiling
    on Golgi membranes from wild-type vs catalytic-dead S171A human ABHD14A
    cells, combined with protease-protection/glycosylation topology mapping of
    the catalytic domain.
  provenance:
  - reference_id: PMID:42469586
    supporting_text: >-
      Together, these findings establish the enzymatic
      activity, mechanistic features, and subcellular localization of ABHD14A while
      providing essential biochemical tools that can now enable the systematic
      discovery of its physiological substrates and regulatory contexts.
  - reference_id: file:human/ABHD14A/ABHD14A-uniprot.txt
    record_section: ["CC:CAUTION"]
    supporting_text: "It is uncertain whether Met-1 or Met-30 is the initiator."
- gap_statement: >-
    No physiological biological process or loss-of-function cellular/organismal
    phenotype has been established for human ABHD14A.
  boundary: >-
    UniProt's ECO:0000250 comment ('Possible role in granule neuron
    development') derives solely from Zic1-dependent mRNA expression of rodent
    Dorz1 in embryonic cerebellar granule neuron precursors (PMID:14667578),
    and Golgi localization of ABHD14A-GFP in HEK293T cells (PMID:42469586) has
    not yet been linked to a specific secretory-pathway process.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Separates regulated neuronal transcript expression and heterologous Golgi
    localization from demonstrated participation in a biological process.
  resolution: >-
    Assess secretory-pathway glycoprotein/lipid processing and neuronal
    differentiation phenotypes in human iPSC-derived cerebellar/secretory cells
    or Abhd14a knockout mice rescued with WT vs S171A ABHD14A.
  provenance:
  - reference_id: PMID:14667578
    supporting_text: >-
      These results suggest that 
      Dorz1 expression is positively regulated by Zic1 during cerebellar development.
  - reference_id: file:human/ABHD14A/ABHD14A-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: "CC   -!- FUNCTION: Possible role in granule neuron development. {ECO:0000250}."
suggested_questions:
- question: >-
    Which side of the Golgi membrane does the Ser171-Asp222-His249 catalytic
    domain of endogenous human ABHD14A face, and if it is lumenal (as predicted
    by the residues 35-55 type II signal-anchor and Asn67/Asn201 glycosylation
    sites), what lumenal acyl donor and acceptor replace cytosolic CoA in vivo?
- question: >-
    Which physiological initiator methionine (Met1 vs Met30, both upstream of
    the residues 35-55 signal-anchor) is translated in endogenous human neural
    and secretory tissues?
- question: >-
    Did PMID:42469586 assay only human ABHD14A-GFP for Golgi localization (in
    which case UniProt's GO:0000139 IDA on rat Q5I0C4 and ISS back to Q9BUJ0
    should be inverted)?
suggested_experiments:
- hypothesis: >-
    Full-length human ABHD14A is a lumenally oriented type II Golgi membrane
    enzyme that modifies a secretory-pathway lipid, metabolite, or glycoprotein
    substrate distinct from cytosolic/nuclear ABHD14B targets.
  description: >-
    Perform PNGase F / Endo H deglycosylation and proteinase K protection
    assays on Golgi-enriched microsomes expressing WT vs S171A human ABHD14A,
    followed by comparative untargeted LC-MS/MS metabolomics, lipidomics, and
    acylome profiling.
  experiment_type: topology assay and untargeted mass spectrometry
- hypothesis: >-
    Endogenous ABHD14A protein expression is developmentally restricted to
    specific neural or secretory cell populations such as differentiating
    cerebellar granule neuron precursors.
  description: >-
    Generate a paralog-specific monoclonal antibody or endogenous epitope
    knock-in validated against ABHD14B cross-reactivity (using sequence
    determinants from PMID:37974539) and profile human iPSC-derived neural
    progenitors and developing mouse cerebellum.
  experiment_type: expression and localization analysis
