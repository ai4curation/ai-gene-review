  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Electronic mapping from the UniProt cytoplasm location. UniProt's own location is ECO:0000250,
      by similarity, so this is an inference on an inference, and the similarity in question runs to a
      family whose other characterised member, ABHD14B, is soluble - exactly the transfer this review
      flags as the gene's chief hazard. Accepted on the strength of the independent IBA rather than on
      family behaviour, and with the topology recorded above as a standing caveat.
    action: ACCEPT
    supported_by:
