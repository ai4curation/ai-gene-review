description: 'ABHD14A is an uncharacterised member of the alpha/beta-hydrolase superfamily, assigned to
  the ABHD14 family and carrying only a generic hydrolase EC number (3.-.-.-). No molecular function has
  been established for it: a 2023 study of the family states plainly that ABHD14A still lacks any functional
  annotation. It is closely related in sequence to ABHD14B, which is a lysine deacetylase, and that similarity
  is a documented hazard - automated databases frequently assign the two proteins the same function, which
  is why sequence determinants distinguishing them had to be defined explicitly. UniProt places ABHD14A
  in the cytoplasm and in membranes and offers only a by-similarity suggestion of a role in granule neuron
  development, which derives from work on the rodent ortholog Dorz1, a transcript expressed in differentiating
  cerebellar granule neurons and positively regulated by the transcription factor Zic1. Whether the protein
  has any function in that setting has not been tested.'
