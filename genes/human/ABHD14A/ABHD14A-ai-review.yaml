description: 'ABHD14A is an uncharacterised member of the alpha/beta-hydrolase superfamily, assigned to
  the ABHD14 family and carrying only a generic hydrolase EC number (3.-.-.-). No molecular function has
  been established for it: a 2023 study of the family states plainly that ABHD14A still lacks any functional
  annotation. It is closely related in sequence to ABHD14B, which is a lysine deacetylase. UniProt places
  ABHD14A in the cytoplasm and in membranes, annotating it as a single-pass type II membrane protein with
  a signal-anchor helix at residues 35-55 and N-glycosylation at 67 and 201 - a topology that would put
  its hydrolase domain on the lumenal side and that distinguishes it from the soluble ABHD14B. It offers
  only a by-similarity suggestion of a role in granule neuron development, which derives from work on
  the rodent ortholog Dorz1, a transcript expressed in differentiating cerebellar granule neurons and
  positively regulated by the transcription factor Zic1. Whether the protein has any function in that
  setting has not been tested.'
existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: 'Phylogenetic inference that ABHD14A is active in the cytoplasm. Accepted, but with the contrary
      features on record rather than passed over.


      Topology, which the paralog framing must not obscure: UniProt annotates ABHD14A as a single-pass
      type II membrane protein with a signal-anchor transmembrane helix at 35-55 and N-glycosylation sites
      at 67 and 201. Type II topology with glycosylated residues C-terminal to the anchor places the hydrolase
      domain on the lumenal or extracellular side, not free in the cytosol. ABHD14B, by contrast, is soluble.
      So the two proteins are not interchangeable even at the level of where they sit, and ''the family
      behaves this way'' is not a reason to accept a cytoplasmic call for this one.


      The IBA is nonetheless retained: it is evidence independent of the by-similarity UniProt call, and
      a type II membrane protein does present a short cytosolic N-terminal tail, so a cytoplasmic assignment
      is not incompatible with the topology. What the IBA does not establish is where the catalytic domain
      faces - which is the question that matters for this gene, and which the excluded preprint''s Golgi
      result would bear on.'
    action: ACCEPT
    supported_by:
    - reference_id: file:human/ABHD14A/ABHD14A-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cytoplasm {ECO:0000250}. Membrane {ECO:0000305};'
    - reference_id: file:human/ABHD14A/ABHD14A-uniprot.txt
      supporting_text: Single-pass type II membrane protein {ECO:0000305}.
