- id: file:human/ABHD14A/ABHD14A-deep-research-affinage.md
  title: Affinage mechanistic annotation for ABHD14A (human)
  findings: []
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: 'Machine-fetched Affinage record. Gates passed, but it must not be used as it stands,
      for a reason worth recording for the whole campaign: its two most substantive claims - that a truncated
      ABHD14A hydrolyses short-chain esters with CoA enhancement, and that the full-length protein localises
      to the Golgi - both cite ''PMID:bio_10.1101_2025.11.28.691245'', which is not a PubMed identifier
      at all but a bioRxiv DOI encoded in a PMID-shaped field. The provider''s citation slot can therefore
      contain non-PMID identifiers formatted to look like PMIDs, and a reader skimming for PMIDs would
      take preprint claims for peer-reviewed ones. Those claims are excluded here; if the preprint is
      published they would justify a hydrolase molecular function and a Golgi location, neither of which
      is annotated now.'
