suggested_questions:
- question: 'What does ABHD14A do? The 2023 family study states directly that it still lacks any functional
    annotation, and that remains true: UniProt assigns only a generic EC 3.-.-.- and a by-similarity guess
    at a role in granule neuron development. No substrate, no reaction and no phenotype has been established
    for the human protein.'
- question: Which side of the membrane does the hydrolase domain face? UniProt annotates a signal-anchor
    at 35-55 with single-pass type II topology and N-glycosylation at 67 and 201, which together place
    the catalytic domain lumenally or extracellularly - unlike the soluble ABHD14B. That prediction is
    ECO:0000255 and untested, but it would determine what substrates the protein could reach and would
    reconcile with the Golgi localisation reported in the excluded preprint.
- question: Is ABHD14A being confused with ABHD14B? This is the specific hazard for this gene rather than
    a general caution. ABHD14B is a lysine deacetylase, sequence similarity between the two is high, and
    PMID:37974539 was written because automated databases frequently assign them the same function. Any
    future functional annotation on ABHD14A should be checked against the sequence determinants that paper
    defines, and any transfer from ABHD14B should be treated as a paralog transfer, not an ortholog one.
- question: Is the granule-neuron connection about the protein or only the transcript? The link comes
    from Dorz1, a rodent transcript expressed in differentiating cerebellar granule neurons and regulated
    by Zic1. That is expression biology - being downstream of a transcription factor is not participation
    in a process - and no ABHD14A protein-level experiment in neurons has been reported.
- question: Is the protein expressed at all? A recent preprint reports that endogenous ABHD14A is undetectable
    across immortalized cell lines and adult mouse tissues despite transcriptomic predictions. If that
    holds under peer review it would reframe the whole gene, and would explain why no function has been
    found.
suggested_experiments:
- hypothesis: ABHD14A is a serine hydrolase with a substrate preference distinguishable from ABHD14B.
  description: Profile recombinant ABHD14A against ABHD14B with activity-based protein profiling and a
    broad ester and thioester substrate panel, using the sequence determinants from PMID:37974539 to confirm
    construct identity, so that any activity found is attributable to ABHD14A rather than to contaminating
    or misassigned paralog.
  experiment_type: enzymology
- hypothesis: Endogenous ABHD14A protein is expressed in a restricted setting rather than not at all.
  description: Raise or validate an antibody against a region divergent from ABHD14B and survey developing
    cerebellum, where the Dorz1 transcript is enriched, alongside the adult tissues where the protein
    has been reported undetectable. A negative result across development would be as informative as a
    positive one.
  experiment_type: expression analysis
- hypothesis: ABHD14A has a function in cerebellar granule neuron differentiation.
  description: Knock out Abhd14a in mouse and examine cerebellar granule neuron precursor proliferation,
    differentiation and migration, comparing with the Zic1 phenotype to test whether the gene does anything
    downstream of the transcription factor that regulates it.
  experiment_type: mouse genetics
