- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IDA
  original_reference_id: PMID:2550068
  qualifier: located_in
  review:
    summary: PLCG1 is a soluble cytosolic enzyme in resting cells and is recruited to membranes only upon
      receptor activation.
    action: ACCEPT
    reason: Cytosol is the resting location of PLCG1, from which it is recruited via SH2 domains to phosphorylated
      receptors at the plasma membrane; consistent with the biochemical purification of a cytosolic PLC-gamma
      form and with live-cell translocation studies. The cited paper (abstract-only in cache) resolved
      cytosolic phosphoinositide-specific PLC forms from human platelets; we defer to the curator for
