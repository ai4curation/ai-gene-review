    id: GO:0048008
    label: platelet-derived growth factor receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:1396585
  qualifier: involved_in
  review:
    summary: PLCG1 binds PDGFRB pY1009/pY1021 via its SH2 domains and is tyrosine phosphorylated and activated by
      the receptor.
    action: NEW
    reason: PLCG1 is the catalytic PIP2-hydrolysing effector of PDGFR signalling; PDGFR is a core receptor context
      alongside EGFR, FGFR and VEGFR2.
    supported_by:
    - reference_id: PMID:1396585
      supporting_text: tyrosine phosphorylation of PLC-gamma is dependent on autophosphorylation of the PDGF beta-receptor
        at Tyr1009 and Tyr1021
    - reference_id: PMID:15641795
      supporting_text: is activated when its C-terminal SH2 domain (PLCC) binds the phosphorylated Tyr-1021 site
        (pTyr-1021) in the beta-platelet-derived growth factor receptor (PDGFR)
- term:
    id: GO:0048010
    label: vascular endothelial growth factor receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:11387210
  qualifier: involved_in
  review:
    summary: PLC-gamma binds phospho-Y1175 of KDR/VEGFR2 through its C-terminal SH2 domain, is tyrosine phosphorylated
      in a Y1175-dependent manner and drives the PLC-gamma-PKC-MAPK route to endothelial DNA synthesis.
    action: NEW
    reason: 'Lead from the falcon deep research report, checked against the primary paper. PLCG1 performs a step
      of VEGFR2 signalling (PIP2 hydrolysis generating the DAG that activates PKC and the Raf-MEK-ERK route), so
      it passes the participation test in the same way as the existing EGFR term and the proposed FGFR/PDGFR terms;
      the core-function text already names VEGFR2 as a core receptor context. Comparator check: other VEGFR2 effectors
      (PRKCB, PRKD1/2, PTK2, SRC, FYN, VAV1) carry GO:0048010 in human GOA, so the term is used for signalling effectors.
      Caveat: the study expressed human KDR in mouse and bovine endothelial cells and detected endogenous PLC-gamma
      with a pan-PLC-gamma antibody; PLCG1 is the predominant endothelial PLC-gamma isoform, but a human-cell PLCG1-specific
      experiment would be stronger.'
    supported_by:
    - reference_id: PMID:11387210
      supporting_text: the C-terminal SH2 domain of PLC-γ is directly associated with the phosphorylated Y1175 on
        KDR/Flk-1
    - reference_id: PMID:11387210
      supporting_text: the PY1175 site is the single major PLC-γ-binding site on KDR
