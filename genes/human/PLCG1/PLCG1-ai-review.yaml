suggested_questions:
- question: Should the rat-derived ISS annotations for guanyl-nucleotide exchange factor activity (dynamin-1)
    and lysophospholipase C activity be retained for human PLCG1 without human evidence?
- question: How much of PLCG1's contribution to mitogenesis and migration is lipase-independent (SH3/SH2
    scaffolding) versus dependent on PIP2 hydrolysis, and should lipase-independent roles be captured
    with separate MF terms?
- question: Which receptor contexts (EGFR, FGFR, PDGFR, VEGFR2, TCR) should be treated as core pathway
    annotations for PLCG1, given its broad use as a common RTK/immune receptor effector?
- question: Is the IDA COP9 signalosome annotation from the Tespa1 study (PMID:22561606) a mis-mapping
    of 'TCR signalosome', and should the source curator be contacted?
- question: Does human PLCG1 have physiologically relevant lysophospholipase C activity, as transferred by ISS from
    rat?
- question: Should the non-catalytic, SH2/SH3-mediated cross-linking of phospho-LAT and SOS1 that promotes LAT condensate
    formation and shields LAT from CD45 (PMID:33929486, largely in vitro reconstitution) be captured as a separate
    scaffold-type molecular function, and how much does it contribute to TCR signalling relative to PIP2 hydrolysis
    in primary T cells?
- question: Review-level sources summarised in deep research place PLCG1 at focal adhesions (with GIT1, beta-PIX
    and FAK) and describe a nuclear ~120 kDa PLCG1 fragment. Is there primary human evidence strong enough to support
    focal adhesion or nucleus localization annotations?
- question: Deep research describes AKT as an SH3-domain binding partner of PLCG1, whereas the cited interaction
    evidence here was read as PLCG1 being an AKT1 substrate. Is there a direct SH3-dependent PLCG1-AKT interaction?
suggested_experiments:
- hypothesis: The FGFR pY766 docking site is the sole route for PLCG1 activation downstream of FGFR in
    human cells.
  description: Compare PLCG1 Tyr783 phosphorylation, IP1 accumulation and Ca2+ flux after FGF stimulation
    in isogenic human cells expressing wild-type or Y766F FGFR1, with and without PLCG1 nSH2/cSH2 point
    mutants.
  experiment_type: isogenic mutational signaling assay
- hypothesis: Human PLCG1 SH3 domain has GEF activity toward dynamin-1.
  description: Test purified human PLCG1 SH3 domain and full-length protein for DNM1 GDP/GTP exchange
    in vitro, and assess endocytosis in PLCG1-null human cells rescued with lipase-dead versus SH3-mutant
    PLCG1.
  experiment_type: in vitro GEF assay and rescue
- hypothesis: Disease-associated activating PLCG1 variants (S345F, S1021F) act by weakening cSH2-C2 autoinhibition.
  description: Measure basal and receptor-stimulated PIP2 hydrolysis of purified variants on liposomes
    and relate to HDX-MS/structural changes at the cSH2-C2 interface.
  experiment_type: biochemical and structural variant analysis
- description: Rescue PLCG1-knockout cells with lipase-dead (e.g. catalytic H335A) versus SH3-mutant PLCG1 to separate
    lipase-dependent from SH3/GEF-dependent outputs in EGF-induced migration and mitogenesis.
- description: Assay recombinant human PLCG1 against lysophosphatidylinositol and other lysophospholipids to test
    the ISS-transferred lysophospholipase C activity.
- description: Reconstitute PLCG1-deficient Jurkat T cells with lipase-dead, nSH2-mutant, cSH2-mutant and SH3-mutant
    PLCG1 and measure LAT microcluster size, LAT Y132 phosphorylation, Ca2+ flux and ERK activation, to separate
    the condensate-scaffold role from PIP2 hydrolysis.
- description: Knock down PLCG1 in human endothelial cells (HUVEC) and test VEGF-A-induced IP3/Ca2+, PKC and ERK
    activation and DNA synthesis, with rescue by wild-type versus SH2-mutant PLCG1, to confirm the isoform-specific
    role downstream of KDR pY1175.
