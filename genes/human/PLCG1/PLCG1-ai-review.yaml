id: P19174
gene_symbol: PLCG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Phospholipase C-gamma-1 (PLCG1) is a ubiquitously expressed, cytosolic phosphoinositide-specific phospholipase
  C that hydrolyses phosphatidylinositol 4,5-bisphosphate (PI(4,5)P2) at the inner leaflet of the plasma membrane
  to generate the second messengers inositol 1,4,5-trisphosphate (IP3), which releases Ca2+ from ER stores, and
  diacylglycerol (DAG), which activates protein kinase C and RasGRP. Besides the conserved PLC core (PH domain,
  EF-hands, split X/Y TIM-barrel catalytic domain, C2 domain), PLCG1 carries a gamma-specific regulatory array (split
  PH, tandem nSH2-cSH2, SH3) inserted between X and Y. In resting cells the cSH2 domain holds the enzyme autoinhibited;
  the nSH2 domain docks onto phosphotyrosines of activated receptor tyrosine kinases (EGFR, PDGFR, FGFR pY766, VEGFR2,
  TRK, RET, ALK) or of adaptors such as LAT and SLP-76 in T cells, after which phosphorylation of Tyr783 releases
  autoinhibition and permits membrane engagement and catalysis. PLCG1 thereby couples growth factor and antigen
  receptors to Ca2+ and PKC signaling, with downstream roles in cell migration, proliferation, angiogenesis and
  T cell activation. The SH3 domain also mediates lipase-independent scaffolding interactions. In T cells its SH2
  domains also cross-link phospho-LAT into phase-separated signalling clusters and shield LAT from dephosphorylation
  by CD45. Somatic activating mutations occur in T cell lymphomas and angiosarcoma, and a germline gain-of-function
  variant causes immune dysregulation with autoimmunity and autoinflammation.
