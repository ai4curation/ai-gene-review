- term:
    id: GO:0005168
    label: neurotrophin TRKA receptor binding
  evidence_type: IPI
  original_reference_id: PMID:15488758
  qualifier: enables
  supporting_entities:
  - UniProtKB:P04629
  review:
    summary: IPI with NTRK1 (TrkA) from a study of the TrkAIII splice variant in neuroblastoma.
    action: KEEP_AS_NON_CORE
    reason: PLCG1 is a well-established SH2-domain effector of Trk receptors (pY785 in TrkA), so the binding
