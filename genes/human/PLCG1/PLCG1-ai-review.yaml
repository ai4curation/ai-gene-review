core_functions:
- description: Receptor-activated phosphatidylinositol 4,5-bisphosphate phospholipase C activity generating
    IP3 and DAG at the plasma membrane, coupling growth-factor receptor tyrosine kinase signalling (EGFR,
    FGFR, PDGFR, VEGFR2) to Ca2+ release and DAG/PKC signalling.
  molecular_function:
    id: GO:0004435
    label: phosphatidylinositol-4,5-bisphosphate phospholipase C activity
  directly_involved_in:
  - id: GO:0048015
    label: phosphatidylinositol-mediated signaling
  - id: GO:0007173
    label: epidermal growth factor receptor signaling pathway
  - id: GO:0008543
    label: fibroblast growth factor receptor signaling pathway
  - id: GO:0048008
    label: platelet-derived growth factor receptor signaling pathway
  - id: GO:0051209
    label: release of sequestered calcium ion into cytosol
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0032587
    label: ruffle membrane
  supported_by:
  - reference_id: PMID:37422272
    supporting_text: hydrolyzes phosphatidylinositol 4,5-bisphosphate (PIP2) to produce critical second
      messengers, including diacylglycerol (DAG) and inositol-1,4,5-trisphosphate (IP3)
  - reference_id: PMID:23063561
    supporting_text: In the context of fibroblast growth-factor receptor signaling, the coordinated involvement
      of nSH2 and cSH2 domains mediates efficient phosphorylation of PLCγ1
  - reference_id: PMID:22454520
    supporting_text: Downregulation of PLCγ1 also inhibited the EGF-mediated calcium increase in PC3
- description: PIP2 hydrolysis downstream of the T cell antigen receptor (and other immunoreceptors) after
    SH2-mediated recruitment to phospho-LAT and ITK-mediated phosphorylation, driving Ca2+/NFAT and DAG-dependent
    T cell activation signals.
  molecular_function:
    id: GO:0004435
    label: phosphatidylinositol-4,5-bisphosphate phospholipase C activity
  directly_involved_in:
  - id: GO:0050852
    label: T cell receptor signaling pathway
  - id: GO:0019722
    label: calcium-mediated signaling
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:10811803
    supporting_text: Grb2, Gads, and phospholipase C (PLC)-gamma1 bind LAT via Src homology-2 domains
  - reference_id: PMID:28598420
    supporting_text: The subsequent recruitment of interleukin-2-induced tyrosine kinase (Itk) triggers
      the tyrosine phosphorylation and activation of PLC-γ1, which hydrolyses phosphatidylinositol-4,5-bisphosphate
      (PIP2) to produce the second messengers diacylglycerol (DAG) and inositol 1,4,5-trisphosphate (IP3).
- description: SH2-domain recognition of phosphotyrosine docking sites on activated receptor tyrosine
    kinases and adaptors (EGFR, PDGFRB, FGFR1, LAT, BLNK), which recruits PLCG1 for activating phosphorylation.
  molecular_function:
    id: GO:0001784
    label: phosphotyrosine residue binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:1656221
    supporting_text: tyrosine-phosphorylated wild-type FGFR or its cytoplasmic domain becomes associated
      with intact PLC-gamma or with a fusion protein containing the SH2 domain of PLC-gamma
  - reference_id: PMID:11331309
    supporting_text: The translocation of PLC gamma to the plasma membrane required the functional Src
      homology 2 domains
suggested_questions:
- question: Is the COP9 signalosome IDA (PMID:22561606) a mis-mapping of the TCR/LAT 'signalosome' concept
    rather than evidence for PLCG1 in the CSN complex?
- question: Does human PLCG1 have physiologically relevant lysophospholipase C activity, as transferred
    by ISS from rat?
- question: How much of PLCG1's reported lipase-independent functions (SH3-mediated GEF activity toward
    dynamin-1/RAC1, lipase-independent mitogenesis) is reproducible in endogenous settings?
suggested_experiments:
- description: Rescue PLCG1-knockout cells with lipase-dead (e.g. catalytic H335A) versus SH3-mutant PLCG1
    to separate lipase-dependent from SH3/GEF-dependent outputs in EGF-induced migration and mitogenesis.
- description: Assay recombinant human PLCG1 against lysophosphatidylinositol and other lysophospholipids
    to test the ISS-transferred lysophospholipase C activity.
