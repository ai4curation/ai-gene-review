- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10811803
  qualifier: enables
  supporting_entities:
  - UniProtKB:O43561
  review:
    summary: IPI 'protein binding' from PMID:10811803. The reported interaction is mediated by a PLCG1
      SH2 domain engaging a phosphotyrosine on the partner (activated receptor tyrosine kinase or adaptor),
      the canonical mechanism by which PLCG1 is recruited to activated signaling complexes.
    action: MODIFY
    reason: Generic 'protein binding' is uninformative. The cited study specifically shows phosphotyrosine-dependent
      SH2-domain binding, which is captured by GO:0001784 phosphotyrosine residue binding. This SH2/pTyr
      recruitment is how PLCG1 couples to receptor tyrosine kinases (e.g. FGFR1 pY766, PDGFRB pY1021,
      EGFR) and to LAT/SYK in immune receptor signaling.
    proposed_replacement_terms:
    - id: GO:0001784
      label: phosphotyrosine residue binding
    supported_by:
    - reference_id: PMID:10811803
      supporting_text: Upon T cell activation, LAT becomes highly phosphorylated on tyrosine residues,
        and Grb2, Gads, and phospholipase C (PLC)-gamma1 bind LAT via Src homology-2 domains.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10873601
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q13470
  review:
    summary: IPI 'protein binding' from PMID:10873601. The interaction may well be real (PLCG1 has many
      partners through its SH2, SH3 and split-PH domains), but the annotation conveys no functional information.
    action: REMOVE
    reason: Generic 'protein binding' is uninformative per project and GO guidelines; removal does not
      dispute the reported interaction. Where the partner recognition is phosphotyrosine/SH2-mediated
      and demonstrated in the cited study, it is captured elsewhere in this review as GO:0001784 phosphotyrosine
      residue binding; the core activity is GO:0004435.
