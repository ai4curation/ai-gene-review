- term:
    id: GO:0008543
    label: fibroblast growth factor receptor signaling pathway
  evidence_type: IGI
  original_reference_id: PMID:1379697
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P11362
  review:
    summary: PLCG1 is recruited via its nSH2 domain to FGFR1 pY766 (conserved in FGFR2-4), phosphorylated
      by the receptor kinase and hydrolyses PIP2; mutation of Y766 abolishes FGF-induced PI turnover and
      Ca2+ flux.
    action: NEW
    reason: 'PLCG1 performs a catalytic step of the FGFR pathway (second-messenger generation), so it
      passes the participation test; it is not merely a substrate or a requirement. Comparator check:
      PLCG1 already carries GO:0007173 EGFR signaling pathway for the same effector role, and FRS2, the
      other direct FGFR-docked effector, carries GO:0008543 (IGI/IBA). Neither human, mouse nor rat PLCG1
      currently carries GO:0008543, which appears to be a gap rather than a convention, given that the
      analogous EGFR term is annotated. Note that FGFR-driven mitogenesis does not require the PLCG1 branch.
      Evidence code is IGI with FGFR1 (UniProtKB:P11362) as the interacting gene, because the perturbation in
      PMID:1379697 is the FGFR1 Y766F mutation, not a mutation in PLCG1.'
    supported_by:
    - reference_id: PMID:1379697
      supporting_text: a fibroblast growth factor (FGF) receptor with a single point mutation at residue
        766 replacing tyrosine with phenylalanine fails to associate with PLC gamma in response to FGF
    - reference_id: PMID:23063561
      supporting_text: the requirement of a single phosphorylated tyrosine (pY766 for FGFR1) in the unstructured
        receptor C-terminal tail has been shown to be necessary and sufficient for the recruitment of
