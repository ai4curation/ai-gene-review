id: P19174
gene_symbol: PLCG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PLCG1 encodes phospholipase C-gamma 1, a broadly expressed multidomain phosphoinositide-specific
  phospholipase C. In resting cells it is cytosolic and autoinhibited by its regulatory array (split PH,
  tandem nSH2-cSH2, SH3). Receptor tyrosine kinases (EGFR, PDGFRB, FGFR1-4, VEGFR2, NTRK1, KIT, MET) and,
  in T cells, the Tec kinase ITK after recruitment of PLCG1 to phospho-LAT, recruit it through SH2-phosphotyrosine
  interactions and phosphorylate Y783, relieving autoinhibition. Active PLCG1 hydrolyses plasma-membrane
  phosphatidylinositol 4,5-bisphosphate to inositol 1,4,5-trisphosphate, which releases Ca2+ from the
  ER, and diacylglycerol, which activates PKC and RasGRP. PLCG1 thus couples growth-factor, T cell antigen
  receptor and other immunoreceptor signalling to Ca2+/NFAT, PKC/NF-kB and ERK pathways, contributing
  to cell proliferation, migration, angiogenesis and T cell activation. Its SH3 domain also binds proline-rich
  partners and has reported lipase-independent GEF activity toward dynamin-1 and RAC1. Germline gain-of-function
  variants cause immune dysregulation, and somatic activating mutations occur in T cell lymphomas and
  angiosarcomas.
