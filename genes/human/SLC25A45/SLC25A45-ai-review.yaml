id: Q8N413
gene_symbol: SLC25A45
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC25A45 is a mitochondrial inner-membrane solute carrier that imports methylated
  basic amino acids, most notably N(6),N(6),N(6)-trimethyl-L-lysine and
  dimethylarginine, into mitochondria. Its trimethyllysine transport supplies
  the mitochondrial TMLHE step of endogenous L-carnitine biosynthesis, linking
  protein methyl-lysine catabolism to carnitine production in BBOX1-expressing
  cells and tissues.
