  qualifier: involved_in
  review:
    summary: SLC25A45 supplies mitochondrial trimethyllysine for de novo carnitine synthesis.
    action: NEW
    reason: >-
      SLC25A45 itself performs the inner-membrane import step that gives matrix
      TMLHE access to trimethyllysine; in BBOX1-expressing cells, SLC25A45 loss
      suppresses conversion of labeled trimethyllysine through deoxycarnitine to
      carnitine.
    supported_by:
    - reference_id: PMID:41075794
      supporting_text: >-
        Together, these results show that SLC25A45 is required for the de novo
        biosynthesis of carnitine in BBOX1-expressing cells
    - reference_id: PMID:41075780
      supporting_text: >-
        By facilitating mitochondrial TML import, SLC25A45 connects protein
        catabolism to carnitine production
