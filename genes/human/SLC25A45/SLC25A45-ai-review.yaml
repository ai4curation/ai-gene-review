knowledge_gaps:
- gap_statement: >-
    The identity of the SLC25A45-independent route that leaves residual
    trimethyllysine-to-deoxycarnitine flux in SLC25A45-null, BBOX1-positive
    cells remains unresolved.
  boundary: >-
    SLC25A45 is the major mitochondrial trimethyllysine transporter and its loss
    strongly suppresses de novo carnitine production, but Dias et al. still
    detected some deoxycarnitine synthesis from labeled TML in SLC25A45-knockout
    ovarian cancer cells.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Closing this gap would determine whether the residual flux is carried by a
    second mitochondrial transporter or by a cytosolic TML dioxygenase activity.
  resolution: >-
    Combine SLC25A45 knockout with candidate mitochondrial-carrier perturbations,
    subcellular isotope tracing, and TMLHE localization controls in endogenous
    BBOX1-positive liver or kidney models.
  provenance:
  - reference_id: PMID:41075794
    supporting_text: >-
      Interestingly, deoxycarnitine synthesis was not completely abolished in
      SLC25A45 KO cells, which may indicate the existence of another
      mitochondrial transporter capable of importing trimethyllysine or the
      presence of a cytosolic dioxygenase capable of hydroxylating
      trimethyllysine.
proposed_new_terms: []
suggested_questions:
- question: Which human tissues and conditions use SLC25A45-dependent dimethylarginine
    import for AGXT2-linked mitochondrial metabolism, and should that role be connected
    to a specific GO biological process?
- question: What SLC25A45-independent route leaves residual trimethyllysine-to-deoxycarnitine
    flux in SLC25A45-null BBOX1-positive cells?
suggested_experiments:
- description: Reconstitute purified human SLC25A45 into proteoliposomes to measure
    trimethyllysine, ADMA, and SDMA transport kinetics, directionality, and counter-exchange
    requirements directly.
- description: Quantify labeled trimethyllysine flux through TMLHE, downstream cytosolic
    carnitine-biosynthesis steps, and fatty-acid oxidation in endogenous BBOX1-positive
    human liver or kidney models after SLC25A45 knockout and wild-type or transport-dead
    rescue.
references:
- id: PMID:41075794
  title: SLC25A45 is required for mitochondrial uptake of methylated amino acids and
    de novo carnitine biosynthesis.
  findings:
  - statement: >-
      Human SLC25A45 is required for isolated mitochondria to import labeled
      trimethyllysine, ADMA and SDMA, does not measurably import unmethylated
      lysine or arginine, and is stabilized by the specific methylated substrates
      in nanoDSF assays.
  - statement: >-
      The R268A substrate-cavity mutant abolishes SLC25A45-dependent
      deoxycarnitine synthesis and dimethylarginine accumulation in SLC25A45-null
      AsPC-1 cells, linking the carnitine effect to transport activity.
  - statement: >-
      SLC25A45-FLAG localizes to mitochondria and co-purifies with
      mitochondrial inner-membrane proteins, supporting an inner-membrane site
      of action.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached full text and PubMed metadata were checked; the title and DOI match
      the UniProt RN [6] citation and the quoted transport/localization findings
      are present verbatim in the cached article.
- id: PMID:41075780
  title: Machine-learning-guided discovery of SLC25A45 as a mediator of mitochondrial
    methylated amino acid import and carnitine synthesis.
  findings:
  - statement: >-
      A machine-learning prioritization linked SLC25A45 to methylated basic amino
      acids, and follow-up tracing showed that SLC25A45 is needed for
      mitochondrial TML import in mammalian cells.
  - statement: >-
      Loss of SLC25A45 impairs carnitine production and fatty-acid oxidation in
      mice under fasting conditions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached full text and PubMed metadata were checked; the title and DOI match
      the UniProt RN [5] citation and the quoted TML/ADMA functional summary is
      present verbatim in the cached article.
