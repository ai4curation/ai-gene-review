proposed_new_terms: []
suggested_questions:
- question: >-
    Which human tissues and conditions use SLC25A45-dependent dimethylarginine
    import for AGXT2-linked mitochondrial metabolism, and should that role be
    connected to a specific GO biological process?
- question: >-
    What SLC25A45-independent route leaves residual trimethyllysine-to-deoxycarnitine
    flux in SLC25A45-null BBOX1-positive cells?
suggested_experiments:
- description: >-
    Reconstitute purified human SLC25A45 into proteoliposomes to measure
    trimethyllysine, ADMA, and SDMA transport kinetics, directionality, and
    counter-exchange requirements directly.
- description: >-
    Quantify labeled trimethyllysine flux through TMLHE, downstream cytosolic
    carnitine-biosynthesis steps, and fatty-acid oxidation in endogenous
    BBOX1-positive human liver or kidney models after SLC25A45 knockout and
    wild-type or transport-dead rescue.
