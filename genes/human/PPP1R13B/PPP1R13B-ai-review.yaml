id: Q96KQ4
gene_symbol: PPP1R13B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PPP1R13B encodes ASPP1, an ankyrin-repeat/SH3 ASPP-family protein that binds p53-family transcription factors and promotes their pro-apoptotic transcriptional program. ASPP1 is cytoplasmic with a nuclear fraction and shares the conserved C-terminal p53/p63/p73-binding module with ASPP2, but current human evidence supports its role in apoptosis-selective p53-family coactivation more strongly than ASPP2-specific perinuclear, adherens-junction or cell-cycle functions.'
existing_annotations:
- term:
    id: GO:0002039
    label: p53 binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001538228
  - UniProtKB:Q13625
  - WB:WBGene00000146
  review:
    summary: Accept p53 binding by ASPP1.
    action: ACCEPT
    reason: ASPP1 is the ASPP-family paralog that shares ASPP2's p53-family-binding C terminus, binds p53/p63/p73, and enhances pro-apoptotic p53-family transcription; the IBA and InterPro rows propagate this correct conserved function.
    supported_by:
    - reference_id: PMID:11684014
      supporting_text: ASPP proteins interact with p53 and specifically enhance p53-induced apoptosis but not cell cycle arrest.
    - reference_id: PMID:14729977
      supporting_text: By binding to p63 and p73 in vitro and in vivo, ASPP1 and ASPP2 stimulate the transactivation function of p63 and p73 on the promoters of Bax, PIG3, and PUMA but not mdm2 or p21(WAF-1/CIP1).
    - reference_id: file:human/PPP1R13B/PPP1R13B-deep-research-manual.md
      supporting_text: PPP1R13B encodes ASPP1, one of the pro-apoptotic ASPP proteins. Its strongest curated molecular function is binding p53-family transcription factors via the ASPP C-terminal ankyrin-repeat/SH3 module.
