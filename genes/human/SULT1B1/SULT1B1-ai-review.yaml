id: O43704
gene_symbol: SULT1B1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: "Cytosolic sulfotransferase of the SULT1 family that transfers the sulfonate group of\
  \ 3'-phosphoadenosine 5'-phosphosulfate (PAPS) to small phenolic acceptors and to iodothyronines.\
  \ Originally named iodothyronine sulfotransferase, it sulfates 3,3'-diiodothyronine, triiodothyronine,\
  \ reverse triiodothyronine and thyroxine with higher affinity than the phenol sulfotransferases\
  \ SULT1A1/SULT1A3, and it also conjugates simple phenols such as 1-naphthol and p-nitrophenol,\
  \ dietary flavonoids, gut-microbial phenols, and polycyclic aromatic hydrocarbons, for which\
  \ sulfation can be bioactivating rather than detoxifying. The enzyme is a soluble cytosolic protein,\
  \ expressed most highly in colon and small intestinal mucosa with lower levels in liver, kidney,\
  \ blood leukocytes and spleen, placing it at the first-pass barrier for orally absorbed phenolic\
  \ compounds. A common coding variant (L145V, frequent in people of African ancestry) alters PAP\
  \ affinity and turnover. Whether SULT1B1 additionally acts on protein substrates is disputed: a 2023\
  \ report described it as a histone sulfotransferase that sulfates tyrosine 99 of nascent histone H3,\
  \ but a 2025 Matters Arising reanalysing the original mass spectra and repeating the enzyme assay\
  \ found the spectra to fit a phosphotyrosine rather than a sulfotyrosine peptide and detected no\
  \ sulfation of recombinant histone H3 by recombinant SULT1B1; the exchange remains unresolved."
