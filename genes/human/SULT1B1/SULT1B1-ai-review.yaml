- id: PMID:36805701
  title: Histone tyrosine sulfation by SULT1B1 regulates H4R3me2a and gene transcription.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: "PubMed-verified (Nat Chem Biol 2023;19:855-864). The claim that SULT1B1 is a histone\
      \ sulfotransferase acting on H3 Tyr99 is formally contested by PMID:40890505, which reannotated\
      \ the original raw mass spectra as a phosphotyrosine peptide and found no sulfation of recombinant\
      \ histone H3.2 by recombinant SULT1B1. The authors replied (PMID:40890506) and an Author Correction\
      \ was published (PMID:40890508); the paper has not been retracted. Cited here only to document\
      \ the dispute - no GO annotation derives from it."
- id: PMID:40890505
  title: Mass spectrometry and enzyme assays refute histone tyrosine sulfation.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: "PubMed-verified (Nat Chem Biol 2025;21:1667-1670), full text available via PMC12978989.\
      \ A formal Matters Arising refuting PMID:36805701 on three independent grounds: sulfotyrosine\
      \ is too labile to give the 100% sulfate-retaining HCD fragments reported, the reported fragment\
      \ masses fit phosphotyrosine to <3 ppm versus 12.5-31.5 ppm for sulfotyrosine, and a recombinant\
      \ SULT1B1 assay that efficiently sulfated T3 gave no histone H3.2 sulfation. Marked DISPUTED rather\
      \ than VERIFIED because the original authors contest it in PMID:40890506, not because of any problem\
      \ with the citation."
