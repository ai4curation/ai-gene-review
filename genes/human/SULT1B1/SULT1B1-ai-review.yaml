core_functions:
- molecular_function:
    id: GO:0004062
    label: aryl sulfotransferase activity
  description: "SULT1B1 is a soluble cytosolic sulfotransferase that transfers the sulfonate group of\
    \ PAPS onto the hydroxyl of phenolic acceptors. Its characterised substrates are simple phenols\
    \ (1-naphthol, p-nitrophenol), dietary and microbial phenolics including flavonoids, polycyclic\
    \ aromatic hydrocarbons (where sulfation is bioactivating), and the iodothyronines T2, T3, rT3 and\
    \ T4, for which it has markedly higher affinity than the phenol sulfotransferases SULT1A1 and\
    \ SULT1A3. It does not act on steroids. Its expression pattern - highest in colon and small\
    \ intestinal mucosa, then liver, kidney and leukocytes - places this activity at the first-pass\
    \ barrier for ingested phenolic compounds and in peripheral thyroid hormone inactivation."
  directly_involved_in:
  - id: GO:0051923
    label: sulfation
  - id: GO:0018958
    label: phenol-containing compound metabolic process
  - id: GO:0042403
    label: thyroid hormone metabolic process
  - id: GO:0006805
    label: xenobiotic metabolic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:9463486
    supporting_text: "Expressed hST1B2 sulfates small phenols such as 1-naphthol and p-nitrophenol and\
      \ thyroid hormones, including 3,3'-diiodothyronine, triiodothyronine, reverse triiodothyronine,\
      \ and thyroxine."
  - reference_id: PMID:9443824
    supporting_text: These data indicate that the newly characterized sulfotransferases constitute a
      distinct ST1 subfamily of enzymes catalyzing the sulfation of T3 as a typical endogenous
      substrate in rats and humans.
  - reference_id: PMID:28084139
    supporting_text: Human cytosolic sulfotransferase 1B1 (SULT1B1) sulfates small phenolic compounds
      and bioactivates polycyclic aromatic hydrocarbons.
suggested_questions:
- question: "Does SULT1B1 sulfate any protein substrate at all? The 2023 report that it sulfates Tyr99\
    \ of nascent histone H3 (PMID:36805701) is formally contested by a 2025 Matters Arising (PMID:40890505),\
    \ which reannotated the original raw mass spectra as a phosphotyrosine rather than a sulfotyrosine\
    \ peptide, obtained no sulfate-retaining fragments from a synthetic sulfopeptide standard, and saw\
    \ no sulfation of recombinant histone H3.2 in an rhSULT1B1 assay that did efficiently sulfate T3.\
    \ The original authors replied (PMID:40890506) and an Author Correction was issued (PMID:40890508),\
    \ but nothing has been retracted. An independent laboratory repeating the in vitro sulfation assay\
    \ with orthogonal, sulfate-preserving fragmentation (ETD/EThcD or negative-mode ECD rather than\
    \ HCD) would settle it."
  experts: []
- question: "If H3Y99 sulfation is real, which enzyme writes it? PMID:36805701 assigns the activity to\
    \ SULT1B1, while PMID:41686426 (Cancer Res 2026) assigns the same mark to GAL3ST1 and reports that\
    \ SULT1B1 levels were unchanged under the conditions that induce the mark. These two attributions\
    \ are mutually inconsistent, and GAL3ST1 is a Golgi type II membrane protein whose catalytic domain\
    \ faces the lumen, not the cytosol where the substrate is said to be modified."
  experts: []
- question: "GO has a term for this claim - GO:0008476 protein-tyrosine sulfotransferase activity, with\
    \ GO:0006478 peptidyl-tyrosine sulfation on the process side - and in human it is currently annotated\
    \ only to TPST1 and TPST2. Should GO Consortium curators adopt a formal policy for contested molecular\
    \ functions of this kind, for example annotating with a NOT qualifier once a refutation of this\
    \ strength exists, rather than the current implicit policy of simply not curating either side?"
  experts: []
- question: "Is the GO:0006068 ethanol catabolic process annotation (IDA, PMID:23207770, assigned by\
    \ CAFA) supportable? That paper's summary names SULT1A1, SULT1A2, SULT1A3 and SULT1C4 as the ethanol-sulfating\
    \ enzymes among the eleven purified human SULTs assayed; SULT1B1 appears to have been a negative\
    \ in the same panel."
  experts: []
suggested_experiments:
- hypothesis: SULT1B1 does not catalyse sulfation of histone H3 Tyr99 or of any histone tyrosine.
  description: "Repeat the recombinant SULT1B1 + PAPS + histone H3 reaction using a sulfate-preserving\
    \ activation method for the MS readout - electron transfer dissociation (ETD/EThcD) in positive mode\
    \ or electron capture/detachment dissociation in negative mode - rather than HCD or ion-trap CID,\
    \ with a synthetic AYLVGLFEDTNLCAIHAK sulfopeptide and the corresponding phosphopeptide run as retention-time\
    \ and fragmentation standards on the same gradient, and with blank injections between runs to exclude\
    \ carryover. Include 3,3',5-triiodo-L-thyronine as the positive-control acceptor to demonstrate that\
    \ the enzyme preparation is active."
  experiment_type: in vitro enzyme assay with orthogonal tandem mass spectrometry
- hypothesis: The anti-H3Y99sulf antibody used in the disputed literature cross-reacts with H3Y99
    phosphorylation.
  description: "Dot-blot and immunoblot the antibody against a matched panel of synthetic H3 91-108 peptides\
    \ - unmodified, Y99-sulfated and Y99-phosphorylated - at equal loading, and repeat the cellular immunoblot\
    \ after lambda phosphatase treatment and after sulfatase or mild acid hydrolysis. A signal that collapses\
    \ with phosphatase but not with sulfatase treatment would show the cellular signal is phosphorylation."
  experiment_type: antibody specificity validation
- hypothesis: SULT1B1 is not a physiological ethanol sulfotransferase.
  description: "Assay purified recombinant SULT1B1 against an ethanol concentration series with [35S]PAPS\
    \ alongside SULT1A1 and SULT1C4 as positive controls, quantifying ethyl sulfate formation, and report\
    \ kcat/Km for each. This would confirm or retire the GO:0006068 annotation directly."
  experiment_type: comparative steady-state kinetics
