      shared LRCH4 mechanism.
- id: PMID:9799793
  title: 'Large-scale sequencing of two regions in human chromosome 7q22: analysis
    of 650 kb of genomic sequence around the EPO and CUTL1 loci reveals 17 genes.'
  full_text_unavailable: true
  findings:
  - statement: >-
      The chromosome 7q22 sequencing study identified the LRCH4 locus as a novel gene
      with weak sequence similarity to a neuronal leucine-rich-repeat protein.
    supporting_text: >-
      Two genes showed weak similarity to an insulin-like receptor and a neuronal
      protein with a leucine-rich amino-terminal domain.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      PubMed title and identifier are verified and the paper is relevant to discovery
      of the locus. However, it reports only weak sequence similarity to a neuronal
      protein and contains no developmental assay; it does not support the TAS claim
      that human LRCH4 is involved in nervous-system development.
- id: PMID:30523158
  title: Leucine-rich repeats and calponin homology containing 4 (Lrch4) regulates the
    innate immune response.
  full_text_unavailable: true
  findings:
  - statement: >-
      LRCH4 is described as a membrane protein with nine LRRs in a predicted
      ectodomain.
    supporting_text: >-
      Lrch4 is a membrane protein with nine LRRs in its predicted ectodomain.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      LRCH4 depletion attenuated cytokine induction by LPS and several other TLR
      ligands and reduced the in vivo innate response.
    supporting_text: >-
      Silencing Lrch4 attenuates cytokine induction by LPS and multiple other TLR
      ligands and dampens the in vivo innate immune response.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      LRCH4 promotes delivery of LPS into lipid-raft membrane microdomains.
    supporting_text: >-
      Lrch4 promotes proper docking of LPS in lipid raft membrane microdomains.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      LRCH4 depletion reduced cell-surface gangliosides and expression/surface display
      of the raft-resident LPS co-receptor CD14.
    supporting_text: >-
      We provide evidence that this is through regulation of lipid rafts as Lrch4
      silencing reduces cell surface gangliosides, a metric of raft abundance, as well
      as expression and surface display of CD14, a raft-resident LPS co-receptor.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      This is the decisive functional paper. Most mechanistic and in vivo experiments
      used mouse LRCH4 in RAW264.7 or primary macrophages/mice. The full text also reports
      direct siRNA depletion of endogenous human LRCH4 in HEK293 cells engineered with
      TLR4-MD2-CD14 or TLR2, which selectively reduced ligand-induced IL-8 but not the
      TNF-alpha response. The abstract cache is complete enough to support the findings
      above, but not the detailed human-cell assay description.
- id: PMID:30385858
  title: 'Impact of Escherichia coli K12 and O18:K1 on human platelets: Differential
    effects on platelet activation, RNAs and proteins.'
  findings:
  - statement: >-
      Human platelet LRCH4 RNA decreased after exposure to E. coli K12, with the change
      detected independently by two RNA-sequencing pipelines.
    supporting_text: >-
      For the RNAs of HMBS (logFC = +5.73), ATP2C1 (logFC = -3.13) and LRCH4
      (logFC = -4.07) changes were detectable by thromboSeq and Tuxedo pipelines.
    reference_section_type: ABSTRACT
  - statement: >-
      LRCH4 RNA and protein were detected in human platelets, while E. coli exposure did
      not visibly change LRCH4 protein abundance or molecular weight.
    supporting_text: >-
      By Western blot analysis we could demonstrate the presence of HMBS, ATP2C1 and
      LRCH4 proteins in platelets before and after E. coli K12 exposure
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Direct human platelet expression/response evidence with full text in the cache.
      It supports regulated LRCH4 abundance during bacterial exposure, but does not test
      whether LRCH4 causes platelet TLR signaling or establish its core mechanism.
- id: PMID:38383956
  title: Knockdown of LRCH4 Remodels Tumor Microenvironment Through Inhibiting YAP and
    TGF-β/Smad Signaling Pathway in Colorectal Cancer.
  full_text_unavailable: true
  findings:
  - statement: >-
      LRCH4 knockdown inhibited proliferation, migration and invasion of human HT29
      colorectal-cancer cells.
    supporting_text: >-
      Here, we reported that the knockdown of LRCH4 inhibited the proliferation,
      migration and invasion in HT29 cells.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      LRCH4 knockdown reduced YAP activity, reversed EMT-associated features and
      inhibited TGF-beta/Smad signaling in HT29 cells.
    supporting_text: >-
      The activity of Yes-Associated Protein (YAP), a transcription factor in the
      Hppo-YAP signaling pathway, was significantly inhibited by LRCH4-siRNA. LRCH4
      knockdown also reversed the EMT and regulated the expression of extracellular
      matrix (ECM) protein, Fibronectin and Collagen IV in HT29 cells. In addition, the
      TGF-β/Smad signaling pathway, as the downstream pathway of Yap, was also inhibited
      by LRCH4 knockdown.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Direct human cancer-cell perturbation evidence. It establishes context-specific
      effects in one colorectal-cancer cell line, but the abstract does not identify a
      direct biochemical target of LRCH4, so these phenotypes should remain non-core and
      should not be generalized to normal tissues.
