id: O75427
gene_symbol: LRCH4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRCH4 is a 683-amino-acid membrane protein with nine N-terminal leucine-rich
  repeats, a C-terminal calponin-homology domain, and a predicted transmembrane
  helix near its C terminus. Depletion of endogenous LRCH4 in human HEK293 cells
  engineered to express TLR2 or TLR4/MD-2/CD14 attenuates ligand-induced IL-8
  production while sparing the response to TNF-alpha. Mouse macrophage and in
  vivo studies further connect Lrch4 to signaling by several Toll-like receptors,
  LPS docking in membrane rafts, raft abundance, and CD14 surface display. Tagged
  human LRCH4 associates with DOCK6, DOCK7, and DOCK8 in HEK293T cells; in canine
  MDCK cells, expressed LRCH4 redistributes DOCK8 toward an endoplasmic-reticulum
  pattern. Human platelets contain LRCH4 RNA and protein, and LRCH4 knockdown
  alters YAP and TGF-beta/Smad outputs in a colorectal-cancer cell line. The
  molecular link between LRCH4, Toll-like-receptor signaling, membrane
  organization, and C-Dock proteins remains unresolved in native human immune
  cells.
