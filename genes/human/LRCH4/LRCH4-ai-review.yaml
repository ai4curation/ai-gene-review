  review:
    summary: >-
      Phylogenetic inference assigns LRCH4 activity in a PML body, but the
      supporting gene-product provenance includes LRCH4 itself and traces back
      to an IDA annotation whose cited paper localizes SAP25 rather than LRCH4.
    action: REMOVE
    reason: >-
      This IBA has no independent evidence for LRCH4 localization. PMID:16449650
      characterizes human SAP25 (UniProtKB:Q8TEE9), not LRCH4/O75427, and the
      target protein appears in its own WITH/FROM chain. The annotation therefore
      propagates a source miscitation through circular or redundant evidence.
