- id: PMID:32203420
  title: Systems analysis of RhoGEF and RhoGAP regulatory proteins reveals spatially
    organized RAC1 signalling from integrin adhesions.
  full_text_unavailable: true
  findings:
  - statement: >-
      The study systematically characterized RhoGEF/RhoGAP interaction networks and
      subcellular localization as spatial organizers of Rho signaling.
    supporting_text: >-
      Through a family-wide characterization of substrate specificities, interactomes
      and localization, we reveal at the systems level how RhoGEFs and RhoGAPs
      contextualize and spatiotemporally control Rho signalling.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed title and identifier are verified, and the publisher PDF was inspected.
      Anti-tag immunoprecipitation showed that LRCH4 binds DOCK6, DOCK7 and DOCK8 but
      not DOCK9, with the DOCK7 DHR2 fragment sufficient for binding. Imaging showed
      LRCH4 at the endoplasmic reticulum and recruitment of DOCK8 there; deleting the
      predicted LRCH4 transmembrane region moved LRCH4/DOCK8 toward the cell periphery.
      These are direct heterologous-cell interaction/localization results, not evidence
      for a stable endogenous complex or for a defined LRCH4-dependent Rho-GTPase output.
