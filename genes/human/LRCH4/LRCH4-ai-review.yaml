- id: PMID:30523158
  title: Leucine-rich repeats and calponin homology containing 4 (Lrch4) regulates the
    innate immune response.
  findings:
  - statement: >-
      Expressed human LRCH4 showed substantial plasma-membrane overlap in engineered
      HEK293 cells, especially at low-to-medium expression.
    supporting_text: >-
      Microscopy of GFP-Lrch4 in HEK293 cells reveals staining that includes a cytoplasmic-type
      pattern, but formal analysis indicates a high degree of overlap with the plasma membrane
      stain CellMask TM (Life Technologies) ( 22 ), in particular in cells with low-medium
      forced expression, consistent with substantial localization to the plasma membrane ( Fig. 1 E ).
    reference_section_type: RESULTS
  - statement: >-
      Mouse Lrch4 depletion attenuated cytokine induction by LPS and several other
      TLR ligands and reduced the innate response in vivo.
    supporting_text: >-
      Silencing Lrch4 attenuates cytokine induction by LPS and multiple other TLR
      ligands and dampens the in vivo innate immune response.
    reference_section_type: ABSTRACT
  - statement: >-
      Mouse Lrch4 promotes delivery of LPS into lipid-raft membrane microdomains.
    supporting_text: >-
      Lrch4 promotes proper docking of LPS in lipid raft membrane microdomains.
    reference_section_type: ABSTRACT
  - statement: >-
      Mouse Lrch4 depletion reduced cell-surface gangliosides and expression/surface
      display of the raft-resident LPS co-receptor CD14.
    supporting_text: >-
      We provide evidence that this is through regulation of lipid rafts as Lrch4
      silencing reduces cell surface gangliosides, a metric of raft abundance, as well
      as expression and surface display of CD14, a raft-resident LPS co-receptor.
    reference_section_type: ABSTRACT
  - statement: >-
      Depletion of endogenous human LRCH4 attenuated TLR2- and TLR4-dependent IL-8
      induction in engineered HEK293 cells without reducing the response to TNF-alpha.
    supporting_text: >-
      As shown in Fig. 2 G , Lrch4 siRNA attenuated IL-8 induction by both ligands in
      HEK293 cells, providing further support that the shRNA results in macrophages are
      unlikely to reflect off-target effects.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      This is the decisive functional paper. Most mechanistic and in vivo experiments
      used mouse LRCH4 in RAW264.7 or primary macrophages/mice. The full text also reports
      direct siRNA depletion of endogenous human LRCH4 in HEK293 cells engineered with
      TLR4-MD2-CD14 or TLR2, which selectively reduced ligand-induced IL-8 but not the
      TNF-alpha response. Full text is available in the project cache, and the species
      and assay contexts are separated in the findings above.
