  findings:
  - statement: >-
      Human platelet LRCH4 RNA decreased after exposure to E. coli K12, with the change
      detected independently by two RNA-sequencing pipelines.
    supporting_text: >-
      For the RNAs of HMBS (logFC = +5.73), ATP2C1 (logFC = -3.13) and LRCH4
      (logFC = -4.07) changes were detectable by thromboSeq and Tuxedo pipelines.
    reference_section_type: ABSTRACT
  - statement: >-
      LRCH4 RNA and protein were detected in human platelets, while E. coli exposure did
      not visibly change LRCH4 protein abundance or molecular weight.
    supporting_text: >-
      By Western blot analysis we could demonstrate the presence of HMBS, ATP2C1 and
      LRCH4 proteins in platelets before and after E. coli K12 exposure
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Direct human platelet expression/response evidence with full text in the cache.
      It supports regulated LRCH4 abundance during bacterial exposure, but does not test
      whether LRCH4 causes platelet TLR signaling or establish its core mechanism.
- id: PMID:38383956
  title: Knockdown of LRCH4 Remodels Tumor Microenvironment Through Inhibiting YAP and
    TGF-β/Smad Signaling Pathway in Colorectal Cancer.
  full_text_unavailable: true
  findings:
  - statement: >-
      LRCH4 knockdown inhibited proliferation, migration and invasion of human HT29
      colorectal-cancer cells.
    supporting_text: >-
      Here, we reported that the knockdown of LRCH4 inhibited the proliferation,
      migration and invasion in HT29 cells.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      LRCH4 knockdown reduced YAP activity, reversed EMT-associated features and
      inhibited TGF-beta/Smad signaling in HT29 cells.
    supporting_text: >-
      The activity of Yes-Associated Protein (YAP), a transcription factor in the
      Hppo-YAP signaling pathway, was significantly inhibited by LRCH4-siRNA. LRCH4
      knockdown also reversed the EMT and regulated the expression of extracellular
      matrix (ECM) protein, Fibronectin and Collagen IV in HT29 cells. In addition, the
      TGF-β/Smad signaling pathway, as the downstream pathway of Yap, was also inhibited
      by LRCH4 knockdown.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Direct human cancer-cell perturbation evidence. It establishes context-specific
      effects in one colorectal-cancer cell line, but the abstract does not identify a
      direct biochemical target of LRCH4, so these phenotypes should remain non-core and
      should not be generalized to normal tissues.
core_functions:
- description: >-
    LRCH4 makes a positive contribution to Toll-like-receptor signaling at the
    plasma membrane. Endogenous LRCH4 depletion in human HEK293 cells engineered
    with TLR2 or TLR4/MD-2/CD14 attenuated ligand-induced IL-8 while sparing the
    TNF-alpha response. Concordant mouse macrophage and in vivo experiments support
    a broader role across several surface and endosomal TLRs. The molecular activity
    is unresolved: mouse data connect Lrch4 to LPS docking, membrane-raft abundance,
    and CD14 display, but direct ligand binding and the relevance of C-Dock
    interactions to TLR signaling have not been established.
  directly_involved_in:
  - id: GO:0034123
    label: positive regulation of toll-like receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:30523158
    supporting_text: >-
      As shown in Fig. 2 G , Lrch4 siRNA attenuated IL-8 induction by both ligands
      in HEK293 cells, providing further support that the shRNA results in macrophages
      are unlikely to reflect off-target effects.
  - reference_id: PMID:30523158
    supporting_text: >-
      Confirming some selectivity for Lrch4 function, Lrch4 silencing did not affect
      induction of IL-8 by HEK293 cells in response to stimulation with TNFα ( Fig. 2 H ).
  - reference_id: PMID:30523158
    supporting_text: >-
      Microscopy of GFP-Lrch4 in HEK293 cells reveals staining that includes a cytoplasmic-type
      pattern, but formal analysis indicates a high degree of overlap with the plasma membrane
      stain CellMask TM (Life Technologies) ( 22 ), in particular in cells with low-medium
      forced expression, consistent with substantial localization to the plasma membrane ( Fig. 1 E ).
knowledge_gaps:
- gap_statement: >-
    The molecular activity by which LRCH4 augments Toll-like-receptor signaling is
    unknown: it has not been established whether LRCH4 binds LPS directly, changes
    membrane-lipid organization, controls CD14 trafficking, or acts through another
    receptor-proximal component.
  boundary: >-
    Endogenous LRCH4 depletion selectively reduced TLR2- and TLR4-dependent IL-8
    induction in engineered human HEK293 cells, while mouse experiments linked Lrch4
    depletion to reduced raft abundance, CD14 surface display, and LPS docking. The
    LPS pulldown did not distinguish a direct from an indirect association.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Without a defined molecular activity, the TLR role cannot be represented as a
    mechanistic molecular-function assertion or separated cleanly from secondary
    changes in membrane organization.
  resolution: >-
    Reconstitute LPS, CD14, MD-2, TLR4, and LRCH4 interactions with purified or
    compositionally defined membrane systems, combined with crosslinking and
    quantitative lipid analysis, to distinguish direct ligand binding from effects on
    receptor trafficking or membrane-raft organization.
- gap_statement: >-
    It is unknown whether LRCH4 is required for Toll-like-receptor responses in native
    primary human immune cells and whether the ligand range observed in mouse systems
    is conserved in humans.
  boundary: >-
    Direct human evidence is limited to TLR2- or TLR4-engineered HEK293 cells, whereas
    the broad ligand panel, macrophage mechanism, and in vivo innate-response phenotype
    were established chiefly in mouse cells and mice.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Establishing physiological human-cell relevance is necessary to define the native
    cell types and ligand breadth of the conserved TLR-regulatory role and to decide
    whether raft assembly is a primary LRCH4 process or a mouse-context phenotype.
  resolution: >-
    Generate LRCH4 loss-of-function and rescue series in primary human monocytes,
    macrophages, and dendritic cells, then compare proximal signaling and cytokine
    responses across a controlled panel of TLR ligands.
- gap_statement: >-
    The endogenous subcellular distribution, membrane orientation, and trafficking
    itinerary of human LRCH4 are unknown.
  boundary: >-
    Human LRCH4 contains a predicted C-terminal transmembrane helix, transferred mouse
    annotations place it at the plasma membrane, and overexpressed human LRCH4 has been
    imaged at the endoplasmic reticulum. None of these observations establishes the
    topology or steady-state distribution of endogenous human LRCH4.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Sidedness and compartment determine whether the leucine-rich repeats could contact
    extracellular ligands, luminal cargo, or cytosolic signaling partners and therefore
    constrain the possible TLR mechanism.
  resolution: >-
    Endogenously tag LRCH4 in human immune cells and combine surface biotinylation,
    protease protection, glycosylation mapping, pulse-chase trafficking, and quantitative
    microscopy before and after TLR stimulation.
- gap_statement: >-
    The physiological significance of LRCH4 binding to DOCK6, DOCK7, and DOCK8 is
    unknown, including which Rho GTPase output is affected and whether the interaction
    contributes to Toll-like-receptor or membrane-raft phenotypes.
  boundary: >-
    Tagged human LRCH4 reproducibly bound the C-Dock proteins in transfected-cell assays
    and recruited DOCK8 to an endoplasmic-reticulum pattern, but no endogenous stable
    complex, downstream GTPase, or genetic connection to the TLR phenotype has been shown.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this connection would determine whether the C-Dock interactions are a
    function-defining signaling module or context-dependent binding without a shared
    physiological output.
  resolution: >-
    Map the LRCH4-C-Dock interface, test endogenous interaction in immune cells, and use
    separation-of-function LRCH4 mutants with DOCK6/7/8 perturbation and spatial Rho-GTPase
    biosensors during TLR stimulation.
proposed_new_terms: []
suggested_questions:
- question: >-
    Does endogenous LRCH4 support TLR2, TLR4, or additional TLR pathways in primary
    human innate-immune cells, and is its effect restricted to selected signaling outputs?
- question: >-
    Does LRCH4 contact LPS, CD14, MD-2, or a TLR directly, or does it act indirectly by
    changing membrane-lipid composition or receptor trafficking?
- question: >-
    Where is endogenous human LRCH4 located, what is its membrane topology, and does TLR
    stimulation alter its distribution?
- question: >-
    Do DOCK6, DOCK7, or DOCK8 mediate an LRCH4-dependent Rho-GTPase response, and is that
    module required for the TLR phenotype?
- question: >-
    Are any human LRCH4 transcript products physiologically expressed as functionally
    distinct membrane-bound or soluble forms?
suggested_experiments:
- hypothesis: >-
    LRCH4 selectively amplifies receptor-proximal TLR2 and TLR4 signaling in primary
    human innate-immune cells.
  description: >-
    Create independent LRCH4 knockouts in primary-cell-derived macrophages or validated
    human monocyte models, rescue with CRISPR-resistant LRCH4, and measure receptor-proximal
    phosphorylation, NF-kappa-B and IRF activation, and cytokine output after matched TLR2,
    TLR4, and control cytokine stimulation.
  experiment_type: Genetic perturbation, rescue, and signaling time course
- hypothesis: >-
    LRCH4 affects LPS responsiveness by controlling CD14/TLR4 membrane organization rather
    than by functioning as a direct LPS receptor.
  description: >-
    Quantify CD14 and TLR4 surface delivery, receptor nanoclustering, detergent-independent
    membrane-domain partitioning, and lipid composition after LRCH4 loss and rescue; in
    parallel, test purified LRCH4 extracellular regions for saturable LPS binding with
    stringent lipid and co-receptor controls.
  experiment_type: Surface trafficking, super-resolution imaging, lipidomics, and binding assays
- hypothesis: >-
    The C-terminal hydrophobic segment anchors LRCH4 with a reproducible topology and
    controls stimulus-dependent movement between the endoplasmic reticulum and cell surface.
  description: >-
    Introduce small endogenous tags on both sides of the predicted transmembrane segment,
    then combine selective permeabilization, extracellular labeling, protease protection,
    glycosylation-site mapping, and pulse-chase imaging in human immune cells.
  experiment_type: Endogenous tagging and membrane-topology analysis
- hypothesis: >-
    A specific LRCH4-C-Dock interaction is required for spatial Rho-GTPase activation and
    contributes to LRCH4-dependent TLR signaling.
  description: >-
    Define interaction-deficient LRCH4 mutants by domain mapping, confirm endogenous
    binding, and compare wild-type and separation-of-function rescue using DOCK6/7/8
    perturbations, RAC1/CDC42/RHOA biosensors, and TLR-induced cytokine readouts.
  experiment_type: Interaction mapping, epistasis, and live-cell biosensors
- hypothesis: >-
    Human immune cells express a regulated LRCH4 transcript or protein form with a distinct
    membrane association state.
  description: >-
    Perform long-read transcript sequencing, isoform-resolved proteomics, and C-terminal
    peptide mapping across resting and TLR-stimulated primary human immune-cell types before
    testing any reproducibly detected products in topology and rescue assays.
  experiment_type: Long-read transcriptomics and isoform-resolved proteomics
