  evidence_type: ISS
  original_reference_id: PMID:25694453
  review:
    summary: >-
      Proposed molecular function. CFAP251 has no known enzymatic activity; it is a
      WD40-repeat structural subunit of the RS3 base whose loss removes a defined density
      from the axoneme.
    action: NEW
    reason: >-
      CFAP251 has no molecular function annotation. The evidence shows a structural role
      in the axoneme, a cytoskeletal structure: FAP251-null Tetrahymena cilia lack the
