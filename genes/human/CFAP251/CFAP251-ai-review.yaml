core_functions:
- description: >-
    Structural subunit of the calmodulin- and spoke-associated complex at the base of radial
    spoke 3 on axonemal doublet microtubules; provides the basal scaffold on which RS3
    assembles and, through the CSC, connects the radial spokes to dynein regulatory
    machinery, supporting normal beating of motile cilia and sperm flagella. Only
    flagellated sperm motility is listed as the motility process: it is_a cilium
    movement involved in cell motility, which is_a cilium movement, so the accepted
    cilium movement annotation (supported by Tetrahymena waveform defects and mouse
    tracheal inner dynein arm loss, with human airway disease not established) is
    entailed rather than listed separately.
