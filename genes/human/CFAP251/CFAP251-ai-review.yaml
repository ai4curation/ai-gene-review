- term:
    id: GO:0001536
    label: radial spoke stalk
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: colocalizes_with
  supporting_entities:
  - UniProtKB:A8IRK7
  review:
    summary: >-
      Transferred from the Chlamydomonas ortholog (A8IRK7, FAP251) with a colocalizes_with
      qualifier. The ortholog evidence and the human cryo-EM model place CFAP251 at the base
      of radial spoke 3, not in the spoke stalk.
    action: MODIFY
    reason: >-
      The underlying claim (CFAP251 sits with the radial spokes) is sound, but the
      location is the RS3 base rather than the stalk. In Tetrahymena, FAP251-null cilia
      lack an arch-like density at the RS3 base (PMID:25694453), and in the human
      respiratory axoneme RS3 is built on a base of CFAP61, CFAP91 and CFAP251
      (PMID:37258679). GO now has GO:0120342 radial spoke base 3 (part_of radial spoke 3,
      not part_of the stalk), which states this location directly. This is a lateral
      correction to a sibling structure, not a refinement of the stalk term.
    proposed_replacement_terms:
    - id: GO:0120342
      label: radial spoke base 3
    supported_by:
    - reference_id: PMID:25694453
      supporting_text: FAP251-null cilia lack an arch-like density at the RS3 base
    - reference_id: PMID:37258679
      supporting_text: a full-length RS3, which we show is built on a base of CFAP61, CFAP91 and CFAP251
- term:
    id: GO:0003341
    label: cilium movement
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A8IRK7
  review:
    summary: >-
      Transferred from Chlamydomonas FAP251. CSC subunits are needed for wild-type
      flagellar motility in Chlamydomonas and for normal ciliary waveform and swimming in
      Tetrahymena; mouse Cfap251 loss removes inner dynein arms from tracheal cilia.
    action: ACCEPT
    reason: >-
      CFAP251 is a structural subunit of the CSC at the RS3 base, a complex that relays
      regulatory signals from the radial spokes to the dynein arms. Loss of FAP251 alters
      ciliary waveform and swimming in Tetrahymena (PMID:25694453), CSC knockdown impairs
      motility in Chlamydomonas (PMID:21613541), and Cfap251 knockout mouse tracheal
      cilia lose inner dynein arms (PMID:41943837). This row covers motile cilia in
      general (ciliates, algae, airway), which the sperm-specific flagellated sperm
      motility row does not, so it is kept rather than treated as redundant.
    supported_by:
    - reference_id: PMID:25694453
      supporting_text: loss of either FAP61 or FAP251 reduces cell swimming and affects the ciliary waveform and that RS3 is either missing or incomplete, whereas RS1 and RS2 are unaffected
    - reference_id: PMID:21613541
      supporting_text: the CSC is required for spoke assembly and wild-type motility
    - reference_id: PMID:17967944
      supporting_text: the CaM- and spoke-associated complex mediates regulatory signals between the radial spokes and dynein arms
