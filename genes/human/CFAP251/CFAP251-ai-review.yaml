- term:
    id: GO:0030317
    label: flagellated sperm motility
  evidence_type: IMP
  original_reference_id: PMID:30122540
  qualifier: involved_in
  review:
    summary: >-
      A homozygous SVA-mediated WDR66 deletion causes MMAF in 7 of 78 affected men;
      reproducing the deletion in the Trypanosoma ortholog impaired flagellar movement.
    action: ACCEPT
    reason: >-
      Human loss-of-function genetics in several independent cohorts (PMID:30122540,
      PMID:30122541, PMID:30310178) and a mouse knockout (PMID:41943837) show that
      CFAP251 is required for motile, normally formed sperm flagella. As a structural
      CSC/RS3-base component that relays radial-spoke signals to dyneins, CFAP251 is part
      of the axonemal machinery that produces flagellar motility, so the process
      annotation is appropriate. Much of the immotility reflects malformed flagella, and
      the abstract (the cache is abstract only) does not separate the two.
    supported_by:
    - reference_id: PMID:30122540
      supporting_text: Reproduction of the human deletion in TbWDR66 impaired flagellar movement, thus confirming WDR66 as a gene associated with the MMAF phenotype
    - reference_id: PMID:30122541
      supporting_text: In three men, we found bi-allelic loss-of-function mutations in WDR66
    - reference_id: PMID:41943837
      supporting_text: The Cfap251 knockout mouse model replicated the MMAF and male infertility phenotypes observed in humans for the first time
