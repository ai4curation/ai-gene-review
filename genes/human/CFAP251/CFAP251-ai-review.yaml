id: Q8TBY9
gene_symbol: CFAP251
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CFAP251 (cilia- and flagella-associated protein 251; also known as WDR66) is a large
  WD40-repeat protein of the motile-cilium and sperm-flagellum axoneme. It is a subunit of
  the calmodulin- and spoke-associated complex (CSC), together with CFAP61 and CFAP91, and
  forms part of the base of radial spoke 3 (RS3) on the outer doublet microtubules. In the
  ciliate Tetrahymena, loss of the ortholog FAP251 removes an arch-like density at the RS3
  base, leaves RS3 missing or incomplete, and impairs ciliary waveform and swimming; in the
  human respiratory axoneme cryo-EM model, RS3 is built on a base of CFAP61, CFAP91 and
  CFAP251. The CSC links radial spokes to the nexin-dynein regulatory complex and is
  implicated in calcium/calmodulin-dependent regulation of axonemal dynein activity.
  CFAP251 is most highly expressed in testis, where it localizes along the sperm
  flagellum. Biallelic loss-of-function variants cause spermatogenic failure 33, a male
  infertility disorder with multiple morphological abnormalities of the sperm flagellum
  (MMAF) and defective mitochondrial sheath formation; Cfap251 knockout mice reproduce
  MMAF and also show loss of inner dynein arms in tracheal cilia, although respiratory
  disease in affected men is not established.
