      Abstract only in cache. Verified against PubMed (AJHG 2018). Establishes WDR66
      deletion as a cause of MMAF in 7 of 78 subjects and shows that the Trypanosoma
      ortholog is axonemal and that reproducing the deletion impairs flagellar movement.
      Source of the GOA IMP (flagellated sperm motility) and IDA (sperm flagellum) rows;
      the immunostaining details are in the full text, not the cached abstract.
