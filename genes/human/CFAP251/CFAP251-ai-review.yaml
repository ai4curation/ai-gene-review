proposed_new_terms:
- proposed_name: calmodulin- and spoke-associated complex
  proposed_definition: >-
    A protein complex located at the bases of radial spokes 2 and 3 on the A tubule of
    axonemal outer doublet microtubules of motile cilia and flagella, composed of CFAP91
    (FAP91/CaM-IP2), CFAP61 (FAP61/CaM-IP3) and CFAP251 (FAP251/CaM-IP4), that binds
    calmodulin and connects radial spokes 2 and 3 with the nexin-dynein regulatory
    complex.
  justification: >-
    The CSC is a defined three-subunit complex conserved from Chlamydomonas to human, but
    an OLS search of GO (2026-10-16; queries "calmodulin and spoke associated complex",
    "calmodulin- and spoke-associated complex", "CSC complex", "spoke-associated",
    "calmodulin complex") found no term for it; the nearest terms are the location terms
    GO:0120341 radial spoke base 2 and GO:0120342 radial spoke base 3. A complex term
    would let CFAP251, CFAP91 and CFAP61 carry in_complex. The same term is proposed in
    the CFAP61 and CFAP91 reviews. The parent given is protein-containing complex; the
    complex would also be part_of the axoneme.
  proposed_parent:
    id: GO:0032991
    label: protein-containing complex
  supported_by:
  - reference_id: PMID:17967944
    supporting_text: the CaM-IP2, -IP3, and -IP4 complex is associated with and localizes to the base of the radial spokes
  - reference_id: PMID:17967944
    supporting_text: Based on database searches, CaM-IP4 is also located on linkage group III and corresponds to FAP251
  - reference_id: PMID:22740634
    supporting_text: 'the CSC connects three major axonemal complexes involved in dynein regulation: RS2, the nexin-dynein regulatory complex (N-DRC), and RS3S'
suggested_questions:
- question: >-
    Should CFAP251 (and the other CSC/RS3-base subunits CFAP61 and CFAP91) be annotated to
    GO:0120316 sperm flagellum assembly? Human and mouse loss-of-function causes MMAF and
    Auguste et al. propose a structural role in flagellum biogenesis. An OLS
    hierarchicalAncestors query (2026-10-16) shows that GO:0120316 is_a GO:0044458 motile
    cilium assembly, part_of GO:0030317 flagellated sperm motility and part_of GO:0007286
    spermatid development; through GO:0030317 (is_a GO:0060294 cilium movement involved
    in cell motility, is_a GO:0003341 cilium movement) it is also a descendant of cilium
    movement, and through GO:0007286 (part_of GO:0048515 spermatid differentiation,
    part_of GO:0007283 spermatogenesis) of spermatogenesis. CFAP251 already carries
    flagellated sperm motility and cilium movement, and its primary defect is loss of the
    RS3 base, so the more specific term was not proposed here; GO:0120316 would replace
    GO:0030317 in core functions if the flagellum-biogenesis role were judged primary.
- question: >-
    Is GO:0005200 structural constituent of cytoskeleton the right molecular function for
    non-catalytic axonemal scaffold subunits such as the CSC proteins, given that comparable
    proteins (LRRC23, CCDC39, CFAP61) currently carry no informative MF in GOA?
- question: >-
    Does CFAP251 loss cause clinically significant airway disease in men with SPGF33? The
    mouse knockout loses tracheal inner dynein arms, but the reported human PCD-like
    phenotype rests on symptoms and chest CT only.
suggested_experiments:
- hypothesis: >-
    CFAP251 loss impairs motility of human airway cilia through loss of RS3 and adjacent
    inner dynein arms.
  description: >-
    Collect nasal epithelial brushings from men with biallelic CFAP251 variants; measure
    ciliary beat frequency and waveform by high-speed video microscopy, nasal nitric oxide,
    and resolve RS3 and inner dynein arm occupancy by cryo-electron tomography with
    subtomogram averaging of the 96-nm repeat.
  experiment_type: patient-derived ciliary phenotyping
