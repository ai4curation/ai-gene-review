    action: MODIFY
    reason: 'The saved historical GOA row identifies ARBA:ARBA00027491 as the source of this
      GO_REF:0000117 assertion. That exact target-source assertion is absent from the accepted
      fresh snapshot, while the independent GO:0045003 IBA remains active. Retired here records
