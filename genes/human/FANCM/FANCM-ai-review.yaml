gene_symbol: FANCM
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FANCM is an ATP-dependent DNA translocase related to archaeal Hef and the yeast
  Mph1/Fml1 proteins. Its N-terminal motor recognizes branched nucleic-acid structures and drives
  branch migration of replication forks and Holliday junctions. The MHF1–MHF2 (CENPS–CENPX)
  histone-fold complex stimulates DNA binding and fork remodeling, while the C-terminal ERCC4/XPF-like
  region associates with FAAP24. Purified human FANCM with FAAP24 also disassembles DNA:RNA
  flaps and telomeric R-loops in ATP-dependent reactions. These activities support stalled-fork
  processing, interstrand cross-link repair and suppression of inappropriate recombination.
  Fly and fission-yeast experiments establish noncrossover synthesis-dependent strand annealing
  as a conserved function of the family. FANCM recruits Fanconi anemia core-complex proteins
  to chromatin, promoting damage-induced FANCD2 monoubiquitination through a structural role
  distinct from the ubiquitin-transfer chemistry of the core ligase. It is predominantly nuclear
  and becomes hyperphosphorylated after DNA damage. Human FANCM is expressed in developing ovarian
  germ cells; a homozygous truncating variant has been linked to familial non-syndromic primary
  ovarian insufficiency. Its annotated natural splice products contain 2048, 669 and 2022 residues:
  the 669-residue product lacks the C-terminal interaction regions, and the 2022-residue product
  lacks residues 228–253 within the motor region.'
