      not assert that the ARBA rule was deleted or that homologous recombination is absent.
      The official ARBA rule is still retrievable and asserts GO:0035825, but its historical
      target eligibility and the reason for this target-row disappearance have not been established.
      Independently of that lifecycle, positive fly gap-repair experiments support completion
      of SDSA (PMID:25205745); Fml1 D-loop displacement, catalytic-mutant genetics and noncrossover
      outcomes support the conserved mechanism (PMID:22723423), with centromeric SDSA explicitly
      a model in PMID:28977643. GO:0045003 therefore states the supported repair contribution
      more precisely and is already represented by the active IBA; no duplicate NEW annotation
      is proposed. GO:0035825 describes equal-material exchange, but its reciprocal-recombination
      synonym is narrow and crossover synonym related, so neither the definition nor the lack
      of an is_a link is treated as proof that FANCM cannot participate in broader homologous
      recombination. The inherited PMID:19423727 quotation about normal RAD51 foci remains exact:
      normal foci or nonessentiality does not negate downstream intermediate processing. Its
      original full Methods/Results were not recovered in these lanes.'
