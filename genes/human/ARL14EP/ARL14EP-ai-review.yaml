id: Q8N8R7
gene_symbol: ARL14EP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARL14EP (ARF7EP, C11orf46) is a 260-residue zinc-binding protein with a cysteine-rich domain,
  encoded in the 11p13 WAGR region. In the cytoplasm of human dendritic cells it acts as the effector
  of the GTPase ARL14, linking it to myosin 1E to move MHC class II vesicles along actin. In the nucleus
  it associates with the SETDB1-MCAF1 (ATF7IP) H3K9 methyltransferase repressor complex; its cysteine-rich
  domain binds the MBD of SETDB2 in a crystal structure. Its worm ortholog ARLE-14 promotes stable chromatin
  association of the SETDB homolog MET-2 for heterochromatin formation. In mouse cortical neurons it represses
  axon-guidance genes such as Sema6a and is required for transcallosal connectivity; an R236H variant
  is associated with intellectual disability.
