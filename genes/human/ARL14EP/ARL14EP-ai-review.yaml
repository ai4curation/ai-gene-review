    C11orf46/Arl14ep risk gene.
  findings:
  - statement: C11orf46 is a nuclear protein that assembles with SETDB1 and MCAF1.
    supporting_text: Additional co-immunoprecipitation experiments with mouse anti-C11orf46 antibody in
      HeLa cells, and in homogenates of human cerebral cortex confirmed that C11orf46 assembles with SETDB1,
      MCAF1 and other regulators of repressive chromatin
  - statement: C11orf46 is required for transcallosal connectivity.
    supporting_text: C11orf46 knockdown disrupted transcallosal projections and was rescued by wild type
      C11orf46 but not the C11orf46R236H mutant associated with intellectual disability.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; human cortex co-IP plus mouse neuron knockdown.
