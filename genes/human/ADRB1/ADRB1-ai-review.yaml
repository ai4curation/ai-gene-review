suggested_questions:
- question: Which ADRB1 scaffold interactions are recurrent endogenous regulators rather than
    cell-type-specific or overexpression-dependent PDZ associations?
- question: How much does beta-1 signaling contribute to human brown-fat thermogenesis compared with beta-2
    and beta-3 receptor signaling?
suggested_experiments:
- description: Use endogenous tagging or proximity labeling in cardiomyocytes and brown adipocytes to
    distinguish stable ADRB1 PDZ scaffolds from high-throughput peptide-array interactors.
- description: Measure ADRB1-dependent cAMP and thermogenic outputs after selective ADRB1 perturbation in
    primary human brown/beige adipocytes.
