- id: PMID:10212248
  title: A gain-of-function polymorphism in a G-protein coupling domain of the human beta1-adrenergic
    receptor.
  findings:
  - statement: The human Arg389 beta1AR variant showed stronger agonist-promoted Gs coupling and
      adenylyl-cyclase activation than Gly389.
- id: PMID:11171998
  title: Dual modulation of cell survival and cell death by beta(2)-adrenergic signaling in adult mouse
    cardiac myocytes.
  findings:
  - statement: Adult mouse cardiac myocytes expressing beta1AR undergo apoptosis after beta1AR stimulation.
- id: PMID:11526121
  title: beta 1-adrenergic receptor association with the synaptic scaffolding protein membrane-associated
    guanylate kinase inverted-2 (MAGI-2). Differential regulation of receptor internalization by MAGI-2 and
    PSD-95.
  findings:
  - statement: The beta1AR C terminus binds MAGI-2 through its first PDZ domain and full-length beta1AR
      associates with MAGI-2 in cells.
- id: PMID:11854867
  title: A polymorphism in the beta1 adrenergic receptor is associated with resting heart rate.
  findings: []
- id: PMID:12387862
  title: Beta(1)/beta(2)/beta(3)-adrenoceptor knockout mice are obese and cold-sensitive but have normal
    lipolytic responses to fasting.
  findings: []
- id: PMID:12391161
  title: Direct binding of the beta1 adrenergic receptor to the cyclic AMP-dependent guanine nucleotide
    exchange factor CNrasGEF leads to Ras activation.
  findings:
  - statement: Beta1AR directly binds the PDZ domain of CNrasGEF/RAPGEF2, and agonist-induced Ras activation
      is transduced through Gs alpha and cAMP.
- id: PMID:12529373
  title: Heterodimerization of alpha 2A- and beta 1-adrenergic receptors.
  findings:
  - statement: Beta1AR and alpha2AAR heterodimerize in coexpressing cells, affecting internalization and
      ligand pharmacology.
- id: PMID:16316992
  title: Proteomic analysis of beta1-adrenergic receptor interactions with PDZ scaffold proteins.
  findings:
  - statement: A PDZ-domain array confirmed several beta1AR PDZ scaffold partners and identified MAGI-3 as a
      regulator of beta1AR-mediated ERK signaling.
- id: PMID:16533813
  title: Syntrophins regulate alpha1D-adrenergic receptors through a PDZ domain-mediated interaction.
  findings: []
- id: PMID:21540189
  title: Down-modulation of the G-protein-coupled estrogen receptor, GPER, from the cell surface occurs via a
    trans-Golgi-proteasome pathway.
  findings:
  - statement: HA-beta1AR was used as a recycling GPCR comparator during cell-surface antibody trafficking
      experiments.
- id: PMID:22728333
  title: β(1) Adrenergic receptor is key to cold- and diet-induced thermogenesis in mice.
  findings:
  - statement: Adrb1 knockout mice had impaired brown-fat thermal response and cold- and diet-induced
      thermogenesis.
- id: PMID:23291003
  title: Adenosine A1 receptors heterodimerize with β1- and β2-adrenergic receptors creating novel receptor
    complexes with altered G protein coupling and signaling.
  findings: []
- id: PMID:23381222
  title: β1-adrenergic receptor antagonists signal via PDE4 translocation.
  findings: []
