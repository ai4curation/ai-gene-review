    label: positive regulation of heart rate by epinephrine-norepinephrine
  evidence_type: IDA
  original_reference_id: PMID:11854867
  qualifier: involved_in
  review:
    summary: The catecholamine heart-rate output is true physiology, but not ADRB1's core molecular function.
    action: KEEP_AS_NON_CORE
    reason: ADRB1 is the canonical beta-1 catecholamine receptor that signals through Gs/cAMP, and human
      variants associate with resting heart rate. The row is retained as a peripheral physiology term rather
      than as a core molecular activity; the cached PMID:11854867 association paper is not, by itself, a
      direct epinephrine/norepinephrine heart-rate assay.
