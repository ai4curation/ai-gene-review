id: P08588
gene_symbol: ADRB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ADRB1 encodes the beta-1 adrenergic receptor, a seven-transmembrane catecholamine GPCR that acts primarily
  at the plasma membrane. Epinephrine or norepinephrine binding activates Gs-dependent adenylyl cyclase/cAMP signaling,
  especially in cardiac and other sympathetic target tissues, while a C-terminal PDZ-binding motif recruits scaffold
  proteins that modulate receptor trafficking and pathway output. ADRB1-dependent signaling contributes to physiological
  outputs including heart-rate control, cardiac contractility, brown-fat thermogenesis and sleep/wake regulation.'
