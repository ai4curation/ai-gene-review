id: Q9UK05
gene_symbol: GDF2
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GDF2 encodes BMP9, a secreted TGF-beta-family cytokine produced as a precursor and processed into a mature dimeric ligand. BMP9 engages ALK1-containing receptor complexes and the co-receptor endoglin to activate SMAD signaling. Its vascular effects depend on endothelial context, and it also influences epithelial differentiation and barrier function. The cleaved prodomain can remain associated with receptor-active mature BMP9.
functional_isoforms:
- id: GDF2_MATURE_BMP9
  name: Mature BMP9 ligand
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000033903
    residues: 320-429
  description: The 110-residue C-terminal cleavage product forms the receptor-active ligand dimer. The N-terminal prodomain can remain noncovalently associated in an active procomplex. Precursor processing, prodomain association and disulfide state are distinct from alternative splicing; no splice-specific activity is asserted. The 4YCG deposited complex pairs human mature ligand with a mouse prodomain, so it does not establish an entirely human precursor construct.
core_functions:
- description: 'Extracellular mature BMP9 acts as a cytokine ligand: receptor recognition initiates BMP signaling and receptor-mediated SMAD activation. Endoglin is a binding co-receptor within this system. Ligand activity and receptor recognition describe one functional unit; receptor kinase catalysis is performed by the receptors.'
  molecular_function:
    id: GO:0005125
    label: cytokine activity
  directly_involved_in:
  - id: GO:0030509
    label: BMP signaling pathway
  - id: GO:0060391
    label: positive regulation of SMAD protein signal transduction
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:17068149
  - reference_id: PMID:32082362
  - reference_id: PMID:28564608
  - reference_id: PMID:18309101
  - reference_id: PMID:22799562
suggested_questions:
- question: Which receptor, endothelial state and ligand-presentation features determine whether BMP9 increases or decreases endothelial proliferation?
  experts: []
- question: How do endogenous precursor cleavage, prodomain association and disulfide state determine circulating BMP9 signaling?
  experts: []
- question: What is the contribution of GDF2 alone to hepatic iron regulation and endothelial identity, separately from BMP10 and downstream BMP2/6?
  experts: []
- question: Does the urinary proteomic evidence identify GDF2-derived peptides specifically in extracellular vesicles rather than co-isolated soluble material?
  experts: []
suggested_experiments:
- hypothesis: Receptor composition and endothelial differentiation state determine the direction of the BMP9 proliferative response.
  description: Compare matched human endothelial states with quantified receptor levels and purified ligand forms, measuring direct division, survival and migration separately.
- hypothesis: GDF2 regulates liver iron balance through endothelial signals that are partly redundant with BMP10.
  description: Compare selective and combined perturbations with cell-resolved iron, hepcidin and endothelial-identity measurements, using ligand-specific rescue.
