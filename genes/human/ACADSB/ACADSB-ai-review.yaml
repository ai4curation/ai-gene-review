id: P45954
gene_symbol: ACADSB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACADSB encodes short/branched-chain acyl-CoA dehydrogenase (SBCAD), an FAD-dependent mitochondrial matrix enzyme
  that assembles as a homotetramer. Its principal physiological role is the dehydrogenation of (S)-2-methylbutyryl-CoA
  to tiglyl-CoA during L-isoleucine degradation, with electron transfer to electron-transfer flavoprotein. Human
  enzyme assays also report activity on other short branched substrates, butyryl-CoA, hexanoyl-CoA and valproyl-CoA;
  this substrate breadth depends on the assay and does not establish an equivalent physiological role for every
  substrate. The precursor carries an N-terminal targeting sequence and undergoes processing on mitochondrial import.
  Biallelic loss-of-function variants cause short/branched-chain acyl-CoA dehydrogenase deficiency, an inborn error
  of isoleucine metabolism associated with accumulation of 2-methylbutyrylglycine and 2-methylbutyrylcarnitine.
