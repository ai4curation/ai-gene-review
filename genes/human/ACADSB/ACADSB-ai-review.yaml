core_functions:
- description: >-
    FAD-dependent dehydrogenation of (S)-2-methylbutyryl-CoA to tiglyl-CoA in the mitochondrial matrix, supplying
    a catalytic step of L-isoleucine degradation. The mature enzyme is homotetrameric and transfers reducing equivalents
    to electron-transfer flavoprotein. FAD binding and the broader short-chain dehydrogenase activity are aspects
    of this same enzyme mechanism.
