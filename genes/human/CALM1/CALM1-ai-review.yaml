core_functions:
- description: Calcium-bound calmodulin activates protein serine/threonine kinases, exemplified by human
    CaMKII, by binding the regulatory segment and relieving autoinhibition. Calcium binding is the sensing
    mechanism of this regulatory unit; the kinase performs ATP-dependent phosphate transfer. The distinct
    kinase targets and cellular contexts do not imply that every calmodulin-binding kinase is activated.
  molecular_function:
    id: GO:0043539
    label: protein serine/threonine kinase activator activity
