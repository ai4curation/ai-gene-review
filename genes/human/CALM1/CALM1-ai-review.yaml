  - reference_id: Reactome:R-HSA-2730872
  - reference_id: Reactome:R-HSA-2730867
- description: 'Calmodulin regulates calcium-channel activity through target association and calcium sensing.
    In cardiac channel systems it supports CaV1.2 calcium-dependent inactivation and restrains RyR2-mediated
    release, contributing to electrical regulation and excitation-contraction coupling. Regulation is
    target-dependent: other channel contexts, including the curated TRPV4 complex, can be potentiated.
    The shared calmodulin protein is the regulator, not the channel pore; gene-specific CALM1 disease
    evidence is distinguished from assays of the shared protein and from mouse RyR2 models.'
  molecular_function:
    id: GO:0005246
    label: calcium channel regulator activity
  directly_involved_in:
