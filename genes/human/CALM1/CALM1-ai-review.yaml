id: P0DP23
gene_symbol: CALM1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CALM1 encodes calmodulin, a small calcium-sensor protein with four EF-hand calcium-binding
  sites. Human CALM1, CALM2 and CALM3 share the canonical calmodulin protein sequence, while their disease-associated
  variants and gene regulation remain distinct. Calcium-dependent conformational changes and target binding
  enable calmodulin to activate enzymes such as CaMKII and calcineurin and to regulate ion channels. Calmodulin
  supplies regulatory activity rather than the kinase, phosphatase or channel-pore activity of its partners.
  It acts in soluble pools and in partner-associated membrane and intracellular complexes. In cardiac
  cells, its control of CaV1.2 inactivation and RyR2 calcium release links calcium sensing to electrical
  and contractile function; pathogenic CALM1 variants can disrupt these interactions and cause severe
  arrhythmia.
