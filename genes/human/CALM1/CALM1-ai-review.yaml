  - reference_id: PMID:14722083
- description: Calcium-responsive calmodulin activates calcineurin through direct regulatory association,
    enabling the phosphatase to dephosphorylate substrates such as NFAT. Calmodulin contributes its own
    phosphatase-activator activity and does not itself hydrolyze substrate phosphate groups.
