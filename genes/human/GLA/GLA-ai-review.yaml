id: P06280
gene_symbol: GLA
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
status: DRAFT
description: GLA encodes alpha-galactosidase A, a soluble lysosomal glycosidase that removes terminal
  alpha-D-galactose from glycosphingolipids and soluble oligosaccharides. Its substrates include globotriaosylceramide;
  saposin B assists hydrolysis of membrane-associated substrate. The glycosylated precursor enters the
  secretory pathway and matures after lysosomal delivery. Native human enzyme forms a homodimer. A fraction
  can be secreted and recaptured through uptake receptors. Deficient activity causes X-linked Fabry disease,
  with lysosomal lipid storage and multisystem manifestations.
core_functions:
- description: Hydrolyzes terminal alpha-D-galactose in lysosomal glycosphingolipid and oligosaccharide
    catabolism; saposin B supports membrane-substrate presentation.
  molecular_function:
    id: GO:0004557
    label: alpha-galactosidase activity
  directly_involved_in:
  - id: GO:0046479
    label: glycosphingolipid catabolic process
  - &id001
    id: GO:0009313
    label: oligosaccharide catabolic process
  locations:
  - id: GO:0043202
    label: lysosomal lumen
  supported_by:
  - reference_id: PMID:8804427
  - reference_id: PMID:39940
  - reference_id: Reactome:R-HSA-1605736
  - reference_id: PMID:3029062
suggested_questions:
- question: Which receptor contributions govern endogenous GLA recapture in individual tissues, and how
    can cargo recognition be represented without assigning signaling or uptake-receptor activity to the
    enzyme?
  experts:
  - Lysosomal trafficking researchers
  - GO molecular-function editors
- question: Which GLA terminal-peptide interactions remain measurable for the mature, glycosylated enzyme
    in its physiological compartment?
- question: Does the historical RNA-editing observation yield a reproducible endogenous protein product
    with altered activity? Current sequence records do not establish such a product.
suggested_experiments:
- description: Compare endogenous GLA secretion and lysosomal recapture across relevant human cell types
    using individual receptor perturbations, compartment markers and catalytic-substrate measurements.
- description: Test selected terminal-peptide associations using mature GLA, appropriate compartment controls
    and reciprocal assays; distinguish contact from an effect on catalysis or trafficking.
