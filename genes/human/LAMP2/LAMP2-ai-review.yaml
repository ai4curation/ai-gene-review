id: P13473
gene_symbol: LAMP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LAMP2 is a heavily N- and O-glycosylated single-pass type I membrane protein that is one
  of the most abundant components of the lysosomal limiting membrane. Its large luminal domain, built
  from two LAMP domains, forms part of the glycocalyx lining the lysosome, and its short cytoplasmic tail
  carries a tyrosine-based lysosomal sorting signal. Alternative splicing of the last exon yields LAMP-2A,
  -2B and -2C with distinct transmembrane and cytoplasmic regions. LAMP-2A is the receptor and rate-limiting
  component of chaperone-mediated autophagy, binding HSC70-delivered KFERQ-motif substrates and multimerizing
  into a translocation complex that imports them into the lysosome for degradation. LAMP1 and LAMP2 also
  directly inhibit the lysosomal cation channel TMEM175 to promote lysosomal acidification, and LAMP2
  is required for efficient autophagosome-lysosome fusion. The protein resides mainly in lysosomes and
  late endosomes, shuttling through the plasma membrane, and appears at the cell surface (as CD107b) when
  lysosome-related granules of platelets and leukocytes undergo exocytosis. LAMP2 deficiency causes Danon
  disease.
