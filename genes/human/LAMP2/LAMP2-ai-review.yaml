suggested_questions:
- question: How does a single-pass LAMP-2A multimer translocate unfolded substrates across the lysosomal
    membrane, and is there a pore?
- question: Do LAMP-2B and LAMP-2C have isoform-specific functions beyond modulating CMA (e.g. in Danon
    disease cardiomyopathy)?
suggested_experiments:
- description: Reconstitute purified LAMP-2A with HSC70 and lysosomal HSC70 in proteoliposomes to test
    whether LAMP-2A multimers are sufficient for substrate translocation.
  experiment_type: in vitro reconstitution
