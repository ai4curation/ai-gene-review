core_functions:
- description: LAMP-2A is the lysosomal membrane receptor of chaperone-mediated autophagy, binding HSC70-delivered
    KFERQ substrates via its cytosolic tail and multimerizing into the translocation complex that imports
    them into the lysosome for degradation.
