functional_isoforms:
- id: SREBF1_1A
  name: SREBP-1a
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P36956-1
  description: Product of the upstream exon 1a promoter, with a long acidic N-terminal transactivation domain. It
    is a potent activator of all SREBP targets, both cholesterogenic (LDLR, HMGCR, HMGCS1) and lipogenic. Predominant
    in cultured cell lines and expressed at low, fairly constant levels in tissues; its sterol-regulated processing
    resembles SREBP-2. Most cholesterol-biosynthesis regulation attributed to SREBF1 reflects this isoform. The
    functional differences between SREBF1 forms are preferences of target choice and regulation, not exclusive activities,
    so the related GO terms are annotated to the gene as a whole.
- id: SREBF1_1C
  name: SREBP-1c
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P36956-3
  description: Product of the downstream exon 1c promoter, with a short activation domain. It is a weaker activator,
    biased toward fatty acid and triglyceride synthesis genes (ACLY, ACACA, FASN, ELOVL6, SCD) and weak on classic
    cholesterogenic SREs. Predominant in liver and adipose tissue. Its transcription is induced by insulin and LXR
    agonists and repressed by fasting, glucagon/cAMP and PUFA, which makes it the mediator of insulin-stimulated
    hepatic lipogenesis. The functional differences between SREBF1 forms are preferences of target choice and regulation,
    not exclusive activities, so the related GO terms are annotated to the gene as a whole.
- id: SREBF1_DELTA
  name: SREBP-1aDelta / SREBP-1cDelta
  type: SPLICE_CLASS
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P36956-5
    - P36956-6
  description: Splice variants that end at residue 470, before the membrane anchor. They need no SCAP transport
    or Golgi proteolysis, so they are constitutively nuclear and active on lipogenic promoters (UniProt; PMID:18267114,
    not cached).
- id: SREBF1_NUCLEAR
  name: Processed nuclear SREBP-1 (nSREBP-1)
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000314029
    residues: 1-490
  description: N-terminal fragment released by sequential S1P and S2P cleavage. It carries the transactivation and
    bHLH-ZIP domains, dimerizes, is imported into the nucleus, binds SRE and E-box elements and activates transcription.
    It is rapidly ubiquitinated and degraded by the proteasome. The full-length precursor (PRO_0000127447) is the
    ER/Golgi membrane form in the SREBP-SCAP complex. The functional differences between SREBF1 forms are preferences
    of target choice and regulation, not exclusive activities, so the related GO terms are annotated to the gene
    as a whole.
