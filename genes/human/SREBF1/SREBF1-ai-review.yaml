suggested_questions:
- question: The human GO-CAM 6205c24300000880 (and 66a3e0bb00000156) models SREBF1 with GO:0000981 part_of GO:0045542
    positive regulation of cholesterol biosynthetic process. In liver and most tissues SREBP-1c is the dominant
    isoform and is weak on cholesterogenic SREs. Should the model record SREBP-1a (P36956-1) specifically for cholesterol
    biosynthesis, and add an SREBP-1c activity part_of GO:0045723 positive regulation of fatty acid biosynthetic
    process?
- question: GO:0004879 nuclear receptor activity (IDA, PMID:23610160) and its inferred GO:0030522 appear to have
    been assigned to SREBF1 instead of NR5A1/SF1. Can the source curator confirm and retract them?
- question: GO:0090209 negative regulation of triglyceride metabolic process (PMID:28483554) has the opposite sign
    to the paper's conclusion for SREBF1. Was it intended for MIR192, or for a different relation?
- question: To what extent do SREBP-1 repressive effects (for example on IRS2 or gluconeogenic genes) involve direct
    DNA-binding repression rather than coactivator competition? Would a DNA-binding transcription repressor activity
    annotation ever be warranted?
suggested_experiments:
- description: Isoform-specific CUT&RUN or ChIP-seq with tagged endogenous SREBP-1a and SREBP-1c in human hepatocytes
    (primary or iPSC-derived) under sterol depletion and insulin stimulation, combined with isoform-specific CRISPR
    exon-1 deletion and RNA-seq.
  experiment_type: genome-wide binding and transcriptomics
  hypothesis: SREBP-1a and SREBP-1c occupy overlapping SRE/E-box sites, but differences in activation domain strength,
    not DNA site selection, explain the 1c bias toward lipogenic genes in human liver.
- description: Measure SRE-1 versus E-box binding affinities of purified human SREBP-1 bHLH-ZIP (wild type and Y335R)
    by quantitative EMSA or SPR, and test the IFAP2 variants (residues 527-530) for SCAP binding and S1P cleavage
    in reconstituted Golgi membranes.
  experiment_type: in vitro biochemistry
  hypothesis: Human SREBP-1 dual DNA specificity depends on Tyr335, and IFAP2 variants act as cleavage-resistant
    precursors without altering SCAP binding.
