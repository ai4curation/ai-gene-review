core_functions:
- description: Nuclear SREBP-1 (processed N-terminal bHLH-ZIP fragment) binds sterol regulatory elements and E-boxes
    in RNA polymerase II promoters and activates transcription of genes for cholesterol synthesis and uptake (mainly
    the SREBP-1a isoform) and for fatty acid and triglyceride synthesis (both isoforms; SREBP-1c is the main hepatic
    and adipose form).
  molecular_function: *id005
  directly_involved_in:
  - *id003
  - *id004
  - *id006
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:8402897
    supporting_text: We report the cDNA cloning of human SREBP-1, a protein that binds SRE-1, activates transcription,
      and thereby mediates the final regulatory step in LDL metabolism
  - reference_id: PMID:8156598
    supporting_text: This fragment, which includes the bHLH-ZIP domain, activates transcription of the genes for
      the LDL receptor and HMG CoA synthase
  - reference_id: PMID:7739539
    supporting_text: we demonstrate that ADD1/SREBP1 has dual DNA sequence specificity, binding to both an E-box
      motif (ATCACGTGA) and a non-E-box sequence previously shown to be important in cholesterol metabolism, sterol
      regulatory element 1 (SRE-1; ATCACCCCAC)
  - reference_id: PMID:12177166
    supporting_text: cholesterogenic genes containing classic SREs in their promoters are strongly and efficiently
      activated by both SREBP-1a and SREBP-2, but not by SREBP-1c
  - reference_id: PMID:12177166
    supporting_text: promoters of lipogenic enzymes containing variations of SRE (SRE-like sequences) are strongly
      activated by SREBP-1a, and only modestly and equally by both SREBP-1c and -2
  - reference_id: PMID:11994399
    supporting_text: SREBP-1a is a potent activator of all SREBP-responsive genes, including those that mediate
      the synthesis of cholesterol, fatty acids, and triglycerides.
  - reference_id: PMID:11994399
    supporting_text: SREBP-1c preferentially enhances transcription of genes required for fatty acid synthesis but
      not cholesterol synthesis.
  - reference_id: PMID:11090130
    supporting_text: Because this active form of SREBP-1c controls the transcription of genes involved in fatty
      acid biosynthesis, our results reveal a unique regulatory interplay between cholesterol and fatty acid metabolism
- description: Sequence-specific binding to the direct-repeat sterol regulatory element (SRE-1) in target promoters,
    the DNA-binding activity behind SREBP-1 target selection (dual specificity with E-boxes).
