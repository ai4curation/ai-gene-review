- id: PMID:22203680
  title: Assembly and architecture of biogenesis of lysosome-related organelles complex-1
    (BLOC-1).
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete canonical abstract and recovered PMC3285357 article body including
      Methods, Results and Discussion read. Eight human subunits coexpressed in E. coli form
      the purified complex; AP-3 pull-down uses the whole complex. BLOS3 is more peripherally
