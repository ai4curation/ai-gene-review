    lysosome-related organelles.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete canonical abstract, selected official Figure 6 legend and recovered
      article Methods, Results and Discussion from PMC1805088 read. Human BLOS3 complementation
