gene_symbol: BLOC1S3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BLOC1S3, also called BLOS3, is a subunit of the eight-protein BLOC-1 complex.
  This cytoplasmic complex associates with endosomal membranes and supports sorting of membrane
  cargo toward lysosome-related organelles, including melanosomes and platelet dense granules.
  BLOS3 participates in the assembled complex, whose integrity and cargo-trafficking function
  are disrupted by pathogenic BLOC1S3 variants causing Hermansky-Pudlak syndrome type8. Conserved
  BLOC-1 activity also supports neuronal membrane-cargo delivery and neurite development.
