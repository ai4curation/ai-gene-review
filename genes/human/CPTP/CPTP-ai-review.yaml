    label: phospholipid binding
  evidence_type: IDA
  original_reference_id: PMID:23863933
  qualifier: enables
  review:
    summary: Refine phospholipid binding to ceramide 1-phosphate binding.
    action: MODIFY
    reason: PMID:23863933 solved CPTP/C1P complexes and showed that cationic pocket residues such as
      K60 and R106 are required for C1P transfer, so this row's own evidence supports the more 
      specific C1P-binding child term.
    proposed_replacement_terms:
    - id: GO:1902387
      label: ceramide 1-phosphate binding
    supported_by:
