id: Q5TA50
gene_symbol: CPTP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CPTP is a soluble glycolipid-transfer-fold protein that specifically binds and transfers
  ceramide 1-phosphate between cytosol-accessible membranes. It resides mainly in the cytosol and transiently
  associates with trans-Golgi, plasma, nuclear and endosomal membranes to redistribute CERK-generated
  C1P away from the trans-Golgi, thereby shaping local C1P pools and downstream eicosanoid, autophagy
  and inflammasome responses.'
