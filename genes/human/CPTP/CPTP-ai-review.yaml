suggested_questions:
- question: Which membrane lipid compositions and protein partners set the net direction of 
    CPTP-mediated C1P movement between trans-Golgi, plasma, endosomal and nuclear membranes in 
    living cells?
- question: Does the observed nuclear and endosomal association of CPTP correspond to direct C1P 
    flux at those membranes or to secondary binding after trans-Golgi C1P changes?
suggested_experiments:
- description: Perform C1P pulse-chase organelle lipidomics in CPTP-null cells rescued with 
    wild-type, K60A, R106L and membrane-targeted CPTP variants to quantify C1P flux from TGN to 
    plasma, endosomal and nuclear membrane pools.
- description: Reconstitute CPTP transfer between TGN-like donor liposomes and plasma-membrane-like 
    acceptor liposomes while varying phosphatidylserine, PI(4)P and C1P acyl-chain composition to 
    measure cargo and membrane specificity.
