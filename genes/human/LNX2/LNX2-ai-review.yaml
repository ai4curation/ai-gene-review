- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002717501
  - ZFIN:ZDB-GENE-060228-2
  review:
    summary: >-
      The phylogenetic annotation captures LNX2's RING E3 activity, but the
      parent transferase term is less specific than the experimentally established
      ubiquitin protein ligase activity.
    action: MODIFY
    reason: >-
      Direct assays with full-length human LNX2 show UbcH5-dependent
      autoubiquitination and polyubiquitination of human NUMB. GO:0061630 names
      this E3-specific activity more precisely than GO:0004842 while retaining
      the valid biological essence of the IBA.
    proposed_replacement_terms:
    - id: GO:0061630
      label: ubiquitin protein ligase activity
    additional_reference_ids:
    - PMID:26451611
    supported_by:
    - reference_id: PMID:26451611
      supporting_text: >-
        We expressed the full-length LNX2 (FL-LNX2) and identified that the UbcH5 E2 family is involved in mediating the E3 ligase activity of LNX2 using the E2 profiling kit (Life Sensors) (Figure 1A).
      reference_section_type: RESULTS
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002717501
        source_label: PANTHER ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: The phylogenetic node supports conservation of RING E3 ligase activity.
      - source_id: ZFIN:ZDB-GENE-060228-2
        source_label: zebrafish lnx2b
        source_status: SUPPORTS_TRANSFER
        comment: A vertebrate LNX2-family source supporting transfer to human LNX2.
