      PMID:36115835 provides direct interaction evidence consistent with LNX2 identical
      protein binding. Self-association is plausible for a multidomain PDZ scaffold, but
      the proteome-scale affinity assay does not show that homomerization is required for
      LNX2's ubiquitin-ligase activity, so this is retained as non-core.
