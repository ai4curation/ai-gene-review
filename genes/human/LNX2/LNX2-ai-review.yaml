    reason: >-
      Protein ubiquitination is a direct output of the experimentally established
      RING E3 activity and is absent from the current human LNX2 GOA set. The
      has_input extension records NUMB as the assayed substrate without treating
      an IDA substrate as WITH/FROM evidence.
