id: Q8N448
gene_symbol: LNX2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LNX2 is a multidomain RING-type E3 ubiquitin ligase. Its N-terminal
  Zn-RING-Zn module cooperates with UbcH5-family E2 enzymes, while an NPXY motif
  and four C-terminal PDZ domains organize substrate and partner recognition.
  Full-length human LNX2 autoubiquitinates and directly polyubiquitinates NUMB
  in vitro. In cellular and model-organism contexts, its scaffold/ligase
  architecture also regulates selected membrane proteins and trafficking
  pathways, including CD8α, GlyT2, and connexin36. These downstream roles are
  substrate- and cell-type-dependent; LNX2 is not known to belong to one stable
  obligate complex, and no curated human protein isoforms are currently defined.
