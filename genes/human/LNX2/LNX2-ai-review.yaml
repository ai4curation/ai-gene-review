- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8N448
  review:
    summary: Proteome-scale interactome mapping detected LNX2 self-association.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IPI annotation from PMID:25416956 directly records an LNX2-LNX2 interaction, so
      identical protein binding is a reasonable description of the observed self-association.
      Because the result comes from a large-scale binary interaction map and no obligate
      LNX2 homomeric complex or catalytic requirement is established, it is retained as a
      non-core property rather than a defining function.
