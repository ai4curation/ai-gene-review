proposed_new_terms: []
suggested_questions:
- question: >-
    Which endogenous human proteins are direct physiological LNX2 substrates in
    each relevant cell type, and what substrate features are recognized by its
    NPXY- and PDZ-mediated interaction modules?
- question: >-
    What ubiquitin-chain architectures and downstream fates does LNX2 impose on
    each substrate in vivo, and when does autoubiquitination regulate those outputs?
- question: >-
    Does LNX2 self-association alter substrate selection, localization, or
    signaling even though Zn-RING-Zn dimerization is dispensable for
    autoubiquitination in vitro?
suggested_experiments:
- hypothesis: >-
    LNX2 ubiquitinates a restricted, cell-type-specific substrate set that extends
    beyond NUMB and is selected through its NPXY motif and individual PDZ domains.
  description: >-
    Endogenously tag LNX2 in selected human neuronal, epithelial, and immune cell
    models; combine acute LNX2 degradation with diGly ubiquitin-remnant proteomics,
    quantitative proteomics, and proximity labeling. Validate candidate direct
    substrates by purified reconstitution and rescue with wild-type LNX2 versus
    RING-inactive, NPXY-mutant, and individual PDZ-domain mutants.
  experiment_type: endogenous perturbation and ubiquitin-remnant proteomics
- hypothesis: >-
    Substrate identity and interaction-module engagement determine the ubiquitin
    linkage and cellular fate produced by LNX2.
  description: >-
    For validated endogenous substrates, map ubiquitin sites and chain linkages by
    targeted mass spectrometry after acute LNX2 perturbation, then measure substrate
    stability, trafficking, and endocytosis with proteasome and lysosome controls.
    Compare wild-type LNX2 with Zn-RING-Zn and interaction-module mutants.
  experiment_type: linkage-resolved substrate fate analysis
- hypothesis: >-
    LNX2 oligomerization tunes substrate selection or localization without being
    required for catalytic ubiquitin transfer.
  description: >-
    Introduce endogenous oligomerization-disrupting alleles and quantify LNX2
    stoichiometry, localization, interactomes, and substrate ubiquitination while
    confirming preserved intrinsic E3 activity in purified assays.
  experiment_type: endogenous structure-function analysis
knowledge_gaps:
- gap_statement: >-
    The physiological substrate hierarchy of human LNX2 is unresolved: NUMB is a
    direct substrate in a purified assay, but the dominant endogenous substrates
    and relevant cell types have not been established.
  boundary: >-
    Full-length human LNX2 directly polyubiquitinates human NUMB in vitro, whereas
    Lnx1/Lnx2 double-knockout mouse brain retains normal NUMB abundance and lacks
    major neuroanatomical defects indicative of altered NUMB function.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this gap is necessary to distinguish a broadly relevant LNX2-NUMB
    axis from context-specific substrate relationships and to assign supported
    downstream biological processes.
  resolution: >-
    Acute endogenous LNX2 perturbation coupled to ubiquitin-remnant and abundance
    proteomics across relevant human cell types, followed by biochemical validation
    of direct candidates, would establish the physiological substrate hierarchy.
  provenance:
  - reference_id: PMID:27889896
    supporting_text: >-
      However, our understanding of LNX protein function in vivo is very limited.
- gap_statement: >-
    How the NPXY motif, four PDZ domains, and self-association cooperate with the
    Zn-RING-Zn catalytic module to select substrates and control LNX2 localization
    is not known at endogenous expression levels.
  boundary: >-
    LNX2 has experimentally supported scaffold interactions and self-association,
    but self-association is dispensable for Zn-RING-Zn autoubiquitination and no
    stable obligate LNX2 complex has been established.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This mechanism would explain how a conserved E3 catalytic module produces
    substrate- and cell-context-specific trafficking and signaling outputs.
  resolution: >-
    Endogenous domain-selective alleles combined with quantitative interactomics,
    localization measurements, and substrate-specific ubiquitination assays would
    separate recruitment, scaffolding, oligomerization, and catalytic roles.
  provenance:
  - reference_id: PMID:26451611
    supporting_text: >-
      We show that although LNX2 exists as a dimer in solution, this dimerization is not required for its autoubiquitination.
- gap_statement: >-
    The ubiquitin-chain architectures and downstream fates generated by LNX2 on
    physiological substrates in cells remain unresolved.
  boundary: >-
    Purified full-length LNX2 can form polyubiquitin through all seven lysine
    linkages and can polyubiquitinate NUMB, but these in-vitro results do not define
    linkage preference or substrate fate in cells.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Linkage and fate determine whether LNX2 primarily controls substrate degradation,
    trafficking, signaling, or a mixture of context-specific outcomes.
  resolution: >-
    Linkage-resolved ubiquitinomics and matched measurements of substrate stability
    and trafficking after acute endogenous LNX2 perturbation would resolve this gap.
  provenance:
  - reference_id: PMID:26451611
    supporting_text: >-
      We showed that the ubiquitin chains formed by LNX2 contain all seven possible isopeptide linkages.
