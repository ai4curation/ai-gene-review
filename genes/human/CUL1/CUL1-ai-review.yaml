suggested_questions:
- question: Should the ~140 GO:0005515 rows recording CUL1 with individual F-box proteins and SCF substrates
    be re-curated in GO-CAM as has_input/has_output relations on the receptor and RBX1 activities, rather
    than as bare protein-binding annotations on the shared scaffold?
- question: Is GO:1990452 Parkin-FBXW7-Cul1 ubiquitin ligase complex still supported by evidence beyond
    the single 2003 report, given that neddylated CUL1-RBX1 activates RBR ligases such as ARIH1 rather
    than parkin in later reconstitutions?
- question: Which of the receptor-specific pathway outputs (circadian rhythm, iron homeostasis, TOR, BMP,
    mitophagy, xenophagy, centrosome duplication) should be annotated to CUL1 at all, versus only to the
    F-box receptor, when the scaffold is shared by all ~70 SCF ligases?
suggested_experiments:
- hypothesis: The CUL1 basic canyon that binds the CDC34 acidic tail is required for processive K48 chain
    synthesis by all SCF ligases regardless of receptor.
  description: Rescue CUL1-depleted human cells with canyon charge-reversal mutants and measure chain
    length and degradation kinetics of SKP2, beta-TrCP and FBXW7 substrates by ubiquitin-remnant proteomics
    and cycloheximide chase.
  experiment_type: structure-guided mutational rescue with ubiquitination kinetics
- hypothesis: Neddylated CUL1-RBX1 activation of ARIH1 is required in vivo for priming of a defined subset
    of SCF substrates.
  description: Compare substrate ubiquitination and turnover in ARIH1-null cells reconstituted with a
    CRL-binding-deficient ARIH1 allele against CUL1 K720R cells, using SCF(beta-TrCP) and SCF(FBXW7) substrates
    as readouts.
  experiment_type: genetic separation of tandem E3 activity
