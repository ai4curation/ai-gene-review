core_functions:
- description: 'Scaffold of SCF (SKP1-CUL1-F-box-RBX1) cullin-RING ubiquitin ligases: the N-terminal cullin
    repeats bind SKP1 and thereby an interchangeable F-box substrate receptor, the C-terminal domain binds
    the RING protein RBX1 that recruits ubiquitin-charged E2s (CDC34, UBE2D) through the CUL1 basic canyon,
    and NEDD8 conjugation to Lys720 activates the assembly. The complex builds K48-linked chains that
    direct receptor-selected substrates (p27/CDKN1B via SKP2 at the G1/S transition, IkappaB-alpha, beta-catenin,
    DEPTOR via beta-TrCP, cyclin E and MYC via FBXW7) to the proteasome.'
