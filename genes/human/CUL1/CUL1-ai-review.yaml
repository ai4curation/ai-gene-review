  review:
    summary: CUL1 scaffolds SCF(SKP2), whose ubiquitination of Thr187-phosphorylated p27/CDKN1B releases
      CDK2 and commits the cell to S phase; C. elegans cul-1 loss deregulates G1 exit.
    action: ACCEPT
