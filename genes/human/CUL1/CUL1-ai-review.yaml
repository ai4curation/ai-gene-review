id: Q13616
gene_symbol: CUL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CUL1 (cullin-1) is the scaffold subunit of the SCF (SKP1-CUL1-F-box protein) family of cullin-RING
  E3 ubiquitin ligases, the largest class of E3s in human cells. It is an elongated, rigid protein: an
  N-terminal stalk of three cullin repeats binds the adaptor SKP1, which carries one of roughly 70 interchangeable
  F-box substrate receptors (SKP2, beta-TrCP/BTRC/FBXW11, FBXW7, cyclin F, FBXL3, FBXL5, FBXO9, FBXO31
  and others), while the C-terminal globular domain binds the RING protein RBX1, which recruits ubiquitin-charged
  E2 enzymes (CDC34/UBE2R, UBE2D) and the RBR E3 ARIH1. CUL1 has no catalytic activity of its own and
  forms no ubiquitin thioester; it positions the receptor-bound substrate and the E2 about 100 A apart
  and contributes to catalysis through this geometry. Its activity is switched on by covalent attachment
  of NEDD8 to Lys720, which reorients the RBX1 RING and relieves autoinhibition, and it is switched off
  by COP9 signalosome-mediated deneddylation and by CAND1, which binds unneddylated CUL1, displaces SKP1
  and drives exchange of F-box receptors. The neddylated CUL1-RBX1 core is also borrowed by the CUL7-FBXW8
  assembly. Through its receptors, CUL1-based SCF ligases build mostly K48-linked chains that send substrates
  to the proteasome: SCF(SKP2) destroys Thr187-phosphorylated p27/CDKN1B at the G1/S transition, SCF(beta-TrCP)
  degrades IkappaB-alpha, beta-catenin, EMI1, CDC25A, DEPTOR and MDM2, SCF(FBXW7) degrades cyclin E, MYC
  and NOTCH, SCF(cyclin F) degrades CP110 and RRM2, SCF(FBXL3) degrades the cryptochromes, and SCF(FBXL5)
  degrades IRP2. CUL1 therefore acts in both nucleus and cytosol, with receptor-specific pools at centrosomes,
  membranes and mitochondria, and it underlies cell-cycle progression, signalling homeostasis, circadian
  timing, iron sensing and protein quality control.'
