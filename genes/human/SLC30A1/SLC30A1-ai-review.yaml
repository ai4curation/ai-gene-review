proposed_new_terms: []
suggested_questions:
- question: >-
    What is the physiological energy-coupling ion for ZnT1-mediated zinc efflux - H+, Ca2+, or both in a
    tissue-dependent manner? Biochemical (proteoliposome) data support a Zn2+/H+ antiporter, while
    neuronal cell-based data support a Zn2+/Ca2+ exchanger, and the two models give very different KM
    values for zinc (1.42 mM proton-dependent vs 0.38 uM calcium-dependent).
- question: >-
    Is the copper-import/cuproptosis activity of ZnT1 a genuine physiological function in vivo, and how
    is directionality reversed (copper entry vs zinc exit) at the same shared metal-binding site?
- question: >-
    Does human ZnT1 transport cadmium and contribute to cadmium detoxification, as the ortholog-based
    annotations imply, or are these CDF-family generalizations not realized by human ZnT1?
suggested_experiments:
- description: >-
    Side-by-side reconstitution of purified full-length human ZnT1 in proteoliposomes with controlled
    H+ and Ca2+ gradients, combined with endogenous-level cell assays across tissues (enterocyte,
    neuron, cardiomyocyte), to define the physiological counter-ion and resolve the Zn2+/H+ vs Zn2+/Ca2+
    coupling debate.
- description: >-
    Metal-selectivity profiling (Zn2+, Cu2+, Cd2+, Ca2+) of purified human ZnT1 and structure-guided
    point mutants of the shared transport site to establish which metals are genuine physiological
    substrates and how direction of transport is set.
knowledge_gaps:
- gap_statement: >-
    The physiological ion that energizes ZnT1-mediated zinc efflux is unresolved: in vitro the purified
    transporter behaves as a Zn2+/H+ antiporter, whereas in neuronal cells calcium influx is coupled to
    zinc efflux (Zn2+/Ca2+ exchange), and the apparent zinc affinities differ by orders of magnitude
    between the two modes.
  boundary: >-
    ZnT1's identity as the principal plasma-membrane zinc exporter and the transport-site residues are
    established; what is unknown is the coupling ion and its tissue-dependence under physiological conditions.
  gap_kind:
  - BIOLOGY
  significance: >-
    The coupling mechanism determines the thermodynamic driving force and the conditions under which ZnT1
    exports zinc, and bears directly on which molecular-function term (zinc:proton antiporter vs
    calcium:cation antiporter) best describes its activity in a given tissue.
  resolution: >-
    Quantitative transport assays on purified, reconstituted human ZnT1 under defined H+ and Ca2+
    gradients, with matched endogenous-level cellular measurements across tissues.
  provenance:
  - reference_id: PMID:38669333
    supporting_text: Ca2+ influx was coupled to Zn2+ efflux, suggesting that hZnT1 is a Zn2+/Ca2+ exchanger in neuronal cells
