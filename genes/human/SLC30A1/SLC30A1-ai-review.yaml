core_functions:
- description: >-
    Principal plasma-membrane zinc exporter: ZnT1 moves cytosolic Zn2+ out of the cell across the
    plasma membrane against its electrochemical gradient, operating as a Zn2+/H+ antiporter (and, in
    some settings, a Zn2+/Ca2+ exchanger). This efflux maintains intracellular zinc homeostasis and
    protects the cell from zinc toxicity; in polarized enterocytes the basolateral ZnT1 pool delivers
    dietary zinc to the circulation.
  molecular_function:
    id: GO:0140826
    label: zinc:proton antiporter activity
  directly_involved_in:
