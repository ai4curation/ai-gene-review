id: Q9Y6M5
gene_symbol: SLC30A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC30A1 (ZnT1) is the founding member of the SLC30/ZnT (cation diffusion facilitator, CDF)
  family of zinc transporters. It is a ubiquitously expressed, multi-pass membrane protein that
  assembles as a disulfide-linked homodimer and is the only ZnT family member that localizes
  predominantly to the plasma membrane. ZnT1 is the principal exporter of cytosolic Zn2+ across
  the plasma membrane, moving zinc out of the cell against its electrochemical gradient and thereby
  protecting cells from Zn2+ accumulation and toxicity. Transport is driven by counter-ion
  exchange: ZnT1 behaves as a Zn2+/H+ antiporter and, in some settings, as a Zn2+/Ca2+ exchanger
  (zinc export coupled to calcium influx); the precise physiological coupling ion is still debated.
  In polarized enterocytes ZnT1 resides at the basolateral membrane, where it delivers dietary zinc
  into the circulation and is essential for systemic zinc homeostasis and embryonic viability. In
  addition to its principal plasma-membrane role, ZnT1 is found on intracellular membranes
  (endoplasmic reticulum, Golgi, nuclear envelope and cytoplasmic vesicles), can pump zinc into the
  lumen of vesicles, and in activated macrophages concentrates zinc into bacteria-containing vesicles
  as part of an antimicrobial zinc-toxicity response. ZnT1 also has reported moonlighting activities:
  it can act as a copper importer required for cuproptosis, it negatively regulates L-type calcium
  channels through interaction with the CACNB2/beta regulatory subunit, and its cytosolic C-terminal
  domain has been linked to Ras-Raf-ERK signalling. ZnT1 forms heterodimers with other ZnT family
  members (ZnT2, ZnT3, ZnT4) and with TMEM163, and in keratinocytes forms an ER complex with
  TMC6/EVER1 and TMC8/EVER2 that modulates intracellular zinc distribution.
