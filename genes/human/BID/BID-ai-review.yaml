- term:
    id: GO:0005123
    label: death receptor binding
  evidence_type: TAS
  original_reference_id: PMID:8918887
  qualifier: enables
  review:
    summary: The original cloning paper supports BCL2- and BAX-family binding, not literal 
      death-receptor binding.
    action: REMOVE
    reason: PMID:8918887 used receptor language for membrane-bound BAX in a BCL2-family model; BID 
      is cleaved downstream of FAS/CASP8 but is not a receptor ligand for FAS, TNF, or TRAIL death 
      receptors.
