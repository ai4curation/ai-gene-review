core_functions:
- description: Cleaved tBID exposes a BH3 activator helix and translocates to mitochondrial 
    membranes, where it transiently engages BAX and BAK and promotes their oligomeric MOMP pore, 
    cytochrome-c release, and caspase activation in intrinsic and death-receptor apoptosis.
  proposed_molecular_function: pro-apoptotic BCL2 family effector activator activity
  directly_involved_in:
  - id: GO:1901030
    label: positive regulation of mitochondrial outer membrane permeabilization involved in 
      apoptotic signaling pathway
  - id: GO:0090200
    label: positive regulation of release of cytochrome c from mitochondria
  - id: GO:1902043
    label: positive regulation of extrinsic apoptotic signaling pathway via death domain receptors
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:9727491
    supporting_text: Caspase-8 cleaves Bid, and the COOH-terminal part translocates to mitochondria 
      where it triggers cytochrome c release
  - reference_id: PMID:17052454
    supporting_text: model in which BID directly engages BAX to trigger mitochondrial apoptosis
  - reference_id: PMID:23604079
    supporting_text: BID activates BAK to perform this function
proposed_new_terms:
- proposed_name: pro-apoptotic BCL2 family effector activator activity
  proposed_definition: Binding to a pro-apoptotic BCL2-family effector such as BAX or BAK to promote
    the conformational activation and oligomerization that drives apoptotic mitochondrial outer 
    membrane permeabilization.
  justification: BID and other direct activator BH3-only proteins donate a BH3 helix that activates 
    BAX/BAK, but GO:0051434 BH3 domain binding annotates the groove-containing protein that 
    recognizes a BH3 helix. A BID-side molecular-function term would prevent these central 
    interactions from collapsing to GO:0005515 protein binding.
  proposed_parent:
    id: GO:0140677
    label: molecular function activator activity
  supported_by:
  - reference_id: PMID:17052454
    supporting_text: model in which BID directly engages BAX to trigger mitochondrial apoptosis
  - reference_id: PMID:23604079
    supporting_text: BID activates BAK to perform this function
suggested_questions:
- question: Should GO add a molecular-function term for direct activator BH3-only proteins such as 
    tBID and BIM, distinct from GO:0051434 BH3 domain binding, which describes the BAX/BAK or 
    pro-survival BCL2-family groove that recognizes a BH3 helix?
- question: Should BID isoforms be curated separately when a source assays BID(EL), BID(S), or 
    BID(ES), given that BID(S) lacks the BH3 domain and antagonizes tBID while BID(ES) has mixed 
    pro- and anti-apoptotic behavior?
suggested_experiments:
- description: For contextual BID interactors such as CAV1, PLEKHN1, and large interactome hits, map
    whether the partner binds full-length BID or tBID, test whether the interaction changes caspase 
    cleavage, membrane recruitment, or BAX/BAK activation directly, and separate those proximal 
    readouts from final viability or caspase-3 cleavage.
