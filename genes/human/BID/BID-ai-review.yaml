    label: release of cytochrome c from mitochondria
  evidence_type: IDA
  original_reference_id: PMID:17052454
  qualifier: involved_in
  review:
    summary: BID positively regulates cytochrome-c release by activating BAX/BAK rather than itself 
      forming the release pore.
    action: MODIFY
