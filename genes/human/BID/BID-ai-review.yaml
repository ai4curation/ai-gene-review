id: P55957
gene_symbol: BID
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BID encodes a BH3-only BCL2-family apoptosis regulator that is held in an inactive, 
  mostly cytosolic full-length form until initiator or executioner caspases expose C-terminal tBID 
  fragments. tBID moves to mitochondrial membranes and uses its BH3 helix to engage BAX and BAK, 
  promoting their oligomeric mitochondrial outer-membrane permeabilization pore, cytochrome-c 
  release, and downstream apoptotic caspase activation. BID therefore links death-receptor 
  signaling, CASP6 feed-forward amplification, and stress-induced mitochondrial apoptosis, while 
  alternative human isoforms and binding to proteins such as ITCH, Humanin, CAV1, and PLEKHN1 tune 
  that pro-apoptotic activity in more restricted contexts.
