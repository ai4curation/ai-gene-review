    - *id008
- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001019935
  - UniProtKB:Q8WV28
  review:
    summary: IBA protein-macromolecule adaptor activity (PANTHER PTN001019935).
    action: ACCEPT
    reason: SLP-76 has no catalytic domain; it is a phosphorylation-dependent adaptor whose N-terminal
      pY motifs, central proline-rich GADS-binding region and C-terminal SH2 domain assemble VAV1, NCK,
      ITK, PLCG1, GADS/LAT and ADAP into a signaling complex. This is the core MF (the more specific child
      signaling adaptor activity is used in core_functions).
    supported_by:
    - reference_id: PMID:7706237
      supporting_text: Although no recognizable motifs related to tyrosine, serine/threonine, or lipid
        kinase domains are present in the predicted amino acid sequence, it contains several potential
        motifs recognized by SH2 and SH3 domains
    - reference_id: PMID:21725281
      supporting_text: 'In T and mast cells, antigen receptor signalling is nucleated by three adaptors:
        SLP-76, Gads and LAT'
