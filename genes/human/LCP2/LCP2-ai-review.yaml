- id: file:human/LCP2/LCP2-deep-research-falcon.md
  title: Falcon deep research report for human LCP2
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Automatically generated synthesis built almost entirely on secondary reviews (Rudd 2021,
      Dadwal 2021, Borowicz 2020, Balagopalan 2021) plus one primary paper (Yamane 2026, PMID:42660881).
      Core adaptor biology agrees with the review. Leads on PLCG1-SH3 affinity tuning, HPK1-Ser376 feedback
      and RanGAP1 were traced to primary papers. Embellishments noted (e.g. "kinetic proofreading", not
      in the cited paper); approximate domain boundaries; two references are an unidentified 2023 Chinese
      review with "Unknown journal". Used only as corroboration.
core_functions:
- description: Phosphorylation-dependent signaling adaptor of the T cell receptor signalosome. After TCR
    engagement, ZAP70-phosphorylated N-terminal tyrosines of SLP-76 recruit VAV1, NCK and ITK, while GADS
    binding of its RxxK motif links it to phospho-LAT; the assembled complex couples the TCR to PLCG1
    activation, Ras/ERK, actin polymerization and NF-kB.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
  - id: GO:0050852
    label: T cell receptor signaling pathway
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0001772
    label: immunological synapse
  in_complex:
    id: GO:0036398
    label: TCR signalosome
  supported_by:
  - reference_id: PMID:9665884
    supporting_text: coupling of TCR-regulated PTKs to downstream signaling pathways requires SLP-76
  - reference_id: PMID:17235283
    supporting_text: the Gads C-terminal SH3 domain binds a core RxxK sequence motif in the SLP-76 scaffold
  - reference_id: PMID:9047237
    supporting_text: only ZAP-70 phosphorylates SLP-76 at specific sites that allow Vav SH2 domain binding
  - reference_id: PMID:17420479
    supporting_text: We propose that SLP-76 is required for ITK activation
  - reference_id: PMID:42660881
    supporting_text: the conserved weak SLP-76/PLC-γ1 interaction is important for the controlled
      activation of PLC-γ1, thus fine-tuning TCR signal strength to optimize T cell-mediated immunity
  - reference_id: PMID:17353368
    supporting_text: a novel negative feedback loop involving HPK-1-dependent serine phosphorylation
      of SLP-76 and 14-3-3 protein recruitment, which tunes T cell activation
  - reference_id: file:human/LCP2/LCP2-deep-research-falcon.md
    supporting_text: SLP-76 is a non-enzymatic scaffold protein—it lacks catalytic activity and instead
      organizes multiprotein signaling complexes through its interaction domains
