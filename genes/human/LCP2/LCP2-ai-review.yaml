  - reference_id: PMID:33231617
    supporting_text: severe neutrophil defects, and impaired platelet aggregation
suggested_questions:
- question: Beyond scaffolding, does SLP-76 act as a direct activator of ITK (holding it in the active
    conformation, PMID:17420479), and would this justify a protein kinase activator activity MF in addition
    to signaling adaptor activity?
- question: Should the SLP-76/BLNK/CLNK PANTHER node carry cell surface receptor protein tyrosine kinase
    signaling pathway, given that the receptors these adaptors serve (TCR, BCR, FcERI, GPVI) lack intrinsic
    kinase activity?
- question: Is there direct evidence (e.g. detergent-resistant membrane fractionation) that SLP-76 localizes
    to plasma membrane rafts, supporting the IDA from PMID:20551903?
- question: SLP-76 has been reported to bind SUMO-RANGAP1 at nuclear pore cytoplasmic filaments via
    Lys56 and to promote NFATC1 and p65 nuclear import (PMID:26321253). Is this independently reproduced,
    and does it justify a nuclear pore cytoplasmic filament location or a regulation of protein import
    into nucleus process annotation, given that GOA currently has neither?
- question: SLP-76 binds the PLCG1 SH3 domain directly through PRR185-200 but with deliberately low affinity
    (PMID:42660881). Does the SH3 domain binding MF fully capture this, or should SLP-76 be modelled as
    contributing to PLCG1 activation (e.g. a GO-CAM causal edge) within the LAT-GADS-SLP-76-PLCG1 tetramer?
suggested_experiments:
- description: Reconstitute SLP-76-deficient human neutrophils or iPSC-derived neutrophils with domain
    mutants (N-terminal 3YF, GADS-binding RxxK mutant, SH2 R448L) and measure integrin/Fc-gamma receptor-induced
    PLCG2 activation, ROS and adhesion.
  hypothesis: The neutrophil defect of human SLP-76 deficiency reflects loss of the same N-terminal/GADS/SH2
    adaptor modules used in TCR signaling.
  experiment_type: genetic complementation with domain mutants
- description: Introduce the RANGAP1-binding-deficient K56E substitution into endogenous LCP2 in primary
    human T cells (base editing) and measure NPC-associated RANGAP1, NFATC1 and p65 nuclear import, and
    proximal signaling, after TCR stimulation.
  hypothesis: SLP-76 binding to SUMO-RANGAP1 is required for efficient nuclear entry of NFAT and NF-kB
    in human T cells independently of its proximal adaptor function.
  experiment_type: genome editing with functional readouts
