      synapse but contains no statement about membrane rafts or raft fractionation, so the evidence cannot
      be verified here. SLP-76 is cytosolic and is recruited to membrane via GADS/phospho-LAT, so raft
      association is plausible but indirect; left undecided rather than overruling the curator.
