- term:
    id: GO:0044853
    label: plasma membrane raft
  evidence_type: IDA
  original_reference_id: PMID:20551903
  qualifier: located_in
  review:
    summary: IDA plasma membrane raft (PMID:20551903).
    action: UNDECIDED
