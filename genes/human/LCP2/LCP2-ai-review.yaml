id: Q13094
gene_symbol: LCP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LCP2 encodes SLP-76 (SH2 domain-containing leukocyte protein of 76 kDa), a cytosolic adaptor
  protein of hematopoietic cells with no catalytic activity. It has an N-terminal acidic region with tyrosines
  (Y113, Y128, Y145) that are phosphorylated by ZAP70 in T cells or SYK in myeloid cells and platelets
  and then bind the SH2 domains of VAV1, NCK and the Tec kinase ITK; a central proline-rich region whose
  RxxK motif is bound with high affinity by the C-terminal SH3 domain of GRAP2/GADS, which links SLP-76
  to phosphorylated LAT; and a C-terminal SH2 domain that binds phosphorylated ADAP/FYB1, FYB2, CD6 and
  HPK1. After antigen receptor engagement SLP-76 is recruited from the cytosol into LAT-nucleated signaling
  microclusters at the immunological synapse, where it assembles the signalosome that activates PLCG1
  (via ITK), Ras/ERK, VAV1/NCK-dependent actin polymerization, PKC-theta/NF-kB and ADAP-dependent integrin
  activation. A proline-rich segment (residues ~185-200) also binds the PLCG1 SH3 domain directly; this
  conserved interaction within the LAT-GADS-SLP-76-PLCG1 complex is of deliberately low affinity, and
  raising it increases PLCG1 activity and perturbs thymocyte selection and T cell memory, so it tunes
  TCR signal strength. HPK1/MAP4K1 phosphorylates SLP-76 on Ser376, which recruits 14-3-3 proteins and
  provides negative feedback on TCR signaling. SLP-76 has also been reported to bind SUMO-RANGAP1 at
  the cytoplasmic filaments of the nuclear pore complex (via Lys56) and to promote nuclear import of NFATC1
  and NF-kB p65 in activated T cells. It is required for T cell receptor signaling and thymocyte development, and for ITAM-receptor
  signaling in other cells, including FcERI signaling in mast cells and GPVI/CLEC-2 signaling in platelets.
  Biallelic loss-of-function variants cause a combined immunodeficiency with neutrophil and platelet defects.
