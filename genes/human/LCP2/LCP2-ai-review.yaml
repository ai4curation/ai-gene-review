- term:
    id: GO:0007169
    label: cell surface receptor protein tyrosine kinase signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1351468
  - PANTHER:PTN001019935
  review:
    summary: IBA to cell surface receptor protein tyrosine kinase signaling pathway, from PANTHER node
      PTN001019935 (SLP-76/BLNK/CLNK family).
    action: MODIFY
    reason: GO defines this term as signaling from receptors that themselves possess tyrosine kinase activity.
      SLP-76 acts downstream of non-catalytic immunoreceptors (TCR, FcERI, GPVI/FcR-gamma) that recruit
      cytoplasmic Src/Syk-family kinases (ZAP70, SYK), and GO does not place T cell receptor signaling
      pathway under this term. The IBA reflects the family broad role as a tyrosine-kinase substrate adaptor,
      but it misstates the receptor class for LCP2. Replace with T cell receptor signaling pathway; the
      receptor-specific terms (T cell receptor signaling pathway, Fc-epsilon receptor signaling pathway)
      are the accurate annotations.
    supported_by:
    - reference_id: PMID:9665884
      supporting_text: coupling of TCR-regulated PTKs to downstream signaling pathways requires SLP-76
    proposed_replacement_terms:
    - id: GO:0050852
      label: T cell receptor signaling pathway
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001019935
        comment: SLP-76/BLNK/CLNK family node; the adaptor role downstream of tyrosine kinases is inherited,
          but for LCP2 the kinases are cytoplasmic (ZAP70/SYK) acting on non-catalytic immunoreceptors,
          not receptor tyrosine kinases.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: MGI:MGI:1351468
        comment: Mouse descendant evidence listed in WITH/FROM; not inspected in detail here.
        source_status: UNRESOLVED
- term:
    id: GO:0007169
    label: cell surface receptor protein tyrosine kinase signaling pathway
  evidence_type: TAS
  original_reference_id: PMID:7706237
  qualifier: involved_in
  review:
    summary: TAS to cell surface receptor protein tyrosine kinase signaling pathway from the SLP-76 cloning
      paper.
    action: MODIFY
    reason: The cloning paper describes SLP-76 as a substrate of the TCR-activated tyrosine kinase pathway;
      the TCR has no intrinsic kinase activity, so the receptor tyrosine kinase pathway term is inaccurate.
      Replace with T cell receptor signaling pathway.
