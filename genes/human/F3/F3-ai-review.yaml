core_functions:
- description: 'Membrane cofactor and allosteric activator of factor VIIa: TF binds FVII/FVIIa on the outer face
    of the plasma membrane and converts it into the extrinsic Xase (TF:FVIIa) complex, which activates FX and FIX
    by limited proteolysis to initiate the extrinsic coagulation pathway. FVIIa supplies the catalysis; TF supplies
    binding, membrane localisation and allosteric activation.'
