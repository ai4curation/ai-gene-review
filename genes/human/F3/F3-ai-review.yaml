id: P13726
gene_symbol: F3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Tissue factor (TF, coagulation factor III, CD142) is a single-pass type I transmembrane glycoprotein
  of the class II cytokine-receptor fold that is the physiological initiator of blood coagulation. It is expressed
  constitutively on subendothelial cells such as adventitial fibroblasts and medial smooth-muscle cells, and is
  inducible on monocytes and endothelium by inflammatory stimuli, so that it is normally sequestered from blood
  until vascular injury. Its extracellular domain binds circulating factor VII/VIIa with high affinity in a calcium-dependent
  manner; TF has no protease activity of its own but acts as the membrane cofactor and allosteric activator of FVIIa,
  and the TF:FVIIa complex on a phosphatidylserine-containing membrane activates factors X and IX by limited proteolysis,
  starting the extrinsic pathway that leads to thrombin generation and fibrin formation. Most surface TF is held
  in a cryptic, coagulation-inactive state that is decrypted by phosphatidylserine exposure, sphingomyelin hydrolysis
  and thiol-disulfide exchange at the Cys186-Cys209 disulfide. TF:FVIIa and TF:FVIIa:FXa also signal through protease-activated
  receptors PAR2 and PAR1, influencing inflammation, angiogenesis, cell migration and tumour progression. An alternatively
  spliced soluble isoform (asHTF) lacking the transmembrane domain circulates in blood and is procoagulant when
  exposed to phospholipids.
