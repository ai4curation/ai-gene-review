- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IDA
  original_reference_id: PMID:24998411
  qualifier: contributes_to
  review:
    summary: TF is the non-catalytic cofactor of FVIIa; the protease activity belongs to FVIIa and is better captured
      for TF as endopeptidase activator activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: TF has no protease fold or catalytic residues (PMID:3037536). The TF:FVIIa complex is proteolytically
      active, but FVIIa carries the catalytic triad and TF acts as an allosteric activator of FVIIa (Reactome R-HSA-140748).
      The row's evidence, PMID:24998411 (abstract only), shows that miR-19b suppresses TF expression and procoagulant
      activity, which demonstrates TF necessity, not a contribution to the catalytic chemistry. The cofactor role
      is recorded instead as a NEW GO:0061133 endopeptidase activator activity row supported by reconstitution and
      structural evidence. Not removed, because 'contributes_to' a complex activity is an established curator convention
      for subunits of a catalytic complex.
    supported_by:
    - reference_id: PMID:3037536
      supporting_text: The amino acid sequence of tissue factor shows no significant homology with the vitamin K-dependent
        serine proteases, coagulation cofactors, or any other protein
    - reference_id: Reactome:R-HSA-140748
      supporting_text: FVIIa is allosterically activated by TF, which increases the amidolytic activity of FVIIa
        by restructuring the active site region
    - reference_id: PMID:24998411
      supporting_text: Overexpression of miR-19b inhibited TF expression and procoagulant activity.
