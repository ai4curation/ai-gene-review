- term:
    id: GO:0061133
    label: endopeptidase activator activity
  evidence_type: IDA
  original_reference_id: PMID:3455766
  qualifier: enables
  review:
    summary: TF binds FVIIa and allosterically activates its endopeptidase activity toward FX and FIX.
    action: NEW
    reason: 'TF performs the cofactor work of the extrinsic Xase step: purified TF with FVIIa and calcium generates
      FXa (PMID:3455766), the FVIIa:TF crystal structure shows binding producing an enzymatically active complex
      (PMID:8598903), and Reactome records that TF allosterically activates FVIIa by restructuring its active site.
      GO:0061133 (''binds to and increases the activity of an endopeptidase'') describes exactly this, and TF itself
      has no protease activity (PMID:3037536). This is participation, not mere necessity: TF supplies the binding
      and allosteric activation while FVIIa catalyses cleavage. Mirrors the treatment of factor Va (F5) in this
      project. Comparator note: same-role cofactors (F5, F8, THBD) are mostly not annotated to this term in GOA,
      which reflects the historical use of contributes_to serine-type endopeptidase activity for TF rather than
      a deliberate exclusion.'
    supported_by:
    - reference_id: PMID:3455766
      supporting_text: A system consisting of tissue factor, factor VIIa, calcium ions, and coagulation factor X
        generated activated factor X at an appreciable rate.
    - reference_id: PMID:8598903
