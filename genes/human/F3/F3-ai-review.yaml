  review:
    summary: TF does not bind a cytokine; the family-root cytokine receptor IBA is over-propagated to TF.
    action: REMOVE
    reason: The IBD sits at PTN000466212, the root of PANTHER PTHR20859 (type II cytokine and tissue factor receptors),
      seeded only by interferon and interleukin receptor chains; TF is not a seed for this term. TF retained the
      class II cytokine-receptor fold but its ligand is the serine protease FVII/FVIIa, and TF signalling proceeds
      through PAR cleavage by the bound protease (PMID:16959886), not through cytokine binding and transmembrane
      signal transmission by TF itself. This is lineage-specific functional divergence; the TF clade should carry
      a PAINT loss for this term.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
