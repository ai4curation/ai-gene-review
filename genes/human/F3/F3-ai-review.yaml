  evidence_type: IDA
  original_reference_id: PMID:17469850
  qualifier: involved_in
  review:
    summary: TF-VIIa proteolytically activates the plasma protein FX; a correct but less informative framing of
      clotting-cascade initiation.
    action: KEEP_AS_NON_CORE
    reason: GO:0002541 is the proteolytic activation of plasma proteins as part of an acute inflammatory response.
      PMID:17469850 (abstract only) measures FX activation by TF-VIIa on phospholipid vesicles, so TF does take part
      in the proteolytic activation of a plasma protein, as the cofactor and allosteric activator of FVIIa. The
      inflammatory framing is GO's own placement, not an extra claim from this row; GO:0002543 activation of blood
      coagulation via clotting cascade, accepted from the same paper, is also part_of GO:0002526 acute inflammatory
      response. In the GO release used for validation (2026-07-26) GO:0002543 is not a descendant of GO:0002541,
      so this row is not entailed by it and TOO_GENERAL does not apply. GO:0002543 is the more informative
      description of what TF does, so this row is kept as non-core.
    supported_by:
    - reference_id: PMID:17469850
      supporting_text: The activation of coagulation factor X by tissue factor (TF) and coagulation factor VIIa
        (VIIa) on a phospholipid surface is thought to be the key step in the initiation of blood coagulation.
