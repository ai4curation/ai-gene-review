suggested_questions:
- question: Should PAINT add a loss (IKR) of GO:0004896 cytokine receptor activity and GO:0019221 cytokine-mediated
    signaling pathway for the tissue factor clade of PTHR20859, given that TF binds a protease rather than a cytokine?
- question: Is 'contributes_to serine-type endopeptidase activity' or 'endopeptidase activator activity' the preferred
    GO representation for non-catalytic cofactors of coagulation proteases (TF, FVa, FVIIIa, thrombomodulin)? Current
    GOA usage is inconsistent across these cofactors.
- question: What determines partitioning of cell-surface TF between the cryptic signalling pool (TF.PAR2) and the
    decrypted coagulant pool in vivo?
suggested_experiments:
- description: Knock-in mice or human cells expressing TF C209A (signalling-competent, coagulation-impaired) versus
    wild-type TF, to separate TF:FVIIa-PAR2 signalling outcomes (angiogenesis, migration, cytokine expression) from
    coagulation.
