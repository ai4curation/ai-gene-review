id: Q9NVH6
gene_symbol: TMLHE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TMLHE is a mitochondrial Fe(II)/2-oxoglutarate-dependent dioxygenase that
  catalyzes the first committed step of endogenous L-carnitine biosynthesis:
  hydroxylation of epsilon-N-trimethyllysine to 3-hydroxy-N-trimethyllysine
  in the mitochondrial matrix. It sits in the mitochondrial TMLHE subfamily of
  the gamma-butyrobetaine hydroxylase-related PANTHER family, distinct from the
  cytosolic BBOX1 dioxygenases that catalyze the pathway's terminal step.
