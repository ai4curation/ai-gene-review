core_functions:
- description: Sodium-independent, pH-sensitive secondary-active (anion-exchange) transmembrane uptake of amphipathic organic anions across the plasma membrane. OATP2B1 couples cellular uptake of an organic-anion substrate to efflux of a counter-anion (probably bicarbonate; glutamate in placenta), is stimulated at acidic extracellular pH, and is Na(+)- and Cl(-)-independent. It is the mechanistic core underlying uptake of steroid sulfates, bile acids, eicosanoids and many drugs.
  molecular_function:
    id: GO:0015291
    label: secondary active transmembrane transporter activity
  directly_involved_in:
  - id: GO:0043252
    label: sodium-independent organic anion transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0016323
    label: basolateral plasma membrane
  - id: GO:0009925
    label: basal plasma membrane
  supported_by:
  - *id002
  - *id004
  - *id005
- description: Na(+)-independent uptake of steroid sulfate conjugates - estrone 3-sulfate, dehydroepiandrosterone 3-sulfate and pregnenolone sulfate - the defining and best-characterized substrate class of OATP2B1, underlying placental uptake of fetal-derived sulfated steroids, hepatic/intestinal steroid-sulfate handling and blood-brain-barrier neurosteroid uptake. No non-obsolete GO MF term currently covers this activity (the generic organic-anion MF terms GO:0008514 and GO:0015347 are obsolete), so a proposed new term is used.
  proposed_molecular_function: steroid sulfate transmembrane transporter activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  substrates:
  - id: CHEBI:60050
    label: estrone 3-sulfate
  - id: CHEBI:57905
    label: dehydroepiandrosterone 3-sulfate
  - id: CHEBI:133000
    label: pregnenolone sulfate
  supported_by:
