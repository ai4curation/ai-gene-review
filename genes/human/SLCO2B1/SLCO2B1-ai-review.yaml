    supporting_text: uptake of DHEA-S by OATP2B1 was Na(+)-independent
  - reference_id: PMID:34628357
    supporting_text: dehydroepiandrosterone sulfate were only transported by hOATP2B1
  - *id002
proposed_new_terms:
- proposed_name: steroid sulfate transmembrane transporter activity
  proposed_definition: Enables the sodium-independent transfer of steroid sulfate conjugates (such as estrone 3-sulfate, dehydroepiandrosterone 3-sulfate and pregnenolone sulfate) from one side of a membrane to the other.
  justification: The defining molecular function of OATP2B1 (and related OATPs such as OATP1B1/1B3, OATP1A2) is Na(+)-independent uptake of steroid sulfate conjugates, but the generic organic-anion MF terms that previously covered it - GO:0008514 (organic anion transmembrane transporter activity) and GO:0015347 (sodium-independent organic anion transmembrane transporter activity) - are now obsolete with no replacement, and no steroid-sulfate-specific MF term exists.
  proposed_parent:
    id: GO:0022857
    label: transmembrane transporter activity
suggested_questions:
- question: What is the definitive transport mechanism and stoichiometry of OATP2B1? Evidence supports Na(+)-independent anion exchange with bicarbonate (and placental glutamate) as counter-anions and marked pH stimulation, but a proton-coupled (1:1 H+:E1S) model has also been proposed; resolving coupling ion(s) would fix the correct secondary-active vs facilitative MF placement.
- question: 'Is OATP2B1 physiologically apical or basolateral in the enterocyte? UniProt flags this as uncertain (apical: PMID:12724351; basolateral: PMID:28408210); the answer determines whether its primary intestinal role is drug absorption from the lumen or uptake from blood.'
- question: How quantitatively important is the newly described heme-import / iron-availability activity of OATP2B1 (PMID:35714613) in microglia and brain iron homeostasis in vivo, and should a heme transmembrane transporter activity be annotated as a core function?
suggested_experiments:
- description: Reconstitute purified OATP2B1 in proteoliposomes and measure estrone-3-sulfate uptake while independently controlling trans-side bicarbonate, glutathione, glutamate and the pH gradient, with electrophysiological recording, to establish the counter-anion(s), coupling stoichiometry and electrogenicity unambiguously.
- description: Determine the OATP2B1 structure (cryo-EM) in apo and substrate-bound states to map the high- and low-affinity binding sites inferred from biphasic E1S kinetics (PMID:22201122) and the roles of His-136 (pH sensing) and W611.
- description: Use polarized human enterocyte/organoid models with endogenous tagging to resolve apical vs basolateral OATP2B1 localization and directional substrate flux, settling the enterocyte localization controversy.
- description: Test Slco2b1-deficient mouse microglia and conditional knockouts for heme/iron-handling phenotypes to quantify the in vivo contribution of OATP2B1 heme import to brain iron availability.
