id: O94956
gene_symbol: SLCO2B1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLCO2B1 encodes OATP2B1 (also OATP-B / SLC21A9), a 709-residue, 12-transmembrane-domain member of the organic anion transporting polypeptide (OATP/SLCO) family within the major facilitator superfamily. It is a sodium-independent, pH-sensitive plasma-membrane uptake carrier for amphipathic organic anions that most likely works as an electroneutral anion exchanger, coupling cellular uptake of an organic anion to efflux of a counter-anion such as bicarbonate (and, in placenta, cytoplasmic glutamate); transport is strongly stimulated at acidic extracellular pH and is not Na(+)- or chloride-coupled. Its best-established substrates are steroid sulfate conjugates - estrone 3-sulfate, dehydroepiandrosterone 3-sulfate and pregnenolone sulfate - and it also transports bile acids (taurocholate, at acidic pH), eicosanoids (prostaglandins E1/E2/D2, leukotriene C4, thromboxane B2), L-thyroxine, coproporphyrin III, the neuropeptides substance P and vasoactive intestinal peptide, heme, and a broad range of drugs (statins, fexofenadine, antifolates, aspirin and others). OATP2B1 is expressed at the plasma membrane of many tissues, including the hepatocyte sinusoidal/basal membrane, intestinal enterocytes, placental syncytiotrophoblast (basal membrane), Sertoli cells of the blood-testis barrier, brain-capillary endothelium of the blood-brain barrier, retina, mammary gland and heart, with apical versus basolateral enterocyte localization remaining debated. Through these activities it contributes to placental and hepatic handling of sulfated steroids, intestinal and hepatic drug absorption and disposition, and - via a recently described microglia-enriched heme-import activity - cellular iron availability.
