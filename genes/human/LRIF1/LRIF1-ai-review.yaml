- gap_statement: >-
    How LRIF1 and SMCHD1 repress D4Z4 after somatic recruitment remains unresolved,
    including whether LRIF1 is recruited through H3K9me3/HP1 or another chromatin
    factor and whether the auxiliary pathway acts by higher-order compaction.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Somatic LRIF1 or SMCHD1 loss does not reproduce the underlying D4Z4 chromatin
