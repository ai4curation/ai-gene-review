    The cellular functions of the short LRIF1 isoform remain untested. Its sequence
    lacks residues 1-536 but retains the HP1-binding motif, both nuclear-localization
    signals, and the coiled coil; retention of these features alone does not establish
    HP1 binding, chromatin recruitment, or functional equivalence to the long isoform.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Long-isoform loss is linked to D4Z4 relaxation and DUX4 derepression, so resolving
    what the short product can and cannot do is essential for interpreting
    isoform-specific disease mechanisms and avoiding unsupported annotation transfer.
  provenance:
  - reference_id: PMID:32467133
    supporting_text: |-
      This mutation resulted in the absence of the
      long isoform of LRIF1 protein, D4Z4 chromatin relaxation, and DUX4 and DUX4
      target gene expression in myonuclei, all molecular and epigenetic hallmarks of
      FSHD.
  - reference_id: PMID:37380887
    supporting_text: |-
