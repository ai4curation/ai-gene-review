suggested_experiments:
- hypothesis: >-
    The short LRIF1 isoform retains some HP1-dependent chromatin activity because it
    preserves the LRVCL motif, nuclear-localization signals, and coiled coil, but lacks
    long-isoform-specific targeting or regulatory information in residues 1-536.
  description: >-
    Engineer isoform-specific endogenous loss and matched rescue in human female cells
    and myoblasts using near-endogenous long or short LRIF1. Compare wild type with an
    LRVCL-to-LRDCE motif mutant and targeted NLS/coiled-coil mutants; measure HP1 and
    SMCHD1 binding, nuclear localization, Xi and D4Z4 occupancy, chromatin compaction,
    DUX4 expression, and mitotic segregation. This directly tests sequence-based
    isoform predictions without presuming functional equivalence.
  experiment_type: isoform-resolved genetics and cell biology
- hypothesis: >-
    LRIF1 physically bridges an HP1 chromoshadow-domain dimer to SMCHD1 through a
    distinct, structurally unmapped interface.
  description: >-
    Reconstitute human LRIF1 fragments with HP1alpha or HP1gamma and SMCHD1 domains,
    map direct contacts by quantitative binding and cross-linking mass spectrometry,
    and use NMR or another disorder-compatible structural method for the HP1-bound
    motif. Validate separation-of-function mutants at endogenous expression in cells.
  experiment_type: biochemical reconstitution and structural mapping
- hypothesis: >-
    LRIF1 uses locus- and cell-state-specific recruitment routes at inactive X, D4Z4,
    and mitotic centromeres rather than a single universal HP1-SMCHD1 mechanism.
  description: >-
    Acutely degrade endogenous LRIF1, HP1 paralogs, or SMCHD1 in human female somatic
    cells and differentiating myoblasts, then perform time-resolved CUT&RUN/ChIP,
    chromosome conformation capture, microscopy, and nascent RNA profiling at Xi,
    D4Z4, and centromeres. Acute perturbation limits adaptive effects and directly
    separates recruitment, compaction, and transcriptional consequences.
  experiment_type: locus-resolved chromatin genomics
- hypothesis: >-
    LRIF1 corepresses a restricted set of ligand-activated nuclear-receptor targets
    through stimulus-dependent recruitment of specific histone deacetylases.
  description: >-
    Use endogenous LRIF1 degron cells exposed to retinoic acid and selected nuclear
    receptor ligands, combining receptor/LRIF1/HDAC occupancy profiling, interaction
    proteomics, nascent transcription, and rescue with receptor-binding or repression
    domain mutants. This would identify physiological partners and distinguish direct
    corepression from reporter-specific effects.
  experiment_type: ligand-resolved functional genomics
