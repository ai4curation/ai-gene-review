core_functions:
- description: >-
    LRIF1 binds the chromoshadow domain of HP1 through its C-terminal LRVCL
    PxVxL-class motif; the experimentally tested VCL-to-DCE substitution disrupts
    this interaction. In human cells this activity has separable outputs:
    LRIF1/HBiX1 and SMCHD1 connect H3K9me3/HP1 and XIST-H3K27me3 domains to compact
    the inactive X, while mitotic LRIF1 recruits HP1alpha to centromeres and thereby
    supports inner-centromere Aurora B activity and accurate chromosome segregation.
    Mouse evidence supports LRIF1-HP1gamma-dependent SMCHD1 loading at H3K9me3
    chromosome-arm sites but also reveals a parallel inactive-X route, so it does
    not establish a universal recruitment mechanism for human LRIF1.
  supported_by:
