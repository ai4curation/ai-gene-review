id: Q5T3J3
gene_symbol: LRIF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRIF1 is a 769-amino-acid nuclear chromatin-associated regulatory protein, also
  known as C1orf103, RIF-1, and HBiX1. No experimentally determined LRIF1 structure
  or catalytic activity is known. UniProt predicts disordered segments at residues
  378-400 and 528-562; the C-terminal region contains the HP1-binding LRVCL motif at
  residues 580-584, two nuclear-localization signals, and a terminal coiled coil.
  Through direct motif-dependent HP1 binding and association with SMCHD1, LRIF1 links
  HP1-marked and XIST-associated domains on the human inactive X chromosome and
  recruits HP1alpha to mitotic centromeres to support chromosome segregation. In a
  distinct locus and disease context, LRIF1 binds D4Z4, while loss or knockdown of the
  long isoform contributes to D4Z4 relaxation and DUX4 derepression in muscle; the
  binding assay was not isoform-resolved and the D4Z4 recruitment mechanism remains
  unresolved. LRIF1 also binds RARalpha and other nuclear receptors at the nuclear
  matrix and represses ligand-dependent transcription partly by recruiting histone
  deacetylases. The short isoform lacks residues 1-536 but retains the HP1 motif,
  nuclear-localization signals, and coiled coil by sequence; this retention is not
  evidence that it executes the same functions as the long isoform. LRIF1 is distinct
  from the replication-timing factor RIF1 (Q5UIP0) and from the CAF-1 chromatin
  assembly complex.
