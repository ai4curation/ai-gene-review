suggested_questions:
- question: >-
    Is the reported ANAPC11-dependent K11-linked ubiquitination of FOXO3 in bladder cancer cells a canonical
    APC/C-CDC20/CDH1 reaction with a recognisable degron, or an APC/C-independent activity of the free
    ANAPC2-ANAPC11 module? If the latter, should GO capture a non-APC/C context for ANAPC11?
- question: >-
    Should GO represent the APC/C RING subunit's E2-selective activities (UBE2C engagement for chain initiation
    versus repurposing of the RING exosite to position the acceptor ubiquitin for UBE2S elongation) with
    distinct, more specific molecular-function terms than ubiquitin protein ligase activity?
- question: >-
    The HPA nucleolus localization is uncorroborated and no APC/C activity is known there; should IDA
    localization rows for very small subunits (84 aa) from single-antibody immunofluorescence be retained
    without an orthogonal method?
suggested_experiments:
- hypothesis: >-
    The ANAPC11 RING E2-binding surface (the UBE2C-clasping interface with the ANAPC2 WHB domain) and
    the RING exosite that positions the acceptor ubiquitin for UBE2S are separable, with the former required
    for chain initiation and the latter for K11 elongation.
  description: >-
    Reconstitute recombinant human APC/C with structure-guided ANAPC11 point mutants at the UBE2C interface
    and at the ubiquitin-binding exosite; assay priming of a D-box substrate by UBE2C, K11 elongation
    by UBE2S, and mitotic timing after rescue of ANAPC11-depleted cells with each mutant.
  experiment_type: structure-guided mutagenesis with in vitro ubiquitination kinetics and cellular 
    rescue
- hypothesis: >-
    FOXO3 turnover attributed to ANAPC11 in urothelial carcinoma depends on the intact APC/C and a coactivator
    rather than on free ANAPC11.
  description: >-
    Compare FOXO3 ubiquitination and half-life after depletion of ANAPC11, ANAPC2, CDC20 and FZR1, and
    reconstitute FOXO3 ubiquitination in vitro with purified APC/C plus UBE2C/UBE2S in the presence and
    absence of coactivator and of FOXO3 degron mutants.
  experiment_type: genetic epistasis and in vitro reconstitution
- hypothesis: >-
    Endogenous ANAPC11 co-localises with the APC/C on mitotic chromosomes, spindle and centrosomes and
    is not enriched in the nucleolus.
  description: >-
    Endogenously tag ANAPC11 with a fluorescent protein by CRISPR knock-in in RPE-1 cells, image through
    the cell cycle alongside tagged APC8/CDC20, and validate with an orthogonal antibody in ANAPC11-knockdown
    controls.
  experiment_type: endogenous tagging and live-cell imaging
