  - UniProtKB:Q9UBF6
  review:
    summary: >-
      PAINT inference (PTN000129805, the RING-box family node spanning RBX1/RBX2/APC11) that ANAPC11 is
      active in the nucleus; consistent with GFP-ANAPC11 imaging showing nuclear and cytoplasmic distribution
      and with nuclear APC/C-CDH1 activity in G1.
    action: ACCEPT
    reason: >-
      The IBA is placed at the RING-box family node, where the experimental descendants (yeast Apc11 and
      Rbx1, fly and mouse Rbx1, human RBX1/ANAPC11) act on nuclear substrates; the APC/C-CDH1 ligase is
      nuclear through late mitosis and G1 and ANAPC11 itself appears in its own WITH/FROM because the
      human experimental annotation was one of the descendant evidences. Nucleus is therefore a well-founded,
      if broad, site of ANAPC11 activity.
    supported_by:
    - reference_id: file:human/ANAPC11/ANAPC11-uniprot.txt
      supporting_text: >-
        SUBCELLULAR LOCATION: Cytoplasm {ECO:0000269|PubMed:11573242}. Nucleus {ECO:0000269|PubMed:11573242}.
