id: Q9NYG5
gene_symbol: ANAPC11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ANAPC11 (APC11) is the 84-residue RING-H2 zinc-finger subunit of the anaphase-promoting complex/cyclosome
  (APC/C), the multisubunit cullin-RING E3 ubiquitin ligase that drives progression through mitosis and
  G1. Together with the cullin-like subunit ANAPC2 it forms the catalytic module of the complex: the APC11
  RING binds the ubiquitin-charged E2 enzymes UBE2C (UbcH10), which primes substrates with the first ubiquitin,
  and UBE2S, which extends chains through lysine-11 linkages, and activates them for direct transfer of
  ubiquitin to lysine residues in substrates or in attached ubiquitin. ANAPC11 does not form a ubiquitin
  thioester and does not itself recognise substrates; degron (D-box, KEN-box, ABBA) recognition is supplied
  by the coactivators CDC20 and CDH1/FZR1 together with ANAPC10, and coactivator binding and mitotic phosphorylation
  swing the ANAPC2-ANAPC11 module into a conformation that permits E2 access. The APC/C assembles predominantly
  K11-linked and K11/K48-branched polyubiquitin chains that target substrates for proteasomal degradation.
  Through this activity ANAPC11 executes the ubiquitination of securin and cyclin B1 that triggers sister-chromatid
  separation and mitotic exit, the ordered destruction of cyclin A, NEK2A, CDC20, SKP2, geminin and other
  regulators, and the ubiquitylation-dependent release of the mitotic checkpoint complex from the APC/C.
  It also contributes to K11/K48-branched chain formation on misfolded and aggregation-prone proteins.
  ANAPC11 is nuclear and cytoplasmic, is expressed in all tissues, is essential for cell proliferation,
  and belongs to the RING-box family alongside the cullin partners RBX1 and RBX2, from which it differs
  by pairing specifically with ANAPC2 rather than with canonical cullins.
