- term:
    id: GO:0034450
    label: ubiquitin-ubiquitin ligase activity
  evidence_type: IDA
  original_reference_id: PMID:10230407
  qualifier: enables
  review:
    summary: >-
      Ohta et al. showed that APC11 immunocomplexes catalyse E1/E2-dependent isopeptide ligation to form
      polyubiquitin chains. The term applied, however, is defined as isoenergetic ubiquitin transfer onto
      an existing chain through thioester linkages on cysteine residues, a transthiolation chemistry that
      RING E3s do not perform.
    action: MODIFY
    reason: >-
      The experiment is sound and the biology (ubiquitin-chain formation by the APC11 RING with an E2)
      is real, but GO:0034450 as defined describes thioester-to-thioester transfer (E1/E2-type chemistry).
      ANAPC11 is a RING E3 that has no catalytic cysteine and does not form a ubiquitin thioester; it
      activates the E2~Ub conjugate for aminolysis by a substrate or acceptor-ubiquitin lysine, forming
      isopeptide bonds. The same paper is already the source of the GO:0061630 ubiquitin protein ligase
      activity IDA on ANAPC11, which is the correct term for isopeptide chain formation, and chain elongation
      on ubiquitin lysines is captured by GO:0070979 protein K11-linked ubiquitination.
    proposed_replacement_terms:
    - id: GO:0061630
      label: ubiquitin protein ligase activity
    supported_by:
    - reference_id: PMID:10230407
      supporting_text: >-
        ROC1 and APC11 immunocomplexes can catalyze isopeptide ligations to form polyubiquitin chains
        in an E1- and E2-dependent manner.
    - reference_id: file:human/ANAPC11/ANAPC11-deep-research-falcon.md
      supporting_text: >-
        Unlike HECT or RBR E3s, ANAPC11 is not known to accept ubiquitin onto a catalytic cysteine.
    - reference_id: PMID:18485873
      supporting_text: >-
        To nucleate chains, the APC/C links ubiquitin to a lysine in substrates, but to elongate chains
        it modifies lysine residues in attached ubiquitin moieties.
