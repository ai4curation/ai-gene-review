core_functions:
- description: >-
    RING E3 catalytic subunit of the anaphase-promoting complex/cyclosome: the ANAPC11 RING-H2 domain,
    docked on the cullin homology domain of ANAPC2, binds and activates the ubiquitin-charged E2s UBE2C
    (chain initiation on substrate lysines) and UBE2S (K11-linked chain elongation) so that ubiquitin
    is transferred to coactivator-bound D-box/KEN-box substrates such as securin, cyclin B1, cyclin A,
    NEK2A and CDC20, driving their proteasomal degradation at the metaphase/anaphase transition, mitotic
    exit and G1.
