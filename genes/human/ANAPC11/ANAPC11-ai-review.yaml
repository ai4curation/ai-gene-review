- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32814053
  qualifier: enables
  supporting_entities:
  - UniProtKB:O43933
  review:
    summary: >-
      Generic protein binding from a systematic yeast two-hybrid interactome of neurodegenerative-disease
      proteins; the partner recorded is PEX1 (O43933), a peroxisomal AAA-ATPase with no known connection
      to APC/C function.
    action: REMOVE
    reason: >-
      The annotation is uninformative: 'protein binding' says nothing about what ANAPC11 does, and the
      source is a large-scale Y2H screen in which ANAPC11 was one of thousands of prey proteins; the paper
      does not characterise the ANAPC11-PEX1 pair, and no follow-up work places PEX1 in APC/C biology.
      Removal does not assert that the binary interaction is false, only that it does not support a molecular-function
      annotation. ANAPC11's informative binding activities are cullin family protein binding (GO:0097602,
      for ANAPC2) and E2 engagement, which are annotated separately.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: >-
        is generated by systematic yeast two-hybrid interaction screening of ~500 ND-related proteins
        and integration of literature interactions
    - reference_id: PMID:10230407
      supporting_text: >-
        ROC1 and ROC2 commonly interact with all cullins while APC11 specifically interacts with APC2,
        a cullin-related APC subunit.
