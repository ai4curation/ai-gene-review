existing_annotations:
- term:
    id: GO:0000278
    label: mitotic cell cycle
  evidence_type: TAS
  original_reference_id: PMID:11739784
  qualifier: involved_in
  review:
    summary: >-
      Tang et al. reconstituted the APC2-APC11 ubiquitin ligase module and showed it ubiquitinates securin
      and cyclin B1, the substrates whose destruction triggers sister-chromatid separation and mitotic
      exit; the generic term 'mitotic cell cycle' captures this only at the coarsest level.
    action: MODIFY
    reason: >-
      The annotation is correct but too shallow: the same paper already supports the specific processes
      annotated on ANAPC11 (positive regulation of mitotic metaphase/anaphase transition, GO:0045842 IDA;
      protein ubiquitination, GO:0016567 IDA), and the biology it demonstrates is that APC/C ubiquitination
      of securin and mitotic cyclins drives the metaphase/anaphase transition. GO:0007091 metaphase/anaphase
      transition of mitotic cell cycle is the precise process that this TAS row is standing in for; the
      APC/C-dependent catabolic process GO:0031145 is separately annotated.
    proposed_replacement_terms:
    - id: GO:0007091
      label: metaphase/anaphase transition of mitotic cell cycle
    supported_by:
    - reference_id: PMID:11739784
      supporting_text: >-
        In mitosis, the anaphase-promoting complex (APC) regulates the onset of sister-chromatid separation
        and exit from mitosis by mediating the ubiquitination and degradation of the securin protein and
        mitotic cyclins.
    - reference_id: PMID:11739784
      supporting_text: >-
        In combination with Ubc4 or UbcH10, a heterodimeric complex of APC2 and APC11 is sufficient to
        catalyze the ubiquitination of human securin and cyclin B1.
- term:
    id: GO:0001664
    label: G protein-coupled receptor binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8K4P2
  - ensembl:ENSRNOP00000051837
  review:
    summary: >-
      Ensembl Compara orthology transfer whose WITH/FROM source is rat UniProtKB:Q8K4P2 (ENSRNOP00000051837),
      which is rat neuropeptide B (Npb), a secreted GPCR ligand, not an APC11 ortholog. The transfer is
      a mis-mapping and has no basis in ANAPC11 biology.
    action: REMOVE
    reason: >-
      ANAPC11 is an 84-residue intracellular RING-H2 subunit of the APC/C E3 ligase with no signal peptide
      and no reported GPCR interactions; the only literature-grounded binding partners are the cullin
      homology domain of ANAPC2 and the E2 enzymes UBE2C/UBE2D and UBE2S. The rat source annotation for
      GO:0001664 belongs to Npb (neuropeptide B, RGD IMP PMID:12118011 and InterPro IPR013297), so the
      Compara projection linked the wrong rat gene product to human ANAPC11. This is an electronic inference
      that is demonstrably wrong, which is the case for which REMOVE is intended.
    supported_by:
    - reference_id: PMID:11739784
      supporting_text: >-
        Both APC11 and UbcH10 bind to the C-terminal cullin homology domain of APC2, whereas Ubc4 interacts
        with APC11 directly.
    - reference_id: file:human/ANAPC11/ANAPC11-deep-research-falcon.md
      supporting_text: >-
        Together with cullin-like ANAPC2, it forms the catalytic module that recruits an E2~ubiquitin
        conjugate and promotes direct ubiquitin transfer to substrate lysines.
- term:
    id: GO:0004842
    label: ubiquitin-protein transferase activity
  evidence_type: IDA
  original_reference_id: PMID:11739784
  qualifier: contributes_to
  review:
    summary: >-
      Direct assay: a baculovirus-expressed APC2-APC11 heterodimer with UBE2D (Ubc4) or UBE2C (UbcH10)
      is sufficient to ubiquitinate securin and cyclin B1, establishing that APC11 contributes the RING
      catalytic element of the APC/C ubiquitin-protein transferase.
    action: ACCEPT
    reason: >-
      The contributes_to qualifier is appropriate: the E3 activity is a property of the APC2-APC11 module
      (and, physiologically, the whole APC/C with a coactivator), and APC11 is the RING component that
      engages and activates the ubiquitin-charged E2. Ubiquitin-protein transferase activity is the parent
      of ubiquitin protein ligase activity (GO:0061630), which is also annotated; both are correct and
      this is the term used for ANAPC11 in the GO-CAM model of the APC/C. Note the minimal module lacks
      substrate specificity, which is supplied by coactivators and APC10 in the intact complex.
    supported_by:
    - reference_id: PMID:11739784
      supporting_text: >-
        In combination with Ubc4 or UbcH10, a heterodimeric complex of APC2 and APC11 is sufficient to
        catalyze the ubiquitination of human securin and cyclin B1.
    - reference_id: PMID:11739784
      supporting_text: >-
        However, the minimal APC2/11 ubiquitin ligase module does not possess substrate specificity, because
        it also ubiquitinates the destruction box deletion mutants of securin and cyclin B1.
    - reference_id: PMID:16364912
      supporting_text: >-
        bound substrates are ubiquitinated by E2 enzymes that interact with a hetero-dimer of the RING
        subunit Apc11 and the cullin Apc2
