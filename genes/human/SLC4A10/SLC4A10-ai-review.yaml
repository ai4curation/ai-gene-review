id: Q6U841
gene_symbol: SLC4A10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC4A10 (also known as NCBE or NBCn2) is a polytopic plasma-membrane protein of the SLC4 bicarbonate-transporter family (anion exchanger superfamily, TC 2.A.31). It catalyzes sodium-coupled bicarbonate transport, moving extracellular Na+ and HCO3- into the cell and thereby raising intracellular pH. The human protein behaves functionally as an electroneutral Na+/HCO3- cotransporter accompanied by a DIDS-sensitive Cl- self-exchange; whether it also performs net Na+-driven Cl-/HCO3- exchange is debated, with direct human data indicating that net Cl-/HCO3- exchange does not occur under physiological conditions, even though rodent orthologs were originally characterized as Na+-driven Cl-/HCO3- exchangers. The protein is predominantly expressed in brain and is also found in choroid plexus epithelium, retina and kidney. It localizes to the basolateral plasma membrane (and the apical membrane in some epithelia such as renal proximal tubule), and in neurons to dendrites, axons and axon
  terminals, the perikaryon/soma, and pre- and postsynaptic membranes, including GABAergic inhibitory synapses. Through regulation of intracellular and brain extracellular pH it contributes to cerebrospinal fluid secretion by the choroid plexus, neuronal pH homeostasis, modulation of GABAergic transmission and neuronal excitability, and retinal pH homeostasis. Biallelic loss-of-function variants cause an autosomal recessive neurodevelopmental disorder with hypotonia, intellectual disability, autistic features, seizures and characteristic lateral-ventricle brain abnormalities (NEDHBA).
