suggested_questions:
- question: Does human SLC4A10 perform net Na+-driven Cl-/HCO3- exchange in any native cell type or physiological condition, or is its activity restricted to electroneutral Na-HCO3 cotransport with futile Cl-/Cl- self-exchange?
- question: What is the in vivo transport stoichiometry (Na+ to HCO3-) and the molecular basis of the chloride self-exchange, and do splice variants or binding partners switch the protein between cotransport and exchange modes?
- question: Which transport activity (cotransport vs. exchange) and which cellular location (basolateral vs. apical; neuronal synaptic membranes) is most relevant to the NEDHBA neurodevelopmental phenotype?
suggested_experiments:
- description: Measure Na+-, HCO3-- and Cl--dependent fluxes and membrane potential of the human protein (and disease variants) reconstituted in a polarized epithelial or neuronal system, rather than only Xenopus oocytes, to resolve whether net Cl-/HCO3- exchange occurs under physiological ionic conditions.
- description: Determine the apical vs. basolateral targeting of SLC4A10 in choroid plexus epithelium and renal proximal tubule using endogenous-tag or validated antibodies, to establish the polarized location underlying CSF secretion and bicarbonate handling.
- description: Use conditional/neuron-specific loss-of-function models to test whether presynaptic pH regulation by SLC4A10 is required for GABA release and short-term plasticity, linking the transport activity to the GABAergic transmission defect seen in NEDHBA.
