- term:
    id: GO:0140892
    label: sodium,bicarbonate:chloride antiporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:2150150
  - PANTHER:PTN002606583
  - RGD:631407
  review:
    summary: Phylogenetic (PAINT/IBA) assignment of Na+-driven Cl-/HCO3- exchanger activity, the mode for which the gene product (NCBE) was originally named.
    action: KEEP_AS_NON_CORE
    reason: This antiporter (Na+-driven Cl-/HCO3- exchange) activity is genuinely debated for the human protein. The gene was named NCBE on the basis of this activity in the mouse ortholog (Wang et al., 2000, PMID:10993873), and UniProt retains the exchanger reaction by similarity. However, Parker et al. (2008) showed that human SLC4A10 does not normally couple net HCO3- influx to net Cl- efflux, and that the chloride movement is a DIDS-sensitive Cl-/Cl- self-exchange; a small Na+-driven Cl-/HCO3- exchange was seen only under non-physiological, Cl--free conditions (PMID:18319254). The term is therefore retained as non-core rather than core, reflecting the rodent/by-similarity support and the futile Cl-/Cl- exchange, with the net exchanger role flagged as uncertain. It is not removed because it reflects a real (if conditional) activity placed at the family node and retained by UniProt.
    supported_by:
    - reference_id: PMID:10993873
      supporting_text: NCBE is a Na(+)-driven Cl(-)/HCO(3)(-) exchanger that regulates intracellular pH in native cells
    - reference_id: PMID:18319254
      supporting_text: human NCBE does not normally couple the net influx of HCO(3)(-) to a net efflux of Cl(-)
