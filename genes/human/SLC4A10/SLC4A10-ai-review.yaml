  - ensembl:ENSRNOP00000070628
  review:
    summary: Electronic assignment of Na+-driven Cl-/HCO3- exchanger activity, transferred from rodent orthologs.
    action: KEEP_AS_NON_CORE
    reason: Same rationale as the IBA row for this term; a debated, non-core activity reflecting the rodent orthologs and the UniProt by-similarity catalytic reaction. Direct human data indicate net Cl-/HCO3- exchange does not occur physiologically (PMID:18319254), so the core activity is the electroneutral Na-HCO3 cotransport (GO:0008510).
    supported_by:
    - reference_id: file:human/SLC4A10/SLC4A10-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: 2 hydrogencarbonate(out) + chloride(in) + Na(+)(out) = 2 hydrogencarbonate(in) + chloride(out) + Na(+)(in)
