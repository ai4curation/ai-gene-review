- term:
    id: GO:0006821
    label: chloride transport
  evidence_type: NAS
  original_reference_id: PMID:10993873
  qualifier: involved_in
  review:
    summary: Non-traceable author statement based on the original characterization of the SLC4A10 gene product as a Na+-driven Cl-/HCO3- exchanger (Wang et al., 2000), which moves chloride.
    action: KEEP_AS_NON_CORE
    reason: Chloride handling is a genuine but non-core aspect of SLC4A10. Wang et al. (2000) characterized NCBE as transporting Na+ and HCO3- in exchange for intracellular Cl- (PMID:10993873). Parker et al. (2008) later showed that the human protein does not perform net Cl-/HCO3- exchange under physiological conditions and that the observed chloride movement is a DIDS-sensitive Cl-/Cl- self-exchange rather than net chloride transport (PMID:18319254). Either way chloride is moved across the membrane, so the term is retained as non-core, with the net direction/role noted as debated.
    supported_by:
    - reference_id: PMID:10993873
      supporting_text: it transports extracellular Na(+) and HCO(3)(-) into cells in exchange for intracellular Cl(-) and H(+), thus raising the intracellular pH
    - reference_id: PMID:18319254
      supporting_text: actually represents a CO(2)/HCO(3)(-)-stimulated Cl(-) self-exchange not coupled to either Na(+) or net HCO(3)(-) transport
