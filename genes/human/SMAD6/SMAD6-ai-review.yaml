id: O43541
gene_symbol: SMAD6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SMAD6 is an inhibitory SMAD that preferentially dampens BMP-dependent TGF-beta superfamily
  signaling. It acts in the cytoplasm and nucleus by binding BMP-activated SMAD1 to prevent SMAD1-SMAD4
  transcriptional complexes, and by serving as a SMURF-family ubiquitin-ligase adaptor for selected signaling
  and transcription-factor substrates including RUNX2, TBX6 and MYD88.
