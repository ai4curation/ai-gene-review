suggested_questions:
- question: Which endogenous human SMAD6 substrates require direct SMAD6-SMURF adaptor activity in physiological
    tissues rather than overexpression systems?
  experts: []
- question: Which SMAD6 disease variants selectively disrupt SMAD1 sequestration versus ubiquitin-ligase
    adaptor functions?
  experts: []
suggested_experiments:
- hypothesis: Disease-associated SMAD6 variants split BMP-SMAD1 sequestration defects from SMURF-adaptor
    defects.
  description: In a SMAD6-null human cardiovascular progenitor line, rescue with endogenous-level wild-type
    and patient SMAD6 variants, then compare BMP-induced SMAD1-SMAD4 complex formation, RUNX2/TBX6/MYD88
    turnover, and BMP reporter responses.
