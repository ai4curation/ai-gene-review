description: ANKS3 (ankyrin repeat and SAM domain-containing protein 3) is a ciliary scaffold with N-terminal
  ankyrin repeats and a C-terminal SAM domain. Its SAM domain self-polymerizes and binds ANKS6, and ANKS3
  recruits ANKS6 to the RNA-binding protein Bicc1, the three building large SAM-dependent assemblies.
  A C-terminal coiled coil of ANKS3 binds Bicc1 and inhibits its binding to target mRNAs, a switch relieved
  by ANKS6, which controls asymmetric decay of Dand5 mRNA in left-right patterning. A homozygous ANKS3
  variant is associated with a human laterality defect. Through its ankyrin repeats ANKS3 also binds the
  kinase NEK7 and keeps it in the cytoplasm, and it is present in renal cilia.
