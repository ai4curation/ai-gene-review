id: Q9UBV7
gene_symbol: B4GALT7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: B4GALT7 encodes a 327-residue, manganese-dependent type-II Golgi membrane glycosyltransferase
  of the GT7 family. Its lumen-facing catalytic domain transfers galactose from UDP-galactose
  to xylose attached to a serine of a proteoglycan core protein, forming a beta1,4 linkage. This
  first galactose is the second sugar of the shared tetrasaccharide linker used to assemble chondroitin
  sulfate, dermatan sulfate, heparan sulfate and heparin proteoglycans. Defective linker synthesis
  impairs proteoglycan glycanation and extracellular-matrix organization; biallelic pathogenic
  variants cause a spondylodysplastic Ehlers-Danlos syndrome.
