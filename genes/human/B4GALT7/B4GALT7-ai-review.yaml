  evidence_type: IDA
  original_reference_id: PMID:10438455
  qualifier: involved_in
  review:
    summary: The linker reaction contributes directly to glycosaminoglycan biosynthesis.
    action: ACCEPT
    reason: B4GALT7 catalyzes an actual glycosyl-transfer step, rather than merely being required
      by perturbation. Human enzyme expression rescues defective GAG synthesis and xyloside-priming
      experiments connect acceptor transfer to chain initiation. The shared linker serves chondroitin/dermatan/heparan
      sulfate and heparin proteoglycans; this does not extend the reaction to every GAG class.
    supported_by:
    - reference_id: PMID:10438455
      supporting_text: restored glycosaminoglycan synthesis
