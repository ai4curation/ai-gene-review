core_functions:
- description: Binds mitochondrial mRNAs and associates with mitoribosomes to support mitochondrial protein
    synthesis. Mouse RNA-binding-mutant and loss/rescue experiments establish the mechanistic connection;
    human mitoribosome association and mitochondrial disease support conservation. This translation-supporting
    role is distinct from recognition of methylated RNAs for clearance.
  molecular_function:
    id: GO:0003729
    label: mRNA binding
  directly_involved_in:
  - id: GO:0070131
    label: positive regulation of mitochondrial translation
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:22904065
  - reference_id: PMID:28942965
  - reference_id: PMID:9305894
- description: Recognizes m5C-marked mitochondrial RNAs and recruits PNPT1 to promote RNA turnover. Cellular
    methylated-RNA pulldown, crosslinking and partner-association experiments support the reader/adaptor
    mechanism; isolated-protein affinity and an intrinsic recognition site were not established by the
    inspected assays. NSUN4 performs methylation and PNPT1 performs RNA degradation.
  molecular_function:
    id: GO:0062153
    label: C5-methylcytidine-containing RNA reader activity
  directly_involved_in:
  - id: GO:0000957
    label: mitochondrial RNA catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:39019044
- description: Binds the globular region of C1q at the cell surface and modulates complement activation.
    Cell-derived and recombinant mature human protein inhibit complement-mediated hemolysis in the tested
    serum assay. Surface association and ligand recognition do not imply that C1QBP spans the membrane
    or performs complement-protease catalysis.
  molecular_function:
    id: GO:0001849
    label: complement component C1q complex binding
  directly_involved_in:
  - id: GO:0030449
    label: regulation of complement activation
  locations:
  - id: GO:0009986
    label: cell surface
  supported_by:
  - reference_id: PMID:8195709
- description: Binds the D5H region of high-molecular-weight kininogen, providing an extrinsic endothelial
    surface site for ligand presentation and contact-system assembly. Purified and recombinant protein
    binding distinguishes high- from low-molecular-weight kininogen. C1QBP does not cleave kininogen or
    perform the protease reactions of associated contact-system enzymes.
  molecular_function:
    id: GO:0030985
    label: high molecular weight kininogen binding
  locations:
  - id: GO:0009986
    label: cell surface
  supported_by:
  - reference_id: PMID:8662673
  - reference_id: PMID:8710908
