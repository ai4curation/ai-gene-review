id: Q07021
gene_symbol: C1QBP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: C1QBP (p32/gC1qR) is an acidic, predominantly mitochondrial RNA-associated protein with distinct
  extramitochondrial pools. The mature homotrimer supports mitochondrial protein synthesis through RNA
  and mitoribosome association. In a separate RNA-clearance pathway, C1QBP recognizes m5C-marked mitochondrial
  transcripts and recruits PNPT1 for turnover, helping limit the accumulation and cytosolic release of
  mitochondrial double-stranded RNA. At the cell surface, extrinsic C1QBP binds the globular region of
  C1q and high-molecular-weight kininogen, modulating complement and contact-system assemblies in cooperation
  with other surface proteins. Smaller nuclear and cytoplasmic pools regulate splicing, transcription,
  preribosome remodeling and MRE11-dependent DNA repair. Biallelic C1QBP defects cause mitochondrial disease
  with respiratory-chain deficiency and cardiomyopathy.
