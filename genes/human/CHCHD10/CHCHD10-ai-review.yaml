gene_symbol: CHCHD10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHCHD10 is a small CHCH-domain protein concentrated in the mitochondrial intermembrane space
  near cristae. It associates with CHCHD2 in human cells, forming heterodimers and higher-molecular-weight
  complexes. Human control fibroblasts contain CHCHD10-containing complexes of approximately 170 and 220
  kDa; differentiated mouse tissues contain complexes of approximately 100–140 kDa and retain CHCHD10
  oligomerization after CHCHD2 loss. The two proteins have partly redundant roles in mitochondrial membrane
  organization and respiratory homeostasis, including control of OMA1-dependent OPA1 processing. CHCHD10
  also promotes cytochrome-c oxidase activity in cellular and purified-component experiments, while a
  secondary nuclear pool participates in CXXC5-dependent repression of COX4I2 expression in human cells.
  Pathogenic variants differ in aggregation, residual activity and mitochondrial-stress effects.
