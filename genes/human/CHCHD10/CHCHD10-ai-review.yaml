core_functions:
- description: 'CHCHD10 binds CHCHD2 to form heterodimers in human cells in the mitochondrial intermembrane-space/cristae
    environment, within partly redundant roles in mitochondrial membrane organization and respiratory
    homeostasis. Human loss/re-expression experiments link the pair to OMA1-dependent OPA1 processing;
    a direct protease-inhibitory, chaperoning or membrane-scaffolding mechanism remains unresolved. Heterodimers
    coexist with higher-order complex populations: control human fibroblasts contain CHCHD10 in 170 and
    220 kDa complexes (PMID:29121267, Fig. 6A), while differentiated mouse tissues contain approximately
    100–140 kDa complexes and retain CHCHD10 oligomerization without CHCHD2 (PMID:41053020). These sizes
    are electrophoretic complex estimates, not exact stoichiometry or proof of one invariant assembly.
    MICOS membership remains disputed. Positive COX stimulation is retained as biological context, but
    the CHCHD2-dependent, potentially indirect association does not yet define a direct enzyme-activator
    MF or a specific respiratory step performed by CHCHD10; neither is added as a core term.'
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  directly_involved_in:
  - id: GO:0007007
    label: inner mitochondrial membrane organization
  locations:
  - id: GO:0005758
    label: mitochondrial intermembrane space
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:30084972
    supporting_text: CHCHD2 and CHCHD10 form heterodimers
  - reference_id: PMID:24934289
  - reference_id: PMID:32338760
  - reference_id: PMID:41053020
  - reference_id: PMID:29121267
    supporting_text: higher molecular weight complexes
- description: In the tested human HEK293 nuclear context, CHCHD10 acts as a transcriptional corepressor
    through CXXC5-dependent recruitment to an oxygen-responsive COX4I2 promoter complex. Intact-versus-mutant
    reporter and CHCHD10 perturbations resolve repression, while CXXC5 depletion prevents endogenous ORE
    recruitment. This is a secondary, experimentally defined activity; its wider tissue relevance remains
    unresolved and it does not imply that CHCHD10 itself binds DNA directly.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:29540477
    supporting_text: CXXC5 is necessary for CHCHD10 to function at the ORE
knowledge_gaps:
- gap_statement: The immediate molecular route connecting CHCHD10-containing complexes to OMA1/OPA1 and
    membrane homeostasis remains unresolved.
  boundary: Human CHCHD2 heterodimerization, localization, and WT re-expression effects on OPA1 processing
    are established. SLP2/PHB associations and COX stimulation provide additional functional evidence,
    but do not by themselves demonstrate a direct protease inhibitor, folding chaperone or ternary scaffold
    mechanism.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Separating the normal performed activity from variant aggregation and stress responses
    is necessary to interpret differing pathogenic mechanisms.
  resolution: Use sequence-defined purified components and endogenous expression-matched separation-of-function
    mutants to distinguish direct protease modulation, proteostasis effects and respiratory-complex regulation.
  provenance:
  - reference_id: PMID:32338760
  - reference_id: PMID:29540477
  - reference_id: PMID:35656794
suggested_questions:
- question: Under which cell, tissue and detergent conditions does CHCHD10 associate with MICOS, and is
    that association transient or a discrete complex population?
- question: How do human-cell heterodimers relate to the 170/220 kDa complexes in control human fibroblasts
    and the 100–140 kDa complexes in differentiated mouse tissues, and which changes reflect cell state,
    detergent conditions or composition?
- question: How general is the CXXC5-dependent nuclear repression pathway beyond the tested human cell
    lines, and how is it coordinated with mitochondrial CHCHD10 abundance?
- question: Does CHCHD10 contact a catalytic COX subunit directly during stimulation, or act through associated
    CHCHD2/MNRR1? Positive purified-COX supplementation and human-cell dependence are established. PMID:30084972
    explicitly discusses an indirect CHCHD10–COX interaction dependent on CHCHD2. Together with associated
    components in the COX preparation and unresolved recombinant reagent identity, this leaves the direct-interaction
    requirement of GO:0008047 unsettled.
suggested_experiments:
- description: Compare endogenous complex composition using quantitative native separation and orthogonal
    crosslinking across human cell types, with knockout controls, matched detergents and absolute subunit
    stoichiometry.
- description: Reconstitute CHCHD10 effects using sequence-defined human protein, COX preparations with
    quantified associated factors, and OMA1/OPA1 components to distinguish direct regulation from cellular
    compensation.
- description: Test nuclear CXXC5-dependent promoter occupancy and repression with endogenous localization-selective
    CHCHD10 perturbations and expression-matched rescue.
