id: Q9H765
gene_symbol: ASB8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ASB8 is an ankyrin repeat and SOCS box protein of the ASB family, the substrate-recognition
  subunit of a Cullin-RING (CRL5) E3 ubiquitin ligase. It is cytoplasmic and binds Elongin B/C through
  its SOCS box. ASB8 binds the antiviral kinases TBK1 and IKKi and drives their K48-linked ubiquitination
  and proteasomal degradation, lowering IRF3 phosphorylation and interferon-beta production; Ser17 phosphorylation
  enhances this activity. It is also the receptor through which nuclear-export inhibitors such as selinexor
  induce exportin-1 (XPO1) degradation: drug conjugation exposes a cryptic XPO1 site that ASB8 binds.'
