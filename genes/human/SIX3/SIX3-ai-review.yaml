core_functions:
- description: Sequence-specific homeodomain transcription factor that binds ATTA-core cis-regulatory elements and,
    by recruiting Groucho/TLE corepressors through its eh1-like motif, directly represses Wnt1 and Wnt8b in the
    anterior neuroectoderm and eye field, protecting forebrain and neuroretina identity from posteriorizing Wnt
    signals.
