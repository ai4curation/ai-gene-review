id: O95343
gene_symbol: SIX3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SIX3 is a SIX/sine oculis family homeodomain transcription factor of the Six3/6 (Optix) subfamily,
  expressed in the anterior neural plate, eye field, ventral forebrain, lens placode and developing pituitary. Through
  its Six domain and homeodomain it binds ATTA-core cis-regulatory elements; unlike Six1/2 family members it does
  not partner with EYA as a coactivator but recruits Groucho/TLE corepressors (TLE1, AES/TLE5) via an eh1-like motif,
  and acts mainly as a transcriptional repressor. It directly represses Wnt1 and Wnt8b, protecting the anterior
  neuroectoderm from posteriorizing Wnt signals so that the telencephalon, rostral diencephalon and neuroretina
  are specified, and represses its own promoter and gamma-crystallin. In other contexts it is an activator, directly
  inducing Shh in the rostral diencephalon ventral midline (via the SBE2 enhancer) and Pax6/Sox2 in presumptive
  lens ectoderm. SIX3 also binds geminin, antagonizing it to promote progenitor proliferation. It acts with PAX6
  in eye field specification and optic vesicle proximodistal patterning, and with HESX1 in pituitary development;
  postnatally it is needed for ependymal cell maturation. Heterozygous loss-of-function variants cause holoprosencephaly
  type 2 (HPE2) and have been reported in schizencephaly.
