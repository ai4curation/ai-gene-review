suggested_questions:
- question: Which SIX3 target genes are directly activated versus repressed in human forebrain progenitors, and
    what (partner, motif, or EYA/TLE availability) determines the switch?
- question: Is the SIX3-geminin interaction conserved and functionally important in mammalian (human) retinal progenitors,
    independent of SIX3 transcriptional activity?
- question: Should a NOT or caution be considered for GO:0001222 annotations based on geminin, given geminin's primary
    role as a replication-licensing inhibitor?
suggested_experiments:
- hypothesis: SIX3 represses a defined set of posteriorizing (Wnt pathway) genes in human anterior neural progenitors
    through Groucho/TLE recruitment, and HPE eh1-motif variants derepress them.
  description: CUT&RUN/ChIP-seq for SIX3 and TLE1 in human forebrain organoids, combined with SIX3 eh1-motif (HPE)
    mutant knock-in, to define Groucho-dependent repressed targets genome-wide.
  experiment_type: ChIP-seq
