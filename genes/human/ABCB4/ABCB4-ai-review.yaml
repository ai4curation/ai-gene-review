suggested_questions:
- question: Does a direct oriented-transport experiment test free ceramide, beyond the negative SM/GlcCer
    analog panel in PMID:8898203, sufficiently to support the two existing NOT ceramide annotations?
- question: Which ABCB4 peptides underlie the exosome assignment in PMID:23533145, and is the detected
    protein an intact functional transporter?
- question: Can the UniProt PE and sphingomyelin catalytic-reaction statements attributed to PMID:8898203
    be reconciled with that paper's MDR1/MDR3 substrate contrast? The cached source record is preserved
    unchanged.
- question: How do PC acyl-chain composition and bile-salt acceptors affect direct ABCB4 flux versus secondary
    cholesterol and other phospholipid efflux?
- question: Which ABCB4 drug interactions correspond to direct transport under physiological conditions
    rather than binding, ATPase modulation or inhibition?
