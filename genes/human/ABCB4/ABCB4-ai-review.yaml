id: P21439
gene_symbol: ABCB4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABCB4 is an ATP-dependent phosphatidylcholine floppase concentrated in the apical canalicular
  membrane of hepatocytes. Its two transmembrane and nucleotide-binding halves couple ATP utilization
  to movement of phosphatidylcholine from the cytosolic to the exoplasmic membrane leaflet. Bile salts
  extract the exposed phospholipid into bile, where it contributes to mixed lipid assemblies that reduce
  detergent injury and support cholesterol solubilization. Phosphatidylcholine is its established physiological
  lipid substrate; limited drug-substrate interactions also occur. Biallelic loss of functional ABCB4
  causes progressive familial intrahepatic cholestasis type 3, and reduced expression, trafficking or
  transport competence can produce other cholestatic phenotypes.
