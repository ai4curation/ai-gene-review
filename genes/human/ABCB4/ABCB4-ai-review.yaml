    reason: PMID:8898203 uses low-temperature epithelial assays to separate membrane translocation from
      vesicular secretion. ABCB4 executes the lipid-moving step; a positive-regulation term obscures that
      direct role. Preserve the measured process as phospholipid translocation.
    proposed_replacement_terms:
    - *id001
- term:
    id: GO:2001140
    label: positive regulation of phospholipid transport
  evidence_type: IMP
  original_reference_id: PMID:24045840
  qualifier: involved_in
  review:
    summary: Wild-type ABCB4 directly transports PC; mutations impair this step.
    action: MODIFY
    reason: PMID:24045840 compares PC secretion by wild-type and NBD-variant ABCB4 with similar expression/localization.
      This supports phospholipid translocation by the transporter, not an additional regulatory activity
      over another transporter.
    proposed_replacement_terms:
    - *id001
