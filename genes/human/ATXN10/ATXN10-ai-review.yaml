- id: PMID:15201271
  title: Ataxin-10, the spinocerebellar ataxia type 10 neurodegenerative disorder protein, is essential
    for survival of cerebellar neurons.
  findings:
  - statement: ATXN10 is a cytoplasmic armadillo-repeat protein.
    supporting_text: Atx-10 has an apparent molecular mass of approximately 55 kDa and belongs to the
      family of armadillo repeat proteins.
  - statement: ATXN10 is cytoplasmic/perinuclear in brain.
    supporting_text: Atx-10 immunostaining of mouse and human brain sections revealed a predominantly
      cytoplasmic and perinuclear localization with a clear restriction to olivocerebellar regions.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
