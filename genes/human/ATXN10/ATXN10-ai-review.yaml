  title: Mapping the NPHP-JBTS-MKS protein network reveals ciliopathy disease genes and pathways.
  findings:
  - statement: ATXN10 binds NPHP5; mutation causes nephronophthisis.
    supporting_text: We identified the protein encoded by ATXN10, Ataxin10, as an NPHP5 interacting protein.
  - statement: Atxn10 knockdown modestly impairs ciliogenesis.
    supporting_text: Depletion of Atxn10 in 3D kidney culture leads to modest defects in both spheroid
      organization and ciliogenesis (Figure S6E-F).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:21857149
  title: Phosphorylation of Ataxin-10 by polo-like kinase 1 is required for cytokinesis.
  findings:
  - statement: ATXN10 knockdown causes cytokinesis failure; PLK1 phosphorylates it.
    supporting_text: Knockdown of ATXN10 with siRNA in HeLa cells results in cytokinesis defects-multinucleation,
      which are rescued by wild-type Ataxin-10, but not the phosphor-deficient 2A mutant.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
