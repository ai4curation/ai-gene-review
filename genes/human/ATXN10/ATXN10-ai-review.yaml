    summary: Protein binding (IPI) with GNB2 (G-protein beta2). The interaction was found by Y2H and confirmed
      by co-IP and colocalization, and co-expression of ATXN10 with Gbeta2 activates Ras-MAPK signalling
      in PC12 cells. G-protein beta-subunit binding is the informative term.
    action: MODIFY
    reason: '[PMID:16498633 "By using yeast-two-hybrid screening of a human brain cDNA library, we identified
      the G-protein beta2 subunit (Gbeta2) as an ataxin 10 binding partner, and the interaction was confirmed
      by coimmunoprecipitation and colocalization in mammalian cells in culture."]'
