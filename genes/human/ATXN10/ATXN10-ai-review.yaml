id: Q9UBB4
gene_symbol: ATXN10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATXN10 (ataxin-10) is a cytoplasmic armadillo-repeat protein. During cytokinesis it is phosphorylated
  by Aurora B (S12) and PLK1 (S77/T82) and concentrates at the midbody, and its depletion causes cytokinesis
  failure. It also sits near the ciliary base and binds the transition-zone protein NPHP5. Homozygous
  splice mutation causes nephronophthisis, although its loss in mice does not overtly disrupt cilia. Atxn10
  is essential in mice for heart development and for adult epithelial homeostasis, where its loss triggers
  epithelial-mesenchymal transition. In neurons it binds G-protein beta2 and can promote neurite outgrowth.
  Spinocerebellar ataxia type 10 is caused by expansion of an ATTCT repeat in an ATXN10 intron.
