core_functions:
- description: Cytoplasmic armadillo-repeat protein that, after Aurora B and PLK1 phosphorylation, acts
    at the midbody to support completion of cytokinesis.
  directly_involved_in:
  - id: GO:0032465
    label: regulation of cytokinesis
  locations:
  - id: GO:0030496
    label: midbody
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:21857149
    supporting_text: Knockdown of ATXN10 with siRNA in HeLa cells results in cytokinesis defects-multinucleation,
      which are rescued by wild-type Ataxin-10, but not the phosphor-deficient 2A mutant.
  - reference_id: PMID:25666058
    supporting_text: Both endogenous and S12-phosphorylated Ataxin-10 localizes to the midbody during
      cytokinesis, and cytokinetic defects induced by inhibition of ATXN10 expression is not rescued by
      the S12A mutant.
  - reference_id: PMID:25666058
    supporting_text: Taken together, we propose a model that Aurora B phosphorylates Ataxin-10 at S12
      to promote the interaction between Ataxin-10 and Plk1 in cytokinesis.
proposed_new_terms: []
knowledge_gaps:
- gap_statement: The molecular activity of ATXN10, at the midbody and at the ciliary base, and how its
    loss causes nephronophthisis and epithelial-mesenchymal transition without overt cilia defects, are
    unknown.
  boundary: 'Established: midbody localization and cytokinesis requirement (phospho-regulated by Aurora
    B and PLK1), ciliary-base localization and NPHP5 binding, and requirement for heart development and
    epithelial homeostasis in mice. Not established: any enzymatic or defined binding activity, its midbody
    effector partners, or the mechanism of EMT.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  provenance:
  - reference_id: PMID:25666058
    supporting_text: Taken together, we propose a model that Aurora B phosphorylates Ataxin-10 at S12
      to promote the interaction between Ataxin-10 and Plk1 in cytokinesis.
  - reference_id: PMID:34970537
    supporting_text: Our data indicate that while ATXN10 protein can be detected around the base of the
      cilium as well as in the cytosol, its loss does not cause overt changes in cilia formation or morphology.
  - reference_id: PMID:34970537
    supporting_text: Congenital loss of Atxn10 results in embryonic lethality around E10.5 associated
      with pericardial effusion and loss of trabeculation.
suggested_questions:
- question: Is ATXN10's cytokinesis role connected to its ciliary-base and nephronophthisis roles, for
    example through the PLK1-Aurora B axis that also controls cilia disassembly?
suggested_experiments:
- description: Map ATXN10 proximity partners at the midbody and at the ciliary base (BioID), and test
    phospho-site mutants for rescue of cytokinesis and of the EMT phenotype in Atxn10-deleted epithelium.
