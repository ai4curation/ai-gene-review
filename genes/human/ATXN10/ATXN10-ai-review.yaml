  review:
    summary: Cilium assembly (IBA). The donor is mouse Atxn10, annotated by IMP from the modest ciliogenesis
      defects seen when Atxn10 is knocked down in 3D kidney culture. A later mouse knockout found no overt
      change in cilia formation or morphology, although ATXN10 sits at the ciliary base, and its human
      loss causes nephronophthisis. A role in cilium assembly is at most partial and contested. Kept as
      non-core.
