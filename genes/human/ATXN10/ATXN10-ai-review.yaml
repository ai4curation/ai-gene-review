  title: 'Interruptions in the expanded ATTCT repeat of spinocerebellar ataxia type 10: repeat purity
    as a disease modifier?'
  findings:
  - statement: SCA10 repeat interruptions modify seizure phenotype.
    supporting_text: We report two SCA10 families showing distinct frequencies of seizures and correlations
      of repeat length with age at onset.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; repeat-expansion genetics.
