- term:
    id: GO:0032465
    label: regulation of cytokinesis
  evidence_type: IMP
  original_reference_id: PMID:21857149
  qualifier: involved_in
  review:
    summary: Regulation of cytokinesis (IMP). ATXN10 knockdown causes cytokinesis failure (multinucleation),
      rescued by wild-type ATXN10 but not by phospho-site mutants. PLK1 (S77/T82) and Aurora B (S12) phosphorylate
      ATXN10 at the midbody, and Aurora B phosphorylation promotes PLK1 binding. Core process.
    action: ACCEPT
    reason: '[PMID:21857149 "Knockdown of ATXN10 with siRNA in HeLa cells results in cytokinesis defects-multinucleation,
      which are rescued by wild-type Ataxin-10, but not the phosphor-deficient 2A mutant."] [PMID:25666058
      "Both endogenous and S12-phosphorylated Ataxin-10 localizes to the midbody during cytokinesis, and
      cytokinetic defects induced by inhibition of ATXN10 expression is not rescued by the S12A mutant."]
      [PMID:25666058 "Taken together, we propose a model that Aurora B phosphorylates Ataxin-10 at S12
      to promote the interaction between Ataxin-10 and Plk1 in cytokinesis."]'
    supported_by:
    - reference_id: PMID:21857149
      supporting_text: Knockdown of ATXN10 with siRNA in HeLa cells results in cytokinesis defects-multinucleation,
        which are rescued by wild-type Ataxin-10, but not the phosphor-deficient 2A mutant.
    - reference_id: PMID:25666058
      supporting_text: Both endogenous and S12-phosphorylated Ataxin-10 localizes to the midbody during
        cytokinesis, and cytokinetic defects induced by inhibition of ATXN10 expression is not rescued
        by the S12A mutant.
    - reference_id: PMID:25666058
      supporting_text: Taken together, we propose a model that Aurora B phosphorylates Ataxin-10 at S12
        to promote the interaction between Ataxin-10 and Plk1 in cytokinesis.
