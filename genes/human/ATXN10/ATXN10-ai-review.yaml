    label: extracellular region
  evidence_type: HDA
  original_reference_id: PMID:23580065
  qualifier: located_in
  review:
    summary: Extracellular region (HDA). Detected in a proteomic survey (tear-fluid proteome). ATXN10
      is a soluble cytoplasmic armadillo-repeat protein with no signal peptide or transmembrane segment
      reported, so this likely reflects contamination or carry-over. Over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: '[PMID:15201271 "Atx-10 immunostaining of mouse and human brain sections revealed a predominantly
      cytoplasmic and perinuclear localization with a clear restriction to olivocerebellar regions."]
      [PMID:15201271 "Atx-10 has an apparent molecular mass of approximately 55 kDa and belongs to the
      family of armadillo repeat proteins."]'
    supported_by:
    - reference_id: PMID:15201271
