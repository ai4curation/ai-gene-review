- id: PMID:16498633
  title: Ataxin 10 induces neuritogenesis via interaction with G-protein beta2 subunit.
  findings:
  - statement: ATXN10 binds Gbeta2 and promotes neuritogenesis.
    supporting_text: By using yeast-two-hybrid screening of a human brain cDNA library, we identified
      the G-protein beta2 subunit (Gbeta2) as an ataxin 10 binding partner, and the interaction was confirmed
      by coimmunoprecipitation and colocalization in mammalian cells in culture.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
