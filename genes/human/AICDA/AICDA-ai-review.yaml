taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Activation-induced cytidine deaminase (AID), encoded by AICDA, is a zinc-dependent deaminase
  that converts cytosine to uracil in exposed single-stranded DNA. In activated B lymphocytes it initiates
  immunoglobulin somatic hypermutation and class-switch recombination; downstream DNA repair converts
  these lesions into sequence changes or recombination intermediates. Nuclear import, export and cytoplasmic
  retention constrain access to the genome. RNA interactions and transcription-associated partners help
  regulate substrate access, while mistargeted deamination can damage non-immunoglobulin genes. Human
  AICDA deficiency disrupts antibody diversification and causes a form of hyper-IgM immunodeficiency.
