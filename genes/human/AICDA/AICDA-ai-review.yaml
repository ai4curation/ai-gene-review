core_functions:
- description: Zinc-dependent deamination of cytosine in exposed single-stranded immunoglobulin DNA creates
    uracil lesions that initiate antibody somatic hypermutation and class-switch recombination. Nuclear
    substrate access is constrained by cytoplasmic retention and regulated nuclear transport, while RNA
    and transcription-associated partners modulate recruitment.
  molecular_function:
    id: GO:0019239
    label: deaminase activity
  directly_involved_in:
  - id: GO:0070383
    label: DNA cytosine deamination
  - id: GO:0016445
    label: somatic diversification of immunoglobulins
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:18722174
    supporting_text: Activation-induced deaminase (AID) deaminates deoxycytidine residues in immunoglobulin
      genes, triggering antibody diversification.
    reference_section_type: ABSTRACT
  - reference_id: PMID:11007475
    supporting_text: 'Three major abnormalities characterize AID deficiency: (1) the absence of immunoglobulin
      class switch recombination, (2) the lack of immunoglobulin somatic hypermutations, and (3) lymph
      node hyperplasia caused by the presence of giant germinal centers.'
    reference_section_type: ABSTRACT
  - reference_id: PMID:32484799
    supporting_text: We found that the M466V mutation interfered with the association of CTNNBL1 with
      AID, resulting in decreased AID in the nuclei of patient EBV-transformed B cell lines and of CTNNBL1
      466V/V Ramos B cells engineered to express only CTNNBL1 M466V using CRISPR/Cas9 technology.
    reference_section_type: ABSTRACT
suggested_questions:
- question: Which GO molecular-function term should explicitly represent EC 3.5.4.38 / RHEA:50948 DNA-cytosine
    deamination? GO:0004126 formally describes free nucleosides, a separately measured AID capacity; GO:0019239
    currently captures the shared deamination chemistry without inventing an ID.
- question: Can the PTN001419581 IBD evidence establish AID P-body localization and infectious retroviral
    restriction, distinct from cytoplasmic localization, HBV restriction and L1/MusD retrotransposition?
- question: Under which endogenous human conditions does AID edit RNA, beyond the HBV nucleocapsid expression
    system in PMID:23341589, and what experimental descendants ground the PTN000355219 ancestral RNA-editing
    assertion?
- question: Which endogenous human contexts reproduce the AID-dependent demethylation phenotype, and which
    modified base or intermediate is directly deaminated? The positive human-cell reporter result does
    not settle the reacting intermediate.
