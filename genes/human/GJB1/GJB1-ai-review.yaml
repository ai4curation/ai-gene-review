suggested_experiments:
- description: Compare sequence-verified wild-type human Cx32 and selected disease variants at matched surface abundance, measuring paired-cell junctional conductance and unpaired-cell hemichannel currents under controlled voltage, pH and calcium conditions.
  hypothesis: Some variants change gating independently of abundance or trafficking, allowing junctional loss of function to be separated from hemichannel leakage.
- description: In a human myelinating Schwann-cell system, combine acute endogenous GJB1 perturbation and sequence-verified rescue with spatially resolved dye transfer and electrical coupling, while measuring cell differentiation and viability separately.
  hypothesis: Direct communication defects can be distinguished from secondary changes in myelination or cell state.
