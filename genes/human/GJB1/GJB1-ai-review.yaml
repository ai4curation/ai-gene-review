  review:
    action: ACCEPT
    summary: Gap-junction channels provide a transmembrane route for intercellular solute and electrical transfer.
    reason: 'The inference from gap-junction channel activity is biologically coherent: connexin-32 channels span the membranes of adjacent cells and conduct between their cytoplasms. Human expression experiments measure junctional currents and support this transport role. This does not imply an ATP-driven pump, transport of every substrate, or a constitutively open unapposed hemichannel.'
