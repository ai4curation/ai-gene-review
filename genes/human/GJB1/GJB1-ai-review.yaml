id: P08034
gene_symbol: GJB1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Connexin-32 is a four-pass membrane protein that oligomerizes into connexons and forms intercellular channels at gap junctions. These channels mediate electrical coupling and the passage of small solutes between adjacent cells. GJB1 variants cause X-linked Charcot-Marie-Tooth neuropathy and can disrupt channel assembly, intracellular trafficking, intercellular coupling or hemichannel gating.
