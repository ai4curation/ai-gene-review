- id: Reactome:R-HSA-190681
  title: Connexin oligomerization in endoplasmic reticulum membrane
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The official event and nested entities were read: six human GJB1 molecules (P08034 residues 1–283; entity 190656) in ER membrane form connexon 190647. Catalyst 196375 assigns gap-junction channel activity to the same GJB1 entity. This supports the curated assembly and compartment context; that activity label is not an independently inspected assay of channel conduction in ER membrane. The underlying cited publication was not read for this assessment.'
- id: Reactome:R-HSA-190693
  title: Synthesis of GJB1 (Cx32)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official event describes GJB1 biosynthesis from cytosolic mRNA 9674646 to ER-membrane protein 190656, independently traced to human P08034 residues 1–283. GJB1 is the product, not the translation catalyst. This supports a biosynthetic location context without assigning protein synthesis machinery activity to GJB1. The cited original experiment was not inspected for this assessment.
- id: Reactome:R-HSA-190704
  title: Oligomerization of connexins into connexons
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official pathway summary and child events were read, including 190681 and its human GJB1 ER-connexon representation. The summary distinguishes homo- and heteromeric connexons and context-dependent assembly locations; ER, ERGIC and TGN statements are not all interchangeable GJB1-specific findings. The curated pathway supports assembly context, without independently validating every cited primary experiment or every proposed partner composition.
- id: Reactome:R-HSA-190827
  title: Transport of connexins along the secretory pathway
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official secretory-transport pathway and two contained events were read. Connexins are cargo along this route; the generic pathway cytosol compartment does not demonstrate soluble GJB1 residence or a transport-machinery activity. The summary includes Cx32 ER assembly but also discusses other connexins and variable assembly locations. Those general details are not transferred wholesale to GJB1, and cited primary papers were not independently read here.
- id: Reactome:R-HSA-190861
  title: Gap junction assembly
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official gap-junction assembly pathway, process link and contained events were read, including GJB1 synthesis and connexin oligomerization. It provides relevant context for the channel structural component across assembly and delivery steps; inclusion does not mean GJB1 catalyses its own translation or every trafficking step. The summary specifically attributes microtubule plus-end stabilization to Cx43-based junctions, not GJB1. Underlying literature and pathway images were not independently inspected here.
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic method description explains InterPro signature-to-GO transfer. The connexin family/domain assignment is consistent with GJB1 architecture and independent channel evidence; the method record is not a new experiment on this protein.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic phylogenetic annotation method was read together with the actual PTHR11984 tree, alignment and IBD records. All three current assertions descend from AN0/PTN008334405. Experimental evidence from the target itself is legitimate descendant evidence, not circular support; the method reference is distinct from those experiments.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl Compara
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic Ensembl Compara method transfers experimentally supported annotations between orthologs. The current mouse donor records were traced to their actual references and selected original evidence. This method supports the transfer provenance, without making the mouse assays human experiments.
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology links
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic method describes logical propagation across ontology branches. In this snapshot it supplies provenance for transmembrane transport inferred from gap junction channel activity. The broader cell communication row instead cites GO_REF:0000002. Logical entailment is not a separate assay.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic description explains consolidation of matching electronic assertions from multiple pipelines. The literal source identifiers remain preserved. Connexin architecture and independent functional evidence support the relevant channel, transport and complex contexts; the combined record is not several independent experiments.
- id: UniProt:P08034
  title: 'UniProtKB P08034 (CXB1_HUMAN): Gap junction beta-1 protein'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The current reviewed human record, sequence, topology, function and subunit comments were inspected. The canonical protein has 283 residues and no alternative-products declaration. The function text is not individually evidence-tagged, and the hexamer/CNST subunit comment carries ECO:0000250 without an explicit donor. Independent human channel studies supply direct functional grounding; mutant and partner isoforms are not additional natural GJB1 products.
- id: file:human/GJB1/GJB1-evidence.yaml
  title: GJB1 source scope, machine context and preservation evidence
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Companion provenance preserves all 61 original annotation contexts, verified source and sequence records, ancestral evidence, literal interaction pairs and four exact excerpt locators. It records source-reading limits and unresolved partner identities. It is an audit record, not an independent biological experiment.
