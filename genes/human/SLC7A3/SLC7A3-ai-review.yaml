id: Q8WY07
gene_symbol: SLC7A3
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC7A3 (CAT-3) is a multi-pass plasma membrane protein of the amino
  acid-polyamine-organocation (APC) superfamily, cationic amino acid transporter
  (CAT) family. It is a sodium-independent, pH-independent facilitative uniporter
  of the system y+ type that mediates the uptake of cationic (basic) L-amino acids
  — L-arginine, L-lysine and L-ornithine — by passive, trans-stimulated facilitated
  diffusion. Unlike the heteromeric SLC7 light-chain transporters, CAT-3 functions
  as a single chain and does not require the SLC3A2/4F2hc heavy chain. In rodents
  CAT-3 is largely neuron-restricted in the adult brain, but human hCAT-3 has a
  broader distribution, with highest expression in thymus and additional expression
  in testis, uterus, mammary gland and several brain regions (thalamus, hippocampus,
  amygdala). Cell-surface abundance of the transporter is down-regulated by classical
  protein kinase C through internalization.
