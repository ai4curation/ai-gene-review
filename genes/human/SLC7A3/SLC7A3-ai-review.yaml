- term:
    id: GO:0150104
    label: transport across blood-brain barrier
  evidence_type: NAS
  original_reference_id: PMID:26590417
  qualifier: involved_in
  review:
    summary: >-
      Non-traceable author statement annotating SLC7A3 to transport across the
      blood-brain barrier, citing a general BBB review not specific to SLC7A3.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The blood-brain barrier is formed by brain capillary endothelial cells, whereas
      hCAT-3 in brain is expressed in neurons and its highest expression is in
      non-CNS tissue (thymus); its expression does not correlate with the vasculature.
      The two supporting references are generic BBB review articles, not SLC7A3-specific
      functional studies, so the claim that hCAT-3 mediates transport across the barrier
      exceeds the evidence (CAT-1 is the principal system-y+ transporter at the BBB
      endothelium).
    supported_by:
    - reference_id: PMID:11591158
      supporting_text: >-
        Human CAT-3 expression is not restricted to the brain, in fact, by far the
        highest expression was found in thymus.
