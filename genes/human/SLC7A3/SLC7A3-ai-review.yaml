  - reference_id: PMID:11591158
    supporting_text: >-
      Transport studies in Xenopus laevis oocytes revealed that hCAT-3 is selective
      for cationic L-amino acids and exhibits a maximal transport activity similar to
      other CAT proteins.
  - reference_id: file:human/SLC7A3/SLC7A3-uniprot.txt
    supporting_text: >-
      Uniporter that mediates the uptake of cationic L-amino acids such as L-arginine,
      L-lysine and L-ornithine (PubMed:11591158). The transport is sodium ions- and
      pH-independent, moderately trans-stimulated and is mediated by passive diffusion
    record_section: ["CC:FUNCTION"]
proposed_new_terms: []
suggested_questions:
- question: >-
    Does human hCAT-3 contribute meaningfully to L-arginine supply for neuronal nitric
    oxide synthesis in vivo, or is this role specific to rodent neuron-restricted CAT-3?
- question: >-
    What is the physiological significance of the high hCAT-3 expression in thymus,
    testis and uterus, given its originally proposed neuronal role?
suggested_experiments:
- description: >-
    Measure Na+-independent cationic amino acid uptake kinetics (Km, Vmax,
    trans-stimulation) for human hCAT-3 across its physiologically relevant substrates
    in a defined expression system to confirm uniporter mechanism and substrate ranking.
- description: >-
    Determine the cell-type-specific localization of endogenous hCAT-3 in human brain
    (neurons vs. capillary endothelium) to test whether a blood-brain-barrier transport
    role is warranted.
