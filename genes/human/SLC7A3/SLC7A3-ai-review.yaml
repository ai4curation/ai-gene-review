core_functions:
- description: >-
    Sodium- and pH-independent facilitative uniporter (system y+) that imports the
    cationic (basic) L-amino acids L-arginine, L-lysine and L-ornithine across the
    plasma membrane by passive, trans-stimulated facilitated diffusion, as a
    single-chain CAT-family transporter (no heavy-chain subunit required).
  molecular_function:
    id: GO:0015174
    label: basic amino acid transmembrane transporter activity
  directly_involved_in:
