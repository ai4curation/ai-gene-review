id: Q9BXN1
gene_symbol: ASPN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Asporin (ASPN, also PLAP-1) is a secreted extracellular matrix protein of the small leucine-rich
  repeat family. Unlike related SLRPs, it lacks a glycosaminoglycan attachment site, and it carries a
  polymorphic N-terminal aspartate repeat that binds calcium. It binds type I collagen, competing with
  decorin, and binds TGF-beta, inhibiting TGF-beta-induced chondrogenesis and matrix gene expression in
  articular cartilage. The D14 repeat allele, which inhibits most strongly, is associated with osteoarthritis.
  In the periodontal ligament it blocks BMP-2 binding to its type IB receptor, preventing ligament mineralization.
  In osteoblast cultures it promotes collagen mineralization.
