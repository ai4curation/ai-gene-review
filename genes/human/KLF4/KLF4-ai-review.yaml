suggested_questions:
- question: Which endogenous KLF4 target promoters account for its most important cell-type-specific outputs,
    rather than secondary effects of changing proliferation or differentiation state?
  experts:
  - KLF transcriptional regulation curator
suggested_experiments:
- hypothesis: KLF4 selects different direct target promoters through cell-type-specific cofactors bound near
    GC/CACCC motifs.
  description: Combine endogenous KLF4 CUT&RUN, RNA-seq after acute degron depletion, and cofactor
    perturbations in the cell type that generated the most process-specific GO rows.
