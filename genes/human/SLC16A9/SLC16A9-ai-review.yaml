suggested_questions:
- question: Given the low affinity of MCT9 for creatine (Km ~24-237 mM, far above plasma creatine), 
    which substrate - creatine or carnitine - is the physiologically dominant one, and what is the 
    mechanism linking SLC16A9 variants to serum urate levels?
suggested_experiments:
- description: Measure MCT9-mediated creatine and carnitine flux side by side at physiological 
    substrate concentrations and pH, and test directly whether MCT9 transports urate or a 
    urate-coupled solute, to resolve whether the robust serum-urate GWAS association reflects direct
    transport or an indirect metabolic link.
