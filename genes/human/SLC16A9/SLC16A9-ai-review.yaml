    label: creatine transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:31784090
  qualifier: enables
  review:
    summary: Creatine transmembrane transporter activity - direct oocyte assay (core).
    action: ACCEPT
    reason: 'Direct heterologous (Xenopus oocyte) assay: MCT9 mediates extracellular-pH- and Na(+)-sensitive
      creatine uptake. Core molecular function, though the apparent Km (23.7 mM high-affinity, 237 mM
      low-affinity) is far above physiological plasma creatine (~25-100 uM), so the physiological significance
      of the creatine activity is uncertain relative to the pH-independent carnitine efflux activity.'
    supported_by:
    - reference_id: PMID:31784090
      supporting_text: Kinetic analysis of hMCT9-mediated creatine uptake revealed that uptake 
        consisted of two components, with apparent Km values of 237 mm (low-affinity) and 23.7 mm 
        (high-affinity)
