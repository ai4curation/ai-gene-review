description: 'SLC16A9 encodes monocarboxylate transporter 9 (MCT9), a multi-pass plasma-membrane protein
  of the SLC16/monocarboxylate-transporter family (major facilitator superfamily, monocarboxylate porter
  family, TC 2.A.1.13). Despite the family name, MCT9 is not a classical lactate/pyruvate carrier: it
  has been shown experimentally to act as an extracellular-pH- and Na(+)-sensitive, low-affinity creatine
  transporter and as a pH-independent carnitine efflux transporter at the plasma membrane. Common variants
  at the SLC16A9 locus are robustly associated with serum uric acid concentrations and with gout risk,
  implicating the gene in urate homeostasis, although direct transport of urate by MCT9 has not been demonstrated.'
