- term:
    id: GO:0046415
    label: urate metabolic process
  evidence_type: IMP
  original_reference_id: PMID:19503597
  qualifier: involved_in
  review:
    summary: Urate link is a robust GWAS association over-annotated as a urate metabolic-process 
      role.
    action: MARK_AS_OVER_ANNOTATED
    reason: "Common SLC16A9 variants are robustly (genome-wide-significantly) associated with serum uric
      acid levels and gout risk. This is a genetic association: MCT9 is a transporter, not an enzyme,
      and neither urate transport nor participation in any step of urate metabolism has been demonstrated.
      'urate metabolic process' (with an IMP code applied to a GWAS result) therefore over-annotates an
      association as a mechanistic role. Not entirely wrong - the gene is genuinely implicated in urate
      homeostasis - but an over-annotation by the participation test."
    supported_by:
    - reference_id: PMID:19503597
      supporting_text: SLC16A9 (p = 1.1x10(-8))
