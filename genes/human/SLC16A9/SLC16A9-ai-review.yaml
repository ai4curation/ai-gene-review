- term:
    id: GO:0046415
    label: urate metabolic process
  evidence_type: IMP
  original_reference_id: PMID:19503597
  qualifier: involved_in
  review:
    summary: Urate link is a robust GWAS association, not demonstrated urate metabolism.
    action: KEEP_AS_NON_CORE
    reason: "Common SLC16A9 variants are robustly (genome-wide-significantly) associated with serum uric
      acid levels and gout risk. This is a genetic association: MCT9 is a transporter, not an enzyme,
      and direct urate transport or a role in urate metabolism has not been demonstrated, so 'urate metabolic
      process' (and the IMP code applied to a GWAS result) overstate a proven mechanism. Kept as a non-core,
      biologically important association."
    supported_by:
    - reference_id: PMID:19503597
      supporting_text: SLC16A9 (p = 1.1x10(-8))
