  review:
    summary: Replace inferred DNA helicase activity with the demonstrated chromatin-remodeling activity.
    action: MODIFY
    reason: GO:0003678 describes DNA strand unwinding. The measured human CHD8 reaction is ATP-dependent
      nucleosome repositioning and increased nucleosomal DNA accessibility. The SNF2 motor/domain name
      alone does not establish helicase strand separation. GO:0140658 captures the positive target evidence,
      without a universal claim that CHD8 could never unwind DNA under any condition.
    supported_by:
