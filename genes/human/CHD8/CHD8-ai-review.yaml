- id: PMID:15960975
  title: Physical association and coordinate function of the H3 K4 methyltransferase MLL1 and the H4 K16
    acetyltransferase MOF.
  findings:
  - statement: CHD8 is recovered with WDR5/MLL-associated material, supporting context-dependent association
      rather than invariant MLL1 stoichiometry.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected cache is abstract-only; genuine Rockefeller author PDF and original Fig. 1B
      were independently inspected by ROOT. CHD8 is positively detected in WDR5-purified bands; mixed
      subfractions limit intact-particle inference.
- id: PMID:17938208
  title: CHD8 associates with human Staf and contributes to efficient U6 RNA polymerase III transcription.
  findings:
  - statement: CHD8 contributes to human U6 and IRF3 transcription and is recovered preferentially with
      H3K4 methylated peptides.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Genuine full selected Methods/Results read: human hStaf/ZNF143 association, occupancy,
      reporter perturbation and H3 peptide assays. The reader assay uses a partially purified hStaf fraction;
      RNase control does not eliminate a protein bridge.'
- id: PMID:18378692
  title: CHD8 is an ATP-dependent chromatin remodeling factor that regulates beta-catenin target genes.
  findings:
  - statement: Purified human CHD8 remodels nucleosomes and binds WDR5 and beta-catenin; depletion alters
      beta-catenin-responsive gene expression.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected exact cache is abstract-only; actual indexed original selected Methods/Results/Discussion
      were recovered and read. Human purified motor, WDR5/beta-catenin binding and promoter regulation
      are positive; absence of MLL in this preparation is context specific.
- id: PMID:20085832
  title: Regulation of HOXA2 gene expression by the ATP-dependent chromatin remodeling enzyme CHD8.
  findings:
  - statement: CHD8 associates with WDR5, RBBP5 and ASH2L and influences their occupancy and HOXA2 regulation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected cache is abstract-only; authentic author-uploaded original Methods2.1–2.4 and
      Results3.1–3.5 were read. Sf9 coexpression and human NT2/D1 chromatin experiments are distinct;
      association is not automatically an isolated binary interface.
- id: PMID:20453063
  title: CHD8 interacts with CHD7, a protein which is mutated in CHARGE syndrome.
  findings:
  - statement: CHD8 C-terminal fragments associate with CHD7 in Y2H, tagged co-IP and nuclear BiFC; some
      CHD7 variants affect the assay types differently.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic author-uploaded full selected Results, figure legends and Methods inspected
      externally. NP_065971.2 CHD8 fragments support the preserved CHD8-2 tag; selected normal cache remains
      abstract-only.
- id: PMID:22083958
  title: Histone H1 recruitment by CHD8 is essential for suppression of the Wnt-β-catenin signaling pathway.
  findings:
  - statement: CHD8 association with beta-catenin and H1 recruitment contribute to repression; detailed
      bridging mutants were tested in mouse short CHD8.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected cache is flagged full but contains Introduction/Discussion. Actual indexed
      primary Methods/Results and genuine author PDF provide additional access. Endogenous human assays
      and mouse short-form construct experiments are distinguished.
- id: PMID:23285124
  title: Identification and characterization of FAM124B as a novel component of a CHD7 and CHD8 containing
    complex.
  findings:
  - statement: Both FAM124B alternatives associate with the tested CHD8 C-terminal region; the study does
      not establish a distinct FAM124B molecular activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine full selected Methods/Results read, including exact target and partner constructs,
      Y2H autoactivation controls and co-IP. CHD8-2 fragments are distinguished from full-length FAM124B
      alternatives.
- id: PMID:24998929
  title: Disruptive CHD8 mutations define a subtype of autism early in development.
  findings:
  - statement: Disruptive CHD8 variation and zebrafish perturbation associate with brain enlargement,
      altered enteric innervation and digestive transit.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine full selected human variant and zebrafish perturbation Results/Methods read.
      Brain/enteric/transit phenotypes are organismal outcomes, not autonomous CHD8 motility or digestive
      chemistry.
- id: PMID:25294932
  title: CHD8 regulates neurodevelopmental pathways associated with autism spectrum disorder in neural
    progenitors.
  findings:
  - statement: Partial CHD8 suppression changes transcription in both directions and affects neurodevelopmental
      networks.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine full selected human neural-progenitor ChIP, shRNA and transcriptome Methods/Results
      read. Direct bound targets and indirect expression consequences remain separate.
- id: PMID:26816381
  title: Transcription factors LRF and BCL11A independently repress expression of fetal hemoglobin.
  findings:
