core_functions:
- description: 'CHD8 supplies an ATP-driven nucleosome-remodeling motor. Purified human protein repositions
    nucleosomes and changes DNA accessibility, while DNA/histone contacts and recruitment by transcriptional
    partners connect the motor to locus-dependent activation and repression. Canonical Wnt repression
    and Pol III U6 regulation are established contexts. Repression need not be driven solely by the ATPase:
    tested mouse motorless short CHD8 recruits H1 and represses Wnt output independently of the ATPase
    domain. That construct result is distinct from human long-product motor assays. The H3K36me3/splicing
    connection remains a regulatory model rather than CHD8 methyltransferase or splicease chemistry.'
