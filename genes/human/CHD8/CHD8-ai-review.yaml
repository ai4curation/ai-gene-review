id: Q9HCK8
gene_symbol: CHD8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHD8 is a nuclear ATP-dependent chromatin remodeler that binds DNA and nucleosomes and changes
  nucleosome position and accessibility. Its interactions with transcriptional regulators, histones and
  chromatin-associated proteins support both repression and activation at different loci, including beta-catenin-responsive
  genes and Pol II/III transcriptional contexts. CHD8-dependent chromatin regulation also influences alternative
  RNA splicing and neurodevelopmental and enteric phenotypes. Association with WDR5-containing and KMT2A-associated
  assemblies is context dependent; CHD8 is not the histone methyltransferase. Human long products differ
  from experimentally studied mouse motorless short forms.
