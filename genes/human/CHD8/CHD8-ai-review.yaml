suggested_questions:
- question: Which CHD8 product and protein interfaces account for H3K4 methyl-peptide recognition in a
    fully defined preparation, and how is this recognition coupled to remodeling?
- question: Under which human cell states does CHD8 assemble with intact KMT2A/MLL1 complexes, and what
    is the recruitment order relative to separate WDR5–ASH2L–RBBP5 assemblies?
- question: Which CHD8 chromatin and HNRNPL contacts causally alter alternative splicing, and can those
    effects be separated from transcription or H3K36me3 changes?
- question: How do the two current human long products compare functionally, and which mouse short-form
    p53/H1 mechanisms extend to each human product?
suggested_experiments:
- hypothesis: Defined human CHD8 histone recognition influences nucleosome remodeling.
  description: Compare sequence-verified human products and reader-region mutants on matched modified/unmodified
    nucleosomes, measuring binding, ATPase and repositioning separately with protein-complex composition
    controls.
- hypothesis: CHD8 association with KMT2A complexes depends on cell state and is distinct from WAR-only
    assemblies.
  description: Use reciprocal endogenous purification with quantitative composition and orthogonal size
    separation in matched human cell states, with WDR5/WAR controls and recruitment-time-course perturbations.
- hypothesis: Specific CHD8–HNRNPL contacts contribute to splicing regulation.
  description: Separate interaction disruption from CHD8 abundance and motor activity in neural progenitors;
    measure nascent transcription, H3K36me3 and validated isoform ratios in the same rescue series.
