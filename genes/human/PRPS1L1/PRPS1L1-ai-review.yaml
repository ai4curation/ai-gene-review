core_functions:
- description: Catalyzes the Mg2+-dependent conversion of ATP and D-ribose 5-phosphate into PRPP and AMP.
    The PRPS1L1 protein has not been biochemically characterized as deeply as PRPS1 or PRPS2, but the
    activity is supported by strong PRPS-family conservation, PAINT, and orthology to human PRPS1.
