id: P21108
gene_symbol: PRPS1L1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PRPS1L1 encodes ribose-phosphate pyrophosphokinase 3, a testis-enriched member of the catalytic
  PRPP synthetase family. The PRPS1L1 transcript was cloned as a human testis-specific PRPS3 mRNA that
  initiates from a non-AUG codon and encodes a protein highly homologous to PRPS1 and PRPS2. By conserved
  active-site and phylogenetic inference, PRPS1L1 is a soluble Mg2+-dependent enzyme that converts ATP
  and D-ribose 5-phosphate into PRPP and AMP for nucleotide biosynthesis.
