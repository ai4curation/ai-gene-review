- term:
    id: GO:0034454
    label: microtubule anchoring at centrosome
  evidence_type: IMP
  original_reference_id: PMID:30538248
  qualifier: involved_in
  review:
    summary: FSD1 anchors interphase microtubule asters at the mother centriole by binding
      microtubules through its SPRY domain.
    action: NEW
    reason: FSD1 performs the anchoring step itself; it sits on the mother centriole via its
      coiled coil and holds microtubules through its SPRY domain; knockdown abolishes
      centrosome-anchored asters and a microtubule-binding-dead 3RE mutant fails to rescue.
      Comparator check - other centrosomal MT-anchoring proteins (NIN, CEP19, CCDC68,
      DCTN1) carry GO:0034454 in human GOA. Not a parent or child of the existing
      cytoplasmic microtubule organization rows.
    supported_by:
    - reference_id: PMID:30538248
      supporting_text: the expression of siRNA-resistant WT FSD1, but not the 3RE mutant, could
        efficiently rescue the defects in MT aster formation induced by FSD1 knockdown
    - reference_id: PMID:30538248
      supporting_text: Thus, these results suggest that FSD1 promotes the anchoring of MT asters
        at centrosomes by directly binding MTs.
