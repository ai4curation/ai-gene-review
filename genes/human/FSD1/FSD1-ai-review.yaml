core_functions:
- description: Direct microtubule binding through the C-terminal B30.2/SPRY domain, with
    coiled-coil-mediated targeting to the mother centriole, allowing FSD1 to anchor interphase
    microtubule asters at the centrosome and to bundle and stabilise cytoplasmic microtubules.
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  directly_involved_in:
  - id: GO:0034454
    label: microtubule anchoring at centrosome
  - id: GO:0031122
    label: cytoplasmic microtubule organization
  locations:
  - id: GO:0005813
    label: centrosome
  - id: GO:0005874
    label: microtubule
  supported_by:
  - reference_id: PMID:30538248
    supporting_text: Thus, these results suggest that FSD1 promotes the anchoring of MT asters
      at centrosomes by directly binding MTs.
  - reference_id: PMID:12154070
    supporting_text: In tissue culture cells, MIR1 is enriched at the centrosome.
suggested_questions:
- question: Does FSD1 loss cause a cilium defect in neurons in vivo, given its brain-enriched
    expression, and is the ciliogenesis defect entirely secondary to CEP290 mislocalisation?
- question: Is the reported HDAC6 interaction (PMID:39808222) a direct inhibitory activity
    of FSD1 that would justify an enzyme-inhibitor MF term, or an indirect consequence of
    FSD1 shielding microtubules?
- question: Does FSD1 have a physiological role in cytokinesis or spindle organisation, or
    are those effects confined to overexpression?
suggested_experiments:
- description: Purified FSD1 and HDAC6 in vitro deacetylation assays on taxol microtubules
    versus free tubulin, to test whether FSD1 inhibits HDAC6 directly or protects the substrate.
- description: Conditional Fsd1 knockout in mouse brain, scoring primary cilia, centrosomal MT
    asters and cell division in neural progenitors.
