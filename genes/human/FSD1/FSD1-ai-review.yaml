id: Q9BTV5
gene_symbol: FSD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  FSD1 (fibronectin type III and SPRY domain containing 1; also called MIR1 or GLFND) is a
  brain-enriched centrosome- and microtubule-associated protein of 496 amino acids with an
  N-terminal coiled coil/B-box C-terminal (COS) region, a central fibronectin type III domain
  and a C-terminal B30.2/SPRY domain. It is distantly related to MID1 and the TRIM family but
  lacks RING and B-box zinc-finger motifs. The SPRY domain binds microtubules directly, while
  the coiled-coil region targets the protein to the centrosome, where it sits at the middle
  region of the mother centriole and anchors interphase microtubule asters; oligomerisation
  is needed for tight microtubule binding. Overexpressed FSD1 decorates, bundles and
  stabilises acetylated microtubules against nocodazole. Cdk-site phosphorylation releases it
  from microtubules at mitotic entry, and it reassociates with microtubules of the cleavage
  furrow during cytokinesis. Loss of FSD1 disrupts centrosomal microtubule asters, displaces
  the transition-zone factor CEP290 from centriolar satellites and impairs primary cilium
  formation in human cells and zebrafish. In glioblastoma cells FSD1 has also been reported to
  bind HDAC6 and restrain alpha-tubulin deacetylation.
