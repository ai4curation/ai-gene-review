core_representation:
  alpha: GO:0005055 laminin receptor activity; extracellular processed alpha chain in the
    dystroglycan complex.
  beta: GO:0008093 cytoskeletal adaptor activity; processed transmembrane beta chain links
    alpha to dystrophin/utrophin and associates with CLASPs. The term includes proteins directly
    bound to the cytoskeleton, so direct beta–actin binding is not asserted.
  process_specificity: GO:0071711 basement membrane organization and GO:0085029 extracellular
    matrix assembly replace broad GO:0030198 in the alpha receptor core. Current is_a ancestry
    places both below GO:0030198 and neither below the other.
  evidence_limits: Complete abstracts for PMID10767429/11495720/8017170; selected original
    Methods/Results/captions for PMID23940118. Mouse myotube/peptide evidence, human muscle
    localization, human co-IP and chick developmental experiments remain distinct. Individual
    pair-binding reviews do not claim every source assayed complete adaptor function.
  schema_scope: The mature chains are named in core descriptions and retained in functional_isoforms;
    no imported source isoform field is altered. No NEW annotation or additional self-processing
    core is proposed.

review_clarifications:
  checked_on: '2026-10-16'
  current_GO_label:
    id: GO:0008093
    name: cytoskeletal adaptor activity
    older_name: cytoskeletal anchor activity
    quickgo: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO%3A0008093
    ols: https://www.ebi.ac.uk/ols4/api/ontologies/go/terms?obo_id=GO:0008093
    interpretation: Both current services return the adaptor label. QuickGO retains anchor as a narrow synonym. The March/May repository caches are older snapshots, not evidence that the current label was invented.
  binding_policy_authority:
    source: ../../../projects/CLINGEN_MENDELIAN.md
    section: Curation instructions
    rule: The user explicitly instructed this campaign to retain supported biologically correct generic binding as KEEP_AS_NON_CORE when no evidence-backed specific replacement is established. This intentional project exception takes precedence over the skill informational-exclusion recommendation; the global policy module is not changed.
    rows: Caveolin-3, AGR2 and AGR3 retain positive assay evidence and explicit scope limits under that instruction.
  pair_assays_and_core:
    source_PMIDs: ['10767429', '11495720', '8017170', '23940118']
    interpretation: The utrophin and dystrophin IPI sources support cytoskeletal protein binding. Their recovered assay scope does not independently demonstrate DAG1 bringing together two partners in coordinated function. The integrated beta-chain core synthesizes linkage evidence across sources. Keep GO0008092 for those pair-specific replacements and GO0008093 for the core; the core coverage warning is disclosed rather than resolved by manufacturing a stronger source-specific claim or a NEW row.
  structural_muscle_role: The beta-chain core description now explicitly includes sarcolemmal structural integrity, representing the accepted structural-constituent-of-muscle function without a duplicate third core.
  peptide_scope: NCK1 SH3 binding is an observed isolated-peptide property. The alpha-fragment and intracellular NCK1 topology limitation concerns physiological access, not falsification of the in-vitro assay.
  processing_scope: The MMP9 ectodomain row remains MARK_AS_OVER_ANNOTATED because DAG1 is the cleaved substrate in that experiment. The current reason does not call this REMOVE. Intrinsic SEA self-processing is separately documented; no redundant process row is added solely to close a review suggestion.
