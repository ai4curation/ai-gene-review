biological_groups:
- scope: Matrix receptor and mechanical linkage
  conclusion: 'Two complementary processed-chain cores make the linkage explicit: alpha-dystroglycan
    laminin receptor activity and beta-dystroglycan cytoskeletal adaptor activity. The receptor/scaffold
    contributes to basement-membrane organization and matrix assembly. Beta binds alpha and
    cytoskeletal partners, rather than independently binding laminin or requiring direct actin
    contact. Developmental and signaling roles retain their source-specific context.'
- scope: SEA processing versus ectodomain shedding
  conclusion: The SEA experiment supports intramolecular self-cleavage, without the triad
    required for the serine-specific term. The MMP9 paper instead assays a cleaved DAG1 substrate.
    General endopeptidase refinement is restricted to the former, while the latter process
    attribution is overannotated.
- scope: Binding assays
  conclusion: Utrophin/dystrophin/CLASP class refinements preserve experimental scope. NCK1
    recognizes a synthetic alpha-chain peptide that is extracellular in the mature receptor,
    so native accessibility is not established. Ankyrin records involve a human beta tail
    and rat ankyrin-G. Positive AGR2/AGR3 and caveolin binding are retained without unsupported
    catalytic or native-context claims.
- scope: Compartment evidence
  conclusion: 'Mature surface receptor sites are distinguished from ER/Golgi maturation, released
    alpha-derived products and contextual nuclear/vesicle pools. Defective-POMT models label
    alpha 30–653 cytosolic, but their summations do not resolve that localization; separate
    beta-tail observations do not validate it. Focal-adhesion localization is retained as
    contextual: PMID9117347 explicitly reports human aortic smooth-muscle and rat REF52 recruitment,
    with ligand/cell-type dependence. The separate original proteomics target assignment and
    platelet localization panel remain unverified.'
- scope: Platelet source
  conclusion: The original PMID18341635 is unavailable. Plasma-membrane localization is independently
    established; a human ACTN1 curated pair is independently corroborated. Focal-adhesion
    location has separate human smooth-muscle corroboration from PMID9117347, without verification
    of the platelet panel. Eight other specific binding/localization/anchoring assertions
    remain unresolved, without any negative-binding inference.
- scope: Orthologous tissue contexts
  conclusion: Direct human assays, mouse/rat/rabbit experimental records, PAINT node inheritance
    and expression-pattern donor evidence are kept distinct. No donor-count or self-donor
    shortcut is used.
