functional_isoforms:
- id: DAG1_ALPHA
  name: Alpha-dystroglycan
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000021065
    residues: 30-653
  description: Extracellular chain produced from the secretory precursor after removal of
    the 1–29 signal peptide and SEA processing. Its glycosylated receptor surface binds matrix
    ligands and associates noncovalently with beta-dystroglycan. Further release of N-terminal
    alpha-derived material is reported; the complete 30–653 chain is not assumed to be freely
    secreted in every context. Glycosylation states can differ in ligand competence without
    changing this chain identity.
- id: DAG1_BETA
  name: Beta-dystroglycan
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000021066
    residues: 654-895
  description: Membrane-spanning chain with an extracellular alpha-chain association region,
    a transmembrane segment at residues 750–775 and a cytoplasmic tail at 776–895. The tail
    binds cytoskeletal and signaling partners in context-dependent assays. Intrinsic precursor
    cleavage is distinct from MMP-dependent shedding of the extracellular beta-chain region.
    Nuclear and cytoplasmic pools have been observed in cultured human cells; these do not
    assign the same localization or functions to the extracellular alpha chain.
core_functions:
- description: Glycosylated alpha-dystroglycan (DAG1_ALPHA; PRO_0000021065, residues 30–653)
    binds laminin as the extracellular ligand-binding chain of the alpha/beta dystroglycan
    receptor. Together with the membrane-anchoring beta chain, it organizes and supports assembly
    of extracellular matrix and basement membrane. Agrin and perlecan are additional matrix
    ligands.
  molecular_function:
    id: GO:0005055
    label: laminin receptor activity
  directly_involved_in:
  - id: GO:0071711
    label: basement membrane organization
  - id: GO:0085029
    label: extracellular matrix assembly
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005604
    label: basement membrane
  in_complex:
    id: GO:0016011
    label: dystroglycan complex
  supported_by:
  - reference_id: PMID:20044576
  - reference_id: PMID:17905726
  - reference_id: PMID:23940118
  - reference_id: PMID:10366602
- description: Processed beta-dystroglycan (DAG1_BETA; PRO_0000021066, residues 654–895) is
    the transmembrane cytoskeletal adaptor connecting extracellular alpha-dystroglycan to
    intracellular dystrophin or utrophin. These contacts provide the intracellular side of
    the matrix–membrane–cytoskeleton bridge in muscle and non-muscle tissues. In muscle,
    this linkage contributes to the structural integrity of the sarcolemma. Association
    with CLASP proteins also connects dystroglycan to microtubule-associated partners.
  molecular_function:
    id: GO:0008093
    label: cytoskeletal adaptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0042383
    label: sarcolemma
  in_complex:
    id: GO:0016010
    label: dystrophin-associated glycoprotein complex
  supported_by:
  - reference_id: PMID:10767429
  - reference_id: PMID:11495720
  - reference_id: PMID:8017170
  - reference_id: PMID:23940118
suggested_questions:
- question: How do calcium occupancy and local glycosylation alter the conformation and ligand
    competence of full-length dystroglycan under physiological extracellular conditions?
- question: Which processed DAG1 species occupy nuclear, extracellular-vesicle and defective-glycosylation
    compartments, and what functions do those species perform there?
- question: Which platelet cytoskeletal associations are direct interfaces, and which require
    intermediate proteins or specific phosphorylation states?
suggested_experiments:
- description: Measure calcium affinity and occupancy of full-length, glycosylated dystroglycan
    and the isolated IGL–SEA fragment at matched physiological ionic conditions. Compare native
    coordinating-residue substitutions with folding, ligand binding and processing controls.
- description: Resolve alpha-, beta- and released N-terminal species with chain-specific quantitative
    proteomics and orthogonal imaging in nuclear, extracellular-vesicle and defective-glycosylation
    samples, including fraction-purity controls.
- description: Test purified beta-tail and the relevant platelet cytoskeletal partners alongside
    endogenous complex perturbation, retaining phosphorylation state and topology controls
    to distinguish direct binding from bridged association.
status: DRAFT
