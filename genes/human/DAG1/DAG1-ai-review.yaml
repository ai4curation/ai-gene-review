  review:
    summary: Dystroglycan can support Lassa-virus entry in susceptible cells.
    action: KEEP_AS_NON_CORE
    reason: 'The original tests dystroglycan-positive controls as well as alternative entry
      routes: extracellular alpha-DG constructs inhibit susceptible-cell infection, and DAG1
      expression restores entry into deficient cells. Its demonstration of dystroglycan-independent
      routes does not negate this positive receptor role. Dependence is cell-context and glycosylation
      dependent, not a universal requirement for Lassa entry.'
