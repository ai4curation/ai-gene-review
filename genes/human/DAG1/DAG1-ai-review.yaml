  review:
    summary: Dystroglycan undergoes intrinsic SEA-domain endoproteolytic self-processing.
    action: MODIFY
    reason: The original reports S654-dependent intramolecular processing, effects of hydroxyl/thiol
      substitutions and the neighboring loop, and ER-dependent folding. These experiments
      support self-cleavage of the precursor but do not establish the serine/acidic/basic
      catalytic triad required by GO:0004252. General endopeptidase activity preserves the
      demonstrated bond cleavage without assigning that specific enzyme mechanism. This is
      distinct from MMP-mediated ectodomain shedding; cleavage-defective constructs can still
      bind and assemble laminin.
