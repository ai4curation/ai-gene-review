id: Q14118
gene_symbol: DAG1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DAG1 encodes dystroglycan, a cell-surface receptor that links extracellular matrix
  to the membrane-associated cytoskeleton. The 895-residue precursor enters the secretory
  pathway and undergoes SEA-domain self-processing into extracellular alpha-dystroglycan and
  transmembrane beta-dystroglycan, which remain noncovalently associated. Glycosylated alpha-dystroglycan
  binds laminins and other matrix ligands, including agrin and perlecan. Beta-dystroglycan
  anchors this ligand-binding surface in the membrane and engages cytoplasmic partners such
  as dystrophin, utrophin, ankyrin and CLASPs. This linkage supports basement-membrane organization
  and tissue integrity, with specialized roles at muscle membranes, glial interfaces and synapses.
  Glycan-dependent ligand binding, cytoplasmic-tail phosphorylation and proteolytic processing
  modify receptor behavior. Released alpha-derived material and intracellular beta-chain pools
  occur in specific contexts, including nuclear trafficking in cultured human cells.
