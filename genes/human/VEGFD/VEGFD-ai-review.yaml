- term:
    id: GO:0001945
    label: lymph vessel development
  evidence_type: ISS
  original_reference_id: PMID:17392173
  qualifier: involved_in
  review:
    summary: VEGFD promotes lymphangiogenesis downstream of VEGFR3 signaling.
    action: NEW
    reason: Mouse Rip1VEGF-D/Rip1Tag2 tumor-model evidence shows induction of peri-insular and
      peritumoral lymphangiogenesis, and a second mouse tumor model shows that processed VEGFD is
      required for tumor lymphangiogenesis, supporting lymph vessel development as a non-core VEGFD
      vascular output.
    supported_by:
    - reference_id: PMID:17392173
      supporting_text: VEGF-D-expressing tumors also exhibited peritumoral lymphangiogenesis with
        lymphocyte accumulations and hemorrhages
    - reference_id: PMID:21515745
      supporting_text: Processing of VEGF-D is required for tumor angiogenesis, lymphangiogenesis,
        and recruitment of tumor-associated macrophages
- term:
    id: GO:0005161
    label: platelet-derived growth factor receptor binding
  evidence_type: TAS
  original_reference_id: PMID:9479493
  qualifier: enables
  review:
    summary: The FIGF cloning paper does not support platelet-derived growth factor receptor binding.
    action: REMOVE
    reason: PMID:9479493 describes FIGF/VEGFD as a member of the PDGF/VEGF growth-factor family and
      a secreted mitogen, but the cached abstract does not report platelet-derived growth factor
      receptor binding. Direct receptor-specific work instead shows that VEGFD binds and activates
      VEGFR2 and VEGFR3, so the GO:0005161 row appears to overtranslate the PDGF/VEGF family name
      into a PDGF receptor-binding activity.
    supported_by:
    - reference_id: PMID:9479493
      supporting_text: It codes for a secreted factor with mitogenic and morphogenic activity on
        fibroblast cells
    - reference_id: PMID:9435229
      supporting_text: VEGF-D is a ligand for both VEGF receptors (VEGFRs) VEGFR-2 (Flk1) and
        VEGFR-3 (Flt4) and can activate these receptors
    source_defects:
    - defect_type: WRONG_TERM
      resource: PINC
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0005161
      cause: LABEL_WITHOUT_DEFINITION
      confidence: PROBABLE
      explanation: >-
        The PMID:9479493 abstract identifies FIGF/VEGFD as a new PDGF/VEGF-family member and a
        secreted mitogen, but does not show platelet-derived growth factor receptor binding. Later
