id: O43915
gene_symbol: VEGFD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'VEGFD encodes vascular endothelial growth factor D, a secreted VEGFC-like PDGF/VEGF-family
  precursor. Proteolytic maturation exposes the VEGF homology domain that binds and activates VEGFR2/KDR
  and VEGFR3/FLT4 but not VEGFR1, promoting VEGF receptor signaling in vascular and lymphatic endothelial
  contexts; mast-cell chemotaxis is a peripheral inflammatory output.'
