- term:
    id: GO:0016020
    label: membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1915008
  - MGI:MGI:2443191
  - PANTHER:PTN009058713
  - UniProtKB:P22760
  review:
    summary: >-
      Unlike the hydrolase row, this transfer used a tight and topologically coherent donor set:
      mouse Aadac, mouse Nceh1 and human AADAC, all three curated as single-pass type II membrane
      proteins whose catalytic domain faces the endoplasmic reticulum lumen or the extracellular
      space. The secreted family member AADACL2 is not among the donors, so the transfer is
      discriminating rather than indiscriminate, and that matters here because the family gives
      conflicting topology at roughly equal sequence distance: AADAC and NCEH1 are membrane-anchored
      at about 33% identity to AADACL3 while AADACL2 is secreted at about 34%.

      The inference is independently corroborated. Phobius places transmembrane segments at 6-29 and
      41-60 in AADACL3 and TMHMM places helices at 4-26 and 43-60, while neither SignalP nor Phobius
      reports a cleaved signal peptide; both methods assign residues 61-407, the whole catalytic
      domain, to the non-cytoplasmic side. The discriminating control is AADACL2, where SignalP does
      fire and UniProt's curated location is Secreted, so the absence of a signal-peptide call for
      AADACL3 is informative rather than a default.

      Worth recording rather than smoothing over: both predictors call two helices in AADACL3, not
      one, and the mouse ortholog settles the point. UniProt curates Aadacl3 (A2A7Z8), 61.9% identical
      to the human protein and carrying the same triad, as `Membrane; Multi-pass membrane protein`
      with three helices at 2-22, 46-66 and 109-129. So the family's single-pass type II description
      is an under-call for this branch, not just for the human protein. Since either topology leaves the
      catalytic domain non-cytoplasmic, the biological
      reading is unchanged, and because the donors split between endoplasmic reticulum membrane
      (AADAC) and plasma membrane (NCEH1), the generic term membrane is the correct level. That is
      worth stating positively rather than as a hedge: the donors' curated locations resolve to four
      distinct strings between them - endoplasmic reticulum membrane and microsome membrane for AADAC,
      cell membrane and microsome for Nceh1 - so refining the term would mean picking one donor over
      another arbitrarily. GO:0016020 is the lowest common ancestor of the donor locations just as
      GO:0016787 is of the donor activities, and in both cases the general term is the ontology
      working correctly rather than curation stopping short. Note also that GO:0016020 has absorbed
      GO:0016021 integral component of membrane as a secondary identifier, so a transmembrane-helix
      prediction now supports this exact term.

      One qualifier nuance is worth acknowledging rather than silently accepting. The row asserts
      is_active_in, which locates the activity in the bilayer, while the topology reading places the
      catalytic domain on the non-cytoplasmic side of it - so on a strict reading the hydrolysis
      happens at the membrane surface rather than within the lipid phase. The alternative would be to
      name the compartment the catalytic domain faces, and that cannot be done for AADACL3 without
      knowing which membrane it sits in, so the qualifier is left as GOA has it.
    action: ACCEPT
    reason: >-
      Correct at the right level of generality, from an appropriately restricted donor set, and
      corroborated by concordant Phobius and TMHMM predictions on the AADACL3 sequence itself with
      a secreted paralog as a negative control. Kept generic deliberately: the evidence supports
      membrane integration but cannot identify which membrane.
    supported_by:
    - reference_id: file:human/AADACL3/AADACL3-bioinformatics/RESULTS.md
      supporting_text: '| ADCL3_HUMAN (Q5VUY0) | - | - | - | [(6, 29), (41, 60)] | - | [(4, 26), (43, 60)] | - |'
    - reference_id: file:human/AADACL3/AADACL3-bioinformatics/RESULTS.md
      supporting_text: '| ADCL2_HUMAN (Q6P093) | - | [(1, 18)] | Secreted | - | [(1, 19)] | - | [(1, 18), (1, 19)] |'
    - reference_id: file:human/AADACL3/AADACL3-bioinformatics/RESULTS.md
      supporting_text: '| ADCL3_MOUSE (A2A7Z8) | [(2, 22), (46, 66), (109, 129)] | - | Membrane; Multi-pass membrane protein | [(42, 61), (111, 129)] | [(1, 26)] | [(2, 24)] | - |'
    - reference_id: PMID:35736449
      supporting_text: >-
        The arylacetamide deacetylase (AADAC) protein family name giving protein AADAC is a type II
        membrane glycoprotein, facing with its active side to the lumen of the endoplasmic reticulum
