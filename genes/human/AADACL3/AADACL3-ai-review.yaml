suggested_questions:
- question: >-
    Could PAINT place GO:0017171 serine hydrolase activity at a node that reaches the AADACL
    paralogs? The mechanism is the one property that travels well in this family, and human AADAC and
    NCEH1 already receive the term at their own ortholog nodes PTN002745055 and PTN002745068, but
    AADACL2, AADACL3 and AADACL4 receive nothing on that axis. Reading the nucleophile of every source
    on
    AADACL3's own hydrolase-activity IBA gives thirteen serines out of the fourteen that resolve to a
    protein, the formamidase Afmid included; the single exception is soybean HIDH with Thr164. That
    one member is what makes GO:0016787 rather than GO:0017171 the correct lowest common ancestor of
    node PTN009058710, so the term cannot simply be moved there as-is. Three routes would work.
    PAINT's own device for a divergent descendant is to annotate the ancestral node and mark HIDH with
    a NOT, which is the most direct answer and leaves the paralogs annotated; alternatively the tighter
    node PTN009058713, already used for the membrane annotation, contains no threonine-nucleophile
    member; or a sub-node of PTN009058710 excluding HIDH would serve. Two things to be clear about, since
    both are easy to overstate. First, this is not a claim that the existing generic terms are wrong:
    the donor set for the activity spans ester and amide chemistry, and the donor locations for
    GO:0016020 resolve to four distinct strings, so in both cases the general term is the correct
    ancestor of a genuinely heterogeneous set, and this review replaces the activity rows for
    redundancy with a subfamily-derived term rather than for over-generality. Second, AADACL3 and
    AADACL4 do inherit a molecular-function term already, and so does AADACL2: all three carry
    GO:0016787 from PTN009058710, and on that row the WITH/FROM sets are identical token-for-token
    across the three - so the gap is an uninformative parent rather than nothing at all. All three
    also already carry GO:0052689 from InterPro:IPR017157, which is what makes the remedy portable:
    modifying the generic row toward GO:0052689 merges two rows that already exist on each record,
    whereas modifying it toward GO:0017171 would introduce a term that appears on none of them and
    that one donor of the cited node refutes. All three paralogs now resolve that row the same way -
    MODIFY toward GO:0052689 on redundancy grounds, with GO:0017171 pursued as the node move asked
    about here rather than asserted on the row - so the question for PAINT is only where the
    mechanism term should sit, not which of three readings of the row is right.
- question: >-
    Why does UniProt make three different N-terminal calls across three paralogs with identical
    catalytic registers, and can they be reconciled? AADACL4 is annotated TRANSMEM 5-25 with a type
    II signal anchor and Single-pass type II membrane protein; AADACL2 is annotated SIGNAL 1-18 with
    location Secreted; AADACL3 is annotated with no N-terminal feature at all, no membrane or
    transmembrane keyword, and no SUBCELLULAR LOCATION comment, despite a comparably hydrophobic
    N-terminal segment and concordant Phobius and TMHMM transmembrane calls. AADACL3 is the extreme
    case, and the position it leaves a curator in is not that UniProt disagrees with the GO
    annotation but that UniProt has not made a call at all. The mouse ortholog makes the
    inconsistency harder to explain as biology: UniProt curates Aadacl3 (A2A7Z8), 61.9% identical
    with the same triad, as Membrane; Multi-pass membrane protein with three helices. The asymmetry
    is visible in GOA as well - AADACL4's membrane IEA cites UniProtKB-SubCell:SL-0162 and AADACL3's
    does not, because that mapping can only fire for an entry that already has a curated location.
- question: >-
    Is AADACL3's N-terminal hydrophobic region an uncleaved signal anchor, making it a type II
    membrane protein with a lumenal or extracellular catalytic domain like AADAC, NCEH1 and AADACL4,
    or is it a cleaved signal peptide, making AADACL3 a secreted enzyme like AADACL2? Phobius and
    TMHMM favour membrane integration and SignalP gives no cleavage call, but the family contains
    both outcomes at comparable sequence distance, so this cannot be settled from sequence alone.
- question: >-
    AADACL3 does not match PROSITE PS01174, the GDXG-family serine active-site pattern, because of
    Cys190 and Phe194 in positions flanking the intact G-D-S core. Do those two substitutions reshape
    the acyl-binding pocket and shift substrate preference relative to AADAC, or are they neutral?
- question: >-
    AADACL3 transcript is enhanced in placenta and skin, and its 3q25.1 relative AADACL2 is recorded
    by the Human Protein Atlas as skin-enriched, whereas the characterised members of the family are
    expressed in liver and intestine (AADAC) or brain, macrophage and platelet (NCEH1). Is there a
    skin or placental ester-hydrolase role for this branch of the family, for instance in barrier
    lipid processing?
- question: >-
    AADACL3 and AADACL4 form a tandem pair at 1p36.21 and are 55% identical to each other but only
    about a third identical to any characterised family member. Do they act on a shared substrate,
    and is either of them under selection in humans, given that both remain undetected at the protein
    level?
suggested_experiments:
- hypothesis: >-
    AADACL3 is a membrane-integral protein whose catalytic domain faces the endoplasmic reticulum
    lumen or the extracellular space, and is not secreted.
  description: >-
    Express epitope-tagged AADACL3 in a cell line that does not express it endogenously, and
    determine topology directly: test whether the N-terminal segment is cleaved by comparing the
    apparent mass of N- and C-terminally tagged constructs, test membrane integration by alkaline
    extraction and carbonate flotation of microsomes, test the orientation of the catalytic domain by
    protease protection of sealed microsomes with and without detergent, and test lumenal exposure by
    endoglycosidase H sensitivity of the N-glycans. Assay conditioned medium for the tagged protein
    in parallel, using AADACL2 as a secreted positive control.
  experiment_type: cell biology
- hypothesis: >-
    AADACL3 is a catalytically active serine hydrolase, and its activity depends on Ser193.
  description: >-
    Purify recombinant AADACL3 lacking the N-terminal transmembrane region alongside a S193A mutant
    and screen for hydrolase activity against a substrate panel spanning the family's known
    chemistry: p-nitrophenyl esters of increasing acyl-chain length, mono- and diacylglycerols,
    triacylglycerol, cholesteryl oleate, retinyl palmitate, 1-O-hexadecyl-2-acetyl-sn-glycerol, and
    arylacetamide drug substrates including flutamide and phenacetin. Any activity lost in S193A is
    attributable to the predicted nucleophile, which would convert the GO:0052689 prediction into an
    experimentally supported annotation.
  experiment_type: enzymology
- hypothesis: >-
    Endogenous AADACL3 is an active serine hydrolase in the tissues where its transcript is enriched.
  description: >-
    Apply activity-based protein profiling with fluorophosphonate probes, the approach that
    established AADACL1/KIAA1363 as an active serine hydrolase, to lysates of human skin and
    placenta, and identify AADACL3 in the labelled proteome by mass spectrometry. This would also
    supply the first protein-level detection of AADACL3, whose protein existence is currently
    transcript-level only. Competition with an unlabelled probe and comparison with AADACL3-depleted
    material would confirm the assignment.
  experiment_type: chemoproteomics
- hypothesis: >-
    The Cys190 and Phe194 substitutions that break the PROSITE PS01174 match alter substrate
    preference rather than abolishing catalysis.
  description: >-
    Compare wild-type AADACL3 with C190S and F194A single mutants, and with the double mutant that
    restores the PS01174-conforming pattern, across an acyl-chain-length series of p-nitrophenyl
    esters. A shift in chain-length optimum without loss of activity would show the substitutions
    tune the acyl-binding pocket; loss of activity would instead indicate they are structurally
    required.
  experiment_type: enzymology
