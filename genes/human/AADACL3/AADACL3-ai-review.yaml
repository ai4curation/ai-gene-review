  supporting_entities:
  - ARBA:ARBA00028763
  - InterPro:IPR017157
  review:
    summary: >-
      The same conclusion as the phylogenetic membrane annotation, reached independently through
      UniProt's automatic pipelines from an ARBA rule and from the arylacetamide-deacetylase
      subfamily signature IPR017157, which matches AADACL3 across residues 19-403. It is retained on
      the same evidence and for the same reason.

      One point about this row deserves emphasis because it inverts the usual direction of concern.
      AADACL3's UniProt entry contains no TRANSMEM feature, no signal-peptide feature, no membrane or
      transmembrane keyword and no SUBCELLULAR LOCATION comment at all, so this GO annotation looks
      at first sight to be unsupported by the underlying record. It is not: its tandem paralog
      AADACL4 is the same length, carries the same numbered active sites and oxyanion motif, receives
      identical Phobius transmembrane calls, and is annotated by UniProt with TRANSMEM 5-25, both
      topological domains and Single-pass type II membrane protein. The difference between the two
      entries is coverage of UniProt's automatic annotation, not biology. The mouse ortholog closes
      the argument: UniProt curates Aadacl3 (A2A7Z8) as `Membrane; Multi-pass membrane protein` with
      three transmembrane helices, so the same gene in mouse carries a curated membrane location
      while the human entry carries none at all. The GO record is therefore ahead of the UniProt
      feature table here, and the gap is an error to report upstream rather than a reason to weaken
      the annotation.
    action: ACCEPT
    reason: >-
      Independently derived, biologically supported, and at the appropriate level of generality. The
      apparent absence of supporting UniProt features is a coverage gap in UniProt's automatic
      annotation of this entry rather than evidence against membrane localisation, as shown by the
      identical predictions on the tandem paralog AADACL4, which did receive the features.
