- id: file:human/AADACL2/AADACL2-bioinformatics/NODE_PTN009058710.md
  title: 'PANTHER node PTN009058710: which GO term is true of every donor? (shared node-level audit
    for AADACL2, AADACL3 and AADACL4)'
  findings:
  - statement: The node-level audit shared by the three paralogs that carry this identical row
      confirms independently that GO:0016787 is the exact least common ancestor of the donor set,
      and that neither GO:0052689 nor GO:0017171 is true of every donor.
    supporting_text: No donor refutes `GO:0016787`, and every more specific candidate is refuted by
      at least one donor.
  - statement: It also resolves the two donors this gene's own audit could not settle - yeast BNA7
      resolves to Q04066 with a serine nucleophile, so the node-wide serine tally is 15 of 16 - and
      shows soybean HIDH to be a bifunctional carboxylesterase/dehydratase rather than a weakly
      inferred hydrolase, its GO:0106435 carboxylesterase activity being IDA.
    supporting_text: So HIDH is a genuine, if physiologically minor, carboxylic-ester hydrolase; it
      refutes the *serine* term only.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Shared node-level audit for the three paralogs, reproducible with
      audit_node_PTN009058710.py in the AADACL2 bioinformatics folder. It reaches the same
      lowest-common-ancestor conclusion this review reached, by a different route, and supplies two
      donor resolutions this gene's own analysis reported as unresolved or weak.
- id: file:human/AADACL3/AADACL3-deep-research-affinage.md
  title: Affinage mechanistic annotation for AADACL3 (human)
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
