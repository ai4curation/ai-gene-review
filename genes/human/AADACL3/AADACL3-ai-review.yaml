- id: PMID:35736449
  title: KIAA1363-A Multifunctional Enzyme in Xenobiotic Detoxification and Lipid Ester Hydrolysis.
  publication_type: REVIEW
  findings:
  - statement: >-
      AADACL3 is one of three AADAC-family members with no established function, a statement made
      explicitly by the family's own review literature rather than inferred from an absence of search
      hits.
    supporting_text: >-
      Except for AADACL1, more commonly known as KIAA1363, all other members of the AADACL protein
      family, AADACL2, AADACL3, and AADACL4, have so far been only poorly investigated and no
      functional roles can be concluded.
  - statement: >-
      The family prototype is a type II membrane glycoprotein with its catalytic face in the
      endoplasmic reticulum lumen, which is the topology the membrane IBA transfers to AADACL3.
    supporting_text: >-
      The arylacetamide deacetylase (AADAC) protein family name giving protein AADAC is a type II
      membrane glycoprotein, facing with its active side to the lumen of the endoplasmic reticulum
      (ER) [1].
  - statement: >-
      The characterised chemistry of the family spans endogenous neutral lipids and xenobiotic drugs,
      which is why the ester-hydrolase annotation on AADACL3 is best left substrate-agnostic.
    supporting_text: >-
      AADAC substrates include neutral lipids such as diglycerides, but also several xenobiotics,
      including a number of clinical drugs, such as the antiandrogen drug flutamide, the analgesic
      antipyretic drug phenacetin, and the antituberculosis drug rifamycin [1,4,5,6,7].
  - statement: >-
      Substrate preference is not conserved even between the two best-characterised members, so a
      substrate cannot be inferred for AADACL3 from family membership.
    supporting_text: >-
      This hypothesis has been tested in yeast, where KIAA1363 (AADACL1) was unable to rescue the
      cholesterol acetate accumulation phenotype of the AADAC yeast ortholog Say1Δ-mutant [6],
      suggesting that the two enzymes have different substrate specificity, with the latter lacking
      sterol acetate hydrolase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached title matches the citation and the full text was retrieved from PMC9229287, so the
      quotes above come from the article body rather than an abstract. The most useful reference for
      this gene: it states in so many words that AADACL3 has no established function, which
      independently corroborates the PubMed search rather than relying on an absence of hits, and it
      supplies the family topology and substrate range that the propagated annotations rest on. It is
      a review, so it is used for family-level framing and for its explicit statement about AADACL3,
      not as primary evidence for any AADACL3 activity.
