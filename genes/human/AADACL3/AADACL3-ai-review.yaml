- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR013094
  review:
    summary: >-
      This is the row where the recurring pattern of a domain name propagating into GO as an activity
      is actually visible in the evidence. The mapping source is IPR013094 Alpha/beta hydrolase
      fold-3, which is a fold signature: it constrains architecture, not which reaction the
      architecture performs. The signature comparison makes the difference concrete. IPR013094 also
      matches soybean HIDH, at residues 74-298, even though HIDH falls outside the
      arylacetamide-deacetylase subfamily entirely - it matches neither IPR017157 nor PIRSF037251 nor
      even the family-level IPR050300 - and its physiologically important reaction is a dehydration
      rather than a hydrolysis. So fold-3 membership reaches beyond the subfamily whose chemistry is
      being asserted, and within the panel the same scaffold supports amide hydrolysis (AADAC's
      arylacetamide deacetylation), ester hydrolysis and a dehydration. In AADACL3 the fold match is
      also split into two segments, 115-245 and 310-380, and that first segment is the shortest of
      any family member examined.

      The mapping nevertheless reaches a defensible conclusion here, and the reason is worth stating
      because it is the check that distinguishes a fold-name artefact from a real inference: the
      catalytic residues are present. Ser193, Asp347 and His377 read out of the sequence as the
      expected serine, aspartate and histidine, they sit in a canonical GDSFGG nucleophile elbow, the
      oxyanion loop at 119-121 is HGG, and all three align onto curated active sites in AADAC, NCEH1,
      mouse Nceh1, AADACL2 and AADACL4.

      A near-miss trap should be recorded alongside that. PROSITE PS01174, the GDXG-family putative
      serine active site pattern, matches AADAC, NCEH1 and AADACL2 but does not match AADACL3, which
      taken at face value looks exactly like the loss of catalytic machinery one would use to argue an
      esterase annotation away. Walking the pattern position by position shows both mismatches are
      flanking positions - Cys190 where the pattern wants serine or alanine, Phe194 where it wants
      cysteine, alanine or serine - while pattern positions 5 to 7, the G-D-S core containing the
      nucleophile, are intact. The right reading is a possible shift in the acyl-binding pocket and
      hence in substrate preference, not loss of activity.

      As with the phylogenetic row, the term is not wrong for its source - `hydrolase activity` is a
      fair statement about a hydrolase fold - and it is not proposed for removal. It is replaced
      because it is a proper ancestor of GO:0052689, which GOA already carries for this gene from a
      subfamily signature rather than from the fold, and which is therefore both more specific and
      better provenanced. GO:0017171 serine hydrolase activity is also true of AADACL3 on the verified
      triad, but a fold that includes a threonine-nucleophile member cannot deliver it, so it is
      raised as a PAINT node-placement recommendation in suggested_questions rather than proposed
      here.
    action: MODIFY
    reason: >-
      Correct for its source but uninformative for this gene, and derived from a fold-level signature
      that reaches outside the arylacetamide-deacetylase subfamily whose chemistry it is being used to
      assert, so it is weaker in provenance than the specific annotation it duplicates. Replaced as
      redundant, not as over-general for the fold it describes.
      GO:0052689 carboxylic ester hydrolase activity, already present on this gene from the
      arylacetamide-deacetylase subfamily signature IPR017157 and consistent with UniProt's EC
      3.1.1.- assignment, is the better term and is supported by the verified catalytic triad.
    proposed_replacement_terms:
    - id: GO:0052689
      label: carboxylic ester hydrolase activity
    supported_by:
    - reference_id: file:human/AADACL3/AADACL3-bioinformatics/RESULTS.md
      supporting_text: 'Pattern (fetched from PROSITE): `[LIVM]-x-[LIVMF]-[SA]-G-D-S-[CAS]-G-[GA]-x-[LI]-[CAVT]`'
    - reference_id: file:human/AADACL3/AADACL3-bioinformatics/RESULTS.md
      supporting_text: '| ADCL3_HUMAN (Q5VUY0) | no | - | pos 4 wants [SA], has C190, pos 8 wants [CAS], has F194 |'
    - reference_id: file:human/AADACL3/AADACL3-bioinformatics/RESULTS.md
      supporting_text: '| ADCL3_HUMAN (Q5VUY0) | [(115, 245), (310, 380)] |'
    - reference_id: file:human/AADACL3/AADACL3-bioinformatics/RESULTS.md
      supporting_text: '| HIDH_SOYBN (Q5NUF3) | - | - | 74-298 | - |'
    propagation_review:
      root_cause: EVIDENCE_CIRCULAR_OR_REDUNDANT
      source_entities:
      - source_id: InterPro:IPR013094
        source_label: Alpha/beta hydrolase fold-3 (fold-level domain)
        source_status: CIRCULAR_OR_REDUNDANT
        comment: >-
          A fold signature, not an activity. It reaches beyond the subfamily whose chemistry is being
          asserted: it also matches soybean HIDH at 74-298, which matches neither IPR017157 nor
          PIRSF037251 nor the family-level IPR050300, and whose physiologically important reaction is
          a dehydration rather than a hydrolysis. In AADACL3 the match is also split, 115-245 and
          310-380.
          The activity conclusion here is carried by the intact Ser-Asp-His triad and by the
          subfamily signature IPR017157, not by this fold match.
