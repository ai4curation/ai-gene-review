- id: file:human/AADACL3/AADACL3-bioinformatics/RESULTS.md
  title: Is AADACL3's esterase annotation a fold name, or is the catalytic machinery really there?
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Analysis written for this review (analyze.py), re-runnable, with sequences, active-site
      features, InterPro signature matches, InterProScan topology predictions and the PROSITE pattern
      all fetched live at run time; a missing or empty record raises rather than being counted as
      absence, and a second run reproduces both RESULTS.md and results.json byte for byte. It was
      designed to be able to falsify the annotations under review in either direction: had Ser193,
      Asp347 or His377 read as something other than serine, aspartate and histidine, or had the triad
      failed to align onto curated active sites, the ester-hydrolase terms would have been argued
      down; had SignalP called a cleaved signal peptide as it does for AADACL2, the membrane terms
      would have been. It also records the observations that cut against a tidy story - the PROSITE
      PS01174 miss, the split Pfam match with the shortest first segment in the panel, and the
      two-helix rather than single-pass topology call - and resolves the PROSITE miss to individual
      pattern positions instead of letting it stand as a bare negative. Extended after PR review to
      add the subfamily-versus-fold signature table (section 6), and again to add the nucleophile
      audit of the IBA source set (section 7) and the mouse ortholog of the query to the panel. The
      audit reads its WITH/FROM tokens from the gene's own AADACL3-goa.tsv so they cannot drift from
      the record under review, resolves model-organism identifiers through the Alliance API and
      Arabidopsis loci through UniProt, and reports the three tokens it cannot resolve to a single
      reviewed entry as unresolved rather than dropping them - so the 13-of-14 serine count is a count
      of what was actually readable. That count is superseded by the shared node audit in
      genes/human/AADACL2/AADACL2-bioinformatics/, which resolves BNA7 directly through
      xref:sgd-S000002836 to Q04066 rather than through the Alliance record and so reports 15 of 16
      donors with a serine nucleophile; the sole non-serine donor is HIDH either way. Its stated
      limits are that the topology calls are predictions that cannot name a compartment, and that
      nothing in it demonstrates catalytic activity.
- id: file:human/AADACL3/AADACL3-uniprot.txt
  title: UniProtKB record Q5VUY0 (ADCL3_HUMAN)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The primary record for the gene, and mostly notable for what it lacks: no FUNCTION, no
      CATALYTIC ACTIVITY, no SUBUNIT and no SUBCELLULAR LOCATION comment, protein existence at
