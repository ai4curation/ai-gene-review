id: Q5VUY0
gene_symbol: AADACL3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AADACL3 is an uncharacterised human member of the arylacetamide deacetylase (AADAC) family of
  'GDXG' lipolytic enzymes. The characterised members of that family are serine hydrolases that
  cleave ester and amide bonds in both lipid and xenobiotic substrates: AADAC itself is an
  endoplasmic reticulum type II membrane glycoprotein that deacetylates arylacetamide drugs such as
  flutamide, phenacetin and rifamycin and hydrolyses diacylglycerol, while NCEH1/AADACL1 hydrolyses
  acetyl monoalkylglycerol ether, cholesteryl esters and retinyl esters. AADACL3 retains the full
  catalytic apparatus of the family - an alpha/beta-hydrolase fold-3 core carrying a
  Ser193-Asp347-His377 triad in a canonical GDSFGG nucleophile elbow, together with an HGG oxyanion
  loop - and UniProt assigns it the carboxylic-ester hydrolase class EC 3.1.1.-, but no catalytic
  activity, substrate or physiological role has been measured for it, and the protein itself has not
  yet been detected. Its N-terminal region is predicted to be membrane-embedded rather than a cleaved
  signal peptide, which would leave the catalytic domain facing the lumenal or extracellular side of
  a membrane as in AADAC and NCEH1; the comparably related AADACL2, by contrast, is secreted.
  AADACL3 lies in a tandem pair with AADACL4 at chromosome 1p36.21, separate from the AADAC/AADACL2
  pair at 3q25.1, and its nearest characterised relative shares only about a third of its sequence.
  Transcript expression is enhanced in placenta and skin, in contrast to the liver and intestinal
  expression of AADAC.
