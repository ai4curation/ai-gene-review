  review:
    summary: >-
      Phylogenetic transfer of the generic term hydrolase activity from a deliberately wide clade.
      Resolving all seventeen WITH/FROM entries explains why the term is so general: the set mixes
      carboxylesterases (E. coli Aes, three M. tuberculosis esterases), arylacetamide deacetylase and
      neutral cholesterol ester hydrolase 1 from mouse, rat and human, two formylkynurenine
      formamidases that are amidohydrolases rather than esterases (mouse Afmid and yeast BNA7), four
      Arabidopsis loci, and soybean 2-hydroxyisoflavanone dehydratase, which UniProt gives two EC
      numbers, 3.1.1.1 carboxylesterase and 4.2.1.105 dehydratase. Hydrolase activity is close to the
      most specific term that survives across esterases and amidohydrolases together, so as a statement
      about that clade node
      the annotation is defensible, and it is certainly not wrong for AADACL3.

      It is nonetheless the least informative of the three molecular-function terms GOA carries for
      this gene, and it is a proper ancestor of GO:0052689 carboxylic ester hydrolase activity, which
      the same GOA record already asserts from the arylacetamide-deacetylase subfamily signature
      IPR017157.

      The weakest donor in the supporting set is soybean HIDH (Q5NUF3). UniProt assigns it both EC
      3.1.1.1 carboxylesterase and EC 4.2.1.105 2-hydroxyisoflavanone dehydratase, so it does
      formally license a hydrolase term, but only weakly: the dehydration is the physiologically
      important reaction and the esterase activity is described as slight, toward p-nitrophenyl
      butyrate.

      Reading the donors' own active sites settles whether a more specific term could have been used
      at this node, and the answer is no. Of the seventeen WITH/FROM tokens, fourteen resolve to a
      protein whose nucleophile can be read, and thirteen of those have a serine nucleophile -
      including the formamidase Afmid, so the amidohydrolase members are serine hydrolases and are no
      obstacle. The obstacle is HIDH, whose nucleophile is Thr164. That single member is enough to
      keep GO:0017171 serine hydrolase activity off this node, and the two formamidases hydrolyse an
      amide rather than an ester bond, which keeps GO:0052689 off it as well. GO:0016787 really is the
      lowest common ancestor of this donor set, so the term is correct curation rather than a lazy or
      over-general choice, and this row is not an over-annotation or a term-scoping error.

      What remains is redundancy. AADACL3's GOA already carries GO:0052689 carboxylic ester hydrolase
      activity from the arylacetamide-deacetylase subfamily signature IPR017157, which is stronger,
      more direct evidence for this particular gene than a transfer from a clade whose breadth forces
      the term up to a parent. AADACL3's own assignment is much tighter than the clade it was
      annotated from: PIRSF037251 and IPR017157 both match residues 19-403 (PIRSF at 5.8e-82), UniProt
      gives the RecName EC number 3.1.1.-, and the catalytic apparatus is verifiably intact - Ser193,
      Asp347 and His377 read out of the sequence as serine, aspartate and histidine in a canonical
      GDSFGG nucleophile elbow with an HGG oxyanion loop at 119-121, all three landing on curated
      active sites of the same residue identity in AADAC, NCEH1, mouse Nceh1 and the mouse ortholog.

      That verified triad does support GO:0017171 for the gene, whose definition it satisfies
      literally - serine nucleophile activated through an acidic and a basic residue. But it cannot
      be reached by transfer from this node, for the reason above, so it is raised as a node-placement
      recommendation for PAINT in suggested_questions rather than proposed as a replacement here.
    action: MODIFY
    reason: >-
      The essence is right but the granularity is not. Redundant with, and subsumed by, GO:0052689
      already present on the same gene from a subfamily-specific signature, which is supported
      independently by the intact Ser-Asp-His triad and by UniProt's own EC 3.1.1.- assignment.
      This is a redundancy judgement, not a claim that the term is too general for its node. The
      donor audit confirms GO:0016787 is the true lowest common ancestor here: HIDH's threonine
      nucleophile blocks a serine-hydrolase term and the two formamidases' amide chemistry blocks an
      ester term, so PAINT's choice is correct curation. What makes the row replaceable is that the
      same GOA record already carries GO:0052689 from a subfamily-specific signature, which is
      stronger and more direct evidence for this gene than a transfer from a clade that broad.

      No failure mode is recorded. Read literally, GRANULARITY_MISMATCH (a parent term that is
      true but uninformative) does describe how much this term tells you about this gene; but the
      slot is the biological shape of a propagation issue, and this propagation has none - the term
      is uninformative because the donor set is heterogeneous, not because the transfer could have
      been more specific. That is the same encoding now used for AADACL2 and AADACL4, which carry
      the identical row, so the three paralogs no longer disagree about it. The row is still
      described honestly on both readings: correct where it was asserted, uninformative where it
      landed.
    proposed_replacement_terms:
    - id: GO:0052689
      label: carboxylic ester hydrolase activity
