    summary: >-
      The best-supported statement in AADACL3's GO record, and the term the two generic
      hydrolase-activity rows should collapse onto. Three independent lines converge on it. First the
      signature is subfamily-specific rather than fold-level: IPR017157 Arylacetamide deacetylase
      matches residues 19-403, and its PIRSF member signature PIRSF037251 scores 5.8e-82 over the
      same span and is InterPro's representative match for the protein. Second UniProt's own RecName
      carries EC 3.1.1.-, the carboxylic-ester hydrolase class that GO:0052689 corresponds to. Third,
      and decisively for distinguishing a family-name artefact from a real prediction, the catalytic
      machinery is present and correctly positioned: Ser193 in a GDSFGG nucleophile elbow, Asp347,
      His377, and an HGG oxyanion loop at 119-121, with all three triad residues aligning onto
      curated active sites in every characterised relative examined.

