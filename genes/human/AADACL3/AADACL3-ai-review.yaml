core_functions:
- description: >-
    Predicted serine carboxylic-ester hydrolase of the arylacetamide deacetylase family, most likely
    acting with its catalytic domain on the lumenal or extracellular face of a membrane. The
    prediction rests on an intact and correctly positioned catalytic apparatus rather than on family
    membership alone: Ser193 sits in a canonical GDSFGG nucleophile elbow, Asp347 and His377 complete
    a Ser-Asp-His triad, the oxyanion loop at 119-121 is HGG, and all three triad residues align onto
    curated active sites in AADAC, NCEH1, mouse Nceh1 and the mouse ortholog Aadacl3. UniProt
    independently assigns EC 3.1.1.-. The mechanism and the reaction class are separately evidenced
    and neither subsumes the other - the triad satisfies the definition of serine hydrolase activity
    (GO:0017171) on its own, while the ester-class assignment rests on the subfamily signature and the
    EC number - so GO:0052689 is given here as the more informative of the two, with the mechanism
    term left as a PAINT node-placement recommendation rather than asserted as a second activity.
    No substrate has been identified and no activity has been measured, so the function is stated
    substrate-agnostically; it must not be sharpened to a diacylglycerol, cholesteryl-ester or
    arylamide activity by analogy with AADAC or NCEH1, which themselves differ in substrate
    preference. Membrane association is likewise predicted, from concordant Phobius and TMHMM
    transmembrane calls with no signal-peptide call, and the particular membrane is unknown.
  molecular_function:
    id: GO:0052689
    label: carboxylic ester hydrolase activity
  locations:
