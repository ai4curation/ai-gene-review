      protein exists, UniProt records only transcript-level evidence, and Pharos classes the protein
      as Tdark, so nothing here demonstrates turnover of any substrate. And the family's own history
      warns against inferring a substrate from membership - AADAC and NCEH1 diverge enough that NCEH1
      cannot rescue the sterol-acetate phenotype of the yeast AADAC ortholog - so the annotation
      should stay at the substrate-agnostic ester-hydrolase level and must not be sharpened to a
      diacylglycerol, cholesteryl-ester or arylamide term by family analogy.
