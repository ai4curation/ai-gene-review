    label: ephrin receptor signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR034255
  review:
    summary: The ephrin-B ectodomain mapping is consistent with pathway participation.
    action: ACCEPT
    reason: The current IPR034255 record explicitly maps to GO:0048013. Human EFNB1 provides the extracellular Eph-binding
      ligand, a step of the signaling mechanism itself, rather than merely being required for an unrelated outcome.
      Independent human receptor interaction evidence supports this mapping. The annotation does not imply that
      every cleaved EFNB1 fragment retains the extracellular signaling function.
