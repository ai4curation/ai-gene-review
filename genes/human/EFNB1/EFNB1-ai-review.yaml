id: P98172
gene_symbol: EFNB1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EFNB1 encodes ephrin-B1, a single-pass type I membrane ligand for Eph receptor tyrosine kinases. Its
  extracellular domain binds Eph receptors on neighboring cells, initiating signals that control cell adhesion,
  repulsion and tissue organization. The cytoplasmic tail participates in reverse signaling within the ephrin-bearing
  cell. Sequential proteolysis can release an intracellular fragment with a distribution distinct from the membrane-bound
  ligand; developmental and neuronal effects depend on receptor, cell type and presentation context.
