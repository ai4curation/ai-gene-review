core_functions:
- description: Binds Eph receptors through its extracellular domain and contributes the ligand-engagement step of
    ephrin receptor signaling at the plasma membrane. Receptor-binding and activation studies support this cell-contact
    signaling mechanism, with adhesion or repulsion depending on cellular context. Recombinant human ectodomain
    measurements establish additional Eph receptor interactions without implying that every binding event activates
    a receptor or that soluble and membrane-bound presentations are equivalent.
  molecular_function:
    id: GO:0046875
    label: ephrin receptor binding
  directly_involved_in:
  - id: GO:0048013
    label: ephrin receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:8798744
  - reference_id: PMID:35922511
  - reference_id: PMID:23711177
  - reference_id: PMID:12970314
suggested_questions:
- question: Which Eph receptors and ligand presentation states determine whether ephrin-B1 promotes adhesion or
    repulsion in a given human cell type?
- question: What molecular activity does the endogenous human ephrin-B1 intracellular fragment perform, and how
    does it differ from signaling by the membrane-bound cytoplasmic tail?
suggested_experiments:
- description: Compare sequence-verified human ephrin-B1 in membrane-bound, soluble and clustered formats against
    defined Eph receptors, measuring binding, receptor phosphorylation and adhesion or repulsion separately.
- description: Map endogenous ephrin-B1 cleavage products in human cells and measure their localization and partner
    recruitment, then compare cleavage-resistant and tail-mutant proteins without conflating overexpressed fragments
    with the intact ligand.
