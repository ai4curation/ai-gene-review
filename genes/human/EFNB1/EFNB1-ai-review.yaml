  review:
    summary: Association with the signaling receptor ERBB2 is more informative than generic protein binding.
    action: MODIFY
    reason: The human EFNB1–ERBB2 association is supported by endogenous co-immunoprecipitation in human epithelial
      and breast cancer cell lines and by tagged-construct experiments in PMID:22279592. The exact pair is independently
      represented in IntAct; the microscopy records alone are not treated as binding experiments. ERBB2 is an established
      signaling receptor, so GO:0005102 captures the partner class. This does not assign receptor agonism, kinase
      activity, a purified direct interface, or a uniquely mapped binding domain to EFNB1. ERBB2 extracellular and
      PDZ-tail deletions did not eliminate association in the tested context.
