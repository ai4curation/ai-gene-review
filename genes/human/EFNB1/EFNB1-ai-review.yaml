  review:
    summary: Nuclear localization concerns an intracellular EFNB1 fragment.
    action: KEEP_AS_NON_CORE
    reason: PMID:16930449 uses a sequenced human EFNB1 cDNA in COS cells and engineered intracellular fragments.
      The ICD construct beginning at Val260 localizes to nucleus and cytoplasm; deletion of its N-terminal region
      changes that distribution. The cleavage positions used to design constructs were inferred, not established
      by sequencing an endogenous human cleavage product. Preserve the positive nuclear observation as a processed-fragment
      context without relocating the full transmembrane ligand or assigning transcription-factor activity from localization.
