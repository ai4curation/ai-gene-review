  review:
    summary: Human urinary exosome proteomics detected ephrin-B1.
    action: KEEP_AS_NON_CORE
    reason: The original laboratory database supporting PMID:19056867 lists EFNB1, ephrin-B1 precursor, RefSeq NP_004420,
      and one peptide. Its final value 2 is the bibliography reference number for the 2009 study, not a second peptide
      or replicate count. The study surveys a low-density urinary membrane fraction chiefly composed of exosomes
      from healthy humans. Preserve the positive HDA detection as a contextual extracellular-vesicle location; it
      does not establish an active exosomal signaling function, a particular processing chain, or independent peptide-level
      revalidation.
