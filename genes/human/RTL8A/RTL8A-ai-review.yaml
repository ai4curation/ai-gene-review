- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IPI
  original_reference_id: PMID:40680123
  qualifier: enables
  review:
    summary: >-
      RTL8 bridges the retroelement capsid protein PEG10 and the proteasome shuttle factor
      UBQLN2: it confers on UBQLN2 the ability to complex with and regulate PEG10, and only
      with RTL8 present can PEG10 recruit UBQLN2 into stress granules.
    action: NEW
    reason: >-
      RTL8 itself performs the bridging: it binds the PEG10 N-terminal capsid and binds
      UBQLN2, and its N terminus is required to reconstitute the UBQLN2-PEG10 complex. This
      is a specific, informative molecular function (adaptor) replacing the uninformative
      protein-binding rows. Functional work was done on RTL8 collectively (RTL8C as
      representative), and the three paralogs are near-identical, so the activity applies to
      RTL8A.
    supported_by:
    - reference_id: PMID:40680123
      supporting_text: RTL8 confers on UBQLN2 the ability to complex with and regulate PEG10
    - reference_id: PMID:39775359
      supporting_text: RTL8 bound to the N-terminal domain of PEG10 capsid
