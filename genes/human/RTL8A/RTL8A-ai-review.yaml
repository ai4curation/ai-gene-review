id: Q9BWD3
gene_symbol: RTL8A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RTL8A (retrotransposon Gag-like protein 8A; also CXX1B, FAM127B, MAR8A) is one of three
  near-identical X-linked human paralogs (RTL8A/B/C, the FAM127 family) domesticated from a
  Ty3/gypsy sushi-ichi-related LTR retrotransposon. The ~113-residue protein corresponds to
  a single truncated retroviral Gag capsid (CA)-like domain; it lacks the CCHC nucleocapsid
  knuckle, the aspartyl-protease motif and the reverse-transcriptase/integrase regions, so
  it is a non-catalytic capsid-derived protein-interaction module rather than an enzyme.
  RTL8 proteins act at the interface of endogenous retroelement (PEG10) capsid biology and
  cellular proteostasis: RTL8 binds the N-terminal capsid domain of PEG10 and is incorporated
  into PEG10 virus-like particles while inhibiting their formation/release; it binds the
  proteasome shuttle factor UBQLN2 and promotes its translocation to nucleoli/subnuclear
  protein-quality-control compartments; and it is the obligatory bridge that lets UBQLN2
  complex with, degrade, and co-localize with PEG10 in stress granules. The three paralogs
  are nearly identical and are studied collectively (usually as RTL8C). RTL8 proteins
  accumulate with PEG10 in neurons and are relevant to Angelman/Prader-Willi-related
  neurodevelopmental biology.
