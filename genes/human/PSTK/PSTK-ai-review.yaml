- term:
    id: GO:0001717
    label: conversion of seryl-tRNAsec to selenocys-tRNAsec
  evidence_type: ISS
  original_reference_id: PMID:15317934
  qualifier: involved_in
  review:
    summary: 'Proposed process annotation. PSTK catalyses the first of the two tRNA-bound steps that convert
      Ser-tRNA(Sec) to Sec-tRNA(Sec) in eukaryotes: phosphorylation to O-phosphoseryl-tRNA(Sec), which
      SEPSECS then selenylates.'
    action: NEW
    reason: 'Participation test: PSTK itself performs one chemical step of the conversion (Ser-tRNA(Sec)
      to Sep-tRNA(Sec)), and its product is the obligatory SepSecS substrate. It does part of the work
      and is not merely required. Comparator check: SEPSECS, which catalyses the second step, carries
      GO:0001717 by experimental evidence in GOA (accepted in genes/human/SEPSECS). GO:0001717 is a tRNA-modification
      process, not under the existing MF terms and not an ancestor or descendant of any term this gene
      carries. Evidence is transferred from the characterized mouse orthologue (ISS) and from the pathway
      reconstitution with archaeal/eukaryotic PSTK (PMID:17142313).'
    supported_by:
    - &id004
      reference_id: PMID:17142313
      supporting_text: In this two-step pathway, O-phosphoseryl-tRNA(Sec) kinase (PSTK) converts Ser-tRNA(Sec)
        to Sep-tRNA(Sec).
    - reference_id: PMID:17142313
      supporting_text: This misacylated tRNA is the obligatory precursor for a Sep-tRNA:Sec-tRNA synthase
