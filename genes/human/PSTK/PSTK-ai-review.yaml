existing_annotations:
- term:
    id: GO:0000049
    label: tRNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: 'PSTK binds tRNA(Sec), its substrate, through two separate contacts: its C-terminal domain
      grips the D-arm and its catalytic domain binds the acceptor arm.'
    action: ACCEPT
    reason: PSTK discriminates tRNA(Sec) from tRNA(Ser) by binding the tRNA itself, not only the seryl
      group. In the archaeal PSTK-tRNA(Sec) structure the C-terminal domain binds the D-arm independently
      and more tightly than the catalytic domain binds the acceptor arm. Mouse PSTK acts only on Ser-tRNA(Sec).
      tRNA binding is therefore a specific, informative property inherited across the PSTK family (IBA).
      It underlies the core kinase activity and is a genuine part of the enzyme function.
    supported_by:
    - reference_id: PMID:20705242
      supporting_text: The D-arm.CTD binding occurs independently of and much more strongly than the acceptor-arm.NTD
        binding.
    - &id005
      reference_id: PMID:20705242
      supporting_text: PSTK selectively phosphorylates seryl-tRNA(Sec), while SerRS serylates both tRNA(Ser)
        and tRNA(Sec).
    - &id003
      reference_id: file:human/PSTK/PSTK-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Specifically phosphorylates seryl-tRNA(Sec) to O-phosphoseryl-tRNA(Sec), an activated
        intermediate for selenocysteine biosynthesis.
