id: Q8IV42
gene_symbol: PSTK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PSTK is O-phosphoseryl-tRNA(Sec) kinase (L-seryl-tRNA(Sec) kinase, EC 2.7.1.164), an ATP-
  and Mg2+-dependent tRNA kinase in the selenocysteine synthesis pathway of eukaryotes and archaea. After
  seryl-tRNA synthetase charges tRNA(Sec) with serine, PSTK phosphorylates the seryl group to make O-phosphoseryl-tRNA(Sec).
  SEPSECS then uses selenophosphate to convert this intermediate to selenocysteinyl-tRNA(Sec), which decodes
  UGA codons in selenoprotein mRNAs. PSTK acts on Ser-tRNA(Sec) but not on Ser-tRNA(Ser), and it recognizes
  the tRNA itself. Its N-terminal P-loop kinase domain binds the acceptor arm, and its C-terminal domain
  binds the long-stem, short-loop D-arm characteristic of tRNA(Sec). This discrimination is what restricts
  selenocysteine formation to the UGA-decoding tRNA. PSTK occurs in organisms that make selenoproteins.
