suggested_questions:
- question: Is human PSTK activity rate-limiting for Sec-tRNA(Sec) formation, and does PSTK form a complex
    with SEPSECS or SARS1 that channels Ser-tRNA(Sec)?
suggested_experiments:
- hypothesis: Human PSTK has the same tRNA(Sec) D-arm-dependent specificity as the mouse and archaeal
    enzymes.
  description: Assay purified human PSTK with Ser-tRNA(Sec), Ser-tRNA(Ser) and D-arm swap variants, quantifying
    Sep-tRNA formation by acid-urea gel and [gamma-32P]ATP transfer.
