    - *id002
    - reference_id: file:human/PSTK/PSTK-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: selenocysteinyl-tRNA(Sec) from L-seryl-tRNA(Sec)
core_functions:
- description: 'L-seryl-tRNA(Sec) kinase: ATP- and Mg2+-dependent phosphorylation of the seryl moiety
    of Ser-tRNA(Sec) to O-phosphoseryl-tRNA(Sec), the obligatory SEPSECS substrate in the eukaryotic route
    of selenocysteinyl-tRNA(Sec) synthesis. PSTK selects tRNA(Sec) by binding its D-arm.'
