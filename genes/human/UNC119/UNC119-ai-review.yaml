  supporting_entities:
  - PANTHER:PTN002658567
  - UniProtKB:Q13432
  review:
    summary: UNC119A localizes to cytokinetic structures and is required for completion of cytokinesis.
    action: ACCEPT
    reason: Both the direct human IMP row and the PAINT row from the UNC119A node are supported by siRNA and
      localization data showing UNC119A bridges Fyn/Src-family signaling to RAB11-dependent ERK activation at
      the midbody.
    supported_by: &id001
    - &id010
      reference_id: PMID:23535298
      supporting_text: "UNC119a localizes to the centrosome in interphase cells and begins to\ntranslocate from
        the spindle pole to the spindle midzone after the onset of\nmitosis; it then localizes to the intercellular
        bridge in telophase cells and to\nthe midbody in cytokinetic cells. We show that the midbody localization
        of\nUNC119a is dependent on Rab11, and that knocking down UNC119a inhibits the\nRab11-dependent phosphorylation
        and midbody localization of ERK and cytokinesis."
