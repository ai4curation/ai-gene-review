core_functions:
- description: Soluble lipid-binding carrier for a subset of N-terminally acylated or myristoylated cargo
    proteins, including GNAT1/transducin alpha in photoreceptor sensory cilia.
  molecular_function:
    id: GO:0008289
    label: lipid binding
  directly_involved_in:
  - id: GO:0042953
    label: lipoprotein transport
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by: *id017
- description: SH3/SH2-motif adaptor that binds and activates Src-family tyrosine kinases such as LCK, FYN,
    and LYN in immune and mitotic signaling contexts.
  molecular_function: *id003
  directly_involved_in:
  - id: GO:0061098
    label: positive regulation of protein tyrosine kinase activity
  supported_by:
  - *id004
  - *id019
- description: Couples FYN/Src-family signals to RAB11A-dependent ERK phosphorylation and midbody recruitment
    during completion of cytokinesis, relocalizing from centrosomes and spindle poles to the spindle midzone
    and intercellular bridge.
  molecular_function: *id005
