- term:
    id: GO:0005813
    label: centrosome
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN002658567
  - UniProtKB:Q13432
  review:
    summary: UNC119A localizes to centrosomes.
    action: ACCEPT
    reason: 'Two independent localization studies agree that UNC119A is centrosomal: the human RPE ciliary-transport
      study reports UNC119A at the centrosome rather than the ciliary transition zone, and Kasahara et al. show
      interphase centrosome localization before mitotic relocalization.'
    supported_by:
    - *id008
    - *id009
    - *id011
