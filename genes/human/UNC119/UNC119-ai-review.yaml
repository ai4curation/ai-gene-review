- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: PMID:9538874
  qualifier: located_in
  review:
    summary: UNC119A is a soluble cytosolic carrier/adaptor.
    action: ACCEPT
    reason: The old retinal immunoblot found the HRG4/RRG4 protein to be soluble, and the myristoylated-cargo
      carrier model requires a soluble cytosolic pool that shields lipidated peptides before membrane
      delivery.
    supported_by:
    - &id012
      reference_id: PMID:9538874
      supporting_text: "HRG4-RRG4 protein is localized\nin the outer plexiform layer of the retina in the synaptic
        termini of rod and\ncone photoreceptors. Electron microscopic immunolocalization showed the protein\nin
        the cytoplasm and on the presynaptic membranes of the photoreceptor synapses."
    - &id013
      reference_id: PMID:10329014
      supporting_text: "HRG4 (HGMW-approved symbol UNC119) is a novel human photoreceptor-enriched gene\ncoding
        for a 240-amino-acid protein."
    - &id015
      reference_id: PMID:21642972
      supporting_text: "Pulldowns and isothermal titration calorimetry revealed a tight\ninteraction between UNC119
        and acylated Gα peptides."
- term:
    id: GO:0007268
    label: chemical synaptic transmission
  evidence_type: TAS
  original_reference_id: PMID:9538874
  qualifier: involved_in
  review:
    summary: Retinal UNC119 is implicated in photoreceptor synaptic transmission.
    action: KEEP_AS_NON_CORE
    reason: The ProtInc TAS row is old but consistent with photoreceptor synaptic localization and the
      cone-rod dystrophy truncation phenotype; synaptic transmission is tissue-specific rather than the
      generic core molecular role of UNC119A.
    supported_by: &id014
    - *id012
    - *id013
- term:
    id: GO:0007601
    label: visual perception
  evidence_type: TAS
  original_reference_id: PMID:10329014
  qualifier: involved_in
  review:
    summary: UNC119 is needed for retinal visual function.
    action: KEEP_AS_NON_CORE
    reason: Human retinal expression and later disease genetics make visual perception a plausible
      organism-level role, but the cloned HRG4 paper is mainly gene characterization and does not define a
      direct biochemical step in visual perception.
    supported_by: *id014
- term:
    id: GO:0007602
    label: phototransduction
  evidence_type: TAS
  original_reference_id: PMID:9538874
  qualifier: involved_in
  review:
    summary: UNC119 participates in phototransduction by trafficking acylated transducin alpha.
    action: KEEP_AS_NON_CORE
    reason: UNC119 binds the acylated transducin-alpha N terminus and is required for G-protein trafficking in
      sensory cilia; phototransduction is an important retinal context but one cargo-specific arm of the
      broader myristoyl-cargo carrier function.
    supported_by: &id017
    - *id015
    - &id016
      reference_id: PMID:21642972
      supporting_text: "UNC119 deletion in both mouse\nand C. elegans led to G protein mislocalization. Thus, UNC119
        is a Gα subunit\ncofactor essential for G protein trafficking in sensory cilia."
