id: Q13432
gene_symbol: UNC119
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  UNC119 is the human UNC119A member of the PDE6D/UNC119 lipid-binding carrier family. Its C-terminal immunoglobulin-like
  beta-sandwich forms a hydrophobic pocket that binds N-terminal acyl and myristoyl groups on cargo proteins such
  as transducin alpha, allowing soluble trafficking of lipidated sensory-neuron cargo. Its divergent N-terminal
  region contains SH3/SH2-binding motifs used to regulate Src-family kinases, including LCK/FYN in T-cell signaling
  and FYN-RAB11A signaling for completion of cytokinesis; during mitosis UNC119A moves from centrosomes and spindle
  poles to the spindle midzone and intercellular bridge. UNC119A is functionally distinct from UNC119B, which is
  the paralog dedicated to ARL3-dependent NPHP3/cystin delivery to the primary ciliary membrane.
