    label: intercellular bridge
  supported_by: *id001
suggested_questions:
- question: Which myristoylated cargo proteins are selected by human UNC119A rather than UNC119B in
    non-retinal cells?
- question: Do ARL2, ARL3, or ARL15 regulate UNC119A cargo loading or release outside the primary-cilium
    pathway dominated by UNC119B?
- question: How do CK2 phosphorylation and KLHL18-dependent degradation tune UNC119A levels during
    photoreceptor light/dark adaptation?
suggested_experiments:
- hypothesis: UNC119A and UNC119B carry overlapping cargo peptides in vitro but distinct cargo repertoires in
    cells because their divergent N termini specify localization and protein partners.
  description: Perform myristoyl-click enrichment or proximity labeling after UNC119A versus UNC119B
    knockout/rescue in the same ciliated and retinal cell backgrounds, and compare cargo recovery by wild-type
    versus myristoyl-pocket mutants.
  experiment_type: Paralog-specific chemical proteomics
- hypothesis: The UNC119A-RAB11A interaction is required for the cytokinesis role independently of the
    C-terminal myristoyl-binding pocket.
  description: Rescue UNC119A-depleted human cells with N-terminal SH3-motif mutants, C-terminal pocket
    mutants, and RAB11A-binding-defective alleles, then score spindle-midzone localization, ERK midbody
    recruitment, and binucleation.
  experiment_type: Separation-of-function rescue microscopy
