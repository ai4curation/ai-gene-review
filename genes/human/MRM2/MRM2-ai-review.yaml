suggested_questions:
- question: Does Um1369 itself, apart from MRM2 binding, have a measurable role in translation fidelity
    or peptidyl transfer, given that catalytically dead MRM2 supports assembly?
- question: Is the order of MRM3-dependent Gm1370 and MRM2-dependent Um1369 installation obligatory, and
    which enzyme acts first on the assembling mtLSU?
- question: Is the catalysis-independent assembly-factor role conserved in yeast and fly Mrm2, or is it
    specific to the mammalian mitoribosome?
suggested_experiments:
- hypothesis: Um1369 contributes to mitoribosome function independently of MRM2's assembly role.
  description: Compare translation rate, fidelity and puromycin reactivity of mitoribosomes from MRM2 KO
    cells rescued with wild-type versus K59A/D154A MRM2, using mitoribosome profiling and in organello translation.
  experiment_type: Genetic complementation with functional assays
- hypothesis: The catalysis-independent assembly role of MRM2 is conserved in Drosophila.
  description: Rescue fly Mrm2 mutants with transgenes encoding catalytic-site substitutions equivalent to
    human K59A/D154A, and score development, mitochondrial translation and 16S rRNA 2'-O-methylation.
  experiment_type: In vivo transgenic rescue
