core_functions:
- description: MRM2 is the SAM-dependent 2'-O-ribose methyltransferase that installs Um1369 (U3039) in the
    A-loop of 16S mitochondrial LSU rRNA. The activity is established in human cells by site assignment
    and catalytic-dead mutants, and it is inherited from the FtsJ/RlmE clade (PANTHER PTHR10920:SF18;
    PAINT node PTN000100455).
  molecular_function:
    id: GO:0008650
    label: rRNA (uridine-2'-O-ribose)-methyltransferase activity
  directly_involved_in:
  - id: GO:0000451
    label: rRNA 2'-O-methylation
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:25074936
  - reference_id: PMID:35177605
  - reference_id: PMID:25009282
- description: Independently of its catalytic activity, MRM2 binds late mtLSU assembly intermediates near
    the A-loop and is required for folding of 16S rRNA domains IV and V and for release from the
    MALSU1:L0R8F8:mtACP-bound state. Catalytically dead MRM2 rescues translation in knock-out cells. This
    assembly role is established for human MRM2. The mitochondrial-specific details should not be transferred
    to orthologs without evidence.
  molecular_function:
    id: GO:0140978
    label: mitochondrial large ribosomal subunit binding
