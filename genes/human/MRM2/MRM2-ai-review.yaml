- term:
    id: GO:0005730
    label: nucleolus
  evidence_type: IDA
  original_reference_id: PMID:11827451
  qualifier: located_in
  review:
    summary: Early (2002) immunofluorescence report placing FTSJ2 in the nucleolus.
    action: REMOVE
    reason: Contradicted by all subsequent localisation work. Endogenous MRM2 cofractionates with the
      mitochondrial matrix marker mtSSB1 and is protected from proteinase K (PMID:25009282), it localises
      to foci near mtDNA nucleoids (PMID:24036117), and it is recovered on mitoribosomal LSU intermediates
      by cryo-EM (PMID:34135318). The nucleolar signal is explained by the construct used, an N-terminal
      GFP fusion that masks the N-terminal mitochondrial transit peptide (UniProt TRANSIT 1..18). No
      later study supports a nucleolar pool.
    supported_by:
    - reference_id: PMID:24036117
      supporting_text: In that report, fusion of GFP on the N terminus of MRM2/FTSJ2 resulted in a nucleolar
        location.
    - reference_id: PMID:25009282
      supporting_text: Cell fractionation experiments confirmed the mitochondrial localization of the three
        proteins, as the endogenous proteins cofractionated with the well-characterized mitochondrial matrix
        protein mtSSB1 and were resistant to proteinase K treatment (Figure 2C).
