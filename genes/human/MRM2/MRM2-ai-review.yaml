id: Q9UI43
gene_symbol: MRM2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MRM2 (formerly FTSJ2) is a nuclear-encoded, mitochondrial-matrix S-adenosyl-L-methionine-dependent
  2'-O-ribose methyltransferase of the FtsJ/RlmE family. It installs 2'-O-methyluridine at position 1369
  (Um1369; U3039 in mtDNA numbering) in the A-loop of 16S mitochondrial large-subunit rRNA, a universally
  conserved modification in the peptidyl transferase centre; this modification is interdependent with the
  adjacent MRM3-installed Gm1370. Independently of its catalytic activity, MRM2 is a late-stage assembly
  factor of the mitoribosomal large subunit. It binds mtLSU intermediates after MTERF4-NSUN4 has exposed
  the A-loop, and it is released when GTPBP5 completes folding of the region. In its absence, mtLSU particles
  accumulate as immature intermediates with disordered rRNA domains IV and V and a bound MALSU1:L0R8F8:mtACP
  anti-association module, mitochondrial translation fails and respiration collapses. Catalytically dead
  K59A and D154A variants rescue these defects. MRM2 localises to foci near mtDNA nucleoids. A homozygous
  p.Gly189Arg variant causes a MELAS-like mitochondrial disease (mitochondrial DNA depletion syndrome 17).
