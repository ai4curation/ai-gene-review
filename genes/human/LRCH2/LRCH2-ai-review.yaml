- id: PMID:20805893
  title: 'LRCH proteins: a novel family of cytoskeletal regulators.'
  findings:
  - statement: >-
      The sole Drosophila LRCH protein stabilizes the mitotic cortex, a family-level
      result that cannot be assigned specifically to human LRCH2.
    supporting_text: >-
      Taking advantage of the existence of a single LRCH gene in flies, dLRCH, we
      explored its function in cultured cells, and show that dLRCH act to stabilize
      the cell cortex during cell division.
    reference_section_type: ABSTRACT
  - statement: >-
      The study establishes the shared LRR and CH architecture of four human LRCH
      paralogs, including LRCH2.
    supporting_text: >-
      In human, only four highly-related proteins (hLRCH1-4) simultaneously harbor
      these two motifs.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and full cached article were checked. The functional work is on
      the single fly dLRCH protein, while human experiments shown in this paper concern
      LRCH3 localization. Mitotic cortex, spindle, actin, and Moesin phenotypes must
      not be transferred directly to human LRCH2.
- id: PMID:28028151
  title: LRCH1 interferes with DOCK8-Cdc42-induced T cell migration and ameliorates
    experimental autoimmune encephalomyelitis.
  findings:
