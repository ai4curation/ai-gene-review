- id: PMID:35351988
  title: Novel genes bearing mutations in rare cases of early-onset ataxia with cerebellar
    hypoplasia.
  findings:
  - statement: >-
      A hemizygous LRCH2 p.Lys258Glu variant in one family was proposed as a candidate
      cause of congenital ataxia, cerebellar hypoplasia, and demyelinating polyneuropathy.
    supporting_text: >-
      In Family I, the unique missense mutation (p.Lys258Glu) was found in the LRCH2
      gene inherited in an X-linked manner. p.Lys258Glu occurs in the evolutionarily
      invariant site of the leucine-rich repeat domain of LRCH2.
    reference_section_type: ABSTRACT
  - statement: >-
      Expression analysis placed LRCH2 in Schwann-lineage cells and above its paralogs
      in the developing cerebellar cortex.
    supporting_text: >-
      The LRCH2 gene for Family I patients (in which congenital cerebellar hypoplasia
      was associated with demyelinating polyneuropathy) is expressed in Schwann and
      precursor Schwann cells and predominantly over its paralogous genes in the
      developing cerebellar cortex.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
