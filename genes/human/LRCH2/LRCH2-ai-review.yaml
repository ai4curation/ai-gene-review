knowledge_gaps:
- gap_statement: >-
    It is unknown whether LRCH2 changes the guanyl-nucleotide exchange activity,
    substrate selection, or signaling output of DOCK8 rather than only recruiting
    expressed DOCK8 toward the cell periphery.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    This is the central missing evidence needed to assign a molecular activity and
    distinguish LRCH2 from the inhibitory DOCK8 mechanism of LRCH1.
- gap_statement: >-
    Direct binding of human LRCH2 to actin has not been demonstrated, and the
    contribution of its calponin-homology domain to endogenous localization and
    function is unknown.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Cytochalasin-sensitive association of an expressed domain does not distinguish
    direct actin binding from indirect recruitment to an actin-dependent peripheral
    structure.
- gap_statement: >-
    The native cell types, subcellular sites, and physiological processes that use
    the LRCH2-DOCK8 association have not been established with endogenous proteins.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Endogenous evidence is required before heterologous recruitment can be connected
    to Rho-family GTPase signaling, cytoskeletal organization, migration, or another
    cellular process.
- gap_statement: >-
    The expression, localization, and partner specificity of LRCH2 isoforms 1 and 2
    have not been compared in endogenous human tissues.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Isoform-resolved evidence would show whether the observed DOCK8 recruitment is
    shared and whether the reported isoform-2 TEX11 contact has physiological meaning.
- gap_statement: >-
    The effect of the reported p.Lys258Glu leucine-rich-repeat substitution on LRCH2
    folding, DOCK8 recruitment, cellular behavior, and human disease risk is unknown.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Functional and genetic replication are needed to move from a single-family
    candidate association to a mechanistic gene-disease relationship.
