  label: Homo sapiens
description: >-
  LRCH2 is a poorly characterized cytoplasmic-facing protein built from an
  N-terminal leucine-rich-repeat region and a C-terminal calponin-homology domain.
  In heterologous MDCK and HEK293T expression systems, its leucine-rich repeats
  associate with DOCK8 and recruit DOCK8 toward the cell periphery, while its
  calponin-homology region shows cytochalasin-sensitive peripheral and actin-associated
  localization. These observations connect LRCH2 to spatial organization of a Rho
  guanine-nucleotide exchange factor, but they do not establish direct actin binding,
  regulation of DOCK8 catalytic activity, or a physiological cellular output. LRCH2
  is expressed in Schwann-lineage cells and developing cerebellar cortex, and a
  p.Lys258Glu substitution was reported as a candidate in one family with congenital
  cerebellar hypoplasia and demyelinating polyneuropathy; the molecular effect and
  gene-disease relationship remain unresolved. Two splice isoforms are described,
  without demonstrated endogenous functional specialization.
