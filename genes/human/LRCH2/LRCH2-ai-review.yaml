suggested_experiments:
- hypothesis: >-
    LRCH2 regulates DOCK8 spatially but does not reproduce the DOCK8 catalytic
    inhibition attributed to LRCH1.
  description: >-
    Reconstitute DOCK8 nucleotide exchange with purified Cdc42, full-length LRCH2,
    LRCH1 as a positive comparator, and LRR-deletion variants. In parallel, edit an
    endogenous epitope tag into LRCH2 and DOCK8 in a human cell type that naturally
    expresses both proteins and quantify their localization and interaction before
    and after acute LRCH2 depletion.
  experiment_type: comparative biochemistry and endogenous cell biology
- hypothesis: >-
    The LRCH2 calponin-homology domain binds actin directly and anchors LRCH2-DOCK8 at
    an actin-rich peripheral structure.
  description: >-
    Test purified full-length LRCH2 and its isolated calponin-homology domain in
    F-actin co-sedimentation and quantitative binding assays, then rescue LRCH2-null
    cells with interface mutants and measure endogenous DOCK8 recruitment using
    super-resolution live-cell imaging.
  experiment_type: cytoskeletal biochemistry and imaging
- hypothesis: >-
    LRCH2 isoforms have distinct tissue distributions or interaction profiles.
  description: >-
    Combine long-read RNA sequencing, isoform-specific targeted proteomics, and
    endogenous proximity labeling in human Schwann-lineage and cerebellar cell models,
    followed by isoform-specific rescue to compare localization, DOCK8 association,
    and Rho-GTPase activity.
  experiment_type: isoform-resolved proteomics
- hypothesis: >-
    The p.Lys258Glu substitution impairs the LRR-dependent recruitment of DOCK8.
  description: >-
    Compare wild-type and p.Lys258Glu LRCH2 for folding, stability, DOCK8 interaction,
    peripheral recruitment, and downstream Rho-GTPase activity in isogenic human
    Schwann-cell and cerebellar-lineage models, while pursuing segregation and
    replication in additional affected families.
  experiment_type: variant functional analysis
