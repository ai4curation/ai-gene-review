source_specificity_clarifications:
  junction: UniProt SL-0038 is traced to its explicit PMID:20215400 immunological-synapse location note; the experimental and electronic rows share the same specific refinement.
  complex: The vMIP-II antagonist trap remains positive evidence, with engineered substitutions. The generic protein-containing-complex term is dispensable at gene level because the separately supported signaling receptor complex entails it.
  binding: Positive tail pull-down/MS and endogenous co-IP support contextual actin/myosin associations without claiming a purified binary interface. RAMP3 remains a positive contextual association with no established narrower performed role.
  physiology: The existing MIF paper discusses hematopoietic cell homing. The preserved UniProt DISEASE section establishes WHIM syndrome and mature-myeloid-cell accumulation in bone marrow; this summary does not add a disease-process GO annotation.
