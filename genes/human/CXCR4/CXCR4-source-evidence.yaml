products:
  official_products:
  - id: P61073-1
    legacy_alias: P30991-1
    length: 352
  - id: P61073-2
    legacy_alias: P30991-2
    length: 356
  reconstruction: Official VSP_001890 replaces residues 1–5 (MEGIS) with MSIPLPLLQ. Both resulting sequences match independently fetched official FASTAs. Identity alone does not establish equal activity.
  functional_sources:
  - PMID:10452968
  - PMID:37141381
  assay_boundary: 'The 1999 abstract reports human CXCR4-LO calcium and chemotaxis responses in transfected rat basophil leukemia cells. In the 2023 original, variant 2 is the canonical 352-aa product and variant 1 corresponds to the longer N terminus: these paper labels must not be silently substituted for official isoform numbers. Native-context leaky initiation, forced-initiation constructs, tags and engineered G-alpha-qi readouts limit comparisons. Additional paper variants are not extra official products.'
primary_interpretations:
- sources:
  - PMID:8752281
  - PMID:39093700
  - PMID:20228059
  topic: CXCL12 signaling
  finding: CXCL12 activates CXCR4, and a CXCL12–CXCR4–Gi structure independently supports the signaling mechanism. Both sources were available at abstract/summary level in this review; exact unseen structural construct details are not inferred. The inactive human CC-ligand statement in the 1996 abstract concerns its HIV-inhibition experiment, not a universal test of all CC ligands. Separately recovered original PMID:20228059 Methods, Results and Figure 7 caption measure reduced cellular cAMP after SDF-1alpha and blockade by AMD3100. The CXCR4/GNAI1/ADCY6 GO-CAM supports the same upstream receptor role; neither GO:0007193 nor GO:0038160 is an ancestor of the other in the inspected ontology.
- sources:
  - PMID:25612609
  topic: CC chemokine binding versus agonist activity
  finding: The actual original identifies viral vMIP-II as an antagonist. The D187C receptor/W5C ligand disulfide-trapped structure supports CC-ligand binding, not CC-triggered receptor signaling. GO:0019957 and GO:0016493 make different claims. The native two-product behavior and universal receptor stoichiometry were not established.
- sources:
  - PMID:19665027
  topic: MIF/CD74
  finding: Reciprocal lysate co-IP, endogenous monocyte association and antibody/AMD3100-sensitive AKT responses support a functional MIF receptor complex. An engineered CD74 retention-signal deletion was used in surface experiments. CXCL12 responses differ from CD74-dependent MIF responses; MIF is not a canonical CC chemokine. These experiments measure receptor association and signaling, while the earlier direct MIF-binding study is cited background. The CXCL12 ligand-class refinement does not classify MIF as a CXC chemokine.
- sources:
  - PMID:20228059
  topic: Extracellular ubiquitin
  finding: Cellular binding, competition, receptor knockdown and Gi-associated signaling support extracellular ubiquitin recognition in the tested systems. This is distinct from intracellular ubiquitination of CXCR4; it does not make the receptor a ubiquitin enzyme.
- sources:
  - PMID:10228019
  - PMID:10754293
  - PMID:41027939
  topic: Viral entry
  finding: HIV coreceptor biology is retained. Herpesvirus-induced receptor downregulation is not proof of herpesvirus entry through CXCR4, and CD28 manipulation does not establish a CXCR4 TCR-costimulator activity. The newer original resolves HIV-2 gp120 complexes; HIV-1 high-resolution geometry was modeled. Purified assemblies do not establish a universal native stoichiometry.
- sources:
  - PMID:21540189
  - PMID:19106094
  - PMID:24790097
  topic: Trafficking
  finding: Actual CXCR4 controls and target experiments establish surface, EEA-1-positive early-endosome, Rab7-positive late-endosome and LAMP-1-positive lysosome pools. The GPER-focused paper contains genuine HA-CXCR4 controls. A valid compartment observation does not require a separate receptor activity in that compartment. USP14 observations explicitly described as data not shown do not supply additional inspected localization evidence.
- sources:
  - PMID:10644702
  - PMID:19106094
  - PMID:19116316
  topic: Regulatory partner classes
  finding: Arrestin and USP14 binding are positive. USP14-tail assays use cell lysate; AIP4 purified-protein binding is explicitly described in the original Figure 1 caption. CXCR4 remains the receptor and ubiquitination substrate, not the partner enzyme.
- sources:
  - PMID:12421915
  - PMID:20215400
  - PMID:23926103
  topic: Cytoskeletal contacts
  finding: Human T-cell pull-downs identify actin/MYH9, endogenous co-IP includes myosin light chain, and microscopy places receptor complexes at the leading edge or immune contact. Drebrin is a cytoskeletal regulator. Literal rat drebrin-A construct records remain distinct from endogenous human protein evidence. These assays do not establish CXCR4 motor activity or purified binary binding for every pair.
- sources:
  - PMID:28978524
  topic: RNF113A and correction
  finding: Target binding uses immunoprecipitated CXCR4 and translated RNF113A constructs. The 2019 corrigendum replaces a duplicated Figure 4A beta-actin control and states that conclusions are unchanged; Figure 3 binding is not withdrawn.
  correction_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC6541727/
- sources:
  - PMID:34927784
  topic: ITCH construct scope
  finding: Phosphomimetic CXCR4 tail and catalytically inactive ITCH constructs support the mapped interaction; weak wild-type behavior is kept distinct. The Q96J02-2 product retains its WW/HECT partner-class features despite its deletion. No receptor ligase activity is inferred.
- sources:
  - PMID:39083597
  topic: RAMP3 target evidence
  finding: The assay is a membrane-preparation antibody-capture suspension bead array, not yeast two-hybrid. Original Table S6 Excel rows 75/76 show CXCR4 antibodies HPA051623 and HPA068321 passing for RAMP3; Table S7 Excel row 56 gives Medium epitope and Strong protein evidence. Two schemes pass in each, with fractions 0.4 and 1. Tagged receptor/RAMP constructs and assay-level interaction do not establish native physiology.
  supplement_url: https://www.ebi.ac.uk/europepmc/webservices/rest/PMC11290489/supplementaryFiles
  extraction_note: The XLSX files declare dimensions A1. Complete extraction resets dimensions; the initial truncated extraction is not the target proof.
- sources:
  - PMID:20534485
  - PMID:25016030
  - PMID:12183377
  - PMID:18434527
  topic: Inherited developmental and metabolic contexts
  finding: Actual mouse and rat sources support receptor roles in neuronal positioning, neurogenesis, oligodendrocyte differentiation/remyelination and contextual cold responses. Remyelination after cuprizone does not separately resolve preservation of mature myelin. The adipose knockout study leaves the signaling route to UCP1 unresolved and oxygen-consumption interpretation depends on normalization. These are not direct human isoform assays.
- sources:
  - PMID:15174142
  - PMID:10942389
  topic: Expression response and apoptosis
  finding: The hypoxia abstract reports CXCR4 transcript induction; response terms can include expression changes without intrinsic oxygen sensing. The apoptosis original uses human endothelial cultures exposed to viral envelope and CXCR4-blocking antibody versus IgG. That contextual response is not promoted to a general physiological death function.
