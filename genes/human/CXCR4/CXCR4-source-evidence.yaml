unresolved_evidence:
- source: PMID:16621978
  boundary: This is a review article, not a report of original experiments. Its abstract discusses CCR7; the full discussion and cited CXCR4-specific dendritic-cell evidence remain unverified.
- source: PMID:19703720
  boundary: Accessible abstract separates PTX-sensitive adhesion from chemokine-induced migration; the receptor-specific adhesion assay remains unverified.
- source: PMID:20534485
  boundary: Mature-myelin maintenance versus repair-related remyelination remains an ontology-fit uncertainty despite recovered original experiments.
- source: PMID:20458337
  boundary: The B-cell MHC-II exosome study target entry was not recovered; failed supplement requests do not establish CXCR4 absence or require extracellular receptor activity.
- source: PMID:27693460
  boundary: The cited tumor vasculogenic-mimicry study does not by itself settle the broad blood-vessel-development assignment; exact target process scope remains uncertain.
