suggested_questions:
- question: How do the two official N-terminal CXCR4 products differ in endogenous cell-surface abundance, ligand recognition and signaling when alternative initiation and expression level are controlled?
- question: Does CXCR4 directly maintain mature myelin independently of its established effects on oligodendrocyte differentiation and remyelination?
- question: Which molecular contacts determine the relative contributions of CD74, CXCR4 and other receptors to MIF responses in distinct human cell types?
- question: Under which cellular conditions do CXCR4 complexes with other chemokine receptors or RAMP3 alter ligand selectivity and signaling?
status: DRAFT
suggested_experiments:
- hypothesis: CXCR4 has a maintenance role in mature myelin separable from its role in repair-associated oligodendrocyte differentiation.
  description: Use inducible, lineage-restricted Cxcr4 perturbation after normal myelination and without a demyelinating insult. Compare myelin ultrastructure and long-term stability with matched controls and rescue, separately from OPC differentiation and remyelination readouts.
  experiment_type: Post-developmental conditional perturbation and ultrastructural analysis
- hypothesis: Endogenous CXCR4 is present in purified B-cell extracellular vesicles under the conditions of the original proteomic report.
  description: Combine orthogonal vesicle purification, receptor-specific detection and protease-protection analysis with plasma-membrane contamination controls. Resolve receptor detection and membrane orientation without requiring signaling activity inside the vesicles.
  experiment_type: Extracellular-vesicle localization and topology assay
