id: P61073
gene_symbol: CXCR4
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CXCR4 is a seven-transmembrane chemokine receptor that recognizes CXCL12 and activates heterotrimeric G-protein signaling, principally through Gi. This axis directs cell migration, including hematopoietic cell homing, and contributes to immune-cell positioning and developmental programs. Pathogenic CXCR4 variants cause WHIM syndrome, characterized by peripheral neutropenia despite retention of mature myeloid cells in bone marrow. The receptor signals at the plasma membrane and undergoes regulated internalization and endosomal sorting. Intracellular interactions with arrestins, cytoskeletal regulators and ubiquitin-system proteins control its signaling and trafficking. CXCR4 also participates in MIF signaling with CD74 and serves as a CD4-associated entry coreceptor for susceptible HIV strains. Alternative N-terminal products differ in expression and ligand responses.
