    supporting_text: the initial translation product of IL-1 alpha mRNA can bind to the IL-1 receptor
      without further proteolytic processing
  - reference_id: file:human/IL1A/IL1A-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: After binding to its receptor IL1R1 together with its accessory protein IL1RAP, forms
      the high affinity interleukin-1 receptor complex
  - reference_id: PMID:33482337
    supporting_text: The IL-1α precursor is constitutively present in nearly all cell types in health,
      but is released upon necrotic cell death as a bioactive mediator.
suggested_questions:
- question: Does the nuclear pool of pro-IL-1alpha have a molecular activity of its own, or does nuclear
    residence only control the timing and amount of IL-1alpha release?
- question: Should process annotations inferred from membership of decoy complexes (IL1R2 with IL-1alpha)
    be propagated to the captured ligand, given that the ligand performs none of the inhibition?
suggested_experiments:
- description: Compare IL1R1 binding affinity and signalling potency of precursor, calpain-cleaved and
    nuclear-retention-mutant IL-1alpha released from the same cells after genotoxic stress, to separate
    the intracellular and extracellular contributions to sterile inflammation.
