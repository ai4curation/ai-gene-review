core_functions:
- description: Extracellular agonist cytokine of the type I IL-1 receptor. Precursor and mature IL-1alpha
    bind IL1R1, which recruits IL1RAP to form the signalling receptor complex that triggers MYD88/IRAK-dependent
    NF-kappaB and MAPK activation and inflammatory responses. Acts as an alarmin when released from damaged
    or stressed cells.
