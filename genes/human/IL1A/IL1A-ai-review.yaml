  review:
    summary: Exogenous recombinant IL-1alpha induced M-CSF (CSF1) mRNA and protein release in human vascular
      endothelial and smooth muscle cells.
    action: KEEP_AS_NON_CORE
    reason: Induction of other cytokines (here M-CSF) is a real, downstream transcriptional consequence
      of IL-1 receptor signalling in target cells, and the term is appropriately broad for a cytokine
      that induces many cytokines. It is an output of the core IL1R1 signalling activity rather than the
      core function itself.
