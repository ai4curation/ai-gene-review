- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:26439902
  qualifier: located_in
  review:
    summary: IL-1alpha is secreted after genotoxic stress without loss of cell integrity.
    action: ACCEPT
    reason: 'Extracellular location is where IL-1alpha exerts its cytokine activity on IL1R1. Directly
      shown here. Extracellular region is kept rather than refined to extracellular space (GO:0005615)
      on purpose: the supporting assays (activity in supernatants, release on necrosis, Reactome compartments,
      PAINT) show that IL-1alpha leaves the cell but do not resolve where outside the cell it resides,
      and part of the active pool is cell-surface IL-1alpha rather than free cytokine. This matches how
      other reviewed cytokines here (e.g. CXCL8) are treated.'
    supported_by:
    - &id002
      reference_id: PMID:26439902
      supporting_text: Together, this data shows that IL-1α can localize to DNA damage sites and can be
        secreted without the loss of cellular integrity.
