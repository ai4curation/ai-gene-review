description: 'CDC42BPB, also called MRCK beta, is a CDC42 effector serine/threonine protein kinase that
  forms lamellar actomyosin complexes, phosphorylates MYPT/MLC pathway substrates and is recruited with
  ZO-1 to the leading edge of migrating cells to control cytoskeletal remodeling and motility.'
