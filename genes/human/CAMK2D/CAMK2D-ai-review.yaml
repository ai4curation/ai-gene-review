existing_annotations:
- term:
    id: GO:0001558
    label: regulation of cell growth
  evidence_type: NAS
  original_reference_id: PMID:9060999
  qualifier: involved_in
  review:
    summary: NAS regulation of cell growth, from a paper cloning tumor-cell CaMKII splice variants.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper identifies delta variants by RT-PCR in tumor cells and only states that this supports
      earlier indications of a role in growth control; it contains no growth assay. Delta's documented
      growth-related role is cardiac hypertrophy, captured by the more specific hypertrophy row.
    supported_by:
    - reference_id: PMID:9060999
      supporting_text: >-
        The identification of these new, potential tumor-specific CaMK-II variants supports previous indications
        that CaMK-II plays a role in growth control.
- term:
    id: GO:0002026
    label: regulation of the force of heart contraction
  evidence_type: TAS
  original_reference_id: PMID:23283722
  qualifier: involved_in
  review:
    summary: >-
      TAS regulation of the force of heart contraction, citing CaMKII phosphorylation of titin and reduction
      of passive force.
    action: KEEP_AS_NON_CORE
    reason: >-
      CaMKII-dependent titin phosphorylation lowers cardiomyocyte passive (diastolic) force, studied in
      delta/gamma DKO and deltaC transgenic hearts. A genuine but secondary aspect of delta's cardiac
      role; the systolic Ca2+ handling roles are the core.
    supported_by:
    - reference_id: PMID:23283722
      supporting_text: >-
        CaMKII phosphorylates the titin springs at conserved serines/threonines, thereby lowering F(passive).
- term:
    id: GO:0003254
    label: regulation of membrane depolarization
  evidence_type: IDA
  original_reference_id: PMID:22514276
  qualifier: involved_in
  review:
    summary: >-
      IDA regulation of membrane depolarization; deltaC-CaMKII phosphorylation of Nav1.5 alters sodium
      current gating in HEK293 cells.
    action: KEEP_AS_NON_CORE
    reason: >-
      Phosphorylation at Ser516/Thr594 shifts INa availability and enhances intermediate inactivation,
      a loss-of-function gating change that affects depolarization. A real but peripheral consequence
      of the kinase activity.
    supported_by:
    - reference_id: PMID:22514276
      supporting_text: >-
        CaMKII-dependent phosphorylation of Na(V)1.5 at multiple sites (including Thr-594 and Ser-516)
        appears to be required to evoke loss-of-function changes in gating
