- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20668654
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q13554
  review:
    summary: >-
      Interaction of CAMK2D with another CaMKII subunit (CAMK2A, CAMK2B or CAMK2G) from structural, AP-MS,
      kinase-interactome, OpenCell or cell-map data.
    action: MODIFY
    reason: >-
      The bare protein binding term is uninformative. The partner is another CaMKII catalytic subunit
      and the association reflects mixed holoenzyme assembly, which is captured by the calcium- and calmodulin-dependent
      protein kinase complex rows. Protein serine/threonine kinase binding states what the partner is,
      matching the treatment of paralog interactions in the CAMK2A and CAMK2B reviews. Replacing the generic
      term does not dispute the interaction.
    proposed_replacement_terms:
    - id: GO:0120283
      label: protein serine/threonine kinase binding
    supported_by:
    - reference_id: file:human/CAMK2D/CAMK2D-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
        The different isoforms assemble into homo- or heteromultimeric holoenzymes composed of 12 subunits
        with two hexameric rings stacked one on top of the other
    - reference_id: PMID:14722083
      supporting_text: all four isoforms were dodecamers with similar but highly unusual architecture
