id: Q13557
gene_symbol: CAMK2D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CAMK2D encodes the delta subunit of calcium/calmodulin-dependent protein kinase II (CaMKII), a serine/threonine
  kinase that assembles with other CaMKII subunits into dodecameric holoenzymes. Calcium-bound calmodulin
  relieves autoinhibition and permits Thr287 autophosphorylation, which makes the kinase partly calcium-independent.
  Delta is broadly expressed and is the predominant CaMKII of the heart, where the cytoplasmic deltaC
  splice variant tunes excitation-contraction coupling by phosphorylating calcium-handling and channel
  proteins, including the ryanodine receptor RyR2, phospholamban, the L-type calcium channel and the sodium
  channel Nav1.5, and also phosphorylates titin to lower passive myocardial stiffness. The nuclear deltaB
  variant phosphorylates HDAC4, promoting its nuclear export and MEF2-dependent hypertrophic gene expression.
  Elevated or persistent CaMKII delta activity increases sarcoplasmic reticulum calcium leak, alters action
  potentials and drives maladaptive remodelling in hypertrophy and heart failure. With CaMKII gamma, delta
  is one of the ubiquitous isoforms implicated in interferon-gamma-induced STAT1 Ser727 phosphorylation.
