suggested_questions:
- question: >-
    Is CaMKII delta, gamma or both the kinase that phosphorylates STAT1 Ser727 after interferon-gamma
    stimulation in human cells, given that the original study did not separate the two ubiquitous isoforms?
- question: >-
    Do the gap-junction electrical-coupling and heart-rate-by-conduction annotations transferred to CAMK2D
    have any direct experimental basis, for example CaMKII phosphorylation of connexin 43?
- question: >-
    Does CaMKII delta promote cardiomyocyte apoptosis directly, independent of SR calcium leak and mitochondrial
    calcium overload?
suggested_experiments:
- description: >-
    Deplete CAMK2D and CAMK2G separately and together in human cells and measure IFN-gamma-induced STAT1
    Ser727 phosphorylation and ISG transcription, with isoform-specific rescue.
- description: >-
    In human iPSC-derived cardiomyocytes, compare deltaB and deltaC isoform-specific knockout and rescue
    for RyR2 Ser2814 phosphorylation, Ca2+ spark frequency, HDAC4 nuclear export and hypertrophic gene
    expression.
