  - UniProtKB:Q13557
  - UniProtKB:Q9UQM7
  review:
    summary: >-
      Calmodulin binding by CaMKII delta (IBA, InterPro, and the CaMKIIdelta/Ca2+/CaM crystal structure
      and calorimetry with CALM1/2/3).
    action: KEEP_AS_NON_CORE
    reason: >-
      Ca2+/CaM binding to the regulatory segment is directly demonstrated for delta and is how the kinase
      is activated. It is a regulatory input already encoded in the core term GO:0004683, so it is kept
      as non-core, consistent with the CAMK2A and CAMK2B reviews.
    supported_by:
    - reference_id: PMID:20668654
      supporting_text: >-
        We used analytical ultracentrifugation (AUC) to determine whether the CaMKII/Ca2+/CaM heterodimer
        forms in solution
    - reference_id: file:human/CAMK2D/CAMK2D-uniprot.txt
      record_section: ["CC:ACTIVITY REGULATION"]
      supporting_text: >-
        Activated by Ca(2+)/calmodulin. Binding of calmodulin results in conformational change that relieves
        intrasteric autoinhibition and allows autophosphorylation of Thr-287
