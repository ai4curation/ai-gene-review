core_functions:
- description: CRX binds cis-regulatory DNA in the nucleus and integrates partner-dependent activation,
    including cooperation with NRL, and context-dependent repression to regulate photoreceptor gene expression
    and development. The mapped NRL interaction supports this integrated transcriptional role; the original
    domain experiments used human NRL and bovine CRX.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
