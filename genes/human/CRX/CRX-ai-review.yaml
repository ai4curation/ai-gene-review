id: O43186
gene_symbol: CRX
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CRX is a paired-like homeodomain transcription factor expressed in retinal photoreceptors.
  It recognizes regulatory DNA and works with other transcription factors, including NRL and nuclear receptors,
  to control photoreceptor gene expression. Its activity supports photoreceptor differentiation and maintenance.
  Human retinal organoid and reporter experiments show activation of photoreceptor genes and context-dependent
  repression of other retinal programs. Pathogenic variants can disrupt DNA binding or transcriptional
  regulation and cause inherited retinal degeneration.
