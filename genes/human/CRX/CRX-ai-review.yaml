    supporting_text: 'CRX, which binds to the OTX element to stimulate

      promoter activity'
  - reference_id: PMID:10887186
    supporting_text: NRL can physically interact with CRX
suggested_questions:
- question: Which CRX-bound loci require CRX directly for repression in human photoreceptors, and which
    differences reflect changes in cell identity or partner availability?
- question: Do the supported interaction-screen pairs occur endogenously in human photoreceptors, and
    which tested partner splice products preserve those interactions?
- question: What anatomical morphogenesis experiments underpin the original GO:0009887 clinical-source
    assertion, beyond photoreceptor maintenance and differentiation?
- question: Do the variable human CRX untranslated transcripts alter translation or protein abundance
    without changing the encoded protein?
suggested_experiments:
- description: Combine acute CRX depletion with nascent-transcription measurements and occupancy assays
    in matched human photoreceptors to separate direct transcriptional effects from cell-population changes.
- description: Test selected sequence-verified interaction pairs at endogenous expression in human retinal
    cells, with partner-domain and negative controls, before assigning a native regulatory mechanism.
