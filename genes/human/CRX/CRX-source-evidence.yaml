- row: 0
  source:
    term:
      id: GO:0000785
      label: chromatin
    evidence_type: ISA
    original_reference_id: GO_REF:0000113
    qualifier: located_in
    supporting_entities:
    - tfclass:3.1.3
  review:
    summary: CRX associates with regulatory chromatin.
    action: ACCEPT
    reason: The TFclass source is consistent with human CRX CUT&Tag occupancy in retinal organoids. The assay measures chromatin association;
      individual target reporter tests supply the separate transcriptional interpretation. The classification is not itself an imaging
      experiment.
    additional_reference_ids:
    - PMID:41418782
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: tfclass:3.1.3
        source_status: SUPPORTS_TRANSFER
        comment: Literal TFclass source preserved; human sequence-specific transcriptional assays independently support the assertion.
          The TFclass database itself was not separately reconstructed.
- row: 1
  source:
    term:
      id: GO:0000785
      label: chromatin
    evidence_type: ISS
    original_reference_id: GO_REF:0000024
    qualifier: located_in
    supporting_entities:
    - UniProtKB:Q9XSK0
  review:
    summary: The bovine CRX chromatin association is transferable.
    action: ACCEPT
    reason: The literal donor Q9XSK0 carries experimentally curated chromatin localization from PMID:18854042. Its retinal nuclear-complex
      experiments and the independent human CUT&Tag results support chromatin association, while bovine and mouse assay contexts remain
      distinct.
    additional_reference_ids:
    - PMID:18854042
    - PMID:41418782
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q9XSK0
        source_status: SUPPORTS_TRANSFER
        comment: Authenticated UniProtKB:Q9XSK0 resolves to Q9XSK0; 1 literal current same-term record(s) retained, with their original
          evidence and references. Biological support and source-specific access limits are described in the reason.
- row: 2
  source:
