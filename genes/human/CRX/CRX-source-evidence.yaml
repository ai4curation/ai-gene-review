    evidence_type: TAS
    original_reference_id: PMID:9390563
    qualifier: involved_in
  review:
    summary: CRX transcriptional activity supports eye photoreceptor cell development.
    action: MODIFY
    reason: 'Refine broad animal organ morphogenesis to GO:0042462 eye photoreceptor cell development, a current descendant of both
      GO:0009887 and GO:0046530. The original PMID:9390563 full text remains unavailable; its clinical abstract alone does not establish
      the anatomical mechanism. Independent human PMID:41418782 supplies the decisive evidence: CRX occupies regulatory DNA in retinal
      organoids, activates the RP1L1 promoter and represses PCDH8 in separate HEK293T assays, and its knockout causes loss of photoreceptor
      maturation markers and ectopic PROX1 in photoreceptor cells. CRX therefore performs transcriptional work within cell specialization
      rather than merely being a required substrate. Occupancy and sorted-cell RNA differences do not validate every target, and complete
      morphological maturation or direct causality for every peak is not claimed. Current mouse Nrl, Otx2 and Nr2e3 developmental annotations
      support the same-role convention; their underlying papers are not substituted for human evidence. This holistic refinement preserves
      the original source assertion and its access limit; it is not a reconstruction of the 1997 experiment or an additional NEW annotation.'
    additional_reference_ids:
    - PMID:41418782
    proposed_replacement_terms:
