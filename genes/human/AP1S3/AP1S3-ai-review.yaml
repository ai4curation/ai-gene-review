- id: file:human/AP1S3/AP1S3-bioinformatics/RESULTS.md
  title: >-
    AP1S3 bioinformatics: which sigma subunit do the two AP-1 structure papers describe?
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      This review's own analysis. Fetches the four sigma sequences live from UniProt, asserts their lengths
      before scoring, and resolves 23 published residue positions; 22 match AP1S3's sequence, one does
      not, and the script exits non-zero because of it. It establishes that residue numbering alone cannot
      separate AP1S3 from AP1S1 and that the identification rests on construct length, the explicit construct
      statement in PMID:40752490, and the PDBe SIFTS chain mapping.
- id: file:human/AP1S3/AP1S3-deep-research-affinage.md
  title: Affinage mechanistic annotation for AP1S3 (human)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The affinage record. Trust gates clear per .affinage.log, self_evaluation_pairwise 'win', faith
      100%, and all six citations are real numeric PMIDs about the right protein - no symbol collision.
      Its narrative on TLR3, autophagy/IL-36 and HCV E2 is accurate and it correctly flags that PMID:27411398
      does not address sigma-1C. Its limitation is recall, not precision: it returned none of the three
      structural or redundancy papers (PMID:36261523, PMID:40752490, PMID:18428203) that carry the mechanism.
      Its mechanism_profile GO grounding was not imported; all grounding here is re-derived from UniProt,
      the structures and the GO definitions.
