suggested_questions:
- question: >-
    Is there any cargo whose AP-1-dependent sorting requires sigma-1C specifically, or are the three sigma-1
    paralogues interchangeable at the level of cargo selection with only their abundance differing between
    tissues?
  experts:
  - Francesca Capon
  - Peter Schu
- question: >-
    In cells, which sigma-1 paralogue delivers the AP-1-dependent termination of STING signalling? The
    2.34 A structure used sigma-1C, but the knockdowns and sigma point mutants in the same study used
    sigma-1A.
  experts:
  - Andrea Ablasser
  - James H. Hurley
- question: >-
    Does the AAGAB pseudoGTPase domain compete with cargo for the sigma subunit in cells, so that free
    AAGAB sets how much cargo-competent AP-1 exists, or is the chaperone released before the tetramer
    ever sees a sorting motif?
  experts:
  - Qian Yin
  - Jingshi Shen
- question: >-
    Do the pustular psoriasis variants Phe4Cys and Arg33Trp reduce the amount of assembled AP-1 without
    changing which cargoes it selects, as their positions outside the cargo surface predict?
  experts:
  - Francesca Capon
  - Satveer K. Mahil
suggested_experiments:
- hypothesis: >-
    The three sigma-1 paralogues are interchangeable for cargo selection, and the epidermal specificity
    of AP1S3 loss reflects relative abundance rather than specificity.
  description: >-
    Generate keratinocytes null for each sigma-1 gene singly and in combination, then compare the AP-1
    cargo repertoire by proximity labelling of the gamma subunit followed by quantitative mass spectrometry.
    Complement each null line with each of the three paralogues in turn and score both the cargo repertoire
    and the TLR3 endosomal-delivery and starvation-induced LC3-II phenotypes. Interchangeability predicts
    full cross-rescue at matched protein levels.
  experiment_type: >-
    proximity labelling proteomics with paralogue swap complementation
- hypothesis: >-
    AP1S3 binds cargo dileucine motifs directly, through the pockets identified in PDB 7R4H, and the pustular
    psoriasis variants do not affect that binding.
  description: >-
    Measure the affinity of a recombinant gamma/sigma-1C hemicomplex for synthetic peptides carrying a
    [DE]XXXL[LI] motif, phosphorylated and unphosphorylated, by isothermal titration calorimetry or bio-layer
    interferometry. Compare wild-type sigma-1C with V88D, I103S and K60A/R61A - the substitutions previously
    made only in sigma-1A - and with the disease variants F4C and R33W. The prediction is that the pocket
    mutants lose peptide binding while F4C and R33W do not, separating cargo selectivity from complex
    assembly.
  experiment_type: >-
    quantitative peptide binding with structure-guided mutagenesis
- hypothesis: >-
    AAGAB binding and cargo binding are mutually exclusive on sigma-1C, so AAGAB gates the cargo-competent
    pool of AP-1.
  description: >-
    Use the AAGAB psGD:AP1S3 interface mutants already characterised (AAGAB 2YR and DFEAV5R) to titrate
    chaperone occupancy in cells, and measure in parallel the amount of assembled AP-1, the surface transferrin
    receptor, and dileucine-cargo capture. A competition model predicts that partial loss of AAGAB binding
    lowers assembled AP-1 without lowering per-complex cargo affinity, while an occlusion model predicts
    free cargo-competent sigma rises transiently.
  experiment_type: >-
    structure-guided interface mutagenesis with cell-surface cargo assay
- hypothesis: >-
    The autophagy defect of AP1S3-null cells is a consequence of mis-sorted AP-1 cargo rather than of
    a direct role in autophagosome biogenesis.
  description: >-
    In AP1S3-null HEK293 and keratinocytes, track ATG9A itinerary by live imaging and surface-biotinylation
    and ask whether restoring ATG9A delivery to the autophagosome-initiation compartment - for example
    by an ATG9A construct whose sorting is made AP-1-independent - rescues starvation-induced LC3-II without
    restoring AP1S3. Rescue would place AP1S3 upstream in membrane supply rather than in the autophagy
    machinery itself.
  experiment_type: >-
    cargo-itinerary imaging with sorting-independent rescue construct
