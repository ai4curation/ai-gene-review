core_functions:
- description: >-
    Sigma-1C is the cargo-reading subunit of one of the three ubiquitous AP-1 variants. As part of the
    assembled tetramer on trans-Golgi and endosomal membranes it supplies the two adjacent hydrophobic
    pockets that receive the bulky residues of an acidic dileucine [DE]XXXL[LI] sorting signal, together
    with a basic patch that reads a phosphoserine just downstream of the motif, so that cargo selection
    can be tuned by phosphorylation. Bridging that captured cargo to the clathrin lattice is a property
    of the whole complex rather than of this subunit, which is why the clathrin-cargo adaptor activity
    is recorded as a contribution; what sigma-1C itself brings is the sorting-signal binding surface and
    a structural role in holding the tetramer together through its interface with the medium adaptin.
    Structural molecule activity is recorded as the subunit-level function because it is the only one
    GO can currently express for this protein: the activity it actually performs alone, binding the dileucine
    sorting signal, has no GO term and is proposed here as a new one.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  contributes_to_molecular_function:
    id: GO:0035615
    label: clathrin-cargo adaptor activity
  in_complex:
    id: GO:0030121
    label: AP-1 adaptor complex
  directly_involved_in:
  - id: GO:0016192
    label: vesicle-mediated transport
  - id: GO:0006886
    label: intracellular protein transport
  - id: GO:0036010
    label: protein localization to endosome
  locations:
  - id: GO:0032588
    label: trans-Golgi network membrane
  - id: GO:0000139
    label: Golgi membrane
  - id: GO:0030659
    label: cytoplasmic vesicle membrane
  - id: GO:0005905
    label: clathrin-coated pit
  - id: GO:0005769
    label: early endosome
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:human/AP1S3/AP1S3-uniprot.txt
    supporting_text: (sigma-type subunit AP1S1 or AP1S2 or AP1S3).
  - reference_id: PMID:36261523
    supporting_text: >-
      STING L364 and I365 of the EXXXLI sorting motif engage L65, F67, H85, V88 and V98 of the σ subunit
      through hydrophobic interactions
  - reference_id: PMID:36261523
    supporting_text: >-
      the phospho-moiety on S366 makes hydrogen bonds with a conserved basic patch formed by K60 and R61
      of the σ subunit
  - reference_id: PMID:40752490
    supporting_text: >-
      The dileucine motif binds to the σ subunit in an extended conformation, with the two leucines fitting
      in two adjacent hydrophobic pockets.
  - reference_id: PMID:24791904
    supporting_text: >-
      Given that AP-1 subunit σ1C is one of the core subunits thought to stabilize AP-1 heterotetramers
  - reference_id: PMID:24791904
    supporting_text: >-
      Arg33 is critically located at the AP-1 σ1C/μ1A interface
  - reference_id: PMID:24791904
    supporting_text: >-
      AP-1 is involved in the transport of cargoes between the trans -Golgi network and the endosomes,
      a process that requires the formation of specialized clathrin-coated vesicles.
  - reference_id: PMID:24791904
    supporting_text: >-
      We found that TLR-3 trafficking was disrupted in both knockdown cell lines, where the ratio between
      endosomal and newly synthesized receptor was markedly reduced.
- description: >-
    Through the same complex, sigma-1C supports autophagosome formation. Autophagosome biogenesis depends
    on AP-1-mediated membrane traffic, and cells lacking AP1S3 make fewer autophagosomes on starvation,
    a defect reversed by wild-type but not by the assembly-defective p.Arg33Trp protein. The contribution
    is the same cargo-sorting activity applied to a different itinerary rather than a second, autophagy-specific
    function, and it is seen in HEK293 as well as in keratinocytes, so it is not a cell-type-restricted
    role.
  contributes_to_molecular_function:
