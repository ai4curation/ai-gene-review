- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IC
  original_reference_id: PMID:24791904
  qualifier: enables
  review:
    summary: >-
      Sigma-1C is a structural subunit of the AP-1 heterotetramer: it holds an interface with the medium
      adaptin, and the two pustular-psoriasis variants act by destabilising the protein or that interface
      rather than by changing what the complex selects.
    action: NEW
    reason: >-
      Inferred by curator from this gene product's own complex-membership annotation (GO:0030121 AP-1
      adaptor complex), which is itself now established by two structures containing AP1S3. The inference
      rests on three independent lines. First, position: in the assembled core AP1S3 is the small chain
      packed against the medium adaptin, and the disease variant Arg33Trp sits precisely at that sigma-1C/mu-1A
      interface. Second, stability: the Phe4Cys variant, which lies in the hydrophobic core, reduces the
      amount of sigma-1C protein recovered after transfection into two cell lines, and the free subunit
      is so unstable that it misfolds unless the AAGAB chaperone holds it. Third, generality: sigma subunits
      have been shown to be required for AP-complex stability, with AP-2 used as the model because its
      sigma is encoded by a single gene. This is the only subunit-level molecular function GO can currently
      express for this protein; the activity one would rather state - binding the dileucine sorting signal
      - has no GO term, which is recorded here as a knowledge gap and a proposed new term.
    supported_by:
    - reference_id: PMID:24791904
      supporting_text: >-
        Given that AP-1 subunit σ1C is one of the core subunits thought to stabilize AP-1 heterotetramers
    - reference_id: PMID:24791904
      supporting_text: >-
        Arg33 is critically located at the AP-1 σ1C/μ1A interface
    - reference_id: PMID:24791904
      supporting_text: >-
        we observed decreased levels of the p.Phe4Cys protein upon transfection of mutant and wild-type
        (WT) constructs into human embryonic kidney 293 (HEK293) and HaCaT cells
    - reference_id: PMID:18428203
      supporting_text: >-
        we demonstrated that sigma subunits are essential for the stability of human AP complexes
    - reference_id: PMID:40752490
      supporting_text: Yet this small amount of σ subunit was mostly misfolded
    - reference_id: PMID:40752490
      supporting_text: >-
        To confirm that AAGAB aids the solubility and folding of σ subunits
- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IMP
  original_reference_id: PMID:27388993
  qualifier: involved_in
  review:
    summary: >-
      AP1S3 loss reduces starvation-induced autophagosome formation in two independent cell backgrounds,
      and the defect is rescued by wild-type but not by the pustular-psoriasis p.Arg33Trp protein.
    action: NEW
    reason: >-
      Missing from GOA, and well evidenced in both perturbation directions. Loss: stable shRNA knockdown
      in HaCaT keratinocytes significantly reduced LC3-II, and an independent CRISPR-Cas9 knockout in
      HEK293 reproduced the decrease in starvation-induced LC3-II, with fewer LC3-GFP-positive autophagosomes
      by microscopy. Gain: re-expression of wild-type AP1S3 restored the phenotype while the p.Arg33Trp
      disease allele did not, which both confirms direction and ties the process to the protein rather
      than to an off-target effect of the guide or hairpin. The mechanism is complex-level and indirect
      - the authors' premise is that autophagosome formation requires a functional AP-1 complex - so this
      is an involved_in process claim about AP-1-dependent membrane traffic, not a claim that AP1S3 is
      core autophagy machinery. Note that the knockout background was HEK293, not a keratinocyte, so the
      autophagy requirement is not keratinocyte-restricted; only the downstream inflammatory consequence
      (p62 accumulation, NF-kB activation, IL-36-alpha overexpression) was characterised in keratinocytes.
    supported_by:
    - reference_id: PMID:27388993
      supporting_text: >-
        We found that LC3-II levels were significantly reduced in AP1S3 knockdown versus control cell
        lines
    - reference_id: PMID:27388993
      supporting_text: >-
        AP1S3 silencing causes a very significant decrease in starvation-induced LC3-II accumulation
    - reference_id: PMID:27388993
      supporting_text: >-
        we used fluorescence microscopy to visualize the expression of LC3-green fluorescent protein (GFP)
        constructs transfected into the HEK293 AP1S3 knockout cell line
    - reference_id: PMID:27388993
      supporting_text: >-
        This phenotype was rescued by the overexpression of wild-type but not mutant (p.Arg33Trp) AP1S3
        constructs
    - reference_id: PMID:27388993
      supporting_text: >-
        Because autophagosome formation requires a functional AP-1 complex
    - reference_id: PMID:27388993
      supporting_text: >-
        We found that AP1S3 knockout disrupts keratinocyte autophagy, causing abnormal accumulation of
        p62, an adaptor protein mediating NF-κB activation.
