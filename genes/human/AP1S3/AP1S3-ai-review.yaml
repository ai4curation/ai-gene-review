  review:
    summary: >-
      The one phylogenetic annotation on this gene: vesicle-mediated transport, inherited from the PTHR11753
      ancestral node PTN000204281, which was seeded by AP-1, AP-2 and AP-3 sigma subunits across fungi,
      worm, fly, rodent and human.
    action: ACCEPT
    reason: >-
      The node placement is sound and AP1S3 is inside the clade that inherited the function. Ten of the
      eleven gene-level donors carry experimental evidence, but they carry it in different descendant
      branches - Golgi-to-vacuole transport in the two yeast AP-3/AP-1 sigmas and Candida APS3, endosome-to-Golgi
      transport in mouse Ap1s1 and pombe aps1, clathrin-dependent endocytosis in worm aps-2 and human
      AP2S1, synaptic-vesicle and postsynaptic-receptor internalisation in mouse Ap1s2 and rat Ap2s1.
      That divergence is exactly why the parent vesicle-mediated transport is the correct least common
      ancestor here: any more specific child would name one compartment and be wrong for the rest of the
      clade, so this is not a granularity failure. AP1S3 retains the whole sigma fold and, as the structures
      show, a functional cargo-binding surface, and nothing in the family slice records a loss (no IRD
      or IKR row exists for PTHR11753). AP1S3 is not among its own donors, so this is not a self-referential
      IBA - it is a genuine outward transfer to a gene with no experimental annotation of its own for
      the term.
    supported_by:
