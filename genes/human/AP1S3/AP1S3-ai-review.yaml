- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6PD74
  review:
    summary: >-
      A proteome-scale yeast two-hybrid screen reported AP1S3 binding AAGAB (Q6PD74). The partner is now
      known at 1.68 A: AAGAB is the assembly chaperone for AP-1 and AP-2, and its pseudoGTPase domain
      caps AP1S3's cargo pocket.
    action: MODIFY
    reason: >-
      Bare protein binding says nothing about what AP1S3 does. The partner resolves to AAGAB, the only
      curated binary interactor in this entry's UniProt INTERACTION block, and the interaction now has
      structural and functional follow-up: a 1.68 A co-crystal of AAGAB's pseudoGTPase domain with full-length
      AP1S3 (PDB 9DDT), a 994 A2 interface, pull-downs showing the pseudoGTPase domain is necessary and
      sufficient, and the demonstration that AAGAB is what allows a sigma subunit to fold and stay soluble
      at all. GO has no 'assembly chaperone binding' term; GO:0051087 protein-folding chaperone binding
      is the only chaperone-binding molecular function, and AAGAB demonstrably performs a folding function
      on this client, so it is the informative replacement.
    proposed_replacement_terms:
    - id: GO:0051087
      label: protein-folding chaperone binding
    additional_reference_ids:
    - PMID:40752490
    supported_by:
    - reference_id: file:human/AP1S3/AP1S3-uniprot.txt
      supporting_text: >-
        Q96PC3; Q6PD74: AAGAB; NbExp=6; IntAct=EBI-3923129, EBI-719906;
    - reference_id: PMID:40752490
      supporting_text: >-
        AAGAB is the assembly chaperone for AP1 and AP2 adaptor complexes that are key to clathrin-mediated
        membrane trafficking.
    - reference_id: PMID:40752490
      supporting_text: >-
        we determined the crystal structure of wild type AAGAB psGD in complex with AP1σ3 at the resolution
        of 1.68 Å
    - reference_id: PMID:40752490
      supporting_text: >-
