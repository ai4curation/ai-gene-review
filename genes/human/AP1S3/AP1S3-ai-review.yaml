proposed_new_terms:
- proposed_name: dileucine sorting signal binding
  proposed_definition: >-
    Binding to an acidic dileucine sorting signal, a [DE]XXXL[LI] peptide motif in the cytosolic tail
    of a transmembrane cargo protein, which directs that protein into clathrin-coated vesicles formed
    by heterotetrameric adaptor protein complexes.
  justification: >-
    GO can express the complex-level activity (GO:0035615 clathrin-cargo adaptor activity) and the tyrosine-motif
    counterpart read by the medium adaptin (GO:0089710 endocytic targeting sequence binding, whose definition
    requires an essential tyrosine), but it has no term for the dileucine motif read by the small adaptin.
    That leaves the one activity a sigma subunit demonstrably performs on its own unexpressible, so sigma
    subunits across AP-1, AP-2 and AP-4 carry either nothing or a bare protein binding row. The gap is
    now sharply defined by structure: the motif's two bulky residues occupy adjacent pockets on the sigma
    subunit, and in AP1S3 those pockets are formed by Leu65, Phe67, His85, Val88 and Val98. A sibling
    of GO:0089710 under protein binding would fit the existing pattern exactly.
  proposed_parent:
    id: GO:0005515
    label: protein binding
  supported_by:
  - reference_id: PMID:40752490
    supporting_text: >-
      One major sorting motif that links cargo proteins to AP1 or AP2 complexes is the dileucine-based
      motif
  - reference_id: PMID:40752490
    supporting_text: >-
      The dileucine motif binds to the σ subunit in an extended conformation, with the two leucines fitting
      in two adjacent hydrophobic pockets.
  - reference_id: PMID:36261523
    supporting_text: >-
      STING L364 and I365 of the EXXXLI sorting motif engage L65, F67, H85, V88 and V98 of the σ subunit
      through hydrophobic interactions
  - reference_id: PMID:40752490
    supporting_text: >-
      The interfacial residues in AP1σ3 are highly conserved in AP1, AP2, and AP4 σ subunits
knowledge_gaps:
- gap_statement: >-
    No GO term expresses the one molecular activity the AP-complex sigma subunit performs by itself -
    binding the [DE]XXXL[LI] dileucine sorting signal of a cargo tail - so the best available annotation
    for AP1S3 is either a complex-level term it only contributes to or a bare protein binding row.
  boundary: >-
    The activity itself is not in doubt and is resolved at 2.34 A on AP1S3 itself: the motif's two bulky
    residues sit in adjacent hydrophobic pockets formed by Leu65, Phe67, His85, Val88 and Val98, with
    Lys60/Arg61 reading an adjacent phosphoserine. GO already has the tyrosine-motif counterpart (GO:0089710)
    and the complex-level clathrin-cargo adaptor activity (GO:0035615). Only the dileucine term is missing.
  gap_kind:
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    The gap is family-wide, not AP1S3-specific: every sigma subunit of AP-1, AP-2 and AP-4 has the same
    site and the same missing term, which is part of why these proteins accumulate uninformative protein
    binding annotations.
  resolution: >-
    Create the proposed term as a sibling of GO:0089710 under protein binding, and separately revise the
    definition of GO:0035615, which currently says the activity is 'responsible for the formation of endocytic
    vesicles' even though GO applies the term to AP-1 subunits acting at the trans-Golgi network.
  provenance:
  - reference_id: PMID:40752490
    supporting_text: >-
      The dileucine motif binds to the σ subunit in an extended conformation, with the two leucines fitting
      in two adjacent hydrophobic pockets.
  - reference_id: PMID:36261523
    supporting_text: >-
      STING L364 and I365 of the EXXXLI sorting motif engage L65, F67, H85, V88 and V98 of the σ subunit
      through hydrophobic interactions
  - reference_id: PMID:40752490
    supporting_text: >-
      The interfacial residues in AP1σ3 are highly conserved in AP1, AP2, and AP4 σ subunits
- gap_statement: >-
    No cargo is known that the sigma-1C form of AP-1 selects and the sigma-1A or sigma-1B forms do not,
    so it is not established that AP1S3 has any biological process of its own as opposed to inheriting
    the complex's.
  boundary: >-
    It is established that the three sigma-1 paralogues are largely redundant in peripheral tissues, that
    they are not wholly interchangeable in neurons (sigma-1A and sigma-1B regulate early endosome maturation
    differently), and that AP1S3 is the one whose loss produces an epidermal phenotype. What is missing
    is the cargo that explains the difference.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This is the question that decides whether AP1S3 deserves process annotations distinct from the AP-1
    complex's, and whether the pustular psoriasis phenotype is a dosage effect or a specificity effect.
  resolution: >-
    A comparative proteomic screen of AP-1 cargo in cells expressing only one sigma-1 paralogue at a time
    would either name the selective cargo or establish that the difference is quantitative.
  provenance:
  - reference_id: PMID:18428203
    supporting_text: functional redundancy among AP-1 sigma subunits
  - reference_id: PMID:24791904
    supporting_text: >-
      Given the variety of cargoes that are trafficked by the AP-1 complex, alleles associated with pustular
      psoriasis are likely to affect the localization of additional molecules other than TLR-3.
  - reference_id: PMID:27411398
    supporting_text: >-
      AP-1/σ1A and AP-1/σ1B adaptor-proteins differentially regulate neuronal early endosome maturation
- gap_statement: >-
    Why loss of a broadly expressed, functionally redundant subunit produces a phenotype confined to the
    skin is unresolved; the proposed explanation - relative abundance in keratinocytes plus an IL-36 amplification
    loop - has not been tested by restoring the other paralogues.
  boundary: >-
    The downstream circuit is well characterised: loss of AP1S3 impairs autophagy, p62 accumulates, NF-kappa-B
    is activated, IL-36-alpha rises, and IL-36 blockade normalises the cytokine profile in patient keratinocytes.
    Expression data show the transcript is abundant in keratinocytes and scarce in neutrophils and CD4+
    T cells, while UniProt describes the gene overall as widely expressed.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: NARROWING
  significance: >-
    Tissue-restricted phenotypes from ubiquitously expressed trafficking genes are a recurring puzzle
    in this family - AP1S1 causes MEDNIK and AP1S2 an X-linked intellectual disability syndrome - and
    AP1S3 is the most tractable case because the effector cytokine is druggable.
  resolution: >-
    Quantify the three sigma-1 proteins (not transcripts) across keratinocytes, neurons and enterocytes,
    and test whether ectopic sigma-1A or sigma-1B rescues the autophagy and IL-36 phenotypes of AP1S3-null
    keratinocytes.
  provenance:
  - reference_id: PMID:27388993
    supporting_text: >-
      Although transcript levels were low in neutrophils and virtually undetectable in CD4+ T lymphocytes,
      we observed abundant gene expression in keratinocytes
  - reference_id: PMID:24791904
    supporting_text: >-
      fully characterizing the impact of AP1S3 mutations on immune responses will require additional
  - reference_id: PMID:24791904
    supporting_text: >-
      Thus, the pleiotropic effects of AP-1 deficiency have hindered the identification of specific cellular
      processes that are controlled by this complex.
  - reference_id: file:human/AP1S3/AP1S3-uniprot.txt
    supporting_text: 'TISSUE SPECIFICITY: Widely expressed.'
- gap_statement: >-
    Which sigma-1 paralogue serves the AP-1-dependent termination of STING signalling is not established,
    because the structural and the loss-of-function halves of that work used different paralogues.
  boundary: >-
    The recognition chemistry is settled: activated STING's C-terminal tail presents an EXXXLI motif plus
    a TBK1-phosphorylated serine, and the structure resolving that interaction contains AP1S3 as the sigma
    chain. What is not settled is whether AP1S3 is the paralogue that does this in cells - the knockdowns
    and the sigma point mutants in the same study were AP1S1.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    If AP1S3 does serve this pathway, the loss-of-interferon phenotype of AP1S3 knockdown would have two
    independent routes - failure to deliver TLR3 and failure to terminate STING - which bears directly
    on how the disease variants act.
  resolution: >-
    Single-paralogue knockouts assayed for STING degradation kinetics, with rescue by each sigma-1 in
    turn. No process annotation for STING or type I interferon is proposed for AP1S3 until that is done.
  provenance:
  - reference_id: PMID:36261523
    supporting_text: >-
      AP1G1(R15E), AP1S1(I103S) and AP1S1(V88D) were obtained by single-amino-acid mutagenesis.
  - reference_id: PMID:36261523
    supporting_text: >-
      STING robustly bound the γ and σ1 subunits of AP-1 after activation
  - reference_id: file:human/AP1S3/AP1S3-bioinformatics/RESULTS.md
    supporting_text: >-
      the numbering does not by itself discriminate AP1S3 from AP1S1
- gap_statement: >-
    Nothing is known about isoform-specific function, even though the MANE-Select transcript encodes isoform
    4 rather than the UniProt canonical isoform 1, and no GO annotation on this gene is isoform-qualified.
  boundary: >-
    Four isoforms are annotated; two of them, isoforms 2 and 3, carry premature stop codons and are expected
    to be degraded by nonsense-mediated decay. Isoforms 1 and 4 differ only in their last eleven residues,
    a region that in the AP-1 core makes minimal contact with the other subunits and is unmodelled in
    PDB 9DDT. Both published structures used isoform 1.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    If isoform 4 is the dominant transcript, every functional statement about this protein rests on a
    sequence that may not be the one cells mostly make, even though the divergent segment is peripheral
    to the fold.
  resolution: >-
    Isoform-resolved proteomics or long-read transcript quantification in keratinocytes, followed by a
    side-by-side complementation test of isoforms 1 and 4 in AP1S3-null cells.
  provenance:
