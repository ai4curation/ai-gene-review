id: P27348
gene_symbol: YWHAQ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'YWHAQ encodes 14-3-3 protein theta/tau, a conserved dimeric adaptor that recognizes phosphorylated
  client proteins. Its core activity is cytosolic phosphoprotein binding as part of 14-3-3 dimers, with
  supported human client contexts including CDKN1B and ChREBP/WBSCR14 nuclear export, RGS7 binding, INAVA
  signaling, and shared Reactome BAD, TSC2 and CDC25C complexes.'
