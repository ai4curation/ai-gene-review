core_functions:
- description: Initiation factor of mitochondrial translation that binds the 28S subunit, keeps it free
    of the 39S subunit and of initiator tRNA until an mRNA is engaged, and so regulates start-codon selection.
    It is dispensable for initiation on most leaderless mRNAs but required for ATP6 initiation on the
    bicistronic ATP8/ATP6 transcript and for coordinated synthesis of OXPHOS subunits in vivo.
  molecular_function:
    id: GO:0003743
    label: translation initiation factor activity
  directly_involved_in:
  - id: GO:0070124
    label: mitochondrial translational initiation
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:12095986
    supporting_text: Purified IF3(mt) promotes initiation complex formation on mitochondrial 55 S ribosomes
  - reference_id: PMID:19239245
    supporting_text: Mutation of residues 247 and 248 in the C-terminal extension abolished the ability
      of IF3(mt) to reduce the level of binding of fMet-tRNA to the ribosome in the absence of mRNA.
  - reference_id: PMID:36629253
    supporting_text: mtIF3 activity is not required for translation of leaderless mitochondrial transcripts
      but is essential for translation of ATP6 in the case of the bicistronic ATP8/ATP6 transcript
  - reference_id: PMID:31903419
    supporting_text: Ribosome profiling shows that MTIF3 is required for recognition and regulation of
      translation initiation of mitochondrial mRNAs and for coordinated assembly of OXPHOS complexes in
      vivo.
- description: High-affinity binding of the 28S small mitoribosomal subunit, through which its C-terminal
    domain exerts anti-association activity and dissociates 55S mitoribosomes into free subunits.
  molecular_function:
    id: GO:0180065
    label: mitochondrial small ribosomal subunit binding
  directly_involved_in:
  - id: GO:0032790
    label: ribosome disassembly
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:18056078
    supporting_text: The K(d) for the binding of IF3(mt) to 28S subunits is approximately 30 nM.
  - reference_id: PMID:30677741
    supporting_text: The location of the C-terminal domain (CTD) clarifies its anti-association activity
  - reference_id: PMID:12095986
    supporting_text: IF3(mt) shifts the equilibrium between the 55 S mitochondrial ribosome and its subunits
      toward subunit dissociation.
