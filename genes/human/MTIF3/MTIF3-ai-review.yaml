suggested_questions:
- question: Why is mtIF3 dispensable for most leaderless mt-mRNAs yet essential for ATP6 initiation, and
    does it act at ATP6 by start-codon recognition or by recycling post-termination ribosomes for re-initiation?
- question: Mouse Mtif3 loss increases but uncoordinates mitochondrial protein synthesis, whereas human
    knockout cells show a selective ATP6 defect; do these differences reflect tissue context or species?
suggested_experiments:
- description: Mitoribosome profiling in human MTIF3-knockout cells rescued with C-terminal-domain anti-association
    mutants (residues 170-175) or C-terminal-extension mutants (247-248), to separate the subunit-dissociation
    and initiator-tRNA-proofreading activities and map which of them is needed for ATP6 initiation.
