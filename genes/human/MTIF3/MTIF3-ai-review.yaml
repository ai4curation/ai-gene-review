id: Q9H2K0
gene_symbol: MTIF3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MTIF3 encodes mitochondrial translation initiation factor 3 (mtIF3, IF3mt), a nuclear-encoded
  member of the IF-3 family imported into the mitochondrial matrix via an N-terminal presequence. Its
  conserved N- and C-terminal domains are flanked by mitochondria-specific extensions. mtIF3 binds the
  small (28S) mitoribosomal subunit with high affinity and acts as an anti-association factor, dissociating
  55S mitoribosomes into 28S and 39S subunits. It also prevents initiator fMet-tRNA from binding to the
  28S subunit in the absence of mRNA. Most leaderless mitochondrial mRNAs can be initiated on intact 55S
  monosomes without mtIF3, and MTIF3-knockout human cells retain mitochondrial translation. The factor
  is required for translation of ATP6 from the bicistronic ATP8/ATP6 transcript and for coordinated, correctly
  regulated initiation in vivo. Heart- and skeletal-muscle-specific loss of Mtif3 in mice causes uncoordinated
  mitochondrial protein synthesis, loss of specific respiratory complexes and cardiomyopathy.
