id: Q02750
gene_symbol: MAP2K1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MAP2K1 encodes MEK1, a dual-specificity protein kinase of the STE family that forms the middle tier of the RAS-RAF-MEK-ERK
  (MAPK/ERK) signalling cascade. MEK1 is activated when RAF kinases (BRAF, RAF1, also MOS in oocytes) phosphorylate Ser218
  and Ser222 in its activation loop, often within KSR-scaffolded complexes at membranes. Activated MEK1 then docks onto ERK1
  (MAPK3) and ERK2 (MAPK1) and phosphorylates both the threonine and tyrosine of their TEY activation motif; ERK1/2 are its
  only well-established physiological substrates. MEK1 is predominantly cytosolic, where it also anchors inactive ERK, but
  it shuttles through the nucleus using an N-terminal nuclear export signal (exporting ERK and PPARG) and is found on endosomes
  (LAMTOR3/MP1 scaffold), the Golgi, the ER (VRK2-KSR1 complexes) and mitotic centrosomes. Beyond catalysis, MEK1 binding
  to KSR1/2 allosterically promotes KSR-BRAF dimerization and BRAF activation. ERK phosphorylates MEK1-specific Thr292 as
  negative feedback. MEK1 is uniquely required for G2 Golgi fragmentation and timely mitotic entry. Germline activating variants
  cause cardiofaciocutaneous syndrome 3, mosaic variants cause melorheostosis, and somatic variants occur in cancers; MEK1
  is the target of allosteric inhibitors such as trametinib, cobimetinib, binimetinib and selumetinib.
