core_functions:
- description: 'MEK1 is the ERK-specific MAP2K: after activation by RAF-family MAP3Ks (phosphorylation of Ser218/Ser222) it
    docks onto ERK1/ERK2 and phosphorylates both Thr and Tyr of their TEY activation motif, relaying RAS-RAF signals to ERK
    in the cytosol.'
  molecular_function:
    id: GO:0004708
    label: MAP kinase kinase activity
  directly_involved_in:
  - id: GO:0070371
    label: ERK1 and ERK2 cascade
  locations:
  - id: GO:0005829
    label: cytosol
  substrates:
  - id: UniProtKB:P27361
    label: MAPK3
  - id: UniProtKB:P28482
    label: MAPK1
  supported_by:
  - *id002
  - *id001
  - *id005
  - *id004
  - reference_id: PMID:28166211
    supporting_text: we reconstituted a biochemical system comprising purified ERK2, variants of MEK1, and ATP
- description: 'Non-catalytic, scaffold-like role: MEK1 binds KSR1/KSR2 and BRAF face-to-face, releasing KSR autoinhibition
    and driving KSR-BRAF side-to-side dimerization and BRAF activation independently of MEK1 catalytic activity (feed-forward
    priming of the RAF tier).'
  molecular_function:
    id: GO:0005078
    label: MAP kinase scaffold activity
  directly_involved_in:
  - id: GO:0070371
    label: ERK1 and ERK2 cascade
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id006
  - *id018
  - *id017
suggested_questions:
- question: Was PMID:22572157 (a platelet-alloantibody biosensor paper) intended to be PMID:22752157 (VRK2 anchors KSR1-MEK1
    to ER) for the MGI MAP2K1 'endoplasmic reticulum' and 'protein binding' IDA rows (and the analogous CALR/CANX rows)?
- question: Should the non-catalytic, KSR-mediated allosteric activation of BRAF by MEK1 be represented as MAP kinase scaffold
    activity, as protein serine/threonine kinase activator activity, or both, and should it be extended to MEK2 via PAINT?
- question: Which MEK1-specific (non-MEK2-redundant) functions exist in vivo beyond Thr292-mediated feedback and G2 Golgi
    fragmentation, given that MEK1 loss is embryonic lethal in mice while MEK2 loss is not?
- question: Is there direct, non-review evidence for a functional mitochondrial or focal-adhesion pool of human MEK1?
suggested_experiments:
- description: Knock-in of the KSR/BRAF-binding-deficient MEK1 F311S or a kinase-dead MEK1 into MEK1/MEK2 double-null cells
    to separate catalytic ERK activation from allosteric BRAF activation in physiological signalling.
- description: Endogenous-tag proximity labelling of MEK1 versus MEK2 across the cell cycle to test MEK1-specific partners
    at the Golgi, centrosome and midbody.
