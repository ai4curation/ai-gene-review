- term:
    id: GO:0035662
    label: Toll-like receptor 4 binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q3UU41
  review:
    summary: SCIMP binds the TIR domain of TLR4 after LPS stimulation; shown for the mouse ortholog by
      co-immunoprecipitation and binding-site mutagenesis (PMID:28098138).
    action: NEW
    reason: The TLR4 interaction is the basis of SCIMP's core adaptor role and is asserted in the core
      function, but human SCIMP has no GOA row for it. There is no direct human binding experiment (the
      human THP-1 work in PMID:35337798 shows SCIMP-SYK, not SCIMP-TLR4, co-immunoprecipitation), so the
      annotation is proposed by sequence similarity to mouse Scimp, consistent with the UniProt human
      entry (By similarity) and with the conserved human TLR4 Y674 phosphorylation site (PMID:37058370).
    supported_by:
    - reference_id: PMID:28098138
      supporting_text: SCIMP is a non-TIR-containing adaptor, binding directly to the TLR4-TIR domain
        in response to lipopolysaccharide.
    - reference_id: file:human/SCIMP/SCIMP-uniprot.txt
      supporting_text: Interacts with TLR4; this interaction occurs upon lipopolysaccharide activation
        of TLR4 and is enhanced by phosphorylation of Tyr-107 by LYN (By similarity).
