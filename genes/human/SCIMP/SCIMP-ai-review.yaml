suggested_questions:
- question: SCIMP is required for selective TLR-induced IL-6/IL-12p40 but not TNF; which downstream branch
    (ERK/c-FOS via TLR4 Y672, or another) explains this selectivity, and is it conserved in human macrophages?
- question: Is the MHC-II reverse-signalling role seen in the K46 B cell line physiologically relevant,
    given that primary Scimp-/- B cells showed no ERK defect?
- question: Does the exosome-secreted SCIMP N-terminal peptide acting as an FPR1/2 neutrophil chemoattractant
    (PMID:38263143) represent a genuine extracellular function warranting GO annotation, given that SCIMP
    is otherwise a transmembrane adaptor?
suggested_experiments:
- hypothesis: Human SCIMP scaffolds LYN/SYK/ERK to TLR4 and selectively drives IL-6/IL-12p40 in primary
    human macrophages as it does in mouse.
  description: CRISPR-knockout SCIMP in human monocyte-derived macrophages and measure LPS-induced TLR4
    Y674 phosphorylation, ERK recruitment and the cytokine profile, with rescue by wild-type or Y96F/Y120F
    SCIMP.
