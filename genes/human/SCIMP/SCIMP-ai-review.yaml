    label: ruffle
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q3UU41
  - ensembl:ENSMUSP00000104174
  - UniProtKB-SubCell:SL-0300
  review:
    summary: SCIMP concentrates in actin-rich dorsal ruffles of macrophages, the membrane domains where
      TLR4 is enriched and LPS signalling is initiated; Erk2 and Syk are recruited to SCIMP there (PMID:28098138,
      PMID:34496234, PMID:35337798).
    action: KEEP_AS_NON_CORE
    reason: Well supported in mouse macrophages by immunofluorescence and immunogold EM, and consistent
      with SCIMP's role in TLR4 signalling from ruffles. Ruffles are one of several plasma membrane sub-domains
      SCIMP occupies; the core location is the plasma membrane (lipid-raft/tetraspanin domains), so this
      is retained as non-core. Human annotation is transferred from the mouse ortholog Q3UU41.
    supported_by:
    - &id001
      reference_id: PMID:28098138
      supporting_text: SCIMP staining was apparent on intracellular punctate membranes, but was particularly
        prominent on the macrophage plasma membrane, where it was further concentrated in cell surface
        projections, notably the filopodia and ruffles of some cells.
    - &id002
      reference_id: PMID:34496234
      supporting_text: SCIMP guides the spatial and temporal recruitment of Erk2 to membrane ruffles and
        macropinosomes for pro-inflammatory TLR4 signaling
