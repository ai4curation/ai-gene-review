  - ensembl:ENSMUSP00000104174
  review:
    summary: Scimp-deficient bone-marrow-derived dendritic cells show reduced late-phase (beyond 24 h)
      cytokine production after Dectin-1 stimulation with zymosan (PMID:27288407).
    action: KEEP_AS_NON_CORE
    reason: The knockout phenotype is real but restricted to sustained late-phase responses downstream
      of Dectin-1; early responses were normal. The best-established cytokine function of SCIMP is the
      TLR-driven IL-6/IL-12p40 output in macrophages, captured by the specific IL-6 and IL-12 production
      terms.
    supported_by:
    - &id005
      reference_id: PMID:27288407
      supporting_text: Our analysis of SCIMP-deficient dendritic cells revealed that SCIMP specifically
        contributes to sustaining long-term MAP kinase signaling and cytokine production downstream of
        Dectin-1
