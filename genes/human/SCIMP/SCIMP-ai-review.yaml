    to tetraspanin-enriched microdomains and the immunological synapse, constitutively bound to LYN, and
    after receptor (MHC-II, Dectin-1) engagement recruits SLP65/SLP76-GRB2 (positive signalling) and CSK
    (negative feedback), supporting ERK activation.'
