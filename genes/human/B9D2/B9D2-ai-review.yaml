    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review:
    summary: Nucleus, IEA from UniProt subcellular location (By similarity).
    action: KEEP_AS_NON_CORE
    reason: The UniProt nucleus statement is by similarity only, though HPA also reports a nucleolar signal
      for B9D2. No nuclear function is known; the established functional site is the transition zone/basal
      body. Retained as non-core pending further evidence.
