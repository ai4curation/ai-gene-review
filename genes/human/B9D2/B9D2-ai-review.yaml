- id: PMID:41165761
  title: Ciliopathy-related B9 protein complex regulates ciliary axonemal microtubule posttranslational
    modifications and initiation of ciliogenesis.
  findings:
  - statement: The B9 complex anchors TMEM67 at the TZ membrane.
    supporting_text: We also found that the B9 complex interacts with and anchors TMEM67 to the TZ membrane,
      thereby stabilizing the MKS module and maintaining the integrity of the TZ diffusion barrier.
  - statement: B9 proteins act at the mother centriole to initiate ciliogenesis.
    supporting_text: During ciliogenesis, B9 proteins localize to the mother centriole, facilitate the
      docking of membrane vesicles to the distal appendages, and promote the removal of CP110 from the
      mother centriole, thus initiating cilia assembly.
  - statement: JBTS B9D2 variants impair axonemal MT modifications.
    supporting_text: We found that Joubert syndrome-associated B9D2 variants primarily affected axonemal
      microtubule modifications without disrupting ciliogenesis, whereas the Meckel syndrome-associated
      B9D2 variant disrupted both ciliogenesis and axonemal microtubule modifications.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text (J Clin Invest 2026). B9D2 knockout, B9-TMEM67 module, zebrafish and JBTS
      cohort.
