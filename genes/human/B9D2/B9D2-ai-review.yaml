  review:
    summary: Cilium assembly (IBA). B9D2-knockout RPE1 cells have moderately reduced ciliogenesis efficiency
      and shorter cilia. Before ciliogenesis, B9 proteins at the mother centriole promote vesicle docking
      and CP110 removal. Mouse B9d2 (Stumpy) mutants compromise ciliogenesis, and a B9D2 missense allele
      causes Meckel syndrome. B9D2 contributes to, but is not essential for, cilium formation. Accepted.
    action: ACCEPT
    reason: '[PMID:32726168 "Phenotypic analyses of MKS1-knockout (KO) and B9D2-KO cells show that the
      B9D proteins are involved in, although not essential for, normal cilia biogenesis."] [PMID:41165761
      "During ciliogenesis, B9 proteins localize to the mother centriole, facilitate the docking of membrane
      vesicles to the distal appendages, and promote the removal of CP110 from the mother centriole, thus
      initiating cilia assembly."] [PMID:21763481 "Mouse mutations in either Mks1 or B9d2 compromise ciliogenesis
      and result in phenotypes similar to those of MKS."] [PMID:21763481 "We identified a homozygous c.301A>C
      (p.Ser101Arg) B9D2 mutation that segregates with MKS, affects an evolutionarily conserved residue,
      and is absent from controls."]'
    supported_by:
    - reference_id: PMID:32726168
      supporting_text: Phenotypic analyses of MKS1-knockout (KO) and B9D2-KO cells show that the B9D proteins
        are involved in, although not essential for, normal cilia biogenesis.
    - reference_id: PMID:41165761
      supporting_text: During ciliogenesis, B9 proteins localize to the mother centriole, facilitate the
        docking of membrane vesicles to the distal appendages, and promote the removal of CP110 from the
        mother centriole, thus initiating cilia assembly.
    - reference_id: PMID:21763481
      supporting_text: Mouse mutations in either Mks1 or B9d2 compromise ciliogenesis and result in phenotypes
        similar to those of MKS.
    - reference_id: PMID:21763481
      supporting_text: We identified a homozygous c.301A>C (p.Ser101Arg) B9D2 mutation that segregates
        with MKS, affects an evolutionarily conserved residue, and is absent from controls.
