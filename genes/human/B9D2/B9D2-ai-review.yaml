- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-141409
  qualifier: located_in
  review:
    summary: Cytosol, TAS from Reactome (cilium-assembly reactions and, curiously, several kinetochore/mitotic
      reactions).
    action: KEEP_AS_NON_CORE
    reason: B9D2 is a small soluble B9-domain protein and a cytosolic pool before incorporation at the
      transition zone is plausible. Many of these Reactome rows come from kinetochore/mitosis reactions
      in which B9D2 is listed as a component; a kinetochore role for B9D2 is not supported by the ciliary
      literature and these reactions should not be read as evidence of mitotic function. Cytosol is retained
      only as a non-core location.
    supported_by:
    - reference_id: PMID:32726168
      supporting_text: demonstrate their interdependent localization to the TZ
