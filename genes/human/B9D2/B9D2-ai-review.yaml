id: Q9BPU9
gene_symbol: B9D2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: B9D2 (B9 domain-containing protein 2; MKSR2/MKS10) is a small soluble protein with a C2-like
  B9 domain. It forms the B9 complex with MKS1 and B9D1 (arranged MKS1-B9D2-B9D1), part of the MKS module
  at the ciliary transition zone. The B9 complex anchors the transmembrane protein TMEM67, and the module
  acts as a diffusion barrier that keeps the ciliary membrane composition distinct from the plasma membrane;
  for example, B9D2-knockout cells lose GPR161 from the ciliary membrane. The B9-TMEM67 module also sustains
  post-translational modification of axonemal microtubules. Earlier, at the mother centriole, B9 proteins
  promote vesicle docking and CP110 removal to initiate ciliogenesis. B9D2 is not essential for ciliogenesis,
  but its loss reduces cilium formation and length. Biallelic B9D2 variants cause Meckel syndrome (MKS10)
  and Joubert syndrome (JBTS34).
