id: Q9BPU9
gene_symbol: B9D2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: B9D2 (MKSR2) is a small soluble B9-domain (C2-like) protein of the MKS (tectonic-like) module
  of the primary cilium transition zone. It is the central subunit of a linear MKS1-B9D2-B9D1 complex,
  binding MKS1 and B9D1 directly, and the three B9 proteins depend on one another for transition-zone
  localization. B9D2 localizes to the basal body/transition zone, supports efficient ciliogenesis, and
  is required for formation of the transition-zone diffusion barrier that maintains ciliary membrane protein
  composition. Zebrafish B9d2 also interacts with IFT components and supports ciliary delivery of inversin
  and opsin. Mutations in B9D2 cause Meckel syndrome (MKS10) and Joubert syndrome (JBTS34).
