core_functions:
- description: Central bridging subunit of the MKS1-B9D2-B9D1 subcomplex of the MKS module at the ciliary
    transition zone; required for interdependent TZ localization of the B9 proteins, efficient ciliogenesis,
    and the ciliary membrane diffusion barrier. No defined molecular activity beyond complex assembly.
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  - id: GO:1904491
    label: protein localization to ciliary transition zone
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  - id: GO:0036064
    label: ciliary basal body
  in_complex:
    id: GO:0036038
    label: MKS complex
  supported_by:
  - reference_id: PMID:32726168
    supporting_text: we concluded that the B9D protein complex is composed of the linear interactions
      of MKS1–B9D2–B9D1
  - reference_id: PMID:32726168
    supporting_text: demonstrate their interdependent localization to the TZ
  - reference_id: PMID:32726168
    supporting_text: formation of the B9D protein complex is crucial for creating a diffusion barrier
      for ciliary membrane proteins
  - reference_id: PMID:32726168
    supporting_text: Both the MKS1-KO and the B9D2-KO cell lines were moderately compromised with respect
      to ciliogenesis efficiency
  - reference_id: file:human/B9D2/B9D2-deep-research-falcon.md
    supporting_text: In human-cell interaction assays, B9D2 binds both MKS1 and B9D1
suggested_questions:
- question: What is the basis of B9D2 inclusion in Reactome kinetochore reactions, and is there any experimental
    evidence for a mitotic/kinetochore role?
- question: Is the reported gamma-tubulin interaction of mouse B9d2 reproducible for human B9D2, and does
    it contribute to basal body function?
suggested_experiments:
- description: Structure determination (cryo-EM or crystallography) of the MKS1-B9D2-B9D1 complex to define
    how B9D2 bridges MKS1 and B9D1 and whether the complex presents a membrane-binding surface; test interface
    mutants in B9D2-KO RPE1 cells for TZ localization and ciliary membrane barrier function.
  experiment_type: structural biology and genetic rescue
