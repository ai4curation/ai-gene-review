- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:32726168
  qualifier: enables
  review:
    summary: Protein-macromolecule adaptor activity (NEW, IDA). The B9 proteins assemble as MKS1-B9D2-B9D1,
      so B9D2 is the central subunit that brings MKS1 and B9D1 together, and the three localize to the
      TZ interdependently. The complex in turn binds and anchors TMEM67 at the TZ membrane, stabilizing
      the MKS module. This fits GO's definition of an adaptor that brings macromolecules into contact
      so they function together. Affinage proposed the parent, GO:0060090; the more specific protein-macromolecule
      child is used. MKS1 and B9D1, the end members of the chain, carry only protein binding in GOA. The
      adaptor role is specific to B9D2's bridging position.
