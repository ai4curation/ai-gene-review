- term:
    id: GO:0005813
    label: centrosome
  evidence_type: IDA
  original_reference_id: PMID:19208769
  qualifier: located_in
  review:
    summary: Centrosome (IDA). Before ciliogenesis, B9 proteins localize to the mother centriole of the
      centrosome. There they help dock membrane vesicles to the distal appendages and promote removal
      of CP110, which initiates cilium assembly. This is a functional pre-ciliary role, distinct from
      the later transition-zone role. Accepted.
    action: ACCEPT
    reason: '[PMID:41165761 "During ciliogenesis, B9 proteins localize to the mother centriole, facilitate
      the docking of membrane vesicles to the distal appendages, and promote the removal of CP110 from
      the mother centriole, thus initiating cilia assembly."] [PMID:19208769 "This localization is evolutionarily
      conserved, because the human orthologues also localize to basal bodies, as well as cilia."]'
    supported_by:
    - reference_id: PMID:41165761
      supporting_text: During ciliogenesis, B9 proteins localize to the mother centriole, facilitate the
        docking of membrane vesicles to the distal appendages, and promote the removal of CP110 from the
        mother centriole, thus initiating cilia assembly.
    - reference_id: PMID:19208769
      supporting_text: This localization is evolutionarily conserved, because the human orthologues also
        localize to basal bodies, as well as cilia.
