knowledge_gaps:
- gap_statement: How the soluble B9 complex contributes to the transition-zone diffusion barrier at the
    molecular level is unknown. It may bind membrane lipids through its C2-like B9 domains or scaffold
    the transmembrane MKS-module proteins.
  boundary: 'Established: B9D2 bridges MKS1 and B9D1 and localizes interdependently with them at the transition
    zone (PMID:32726168). The B9 complex binds and anchors TMEM67 at the TZ membrane (PMID:41165761).
    B9D2 is needed for ciliary membrane composition (GPR161 retention). Not established: direct lipid
    or membrane binding by the B9 (C2-like) domains, and the structural basis of the barrier.'
