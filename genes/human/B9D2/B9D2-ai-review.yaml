  review:
    summary: Generic protein binding (IPI, PMID:21602787) with IFT70B.
    action: REMOVE
    reason: Zhao & Malicki (2011) reported that B9d2 binds IFT particle components and contributes to
      ciliary localization of inversin; the human IFT70B interaction supports a role in ciliary cargo
      delivery, but the bare 'protein binding' term carries no functional information and no more specific
      MF term is supported. Removal does not mean the interaction is false.
