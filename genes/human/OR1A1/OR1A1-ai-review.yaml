taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: OR1A1 is a class A seven-transmembrane olfactory receptor of the plasma membrane, expressed
  in olfactory sensory neurons where odorant receptors are concentrated in the membrane of the sensory
  cilia. It is a broadly tuned odorant receptor activated by citronellol, citronellal and other terpenoids,
  carvone enantiomers, dihydrojasmone, certain nitromusks and, most potently, the food odorant 3-methyl-2,4-nonanedione.
  Agonist binding activates the G(olf)/GNAL heterotrimer, stimulating adenylate cyclase and cAMP production
  to depolarize the neuron and initiate odor perception.
