suggested_questions:
- question: Does OR1A1 require RTP1/RTP2 chaperones for surface trafficking in native olfactory neurons,
    and is it expressed and functional at the cell surface in non-olfactory tissues?
suggested_experiments:
- description: Immunolocalize endogenous OR1A1 in human olfactory epithelium biopsies to confirm ciliary
    membrane enrichment, and quantify surface versus ER-retained receptor in HEK293 cells with and without
    RTP1S co-expression.
