- id: PMID:19491311
  title: An integrative genomics approach identifies Hypoxia Inducible Factor-1 (HIF-1)-target genes that
    form the core response to hypoxia.
  findings:
  - statement: ANKRD37 is a validated HIF-1 target gene.
    supporting_text: experimentally validated ANKRD37 as a novel HIF-1 target.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; integrative genomics study validating ANKRD37 as a HIF-1 target.
- id: PMID:21723927
  title: Mouse Fem1b interacts with and induces ubiquitin-mediated degradation of Ankrd37.
  findings:
  - statement: Ankrd37 moves from spermatid cytoplasm to sperm nuclei.
    supporting_text: In mouse testes, Ankrd37 protein was initially present in the cytoplasm of elongating
      spermatids, and finally restricted to the nuclei of spermatozoa during spermatogenesis.
  - statement: Fem1b ubiquitinates Ankrd37 and lowers its level.
    supporting_text: the protein level of Ankrd37 was decreased in a Fem1b dose-dependent manner as shown
      by the transfection experiments, and Ankrd37 was ubiquitinated in the presence of Fem1b.
  - statement: Ankrd37 helps carry Fem1b into the nucleus.
    supporting_text: Ankrd37 facilitated the transport of Fem1b protein from cytoplasm to nuclei in co-transfected
      CHO cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; mouse. An earlier version of this work (PMID:19171189) was withdrawn;
      this 2011 paper is the published study.
  full_text_unavailable: true
- id: PMID:32679233
  title: HIF-1a regulates hypoxia-induced autophagy via translocation of ANKRD37 in colon cancer.
  findings:
  - statement: HIF-1a raises ANKRD37 to regulate hypoxia-induced autophagy.
    supporting_text: hypoxia-induced HIF-1a regulates autophagy activity by increasing ANKRD37 level.
  - statement: Nuclear ANKRD37 matters for hypoxia-induced autophagy.
    supporting_text: intranuclear ANKRD37 played an important role in the regulation of hypoxia-induced
      autophagy.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; single colon cancer cell line (RKO). No mechanism; no GO term drawn.
  full_text_unavailable: true
- id: PMID:35218282
  title: ANKRD37 inhibits trophoblast migration and invasion by regulating the NF-κB pathway in preeclampsia.
  findings:
  - statement: ANKRD37 restrains trophoblast migration and invasion.
    supporting_text: ANKRD37 knockdown enhanced trophoblast migration and invasion, promoted extravillous
      explant outgrowth, and regulated the expression of key invasion proteins, whereas ANKRD37 overexpression
      exerted the opposite effects.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; trophoblast cell lines and explants, via NF-kB readouts. No GO term drawn.
  full_text_unavailable: true
