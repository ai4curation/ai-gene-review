description: ANKRD37 (ankyrin repeat domain-containing 37) is a small protein of 158 residues with four
  ankyrin repeats and a putative nuclear localization signal, distributed between cytoplasm and nucleus.
  It is a direct HIF-1 target gene induced by hypoxia. In mouse testis it moves from the cytoplasm of
  elongating spermatids to the nuclei of spermatozoa, and it is a substrate of the FEM1B ubiquitin ligase,
  which targets it for degradation. In cancer cell lines, raising nuclear ANKRD37 has been linked to hypoxia-induced
  autophagy, and in trophoblasts it restrains migration and invasion; its molecular activity is unknown.
