core_functions: []
knowledge_gaps:
- gap_statement: 'ANKRD37''s molecular activity is unknown: it is a hypoxia-induced HIF-1 target that
    shuttles between cytoplasm and nucleus and is degraded via FEM1B, but what it binds or does to produce
    its reported effects is not established.'
  boundary: Locations, HIF-1 induction and FEM1B-mediated degradation are established. The functional
    reports (autophagy in a colon cancer line, trophoblast invasion) are knockdown or overexpression phenotypes
    without a molecular mechanism. The only interaction data on the human protein are two HuRI hits.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: ANKRD37 is a validated HIF-1 target, so its function bears on the cellular response to
    low oxygen.
  resolution: Identify ANKRD37 partners under hypoxia (for example by proximity labelling), test whether
    FIH hydroxylates its ankyrin repeats, and test loss of function in a hypoxia model.
  provenance:
  - reference_id: PMID:19491311
    supporting_text: experimentally validated ANKRD37 as a novel HIF-1 target.
  - reference_id: PMID:21723927
    supporting_text: the protein level of Ankrd37 was decreased in a Fem1b dose-dependent manner as shown
      by the transfection experiments, and Ankrd37 was ubiquitinated in the presence of Fem1b.
  - reference_id: PMID:32679233
    supporting_text: hypoxia-induced HIF-1a regulates autophagy activity by increasing ANKRD37 level.
  - reference_id: file:human/ANKRD37/ANKRD37-uniprot.txt
    supporting_text: 'CC       Q7Z713; Q9NWT6: HIF1AN; NbExp=7; IntAct=EBI-12373689, EBI-745632;'
proposed_new_terms: []
suggested_questions:
- question: Is ANKRD37 a substrate of the asparaginyl hydroxylase FIH (HIF1AN), which it was found to
    bind in HuRI and which hydroxylates many ankyrin-repeat proteins?
- question: Does ANKRD37 carry FEM1B into the nucleus in human cells, as reported for the mouse proteins,
    and what is the consequence?
suggested_experiments:
- description: Map ANKRD37 partners by proximity labelling under normoxia and hypoxia, and test FIH-dependent
    hydroxylation of its ankyrin repeats by mass spectrometry.
