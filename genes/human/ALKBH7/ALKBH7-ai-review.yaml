id: Q9BT30
gene_symbol: ALKBH7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALKBH7 is a mitochondrial matrix Fe(II)- and 2-oxoglutarate-dependent dioxygenase of the
  AlkB family. It demethylates N2,N2-dimethylguanosine and N1-methyladenosine at mitochondrial tRNA sites
  (Ile and Leu1) within nascent polycistronic mitochondrial transcripts, which controls how those transcripts
  are processed; loss of ALKBH7 lowers mitochondrial tRNA levels, translation and respiratory activity.
  Its crystal structure shows the conserved iron-binding fold but no nucleotide-recognition lid. ALKBH7
  is also required for programmed necrosis after severe alkylating or oxidative DNA damage, triggering
  collapse of the mitochondrial membrane potential, and mice lacking it become obese with impaired short-chain
  fatty acid use.
