- id: PMID:23666923
  title: Human ALKBH7 is required for alkylation and oxidation-induced programmed necrosis.
  findings:
  - statement: ALKBH7 triggers mitochondrial collapse in programmed necrosis.
    supporting_text: plays a pivotal role in DNA-damaging agent-induced programmed necrosis by triggering
      the collapse of mitochondrial membrane potential and large-scale loss of mitochondrial function
      that lead to energy depletion and cellular demise.
  - statement: ALKBH7 depletion blocks necrosis, not apoptosis.
    supporting_text: Depletion of ALKBH7 suppresses necrotic cell death induced by numerous alkylating
      and oxidizing agents while having no effect on apoptotic cell death.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
- id: PMID:23572141
  title: Deletion of mouse Alkbh7 leads to obesity.
  findings:
  - statement: Mouse Alkbh7 is in the mitochondrial matrix; knockout mice are obese.
    supporting_text: We show that the Alkbh7 protein is located in the mitochondrial matrix and that an
      Alkbh7 deletion dramatically increases body weight and body fat.
  - statement: Alkbh7 facilitates short-chain fatty acid use.
    supporting_text: Our data indicate that Alkbh7, directly or indirectly, facilitates the utilization
      of short-chain fatty acids
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Mouse; the source of the lipid-metabolism ISS/IEA rows.
