core_functions:
- description: Catalyzes manganese-dependent hydrolysis of L-arginine to ornithine and urea in the 
    cytosol. This reaction supplies the terminal urea-cycle step and directly breaks down 
    L-arginine. Each subunit of the homotrimer binds the binuclear manganese cofactor required for 
    catalysis.
