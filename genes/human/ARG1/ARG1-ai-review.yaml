suggested_questions:
- question: Which human cellular contexts use ARG1-dependent arginine depletion for immune 
    regulation, and which proposed compartment-specific mechanisms have direct experimental support?
- question: Which ARG1-specific peptides and controls support the sperm-nuclear detection in 
    PMID:21630459, and can an independent localization assay establish that pool?
suggested_experiments:
- hypothesis: Argininemia severity is determined by residual arginase activity, which depends on how
    a given missense variant perturbs the Mn-binding active site or the R308 trimerization 
    interface.
  description: Structure-guided kinetic characterization of clinically observed missense variants 
    (e.g. those affecting the Mn-binding residues or the R308 trimerization interface) to correlate 
    residual arginase activity with argininemia phenotype severity.
- hypothesis: The immunosuppressive effect of neutrophil ARG1 is entirely due to enzymatic depletion
    of extracellular L-arginine.
  description: Quantitative measurement of local arginine depletion and downstream T-cell CD3-zeta 
    levels using ARG1-deficient versus wild-type human neutrophils to dissect the enzymatic basis of
    the immunosuppressive effect.
