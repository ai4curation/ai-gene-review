id: P05089
gene_symbol: ARG1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Arginase-1 is a cytosolic, manganese-dependent ureohydrolase that converts L-arginine and water to L-ornithine
  and urea. This homotrimeric enzyme contains a binuclear manganese cluster in each subunit and catalyzes
  the terminal step of the hepatic urea cycle, regenerating ornithine for nitrogen disposal. In human
  granulocytes it is stored in granules and can be released extracellularly, where arginine depletion
  suppresses T-cell proliferation and cytokine production. Granulocyte ARG1 also contributes to fungicidal
  activity; arginine depletion within the phagolysosome has been proposed as its antimicrobial mechanism.
  Loss-of-function variants cause arginase deficiency with hyperargininemia and progressive neurological
  disease.
