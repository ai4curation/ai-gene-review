- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: TAS
  original_reference_id: PMID:2268343
  qualifier: enables
  review:
    summary: Electron transfer restates the redox chemistry of the specific catalytic activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'GO:0009055 is defined as ''the directed movement of electrons from one molecular entity to another,
      typically mediated by electron carriers or acceptors''. GLDC is not an electron carrier: its oxidative
      decarboxylation of glycine reduces the lipoyl arm of GCSH as part of the single catalytic reaction already
      captured by GO:0004375 (EC 1.4.4.2). The cited PMID:2268343 abstract reports a genomic deletion in a
      nonketotic hyperglycinemia patient and makes no electron-transfer claim. The term is not false of the
      chemistry but is an over-annotation of a separate carrier function.'
    supported_by:
    - reference_id: file:human/GLDC/GLDC-uniprot.txt
      supporting_text: The P protein (GLDC) binds the alpha-amino group of glycine through its pyridoxal phosphate
        cofactor; CO(2) is released and the remaining methylamine moiety is then transferred to the lipoamide
        cofactor of the H protein (GCSH).
    - reference_id: PMID:2268343
      supporting_text: the patient has the glycine decarboxylase gene deleted at a 5' region.
