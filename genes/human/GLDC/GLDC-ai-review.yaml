id: P23378
gene_symbol: GLDC
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GLDC is the pyridoxal 5-phosphate-dependent P protein of the mitochondrial glycine cleavage
  system. It decarboxylates glycine and transfers the remaining aminomethyl group to lipoylated H-protein
  (GCSH). Together with aminomethyltransferase and dihydrolipoamide dehydrogenase, this reaction
  supports glycine degradation and one-carbon metabolism. The enzyme acts in the mitochondrial matrix.
  Loss of GLDC activity causes nonketotic hyperglycinemia, also called glycine encephalopathy.
