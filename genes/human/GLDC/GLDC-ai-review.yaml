      records as activity regulation. No cellular or organismal response mediated by GLDC has been shown,
      so transferring a response-to-chemical process from an enzyme-kinetic observation over-annotates the
      gene.
    supported_by:
    - reference_id: file:human/GLDC/GLDC-uniprot.txt
      supporting_text: 'ACTIVITY REGULATION: Stimulated by lipoic acid. Inhibited in presence of methylamine
