suggested_questions:
- question: >-
    How much of endogenous human carnitine synthesis is limited by cytosolic BBOX1
    expression versus upstream trimethyllysine import and the inefficient SHMT1/SHMT2
    aldolase step?
suggested_experiments:
- description: >-
    Measure deuterated trimethyllysine flux through TMLHE, SHMT1/SHMT2, ALDH9A1,
    and BBOX1 in human liver and kidney cell models after perturbing SLC25A45 and SHMT genes.
