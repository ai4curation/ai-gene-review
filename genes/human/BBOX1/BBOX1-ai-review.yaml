id: O75936
gene_symbol: BBOX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  BBOX1 is a cytosolic Fe(II)/2-oxoglutarate-dependent gamma-butyrobetaine
  dioxygenase that catalyzes the terminal step of endogenous L-carnitine
  biosynthesis, converting gamma-butyrobetaine to L-carnitine with succinate
  and carbon dioxide as coproducts. It is a dimeric 2-oxoglutarate oxygenase
  with a structural zinc site in its N-terminal domain and is the BBOX-specific
  human paralog of mitochondrial TMLHE in PANTHER family PTHR10696.
