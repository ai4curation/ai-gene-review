proposed_new_terms:
- proposed_name: ABC-type steroid sulfate transporter activity
  proposed_definition: Enables the transfer of a steroid sulfate conjugate (such as
    dehydroepiandrosterone 3-sulfate or estrone 3-sulfate) from one side of a membrane to the
    other, coupled to the hydrolysis of ATP.
  justification: ABCC11/MRP8 is a high-affinity, ATP-dependent apical efflux pump for steroid
    sulfates, with dehydroepiandrosterone 3-sulfate (DHEAS, Km ~21 µM) its highest-affinity
    characterized endogenous substrate, but GO currently has no molecular-function term for
    ABC-type steroid sulfate transport; the fitting molecular-function and biological-process
    terms are obsolete. When GO creates the term, move its id into molecular_function.
  proposed_parent:
    id: GO:0140359
    label: ABC-type transporter activity
  supported_by:
  - reference_id: PMID:16359813
    supporting_text: an ATP-dependent efflux pump for steroid sulfates, including dehydroepiandrosterone
      3-sulfate
suggested_questions:
- question: What is the quantitative physiological contribution of ABCC11 to apocrine
    secretion of odorant precursors and to cerumen (earwax) composition, relative
    to other apical transporters in these glands?
- question: Which endogenous substrate(s) are the primary physiological cargo of ABCC11
    in axonal membranes, and does ABCC11-mediated DHEAS release modulate GABAA-receptor
    signaling in vivo?
- question: Because ABCC11 has no rodent ortholog, which model system best captures
    its in vivo physiology, and does human ABCC11 genotype (Gly180Arg) measurably
    affect systemic pharmacokinetics of 5-fluorouracil or methotrexate?
- question: GO currently lacks a molecular-function term for ABC-type steroid sulfate
    transport (dehydroepiandrosterone 3-sulfate and estrone 3-sulfate efflux), which is
    ABCC11's highest-affinity characterized endogenous substrate class; should such a term,
    and its biological-process counterpart, be created and annotated to ABCC11?
suggested_experiments:
- hypothesis: ABCC11 is the rate-limiting apical efflux route for odorant precursor
    conjugates (e.g. Cys-Gly-S conjugates of 3-methyl-3-sulfanylhexanol and glutamine
    conjugates) in apocrine sweat glands.
  description: Vectorial transport and uptake assays in polarized apocrine-gland-derived
    cells expressing wild-type vs Gly180Arg ABCC11, measuring apical secretion of defined
    odorant-precursor conjugates, with knockdown controls.
  experiment_type: transport assay
- hypothesis: ABCC11-mediated DHEAS efflux at the axonal membrane contributes to local
    neurosteroid availability and neuronal excitability.
  description: Measure extracellular DHEAS and GABAA-dependent neuronal responses in
    neurons expressing wild-type vs transport-dead ABCC11, combined with immunolocalization
    relative to GABAA receptors.
  experiment_type: cell biology and electrophysiology
