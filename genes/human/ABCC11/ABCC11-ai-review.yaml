gene_symbol: ABCC11
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABCC11 (MRP8) is an ATP-binding cassette (ABC) transporter of the ABCC/MRP
  subfamily that functions as a plasma-membrane, ATP-dependent efflux pump for a broad
  range of lipophilic organic anions. Characterized substrates include the cyclic
  nucleotides cAMP and cGMP, glutathione S-conjugates (leukotriene C4, dinitrophenyl-S-glutathione),
  steroid sulfates (dehydroepiandrosterone 3-sulfate, estrone 3-sulfate), the glucuronide
  estradiol-17-beta-D-glucuronide, monoanionic bile acids (glycocholate, taurocholate),
  and cytotoxic nucleotide analogs (5-fluoro-2'-deoxyuridine monophosphate, the anti-HIV
  agent 2',3'-dideoxycytidine, and the anti-HBV agent PMEA), as well as methotrexate.
  The protein is a polytopic integral membrane protein localized to the apical/luminal
  plasma membrane of polarized and secretory cells, to axonal membranes of the central
  and peripheral nervous system, and to intracellular granules and vesicle membranes.
  A common non-synonymous polymorphism (Gly180Arg, SNP 538G>A) abolishes N-glycosylation
  and causes proteasomal degradation of the variant protein; it is the determinant
  of human earwax type (wet vs dry cerumen) and of axillary odor/osmidrosis, and ABCC11
  participates in secretion of odorant precursors and their conjugates from apocrine
  glands. By extruding cytotoxic nucleotide analog metabolites ABCC11 also acts as
  a resistance factor for drugs such as 5-fluorouracil. The gene has no ortholog in
  rodents.
