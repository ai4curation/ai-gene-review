  review:
    summary: ATP binding by the two nucleotide-binding domains (NBDs) is an intrinsic
      and essential property of this ABC transporter. UniProt annotates two Walker-A
      ATP-binding sites (residues 544-551 and 1175-1182) and the protein belongs to
      the ABC transporter superfamily, whose NBDs bind and hydrolyze ATP to power
      substrate translocation.
    action: ACCEPT
    reason: ABCC11 has two canonical ABC nucleotide-binding domains with Walker-A/B
      motifs, and all characterized transport activities are strictly ATP-dependent.
      ATP binding is correct and supports the core transporter mechanism.
    supported_by:
    - reference_id: file:human/ABCC11/ABCC11-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: '/ligand="ATP"'
- term:
    id: GO:0005774
    label: vacuolar membrane
  evidence_type: EXP
  original_reference_id: PMID:19383836
  qualifier: located_in
  review:
    summary: Immunohistochemistry of cerumen gland-containing tissue showed the wild-type
      ABCC11 protein in intracellular granules and large vacuoles as well as at the
      luminal membrane of secretory cells. The vacuolar/granular localization is a
      real experimental finding reflecting intracellular storage/sorting compartments
      in apocrine secretory cells.
    action: KEEP_AS_NON_CORE
    reason: The vacuolar membrane localization is experimentally supported but is peripheral
      to the core efflux function, which is exerted at the apical/plasma membrane.
      It reflects intracellular granule/vacuole pools in secretory cells rather than
      the site of physiological transport.
    supported_by:
    - reference_id: PMID:19383836
      supporting_text: the ABCC11 WT protein was localized in intracellular granules
        and large vacuoles, as well as at the luminal membrane of secretory cells in
        the cerumen gland
