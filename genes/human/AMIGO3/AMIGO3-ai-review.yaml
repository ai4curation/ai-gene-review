  - ensembl:ENSRNOP00000093720
  review:
    summary: 'Protein-containing complex binding, by orthology to rat: AMIGO3 binds the NgR1-p75/TROY
      receptor complex. Correct but uninformative; modified to the receptor-complex adaptor term that
      says what the binding does.'
    action: MODIFY
    reason: 'AMIGO3 joins the NgR1-p75/TROY myelin-inhibitor receptor complex in place of LINGO-1 [PMID:23613963
      "These findings demonstrate that AMIGO3 substitutes for LINGO-1 in the NgR1-p75/TROY inhibitory
      signalling complex"], mediating RhoA activation [PMID:23613963 "AMIGO3 interacted functionally with
      NgR1-p75/TROY in non-neuronal cells and in brain lysates, mediating RhoA activation in response
      to CNS myelin."]; its knockdown releases neurite growth from myelin inhibition [PMID:23613963 "Knockdown
      of AMIGO3 in myelin-inhibited adult primary DRG and retinal cultures promoted disinhibited neurite
      growth when cells were stimulated with appropriate neurotrophic factors."] and promotes axon regeneration
      in vivo [PMID:30013050 "suppression of AMIGO3 disinhibits the growth of axotomised DRGN enabling
      NT3 to stimulate the regeneration of their DC axons and enhances functional recovery."]. The functional
      experiments are in rat neurons and tissue, but the complex also co-immunoprecipitates from human
      brain [PMID:23613963 "Co-immunoprecipitation of AMIGO3, NgR1 and p75 from adult rat and human brain
      lysates"]. The human IEA rows were built by orthology from the rat annotations. AMIGO3 does not
      bind the myelin ligand itself (NgR1 does); it is a structural co-receptor that completes the signalling
      complex in place of LINGO-1. Reconstitution shows it is required for a working complex: only all
      three receptors together confer myelin responsiveness [PMID:23613963 "In the presence of CME, transfection
      with all three receptors, NgR1, p75 and AMIGO3 genes, conferred responsiveness to CME"], and the
      three assemble in transfected cells and in brain extracts, including human [PMID:23613963 "These
      results demonstrate that AMIGO3, NgR1 and p75 interact appropriately to form a receptor complex
      in both transfected cells and in brain extracts containing native co-receptor partners."], [PMID:23613963
      "Co-immunoprecipitation of AMIGO3, NgR1 and p75 from adult rat and human brain lysates"]. GO:0030159
      signaling receptor complex adaptor activity - providing physical support for assembly of a multiprotein
      receptor signalling complex - states that role; coreceptor activity would wrongly require ligand
      binding.'
    supported_by:
    - reference_id: PMID:23613963
      supporting_text: In the presence of CME, transfection with all three receptors, NgR1, p75 and AMIGO3
        genes, conferred responsiveness to CME
    - reference_id: PMID:23613963
      supporting_text: These results demonstrate that AMIGO3, NgR1 and p75 interact appropriately to form
