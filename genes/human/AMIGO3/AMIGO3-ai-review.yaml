  title: AMIGO3 is an NgR1/p75 co-receptor signalling axon growth inhibition in the acute phase of adult
    central nervous system injury.
  findings:
  - statement: AMIGO3 substitutes for LINGO-1 in the NgR1-p75/TROY complex.
    supporting_text: These findings demonstrate that AMIGO3 substitutes for LINGO-1 in the NgR1-p75/TROY
      inhibitory signalling complex
  - statement: AMIGO3 mediates RhoA activation in response to myelin.
    supporting_text: AMIGO3 interacted functionally with NgR1-p75/TROY in non-neuronal cells and in brain
      lysates, mediating RhoA activation in response to CNS myelin.
  - statement: AMIGO3 knockdown disinhibits neurite growth.
    supporting_text: Knockdown of AMIGO3 in myelin-inhibited adult primary DRG and retinal cultures promoted
      disinhibited neurite growth when cells were stimulated with appropriate neurotrophic factors.
