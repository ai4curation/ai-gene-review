    supporting_text: In the presence of CME, transfection with all three receptors, NgR1, p75 and AMIGO3
      genes, conferred responsiveness to CME
  - statement: The complex co-immunoprecipitates from rat and human brain.
    supporting_text: Co-immunoprecipitation of AMIGO3, NgR1 and p75 from adult rat and human brain lysates
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Functional work mainly in rat, with reconstitution in COS-7 cells
      and a co-IP from adult human brain lysate; source of the rat IMP and IPI rows behind the human IEAs.
