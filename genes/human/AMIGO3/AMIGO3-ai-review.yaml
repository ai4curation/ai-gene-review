id: Q86WK7
gene_symbol: AMIGO3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AMIGO3 is a type I transmembrane protein of the AMIGO family, with six leucine-rich repeats
  flanked by cysteine-rich caps and a single immunoglobulin domain outside the cell. Like AMIGO1 and AMIGO2
  it engages in homophilic and heterophilic binding within the family. In the injured central nervous
  system it acts as a co-receptor in the Nogo receptor complex, substituting for LINGO-1 alongside NgR1
  and p75/TROY to transduce myelin-derived inhibitory signals through RhoA, so that it restrains axon
  regeneration; its knockdown in sensory and retinal neurons releases neurite and axon growth after injury.
