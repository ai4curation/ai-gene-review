core_functions:
- description: >-
    Asymmetrical hydrolysis of diadenosine 5',5'''-P1,P4-tetraphosphate (Ap4A) to ATP
    and AMP by a Mg2+-dependent Nudix active site, setting intracellular Ap4A levels and
    thereby limiting Ap4A-dependent signalling (e.g. LysRS-Ap4A-HINT1 derepression of
    MITF/USF2 in activated mast cells).
  molecular_function:
    id: GO:0004081
    label: bis(5'-nucleosyl)-tetraphosphatase (asymmetrical) activity
  directly_involved_in:
  - id: GO:0015967
    label: diadenosine tetraphosphate catabolic process
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:15596429
    supporting_text: >-
      Asymmetric diadenosine 5',5'''-P(1),P(4)-tetraphosphate (Ap(4)A) hydrolases play a
      major role in maintaining homeostasis by cleaving the metabolite diadenosine
      tetraphosphate (Ap(4)A) back into ATP and AMP.
  - reference_id: PMID:27144453
    supporting_text: causing a 175-fold increase in intracellular Ap4A
  - reference_id: PMID:18644867
    supporting_text: >-
      The knockdown of Ap(4)A hydrolase modulated Ap(4)A accumulation, resulting in
      changes in the expression of MITF and USF2 target genes.
- description: >-
    Processing of RNA 5' ends by the same Nudix active site: sequential removal of
    phosphates from 5'-triphosphorylated RNA to yield XRN1-degradable 5'-monophosphate
    RNA, and removal of non-canonical 5' caps; loss of decapping is implicated in the
    NUDT2-related neurodevelopmental disorder.
  molecular_function:
    id: GO:0140818
    label: mRNA 5'-triphosphate monophosphatase activity
  directly_involved_in:
  - id: GO:0110154
    label: RNA decapping
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:34824277
    supporting_text: >-
      NUDT2 sequentially releases two phosphates, and a monophosphorylated RNA is
      generated that can then serve as a substrate for the cellular exonuclease XRN1.
  - reference_id: PMID:38141063
    supporting_text: >-
      add-back experiments using an Ap4A hydrolase defective in mRNA decapping
      highlighted loss of NUDT2 decapping as the activity implicated in altered mRNA
      homeostasis
suggested_questions:
- question: >-
    Which NUDT2 activity is physiologically dominant in neurons: Ap4A hydrolysis or RNA
    5'-end processing/decapping, and which cap types (m7G, Ap4A, FAD, dpCoA) are the
    relevant cellular substrates?
- question: >-
    Should the PANTHER node PTN000482012 carry diadenosine tetraphosphate catabolic
    process (GO:0015967) in place of the product-based AMP/ATP biosynthetic process
    IBDs seeded only by C. elegans ndx-4?
- question: >-
    Is there a GO molecular function term for sequential dephosphorylation of 5'-PPP
    RNA that is not restricted to mRNA (viral genomic RNA), or should GO:0140818 be
    broadened?
- question: >-
    Does NUDT2 positively regulate mTORC1 via Rag GTPase binding independently of its
    catalytic activity?
suggested_experiments:
- description: >-
    In patient-derived neurons or iPSC neural lineages, separate Ap4A-hydrolase and
    decapping roles using separation-of-function NUDT2 alleles, combined with cap-seq
    (CapQ/LC-MS) and Ap4A quantification.
- description: >-
    Profile Ap4A-capped, FAD-capped and dpCoA-capped RNAs transcriptome-wide in NUDT2
    knockout versus rescued cells under stress conditions that elevate Ap4A.
