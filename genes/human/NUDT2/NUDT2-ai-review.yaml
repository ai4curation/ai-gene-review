- id: PMID:34824277
  title: NUDT2 initiates viral RNA degradation by removal of 5'-phosphates.
  findings:
  - statement: NUDT2 sequentially dephosphorylates 5'-PPP RNA to P-RNA for XRN1 decay; NUDT2
      loss increases growth of PPP-RNA viruses in cells; NUDT2 is nuclear and cytoplasmic.
    supporting_text: >-
      NUDT2 sequentially releases two phosphates, and a monophosphorylated RNA is
      generated that can then serve as a substrate for the cellular exonuclease XRN1.
  - statement: Nudt2 knockout mice are viable with no overt phenotype and no survival difference
      after VSV infection.
    supporting_text: >-
      Homozygous knockout mice were viable, bred with expected Mendelian ratios
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available.
