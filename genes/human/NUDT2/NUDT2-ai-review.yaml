- term:
    id: GO:0006167
    label: AMP biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000482012
  - WB:WBGene00003581
  review:
    summary: >-
      Process term inferred because AMP is one of the two products of Ap4A hydrolysis;
      the IBD on PTN000482012 is seeded only by C. elegans ndx-4 IDA rows.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      AMP is released as a by-product of degrading Ap4A, not as the purpose of a
      biosynthetic pathway, and there is no evidence that NUDT2 contributes measurably to
      cellular AMP pools. The worm seed annotations were themselves marked as
      product-based over-annotations in the ndx-4 review. The informative process is
      diadenosine tetraphosphate catabolic process (GO:0015967), which the node does not
      currently carry.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000482012
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Node-level process term grounded only in the reaction product of Ap4A
          hydrolysis; the catabolic process term would be the appropriate node assertion.
      - source_id: WB:WBGene00003581
        source_label: ndx-4
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          Sole seed; its own AMP biosynthetic IDA rows are product-based inferences
          marked over-annotated in the ndx-4 review.
    supported_by:
    - reference_id: PMID:15596429
      supporting_text: >-
        cleaving the metabolite diadenosine tetraphosphate (Ap(4)A) back into ATP and
        AMP
