id: P50583
gene_symbol: NUDT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  NUDT2 (APAH1) encodes the human asymmetrical diadenosine tetraphosphate (Ap4A)
  hydrolase, a 17-kDa monomeric Nudix hydrolase that cleaves Ap4A (and related
  dinucleoside tetraphosphates such as Gp4G) into a nucleoside triphosphate plus a
  nucleoside monophosphate (ATP + AMP for Ap4A). NMR and crystal structures show a
  Nudix fold whose adenine-stacking binding site resembles the C. elegans orthologue
  and differs from plant/bacterial Ap4A hydrolases. NUDT2 is the main enzyme setting
  intracellular Ap4A levels: CRISPR disruption in KBM-7 cells raises Ap4A about
  175-fold and broadly alters gene expression, and in immunologically activated mast
  cells NUDT2 degrades the Ap4A produced by lysyl-tRNA synthetase, thereby limiting
  Ap4A/HINT1-dependent derepression of the transcription factors MITF and USF2. The
  same active site also acts on RNA 5' ends: NUDT2 sequentially removes phosphates
  from 5'-triphosphorylated (viral) RNA, generating monophosphorylated RNA that XRN1
  can degrade, and it decaps several non-canonical RNA caps in vitro (Ap4A-, FAD- and
  dephospho-CoA-capped RNA), with patient data implicating mRNA decapping in cellular
  mRNA homeostasis. NUDT2 is present in both nucleus and cytoplasm. Biallelic
  loss-of-function variants cause an autosomal recessive neurodevelopmental disorder
  with intellectual disability, motor delay and in some cases peripheral neuropathy
  (IDDPN). NUDT2 is overexpressed in some carcinomas and has been reported to support
  cancer-cell proliferation.
