- term:
    id: GO:0034599
    label: cellular response to oxidative stress
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-3299685
  qualifier: involved_in
  review:
    summary: >-
      Derived from Reactome placing the NUDT2 Gp4G hydrolysis reaction inside
      "Detoxification of Reactive Oxygen Species".
    action: REMOVE
    reason: >-
      The Reactome pathway concerns superoxide dismutases, catalase and peroxidases;
      NUDT2 does not detoxify reactive oxygen species and there is no experimental
      evidence that it acts in an oxidative stress response. Ap4A levels rise under
      stress, but degrading a stress-associated nucleotide is captured by
      diadenosine tetraphosphate catabolic process, not by an oxidative-stress response
      term.
    supported_by:
    - reference_id: Reactome:R-HSA-3299685
      supporting_text: >-
        Aerobic cells have defenses that detoxify reactive oxygen species by converting
        them to less reactive products.
- term:
    id: GO:0015967
    label: diadenosine tetraphosphate catabolic process
  evidence_type: IMP
  original_reference_id: PMID:27144453
  qualifier: involved_in
  review:
    summary: >-
      Disruption of NUDT2 in human KBM-7 cells raises intracellular Ap4A 175-fold, and
      NUDT2 knockdown in mast cells modulates Ap4A accumulation after immunological
      activation.
    action: NEW
    reason: >-
      NUDT2 itself catalyses the hydrolysis of Ap4A, so it performs the catabolic step;
      the loss-of-function data show it is the dominant Ap4A-degrading enzyme in human
      cells. This is the core process and is absent from GOA for human NUDT2 (and from
      the PTN000482012 node).
    supported_by:
    - reference_id: PMID:27144453
      supporting_text: causing a 175-fold increase in intracellular Ap4A
    - reference_id: PMID:18644867
      supporting_text: >-
        we provided here evidence that the "Nudix" type 2 gene product, Ap(4)A
        hydrolase, is responsible for Ap(4)A degradation following the immunological
        activation of mast cells
- term:
    id: GO:0140818
    label: mRNA 5'-triphosphate monophosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:34824277
  qualifier: enables
  review:
    summary: >-
      Recombinant human NUDT2 removes the gamma-phosphate from 5'-triphosphorylated RNA
      and then a second phosphate, sequentially, yielding 5'-monophosphorylated RNA;
      the E58A Nudix-box mutant is inactive.
    action: NEW
    reason: >-
      Direct enzymatic evidence that NUDT2 releases single phosphates from 5'-PPP RNA
      (including PPP-RNA of HCV, which functions as mRNA). GO:0140818 describes exactly
      the first step (PPP-RNA to PP-RNA plus phosphate). Kept separate from the
      Ap4A-hydrolase function, and non-core pending evidence on cellular substrates.
    supported_by:
    - reference_id: PMID:34824277
      supporting_text: >-
        Notably, NUDT2 sequentially released single phosphates resulting in a
        di-phosphorylated dinucleotide intermediate that is further converted into a
        mono-phosphorylated product
    - reference_id: PMID:34824277
      supporting_text: >-
        NUDT2 sequentially releases two phosphates, and a monophosphorylated RNA is
        generated that can then serve as a substrate for the cellular exonuclease XRN1.
- term:
    id: GO:0110154
    label: RNA decapping
  evidence_type: IMP
  original_reference_id: PMID:38141063
  qualifier: involved_in
  review:
    summary: >-
      NUDT2 decaps RNAs: patient-derived NUDT2 variants lose enzymatic activity, and
      add-back of a decapping-defective but Ap4A-hydrolase-competent NUDT2 implicates
      decapping in the altered mRNA homeostasis of NUDT2-deficient fibroblasts. In vitro
      NUDT2 also removes Ap4A, FAD and dpCoA caps.
    action: NEW
    reason: >-
      NUDT2 catalyses the cap cleavage itself, so it performs the step. The general
      RNA decapping term is used because the cellular cap types targeted are not yet
      resolved (in vitro activity on Ap4A-, FAD- and dpCoA-capped RNA; the Brain paper's
      full text was not available to establish the cap type assayed in cells).
    supported_by:
    - reference_id: PMID:38141063
      supporting_text: >-
        add-back experiments using an Ap4A hydrolase defective in mRNA decapping
        highlighted loss of NUDT2 decapping as the activity implicated in altered mRNA
        homeostasis
    - reference_id: PMID:37934413
      supporting_text: >-
        A decapping enzyme screen identifies two enzymes cleaving Ap4 A-RNA,NUDT2 and
        DXO
    - reference_id: PMID:32432673
      supporting_text: Nudt2 and Nudt16 have deFADding activity in vitro.
