- id: PMID:32432673
  title: Mammalian Nudix proteins cleave nucleotide metabolite caps on RNAs.
  findings:
  - statement: Nudt2 removes FAD and dpCoA caps from RNA in vitro but not NAD caps; no change
      in cellular FAD-capped RNA in Nudt2-KO cells.
    supporting_text: >-
