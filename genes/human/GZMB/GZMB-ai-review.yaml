id: P10144
gene_symbol: GZMB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Granule serine protease that is the executioner of cytotoxic lymphocyte killing. Granzyme
  B is synthesised by CD8 T cells and natural killer cells with a signal peptide and an activation dipeptide,
  and is stored as soluble, serglycin-complexed cargo in the lumen of secretory lysosomes known as cytolytic
  granules, alongside perforin and other granzymes. It is a chymotrypsin-fold enzyme with the unusual
  specificity of cleaving after aspartate, which is the structural reason it can substitute for caspases
  on their substrates. On recognition of a target cell the granules fuse at the immunological synapse
  and release their contents into the cleft, where perforin delivers granzyme B across the target plasma
  membrane or, after perforin-triggered endocytosis, out of enlarged endosomes into the cytosol. There
  it kills by limited, activating proteolysis rather than by degradation: it processes procaspase-3 and,
  through it, procaspase-7, cleaves BID to the myristoylated tBID fragment that drives permeabilisation
  of the mitochondrial outer membrane, and cleaves gasdermin E at the same aspartate caspase-3 uses, which
  converts the death from apoptotic to lytic pyroptosis. It also enters the nucleus and cleaves lamin
  B, ICAD and other nuclear substrates, so the death programme proceeds even when caspases are inhibited.
  Beyond killing host cells it has two further proteolytic arms: it degrades extracellular matrix, cleaving
  cartilage aggrecan and implicating it in joint destruction, and it attacks bacteria directly, cleaving
  aminoacyl tRNA synthetases, ribosomal proteins and chaperones to disassemble the bacterial ribosome
  and block protein synthesis. Its activity is restrained by the intracellular inhibitor SERPINB9, which
  protects the killer cell from its own enzyme and, when expressed by tumour or stem cells, confers resistance
  to cytotoxic attack.'
