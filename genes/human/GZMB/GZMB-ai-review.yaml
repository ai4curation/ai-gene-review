- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11911826
  qualifier: enables
  supporting_entities:
  - UniProtKB:P10124
  review:
    summary: Bare protein binding recording the granzyme B-serglycin association.
    action: REMOVE
    reason: Bare protein binding carries no functional information and is removed under the project's
      protein-binding policy. Removal says the annotation is uninformative, not that the interaction is
      false. The partner is serglycin (UniProtKB:P10124), the granule proteoglycan that granzyme B and
      perforin are packaged with, and the association is real and functionally interesting - Metkar et
      al. show cytotoxic cells secrete granzyme B exclusively as a macromolecular complex with it, so
      serglycin is the scaffold the enzyme travels on. No more informative molecular function is proposed
      from it, because what serglycin does for granzyme B is carry and concentrate it, which is a property
      of serglycin rather than an activity of granzyme B.
    supported_by:
    - *id003
