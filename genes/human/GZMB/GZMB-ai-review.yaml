  review:
    summary: Granzyme B is a secreted granule protease.
    action: ACCEPT
    reason: 'Correct. Granzyme B carries a signal peptide, is stored in secretory lysosomes and is released
      by regulated exocytosis, so it is extracellular at the point where perforin acts on it. It also
      has genuine extracellular substrates: Froelich et al. showed it solubilises cartilage matrix by
      cleaving aggrecan, which is the basis of the extracellular-matrix disassembly annotation this review
      proposes.'
