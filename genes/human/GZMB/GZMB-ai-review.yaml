    reason: Correct, with a mechanistic nuance the annotation does not record. Granzyme B cleaves gasdermin
      E at D270, the same site caspase-3 uses, releasing the pore-forming fragment that makes the death
      lytic rather than apoptotic. Reactome is explicit that direct cleavage of gasdermin E by granzyme
      B is inefficient and that the dominant route is granzyme B activating caspase-3, which then cleaves
      gasdermin E - so granzyme B participates both directly and, more importantly, as the initiator of
