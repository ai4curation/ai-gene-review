suggested_questions:
- question: Should granzyme B carry GO:0008656 cysteine-type endopeptidase activator activity involved
    in apoptotic process? Activating the executioner caspases is its signature function and there is precedent
    for a protease on that term (cathepsin H, by IDA), but the activating cleavage is already captured
    by protein maturation plus the endopeptidase activity, so this review raised it rather than asserting
    it.
  experts:
  - Guy S Salvesen
  - Christopher J Froelich
- question: Granzyme B kills bacteria directly by cleaving their translation machinery, yet neither it
    nor granzyme A, granulysin or perforin carries any defense-response-to-bacterium or antimicrobial
    term. Is that a deliberate convention about cytotoxic granule effectors, or a gap across the whole
    set?
  experts:
  - Farokh Dotiwala
  - Judy Lieberman
- question: GO has a well-populated family for a symbiont suppressing a host's translation (GO:0039604)
    but appears to have no counterpart for a host protein suppressing translation in another organism.
    Granzyme B's row therefore sits on the plain negative regulation of translation term, where a reader
    cannot tell it from autoregulation. Should such a term exist?
  experts:
  - Pascale Gaudet
  - David Hill
- question: How much of granzyme B-driven pyroptosis proceeds through direct gasdermin E cleavage versus
    through caspase-3? Reactome states the direct route is inefficient, which would make the pyroptosis
    annotation largely a consequence of caspase-3 activation rather than a separate granzyme B activity.
  experts:
  - Zhibin Zhang
  - Judy Lieberman
  - Bo Huang
- question: Three annotations on this record (the immunological synapse, the nucleus, and the apoptotic
    process) are traceable author statements citing granzyme A papers. Should they be re-referenced to
    granzyme B primary sources, and does the pattern extend to other granzyme records?
  experts:
  - Judy Lieberman
suggested_experiments:
- hypothesis: Granzyme B's contribution to pyroptosis is almost entirely indirect, through caspase-3,
    rather than through direct gasdermin E cleavage.
  description: In gasdermin E-expressing target cells, compare killing by purified perforin plus granzyme
    B in cells that are wild type, caspase-3 null, or express a gasdermin E bearing a mutation at the
    granzyme B cleavage site but not the caspase-3 site, with matched enzyme concentrations. Quantify
    gasdermin E cleavage, lactate dehydrogenase release and apoptotic versus lytic morphology. If lysis
    is abolished in caspase-3 null cells, the pyroptosis annotation is a downstream consequence and should
    be read as such.
  experiment_type: Substrate-site mutagenesis with caspase-3 epistasis
- hypothesis: Granzyme B degrades extracellular matrix in vivo at sites of lymphocyte infiltration, supporting
    an extracellular matrix disassembly annotation independent of its killing role.
  description: Use a granzyme B-selective active-site probe on synovial tissue from inflammatory arthritis
    alongside aggrecan neoepitope antibodies raised against the granzyme B cleavage site, and compare
    with ADAMTS-generated neoepitopes in the same sections. Detecting granzyme B-specific aggrecan neoepitopes
    in situ would move the proposed annotation from an in vitro demonstration to an in vivo one and would
    separate it from the aggrecanases.
  experiment_type: Activity-based probe plus neoepitope immunohistochemistry
- hypothesis: The nuclear arm of granzyme B killing is functionally significant rather than incidental,
    despite granzyme B being much less active on lamin B than granzyme A.
  description: Deliver granzyme B into target cells with perforin while blocking caspases, and compare
    wild type with a nuclear-entry-impaired granzyme B, scoring lamin B and ICAD cleavage, nuclear envelope
    integrity and DNA fragmentation. A caspase-independent death that survives caspase blockade but not
    the loss of nuclear access would establish the nuclear location as a site of function and not just
    of presence.
  experiment_type: Caspase-blockade killing with nuclear-access mutants
- hypothesis: Granzyme B's antibacterial activity requires delivery into the bacterium and is distinct
    from its host-cell killing function.
  description: Test purified granzyme B against intracellular Listeria, Mycobacterium and Escherichia
    coli in the presence and absence of perforin and granulysin, measuring bacterial viability alongside
    ribosome integrity by polysome profiling and cleavage of the identified tRNA synthetase and ribosomal
    protein substrates. Pairing the biochemistry with viability would settle whether a bacterial-defense
    process annotation is warranted for the granule effectors as a group.
  experiment_type: Reconstituted intracellular killing with ribosome profiling
