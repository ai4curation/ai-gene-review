core_functions:
- molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  description: 'A single catalytic activity with an unusually wide and consequential substrate range.
    Granzyme B is a chymotrypsin-fold serine protease that cleaves after aspartate, the specificity that
    lets it stand in for caspases on their own substrates, and GO has no granzyme-specific term for it,
    so the generic endopeptidase term is as precise as the ontology allows. Almost everything granzyme
    B does is this one reaction applied to a different target: limited activating cleavage of procaspase-3
    and, through it, procaspase-7; cleavage of BID to the myristoylated tBID that permeabilises the mitochondrial
    outer membrane; cleavage of gasdermin E at the caspase-3 site, which makes the death lytic; cleavage
    of lamin B and other nuclear substrates, which keeps the programme running under caspase blockade;
    degradation of cartilage aggrecan outside the cell; and destruction of the bacterial translation apparatus.
    The distinction that matters for reading the annotations is between activating cleavage, which is
    protein maturation, and destructive cleavage, which is catabolism - granzyme B does both, on different
    substrates.'
