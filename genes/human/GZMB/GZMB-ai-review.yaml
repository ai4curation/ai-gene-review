      to cartilage loss in the rheumatoid joint. That paper is already cited three times on this record,
      for endopeptidase activity, extracellular location and granule location, but never for a process.
      Participation is clear and is not a necessity artefact: granzyme B itself performs the cleavage
      of a matrix component. The comparator check supports proposing it rather than reading the absence
      as a convention - GO:0022617 has 42 human genes and they are exactly this cohort, including the
      aggrecanases ADAMTS4 and ADAMTS5 and, tellingly, the other granule serine proteases of the immune
      system: chymase (CMA1), cathepsin G, neutrophil elastase and tryptase (TPSAB1) all carry it. Granzyme
      B is the one missing from that group.'
