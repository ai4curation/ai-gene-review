- term:
    id: GO:0005634
    label: nucleus
  evidence_type: TAS
  original_reference_id: PMID:11909973
  qualifier: located_in
  review:
    summary: Nuclear localisation of granzyme B, from a traceable author statement in a granzyme A paper.
    action: ACCEPT
    reason: 'The claim holds for granzyme B independently of this reference. Granzyme B reaches the nucleus
      and cleaves nuclear substrates: Zhang et al. show both granzymes cleave lamin B directly, in isolated
      nuclei and in cells loaded with perforin and granzymes, and granzyme B''s other nuclear substrates
      (ICAD, PARP, NuMA) are long established. Accepted on that basis. One caveat about the reference
      rather than the claim: the cited paper is a granzyme A study, and the GOA row is a traceable author
      statement rather than a direct assay. Granzyme A and granzyme B are different gene products with
      overlapping biology and the Lieberman laboratory published on both, so a curator reading the full
      text may have had granzyme B data in view; the full text is not in the local cache. The claim itself
      is independently supported, as set out above, so this is recorded as a re-referencing suggestion
      rather than as an error, and the action is not based on the reference mismatch. Note also that Zhang
      et al. report granzyme B is about fifty times less active than granzyme A on lamin B, so the nuclear
      arm is real but weaker for this enzyme.'
    supported_by:
    - reference_id: PMID:11331782
      supporting_text: 'Both GzmA and GzmB directly and efficiently cleave

        laminB in vitro, in situ in isolated nuclei and in cells loaded with perforin

        and Gzms, even in the presence of caspase inhibitors.'
    - reference_id: PMID:11331782
      supporting_text: 'LaminB is cleaved by GzmA

        at concentrations of 3 nM, but GzmB is 50 times less active.'
    additional_reference_ids:
    - PMID:11331782
