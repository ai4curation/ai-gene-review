  qualifier: located_in
  review:
    summary: Granzyme B at the immunological synapse, from a traceable author statement in a granzyme
      A paper.
    action: ACCEPT
    reason: 'The location is correct and central: granzyme B is released by granule exocytosis into the
      cleft between the killer cell and its target, which is where perforin gives it access to the target
      cytosol. Thiery et al. follow perforin and granzymes together from that membrane into endosomes,
      and Metkar et al. show the secreted form is a macromolecular granzyme B-serglycin complex. One caveat
      about the reference rather than the claim: the cited paper is a granzyme A study, and the GOA row
      is a traceable author statement rather than a direct assay. Granzyme A and granzyme B are different
      gene products with overlapping biology and the Lieberman laboratory published on both, so a curator
      reading the full text may have had granzyme B data in view; the full text is not in the local cache.
      The claim itself is independently supported, as set out above, so this is recorded as a re-referencing
      suggestion rather than as an error, and the action is not based on the reference mismatch.'
    supported_by:
    - &id005
      reference_id: PMID:20038786
      supporting_text: 'Here we show that perforin activates clathrin- and

        dynamin-dependent endocytosis, which removes perforin and granzymes from the

        plasma membrane to early endosomes, preserving outer membrane integrity.'
    - &id003
      reference_id: PMID:11911826
      supporting_text: 'Granzyme B (GrB) and perforin were found to coexist as multimeric complexes with

        the proteoglycan serglycin (SG) in cytotoxic granules, and cytotoxic cells were

        observed to secrete exclusively macromolecular GrB-SG.'
