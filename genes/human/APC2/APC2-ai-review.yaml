id: O95996
gene_symbol: APC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: APC2 (APCL) is a large, brain-enriched APC-family protein that associates with microtubules
  and actin-rich structures and binds beta-catenin. Its C-terminal regions support microtubule lattice
  association, interactions with growing plus ends and DYNLL2-dependent clustering. These activities help
  organize neuronal microtubules and dendritic morphology; local stabilization can coexist with ongoing
  microtubule growth and shrinkage. APC2 also reduces beta-catenin abundance and beta-catenin-dependent
  transcription. Perinuclear, Golgi and peripheral actin-associated pools have been observed in human
  cells. Biallelic loss of APC2 causes a neurodevelopmental disorder with lissencephaly and subcortical
  heterotopia.
