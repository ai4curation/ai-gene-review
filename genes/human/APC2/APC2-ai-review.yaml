core_functions:
- description: Associates with microtubules through C-terminal lattice- and plus-tip-interacting regions,
    supporting neuronal microtubule organization and dynamicity. Human-construct assays and rat depletion/rescue
    support this function; local stabilization does not imply global suppression of dynamics.
  molecular_function:
