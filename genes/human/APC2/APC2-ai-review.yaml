    supporting_text: the S domain extended on both sides (RFP-APC2-S2) is the minimum necessary sequence
      for microtubule interaction
    full_text_unavailable: false
  - reference_id: file:human/APC2/APC2-notes.md
    supporting_text: Wild-type protein associated with microtubules and F-actin, protected acetylated
      microtubules from nocodazole, and increased GTP-bound Rac1 relative to control.
- description: Binds beta-catenin and participates in its destruction complex to restrain beta-catenin-dependent
    transcription. Human APCL fragment experiments establish beta-catenin binding, depletion and TCF suppression;
    mammalian APC2 SAMP-dependent conductin binding supplies complementary complex-assembly evidence with
    unresolved original construct species.
