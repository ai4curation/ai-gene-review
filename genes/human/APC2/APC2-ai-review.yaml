    supporting_text: 'Like APC, APC2 regulates the formation of active betacatenin-Tcf

      complexes'
  - statement: Two SAMP domains are required for the reported mammalian APC2 interaction with conductin,
      providing mechanistic support for destruction-complex participation.
    supporting_text: 'shown to contain two SAMP domains, both of which are required for binding to

      conductin.'
