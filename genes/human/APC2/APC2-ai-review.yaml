suggested_questions:
- question: What target incorporation experiments or applicable ancestral evidence establish APC2 membership
    in the cadherin-associated catenin complex, and what original evidence underlies the PMID:9601641
    NAS assignments?
- question: Does original EB3 accession AB024964 map exactly to the partner isoform Q9UPY8-1 used by the
    curated interaction record?
- question: Which human APC2 isoforms and tissues use beta-catenin regulation versus microtubule organization,
    and how do local stabilization and dynamic regrowth interact?
- question: Can microtubule plus-tip recognition be separated experimentally from lattice binding in human
    APC2, and would a more specific molecular-function term describe the demonstrated interaction?
suggested_experiments:
- description: Resolve original APC2/EB3 reagent sequences against current isoform records before assigning
    isoform-specific binding.
- description: Reconstitute human APC2 lattice and plus-tip interactions with defined proteins and image
    growth, catastrophe and rescue to distinguish direct microtubule association from partner-dependent
    recruitment.
