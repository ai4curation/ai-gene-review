core_functions:
- description: 'MAP2K3 (MKK3) is a dual-specificity MAP kinase kinase of the p38 stress-activated cascade: once activated
    by stress/cytokine MAP3Ks (ASK1, TAK1, TAO2) it phosphorylates the Thr and Tyr of the Thr-Gly-Tyr activation motif of
    p38 MAPKs (p38alpha/beta), selectively over ERK and JNK.'
