suggested_questions:
- question: Which p38 isoforms (alpha, beta, gamma, delta) does MKK3 preferentially activate in vivo relative to MKK6, and
    does this preference differ between the MKK3 splice isoforms?
- question: Does MKK3 directly phosphorylate DYRK1B/Mirk, or does it increase Mirk activity through a non-catalytic or p38-dependent
    mechanism?
suggested_experiments:
- description: In vitro kinase assays with purified active MKK3 and each recombinant p38 isoform (and DYRK1B), combined with
    phosphosite mapping, to define MKK3 substrate preferences quantitatively.
