id: P46734
gene_symbol: MAP2K3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MAP2K3 (MKK3, MEK3) is a dual-specificity protein kinase of the STE group that forms the MAP kinase kinase tier
  of the p38 stress-activated MAPK cascade. It is activated by cytokines and environmental stresses (osmotic, oxidative, inflammatory)
  through phosphorylation of Ser218 and Thr222 in its activation loop by MAP3Ks such as ASK1 (MAP3K5), TAK1, TAO2 and ZAK,
  which it binds through docking motifs. Activated MKK3 phosphorylates the threonine and tyrosine of the Thr-Gly-Tyr activation
  motif of p38 MAP kinases (notably p38alpha/MAPK14 and p38beta), and is selective for p38 over ERK and JNK. It is a soluble
  protein found in cytoplasm and nucleus and partly redundant with MKK6. Through p38 it contributes to inflammatory, stress-response,
  endothelial migration and senescence programs. It is a target of bacterial virulence factors (anthrax lethal factor cleavage,
  Yersinia YopJ acetylation).
