  review:
    summary: Phylogenetic inference that MAP2K3 participates in a MAPK cascade, from the PANTHER MAP2K family node.
    action: ACCEPT
    reason: MKK3 is the MAP2K tier of the p38 MAPK cascade. The IBA is placed at a node covering MAP2Ks across eukaryotes
      and MAP2K3 lies within that clade with direct experimental support (it appears in its own WITH/FROM list). The general
      term is correct; the more specific p38MAPK cascade (GO:0038066) is separately annotated.
    supported_by:
    - &id001
      reference_id: file:human/MAP2K3/MAP2K3-uniprot.txt
      supporting_text: protein kinase family. MAP kinase kinase subfamily.
    - &id003
      reference_id: PMID:8622669
      supporting_text: Expression of activated MKK3 and MKK6 in cultured cells caused a selective increase in p38 MAP kinase
        activity.
