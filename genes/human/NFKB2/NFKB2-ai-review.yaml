id: Q00653
gene_symbol: NFKB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NFKB2 encodes the NF-kappaB p100 precursor and its processed p52 DNA-binding subunit. In resting cells, p100 uses C-terminal ankyrin repeats to retain RelB-containing complexes in the cytosol; noncanonical NIK-IKKalpha signaling phosphorylates p100 and promotes proteasomal processing to p52, allowing p52:RelB dimers to enter the nucleus and regulate kappaB-site RNA polymerase II target genes.
