gene_symbol: ABCB1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ABCB1 (P-glycoprotein 1, MDR1, CD243) is a plasma-membrane ATP-binding cassette
  (ABC) transporter of the ABCB subfamily. The single 1280-residue polypeptide is
  built from two homologous halves, each contributing six transmembrane helices and
  a cytosolic nucleotide-binding domain; the two nucleotide-binding domains bind and
  hydrolyse ATP to drive substrate export through alternating inward-facing and
  outward-facing conformations. ABCB1 has two biochemically distinct, ATP-dependent
  activities: it is a polyspecific efflux pump that extrudes a chemically diverse set
  of hydrophobic drugs and xenobiotics out of the cell (the molecular basis of the
  multidrug-resistance phenotype, EC 7.6.2.2), and it is a broad-specificity lipid
  floppase that translocates phospholipids and sphingolipids (phosphatidylcholine,
  phosphatidylethanolamine, glucosylceramide, sphingomyelin) from the cytoplasmic to
  the exoplasmic membrane leaflet (EC 7.6.2.1). It localizes mainly to the apical
  (luminal) plasma membrane of polarized epithelia and barrier endothelia
  (intestine, liver, kidney, blood-brain and blood-CSF barriers), where it drives
  vectorial transepithelial export, limits the entry of substrates into protected
  compartments such as the brain, and contributes to drug absorption, distribution
  and excretion. Its surface abundance and localization are regulated by
  ubiquitination (NEDD4-1, RNF2) and by interacting partners (e.g. C1orf115).
