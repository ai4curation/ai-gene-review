core_functions:
- description: >-
    ATP-driven efflux of a broad range of hydrophobic drugs and xenobiotics out of the
    cell across the plasma membrane, producing the multidrug-resistance phenotype and
    protecting tissue barriers (intestine, liver, kidney, blood-brain and blood-CSF
    barriers) by limiting substrate entry/accumulation.
  supported_by:
  - reference_id: PMID:3022150
    supporting_text: confers a complete multidrug-resistant phenotype
  - reference_id: PMID:29371429
    supporting_text: P-glycoprotein extrudes toxic molecules and drugs from cells through
      ATP-powered conformational changes
  molecular_function:
    id: GO:0008559
    label: ABC-type xenobiotic transporter activity
  directly_involved_in:
  - id: GO:1990961
    label: xenobiotic detoxification by transmembrane export across the plasma membrane
  - id: GO:1990962
    label: xenobiotic transport across blood-brain barrier
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0005886
    label: plasma membrane
- description: >-
    ATP-driven broad-specificity lipid floppase that translocates phospholipids and
    sphingolipids (phosphatidylcholine, phosphatidylethanolamine, glucosylceramide,
    sphingomyelin) from the cytoplasmic to the exoplasmic leaflet of the apical
    membrane.
  supported_by:
  - reference_id: PMID:8898203
    supporting_text: the short-chain lipids must have been translocated by the Pgps across
      the plasma membrane
