    reason: >-
      This is a direction (sign) error. Flippase (GO:0090555) catalyses movement from the
      exoplasmic to the cytosolic leaflet (inward), but van Helvoort demonstrated that
      MDR1 P-glycoprotein translocates lipids from cytoplasmic to exoplasmic (flop,
      outward); UniProt's curated PE reaction (RHEA:36439) is also (in)->(out). Replace
      with phosphatidylethanolamine floppase activity (GO:0140341), which ABCB1 already
      carries from the same paper.
