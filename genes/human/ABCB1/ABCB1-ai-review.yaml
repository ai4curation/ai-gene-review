- term:
    id: GO:0006805
    label: xenobiotic metabolic process
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9748784
  qualifier: involved_in
  review:
    summary: >-
      ABCB1-mediated efflux is part of xenobiotic/drug disposition (ADME); the gene was
      placed in the broad xenobiotic metabolic process, but ABCB1 performs transport,
      not metabolism.
    action: MODIFY
    reason: >-
      A pure efflux transporter performs transport, not xenobiotic metabolism: ABCB1
      catalyses no metabolic (chemical) step on a xenobiotic, so GO:0006805 xenobiotic
      metabolic process over-attributes a metabolic role to a transporter (the same
      transporter-does-no-chemistry logic applied to ABCG2 and sphingolipid
      biosynthesis). ABCB1's actual contribution to xenobiotic disposition is
      ATP-driven export across the plasma membrane. Refine to GO:1990961 xenobiotic
      detoxification by transmembrane export across the plasma membrane, a transport
      process ABCB1 genuinely supports and already carries.
    proposed_replacement_terms:
    - id: GO:1990961
      label: xenobiotic detoxification by transmembrane export across the plasma membrane
