- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: IDA
  original_reference_id: PMID:19384922
  qualifier: involved_in
  review:
    summary: >-
      ABCB1 is a surface marker enriched on proliferating fetal neural
      stem/progenitor cells, but the study shows correlation with proliferation,
      not a mechanistic role of the efflux pump in the G2/M transition.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cited work shows that NSPCs expressing high ABCB1 are enriched for
      proliferating cells; it does not demonstrate that the ABC efflux pump performs
      any step of the mitotic G2/M transition. An efflux transporter being a marker
      of a proliferative state is an indirect correlation, not participation in the
      process, so this is an over-annotation rather than a core or non-core function.
    supported_by:
    - reference_id: PMID:19384922
      supporting_text: showed enrichment of proliferating cells
