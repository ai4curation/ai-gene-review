- id: PMID:24449431
  title: Two novel mutations in the BCKDK (branched-chain keto-acid dehydrogenase kinase) gene are responsible
    for a neurobehavioral deficit in two pediatric unrelated patients.
  findings:
  - statement: Two human BCKDK variants impair kinase expression or activity; patient-derived fibroblasts
      show reduced phosphorylated E1 alpha and increased BCKDH activity, supporting the inhibitory direction
      of BCKDK regulation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete normal abstract reports human pathogenic variants, loss of kinase activity
      and increased BCKDH-dependent catabolism. Normal cache is abstract-only; genotype-specific findings
      are not generalized to every allele.
  full_text_unavailable: true
