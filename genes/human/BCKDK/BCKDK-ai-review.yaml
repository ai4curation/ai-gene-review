id: O14874
gene_symbol: BCKDK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BCKDK is an ATP-dependent protein serine kinase that controls branched-chain amino acid utilization.
  In the mitochondrial matrix it associates with the branched-chain alpha-ketoacid dehydrogenase complex
  and phosphorylates its BCKDHA/E1 alpha subunit, inhibiting oxidative decarboxylation of branched-chain
  ketoacids. Loss of this inhibition increases amino acid breakdown and can cause depletion of circulating
  branched-chain amino acids with neurodevelopmental disease. BCKDK also phosphorylates ATP-citrate lyase
  at human Ser455; biochemical and rodent liver experiments connect this second activity to cytosolic
  lipid-synthesis regulation.
