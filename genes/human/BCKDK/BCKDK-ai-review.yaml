- id: PMID:29779826
  title: The BCKDH Kinase and Phosphatase Integrate BCAA and Lipid Metabolism via Regulation of ATP-Citrate
    Lyase.
  findings:
  - statement: BCKDK and PPM1K exert opposing phosphorylation and dephosphorylation activities on metabolic
      targets; the phosphatase chemistry is assigned to PPM1K.
  - statement: Purified human BCKDK phosphorylates human ACLY at Ser455. Distinct rat liver experiments
      connect BCKDK-dependent ACLY phosphorylation to increased lipid synthesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full-text Results and Methods establish direct BCKDK phosphorylation, distinguish
      PPM1K phosphatase, identify human BCKDK/ACLY constructs and separate human Ser455 from rat Ser454
      and rat liver physiology. Not a complete figure/supplement audit.
