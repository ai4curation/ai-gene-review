- id: PMID:37558654
  title: Small molecule branched-chain ketoacid dehydrogenase kinase (BDK) inhibitors with opposing effects
    on BDK protein levels.
  findings:
  - statement: BCKDK inhibitors modulate its association with the BCKDH E2 core. The reported thiophene
      and thiazole classes have different effects on binding and protein abundance, despite both inhibiting
      kinase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and selected Methods support the BCKDK inhibitor/BCKDH regulatory
      context. Thiophenes and thiazoles have opposite effects on association/protein abundance; no broad
      clinical conclusion is inferred.
- id: Reactome:R-HSA-5693148
  title: BCKDK phosphorylates BCKDH
  findings:
  - statement: The curated reaction records BCKDK-dependent phosphorylation and inactivation of the BCKDH
      complex, regulating branched-chain amino acid breakdown.
- id: Reactome:R-HSA-9912480
  title: BCKDK loss-of-function mutations do not phosphorylate BCKDH
  findings:
  - statement: This disease reaction describes BCKDK loss-of-function variants that reduce inhibitory
      BCKDHA phosphorylation and permit excessive branched-chain amino acid breakdown; it is a mutant
      context, not a normal activation reaction catalyzed by BCKDK.
- id: PMID:33773101
  title: BCKDK regulates the TCA cycle through PDC in the absence of PDK family during embryonic development.
  findings:
  - statement: In mouse embryos lacking the PDK family, BCKDK compensates in PDC regulation. Combined
      loss of Bckdk and the Pdk genes reduces PDC phosphorylation and increases PDC activity and pyruvate
      flux; the experiment does not establish constitutive human PDC regulation by BCKDK.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed identity and selected author-hosted primary manuscript Results, Figure5 caption,
      Methods and Discussion were read. Mouse PDK-deficient compensation is supported; physiological control
      in a PDK-intact human setting remains unresolved. No purified direct BCKDK-to-PDHA1 assay was identified
      in the inspected sections. The normal Source95 cache was subsequently imported unchanged and its
      exact metadata and complete abstract were read. It is PRIMARY_RESEARCH, full_text_available=false,
      with no PMC record recovered; this does not erase the separately inspected author-hosted manuscript
      sections or establish that a complete article is unavailable.
