- term:
    id: GO:0007283
    label: spermatogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q00972
  - ensembl:ENSRNOP00000069014
  review:
    summary: The spermatogenesis transfer requires more specific donor evidence.
    action: UNDECIDED
    reason: The electronic source traces to rat Bckdk Q00972. The indexed abstract of rat mutant study
      PMID:27472223 (a follow-up lead, not a cached reference) describes infertility together with systemic
      BCAA depletion, but its abstract does not establish the specific spermatogenic step performed by
      BCKDK. The original donor annotation history and relevant full experimental context were not reconstructed.
      Preserve the assertion pending that check rather than treat a pleiotropic phenotype as a core biochemical
      function.
- term:
    id: GO:0008610
    label: lipid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:29779826
  qualifier: involved_in
  review:
    summary: BCKDK-dependent ACLY phosphorylation can promote lipid synthesis.
    action: MODIFY
    reason: The cited study demonstrates direct ACLY phosphorylation by BCKDK, including human ACLY Ser455,
      and increased lipogenesis after kinase expression in rat liver. Positive regulation of lipid biosynthetic
      process better states the kinase action; BCKDK does not itself synthesize lipids. Human protein
      chemistry and rat physiological experiments are distinct evidence components.
    proposed_replacement_terms:
    - id: GO:0046889
      label: positive regulation of lipid biosynthetic process
