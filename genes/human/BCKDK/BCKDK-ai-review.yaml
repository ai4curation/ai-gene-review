- term:
    id: GO:0006550
    label: L-isoleucine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q00972
  - ensembl:ENSRNOP00000069014
  review:
    summary: BCKDK inhibits branched-chain amino acid breakdown through BCKDHA phosphorylation.
    action: MODIFY
    reason: BCKDK directly phosphorylates and inhibits BCKDHA; the BCKDH catalytic components execute
      the degradative reaction. Human BCKDK loss of function increases BCKDH activity and BCAA consumption
      (PMID:24449431). GO:0009083 denotes degradation itself, whereas GO:0045763 captures the demonstrated
      negative regulation. Inspection of the official AmiGO GO:0045763 child hierarchy and GO:0009083
      definition, together with targeted term-name searches on 2026-10-01, identified no branched-chain-specific
      negative-regulation term in the consulted ontology snapshot (AmiGO last loaded 2026-08-06). GO:0045763
      is therefore retained as the verified available regulatory term, with the BCAA-specific mechanism
      stated explicitly here and in the core description. This does not imply regulation of every amino
      acid pathway. Search scope and access limits are recorded in the notes; the term choice does not
      rely on its occurrence in the source annotations.
    additional_reference_ids:
    - PMID:24449431
    - Reactome:R-HSA-5693148
    proposed_replacement_terms:
    - id: GO:0045763
      label: negative regulation of amino acid metabolic process
