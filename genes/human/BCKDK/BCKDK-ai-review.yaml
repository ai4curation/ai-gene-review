- term:
    id: GO:0004722
    label: protein serine/threonine phosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:29779826
  qualifier: enables
  review:
    summary: The cited phosphatase chemistry belongs to PPM1K.
    action: REMOVE
    reason: The inspected Results and kinase-assay Methods of PMID:29779826 assign phosphate transfer
      to BCKDK and dephosphorylation to PPM1K. Purified MBP-BDK transfers radiolabel from ATP to ACL;
      V5-tagged BCKDK phosphorylates human ACLY Ser455. The human BCKDK construct is identified in Methods,
      so this conclusion does not rely on the title, abstract or a different-species assumption. GO:0004722
      requires hydrolytic removal of phosphate from protein serine/threonine. Assigning that opposite
      catalytic chemistry to BCKDK is inconsistent with the paper’s explicit enzyme attribution.
