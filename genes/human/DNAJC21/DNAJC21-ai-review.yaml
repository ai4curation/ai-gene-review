id: Q5F1R6
gene_symbol: DNAJC21
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAJC21 is a J-domain protein involved in large (60S) ribosomal subunit biogenesis through nucleolar
    RNA association and cytoplasmic cooperation with the Hsp70 chaperone HSPA8 and assembly factors
    PA2G4 and ZNF622. It associates with precursor 45S rRNA and supports PA2G4 recycling during
    subunit maturation. Its N-terminal J domain contains the conserved HPD motif, and the protein
    contains two C2H2 zinc fingers. DNAJC21 occupies nucleolar and cytosolic pools and redistributes
    toward the nucleus when ribosomal RNA synthesis is inhibited. Alternative transcripts encode
    three predicted protein isoforms that differ between the zinc fingers. Biallelic pathogenic
    variants cause a cancer-prone bone marrow failure syndrome associated with defective ribosome
    biogenesis.
alternative_products:
- name: '1'
  id: Q5F1R6-1
  description: The canonical product contains 531 residues, an N-terminal J domain (3–69), and annotated
    zinc fingers at 314–338 and 482–506. The historical 531-residue clone has a documented residue-509
    sequence conflict; its length does not establish exact identity to the current sequence.
- name: '2'
  id: Q5F1R6-2
  sequence_note: VSP_024005
  description: This 576-residue product replaces canonical Q395 with a 46-residue segment (VSP_024005),
    adding 45 residues between the zinc fingers. The J domain is retained. Product-specific localization
    or ribosome-assembly activity has not been established by the cited assays.
- name: '3'
  id: Q5F1R6-3
  sequence_note: VSP_024004
  description: This 544-residue product replaces canonical K381 with a 14-residue segment (VSP_024004),
    adding 13 residues between the zinc fingers. The J domain is retained. Product-specific localization
    or ribosome-assembly activity has not been established by the cited assays.
