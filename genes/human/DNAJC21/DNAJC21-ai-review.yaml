suggested_questions:
- question: Does purified human DNAJC21 stimulate HSPA8 ATPase turnover, and is this required for
    PA2G4 release from assembling ribosomal subunits?
- question: Do the 45-residue and 13-residue insertions in the alternative DNAJC21 products alter
    RNA association, localization or assembly-factor interactions?
- question: What target-specific ribosome-localization evidence underlies the historical NAS assertion from
      PMID:16952052?
suggested_experiments:
- description: Reconstitute human DNAJC21–HSPA8 with wild-type and P32A proteins, measuring ATP turnover
    and PA2G4 release separately with matched controls. Distinguish binding from ATPase activation.
- description: Compare the three sequence-verified natural products in matched-expression rescue
    and RNA-contact assays, separating UV-dependent contact from native co-immunoprecipitation.
