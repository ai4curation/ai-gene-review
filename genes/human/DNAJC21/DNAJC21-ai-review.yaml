  review:
    summary: The broad folding assertion is retained as contextual co-chaperone participation in multisubunit
        assembly.
    action: KEEP_AS_NON_CORE
    reason: 'GO:0006457 includes assistance with assembly of multisubunit complexes into correct structure.
        Independent human evidence in PMID:27346687 supports DNAJC21 as a co-chaperone/assembly factor:
        nuclease-resistant HSPA8/PA2G4/ZNF622 association, selective P32A loss of HSPA8 association,
        altered PA2G4 retention and traffic after DNAJC21 loss, and restoration of traffic by wild-type
        DNAJC21. Together with the existing curated assertion, this supports retaining the broad folding
        term as non-core assembly context. HSPA8 binding alone would not establish protein folding,
        and no defined folding substrate, purified refolding reaction, direct human ATPase stimulation
        or reconstituted PA2G4 release was measured. The more informative structured core process is
        large-subunit biogenesis. The target-specific full text of the original NAS reference PMID:16952052
        remains inaccessible; that access limit is not treated as overriding the independent positive
        assembly evidence.'
    supported_by:
