core_functions:
- description: 'Hsp70-partner activity in cytoplasmic 60S subunit maturation: DNAJC21 associates
    with HSPA8, PA2G4 and ZNF622 in nuclease-treated human lysates, and the P32A HPD-loop mutation
    selectively impairs HSPA8 association. DNAJC21 loss perturbs PA2G4 traffic, with excess PA2G4
    in 60S/80S fractions of affected-individual cells; wild-type re-expression restores that traffic.
    Together, these observations support a co-chaperone/assembly-factor contribution to large-subunit
    biogenesis. They do not directly measure human HSPA8 ATPase stimulation or reconstituted PA2G4
    release, establish a purified binary interface, or define fixed complex stoichiometry.'
  molecular_function:
    id: GO:0030544
    label: Hsp70 protein binding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:27346687
    supporting_text: impairment in interactions with cofactors (PA2G4, HSPA8, and ZNF622)
  directly_involved_in:
  - id: GO:0042273
    label: ribosomal large subunit biogenesis
- description: 'RNA association during ribosome biogenesis: DNAJC21 associates with precursor 45S
    rRNA in nuclear extracts and occupies a nucleolar pool. Independent UV-dependent mRNA capture
    supports RNA-contact capacity, while the native rRNA co-IP does not establish purified sequence-specific
    recognition or RNA cleavage.'
  molecular_function:
