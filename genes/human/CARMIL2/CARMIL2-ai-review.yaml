    label: extrinsic component of cytoplasmic side of plasma membrane
  - id: GO:0045111
    label: intermediate filament cytoskeleton
  supported_by:
  - reference_id: PMID:26466680
  - reference_id: PMID:26578515
- description: Organizes noncatalytic coupling of CD28 co-stimulation to CARD11-dependent NF-kappaB signaling
    in lymphocytes. This gene-level function is supported for signaling-competent splice forms, including
    the predominant 1399-residue leukocyte form described in PMID:36515678; the longest 1435-residue form
    did not rescue that pathway in the tested system. The immune-adaptor role is separable from CP binding.
    Signaling-complex association does not establish every direct binary contact or membership in the
    CARD11-BCL10-MALT1 complex.
  molecular_function:
