  review:
    
    summary: CARMIL2 directly inhibits the actin-capping-protein complex through its CP-binding region.
    action: MODIFY
    reason: The original complex-binding assertion is sound, but the same primary study establishes a molecular
      regulatory activity beyond association. Purified human CARMIL2 CBR (the study construct residues 961–1072)
      relieves CP-mediated inhibition of seeded actin polymerization and promotes uncapping when added after
      CP; the RR985/987AA mutant loses these effects. Full-length wild-type, but not mutant, CARMIL2 coprecipitates
      CP from HT1080 cells. GO:0140678 captures direct noncovalent inhibition of a target activity without
      implying that CP is an enzyme or that CARMIL2 itself caps actin. A proposed CP-specific child term
      records the remaining ontology specificity gap. The biochemical result is from the isolated CBR, not
      a claim that every whole-protein cellular role is inhibitory or CP-dependent.
    supported_by:
    - reference_id: PMID:26466680
    proposed_replacement_terms:
    - id: GO:0140678
      label: molecular function inhibitor activity
