core_functions:

- description: Directly inhibits the actin-capping-protein heterodimer through noncovalent binding, reducing
    CP-mediated barbed-end capping and promoting uncapping in purified CBR assays. Membrane and vimentin-associated
    localization coordinates this regulation with polarized protrusions; direct binary binding to vimentin
    is not established. The existing molecular-function inhibitor term captures the demonstrated activity,
    while the proposed CP-specific child term supplies its missing target specificity. CARMIL2 modulates
    CP activity rather than eliminating every CP function, and collective migration can be rescued independently
    of CP binding.
  molecular_function:
    id: GO:0140678
    label: molecular function inhibitor activity
  directly_involved_in:
  - id: GO:2000813
    label: negative regulation of barbed-end actin filament capping
  - id: GO:0051639
    label: actin filament network formation
  locations:
