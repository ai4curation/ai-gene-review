gene_symbol: CARMIL2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CARMIL2 is a multidomain cytoskeletal regulator and signaling adaptor. It binds the actin-capping-protein
  heterodimer and modulates barbed-end capping, helping organize peripheral actin networks. Distinct regions
  support peripheral membrane association and localization along vimentin intermediate filaments. In human
  cultured cells, these activities contribute to polarized protrusions, collective migration and invadopodia.
  Signaling-competent splice forms in lymphocytes also organize CD28-dependent signaling to CARD11 and
  NF-kappaB through a function separable from capping-protein binding. The predominant leukocyte splice
  form differs from the longest reported product. Biallelic loss of CARMIL2 causes combined immunodeficiency
  with defects extending beyond CD28 responses.
