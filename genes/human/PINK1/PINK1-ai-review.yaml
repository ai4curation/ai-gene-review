- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: EXP
  original_reference_id: PMID:15087508
  qualifier: located_in
  review:
    summary: On depolarized mitochondria, PINK1 import is blocked and full-length PINK1 accumulates at
      the TOM complex on the outer membrane, with its kinase domain facing the cytosol.
    action: ACCEPT
    reason: Core functional location.
    supported_by:
    - reference_id: PMID:18687899
      supporting_text: We show here that this mitochondrial protein exhibits a topology in which the kinase
        domain faces the cytoplasm and the N-terminal tail is inside the mitochondria.
    - reference_id: PMID:22354088
      supporting_text: However, when mitochondrial import is compromised by depolarization, PINK1 accumulates
        on the mitochondrial surface where it recruits the PD-linked E3 ubiquitin ligase Parkin from the
        cytosol, which in turn mediates the autophagic destruction of the dysfunctional organelles.
