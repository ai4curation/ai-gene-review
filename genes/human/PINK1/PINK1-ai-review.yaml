id: Q9BXM7
gene_symbol: PINK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PINK1 (PTEN-induced kinase 1) is a mitochondrially targeted Ser/Thr protein kinase. Mutations
  in PINK1 cause autosomal recessive early-onset Parkinson disease (PARK6). PINK1 has an N-terminal mitochondrial
  targeting sequence, a single transmembrane segment and a C-terminal kinase domain with distinctive inserts.
  It acts as a sensor of mitochondrial damage. In healthy, polarized mitochondria the PINK1 precursor
  is imported through TOM/TIM23 and cleaved by MPP and the inner-membrane rhomboid protease PARL. The
  resulting fragment is released to the cytosol and degraded by the proteasome, so steady-state levels
  are very low. When import is blocked by loss of membrane potential or protein misfolding, full-length
  PINK1 accumulates at the TOM complex on the outer membrane with its kinase domain facing the cytosol,
  dimerizes and autophosphorylates. It then phosphorylates ubiquitin at Ser65 (including ubiquitin already
  conjugated to outer-membrane proteins) and Ser65 in the ubiquitin-like domain of the E3 ligase Parkin
  (PRKN). Phospho-ubiquitin recruits Parkin and, together with Ubl phosphorylation, relieves Parkin autoinhibition.
  The resulting feed-forward loop coats damaged mitochondria with phospho-ubiquitin chains that recruit
  autophagy receptors (OPTN, NDP52/CALCOCO2), leading to mitophagy. PINK1 also phosphorylates other substrates,
  including the mitochondrial chaperone TRAP1, the Miro GTPases (arresting mitochondrial transport) and
  DRP1 (Ser616, promoting fission). It contributes to mitochondria-derived vesicle trafficking and has
  broad neuroprotective, anti-apoptotic effects.
