  review:
    summary: PINK1 is the upstream kinase of PINK1/Parkin-mediated mitophagy. It accumulates on depolarized
      mitochondria and recruits and activates Parkin, and PD-associated PINK1 mutations compromise mitophagy.
    action: ACCEPT
    reason: Core process, supported by multiple IMP studies and the IBA.
    supported_by:
    - reference_id: PMID:22354088
      supporting_text: However, when mitochondrial import is compromised by depolarization, PINK1 accumulates
        on the mitochondrial surface where it recruits the PD-linked E3 ubiquitin ligase Parkin from the
        cytosol, which in turn mediates the autophagic destruction of the dysfunctional organelles.
    - reference_id: PMID:20798600
      supporting_text: Moreover, disease-associated PINK1 mutations also compromise the selective degradation
        of depolarized mitochondria.
    - reference_id: PMID:24896179
      supporting_text: Here we report that USP30, a deubiquitinase localized to mitochondria, antagonizes
        mitophagy driven by the ubiquitin ligase parkin (also known as PARK2) and protein kinase PINK1,
        which are encoded by two genes associated with Parkinson's disease.
