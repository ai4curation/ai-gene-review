core_functions:
- description: Damage-sensing ubiquitin and Parkin kinase. On depolarized or import-defective mitochondria,
    full-length PINK1 is stabilized at the outer-membrane TOM complex and phosphorylates Ser65 of ubiquitin
    (free and chain-incorporated) and of the Parkin Ubl domain. This recruits and activates Parkin and
    drives a feed-forward phospho-ubiquitin signal that initiates mitophagy.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0000423
    label: mitophagy
  - id: GO:0031398
    label: positive regulation of protein ubiquitination
  - id: GO:0070585
    label: protein localization to mitochondrion
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:24751536
    supporting_text: Using mass spectrometry, we discovered that endogenous PINK1 phosphorylated ubiquitin
      at serine 65, homologous to the site phosphorylated by PINK1 in Parkin's ubiquitin-like domain.
  - reference_id: PMID:24660806
    supporting_text: Remarkably, PINK1 directly phosphorylates Ser65 of ubiquitin in vitro.
  - reference_id: PMID:24751536
    supporting_text: Recombinant TcPINK1 directly phosphorylated ubiquitin and phospho-ubiquitin activated
      Parkin E3 ubiquitin ligase activity in cell-free assays.
  - reference_id: PMID:22354088
    supporting_text: However, when mitochondrial import is compromised by depolarization, PINK1 accumulates
      on the mitochondrial surface where it recruits the PD-linked E3 ubiquitin ligase Parkin from the
      cytosol, which in turn mediates the autophagic destruction of the dysfunctional organelles.
  - reference_id: PMID:25474007
    supporting_text: Here we report that Ser65 in polyUb chain is also phosphorylated by PINK1, and that
      phosphorylated polyUb chain on mitochondria tethers Parkin at mitochondria.
- description: Phosphorylation of additional mitochondrial-quality-control substrates. PINK1 phosphorylates
    Miro (triggering its Parkin-dependent degradation and arresting mitochondrial movement), DRP1 Ser616
    (promoting fission) and TRAP1 (protecting against oxidative-stress-induced cytochrome c release).
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0006468
    label: protein phosphorylation
  locations:
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:22078885
    supporting_text: PINK1 phosphorylates Miro, a component of the primary motor/adaptor complex that
      anchors kinesin to the mitochondrial surface.
  - reference_id: PMID:32484300
    supporting_text: We here demonstrate that PINK1 directly phosphorylates Drp1 on S616.
  - reference_id: PMID:17579517
    supporting_text: PINK1 binds and colocalizes with TRAP1 in the mitochondria and phosphorylates TRAP1
      both in vitro and in vivo.
  - reference_id: PMID:17579517
    supporting_text: We show that PINK1 protects against oxidative-stress-induced cell death by suppressing
      cytochrome c release from mitochondria, and this protective action of PINK1 depends on its kinase
      activity to phosphorylate TRAP1.
proposed_new_terms: []
suggested_questions:
- question: Which outer-membrane ubiquitinated proteins are the physiologically dominant PINK1 phospho-ubiquitin
    substrates in neurons in vivo, where basal PINK1-dependent mitophagy appears minor?
- question: How significant are the non-mitophagy PINK1 substrates (TRAP1, Miro, DRP1, complex I subunits)
    compared with ubiquitin/Parkin in protecting dopaminergic neurons?
suggested_experiments:
- hypothesis: PINK1-dependent ubiquitin Ser65 phosphorylation in dopaminergic neurons is triggered by
    physiological stress (e.g. exercise, inflammation, mtDNA stress) and is required for neuronal survival
    with age.
  description: Quantify pSer65-ubiquitin in sorted dopaminergic neurons of wild-type, PINK1-KO and PINK1
    kinase-dead knock-in mice under defined stresses, and correlate with mito-QC mitophagy reporters and
    neuron survival.
  experiment_type: in vivo phosphoproteomics and mitophagy reporter imaging
