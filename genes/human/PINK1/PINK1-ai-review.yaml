- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: EXP
  original_reference_id: PMID:24751536
  qualifier: enables
  review:
    summary: PINK1 is a Ser/Thr kinase that phosphorylates ubiquitin and Parkin at Ser65 (and Miro, TRAP1,
      DRP1).
    action: ACCEPT
    reason: Core molecular function, supported by direct biochemistry and the IBA.
    supported_by:
    - reference_id: PMID:24751536
      supporting_text: Using mass spectrometry, we discovered that endogenous PINK1 phosphorylated ubiquitin
        at serine 65, homologous to the site phosphorylated by PINK1 in Parkin's ubiquitin-like domain.
    - reference_id: PMID:24660806
      supporting_text: stimulates the Parkin E3 ligase by phosphorylating Ser65 within its Ubl (ubiquitin-like)
        domain
    - reference_id: PMID:25474007
      supporting_text: Here we report that Ser65 in polyUb chain is also phosphorylated by PINK1, and
        that phosphorylated polyUb chain on mitochondria tethers Parkin at mitochondria.
    - reference_id: PMID:24784582
      supporting_text: PINK1 is a Ser/Thr kinase that specifically accumulates on depolarized mitochondria,
        whereas parkin is an E3 ubiquitin ligase that catalyses ubiquitin transfer to mitochondrial substrates.
