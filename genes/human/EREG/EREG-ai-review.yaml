    action: ACCEPT
    summary: Binding EGFR is the core molecular function of epiregulin.
    reason: The ancestral EGF-family node is well placed, and human epiregulin has its own
      direct binding evidence, including a crystal structure of the EGFR extracellular
      region bound to epiregulin.
    supported_by:
