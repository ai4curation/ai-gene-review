      supporting_text: Epiregulin binds to epidermal growth factor receptor and ErbB-4 and
        induces tyrosine phosphorylation of epidermal growth factor receptor, ErbB-2,
        ErbB-3 and ErbB-4.
    - reference_id: PMID:28988771
      supporting_text: Using crystallography and other approaches, we show how the EGFR
        ligands epiregulin (EREG) and epigen (EPGN) stabilize different dimeric
        conformations of the EGFR extracellular region.
