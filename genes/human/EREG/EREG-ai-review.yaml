id: O14944
gene_symbol: EREG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Epiregulin is a member of the epidermal growth factor family. It is made as
  proepiregulin, a single-pass type I membrane precursor whose EGF-like domain faces the
  extracellular space, and is then shed to release the soluble mature growth factor.
  Epiregulin binds and activates EGFR and ERBB4, inducing tyrosine phosphorylation of
  EGFR, ERBB2, ERBB3 and ERBB4 through receptor homodimers and heterodimers, and it
  stabilises a distinct EGFR dimer conformation from that induced by EGF, which gives it
  different signalling kinetics. It acts as an autocrine and paracrine mitogen for
  keratinocytes, fibroblasts and vascular smooth muscle cells, contributes to wound
  repair and inflammation, and in the ovary mediates luteinizing-hormone-driven cumulus
  expansion and oocyte maturation. Expression is low in normal adult tissues apart from
  placenta and peripheral blood leukocytes, and high in several carcinomas.
