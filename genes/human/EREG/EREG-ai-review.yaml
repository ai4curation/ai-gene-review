core_functions:
- description: Agonist ligand of EGFR and ERBB4. The shed, soluble growth factor binds the
    receptor ectodomain, stabilises a receptor dimer and activates the receptor tyrosine
    kinase, inducing tyrosine phosphorylation of EGFR, ERBB2, ERBB3 and ERBB4 and
    triggering mitogenic signalling in keratinocytes, fibroblasts and vascular smooth
    muscle cells.
  molecular_function:
    id: GO:0005154
    label: epidermal growth factor receptor binding
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0007173
    label: epidermal growth factor receptor signaling pathway
  - id: GO:0008284
    label: positive regulation of cell population proliferation
  supported_by:
  - reference_id: PMID:9419975
    supporting_text: Epiregulin binds to epidermal growth factor receptor and ErbB-4 and
      induces tyrosine phosphorylation of epidermal growth factor receptor, ErbB-2,
      ErbB-3 and ErbB-4.
  - reference_id: PMID:28988771
    supporting_text: Using crystallography and other approaches, we show how the EGFR
      ligands epiregulin (EREG) and epigen (EPGN) stabilize different dimeric
      conformations of the EGFR extracellular region.
  - reference_id: PMID:10681561
    supporting_text: Epiregulin stimulated human keratinocyte proliferation under both
      subconfluent and confluent culture conditions in the absence of exogenous EGF family
      growth factors.
- description: Activator of transmembrane receptor tyrosine kinases. Beyond simple
    binding, epiregulin switches the receptor into its active state and sustains ERK and
    p38 signalling, which is why it drives wound closure more strongly than EGF despite
    lower receptor affinity.
  molecular_function:
    id: GO:0030297
    label: transmembrane receptor protein tyrosine kinase activator activity
  locations:
  - id: GO:0005576
    label: extracellular region
  directly_involved_in:
  - id: GO:0045860
    label: positive regulation of protein kinase activity
  supported_by:
  - reference_id: PMID:9556621
    supporting_text: Activation of ErbB4 by the bifunctional epidermal growth factor family
      hormone epiregulin is regulated by ErbB2.
  - reference_id: PMID:12898511
    supporting_text: Epiregulin is more potent than EGF or TGFalpha in promoting in vitro
      wound closure due to enhanced ERK/MAPK activation.
suggested_questions:
- question: How much epiregulin signalling in vivo comes from the shed soluble ligand
    versus juxtacrine presentation by membrane-anchored proepiregulin?
- question: What determines whether epiregulin stimulates or inhibits proliferation in a
    given cell type, and how much of that is set by the ERBB2 and ERBB4 complement?
- question: Does the distinct EGFR dimer conformation stabilised by epiregulin explain its
    greater potency in wound closure relative to its lower receptor affinity?
suggested_experiments:
- hypothesis: Membrane-anchored proepiregulin signals juxtacrine to neighbouring cells
    independently of shedding.
  description: Express a shedding-resistant proepiregulin in co-culture with reporter cells
    lacking EREG and measure EGFR phosphorylation in the neighbours, with and without
    metalloprotease inhibition.
- hypothesis: The epiregulin-specific EGFR dimer geometry produces sustained rather than
    transient ERK signalling.
  description: Compare receptor dimer lifetime by single-molecule imaging and ERK dynamics
    by live reporter in cells stimulated with equipotent doses of epiregulin and EGF.
- hypothesis: Epiregulin's growth-inhibitory effect on some epithelial cells requires
    ERBB4 rather than EGFR.
  description: Titrate epiregulin on isogenic lines differing only in ERBB4 and ERBB2
    expression and measure proliferation, receptor phosphorylation and target-gene output
    for each receptor combination.
