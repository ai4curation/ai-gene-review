- gene: APOB
  rules:
  - DTM2:0002
  - DTM2:0003
  disposition: MODEL_COUNTEREXAMPLE
  assessment: 114 predicted beta strands and a chloroplast outer membrane label disagree with human apoB100
    lipoprotein-surface architecture. The taxon conflict is definitive; the structural interpretation
    concerns the LDL-associated form, not every biosynthetic intermediate.
  evidence:
  - PMID:39662503
  - PMID:39663455
  - https://doi.org/10.1038/s41586-024-08467-w
  next_action: Reject the chloroplast prediction; do not reinterpret the lipoprotein beta belt as a bilayer-spanning
    barrel or negate lipid association.
- gene: ATP5PF
  rules:
  - FRR:0004
  disposition: COMPLEX_ROLE_REVIEW
  assessment: The peripheral stalk contributes to ATP synthase; absence of a span concerns autonomous
    proton conduction, not contribution to the pump. Existing review already marks the broad activity
    over-annotated.
  evidence:
  - genes/human/ATP5PF/ATP5PF-ai-review.yaml
  next_action: Review relation and complex scope; no gene-wide NOT transport.
