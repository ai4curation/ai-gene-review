adjudication:
- gene: AIFM2
  rules:
  - DTM2:0002
  disposition: SOURCE_TOPOLOGY_REVIEW
  assessment: UniProt annotates a span at 7-27 but the model calls the entire chain globular; the review
    describes myristoylation-dependent membrane recruitment. Myristoylation alone does not exclude a span.
  evidence:
  - genes/human/AIFM2/AIFM2-ai-review.yaml
  - PMID:31634899
  - PMID:31634900
  next_action: Check the N-terminal anchor against structural/topology evidence; retain lipid-droplet
    association.
- gene: AKR1C4
  rules:
  - FRR:0004
  disposition: EXISTING_REVIEW_AGREES
