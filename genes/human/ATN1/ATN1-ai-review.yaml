id: P54259
gene_symbol: ATN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Atrophin-1 is a broadly expressed transcriptional coregulator with nuclear and cytoplasmic
  pools. Its transcriptional corepressor activity is enhanced by ETO/MTG8, and it can associate with nuclear-matrix
  structures containing corepressor machinery. Context-dependent coactivation is reported for the mouse
  ortholog. Atrophin proteins also associate with FAT1 and contribute to directional migration in vascular
  smooth muscle cells. Expansion of the ATN1 polyglutamine tract causes dentatorubral-pallidoluysian atrophy,
  with altered protein processing, localization and cellular toxicity.
