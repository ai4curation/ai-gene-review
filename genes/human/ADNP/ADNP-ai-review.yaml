        source_label: rat Adnp (ADNP_RAT, Swiss-Prot, 1103 aa) - the true ortholog
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Correct ortholog, and rats do have an estrous cycle, so the term is at least applicable
