- term:
    id: GO:0090575
    label: RNA polymerase II transcription regulator complex
  evidence_type: IDA
  original_reference_id: PMID:29795351
  qualifier: part_of
  review:
    summary: 'Accepted and core. This is the only direct human experimental annotation ADNP has, and it
      records the right thing: ADNP is a subunit of a stable transcription-regulatory complex, ChAHP,
      that it also targets to DNA.'
    action: ACCEPT
    reason: 'ChAHP is ADNP plus CHD4 plus HP1, purified as a stable complex and shown to repress lineage-specifying
      genes at ADNP-defined motifs; GO:0090575 is ''a transcription factor complex that acts at a regulatory
      region of a gene transcribed by RNA polymerase II'', which fits. The one reservation is granularity
      rather than correctness: GO has no ChAHP term, and neither does the Complex Portal, so the general
      parent is currently the most specific available. That gap is filed under proposed_new_terms rather
      than treated as a curation error. The complex composition used here is taken from the primary papers
      rather than from the affinage deep-research record, which states it wrongly; that defect is recorded
      in the affinage reference''s reference_review rather than quoted here, because supported_by should
      carry evidence FOR an annotation and a statement this review rejects does not belong in it.'
    supported_by:
    - reference_id: PMID:29795351
      supporting_text: "ADNP interacts with the chromatin remodeller CHD4 and the chromatin \narchitectural\
        \ protein HP1 to form a stable complex, which we refer to as ChAHP."
    - reference_id: PMID:38960717
      supporting_text: We previously discovered ChAHP, a protein complex with repressive activity against
        short interspersed element (SINE) retrotransposons that is composed of the transcription factor
        ADNP, chromatin remodeler CHD4, and HP1 proteins.
- term:
    id: GO:0000785
    label: chromatin
  evidence_type: ISA
  original_reference_id: GO_REF:0000113
  qualifier: located_in
  supporting_entities:
  - tfclass:3.1.8
  review:
    summary: 'Accepted and core. ADNP is chromatin-bound: it recognises DNA motifs, is recovered by ChIP
      at promoters and by ChIP-seq genome-wide, and establishes inaccessible chromatin at its binding
      sites.'
    action: ACCEPT
    reason: 'The route is a TFClass classification (GO_REF:0000113, class 3.1.8 - homeodomain factors),
      which is a sequence-alignment inference and would be thin support on its own. It happens to land
      on a well-measured fact: ADNP chromatin association is established directly in mouse and in the
      ChAHP studies, and human ADNP holds GO:0090575 by IDA. Chromatin is the informative location term
      for this gene and is carried in core_functions.'
    supported_by:
    - reference_id: PMID:29795351
      supporting_text: "ChAHP-mediated repression, however, acts in a locally restricted manner by \n\
        establishing inaccessible chromatin around its DNA-binding sites and does not \ndepend on H3K9me3-modified\
