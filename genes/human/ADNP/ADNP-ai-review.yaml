- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:29795351
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q13185
  review:
    summary: Bare protein binding replaced by the informative term. The partner is CBX3/HP1gamma (UniProtKB:Q13185),
      a reviewed canonical Swiss-Prot entry, and the interaction is the HP1 arm of the ChAHP complex.
    action: MODIFY
    reason: 'The ChAHP paper itself. This is the row that turns a recurring co-purification into a defined
      stoichiometric complex with a mapped function. ADNP binds all three human HP1 paralogues (CBX5/HP1alpha,
      CBX1/HP1beta, CBX3/HP1gamma). This is not a single unreplicated screen hit: eight distinct GOA rows
      across seven independent publications record it, and the definitive mechanistic study shows HP1
      is a stoichiometric subunit of the ADNP-containing ChAHP complex. Proteins generally engage HP1
      through a PxVxL motif that docks on the chromo shadow domain, and ADNP''s C-terminal PxVxL is conserved
      down to its paralogue ADNP2. A committed scan (ADNP-bioinformatics/analyze_compara_donors.py) places
      the single P.V.[LMIV] match in Q9H2P0 at PGVLL, residues 820-824, immediately C-terminal to the
      homeobox - but that same scan reports 0.76 matches expected by chance under the protein''s own residue
      composition, so finding one is what chance predicts and its uniqueness is NOT evidence. The weight
      rests on the ADNP-to-ADNP2 conservation and on all three HP1 paralogues binding. GO:0070087 chromo
      shadow domain binding is therefore the informative replacement for bare protein binding. What has
      NOT been done is a point mutation of ADNP''s PxVxL showing loss of HP1 binding, so the chromo-shadow-domain
      assignment is an inference from motif plus paralogue-wide binding, not a mapped interaction surface;
      this is recorded as a knowledge gap.'
