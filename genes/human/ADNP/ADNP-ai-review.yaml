- term:
    id: GO:0005507
    label: copper ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9JKL8
  - ensembl:ENSRNOP00000014595
  review:
    summary: No evidence that ADNP binds copper. The rat donor IDA comes from a study of the synthetic
      NAP peptide inhibiting beta-amyloid aggregation, and copper does not appear in that paper's abstract
      at all.
    action: REMOVE
    reason: 'Two independent grounds. First, the assayed entity is wrong: PMID:14706557 measures what
      the eight-residue NAP peptide does to Abeta aggregation and the only binding it reports is biotin-NAP
      binding Abeta. Second, the term is unsupported even for the peptide as far as the abstract goes
      - the paper is about Abeta fibril formation, and I could not verify any copper measurement (the
      cached record has full_text_available: false, so I state what the abstract supports and no more).
      ADNP''s only annotated metal-binding feature is nine C2H2 zinc fingers, which coordinate zinc, not
      copper; UniProt''s metal keywords are Zinc and Zinc-finger with no copper keyword. A molecular-function
      claim of this kind reaching a human gene through a peptide-pharmacology paper is exactly the sort
      of row that should not survive. NAP (NAPVSIPQ, UniProt REGION 354..361, also called davunetide)
      is an eight-residue segment of ADNP that is potently neuroprotective when supplied to cells or animals
      as a synthetic peptide. No protease has been shown to release it from the full-length protein, so
      a pharmacological property of the free peptide is not by itself a property of the ADNP gene product.
      Route: rat Adnp (Q9JKL8) -> human ADNP by Ensembl Compara (GO_REF:0000107). The donor''s own annotation,
      its primary reference and the entity that reference actually assayed are tabulated in ADNP-bioinformatics/RESULTS.md,
      computed from QuickGO and PubMed rather than hand-assigned.'
    supported_by:
    - reference_id: PMID:14706557
      supporting_text: Further assays showed biotin-NAP binding to Abeta.
    - reference_id: PMID:14706557
      supporting_text: "Here, NAP was shown to \ninhibit Abeta aggregation using: (1) fluorimetry; (2)\
        \ electron microscopy; (3) \nhigh-throughput screening of Abeta deposition onto a synthetic template\
        \ \n(synthaloid); and (4) Congo Red staining of neurons."
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: UniProtKB:Q9JKL8
        source_label: rat Adnp (ADNP_RAT, Swiss-Prot, 1103 aa) - the true ortholog
        source_status: SOURCE_BAD
        comment: Rat Adnp is the correct ortholog and the donor annotation is a real curated experimental
          annotation; what does not transfer is the identity of the assayed molecule. The cited experiment
          manipulated the synthetic ADNP-derived peptide, not the ADNP gene product.
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q9JKL8
  - ensembl:ENSRNOP00000014595
  review:
    summary: Over-annotated. The rat donor did measure the ADNP protein, but the extracellular claim rests
      on a single 1.4-fold rise in immunoreactivity in astrocyte-conditioned medium, detected with an
      antibody raised against the NAP epitope, in a protein that has no signal peptide and whose UniProt
      subcellular location is nucleus and chromosome only.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Unlike the rest of the rat block this donor is a genuine protein measurement, so the objection
      is different in kind. PMID:16845437 fractionated astrocytes and found ADNP immunoreactivity in nucleus
      and cytoplasm, with a roughly 1.4-fold increase in the extracellular milieu after VIP treatment.
      Three things keep this from supporting a human extracellular-region annotation. Human ADNP has no
      SIGNAL feature - the UniProt FT table runs CHAIN 1..1102 with no cleaved leader - and no non-classical
      secretion mechanism has been proposed. UniProt records only Nucleus and Chromosome as subcellular
      locations. And the detecting antibody, alpha-CNAP, was raised against the NAP fragment, so the signal
      it reports in conditioned medium does not distinguish full-length ADNP from a NAP-containing fragment.
      Not removed, because a real measurement on the real protein sits behind it. Housekeeping note: this
      row is the successor of GO:0005615 extracellular space, which was obsoleted on 2026-03-06 and replaced
      by GO:0005576 - the UniProt cross-reference list still shows the old id.'
    supported_by:
    - reference_id: PMID:16845437
      supporting_text: "In addition, ADNP-like immunoreactivity in the extracellular milieu of astrocytes\
        \ \nincreased by approximately 1.4 fold after incubation of the astrocytes with VIP."
    - reference_id: PMID:16845437
      supporting_text: "Here, we investigate the subcellular localization of ADNP through cell \nfractionation,\
        \ gel electrophoresis, immunoblotting and immunocytochemistry using \nalpha-CNAP, an antibody\
        \ directed to the neuroprotective NAP fragment that \nconstitutes part of an N-terminal epitope\
        \ of ADNP."
