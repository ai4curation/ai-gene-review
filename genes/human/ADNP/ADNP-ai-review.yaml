suggested_questions:
- question: For ADNP annotations derived from NAP treatments, which assays distinguish native
    full-length protein, an endogenous processed product and an administered synthetic fragment? The
    stored donor mapping identifies the source papers, but its abstract classifier cannot adjudicate
    all of their experimental coverage. Can the original donor curators resolve the undecided
    transfers using the full methods?
  experts:
  - RGD GO curators
  - GO Central
  - Ensembl Compara / GOA
- question: Can estrous-cycle orthology projections be restricted so that a rat process defined by
    endometrial resorption is not transferred to human proteins? The broad Theria constraint does
    not encode the distinction from menstruation.
  experts:
  - GO ontology editors
  - Ensembl Compara / GOA
- question: Which current complex representation best distinguishes ChAHP from ChAHP2 and
    accommodates its Pol II and Pol III regulatory contexts? The existing Pol II regulator-complex
    annotation is valid for that output, while the named complex also has other transcriptional
    roles.
  experts:
  - Complex Portal curators
  - GO ontology editors
- question: "Which cell-state features determine whether ADNP stabilizes beta-catenin during mouse\
  \ neural differentiation or attenuates WNT output in human colorectal cancer and\
  \ Wnt3a-stimulated human neural progenitors?"
  experts:
  - ADNP researchers
  - Wnt signaling curators
suggested_experiments:
- hypothesis: HP1-paralog usage and sequence-specific DNA targeting determine different ADNP
    chromatin distributions in human cells.
  description: Build on existing ADNP/HP1 interface mutagenesis by measuring endogenous human ADNP
    occupancy, CHD4 recruitment and repeat transcription after targeted interface perturbation in
    neural progenitors. Compare HP1-dependent heterochromatin sites with sequence-dependent sites,
    with matched expression and protein stability controls.
  experiment_type: targeted perturbation and chromatin profiling
- hypothesis: Endogenous ADNP molecular forms explain some, but not necessarily all, biological
    activities modeled by NAP treatment.
  description: Combine intact-protein analysis and targeted peptidomics of cells and conditioned
    medium with isotope-labeled NAP standards and appropriate recovery controls. Relate any detected
    species to loss and rescue of native ADNP. Failure to detect a peptide in one context would
    bound that context rather than establish universal absence.
  experiment_type: proteomics and functional rescue
- hypothesis: The methyltransferase activity measured in ADNP immunoprecipitates is intrinsic to
    ADNP.
  description: Test compositionally defined recombinant ADNP preparations with substrate/product
    measurements, appropriate enzyme-free controls and targeted candidate-site mutants. Separate
    ADNP catalysis from activity supplied by associated proteins before assigning a
    methyltransferase molecular function.
  experiment_type: in vitro enzymology
knowledge_gaps:
- gap_statement: The relationship between NAP treatment effects and the activities of endogenous
    ADNP molecular species remains incompletely resolved.
  boundary: NAP is an active ADNP-derived sequence, and native ADNP has both nuclear and cytoplasmic
    functions. The accessed donor studies often foreground isolated peptide treatments; incomplete
    full-source coverage prevents universal claims about endogenous cleavage or its absence.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: This distinction affects interpretation of the undecided ortholog-projected peptide
    assays.
  provenance:
