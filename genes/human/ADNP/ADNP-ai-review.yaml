id: Q9H2P0
gene_symbol: ADNP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ADNP is a zinc-finger and homeobox-containing chromatin regulator that recognizes
  DNA sequences and assembles the ChAHP complex with CHD4 and HP1 proteins. Its sequence-specific
  targeting recruits chromatin-remodeling activity to control transcription and local genome organization.
  ADNP also binds HP1 chromoshadow domains, supporting a complementary mode of recruitment to
  H3K9me3-marked heterochromatin. In mouse embryonic cells, ADNP controls lineage-gene expression
  and SINE repression and competes with CTCF at shared binding motifs. ADNP additionally has context-dependent
  cytoplasmic functions involving beta-catenin, microtubule end-binding proteins and neuronal
  morphogenesis. Heterozygous pathogenic variants cause Helsmoortel-van der Aa syndrome. The NAPVSIPQ
  sequence within ADNP is pharmacologically active as an isolated peptide.
