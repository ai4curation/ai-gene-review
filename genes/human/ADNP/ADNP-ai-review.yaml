id: Q9H2P0
gene_symbol: ADNP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ADNP is a nuclear zinc-finger and homeodomain protein that acts as a sequence-specific transcription
  factor and chromatin regulator. Nine C2H2 zinc fingers and a C-terminal homeodomain give it direct recognition
  of defined DNA motifs. ADNP assembles and targets ChAHP, a stable complex of ADNP, the ATP-dependent
  chromatin remodeller CHD4 and heterochromatin protein 1 (HP1alpha/beta/gamma); it carries a C-terminal
  PxVxL-type motif, conserved with its paralogue ADNP2, of the kind that generally mediates HP1 binding,
  but the HP1 contact surface has not been mapped by mutagenesis and CHD4 rather than HP1 carries the
  activity required for the complex''s known outputs. At its motif-defined sites ChAHP establishes locally
  inaccessible chromatin, repressing lineage-specifying genes and keeping stem cells from differentiating
  prematurely; the same complex silences SINE B2 retrotransposons by blocking TFIIIB recruitment to RNA
  polymerase III, and competes with CTCF for an overlapping set of motifs, so that losing ADNP redraws
  local chromatin loop boundaries. Repression by ChAHP is mechanistically distinct from classical HP1
  heterochromatin silencing: it is locally restricted and does not require H3K9me3. A paralogous complex,
  ChAHP2, substitutes ADNP2 for ADNP and covers endogenous retroviruses and LINEs. ADNP has also been
  reported to stabilise beta-catenin by binding its armadillo domain and to reach microtubules through
  an SxIP motif that binds the plus-end tracking proteins EB1 and EB3. The protein is broadly expressed,
  is essential for mouse embryonic development, and heterozygous de novo truncating variants in humans
  cause Helsmoortel-Van der Aa syndrome, a neurodevelopmental disorder with intellectual disability, autism
  and characteristic facial features. An eight-residue segment of ADNP (NAPVSIPQ, known as NAP or davunetide)
  is potently neuroprotective when supplied to cells or animals as a synthetic peptide; no protease that
  releases it from the full-length protein has been identified.'
