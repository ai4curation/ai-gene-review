core_functions:
- description: Recognises specific DNA motifs in euchromatin and thereby determines where the ChAHP complex
    binds the genome. The motif set overlaps that of CTCF, so ADNP occupancy also constrains local chromatin
    loop boundaries.
  molecular_function:
    id: GO:0000977
    label: RNA polymerase II transcription regulatory region sequence-specific DNA binding
  locations:
  - id: GO:0000785
    label: chromatin
  - id: GO:0005634
    label: nucleus
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0090575
    label: RNA polymerase II transcription regulator complex
  supported_by:
  - reference_id: PMID:29795351
    supporting_text: "Besides mediating complex assembly, ADNP recognizes DNA motifs that specify \nbinding\
      \ of ChAHP to euchromatin."
  - reference_id: PMID:31491387
    supporting_text: "we demonstrate that the ChAHP complex (CHD4, ADNP, HP1) \ncompetes with CTCF for\
      \ a common set of binding motifs"
  - reference_id: PMID:42413491
    supporting_text: Our findings support a model in which ADNP recruits chromatin-remodeling activity
      in a sequence-specific manner, enabling transcriptional control and local modulation of chromatin
      architecture.
- description: Represses transcription of the specific gene sets it binds. ChAHP establishes inaccessible
    chromatin locally around ADNP's sites, and removing the complex prematurely activates lineage-specifying
    genes.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  - id: GO:0010526
