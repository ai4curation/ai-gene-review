  - ensembl:ENSMUSP00000085316
  review:
    summary: 'Accepted and core. ADNP is a genuine sequence-specific transcription factor: it recognises
      DNA motifs and, through the ChAHP complex, represses a defined set of lineage-specifying genes.'
    action: ACCEPT
    reason: ADNP satisfies both halves of the definition, 'a DNA-binding transcription factor activity
      that modulates the transcription of specific gene sets transcribed by RNA polymerase II'. It binds
      specific DNA motifs directly, and ablating ChAHP components causes premature activation of lineage-specific
      genes, i.e. the complex it targets represses a defined gene set. The most recent primary literature
      calls it 'the transcription factor ADNP' without hedging. Accepted rather than modified; the directional
      child GO:0001227 is proposed as an additional row because the measured direction is repression,
      and adding it does not require withdrawing the parent.
    supported_by:
    - reference_id: PMID:17222401
      supporting_text: "The pluripotent P19 cells were used for ADNP-chromatin-immunoprecipitation, showing\
        \ \ndirect interactions with multiple relevant gene promoters including members of the \nup-regulated\
        \ as well as the down-regulated gene clusters."
    - reference_id: PMID:29795351
      supporting_text: "Besides mediating complex assembly, ADNP recognizes DNA motifs that specify \n\
        binding of ChAHP to euchromatin."
    - reference_id: PMID:42413491
      supporting_text: the transcription factor ADNP forms the ChAHP complex with the chromatin remodeler
        CHD4 and HP1 proteins, acting as a site-specific regulator of transcription and an antagonist
        of CTCF binding
