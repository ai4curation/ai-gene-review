- term:
    id: GO:0000977
    label: RNA polymerase II transcription regulatory region sequence-specific DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9Z103
  - ensembl:ENSMUSP00000085316
  review:
    summary: Accepted and core. ADNP recognises specific DNA motifs that determine where the ChAHP complex
      binds, and it competes with CTCF for a shared motif set - direct sequence recognition, not merely
      chromatin association.
    action: ACCEPT
    reason: 'This is the row where the campaign''s standing lead - ''a homeobox does not establish sequence-specific
      DNA binding'' - does NOT confirm, and it is worth stating as a non-confirmation. The transferred
      annotation traces to mouse PMID:17222401, an ADNP ChIP at gene promoters; ChIP occupancy alone would
      indeed not distinguish direct sequence recognition from indirect tethering, and note that MGI read
      the same paper more conservatively as GO:0003682 chromatin binding while ARUK-UCL read it as GO:0000977/GO:0000981.
      But three later studies settle it independently of that paper: ADNP recognises DNA motifs that determine
      where ChAHP binds; ChAHP competes with CTCF for a common set of binding motifs; and a 2026 dissection
      describes ADNP recruiting remodelling activity in a sequence-specific manner. The homeodomain is
      present and intact (UniProt DNA_BIND 754..814) and nine C2H2 zinc fingers accompany it. So the term
      is right, and it is right for reasons stronger than the evidence the row cites.'
    supported_by:
    - reference_id: PMID:17222401
      supporting_text: "The pluripotent P19 cells were used for ADNP-chromatin-immunoprecipitation, showing\
        \ \ndirect interactions with multiple relevant gene promoters including members of the \nup-regulated\
        \ as well as the down-regulated gene clusters."
    - reference_id: PMID:29795351
      supporting_text: "Besides mediating complex assembly, ADNP recognizes DNA motifs that specify \n\
        binding of ChAHP to euchromatin."
    - reference_id: PMID:42413491
      supporting_text: the transcription factor ADNP forms the ChAHP complex with the chromatin remodeler
        CHD4 and HP1 proteins, acting as a site-specific regulator of transcription and an antagonist
        of CTCF binding
    - reference_id: PMID:31491387
      supporting_text: "we demonstrate that the ChAHP complex (CHD4, ADNP, HP1) \ncompetes with CTCF for\
        \ a common set of binding motifs"
- term:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
