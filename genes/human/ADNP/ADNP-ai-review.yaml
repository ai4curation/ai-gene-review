- term:
    id: GO:0090263
    label: positive regulation of canonical Wnt signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9Z103
  - ensembl:ENSMUSP00000085316
  review:
    summary: ADNP positively regulates Wnt signaling during neural differentiation in the mouse model.
    action: KEEP_AS_NON_CORE
    reason: PMID:32533114 connects ADNP-beta-catenin interaction to reduced beta-catenin degradation,
      Wnt reporter output and neural differentiation. The effect is developmental-stage dependent, and
      the paper distinguishes neural induction from undifferentiated ESCs. Retain the mouse-to-human
      functional inference with that scope. WNT repression in human colorectal cancer (PMID:27903678)
      is a different cellular context, not evidence that the positive neural result is false. Recovered
