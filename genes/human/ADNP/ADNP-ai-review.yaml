  review:
    summary: Removed. Humans do not have an estrous cycle. The term's definition specifies a cycle in
      which the endometrium is resorbed if pregnancy does not occur, which is precisely what distinguishes
      it from the menstrual cycle of humans and other catarrhines, so a human gene product cannot be involved
      in it.
    action: REMOVE
    reason: 'This one is decided by reading the definition rather than the label. GO:0044849 is ''A type
      of ovulation cycle, which occurs in most mammalian therian females, where the endometrium is resorbed
      if pregnancy does not occur.'' Its formal taxon constraint is only_in_taxon Theria, and humans are
      Theria, so the constraint does not block the annotation - but the differentia in the definition
      does. The underlying rat annotation is also weak in its own right: an IEP recording that Adnp mRNA
      rises in rat vagina during estrus, in a paper about neuropeptide receptor transcripts in the rat
      clitoris and vagina. A transcript that oscillates with a cycle is not thereby a participant in it.
      Both grounds point the same way for the human row. Worth raising upstream: an orthology-based projection
      pipeline has no way to notice that a term is biologically inapplicable to the target species when
      the formal constraint permits it.'
    supported_by:
    - reference_id: PMID:16023261
      supporting_text: "Significant increases in the expression of the VIP receptor type 2 (VPAC2) mRNA\
        \ \nand parallel increases in a novel VIP responsive gene, activity-dependent \nneuroprotective\
        \ protein (ADNP) mRNA were detected in the rat vagina during the \nestrus phase."
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - SOURCE_EVIDENCE_WEAK
      source_entities:
