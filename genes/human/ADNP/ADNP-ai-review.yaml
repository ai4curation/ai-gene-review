  review:
    summary: Bare protein binding replaced by the informative term. The partner is CHD4 (Q14839), the
      ATP-dependent chromatin remodeller of the ChAHP complex, and what ADNP does with it is position
      its remodelling activity on sequence-defined chromatin sites.
    action: MODIFY
    reason: 'CHD4 resolves to the reviewed canonical Swiss-Prot entry (CHD4_HUMAN, 1912 aa), so this is
      not an ORFeome fragment. The interaction is not a screen hit: ADNP, CHD4 and HP1 co-purify as a
      stable complex, ADNP supplies the DNA-motif recognition that targets it, and a 2026 dissection shows
      the CHD4 subunit - not HP1 - carries the remodelling activity required for transposon silencing
      and CTCF antagonism. GO:0140463 chromatin-protein adaptor activity is defined as bringing together
      a protein and a region of chromatin to establish the chromatin localisation of that protein or of
      the complex it belongs to, which is exactly the role the experiments assign to ADNP. This is a MODIFY
      rather than a MARK_AS_OVER_ANNOTATED because the interaction is real and central; only the term
      is uninformative.'
    proposed_replacement_terms:
