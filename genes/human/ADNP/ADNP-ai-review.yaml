- term:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence_type: ISA
  original_reference_id: GO_REF:0000113
  qualifier: enables
  supporting_entities:
  - tfclass:3.1.8
  review:
    summary: 'Accepted and core. ADNP is a genuine sequence-specific transcription factor: it recognises
      DNA motifs and, through the ChAHP complex, represses a defined set of lineage-specifying genes.'
    action: ACCEPT
    reason: ADNP satisfies both halves of the definition, 'a DNA-binding transcription factor activity
      that modulates the transcription of specific gene sets transcribed by RNA polymerase II'. It binds
      specific DNA motifs directly, and ablating ChAHP components causes premature activation of lineage-specific
      genes, i.e. the complex it targets represses a defined gene set. The most recent primary literature
      calls it 'the transcription factor ADNP' without hedging. Accepted rather than modified; the directional
      child GO:0001227 is proposed as an additional row because the measured direction is repression,
      and adding it does not require withdrawing the parent. The TFClass route (GO_REF:0000113, tfclass:3.1.8)
      is a classification-based ISA and would carry little weight alone, but it agrees with the experimental
      picture here.
    supported_by:
    - reference_id: PMID:17222401
      supporting_text: "The pluripotent P19 cells were used for ADNP-chromatin-immunoprecipitation, showing\
        \ \ndirect interactions with multiple relevant gene promoters including members of the \nup-regulated\
        \ as well as the down-regulated gene clusters."
    - reference_id: PMID:29795351
      supporting_text: "Besides mediating complex assembly, ADNP recognizes DNA motifs that specify \n\
        binding of ChAHP to euchromatin."
    - reference_id: PMID:42413491
      supporting_text: the transcription factor ADNP forms the ChAHP complex with the chromatin remodeler
        CHD4 and HP1 proteins, acting as a site-specific regulator of transcription and an antagonist
        of CTCF binding
    - reference_id: PMID:29795351
      supporting_text: "Genetic ablation of ChAHP components in mouse \nembryonic stem cells results in\
        \ spontaneous differentiation concomitant with \npremature activation of lineage-specific genes"
- term:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  evidence_type: IDA
  original_reference_id: PMID:29795351
  qualifier: enables
  review:
    summary: Proposed. GOA gives ADNP the direction-neutral parent GO:0000981 three times but never the
      repressor child, although every measurement of ChAHP's effect on transcription is repression.
    action: NEW
    reason: 'ADNP supplies the sequence-specific DNA recognition that positions ChAHP, and ChAHP represses:
      ablating its components prematurely activates lineage-specific genes, and the complex establishes
      inaccessible chromatin around ADNP''s binding sites. That is a DNA-binding transcription factor
      activity that decreases transcription of specific Pol II gene sets, which is the definition of GO:0001227.
      This is proposed additively - the parent GO:0000981 rows are accepted, not modified - because the
      parent is correct and the child adds the measured direction. Evidence code IDA with PMID:29795351,
      matching the code ARUK-UCL used for the human complex annotation from the same paper.'
    supported_by:
    - reference_id: PMID:29795351
      supporting_text: "Genetic ablation of ChAHP components in mouse \nembryonic stem cells results in\
        \ spontaneous differentiation concomitant with \npremature activation of lineage-specific genes"
    - reference_id: PMID:29795351
      supporting_text: "ChAHP-mediated repression, however, acts in a locally restricted manner by \n\
        establishing inaccessible chromatin around its DNA-binding sites and does not \ndepend on H3K9me3-modified\
        \ nucleosomes."
- term:
    id: GO:0010526
    label: transposable element silencing
  evidence_type: ISS
  original_reference_id: PMID:42413492
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9Z103
  review:
    summary: Proposed. Repression of SINE B2 retrotransposons is one of ChAHP's two best-characterised
      outputs and is entirely absent from ADNP's GOA record.
    action: NEW
    reason: 'ChAHP binds SINE B2 elements and silences them, and the mechanism has now been resolved:
      it blocks TFIIIB recruitment to the Pol III machinery without affecting TFIIIC. The paralogous ChAHP2
      complex, in which ADNP2 replaces ADNP, covers ERVs and LINEs, and depleting both aggravates derepression
      - so the activity is a property of the ADNP-containing complex specifically, not a generic chromatin
      effect. The general parent GO:0010526 is chosen deliberately over GO:0141005 transposable element
      silencing by heterochromatin formation: the same work reports that heterochromatin formation and
      DNA methylation play only a minor role in mouse ES cells, so the heterochromatin child would assert
      a mechanism the data exclude. Evidence is ISS from mouse Adnp because the work is in mouse ES cells;
      human ADNP has the same architecture, the same partners and the same PxVxL motif, but the transposon
      experiments have not been repeated in human cells.'
    supported_by:
    - reference_id: PMID:42413492
      supporting_text: Instead, we identify the ChAHP complex as a key repressor of SINE B2 elements.
        ChAHP directly inhibits POL III transcription by blocking TFIIIB recruitment without affecting
        TFIIIC binding.
    - reference_id: PMID:42413492
      supporting_text: Although DNA methylation and heterochromatin formation have been implicated in
        their repression, we find that these pathways play only a minor role in mouse embryonic stem cells.
    - reference_id: PMID:38960717
      supporting_text: Genetic ablation of ADNP2 alleviates ERV and LINE1 repression, which is synthetically
        exacerbated by additional depletion of ADNP.
