proposed_new_terms:
- proposed_name: ChAHP complex
  proposed_definition: A protein complex that represses transcription at sequence-defined chromatin sites,
    composed of the sequence-specific DNA-binding subunit ADNP, the ATP-dependent chromatin remodeller
    CHD4, and heterochromatin protein 1. ADNP assembles the complex and targets it to DNA motifs; the
    complex establishes locally inaccessible chromatin without requiring H3K9me3, represses lineage-specifying
    genes, silences SINE retrotransposons, and antagonises CTCF binding at overlapping motifs.
  proposed_parent:
    id: GO:0090575
    label: RNA polymerase II transcription regulator complex
  justification: 'ChAHP is a named, stable, biochemically purified complex defined in 2018 and characterised
    in five subsequent primary papers, with a paralogous ChAHP2 (ADNP2/CHD4/HP1beta) described in 2024.
    GO currently has no term for it: a QuickGO ontology search for ''ChAHP'' returns nothing, and the
    Complex Portal search for ''ChAHP'' returns zero results, so ADNP''s only human experimental annotation
    has to use the generic parent GO:0090575. Reactome already models the assembly step as R-HSA-9940477
    ''Formation of ChAHP complex''. Creating the term would let ADNP, CHD4, CBX1, CBX3 and CBX5 carry
    a specific, shared complex annotation, and would give ADNP2 a place to attach the ChAHP2 paralogue.'
  supported_by:
  - reference_id: PMID:29795351
    supporting_text: "ADNP interacts with the chromatin remodeller CHD4 and the chromatin \narchitectural\
      \ protein HP1 to form a stable complex, which we refer to as ChAHP."
  - reference_id: PMID:29795351
    supporting_text: "ChAHP-mediated repression, however, acts in a locally restricted manner by \nestablishing\
      \ inaccessible chromatin around its DNA-binding sites and does not \ndepend on H3K9me3-modified\
      \ nucleosomes."
  - reference_id: PMID:38960717
    supporting_text: We previously discovered ChAHP, a protein complex with repressive activity against
      short interspersed element (SINE) retrotransposons that is composed of the transcription factor
      ADNP, chromatin remodeler CHD4, and HP1 proteins.
suggested_questions:
- question: 'Thirteen of human ADNP''s fifty-three GOA rows are Ensembl Compara projections (GO_REF:0000107)
    of rat Adnp annotations whose cited experiments assayed the synthetic ADNP-derived octapeptide NAPVSIPQ
    (NAP) rather than the ADNP gene product: GO:0005507, GO:0007614, GO:0010629, GO:0010976, GO:0033484,
    GO:0042277, GO:0043524, GO:0045773, GO:0046068, GO:0048487, GO:0050805, GO:0051965 and GO:0080164.
    One of them (GO:0050805, from PMID:15963648) rests on D-NAPVSIPQ, the all-D-amino-acid enantiomer,
    which no gene can encode, and whose own control shows no effect without co-applied ethanol; two more
    (GO:0046068 and GO:0080164, from PMID:11438390) come from a paper titled for vasoactive intestinal
    peptide in which ADNP is never manipulated. Should GO adopt an explicit convention for bioactive peptides
    derived from a parent protein - that a synthetic fragment''s pharmacology annotates the parent gene
    only where proteolytic release of that fragment in vivo has been demonstrated - and should RGD and
    Ensembl Compara review this block jointly? Fixing it at the rat source would clear the human rows
    and the mouse ISO rows in one edit.'
  experts:
  - RGD GO curators
  - GO Central
  - Ensembl Compara / GOA
- question: GO:0044849 estrous cycle reaches human ADNP by Ensembl Compara from a rat IEP. Its formal
    taxon constraint is only_in_taxon Theria, which humans satisfy, but its definition specifies a cycle
    in which the endometrium is resorbed if pregnancy does not occur - the property that distinguishes
    it from the menstrual cycle of humans and other catarrhines. Should this term carry a narrower taxon
    constraint (or an explicit exclusion for catarrhine primates) so that orthology-projection pipelines
    cannot deliver it to a human gene?
  experts:
  - GO Central ontology editors
  - Ensembl Compara / GOA
- question: ChAHP (ADNP/CHD4/HP1) has no term in GO and no entry in the Complex Portal, so ADNP's only
    human experimental annotation must use the generic GO:0090575, and the paralogous ChAHP2 (ADNP2/CHD4/HP1beta)
    has nowhere to attach. Would the Complex Portal curate CPX entries for ChAHP and ChAHP2, from which
    GO CC terms could follow?
  experts:
  - Complex Portal curators
  - GO Central ontology editors
- question: UniProt's human ADNP entry (Q9H2P0) predates the ChAHP literature. Its FUNCTION and SUBUNIT
    comments are entirely ECO:0000250|UniProtKB:Q9Z103 by-similarity text about transcriptional regulation,
    VIP effects and beta-catenin, with no mention of CHD4, HP1 or the ChAHP complex, and no mention of
    the C-terminal PxVxL motif or of the SxIP motif in the NAP region that binds EB1/EB3. Could the entry
    be updated from PMID:29795351, PMID:31491387, PMID:42413491, PMID:42413492 and PMID:25178163? The
    INTERACTION block already lists CBX1, CBX3 and CBX5, so the record is internally inconsistent about
    the protein's best-characterised activity.
  experts:
  - UniProt curators
- question: Does ADNP promote or repress Wnt/beta-catenin signalling? PMID:32533114 reports that ADNP
    stabilises beta-catenin by binding its armadillo domain and that loss of ADNP downregulates neuroectoderm
    genes; PMID:27903678 reports ADNP acting as a WNT repressor in colorectal cancer, where silencing
    it increases migration, invasion and tumour growth. GOA currently carries only the positive direction
    (GO:0090263, by Compara from mouse). Is this cell-context dependence or a genuine contradiction?
  experts:
  - ADNP researchers
  - Wnt signalling curators
suggested_experiments:
- hypothesis: ADNP binds HP1 through its single C-terminal PxVxL motif (PGVLL, residues 820-824 of Q9H2P0)
    docking on the HP1 chromo shadow domain.
  description: 'Mutate the PxVxL motif in full-length human ADNP (for example V822A/L824A) and assay co-immunoprecipitation
    of CBX1, CBX3 and CBX5, and reciprocally test the isolated ADNP C-terminal peptide against HP1 chromo
    shadow domain versus chromo domain constructs by ITC or fluorescence polarisation. This is the measurement
    missing behind the chromo-shadow-domain assignment proposed here: at present the motif is known to
    be conserved from ADNP to ADNP2 and all three HP1 paralogues are known to bind, but no ADNP point
    mutant has been shown to lose HP1 binding. Pair it with the CHD4-binding region so the two arms of
    ChAHP assembly can be separated.'
  experiment_type: structure-function mutagenesis and binding assay
- hypothesis: The NAPVSIPQ peptide is not proteolytically released from ADNP in vivo, so NAP pharmacology
    is not a function of the ADNP gene product.
  description: 'Search for endogenous NAP by targeted mass spectrometry: immunoprecipitate ADNP from human
    brain or neuronal cultures and look for semi-tryptic or non-tryptic peptides whose termini match the
    NAP boundaries, and separately run peptidomics on conditioned medium and CSF with a heavy-labelled
    NAPVSIPQ standard for absolute quantification. A well-powered negative would settle a question the
    whole NAP literature has left open and would justify retracting a block of GO annotations across three
    species; a positive would justify keeping them.'
  experiment_type: targeted proteomics / peptidomics
- hypothesis: Human ADNP binds the same DNA motif and forms the same complex as mouse Adnp, so the ChAHP
    mechanism established in mouse ES cells transfers directly.
  description: Perform ADNP ChIP-seq or CUT&RUN in a human cell type where ADNP matters - human induced
    neurons or neural progenitors - alongside CHD4 and CBX3, derive the human ADNP motif de novo, and
    compare it with the mouse motif and with the CTCF motif. Nearly all ChAHP mechanism is currently mouse;
    the human rows in GOA rest on ISS and on interaction data. Add SINE/Alu quantification, since the
    mouse silencing target is SINE B2 and the human SINE landscape is Alu-dominated - whether human ChAHP
    has an equivalent transposon target is unknown.
  experiment_type: genomics
- hypothesis: ADNP itself has methyltransferase activity, rather than co-purifying with one.
  description: PMID:41174994 reports methyltransferase activity in immunoprecipitated fractions containing
    overexpressed wild-type ADNP, reduced by nonsense variants. Repeat with recombinant ADNP purified
    to homogeneity from a heterologous system, with a catalytically dead point mutant of the proposed
    N-terminal domains as the control and a SAM-to-SAH readout; test defined histone and DNA substrates.
    Until an activity is demonstrated on purified protein with a point-mutant control, no methyltransferase
    GO term should be proposed, and none is proposed here.
  experiment_type: in vitro enzymology
knowledge_gaps:
- gap_statement: It is not known whether the NAPVSIPQ (NAP) peptide is ever released from ADNP in vivo.
    The entire NAP literature uses synthetic peptide, and no protease, cleavage site or endogenous NAP
    detection has been reported.
  boundary: 'Known: NAP is a genuine subsequence of ADNP (UniProt REGION 354..361) and is potently active
    when supplied exogenously. Unknown: whether the ADNP gene product is processed to release it. This
    is the hinge on which a whole block of GO annotations turns.'
