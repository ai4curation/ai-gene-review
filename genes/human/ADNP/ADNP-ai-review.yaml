- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000405125
  - UniProtKB:Q9H2P0
  - ZFIN:ZDB-GENE-061215-112
  review:
    summary: Correct and core. ADNP is a nuclear chromatin factor, and this IBA is self-referential -
      human ADNP itself is one of the WITH/FROM entries, so it records a PAINT curator judging nuclear
      localisation to be a core, family-conserved property rather than transferring it from elsewhere.
    action: ACCEPT
    reason: 'PTN000405125 spans the ADNP/ADNP2 clade. The WITH/FROM cites UniProtKB:Q9H2P0 (this gene)
      alongside a zebrafish ortholog, which is the valid self-referential pattern, not circularity. Human
      ADNP independently holds nucleus from the UniProt subcellular-location pipeline, and the entire
      body of ChAHP work is nuclear: the complex binds euchromatic DNA motifs and represses transcription
      there.'
    supported_by:
    - reference_id: PMID:29795351
      supporting_text: "ADNP interacts with the chromatin remodeller CHD4 and the chromatin \narchitectural\
        \ protein HP1 to form a stable complex, which we refer to as ChAHP."
- term:
    id: GO:0010468
    label: regulation of gene expression
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1338758
  - PANTHER:PTN000405125
  - RGD:71030
  review:
    summary: Correct at the family level. The donors are the mouse and rat orthologs, which both hold
      regulation of gene expression at exactly this level, so there is no granularity defect to fix on
      this row; the specific repressor terms are proposed additively rather than as a replacement.
    action: ACCEPT
    reason: WITH/FROM resolves to MGI:MGI:1338758 (mouse Adnp) and RGD:71030 (rat Adnp) - orthologs, not
      paralogs - plus the PANTHER node. Mouse Adnp carries GO:0010468 by its own IMP (PMID:32533114) and
      rat by ISO from mouse, i.e. the donors sit at the same level as the propagated term, so this is
      not a case where a term landed above its donors. ADNP's characterised activity is more specific
      than this - it is the sequence-specific DNA-binding subunit of a repressive complex - but the specific
      terms are added as separate rows rather than replacing a correct parent.
    supported_by:
    - reference_id: PMID:32533114
      supporting_text: "Here, we show that ADNP is required for neural induction and \ndifferentiation\
        \ by enhancing Wnt signaling."
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001356
  review:
    summary: Kept as a correct but general parent. IPR001356 is the homeodomain, which human ADNP genuinely
      has (UniProt DNA_BIND 754..814, PROSITE PS50071), and ADNP does bind DNA; the informative term is
      the sequence-specific child, which GOA already carries.
    action: KEEP_AS_NON_CORE
    reason: This is an InterPro2GO mapping from a fold to an activity, the route this campaign checks
      first - but here the mapping is sound rather than over-reaching. Unlike the GPCR cases where a ligand-recognition
      signature was mapped to 'activates a G protein', IPR001356 -> GO:0003677 asserts only that a homeodomain
      binds DNA, which is the domain's defining property, and independent experiments show ADNP recognises
      specific DNA motifs. It is retained as non-core only because GO:0000977 states the same fact with
      the specificity the evidence supports.
    supported_by:
    - reference_id: PMID:29795351
      supporting_text: "Besides mediating complex assembly, ADNP recognizes DNA motifs that specify \n\
        binding of ChAHP to euchromatin."
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review:
    summary: Correct and core. Nuclear localisation is asserted by UniProt from the homeobox profile's
      nuclear-localisation signal and is confirmed by every ChAHP study, which measures ADNP occupancy
      on chromatin.
    action: ACCEPT
    reason: UniProt's SUBCELLULAR LOCATION line gives Nucleus with ECO:0000255|PROSITE-ProRule:PRU00108,
      a sequence-analysis inference from the homeobox profile. That would be weak on its own, but ADNP
      ChIP and ChIP-seq place the protein on chromatin directly, and human ADNP holds GO:0090575 RNA polymerase
      II transcription regulator complex by IDA.
    supported_by:
    - reference_id: PMID:31491387
      supporting_text: "we demonstrate that the ChAHP complex (CHD4, ADNP, HP1) \ncompetes with CTCF for\
        \ a common set of binding motifs"
- term:
    id: GO:0005694
    label: chromosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0468
  review:
    summary: Kept as a correct but general parent of the chromatin term. ADNP is genuinely chromosome-associated,
      but chromatin (GO:0000785) is the informative location and is annotated separately.
    action: KEEP_AS_NON_CORE
    reason: GO:0000785 chromatin is part_of GO:0005694 chromosome, so this row adds no information beyond
      the chromatin annotation this review keeps as core. UniProt's Chromosome subcellular-location term
      is itself tagged ECO:0000250|UniProtKB:Q9Z103, i.e. by similarity to mouse. The term is not wrong
      - ChAHP is a chromatin-bound complex - so it is retained rather than removed.
    supported_by:
    - reference_id: PMID:31491387
      supporting_text: "ChAHP-bound loci are mainly situated within less \ndiverged SINE B2 transposable\
        \ elements."
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20562864
  qualifier: enables
  supporting_entities:
  - UniProtKB:P45973
  review:
    summary: Bare protein binding replaced by the informative term. The partner is CBX5/HP1alpha (UniProtKB:P45973),
      a reviewed canonical Swiss-Prot entry, and the interaction is the HP1 arm of the ChAHP complex.
    action: MODIFY
    reason: 'Identified in an HP1alpha proteomics study whose subject is POGZ; ADNP is a co-purifying
      HP1alpha partner rather than the paper''s focus. ADNP binds all three human HP1 paralogues (CBX5/HP1alpha,
      CBX1/HP1beta, CBX3/HP1gamma). This is not a single unreplicated screen hit: eight distinct GOA rows
      across seven independent publications record it, and the definitive mechanistic study shows HP1
      is a stoichiometric subunit of the ADNP-containing ChAHP complex. Proteins generally engage HP1
      through a PxVxL motif that docks on the chromo shadow domain, and ADNP''s C-terminal PxVxL is conserved
      down to its paralogue ADNP2. A committed scan (ADNP-bioinformatics/analyze_compara_donors.py) places
      the single P.V.[LMIV] match in Q9H2P0 at PGVLL, residues 820-824, immediately C-terminal to the
      homeobox - but that same scan reports 0.76 matches expected by chance under the protein''s own residue
      composition, so finding one is what chance predicts and its uniqueness is NOT evidence. The weight
      rests on the ADNP-to-ADNP2 conservation and on all three HP1 paralogues binding. GO:0070087 chromo
      shadow domain binding is therefore the informative replacement for bare protein binding. What has
      NOT been done is a point mutation of ADNP''s PxVxL showing loss of HP1 binding, so the chromo-shadow-domain
      assignment is an inference from motif plus paralogue-wide binding, not a mapped interaction surface;
      this is recorded as a knowledge gap.'
    proposed_replacement_terms:
    - id: GO:0070087
      label: chromo shadow domain binding
    supported_by:
    - reference_id: PMID:29795351
      supporting_text: "ADNP interacts with the chromatin remodeller CHD4 and the chromatin \narchitectural\
        \ protein HP1 to form a stable complex, which we refer to as ChAHP."
    - reference_id: PMID:20562864
      supporting_text: "Proteins generally interact with HP1 through a PxVxL (where x is any \namino-acid\
        \ residue) motif"
    - reference_id: PMID:38960717
      supporting_text: the C-terminal HP1 interaction motif (PxVxL) (Thiru et al. 2004; Mosch et al. 2011)
        is well conserved
