  - ensembl:ENSMUSP00000085316
  review:
    summary: Retained as a genuine but non-core, single-laboratory function. Mouse Adnp binds the beta-catenin
      armadillo domain directly and blocks assembly of the Axin/APC degradation complex; no human measurement
      exists and the direction of ADNP's effect on Wnt is disputed by an independent colorectal-cancer
      study.
    action: KEEP_AS_NON_CORE
    reason: The donor annotation is a real mouse IPI against Ctnnb1 (Q02248) with cached full text, so
      this is an ortholog transfer of a measured direct interaction, not a keyword or fold inference -
      it is kept. It is non-core for three reasons. It comes from one laboratory; UniProt itself records
      the interaction only as ECO:0000250|UniProtKB:Q9Z103, by similarity; and it is cytoplasmic/signalling
      biology orthogonal to the chromatin activity that every other line of evidence converges on. The
      sign is also contested - PMID:27903678 reports ADNP as a repressor of WNT signalling in colorectal
      cancer whose silencing increases migration and tumour growth - which is recorded as a knowledge
      gap rather than adjudicated here.
    supported_by:
    - reference_id: PMID:32533114
      supporting_text: "Mechanistically, ADNP functions to stabilize β-Catenin through binding to its\
        \ armadillo domain which prevents its \nassociation with key components of the degradation complex:\
        \ Axin and APC."
