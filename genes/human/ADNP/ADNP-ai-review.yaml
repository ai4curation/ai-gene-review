  qualifier: enables
  supporting_entities:
  - UniProtKB:P45973
  review:
    summary: The CBX5/HP1alpha association is better represented by chromo shadow domain binding.
    action: MODIFY
    reason: 'The original POGZ-centered proteomics study supplies the curated ADNP interaction; its abstract
      does not describe an ADNP domain-mapping experiment. The curated interaction is retained. The more
      informative replacement uses independent mechanistic evidence: ADNP PxVxL-mutant experiments in
      PMID:38960717 test HP1-dependent chromatin recruitment, together with the domain-mapping study assessed
      in PMID:21267468. The interaction screen itself is not treated as having mapped the domain, and
      binding of different HP1 paralogs does not imply simultaneous occupancy by all three.'
    proposed_replacement_terms:
    - id: GO:0070087
      label: chromo shadow domain binding
    supported_by:
    - reference_id: PMID:38960717
      supporting_text: To do this, we generated ADNPPxVxL motif point mutants (Supplemental Fig.
        S6B) and performed ChIP-seq.
    - reference_id: PMID:38960717
      supporting_text: Abrogating the HP1 interaction in this way resulted in a loss of ADNP signal
        specifically at H3K9 trimethylated transposons, including LTR and LINE1 families, which are
        bound by ADNP2
    - reference_id: PMID:21267468
      supporting_text: Yet, recruitment of ADNP to H3K9me3 was severely impaired in presence of the mutant HP1β
        W170A protein compared to the wild type HP1β protein.
    additional_reference_ids:
    - PMID:21267468
    - PMID:38960717
    - PMID:29795351
