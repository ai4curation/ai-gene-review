  review:
    summary: Association of PEA15 with microtubules was reported in mouse astrocytes; there is no evidence
      for a defined complex.
    action: MODIFY
    reason: The cited abstract describes PEA-15 as a protein kinase C substrate associated with microtubules,
      citing earlier mouse astrocyte work; UniProt records the same association. GO:0005875 denotes a
      multimeric complex connected to microtubules, and no such complex containing PEA15 has been defined.
      Location on the microtubule cytoskeleton is the claim actually made. This is a non-core, NAS-level
      observation from the mouse ortholog (same PANTHER subfamily PTHR48169:SF1, 96% identical).
    proposed_replacement_terms:
    - id: GO:0015630
      label: microtubule cytoskeleton
