- term:
    id: GO:0005875
    label: microtubule associated complex
  evidence_type: NAS
  original_reference_id: PMID:8662970
  qualifier: part_of
  review:
    summary: The microtubule-associated-complex assignment requires source verification.
    action: UNDECIDED
    reason: The cached abstract of PMID:8662970 describes a microtubule-associated protein in mouse astrocytes
      and conservation of mouse and human transcripts. The full text is unavailable, so the experimental
      basis for assigning human PEA15 to a microtubule-associated complex remains unresolved. ERK binding
      and cytoplasmic localization alone do not establish this complex membership.
- term:
    id: GO:0042981
    label: regulation of apoptotic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001875
  - InterPro:IPR029546
  review:
    summary: PEA15 regulates apoptotic signaling through death-effector-domain interactions.
    action: ACCEPT
    reason: Human-cell overexpression and co-precipitation experiments demonstrate inhibition of Fas/TNFR1-dependent
      caspase-8 activation involving FADD. This supports apoptotic regulation; the conserved horse core
      supports transfer of the mechanism.
    supported_by:
    - reference_id: PMID:10442631
      supporting_text: 'Thus, PED/PEA-15 is an endogenous protein inhibiting FAS and TNFR1-mediated

        apoptosis.'
- term:
    id: GO:0046325
    label: negative regulation of D-glucose import across plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:9670003
  qualifier: involved_in
  review:
    summary: PEA15 inhibits insulin-stimulated glucose import by regulating GLUT4 recruitment.
    action: ACCEPT
    reason: The primary study expresses cloned human PEA15 in L6 skeletal muscle cells and observes reduced
      insulin-stimulated transport and surface GLUT4. This is regulatory involvement in glucose import,
      not intrinsic carbohydrate-transporter activity.
    supported_by:
    - reference_id: PMID:9670003
      supporting_text: 'Transfection of PED/PEA-15 in

        differentiating L6 skeletal muscle cells increases the content of Glut1

        transporters on the plasma membrane and inhibits insulin-stimulated glucose

        transport and cell-surface recruitment of Glut4'
- term:
    id: GO:1902042
    label: negative regulation of extrinsic apoptotic signaling pathway via death domain receptors
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:104799
  - PANTHER:PTN008298780
  - UniProtKB:Q15121
  review:
    summary: PEA15 can inhibit death-receptor-mediated extrinsic apoptosis.
    action: ACCEPT
    reason: The human primary experiment shows protection from FasL and TNFalpha effects and impaired
      FADD–caspase-8 association. This is the specific pathway represented by the annotation. The horse
      protein preserves the human death-effector-domain sequence, although the effect of its N-terminal
      extension has not been measured.
    supported_by:
