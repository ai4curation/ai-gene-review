  review:
    summary: PEA15 overexpression inhibits insulin-stimulated glucose transport in L6 myotubes.
    action: KEEP_AS_NON_CORE
    reason: Overexpression of human PEA15 in L6 skeletal muscle cells inhibited insulin-stimulated glucose
      transport and GLUT4 recruitment to the surface; the term matches this regulatory observation. It
      is a gain-of-function phenotype linked to the type 2 diabetes overexpression finding, mediated indirectly
      (via PLD1/PKC signalling), and peripheral to the core ERK-anchoring and DED functions. PEA15 has
      no transporter activity.
    supported_by:
