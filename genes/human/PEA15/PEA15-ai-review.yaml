id: Q15121
gene_symbol: PEA15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PEA15 (PEA-15/PED) is a small (130 aa), ubiquitously expressed cytoplasmic phosphoprotein
  consisting of an N-terminal death effector domain (DED) and an unstructured C-terminal tail. It binds
  ERK1/2 (MAPK3/MAPK1) through a bipartite interaction in which the DED occupies the ERK DEF-docking site
  and the C-terminal tail occupies the D-recruitment site; bound ERK is held in the cytoplasm, its activation
  loop is distorted into an inactive conformation, and its dually phosphorylated state is protected from
  phosphatases, so that PEA15 acts as a cytoplasmic anchor and phosphorylation-gated reservoir for active
  ERK. Phosphorylation of PEA15 at Ser104 (PKC) and Ser116 (CaMKII/AKT) releases ERK. Through its DED,
  PEA15 also associates with FADD and caspase-8 and inhibits Fas- and TNFR1-induced caspase-8 activation
  and apoptosis. Overexpression in muscle and adipose cells impairs insulin-stimulated GLUT4 recruitment
  and glucose uptake.
