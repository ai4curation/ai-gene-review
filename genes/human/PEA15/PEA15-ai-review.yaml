    label: MAPK cascade
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR029546
  review:
    summary: PEA15 regulates ERK1/2 signalling rather than acting as a cascade component.
    action: MODIFY
    reason: PEA15 is not a kinase or relay component of the MAPK cascade; it binds ERK1/2 and modulates
      their localization, conformation and dephosphorylation, inhibiting nuclear ERK signalling while
      preserving a pool of phospho-ERK that is released on PEA15 phosphorylation. The effect can be positive
      or negative depending on context, so the accurate process is regulation of the ERK1 and ERK2 cascade.
    proposed_replacement_terms:
    - id: GO:0070372
      label: regulation of ERK1 and ERK2 cascade
    supported_by:
    - reference_id: PMID:23575685
      supporting_text: "PEA-15 binding protects ERK2 from dephosphorylation, thus \nsetting the stage\
        \ for immediate ERK activity upon its release from the PEA-15 \ninhibitory complex."
