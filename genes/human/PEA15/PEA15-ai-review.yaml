id: Q15121
gene_symbol: PEA15
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PEA15 is a small cytoplasmic death-effector-domain protein that directly binds ERK1/2 and
  modulates their activity and subcellular distribution. It inhibits death-receptor apoptosis through
  interactions involving FADD and caspase-8. Its effects on GLUT1 and GLUT4 trafficking regulate glucose
  uptake; it is a signaling regulator rather than a transmembrane glucose carrier.
