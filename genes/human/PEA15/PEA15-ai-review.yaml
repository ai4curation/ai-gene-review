- term:
    id: GO:0042308
    label: negative regulation of protein import into nucleus
  evidence_type: IDA
  original_reference_id: PMID:23575685
  review:
    summary: PEA15 retains ERK1/2 in the cytoplasm and blocks their nuclear translocation.
    action: NEW
    reason: 'PEA15 is the entity that performs this step: by occupying the ERK DEF and D docking sites
      it masks the surfaces ERK uses to engage nuclear transport machinery. In the structure paper, the
      PEA15 L123K docking mutant fails to prevent ERK nuclear translocation, and the R71 interface mutant
      abrogates cytoplasmic retention; Reactome and the Mxi2 study describe the same cytoplasmic-anchor
      function. This is the direct mechanism rather than a downstream phenotype.'
    supported_by:
    - reference_id: PMID:23575685
      supporting_text: results in the failure of the PEA-15 L123K mutant to prevent ERK nuclear translocation
    - reference_id: Reactome:R-HSA-5675206
      supporting_text: PEA15 is a cytoplasmic anchor that binds directly to activated MAPKs prevents their
        translocation into the nucleus
- term:
    id: GO:0019887
    label: protein kinase regulator activity
  evidence_type: IDA
  original_reference_id: PMID:23575685
  review:
    summary: PEA15 directly modulates ERK2 conformation and phosphorylation state.
    action: NEW
    reason: Crystal structures show that PEA15 binding triggers an allosteric conduit that disrupts key
      features of active ERK2, holding the activation loop in an inactive conformation, while also protecting
      the bound kinase from dephosphorylation; interface mutants lose these effects in cells. PEA15 acts
      directly on the kinase, so a kinase regulator activity is appropriate. A strict inhibitor term is
      avoided because the net cellular outcome depends on PEA15 phosphorylation and can favour cytoplasmic
      ERK output.
    supported_by:
    - reference_id: PMID:23575685
      supporting_text: "PEA-15 binding triggers an extended allosteric \nconduit in dually phosphorylated\
        \ ERK2, disrupting key features of active ERK2."
