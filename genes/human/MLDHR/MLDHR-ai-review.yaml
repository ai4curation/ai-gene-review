- term:
    id: GO:0090324
    label: negative regulation of oxidative phosphorylation
  evidence_type: IMP
  original_reference_id: PMID:33406399
  qualifier: involved_in
  review:
    summary: Knockout of the mouse MP31 homolog accelerated OXPHOS together with lactate consumption and
      production.
    action: KEEP_AS_NON_CORE
    reason: The loss-of-function phenotype supports the annotation, and the curator had the full text, so
      it is retained. However, the effect on OXPHOS is downstream of MP31's direct activity, which is to limit
      mitochondrial lactate-to-pyruvate conversion by inhibiting LDH; reduced pyruvate supply then lowers
      respiratory flux. MP31 does not act on the respiratory chain or ATP synthase itself, so this is a secondary,
      indirect process rather than the core one. GO has no term for regulation of lactate oxidation/catabolism
      that would capture the direct effect more precisely.
    supported_by:
    - reference_id: PMID:33406399
      supporting_text: Knocking out the MP31 homolog in mice enhanced global lactate metabolism, manifesting
        as accelerated oxidative phosphorylation (OXPHOS) and increased lactate consumption and production
- term:
    id: GO:0160193
    label: L-lactate dehydrogenase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:33406399
  qualifier: enables
  review:
    summary: MP31 inhibits LDH-mediated lactate-to-pyruvate conversion in mitochondria; it binds LDHA and
      LDHB, and the abstract describes the mechanism as competition with mitochondrial LDH for NAD+.
    action: ACCEPT
    reason: This is the core molecular function described in the primary paper and is consistent with the
      LDH-binding data (binding lost in S5A/Y12A mutants per UniProt) and the GO definition (binds to and
      reduces LDH activity). The precise mechanism (direct LDH binding versus NAD+ competition) cannot be resolved
      from the abstract, but the curator had the full text. Evidence comes from a single laboratory and awaits
      independent replication.
    supported_by:
    - reference_id: PMID:33406399
      supporting_text: acting as a "circuit breaker" that limits lactate-pyruvate conversion in mitochondria
        by competing with mitochondrial lactate dehydrogenase (mLDH) for nicotinamide adenine dinucleotide
        (NAD+)
