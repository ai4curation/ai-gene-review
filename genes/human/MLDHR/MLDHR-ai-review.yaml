suggested_questions:
- question: Does MP31 inhibit LDH by binding the enzyme (as the S5A/Y12A interaction mutants suggest) or by
    sequestering NAD+ (as the abstract states), and is LDH inhibition reproducible with purified components?
- question: Where in mitochondria do MP31 and its LDH target reside (matrix, intermembrane space, outer membrane),
    given that the existence of a mitochondrial LDH pool is debated?
- question: Is the endogenous human peptide produced at meaningful levels outside brain, and has any group other
    than the originating laboratory confirmed its translation and function?
suggested_experiments:
- description: In vitro LDH kinetics with synthetic wild-type, S5A and Y12A MP31 peptides, varying NAD+ and
    lactate, to distinguish enzyme binding from cofactor competition.
- description: Sub-mitochondrial fractionation or proximity labelling (e.g. matrix- versus IMS-targeted APEX2)
    of endogenous MP31 and LDHB.
