  label: Homo sapiens
description: 'MLDHR (MP31, micropeptide 31; mitochondrial lactate dehydrogenase regulator) is a 31-amino-acid
  peptide translated from an upstream open reading frame (uORF) in the 5'' untranslated region of the PTEN
  mRNA. It is a distinct product from PTEN and from the in-frame N-terminally extended PTEN-L isoform. The
  peptide localizes to mitochondria, where it binds lactate dehydrogenases (LDHA and LDHB; binding lost on
  S5A or Y12A substitution) and limits the mitochondrial conversion of lactate to pyruvate, reported to occur
  by competing with mitochondrial LDH for NAD+. Loss of the mouse homolog accelerates lactate consumption and
  production and oxidative phosphorylation, and conditional deletion in astrocytes promotes gliomagenesis,
  supporting a tumour-suppressive role. The peptide is detected in brain and is reduced or lost in glioblastoma;
  in glioblastoma cells it also lowers mitochondrial membrane potential and, by competing with the lysosomal
  V-ATPase for LDHB, causes lysosomal alkalinization and blocks mitophagic flux. All functional data so far
  come from a single research group.'
