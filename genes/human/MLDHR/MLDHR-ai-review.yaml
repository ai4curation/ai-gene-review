- description: Mitochondrial micropeptide translated from the PTEN 5' UTR uORF that binds lactate dehydrogenases
    (LDHA/LDHB) and inhibits mitochondrial LDH-mediated conversion of lactate to pyruvate, thereby restraining
    lactate oxidation and downstream oxidative phosphorylation.
