- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: Cytosolic RAB13 represents the soluble GDP/GDI pool of the Rab
      cycle.
    action: KEEP_AS_NON_CORE
    reason: RAB proteins can pass through a soluble, inactive GDP/GDI-bound
      state, and the Reactome generic RAB cycle places RAB13 in that cytosolic
      reservoir. This is a legitimate but non-core compartment relative to the
      membrane sites where RAB13 executes cargo transport and PKA effector
      functions.
    supported_by:
    - reference_id: Reactome:R-HSA-8870469
      supporting_text: RABs cycle between active GTP bound forms that are
        membrane associated, and inactive GDP bound forms that are cytosolic and
        associated with RAB GDP dissociation inhibitor
