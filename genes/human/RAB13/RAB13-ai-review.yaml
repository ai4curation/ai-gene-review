id: P51153
gene_symbol: RAB13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RAB13 is a Rab-family small GTPase that cycles between GDP- and GTP-bound
  states to regulate cargo trafficking at the trans-Golgi network, recycling endosomes,
  plasma membrane, and epithelial junctional membranes. Activated RAB13 controls transport
  from the trans-Golgi network through recycling endosomes to the cell surface, continuous
  endocytic recycling of occludin, tight-junction assembly through MICALL2/JRAB and
  PKA-linked mechanisms, and post-Golgi delivery of Toll-like receptor cargoes in
  the RNF115 pathway.'
