  review:
    summary: The generic endosome row is true but imprecise beside the direct
      recycling-endosome evidence.
    action: TOO_GENERAL
    reason: PTN000635134 transfers a coarse endosome/plasma-membrane
      localization pattern in the animal RAB13/RAB8/RAB10-family clade. Human
      RAB13 is supported at the more specific recycling endosome and TGN
      interface, so this parent endosome term is correct but too imprecise on
      its own.
    supported_by:
    - reference_id: PMID:18779367
      supporting_text: Rab13 partially colocalized with both TGN38
