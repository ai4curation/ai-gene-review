  review:
    summary: RAB13 is a Rab-family small GTPase that binds and hydrolyzes GTP.
    action: ACCEPT
    reason: RAB13 has the canonical Rab GTPase switch architecture. PMID:8294494
      identified the human protein as a small Rab/Sec4-like GTPase,
      PMID:20937701 showed that DENND1C promotes RAB13 GTP loading, and
      PTN000635132 places GTPase activity at an ancestral Rab-family node that
      includes human RAB13 itself as direct descendant evidence.
    supported_by:
    - reference_id: PMID:8294494
      supporting_text: a cDNA clone from a human intestinal cDNA library
        encoding a small GTPase, rab13
    - reference_id: PMID:20937701
      supporting_text: DENND1C in contrast was most active toward Rab13 and
        showed no activity to Rab35
