  negated: true
  review:
    summary: The NOT Golgi-apparatus row should be narrowed to the cis-Golgi
      network.
    action: MODIFY
    reason: PMID:18779367 reported no colocalization with GM130, a cis-Golgi
      marker, in the same study that positively localized RAB13 to TGN38-marked
      trans-Golgi network and TfnR-positive recycling-endosome compartments.
      Keep the negated localization but move it from the parent Golgi apparatus
      to the cis-Golgi network.
    supported_by:
    - reference_id: PMID:18779367
      supporting_text: Rab13 partially colocalized with both TGN38
    - reference_id: PMID:18779367
      supporting_text: we found no colocalization between Rab13 and GM130
    proposed_replacement_terms:
    - id: GO:0005801
