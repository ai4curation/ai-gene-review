gene: DCLRE1C
accession: Q96SD1
purpose: Authored evidence-navigation guide; not an independent experimental source. Raw facts and access
  limits support the manual decisions.
source_date: '2026-10-17'
source_objects: 31
proposed_additions: 1
products:
- name: '1'
  id: Q96SD1-1
  description: Displayed 692-residue product containing the complete N-terminal catalytic region and C-terminal
    regulatory region. Full-length 692-residue human Artemis constructs support the nuclease activities
    described here; engineered catalytic-domain truncations and phosphorylation-site mutants are distinct
    experimental entities.
- name: 2 (SCIDA)
  id: Q96SD1-2
  sequence_note: VSP_014888
  description: 572-residue product lacking canonical residues 1–120, including several residues that coordinate
    catalytic metal ions in full-length Artemis. The examined sequence and transcript sources do not establish
    autonomous nuclease activity or the full-length protein’s repair functions for this product; sequence
    truncation alone is not proof of inactivity.
- name: '3'
  id: Q96SD1-3
  sequence_note: VSP_014889, VSP_014890
  description: 577-residue product lacking canonical residues 1–115 and replacing canonical residues 116–121
    (CPGSVM) with MKHQER. This changes the N-terminal catalytic region. Its sequence is supported by transcript/cDNA
    records, but equivalent nuclease activity, localization and repair function have not been demonstrated
    by the sources examined.
- name: '4'
  id: Q96SD1-4
  sequence_note: VSP_014891, VSP_014892
  description: 434-residue product retaining canonical residues 1–385, replacing residues 386–434 with
    an alternative 49-residue segment and lacking residues 435–692. It retains the sequence of the experimentally
    studied catalytic region but has a substantially different C-terminal context. Activity of engineered
    catalytic-domain fragments cannot establish this natural product’s activation, interactions, localization
    or repair function.
primary_sources:
- pmid: '22529269'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3348108/
  locators: Results on LigIV interaction, direct binding, interface mutants and V(D)J assays; Methods
    plasmids, immunoprecipitation and pull-downs
  scope: Human cellular co-IP plus recombinant Artemis 386–692/LIG4 fragments and Artemis 485–495 peptide.
    Separate LIG4 and PRKDC interfaces; no all-product equivalence.
- pmid: '23219551'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3538150/
  locators: Results structure and calorimetry; Experimental Procedures protein expression, crystallization
    and binding
  scope: Human LIG4 DNA-binding domain 1–240 and synthetic Artemis 485–495 peptide; cellular mutant corroboration.
    Fragment structure, not whole Artemis.
- pmid: '23523427'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3664939/
  locators: Results structure of the complex; Experimental Procedures protein expression/crystallization
  scope: Human LIG4 catalytic region 1–609 with Artemis 485–495 peptide. Actual primary complex supports
    binding despite current source-specific MITAB nonmatch.
- pmid: '25941166'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4423191/
  locators: Results DNA-PKcs-associated proteins and Figure 1 caption; Materials and Methods stable cell
    lines and immunoprecipitation
  scope: Human HEK293S nuclear FLAG–DNA-PKcs purification, empty-vector and ethidium-bromide controls,
    Artemis Western detection. XLS-specific perturbation is not transferred to Artemis.
- pmid: '15071507'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC404326/
  locators: Results characterization of WT/mutants and Figure 2 localization; Materials and Methods indirect
    immunofluorescence
  scope: Human C-terminal myc–His Artemis in HEK293T; nuclear distribution excluding nucleoli. Normal
    publication cache is abstract-only; selected original text recovered separately.
- pmid: '12055248'
  url: https://doi.org/10.4049/jimmunol.168.12.6323
  locators: Complete cached abstract; original inaccessible
  scope: Primary WT transcript nuclear localization and rescue are explicit; alternative transcripts do
    not establish equivalent natural-product activities.
- pmid: '20678254'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2907561/
  locators: Results spontaneous fusions, immuno-FISH/TIF, DNA-PKcs reduction; Methods cells, cytogenetics,
    immuno-FISH
  scope: Two human Artemis-defective primary fibroblast lines vs control; population-doubling-dependent
    TIF phenotype. No direct telomere-specific incision assay.
- pmid: '15572677'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC533992/
  locators: Materials and Methods expression/colony formation; Results sensitivity of SNM1-deficient cells;
    Discussion differing family functions
  scope: Chicken DT40 Artemis loss, human cDNA complementation, X-ray and cisplatin/MMC survival. No increased
    tested cross-link sensitivity is restricted to this system.
- pmid: '21785230'
  url: https://www.jstage.jst.go.jp/article/jrr/52/4/52_10168/_pdf
  doi: 10.1269/jrr.10168
  locators: Printed 416–417 Methods; 418–420 Results; 421–422 Discussion (PDF 2–8)
  scope: Human HCT116 hMLH1-defective background, one Artemis knockout clone. Drug survival does not identify
    direct cross-link incision; authors discuss other damage-response mechanisms.
- pmid: '14744996'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2211804/
  locators: Materials and Methods V(D)J recombination on chromosomal substrates; Results definition of
    catalytic core and critical residues; Figures 2–4 captions
  scope: Patient-derived human fibroblast reporter, full-length and engineered Met 1–Ser385 rescue and
    active-site mutants. Normal cached full original was read; engineered truncation is not natural isoform
    4.
- pmid: '20117966'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2847011/
  locators: Results 3.1–3.3 and Figures 1–4 captions; source consultation selected Methods
  scope: Recombinant human Artemis-His, purification/identity, end-label/time-course discrimination of
    ssDNA endonucleolysis. Owner reread Results 3.1–3.3; broader Methods scope attributed to independent
    consultation.
- pmid: '16874298'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC1553186/
  locators: Selected Methods/Results on phosphorylation-site mutants, DNA-PKcs pre-autophosphorylation
    and hairpin/overhang assays
  scope: Independent consultation read. DNA-PKcs autophosphorylation distinguished from obligatory Artemis
    phosphorylation; human-protein mouse-host and human-cell assays separate.
- pmid: '20347402'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2883643/
  locators: Selected Methods/Results on hydroxyapatite purification, activity recovery and XPA control
  scope: Independent consultation and ROOT primary read; separation of most exonuclease is retained as
    contrary evidence, not dismissed.
- pmid: '24500713'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3953294/
  locators: Selected Methods/Results/Discussion on WT/H115A, cofractionation, poly(dA), end labeling,
    CD and inhibitors
  scope: Independent consultation and ROOT primary read; intrinsic weak exonuclease supported under tested
    biochemical conditions, physiological contribution unresolved.
- pmid: '34387696'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8450076/
  locators: Selected construct/activity Methods and Results; DNA-contact analysis/7ABS re-refinement in
    Figure 3 and associated text
  scope: Full-length 692 vs engineered catalytic-domain constructs. Owner reread observed versus modelled
    DNA contacts; partial occupancy/symmetry/disorder limitations preserved. Asp116 prose conflicts with
    canonical Cys116, so no ligand-residue geometry assertion.
- pmid: '33961781'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8165030/
  locators: STAR Methods ORF library, AP-MS and gene-level network analysis; literal IntAct EBI-54776522/IM-29278-14071
    pair
  scope: Independent consultation Methods read; tagged human Artemis bait/PRKDC prey in HEK293T. Shared
    spoke-expanded ID requires target pair+PMID, not accession alone.
- pmid: '11955432'
  url: https://pubmed.ncbi.nlm.nih.gov/11955432/
  locators: Complete genuine abstract; original body unavailable after bounded access attempts
  scope: Positive endo/exonuclease abstract preserved; later originals corroborate activity and qualify
