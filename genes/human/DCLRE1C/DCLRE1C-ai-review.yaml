core_functions:
- description: Catalyzes metal-dependent endonucleolytic cleavage of exposed single-stranded
    regions in DNA hairpins and overhangs. In nuclear repair assemblies, Artemis opens
    coding-end hairpins for V(D)J recombination and processes complex DNA breaks before
    ligation during nonhomologous end joining. DNA-PKcs and the DNA/Ku context regulate
    access to these substrates.
  molecular_function:
    id: GO:0000014
    label: single-stranded DNA endonuclease activity
  directly_involved_in:
  - id: GO:0006303
    label: double-strand break repair via nonhomologous end joining
  - id: GO:0033151
    label: V(D)J recombination
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0070419
    label: nonhomologous end joining complex
  supported_by:
  - reference_id: PMID:20117966
  - reference_id: PMID:16874298
  - reference_id: PMID:14744996
  - reference_id: PMID:25941166
  - reference_id: GO_REF:0000052
suggested_questions:
- question: What is the physiological contribution of the weak ssDNA exonuclease activity
    relative to Artemis endonucleolysis, and which natural splice products retain
    each activity?
- question: Does Artemis perform a distinct interstrand-cross-link repair step in
    human cells, or do the reported cross-linking-drug phenotypes reflect downstream
    DNA-break processing and cell-background effects?
suggested_experiments:
- hypothesis: Artemis contributions to cross-linking-drug tolerance can be separated
    from direct cross-link processing.
  description: Compare multiple independently edited and wild-type-rescued human cell
    clones in matched mismatch-repair-proficient and deficient backgrounds. Measure
    cross-link removal, repair intermediates and DNA-break repair separately from
    clonogenic drug sensitivity; include catalytic mutants and endogenous product
    quantification.
  experiment_type: Matched genetic complementation with direct DNA-lesion processing
    assays
status: COMPLETE
