    label: V(D)J recombination
  evidence_type: IMP
  original_reference_id: PMID:14744996
  qualifier: involved_in
  review:
    summary: Human Artemis directly contributes coding-end hairpin incision to V(D)J
      recombination.
    action: NEW
    reason: The full original PMID:14744996 tests human Artemis in patient-derived,
      Artemis-deficient fibroblasts carrying a chromosomal RAG1/RAG2-dependent recombination
      reporter. Full-length Artemis restores recombination frequency and coding-joint
      quality, and active-site substitutions compromise this function while retaining
      DNA-PKcs association. Independently read direct hairpin-cleavage experiments
      in PMID:16874298 link this cellular phenotype to DNA incision performed by Artemis
      itself; it is an active enzyme in the process rather than a consumed substrate.
      The latter study also tests human Artemis in mouse embryonic fibroblasts, a
      separate explicitly cross-species complementation experiment. Current is_a/part_of
      ancestry shows that V(D)J recombination is neither an ancestor nor a descendant
      of any term in the 31-source-row set. The frozen local GO-CAM index has no DCLRE1C/Q96SD1
      match; this does not establish absence from all public models. A current human
      comparator query recovered V(D)J annotations for RAG1 (DNA cleavage) and LIG4
      (DNA joining), but none for DNTT (DNA-end nucleotide addition). These proteins
      perform different chemical steps within the same process; this mixed pattern
      is not used to infer an annotation gap. The proposal rests on directly measured
      target catalysis and chromosomal recombination, with no broader immune-development
      or lymphocyte-differentiation NEW.
