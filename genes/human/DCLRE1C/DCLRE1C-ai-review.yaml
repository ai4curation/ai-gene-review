id: Q96SD1
gene_symbol: DCLRE1C
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DCLRE1C encodes Artemis, a metal-dependent DNA nuclease with an N-terminal
  metallo-β-lactamase/β-CASP catalytic region and a regulatory C-terminal region.
  Artemis cleaves exposed single-stranded DNA and DNA hairpin or overhang structures
  during nuclear DNA end processing. In cooperation with DNA-PK, it opens coding-end
  hairpins generated during V(D)J recombination and processes a subset of complex
  double-strand breaks for nonhomologous end joining. These activities support antigen-receptor
  assembly and genome integrity. Purified full-length Artemis also exhibits weaker
  5′ exonuclease activity on single-stranded DNA, whose physiological contribution
  is less well established.
alternative_products:
- name: '1'
  id: Q96SD1-1
  description: Displayed 692-residue product containing the complete N-terminal catalytic
    region and C-terminal regulatory region. Full-length 692-residue human Artemis
    constructs support the nuclease activities described here; engineered catalytic-domain
    truncations and phosphorylation-site mutants are distinct experimental entities.
- name: 2 (SCIDA)
  id: Q96SD1-2
  sequence_note: VSP_014888
  description: 572-residue product lacking canonical residues 1–120, including several
    residues that coordinate catalytic metal ions in full-length Artemis. The examined
    sequence and transcript sources do not establish autonomous nuclease activity
    or the full-length protein’s repair functions for this product; sequence truncation
    alone is not proof of inactivity.
- name: '3'
  id: Q96SD1-3
  sequence_note: VSP_014889, VSP_014890
  description: 577-residue product lacking canonical residues 1–115 and replacing
    canonical residues 116–121 (CPGSVM) with MKHQER. This changes the N-terminal catalytic
    region. Its sequence is supported by transcript/cDNA records, but equivalent nuclease
    activity, localization and repair function have not been demonstrated by the sources
    examined.
- name: '4'
  id: Q96SD1-4
  sequence_note: VSP_014891, VSP_014892
  description: 434-residue product retaining canonical residues 1–385, replacing residues
    386–434 with an alternative 49-residue segment and lacking residues 435–692. It
    retains the sequence of the experimentally studied catalytic region but has a
    substantially different C-terminal context. Activity of engineered catalytic-domain
    fragments cannot establish this natural product’s activation, interactions, localization
    or repair function.
