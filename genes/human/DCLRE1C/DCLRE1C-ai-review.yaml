  review:
    summary: Refine the documented nuclease reaction to DNA endonuclease activity.
    action: MODIFY
    reason: The actual Reactome reaction is DNA double-strand-break end processing.
      Catalyst 175587 reaches the 1–692-residue Q96SD1 component through complex 5687161,
      and the human biochemical evidence concerns internal DNA cleavage, including
      hairpin opening and overhang processing. DNA endonuclease activity is more informative
      than the nucleic-acid-wide parent and complements the separately retained ssDNA-specific
      annotation. The phosphorylated Reactome forms are modelled proteoforms, not
      evidence that all splice products are equivalent; DNA-PKcs activation should
      not be conflated with a universal requirement to phosphorylate Artemis itself.
