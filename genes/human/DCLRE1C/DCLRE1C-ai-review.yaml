  - SGD:S000004745
  review:
    summary: Damaged-DNA recognition is consistent with the inherited repair-nuclease
      function.
    action: KEEP_AS_NON_CORE
    reason: The literal IBD lies at family root PTN000581728, ancestral to the exact
      human sequence, and is grounded in the experimental yeast PSO2 annotation. This
      is a curator-inferred ancestral function, not a pairwise similarity transfer.
      The term denotes binding to damaged DNA and does not require recognition of a
      chemically modified base. Artemis processes DNA break-end structures in NHEJ;
      the inference is retained with the original evidence code, without claiming that
      the yeast source directly assayed human Artemis or established a damage-specific
      affinity constant. Separately read structural work observes a DNA overhang contacting
      the Artemis active site, with partial-occupancy and disorder limitations; it does
      not measure affinity for chemically modified bases. This broad inherited DNA-recognition
      descriptor is retained as non-core; the established catalytic end-processing activity
      is represented by the endonuclease core.
