      from single-stranded DNA, with conflicting purification results and uncertain
      physiological importance.
    action: MODIFY
    reason: 'Narrow the nucleic-acid-wide term to the experimentally tested single-stranded
      DNA substrate. The original PMID:11955432 abstract explicitly reports this activity;
      its full original was not recovered. In the separately read full original PMID:20347402,
      hydroxyapatite fractionation separated most exonuclease activity from Artemis
      while retaining endonuclease activity, raising a genuine contamination concern.
      This is weighed against the later original PMID:24500713: recombinant human
      WT Artemis and H115A were purified from insect cells; the mutation reduced both
      activities, WT and mutant had comparable circular-dichroism profiles and retained
      DNA-PKcs association, and cofractionation, poly(dA) substrates, 3′-labelled
      substrate time courses and inhibitor controls supported intrinsic, nonprocessive
      5′ exonuclease activity. The independent full-length preparation in PMID:34387696
      also showed weak exonuclease activity, whereas its engineered catalytic-domain
      construct did not. Taken together these data support retaining and specifying
      the biochemical activity rather than removing it as contamination or treating
      it as equivalent to the dominant endonuclease function. Its contribution to
      repair in vivo remains unresolved and it is not made a separate core function.
      No activity is transferred to the four natural products merely from their sequences.'
