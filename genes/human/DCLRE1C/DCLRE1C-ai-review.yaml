- term:
    id: GO:0000014
    label: single-stranded DNA endonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:11955432
  qualifier: enables
  review:
    summary: Artemis cleaves internal phosphodiester bonds in exposed single-stranded
      DNA and at single-strand/double-strand junctions, including DNA hairpins and
      overhangs.
    action: ACCEPT
    reason: 'PMID:11955432 reports hairpin and overhang endonucleolysis by Artemis
      with DNA-PKcs. Its original full body remained inaccessible after bounded retrieval,
      so its detailed experiments are not claimed as read. The activity is independently
      established by the full original PMID:20117966: purified recombinant human Artemis
      cleaved 5′- and 3′-labelled ssDNA, with time-course products consistent with
      internal cleavage rather than 3′ exonucleolysis, and the activity tracked purification
      and antibody effects. This matches the current GO definition. PMID:16874298
      additionally demonstrates human Artemis-mediated hairpin and overhang cleavage
      with DNA-PK. DNA-PKcs autophosphorylation can enable the reaction without requiring
      phosphorylation of Artemis itself; salt, Ku, substrate and construct affect
      the observed requirements. These are catalytic experiments, not an inference
      from repair necessity or family membership. Retain the source assertion and
      its unqualified product scope, without assigning the activity to all splice
      products.'
    additional_reference_ids:
    - PMID:20117966
    - PMID:16874298
    - PMID:34387696
    supported_by:
    - reference_id: PMID:11955432
      supporting_text: 'Artemis acquires endonucleolytic activity

        on 5'' and 3'' overhangs, as well as hairpins.'
- term:
