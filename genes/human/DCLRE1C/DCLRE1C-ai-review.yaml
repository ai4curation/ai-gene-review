  review:
    summary: Artemis contributes to telomere stability in particular cellular contexts.
    action: KEEP_AS_NON_CORE
    reason: The PAINT assertion is placed at PTN002757677 on the actual human lineage.
      Its literal descendant evidence includes mouse Dclre1c as well as Apollo and
      MRT-1 homologs; donor count or target/paralog naming does not invalidate the
      placement. Independently, human Artemis-defective fibroblasts show mild telomeric
      fusion and population-doubling-dependent telomere-dysfunction phenotypes. The
      younger cells did not show the same TIF defect, and the study did not identify
      a direct Artemis telomere-incision reaction. Retain the contextual contribution
      without elevating telomere maintenance to the principal nuclease role.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:12615897
    - reference_id: PMID:20678254
      supporting_text: 'defective Artemis causes a mild telomere

        dysfunction phenotype in human cell lines.'
