- id: PMID:34387696
  title: Structural and mechanistic insights into the Artemis endonuclease and strategies
    for its inhibition.
  findings:
  - statement: Full-length and engineered-domain structures and assays support end
      recognition and distinguish weak full-length exonuclease activity from the truncated
      preparation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: EuropePMC/PMC identity checked; actual selected Methods/Results/captions
      read. Direct structures and assays distinguish full-length 692-aa Artemis from
      engineered catalytic-domain constructs around residues 1–361/362. Weak exonuclease
      is reported for full-length but not truncated protein. Metal occupancy depends
      on purification, and the physiological metal complement is not claimed to be
      settled. No natural short-product function is inferred. Its Asp116 ligand numbering
      conflicts with the frozen canonical Cys116; no individual ligand geometry is
      asserted.
  full_text_unavailable: false
