    summary: Artemis contributes a DNA-end-processing step to nonhomologous end joining.
    action: ACCEPT
    reason: The NHEJ IBD at PTN000581728 is on the reconstructed human lineage and
      has a literal Dictyostelium Dclre1 experimental donor. That distant donor is
      a valid basis for the curated ancestral inference, not a reason to reject it.
