proposed_new_terms:
- proposed_name: glycine:sodium:chloride symporter activity
  proposed_definition: >-
    Enables the transfer of a solute or solutes from one side of a membrane to the other according to
    the reaction: glycine(out) + Na+(out) + Cl-(out) = glycine(in) + Na+(in) + Cl-(in).
  justification: >-
    GlyT1 (and GlyT2) obligately co-transport glycine with both Na+ and Cl-. The most specific
    existing GO MF term, GO:0015375 glycine:sodium symporter activity, captures only the Na+
    co-substrate and omits the obligatory chloride. GO already has the analogous GO:0140814 glycine
    betaine:sodium:chloride symporter activity, so a parallel glycine:sodium:chloride symporter
    activity term is warranted. It would be a child of GO:0015375 and of GO:0015378 sodium:chloride
    symporter activity. (This mirrors the proposal filed for GlyT2/SLC6A5.)
  proposed_parent:
    id: GO:0015375
    label: glycine:sodium symporter activity
  supported_by:
  - reference_id: file:human/SLC6A9/SLC6A9-uniprot.txt
    supporting_text: glycine(out) + chloride(out) + 2 Na(+)(out) = glycine(in) + chloride(in) + 2
      Na(+)(in)
    record_section:
    - CC:CATALYTIC ACTIVITY
suggested_questions:
- question: >-
    Does the Cl- dependence of GlyT1 reflect a fixed-stoichiometry Cl- co-transport (symport) or an
    allosteric/permeation role, and should GO represent a distinct glycine:sodium:chloride symporter
    activity term for the SLC6 glycine transporters?
- question: >-
    Under what physiological conditions does the lower-coupling (2:1:1) GlyT1 operate in reverse
    (glycine efflux) versus net uptake, and how does this bidirectionality shape the NMDA-receptor
    co-agonist glycine pool?
suggested_experiments:
- description: >-
    Electrophysiological and radiotracer flux measurement of the Na+:Cl-:glycine coupling
    stoichiometry of human GlyT1 expressed in oocytes/cells to confirm the 2:1:1 ratio and the
    reduced electrogenicity/concentrative capacity relative to GlyT2.
- description: >-
    Endogenous immuno-electron microscopy / sub-cellular fractionation of brain tissue to resolve the
    rat-ortholog-transferred organelle annotations (dense core granule, synaptic vesicle membrane,
    postsynaptic density) and determine whether any reflect a real GlyT1 pool beyond the plasma
    membrane and recycling endosomes.
