id: P48067
gene_symbol: SLC6A9
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC6A9 (GlyT1) is a sodium- and chloride-dependent glycine transporter of the SLC6 /
  neurotransmitter:sodium symporter (SNF/NSS) family. It is a 12-transmembrane, plasma-membrane
  secondary-active symporter that couples the inward movement of glycine to the co-transport of
  2 Na+ and 1 Cl- (glycine(out) + Cl-(out) + 2 Na+(out) = glycine(in) + Cl-(in) + 2 Na+(in)).
  The relatively low Na+ coupling (2:1:1, versus 3:1:1 for the neuronal transporter GlyT2/SLC6A5)
  makes GlyT1 less concentrative and able to operate bidirectionally. In the central nervous
  system GlyT1 is expressed predominantly by astrocytes adjacent to glycinergic neurons, where it
  clears glycine from the extracellular space and synaptic cleft, controlling the ambient and
  synaptic glycine concentration, including the glycine pool that acts as an obligatory co-agonist
  at NMDA-type glutamate receptors. Its glycine uptake is high-affinity (Km ~90 uM) and is
  inhibited by sarcosine, distinguishing it from the sarcosine-insensitive GlyT2. GlyT1 is also
  expressed basolaterally in polarized epithelia such as enterocytes and provides glycine for
  intracellular metabolism. Loss of GlyT1 function causes a glycine encephalopathy with normal
  serum glycine and raised CSF glycine, while heterozygous hypomorphic variants are associated
  with idiopathic scoliosis.
