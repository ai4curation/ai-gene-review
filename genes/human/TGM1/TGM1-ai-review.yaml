suggested_questions:
- question: Which keratinocyte envelope substrates require TGM1 rather than TGM3 or TGM5 in vivo,
    and in what temporal order are they crosslinked?
- question: Which physiological proteases generate the high-activity 67/33 kDa TGM1 form in
    differentiating human epidermis?
