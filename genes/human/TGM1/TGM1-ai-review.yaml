id: P22735
gene_symbol: TGM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TGM1 encodes the epidermal protein-glutamine gamma-glutamyltransferase that catalyzes calcium-dependent
  isopeptide crosslinks between cornified-envelope precursor proteins. It partitions between a soluble
  cytosolic pool and a fatty-acylated cytoplasmic face of the plasma membrane, where proteolytically activated
  TGM1 crosslinks involucrin, loricrin, small proline-rich proteins, envoplakin, periplakin and related
  substrates onto the growing cornified envelope. This covalent scaffold, together with TGM1-dependent
  attachment of omega-hydroxyceramides, is essential for terminal keratinocyte differentiation and for
  epidermal barrier formation.'
