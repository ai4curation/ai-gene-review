description: Keratin-associated protein 2-1 (KAP2.1) is a 128-residue high-sulfur keratin-associated protein of the KAP2 family, encoded in the KRTAP cluster within the type I keratin locus on chromosome 17q21. Like other high-sulfur KAPs it is cysteine-rich and is predicted to be deposited in the keratinizing zone of the hair cortex as a component of the interfilamentous matrix, where disulfide cross-linking with hair keratin intermediate filaments generates the rigid hair shaft. Human-specific expression data are limited to cDNA isolation from scalp; the ovine orthologue is variable and its variants have been associated with mean wool fibre diameter.
