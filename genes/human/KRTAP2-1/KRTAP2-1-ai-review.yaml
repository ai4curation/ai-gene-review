suggested_questions:
- question: Where in the human hair follicle (cortex versus cuticle) is KAP2.1 protein deposited, given that human expression evidence is limited to cDNA isolation?
- question: GO lacks a cellular component term for the keratin-associated interfilamentous matrix of the hair cortex/cuticle; should one be requested, as keratin filament is only an approximation?
suggested_experiments:
- hypothesis: KAP2.1 is a cortex matrix protein of the keratogenous zone.
  description: RNA in situ hybridization and immunostaining of human anagen scalp follicles with KRTAP2-1-specific 3' UTR probes and antibodies.
  experiment_type: expression localization
