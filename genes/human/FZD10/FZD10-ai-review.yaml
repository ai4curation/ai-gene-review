  - UniProtKB:O19116
  - UniProtKB:Q863H1
  - UniProtKB:Q8N474
  - UniProtKB:Q96HF1
  review:
    summary: Extracellular region inherited from the secreted Frizzled-related protein node.
    action: REMOVE
    reason: The asserting node PTN002259328 is the sFRP1/sFRP2 clade, where the extracellular location
      is paired with recorded losses of plasma membrane and Wnt receptor activity (see the PTHR11309 family
      review). FZD10 is a signal-peptide-bearing seven-transmembrane receptor whose extracellular domain
      is exposed at the cell surface; it is not a secreted protein, so the term is over-propagated to
      this receptor.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002259328
        comment: sFRP1/sFRP2 node asserting extracellular region together with IRD losses of plasma membrane
          and Wnt receptor activity; appropriate for secreted sFRPs but not for a seven-transmembrane
          Frizzled receptor.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
    supported_by:
    - reference_id: file:human/FZD10/FZD10-uniprot.txt
      supporting_text: Multi-pass membrane protein
    - reference_id: PMID:18271942
      supporting_text: MAb 92‐13 bound to cell surfaces of four FZD10‐overexpressing synovial sarcoma
        cell lines
