id: Q9ULW2
gene_symbol: FZD10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FZD10 (Frizzled-10, CD350) is a class F seven-transmembrane receptor of the plasma membrane
  with an N-terminal extracellular cysteine-rich (Frizzled) domain that binds lipidated Wnt ligands and
  a cytoplasmic C-terminal tail carrying the Dishevelled-interacting KTxxxW motif and a PDZ-binding motif.
  Together with its closest paralog FZD9 it forms a distinct Frizzled subfamily. FZD10 transduces Wnt
  signals into both beta-catenin-dependent signaling (for example with WNT9A and WNT9B) and beta-catenin-independent
  Dishevelled-Rac1-JNK signaling that remodels the actin cytoskeleton. It is expressed mainly in placenta
  and fetal kidney, lung and brain, is largely absent from adult tissues, and is strongly overexpressed
  at the cell surface of synovial sarcomas, where its exposed extracellular domain has been used as an
  antibody target.
