suggested_questions:
- question: Which Wnt ligands engage FZD10 in its physiological sites of expression (placenta, fetal kidney,
    cerebellum), and with which co-receptors (LRP5/6, ROR, RYK)?
- question: Is the cytoplasmic FZD10 signal reported in tumor tissue an endocytic pool, a biosynthetic
    pool, or an antibody artifact?
suggested_experiments:
- description: Surface biotinylation and live-cell antibody uptake assays in synovial sarcoma cells to
    quantify the surface versus internal pools of endogenous FZD10 and its constitutive endocytosis rate.
- description: Direct binding assays (BLI/SPR) of purified FZD10 CRD with WNT9A, WNT9B and WNT7A to establish
    ligand affinities underlying the reporter-based selectivity.
