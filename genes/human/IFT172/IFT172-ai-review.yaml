- term:
    id: GO:0030991
    label: intraciliary transport particle A
  evidence_type: IDA
  original_reference_id: PMID:26980730
  qualifier: part_of
  review:
    summary: >-
      Part of intraciliary transport particle A (IFT-A), IDA from the Katoh et al. 2016 VIP study of IFT-B
      architecture. IFT172 is a peripheral (IFT-B2) subunit of the IFT-B complex, not of IFT-A.
    action: REMOVE
    reason: >-
      IFT-A and IFT-B are biochemically distinct subcomplexes (IFT-A: IFT144/WDR19, IFT140, IFT122, IFT139/TTC21B,
      IFT121/WDR35, IFT43). The cited paper itself mapped IFT172 as a subunit of the IFT-B complex (and
      the same paper supports the GO:0030992 IFT-B annotation for IFT172); the IFT-A term is contradicted
      by decades of biochemistry and structural work, and the same IDA appears on every IFT-B subunit
      annotated from this paper, consistent with a batch term-selection error. IFT-B does associate with
      IFT-A within IFT trains, but train co-assembly is not complex membership. This is a genuinely contradicted
      claim, not a judgment based on an abstract foregrounding a different gene.
    supported_by:
    - *id004
    - *id001
    - reference_id: PMID:15955805
      supporting_text: >-
        IFT particles contain multiple copies of two distinct protein complexes, A and B, which contain
        at least 6 and 11 protein subunits, respectively.
    - reference_id: PMID:27932497
      supporting_text: >-
        Intraflagellar transport (IFT)-A and -B complexes mediate retrograde and anterograde ciliary protein
        trafficking, respectively.
