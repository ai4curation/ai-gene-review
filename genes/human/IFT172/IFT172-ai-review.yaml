    label: sperm cytoplasmic droplet
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q6VH22
  - ensembl:ENSMUSP00000049335
  review:
    summary: >-
      Located in sperm cytoplasmic droplet (IEA, GO_REF:0000107); transferred from rodent spermatogenesis
      studies.
    action: KEEP_AS_NON_CORE
    reason: >-
      IFT is required for sperm flagellum assembly and IFT proteins are detected in spermatid structures
      (manchette, acrosome region, flagellum). These are plausible cell-type-specific locations for IFT172
      but are outside its core ciliary role.
- term:
    id: GO:1903561
    label: extracellular vesicle
  evidence_type: HDA
  original_reference_id: PMID:24769233
  qualifier: located_in
  review:
    summary: Located in extracellular vesicle (HDA, CSF extracellular vesicle proteomics).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Detection in a large-scale proteomic inventory of cerebrospinal-fluid EVs (1315 proteins) does not
      establish a functional extracellular-vesicle localization for IFT172; it may reflect ciliary ectosome
      shedding or contamination. Not part of its characterized biology.
    supported_by:
    - reference_id: PMID:24769233
      supporting_text: >-
        We report an extensive catalog of 1315 proteins identified in EVs isolated from two different
        CSF pools by ultracentrifugation, including 230 novel EV proteins.
