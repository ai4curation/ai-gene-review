id: Q9UG01
gene_symbol: IFT172
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  IFT172 is the largest IFT protein (~198 kDa), composed of N-terminal WD40 beta-propellers and an extended
  C-terminal TPR-like domain, and is a peripheral (IFT-B2) subunit of the intraflagellar transport B complex;
  it dissociates from the IFT-B core at high salt. As part of IFT-B, IFT172 travels on anterograde IFT
  trains and is required for cilium formation and maintenance; work in model organisms implicates it in
  IFT turnaround at the ciliary tip and membrane association of trains. IFT172 localizes to the axoneme
  and around the ciliary base. Biallelic IFT172 variants cause short-rib thoracic dysplasia 10 (Jeune
  and Mainzer-Saldino syndromes), Bardet-Biedl syndrome 20 and isolated retinitis pigmentosa 71; patient
  fibroblasts show disturbed ciliary composition, and Ift172 mouse mutants lack cilia and Hedgehog signalling.
