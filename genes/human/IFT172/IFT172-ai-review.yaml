core_functions:
- description: >-
    IFT172 is a peripheral IFT-B2 subunit that travels with anterograde trains and is required for cilium
    assembly and maintenance; its precise molecular activity (proposed roles in tip turnaround and train-membrane
    association) is not established in human cells, so no molecular-function term is asserted.
  directly_involved_in:
  - id: GO:0035720
    label: intraciliary anterograde transport
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0036064
    label: ciliary basal body
  - id: GO:0005930
    label: axoneme
  - id: GO:0005929
    label: cilium
  in_complex:
    id: GO:0030992
    label: intraciliary transport particle B
  supported_by:
  - *id004
  - *id001
  - *id006
  - reference_id: file:human/IFT172/IFT172-deep-research-falcon.md
    supporting_text: >-
      Membrane association and binding of IFT57 to IFT172 appear mutually exclusive, suggesting a possible
      way to regulate when IFT172 associates with membranes versus an assembling IFT complex.
suggested_questions:
- question: >-
    Does human IFT172 act at the ciliary tip in remodelling anterograde into retrograde trains, as proposed
    from Chlamydomonas fla11 mutants?
- question: >-
    Is the in vitro phospholipid-membrane binding and remodelling activity of IFT172 (Wang et al. 2018)
    used in cilia, and would it warrant a lipid-binding molecular-function annotation?
suggested_experiments:
- description: >-
    Acute degradation (degron) of IFT172 in ciliated human cells with live IFT imaging to distinguish
    roles in ciliary entry, tip turnaround and retrograde return of IFT-B.
