id: Q96RY7
gene_symbol: IFT140
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IFT140 (C. elegans CHE-11) is a large WD40-repeat/TPR-repeat subunit of the core of intraflagellar transport complex A (IFT-A), together with IFT122 and IFT144/WDR19; the peripheral IFT-A subcomplex contains IFT43, IFT121/WDR35 and IFT139/TTC21B. IFT-A is carried into the cilium on anterograde IFT trains and then, with cytoplasmic dynein-2, drives retrograde transport of IFT-B, BBSome and membrane cargo from the ciliary tip back to the base. Through its cargo adaptor TULP3, which binds membrane phosphoinositides, IFT-A also mediates ciliary entry of membrane proteins, notably G protein-coupled receptors such as SSTR3, MCHR1, GPR161 and GPR45. IFT140 localizes to the basal body, the axoneme and the ciliary tip. Mutations in IFT140 cause skeletal ciliopathies (Mainzer-Saldino syndrome, Jeune asphyxiating thoracic dystrophy / short-rib thoracic dysplasia 9), retinitis pigmentosa and an adult-onset polycystic kidney disease, and mouse Ift140 is required for photoreceptor outer segment development and opsin delivery.
