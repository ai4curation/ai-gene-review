core_functions:
- description: As a core subunit of IFT-A (with IFT122 and IFT144), IFT140 contributes to the cargo-carrying activity of the IFT-A complex, which together with cytoplasmic dynein-2 returns IFT-B, BBSome and membrane cargo from the ciliary tip to the base.
  contributes_to_molecular_function:
    id: GO:0140597
    label: protein carrier chaperone
  directly_involved_in:
  - id: GO:0035721
    label: intraciliary retrograde transport
  in_complex:
    id: GO:0030991
    label: intraciliary transport particle A
  locations:
  - id: GO:0005930
    label: axoneme
  - id: GO:0036064
    label: ciliary basal body
  supported_by:
  - reference_id: PMID:22503633
    supporting_text: IFT140 is one of the six currently known components of the intraflagellar transport complex A (IFT-A) that regulates retrograde protein transport in ciliated cells.
  - reference_id: PMID:36775821
    supporting_text: Here we report cryo-EM structures of human IFT-A complexes in the presence and absence of TULP3 at overall resolutions of 3.0-3.9
- description: With its cargo adaptor TULP3, IFT-A (including IFT140) mediates ciliary entry of membrane proteins, notably G protein-coupled receptors, into primary cilia.
  contributes_to_molecular_function:
    id: GO:0140597
    label: protein carrier chaperone
  directly_involved_in:
  - id: GO:0097499
    label: protein localization to non-motile cilium
  in_complex:
    id: GO:0030991
    label: intraciliary transport particle A
  locations:
  - id: GO:0097730
    label: non-motile cilium
  supported_by:
  - reference_id: PMID:20889716
    supporting_text: TULP3 and IFT-A, in turn, promote trafficking of a subset of G protein-coupled receptors (GPCRs), but not Smoothened, to cilia.
  - reference_id: PMID:27932497
    supporting_text: In control cells, the IFT-A complex is required for ciliary entry of GPCRs and anterogradely trafficked along with the IFT-B complex.
proposed_new_terms: []
suggested_questions:
- question: Does IFT140 directly contact TULP3 or membrane cargo, or does it act purely as a structural scaffold of the IFT-A core?
- question: How do IFT140 variants causing isolated retinal degeneration or adult polycystic kidney disease differ mechanistically from those causing skeletal ciliopathies?
suggested_experiments:
- description: Express structure-guided IFT140 interface mutants in IFT140-knockout RPE1 cells to separate IFT-A assembly, TULP3/GPCR ciliary entry and retrograde transport functions.
- description: Live imaging of IFT-A and IFT-B trains in patient-derived IFT140 variant cells to quantify retrograde train frequency and velocity.
