suggested_questions:
- question: >-
    Which IFT140 surfaces contact TULP3 and IFT-B within trains, and do PKD9-associated monoallelic variants
    act through reduced dosage of IFT-A or through impaired membrane-protein import?
- question: >-
    Should the module annotate IFT-A with both retrograde transport and ciliary membrane-protein import,
    rather than retrograde transport alone?
suggested_experiments:
- description: >-
    Compare IFT140 knockout rescues carrying PKD9, SRTD9 and RP80 variants for retrograde IFT (tip accumulation
    of IFT-B) versus TULP3-dependent GPCR import (GPR161, SSTR3 ciliary levels).
