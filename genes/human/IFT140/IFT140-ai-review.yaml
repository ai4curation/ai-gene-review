- term:
    id: GO:0035720
    label: intraciliary anterograde transport
  evidence_type: IDA
  original_reference_id: PMID:20889716
  qualifier: involved_in
  review:
    summary: >-
      Involved in intraciliary anterograde transport (IDA, PMID:20889716). IFT-A (with its adaptor TULP3)
      is required for ciliary entry of membrane proteins such as GPCRs, and IFT-A rides anterograde trains
      as a passenger before acting in retrograde transport.
    action: KEEP_AS_NON_CORE
    reason: >-
      The anterograde motor-driven movement of trains is powered by kinesin-2 with IFT-B as the train
      backbone; IFT-A's distinctive roles are retrograde transport and import/entry of membrane cargo
      (via TULP3). IFT140-containing IFT-A does travel on anterograde trains and is needed for ciliary
      entry of GPCRs, so the annotation is defensible, but it should not be read as IFT-A driving anterograde
      transport. Kept as non-core; 'protein localization to non-motile cilium' better captures the experimental
      finding. Note the cached text of PMID:40472089 does not show an IFT140-specific assay; the curator's
      reading of the full text is deferred to.
    supported_by:
    - &id011
      reference_id: PMID:20889716
      supporting_text: >-
        IFT-A is linked to retrograde ciliary transport, but, surprisingly, we find that the IFT-A complex
        has a second role directing ciliary entry of TULP3.
    - &id016
      reference_id: PMID:20889716
      supporting_text: >-
        TULP3 and IFT-A, in turn, promote trafficking of a subset of G protein-coupled receptors (GPCRs),
        but not Smoothened, to cilia.
