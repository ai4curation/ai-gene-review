id: Q96RY7
gene_symbol: IFT140
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  IFT140 is a large (~165 kDa) WD40 beta-propeller and TPR-repeat protein and one of the three core subunits
  (IFT122, IFT140, WDR19/IFT144) of the intraflagellar transport A complex. IFT-A rides anterograde IFT
  trains to the ciliary tip and is required for dynein-2-driven retrograde transport, so loss of IFT-A
  function causes IFT-B and cargo to accumulate in bulged ciliary tips. Through its core-associated adaptor
  TULP3, which binds membrane phosphoinositides, IFT-A also mediates ciliary entry of membrane proteins,
  including GPCRs such as GPR161, and so contributes to ciliary Hedgehog and other GPCR signalling. IFT140
  localizes mainly to the ciliary base, with weaker signal along the axoneme. Biallelic IFT140 variants
  cause short-rib thoracic dysplasia 9 (Mainzer-Saldino and Jeune syndromes), cranioectodermal dysplasia
  5 and non-syndromic retinitis pigmentosa 80, and monoallelic loss-of-function variants cause an autosomal
  dominant polycystic kidney disease (PKD9).
