id: Q9UDR5
gene_symbol: AASS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AASS (alpha-aminoadipic semialdehyde synthase; LKR/SDH) is a mitochondrial bifunctional enzyme
  that catalyzes the first two steps of the saccharopine pathway of L-lysine degradation. Its N-terminal
  lysine-2-oxoglutarate reductase domain (LKR/LOR, EC 1.5.1.8) condenses L-lysine with 2-oxoglutarate
  using NADPH to form saccharopine. Its C-terminal saccharopine dehydrogenase domain (SDH, EC 1.5.1.9)
  uses NAD+ to convert saccharopine to alpha-aminoadipic semialdehyde and L-glutamate. The reactions
  operate in the mitochondrial matrix. Biallelic AASS defects cause hyperlysinemia, often a biochemical
  phenotype with limited clinical consequences; severe neurological findings can have additional
  causes. Selective SDH impairment with retained LKR activity produces saccharopine accumulation.
  Saccharopine toxicity and mitochondrial injury are demonstrated in animal models, while the clinical
  consequences of this biochemical subtype in humans remain incompletely resolved.
