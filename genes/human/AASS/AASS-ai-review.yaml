- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      ISS transfer from Drosophila dLKR/SDH (Q9VLX0), with experimentally grounded donor evidence
      in PMID:18695041. Conservation of this moonlighting function in human AASS remains unresolved.
    action: UNDECIDED
    reason: >-
      The donor study directly demonstrates ecdysone-dependent repression of dronc/ark transcription
      in Drosophila, including promoter occupancy and mutant effects. Shared LKR and SDH domains
      and the reported 51% identity make a conserved moonlighting interaction plausible. However,
      receptor recruitment and promoter context were tested in the EcR/Usp system, and the relevant
      interaction surfaces have not been mapped onto human AASS. Sequence homology alone does not
      resolve this contextual function. No demonstrated human loss or prohibition on dual localization
      is claimed.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: UniProtKB:Q9VLX0
        source_status: UNRESOLVED
        comment: >-
          QuickGO traces the source annotation to PMID:18695041, whose full text confirms the fly
          assay. The source is sound; conserved domains support plausibility, but the relevant targeting/interaction
          determinants and human regulatory context are insufficiently resolved for a confident transfer
          decision.
        source_label: Drosophila melanogaster LKRSDH
    supported_by:
    - reference_id: PMID:18695041
      supporting_text: >-
        dLKR/SDH binds histones H3 and H4 and suppresses ecdysone-mediated transcription of cell
        death genes by inhibiting histone H3R17me2 mediated by the Drosophila arginine methyl transferase
        CARMER.
    - reference_id: PMID:18695041
      supporting_text: >-
        dLKR/SDH is 51% identical and 71% similar to mouse and human LKR/SDH.
