      Human AASS variants establish hyperlysinemia; severe neurological findings in two patients
      with a contiguous AASS/PTPRZ1 deletion may reflect the additional gene loss.
    supporting_text: >-
      As hyperlysinemia is generally considered a benign metabolic variant, the more severe neurological
      disease course in two patients with a contiguous deletion syndrome may be explained by the
      additional loss of PTPRZ1.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Entrez-verified primary human genetic study; full text read. The authors distinguish causal
      biochemical deficiency from uncertain clinical attribution.
