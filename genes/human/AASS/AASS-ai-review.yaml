- term:
    id: GO:0004754
    label: saccharopine dehydrogenase (NAD+, L-lysine-forming) activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      The fly-derived NAD-dependent lysine-forming reaction differs from human LKR/LOR chiefly in
      cofactor specificity. The appropriate human term is the NADP-dependent lysine-forming activity
      GO:0047130.
    action: MODIFY
    reason: >-
      QuickGO definitions distinguish GO:0004754 (NAD+/NADH, lysine and 2-oxoglutarate) from GO:0047130
      (NADP+/NADPH, the same products). The donor paper explicitly measures NADH oxidation by recombinant
      fly dLKR/SDH. Human LOR biochemistry instead supports NADPH usage and measures both forward
      and reverse reactions. Thus the previous biosynthetic-direction objection was incorrect, and
      substituting glutamate-forming GO:0047131 would switch to the other AASS domain. Modify this
      transfer to GO:0047130; no additional redundant NEW annotation is needed.
    proposed_replacement_terms:
    - id: GO:0047130
      label: saccharopine dehydrogenase (NADP+, L-lysine-forming) activity
    supported_by:
    - reference_id: PMID:36128717
      supporting_text: >-
        Another important difference between LYS1 and LOR is that the human protein evolved to use
        NADPH while yeast uses NADH.
    - reference_id: PMID:36128717
      supporting_text: >-
        The rate of the reverse reaction was considerably slower than that of the forward reaction,
        which is consistent with previous reports [23].
    - reference_id: PMID:18695041
      supporting_text: >-
        By using lysine as a substrate, we measured oxidation of NADH to NAD+ and observed a time-dependent
        decrease in NADH, implying that the full-length protein is enzymatically active (Fig. 2 A).
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: UniProtKB:Q9VLX0
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The donor paper assays NADH oxidation, supporting the fly source. The human N-terminal
          reductase instead uses NADPH; the catalytic-domain homology does not preserve this cofactor-specific
          annotation.
        source_label: Drosophila melanogaster LKRSDH
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
