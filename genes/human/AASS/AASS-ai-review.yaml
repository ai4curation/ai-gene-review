proposed_new_terms: []
suggested_questions:
- question: >-
    Are the histone-contact and receptor-recruitment surfaces responsible for Drosophila dLKR/SDH
    moonlighting conserved and functional in human AASS, and can endogenous human AASS access a nuclear
    or stable cytosolic pool?
- question: >-
    How do genetically resolved human selective SDH defects, saccharopine concentrations and clinical
    outcomes compare with the severe phenotypes of selective SDH mutations in mouse and worm models?
- question: >-
    Do the allosteric mechanisms reported in the 2026 human AASS preprint operate at endogenous metabolite
    concentrations in mitochondria?
suggested_experiments:
- description: >-
    Combine endogenous AASS tagging and validated subcellular fractionation in human cells with histone-binding
    and receptor-recruitment assays. Compare mitochondrial targeting and the fly interaction domains
    without inferring loss of function from the mitochondrial targeting sequence alone.
- description: >-
    Measure LKR and SDH activities separately, together with lysine and saccharopine, in genetically
    characterized patient cells to distinguish combined deficiency from a selective second-step block.
