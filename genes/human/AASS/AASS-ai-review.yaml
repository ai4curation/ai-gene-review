    summary: >-
      ISS transfer from Drosophila dLKR/SDH (Q9VLX0), with experimentally grounded donor evidence
      in PMID:18695041. Conservation of this localization in human AASS remains unresolved.
    action: UNDECIDED
    reason: >-
      Fractionation and tagged-protein experiments establish cytosolic fly dLKR/SDH. Human AASS carries
      a mitochondrial targeting sequence and has mitochondrial evidence, but those facts do not exclude
      a smaller or conditional cytosolic pool. The donor has dynamic localization and no experimentally
      mapped targeting mechanism whose conservation can be judged here. Transfer of this specific
      extra-mitochondrial distribution remains unresolved, rather than contradicted.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: UniProtKB:Q9VLX0
        source_status: UNRESOLVED
        comment: >-
          QuickGO traces the source annotation to PMID:18695041, whose full text confirms the fly
          assay. The source is sound; conserved domains support plausibility, but the relevant targeting/interaction
          determinants and human regulatory context are insufficiently resolved for a confident transfer
          decision.
        source_label: Drosophila melanogaster LKRSDH
    supported_by:
    - reference_id: PMID:18695041
      supporting_text: >-
        dLKR/SDH was readily detectable in the cytosol of both untreated and ecdysone-treated cells.
