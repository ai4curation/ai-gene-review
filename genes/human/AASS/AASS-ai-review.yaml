core_functions:
- description: >-
    Lysine-ketoglutarate reductase (LKR) activity: the N-terminal domain condenses
    L-lysine with 2-oxoglutarate to form L-saccharopine, using NADPH, as the first
    committed step of the saccharopine pathway of L-lysine degradation in the
    mitochondrial matrix.
  molecular_function:
    id: GO:0047130
    label: saccharopine dehydrogenase (NADP+, L-lysine-forming) activity
  directly_involved_in:
  - id: GO:0019477
    label: L-lysine catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:36128717
    supporting_text: >-
      Another important difference between LYS1 and LOR is that the human protein evolved to use
      NADPH while yeast uses NADH.
  - reference_id: PMID:36128717
    supporting_text: >-
      The rate of the reverse reaction was considerably slower than that of the forward reaction,
      which is consistent with previous reports [23].
  - reference_id: Reactome:R-HSA-70938
    supporting_text: >-
      homotetramer in the mitochondrial matrix
- description: >-
    Saccharopine dehydrogenase (SDH) activity: the C-terminal domain oxidizes
    L-saccharopine to L-2-aminoadipate-6-semialdehyde (alpha-aminoadipic semialdehyde)
    and L-glutamate, reducing NAD+, as the second step of the saccharopine pathway of
    L-lysine degradation in the mitochondrial matrix.
  molecular_function:
    id: GO:0047131
    label: saccharopine dehydrogenase (NAD+, L-glutamate-forming) activity
  directly_involved_in:
  - id: GO:0019477
    label: L-lysine catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:36128717
    supporting_text: >-
      SDH then oxidizes saccharopine into 2-aminoapidic semialdehyde and glutamate (EC 1.5.1.9).
  - reference_id: PMID:463877
    supporting_text: >-
      In all instances there was a deficiency in lysine-ketoglutarate reductase, saccharopine dehydrogenase,
      and saccharopine oxidoreductase activities.
  - reference_id: Reactome:R-HSA-70940
    supporting_text: >-
      homotetramer in the mitochondrial matrix
