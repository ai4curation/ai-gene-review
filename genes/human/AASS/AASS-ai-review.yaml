- id: PMID:18695041
  title: dLKR/SDH regulates hormone-mediated histone arginine methylation and transcription of
    cell death genes.
  findings:
  - statement: >-
      Fly dLKR/SDH binds histones and represses ecdysone-responsive transcription independently of
      its metabolic catalytic activity.
    supporting_text: >-
      dLKR/SDH binds histones H3 and H4 and suppresses ecdysone-mediated transcription of cell death
      genes by inhibiting histone H3R17me2 mediated by the Drosophila arginine methyl transferase
      CARMER.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Entrez-verified donor study; full text read. Localization, histone and receptor interactions,
      reporter/ChIP experiments and fly genetic assays support source annotations. Mammalian sequence
      homology is discussed, but human AASS itself is not tested for these moonlighting functions.
      The discussion statement that mammalian LKR cannot run in reverse is superseded by direct human
      assays in PMID:36128717.
- id: PMID:30573525
