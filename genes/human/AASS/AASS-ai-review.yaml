  findings:
  - statement: >-
      Human LOR uses NADPH, and both full-length AASS and isolated LOR show a slower reverse reaction
      in vitro.
    supporting_text: >-
      Another important difference between LYS1 and LOR is that the human protein evolved to use
      NADPH while yeast uses NADH.
