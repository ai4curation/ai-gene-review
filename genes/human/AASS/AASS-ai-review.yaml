    homeostasis.
  findings:
  - statement: >-
      Selective SDH defects cause saccharopine accumulation, mitochondrial damage and developmental
      toxicity in worm and mouse models; an LKR defect has a different phenotype.
    supporting_text: >-
      Aass(R65Q) homozygous mice were viable and developmentally indistinguishable from WT; in contrast,
      Aass(G489E) homozygous mice displayed progressive postnatal growth retardation and succumbed
      to death at ∼6 wk of age (Fig. 6, A–C).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Entrez-verified primary study; full text read. Animal-model toxicity is not generalized to
      all human AASS deficiency. Human AASS rescue in worms used engineered mitochondrial targeting
      and is not an endogenous human localization experiment.
- id: PMID:23570448
