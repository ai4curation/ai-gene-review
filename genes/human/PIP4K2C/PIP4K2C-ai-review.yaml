- term:
    id: GO:0046627
    label: negative regulation of insulin receptor signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00092083
  review:
    summary: Keep catalytic-independent suppression of insulin receptor signaling as non-core.
    action: KEEP_AS_NON_CORE
    reason: PIP4K2A/B/C can bind PIP5Ks and allosterically restrain PIP5K-dependent PI(4,5)P2
      synthesis, thereby lowering insulin-stimulated PI3K signaling, but this regulatory interaction
      is separate from the core PI5P 4-kinase reaction.
    supported_by:
    - reference_id: PMID:31091439
      supporting_text: the loss of PIP4Ks (PIP4K2A, PIP4K2B, and PIP4K2C) in vitro results in a
        paradoxical increase in PI(4,5)P2 and a concomitant increase in insulin-stimulated
        production of PI(3,4,5)P3. The reintroduction of either wild-type or kinase-dead mutants of
        the PIP4Ks restored cellular PI(4,5)P2 levels and insulin stimulation of the PI3K pathway
