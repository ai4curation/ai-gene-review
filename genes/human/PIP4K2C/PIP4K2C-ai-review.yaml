id: Q8TBX8
gene_symbol: PIP4K2C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PIP4K2C is the low-activity gamma isoform of the type-II PI5P 4-kinases. Although much
  weaker than PIP4K2A and PIP4K2B in standard biochemical assays, it retains functional PI5P
  4-kinase activity in vivo, localizes to cytoplasmic and endoplasmic-reticulum compartments by
  mouse orthology, associates strongly with autophagosomes in PI(5)P-dependent autophagy assays, and
  can allosterically restrain PIP5K-dependent insulin signaling through PIP5K1A binding.
