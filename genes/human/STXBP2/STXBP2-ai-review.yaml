    source_defects:
    - defect_type: WRONG_TERM
      resource: PANTHER
      record: PANTHER:PTN000187659
      slot: IBD annotation
      requested_change: CHECK
      asserted_value: GO:0099525 presynaptic dense core vesicle exocytosis asserted at a Munc18 node whose
        descendants include STXBP1, STXBP2 and STXBP3
      corrected_value: Move the assertion to the STXBP1 branch, or re-state it at the ancestral node with a
        term that is not neuron-specific, such as GO:0045055 regulated exocytosis or a dense core granule
        exocytosis term
      cause: OVER_PROPAGATION
      confidence: PROBABLE
      explanation: >-
        Raised as a query rather than a confirmed error because this review has not inspected the PAINT tree
        or the IBD seed set, only the resulting IBA rows. What those rows show is that all three mammalian
        Munc18 paralogs carry the term, which is consistent with a node above their divergence. Of the
        three, only STXBP1 is neuronal. A PAINT curator with the tree can see immediately whether the
        assertion sits at the ancestral node or at the STXBP1 branch; if the former, either the node or the
        term needs to move, and the choice between those two is the curator's.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
