- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-482772
  qualifier: located_in
  review:
    summary: Extracellular region, from Reactome's model of the platelet releasate.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Reactome's own summary of the event this row comes from supplies the reason not to take it at face
      value: the releasate contains proteins that do not originate in storage granules, and platelet lysis
      may be why they are there. Munc18-2 is one of those - a peripheral membrane protein with no signal
      peptide and no transmembrane segment, whose job is on the cytosolic face of the granule and whose
      sibling row from the same event, cytosol, is correct. Marked over-annotated rather than removed
      because the protein genuinely is detected outside cells, in exosome preparations from three
      independent tissues as three further rows in this record record; what is doubtful is reading
      detection in a releasate as a location.
    supported_by:
    - reference_id: Reactome:R-HSA-482772
      supporting_text: Platelet releasate contains a range of proteins that do not originate in
        specialized storage granules.
    - reference_id: Reactome:R-HSA-482772
      supporting_text: In some cases platelet lysis may contribute to the presence of these proteins in
        the platelet relesate.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: Cytosol, from curated immunofluorescence.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct, and the resting-state pool rather than the working one. Munc18-2 is a soluble SM protein
      with no transmembrane segment; it is found in plasma membrane fractions and in the cytosol, where it
      associates with cytoskeletal elements, and on stimulation it redistributes onto granules and the
      plasma membrane. So the cytosol is where the protein waits, and the four rows that assert it - from
      immunofluorescence, from neutrophil fractionation, from the mouse ortholog and from Reactome's
      platelet releasate event - all say the same true thing. Non-core rather than accepted because every
      documented activity happens after recruitment to a membrane, and not TOO_GENERAL because cytosol is a
      definite compartment rather than an uninformative parent.
    supported_by:
    - reference_id: PMID:18588921
      supporting_text: Both isoforms were also found in plasma membrane fractions and in the cytosol, where
        they associate with cytoskeletal elements.
