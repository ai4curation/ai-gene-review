core_functions:
- molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  description: >-
    Munc18-2 brings SNAREs together so that they can fuse two membranes, and the reconstituted experiment
    that shows this is unusually clean. Syntaxin-11 is lipid-anchored rather than transmembrane, and with
    its cognate SNAREs alone it supports only lipid exchange between cells without cytoplasmic continuity -
    hemifusion. Adding wild-type Munc18-2 produces complete fusion; Munc18-2 carrying mutations that
    disturb syntaxin-11 binding does not. So the activity belongs to this protein and to that binding
    surface, and it is not merely chaperoning, since the SNAREs were already in place. The chaperoning is
    real too and is the other half of the job: in cytotoxic T lymphocytes Munc18-2 sits predominantly on the
    cytolytic granule membrane with a small pool at the plasma membrane, and syntaxin-11 is lost from the
    plasma membrane in patient cells that lack Munc18-2, while Munc18-2's own localisation is unaffected in
    patient cells that lack syntaxin-11. The same activity serves a second syntaxin in a second lineage:
    syntaxin-3 on neutrophil azurophil granules, where antibody blockade of Munc18-2 prevents primary
    granule exocytosis, and at the apical membrane of enterocytes, whose failure gives FHL5 patients an
    enteropathy resembling microvillus inclusion disease. GO has no molecular-function term for an SM
    protein's templating of SNARE assembly, so the adaptor term is the closest fit rather than an exact
    one; that gap is raised as a question below.
  directly_involved_in:
  - id: GO:0035493
    label: SNARE complex assembly
  - id: GO:0043316
    label: cytotoxic T cell degranulation
  - id: GO:0043320
    label: natural killer cell degranulation
  - id: GO:0043312
    label: neutrophil degranulation
  locations:
  - id: GO:0101004
    label: cytolytic granule membrane
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0001772
    label: immunological synapse
  supported_by:
  - reference_id: PMID:28265073
    supporting_text: Our data reveal that Munc18-2 is not just a chaperone of STX11 but also directly
      contributes to complete membrane merging by promoting SNARE complex assembly.
  - reference_id: PMID:28265073
    supporting_text: complete fusion is stimulated by addition of wild-type Munc18-2 to the assay, but not
      of Munc18-2 mutants with abnormal STX11 binding
  - reference_id: PMID:26771955
    supporting_text: while Munc18-2 localization is unaffected by the absence of STX11 in FHL4 CTL, STX11
      is lost from the plasma membrane in FHL5 CTL lacking Munc18-2
  - reference_id: PMID:19884660
    supporting_text: These data indicate that STXBP2 is required at a late step of the secretory pathway
      for the release of cytotoxic granules by binding syntaxin 11, another component of the intracellular
      membrane fusion machinery.
  - reference_id: PMID:18588921
    supporting_text: Munc18-2 primary granule exocytosis can be blocked by introduction of
      Munc18-2-specific antibodies indicating a crucial role in primary granule fusion.
  knowledge_gaps:
  - gap_kind:
    - BIOLOGY
    gap_statement: >-
      How Munc18-2 promotes SNARE complex assembly is not established. For the neuronal paralog Munc18-1
      the mechanism is templating: it holds syntaxin-1 and VAMP2 in register so that the four-helix bundle
      can zipper, and it does so in a defined order with Munc13 opening the closed syntaxin first. Whether
      Munc18-2 templates the syntaxin-11/SNAP23/VAMP8 complex the same way is unknown, and syntaxin-11 is
      the reason to doubt that it simply would: it has no transmembrane domain, being held in the membrane
      by S-acylated cysteines instead, and its SNARE set alone stalls at hemifusion. A lipid anchor has
      different mechanical properties from a transmembrane helix, so the step Munc18-2 supplies may be
      specific to that geometry rather than a general SM-protein activity.
    dark_aspect: MF_DARK
  - gap_kind:
    - BIOLOGY
    gap_statement: >-
      Whether Munc13-4 and Munc18-2 act on the same reaction in a defined order, as Munc13-1 and Munc18-1
      do at the synapse, has not been shown for the cytotoxic granule. Both are required, both cause
      familial haemophagocytic lymphohistiocytosis when lost, and the terms used for them in this project
      place them at the same step - priming and fusion of one granule at one membrane - but no experiment
      puts them in the same assay. The reconstituted fusion system that established Munc18-2's contribution
      did not include Munc13-4.
    dark_aspect: BP_DARK
suggested_questions:
- question: >-
    The best-characterised syntaxin interaction in this gene's literature cannot be stated in GO. Four
    separate rows in this record assert the STXBP2-syntaxin-11 interaction, which is mutual, disease-linked
    on both sides and supported by seven experiments in UniProt's own count, and all four do so as bare
    protein binding - because GO:0019905 syntaxin binding retains only syntaxin-1 and syntaxin-3 binding as
    children, the other partner-specific terms having been merged into the parent. Is that merge the settled
    position, in which case partner identity belongs in an annotation extension and these rows should carry
    one, or should the two surviving children be merged too so that the convention is at least uniform?
- question: >-
    What an SM protein does has no molecular-function term. This record has to express it as
    GO:0030674 protein-macromolecule adaptor activity, which is true but describes the wrong kind of
    mechanism: an adaptor holds two partners together, whereas Munc18-2 was shown to take a reaction that
    stalls at hemifusion through to complete fusion, which is catalysis of an assembly rather than
    bridging. Should a SNARE-assembly chaperone or templating activity term exist, now that SM proteins are
    understood as part of the core fusion machinery rather than as regulators of it?
- question: >-
    All three mammalian Munc18 paralogs carry GO:0099525 presynaptic dense core vesicle exocytosis by
    propagation from a node seeded by the single Caenorhabditis elegans unc-18, and only STXBP1 is
    neuronal. This review removes the term from STXBP2 on biological grounds and records the node placement
    as a query for PANTHER. Is the right fix to move the assertion to the STXBP1 branch, or to re-state it
    at the ancestral node with a term that is not neuron-specific? The same question applies to STXBP3.
suggested_experiments:
- description: >-
    Put Munc18-2 and Munc13-4 in the same reconstituted assay. The cell-cell fusion system that showed
    Munc18-2 converting hemifusion into complete fusion used syntaxin-11, SNAP23 and VAMP8 without a
    priming factor; adding Munc13-4, and then its FHL3 Rab27a-binding mutant, would say whether the two
    proteins act sequentially on one reaction or on separate steps, and whether Munc13-4 opens syntaxin-11
    the way Munc13-1 opens syntaxin-1.
- description: >-
    Test whether the lipid anchor is what makes Munc18-2 necessary. Replace syntaxin-11's S-acylated
    cysteine-rich tail with the transmembrane helix of syntaxin-3 or syntaxin-4 and repeat the fusion
    assay. If the chimera reaches complete fusion without Munc18-2, the SM protein is supplying something
    that only a lipid-anchored SNARE needs, which would also explain why this particular pair is mutually
    stabilising.
- description: >-
    Separate chaperoning from assembly in cells. Target syntaxin-11 to the plasma membrane independently of
    Munc18-2 - by appending a transmembrane anchor or a palmitoylated targeting motif that does not require
    the SM protein - in FHL5 patient cytotoxic T lymphocytes, then score degranulation. Restoring
    syntaxin-11's localisation without restoring Munc18-2 should rescue nothing if the assembly step is the
    essential one, and should rescue degranulation if chaperoning was the whole job.
