- term:
    id: GO:0017075
    label: syntaxin-1 binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:107363
  - MGI:MGI:107370
  - PANTHER:PTN007525790
  - RGD:3785
  - UniProtKB:P61764
  review:
    summary: Syntaxin-1 binding, propagated from a Munc18 subfamily node.
    action: KEEP_AS_NON_CORE
    reason: >-
      Probably true in vitro and not the partnership that matters. UniProt curates interactions with STX1A,
      STX2 and STX3 for this protein, but the first two are By similarity, transferred from the rat
      ortholog rather than shown for the human protein; the SM domain's syntaxin-binding surface is
      promiscuous enough across the family that this is unsurprising. What the physiology rests on is
      elsewhere: syntaxin-11 in lymphocytes, where the pair is mutually stabilising and both genes cause the
      same disease, and syntaxin-3 in neutrophils and epithelium. Syntaxin-1 is the neuronal t-SNARE and
      the partner of the neuronal paralog STXBP1. Kept because binding a syntaxin is exactly what this
      protein does and the subfamily inheritance is not in question; marked non-core because naming
      syntaxin-1 as the partner puts the emphasis in the wrong place.
    supported_by:
    - reference_id: file:human/STXBP2/STXBP2-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Interacts with STX1A, STX2 and STX3 (By similarity).
