          The donors span the family, including the Arabidopsis and fly members that act at purely
          intracellular steps. The inherited claim is broader than this paralog's own step, but the paralog
          independently satisfies it by delivering syntaxin-11 to the cell surface.
      residue_claims_not_applicable: An inherited process term; no residue-level claim is involved.
