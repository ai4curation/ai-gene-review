  review:
    summary: Apical plasma membrane, projected from the mouse ortholog by Ensembl Compara.
    action: KEEP_AS_NON_CORE
    reason: >-
      Not the lymphoid function, and more than a projection artefact. STXBP2's other partner is
      syntaxin-3, which in epithelium is the apical t-SNARE, and the clinical consequence lines up: some
