        source_label: Munc18 subfamily node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node's experimental grounding is in the neuronal paralog, where syntaxin-1 is the genuine
          partner. The inherited capability - binding a syntaxin - transfers; the identity of the syntaxin
          does not, and for this paralog the documented partners are syntaxin-11 and syntaxin-3.
      residue_claims_not_applicable: A question about which partner a conserved binding surface engages, not
