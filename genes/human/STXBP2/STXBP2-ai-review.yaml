- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:26771955
  qualifier: located_in
  review:
    summary: Plasma membrane, from endogenous localisation in cytotoxic T lymphocytes.
    action: ACCEPT
    reason: >-
      The best-controlled localisation in this record, because it was done on endogenous protein in patient
      cells rather than on a tag. Munc18-2 is predominantly on cytolytic granules with a low level at the
      plasma membrane, which is where syntaxin-11 is - and the dependence runs one way: Munc18-2's own
      localisation is unaffected in FHL4 cells lacking syntaxin-11, while syntaxin-11 is lost from the
      plasma membrane in FHL5 cells lacking Munc18-2. The small plasma-membrane pool is therefore the
      functionally decisive one, since it is what delivers the SNARE.
    supported_by:
    - reference_id: PMID:26771955
      supporting_text: Munc18-2 localized predominantly to cytolytic granules with low levels associated
        with the plasma membrane where STX11 localized.
    - reference_id: PMID:26771955
      supporting_text: while Munc18-2 localization is unaffected by the absence of STX11 in FHL4 CTL, STX11
        is lost from the plasma membrane in FHL5 CTL lacking Munc18-2
