- term:
    id: GO:0001772
    label: immunological synapse
  evidence_type: IDA
  original_reference_id: PMID:24910990
  qualifier: is_active_in
  review:
    summary: Immunological synapse as the compartment of action, shown directly in activated NK cells.
    action: ACCEPT
    reason: >-
      Core, and is_active_in is the right qualifier. The synapse is where the final fusion happens, and
      the recruitment is conditional on activation and on the partner: syntaxin-11 brings Munc18-2 to
      intracellular membranes in a resting NK cell and to the synapse once a target is engaged, and
      deleting the S-acylated cysteine-rich tail of syntaxin-11 abolishes that recruitment. UniProt
      curates the same point as an enrichment note against this PMID. A location that appears only when
      the cell is doing the job is a location the record should keep.
    supported_by:
    - reference_id: PMID:24910990
      supporting_text: Moreover, we show that Munc18-2 is recruited by syntaxin 11 to intracellular
        membranes in resting NK cells and to the immunological synapse in activated NK cells.
    - reference_id: file:human/STXBP2/STXBP2-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Enriched at the immunological synapse in activated immune cells.
- term:
    id: GO:0001909
    label: leukocyte mediated cytotoxicity
  evidence_type: IMP
  original_reference_id: PMID:19884660
  qualifier: involved_in
  review:
    summary: Leukocyte mediated cytotoxicity, from the FHL5 patients whose NK cells could not degranulate.
    action: MODIFY
    reason: >-
      The term is true and the row's own evidence is more specific than it. What was measured in these
      patients was NK cell cytotoxic granule exocytosis, impaired in patient lymphoblasts and rescued by
      ectopic wild-type STXBP2 - a loss-and-restore pair on the degranulation step itself, in a named cell
      type. GO:0043320 natural killer cell degranulation is the matching term: it sits under
      GO:0042267 natural killer cell mediated cytotoxicity, which is_a this row's term, so the replacement
      is a descendant, and it is the sibling of the two GO:0043316 cytotoxic T cell degranulation rows this
      review accepts. Both cell types were assayed in this gene's literature - the FHL5 mapping paper
      scored NK and cytotoxic T cells together by CD107 exposure - so annotating both siblings reflects the
      evidence rather than splitting it arbitrarily. Note that the current GOA set has no gene carrying
      both, which is why this one is worth making explicit.
    proposed_replacement_terms:
    - id: GO:0043320
      label: natural killer cell degranulation
    supported_by:
    - reference_id: PMID:19884660
      supporting_text: Lymphoblasts isolated from these patients had strongly decreased STXBP2 protein
        expression, and NK cells exhibited impaired cytotoxic granule exocytosis, a defect that could be
        overcome by ectopic expression of wild-type STXBP2.
    - reference_id: PMID:19804848
      supporting_text: Activity of natural killer and cytotoxic T cells was markedly reduced or absent,
        as determined by CD107 degranulation.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19804848
  qualifier: enables
  supporting_entities:
  - UniProtKB:O75558
  review:
    summary: Bare protein binding for the syntaxin-11 interaction, in one of the two papers that found it.
    action: MODIFY
    reason: >-
      The STXBP2-syntaxin-11 interaction is the single most informative fact in this record and four rows
      state it as contact. This one comes from the paper that mapped FHL5 to chromosome 19p, found nine
      STXBP2 mutations, and then showed syntaxin-11 - already known as the FHL4 gene - to be its partner,
      with the patients' missense alleles eliminating the interaction and destabilising both proteins in
      their own lymphocytes. Syntaxin-11 is a syntaxin, so GO:0019905 syntaxin binding is supported by this
      row's own evidence. It is also the deepest term available: GO keeps only syntaxin-1 binding and
      syntaxin-3 binding as children, the other partner-specific terms having been merged into the parent,
      so there is no syntaxin-11 binding to use and inventing one would cut against that merge. Under the
      ClinGen Mendelian project's standing instruction a supported generic binding row is modified when the
      evidence supports a more informative term; here it plainly does.
    proposed_replacement_terms:
    - id: GO:0019905
      label: syntaxin binding
    supported_by:
    - reference_id: PMID:19804848
      supporting_text: We have identified syntaxin 11, a SNARE protein mutated in FHL-4, as an interaction
        partner of STXBP2.
    - reference_id: PMID:19804848
      supporting_text: This interaction is eliminated by the missense mutations found in our FHL-5
        patients, which leads to a decreased stability of both proteins, as shown in patient lymphocytes.
