    label: protein-macromolecule adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:28265073
  qualifier: enables
  review:
    summary: Protein-macromolecule adaptor activity, from the reconstituted fusion assay.
    action: ACCEPT
    reason: >-
      Core, and the only molecular-function term in this record that says what Munc18-2 does rather than
      what it holds on to. The experiment is the strongest in the gene's literature: syntaxin-11 is
      lipid-anchored rather than transmembrane, and with its cognate SNAREs alone it drives only lipid
      exchange without cytoplasmic continuity - hemifusion. Adding wild-type Munc18-2 produces complete
      fusion, and Munc18-2 mutants with abnormal syntaxin-11 binding do not, so the activity is
      attributable to the protein and to that binding surface. The authors read it as promoting SNARE
      complex assembly, which is bringing macromolecules together so that they can function in a
      coordinated way - the adaptor definition. The fit is imperfect, since what an SM protein does is
      better described as templating than as adapting, and that gap is raised as a question below rather
      than papered over.
