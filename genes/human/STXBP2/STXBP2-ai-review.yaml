id: Q15833
gene_symbol: STXBP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  STXBP2 encodes Munc18-2, the Sec1/Munc18 protein that makes the last step of regulated exocytosis go to
  completion in haematopoietic and epithelial cells. It is a soluble, peripheral membrane protein that
  works by binding a syntaxin: syntaxin-11 in lymphocytes, syntaxin-3 in neutrophils and at the apical
  membrane of epithelium, and syntaxin-2 and syntaxin-1A in vitro. Its best-understood partnership is with
  syntaxin-11, an unusual SNARE with no transmembrane domain, and the relationship is mutual - Munc18-2
  carries syntaxin-11 to the plasma membrane, syntaxin-11 is lost from that membrane without it, and each
  protein is destabilised when the interaction is broken. It does two things there, which a reconstituted
  fusion assay separates: it chaperones the SNARE into place, and it then promotes assembly of the
  syntaxin-11/SNAP23/VAMP8 complex, converting a reaction that otherwise stalls at hemifusion into complete
  membrane merger. That makes an SM protein part of the core fusion machinery rather than an accessory to
  it. In a cytotoxic lymphocyte it is enriched at the immunological synapse once a target is engaged and
  sits predominantly on the cytolytic granule membrane; in a neutrophil it is on azurophil granules with
  syntaxin-3 and is required for their exocytosis. Biallelic loss of function causes familial
  haemophagocytic lymphohistiocytosis type 5, in which natural killer and cytotoxic T cells cannot
  degranulate; some patients also have an infantile enteropathy resembling microvillus inclusion disease,
  the epithelial counterpart of the same failure.
