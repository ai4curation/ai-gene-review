    label: intracellular protein transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT1G77140
  - FB:FBgn0000257
  - MGI:MGI:2446237
  - PANTHER:PTN000187655
  - SGD:S000003063
  - SGD:S000004388
  review:
    summary: Intracellular protein transport, propagated from the SEC1/Munc18 family node.
    action: ACCEPT
    reason: >-
      A propagated term that turns out to be independently true of this paralog, for a reason specific to
      it. The node sits deep in a family whose other branches - Sly1, Vps45 - work at intracellular
      trafficking steps, so the inherited claim is about them; what makes it correct here is that Munc18-2
      chaperones syntaxin-11 to the plasma membrane, and syntaxin-11 is lost from that membrane in FHL5
      cells that lack Munc18-2. Moving a protein from an internal membrane to the cell surface is directed
      movement of a protein between compartments, which is what the term says. UniProt reaches the same
      summary independently. Accepted rather than marked general because the specific instance of it is in
      this record and the general statement is the one that covers both the lymphoid and the epithelial
      context.
    supported_by:
    - reference_id: PMID:26771955
      supporting_text: These findings support a role for Munc18-2 in chaperoning STX11 to the plasma
        membrane where the final fusion events involved in secretion occur.
