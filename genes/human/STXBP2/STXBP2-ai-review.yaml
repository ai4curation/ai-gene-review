  review:
    summary: Plasma membrane as the compartment of action, propagated from the SM-protein clade.
    action: ACCEPT
    reason: >-
      Core, and is_active_in is exactly right: the plasma membrane is where the fusion Munc18-2 completes
      takes place. The propagation is sound and this paralog has its own direct evidence twice over in this
      record, from neutrophil fractionation and from endogenous imaging in cytotoxic T lymphocytes. The
      family-level claim is also mechanistically the same claim - SM proteins act at the membrane their
