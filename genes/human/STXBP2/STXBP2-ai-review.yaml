      divergence, not of three independent findings, and only one of the three is a neuronal protein.
      STXBP1 is the Munc18 of the presynapse, with syntaxin-1 as its partner and epileptic encephalopathy as
      its disease; STXBP2's partner is syntaxin-11, its disease is familial haemophagocytic
      lymphohistiocytosis with enteropathy, and UniProt records no neural tissue for it. The term also
      demands more than a cell type: it is defined by a neuronal dense core vesicle as its input and a
      presynapse as its location, neither of which this protein encounters. Removed rather than marked
      over-annotated because nothing in the claim survives generalisation - what the clade actually
      inherited is an SM protein that completes SNARE-mediated fusion, which this record states eight other
      ways - and because the project's rule licenses REMOVE for an over-propagated electronic inference that
      can be argued against on biological grounds. The node placement, rather than this gene's row, is the
      thing worth fixing, which is why it is recorded as a source defect against PANTHER as well.
    supported_by:
    - reference_id: file:human/STXBP2/STXBP2-uniprot.txt
      record_section: ["CC:TISSUE SPECIFICITY"]
