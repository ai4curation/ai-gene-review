        source_label: unc-18 (Caenorhabditis elegans)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The worm has a single Munc18 acting at the neuromuscular junction, so the donor annotation is
          sound for the donor. In mammals the family has triplicated and the neuronal job went to STXBP1;
          an assertion placed at a node ancestral to all three paralogs therefore reaches two genes that
          never see a presynapse.
      - source_id: PANTHER:PTN000187659
        source_label: Munc18 ancestral node
        source_status: SOURCE_BAD
        comment: >-
          The node placement is the problem rather than the orthology. What is inherited across the clade is
          an SM protein that completes SNARE-mediated fusion of a dense-cored secretory vesicle; what the
          node carries is the neuron-specific instance of it, so every descendant inherits a presynapse.
      residue_claims_not_applicable: A question about node placement and cell type, not about the presence
        of a residue.
