suggested_questions:
- question: Human AURKAIP1 knockdown reduces all mtDNA-encoded proteins, whereas yeast mS38 loss is COX-selective.
    Did the human function diverge, or does a general assembly defect in partial knockdowns mask an initiation-specific
    bias?
- question: Is there a distinct extramitochondrial (nuclear) AURKAIP1 pool, for example from alternative
    translation start sites, that regulates Aurora-A, or is the Aurora-A effect an overexpression artifact?
suggested_experiments:
- description: In AURKAIP1-knockout human cells with titratable re-expression, measure mitoribosome assembly
    (sucrose gradients) separately from initiation (mitoribosome profiling) to locate the step bS22m acts
    at, and test for any MT-CO1/2/3 initiation bias at sub-saturating rescue.
- description: Tag endogenous AURKAIP1 and quantify its mitochondrial and nuclear pools, then test whether
    AURKAIP1 knockout alters endogenous Aurora-A levels independently of mitochondrial translation defects.
