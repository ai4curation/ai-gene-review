id: Q9NWT8
gene_symbol: AURKAIP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AURKAIP1 (Aurora kinase A-interacting protein 1) is the mitochondrial ribosomal protein mS38
  (MRPS38), a component of the small subunit of the mitoribosome in the mitochondrial matrix, required
  for synthesis of mitochondrially encoded proteins. It was first identified as an Aurora-A interactor
  whose overexpression promotes proteasome-dependent Aurora-A degradation, and a nuclear pool has been
  reported.
