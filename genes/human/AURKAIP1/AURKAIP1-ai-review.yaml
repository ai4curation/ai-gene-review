- term:
    id: GO:0045862
    label: positive regulation of proteolysis
  evidence_type: IDA
  original_reference_id: PMID:12244051
  qualifier: acts_upstream_of_or_within
  review:
    summary: Positive regulation of proteolysis (IDA). Co-overexpressing AIP with Aurora-A in NIH 3T3
      and COS cells destabilized Aurora-A through proteasome-dependent degradation. Two 2007 follow-ups
      from the same group extend the mechanism. AURKAIP1 targets Aurora-A for proteasomal degradation
      independently of ubiquitin (PMID:17125467), through antizyme1, which binds Aurora-A in a complex
      with AURKAIP1 (PMID:17452972). The evidence is therefore mechanistic, not a single observation.
      These studies rely on ectopic expression in cell lines, however, and AURKAIP1's established and
      abundant function is in the mitoribosome. The axis is kept as non-core rather than core.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:12244051 "Ectopic expression of AIP with Aurora-A in NIH 3T3 and COS cells results
      in the down-regulation of ectopically expressed Aurora-A protein levels, and this down-regulation
      is demonstrated to be the result of destabilization of Aurora-A through a proteasome-dependent protein
      degradation pathway."] [PMID:17125467 "In an attempt to investigate the mechanism of AURKAIP1-mediated
      Aurora-A degradation, we report here that AURKAIP1 targets Aurora-A for degradation in a proteasome-dependent
      but Ub (ubiquitin)-independent manner."] [PMID:17452972 "In an attempt to understand how AURKAIP1
      promotes Aurora-A degradation through Ub-independent pathway, we demonstrate here that antizyme1
      (Az1), a well-studied mediator of Ub-independent protein degradation pathway, regulates Aurora-A
      protein stability."]'
    supported_by:
    - reference_id: PMID:12244051
      supporting_text: Ectopic expression of AIP with Aurora-A in NIH 3T3 and COS cells results in the
        down-regulation of ectopically expressed Aurora-A protein levels, and this down-regulation is
        demonstrated to be the result of destabilization of Aurora-A through a proteasome-dependent protein
        degradation pathway.
    - reference_id: PMID:17125467
      supporting_text: In an attempt to investigate the mechanism of AURKAIP1-mediated Aurora-A degradation,
        we report here that AURKAIP1 targets Aurora-A for degradation in a proteasome-dependent but Ub
        (ubiquitin)-independent manner.
    - reference_id: PMID:17452972
      supporting_text: In an attempt to understand how AURKAIP1 promotes Aurora-A degradation through
        Ub-independent pathway, we demonstrate here that antizyme1 (Az1), a well-studied mediator of Ub-independent
        protein degradation pathway, regulates Aurora-A protein stability.
