knowledge_gaps:
- gap_statement: The specific mechanistic role of bS22m in human mitochondrial translation (subunit assembly,
    intersubunit bridging, or initiation) is unknown, as is whether any residue of the yeast mS38 mRNA-selective
    initiation function survives.
  boundary: 'Established: human AURKAIP1 is a mitoribosome SSU protein. siRNA knockdown lowers all 13
    mtDNA-encoded proteins without changing COI mRNA, indicating a general role not limited to cytochrome
    oxidase (PMID:23908630). In yeast, mS38 loss preferentially impairs COX1-3 translation initiation
    and also affects mitoribosome assembly (PMID:30968120). Not established: which step bS22m acts at
    in human mitoribosomes. Partial knockdown with steady-state pulse labelling would not resolve a modest
    initiation-specific bias.'
