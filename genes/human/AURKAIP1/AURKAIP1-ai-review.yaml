- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:12244051
  qualifier: located_in
  review:
    summary: Nucleus (IDA). The 2002 AIP study described AURKAIP1 as a nuclear protein, and HPA reports
      nucleoplasm. Mitoribosome proteomics and APEX mapping place it in the mitochondrial matrix, where
      its established function lies. A nuclear pool may exist, but its role is unclear. Kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:12244051 "AIP is a ubiquitously expressed nuclear protein that interacts specifically
