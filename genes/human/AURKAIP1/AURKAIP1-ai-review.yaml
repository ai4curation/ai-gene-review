- id: PMID:23908630
  title: Identification and characterization of CHCHD1, AURKAIP1, and CRIF1 as new members of the mammalian
    mitochondrial ribosome.
  findings:
  - statement: AURKAIP1 is mitoribosomal protein MRPS38.
    supporting_text: The newly identified MRPs are MRPS37 (Coiled-coil-helix-coiled-coil-helix domain
      containing protein 1-CHCHD1), MRPS38 (Aurora kinase A interacting protein1, AURKAIP1), MRPS39 (Pentatricopeptide
      repeat-containing protein 3, PTCD3), in the small subunit and MRPL59 (CR-6 interacting factor 1,
      CRIF1) in
  - statement: AURKAIP1 knockdown impairs mitochondrial protein synthesis.
    supporting_text: Furthermore, we have demonstrated the essential roles of CHCHD1, AURKAIP1, and CRIF1in
      mitochondrial protein synthesis by siRNA knock-down studies, which had significant effects on the
      expression of mitochondrially encoded proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:17125467
  title: Aurora-A kinase interacting protein 1 (AURKAIP1) promotes Aurora-A degradation through an alternative
    ubiquitin-independent pathway.
  findings:
  - statement: AURKAIP1 promotes ubiquitin-independent proteasomal degradation of Aurora-A.
    supporting_text: In an attempt to investigate the mechanism of AURKAIP1-mediated Aurora-A degradation,
      we report here that AURKAIP1 targets Aurora-A for degradation in a proteasome-dependent but Ub (ubiquitin)-independent
      manner.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:17452972
  title: Antizyme1 mediates AURKAIP1-dependent degradation of Aurora-A.
  findings:
  - statement: Antizyme1 mediates AURKAIP1-dependent Aurora-A degradation.
    supporting_text: In an attempt to understand how AURKAIP1 promotes Aurora-A degradation through Ub-independent
      pathway, we demonstrate here that antizyme1 (Az1), a well-studied mediator of Ub-independent protein
      degradation pathway, regulates Aurora-A protein stability.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:30968120
  title: The mitoribosome-specific protein mS38 is preferentially required for synthesis of cytochrome
    c oxidase subunits.
  findings:
  - statement: Yeast mS38 is preferentially required for COX1-3 translation initiation.
    supporting_text: Additionally, the absence of mS38 preferentially disturbs translation initiation
      of COX1, COX2, and COX3 mRNAs, without affecting the levels of mRNA-specific translational activators.
  - statement: mS38 is proposed as an intrinsic ribosomal translational regulator.
    supporting_text: We propose that mS38 confers the mitochondrial ribosome an intrinsic capacity of
      translational regulation, probably acquired during evolution from bacterial ribosomes to facilitate
      the translation of mitochondrial mRNAs, which lack typical anti-Shine-Dalgarno sequences.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; yeast ortholog Cox24/mS38.
- id: PMID:16339141
  title: COX24 codes for a mitochondrial protein required for processing of the COX1 transcript.
  findings:
  - statement: Yeast COX24 is required for COX1 RNA processing.
    supporting_text: Here we show that the low molecular weight protein product of open reading frame
      YLR204W, for which we propose the name COX24, is also involved in processing of COX1 RNA intermediates.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; yeast ortholog.
  full_text_unavailable: true
