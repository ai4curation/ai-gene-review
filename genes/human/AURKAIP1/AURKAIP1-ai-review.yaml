id: Q9NWT8
gene_symbol: AURKAIP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AURKAIP1 (Aurora kinase A-interacting protein 1) is the mitochondrial small ribosomal subunit
  protein bS22m (formerly mS38/MRPS38). It is a component of the small subunit of the mitoribosome in
  the mitochondrial matrix and is required for synthesis of mitochondrially encoded proteins. The family
  is conserved in some bacterial ribosomes. The yeast ortholog Cox24/mS38 is needed for efficient mitoribosome
  assembly and preferentially for translation initiation of COX1-3 mRNAs. AURKAIP1 was first identified
  as an Aurora-A interactor whose ectopic expression promotes proteasome-dependent, ubiquitin-independent,
  antizyme1-mediated Aurora-A degradation, and a nuclear pool has been reported.
