id: Q06187
gene_symbol: BTK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BTK is a Tec-family nonreceptor protein tyrosine kinase that couples immune-receptor
  activation to intracellular signaling. Its PH domain recognizes phosphatidylinositol 3,4,5-trisphosphate
  and recruits a cytosolic pool to membrane signaling assemblies. In B cells, BTK phosphorylates
  and activates PLCgamma2 within the BLNK-organized receptor pathway, supporting calcium mobilization,
  NF-kappaB signaling, activation and differentiation. BTK also phosphorylates substrates
  in innate immune pathways, including DDX41 and NLRP3, with outputs that depend on cell type
  and stimulation. SH2/SH3-mediated interactions organize signaling partners, and a smaller
  pool can shuttle through the nucleus. Loss of functional BTK causes X-linked agammaglobulinemia.
