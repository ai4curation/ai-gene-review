- id: PMID:31431692
  title: T-cell expression of Bruton's tyrosine kinase promotes autoreactive T-cell activation
    and exacerbates aplastic anemia.
  findings:
  - statement: Mouse T-cell experiments support a contextual BTK contribution to TCR–PLCgamma1
      signaling.
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    review_notes: Normal cached record received; the IBA consultant first read publisher-indexed
      primary passages, and the owner then independently read the normal full-text extraction
      for sorted mouse T cells, Btk-null controls, activation, PLCgamma1 association and relevant
      Methods. K430R comparisons used transfected cells, not purified catalytic reconstitution.
      No complete image/supplement reading or direct human TCR assay is claimed.
core_functions:
- description: ATP-dependent nonreceptor tyrosine phosphorylation transmits immune-receptor
    signals. BTK activates PLCgamma2 in BCR assemblies and participates in TIRAP-associated
    innate signaling; direct phosphorylation of NLRP3 supports inflammasome assembly in demonstrated
    priming/activation settings. B-cell calcium and NF-kappaB responses are downstream consequences
    of this kinase mechanism, not additional catalytic activities.
  molecular_function:
    id: GO:0004715
    label: non-membrane spanning protein tyrosine kinase activity
  directly_involved_in:
