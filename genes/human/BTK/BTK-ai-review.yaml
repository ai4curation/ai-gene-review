- description: Specific PIP3 recognition by the PH domain recruits BTK to the cytoplasmic
    face of the plasma membrane, coupling lipid second-messenger production to kinase activation
    and receptor signaling. Quantitative isolated-domain binding and full-length redistribution
    studies support this own binding activity; it does not assign phosphoinositide synthesis
    or hydrolysis to BTK.
