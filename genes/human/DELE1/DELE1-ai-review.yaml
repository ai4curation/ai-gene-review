core_functions:
- description: Mitochondrial-stress messenger that, after OMA1 cleavage (or import arrest under iron deficiency),
    binds and activates the eIF2alpha kinase HRI through its TPR-containing C-terminal domain, triggering
    HRI-mediated integrated stress response signaling.
  molecular_function:
    id: GO:0043539
    label: protein serine/threonine kinase activator activity
  directly_involved_in:
  - id: GO:0140468
    label: HRI-mediated signaling
