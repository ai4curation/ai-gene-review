  - reference_id: PMID:37550454
    supporting_text: Mitochondrial stress activates the inner mitochondrial membrane protease OMA1, which
      promotes cleavage of DELE1, resulting in an accumulation of the DELE1 carboxy-terminal domain (DELE1CTD)
      in the cytosol, where it activates the HRI kinase.
    reference_section_type: INTRODUCTION
