id: Q14154
gene_symbol: DELE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DELE1 (DAP3-binding cell death enhancer 1) is a mitochondrially targeted TPR-repeat protein
  that relays mitochondrial stress to the cytosolic integrated stress response. At steady state DELE1
  is imported into mitochondria, associates with the inner membrane, and is rapidly degraded by the matrix
  protease LONP1. Mitochondrial stress such as depolarization activates the inner-membrane protease OMA1,
  which cleaves DELE1 into a C-terminal short form (DELE1-CTD) that is released to the cytosol, oligomerizes,
  binds the eIF2alpha kinase HRI (EIF2AK1) and activates it. Under iron deficiency, import of full-length
  DELE1 is arrested and the protein is stabilized on the mitochondrial surface, where it likewise activates
  HRI. The resulting eIF2alpha phosphorylation attenuates translation and induces ATF4 and other ISR targets,
  and HRI-dependent phospho-eIF2 at mitochondria promotes PINK1/PRKN-independent mitophagy. An early study
  also linked DELE1 to death-receptor-induced apoptosis.
