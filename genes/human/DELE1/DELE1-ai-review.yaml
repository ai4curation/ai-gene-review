suggested_questions:
- question: Does DELE1 respond to accumulation of misfolded matrix proteins per se (a UPRmt-type trigger),
    or only to import defects and membrane depolarization that activate OMA1?
- question: Is DELE1-CTD oligomerization required in vivo for HRI activation, and how does the oligomer
    engage the HRI kinase domain?
suggested_experiments:
- hypothesis: Matrix protein misfolding without depolarization is sufficient to activate the DELE1-HRI
    pathway.
  description: Express misfolding-prone matrix proteins (e.g. deltaOTC) or inhibit LONP1/CLPP in DELE1
    knockout versus wild-type cells and measure DELE1 cleavage, HRI autophosphorylation and ATF4 induction.
  experiment_type: genetic perturbation / signaling readout
