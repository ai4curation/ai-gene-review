id: Q96MU7
gene_symbol: YTHDC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: YTHDC1 is a nuclear YTH-domain reader of N6-methyladenosine-modified RNA. It recognizes
  m6A through its YTH domain in the nucleoplasm and nuclear speckles, where it couples methylated
  pre-mRNAs and mRNAs to splice-site choice through SRSF3 and SRSF10 and to mRNA export through
  SRSF3 and NXF1. YTHDC1 also reads m6A on the XIST long noncoding RNA to support X-chromosome
  inactivation, contributes to oocyte alternative splicing and polyadenylation, and is associated
  with nuclear RNA surveillance complexes including PAXT.
