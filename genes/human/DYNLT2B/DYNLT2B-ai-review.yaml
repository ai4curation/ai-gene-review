    supported_by:
    - reference_id: PMID:26044572
      supporting_text: 'Loss of TCTEX1D2 impairs retrograde intraflagellar transport (IFT)

        in humans and the protist Chlamydomonas, accompanied by destabilization of the

        retrograde IFT dynein motor. We thus define TCTEX1D2 as an integral component of

        the evolutionarily conserved retrograde IFT machinery.'
