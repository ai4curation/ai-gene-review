- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:25830415
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Depletion impairs ciliogenesis in human cells; consistent with dynein-2/IFT being required for cilium
      assembly, but this is a downstream consequence of the core retrograde-IFT role.
    reason: Intraciliary transport is part of cilium assembly in GO and the IMP is curator-made from full text (siRNA
      depletion reduced ciliogenesis in that study). Other studies found milder effects (TCTEX1D2-depleted cells
      still form cilia but they are longer, PMID:25205765; mild trafficking defects in KO cells, PMID:29742051),
      so this is a context-dependent downstream outcome of the core retrograde-IFT role and is kept as non-core.
    supported_by:
    - reference_id: PMID:25830415
      supporting_text: 'Tctex1d2 and Wdr60 localize to the base

        of the cilium and their depletion causes defects in ciliogenesis.'
