suggested_questions:
- question: Does human DYNLT2B, like the mouse ortholog in sperm, also act as an inner-dynein-arm light chain in
    motile cilia or flagella, and does it pass through dynein axonemal particles during preassembly?
- question: Does the DYNLT2B N-terminal extension bind any specific ciliary cargo, or is the subunit purely structural
    within dynein-2?
suggested_experiments:
- description: Endogenous tagging of DYNLT2B in human multiciliated airway cells or spermatids with co-staining
    for DNAAF markers of dynein axonemal particles and for inner-arm dynein subunits, combined with immunoprecipitation
    of DNAH/WDR63/WDR78 complexes.
