id: Q8WW35
gene_symbol: DYNLT2B
product_type: PROTEIN
status: IN_PROGRESS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DYNLT2B, also known as TCTEX1D2, is a non-catalytic Tctex-family light chain of cytoplasmic
  dynein-2. It forms a heterodimer with DYNLT1 and associates with the intermediate-chain assembly to
  support retrograde intraflagellar transport and ciliary homeostasis. Human variants can disrupt retrograde
  transport, while mouse studies additionally identify a role in sperm-flagellum assembly.
