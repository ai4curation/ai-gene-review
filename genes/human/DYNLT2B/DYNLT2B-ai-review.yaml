    - reference_id: PMID:29742051
      supporting_text: 'Utilizing the visible

        immunoprecipitation assay, we demonstrated the interaction modes among the

        dynein-2 subunits, including previously undefined interactions, such as that

        between WDR60 and the TCTEX1D2-DYNLT1/DYNLT3 dimer. The dynein-2 complex can be

        divided into three subcomplexes, namely DYNC2H1-DYNC2LI1,

        WDR34-DYNLL1/DYNLL2-DYNLRB1/DYNLRB2, and WDR60-TCTEX1D2-DYNLT1/DYNLT3.'
