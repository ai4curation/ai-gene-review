    summary: "The TCTEX1D2\u2013DYNLT1/DYNLT3 dimer interacts with the dynein-2 intermediate chain WDR60.\
      \ This is a specific functional interaction."
    reason: "The TCTEX1D2\u2013DYNLT1/DYNLT3 dimer interacts with the dynein-2 intermediate chain WDR60.\
