id: Q8WW35
gene_symbol: DYNLT2B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DYNLT2B (TCTEX1D2) is a small non-catalytic Tctex-type dynein light chain and the only Tctex light
  chain unique to cytoplasmic dynein-2, the minus-end-directed motor that drives retrograde intraflagellar transport
  (IFT) from the ciliary tip back to the base. It forms a 1:1 heterodimer with the Tctex light chain DYNLT1 (or
  DYNLT3), and this pair binds the dynein-2 intermediate chain WDR60/DYNC2I1, forming the WDR60-TCTEX1D2-DYNLT1/DYNLT3
  subcomplex of the dynein-2 tail. Endogenous protein is found at the ciliary base, centrosomal microtubule-organizing
  centers and mitotic spindle poles, with WDR60-dependent recruitment. Loss of DYNLT2B in human cells and of its
  Chlamydomonas ortholog Tctex2b impairs retrograde IFT and partially destabilizes the motor, and biallelic loss-of-function
  variants cause short-rib thoracic dysplasia 17 (Jeune asphyxiating thoracic dystrophy). In mouse testis the ortholog
  is also an axoneme component that associates with inner-dynein-arm intermediate chains and is required for sperm
  flagellum formation.
