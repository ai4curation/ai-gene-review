- term:
    id: GO:0120293
    label: dynein axonemal particle
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0542
  review:
    action: UNDECIDED
    summary: SubCell mapping from a curator-inferred UniProt location (ECO:0000305). No study tested DYNLT2B residence
      in dynein axonemal particles; mouse and Chlamydomonas data suggest an inner-arm axonemal role that makes it
      plausible but unshown.
    reason: Dynein axonemal particles are cytoplasmic preassembly foci for axonemal dyneins. The mouse study reports
      TCTEX1D2 as a sperm axoneme component interacting with inner-dynein-arm intermediate chains WDR63 and WDR78,
      and Chlamydomonas Tctex2b is an inner-arm light chain, so passage through DAPs is plausible for this axonemal
      pool. No experiment localizes the protein to DAPs, so the call is left open.
    supported_by:
    - reference_id: PMID:39827215
      supporting_text: TCTEX1D2 is an axoneme component and interacts with subunits of inner dynein arm
- term:
    id: GO:1902017
    label: regulation of cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:25205765
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: TCTEX1D2 depletion lengthens cilia without blocking their formation; a downstream consequence of impaired
      retrograde IFT, retained as non-core.
    reason: In the cited study TCTEX1D2 depletion did not prevent ciliogenesis but significantly increased cilia
      length, a phenotype typical of impaired retrograde IFT. The curator-made IMP is not contradicted and fits
      a ciliary-length (assembly control) effect, but it is a downstream consequence of the gene's role as a dynein-2
      subunit rather than a dedicated regulatory activity, so it is non-core.
    supported_by:
    - reference_id: PMID:25205765
      supporting_text: In all cases, we can detect a statistically significant increase in cilia length following
        TCTEX1D2 depletion.
    - reference_id: PMID:25205765
      supporting_text: Of note, TCTEX1D2-depleted cells still form cilia.
- term:
    id: GO:1905799
    label: regulation of intraciliary retrograde transport
  evidence_type: IMP
  original_reference_id: PMID:26044572
  qualifier: involved_in
  review:
    action: MODIFY
    summary: DYNLT2B is a subunit of the IFT dynein that performs retrograde IFT; its loss impairs the process itself,
      so participation (intraciliary retrograde transport) is the appropriate term rather than regulation.
    reason: Loss of TCTEX1D2/Tctex2b impairs retrograde IFT and partially destabilizes the IFT dynein motor. That
      is evidence that the protein is part of the machinery executing the process, not that it modulates the rate
      of a process carried out by others. Lateral correction to GO:0035721, which the gene already carries by IMP.
    supported_by:
    - reference_id: PMID:26044572
      supporting_text: Affinity proteomics indicates that TCTEX1D2/Tctex2b is an integral component of IFT dynein.
        We demonstrate a retrograde IFT defect in TCTEX1D2-deficient human fibroblasts and Tctex2b-deficient Chlamydomonas
        cells, and find that IFT dynein is partially destabilized by loss of Tctex2b in Chlamydomonas.
    proposed_replacement_terms:
    - id: GO:0035721
      label: intraciliary retrograde transport
