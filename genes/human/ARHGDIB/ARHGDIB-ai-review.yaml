      resource: CACAO
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0003924
      corrected_value: GO:0005094
      corrected_label: Rho GDP-dissociation inhibitor activity
      confidence: PROBABLE
      explanation: >-
        This IMP row (PMID:24554735, assigned by CACAO) gives ARHGDIB (RhoGDI2) GTPase
        activity (GTP + H2O = GDP + phosphate). RhoGDI2 is a Rho GDP-dissociation
        inhibitor with no GTPase domain. The paper shows that RhoGDI2 over-expression
        lowers and knockdown raises RAC1-GTP levels in trophoblast cells, i.e.
        RhoGDI2 restrains Rac1 activation; it does not measure GTP hydrolysis by
