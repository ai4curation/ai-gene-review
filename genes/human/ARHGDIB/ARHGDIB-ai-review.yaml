      holds Rho GTPases in the inactive GDP-bound state, so the direction of regulation
      is negative; the descendant GO:0035024 negative regulation of Rho protein signal
      transduction is preferred.
    proposed_replacement_terms:
    - id: GO:0035024
      label: negative regulation of Rho protein signal transduction
    supported_by:
    - reference_id: PMID:7512369
      supporting_text: Functional studies with the human D4 protein demonstrate that
        D4 has GDI activity against the CDC42Hs and rac I proteins
