- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IMP
  original_reference_id: PMID:24554735
  qualifier: enables
  review:
    summary: >-
      CACAO IMP annotation of GTPase activity based on RhoGDI2 over-expression and
      siRNA knockdown in HTR-8/SVneo trophoblast cells, which lowered or raised RAC1-GTP
      levels respectively. ARHGDIB is a Rho GDI with no P-loop GTPase fold; the
      read-out is inhibition of Rac1 activation, not GTP hydrolysis by RhoGDI2.
    action: MODIFY
    reason: >-
      GO:0003924 GTPase activity is defined as catalysis of GTP + H2O = GDP + H+ +
      phosphate, i.e. the activity of the GTPase itself. ARHGDIB belongs to the Rho GDI
      family (Pfam Rho_GDI, InterPro IPR000406) and has no nucleotide-binding or
      hydrolase domain. The cited study (abstract only cached) reports reduced RAC1-GTP
      on RhoGDI2 over-expression and increased RAC1-GTP on knockdown, which is what a
      GDP-dissociation inhibitor does to its target: it keeps Rac1 in the GDP-bound
      state. Nothing in the paper measures GTP hydrolysis by RhoGDI2. The essence of the
      annotation (RhoGDI2 acts on the Rac1 nucleotide cycle) is sound, so the correct
      term is the paralog-wide, experimentally established Rho GDP-dissociation
      inhibitor activity (GO:0005094), which this gene already carries by IDA and IBA.
      This row was flagged by rule FRR:0010.
    proposed_replacement_terms:
    - id: GO:0005094
      label: Rho GDP-dissociation inhibitor activity
    supported_by:
    - reference_id: PMID:24554735
      supporting_text: Overexpression of RhoGDI2 in HTR-8/SVneo cells was associated
        with reduced RAC1-guanosine triphosphate (GTP) levels and inhibited cell migration.
    - reference_id: PMID:24554735
      supporting_text: small interfering RNA-mediated downregulation of RhoGDI2 resulted
        in significantly increased RAC1-GTP levels
    - reference_id: PMID:8356058
      supporting_text: The full-length Ly-GDI cDNA encodes a 27-kDa protein which binds
        to RhoA and inhibits GDP dissociation from RhoA.
    source_defects:
