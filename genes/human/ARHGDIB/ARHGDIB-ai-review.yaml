id: P52566
gene_symbol: ARHGDIB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ARHGDIB (Rho GDP-dissociation inhibitor 2, RhoGDI2, also called Ly-GDI or D4-GDI)
  is a 201-residue cytosolic member of the Rho GDI family that is expressed mainly in
  hematopoietic cells, especially lymphocytes and neutrophils. It binds GDP-bound Rho
  family GTPases (RAC1, RAC2, RHOA, CDC42, RHOG), slows dissociation of GDP and so
  keeps them inactive, and through an immunoglobulin-like domain that shields their
  geranylgeranyl tail it extracts them from membranes and holds them as a soluble
  cytosolic pool. The crystal structure with GDP-Rac2 shows that the N-terminal
  regulatory arm contacts the switch regions and stabilizes the Mg2+ ion in the
  nucleotide-binding pocket. By restraining Rho/Rac activation, RhoGDI2 modulates
  actin cytoskeleton organization and cell migration; over-expression causes loss of
  stress fibres, and it limits migration of trophoblast and bladder cancer cells,
  where it acts as a metastasis suppressor. Ly-GDI-deficient mice have largely normal
  lymphoid development, consistent with partial redundancy with RhoGDI1 (ARHGDIA).
  RhoGDI2 is cleaved by caspase-3 during apoptosis.
