core_functions:
- description: >-
    ARHGDIB binds GDP-bound Rho-family GTPases (RHOA, RAC1, RAC2, CDC42, RHOG), slows
    GDP dissociation and so holds them inactive, and solubilizes their prenylated forms
    as cytosolic complexes, thereby restraining Rho/Rac activation in hematopoietic and
    other cells.
  molecular_function:
    id: GO:0005094
    label: Rho GDP-dissociation inhibitor activity
  directly_involved_in:
  - id: GO:0035024
    label: negative regulation of Rho protein signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:8356058
    supporting_text: The full-length Ly-GDI cDNA encodes a 27-kDa protein which binds
      to RhoA and inhibits GDP dissociation from RhoA.
  - reference_id: PMID:7512369
    supporting_text: D4 has GDI activity against the CDC42Hs and rac I proteins
  - reference_id: PMID:10655614
    supporting_text: The architecture of the complex interface suggests a mechanism for
      the inhibition of guanine nucleotide dissociation that is based on the stabilization
      of the magnesium (Mg2+) ion in the nucleotide binding pocket.
suggested_questions:
- question: >-
    Which Rho GTPases are the physiological targets of RhoGDI2 in lymphocytes and
    neutrophils, given its lower in vitro affinity than RhoGDI1 and its abundance
    alongside RAC2?
- question: >-
    Does caspase-3 cleavage of RhoGDI2 during apoptosis alter its GDI activity or
    target selectivity, and does the cleaved fragment have a distinct function?
suggested_experiments:
- description: >-
    Quantify RhoGDI2 binding affinity and GDP-dissociation inhibition for RAC1, RAC2,
    RHOA, CDC42 and RHOG in parallel with RhoGDI1, using prenylated GTPases, and
    compare GDI-bound pools in ARHGDIB-knockout versus wild-type primary leukocytes.
- description: >-
    Express caspase-resistant and caspase-cleaved RhoGDI2 in lymphoid cells and measure
    Rho GTPase activation, membrane extraction and apoptosis.
