id: P29375
gene_symbol: KDM5A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'KDM5A/RBP2 is a nuclear JARID1-family Fe(II)- and 2-oxoglutarate-dependent histone demethylase
  that removes activating H3K4me2/me3 marks on chromatin. Its ARID domain binds DNA to help target
  demethylase activity, while PHD fingers read histone H3 tails; in specific transcriptional contexts
  it also functions independently of catalysis, including CLOCK-BMAL1 coactivation through HDAC1 inhibition.'
