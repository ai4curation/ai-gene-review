  review:
    summary: KDM5A ARID binds a CCGCCC cis-regulatory motif.
    action: ACCEPT
    reason: The RBP2/KDM5A ARID structural paper identified a CCGCCC DNA motif and showed that ARID
      DNA recognition contributes to transcriptional regulation; this row is retained on that KDM5A-specific
      structural and cellular evidence despite a broader pull-down survey reporting little or no sequence
      specificity for isolated RBP2 and PLU-1 ARID domains.
    supported_by:
    - reference_id: PMID:18270511
      supporting_text: identified its DNA binding motif (CCGCCC) and characterized the binding
        contacts
    - reference_id: PMID:18270511
      supporting_text: ARID is required for RBP2 demethylase activity in cells and that DNA
        recognition is essential to regulate transcription
