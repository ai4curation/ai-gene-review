suggested_questions:
- question: Which endogenous KDM5A target genes depend on ARID-domain DNA recognition versus PHD
    histone-tail binding for recruitment of the demethylase to chromatin?
suggested_experiments:
- hypothesis: KDM5A requires both ARID DNA binding and Jumonji catalytic residues to demethylate
    H3K4me2/3 at its strongest regulatory targets.
  description: Compare wild-type KDM5A, an ARID DNA-binding mutant and a catalytic Jumonji mutant by
    rescue after endogenous KDM5A depletion, assaying chromatin occupancy and H3K4me3 at direct
    target promoters.
  experiment_type: structure-guided rescue and chromatin profiling
