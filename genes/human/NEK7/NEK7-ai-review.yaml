id: Q8TDX7
gene_symbol: NEK7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NEK7 is a small (302-residue) NIMA-related serine/threonine protein kinase consisting of
  little more than a catalytic domain, and the closest paralogue of NEK6. It has two separable roles.
  As a kinase it acts in the mitotic NEK9-NEK6/NEK7 cascade: NEK7 is held inactive in interphase by a
  Tyr-97 ''Tyr-down'' autoinhibitory conformation, and binding of the NEK9 C-terminal domain relieves
  that autoinhibition and promotes trans-autophosphorylation of the activation loop, so NEK7 activity
  rises in mitosis. Active NEK7 is concentrated at the centrosome and spindle poles, is required for gamma-tubulin
  recruitment and centrosomal microtubule nucleation, for bipolar spindle assembly and for completion
  of cytokinesis, and phosphorylates the microtubule-associated protein EML4 at Ser144/Ser146 to release
  it from spindle microtubules during chromosome congression. Loss of NEK7 in mouse causes late embryonic
  or perinatal lethality with chromosome lagging, cytokinesis failure and polyploidy. Separately, and
  without requiring catalytic activity, NEK7 binds the leucine-rich repeat domain of the innate-immune
  sensor NLRP3 and licenses inflammasome assembly: it opens the autoinhibited NLRP3 cage at the microtubule-organizing
  centre and is a stoichiometric structural subunit of the active NLRP3 disc, in which ten NEK7 molecules
  bridge adjacent NLRP3 subunits, permitting PYCARD/ASC recruitment and caspase-1 activation. Because
  the NEK9- and NLRP3-binding surfaces on NEK7 overlap and cellular NEK7 is limiting, mitosis and NLRP3
  inflammasome activation are mutually exclusive. NEK7 is also reported to shuttle to the nucleus, a distribution
  modulated by ANKS3 binding.'
