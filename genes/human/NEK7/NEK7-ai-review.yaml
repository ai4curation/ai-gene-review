suggested_questions:
- question: Should NEK7 be annotated as a component of GO:0072559 NLRP3 inflammasome complex, and should
    the term definition (which enumerates only NLRP3, PYCARD and caspase-1) be widened? The active disc
    contains ten NEK7 molecules at defined stoichiometry, and human annotations to this term already extend
    beyond the three definitional components.
- question: Is the GO:0140677 molecular function activator activity annotation from PMID:19941817, and
    the GO:0043549 regulation of kinase activity annotation from PMID:12840024, directionally correct?
    In both papers NEK9 activates NEK7, not the reverse, and neither annotation carries an extension naming
    an activated partner.
- question: How should the human-versus-mouse divergence in NEK7 dependence be represented? NEK7 is non-redundantly
    required for NLRP3 activation in mouse macrophages, but human BLaER1 and THP-1 cells deficient in
    NEK7 activate NLRP3 normally through an IKK-beta-dependent priming route, while human NEK7 can still
    prime NLRP3 when expressed.
- question: Does NEK7 have a function in the nucleus? Several annotations place it there and ANKS3 binding
    is reported to block its nuclear entry, but no nuclear substrate or nuclear process has been identified.
- question: Beyond EML4, what are the physiological substrates of NEK7 at the centrosome, and is the gamma-tubulin
    recruitment defect in NEK7-depleted cells the consequence of phosphorylating a specific pericentriolar
    substrate?
- question: Is the IMP annotation to positive regulation of telomere maintenance (PMID:21531765) a direct
    role, or a secondary consequence of perturbing mitosis in a kinase-wide RNAi screen?
suggested_experiments:
- hypothesis: NEK7 catalytic activity and NLRP3 licensing are fully separable functions of the same surface-limited
    protein, so the two can be independently reconstituted in a NEK7-null human macrophage.
  description: 'In NEK7-knockout human macrophages (and a NEK7-null monocytic line), re-express a panel
    of NEK7 alleles: wild type, kinase-dead (K64M), constitutively active (Y97A), the NLRP3-interface
    mutant E280R, and a NEK9-interface mutant. Score in parallel the mitotic phenotypes (centrosomal gamma-tubulin,
    microtubule regrowth, spindle polarity, EML4 Ser146 phosphorylation) and the inflammasome phenotypes
    (NLRP3-NEK7 co-immunoprecipitation, ASC oligomerisation, caspase-1 cleavage, IL-1beta release). A
    clean double dissociation, with E280R mitosis-competent but inflammasome-dead and K64M the converse,
    would fix the two activities as independent molecular functions of one protein.'
- hypothesis: Human cells use NEK7-dependent and IKK-beta-dependent NLRP3 priming as alternative routes
    whose relative weight is set by NLRP3 abundance and stimulus, which would explain why mouse macrophages
    appear strictly NEK7-dependent and human lines do not.
  description: Titrate NLRP3 expression over two orders of magnitude in NEK7-null and NEK7-competent human
    macrophages with and without IKK-beta inhibition, across K+-dependent (nigericin, ATP) and K+-independent
    (imiquimod) stimuli, reading out speck position relative to the pericentriolar material, caspase-1
    activation and IL-1beta. Run the same matrix in mouse macrophages. If NEK7 dependence tracks with
    NLRP3 abundance and route rather than with species, the apparent species difference is a threshold
    effect.
- hypothesis: NEK7 is a stoichiometric structural subunit of the assembled inflammasome rather than a
    transient catalyst of its assembly.
  description: Reconstitute NLRP3 inflammasome assembly from purified components with sub-stoichiometric
    and saturating NEK7, and follow NEK7 occupancy during and after disc formation by mass photometry
    and quantitative cryo-EM classification; test whether NEK7 can be competed off an already-assembled
    disc by excess NEK9 C-terminal domain. Retention of NEK7 in the mature disc at one-to-one stoichiometry
    would support annotating NEK7 as a complex component.
- hypothesis: NEK7 has one or more unidentified centrosomal substrates whose phosphorylation mediates
    gamma-tubulin recruitment.
  description: Apply analogue-sensitive NEK7 (gatekeeper mutant) with a bulky ATP analogue, or chemical-genetic
    thiophosphate labelling, in synchronised mitotic cells, and enrich labelled substrates from purified
    centrosomes by mass spectrometry. Validate candidates by phospho-site mutation and by asking whether
    the non-phosphorylatable allele reproduces the gamma-tubulin and microtubule-nucleation defect of
    NEK7 depletion.
