- term:
    id: GO:0007346
    label: regulation of mitotic cell cycle
  evidence_type: IDA
  original_reference_id: PMID:19941817
  qualifier: involved_in
  review:
    summary: Regulation of the mitotic cell cycle (IDA), from the work showing that NEK7 activity is autoinhibited
      in interphase and released in mitosis.
    action: ACCEPT
    reason: NEK7 activity is cell-cycle regulated and interfering with it arrests cells in mitosis, so
      NEK7 does act in mitotic progression. The term is general; the more specific spindle-assembly and
      chromosome-congression claims are carried by other rows in this review.
    supported_by:
    - reference_id: PMID:19941817
      supporting_text: From this we conclude that Tyr-down autoinhibition restricts the activity of Nek6
        and Nek7 in interphase but is completely released in mitosis.
    - reference_id: PMID:19414596
      supporting_text: both Nek6 and Nek7 are activated in mitosis and that interfering with their activity
        by either depletion or expression of reduced-activity mutants leads to mitotic arrest and apoptosis
- term:
    id: GO:0007346
    label: regulation of mitotic cell cycle
  evidence_type: TAS
  original_reference_id: PMID:17727698
  qualifier: involved_in
  review:
    summary: Regulation of the mitotic cell cycle asserted by a review of NIMA-related kinases (TAS).
    action: ACCEPT
    reason: The review accurately summarises the primary literature placing NEK7 in mitotic spindle organisation
      downstream of NEK9. A traceable author statement of a well-supported general claim.
    supported_by:
    - reference_id: PMID:17727698
      supporting_text: it seems likely that these kinases exert their effects through organisation of
        the mitotic spindle
    - reference_id: PMID:17727698
      supporting_text: Importantly, Nek7 has been reported to localise to the centrosome in both interphase
        and mitotic U2OS and HeLa cells
- term:
    id: GO:0032206
    label: positive regulation of telomere maintenance
  evidence_type: IMP
  original_reference_id: PMID:21531765
  qualifier: acts_upstream_of_or_within
  review:
    summary: Positive regulation of telomere maintenance (IMP) from a high-throughput kinase RNAi screen
      for telomerase modulators.
    action: UNDECIDED
    reason: Only the abstract of the cited screen is cached (no full text), and it names ERK8 rather than
      NEK7 as the highlighted hit, so I cannot see the NEK7-specific data the curator read. Screen hits
      of this kind are also frequently indirect - reduced telomerase activity is a common consequence
      of perturbing mitosis - and no follow-up work connects NEK7 to telomere biology. Per policy I leave
      an experimental annotation whose supporting text I cannot read as UNDECIDED rather than removing
      it.
    supported_by:
    - reference_id: PMID:21531765
      supporting_text: we report the findings of a high-throughput functional RNA interference screen
        to globally profile the contribution of kinases to telomerase activity (TA)
- term:
    id: GO:0035865
    label: cellular response to potassium ion
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9ES74
  - ensembl:ENSMUSP00000140903
  review:
    summary: Cellular response to potassium ion, transferred electronically from mouse Nek7 (Q9ES74).
    action: ACCEPT
    reason: 'NEK7 acts downstream of potassium efflux in NLRP3 activation: blocking K+ efflux with extracellular
      KCl prevents the NLRP3-NEK7 association and caspase-1 activation, while K+ efflux itself is unimpaired
      in NEK7-null macrophages. The annotation describes a genuine, experimentally defined position of
      NEK7 in a potassium-responsive pathway, and the orthologous mouse evidence transfers cleanly.'
    supported_by:
    - reference_id: PMID:26814970
      supporting_text: Notably, the association of NLRP3 with Nek7 as well as caspase-1 activation triggered
        by ATP were blocked in the presence of 50 mM KCl that inhibits potassium efflux and NLRP3 activation
    - reference_id: PMID:26814970
      supporting_text: We have shown that Nek7 is an essential factor that specifically and non-redundantly
        functions downstream of potassium efflux to regulate the activation of the NLRP3 inflammasome.
