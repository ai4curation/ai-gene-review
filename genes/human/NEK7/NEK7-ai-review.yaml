        the microtubule re-growth activity in the NEK7-suppressed cells
    - reference_id: PMID:36442502
      supporting_text: its interaction with NEK7 at the MTOC disrupts the cage to allow formation of the
        active NLRP3 disc
- term:
    id: GO:0006468
