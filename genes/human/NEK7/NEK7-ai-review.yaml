- description: Independently of catalysis, NEK7 is the non-catalytic licensing factor for the NLRP3 inflammasome.
    Acting downstream of potassium efflux and at the microtubule-organizing centre, it binds the NLRP3
    leucine-rich repeat domain, opens the autoinhibited NLRP3 cage and bridges adjacent NLRP3 subunits
    in the assembled disc, so that PYCARD/ASC can be recruited and caspase-1 activated. Kinase-dead NEK7
    (K64M) rescues inflammasome activation in Nek7-mutant macrophages, and NEK7 is a stoichiometric subunit
    of the active complex (ten NEK7 per ten NLRP3). Because the NEK9- and NLRP3-binding surfaces on NEK7
    overlap and cellular NEK7 is limiting, this role and the mitotic role are mutually exclusive.
