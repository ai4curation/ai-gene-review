      stimulated by dimeric NEK9 binding.
    action: NEW
    reason: NEK7 itself performs the phosphotransfer onto NEK7 residues, so the participation test is
      met by the gene product doing the chemistry rather than being a substrate of another kinase. The
      observation is direct and is the mechanism by which NEK7 becomes catalytically competent in mitosis,
      and it is not covered by any existing row (the protein phosphorylation rows concern substrate phosphorylation;
      the regulation-of-kinase-activity row describes NEK9 acting on NEK7). Many protein kinases with
      activation-loop trans-autophosphorylation carry this term, so it is conventional rather than novel
      in kind.
