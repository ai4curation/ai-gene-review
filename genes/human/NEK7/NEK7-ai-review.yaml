  evidence_type: IDA
  original_reference_id: PMID:12840024
  qualifier: involved_in
  review:
    summary: Protein phosphorylation (IDA) from the study defining the NEK9-NEK6/NEK7 mitotic kinase cascade.
    action: ACCEPT
    reason: NEK7 is shown to be an activatable protein kinase in this work, so involvement in protein
      phosphorylation is correct; it is a general term, but accurate, and the specific substrate relationship
      is captured by later work on EML4.
    supported_by:
    - reference_id: PMID:12840024
      supporting_text: Nercc1 activates Nek7 in vitro in a similar manner
    - reference_id: PMID:31409757
      supporting_text: The mitotic kinases NEK6 and NEK7 phosphorylated the EML4 N-terminal domain at
        Ser144 and Ser146 in vitro, and depletion of these kinases in cells led to increased EML4 binding
        to microtubules in mitosis.
