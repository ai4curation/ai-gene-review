- description: Through that kinase activity NEK7 is required for gamma-tubulin recruitment and microtubule
    nucleation at the centrosome, for assembly of a bipolar mitotic spindle, and for efficient chromosome
    congression via EML4 release from spindle microtubules. Depletion or catalytically compromised NEK7
    arrests cells in prometaphase/metaphase with monopolar, multipolar or fragile spindles, and loss of
    Nek7 in mouse causes chromosome lagging, cytokinesis failure and polyploidy.
