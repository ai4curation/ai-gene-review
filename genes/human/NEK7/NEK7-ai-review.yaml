- term:
    id: GO:0043549
    label: regulation of kinase activity
  evidence_type: IDA
  original_reference_id: PMID:12840024
  qualifier: involved_in
  review:
    summary: Regulation of kinase activity (IDA) from the NEK9/NEK6/NEK7 cascade paper.
    action: UNDECIDED
    reason: 'In the cited work the regulatory direction runs the other way: NEK9 (Nercc1) phosphorylates
      and activates NEK6 and NEK7, so NEK7 is the regulated kinase rather than a regulator of one. Only
      the abstract is cached, so I cannot check whether the full text contains data in which NEK7 modulates
      another kinase''s activity (NEK7 autophosphorylation in trans would be a borderline case). Because
      I cannot read the supporting text behind this experimental annotation, I flag it as UNDECIDED rather
      than removing it; if the annotation does reflect NEK9 acting on NEK7, it is misdirected and should
      be retired.'
    supported_by:
    - reference_id: PMID:12840024
      supporting_text: Nercc1 activates Nek7 in vitro in a similar manner
    - reference_id: PMID:12840024
      supporting_text: Nek6 (314AA) and Nek7 (303AA), 76% identical, have little noncatalytic sequence
        but bind to the carboxyl-terminal noncatalytic tail of Nercc1/Nek9
