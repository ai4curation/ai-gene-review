- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:26188091
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6ZW76
  review:
    summary: IPI annotation for the NEK7-ANKS3 interaction (Q6ZW76), annotated to generic protein binding.
    action: REMOVE
    reason: 'GO:0005515 protein binding carries no functional information: it does not say what NEK7 does
      with the partner, in which direction the regulation runs, or in what process. Removing it does not
      question the reported interaction, and no informative molecular-function term can be derived from
      a binary interaction measurement alone. NEK7''s functionally characterised interactions (NEK9, NLRP3)
      are captured by specific terms elsewhere in this review. The cited study shows that ANKS3 binding
      retains NEK7 in the cytoplasm and that ANKS3 is modified in a NEK7-dependent but kinase-independent
      manner; neither observation yields a specific molecular-function term for NEK7, and the localisation
      consequence is a cellular-component rather than a molecular-function claim.'
    supported_by:
    - reference_id: PMID:26188091
      supporting_text: we show that Anks3, but not Anks6 interacted with the NIMA-related kinase Nek7
    - reference_id: PMID:26188091
      supporting_text: Importantly, Anks3 retained Nek7 in the cytoplasm, suggesting that, Nek7 triggers
        the modification of Anks3, which in turn prevents the nuclear localization of Nek7.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:26814970
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96P20
  review:
    summary: IPI annotation recording the direct NEK7-NLRP3 interaction, mapped by IntAct to the generic
      protein binding term.
    action: MODIFY
    reason: 'The cited paper does not merely report an interaction: it shows that NEK7 binds the NLRP3
      leucine-rich repeat domain and is required, downstream of potassium efflux, for NLRP3-ASC complex
      formation and caspase-1 activation, and that NEK7 catalytic activity is dispensable for this. That
      is a non-catalytic activator function, so the uninformative protein binding term should be replaced
      by GO:0140677 molecular function activator activity (with NLRP3 as input), which is already the
      term UniProt uses for the same biology from the structural papers.'
    proposed_replacement_terms:
    - id: GO:0140677
      label: molecular function activator activity
    supported_by:
    - reference_id: PMID:26814970
      supporting_text: We have shown that Nek7 is an essential factor that specifically and non-redundantly
        functions downstream of potassium efflux to regulate the activation of the NLRP3 inflammasome.
    - reference_id: PMID:26814970
      supporting_text: Nek7 interacted with WT or mutant NLRP3 lacking the N-terminal Pyrin domain, but
        not NLRP3 with deletion of the C-terminal leucine-rich repeats (LRRs)
    - reference_id: PMID:26814970
      supporting_text: In contrast, the catalytic activity of Nek7 is not required for NLRP3 activation.
