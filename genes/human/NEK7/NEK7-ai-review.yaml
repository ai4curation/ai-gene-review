- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1890645
  - PANTHER:PTN002878636
  - UniProtKB:Q8TDX7
  review:
    summary: Nuclear localisation (is_active_in) inferred from the phylogenetic node PANTHER:PTN002878636.
    action: KEEP_AS_NON_CORE
    reason: 'A nuclear pool of NEK7 is supported indirectly: ANKS3 binding is reported to prevent NEK7
      nuclear localisation, which presupposes that NEK7 can enter the nucleus. This is a peripheral distribution
      rather than a site where NEK7''s characterised functions occur - the kinase acts at the centrosome
      and spindle poles, and the inflammasome-licensing role occurs at the cytoplasmic microtubule-organizing
      centre - and no nuclear substrate or nuclear process has been identified. Keeping the annotation
      but flagging it as non-core reflects that evidence state.'
    supported_by:
    - reference_id: PMID:26188091
      supporting_text: Importantly, Anks3 retained Nek7 in the cytoplasm, suggesting that, Nek7 triggers
        the modification of Anks3, which in turn prevents the nuclear localization of Nek7.
