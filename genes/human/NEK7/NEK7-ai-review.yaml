core_functions:
- description: As the terminal kinase of the mitotic NEK9-NEK6/NEK7 cascade, NEK7 phosphorylates serine
    and threonine residues on substrates at the centrosome and spindle poles. Its activity is repressed
    in interphase by the Tyr-97 "Tyr-down" conformation and released in mitosis when the NEK9 C-terminal
    domain binds and promotes activation-loop trans-autophosphorylation. The one substrate with mapped
    sites is the microtubule-associated protein EML4 (Ser144, Ser146), whose phosphorylation lowers its
    microtubule affinity in mitosis.
