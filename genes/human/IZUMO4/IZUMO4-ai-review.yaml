existing_annotations:
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0243
  review:
    summary: IZUMO4 is a soluble signal-peptide protein, mapped by UniProt to the secreted compartment.
    action: KEEP_AS_NON_CORE
    reason: IZUMO4 lacks a transmembrane domain and is predicted to be soluble and secreted. In sperm
      it appears to be an intra-acrosomal protein that is lost on the acrosome reaction, i.e. released
      to the extracellular space as acrosomal content. The extracellular location is plausible, but the
      main characterized pool is in the acrosome.
    supported_by:
    - reference_id: PMID:19658160
      supporting_text: Izumo 1-3 are transmembrane proteins expressed specifically in the testis, and
        Izumo 4 is a soluble protein expressed in the testis and in other tissues.
    - reference_id: PMID:19658160
      supporting_text: Because Izumo 4 is predicted to be a soluble protein, its loss after the AR suggests
        it could be an intra-acrosomal protein.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: HDA
  original_reference_id: PMID:21630459
  qualifier: located_in
  review:
    summary: Detected in a mass-spectrometry catalogue of isolated human sperm nuclei.
    action: MARK_AS_OVER_ANNOTATED
    reason: A single proteomic identification in CTAB-isolated sperm nuclei is weak localization evidence.
      IZUMO4 is a signal-peptide-bearing soluble secretory-pathway protein found in the sperm head acrosomal
      region; a nuclear (chromatin) location is not supported by any targeted study and likely reflects
      co-purification of head-associated material.
    supported_by:
    - reference_id: PMID:21630459
      supporting_text: With this approach, 403 different proteins have been identified from the isolated
        sperm nuclei.
    - reference_id: PMID:40760720
      supporting_text: IZUMO proteins were immunolocalized in the acrosomal region of acrosome-intact
        and acrosome-reacted cells.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00028763
  review:
    summary: ARBA-based membrane assignment from the Izumo family.
    action: REMOVE
    reason: The rule transfers the membrane location of transmembrane family members (IZUMO1-3), but IZUMO4
      lacks a transmembrane domain and is a soluble protein. No membrane anchor is predicted; the UniProt
      record has only a signal peptide.
    supported_by:
    - reference_id: PMID:19658160
      supporting_text: On the other hand, Izumo 4 stands out from the other three members because it lacks
        a transmembrane domain and shows a wider tissue expression.
- term:
    id: GO:0001669
    label: acrosomal vesicle
  evidence_type: IDA
  original_reference_id: PMID:40760720
  review:
    summary: IZUMO4 is detected in the acrosomal region of human sperm and is lost from mouse sperm upon
      the acrosome reaction.
    action: NEW
    reason: Human immunolocalization places IZUMO4 in the acrosomal region, and mouse biochemical data
      indicate a soluble intra-acrosomal pool released by the acrosome reaction. Acrosomal vesicle is
      proposed rather than acrosomal lumen because the luminal assignment is inferred, not shown.
    supported_by:
    - reference_id: PMID:40760720
      supporting_text: IZUMO proteins were immunolocalized in the acrosomal region of acrosome-intact
        and acrosome-reacted cells.
    - reference_id: PMID:19658160
      supporting_text: Taken together, these results suggest Izumo 4 may be an intra-acrosomal protein
