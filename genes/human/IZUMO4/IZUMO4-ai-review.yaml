id: Q1ZYL8
gene_symbol: IZUMO4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IZUMO4 is the most conserved and least testis-restricted member of the Izumo family. Unlike
  IZUMO1-3 it has an N-terminal signal peptide but no transmembrane segment, and is a soluble glycoprotein
  that carries the IZUMO domain. In sperm it is found in the head, where mouse data suggest an intra-acrosomal
  location because it is largely lost upon the acrosome reaction, and it forms a dimer-sized complex.
  Antibodies against IZUMO4 reduce human sperm binding and penetration in gamete-interaction assays, but
  mouse Izumo4 knockout males are fertile, so its biological role remains unresolved.
