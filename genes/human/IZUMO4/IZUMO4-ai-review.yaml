core_functions:
- description: Soluble acrosomal glycoprotein of the sperm head of unknown molecular activity; antibody
    blocking implicates it in human sperm-oocyte interaction, but it is dispensable for male fertility
    in mice.
  locations:
  - id: GO:0001669
    label: acrosomal vesicle
  supported_by:
  - reference_id: PMID:40760720
    supporting_text: IZUMO proteins were immunolocalized in the acrosomal region of acrosome-intact and
      acrosome-reacted cells.
  - reference_id: PMID:40572022
    supporting_text: The KO males displayed no obvious health problems, and normal mating behavior, fecundity,
      testis and epididymis histology, and sperm morphology and motility.
suggested_questions:
- question: Is IZUMO4 a luminal acrosomal protein released at the acrosome reaction, and does it associate
    with IZUMO1 or JUNO on the sperm or egg surface after release?
- question: What is IZUMO4 doing in somatic tissues where it is also expressed?
suggested_experiments:
- description: Immunogold electron microscopy of human sperm before and after the acrosome reaction to
    define whether IZUMO4 is luminal or membrane-associated, combined with binding assays of recombinant
    IZUMO4 to JUNO.
  experiment_type: localization and binding
