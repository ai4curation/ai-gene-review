  evidence_type: IDA
  original_reference_id: PMID:23399914
  qualifier: located_in
  review:
    summary: Retain axonal localization in the neuronal BIN1 context.
    action: ACCEPT
    reason: The original human annotation is supported by the curator-selected experiment. The selected
      paper sections independently show neuronal BIN1 cytoskeletal distribution and mouse synaptosomal
      recovery, but the particular axonal image was not inspected. Rat-brain axonal-domain localization
      in PMID:9182667 provides separate corroboration, not a replacement human IDA experiment.
    supported_by:
