    action: KEEP_AS_NON_CORE
    reason: The positive result is further progression toward differentiated phenotypes after BIN1 overproduction
      in neuroblastoma and astrocytoma cells already committed to neuronal and astrocyte differentiation,
      respectively. Increasing the extent of differentiation in that context is compatible with GO:0048711;
      the term does not require initiating differentiation in uncommitted cells. The same abstract separately
      reports no marker induction in undifferentiated cells, where apoptosis predominated. Retain the
      existing IMP assertion as non-core with this ectopic-expression and transformed-cell scope, without
      extending it to normal astrocyte development or every BIN1 isoform.
    supported_by:
    - reference_id: PMID:10412034
      supporting_text: "further induction towards more \ndifferentiated phenotypes"
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19004523
  qualifier: enables
  review:
    summary: Refine CLIP170 recognition to cytoskeletal regulatory protein binding.
    action: MODIFY
    reason: GOA identifies CLIP170/P30622. The complete abstract maps association to the BIN1 N-terminal/BAR
      region and an internal CLIP170 coiled coil, with pull-down and endogenous HeLa co-immunoprecipitation.
      CLIP170 regulates microtubule stability and its depletion reduces BIN1-positive tubules, supporting
      recognition of a cytoskeletal regulator. This is not direct tubulin binding. Because this source
      object contains CLIP170 alone and explicitly establishes its microtubule-regulatory role, GO:0005519
      is available here; the combined CLIP170/nesprin-2 assertion from PMID:26506308 uses GO:0008092 to
      cover both recorded partners.
    supported_by:
    - reference_id: PMID:19004523
      supporting_text: "the N-terminal part of amphiphysin 2 (mostly the BAR domain) and an internal \n\
        coiled-coil region of CLIP-170"
    proposed_replacement_terms:
    - id: GO:0005519
      label: cytoskeletal regulatory protein binding
- term:
    id: GO:0060987
    label: lipid tube
  evidence_type: IMP
  original_reference_id: PMID:19004523
  qualifier: part_of
  review:
    summary: Retain BIN1 as a component of the induced lipid-tube structures.
    action: ACCEPT
    reason: The source describes intracellular BIN1-positive tubules in HeLa cells and dependence on microtubules
      and CLIP170. Preserve the part_of qualifier; this annotation does not equate these experimental
      tubules with muscle T-tubules.
    supported_by:
    - reference_id: PMID:19004523
- term:
    id: GO:0060988
    label: lipid tube assembly
  evidence_type: IMP
  original_reference_id: PMID:19004523
  qualifier: involved_in
  review:
    summary: BIN1 directly participates in lipid-tube assembly with cytoskeletal support.
    action: ACCEPT
    reason: The source combines an intrinsic membrane-tubulation function with CLIP170-dependent interactions
      and perturbation of BIN1-positive tubules after microtubule depolymerization or CLIP170 depletion.
      BIN1 supplies the membrane-shaping component rather than simply reporting a distant phenotype.
    supported_by:
