core_functions:
- description: The N-BAR region binds lipid membranes and directly bends them into tubular structures.
    Phospholipid engagement, membrane-bound assembly and curvature-dependent recruitment cooperate in
    this membrane-shaping activity; muscle splice forms use it in T-tubule organization.
  molecular_function:
    id: GO:0180020
    label: membrane bending activity
  directly_involved_in:
  - id: GO:0060988
    label: lipid tube assembly
  - id: GO:0033292
    label: T-tubule organization
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0030315
    label: T-tubule
  supported_by:
  - reference_id: PMID:18658220
    supporting_text: "Deletion of \nhelix-0 reduced tubulation of liposomes by the BAR domain"
  - reference_id: PMID:24755653
    supporting_text: WT BIN1 N-BAR protein acted as a strong curvature generator.
  - reference_id: PMID:17676042
- description: BIN1 binds dynamin through its SH3 domain and recruits the GTPase to membrane tubules.
    Coupling this partner interaction to BAR-mediated membrane remodeling helps organize endocytic machinery;
    dynamin supplies GTP hydrolysis, while BIN1 supplies membrane and protein contacts.
  molecular_function:
    id: GO:0051020
    label: GTPase binding
  directly_involved_in:
  - id: GO:0006897
    label: endocytosis
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:17676042
    supporting_text: "abrogates the interaction with DNM2 and its \nrecruitment to the membrane tubules"
  - reference_id: PMID:9182667
  - reference_id: Reactome:R-HSA-8868236
- description: BIN1 binds actin and associates with nesprin and the microtubule-associated regulator CLIP170,
    connecting the nuclear envelope and membrane-associated structures to the cytoskeleton. These structural
    contacts contribute to nucleus organization, including nuclear position and shape.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  directly_involved_in:
  - id: GO:0006997
    label: nucleus organization
  supported_by:
  - reference_id: PMID:26506308
    supporting_text: "AMPH-1/BIN1 binds to nesprin and actin, as well as to the \nmicrotubule-binding protein\
      \ CLIP170"
  - reference_id: PMID:19004523
