suggested_questions:
- question: Which full-paper assay or polymerase-complex interpretation supports GO:0070063 from PMID:16530520?
    The directly checked P27958 partner chain is NS5A, distinct from the NS5B polymerase; the exact Q9WMX2
    processed-chain feature and original source-specific assay remain to be verified.
  experts: []
- question: Does PMID:27179792 demonstrate inhibition of BACE1 molecular activity beyond altered abundance
    and endosomal delivery?
  experts: []
- question: How should the 122 raw GOA assertions be reconciled with the 112 existing review objects so
    that collapsed partner sets are retained without changing source identity?
  experts: []
- question: Which human BIN1 splice products account for individual neuronal, sarcomeric and nuclear localizations,
    and how do those product identifiers map to the different numbering systems used in older papers?
  experts: []
suggested_experiments:
- hypothesis: Distinct BIN1 membrane-binding and partner-recruitment modules make separable contributions
    to membrane remodeling.
  description: Compare expression-matched rescue with defined full-length human BIN1 splice products and
    BAR/SH3 perturbations in myotubes and neurons, measuring membrane tubulation, dynamin recruitment
    and cargo trafficking separately.
- hypothesis: The effect of BIN1 on BACE1 output can arise from altered trafficking rather than reduced
    activity per BACE1 molecule.
  description: Measure BACE1 activity at matched enzyme abundance alongside endosome-to-lysosome delivery
    and turnover after BIN1 perturbation; test whether the effects persist when trafficking is held constant.
