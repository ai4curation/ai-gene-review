    label: regulation of neuron differentiation
  evidence_type: IMP
  original_reference_id: PMID:10412034
  qualifier: involved_in
  review:
    summary: Retain the cell-state-dependent neuronal differentiation response.
    action: KEEP_AS_NON_CORE
    reason: The complete abstract describes BIN1 overexpression in neuroblastoma and astrocytoma lines.
      Undifferentiated cells show growth inhibition and apoptosis without induction of differentiation
