id: O00499
gene_symbol: BIN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BIN1 (amphiphysin II) is a peripheral membrane and cytoskeletal adaptor whose N-BAR domain
  binds phospholipids, senses membrane curvature and deforms membranes into tubules. Alternative splicing
  changes its membrane-targeting and interaction regions, giving neuronal, muscle and more widely expressed
  forms distinct properties. BIN1 membrane shaping is central to skeletal-muscle T-tubule organization
  and contributes to endocytic membrane remodeling. Its SH3 domain recruits partners including dynamin,
  while CLAP-containing forms interact with clathrin-associated machinery. Contacts with actin, nesprins
  and CLIP170 link membranes and the nuclear envelope to the cytoskeleton. Additional interactions with
  MYC, tau, intracellular clusterin and BACE1 connect particular BIN1 forms to growth regulation and neuronal
  protein trafficking. Pathogenic BIN1 variants that disrupt membrane deformation or dynamin recruitment
  cause centronuclear myopathy.
