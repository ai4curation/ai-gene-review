    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11035810
  qualifier: enables
  supporting_entities:
  - UniProtKB:P49841
  review:
    summary: Replace bare protein binding to a kinase with protein kinase binding.
    action: MODIFY
    reason: The row records an interaction with GSK3 or LRRK2, both protein kinases. Protein kinase
      binding is the more informative binding term; bare GO:0005515 is too generic for curation.
    proposed_replacement_terms:
    - id: GO:0019901
      label: protein kinase binding
