    label: regulation of heart rate
  evidence_type: TAS
  original_reference_id: PMID:23507255
  qualifier: involved_in
  review:
    summary: Mark regulation of heart rate as over-annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The evidence is compatible with PRKACA acting upstream in a context where regulation of
      heart rate changes, but it does not show that PRKACA itself performs a dedicated step in that
      broad process. PRKACA is a pleiotropic kinase, so this context should not be promoted to a
      kept process annotation.
