core_functions:
- description: PRKACA is the catalytic subunit of cAMP-dependent protein kinase holoenzymes;
    cAMP-regulated release from PKA regulatory subunits activates phosphorylation of Ser/Thr
    residues on cytosolic and nuclear protein substrates.
  molecular_function:
    id: GO:0004691
    label: cAMP-dependent protein kinase activity
  directly_involved_in:
  - id: GO:0006468
    label: protein phosphorylation
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0005952
    label: cAMP-dependent protein kinase complex
  supported_by:
  - reference_id: PMID:21812984
    supporting_text: PKA is a heterotetrameric holoenzyme consisting of a regulatory (R) subunit
      dimer and two catalytic (C) subunits.
proposed_new_terms: []
suggested_questions:
- question: Which PKA catalytic isoform and regulatory-subunit composition executes the
    AKAP8-dependent nuclear FSH-to-CREB step in primary human granulosa cells?
suggested_experiments:
- description: Use isoform-specific PRKACA/PRKACB perturbation in primary human granulosa cells with
    FSH stimulation, nuclear PKA activity reporters, CREB Ser-133 phosphorylation, CYP19A1
    expression and estradiol synthesis to test which catalytic subunit carries the GO-CAM step.
knowledge_gaps: []
