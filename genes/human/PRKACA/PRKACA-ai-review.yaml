- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P05132
  - ensembl:ENSMUSP00000005606
  review:
    summary: Keep magnesium ion binding as part of the conserved PKA catalytic-site chemistry.
    action: ACCEPT
    reason: PRKACA is an ATP-dependent cAMP-dependent protein kinase; its catalytic domain binds ATP
      and divalent Mg/Mn ions to transfer phosphate to serine and threonine residues on protein
      substrates. The IEA row is broad but supports a cofactor or nucleotide requirement of this
      core kinase activity.
    additional_reference_ids:
    - file:human/PRKACA/PRKACA-uniprot.txt
