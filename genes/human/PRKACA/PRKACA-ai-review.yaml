- term:
    id: GO:0004712
    label: protein serine/threonine/tyrosine kinase activity
  evidence_type: IDA
  original_reference_id: PMID:22797923
  qualifier: enables
  review:
    summary: Remove the Ser/Thr/Tyr kinase activity row.
    action: REMOVE
    reason: PRKACA is a cAMP-dependent serine/threonine kinase. Its UniProt catalytic activity
      records EC 2.7.11.11 phosphotransfer to L-seryl and L-threonyl protein residues, not a protein
      tyrosine kinase reaction, so the mixed Ser/Thr/Tyr term overstates the supported chemistry.
    additional_reference_ids:
    - file:human/PRKACA/PRKACA-uniprot.txt
