id: P17612
gene_symbol: PRKACA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PRKACA encodes the alpha catalytic subunit of cAMP-dependent protein kinase A, an ATP- and
  divalent-cation-dependent Ser/Thr kinase released from inactive PKA holoenzymes when cAMP binds the
  regulatory subunit dimer. PRKACA isoform 1 is broadly expressed and phosphorylates cytosolic and nuclear
  substrates downstream of GPCR-cAMP signaling, whereas the sperm-enriched isoform 2 contributes to flagellar
  PKA signaling. Its substrate range connects cAMP to transcription, ion transport, ciliary Hedgehog regulation,
  mTORC1, proteasome regulation, mitochondrial protein turnover and many tissue-specific signaling outputs.'
alternative_products:
- name: 1 (C-alpha-1)
  id: P17612-1
- name: 2 (C-alpha-2, C-alpha-S, C(s))
  id: P17612-2
  sequence_note: VSP_004759
