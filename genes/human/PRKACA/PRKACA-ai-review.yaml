  review:
    summary: Use the same paper for PRKACA kinase activity rather than bare substrate binding.
    action: MODIFY
    reason: The cited low-throughput study reports binding to a PKA substrate or PKA-localizing
      factor and also supports PRKACA-dependent phosphorylation or nuclear localization. The
      specific curated function is cAMP-dependent protein kinase activity, not generic protein
      binding.
    proposed_replacement_terms:
    - id: GO:0004691
      label: cAMP-dependent protein kinase activity
