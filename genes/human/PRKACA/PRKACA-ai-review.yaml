  review:
    summary: The generic protein kinase term is true but less informative than PRKACA-specific
      kinase annotations.
    action: TOO_GENERAL
    reason: PRKACA is specifically a cAMP-dependent serine/threonine protein kinase; GO:0004672 says
      only that it is a protein kinase. The review keeps GO:0004691, protein serine/threonine kinase
      activity, and protein serine kinase activity rows that carry the same catalytic claim at more
      informative granularity.
