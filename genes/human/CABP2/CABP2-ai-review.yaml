references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The preserved GOA record uses InterPro-to-GO mapping for calcium binding. This is a
      domain inference, corroborated independently by target biochemical studies; it does not specify
      an exact calcium affinity or identify which human splice product was assayed.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator
    judgment of sequence similarity
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The preserved ISS annotations transfer manually curated ortholog evidence from mouse
      CaBP2/Q9JLK4. Channel regulation, hearing and broader visual transmission are assessed separately.
      An ortholog experiment is not relabeled as a human tissue experiment.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The source records identify PAINT phylogenetic inferences, including a valid target
      self-source for membrane activity. Donor count and the presence of another family member are not
      grounds for rejection. The phototransduction assertion remains unresolved because the inspected
      target evidence does not establish the photon-conversion step or settle the node placement; the
      other conserved functions are adjudicated independently.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The preserved source records map UniProt subcellular-location vocabulary to GO. Plasma
      membrane, Golgi and perinuclear assignments are compared with the actual tagged human CaBP2 experiments
      in PMID:19338761; the source mapping does not by itself establish endogenous human sensory-cell
      localization.
- id: PMID:10625670
  title: Five members of a novel Ca(2+)-binding protein (CABP) subfamily with similarity to calmodulin.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal PMID/title/DOI/PMCID identity and complete abstract were checked, and selected
      unique Methods, Results and Discussion paragraphs were read. Human, mouse and bovine cloning and
      recombinant effector assays are distinguished. CaBP2 calcium-sensitive chromatography, CaMKII stimulation,
      peptide affinity and GRK5 inhibition are reported, while physiological effector colocalization remains
      unresolved. Bacterial N-myristoyltransferase modifies CaBP2; CaBP2 is not assigned acyltransferase
      activity. The 61-residue splice difference described in the Results is mouse-specific and is not
      substituted for the two current human product records. Images were not inspected.
- id: PMID:19338761
  title: Membrane targeting of the EF-hand containing calcium-sensing proteins CaBP7 and CaBP8.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal bibliographic identity and complete abstract were checked. The actual unique
      Methods and Results include human CaBP2 fluorescent constructs in differentiated Neuro2A cells,
      despite the CaBP7/8-focused title. CaBP2 is described at the plasma membrane and a perinuclear region
      resembling the Golgi. The syntaxin-6/VSVG TGN colocalization and transmembrane-domain perturbations
      concern CaBP7/8. They are not transferred to CaBP2. No images or endogenous human tissue localization
      were inspected.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The complete canonical abstract and selected HuRI binary-screening/retesting framework
      were read in the bounded consultation. All 33 CABP2 GOA partner records match the UniProt IntAct
      edge list. Individual target supplementary entries and partner-specific orthogonal validation were
      not independently inspected. Retention as non-core follows curator-supported evidence and the standing
      project instruction; dataset-level benchmarking and NbExp counts are not presented as native physiological
      validation of each edge. The existing canonical cache is preserved; its separately fetched variant
      is not substituted.
- id: file:human/CABP2/CABP2-uniprot.txt
  title: UniProtKB Q9NPB3 CABP2_HUMAN source record
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authenticated normal primary record; identity, two product names/IDs, curated function/location
      and exact IntAct partners read. It supplies curated evidence, not proof that every underlying target
      assay was independently inspected.
- id: PMID:22981119
  title: A mutation in CABP2, expressed in cochlear hair cells, causes autosomal-recessive hearing impairment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal PMID/title/DOI/PMCID identity and complete abstract checked; selected full Methods
      and Results read both from the official primary page and normal HTML cache. Human WT CaBP2 and an
      engineered p.Phe164* truncation surrogate were tested with rat CaV1.3 in HEK293T cells; the surrogate
      is not the exact predicted p.Phe164Serfs*4 protein and retained partial CDI suppression. Purified
      bacterial protein ITC demonstrates calcium binding. COS7 exon trapping tests splicing rather than
      patient inner-ear protein. The reported current-density reduction was not reproduced under the refined
      2017 heterologous conditions and is not treated as a universal mechanism. No images or supplements
      inspected.
- id: PMID:28183797
  title: Ca(2+)-binding protein 2 inhibits Ca(2+)-channel inactivation in mouse inner hair cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal identity and complete abstract checked; unique main Results/Discussion and relevant
      Methods read in full selected paragraphs. Human genetics, refined HEK293/hSK3-1 experiments and
      native mouse IHC/SGN physiology are distinct. Corrected-channel/SK3-1 conditions did not reproduce
      the 2012 current-density decrease. Native channel activation and current density were unchanged,
      whereas inactivation increased; the room-temperature analysis showed increased VDI and a nonsignificant
      CDI trend. LacZ reports expression and antibody localization attempts failed. Reduced SGN firing
      supports impaired sound encoding, while capacitance did not show reduced exocytosis; the synaptic-channel-availability
      mechanism remains a supported proposal. Nonsense-mediated decay for c.466G>T was inferred, not measured.
      Images and supplementary tables were not inspected.
core_functions:
- description: CaBP2 limits CaV1.3 channel inactivation and supports synaptic sound encoding at inner-hair-cell
    synapses. Calcium sensing and membrane association are features of this regulatory unit. Human genetics
    and heterologous channel assays complement native mouse IHC/SGN physiology. Sustained synaptic channel
    availability is the proposed link between channel regulation and sound encoding; peak-current amplitude
    and synaptic exocytosis are not assumed to change uniformly across assays.
  molecular_function:
    id: GO:0005246
    label: calcium channel regulator activity
  directly_involved_in:
  - id: GO:0007605
    label: sensory perception of sound
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:22981119
  - reference_id: PMID:28183797
    supporting_text: normal activation and deactivation but increased inactivation
  - reference_id: file:human/CABP2/CABP2-uniprot.txt
suggested_questions:
- question: Which molecular targets mediate CaBP2 function in retinal signal transmission, and does its
    own activity participate in phototransduction as defined by GO:0007602 or act downstream in the retinal
    circuit?
- question: How do the normal L-CaBP2 and S-CaBP2 products differ in physiological channel modulation
    and localization, independently of pathogenic truncations?
- question: Do the CaMKII and GRK5 effects reported in vitro occur at physiological CaBP2 abundance in
    native sensory cells?
