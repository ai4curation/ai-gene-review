id: Q9NPB3
gene_symbol: CABP2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CaBP2 is an EF-hand calcium-binding protein that regulates voltage-gated calcium channels
  in sensory cells. Its inhibition of CaV1.3 inactivation supports sustained presynaptic calcium entry
  and sound encoding at inner-hair-cell synapses. Calcium binding and membrane association support this
  regulatory role. CaBP2 also contributes to retinal signal transmission and is expressed as long and
  short splice isoforms, L-CaBP2 and S-CaBP2.
alternative_products:
- name: L-CaBP2
  id: Q9NPB3-1
- name: S-CaBP2
  id: Q9NPB3-2
  sequence_note: VSP_000734
existing_annotations:
- term:
    id: GO:0005246
    label: calcium channel regulator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1352749
  - PANTHER:PTN000550340
  review:
    summary: CaBP2 regulates calcium-channel inactivation in sensory cells.
    action: ACCEPT
    reason: Human CaBP2 suppresses CaV1.3 calcium-dependent inactivation in the 2012 heterologous assay,
      and the 2017 native mouse study finds increased channel inactivation after Cabp2 disruption. The
      latter room-temperature analysis primarily resolves increased voltage-dependent inactivation; its
      CDI trend was not significant. Together these experiments support the existing broad calcium-channel
      regulator activity. The refined 2017 cell assay did not reproduce the earlier decrease in peak current
      density, and native current density was unchanged. The conserved assertion is retained with human
      construct, rat channel and native mouse boundaries distinguished.
    supported_by:
    - reference_id: PMID:22981119
    - reference_id: PMID:28183797
      supporting_text: normal activation and deactivation but increased inactivation
    - reference_id: file:human/CABP2/CABP2-uniprot.txt
