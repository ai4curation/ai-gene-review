  review:
    action: KEEP_AS_NON_CORE
    summary: CABP2 has a curated binary interaction with DPEP2NB (A0A0U1RQF7).
    reason: The HuRI human-protein interaction study uses systematic yeast two-hybrid screening with pairwise
      retesting and sequence confirmation. The exact A0A0U1RQF7 edge is present in both the source GOA
      record and the UniProt IntAct interaction list. Retain the curator-supported physical interaction
      as non-core; the individual target supplementary record was not independently inspected and no partner-specific
      orthogonal validation is claimed. This edge alone does not establish a channel-regulatory role or
      transfer the partner's biochemical function to CABP2.
    supported_by:
