  review:
    summary: CaBP2 supports sound encoding through calcium-channel regulation at inner-hair-cell synapses.
    action: ACCEPT
    reason: Human CABP2 variants cause hearing impairment, while mouse Cabp2 disruption increases IHC
      calcium-channel inactivation and reduces spontaneous and sound-evoked SGN firing without loss of
      cochlear amplification. Presynaptic calcium-channel regulation therefore supports synaptic sound
      encoding. The 2017 capacitance measurements did not directly show reduced exocytosis; impaired channel
      availability is a proposed explanation of the neural phenotype. Human genetics and heterologous
      assays are distinguished from native mouse physiology.
