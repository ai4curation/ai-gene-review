  supporting_entities:
  - InterPro:IPR002048
  review:
    summary: Calcium binding is an intrinsic feature of the CaBP2 sensory regulator.
    action: ACCEPT
    reason: Calcium binding is supported by target recombinant-protein isothermal titration calorimetry
      in PMID:22981119 and PMID:28183797, independently of the earlier calcium-sensitive purification
      behavior in PMID:10625670. The 2012 WT protein and truncation surrogate had different binding thermodynamics.
      No exact physiological affinity or equivalence of the two normal human splice products is inferred.
      Calcium sensing is part of the same channel-regulatory unit.
    supported_by:
    - reference_id: PMID:22981119
      supporting_text: endothermic Ca 2+ -binding reaction
