    label: protein phosphatase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:18715871
  qualifier: enables
  review:
    summary: 'protein phosphatase inhibitor activity: PP4R4-containing complexes showed lower activity
      toward tested substrates than free PP4c. This supports the experimental inhibitory/regulatory effect
      in that assay, but not a universal inhibitor role for every physiological PP4 substrate.'
    action: KEEP_AS_NON_CORE
    reason: PP4R4-containing complexes showed lower activity toward tested substrates than free PP4c.
      This supports the experimental inhibitory/regulatory effect in that assay, but not a universal inhibitor
      role for every physiological PP4 substrate.
