suggested_questions:
- question: What are the physiological substrates of the cytosolic PPP4C-PPP4R4 holoenzyme, and does PP4R4
    redirect PP4c away from the chromatin-associated substrates (gammaH2AX, RPA2) targeted by PP4R2-PP4R3?
- question: Should the reduced in vitro activity of a PP2A-family holoenzyme relative to its free catalytic
    subunit be annotated as phosphatase inhibitor activity, given that the same is true of most regulatory
    subunits?
suggested_experiments:
- description: Phosphoproteomics in PPP4R4 knockout versus wild-type cells (e.g., testis or neural lines
    where PPP4R4 is expressed) to identify substrates whose dephosphorylation depends on PPP4R4 but not
    PPP4R2/PPP4R3.
- description: Cryo-EM or AlphaFold-guided mutagenesis of the PPP4C-PPP4R4 interface to determine whether
    PP4R4 occludes or shapes the PPP4C active site, distinguishing inhibitory from substrate-targeting
    roles.
