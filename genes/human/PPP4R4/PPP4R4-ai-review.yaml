gene_symbol: PPP4R4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PPP4R4 (PP4R4, KIAA1622) is a noncatalytic regulatory subunit of serine/threonine protein
  phosphatase 4 (PP4). The 873-residue canonical protein is built largely of HEAT/ARM-type repeats and
  has weak sequence similarity to the A (scaffolding) subunit of PP2A. It binds the PP4 catalytic subunit
  PPP4C specifically (not the related PP2A or PP6 catalytic subunits), through an interface analogous
  to that used by the PP2A A subunit, and forms a stable cytosolic PPP4C-PPP4R4 complex that is separate
  from the PP4 complexes containing PP4R1, PP4R2-PP4R3 or alpha4. Unlike PP2A A, PP4R4 does not bridge
  PP4c to other regulatory subunits. In vitro the PPP4C-PPP4R4 complex dephosphorylates a fluorogenic
  substrate and gammaH2AX with lower activity than free PPP4C, consistent with a regulatory subunit that
  modulates catalytic activity; its physiological substrates and cellular processes remain unknown.
