    summary: protein phosphatase regulator activity (IBA, PTN001087371). PP4R4 binds the PP4 catalytic
      subunit and modulates its activity in vitro; PAINT placed this function on the PPP4R4 family node
      with human PP4R4 as donor.
    action: ACCEPT
    reason: 'This is the core molecular function: PP4R4 is a noncatalytic HEAT/ARM-repeat partner that
      binds PP4c specifically, at an interface analogous to PP2A A-subunit binding, and alters the activity
      of the catalytic subunit. The term is appropriately general given that the physiological substrates
      and the direction of regulation in vivo are unknown. PTHR21467 is a single-subfamily (SF0) vertebrate-restricted
      family in which human PP4R4 is the only characterised member, so the IBA is grounded on the target''s
      own experimental data and asserts inheritance across PPP4R4 orthologs.'
