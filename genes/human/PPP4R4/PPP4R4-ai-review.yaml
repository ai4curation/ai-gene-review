existing_annotations:
- term:
    id: GO:0004864
    label: protein phosphatase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:18715871
  qualifier: enables
  review:
    summary: 'protein phosphatase inhibitor activity (IDA, PMID:18715871): in vitro, PP4c-PP4R4 complexes
      dephosphorylate a fluorogenic substrate and gammaH2AX less efficiently than free PP4c.'
    action: MODIFY
    reason: 'The reduced activity is real in the assay but does not distinguish PP4R4 from an ordinary
      holoenzyme regulatory subunit: the PP4c-PP4R2-PP4R3 complex is likewise less active than free PP4c
      on the same substrates, and nobody regards PP4R2/PP4R3 as inhibitors. Reduced activity of a PP2A-family
      holoenzyme toward small/generic substrates relative to the free catalytic subunit is the expected
      consequence of regulatory-subunit binding, and the physiological substrates of the PP4c-PP4R4 complex
      are unknown, so ''inhibitor'' over-reads the result. The parent term protein phosphatase regulator
      activity (GO:0019888), already on the gene by IBA, captures what is demonstrated (binds PP4c and
      modulates its activity). The two inhibitor rows are the same claim and receive the same action.'
    supported_by:
    - &id001
      reference_id: PMID:18715871
      supporting_text: "PP4c.PP4R4 complexes exhibit phosphatase activity toward a \nfluorogenic substrate\
        \ and gammaH2AX, but this activity is lower than that \nassociated with the PP4c.PP4R2.PP4R3 complex,\
        \ which itself is less active than \nthe free PP4c catalytic subunit."
    proposed_replacement_terms:
    - &id002
      id: GO:0019888
      label: protein phosphatase regulator activity
