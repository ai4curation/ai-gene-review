core_functions:
- description: Noncatalytic HEAT-repeat regulatory subunit that binds the PP4 catalytic subunit PPP4C
    and modulates its phosphatase activity within a distinct cytosolic PPP4C-PPP4R4 holoenzyme.
  molecular_function: *id002
