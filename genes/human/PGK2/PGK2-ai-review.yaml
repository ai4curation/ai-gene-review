    label: gluconeogenesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:97555
  - PANTHER:PTN000150497
  - RGD:619878
  - SGD:S000000605
  review:
    summary: Root PGK-family PAINT propagation of gluconeogenesis onto the sperm PGK2 branch.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The PGK reaction is reversible, but human PGK2 is the late spermatogenesis
      and sperm isozyme; the evidence supports glycolytic ATP production for
      sperm motility rather than a physiological gluconeogenesis role. UniProt's
      CC:FUNCTION gluconeogenesis sentence is also by-similarity from mouse
      Pgk2 (P09041), not PGK2-specific gluconeogenesis evidence.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000150497
        source_label: PTHR11406 root PGK node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The root PGK family node appropriately carries reversible PGK
          chemistry and gluconeogenesis for PGK1-like enzymes, but the
          testis/sperm PGK2 paralog branch is specialized for glycolytic ATP
          production in late spermatogenesis and sperm.
    supported_by:
    - reference_id: PMID:26677959
      supporting_text: PGK2 was mainly expressed in round spermatids
    - reference_id: file:human/PGK2/PGK2-uniprot.txt
      record_section: ["CC:TISSUE SPECIFICITY"]
      supporting_text: Testis-specific.
