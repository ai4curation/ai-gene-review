id: P07205
gene_symbol: PGK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Phosphoglycerate kinase 2 is a testis-enriched, autosomal phosphoglycerate
  kinase isozyme that replaces the X-linked somatic PGK1 enzyme in late
  spermatogenic cells and sperm. It catalyzes the reversible Mg2+-dependent
  transfer of phosphate between 1,3-bisphosphoglycerate/ADP and
  3-phosphoglycerate/ATP and supports ATP production for sperm flagellar
  motility, with a sperm-specific PAINT placement at the fibrous sheath.
