- id: PMID:8096434
  title: The elastin gene is disrupted by a translocation associated with supravalvular aortic stenosis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The authentic abstract reports an ELN-disrupting t(6;7) translocation associated with
      human supravalvular aortic stenosis. Full original Methods/Results were unavailable. The paper is
      used as bounded human genetic evidence, supplemented by independently established arterial structural
