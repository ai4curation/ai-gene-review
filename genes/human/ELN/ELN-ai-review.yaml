  full_text_unavailable: true
- id: PMID:8132745
  title: Supravalvular aortic stenosis associated with a deletion disrupting the elastin gene.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: All seven authentic scanned article pages were visually examined, including operative
      Methods, Results and figures. Human family genomic analyses establish an ELN-disrupting deletion
      in supravalvular aortic stenosis. The existing developmental interpretation is retained by curator
      deference as a non-core structural vascular role. No direct embryonic mechanism or mutant-protein
      assay is inferred; the authentic original was accessible and concerns ELN.
- id: PMID:9580666
  title: An elastin gene mutation producing abnormal tropoelastin and abnormal elastic fibres in a patient
    with autosomal dominant cutis laxa.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The authentic abstract and partial original clinical/Results preview report a human
      ELN frameshift, abnormal tropoelastin and abnormal elastic material in dominant cutis laxa. Complete
