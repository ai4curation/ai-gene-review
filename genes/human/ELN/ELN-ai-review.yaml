description: Elastin is a secreted extracellular matrix protein that forms the elastic core of elastic
  fibers. Its soluble precursor, tropoelastin, self-associates and binds matrix components during fiber
  assembly, while lysyl oxidases initiate covalent cross-linking that stabilizes the insoluble elastin
  network. Elastin provides recoil and mechanical resilience to arteries, lungs, skin and other elastic
  tissues. Alternative splicing produces multiple natural protein products.
