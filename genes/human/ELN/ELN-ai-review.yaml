    action: KEEP_AS_NON_CORE
    reason: 'PMID:30676771 directly measured binding of recombinant human tropoelastin, described as isoform
      2, to immobilized full-length LOXL2 by surface plasmon resonance, with an activated and blocked
      reference channel lacking LOXL2 (Methods: Surface plasmon resonance; Results: LOXL2 and tropoelastin
      interaction; Figure 5 caption). The reported steady-state dissociation constant is 146 ± 16 nM (n
      = 4). The subsequent oxidation and cross-linking experiments identify tropoelastin as the substrate
      and LOXL2 as the oxidase. They do not establish an ELN enzyme-regulator activity or a more specific
      binding function from the partner identity alone. Retain the supported generic interaction as non-core
      under the campaign convention; preserve the imported P15502-2 assay designation. The Methods describe
      human isoform 2 produced in E. coli but do not authenticate the complete experimental insert against
      the current 724-residue UniProt product, so no exact precursor-sequence or all-isoform generalization
      is made.'
