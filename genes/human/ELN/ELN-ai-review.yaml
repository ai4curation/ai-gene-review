  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached scientific text and separately recovered Figure 1–4 captions were read.
      Human fibulin-5 and fibrillin-1 fragments interact with tropoelastin in matrix-assembly experiments,
      including reference-corrected surface plasmon resonance. The ELN preparation is not mapped to every
      present natural product. Figure 3 contains a PF7/PF5 versus PF7/PF2 wording discrepancy, preserved
      as a caption limitation. No figure pixels or supplement were inspected.
- id: PMID:16478991
  title: Targeted disruption of fibulin-4 abolishes elastogenesis and causes perinatal lethality in mice.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected operative Methods, Results, captions and Discussion were read in an authentic
      recovered original despite the abstract-only normal cache. Human ELN/human EFEMP2 co-immunoprecipitation
      in 293T cells is distinct from purified mouse fibulin-4/bovine tropoelastin solid-phase binding.
      These positive matrix-association observations support the bounded functional refinement; neither
      the mouse knockout nor a partner name alone establishes a human molecular interaction. No full-paper
      or figure-pixel reading is claimed.
- id: PMID:17035250
  title: 'Fibulin-5 mutations: mechanisms of impaired elastic fiber formation in recessive cutis laxa.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: The authentic abstract and partial original Results preview contain positive wild-type/mutant
      fibulin-5–tropoelastin binding. Complete Methods and the exact ELN preparation corresponding to
      the imported pair remain unavailable. Rat RFL6 assembly experiments and the human fibulin mutation
      context are not silently converted into a defined human ELN insert. The positive binding report
      and curator assertion are retained; independent human fibulin-5/matrix experiments support the whole-gene
      matrix-binding refinement without resolving this preparation boundary.
  full_text_unavailable: true
- id: PMID:17324935
  title: A comparative analysis of the fibulin protein family. Biochemical characterization, binding interactions,
    and tissue localization.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: A genuine publisher-formatted public PDF was inspected at pages 2–4 and 6–7, including
      the actual Figure 5D pixels. Human recombinant tropoelastin and mouse fibulin-3 show weak positive
      binding that remains unsaturated at 1 micromolar. This is not an absent interaction, but it does
      not establish the same assembly mechanism as the stronger fibulin-4/5 systems. Exact ELN insert
      sequence and functional equivalence of natural products were not established.
- id: PMID:19570982
  title: Differential regulation of elastic fiber formation by fibulin-4 and -5.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic main XML was examined for preparation/binding Methods and the relevant Results,
      captions and Discussion. Human recombinant tropoelastin lacks domain 26A; the historical fibulin-4
      boundaries are not equated with a current 443-aa reference. Matrix-binding and ternary organization
      support an assembly role. The LOX–tropoelastin solid-phase positive and SPR-negative conditions
      remain distinct; ELN is not assigned oxidase activity. Human ARPE-19 fibulin-4 knockdown is separate
      from rat RFL6 fibulin-5 knockdown. No supplement or figure pixels were inspected.
- id: PMID:23962539
  title: Elastic fibres in health and disease.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The genuine publisher review PDF was read completely at PDF pages 1, 3, 10 and 11. These
      sections cover elastic-fiber architecture, arterial/respiratory mechanical function, tropoelastin
      coacervation and assembly, and the separate roles of lysyl oxidases and fibulins. It is a review
      synthesis, not a new human isoform-specific experiment. Other pages, figure pixels and supplements
      are not claimed read.
- id: PMID:25037231
  title: Extracellular matrix signatures of human primary metastatic colon cancers and their metastases
    to liver.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Operative human tissue-proteomics Methods and the authentic Additional file 2 workbook
      were inspected. Sheets A/B row 25 identify an ELN-containing group with 31 unique peptides overall
      and positive measurements in all 16 preparations or pools spanning colon tumors, liver metastases
      and normal tissues. The principal P15502-2 accession belongs to a multi-accession group; these are
      not 16 people or isoform-2-specific identifications. Detection supports ECM localization; elasticity
      is an independently established structural property, not measured by the mass spectrometry.
- id: PMID:27559042
  title: Glycoproteomics Reveals Decorin Peptides With Anti-Myostatin Activity in Human Atrial Fibrillation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Operative human atrial-tissue Methods and original Table 1 were inspected. The Elastin
      entry is positive only in GuHCl Input; the glycoprotein-enrichment and glycopeptide columns are
      blank. Three-step extraction and human-database mass spectrometry support the matrix detection.
      No ELN mechanical assay, target-specific spectrum inspection or natural-product assignment is claimed.
- id: PMID:28327460
  title: Comprehensive proteomic characterization of stem cell-derived extracellular matrices.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic original Methods and the publisher supplement workbook identify ELN in decellularized
      human mesenchymal-stem-cell matrices. Table I row 36 contains bone-marrow-donor measurements; Table
      II row 27 contains an adipose-derived matrix measurement. Fractional reported peptide counts are
      not called unique peptides. Serum culture, residual cellular material and shared human/bovine peptides
      limit protein-origin and product specificity. Positive matrix detection is preserved without claiming
      an elasticity assay or interpreting dash entries as biological absence.
- id: PMID:28675934
  title: Characterization of the Extracellular Matrix of Normal and Diseased Tissues Using Proteomics.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic Methods and the ACS supplemental workbook were inspected. Six P15502/ELN_HUMAN
      protein rows in omental fractions report one unique peptide and one or two spectra per row; they
      are not six distinct sequences. Alternate hydroxylation searches are kept separate from new detections.
      The evidence supports broad ECM fraction localization and established structural classification,
      with no ELN mechanical assay, unique splice-product assignment or biological absence inferred from
      other fractions.
- id: PMID:30676771
  title: Lysyl oxidase-like 2 (LOXL2)-mediated cross-linking of tropoelastin.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic cached Methods, Results, Discussion and captions were read. Immobilized full-length
      LOXL2 binds mobile human tropoelastin in one-orientation SPR with a blocked reference channel; the
      reported dissociation constant is 146 ± 16 nM across four measurements. Tropoelastin is the substrate
      and LOXL2 the oxidase. Methods call the E. coli-expressed material human isoform 2, but exact insert/current
      724-aa precursor equivalence is unverified. The literal P15502-2 annotation is preserved. No supplement
      or figure pixels were inspected.
- id: PMID:36399478
  title: 'MatrisomeDB 2.0: 2023 updates to the ECM-protein knowledge database.'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Selected authentic main JATS sections establish the MatrisomeDB 2.0 human/mouse ECM
      proteomics resource, workflows and limitations. The main paper does not supply a new ELN-specific
      spectrum inspected here. The non-collagenous interstitial matrix classification is independently
      supported by the exact current GO definition, which explicitly includes elastin. Database membership
      is not treated as resolution of each molecule to a mature elastic fiber.
- id: PMID:7534784
  title: 'The association of human fibulin-1 with elastic fibers: an immunohistological, ultrastructural,
    and RNA study.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The authentic abstract explicitly reports human fibulin-1 association with anti-elastin/anti-fibrillin-1-identified
      fibers and ultrastructural labeling of amorphous elastic cores in skin and saphenous vein. That
