  evidence_type: IMP
  original_reference_id: PMID:8132745
  qualifier: involved_in
  review:
    summary: Retain the curated outflow-tract morphogenesis annotation as a contextual developmental role
      of elastin.
    action: KEEP_AS_NON_CORE
    reason: PMID:8132745 identifies a roughly 100 kb deletion disrupting the 3-prime ELN region in two
      affected members of a human family with supravalvular aortic stenosis. All seven original scanned
      pages were examined. The human genetic and structural vascular phenotype supports retaining the
      BHF-UCL curator’s developmental interpretation as non-core, alongside the independently established
      arterial morphogenesis role. This is deference to the existing IMP interpretation rather than a
      claim that the paper directly measured an embryonic outflow-tract mechanism or the mutant protein.
