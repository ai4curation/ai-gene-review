  full_text_unavailable: true
- id: PMID:9607766
  title: Elastin is an essential determinant of arterial morphogenesis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The indexed original operative Methods, Results, Discussion and captions were read.
      Mouse Eln deletion causes abnormal arterial matrix and smooth-muscle proliferation, including cultured
      embryonic aorta without blood-flow influences. These data support a contextual structural regulation
      of proliferation, not a purified human signaling assay. Adjacent unrelated articles in the indexed
      page and unseen figure pixels are excluded.
- id: PMID:9873040
  title: Cutis laxa arising from frameshift mutations in exon 30 of the elastin gene (ELN).
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The indexed original Methods, Results, Discussion and captions were read. Human cutis-laxa
      fibroblasts carry exon-30 frameshifts; clinical cardiopulmonary involvement is limited, and the
      study does not directly measure gas exchange or circulation. Those broad functions are retained
      from independent elastic-tissue physiology with this source limitation stated. Historical accessions
      and exon coordinates are not assigned to every current natural product. No figure pixels were inspected.
- id: Reactome:R-HSA-1566962
  title: Elastin degradation by elastin-degrading extracellular proteinases
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official typed event/entity records were inspected. R-HSA-1566962 has input polymer
      2161232, whose repeated unit 1454880 resolves to human P15502 through reference entity 54272 and
      carries GO:0005576. Its cleaved output also resolves to P15502 fragments. The catalyst is a separate
      extracellular proteinase set, not ELN. Retain extracellular region for the substrate and products
      without transferring protease activity or assuming the cleaved material remains in a mature elastic
      fiber.
- id: Reactome:R-HSA-1592387
  title: Fibulin binds elastic fibres
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official typed event/entity records were inspected. R-HSA-1592387 explicitly has an
      elastic-fiber input (2161360) and an elastic-fiber–fibulin output (2395337). Both trace through
      elastin polymer 2161232 to human P15502 at entity 1454880. Refine the broad extracellular-region
      location to GO:0071953 because this particular curated context explicitly supplies the fiber assembly
      state. This is a database component-chain inference, not a newly read localization experiment or
      a claim that soluble tropoelastin always resides in a mature fiber.
- id: Reactome:R-HSA-2129353
  title: Tropoelastin associates with microfibrils
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official typed event/entity records were inspected. R-HSA-2129353 traces its tropoelastin
      aggregate 2161342 and aggregate-containing output 2161254 to human P15502 entity 1454880 with extracellular-region
      compartment. The model depicts an assembly intermediate rather than exclusively mature elastic fibers,
      so the broad location remains appropriate. The ten repeated aggregate components are modeled stoichiometry,
      not ten independent observations. Non-target fibrillin and fibulin branches were not exhaustively
      expanded.
- id: Reactome:R-HSA-2129375
  title: Elastin cross-linking by lysyl oxidase
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official typed event/entity records were inspected. R-HSA-2129375 is a Polymerisation
      event with a tropoelastin-aggregate input and elastic-fiber output, both traced to human P15502.
      The exact target entities carry extracellular region. The separate catalyst 2022088 has protein-lysine
      6-oxidase activity and resolves to a lysyl-oxidase complex; ELN supplies structural substrate rather
      than that enzymatic activity. Preserve the broad location across the modeled precursor-to-fiber
      transition.
- id: Reactome:R-HSA-2161282
  title: Elastic fibres bind associated proteins
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official typed event/entity records were inspected. R-HSA-2161282 contains elastic-fiber
      complexes on both sides. The input 2396077 and output 2161325 trace through 2395337 and elastic-fiber
      complex 2161360 to elastin polymer 2161232 and human P15502 entity 1454880. This specific component
      chain supports refinement from extracellular region to GO:0071953. Associated-protein branches are
      not represented as additional direct ELN binding experiments, and no natural splice-product equivalence
      is inferred.
- id: Reactome:R-HSA-2161293
  title: Tropoelastin forms aggregate globules
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official typed event/entity records were inspected. R-HSA-2161293 has human P15502 entity
      1454880 as the repeated input and as ten components of aggregate 2161342. The entity spans reported
      coordinates 27–786, consistent with the displayed-reference signal-peptide boundary, but it is not
      a separate natural splice-product assertion. The model concerns extracellular aggregate formation
      before mature-fiber organization. Repeated entries are preserved as model stoichiometry rather than
      deduplicated or counted as independent evidence.
- id: Reactome:R-HSA-2514790
  title: Elastin degradation by MMP14
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official typed event/entity records were inspected. R-HSA-2514790 traces its elastin
      input and cleaved output to human P15502 entities bearing GO:0005576. The event also includes plasma
      membrane because its catalyst is membrane associated; that event-level location is not transferred
      to ELN. The separate catalyst activity is metalloendopeptidase activity, not an ELN function. Broad
      extracellular location remains supported across the intact and cleaved substrate states.
- id: Reactome:R-NUL-2426460
  title: Mouse emilin-1 binds human elastin and mouse fibulin-5
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Official typed event/entity records were inspected. R-NUL-2426460 is explicitly chimeric:
      complexes 2426508 and 2426553 contain human elastin polymer 2161232 together with mouse Fbln5 and
      Emilin1 entities. The ELN branch resolves to human P15502 entity 1454880 with extracellular-region
      compartment. Retain the positive human-component location while preserving the mixed-species assembly
      context. The R-NUL identifier is not treated as a failed source or a mouse-only ELN assertion.'
