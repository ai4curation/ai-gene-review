id: Q8IW35
gene_symbol: CEP97
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CEP97 (also LRRIQ2) is a centrosomal protein with an N-terminal leucine-rich repeat domain
  and an IQ motif. It is the principal binding partner of CP110 and is required to recruit and stabilize
  CP110 at the distal ends of centrioles. Together CP110 and CEP97 form a cap on the distal end of the
  mother centriole that suppresses primary cilium formation in proliferating cells; the cap is anchored
  through a direct interaction between CEP97 and MPHOSPH9, which is itself recruited by KIF24, and it
  is removed after TTBK2 activity at the onset of ciliogenesis. CEP97 does not bind microtubules directly,
  unlike CP110. Depletion of CEP97 causes CP110 loss from centrosomes, spindle defects, polyploidy and
  inappropriate cilium formation in growing cells.
