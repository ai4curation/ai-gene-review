- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:17719545
  qualifier: enables
  review:
    summary: Protein-macromolecule adaptor activity (IDA) based on CEP97-dependent recruitment of CP110
      to centrosomes.
    action: ACCEPT
    reason: CEP97 binds CP110 and is required for CP110 centrosomal localization, and it links the CP110-CEP97
      cap to MPHOSPH9 by direct binding, i.e. it bridges CP110 to the centriolar recruitment machinery.
      This is the most informative molecular function available for CEP97.
    supported_by:
    - reference_id: PMID:17719545
      supporting_text: Depletion of Cep97 or expression of dominant-negative mutants results in CP110
        disappearance from centrosomes
    - reference_id: PMID:30375385
      supporting_text: recruits CP110-CEP97 by directly binding CEP97
- term:
    id: GO:0032991
    label: protein-containing complex
  evidence_type: IDA
  original_reference_id: PMID:24421332
  qualifier: part_of
  review:
    summary: Protein-containing complex (IDA), association with CP110- and Talpid3-containing complexes.
    action: KEEP_AS_NON_CORE
    reason: Correct but uninformative generic complex term; no specific GO complex term exists for the
      CP110-CEP97 distal cap.
    supported_by:
    - reference_id: PMID:24421332
      supporting_text: Collectively, these data indicate that Talpid3 robustly binds to CP110 and more
        weakly associates with Cep97, Cep290, and Kif24.
- term:
    id: GO:1901673
    label: regulation of mitotic spindle assembly
  evidence_type: IMP
  original_reference_id: PMID:17719545
  qualifier: involved_in
  review:
    summary: Regulation of mitotic spindle assembly (IMP) from CEP97 depletion causing spindle defects.
    action: KEEP_AS_NON_CORE
    reason: CEP97 depletion produces spindle defects and polyploidy, but this is most plausibly an indirect
      consequence of loss of CP110 and centrosome/cytokinesis defects rather than a direct role of CEP97
      in spindle assembly. Retained as non-core.
    supported_by:
    - reference_id: PMID:17719545
      supporting_text: Depletion of Cep97 or expression of dominant-negative mutants results in CP110
        disappearance from centrosomes, spindle defects, and polyploidy.
