core_functions:
- description: Adaptor that recruits and stabilizes CP110 at the distal end of centrioles and anchors
    the CP110-CEP97 cap to the mother centriole via direct binding to MPHOSPH9; the cap suppresses ciliogenesis
    in cycling cells until it is removed at cilium initiation.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:1902018
    label: negative regulation of cilium assembly
  locations:
  - id: GO:0005814
    label: centriole
  supported_by:
  - reference_id: PMID:17719545
    supporting_text: identified a previously uncharacterized protein, Cep97, that recruits CP110 to centrosomes
  - reference_id: PMID:30375385
    supporting_text: Here we show that M-Phase Phosphoprotein 9 (MPP9) is recruited by Kinesin Family
      Member 24 (KIF24) to the distal end of mother centriole where it forms a ring-like structure and
      recruits CP110-CEP97 by directly binding CEP97.
  - reference_id: PMID:17719545
    supporting_text: Cep97 and CP110 collaborate to inhibit a ciliogenesis program
suggested_questions:
- question: HPA detects CEP97 at centriolar satellites as well as the basal body and centrosome; does
    a satellite pool of CEP97 have a function distinct from the distal cap (for example in CP110 delivery
    or turnover)?
- question: CEP97 depletion lengthens centrioles in human cells although CEP97 does not bind microtubules;
    is this effect fully explained by loss of CP110, and should a centriole-length regulation process
    be annotated to CEP97 or only to CP110?
suggested_experiments:
- description: Map the CP110-binding and MPHOSPH9-binding surfaces of CEP97 and test separation-of-function
    mutants for CP110 cap retention, centriole length and ciliation in RPE1 cells.
