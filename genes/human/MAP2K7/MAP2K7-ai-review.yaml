core_functions:
- description: 'MKK7 is the JNK-specific dual-specificity MAP2K: after activation-loop phosphorylation (Ser271/Thr275) by
    stress- and cytokine-responsive MAP3Ks, it docks onto JNK1-3 through three N-terminal D-sites and phosphorylates the JNK
    Thr-Pro-Tyr motif, preferentially on Thr183, cooperating with MKK4 (Tyr185) for full JNK activation; it does not activate
    p38.'
