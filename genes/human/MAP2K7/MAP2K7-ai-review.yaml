id: O14733
gene_symbol: MAP2K7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MAP2K7 (MKK7, JNKK2, MEK7) is a dual-specificity protein kinase of the STE group that, together with MKK4, forms
  the MAP kinase kinase tier of the JNK stress-activated MAPK cascade. It is activated by phosphorylation of Ser271 and Thr275
  in its activation loop by MAP3Ks such as MEKK1, TAK1, ASK1, DLK and the mixed-lineage kinases, which dock onto its C-terminal
  DVD site. Activated MKK7 binds JNK1-3 through three low-affinity docking sites in its disordered N-terminal region and phosphorylates
  the JNK Thr-Pro-Tyr activation motif, with a strong preference for the threonine (Thr183); threonine phosphorylation alone
  raises JNK activity, and MKK4, which prefers the tyrosine, cooperates for full activation. Unlike MKK4, MKK7 is highly selective
  for JNK and does not activate p38 or (canonically) ERK MAPKs. MKK7 is activated by environmental stresses (UV, heat, osmotic
  shock) and is the MAP2K that is essential for JNK activation by the pro-inflammatory cytokines TNF and IL-1. It is a soluble
  cytoplasmic and nuclear protein that is assembled with MAP3Ks and JNK on scaffolds such as JIP1, and its activity is restrained
  by binding partners including GADD45beta and c-FLIPL. In human neurons MKK7 has also been reported to relay ApoE signalling
  from DLK to ERK1/2.
