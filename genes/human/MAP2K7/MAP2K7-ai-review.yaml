  review:
    summary: Magnesium ion binding attributed to the MKK7 cloning paper (Foltz et al. 1998), which characterised MKK7 as a
      JNK-activating kinase; Mg2+ is the cofactor of the kinase reaction.
    action: KEEP_AS_NON_CORE
    reason: MKK7, like all protein kinases, uses Mg2+-ATP as co-substrate (UniProt COFACTOR Mg2+). The cached abstract does
      not describe a metal-binding experiment, but kinase assays inherently require Mg2+ and the curator saw the full text.
      Cofactor binding is correct but is not an informative description of MKK7 function.
