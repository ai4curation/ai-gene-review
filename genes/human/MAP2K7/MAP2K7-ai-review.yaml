suggested_questions:
- question: Does the IPI between MKK7 and MAP3K12/DLK attributed to PMID:14697235 (a ZPK promoter paper) reflect a direct
    interaction reported in the full text, and should it be re-annotated as MAP kinase kinase kinase binding (GO:0031435)?
- question: Is the DLK -> MKK7 -> ERK1/2 route reported in human neurons (PMID:28111074) reproducible with purified components,
    and under which physiological conditions does MKK7 phosphorylate ERK rather than JNK?
- question: What MAP2K7 result in the kinome RNAi telomerase screen (PMID:21531765) supports the positive regulation of telomere
    maintenance annotation, and was it validated with independent reagents?
suggested_experiments:
- description: Kinase-dead MKK7 knock-in versus acute degron depletion in human cells, with and without MKK4 loss, to quantify
    MKK7-specific JNK Thr183 phosphorylation after TNF, IL-1 and UV, and to separate catalytic from scaffolding roles.
- description: In vitro kinase assays with purified activated MKK7 and ERK2 versus JNK1 (kcat/Km, with D-site mutants) to
    test whether ERK phosphorylation by MKK7 is direct and physiologically competitive.
