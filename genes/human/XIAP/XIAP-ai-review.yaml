  review:
    summary: XIAP-RIPK2 binding is mechanistic but should not be kept as generic protein binding.
    action: REMOVE
    reason: XIAP uses BIR2 to bind RIPK2 and its RING domain ubiquitinates RIPK2 in the NOD1/NOD2 
      signalosome. GOA already carries specific NOD1, NOD2, K63-ubiquitination, and ubiquitin-ligase
      rows for that biology.
    supported_by:
    - reference_id: PMID:29452636
      supporting_text: we identify NOD2 signaling and XIAP-dependent ubiquitination sites on RIP2 
        and show that mutating these lysine residues adversely affects NOD2 pathway signaling.
