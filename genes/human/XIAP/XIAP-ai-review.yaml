id: P98170
gene_symbol: XIAP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'XIAP is a cytosolic and nuclear inhibitor-of-apoptosis protein with three BIR domains and
  a C-terminal RING E3 ubiquitin-ligase domain. Its BIR2/linker and BIR3 elements directly inhibit active
  apoptotic caspases, while its RING domain ubiquitinates pathway-specific substrates in apoptosis, NOD1/NOD2
  innate immune signaling, Wnt/TLE transcriptional control, copper homeostasis, and interferon regulation.'
