core_functions:
- description: XIAP BIR2/linker and BIR3 regions bind and directly inhibit active apoptotic 
    caspases, restraining downstream executioner caspase activity in the cytosol.
  molecular_function:
    id: GO:0043027
    label: cysteine-type endopeptidase inhibitor activity involved in apoptotic process
  directly_involved_in:
  - id: GO:0043066
    label: negative regulation of apoptotic process
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0097179
    label: protease inhibitor complex
  supported_by:
  - reference_id: PMID:9230442
    supporting_text: Here we show that human X-chromosome-linked IAP directly inhibits at least two 
      members of the caspase family of cell-death proteases, caspase-3 and caspase-7.
  - reference_id: PMID:11257230
    supporting_text: Here we present the crystal structure of caspase-7 in complex with a potent 
      inhibitory fragment from XIAP
- description: XIAP RING E3 ligase activity ubiquitinates RIPK2 after NOD1/NOD2 activation, 
    producing K63-linked ubiquitin scaffolds that recruit downstream NF-kappaB and MAPK signaling 
    machinery.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0070431
    label: nucleotide-binding oligomerization domain containing 2 signaling pathway
  - id: GO:0070427
    label: nucleotide-binding oligomerization domain containing 1 signaling pathway
  - id: GO:0070534
    label: protein K63-linked ubiquitination
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:22607974
    supporting_text: We find that XIAP ubiquitylates RIPK2 and recruits the linear ubiquitin chain 
      assembly complex (LUBAC) to NOD2.
  - reference_id: PMID:29452636
    supporting_text: we identify NOD2 signaling and XIAP-dependent ubiquitination sites on RIP2 and 
      show that mutating these lysine residues adversely affects NOD2 pathway signaling.
  - reference_id: PMID:30026309
    supporting_text: RIPK2 inhibitors function instead by antagonizing XIAP-binding and 
      XIAP-mediated ubiquitination of RIPK2.
- description: Nuclear XIAP uses the same RING E3 activity to monoubiquitylate Groucho/TLE 
    corepressors, weakening their TCF/Lef association and promoting canonical Wnt transcriptional 
    activation.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0090263
    label: positive regulation of canonical Wnt signaling pathway
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:22304967
    supporting_text: Upon Wnt pathway activation, XIAP is recruited to TCF/Lef where it 
      monoubiquitylates Groucho (Gro)/TLE.
proposed_new_terms: []
suggested_questions:
- question: Which XIAP substrate-specific ubiquitination events are physiological enough for GO-CAM 
    modeling beyond RIPK2, TLE/Groucho, PTEN, CCS, IRF7-pathway components, and BCL2?
  experts: []
- question: Should SMAC/DIABLO, HTRA2/3/4, and ARTS antagonism of XIAP be represented only on the 
    antagonist gene products, or does GO need a complex term that cleanly captures XIAP 
    neutralization without adding generic XIAP protein-binding rows?
  experts: []
suggested_experiments:
- hypothesis: XIAP substrate choice is determined by separable BIR and RING surfaces rather than by 
    a single generic E3-ligase state.
  description: Use endogenous XIAP rescue alleles that selectively disrupt BIR2-RIPK2, 
    BIR3-SMAC/ARTS, and RING/E2 interfaces, then quantify RIPK2 K63 ubiquitination, TLE 
    monoubiquitylation, caspase-3/7/9 activity, and substrate turnover in NOD2-stimulated, 
    Wnt-stimulated, and apoptotic human cells.
