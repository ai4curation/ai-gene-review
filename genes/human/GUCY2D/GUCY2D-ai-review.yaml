id: Q02846
gene_symbol: GUCY2D
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GUCY2D encodes retinal guanylyl cyclase 1, a membrane enzyme that converts GTP to cGMP in
  photoreceptors. Calcium-sensitive GCAP regulation supports cGMP replenishment during recovery from light
  stimulation. Pathogenic variants cause inherited retinal dystrophies.
