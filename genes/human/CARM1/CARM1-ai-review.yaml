- term:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9WVG6
  review:
    summary: CARM1 is promoter-recruited but is not a sequence-specific cis-regulatory DNA-binding
      factor.
    action: REMOVE
    reason: 'The orthology transfer overstates CARM1 biology: CARM1 is recruited by DNA-binding nuclear
      receptors and transcription factors to methylate histone and coactivator substrates, rather than
      directly enabling transcription cis-regulatory region binding.'
    supported_by:
    - reference_id: file:human/CARM1/CARM1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: methylates histone H3 at 'Arg-17' (H3R17me), forming mainly asymmetric
        dimethylarginine (H3R17me2a), leading to activation of transcription via chromatin
        remodeling
