id: Q86X55
gene_symbol: CARM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CARM1 encodes PRMT4, a predominantly nuclear type-I protein arginine methyltransferase and
  transcriptional coactivator that asymmetrically methylates histone H3 at H3R17 during promoter activation
  and also uses non-histone activities, including PARP1-dependent replication-fork regulation, in chromatin
  and genome-stress responses.'
