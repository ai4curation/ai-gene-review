- term:
    id: GO:0008276
    label: protein methyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:19405910
  qualifier: enables
  review:
    summary: The generic methyltransferase activity should be replaced by protein-arginine
      methyltransferase terms.
    action: MODIFY
    reason: CARM1 is a type-I protein arginine methyltransferase; this broad methyltransferase row
      is true but should be captured with the more specific arginine monomethyltransferase or
      asymmetric dimethyltransferase activity supported for this enzyme.
    proposed_replacement_terms:
    - id: GO:0035242
      label: protein-arginine omega-N asymmetric methyltransferase activity
    supported_by: &id003
    - reference_id: file:human/CARM1/CARM1-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Methylates (mono- and asymmetric dimethylation) the guanidino nitrogens of
        arginyl residues in several proteins involved in DNA packaging, transcription regulation,
        pre-mRNA splicing, and mRNA stability
