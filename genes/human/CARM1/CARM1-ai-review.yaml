    label: chromatin remodeling
  - id: GO:0006355
    label: regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005694
    label: chromosome
  supported_by: *id001
suggested_questions:
- question: Which disease- and stress-response phenotypes require CARM1 methyltransferase activity
    and which instead use its methyltransferase-independent PARP1/replication-fork branch?
suggested_experiments:
- description: Pair catalytically dead and PARP1-binding CARM1 rescue alleles with H3R17me2a
    profiling and replication-fork fiber assays to separate methyltransferase-dependent
    transcription from fork regulation.
