core_functions:
- description: CARM1 acts in the nucleus as a type-I histone H3R17 arginine methyltransferase and
    transcriptional coactivator, coupling recruitment by DNA-bound transcription factors to
    asymmetric H3 arginine methylation and chromatin remodeling at active promoters.
  molecular_function:
    id: GO:0035642
    label: histone H3R17 methyltransferase activity
  directly_involved_in:
