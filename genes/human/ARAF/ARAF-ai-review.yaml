  review:
    summary: IBA for MAPK cascade from PAINT node PTN001147804 (RAF family), seeded by experimentally annotated
      RAF-family members including human BRAF and RAF orthologs from rodents, fly and worm. ARAF is a bona fide
      member of this clade and acts at the MAP3K tier of the RAS-RAF-MEK-ERK cascade.
    action: ACCEPT
    reason: ARAF sits inside the RAF clade that carries the MAP3K/MAPK-cascade function; there is no evidence of
      loss of function in ARAF (it is the weakest but still catalytically competent RAF paralog). Core process.
