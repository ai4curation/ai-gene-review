core_functions:
- description: 'RAS-activated MAP kinase kinase kinase of the ERK1/2 cascade: at the plasma membrane ARAF, within
    RAF homo/heterodimers, phosphorylates and activates MEK1/MEK2 (MAP2K1/MAP2K2).'
  molecular_function:
    id: GO:0004709
    label: MAP kinase kinase kinase activity
  directly_involved_in:
  - id: GO:0000165
    label: MAPK cascade
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:human/ARAF/ARAF-deep-research-falcon.md
    supporting_text: Wild-type ARAF immunoprecipitates generated phosphorylated MEK1
  - reference_id: PMID:11909642
    supporting_text: A-Raf was identified as a novel partner that interacts with MEK2
  - reference_id: file:human/ARAF/ARAF-uniprot.txt
    supporting_text: Involved in the transduction of mitogenic signals from the cell membrane to the nucleus.
- description: Side-to-side kinase-domain heterodimerization with BRAF (and CRAF), required for ARAF activation
    and for its contribution to RAS-driven MEK-ERK output.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  directly_involved_in:
  - id: GO:0000165
    label: MAPK cascade
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: file:human/ARAF/ARAF-deep-research-falcon.md
    supporting_text: ARAF can form homodimers and heterodimers with BRAF or CRAF.
  - reference_id: PMID:20130576
    supporting_text: Inhibitor binding activates wild-type RAF isoforms by inducing dimerization, membrane localization
      and interaction with RAS-GTP.
proposed_new_terms: []
suggested_questions:
- question: Should the kinase-independent, anti-apoptotic sequestration of MST2/STK3 at mitochondria be captured
    with a specific MF (e.g. a protein kinase inhibitor/sequestering activity) once ARAF-specific primary evidence
    is curated?
- question: Are BAD, PFKFB2 and SMAD2 physiologically relevant direct ARAF substrates in vivo, or are they in vitro
    or paralog-shared RAF activities that should remain non-core?
- question: How much of ARAF-dependent ERK signalling is catalytic (as MEK kinase) versus allosteric (as a dimer
    partner that transactivates BRAF/CRAF)?
suggested_experiments:
- description: Compare purified full-length ARAF, BRAF and CRAF (as 14-3-3-bound dimers) in MEK1/MEK2 kinase assays,
    with kinase-dead and dimer-interface (R362H) ARAF mutants, to separate catalytic from allosteric contributions.
- description: Use ARAF-only (BRAF/CRAF-null) isogenic cells with kinase-dead or mitochondria-excluded ARAF to test
    which cellular phenotypes (ERK output, MST2-dependent apoptosis) depend on catalysis versus localization.
