id: P10398
gene_symbol: ARAF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: A-Raf (ARAF) is one of the three RAF-family serine/threonine protein kinases (with BRAF and RAF1/CRAF)
  that act as MAP kinase kinase kinases in the RAS-RAF-MEK-ERK (MAPK/ERK) cascade. It has an N-terminal RAS-binding
  domain and cysteine-rich C1-like domain (CR1), a Ser/Thr-rich regulatory region carrying the inhibitory 14-3-3
  site Ser-214 (CR2), and a C-terminal protein kinase domain (CR3). In resting cells ARAF is held in an autoinhibited
  cytosolic complex with 14-3-3 proteins and the HSP90/CDC37 chaperone; RAS-GTP recruits it to the plasma membrane,
  where Ser-214 dephosphorylation (by PP2A or the SHOC2-MRAS-PP1C complex) and side-to-side homo- or heterodimerization
  with BRAF or CRAF activate it to phosphorylate the activation loops of MEK1/MEK2 (MAP2K1/MAP2K2). ARAF is the
  least catalytically active RAF paralog, but it sustains RAS-driven ERK signalling in some contexts and can confer
  resistance to BRAF/CRAF-selective inhibitors. A fraction of ARAF localises to mitochondria, where it restrains
  apoptosis largely independently of its kinase activity, notably by sequestering the pro-apoptotic kinase MST2.
  Activating somatic ARAF mutations occur in lung adenocarcinoma, Langerhans cell histiocytosis and central conducting
  lymphatic anomaly. A short splice isoform (DA-Raf1) lacking the kinase domain acts as a dominant-negative RAS
  antagonist.
