suggested_questions:
- question: Which ATP6AP2 interactions perform a defined V0 assembly step, and which reflect retention
    of ATP6AP2 in the assembled pump? Can human reconstitution distinguish these roles?
- question: Which receptor and V-ATPase functions require full-length ATP6AP2, the cleaved membrane fragment,
    or a specific splice isoform?
- question: How do renin-associated catalytic-efficiency changes and ERK signaling depend on separate
    ATP6AP2 interfaces?
suggested_experiments:
- hypothesis: ATP6AP2 supports V-ATPase biogenesis through interactions distinct from its mature complex
    and receptor roles.
  description: Compare full-length, cleavage-defective, ER-retrieval and interaction-site variants in
    ATP6AP2-deficient human cells. Measure V0 assembly intermediates, V1 recruitment, ATP hydrolysis and
    calibrated proton transport separately, controlling for protein abundance and localization.
  experiment_type: rescue and biochemical reconstitution
- hypothesis: ATP6AP2-dependent renin catalytic-efficiency enhancement and ERK signaling can be separated
    mechanistically.
  description: Measure renin binding, angiotensinogen Km and kcat, and ERK phosphorylation side by side
    for receptor variants with matched surface abundance. Include receptor-negative controls and blockade
    of angiotensin II signaling.
  experiment_type: receptor structure-function analysis
