gene_symbol: ATP6AP2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP6AP2 is a single-pass membrane protein that acts as a V-ATPase accessory component and
  as the renin/prorenin receptor. Its endomembrane-associated forms support V-ATPase assembly and endolysosomal
  acidification, which sustain lysosomal degradation and cellular homeostasis. At the cell surface, ATP6AP2
  binds renin and prorenin; receptor association enhances renin catalytic efficiency and can activate
  ERK signaling independently of angiotensin II. ATP6AP2 also connects V-ATPase-dependent acidification
  to Wnt signaling. Proteolytic processing produces luminal or extracellular and membrane-associated fragments
  with distinct localization and interaction properties.
