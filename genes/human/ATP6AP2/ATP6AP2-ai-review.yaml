- id: PMID:29127204
  title: Mutations in the X-linked ATP6AP2 cause a glycosylation disorder with autophagic defects.
  findings:
  - statement: Human disease variants, mouse liver defects, fly phenotypes and human-cell partner interactions
      jointly support ATP6AP2 involvement in V-ATPase biogenesis; these are distinct experimental contexts.
    supporting_text: Our results suggest that ATP6AP2 has a crucial role in V-ATPase assembly, both in
      invertebrates and vertebrates.
    reference_section_type: INTRODUCTION
  - statement: ATP6AP2 interacts with V0 assembly factors including ATP6AP1 and VMA21.
    supporting_text: Together, these results suggest that ATP6AP2 forms a complex with other V-ATPase
      assembly factors
    reference_section_type: RESULTS
  - statement: Fly ATP6AP2L98S mutant fat-body clones show reduced acidotropic staining, providing model-specific
      evidence of impaired organelle acidification.
    supporting_text: ATP6AP2L98S mutant clones showed a reduction in Lysotracker-positive organelles compared
      with the WT surrounding tissue, indicating reduced acidity
    reference_section_type: RESULTS
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Complete cached abstract and targeted human localization/partner Results, Fig. 8 legend
      and construct/IP Methods were inspected. HEK293T co-IP includes endogenous ATP6AP1 association.
      Fly fat-body acidification/autophagy and mouse liver findings are separate models. No whole-paper
      or figure-pixel claim.
