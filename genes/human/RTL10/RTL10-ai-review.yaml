    supporting_text: >-
      used its BH3 domain to contact pro-survival Bcl-2 family members (Bcl-2, Bcl-X(L), Mcl-1, A1
      and Bcl-w)
  - reference_id: PMID:23055042
    supporting_text: >-
      purified Bop protein induced the loss of mitochondrial transmembrane potential (Δψm) and the
      release of cytochrome c
  knowledge_gaps:
  - gap_statement: >-
      The physiological contexts in which RTL10/Bop drives apoptosis, and the consequences of its
      absence (no mouse ortholog exists for loss-of-function study), are undetermined.
    gap_kind:
    - BIOLOGY
proposed_new_terms: []
suggested_questions:
- question: >-
    In which cell types and stimuli is RTL10/Bop a physiologically important BH3-only apoptosis
    effector, and is it transcriptionally or post-translationally regulated like canonical BH3-only
    proteins?
suggested_experiments:
- hypothesis: >-
    RTL10/Bop drives intrinsic apoptosis through BH3-dependent engagement of VDAC1 and Bcl-2 family
    proteins.
  description: >-
    Test BH3 point mutants (L118A, D123A) for loss of pro-apoptotic activity, Bcl-2-family binding
    and VDAC1 engagement, and measure MOMP (Δψm, cytochrome c) in cells with RTL10 gain- and
    loss-of-function.
