- term:
    id: GO:2001244
    label: positive regulation of intrinsic apoptotic signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:23055042
  qualifier: involved_in
  review:
    summary: >-
      Bop induces apoptosis in a BH3-domain-dependent manner (Leu118 and Asp123 required), is
      inhibited by pro-survival Bcl-2 proteins, and is partially required for vincristine-induced
      death, acting through the intrinsic pathway.
    action: NEW
    reason: >-
      Bop is itself a BH3-only pro-apoptotic effector that drives the intrinsic apoptotic pathway
      (it causes MOMP and cytochrome c release and is sequestered by pro-survival members), so it
      participates directly in positively regulating intrinsic apoptotic signalling. Well supported
      and not in current GOA.
    supported_by:
    - reference_id: PMID:23055042
      supporting_text: >-
        we demonstrated a novel human BH3-only protein (designated as Bop) which could induce
        apoptosis in a BH3 domain-dependent manner
    - reference_id: PMID:23055042
      supporting_text: Bop was partially required for VCR induced cell death
