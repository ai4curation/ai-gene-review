gene_symbol: RTL10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RTL10 (Protein Bop; also BOP, C22orf29) is a eutherian gene (22q11.21) domesticated from a
  Ty3/gypsy sushi-ichi-related LTR retrotransposon and built on a retroviral Gag capsid-like
  scaffold. Uniquely among the RTL/SIRH family it carries a functional BH3 motif (residues
  114-128, with essential Leu118 and Asp123) and behaves as a pro-apoptotic BH3-only member of
  the Bcl-2 protein family. The 364-residue protein localizes mainly to mitochondria and uses
  its BH3 helix to engage the voltage-dependent anion channel VDAC1 at the outer mitochondrial
  membrane and to bind pro-survival Bcl-2 family members (BCL2, BCL-XL, MCL1, BCL2A1, BCL2L2),
  which sequester it; it also engages the effectors BAX and BAK. Purified Bop induces loss of
  mitochondrial transmembrane potential and release of cytochrome c, and it is partially
  required for vincristine-induced apoptosis, acting through the intrinsic (mitochondrial)
  apoptotic pathway. RTL10 has no mouse ortholog, and its protein-coding capacity is retained
  only in a subset of mammalian lineages.
