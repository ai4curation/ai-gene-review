core_functions:
- description: >-
    Mitochondrial BH3-only pro-apoptotic effector: through its BH3 helix RTL10/Bop heterodimerizes
    with pro-survival and effector Bcl-2 family proteins and engages VDAC1 at the outer mitochondrial
    membrane, driving mitochondrial outer membrane permeabilization (loss of membrane potential and
    cytochrome c release) and positively regulating the intrinsic apoptotic pathway.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
