id: Q9HB96
gene_symbol: FANCE
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FANCE is a nuclear substrate-recognition subunit of the Fanconi anaemia core complex. Its
  C-terminal region binds FANCD2, while its association with FANCC and other core components couples substrate
  recruitment to FANCL/UBE2T-mediated monoubiquitination of FANCI–FANCD2 during DNA interstrand cross-link
  repair. Human recognition-defective FANCE mutants retain the core associations that were tested but
  fail to support productive FANCD2 monoubiquitination and cross-link resistance. FANCE also promotes
  nuclear accumulation of FANCC, although transport and retention have not been distinguished. Nuclear
  foci and nucleoplasmic localization are experimentally supported; a separate cytosolic pool is represented
  in a PKR-associated assembly. Pathogenic biallelic FANCE variants cause Fanconi anemia complementation
  group E.
