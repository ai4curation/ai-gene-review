core_functions:
- description: Recruits FANCD2 to the nuclear Fanconi anaemia core complex through substrate recognition,
    enabling FANCL/UBE2T-mediated FANCI–FANCD2 monoubiquitination during interstrand cross-link repair.
    Human FANCE C-terminal recognition mutants lose productive FANCD2 recruitment while retaining the
    tested core associations; this separates recruitment from those measured assembly contacts without
    proving that every aspect of the remaining complex is catalytically intact. FANCE supplies substrate
    recognition, not ubiquitin-transfer chemistry.
  supported_by:
  - reference_id: PMID:12093742
    supporting_text: provides a critical bridge between the FA complex and FANCD2
  - reference_id: PMID:12093742
    supporting_text: FANCE protein is part of this nuclear complex, binding both FANCC and FANCD2
  - reference_id: PMID:12649160
    supporting_text: A central region of FANCE was sufficient for FANCC binding
  - reference_id: PMID:24451376
    supporting_text: the Phe-522 within the region is a critical residue for the ability of FANCE to recruit
      FANCD2 to the FA core complex and to induce the subsequent monoubiquitination reaction
  - reference_id: PMID:12239156
    supporting_text: FANCE is a component of the nuclear FA complex in vivo and is required for the monoubiquitination
      of FANCD2
  molecular_function:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  directly_involved_in:
  - id: GO:0036297
    label: interstrand cross-link repair
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0043240
    label: Fanconi anaemia nuclear complex
suggested_questions:
- question: How does human FANCE position FANCD2 within the assembled core, and which recognition-defective
    substitutions affect substrate binding alone rather than the conformation or catalytic competence
    of the surrounding complex?
- question: Does FANCE promote FANCC nuclear accumulation through import, retention or both, and which
    endogenous FANCE assemblies are recruited to damaged chromatin?
suggested_experiments:
- description: Reconstitute the human core with wild-type FANCE, C-terminal truncations and Phe522 substitutions.
    Measure complex composition, folding, FANCD2 affinity and FANCL/UBE2T-dependent FANCI–FANCD2 monoubiquitination
    together, using matched protein amounts and catalytic-subunit controls to distinguish substrate recognition
    from indirect assembly or activity defects.
- description: Combine endogenous FANCE and FANCC tagging with live nuclear-import and retention measurements,
    validated chromatin fractionation and damage-dependent imaging. Include untagged-antibody controls
    and matched rescue expression to distinguish nuclear accumulation from a specific transport mechanism
    or chromatin-localization claim.
