  - ensembl:ENSRNOP00000016485
  review:
    summary: Ensembl Compara transfer of angiogenesis from rat Fgf10.
    action: MARK_AS_OVER_ANNOTATED
    reason: FGF10 acts through the epithelial IIIb receptor isoforms and is not an endothelial mitogen
      or established angiogenic factor; any vascular effects in rodent tissue are likely indirect consequences
      of epithelial-mesenchymal signalling. Not supported by human data.
    supported_by:
