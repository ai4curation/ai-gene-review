- term:
    id: GO:0005104
    label: fibroblast growth factor receptor binding
  evidence_type: IDA
  original_reference_id: PMID:11923311
  qualifier: enables
  review:
    summary: Recombinant human FGF10 triggers heparin-dependent tyrosine phosphorylation of urothelial
      cell-surface receptors and is mitogenic for urothelial cells, consistent with FGF receptor binding.
    action: ACCEPT
    reason: FGF receptor binding is the core molecular activity of FGF10 as a secreted ligand. The more
      specific child GO:0005111 (type 2 FGF receptor binding, i.e. FGFR2) is separately supported by IBA
      and by the FGF10-FGFR2b crystal structure; FGF10 also activates FGFR1b, so the general parent term
      remains correct and is the level used for canonical paracrine FGF ligands.
    supported_by:
    - reference_id: PMID:11923311
      supporting_text: a signaling cascade that begins with the heparin-dependent phosphorylation of tyrosine
        residues of surface transmembrane receptors
    - reference_id: PMID:11923311
      supporting_text: Recombinant (r) preparations of human FGF-10 were found to induce proliferation
        of human urothelial cells in vitro
    - reference_id: file:human/FGF10/FGF10-uniprot.txt
      supporting_text: Interacts with FGFR1 and FGFR2. Interacts with FGFBP1.
- term:
    id: GO:0005111
    label: type 2 fibroblast growth factor receptor binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002608294
  - UniProtKB:O15520
  review:
    summary: FGF10, like FGF7, is a selective ligand of the epithelial IIIb isoform of FGFR2; the PAINT
      node for the FGF7/FGF10 clade places type 2 FGF receptor binding at the correct specificity.
    action: ACCEPT
    reason: Phylogenetically placed and directly supported for FGF10 by the FGF10-FGFR2b co-crystal structure
      and mutagenesis. The target appearing in its own WITH/FROM reflects its own experimental grounding.
    supported_by:
    - reference_id: PMID:12591959
      supporting_text: FGF7 and FGF10 activate only the b isoform of FGFR2 (FGFR2b).
    - reference_id: PMID:12591959
      supporting_text: Structure-based mutagenesis of FGF10 confirms the importance of the observed contacts
        for FGF10 biological activity.
    - reference_id: file:human/FGF10/FGF10-uniprot.txt
      supporting_text: Interacts with FGFR1 and FGFR2. Interacts with FGFBP1.
    - reference_id: file:human/FGF10/FGF10-deep-research-falcon.md
      supporting_text: FGF10 signals predominantly through FGFR2b, the epithelial IgIIIb splice isoform
        of fibroblast growth factor receptor 2
