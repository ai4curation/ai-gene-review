- description: Secreted, mesenchyme-derived FGF10 binds selectively to the epithelial IIIb isoform of
    FGFR2 (and FGFR1b) in heparan-sulfate-stabilized complexes, activating receptor tyrosine kinase signalling
    including the RAS-ERK cascade in adjacent epithelium.
  molecular_function:
    id: GO:0005111
    label: type 2 fibroblast growth factor receptor binding
  directly_involved_in:
  - id: GO:0008543
    label: fibroblast growth factor receptor signaling pathway
  - id: GO:0043410
    label: positive regulation of MAPK cascade
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0009986
    label: cell surface
  supported_by:
  - reference_id: PMID:12591959
    supporting_text: FGF7 and FGF10 activate only the b isoform of FGFR2 (FGFR2b).
  - reference_id: PMID:12591959
    supporting_text: Structure-based mutagenesis of FGF10 confirms the importance of the observed contacts
      for FGF10 biological activity.
  - reference_id: PMID:11923311
    supporting_text: a signaling cascade that begins with the heparin-dependent phosphorylation of tyrosine
      residues of surface transmembrane receptors
  - reference_id: file:human/FGF10/FGF10-uniprot.txt
