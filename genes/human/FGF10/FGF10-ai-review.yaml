suggested_questions:
- question: Should FGF10 also carry type 1 FGF receptor binding (GO:0005105), given mitogenesis-based
    evidence that it activates FGFR1b as well as FGFR2b, and how physiologically important is FGFR1b signalling
    for FGF10 in vivo?
- question: Is nuclear accumulation of internalized FGF10 (reported for recombinant protein in urothelial
    cells) physiologically relevant, and does it occur with endogenous FGF10 at physiological concentrations?
- question: Was the lymphocyte proliferation annotation from PMID:19152659 based on BaF3 FGFR2IIIb reporter
    cells, in which case it reflects the assay cell line rather than an FGF10 function?
- question: Should the FGF-family PAINT node for cytoplasm (PTN000160075) be restricted so it does not
    propagate to classically secreted, signal-peptide-bearing FGFs such as FGF7 and FGF10?
suggested_experiments:
- description: Quantify FGF10 binding and signalling (pFRS2, pERK) across FGFR1-4 IIIb/IIIc isoforms with
    defined heparan sulfate and dermatan sulfate oligosaccharides and FGFBP1 in isogenic cells.
  experiment_type: biochemistry/quantitative signaling
  hypothesis: FGF10 signalling is restricted to FGFR2b and FGFR1b and is tuned by glycosaminoglycan structure
    and FGFBP1.
- description: Knock out FGF10 in human fetal lung or salivary mesenchyme co-cultured with epithelial
    organoids, and test rescue with wild-type versus ALSG/LADD missense FGF10 proteins.
  experiment_type: genome editing/organoid co-culture
  hypothesis: Mesenchymal FGF10 dosage is limiting for human epithelial bud outgrowth, and ALSG missense
    variants are loss-of-function.
