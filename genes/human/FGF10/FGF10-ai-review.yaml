    label: tear secretion
  evidence_type: IMP
  original_reference_id: PMID:19102732
  qualifier: involved_in
  review:
    summary: ALSG patients with FGF10 mutations have lacrimal aplasia and irritable eyes.
    action: MARK_AS_OVER_ANNOTATED
    reason: Tear-production defects are a secondary consequence of lacrimal gland/punctum aplasia; FGF10
      does not execute tear secretion. The primary role is captured by lacrimal gland development.
    supported_by:
