      supporting_text: FGF7 and FGF10 activate only the b isoform of FGFR2 (FGFR2b).
- term:
    id: GO:0001656
    label: metanephros development
  evidence_type: IEP
  original_reference_id: PMID:18437684
  qualifier: involved_in
  review:
    summary: Immunohistochemical detection of FGF10 in all metanephric structures of 5-9 week human embryos.
    action: KEEP_AS_NON_CORE
    reason: Expression-pattern evidence only, but consistent with FGF10 as a mesenchymal signal in kidney
      development (renal anomalies are reported in LADD syndrome). A developmental, non-core role.
    supported_by:
