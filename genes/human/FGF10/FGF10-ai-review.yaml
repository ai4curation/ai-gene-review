  original_reference_id: PMID:17959718
  qualifier: involved_in
  review:
    summary: FGF10 release by heparanase increases MAPK signalling in submandibular gland epithelium.
    action: MODIFY
    reason: FGF10 is the extracellular ligand that activates the ERK1/2 cascade through FGFR2b; it does
      not participate in the kinase cascade itself. Positive regulation of ERK1 and ERK2 cascade (GO:0070374)
      is the appropriate representation.
