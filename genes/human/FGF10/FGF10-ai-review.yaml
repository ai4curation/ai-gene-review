id: O15520
gene_symbol: FGF10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGF10, also called keratinocyte growth factor 2 (KGF-2), is a secreted, heparin-binding member
  of the fibroblast growth factor family (FGF7 subfamily with FGF3, FGF7 and FGF22). It is made as a precursor
  with a cleaved N-terminal signal peptide and is produced mainly by mesenchymal and stromal fibroblasts,
  from which it acts in a paracrine manner on adjacent epithelium. FGF10 binds selectively to the epithelial
  IIIb splice isoforms of FGF receptors, principally FGFR2b and also FGFR1b, in ternary complexes stabilized
  by heparan sulfate proteoglycans, which also retain it in the pericellular matrix and basement membrane.
  Receptor activation drives FRS2-GRB2-SOS-RAS-ERK, PI3K-AKT and PLC-gamma signalling in target epithelial
  cells. FGF10 is the key mesenchymal signal that induces and directs epithelial bud outgrowth and branching
  morphogenesis, acting as a mitogen and chemoattractant for distal lung epithelium and being required
  for development of the lungs, limbs, salivary and lacrimal glands and other branched epithelial organs.
  It also stimulates proliferation and migration of keratinocytes, urothelium and other epithelia during
  repair. Heterozygous loss-of-function variants cause aplasia of lacrimal and salivary glands (ALSG)
  and lacrimo-auriculo-dento-digital syndrome (LADD3). Recombinant FGF10 has been reported to accumulate
  in urothelial cell nuclei after uptake, but its physiological action is extracellular.
