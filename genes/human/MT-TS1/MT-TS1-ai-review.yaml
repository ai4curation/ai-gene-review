id: URS000025B782_9606
gene_symbol: MT-TS1
product_type: TRNA
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MT-TS1 encodes mitochondrial tRNA-Ser(UCN), one of the 22 transfer RNAs encoded by mitochondrial
  DNA. After excision from the polycistronic mtDNA transcript and post-transcriptional maturation, it
  is charged with serine by the corresponding mitochondrial aminoacyl-tRNA synthetase and, in the mitochondrial
  matrix, acts as the adaptor that reads the serine codons UCN (UCU, UCC, UCA and UCG) of the 13 mtDNA-encoded
  mRNAs on the mitoribosome, delivering serine to the growing polypeptide. It is one of two mitochondrial
  serine isoacceptors (the other, encoded by MT-TS2, reads AGY codons) and has a non-canonical cloverleaf
  with an extended anticodon stem; both serine tRNAs are charged by the single mitochondrial seryl-tRNA
  synthetase SARS2. Pathogenic variants in MT-TS1, like those in other mt-tRNA genes, impair mitochondrial
  translation and oxidative phosphorylation and cause maternally inherited mitochondrial disease.
