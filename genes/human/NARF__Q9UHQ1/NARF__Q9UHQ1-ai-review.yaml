id: Q9UHQ1
gene_symbol: NARF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  NARF (nuclear prelamin A recognition factor, also called IOP2, iron-only hydrogenase-like
  protein 2) is a 456-residue nuclear protein of the NARF/Nar1 family. Its sequence carries an
  N-terminal cysteine-rich region, a domain related to the C-terminal part of the large subunit
  of iron-only (FeFe) hydrogenases (Pfam PF02906), and a domain related to the hydrogenase small
  subunit (PF02256). NARF was identified in a yeast two-hybrid screen as a protein that binds the
  C-terminal tail of prelamin A, and this binding depends on farnesylation of the prelamin A CaaX
  cysteine. Endogenous NARF is in the nuclear fraction of HeLa cells and can be extracted from
  nuclear envelopes with salt. Tagged NARF is exclusively nuclear and partly co-localizes with
  the nuclear lamina. Under hypoxia, NARF is induced as a HIF-1 target gene in breast cancer
  cells. There it binds OCT4 at the NANOG, KLF4 and SOX2 genes and recruits the H3K27
  demethylase KDM6A, so it acts as a transcriptional coactivator for these pluripotency genes.
  No hydrogenase activity or bound iron-sulfur cluster has been shown for NARF. Unlike its
  paralog NARFL (IOP1), which works in cytosolic iron-sulfur protein assembly, NARF is not
  needed for cytosolic or mitochondrial aconitase activity. The mRNA is expressed in all tissues
  tested, most highly in skeletal muscle, heart and brain.
