existing_annotations:
- term:
    id: GO:0005521
    label: lamin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002614243
  - UniProtKB:Q9UHQ1
  review:
    summary: >-
      Phylogenetic propagation of lamin binding from the NARF clade node PTN002614243. Q9UHQ1 is
      the experimental donor, and the node spans vertebrate NARF orthologs (fish, frog, bird and
      mammal).
    action: ACCEPT
    reason: >-
      Q9UHQ1 sits in PANTHER subfamily PTHR11615:SF124 (NUCLEAR PRELAMIN A RECOGNITION FACTOR),
      and the PAINT node PTN002614243 covers vertebrate NARF orthologs, not NARFL/Nar1. The only
      donor is Q9UHQ1 itself, which has direct experimental support for prenyl-dependent prelamin
      A binding. A single, well-characterized donor is acceptable, and Q9UHQ1 appearing in its own
      WITH/FROM column marks that experimental grounding exists on the target. The curators
      propagated only lamin binding and lamin filament from this node, and no iron-sulfur or
      hydrogenase term, which is consistent with the lack of evidence for any catalytic function.
      This IBA agrees with the IPI row for the same term.
    supported_by:
    - reference_id: PMID:10514485
      supporting_text: Using the yeast two-hybrid assay, we isolated a novel human protein, Narf,
        that binds the carboxyl-terminal tail of prelamin A.
- term:
    id: GO:0005521
    label: lamin binding
  evidence_type: IPI
  original_reference_id: PMID:10514485
  qualifier: enables
  supporting_entities:
  - UniProtKB:P02545
  review:
    summary: >-
      NARF binds the farnesylated C-terminal tail of prelamin A (LMNA, P02545) in yeast two-hybrid
      and in vitro binding assays. This is the defining activity of the protein.
    action: ACCEPT
    reason: >-
      The founding study shows binding to the prelamin A tail in two assays. Binding depends on
      farnesylation: inhibiting farnesyltransferase, or mutating or deleting the CaaX motif,
      inhibits it. Lamin binding is the most specific GO term available; GO has no term for binding
      a farnesylated or precursor form of a lamin. The physiological consequence of the binding is
      still unknown, and nothing shows that NARF takes part in prelamin A processing itself.
    supported_by:
    - reference_id: PMID:10514485
      supporting_text: The farnesylation status of prelamin A determines its ability to
        bind to Narf.
    - reference_id: PMID:10514485
      supporting_text: Inhibition of farnesyltransferase and mutation or deletion of the
        CaaX motif from the prelamin A tail domain inhibits Narf binding in yeast
        two-hybrid and in vitro binding assays.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review:
    summary: >-
      Mapped from the UniProt subcellular location "Nucleus", which is backed by the founding
      experimental study.
    action: MODIFY
    reason: >-
      Nuclear localization is well supported, but the evidence places NARF more specifically in
      the nucleoplasm and partly at the nuclear lamina. Both more specific terms are already
      carried by this gene (nucleoplasm IDA, nuclear lamina TAS). Following the refinement rule,
      the general term is replaced by those descendants.
    proposed_replacement_terms:
    - id: GO:0005654
      label: nucleoplasm
    - id: GO:0005652
      label: nuclear lamina
    supported_by:
    - reference_id: PMID:10514485
      supporting_text: When a FLAG epitope-tagged Narf is expressed
        in HeLa cells, it is exclusively nuclear and partially co-localizes with the
        nuclear lamina.
- term:
    id: GO:0005638
    label: lamin filament
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN002614243
  - UniProtKB:Q9UHQ1
  review:
    summary: >-
      Phylogenetic propagation of lamin filament from the NARF clade node, with Q9UHQ1 as the only
      donor.
    action: KEEP_AS_NON_CORE
    reason: >-
      The node placement is sound (vertebrate NARF clade, PTHR11615:SF124). The claim itself is
      weaker than the term suggests. The donor evidence is partial co-localization with the
      nuclear lamina and salt extraction from nuclear envelopes, which shows a peripheral
      association with the lamina rather than residence within lamin filaments. Most NARF is
      nucleoplasmic. I keep the row, matching the IDA row for the same term, but do not treat it
      as the main location.
    supported_by:
    - reference_id: PMID:10514485
      supporting_text: The protein is detected in the
        nuclear fraction of HeLa cell lysates on Western blots and can be extracted from
        nuclear envelopes with 0.5 M NaCl.
