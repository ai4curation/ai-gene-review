core_functions:
- description: >-
    NARF binds the farnesylated C-terminal tail of prelamin A, the precursor of lamin A, at the
    nuclear lamina. Binding needs the farnesylated CaaX cysteine. What this binding achieves in
    the cell is unknown.
  molecular_function:
    id: GO:0005521
    label: lamin binding
  locations:
  - id: GO:0005652
    label: nuclear lamina
  supported_by:
  - reference_id: PMID:10514485
    supporting_text: The farnesylation status of prelamin A determines its ability to
      bind to Narf.
- description: >-
    In hypoxic breast cancer cells, NARF is a transcriptional coactivator. It binds OCT4 at the
    NANOG, KLF4 and SOX2 genes and recruits the H3K27 demethylase KDM6A, which removes the
    repressive H3K27me3 mark and allows these genes to be expressed. This has been shown in cancer
    cell lines by one laboratory.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:36490339
    supporting_text: NARF
      functions as an essential coactivator by recruiting the histone demethylase
      KDM6A to OCT4 bound to genes encoding the pluripotency factors NANOG, KLF4, and
      SOX2
suggested_questions:
- question: Does NARF bind an iron-sulfur cluster through its conserved cysteines, as the hydrogenase-like
    domains might suggest, and if so, does this matter for prelamin A binding or coactivator function?
- question: What does prenyl-dependent binding of NARF to prelamin A do? Does it affect prelamin A
    processing by ZMPSTE24, its retention at the lamina, or NARF's own localization?
- question: Does NARF act as an OCT4/KDM6A coactivator outside hypoxic cancer cells, for example in
    embryonic stem cells or in normal tissues?
suggested_experiments:
- description: Purify recombinant full-length NARF under anaerobic conditions and test for bound iron and
    acid-labile sulfide, with UV-visible and EPR spectroscopy, alongside NARFL as a positive control.
- description: Map the prelamin A and OCT4/KDM6A binding regions of NARF by deletion and cysteine mutants,
    and test whether loss of prelamin A binding changes NARF lamina association or coactivator activity.
- description: Test NARF knockout or knockdown in non-transformed cells (for example human embryonic stem
    cells under hypoxia) for KDM6A recruitment to OCT4 targets and for prelamin A accumulation.
