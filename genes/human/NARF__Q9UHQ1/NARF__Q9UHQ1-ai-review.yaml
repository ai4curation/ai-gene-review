    label: nucleoplasm
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: >-
      Human Protein Atlas immunofluorescence localizes NARF to the nucleoplasm. This agrees
      with the original study, where NARF is exclusively nuclear and only partly at the
      lamina, implying a nucleoplasmic pool. Chromatin immunoprecipitation places NARF at
      OCT4-bound sites in hypoxic breast cancer cells, consistent with a nucleoplasmic and
      chromatin-associated pool.
    action: ACCEPT
