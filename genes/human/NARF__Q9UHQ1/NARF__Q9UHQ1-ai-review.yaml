    action: KEEP_AS_NON_CORE
    reason: >-
      The curator had the full text, and the abstract does report partial co-localization with the
      lamina, so I do not overrule the row. The location is peripheral to the main nucleoplasmic
      distribution, and the term is more specific than the imaging resolves; nuclear lamina is the
      better-fitting term and is carried by the TAS row. Kept as non-core, consistent with the IBA
      row.
    supported_by:
