- id: PMID:10514485
  title: Prenylated prelamin A interacts with Narf, a novel nuclear protein.
  findings:
  - statement: NARF binds the farnesylated C-terminal tail of prelamin A; binding requires
      prelamin A farnesylation.
    supporting_text: The farnesylation status of prelamin A determines its ability to bind
      to Narf.
  - statement: NARF is nuclear, salt-extractable from nuclear envelopes and partly at the
      nuclear lamina.
    supporting_text: When a FLAG epitope-tagged Narf is expressed in HeLa cells, it is
      exclusively nuclear and partially co-localizes with the nuclear lamina.
  - statement: Similarity to iron-only hydrogenases is limited.
    supporting_text: Narf has limited homology to iron-only bacterial hydrogenases and
      eukaryotic proteins of unknown function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding characterization; abstract-only in cache. Source of the IPI, IDA
      and TAS annotations.
- id: PMID:36490339
  title: NARF is a hypoxia-induced coactivator for OCT4-mediated breast cancer stem cell
    specification.
  findings:
  - statement: NARF is a HIF-1 target that binds OCT4 and recruits KDM6A to OCT4-bound
      pluripotency genes in hypoxic breast cancer cells.
    supporting_text: NARF functions as an essential coactivator by recruiting the histone
      demethylase KDM6A to OCT4 bound to genes encoding the pluripotency factors NANOG,
      KLF4, and SOX2
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; co-IP of endogenous proteins and ChIP-qPCR establish the
      coactivator mechanism. Cell-line study.
- id: PMID:41655866
  title: Matrix stiffness-induced NARF promotes hepatocellular carcinoma progression by
    enhancing LEF1-mediated transcription.
  findings:
  - statement: NARF recruits EP300 to LEF1-binding sites in hepatocellular carcinoma cells.
    supporting_text: Mechanistically, NARF recruited acetyltransferase EP300 to enhance H3K27
      acetylation at lymphoid enhancer binding factor 1 (LEF1)-binding sites, thereby
      amplifying LEF1-dependent transcriptional activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Independent second report of coactivator function; abstract only in cache.
- id: PMID:18270200
  title: A role for IOP1 in mammalian cytosolic iron-sulfur protein biogenesis.
  findings:
  - statement: Knockdown of IOP2/NARF, unlike IOP1/NARFL, does not reduce cytosolic or
      mitochondrial aconitase activity.
    supporting_text: Knockdown of IOP2, in contrast, had no effect on either.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Defines the paralog boundary; argues against transferring cytosolic Fe-S
      assembly from NARFL or yeast Nar1 to NARF.
- id: PMID:31823109
  title: Nuclear prelamin a recognition factor and iron dysregulation in multiple sclerosis.
  findings:
  - statement: Increased NARF levels associate with iron deposition in MS brain; the abstract
      describes NARF as mitochondria-associated.
    supporting_text: NARF is a protein associated with the mitochondria which has also been
      linked to mitochondrial defects in multiple sclerosis.
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: Abstract only; correlative proteomics/histology. The mitochondrial
      association is not a localization assay and conflicts with the exclusively nuclear
      localization reported by direct experiment, so it is not used for annotation.
