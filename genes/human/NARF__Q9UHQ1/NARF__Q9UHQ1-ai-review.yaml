  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002614243
  - UniProtKB:Q9UHQ1
  review:
    summary: >-
      PAINT node PTN002614243 sits on the NARF subfamily (PANTHER PTHR11615:SF124) and
      carries lamin binding, propagating it to vertebrate NARF orthologs (mouse, rat,
      zebrafish, Xenopus and others). Human NARF is the experimental donor: it binds the
      farnesylated prelamin A tail in yeast two-hybrid and in vitro binding assays.
    action: ACCEPT
    reason: >-
      The target appears in its own WITH/FROM because its IPI annotation is the descendant
      evidence for the node, which is expected rather than circular. The IBA adds that the
      prelamin A binding is inherited across vertebrate NARF rather than specific to human.
      NARF is inside the clade, and there is no evidence of loss. The paralog subfamily
      (NARFL, SF322) is not under this node.
    supported_by:
    - reference_id: PMID:10514485
      supporting_text: Using the yeast two-hybrid assay, we isolated a novel human protein,
        Narf, that binds the carboxyl-terminal tail of prelamin A.
- term:
    id: GO:0005521
    label: lamin binding
  evidence_type: IPI
  original_reference_id: PMID:10514485
  qualifier: enables
  supporting_entities:
  - UniProtKB:P02545
  review:
    summary: >-
      Barton and Worman isolated NARF in a yeast two-hybrid screen with the prelamin A
      (LMNA, P02545) C-terminal tail and confirmed binding in vitro. Binding depends on
      farnesylation of the CaaX cysteine: farnesyltransferase inhibition or CaaX mutation
      or deletion abolishes it.
    action: ACCEPT
    reason: >-
      Direct binding to a lamin (the farnesylated precursor of lamin A) is the defining
      experimental activity of NARF and matches the GO definition of lamin binding. No more
      specific term for prenylated prelamin A binding exists. The binding has not been
      mapped to a region of NARF and its physiological role is unknown.
    supported_by:
    - reference_id: PMID:10514485
      supporting_text: Inhibition of farnesyltransferase and mutation or deletion of the CaaX
        motif from the prelamin A tail domain inhibits Narf binding in yeast two-hybrid and
        in vitro binding assays.
    - reference_id: file:human/NARF__Q9UHQ1/NARF__Q9UHQ1-uniprot.txt
      supporting_text: Interacts with LMNA and binds to the farnesylated C-terminal domain.
