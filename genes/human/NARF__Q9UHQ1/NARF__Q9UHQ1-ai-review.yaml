  label: Homo sapiens
description: >-
  NARF (nuclear prelamin A recognition factor, also called iron-only hydrogenase-like
  protein 2, IOP2) is a 456-residue nuclear protein of the Nar1/NARF family, which shares a
  fold with the large and small subunits of bacterial iron-only hydrogenases. It was found
  as a protein that binds the C-terminal tail of prelamin A, and this binding requires
  farnesylation of the prelamin A CaaX motif. NARF is exclusively nuclear, distributed in the
  nucleoplasm and partly associated with the nuclear lamina, from which it can be extracted
  with high salt. In human cancer cell lines NARF also acts as a transcriptional coactivator.
  In hypoxic breast cancer cells, where HIF-1 induces its expression, NARF binds OCT4 at the
  NANOG, SOX2 and KLF4 genes and recruits the H3K27 demethylase KDM6A. In hepatocellular
  carcinoma cells it recruits the acetyltransferase EP300 to LEF1-bound sites. No hydrogenase
  activity or iron-sulfur cluster has been demonstrated for NARF. Unlike its paralog
  NARFL/IOP1 (CIAO3), which belongs to a separate PANTHER subfamily and is part of the
  cytosolic iron-sulfur protein assembly pathway, NARF knockdown does not affect cytosolic
  aconitase activity. The prelamin A binding and lamina association are inherited across
  vertebrate NARF orthologs by phylogenetic inference; all experimental data come from human
  cells.
