- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IMP
  original_reference_id: PMID:36490339
  qualifier: enables
  review:
    summary: >-
      Proposed. In hypoxic human breast cancer cells NARF binds OCT4 at the NANOG, KLF4 and SOX2
      genes and recruits the H3K27 demethylase KDM6A, which is needed to activate these genes.
    action: NEW
    reason: >-
      NARF does part of the work here rather than only being required. ChIP shows NARF on the OCT4
      binding sites of the target genes, depending on OCT4. Co-immunoprecipitation shows NARF
      binding both OCT4 and KDM6A, and the OCT4-KDM6A interaction needs NARF. NARF knockdown lowers
      KDM6A recruitment, blocks the loss of H3K27me3 at these promoters, and lowers target gene
      expression. This matches the GO definition of a coactivator that bridges a DNA-binding
      transcription factor to a chromatin-modifying enzyme at a specific locus. The evidence comes
      from one laboratory and from cancer cell lines (mainly MDA-MB-231 and MCF-7). It is not
      known whether NARF acts this way in non-transformed cells. The PAINT node for NARF does not
      carry this term, but this paper (2022) is newer than the node's only donor annotation, so the
      absence is not evidence that curators decided against it. The finding is specific to human
      NARF and should not be transferred to NARFL or Nar1.
    supported_by:
    - reference_id: PMID:36490339
      supporting_text: NARF
        functions as an essential coactivator by recruiting the histone demethylase
        KDM6A to OCT4 bound to genes encoding the pluripotency factors NANOG, KLF4, and
        SOX2
    - reference_id: PMID:36490339
      supporting_text: However, the recruitment of NARF was decreased in OCT4 KD cells, indicating
        that NARF binding was OCT4 dependent (Fig. 6B).
    - reference_id: PMID:36490339
      supporting_text: IP assays further demonstrated that the interaction of KDM6A and OCT4 is NARF
        dependent (Fig. 8E)
    - reference_id: PMID:36490339
      supporting_text: hypoxia-induced KDM6A recruitment was decreased in NARF-KD cells (Fig. 8A)
