- description: >-
    Binds the farnesylated C-terminal tail of prelamin A in the nucleus, with a pool of the
    protein associated with the nuclear lamina. Experimentally established in human cells
    and inherited across vertebrate NARF orthologs by PAINT (PTN002614243, PANTHER
    PTHR11615:SF124). The physiological purpose of the interaction is unknown.
  molecular_function:
