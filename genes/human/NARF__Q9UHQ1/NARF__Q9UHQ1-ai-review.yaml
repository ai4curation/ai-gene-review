- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IDA
  original_reference_id: PMID:36490339
  review:
    summary: >-
      In hypoxic MDA-MB-231 breast cancer cells, endogenous NARF co-immunoprecipitates with
      OCT4, is recruited by OCT4 to its binding sites at NANOG, SOX2 and KLF4 (ChIP-qPCR,
      lost on OCT4 knockdown) and recruits KDM6A there, leading to H3K27me3 removal and
      target gene activation. A second laboratory reports that in hepatocellular carcinoma
      cells NARF recruits EP300 to LEF1-binding sites and amplifies LEF1-dependent
      transcription.
    action: NEW
    reason: >-
      Participation test: NARF itself does the coactivator work, binding a DNA-bound
      transcription factor (OCT4, LEF1) and bringing a chromatin-modifying enzyme (KDM6A,
      EP300) to its sites. It is not merely a required upstream factor or a target of the
      process. Two independent studies with ChIP and co-IP support the activity. It is not in
      GOA and is not on the PAINT node. Both studies use cancer cell lines, so this is an
      experimentally supported human function that has not been shown in normal cells or in
      another species, and it should not yet be propagated to orthologs.
    additional_reference_ids:
    - PMID:41655866
    supported_by:
    - reference_id: PMID:36490339
      supporting_text: NARF functions as an essential coactivator by recruiting the histone
        demethylase KDM6A to OCT4 bound to genes encoding the pluripotency factors NANOG,
        KLF4, and SOX2
    - reference_id: PMID:36490339
      supporting_text: IP of endogenous proteins also showed that OCT4 interacts with NARF in
        hypoxic cells
    - reference_id: PMID:41655866
      supporting_text: Mechanistically, NARF recruited acetyltransferase EP300 to enhance H3K27
        acetylation at lymphoid enhancer binding factor 1 (LEF1)-binding sites, thereby
        amplifying LEF1-dependent transcriptional activity.
- term:
    id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:36490339
  review:
    summary: >-
      NARF knockdown abolishes hypoxia-induced expression of NANOG, SOX2 and KLF4, and NARF
      is physically present at the OCT4-bound regulatory sites of those genes, where it
      recruits KDM6A.
    action: NEW
    reason: >-
      This is the process in which the coactivator activity acts, and NARF participates
      directly by being at the target loci and recruiting the demethylase; the knockdown is
      paired with ChIP and co-IP rather than standing alone. Downstream outcomes reported in
      the same studies (breast cancer stem cell specification, tumor initiation, EMT,
      metastasis) are phenotypes and are deliberately not annotated.
    supported_by:
    - reference_id: PMID:36490339
      supporting_text: NARF functions as an essential coactivator by recruiting the histone
        demethylase KDM6A to OCT4 bound to genes encoding the pluripotency factors NANOG,
        KLF4, and SOX2
