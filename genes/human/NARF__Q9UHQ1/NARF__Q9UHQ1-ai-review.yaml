suggested_questions:
- question: Does NARF retain the cysteine ligands of the hydrogenase-like H-cluster and
    accessory [4Fe-4S] sites, and does it bind an Fe-S cluster at all, given that its
    paralog NARFL is a cytosolic Fe-S assembly factor and NARF knockdown does not affect
    aconitase?
- question: What is the physiological role of NARF binding to farnesylated prelamin A, and
    does NARF accumulate with prelamin A in ZMPSTE24 deficiency or progeria cells?
- question: Is the coactivator function of NARF (OCT4/KDM6A, LEF1/EP300) also present in
    normal cells, and is it conserved in mouse Narf?
suggested_experiments:
- description: Purify recombinant NARF under anaerobic conditions and test for Fe-S cluster
    content by UV-visible and EPR spectroscopy, alongside NARFL as a positive control.
- description: Map the prelamin A, OCT4 and KDM6A binding regions of NARF by deletion
    mutagenesis and test whether they overlap the hydrogenase-like domains.
- description: Test Narf knockout or knockdown in mouse embryonic stem cells or primary cells
    for effects on OCT4 target gene expression and H3K27me3 at those loci.
