suggested_questions:
- question: Does GCDH contribute measurably to oxidation of fatty-acid-derived dicarboxylates under physiological
    conditions, and can that contribution be separated from amino-acid-derived glutaryl-CoA turnover and from upstream
    peroxisomal chain shortening?
- question: Which natural GCDH product or processed species supplies the nuclear pool observed in human glioma stem-like
    cells, and how broadly does that pool occur outside the tested tumor context?
- question: What structural or assembly defect explains the short natural product’s reported inactivity, and does
    it retain FAD or interact with the active long product under physiological expression conditions?
suggested_experiments:
- description: Use isotope-resolved flux measurements in matched GCDH-deficient and rescued cells to distinguish
    glutaryl-CoA oxidation from hexanoyl-CoA oxidation, while measuring relevant acyl-CoA pools and electron-transfer
    dependencies.
  experiment_type: Physiological substrate-flux discrimination
- description: Compare sequence-verified long and short natural products using glutaryl-CoA turnover, FAD occupancy,
    oligomeric-state and mitochondrial-import assays; distinguish intact precursors from explicitly mapped processed
    forms.
  experiment_type: Product-resolved enzymology and import
- description: Identify nuclear GCDH proteoforms in glioma stem-like and nonmalignant cells, and test their contribution
    to crotonyl-CoA availability separately from CBP-catalyzed transfer to histones.
  experiment_type: Compartment-specific proteoform and metabolic analysis
