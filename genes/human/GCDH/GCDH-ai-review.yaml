description: GCDH is a mitochondrial matrix flavoprotein that oxidatively decarboxylates glutaryl-CoA to crotonyl-CoA,
  coupling this reaction to electron-transfer flavoprotein reduction. This reaction connects the degradation of
  lysine, hydroxylysine and tryptophan to downstream carbon metabolism while directly producing a fatty-acyl-CoA.
  The active enzyme is a FAD-containing homotetramer. Human GCDH also turns over hexanoyl-CoA and glutaramyl-CoA
  in vitro without decarboxylating them. A nuclear pool in human glioma stem-like cells supports lysine-derived
  crotonyl-CoA availability and CBP-mediated histone crotonylation; the acyl-transfer step is performed by CBP.
  The displayed precursor contains 438 residues, and an alternatively spliced 428-residue short product is reported
  to be stable but inactive.
status: COMPLETE
alternative_products:
- id: Q92947-1
  name: Long
  sequence_note: Displayed 438-residue precursor. The mitochondrial transit region is recorded as residues 1–44;
    that coordinate is a curated prediction rather than a newly measured cleavage site.
  description: The long natural product provides the reference sequence for the catalytic enzyme. Mature-chain and
    delta44 recombinant reagents must be distinguished from the intact precursor and from the alternative short
    product.
- id: Q92947-2
  name: Short
  sequence_note: 428 residues. VSP_000145 replaces displayed residues 415–438 with VVQMCSLKRRWNSL; direct FASTA
    and coordinate reconstruction agree.
  description: The alternative C-terminal product is assigned inactivity in the current reviewed record. The original
    cloning abstract reports a stable but inactive alternatively spliced protein; a construct-level mapping beyond
    the curated alternative-sequence assignment has not been independently established.
