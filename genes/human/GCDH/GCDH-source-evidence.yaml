    header:
      stable_id: R-HSA-71046
      display_name: glutaryl-CoA + FAD => crotonyl-CoA + FADH2 + CO2
      species: Homo sapiens
      summary: Mitochondrial glutaryl-CoA dehydrogenase (GCDH) catalyzes the reaction of glutaryl-CoA and FAD to
        form crotonyl-CoA, FADH2, and CO2. The active enzyme is a tetramer of GCDH polypeptides lacking a 44-residue
        aminoterminal mitochondrial targeting sequence. Mutations in GCDH cause glutaric aciduria type 1 in vivo
        (Fu et al. 2004; Keyser et al. 2008).
  - path: reactome/R-HSA-71064.md
    bytes: 2466
    sha256: 9b21ce36b13d975e67af563eb257cedb75b80b16b6ac343a523f7bc7083c0d6d
    blob: 466ee94bd6f2f483e37b65a158fe470b034d7d96
    mode: '100644'
    header:
      stable_id: R-HSA-71064
      display_name: Lysine catabolism
      species: Homo sapiens
      summary: In humans, most catabolism of L-lysine normally proceeds via a sequence of seven reactions which
        feeds into the pathway for fatty acid catabolism. In the first two reactions, catalyzed by a single enzyme
        complex, lysine is combined with alpha-ketoglutarate to form saccharopine, which in turn is cleaved and
        oxidized to yield glutamate and alpha-ketoadipic semialdehyde. The latter molecule is further oxidized to
        alpha-ketoadipate. Alpha-ketoadipate is oxidatively decarboxylated by the alpha-ketoglutarate dehydrogenase
        complex (the same enzyme complex responsible for the conversion of alpha-ketoglutarate to succinyl-CoA in
        the citric acid cycle), yielding glutaryl-CoA. Glutaryl-CoA is converted to crotonyl-CoA, crotonyl-CoA is
        converted to beta-hydroxybutyryl-CoA, and beta-hydroxybutyryl-CoA is converted to acetoacetyl-CoA. The products
        of lysine catabolism are thus exclusively ketogenic; i.e., under starvation conditions they can be used
        for the synthesis of ketone bodies, beta-hydroxybutyrate and acetoacetate, but not for the net synthesis
        of glucose (Cox 2001; Goodman and Freeman 2001).
