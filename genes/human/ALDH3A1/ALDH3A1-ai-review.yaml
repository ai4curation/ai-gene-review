id: P30838
gene_symbol: ALDH3A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALDH3A1 encodes aldehyde dehydrogenase 3A1, a homodimeric cytosolic class 3 aldehyde dehydrogenase
  that oxidizes aldehydes to carboxylic acids using NAD+ or NADP+. It prefers medium- and long-chain saturated
  and unsaturated aliphatic aldehydes, including the lipid-peroxidation product 4-hydroxy-2-nonenal, and
  aromatic aldehydes such as benzaldehyde, and is a poor enzyme for short-chain aldehydes. ALDH3A1 is
  very abundant in the stomach, the upper airways and above all the corneal epithelium, where it is a
  corneal crystallin. There it protects against UV-induced damage both by detoxifying peroxidic aldehydes
  and by directly absorbing UV light. It is also found in nasal mucus and tears, where it oxidizes aldehyde
  odorants, and it inactivates oxazaphosphorine anticancer drugs, contributing to chemoresistance. Expressed
  in yeast, human ALDH3A1 can substitute for the Hfd1 4-hydroxybenzaldehyde dehydrogenase in coenzyme
  Q precursor synthesis, although a role in human CoQ biosynthesis has not been shown.
