gene_symbol: SLC7A9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC7A9 (b0,+AT1, also BAT1) is the catalytic light-chain subunit of a heteromeric
  amino acid transporter of the SLC7/APC superfamily. It is disulfide-linked
  (b0,+AT Cys144 to rBAT Cys114) to the heavy-chain glycoprotein SLC3A1 (rBAT) to form
  the b0,+AT-rBAT complex; the single heterodimer is the minimal functional unit and
  assembles into a heterotetramer (dimer of heterodimers) through rBAT, which also
  traffics and stabilizes the complex at the cell surface. b0,+AT provides the
  transport activity: it is a Na+-independent, electrogenic, obligatory antiporter
  (system b0,+) that imports extracellular L-cystine and cationic (dibasic) amino acids
  (arginine, lysine, ornithine) in 1:1 exchange for intracellular neutral amino acids,
  with high affinity for the extracellular substrates and lower affinity for the
  intracellular neutral amino acids. It resides in the apical/brush-border plasma
  membrane of epithelial cells of the renal proximal tubule and small intestine, where
  it mediates reabsorption of cystine and dibasic amino acids. Loss of function causes
  cystinuria (non-type I), in which defective cystine reabsorption and the low
  solubility of cystine lead to urinary-tract calculi.
