proposed_new_terms: []
suggested_questions:
- question: >-
    What is the full physiological substrate scope and directionality of b0,+AT in vivo
    for less-studied substrates (e.g. ornithine, homocystine), and how does intracellular
    cystine reduction set the driving force under physiological conditions?
suggested_experiments:
- description: >-
    Reconstitute wild-type and cystinuria-variant b0,+AT-rBAT complexes into proteoliposomes
    and measure directional exchange kinetics for cystine, arginine, lysine, ornithine and
    neutral amino acids to quantify substrate-specific contributions and the effect of each
    class of disease mutation on transport versus assembly/trafficking.
