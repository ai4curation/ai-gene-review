core_functions:
- description: >-
    Obligatory, Na+-independent, electrogenic antiport (system b0,+) that imports
    extracellular L-cystine and cationic (dibasic) amino acids in 1:1 exchange for
    intracellular neutral L-amino acids, as the catalytic light chain of the b0,+AT-rBAT
    complex.
