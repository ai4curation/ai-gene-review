  review:
    summary: Phylogenetically inferred matrix structural activity is supported by target experiments.
    action: ACCEPT
    reason: The current PANTHER gene assignment resolves to PTHR24039, and human EFEMP1 descends from
      the literal IBD node PTN000620536. The broad assertion concerns matrix structural integrity, not
      fibrillin microfibril polymerization. Human ARPE-19 loss and rescue experiments independently show
      defective collagen VI matrix organization after EFEMP1 loss. Neither the short donor list nor evidence
      on a descendant is a circularity defect.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:35998264
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000620536
        source_status: SUPPORTS_TRANSFER
        comment: The literal IBD node lies on the verified human EFEMP1 path in current PTHR24039; the
          aligned target matches the 493-residue reference. Experimental descendant annotations are present,
          with no relevant NOT/IRD on the target path.
