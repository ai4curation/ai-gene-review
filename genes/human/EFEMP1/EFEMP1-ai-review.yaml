id: Q12805
gene_symbol: EFEMP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EFEMP1, also called fibulin-3, is a secreted extracellular matrix glycoprotein containing
  EGF-like repeats and a C-terminal fibulin domain. It contributes to matrix integrity and influences
  the organization and turnover of extracellular matrix networks. In human retinal pigment epithelial
  cells, loss of EFEMP1 disrupts collagen VI network formation and reduces extracellular MMP2 activity.
  EFEMP1 also associates with EGFR and stimulates receptor-dependent Akt and ERK signaling in human pancreatic
  carcinoma cells. Distinct pathogenic variants cause inherited retinal disease or connective-tissue defects,
  reflecting different effects on folding, secretion and extracellular function.
alternative_products:
- name: '1'
  id: Q12805-1
  description: Displayed 493-residue precursor with the annotated N-terminal secretion signal; the mature
    chain begins after residue 17.
- name: '2'
  id: Q12805-2
  sequence_note: VSP_001392
  description: Lacks canonical residues 1–8; equivalent secretion and function have not been established.
- name: '3'
  id: Q12805-3
  sequence_note: VSP_001393
  description: Lacks canonical residue 58; equivalent secretion and function have not been established.
- name: '4'
  id: Q12805-4
  sequence_note: VSP_001394
  description: Lacks canonical residue 106; equivalent secretion and function have not been established.
- name: '5'
  id: Q12805-5
  sequence_note: VSP_054372, VSP_054373
  description: Lacks canonical residues 1–58 and 214–293, including the canonical secretion signal region
    and two central EGF-like modules. Secretion and matrix/signaling function are not established.
