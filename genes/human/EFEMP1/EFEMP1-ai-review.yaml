    label: epidermal growth factor receptor activity
  evidence_type: IDA
  original_reference_id: PMID:19804359
  qualifier: enables
  review:
    summary: EFEMP1 associates with EGFR rather than acting as the receptor.
    action: MODIFY
    reason: In human pancreatic carcinoma cells, EFEMP1 co-immunoprecipitated with EGFR and EGF treatment
      reduced the association. Purified human EFEMP1 treatment increased receptor and downstream phosphorylation.
      These results support EGFR binding, not an EFEMP1 transmembrane receptor or kinase activity. The
      association was measured in cell lysates, not as a purified binary interaction; no natural splice
      product was identified.
    proposed_replacement_terms:
    - id: GO:0005154
      label: epidermal growth factor receptor binding
    supported_by:
    - reference_id: PMID:19804359
- term:
    id: GO:0005154
    label: epidermal growth factor receptor binding
  evidence_type: IDA
  original_reference_id: PMID:19804359
  qualifier: enables
  review:
    summary: EGFR association is a demonstrated, context-dependent EFEMP1 activity.
    action: ACCEPT
    reason: The recovered original reports EFEMP1–EGFR co-immunoprecipitation with a no-antibody control,
      reduced association after EGF exposure, and EGFR-dependent signaling after purified human EFEMP1
      treatment. This supports binding in the measured human carcinoma context. It does not establish
      a purified binding interface, universal normal-tissue signaling, or equivalent activity of all splice
      products.
