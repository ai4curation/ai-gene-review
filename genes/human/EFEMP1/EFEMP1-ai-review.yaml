core_functions:
- description: Acts as an extracellular matrix glycoprotein contributing to matrix integrity. Human retinal
    pigment epithelial knockout and rescue experiments support a role in maintaining collagen VI network
    formation and extracellular matrix turnover; these experiments do not establish direct collagen binding
    or intrinsic protease activity.
  molecular_function:
    id: GO:0005201
    label: extracellular matrix structural constituent
  locations:
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:35998264
  - reference_id: PMID:10601734
- description: Associates with the epidermal growth factor receptor and stimulates EGFR-dependent signaling
    in human pancreatic carcinoma cells. Cellular co-immunoprecipitation and EGF competition support receptor
    association; purified EFEMP1 treatment activates EGFR and downstream Akt/ERK. The tested product is
    not assigned to a specific natural splice isoform, and the contribution of this mechanism in normal
    tissues remains unresolved.
  molecular_function:
    id: GO:0005154
    label: epidermal growth factor receptor binding
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:19804359
suggested_questions:
- question: 'How does extracellular EFEMP1 influence collagen VI network assembly and MMP2 activity: through
    matrix interactions, protease regulation or changes in the producing cells?'
- question: Which normal tissues use EFEMP1-dependent EGFR signaling, and is EGFR association direct or
    mediated by another component?
- question: Which of the five annotated splice products are expressed as stable proteins, and how do their
    N-terminal and EGF-module differences affect secretion and extracellular function?
suggested_experiments:
- description: Compare sequence-verified natural splice products for secretion, extracellular deposition
    and rescue of collagen VI network defects in EFEMP1-deficient human retinal pigment epithelial cells,
    controlling for protein abundance.
- description: Measure binding between purified, sequence-defined EFEMP1 and EGFR ectodomains, then compare
    receptor signaling in matched normal and carcinoma cells with EGFR loss and rescue controls.
- description: Separate extracellular complementation from cell-autonomous effects by adding purified
    EFEMP1 or decellularized matrices to knockout cells and measuring collagen VI organization and MMP2
    abundance and activity.
