- id: PMID:12687019
  title: EGR2 induces apoptosis in various cancer cell lines by direct transactivation of BNIP3L and BAK.
  findings:
  - statement: EGR2 directly transactivates expression of BNIP3L and BAK through binding to their promoter
      regions, inducing apoptosis in cancer cell lines.
    supporting_text: EGR2 could induce apoptosis in a large proportion of these lines by altering the
      permeability of mitochondrial membranes, releasing cytochrome c and activating caspase-3, -8, and
      -9. Analysis by cDNA microarray and subsequent functional studies revealed that EGR2 directly transactivates
      expression of BNIP3L and BAK.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Identifier and source scope verified through the independent source consultation: selected
      human EGR2 original promoter/motif/EMSA evidence supports activation. The normal cache remains abstract-only;
      external original access is separately documented. Exact natural-product identity unresolved.'
- id: PMID:14532282
  title: HCF-1 functions as a coactivator for the zinc finger protein Krox20.
  findings:
  - statement: HCFC1 functions as a coactivator for EGR2/Krox20. The HCF-binding motif (DHLY at residues
      162-165) in EGR2 mediates interaction with the HCFC1 beta-propeller domain. Mutation of this motif
      diminishes both transactivation and HCFC1 association.
    supporting_text: Krox20, a zinc finger transcription factor required for Schwann cell differentiation,
      and E2F4, a cell cycle regulator, showed a strong requirement for functional HCF-1 to activate transcription
      ... In Krox20, the HCF-binding motif lies within the N-terminal activation domain and mutation of
      this sequence diminishes both transactivation and association with the HCF-1 beta-propeller
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Correct coactivation source. Selected original Methods explicitly use mouse Krox20,
      and the positive association assay is cellular transcriptional complementation/recruitment. HCFC1
      is a coactivator, not the DNA-binding transcription-factor partner class. Normal cache is abstract-only;
      independent original locators are supplied.
- id: PMID:17717711
  title: Functional, histopathologic and natural history study of neuropathy associated with EGR2 mutations.
  findings:
  - statement: The authentic abstract describes EGR2-associated inherited peripheral neuropathies, including
      respiratory compromise and cranial-nerve dysfunction. The operative functional-assay body was unavailable,
      so exact variant-specific binding or transactivation results are not independently established here.
    supporting_text: Mutations in the EGR2 gene cause a spectrum of Charcot-Marie-Tooth disease and related
      inherited peripheral neuropathies ... respiratory compromise and cranial nerve dysfunction are commonly
      associated with EGR2 mutations
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic identifier/abstract and human neuropathy context verified. Operative functional-assay
      body was not recovered; no exact variant-specific DNA-binding or transactivation result is claimed.
      Experimental annotations are retained with independent human EGR2 support, not rejected on incomplete
      access.
  full_text_unavailable: true
- id: PMID:19651900
  title: The HECT-type E3 ubiquitin ligase AIP2 inhibits activation-induced T-cell death by catalyzing
    EGR2 ubiquitination.
  findings:
  - statement: WWP2/AIP2 interacts with and ubiquitinates EGR2, promoting its proteasomal degradation.
      EGR2 regulates FasL expression in T cells during activation-induced cell death. AIP2-mediated EGR2
      degradation protects against T cell apoptosis.
    supporting_text: AIP2 interacts with and promotes ubiquitin-mediated degradation of EGR2, a zinc finger
      transcription factor that has been found to regulate Fas ligand (FasL) expression during activation-induced
      T-cell death
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Correct WWP2/AIP2-EGR2 source, with library, cellular interaction, direct region pull-down
      and ubiquitination controls. Selected original operative sections inspected independently of the
      abstract-only cache. Binding and partner class are positive; EGR2 remains the regulated substrate.
- id: PMID:21836637
  title: The transcription factor Krox20 is an E3 ligase that sumoylates its Nab coregulators.
  findings:
  - statement: EGR2/Krox20 functions as an E3 SUMO ligase, catalyzing SUMO1 conjugation to its NAB coregulators.
      This requires interaction with the SUMO-conjugating enzyme UBC9. NAB sumoylation negatively modulates
      EGR2 transcriptional activity.
    supporting_text: we show that Krox20 functions as a SUMO ligase for its coregulators--the Nab proteins--and
      that Nab sumoylation negatively modulates Krox20 transcriptional activity in vivo
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Correct direct SUMO E3 source. Main original and supplement identify mouse Krox20/E1/E2/NAB2
      with human SUMO1. Defined reconstitution supports E3 participation and human ortholog inference,
      not purified human EGR2 equivalence. Cache bytes and abstract-only flag remain unchanged.
- id: PMID:28473536
  title: Impact of cytosine methylation on DNA binding specificities of human transcription factors.
  findings:
  - statement: The study examined 542 human transcription factors with methylation-sensitive SELEX. The
      EGR2 annotation retains its curator-supported general DNA-binding context, corroborated independently
      by human EGR2 promoter experiments; the exact EGR2 supplement row, construct and methylation-preference
      class were not recovered.
    supporting_text: By analysis of 542 human TFs with methylation-sensitive SELEX (systematic evolution
      of ligands by exponential enrichment), we found that there are also many TFs that prefer CpG-methylated
      sequences
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Correct human transcription-factor specificity study. Independent original cohort Methods
      were read, but the exact EGR2 supplement row, construct and methylation-preference class were unavailable.
      Use only the curator-supported general DNA-binding assertion with independent corroboration.
- id: PMID:9537424
  title: Mutations in the early growth response 2 (EGR2) gene are associated with hereditary myelinopathies.
  findings:
  - statement: First identification of EGR2 mutations causing human myelinopathies. Recessive and dominant
      missense mutations found in patients with CHN and CMT1. Egr2 knockout mice show disrupted hindbrain
      development and a block in Schwann cell differentiation.
    supporting_text: Stable expression of Egr2 is specifically associated with the onset of myelination
      in the peripheral nervous system (PNS). Egr2(-/-) mice display disrupted hindbrain segmentation
      and development, and a block of Schwann-cell differentiation at an early stage
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic abstract supports human EGR2 hereditary myelinopathy genetics and explicitly
      distinguishes mouse hindbrain/Schwann-cell background. No new operative human rescue or mouse assay
      is inferred beyond the abstract.
