id: P11161
gene_symbol: EGR2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'EGR2 (Krox20) is a C2H2 zinc-finger transcription factor that binds regulatory DNA and activates
  RNA polymerase II transcription in the nucleus. Its transcriptional programs promote Schwann-cell differentiation
  and peripheral myelination and contribute to hindbrain development. Human EGR2 promoter and nuclear-extract
  assays establish direct activation of BNIP3L and BAK; developmental mechanisms have also been studied
  extensively in mouse. EGR2 interacts with transcriptional coregulators, including HCF-1 and NAB proteins.
  A second conserved activity is SUMO E3 ligase function toward NAB coregulators: defined reconstitution
  with mouse Egr2 and Nab2 establishes catalytic participation and supports inference to human EGR2. NAB
  sumoylation provides feedback on transcriptional output. Human EGR2 variants cause inherited peripheral
  myelinopathies. The two natural human products differ at the N terminus; the available experiments do
  not establish their functional equivalence.'
alternative_products:
- name: Long
  id: P11161-1
  description: The 476-residue Long product contains the three C2H2 zinc-finger regions and the N-terminal
    regulatory region. The available assays do not establish functional equivalence of both natural human
    products.
- name: Short
  id: P11161-2
  sequence_note: VSP_006863
  description: The 426-residue Short product lacks residues 1–50 of Long (VSP_006863), retaining the three
    C2H2 zinc-finger regions. This sequence relationship alone does not establish equivalent transcriptional
    or SUMO-ligase activity, localization, or correspondence to a tested construct.
