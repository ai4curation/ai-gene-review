- term:
    id: GO:0006611
    label: protein export from nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: The export assertion conflates transported EGR2 with export machinery.
    action: REMOVE
    reason: The exact mouse donor carries GO:0006611 IDA from PMID:17938205, so the transfer chain is
      real. The operative Results and Figure 5 describe 14-3-3sigma-dependent redistribution/sequestration
      of EGR2 itself from nucleus to cytoplasm. GO:0006611 describes directed protein movement out of
      the nucleus; these experiments establish EGR2 as the relocated cargo, not an exporter, transport
      cofactor or structural participant carrying out that movement. Remove this inferred process assertion
      on that source-role mismatch, while retaining the positive cytoplasmic annotations. This is not
      a wrong-gene allegation or an argument from an unavailable human assay.
    supported_by:
    - reference_id: PMID:17938205
    - reference_id: file:human/EGR2/EGR2-source-guide.md
    - reference_id: file:human/EGR2/EGR2-bioinformatics/RESULTS.md
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: UniProtKB:P08152
        source_status: SOURCE_BAD
        comment: The literal current GO:0006611 IDA from PMID:17938205 exists. The objection is its assignment
          of an export-process role to relocated EGR2 cargo, not source absence, paralog confusion or
          lack of human data.
      residue_claims_not_applicable: The issue is cargo versus transport participation, not a residue-level
        loss or gain.
