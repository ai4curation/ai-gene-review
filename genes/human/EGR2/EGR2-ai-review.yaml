- description: EGR2 has a conserved SUMO E3-ligase function toward NAB coregulators, recruiting the SUMO-conjugating
    E2 UBC9 and substrate through distinct interaction regions. Purified mouse Egr2 promotes mouse Nab2
    modification in a defined E1/E2/human SUMO1/ATP reaction, supporting catalytic participation; cellular
    and developmental assays connect NAB sumoylation to transcriptional feedback. This is ortholog evidence
    for the human function, without a purified human EGR2 assay or equivalence of its natural products.
