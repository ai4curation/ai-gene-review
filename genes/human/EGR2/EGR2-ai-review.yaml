core_functions:
- description: 'EGR2 binds regulatory DNA through its C2H2 zinc fingers and activates RNA polymerase II
    transcription in the nucleus. Human-cell promoter, motif-mutagenesis and nuclear-extract binding assays
    establish direct activation of BNIP3L and BAK. Coactivation by HCF-1 was studied with mouse Krox20
    in a heterologous cell system. Its transcriptional program promotes Schwann-cell differentiation and
    peripheral myelination: mouse loss-of-function studies establish these developmental roles, while
    human inherited myelinopathies support their conservation.'
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0031643
    label: positive regulation of myelination
  - id: GO:0014040
    label: positive regulation of Schwann cell differentiation
  locations:
