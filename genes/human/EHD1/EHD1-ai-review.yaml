- term:
    id: GO:0005525
    label: GTP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR030381
  review:
    summary: GTP binding (IEA, InterPro dynamin-like G domain) for EHD1.
    action: MODIFY
    reason: Although EHD proteins have a dynamin-related G domain, they bind and hydrolyze ATP rather
      than GTP; purified RME-1/EHD1 family proteins showed no significant GTP binding or hydrolysis, and
      ATP binding drives their oligomerization and membrane association. The correct nucleotide-binding
      term is ATP binding.
    proposed_replacement_terms:
    - id: GO:0005524
      label: ATP binding
    supported_by:
    - reference_id: PMID:15710626
      supporting_text: we show that both Caenorhabditis elegans and mouse RME-1 proteins bind and hydrolyze
        ATP. No significant GTP binding or hydrolysis was detected.
