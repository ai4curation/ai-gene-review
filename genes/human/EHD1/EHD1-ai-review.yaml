- term:
    id: GO:1905556
    label: ciliary vesicle assembly
  evidence_type: IMP
  original_reference_id: PMID:25686250
  review:
    summary: 'Proposed: EHD1 drives assembly of the ciliary vesicle from distal appendage vesicles at
      the mother centriole.'
    action: NEW
    reason: 'EHD1 does the work of this step: its membrane-tubulating activity reorganizes the small distal
      appendage vesicles, and with the SNARE regulator SNAP29 it promotes their fusion into the ciliary
      vesicle. This is more specific than the existing cilium assembly annotation and matches the GO definition
      (smaller vesicles dock at the transitional fibres and fuse to form the ciliary vesicle). No gene
      product currently carries this term, so there is no conflicting convention.'
    supported_by:
    - reference_id: PMID:25686250
      supporting_text: EHD-dependent membrane tubulation is essential for ciliary vesicle formation from
        smaller distal appendage vesicles (DAVs).
    - reference_id: PMID:25686250
      supporting_text: Based on our findings for EHD1 and EHD3 functioning in CV assembly from DAVs, we
        predicted that the SNARE membrane fusion machinery would play a critical role in early ciliogenesis.
    - reference_id: PMID:25686250
      supporting_text: Together, these results indicate that the EHD1 K483 membrane tubulation function
        is critical for DAV assembly into the CV and M-centriole reorganization
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: ISS
  original_reference_id: PMID:15710626
  review:
    summary: 'Proposed: EHD1 is an ATPase (RME-1/EHD family proteins bind and hydrolyze ATP).'
    action: NEW
    reason: Mouse RME-1/EHD1 (and C. elegans RME-1) bind and hydrolyze ATP, not GTP, and ATP binding is
      required for oligomerization and endosome association. Human EHD1 is highly conserved with mouse
      Ehd1, so ATP hydrolysis activity is the appropriate catalytic activity term and replaces the incorrect
      GTP-binding inference.
    supported_by:
    - reference_id: PMID:15710626
      supporting_text: we show that both Caenorhabditis elegans and mouse RME-1 proteins bind and hydrolyze
        ATP. No significant GTP binding or hydrolysis was detected.
