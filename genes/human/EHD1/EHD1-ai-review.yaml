core_functions:
- description: 'Membrane-remodeling ATPase: ATP-bound EHD1 oligomerizes on recycling endosome membranes
    and, via its EH domain and NPF-motif partners (MICAL-L1, syndapin-2, rabenosyn-5), drives tubule fission
    to promote exit of receptors from the endocytic recycling compartment to the plasma membrane (non-ciliary
    core role).'
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  directly_involved_in:
  - id: GO:0032456
    label: endocytic recycling
  locations:
  - id: GO:0055038
    label: recycling endosome membrane
  supported_by:
  - reference_id: PMID:15710626
    supporting_text: ATP binding is required for oligomerization of mRme-1/EHD1, which in turn is required
      for its association with endosomes
  - reference_id: PMID:15020713
    supporting_text: Depletion of either EHD1 or Rabenosyn-5 delayed the recycling of transferrin and
      major histocompatibility complex class I to the plasma membrane.
- description: 'Ciliary role: with EHD3, tubulates distal appendage vesicles at the mother centriole so
    they fuse (with SNAP29) into the ciliary vesicle, a prerequisite for CP110 removal, transition zone/IFT20
    recruitment and axoneme growth; later resides at the ciliary pocket membrane.'
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  directly_involved_in:
  - id: GO:1905556
    label: ciliary vesicle assembly
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0020018
    label: ciliary pocket membrane
  supported_by:
  - reference_id: PMID:25686250
    supporting_text: EHD-dependent membrane tubulation is essential for ciliary vesicle formation from
      smaller distal appendage vesicles (DAVs).
  - reference_id: PMID:31615969
    supporting_text: The endocytic protein EHD1 plays an important role in ciliogenesis by facilitating
      fusion of the ciliary vesicle and removal of CP110
suggested_questions:
- question: Is ATP hydrolysis by EHD1 required for distal appendage vesicle tubulation/fusion in ciliogenesis,
    as it is for oligomerization on recycling endosomes?
- question: Should EHD1 receive a membrane tubulation/fission-related molecular function term once GO
    provides one suited to dynamin-like ATPases, rather than only ATP hydrolysis activity?
suggested_experiments:
- description: Rescue EHD1-knockout RPE1 cells with ATP-binding (P-loop) and ATP-hydrolysis mutants and
    quantify ciliary vesicle formation by EM, CP110 removal and ciliation.
