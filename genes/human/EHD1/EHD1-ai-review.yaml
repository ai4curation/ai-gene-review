id: Q9H4M9
gene_symbol: EHD1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EHD1 (also RME-1/PAST1 homolog) is a member of the C-terminal Eps15 homology domain-containing
  (EHD) family of dynamin-related ATPases. It has an N-terminal G-like domain that binds and hydrolyzes
  ATP, a helical membrane-binding region, and a C-terminal EH domain with an EF-hand that binds NPF-motif
  partners such as MICAL-L1, rabenosyn-5, rabankyrin-5 and syndapin-2. ATP-bound EHD1 dimerizes and oligomerizes
  on membranes, where it tubulates and promotes fission (vesiculation) of tubular recycling endosomes.
  It is a key regulator of endocytic recycling, controlling exit of internalized receptors such as transferrin
  receptor and MHC class I from the perinuclear endocytic recycling compartment back to the plasma membrane,
  and it also contributes to retromer-dependent endosome-to-Golgi retrieval. In early primary ciliogenesis
  EHD1, together with its close paralog EHD3, is recruited to the mother centriole (via MICAL-L1), associates
  with preciliary vesicles and tubulates distal appendage vesicles so that they fuse, with SNAP29, into
  the ciliary vesicle; this step is required for removal of CP110 from the mother centriole and recruitment
  of transition zone proteins and IFT20. EHD1 later localizes to the ciliary pocket membrane. In other
  cell types EHD1 has been implicated in cholesterol homeostasis, myoblast fusion and neurotrophin-receptor
  trafficking.
