- term:
    id: GO:0006493
    label: protein O-linked glycosylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q4JK59
  - ensembl:ENSMUSP00000096203
  review:
    summary: TET2 contributes to histone O-GlcNAcylation by recruiting OGT to chromatin.
    action: KEEP_AS_NON_CORE
    reason: OGT catalyzes O-linked GlcNAc transfer, while TET2 contributes by directly binding OGT
      and targeting its activity to chromatin substrates. That recruitment role makes the
      glycosylation process a real but non-core TET2 context rather than the conserved 5mC
      dioxygenase activity.
    supported_by:
    - reference_id: PMID:23222540
      supporting_text: TET2 directly interacts with OGT, which is important for the chromatin
        association of OGT in vivo.
