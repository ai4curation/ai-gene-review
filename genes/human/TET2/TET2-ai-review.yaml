id: Q6N021
gene_symbol: TET2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TET2 is a nuclear methylcytosine dioxygenase that uses its cysteine-rich and double-stranded
  beta-helix catalytic core, Fe(II), and 2-oxoglutarate to oxidize 5-methylcytosine in genomic DNA through
  the 5-hydroxymethylcytosine, 5-formylcytosine, and 5-carboxylcytosine series. The enzyme shapes DNA
  demethylation and transcriptional programs on chromatin, is especially important in hematopoietic cells,
  and can recruit OGT-containing chromatin machinery to active promoters.
