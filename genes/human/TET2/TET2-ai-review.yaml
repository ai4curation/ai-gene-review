- id: PMID:21057493
  title: Impaired hydroxylation of 5-methylcytosine in myeloid cancers with mutant TET2.
  findings:
  - statement: TET2 mutations compromise catalytic activity, lower genomic 5hmC in myeloid-cancer
      bone marrow, and skew Tet2-depleted mouse hematopoietic precursors toward monocyte/macrophage
      differentiation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary TET2 myeloid-cancer and catalytic-activity paper.
- id: PMID:23222540
  title: TET2 promotes histone O-GlcNAcylation during gene transcription.
  findings:
  - statement: TET2 directly binds OGT, recruits OGT to chromatin, and facilitates histone
      O-GlcNAcylation and transcription at shared target genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary mechanistic paper for TET2-OGT recruitment and histone O-GlcNAcylation.
- id: PMID:23353889
  title: TET2 and TET3 regulate GlcNAcylation and H3K4 methylation through OGT and SET1/COMPASS.
  findings:
  - statement: TET2 and TET3 interact directly with OGT and promote OGT-linked GlcNAcylation and
      SET1/COMPASS chromatin effects.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct OGT/TET2/TET3 paper used for OGT recruitment and transcriptional-regulation
      contexts.
- id: PMID:24315485
  title: 'Crystal structure of TET2-DNA complex: insight into TET-mediated 5mC oxidation.'
  findings:
  - statement: The human TET2-DNA crystal structure shows a compact zinc-containing catalytic domain
      that recognizes methylated CpG DNA and orients 5mC toward Fe(II) for oxidation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary structural paper for TET2 zinc binding, ferrous-iron binding, CpG
      substrate recognition, and 5mC dioxygenase activity.
- id: PMID:25557551
  title: CRL4(VprBP) E3 ligase promotes monoubiquitylation and chromatin binding of TET
    dioxygenases.
  findings:
  - statement: CRL4(VprBP)-mediated monoubiquitylation of a conserved TET lysine promotes chromatin
      binding of TET dioxygenases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct paper supporting TET2 nucleus/chromosome localization and chromatin
      binding.
- id: PMID:25601757
  title: WT1 recruits TET2 to regulate its target gene expression and suppress leukemia cell
    proliferation.
  findings:
  - statement: WT1 recruits TET2 to WT1 target genes to regulate expression and suppress
      leukemia-cell proliferation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Direct TET2 recruitment-partner context; useful but not part of the core conserved
      catalytic definition.
- id: PMID:28514442
  title: Architecture of the human interactome defines protein communities and disease networks.
  findings:
  - statement: High-throughput human interactome mapping reported TET2 protein-protein interactions.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Large interactome paper that supplies bare protein-binding rows removed per
      policy.
- id: PMID:29735542
  title: PML Recruits TET2 to Regulate DNA Modification and Cell Proliferation in Response to
    Chemotherapeutic Agent.
  findings:
  - statement: PML binds and recruits TET2 to PML nuclear bodies in response to chemotherapeutic
      agents.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Direct PML/TET2 recruitment context, not a core TET2 activity.
- id: PMID:32518946
  title: Germline TET2 loss of function causes childhood immunodeficiency and lymphoma.
  findings:
  - statement: Germline TET2 loss of function causes human immunodeficiency and lymphoma with absent
      or enzymatically defective TET2 and whole-blood DNA hypermethylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human genetic evidence that loss of TET2 catalytic function disrupts immune
      differentiation.
- id: PMID:32814053
  title: Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins and Uncovers
    Widespread Protein Aggregation in Affected Brains.
  findings:
  - statement: Disease-protein interactome mapping reported TET2 protein-protein interactions.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Large interactome paper that supplies a bare protein-binding row removed per
      policy.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: Proteome-scale interactome mapping reported TET2 protein-protein interactions.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: High-throughput interactome paper used only for bare protein-binding rows removed
      per policy.
- id: PMID:34667079
  title: PROSER1 mediates TET2 O-GlcNAcylation to regulate DNA demethylation on UTX-dependent
    enhancers and CpG islands.
  findings:
  - statement: PROSER1 mediates the interaction between OGT and TET2, promoting TET2 O-GlcNAcylation
      and DNA demethylation at UTX-dependent enhancers and CpG islands.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct TET2/OGT/PROSER1 chromatin-regulation paper.
- id: Reactome:R-HSA-9827992
  title: Expression of TET2 in primordial germ cells
  findings:
  - statement: Reactome places TET2 expression in the primordial-germ-cell expression event.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Curated Reactome context for a TET2 nucleoplasm row.
