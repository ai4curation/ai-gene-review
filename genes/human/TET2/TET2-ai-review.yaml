  - PANTHER:PTN002763942
  - UniProtKB:Q6N021
  review:
    summary: TET2 has strong hematopoietic evidence, but myeloid differentiation is a non-core
      outcome of its DNA demethylation activity.
    action: KEEP_AS_NON_CORE
    reason: TET2 mutations in myeloid cancers and Tet2 depletion in mouse hematopoietic precursors
      show that TET2 is important for normal myelopoiesis. The process is kept as non-core because
      it is a cell-type outcome of the nuclear DNA 5mC dioxygenase activity rather than the
      conserved activity itself.
