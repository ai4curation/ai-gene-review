suggested_questions:
- question: Does FANCG contribute direct DNA recognition or substrate positioning beyond maintaining the
    repair-complex architecture?
- question: Does the FANCG–BRCA2–FANCD2–XRCC3 assembly provide a separable homologous-recombination function
    in human cells, and which features explain the positive chicken evidence and failed heterologous complementation?
- question: Does FANCG protect mitochondrial PRDX3 mainly by shielding bound PRDX3 from cleavage or by
    altering protease activity, and how much does this pathway contribute to native oxidative-stress resistance?
suggested_experiments:
- experiment_type: structure-function reconstitution
  description: Compare matched human FANCG wild-type and interface mutants in a reconstituted repair complex,
    measuring assembly, DNA association and FANCD2–FANCI monoubiquitination separately. Include purified
    FANCG-alone DNA-binding controls, inactive FANCL/UBE2T controls and expression/stoichiometry controls
    so loss of complex stability is not mistaken for a direct DNA-recognition or catalytic defect.
- experiment_type: species-resolved separation-of-function genetics
  description: In human FANCG-deficient cells, compare matched wild-type, Ser7 and interface variants
    using a defined HR reporter, replication-associated lesions, complex association and ICL survival.
    Control cell cycle, expression and nuclear localization. Parallel chicken and human complementation
    with matched expression can distinguish host compatibility from conservation or divergence without
    treating heterologous non-rescue as human loss of function.
- experiment_type: purified interaction and proteolysis assay
  description: Reconstitute PRDX3 cleavage with purified FANCG and calpain, separating FANCG–PRDX3 binding
    from effects on cleavage of an unrelated calpain substrate. Compare binding-defective FANCG variants
    at matched concentrations, then test endogenous mitochondrial PRDX3 stability and oxidative-stress
    responses with localization and fraction-purity controls.
