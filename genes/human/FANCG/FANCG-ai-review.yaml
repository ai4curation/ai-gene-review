    reason: PMID:12861027 directly demonstrates reduced SCneo homologous recombination in chicken DT40
      FANCG mutants and rescue by chicken FANCG; human FANCG did not complement in that host. This is
      positive evidence for conserved involvement and the host-specific failure is not evidence of human
      functional loss. PMID:18212739 additionally contains human/hamster FANCG-dependent BRCA2–FANCD2–XRCC3
      complex association and separate chicken epistasis, correcting the old claim that both papers only
      use chicken. That human structural association is relevant indirect mechanistic support, but the
      precise human HR participation represented by this authored proposal remains uncertain in the inspected
      evidence. The original positive ISS rationale and both quotations remain visible; direct human endpoint
      assays are not a universal prerequisite for GO inference. Same-role human FA-core comparator records
      lack this term at the bounded cut, which is a caution rather than an exclusion rule. A retained
      ISS interpretation based on the conserved reporter phenotype plus human structural mechanism remains
      a defensible alternative for final synthesis; this proposal is not biological negation. The specific
      authored human HR assertion is withdrawn from active proposals while its positive conserved evidence
      and unresolved review remain preserved. This is curator withdrawal of our proposal, not withdrawal
      by GO, loss of an imported GOA annotation, or biological negation.
