core_functions:
- description: FANCG provides an integral protein scaffold that organizes FANCA/FANCF-associated elements
    of the nuclear Fanconi anemia repair complex. This structural activity supports assembly and chromatin-associated
    operation of the complex needed for FANCD2–FANCI monoubiquitination and interstrand cross-link repair.
    Its contribution to ubiquitin ligase activity is through the assembled complex; FANCL and UBE2T perform
    ubiquitin transfer, and no autonomous FANCG ligase reaction or specific ligase–substrate-adaptor positioning
    mechanism is assigned.
