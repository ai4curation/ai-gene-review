id: O15287
gene_symbol: FANCG
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FANCG (XRCC9) is a 622-residue tetratricopeptide-repeat protein that acts as an integral
  scaffold of the nuclear Fanconi anemia repair machinery. Its interactions with FANCA and FANCF help
  organize the core complex, supporting FANCD2–FANCI monoubiquitination and DNA interstrand cross-link
  repair; FANCL and UBE2T perform ubiquitin transfer. FANCG occurs in nuclear and chromatin-associated
  pools and supports responses to several forms of DNA damage. Biallelic pathogenic variants cause Fanconi
  anemia complementation group G, with chromosome instability, bone-marrow failure and cancer predisposition.
  FANCG also associates with BRCA2, FANCD2 and XRCC3, while the precise contribution of this assembly
  to homologous recombination in human cells remains unresolved. A mitochondrial pool binds peroxiredoxin-3
  and can protect it against proteolytic cleavage, linking FANCG to contextual oxidative-stress responses.
