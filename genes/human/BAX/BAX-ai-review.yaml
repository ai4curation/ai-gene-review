  review:
    summary: The inherited mitochondrial-fusion row has the polarity backwards for apoptotic BAX.
    action: MODIFY
    reason: BAX activation is associated with blockade of mitochondrial fusion during apoptosis 
      rather than BAX acting as a positive mitochondrial-fusion factor.
    proposed_replacement_terms:
    - id: GO:0010637
      label: negative regulation of mitochondrial fusion
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - REGULATORY_SIGN_INVERSION
      source_entities:
      - source_id: PANTHER:PTN000135648
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The inherited row captures the BAX mitochondrial-dynamics connection, but the more 
          precise direction is negative regulation of mitochondrial fusion.
