    supporting_text: Bcl-xL can form both homodimers and heterodimers
  - reference_id: PMID:21199865
    supporting_text: complex with a 34-mer peptide from Bax that encompasses its BH3 domain
proposed_new_terms: []
suggested_questions:
- question: Should GO add a BAX/BAK-specific molecular function term for BH3-triggered mitochondrial
    outer-membrane permeabilizing pore assembly, rather than relying on the broader channel activity
    term?
- question: Should historical BAX annotations to mitochondrial permeability transition pore complex
    and related permeability-transition process terms be systematically retired in favor of
    mitochondrial outer membrane permeabilization?
suggested_experiments:
- description: For peripheral regulators such as ER-resident BAX/BAK and mitochondrial-dynamics factors, 
    reconstitute or deplete the candidate proteins in BAX/BAK-defined cells and measure BAX 
    conformational activation, OMM insertion, oligomerization, and cytochrome-c release separately 
    from terminal cell-death readouts.
