id: Q07812
gene_symbol: BAX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'BAX is a multidomain pro-apoptotic BCL2-family effector that drives mitochondrial outer
  membrane permeabilization during intrinsic apoptosis. In healthy cells, BAX is largely cytosolic or
  retrotranslocated away from mitochondria by pro-survival BCL2-family proteins. After apoptotic stimulation,
  BH3-only activators and release from pro-survival restraints drive BAX conformational activation, mitochondrial
  outer-membrane insertion, homodimerization, and assembly into higher-order oligomeric pores that release
  cytochrome c and other intermembrane-space factors. BAX can also act with BAK and is modulated by accessory
  proteins that tune its localization, conformation, stability, and non-core ER or mitochondrial-dynamics
  outputs.'
