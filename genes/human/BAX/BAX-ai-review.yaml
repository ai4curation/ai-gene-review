core_functions:
- description: Activated BAX inserts into the mitochondrial outer membrane and forms a membrane pore
    that permeabilizes the membrane to release cytochrome c during intrinsic apoptotic signaling.
  molecular_function:
    id: GO:0015267
    label: channel activity
  directly_involved_in:
  - id: GO:0097345
    label: mitochondrial outer membrane permeabilization
  - id: GO:0001836
    label: release of cytochrome c from mitochondria
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  in_complex:
    id: GO:0097144
    label: BAX complex
  supported_by:
  - reference_id: PMID:9219694
    supporting_text: Bax formed pH- and voltage-dependent ion-conducting channels
  - reference_id: PMID:17052454
    supporting_text: BID BH3 domain, which triggers the functional activation of BAX at nanomolar 
      doses in vitro
- description: BAX homodimerization and higher-order self-association build the mitochondrial BAX 
    oligomer that constitutes the MOMP pore.
  molecular_function:
    id: GO:0042803
    label: protein homodimerization activity
  directly_involved_in:
  - id: GO:0097345
    label: mitochondrial outer membrane permeabilization
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  in_complex:
    id: GO:0097144
    label: BAX complex
  supported_by:
  - reference_id: Reactome:R-HSA-114275
    supporting_text: BAX forms oligomeric complexes which play an important role in cytochrome C 
      release
  - reference_id: PMID:14522999
    supporting_text: tBid-induced Bax oligomerization and pore formation
- description: BAX binds activator BH3 helices, including BID and BIM BH3 domains, to trigger the 
    conformational change that licenses BAX oligomerization and mitochondrial permeabilization.
  molecular_function:
    id: GO:0051434
    label: BH3 domain binding
  directly_involved_in:
  - id: GO:0097345
    label: mitochondrial outer membrane permeabilization
  supported_by:
  - reference_id: PMID:17052454
    supporting_text: a direct binding interaction between BAX and a hydrocarbon-stapled BID BH3 
      domain
  - reference_id: PMID:18948948
    supporting_text: BIM SAHB binds BAX at an interaction site that is distinct from the canonical 
      binding groove
- description: BAX forms heterodimers or mixed BCL2-family assemblies with anti-apoptotic and 
    pro-apoptotic multidomain partners that restrain, activate, or tune MOMP.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
