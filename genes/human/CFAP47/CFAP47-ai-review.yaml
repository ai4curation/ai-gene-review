- description: >-
    Binds the central microtubules directly: ASH1 and ASH4 contact protofilaments 13 and 1 of C1 (reinforcing
    the C1 seam) and ASH20 contacts protofilament 12 of C2; these microtubule contacts are what allow
    CFAP47 to tether C1 to C2.
  molecular_function:
