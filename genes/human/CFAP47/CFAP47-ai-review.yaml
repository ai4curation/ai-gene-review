- term:
    id: GO:0120212
    label: sperm head-tail coupling apparatus
  evidence_type: IDA
  original_reference_id: PMID:33472045
  qualifier: located_in
  review:
    summary: >-
      Immunofluorescence of control human sperm shows a CFAP47 signal at the head-tail junction; an independent
      study reports the same neck localisation.
    action: KEEP_AS_NON_CORE
    reason: >-
      Two independent immunofluorescence studies place a CFAP47 signal at the head-flagellum junction
      (PMID:33472045, abstract only, as curated; PMID:37723893). The structural data, however, place CFAP47
      along the central apparatus of the axoneme (PMID:40473901), so the neck signal is likely a pool
      or an antibody-accessibility effect rather than the site of CFAP47's main function. Kept as a real
      but non-core observation.
    supported_by:
    - reference_id: PMID:37723893
      supporting_text: >-
        Immunofluorescence analysis showed CFAP47 is located to junction of head and flagellum in sperm
        of control but absent in sperm of P1.
    - *id001
