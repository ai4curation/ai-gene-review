gene_symbol: CFAP47
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CFAP47 (cilia- and flagella-associated protein 47) is a very large X-linked axonemal protein, built
  from a chain of ASH/Ig-like domains with a calponin-homology domain, that is highly expressed in testis
  and sperm. In the sperm flagellum it is the core structural component of the bridge of the axonemal
  central apparatus: its N-terminal domains bind the C1 microtubule, a central ring formed with the calponin-homology
  domain binds HYDIN, and its C-terminal region anchors to the C2 microtubule, so that CFAP47 tethers
  the two central microtubules together. Loss of CFAP47 leaves a hollow bridge in the central apparatus
  and disrupts sperm flagellum formation and motility. Hemizygous deleterious variants or deletion of
  CFAP47 cause X-linked spermatogenic failure 3, with asthenoteratozoospermia and multiple morphological
  abnormalities of the sperm flagellum, sometimes with head, mitochondrial sheath and annulus defects;
  intracytoplasmic sperm injection is reported to give a good prognosis. CFAP47 variants have also been
  reported in a few men with primary ciliary dyskinesia features and with cystic kidney disease, where
  the protein was detected in renal primary cilia.
