suggested_questions:
- question: >-
    Does CFAP47 form the central-apparatus bridge in human airway and ependymal cilia as it does in mouse
    sperm, and if so why are respiratory phenotypes in CFAP47 patients mild or rare?
- question: >-
    What is the CFAP47 pool seen by immunofluorescence at the sperm head-tail junction, given that the
    protein is structurally part of the central apparatus along the axoneme?
suggested_experiments:
- hypothesis: >-
    CFAP47 is required for C1-C2 bridge integrity in respiratory cilia as well as in sperm.
  description: >-
    Perform cryo-ET subtomogram averaging of central apparatus from airway cilia of Cfap47-knockout mice
    (or CFAP47-patient nasal brushings), with high-speed video microscopy of ciliary beating, to test
    whether the bridge is lost and beating altered outside the testis.
  experiment_type: structural biology
