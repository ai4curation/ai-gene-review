      exact GO:0008017, human, run 2026-10-16): other axonemal microtubule-associated proteins carry this
      term, including the central-pair protein SPEF1 (IBA, ISS), CFAP144 (IDA), CFAP100 (IMP), CFAP157
      and SAXO1/SAXO2/SAXO6, so microtubule binding is the established MF for proteins that contact axonemal
      microtubules.
    supported_by:
    - reference_id: PMID:40473901
      supporting_text: >-
        The ASH1 and ASH4 domains of CFAP47 bind to protofilament-13 and protofilament-1 of C1, respectively,
        reinforcing the C1 seam.
    - reference_id: PMID:40473901
      supporting_text: >-
        Additionally, the ASH18 domain of CFAP47 binds SPAG16, and its ASH20 domain interacts with protofilament-12
        of the C2 microtubule
