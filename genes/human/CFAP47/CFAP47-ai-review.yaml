- term:
    id: GO:0007288
    label: sperm axoneme assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:3781475
  - PANTHER:PTN001496298
  - UniProtKB:Q6ZTR5
  review:
    summary: >-
      CFAP47 is the core structural component of the bridge that tethers the C1 and C2 microtubules of
      the sperm central apparatus. Hemizygous CFAP47 variants cause MMAF in men, and Cfap47-deficient
      mouse sperm have a hollow central-apparatus bridge, reduced motility and abnormal flagellar morphology.
    action: ACCEPT
    reason: >-
      Core process. CFAP47 does part of the work of sperm axoneme assembly by contributing the structural
      bridge of the central apparatus (PMID:40473901), and loss-of-function in men and mice disrupts flagellar
      formation (PMID:33472045, PMID:40473901). For the IBA row, the PANTHER node (PTN001496298) covers
      the vertebrate CFAP47 orthologs, human CFAP47 sits inside it, and there is no evidence of loss;
      the target appearing in its own WITH/FROM reflects its own experimental annotation feeding the node
      placement.
    supported_by: &id002
    - *id001
    - &id003
      reference_id: PMID:40473901
      supporting_text: >-
        In the sperm of Cfap47-knockout (KO) mice, a hollow bridge region within the CA structure was
        observed, correlating with abnormal sperm motility and confirming the essential role of CFAP47
        in CA function.
    - &id004
      reference_id: PMID:33472045
      supporting_text: All men harboring hemizygous CFAP47 variants displayed typical MMAF phenotypes.
