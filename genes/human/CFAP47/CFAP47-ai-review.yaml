- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: ISS
  original_reference_id: PMID:40473901
  qualifier: enables
  supporting_entities:
  - MGI:MGI:3781475
  review:
    summary: >-
      In the in situ mouse sperm central-apparatus structure, CFAP47 is the core structural component
      of the bridge: its N-terminal domains bind C1, its central CFAP47-ring binds HYDIN, and its C-terminal
      region anchors to C2, so the CFAP47 chain tethers the two central microtubules. Cfap47-knockout sperm
      have a hollow bridge and weakened C1-C2 connections.
    action: NEW
    reason: >-
      CFAP47 contributes the structural integrity of a cytoskeletal structure, which is what GO:0005200
      describes: the resolved full-length model shows the CFAP47 molecule itself spanning and linking
      C1 and C2, and loss of CFAP47 removes the bridge density (including the SPAG6 proteins that depend
      on it) and weakens the C1-C2 linkage (PMID:40473901). This is the same call this repository made
      for CFAP43 (genes/human/CFAP43, NEW GO:0005200 enables, from a native axoneme structure), and CFAP47
      has, if anything, the more detailed evidence: a domain-by-domain contact map. The structure is from
      mouse sperm, so the evidence code is ISS from mouse Cfap47 (MGI:MGI:3781475) rather than IDA; the
      human relevance is supported by human truncating variants that map onto the same structure and
      cause asthenozoospermia/MMAF. Comparator check (QuickGO, run 2026-10-16): no human central-apparatus
      protein (HYDIN, SPAG6, SPAG16, SPAG17, CFAP65, MYCBPAP, SPEF2, CFAP46, CFAP54, CFAP74) carries any
      MF other than protein binding or unrelated HDA/IBA terms, so GOA has no convention either way for
      central-apparatus scaffolds; the absence reflects missing structural curation, not a deliberate
      choice, and the CFAP43 precedent is followed. Enables, not contributes_to: the structural contribution
      is made by the CFAP47 molecule itself.
    supported_by:
    - *id001
    - reference_id: PMID:40473901
      supporting_text: >-
        Second, mutations in scaffold proteins, such as CFAP47 and HYDIN, can weaken the connections between
        C1 and C2, compromising CA stability.
    - reference_id: PMID:40473901
      supporting_text: >-
        Although CFAP47 is not essential for CA assembly or for direct interactions with the 9 neighboring
        RSs, its absence disrupts the bridge structure, including the assembly of SPAG6 and GMCL1 (BTBD16),
        thereby weakening the connections between C1 and C2.
