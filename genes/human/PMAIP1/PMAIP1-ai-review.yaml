id: Q13794
gene_symbol: PMAIP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PMAIP1 encodes NOXA, a short BH3-only BCL2-family apoptosis regulator induced by TP53, HIF1A,
  interferon/dsRNA, proteasome inhibition, glucose stress, and other cell-death stimuli. NOXA localizes
  to the cytosol and mitochondria and acts at the mitochondrial outer membrane, where its BH3 helix selectively
  binds the grooves of pro-survival MCL1 and BCL2A1 and can also engage lower-affinity contextual partners
  such as BCL2 and BCL2L10/Bcl-B. These interactions neutralize pro-survival BCL2-family restraint, can
  promote proteasomal degradation of MCL1, and license BAX/BAK-dependent mitochondrial outer-membrane
  permeabilization, cytochrome-c release, and intrinsic apoptosis.'
