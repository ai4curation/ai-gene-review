core_functions:
- description: NOXA uses its BH3 helix to bind and inhibit pro-survival BCL2-family proteins, most 
    prominently MCL1 and BCL2A1, derepressing BAX/BAK-dependent mitochondrial outer-membrane 
    permeabilization and cytochrome-c release.
  proposed_molecular_function: pro-survival BCL2 family protein inhibitor activity
  directly_involved_in:
  - id: GO:1901030
    label: positive regulation of mitochondrial outer membrane permeabilization involved in 
      apoptotic signaling pathway
  - id: GO:0090200
    label: positive regulation of release of cytochrome c from mitochondria
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  in_complex:
    id: GO:0097136
    label: Bcl-2 family protein complex
  supported_by:
  - reference_id: PMID:15694340
    supporting_text: Strikingly, Noxa bound only Mcl-1 and A1
  - reference_id: PMID:15901672
    supporting_text: Noxa could bind to Mcl-1, displace Bak, and promote Mcl-1 degradation
  - reference_id: PMID:17374615
    supporting_text: endogenous Bim
proposed_new_terms:
- proposed_name: pro-survival BCL2 family protein inhibitor activity
  proposed_definition: Binding to a pro-survival BCL2-family protein through a BH3-mediated 
    interaction to inhibit that protein from sequestering pro-apoptotic BCL2-family effectors or 
    activators.
  justification: BIM, BID, PUMA, BAD, NOXA, and related BH3-only proteins donate BH3 helices to the 
    grooves of pro-survival BCL2 proteins and inhibit their anti-apoptotic activity. GO:0051434 BH3 
    domain binding annotates the groove-side receptor and is directionally wrong for the BH3-only 
    ligand.
  proposed_parent:
    id: GO:0140678
    label: molecular function inhibitor activity
  supported_by:
  - reference_id: PMID:15694340
    supporting_text: Strikingly, Noxa bound only Mcl-1 and A1
  - reference_id: PMID:15901672
    supporting_text: Noxa could bind to Mcl-1, displace Bak, and promote Mcl-1 degradation
suggested_questions:
- question: Should GO add a NOXA/BAD-side molecular-function term for BH3-only inhibition of 
    pro-survival MCL1/BCL2A1-family proteins, so these rows are not forced into GO:0005515 or the 
    directionally wrong GO:0051434 BH3 domain binding term?
- question: Should Reactome-derived PMAIP1 transcription events be filtered so TP53/E2F1 expression 
    reactions do not automatically create cytosolic localization rows for the NOXA protein?
suggested_experiments:
- description: For candidate NOXA interactions outside the MCL1/BCL2A1/BCL2L10/BCL2 pro-survival 
    BCL2-family set, map BH3-groove dependence and test whether the partner changes MCL1 turnover, 
    BAX/BAK activation, MOMP, or cytochrome-c release before curating the edge as more than generic 
    protein binding.
