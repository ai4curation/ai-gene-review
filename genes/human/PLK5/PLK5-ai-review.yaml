id: Q496M5
gene_symbol: PLK5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PLK5 is a divergent polo-like-kinase-family protein in which the human gene encodes
  a C-terminal, kinase-deficient product that lacks the catalytic domain but retains
  linker and polo-box-domain sequences. Unlike PLK1-PLK4, human PLK5 is not an active
  serine/threonine kinase and is not a mitotic centrosome, spindle-pole or kinetochore
  kinase. PLK5 is expressed prominently in differentiated neural tissue, localizes mainly
  to the cytoplasm of neurons and glia, and its polo-box-containing product promotes
  neurite outgrowth downstream of neurotrophin/Ras stimulation. It is frequently silenced
  by promoter hypermethylation in astrocytoma and glioblastoma, and forced re-expression
  can trigger apoptosis in glioblastoma cells.
