- description: >-
    Human PLK5 is a cytoplasmic, kinase-deficient polo-box protein that promotes
    neurite outgrowth downstream of neurotrophin/Ras stimulation in neurons. The
    molecular activity of the human PLK5 polo-box region is not resolved well enough
    for a specific GO molecular-function term.
