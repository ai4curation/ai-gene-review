suggested_questions:
- question: >-
    Which lysine and hydroxylysine sites in native human elastin and collagen are
    oxidized specifically by LOXL1 rather than LOX or another LOXL paralog?
- question: >-
    Which human LOXL1 cleavage products acquire a mature copper/LTQ catalytic center,
    and how do BMP1- and ADAMTS14-dependent cleavages alter their stability, matrix
    retention, and substrate preference?
- question: >-
    Does fibulin-5 recruit a particular precursor or processed LOXL1 form at endogenous
    abundance, and is that transient targeting interaction required for elastic-fiber
    assembly without constituting a stable complex?
- question: >-
    How do exfoliation-syndrome-associated LOXL1 variants alter expression, secretion,
    processing, elastogenic targeting, or catalysis in relevant human ocular tissues?
suggested_experiments:
- hypothesis: >-
    Human LOXL1 preferentially oxidizes a defined subset of elastin sites that is not
    redundantly modified by other lysyl oxidases.
  description: >-
    Use inducible LOXL1 degradation in primary human fibroblasts and elastogenic
    organoids, with matched single and combinatorial LOX-family perturbations. Quantify
    site-resolved aldehydes and mature elastin/collagen cross-links by mass spectrometry,
    then rescue with wild-type or catalytic-dead LOXL1 and compare purified human
    enzyme kinetics on matched matrix substrates.
  experiment_type: endogenous perturbation and matrix cross-link proteomics
- hypothesis: >-
    Distinct BMP1- and ADAMTS14-generated LOXL1 forms differ in catalytic competence and
    matrix-substrate targeting.
  description: >-
    Engineer endogenous cleavage-site substitutions in human matrix-producing cells,
    quantify each extracellular LOXL1 form and LTQ maturation, and measure activity,
    matrix retention, elastin deposition, and collagen cross-links. Include protease
    perturbation and rescue with purified, cleavage-matched LOXL1 forms.
  experiment_type: endogenous processing and form-specific activity analysis
- hypothesis: >-
    Fibulin-5 transiently recruits a processing-defined LOXL1 form to elastogenic sites
    and is required for spatially restricted elastin cross-linking.
  description: >-
    Endogenously tag LOXL1 on both sides of mapped cleavage sites, perturb FBLN5, and use
    pulse-chase super-resolution imaging, proximity labeling, and form-specific
    immunoprecipitation alongside elastin cross-link measurements. Test rescue with
    fibulin-5 variants defective in LOXL1 binding and distinguish transient colocalization
    from stable complex formation by quantitative residence-time measurements.
  experiment_type: endogenous interaction and elastogenic-targeting analysis
- hypothesis: >-
    Exfoliation-syndrome risk variants perturb a specific LOXL1 biogenesis or targeting
    step rather than creating a new catalytic activity.
  description: >-
    Create isogenic human ocular fibroblast or anterior-segment organoid lines carrying
    common LOXL1 risk and protective haplotypes. Quantify transcription, secretion,
    cleavage forms, fibulin-5 recruitment, oxidase activity, matrix cross-links, and
    exfoliation-material phenotypes under matched stress conditions.
  experiment_type: isogenic variant-to-function analysis
