knowledge_gaps:
- gap_statement: >-
    The catalytic efficiency and native substrate-site spectrum of purified human LOXL1
    have not been established directly, including how its contribution to elastin
    cross-linking differs from its contribution to collagen cross-linking and from those
    of other lysyl oxidases.
  boundary: >-
    Human sequence, reaction mappings, and orthology support protein-lysine 6-oxidase
    activity, while processed bovine LOXL1 is directly active on elastin and collagen and
    mouse Loxl1 loss causes pronounced elastic-fiber defects. These data do not identify
    endogenous human LOXL1-specific oxidation sites or quantify paralog redundancy.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Direct human substrate maps are needed to define why LOXL1 is especially important
    for elastic fibers and to separate conserved catalytic capacity from paralog-specific
    matrix deployment.
  resolution: >-
    Purify correctly cofactor-loaded human LOXL1 forms and combine kinetic assays with
    site-resolved allysine, hydroxyallysine, and mature-cross-link proteomics in
    LOXL1-depleted human elastogenic cell cultures, using selective LOX/LOXL paralog
    perturbations and wild-type versus catalytic-dead rescue.
  provenance:
  - reference_id: PMID:11684696
    supporting_text: >-
      The immunopurified protein was largely inactive, but further processing in vitro by bone morphogenetic protein-1 led to an enzyme that was active on elastin and collagen substrates.
  - reference_id: PMID:14745449
    supporting_text: >-
      Here we show that mice lacking the protein lysyl oxidase-like 1 (LOXL1) do not deposit normal elastic fibers in the uterine tract post partum and develop pelvic organ prolapse, enlarged airspaces of the lung, loose skin and vascular abnormalities with concomitant tropoelastin accumulation.
- gap_statement: >-
    Which extracellular human LOXL1 cleavage products are catalytically active, and how
    BMP1 and ADAMTS14 processing regulates activity, stability, and substrate targeting,
    remains unresolved.
  boundary: >-
    Human-cell proteomics maps one BMP1 site and three ADAMTS14 sites, including sites
    beyond the annotated propeptide boundary, but does not assay the activity of every
    resulting species. Older activation evidence and cleavage assignments come from
    bovine LOXL1 and cannot define human form-specific activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving form-specific activity is necessary to distinguish precursor processing
    from catalytic activation and to avoid assigning one fixed functional boundary to
    heterogeneous extracellular LOXL1 species.
  resolution: >-
    Introduce endogenous human LOXL1 cleavage-site substitutions individually and in
    combination, quantify secreted forms by targeted proteomics, and measure cofactor
    formation, catalytic activity, matrix retention, and elastin/collagen cross-links
    with rescue by purified matched forms.
  provenance:
  - reference_id: PMID:35328709
    supporting_text: >-
      The analysis resulted in one single processing site at 151–152 (RH/GG) for BMP1 and three distinct cleavage sites for ADAMTS14 at positions 216–217 (GA/AA), 292–293 (PD/PG), and 375–376 (PD/PN)
- gap_statement: >-
    The in-vivo mechanism and specificity by which fibulin-5 and other matrix partners
    target human LOXL1 to elastogenic sites are not known, nor is it clear which LOXL1
    precursor or processed form mediates each interaction.
  boundary: >-
    Human recombinant proteins demonstrate fibulin-5 binding, and mouse genetics links
    LOXL1 localization at elastogenic sites to spatially defined elastin deposition.
    These observations do not establish interaction stoichiometry, form specificity, or
    stable complex membership, and fibulin-5 also binds LOXL2 and LOXL4 in the assay.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Targeting could explain LOXL1's elastic-fiber specialization despite a catalytic
    domain shared with other lysyl oxidases and could reveal how disease-associated
    changes perturb matrix assembly without abolishing catalysis.
  resolution: >-
    Tag endogenous LOXL1 on both sides of its principal processing sites in human
    elastogenic cells, perturb FBLN5 and EFEMP2 separately, and combine pulse-chase
    imaging, proximity labeling, form-specific co-immunoprecipitation, and cross-link
    measurements to distinguish transient targeting from stable complexes.
  provenance:
  - reference_id: PMID:17371835
    supporting_text: >-
      As shown in Fig. 7 B, we detected the specific interaction of LOXL1, 2, and 4 proteins with fibulin-5 protein (top, lanes 1, 7, and 13). The interaction of fibulin-5 and these LOXL proteins was eliminated or considerably diminished by the C-terminal deletion of fibulin-5 (Fig. 7 B, top, lanes 5, 11, and 17).
