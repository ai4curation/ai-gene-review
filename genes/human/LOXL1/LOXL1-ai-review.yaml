id: Q08397
gene_symbol: LOXL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LOXL1 is a secreted copper- and lysine-tyrosylquinone-dependent protein-lysine
  oxidase of the extracellular matrix. Proteolytic processing of the precursor
  produces extracellular LOXL1 forms whose C-terminal catalytic region oxidatively
  deaminates lysine and hydroxylysine side chains in matrix proteins, initiating
  covalent cross-link formation. LOXL1 is especially important for elastin deposition
  and adult elastic-fiber homeostasis: recruitment to elastogenic sites through
  fibulin-5 helps spatially target its activity, while collagen is an additional
  substrate supported most directly by orthologous biochemical evidence. LOXL1
  Loss of Loxl1 in mice disrupts elastic tissues, and human LOXL1 variants confer
  susceptibility to exfoliation syndrome.
