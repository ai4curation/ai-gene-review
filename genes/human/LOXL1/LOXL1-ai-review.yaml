      Distinct from the prototypic lysyl oxidase (LOX), LOXL1 localizes specifically to sites of elastogenesis and interacts with fibulin-5. Thus elastin polymer deposition is a crucial aspect of elastic fiber maintenance and is dependent on LOXL1, which serves both as a cross-linking enzyme and an element of the scaffold to ensure spatially defined deposition of elastin.
  - reference_id: PMID:17371835
    supporting_text: >-
      As shown in Fig. 7 B, we detected the specific interaction of LOXL1, 2, and 4 proteins with fibulin-5 protein (top, lanes 1, 7, and 13). The interaction of fibulin-5 and these LOXL proteins was eliminated or considerably diminished by the C-terminal deletion of fibulin-5 (Fig. 7 B, top, lanes 5, 11, and 17).
  - reference_id: PMID:11684696
    supporting_text: >-
      The immunopurified protein was largely inactive, but further processing in vitro by bone morphogenetic protein-1 led to an enzyme that was active on elastin and collagen substrates.
  - reference_id: PMID:35328709
