- id: PMID:14745449
  title: Elastic fiber homeostasis requires lysyl oxidase-like 1 protein.
  findings:
  - statement: Loxl1-deficient mice have defective postpartum uterine elastic-fiber deposition and abnormalities in lung, skin, and vasculature with tropoelastin accumulation.
    supporting_text: >-
      Here we show that mice lacking the protein lysyl oxidase-like 1 (LOXL1) do not deposit normal elastic fibers in the uterine tract post partum and develop pelvic organ prolapse, enlarged airspaces of the lung, loose skin and vascular abnormalities with concomitant tropoelastin accumulation.
  - statement: Unlike canonical LOX, LOXL1 localizes to sites of elastogenesis, interacts with fibulin-5, and supports spatially defined elastin deposition as both cross-linking enzyme and scaffold-associated component.
    supporting_text: >-
      Distinct from the prototypic lysyl oxidase (LOX), LOXL1 localizes specifically to sites of elastogenesis and interacts with fibulin-5. Thus elastin polymer deposition is a crucial aspect of elastic fiber maintenance and is dependent on LOXL1, which serves both as a cross-linking enzyme and an element of the scaffold to ensure spatially defined deposition of elastin.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed title and abstract were verified. This is the decisive LOXL1-specific in vivo
      loss-of-function study, although the cache is abstract-only and the experimental
      organism is mouse, not human.
- id: PMID:35328709
  title: Cleavage of LOXL1 by BMP1 and ADAMTS14 Proteases Suggests a Role for Proteolytic Processing in the Regulation of LOXL1 Function.
  findings:
  - statement: Human LOXL1 is secreted into extracellular medium as multiple processed species.
    supporting_text: >-
      The presence of this complex array of LOXL1 species in the extracellular medium suggests that LOXL1 protein is the subject of specific post-translational modifications, likely including proteolysis by endogenous proteases.
  - statement: BMP1 cleaves LOXL1 once within its propeptide, whereas ADAMTS14 cleaves at multiple sites spanning the propeptide and beginning of the catalytic domain.
    supporting_text: >-
      Our data show that BMP1 cleaves LOXL1 in a unique location within the pro-peptide region, whereas ADAMTS14 processes LOXL1 in at least three different sites located within the pro-peptide and in the first residues of the catalytic domain.
  - statement: Proteomics mapped the human LOXL1 BMP1 site to residues 151-152 and ADAMTS14 sites to residues 216-217, 292-293, and 375-376.
    supporting_text: >-
      The analysis resulted in one single processing site at 151–152 (RH/GG) for BMP1 and three distinct cleavage sites for ADAMTS14 at positions 216–217 (GA/AA), 292–293 (PD/PG), and 375–376 (PD/PN)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed identity and full text were verified. The study directly analyzes human
      LOXL1 secretion and cleavage in Tenon's-capsule fibroblasts and engineered HEK293
      models. It maps processing, but does not directly prove the catalytic activity of
      each processed human species; its discussion also notes disagreement with older
      bovine cleavage-site assignments.
