core_functions:
- description: >-
    The processed extracellular C-terminal LOXL1 enzyme uses copper and its covalent
    lysine-tyrosylquinone cofactor to oxidatively deaminate selected protein lysine and
    hydroxylysine residues, generating aldehydes that initiate matrix-protein
    cross-linking. LOXL1 is especially deployed during elastic-fiber assembly: mouse
    loss-of-function evidence places it at sites of elastogenesis, and human recombinant
    evidence shows binding to the elastogenic organizer fibulin-5. Fibulin targeting is
    treated as a transient scaffold/substrate-recruitment interaction, not stable complex
    membership. Purified processed bovine LOXL1 acts on elastin and collagen, but direct
    catalytic assays of purified human LOXL1 are not available in the reviewed evidence;
    human data instead directly establish secretion and a heterogeneous processing
    landscape. The precursor, its N-terminal segments, and the mature catalytic forms
    are therefore kept distinct, and mouse tissue phenotypes or human disease
    susceptibility are not represented as additional molecular activities.
  molecular_function:
    id: GO:0004720
    label: protein-lysine 6-oxidase activity
  directly_involved_in:
