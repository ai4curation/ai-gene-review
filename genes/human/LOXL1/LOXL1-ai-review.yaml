- term:
    id: GO:0048251
    label: elastic fiber assembly
  evidence_type: ISO
  original_reference_id: PMID:14745449
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P97873
  review:
    summary: >-
      Proposed new annotation by orthology. Loxl1-null mice fail to deposit normal
      postpartum uterine elastic fibers and accumulate tropoelastin, while LOXL1
      localizes to elastogenic sites and interacts with fibulin-5.
    action: NEW
    reason: >-
      Elastic-fiber assembly captures LOXL1's best-supported specialized biological
      process more directly than collagen fibril organization or broad extracellular
      matrix terms. The evidence is explicitly transferred from mouse rather than
      presented as a direct human perturbation result; human recombinant fibulin-5
      binding independently supports the conserved elastogenic-targeting mechanism.
    additional_reference_ids:
    - PMID:17371835
    supported_by:
    - reference_id: PMID:14745449
      supporting_text: >-
        Here we show that mice lacking the protein lysyl oxidase-like 1 (LOXL1) do not deposit normal elastic fibers in the uterine tract post partum and develop pelvic organ prolapse, enlarged airspaces of the lung, loose skin and vascular abnormalities with concomitant tropoelastin accumulation.
    - reference_id: PMID:14745449
      supporting_text: >-
        Distinct from the prototypic lysyl oxidase (LOX), LOXL1 localizes specifically to sites of elastogenesis and interacts with fibulin-5.
    - reference_id: PMID:17371835
      supporting_text: >-
        As shown in Fig. 7 B, we detected the specific interaction of LOXL1, 2, and 4 proteins with fibulin-5 protein (top, lanes 1, 7, and 13).
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:P97873
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Mouse Loxl1 loss-of-function and elastogenic-site evidence support transfer
          of elastic-fiber assembly to the human ortholog.
