core_functions:
- description: Supports assembly and operation of the V1 sector of the V-ATPase, thereby contributing
    to ATP-hydrolysis-driven proton translocation by the assembled complex. At the apical membrane
    of renal epithelia this activity supports urinary acidification. B1 is a non-catalytic structural
    subunit; renal and auditory consequences are contexts of the same pump contribution.
  contributes_to_molecular_function:
    id: GO:0046961
    label: proton-transporting ATPase activity, rotational mechanism
  in_complex:
    id: GO:0033176
    label: proton-transporting V-type ATPase complex
  directly_involved_in:
  - id: GO:1902600
    label: proton transmembrane transport
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:16769747
    supporting_text: "B1 point mutations prevent normal \nassembly of the H+ -ATPase"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
proposed_new_terms: []
suggested_questions:
- question: What exact donor assays support the B1 synaptic-vesicle activity and microvillus/lateral-membrane
    transfers, and how do they distinguish B1 from B2?
- question: Which B1-specific experiments or curator source mapping underlie the PMID:33065002 IDA
    membership record, given the B2 identity in its inspected human structural preparation?
- question: What exact target-pair, peptide and clinical endpoint records support the unresolved
    interaction, vesicle, calcium-homeostasis and ossification assertions?
- question: What is the quantitative acid-transport contribution of B1-positive human TAL/DCT cells,
    beyond their demonstrated apical localization?
suggested_experiments:
- description: Compare defined B1 and B2 preparations in matched complexes with assembly, nucleotide-binding
    and ATP-dependent proton-flux readouts, separating isolated-subunit properties from holoenzyme
    activity.
- description: Use validated isoform-specific localization and functional perturbation to distinguish
    B1 from B2 in renal, inner-ear and neuronal contexts.
