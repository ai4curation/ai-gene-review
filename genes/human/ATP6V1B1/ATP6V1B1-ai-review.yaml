core_functions:
- description: Supports assembly and operation of the V1 sector of the V-ATPase, thereby
    contributing to ATP-hydrolysis-driven proton translocation by the assembled complex.
    At the apical membrane of renal epithelia this activity supports urinary acidification.
    B1 is a non-catalytic structural subunit; renal and auditory consequences are
    contexts of the same pump contribution.
  contributes_to_molecular_function:
    id: GO:0046961
    label: proton-transporting ATPase activity, rotational mechanism
  in_complex:
    id: GO:0033176
    label: proton-transporting V-type ATPase complex
  directly_involved_in:
