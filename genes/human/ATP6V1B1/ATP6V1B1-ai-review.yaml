suggested_questions:
- question: What exact donor assays support the B1 synaptic-vesicle activity and microvillus/lateral-membrane
    transfers, and how do they distinguish B1 from B2?
- question: Which B1-specific experiments or curator source mapping underlie the PMID:33065002
    IDA membership record, given the B2 identity in its inspected human structural
    preparation?
- question: What exact target-pair, peptide and clinical endpoint records support
    the unresolved interaction, vesicle, calcium-homeostasis and ossification assertions?
- question: What is the quantitative acid-transport contribution of B1-positive human
    TAL/DCT cells, beyond their demonstrated apical localization?
suggested_experiments:
- description: Compare defined B1 and B2 preparations in matched complexes with assembly,
    nucleotide-binding and ATP-dependent proton-flux readouts, separating isolated-subunit
    properties from holoenzyme activity.
- description: Use validated isoform-specific localization and functional perturbation
    to distinguish B1 from B2 in renal, inner-ear and neuronal contexts.
