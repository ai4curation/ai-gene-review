id: P15313
gene_symbol: ATP6V1B1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP6V1B1 encodes the B1 isoform of the non-catalytic B subunit of the V-ATPase V1 sector.
  B1 supports assembly and operation of the ATP-driven proton pump rather than independently hydrolyzing
  ATP or forming a proton pore. In renal epithelia, B1-containing pumps at the apical membrane contribute
  to urinary acidification and systemic acid-base balance. B1 is also expressed in the cochlea and
  endolymphatic sac, and pathogenic variants cause distal renal tubular acidosis with sensorineural
  hearing loss. Its conserved nucleotide-binding property is inferred from related B subunits, while
  disease-associated B1 variants can disrupt complex assembly and trafficking.
