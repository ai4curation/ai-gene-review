    action: MODIFY
    summary: C1QTNF5 assembles into collagen-stalk homotrimers that can form higher oligomers.
    reason: 'GO:0005581 collagen trimer is a more specific complex interpretation than an unspecified
      protein-containing complex. The target has a collagen region with 23 uninterrupted Gly-X-Y repeats,
      UniProt curates collagen-mediated homotrimerization, and the longer human recombinant construct
      in PMID:24531000 contains that region and forms trimers and bouquet-like higher assemblies by gel
      filtration and negative-stain EM. The integrated sequence, curated subunit and architectural evidence
      supports the collagen-trimer interpretation. Its triple-helical stalk is an architectural inference
      in these inspected experiments, not a claim of direct high-resolution stalk determination: PMID:22892318
      and the crystallographic part of PMID:24531000 resolve only the globular gC1q head. Generic trimerization
      or the number of asymmetric-unit molecules alone would not establish this term. No particular numbered
      collagen type, obligatory disulfide linkage, or autonomous cell-adhesion function is inferred.'
