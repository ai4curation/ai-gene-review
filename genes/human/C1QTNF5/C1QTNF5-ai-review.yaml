  review:
    action: UNDECIDED
    summary: The directional lipid-catabolism inference is not resolved by the inspected RPE experiments.
    reason: The IC derives from C1QTNF5 receptor inhibition, but PMID:34887495 studies distinct acute
      signaling and chronic disease contexts. Healthy-RPE C1QTNF5 inhibits AMPK signaling; chronically
      elevated AMPK in S163R patient RPE is associated with reduced PEDF/PEDF-R phospholipase activity,
      impaired photoreceptor-lipid digestion and reduced fatty-acid-derived products. These observations
      do not transparently establish that normal C1QTNF5 negatively regulates lipid breakdown. Preserve
      the existing assertion pending clarification of the intended IC chain, rather than reverse its sign
