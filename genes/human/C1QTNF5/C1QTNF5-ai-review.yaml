  review:
    action: UNDECIDED
    summary: The directional lipid-catabolism inference is not resolved by the inspected RPE experiments.
    reason: The IC derives from C1QTNF5 receptor inhibition, but PMID:34887495 separates acute healthy-RPE
      signaling from chronic S163R disease phenotypes. Healthy-RPE C1QTNF5 inhibits AMPK signaling; chronically
      elevated AMPK in patient RPE accompanies reduced PEDF/PEDF-R phospholipase activity and impaired
      photoreceptor-lipid digestion. These observations do not transparently establish that normal C1QTNF5
      negatively regulates lipid breakdown. Independently, the complete normal PMID:19651784 abstract
      directly reports increased fatty-acid oxidation after recombinant C1QTNF5 treatment of myocytes,
      alongside AMPK/ACC phosphorylation. That is positive lipid catabolism in its assay context and argues
      against a universal negative effect, but does not by itself falsify a distinct RPE-specific regulatory
      pathway. Preserve UNDECIDED until the intended directional and temporal IC chain is resolved; do
      not reverse its sign merely from mutant phenotypes, transfer myocyte effects to RPE, or assign C1QTNF5
      a lipase activity.
    supported_by:
