core_functions:
- description: Secreted oligomeric C1QTNF5 associates with ADIPOR1 at the apical surface of human retinal
    pigment epithelium and restrains receptor-dependent AMPK signaling. This extracellular regulatory
    activity helps maintain RPE metabolic and secretory homeostasis. The inhibitory direction is established
    in RPE and does not imply the same signaling response in every tissue; AMPK and receptor enzymatic
    activities belong to their respective proteins.
  molecular_function:
    id: GO:0030547
    label: signaling receptor inhibitor activity
  directly_involved_in:
  - id: GO:0007165
    label: signal transduction
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:34887495
    supporting_text: native CTRP5 acts as an inhibitor for ADIPOR1 receptors
  - reference_id: file:human/C1QTNF5/C1QTNF5-uniprot.txt
suggested_questions:
- question: Which receptor and cellular conditions explain the different reported effects of C1QTNF5 on
    AMPK in RPE and myocytes, and how should the activator-parent GO:0048018 PAINT assertion be reconciled
    with direct ADIPOR1 inhibition?
  experts: []
- question: What exact directional and temporal mechanism underlies the IC annotation for negative regulation
    of lipid catabolism, given that chronic mutant RPE shows reduced PEDF-R phospholipase activity and
    impaired lipid digestion?
  experts: []
- question: Does C1QTNF5 directly organize epithelial adhesion or participate in lipid handling with MFRP,
    beyond demonstrated oligomer assembly, colocalization and binding? Structural packing and disease
    deposits do not establish those activities.
  experts: []
- question: Which wild-type transport-vesicle compartment and source experiment support the mouse-derived
    localization annotation, and how does it differ from pathogenic heterooligomer retention?
  experts: []
