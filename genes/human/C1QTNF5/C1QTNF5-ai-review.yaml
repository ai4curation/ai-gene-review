description: C1QTNF5, also called CTRP5, is a secreted collagen-like and globular C1q-domain protein that
  assembles into trimers and higher-order oligomers. It associates with the apical and lateral surfaces
  of retinal pigment epithelial and ciliary epithelial cells and interacts with the membrane protein MFRP.
  In human retinal pigment epithelium, extracellular C1QTNF5 associates with ADIPOR1 and inhibits its
  downstream AMPK signaling, helping maintain epithelial metabolic and secretory homeostasis. Its effects
  on AMPK depend on cellular context. Pathogenic variants such as S163R disturb oligomer handling and
  secretion and cause autosomal dominant late-onset retinal degeneration.
