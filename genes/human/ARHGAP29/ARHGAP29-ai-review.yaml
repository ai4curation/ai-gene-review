core_functions:
- description: Accelerates Rho-family GTP hydrolysis, favoring Rho in the original assay, and
    thereby promotes the inactive GDP-bound signaling state. In endothelial cells this regulatory
    step links the RASIP1/RADIL pathway to reduced Rho-dependent actomyosin tension and maintenance
    of junctional barrier function. Cultured human endothelial cells also require ARHGAP29 for
    normal lumen formation. Cytosol is one supported pool, rather than an exclusive location
    of activity.
  molecular_function:
