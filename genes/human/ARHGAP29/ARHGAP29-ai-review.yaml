  label: Homo sapiens
description: ARHGAP29, also called PARG1, is an intracellular Rho-family GTPase-activating protein. Its
  GAP domain accelerates GTP hydrolysis, favoring Rho over Rac and Cdc42 in the original biochemical assay
  and thereby reducing the active signaling state. A cytosolic pool and association with signaling partners
  place this activity in spatially regulated Rho signaling. The C-terminal tail can bind a PDZ domain
  of PTPL1, and ARHGAP29 coassociates with Rasip1-containing assemblies.
