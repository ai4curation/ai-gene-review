  label: Homo sapiens
description: ARHGAP29, also called PARG1, is an intracellular Rho-family GTPase-activating protein
  that accelerates GTP hydrolysis, with preference for Rho over Rac and Cdc42 in the original
  biochemical assay. Its activity reduces the active Rho-GTP signaling state. In endothelial
  cells, ARHGAP29 works with RASIP1 and RADIL downstream of Rap1 to limit Rho-dependent actomyosin
  tension and support junctional barrier function. Depletion in cultured human endothelial cells
  disrupts lumen formation. Cytosolic localization and interactions with signaling partners
  help position its regulatory activity; its C-terminal tail binds the fourth PDZ domain of
  PTPL1. Human ARHGAP29 variants are associated with nonsyndromic orofacial clefting.
