existing_annotations:
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0134
  review:
    summary: Correct. UniProt's Golgi apparatus membrane SUBCELLULAR LOCATION line for AGTRAP carries
      ECO:0000269|PubMed:12960423, so this keyword-derived row traces to a direct microscopy result
      on the protein rather than to a prediction.
    action: ACCEPT
    reason: PubMed:12960423 localised ATRAP by immunofluorescence and electron microscopy to perinuclear
      vesicular membranes corresponding to endoplasmic reticulum, Golgi and endocytic vesicles,
      and this is the experimental basis of the three UniProt SubCell terms. The protein is a multi-pass
      membrane protein (three predicted TM helices, UniProt FT 24-44, 56-76, 87-107), so a membrane-qualified
      location is the right granularity.
    supported_by:
    - reference_id: PMID:12960423
      supporting_text: colocalization analysis by immunofluorescence shows that ATRAP colocalizes
        in an intracellular vesicular compartment corresponding to endoplasmic reticulum, Golgi,
        and endocytic vesicles
- term:
    id: GO:0001666
    label: response to hypoxia
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q642A2
  - ensembl:ENSRNOP00000011747
  review:
    summary: Over-annotated. The whole annotation rests on a single rat IEP - a transcript abundance
      change in a neonatal-brain hypoxic-preconditioning experiment - projected into human by orthology.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The donor was resolved and then its own evidence queried rather than assumed: UniProtKB:Q642A2
      is rat Agtrap (ATRAP_RAT, Swiss-Prot, 160 aa, a true orthologue), and its only experimental
      support for GO:0001666 is one IEP from PubMed:17033689, ''Vascular response to hypoxic preconditioning
      in the immature brain''. Querying QuickGO by that reference returns two annotations in all
      of GOA - rat Agtrap and rat Angptl4 - both IEP, i.e. the paper''s GO footprint is an expression-pattern
      readout and nothing more. An expression change formally satisfies ''response to'' in the source
      species, but projecting a tissue- and development-stage-specific response term across species
      asserts something about human AGTRAP that has never been tested. Kept rather than removed
      because the rat observation itself is not in doubt.'
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: UniProtKB:Q642A2
        source_label: rat Agtrap (ATRAP_RAT)
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: True orthologue, but holds GO:0001666 by a single IEP from PubMed:17033689, which
          annotates only 2 entities in all of GOA.
      - source_id: ensembl:ENSRNOP00000011747
        source_label: rat Agtrap protein
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Compara's protein handle on the same single IEP.
      residue_claims_not_applicable: An evidence-strength question about a response-to-stimulus
        term, not a residue-level one.
- term:
    id: GO:0004945
    label: angiotensin type II receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9WVK0
  - ensembl:ENSMUSP00000030865
  review:
    summary: Wrong, and demonstrably so in two independent ways. AGTRAP is not a receptor, and the
      gene's founding paper specifically tested and excluded any AT2 interaction; the annotation
      traces to an MGI row taken from a paper about Agtr2, not Agtrap.
    action: REMOVE
    reason: 'Biology first, because the argument does not depend on provenance. GO:0004945 is defined
      as ''An angiotensin receptor activity that acts via Gi protein coupling and cGMP (NO) generation'',
      and the qualifier here is enables - i.e. the assertion is that AGTRAP is a functional AT2
      receptor. AGTRAP is a 159-residue protein with three transmembrane helices (UniProt FT 24-44,
      56-76, 87-107), not a seven-pass GPCR, and nothing in its record involves G-protein coupling.
      PubMed:10358057 assayed exactly this question and reported that ATRAP binds the AT1a C-terminal
      tail and specifically not AT2, so the term is contradicted by direct experiment on this protein,
      and it names the wrong receptor subtype for a protein whose own name is ''type-1''. Provenance
      second, and it explains how the row arose. The Compara donor UniProtKB:Q9WVK0 is mouse Agtrap,
      a true orthologue, but its GO:0004945 is an MGI IMP citing PubMed:10425188 - ''Increased vasoconstrictor
      response of the mouse lacking angiotensin II type 2 receptor'', an Agtr2-knockout study whose
      abstract does not mention Agtrap. Querying QuickGO by reference rather than by gene shows
      that paper annotating three entities: Agt, Agtr2 (which correctly receives GO:0004945 enables
      by IGI) and Agtrap - two alphabetically adjacent symbols, one of which is an angiotensin receptor.
      The error is now in three species: rat Agtrap (Q642A2) carries GO:0004945 both by Ensembl
      IEA and by RGD ISO. Correcting the MGI row would clear all of them.'
    supported_by:
    - reference_id: PMID:10358057
      supporting_text: ATRAP interacts specifically with the carboxyl-terminal domain of the AT1a
        receptor but not with those of angiotensin II type 2 (AT2), m3 muscarinic acetylcholine,
        bradykinin B2, endothelin B, and beta2-adrenergic receptors.
    - reference_id: PMID:10425188
      supporting_text: In the mice lacking the gene encoding the AT2 receptor, the pressor response
        to Ang II was increased although the underlying mechanism is unknown.
    - reference_id: file:human/AGTRAP/AGTRAP-uniprot.txt
      supporting_text: FT   TRANSMEM        87..107
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      - ROLE_CONFLATION
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:Q9WVK0
        source_label: mouse Agtrap (ATRAP_MOUSE)
        source_status: SOURCE_BAD
        comment: Reviewed 1:1 orthologue, so the orthology is fine; its GO:0004945 IMP cites PubMed:10425188,
          an Agtr2-knockout paper that assays no Agtrap allele. Probable Agtr2/Agtrap symbol confusion.
      - source_id: ensembl:ENSMUSP00000030865
        source_label: mouse Agtrap protein
        source_status: SOURCE_BAD
        comment: Compara's protein-level handle on the same defective MGI row.
      - source_id: UniProtKB:P35374
        source_label: mouse Agtr2
        source_status: NOT_RELEVANT
        comment: The gene PubMed:10425188 actually characterises; it holds GO:0004945 enables by
          IGI from the same paper.
      residue_claims_not_applicable: The objection is that AGTRAP has the wrong protein architecture
        for a GPCR (three TM helices, no G-protein coupling), not that individual residues were
        lost from a retained fold.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16189514
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q96AL5
  review:
    summary: PBX3 is a two-hybrid hit later corroborated by co-immunoprecipitation in breast cancer
      cells, where AGTRAP directs USP14-mediated stabilisation of PBX3. Real but context-restricted,
      and the accession used is not canonical PBX3.
    action: KEEP_AS_NON_CORE
    reason: PMID:35414770 independently co-immunoprecipitates ATRAP with PBX3 in two breast cancer
      lines and shows ATRAP over-expression raises PBX3 protein without changing its mRNA. Two caveats
      keep this non-core. First, the assay is over-expression in a cancer context and PBX3 is a
      nuclear homeodomain factor, whereas AGTRAP is a three-pass membrane protein - the compartments
      do not obviously meet. Second, the GOA row cites Q96AL5, an unreviewed 367-aa TrEMBL entry,
      not canonical PBX3 (P40426, 434 aa), so the clone assayed is not the full-length protein.
      Kept rather than removed because an orthogonal assay exists, which is more than the rest of
      the screen set has.
    additional_reference_ids:
    - PMID:35414770
    supported_by:
    - reference_id: PMID:35414770
      supporting_text: we performed co-IP assays in MDA-MB-453 and T47D cells transfected with Flag-tagged
        ATRAP, which revealed that ATRAP can directly bind with PBX3
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16189514
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9UKF7
  review:
    summary: 'PITPNC1 (RdgB-beta) is one of only three AGTRAP two-hybrid partners with orthogonal
      support, and the only one that yields an informative molecular function for AGTRAP itself:
      a targeted study shows AGTRAP recruits the PITP domain of RdgB-beta to membranes, i.e. AGTRAP
      is the membrane anchor.'
    action: MODIFY
    reason: 'The partner is real. PMID:21728994 is titled for RdgB-beta rather than for AGTRAP,
      which is why no AGTRAP-keyed search surfaces it; it reports that on PMA treatment the PITP
      domain of RdgB-beta engages AGTRAP and is thereby recruited to membranes. That is exactly
      GO:0043495 protein-membrane adaptor activity - ''brings together a protein ... with a membrane
      ... to establish or maintain the localization of the protein'' - which integral membrane tethers
      such as SUN1, SUN2 and GPR179 already carry. Bare protein binding states nothing about what
      AGTRAP does, so the row is modified rather than accepted. Two caveats, stated rather than
      left for a reader to find. First, GO:0043495''s differentia describes the adaptor as reaching
      the membrane ''either via membrane lipid binding or by interacting with a membrane protein'',
      and AGTRAP does neither - it is itself the integral membrane protein. GO''s usage is broader
      than that wording: SUN1, SUN2 and GPR179 all hold the term and are all integral membrane proteins
      tethering a partner at a membrane, which is exactly this case, so the term fits practice even
      where the differentia reads narrowly. Second, the recruitment rests on a single paper, and
      the underlying GOA evidence here is still two-hybrid (PMID:16189514, PMID:19060904, PMID:25416956,
      PMID:32296183, 4 CCSB releases of one clone set).'
    proposed_replacement_terms:
    - id: GO:0043495
      label: protein-membrane adaptor activity
    additional_reference_ids:
    - PMID:21728994
    supported_by:
    - reference_id: PMID:21728994
      supporting_text: interacts with the integral membrane protein ATRAP (angiotensin II type I
        receptor-associated protein; also known as AGTRAP) causing membrane recruitment
