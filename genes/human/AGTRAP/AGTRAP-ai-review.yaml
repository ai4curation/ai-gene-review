      AT1a-tail binding, its selectivity against five other receptor tails, and inhibition of AT1a-mediated
      phospholipase C. The work is on the mouse protein (mouse kidney library, murine AT1a bait),
      which is why it corroborates rather than supplies the human GO:0031702 proposal. Also the
      source of the mouse plasma membrane and cell cortex IDAs that Compara projects into human.'
- id: PMID:10425188
