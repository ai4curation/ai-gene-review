  findings: []
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: 'Relevant to this review only as the defect it documents. The paper is an Agtr2-knockout
      study and its abstract never mentions Agtrap, yet MGI attached two annotations on mouse Agtrap
      to it: GO:0004945 enables by IMP and GO:0008217 by IMP. Querying QuickGO by this reference
      returns 13 annotations over 3 entities (Agt, Agtr2, Agtrap), with Agtr2 correctly receiving
