    review_notes: 'The interpro2go route, and the source of the GO:0038166 row. Which signature
      supplies it was checked rather than assumed: AGTRAP has exactly one InterPro entry, IPR009436,
      which is the AGTRAP family itself (PTHR16521 / PF06396 - one subfamily, 1380 member proteins
      of which 5 are Swiss-Prot and all 5 are AGTRAP orthologues). So the signature match is correct
      and specific; the defect is that the GO term attached to it names the pathway AGTRAP inhibits.'
- id: GO_REF:0000033
