id: Q8WXI7
gene_symbol: MUC16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MUC16 (CA125) is a giant (about 22,000 residues) membrane-associated mucin, a single-pass
  type I transmembrane glycoprotein with an enormous, heavily O- and N-glycosylated extracellular region
  composed of a Ser/Thr-rich N-terminal domain and tens of SEA-domain-containing tandem repeats, a single
  transmembrane helix and a short polybasic cytoplasmic tail. It is expressed at the apical surfaces of
  ocular surface, respiratory, and reproductive tract epithelia and mesothelium, where it forms part of
  the glycocalyx, providing a disadhesive, lubricating barrier against particles and pathogens; its cytoplasmic
  tail binds ezrin/radixin/moesin proteins linking it to the actin cytoskeleton. The ectodomain is shed
  into body fluids and is measured as the serum ovarian cancer marker CA125. MUC16 binds mesothelin, mediating
  heterotypic adhesion that may favour peritoneal spread of ovarian cancer.
