core_functions:
- description: Apical cell-surface transmembrane mucin whose large glycosylated ectodomain forms a disadhesive
    glycocalyx barrier on mucosal epithelia, excluding dyes and limiting bacterial adherence.
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - *id004
  - reference_id: PMID:17898272
    supporting_text: HCLE cells incubated with rose bengal showed that exclusion of the dye was significantly
      reduced in cells with MUC16 suppression. In addition, S. aureus binding to HCLE cells was significantly
      increased with MUC16 suppression.
  - *id005
- description: Binds mesothelin on apposing mesothelial cells, mediating heterotypic cell-cell adhesion.
  molecular_function:
    id: GO:0050839
    label: cell adhesion molecule binding
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  directly_involved_in:
  - id: GO:0034113
    label: heterotypic cell-cell adhesion
  supported_by:
  - *id003
suggested_questions:
- question: What protease(s) cleave MUC16 to release the CA125 ectodomain, and is shedding regulated by
    phosphorylation of its cytoplasmic tail?
- question: Does MUC16 binding to galectin-3 or siglecs contribute to its barrier or immunomodulatory
