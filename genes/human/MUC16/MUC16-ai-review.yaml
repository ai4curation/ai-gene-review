    label: Golgi lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1964501
  qualifier: located_in
  review:
    summary: Reactome mucin O-glycosylation reaction places the MUC16 ectodomain as substrate in the Golgi
      lumen.
    action: KEEP_AS_NON_CORE
    reason: MUC16 is heavily O-glycosylated, and mucin-type O-glycan initiation and elongation occur in
