- term:
    id: GO:0140297
    label: DNA-binding transcription factor binding
  evidence_type: IPI
  original_reference_id: PMID:35585237
  qualifier: enables
  supporting_entities:
  - UniProtKB:P23771
  review:
    summary: >-
      New annotation proposed. This is the informative molecular function that the three
      bare protein-binding rows are groping at, and it is the interaction the coregulator
      call rests on.
    action: NEW
    reason: >-
      BASU proximity proteomics of tagged AHDC1 in human hESCs recovers an interactome
      heavily enriched for zinc-finger transcription factors including the entire GATA
      family, with the zinc-finger and methyl-binding proteins mapping to the AT-hook end
      of the protein. GATA3 is the member taken forward functionally, and that evidence is
      independent of the proteomics: knockout cells resemble GATA3 mutants more than
      TFAP2A or TP63 mutants by RNA-seq, the two proteins co-regulate a significantly
      enriched set of 751 transcripts, and the transcriptional effect of GATA3
      over-expression is abolished in AHDC1 knockout cells while GATA3 expression,
      accessibility and DNA binding are themselves unchanged. GO:0140297 is defined as
      binding to a DNA-binding transcription factor, a protein that interacts with a
      specific DNA sequence within the regulatory region of a gene to modulate
      transcription, and GATA3 is such a factor by its own UniProt record, binding the
      consensus 5'-AGATAG-3'. The proposed accession P23771 is GATA3_HUMAN, reviewed
      Swiss-Prot, 443 aa, the canonical entry. Two caveats stated rather than buried:
      proximity labelling reports association within a labelling radius rather than direct
      contact, so this is an interaction claim at proximity resolution; and GO:0140297 is a
      verified descendant of GO:0005515, so this row specialises the class of the existing
      protein-binding rows even though it comes from a different experiment and a different
      partner. Evidence code IPI with a human partner accession, and the experiment was
      performed in human embryonic stem cells, so the species convention is satisfied.
      Coding the row off the GATA3 epistasis instead was considered and rejected: the
      epistasis is a genetic result about GATA3's dependence on AHDC1, which is IMP-shaped
      and would support a regulation term rather than a binding term. IPI on the proximity
      data, with the labelling-radius caveat stated, is the coding that matches what was
      measured; the epistasis is what makes the partner worth naming rather than what
      evidences the binding.
