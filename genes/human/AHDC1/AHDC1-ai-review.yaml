      to FLAG-tagged EGFP
  knowledge_gaps:
  - gap_statement: The molecular step connecting AHDC1 to reduced DNA methyltransferase activity
      remains unresolved.
    boundary: AHDC1 occupancy and its effects on expression, methylation, CTCF binding and chromatin
      contacts are experimentally established in differentiating hESCs.
