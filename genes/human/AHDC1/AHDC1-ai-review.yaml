core_functions:
- description: AHDC1 is a chromatin-associated transcription coregulator. In differentiating human
    embryonic stem cells it occupies active regulatory regions, associates with transcriptional and
    chromatin-regulatory complexes, and supports GATA3-dependent gene expression. This molecular
    role contributes to mesoderm maturation and subsequent tissue patterning. Loss of AHDC1 also
    changes local DNA methylation, CTCF occupancy and chromatin contacts, but whether these reflect
    a direct AHDC1 effector step or downstream transcriptional consequences remains unresolved.
    Independent human Ewing sarcoma experiments place AHDC1 in EWS-FLI1-containing complexes with
    effects on target-gene expression; the tumor-specific protein-stability mechanism is unresolved.
  molecular_function:
    id: GO:0003712
    label: transcription coregulator activity
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0000785
    label: chromatin
  supported_by:
  - *id008
  - *id005
  - *id004
