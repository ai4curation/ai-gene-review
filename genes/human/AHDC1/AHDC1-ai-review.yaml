knowledge_gaps:
- gap_statement: >-
    AHDC1's molecular function has been inferred entirely from cell-based genomics. The
    protein has never been purified, no in vitro activity of any kind has been measured on
    it, and no direct binary interaction with any partner has been demonstrated.
  boundary: >-
    The protein is detected at protein level and its cell biology is well described:
    induced occupancy of active promoters and enhancers by ChIP-seq in two lineages, a
    proximity interactome enriched for zinc-finger transcription factors and methyl-CpG
    readers, and a knockout phenotype spanning transcription, DNA methylation, CTCF
    occupancy, 3D contacts, mesoderm maturation and skin stratification in both human
    organoids and mouse embryos. Every one of those is a measurement on cells, not on the
    protein.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    This is the gap that produced the one over-annotation on the gene. With no biochemical
    handle, the molecular function was read off the protein's name and its ChIP-seq
    profile, giving a sequence-specific transcription factor term to a protein whose
    sequence specificity is supplied by its partners.
  resolution: >-
    Purify full-length AHDC1 or defined fragments and test DNA binding, partner binding and
    any looping activity in vitro; the AT-hook mutants suggested by the Xia-Gibbs missense
    cluster are the natural first constructs.
  provenance:
  - reference_id: PMID:34950897
    supporting_text: Despite the absence of an independent assay for AHDC1 protein function
      to corroborate potential functional consequences of rare variant genetic findings
  - reference_id: PMID:35585237
    supporting_text: Because no functional information exists for this locus
- gap_statement: >-
    Whether AHDC1 restrains DNA methylation by acting on the methylation machinery, or
    whether the hypermethylation is a downstream consequence of the transcriptional changes
    it causes, is unresolved, as is the ordering of the methylation, CTCF and looping
    effects.
  boundary: >-
    Established: knockout cells hypermethylate the elements that normally demethylate, have
    globally elevated DNMT activity without changed DNMT expression, lose CTCF at over
    2,700 sites, and lose contacts at those sites. The interactome contains UHRF1, TRIM28
    and EHMT1/2. Not established: any direct action of AHDC1 on a DNMT or on UHRF1, and any
    ordering of the three effects.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    The whole Xia-Gibbs mechanism rests on this chain, and the same question decides whether
    the gene belongs with the DNA-methylation regulators or with the architectural proteins.
  resolution: >-
    Acute degron depletion with methylation, CTCF ChIP-seq and HiChIP read out at short
    timepoints would order the events; a direct UHRF1 or DNMT1 binding and activity assay
    would test the authors' own speculation.
  provenance:
  - reference_id: PMID:35585237
    supporting_text: it remains elusive whether Gibbin acts directly on a DNMT protein, or
      if these effects are an indirect result of transcriptional changes
- gap_statement: >-
    GO cannot express "restrains cytosine methylation at cis-regulatory elements" at the
    granularity the data support, because the general regulation-of-DNA-methylation branch
    has been obsoleted without replacement.
  boundary: >-
    GO:0044030 regulation of DNA methylation is obsolete with an empty term_replaced_by and
    consider pointers to GO:0030234, a molecular function, and GO:0040029. GO:0006306 DNA
    methylation is obsolete as well. The surviving specific term, GO:0090310, is confined to
    heterochromatin formation and is excluded for this gene by the paper's H3K9me3 and
    HP1-alpha negative result. GO:0040029 epigenetic regulation of gene expression is usable
    and is what this review used, but it is a much broader statement.
  gap_kind:
  - ONTOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Any protein whose phenotype is a change in cytosine methylation at regulatory DNA
    without a heterochromatin component faces the same wall, so the loss of granularity is
    not specific to AHDC1.
  resolution: >-
    A GO request for a regulation term over cytosine DNA methylation at cis-regulatory
    regions, sibling to GO:0090310 rather than under it. Not filed from this gene's evidence
    alone, because AHDC1's own direct-versus-indirect question is unresolved and a term
    should be proposed from a case that can exemplify it cleanly.
- gap_statement: >-
    Why loss of Ahdc1 in mice produces obesity, reduced energy expenditure, insulin
    resistance and fatty liver is unknown, and nothing connects that physiology to the
    chromatin mechanism described in human cells.
  boundary: >-
    Established in mouse: a viable Ahdc1-deficient line is adipose from weaning and develops
    hyperleptinaemia, insulin resistance, abnormal glycolipid metabolism and fatty liver,
    supporting seven MGI IMP rows on Q6PAL7. Established in human cells: the chromatin and
    transcriptional mechanism. Nothing joins them, and no human metabolic annotation exists.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Xia-Gibbs individuals have body-weight phenotypes, so whether this is a conserved role
    of the gene matters clinically; and the seven mouse rows are the largest block of
    experimental annotation on this small gene family that has no human counterpart.
  resolution: >-
    Identify the AHDC1-dependent transcriptional programme in a metabolic tissue and test
    whether it overlaps the mesodermal programme; for curation, decide whether ISO transfer
    of the mouse metabolic terms to human is warranted.
  provenance:
  - reference_id: PMID:37819197
    supporting_text: Ahdc1 deficiency in both male and female mice led to adiposity from weaning
      and obesity
    full_text_unavailable: true
- gap_statement: >-
    AHDC1's GO record is thin because its literature is thin in one specific way: of the 28
    references in its UniProt entry, exactly one reports function.
  boundary: >-
    Parsing the RN and RP blocks of the UniProt record gives 28 references, all with PubMed
    identifiers, classified by their RP lines as 13 clinical genetics, 10 proteomics or
    PTM, 4 sequencing and 1 function. Only 2 of the 28 produced any GO annotation. The two
    remaining GOA publications are large yeast two-hybrid screens that UniProt does not cite
    at all.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    This is a coverage situation rather than an over-annotation situation, and saying so
    changes what should be done about it. Nine more Xia-Gibbs case series will not produce a
    molecular function; one biochemical paper would.
  resolution: >-
    Biochemistry on the purified protein, and a second independent functional study in a
    tissue other than skin.
  provenance:
  - reference_id: PMID:34950897
    supporting_text: Despite the absence of an independent assay for AHDC1 protein function
      to corroborate potential functional consequences of rare variant genetic findings
proposed_new_terms: []
suggested_questions:
- question: >-
    Does AHDC1 bind DNA at all, and if so with what preference? Two AT-hooks are annotated
    in UniProt without any evidence tag, no InterPro or Pfam signature detects either of
    them, and only one matches the canonical RGRP motif. Has anyone assayed purified
    protein?
- question: >-
    UniProt annotated the same publication's loss-of-function experiments as IDA on human
    AHDC1 and as IMP on mouse Ahdc1. Which is intended, and should the human rows for
    GO:0001707, GO:0043589, GO:0003700 and GO:0140585 be recoded?
- question: >-
    Ensembl Compara projects GO:0001707 and GO:0043589 from mouse Ahdc1 onto human AHDC1,
    where both terms already sit as direct annotations of the same publication, and projects
    GO:0003700 and GO:0140585 in the opposite direction. Should the pipeline suppress a
    transfer when donor and target share the supporting reference?
- question: >-
    Mouse Ahdc1 carries seven IMP rows from PMID:37819197 covering liver development, energy
    reserve metabolism, glycolipid metabolism, aerobic respiration, response to insulin,
    hormone metabolism and adipose tissue development. None reached human. Is that a
    deliberate restriction of the projected term set, or a gap?
- question: >-
    Is the AHDC1-ATXN1 interaction worth pursuing? It is the only AHDC1 partner reported by
    two independent laboratories, both proteins are nuclear, and ATXN1 is itself a
    chromatin-binding corepressor; but it is yeast two-hybrid only, and AHDC1's own
    proximity interactome does not recover it.
- question: >-
    Should GO acquire a regulation term for cytosine DNA methylation outside the
    heterochromatin branch? GO:0044030 was obsoleted without replacement and GO:0090310 is
    heterochromatin-specific, which leaves phenotypes like this one expressible only at the
    level of GO:0040029.
suggested_experiments:
- hypothesis: >-
    AHDC1 binds AT-rich DNA through its canonical AT-hook, and the Xia-Gibbs missense
    variants in that motif abolish the binding.
  experiment_type: in vitro DNA binding
  description: >-
    Express and purify full-length AHDC1 and an AT-hook-containing fragment spanning
    residues 520-620, and measure binding to AT-rich and control duplex DNA by
    electrophoretic mobility shift and fluorescence anisotropy. Include the Xia-Gibbs
    variants G548S and R549H, which fall inside the canonical AT-hook at 544-556, and the
    degenerate first hook at 396-408 as an internal negative control. This is the single
    experiment that would settle the molecular-function question.
- hypothesis: >-
    AHDC1 chromatin occupancy is driven by its zinc-finger partners rather than by its own
    AT-hooks.
  experiment_type: ChIP-seq of a structure-function mutant
  description: >-
    Repeat the ChIP-seq in hESCs with the canonical AT-hook mutated, to test whether
    chromatin occupancy depends on it or on the partners. If occupancy survives AT-hook
    loss, the coregulator reading is confirmed directly.
- hypothesis: >-
    The loss of chromatin contacts in AHDC1-null cells is secondary to hypermethylation and
    CTCF loss rather than to loss of a bridging activity.
  experiment_type: acute degron depletion time course
  description: >-
    Degron-tag endogenous AHDC1 and deplete it acutely, reading out CTCF ChIP-seq, cohesin
    HiChIP and DNA methylation at 2, 6 and 24 hours. Ordering the three effects distinguishes
    AHDC1 acting on chromatin architecture directly from AHDC1 acting through methylation.
- hypothesis: >-
    AHDC1 restrains maintenance methylation by binding UHRF1 or DNMT1 directly, as the
    authors speculate.
  experiment_type: in vitro binding and methyltransferase assay
  description: >-
    Test direct binding of AHDC1 to UHRF1 and DNMT1 with purified components, and measure
    whether AHDC1 inhibits DNMT1 maintenance methylation in vitro.
- hypothesis: >-
    The AHDC1-GATA3 association detected by proximity labelling reflects a genuine physical
    association at endogenous levels.
  experiment_type: co-immunoprecipitation and proximity ligation
  description: >-
    Reciprocal co-immunoprecipitation of endogenous AHDC1 and GATA3 from differentiating
    hESCs, plus an in situ proximity ligation assay, to upgrade the GATA3 interaction from
    proximity labelling to a validated physical association.
- hypothesis: >-
    The mouse metabolic phenotype reflects the same chromatin mechanism acting in a
    different lineage.
  experiment_type: tissue-specific ChIP-seq and RNA-seq
  description: >-
    Profile AHDC1 occupancy and AHDC1-dependent transcription in a metabolic tissue such as
    liver or adipose, in the published Ahdc1-deficient mouse, to test whether the mesodermal
    chromatin mechanism explains the metabolic phenotype or whether that is a separate role.
