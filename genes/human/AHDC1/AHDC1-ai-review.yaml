suggested_questions:
- question: Does AHDC1 itself recognize a DNA sequence or chromatin feature, or is its
    regulatory-region occupancy mediated predominantly by associated proteins?
- question: Which physical interaction connects AHDC1 to DNA methyltransferase regulation, and can
    the proposed UHRF1-dependent mechanism be separated from downstream transcriptional effects?
- question: Does AHDC1 directly bridge regulatory regions, or does it stabilize their contacts
    through CTCF, methylation control or other chromatin factors?
- question: How do truncation-specific effects and changes in effective AHDC1 dosage contribute to
    Xia-Gibbs syndrome across tissues?
suggested_experiments:
- description: Compare purified AHDC1 or validated folded fragments across DNA sequences and
    nucleosome substrates, with competition and binding-defective controls, to distinguish intrinsic
    recognition from cellular complex recruitment.
- description: Use acute AHDC1 depletion and separation-of-function rescue alongside nascent
    transcription, locus-specific methylation, CTCF occupancy and contact measurements to establish
    causal order before secondary differentiation changes.
