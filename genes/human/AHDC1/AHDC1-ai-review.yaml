id: Q5TGY3
gene_symbol: AHDC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AHDC1 encodes Gibbin, a large (1,603-residue), largely intrinsically disordered nuclear
  protein of metazoans with no catalytic domain and no recognised fold beyond a family
  signature and a domain of unknown function. In human embryonic stem cells induced to
  differentiate with retinoic acid and BMP4 it occupies active promoters and enhancers,
  and it behaves as a chromatin-associated regulator of lineage gene expression rather
  than as a classical sequence-specific transcription factor: its occupancy is not
  restricted to the genes whose expression depends on it, and the sequence specificity in
  the system is supplied by the dozens of zinc-finger transcription factors, the entire
  GATA family among them, and methyl-CpG-binding proteins with which it associates. Loss
  of the protein alters roughly 1,100 transcripts, hypermethylates the cis-regulatory
  elements that would normally lose methylation during lineage commitment, raises
  DNA-methyltransferase activity, lowers CTCF occupancy and weakens the promoter-enhancer
  chromatin contacts anchored at the genes it controls, while leaving global chromatin
  accessibility, compartmentalisation and constitutive heterochromatin essentially
  untouched. The developmental consequence is a failure of mesoderm maturation:
  mesodermal progenitors are depleted, the dermal compartment of skin organoids does not
  mature, and the signalling it would normally send to the overlying epidermis is lost,
  so keratinocytes stratify poorly even though they are themselves genetically
  unperturbed. Mouse embryos mosaic for Gibbin mutations show craniofacial defects, open
  ventral walls and unstratified, poorly attached skin, and heterozygous or homozygous
  mutants do not survive birth. Two AT-hook motifs are annotated in the sequence, one of
  them canonical, and disease-associated missense variants cluster in and around the
  second; the protein has never been purified and no direct DNA-binding measurement on it
  has been reported. Heterozygous de novo truncating variants cause Xia-Gibbs syndrome,
  an intellectual-disability syndrome with hypotonia, expressive-language delay, sleep
  apnoea and variable craniofacial, skeletal and skin features.
