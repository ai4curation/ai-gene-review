- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: IDA
  original_reference_id: PMID:35585237
  qualifier: enables
  review:
    summary: Chromatin-associated transcription coregulation is supported; intrinsic motif
      recognition remains unresolved.
    action: MODIFY
    reason: The full PMID:35585237 study shows tagged AHDC1 occupancy at regulatory chromatin, BASU
      proximity to transcription/chromatin complexes, and a requirement for GATA3-induced
      transcription. Together these support a coregulatory role, including action through a complex,
      as defined by GO:0003712. GO:0003700 additionally requires selective binding to a specific DNA
      sequence; the examined ChIP and perturbation assays do not isolate that property of AHDC1
      itself. Broad occupancy does not disprove sequence preference. The hESC ChIP used an inducible
      tagged transgene and a 5% 1,6-hexanediol pretreatment for 60 seconds; the effects of that
      treatment on particular AHDC1 contacts were not measured. The independent ENCODE HepG2
      experiment uses a CRISPR-inserted endogenous-locus tag, not an untagged antibody assay. Both
      datasets support chromatin association without resolving intrinsic DNA recognition. The study
      includes motif analysis of GATA3 peaks, which does not establish an AHDC1 motif.
