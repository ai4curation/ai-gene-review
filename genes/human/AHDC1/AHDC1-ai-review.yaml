- term:
    id: GO:1902275
    label: regulation of chromatin organization
  evidence_type: IMP
  original_reference_id: PMID:35585237
  qualifier: involved_in
  review:
    summary: >-
      New annotation proposed. This is the claim the HiChIP knockout actually supports, and
      it is the replacement for the withdrawn loop-anchoring molecular function.
    action: NEW
    reason: >-
      Cohesin HiChIP comparing wild-type and AHDC1 knockout hESCs shows a reduced number
      and size of chromatin contacts, with the lost contacts preferentially anchored at the
      promoters of AHDC1-dependent genes and de novo contacts appearing at de-repressed
      genes in positions that overlap no previously defined chromatin mark. The effect is
      specific rather than global: domain organisation, insulation, contact probability and
      compartmentalisation are essentially unchanged, as is chromatin accessibility by
      ATAC-seq. GO:1902275 is defined as any process that modulates chromatin organization,
      sits directly under GO:0051128 regulation of cellular component organization, and
      makes no mechanistic commitment, which is what is wanted here, given that whether
      AHDC1 acts on the contacts directly or through the methylation-CTCF switch is exactly
      the open question recorded on the GO:0140585 row. It is not a duplicate of GO:0040029:
      the two were checked and neither is an ancestor of the other, and they rest on
      different experiments, HiChIP versus methylation arrays. Evidence code IMP, human
      knockout.
