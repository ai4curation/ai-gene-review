- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to
    orthologs using Ensembl Compara
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      The transfer is mechanically correct and the donor is a genuine 1:1 ortholog
      (Q6PAL7, mouse Ahdc1, reviewed Swiss-Prot, 1594 aa against 1603 aa). It is
      nonetheless circular in substance: QuickGO shows the donor holds both transferred
      terms by IMP from PMID:35585237, the same publication from which human AHDC1
      already holds them directly.
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology
    links
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly executed inter-ontology inference, but it inherits whatever the molecular
      function row asserts. QuickGO ancestor closure over is_a and part_of confirms
      GO:0003700 has GO:0006355 among its ancestors while GO:0003712 does not, so this
      row's basis does not survive the molecular-function correction proposed here.
- id: PMID:16713569
  title: A protein-protein interaction network for human inherited ataxias and disorders
    of Purkinje cell degeneration.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      A 54-bait ataxia yeast two-hybrid interactome. AHDC1 appears only as a prey of
      ATXN1. Correctly cited for a physical interaction; carries no information about
      AHDC1's function. PubMed lists one CommentsCorrections entry, a CommentIn Cell
      Preview (PMID:16713557), which is not a correction.
- id: PMID:32814053
  title: Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins
    and Uncovers Widespread Protein Aggregation in Affected Brains.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      A ~500-bait neurodegeneration yeast two-hybrid interactome. Correctly cited, but
      IntAct logs its single AHDC1-HTT experiment (EBI-25827495) twelve times under three
      sub-method names, which is what inflates UniProt's NbExp=12 into a twelvefold
      overstatement of replication.
- id: PMID:33644933
  title: Phenotypic and protein localization heterogeneity associated with AHDC1 pathogenic
    protein-truncating alleles in Xia-Gibbs syndrome.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Deep-phenotyped Xia-Gibbs cohort plus eGFP and mCherry fusion localisation of
      wild-type and truncated AHDC1 in HeLa and 293T. The localisation is ectopic and
      tagged, but it is corroborated independently by HPA immunofluorescence and by
      ChIP-seq occupancy, so the nuclear call is secure.
- id: PMID:34950897
  title: AHDC1 missense mutations in Xia-Gibbs syndrome.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The source of the claim that the AT-hooks matter. It is a variant-clustering
      argument, not a biochemical one, and the paper says so explicitly, noting the
      absence of any independent assay for AHDC1 protein function. Cited here to delimit
      what the AT-hook evidence is and is not.
- id: PMID:35585237
  title: Gibbin mesodermal regulation patterns epithelial development.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The only functional study of the protein, and the source of five of the fifteen GOA
      rows. Read in full. Every DNA-side claim rests on ChIP-seq of a tagged inducible
      transgene and on knockout phenotypes; the protein has not been purified and no
      binding assay on it is reported, which is the basis for the molecular-function
      correction in this review. No retraction, erratum or expression of concern
      (CommentsCorrections read from the PubMed record).
- id: PMID:37819197
  title: Ahdc1 is a potent regulator of obesity and energy metabolism.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Mouse only. Supports seven MGI IMP rows on Q6PAL7 that have no human counterpart and
      that Ensembl Compara did not project. Cited in this review to record the gap, not to
      support a human annotation: the correct human code would be ISO or ISS, and the
      mechanism linking a nuclear chromatin regulator to whole-animal energy expenditure
      is unknown.
- id: PMID:33814344
  title: 1,6-Hexanediol, commonly used to dissolve liquid-liquid phase separated condensates,
    directly impairs kinase and phosphatase activities.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Methodology reference, not an AHDC1 reference, and it ended up doing more than it was
      brought in to do. It was added to hedge the claim that surviving a 1,6-hexanediol
      pre-treatment argues against condensate co-precipitation; reading it properly
      refutes that claim instead. It reports at least 7.5 percent is needed to dissolve
      phase-separated GST-CTD in vitro, and that kinase inhibition already applies at
      concentrations where condensates are not yet dissolved. The Gibbin ChIP used 5
      percent, below that threshold, so the condensate-control reading was withdrawn rather
      than hedged. Looked up in PubMed and cached rather than recalled. Scope actually
      cited: only the kinase/phosphatase and dissolution-threshold results, which are what
      this paper measured. A broader claim about hexanediol altering chromatin compaction
      was in an earlier draft and was dropped rather than left unsourced, since no citation
      for it was found.
- id: PMID:24791903
  title: De novo truncating mutations in AHDC1 in individuals with syndromic expressive
    language delay, hypotonia, and sleep apnea.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The founding Xia-Gibbs report. Establishes that the gene matters; establishes
      nothing about the protein's molecular function. Cited for the disease statement in
      the description only.
existing_annotations:
- term:
    id: GO:0001707
    label: mesoderm formation
  evidence_type: IDA
  original_reference_id: PMID:35585237
  qualifier: involved_in
  review:
    summary: >-
      Correct process, well supported by the human knockout. The evidence code should be
      IMP rather than IDA, and UniProt itself used IMP for the same experiment class from
      the same paper on the mouse ortholog.
    action: ACCEPT
    reason: >-
      Two CRISPR loss-of-function hESC clones were differentiated with RA and BMP4, and
      single-cell RNA-seq showed the PDGFRA-positive mesodermal population and its marker
      genes severely reduced, with the effect visible from day 3. That is mesoderm
      formation in a human system, so the term stands. The evidence code is the one
      defect: a gene knockout is a mutant phenotype, so the correct code is IMP. This is
      not a judgement call about how to read the assay, because QuickGO shows UniProt
      annotated the very same paper's mosaic CRISPR mouse data to the very same term on
      Q6PAL7 as IMP. Same paper, same perturbation class, two different codes across two
      species. Flagged rather than actioned, because it changes no term and the review
      schema has no way to propose an evidence-code change on an existing row.
    supported_by:
    - reference_id: PMID:35585237
      supporting_text: Single cell RNA sequencing (scRNA-seq) confirmed that mesodermal (PDGFRA+)
        cells as well as individual gene markers for that cluster were severely diminished
        in the GKO
    - reference_id: PMID:35585237
      supporting_text: we created two CRISPR loss of function mutant hESC clones
- term:
    id: GO:0001707
    label: mesoderm formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6PAL7
  - ensembl:ENSMUSP00000101535
  review:
    summary: >-
      Correct term, genuine ortholog, and completely circular provenance: the donor holds
      this term by IMP from the same publication that already gives human AHDC1 its own
      direct annotation to it.
    action: ACCEPT
    reason: >-
      Resolving the WITH/FROM field gives Q6PAL7 = AHDC1_MOUSE, reviewed Swiss-Prot, 1594
      aa against the human 1603 aa, a true 1:1 ortholog and not a paralog, so there is no
      WRONG_ORTHOLOG_OR_PARALOG problem here. Querying the donor's own evidence is what
      exposes the issue: QuickGO shows mouse Ahdc1 carries GO:0001707 by IMP from
      PMID:35585237, which is the same paper behind the human IDA row above. Ensembl
      Compara has therefore projected a mouse annotation of one publication onto a human
      gene that already carries a direct annotation of that same publication. The pipeline
      runs the other way too, giving mouse Ahdc1 GO:0003700 and GO:0140585 as
      GO_REF:0000107 transfers from the human rows. The term is right and the gene really
      does this, so the row is kept rather than removed, but it must not be counted as
      independent corroboration of the human IDA. Note on this row's supporting quotes:
      they are deliberately the human mesoderm result rather than a mouse phenotype,
      because what this row needs evidenced is that the target already holds the term from
      this publication - which is what makes the transfer redundant. An earlier draft
      quoted perinatal lethality here, which speaks to neither mesoderm formation nor
      circularity.
    supported_by:
    - reference_id: PMID:35585237
      supporting_text: Single cell RNA sequencing (scRNA-seq) confirmed that mesodermal (PDGFRA+)
        cells as well as individual gene markers for that cluster were severely diminished
        in the GKO
    - reference_id: PMID:35585237
      supporting_text: Gibbin effects on the mesoderm were apparent as early as day 3 of RA/BMP4
    propagation_review:
      root_cause: EVIDENCE_CIRCULAR_OR_REDUNDANT
      failure_modes:
      - CIRCULAR_PROPAGATION
      source_entities:
      - source_id: UniProtKB:Q6PAL7
        source_label: mouse Ahdc1 (AHDC1_MOUSE, reviewed Swiss-Prot, 1594 aa)
        source_status: CIRCULAR_OR_REDUNDANT
        comment: >-
          Holds GO:0001707 by IMP from PMID:35585237, the same publication that supports
          the target's own IDA row. Sound annotation, redundant transfer.
      - source_id: ensembl:ENSMUSP00000101535
        source_label: Ensembl mouse protein for Ahdc1
        source_status: CIRCULAR_OR_REDUNDANT
        comment: >-
          The Ensembl protein identifier for the same mouse gene product as Q6PAL7. It is
          the pipeline's handle on the ortholog, not a second independent source.
- term:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  evidence_type: IDA
  original_reference_id: PMID:35585237
  qualifier: enables
  review:
    summary: >-
      The single over-reaching row on this gene. The term requires selective binding to a
      specific DNA sequence motif; nothing in the cited paper measures sequence-specific
      binding, and the paper's own data and model place the sequence specificity in
      AHDC1's zinc-finger partners. Replace with transcription coregulator activity.
    action: MODIFY
    reason: >-
      GO:0003700 is defined as a transcription regulator activity that modulates
      transcription of gene sets via selective and non-covalent binding to a specific
      double-stranded genomic DNA sequence, sometimes referred to as a motif, within a
      cis-regulatory region. Four things argue against it here. First, the only DNA-side
      experiment in the cited paper is ChIP-seq of a stably introduced, inducible, tagged
      transgene; the protein has never been purified and no gel shift, anisotropy, SELEX
      or de novo motif call appears anywhere in the paper. Second, the authors state
      outright that occupancy is not restricted to the loci the protein regulates, which
      is the opposite of what a sequence-specific regulator's binding profile looks like.
      Third, the paper's own model puts the motif recognition in the partners: enhancer-
      and promoter-bound Gibbin interacts with dozens of sequence-specific zinc-finger
      transcription factors, and consistent with this only about ten percent of Gibbin
      sites overlap GATA3 sites while the two proteins sit at typical promoter-enhancer
      separations. Fourth, the sequence offers no basis for the stronger claim: the two
      UniProt-annotated AT-hooks are the only DNA-binding elements, an AT-hook engages the
      minor groove of AT-rich DNA without sequence specificity, and only one of the two is
      canonical - KRKRGRPPKNLLL at 544-556 carries the invariant RGRP core, which occurs
      exactly once in the whole 1603-residue sequence, while RRKAGRGRKADAG at 396-408 has
      GRGRK and no proline. Neither DNA_BIND feature carries an evidence tag, and InterPro
      detects no AT-hook signature on this protein at all: the only two entries that match
      are IPR032757 (a domain of unknown function) and IPR039225 (the family), and neither
      carries any GO term, so the absence of a GO_REF:0000002 InterPro2GO row on this gene
      was checked rather than overlooked - there is no domain- or family-level inference
      here for the manual IDA to be confused with. GO:0003712 transcription
      coregulator activity is defined as modulating transcription via binding to a
      DNA-binding transcription factor at a specific genomic locus, either alone or as
      part of a complex, which is precisely what the interactome and the GATA3 epistasis
      demonstrate. It is a sibling of GO:0003700 under GO:0140110, so this is a lateral
      correction within the transcription-regulator branch rather than a demotion to a
      parent. Chromatin occupancy is not lost by this change; it is recorded separately as
      GO:0003682 below. For the record, the evidence code on the replacement should be IMP
      or IPI rather than IDA, since the supporting experiments are a knockout and a
      proximity-labelling interactome. On the transgene: the methods describe a
      doxycycline-inducible, HA-tagged Gibbin cDNA delivered on a PiggyBac vector and
      induced for 24 hours before crosslinking, and the paper nowhere compares the
      resulting protein level to endogenous AHDC1. So the accurate description is ectopic,
      epitope-tagged expression from a heterologous promoter at an unmeasured level - not
      "over-expression", which would be an inference rather than a reported property of the
      experiment. That limitation is deliberately weighted differently here than on the
      GO:0003682 row below, and the asymmetry is principled rather than convenient. Ectopic
      expression from a heterologous promoter bears heavily on WHICH sites are occupied,
      because a chromatin protein present at a level its own promoter does not set will
      sample sites the endogenous protein need not - and site specificity is exactly what
      GO:0003700 asserts. It bears much less on
      WHETHER the protein associates with chromatin at all, which is all GO:0003682 asserts.
      So the same experimental limitation is load-bearing against the specificity claim and
      secondary against the association claim. It is in any case not the load-bearing
      objection on this row: the four arguments above stand even if the transgene were
      endogenous, since no purified protein was ever assayed, no motif was called, the
      occupancy is explicitly unrestricted, and the sequence offers only AT-hooks. A fifth
      argument belongs here and is recorded on the GO:0003682 row as well, since it bears on
      both: the Gibbin ChIP-seq alone among the ChIPs in that paper pre-treated cells with 5
      percent 1,6-hexanediol for 60 seconds before crosslinking, so the peak set is a
      filtered one - whatever occupancy depended on the weak multivalent interactions that
      hexanediol disrupts was removed before anything was crosslinked. Whichever mechanism
      one attributes to the reagent, a map collected after a disruptive pre-treatment is not
      a map from which site specificity can be read.
    proposed_replacement_terms:
    - id: GO:0003712
      label: transcription coregulator activity
    supported_by:
    - reference_id: PMID:35585237
      supporting_text: we stably introduced an inducible, tagged Gibbin transgene to perform
        ChIP-seq in hESCs
    - reference_id: PMID:35585237
      supporting_text: Interestingly, Gibbin DNA binding itself does not appear to be sufficient
        to drive gene expression, as ChIP-seq signal was not restricted to the mesoderm lineage
        or to Gibbin-regulated loci
    - reference_id: PMID:35585237
      supporting_text: Mass spectrometry revealed that the Gibbin interactome was heavily
        enriched for chromatin modifying complexes, enhancer binding proteins, and zinc finger
        TFs including the entire GATA family
    - reference_id: PMID:35585237
      supporting_text: only around 10% of Gibbin binding sites are directly overlapped with
        GATA3 binding sites both genome-wide and at mesoderm loci
    - reference_id: PMID:35585237
      supporting_text: indicating that Gibbin is an important effector of GATA3 activity
    knowledge_gaps:
    - gap_statement: >-
        It is unknown whether AHDC1 binds DNA directly at all. No purified or recombinant
        AHDC1 has been assayed against DNA, so neither the affinity nor the specificity of
        either annotated AT-hook has ever been measured.
      boundary: >-
        Established: tagged AHDC1 occupies active promoters and enhancers in
        differentiating hESCs and in HepG2; the occupancy is induced by RA and BMP4; and
        Xia-Gibbs missense variants cluster in and around the canonical AT-hook. Missing:
        any in vitro measurement on the protein itself. The relevant paper says the same,
        noting the absence of an independent assay for AHDC1 protein function.
      gap_kind:
      - BIOLOGY
      dark_aspect: MF_DARK
      status: OPEN
      significance: >-
        The distinction decides between two very different molecular functions - a
        DNA-binding factor recruited by its own motif preference, and a coregulator
        recruited by its zinc-finger and methyl-CpG-reader partners - and the existing GO
        molecular-function row asserts the first without evidence.
      resolution: >-
        Assay purified full-length AHDC1 and AT-hook peptides against AT-rich and control
        duplexes, and repeat the ChIP-seq with the canonical AT-hook mutated, ideally at
        the two Xia-Gibbs residues G548 and R549.
      provenance:
      - reference_id: PMID:35585237
        supporting_text: We speculate that this regulation occurs through Gibbin DNA binding
      - reference_id: PMID:34950897
        supporting_text: Despite the absence of an independent assay for AHDC1 protein function
          to corroborate potential functional consequences of rare variant genetic findings
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16713569
  qualifier: enables
  supporting_entities:
  - UniProtKB:P54253
  review:
    summary: >-
      Better supported than a screen hit. This publication contributes two IntAct records
      that map the AHDC1-binding region of ATXN1 to its C-terminus and specifically to the
      AXH domain, and ATXN1 is the one AHDC1 partner seen by two independent laboratories.
      Kept, but not core, and the term itself remains uninformative.
    action: KEEP_AS_NON_CORE
    reason: >-
      P54253 resolves to ATX1_HUMAN, reviewed Swiss-Prot, 815 aa, the canonical entry, so
      there is no truncated-clone or TrEMBL substitution here. Expanding all 73 IntAct
      records for Q5TGY3 (two of which are RNA-level and carry no protein participant)
      gives five ATXN1 entries across two publications. This publication contributes two of
      them, both detection method "2 hybrid" (MI:0018), and they differ from each other in
      a way that matters: one carries featureRange 528-815 labelled "c terminal" and the
      other 557-699 labelled "axh region", both with featureType "sufficient to bind". So
      the deposited data are not a bare yes/no screen call but a fragment mapping of the
      AHDC1-binding region onto ATXN1's AXH domain, the module through which ATXN1 binds
      CIC and other partners. No feature is mapped on the AHDC1 side in any ATXN1 record.
      That, plus independent replication by a second laboratory, is why this is kept rather
      than marked over-annotated. It is not core: everything is yeast two-hybrid in a
      Saccharomyces cerevisiae host with over-expressed constructs, MI score 0.67, no
      orthogonal assay exists, no functional consequence of the interaction has been tested,
      and AHDC1's own proximity interactome does not recover ATXN1. Per the project's
      curation guidance bare protein binding is not an informative molecular function, and
      there is no evidenced informative term to modify this to; the informative
      interaction-derived function for this gene is GO:0140297, proposed below from a
      different experiment and a different partner.
    supported_by:
    - reference_id: PMID:16713569
      supporting_text: protein-protein interactions using a stringent yeast two-hybrid screen
      full_text_unavailable: true
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32814053
  qualifier: enables
  supporting_entities:
  - UniProtKB:P42858
  review:
    summary: >-
      UniProt reports NbExp=12 for this partner. Expanding IntAct shows the twelve records
      are four HTT bait constructs multiplied by three yeast two-hybrid sub-method labels,
      from one publication, with no orthogonal assay - so the count is inflated threefold
      by the sub-method labelling, and the remaining variation is the screen's standard
      bait panel rather than independent confirmation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      P42858 resolves to HD_HUMAN, reviewed Swiss-Prot, 3142 aa, the canonical huntingtin
      entry. The twelve IntAct records decompose exactly as 4 x 3: four distinct HTT
      constructs - a C-terminal fragment 1932-2642, HTT 1-511 carrying Gln18[49], an exon-1
      series carrying Gln18 at 17, 20, 23, 49, 51 and 79, and HTT 1-504 carrying Gln18[23]
      and Gln18[80] - each logged three times as "validated two hybrid", "two hybrid array"
      and "two hybrid pooling" (MI:1356, MI:0397, MI:0398). Every record is in a
      Saccharomyces cerevisiae host with MI score 0.56, and all twelve come from the single
      publication cited. So NbExp=12 overstates replication threefold through sub-method
      labelling, which is the third occurrence of that pattern in this campaign after ACRV1
      and ADAMTSL5; the remaining fourfold variation is the screen's standard huntingtin
      bait panel applied to every prey, not a mapping performed on this pair. Two details
      cut the other way and are recorded rather than suppressed: IntAct curates the
      1932-2642 fragment as "sufficient to bind", and it curates some polyQ lengths as
      "mutation disrupting strength" and others as "mutation with no effect", so the
      readout is graded rather than binary. Against that: HTT carries 1,216 distinct IntAct
      partners against AHDC1's 45, the panel design means the constructs test huntingtin
      rather than AHDC1, no region is mapped on the AHDC1 side of any record, only one
      laboratory has seen the pair, and nothing has tested whether the two proteins do
      anything together. Marked over-annotated rather than removed, because it is an
      experimental IPI row and the interaction may well occur; it is the weakest of the
      three protein-binding rows on this gene, and it is the only one of the three not
      replicated across laboratories.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: generated by systematic yeast two-hybrid interaction screening
      full_text_unavailable: true
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32814053
  qualifier: enables
  supporting_entities:
  - UniProtKB:P54253
  review:
    summary: >-
      The second, independent laboratory to see the AHDC1-ATXN1 pair, here against a
      polyglutamine-expanded ATXN1. Genuine cross-laboratory replication, so kept; but
      three sub-method labels on one construct, and still an uninformative term on an
      untested interaction.
    action: KEEP_AS_NON_CORE
    reason: >-
      Judged separately from the HTT row in the same publication, since the campaign
      requires per-partner verdicts and the two resolve differently. This publication
      contributes three of the five ATXN1 records, and they differ from one another only in
      detection-method label - "validated two hybrid", "two hybrid array" and "two hybrid
      pooling" - while all three carry the same ATXN1 construct, featureShortLabel
      P54253:p.Gln225[50], featureType "mutation causing". So within this publication the
      apparent triplication is sub-method labelling, exactly as for HTT. What makes the
      ATXN1 pair different from the HTT pair is the other publication: PMID:16713569 is a
      separate laboratory using a different detection method (MI:0018) and contributing
      fragment mapping rather than a bait-panel call. Two laboratories, plus the topological
      plausibility of the pair - ATXN1 is itself a chromatin-binding transcriptional
      corepressor and both proteins are nuclear - are why this is kept rather than marked
      over-annotated. It is not core: every observation is yeast two-hybrid with
      over-expressed constructs, no orthogonal assay exists, no functional consequence has
      been tested, and neither AHDC1's own functional paper nor its proximity interactome
      recovers ATXN1. Bare protein binding remains the wrong level of claim, and there is
      no evidenced informative term to modify it to.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: generated by systematic yeast two-hybrid interaction screening
      full_text_unavailable: true
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:33644933
  qualifier: is_active_in
  review:
    summary: >-
      Well supported and corroborated three independent ways: tagged-construct
      immunofluorescence, HPA antibody staining, and chromatin occupancy by ChIP-seq. The
      is_active_in qualifier is justified because the gene's measured activity is on
      chromatin.
    action: ACCEPT
    reason: >-
