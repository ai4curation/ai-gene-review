id: Q5TGY3
gene_symbol: AHDC1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AHDC1 encodes Gibbin, a 1,603-residue nuclear protein containing annotated AT-hook
  motifs and conserved regions including DUF4683. It associates with transcriptional regulators and
  chromatin and helps establish developmental gene-expression programs. In
  retinoic-acid/BMP4-induced human embryonic stem-cell differentiation, AHDC1 occupies active
  promoters and enhancers and supports GATA3-dependent transcription. Its loss alters local DNA
  methylation, CTCF occupancy and chromatin contacts, with impaired mesoderm maturation and
  non-cell-autonomous defects in epidermal differentiation. The molecular connection between AHDC1
  and DNA methyltransferase activity remains unresolved, as do its intrinsic DNA-sequence
  preferences and any direct loop-bridging activity. Heterozygous pathogenic variants cause
  Xia-Gibbs syndrome, characterized by developmental and speech delay, intellectual disability,
  hypotonia and variable additional features. Patient-derived truncations can alter intranuclear
  localization; the relative contributions of reduced dosage and variant-specific effects remain
  under investigation.
