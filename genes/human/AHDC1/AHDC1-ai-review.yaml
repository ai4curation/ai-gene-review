core_functions:
- description: >-
    The partner-facing arm: a transcription coregulator that works through
    sequence-specific DNA-binding transcription factors. AHDC1 is recruited to active
    promoters and enhancers only after differentiation is triggered, and there it associates
    with dozens of zinc-finger transcription factors - the whole GATA family among them -
    and with methyl-CpG-binding proteins. The sequence specificity belongs to those
    partners: AHDC1's own occupancy is not restricted to the genes it regulates, and its
    only DNA-binding elements are two AT-hook motifs, which read the minor groove of
    AT-rich DNA without sequence preference and have never been assayed. Its transcriptional
    output is large, roughly 1,100 genes in differentiating human embryonic stem cells, and
    it acts as an effector of GATA3 rather than as a modifier of GATA3 itself, since GATA3's
    own expression, accessibility and DNA binding are unchanged when AHDC1 is lost. This
    entry is deliberately confined to the coregulator activity and its immediate
    transcriptional output; the chromatin-state arm and the developmental outcomes are the
    second entry.
  molecular_function:
    id: GO:0003712
    label: transcription coregulator activity
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005654
    label: nucleoplasm
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:35585237
    supporting_text: Mass spectrometry revealed that the Gibbin interactome was heavily enriched
      for chromatin modifying complexes, enhancer binding proteins, and zinc finger TFs including
      the entire GATA family
  - reference_id: PMID:35585237
    supporting_text: Interestingly, Gibbin DNA binding itself does not appear to be sufficient
      to drive gene expression, as ChIP-seq signal was not restricted to the mesoderm lineage
      or to Gibbin-regulated loci
  - reference_id: PMID:35585237
    supporting_text: indicating that Gibbin is an important effector of GATA3 activity
  - reference_id: PMID:35585237
    supporting_text: By RNA-seq, expression of ~1,100 transcripts were significantly altered
      in the Gibbin KO (GKO) compared to wildtype (WT)
- description: >-
    The DNA-facing arm: chromatin binding that maintains the regulatory state of mesodermal
    cis-regulatory elements. This is separated from the first entry because it rests on a
    different molecular activity and on different experiments - ChIP-seq for the binding,
    methylation arrays and cohesin HiChIP for the outputs - rather than on the
    protein-protein interactions that carry the coregulator call. Loss of AHDC1 lets the
    elements it occupies hypermethylate instead of demethylating during lineage commitment,
    raises DNA methyltransferase activity, lowers CTCF occupancy at thousands of sites, and
    weakens the promoter-enhancer contacts anchored at the genes it controls, while leaving
    accessibility, compartmentalisation and constitutive heterochromatin intact. The two
    developmental terms are recorded here as the organism-level outcomes of that chromatin
    role, and their causal distance differs: mesoderm formation is the direct readout, since
    mesodermal progenitors are depleted in the knockout, whereas skin morphogenesis is
    reached non-cell-autonomously - the dermis fails to mature, dermal-to-epidermal
    signalling is lost, and keratinocytes stratify poorly even though they are themselves
    unperturbed, which is why this review declines to annotate keratinocyte differentiation.
