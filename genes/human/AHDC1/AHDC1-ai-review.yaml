- term:
    id: GO:0140585
    label: promoter-enhancer loop anchoring activity
  evidence_type: IDA
  original_reference_id: PMID:35585237
  qualifier: enables
  review:
    summary: >-
      The loop phenotype is real; AHDC1 being the physical bridge is not demonstrated. The
      term asserts bridging as a molecular function, while the paper's own model routes the
      loop effect through DNA methylation and CTCF.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0140585 is defined as bridging together two cis-regulatory elements, colloquially
      referred to as promoters and/or enhancers, holding two loop anchors together to
      maintain a chromatin loop. Three observations support a weaker claim than that.
      First, the evidence is a knockout: cohesin HiChIP in the Gibbin knockout shows an
      overall reduced number and size of chromatin contacts, with lost contacts anchored at
      Gibbin-dependent promoters, which establishes that the protein is required for those
      contacts, not that it holds them together. Second, the proximity of AHDC1 and GATA3
      on DNA is offered by the authors only as a suggestion, not as a measurement of
      bridging. Third, and most tellingly, the paper's own mechanism is indirect: they
      report increased DNA methyltransferase activity, hypermethylation at the very sites
      that normally demethylate, and decreased CTCF binding at over 2,700 sites in the
      knockout, and they frame the loop loss as the downstream consequence of that
      methylation-CTCF switch. No experiment separates AHDC1-as-bridge from
      AHDC1-as-upstream-regulator-of-the-bridge. Marked over-annotated rather than removed:
      the term is not contradicted, and a curator with the full text could reasonably have
      made this call. GO:0140588 chromatin looping was considered as a biological-process
      replacement and rejected on its definition, which describes loading of an SMC-family
      extrusion motor and chromatin extrusion, a mechanism AHDC1 has no part in. The claim
      the knockout does support is recorded instead as GO:1902275 below.
    supported_by:
    - reference_id: PMID:35585237
      supporting_text: However, we observed an overall reduced number and size of chromatin
        contacts in the GKO
    - reference_id: PMID:35585237
      supporting_text: Lost chromatin contacts tended to be anchored at Gibbin-dependent gene
        promoters
    - reference_id: PMID:35585237
      supporting_text: we observed a striking loss of chromatin contact signal at CTCF binding
        sites in GKO cells
    - reference_id: PMID:35585237
      supporting_text: By ChIP-seq, we also found decreased CTCF binding at over 2,700 sites
    knowledge_gaps:
    - gap_statement: >-
        Whether AHDC1 physically bridges two cis-regulatory elements, or merely maintains
        the DNA methylation and CTCF state that lets other proteins bridge them, is
        undetermined.
      boundary: >-
        Established: AHDC1 occupies promoters and enhancers; its loss reduces the number
        and size of cohesin HiChIP contacts and does so preferentially at the promoters of
        the genes it regulates; its loss also hypermethylates those elements and reduces
        CTCF occupancy at over 2,700 sites. Not established: any direct measurement of
        AHDC1 holding two DNA elements together.
      gap_kind:
      - BIOLOGY
      dark_aspect: MF_DARK
      status: OPEN
      significance: >-
        It determines whether GO:0140585 is a molecular function of this protein or a
        description of a process it regulates from upstream, and the two readings put the
        gene in quite different company.
      resolution: >-
        An acute degron depletion with HiChIP at short timepoints, before methylation can
        drift, would separate the direct from the indirect model; a reconstituted looping
        assay would settle the bridging claim.
      provenance:
      - reference_id: PMID:35585237
        supporting_text: it remains elusive whether Gibbin acts directly on a DNMT protein,
          or if these effects are an indirect result of transcriptional changes
- term:
    id: GO:0003682
    label: chromatin binding
  evidence_type: IDA
  original_reference_id: PMID:35585237
  qualifier: enables
  review:
    summary: >-
      New annotation proposed. This is the honest maximal statement of what AHDC1's
      ChIP-seq shows, and it is what survives when the sequence-specificity claim in
      GO:0003700 is withdrawn.
    action: NEW
    reason: >-
      Correcting GO:0003700 to a coregulator term must not silently delete the DNA side of
      the evidence, which is real: chromatin immunoprecipitation of tagged AHDC1 recovers
      the protein at active promoters and enhancers after RA and BMP4, and an independent
      ENCODE dataset in HepG2 reproduces the chromatin-state distribution, peak number and
      target gene set in a completely different lineage. GO:0003682 is defined as binding
      to chromatin, the network of fibers of DNA, protein and sometimes RNA that make up
      the chromosomes of the eukaryotic nucleus during interphase, which is exactly what a
      crosslinked-chromatin immunoprecipitation measures, and it makes no sequence-recognition
      claim. Its ancestor closure was checked and contains only GO:0005488 and the
      molecular function root, so it is not a descendant of GO:0005515 and is not a
      restatement of the protein-binding rows. Terms that would have asserted more were
      considered and rejected: GO:0000987 cis-regulatory region sequence-specific DNA
      binding and GO:0003680 minor groove of adenine-thymine-rich DNA binding both assert a
      binding preference nothing has measured on this protein, and the second is precisely
      the motif-derived function this review is arguing against. Evidence code IDA: this is
      a direct assay of where the protein is, performed in human cells, and the species and
      readout are both right. The remaining caveat is the ectopic, epitope-tagged,
      doxycycline-inducible transgene - described that way rather than as "over-expression",
      since the paper reports an inducible HA-tagged cDNA on a PiggyBac vector and never
      compares its level to endogenous AHDC1. It is weighted less here than on the
      GO:0003700 row above, deliberately: ectopic expression from a heterologous promoter
      distorts WHICH sites are occupied far more than WHETHER the protein reaches chromatin,
      and this row claims only the latter. Two further observations limit it. First, the
      occupancy is conditional, appearing only after RA and BMP4 and absent at day 0 in the
      same cells with the same construct and the same induction, so the only variable is the
      differentiation state - which an artefact of ectopic expression alone would not
      reproduce. Second, the ENCODE HepG2 replication controls the very axis that matters
      most here: ENCSR168AUX (Myers lab) is not a transfected construct but a CRISPR
      knock-in of a C-terminal 3xFLAG tag at the endogenous AHDC1 locus, so that protein is
      expressed from its own promoter at endogenous levels, in a different laboratory and a
      different lineage, and still recovers the same chromatin-state distribution, peak
      number and target gene set. The residual limitation is stated rather than glossed:
      both datasets are epitope-tagged, and no ChIP-seq of untagged endogenous AHDC1 with a
      validated antibody exists, so tagging itself is the one axis neither controls. Neither
      observation rescues a specificity claim, which is why they are cited here and not on
      the GO:0003700 row. One further methodological fact belongs on this row and cuts both
      ways. The Gibbin ChIP-seq, alone among the ChIPs in that paper, pre-treated cells with
      5 percent 1,6-hexanediol for 60 seconds before crosslinking. Hexanediol disrupts the
      weak multivalent interactions that hold biomolecular condensates together, so what was
      crosslinked and sequenced is the hexanediol-resistant fraction of AHDC1 on chromatin.
      For a protein with ten annotated disordered regions the intent of that step is clear -
      condensate co-precipitation is a real alternative explanation for apparent chromatin
      binding by such proteins, and surviving a condensate-disrupting pre-treatment would
      exclude it. An earlier version of this row took that at face value and counted it as
      strengthening the binding call. It does not, and the reference that supplies the
      caveat is the one that refutes it. PMID:33814344 reports "at least 7.5% 1,6-hexanediol
      is required to dissolve phase-separated GST-CTD" in vitro, and describes a regime
      "where the agent inhibits kinase activity while condensates are not yet dissolved".
      The Gibbin ChIP used 5 percent - below the only dissolution threshold that paper
      reports and inside the range where it finds kinases and phosphatases virtually
      inactive. Two further details point the same way rather than rescuing the control.
      That 7.5 percent figure is specific to one construct in a cell-free system, and the
      same Discussion notes that "the concentration required to dissolve LLPS probably
      varies with respect to protein and experimental condition", so it is a floor
      established in vitro rather than a value that can be assumed to transfer. Duration is
      an independent problem: the Gibbin pre-treatment ran for 60 seconds, while the
      cellular studies that paper cites used 1.5 percent for 30 minutes and 1 percent for 2
      hours. So the pre-treatment cannot be relied on to have dissolved anything, and "survived a
      condensate-disrupting pre-treatment" may partly mean the condensates were never
      disrupted. The condensate-control reading is therefore withdrawn rather than merely
      hedged, and this row does not rest on it. What survives is the other half, which does
      not depend on the mechanism at all: the map is filtered, because whatever occupancy
      did depend on the interactions the reagent disrupts was removed before crosslinking,
      and a pre-treatment that perturbs kinases and phosphatases at this concentration is
      not inert either way. That is a further reason not to read site specificity off these
      peaks, alongside the ectopic promoter and the authors' own statement that occupancy is
      unrestricted, and it is recorded on the GO:0003700 row as well, where those other two
      arguments live and where it is counted. The binding call rests instead on the
      conditional occupancy and the endogenous-locus ENCODE replication above, neither of
      which involves the reagent.
    supported_by:
    - reference_id: PMID:35585237
      supporting_text: After 7 days of RA/BMP4, Gibbin primarily binds active promoters and
        enhancers
    - reference_id: PMID:35585237
      supporting_text: This observation is consistent across diverse cell types, as similar
        chromatin state binding, number of peaks, and binding sites at a common set of genes
        were found in Gibbin ChIP-seq in HepG2 cells
    - reference_id: PMID:35585237
      supporting_text: Day 0 ChIP-seq indicated Gibbin does not bind to DNA in the absence
        of RA/BMP4
    - reference_id: PMID:35585237
      supporting_text: For Gibbin ChIP-seq, freshly collected cells were treated with 5%
        1,6-hexanediol in 5mL PBS in suspension for 60 seconds
    - reference_id: PMID:33814344
      supporting_text: At concentrations that are usually used to dissolve LLPS droplets
        (5-10%), both kinases and phosphatases were virtually inactive.
    - reference_id: PMID:33814344
      supporting_text: This holds already at concentrations of 1,6-hexanediol where the agent
        inhibits kinase activity while condensates are not yet dissolved
    - reference_id: PMID:33814344
      supporting_text: We found that at least 7.5% 1,6-hexanediol is required to dissolve
        phase-separated GST-CTD
    - reference_id: PMID:33814344
      supporting_text: the concentration required to dissolve LLPS probably varies with
        respect to protein and experimental condition
    - reference_id: PMID:33814344
      supporting_text: treatment of cells with 1.5% 1,6-hexanediol for 30 min reduced BRD4
        and Med1 occupancy at super-enhancers
