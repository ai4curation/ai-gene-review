core_functions:
- description: >-
    Regulator of mitochondrial inner-membrane architecture acting upstream of the i-AAA protease
    YME1L1. ADCK1 sits in the inner membrane and restrains mitochondrial fusion while promoting
    cristae formation: depleting it in human HeLa cells lengthens mitochondria and reduces cristae
    number, and raising it fragments mitochondria and destroys cristae. The two outputs share one
    route. Excess ADCK1 increases YME1L1-dependent cleavage of long-form OPA1, and lowers IMMT, the
    MICOS core subunit that builds crista junctions; knocking down YME1L1, or supplying extra OPA1 or
    IMMT, rescues the phenotypes that excess ADCK1 causes, placing all three downstream of it. Mouse
    ADCK1 reproduces this in primary brain endothelial cells, where it localises to the inner
    membrane, co-precipitates with IMMT and with OPA1, and is required for normal cristae. The
    relationship to YME1L1 is genetic and epistatic rather than shown to be a direct physical one, so
    ADCK1 is best described as acting on the protease's output rather than as a component of it.
  directly_involved_in:
  - id: GO:0010637
    label: negative regulation of mitochondrial fusion
  - id: GO:1903852
    label: positive regulation of cristae formation
  - id: GO:0010954
    label: positive regulation of protein processing
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:31125351
    supporting_text: >-
      As a result, the mitochondrial length was increased and the number of mitochondrial cristae was
      decreased by ADCK1 knockdown
  - reference_id: PMID:31125351
    supporting_text: >-
      the flies over-expressing dADCK1 with simultaneous dYME1L1 knockdown successfully survived into
      adulthood
  - reference_id: PMID:31125351
    supporting_text: >-
      The result demonstrated that the over-expression of both OPA1 and ADCK1 led to increased
      cleavage of L-OPA1
  - reference_id: PMID:40884816
    supporting_text: >-
      We first confirmed that mouse ADCK1 was localized to the mitochondrial inner membrane in
      primary brain ECs
  - reference_id: PMID:40884816
    supporting_text: Co‐IP assay detecting interaction between ADCK1 and IMMT in primary brain ECs
  knowledge_gaps:
  - gap_statement: >-
      Whether ADCK1 acts on YME1L1 directly is unknown. The ADCK1-YME1L1 relationship rests entirely
      on genetic epistasis in flies and in human cells; no physical interaction between the two has
      been reported, although ADCK1's contacts with the downstream effectors IMMT and OPA1 have been
      shown by co-immunoprecipitation. It is likewise unknown whether ADCK1 modulates YME1L1
      catalytic activity, YME1L1 substrate access, or the local membrane environment in which the
      protease works.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      The distinction determines whether ADCK1 should eventually be annotated as a protease
      regulator with YME1L1 as its direct target, or only as an upstream contributor to the same
      process.
    provenance:
    - reference_id: PMID:31125351
      supporting_text: >-
        the flies over-expressing dADCK1 with simultaneous dYME1L1 knockdown successfully survived
        into adulthood
- description: >-
    Catalytically uncommitted UbiB-family active site. ADCK1 retains all four core phosphotransfer
    residues - the beta3 lysine K183, the catalytic aspartate D315, the catalytic-loop asparagine
    N320 and the Mg-binding aspartate D338 - conserved in 8 of 8 UbiB proteins examined (ADCK1,
    ADCK2, ADCK5, COQ8A, COQ8B, and yeast Cqd1, Cqd2 and Coq8). It also carries the two deviations
    that mark the family: an alanine-rich phosphate-binding loop, LGTASLAQV against PKA's LGTGSFGRV,
    retaining 1 of the 3 canonical glycines, and no arginine in the catalytic loop, which reads HCD -
    an arginine present in 0 of 8 UbiB proteins examined, against the PKA control which has it.
    ADCK1's A164 occupies the same loop position as COQ8A A339, whose mutation to glycine flips COQ8A from ADP- to ATP-selectivity
    and enables autophosphorylation. In the characterised relatives these features accompany the
    absence of canonical protein-kinase activity in trans alongside retained ATPase activity and
    binding of lipid coenzyme-Q intermediates - with the one exception that an ancestrally
    reconstructed COQ8B was later shown to phosphorylate COQ3 in trans, at residues that were not
    typed (PMID:38425362). No molecular function is asserted here: no purified
    ADCK1 has been assayed, so the site is untested rather than refuted, and this entry exists to
    record what the residues do and do not license.
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: file:human/ADCK1/ADCK1-bioinformatics/RESULTS.md
    supporting_text: All four core catalytic residues are canonical in **8/8** of the UbiB
  - reference_id: PMID:25498144
    supporting_text: >-
      We find that multiple UbiB-specific features are poised to inhibit protein kinase activity,
      including an N-terminal domain that occupies the typical substrate binding pocket and a unique
      A-rich loop that limits ATP binding by establishing an unusual selectivity for ADP.
  - reference_id: PMID:27499294
    supporting_text: >-
      Although COQ8 was predicted to be a protein kinase, we demonstrate that it lacks canonical
      protein kinase activity in trans. Instead, COQ8 has ATPase activity and interacts with lipid
      CoQ intermediates
  - reference_id: PMID:31125351
    supporting_text: >-
      Until now, ADCK1 was predicted to be a kinase, yet there were no available reports to confirm
      it.
  knowledge_gaps:
  - gap_statement: >-
      No molecular function is known for ADCK1: neither a substrate nor a reaction has been
      identified, and no purified ADCK1 has ever been assayed in vitro. The published mutagenesis
      does not close the gap, because A164G, K183I, D315A and D338N were scored only for whether they
      still produce the phenotype of ADCK1 over-expression - a gain-of-function readout that tests
      whether the phenotype needs the residues, not whether the protein has activity. In budding
      yeast the function of the orthologous Cqd2 does depend on the same class of residues, so the
      two literatures are unreconciled.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
