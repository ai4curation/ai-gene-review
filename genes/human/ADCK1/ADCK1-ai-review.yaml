- term:
    id: GO:0010637
    label: negative regulation of mitochondrial fusion
  evidence_type: IMP
  original_reference_id: PMID:31125351
  qualifier: involved_in
  review:
    summary: >-
      Accept as core, and note that it rests on human data rather than only on the fly work the paper
      is titled for. Yoon et al. knocked ADCK1 down with siRNA in HeLa cells and measured by
      transmission electron microscopy that mitochondrial length increased, the signature of elevated
      fusion; over-expressing ADCK1 produced the converse, shortened mitochondria. Loss of ADCK1
      therefore increases fusion, so ADCK1 negatively regulates it, and the sign of the annotation is
      right. The mechanism is consistent: ADCK1 acts upstream of YME1L1, whose processing of
      long-form OPA1 opposes fusion, and over-expressing ADCK1 with OPA1 increases L-OPA1 cleavage.
      Independently corroborated in mouse primary brain endothelial cells, where Adck1 knockdown
      alters mitochondrial length and the transcriptional programme that includes Adck1 was enriched
      for negative regulation of mitochondrial fusion (PMID:40884816).
    action: ACCEPT
    reason: >-
      Directly supported by human loss-of-function imaging in the cited paper, with a coherent
      mechanism and independent mammalian corroboration. This is one of the gene's two core
      biological processes.
    supported_by:
    - reference_id: PMID:31125351
      supporting_text: >-
        As a result, the mitochondrial length was increased and the number of mitochondrial cristae
        was decreased by ADCK1 knockdown
    - reference_id: PMID:31125351
      supporting_text: >-
        The result demonstrated that the over-expression of both OPA1 and ADCK1 led to increased
        cleavage of L-OPA1
- term:
    id: GO:1903852
    label: positive regulation of cristae formation
  evidence_type: IMP
  original_reference_id: PMID:31125351
  qualifier: involved_in
  review:
    summary: >-
      Accept as core. The same human HeLa siRNA experiment counted cristae by transmission electron
      microscopy and found their number reduced on ADCK1 knockdown, which is what a positive
      regulator of cristae formation predicts. The direction is confirmed from the other side in a
      second organism and a second laboratory: in mouse primary brain endothelial cells, Adck1 shRNA
      disrupts cristae and re-expressing ADCK1 rescues the cristae defect of Foxq1-knockout cells,
      and ADCK1 co-precipitates with IMMT, the MICOS core subunit that builds crista junctions
      (PMID:40884816). UniProt's FUNCTION line summarises the same conclusion.


      One asymmetry the term does not capture, and which no GO term would: the phenotype is
      non-monotonic. Losing ADCK1 reduces cristae number, but raising it does not increase them - it
      destroys cristae outright and produces abnormal circular profiles. So the loss-of-function arm
      reads as positive regulation while the gain-of-function arm reads as disruption, which is the
      behaviour of a factor that has to be held within a range rather than of a simple activator.
      GO:1903852 is right for the arm the IMP rests on; the other arm is recorded as a knowledge gap
      rather than annotated, since no term expresses "required at a set level".
    action: ACCEPT
    reason: >-
      Human loss-of-function ultrastructural measurement, with an independent mouse rescue experiment
      and a physical link to the MICOS subunit IMMT. The gene's second core biological process.
    supported_by:
    - reference_id: PMID:31125351
      supporting_text: >-
        As a result, the mitochondrial length was increased and the number of mitochondrial cristae
        was decreased by ADCK1 knockdown
    - reference_id: PMID:40884816
      supporting_text: Co‐IP assay detecting interaction between ADCK1 and IMMT in primary brain ECs
- term:
