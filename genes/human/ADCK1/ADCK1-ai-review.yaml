- id: PMID:40884816
  title: FOXQ1 Regulates Brain Endothelial Mitochondrial Function by Orchestrating Calcium Signaling
    and Cristae Morphology.
  findings:
  - statement: >-
      Mouse ADCK1 was localised directly to the mitochondrial inner membrane in primary brain
      endothelial cells - independent mammalian corroboration of the compartment that human ADCK1
      holds only by IBA.
    supporting_text: >-
      We first confirmed that mouse ADCK1 was localized to the mitochondrial inner membrane in primary
      brain ECs
  - statement: >-
      ADCK1 co-immunoprecipitates with IMMT, the MICOS core subunit that forms crista junctions, in
      primary brain endothelial cells.
    supporting_text: Co‐IP assay detecting interaction between ADCK1 and IMMT in primary brain ECs
  - statement: >-
      ADCK1 over-expression increases and Adck1 knockdown decreases cleavage of long-form OPA1 in
      mouse primary brain endothelial cells - a bidirectional replication, in a second organism and a
      second laboratory, of the OPA1-processing result first reported in HEK293T cells.
    supporting_text: >-
      Immunoblot images showing the levels of OPA1 in primary bECs infected with OPA1‐Flag and with
      either the empty vector, ADCK1‐HA, or Adck1‐shRNA lentivirus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, no retraction or erratum. Not cited by any existing GOA row; brought in from
      the affinage record and read in full from the cached PMC text. Its ADCK1 experiments are mouse,
      so they support ISS-strength inference for the human gene rather than direct annotation, and
      they are used here as corroboration rather than as the primary basis of any call.
- id: PMID:25498144
  title: Mitochondrial ADCK3 employs an atypical protein kinase-like fold to enable coenzyme Q
    biosynthesis.
  findings:
  - statement: >-
      Defines the UbiB-specific structural features from the ADCK3/COQ8A crystal structure, including
      the alanine-rich loop that selects ADP over ATP. ADCK1's A164 occupies the same loop position as
      the ADCK3 A339 mutated here, which is why the ATP ligand assigned to ADCK1's binding sites by
      ProRule is questionable.
    supporting_text: >-
      We find that multiple UbiB-specific features are poised to inhibit protein kinase activity,
      including an N-terminal domain that occupies the typical substrate binding pocket and a unique
      A-rich loop that limits ATP binding by establishing an unusual selectivity for ADP.
  - statement: >-
      The single ADCK3 A339G substitution reverses coenzyme selectivity and permits
      autophosphorylation, establishing that the alanine-rich loop is a functional determinant rather
      than an incidental sequence feature.
    supporting_text: >-
      A single alanine-to-glycine mutation of this loop flips this coenzyme selectivity and enables
      autophosphorylation but inhibits coenzyme Q biosynthesis in vivo
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, no retraction or erratum. About a paralog, not about ADCK1, and used only to
      establish what the family's structural features do - never as evidence for ADCK1 itself. The
      correspondence between ADCK1 A164 and ADCK3 A339 is asserted by this review's own alignment,
      which aborts if it cannot reproduce the A339 position.
- id: PMID:27499294
  title: Cerebellar Ataxia and Coenzyme Q Deficiency through Loss of Unorthodox Kinase Activity.
  findings:
  - statement: >-
      COQ8 lacks canonical protein-kinase activity in trans but has ATPase activity and binds lipid
      coenzyme-Q intermediates. This is the experimental basis of the GO:0004672 NOT|enables and
      GO:0006468 NOT|involved_in IDA rows on both COQ8A and COQ8B. It is the main basis for doubting
      the serine/threonine-kinase keyword on ADCK1, though not on its own: an ancestrally
      reconstructed COQ8B was later shown to phosphorylate a protein substrate in trans
      (PMID:38425362), so the family-level claim that survives is the narrower one that no UbiB
      protein has been typed as a Ser/Thr kinase.
    supporting_text: >-
      Although COQ8 was predicted to be a protein kinase, we demonstrate that it lacks canonical
      protein kinase activity in trans. Instead, COQ8 has ATPase activity and interacts with lipid
      CoQ intermediates
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, no retraction or erratum. About COQ8A/COQ8B, not ADCK1. Used to characterise
      what the family's characterised members were shown to do, and specifically not extended into a
      claim that ADCK1 is catalytically inactive - the alignment shows ADCK1's active site is intact
      and no purified ADCK1 has been assayed.
- id: PMID:38425362
  title: In vitro construction of the COQ metabolon unveils the molecular determinants of coenzyme Q
    biosynthesis.
  findings:
  - statement: >-
      The single demonstration of protein-kinase activity anywhere in the UbiB family, and the source
      of COQ8B's non-negated GO:0004672 IDA: COQ8B phosphorylates COQ3 in trans. Two limits on how far
      it reaches - the enzyme is an ancestral reconstruction rather than the extant human protein, and
      the residue class was not determined, so it does not establish Ser/Thr specificity for any UbiB
      protein. It also sits alongside COQ8B's own NOT|enables GO:0004672 row from PMID:27499294, which
      the two annotations leave unreconciled.
    supporting_text: >-
      Intact protein MS validated this idea: COQ3, but not COQ6, is phosphorylated by COQ8B at
      multiple sites
  - statement: >-
      The COQ8B used throughout the study is an ancestrally reconstructed protein, purified because
      ancestral COQ8A gave poor yields. The paper does not state that it reverted to extant human
      COQ8B for the phosphorylation experiment.
    supporting_text: >-
      Ancestral COQ8A and COQ8B were purified as membrane-bound recombinant proteins; however, COQ8A
      produced very low yields compared with COQ8B.
  - statement: >-
      The same work excludes small-molecule kinase activity for COQ8B, so its phosphotransfer output
      is protein-directed rather than directed at the CoQ intermediates it binds.
    supporting_text: >-
      Critically, GC/MS analyses did not detect any phosphorylated CoQ intermediates, suggesting that
      the enzyme is not a small-molecule kinase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, no retraction or erratum. About COQ8B, not ADCK1. Added in a correction round:
      an earlier draft of this review asserted twice that no UbiB protein had been shown to
      phosphorylate a protein substrate in trans, which this paper refutes. The UniProt keyword
      recommendation was re-argued on narrower grounds rather than withdrawn, because the residue
      class is undetermined and the protein is a reconstruction of a different paralog.
- id: PMID:34362905
  title: UbiB proteins regulate cellular CoQ distribution in Saccharomyces cerevisiae.
  findings:
  - statement: >-
      Renames yeast Mcp2/Ylr253w as Cqd2 and shows that its loss shifts coenzyme Q distribution in the
      direction opposite to loss of Cqd1. Cqd2 is the sole protein donor behind all three of ADCK1's
      IBA rows, so this is the best-characterised activity of the source of those transfers.
    supporting_text: >-
      Loss of Cqd1 skews cellular CoQ distribution away from mitochondria, resulting in markedly
      enhanced resistance to oxidative stress caused by exogenous polyunsaturated fatty acids, whereas
      loss of Cqd2 promotes the opposite effects.
  - statement: >-
      The phenotype is one of distribution, not synthesis - total cellular CoQ is unchanged. This is
      why no GO:0006744 ubiquinone-biosynthesis annotation is proposed for ADCK1.
    supporting_text: >-
      Total cellular CoQ levels remained unchanged (Supplementary Fig. 3b), again suggesting these
      CoQ-related phenotypes are unrelated to CoQ biosynthesis.
  - statement: >-
      Cqd2 function requires intact canonical protein-kinase-like and UbiB-specific residues. This is
      the direct counterweight to the kinase-independence result reported for ADCK1 in animals, and
      the reason this review declines to call ADCK1 catalytically dead.
    supporting_text: >-
      Similar to Cqd1 (Fig. 3g), Cqd2 function was dependent on intact canonical PKL and UbiB-specific
      residues
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, no retraction or erratum. Read in full from the cached PMC text. Directly
      relevant despite being a yeast paper, because its subject Cqd2 is the WITH/FROM donor for every
      IBA row on ADCK1. The same paper identifies ADCK2, not ADCK1, as the human ortholog of Cqd1,
      which prevents ADCK2's coenzyme-Q10-deficiency literature from being misapplied here.
- id: PMID:23781023
  title: Mcp1 and Mcp2, two novel proteins involved in mitochondrial lipid homeostasis.
  findings:
  - statement: >-
      The source publication for all three of MCP2's own experimental annotations (GO:0005743 IDA,
      GO:0007005 IMP and IGI, GO:0055088 IGI) and therefore the ultimate evidence behind ADCK1's three
      IBA rows. The lipid-homeostasis result comes from high-copy suppression of an mdm10 deletion,
      which is why that row is kept as non-core rather than as core.
    supporting_text: >-
      Lipid analysis demonstrates that elevated levels of Mcp1 and Mcp2 restore the alterations in
      mitochondrial phospholipid and ergosterol homeostasis in cells lacking Mdm10.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, no retraction or erratum. Abstract only in the cache (no PMC record); the
      quoted statements are from the abstract and the corresponding GO annotations were read directly
      from QuickGO rather than inferred from the text.
- id: PMID:36371387
  title: ADCK1 is a potential therapeutic target of osteosarcoma.
  findings:
  - statement: >-
      ADCK1 depletion in osteosarcoma cells lowers mitochondrial membrane potential and ATP and raises
      reactive oxygen species, consistent with the mitochondrial role established elsewhere. Adds a
      disease context but no new function, and produces no GO annotation.
    supporting_text: >-
      ADCK1 depletion disrupted mitochondrial functions in OS cells and induced mitochondrial membrane
      potential reduction, ATP depletion, reactive oxygen species production.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, no retraction or erratum. Corroborative for the bioenergetic consequences of
      losing ADCK1; the cancer-progression claims are cell-line phenotypes and are not used to support
      any GO term.
- id: PMID:33824271
  title: ADCK1 activates the β-catenin/TCF signaling pathway to promote the growth and migration of
    colon cancer cells.
  findings:
  - statement: >-
      Reports an endogenous co-immunoprecipitation of ADCK1 with the transcription factor TCF4 in
      colon cancer cells. The paper reports no experiment placing ADCK1 outside mitochondria, while
      three independent studies place it inside them and the protein has a mitochondrial transit
      peptide. Single laboratory, unreplicated; no GO annotation derives from it and none is proposed.
    supporting_text: the endogenous Co-IP experiment showed that endogenous ADCK1 and TCF4 formed a
      complex
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: >-
      PubMed-verified, no retraction or erratum, and the co-immunoprecipitation itself is reported at
      endogenous levels. Marked DISPUTED rather than MISCITED because the citation is accurate and the
      experiment real, but the conclusion is in tension with every localisation measurement made on
      this protein and has not been reproduced. Raised as a question rather than acted on.
- id: file:human/ADCK1/ADCK1-deep-research-affinage.md
  title: Affinage mechanistic annotation for ADCK1 (human)
  findings:
  - statement: >-
      Machine-generated provider record, gates_passed True, five citations, all numeric PMIDs with no
      bioRxiv identifiers in PMID-shaped fields. Its contribution to this review was bibliographic: it
      surfaced PMID:40884816, PMID:36371387, PMID:33824271 and PMID:31175694, none of which is cited
      by any GOA row, and the first of those turned out to carry the only independent mammalian
      localisation and OPA1-processing data for ADCK1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Deliberately not quoted as supporting_text anywhere in this review. Provider narrative sentences
      are leads, not evidence, so every claim it suggested was re-verified against the primary PMIDs
      and those PMIDs are cited instead. Its five citations were each checked for retraction, erratum
      and expression of concern; all are clean. Its own coarse GO grounding (GO:0140096 catalytic
      activity, acting on a protein) was not imported, and would have been wrong: no catalytic
      activity of any kind has been demonstrated for ADCK1.
- id: file:human/ADCK1/ADCK1-uniprot.txt
  title: UniProt entry Q86TW2 (ADCK1_HUMAN)
  findings:
  - statement: >-
      The entry asserts EC=2.7.-.-, the keywords Kinase, Serine/threonine-protein kinase, ATP-binding
      and Transferase, and ATP-ligand BINDING sites at 161..169 and 183 - all from
      PROSITE-ProRule:PRU00159 by ECO:0000255 - while its FUNCTION comment states that it is not known
      whether ADCK1 has protein kinase activity or what class of residue it would phosphorylate. The
      keyword-derived GO:0004674 and GO:0005524 cross-references are no longer present in GOA.
    supporting_text: 'EC=2.7.-.- {ECO:0000255|PROSITE-ProRule:PRU00159};'
  - statement: >-
      The three mutagenesis entries record the same gain-of-function result reported by Yoon et al.:
      substituting the phosphotransfer residues has no effect on the protein's role in maintaining
      mitochondrial structure and function.
    supporting_text: '/note="K->I: No effect on role in maintaining mitochondrial'
  - statement: >-
      SUBCELLULAR LOCATION is experimentally grounded but resolves only to the organelle, which is
      what GO_REF:0000044 then maps to GO:0005739.
    supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Mitochondrion {ECO:0000269|PubMed:33988507}.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
- id: file:human/ADCK1/ADCK1-bioinformatics/RESULTS.md
  title: 'ADCK1: which protein-kinase catalytic motifs does it actually retain?'
  findings:
  - statement: >-
      ADCK1 retains all four core phosphotransfer residues (K183, D315, N320, D338), conserved in 8 of
      8 UbiB proteins examined, so a pseudokinase reading based on lost catalytic residues is refused
      by measurement.
    supporting_text: All four core catalytic residues are canonical in **8/8** of the UbiB
  - statement: >-
      ADCK1 carries the two UbiB diagnostics: an alanine-rich phosphate-binding loop retaining 1 of 3
      canonical glycines, with A164 in the same column as the COQ8A ADP/ATP-selectivity determinant
      A339, and no catalytic-loop arginine in 0 of 8 UbiB proteins against the PKA control.
    supporting_text: ADCK1 retains **1/3** of the canonical glycines.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Generated by ubib_motif_scan.py in the same folder; a fresh run reproduces the file
      byte-for-byte. Motif columns are anchored on PKA's own feature-table entries, the run aborts
      unless it reproduces curated and published anchor positions, and the catalytic-loop finding is
      re-read alignment-free because an alignment gap can be an artefact.
