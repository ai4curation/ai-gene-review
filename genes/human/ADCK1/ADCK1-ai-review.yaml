      close that, and is listed under suggested_experiments; until then the row is well founded but
      rests on a cross-species pairing rather than on one complete human dataset.
    action: NEW
    reason: >-
      A reproducibly measured, directionally controlled effect of ADCK1 on OPA1 processing that the
      current annotation set does not capture at all. Additive to the two accepted IMP rows, which
      record the morphological outcomes rather than the biochemical step that produces them.
    supported_by:
    - reference_id: PMID:31125351
      supporting_text: >-
        The result demonstrated that the over-expression of both OPA1 and ADCK1 led to increased
        cleavage of L-OPA1
