  review:
    summary: >-
      Proposed new annotation. ADCK1's effect on mitochondrial shape is exerted through the
      proteolytic processing of OPA1 by YME1L1, and that step has itself been measured
      bidirectionally in two organisms and two laboratories, yet it is captured by no existing GO
      row. Yoon et al. showed in HEK293T cells that co-expressing ADCK1 with OPA1 increases cleavage
