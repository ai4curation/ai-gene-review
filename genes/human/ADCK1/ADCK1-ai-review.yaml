suggested_questions:
- question: >-
    Should UniProt withdraw the keywords `Kinase` and `Serine/threonine-protein kinase`, and the
    `EC=2.7.-.-` number, from Q86TW2? All three come from PROSITE-ProRule PRU00159 by ECO:0000255
    rather than from data, and the same entry's FUNCTION comment states that it is not known whether
    ADCK1 has protein kinase activity or what class of residue it would phosphorylate. The
    serine/threonine specificity in particular has no basis at any level. Protein-kinase activity has
    been demonstrated exactly once in the family - an ancestrally reconstructed COQ8B phosphorylates
    COQ3 in trans (PMID:38425362) - and that experiment did not determine which residue class is
    modified, so no UbiB protein has been shown to be a Ser/Thr kinase specifically. It also does not
    transfer: it is a different paralog in a different clade, both COQ8A and COQ8B additionally carry
    an explicit GO:0004672 NOT|enables IDA from PMID:27499294, and ADCK1 has no activity data at all.
    These keywords currently drive the GO:0004674 and GO:0005524 cross-references still shown on the
    UniProt entry, even though the corresponding annotations are no longer in GOA.
  experts:
  - UniProt
  - GO Central
- question: >-
    Should UniProt's SUBCELLULAR LOCATION for ADCK1 be refined from "Mitochondrion" to "Mitochondrion
    inner membrane"? The current line cites PMID:33988507, an epitope-tagged over-expression imaging
    survey that resolves only to the organelle. Since then, mouse ADCK1 has been localised to the
    inner membrane directly in primary brain endothelial cells (PMID:40884816), and human ADCK1
    already carries GO:0005743 by IBA from an ortholog holding it by IDA. Refining the line would
    also let the GO_REF:0000044 mapping produce the more specific term.
  experts:
  - UniProt
- question: >-
    Does human ADCK1 have a role in coenzyme Q distribution, as its budding-yeast ortholog does? Cqd2
    (formerly Mcp2, the sole WITH/FROM protein donor behind all three of ADCK1's IBA rows)
    reciprocally controls how coenzyme Q is partitioned between mitochondria and the rest of the
    cell, without altering total cellular CoQ. Human ADCK1 has no GO:0006744 annotation and should
    not have one - the yeast phenotype is explicitly not biosynthetic, and the CoQ-biosynthesis terms
    on COQ8A and COQ8B come from a different PANTHER node that has not leaked into the ADCK1 clade.
    The open question is the distribution role, which no mammalian study has tested.
  experts:
  - GO Central
  - mitochondrial lipid biology
- question: >-
    Can the kinase-independence result for ADCK1 be reconciled with the residue-dependence of its
    yeast ortholog? Yoon et al. found that A164G, K183I, D315A and D338N, singly and as a triple
    mutant, leave intact the phenotypes caused by ADCK1 over-expression. Kemmerer et al. found that
    the function of Cqd2 requires intact canonical PKL and UbiB-specific residues. The two are not
    formally contradictory - the first is a gain-of-function readout in an animal, the second a
    loss-of-function complementation readout in yeast - but they cannot both be the whole story, and
    resolving them determines whether ADCK1 should ever receive a molecular-function term.
  experts:
  - UbiB/COQ8 biochemistry
- question: >-
    Is the reported ADCK1-TCF4 interaction and beta-catenin/TCF signalling role compatible with
    ADCK1's localisation? PMID:33824271 reports an endogenous co-immunoprecipitation of ADCK1 with
    TCF4 in colon cancer cells, but reports no experiment placing ADCK1 outside mitochondria, while
    three independent studies place it inside them and the protein carries a mitochondrial transit
    peptide. The claim is from a single laboratory and unreplicated. No GO annotation currently
    derives from it, and none should until a localisation experiment supports it.
  experts:
  - GO Central
- question: >-
    Should the human ADCK1 inner-membrane localisation be upgraded from IBA to an experimental code?
    The IBA is sound, but mouse ADCK1 now has a direct inner-membrane localisation (PMID:40884816),
    which would support an ISS annotation on the human protein with the mouse protein as the
    supporting entity - a stronger and more traceable basis than a tree inference for a compartment
    this well established.
  experts:
  - GO Central
suggested_experiments:
- hypothesis: >-
    Purified ADCK1 is an ADP-preferring nucleotide-binding enzyme rather than a protein kinase, as
    its alanine-rich phosphate-binding loop predicts by analogy with COQ8A.
  description: >-
    Express and purify the ADCK1 kinase-like domain lacking the transit peptide, following the
    construct strategy that worked for COQ8A, and measure nucleotide binding by differential scanning
    fluorimetry or isothermal titration calorimetry against ATP and ADP side by side. Test the A164G
    substitution, which occupies the position at which the equivalent COQ8A A339G reverses coenzyme
    selectivity, as the discriminating mutant. Assay ATP hydrolysis, and test autophosphorylation in
    the wild-type and A164G proteins. A clear ADP preference reversed by A164G would place ADCK1 in
    the same mechanistic class as COQ8A and would show that the ATP ligand currently assigned to
    ADCK1's binding sites by ProRule is wrong.
  experiment_type: in vitro biochemistry
- hypothesis: >-
    ADCK1 controls the partitioning of coenzyme Q between mitochondria and other membranes in human
    cells, as Cqd2 does in yeast.
  description: >-
    Generate ADCK1-knockout and ADCK1-over-expressing human cell lines, fractionate into pure
    mitochondrial and non-mitochondrial compartments, and quantify CoQ10 in each by LC-MS alongside
    total cellular CoQ10. The yeast result predicts a redistribution with no change in the total, so
    both numbers matter. Include an ADCK2 knockout as the counterpart to yeast Cqd1, since the
    reciprocal relationship between the two yeast proteins is the most distinctive feature of the
    phenotype, and test sensitivity to polyunsaturated-fatty-acid-induced lipid peroxidation as the
    functional readout.
  experiment_type: lipidomics and cell biology
- hypothesis: ADCK1 acts on YME1L1 physically, not only genetically.
  description: >-
    Test for a direct interaction between ADCK1 and YME1L1 in human cells at endogenous levels by
    proximity labelling from an ADCK1 bait and by co-immunoprecipitation from mitochondrial lysates,
    and check topology by protease protection to establish which face of the inner membrane ADCK1
    presents its kinase-like domain to. All existing evidence for the ADCK1-YME1L1 relationship is
    epistatic, whereas ADCK1's contacts with IMMT and OPA1 have been shown by
    co-immunoprecipitation; a direct ADCK1-YME1L1 contact would change the mechanism from indirect
    modulation to protease regulation.
  experiment_type: interaction and topology mapping
- hypothesis: >-
    The catalytic residues of ADCK1 are required for its function when tested by loss-of-function
    rescue, even though they are dispensable for its over-expression phenotype.
  description: >-
    The published mutants were all scored for whether they still produce the phenotype of excess
    ADCK1. Invert the design: knock out ADCK1 in human cells, re-express wild-type or the A164G,
    K183I, D315A and D338N mutants at near-endogenous levels from a single-copy locus, and score
    rescue of cristae number, mitochondrial length, membrane potential and L-OPA1 cleavage. This is
    the assay that was applied to yeast Cqd2, where the residues did matter, and it is the missing
    control that would reconcile the two literatures.
  experiment_type: genetic complementation
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      The PAINT record for PTHR43173 has exactly one annotated node, PTN005148758, carrying exactly
      three terms, all seeded from SGD:S000004243 (yeast MCP2/Cqd2). The node's reach is 97 entities,
      identical for all three terms. No molecular-function term is asserted at the node, so PAINT did
      not propagate any kinase activity into this family.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Node content read from the fetched interpro/panther/PTHR43173/PTHR43173-paint.tsv; reach and
