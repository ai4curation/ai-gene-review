      withFrom=PANTHER:PTN005148758 (97 hits returned of 97 reported, so no truncation).
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  findings:
  - statement: >-
      Maps UniProt SUBCELLULAR LOCATION SL-0173 "Mitochondrion" to GO:0005739. For ADCK1 the
      underlying UniProt statement is experimental (ECO:0000269|PubMed:33988507), so the resulting IEA
