    summary: >-
      Keep, but not as a core function of the human gene. The transfer is structurally sound - MCP2
      is the ortholog and holds the term by IGI from PMID:23781023 - but the donor evidence is the
      weakest of the three rows in kind: it comes from a high-copy suppressor screen in which
      over-expressing Mcp2 restored phospholipid and ergosterol homeostasis in cells lacking Mdm10,
      which reports what excess Mcp2 can rescue rather than what normal Mcp2 does. Newer work
      strengthens rather than undermines the lipid connection for the yeast protein: loss of Cqd2
      shifts the cellular distribution of coenzyme Q, a prenylated lipid quinone, in the direction
      opposite to loss of Cqd1, without changing total cellular CoQ (PMID:34362905). But no lipid or
      coenzyme-Q measurement of any kind has been made on human or Drosophila ADCK1, and every
      readout that has been measured in animals concerns inner-membrane architecture through YME1L1.
      Retained as a defensible ortholog inference awaiting a mammalian test, not promoted to core.
    action: KEEP_AS_NON_CORE
    reason: >-
      A sound ortholog transfer whose donor evidence is real but gain-of-function in kind, and which
      has never been tested in any animal. Biologically plausible given the yeast ortholog's
      coenzyme-Q distribution phenotype, so not an over-annotation; but it is not what human ADCK1 is
      known to do.
