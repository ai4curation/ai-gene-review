id: Q86TW2
gene_symbol: ADCK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ADCK1 (AarF domain-containing protein kinase 1) is a mitochondrial inner-membrane protein of the
  ancient UbiB/ABC1 family of atypical kinase-like enzymes, which in humans also comprises ADCK2,
  ADCK5 and the coenzyme-Q proteins COQ8A and COQ8B. An N-terminal transit peptide targets it to
  mitochondria, where it sets inner-membrane architecture: depleting ADCK1 in human cells lengthens
  mitochondria and reduces the number of cristae, while raising it drives fragmentation, clustering
  and cristae destruction. It acts genetically upstream of the i-AAA protease YME1L1 and thereby on
  two of that protease's downstream effectors, promoting cleavage of long-form OPA1 and lowering
  IMMT/mitofilin levels; knocking down YME1L1, or supplying extra OPA1 or IMMT, reverses the
  consequences of excess ADCK1. Loss of ADCK1 lowers mitochondrial membrane potential and ATP output
  and raises reactive oxygen species, and in flies it causes muscle degeneration, impaired
  locomotion and death before adulthood. The same pathway operates in mammals: mouse ADCK1 sits in
  the inner membrane of brain endothelial cells, co-precipitates with IMMT and OPA1, and is required
  for normal cristae there.

  Its catalytic status is unresolved. The protein retains an intact phosphotransfer active site (the
  beta3 lysine, the catalytic aspartate, the catalytic-loop asparagine and the Mg-binding aspartate
  are all present) but carries the two deviations diagnostic of the UbiB family: an alanine-rich
  phosphate-binding loop in place of the canonical glycine-rich loop, and no arginine in the
  catalytic loop. In the two characterised relatives, COQ8A and COQ8B, these features accompany an
  absence of canonical protein-kinase activity in trans together with retained ATPase activity,
  binding of lipid coenzyme-Q intermediates, and selectivity for ADP over ATP. No purified ADCK1 has
  been assayed, so neither a substrate nor a reaction is known for it, and the
  mitochondrial-morphology phenotypes produced by over-expressing it do not require its catalytic
  residues. In budding yeast the orthologous protein Cqd2 (Mcp2) governs the distribution of
  coenzyme Q between mitochondria and the rest of the cell, and does so in a manner that depends on
  those same residues; whether human ADCK1 shares that lipid-handling role is untested. ADCK1 is
  broadly expressed and is elevated in osteosarcoma and colon cancer, where its depletion impairs
  proliferation and survival.
