  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:31125351
  title: Drosophila ADCK1 is critical for maintaining mitochondrial structures and functions in the
    muscle.
  findings:
  - statement: >-
      Human HeLa siRNA knockdown of ADCK1, assayed by transmission electron microscopy, increased
      mitochondrial length and decreased cristae number - the direct human basis for both IMP rows,
      despite the paper's Drosophila-focused title.
    supporting_text: >-
      As a result, the mitochondrial length was increased and the number of mitochondrial cristae was
      decreased by ADCK1 knockdown
  - statement: >-
      Co-expression of ADCK1 with OPA1 in HEK293T cells increased cleavage of long-form OPA1,
      quantified across four replicates - the biochemical step underlying the morphological
      phenotypes, and the basis of the proposed GO:0010954 annotation.
    supporting_text: >-
      The result demonstrated that the over-expression of both OPA1 and ADCK1 led to increased
      cleavage of L-OPA1
  - statement: >-
      Kinase-dead substitutions at the phosphotransfer residues did not abolish the phenotypes caused
      by ADCK1 over-expression. The scope of this result is gain-of-function: it shows the
      over-expression phenotype does not require these residues, not that ADCK1 lacks activity.
    supporting_text: >-
      Over-expression of each mutant as well as the triple-mutation-containing form
      (K183I-D315A-D338N; 3KD) of ADCK1 still induced the same phenotypes similar to ADCK1 wild type,
      and thus we concluded that the phenotypes induced by ADCK1 are kinase-independent
  - statement: >-
      The authors state the prior explicitly rather than claiming a negative: at the time of writing
      no report confirmed that ADCK1 is a kinase. No in vitro assay of purified ADCK1 has been
      published since.
    supporting_text: >-
      Until now, ADCK1 was predicted to be a kinase, yet there were no available reports to confirm
      it.
  - statement: >-
      Knockdown of dYME1L1 rescued the pupal lethality of dADCK1 over-expression, placing ADCK1
      genetically upstream of YME1L1. The relationship is epistatic; no physical ADCK1-YME1L1
      interaction is reported.
    supporting_text: >-
      the flies over-expressing dADCK1 with simultaneous dYME1L1 knockdown successfully survived into
      adulthood
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; full text read from the cached PMC record, not only the abstract. No
      retraction, erratum or expression of concern on the PubMed record (CommentsCorrections empty).
      The one thing to guard against when citing it is scope: the kinase-independence experiments are
      all over-expression readouts, and the paper's own section heading says so.
- id: PMID:33988507
  title: A subcellular map of the human kinome.
  findings:
  - statement: >-
      Localisation was determined by imaging epitope-tagged kinases ectopically expressed in HeLa
      cells. This is the assay behind the GO:0005739 IDA and behind UniProt's SUBCELLULAR LOCATION
      line; the over-expression caveat is recorded, and two independent measurements agree with the
      result.
    supporting_text: >-
      456 epitope-tagged kinases, representing 85% of the human kinome, were expressed in HeLa cells
      and imaged by immunofluorescent microscopy
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, no retraction or erratum. ADCK1 itself appears only in the paper's
      supplementary data, not in the body text of the cached record, which is normal for a
      kinome-scale survey. The reference carries only 6 annotations over 4 entities in QuickGO, so
      there is no projection concern.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular context.
  findings:
  - statement: >-
      A purpose-built high-confidence human mitochondrial proteome; ADCK1 is among the proteins for
      which the paper lists a validating antibody, so its inclusion is not a pure MS assignment. The
      reference carries 1235 GO annotations, but no functional or phenotype term spreads with the
      localisation term, so this is per-protein measurement rather than a projection.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, no retraction or erratum. The QuickGO result for this reference is paginated
