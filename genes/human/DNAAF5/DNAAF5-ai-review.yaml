suggested_questions:
- question: Which contacts between DNAAF5, DNAI2 and SPAG1 directly stabilize assembly intermediates,
    and how do these change during ciliogenesis?
- question: Do the three natural DNAAF5 products differ in stability, assembly-factor association or localization?
- question: How do human DNAAF5-containing particles acquire DynAP material properties, and which inner-arm
    subtypes depend on each assembly step?
suggested_experiments:
- description: Compare sequence-verified natural products at matched expression in DNAAF5-deficient human
    airway cultures, measuring DNAI2 association, outer/inner-arm restoration and particle localization.
  hypothesis: Natural products may differ in assembly competence or subcellular distribution.
  experiment_type: Product-resolved complementation and localization
- description: Combine purified-component interaction measurements with stage-resolved endogenous complex
    analysis to separate direct interfaces from developmental co-complex association.
  hypothesis: Developmental assembly complexes combine direct interfaces with transient indirect associations.
  experiment_type: Direct binding and stage-resolved complex analysis
