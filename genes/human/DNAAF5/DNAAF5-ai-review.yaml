id: Q86Y56
gene_symbol: DNAAF5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAAF5, also called HEATR2, is a HEAT-repeat protein that supports the cytoplasmic preassembly
  of outer and inner axonemal dynein arms. It associates with the dynein intermediate chain DNAI2 and
  early assembly factors, and occupies dynein-containing cytoplasmic particles. These interactions help
  establish the motor apparatus needed for motile cilia and flagella. Biallelic pathogenic variants cause
  primary ciliary dyskinesia with dynein-arm defects and impaired airway ciliary beating.
alternative_products:
- name: '1'
  id: Q86Y56-1
  description: The displayed 855-residue protein is the official reference product. Endogenous human airway
    experiments establish gene-level preassembly function without resolving every natural splice product.
- name: '2'
  id: Q86Y56-2
  sequence_note: VSP_016110 replaces canonical residues 811–855 with a 33-residue alternative tail; 843
    residues.
  description: This natural alternative C terminus is distinct from the experimentally studied disease-associated
    frameshift. Its assembly activity and stability have not been resolved by accession.
- name: '3'
  id: Q86Y56-3
  sequence_note: VSP_016109 deletes canonical residues 1–620; 235 residues.
  description: This product comprises the C-terminal portion of the displayed sequence. Retention of this
    sequence does not establish equivalent preassembly activity or inactivity.
