sources:
- id: PMID:23040496
  url: https://doi.org/10.1016/j.ajhg.2012.08.022
  locators:
  - Abstract
  - Indexed original main-text/Figure 4B context
  scope: Human airway deficiency and knockdown; Chlamydomonas silencing. Cytoplasmic/nonciliary observation,
    outer-arm loss and motility defects. Retained DNAH7 and residual inner arms limit universal loss claims.
  access: Normal cache abstract-only. Selected independently indexed original text was inspected; full Methods
    and figure pixels were not recovered.
- id: PMID:25232951
  url: https://journals.plos.org/plosgenetics/article?id=10.1371/journal.pgen.1004577
  locators:
  - 'Results: CG31320 and sperm motility; Figures 3–4'
  - 'Results: HEATR2 localization and dynein machinery; Figures 8–9'
  - 'Methods: Co-immunoprecipitation'
  - Figure S8 caption
  scope: Human endogenous HEATR2/DNAI2 co-IP uses day-40 differentiated bronchial cells and an isotype control.
    Fly sensory/sperm arm defects corroborate assembly. Negative mature-cell association tests are not developmental
    exclusions. Natural product 2 must not be equated with the pathogenic tail frameshift.
  access: Selected complete full-cache paragraphs and captions were read; figure pixels were not reanalyzed.
- id: PMID:29358401
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5819421/
  alternative_original: https://www.researchgate.net/publication/322647804_Establishment_of_the_early_cilia_preassembly_protein_complex_during_motile_ciliogenesis
  locators:
  - 'Results: HEATR2 Interacts with Early Preassembly Proteins DNAAF2 and SPAG1; Figures 2–3'
  - 'Results: HEAT-Repeat Domains Are Redundant for HEATR2–SPAG1 Interaction; Figures 4–5'
  - 'Methods: Immunoprecipitation; FRET Imaging'
  scope: Human airway HEATR2-EGFP co-IP and controlled HEK293T FRET distinguish HEATR2–SPAG1/self proximity
    from indirect DNAAF2 association. The proposed higher-order scaffold is not experimentally resolved architecture.
  access: Normal cache abstract-only. Selected original Results/captions and main Methods accessed through
    indexing and author-uploaded original; supplementary construct-generation details not recovered.
- id: PMID:30561330
  url: https://elifesciences.org/articles/38497
  locators:
  - 'Results: DNAAFs and dynein subunits concentrate in cytosolic foci'
  - Figure 1 and Figure 8
  - 'Methods: Plasmids, MOs and microinjections; Airway epithelial cell culture and immunostaining'
  scope: Xenopus fluorescent Heatr2 and morpholino assays establish DynAP localization and effects on particle
    number/Ktu mobility. Human supplemental staining uses LRRC6/DNAI1, not a new human HEATR2 live-dynamics
    assay.
  access: Selected full-cache Results, captions and Methods read.
- id: PMID:33263282
  url: https://elifesciences.org/articles/58662
  locators:
  - 'Results: Outer and inner arm dynein subunits occupy sub-regions within DynAPs'
  - Figure 1 and figure supplement 1
  - 'Methods: Xenopus embryo manipulations; Plasmids and MOs; Imaging'
  scope: Tagged Xenopus Dnaaf5 marks the shared DNAAF/chaperone compartment, distinct from dynein subregions.
    No human natural-product equivalence or fixed complex stoichiometry follows.
  access: Selected full-cache Results, captions and Methods read.
