  review:
    summary: Proposed NEW annotation. INPP5E acts on the lipids of the ciliary membrane, converting PI(4,5)P2
      to PI(4)P along the ciliary membrane (shown for the mouse ortholog in fibroblasts and neural stem
      cells).
    action: NEW
    reason: INPP5E is a farnesylated peripheral membrane enzyme delivered to cilia by PDE6D; loss of Inpp5e
      redistributes PI(4,5)P2 along the entire ciliary membrane, demonstrating that the enzyme is active
      there. Existing annotations capture cilium and axoneme but not the membrane on which the enzyme
      acts. Evidence is from the mouse ortholog, hence ISS.
    supported_by:
    - reference_id: PMID:26305592
      supporting_text: Thus, Inpp5e limits ciliary PI(4,5)P2 and generates ciliary PI(4)P, consistent
        with a role in converting PI(4,5)P2 to PI(4)P within cilia.
    - reference_id: PMID:26190144
      supporting_text: Upon INPP5E inactivation, PI(4,5)P2 accumulates at the ciliary tip whereas PI4P
        is depleted.
