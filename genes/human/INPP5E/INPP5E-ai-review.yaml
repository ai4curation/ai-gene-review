id: Q9NRR6
gene_symbol: INPP5E
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: INPP5E (inositol polyphosphate-5-phosphatase E, type IV 5-phosphatase) is a lipid phosphatase
  that removes the 5-phosphate from phosphatidylinositol 4,5-bisphosphate and phosphatidylinositol 3,4,5-trisphosphate,
  with the highest affinity for PI(3,4,5)P3 among the 5-phosphatases. It is C-terminally farnesylated
  and is carried to the primary cilium by the prenyl-binding protein PDE6D, with release mediated by ARL3
  and ciliary retention supported by ARL13B. In the cilium INPP5E concentrates along the axoneme/ciliary
  membrane, where it converts PI(4,5)P2 to PI(4)P, keeping PI(4,5)P2 restricted to the ciliary base. This
  lipid identity limits ciliary entry of PI(4,5)P2-binding TULP3 and its cargo GPR161, permitting Hedgehog
  signalling, and dampens ciliary PI3K signalling to maintain stability of pre-formed cilia. A pool is
  also associated with Golgi membranes. Mutations that impair the phosphatase cause Joubert syndrome and
  MORM syndrome.
