core_functions:
- description: Hydrolyzes the 5-phosphate of PI(4,5)P2 in the ciliary membrane, generating PI(4)P and
    confining PI(4,5)P2 to the ciliary base; this lipid identity restricts ciliary TULP3/GPR161 and permits
    Hedgehog signalling.
  molecular_function:
    id: GO:0004439
    label: phosphatidylinositol-4,5-bisphosphate 5-phosphatase activity
  directly_involved_in:
  - id: GO:0046856
    label: phosphatidylinositol dephosphorylation
  locations:
  - id: GO:0060170
    label: ciliary membrane
  - id: GO:0005930
    label: axoneme
  supported_by:
  - reference_id: PMID:10764818
    supporting_text: This enzyme hydrolyzes only lipid substrates, phosphatidylinositol 3,4,5-trisphosphate
      and phosphatidylinositol 4,5-bisphosphate.
  - reference_id: PMID:26305592
    supporting_text: This distribution is created by Inpp5e, a ciliary phosphoinositide 5-phosphatase.
  - reference_id: PMID:26305592
    supporting_text: Thus, Inpp5e limits ciliary PI(4,5)P2 and generates ciliary PI(4)P, consistent with
      a role in converting PI(4,5)P2 to PI(4)P within cilia.
  - reference_id: PMID:26190144
    supporting_text: Upon INPP5E inactivation, PI(4,5)P2 accumulates at the ciliary tip whereas PI4P is
      depleted.
  - reference_id: PMID:26305592
    supporting_text: Inpp5e limits the ciliary levels of inhibitors of Hh signaling, including Gpr161
      and the PI(4,5)P2-binding protein Tulp3.
- description: Hydrolyzes the 5-phosphate of PI(3,4,5)P3 with high affinity, limiting PI3K-derived signalling
    lipids and contributing to the stability of pre-formed primary cilia.
  molecular_function:
    id: GO:0034485
    label: phosphatidylinositol-3,4,5-trisphosphate 5-phosphatase activity
  directly_involved_in:
  - id: GO:0046856
    label: phosphatidylinositol dephosphorylation
  locations:
  - id: GO:0005929
    label: cilium
  supported_by:
  - reference_id: PMID:10764818
    supporting_text: It is a highly basic protein (pI = 8.8) and has the greatest affinity toward phosphatidylinositol
      3,4,5-trisphosphate of known 5-phosphatases.
  - reference_id: PMID:19668215
    supporting_text: Inpp5e inactivation did not impair ciliary assembly but altered the stability of
      pre-established cilia after serum addition.
  - reference_id: PMID:19668215
    supporting_text: Together, our results show that INPP5E plays an essential role in the primary cilium
      by controlling ciliary growth factor and PI3K signaling and stability, and highlight the consequences
      of INPP5E dysfunction.
suggested_questions:
- question: Is PI(3,4,5)P3 or PI(4,5)P2 the physiologically dominant INPP5E substrate in the ciliary membrane,
    and does this differ between cell types?
- question: Should the ciliary-membrane location (GO:0060170) be annotated directly for INPP5E, given
    that it acts on ciliary membrane lipids while being described as axonemal?
- question: Does INPP5E have any function in the Golgi or nucleus, or are these pools transit/storage?
suggested_experiments:
- hypothesis: Ciliary PI(4)P generation by INPP5E is sufficient to exclude TULP3 and GPR161 from cilia.
  description: Replace endogenous INPP5E with a cilium-targeted heterologous 5-phosphatase (or catalytic-dead
    INPP5E) in INPP5E-null human cells and quantify ciliary PI(4,5)P2, TULP3 and GPR161.
  experiment_type: Targeted enzyme replacement
- hypothesis: INPP5E substrate preference in vivo differs from in vitro kinetics.
  description: Lipidomics of isolated cilia from wild-type and INPP5E-null cells to quantify PI(4,5)P2,
    PI(3,4,5)P3 and PI(3,4)P2.
  experiment_type: Ciliary lipidomics
