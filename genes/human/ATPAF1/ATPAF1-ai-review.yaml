      as a peripheral inner-membrane protein by similarity to mouse Q811I0, but I could not trace the
      experimental basis of the mouse call. The cited mouse knockout study shows only mitochondrial colocalization
      with the F1 beta subunit. Yeast Atp11p is described as a chaperone acting on soluble F1 subunits
