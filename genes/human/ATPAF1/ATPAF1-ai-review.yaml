- term:
    id: GO:0033615
    label: mitochondrial proton-transporting ATP synthase complex assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2180560
  - PANTHER:PTN000319591
  - SGD:S000005259
  review:
    summary: Mitochondrial proton-transporting ATP synthase complex assembly (IBA). Atp11p/ATPAF1 is required
      to assemble the alpha and beta subunits into F1, and Atpaf1-knockout mouse hearts have less F1 and
      fewer ATP synthase dimers. Core process.
    action: ACCEPT
    reason: '[PMID:12206899 "Our work, which employs the yeast Saccharomyces cerevisiae as a model system
      for studies of mitochondrial function, has provided evidence that assembly of the mitochondrial
      alpha and beta subunits into the F(1) oligomer requires two molecular chaperone proteins called
      Atp11p and Atp12p."] [PMID:34375736 "Western blots and Blue-Native electrophoresis (BN-PAGE) demonstrated
      a decreased F1 content and ATP synthase dimers in the Atpaf1-KO heart."] [PMID:34375736 "The results
      provide strong support that ATPAF1 is essential for ATP synthase assembly and mitochondrial oxidative
      phosphorylation, thus playing a crucial role in maintaining cardiac structure and function in animals."]'
    supported_by:
    - reference_id: PMID:12206899
      supporting_text: Our work, which employs the yeast Saccharomyces cerevisiae as a model system for
        studies of mitochondrial function, has provided evidence that assembly of the mitochondrial alpha
        and beta subunits into the F(1) oligomer requires two molecular chaperone proteins called Atp11p
        and Atp12p.
    - reference_id: PMID:34375736
      supporting_text: Western blots and Blue-Native electrophoresis (BN-PAGE) demonstrated a decreased
        F1 content and ATP synthase dimers in the Atpaf1-KO heart.
    - reference_id: PMID:34375736
      supporting_text: The results provide strong support that ATPAF1 is essential for ATP synthase assembly
        and mitochondrial oxidative phosphorylation, thus playing a crucial role in maintaining cardiac
        structure and function in animals.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      residue_claims_not_applicable: No residue-level claim is propagated.
      source_entities:
      - source_id: PANTHER:PTN000319591
        source_status: SUPPORTS_TRANSFER
        comment: Atp11 family node; F1 assembly is the conserved function.
