- id: PMID:34375736
  title: ATPAF1 deficiency impairs ATP synthase assembly and mitochondrial respiration.
  findings:
  - statement: Atpaf1-KO hearts have less F1 and fewer ATP synthase dimers.
    supporting_text: Western blots and Blue-Native electrophoresis (BN-PAGE) demonstrated a decreased
      F1 content and ATP synthase dimers in the Atpaf1-KO heart.
  - statement: ATPAF1 colocalizes with ATP5B in mitochondria.
    supporting_text: We confirmed that ATPAF1 was co-localized with the mitochondrial β-subunit ATP5B
      via immunofluorescence staining, which was consistent with previous studies (Saito et al.
  - statement: Atpaf1-KO mice are small, with high lactate.
    supporting_text: While the Atpaf2-KO mice were embryonically lethal, Atpaf1-KO mice grew to adulthood
      but with smaller body sizes and elevated blood lactate later in life.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse knockout.
