id: Q5TC12
gene_symbol: ATPAF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATPAF1 (ATP11) is a mitochondrial assembly factor for F1F0 ATP synthase, the human homolog
  of yeast Atp11p. It acts as a molecular chaperone that binds unassembled F1 beta subunits (ATP5F1B),
  preventing their aggregation and keeping them competent to assemble with alpha subunits into the alpha3beta3
  catalytic core. Human ATPAF1 complements the yeast atp11 mutant. It is expressed broadly and constitutively.
  Atpaf1-knockout mice survive but are smaller, with raised blood lactate, and their hearts have less
  F1, fewer ATP synthase dimers, abnormal cristae and impaired respiration.
