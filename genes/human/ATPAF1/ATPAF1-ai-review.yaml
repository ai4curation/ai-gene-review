suggested_questions:
- question: Is human ATPAF1 a soluble matrix chaperone, as Atp11p is in yeast, or peripherally associated
    with the inner membrane, and do ATPAF1 variants cause ATP synthase deficiency in patients?
- question: Should ATPAF1's anti-aggregation holdase role (protein folding chaperone, GO:0044183, used
    in its affinage grounding) be annotated in addition to complex-stabilizing activity? GOA currently
    carries only GO:0140777, which captures the client-specific assembly role.
suggested_experiments:
- description: Use protease protection and carbonate extraction of human mitochondria to place ATPAF1
    in the matrix or on the inner membrane, and screen ATP synthase-deficient patients for ATPAF1 variants.
