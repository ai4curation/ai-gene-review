id: P05412
gene_symbol: JUN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'JUN encodes c-Jun, a nuclear bZIP AP-1 transcription factor that binds AP-1 cis-regulatory DNA as a Jun-family
  homodimer or as a heterodimer with FOS-, ATF-, or BATF-family partners to regulate RNA polymerase II transcription. c-Jun
  activity is controlled by phosphorylation and ubiquitin-mediated turnover and is deployed in many stimulus-specific transcriptional
  programs, including JNK, TGF-beta, KRAS, stress, and viral reactivation responses.'
existing_annotations:
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:2833704
  qualifier: involved_in
  review:
    summary: negative regulation of transcription by RNA polymerase II is supported but peripheral to the core
      Jun-family AP-1 mechanism.
    action: KEEP_AS_NON_CORE
    reason: The term describes a regulatory interaction, partner-specific output, homodimerization, repressor case, or
      ubiquitin-ligase connection rather than the conserved bZIP AP-1 transcription-factor function itself.
    supported_by:
    - reference_id: file:human/JUN/JUN-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Transcription factor that recognizes and binds to the AP-1 consensus motif 5'-TGA[GC]TCA-3'
