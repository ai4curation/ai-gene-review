id: P51116
gene_symbol: FXR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FXR2 encodes the less-characterized vertebrate paralog of FMR1 and FXR1. It is a cytoplasmic
  RNA-binding protein with conserved KH and RGG regions that can homo- and heteromerize with the other
  fragile-X-related proteins. PAINT and UniProt project family mRNA-stability and translation-regulatory
  functions onto FXR2, and mouse Fxr2 supports neuronal NOG mRNA regulation, but human FXR2 has far less
  direct functional evidence than FXR1 or FMR1. Human cellular work also places FXR2 in a shared FXR-family
  pathway at the nuclear envelope, where depletion of any one FXR protein can promote cytoplasmic nucleoporin
  condensates.'
existing_annotations:
- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004087
  review:
    summary: RNA binding is the informative descendant of nucleic acid binding.
    action: MODIFY
    reason: The InterPro KH-domain inference is consistent with RNA recognition by FMR/FXR-family 
      proteins, not with a separate DNA-binding activity. Replace the broad nucleic-acid term with 
      the independently supported RNA binding term.
    proposed_replacement_terms:
    - id: GO:0003723
      label: RNA binding
    supported_by:
    - reference_id: PMID:7489725
      supporting_text: "FXR2 encodes a 74\nkDa protein which, like FMR1, contains two KH domains, has
        the capacity to bind\nRNA and is localized to the cytoplasm."
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: RNA binding is a conserved FXR molecular function.
    action: ACCEPT
    reason: The FMR/FXR proteins contain conserved KH and RGG RNA-binding regions, and the curated 
