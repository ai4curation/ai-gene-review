  - MGI:MGI:104860
  - MGI:MGI:95564
  - PANTHER:PTN001318100
  - UniProtKB:P51114
  - UniProtKB:Q06787
  review:
    summary: 3'-UTR binding is supported for the FXR family.
    action: ACCEPT
    reason: PAINT places mRNA 3'-UTR binding at the family root, and human FXR1 directly binds 
      ARE-containing 3'-UTRs in TNF and cMYC reporters. The FXR2 row remains an inherited family 
      assertion, but its RNA-binding domains are conserved in the FXR2 subfamily.
    supported_by:
