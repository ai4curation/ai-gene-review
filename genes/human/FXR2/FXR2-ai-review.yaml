core_functions:
- description: FXR2 is an FMR/FXR-family mRNA-binding protein that forms homo- and heteromeric RNP 
    complexes and is expected to regulate the stability and translation of selected mRNAs. Direct 
    human support is strongest for RNA binding, cytoplasmic localization and paralog interaction, 
    while most process annotations are inherited from FMR1, FXR1 or mouse Fxr2.
  molecular_function:
    id: GO:0003729
    label: mRNA binding
  directly_involved_in:
  - id: GO:0043488
    label: regulation of mRNA stability
  - id: GO:0045727
    label: positive regulation of translation
  locations:
