    id: GO:0003729
    label: mRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR040148
  review:
    summary: mRNA binding is retained as a core FXR activity.
    action: ACCEPT
    reason: The FMR/FXR proteins act as mRNA-binding regulators of translation and mRNA stability. 
      The term is broad but appropriate because FXR1 and FMR1 bind target RNAs outside 3'-UTRs as 
      well as within 3'-UTRs.
    supported_by:
    - reference_id: file:genes/human/FXR2/FXR2-uniprot.txt
      supporting_text: "mRNA-binding protein that acts as a regulator of mRNAs\nCC       translation and/or
