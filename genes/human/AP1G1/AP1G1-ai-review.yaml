    sigma, while gamma coat/accessory contacts support assembly and regulated membrane recruitment. Human
    gamma cargo-recognition and ear-structure evidence is distinguished from mouse gamma clathrin and
    mixed-species core reconstitution; the activity belongs to the assembled adaptor rather than autonomous
    gamma.'
