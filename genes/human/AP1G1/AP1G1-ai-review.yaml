id: O43747
gene_symbol: AP1G1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AP1G1 encodes gamma-1 adaptin, a large subunit of the heterotetrameric AP-1 clathrin adaptor
  complex. It helps couple cargo sorting at the trans-Golgi network and endosomes to coat assembly: the
  gamma/sigma hemicomplex recognizes acidic dileucine signals, while gamma hinge and appendage regions
  engage clathrin and accessory proteins. AP-1 cycles between cytosol and peripheral membrane coats and
  supports intracellular vesicular transport and recycling. Gamma-1 participates in specialized routes
  to melanosomes and lytic granules, and in the epithelial AP-1B complex. Pathogenic AP1G1 variants can
  disturb endosomal recycling and cause neurodevelopmental disease.'
alternative_products:
- name: '1'
  id: O43747-1
- name: '2'
  id: O43747-2
  sequence_note: VSP_040133
