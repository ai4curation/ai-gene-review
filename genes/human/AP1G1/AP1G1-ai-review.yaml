suggested_questions:
- question: Which original target-specific experiment supports the three lysosomal-membrane assertions,
    as distinct from a transient coat on lysosome-destined carriers?
- question: Which AP1G1-specific release assay supports the NK-cell degranulation assertion, beyond perforin
    delivery and target-cell lysis?
- question: What experiments support the rat collagen-binding and specialized presynaptic donor annotations,
    and the exact PAINT placement of the inherited AP-1 activities?
