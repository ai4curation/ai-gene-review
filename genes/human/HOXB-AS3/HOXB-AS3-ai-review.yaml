  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      Full text read (PMC8358592). Cell-line study in Cal-27 and UM2. Peptide-level
      attribution rests on ORF re-expression rescuing an shRNA knockdown of the whole
      transcript. The IGF2BP2 interaction is one co-IP of an overexpressed tagged peptide;
      "directly binding" and "stabilize" are not tested (no direct-binding assay, no mRNA or
      protein half-life measurement). The authors note there were no in vivo experiments.
