  - MGI:MGI:1095413
  - MGI:MGI:894275
  - PANTHER:PTN000087518
  - RGD:621322
  review:
    summary: >-
      LFNG regulates Notch signaling by glycosylating Notch receptors, shifting ligand preference
      (PTN000087518).
    action: ACCEPT
    reason: >-
      Core process: direction-neutral term appropriate because Fringe both enhances Delta-like
      and inhibits Jagged signaling.
    supported_by:
    - reference_id: file:human/LFNG/LFNG-uniprot.txt
      supporting_text: >-
        resulting in inhibition of NOTCH1 activation by JAG1 and enhancement of NOTCH1 activation
        by DLL1 via an increase in its binding to DLL1
    - reference_id: PMID:11346656
      supporting_text: >-
        We also found that both fringe proteins reduced Jagged1-triggered Notch2 signaling,
        whereas neither affected Delta1-triggered Notch2 signaling.
    - reference_id: PMID:10935626
      supporting_text: >-
        We obtained biological evidence that Fringe-dependent elongation of O-linked fucose
        on Notch modulates Notch signalling by using co-culture assays in mammalian cells
