  - MGI:MGI:894275
  - PANTHER:PTN000087518
  - UniProtKB:O00587
  - UniProtKB:Q8NES3
  review:
    summary: >-
      LFNG is the fucose-specific beta1,3-GlcNAc-transferase that elongates O-fucose on Notch
      EGF repeats (PTN000087518 for the IBA).
    action: ACCEPT
    reason: >-
      Core catalytic activity; demonstrated biochemically for mammalian Fringe proteins and
      confirmed for human LFNG by loss of activity of an SCDO3 DxD-motif variant.
    supported_by:
    - reference_id: PMID:10935626
      supporting_text: >-
        Drosophila and mammalian Fringe proteins possess a fucose-specific beta1,3 N-acetylglucosaminyltransferase
        activity that initiates elongation of O-linked fucose residues attached to epidermal
        growth factor-like sequence repeats of Notch.
    - reference_id: PMID:30531807
      supporting_text: >-
        The missense variant was in the DxD motif, an active-site motif of the glycosyltransferase,
        and its loss of the enzyme function was confirmed by an in vitro enzyme assay.
    - reference_id: file:human/LFNG/LFNG-uniprot.txt
      supporting_text: >-
        Glycosyltransferase that initiates the elongation of O-linked fucose residues attached
        to EGF-like repeats in the extracellular domain of Notch molecules.
