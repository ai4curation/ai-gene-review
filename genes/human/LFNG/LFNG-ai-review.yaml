id: Q8NES3
gene_symbol: LFNG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LFNG (Lunatic fringe) is a Golgi-resident, single-pass type II membrane glycosyltransferase
  of the Fringe family (GT31; EC 2.4.1.222). Using UDP-GlcNAc and a Mn2+-dependent DxD active
  site, it transfers beta1,3-linked N-acetylglucosamine onto O-linked fucose (added by POFUT1)
  on specific EGF-like repeats of Notch receptor ectodomains, initiating elongation of the
  O-fucose glycan. This modification changes ligand selectivity of Notch: it enhances NOTCH1
  activation by Delta-like ligands (DLL1) and reduces activation by Jagged ligands (e.g. JAG1-NOTCH2
  binding and signaling). Oscillating LFNG expression is a core component of the vertebrate
  segmentation clock, and LFNG is also required for boundary formation, T-cell and marginal-zone
  B-cell development in mouse. Biallelic loss-of-function variants cause spondylocostal dysostosis
  type 3 with vertebral segmentation defects.
