core_functions:
- description: ERK1 is a MEK-activated, proline-directed serine/threonine MAP kinase that phosphorylates protein
    substrates at Ser/Thr-Pro motifs, acting as a terminal kinase of the ERK1/ERK2 cascade in the cytosol and nucleus.
  molecular_function: *id007
  directly_involved_in:
  - *id005
  - *id009
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: file:human/MAPK3/MAPK3-uniprot.txt
    supporting_text: Serine/threonine kinase which acts as an essential component of the MAP kinase signal transduction
      pathway
  - reference_id: file:human/MAPK3/MAPK3-uniprot.txt
    supporting_text: Phosphorylated by MAP2K1/MEK1 and MAP2K2/MEK2 on Thr-202 and Tyr-204 in response to external
      stimuli like insulin or NGF. Both phosphorylations are required for activity.
  - reference_id: PMID:8388392
    supporting_text: The purified MEK2 protein stimulated threonine and tyrosine phosphorylation on ERK1 and concomitantly
      activated ERK1 kinase activity more than 100-fold.
  - reference_id: PMID:35216969
    supporting_text: An in vitro kinase assay confirmed the ability of recombinant activated ERK1 to directly phosphorylate
      DEPTOR on S235
  - reference_id: file:human/MAPK3/MAPK3-deep-research-falcon.md
    supporting_text: MAPK3 is an ATP-dependent, proline-directed protein serine/threonine kinase.
- description: ATP binding in the kinase active site supplies the phosphoryl donor for ERK1 Ser/Thr kinase catalysis.
  molecular_function:
    id: GO:0005524
    label: ATP binding
  directly_involved_in:
  - *id009
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: file:human/MAPK3/MAPK3-deep-research-falcon.md
    supporting_text: MAPK3 is an ATP-dependent, proline-directed protein serine/threonine kinase.
proposed_new_terms: []
suggested_questions:
- question: Which ERK-dependent process annotations for MAPK3 (e.g. BMP, IL-1, IL-34, telomere maintenance) rest
    on ERK1-specific perturbation rather than pan-ERK1/2 inhibitors, and should the pan-ERK ones be shared with
    MAPK1 rather than asserted per paralog?
- question: What was the intended reference for the GO:0071260 cellular response to mechanical stimulus IEP row
    attributed to PMID:19593445 in the 2011 UniProt batch?
- question: Is there ERK1-specific (versus ERK2) evidence for localization to caveolae and focal adhesions in human
    cells, beyond rat ortholog data?
suggested_experiments:
- description: Isoform-selective ERK1 knockout/rescue with analog-sensitive ERK1 and quantitative phosphoproteomics
    to define substrates phosphorylated by ERK1 but not ERK2 in human cells.
- description: Live-cell imaging of endogenously tagged ERK1 versus ERK2 to compare nuclear translocation kinetics
    and compartment-restricted pools (endosome, Golgi, focal adhesion) after growth factor stimulation.
