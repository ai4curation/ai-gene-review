id: P27361
gene_symbol: MAPK3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MAPK3 encodes ERK1 (p44-MAPK), a CMGC-family, proline-directed serine/threonine protein kinase that,
  together with its close paralog ERK2 (MAPK1), forms the terminal kinase tier of the RAS-RAF-MEK-ERK (ERK1/ERK2)
  MAP kinase cascade. ERK1 is activated by MEK1/MEK2-catalysed dual phosphorylation of Thr202 and Tyr204 in its
  TEY activation-loop motif, and is inactivated by dual-specificity (DUSP) and tyrosine phosphatases. Active ERK1
  transfers phosphate from ATP to Ser/Thr-Pro motifs on a large set of substrates selected through D-motif and DEF
  docking interactions, including kinases (RSK, MSK, MNK), transcription factors (ELK1 and other immediate-early
  regulators), cytoskeletal and adhesion proteins, and feedback targets such as SOS1 and DUSPs. ERK1 is largely
  cytoplasmic in resting cells, anchored by MEK, PEA-15 and other scaffolds, and accumulates in the nucleus after
  activation, so that its outputs span transcription, translation, cell-cycle progression, survival, differentiation
  and migration. ERK1 and ERK2 are about 83% identical and largely redundant; ERK1-null mice are viable, with more
  restricted neuronal, immune and metabolic phenotypes.
