- id: PMID:36522428
  title: Structural basis of the acyl-transfer mechanism of human GPAT1.
  full_text_unavailable: true
  findings:
  - statement: Cryo-EM structures of human GPAT1 show an N-terminal acyltransferase domain with the catalytic
      motifs, a C-terminal domain needed for folding, and peripheral membrane association via an amphipathic
      patch and an N-terminal loop-helix containing the mitochondrial-targeting signal (no transmembrane
      helices).
    supporting_text: Unexpectedly, GPAT1 has no transmembrane regions as previously proposed but instead
      associates with the membrane via an amphipathic surface patch and an N-terminal loop-helix region
      that contains a mitochondrial-targeting signal.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary human structural and functional study. It supersedes the older two-transmembrane-helix
      topology model repeated in the deep-research report.
- id: PMID:12417724
  title: Mitochondrial glycerol-3-phosphate acyltransferase-deficient mice have reduced weight and liver
    triacylglycerol content and altered glycerolipid fatty acid composition.
  findings:
  - statement: Gpam-null mice have lower hepatic and plasma triacylglycerol and less palmitate at sn-1 of
      hepatic PC and PE, establishing an in vivo role of the SF16 ortholog in triacylglycerol synthesis
      and phospholipid acyl composition.
    supporting_text: These data confirm the important role of mtGPAT in the synthesis of triacylglycerol
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mouse Gpam (Q61586) is in PANTHER PTHR12563:SF16 with human GPAM.
