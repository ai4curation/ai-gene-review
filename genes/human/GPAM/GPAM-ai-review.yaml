id: Q9HCL2
gene_symbol: GPAM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GPAM encodes mitochondrial glycerol-3-phosphate acyltransferase 1, which transfers a fatty
  acyl group from acyl-CoA to the sn-1 position of glycerol-3-phosphate to produce lysophosphatidic acid.
  This early glycerolipid-biosynthetic reaction supplies precursors for membrane phospholipids and triacylglycerols.
  GPAT1 associates with the mitochondrial outer membrane through an amphipathic surface and an N-terminal
  targeting region.
