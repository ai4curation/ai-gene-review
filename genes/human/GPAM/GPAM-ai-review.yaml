- id: PMID:18238778
  title: AGPAT6 is a novel microsomal glycerol-3-phosphate acyltransferase.
  findings:
  - statement: Used by UniProt (ECO:0000269) as an experimental source for GPAT1 (GPAM) function and catalytic
      activity, including the core sn-glycerol-3-phosphate + acyl-CoA -> 1-acyl-LPA + CoA reaction. The
      abstract foregrounds the paralog AGPAT6/GPAT4.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached entry is abstract-only and the abstract describes AGPAT6/GPAT4 (a microsomal
      paralog). UniProt cites PubMed:18238778 with ECO:0000269 for GPAM's FUNCTION and multiple catalytic-activity
      reactions, so the full text also characterizes GPAT1; the GPAM annotations sourced from it are experimental
      and retained per policy.
  full_text_unavailable: true
- id: PMID:19075029
  title: The microsomal cardiolipin remodeling enzyme acyl-CoA lysocardiolipin acyltransferase is an acyltransferase
    of multiple anionic lysophospholipids.
  findings:
