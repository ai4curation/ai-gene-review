id: Q9HCL2
gene_symbol: GPAM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GPAM encodes glycerol-3-phosphate acyltransferase 1 (GPAT1), the mitochondrial, N-ethylmaleimide-resistant
  glycerol-3-phosphate acyltransferase of the GPAT/DHAPAT (PlsB-like) acyltransferase family. GPAT1 transfers
  a long-chain fatty acyl group, preferentially a saturated palmitoyl group, from acyl-CoA to the sn-1
  position of sn-glycerol 3-phosphate, producing 1-acyl lysophosphatidic acid. This is the first step
  of de novo glycerolipid synthesis; the lysophosphatidic acid is then acylated to phosphatidic acid
  by other enzymes and routed into diacylglycerol, triacylglycerol and glycerophospholipids. GPAT1 acts
  on the cytosolic face of the mitochondrial outer membrane, which it binds peripherally through an amphipathic
  surface patch and an N-terminal loop-helix region carrying the mitochondrial-targeting signal rather
  than through transmembrane helices. Its catalytic N-terminal acyltransferase domain contains the HXXXXD
  motif and is stabilised by a tightly associated C-terminal domain. GPAT1 is abundant in liver and adipose
  tissue, is induced under lipogenic conditions, and in mouse knockouts is needed to channel newly synthesised
  fatty acids into triacylglycerol, to place palmitate at the sn-1 position of phospholipids, and to divert
  fatty acids away from mitochondrial beta-oxidation.
