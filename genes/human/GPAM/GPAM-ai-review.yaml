core_functions:
- description: Glycerol-3-phosphate acyltransferase acting on the cytosolic face of the mitochondrial outer
    membrane. It transfers a long-chain (preferentially saturated, 16:0) acyl group from acyl-CoA to the
    sn-1 position of glycerol 3-phosphate, forming 1-acyl lysophosphatidic acid. This is the first step
    of de novo phosphatidic acid and triacylglycerol synthesis.
  molecular_function:
    id: GO:0004366
    label: glycerol-3-phosphate O-acyltransferase activity
