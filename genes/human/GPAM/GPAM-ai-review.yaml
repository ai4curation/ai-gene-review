proposed_new_terms: []
suggested_questions:
- question: Does the HuRI GPAM-CIDEB binary interaction reflect a functional association at mitochondria-lipid
    droplet contacts, given that CIDE proteins act on lipid droplets in hepatocytes where GPAT1 drives
    triacylglycerol synthesis?
- question: Is the lysophosphatidylglycerol acyltransferase activity attributed to GPAM (RHEA:33203) a physiologically
    relevant activity of the native enzyme, or a side activity of overexpressed protein?
- question: How does lysophosphatidic acid made by GPAT1 on the outer mitochondrial membrane reach the
    ER-resident AGPAT, lipin and DGAT enzymes that complete phosphatidic acid and triacylglycerol synthesis?
suggested_experiments:
- description: Assay purified human GPAT1 for acylation of 1-acyl-lysophosphatidylglycerol versus glycerol
    3-phosphate under matched conditions, and test catalytic HXXXXD mutants (H230A, D235A), to establish
    whether the lysophospholipid acyltransferase activity is intrinsic.
  experiment_type: in vitro enzyme kinetics
- description: Co-immunoprecipitation and proximity labelling of endogenous GPAT1 with CIDEB in hepatocytes,
    combined with lipidomics after CIDEB loss, to test whether the HuRI interaction has a role in channelling
    GPAT1 products to lipid droplets.
  experiment_type: proximity labelling / lipidomics
