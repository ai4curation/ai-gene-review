    supported_by:
    - reference_id: PMID:22505714
      supporting_text: Bnip3 contains a C-terminal transmembrane domain that is essential for homodimerization
        and proapoptotic function. In this study, we show that homodimerization of Bnip3 is also a requirement
        for induction of autophagy.
    - reference_id: PMID:9396766
      supporting_text: Nip3 is detected as both a 60- and 30-kD protein in vivo and in vitro and exhibits
        strong homologous interaction in a yeast two-hybrid system indicating that it can homodimerize.
