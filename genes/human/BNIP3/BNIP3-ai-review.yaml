  review:
    summary: BNIP3 forms stable homodimers through its C-terminal transmembrane helix (GxxxG-type packing).
      Homodimerization is required for both its pro-death and its autophagy-inducing activities.
    action: KEEP_AS_NON_CORE
    reason: Self-association is real and functionally important, but it is a structural property, not
