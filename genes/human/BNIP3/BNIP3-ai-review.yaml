  review:
    summary: BNIP3 has historically been linked to "autophagic cell death", but direct human-cell studies
      show BNIP3-induced death is necrosis-like (PT pore opening), and BNIP3-driven hypoxic autophagy
      is protective.
    action: MARK_AS_OVER_ANNOTATED
    reason: Electronic ortholog transfer of a contested process concept. The evidence supports BNIP3 promoting
      autophagy and, separately, necrosis-like death. It does not show that autophagy is the means by
      which cells die.
