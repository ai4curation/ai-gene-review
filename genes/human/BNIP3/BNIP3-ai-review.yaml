    label: autophagy of mitochondrion
  evidence_type: NAS
  original_reference_id: PMID:22505714
  qualifier: involved_in
  review:
    summary: BNIP3 is an LC3-binding autophagy receptor that targets mitochondria (and ER) for autophagic
      removal; LIR mutation reduces mitophagy.
    action: ACCEPT
    reason: Core function; well supported by PMID:22505714.
    supported_by:
    - reference_id: PMID:22505714
      supporting_text: Our data indicate that Bnip3 regulates the apoptotic balance as an autophagy receptor
        that induces removal of both mitochondria and ER.
    - reference_id: PMID:22505714
      supporting_text: Although ablation of the Bnip3-LC3 interaction by mutating the LC3 binding site
        did not impair the prodeath activity of Bnip3, it significantly reduced both mitophagy and ERphagy.
