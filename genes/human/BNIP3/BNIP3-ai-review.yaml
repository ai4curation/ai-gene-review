core_functions:
- description: Selective autophagy receptor for mitochondria. BNIP3 in the mitochondrial outer membrane
    binds LC3/GABARAP via its N-terminal LIR, after homodimerizing through its transmembrane helix. This
    tethers mitochondria to autophagosomes during hypoxia- and stress-induced mitophagy.
  molecular_function:
    id: GO:0140580
    label: mitochondrion autophagosome adaptor activity
  directly_involved_in:
  - id: GO:0000423
    label: mitophagy
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:22505714
    supporting_text: The clearance of these organelles was mediated in part via binding of Bnip3 to LC3
      on the autophagosome.
  - reference_id: PMID:22505714
    supporting_text: Although ablation of the Bnip3-LC3 interaction by mutating the LC3 binding site did
      not impair the prodeath activity of Bnip3, it significantly reduced both mitophagy and ERphagy.
  - reference_id: PMID:22505714
    supporting_text: Bnip3 contains a C-terminal transmembrane domain that is essential for homodimerization
      and proapoptotic function. In this study, we show that homodimerization of Bnip3 is also a requirement
      for induction of autophagy.
- description: Selective autophagy receptor for the ER. An ER-membrane pool of BNIP3 uses the same LIR
    to target ER for autophagic degradation (ER-phagy).
  molecular_function:
    id: GO:0140506
    label: endoplasmic reticulum-autophagosome adaptor activity
  directly_involved_in:
  - id: GO:0061709
    label: reticulophagy
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:22505714
    supporting_text: In addition, we discovered that endogenous Bnip3 is localized to both mitochondria
      and the endoplasmic reticulum (ER).
  - reference_id: PMID:22505714
    supporting_text: We also discovered that Bnip3 induced removal of both ER (ERphagy) and mitochondria
      (mitophagy) via autophagy.
- description: Hypoxia-induced promotion of macroautophagy. HIF-induced BNIP3 (redundantly with BNIP3L)
    is required for hypoxia-induced autophagy, and its atypical BH3 domain can release Beclin 1 from BCL-2
    without triggering death.
  directly_involved_in:
  - id: GO:0016239
    label: positive regulation of macroautophagy
  - id: GO:0071456
    label: cellular response to hypoxia
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:19273585
    supporting_text: the combined silencing of these two HIF targets suppresses hypoxia-mediated autophagy
  - reference_id: PMID:19273585
    supporting_text: Herein, we propose a model in which the atypical BH3 domains of hypoxia-induced BNIP3/BNIP3L
      have been designed to induce autophagy by disrupting the Bcl-2-Beclin1 complex without inducing
      cell death.
proposed_new_terms: []
suggested_questions:
- question: Which signals decide whether BNIP3 drives protective mitophagy/ER-phagy or necrosis-like death,
    and is the switch set by phosphorylation near the LIR or by its abundance (FBXL4/PPTC7 turnover)?
- question: Is BNIP3-mediated ER-phagy physiologically significant in vivo, or mainly a result of overexpression/ER-targeted
    constructs?
suggested_experiments:
- hypothesis: BNIP3 LIR-dependent mitophagy and its pro-death activity are separable.
  description: In BNIP3/BNIP3L double-knockout cells, express LIR-mutant, BH3-mutant and TM-dimerization-mutant
    BNIP3 at endogenous-like levels under hypoxia, and quantify mitophagy (mt-Keima), ER-phagy (ER-Keima)
    and cell death (PI uptake, PTP opening).
  experiment_type: structure-function rescue
