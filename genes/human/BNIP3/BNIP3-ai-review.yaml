id: Q12983
gene_symbol: BNIP3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BNIP3 (BCL2/adenovirus E1B 19 kDa protein-interacting protein 3; NIP3) is an atypical BH3-only
  member of the BCL-2 family and the paralog of BNIP3L/NIX. It is a tail-anchored membrane protein with
  a C-terminal transmembrane helix that inserts it into the mitochondrial outer membrane and also the
  endoplasmic reticulum; the same helix drives stable homodimerization. Its N-terminal cytosolic region
  contains an LC3-interacting region (LIR), through which BNIP3 binds Atg8-family proteins and acts as
  a selective autophagy receptor that delivers mitochondria (mitophagy) and ER (ER-phagy) to autophagosomes.
  BNIP3 is strongly induced by hypoxia through HIF-1. Together with NIX it is required for hypoxia-induced
  autophagy, partly because its atypical BH3 domain releases Beclin 1 from BCL-2. BNIP3 also takes part
  in Mieap/SPATA18-dependent intramitochondrial quality control (MALM) and inhibits OPA1-mediated fusion.
  When overexpressed or under some stresses it promotes cell death, typically necrosis-like death through
  opening of the permeability transition pore and loss of membrane potential rather than classical cytochrome
  c/caspase apoptosis. Basal BNIP3 levels are kept low by SCF(FBXL4)/PPTC7-dependent ubiquitination and
  proteasomal turnover.
