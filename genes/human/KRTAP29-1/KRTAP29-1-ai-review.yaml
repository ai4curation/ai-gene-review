  review:
    summary: Keratin filament, assigned from the InterPro keratin-matrix/KAP signature (InterPro2GO).
    action: ACCEPT
    reason: KAPs are the interfilamentous matrix proteins of the hair fibre; they surround and are disulfide cross-linked to hair keratin intermediate filaments, so association with keratin filaments is the defining location of the family to which KRTAP29-1 belongs. Strictly the KAP matrix lies between filaments, but GO has no separate term for the keratin-associated matrix.
