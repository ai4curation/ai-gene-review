  qualifier: enables
  supporting_entities:
  - InterPro:IPR007659
  review:
    summary: Structural molecule activity, assigned from the InterPro keratin-matrix signature (InterPro2GO).
    action: MODIFY
    reason: 'The structural role is correct but the term is more general than warranted: KAPs contribute specifically to the structural integrity of the hair shaft, a cutaneous appendage. GO:0030281 structural constituent of cutaneous appendage (is_a GO:0005198; definition explicitly covers hairs) captures this. Hair keratins themselves are conventionally annotated (IBA) to GO:0030280 structural constituent of skin epidermis, but that definition refers to the skin epidermis rather than hair.'
    proposed_replacement_terms:
    - id: GO:0030281
      label: structural constituent of cutaneous appendage
    supported_by:
    - reference_id: PMID:18721477
      supporting_text: 'KRTAP contains two major groups: high/ultrahigh cysteine (HS) and high glycine-tyrosine (HGT) that are considered to have originated independently, and are essential for the formation of rigid and resistant hair shafts through their extensive disulfide bond cross-linking with the abundant cysteine residues of hair keratins or hydrophobic interactions with keratins'
    - reference_id: PMID:16382671
      supporting_text: Hair keratin-associated proteins (KAP) are a major component of the hair fiber, and play crucial roles in forming a strong hair shaft through a cross-linked network with keratin intermediate filaments (KIF), which are produced from hair keratins
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00029243
  review:
    summary: "ARBA-rule cytosol placement; KAPs are synthesized in the cytoplasm of keratinizing cortical cells but act in the keratin matrix."
    action: KEEP_AS_NON_CORE
    reason: "Keratin-associated proteins are non-membrane proteins synthesized in the cytoplasm of differentiating (keratinizing) hair or wool cortical cells, so a cytoplasmic/cytosolic placement is true of the newly made protein. It is not the site of function: KAPs act in the interfilamentous matrix around trichocyte keratin intermediate filaments of the keratinized cell, which this review captures with keratin filament (GO:0045095). The placement is correct but peripheral, so it is kept as non-core rather than marked as over-annotated; ARBA IEA and Reactome TAS cytosol rows are treated identically across the KRTAP family reviews."
    supported_by:
    - reference_id: Reactome:R-HSA-6809663
      supporting_text: In the lower and middle cortex, keratin filaments are embedded in a matrix that consists of KAPs.
