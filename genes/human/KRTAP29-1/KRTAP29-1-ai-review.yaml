id: A8MX34
gene_symbol: KRTAP29-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KRTAP29-1 (keratin-associated protein 29-1) is a large (341 aa) cysteine-rich keratin-associated protein that UniProt places in the KRTAP type 10 family; it contains Keratin_B2_2-type cysteine-rich repeat regions characteristic of high/ultrahigh sulfur KAPs. By family membership it is predicted to be a hair-fibre matrix protein that is disulfide cross-linked to hair keratin intermediate filaments; no gene-specific expression or functional study has been reported.
