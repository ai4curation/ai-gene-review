description: ANKRD61 (ankyrin repeat domain-containing 61) is an uncharacterized 418-residue protein made
  largely of ankyrin repeats. UniProt classes it as predicted (protein existence level 4), and its transcript
  is enriched in bone marrow and testis. A Human Protein Atlas antibody stains the nucleoplasm. No molecular
  activity or biological role is known.
