gene_symbol: MTRNR2L11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MTRNR2L11 is a nuclear human locus on chromosome 1 (1q43) that resembles the humanin
  small open reading frame of the mitochondrial large-subunit rRNA gene MT-RNR2, one of thirteen such
  MT-RNR2-like sequences in the human genome that are generally interpreted as nuclear insertions of
  mitochondrial DNA and are classed by HGNC as pseudogenes. Its predicted product, humanin-like 11
  (HN11), is a 24-residue peptide (MATRGFSCLLLVISEIDLSVKRWV) that matches humanin at 18 of 24 aligned
  positions, differing by Pro3->Thr, Leu12->Val, Thr13->Ile, Pro19->Ser, Arg23->Trp and Ala24->Val. Two
  of those changes fall on the positions that distinguish the nuclear copies functionally: position 19,
  part of one of the two segments humanin requires for secretion, and position 13, which has been
  implicated in cell-surface receptor binding and whose threonine-to-isoleucine form measurably reduces
  cytoprotection in the one nuclear humanin-like peptide that has been assayed. Unlike MTRNR2L1-MTRNR2L8,
  this locus has no recorded transcript-level evidence: UniProt lists it at protein existence level 3
  (inferred from homology), and the survey that defined the family reported expression for ten of the
  thirteen loci, not including this one. No HN11 peptide has been detected in human tissue or fluid, no
  molecular activity has been measured for it, and no binding partner or receptor interaction has been
  reported. The humanin peptide from which it is named is cytoprotective and antiapoptotic, binds BAX,
  BID, BIM and IGFBP3 intracellularly and signals through FPRL1/FPR2 and a CNTFR-alpha/WSX-1/gp130
  complex when secreted, but those properties were measured on the mitochondrially encoded peptide and
  on synthetic analogues of it, not on this gene product.'
