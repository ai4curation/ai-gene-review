    summary: Electronic mapping of UniProt's Secreted subcellular-location line for S4R3Y5. That line
      is itself annotated ECO:0000250 by similarity to humanin (UniProtKB:Q8IVG9), so the row carries
      no observation made on MTRNR2L11.
    action: REMOVE
    reason: "MTRNR2L11 is known only by homology (UniProt protein existence level 3, inferred from homology);
      it does not even have the transcript-level evidence that MTRNR2L1-MTRNR2L8 have, and no peptide
      from this locus has been detected in any compartment. UniProt's Secreted and Cytoplasm lines for
      S4R3Y5 are themselves ECO:0000250 by-similarity statements transferred from humanin (file:human/MTRNR2L11/MTRNR2L11-uniprot.txt),
      so both the ISS row (donor UniProtKB:Q8IVG9) and the subcellular-location IEA row state the same
      humanin claim, once directly and once via the controlled-vocabulary mapping. Secretion of humanin
      is not a generic property of the sequence: it depends on Leu9-Leu11 and on Pro19-Val20 [PMID:35372353],
      and Bodzioch et al. proposed on the alignment that position 19 is what decides whether a nuclear
      isoform is secreted at all [PMID:19477263]. In MTRNR2L11, Leu9-Leu11 is intact but Pro19 is replaced
      by serine, so one of the two segments humanin needs for secretion is altered. Because the asserted
      location depends on secretion determinants that are altered in this peptide, the row is not merely
      unverified but positively doubtful, and I remove it."
