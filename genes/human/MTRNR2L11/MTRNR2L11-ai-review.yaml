- term:
    id: GO:0048019
    label: receptor antagonist activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002141596
  - UniProtKB:Q8IVG9
  review:
    summary: Phylogenetic propagation of humanin's receptor antagonist activity to MTRNR2L11 from the
      humanin-family node PANTHER:PTN002141596. The grounding experiment is humanin competing with
      amyloid-beta at FPRL1 [PMID:15153530]; nothing comparable has been done with HN11.
    action: MARK_AS_OVER_ANNOTATED
    reason: "The IBD behind this row places the activity at the humanin-family node, and the placement
      is reasonable for the mitochondrial peptide: humanin is a genuine FPRL1 ligand and the antagonism
      of amyloid-beta at that receptor is directly observed [PMID:15153530]. Arguing with the row means
      asking whether MTRNR2L11 sits inside the clade that inherited the function, and the difficulty
      is that the question is not really phylogenetic. The nuclear MT-RNR2-like loci are copies of a
      mitochondrial rRNA segment, so descent in this tree tracks genomic sequence rather than a protein-coding
      lineage, and membership of the node does not establish that the ORF is translated, that the peptide
      is stable, or that it reaches a receptor - a point sharper here than for MTRNR2L1-L8, because this
      locus has no transcript-level evidence at all (UniProt protein existence level 3). On residues:
      HN11 substitutes Thr13, the position Bodzioch et al. singled out as the one that may matter for
      cell-surface receptor binding [PMID:19477263], and it does so with exactly the threonine-to-isoleucine
      change whose effect has been measured, in the HN5 peptide, as a reduction rather than a loss of
      activity [PMID:19477263]. It also loses Pro3 (humanin Pro3->Ala abolishes neuroprotective activity)
      and replaces Leu12 conservatively with valine (file:human/MT-RNR2__Q8IVG9/MT-RNR2__Q8IVG9-uniprot.txt),
      while keeping Ser7, Cys8, Leu9-Leu11 and Ser14. A second, term-level point applies to every member
      of this node: receptor antagonist activity describes humanin's competition with amyloid-beta at
      FPRL1, which is a property measured in a specific assay, whereas humanin also carries receptor
      ligand activity by IDA - so even for the donor the term captures one facet of the interaction.
      Because the only quantitative evidence about the T13I change says reduced, not abolished, this
      is an over-annotation rather than an error: it states an activity for a gene product that has never
      been shown to exist, let alone to engage a receptor."
    supported_by:
    - reference_id: PMID:15153530
      supporting_text: Humanin shares human FPRL1 and mouse FPR2 with Abeta(42) and suggest that
        Humanin may exert its neuroprotective effects by competitively inhibiting the access of
        FPRL1 to Abeta(42).
    - reference_id: PMID:19477263
      supporting_text: Proline vs serine in position 19 may determine whether the peptide is
        secreted or not, while threonine in position 13 may be important for cell surface receptor
        binding.
    - reference_id: PMID:19477263
      supporting_text: Cytoprotection against the STS-induced apoptosis conferred by the polymorphic
        HN5 variant, in which threonine in position 13 is replaced with isoleucine, is reduced
        compared to the wild type HN5 peptide.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002141596
