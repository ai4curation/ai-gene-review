- term:
    id: GO:1900118
    label: negative regulation of execution phase of apoptosis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002141596
  - UniProtKB:P0CJ72
  review:
    summary: Phylogenetic propagation of negative regulation of the execution phase of apoptosis to
      MTRNR2L11 from the humanin-family node. The co-listed donor is UniProtKB:P0CJ72 (MTRNR2L5), whose
      own evidence for this term is an IMP from an assay on synthetic HN5 peptide [PMID:19477263].
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The antiapoptotic function is the best-supported property of this family, and the IBD placement
      is sensible: humanin blocks BAX, BID and BIM and is antiapoptotic in many systems, and synthetic
      HN5 peptide - the product of one of these very nuclear loci - is cytoprotective against staurosporine-induced
      apoptosis [PMID:19477263]. That cuts against a blanket dismissal: a nuclear humanin-like sequence
      does retain cytoprotective activity when synthesised. What the row lacks for MTRNR2L11 is anything
      specific to this locus, and here the gap is wider than for its better-studied siblings. The locus
      has no transcript-level evidence in UniProt (protein existence level 3), the family survey reported
      expression for ten of the thirteen loci and not this one [PMID:19477263], the later lookup states
      the range as MTRNR2L1-MTRNR2L10 [PMID:31753007], a PubMed search for the symbol returns no papers
      of its own, and the systematic genetics lookup across all thirteen loci found no association with
      coronary artery disease and no significant expression QTL [PMID:31753007]. On residues: HN11 carries
      Thr13->Ile, the same substitution that measurably reduces HN5 cytoprotection [PMID:19477263], loses
      Pro3, and replaces Leu12 conservatively with valine, while keeping Ser7, Cys8, Leu9-Leu11 and Ser14
      (file:human/MT-RNR2__Q8IVG9/MT-RNR2__Q8IVG9-uniprot.txt). Reduced-but-retained is the right reading
      of that evidence, so I mark the row as an over-annotation rather than removing it: plausible, untested
      for this locus, and currently an assertion about the humanin sequence rather than about this gene
      product.'
    supported_by:
    - reference_id: PMID:19477263
      supporting_text: Cytoprotection against the STS-induced apoptosis conferred by the polymorphic
        HN5 variant, in which threonine in position 13 is replaced with isoleucine, is reduced
        compared to the wild type HN5 peptide.
    - reference_id: PMID:19477263
      supporting_text: At least ten of these nuclear genes are expressed in human tissues, and
