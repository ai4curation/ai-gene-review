suggested_questions:
- question: 'Is a peptide produced from the MTRNR2L11 locus at all? Everything annotated to this gene
    follows from the assumption that it is, and for this locus the assumption rests on nothing but an
    intact open reading frame: UniProt records protein existence level 3 (inferred from homology), and
    the survey that defined the family reported expression for ten of the thirteen loci without placing
    this one among them [PMID:19477263]. Targeted mass spectrometry, and a locus-resolved transcript
    measurement, would settle it.'
  experts:
  - Alan Saghatelian
  - Pinchas Cohen
  - Jonathan Wren
- question: How should GO treat a family in which one member has all the experimental evidence and
    twelve nuclear copies have none? The present solution propagates humanin's activity to most of the
    copies through PANTHER:PTN002141596, which produces gene products annotated as receptor antagonists
    and apoptosis regulators on the strength of one mitochondrial peptide. A node restricted to MT-RNR2
    plus MTRNR2L5, the two sequences with functional data, would say what is actually known.
- question: Why does MTRNR2L11, with six substitutions from humanin including Thr13->Ile and Pro19->Ser,
    carry the two IBA rows while MTRNR2L12, whose sequence is one residue from humanin, carries none?
    The PANTHER node membership rather than the sequence appears to decide, which makes the IBA coverage
    of this family inconsistent in a way that is visible from the alignment alone.
- question: Can any assay distinguish HN11 from humanin and from the other nuclear humanin-like peptides?
    HN11 matches humanin at 18 of 24 positions, so ELISA and antibody-based measurements of circulating
    humanin-like peptides - which exist in the clinical literature for other members of this family -
    cannot be assumed to be locus-specific. This question governs how all biomarker reports about this
    family should be read.
  experts:
  - Pinchas Cohen
suggested_experiments:
- description: Targeted (PRM) mass spectrometry of human tissue and plasma for peptides unique to HN11,
    using the positions at which it differs from humanin (Pro3->Thr, Leu12->Val, Thr13->Ile, Pro19->Ser,
    Arg23->Trp and Ala24->Val) to design discriminating transitions. This is the one experiment that
    would convert the entire annotation set on this gene from inference to observation.
- description: A locus-resolved transcript measurement for MTRNR2L11, by long-read RNA sequencing or
    by amplicon sequencing with primers spanning the positions unique to this copy, to establish whether
    the locus is transcribed at all. Short-read quantification is unreliable here because the nuclear
    copies are near-identical to each other and to a highly abundant mitochondrial rRNA.
- description: Ribosome profiling or ORF-capture of the MTRNR2L11 transcript, should it be shown to exist,
    to test whether the predicted ORF is translated rather than merely transcribed.
- description: Synthesise the HN11 peptide and run it side by side with humanin and with HN5 in the assays
    that define humanin activity - staurosporine- and amyloid-beta-induced death, FPRL1 competition,
    BAX binding - as was done for HN5 alone [PMID:19477263]. Because HN11 carries the same Thr13->Ile
    change that reduced HN5 cytoprotection, this comparison would also test whether position 13 behaves
    additively with the other substitutions.
