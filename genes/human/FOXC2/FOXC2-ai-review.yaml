gene_symbol: FOXC2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FOXC2 is a nuclear forkhead transcriptional regulator that recognizes regulatory DNA and
  controls gene expression in endothelial and mesenchymal contexts. Human FOXC2 occupies promoter-associated
  chromatin and activates transcription; phosphorylation modulates its recruitment to subsets of chromatin
  sites in human lymphatic endothelial cells. It also binds NFAT1 (NFATC2) and acts as a transcription
  corepressor in transfected human cells: DNA strengthens the protein interaction, while recognition of
  a cognate forkhead motif is dispensable in that system. In mouse endothelial models, Foxc2-dependent
  integrin expression supports adhesion, migration and vessel sprouting. Human FOXC2 variants disrupt
  lymphatic development and function. Mouse genetics links Foxc2 and NFATc1 to collecting-vessel maturation
  and valves; human lymphatic endothelial chromatin and enhancer experiments support their transcriptional
  cooperation. Mouse genetics also implicates Foxc2 in mesodermal and somite development.'
