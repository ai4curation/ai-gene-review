  findings:
  - statement: Endogenous human lymphatic endothelial FOXC2 shows phosphatase-sensitive mobility. Six
      serine sites were mapped by mass spectrometry and two additional sites by mutagenesis in overexpressed
      protein.
  - statement: Human lymphatic endothelial cells expressing Myc-tagged wild-type or eight-site mutant
      FOXC2 show different chromatin occupancy and transcriptional profiles. The mutant retains nuclear
      localization and binding to naked DNA in extract EMSA.
