    label: nucleus
  supported_by:
  - reference_id: PMID:42023653
  knowledge_gaps:
  - gap_statement: The endogenous human cell types and regulatory targets in which FOXC2 represses NFAT1/NFATC2-dependent
      transcription remain unresolved.
    boundary: Purified human domains establish direct, DNA-enhanced contact, and full-length proteins and
      interface mutants link that contact to repression in transfected HEK293T cells. These assays do not
      establish the tissue range or endogenous targets of this corepressor mechanism; FOXC2 cooperation
      with NFATC1 in lymphatic vessels is a separate context.
    gap_kind:
    - BIOLOGY
    status: OPEN
    resolution: In a human cell model with confirmed endogenous FOXC2 and NFAT1 expression, measure nascent
      target transcription after FOXC2 depletion and near-endogenous rescue, alongside targeted chromatin
      occupancy and association under basal and NFAT1-activating conditions. These are the targeted experiments
      proposed below.
    provenance:
    - reference_id: PMID:42023653
suggested_questions:
- question: In which endogenous cell types does FOXC2 repress NFAT1/NFATC2-dependent transcription, and
    how does that mechanism differ from FOXC2 cooperation with NFATC1 in lymphatic vessels?
- question: How much of Foxc2-dependent endothelial migration is mediated by integrin beta3, and is this
    target-to-migration relationship conserved in human endothelial cells?
- question: Which cold-challenge endpoint supports a negative effect of FOXC2 on thermogenesis, separately
    from its effects on basal adipose oxidative metabolism?
suggested_experiments:
- hypothesis: FOXC2-mediated NFAT1 repression depends on cellular context and can be separated experimentally
    from FOXC2-driven target activation.
  description: In a human cell model with confirmed endogenous FOXC2 and NFAT1 expression, measure a small
    panel of NFAT1-responsive and FOXC2-activated transcripts after FOXC2 depletion and near-endogenous
    rescue. Pair nascent-transcript measurements with targeted FOXC2/NFAT1 chromatin occupancy and reciprocal
    association assays under basal and NFAT1-activating conditions. Confirm protein abundance, nuclear
    localization and cell viability; interpret occupancy and co-association separately from direct physical
    contact.
  experiment_type: Targeted transcription, chromatin-occupancy and protein-association assays
- hypothesis: Integrin beta3 mediates part of the endothelial migration response downstream of Foxc2,
    with conservation in human cells requiring direct testing.
  description: Compare matched Foxc2/FOXC2 depletion and rescue in mouse and human endothelial cultures.
    Measure ITGB3 transcript and surface protein, adhesion and Transwell migration, and test whether ITGB3
    re-expression restores the migration endpoint. Include cell-number and viability controls to separate
    migration from growth. These assays test a defined cellular mechanism and do not establish repair
    of an injured vessel.
  experiment_type: Targeted cross-species perturbation and rescue with adhesion/migration readouts
