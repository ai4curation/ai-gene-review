      remodeling in embryonic mouse blood endothelium; the model did not target lymphatic endothelium.
- id: PMID:19398761
  title: FOXC2 controls formation and maturation of lymphatic collecting vessels through cooperation with
    NFATc1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Methods, Results, Discussion and figure captions were inspected. Endogenous
      FOXC2 ChIP-chip is in primary human intestinal lymphatic endothelial cells; extract EMSA validates
      selected fragments, and reporter/co-IP experiments use overexpressed factors in 293T cells. Foxc2
      knockout, Nfatc1 loss and calcineurin inhibition are separate mouse developmental experiments. Reporter
      responses vary by fragment, including cooperation and partial repression. NFATc1 is distinct from
      NFAT1/NFATC2. No figure pixels or supplementary data were independently inspected.
  findings:
  - statement: Mouse Foxc2 deficiency prevents normal collecting lymphatic vessel maturation; calcineurin
      inhibition potentiates valve and remodeling defects in Foxc2 heterozygotes. These experiments retain
      their mouse and pharmacological scope.
  - statement: Endogenous FOXC2 ChIP-chip identifies 2,350 genomic sites in primary human intestinal lymphatic
      endothelial cells. Selected fragments bind FOXC2 in extract EMSA, and their reporter responses with
      NFATc1 in transfected 293T cells are context dependent.
core_functions:
- description: Recognizes forkhead regulatory DNA and promotes Pol II transcription in the nucleus. Human
    FOXC2 DNA-binding and reporter experiments, endogenous promoter ChIP and purified-domain sequence
    selection establish this activity. Phosphorylation regulates recruitment to subsets of chromatin sites
    in human lymphatic endothelial cells without abolishing nuclear localization or naked-DNA binding.
    Endogenous human lymphatic endothelial chromatin mapping and selected NFATc1-responsive enhancer assays
    provide a defined vascular context, distinct from NFAT1 corepression.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
