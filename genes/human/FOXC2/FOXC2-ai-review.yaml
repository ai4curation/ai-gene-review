  review:
    summary: Human FOXC2-associated lymphatic dysfunction is complemented by experimental collecting-vessel
      maturation evidence.
    action: KEEP_AS_NON_CORE
    reason: The original 12114478 human clinical study reports lymphoedema-distichiasis, normal or increased
      lymphatic channels and tracer reflux; it does not measure a molecular vessel-formation step. Independent
      19398761 mouse Foxc2 loss and calcineurin/NFAT inhibition show defective collecting-vessel maturation
      and valves. The same paper maps endogenous FOXC2 chromatin occupancy in primary human intestinal
      lymphatic endothelial cells and tests selected enhancer responses with NFATc1 in transfected 293T
      cells. These findings support a transcriptional role in lymphatic development while preserving the
      original human clinical source and its endpoints. NFATc1 cooperation is distinct from the NFAT1/NFATC2
      corepression mechanism; no new developmental process annotation is proposed.
