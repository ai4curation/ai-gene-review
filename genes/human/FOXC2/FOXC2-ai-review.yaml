  - reference_id: PMID:20956529
  - reference_id: PMID:28473536
  - reference_id: PMID:23878394
  - reference_id: PMID:19398761
- description: Binds DNA-associated NFAT1 (NFATC2) and represses its transcriptional output. Purified
    human domains establish direct contact and DNA-enhanced complex formation; full-length FOXC2 and interface
    mutants link that contact to reporter and target-RNA repression in transfected HEK293T cells. The
    tested mechanism requires the NFAT element but not a cognate forkhead element. Its endogenous tissue
    range remains unresolved.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
