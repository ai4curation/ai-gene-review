    review:
      summary: Human FOXC2 acts as an NFAT1-associated transcription corepressor in a defined reconstituted
        and cellular system.
      action: NEW
      reason: Purified human FOXC2 DNA-binding domain directly binds the human NFAT1 Rel-homology region;
        three ternary structures and interface-mutant binding assays establish the contact. DNA enhances
        complex formation. Full-length FOXC2 represses NFAT1-dependent human IL2-ARRE2 reporter activity
        and target RNA abundance in transfected HEK293T cells, and interface mutations weaken repression.
        The NFAT element is required, whereas the cognate FOX element is dispensable. This is a positive,
        target-specific molecular activity matching GO:0003714, distinct from sequence-specific transcriptional
        activation; it is not inferred from a phenotype or transferred from another FOX protein. No redundant
        new TF-binding or biological-process annotation is added. Endogenous immune-cell and lymphatic-valve
        roles of this NFAT1/NFATC2 mechanism remain unestablished.
      supported_by:
      - reference_id: PMID:42023653
  core_count: 2
  changed_original_review_indices:
  - 5
