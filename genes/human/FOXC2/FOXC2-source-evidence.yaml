  findings_by_reference:
    PMID:42023653:
    - statement: Purified human FOXC2 residues 72–172 bind human NFAT1 residues 392–678 directly; ARRE
        DNA strengthens binding in ITC and SPR. Three ternary crystal structures and interface-mutant
        binding assays support the contact.
    - statement: Full-length FOXC2 represses NFAT1-driven IL2-ARRE2 reporter activity and target RNA abundance
        in transfected HEK293T cells. Interaction-interface mutations weaken repression; the NFAT element
        is required and the cognate FOX element is dispensable.
    PMID:23878394:
    - statement: Endogenous human lymphatic endothelial FOXC2 shows phosphatase-sensitive mobility. Six
        serine sites were mapped by mass spectrometry and two additional sites by mutagenesis in overexpressed
        protein.
    - statement: Human lymphatic endothelial cells expressing Myc-tagged wild-type or eight-site mutant
        FOXC2 show different chromatin occupancy and transcriptional profiles. The mutant retains nuclear
        localization and binding to naked DNA in extract EMSA.
    - statement: Induced wild-type FOXC2, but not the phosphorylation-deficient mutant, increases vascular
        remodeling in embryonic mouse blood endothelium; the model did not target lymphatic endothelium.
    PMID:19398761:
    - statement: Mouse Foxc2 deficiency prevents normal collecting lymphatic vessel maturation; calcineurin
        inhibition potentiates valve and remodeling defects in Foxc2 heterozygotes. These experiments
        retain their mouse and pharmacological scope.
    - statement: Endogenous FOXC2 ChIP-chip identifies 2,350 genomic sites in primary human intestinal
        lymphatic endothelial cells. Selected fragments bind FOXC2 in extract EMSA, and their reporter
        responses with NFATc1 in transfected 293T cells are context dependent.
  source_acquisition: Two new qualified normal publication sources; all prior 21 source files remain unchanged.
  mechanistic_limits: DNA strengthens direct FOXC2-domain/NFAT1 binding. The reporter mechanism requires
    the NFAT-responsive element but not the cognate forkhead element; it does not establish native immune-cell
    or lymphatic-valve repression. NFAT1/NFATC2 and NFATC1 are distinct proteins.
  validation: The private proposal was subsequently applied; actual follow-up checks are recorded below.
    Initial published validation remains historical.
  lymphatic_context: Primary human lymphatic endothelial chromatin occupancy and selected enhancer assays
    support transcriptional cooperation with NFATc1, with fragment-specific reporter outcomes. Collecting-vessel
    maturation/valve experiments are mouse genetics/pharmacology. No transfer of NFAT1/NFATC2 cytokine
    repression to valves.

