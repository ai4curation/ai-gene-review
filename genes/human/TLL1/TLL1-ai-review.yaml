id: O43897
gene_symbol: TLL1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TLL1 (tolloid-like protein 1, mammalian tolloid-like 1) is a secreted astacin-family (peptidase
  M12A) zinc metalloproteinase of the BMP1/tolloid group. It is made as a precursor with a signal
  peptide and an N-terminal prodomain that is removed by furin-type proprotein convertases, followed
  by the catalytic astacin domain (HEXXH zinc-binding motif) and a non-catalytic array of five CUB
  and two calcium-binding EGF-like domains. Outside the cell, TLL1 cleaves a set of extracellular
  precursors: it removes the C-propeptides of fibrillar procollagens I and II (procollagen
  C-proteinase activity, enhanced by PCOLCE1, which TLL1 binds), processes procollagen VII,
  pro-lysyl oxidase and probiglycan, cleaves the BMP antagonist chordin, activates latent myostatin
  by cleaving its propeptide, and cleaves the axon-guidance cue SLIT2. Full-length TLL1 forms
  calcium-dependent dimers that restrain its activity relative to BMP1. TLL1 acts partly redundantly
  with BMP1 in collagen and matrix maturation. Loss of Tll1 in mice causes mid-gestation death with
  defects of the interventricular septum and heart position, and combined postnatal loss of Tll1
  and Bmp1 produces brittle bones. In humans, heterozygous TLL1 variants are associated with atrial
  septal defect 6, and a gain-of-function variant segregates with mitral valve prolapse.
alternative_products:
- name: '1'
  id: O43897-1
  description: Full-length 1013-residue precursor (signal peptide 1-30, prodomain 31-147, mature
    chain 148-1013) with the astacin protease domain, five CUB and two calcium-binding EGF-like domains.
- name: '2'
  id: O43897-2
  sequence_note: VSP_017197, VSP_017198
  description: Truncated cDNA product (MGC) whose sequence diverges at residues 387-392 and ends there,
    retaining the protease domain and CUB1 but lacking the remaining CUB and EGF-like domains. Its
    activity has not been tested.
