core_functions:
- description: >-
    Secreted zinc metalloendopeptidase that removes C-propeptides from fibrillar procollagens I and
    II (procollagen C-proteinase activity, demonstrated for the human enzyme) and processes other matrix
    precursors including procollagen VII, pro-lysyl oxidase and probiglycan, contributing with BMP1
    to collagen fibril assembly and cross-linking. Within PANTHER subfamily PTHR24251:SF45 this
    procollagen C-proteinase activity is TLL1-specific, since the TLL2 paralogs in the same subfamily
    lack it.
  molecular_function:
    id: GO:0004222
    label: metalloendopeptidase activity
  directly_involved_in:
  - id: GO:0016485
    label: protein processing
  - id: GO:0030199
    label: collagen fibril organization
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:10479448
    supporting_text: mTLL-1 is shown to specifically process procollagen C-propeptides at the physiologically
      relevant site, while mTLL-2 is shown to lack this activity
  - reference_id: PMID:30538173
    supporting_text: in comparison with the native TLL1, mutants cleaved chordin and procollagen I at
      significantly lower rates
  - reference_id: PMID:12808086
    supporting_text: mTLL-1 is an in vivo pCP that provides residual activity observed in Bmp1(-/-) embryos
  - reference_id: PMID:11313359
    supporting_text: all four proteinases productively cleave pro-lysyl oxidase at the correct physiological
      site
- description: >-
    Cleaves extracellular signalling regulators to release or activate ligands: chordin, freeing BMP
    ligands (shown for the human enzyme), the myostatin propeptide in latent myostatin, and the axon
    guidance cue SLIT2 (shown for human TLL1 and human SLIT2).
  molecular_function:
    id: GO:0004222
    label: metalloendopeptidase activity
  directly_involved_in:
  - id: GO:0016485
    label: protein processing
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:30538173
    supporting_text: Corresponding recombinant proteins were analyzed for their metalloendopeptidase
      activity using a native substrate, chordin.
  - reference_id: PMID:14671324
    supporting_text: Three of the proteinases, BMP-1, mTLL-1, and mTLL-2, were approximately equally
      effective in cleaving the propeptide
  - reference_id: PMID:41626796
    supporting_text: The Tolloid-related protease TLL1 cleaved SLIT2 in cultured cells, with TLL1 requiring
      activation by furin/prohormone convertases.
suggested_questions:
- question: Which TLL1 substrate (chordin, a procollagen, or another matrix precursor) explains the interventricular
    septum defect of Tll1-null mice, given that BMP1 does not compensate there?
- question: Are the procollagen C-proteinase and chordinase activities conserved in non-mammalian TLL1
    orthologs inside PTHR24251:SF45, given that the TLL2 paralogs in the same subfamily lack procollagen
    C-proteinase activity?
- question: Does the truncated isoform 2, which retains the protease domain and CUB1 only, encode an
    active protease, and is it expressed as protein?
suggested_experiments:
- hypothesis: The cardiac septation defect of Tll1-null mice requires TLL1 protease activity.
  description: Generate a catalytically inactive Tll1 knock-in mouse (active-site glutamate to alanine)
    and compare cardiac septation with the null allele.
  experiment_type: knock-in mouse model
- hypothesis: TLL1 has extracellular substrates in heart tissue that BMP1 does not cleave.
  description: Use N-terminomics (e.g. TAILS) on matrix from wild-type versus TLL1-deficient cardiac
    fibroblasts to identify TLL1-specific cleavage sites.
  experiment_type: proteomics
