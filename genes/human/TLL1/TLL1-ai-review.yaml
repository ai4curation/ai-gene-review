- id: PMID:8661043
  title: Characterization of a novel gene product (mammalian tolloid-like) with high sequence similarity
    to mammalian tolloid/bone morphogenetic protein-1.
  findings:
  - statement: Mouse mTll was cloned; it shares 76% identity with mTld in the protease and downstream
      domains and is additionally expressed in brain.
    supporting_text: mTll shows additional strong expression in structures of the developing, neonatal,
      and adult brain in which expression of BMP-1 and mTld has not been observed
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: Abstract-only. Correct paper for the cloning of mouse mTll, but it does not support
      the skeletal system development TAS annotation that cites it.
- id: PMID:10479448
  title: Mammalian BMP-1/Tolloid-related metalloproteinases, including novel family member mammalian
    Tolloid-like 2, have differential enzymatic activities and distributions of expression relevant to
    patterning and skeletogenesis.
  findings:
  - statement: TLL-1 specifically removes procollagen C-propeptides at the physiological site and cleaves
      chordin; TLL-2 lacks procollagen C-proteinase activity. Reactome states that the human enzyme was
      tested on human procollagens I and II.
    supporting_text: mTLL-1 is shown to specifically process procollagen C-propeptides at the physiologically
      relevant site, while mTLL-2 is shown to lack this activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Key biochemical paper for TLL1 pCP and chordinase activities. Abstract-only in cache.
- id: PMID:10331975
  title: The mammalian Tolloid-like 1 gene, Tll1, is necessary for normal septation and positioning of
    the heart.
  findings:
  - statement: Tll1-null mice die at mid-gestation with incomplete muscular interventricular septum and
      abnormal heart positioning.
    supporting_text: Constant features were incomplete formation of the muscular interventricular septum
      and an abnormal and novel positioning of the heart and aorta.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mouse knockout; necessity evidence for heart development, mechanism not identified.
- id: PMID:10896944
  title: Bone morphogenetic protein-1 processes probiglycan.
  findings:
  - statement: mTLL-1 has low probiglycan-cleaving activity, and Bmp1/Tll1 double-null fibroblasts produce
      only unprocessed probiglycan.
    supporting_text: MEFs homozygous null for both the Bmp1 gene and the mTLL-1 gene Tll1 produce only
      unprocessed probiglycan
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
- id: PMID:11313359
  title: Multiple bone morphogenetic protein 1-related mammalian metalloproteinases process pro-lysyl
    oxidase at the correct physiological site and control lysyl oxidase activation in mouse embryo fibroblast
    cultures.
  findings:
  - statement: mTLL-1 cleaves pro-lysyl oxidase at the physiological site and, with BMP-1/mTLD, accounts
      for most lysyl oxidase activation in fibroblasts.
    supporting_text: all four proteinases productively cleave pro-lysyl oxidase at the correct physiological
      site
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
