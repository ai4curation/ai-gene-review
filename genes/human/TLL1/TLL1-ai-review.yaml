- term:
    id: GO:0001501
    label: skeletal system development
  evidence_type: TAS
  original_reference_id: PMID:8661043
  qualifier: involved_in
  review:
    summary: TAS annotation citing the original cloning paper for mouse mTll. That paper reports the
      sequence, domain structure, expression overlap with BMP-1/mTld and brain expression; it does not
      present skeletal data.
    action: KEEP_AS_NON_CORE
    reason: >-
      The cited paper (abstract only in cache) is a cloning and expression study and does not by itself
      support a skeletal role. Independent support exists: TLL1 is an in vivo procollagen C-proteinase
      (PMID:12808086), and induced postnatal ablation of both Bmp1 and Tll1 in mouse produces an
      osteogenesis imperfecta-like phenotype with reduced procollagen processing (PMID:24419319). TLL1
      therefore does part of the work of skeletal matrix formation by processing procollagen, but the
      in vivo skeletal evidence is from a combined two-gene knockout in mouse and is pleiotropic.
      Kept as a non-core developmental process.
    additional_reference_ids:
    - PMID:24419319
    - PMID:12808086
    supported_by:
    - reference_id: PMID:24419319
      supporting_text: Bones of the conditionally null mice are dramatically weakened and brittle, with
        spontaneous fractures-defining features of OI.
    - reference_id: PMID:24419319
      supporting_text: reduced processing of procollagen and dentin matrix protein 1
