- term:
    id: GO:0009953
    label: dorsal/ventral pattern formation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0003719
  - PANTHER:PTN001298759
  - ZFIN:ZDB-GENE-041020-1
  - ZFIN:ZDB-GENE-060818-1
  review:
    summary: Phylogenetic propagation of dorsal/ventral pattern formation from the bilaterian tolloid
      node PTN001298759, seeded by Drosophila tolloid and zebrafish tolloid-family genes.
    action: KEEP_AS_NON_CORE
    reason: >-
      The mechanism is conserved: TLL1 cleaves chordin, the vertebrate Sog ortholog, and overexpressed
      TLL-1 counteracts Chordin dorsalisation in Xenopus embryos (PMID:10479448). Products of Bmp1 and
      Tll1 together account for chordin cleavage in mouse (PMID:12808086). The protease does part of
      the work by liberating BMP ligands from chordin. However, there is no evidence that TLL1 shapes
      the mammalian dorsoventral axis; Tll1-null mouse defects are confined to the heart (PMID:10331975),
      and Scott et al. suggest BMP-1 is the major mammalian chordin antagonist. The IBA is kept as an
      inherited but non-core role.
    supported_by:
    - reference_id: PMID:10479448
      supporting_text: BMP-1 and mTLL-1 are shown to cleave Chordin, at sites similar to procollagen
        C-propeptide cleavage sites, and to counteract dorsalizing effects of Chordin upon overexpression
        in Xenopus embryos.
    - reference_id: PMID:12808086
      supporting_text: products of Bmp1 and Tll1 are responsible for in vivo cleavage of Chordin in mammals
