- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027237
  review:
    summary: ARBA machine-learned assignment of serine-type endopeptidase activity.
    action: REMOVE
    reason: >-
      Wrong catalytic class. TLL1 is an astacin-family zinc metalloproteinase: its only protease
      domain is the peptidase M12A domain with zinc-ligand histidines and a catalytic glutamate, and
      it has no serine-protease (trypsin-like or subtilisin-like) domain. All biochemical work describes
      it as a metalloproteinase (PMID:30538173, PMID:18824173). The ARBA rule likely reflects other
      CUB-domain proteins in the family that are serine proteases.
    supported_by:
    - reference_id: file:human/TLL1/TLL1-uniprot.txt
      supporting_text: DR   Pfam; PF01400; Astacin; 1.
    - reference_id: PMID:18824173
      supporting_text: is a multidomain, zinc endopeptidase of the astacin M12A family
