- id: file:human/CD247/CD247-deep-research-cyberian.md
  title: Cyberian deep research on CD247 function
  findings: []
  reference_review:
    relevance: NONE
    correctness: MISCITED
    review_notes: The immutable file is named for CD247 but its generated research output is headed ATP5MC2
      and discusses mitochondrial ATP synthase subunit c. It is unsuitable support for CD247. The file
      and original reference identity are preserved as provenance; no provider-report quote or biological
      inference is retained.
core_functions:
- description: At the plasma membrane, phosphorylated CD247 ITAMs provide docking sites that assemble
    receptor-proximal kinase signaling complexes. In the alpha-beta TCR, this adaptor activity contributes
    to the assembled receptor response to peptide-MHC; antigen recognition and kinase catalysis are supplied
    by other subunits/proteins. Human CD247 also supplies ITAM signaling capacity to selected Fc receptors.
  molecular_function:
    id: GO:0030159
    label: signaling receptor complex adaptor activity
  contributes_to_molecular_function:
    id: GO:0032395
    label: MHC class II receptor activity
  directly_involved_in:
  - id: GO:0050852
    label: T cell receptor signaling pathway
  - id: GO:0038094
    label: Fc-gamma receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0042105
    label: alpha-beta T cell receptor complex
  supported_by:
  - reference_id: PMID:7509083
    supporting_text: "recruitment of a second cytoplasmic \nPTK, ZAP-70"
  - reference_id: PMID:28652325
- description: CD247 transmembrane homodimerization supplies a physical assembly module for TCR-CD3 and
    human CD16A complexes; CD247 can also form mixed dimers with FcRgamma. These contacts promote assembly
    and surface expression of competent receptors. Isolated cytoplasmic-domain tetramers at high concentration
    are not treated as the physiological assembly unit, and human/mouse CD16 compatibility differs.
  molecular_function:
    id: GO:0042803
    label: protein homodimerization activity
  directly_involved_in:
  - id: GO:0065003
    label: protein-containing complex assembly
  - id: GO:2000010
    label: positive regulation of protein localization to cell surface
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0033001
    label: Fc-gamma receptor III complex
  supported_by:
  - reference_id: PMID:17055436
    supporting_text: "zetazeta dimerization and assembly \nwith TCR"
  - reference_id: PMID:28652325
    supporting_text: human CD247 and FcεR1γ homodimers, as well as the heterodimer
suggested_questions:
- question: What direct mouse donor localization assay underlies the Golgi transfer, and does it distinguish
    stable Golgi residence from transit or a general intracellular pool?
- question: Which original constructs and controls establish the CD247-specific CD81, mouse CCR7 and ATXN2-isoform-5
    interactions, and how do these associations vary between native receptor complexes and screening systems?
- question: How do the three reviewed CD247 alternative products differ in receptor assembly and signaling?
    Existing source annotations are not isoform-specific, and no experimentally resolved function is assigned
    to an uncharacterized product by inference from its name.
status: DRAFT
