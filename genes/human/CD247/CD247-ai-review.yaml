description: CD247 (CD3 zeta) is a single-pass membrane signaling subunit of T-cell antigen receptors
  and selected activating immune receptors. It forms a disulfide-stabilized zeta homodimer whose transmembrane
  contacts assemble the TCR-CD3 complex; human CD247 also forms homo- or mixed dimers with FcRgamma in
  CD16A receptor complexes. Its cytoplasmic ITAMs become docking sites for ZAP70 after phosphorylation
  by Src-family kinases, coupling receptor engagement to intracellular signaling without intrinsic kinase
  activity. Receptor recognition specificity is supplied by the assembled ligand-binding subunits. CD247
  occupies plasma-membrane and intracellular trafficking pools, with receptor composition and adaptor
  usage varying by lymphocyte type and species.
