    label: protein-containing complex assembly
  evidence_type: IDA
  original_reference_id: PMID:9485181
  qualifier: involved_in
  review:
    summary: CD247 contributes physical contacts to receptor-complex assembly.
    action: ACCEPT
    reason: The human assembly experiments in PMID:9485181 establish a role for the zeta module, although
      their double-TCR stoichiometric model is not adopted. Independent transmembrane mutagenesis in PMID:17055436
      and human structural evidence in PMID:31461748 support direct assembly work by CD247 rather than
      merely a requirement inferred from depletion.
    supported_by:
    - reference_id: PMID:9485181
      supporting_text: the CD3 zeta homodimer is added to allow export
- term:
    id: GO:0098797
    label: plasma membrane protein complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: part_of
  supporting_entities:
  - ARBA:ARBA00028841
  review:
    summary: The electronic plasma-membrane complex assignment is independently established.
    action: ACCEPT
    reason: ARBA00028841 provides the source inference; its detailed decision rule was not inspected.
      Human TCR-CD3 and CD16A complexes directly establish CD247 as a membrane-complex subunit, so acceptance
      does not require assigning it the activity of every partner.
- term:
    id: GO:1990782
    label: protein tyrosine kinase binding
  evidence_type: IPI
  original_reference_id: PMID:8681956
  qualifier: enables
  supporting_entities:
  - UniProtKB:P06239
  review:
    summary: Retain binding to the cytoplasmic tyrosine kinase LCK.
    action: ACCEPT
    reason: The source PMID:8681956 focuses on ZAP70-SH2 binding and uses LCK-phosphorylated recombinant
      zeta; its exact original P06239 interaction control was not inspected. Independent direct LCK SH2/SH3-zeta
      binding in PMID:8626561 supports this same partner/class relation. Preserve the immutable LCK supporting
      entity rather than silently substituting ZAP70.
- term:
    id: GO:2000010
    label: positive regulation of protein localization to cell surface
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: acts_upstream_of_or_within
  supporting_entities:
  - UniProtKB:P24161
  - ensembl:ENSMUSP00000005907
  review:
    summary: Receptor assembly by CD247 promotes partner surface expression.
    action: ACCEPT
    reason: Although this electronic source transfers from mouse, human CD16A cotransfection and reconstitution
      independently show CD247-mediated receptor assembly and surface expression (PMIDs:2532305, 1825220
      and 28652325). This is direct physical assembly work, not a generic expression correlation. Certain
      CD16A mutants escape retention without an adaptor, so the effect is not universal across constructs;
      the original acts_upstream_of_or_within qualifier is preserved.
