core_functions:
- description: High-affinity, sodium-dependent symporter that imports the acidic amino acids
    L-glutamate, L-aspartate and D-aspartate across the plasma membrane. EAAT1 co-transports one
    acidic amino acid substrate with three Na+ and one H+, coupled to the counter-transport of one
    K+, generating an electrogenic uptake current. It assembles as a homotrimer in which each
    protomer carries substrate via an elevator-like movement of its transport domain. This activity
    underlies the rapid clearance of synaptically released glutamate by astroglia (notably cerebellar
    Bergmann glia), terminating excitatory signalling and protecting against excitotoxicity.
