proposed_new_terms: []
suggested_questions:
- question: EAAT1's C-terminus binds many PDZ-domain scaffolds (GRIP1/2, DLG1-4, MAGI1/2, PATJ, MPDZ,
    PDZK1). Which of these govern surface delivery, perisynaptic clustering and stability of
    endogenous EAAT1 in Bergmann and Müller glia, versus being incidental interactome hits?
- question: How do EA6 missense variants (e.g. P290R) partition between loss of transport, dominant-
    negative suppression of wild-type EAAT1 through trimerization, and altered anion conductance?
- question: What is the physiological significance of the uncoupled chloride conductance of EAAT1 for
    glial membrane potential and glutamate clearance in vivo?
suggested_experiments:
- description: Degron-based acute depletion of EAAT1 in human iPSC-derived astrocytes with
    electrophysiological measurement of glutamate-uptake currents and the uncoupled anion current, to
    quantify the two conductance modes in a human cellular context.
- description: Structure-guided mutagenesis combined with heterologous expression to separate the
    coupled transport current from the uncoupled Cl- current and map the determinants of each.
- description: Co-expression of EA6 variant and wild-type EAAT1 with single-molecule surface tracking
    to test whether mutant subunits co-assemble into trimers and suppress wild-type surface delivery.
