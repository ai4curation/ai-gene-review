id: P43003
gene_symbol: SLC1A3
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC1A3 encodes EAAT1 (Excitatory Amino Acid Transporter 1, also called GLAST),
  a sodium-dependent, high-affinity transporter of the acidic amino acids L-glutamate, L-aspartate
  and D-aspartate. It is a plasma-membrane, multi-pass symporter that co-transports one acidic
  amino acid with three Na+ and one H+ coupled to the counter-transport of one K+, and in addition
  carries a thermodynamically uncoupled chloride conductance. EAAT1 assembles as a homotrimer in
  which each protomer uses an elevator-like transport domain to move substrate across the membrane.
  It is the predominant glutamate transporter of the cerebellum (Bergmann glia) and is also expressed
  in retinal Müller glia, the inner ear and some peripheral tissues such as adipocytes. By rapidly
  clearing synaptically released glutamate from the extracellular space, EAAT1 terminates excitatory
  signalling and protects neurons from glutamate excitotoxicity. Loss-of-function and dominant-negative
  variants cause episodic ataxia type 6, with seizures, migraine and alternating hemiplegia.
