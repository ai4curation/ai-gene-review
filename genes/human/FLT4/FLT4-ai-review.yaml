core_functions:
- molecular_function:
    id: GO:0005021
    label: vascular endothelial growth factor receptor activity
  description: Membrane FLT4 products bind VEGF-C or VEGF-D and couple ligand-dependent receptor association
    to tyrosine kinase activation, initiating VEGF receptor signaling. This core describes the characterized
    membrane receptor, with long/short C-terminal signaling differences; it does not assign transmembrane
    signaling or kinase activity to the current soluble splice product.
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0048010
    label: vascular endothelial growth factor receptor signaling pathway
