id: P35916
gene_symbol: FLT4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FLT4, also called VEGFR3, is a receptor tyrosine kinase that binds VEGF-C and VEGF-D. Ligand-dependent
  receptor association and phosphorylation initiate signaling that supports endothelial proliferation,
  migration and survival. FLT4 has central roles in lymphatic vessel development and function, and contributes
  to angiogenic sprouting and embryonic blood-vessel patterning. Its membrane forms have long or short
  C-terminal tails with distinct signaling properties. A shorter splice form lacks the mapped transmembrane
  and kinase regions. The signaling receptor acts at the plasma membrane and can enter intracellular pools
  after ligand stimulation.
