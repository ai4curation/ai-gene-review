- id: file:human/FLT4/FLT4-notes.md
  title: FLT4 annotation review notes
core_functions:
- molecular_function:
    id: GO:0005021
    label: vascular endothelial growth factor receptor activity
  description: Membrane FLT4 products bind VEGF-C or VEGF-D and couple ligand-dependent receptor association
    to tyrosine kinase activation. In endothelial contexts, FLT4 signaling promotes proliferation and
    migration that support lymphatic vessel development, including lymphangiogenesis, and context-dependent
    angiogenic sprouting. Blood-vascular responses can also involve VEGFR2-containing receptor complexes.
    The characterized long and short membrane products have different C-terminal signaling capacities;
    this core does not assign transmembrane signaling or kinase activity to the current soluble splice
    product.
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0048010
    label: vascular endothelial growth factor receptor signaling pathway
  - id: GO:0001945
    label: lymph vessel development
  - id: GO:0002040
    label: sprouting angiogenesis
  - id: GO:0001938
    label: positive regulation of endothelial cell proliferation
  - id: GO:0010595
    label: positive regulation of endothelial cell migration
  supported_by:
  - reference_id: PMID:23878260
  - reference_id: PMID:9435229
  - reference_id: PMID:11532940
  - reference_id: PMID:19779139
  - reference_id: PMID:19903896
  - reference_id: PMID:20439428
  - reference_id: PMID:20224550
  - reference_id: file:human/FLT4/FLT4-source-evidence.yaml
suggested_questions:
- question: Which endogenous FLT4 product and antibody controls support the reported nuclear pool in PMID:16452200,
    and does that pool have a defined function?
- question: How does the current 830-aa soluble splice product differ functionally from the 765-aa recombinant
    product characterized in PMID:18593464?
- question: Which ligand-dependent endothelial responses require the long C-terminal tail, and which are
    shared by the short membrane product?
suggested_experiments:
- description: Compare sequence-verified long, short and 830-aa FLT4 products at matched expression levels
    for surface delivery, secretion, VEGF-C/D binding and receptor phosphorylation.
  experiment_type: product-resolved functional comparison
  hypothesis: Membrane anchoring and C-terminal variation separate ligand binding from intracellular signaling.
- description: Test endogenous FLT4 localization with independently validated antibodies, genetic depletion
    controls and compartment fractionation in the cell contexts used for the nuclear report.
  experiment_type: orthogonal localization
  hypothesis: A nuclear signal, if receptor-specific, represents a distinct regulated pool rather than
    nonspecific staining.
