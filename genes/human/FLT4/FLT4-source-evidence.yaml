  coverage: Lymphangiogenesis is uniformly ACCEPT; broader proliferation and MAPK contexts are uniformly
    NC because endothelial proliferation and ERK do not exhaust the demonstrated contexts. Both VEGF-response
    rows are TOO_GENERAL because retained receptor signaling represents their actual observations.
