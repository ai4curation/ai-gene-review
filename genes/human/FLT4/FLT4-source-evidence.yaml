ontology_checks: Official QuickGO definitions and ancestry support VEGF-specific kinase/pathway refinements,
  endothelial proliferation and migration-regulation descendants, ERK under MAPK, cytosol part_of cytoplasm,
  and VEGF signaling under cellular response. Cell migration is not treated as an ancestor of positive
  regulation of migration. Official GO:0005102 and GO:0051879 classify the measured signaling-receptor
  and HSP90 associations without asserting agonism, cochaperone activity or a purified interface. Cytosol
  ancestry alone does not establish that the HPA and internalized-receptor observations describe the same
  biological pool.
