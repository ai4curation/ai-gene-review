- id: PMID:25817015
  title: Loss-of-function alanyl-tRNA synthetase mutations cause an autosomal-recessive
    early-onset epileptic encephalopathy with persistent myelination defect.
  full_text_unavailable: true
  findings:
  - statement: >-
      Biallelic AARS1 variants caused severe infantile encephalopathy and reduced
      enzyme function, linking defective alanyl-tRNA charging to recessive disease.
    supporting_text: >-
      The two identified mutations were found to result in a significant reduction
      in function.
    reference_section_type: ABSTRACT
  - statement: >-
      The authors explicitly concluded that impaired alanyl-tRNA charging can produce
      a broad spectrum of neurological disease.
    supporting_text: >-
      The autosomal-recessive AARS mutations identified in the individuals described
      here, however, cause a severe infantile epileptic encephalopathy with a central
      myelin defect and peripheral neuropathy, demonstrating that defects of
      alanyl-tRNA charging can result in a wide spectrum of disease manifestations.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed identity and abstract verified. Direct human genetic and functional
      evidence for recessive loss of AARS1 charging function; the cache is
      abstract-only, so no more detailed assay interpretation is asserted.
- id: PMID:27622773
  title: Evolutionary Gain of Alanine Mischarging to Noncognate tRNAs with a G4:U69
    Base Pair.
  findings:
  - statement: >-
      Human AARS1 can mischarge alanine onto noncognate tRNAs, including tRNA(Cys),
      when their acceptor stems contain a G4:U69 identity element.
    supporting_text: >-
      Here we found human and not E. coli AlaRS has an intrinsic capacity for
      mispairing alanine onto nonalanyl-tRNAs including tRNACys.
    reference_section_type: ABSTRACT
  - statement: >-
      The G4:U69 acceptor-stem base pair is required for this expanded human AARS1
      substrate specificity.
    supporting_text: >-
      All human AlaRS-mischarged tRNAs have a G4:U69 base pair in the acceptor stem.
      The base pair is required for the mischarging.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text primary study with recombinant human enzyme, cellular reporter data,
      and structural analysis. It establishes a noncanonical mischarging capacity,
      but this is secondary to cognate tRNA(Ala) charging and editing.
- id: PMID:27911835
  title: Two crystal structures reveal design for repurposing the C-Ala domain of
    human AlaRS.
  full_text_unavailable: true
  findings:
  - statement: >-
      Human C-Ala adopts a divergent architecture that forms a dimer interface and
      DNA-binding groove rather than retaining the prokaryotic tRNA-docking role.
    supporting_text: >-
      This reshaping removes the role of C-Ala in prokaryotes for docking tRNA and
      instead repurposes it to form a dimer interface presenting a DNA-binding groove.
    reference_section_type: ABSTRACT
  - statement: >-
      Purified human C-Ala, but not the bacterial orthologous domain, bound DNA directly.
    supporting_text: >-
      Direct DNA binding by human C-Ala, but not by bacterial C-Ala, was demonstrated.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed identity and abstract verified. Direct structural and binding evidence
      for human C-Ala architecture, but the isolated-domain DNA-binding result does not
      by itself establish a physiological DNA-binding function for full-length AARS1.
- id: PMID:28493438
  title: Deficient activity of alanyl-tRNA synthetase underlies an autosomal recessive
    syndrome of progressive microcephaly, hypomyelination, and epileptic encephalopathy.
  findings:
  - statement: >-
      Two recessive human AARS1 variants reduced recombinant aminoacylation catalytic
      efficiency by 73% to 86%.
    supporting_text: >-
      The results showed that the p.Tyr690Leufs*3 mutation caused a 86% decrease in
      catalytic efficiency (kcat/Km) (Fig. 1D). The p.Gly913Asp mutation led to a 73%
      decrease in catalytic efficiency.
    reference_section_type: RESULTS
  - statement: >-
      Human AARS1 directly deacylates Ser-tRNA(Ala); the editing-domain truncation
      markedly impaired that activity while another disease variant retained
      wild-type-like deacylation.
    supporting_text: >-
      In the presence of AARS p.Tyr690Leufs*3, the deacylation of [3H] Ser-tRNAAla
      was diminished to a level comparable to the AARS p.Cys723Ala mutant (Fig. 1E).
      In contrast, the AARS p.Gly913Asp mutant maintained unaffected deacylation
      activity compared to the wild-type AARS.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text primary study directly assaying recombinant human AARS1 alanine
      charging and Ser-tRNA(Ala) editing. It strongly supports both canonical
      enzymatic functions and loss-of-function disease mechanisms.
- id: PMID:33909043
  title: Protein instability associated with AARS1 and MARS1 mutations causes trichothiodystrophy.
  full_text_unavailable: true
  findings:
  - statement: >-
      Trichothiodystrophy-associated AARS1 variants destabilize the protein and reduce
      tRNA charging in patient fibroblasts.
    supporting_text: >-
      These variants result in the instability of the respective gene products
      alanyl- and methionyl-tRNA synthetase.
    reference_section_type: ABSTRACT
  - statement: >-
      Patient-fibroblast studies showed that the variants alter the rate of tRNA charging.
    supporting_text: >-
      Functional studies in skin fibroblasts from affected individuals demonstrate
      that these new variants also impact on the rate of tRNA charging, which is the
      first step in protein translation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed identity and abstract verified. Direct patient-cell evidence for an
      AARS1 disease mechanism combining protein instability with impaired charging;
      the source is not needed to define the normal catalytic reaction.
- id: PMID:38512451
  title: The alanyl-tRNA synthetase AARS1 moonlights as a lactyltransferase to promote
    YAP signaling in gastric cancer.
  findings:
  - statement: >-
      AARS1 directly uses lactate and ATP to catalyze protein lysine lactylation.
    supporting_text: >-
      Here, we report that alanyl-tRNA synthetase 1 (AARS1) moonlights as a bona fide
      lactyltransferase that directly uses lactate and ATP to catalyze protein lactylation.
    reference_section_type: ABSTRACT
  - statement: >-
      Intracellular lactate drives AARS1 nuclear translocation, where AARS1 lactylates
      and activates the YAP-TEAD complex.
    supporting_text: >-
      Specifically, AARS1 was found to sense intracellular lactate and translocate
      into the nucleus to lactylate and activate the YAP-TEAD complex; and AARS1
      itself was identified as a Hippo target gene that forms a positive-feedback
      loop with YAP-TEAD to promote gastric cancer (GC) cell proliferation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text primary study with purified-protein, cellular, and tumor-model
      evidence for AARS1 lactyltransferase activity and lactate-responsive nuclear
      YAP1/TEAD1 regulation. The paper is sound; because YAP activation follows
      inhibition of the upstream Hippo kinase cascade, it supports negative rather
      than positive regulation of GO-defined Hippo signaling.
- id: PMID:38653238
  title: Alanyl-tRNA synthetase, AARS1, is a lactate sensor and lactyltransferase
    that lactylates p53 and contributes to tumorigenesis.
  full_text_unavailable: true
  findings:
  - statement: >-
      AARS1 binds lactate, forms lactate-AMP, and transfers the lactyl group to protein
      lysine residues.
    supporting_text: >-
      AARS1 binds to lactate and catalyzes the formation of lactate-AMP, followed by
      transfer of lactate to the lysince acceptor residue.
    reference_section_type: ABSTRACT
  - statement: >-
      AARS1 lactylates TP53 at Lys-120 and Lys-139, impairing TP53 phase separation,
      DNA binding, and transcriptional activation.
    supporting_text: >-
      AARS1 lactylation of p53 hinders its liquid-liquid phase separation, DNA binding,
      and transcriptional activation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed identity and abstract verified. Direct mechanistic support for the
      lactate-AMP intermediate, protein lactyltransferase activity, and TP53 inhibition.
      Its tumor-cell global-lactylation framing is context dependent in light of
      PMID:40835008; the substrate-specific findings remain supported.
- id: PMID:39322678
  title: AARS1 and AARS2 sense L-lactate to regulate cGAS as global lysine lactyltransferases.
  full_text_unavailable: true
  findings:
  - statement: >-
      AARS1 and AARS2 bind L-lactate and directly catalyze ATP-dependent lysine
      lactylation.
    supporting_text: >-
      AARS1/2 and the evolutionarily conserved Escherichia coli orthologue AlaRS bind
      to L-lactate with micromolar affinity and they directly catalyse L-lactate for
      ATP-dependent lactylation on the lysine acceptor end.
    reference_section_type: ABSTRACT
  - statement: >-
      The cGAS association, lactylation, and inactivation experiments in this paper
      identify AARS2, not AARS1, as the responsible paralog.
    supporting_text: >-
      In response to L-lactate, AARS2 associates with cyclic GMP-AMP synthase (cGAS)
      and mediates its lactylation and inactivation in cells and in mice.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed identity and abstract verified. It independently supports shared
      ATP-dependent AARS1/AARS2 lactyltransferase chemistry. The downstream cGAS
      mechanism is explicitly AARS2-specific and must not be assigned to AARS1.
- id: PMID:19661429
  title: The C-Ala domain brings together editing and aminoacylation functions on one
    tRNA.
  findings:
  - statement: >-
      AlaRS editing recognizes tRNA(Ala) mischarged with either glycine or serine.
    supporting_text: >-
      In this way, the editing domain checks for mischarging by picking out tRNAs
      that have Gly or Ser and a G3•U70 pair.
    reference_section_type: DISCUSSION
  - statement: >-
      Human C-Ala and its linker restored nearly full Ser-tRNA(Ala) clearance when
      grafted onto the E. coli AlaRS editing domain.
    supporting_text: >-
      Grafting C-Ala and its linker from human AlaRS to ED of E. coli AlaRS gave
      nearly full activity for clearance of Ser-tRNAAla (Fig. 3).
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text mechanistic study. It supports conserved Gly/Ser-tRNA(Ala) editing
      specificity and functional conservation of human C-Ala, but the human evidence
      is a cross-species domain graft rather than a direct full-length human
      Gly-tRNA(Ala) deacylation assay; it therefore supports only a cautious ISS claim.
- id: PMID:29273753
  title: Double mimicry evades tRNA synthetase editing by toxic vegetable-sourced
    non-proteinogenic amino acid.
  findings:
  - statement: >-
      Human AARS1 activates the alanine mimic azetidine-2-carboxylic acid but its
      editing system rejects more than 99% of the activated nonproteinogenic substrate.
    supporting_text: >-
      Here we show that although Aze is activated by both human (Hs) AlaRS and Hs
      ProRS, it is rejected (>99%) by the AlaRS but not the ProRS editing system and
      therefore almost exclusively misincorporates into Pro positions of proteins.
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text primary study directly characterizing human AlaRS substrate activation
      and editing selectivity. It corroborates the editing function but addresses a
      dietary nonproteinogenic amino acid rather than the normal Ser/Gly error substrates.
- id: PMID:30124830
  title: Hypermorphic and hypomorphic AARS alleles in patients with CMT2N expand clinical
    and molecular heterogeneities.
  full_text_unavailable: true
  findings:
  - statement: >-
      Dominant CMT2N AARS1 alleles can be hypomorphic or hypermorphic rather than
      sharing one uniform loss-of-function mechanism.
    supporting_text: >-
      Yeast complementation assays demonstrated that two mutations (p.Ser627Leu and
      p.Arg326Trp) represent loss-of-function alleles, while the third (p.Glu337Lys)
      represents a hypermorphic allele.
    reference_section_type: ABSTRACT
  - statement: >-
      The hypermorphic p.Glu337Lys allele increases tRNA charging velocity.
    supporting_text: >-
      Further, aminoacylation assays confirmed that the third mutation (p.Glu337Lys)
      increases tRNA charging velocity.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed identity and abstract verified. It establishes heterogeneous dominant
      neuropathy mechanisms and prevents overgeneralizing all pathogenic AARS1 alleles
      as simple loss of charging activity.
- id: PMID:40835008
  title: Class I histone deacetylases catalyze lysine lactylation.
  findings:
  - statement: >-
      AARS1 or AARS2 depletion did not reduce basal global lysine lactylation in
      untreated proliferating HEK293T cells.
    supporting_text: >-
      However, the knockdown of either enzyme did not alter Kla levels (Fig. S6, B–E),
      suggesting the AARS pathway is also not required for global lysine lactylation.
    reference_section_type: RESULTS
  - statement: >-
      The reported AARS1 lactyl-AMP reaction has a millimolar Km, making substantial
      activity unlikely at healthy lactate concentrations.
    supporting_text: >-
      Likewise, the reported Km for AARS1 to generate lactyl-AMP to transfer lactate
      to lysine has Km = 36 ± 7.09 mM, again making this pathway unlikely to occur at
      healthy lactate levels (20).
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full-text independent counter-scope study. It does not refute purified-enzyme
      activity or high-lactate substrate-specific effects, but shows that AARS1 is not
      required for basal global lactylation in HEK293T cells and constrains broad claims.
- id: PMID:7654687
  title: 'Human alanyl-tRNA synthetase: conservation in evolution of catalytic core
    and microhelix recognition.'
  full_text_unavailable: true
  findings:
  - statement: >-
      Active human AARS1 recognizes the conserved tRNA(Ala) acceptor-stem G3:U70 base
      pair and aminoacylates acceptor-stem RNA duplexes.
    supporting_text: >-
      In particular, we show that both the E. coli enzyme and the human enzyme purified
      from Pichia aminoacylate 9-base pair RNA duplexes whose sequences are based on
      the acceptor stems of either E. coli or human alanine tRNAs.
    reference_section_type: ABSTRACT
  - statement: >-
      The expressed human enzyme behaves as a monomer.
    supporting_text: >-
      This divergence correlates with the expressed human enzyme behaving as a monomer.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      PubMed identity and abstract verified. The study directly supports human AARS1
      tRNA binding, aminoacylation, acceptor-helix recognition, and monomeric state.
      It does not establish pre-tRNA processing or direct localization in human cells,
      so its source GO:0008033 and cytoplasm TAS uses are not supported as stated.
- id: PMID:7761427
  title: 'Wide cross-species aminoacyl-tRNA synthetase replacement in vivo: yeast
    cytoplasmic alanine enzyme replaced by human polymyositis serum antigen.'
  full_text_unavailable: true
  findings:
  - statement: >-
      Human AARS1 restored growth of yeast lacking its essential cytoplasmic AlaRS,
      demonstrating accurate in-vivo aminoacylation across species.
    supporting_text: >-
      Growth of cells harboring the ala1 disrupted allele was restored by a cDNA clone
      encoding human alanyl-tRNA synthetase, which is a serum antigen for many
      polymyositis-afflicted individuals.
    reference_section_type: ABSTRACT
  - statement: >-
      Conservation of the G3:U70 recognition system is sufficient for accurate
      cross-species aminoacylation in vivo.
    supporting_text: >-
      We conclude that, in spite of substantial differences between human and yeast
      tRNA sequences in evolution, strong conservation of the G3.U70 system of
      recognition is sufficient to yield accurate aminoacylation in vivo across wide
      species distances.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed identity and abstract verified. This is direct in-vivo complementation
      evidence that human AARS1 supports cytoplasmic alanyl-tRNA aminoacylation,
      although the experimental cellular context is yeast.
- id: Reactome:R-HSA-379716
  title: Cytosolic tRNA aminoacylation
  findings:
  - statement: >-
      Reactome places cytosolic AARS1 in the pathway that charges nuclear-encoded tRNAs
      with their cognate amino acids using ATP.
    supporting_text: >-
      Cytosolic tRNA synthetases catalyze the reactions of tRNAs encoded in the nuclear
      genome, their cognate amino acids, and ATP to form aminoacyl-tRNAs, AMP, and
      pyrophosphate.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Curated human Reactome pathway entry for cytosolic tRNA aminoacylation. It
      provides pathway context; the AARS1-specific reaction is captured in
      R-HSA-379864.
- id: Reactome:R-HSA-379864
  title: alanine + tRNA(Ala) + ATP => Ala-tRNA(Ala) + AMP + pyrophosphate
  findings:
  - statement: >-
      Reactome assigns monomeric cytosolic AARS1 the alanine-tRNA(Ala) ligation reaction.
    supporting_text: >-
      AARS (cytosolic alanyl tRNA synthetase) catalyzes the reaction of alanine,
      tRNA(ala), and ATP to form Ala tRNA(Ala), AMP, and pyrophosphate. The enzyme, a
      class II tRNA synthetase, is a monomer (Shiba et al. 1995).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Curated human Reactome reaction entry directly representing the canonical AARS1
      charging reaction and cytosolic location; the supporting human primary study is
      PMID:7654687.
core_functions:
- description: >-
    Cytosolic AARS1 activates L-alanine with ATP and transfers alanine to tRNA(Ala),
    producing Ala-tRNA(Ala) for cytoplasmic protein synthesis. This substrate-specific
    aminoacylation reaction is the enzyme's primary conserved activity.
  supported_by:
  - reference_id: PMID:28493438
    supporting_text: >-
      The aminoacylation activities of both variants were then tested using 14C-labeled
      alanine with various concentrations of tRNA.
  - reference_id: Reactome:R-HSA-379864
    supporting_text: >-
