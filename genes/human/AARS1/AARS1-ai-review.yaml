knowledge_gaps:
- gap_statement: >-
    Whether full-length human AARS1 directly deacylates Gly-tRNA(Ala), and its kinetic
    specificity for Gly-tRNA(Ala) relative to Ser-tRNA(Ala), remain experimentally
    unresolved.
  boundary: >-
    Recombinant human AARS1 directly deacylates Ser-tRNA(Ala). Conserved AlaRS-family
    experiments identify both glycine and serine errors, and human C-Ala restores an
    Escherichia coli editing construct, supporting only an ISS inference for the human
    glycine substrate.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Direct human kinetics would determine whether GO:0106026 should be supported by
    IDA and whether glycine and serine errors are cleared with comparable efficiency.
  resolution: >-
    Measure steady-state and single-turnover deacylation of purified Gly-tRNA(Ala) and
    Ser-tRNA(Ala) by full-length recombinant human AARS1, with editing-site mutants and
    the bacterial enzyme as controls.
  provenance:
  - reference_id: PMID:28493438
    supporting_text: >-
      An in vitro editing activity assay was carried out using [3H] Ser-tRNAAla as a
      substrate.
  - reference_id: PMID:19661429
    supporting_text: >-
      In this way, the editing domain checks for mischarging by picking out tRNAs
      that have Gly or Ser and a G3•U70 pair.
- gap_statement: >-
    The physiological lactate range, cell states, and substrate spectrum in which
    endogenous AARS1 makes a material contribution to protein lysine lactylation,
    relative to other enzymatic routes, remain incompletely defined.
  boundary: >-
    ATP-dependent AARS1 lactyltransferase chemistry and several target-specific effects
    are reproducible under elevated-lactate tumor conditions, but AARS1 knockdown does
    not lower basal global lysine lactylation in untreated HEK293T cells and the reported
    lactoyl-AMP reaction has a millimolar lactate Km.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this boundary would distinguish physiological AARS1 substrates from
    high-lactate or overexpression effects and prevent substrate-specific activity from
    being generalized to the basal global lactylome.
  resolution: >-
    Quantify endogenous, site-resolved lactylation across a calibrated intracellular
    lactate series after acute AARS1 depletion and matched rescue, alongside perturbation
    of class I HDAC-dependent lactylation and measurement of AARS1 charging activity.
  provenance:
  - reference_id: PMID:38512451
    supporting_text: >-
      Here, we report that alanyl-tRNA synthetase 1 (AARS1) moonlights as a bona fide
      lactyltransferase that directly uses lactate and ATP to catalyze protein lactylation.
  - reference_id: PMID:40835008
    supporting_text: >-
