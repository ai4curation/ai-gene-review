      suggesting the AARS pathway is also not required for global lysine lactylation.
  - reference_id: PMID:40835008
    supporting_text: >-
      Likewise, the reported Km for AARS1 to generate lactyl-AMP to transfer lactate
      to lysine has Km = 36 ± 7.09 mM, again making this pathway unlikely to occur at
      healthy lactate levels (20).
- gap_statement: >-
    It is unknown whether the two human AARS1 isoforms differ in aminoacylation,
