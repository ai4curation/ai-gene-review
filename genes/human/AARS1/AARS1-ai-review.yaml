id: P49588
gene_symbol: AARS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AARS1 is a predominantly cytosolic, monomeric class II alanyl-tRNA synthetase
  that activates L-alanine with ATP and transfers it to cytosolic tRNA(Ala). Its
  editing domain hydrolyzes incorrectly charged Ser-tRNA(Ala), while the C-terminal
  C-Ala region helps coordinate tRNA recognition, aminoacylation, and post-transfer
  editing to preserve translational fidelity. Under high intracellular L-lactate,
  AARS1 can also generate lactoyl-AMP and transfer lactyl groups to protein lysines.
  Lactate-dependent nuclear import enables context-specific lactylation of YAP1,
  TEAD1, and TP53, increasing YAP-TEAD transcriptional output and suppressing p53
  signaling in tumor models; this activity is not required for basal global lysine
  lactylation in untreated HEK293T cells. Pathogenic AARS1 variants cause recessive
  neurodevelopmental syndromes and dominant axonal neuropathy through heterogeneous
  effects on protein abundance, aminoacylation, editing, or charging kinetics.
