id: P49588
gene_symbol: AARS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AARS1 is a predominantly cytosolic class II alanyl-tRNA synthetase
  that activates L-alanine with ATP and transfers it to cytosolic tRNA(Ala). Its
  editing domain hydrolyzes incorrectly charged Ser-tRNA(Ala), while the C-terminal
  C-Ala region helps coordinate tRNA recognition, aminoacylation, and post-transfer
  editing to preserve translational fidelity. Under high intracellular L-lactate,
  AARS1 can also generate lactoyl-AMP and transfer lactyl groups to protein lysines.
  Lactate-dependent nuclear import enables context-specific lactylation of YAP1,
  TEAD1, and TP53, increasing YAP-TEAD transcriptional output and suppressing p53
  signaling in tumor models. AARS1 depletion did not reduce basal global lysine
  lactylation in untreated HEK293T cells. Pathogenic AARS1 variants cause recessive
  neurodevelopmental syndromes, nonphotosensitive trichothiodystrophy, and dominant
  axonal neuropathy. Variant effects include impaired protein stability, charging,
  or editing, altered charging kinetics, and dominant-negative interference with
  wild-type AARS1. Although early purified-enzyme experiments reported monomeric
  behavior, cellular studies demonstrate AARS1 self-association, which contributes
  to the dominant-negative effects of particular neuropathy alleles.
