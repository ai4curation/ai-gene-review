  full_text_unavailable: true
- id: PMID:29769718
  title: ANKRD16 prevents neuron loss caused by an editing-defective tRNA synthetase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full-text primary mouse study and PubMed identity verified. ANKRD16 accepts
