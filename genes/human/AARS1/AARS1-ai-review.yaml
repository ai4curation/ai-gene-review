proposed_new_terms:
- proposed_name: peptidyl-lysine lactylation
  proposed_definition: >-
    A peptidyl-lysine modification process in which a lactyl group is covalently added
    to the epsilon-amino group of a lysine residue within a protein.
  justification: >-
    GO:0141207 captures the ATP-dependent molecular activity but no current biological
    process term captures its immediate protein-modification outcome. The proposed term
    should be placed under GO:0018205 peptidyl-lysine modification and related to the
    broader GO:0043543 protein acylation branch; it would support curation of AARS1 and
    other experimentally established lysine lactylation mechanisms without conflating
    them with downstream signaling phenotypes.
  proposed_parent:
    id: GO:0018205
    label: peptidyl-lysine modification
  supported_by:
  - reference_id: PMID:38512451
    supporting_text: >-
      AARS1 translocated into the nucleus, where it directly catalyzed lactylation of
      YAP at K90 and TEAD1 at K108, thereby activating downstream target gene expression
      to promote tumor cell proliferation.
  - reference_id: PMID:38653238
    supporting_text: >-
      AARS1 binds to lactate and catalyzes the formation of lactate-AMP, followed by
      transfer of lactate to the lysince acceptor residue.
suggested_questions:
- question: >-
    Does full-length human AARS1 directly hydrolyze Gly-tRNA(Ala), and how do its
    catalytic efficiency and discrimination compare with Ser-tRNA(Ala) editing?
  experts: []
- question: >-
    Across physiological and pathological lactate concentrations, which endogenous
    protein substrates depend materially on AARS1 rather than class I HDACs or other
    lactylation routes, and in which cell states?
  experts: []
- question: >-
    Do AARS1 isoforms P49588-1 and P49588-2 differ in C-Ala-dependent editing,
    localization, oligomerization, DNA binding, or lactyltransferase activity?
  experts: []
suggested_experiments:
- hypothesis: >-
    Full-length human AARS1 directly edits Gly-tRNA(Ala), but with kinetics distinct
    from its directly established Ser-tRNA(Ala) editing activity.
  description: >-
    Prepare homogeneous Gly-tRNA(Ala) and Ser-tRNA(Ala), then measure steady-state and
    single-turnover deacylation by purified full-length human AARS1. Include catalytic-
    site and editing-site mutants, uncharged tRNA(Ala), cognate Gly-tRNA(Gly) and
    Ser-tRNA(Ser), and Escherichia coli AlaRS controls to establish substrate specificity
    and support or reject a direct human GO:0106026 annotation.
  experiment_type: biochemical enzyme kinetics
- hypothesis: >-
    Endogenous AARS1 contributes substantially to a restricted high-lactate,
    substrate-specific lactylome but not to basal global lysine lactylation.
  description: >-
    Use acute endogenous AARS1 degradation across a calibrated intracellular lactate
    series, followed by isotope-resolved quantitative lactyl-proteomics and targeted
    measurement of YAP1, TEAD1, and TP53 sites. Rescue with matched-expression AARS1
    variants that retain aminoacylation but differ in lactyltransferase activity, and
    compare with class I HDAC perturbation to separate AARS1-specific sites from the
    broader lactylome.
  experiment_type: acute perturbation and quantitative proteomics
- hypothesis: >-
    The isoform-2 insertion within C-Ala changes AARS1 editing coordination or its
    conditional noncanonical activities without abolishing alanine charging.
  description: >-
    Express P49588-1 and P49588-2 at matched endogenous levels in an AARS1-depleted
    human cell line and compare tRNA(Ala) charging, Ser/Gly-tRNA(Ala) editing, basal and
    lactate-induced localization, oligomeric state, DNA binding, and site-specific
    YAP1/TEAD1/TP53 lactylation. Parallel purified-protein assays should distinguish
    intrinsic isoform differences from cellular localization effects.
  experiment_type: isoform-resolved biochemical and cell-rescue analysis
