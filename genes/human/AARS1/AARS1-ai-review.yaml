core_functions:
- description: >-
    Cytosolic AARS1 activates L-alanine with ATP and transfers alanine to tRNA(Ala),
    producing Ala-tRNA(Ala) for cytoplasmic protein synthesis. This substrate-specific
    aminoacylation reaction is the enzyme's primary conserved activity.
  supported_by:
  - reference_id: PMID:28493438
    supporting_text: >-
      The aminoacylation activities of both variants were then tested using 14C-labeled
      alanine with various concentrations of tRNA.
  - reference_id: Reactome:R-HSA-379864
    supporting_text: >-
      AARS (cytosolic alanyl tRNA synthetase) catalyzes the reaction of alanine,
      tRNA(ala), and ATP to form Ala tRNA(Ala), AMP, and pyrophosphate.
  molecular_function:
    id: GO:0004813
    label: alanine-tRNA ligase activity
  directly_involved_in:
  - id: GO:0006419
    label: alanyl-tRNA aminoacylation
  locations:
  - id: GO:0005829
    label: cytosol
- description: >-
    The embedded AARS1 editing apparatus proofreads mischarged tRNA(Ala) and hydrolyzes
    the incorrect aminoacyl ester. Ser-tRNA(Ala) deacylation is directly demonstrated
    with human AARS1; Gly-tRNA(Ala) is a plausible conserved substrate but was not
    directly tested in the human studies examined here. This post-transfer editing preserves
    cytoplasmic translational fidelity.
  supported_by:
  - reference_id: PMID:28493438
    supporting_text: >-
      An in vitro editing activity assay was carried out using [3H] Ser-tRNAAla as a
      substrate.
  - reference_id: PMID:28493438
    supporting_text: >-
      tRNAAla can be mischarged with serine and glycine by AARS to yield Ser-tRNAAla
      and Gly-tRNAAla, respectively [Tsui and Fersht 1981]. To maintain the fidelity
      of aminoacylation, AARS possesses an editing domain that is capable of hydrolyzing
      the mischarged tRNAAla [Beebe et al. 2003; Guo et al. 2009].
  - reference_id: PMID:19661429
    supporting_text: >-
      In this way, the editing domain checks for mischarging by picking out tRNAs
      that have Gly or Ser and a G3•U70 pair.
  molecular_function:
    id: GO:0002161
    label: aminoacyl-tRNA deacylase activity
  directly_involved_in:
  - id: GO:0106074
    label: aminoacyl-tRNA metabolism involved in translational fidelity
  locations:
  - id: GO:0005829
    label: cytosol
- description: >-
    As a conditional secondary activity, AARS1 senses elevated intracellular L-lactate,
    forms lactoyl-AMP, and transfers lactyl groups to protein lysines. This activity can
    operate in the cytoplasm and, after lactate-induced nuclear import, in the nucleus on
    substrates including YAP1, TEAD1, and TP53. It is substrate- and context-dependent;
    AARS1 depletion did not reduce basal global lysine lactylation in untreated HEK293T
    cells.
  supported_by:
  - reference_id: PMID:38512451
    supporting_text: >-
      AARS1 was able to directly lactylate histone H3 and H4 in a manner dependent on
      both lactate and ATP
  - reference_id: PMID:38512451
    supporting_text: >-
      addition of lactate significantly promoted the nuclear localization of WT AARS1
      but not the ΔNLS mutant
  - reference_id: PMID:38653238
    supporting_text: >-
      AARS1 binds to lactate and catalyzes the formation of lactate-AMP, followed by
      transfer of lactate to the lysince acceptor residue.
  - reference_id: PMID:40835008
    supporting_text: >-
      However, the knockdown of either enzyme did not alter Kla levels (Fig. S6, B–E),
      suggesting the AARS pathway is also not required for global lysine lactylation.
  molecular_function:
    id: GO:0141207
    label: peptide lactyltransferase (ATP-dependent) activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005634
    label: nucleus
knowledge_gaps:
- gap_statement: >-
    Direct full-length human AARS1 Gly-tRNA(Ala) deacylation, and its kinetic
    specificity relative to Ser-tRNA(Ala), were not established in the human
    studies examined here.
  boundary: >-
    Recombinant human AARS1 directly deacylates Ser-tRNA(Ala). Conserved AlaRS-family
    experiments identify both glycine and serine errors, and human C-Ala restores an
    Escherichia coli editing construct. These observations motivate a human glycine-editing
    hypothesis but do not provide a verified source for a GO ISS transfer.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Direct human kinetics would determine whether GO:0106026 should be supported by
    IDA and whether glycine and serine errors are cleared with comparable efficiency.
  resolution: >-
    Measure steady-state and single-turnover deacylation of purified Gly-tRNA(Ala) and
    Ser-tRNA(Ala) by full-length recombinant human AARS1, with editing-site mutants and
    the bacterial enzyme as controls.
  provenance:
  - reference_id: PMID:28493438
    supporting_text: >-
      tRNAAla can be mischarged with serine and glycine by AARS to yield Ser-tRNAAla
      and Gly-tRNAAla, respectively [Tsui and Fersht 1981]. To maintain the fidelity
      of aminoacylation, AARS possesses an editing domain that is capable of hydrolyzing
      the mischarged tRNAAla [Beebe et al. 2003; Guo et al. 2009].
  - reference_id: PMID:19661429
    supporting_text: >-
      In this way, the editing domain checks for mischarging by picking out tRNAs
      that have Gly or Ser and a G3•U70 pair.
- gap_statement: >-
    The physiological lactate range, cell states, and substrate spectrum in which
    endogenous AARS1 makes a material contribution to protein lysine lactylation,
    relative to other enzymatic routes, remain incompletely defined.
  boundary: >-
    ATP-dependent AARS1 lactyltransferase chemistry and several target-specific effects
    are supported under elevated-lactate tumor conditions, but AARS1 knockdown did
    not lower basal global lysine lactylation in untreated HEK293T cells and the reported
    lactoyl-AMP reaction has a millimolar lactate Km.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this boundary would distinguish physiological AARS1 substrates from
    high-lactate or overexpression effects and prevent substrate-specific activity from
    being generalized to the basal global lactylome.
  resolution: >-
    Quantify endogenous, site-resolved lactylation across a calibrated intracellular
    lactate series after acute AARS1 depletion and matched rescue, alongside perturbation
    of class I HDAC-dependent lactylation and measurement of AARS1 charging activity.
  provenance:
  - reference_id: PMID:38512451
    supporting_text: >-
      Here, we report that alanyl-tRNA synthetase 1 (AARS1) moonlights as a bona fide
      lactyltransferase that directly uses lactate and ATP to catalyze protein lactylation.
  - reference_id: PMID:40835008
    supporting_text: >-
