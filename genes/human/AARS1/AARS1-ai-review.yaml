- id: PMID:37010095
  title: A humanized yeast model reveals dominant-negative properties of neuropathy-associated
    alanyl-tRNA synthetase mutations.
  findings:
  - statement: Multiple neuropathy-associated AARS1 variants interfere with wild-type AARS1 in
      a humanized yeast model; reducing their interaction rescues growth.
    supporting_text: We show that multiple loss-of-function AARS1 mutations impair yeast growth
      through an interaction with wild-type AARS1, but that reducing this interaction rescues
      yeast growth.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/Europe PMC identity and abstract verified. The cached abstract directly
      supports interaction-dependent dominant-negative effects and identifies the affected ARSs
      as homodimeric. The PMC full-text XML/HTML retrieval failed; detailed cellular dimer quantitation
      is therefore not quoted as cached evidence.
  full_text_unavailable: true
- id: PMID:40491354
  title: Recessive, pathogenic AARS1 variants display variable loss-of-function and dominant-negative
    effects.
  findings:
  - statement: K81T and E99G AARS1 combine loss-of-function and dominant-negative behavior in
      yeast, illustrating overlap between recessive-allele biochemistry and dominant neuropathy
      mechanisms.
    supporting_text: Interestingly, K81T and E99G AARS1 demonstrated both loss-of-function and
      dominant-negative effects, indicating that certain AARS1 variants can cause both dominant
      and recessive disease phenotypes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text primary study and PubMed identity verified. Tests 16 recessive-disease
      missense variants in humanized yeast and evaluates dominant-negative effects of severe alleles.
      The authors explicitly note false negatives and limited genotype-phenotype prediction; model
      interference is not evidence that every heterozygous carrier develops neuropathy.
- id: PMID:42744818
  title: Covalent allosteric inhibition of AARS1 lactyltransferase.
  findings:
  - statement: Structural, biochemical and cellular inhibitor studies corroborate AARS1 lactate
      recognition and lactate-dependent YAP lactylation.
    supporting_text: we show that XY353 and its derivative XY353-1 inhibit AARS1 by competing
      with lactate via the C184-F175-W176 relay
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text primary study and PubMed identity verified. Lactate binding, pyrophosphate-generation
      assays, structures and cellular YAP lactylation provide new support. The assays do not establish
      selective preservation of canonical tRNA charging or universal AARS1 dependence of basal
      protein lactylation.
- id: PMID:42607683
  title: Excess intracellular lactate represses mRNA translation and tumor progression through
    lactate-tRNA charging.
  findings:
  - statement: A 2026 primary report describes lactate charging onto tRNAs by AARS1 under excess
      intracellular lactate, a chemically distinct outcome from protein lysine lactylation.
    supporting_text: alanyl-tRNA synthetase 1 (AARS1) charges tRNAs with lactate instead of amino
      acids.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed/Europe PMC identifier, title and abstract verified. Full text was inaccessible
      from the publisher. Record as an emerging substrate-class finding and follow-up question;
      do not add a new GO activity/process or reinterpret established proofreading annotations
      from this abstract alone.
  full_text_unavailable: true
- id: PMID:16906134
  title: Editing-defective tRNA synthetase causes protein misfolding and neurodegeneration.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mouse sticky mutation links AlaRS editing failure to serine mischarging and
