      source, not as direct human evidence.
  full_text_unavailable: true
- id: PMID:25422440
  title: Deficiencies in tRNA synthetase editing activity cause cardioproteinopathy.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mouse editing-defect study underlying current Q8BGQ7 annotation rows. PubMed
