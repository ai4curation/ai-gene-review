      mouse source term, without assigning an AARS1-specific ANKRD16 process.
- id: file:human/AARS1/AARS1-deep-research-falcon.md
  title: Falcon/Edison deep research report for human AARS1 (2026-09-25)
  reference_review:
    relevance: MEDIUM
