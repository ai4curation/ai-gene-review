core_functions:
- description: Y-linked H3K4me2/3 demethylase that represses nuclear chromatin targets, including
    ZMYND8-cooccupied metastasis genes and androgen-receptor-regulated loci.
  molecular_function:
    id: GO:0034647
    label: histone H3K4me/H3K4me2/H3K4me3 demethylase activity
  directly_involved_in:
  - id: GO:0006355
    label: regulation of DNA-templated transcription
  locations:
  - id: GO:0000785
    label: chromatin
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:17320160
    supporting_text: Other SMCX family members, including SMCY, RBP2, and PLU-1, also demethylated
      H3K4me3
  - reference_id: PMID:27185910
    supporting_text: KDM5D physically interacts with AR in the nucleus, and regulates its
      transcriptional activity by demethylating H3K4me3 active transcriptional marks
  - reference_id: PMID:27477906
    supporting_text: We identified ZMYND8 as a transcriptional corepressor of the H3K4 demethylase
      JARID1D
suggested_questions:
- question: Which endogenous KDM5D target genes depend on ARID-domain DNA recognition versus PHD
    histone-tail binding for recruitment of the demethylase to chromatin?
suggested_experiments:
- hypothesis: KDM5D requires both ARID DNA binding and Jumonji catalytic residues to demethylate
    H3K4me2/3 at its strongest regulatory targets.
  description: Compare wild-type KDM5D, an ARID DNA-binding mutant and a catalytic Jumonji mutant by
    rescue after endogenous KDM5D depletion, assaying chromatin occupancy and H3K4me3 at direct
    target promoters.
  experiment_type: structure-guided rescue and chromatin profiling
