description: 'KDM5D/SMCY is a Y-linked nuclear JARID1-family H3K4me2/me3 demethylase. It acts on chromatin
  with cofactors such as ZMYND8 to repress metastasis-associated genes in prostate-cancer models, binds
  androgen receptor in the nucleus, and can demethylate H3K4me3 at androgen-receptor target chromatin.'
