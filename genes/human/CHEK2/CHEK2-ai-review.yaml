core_functions:
- description: CHEK2 transfers phosphate from ATP to protein serine/threonine residues. Regulated self-association
    and autophosphorylation couple activation to DNA-damage checkpoint and apoptotic signaling, principally
    in nuclear compartments. Substrate phosphorylation regulates downstream repair and transcriptional
    responses rather than executing their chemistry.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0000077
    label: DNA damage checkpoint signaling
  - id: GO:0006468
    label: protein phosphorylation
  - id: GO:0008630
    label: intrinsic apoptotic signaling pathway in response to DNA damage
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:10097108
    supporting_text: phosphorylated Cdc25C to promote the binding
  - reference_id: PMID:16794575
  - reference_id: PMID:12402044
  - reference_id: PMID:18644861
suggested_questions:
- question: Which CHEK2 products retain specific substrates, activation modes and compartment-specific
    functions in native human cells, particularly the partially active del2–3 product?
- question: Under which cell and damage conditions does CHEK2 contribute to CDC25A destruction, given
    the CHK1/Ser76-dependent pathway and retained turnover in CHK2-null HCT116 cells?
- question: Can the exact CARF and TNKS1BP1 interaction records and the cytoplasmic active-pool assertion
    be resolved independently of downstream CHK2 phosphorylation readouts?
suggested_experiments:
- description: Compare sequence-verified CHEK2 alternative products at endogenous abundance using matched
    substrate-phosphorylation and localization measurements, including a displayed-product control and
    kinase-dead controls.
- description: Combine acute CHK2 depletion with CHK1 perturbation and CDC25A site-specific mutants in
    matched damage contexts, measuring phosphorylation, ubiquitination and turnover separately.
