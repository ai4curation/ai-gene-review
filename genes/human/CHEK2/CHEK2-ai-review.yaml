id: O96017
gene_symbol: CHEK2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHEK2 encodes CHK2, an FHA-domain-containing protein serine/threonine kinase that couples
  DNA damage signaling to checkpoint control, substrate stability and apoptotic responses. ATM-dependent
  priming and regulated self-association promote activation-loop autophosphorylation. Nuclear CHK2 phosphorylates
  regulatory proteins including checkpoint phosphatases and factors controlling p53 signaling, transcription
  and DNA-repair pathway choice. Its action is regulatory rather than direct DNA rejoining. PML-associated
  nuclear pools and context-dependent extranuclear distributions have been reported. Alternative splicing
  produces proteins with different domain content and activity; the canonical 543-residue enzyme is not
  representative of every product.
