existing_annotations:
- term:
    id: GO:0005452
    label: solute:inorganic anion antiporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003020
  review:
    summary: InterPro2GO mapping of the HCO3 transporter (SLC4) signature to antiporter activity.
    action: REMOVE
    reason: >-
      NBCn1 is an electroneutral Na+-coupled bicarbonate COtransporter (symporter) with a
      1:1 Na+:HCO3- stoichiometry, not an anion antiporter/exchanger. The SLC4 superfamily
      includes both Cl-/HCO3- antiporters (AE1-3) and Na+-coupled cotransporters; the
      IPR003020 family signature cannot distinguish them, so this electronic mapping to
      antiporter activity is incorrect for this member. The transporter moves Na+ and
      HCO3- in the same direction (symport), a mechanism distinct from antiport, and is
      correctly
      captured by GO:0008510 sodium:bicarbonate symporter activity (accepted elsewhere in
      this review). GO:0005452 is not an ancestor of GO:0008510, so removing it does not
      violate the true path.
    supported_by:
    - reference_id: file:human/SLC4A7/SLC4A7-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: "Electroneutral sodium- and bicarbonate-dependent"
    - reference_id: file:human/SLC4A7/SLC4A7-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: "hydrogencarbonate(in) + Na(+)(in) = hydrogencarbonate(out) +"
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:14736710
  qualifier: enables
  supporting_entities:
  - UniProtKB:P00918
  review:
    summary: Physical interaction with carbonic anhydrase 2 (CA2) via the NBCn1 C-terminus.
    action: REMOVE
    reason: >-
      The interaction with CA2 (P00918) is genuine and functionally important - CA2 binds
      the NBCn1 cytoplasmic C-terminus to form a bicarbonate-transport metabolon that
      maximizes transport rate - but bare GO:0005515 protein binding conveys no molecular
      function and is removed per the project protein-binding policy. CA2 is a cytosolic
      enzyme with no PDZ domain, so there is no informative specific binding term to modify
      to. The functional partnership is retained in the SUBUNIT/activity-regulation record
      and in this review's reasoning; removal does not assert the interaction is false.
    supported_by:
    - reference_id: file:human/SLC4A7/SLC4A7-uniprot.txt
      record_section: ["CC:ACTIVITY REGULATION"]
      supporting_text: "Transporter activity is regulated by CA2/carbonic"
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:30126976
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q14160
  review:
    summary: PDZ-domain interaction with Scribble (SCRIB) mapped by phosphomimetic PDZ peptide-phage display.
    action: MODIFY
    reason: >-
      This row comes from a proteome-wide screen of PDZ-domain interactions, in which the
      SCRIB PDZ domain binds the C-terminal PDZ-binding motif of NBCn1. NBCn1 carries a
      C-terminal PDZ-binding motif (residues 1211-1214) that mediates interactions with
      PDZ-domain scaffolds, so the informative molecular function of NBCn1 in this
      interaction is PDZ domain binding rather than uninformative generic protein binding.
    proposed_replacement_terms:
    - id: GO:0030165
      label: PDZ domain binding
    supported_by:
    - reference_id: file:human/SLC4A7/SLC4A7-uniprot.txt
      record_section: ["CC:DOMAIN"]
      supporting_text: "The PDZ-binding motif mediates interaction with the CFTR,"
