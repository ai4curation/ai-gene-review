- term:
    id: GO:0006164
    label: purine nucleotide biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:35772404
  qualifier: involved_in
  review:
    summary: SLC4A7 loss reduces flux through de novo purine synthesis by limiting bicarbonate supply.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PMID:35772404 shows SLC4A7 is required for de novo purine synthesis flux in
      mTORC1-driven cells, but the mechanism is substrate supply: SLC4A7 imports bicarbonate,
      which the purine-pathway enzymes consume. SLC4A7 catalyses no step of purine
      biosynthesis and contributes no structure or cofactor activity to the pathway - it is
      required for and feeds the process but does not perform any of its work. By the
      participation test this is substrate provision, not involvement, and substrate
      transporters are conventionally not annotated to the downstream biosynthetic process.
      The genuine function (bicarbonate import) is captured by the transporter/transport
      terms. Marked as over-annotation rather than removed because the dependency is real.
    supported_by:
    - reference_id: PMID:35772404
      supporting_text: "loss of SLC4A7 resulted in reduced cell and tumor growth and decreased flux through de novo purine and pyrimidine synthesis in human cells and tumors without altering the intracellular pH"
