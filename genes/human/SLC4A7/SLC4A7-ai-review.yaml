suggested_questions:
- question: >-
    Is there a GO molecular-function or cellular-component way to record NBCn1's participation
    in a bicarbonate-transport metabolon with carbonic anhydrase 2, beyond generic enzyme
    binding?
suggested_experiments:
- description: >-
    Test whether forced bicarbonate supply, or expression of a catalytically competent but
    unrelated bicarbonate transporter, rescues de novo purine/pyrimidine synthesis flux in
    SLC4A7-null cells.
  hypothesis: >-
    SLC4A7's contribution to de novo nucleotide synthesis is purely substrate (bicarbonate)
    provision rather than a dedicated pathway function.
knowledge_gaps:
- gap_statement: >-
    Whether NBCn1 has a dedicated role in auditory receptor cell development, or whether the
    hearing/hair-cell phenotype of its loss is a secondary consequence of impaired
    bicarbonate/pH homeostasis in sensory cells, is undetermined.
  gap_kind:
  - BIOLOGY
