id: Q9Y6M7
gene_symbol: SLC4A7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC4A7 (NBCn1) is an electroneutral, sodium-coupled bicarbonate cotransporter of the
  SLC4/anion-exchanger superfamily. It is a multi-pass plasma membrane glycoprotein that
  co-imports Na+ and HCO3- with a 1:1 stoichiometry, and unlike its electrogenic paralog
  NBCe1 (SLC4A4) it moves no net charge. By importing bicarbonate it raises and defends
  intracellular pH, mediating pH recovery after an acid load and contributing to
  steady-state pH in epithelia, vascular smooth muscle, heart and neural tissue. Its
  transport is insensitive to stilbene derivatives (DIDS), inhibited by EIPA, and is
  modulated by a direct interaction of its cytoplasmic C-terminus with carbonic anhydrase 2
  (forming a bicarbonate-transport metabolon) and by cAMP/PKA. A C-terminal PDZ-binding
  motif couples the transporter to PDZ-domain scaffolds (e.g. NHERF1/2, PDZK1, CFTR
  complexes) that control its surface localization and activity. It is expressed broadly,
  with highest levels in testis, spleen, kidney, intestine, retina, heart and muscle, and
  is targeted to basolateral or apical membranes (and to cochlear hair-cell stereocilia)
  depending on cell type. Beyond pH homeostasis, bicarbonate supplied by NBCn1 serves as a
  metabolic substrate: in macrophages it supports cytoplasmic pH maintenance required for
  phagosome acidification, and in proliferating/tumor cells its translation is induced
  downstream of growth-factor/mTORC1 signaling to supply bicarbonate for de novo
  nucleotide synthesis.
