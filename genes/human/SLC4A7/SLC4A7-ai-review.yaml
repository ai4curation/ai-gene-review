core_functions:
- description: >-
    Electroneutral, sodium-coupled bicarbonate import across the plasma membrane. NBCn1
    cotransports Na+ and HCO3- in the same direction with a 1:1 stoichiometry, producing no
    net charge movement, and is insensitive to stilbene derivatives (DIDS) and inhibited by
    EIPA. Its C-terminal cytoplasmic domain binds carbonic anhydrase 2 to form a
    bicarbonate-transport metabolon that maximizes flux.
  molecular_function:
    id: GO:0008510
    label: sodium:bicarbonate symporter activity
  directly_involved_in:
