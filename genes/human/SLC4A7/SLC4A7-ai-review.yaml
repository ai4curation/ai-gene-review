- term:
    id: GO:0090383
    label: phagosome acidification
  evidence_type: IDA
  original_reference_id: PMID:29779931
  qualifier: involved_in
  review:
    summary: SLC4A7-mediated cytoplasmic pH maintenance is required for macrophage phagosome acidification.
    action: KEEP_AS_NON_CORE
    reason: >-
      PMID:29779931 shows loss of SLC4A7 impairs phagosome acidification in macrophages, but
      the paper's own mechanism is that SLC4A7 maintains cytoplasmic pH (by importing
      bicarbonate), which is in turn necessary for phagosome acidification (performed by the
      V-ATPase). SLC4A7 does not itself pump protons into the phagosome; its contribution to
      this process is indirect, via its core transport activity sustaining cytoplasmic pH.
      Given this is a direct experimental annotation on the human gene in a relevant cell
      type, it is retained but marked non-core (a macrophage-specific, mechanistically
      indirect role) rather than accepted as core.
    supported_by:
    - reference_id: PMID:29779931
      supporting_text: "Loss of SLC4A7 resulted in\nincreased cytoplasmic acidification during phagocytosis, suggesting that\nSLC4A7-mediated, bicarbonate-driven maintenance of cytoplasmic pH is necessary\nfor phagosome acidification"
