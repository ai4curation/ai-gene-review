  review:
    summary: Centromeric H3.3 occupancy does not yet resolve the narrower kinetochore localization assertion.
    action: UNDECIDED
    reason: The target P84243 leaf is inside PTN008517672, a Unikonts duplication node bearing the GO:0000776
      IBD assertion. All four retained experimental seed products resolve in the actual tree to centromeric
      histone H3 proteins (Candida and budding-yeast CSE4, Drosophila cid, and C. elegans hcp-3), and
      their current experimental kinetochore annotations were recovered. Human H3.3 is present in centromeric
      chromatin (PMID:21738837), but GO:0000776 denotes the spindle-microtubule attachment complex. The
      full FRET study distinguishes the C-terminal proximity of H3.1 from H3.3 to CENP-T while also finding
      the H3.3 N terminus in its distal neighborhood (PMID:25775162). That experiment therefore cannot
      be used as proof of total H3.3 exclusion. The available evidence leaves the exact complex-localization
      scope unresolved.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN008517672
        source_status: UNRESOLVED
        comment: Target ancestry is verified; all four IBD seeds are centromeric H3 variants, and the
          transfer scope to replacement H3.3 remains unresolved.
      - source_id: FB:FBgn0040477
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The tree maps cid to Q9V6Q2; current IDA kinetochore records cite PMID:17333235 and PMID:20862486.
          These support cid without resolving H3.3 complex membership.
    supported_by:
