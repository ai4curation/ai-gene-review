  review:
    summary: The inherited kinetochore-assembly assertion requires a more specific H3.3 mechanistic justification.
    action: UNDECIDED
    reason: P84243 genuinely descends from PTN008517671, where the retained IBD assigns GO:0051382. The
      experimentally grounded seeds in that retained assertion are centromeric H3 proteins, including
      human CENP-A; a current CENPA IDA annotation traces to PMID:11682612. This is a question about the
      breadth of the ancestral gain, not a bad-source allegation or an outside-clade transfer. Human H3.3
      is deposited at centromeric chromatin as a placeholder before CENP-A loading (PMID:21738837), while
      mouse H3.3 depletion increased, rather than reduced, centromeric CENP-A binding (PMID:26159997).
      Neither observation by itself establishes which assembly step H3.3 performs in building the microtubule-attachment
      complex. Leave unresolved rather than equating centromeric occupancy or necessity with assembly
      activity.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
