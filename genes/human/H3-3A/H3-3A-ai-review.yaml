id: P84243
gene_symbol: H3-3A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: H3-3A encodes histone H3.3, also encoded as an identical protein by H3-3B. H3.3 pairs with
  H4 in DNA-packaging nucleosomes and can replace histones independently of DNA replication, particularly
  at transcriptionally active genes. HIRA mediates deposition at genes, whereas ATRX–DAXX supports deposition
  at telomeres. Its Ser31 residue contributes to recognition of the H3.3K36me3 tail by ZMYND11. Pathogenic
  germline H3-3A variants cause Bryant-Li-Bhoj neurodevelopmental syndrome 1. Recurrent somatic substitutions
  such as K27M and G34R/V are associated with pediatric gliomas.
