  review:
    summary: >-
      generic peroxidase activity is less informative than the established thioredoxin-dependent peroxiredoxin activity.
    action: MODIFY
    reason: >-
      The protein is not a generic peroxidase in isolation: it is a typical 2-Cys peroxiredoxin whose core reaction is hydroperoxide
      reduction through thioredoxin. The specific GO:0140824 row should carry the activity.
