  - cell biologists
suggested_experiments:
- experiment_type: Compartment-resolved peroxide probe assay
  description: Rescue PRDX1-knockout cells with compartment-targeted wild-type and peroxidatic-cysteine mutant PRDX1 and
    measure local H2O2 clearance.
  hypothesis: The retained core compartment is the dominant site of PRDX1 thioredoxin-dependent peroxide detoxification.
