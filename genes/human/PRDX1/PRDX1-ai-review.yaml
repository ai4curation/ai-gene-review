  evidence_type: TAS
  original_reference_id: PMID:8089076
  qualifier: involved_in
  review:
    summary: >-
      the OSF-3 paper is a mouse osteoblast cloning study and does not establish a direct human PRDX1 developmental or proliferation
      function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The abstract describes mouse OSF-3 expression and speculates about bone-cell proliferation or differentiation, so the
      human PRDX1 row is an over-annotation relative to the direct cytosolic peroxidase function.
    supported_by:
    - reference_id: PMID:8089076
      supporting_text: >-
        This indicates that OSF-3 plays an intrinsic role in the proliferation and/or differentiation of bone cells.
