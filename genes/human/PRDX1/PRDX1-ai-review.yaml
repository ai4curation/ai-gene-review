id: Q06830
gene_symbol: PRDX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PRDX1 encodes peroxiredoxin-1, a cytosolic typical 2-Cys peroxiredoxin that reduces hydrogen peroxide and organic hydroperoxides
  through a thioredoxin-dependent catalytic cycle. It forms redox-linked homodimers and higher-order oligomers, protects and
  relays cytosolic peroxide signals, and can appear in secondary nuclear, melanosomal, or extracellular contexts.
