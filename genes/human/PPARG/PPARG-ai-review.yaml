id: P37231
gene_symbol: PPARG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PPARG encodes the lipid-activated nuclear receptor PPAR-gamma, a RXR-heterodimeric transcription factor
  that binds PPAR response elements in regulatory DNA and controls adipocyte differentiation, lipid storage,
  insulin-sensitizing adipokine expression and anti-inflammatory macrophage programs. Ligand binding shifts PPARG from
  corepressor to coactivator complexes in the nucleus; the adipocyte-enriched PPARgamma2 isoform is especially central
  to white, beige and brown fat differentiation, while PPARgamma1 acts in additional epithelial, vascular and immune
  contexts.
