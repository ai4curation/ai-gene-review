- term:
    id: GO:0008284
    label: positive regulation of cell population proliferation
  evidence_type: NAS
  original_reference_id: PMID:17143515
  qualifier: involved_in
  review:
    summary: NAS from the authors' interpretation of a knockdown in DU145 cells that reduced proliferation.
    action: MARK_AS_OVER_ANNOTATED
    reason: A single knockdown in one cancer cell line, from one lab and unreplicated in nearly 20 years.
      The locus is a TEC transcript with no annotated translation or orthologue, so an RNA-level effect
      cannot be separated from a protein-level one, and no mechanism links the peptide to proliferation
      control. The authors themselves describe only a 'putative mitogenic role'.
    supported_by:
    - reference_id: PMID:17143515
      supporting_text: Knockdown of MOST-1 expression in DU145 cells resulted in reduced cell proliferation
        but enhanced apoptosis
