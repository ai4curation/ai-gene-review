description: C8orf17 (MOST-1, MOLT-4 sequence tag-1) is a putative 99-amino-acid, basic, hydrophilic protein
  encoded by an intronless open reading frame at 8q24.3 lying within an intron of TRAPPC9. It has no recognisable
  domain or sequence motif, no transmembrane segment, and no annotated orthologue outside human; HGNC
  classifies the locus type as unknown and Ensembl annotates its transcript as TEC (to be experimentally
  confirmed). The transcript is of low abundance and was reported in a subset of normal tissues and in
  all cancer cell lines tested, with higher levels or copy number in high-grade breast and prostate carcinomas.
  One study, using an antibody raised to a synthetic peptide, reported cytoplasmic staining, co-immunoprecipitation
  with ferritin light chain, TSPO and immunoglobulin mu/delta heavy chains, and reduced proliferation
  with increased apoptosis after knockdown in DU145 prostate cancer cells. No molecular activity is known.
