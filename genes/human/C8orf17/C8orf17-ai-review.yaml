suggested_questions:
- question: Is the C8orf17 ORF translated in human cells? Ribosome profiling and targeted mass spectrometry
    of a unique peptide would settle whether the TEC transcript encodes a stable protein.
- question: Does the DU145 proliferation/apoptosis phenotype survive an ORF-specific test (start-codon
    mutation or frame-preserving rescue) rather than transcript knockdown?
suggested_experiments:
- hypothesis: The C8orf17 ORF produces an endogenous protein.
  description: Tag the endogenous ORF (CRISPR knock-in of a C-terminal HiBiT or epitope tag) in DU145
    or MOLT-4 cells and look for translation by ribosome profiling; if a product is detected, determine
    localisation by co-staining with ER and nuclear markers.
