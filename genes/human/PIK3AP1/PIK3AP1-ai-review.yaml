  review:
    summary: A recruited BCAP pool acts at the cytoplasmic surface of receptor-bearing plasma membrane.
    action: ACCEPT
    reason: BCAP organizes p85-containing PI3K signaling in membrane-associated complexes. Native mouse
      macrophage fractionation shows stimulus-associated membrane enrichment, while human TIR-domain and
      phosphotyrosine interaction studies establish the recruitment machinery. Reactome BCR/PI3K events
      provide conserved human pathway placement, not independent imaging or an integral-membrane topology.
