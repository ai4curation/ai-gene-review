id: Q6ZUJ8
gene_symbol: PIK3AP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PIK3AP1 encodes BCAP, a multidomain intracellular adaptor linking immune receptors to phosphoinositide
  3-kinase signaling. Its phosphorylated motifs and proline-rich regions recruit p85 and other SH2/SH3-containing
  proteins, including GRB2. The long isoform contains an N-terminal TIR domain that connects BCAP to Toll-like-receptor
  signalosomes; DBB/ankyrin-containing regions support self-association. Cytosolic BCAP can be recruited
  to receptor-bearing membranes. Its signaling functions contribute to B-cell activation and to context-dependent
  control of inflammatory cytokine production in innate immune cells. It lacks the lipid-kinase activity
  of the p110 enzymes it helps recruit.
