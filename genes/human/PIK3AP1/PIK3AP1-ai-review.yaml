- term:
    id: GO:0034134
    label: toll-like receptor 2 signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9EQ32
  - ensembl:ENSMUSP00000052777
  review:
    summary: BCAP participates in the TLR2 response through intracellular adaptor signaling.
    action: KEEP_AS_NON_CORE
    reason: The original assignment transfers mouse Q9EQ32 biology. Native macrophage ligand and knockout
      studies support TLR2-responsive PI3K/cytokine regulation; human BCAP has the corresponding TIR and
      p85-binding machinery. This is a conserved mammalian process inference, not a claim that the human
      receptor-specific loss-of-function experiment was performed. Direct human TLR2/4-domain binding
      is established separately; it is not silently extended to direct TLR7/9 binding. Isoform, stimulus
      and cytokine output matter, so participation is not an assertion of a universally negative inflammatory
      sign.
    supported_by:
    - reference_id: PMID:22187460
    - reference_id: PMID:27909057
