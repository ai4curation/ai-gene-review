- id: PMID:27909057
  title: Structure of the Toll/Interleukin-1 Receptor (TIR) Domain of the B-cell Adaptor That Links Phosphoinositide
    Metabolism with the Negative Regulation of the Toll-like Receptor (TLR) Signalosome.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results/Methods inspected. TIR-domain crystallography and solution assembly are
      direct human protein assays; receptor-domain yeast two-hybrid and HEK293T co-IP are not presented
      as native macrophage receptor-complex structures.
  findings:
  - statement: Purified human BCAP is dimeric whereas its isolated TIR domain is monomeric; the TIR-containing
      BCAP construct interacts with TLR2/TLR4 domains in yeast two-hybrid.
    supporting_text: Full-length BCAP is dimeric, and the N-terminal domain is monomeric.
- id: PMID:31527084
  title: Phosphorylation of the multifunctional signal transducer B-cell adaptor protein (BCAP) promotes
    recruitment of multiple SH2/SH3 proteins including GRB2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results and Methods inspected, including purified-domain assays and kinase comparison.
      The paper distinguishes earlier chicken/mouse pathway requirements from recombinant human substrate
      biochemistry; in vitro ranking is not a universal native kinase hierarchy.
  findings:
  - statement: Human BCAP directly binds GRB2 SH3 and p85 domains; purified BCAP is phosphorylated by
      BTK, SYK and LYN with different efficiencies in the tested conditions.
    supporting_text: 'the SH3 domain of GRB2 can bind to BCAP

      independently of BCAP phosphorylation status'
- id: PMID:22187458
  title: B-cell adaptor for PI3K (BCAP) negatively regulates Toll-like receptor signaling through activation
    of PI3K.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results read. Bone-marrow-derived macrophages, knockout/WT and YXXM-mutant complementation;
      membrane fractionation is a mouse assay, not new human imaging.
  findings:
  - statement: Native mouse macrophage BCAP promotes PI3K activation while restraining TLR4/7/9-induced
      inflammatory cytokines.
- id: PMID:22187460
  title: Role for B-cell adapter for PI3K (BCAP) as a signaling adapter linking Toll-like receptors (TLRs)
    to serine/threonine kinases PI3K/Akt.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results/Methods inspected; mouse physiology and heterologous constructs are distinguished
      from direct human biochemical evidence.
  findings:
  - statement: BCAP couples TLR signaling to PI3K; mouse macrophage perturbations and TIR-domain constructs
      support the adaptor mechanism.
- id: PMID:11163197
  title: 'BCAP: the tyrosine kinase substrate that connects B cell receptor to phosphoinositide 3-kinase
    activation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract inspected. DT40 is an avian B-cell context, not a native human assay. Used
      as comparative pathway evidence alongside human BCAP biochemistry.
  findings:
  - statement: Chicken DT40 BCAP deletion reduces BCR-stimulated PIP3 generation and Akt response; phosphorylation
      provides p85 docking sites.
    supporting_text: 'Disruption of the BCAP gene in the DT40 B cell line inhibits

      BCR-mediated phosphatidylinositol 3,4,5-trisphosphate generation'
- id: PMID:20728433
  title: Identification of BCAP-(L) as a negative regulator of the TLR signaling-induced production of
    IL-6 and IL-10 in macrophages by tyrosine phosphoproteomics.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract inspected. This is a mouse macrophage line and an isoform-selective intervention;
      do not infer all BCAP isoforms inhibit every cytokine.
  findings:
  - statement: Selective BCAP-L depletion in RAW264.7 macrophages raises IL-6/IL-10 but not TNF-alpha,
      establishing isoform/output specificity.
    supporting_text: 'RNAi-mediated selective depletion of BCAP-(L) enhanced IL-6 and IL-10

      production but not TNF-α production'
- id: PMID:15893754
  title: Identification of B cell adaptor for PI3-kinase (BCAP) as an Abl interactor 1-regulated substrate
    of Abl kinases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract inspected; the finding is restricted to the experiment explicitly reported
      there, without inventing inaccessible methods.
  findings:
  - statement: A human leukocyte cDNA screen identifies BCAP as an ABI1-interacting protein, with ABI1
      promoting Abl-dependent phosphorylation.
core_functions:
- description: Provides p85-binding scaffold activity linking phosphorylated immune-receptor signalosomes
    to class IA PI3K/AKT signaling. Human BCAP domain assays establish the binding mechanism; native B-cell
    and macrophage perturbations supply comparative physiological support.
