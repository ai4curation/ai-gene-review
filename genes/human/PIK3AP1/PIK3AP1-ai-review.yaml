  review:
    summary: BCAP binds GRB2 through its SH3-domain interaction machinery.
    action: MODIFY
    reason: The original publication reports the BCAP–GRB2 association. Independent human BCAP biochemical
      dissection in PMID31527084 combines coimmunoprecipitation and purified domain pulldowns, establishing
      phosphorylation-independent GRB2 SH3 binding. This target/pair-specific evidence justifies refining
      generic binding to SH3 domain binding; the original interaction screen is not relabeled as a purified
      binary assay.
