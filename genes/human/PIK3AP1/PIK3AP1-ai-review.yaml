  review:
    summary: Human BCAP associates with signaling-receptor TIR domains.
    action: ACCEPT
    reason: 'The ancestral node PTN000417769 spans related BANK/Dof-family proteins, but target human
      BCAP evidence independently supports the claim: PMID27909057 tests a human BCAP fragment against
      TLR2/TLR4 TIR domains by yeast two-hybrid and examines associated adaptor interactions. This is
      receptor binding in the TLR context, not evidence that BCAP directly binds the extracellular BCR
      antigen receptor or recognizes microbial ligands. No reconstruction or relocation of the PAINT node
      is claimed.'
    supported_by:
    - reference_id: PMID:27909057
