  review:
    summary: BMP10 is an extracellular TGF-beta-superfamily signaling ligand.
    action: ACCEPT
    reason: The PAINT cytokine assertion is consistent with BMP10 activating receptor complexes
      and downstream SMAD signaling (PMID:16049014; PMID:17068149). This is an inherited ligand
      activity; neither the number of donor proteins nor the presence of target-specific evidence
      challenges the ancestral-node inference. The PAINT tree itself was not independently
      re-curated.
    additional_reference_ids:
    - PMID:16049014
    - PMID:17068149
- term:
    id: GO:0005179
    label: hormone activity
  evidence_type: IDA
  original_reference_id: PMID:17921333
  qualifier: enables
  review:
    summary: Secreted BMP10 can transmit a regulatory signal to responding cardiomyocytes.
    action: ACCEPT
    reason: The PMID:17921333 abstract reports extracellular secretion and hypertrophic activity
      of conditioned medium on rat neonatal cardiomyocytes. This supports the existing hormone-activity
      assertion at the level of a secreted regulatory ligand. It does not independently establish
      physiological circulating concentrations or a specific endocrine route. The narrower
      core summary uses growth-factor activity.
