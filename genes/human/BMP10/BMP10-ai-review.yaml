  review:
    summary: BMP10 prodomain binding to fibrillin-2 is supported by recombinant binding measurements.
    action: MODIFY
    reason: Selected Table 3 and Discussion of PMID:18339631 identify binding of the BMP10 prodomain
      to recombinant fibrillin-2 fragment rF86. Fibrillin-2 is an extracellular matrix component, so
      GO:0050840 refines the existing physical interaction without assigning an additional signaling
      activity. The experiment used a fibrillin fragment; binding to an assembled microfibril is not
      asserted by this refinement.
