  review:
    summary: HuRI reports BMP10 binding to BSCL2 (UniProtKB:J3KQ12); interpretation of the specific assay
      remains unresolved.
    action: UNDECIDED
    reason: The source IPI tuple names BSCL2 (UniProtKB:J3KQ12), also recorded in the cached BMP10 UniProt
      interaction list. Those records can share HuRI provenance and are not independent confirmation.
      For BSCL2, the membrane-localization concern requires the actual interaction domain and its orientation
      to be established; an ER-associated label alone does not exclude contact with a BMP10 precursor
      in the secretory pathway. The J3KQ12 construct itself has not been inspected. The HuRI methods
      describe binary screening, retesting and sequence confirmation, but the exact BMP10/partner constructs,
      pair-specific supplementary record and any orthogonal validation have not been independently read.
      It is therefore unclear how the assay relates to the processed extracellular BMP10 species. UNDECIDED
      records that evidence limit; generic wording and topology alone do not justify REMOVE.
