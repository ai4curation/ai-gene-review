  review:
    summary: The BMP10 interaction with ACVRL1/ALK1 is functionally a receptor-binding interaction.
    action: MODIFY
    reason: The PMID:17068149 abstract explicitly identifies BMP10 as a potent ALK1 ligand.
      The source partner P37023 is the ALK1 receptor, and the seeded receptor serine/threonine
      kinase binding term already captures this mechanism more informatively than generic
      protein binding. BMP9-specific quantitative experiments are not transferred to BMP10.
      The selected binary/ternary receptor-complex Results in PMID:35504921 independently
      resolve BMP10 contacts with ALK1 and BMPRII. This evidence supports the proposed receptor-binding
      specificity.
    proposed_replacement_terms:
    - id: GO:0033612
      label: receptor serine/threonine kinase binding
    additional_reference_ids:
    - PMID:35504921
