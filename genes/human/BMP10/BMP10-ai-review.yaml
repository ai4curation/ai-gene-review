  review:
    summary: BMP10 promotes proliferation during embryonic heart morphogenesis.
    action: KEEP_AS_NON_CORE
    reason: Knockout and ligand-rescue experiments connect cardiomyocyte proliferation with chamber growth.
      Retain this developmental signaling outcome as non-core. This is independent corroboration; the
      original donor-reference edge remains unverified. PMID:15073151 also links the mouse knockout phenotype
      to ectopic/elevated CDKN1C/p57KIP2 and reduced maintenance of NKX2-5 and MEF2C expression at mid-gestation.
