id: O95393
gene_symbol: BMP10
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BMP10 is a secreted TGF-beta-superfamily growth factor synthesized as a precursor
  with an N-terminal prodomain and a C-terminal signaling chain. Proprotein-convertase processing
  permits receptor activation while the prodomain can remain noncovalently associated. BMP10
  engages type I and type II serine/threonine kinase receptors, including ACVRL1/ALK1 and
  BMPRII, to stimulate SMAD1/5/9 signaling. Its extracellular signaling supports cardiac development
  and regulates endothelial responses. The processed prodomain-growth-factor complex binds
  fibrillin-1, contributing to extracellular targeting, and interaction with telethonin has
  been implicated in secretion and cardiac hypertrophic responses.
