  review:
    summary: The BMP10 prodomain docks to fibrillin-1 in an extracellular targeting interaction.
    action: MODIFY
    reason: PMID:18339631 reports BMP10 prodomain binding to the N-terminal region of fibrillin-1, an
      extracellular matrix component. GO:0050840 captures that binding specificity more informatively
      than generic protein binding. PMID:39921464 section 3.8 further measures binding of the processed
      prodomain-growth-factor complex to a fibrillin-1 fragment, with no detected binding by the unprocessed
      precursor in that assay. The refinement describes extracellular targeting, not receptor activation
      or a new core function; it does not assert an independently established in-vivo latent conformation.
    supported_by:
    - reference_id: PMID:18339631
      supporting_text: N-terminal end of fibrillin-1 serves as a universal high affinity docking site
    additional_reference_ids:
