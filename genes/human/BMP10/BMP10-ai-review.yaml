  evidence_type: IDA
  original_reference_id: PMID:17068149
  qualifier: involved_in
  review:
    summary: BMP10 reduces the endothelial growth readout, but the measured endpoint does not resolve
      cell enlargement versus proliferation or survival.
    action: UNDECIDED
    reason: PMID:17068149 describes inhibition of endothelial growth; Figure 6E measures WST-1 absorbance
      as viable-cell abundance after 24 and 48 hours of BMP10 treatment. This supports the reported growth
      phenotype but does not measure individual-cell enlargement, which GO:0030308 regulates, or distinguish
      cell proliferation from survival and metabolic changes. The suggestion to replace it with GO:0001937
      is plausible but not established by that endpoint alone. Retain UNDECIDED because the interpretation
      and appropriate replacement remain uncertain, not because the caption was inaccessible. Figure
      6D separately measures wound closure, so accepting its migration interpretation does not require
      treating WST-1 as a division assay.
