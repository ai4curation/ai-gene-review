suggested_questions:
- question: Which BMP10 and partner constructs underlie each HuRI PMID:32296183 assertion, including
    TMPRSS2 O15393-2 and SLC35C2 Q9NQQ7-3, and which pairs have independent validation with the relevant
    processed or precursor BMP10 species in a compatible compartment?
- question: Does BMP10 reduce endothelial division in the PMID:17068149 conditions when measured
    directly with cell-cycle or DNA-synthesis readouts and separate survival controls, or is the
    WST-1 growth effect explained by another change in viable-cell abundance or metabolism?
- question: Which direct contraction measurement supports the PMID:17921333 GO:0055117 assertion,
    independently of hypertrophy, sarcomeric maturation and telethonin interaction?
- question: Which mouse donor experiments specifically establish the adult-heart, atrial-morphogenesis
    and cartilage-development transfer assertions, beyond BMP10 expression or broader ventricular
    developmental effects?
