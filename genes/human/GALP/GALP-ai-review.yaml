gene_symbol: GALP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Secreted neuroendocrine peptide precursor synthesized predominantly in
  hypothalamic arcuate nucleus neurons and posterior pituitary pituicytes. Proteolytically
  processed from a 116-amino-acid preproprotein into the 60-residue mature galanin-like peptide
  (GALP, residues 25-84), whose central segment (residues 9-21 of mature GALP) is 100% identical
  to the N-terminal 13-residue receptor-activating pharmacophore of galanin (Gly-Trp-Thr-Leu-Asn-Ser-Ala-Gly-Tyr-Leu-Leu-Gly-Pro).
  Mature GALP acts as an endogenous neuropeptide hormone agonist that binds and
  activates the G protein-coupled galanin receptors — preferentially Gq/11-coupled GALR2 and
  Gi/o-coupled GALR3, with lower affinity for GALR1 — to initiate the galanin-activated
  signaling pathway and link metabolic state to feeding behavior and reproductive
  neuroendocrine secretion. Alternative splicing skipping exon 3 generates isoform 2, which is
  processed into alarin, a 25-residue vasoactive neuropeptide lacking the galanin-homologous
  domain.
