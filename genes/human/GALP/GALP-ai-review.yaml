  review:
    summary: >-
      Core localization of secreted mature GALP in the extracellular space where it binds cell-surface
      galanin receptors.
    action: ACCEPT
    reason: >-
      GALP carries a cleavable N-terminal signal peptide (residues 1-24) and is secreted into the
      extracellular space as a 60-residue mature neuropeptide hormone (PMID:10601261).
    supported_by:
    - reference_id: PMID:10601261
