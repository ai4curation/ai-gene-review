- term:
    id: GO:0005184
    label: neuropeptide hormone activity
  evidence_type: ISS
  original_reference_id: PMID:10601261
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9QXQ6
  review:
    summary: >-
      Mature GALP-(1-60) is a secreted hypothalamic neuropeptide hormone carrying the conserved
      13-residue galanin pharmacophore (GALP residues 9-21) that activates G protein-coupled
      galanin receptors.
    action: NEW
    reason: >-
      Human GALP-(1-60) shares the conserved receptor-binding pharmacophore (residues 1-24 highly
      conserved across human, rat, and pig; residues 9-21 identical to galanin 1-13) that
      stimulates [35S]GTPgammaS binding at GALR2 (IC50 = 0.24 nM) and GALR1 (IC50 = 4.3 nM;
      PMID:10601261). Human GALP currently carries only generic IEA hormone activity (GO:0005179);
      adding GO:0005184 (neuropeptide hormone activity) captures its specific molecular function.
    supported_by:
    - reference_id: PMID:10601261
      supporting_text: >-
        We isolated a novel galanin-like peptide (GALP) from porcine hypothalamus by observing its
        activity for increasing [(35)S]GTPgammaS binding to a membrane preparation of
        GALR2-transfected cells. The peptide had 60 amino acid residues and a non-amidated C
        terminus. The amino acid sequence of GALP-(9-21) was completely identical to that of
        galanin-(1-13).
