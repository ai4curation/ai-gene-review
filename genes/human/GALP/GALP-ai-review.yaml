proposed_new_terms: []
suggested_questions:
- question: >-
    What is the cognate cell-surface receptor for the alternatively spliced GALP isoform 2 peptide
    alarin (which lacks the exon 3-encoded galanin-(1-13) pharmacophore and does not bind GALR1-3)?
- question: >-
    How do the conserved C-terminal residues 41-53 of mature GALP-(1-60) interact with the
    extracellular loops of GALR2 and GALR3 to confer receptor subtype selectivity over GALR1?
suggested_experiments:
- description: >-
    Determine cryo-EM structures of human GALP-(1-60) bound to GALR2-Gq and GALR1-Gi1 complexes to
    define how the C-terminal tail of GALP (residues 22-60) confers ~18-fold selectivity for GALR2
    over GALR1 despite sharing an identical 13-residue N-terminal pharmacophore with galanin.
  hypothesis: >-
    Extracellular loop 2/3 contacts with the conserved C-terminal segment of GALP (residues 41-53)
    selectively stabilize the active conformation of GALR2 relative to GALR1.
