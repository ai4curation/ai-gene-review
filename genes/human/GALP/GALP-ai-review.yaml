        cDNA, which indicated that the amino acid sequences 1-24 and 41-53 were highly conserved
        between humans, rats, and pigs.
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0005179
  review:
    summary: >-
      Logical inference from hormone activity (GO:0005179), but too general: GALP specifically
      initiates the galanin-activated signaling pathway (GO:0090663).
    action: MODIFY
    reason: >-
      Mature GALP shares the conserved 13-residue pharmacophore of galanin (GALP residues 9-21 =
      galanin residues 1-13) and binds and activates GALR2, GALR1, and GALR3 to initiate the
      galanin-activated signaling pathway (GO:0090663; PMID:10601261). Replace generic signal
      transduction (GO:0007165) with GO:0090663 (proposed as a NEW annotation below).
    proposed_replacement_terms:
    - id: GO:0090663
      label: galanin-activated signaling pathway
    supported_by:
    - reference_id: PMID:10601261
      supporting_text: >-
        Receptor binding studies revealed that porcine GALP-(1-60) had a high affinity for the
        GALR2 receptor (IC(50) = 0.24 nM) and a lower affinity for the GALR1 receptor (IC(50) =
        4.3 nM). In contrast, galanin showed high affinity for the GALR1 (IC(50) = 0.097 nM) and
        GALR2 receptors (IC(50) = 0.48 nM). GALP is therefore an endogenous ligand that
        preferentially binds the GALR2 receptor, whereas galanin is relatively non-selective.
