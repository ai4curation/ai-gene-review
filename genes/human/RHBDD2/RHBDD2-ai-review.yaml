  title: Dynamics of the rhomboid-like protein RHBDD2 expression in mouse retina and involvement
    of its human ortholog in retinitis pigmentosa.
  findings:
  - statement: Rhbdd2 localizes to Golgi membranes in mouse retina, with perinuclear Golgi staining
      and Golgi packing dependent on a glycine zipper motif.
    supporting_text: only the S 2 fraction (the Golgi membrane fraction) contains an appreciable
      amount of RHBDD2 protein
  - statement: A high-molecular-mass RHBDD2 form appears in cone outer segments, and a homozygous
      R85H variant in human RHBDD2 co-segregated with autosomal recessive retinitis pigmentosa in
      one family.
    supporting_text: We identified a homozygous mutation in the human RHBDD2 gene, R85H, that co-segregates
      with disease in affected members of a family with autosomal recessive retinitis pigmentosa
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text mouse retinal localization, glycine-zipper mutagenesis and human arRP
      variant study; used to support RHBDD2 Golgi/perinuclear localization and to frame the remaining
      molecular-function gap.
