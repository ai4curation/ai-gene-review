core_functions:
- description: Inactive rhomboid-like multi-pass membrane protein resident at the Golgi/cis-Golgi
    network with no established enzymatic or adaptor activity.
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - *id002
  - *id001
knowledge_gaps:
- gap_statement: RHBDD2's biochemical molecular function remains unknown despite evidence that it is
    a Golgi-associated inactive rhomboid-like membrane protein.
  boundary: Ahmedli et al. established Golgi association, perinuclear retinal staining, glycine-zipper-dependent
    Golgi packing, cone outer-segment high-molecular-mass RHBDD2 and an R85H arRP candidate variant;
    reviewed UniProt records loss of the conserved rhomboid-protease active sites.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Resolving the activity is needed to explain why RHBDD2 is retained at the Golgi and
    how an inactive rhomboid-like protein could contribute to retinal cell biology.
  resolution: Identify RHBDD2-dependent Golgi clients or interacting partners with wild-type versus
    glycine-zipper mutant RHBDD2, then assay whether the protein scaffolds a trafficking, retention
    or quality-control complex.
  provenance:
  - reference_id: PMID:23386608
    supporting_text: Because the biochemical functions of RHBDD2 have not been determined and establishing
      them will require a more complete understanding of the protein
  - *id001
suggested_experiments:
- description: Test wild-type and glycine-zipper mutant RHBDD2 in Golgi-localized interaction proteomics
    and ER/Golgi cargo assays to identify whether RHBDD2 scaffolds a trafficking, retention or quality-control
    complex rather than acting as an intramembrane protease.
