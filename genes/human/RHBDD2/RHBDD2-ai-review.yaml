  label: Homo sapiens
description: 'RHBDD2 is an inactive rhomboid-like, multi-pass membrane protein associated with
  the Golgi apparatus. Mouse Rhbdd2 localizes to Golgi membranes and requires a glycine zipper
  motif for Golgi packing; a high-molecular-mass RHBDD2 form is found in cone outer segments,
  and a human R85H variant co-segregated with autosomal recessive retinitis pigmentosa in one
  family. RHBDD2 is related to S54-family rhomboid proteases, but it lacks the conserved active-site
  residues and no peptidase activity has been established.'
