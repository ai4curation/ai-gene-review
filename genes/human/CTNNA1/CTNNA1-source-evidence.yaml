  identity: P26231 is mouse Ctnna1; Q5U302 is rat Ctnna1; Q9PVF8 is zebrafish ctnna1. Their
    verified Ensembl aliases are the same donors, not additional independent experiments.
    Q61301 is mouse Ctnna2 and remains a distinct paralog.
  query_locator: https://www.ebi.ac.uk/QuickGO/annotations?geneProductId=UniProtKB%3AP35221
  uncertain_expression_sources:
  - pmid: '10864803'
    context: Rat ovarian/developmental estrogen-associated expression; rows 0/110.
  - pmid: '7507830'
    context: Rat Sertoli/gonad developmental expression; row 93.
  - pmid: '12387456'
    context: Rat pilocarpine/mossy-fiber sprouting context; row 105.
  - pmid: '10681393'
    context: Rat ameloblast/incisor development; row 106.
  uncertainty: The five rat IEP transfers remain unresolved because the complete source experiments
    and regulatory context were not recovered. IEP is permitted for biological-process annotation
    and is not itself an exclusion. The separately inspected indole-treatment experiment was
    judged insufficient at its specific performed-role scope. Estrogen responses can include
    expression changes; tooth development includes enamel-covered dentin teeth.
  formal_reference_sources:
  - pmid: '10681393'
    cache: ../../../publications/PMID_10681393.md
    public: https://pubmed.ncbi.nlm.nih.gov/10681393/
    access: Complete cached abstract read; full main experiments unavailable.
    scope: The complete cached abstract identifies rat incisor immunohistochemistry and alpha-catenin
      expression throughout amelogenesis. This verifies the donor study and expression context,
      but the specific tooth-development contribution remains unresolved without the full
      experiments.
  - pmid: '10864803'
    cache: ../../../publications/PMID_10864803.md
    public: https://pubmed.ncbi.nlm.nih.gov/10864803/
    access: Complete cached abstract read; full main experiments unavailable.
    scope: The complete cached abstract reports rat ovarian localization and decreased alpha-catenin
      abundance after diethylstilbestrol or hCG treatment. The follicle-development and estrogen-response
      participation inferences remain unresolved; the full original was not recovered.
  - pmid: '11025210'
    cache: ../../../publications/PMID_11025210.md
    public: https://pubmed.ncbi.nlm.nih.gov/11025210/
    access: Complete cached abstract read; full main experiments unavailable.
    scope: The complete cached abstract explicitly distinguishes the mouse blastocyst alpha/beta-catenin
      zonula-adherens complex from the more apical tight junction. It supports the donor localization;
      the full experimental account was not recovered.
  - pmid: '12387456'
    cache: ../../../publications/PMID_12387456.md
    public: https://pubmed.ncbi.nlm.nih.gov/12387456/
    access: Complete cached abstract read; full main experiments unavailable.
    scope: The complete cached abstract reports region-specific alpha-catenin immunoreactivity
      during pilocarpine-associated mossy-fiber sprouting in adult rat brain. The full original
      was not recovered, and this association does not settle the specific axon-regeneration
      participation assertion.
  - pmid: '12577316'
    cache: ../../../publications/PMID_12577316.md
    public: https://pubmed.ncbi.nlm.nih.gov/12577316/
    access: Complete cached abstract read; full main experiments unavailable.
    scope: The complete cached abstract reports a rat cardiomyocyte calcium-switch experiment,
      catenin/ZO-1/Cx43 association, and inhibited Cx43 membrane redistribution after intracellular
      anti-alpha-catenin antiserum delivery. This supports a contextual assembly contribution;
      detailed controls and figures remain outside the recovered scope.
  - pmid: '12960056'
    cache: ../../../publications/PMID_12960056.md
    public: https://pubmed.ncbi.nlm.nih.gov/12960056/
    access: Complete cached abstract read; full main experiments unavailable.
    scope: The complete cached abstract establishes rat epididymal alpha-catenin localization
      and androgen-associated redistribution. Its explicit co-immunoprecipitation statement
      concerns ZO-1 with beta-catenin; the alpha/beta-catenin pair-specific assay supporting
      the donor IPI remains unverified. The conserved binding function has independent support.
  - pmid: '14657280'
    cache: ../../../publications/PMID_14657280.md
    public: https://pubmed.ncbi.nlm.nih.gov/14657280/
    access: Complete cached abstract read; full main experiments unavailable.
    scope: The complete cached abstract describes cadherin-triggered lamellipodia and cadherin-catenin
      complex recruitment, emphasizing p120 signaling. The exact alpha-catenin localization
      experiment used for the mouse donor annotation was not recovered; the inherited positive
      localization retains curator deference.
  - pmid: '17535849'
    cache: ../../../publications/PMID_17535849.md
    public: https://pubmed.ncbi.nlm.nih.gov/17535849/
    access: Complete cached abstract read; full main experiments unavailable.
    scope: The complete cached abstract explicitly reports alphaE-catenin colocalization with
      alphaT-catenin at cardiac intercalated discs. It supports that location, while the demonstrated
      plakophilin interaction is alphaT-catenin-specific and is not transferred to CTNNA1.
      Full main text was not recovered.
  - pmid: '7507830'
    cache: ../../../publications/PMID_7507830.md
    public: https://pubmed.ncbi.nlm.nih.gov/7507830/
    access: Complete cached abstract read; full main experiments unavailable.
    scope: The complete cached abstract reports alpha-catenin redistribution during rat testis
      maturation, including the Sertoli-cell junctional region and absence from Sertoli-germ-cell
      contacts. It verifies the developmental expression context; the specific male-gonad-development
      contribution remains unresolved without the full experimental account.
  - pmid: '8834786'
    cache: ../../../publications/PMID_8834786.md
    public: https://pubmed.ncbi.nlm.nih.gov/8834786/
    access: Complete cached abstract read; full main experiments unavailable.
    scope: The complete cached abstract describes two separable N-cadherin/alpha-catenin complexes
      with beta-catenin or plakoglobin in cultured adult rat cardiomyocytes. This supports
      complex association at that source scope; full figures and detailed experimental methods
      were not recovered.
  expression_guidance: https://pmc.ncbi.nlm.nih.gov/articles/PMC3706743/ — section on gene/protein
