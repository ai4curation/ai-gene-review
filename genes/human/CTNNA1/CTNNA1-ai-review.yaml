  review:
    summary: Specify the junctional membrane–cytoskeleton anchoring activity.
    action: MODIFY
    reason: The InterPro structural assignment is sound but broad. AlphaE-catenin couples
      membrane-associated cadherin–catenin complexes to F-actin under load. The force-dependent
      reconstitution reconciles the earlier failure of an unloaded complex to bind F-actin
