    actin-filament assembly.
  findings:
  - statement: Monomer binds cadherin-beta-catenin, dimer binds actin; dimer suppresses Arp2/3
      actin polymerization (mouse protein, in vitro).
    supporting_text: Monomeric alpha-catenin binds more strongly to E-cadherin-beta-catenin,
      whereas the dimer preferentially binds actin filaments.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The original mouse-protein experiments distinguish monomer/dimer binding
      and actin-assembly regulation. Their conditions and species remain explicit; they do
      not establish equivalent behavior of the three human products.
  full_text_unavailable: false
- id: PMID:25359979
  title: Cell adhesion. The minimal cadherin-catenin complex binds to actin filaments under
    force.
  findings:
  - statement: The minimal cadherin-catenin complex binds F-actin under force through a catch
      bond.
    supporting_text: the minimal cadherin-catenin complex formed stable bonds with an actin
      filament under force
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The original optical-trap work directly establishes force-dependent minimal
      cadherin–catenin/F-actin coupling using the reported mouse/zebrafish constructs. Human
      cellular/tomographic context is separate. The main paper was read, while the complete
      supplemental material was not recovered.
  full_text_unavailable: false
- id: PMID:21393547
  title: A polarized epithelium organized by beta- and alpha-catenin predates cadherin and
    metazoan origins.
  findings:
  - statement: A Dictyostelium alpha-catenin ortholog binds the beta-catenin-related Aardvark
      and F-actin and is required for a polarized epithelium, in an organism without cadherins.
    supporting_text: we identify an α-catenin ortholog that binds a β-catenin-related protein
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Selected original target Methods/Results/captions establish Dictyostelium
      alpha-catenin/Aardvark and F-actin associations and epithelial organization without
      classical cadherins. This is evolutionary comparison, not a direct human assay or proof
      of the cellular setting in an animal ancestor.
  full_text_unavailable: false
- id: PMID:22902739
  title: α-catenin and IQGAP regulate myosin localization to control epithelial tube morphogenesis
    in Dictyostelium.
  findings:
  - statement: Dictyostelium alpha-catenin and Aardvark co-localize basolaterally and organize
      the tip epithelium.
    supporting_text: The polarity and morphology of the tip epithelium require an α-catenin
      ortholog and the β-catenin-related protein Aardvark that co-localize to the basolateral
      plasma membrane
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Selected original Dictyostelium localization, perturbation and association
      experiments support alpha-catenin/IQGAP-dependent cortical organization. They do not
      independently establish the same molecular mechanism for human CTNNA1 or resolve cross-family
      orthology.
  full_text_unavailable: false
- id: PMID:29880641
  title: Analysis of a vinculin homolog in a sponge (phylum Porifera) reveals that vertebrate-like
    cell adhesions emerged early in animal evolution.
  findings:
  - statement: VIN-family proteins occur in animals and their close unicellular outgroups,
      including Dictyostelium.
    supporting_text: VIN proteins link actin filaments to membrane proteins at the plasma
      membrane and are found in all animals and their close outgroups (choanoflagellates,
      chytridomycetes, apusozoa, amoebozoa)
  - statement: The sponge Oscarella pearsei has a separate alpha-catenin that groups with
      animal alpha-catenins.
    supporting_text: Op α-catenin grouped with other animal α-catenin sequences
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Selected original phylogenetic and biochemical passages concern sponge vinculin,
      including talin binding and failure to bind the tested beta-catenin peptide. Sponge
      alpha-catenin is present in the phylogeny but was not the assayed protein. The source
      supports comparative family context, not a negative human beta-catenin-binding conclusion.
  full_text_unavailable: false
- id: file:human/CTNNA1/CTNNA1-bioinformatics/RESULTS.md
  title: PANTHER node placement of alpha-catenin IBAs
  findings:
  - statement: CTNNA1 IBAs are placed at the eumetazoan root of PTHR18914; Dictyostelium ctnnA
      is in the vinculin family PTHR46180.
    supporting_text: PTHR18914 (ALPHA CATENIN) root is PTN001052343, taxon range Eumetazoa,
      85 leaves.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The preserved earlier report states the Eumetazoa PTHR18914 root and separate
      Dictyostelium PTHR46180 classification. Independent current tree/MSA/IBD reconstruction
      corroborates the human placement. Family labels alone do not resolve the deeper alpha-catenin/vinculin
      orthology question.
- id: file:human/CTNNA1/CTNNA1-uniprot.txt
  title: UniProt entry P35221 (CTNNA1_HUMAN)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The protected official record identifies P35221 and its three products.
      Independent current FASTAs reconstruct 906, 930 and 536 residues; the short product
      removes residues1–370, including the beta-catenin-binding interval. Sequence identity
      and retained domains are not assays of functional equivalence.
