id: P35221
gene_symbol: CTNNA1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Alpha-E-catenin is a cytoplasmic adhesion protein that couples cadherin–catenin
  complexes to the actin cortex at adherens junctions. Its N-terminal region associates with
  beta-catenin or plakoglobin, while actin binding, force-dependent conformational changes
  and recruitment of vinculin and other cytoskeletal partners stabilize junctional linkage.
  Cytosolic alpha-catenin can oligomerize and influence actin organization, and cytoplasmic
  and nuclear pools are also found outside junctions. The shorter CTNNA1b product lacks the
  N-terminal beta-catenin-binding region.
