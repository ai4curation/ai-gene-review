id: P35221
gene_symbol: CTNNA1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Alpha-E-catenin (CTNNA1) is the actin-binding subunit of the classical cadherin-catenin adhesion complex
  in epithelial and many other animal cells. It is a helical-bundle protein of the vinculin/alpha-catenin family:
  an N-terminal domain binds beta-catenin or plakoglobin (gamma-catenin) and mediates homodimerization, a middle
  (M) domain carries a force-regulated vinculin-binding site and binds other junctional partners, and a C-terminal
  five-helix bundle binds actin filaments. Monomeric alpha-catenin binds the cadherin-beta-catenin complex, and
  through it the cytoplasmic tail of E-cadherin and other classical cadherins. The cytosolic homodimer binds F-actin
  and suppresses Arp2/3-mediated actin branching. In the cadherin-bound state alpha-catenin forms a catch bond with
  F-actin that strengthens under tension, and tension unfurls the M domain to recruit vinculin, so alpha-catenin
  works as a mechanosensitive linker coupling adherens junctions to the actomyosin cortex. At the zonula adherens
  it also anchors centralspindlin and the RhoGEF ECT2 to support junctional Rho signalling, recruits EPLIN and the
  microtubule-binding protein CAP350, and is needed for apical junctional complex assembly. Loss of CTNNA1 disrupts
  epithelial adhesion; germline truncating variants predispose to hereditary diffuse gastric cancer, and missense
  variants cause butterfly-shaped pattern macular dystrophy. Vinculin/alpha-catenin family proteins are older than
  animals. In the social amoeba Dictyostelium, which lacks cadherins, an alpha-catenin-like protein binds F-actin
  and a beta-catenin-related protein (Aardvark) and is required for a polarized epithelium. This suggests that beta-catenin-coupled
  actin binding and epithelial polarity are ancestral. Coupling to classical cadherins, and the animal-specific
  signalling and tissue roles, are animal innovations.'
