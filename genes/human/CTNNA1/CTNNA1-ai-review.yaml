core_functions:
- description: Full-length alpha-E-catenin anchors cadherin-associated complexes to the cortical
    actin cytoskeleton. Its N-terminal beta-catenin or plakoglobin binding recruits it to
    the junctional complex, and force-dependent F-actin engagement by its C-terminal region
    reinforces the linkage. Recruitment of vinculin and organization of EPLIN- and centralspindlin-associated
    assemblies support the apical adhesion belt; CAP350 recruitment provides a distinct connection
    to microtubules at basolateral adherens contacts. These interactions contribute to cell-cell
    adhesion and apical junction assembly.
  molecular_function:
    id: GO:0106006
    label: cytoskeletal protein-membrane anchor activity
  directly_involved_in:
  - id: GO:0098609
    label: cell-cell adhesion
  - id: GO:0043297
    label: apical junction assembly
  locations:
  - id: GO:0005912
    label: adherens junction
  in_complex:
    id: GO:0016342
    label: catenin complex
  supported_by:
  - reference_id: PMID:7890674
  - reference_id: PMID:25359979
    supporting_text: the minimal cadherin-catenin complex formed stable bonds with an actin
      filament under force
  - reference_id: PMID:16325582
  - reference_id: PMID:9700171
    supporting_text: the alphaE-catenin-vinculin interaction plays a role in the assembly
      of the apical junctional complex in epithelia
  - reference_id: PMID:18093941
  - reference_id: PMID:22750944
    supporting_text: We therefore conclude that α-catenin serves as a cortical anchor for
      centralspindlin at the zonula adherens, to thereby support the Ect2-Rho signalling pathway.
  - reference_id: PMID:25764135
- description: Cadherin-free alpha-E-catenin binds and bundles actin filaments. Homodimerization
    favors filament engagement, and competition for F-actin binding sites can restrain Arp2/3-mediated
    branched-actin assembly. This actin-organizing activity is distinct from the force-dependent
    linkage of the cadherin-bound pool; its strength depends on oligomeric state and local
    concentration.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:16325583
    supporting_text: alpha-catenin directly regulates actin-filament organization by suppressing
      Arp2/3-mediated actin polymerization
  - reference_id: PMID:23292143
    supporting_text: The crystal structure explains why dimeric α-catenin has a higher affinity
      for F-actin than does monomeric α-catenin
- description: Alpha-E-catenin directly binds beta-catenin through its N-terminal region.
    At adherens junctions this interaction recruits alpha-E-catenin to cadherin-containing
    assemblies. The beta-catenin-binding interface is distinct from C-terminal actin engagement
    and from cadherin-free homodimeric actin organization.
  molecular_function:
    id: GO:0008013
    label: beta-catenin binding
  locations:
  - id: GO:0005912
    label: adherens junction
  supported_by:
  - reference_id: PMID:7890674
    supporting_text: the amino-terminal half independently binds alpha-catenin
  - reference_id: PMID:16325582
suggested_questions:
- question: How were below-quantification CTNNA1-tail/PDZ measurements represented as positive
    fragment interactions in the curated records, and can those records be reconciled with
    original Dataset 1 values? DLG3 PDZ2 is a distinct weak positive and does not resolve
    PDZ1/PDZ3.
- question: What mechanism recruits the 536-aa CTNNA1b product to membranes despite loss of
    residues 1–370, including the beta-catenin-binding region, and which functions of the
    longer products does it retain?
- question: Do the rodent expression-derived developmental/hormonal annotations reflect a
    demonstrated alpha-catenin contribution to the process, or only changes in abundance?
    Full source experiments are needed for the five unresolved transfers.
- question: How should the deeper alpha-catenin/vinculin relationship be represented across
    the separate current PANTHER families, given direct Dictyostelium alpha-catenin-like biology?
    Family classification alone does not settle orthology or ancestral cellular setting.
- question: Does CTNNA1 bind wild-type BRAF under the same conditions as the residue-600-mutant
    constructs in PMID:35512704, and how do the differing curated mutation-strength features
    relate to the original measurements?
suggested_experiments:
- description: Measure CTNNA1-tail binding to DLG3 PDZ1/2/3 with replicated affinity assays
    and matched domain constructs, then test full-length cellular association and the dependence
    on the terminal decapeptide.
- description: Compare the three official CTNNA1 products in matched-expression localization
    and junctional rescue assays, with direct measurement of partner association and force-dependent
    actin coupling.
