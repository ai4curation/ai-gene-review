core_functions:
- description: Beta-catenin (and plakoglobin) binding by the N-terminal domain, which recruits monomeric alpha-catenin
    into the cadherin-beta-catenin complex at adherens junctions. Present in all animal alpha-catenins; a Dictyostelium
    alpha-catenin-like protein binds the beta-catenin-related Aardvark, so beta-catenin coupling is probably older
    than cadherins.
  molecular_function:
    id: GO:0008013
    label: beta-catenin binding
  directly_involved_in:
  - id: GO:0098609
    label: cell-cell adhesion
  locations:
  - id: GO:0005912
    label: adherens junction
  in_complex:
    id: GO:0016342
    label: catenin complex
  supported_by:
  - reference_id: PMID:7890674
    supporting_text: the amino-terminal half independently binds alpha-catenin
  - reference_id: PMID:16325583
    supporting_text: Monomeric alpha-catenin binds more strongly to E-cadherin-beta-catenin, whereas the dimer preferentially
      binds actin filaments.
  - reference_id: PMID:21393547
    supporting_text: we identify an α-catenin ortholog that binds a β-catenin-related protein
- description: Force-dependent actin filament binding that couples the cadherin-catenin complex to the actomyosin
    cortex. The cadherin-bound alpha-catenin forms a catch bond with F-actin under tension, and the cytosolic homodimer
    binds F-actin and restrains Arp2/3-mediated branching. Actin binding by an alpha-catenin-family protein is also
    seen in Dictyostelium.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  directly_involved_in:
  - id: GO:0098609
    label: cell-cell adhesion
  locations:
  - id: GO:0005912
    label: adherens junction
  supported_by:
  - reference_id: PMID:25359979
    supporting_text: the minimal cadherin-catenin complex formed stable bonds with an actin filament under force
  - reference_id: PMID:23292143
    supporting_text: The crystal structure explains why dimeric α-catenin has a higher affinity for F-actin than
      does monomeric α-catenin
  - reference_id: PMID:21393547
    supporting_text: High-speed pelleting assay demonstrating binding of 5 μM full-length (FL) or the isolated tail
      domain of Dd α-catenin to 5 μM F-actin.
- description: Cytoskeletal adaptor at the zonula adherens. The M domain binds vinculin, recruited under tension,
    and alpha-catenin also recruits EPLIN, centralspindlin/ECT2 and CAP350. These links reinforce the junction-actin
    coupling, organize the apical junctional complex and localize Rho signalling. Documented in vertebrate cells;
    likely an animal elaboration.
  molecular_function:
    id: GO:0008093
    label: cytoskeletal adaptor activity
  directly_involved_in:
  - id: GO:0043297
    label: apical junction assembly
  locations:
  - id: GO:0005915
    label: zonula adherens
  supported_by:
  - reference_id: PMID:9700171
    supporting_text: All these results indicate that αE-catenin can directly bind to the head domain of vinculin
      at the 326–509 domain.
  - reference_id: PMID:9700171
    supporting_text: the alphaE-catenin-vinculin interaction plays a role in the assembly of the apical junctional
      complex in epithelia
  - reference_id: PMID:18093941
    supporting_text: an actin-binding protein, couples with alpha-catenin and, in turn, links the cadherin-catenin
      complex to F-actin
  - reference_id: PMID:22750944
    supporting_text: We therefore conclude that α-catenin serves as a cortical anchor for centralspindlin at the
      zonula adherens, to thereby support the Ect2-Rho signalling pathway.
suggested_questions:
- question: Is Dictyostelium ctnnA (Q54MH2) orthologous to animal alpha-catenin, or to the ancestor of vinculin
    and alpha-catenin? PANTHER places it in the vinculin family (PTHR46180), while the Dictyostelium study calls
    it an alpha-catenin ortholog. The answer decides whether beta-catenin binding at the PTN005285701 node belongs
    on vinculins, on alpha-catenins, or on both.
- question: Do choanoflagellate or Capsaspora vinculin/alpha-catenin family proteins bind their own beta-catenin-like
    armadillo proteins and F-actin? That would show whether the catenin module seen in Dictyostelium was kept in
    the unicellular relatives of animals.
- question: Is the force-dependent catch bond with F-actin, and the tension-dependent vinculin binding by the M
    domain, conserved in sponge and cnidarian alpha-catenins? Or is mechanosensitive junction reinforcement a later
    animal elaboration?
- question: Should GO describe the monomer-dimer switch, with the free homodimer restraining Arp2/3 actin branching,
    as a separate process annotation for human CTNNA1? Current support is mainly from mouse protein in vitro.
suggested_experiments:
- experiment_type: Binding assay
  description: Purify Capsaspora, choanoflagellate and sponge alpha-catenin/vinculin family proteins and test binding
    to their own beta-catenin homologs (full length) and F-actin, including optical-trap force assays, to date the
    beta-catenin interface and the catch bond.
- experiment_type: Cross-species rescue
  description: Express Dictyostelium ctnnA or sponge alpha-catenin in alphaE-catenin-null human epithelial cells
    (e.g. DLD-1 R2/7) and score E-cadherin adhesion, zonula adherens formation and vinculin recruitment, to test
    which functions the premetazoan protein can supply.
- experiment_type: Phylogenetic analysis
  description: Build a maximum-likelihood tree of vinculin/alpha-catenin/alpha-catulin family proteins with dense
    sampling of holozoans and amoebozoans, to resolve whether Dictyostelium ctnnA groups with alpha-catenins or
    branches before the vinculin/alpha-catenin split.
