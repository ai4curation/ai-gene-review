suggested_experiments:
- hypothesis: >-
    The moonlighting STAT3-regulatory function of NDUFA13 is separable from its
    structural Complex I role.
  description: >-
    In an NDUFA13 knockout background, reconstitute with variants that retain Complex I
    assembly but lose STAT3 binding (guided by the mapped STAT3 transactivation-domain
    interface) and, conversely, with variants that bind STAT3 but fail to assemble into
    Complex I. Score Complex I assembly by blue native PAGE, respiration by
    respirometry, and STAT3 target-gene transcription by RT-qPCR/reporter assay to test
    whether the two functions dissociate.
  experiment_type: separation-of-function mutagenesis with respirometry and reporter assays
- hypothesis: >-
    HTRA2-mediated cleavage of NDUFA13 destabilises Complex I and contributes to
    apoptotic commitment.
  description: >-
    Express cleavage-resistant NDUFA13 (mutating the six mapped HTRA2 sites) in NDUFA13
    knockout cells and measure Complex I holoenzyme and supercomplex levels, oxygen
    consumption, XIAP turnover and apoptotic sensitivity to IFN-beta/retinoic acid,
    compared with wild-type reconstitution.
  experiment_type: cleavage-site mutagenesis with apoptosis and complexome readouts
- hypothesis: >-
    The patient R57H NDUFA13 variant causes disease by destabilising the interface
    between NDUFA13 and the Complex I matrix arm.
  description: >-
    Knock the R57H variant into an isogenic cell line and determine the resulting
    Complex I structure by cryo-EM alongside quantitative complexome profiling and
    metabolic-flux measurement, to localise the destabilised interface and relate
    residual holoenzyme levels to residual NADH:ubiquinone oxidoreductase activity.
  experiment_type: cryo-EM and complexome profiling of a knock-in disease variant
