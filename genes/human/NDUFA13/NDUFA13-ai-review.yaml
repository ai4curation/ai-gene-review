- id: Reactome:R-HSA-163217
  title: Complex I oxidises NADH to NAD+, reduces CoQ to CoQH2
  findings:
  - statement: Reactome reaction describing the catalytic output of Complex I - NADH oxidation with ubiquinone reduction coupled to proton pumping. NDUFA13 contributes as a structural subunit of the complex catalysing this reaction, not as a catalytic component.
- id: Reactome:R-HSA-6799178
  title: Intermediate 1 binds HP subcomplex to form Intermediate 2
  findings:
  - statement: Reactome assembly step in which the hydrophobic protein (HP) fraction containing NDUFA13 joins Intermediate 1, direct pathway support for the mitochondrial respiratory chain complex I assembly annotation.
- id: Reactome:R-HSA-6799179
  title: Peripheral arm subunits bind the 815kDa complex to form a 980kDa complex
  findings:
  - statement: Late assembly step adding flavoprotein (FP) peripheral-arm subunits; NDUFA13 is not among the subunits added here, having entered with the HP fraction earlier.
- id: Reactome:R-HSA-6799191
  title: Intermediate 2 binds MT-ND1:NDUFAF5:NDUFAF6 to form a 315kDa subcomplex
  findings:
  - statement: Assembly step forming the 315 kDa subcomplex around the NDUFS2/NDUFS3 core; downstream of this, the NDUFA13-containing HP fraction is incorporated.
- id: Reactome:R-HSA-6799196
  title: The MCIA complex, NDUFAF2-7 all dissociate from the 980kDa complex, resulting
    in Complex I
  findings:
  - statement: Final step of Complex I biogenesis in which assembly factors dissociate to leave the mature holoenzyme containing NDUFA13.
- id: Reactome:R-HSA-6799197
  title: ND4, ND5 bind the 550kDa complex to form the 815kDa complex
  findings:
  - statement: Distal membrane-arm assembly step in which MT-ND4 and MT-ND5 are integrated; NDUFA13 is not directly involved in this step.
- id: Reactome:R-HSA-6799202
  title: The 315kDa subcomplex binds the 370kDa subcomplex to form the 550kDa complex
  findings:
  - statement: Assembly step joining the 315 kDa and 370 kDa subcomplexes to form the 550 kDa intermediate en route to the mature complex containing NDUFA13.
- id: Reactome:R-HSA-9839073
  title: HTRA2 binds NDUFA13 (GRIM-19)
  findings:
  - statement: Reactome reaction stating that NDUFA13 binds HTRA2 in the mitochondrion and allosterically activates its protease activity, the pathway representation of the endopeptidase-activator function; the interaction is enhanced by interferon-beta and retinoic acid.
- id: Reactome:R-HSA-9839110
  title: HTRA2 degrades NDUFA13 (GRIM-19)
  findings:
  - statement: Reactome reaction in which activated HTRA2 cleaves NDUFA13 at six sites; NDUFA13 is the substrate here, and Reactome explicitly notes that the consequence of this cleavage for apoptosis is unclear.

