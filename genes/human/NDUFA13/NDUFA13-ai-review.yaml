references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: Source of the PANTHER phylogenetically-inferred (IBA) annotations for NDUFA13, propagating mitochondrion, mitochondrial inner membrane and respiratory chain complex I membership from characterised orthologues of the GRIM-19/NDUFA13 accessory subunit family.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: Basis for the electronic subcellular-location annotations, mapped from the UniProtKB Q9P0J0 subcellular location statement; consistent with NDUFA13 residing in the mitochondrial inner membrane as an integral Complex I subunit.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings:
  - statement: Basis for GO annotations curated from immunofluorescence imaging. For NDUFA13 this supports a predominantly mitochondrial staining pattern; imaging alone cannot resolve the inner-membrane sub-compartment or distinguish the minor nuclear pool reported in the GRIM-19 literature.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Basis for annotations produced by combining multiple automated IEA pipelines; these add no independent experimental evidence for NDUFA13 beyond what the sequence-based and orthology-based methods already assert.
- id: PMID:10924506
  title: Identification of GRIM-19, a novel cell death-regulatory gene induced by
    the interferon-beta and retinoic acid combination, using a genetic approach.
  findings:
  - statement: GRIM-19 (NDUFA13) was discovered in an antisense knock-out screen as a gene required for interferon-beta plus retinoic acid-induced tumour cell death.
    supporting_text: Here we report the isolation of a novel GRIM gene, GRIM-19.
    full_text_unavailable: true
  - statement: Antisense knock-down of GRIM-19 confers resistance to IFN/RA-induced death and overexpression enhances it, establishing the pro-death moonlighting role.
    supporting_text: Antisense expression of GRIM-19 confers a strong resistance against IFN/RA-induced death by reducing the intracellular levels of GRIM-19 protein.
    full_text_unavailable: true
  - statement: The discovery paper reported GRIM-19 as primarily nuclear and IFN/RA-inducible; later work localised the bulk of the protein to mitochondria, so this nuclear assignment should be read as a minor pool.
    supporting_text: GRIM-19 is primarily a nuclear protein whose expression is induced by the IFN/RA combination.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Discovery paper: isolated GRIM-19 in an antisense-knockout screen for mediators
      of IFN-beta/RA-induced tumor-cell death; found it primarily nuclear and
      IFN/RA-inducible. Underpins the moonlighting cell-death role and the
      nuclear/cytoplasmic localization annotations. The NAS 'ATP binding' asserted here
      is not experimentally demonstrated. Abstract-only in cache.
- id: PMID:12611891
  title: The subunit composition of the human NADH dehydrogenase obtained by rapid
    one-step immunopurification.
  findings:
  - statement: NDUFA13/GRIM-19 was identified by mass spectrometry among the polypeptides of immunopurified human Complex I, primary evidence for Complex I membership.
    supporting_text: These polypeptides include the GRIM-19 protein, which is claimed to be involved in apoptosis
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Mass-spec identification of GRIM-19 as a subunit of immunopurified human Complex
      I; primary support for Complex I membership and mitochondrial localization.
      Abstract-only in cache.
- id: PMID:12628925
  title: GRIM-19, a death-regulatory gene product, suppresses Stat3 activity via functional
    interaction.
  findings:
  - statement: An independent yeast two-hybrid screen identified GRIM-19 as a STAT3-specific interactor that does not bind STAT1 or STAT5a.
    supporting_text: The interaction is specific for Stat3, but not for Stat1 and Stat5a.
    full_text_unavailable: true
  - statement: GRIM-19 represses STAT3 transcriptional activity and target gene expression and suppresses growth of STAT3-driven cells.
    supporting_text: GRIM-19 represses Stat3 transcriptional activity and its target gene expression, and also suppresses cell growth in Src-transformed cells and a Stat3-expressing cell line.
    full_text_unavailable: true
  - statement: GRIM-19 co-localises with mitochondrial markers, and sequestration of STAT3 with GRIM-19 blocks EGF-stimulated STAT3 nuclear translocation.
    supporting_text: GRIM-19 itself co-localizes with mitochondrial markers, and forms aggregates at the perinulear region with co-expressed Stat3, which inhibits Stat3 nuclear translocation stimulated by epidermal growth factor (EGF).
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Independent Y2H identification of GRIM-19 as a specific Stat3-interacting
      negative regulator; also documents mitochondrial co-localization and a nuclear
      pool. Supports the STAT3 moonlighting function and localization annotations.
      Abstract-only in cache.
- id: PMID:12867595
  title: The cell death regulator GRIM-19 is an inhibitor of signal transducer and
    activator of transcription 3.
  findings:
  - statement: GRIM-19 binds STAT3 and inhibits STAT3-driven transcription without blocking STAT3 activation or DNA binding, defining a transcriptional co-repressor mode of action rather than a kinase/phosphatase activity.
    supporting_text: GRIM-19 inhibits transcription driven by activation of STAT3, but not STAT1. It neither inhibits the ligand-induced activation of STAT3 nor blocks its ability to bind to DNA.
  - statement: The STAT3 transactivation domain, particularly Ser727, is required for GRIM-19 binding, and GRIM-19 does not bind other STATs - establishing specificity.
    supporting_text: Mutational analysis indicates that the transactivation domain of STAT3, especially residue S727, is required for GRIM-19 binding.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary demonstration that GRIM-19 specifically binds STAT3 (via the TAD/Ser727)
      and represses STAT3-dependent transcription without blocking STAT3
      phosphorylation or DNA binding. Basis for the negative-regulation-of-transcription
      (STAT3) annotation. Full text available and verified.
- id: PMID:15059901
  title: GW112, a novel antiapoptotic protein that promotes tumor growth.
  findings:
  - statement: OLFM4/GW112 associates with GRIM-19 and attenuates GRIM-19-mediated IFN-beta/retinoic acid apoptosis, a regulatory input onto the GRIM-19 cell-death function.
    supporting_text: We show here that GW112 is associated with GRIM-19, a protein known to be involved in regulating cellular apoptosis.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      OLFM4/GW112 study that also examined GRIM-19 subcellular localization
      (mitochondrial). Supports inner-membrane localization. Abstract-only in cache.
- id: PMID:15367666
  title: GRIM-19, a cell death regulatory protein, is essential for assembly and function
    of mitochondrial complex I.
  findings:
  - statement: Germline deletion of GRIM-19 in mice is lethal at embryonic day 9.5 and produces abnormal mitochondrial structure and distribution.
    supporting_text: Homologous deletion of GRIM-19 causes embryonic lethality at embryonic day 9.5.
    full_text_unavailable: true
  - statement: GRIM-19 is present in native mitochondrial Complex I and its primary localisation is mitochondrial, not nuclear.
    supporting_text: We reexamined the cellular localization of GRIM-19 in various cell types and found its primary localization in the mitochondria.
    full_text_unavailable: true
  - statement: Loss of GRIM-19 destroys Complex I assembly and electron transfer activity, the primary evidence for its core structural/assembly role.
    supporting_text: Finally, we show that elimination of GRIM-19 destroys the assembly and electron transfer activity of complex I and also influences the other complexes in the mitochondrial respiratory chain.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Gene-targeting study: GRIM-19 knockout is embryonic-lethal; GRIM-19 is in native
      Complex I and its loss destroys CI assembly and electron-transfer activity.
      Strong support for the core structural/assembly role and mitochondrial
      localization. Abstract-only in cache.
- id: PMID:15753091
  title: GRIM-19 interacts with nucleotide oligomerization domain 2 and serves as
    downstream effector of anti-bacterial function in intestinal epithelial cells.
  findings:
  - statement: GRIM-19 interacts with endogenous NOD2 and is required for NF-kappaB activation downstream of muramyl dipeptide sensing, a non-core innate-immunity role.
    supporting_text: We demonstrate that GRIM-19, a protein with homology to the NADPH dehydrogenase complex, interacts with endogenous NOD2 in HT29 cells.
    full_text_unavailable: true
  - statement: GRIM-19 is required for NOD2-dependent NF-kappaB activation and restricts pathogen invasion of intestinal epithelial cells.
    supporting_text: GRIM-19 is required for NF-kappaB activation following NOD2-mediated recognition of bacterial muramyl dipeptide.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Y2H + functional study: GRIM-19 interacts with NOD2/CARD15 and is required for
      NOD2-mediated NF-kB activation and antibacterial responses in intestinal
      epithelium. Source of the NOD2 protein-binding IPI; a non-core innate-immunity
      function. Abstract-only in cache.
- id: PMID:16826196
  title: 'Coupling mitochondrial respiratory chain to cell death: an essential role
    of mitochondrial complex I in the interferon-beta and retinoic acid-induced cancer
    cell death.'
  findings:
  - statement: siRNA knockdown of GRIM-19 (and NDUFS3) confers resistance to IFN-beta/RA-induced apoptosis and reduces ROS, linking Complex I subunit function to the cell-death response.
    supporting_text: Knockdown of GRIM-19 (gene associated with retinoid-interferon-induced mortality-19) and NDUFS3 (NADH dehydrogenase (ubiquinone) Fe-S protein 3), two subunits of MRC complex I, by siRNA in two cancer cell lines conferred resistance to IFN-beta/RA-induced apoptosis and reduced ROS production.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Links Complex I (GRIM-19/NDUFS3) to IFN-beta/RA-induced apoptosis via ROS;
      source of a mitochondrial-localization IDA and support for the moonlighting
      cell-death role. Abstract-only in cache.
- id: PMID:17209039
  title: Identification of mitochondrial complex I assembly intermediates by tracing
    tagged NDUFS3 demonstrates the entry point of mitochondrial subunits.
  findings:
  - statement: Complex I assembles stepwise via discrete subcomplexes; NDUFA13 enters with the membrane-arm/hydrophobic-fraction intermediates in this framework.
    supporting_text: Upon induction, six distinct NDUFS3-GFP-containing subcomplexes gradually appeared on a blue native Western blot also observed in wild type HEK293 mitochondria.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Complex I assembly-intermediate study (NDUFS3-GFP tracing); supports NDUFA13
      Complex I membership and mitochondrial-membrane localization. Abstract-only in
      cache.
- id: PMID:17297443
  title: GRIM-19 associates with the serine protease HtrA2 for promoting cell death.
  findings:
  - statement: A yeast two-hybrid screen identified the mitochondrial serine protease HtrA2 as a GRIM-19 binding partner, and the interaction promotes IFN/RA-dependent cell death.
    supporting_text: GRIM-19 physically interacts with HtrA2 and augments cell death in an IFN/all-trans retinoic acid (RA)-dependent manner.
    full_text_unavailable: true
  - statement: In the presence of GRIM-19, HtrA2-driven destruction of XIAP is enhanced - the basis for the protease-activator and positive-regulation-of-protein-catabolism annotations.
    supporting_text: In the presence of GRIM-19, the HtrA2-driven destruction of the antiapoptotic protein X-linked inhibitor of apoptosis (XIAP) is augmented.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      GRIM-19 binds HtrA2/OMI and augments IFN/RA-dependent apoptosis and HtrA2-driven
      XIAP destruction. Primary support for the pro-apoptotic moonlighting annotations
      (positive regulation of execution phase of apoptosis, positive regulation of
      protein catabolism, endopeptidase activator activity, cellular responses to
      IFN-beta/RA). Abstract-only in cache.
- id: PMID:17500595
  title: Huntingtin interacting proteins are genetic modifiers of neurodegeneration.
  findings:
  - statement: Large-scale huntingtin-interactor screen combining yeast two-hybrid and affinity pull-down; an NDUFA13 hit here is a high-throughput dataset entry rather than evidence for a specific molecular function.
    supporting_text: This effort led to the identification of 234 high-confidence Htt-associated proteins, 104 of which were found with the yeast method and 130 with the pull downs.
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      Large-scale huntingtin-interactor screen; source of a bare HTT protein-binding
      IPI of uncertain physiological relevance to NDUFA13. Uninformative as a molecular
      function.
- id: PMID:23271731
  title: The import of the transcription factor STAT3 into mitochondria depends on
    GRIM-19, a component of the electron transport chain.
  findings:
  - statement: GRIM-19 acts as a chaperone that recruits STAT3 into mitochondria, a specific and unusual function for a Complex I accessory subunit.
    supporting_text: In vitro import studies show that the gene associated with retinoid interferon induced cell mortality 19 (GRIM-19), a complex I subunit that acts as a chaperone to recruit STAT3 into mitochondria.
  - statement: GRIM-19 additionally promotes integration of STAT3 into Complex I, and this requires STAT3 Ser727.
    supporting_text: In addition, GRIM-19 enhances the integration of STAT3 into complex I. A S727A mutation in STAT3 reduces its import and assembly even in the presence of GRIM-19.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Shows GRIM-19 acts as a chaperone recruiting STAT3 into mitochondria and
      integrating it into Complex I; basis for the 'protein insertion into
      mitochondrial inner membrane' IDA (broader than the specific STAT3-chaperone
      role). Full text available and verified.
- id: PMID:25901006
  title: Mutation in NDUFA13/GRIM19 leads to early onset hypotonia, dyskinesia and
    sensorial deficiencies, and mitochondrial complex I instability.
  findings:
  - statement: The first germline pathogenic NDUFA13 mutation was identified in two sisters with early-onset hypotonia, dyskinesia and optic neuropathy, establishing NDUFA13 as a Complex I deficiency disease gene.
    supporting_text: Here, we describe the first germinal pathogenic mutation in the NDUFA13/GRIM19 gene encoding a CI subunit, in two sisters with early onset hypotonia, dyskinesia and sensorial deficiencies, including a severe optic neuropathy.
    full_text_unavailable: true
  - statement: Patient cells show a selective Complex I enzymatic defect with complexes II, III and IV largely spared, indicating a Complex I-specific requirement for NDUFA13.
    supporting_text: Biochemical analysis revealed a drastic decrease in CI enzymatic activity in patient muscle biopsies, and reduction of CI-driven respiration in fibroblasts, while the activities of complex II, III and IV were hardly affected.
    full_text_unavailable: true
  - statement: Loss of NDUFA13 protein drastically reduces Complex I holoenzyme and supercomplex levels, and silencing NDUFA13 in control cells reproduces this - direct evidence for a stability/assembly role.
    supporting_text: Western blots disclosed that the abundances of NDUFA13 protein, CI holoenzyme and super complexes were drastically reduced in mitochondrial fractions, a situation that was reproduced by silencing NDUFA13 in control cells.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      First germline NDUFA13 pathogenic mutation (R57H, MC1DN28): reduces NDUFA13
      protein and holoenzyme/supercomplex levels and causes CI instability. Primary
      support for the core assembly/stability role and Complex I membership.
      Abstract-only in cache.
- id: PMID:27626371
  title: Accessory subunits are integral for assembly and function of human mitochondrial
    complex I.
  findings:
  - statement: Systematic CRISPR knockout of each human Complex I accessory subunit showed most, including NDUFA13, are strictly required for assembly of a functional complex.
    supporting_text: We show that 25 subunits are strictly required for assembly of a functional complex and 1 subunit is essential for cell viability.
    full_text_unavailable: true
  - statement: The 14 core subunits shared with bacteria carry catalysis; the 31 human accessory subunits including NDUFA13 are non-catalytic, supporting a structural rather than enzymatic molecular function.
    supporting_text: Bacterial and human complex I share 14 core subunits that are essential for enzymatic function
    full_text_unavailable: true
  - statement: Loss of one accessory subunit destabilises other subunits of the same structural module, the proteomic signature underlying the assembly role.
    supporting_text: Quantitative proteomic analysis of cell lines revealed that loss of each subunit affects the stability of other subunits residing in the same structural module.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      CRISPR-knockout + quantitative proteomics defining accessory subunits (including
      NDUFA13) as integral, non-catalytic components required for assembly/function of
      human Complex I. Primary support for the core structural function and the
      'believed not to be involved in catalysis' framing. Abstract-only in cache.
- id: PMID:28844695
  title: Architecture of Human Mitochondrial Respiratory Megacomplex I(2)III(2)IV(2).
  findings:
  - statement: Cryo-EM of the human respiratory megacomplex assigned individual Complex I subunits, placing NDUFA13 within Complex I in a higher-order supercomplex.
    supporting_text: The structure not only reveals the precise assignment of individual subunits of human CI and CIII, but also enables future in-depth analysis of the electron transport chain as a whole.
    full_text_unavailable: true
  - statement: Complex I is present in two copies within a circular megacomplex with dimeric complex III and two copies of complex IV.
    supporting_text: The MCI2III2IV2 forms a circular structure with the dimeric CIII located in the center, where it is surrounded by two copies each of CI and CIV.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cryo-EM of the human respiratory megacomplex with precise assignment of
      individual Complex I subunits; supports NDUFA13 Complex I membership and
      inner-membrane localization (ComplexPortal curation). Abstract-only in cache.
- id: PMID:30030361
  title: Assembly of mammalian oxidative phosphorylation complexes I-V and supercomplexes.
  findings:
  - statement: Review establishing that OXPHOS supernumerary subunits such as NDUFA13 act in assembly, regulation and stability rather than in catalysis.
    supporting_text: The human enzymes comprise core proteins, performing the catalytic activities, and a large number of 'supernumerary' subunits that play essential roles in assembly, regulation and stability.
    full_text_unavailable: true
  - statement: Complexes I, III and IV associate into respiratory supercomplexes, the higher-order context relevant to the complex-level respiration annotations.
    supporting_text: it is now well established that complexes I, III and IV interact with each other, forming the so-called respiratory supercomplexes or 'respirasomes'
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Review of OXPHOS/supercomplex assembly; basis for the ComplexPortal NAS
      complex-level BP annotations (aerobic respiration, proton-motive-force ATP
      synthesis). Abstract-only in cache.
- id: PMID:31617661
  title: Global Interactome Mapping of Mitochondrial Intermembrane Space Proteases
    Identifies a Novel Function for HTRA2.
  findings:
  - statement: BioID proximity-labelling map of mitochondrial intermembrane space proteases; an NDUFA13-HTRA2 proximity hit here is consistent with the characterised GRIM-19/HtrA2 association but is a high-throughput dataset entry, not a molecular function.
    supporting_text: Here, in vivo proximity-dependent biotinylation (BioID) is used to map the interactomes of seven proteases localized to the mitochondrial intermembrane space (IMS).
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      High-throughput interactome map of IMS proteases; source of a bare HTRA2
      protein-binding IPI. Consistent with the HtrA2 association but uninformative as a
      molecular function.
- id: PMID:32814053
  title: Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins
    and Uncovers Widespread Protein Aggregation in Affected Brains.
  findings:
  - statement: Large-scale yeast two-hybrid interactome centred on neurodegeneration-associated proteins; an NDUFA13 entry is a screen hit without complex I-specific functional follow-up.
    supporting_text: Interactome maps are valuable resources to elucidate protein function and disease mechanisms.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      Large-scale interactome/aggregation map; source of a bare HTT protein-binding
      IPI of uncertain relevance to NDUFA13. Uninformative as a molecular function.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics
    in cellular context.
  findings:
  - statement: NDUFA13 is a member of the stringently defined human mitochondrial high-confidence proteome (MitoCoP), corroborating mitochondrial localization at coarse resolution.
    supporting_text: We classified >8,000 proteins in mitochondrial preparations of human cells and defined a mitochondrial high-confidence proteome of >1,100 proteins (MitoCoP).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      High-throughput mitochondrial-proteome study; supports mitochondrial
      localization (coarse relative to inner-membrane/Complex I).
- id: PMID:40205054
  title: Multimodal cell maps as a foundation for structural and functional genomics.
  findings:
  - statement: Multimodal (biophysical interaction plus immunofluorescence) map of human subcellular assemblies in U2OS cells; NDUFA13 entries derived from it are assembly-membership data points rather than evidence for a distinct molecular function.
    supporting_text: Here we construct a global map of human subcellular architecture through joint measurement of biophysical interactions and immunofluorescence images for over 5,100 proteins in U2OS osteosarcoma cells.
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      Multimodal cell-map / structural-genomics interactome; source of a bare HTRA2
