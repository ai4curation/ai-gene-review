- term:
    id: GO:0004715
    label: non-membrane spanning protein tyrosine kinase activity
  evidence_type: TAS
  original_reference_id: PMID:8497321
  qualifier: enables
  review:
    summary: >-
      Non-membrane spanning protein tyrosine kinase activity by TAS, citing PMID:8497321.
    action: ACCEPT
    reason: >-
      The term is correct for PTK2B, but the cited reference does not appear to support it. PMID:8497321
      (Manser et al. 1993) describes a hippocampal tyrosine kinase that binds GTP-bound Cdc42Hs through
      a 47-residue sequence C-terminal to an SH3 domain. That is the ACK kinase (TNK2): Pyk2 has no SH3
      domain and no such Cdc42-binding motif. The claim is accepted on other evidence. The reference is
      recorded as a probable mis-citation (abstract only, so not certain), and as a source defect for PINC.
    supported_by:
    - reference_id: PMID:12771146
      supporting_text: Pyk2 directly phosphorylates ASAP1 on tyrosine residues in vitro
    - reference_id: PMID:8497321
      supporting_text: >-
        We now report the characterization of a hippocampal complementary DNA encoding a tyrosine kinase
        that specifically binds Cdc42Hs in its GTP-bound form.
    - reference_id: PMID:7499242
      supporting_text: >-
        RAFTK, like pp125FAK, lacks a transmembrane region, myristylation sites, and SH2 and SH3 domains
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: PINC
      slot: DB:Reference
      requested_change: CHECK
      asserted_value: PMID:8497321
      cause: UNKNOWN
      confidence: PROBABLE
      explanation: >-
        PINC TAS row for PTK2B (Q14289) GO:0004715 non-membrane spanning protein tyrosine kinase activity
        cites PMID:8497321 (Manser et al. 1993, Nature), which characterises a hippocampal tyrosine kinase
        that binds GTP-Cdc42Hs through a sequence C-terminal to an SH3 domain. That is ACK1 (TNK2); Pyk2
        has no SH3 domain. The term is correct for PTK2B, so the reference should be replaced with a
        paper on Pyk2 kinase activity (for example PMID:7544443 or PMID:7499242), or the row moved to TNK2.
      supported_by:
      - reference_id: PMID:8497321
        supporting_text: >-
          We now report the characterization of a hippocampal complementary DNA encoding a tyrosine kinase
          that specifically binds Cdc42Hs in its GTP-bound form.
      - reference_id: PMID:7499242
        supporting_text: >-
          RAFTK, like pp125FAK, lacks a transmembrane region, myristylation sites, and SH2 and SH3 domains
