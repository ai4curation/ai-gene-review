    - reference_id: file:human/PTK2B/PTK2B-uniprot.txt
      record_section:
      - CC:ACTIVITY REGULATION
      supporting_text: >-
        Activated in response to stimuli that lead to increased intracellular Ca(2+) levels; this activation
        is indirect and may be mediated by calcium-mediated production of reactive oxygen species (ROS).
    - reference_id: file:human/PTK2B/PTK2B-uniprot.txt
