suggested_questions:
- question: >-
    Does endogenous PTK2B contribute to interferon signalling in human cells? The only interferon link
    in the reviewed data is pharmacological (the Pyk2 inhibitor Tyrphostin A9 blocks STAT1 phosphorylation,
    PMID:35568036), with no genetic test and no STAT1 site attributed to Pyk2.
- question: >-
    Is the nuclear, kinase-independent (FERM-domain) regulation of p53 by Pyk2 operative at endogenous
    expression levels in normal human cells, or mainly when Pyk2 is up-regulated (e.g. on FAK loss or
    in tumours)?
suggested_experiments:
- description: >-
    Test whether PTK2B is genuinely in the CaMKII-STAT1 interferon branch: use CRISPR knockout and a kinase-dead
    knock-in of PTK2B in human cells, rather than the Pyk2 inhibitor Tyrphostin A9, and ask whether interferon-induced
    STAT1 phosphorylation and ISG expression still require Pyk2, and map any Pyk2-dependent STAT1 site.
  experiment_type: genetic loss-of-function with phospho-specific and reporter assays
knowledge_gaps:
- gap_statement: >-
    Whether PTK2B acts downstream of CaMKII in interferon-induced STAT1 activation is unresolved: the
    only evidence is a single pharmacological inhibitor, with no epistasis to CaMKII and no Pyk2-attributed
    STAT1 phosphorylation site.
  gap_kind:
  - BIOLOGY
