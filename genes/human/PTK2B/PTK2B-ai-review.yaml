- term:
    id: GO:0042976
    label: activation of Janus kinase activity
  evidence_type: IMP
  original_reference_id: PMID:8670418
  qualifier: involved_in
  review:
    summary: >-
      Activation of Janus kinase activity by IMP, citing Tokiwa et al. 1996, a study of Pyk2 coupling
      stress signals to the c-Jun N-terminal kinase (JNK) pathway.
    action: REMOVE
    reason: >-
      The cited paper is about JNK (c-Jun N-terminal kinase, a MAP kinase), not JAK (Janus kinase).
      Its title and abstract name only JNK and contain no Janus kinase, JAK1/2/3 or TYK2;
      the experiment is Pyk2 overexpression activating JNK and dominant-negative Pyk2 blocking UV- and
      osmotic-shock-induced JNK activation. GO:0042976 is defined as tyrosine phosphorylation of a JAK
      protein, which this paper does not examine. The row is a JNK/JAK term-selection error; the real
      claim from the same paper is already carried by the GO:0046330 positive regulation of JNK cascade
      row, which this review retains. The cache is abstract-only, but the title and abstract define the
      kinase studied unambiguously.
    supported_by:
    - reference_id: PMID:8670418
      supporting_text: >-
        Overexpression of Pyk2 led to activation of JNK, and a dominant-negative mutant of Pyk2 interfered
        with ultraviolet light- or osmotic shock-induced activation of JNK.
    - reference_id: PMID:8670418
      supporting_text: >-
        Pyk2 represents a cell type-specific, stress-sensitive mediator of the JNK signaling pathway.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0042976
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        UniProt IMP row (2011-11-25) for PTK2B (Q14289) with GO:0042976 activation of Janus kinase activity,
        citing PMID:8670418 (Tokiwa et al. 1996, Science 273:792). The paper studies the c-Jun N-terminal
        kinase (JNK): Pyk2 overexpression activates JNK and dominant-negative Pyk2 blocks stress-induced
        JNK activation. It contains no Janus kinase (JAK) data. The term looks like a JNK/JAK confusion;
        the supported term is GO:0046330 positive regulation of JNK cascade, which the same group already
        annotates from this paper, so the row should be deleted; repointing would duplicate that row.
      supported_by:
      - reference_id: PMID:8670418
        supporting_text: >-
          Pyk2 represents a cell type-specific, stress-sensitive mediator of the JNK signaling pathway.
