  supporting_entities:
  - UniProtKB:P70600
  review:
    summary: >-
      Calcium/calmodulin-dependent protein kinase activity by ISS from rat Ptk2b (P70600, CAKbeta/CADTK).
    action: REMOVE
    reason: >-
      Wrong activity. GO:0004683 is defined as calmodulin-dependent phosphorylation of serine and threonine
      and sits under protein serine/threonine kinase activity. Pyk2 is a tyrosine kinase (EC 2.7.10.2).
      Its Ca2+ dependence is indirect: UniProt states that activation by raised Ca2+ is indirect, possibly
      via reactive oxygen species. The transfer probably arose from the rat names "calcium-dependent tyrosine
      kinase" and "cell adhesion kinase beta" being mapped to a CaM-kinase term. The correct activity
      is covered by GO:0004715.
