id: Q14289
gene_symbol: PTK2B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PTK2B (also called Pyk2, RAFTK, CAKbeta, CADTK, FAK2) encodes a cytoplasmic (non-receptor) protein-tyrosine
  kinase of the focal adhesion kinase family. It has an N-terminal FERM domain, a central kinase domain,
  proline-rich regions and a C-terminal focal adhesion targeting domain, but no transmembrane region and
  no SH2 or SH3 domains. Pyk2 is activated by stimuli that raise intracellular Ca2+ (the activation is
  indirect), and by integrin, GPCR, growth factor, cytokine, chemokine and immune receptors, leading to
  autophosphorylation at Tyr402. Phospho-Tyr402 is an SH2 docking site for SRC-family kinases; the resulting
  Pyk2-Src complex phosphorylates further tyrosines on Pyk2 and on substrates and adaptors (p130Cas, ASAP1,
  NPHP1, paxillin), creating a multisubunit signalling platform. Through these outputs Pyk2 regulates
  the actin cytoskeleton, cell adhesion and spreading, cell migration, and MAP kinase (ERK, JNK, p38)
  and PI3K/AKT cascades. It is highly expressed in the nervous system, where it localizes to the postsynaptic
  density and modulates NMDA receptor function and synaptic plasticity, and in hematopoietic and immune
  cells, where it mediates integrin-dependent control of myelopoiesis, B cell and macrophage migration,
  and T cell activation. In osteoclasts it promotes bone resorption with Src. A FERM-domain-dependent,
  kinase-independent nuclear pool of Pyk2 promotes Mdm2-mediated p53 ubiquitination and degradation, favouring
  cell survival and proliferation.
