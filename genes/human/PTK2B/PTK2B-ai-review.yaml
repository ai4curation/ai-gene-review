      PSD-95. Pyk2 binds PSD-95 and is a postsynaptic signalling kinase, so it plausibly does part of the
      work of regulating PSD assembly, but the evidence is knockout phenotype in rodent neurons and a
      neuron-specific role. Kept as non-core.
    supported_by:
    - reference_id: PMID:28555636
      supporting_text: >-
        Altogether, these data show that the lack of Pyk2 leads to a decrease in PSD-95 at synapses and a
        decreased number of PSDs and spines
