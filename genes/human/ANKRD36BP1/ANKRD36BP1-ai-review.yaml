suggested_questions:
- question: Is ANKRD36BP1 translated in any human tissue (ribosome profiling, proteomics), or is it a
    transcribed pseudogene whose ORF only acts in yeast two-hybrid?
suggested_experiments:
- description: Search ribosome-profiling and deep proteomics datasets for ANKRD36BP1-unique peptides,
    and test endogenous tagging at the locus.
