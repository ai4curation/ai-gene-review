description: ANKRD36BP1 (ANKRD26L1) encodes a putative 119-residue protein related to the ANKRD26/ANKRD36
  family, with a coiled-coil domain. UniProt flags it as possibly the product of a pseudogene (protein
  existence level 5). Its ORF interacts with many coiled-coil and keratin proteins in proteome-scale yeast
  two-hybrid screens. No endogenous protein, localization or function has been described.
