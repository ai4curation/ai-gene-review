knowledge_gaps:
- gap_statement: Whether ANKRD36BP1 is a protein-coding gene at all, and if so what its product does,
    is unknown.
  boundary: 'Established: an ORF related to ANKRD26/ANKRD36 whose product binds many coiled-coil proteins
    in Y2H screens. Not established: endogenous translation (UniProt PE5; pseudogene caution), localization,
    or function.'
