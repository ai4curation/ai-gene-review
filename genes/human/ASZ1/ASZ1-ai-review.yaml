suggested_questions:
- question: Does mammalian GASZ, like fly Gasz with Daedalus, anchor MOV10L1 (the Armitage ortholog) at
    the mitochondrial surface for PLD6-mediated primary piRNA processing, and should it then carry piRNA
    processing (GO:0034587) as a scaffold?
suggested_experiments:
- description: In Gasz-null and Gasz-deltaMTS spermatocytes, test MOV10L1 and PLD6 localization and the
    phasing of primary piRNAs, to separate a direct scaffold role in piRNA processing from MILI destabilization.
