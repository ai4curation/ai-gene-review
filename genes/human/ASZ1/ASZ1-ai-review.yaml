id: Q8WWH4
gene_symbol: ASZ1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASZ1 (GASZ) is a germ-cell-specific protein with six ankyrin repeats, a sterile-alpha motif
  and a basic leucine-zipper-like region. It sits on the outer mitochondrial membrane through a C-terminal
  targeting signal and in the intermitochondrial cement (pi-body nuage) that clusters around germ-cell
  mitochondria. There it self-associates, binds the mitofusins MFN1 and MFN2 to promote mitochondrial
  fusion and clustering, and stabilizes the Piwi protein MILI (PIWIL2); fly Gasz, with Daedalus, anchors
  the piRNA-biogenesis helicase Armitage next to the Zucchini nuclease. Loss of GASZ in mice depletes
  piRNAs, derepresses and demethylates retrotransposons, arrests spermatocytes at zygotene-pachytene and
  causes male sterility.
