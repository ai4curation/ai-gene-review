- term:
    id: GO:0007283
    label: spermatogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8VD46
  - ensembl:ENSMUSP00000010940
  review:
    summary: Spermatogenesis (IEA, mouse ortholog projection). Gasz-null males are sterile, with a zygotene-pachytene
      block, and mitochondrial targeting of GASZ is needed for spermatogenesis. This is the developmental
      consequence of failed piRNA-mediated transposon silencing, so it is kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:19730684 "Knockout of Gasz in mice results in a dramatic downregulation of MILI, and
      phenocopies the zygotene-pachytene spermatocyte block and male sterility defect observed in MILI
      null mice."] [PMID:26711429 "In mice, deletion of the mitochondrial targeting signal reveals that
      mitochondrial localization of GASZ is essential for nuage formation, mitochondrial clustering, transposon
      repression, and spermatogenesis."]'
    supported_by:
    - reference_id: PMID:19730684
      supporting_text: Knockout of Gasz in mice results in a dramatic downregulation of MILI, and phenocopies
        the zygotene-pachytene spermatocyte block and male sterility defect observed in MILI null mice.
    - reference_id: PMID:26711429
      supporting_text: In mice, deletion of the mitochondrial targeting signal reveals that mitochondrial
        localization of GASZ is essential for nuage formation, mitochondrial clustering, transposon repression,
        and spermatogenesis.
