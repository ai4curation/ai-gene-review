- id: PMID:19730684
  title: GASZ is essential for male meiosis and suppression of retrotransposon expression in the male
    germline.
  findings:
  - statement: GASZ co-localizes with MILI in intermitochondrial cement.
    supporting_text: We find that GASZ (Germ cell protein with Ankyrin repeats, Sterile alpha motif, and
      leucine Zipper) co-localizes with MILI in intermitochondrial cement.
  - statement: Gasz-null mice are sterile and lose MILI.
    supporting_text: Knockout of Gasz in mice results in a dramatic downregulation of MILI, and phenocopies
      the zygotene-pachytene spermatocyte block and male sterility defect observed in MILI null mice.
  - statement: Gasz loss derepresses retrotransposons.
    supporting_text: In Gasz null testes, we observe increased hypomethylation and expression of retrotransposons
      similar to MILI null testes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse knockout, the source of the mouse IMP annotations. PubMed lists an
      erratum (PLoS Genet 2009 Dec, doi:10.1371/annotation/20bf08d1-07e9-451e-b079-166832ebe158). It is
      a correction, not a retraction, but its text could not be retrieved.
- id: PMID:26711429
  title: GASZ and mitofusin-mediated mitochondrial functions are crucial for spermatogenesis.
  findings:
  - statement: GASZ self-associates at the mitochondrial outer membrane.
    supporting_text: Taken together, these data demonstrate that GASZ interacts with itself at the mitochondrial
      outer membrane, likely through the SAM and ZIP domains.
  - statement: GASZ binds MFN1 and MFN2.
    supporting_text: Indeed, we found that GASZ interacted with two key GTPases in mitochondrial fusion,
      MFN1 and MFN2, both in vitro in GST pull‐down assays (Fig EV5 A) and in Co‐IP (Fig 5 A) and in testes
      in vivo (Fig 5 B).
  - statement: GASZ overexpression increases mitochondrial fusion rate.
    supporting_text: Compared to control HeLa cells or cells with MLS‐mutated GASZ, faster decrease in
      PAGFP fluorescence within photoactivated mitochondria was observed when wild‐type GASZ overexpressed
      (Figs 4 D and EV4 D), reflecting increased mitochondrial fusion rate by GASZ overexpression.
  - statement: Mitochondrial targeting of GASZ is needed for nuage and spermatogenesis.
    supporting_text: In mice, deletion of the mitochondrial targeting signal reveals that mitochondrial
      localization of GASZ is essential for nuage formation, mitochondrial clustering, transposon repression,
      and spermatogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse and cell-line study.
- id: PMID:31123065
  title: Daedalus and Gasz recruit Armitage to mitochondria, bringing piRNA precursors to the biogenesis
    machinery.
  findings:
  - statement: Fly Gasz and Daed anchor Armi at mitochondria for piRNA processing.
    supporting_text: We found that Gasz and Daed interact with each other and likely provide a mitochondrial
      "anchoring platform" to ensure that Armi is held in place, proximal to Zucchini, during piRNA processing.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; Drosophila ortholog, used for mechanism only.
