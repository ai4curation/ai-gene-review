- term:
    id: GO:0010636
    label: positive regulation of mitochondrial fusion
  evidence_type: ISO
  original_reference_id: PMID:26711429
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8VD46
  review:
    summary: 'Positive regulation of mitochondrial fusion (NEW, ISO from mouse GASZ). GASZ binds the fusion
      GTPases MFN1 and MFN2 through its SAM and ZIP domains (GST pull-down, co-IP, and in testes). Overexpressing
      wild-type GASZ, but not a mitochondrial-targeting mutant, speeds mitochondrial fusion in a PAGFP
      dilution assay, and this effect depends on mitofusins. GASZ is not itself a fusogen: it promotes
      MFN-mediated fusion as a binding partner on the outer membrane, so the regulation term fits rather
      than mitochondrial fusion. Comparators: PLD6 (IDA), MIEF1 (IMP) and MSTO1 (IMP) carry this term.'
    action: NEW
    reason: '[PMID:26711429 "Indeed, we found that GASZ interacted with two key GTPases in mitochondrial
      fusion, MFN1 and MFN2, both in vitro in GST pull‐down assays (Fig EV5 A) and in Co‐IP (Fig 5 A)
      and in testes in vivo (Fig 5 B)."] [PMID:26711429 "In addition, GASZ appeared to be associated with
      both MFN1 and MFN2 via its SAM and ZIP domains, and failed to interact with MFNs when these domains
      were absent (Figs 5 C and EV5 E)."] [PMID:26711429 "Compared to control HeLa cells or cells with
      MLS‐mutated GASZ, faster decrease in PAGFP fluorescence within photoactivated mitochondria was observed
      when wild‐type GASZ overexpressed (Figs 4 D and EV4 D), reflecting increased mitochondrial fusion
      rate by GASZ overexpression."] [PMID:26711429 "In addition, GASZ interacts with itself at the outer
      membrane of mitochondria and promotes mitofusion in a mitofusin/MFN‐dependent manner."]'
    supported_by:
    - reference_id: PMID:26711429
      supporting_text: Indeed, we found that GASZ interacted with two key GTPases in mitochondrial fusion,
        MFN1 and MFN2, both in vitro in GST pull‐down assays (Fig EV5 A) and in Co‐IP (Fig 5 A) and in
        testes in vivo (Fig 5 B).
    - reference_id: PMID:26711429
      supporting_text: In addition, GASZ appeared to be associated with both MFN1 and MFN2 via its SAM
        and ZIP domains, and failed to interact with MFNs when these domains were absent (Figs 5 C and
        EV5 E).
    - reference_id: PMID:26711429
      supporting_text: Compared to control HeLa cells or cells with MLS‐mutated GASZ, faster decrease
        in PAGFP fluorescence within photoactivated mitochondria was observed when wild‐type GASZ overexpressed
        (Figs 4 D and EV4 D), reflecting increased mitochondrial fusion rate by GASZ overexpression.
    - reference_id: PMID:26711429
      supporting_text: In addition, GASZ interacts with itself at the outer membrane of mitochondria and
        promotes mitofusion in a mitofusin/MFN‐dependent manner.
