  review:
    summary: 'Mitochondrial outer membrane (NEW, ISO from mouse GASZ). Mouse GASZ has a C-terminal mitochondrial
      targeting signal. In protease-protection assays it behaves like the outer-membrane protein MitoPLD,
      and it self-associates at the outer membrane. Mitochondrial targeting is required for nuage formation
      and transposon repression. Comparator: the mitochondrial-surface piRNA nuclease PLD6 (MitoPLD) carries
      this term by IDA.'
