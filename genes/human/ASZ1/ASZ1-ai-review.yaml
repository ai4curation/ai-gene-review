- term:
    id: GO:0010526
    label: transposable element silencing
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8VD46
  - ensembl:ENSMUSP00000010940
  review:
    summary: Transposable element silencing (IEA, mouse ortholog projection). Gasz-null mouse testes show
      retrotransposon hypomethylation and derepression, together with loss of piRNAs. GASZ acts structurally,
      stabilizing MILI in nuage; fly Gasz anchors Armitage at mitochondria for piRNA processing. Core
      process.
    action: ACCEPT
    reason: '[PMID:19730684 "In Gasz null testes, we observe increased hypomethylation and expression
      of retrotransposons similar to MILI null testes."] [PMID:19730684 "We also find global shifts in
      the small RNAome, including down-regulation of repeat-associated, known, and novel piRNAs."] [PMID:19730684
      "These studies provide the first evidence for an essential structural role for GASZ in male fertility
      and epigenetic and post-transcriptional silencing of retrotransposons by stabilizing MILI in nuage."]
      [PMID:31123065 "We found that Gasz and Daed interact with each other and likely provide a mitochondrial
      "anchoring platform" to ensure that Armi is held in place, proximal to Zucchini, during piRNA processing."]'
    supported_by:
    - reference_id: PMID:19730684
      supporting_text: In Gasz null testes, we observe increased hypomethylation and expression of retrotransposons
        similar to MILI null testes.
    - reference_id: PMID:19730684
      supporting_text: We also find global shifts in the small RNAome, including down-regulation of repeat-associated,
        known, and novel piRNAs.
    - reference_id: PMID:19730684
      supporting_text: These studies provide the first evidence for an essential structural role for GASZ
        in male fertility and epigenetic and post-transcriptional silencing of retrotransposons by stabilizing
        MILI in nuage.
    - reference_id: PMID:31123065
      supporting_text: We found that Gasz and Daed interact with each other and likely provide a mitochondrial
        "anchoring platform" to ensure that Armi is held in place, proximal to Zucchini, during piRNA
        processing.
