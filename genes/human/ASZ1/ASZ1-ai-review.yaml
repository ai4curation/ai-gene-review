- term:
    id: GO:0007140
    label: male meiotic nuclear division
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8VD46
  - ensembl:ENSMUSP00000010940
  review:
    summary: Male meiotic nuclear division (IEA, mouse ortholog projection). The basis is the zygotene-pachytene
      spermatocyte arrest of Gasz-null mice, which phenocopies MILI loss. GASZ is a cytoplasmic nuage
      and mitochondrial-surface protein. The arrest most likely follows from piRNA-pathway failure, although
      the authors note that it may be retrotransposon-independent. No direct role in meiotic chromosome
      events is reported. Kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:19730684 "Knockout of Gasz in mice results in a dramatic downregulation of MILI, and
      phenocopies the zygotene-pachytene spermatocyte block and male sterility defect observed in MILI
      null mice."] [PMID:19730684 "Alternatively, the cause of apoptosis in Gasz−/− spermatocytes and
      nuage knockouts in the meiotic class may be retrotransposon-independent."] [PMID:19730684 "We find
      that GASZ (Germ cell protein with Ankyrin repeats, Sterile alpha motif, and leucine Zipper) co-localizes
      with MILI in intermitochondrial cement."]'
    supported_by:
    - reference_id: PMID:19730684
      supporting_text: Knockout of Gasz in mice results in a dramatic downregulation of MILI, and phenocopies
        the zygotene-pachytene spermatocyte block and male sterility defect observed in MILI null mice.
    - reference_id: PMID:19730684
      supporting_text: Alternatively, the cause of apoptosis in Gasz−/− spermatocytes and nuage knockouts
        in the meiotic class may be retrotransposon-independent.
    - reference_id: PMID:19730684
      supporting_text: We find that GASZ (Germ cell protein with Ankyrin repeats, Sterile alpha motif,
        and leucine Zipper) co-localizes with MILI in intermitochondrial cement.
