knowledge_gaps:
- gap_statement: The molecular activity by which GASZ stabilizes MILI in nuage and promotes mitofusin-dependent
    fusion is unknown.
  boundary: 'Established: GASZ self-associates at the outer membrane and binds MFN1, MFN2 and (in mouse)
    nuage piRNA factors. It is needed for MILI stability, piRNA production and transposon silencing, and
    its overexpression speeds MFN-dependent fusion. Not established: whether it bridges MFNs in trans,
    tethers mitochondria into clusters, or anchors piRNA-processing factors as fly Gasz does. No catalytic
    domain is known.'
