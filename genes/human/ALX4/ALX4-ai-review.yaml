core_functions:
- description: ALX4 binds developmental regulatory DNA and can activate Pol-II transcription. Sequence-dependent
    dimerization and DNA-associated cooperation with other transcription factors regulate craniofacial
    mesenchymal programs, skull development and hair-follicle differentiation. Regulatory direction depends
    on partner, promoter and dosage context; this core does not imply universal activation or a constitutive
    soluble complex.
