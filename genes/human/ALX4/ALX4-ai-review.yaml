id: Q9H161
gene_symbol: ALX4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALX4 is a paired-like homeodomain transcription factor that binds regulatory DNA and controls
  developmental gene-expression programs in craniofacial mesenchyme, the skeleton and skin appendages.
  DNA-dependent cooperation with other transcription factors and sequence-dependent ALX4 dimerization
  shape its regulatory output. Human ALX4 can activate transcription, while promoter, partner and dosage
  context can alter the direction of regulation. Nuclear ALX4 supports skull ossification and hair-follicle
  differentiation; pathogenic variants disrupt these developmental functions.
