suggested_questions:
- question: Which experimentally grounded ancestral assertions underlie the ALX4 neuron-development IBA,
    and do they describe a neuronal ALX4 role distinct from cranial mesenchymal development?
- question: How do full-length ALX4 partner composition, DNA spacing and cell lineage determine activating
    versus repressive output and context-dependent disease-variant effects?
- question: What functional consequences follow from the recorded ALX4–IQUB and ALX4–PARVG binary interactions
    once the original pair-level assays are resolved?
suggested_experiments:
- description: Compare matched full-length human ALX4 variants in calvarial osteoblasts and neural-crest-derived
    mesenchyme using controlled expression, direct occupancy, nascent transcription and matched P3/P4
    reporters.
- description: Reconstitute DNA-dependent full-length ALX4–TWIST1–TCF4 and ALX4–LEF1 assemblies across
    DNA spacings, with binding-interface controls, and measure transcriptional output independently of
    changes in protein abundance or localization.
