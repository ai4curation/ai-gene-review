    label: skeletal system development
  evidence_type: NAS
  original_reference_id: PMID:11106354
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: ALX4 participates in skeletal development through developmental gene regulation.
    reason: The original human study identifies pathogenic ALX4 variation in families with skull ossification
      defects. That clinical evidence is combined with direct human mesenchymal chromatin/transcription
      experiments and lineage-specific mouse Alx4 studies, supporting the gene product doing regulatory
      work during skeletal development. The broad skeletal term is appropriate; no particular bone-patterning
      step is inferred solely from phenotype.
    supported_by:
    - reference_id: PMID:11106354
      full_text_unavailable: true
      supporting_text: 'Mutation analysis of the ALX4

        gene in three unrelated FPP families without the MSX2 mutation identified

        mutations in two families, indicating that mutations in ALX4 could be

        responsible for these skull defects and suggesting further genetic heterogeneity

        of FPP.'
    - reference_id: PMID:38262408
      full_text_unavailable: false
    - reference_id: PMID:38481039
      full_text_unavailable: false
- term:
    id: GO:0001942
    label: hair follicle development
  evidence_type: IMP
  original_reference_id: PMID:19692347
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Human ALX4 dysfunction disrupts follicular differentiation.
    reason: Original PMID:19692347 patient/control skin histology shows that follicle-like structures
      initiate but differentiate abnormally. This supports development at the term's resolution and does
      not mean ALX4 initiates every follicle. The independently read mouse conditional study PMID:38481039
      corroborates lineage-dependent hair phenotypes. No direct Wnt or cell-adhesion activity is inferred
      from accompanying beta-catenin changes.
    supported_by:
    - reference_id: PMID:19692347
      full_text_unavailable: true
      supporting_text: 'Hair

        follicle-like structures were present but showed altered differentiation. Our

        data indicate that ALX4 plays a critical role both in craniofacial development

        as in skin and hair follicle development in human.'
    - reference_id: PMID:38481039
      full_text_unavailable: false
