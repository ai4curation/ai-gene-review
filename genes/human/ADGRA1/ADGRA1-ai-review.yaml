id: Q86SQ6
gene_symbol: ADGRA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ADGRA1 (GPR123) is a brain-enriched seven-transmembrane receptor and the structural outlier
  of the adhesion G protein-coupled receptor family: unlike the other 32 human members it has no extracellular
  adhesion modules and no GAIN/GPS domain, its canonical isoform presenting only a 19-residue extracellular
  N-terminus ahead of the first transmembrane helix. Its bulk lies inside the cell, in a 255-residue cytoplasmic
  tail that terminates in a class I PDZ-binding motif (ETTV). Through that motif the receptor binds the
  PDZ domains of a wide set of membrane-associated scaffolds - the DLG/MAGUK proteins DLG1-4, MAGI1/2,
  SCRIB, MPDZ, PATJ, GRIP1/2, LNX1/2 and others - with micromolar affinities, placing it within postsynaptic
  scaffold networks. In the mammalian brain the receptor is enriched in thalamic nuclei, deep cortical
  layers, amygdala, hypothalamus and hippocampus, and localises to postsynaptic compartments and to a
  subset of synapses. In the hippocampus it is selectively enriched in parvalbumin-positive inhibitory
  interneurons, where it is required for their intrinsic excitability and for the strength of the inhibitory
  synapses they make onto dentate gyrus granule cells. No agonist is known, and the receptor activates
  heterotrimeric G proteins - most notably Galpha13, along with Galpha11 and Galpha15 - in an agonist-independent
  manner that does not require its short extracellular segment, suggesting it is regulated by localisation
  rather than by ligand binding. Loss of the receptor in mice also raises energy expenditure and thermogenesis
  and increases anxiety-like behaviour, and the human protein is required for maintenance of pluripotency
  in pluripotent stem cells.'
