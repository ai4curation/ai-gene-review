- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:24550280
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q12959
  review:
    summary: 'Uninformative ''protein binding'' for a mechanistically defined interaction: ADGRA1''s C-terminal
      class I PDZ-binding motif engaging a PDZ domain of DLG1.'
    action: MODIFY
    reason: 'ADGRA1''s cytoplasmic C-terminus ends in ETTV, a class I PDZ-binding motif (consensus X-[ST]-X-[VIL]),
      on a 255-residue cytoplasmic tail (UniProt TOPO_DOM 306..560). Both references behind this gene''s
      GO:0005515 rows are PDZ-specific assays by construction, all 21 partners carry annotated PDZ domains
      (2-13 each, all reviewed Swiss-Prot at canonical length), and IntAct curates the ADGRA1 side of
      every record as feature ''PDZ-binding motif'' (sufficient to bind) against a partner ''PDZ domain''.
      ''protein binding'' discards all of that; GO:0030165 states the mechanism. Proteomic peptide-phage
      display: the ADGRA1 C-terminal peptide was selected from a library of all human C-terminal peptides
      by a PDZ domain of DLG1. The interactor on the ADGRA1 side is the peptide, not the full-length receptor
      - a real caveat, but the peptide is precisely the PDZ-binding motif at issue.'
    proposed_replacement_terms:
    - id: GO:0030165
      label: PDZ domain binding
    supported_by:
    - reference_id: PMID:24550280
      supporting_text: With these libraries we screened the nine PSD-95/Dlg/ZO-1 (PDZ) domains of human
        Densin-180, Erbin, Scribble, and Disks large homolog 1 for peptide ligands.
    - reference_id: file:human/ADGRA1/ADGRA1-bioinformatics/RESULTS.md
      supporting_text: 21/21 partners carry at least one annotated PDZ domain
