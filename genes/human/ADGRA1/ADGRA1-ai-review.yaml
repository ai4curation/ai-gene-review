suggested_questions:
- question: For PAINT. Node PTN002914505 has a human reach of exactly ADGRA1 and gives it only GO:0014069
    and GO:0098978, both from a 2017 proteomics survey; ADGRA1 consequently receives no molecular function
    and no functional biological process from the tree at all. Its sole donor, MGI:MGI:1277167 (mouse
    Adgra1), now carries direct G-protein coupling data and a parvalbumin-interneuron conditional-knockout
    phenotype from PMID:41961591. Would GO_Central consider adding GO:0004930 and a GABAergic synaptic-transmission
    term at that node? It would give ADGRA1 orthologs across vertebrates their first mechanism term in
    one edit.
  experts:
  - GO_Central PAINT curators
  - PANTHER
- question: 'For GOA. PMID:15203201, a catalogue of the human and mouse adhesion-GPCR repertoire with
    EST expression charts and no perturbation experiment, carries 78 TAS annotations from GDB across 27
    distinct entities: GO:0016020 on 27, GO:0007186 on 26, GO:0004930 on 25 - essentially the whole family.
    This is the ''structural class became a molecular function'' pattern that the retirement of Swiss-Prot-keyword
    annotations was expected to have removed from GO; it survives because it entered via GDB TAS rather
    than via UniProtKB-KW. The terms are defensible for ADGRA1 on independent 2026 evidence, but that
    will not be true of all 25 recipients. Is a review of this reference''s block warranted?'
  experts:
  - GOA curators
  - GO Consortium
- question: For UniProt (Q86SQ6). Four corrections, none of which has a GO row to act on. (1) CC FUNCTION
    reads only 'Orphan receptor'; the entry predates PMID:41961591 (Galpha13/11/15 coupling of the mouse
    ortholog) and PMID:36115835 (21 PDZ partners with measured affinities). (2) There is no FT MOTIF feature
    for the C-terminal class I PDZ-binding motif at residues 557-560 (ETTV), even though the entry's own
    CC INTERACTION block lists 21 PDZ-domain proteins and the motif has been predicted in the literature
    since 2007. (3) CC SUBCELLULAR LOCATION is 'Membrane {ECO:0000255}', sequence-predicted, while SynGO
    holds IDA postsynaptic-density and glutamatergic-synapse annotations on the mouse ortholog. (4) NbExp
    in the INTERACTION block counts PDZ domains assayed within one holdup dataset, not independent experiments
    - it equals the IntAct record count for 21 of 21 partners.
  experts:
  - UniProt curators
- question: 'For IntAct/GOA. The 21-partner GO:0005515 set for ADGRA1 is the subset of IntAct''s 80 partners
    with two or more records, and because every record is one PDZ domain from the same holdup dataset,
    that filter selects multi-PDZ-domain scaffolds rather than strong binders. Thirteen of the 21 selected
    partners have no quantified affinity at all, while 23 partners with a measured Kd are excluded. The
    cleanest statement of the problem is a single pair: SNX27, at 3.7 uM the TIGHTEST binder measured
    anywhere in the dataset, is excluded, while DLG1 at 4.6 uM - the second tightest - is retained. Affinity
    is therefore not what separates them; PDZ-domain count is. Of the four tightest binders overall (SNX27
    3.7, DLG1 4.6, MAST2 4.9, MAGI3 5.1 uM) three are excluded and only DLG1 is kept. Should an affinity-aware
    criterion be used where the source assay reports dissociation constants?'
  experts:
  - IntAct curators
  - GOA curators
- question: 'Ontology question, raised rather than acted on. GO:0004930''s definition requires ''combining
    with an extracellular signal and transmitting the signal across the membrane by activating an associated
    G-protein'', and GO:0007186''s begins ''initiated by a ligand binding to its receptor''. ADGRA1 satisfies
    the G-protein half and not the ligand half: it is an orphan, its activation is agonist-independent,
    and deleting its entire 19-residue ectodomain does not change the coupling profile. Is a definitional
    revision or a ligand-independent sibling term warranted for constitutively active and orphan receptors?'
  experts:
  - GO ontology editors
suggested_experiments:
- description: Measure G-protein coupling of the HUMAN receptor. Every coupling measurement to date used
    mouse Adgra1 (Q8C4G9); running the same TRUPATH BRET2 panel on human ADGRA1, and on the two alternative
    isoforms - especially Q86SQ6-1, whose ~800-residue Ser/Thr-rich N-terminal extension gives the receptor
    an ectodomain the canonical isoform lacks - would show whether agonist-independent Galpha13 activation
    is a property of the protein or of the short isoform.
  hypothesis: Human ADGRA1 couples to Galpha13 as the mouse ortholog does, and the long Ser/Thr-rich isoform
    Q86SQ6-1 behaves differently from the canonical ectodomain-less isoform.
- description: Test whether coupling is truly constitutive rather than an overexpression artefact. Titrate
    receptor density against BRET2 response alongside a known constitutively active GPCR and a known ligand-gated
    one, and repeat in neurons at near-endogenous expression using a knock-in tag, since the current result
    comes from HEK293T overexpression scored against empty vector.
  hypothesis: The agonist-independent G-protein activation reported for ADGRA1 is genuine constitutive
    activity rather than a consequence of receptor overexpression.
- description: Give the PDZ motif a phenotype. Deleting it changes neither synaptic localisation nor Galpha13
    co-localisation, so the informative experiment is a knock-in ETTV-to-ETTA mouse assayed for the published
    PV-interneuron readouts - intrinsic excitability and inhibitory synaptic strength onto dentate gyrus
    granule cells - rather than another localisation assay.
  hypothesis: The C-terminal PDZ-binding motif has a function in inhibitory synaptic physiology even though
    it is dispensable for synaptic localisation.
- description: Identify which PDZ partners are engaged in vivo. Holdup measures affinity between isolated
    domains and a peptide; a proximity-labelling or co-immunoprecipitation experiment from parvalbumin
    interneurons would show which of DLG1-4, MAGI1/2, SCRIB, SNX27 and MAST2 the full-length receptor
    actually meets. SNX27 and MAST2 are worth including despite being absent from GOA, since they are
    the tightest binders measured.
  hypothesis: Only a subset of the PDZ-domain proteins that bind the ADGRA1 peptide in vitro engage the
    full-length receptor in parvalbumin interneurons.
- description: Raise an antibody that detects endogenous ADGRA1. The 2026 study states it could not determine
    endogenous localisation for lack of one, so every localisation result for this protein rests either
    on tagged overexpression or on mass spectrometry of fractionated brain.
  hypothesis: Endogenous ADGRA1 can be localised directly, testing whether the tagged-overexpression and
    fractionation results reflect where the native protein is.
