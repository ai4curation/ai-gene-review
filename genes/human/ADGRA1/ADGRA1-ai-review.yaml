- KIAA1828
core_functions:
- description: Binds the PDZ domains of postsynaptic and junctional scaffold proteins through a class
    I PDZ-binding motif (ETTV) at the end of its cytoplasmic tail, coupling the receptor into MAGUK and
    multi-PDZ scaffold networks. Affinities measured by holdup assay run from ~4.6 uM (DLG1) to ~116 uM
    (MAGI2), with DLG1-4, MAGI1/2 and SCRIB the best-quantified partners. The motif is not required for
    synaptic targeting, which depends on other features of the tail.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0014069
    label: postsynaptic density
  - id: GO:0098978
    label: glutamatergic synapse
  - id: GO:0098982
    label: GABA-ergic synapse
  supported_by:
  - reference_id: PMID:36115835
    supporting_text: we measure the affinities of 65,000 interactions involving PDZ domains and their
      target PDZ-binding motifs (PBM)
  - reference_id: PMID:41961591
    supporting_text: ADGRA1 exhibits a 7-transmembrane (7-TM) GPCR followed by a relatively large cytoplasmic
      tail
  - reference_id: PMID:41961591
    supporting_text: ADGRA1-ΔPDZ localized to synapses comparable to the WT, suggesting that other sequence
      features are responsible for synaptic localization.
  - reference_id: file:human/ADGRA1/ADGRA1-bioinformatics/RESULTS.md
    supporting_text: 21/21 partners carry at least one annotated PDZ domain
- description: 'Activates heterotrimeric G proteins - most notably Galpha13, and also Galpha11 and Galpha15
    - as a seven-transmembrane receptor at the neuronal surface. Activation is agonist-independent: no
    ligand is known, and replacing the receptor''s 19-residue extracellular segment with a glycine linker
    leaves the coupling profile unchanged, so the receptor appears to be regulated by localisation rather
    than by ligand binding. Demonstrated for the mouse ortholog (Q8C4G9) overexpressed in HEK293T cells.
    In hippocampal parvalbumin interneurons this pathway is required for intrinsic excitability and for
    the strength of the inhibitory synapses those interneurons make onto dentate gyrus granule cells.'
  molecular_function:
    id: GO:0004930
    label: G protein-coupled receptor activity
  directly_involved_in:
  - id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  - id: GO:0032230
    label: positive regulation of synaptic transmission, GABAergic
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0098982
    label: GABA-ergic synapse
  supported_by:
  - reference_id: PMID:41961591
    supporting_text: Full-length ADGRA1 activated several G proteins, most notably Gα13
  - reference_id: PMID:41961591
    supporting_text: Gα11, Gα15, and Gα13 all exhibited a plasmid copy-number-dependent change in BRET2,
      supporting the specificity of these measurements
  - reference_id: PMID:41961591
    supporting_text: The G protein coupling profile of ΔN-ADGRA1 was similar to full-length ADGRA1, suggesting
      that this extracellular sequence is not involved in basal G protein activation
  - reference_id: PMID:41961591
    supporting_text: ADGRA1 deletion in PV interneurons impairs intrinsic excitability and reduces inhibitory
      synaptic strength onto dentate gyrus granule cells.
knowledge_gaps:
- gap_statement: Whether ADGRA1 sits on the presynaptic or the postsynaptic side of the inhibitory synapse
    is unresolved. Two distinct questions are involved and the evidence bears on them unequally. On LOCALISATION,
    the only positive statements are that tagged receptor appears on dendrites and on axon initial segments
    and co-localises with vGAT - and that sentence is hedged ('suggesting subcellular localization'),
    rests entirely on overexpressed HA-tagged protein because no reliable antibody exists, and the rescue
    result establishes which CELL the receptor is needed in rather than which side of the synapse it occupies.
    Those are the grounds on which GO:0098793 presynapse was considered and not proposed. Separately,
    on FUNCTION, paired-pulse ratio, coefficient of variation and Syt2-labelled terminal density are all
    unaltered, so whatever the receptor does, it is not acting through presynaptic release probability
    or terminal number. That is a mechanistic gap in its own right and is not evidence about where the
    protein is.
  boundary: 'Known: the receptor is at inhibitory synapses (vGAT co-localisation) and is required in PV
    cells for their inhibitory output. Unknown: which side of the synapse the protein occupies, and by
    what mechanism a receptor that does not change release probability reduces inhibitory strength. Every
    localisation result rests on overexpressed tagged protein, because no reliable antibody exists.'
