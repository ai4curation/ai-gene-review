- gap_statement: No agonist is known for ADGRA1, and unlike every other adhesion GPCR it cannot use the
    tethered-agonist mechanism, because it has no GAIN domain and only a 19-residue extracellular N-terminus.
    The one experiment that tested whether that segment matters found it dispensable for basal G-protein
    activation, so how the receptor is switched on - or whether it is constitutively active and controlled
    only by where it is - is unresolved.
  boundary: 'Known: the receptor activates Galpha13/11/15 when overexpressed, and deleting residues 1-22
