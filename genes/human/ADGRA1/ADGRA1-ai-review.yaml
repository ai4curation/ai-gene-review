- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000832
  - InterPro:IPR017983
  review:
    summary: Fold-derived, but the activity is now independently demonstrated.
    action: ACCEPT
    reason: 'The G-protein-activating half of GO:0004930 is now demonstrated: TRUPATH BRET2 across all
      14 Galphabetagamma sensors shows activation of Galpha13, Galpha11 and Galpha15 with a plasmid copy-number
      dependence and an unresponsive GalphaoB control (PMID:41961591). The assay used the MOUSE ortholog
      (Q8C4G9) overexpressed in HEK293T, so the appropriate evidence for the human gene is ISS with UniProtKB:Q8C4G9
      as the supporting entity; GOA is asked to attach that evidence line to the existing term (see suggested_questions),
      since all four current lines cite references with no functional content. The term is therefore ACCEPTed
      and the reference problem recorded in reference_review rather than converted into a GO action. Caveat
      retained rather than smoothed over: the receptor is an orphan and the activation is agonist-independent,
      so the definition''s first conjunct (''combining with an extracellular signal'') is unestablished;
      that is raised as an ontology question, not acted on.'
    supported_by:
    - reference_id: PMID:41961591
      supporting_text: Full-length ADGRA1 activated several G proteins, most notably Gα13
    - reference_id: PMID:41961591
      supporting_text: Gα11, Gα15, and Gα13 all exhibited a plasmid copy-number-dependent change in BRET2,
        supporting the specificity of these measurements
