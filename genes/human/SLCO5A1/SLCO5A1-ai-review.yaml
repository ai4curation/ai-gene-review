gene_symbol: SLCO5A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Solute carrier organic anion transporter family member 5A1 (OATP5A1), a 12-transmembrane
  plasma membrane protein and the most divergent member of the human SLCO/OATP (SLC21) family. It
  is expressed widely, including in brain neurons and astrocytes, heart, gastrointestinal tract and
  many tumours, and is found at the plasma membrane of ductal epithelial cells in normal breast tissue,
  with an additional cytoplasmic pool in breast tumours. Unlike the hepatic and intestinal OATPs,
  which carry bile acids, conjugated steroids and many widely used drugs, OATP5A1 long had no identified
  substrate. A single characterisation in overexpressing HEK293 cells reports it as a low-affinity
  carrier that takes up the conjugated steroid estrone-3-sulfate, the aromatic amino acid L-tyrosine
  and the vitamin thiamine, and that exports the neutral amino acids glutamine and glycine; pantothenic
  acid and thymine inhibit its tyrosine uptake. That substrate profile is not yet corroborated: two
  earlier studies in Xenopus oocytes found no estrone-3-sulfate uptake, and the bidirectional behaviour,
  while consistent with the exchange mechanism generally attributed to OATPs, has not been resolved
  into a coupled antiport cycle. Variation at the SLCO5A1 locus has been associated with impulsivity
  in juvenile myoclonic epilepsy.'
