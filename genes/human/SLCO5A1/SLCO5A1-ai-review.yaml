core_functions:
- molecular_function:
    id: GO:0015291
    label: secondary active transmembrane transporter activity
  description: 'OATP5A1 is a 12-transmembrane member of the organic anion transporting polypeptide
    (SLCO/SLC21) family that resides in the plasma membrane and, on family grounds, moves solutes
    by coupling to another solute gradient rather than to ATP hydrolysis. It was the last well-expressed
    orphan of the family, and its substrate profile has been reported only once, from a single laboratory
    using HEK293 cells overexpressing the protein: uptake of estrone-3-sulfate (Km 102 uM), L-tyrosine
    (Km 170 uM) and thiamine (Km 16 uM), together with efflux of glutamine and glycine, with pantothenic
    acid and thymine inhibiting tyrosine uptake. The molecular function is stated at this general
    level deliberately. The bidirectional profile is readily explained if OATP5A1 is an electroneutral
    exchanger, which would make the influx and efflux substrates two halves of one antiport cycle,
    but no counter-substrate or stoichiometry has been measured; and the flagship substrate, estrone-3-sulfate,
    was not transported in two earlier Xenopus oocyte studies, so the profile is demonstrably system-dependent.
    The specific substrate molecular functions are recorded in this review as reviewer proposals
    awaiting independent replication rather than as established activities.'
