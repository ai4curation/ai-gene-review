- id: PMID:42231149
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: 'PubMed-verified: Kohlmann et al., Cell Mol Biol Lett 31(1):75, 2026 (Jun 2), PMC13231527.
      Full text available and read. The sole source for every substrate claim about OATP5A1, and
      correctly cited for all of them. Marked LOW_QUALITY not because the work is poorly done - the
      controls (4 degree Celsius counter-controls, saturation kinetics with six biological replicates,
      inhibitor panels, thiamine background depletion) are appropriate - but because the entire substrate
      profile rests on one laboratory and one heterologous overexpression system, and because the
      paper itself reports that its flagship substrate, estrone-3-sulfate, was NOT taken up in two
      earlier oocyte studies. The single-lab status is the reason the specific molecular functions
      are recorded here as NEW reviewer proposals rather than asserted.'
  title: Deorphanisation and functional characterisation of OATP5A1 as transport protein for amino
    acids and vitamins.
