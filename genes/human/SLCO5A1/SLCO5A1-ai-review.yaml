proposed_new_terms:
- proposed_name: estrone 3-sulfate transmembrane transporter activity
  proposed_definition: Enables the transfer of estrone 3-sulfate from one side of a membrane to the
    other.
  justification: Estrone-3-sulfate is the canonical probe substrate of the OATP/SLCO family and has
    been measured for most human OATPs, yet GO has no molecular-function term for it. The two terms
    curators would previously have used, GO:0015347 (sodium-independent organic anion transmembrane
    transporter activity) and GO:0008514 (organic anion transmembrane transporter activity), are
    both obsolete, so OATP estrone-3-sulfate transport is currently annotated to the root-level GO:0022857
    transmembrane transporter activity - which is what SLCO5A1 carries here. A specific term would
    let the widely measured, and in this case contested, estrone-3-sulfate result be recorded at
    the granularity at which it was actually determined, for this gene (Km 102.2 uM) and across the
    family.
  proposed_parent:
    id: GO:0022857
    label: transmembrane transporter activity
  supported_by:
  - reference_id: PMID:42231149
    supporting_text: For estrone-3-sulfate, tyrosine and thiamine, kinetic transport parameters (Km
      values) of 102.2 µM, 169.9 µM and 15.6 µM were calculated, respectively.
  - reference_id: PMID:42231149
    supporting_text: The Km value for OATP5A1-mediated estrone-3-sulfate transport (102.2 µM) is
      higher than the Km value for estrone-3-sulfate transport by other OATP family members (e.g.,
      0.46 µM for OATP1B1) [32]. This suggests that OATP5A1 is a low-affinity-high-capacity transporter
      of estrone-3-sulfate.
  - reference_id: PMID:42231149
    supporting_text: The hormone conjugate estrone-3-sulfate has been investigated as substrate of
      OATP5A1 before. However, no significantly increased uptake was detected in these studies [16,
      17].
suggested_questions:
- question: Does OATP5A1 transport estrone-3-sulfate at all? PMID:42231149 reports uptake with a
    Km of 102.2 uM in HEK293 cells, but states that two earlier studies in Xenopus laevis oocytes
    found no significant uptake. Since estrone-3-sulfate is the reference substrate against which
    the whole OATP family is calibrated, this single disagreement determines how much of the rest
    of the substrate profile should be believed. A third, independent system is needed.
  experts:
  - Joerg Koenig
  - Martin F Fromm
- question: Is OATP5A1 an obligate exchanger, and if so what is the counter-substrate? The reported
    profile - tyrosine, thiamine and estrone-3-sulfate in, glutamine and glycine out, in the same
    cells - is exactly what an electroneutral antiporter would produce, and would make the individual
    substrate assignments mechanistically interdependent rather than independent. Nothing in the
    paper measures coupling, stoichiometry or electrogenicity.
  experts:
  - Joerg Koenig
  - Anna Gessner
- question: Do any of these transport activities occur at endogenous expression levels? Every functional
    result comes from stably transfected HEK293 cells overexpressing OATP5A1. Knockdown or knockout
    in a cell type with meaningful endogenous expression - astrocytes or neurons for the glutamine
    and glycine efflux claim, intestinal epithelium for thiamine - would convert a heterologous activity
    into a cellular function.
  experts:
  - Joerg Koenig
  - Martin F Fromm
- question: Is SLCO5A1 basolateral in any polarised epithelium? The IBA-derived GO:0016323 annotation
    has been generalised to GO:0005886 in this review because no SLCO5A1-specific observation establishes
    polarity - HEK293 cells are unpolarised and the breast-tissue study reports only plasma membrane.
    Polarised filter-grown epithelial monolayers (Caco-2, MDCK) with domain-selective biotinylation
    would settle it, and would matter for the proposed intestinal thiamine absorption role, which
    requires apical localisation rather than basolateral.
  experts:
  - Joerg Koenig
- question: Are the reported affinities compatible with a physiological role? The Km values for estrone-3-sulfate
    (102 uM) and tyrosine (170 uM) sit well above the plasma concentrations of those compounds, and
    thiamine's (15.6 uM) is roughly two orders of magnitude above plasma thiamine. If OATP5A1 is
    a genuine low-affinity high-capacity carrier, the tissues where it matters are those with locally
    high substrate concentrations, such as the intestinal lumen or tumour interstitium - which would
    be a testable prediction rather than a caveat.
  experts:
  - Martin F Fromm
suggested_experiments:
- hypothesis: The OATP5A1 substrate profile reported in HEK293 cells is reproducible in an independent
    expression system, and estrone-3-sulfate transport is real.
  description: Express human OATP5A1 in Xenopus laevis oocytes and in a second mammalian background
    (e.g. MDCK or CHO) alongside OATP1B1 as a positive control and water-injected or vector-only
    negatives. Measure uptake of radiolabelled estrone-3-sulfate, tyrosine and thiamine across a
    concentration range spanning the reported Km values, including concentrations higher than those
    used in the earlier negative oocyte studies. Confirm surface expression in each system by biotinylation
    so that a negative result can be distinguished from a trafficking failure, which is the most
    likely explanation for the existing discrepancy.
  experiment_type: cross-system heterologous expression with surface-expression controls, radiolabelled
    uptake
- hypothesis: OATP5A1 is an obligate exchanger in which uptake of tyrosine, thiamine or estrone-3-sulfate
    is coupled to efflux of glutamine or glycine.
  description: Purify OATP5A1 and reconstitute into proteoliposomes preloaded with unlabelled glutamine
    or glycine. Test whether external radiolabelled tyrosine or thiamine uptake is stimulated by
    the internal amino acid (trans-stimulation) and abolished without it, and run the reciprocal
    experiment with labelled glutamine inside and unlabelled tyrosine outside. Measure electrogenicity
    by clamping membrane potential with valinomycin and K+ gradients. In parallel, in intact HEK-OATP5A1
    cells, test whether tyrosine uptake rate depends on intracellular glutamine loading.
  experiment_type: proteoliposome reconstitution, trans-stimulation and counterflow assays
- hypothesis: Endogenous OATP5A1 mediates glutamine efflux from astrocytes.
  description: Knock out or knock down SLCO5A1 in human iPSC-derived astrocytes, which express it
    endogenously, and measure glutamine and glycine release into the medium by LC-MS after preloading
    with labelled substrate, against knockdown of the established glutamine effluxer SNAT3 (SLC38A3)
    as a comparator. If OATP5A1 contributes, its loss should reduce release without affecting uptake
    by the sodium-coupled routes. Pair with domain-selective localisation to check that the protein
    is where the flux is.
  experiment_type: CRISPR loss-of-function in a physiologically relevant human cell type, stable
    isotope efflux measurement
- hypothesis: OATP5A1 contributes to intestinal thiamine absorption at luminal thiamine concentrations.
  description: Use polarised Caco-2 monolayers on filters, with and without SLCO5A1 knockdown and
    with THTR1/THTR2 (SLC19A2/SLC19A3) knockdown as comparators, to measure apical-to-basolateral
    thiamine flux at luminal-range concentrations (10-200 uM) where the high-affinity transporters
    are saturated and a Km of 15.6 uM carrier would contribute. Determine which membrane domain OATP5A1
    occupies in the same monolayers by domain-selective biotinylation, since the proposed absorptive
    role requires apical localisation and the IBA-derived annotation predicted basolateral.
  experiment_type: polarised epithelial monolayer transport with domain-selective surface labelling
