- term:
    id: GO:0015888
    label: thiamine transport
  evidence_type: IDA
  original_reference_id: PMID:42231149
  qualifier: involved_in
  review:
    summary: Thiamine was identified by untargeted metabolomics as enriched in HEK-OATP5A1 versus
      vector-control cells, then confirmed by LC-MS uptake with a Km of 15.6 uM after depleting the
      intracellular pool in thiamine-free medium.
    action: ACCEPT
    reason: 'Accepted. The background-depletion design is a real methodological strength, because
      intracellular thiamine would otherwise mask any uptake, and the affinity is credible: 15.6
      uM sits between the high-affinity thiamine transporters THTR1 and THTR2 and the low-affinity
      OCT1. The physiological caveat is worth recording rather than acting on: 15.6 uM is well above
      plasma thiamine (40-120 nM), so any in vivo role is likely restricted to the intestinal lumen,
      where thiamine can exceed 100 uM and where OATP5A1 is expressed. Single-lab and heterologous,
      like everything else from this paper.'
    supported_by:
