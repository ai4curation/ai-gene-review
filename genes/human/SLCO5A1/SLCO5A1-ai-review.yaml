  review:
    summary: Phylogenetic transfer of basolateral plasma membrane localisation from characterised
      OATPs. The plasma membrane part is well supported for SLCO5A1 by three independent IDA sources;
      the basolateral part is not supported by any SLCO5A1-specific observation.
    action: MODIFY
    reason: 'The node placement is correct and I am not challenging it: SLCO5A1 is an OATP and is
      a plasma membrane protein. What does not transfer is the polarity refinement. The donor set
      is dominated by OATPs characterised in polarised epithelia - OATP1B1 and OATP1B3 at the hepatocyte
      sinusoidal (basolateral) membrane above all - where basolateral localisation is a property
      of the cell type rather than of the transporter fold. SLCO5A1 is ubiquitously expressed, including
      in cells that have no apical-basolateral axis, and every SLCO5A1-specific localisation result
      says plasma membrane without polarity: immunofluorescence in HEK293 cells (not polarised),
      immunohistochemistry of breast ductal epithelium, and HPA immunofluorescence. Generalising
      to GO:0005886, which the gene already holds with IDA evidence, keeps everything the phylogeny
      genuinely supports and drops the part it does not.'
