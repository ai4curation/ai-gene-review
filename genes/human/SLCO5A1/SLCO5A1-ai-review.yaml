- term:
    id: GO:0005302
    label: L-tyrosine transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:42231149
  qualifier: enables
  review:
    summary: Reviewer-proposed annotation. Radiolabelled tyrosine uptake into HEK-OATP5A1 cells was
      time-dependent, saturable with a Km of 169.9 uM, reduced at 4 degrees Celsius, and inhibited
      by the prototypical OATP inhibitors BSP and benzbromarone and by pantothenic acid and thymine.
    action: NEW
    reason: Framed as a reviewer proposal, not a settled annotation. All of the evidence comes from
      one laboratory using one heterologous system (stably transfected HEK293 cells overexpressing
      OATP5A1 versus vector control), with no oocyte or proteoliposome confirmation, no knockdown
      in a cell that expresses OATP5A1 endogenously, and no tissue-level validation. The same paper
      reports that two earlier studies failed to detect uptake of estrone-3-sulfate, the canonical
      OATP probe substrate, in Xenopus oocytes, which shows that this transporter's apparent substrate
      profile is system-dependent. Proposed nonetheless because tyrosine is the best-controlled substrate
      in the study - it is the only one with a radiolabel, a saturation curve, a temperature control
      and an inhibitor panel - and because the same activity is established for the related OATP3A1
      with a comparable Km (220.8 uM), which gives the claim an independent family precedent that
      the other substrates lack.
    supported_by:
