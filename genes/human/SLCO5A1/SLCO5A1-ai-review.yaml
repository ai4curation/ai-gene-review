- term:
    id: GO:0015291
    label: secondary active transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Phylogenetic assertion that SLCO5A1 is a secondary active transporter, i.e. one that
      couples solute movement to another solute gradient rather than to ATP hydrolysis.
    action: ACCEPT
    reason: 'Sound, and the 2026 deorphanization strengthens rather than weakens it. OATPs are generally
      modelled as electroneutral exchangers, and an obligate antiporter is precisely what would produce
      the pattern Kohlmann et al. report: net uptake of estrone-3-sulfate, tyrosine and thiamine
      together with net efflux of glutamine and glycine in the same cells. A bidirectional profile
      is unusual for an OATP paper but is not anomalous for an exchange mechanism. Caveat for the
      record: neither the counter-substrate nor the stoichiometry was determined, so secondary active
      coupling remains a family-level inference for this member rather than a measured property,
      and it should be left at this level of generality until it is.'
    supported_by:
    - reference_id: PMID:42231149
      supporting_text: While estrone-3-sulfate, tyrosine and thiamine were further characterised
        as uptake substrates, glutamine and glycine were exported by OATP5A1.
    - reference_id: PMID:42231149
      supporting_text: In line with these data, efflux experiments after preloading the cells (Fig.
        6C and D) demonstrated a highly significant OATP5A1-mediated efflux which is significantly
        reduced in HEK-OATP5A1 cells by performing the same experiments at 4 °C
- term:
    id: GO:0043252
    label: sodium-independent organic anion transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Phylogenetic transfer of the defining OATP process: sodium-independent transport of
      organic anions.'
    action: ACCEPT
    reason: 'The organic anion part now has direct support for this member: estrone-3-sulfate, an
      organic anion and the canonical OATP probe substrate, is taken up with a Km of 102 uM, and
      uptake of the co-substrate tyrosine is inhibited by the prototypical OATP inhibitors BSP and
      benzbromarone, which is family-consistent pharmacology. The sodium-independence half was not
      tested for SLCO5A1 specifically - no sodium-replacement experiment was reported - so that part
      remains inherited rather than demonstrated. Accepting rather than splitting the term, because
      sodium-independence is a robust family property and nothing contradicts it here. Note also
      that two earlier studies in Xenopus oocytes found no estrone-3-sulfate uptake by OATP5A1, so
      even the supported half rests on a contested result.'
    supported_by:
