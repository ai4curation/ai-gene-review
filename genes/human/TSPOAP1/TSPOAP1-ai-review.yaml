    label: mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN001022784
  - UniProtKB:O95153
  review:
    summary: Mitochondrion (IDA from partial colocalization of PRAX-1 with TSPO; IBA; IEA from the UniProt
      subcellular location).
    action: MARK_AS_OVER_ANNOTATED
    reason: All three rows rest on one 1999 study in which the protein was cytoplasmic and only partially
      colocalized with TSPO at mitochondria, and UniProt notes this was preferential in the presence of TSPO.
      UniProt records a caution that a later rat study did not find the protein associated with TSPO in brain.
      The IBA is seeded by this same human annotation. Every later study places RIM-BPs at the active zone, so
      mitochondrion is an over-annotation rather than a demonstrated residence of the endogenous protein; the
      experimental result itself is not disputed.
    propagation_review:
