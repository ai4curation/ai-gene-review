- term:
    id: GO:0099509
    label: regulation of presynaptic cytosolic calcium ion concentration
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0099626
  review:
    summary: Regulation of presynaptic cytosolic calcium ion concentration (IEA, inferred from the channel
      activity row below by inter-ontology links).
    action: KEEP_AS_NON_CORE
    reason: 'The inference chain starts from a wrong molecular function (row 25), but the process claim holds on
      its own: by positioning Cav channels, RIM-BP1 influences presynaptic calcium signals, and the dystonia variant
      enlarges spike-evoked calcium transients. It is a consequence of the scaffold role, so non-core.'
