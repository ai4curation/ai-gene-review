suggested_questions:
- question: Does RIM-BP1 have a non-redundant role at any synapse type, such as cerebellar Purkinje cell or
    striatal synapses implicated in dystonia, where RIM-BP2 does not dominate?
- question: Does endogenous RIM-BP1 bind TSPO or localize to mitochondria in any tissue, given that the only
    evidence is a yeast two-hybrid screen and partial colocalization of overexpressed protein?
- question: 'How does the p.Gly1808Ser substitution near the third SH3 domain increase spike-evoked calcium transients:
    by altering channel binding affinity, channel number at release sites, or condensate formation with RIM?'
suggested_experiments:
- description: Conditional deletion of Rimbp1 alone in cerebellar Purkinje cells and striatal neurons, with
    paired recordings of release probability and nanodomain coupling (EGTA sensitivity).
  hypothesis: RIM-BP1 is required for tight Cav2.1-release site coupling in dystonia-relevant circuits.
- description: Immunogold or super-resolution localization of endogenous RIM-BP1 in brain and thymus, with
    TSPO co-staining and mitochondrial fractionation checked for ER and synaptic markers.
  hypothesis: Endogenous RIM-BP1 is an active-zone protein and does not associate with TSPO at mitochondria.
