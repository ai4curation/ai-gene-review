id: O95153
gene_symbol: TSPOAP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TSPOAP1 encodes RIM-binding protein 1 (RIM-BP1), an 1857-residue multidomain scaffold of the presynaptic
  active zone, expressed mainly in brain, pituitary and thymus. It has no enzymatic activity; it carries an N-terminal
  SH3 domain, three fibronectin type III domains and two C-terminal SH3 domains separated by long disordered regions.
  Its SH3 domains bind proline-rich motifs in RIM1 and RIM2 and in the cytoplasmic tails of voltage-gated calcium
  channel alpha1 subunits, including Cav2.1 (CACNA1A), so RIM-BPs link calcium channels to the vesicle tethering
  and priming machinery and keep channels close to release sites. Together with its paralog RIM-BP2, which dominates
  at hippocampal synapses, it sets the tight coupling of action-potential-evoked calcium influx to synaptic vesicle
  fusion. Biallelic loss-of-function variants cause juvenile-onset generalized dystonia with intellectual disability
  and cerebellar atrophy, and a missense variant that enhances spike-evoked calcium transients and release causes
  adult-onset focal dystonia. The protein was first isolated as PRAX-1, a yeast two-hybrid partner of the mitochondrial
  translocator protein TSPO (peripheral benzodiazepine receptor), but that association has not been supported in
  brain.'
