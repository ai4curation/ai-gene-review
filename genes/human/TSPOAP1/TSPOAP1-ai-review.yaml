- term:
    id: GO:0046928
    label: regulation of neurotransmitter secretion
  evidence_type: IMP
  original_reference_id: PMID:33539324
  qualifier: involved_in
  review:
    summary: Regulation of neurotransmitter secretion (IMP), from patient variants and Rimbp1 knockout mice.
    action: ACCEPT
    reason: Loss of RIM-BP1 reduces neurotransmission and the dystonia missense variant enhances spike-evoked
      calcium transients and release, so RIM-BP1 sets the rate of evoked release. Core process, consistent
      with family studies coupling calcium channels to release sites.
    supported_by:
    - reference_id: PMID:33539324
      supporting_text: In vitro analysis of the p.Gly1808Ser variant showed larger spike-evoked calcium
        transients and enhanced neurotransmission
    - reference_id: file:human/TSPOAP1/TSPOAP1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Required for synaptic transmission regulation (PubMed:33539324).
