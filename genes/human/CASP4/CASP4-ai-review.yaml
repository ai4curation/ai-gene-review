      - source_id: WB:WBGene00000417
        source_label: ced-3
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral apoptotic caspase; seeds the deep node but says nothing about inflammatory-caspase
