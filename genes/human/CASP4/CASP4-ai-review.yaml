      reconstituted with catalytically dead and autoprocessing-defective CASP4, plus activity-normalised
      side-by-side in vitro cleavage of a common substrate panel.
    provenance:
    - reference_id: PMID:42044191
      supporting_text: While CASP1 substrates are well defined, those of CASP4 and CASP5 remain less
        understood.
    - reference_id: PMID:42044191
      supporting_text: In CASP1 KO cells, GSDMD processing was nearly abolished suggesting most GSDMD
