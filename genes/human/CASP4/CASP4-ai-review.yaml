- term:
    id: GO:0072558
    label: NLRP1 inflammasome complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: Phylogenetic transfer of NLRP1 inflammasome membership from CASP5 and two zebrafish
      caspases; human CASP4 has not been placed in an NLRP1 inflammasome.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The GO definition of this complex names only caspase-1 or caspase-5 as the protease
      component. Inspection of the PAINT file for PTHR47901 shows the IBD at PTN002573059 was seeded
      by UniProtKB:P51878 (human CASP5) plus zebrafish caspa and caspb, with no CASP4 evidence; the
      node spans the whole CASP1/4/5 clade, so the term reaches CASP4 mechanically. CASP4''s experimentally
      defined complex is the non-canonical inflammasome (GO:0160074), which it is separately and
      correctly annotated to. Not removed: if CASP4 is shown to be recruited to NLRP1 inflammasomes
      the transfer would become sound.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: UniProtKB:P51878
        source_label: CASP5
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Human caspase-5 is named in the GO term definition; its paralog CASP4 is not, and
          shares no NLRP1 evidence.
      - source_id: ZFIN:ZDB-GENE-000616-3
        source_label: caspa
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Zebrafish inflammatory caspase; NLRP1 complex composition in teleosts does not establish
          human CASP4 membership.
      - source_id: ZFIN:ZDB-GENE-020812-1
        source_label: caspb
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: As for caspa.
      - source_id: PANTHER:PTN002573059
        source_label: PTN002573059
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node spans the CASP1/CASP4/CASP5 clade, so a CASP5-specific complex assignment reaches
