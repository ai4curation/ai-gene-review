- term:
    id: GO:0042742
    label: defense response to bacterium
  evidence_type: IDA
  original_reference_id: PMID:25119034
  qualifier: involved_in
  review:
    summary: CASP4 restricts intracellular Gram-negative bacteria by sensing their LPS and triggering
      pyroptosis.
    action: ACCEPT
    reason: Core biological process, supported across Salmonella, Shigella and Burkholderia models
      and by the existence of dedicated bacterial evasion mechanisms (OspC3 ADP-riboxanation of the
      caspase), which is strong evidence that the pathway matters in vivo.
    supported_by:
    - reference_id: PMID:34671164
      supporting_text: Mouse caspase-11 and human caspase-4 and caspase-5 recognize cytosolic lipopolysaccharide
        (LPS) to induce pyroptosis by cleaving the pore-forming protein GSDMD
    - reference_id: PMID:31268602
      supporting_text: GBP1 facilitated caspase-4 recruitment to Salmonella leading to its enhanced
        activation and pyroptosis.
