- term:
    id: GO:0061702
    label: canonical inflammasome complex
  evidence_type: EXP
  original_reference_id: PMID:25119034
  qualifier: part_of
  review:
    summary: CASP4 is found in, and feeds into, canonical (NLRP3/NLRP6, caspase-1-activating) inflammasomes
      as well as its own non-canonical one.
    action: KEEP_AS_NON_CORE
    reason: Not wrong - CASP4 physically interacts with caspase-1 and is required for NLRP3- and
      NLRP6-dependent IL-1β output - but the complex that defines CASP4 is the non-canonical inflammasome
      (GO:0160074), whose GO definition names CASP4 explicitly. Kept as a secondary, context-dependent
      complex membership.
    supported_by:
    - reference_id: PMID:26508369
      supporting_text: Here we report that caspase-4 and caspase-5 mediate IL-1α and IL-1β release
        from human monocytes after LPS stimulation.
    - reference_id: PMID:33377178
      supporting_text: After LPS priming, cytosolic Streptococcus mutans LTA triggered NLRP6-caspase
        4 inflammasome activation.
