id: P49662
gene_symbol: CASP4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Human caspase-4 is an inflammatory cysteine protease of the caspase-1 subfamily, encoded
  in the CASP1/CASP4/CASP5 cluster, that acts as the cytosolic receptor and effector of the non-canonical
  inflammasome. Its N-terminal CARD binds the lipid A moiety of bacterial lipopolysaccharide that
  has reached the cytoplasm; ligand engagement converts the otherwise disordered CARD into an alpha-helical
  fold, drives CARD-mediated polymerisation, and dimerises and autoprocesses the p20/p10 protease
  domain at D270 and D289. The activated enzyme cleaves after aspartate, processing gasdermin D to
  liberate its pore-forming N-terminal fragment and thereby triggering pyroptosis, and directly maturing
  pro-interleukin-18 - an activity that human caspase-4 has but rodent caspase-11 lacks, so caspase-4
  and mouse caspase-11 are not functionally interchangeable despite occupying the same position in
  their respective pathways. Activation on intracellular bacteria requires guanylate-binding proteins,
  chiefly GBP1, which coat and deform the LPS-rich outer membrane and expose lipid A. How caspase-4
  engages its ligand is disputed: direct binding measurements show high-affinity association with
  free LPS and lipid A and identify a hydrophobic acyl-chain pocket in the CARD, whereas membrane
  work indicates that caspase-4 binds LPS surfaces of positive curvature rather than individual LPS
  molecules, and the resulting assembly is structurally heterogeneous rather than a complex of fixed
  stoichiometry. The substrate repertoire is also unsettled: alongside gasdermin D and pro-interleukin-18,
  caspase-4 has been reported to cleave pro-interleukin-1beta and to directly activate the executioner
  caspases CASP3 and CASP7, while in macrophages most gasdermin D cleavage during non-canonical signalling
  may instead be carried out by caspase-1. A separate, longer-standing arm of caspase-4 biology places
  the zymogen on the cytoplasmic face of the endoplasmic reticulum membrane via TMEM214, where it
  participates in apoptosis induced by ER stress and by amyloid-beta peptides.'
