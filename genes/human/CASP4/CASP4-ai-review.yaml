- term:
    id: GO:0070269
    label: pyroptotic inflammatory response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Pyroptosis is the defining outcome of CASP4 activation by cytosolic LPS.
    action: ACCEPT
    reason: Core biological process, supported by reconstitution, by CRISPR screens identifying GSDMD
      as the executioner, and by pathogen-evasion genetics. The IBD node PTN002573059 is seeded by
      CASP4 itself plus mouse Casp4/11 and zebrafish caspa/caspb, so the phylogenetic assertion adds
      the claim that the role is inherited rather than human-specific.
    supported_by:
    - reference_id: PMID:26375003
      supporting_text: Caspase-1 and caspase-4/5/11 specifically cleaved the linker between the amino-terminal
        gasdermin-N and carboxy-terminal gasdermin-C domains in GSDMD, which was required and sufficient
        for pyroptosis.
    - reference_id: PMID:32109412
      supporting_text: we show site-specific caspase-4/11 autoprocessing, generating a p10 product,
        is required and sufficient for cleaving GSDMD and inducing pyroptosis.
    - reference_id: PMID:34671164
      supporting_text: S. flexneri evaded pyroptosis mediated by caspase-11 or caspase 4 (hereafter
        referred to as caspase-11/4) using a type III secretion system (T3SS) effector, OspC3.
- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Generic apoptosis term inherited from the pan-caspase node and from the 1995 overexpression
      papers; CASP4 does have an apoptotic arm, but it is not what the gene is for.
    action: KEEP_AS_NON_CORE
    reason: Retained but demoted. CASP4 overexpression induced apoptosis in the founding transfection
      studies, it participates in ER-stress apoptosis, and a 2026 study reports that CASP4/5 directly
      cleave and activate the executioner caspases CASP3 and CASP7 - which, if it holds, gives the
      apoptotic arm real mechanistic footing. That claim rests on a single study and is one of the
      points currently in dispute, so it is recorded here rather than promoted to a core function.
    additional_reference_ids:
    - PMID:42044191
    supported_by:
    - reference_id: PMID:42044191
      supporting_text: intracellular LPS and the gram-negative bacterial pathogen Salmonella activate
        CASP4/5 in macrophages to directly cleave and activate CASP3 and CASP7.
    - reference_id: PMID:42044191
      supporting_text: CASP1, CASP4, CASP5 and to a lesser extent, CASP11, processed CASP3C163A and
        CASP7C186A but failed to process the D175A and D198A mutants
    - reference_id: PMID:7743998
      supporting_text: Transfection experiments demonstrate that TX is a protease which is able to
        cleave itself and the p30 ICE precursor, but not to generate mature IL-1 beta from pro-IL-1
        beta.
- term:
    id: GO:0050729
    label: positive regulation of inflammatory response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: CASP4 activation drives release of mature IL-18 and IL-1 family cytokines and downstream
