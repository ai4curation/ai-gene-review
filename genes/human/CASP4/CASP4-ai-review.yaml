core_functions:
- description: Cytosolic pattern receptor for bacterial lipopolysaccharide. The N-terminal CARD of
    CASP4 binds the hydrophobic lipid A moiety of LPS that has entered the host cytoplasm, using
    an acyl-chain-binding pocket formed by CARD helices alpha1, alpha2 and alpha5. Ligand engagement
    folds the otherwise disordered CARD and drives CARD-CARD polymerisation, assembling the non-canonical
    inflammasome and juxtaposing the protease domains for dimerisation and autoprocessing. On intracellular
    bacteria this step depends on guanylate-binding proteins, above all GBP1, which coat and deform
    the LPS-rich outer membrane to expose lipid A; there is an active dispute over whether the physiological
    ligand is best described as an LPS molecule or as an LPS membrane surface of positive curvature.
  molecular_function:
    id: GO:0001530
    label: lipopolysaccharide binding
  directly_involved_in:
  - id: GO:0160075
    label: non-canonical inflammasome complex assembly
  - id: GO:0042742
    label: defense response to bacterium
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0160074
    label: non-canonical inflammasome complex
  supported_by:
  - reference_id: PMID:25119034
    supporting_text: Human caspase-4 and the mouse homologue caspase-11 (hereafter referred to as
      caspase-4/11) and also human caspase-5, directly bound to LPS and lipid A with high specificity
      and affinity.
  - reference_id: PMID:41477831
    supporting_text: Using HDX-MS, we identified a hydrophobic pocket formed by helices α1, α2, and
      α5 in caspase-4/11 CARD that is critical for recognizing the acyl chains of LPS.
  - reference_id: PMID:41702406
    supporting_text: Thus, GBP-mediated deformation of the LPS-rich outer bacterial membrane generates
      regions of positive curvature that expose lipid A, enabling caspase-4 binding, oligomerization,
      and activation.
  knowledge_gaps:
  - gap_statement: It is not established whether the physical entity CASP4 recognises is an individual
      lipopolysaccharide molecule or an LPS-containing membrane surface of positive curvature, and
      consequently which molecular function term describes the recognition event.
    boundary: 'Firmly established: the CARD of CASP4 associates with LPS and with free lipid A with
      high affinity and specificity, an acyl-chain-binding pocket formed by CARD helices alpha1,
      alpha2 and alpha5 is required for that recognition, and engagement drives CARD oligomerisation
      and caspase activation. Not established: whether free, non-aggregated lipid A suffices in cells,
      or whether GBP-generated membrane curvature is an obligatory part of the ligand.'
    gap_kind:
    - BIOLOGY
    - ONTOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: NARROWING
    significance: Determines whether GO:0001530 lipopolysaccharide binding is the right abstraction
      for CASP4's receptor function, or whether a membrane-geometry-sensing molecular function term
      is needed. It also determines how obligatory GBP1 should be treated in causal models of the
      pathway.
    resolution: Binding and oligomerisation measurements against chemically matched lipid A presentations
      of controlled geometry (sub-CMC monomer, planar bilayer, curvature series), plus a GBP1-null
      complementation test with pre-curved synthetic LPS vesicles.
    provenance:
    - reference_id: PMID:41702406
      supporting_text: Fragmented LPS micelles presented additional micelle tips that served as binding
        and activation sites for caspase-4, indicating that caspase-4 engages LPS membranes with
        defined geometry rather than individual LPS molecules.
    - reference_id: PMID:41477831
      supporting_text: How the caspase-4/11 CARDs recognize LPS has remained a long-standing question.
- description: 'Aspartate-specific cysteine endopeptidase of the activated non-canonical inflammasome.
    Following LPS-driven oligomerisation the protease domain dimerises and self-cleaves in the interdomain
    linker at D270 and D289; the autoprocessed p10-containing species is the form that engages substrates.
    CASP4 cleaves gasdermin D between its gasdermin-N and gasdermin-C domains, releasing the pore-forming
    N-terminal fragment that executes pyroptosis, and directly cleaves pro-interleukin-18 at the
    same tetrapeptide site used by caspase-1, yielding mature IL-18 for release through the gasdermin
    D pore. The full substrate repertoire is contested: pro-interleukin-1beta and the executioner
    caspases CASP3 and CASP7 have each been reported as direct substrates, and the share of cellular
    gasdermin D cleavage attributable to CASP4 rather than CASP1 is disputed.'
