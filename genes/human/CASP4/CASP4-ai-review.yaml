suggested_questions:
- question: Is the annotatable ligand of CASP4 a lipopolysaccharide molecule or an LPS membrane surface
    of defined curvature? Direct binding assays and HDX-MS support a lipid A acyl-chain pocket in
    the CARD, while micelle-fragmentation experiments argue that caspase-4 engages membranes with
    geometry rather than individual LPS molecules. If the latter is the operative description, GO
    would need a curvature-sensing molecular-function term rather than GO:0001530.
  experts:
  - Petr Broz
  - Jan Began
  - Jianbin Ruan
  - Feng Shao
- question: Are CASP3 and CASP7 physiological substrates of CASP4, or is their processing during
    non-canonical signalling dominated by other routes in most cell types? A single 2026 study reports
    direct cleavage at D175 and D198 by recombinant CASP4/5; independent replication would be needed
    before curating them as CASP4 substrates.
  experts:
  - Cornelius Y. Taabazuing
  - Mandar Kulkarni
- question: What fraction of gasdermin D cleavage during non-canonical inflammasome signalling is
    carried out by CASP4 itself rather than by CASP1 acting downstream? The answer does not change
    the molecular-function annotation, which rests on reconstitution and structure, but it determines
    how a GO-CAM should wire the pathway.
  experts:
  - Cornelius Y. Taabazuing
  - Feng Shao
  - Judy Lieberman
- question: Does CASP4 directly process pro-interleukin-1beta? UniProt asserts that it does not,
    citing the 1995 characterisations, whereas a 2023 study reports that the D289-autoprocessed p34/p9
    species cleaves pro-IL-1beta independently of the NLRP3 inflammasome.
  experts:
  - Kate Schroder
  - Dave Boucher
- question: Given that human CASP4 matures pro-IL-18 while mouse caspase-11 does not, which mouse
    Casp4/Casp11 phenotypes can legitimately be used to annotate human CASP4, and which should be
    restricted to the shared LPS-sensing and gasdermin D axis?
  experts:
  - Feng Shao
  - Jonathan C. Kagan
  - Pascal Devant
- question: Is there a non-LPS lipid ligand for CASP4? A 2025 report identifies sphingomyelin C12
    as a caspase-4 ligand; if confirmed, the generic lipid binding annotation should be retained
    rather than collapsed into lipopolysaccharide binding.
  experts: []
suggested_experiments:
- hypothesis: CASP4 binding requires lipid A presented on a curved membrane surface, not free LPS
    molecules.
  description: Titrate purified CASP4 (and its isolated CARD) against defined lipid A/LPS presentations
    of matched chemical composition but controlled geometry - monomeric lipid A below the critical
    micelle concentration, planar supported bilayers, and nanodiscs or vesicles of graded diameter
    giving a curvature series - and measure affinity and oligomerisation in parallel by isothermal
    titration calorimetry, mass photometry and native mass spectrometry. A geometry requirement predicts
    binding that tracks curvature at constant lipid A concentration; a molecular-ligand model predicts
    binding to sub-CMC monomeric lipid A.
  experiment_type: Quantitative binding and oligomerisation assays across a defined membrane-curvature
    series
- hypothesis: CASP3 and CASP7 are direct, physiologically relevant CASP4 substrates during cytosolic
    LPS sensing.
  description: In human macrophages (THP-1 and primary monocyte-derived) carrying CASP1, CASP8, CASP9,
    GSDMD and GSDME knockouts, reconstitute CASP4 knockouts with wild-type, catalytically dead (C258A)
    and autoprocessing-defective (D270A/D289A) CASP4, then quantify CASP3 D175 and CASP7 D198 neo-epitope
    cleavage by targeted mass spectrometry with a stable-isotope-labelled standard. Direct, CASP4-dependent
    cleavage should require CASP4 catalytic activity and persist in the CASP1/CASP8/CASP9 triple
    knockout.
  experiment_type: Genetic reconstitution with neo-epitope-resolved quantitative proteomics
- hypothesis: The CASP4-GBP1 requirement can be separated from the CASP4-LPS binding step.
  description: Compare CASP4 activation kinetics in GBP1-null cells challenged with (i) transfected
    free LPS, (ii) cytosolic Gram-negative bacteria, and (iii) synthetic LPS-bearing vesicles of
    defined curvature delivered to the cytosol. If GBP1's only role is to generate curvature, pre-curved
    synthetic vesicles should rescue activation in GBP1-null cells; residual GBP1 dependence would
    indicate an additional scaffolding or recruitment function.
  experiment_type: Genetic complementation with defined synthetic ligand delivery
- hypothesis: Human CASP4 and mouse caspase-11 differ in substrate repertoire in a way that limits
    cross-species annotation transfer.
  description: Side-by-side, activity-normalised in vitro cleavage of a common substrate panel (GSDMD,
    pro-IL-18, pro-IL-1beta, pro-CASP3, pro-CASP7, CGAS) by recombinant human CASP4, human CASP5
    and mouse caspase-11, quantified by densitometry and by kinetic assays on the corresponding tetrapeptide
    substrates, to produce an explicit substrate-specificity matrix that curators can use to decide
    which mouse results may be transferred.
  experiment_type: Comparative enzymology across orthologues and paralogues
