      and D289-in the interdomain linker to acquire full proteolytic activity, cleave GSDMD, and
      induce cell death.
  knowledge_gaps:
  - gap_statement: 'The physiological substrate repertoire of CASP4 is not settled: beyond gasdermin
      D and pro-IL-18 it is undetermined whether CASP3, CASP7 and pro-IL-1beta are genuine in-cell
      substrates, and what share of gasdermin D cleavage during non-canonical signalling CASP4 itself
      performs rather than CASP1.'
    boundary: 'Firmly established: CASP4 is an Asp-specific cysteine endopeptidase that autoprocesses
      at D270/D289 and that cleaves gasdermin D in the interdomain linker and pro-IL-18 at the caspase-1
      tetrapeptide site, both demonstrated by reconstitution and by structures of the substrate complexes.
      Not established: the in-cell flux through each substrate, and whether the additionally reported
      substrates are physiological.'
