existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: Pan-caspase phylogenetic assignment of cytoplasmic residence; CASP4 is a soluble cytoplasmic
      zymogen.
    action: ACCEPT
    reason: Correct. CASP4 is synthesised as a cytosolic pro-enzyme and its LPS-sensing function
      is by definition a cytosolic one. The sibling cytosol annotation (GO:0005829) is the more informative
      of the two.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: Cytosolic localisation, asserted by phylogeny, by UniProt subcellular-location mapping,
      by Reactome and by direct observation.
    action: ACCEPT
    reason: Core location. The non-canonical inflammasome is a cytosolic sensor of LPS that has reached
      the host cytoplasm; the PAINT node PTN008306143 is seeded in part by CASP4's own experimental
      annotation, which is the expected marker of experimental grounding on the target rather than
      circularity.
    supported_by:
    - reference_id: PMID:23661706
      supporting_text: TMEM214 was localized on the outer membrane of the ER and constitutively associated
