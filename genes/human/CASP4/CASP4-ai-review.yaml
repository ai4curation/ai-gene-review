- term:
    id: GO:0160075
    label: non-canonical inflammasome complex assembly
  evidence_type: IDA
  original_reference_id: PMID:26375003
  qualifier: involved_in
  review:
    summary: LPS engagement drives CARD-mediated oligomerisation of CASP4 into the non-canonical
      inflammasome.
    action: ACCEPT
    reason: Core biological process. Oligomerisation on LPS is the activation step itself, and 2026
      structural work shows how it happens - the CARD is disordered until LPS engagement, then folds
      and polymerises into assemblies of eight or more protomers, with heterogeneous LPS:caspase
      stoichiometry.
    additional_reference_ids:
    - PMID:41477831
    - PMID:42546204
    - PMID:41702406
    supported_by:
    - reference_id: PMID:25119034
      supporting_text: Insect-cell purified caspase-4/11 underwent oligomerization upon LPS binding,
        resulting in activation of the caspases.
    - reference_id: PMID:41477831
      supporting_text: caspase-4/11 CARDs are intrinsically unstructured in their resting state and
        adopt an α-helical conformation upon LPS engagement.
    - reference_id: PMID:41702406
      supporting_text: In vitro, GBP1 fragmented LPS micelles and promoted caspase-4/LPS complex
        formation, thereby enhancing LPS-induced caspase-4 activation.
