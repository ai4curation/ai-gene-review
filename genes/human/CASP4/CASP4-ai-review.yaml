    summary: Direct, high-affinity binding of CASP4 to LPS and to its lipid A moiety - the receptor
      function of the non-canonical inflammasome. The abstraction is challenged by 2026 work showing
      the physiological ligand is a curved LPS membrane rather than a free LPS molecule.
    action: ACCEPT
    reason: 'Retained as a core molecular function, with the dispute recorded. The IDAs rest on direct
      binding measurements (Shi et al. 2014) and on the 2023 structural work, and a 2026 HDX-MS study
      localises recognition to a hydrophobic pocket formed by helices α1, α2 and α5 of the CARD that
      engages the acyl chains of LPS - i.e. a genuine chemical interaction between the protein and
      the lipid. Against this, Began et al. 2026 report that caspase-4 binds LPS membranes with positive
      curvature and conclude it engages membranes with defined geometry rather than individual LPS
      molecules, with GBP1 required to generate that geometry on cytosolic bacteria. These are reconcilable
      at the level GO annotates: the same paper still calls lipid A the cognate ligand, and curvature
      governs presentation and avidity rather than the chemistry of recognition. GO has no term for
      binding a lipid surface of defined curvature; proposing one on a single study would be premature,
      so the molecular-binding term is kept and the question is raised in suggested_questions.'
    additional_reference_ids:
    - PMID:41702406
    - PMID:41477831
    - PMID:32510692
    supported_by:
    - reference_id: PMID:25119034
      supporting_text: Human caspase-4 and the mouse homologue caspase-11 (hereafter referred to
        as caspase-4/11) and also human caspase-5, directly bound to LPS and lipid A with high specificity
        and affinity.
    - reference_id: PMID:41477831
      supporting_text: Using HDX-MS, we identified a hydrophobic pocket formed by helices α1, α2,
        and α5 in caspase-4/11 CARD that is critical for recognizing the acyl chains of LPS.
    - reference_id: PMID:41702406
      supporting_text: we investigated how caspase-4 accesses its cognate ligand, the hydrophobic
        lipid A moiety of LPS
    - reference_id: PMID:41702406
      supporting_text: Fragmented LPS micelles presented additional micelle tips that served as binding
        and activation sites for caspase-4, indicating that caspase-4 engages LPS membranes with
        defined geometry rather than individual LPS molecules.
