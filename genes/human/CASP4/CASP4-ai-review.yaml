- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:22246630
  qualifier: located_in
  review:
    summary: CASP4 is released into the extracellular space by UVB-irradiated keratinocytes; a real
      but peripheral localisation.
    action: KEEP_AS_NON_CORE
    reason: 'Grounded rather than spurious: UniProt records release into the extracellular milieu
      by keratinocytes after UVB, from the same study that supports the experimental annotation.
      It is a consequence of unconventional secretion / pyroptotic release, not a site of CASP4 activity,
      so it is kept out of the core set.'
