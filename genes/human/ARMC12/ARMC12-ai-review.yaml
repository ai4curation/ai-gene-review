id: Q5T9G4
gene_symbol: ARMC12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARMC12 is an armadillo-repeat protein expressed in the midpiece of elongating spermatids.
  It is a peripheral mitochondrial outer-membrane protein that links adjacent mitochondria by binding
  VDAC2 and VDAC3, which requires TBC1D21; it also binds MIC60 and GK2. It is required for mitochondrial
  elongation and coiling during assembly of the sperm mitochondrial sheath. Armc12-null male mice are
  sterile, and men with biallelic ARMC12 loss have asthenozoospermia with absent mitochondrial sheath
  and other midpiece defects. In neuroblastoma cells ARMC12 is nuclear, binds RBBP4 and promotes PRC2
  activity and tumour growth.
