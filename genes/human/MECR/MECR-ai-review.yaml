      rather than removed or promoted.
    supported_by:
    - reference_id: PMID:37653044
      supporting_text: >-
        In summary, we observe a significant increase of ceramides upon loss of mecr/MECR in fly mutants
        and human patient cells, suggesting a conserved role for this protein in ceramide metabolism.
    - reference_id: PMID:37653044
      supporting_text: >-
        Reducing the levels of either iron or ceramide suppresses the neurodegenerative phenotypes, indicating
        an interplay between ceramide and iron metabolism.
