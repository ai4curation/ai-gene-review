functional_isoforms:
- id: MECR_CYTOSOLIC
  name: cMECR (cytosolic/nuclear variant)
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - UniProtKB:Q9BV79-2
  description: >-
    A splice variant in which an extra exon between exons 1 and 2 replaces the N-terminal region carrying
    the mitochondrial targeting peptide, so the protein is not imported into mitochondria and distributes
    through cytoplasm and nucleus. In that location it binds PPARA directly and increases PPARA-dependent
    transcription, which is how the old "nuclear receptor binding factor 1" (NRBF-1) identification of
    MECR can be reconciled with the mitochondrial localization of the canonical enzyme. Identified and
    characterized in rat tissues and in HeLa cells; no catalytic role in mtFAS is claimed for it, and
    the cytoplasm and nucleus rows of this review belong to it rather than to the matrix enzyme.
  isoform_specific_terms:
