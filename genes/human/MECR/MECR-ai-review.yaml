id: Q9BV79
gene_symbol: MECR
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MECR is the NADPH-dependent trans-2-enoyl thioester reductase of the mitochondrial type II fatty-acid
  synthesis pathway (mtFAS), the mammalian orthologue of yeast Etr1/Mrf1'. Imported into the mitochondrial
  matrix, it catalyses the fourth and last reaction of each mtFAS elongation cycle, reducing the trans-2
  double bond of a medium-chain enoyl thioester to the saturated acyl chain; the physiological carrier
  is the mitochondrial acyl carrier protein, although the purified enzyme also accepts CoA thioesters
  in vitro and prefers medium-chain over short- and long-chain substrates. Its products feed the acyl-ACP
  pool that supplies the octanoyl precursor of lipoic acid and the longer acyl-ACPs required for mitochondrial
  Fe-S cluster assembly, so loss of the enzyme lowers protein lipoylation, impairs respiration, raises
  cellular iron and ceramide, and in humans causes a recessive childhood-onset dystonia with optic atrophy
  and basal ganglia changes (MEPAN syndrome). A minor splice variant lacking the N-terminal targeting
  peptide is instead cytosolic and nuclear and binds the transcription factor PPARA.
