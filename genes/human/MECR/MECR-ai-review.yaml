- id: PMID:12654921
  title: >-
    Characterization of 2-enoyl thioester reductase from mammals. An ortholog of YBR026p/MRF1'p of the
    yeast mitochondrial fatty acid synthesis type II.
  findings:
  - statement: >-
      The recombinant mammalian enzyme reduces trans-2-enoyl thioesters of C6-C16 with NADPH, preferring
      medium chains.
    supporting_text: >-
      Recombinant HsNrbf-1p reduces trans-2-enoyl-CoA to acyl-CoA with chain length from C6 to C16 in
      an NADPH-dependent manner with preference to medium chain length substrate.
    reference_section_type: ABSTRACT
  - statement: >-
      The protein is mitochondrial, by GFP colocalization and by immunoisolation from bovine heart mitochondria.
    supporting_text: Wild-type polypeptide was immunoisolated from the extract of bovine heart mitochondria.
    reference_section_type: ABSTRACT
  - statement: >-
      The human protein restores respiratory growth to the yeast ybr026c (ETR1) deletion, placing it in
      the mitochondrial FAS II pathway.
    supporting_text: >-
      Furthermore, expression of HsNRBF-1 in the ybr026cDelta yeast strain restored mitochondrial respiratory
      function allowing growth on glycerol.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary characterization of mammalian MECR/Nrbf-1 (Miinalainen et al., J Biol Chem
      2003), cited by UniProt for this entry's function and location. Cached entry is abstract-only; all
      quotes are from the abstract.
- id: PMID:27817865
  title: >-
    MECR Mutations Cause Childhood-Onset Dystonia and Optic Atrophy, a Mitochondrial Fatty Acid Synthesis
    Disorder.
  findings:
  - statement: >-
      Recessive MECR mutations in seven individuals cause a neurometabolic disorder of mitochondrial fatty
      acid synthesis, with reduced lipoylation and defective respiration in patient fibroblasts.
    supporting_text: >-
      All affected individuals were found to harbor recessive mutations in MECR encoding the mitochondrial
      trans-2-enoyl-coenzyme A-reductase involved in human mtFAS.
    reference_section_type: ABSTRACT
  - statement: >-
      mtFAS is required for respiratory-chain function and for several mitochondrial enzyme complexes.
    supporting_text: >-
      Mitochondrial fatty acid synthesis (mtFAS) is an evolutionarily conserved pathway essential for
      the function of the respiratory chain and several mitochondrial enzyme complexes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified clinical and functional genetics paper (Heimer et al., Am J Hum Genet 2016); the
      source of the IMP row. Cached entry is abstract-only; quotes are from the abstract.
