- id: PMID:37653044
  title: >-
    A defect in mitochondrial fatty acid synthesis impairs iron metabolism and causes elevated ceramide
    levels.
  findings:
  - statement: >-
      Loss of the fly orthologue impairs Fe-S cluster biogenesis and raises iron, which raises ceramide;
      reducing either rescues neurodegeneration.
    supporting_text: >-
      We observe a defect in Fe-S cluster biogenesis and increased iron levels in flies lacking mecr,
