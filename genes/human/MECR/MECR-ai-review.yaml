  qualifier: acts_upstream_of
  review:
    summary: >-
      Ceramide accumulation is a downstream consequence of mtFAS loss, mediated by iron; MECR catalyses
      no step of ceramide synthesis.
    action: KEEP_AS_NON_CORE
    reason: >-
      The genetic evidence is solid in both fly mutants and patient fibroblasts, and lowering iron or
      ceramide rescues the neurodegeneration, but the paper's own model places ceramide downstream of
      impaired Fe-S cluster biogenesis and raised iron, so MECR is not a participant in ceramide biosynthesis.
