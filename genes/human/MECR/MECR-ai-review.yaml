core_functions:
- description: >-
    NADPH-dependent reduction of the trans-2 double bond of a medium-chain enoyl-ACP thioester to the
    saturated acyl-ACP, the last of the four reactions of each elongation cycle of mitochondrial type
    II fatty-acid synthesis.
  molecular_function:
    id: GO:0141148
    label: enoyl-[acyl-carrier-protein] reductase (NADPH) activity
  directly_involved_in:
  - id: GO:0006633
    label: fatty acid biosynthetic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:12654921
    supporting_text: >-
      Recombinant HsNrbf-1p reduces trans-2-enoyl-CoA to acyl-CoA with chain length from C6 to C16 in
      an NADPH-dependent manner with preference to medium chain length substrate.
  - reference_id: file:human/MECR/MECR-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Catalyzes the NADPH-dependent reduction of trans-2-enoyl
suggested_questions:
- question: >-
    Does the chain-length preference of MECR for medium-chain substrates set the chain length of the mtFAS
    product pool, or is termination determined by the condensing enzyme OXSM?
- question: >-
    Is the cytosolic cMECR variant expressed at functionally relevant levels in human tissues, and does
    it affect PPARA-dependent transcription in vivo?
suggested_experiments:
- description: >-
    Quantify acyl-ACP species by chain length in MECR-deficient and rescued human cells, and test whether
    supplying specific acyl chains restores aconitase activity and protein lipoylation, to separate the
    Fe-S and lipoylation branches downstream of the reductase.
knowledge_gaps:
- gap_statement: >-
    Which acyl-ACP chain lengths made by mtFAS are the functionally important products in human mitochondria,
    beyond the octanoyl precursor of lipoic acid, is not established; the Fe-S cluster phenotype points
    to longer C14-C18 acyl-ACPs, but the chain-length requirement has not been measured directly.
  boundary: >-
    This review stops at the reductase reaction. Lipoyl transfer is modelled in endogenous_protein_lipoylation
    and Fe-S cluster assembly is a separate pathway.
  gap_kind:
  - BIOLOGY
