  review:
    summary: >-
      New annotation proposed. The paralogue-discriminating counterpart of the adipogenic
      row - AFF4 promotes osteogenic differentiation of human MSCs while AFF1 restrains it
      - tested in human cells and in vivo.
    action: NEW
    reason: >-
      Added after review, together with the reference itself, because the description
      asserted an osteogenic role whose only source in this PR was the provider record.
      Reading the paper made the case stronger than expected rather than weaker: siRNA
      depletion of AFF4 in human MSCs inhibits osteogenic potential (requirement),
      overexpression enhances it, and the two are confirmed in vivo by MSC-mediated bone
      formation, so this is not an in vitro-only result. It is also the cleanest
      demonstration anywhere that AFF4 and AFF1 are not interchangeable: depleting AFF1
      increases alkaline phosphatase activity and mineralisation while depleting AFF4 does
      the opposite, which is the differentiation counterpart of the elongation antagonism
      reported in PMID:37528066, and the concurrent AFF1 review independently records
      GO:0045668 for that gene. The mechanism is mapped as well as the phenotype: AFF4
      depletion lowers ID1 mRNA and protein, overexpression raises it, AFF4 is enriched at
      the ID1 promoter by ChIP, and AFF4 depletion restricts BMP2-induced BRE-luciferase
      responses, SP7 induction and ALP activity - so the osteogenic arm runs through
      BMP-pathway control of ID1, the counterpart of the ATG5/ATG16L1 route in the
      adipogenic row. The paper's 2020 erratum, PMID:32257529, was read rather than
      treated as an unknown, and it does not touch this row: it corrects the second lane
      label of Fig. 7b, which should read siAFF4, and replaces misused alpha-tubulin
      images in Figs. 6b and 7b, with the authors stating it does not affect any of their
      original conclusions. Both panels are protein blots in the mechanism figures - the
      AFF1-to-DKK1 western and the AFF4-to-ID1 western - and neither is among the
      differentiation or bone-formation assays quoted below.
