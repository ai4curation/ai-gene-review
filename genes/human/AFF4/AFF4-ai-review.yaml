    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    supported_by:
    - reference_id: PMID:23471103
      supporting_text: AFF4 meanders over the surface of the P-TEFb cyclin T1 (CycT1)
        subunit but makes no stable contacts with the CDK9 kinase subunit. Interface
        mutations reduced CycT1 binding and AFF4-dependent transcription.
    - reference_id: PMID:20471948
      supporting_text: Without Tat, AFF4 can mediate the ELL2-P-TEFb interaction, albeit
        inefficiently.
    - reference_id: file:human/AFF4/AFF4-bioinformatics/RESULTS.md
      supporting_text: '| CDK9 (P50750) | 0 | - |'
