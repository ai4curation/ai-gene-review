- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20153263
  qualifier: enables
  supporting_entities:
  - UniProtKB:O60563
  extensions:
  - predicate: RO:0002233
    term:
      id: UniProtKB:O60563
      label: CCNT1 (cyclin T1, the non-catalytic subunit of P-TEFb)
  review:
    summary: >-
      Modified to protein-macromolecule adaptor activity. The cyclin T1 interaction
      is one of the two arms of the bridge AFF4 forms, it is resolved crystallographically,
      and its interface mutants reduce transcription.
    action: MODIFY
    reason: >-
      Bare protein binding says nothing, and this partner is real: 8 IntAct records
      across four independent publications at MI-score 0.81, and the reference behind
      this row is a directed biochemical study annotating only 6 entities rather than
      a screen. The informative replacement is adaptor activity rather than a binding
      term, for two measured reasons. First, GO:0030332 cyclin binding cannot be used
      for cyclin T1: its definition specifies cyclins whose levels rise until mitosis
      and then fall abruptly, which is not a transcriptional cyclin, and usage agrees
      - CDK9, HEXIM1 and BRD4, the three canonical cyclin T1 binders, carry zero GO:0030332
      annotations each, while the cell-cycle kinase CDK2 carries five as a positive
      control. Second, what AFF4 does with this site is bridge: it holds cyclin T1 through
      an N-terminal segment resolved in PDB 4IMY and ELL2 through a separate central
      segment resolved in PDB 5JW9, and it can mediate the ELL2-P-TEFb interaction with
      no other factor present. Note this is a change of kind rather than a specialisation
      - GO:0030674's ancestor closure was fetched and does not contain GO:0005515 - and
      it is the replacement CLAUDE.md's curation guidance names for an adapter function. The replacement term is licensed by this gene's aggregate evidence rather than by this row's own reference alone, and this is the row that sets that out for the other eight: a row's reference establishes an interaction, whereas the two separately crystallised sites - cyclin T1 at residues 2-73 and ELL2 at 301-351 - together with the demonstration that AFF4 mediates the ELL2-P-TEFb interaction with no other factor present are what establish that each interaction is one arm of a bridge.
