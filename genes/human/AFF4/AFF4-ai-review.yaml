  review:
    summary: >-
      New annotation proposed. The best-evidenced endogenous human process this gene has,
      shown by requirement and by sufficiency and confirmed in vivo, and GOA carries no
      row from the paper at all.
    action: NEW
    reason: >-
      Added after review, which correctly pointed out that this review proposed a row for
      a viral hijack it calls non-core while leaving the best-evidenced endogenous process
      to a curation request. The evidence is unusually complete for this gene: knockdown
      in human mesenchymal stem cells and in mouse 3T3-L1 preadipocytes inhibits adipogenic
      differentiation, which is a requirement result; overexpression enhances adipogenesis
      and produces ectopic adipose tissue, which is a sufficiency result; and an
      adipose-specific Aff4 knockout mouse impedes adipocyte development, which tests it
      in vivo. Both directions are named because GO's evidence codes do not distinguish
      them. The mechanism is also mapped - AFF4 binds and transcriptionally activates ATG5
      and ATG16L1, and depleting either abrogates adipogenesis in AFF4-overexpressing
      cells - so this is not a bare phenotype. The evidence code is IMP because the human
      arm is siRNA knockdown; the mouse knockout corroborates in another species rather
      than supplying the human annotation.
