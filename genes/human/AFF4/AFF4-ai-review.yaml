- term:
    id: GO:0016604
    label: nuclear body
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: >-
      Kept as non-core. An additional HPA location, and independently corroborated -
      AFF4 forms nuclear puncta with FUS - but not where the elongation function is
      executed.
    action: KEEP_AS_NON_CORE
    reason: >-
      HPA grades nuclear bodies as an additional location rather than the main one,
      and there is independent support for it: live-cell imaging shows FUS co-localising
      with AFF4 in nuclear puncta, which are disrupted by aliphatic alcohol treatment.
      So this row is corroborated rather than doubtful, which is worth stating because
      it distinguishes it from the fibrillar-centre row, where no literature exists.
