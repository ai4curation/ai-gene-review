description: 'AFF4 is the central scaffold of the super elongation complex (SEC), the
  metazoan assembly that releases promoter-proximally paused RNA polymerase II into
  productive elongation. Most of the 1163-residue protein is intrinsically disordered
  and carries short, separately mapped interaction motifs along its length: an N-terminal
  segment binds the cyclin T1 subunit of P-TEFb without contacting the CDK9 kinase,
  a central 50-residue "ELLBow" binds the C-terminal domain of ELL2, and further motifs
  recruit the ENL/AF9 proteins. Because these sites are non-overlapping, AFF4 can hold
  P-TEFb and an ELL-family elongation factor on the same polymerase, and it does so
  without any additional partner; this bridging is the molecular activity of the protein
  itself, whereas the resulting stimulation of elongation is an activity of the assembled
  complex. Its one folded module, the C-terminal homology domain, mediates AFF4 homodimerisation
  and AFF1-AFF4 heterodimerisation and carries a surface loop phosphorylated by CDK9.
  AFF4 acts in the nucleus on transcriptionally active euchromatin, and its loss slows
  elongation, deepens promoter-proximal pausing and lowers Ser2-phosphorylated polymerase
  II genome-wide. It is required for Sertoli-cell-dependent spermiogenesis, and it
  promotes both adipogenic and osteogenic differentiation of mesenchymal stem cells -
  the latter in the opposite direction to its paralogue AFF1. It is the shared partner
  of MLL/KMT2A fusion oncoproteins, and is hijacked by the HIV-1 Tat protein, which folds onto the
  same cyclin T1 surface to build a Tat-AFF4-P-TEFb complex that transactivates the
  viral promoter. Missense substitutions in its ALF homology domain that make the protein
  resistant to SIAH1-directed proteasomal degradation cause CHOPS syndrome, a gain-of-function
  developmental disorder.'
