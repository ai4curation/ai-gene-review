proposed_new_terms:
- proposed_name: transcriptional cyclin binding
  proposed_definition: Binding to a cyclin that partners a transcriptional cyclin-dependent
    kinase and whose abundance does not oscillate with the cell cycle, such as cyclin
    T1, cyclin T2, cyclin K or cyclin H.
  proposed_parent:
    id: GO:0005515
    label: protein binding
  justification: >-
    GO has no term for binding a transcriptional cyclin, and the existing cyclin-binding
    term cannot be stretched to cover one. GO:0030332 cyclin binding is defined for
    cyclins whose levels rise steadily until mitosis and then fall abruptly to zero,
    which is a cell-cycle differentia that cyclin T1 does not satisfy. Usage confirms
    that curators have respected this rather than stretching the term: CDK9, HEXIM1
    and BRD4, the three canonical cyclin T1 binders, carry zero GO:0030332 annotations
    each, measured against the cell-cycle kinase CDK2 as a positive control, which carries
    five. The consequence is that the best-characterised molecular interaction of AFF4
    - a crystallographically resolved, mutationally validated contact with cyclin T1
    whose interface mutants reduce transcription - cannot be expressed in GO except as
    bare protein binding or as the more abstract adaptor activity used in this review.
    The same gap affects HEXIM1, BRD4, CDK9, the AFF1 paralogue and the HIV-1 Tat literature
    generally.
  supported_by:
  - reference_id: PMID:23471103
    supporting_text: AFF4 meanders over the surface of the P-TEFb cyclin T1 (CycT1)
      subunit but makes no stable contacts with the CDK9 kinase subunit. Interface mutations
      reduced CycT1 binding and AFF4-dependent transcription.
  - reference_id: file:human/AFF4/AFF4-bioinformatics/RESULTS.md
    supporting_text: '| BRD4 (O60885) | 0 | - |'
suggested_questions:
- question: >-
    Almost none of the AFF4 functional literature has reached GO. Of twenty papers that
    establish something about human AFF4, fifteen have produced no GO annotation anywhere
    in GOA and eighteen have produced none on AFF4 itself; as a result AFF4 has no experimental
    biological-process annotation at all, and its only experimental molecular-function
    rows are six bare protein-binding IPI rows. The sharpest instance is PMID:20159561,
    which is titled for AFF4 and states that AFF4 is required for super elongation complex
    stability, and whose single annotation anywhere in GOA is GO:0032783 IDA on AFF1.
    Would GO Central consider a targeted curation pass over PMID:20159561, PMID:20471948,
    PMID:22483617, PMID:23471103, PMID:24843025, PMID:28134250, PMID:31147444, PMID:32128251,
    PMID:36149892, PMID:37528066 and PMID:37609817?
  experts:
  - GO Central
  - UniProt curators
- question: >-
    AFF4 has no protein-binding annotation for ELL2, although PMID:28134250 reports
    a 2.0 A co-crystal of the ELL2 C-terminal domain with a 50-residue AFF4 site and
    UniProt states that the interaction is direct. Every one of AFF4's IntAct AFF4-ELL2
    records is spoke-expanded from co-immunoprecipitation of the complex, and every one
    of the nine partners GOA does export as GO:0005515 has at least one non-spoke-expanded
    record - so being spoke-expanded-only is sufficient to account for this particular
    absence. It is deliberately not claimed to be the whole export rule: seven further
    partners do have non-spoke-expanded records and are also absent from GOA, so some
    additional filter operates that this review did not identify. Either way the
    actionable gap is the same: the one paper that measured a binary AFF4-ELL2 interaction
    and crystallised it has never been curated. Should PMID:28134250 be curated to IntAct
    as a binary interaction, or annotated directly as IPI or IDA?
  experts:
  - IntAct curators
  - GO Central
- question: >-
    The PANTHER node PTN000829417 assigns GO:0032783 super elongation complex uniformly
    to all 79 of its recipients, which includes AFF2 and AFF3. Neither has been shown
    to be a subunit of that complex - AFF2's only experimental molecular function is
    G-quadruplex RNA binding and AFF3's is DNA-binding transcription factor activity
    - whereas AFF1 and AFF4 have. The term's definition does admit an AFF family protein
    or distant relative, so the propagation is defensible rather than plainly wrong.
    Should the complex-membership term be restricted to a node covering the AFF1/AFF4
    clade, leaving the other family-level terms where they are?
  experts:
  - PAINT curators
  - GO Central
- question: >-
    Human AFF4's five phylogenetic annotations name no AFF4 orthologue among their seeds
    - they are seeded by Drosophila lilli, human AFF1 and mouse Aff1, Aff2 and Aff3
    - even though mouse Aff4 is a co-recipient of the same node and carries its own
    experimental annotations. Is that a deliberate consequence of how IBD seeds are
    selected, or would mouse Aff4's own annotations qualify it as a seed?
  experts:
  - PAINT curators
- question: >-
    Ensembl Compara projected rat Aff4's GO:0034976 IEP onto human AFF4, but did not
    project mouse Aff4's GO:0007286 spermatid development IMP, which is a much stronger
    annotation from a knockout. The mouse row carries acts_upstream_of_or_within rather
    than involved_in, which is a plausible technical reason. Is qualifier-based filtering
    the explanation, and if so, should an IEP donor annotation be eligible for projection
    when a knockout-based IMP is not?
  experts:
  - Ensembl Compara maintainers
  - GOA
- question: >-
    GO:0030332 cyclin binding is defined for cyclins whose abundance oscillates with
    the cell cycle, so it cannot be used for the transcriptional cyclins, and usage
    shows curators have not stretched it - CDK9, HEXIM1 and BRD4 carry no GO:0030332
    annotation while CDK2 carries five. Should the definition be broadened, or a sibling
    term for transcriptional cyclin binding be created? A large literature on P-TEFb,
    7SK and HIV-1 Tat currently has no way to express its central interaction.
  experts:
  - GO ontology editors
- question: >-
    Is there any AFF4-specific evidence for the euchromatin location in human cells?
    Both GOA rows are transfers from mouse Aff4, and UniProt's note that AFF4 associates
    with transcriptionally active chromatin but not at snRNA genes is itself tagged as
    a by-similarity inference from the same mouse entry - so the human statement rests
    entirely on the mouse experiment.
  experts:
  - UniProt curators
- question: >-
    Does the fibrillar-centre localisation reported by immunofluorescence correspond
    to any function? AFF4 acts on RNA polymerase II, and the fibrillar centre is the
    polymerase I transcription zone; no AFF4 role in ribosomal RNA transcription has
    been reported. The annotation is kept as an observation but is not treated as core
    in this review.
  experts:
  - Human Protein Atlas
  - GO Central
suggested_experiments:
- hypothesis: AFF4's adaptor activity - simultaneous engagement of P-TEFb and an ELL-family
    factor - is separable from its dimerisation and from its recruitment to chromatin,
    and only the adaptor function is required for pause release.
  description: Reconstitute pause release in vitro with purified polymerase II, DSIF,
    NELF, P-TEFb and ELL2, and titrate wild-type AFF4 against three separation-of-function
    mutants - a cyclin T1 interface mutant from PDB 4IMY, the 301-400 deletion that
    abolishes ELL2 binding, and the F1014A dimerisation mutant. Read out Ser2 phosphorylation
    and run-off transcript length. The prediction that distinguishes the adaptor model
    from a dose model is that the two interface mutants fail while the dimerisation
    mutant does not.
  experiment_type: in vitro reconstitution
- hypothesis: The CHOPS syndrome variants change AFF4 abundance and nothing else about
    the protein's molecular behaviour.
  description: Compare wild-type AFF4 with the T254A, T254S and R258W variants expressed
    from a single genomic locus at matched protein levels, using a degron or an inducible
    promoter to hold abundance equal, and measure complex composition by quantitative
    proteomics, chromatin occupancy by ChIP-seq, and elongation rate by PRO-seq. If
    the mechanism is purely dose, all three variants should be indistinguishable from
    wild type once abundance is equalised; any residual difference would indicate that
    the ALF homology domain does something beyond presenting the SIAH1 degron.
  experiment_type: dose-controlled variant comparison
- hypothesis: AFF4 and AFF1 build complexes with distinct ELL-family and ENL-family
    occupancy, which is why their loss produces opposite elongation phenotypes.
  description: Purify the super elongation complex from cells in which either AFF1 or
    AFF4 is the only AFF scaffold present, and quantify ELL, ELL2, ELL3, MLLT1 and MLLT3
    stoichiometry by absolute quantitative mass spectrometry. Pair this with ChIP-seq
    of each subunit in each background to test whether the upstream-versus-downstream
    distribution difference reflects a compositional difference or only a positional
    one.
  experiment_type: quantitative proteomics of purified complexes
- hypothesis: The AFF4 C-terminal homology domain binds nucleic acid in cells, not only
    in vitro.
  description: The domain's RNA and DNA binding was suggested by fluorescence anisotropy
    with purified protein, which is why no nucleic-acid-binding annotation is proposed
    in this review. Test it in cells by CLIP and by ChIP-exo using a separation-of-function
    domain mutant that retains dimerisation, and ask whether any recovered signal is
    independent of the polymerase II machinery AFF4 travels with.
  experiment_type: in-cell nucleic acid crosslinking
knowledge_gaps:
- gap_statement: AFF4 has no experimental biological-process annotation in GO, and no
    experimental molecular-function annotation other than bare protein binding, despite
    being the structurally best-characterised subunit of the super elongation complex.
  boundary: What is known is extensive - nine PDB entries covering three separate interaction
    surfaces, interface and dimerisation mutants, and genome-wide knockdown phenotypes.
    What is missing is the curation, not the biology.
  gap_kind:
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: NARROWING
  significance: An unannotated gene looks uncharacterised to any downstream analysis
    that reads GO rather than the literature, and this gene is a drug target of interest
    in both leukaemia and HIV latency.
  resolution: Eight NEW rows are proposed here for the part of the gap that current GO
    terms can express; the rest needs a curation pass over the eleven references named
    in the first suggested question.
  provenance:
  - reference_id: file:human/AFF4/AFF4-bioinformatics/RESULTS.md
    supporting_text: '| PMID:20159561 | AFF4 is a component of SEC; AFF4 required for SEC stability; knockdown lowers MLL-chimera target genes | 1 | 1 | **False** |'
- gap_statement: Whether AFF4's stimulation of polymerase II elongation requires anything
    beyond holding P-TEFb and an ELL-family factor in proximity is not known.
  boundary: The two binding sites are mapped to residue level and their mutants reduce
    transcription, and CDK9 phosphorylates a loop of the C-terminal domain; but no experiment
    separates a pure proximity effect from an allosteric one.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: It determines whether the adaptor activity annotated here is the whole
    molecular function or only part of it.
  provenance:
  - reference_id: PMID:20471948
    supporting_text: Without Tat, AFF4 can mediate the ELL2-P-TEFb interaction, albeit
      inefficiently.
- gap_statement: The human euchromatin localisation of AFF4 has no human experiment
    behind it.
  boundary: Mouse Aff4 holds the term by IDA and both human rows are transfers from
    it; UniProt's associated note is itself a by-similarity inference from the same
    mouse entry. Human AFF4 chromatin occupancy has been mapped by ChIP-seq, which supports
    chromosome and chromatin but not specifically the euchromatin subclass.
  gap_kind:
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: Small, but it is the location on which the functional interpretation
    of every other row depends.
