existing_annotations:
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0041111
  - MGI:MGI:106927
  - MGI:MGI:1100819
  - PANTHER:PTN000829417
  - UniProtKB:P51825
  review:
    summary: >-
      Accepted. The family-level statement of AFF4's core activity, and the best-supported
      of the five IBA rows: three of its four protein donors hold their own experimental
      annotation to this term or a descendant.
    action: ACCEPT
    reason: >-
      Every protein donor in the WITH/FROM field was resolved and queried for its own
      evidence, so the usual "the donors only carry the same family-level inference"
      objection is testable here and is false. Drosophila lilli (FB:FBgn0041111 = Q9VQI9,
      Swiss-Prot) holds GO:0006355 by IMP; mouse Aff3 (MGI:MGI:106927 = P51827) holds
      it by both IDA and IMP; human AFF1 (UniProtKB:P51825) holds the descendants GO:0032786
      and GO:0032968 by IMP. The remaining token is the PANTHER tree node, which is
      the inference structure rather than an evidence source. AFF4's own human data
      agree independently, and support a more specific child, GO:0032968, which is proposed
      as a separate NEW row rather than by modifying this one - the node covering AFF4
      is the whole AF4/FMR2 family and is functionally heterogeneous (AFF2's only experimental
      molecular function is G-quadruplex RNA binding, AFF3's is DNA-binding transcription
      factor activity), so a general term is the correct least common ancestor for the
      node and an IBA should not be made more precise than the inference that produced
      it.
    supported_by:
    - reference_id: PMID:37609817
      supporting_text: we found that AFF4 knockdown by RNA interference in human HEL
        cells decreased not only cellular level but also global chromatin occupancy
        of CTD serine 2 phosphorylated Pol II
    - reference_id: file:human/AFF4/AFF4-bioinformatics/RESULTS.md
      supporting_text: '| `FB:FBgn0041111` | protein | Q9VQI9 | AFFL_DROME (lilli) | Swiss-Prot | Drosophila melanogaster | 1673 | 3 |'
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000829417
        source_label: PANTHER tree node covering the AF4/FMR2 family
        source_status: SUPPORTS_TRANSFER
        comment: A tree node, not a protein. It carries 395 annotations over 79 recipient
          gene products and assigns all five of its terms uniformly to all of them.
