core_functions:
- description: Central scaffold of the super elongation complex. AFF4 uses separate,
    separately crystallised sites on its intrinsically disordered axis to hold cyclin
    T1 of P-TEFb and the C-terminal domain of ELL2 at the same time, and can bring those
    two elongation factors together with no other protein present. Assembled into the
    complex, it contributes to the stimulation of RNA polymerase II elongation and to
    the release of promoter-proximally paused polymerase; the bridging is AFF4's own
    activity, the stimulation is the complex's.
