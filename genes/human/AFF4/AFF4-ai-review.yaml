- term:
    id: GO:0006354
    label: DNA-templated transcription elongation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000829417
  - UniProtKB:P51825
  review:
    summary: >-
      Accepted at the polymerase-agnostic level the family inference supports, with
      the polymerase II-specific child proposed separately on AFF4's own human evidence.
    action: ACCEPT
    reason: >-
      The one protein donor, human AFF1, holds this exact term by EXP (PMID:22547686),
      so the chain contains real experimental evidence. Everything known about AFF4
      itself is polymerase II-specific - P-TEFb phosphorylates the polymerase II CTD,
      the super elongation complex is defined as acting on polymerase II, and AFF4 depletion
      changes Ser2-phosphorylated polymerase II and polymerase II pausing - so GO:0006368
      transcription elongation by RNA polymerase II is the right term for the gene. It
      was confirmed by fetching the ancestor closure that GO:0006368 is a descendant
      of GO:0006354, so this is a specificity relationship and not a sideways move. It
      is proposed as a NEW row rather than as a MODIFY of this one, and the reason is
      specific to AFF4 rather than general. The WITH/FROM field on this row is
      byte-identical on AFF4 and on AFF1 - PANTHER:PTN000829417 plus UniProtKB:P51825 -
      but on AFF1 that makes it SELF-REFERENTIAL, so it records a PAINT curator judging
      the function core for AFF1 itself, whereas on AFF4 the only protein named is a
      PARALOGUE. A paralogue-derived inference does not carry AFF4 down to the polymerase,
      so the specific term is put on a row bearing AFF4's own evidence code instead of
      being folded into the phylogenetic row. That self-referential-versus-paralogue-derived
      distinction is checkable from the WITH/FROM column of this gene's own committed GOA
      table and from AFF1's, and it is what the verdict rests on. Recorded as a
      cross-reference rather than as evidence: the concurrent AFF1 review, PR #2348, reaches
      MODIFY on the same term for this reason inverted, and the divergence is deliberate;
      the net GO content is the same either way, since GO:0006368 is added here as a NEW
      row. This term is therefore a verified ancestor of one that core_functions already
      records, and is not restated there. One caveat that argues the other way and is
      recorded rather than suppressed: the same node hands GO:0032783 to all 79 of its
      recipients, and that term's definition is explicitly about RNA polymerase II, so
      the node is not in fact behaving as though its clade were polymerase-agnostic. That
      is an internal inconsistency in the node's own assignments, and it is filed as a
      PAINT question rather than used to justify further precision here - because this
      review separately questions whether that complex term should reach AFF2 and AFF3 at
      all, and it would be circular to lean on an assignment it doubts.
    supported_by:
    - reference_id: PMID:37528066
      supporting_text: disruption of AFF4 results in slow elongation and early termination
        in a subset of AFF4-bound active genes, whereas AFF1 deletion leads to fast
        elongation and transcriptional readthrough in the same subset of genes
    - reference_id: file:human/AFF4/AFF4-bioinformatics/RESULTS.md
      supporting_text: '| Pol II elongation is_a DNA-templated elongation | GO:0006368 | GO:0006354 | True | True |'
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000829417
        source_label: PANTHER tree node covering the AF4/FMR2 family
        source_status: SUPPORTS_TRANSFER
        comment: A tree node, not a protein.
      - source_id: UniProtKB:P51825
        source_label: human AFF1
        source_status: SUPPORTS_TRANSFER
        comment: Holds GO:0006354 by its own EXP annotation (PMID:22547686).
