- description: Positive regulator of mesenchymal differentiation programmes. In human
    mesenchymal stem cells AFF4 is required for both adipogenic and osteogenic
    differentiation and its overexpression enhances both, with the adipogenic arm confirmed
    by an adipose-specific knockout mouse and the osteogenic arm by MSC-mediated bone
    formation in vivo. Both arms have a mapped mechanism. The adipogenic one runs through
    direct transcriptional activation of the autophagy genes ATG5 and ATG16L1, and the
    osteogenic one through BMP-pathway control of ID1 - AFF4 is enriched at the ID1
    promoter by ChIP, its depletion lowers ID1 message and protein, and its depletion
    restricts BMP2-induced BRE-luciferase, SP7 and ALP responses. These are the
    best-evidenced endogenous processes the gene has. That alone would be an evidence
    argument rather than a core-ness one, so the core-ness claim is separate and narrower.
    These are the only contexts in which the scaffold's target SELECTIVITY has been
    measured rather than assumed. AFF4 and AFF1 occupy the same position in the same
    complex, yet depleting AFF1 has the opposite effect on osteogenesis, so these
    programmes are where the gene does something its paralogue does not - which is a
    property of the scaffold, not incidental pleiotropy in a ubiquitously expressed
    protein. Recorded rather than left as an asymmetry, the Sertoli-cell spermiogenesis
    requirement is deliberately NOT here, because it rests on a mouse knockout and is
    annotated in GOA on mouse Aff4 only, so this review does not annotate it on the human
    gene at all.
