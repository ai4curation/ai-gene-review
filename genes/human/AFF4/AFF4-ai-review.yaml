    label: response to endoplasmic reticulum stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A0A8I6GGV9
  - ensembl:ENSRNOP00000088228
  review:
    summary: >-
      Marked as over-annotated. The donor is the genuine rat orthologue, so this is
      not a paralogue transfer; the problem is one level down, in a single IEP annotation
      curated from a drug study in which Aff4 was not the subject.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Resolving the donor is not enough here, so its own evidence was queried too. Rat
      Aff4 (A0A8I6GGV9) holds GO:0034976 by exactly one annotation, an IEP - inferred
      from expression pattern - curated by RGD from PMID:31466050, a study of genipin
      in a rat acute lung injury model whose subject is the PI3K/AKT pathway and not
      Aff4. The reference-projection test shows that paper produces exactly one annotation
      on one entity in the whole of GOA, so it is a single curation from a single expression
      experiment rather than a bulk import. A transcript changing abundance under ER
      stress does not establish that the gene product participates in the ER stress response,
      and no human AFF4 study reports any ER-stress result. The donor entry is also unreviewed,
      so its protein name is an automatic label; that is a separate point from its GO
      annotation, which is real. Marked over-annotated rather than removed because AFF4's
      involvement is unmeasured, not refuted, and the Ensembl Compara pipeline behaved
      as documented.
