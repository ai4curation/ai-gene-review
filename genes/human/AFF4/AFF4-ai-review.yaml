    reason: >-
      Both protein donors do hold their own experimental evidence, but at the descendant
      GO:0007611 learning or memory (verified: GO:0007611's ancestor closure contains
      GO:0050877), and both are paralogues - mouse Aff2, which is FMR2, the FRAXE intellectual-disability
      gene (PMID:11923441), and Drosophila lilli. No AFF4 orthologue appears among the
      seeds of any of the five IBA rows. AFF4 does have a clinical connection to the
      nervous system, since cognitive impairment is the C of CHOPS syndrome, and that is
      why the term is not removed - but it is named here as context and explicitly NOT as
      evidence of a molecular function, because the variants that cause it are stabilising
      gain-of-function substitutions and reading such a phenotype as molecular involvement
      is the move the GO:0032968 row on this gene refuses. What carries the verdict is
      this: the donors carry real experimental evidence at a descendant term, the
      term itself is broad and this gene is ubiquitously expressed with an
      embryonic-lethal null, and AFF4's only nervous-system-specific study of its own
