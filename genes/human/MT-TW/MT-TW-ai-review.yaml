    label: mitochondrial translation
  supported_by: *id001
suggested_questions:
- question: Should GO annotate all 22 mtDNA-encoded tRNAs, including MT-TW, uniformly to triplet codon-amino
    acid adaptor activity and mitochondrial translation, rather than relying on Rfam2GO coverage that
    varies between mt-tRNA sequences?
