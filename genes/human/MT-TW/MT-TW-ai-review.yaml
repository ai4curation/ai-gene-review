id: URS000012396D_9606
gene_symbol: MT-TW
product_type: TRNA
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MT-TW encodes mitochondrial tRNA-Trp, one of the 22 transfer RNAs encoded by mitochondrial
  DNA. After excision from the polycistronic mtDNA transcript and post-transcriptional maturation, it
  is charged with tryptophan by the corresponding mitochondrial aminoacyl-tRNA synthetase and, in the
  mitochondrial matrix, acts as the adaptor that reads the tryptophan codons UGA and UGG (UGR) of the
  13 mtDNA-encoded mRNAs on the mitoribosome, delivering tryptophan to the growing polypeptide. In the
  vertebrate mitochondrial genetic code UGA specifies tryptophan rather than termination, so this tRNA
  reads both UGG and UGA. Pathogenic variants in MT-TW, like those in other mt-tRNA genes, impair mitochondrial
  translation and oxidative phosphorylation and cause maternally inherited mitochondrial disease.
references:
- id: PMID:21910628
  title: 'Human mitochondrial tRNAs: biogenesis, function, structural aspects, and diseases.'
  findings:
  - statement: The 22 mtDNA-encoded tRNAs are used by the mitochondrial protein synthesis machinery to
      translate the 13 mtDNA-encoded mRNAs.
    supporting_text: These mRNAs are translated by the mitochondrial protein synthesis machinery, which
      uses the 22 species of mitochondrial tRNAs (mt tRNAs) encoded by mtDNA.
  - statement: mt tRNA genes are frequent sites of pathogenic point mutations.
    supporting_text: The genes encoding mt tRNAs are highly susceptible to point mutations, which are
      a primary cause of mitochondrial dysfunction and are associated with a wide range of pathologies.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Suzuki, Nagao and Suzuki 2011 Annu Rev Genet, review); abstract only.
      Covers all 22 mtDNA-encoded tRNAs collectively rather than this tRNA specifically.
- id: PMID:7219534
  title: Sequence and organization of the human mitochondrial genome.
  findings:
  - statement: The human mitochondrial genome encodes 22 tRNAs.
    supporting_text: The genes for the 12S and 16S rRNAs, 22 tRNAs, cytochrome c oxidase subunits I, II
      and III, ATPase subunit 6, cytochrome b and eight other predicted protein coding genes have been
      located.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Anderson et al. 1981 Nature); the reference human mtDNA sequence that
      located the 22 tRNA genes.
existing_annotations:
- term:
    id: GO:0030533
    label: triplet codon-amino acid adaptor activity
  evidence_type: TAS
  review:
    summary: No GOA annotation exists for MT-TW (RNAcentral/Rfam2GO supplies GO:0030533 for some but not
      all mt-tRNA sequences). Proposed to record the canonical tRNA adaptor function.
    action: NEW
    reason: MT-TW is one of the 22 mtDNA-encoded tRNAs used by the mitochondrial translation machinery;
      the codon-anticodon adaptor function is carried out by the tRNA itself. The same term is assigned
      by Rfam2GO to sister mt-tRNAs (e.g. MT-TQ, MT-TH, MT-TS1).
    supported_by: &id001
    - reference_id: PMID:21910628
      supporting_text: These mRNAs are translated by the mitochondrial protein synthesis machinery, which
        uses the 22 species of mitochondrial tRNAs (mt tRNAs) encoded by mtDNA.
- term:
    id: GO:0032543
    label: mitochondrial translation
  evidence_type: TAS
  review:
    summary: Proposed process annotation for the mitochondrial tRNA.
    action: NEW
    reason: The tRNA directly performs the decoding step of mitochondrial translation (it is not merely
      required for it), so involved_in mitochondrial translation is appropriate; this is the specific
      child of translation that sister mt-tRNAs receive via the MODIFY of their IEA translation annotation.
    supported_by: *id001
core_functions:
- description: Trp-accepting tRNA that reads the tryptophan codons UGA and UGG (UGR) of mtDNA-encoded
    mRNAs on the mitoribosome, delivering tryptophan during mitochondrial translation.
  molecular_function:
