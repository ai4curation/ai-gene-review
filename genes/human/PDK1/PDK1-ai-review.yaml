    reason: PDK1 phosphorylates serine residues on the pyruvate dehydrogenase E1 alpha subunit;
      GO:0106310 captures the residue chemistry more precisely than generic protein kinase activity,
      and this review already carries GO:0004740 for the PDC-specific substrate reaction.
    supported_by:
