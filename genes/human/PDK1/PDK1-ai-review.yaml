suggested_questions:
- question: Which tissue- and signal-specific conditions make PDK1 the dominant PDK isoform
    controlling PDC rather than another PDK family member?
- question: Which additional substrates, if any, are phosphorylated by endogenous PDK1 at
    physiologic abundance in human cells?
suggested_experiments:
- description: Use endogenous PDK1 knockout/rescue or acute degron systems in a tissue-matched human
    cell type, followed by PDHA1 phosphosite quantification and isotope tracing from glucose to
    acetyl-CoA, to distinguish direct PDC control from transcriptional adaptation.
