id: Q15118
gene_symbol: PDK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PDK1 is a mitochondrial matrix serine kinase that phosphorylates the E1 alpha subunits of
  the pyruvate dehydrogenase complex, inhibiting pyruvate conversion to acetyl-CoA and shifting carbon
  away from mitochondrial oxidation. It is one of four human PDK isoforms and is regulated in cancer cells
  by oncogenic signaling inputs, including mitochondrial tyrosine phosphorylation and PGK1-dependent Thr338
  phosphorylation, that tune pyruvate flux during hypoxia and aerobic glycolysis.'
