core_functions:
- description: >-
    Secondary-active, Na+-coupled, chloride-independent symport of neutral (aliphatic, branched-chain
    and aromatic) L-amino acids across the apical/brush-border membrane of intestinal and renal
    epithelial cells, driven by the inward sodium electrochemical gradient. B0AT1 functions as the
    active transporter subunit of a heteromeric amino acid transport complex, requiring ACE2 (intestine)
    or collectrin/CLTRN (kidney) for surface trafficking and catalytic activation.
