gene_symbol: SLC6A19
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC6A19 encodes B0AT1 (system B0 neutral amino acid transporter 1), the principal
  apical/brush-border membrane transporter that mediates (re)absorption of neutral amino
  acids in the small intestine and the renal proximal tubule. B0AT1 is a secondary-active,
  Na+-coupled, chloride-independent symporter: it uses the inward sodium electrochemical
  gradient to import a broad range of neutral (aliphatic, branched-chain and aromatic)
  L-amino acids, including leucine, isoleucine, valine, methionine, phenylalanine, alanine,
  glutamine, glycine and serine, without coupling to chloride. This distinguishes it from the
  chloride-dependent SLC6 neurotransmitter symporters. B0AT1 is a multi-pass membrane protein
  that requires a tissue-specific single-pass accessory subunit for trafficking to the cell
  surface and for catalytic activation: ACE2 in the intestine and collectrin (CLTRN/TMEM27)
  in the kidney, with which it forms a heteromeric amino acid transport complex. Loss-of-function
  mutations cause Hartnup disorder, an autosomal recessive neutral hyperaminoaciduria, and
  SLC6A19 deficiency can also contribute to hyperglycinuria and iminoglycinuria.
