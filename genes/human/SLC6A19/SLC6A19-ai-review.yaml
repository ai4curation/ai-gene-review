suggested_questions:
- question: >-
    What is the transport stoichiometry (Na+ : neutral amino acid) and the full quantitative substrate
    selectivity profile of human B0AT1 in its physiological ACE2- versus collectrin-bound states?
- question: >-
    Does the choice of accessory subunit (ACE2 in intestine vs collectrin in kidney) modulate B0AT1
    substrate affinity or selectivity in humans, as suggested for B0AT3?
suggested_experiments:
- description: >-
    Electrophysiological and radiotracer flux measurements of human B0AT1 reconstituted with ACE2 versus
    collectrin to determine Na+:amino acid coupling ratio and confirm chloride-independence across the
    neutral amino acid substrate range.
- description: >-
    Cryo-EM and functional analysis of the B0AT1-collectrin (kidney) complex for direct comparison with
    the B0AT1-ACE2 (intestine) complex, to define subunit-specific effects on trafficking and catalysis.
