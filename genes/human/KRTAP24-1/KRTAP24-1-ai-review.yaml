description: KRTAP24-1 (keratin-associated protein 24-1, KAP24.1) is a 254-aa hair cuticle keratin-associated protein encoded by a single-exon gene adjacent to the chromosome 21q22.1 KAP domain. Unusually for a KAP it is rich in serine, proline and tyrosine with relatively low cysteine and carries carboxy-terminal tyrosine-containing decameric tandem repeats. KAP24.1 is expressed only in scalp hair follicles, specifically in the middle/upper hair cuticle, where it is a matrix constituent of the keratinized cuticle cells that associate with hair keratin intermediate filaments. Orthologous KRTAP24-1 genes in sheep and goats are polymorphic and associated with fibre diameter.
