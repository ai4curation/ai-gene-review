    summary: Structural molecule activity, assigned from the InterPro keratin-matrix signature (InterPro2GO).
    action: MODIFY
    reason: 'The structural role is correct but the term is more general than warranted: KAPs contribute specifically to the structural integrity of the hair shaft, a cutaneous appendage. GO:0030281 structural constituent of cutaneous appendage (is_a GO:0005198; definition explicitly covers hairs) captures this. Hair keratins themselves are conventionally annotated (IBA) to GO:0030280 structural constituent of skin epidermis, but that definition refers to the skin epidermis rather than hair.'
