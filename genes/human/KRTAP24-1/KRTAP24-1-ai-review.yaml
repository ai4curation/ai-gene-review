  review:
    summary: Proposed involvement of KRTAP24-1 in keratinization of the hair shaft, as a matrix constituent of the cornified fibre.
    action: NEW
    reason: 'Participation test: KAPs do part of the work of hair keratinization in the structural/scaffold sense; they are deposited in keratinizing trichocytes and become covalently cross-linked with the keratin filaments to form the cornified hair shaft, i.e. they contribute structure to the product rather than merely being required for it. GO:0031424 explicitly includes hair. Comparator check: the trichocyte keratins KRT81, KRT85 and KRT86 carry keratinization by IBA, and KAP6-family paralogues carry it by IEA. Hair cycle and hair follicle development were not used, since KAPs act downstream in fibre formation rather than in follicle cycling or morphogenesis.'
    supported_by:
    - reference_id: Reactome:R-HSA-6809663
      supporting_text: These filaments have a surrounding matrix that contains keratin-associated proteins (KAPs) that are involved in the formation of cornified, resilient hair shafts
