core_functions:
- description: 'Structural matrix protein of the hair cuticle: as a cuticular keratin-associated protein, KRTAP24-1 is shown or predicted to be deposited in the interfilamentous matrix of keratinizing trichocytes and cross-linked (by disulfide bonds and non-covalent interactions) to hair keratin intermediate filaments, contributing to the rigidity and mechanical resistance of the keratinized hair shaft.'
