- term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9013159
  qualifier: enables
  extensions:
  - predicate: RO:0002233
    term:
      id: UniProtKB:P60953
      label: CDC42
  review:
    summary: >-
      Reactome places ARHGEF15 in its confirmed list of CDC42 GEFs as well. This is the only
      point in the entire GO record where CDC42 is named for this gene, and it is supported
      by three independent measurements.
    action: ACCEPT
    reason: >-
      CDC42 is the contested half of this protein's substrate range and the evidence now runs
      three to two in favour. For: PMID:32203420 scores ARHGEF15 Cdc42 positive in a
      family-wide screen whose library entry for this gene is the human protein at its full 841
      residues rather than a rodent cDNA; PMID:23029280 shows VEGF-induced CDC42 activation
