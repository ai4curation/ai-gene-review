id: O94989
gene_symbol: ARHGEF15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ARHGEF15 (Ephexin-5, Vsm-RhoGEF) is a Dbl-family guanine nucleotide exchange factor for
  Rho-family GTPases, built from a long disordered N-terminal region, a catalytic DH domain
  at residues 417 to 601 and an adjacent ephexin-type PH domain. It couples Eph receptor
  tyrosine kinases to actin remodelling: EphA4 associates with it in vascular smooth muscle
  and, on ephrin-A1 stimulation, tyrosine-phosphorylates it and raises its exchange activity
  toward RhoA, driving stress-fibre assembly and smooth-muscle contractility; in neurons it
  binds EphB2 instead, and EphB2-dependent phosphorylation at Tyr-353 triggers
  UBE3A-mediated ubiquitination and degradation. Exchange activity has been measured
  directly for RhoA and, in a family-wide screen and in brain tissue, for CDC42 as well,
  while RAC1 is negative wherever it has been tested. Which of RhoA and CDC42 dominates
  appears to be set by context and by the phosphorylation state of that same tyrosine rather
  than by the catalytic site. Expression is largely vascular, in smooth muscle and
  endothelium, with a separate developmental role in hippocampal dendrites where the protein
  restrains excitatory synapse formation. Heterozygous loss-of-function variants cause
  autosomal dominant brain small vessel disease with osteoporosis, through RhoA/ROCK2
  inactivation and F-actin disorganisation in vascular cells and impaired Wnt signalling in
  osteoblasts.
