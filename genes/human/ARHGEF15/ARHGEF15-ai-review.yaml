core_functions:
- description: >-
    Receptor-coupled Dbl-family guanine nucleotide exchange factor. Through the DH domain at
    residues 417 to 601, assisted by the adjacent ephexin-type PH domain that targets it to the
    membrane, it loads GTP onto Rho-family GTPases and thereby drives actin remodelling. RHOA
    is the substrate every system agrees on: exchange activity toward RhoA is measured directly
    on the human protein three times, by EphA4-stimulated assay in vascular smooth muscle, by
    comparison of wild type with the R604C variant, and in a family-wide screen of all 145
    human RhoGEFs and RhoGAPs whose library entry for this gene is the human protein at its
    full 841 residues. CDC42 is the contested half, positive in that same screen, in human
    endothelial cells by knockdown and in mouse brain, negative in mouse neurons and in the
    disease paper. RAC1 is negative wherever it has been tested. The exchange machinery is
    intact in the human protein, which retains the alpha5 residues L554/Q558/R559 whose
    triple-alanine substitution abolishes activity in the mouse ortholog, but those residues do
    not predict which GTPase is used: in a twelve-protein panel they are absent from all three
    canonical RhoA-specific GEFs and present in two of three CDC42-specific ones, and the same
    triple mutant is the published GEF-dead control for CDC42 as well as for RhoA. What does
    set selectivity, experimentally, is the phosphorylation state of the EphB2 site at human
    Y353. The substrate cannot be named in the term, because GO merged every substrate-specific
    GEF molecular function into GO:0005085, so it is carried in substrates and in has_input
    extensions instead.
