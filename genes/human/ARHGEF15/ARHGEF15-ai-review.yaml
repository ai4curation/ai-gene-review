  knowledge_gaps:
  - gap_statement: >-
      Which Rho-family GTPase ARHGEF15 acts on in a given human tissue is unsettled, and GO's
      molecular-function branch cannot express the answer even where it is known.
    boundary: >-
      RHOA is established and RAC1 is excluded wherever tested. CDC42 is positive in three
      systems including two with human cells, and negative in two. The ontology limit is
      independent of the biology: GO:0005089, GO:0005086, GO:0005087, GO:0005088 and GO:0008321
      were all merged into GO:0005085, confirmed on QuickGO and OLS4, leaving that term with
      zero is_a children and the substrate names as synonyms only. The biological-process
      branch retains substrate identity, but GO:0032488 Cdc42 protein signal transduction is an
      is_a descendant of GO:0007266 Rho protein signal transduction, so the GO:0035025 row this
      gene carries does not discriminate; and GO:0032489 has no signed children, so a
      CDC42-activating GEF cannot be given a positive regulation term at all.
    gap_kind:
    - BIOLOGY
    - ONTOLOGY
- description: >-
    Adaptor coupling of Eph receptor tyrosine kinases to Rho signalling. The exchange factor
    associates with EPHA4 in quiescent vascular smooth muscle cells and is tyrosine
    phosphorylated by it on ephrin-A1 stimulation, which raises its exchange activity; in
    neurons the partner is EPHB2 instead, and phosphorylation of the equivalent site drives
    UBE3A-dependent ubiquitination and degradation rather than activation. The receptor
    interaction is therefore the input arm of the same molecular device whose output arm is the
    exchange activity, and it is the only interaction in this gene's record with a mechanism
    attached. The paralog NGEF/Ephexin1 carries the same term for the same relationship, which
    is what distinguishes this from a bare binding annotation.
