      not activate RAC1 or CDC42. The two negatives are not equivalent in weight to the
      positives, because the same PMID:32203420 screen scores ITSN1, a textbook CDC42 GEF,
      negative for all three GTPases, so a negative in this assay class means not detected
      rather than does not act. Keeping the row is the correct call, but it is kept as a
      substrate claim that GO can only express through the Reactome reaction and the has_input
      extension, since the CDC42-specific molecular-function term was merged away.
