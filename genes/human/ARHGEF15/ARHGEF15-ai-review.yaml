suggested_questions:
- question: >-
    Does human ARHGEF15 activate CDC42 in vascular smooth muscle, where its RhoA activity
    was established, or is the CDC42 arm restricted to endothelium and neurons? The three
    CDC42-positive results come from endothelial cells, a family-wide screen and mouse
    brain, while both CDC42-negative results come from systems where the RhoA arm dominates.
    If selectivity is set by the phosphorylation state of Y353 as PMID:40138406 reports, the
    answer should depend on receptor input rather than on cell type as such, and the two
    literatures would stop looking contradictory.
  experts: []
- question: >-
    Should GO restore a way to state which GTPase a GEF or GAP acts on, given that both the
    GEF and the GAP molecular-function branches have now been flattened to a single term?
    GO:0005089 and its four siblings merged into GO:0005085, exactly as GO:0005097,
    GO:0005099, GO:0005100 and GO:0008060 merged into GO:0005096. The information is not
    recoverable from the biological-process branch either: Cdc42 protein signal transduction
    is an is_a descendant of Rho protein signal transduction, and there is no positive
    regulation of Cdc42 protein signal transduction term at all. For a family of 145 human
    proteins whose entire functional distinction is substrate choice, that leaves the
    molecular-function annotation uninformative.
  experts: []
- question: >-
    Is the PRKG1 interaction real, and does cGMP-dependent kinase signalling regulate this
    exchange factor in vascular smooth muscle? Seven bare protein-binding rows in this record,
    covering five distinct partners, are recommended for removal because the generic term is
    uninformative, not because the interactions are disputed; the partners are PIN1, LASP1,
    CEP55, PRKG1 and GORASP2 and they are named here so that removing the annotations does not
    lose them. PRKG1 is the one whose partner is a central regulator of the tissue the protein
    was discovered in, and it opposes RhoA/ROCK signalling there. A confirmed interaction would
    place a known vasodilatory pathway directly onto the exchange factor. It currently rests on
    one two-hybrid observation against one isoform.
  experts: []
- question: >-
    Do the mouse neuronal functions of Ephexin5 operate in human at all? Seven of the
    thirty-one GOA rows are neuronal or dendritic and every one of them is a projection from
    mouse. The human expression evidence is vascular and adipose, the human disease is
    cerebrovascular and skeletal rather than synaptic, and the one human neurological
    association is a single de novo variant of uncertain significance. The rows are kept
    because the mouse evidence is strong, but nothing currently distinguishes a conserved
    function from a rodent-specific one.
  experts: []
suggested_experiments:
- hypothesis: >-
    Human ARHGEF15 catalyses nucleotide exchange on both RHOA and CDC42 but not RAC1, and
    the balance between the first two is set by phosphorylation of Y353 rather than by the
    catalytic site.
  experiment_type: in vitro guanine nucleotide exchange assay
  description: >-
    Measure exchange activity of purified human ARHGEF15 DH-PH against RHOA, RAC1 and CDC42
    in a single side-by-side nucleotide-exchange assay, with the L554A/Q558A/R559A triple
    mutant as the negative control and the phosphorylated and Y353F forms as the selectivity
    comparison. Every existing substrate call for this protein comes from cell-based effector
    pulldowns in different laboratories, systems and species, which is why they disagree.
- hypothesis: >-
    The negative calls in the PMID:32203420 screen, including RAC1 for ARHGEF15, have a
    false-negative rate large enough that they cannot be read as evidence of absence.
  experiment_type: replication with positive and known-negative controls
  description: >-
    Repeat the PMID:32203420 screen conditions for ARHGEF15 alongside ITSN1 and FGD1. ITSN1
    scored negative for all three GTPases in that screen despite being a textbook CDC42 GEF,
    so the screen's false-negative behaviour is a measurable property that determines how
    much weight its negative calls can bear, including the RAC1 negative for this gene.
- hypothesis: >-
    Endogenous ARHGEF15 is enriched at cortical actin and membrane ruffles rather than
    distributed over the plasma membrane generally.
  experiment_type: endogenous tagging and live-cell imaging
  description: >-
    Test whether ARHGEF15 localises to cortical actin and membrane ruffles at endogenous
    levels, by endogenous tagging rather than overexpression. PMID:32203420 reports ruffle
    and peripheral-actin enrichment confirmed by a cytochalasin D assay, and independently
    gives the protein three ERM-family AP-MS preys, EZR, MSN and RDX; but that localisation
    used an overexpressed Citrine fusion and the authors explicitly could not exclude plasma
    membrane in addition, so no new cellular-component annotation is proposed from it here.
