      IntAct, uninformative as an annotation.
    action: REMOVE
    reason: >-
      PIN1 is a phospho-dependent prolyl isomerase and ARHGEF15 is phosphorylated on both
      tyrosine and serine residues, so the pairing is not implausible; but plausibility is not
      evidence, and nothing downstream of this screen has tested it. GO:0005515 with no
      extension says nothing about what the protein does. There is no more informative
      molecular function to modify to, because the screen assigns ARHGEF15 no activity in the
      interaction, so the policy for a bare GO:0005515 row lands on removal. Removing it says
      the annotation is uninformative, not that the interaction is false: the IntAct record is
      untouched and the partner identity is preserved in this document.
