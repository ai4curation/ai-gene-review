      term is ephrin receptor binding.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0046875
      label: ephrin receptor binding
    reason: >-
      The interaction is not an isolated binding event: EPHA4 associates with the exchange
      factor in quiescent cells and, on ephrin-A1 stimulation, phosphorylates it and raises
