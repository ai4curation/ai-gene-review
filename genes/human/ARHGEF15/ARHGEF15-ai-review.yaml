      pairing is a By-similarity transfer from mouse.
    boundary: >-
      The EPHA4 interaction is experimental in the human record and carries the GO:0005515 IPI
      this review modifies. The EPHB2 interaction, the Y353 phosphorylation and the
      UBE3A-dependent degradation are all ECO:0000250 transfers from UniProtKB:Q5FWH6. The
      residue itself is retained in human, which is a necessary but not a sufficient condition.
    gap_kind:
