      comparator check supports the term rather than inventing a use for it: NGEF/Ephexin1,
      the paralog in the same PANTHER family, already carries GO:0046875 for the same
      relationship to the same receptor class, albeit by Ensembl projection from mouse Ngef
      rather than experimentally. UniProt records both Eph partners for this
      protein, EPHA4 experimentally and EPHB2 by similarity, and GO:0046875 covers both
      classes, so the replacement does not commit to the A-class receptor alone.
    supported_by:
    - reference_id: PMID:12775584
      supporting_text: Based on the association of Vsm-RhoGEF with EphA4 in quiescent cells
