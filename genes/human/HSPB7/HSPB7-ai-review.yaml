core_functions:
- description: >-
    HSPB7 is a substrate-selective, in-situ holdase that binds early
    polyglutamine-containing aggregation intermediates and delays aggregate growth
    without promoting refolding. GO:0051082 is used here as an INTERIM molecular
    function descriptor despite being formally obsolete: GO:0044183 requires assistance
    with protein folding, which HSPB7 does not provide, while GO:0140309 retains a
    carrier-specific definition requiring escort to an acceptor molecule or location,
    which has not been demonstrated for HSPB7. A general "holdase chaperone activity"
    term is needed; see projects/UNFOLDED_PROTEIN_BINDING.md and
    go-ontology#30552.
  molecular_function:
    id: GO:0051082
    label: unfolded protein binding
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:20843828
    supporting_text: HSPB7 prevents toxicity of polyQ proteins at an early stage of
      aggregate formation by a non-canonical mechanism that requires an active autophagy
      machinery.
  - reference_id: PMID:31097540
    supporting_text: HSPB7 acts directly on the aggregation process as recombinant
      HSPB7 can delay in vitro polyQ aggregation, whereas HSPB1 cannot.
  - reference_id: PMID:31097540
    supporting_text: Our co-IP experiments, performed using soluble material, suggest
      that HSPB7 binds to early profibrillar species.
- description: Binding to the actin-crosslinking protein filamin (alpha-filamin / actin-binding
    protein 280) via the alpha-crystallin domain, linking HSPB7 to the cardiac/muscle
    cytoskeleton.
  molecular_function:
    id: GO:0031005
    label: filamin binding
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:10593960
    supporting_text: cvHsp interacted in both yeast two-hybrid and immunoprecipitation
      experiments with alpha-filamin or actin-binding protein 280
proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: Binding to an unfolded or misfolded protein to prevent its
    aggregation without actively catalyzing refolding. The holdase maintains the client
    protein in a soluble, folding-competent state.
  justification: HSPB7 directly binds early polyQ/profibrillar intermediates and recombinant
    HSPB7 delays polyQ aggregation, while it does not improve refolding. This is an
    in-situ holdase activity not represented by GO:0044183, which requires assisting
    folding, or GO:0140309, whose definition requires carrier-mediated escort to an
    acceptor or location. A general term was discussed but not created in
    go-ontology#30552.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:31097540
    supporting_text: Together, our results reveal that the NTD of HSPB7 is both necessary
      and sufficient to bind to and suppress the aggregation of polyQ-containing proteins.
  - reference_id: PMID:19464326
    supporting_text: Unlike HSPB1 and HSPB5, that chaperoned heat unfolded substrates
      and kept them folding competent, HSPB7 did not support refolding.
suggested_questions:
- question: What sequence or conformational features make an aggregation-prone client
    susceptible to the substrate-selective holdase activity of HSPB7?
- question: Does HSPB7's residence in SC35 splicing speckles reflect a role in RNA/splicing
    biology, or is it a storage/sequestration site distinct from its cytoskeletal function?
- question: How do HSPB7 hetero-oligomers with HSPB8/BAG3 contribute to chaperone-assisted
    selective autophagy in cardiomyocytes?
suggested_experiments:
- description: Comparative in vitro aggregation assays across polyQ, non-polyQ amyloidogenic,
    and heat-denatured substrates to define the client scope and kinetic step targeted
    by HSPB7 holdase activity.
- description: Domain-swap and point-mutation analysis of the HSPB7 N-terminal region
    (1-71) to dissect SC35-speckle targeting versus client sequestration.
- description: Cardiomyocyte HSPB7 knockout/knock-in models to test effects on filamin
    handling, proteostasis, and contractile function.
