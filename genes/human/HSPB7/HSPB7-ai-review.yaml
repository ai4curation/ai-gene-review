  title: Interaction of human HSP22 (HSPB8) with other small heat shock proteins.
  findings:
  - statement: HSPB8 (HSP22) hetero-dimerizes with cvHSP (HSPB7) through a C-terminal
      to C-terminal interaction, and also interacts with HSPB2 (MKBP) and HSPB1 (HSP27),
      defining the small-HSP hetero-oligomer network.
    reference_section_type: RESULTS
- id: PMID:16189514
  title: Towards a proteome-scale map of the human protein-protein interaction network.
  findings: []
- id: PMID:19464326
  title: HSPB7 is a SC35 speckle resident small heat shock protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: "Cached publications/PMID_19464326.md title matches; anchored to GOA
      as the IDA source for GO:0005634 (nucleus) and GO:0005737 (cytoplasm). Shows
      HSPB7 does not support substrate refolding, which argues against GO:0044183
      (protein folding chaperone) but does not by itself establish GO:0140309
      (unfolded protein holdase activity)."
  findings:
  - statement: HSPB7 constitutively localizes to SC35 nuclear splicing speckles driven
      by its N-terminus and, unlike HSPB1/HSPB5, does not support refolding of heat-denatured
      substrates, indicating a non-canonical chaperone role.
    reference_section_type: RESULTS
- id: PMID:20843828
  title: HSPB7 is the most potent polyQ aggregation suppressor within the HSPB family
    of molecular chaperones.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The cached abstract directly reports HSPB7-dependent suppression
      of polyQ aggregation and toxicity, while also confirming that HSPB7 does not
      improve refolding of heat-denatured luciferase. It supports substrate-selective
      antiaggregation but not GO:0044183 protein folding chaperone activity.
  findings:
  - statement: HSPB7 was the strongest HSPB-family suppressor of expanded-polyQ aggregation
      and toxicity in cells, acting early in aggregate formation through a noncanonical,
      autophagy-dependent mechanism rather than by improving refolding.
    reference_section_type: RESULTS
- id: PMID:31097540
  title: The N terminus of the small heat shock protein HSPB7 drives its polyQ aggregation-suppressing
    activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text is cached. Recombinant HSPB7 directly delays polyQ aggregation,
      and HSPB7 binds early profibrillar/polyQ species through its N-terminal domain.
      These experiments establish substrate-selective antiaggregation activity but
      do not demonstrate escort to an acceptor or location as required by GO:0140309;
      they remain inconsistent with GO:0044183 protein folding chaperone activity.
  findings:
  - statement: Recombinant HSPB7 directly delayed polyQ aggregation in vitro, and its
      N-terminal domain was necessary and sufficient for binding polyQ-containing proteins
      and suppressing their aggregation.
    reference_section_type: RESULTS
  - statement: Co-immunoprecipitation indicated binding to early profibrillar species;
      the authors propose that this interaction delays further oligomerization or stabilizes
      protofibrils for autophagic clearance.
    reference_section_type: DISCUSSION
