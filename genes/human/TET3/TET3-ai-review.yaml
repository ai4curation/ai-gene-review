  supporting_entities:
  - ARBA:ARBA00029224
  - InterPro:IPR002857
  review:
    summary: The broad CXXC DNA-binding row is true but less informative than
      accepted TET3 sequence-specific DNA-binding rows.
    action: TOO_GENERAL
    reason: The Xenopus Tet3 CXXC structural data show cytosine-dependent DNA
      binding with only a slight preference for CpG content, and this review
      already accepts more informative methyl-CpG-binding and RNA polymerase II
      cis-regulatory region DNA-binding rows. This InterPro-seeded parent is
      therefore true but imprecise on its own.
