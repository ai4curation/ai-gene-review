id: O43151
gene_symbol: TET3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TET3 is a methylcytosine dioxygenase with an N-terminal CXXC zinc
  finger and a C-terminal TET catalytic core that oxidizes 5-methylcytosine in
  genomic DNA. It binds CpG-containing chromatin, contributes to gene regulation
  through iterative 5mC oxidation, and has a prominent zygotic role in
  epigenetic reprogramming of the male pronucleus.
