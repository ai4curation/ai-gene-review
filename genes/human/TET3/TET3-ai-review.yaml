  review:
    summary: The female-pronucleus transfer is not resolved from the cached
      human and mouse-similarity evidence.
    action: UNDECIDED
    reason: The cached human UniProt record supports mouse-derived TET3
      localization to the male pronucleus and cytoplasm at other preimplantation
