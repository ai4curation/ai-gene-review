  supporting_entities:
  - InterPro:IPR002857
  review:
    summary: The TET3 CXXC domain coordinates zinc ions that fold its
      DNA-binding surface.
    action: ACCEPT
    reason: The Xenopus Tet3 CXXC crystal structures showed the conserved
      cysteine residues coordinating two zinc ions in a crescent-shaped CXXC
      architecture that binds DNA; this supports zinc ion binding separately
      from Fe(II) binding by the catalytic domain.
    supported_by:
    - reference_id: PMID:23217707
      supporting_text: the Tet3 CXXC domain contains eight conserved cysteine
        residues coordinating two zinc ions
