suggested_questions:
- question: Which TET3 recruitment partners determine where its catalytic core
    oxidizes 5mC in endogenous human cell types?
- question: Would a cytosine-dependent TET3 CXXC specificity term better capture
    the broad, register-shifted DNA recognition reported for Xenopus Tet3 than
    either methyl-CpG binding or unmethylated CpG binding?
suggested_experiments:
- description: Rescue a TET3-null human cell model with catalytic-dead and
    recruitment-defective alleles, then map 5hmC/5fC/5caC and nascent
    transcription to separate direct demethylation effects from downstream
    expression changes.
