- id: PMID:23217707
  title: Tet3 CXXC domain and dioxygenase activity cooperatively regulate key
    genes for Xenopus eye and neural development.
  findings:
  - statement: Xenopus Tet3 CXXC-domain DNA binding and 5mC hydroxylase activity
      cooperate to regulate target-gene expression during early eye and neural
      development.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary full-text paper for TET3 CXXC DNA recognition, Tet3
      target-gene regulation, and the CpG-specificity caveat.
- id: PMID:23222540
  title: TET2 promotes histone O-GlcNAcylation during gene transcription.
  findings:
  - statement: TET2 directly binds OGT and recombinant TET3 catalytic domain
      also binds OGT.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Direct TET-family OGT paper, mainly focused on TET2 but with a
      TET3 binding result.
- id: PMID:23353889
  title: TET2 and TET3 regulate GlcNAcylation and H3K4 methylation through OGT
    and SET1/COMPASS.
  findings:
  - statement: TET2 and TET3 directly interact with OGT and regulate OGT-linked
      GlcNAcylation and H3K4 methylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct TET3/TET2-OGT paper used for O-linked glycosylation and
      transcriptional-regulation contexts.
- id: PMID:29276034
  title: DNA Sequence Recognition of Human CXXC Domains and Their Structural
    Determinants.
  findings:
  - statement: The human CXXC-domain study systematically compared DNA-binding
      selectivities of CXXC domains, but the cached abstract does not state the
      TET1 or TET3 methyl-CpG preferences.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only structural genomics paper. It is not sufficient
      by itself to replace the TET3 methyl-CpG row with unmethylated CpG
      binding.
- id: PMID:31928709
  title: 'Delineation of a Human Mendelian Disorder of the DNA Demethylation Machinery:
    TET3 Deficiency.'
  findings:
  - statement: Human TET3 variants associated with a Mendelian DNA-demethylation
      disorder show hypomorphic catalytic activity in an assay of TET3 function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human TET3 disease and catalytic-function paper;
      abstract-only cache.
