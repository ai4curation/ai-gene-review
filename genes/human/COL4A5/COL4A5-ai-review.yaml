core_functions:
- description: The alpha5 chain supplies type-IV collagen protomer and terminal-domain interfaces, contributing
    basement-membrane network architecture and mechanical integrity. Alpha5-containing protomers are distinct
    from fibrillar collagens. Human recombinant NC1 self-assembly supports intrinsic structural participation
    without equating its homohexamer crystals to the native alpha3/alpha4/alpha5 network or assigning
    collagen the enzymes that modify and crosslink it.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  directly_involved_in:
  - id: GO:0030198
    label: extracellular matrix organization
  locations:
  - id: GO:0005604
    label: basement membrane
  in_complex:
    id: GO:0005587
    label: collagen type IV trimer
  supported_by:
  - reference_id: PMID:12193605
  - reference_id: PMID:30443360
  - reference_id: PMID:7657706
  - reference_id: Reactome:R-HSA-2213207
suggested_questions:
- question: Which sequence-defined COL4A5 NC1 fragments occur naturally in human tissues and plasma, and
    at what concentrations relative to the experimental active range?
- question: How does the six-residue alternative insertion affect alpha5 protomer assembly, network incorporation
    and accessibility of the NC1 ligand region?
- question: Does COL4A5 perform a defined step in collagen-fibril size or arrangement beyond its established
    type-IV network assembly?
- question: Which integrin heterodimers and other receptors mediate the residual endothelial response
    after beta1 blockade?
suggested_experiments:
- hypothesis: Natural NC1 processing yields sequence-defined ligands whose receptor activity depends on
    fragment boundaries.
  description: Use targeted mass spectrometry with terminus-specific standards to identify endogenous
    fragments in human matrix and plasma, then compare matching purified fragments with intact collagen
    in alpha1beta1 binding and endothelial-barrier assays with receptor blockade and random-peptide controls.
- hypothesis: The alternative six-residue insertion changes structural assembly or fragment accessibility
    without necessarily changing the NC1 sequence.
  description: Compare sequence-authenticated P29400-1 and P29400-2 in alpha3/alpha4/alpha5 and alpha5/alpha5/alpha6
    assembly, secretion and matrix-incorporation assays; assay matched isolated NC1 regions separately.
status: COMPLETE
