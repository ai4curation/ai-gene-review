id: P29400
gene_symbol: COL4A5
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL4A5 encodes the alpha-5 chain of type-IV collagen, a secreted component of basement-membrane
  networks. Alpha-5 participates in alpha3/alpha4/alpha5 and alpha5/alpha5/alpha6 collagen protomers,
  whose terminal-domain interactions support matrix architecture in tissues including the kidney, skin
  and intestine. Pathogenic COL4A5 variants cause X-linked Alport syndrome. Isolated recombinant human
  NC1 and a synthetic pentastatin peptide bind integrin in experimental assays and perturb pulmonary endothelial
  barrier function. The identity, physiological production and endogenous roles of naturally released
  bioactive fragments remain incompletely resolved; these isolated-fragment experiments do not establish
  or exclude the same activity in assembled collagen.
alternative_products:
