- term:
    id: GO:0005178
    label: integrin binding
  evidence_type: IDA
  original_reference_id: PMID:37694286
  qualifier: enables
  review:
    summary: Recombinant human alpha5 NC1 and synthetic pentastatin bind integrin.
    action: NEW
    reason: The actual solid-phase assay coats recombinant human NC1 (reported Gly1461–Thr1685) or pentastatin
      and adds alpha1beta1 integrin, detected through beta1, with BSA and random-peptide controls. Cellular
      crosslinked immunoprecipitation corroborates association. This is not binding of isolated beta1
      monomer or proof that intact matrix collagen and both full-length products have the same accessible
      activity. The 20-residue sequence maps to canonical1510–1529 and isoform2 1516–1535; reported peptide
      coordinates do not establish which whole isoform was assayed. NC1-reactive tissue/ELISA signals
      do not identify a naturally liberated 20-residue peptide. The current cell-matrix-adhesion child
      is not required by these binding/barrier assays; no existing annotation or replacement is an ancestor/descendant
      of this MF. This is retained as a measured fragment activity, without elevating it to a primary
      core function while the endogenous product and role remain unresolved. The family-level Reactome:R-HSA-2327695
      summary mentions type-IV collagen binding and alpha1/alpha2/alpha3 NC1 ligands, but does not independently
      establish an alpha5-specific intact-chain or released-fragment mechanism.
    supported_by:
    - reference_id: PMID:37694286
      supporting_text: direct-binding of β1-integrin subunit to pentastatin (PS) and to NC1
