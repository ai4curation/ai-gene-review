suggested_questions:
- question: Which endogenous substrate, if any, is mannosylated by human DPY19L2, and is that reaction required
    for acrosome attachment rather than merely associated with the same protein?
- question: How do the 758- and 205-residue products differ in expression, stability, membrane insertion and
    biological function?
- question: How do sperm nuclear-fraction proteomics, mature-sperm immunoblot observations and non-germ-cell
    localization measurements relate across developmental stage, preparation and antibody or peptide specificity?
