core_functions:
- description: DPY19L2 is an inner nuclear membrane member of the DPY19 mannosyltransferase family. The broad
    enzymatic activity is inferred from the curated ancestral function and experimentally characterized family
    members; a substrate and catalytic reaction have not been established directly for human DPY19L2. Mouse
    DPY19L2 did not restore UNC5A surface export in the tested CHO-cell assay, which limits that substrate
    context without demonstrating loss of every mannosyltransferase activity. Human genetic evidence and mouse
    ortholog experiments establish a role in spermatid development, including maintenance of the nuclear-envelope
    attachment supporting acrosome spreading and sperm-head elongation. These observations do not establish
    that the inferred enzymatic activity causes the attachment phenotype or identify a direct molecular bridge.
