id: Q6NUT2
gene_symbol: DPY19L2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DPY19L2 is a multipass protein of the inner nuclear membrane and a member of the DPY19 mannosyltransferase
  family. It supports acrosome attachment and sperm-head shaping during spermatid development. Mouse ortholog
  studies place it beneath the developing acrosome and show disruption of nuclear-envelope attachment and acrosome
  spreading after its loss; tagged human DPY19L2 also localizes to the nuclear envelope. Mannosyltransferase
  activity is inferred from family-level evolutionary evidence, while the human protein's substrate and the
  molecular mechanism connecting it to acrosome attachment remain unresolved. Biallelic loss-of-function variants
  cause globozoospermia. Alternative transcripts encode a full-length product and a much shorter C-terminal
  product whose biological activity remains unresolved.
alternative_products:
- name: '1'
  id: Q6NUT2-1
  description: The displayed natural product contains 758 residues. Its ten annotated membrane-spanning segments
    are sequence predictions, not an experimentally solved topology. The cited tagged human construct was not
    sequence-authenticated to a particular natural isoform.
- name: '2'
  id: Q6NUT2-2
  sequence_note: VSP_056136
  description: The 205-residue alternative product is the displayed sequence after deletion of residues 1–553
    (VSP_056136). This removes every complete predicted membrane-spanning helix, retaining only residue 554
    from the final predicted 534–554 segment. Its remaining C-terminal sequence does not establish equivalent
    localization or activity, and the inspected studies do not demonstrate its inactivity.
