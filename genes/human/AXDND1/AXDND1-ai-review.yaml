  supporting_entities:
  - UniProtKB:Q3UZ57
  review:
    summary: 'Manchette assembly (ISS, from mouse Axdnd1). In Axdnd1-null spermatids the manchette still
      forms at steps 8-9, but it later becomes abnormally long, rigid and disorganized and persists ectopically.
      AXDND1 is therefore needed for normal manchette structure and dynamics rather than for initial assembly.
      Localization evidence is mixed. Two studies report AXDND1 on manchette microtubules: mouse spermatids
      (PMID:38997255), and human testis by colocalization with alpha-tubulin (PMID:34759295). The alpha-tubulin
      colocalization includes round spermatids, so it is not manchette-specific. A third study saw no
      colocalization (PMID:35386379). GO has no manchette-organization term, so this is the closest. Kept
      as non-core.'
    action: KEEP_AS_NON_CORE
    reason: '[PMID:34759295 "In the early elongating spermatids (step 8–9), we observed a discernable
      manchette structure formation in both WT and Axdnd1−/− mice (Fig. 6I)."] [PMID:34759295 "Residual
      manchette microtubules in the acrosome, as well as rigid and disorganized manchette microtubules
      (labeled by white arrowheads), were observed in step 10–14 spermatids of Axdnd1−/− mice."] [PMID:35386379
      "The manchette of elongating stage spermatids in Axdnd1 −/− mice was abnormally longer (Figure 7E‐G)
      or had disorganized tubulin structures (Figure 7H) compared to WT mice."] [PMID:38997255 "AXDND1
      also localised to the microtubules of the manchette and the developing head-tail coupling apparatus
      of spermatids (Supplementary Fig. 2F)."] [PMID:34759295 "Importantly, we also observed AXDND1 colocalized
      with α-TUBULIN (a manchette marker) in human testes (Fig. 1C)."] [PMID:35386379 "Axdnd1 −/− spermatids
      showed a disorganized manchette structure (Figure 7); however, colocalization of AXDND1 was not
      observed in our immunocytochemical analysis."]'
    supported_by:
    - reference_id: PMID:34759295
      supporting_text: In the early elongating spermatids (step 8–9), we observed a discernable manchette
        structure formation in both WT and Axdnd1−/− mice (Fig. 6I).
    - reference_id: PMID:34759295
      supporting_text: Residual manchette microtubules in the acrosome, as well as rigid and disorganized
