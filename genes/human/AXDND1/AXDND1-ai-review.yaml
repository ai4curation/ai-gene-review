- id: PMID:34759295
  title: AXDND1, a novel testis-enriched gene, is required for spermiogenesis and male fertility.
  findings:
  - statement: Axdnd1 KO males are sterile with OAT.
    supporting_text: Importantly, Axdnd1 knockout males are sterile with reduced testis size caused by
      increased germ cell apoptosis and sloughing, exhibiting phenotypes consistent with oligoasthenoteratozoospermia.
  - statement: AXDND1 is cytoplasmic in human spermatids.
    supporting_text: Immunofluorescent staining also showed that AXDND1 was mainly located in the cytoplasm
