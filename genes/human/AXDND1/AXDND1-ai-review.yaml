knowledge_gaps:
- gap_statement: The molecular activity of AXDND1 is unknown. Its dynein light chain-related domain suggests
    it is a dynein subunit or a manchette/intraflagellar transport adaptor, but no partner or activity
    has been shown.
  boundary: 'Established: AXDND1 is cytoplasmic in spermatids and required for normal manchette structure,
    head shaping and axoneme organization in mouse and human. Not established: binding partners (for example
    dynein heavy chains or IMT/IFT cargoes), whether it moves cargo along manchette microtubules, or why
    manchette localization was seen in two studies (mouse spermatids; human testis by alpha-tubulin colocalization,
    which is not manchette-specific) but not in a third.'
