  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; human testis IF, mouse KO.
- id: PMID:35386379
  title: Loss of Axdnd1 causes sterility due to impaired spermatid differentiation in mice.
  findings:
  - statement: An independent Axdnd1 KO shows abnormal manchette and elongation failure.
    supporting_text: 'RESULT: The Axdnd1 KO mouse exhibited sterility caused by impaired spermiogenesis
      during the elongation step as well as abnormal nuclear shaping and manchette, which are essential
      for spermiogenesis.'
  - statement: AXDND1 did not colocalize with the manchette.
    supporting_text: Axdnd1 −/− spermatids showed a disorganized manchette structure (Figure 7); however,
      colocalization of AXDND1 was not observed in our immunocytochemical analysis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; independent mouse KO.
- id: PMID:38997255
  title: AXDND1 is required to balance spermatogonial commitment and for sperm tail formation in mice
    and humans.
  findings:
  - statement: AXDND1 localizes to manchette microtubules.
    supporting_text: AXDND1 also localised to the microtubules of the manchette and the developing head-tail
      coupling apparatus of spermatids (Supplementary Fig. 2F).
  - statement: Axdnd1 KO sperm have abnormal axonemes.
    supporting_text: In addition, sperm produced during the first wave of spermatogenesis were immotile
      due to abnormal axoneme structure, including the presence of ectopic vesicles and abnormalities
      in outer dense fibres and microtubule doublet structures.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse KO plus human variant screening.
- id: PMID:40457935
  title: A novel frameshift variant in AXDND1 may cause multiple morphological abnormalities of the sperm
    flagella in a consanguineous Pakistani family.
  findings:
  - statement: A homozygous AXDND1 frameshift causes MMAF in humans.
    supporting_text: These findings indicate that AXDND1 is essential for the organization of flagellar
      axoneme and provide direct evidence that AXDND1 is a MMAF gene in humans, thus expanding the phenotypic
      spectrum of AXDND1 frameshift mutations.
  - statement: Patient flagella lack SPAG6 and DNALI1 signals.
    supporting_text: Immunofluorescence staining showed the absence of sperm-associated antigen 6 (SPAG6)
      and dynein axonemal light intermediate chain 1 (DNALI1) signals in the sperm flagella of the patient.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; a single consanguineous family, with control flagellar immunofluorescence.
