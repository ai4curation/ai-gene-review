- term:
    id: GO:0120316
    label: sperm flagellum assembly
  evidence_type: IMP
  original_reference_id: PMID:40457935
  qualifier: involved_in
  review:
    summary: 'Sperm flagellum assembly (NEW, IMP). In a man homozygous for an AXDND1 frameshift that abolishes
      the protein, sperm flagella are malformed (MMAF). The axonemes lack the central pair, and the central-pair
      and inner-arm components SPAG6 and DNALI1 are absent from the flagellum. Mouse knockouts lose outer
      doublets, outer dense fibres and the mitochondrial sheath. This is participation, not just necessity:
      AXDND1 itself is in the sperm flagellum (IDA, same paper) and on manchette microtubules, the route
      by which flagellar cargo is delivered, and without it axonemal components fail to be incorporated.
      Comparator: CFAP61 (IMP, IBA) and NSUN7 (ISS) carry GO:0120316 in GOA, and the LRGUK review in this
      repository proposes it as NEW. UniProt also records ''sperm flagellum assembly''.'
    action: NEW
    reason: '[PMID:40457935 "These findings indicate that AXDND1 is essential for the organization of
      flagellar axoneme and provide direct evidence that AXDND1 is a MMAF gene in humans, thus expanding
      the phenotypic spectrum of AXDND1 frameshift mutations."] [PMID:40457935 "Transmission electron
      microscopy analysis showed disorganized sperm axonemal structure in the patient, particularly missing
      the central pair of microtubules."] [PMID:40457935 "Immunofluorescence staining showed the absence
