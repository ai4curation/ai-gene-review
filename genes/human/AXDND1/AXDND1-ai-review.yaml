suggested_questions:
- question: Is AXDND1 a component of a dynein complex, or a cargo adaptor for intra-manchette and intraflagellar
    transport of axonemal and outer-dense-fibre proteins?
suggested_experiments:
- description: Immunoprecipitate endogenous or knock-in tagged AXDND1 from mouse spermatids for mass spectrometry,
    and track ODF and axonemal cargo distribution along the manchette in Axdnd1-null spermatids.
