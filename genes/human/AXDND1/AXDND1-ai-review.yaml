id: Q5T1B0
gene_symbol: AXDND1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AXDND1 (axonemal dynein light chain domain-containing protein 1) is a testis-enriched coiled-coil
  protein with a dynein light chain-related domain. It is expressed in spermatocytes and spermatids, is
  cytoplasmic in human spermatids and is detected along mature sperm flagella. Mouse knockouts are male-sterile.
  Elongating spermatids develop an abnormally long, disorganized manchette and deformed heads, and their
  flagella lack outer doublets, outer dense fibres and an organized mitochondrial sheath. Loss of AXDND1
  also disturbs the balance between self-renewing and differentiating spermatogonia. In humans, a homozygous
  frameshift that abolishes the protein causes multiple morphological abnormalities of the sperm flagella
  (MMAF). Its molecular activity is unknown.
