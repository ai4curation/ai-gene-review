suggested_questions:
- question: What is the molecular function of TROP2 - does it act as a signaling receptor, an adhesion
    molecule, or a regulator of another receptor, and through which ectodomain and cytoplasmic-tail interactions?
- question: Is human TROP2 subject to regulated intramembrane proteolysis releasing a nuclear intracellular
    domain, as reported for EPCAM?
suggested_experiments:
- description: Define the TROP2 interactome at the epithelial cell surface by proximity labeling, and
    test whether its cytoplasmic tail and ectodomain are required for its effects on proliferation and
    migration.
