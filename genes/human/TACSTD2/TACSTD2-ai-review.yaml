core_functions:
- description: Cell-surface epithelial glycoprotein of the EPCAM family that localizes to the lateral/basolateral
    plasma membrane and cell-cell contacts and modulates epithelial cell proliferation, adhesion and migration.
    Its specific molecular function is not well defined.
