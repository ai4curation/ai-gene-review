id: P09758
gene_symbol: TACSTD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TACSTD2 (TROP2, tumor-associated calcium signal transducer 2) is a single-pass type I plasma
  membrane glycoprotein of the EPCAM family. It has a large N-glycosylated extracellular region (containing
  a thyroglobulin type-1 domain) exposed at the cell surface, a single transmembrane helix, and a short
  cytoplasmic tail with a phosphoinositide-binding motif and a PKC phosphorylation site. TROP2 is expressed
  on epithelial cells, where it localizes to the lateral/basolateral membrane and cell-cell contacts and
  modulates epithelial cell proliferation, migration, spreading and adhesion; its loss causes gelatinous
  drop-like corneal dystrophy. It is strongly overexpressed in many carcinomas and is the target of the
  antibody-drug conjugate sacituzumab govitecan.
