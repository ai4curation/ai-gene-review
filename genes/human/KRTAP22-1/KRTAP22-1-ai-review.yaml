    summary: Proposed keratin filament location for KRTAP22-1, the defining location of hair keratin-associated proteins.
    action: NEW
    reason: KRTAP22-1 is a member of a characterized hair KAP family; KAPs are matrix proteins that surround and cross-link hair keratin intermediate filaments in the hair fibre. GOA lacks any informative location for this gene (only cytosol), whereas related KAPs carry keratin filament via the InterPro keratin-matrix signature, which this sequence does not match. GO has no separate term for the keratin-associated matrix, so keratin filament is the closest location.
