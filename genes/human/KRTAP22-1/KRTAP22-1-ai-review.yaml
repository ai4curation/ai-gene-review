  label: Homo sapiens
description: KRTAP22-1 (keratin-associated protein 22-1, KAP22.1) is a very small (48 aa) high glycine-tyrosine (HGT) hair keratin-associated protein of the KAP22 family, encoded in the chromosome 21q22.1 KAP gene domain. HGT KAPs are matrix proteins of the hair fibre cortex that associate with hair keratin intermediate filaments. In sheep the orthologous KRTAP22-1 is polymorphic and its variants are associated with wool yield and fibre curvature.
