core_functions:
- description: 'Structural matrix protein of the hair fibre: as a high glycine-tyrosine keratin-associated protein, KRTAP22-1 is predicted to be deposited in the interfilamentous matrix of keratinizing trichocytes and cross-linked (by disulfide bonds and non-covalent interactions) to hair keratin intermediate filaments, contributing to the rigidity and mechanical resistance of the keratinized hair shaft.'
