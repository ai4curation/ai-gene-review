- term:
    id: GO:0043161
    label: proteasome-mediated ubiquitin-dependent protein catabolic process
  evidence_type: IDA
  original_reference_id: PMID:17872950
  qualifier: involved_in
  review:
    summary: 'CHOP is the substrate of proteasomal degradation in the cited work, not a participant in
      it: the paper maps the N-terminal determinant of CHOP''s own turnover.'
    action: REMOVE
    reason: Being consumed by a process is not participation in it. The paper's claim is that 'CHOP is
      regulated by the ubiquitin-proteasome system' and that its N-terminal domain is required for its
      own degradation; no CHOP activity contributes a step of ubiquitin-dependent proteolysis. Removal
      concerns the direction of the annotation, not the turnover result, which is sound and is recorded
      in UniProt as a PTM.
    supported_by:
    - reference_id: PMID:17872950
      supporting_text: We have previously demonstrated that CHOP is regulated by the ubiquitin-proteasome
        system
    - reference_id: PMID:17872950
      supporting_text: The CHOP N-terminal domain is necessary not only for protein degradation but also
        for its transactivity and interaction with p300
    source_defects:
    - defect_type: WRONG_TERM
      resource: GOA_EBI
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0043161
      cause: OTHER
      confidence: PROBABLE
      explanation: PMID:17872950 shows that DDIT3/CHOP is itself degraded by the ubiquitin-proteasome
        system and maps the N-terminal region required for that turnover. The IDA row annotates DDIT3
        as involved_in GO:0043161 proteasome-mediated ubiquitin-dependent protein catabolic process, which
        asserts that DDIT3 performs part of that process. The substrate of a catabolic process is not
        a participant in it; the paper supports a PTM/ubiquitination statement (already present in UniProt)
        rather than a biological-process annotation on DDIT3.
      supported_by:
      - reference_id: PMID:17872950
        supporting_text: We have previously demonstrated that CHOP is regulated by the ubiquitin-proteasome
          system
      - reference_id: PMID:17872950
        supporting_text: The CHOP N-terminal domain is necessary not only for protein degradation but
          also for its transactivity and interaction with p300
