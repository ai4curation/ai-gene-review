core_functions:
- description: Sequence-specific, dimer-dependent activation of RNA polymerase II promoters during stress.
    CHOP binds a distinct cis-regulatory element (core PuPuPuTGCAAT(A/C)CCC, defined by in vitro selection
    with CHOP-C/EBP dimers) rather than canonical C/EBP sites, and drives transcription of pro-apoptotic
    and stress-adaptive targets. The best-mapped target is TNFRSF10B/DR5, where a CHOP site in the 5'
    flanking region is required for the thapsigargin response and where CHOP acts together with Elk1,
    c-Jun and ATF3; TRIB3 is activated by CHOP with ATF4 at overlapping amino-acid response and CHOP-binding
    elements. UniProt additionally records positive regulation of IL6, IL8, IL23, PPP1R15A/GADD34, BBC3/PUMA,
    BCL2L11/BIM and ERO1L.
  molecular_function:
    id: GO:0001228
    label: DNA-binding transcription activator activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  - id: GO:0070059
    label: intrinsic apoptotic signaling pathway in response to endoplasmic reticulum stress
  - id: GO:0140467
    label: integrated stress response signaling
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:1990617
    label: CHOP-ATF4 complex
  supported_by:
  - reference_id: PMID:8657121
    supporting_text: These sequences were found to contain a unique core element PuPuPuTGCAAT(A/C)CCC
  - reference_id: PMID:15322075
    supporting_text: we identified a potential CHOP-binding site in the 5'-flanking region of the DR5
      gene. Mutation of this site abrogated the enhanced reporter activity in response to THG treatment
  - reference_id: PMID:15775988
    supporting_text: the tunicamycin response region in the TRB3 promoter contains amino-acid response
      elements overlapping the CHOP-binding site, and CHOP and ATF4 cooperated to activate this promoter
      activity
  - reference_id: PMID:22065586
    supporting_text: cooperative effects among the transcriptional factors CHOP, Elk1, and c-Jun to enhance
      DR5 gene transcription
- description: Repression of transcription from a locus while bound to a partner transcription factor.
    At ASNS, CHOP binds ATF4, is found on the promoter by ChIP, and blocks ATF4-driven and amino-acid-deprivation-driven
    induction; repression needs the whole protein rather than leucine-zipper titration of ATF4, so it
    is corepression at the locus and not simple sequestration. The same repressive arm acts through CRE-driven
    promoters with ATF4/CREB-2 and, in human T cells, attenuates NF-kappaB- and NFAT-dependent cytokine
    genes. CHOP also represses MYOD1 and, together with the partner-sequestration mechanism recorded as
    GO:0140416, PPARG.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:18940792
    supporting_text: CHOP suppressed the induction of the endogenous asparagine synthetase (ASNS) gene
      and inhibited transcription from a reporter gene driven by the ASNS promoter following activation
      by ATF4 or amino acid deprivation
  - reference_id: PMID:18940792
    supporting_text: The CHOP-dependent repression of the ASNS gene required the entire CHOP protein,
      arguing against the possibility of simple sequestration of ATF4 by the CHOP leucine zipper domain
  - reference_id: PMID:11478948
    supporting_text: Cotransfection of CHOP with CREB-2 results in decreased activation driven by the
      cellular CRE motif or the HTLV-I proximal Tax-responsive element
  - reference_id: PMID:20829347
    supporting_text: ER stress-induced CHOP suppressed PPARγ transcription by sequestering C/EBPβ and
      limiting availability of C/EBPβ binding to the PPARγ promoter
- description: Partner selection by leucine-zipper heterodimerization, the switch that sets which of the
    two activities above is exercised. CHOP pairs with C/EBP family members, ATF4, ATF3 and roughly forty
    other bZIP proteins measured in vitro. Because its basic region diverges from the C/EBP consensus,
    CHOP-C/EBP dimers cannot bind common C/EBP sites, which makes CHOP a dominant-negative inhibitor at
    those promoters while redirecting the dimer to its own element; the CHOP-ATF3 dimer cannot bind the
    ATF/CRE consensus at all, so dimer formation inactivates ATF3. The interface is the leucine zipper
    (residues 134-148 of the bZIP domain), the module retained in the oncogenic FUS-DDIT3 fusion.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:8622660
    supporting_text: 'an ATF3-interacting protein, gadd153/Chop10, forms a nonfunctional heterodimer with
      ATF3: the heterodimer, in contrast to the ATF3 homodimer, does not bind to the ATF/cyclic AMP response
      element consensus site'
  - reference_id: PMID:8657121
    supporting_text: CHOP-C/EBP heterodimers are incapable of binding to a common class of C/EBP sites.
      With respect to such sites, CHOP serves as an inhibitor of the activity of C/EBP proteins
  - reference_id: PMID:23661758
    supporting_text: We studied the basic region-leucine zipper (bZIP) transcription factors and quantified
      bZIP dimerization networks for five metazoan and two single-cell species, measuring interactions
      in vitro for 2891 protein pairs
  - reference_id: PMID:8510758
    supporting_text: In TLS-CHOP the RNA-binding domain of TLS is replaced by the DNA-binding and leucine
      zipper dimerization domain of CHOP
suggested_questions:
- question: CHOP occupies the C/EBP-ATF composite sites of SNAT2, VEGF and CAT-1 by ChIP without changing
    their expression. Is that non-productive binding a distinct state (wrong partner, missing coactivator)
    or simply sub-threshold occupancy?
- question: Should the dominant-negative mechanism be modelled as transcription regulator inhibitor activity
    (GO:0140416, partner sequestration, as at PPARG) separately from corepressor activity at a locus (GO:0003714,
    as at ASNS)? Both are annotated for DDIT3 and the two mechanisms are experimentally distinguished
    in PMID:18940792, but nothing in the annotation records which target goes with which.
- question: Does human CHOP have any role in vascular development, or should the five Ensembl-propagated
    rows derived from the mouse ENPP1 study (GO:0060840, GO:1904738, GO:1990874, GO:0009611, GO:0036119)
    be retired in favour of the one row with a dedicated loss-of-function study behind it (GO:0001955)?
- question: AltDDIT3 (P0DPQ6) is an alternative-initiation ORF in the DDIT3 5'UTR that interacts with
    CHOP and co-localises with it. Does it modulate CHOP's transcriptional output, and should the DDIT3
    GO-CAM models include it?
suggested_experiments:
- hypothesis: The partner bZIP bound to CHOP at a given promoter, not the amount of CHOP, determines whether
    that promoter is activated or repressed.
  description: 'Perform partner-resolved occupancy at CHOP target promoters: ChIP-seq for CHOP alongside
    ATF4, ATF3, CEBPB and CEBPG in the same cells under tunicamycin, thapsigargin and amino-acid withdrawal,
    paired with re-ChIP or proximity ligation to establish which pairs co-occupy DR5, TRIB3, ASNS, PPARG,
    SNAT2 and CAT-1, and with matched RNA-seq to read out direction of effect. Repeat with zipper-swap
    CHOP variants that bias partner choice to test whether redirecting the partner flips the sign at a
    fixed promoter.'
  experiment_type: ChIP-seq / re-ChIP with partner-biased CHOP variants
- hypothesis: The adaptive-versus-terminal outcome is set by the duration of CHOP occupancy at pro-apoptotic
    promoters rather than by its peak level.
  description: Use a degron-tagged endogenous CHOP in a human cell line to impose defined pulses of CHOP
    at matched peak levels but different durations, with single-cell live imaging of a DR5 or PUMA reporter
    and of apoptosis onset. Comparing pulse duration against outcome separates level from persistence,
    which correlative induction time-courses cannot do.
  experiment_type: degron pulse-chase with single-cell reporter imaging
- hypothesis: Human CHOP is not a participant in arterial development; the mouse rows reflect stress-induced
    expression in injured vessels.
  description: 'Test the vascular claims directly in a human system: CHOP knockout in iPSC-derived vascular
    smooth muscle cells and endothelial cells, assayed for proliferation, migration and PDGF response
    with and without an ER stressor. A phenotype only under stress would argue the mouse annotations describe
    a stress response rather than a developmental role.'
  experiment_type: iPSC-derived vascular cell knockout phenotyping
knowledge_gaps:
- gap_statement: What makes CHOP induction adaptive in one cell and terminal in another is unknown. The
    same transcription factor is induced by every eIF2alpha kinase branch, yet most stressed cells recover;
    no measured property of CHOP itself (level, duration, partner occupancy, post-translational state)
    has been shown to determine whether the pro-apoptotic target set is engaged.
  boundary: 'Known: the target genes on both sides (DR5, PUMA, BIM, TRIB3 versus GADD34 and the recovery
    programme), that CHOP is short-lived, and that TRIB3 and GADD34 are CHOP targets that feed back on
    the pathway. Unknown: which variable selects the pro-apoptotic subset at a given promoter in a given
    cell.'
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: This is the decision point that ISR-targeted drugs such as ISRIB act around, and it determines
    whether inhibiting CHOP is protective or merely delays death.
  provenance:
  - reference_id: PMID:15775988
    supporting_text: knockdown of TRB3 expression decreased ER stress-dependent cell death
  - reference_id: PMID:33384352
    supporting_text: ER stress triggers the unfolded protein response (UPR), which can promote recovery
      of ER proteostasis and cell survival or trigger programmed cell death
- gap_statement: Which bZIP partner CHOP actually uses at a given promoter in a given cell is not known.
    Roughly forty partners have been measured in vitro by coiled-coil and bZIP arrays, but only a handful
    (ATF4, ATF3, CEBPB) have been placed on a specific endogenous target, and the in vitro affinity ranking
    has not been shown to predict promoter occupancy.
  boundary: 'Known: the in vitro dimerization network, three named complexes in GO, and ChIP occupancy
    of CHOP at ASNS, TRIB3, SNAT2, VEGF and CAT-1. Unknown: the partner composition of the complex at
    each of those sites, and whether CHOP occupancy without an effect on expression (as seen at SNAT2,
    VEGF and CAT-1) reflects a non-productive partner.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Partner identity is the only known determinant of whether CHOP activates or represses,
    so the composition rules are needed before CHOP's output can be predicted for any new target.
  provenance:
  - reference_id: PMID:18940792
    supporting_text: chromatin immunoprecipitation also showed that CHOP was associated with the C/EBP-ATF
      composite site regions of the SNAT2, VEGF, and CAT-1 genes, despite no significant effect on their
      expression after exogenous CHOP overexpression
  - reference_id: PMID:23661758
    supporting_text: Many metazoan bZIP orthologs and paralogs have strikingly different interaction specificities,
      and some differences arise from minor sequence changes
