description: 'DDIT3 (CHOP, GADD153, C/EBP-zeta) is a small, largely disordered bZIP transcription factor
  that is nearly absent from unstressed cells and is strongly induced by endoplasmic reticulum stress,
  amino-acid deprivation, oxidative stress and hypoxia, principally through eIF2alpha phosphorylation
  and ATF4 and additionally through the ATF6 branch of the unfolded protein response. It is cytoplasmic
  at rest and accumulates in the nucleus on stress. CHOP has no appreciable activity as a monomer: its
  basic region diverges from that of other C/EBP proteins, so CHOP-containing dimers cannot use canonical
  C/EBP sites and instead recognise a distinct element, and the identity of its bZIP partner determines
  its output. Paired with ATF4 or C/EBP family members it activates pro-apoptotic and stress-adaptive
  genes, among them TNFRSF10B/DR5, TRIB3, PPP1R15A/GADD34, BBC3/PUMA, BCL2L11/BIM, ERO1L and IL8; at other
  promoters the same dimers repress, as at ASNS, where CHOP binds the promoter with ATF4 and blocks its
  induction, and at PPARG and MYOD1, which it represses by sequestering C/EBP-beta. It also inactivates
  partners outright, forming a DNA-binding-incompetent heterodimer with ATF3 and binding TCF7L2 to block
  canonical Wnt output. The net effect of sustained induction is the terminal, pro-apoptotic arm of the
  ER stress response, and CHOP induction is the standard readout for integrated stress response activation,
  including the mitochondrial OMA1-DELE1-HRI branch. CHOP is a short-lived protein turned over by the
  ubiquitin-proteasome system, and the gene is the 3'' partner of the FUS-DDIT3 fusion that defines myxoid
  liposarcoma.'
