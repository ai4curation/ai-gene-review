id: Q9UFF9
gene_symbol: CNOT8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CNOT8 is a DEDD-family CAF1/POP2 deadenylase that supplies one of the poly(A)-specific ribonuclease
  subunits of the CCR4-NOT mRNA deadenylase complex. It is the CNOT7 paralog in vertebrate CAF1 modules
  and pairs with CCR4-family CNOT6 or CNOT6L enzymes on the CNOT1 scaffold. CNOT8 acts mainly in cytoplasmic
  mRNA turnover, including bulk deadenylation, miRNA-triggered mRNA destabilization and AU-rich-element
  mRNA decay, and it can associate with BTG/TOB recruitment factors and cytoplasmic mRNA-decay assemblies.
  Its function partially overlaps with CNOT7, but CNOT7 and CNOT8 are both needed for efficient proliferation
  in human-cell knockdown experiments.'
