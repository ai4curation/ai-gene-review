core_functions:
- description: CNOT8/POP2 is a CAF1-family catalytic subunit of CCR4-NOT that hydrolyzes mRNA 
    poly(A) tails from the 3' end. Human POP2 directly degrades poly(A) in vitro, its DEDD 
    active-site mutant dominantly interferes with let-7-directed deadenylation in cells, and 
    CNOT7/CNOT8 depletion blocks TTP-directed deadenylation. CNOT8 assembles on CNOT1 with a 
    CCR4-family nuclease, acts in cytosolic CCR4-NOT complexes, and can contribute the same 
    catalytic module to miRNA- and AU-rich-element-recruited mRNA decay.
  molecular_function:
    id: GO:0004535
    label: poly(A)-specific ribonuclease activity
  directly_involved_in:
  - id: GO:0000289
    label: nuclear-transcribed mRNA poly(A) tail shortening
  - id: GO:0000288
    label: nuclear-transcribed mRNA catabolic process, deadenylation-dependent decay
  - id: GO:0035279
    label: miRNA-mediated gene silencing by mRNA destabilization
  in_complex:
    id: GO:0030014
    label: CCR4-NOT complex
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:15769875
    supporting_text: both human factors degrade poly(A) tails
  - reference_id: PMID:20065043
    supporting_text: CAF1-mut and POP2-mut each brought BG+L7 deadenylation almost to a halt
  - reference_id: PMID:20595389
    supporting_text: CAF1a and CAF1b were found to interact with TTP in an RNA-independent fashion
  - reference_id: PMID:22977175
    supporting_text: GST-tagged CAF1 or POP2 and MBP-tagged NOT1 fragments
suggested_questions:
- question: How do endogenous human CNOT8-containing and CNOT7-containing CCR4-NOT variants differ 
    in RNA-target choice, tissue use and recruitment by BTG/TOB, TTP or miRISC factors?
- question: Which cached or future CNOT8-specific evidence establishes nuclear functions, and are 
    they catalysis-dependent or indirect consequences of cytoplasmic mRNA decay?
- question: Does endogenous human CNOT8 stably concentrate in P-bodies, or are CNOT8-containing 
    complexes mostly diffuse cytosolic deadenylases that visit condensates only in particular 
    contexts?
suggested_experiments:
- description: Use matched endogenous CNOT7 and CNOT8 tagging plus CNOT7/CNOT8 single and double 
    rescue with catalytic and NOT1-binding mutants to quantify complex assembly, P-body recruitment,
    poly(A)-tail shortening and transcript half-lives in the same human-cell background.
- description: Reconstitute otherwise identical human CCR4-NOT complexes containing CNOT8 or CNOT7 
    with CNOT6 or CNOT6L and compare their poly(A) specificity, catalytic rates and regulation by 
    BTG/TTP/miRISC recruitment motifs.
