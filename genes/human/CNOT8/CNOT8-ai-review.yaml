  review:
    summary: CNOT8 is an ancestral CAF1/POP2 nuclease that participates in deadenylation-dependent 
      mRNA decay.
    action: ACCEPT
    reason: The root PANTHER IBD assigns the conserved eukaryotic CAF1/POP2 deadenylation role to 
      the CNOT7/CNOT8 family, no PAINT loss blocks CNOT8, and human CNOT8 has direct 
      poly(A)-directed nuclease and miRNA/TTP deadenylation evidence. The historical PAINT alignment
      was not reconstructed; the target-specific evidence supports the extant ancestral call.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:15769875
      supporting_text: both human factors degrade poly(A) tails
    - reference_id: PMID:20065043
      supporting_text: CAF1-mut and POP2-mut each brought BG+L7 deadenylation almost to a halt
    - reference_id: PMID:20595389
      supporting_text: CAF1a and CAF1b were found to interact with TTP in an RNA-independent fashion
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000084083
        source_status: SUPPORTS_TRANSFER
        comment: The root CAF1/POP2 IBD is consistent with direct human CNOT8 nuclease evidence and 
          no CNOT8-lineage PAINT loss was reported.
- term:
    id: GO:0000289
    label: nuclear-transcribed mRNA poly(A) tail shortening
  evidence_type: NAS
  original_reference_id: PMID:31320642
  qualifier: involved_in
  review:
    summary: CNOT8 contributes catalytic CAF1/POP2 activity to nuclear-transcribed mRNA poly(A)-tail
      shortening.
    action: ACCEPT
    reason: The 2019 recombinant human complex used the CNOT7/CAF1 paralog rather than CNOT8/POP2, 
      but it establishes how the human CAF1 nuclease module shortens poly(A) in the assembled 
      CCR4-NOT complex. CNOT8-specific assays independently show that POP2 degrades poly(A) and can 
      dominantly block miRNA-directed deadenylation when its DEDD active site is mutated.
    supported_by:
    - reference_id: PMID:31320642
      supporting_text: CCR4-NOTFULL efficiently degraded the poly(A) tail
    - reference_id: PMID:15769875
      supporting_text: both human factors degrade poly(A) tails
    - reference_id: PMID:20065043
      supporting_text: CAF1-mut and POP2-mut each brought BG+L7 deadenylation almost to a halt
