- term:
    id: GO:0021817
    label: nucleokinesis involved in cell motility in cerebral cortex radial glia guided migration
  evidence_type: ISS
  original_reference_id: PMID:32619477
  qualifier: involved_in
  review:
    summary: Nesprin-2 recruits BICD2, and through it dynein and kinesin-1, to the nuclear envelope of
      migrating cortical neurons; disrupting this interaction severely inhibits nuclear movement while
      centrosome advance continues. Syne-2 loss in mouse likewise disrupts radial migration and interkinetic
      nuclear migration.
    action: NEW
    reason: 'Participation test: nesprin-2 does part of the work of nucleokinesis by providing the structural
      link through which motor force is applied to the nucleus (the scaffold/anchor case), not merely
      by being required. Comparator: other nuclear-envelope motor adaptors in this process (BICD2, SUN1/SUN2
      are the analogous anchor-role proteins) carry nuclear migration terms; the specific nucleokinesis
      term is justified by rodent in vivo data transferred to the conserved human ortholog.'
    supported_by:
    - reference_id: PMID:32619477
      supporting_text: We find further that, surprisingly, the motor proteins interact with Nesprin-2
        through the dynein/kinesin "adaptor" BicD2, both in neurons and in non-mitotic fibroblasts.
    - reference_id: PMID:32619477
      supporting_text: Although disruption of the Nesprin-2/BicD2 interaction severely inhibited nuclear
        movement, centrosome advance proceeded unimpeded, supporting an independent mechanism for centrosome
        advance.
    - reference_id: PMID:32619477
      supporting_text: We find that an ∼100-kDa "mini" form of the ∼800-kDa Nesprin-2 protein, which binds
        dynein and kinesin, is sufficient, remarkably, to support neuronal migration.
    - reference_id: PMID:19874786
      supporting_text: Our current study uncovers a somewhat surprising function of Syne-1 and Syne-2
        in connecting the NE to the microtubule network during radial neuronal migration and interkinetic
        nuclear movement.
