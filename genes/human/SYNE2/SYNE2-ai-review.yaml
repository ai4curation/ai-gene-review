core_functions:
- description: 'As the outer-nuclear-membrane KASH subunit of LINC complexes, nesprin-2 links the cytoskeleton
    to the nucleus: its KASH peptide binds SUN1/SUN2 in the perinuclear space while its cytoplasmic domains
    bind F-actin (TAN lines) or recruit dynein-dynactin and kinesin-1 through BICD2, allowing force-driven
    nuclear movement and positioning.'
