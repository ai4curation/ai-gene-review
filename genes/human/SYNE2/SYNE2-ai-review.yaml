id: Q8WXH0
gene_symbol: SYNE2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SYNE2 encodes nesprin-2, a family of spectrin-repeat proteins produced from a very large
  gene by alternative promoters and splicing. The giant isoform (nesprin-2G, NUANCE, ~800 kDa) has N-terminal
  paired calponin-homology domains that bind F-actin, a long spectrin-repeat rod, and a C-terminal transmembrane
  KASH domain that anchors it in the outer nuclear membrane. In the perinuclear space the KASH peptide
  binds trimeric SUN1/SUN2 of the inner nuclear membrane, forming the LINC (linker of nucleoskeleton and
  cytoskeleton) complex that transmits cytoskeletal forces to the nuclear lamina. Nesprin-2G assembles
  with SUN2 into transmembrane actin-associated nuclear (TAN) lines that couple the nucleus to retrograde
  actin flow, moving the nucleus and reorienting the centrosome in migrating fibroblasts; the formin FHOD1
  reinforces this coupling. Through the adaptor BICD2, nesprin-2 also recruits cytoplasmic dynein-dynactin
  and kinesin-1 to the nuclear envelope, providing the nuclear attachment for motor-driven nucleokinesis
  in migrating neurons and interkinetic nuclear migration in neural progenitors, and it is required for
  centrosome migration during ciliogenesis. Shorter isoforms lacking the actin-binding or KASH domains
  localize to the inner nuclear membrane (where they bind lamin A and emerin), nucleoplasm, sarcoplasmic
  reticulum, sarcomeric Z-discs and focal adhesions. SYNE2 variants are associated with Emery-Dreifuss
  muscular dystrophy.
