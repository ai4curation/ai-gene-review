suggested_questions:
- question: Which endogenous HNF4G target genes in intestine or urothelium are directly regulated by HNF4G rather than inferred from HNF4A biology or cancer overexpression systems?
suggested_experiments:
- description: Map endogenous HNF4G occupancy and HNF4G-dependent nascent transcription in normal human intestinal epithelial cells to distinguish direct HNF4G targets from bladder-cancer-specific HAS2 regulation.
