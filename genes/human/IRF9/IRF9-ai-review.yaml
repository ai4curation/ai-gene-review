suggested_questions:
- question: Should GO:0060337 type I interferon-mediated signaling pathway be annotated to IRF9 in human
    and mouse, as it is for the other ISGF3 subunits STAT1 and STAT2, or is its absence a deliberate convention?
- question: Does IRF9 contribute to type III (IFN-lambda) and type II (IFN-gamma) responses in human cells
    to the same extent as reported for mouse p48-deficient cells?
- question: How much of IRF9 function in vivo depends on the acetylation-dependent docking on IFNAR2 reported
    in a single study, versus STAT2 binding alone?
suggested_experiments:
- description: IRF9 ChIP-seq or CUT&RUN in IRF9-deficient patient cells reconstituted with wild-type or
    IAD-mutant IRF9 after IFN-alpha, IFN-lambda and IFN-gamma, to define the ISGF3- and IRF9-dependent
    cistrome per interferon type.
- description: Test DNA binding and transcriptional activity of IRF9 alone versus in complex with STAT2
    (without STAT1) to separate IRF9 DNA recognition from transactivation contributed by STAT2.
