  qualifier: involved_in
  review:
    summary: IRF9 is the DNA-binding subunit of ISGF3, the effector transcription factor of type I interferon
      signalling. Patient cells with loss-of-function IRF9 form GAF but not ISGF3 after IFN-alpha2b, lose
      ISRE binding and ISRE-driven transcription, and are rescued by wild-type IRF9.
    action: NEW
    reason: 'IRF9 performs a step of the pathway itself (ISRE recognition by ISGF3), so this is participation,
      not substrate-like necessity. Comparator check: the two other ISGF3 subunits in the same role, STAT1
      (P42224, IDA PMID:23386060) and STAT2 (P52630, IMP), both carry GO:0060337 in GOA; human and mouse
      IRF9 lack it. Mouse Irf9 knockout cells (same PANTHER subfamily PTHR11949:SF26) likewise lack ISRE
      binding after IFN stimulation (PMID:9078371).'
    supported_by:
