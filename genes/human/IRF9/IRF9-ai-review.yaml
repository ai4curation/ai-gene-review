id: Q00978
gene_symbol: IRF9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Interferon regulatory factor 9 (IRF9; ISGF3 gamma, p48) is a member of the IRF family of
  transcription factors, with an N-terminal tryptophan-repeat IRF DNA-binding domain and a C-terminal
  IRF-association domain (IAD). IRF9 is the DNA-recognition subunit of the interferon-stimulated gene
  factor 3 (ISGF3) complex. After type I interferon stimulation, JAK-mediated tyrosine phosphorylation
  of STAT1 and STAT2 allows the STAT1:STAT2 heterodimer to associate with IRF9, which binds the STAT2
  coiled-coil domain through its IAD. The ternary complex accumulates in the nucleus and binds IFN-stimulated
  response elements (ISREs) to activate transcription of interferon-stimulated genes that establish an
  antiviral state. IRF9 is found in both cytoplasm and nucleus, with a basal nuclear pool. Elevated levels
  of unphosphorylated STAT1, STAT2 and IRF9 can form an unphosphorylated ISGF3 that sustains expression
  of a subset of ISGs. Biallelic loss-of-function IRF9 variants cause an autosomal recessive immunodeficiency
  (IMD65) with severe viral infections, notably life-threatening influenza pneumonitis, reflecting loss
  of ISGF3-dependent responses.
