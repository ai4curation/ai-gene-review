id: Q02363
gene_symbol: ID2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ID2 is a helix-loop-helix transcriptional regulator inhibitor that lacks a basic DNA-binding region and antagonizes DNA-binding bHLH transcription factors through HLH-mediated dimerization. It acts in nuclear and cytoplasmic compartments to control E-protein and CLOCK/BMAL1 transcriptional outputs, and its context-specific regulation affects cell-cycle progression, senescence, circadian programs, differentiation, and mammalian development.
