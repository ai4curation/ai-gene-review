description: ZDHHC23 is a membrane-associated DHHC protein S-palmitoyltransferase. It contributes to reversible
  lipidation of protein substrates, including the BK potassium-channel subunit KCNMA1, and helps regulate
  delivery of that channel to the cell surface.
