taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ZDHHC23 (DHHC-23) is a polytopic integral membrane protein S-acyltransferase of the DHHC family, with
  six predicted transmembrane helices and a cytoplasmic DHHC cysteine-rich domain whose catalytic cysteine (C289)
  forms an acyl-enzyme intermediate. It localizes mainly to Golgi and trans-Golgi network membranes, where it transfers
  palmitate (and related long-chain acyl groups) from acyl-CoA to cysteine residues of protein substrates. Its best-established
  substrate is the pore-forming alpha subunit of the BK potassium channel (KCNMA1): together with ZDHHC22 it S-acylates
  cysteines in the intracellular S0-S1 loop, which promotes channel exit from the TGN and surface expression and,
  in cells that co-express the beta1 subunit, governs functional coupling of alpha and beta1 subunits. Further substrates
  and roles, such as GFAP palmitoylation in spinal astrocytes and regulation of BMI1 ubiquitination through RNF144A
  in glioma stem cells, have been reported in single studies.'
