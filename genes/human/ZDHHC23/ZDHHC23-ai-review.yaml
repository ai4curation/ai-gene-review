suggested_questions:
- question: Beyond KCNMA1, which endogenous proteins are S-acylated by ZDHHC23 in neurons and smooth muscle, and
    is GFAP a direct substrate as proposed in astrocytes?
- question: Does ZDHHC23 have any measurable activity or residence in the ER, as propagated from the DHHC family
    node, or is it restricted to Golgi/TGN membranes?
suggested_experiments:
- description: Acyl-biotin exchange or click-chemistry proteomics in Zdhhc23 knockout versus wild-type tissue, with
    rescue by wild-type versus DHHS (C289S) catalytic-dead ZDHHC23, to define direct substrates.
