- term:
    id: GO:0006924
    label: activation-induced cell death of T cells
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: CORE FUNCTION of membrane-bound FAS. Activation-induced cell death (AICD)
      is a critical mechanism for T cell homeostasis where repeated TCR stimulation
      induces FAS and FasL expression, creating an autocrine/paracrine death signal
      that terminates immune responses. The deep research (FAS-deep-research-perplexity.md)
      confirms FAS-FasL interactions participate in AICD of mature T-cells.
    action: ACCEPT
    reason: Well-established core function of FAS in immune regulation. AICD via FAS-FasL
      is essential for peripheral tolerance and termination of immune responses. Defects
      in this pathway cause ALPS (autoimmune lymphoproliferative syndrome).
    supported_by:
    - reference_id: PMID:7538907
      supporting_text: Overexpression of FADD in MCF7 and BJAB cells induces apoptosis,
        which, like Fas-induced apoptosis, is blocked by CrmA, a specific inhibitor
        of the interleukin-1 beta-converting enzyme.
    - reference_id: PMID:39060684
      supporting_text: Autoimmune lymphoproliferative syndrome (ALPS) is a rare primary
        immunodeficiency disorder of defective Fas-mediated apoptosis (restimulation-induced
        cell death), featuring chronic lymphadenopathy, splenomegaly, cytopenias,
        and increased lymphoma risk.
    - reference_id: file:human/FAS/FAS-deep-research-falcon.md
      supporting_text: A large 2024 cohort study of **802** individuals referred for
        ALPS NGS testing (May 2014–Jan 2023) provides quantitative, clinically grounded
        evidence linking FAS to immune homeostasis via apoptosis regulation
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:95484
  - PANTHER:PTN002930185
- term:
    id: GO:0031265
    label: CD95 death-inducing signaling complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: ISOFORM-SPECIFIC (membrane-bound isoform 1 only). FAS is a core component
      of the CD95 death-inducing signaling complex (DISC), which forms upon FasL binding
      and consists of FAS, FADD, and procaspase-8. The Fas-FADD death domain complex
      forms an asymmetric oligomeric structure of 5-7 Fas DD and 5 FADD DD [PMID:20935634].
      This is the defining functional complex for FAS-mediated apoptosis.
    action: ACCEPT
    reason: 'DISC localization is the core functional context for membrane-bound FAS.
      Structural studies confirm the oligomeric Fas-FADD complex architecture. Note:
      Soluble FAS isoforms cannot form DISC as they lack the transmembrane domain
      needed for membrane anchoring and proper DISC assembly.'
    supported_by:
    - reference_id: PMID:20935634
      supporting_text: The death-inducing signaling complex (DISC) formed by the death
        receptor Fas, the adaptor protein FADD and caspase-8 mediates the extrinsic
        apoptotic program
    - reference_id: PMID:40330016
      supporting_text: Upon binding to mFASL, FAS recruits the adaptor protein FAS-associated
        death domain (FADD), which recruits procaspase-8, procaspase-10, and cellular
        FLICE inhibitory protein (c-FLIP) via their homotypic death effector domain
        (DED), forming a membrane-bound death-inducing signaling complex (DISC)
    - reference_id: file:human/FAS/FAS-deep-research-falcon.md
      supporting_text: Upon ligand binding, conformational changes allow FAS DD engagement
        with **FADD**, which then recruits DED-containing proteins **procaspase-8/10**
        and **c-FLIP** isoforms to form the membrane-associated **DISC**; this supports
        procaspase-8 activation, which then activates effector caspases (e.g., caspase-3/-7)
        to execute apoptosis.
  qualifier: part_of
  supporting_entities:
  - MGI:MGI:95484
  - PANTHER:PTN002930185
  - RGD:619831
  - UniProtKB:P25445
- term:
    id: GO:0032872
    label: regulation of stress-activated MAPK cascade
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: FAS ligation activates stress-activated protein kinases including ASK1
      and JNK/SAPK under certain conditions, particularly glutamine deprivation [PMID:11096076].
      This represents a non-apoptotic signaling output of FAS activation that can
      modulate cellular stress responses.
    action: KEEP_AS_NON_CORE
    reason: FAS can regulate MAPK cascades but this is not its primary function. The
      deep research confirms non-apoptotic signaling pathways exist but the core function
      remains apoptosis induction. This annotation reflects ancillary signaling.
    supported_by:
    - reference_id: PMID:11096076
      supporting_text: Fas ligation activated apoptosis signal-regulating kinase 1
        (ASK1) and c-Jun N-terminal kinase (JNK; also known as stress-activated protein
        kinase (SAPK)) in Gln-deprived cells
    - reference_id: PMID:40330016
      supporting_text: Upon activation, FAS triggers signaling pathways such as NF-κB,
        MAPK, and PI3K/AKT through different mechanisms. These pathways regulate immune
        responses and promote cell proliferation, migration, and invasion by inducing
        the production of inflammatory factors and chemokines
    - reference_id: file:human/FAS/FAS-deep-research-falcon.md
      supporting_text: A key contemporary view is that CD95 can also act as a **multifunctional
        signaling receptor**, activating programs such as **NF-κB** and **MAPK (ERK/JNK/p38)**,
        supporting outcomes including chemokine release and cellular migration/invasion
        in certain contexts.
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002930185
  - UniProtKB:P25445
