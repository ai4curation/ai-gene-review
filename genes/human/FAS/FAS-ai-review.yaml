- term:
    id: GO:0005031
    label: tumor necrosis factor receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: FAS is an inherited death receptor in the experimentally grounded FAS clade; the literal
      TNF-cytokine specificity of this term is inappropriate.
    action: MODIFY
    reason: The actual PTHR46874 tree places human P25445 below IBD node PTN002930185; its target alignment
      matches the canonical sequence and no family NOT was found. Human self-WITH is expected experimental
      grounding, not circularity. GO:0005031 specifies binding the TNF cytokine, whereas the inspected
      human PMID:12221075 Methods/Results use anti-CD95 to initiate receptor-dependent death. Rat PMID:16154149
      concerns Fas/FasL-dependent Kupffer-cell apoptosis and does not establish TNF binding to FAS in
      its accessible abstract. The inherited death-receptor mechanism is sound; refine the ancestral functional
      scope to GO:0005035, which includes ligand-initiated apoptotic or necrotic death. The retained superfamily/provider
      quotations establish identity/context, not literal TNF ligand specificity.
    supported_by:
    - reference_id: PMID:1375228
      supporting_text: The deduced amino acid sequence of APO-1 showed sequence identity with the Fas
        antigen, a cysteine-rich transmembrane protein of 335 amino acids with significant similarity
        to the members of the tumor necrosis factor/nerve growth factor receptor superfamily.
    - reference_id: file:human/FAS/FAS-deep-research-perplexity.md
      supporting_text: 'provider: perplexity'
    - reference_id: file:human/FAS/FAS-deep-research-falcon.md
      supporting_text: The gene symbol **FAS** here refers to the human cell-surface death receptor **CD95/APO-1**,
        a **type I transmembrane** member of the TNF receptor superfamily (TNFRSF6) with extracellular
        **cysteine-rich domains (CRDs)** and a cytosolic **death domain (DD)** that recruits the adaptor
        **FADD** to assemble a **death-inducing signaling complex (DISC)**, consistent with UniProt accession
        **P25445**.
