  - PANTHER:PTN002930185
- term:
    id: GO:0097527
    label: necroptotic signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: FAS can trigger necroptotic cell death through RIP1 (RIPK1) when caspase
      activity is inhibited. FAS interacts with RIP1 via death domain interactions
      [PMID:7538908]. RIP-mediated necrosis involves inhibition of ADP/ATP exchange
      [PMID:16507998]. This represents an alternative cell death pathway downstream
      of FAS activation.
    action: KEEP_AS_NON_CORE
    reason: Necroptosis is a secondary pathway activated when apoptosis is blocked.
      The primary function of FAS is apoptosis induction; necroptosis occurs under
      specific conditions (caspase inhibition). This is a valid but non-core function.
    supported_by:
    - reference_id: PMID:7538908
      supporting_text: 'Using a genetic selection based on protein-protein interaction
        in yeast, we have identified two gene products that associate with the intracellular
        domain of Fas: Fas itself, and a novel 74 kDa protein we have named RIP'
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:95484
  - PANTHER:PTN002930185
  - UniProtKB:P25445
