- term:
    id: GO:0097049
    label: motor neuron apoptotic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: FAS can mediate motor neuron apoptosis. The deep research mentions FAS
      expression in the developing nervous system and its role in neuronal cell death.
      However, this represents a tissue-specific manifestation of FAS apoptotic function
      rather than a distinct mechanism.
    action: KEEP_AS_NON_CORE
    reason: While FAS can mediate motor neuron apoptosis, this is a context-specific
      application of its general apoptotic function. The core function is death receptor
      activity and apoptosis induction, which applies across cell types. Motor neuron
      apoptosis is one of many cellular contexts where FAS functions.
    supported_by:
    - reference_id: PMID:7538907
      supporting_text: Overexpression of FADD in MCF7 and BJAB cells induces apoptosis,
        which, like Fas-induced apoptosis, is blocked by CrmA
  qualifier: involved_in
