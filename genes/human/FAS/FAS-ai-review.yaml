  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual cached primary Results123–161 and Methods187–235 selected nonduplicated blocks,
      including Figures5–7 captions. No figure pixels or supplement body read. Human HeLa WT-FAS and glycomutants
      are surface-localized by flow cytometry and confocal microscopy (Results129/Fig5B). Anti-FAS DISC
      immunoprecipitation detects FADD and CASP8 in HeLa and endogenous SKW6.4/Hut78 experiments (Fig5C,6B,7A;
      Methods219). FAS agonists cause apoptosis, modulated by glycosylation perturbations. Association
      within the DISC does not confer caspase activity on FAS. HeLa experiments retain endogenous FAS
      and authors explicitly limit mutant interpretations. VCN/tunicamycin have additional toxicity/translation
      effects; DMM effects depend on stimulus strength. Glycosylation-site mutants are engineered constructs,
      not natural isoforms. No universal glycosylation requirement inferred. Identifier/title checked
      against the preserved authentic publication record; VERIFIED refers to citation identity and the
      explicitly bounded supporting scope, not to inaccessible assays.
- id: PMID:21803845
  title: PMLRARα binds to Fas and suppresses Fas-mediated apoptosis through recruiting c-FLIP in vivo.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original main Methods163–201 and Results203–289 with Figures1–6 captions; indexed primary
      result includes Fig7 mapping and discussion. Supplement contains additional procedural detail and
      has not been read; no pixels read. Human HL60/HEK293 FAS–PML reciprocal co-IP Fig1B is distinct
      from fusion PMLRARα assays. Fig5B/C detects FAS with FASL in U937/PR9 and NB4; Fig6A anti-FAS IP
      in CH11-treated U937/PR9 detects FADD, CFLAR and CASP8 with changed recruitment upon PMLRARα expression.
      Fig6B human APL primary-cell anti-FAS IP also contains CFLAR. These directly support all five partner
      contexts and FAS-containing DISC. Co-IP is complex association, not independent direct binary contacts.
      Positive PML evidence is not merely PMLRARα fusion evidence. NB4 fractionation resolves combined
      cytosolic/membrane fraction, not pure cytosol. Mouse tissue/overexpression results remain separate.
      No partner enzyme function transferred. Identifier/title checked against the preserved authentic
