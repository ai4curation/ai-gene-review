- id: PMID:25301068
  title: Fas palmitoylation by the palmitoyl acyltransferase DHHC7 regulates Fas stability.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Cached original Results99–107 and113–131; Methods155–213, specifically surface flow193,
      surface biotinylation197, Brij98/sucrose-gradient DRM205 and constructs. Main Result statements
      positive; figure pixels/supplements not read. Human SW480 endogenous and WT-transfected FAS surface
      expression by intact-cell flow cytometry and cold membrane-impermeant surface biotinylation. DRM
      isolation resolves FAS with27% in DRM fraction control vs14% after DHHC7 depletion. SW480/620 and
      engineeredC199V evidence separate. Supports plasma membrane and raft-associated pools, not exclusive
      raft location. FAS is the palmitoylated substrate; DHHC7 performs the acyltransferase step. Golgi
      DHHC7 localization is not directly measured FAS Golgi location. No natural isoform assignment. Independent
      database-lane scope: Independently read original Results101/105/107 and Methods167/169/177/193/197/205:
      endogenous/transfected human SW480 FAS surface flow cytometry and cold biotinylation, and a detergent-resistant
      pool reduced after DHHC7 depletion. FAS is a palmitoylation substrate, not an acyltransferase; Golgi
      localization of DHHC7 is not measured FAS Golgi location. No natural-isoform or pixel inference.
      Identifier/title checked against the preserved authentic publication record; VERIFIED refers to
      citation identity and the explicitly bounded supporting scope, not to inaccessible assays.


      Additional accepted database assessment: Whole database-lane scope: independently read original
      Results101/105/107 and Methods167/169/177/193/197/205. Endogenous/transfected human SW480 FAS is
