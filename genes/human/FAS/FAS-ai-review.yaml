- id: PMID:10871852
  title: p38 protects human melanoma cells from UV-induced apoptosis through down-regulation of NF-kappaB
    activity and Fas expression.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Actual original PDF pages2/3/5/7/8/9: Results/Figure4D (printed3007), surface-flow
      assays, and Methods printed3010–3011. No pixels. In human LU1205 melanoma cells antagonistic anti-FAS
      reduces UV-induced apoptosis; comparison with IκB-DN cells and TNFR1 blockade separates FAS and
      TNFR1 routes. Surface FAS was measured by flow cytometry. NF-kappaB regulates FAS expression in
      this study; the experiments do not establish FAS as an NF-kappaB transcriptional regulator. No mouse
      fibroblast assay inferred. Identifier/title checked against the preserved authentic publication
      record; VERIFIED refers to citation identity and the explicitly bounded supporting scope, not to
      inaccessible assays.'
- id: PMID:10875918
  title: Fas preassociation required for apoptosis signaling and dominant inhibition by pathogenic mutations.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Actual original FAS article lines57–415 of combined PDF; Results86–196, Discussion228–250,
      Methods notes20/22/24/29 at281–326 and359–399; figure captions, no pixel read. Adjacent articles
      excluded. Human FAS constructs associate by co-IP and CFP/YFP FRET in293T cells; CRD1 deletions
      disrupt association. Endogenous human H9 crosslinking shifts receptor into higher mass species without
