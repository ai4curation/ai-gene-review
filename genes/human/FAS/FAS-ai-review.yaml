- term:
    id: GO:0031265
    label: CD95 death-inducing signaling complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: FAS is the receptor component of the CD95 death-inducing signaling complex.
    action: ACCEPT
    reason: The human target lies below the actual PTN002930185 IBD; self-WITH is legitimate. PMID:20935634
      examines reconstituted human FAS-DD/FADD-DD assemblies and interface-dependent signaling in human
      cells, while its crystal uses mouse FAS-DD with human FADD-DD. The actual Reactome entities independently
      contain P25445 in the FASL:FAS:FADD/procaspase complex. Retain DISC membership without imposing
      one fixed oligomeric stoichiometry or treating the receptor as a caspase enzyme. Rat PMID:16493077
      was only abstract-read and is not used as a fully verified independent assembly experiment.
    supported_by:
    - reference_id: PMID:20935634
      supporting_text: The death-inducing signaling complex (DISC) formed by the death receptor Fas, the
        adaptor protein FADD and caspase-8 mediates the extrinsic apoptotic program
    - reference_id: PMID:40330016
      supporting_text: Upon binding to mFASL, FAS recruits the adaptor protein FAS-associated death domain
        (FADD), which recruits procaspase-8, procaspase-10, and cellular FLICE inhibitory protein (c-FLIP)
        via their homotypic death effector domain (DED), forming a membrane-bound death-inducing signaling
        complex (DISC)
    - reference_id: file:human/FAS/FAS-deep-research-falcon.md
      supporting_text: Upon ligand binding, conformational changes allow FAS DD engagement with **FADD**,
        which then recruits DED-containing proteins **procaspase-8/10** and **c-FLIP** isoforms to form
        the membrane-associated **DISC**; this supports procaspase-8 activation, which then activates
        effector caspases (e.g., caspase-3/-7) to execute apoptosis.
    additional_reference_ids:
    - PMID:20935634
    - PMID:16493077
  qualifier: part_of
  supporting_entities:
  - MGI:MGI:95484
  - PANTHER:PTN002930185
  - RGD:619831
