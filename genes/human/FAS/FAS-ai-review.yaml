references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official method and current InterPro2GO mappings were read; actual target matches include
      IPR008063 FAS receptor and IPR000488 death domain. Whole-source scope covers receptor activity,
      apoptosis (fresh62), immune response, signal transduction and membrane. The broad predictions agree
      with human receptor/DISC and surface evidence. Domain presence does not establish activity in every
      natural product.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Actual PTHR46874 v19 tree, target MSA and IBD records place P25445 leaf PTN002508085
      below PTN002930185 through a ten-node path. All nine source assertions match that ancestor; no family
      or target-path NOT was found. Human self-WITH is expected experimental grounding. Whole scope: receptor
      activity is refined to death receptor activity because literal TNF-cytokine specificity is unsupported
      by the inspected FAS assays; raft, external membrane, AICD and DISC are retained; stress MAPK, soluble-product
      negative apoptosis, injury-associated motor-neuron apoptosis and conditional necroptosis are non-core.
      Mouse donor originals 7595210/13679421 and 21052097 were read at the explicitly documented scopes;
      the last uses human FAS expressed in mouse L929 cells. Rat donors and several mouse AICD sources
      remain abstract-only. The inherited quote about FADD is not motor-neuron proof, and the RIP-association
      quote is not by itself necroptosis proof. No donor-count or self-WITH penalty was used.'
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official method now states keyword-to-GO annotation is restricted to viruses, formerly
      all species. Historical human KW-0112 calmodulin-binding source is absent from the current export.
      Binding remains biologically supported by the actual PMID:24914971 FAS-peptide SPR caption and deposited
      3EWT complex; full-receptor mechanism is not inferred. Source lifecycle and the positive non-core
      biological judgment are separate.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official location-mapping method and actual target UniProt subcellular annotations were
      read for SL-0243 extracellular region, SL-0039 plasma membrane and SL-0370 raft. These locations
      concern different FAS product/pool contexts. Human surface and raft assays corroborate the membrane
      assertions. UniProt secreted isoforms are not independently assayed one by one by this mapping;
      isoform 6 retains the death-domain sequence and isoform 7 retains the transmembrane sequence, so
      universal product restrictions from the earlier prose are not justified.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official method is curation of immunofluorescence data. Actual HPA FAS v25 XML/page,
      antibody HPA027444 antigen and A-431/U-251 MG images were read. Supported plasma-membrane signal
      is accompanied by additional cytosol/nuclear-body annotations. This supports the imported plasma-membrane
      CC, without exclusivity or natural-isoform resolution.
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology links
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official logical-inference method and this exact source premise GO:0005031 were
      inspected. The literal TNF-receptor-to-TNF-pathway implication is mechanically understandable but
      biologically too specific for the FAS assays. Refine the downstream assertion to GO:0036337 Fas
      signaling pathway; the method citation remains valid provenance, not independent evidence for TNF
      ligand binding.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: All four actual ARBA JSON rules were inspected, including the two historical-only assertions.
      Current DISC rule ARBA00086566 clause0 and extrinsic-apoptosis rule ARBA00028297 clause1 match the
      target FunFam 2.10.50.10:FF:000021 plus Eukaryota. Historical cell-surface ARBA00027349 clause29
      matches that FunFam plus Euteleostomi; historical apoptosis-regulation ARBA00027086 clause54 matches
      the FunFam. Official target lineage verifies both taxa. The biology is corroborated by human receptor/DISC/surface
      evidence. Historical absence does not prove those rules were withdrawn, and published rule predictions
      are not themselves new primary experiments.
- id: GO_REF:0000120
