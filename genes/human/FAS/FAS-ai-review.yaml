core_functions:
- molecular_function:
    id: GO:0005031
    label: tumor necrosis factor receptor activity
  description: FAS (CD95/APO-1) is a type I transmembrane death receptor of the TNF
    receptor superfamily (TNFRSF6). The extracellular domain contains three cysteine-rich
    domains (CRDs) that bind FasL (FASLG/CD95L). This is the defining molecular function
    of FAS. ISOFORM-SPECIFIC to membrane-bound isoform 1 (P25445-1).
  directly_involved_in:
  - id: GO:0008625
    label: extrinsic apoptotic signaling pathway via death domain receptors
  - id: GO:0036337
    label: Fas signaling pathway
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  - id: GO:0045121
    label: membrane raft
  in_complex:
    id: GO:0031265
    label: CD95 death-inducing signaling complex
alternative_products:
- name: '1'
  id: P25445-1
  description: The canonical membrane-bound pro-apoptotic isoform (335 AA). Contains
    the transmembrane domain and intracellular death domain. Triggers apoptosis upon
    FasL binding by recruiting FADD and caspase-8 to form the death-inducing signaling
    complex (DISC). Most GO annotations for FAS refer to this isoform.
- name: 2 (del2, D)
  id: P25445-2
  sequence_note: VSP_006481, VSP_006482
  description: A soluble isoform lacking the transmembrane domain. Acts as a decoy
    receptor that binds FasL and BLOCKS apoptosis by preventing membrane Fas activation.
    Functionally ANTAGONISTIC to isoform 1.
- name: 3 (del3, E)
  id: P25445-3
  sequence_note: VSP_006483, VSP_006484
  description: A soluble isoform lacking the transmembrane domain. Acts as a decoy
    receptor that inhibits Fas-mediated apoptosis. Functionally antagonistic to isoform
    1.
- name: 4 (B)
  id: P25445-4
  sequence_note: VSP_006485, VSP_006486
  description: A soluble isoform lacking the transmembrane domain. Acts as a decoy
    receptor that inhibits Fas-mediated apoptosis. Functionally antagonistic to isoform
    1.
- name: 5 (C)
  id: P25445-5
  sequence_note: VSP_006487, VSP_006488
  description: A soluble isoform lacking the transmembrane domain. Acts as a decoy
    receptor that inhibits Fas-mediated apoptosis. Functionally antagonistic to isoform
    1.
- name: 6 (TMdel, A)
  id: P25445-6
  sequence_note: VSP_006489
  description: A soluble isoform specifically noted for deletion of the transmembrane
    domain (TMdel). Acts as a decoy receptor that inhibits Fas-mediated apoptosis
    by sequestering FasL. Elevated in autoimmune diseases where it may contribute
    to impaired apoptosis of autoreactive lymphocytes.
- name: 7 (FasExo8Del)
  id: P25445-7
  sequence_note: VSP_045235, VSP_045236
  description: An isoform with deletion of exon 8 sequences. Less well characterized
    than the membrane and soluble isoforms. Functional role not well established.
