id: P25445
gene_symbol: FAS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FAS (CD95/APO-1/TNFRSF6) is a TNF-receptor-family death receptor for FASLG. The full-length membrane
  isoform binds trimeric FASLG, oligomerizes, and recruits FADD through its cytosolic death domain to assemble CD95
  death-inducing signaling complexes that activate CASP8/CASP10 and initiate extrinsic apoptotic signaling. Soluble
  splice isoforms retain the ligand-binding ectodomain but lack the transmembrane and death-domain regions required for
  DISC assembly, allowing them to antagonize membrane-FAS signaling by binding FASLG without signal transduction.
  Germline loss-of-function variants in the FAS pathway cause autoimmune lymphoproliferative syndrome.
functional_isoforms:
- id: FAS_MEMBRANE
  name: Full-length membrane FAS
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P25445-1
  description: Isoform 1 is the full-length type I membrane receptor whose death domain recruits FADD and assembles the
    CD95 DISC after FASLG binding.
- id: FAS_SOLUBLE
  name: Secreted soluble FAS isoforms
  type: SPLICE_CLASS
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P25445-2
    - P25445-3
    - P25445-4
    - P25445-5
    - P25445-6
  description: Isoforms 2 through 6 are secreted receptors that lack the transmembrane and intracellular signaling
    regions and can block apoptosis in vitro by sequestering FASLG.
- id: FAS_DELTA_DEATH_DOMAIN
  name: FAS isoform lacking the intracytoplasmic signaling domain
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P25445-7
  description: Isoform 7 lacks the intracytoplasmic signaling domain and is reported to act as a dominant-negative
    receptor resistant to FAS-mediated apoptosis.
existing_annotations:
- term:
    id: GO:0005031
    label: tumor necrosis factor receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: 'CORE FUNCTION of FAS. FAS/CD95 is a type I transmembrane death receptor
      that binds FASLG (FasL/CD95L) and mediates apoptotic signaling. FAS is a bona
      fide member of the TNF receptor superfamily (TNFRSF6), containing three cysteine-rich
      domains (CRDs) in its extracellular region characteristic of this family [PMID:1375228].
      Note: This annotation applies primarily to membrane-bound isoform 1 (P25445-1);
      soluble isoforms retain ligand binding but lack signaling capacity.'
    action: ACCEPT
    reason: This is a core molecular function of FAS. The deep research confirms FAS
      is TNFRSF6 with characteristic cysteine-rich domains that mediate FasL binding.
      IBA inference is appropriate as this function is highly conserved across the
      TNFR family.
    supported_by:
    - reference_id: PMID:1375228
      supporting_text: The deduced amino acid sequence of APO-1 showed sequence identity
        with the Fas antigen, a cysteine-rich transmembrane protein of 335 amino acids
        with significant similarity to the members of the tumor necrosis factor/nerve
        growth factor receptor superfamily.
    - reference_id: file:human/FAS/FAS-deep-research-perplexity.md
      supporting_text: 'provider: perplexity'
    - reference_id: file:human/FAS/FAS-deep-research-falcon.md
      supporting_text: The gene symbol **FAS** here refers to the human cell-surface
        death receptor **CD95/APO-1**, a **type I transmembrane** member of the TNF
        receptor superfamily (TNFRSF6) with extracellular **cysteine-rich domains
        (CRDs)** and a cytosolic **death domain (DD)** that recruits the adaptor **FADD**
        to assemble a **death-inducing signaling complex (DISC)**, consistent with
        UniProt accession **P25445**.
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002930185
  - RGD:619831
  - UniProtKB:P25445
- term:
    id: GO:0045121
    label: membrane raft
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: ISOFORM-SPECIFIC (membrane-bound isoform 1 only). FAS localizes to cholesterol-
      and sphingolipid-rich membrane rafts, which is important for efficient DISC
      assembly and apoptotic signaling. Caveolin-1 regulates Fas localization and
      DISC formation in membrane rafts [PMID:21382479]. The deep research confirms
      membrane raft localization facilitates FAS clustering upon FasL binding.
    action: ACCEPT
    reason: 'Well-supported localization for membrane-bound FAS isoform 1. IBA inference
      is consistent with direct experimental evidence (IDA PMID:21382479). Note: Does
      not apply to soluble isoforms 2-6 which are secreted.'
    supported_by:
    - reference_id: PMID:21382479
      supporting_text: We found that Cav-1 regulated Fas signaling and mediated the
        communication between extrinsic and intrinsic pathways. Shortly after hyperoxia
        (4 h), the colocalization and interaction of Cav-1 and Fas increased, followed
        by Fas multimer and DISC formation.
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN002930185
  - UniProtKB:P25445
