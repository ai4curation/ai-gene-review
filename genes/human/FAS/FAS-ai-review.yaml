id: P25445
gene_symbol: FAS
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FAS (CD95/APO-1/TNFRSF6) is a type I transmembrane death receptor for FAS ligand. Its extracellular
  region engages FASLG, while the intracellular death domain recruits FADD to assemble a death-inducing
  signaling complex and activate initiator caspases. This receptor pathway drives extrinsic apoptosis
  and contributes to the removal of activated lymphocytes. FAS can also produce other signaling outputs
  depending on cellular context. Alternative splicing yields products with different extracellular and
  intracellular sequences, including secreted variants reported to inhibit FAS-triggered apoptosis in
  cell assays and a reported tumor-associated membrane-containing variant lacking the death domain.
functional_isoforms:
- id: FAS_MEMBRANE
  name: Full-length membrane FAS
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P25445-1
  description: Isoform 1 is the full-length type I membrane receptor whose death domain recruits FADD
    and assembles the CD95 DISC after FASLG binding.
- id: FAS_SOLUBLE
  name: Secreted soluble FAS isoforms
  type: SPLICE_CLASS
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P25445-2
    - P25445-3
    - P25445-4
    - P25445-5
    - P25445-6
  description: UniProt groups isoforms 2–6 as secreted products, but their architectures differ. Isoforms
    2–5 are short extracellular variants; isoform 6 deletes the membrane-anchor region while retaining
    the death-domain sequence. Soluble-variant expression studies report inhibition of FAS-triggered apoptosis.
    These results do not establish intact ligand-binding domains or a shared ligand-sequestration mechanism
    for every product.
- id: FAS_DELTA_DEATH_DOMAIN
  name: FAS isoform lacking the death domain
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - P25445-7
  description: Isoform 7 retains the transmembrane segment but loses the death domain and much of the
    intracellular signaling region. The reported dominant-negative behavior derives from the FasExo8Del
    lymphoma-cell study; it is not a general normal-tissue expression result.
