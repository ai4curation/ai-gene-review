- id: PMID:7595210
  title: A naturally occurring soluble isoform of murine Fas generated by alternative splicing.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual original author-uploaded Methods236–300, Results473–559/603–611 and Figure2 caption
      were read, plus recovered original discussion comparing murine FasB with human soluble FAS. FasB-transfected
      P815 clones and conditioned medium protect against FasL-expressing 3T3 cells while surface FasA
      remains. The murine truncated splice product is not a human natural isoform; direct ligand sequestration
      and a universal in vivo mechanism were not measured in this inspected scope. The cached original
      is scan/abstract-limited and failed PDF/PMC attempts remain recorded; no figure pixels were inspected.
- id: PMID:13679421
  title: Fas/tumor necrosis factor receptor death signaling is required for axotomy-induced death of motoneurons
    in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original Methods and Results/captions were read for mouse motoneuron culture and neonatal
      axotomy, with Fas lpr/knockout and broader FADD-DN perturbations distinguished. Supports injury-associated
      apoptosis and transient culture protection, with no detected change in normal developmental motoneuron
      numbers. No direct human motoneuron assay or figure-pixel read is claimed.
- id: PMID:21052097
  title: cIAP1 and TAK1 protect cells from TNF-induced necrosis by preventing RIP1/RIP3-dependent reactive
    oxygen species production.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original Results21, Figure1 caption23 and Methods54/56/60 were read. L929sAhFas means
      mouse L929sA expressing human FAS; anti-human FAS with zVAD triggers necrotic death sensitive to
      necrostatin-1. Distinguish this conditional receptor assay from endogenous mouse Fas and from the
      separate TNF/BV6 experiments. Supplementary Figure1A is cited in the main text but its pixels/body
      were not independently read.
- id: PMID:16154149
  title: Nuclear factor-kappaB mediates Kupffer cell apoptosis through transcriptional activation of Fas/FasL.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified identifier/abstract and rat Q63199 GOA donor mapping. Rat Kupffer-cell Fas/FasL
      apoptosis and NF-kappaB perturbation are described; this accessible scope does not demonstrate TNF
      cytokine binding to FAS. Full Methods/Results were not recovered and no negative experimental conclusion
      is drawn from that limitation.
- id: PMID:17195944
  title: Up-regulation of CD95 (Apo-1/Fas) is associated with spermatocyte apoptosis during the first
    round of spermatogenesis in the rat.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified identifier/abstract and rat Q63199 GOA donor mapping to external plasma membrane.
      The accessible rat spermatocyte expression/apoptosis study does not provide the full localization
      assay details; independent human intact-cell labeling corroborates the receptor location. No full-text
      read is claimed.
- id: PMID:16493077
  title: C5b-9 terminal complex protects oligodendrocytes from apoptotic cell death by inhibiting caspase-8
    processing and up-regulating FLIP.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified identifier/abstract and rat Q63199 DISC donor mapping. The abstract concerns
      oligodendrocyte FasL/FLIP/caspase8 effects but is not a complete DISC assembly assay; species assignment
      of the GOA donor is distinguished from what the abstract explicitly states. Human FAS/FADD original
      evidence independently supports complex membership. No full-text read is claimed.
- id: PMID:7602121
  title: Age-dependent reduction of Bcl-2 expression in peripheral T cells of lpr and gld mutant mice.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified mouse donor identifier and abstract. BCL2 transgene, age and lpr/gld contexts
      inform lymphocyte death/homeostasis; this is not a universal AICD assay. Retained as PAINT-source
      provenance with full-text access unresolved, not as grounds for an experimental removal.
- id: PMID:12702495
  title: Fas is not essential for lamina propria T lymphocyte homeostasis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified mouse donor identifier and abstract. Lamina propria T-cell Fas sensitivity
      and the distinct conclusion about homeostasis are retained together. The title does not justify
      rejecting a Fas-mediated death annotation. Full Methods/Results were not read.
- id: PMID:8640868
  title: Inhibition of apoptosis and augmentation of lymphoproliferation in bcl-2 transgenic Fas/Fas ligand-defective
    mice.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Verified mouse donor identifier and abstract. BCL2 overexpression and Fas-defect contexts
      inform lymphocyte accumulation/apoptosis; the exact full experimental scope remains unread. Used
      as bounded donor provenance, not to generalize across all T cells.
- id: PMID:7530335
  title: Autocrine T-cell suicide mediated by APO-1/(Fas/CD95).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified canonical PMID/DOI and original publisher abstract. Human Jurkat, alloreactive
      T-cell clone and activated peripheral T-cell experiments link activation-induced FasL and death,
      inhibited by FAS-blocking Fab or soluble receptor. Full paper was not accessible; this is explicitly
      abstract-level corroboration. A separate incorrect discovery lookup 7530339 was rejected and is
      not a supporting source.
core_functions:
- molecular_function:
    id: GO:0005035
    label: death receptor activity
  description: Membrane FAS binds extracellular FASLG and recruits FADD through its intracellular death
    domain, forming a receptor signaling complex that activates initiator caspases and drives extrinsic
    apoptosis. The full-length product contains the membrane anchor and intracellular signaling region
    required for this activity.
  directly_involved_in:
  - id: GO:0008625
    label: extrinsic apoptotic signaling pathway via death domain receptors
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0045121
    label: membrane raft
  in_complex:
    id: GO:0031265
    label: CD95 death-inducing signaling complex
  supported_by:
  - reference_id: PMID:1375228
  - reference_id: PMID:20935634
  - reference_id: PMID:17159907
alternative_products:
- name: '1'
  id: P25445-1
  description: The canonical 335-residue precursor is a type I membrane receptor with a transmembrane
    segment and intracellular death domain. FASLG engagement promotes FADD recruitment and death-inducing
    signaling complex assembly.
- name: 2 (del2, D)
  id: P25445-2
  sequence_note: VSP_006481, VSP_006482
  description: A 103-residue splice product with a shortened extracellular region and no transmembrane
    or death-domain sequence. UniProt classifies it among secreted FAS products.
- name: 3 (del3, E)
  id: P25445-3
  sequence_note: VSP_006483, VSP_006484
  description: An 86-residue splice product with a shortened extracellular region and no transmembrane
    or death-domain sequence. UniProt classifies it among secreted FAS products.
- name: 4 (B)
  id: P25445-4
  sequence_note: VSP_006485, VSP_006486
  description: A 149-residue splice product with altered extracellular sequence and no transmembrane or
    death-domain sequence. It belongs to the secreted FAS group described in the soluble-variant literature.
- name: 5 (C)
  id: P25445-5
  sequence_note: VSP_006487, VSP_006488
  description: A 132-residue splice product with altered extracellular sequence and no transmembrane or
    death-domain sequence. It belongs to the secreted FAS group described in the soluble-variant literature.
- name: 6 (TMdel, A)
  id: P25445-6
  sequence_note: VSP_006489
  description: A 314-residue splice product with deletion of canonical residues 169–189, removing the
    membrane-anchor region while retaining the downstream death-domain sequence. UniProt classifies it
    as secreted.
- name: 7 (FasExo8Del)
  id: P25445-7
  sequence_note: VSP_045235, VSP_045236
  description: A 220-residue splice product retaining the transmembrane segment, with altered residues
    218–220 and loss of residues 221–335, including the death domain. The original FasExo8Del study describes
    a lymphoma-cell context and dominant-negative inhibition of FAS-mediated death; it does not establish
    general expression in normal tissues.
