id: P34059
gene_symbol: GALNS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GALNS encodes a lysosomal glycoprotein sulfatase (EC 3.1.6.4) that removes 6-sulfate groups from N-acetylgalactosamine in chondroitin sulfate and galactose in keratan sulfate. Its calcium-containing catalytic site uses formylglycine generated from Cys79 by SUMF1. The enzyme forms a homodimer and carries out a desulfation step in glycosaminoglycan breakdown. Deficiency causes mucopolysaccharidosis IVA (Morquio A syndrome), with accumulation of incompletely degraded glycans.
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The retained official GO reference describes manually selected phylogenetic ancestral assertions grounded in experimental descendant annotations. The actual GALNS PTHR42693 tree, exact 522-residue target alignment, PTN000819263 IBD and dated incoming/literal donor difference were inspected. This verifies the method and target placement, not a fresh reading of every donor experiment. Direct human synthetic aryl-sulfate hydrolysis independently supports the chemistry.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The retained official description identifies combination of identical annotations from multiple electronic pipelines, with their identifiers retained in WITH/FROM. It explains the current composite GALNS rows; it is not an experimental paper. Target enzymology and localization provide independent biological corroboration, while individual ARBA rules and every ortholog assay were not separately re-audited.
- id: PMID:15962010
  title: Sulphatase activities are regulated by the interaction of sulphatase-modifying factor 1 with SUMF2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic cached full text, selected Results and Methods, and the original Figure 4 caption/image were inspected. GALNS is among the cDNAs assayed in Cos7 cells and its activity is enhanced by SUMF1. The supplementary protocol request returned HTML rather than the requested document; the exact GALNS substrate and construct sequence are not claimed. The explicit interaction experiments for other named sulfatases are not automatically GALNS interaction evidence.
  findings:
  - statement: The formylglycine (FGly) modification of an active-site cysteine, generated by SUMF1 within the ER, is required for the catalytic activity of the sulphatases (including GALNS); SUMF2 modulates SUMF1 activity.
    finding_review:
      finding_status: CURRENT
      review_notes: Retain the requirement for formylglycine activation and the tested GALNS/SUMF1 activity context. Selected original Figure 4 and activity Results include GALNS; the detailed supplementary substrate protocol was inaccessible. SUMF2 modulation and other named interaction assays are not automatically GALNS-specific interaction evidence.
- id: PMID:18285341
  title: Distinct effects of N-acetylgalactosamine-4-sulfatase and galactose-6-sulfatase expression on chondroitin sulfates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal cache contains the collective abstract only. Selected Experimental Procedures and GALNS-specific Results/Table 1/Table 2/Figure 2 caption were read in the retained author-uploaded original (DOI 10.1074/jbc.M707967200; public locator in the source guide). The abstract collectively links ASB-or-GALNS manipulation to CS and C4S changes, but the specific GALNS Results report changed total CS with no C4S increase after silencing and no C4S change after overexpression. Table 1 concerns enzyme activities, not C4S content. The per-gene Results therefore govern the narrower biological interpretation; the apparent abstract-versus-Results discrepancy is explicit, without invalidating the whole study or asserting universal absence of GALNS 4S catalysis. Keratan abundance also remains unchanged in this cell assay. The explicit 4-MU-sulfate recipe is for ASB; the detailed GALNS protocol refers to prior papers. Figure images and that cited prior recipe were not inspected.
  findings:
  - statement: Galactose-6-sulfatase (GALNS) hydrolyses sulfate groups of chondroitin sulfate; modulating GALNS expression (overexpression vs siRNA silencing) inversely changes cellular chondroitin sulfate content, demonstrating a role in chondroitin sulfate catabolism.
    finding_review:
      finding_status: CURRENT
      review_notes: Retain the broad chondroitin-catabolic finding. The abstract collectively combines ASB and GALNS outcomes, whereas the selected GALNS-specific Results/Table 2/Figure 2 caption report total CS changes without C4S changes. Table 1 independently records enzyme-activity changes and stable ASB activity. The narrower per-gene Results support this finding; they neither demonstrate GALNS 4-desulfation nor rule out every possible 4S side reaction. Unchanged keratan abundance in this cellular experiment is not affirmative keratan-process evidence.
- id: PMID:22940367
  title: The structure of human GALNS reveals the molecular basis for mucopolysaccharidosis IV A.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Authentic cached full text: selected structural and catalytic Results, protein-expression/purification Methods and complete kinetic Methods were read. Human GALNS with its native signal sequence and a His tag was expressed in insect cells. Purified enzyme assays directly test synthetic 4-MU-sulfate and coupled 4-MU-Gal6S hydrolysis, with enzyme-omission controls. Structure/mass spectrometry support formylglycine maturation and the calcium active site. The product-soaked GalNAc pose is nonproductive. Natural keratan/chondroitin specificity is established context cited to earlier work, not a direct natural-polymer assay in this study. No independent electron-density or figure-image analysis is claimed. Its explicit 6-sulfated-galactoside specificity statement is now anchored separately from the direct synthetic-substrate kinetics and the authors'' substrate-promiscuity interpretation; none is presented as a matched demonstration of absence of all sugar 4-desulfation.'
  findings:
  - statement: Crystal structure of human GALNS (EC 3.1.6.4); the enzyme removes 6-sulfate groups from terminal N-acetylgalactosamine-6-sulfate (chondroitin-6-sulfate) and galactose-6-sulfate (keratan sulfate). Formylglycine-generating enzyme converts Cys79 to a formylglycine nucleophile; the enzyme is a Ca2+-binding homodimer.
    finding_review:
      finding_status: CURRENT
      review_notes: Retain the structural, catalytic and maturation findings with assay scope explicit. Direct kinetics used synthetic 4-MU-sulfate and 4-MU-Gal6S; natural chondroitin/keratan specificity is established context rather than a direct intact-polymer assay here. Product-bound GalNAc adopts a nonproductive pose, not a demonstrated sulfated-substrate orientation.
- id: PMID:23533145
  title: In-depth proteomic analyses of exosomes isolated from expressed prostatic secretions in urine.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete authentic cached main text and the original Supplemental Table 2 workbook were read. Sheet SI Table 2 row 319 identifies P34059/GALNS with 7/7/10/9 unique peptides in duplicate cancer/non-cancer pooled EPS-urine preparations. The public evidence archive records the download URL, workbook hash and exact column/row locators. This supports isolated-fraction occurrence, not intravesicular topology, vesicle biogenesis or a new extracellular enzymatic role. Detection depth does not resolve co-isolation versus vesicle association; the specific exosome annotation is over-specific on this evidence, while positive fraction detection is retained.
  findings:
  - statement: Shotgun proteomics of exosomes from expressed prostatic secretions in urine detected ~900 proteins, among them GALNS, consistent with its presence in the secreted/extracellular-exosome fraction.
    finding_review:
      finding_status: CURRENT
      review_notes: Retain the literal positive isolated-fraction detection. The exact target workbook row supports identification, but does not distinguish true vesicle association from co-isolation; the wording must not be extended to verified intravesicular topology or an extracellular catalytic function.
- id: PMID:30760748
  title: Expression, activity and localization of lysosomal sulfatases in Chronic Obstructive Pulmonary Disease.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic full-text localization Results, Figure 4 caption, culture/immunofluorescence Methods and relevant Discussion were read. GALNS colocalizes with LAMP1 in fixed/permeabilized primary human airway fibroblasts from ever smokers and COPD subjects. Figure images and supplemental Table S2 antibody details were not independently inspected. The study supports lysosomal localization without exclusive residence, an isoform restriction or a new COPD process assertion.
  findings:
  - statement: Immunostaining of cultured lung fibroblasts shows GALNS in a lysosomal localisation in both ever smokers and COPD patients, confirming lysosomal localisation.
    finding_review:
      finding_status: CURRENT
      review_notes: Retain human fibroblast lysosomal localization from GALNS/LAMP1 colocalization Results and Figure 4 caption. Images and supplementary antibody details were not independently inspected; no exclusive residence or disease-specific function is asserted.
- id: PMID:8325655
  title: 'Mucopolysaccharidosis IV A: assignment of the human N-acetylgalactosamine-6-sulfate sulfatase (GALNS) gene to chromosome 16q24.'
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Authentic abstract and identifiers verified; full Methods and biochemical assay details remain unavailable after bounded publisher checks. The abstract maps human GALNS, explicitly named as a 6-sulfatase, to chromosome 16q24 and mentions a fibroblast enzyme assay. It does not expose the substrate needed to verify the incoming GO:0003943 4-sulfatase TAS claim. That claim remains UNDECIDED; neither wrong-gene attribution nor an assertion that unseen experiments lacked the target is made. The inherited statement is retained below. Its categorical no-4-sulfatase-assay clause is disputed because the original assay was not inspected; this is an evidential overstatement, not demonstrated biological contradiction or a claim that the publication is invalid.
  full_text_unavailable: true
  findings:
  - statement: Chromosome-mapping study assigning the human N-acetylgalactosamine-6-sulfate sulfatase (GALNS; EC 3.1.6.4) gene to chromosome 16q24; the paper does not assay a 4-sulfatase activity.
    finding_review:
      finding_status: DISPUTED
      review_notes: 'The chromosome-assignment portion agrees with the authentic abstract. The final claim that the paper does not assay a 4-sulfatase is unsupported by the available access: full Methods and the biochemical substrate were not inspected. Dispute that categorical absence claim without asserting that the paper actually demonstrates 4-sulfatase activity. No contradictory publication or retraction is established, so no superseded_by identifier is invented.'
- id: PMID:820716
  title: N-acetylgalactosamine-6-sulfate sulfatase in man. Absence of the enzyme in Morquio disease.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original publisher PDF Methods, Results and Discussion and the Table II/Figure 6 page image were read. Crude human kidney extracts desulfate chondroitin-6-sulfate oligosaccharides; Morquio fibroblast extracts lack the measured activity. The authors separately quantify and correct a 2.4% arylsulfatase B contribution from 4-sulfated contamination. This does not demonstrate GALNS 4-sulfatase activity. Intact polymer is unsuitable in this preparation, and crude extract cannot resolve terminal versus internal cleavage or identify a cloned sequence.
  findings:
  - statement: Original demonstration of N-acetylgalactosamine-6-sulfate sulfatase (GALNS) activity in man and its absence in Morquio disease; source of the EC 3.1.6.4 catalytic-activity assignment in UniProt.
    finding_review:
      finding_status: CURRENT
      review_notes: Retain the original human/Morquio 6-sulfatase finding. Selected Methods, Results and Table II distinguish the measured chondroitin-6-sulfate oligosaccharide turnover from a separately corrected small ARSB contribution. That correction does not establish universal absence of other GALNS reactions; intact polymer was unsuitable in this preparation.
- id: Reactome:R-HSA-1630304
  title: GALNS oligomer hydrolyses sulfate from Gal6S in keratan sulfate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The immutable normal-event summary and selected official event text identify GALNS oligomer desulfation of Gal6S in keratan sulfate in lysosomal lumen. This curated normal reaction directly grounds the retained TAS keratan-catabolic proposal. Its biochemical references are distinguished from the synthetic assays in PMID:22940367. The downstream individual catalyst component was not independently resolved; no inaccessible accession endpoint is claimed as read.
- id: Reactome:R-HSA-2263490
  title: Defective GALNS does not hydrolyse sulfate from Gal6S in keratan sulfate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The immutable disease-event summary and selected official record describe defective GALNS variants failing the normal reaction, and link R-HSA-1630304. This supports the disease context of the normal lysosomal reaction. It is not evidence that wild-type GALNS lacks activity, nor a demonstration that all mutant products retain normal trafficking.
- id: Reactome:R-HSA-6798751
  title: Exocytosis of azurophil granule lumen proteins
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The immutable exocytosis summary and successful official input/output participant-set pages were inspected. Azurophil-lumen set R-HSA-6798742 and extracellular output set R-HSA-6806184 explicitly contain OxA-GALNS. Direct component-page requests returned 404; named target membership is established, but no independent component-to-UniProt resolution is claimed. GALNS is modeled cargo, not an established catalyst of exocytosis.
- id: file:human/GALNS/GALNS-uniprot.txt
  title: UniProtKB P34059 (GALNS_HUMAN) curated record
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official P34059 human GALNS record and direct FASTA establish one canonical 522-residue sequence and no declared alternative products. Signal peptide 1-26 and mature-chain annotation 27-522 describe processing, not natural splice products. Functional and lysosomal annotations are integrated with primary experiments; the complete automatically retrieved bibliography is not treated as independently read evidence.
  findings:
  - statement: 'FUNCTION: lysosomal enzyme that hydrolyzes sulfate groups from the glycosaminoglycans keratan sulfate and chondroitin-6-sulfate; SUBCELLULAR LOCATION lysosome; homodimer; formylglycine (3-oxoalanine) modification of Cys79 critical for activity; deficiency causes MPS4A (Morquio A).'
    finding_review:
      finding_status: CORROBORATED
      review_notes: The exact current record retains lysosomal glycan desulfation, homodimeric structure, catalytic Cys79 maturation and MPSIVA deficiency. Human biochemical, structural and localization evidence corroborates these claims; the automatic bibliography is not treated as independently read.
    record_section: ["CC:FUNCTION"]
