suggested_questions:
- question: Which substrate and enzyme-specific controls were used for the fibroblast assay in PMID:8325655, and can the source-specific 4-sulfatase assertion be resolved?
- question: Does GALNS in neutrophil or urinary extracellular fractions have a physiological extracellular substrate, or predominantly reflect trafficking and release of a lysosomal enzyme?
- question: What is the vesicle topology of proteomically detected urinary GALNS, and is active enzyme associated with the vesicle lumen, surface or co-isolated material?
suggested_experiments:
- description: Compare purified human GALNS on defined GalNAc-4-sulfate, GalNAc-6-sulfate and Gal-6-sulfate oligosaccharides with matched substrate-purity and ARSB controls, separating native glycan specificity from synthetic aryl-sulfate promiscuity.
