core_functions:
- description: Hydrolyzes the 6-sulfate ester of GalNAc residues in chondroitin sulfate and galactose residues in keratan sulfate during lysosomal glycan degradation. The mature enzyme uses a calcium-containing active site and a formylglycine nucleophile generated from Cys79. The two substrate classes are covered by one molecular activity.
