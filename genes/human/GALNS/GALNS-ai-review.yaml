- id: Reactome:R-HSA-2022857
  title: Keratan sulfate degradation
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete immutable pathway summary describes lysosomal keratan sulfate proteoglycan degradation. This establishes proteoglycan-level process context; the exact GALNS catalytic step is supplied by normal reaction R-HSA-1630304. The pathway summary alone is not a new GALNS experiment or a claim that every degradation step is shown.
- id: Reactome:R-HSA-2206290
  title: MPS IV - Morquio syndrome A
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete immutable Morquio A summary explicitly identifies normal GALNS 6-desulfation of chondroitin and keratan substrates before discussing deficiency. It corroborates physiological 6-sulfatase specificity, but does not experimentally exclude 4-sulfatase side activity. Disease-variant failure is distinguished from normal catalytic ability.
- id: PMID:1522213
  title: Mucopolysaccharidosis type IVA. N-acetylgalactosamine-6-sulfate sulfatase exonic point mutations in classical Morquio and mild cases.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete authentic cached abstract and identifier read. This is an exonic mutation/transfection study of 1342delCA and N204K in Morquio disease, rather than the cloning paper described in the review suggestion. Decreased GALNS activity is reported after mutant expression; the accessible abstract supplies no matched 4S-versus-6S substrate comparison. Full original Methods remain uninspected.
- id: PMID:24726177
  title: Molecular testing of 163 patients with Morquio A (Mucopolysaccharidosis IVA) identifies 39 novel GALNS mutations.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic cached abstract, selected Introduction, complete Methods 2.2 and adjacent diagnostic Results read, not the whole article or images. GALNS activity is assayed in leukocytes/fibroblasts using referenced fluorogenic or radiolabelled diagnostic protocols; ARSB appears as a separate diagnostic control. These selected sections do not supply a purified-GALNS 4S-versus-6S comparison. The listed correction has not been read; no uninspected figure or corrected variant assertion is relied on.
