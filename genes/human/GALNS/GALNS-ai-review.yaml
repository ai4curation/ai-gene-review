id: P34059
gene_symbol: GALNS
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GALNS encodes a lysosomal glycoprotein sulfatase that removes 6-sulfate groups from N-acetylgalactosamine in chondroitin sulfate and galactose in keratan sulfate. Its calcium-containing catalytic site uses formylglycine generated from an encoded cysteine by SUMF1. The enzyme forms a homodimer and carries out a desulfation step in glycosaminoglycan breakdown. Deficiency causes mucopolysaccharidosis IVA (Morquio A syndrome), with accumulation of incompletely degraded glycans. The 522-residue precursor enters the secretory pathway and loses its signal peptide. GALNS also occurs in specialized secretory and extracellular fractions.
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The retained official GO reference describes manually selected phylogenetic ancestral assertions grounded in experimental descendant annotations. The actual GALNS PTHR42693 tree, exact 522-residue target alignment, PTN000819263 IBD and dated incoming/literal donor difference were inspected. This verifies the method and target placement, not a fresh reading of every donor experiment. Direct human synthetic aryl-sulfate hydrolysis independently supports the chemistry.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The retained official description identifies combination of identical annotations from multiple electronic pipelines, with their identifiers retained in WITH/FROM. It explains the current composite GALNS rows; it is not an experimental paper. Target enzymology and localization provide independent biological corroboration, while individual ARBA rules and every ortholog assay were not separately re-audited.
- id: PMID:15962010
  title: Sulphatase activities are regulated by the interaction of sulphatase-modifying factor 1 with SUMF2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic cached full text, selected Results and Methods, and the original Figure 4 caption/image were inspected. GALNS is among the cDNAs assayed in Cos7 cells and its activity is enhanced by SUMF1. The supplementary protocol request returned HTML rather than the requested document; the exact GALNS substrate and construct sequence are not claimed. The explicit interaction experiments for other named sulfatases are not automatically GALNS interaction evidence.
- id: PMID:18285341
  title: Distinct effects of N-acetylgalactosamine-4-sulfatase and galactose-6-sulfatase expression on chondroitin sulfates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal cache is abstract-only, but selected Experimental Procedures and Results/Table 1 were read in the retained indexed author-uploaded original. Human GALNS expression and siRNA change GALNS activity and total chondroitin sulfate in MCF-7 cells. GALNS manipulation leaves C4S and ASB activity essentially unchanged; the abstract collective wording therefore must not be used as direct GALNS 4-desulfation evidence. Keratan abundance also remains unchanged in this cell assay. Detailed GALNS substrate chemistry is referred to prior papers; the explicit 4-MU-sulfate recipe is for ASB. Figure images and the cited prior assay recipe were not inspected.
- id: PMID:22940367
  title: The structure of human GALNS reveals the molecular basis for mucopolysaccharidosis IV A.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Authentic cached full text: selected structural and catalytic Results, protein-expression/purification Methods and complete kinetic Methods were read. Human GALNS with its native signal sequence and a His tag was expressed in insect cells. Purified enzyme assays directly test synthetic 4-MU-sulfate and coupled 4-MU-Gal6S hydrolysis, with enzyme-omission controls. Structure/mass spectrometry support formylglycine maturation and the calcium active site. The product-soaked GalNAc pose is nonproductive. Natural keratan/chondroitin specificity is established context cited to earlier work, not a direct natural-polymer assay in this study. No independent electron-density or figure-image analysis is claimed.'
- id: PMID:23533145
  title: In-depth proteomic analyses of exosomes isolated from expressed prostatic secretions in urine.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete authentic cached main text and the original Supplemental Table 2 workbook were read. Sheet SI Table 2 row 319 identifies P34059/GALNS with 7/7/10/9 unique peptides in duplicate cancer/non-cancer pooled EPS-urine preparations. The public evidence archive records the download URL, workbook hash and exact column/row locators. This supports isolated-fraction occurrence, not intravesicular topology, vesicle biogenesis or a new extracellular enzymatic role.
- id: PMID:30760748
  title: Expression, activity and localization of lysosomal sulfatases in Chronic Obstructive Pulmonary Disease.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic full-text localization Results, Figure 4 caption, culture/immunofluorescence Methods and relevant Discussion were read. GALNS colocalizes with LAMP1 in fixed/permeabilized primary human airway fibroblasts from ever smokers and COPD subjects. Figure images and supplemental Table S2 antibody details were not independently inspected. The study supports lysosomal localization without exclusive residence, an isoform restriction or a new COPD process assertion.
- id: PMID:8325655
  title: 'Mucopolysaccharidosis IV A: assignment of the human N-acetylgalactosamine-6-sulfate sulfatase (GALNS) gene to chromosome 16q24.'
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Authentic abstract and identifiers verified; full Methods and biochemical assay details remain unavailable after bounded publisher checks. The abstract maps human GALNS, explicitly named as a 6-sulfatase, to chromosome 16q24 and mentions a fibroblast enzyme assay. It does not expose the substrate needed to verify the incoming GO:0003943 4-sulfatase TAS claim. That claim remains UNDECIDED; neither wrong-gene attribution nor an assertion that unseen experiments lacked the target is made. The historical MISCITED finding is superseded by this access-limited assessment.
  full_text_unavailable: true
- id: PMID:820716
  title: N-acetylgalactosamine-6-sulfate sulfatase in man. Absence of the enzyme in Morquio disease.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original publisher PDF Methods, Results and Discussion and the Table II/Figure 6 page image were read. Crude human kidney extracts desulfate chondroitin-6-sulfate oligosaccharides; Morquio fibroblast extracts lack the measured activity. The authors separately quantify and correct a 2.4% arylsulfatase B contribution from 4-sulfated contamination. This does not demonstrate GALNS 4-sulfatase activity. Intact polymer is unsuitable in this preparation, and crude extract cannot resolve terminal versus internal cleavage or identify a cloned sequence.
- id: Reactome:R-HSA-1630304
  title: GALNS oligomer hydrolyses sulfate from Gal6S in keratan sulfate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The immutable normal-event summary and selected official event text identify GALNS oligomer desulfation of Gal6S in keratan sulfate in lysosomal lumen. This curated normal reaction directly grounds the retained TAS keratan-catabolic proposal. Its biochemical references are distinguished from the synthetic assays in PMID:22940367. The downstream individual catalyst component was not independently resolved; no inaccessible accession endpoint is claimed as read.
- id: Reactome:R-HSA-2263490
  title: Defective GALNS does not hydrolyse sulfate from Gal6S in keratan sulfate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The immutable disease-event summary and selected official record describe defective GALNS variants failing the normal reaction, and link R-HSA-1630304. This supports the disease context of the normal lysosomal reaction. It is not evidence that wild-type GALNS lacks activity, nor a demonstration that all mutant products retain normal trafficking.
- id: Reactome:R-HSA-6798751
  title: Exocytosis of azurophil granule lumen proteins
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The immutable exocytosis summary and successful official input/output participant-set pages were inspected. Azurophil-lumen set R-HSA-6798742 and extracellular output set R-HSA-6806184 explicitly contain OxA-GALNS. Direct component-page requests returned 404; named target membership is established, but no independent component-to-UniProt resolution is claimed. GALNS is modeled cargo, not an established catalyst of exocytosis.
- id: file:human/GALNS/GALNS-uniprot.txt
  title: UniProtKB P34059 (GALNS_HUMAN) curated record
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official P34059 human GALNS record and direct FASTA establish one canonical 522-residue sequence and no declared alternative products. Signal peptide 1-26 and mature-chain annotation 27-522 describe processing, not natural splice products. Functional and lysosomal annotations are integrated with primary experiments; the complete automatically retrieved bibliography is not treated as independently read evidence.
