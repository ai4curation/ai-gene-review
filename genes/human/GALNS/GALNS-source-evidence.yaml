    sha256: 5e6ed22f3c5c677caa7edf9a8e26761d832b4b57585d47d4df67c247f637367f
    blob: a9a6ba5476e611b0d5d10e72516782d14d2824d1
  native_header:
    stable_id: R-HSA-2022857
    display_name: Keratan sulfate degradation
    species: Homo sapiens
    summary: Keratan sulfate proteoglycans (KSPGs) are degraded in lysosomes as part of normal homeostasis of glycoproteins. Glycoproteins must be completely degraded to avoid undigested fragments building up and causing a variety of lysosomal storage diseases. KSPGs are Asn-linked glycoproteins and are acted upon by exo-glycosidases to release sugar monomers. The main steps of degradation are shown representing the types of cleavage reactions that occur so the full degradation of KS is not shown to avoid repetition. The proteolysis of the core protein of the glycoprotein is not shown here (Winchester 2005, Aronson & Kuranda 1989).
- path: reactome/R-HSA-2206290.md
  native_state: genuine missing-only native acquisition
  actual_source:
    bytes: 2889
    sha256: f232e67497b3aae39af20ba3f83ea008a8148794228a6e7bf8a728895c0ee0d1
    blob: 9080d7e569c7c92589c8ab1d680dfce1bcf4905b
  native_header:
    stable_id: R-HSA-2206290
    display_name: MPS IV - Morquio syndrome A
    species: Homo sapiens
    summary: 'Mucopolysaccharidosis IV A (MPS IVA, MPS4A, Morquio''s syndrome, Morquio''s; MIM:253000) is a rare, autosomal recessive mucopolysaccharide storage disease, first described simultaneously in 1929 by L Morquio (Morquio L, Sur une forme de distrophie familiale, Bull Soc Pediat, Paris, 27, 1929, 145-152) and JF Brailsford (Brailsford, JF, Chondro-osteo-dystrophy: roentgenographic and clinical features of child with dislocation of vertebrae,  Am j Surg, 7, 1929, 404-410). MPSIVA is caused by a deficiency in N-acetylgalactosamine 6-sulfatase (GALNS; MIM:612222) which normally hydrolyses 6-sulfate groups of N-acetylgalactosamine 6-sulfate units of chondroitin sulfate (CS) and of galactose 6-sulfate units of keratan sulfate (KS) (Matalon et al. 1974). The result is accumulation of KS/DS in cells and overexcretion in urine. Severe osteochondrodysplasia is a commonly seen phenotype for this disease. The severity of the disease is variable but severe cases limits lifespan to their 20''s
      or 30''s (Prat et al. 2008, Tomatsu et al. 2011). The gene coding for human GALNS was mapped to chromosome 16q24.3 (Masuno et al. 1993) and its structure described at the same time by two independent groups as comprising 14 exons and spanning approximately 40-50 kb (Nakashima et al.1994, Morris et al.1994). '
