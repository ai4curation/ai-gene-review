  native_header:
    stable_id: R-HSA-1630304
    display_name: GALNS oligomer hydrolyses sulfate from Gal6S in keratan sulfate
    species: Homo sapiens
    summary: N-acetylgalactosamine 6-sulfate sulfatase (GALNS) hydrolyses sulfate from galactose 6-sulfate units of keratan sulfate (KS, shown here) and sulfate from N-acetyl-D-galactosamine 6-sulfate units of chondroitin sulfate (CS, not shown) (Lim & Horwitz 1981, Masue et al. 1991). GALNS is a homodimer with each monomer binding a Ca2+ cofactor (Rivera-Colón et al., 2012). The conversion to 3-oxoalanine (C-formylglycine, FGly) of a cysteine residue in eukaryotes, is critical for catalytic activity, based on similarity to the prototypical arylsulfatase ARSA (Chruszcz et al. 2003, Lukatela et al. 1998). Defects in GALNS cause mucopolysaccharidosis type IVA (MPSIVA, MIM:253000), also called  Morquio A syndrome, a lysosomal storage disease characterized by intracellular accumulation of KS and CS (Fukuda et al. 1992).
- path: reactome/R-HSA-2022857.md
  native_state: genuine missing-only native acquisition
