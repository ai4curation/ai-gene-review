- id: PMID:21454576
  title: Arginine and glutamate-rich 1 (ARGLU1) interacts with mediator subunit 1
    (MED1) and is required for estrogen receptor-mediated gene transcription and breast
    cancer cell growth.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, no retraction or erratum flags. Establishes the direct MED1
      interaction, ligand-dependent promoter recruitment and ChIP-reChIP co-occupancy that
      the new GO:0036033 annotation rests on. Cached copy is abstract-only, so all claims
      drawn from it here are taken from the abstract, which states them explicitly.
  findings:
  - statement: ARGLU1 binds directly to a far C-terminal region of MED1 and colocalizes
      with MED1 in the nucleus.
    supporting_text: We found that ARGLU1 (arginine and glutamate rich 1) not only
      colocalizes with MED1 in the nucleus, but also directly interacts with a far
      C-terminal region of MED1.
  - statement: ARGLU1 is recruited to endogenous estrogen receptor target gene promoters
      in a ligand-dependent manner and is required for their expression.
    supporting_text: Importantly, ARGLU1 is recruited, in a ligand-dependent manner, to
      endogenous estrogen receptor target gene promoters and is required for their
      expression.
