id: Q9NWB6
gene_symbol: ARGLU1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ARGLU1 (arginine and glutamate-rich protein 1) is a small intrinsically disordered
  nuclear protein that couples transcriptional coactivation to alternative pre-mRNA
  splicing. It carries no catalytic or recognised nucleic-acid-binding fold; its 273
  residues divide into an arginine/serine-rich N-terminal region (residues 1-74) that
  binds RNA, preferentially G-rich CGG(A/G)GG motifs, and contacts the 3' splice site
  recognition factors U2AF2, PUF60 and JMJD6, and a glutamate-rich coiled-coil
  C-terminal region (residues 75-273) that is necessary and sufficient for
  transcriptional regulation. Through the C-terminal region ARGLU1 acts as a general
  coactivator of nuclear receptors, including the glucocorticoid and estrogen
  receptors, working co-operatively with other coactivators and with the Mediator
  subunit MED1, to which it binds directly and with which it co-occupies
  ligand-activated target gene promoters. Through the N-terminal region it binds a
  subset of pre-mRNAs and shifts cassette-exon choice. The protein concentrates in
  nuclear speckles and associates with chromatin, and it controls its own abundance
  homeostatically: it binds its own pre-mRNA and promotes retention of intron 2 and
  use of a nonsense-mediated-decay-targeted exon, while the retained intron is
  released as a stable intronic sequence RNA that binds ARGLU1 protein and sequesters
  it in speckles away from the locus. ARGLU1 is essential for mouse embryonic
  development, and its ablation in the embryonic cortex causes widespread splicing
  changes, p53-dependent apoptosis of radial glial cells and microcephaly.
