- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IMP
  original_reference_id: PMID:30698747
  qualifier: enables
  review:
    summary: >-
      Core molecular function. ARGLU1 was isolated in a screen for modulators of
      glucocorticoid signalling and coactivates multiple nuclear receptors in
      GAL4-LBD reporter assays; domain-swap constructs localise the activity to the
      glutamate-rich C-terminal region.
    action: ACCEPT
    reason: >-
      GO:0003713 is the correct and maximal term. The substrate-specific alternative a
      reader would reach for, GO:0030374 nuclear receptor coactivator activity, is
      obsolete in the current ontology, so no more specific child exists and none should
      be proposed. The activity is co-operative rather than autonomous, which is
      consistent with a coregulator term rather than a DNA-binding transcription factor
      term. Worth recording that the obvious mechanistic explanation was tested and
      failed: mutating both degenerate LXXLL motifs did not disrupt coactivation, so the
      motif content of the C-terminus does not account for the activity.
    supported_by:
    - reference_id: PMID:30698747
      supporting_text: These studies revealed that the construct containing only the
        C-terminus (ARGLU1C-term) retained the ability to coactivate GR, comparable to
        that of the full-length protein; whereas, the construct containing only the
        N-terminus (ARGLU1N-term) did not (Figure 2B).
    - reference_id: PMID:30698747
      supporting_text: we observed a synergistic increase in ligand-induced luciferase
        activity (Figure 2A), implying that ARGLU1 forms a complex with other
        coactivators and GR to regulate gene expression.
    - reference_id: PMID:30698747
      supporting_text: These data suggest that while the C-terminal domain is important
        for activation, these motifs alone cannot account for the ARGLU1 mediated
        transactivation of GR, thus, other non-canonical interactions are likely
        involved.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:22365833
