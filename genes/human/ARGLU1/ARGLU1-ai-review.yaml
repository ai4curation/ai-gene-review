  review:
    summary: >-
      Ensembl Compara transfer from mouse Arglu1 (Q3UL36) of the alternative-splicing
      regulation term. The mouse annotation is itself experimental and the human
      protein independently carries the same term by IMP from the same study, so this
      row is a correct ortholog transfer that happens to be redundant with direct
      human evidence.
    action: ACCEPT
    reason: >-
      The donor is the genuine one-to-one mouse ortholog, not a paralog, and the
      transferred term is the one both species' experiments support. Depletion of
      ARGLU1 in neural cells changes alternative splicing genome-wide, and the same
      result is reproduced in the mouse conditional knockout cortex. Keeping the
      Compara row costs nothing and preserves the cross-species support.
    supported_by:
    - reference_id: PMID:30698747
      supporting_text: RNA-seq of neural cells depleted of ARGLU1 revealed significant
        changes in the expression and alternative splicing of distinct genes involved
        in neurogenesis.
    - reference_id: PMID:37612280
      supporting_text: RNA seq analysis reveals widespread changes in alternative splicing
        in the mutant mouse embryonic cortex, preferentially affecting genes involved
        in neuronal functions.
- term:
    id: GO:0000381
    label: regulation of alternative mRNA splicing, via spliceosome
  evidence_type: IMP
  original_reference_id: PMID:30698747
  qualifier: involved_in
  review:
    summary: >-
      Core biological process. Knockdown of ARGLU1 in neural cells changes alternative
      splicing genome-wide, and the N-terminal region that binds pre-mRNA is the region
      required for the splicing outcomes, tying the phenotype to a direct activity
      rather than to an indirect consequence of transcriptional change.
    action: ACCEPT
    reason: >-
      This is one of the gene's two best-supported functions and the term is at the
      right level of specificity. The paper separates the transcriptional and splicing
      activities onto different regions of the protein, and the splicing activity maps
      to the RNA-binding N-terminus, which argues the effect is direct for at least a
      subset of targets. The specificity control matters: a target that is
      ARGLU1-dependent for splicing but lacks G-rich sequence near its splice sites is
      not enriched in the RNA pulldown, so the authors explicitly allow that some of
      the splicing changes are indirect.
    supported_by:
    - reference_id: PMID:30698747
      supporting_text: Biochemical studies determined that ARGLU1 interacts with GR through
        its C-terminal domain; whereas, the N-terminal domain mediates interactions with
        splicing factors and contributes to both basal and GC-dependent splicing outcomes.
    - reference_id: PMID:30698747
      supporting_text: In contrast, Brwd3 pre-mRNA (undergoes ARGLU1-dependent AS but does
        not contain G-rich sequences near splice sites) is not enriched (Supplementary
        Figure S9E).
