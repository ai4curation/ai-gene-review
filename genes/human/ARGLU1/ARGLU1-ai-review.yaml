knowledge_gaps:
- gap_statement: >-
    No experimental structure of ARGLU1 exists and the protein has no domain-level
    sequence signature of any kind, so no molecular function can be inferred from its
    fold. The complete signature content of the Swiss-Prot entry is IPR033371 (the ARGLU1
    family itself), Pfam PF15346, which InterPro types as a coiled coil rather than a
    domain, and PANTHER PTHR31711:SF1.
  boundary: >-
    What is known is compositional and regional, not structural: residues 1-74 are
    arginine/serine-rich and are necessary and sufficient for RNA binding, residues 75-273
    are glutamate-rich, predicted coiled coil, and are necessary and sufficient for
    transcriptional regulation. What is unknown is how either region achieves its
    activity at the level of a folded interface.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: NARROWING
  significance: >-
    This is the reason the gene name is a trap. Arginine- and glutamate-rich names a
    composition, not an activity, and there is no domain from which an activity could be
    reverse-engineered. Every molecular function assigned to ARGLU1 must come from a
    direct experiment, and the two that do are supported by region-mapping experiments
    rather than by homology.
  provenance:
  - reference_id: PMID:38520408
    supporting_text: Computational prediction suggests that ARGLU1 contains intrinsically
      disordered regions and lacks any known structural or functional domains.
- gap_statement: >-
    GO cannot express regulation of promoter-proximal RNA polymerase II pausing. The term
    GO:0160239 transcription pausing by RNA polymerase II exists and describes the process,
    but it has no children and there is no regulation-level term beneath it, so a protein
    reported to enhance pausing can only be annotated at the coarser transcription
    elongation level.
  boundary: >-
    The elongation-level terms GO:0034243 and its positive and negative children are
    available and would capture the downstream consequence, but they do not distinguish
    pause establishment or release from elongation rate, which is the distinction the
    experiments make.
  gap_kind:
  - ONTOLOGY
  status: OPEN
  significance: >-
    ARGLU1 is reported to enhance promoter-proximal pausing and, in a separate study, to
    repress adenoviral promoters by the same mechanism. Neither claim can be annotated at
    the level at which it was measured. No elongation or pausing term is proposed in this
    review because the available terms would misstate the measurement, and the gap is
    recorded instead.
  provenance:
  - reference_id: PMID:38520408
    supporting_text: Transcriptional effects induced by ARGLU1 occur via enhancement of
      promoter-proximal RNA polymerase II pausing, likely by inhibiting the interaction
      between JMJD6 and BRD4.
- gap_statement: >-
    GO can express that ARGLU1 binds a splicing factor but not which step of splice-site
    recognition that contact serves. GO:1990935 splicing factor binding covers U2AF2 and
    PUF60, but it is a single flat term with no children, so the U2AF2 and PUF60 rows
    become indistinguishable from any other splicing-factor contact, and the JMJD6
    interaction has no informative term at all.
  boundary: >-
    The boundary was drawn by measurement, and the measurement had to be widened once.
    Querying each partner for annotations under GO:0008380 RNA splicing by is_a and
    part_of returns an IDA for U2AF2, two IBAs for PUF60 and nothing for JMJD6; but that
    query cannot reach regulation terms, and widening it shows JMJD6 holds GO:0048024
    regulation of mRNA splicing, via spliceosome by IMP. So the real distinction is
    between splicing and the regulation of splicing, which the term's definition does not
    adjudicate. What is separately unexpressible is the mechanistic content, that the
    contacts are with the 3' splice site recognition machinery specifically.
  gap_kind:
  - ONTOLOGY
  - CURATION
  status: NARROWING
  significance: >-
    An earlier draft of this review asserted that no splicing-factor-binding molecular
    function term existed and removed all six rows on that basis. The assertion was
    false, and false for an instructive reason: the search used was spliceosomal complex
    binding, and GO's search is token-based, so it could never have returned splicing
    factor binding. Five rows are now MODIFY rather than REMOVE. The episode is recorded
    because a failed keyword search is not evidence that a term is absent.
  provenance:
  - reference_id: PMID:30698747
    supporting_text: The MS results were confirmed with co-IP western blotting experiments
      in which ARGLU1 was found to interact with PUF60, U2AF2 and JMJD6 (Figure 3B).
- gap_statement: >-
    It is not known what phosphorylation does to ARGLU1. Six phosphosites are annotated in
    UniProt from mass spectrometry, SRPK2 phosphorylates ARGLU1 in vitro, and PAK1
    phosphorylates Ser-77, but no study has tested how any of these modifications change
    RNA binding, coactivation, speckle partitioning or the autoregulatory circuit.
  boundary: >-
    The PAK1 study does test the consequence of Ser-77 phosphorylation for proliferation
    and E-box reporter activity in breast cancer cells, so the gap is narrowing at that one
    site. Nothing is known about the three sites in the RS-repeat region, Ser-58, Ser-60 and
    Thr-61, which are the sites an SRPK-family kinase would be expected to target.
  gap_kind:
  - BIOLOGY
  status: NARROWING
  significance: >-
    SRPK-family phosphorylation of RS-repeat regions is the canonical mechanism controlling
    nuclear speckle partitioning of SR proteins, and ARGLU1's speckle partitioning is
    already known to be regulated, by sisRNA binding. Whether the two inputs converge is
    the most tractable open mechanistic question on this gene.
  provenance:
  - reference_id: PMID:42641889
    supporting_text: we identified and confirmed that PAK1 phosphorylated ARGLU1 at Ser 77
suggested_questions:
- question: >-
    Should GO:0005739 mitochondrion be detached from PANTHER node PTN001271790? The term
    reaches 111 gene products across 64 taxa on the strength of a single Candida albicans
    TLO protein whose own source paper restricts mitochondrial localisation to one clade of
    a Candida-specific Mediator-subunit-paralog expansion, and whose domain architecture
    includes IPR021017 Med2, which no ARGLU1 ortholog has. Removing the term from that node
    would correct 111 annotations in one edit, and the node itself is sound for
    GO:0005654 nucleoplasm, which it carries on three reviewed ARGLU1 orthologs.
- question: >-
    Is TLO16 correctly placed inside the ARGLU1 family at all? It carries both the fungal
    Med2 family signature and the ARGLU1 family signature, so it may be a genuine chimaera
    or a clustering artefact. If its placement is correct then the node needs a term set
    that is the least common ancestor of a Mediator tail subunit and a splicing coregulator,
    which is a different curation problem from the one above.
- question: >-
    Does ARGLU1 bind the glucocorticoid receptor directly? The primary paper states that
    ARGLU1 interacts with GR through its C-terminal domain, but the biochemical support is
    coactivation assays and endogenous immunoprecipitation mass spectrometry rather than a
    binding assay with purified proteins. No nuclear receptor binding term is proposed in
    this review for that reason. If a direct interaction were demonstrated, the term to use
    is GO:0035259 nuclear glucocorticoid receptor binding, which is active and is one of
    eight current children of GO:0016922 nuclear receptor binding. An earlier draft of this
    review said GO:0035259 was obsolete and that GO:0016922 was therefore maximal; that was
    wrong and would have sent a curator to a needlessly general term. The GO API and OLS4
    both report GO:0035259 active with no replacement, and the repository's own
    cache/ontologies/go.tsv carries it without an obsolete prefix and with is_obsolete
    False. Only QuickGO reports it obsolete, and QuickGO also returns zero children for
    GO:0016922 where OLS4 returns eight, so QuickGO is the outlier on both counts. What
    does hold is the narrower fact that GO:0035257 and GO:0035258 were absorbed into
    GO:0016922.
- question: >-
    Is ARGLU1's reported stimulation of DNA damage repair a gain-of-function artefact? The
    repair phenotypes were measured after adenoviral overexpression in reporter cell lines,
    whereas the knockdown readout in the same study was growth arrest rather than a repair
    defect. No DNA repair term is proposed here until a loss-of-function experiment supports
    one.
suggested_experiments:
- hypothesis: >-
    SRPK2 phosphorylation of the ARGLU1 RS-repeat region controls its nuclear speckle
    partitioning and therefore its access to nascent transcripts.
  description: >-
    Map SRPK2 phosphorylation of ARGLU1 and test what it controls. IntAct records the
    ARGLU1-SRPK2 pair from an in vitro protein kinase assay typed as phosphorylation, and
    the ARGLU1 N-terminus is a genuine RS-repeat region with three annotated phosphosites.
    Identify the modified residues by mass spectrometry after an in vitro reaction, then
    compare phospho-dead and phospho-mimetic N-terminal mutants for RNA binding by
    RNAcompete or CLIP, for nuclear speckle partitioning by quantitative imaging against
    SRSF2, and for autoregulation by the intron-2 retention assay.
  experiment_type: biochemistry and cell imaging
- hypothesis: >-
    sisRNA binding and RS-region phosphorylation are two inputs to a single speckle
    partitioning switch rather than independent mechanisms.
  description: >-
    Combine sisRNA overexpression with SRPK inhibition and ask whether speckle
    relocalisation of ARGLU1 requires phosphorylation, requires the RNA, or requires both.
    An epistasis readout would distinguish a single switch from two additive inputs.
  experiment_type: cell imaging and epistasis
- hypothesis: >-
    ARGLU1 binds holo-Mediator, not only the isolated MED1 subunit.
  description: >-
    Pull down endogenous Mediator and probe for ARGLU1, and reciprocally test binding of
    purified recombinant ARGLU1 C-terminal region to the MED1 far C-terminus and to a
    reconstituted Mediator tail module. This would settle whether GO:0036033 mediator
    complex binding is the right term or whether a subunit-level statement is all the data
    support.
  experiment_type: biochemistry
- hypothesis: >-
    A defined subset of ARGLU1-dependent splicing changes requires direct pre-mRNA binding,
    and the remainder are secondary to transcriptional change.
  description: >-
    Complement an ARGLU1 knockout with N-terminal-only and C-terminal-only constructs and
    perform RNA-seq with nascent transcription profiling, to establish which splicing
    changes are secondary to transcriptional change and which require direct pre-mRNA
    binding. The primary study already shows that at least one ARGLU1-dependent splicing
    target is not bound by the protein, so the two classes exist and have not been
    enumerated.
  experiment_type: functional genomics
