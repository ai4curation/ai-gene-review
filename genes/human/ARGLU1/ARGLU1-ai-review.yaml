- description: >-
    Coactivation of ligand-activated nuclear receptors, including the glucocorticoid and
    estrogen receptors, through the glutamate-rich coiled-coil C-terminal region. The
    activity is co-operative, synergising with SRC-family and PGC1-alpha coactivators, and
    is executed on chromatin at target gene promoters together with the Mediator subunit
    MED1, to which ARGLU1 binds directly. It is not explained by the protein's two
    degenerate LXXLL motifs, which are dispensable.
