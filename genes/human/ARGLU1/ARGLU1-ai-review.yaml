- description: >-
    Sequence-specific binding of a subset of pre-mRNAs through the arginine/serine-rich
    N-terminal region, with a preference for G-rich CGG(A/G)GG elements near regulated
    splice sites, coupled to modulation of cassette-exon choice. The same region contacts
    the 3' splice site recognition machinery, so ARGLU1 acts at the point where U2 snRNP
    is recruited rather than on the catalytic steps of splicing.
