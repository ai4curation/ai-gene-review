- term:
    id: GO:0045296
    label: cadherin binding
  evidence_type: HDA
  original_reference_id: PMID:25468996
  qualifier: enables
  review:
    summary: >-
      Derived from a proximity-biotinylation survey of the E-cadherin cytoplasmic tail.
      The assay reports neighbourhood within the labelling radius, and the paper itself
      describes its hits as proteins in the vicinity of the tail, not as cadherin-binding
      proteins. ARGLU1 is nuclear in every curated location it holds.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Three lines converge. First, the assay-to-term mapping overreaches: the study used
      proximity biotinylation to identify 561 proteins near the E-cadherin cytoplasmic
      tail, and proximity is not binding. Second, the scale is that of a screen rather
      than a finding: the committed reference-scope audit shows this single reference
      produced 272 GO:0045296 annotations over 272 distinct gene products, 271 of them
      HDA, all assigned by BHF-UCL, against a control in the same table where the ARGLU1
      primary paper annotates four gene products. Third, ARGLU1 is topologically
      implausible as a junctional cadherin ligand: its UniProt subcellular location is
      Nucleus, Nucleus speckle and Chromosome, all four of its experimentally supported
      cellular component terms are nuclear, and no study in its literature places it at a
      cell junction. MARK_AS_OVER_ANNOTATED rather than REMOVE because the high-throughput
      observation itself is not being called false, only the inference from proximity to
      binding, and because this is the modal verdict on this exact row across the corpus:
      the committed sibling-verdict survey finds 38 merged reviews carrying this same term
      and reference, resolved as MARK_AS_OVER_ANNOTATED 21 times, KEEP_AS_NON_CORE 11,
