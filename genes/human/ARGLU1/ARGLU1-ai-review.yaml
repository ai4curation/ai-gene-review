- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - CGD:CAL0000179812
  - PANTHER:PTN001271790
  review:
    summary: >-
      Phylogenetic propagation of mitochondrion from PANTHER node PTN001271790. Resolving
      the single non-tree token in the WITH/FROM field shows the whole propagation rests
      on one Candida albicans protein, TLO16, which is a telomere-associated Mediator-tail
      paralog rather than an ARGLU1 ortholog, and whose mitochondrial localisation its own
      source paper restricts to one clade of a lineage-specific gene-family expansion.
    action: REMOVE
    reason: >-
      The committed PANTHER node audit makes this measurable rather than argumentative.
      Node PTN001271790 propagates both nucleoplasm and mitochondrion to exactly the same
      111 gene products across 64 NCBI taxa, so the two terms differ only in their donor
      pools. For nucleoplasm, three gene products in the set hold the term by their own
      experimental evidence and all three are reviewed ARGLU1 orthologs. For
      mitochondrion, exactly one does: CGD:CAL0000179812, which resolves to the
      unreviewed TrEMBL entry A0A1D8PRM3, Tlo16p of Candida albicans, holding GO:0005739
      by a single IDA from PMID:22923044. Every one of the 111 mitochondrion rows names
      that same accession, so the annotation of the entire eukaryotic ARGLU1 family,
      including plants, green algae, Selaginella, Marchantia, Trichoplax, Daphnia and all
      vertebrates, traces to that one protein. Two facts finish the argument. First, TLO16
      is architecturally not an ARGLU1 ortholog: InterPro assigns it IPR021017 Mediator
      complex subunit Med2 (Pfam PF11214) and the AH/BAR superfamily in addition to the
      shared IPR033371, whereas human ARGLU1 carries IPR033371 and nothing else. Second,
      its own source paper reports the mitochondrial localisation as a property of one
      clade of a Candida-specific expansion from one or two ancestral copies to fourteen,
      with the other two clades nuclear. A localisation that is not even uniform across
      one lineage-specific family within one species cannot support a pan-eukaryotic node.
      Human ARGLU1 has no mitochondrial evidence of any kind, no targeting sequence, and
      four experimentally supported cellular component terms that are all nuclear. Noted
      deliberately: 213 merged reviews in this repository carry a GO:0005739 IBA row and
      their modal verdict is ACCEPT, so this REMOVE diverges from the corpus; it does so
      because in this case the entire donor pool is a single architecturally divergent
      fungal paralog.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - LINEAGE_OR_TAXON_MISMATCH
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: CGD:CAL0000179812
        source_label: TLO16
        source_status: SOURCE_BAD
        comment: >-
          Resolves via UniProt xref to A0A1D8PRM3, an unreviewed TrEMBL entry, Tlo16p of
          Candida albicans SC5314. It holds GO:0005739 by IDA from PMID:22923044 and is
          the only gene product in the 111-member propagated set with its own
          experimental evidence for the term. It is a member of the TLO family, a
          Candida-specific expansion of Mediator subunit Med2 paralogs, and InterPro
          gives it IPR021017 and the AH/BAR superfamily in addition to IPR033371, so its
          domain architecture differs from human ARGLU1's. Its source paper confines the
          mitochondrial localisation to the gamma clade of that family. CGD itself
          assigns the protein ND for both molecular function and biological process.
      - source_id: PANTHER:PTN001271790
        source_label: ARGLU1 family ancestral node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The ancestral node, not a protein. It is a legitimate node that correctly
          carries GO:0005654 nucleoplasm to the same 111 gene products on the strength of
          three reviewed ARGLU1 orthologs. The defect is not the node's existence but the
          attachment of a mitochondrion term to it from a single divergent occupant.
    supported_by:
    - reference_id: PMID:22923044
      supporting_text: clade α and clade β have no introns and encode proteins that
        localize primarily to the nucleus; clade γ sometimes undergoes splicing, and
        the gene products localize within the mitochondria as well as the nuclei.
    - reference_id: PMID:22923044
      supporting_text: The telomere-associated TLO gene family underwent a recent expansion
        from one or two copies in other CUG clade members to 14 expressed copies in C.
        albicans.
    - reference_id: PMID:22923044
      supporting_text: The 14 expressed TLO gene family members have a conserved Med2
        domain at the N terminus, suggesting a role in general transcription.
