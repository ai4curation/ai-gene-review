- id: PMID:36533631
  title: Distinct biogenesis pathways may have led to functional divergence of the
    human and Drosophila Arglu1 sisRNA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract-only. Supplies the sisRNA arm of the autoregulatory circuit and the
      statement that ARGLU1 protein has splicing-inhibitory activity on its host gene, which
      is the direction evidence behind the proposed GO:0048025 annotation. Worth noting for
      anyone reading the nucleoplasm IBA: this paper shows the human and Drosophila sisRNA
      mechanisms differ in both biogenesis and sign, so the fly ortholog being a WITH/FROM
      donor does not imply mechanistic identity.
  findings:
  - statement: The ARGLU1-derived sisRNA binds ARGLU1 protein and relocates it to nuclear
      speckles, relieving its splicing-inhibitory activity on the host gene.
    supporting_text: Mechanistically, Arglu1 sisRNA represses the splicing-inhibitory
      activity of ARGLU1 protein by binding to ARGLU1 protein and promoting its localization
      to nuclear speckles, away from the Arglu1 gene locus.
