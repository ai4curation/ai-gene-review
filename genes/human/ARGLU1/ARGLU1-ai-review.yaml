- id: PMID:22923044
  title: The three clades of the telomere-associated TLO gene family of Candida albicans
    have different splicing, localization, and expression features.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Not a paper about ARGLU1, but the sole experimental source of the GO:0005739
      mitochondrion annotation that reaches human ARGLU1 by IBA, so it is decisive for this
      review. Verified against PubMed; no retraction or erratum. Cached abstract-only, and
      the abstract states the clade-restricted localisation and the Med2 domain content
      directly, which is all this review relies on.
  findings:
  - statement: Mitochondrial localisation is restricted to the gamma clade of the TLO
      family; the alpha and beta clades are nuclear.
    supporting_text: clade α and clade β have no introns and encode proteins that
      localize primarily to the nucleus; clade γ sometimes undergoes splicing, and the
      gene products localize within the mitochondria as well as the nuclei.
  - statement: TLO proteins carry a conserved Med2 domain, i.e. they are Mediator tail
      subunit paralogs, and the family is a Candida albicans-specific expansion.
    supporting_text: The 14 expressed TLO gene family members have a conserved Med2 domain
      at the N terminus, suggesting a role in general transcription.
