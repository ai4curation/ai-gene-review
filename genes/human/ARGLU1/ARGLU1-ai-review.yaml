- id: PMID:25468996
  title: E-cadherin interactome complexity and robustness resolved by quantitative
    proteomics.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      The paper is sound and correctly identified; the problem is the use made of it. It
      reports proteins in the vicinity of the E-cadherin cytoplasmic tail by proximity
      biotinylation, and that result has been converted into 272 cadherin binding
      annotations over 272 distinct gene products. For a nuclear protein such as ARGLU1 the
      inference from proximity to binding is not supported. Full text is cached and was
      read.
  findings:
  - statement: The study used proximity biotinylation to identify 561 proteins near the
      E-cadherin cytoplasmic tail, i.e. neighbourhood rather than binding.
    supporting_text: We used proximity biotinylation and quantitative proteomics to identify
      561 proteins in the vicinity of the cytoplasmic tail of E-cadherin.
- id: PMID:27899669
  title: An Ultraconserved Element (UCE) controls homeostatic splicing of ARGLU1 mRNA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached and read. Establishes the autoregulatory circuit and its direction,
      in human HeLa, HEK293 Flp-In T-REx and MCF7 cells including a CRISPR protein-null
      line, which is what licenses the human IMP on the proposed GO:0048025 annotation. No
      retraction or erratum.
  findings:
  - statement: Raising ARGLU1 protein shifts its own transcript towards intron retention
      and NMD and away from the productive isoform; loss of protein shifts it the other way.
    supporting_text: Further, overexpression of the ARGLU1 protein shifted the splicing of
      endogenous ARGLU1 mRNA, resulting in an increase in the retained intron isoform and
      nonsense mediated decay susceptible isoform and a decrease in the fully spliced
      isoform.
  - statement: The isoform structure was confirmed in three human cell lines.
    supporting_text: This was confirmed in HeLa, HEK293 Flp-In TRex and MCF7 cells by
      RT-PCR and Northern blot (Figure 2A and B, Supplementary Figure S1B).
- id: PMID:30698747
  title: ARGLU1 is a transcriptional coactivator and splicing regulator important
    for stress hormone signaling and development.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The primary paper on this gene and the source of most of its experimental GO
      annotations. Full text cached and read, including the results and figure legends. No
      retraction or erratum. Two things in it are easy to misread and are handled
      explicitly in this review: the LXXLL motifs are shown to be dispensable rather than
      required, and the cellular RNA immunoprecipitation was performed in mouse Neuro-2a
      cells with tagged human constructs, so the human and mouse annotations derived from
      it are not independent.
  findings:
  - statement: The C-terminal region alone coactivates GR as well as the full-length
      protein; the N-terminal region alone does not.
    supporting_text: These studies revealed that the construct containing only the
      C-terminus (ARGLU1C-term) retained the ability to coactivate GR, comparable to that
      of the full-length protein; whereas, the construct containing only the N-terminus
      (ARGLU1N-term) did not (Figure 2B).
  - statement: The degenerate LXXLL motifs do not account for coactivation.
    supporting_text: These data suggest that while the C-terminal domain is important for
      activation, these motifs alone cannot account for the ARGLU1 mediated transactivation
      of GR, thus, other non-canonical interactions are likely involved.
  - statement: Purified ARGLU1 binds G-rich CGG(A/G)GG RNA elements in vitro.
    supporting_text: Computational analysis of the microarray data found full length ARGLU1
      preferentially bound to CGG(A/G)GG type k-mers (Figure 3C, Supplementary Figure S9).
  - statement: ARGLU1 and its N-terminal region, but not its C-terminal region, enrich
      specific endogenous pre-mRNAs in cells.
    supporting_text: Our results showed that full-length ARGLU1 and ARGLU1N-term (but not
      ARGLU1C-term) pulldowns enrich Lpin1 and Bin1 pre-mRNA
  - statement: A splicing target lacking G-rich sequence near its splice sites is not
      bound, so some ARGLU1-dependent splicing changes are indirect.
    supporting_text: In contrast, Brwd3 pre-mRNA (undergoes ARGLU1-dependent AS but does not
      contain G-rich sequences near splice sites) is not enriched (Supplementary Figure
      S9E).
  - statement: ARGLU1 interacts reciprocally with PUF60, U2AF2 and JMJD6.
    supporting_text: The MS results were confirmed with co-IP western blotting experiments
      in which ARGLU1 was found to interact with PUF60, U2AF2 and JMJD6 (Figure 3B).
  - statement: ARGLU1 colocalizes strongly with the nuclear speckle marker SRSF2.
    supporting_text: Studies performed with GFP-tagged nuclear speckle marker SRSF2
      demonstrated very high co-localization with ARGLU1 with a Pearson correlation
      coefficient (PCC) of 0.83
  - statement: Glucocorticoid-induced alternative splicing changes are largely lost without
      ARGLU1.
    supporting_text: Treatment with dexamethasone, a GR activator, also induces changes in
      the pattern of alternatively spliced genes, many of which were lost when ARGLU1 was
      absent.
