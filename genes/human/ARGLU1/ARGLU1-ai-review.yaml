- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:30698747
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6NYC1
  review:
    summary: >-
      Co-immunoprecipitation with JMJD6, the oxygenase that hydroxylates U2AF2, in the
      ARGLU1 primary paper. Real interaction, uninformative term.
    action: REMOVE
    reason: >-
      The generic term is removed as uninformative, not as incorrect. GO:1990935
      splicing factor binding, used on the U2AF2 and PUF60 rows, was considered here and
      withheld, on a narrower ground than an earlier draft of this review claimed. That
      draft said JMJD6 carries zero annotations anywhere under GO:0008380 RNA splicing.
      The query behind it used is_a and part_of descendants only, which structurally
      cannot reach regulation terms, because GO relates regulation to its target by
      regulates. Widening it shows JMJD6 does hold GO:0048024 regulation of mRNA
      splicing, via spliceosome, by IMP. What remains true is the finer distinction:
      JMJD6 has no annotation to splicing itself, only to its regulation, and it is an
      oxygenase that hydroxylates a splicing factor rather than a component of the
      splicing machinery. Whether a regulator of splicing satisfies the term's
      requirement that the partner be involved in removing sections of the primary
      transcript is a question the definition does not settle, so the term is withheld
      here rather than asserted, and the ambiguity is recorded rather than hidden. The JMJD6 contact is
      arguably the most mechanistically interesting of the four, because a later study
      proposes that ARGLU1 acts by competing JMJD6 away from BRD4 to enhance
      promoter-proximal Pol II pausing; but that mechanism is hedged by its own authors
      and does not yield a molecular function term for ARGLU1. The committed IntAct
      audit notes that JMJD6 is the weakest of the four partners by method diversity:
      all five of its rows use anti-tag co-IP, three of them spoke-expanded rows from
      two releases of the same AP-MS pipeline, so the independent support is the primary
      paper's directed co-IP plus one pipeline.
    supported_by:
    - reference_id: PMID:30698747
      supporting_text: The MS results were confirmed with co-IP western blotting
        experiments in which ARGLU1 was found to interact with PUF60, U2AF2 and JMJD6
