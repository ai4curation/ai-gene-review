  review:
    summary: >-
      Yeast two-hybrid interaction with SRPK2 from a targeted spliceosome protein
      interaction map. SRPK2 is a protein kinase, so an informative replacement term
      is available and the bare protein binding row should not stand.
    action: MODIFY
    reason: >-
      Per the project's policy, a bare GO:0005515 row is replaced by a more informative
      term when the evidence supports one. SRPK2 (P78362) is a serine/arginine protein
      kinase, so GO:0019901 protein kinase binding is directly supported and strictly
      more informative. The interaction is not a one-screen artefact: the committed
      IntAct audit finds three rows for this pair from three independent studies using
      three orthogonal methods (yeast two-hybrid here, an in vitro protein kinase assay
      in PMID:23602568, and AP-MS in PMID:33961781), and all four of ARGLU1's curated
      partners resolve to reviewed Swiss-Prot entries at canonical length with nuclear
      localisation. SRPK2 is itself annotated to nuclear speckles, the compartment
      ARGLU1 occupies. Worth stating explicitly, because this review admits GO:1990935 splicing factor binding on the U2AF2 and PUF60 rows using a measured criterion: SRPK2 passes that criterion too, carrying two IDA annotations under GO:0008380 RNA splicing, so both terms are defensible for this partner. GO:0019901 is preferred because the relationship that was actually measured here is catalytic rather than merely associative, and the kinase term carries that mechanistic content where the splicing-factor term would discard it.
