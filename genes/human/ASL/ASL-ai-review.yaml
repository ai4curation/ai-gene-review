- term:
    id: GO:0045429
    label: positive regulation of nitric oxide biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:22081021
  qualifier: involved_in
  review:
    summary: Retain experimentally supported nitric-oxide regulation as a second core role.
    action: ACCEPT
    reason: The human R236W construct was used in COS7 complex-assembly experiments, while R113Q was expressed
      in ASL-deficient patient fibroblasts and restored arginine-stimulated nitrite generation. These
      are distinct experiments. Mouse lung and brain immunoprecipitations address Nos3 and Nos1 assemblies
      respectively. The evidence supports a structural contribution beyond arginine synthesis, without
      establishing direct binding to every partner, a universal complex containing all NOS isoforms, or
      an explanation for every disease manifestation. The original Results label the fibroblast rescue
      mutant R113Q, while the indexed official Fig. 6c caption labels it R113W. The residue identity is
      reported here as stated in the Results; the within-paper discrepancy is unresolved and does not
      change the demonstrated catalytic-site-mutant rescue.
