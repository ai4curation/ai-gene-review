id: P04424
gene_symbol: ASL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Argininosuccinate lyase (ASL) is a cytosolic homotetramer that catalyzes the reversible cleavage
  of argininosuccinate into arginine and fumarate. It acts downstream of argininosuccinate synthetase
  (ASS1) in the urea cycle and supplies arginine in other tissues. Catalytic sites contain contributions
  from multiple ASL subunits, allowing some combinations of defective alleles to recover activity through
  intragenic complementation. ASL also provides structural support for nitric oxide synthase (NOS) assemblies
  involving ASS1, the arginine transporter SLC7A1/CAT-1 and HSP90. This role supports efficient use of
  extracellular arginine for nitric oxide production independently of ASL-mediated arginine synthesis;
  the NOS isoform and assembly context vary by tissue. Pathogenic variants cause argininosuccinic aciduria,
  a urea-cycle disorder with hyperammonemia and hepatic, neurological and vascular manifestations that
  can persist despite ammonia control. Impaired nitric oxide production contributes to vascular dysfunction
  but does not explain every manifestation.
