    reason: NOS-complex co-immunoprecipitation decreases without ASL, while human catalytically inactive
      R236W ASL supports assembly in COS7 cells. Mouse lung and brain show reduced complex-associated
      components despite increased abundance of the individual proteins. These assembly observations,
      together with catalytic-mutant rescue of nitrite production in patient fibroblasts, support a structural
      scaffold contribution rather than catalytic necessity alone. The evidence does not establish a single
      universal complex containing every NOS isoform or direct pairwise contact with every component.
      The Results/caption mutant-label discrepancy is retained once in the reference assessment and notes.
    supported_by:
    - reference_id: PMID:22081021
      supporting_text: "Mechanistic studies showed that ASL has a structural \nfunction in addition to\
        \ its catalytic activity, by which it contributes to the \nformation of a multiprotein complex\
        \ required for NO production."
      full_text_unavailable: false
