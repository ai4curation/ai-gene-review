core_functions:
- description: Catalyzes the reversible cleavage of argininosuccinate into arginine and fumarate as a
    cytosolic homotetramer, contributing directly to the urea cycle and arginine biosynthesis. Self-association
    assembles the catalytic sites and is part of this enzyme mechanism.
  molecular_function:
    id: GO:0004056
    label: argininosuccinate lyase activity
  directly_involved_in:
  - id: GO:0000050
    label: urea cycle
  - id: GO:0006526
    label: L-arginine biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:11747433
    supporting_text: "Argininosuccinate lyase (ASL) is a homotetrameric enzyme that catalyzes the \nreversible\
      \ cleavage of argininosuccinate to arginine and fumarate."
    full_text_unavailable: true
  - reference_id: PMID:11747432
    supporting_text: "a reaction involved in the \nbiosynthesis of arginine in all species and in the\
      \ production of urea in \nureotelic species"
    full_text_unavailable: true
  - reference_id: PMID:11747433
    supporting_text: "The \n3-dimensional structure of wild-type ASL has enabled us to propose that the\
      \ \ncomplementation between two ASL active site mutant subunits, Q286R and D87G, \noccurs through\
      \ a regeneration of functional active sites in the heteromutant \nprotein. We have reconstructed\
      \ this complementation event, both in vivo and in \nvitro, using recombinant proteins and have confirmed\
      \ this hypothesis."
    full_text_unavailable: true
