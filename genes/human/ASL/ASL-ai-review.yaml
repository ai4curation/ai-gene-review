gene_symbol: ASL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Argininosuccinate lyase (ASL) is a cytosolic homotetramer that catalyzes the reversible
  cleavage of argininosuccinate into arginine and fumarate. This reaction regenerates arginine in the
  urea cycle and supplies arginine in other tissues. Active sites contain contributions from multiple
  subunits, allowing some combinations of inactive alleles to recover activity through intragenic complementation.
  ASL also contributes structurally to nitric oxide synthase protein assemblies: experiments with catalytically
  inactive human ASL distinguish complex assembly and utilization of extracellular arginine for nitric
  oxide production from arginine-generating catalysis. Pathogenic variants cause argininosuccinic aciduria,
  a urea-cycle disorder associated with hyperammonemia and additional systemic manifestations.'
