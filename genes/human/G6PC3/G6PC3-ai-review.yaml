  title: Brain contains a functional glucose-6-phosphatase complex capable of endogenous glucose production.
- id: PMID:4303362
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic abstract concerns developing rat kidney, phosphatase and phosphoenolpyruvate
      carboxykinase activity, and glucose synthesis from pyruvate/glutamate. The current rat Q6AZ83 GO
      record cites it for glucose-6-phosphate metabolism. The accessible abstract does not distinguish
      the molecular isoenzyme, so the attribution is unresolved at that level; publication date and generic
