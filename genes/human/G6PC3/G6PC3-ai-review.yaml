gene_symbol: G6PC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Glucose-6-phosphatase catalytic subunit 3 (G6PC3) is a widely expressed endoplasmic reticulum
  membrane phosphatase with nine transmembrane helices and a catalytic site facing the ER lumen. It hydrolyzes
  glucose 6-phosphate and several other phosphate esters, using His167 to form a covalent phosphohistidine
  intermediate. A well-established physiological role is removal of 1,5-anhydroglucitol 6-phosphate, a
  side product of hexose-phosphorylating enzymes that inhibits hexokinases when it accumulates. The ER
  transporter SLC37A4 supplies this substrate to G6PC3. Its dephosphorylation protects cellular glucose
  utilization and is particularly important for neutrophil survival and function. Biallelic loss-of-function
  variants cause severe congenital neutropenia type 4, sometimes accompanied by nonhematological developmental
  abnormalities whose relationship to the enzyme’s substrate range remains incompletely resolved.
