    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official page models defective G6PC3 variants with loss of function and links both
      the normal G6PC3 entity and normal reaction R-HSA-3262512. Its disease title must not be read as
      a negative statement about wild-type enzyme activity. The disease-event catalyst is distinguished
      from the normal protein; no assertion that every variant retains normal localization is inferred.
- id: Reactome:R-HSA-70263
  title: Gluconeogenesis
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The retained native pathway record identifies Gluconeogenesis. A fresh direct request
      to the pathway web URL returned 404, so that response is not cited as successful page access. The
      official child reaction R-HSA-3262512 explicitly identifies Gluconeogenesis as its parent event
      and names G6PC3 as catalyst, resolving the target-membership question independently of the broad
      pathway summary. Net human tissue flux remains unquantified by this curated hierarchy.
- id: PMID:30626647
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The original PMC6347702 BioC document identifies this PMID and title. Selected Results,
      Discussion and construct Methods were read: human G6PC3 membrane preparations with H167A control,
      sugar-phosphate substrate comparisons, human HAP1 perturbation/metabolites, hexokinase inhibition,
      mouse neutrophil-model experiments and limited human patient neutrophil data. These establish direct
      1,5-anhydroglucitol 6-phosphate dephosphorylation and cellular detoxification. Rat microsomal transport
      measurements are distinguished from human enzyme activity; the G6PC3 patient sample is one individual.
      Full figure images and every supplementary assay were not independently read. The paper notes no
      established physiological role for the dephosphorylated 1,5-anhydroglucitol product, so the literal
      useful-product condition in the narrower GO repair definitions is not assumed satisfied.'
  title: Failure to eliminate a phosphorylated glucose analog leads to neutropenia in patients with G6PT
    and G6PC3 deficiency.
- id: PMID:39548727
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The original PMC11788743 BioC document identifies this PMID and title. Selected Results,
      tables, Discussion and Methods were read. Recombinant human GFP-tagged G6PC3 was assayed in HEK-cell
      lysates with empty-vector background; this was not purified-protein kinetics. Rat liver microsomal
      transport and HL-60 differentiation experiments are distinct systems. Alternative sugar-phosphate
      hydrolysis demonstrates biochemical breadth without establishing physiological substrate use in
      intact human cells. The source's Table 1 and discussion invert the approximate fructose-6-phosphate/mannose-6-phosphate
      Km assignment; no conflicting numerical value is promoted into the functional synthesis. The absence
      of a significant G6PC3 expression change during the tested differentiation does not establish a
      differentiation-regulatory activity.
  title: Biochemical characterization of the human ubiquitous glucose-6-phosphatase in neutrophil granulocytes.
- id: PMID:15661744
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic abstract reports a functional mouse astrocyte G6PC3/G6PT glucose-production
      system and discusses the terminal reactions of glycogenolysis/gluconeogenesis. The actual mouse
      Q6NSQ9 GO record supplies experimental gluconeogenesis grounding. Complete original Methods were
