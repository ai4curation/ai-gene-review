  review:
    action: NEW
    summary: G6PC3 directly detoxifies cells by hydrolyzing the hexokinase inhibitor 1,5-anhydroglucitol
      6-phosphate.
    reason: 'Original experiments in PMID:30626647 show hydrolysis by recombinant human G6PC3 with a catalytic
      H167A control, accumulation of 1,5-anhydroglucitol 6-phosphate in G6PC3-deficient human cells, inhibition
      of hexokinases by that metabolite and altered cellular glucose utilization. G6PC3 itself performs
      the detoxifying chemical step; SLC37A4 supplies the separate transport step. The assertion is therefore
      supported by mechanistic participation as well as perturbation evidence. Human PGP, CLYBL and MAPDA
      provide same-role enzyme comparators annotated to toxic metabolite repair, an is_a child of cellular
      detoxification. Use only this single process: the narrower repair definitions currently require
      production of a useful metabolite, whereas a physiological role for the 1,5-anhydroglucitol product
      is unresolved. Do not add its detoxification parent or repair children redundantly, and do not infer
      apoptosis-regulator activity from downstream neutrophil consequences.'
    supported_by:
    - reference_id: PMID:30626647
      supporting_text: 1,5AG6P accumulates in G6PC3- or G6PT-deficient cells incubated with 1,5AG
