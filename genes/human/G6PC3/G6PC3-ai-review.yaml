references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official GO method page describes experimentally grounded ancestral phylogenetic
      annotation and traceable node/descendant sources. For G6PC3, the actual PTHR12591 tree, aligned
      target sequence and all four literal IBD records were checked. Target evidence in WITH/FROM is legitimate
      descendant grounding. The method explains provenance; it does not determine whether an inherited
      activity is the target's principal physiological role.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official GO method page describes mappings from UniProt subcellular-location vocabulary
      to GO. The literal SL-0097 source agrees with the G6PC3 ER membrane record. Independent human topology
      and biochemical evidence supports the location; the mapping is electronic provenance, not an imaging
      experiment.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official GO reference identifies manual interpretation of Human Protein Atlas immunofluorescence/confocal
      microscopy with literature-supported localization grading. The individual G6PC3 antibody images
      were not independently re-read. Human topology and enzyme evidence independently supports the curated
      ER location; no cell-line or antibody detail is inferred from the method reference alone.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl
    Compara
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official GO reference describes Ensembl Compara transfer of experimentally supported
      annotations between orthologs. The actual rat Q6AZ83 and mouse Q6NSQ9 records were inspected. The
      rat glucose-6-phosphate-process source PMID:4303362 has unresolved isoenzyme-specific experimental
      scope in the accessible abstract; independent human catalytic evidence supports the biological assertion
      without manufacturing an upstream source correction.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The official GO method page describes consolidation of identical electronic assertions
      from multiple pipelines, with literal contributing sources retained in WITH/FROM. The current G6PC3
      activity and pathway records preserve those sources. Combined mappings do not establish physiological
      substrate preference or replace the primary human enzyme and cell experiments.
- id: PMID:14718531
  title: Histidine 167 is the phosphate acceptor in glucose-6-phosphatase-beta forming a phosphohistidine
    enzyme intermediate during catalysis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The authentic publication abstract directly establishes a covalent phosphoryl intermediate
      during G6Pase-beta glucose-6-phosphate hydrolysis, identifies His167 as phosphate acceptor, and
      places it with Arg79 and His114 on the luminal side of a nine-transmembrane ER protein. The abstract
      does not specify the construct species; current human GOA and target identity supply the human attribution.
      Full original Methods were not recovered. This supports the reaction and topology without establishing
      glucose-6-phosphate as the dominant physiological substrate.
- id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: The authentic abstract describes an NK-like YTS membrane-proteome study reporting 1,843
      high-confidence proteins. It provides the correct setting for the original HDA membrane annotation.
      The G6PC3-specific peptide table was not independently recovered, so the abstract is not claimed
      to verify an individual target identification. The generic location is biologically compatible and
      less informative than ER membrane.
- id: PMID:25492228
  title: Functional analysis of mutations in a severe congenital neutropenia syndrome caused by glucose-6-phosphatase-β
    deficiency.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Methods and Results from PMC4794745 were read, including human recombinant
      wild-type and variant expression in COS-1 cells, supplied glucose-6-phosphate assays, mock controls
      and protein measurements. Fourteen variants lacked measured activity; S139I and R189Q retained about
      49% and 45%. This establishes catalytic capability and variant effects. The older intracellular-glucose-production
      explanation is not treated as a direct demonstration that loss of glucose-6-phosphate hydrolysis
      alone causes neutropenia; the later mechanistic substrate work is considered separately.
- id: Reactome:R-HSA-3262512
  title: G6PC3 hydrolyzes G6P to form Glc and Pi (ubiquitous)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official reaction page explicitly names G6PC3 as the ER membrane catalyst of glucose-6-phosphate
      hydrolysis, lists substrates/products, and identifies the reaction as an event of Gluconeogenesis.
      This directly establishes target participation in the curated pathway hierarchy. It does not quantify
      physiological flux or prove substrate preference.
- id: Reactome:R-HSA-3282876
  title: Defective G6PC3 does not hydrolyze glucose 6-phosphate
