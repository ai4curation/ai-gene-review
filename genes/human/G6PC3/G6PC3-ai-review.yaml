- id: PMID:12370122
  title: Identification and characterization of a human cDNA and gene encoding a ubiquitously expressed
    glucose-6-phosphatase catalytic subunit-related protein.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic PubMed abstract identifies human UGRP/G6PC3, its 346-residue coding sequence,
      and RNA-blot detection in every examined tissue, highest in muscle. This supports broad expression.
      The same early study reported no measured glucose-6-phosphate hydrolysis; that negative assay is
      retained as the source's finding rather than treated as a contemporary refutation of later direct
      catalytic experiments. Full original Methods were not independently read.
- id: PMID:19118303
  title: A syndrome with congenital neutropenia and mutations in G6PC3.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The native full-text record was read in selected clinical/genetic Results and functional
      Methods/Results. Five index patients had homozygous R253H, and seven additional patients carried
      distinct biallelic G6PC3 mutations; cardiac, urogenital and venous abnormalities varied. Human wild-type
      and R253H constructs were assayed in yeast microsomes, and human G6PC3 reconstitution reduced apoptosis
      in patient-derived myeloid cells. This supports disease causation and variable extrahematological
      manifestations. It does not establish that glucose-6-phosphate is the dominant physiological substrate
      or that G6PC3 independently performs apoptosis regulation. Figure images and the complete supplement
      were not independently read. The official 2011 correction (doi:10.1056/NEJMx110035) was read: it
      corrects Patient 8 to G260R, the other missense count to two, and notes monoallelic HAX1 V172I in
      Patient 10. These corrections do not alter the R253H experiments or the broad disease-causation
      interpretation.'
- id: PMID:22050868
  title: 'Extended spectrum of human glucose-6-phosphatase catalytic subunit 3 deficiency: novel genotypes
    and phenotypic variability in severe congenital neutropenia.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The authentic PubMed abstract reports 16 G6PC3-deficient patients among 31 selected
      patients with syndromic severe congenital neutropenia, including 11 with novel biallelic mutations.
      It documents variable nonhematological features including genital, skeletal, growth and integument
      abnormalities. This supports the clinical variability statement, without treating this selected
      cohort as a population prevalence estimate or specifying a metabolic cause for each developmental
      feature. Full original Methods were not independently read.
suggested_questions:
- question: Which phosphate esters other than 1,5-anhydroglucitol 6-phosphate are physiological G6PC3
    substrates outside neutrophils, and what supplies them to the ER lumen?
- question: How much does G6PC3-mediated glucose 6-phosphate hydrolysis contribute to local endogenous
    glucose production in different human tissues, independently of its role in removing a hexokinase
    inhibitor?
- question: Do nonhematological phenotypes in G6PC3 deficiency reflect 1,5-anhydroglucitol 6-phosphate
    accumulation or other substrates in particular cell types?
- question: Does GO metabolite repair/toxic metabolite repair encompass detoxifying 1,5AG6P to 1,5AG despite
    the current useful-metabolites wording and the source’s statement that 1,5AG has no established physiological
    role, or is cellular detoxification the appropriate process annotation? No need to infer utility from
    the paper’s informal metabolite-repair label.
suggested_experiments:
- hypothesis: G6PC3 substrate requirements differ between tissues because the accessible ER substrate
    pool differs.
  description: Compare isotope-resolved metabolite turnover in G6PC3-deficient and rescued human neutrophil
    precursors and selected nonmyeloid cells, with separate perturbation of SLC37A4 and matched transporter-independent
    lysate assays.
- hypothesis: A portion of glucose 6-phosphate hydrolysis may support local glucose production independently
    of detoxification.
  description: Measure labeled noncarbohydrate-carbon incorporation into newly released glucose while
    controlling 1,5-anhydroglucitol exposure and testing wild-type versus catalytic-mutant G6PC3 rescue.
    Distinguish net gluconeogenesis from glucose 6-phosphate recycling.
proposed_new_terms:
- proposed_name: 1,5-anhydro-D-glucitol-6-phosphate phosphatase activity
  proposed_definition: 'Catalysis of the reaction: 1,5-anhydro-D-glucitol 6-phosphate + H2O = 1,5-anhydro-D-glucitol
    + phosphate.'
  proposed_parent:
    id: GO:0016791
    label: phosphatase activity
  justification: Specifies the toxic-metabolite dephosphorylation directly performed by human G6PC3; broader
    sugar-phosphatase terms describe demonstrated substrate-class capabilities but do not name this physiological
    substrate.
  supported_by:
  - reference_id: PMID:30626647
