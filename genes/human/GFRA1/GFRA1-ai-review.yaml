id: P56159
gene_symbol: GFRA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GFRA1 (GDNF family receptor alpha-1) is a glycosylphosphatidylinositol-anchored protein of
  the outer leaflet of the plasma membrane that serves as the ligand-binding co-receptor for glial cell
  line-derived neurotrophic factor (GDNF). GDNF binds GFRA1, and the GDNF-GFRA1 pair recruits the receptor
  tyrosine kinase RET into a 2:2:2 ternary complex that dimerizes RET and triggers its trans-autophosphorylation
  and downstream RAS-MAPK and PI3K signaling. Released or soluble GFRA1 can also present GDNF to RET in
  trans. Binding to SORL1 diverts GFRA1 from the cell surface to the trans-Golgi network, endosomes and
  multivesicular bodies. Through GDNF-RET signaling GFRA1 supports survival and differentiation of dopaminergic
  and other neurons and ureteric bud branching during kidney development; biallelic loss-of-function variants
  cause bilateral renal agenesis.
