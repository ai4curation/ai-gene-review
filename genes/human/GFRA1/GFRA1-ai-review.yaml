    label: signaling receptor binding
  evidence_type: TAS
  original_reference_id: PMID:9545641
  qualifier: enables
  review:
    summary: GFRA1 with GDNF forms the functional ligand for RET.
    action: ACCEPT
    reason: GFRA1 directly binds RET within the ternary complex; signaling receptor binding describes
      its contact with RET, complementary to its GDNF receptor activity.
    supported_by:
    - reference_id: PMID:9545641
      supporting_text: GDNF and GFRA1 (GDNF family receptor, also known as GDNFR-alpha), its GPI-linked
        coreceptor, were demonstrated to be components of a functional ligand for RET
