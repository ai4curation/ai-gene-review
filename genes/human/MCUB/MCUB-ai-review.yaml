suggested_questions:
- question: Which of the mouse macrophage and muscle-regeneration ISS rows should remain on human 
    MCUB as non-core physiology rather than pathway-context annotations?
suggested_experiments:
- description: Reconstitute human uniplexes with fixed MCU:MCUB stoichiometries and matched 
    EMRE/MICU subunits, then compare Ca2+ conductance and MICU-dependent activation thresholds in 
    proteoliposomes or mitoplast-like bilayers.
  experiment_type: in vitro channel reconstitution
  hypothesis: Each MCUB subunit incorporated into the tetrameric pore progressively reduces channel 
    opening and MICU1/MICU2 association.
