id: Q9NWR8
gene_symbol: MCUB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MCUB encodes a mitochondrial inner-membrane paralog of the MCU pore-forming subunit. MCUB associates
  with the mitochondrial calcium uniporter complex but acts as a dominant-negative inhibitory subunit:
  when incorporated into the functional uniplex, it displaces MCU and reduces MICU1/MICU2 association,
  lowering calcium uptake and protecting against mitochondrial calcium overload in stress contexts. Unlike
  MCU, MCUB is not itself a calcium-conducting channel.
