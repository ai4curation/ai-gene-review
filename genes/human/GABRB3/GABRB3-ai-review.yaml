  title: Differential assembly diversifies GABA(A) receptor structures and signalling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic PubMed identity/abstract and selected complete original PMC7612593 BioC Results/Methods
      passages were read. Actual experimental assemblies contain alpha4 and beta3 with delta or gamma2;
      beta2 appears in historical comparisons. The beta3-containing structural and functional experiments
      directly inform receptor assembly and ligand responses, including histamine-site interpretation
      within the tested assemblies. Recombinant architecture and pharmacology are distinguished from native
      human extrasynaptic localization, a current natural splice assignment or universal responses across
      subunit combinations. No figure images, raw maps or electrophysiological traces were inspected.
- id: PMID:39843743
  title: Resolving native GABA(A) receptor structures from the human brain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic publication identity and selected complete Results/Methods passages in the
      shared native full-text cache were read. Alpha1-selected receptors purified from pooled neurosurgical
      tissue outside epileptic foci include beta2/beta3 mixtures and beta3-containing assemblies, supporting
      native human beta3 receptor membership. Mixed or unresolved subunit positions, alpha1-based selection
      and surgical sampling preclude a complete healthy-brain composition census or assignment of current
      natural splice products. Recombinant drug experiments and native receptor observations are distinguished.
      Tentative accessory-protein fits are not demonstrated direct beta3-neuroligin contacts. No images,
      structural maps, raw traces or complete mass-spectrometry tables were inspected.
