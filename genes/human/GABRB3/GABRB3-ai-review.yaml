- id: PMID:17021187
  title: 'Functional role of GABAergic innervation of the cochlea: phenotypic analysis of mice lacking
    GABA(A) receptor subunits alpha 1, alpha 2, alpha 5, alpha 6, beta 2, beta 3, or delta.'
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: 'Genuine native full main text was read after the earlier abstract-only draft. Beta3
      nulls show six-week cochlear dysfunction, approximately24-week hair-cell loss and reduced afferent
      terminals in two stained null ears. Rare fragile beta3 animals constrained design: no beta3 six-week
      histopathology, P10/P21 developmental comparison only for alpha5/beta2, and beta3 progression with
      age explicitly not tested. Thus precise developmental/innervation-formation assertions remain unresolved
      despite positive mature beta3 phenotypes. Six-week beta3-specific soma/axoplasm staining is distinguished
      from combined beta2/3 staining. Images, supplementary figures and numeric Table1 cells were not
      independently inspected.'
