  - reference_id: PMID:35355020
    supporting_text: GABA at 100 nM robustly activates currents in α4β3δ cells
suggested_questions:
- question: Which natural beta3 splice products reach neuronal surface receptors and retain channel function
    in their physiological partner combinations?
- question: What beta3-specific evidence resolves the precise cochlear developmental and cytoplasmic-vesicle
    assertions?
- question: Does beta3-containing receptor contact induction use a defined extracellular ligand in vivo,
    and how does it differ across receptor assemblies?
suggested_experiments:
- description: Compare the four sequence-verified natural beta3 products in matched human receptor assemblies
    using surface quantification and single-channel measurements.
- description: Test beta3-specific localization and developmental timing with validated reagents while
    separating neuronal plasma-membrane labeling from receptor-bearing transport vesicles.
