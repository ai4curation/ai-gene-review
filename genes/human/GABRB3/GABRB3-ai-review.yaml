  review:
    summary: The cited negative regulation is performed by receptor accessory proteins, not established
      for beta3 itself.
    action: REMOVE
    reason: The complete main text of original review PMID:33234346 was read; it explicitly assigns reduced
      forward trafficking and GABAergic transmission to CLPTM1, and altered receptor-current decay to
      SHISA7. Beta3-containing receptors are the regulated complexes. GO:0032229 describes reducing GABAergic
      transmission, not the ordinary inhibitory effect of transmitting through a GABA receptor. This NAS
