id: P28472
gene_symbol: GABRB3
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GABRB3 encodes the beta3 subunit of pentameric GABA-A receptors. Its extracellular domain
  contributes neurotransmitter-binding interfaces, and its membrane-spanning region contributes the chloride-channel
  pore. Beta3 assembles with alpha and other receptor subunits at neuronal plasma membranes, including
  postsynaptic and extrasynaptic receptor populations. Receptor composition controls gating and ligand
  responses. Human variants can alter receptor activity, and experimental beta3-containing assemblies
  also affect inhibitory contact formation and developmental phenotypes.
