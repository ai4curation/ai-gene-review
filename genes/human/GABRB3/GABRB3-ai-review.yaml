- id: PMID:24909990
  title: Crystal structure of a human GABAA receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic PubMed identity/abstract and selected complete original PMC4167603 Methods,
      Results and captions were read. The engineered human beta3 construct forms a homopentamer with resolved
      subunit interfaces, surface expression and separately measured currents. The synthetic M82919-derived
      construct replaces the large intracellular loop and retains a purification tag; it is not a natural
      short product. Benzamidine-bound crystallographic desensitization is distinct from electrophysiological
      channel activation, and millimolar GABA thermostabilization is not a current EC50. These observations
