core_functions:
- description: Contributes ligand-binding interfaces and pore-lining structure to heteropentameric GABA-A
    receptors, converting GABA binding into chloride conductance. Synaptic receptor action is directly
    supported; extrasynaptic deployment is supported by native beta3 compartment evidence combined with
    functionally studied receptor assemblies, rather than a beta3-specific native tonic-current assay.
    Companion subunits determine gating and pharmacology; engineered beta3 homomers are a distinct experimental
    context.
  contributes_to_molecular_function:
