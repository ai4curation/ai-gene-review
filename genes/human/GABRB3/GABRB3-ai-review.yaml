    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic abstract and subsequently available native full-text selected Results and
      Methods were read. Human beta3 cDNA in a baculovirus vector was expressed in Sf9 cells. Cysteine
      substitutions, Cu:phen oxidation and DTT reversal support the reported intersubunit cross-linking;
      computational docking is distinguished from measured cross-linking and radioligand binding. Earlier
