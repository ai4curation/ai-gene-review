  structural constructs with engineered intracellular-loop replacements or BRIL insertions are not natural
  short isoforms. Historical transcript variant 2 terminology is not mapped to a current suffix without
  sequence reconciliation. Direct activity of every current product is not established. PMID:35140402
  labels mature beta3 1–447, while the current 473-aa precursor minus residues 1–25 gives 448 residues;
