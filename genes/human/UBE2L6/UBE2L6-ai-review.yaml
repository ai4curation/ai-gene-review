id: O14933
gene_symbol: UBE2L6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: UBE2L6 (UbcH8) is an interferon-inducible E2 conjugating enzyme of the UBC fold that serves as the major E2 for
  the ubiquitin-like modifier ISG15 and also functions as a ubiquitin E2. It accepts ISG15 from the ISG15-specific E1 UBA7
  (UBE1L) as a thioester on its active-site cysteine (Cys86) and passes it to E3 ligases such as HERC5 and TRIM25, enabling
  ISGylation of many cytosolic and some nuclear proteins, including antiviral effectors (RIG-I, PKR, MxA) and PCNA, after
  type I interferon stimulation. Like its close paralog UBE2L3 (UbcH7), it is also charged with ubiquitin by UBA1 and pairs
  with HECT-type (E6AP) and RBR/RING-type ligases (e.g. RNF19A, RNF19B, RNF144B, RNF40, SIAH1, ARIH2) to ubiquitinate substrates
  such as p53 (with E6/E6AP), syntaxin 1 and FLT3-ITD, promoting their proteasomal degradation. UBE2L6 is itself a target
  of ISGylation.
