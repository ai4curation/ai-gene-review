suggested_questions:
- question: Should PAINT node PTN000631065 be annotated with the E2-specific GO:0061653 ISG15 conjugating enzyme activity
    instead of the parent GO:0042296 ISG15 transferase activity?
- question: Like UBE2L3, does UBE2L6 lack intrinsic lysine reactivity (so that it functions only with HECT/RBR E3s), and does
    this explain why RING-only E3s rarely use it productively?
- question: What fraction of IFN-induced ISGylation in vivo is UBE2L6-dependent versus supported by other E2s, given residual
    ISGylation after knockdown?
suggested_experiments:
- description: Measure ISGylation and antiviral responses in UBE2L6 knockout human cells and Ube2l6-null mice, compared with
    Uba7-null, to define the E2's non-redundant contribution to ISG15-mediated antiviral defence.
- description: Single-turnover lysine-discharge assays of UBE2L6~ubiquitin and UBE2L6~ISG15 with free lysine and with RING
    versus HECT/RBR E3s to determine whether UBE2L6 is lysine-unreactive like UBE2L3.
