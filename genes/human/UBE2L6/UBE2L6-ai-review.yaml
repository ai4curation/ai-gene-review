- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10085091
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9UBS8
  review:
    summary: IPI binding of UBE2L6 to RNF14/ARA54 (RBR E3) (PMID:10085091). UBE2L6 is an E2 that is recruited by HECT, RBR
      and some RING E3 ligases; this interaction is an E2-E3 pairing.
    action: MODIFY
    reason: Bare protein binding is uninformative. The partner is a ubiquitin ligase, and E2-E3 pairing is the functional
      basis of UBE2L6 activity (E3s such as E6AP, Staring, Dorfin, p53RFP and NKLAM recruit UbcH8 and use it for substrate
      ubiquitination), so the informative term is ubiquitin protein ligase binding. This does not assert that every high-throughput
      pair is functional in vivo.
    proposed_replacement_terms:
    - &id002
      id: GO:0031625
      label: ubiquitin protein ligase binding
