  review:
    summary: IBA from deep E2 node PTN002514495. UbcH8 supports HECT-mediated polyubiquitination (Rsp5p/WBP2 in vitro; E6AP
      substrates) and RING/RBR-dependent ubiquitination leading to degradation (syntaxin 1, FLT3-ITD).
    action: KEEP_AS_NON_CORE
    reason: UBE2L6 is inside the E2 clade that PAINT annotated, and human data show it transfers ubiquitin for HECT-dependent
      polyubiquitination. Chain assembly with UbcH7-like E2s is performed by the cognate HECT/RBR E3, so UBE2L6 contributes
      the E2 step; the ubiquitin role is real but its distinctive, IFN-induced role is ISG15 conjugation.
    supported_by:
    - &id008
      reference_id: PMID:15131269
      supporting_text: Rsp5p catalyzed efficient polyubiquitination of WBP2 in the presence of E1 Ub and UbcH8
    - &id001
      reference_id: PMID:9153201
      supporting_text: only the E6AP-interacting E2s could function in conjunction with E6AP in the ubiquitination of an E6
        independent substrate of E6AP
