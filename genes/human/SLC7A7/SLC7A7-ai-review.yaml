  supporting_entities:
  - MGI:MGI:1337120
  - PANTHER:PTN002623481
  review:
    summary: >-
      IBA: y+LAT1 transports basic (cationic) amino acids. Correct substrate class, but the
      established mechanism is obligatory antiport (exchange of a cationic amino acid for a neutral
      amino acid plus Na+), for which a more specific term exists.
    action: MODIFY
    reason: >-
      The transporter does not perform facilitated/uniport of basic amino acids; it is an obligate
      exchanger. GO:0180009 (broad specificity neutral L-amino acid:basic L-amino acid antiporter
      activity) is an is_a descendant of GO:0015174 and precisely captures the system y+L mechanism,
      so this is a refinement to the specific supported term.
    proposed_replacement_terms:
    - id: GO:0180009
      label: broad specificity neutral L-amino acid:basic L-amino acid antiporter activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002623481
        source_label: LAT-family basic amino acid transporter node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The ancestral node correctly asserts basic amino acid transporter activity for the y+LAT
          clade; the transfer is sound but stops at the substrate class and does not encode that the
          family operates by obligate neutral/basic antiport (GO:0180009).
    supported_by:
    - reference_id: file:human/SLC7A7/SLC7A7-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        L-leucine(out) + L-arginine(in) + Na(+)(out) = L-leucine(in) + L-arginine(out) + Na(+)(in)
    - reference_id: PMID:9878049
      supporting_text: >-
        form exchangers which mediate the cellular efflux of cationic amino acids and the
        Na+-dependent uptake of large neutral amino acids
