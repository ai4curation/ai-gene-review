proposed_new_terms: []
suggested_questions:
- question: >-
    Beyond supplying arginine to macrophages, does y+LAT1 contribute directly to any non-transport
    molecular process, or are all of the extra-transport phenotypes of lysinuric protein intolerance
    (immune, pulmonary, urea-cycle) strictly downstream consequences of the cationic amino acid
    transport defect?
suggested_experiments:
- description: >-
    Use the recent cryo-EM structures of the y+LAT1-4F2hc complex (PDB 8XXI, 8YLP, 9KJU) with bound
    arginine and leucine to define the substrate-binding and antiport gating residues, and map the
    LPI missense variants onto them to distinguish folding/trafficking defects from direct
    transport-mechanism defects.
