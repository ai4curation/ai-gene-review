- term:
    id: GO:1902495
    label: transmembrane transporter complex
  evidence_type: IPI
  original_reference_id: PMID:9878049
  qualifier: part_of
  review:
    summary: >-
      y+LAT1 is part of a transmembrane transporter complex - the disulfide-linked heterodimer with
      SLC3A2/4F2hc (ComplexPortal CPX-8187, Y+LAT1-4F2 heteromeric amino acid transporter complex).
    action: MODIFY
    reason: >-
      This is the functional unit of the transporter: SLC3A2 is required for surface trafficking and
      the two subunits are covalently linked. The complex is specifically the heteromeric amino acid
      transporter (a multi-transmembrane light chain disulfide-linked to a type II glycoprotein heavy
      chain). GO:1990184 (amino acid transport complex) is the specific, structurally accurate complex
      class for this LAT-light-chain/heavy-chain heterodimer (y+LAT1-4F2hc) - a child of GO:0032991
      protein-containing complex (under plasma membrane protein complex), the term SLC7A5 and the merged
      SLC3A1 review also use. It is not an is_a descendant of the generic GO:1902495 transmembrane
      transporter complex; this is a lateral MODIFY to the correct complex term, not an is_a refinement.
      This complex membership is the informative replacement for the bare protein-binding annotations
      removed above.
    proposed_replacement_terms:
    - id: GO:1990184
      label: amino acid transport complex
    supported_by:
    - reference_id: file:human/SLC7A7/SLC7A7-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Disulfide-linked heterodimer with the amino acid transport protein SLC3A2/4F2hc.
