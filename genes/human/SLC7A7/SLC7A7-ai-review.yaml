gene_symbol: SLC7A7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC7A7 encodes y+LAT1, the catalytic light subunit of the system y+L heteromeric amino acid
  transporter. It is a multi-pass membrane protein of the amino acid-polyamine-organocation (APC)
  superfamily (L-type amino acid transporter family) that is disulfide-linked to the heavy chain
  SLC3A2 (4F2hc/CD98hc); association with SLC3A2 is required for delivery of the functional
  transporter to the cell surface. The heterodimer is an obligatory, electroneutral 1:1 antiporter
  that exports intracellular cationic amino acids (arginine, lysine, ornithine) in a Na+-independent
  manner in exchange for extracellular neutral amino acids (leucine, glutamine) plus Na+; the
  Na+-dependence applies only to the neutral-amino-acid arm. In polarized epithelia of the kidney
  proximal tubule and small intestine the transporter resides in the basolateral membrane, where it
  drives efflux of reabsorbed cationic amino acids into the blood, and it is also the principal y+L
  transporter of monocytes and macrophages. Loss of function causes lysinuric protein intolerance.
