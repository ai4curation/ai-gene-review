id: Q9H2C2
gene_symbol: ARV1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ARV1 is a conserved multi-pass ER membrane protein. It is a component of the GPI N-acetylglucosaminyltransferase
  (GPI-GnT) complex that initiates glycosylphosphatidylinositol anchor biosynthesis: it binds PIGQ and
  helps the enzyme use phosphatidylinositol. Biallelic ARV1 variants reduce cell-surface GPI-anchored
  proteins and cause developmental and epileptic encephalopathy. ARV1 also takes part in cellular sterol
  homeostasis. Its ARV1 homology domain binds cholesterol and phospholipids, and loss of ARV1 retains
  cholesterol in the ER and suppresses SREBP signalling. In yeast, however, sterol transport between the
  ER and plasma membrane is intact without Arv1, and Arv1 instead maintains ER and plasma membrane structure.
  An alternative model holds that Arv1 helps deliver the GlcN-acyl-PI intermediate to the luminal face
  of the ER.'
