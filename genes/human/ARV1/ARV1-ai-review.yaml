    reason: '[PMID:20663892 "Knockdown of ARV1 in murine liver and HepG2 cells was associated with accumulation
      of cholesterol in the ER at the expense of the plasma membrane and suppression of sterol regulatory
      element-binding proteins and their targets."] [PMID:23668914 "We report that sterol transport between
      the ER and PM is unaffected by Arv1 deficiency."]'
    supported_by:
