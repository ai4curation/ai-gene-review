suggested_questions:
- question: Are ARV1's GPI-GnT role and its sterol-homeostasis role linked, for example through phosphatidylinositol
    or sterol binding by its ARV1 homology domain?
- question: Does mammalian ARV1 affect ER-to-plasma membrane cholesterol transport when assayed directly,
    or, as in yeast, is the ER cholesterol accumulation a consequence of altered membrane homeostasis?
- question: Is ARV1 a GPI-GnT subunit that enhances PI use, a flippase-like factor delivering GlcN-acyl-PI
    to the ER lumen, or both?
suggested_experiments:
- description: Test whether AHD lipid-binding mutants separate GPI-GnT enhancement from ER cholesterol
    export in ARV1-null cells.
