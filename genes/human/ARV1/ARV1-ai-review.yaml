- id: PMID:20663892
  title: Decreased expression of ARV1 results in cholesterol retention in the endoplasmic reticulum and
    abnormal bile acid metabolism.
  full_text_unavailable: true
  findings:
  - statement: ARV1 knockdown retains cholesterol in the ER.
    supporting_text: Knockdown of ARV1 in murine liver and HepG2 cells was associated with accumulation
      of cholesterol in the ER at the expense of the plasma membrane and suppression of sterol regulatory
      element-binding proteins and their targets.
  - statement: ARV1 mediates sterol transport from the ER to the plasma membrane (the interpretation of
      the accumulation phenotype).
    supporting_text: Knockdown of ARV1 in murine liver and HepG2 cells was associated with accumulation
      of cholesterol in the ER at the expense of the plasma membrane and suppression of sterol regulatory
      element-binding proteins and their targets.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:23668914
      review_notes: Direct anterograde and retrograde transport assays in yeast find sterol transport
        unaffected by Arv1 loss. Mammalian transport has not been assayed directly, so the accumulation
        phenotype is not evidence of a transport activity.
      supported_by:
      - reference_id: PMID:23668914
        supporting_text: We report that sterol transport between the ER and PM is unaffected by Arv1 deficiency.
      - reference_id: PMID:23668914
        supporting_text: Arv1 regulates PM and ER membrane structure and homeostasis but is dispensable
          for intracellular sterol transport.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; HepG2 and mouse liver. The phenotype is solid, and its transport interpretation
      is disputed by PMID:23668914.
