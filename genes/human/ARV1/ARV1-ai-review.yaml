    label: cholesterol transport
  evidence_type: IDA
  original_reference_id: PMID:20663892
  qualifier: acts_upstream_of_or_within
  review:
    summary: Cholesterol transport (IDA). The source reports ER cholesterol accumulation in ARV1-deficient
      HepG2 cells and mouse liver, an observation of altered sterol distribution. These are real phenotypes
      of a sterol-homeostasis role, but its mechanism is undefined. Direct yeast assays find sterol transport
      intact without Arv1. Kept as non-core.
