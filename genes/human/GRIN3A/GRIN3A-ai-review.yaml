    label: NMDA glutamate receptor activity
  evidence_type: IDA
  original_reference_id: PMID:17502428
  qualifier: enables
  review:
    summary: NMDA glutamate receptor activity cited to a study of glycine-activated NR1/NR3A/NR3B receptors in HEK293
      cells.
    action: ACCEPT
    reason: 'The claim is sound: GluN3A contributes to NMDA glutamate receptor activity as a modulatory subunit
      of GluN1/GluN2/GluN3A receptors, shown for native human assemblies and recombinant tri-heteromers, and accepted
      on the other rows for this term. The cited paper is not evidence for it, though: the receptors it recorded
      are glycine-gated and the abstract states they were not stimulated by glutamate. The reference problem is
      recorded as a source defect.'
    supported_by:
    - reference_id: PMID:17997397
      supporting_text: We found that NR3A is associated with NR1, NR2A and NR2B in adult human CNS, suggesting the
        existence of native NR1-NR2A/B-NR3A assemblies in adult human CNS
    - reference_id: PMID:20660562
      supporting_text: NR1/NR2C/3A receptors were less blocked by 2 mM Mg(2+) than were NR1/NR2C receptors
    - reference_id: PMID:17502428
      supporting_text: These glycine-activated receptors were not stimulated by glutamate or kainic acid and were
        resistant to magnesium block
    source_defects:
    - defect_type: WRONG_REFERENCE
      resource: UNIPROT
      requested_change: CHECK
      asserted_value: PMID:17502428
      confidence: PROBABLE
      explanation: The human GRIN3A IDA annotation to NMDA glutamate receptor activity (GO:0004972) cites PMID:17502428,
        which characterises glycine-activated NR1/NR3A/NR3B receptors in HEK293 cells and states that they were
        not stimulated by glutamate or kainic acid. The paper supports glycine-gated cation channel activity (GO:0160212),
        not NMDA glutamate receptor activity. Only the abstract was checked.
