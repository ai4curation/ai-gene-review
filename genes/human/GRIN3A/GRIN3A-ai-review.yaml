core_functions:
- description: GluN3A binds glycine and, with GluN1, forms an unconventional excitatory glycine-gated cation channel. Glycine
    occupancy at GluN3A opens the channel, whereas glycine at GluN1 drives rapid desensitization; the assembled GluN1/GluN3A
    pore carries monovalent cations with low calcium permeability.
  contributes_to_molecular_function: *id008
  directly_involved_in:
  - id: GO:0098655
    label: monoatomic cation transmembrane transport
  locations:
  - id: GO:0098839
    label: postsynaptic density membrane
  - id: GO:0045211
    label: postsynaptic membrane
  in_complex: &id010
    id: GO:0098878
    label: neurotransmitter receptor complex
  supported_by:
  - *id001
  - *id002
  - *id003
  - reference_id: PMID:26777280
    supporting_text: Binding of glycine to the high-affinity GluN3 subunits triggers channel opening
- description: The GluN3A ligand-binding domain binds glycine with high affinity. Glycine is the principal agonist of GluN1/GluN3A
    receptor opening.
  molecular_function:
    id: GO:0016594
    label: glycine binding
  in_complex: *id010
  supported_by: *id007
suggested_questions:
- question: Which adult human synapses carry functional GluN1/GluN3A excitatory glycine receptors rather than triheteromeric
    GluN1/GluN2/GluN3A receptors?
- question: Which GluN3A cytosolic-tail partners, among MAP1S, PP2A and GIT1-associated proteins, control endogenous human
    receptor retention at postsynaptic versus extrasynaptic membranes?
- question: Should GO split the NR1/NR3 excitatory glycine receptor complex from the canonical NMDA selective glutamate receptor
    complex?
suggested_experiments:
- hypothesis: Endogenous human GluN1/GluN3A receptors generate a CGP-78608-sensitive excitatory glycine conductance in juvenile
    cortical neurons.
  description: Patch-clamp human iPSC-derived cortical neurons or early postnatal human cortical tissue with GluN2-selective
    blockers plus CGP-78608, then repeat after selective GRIN3A knockdown or CRISPR knockout.
  experiment_type: subunit-selective electrophysiology
