id: Q8TCU5
gene_symbol: GRIN3A
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GRIN3A encodes GluN3A, a glycine-binding member of the NMDA-receptor ionotropic glutamate receptor family. GluN3A
  co-assembles with GluN1 to form unconventional excitatory glycine-gated cation channels with low calcium permeability, and
  it can also enter GluN1/GluN2/GluN3 receptors where it dampens current amplitude, calcium permeability and Mg2+ block. Human
  GluN1/GluN3A receptors assemble as 1-3-1-3 heterotetramers opened by glycine binding to the GluN3A ligand-binding domains,
  while glycine binding to GluN1 favors desensitization. GluN3A is a multi-pass plasma-membrane subunit found in NMDA-family
  receptor complexes in human brain and is concentrated in postsynaptic specializations; its cytosolic tail can bind MAP1S,
  PP2A and other regulatory proteins that influence receptor positioning and synaptic maturation.
