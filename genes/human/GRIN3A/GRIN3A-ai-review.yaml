  review:
    summary: Developmental process projected by orthology from rat Grin3a, whose annotation is an IEP (expression
      pattern) annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The rat source annotations record that Grin3a is expressed in the developing region (inferred from expression
      pattern), not that GluN3A does any of the work of building the structure. GluN3A is expressed mainly during
      brain development, and it has a genuine developmental role in spine maturation, which is recorded separately;
      expression in a developing nucleus does not establish participation in that nucleus's development.
