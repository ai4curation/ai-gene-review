- term:
    id: GO:0160212
    label: glycine-gated cation channel activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - RGD:621704
  review:
    summary: Glycine-gated cation channel activity transferred from rat Grin3a.
    action: ACCEPT
    reason: GluN1/GluN3A receptors are excitatory cation channels gated by glycine alone. Glycine binding to the
      GluN3 subunit opens the channel, while glycine binding to GluN1 reduces the current. The human GluN1-GluN3A
      receptor has been characterised structurally and functionally, and native GluN1/GluN3A receptors have been
      recorded in juvenile mouse hippocampus.
    supported_by:
    - reference_id: PMID:11823786
      supporting_text: NR3A or NR3B co-assembles with NR1 to form excitatory glycine receptors that are unaffected
        by glutamate or NMDA
    - reference_id: PMID:17214961
      supporting_text: glycine bound to the NR1 subunit causes auto-inhibition of NR1/NR3 receptors whereas glycine
        binding to the NR3 subunits is required for opening of the ion channel
    - reference_id: PMID:26777280
      supporting_text: Binding of glycine to the high-affinity GluN3 subunits triggers channel opening, whereas
        glycine binding to the low-affinity GluN1 subunits causes an auto-inhibition of the maximal glycine-inducible
        receptor current
    - reference_id: PMID:38598639
      supporting_text: Uniquely, NMDARs composed of GluN1 and GluN3 are activated exclusively by glycine
    - reference_id: PMID:30425244
      supporting_text: using CGP-78608 on P8-P12 mouse hippocampal slices, we demonstrate that excitatory glycine
        GluN1/GluN3A NMDARs are functionally expressed in native neurons, at least in the juvenile brain
- term:
    id: GO:1902951
    label: negative regulation of dendritic spine maintenance
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9R1M7
  - ensembl:ENSRNOP00000007957
  review:
    summary: Negative regulation of dendritic spine maintenance transferred from rat Grin3a (IMP PMID:25009255).
    action: KEEP_AS_NON_CORE
    reason: 'GluN3A acts as a brake on spine maturation in postnatal development: it binds the scaffold GIT1 and
      limits GIT1 synaptic localisation and complex formation with betaPIX, reducing Rac1 activation; its overexpression
      increases spine elimination, and its loss increases spine number. GluN3A does part of this work through the
      GIT1 interaction, so the term is kept, as a developmental role peripheral to its channel function.'
    supported_by:
    - reference_id: PMID:24297929
      supporting_text: Binding to GluN3A limits the synaptic localization of GIT1 and its ability to complex βPIX,
        leading to decreased Rac1 activation and reduced spine density and size in primary cultured neurons
    - reference_id: PMID:25009255
      supporting_text: We found that overexpressing GluN3A reduced spine density over time, increased spine elimination,
        and decreased spine stability
    - reference_id: PMID:9620802
      supporting_text: Genetic knockout of NR3A in mice results in enhanced NMDA responses and increased dendritic
        spines in early postnatal cerebrocortical neurons
