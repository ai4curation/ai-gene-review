- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      The nuclear IBA is corroborated by an independently curated human nuclear crosslinking observation.
    action: ACCEPT
    reason: >-
      IntAct interaction IM-26653-2713 (EBI-20924026) maps human KIAA1614 Q5VZ46 to histone H2B Q93079
      by crosslinking in PMID:30021884. The primary abstract and cached discussion describe intact-nucleus
      crosslinking followed by fractionation; this provides target-specific corroboration of the nuclear
      IBA. It is high-throughput proximity/association evidence, not a validated nuclear mechanism or
      exclusive localization. The cached full-text extraction lacks the methods/results sections, and
      the raw peptide identifications were not reanalyzed. A reported P-body association does not contradict
      a nuclear pool. The ancestral placement at PTN001019968 is therefore compatible with the available
      target evidence.
    supported_by:
    - reference_id: PMID:30021884
      supporting_text: The crosslinking of intact nuclei coupled with sequential detergent
        fractionation
    - reference_id:
        file:human/KIAA1614/KIAA1614-hypotheses/kgap-kiaa1614-par6-polarity-scaffold/openscientist.md
      supporting_text: Detected by crosslinking mass spectrometry in intact human nuclei (PMID
        30021884).
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001019968
        source_status: SUPPORTS_TRANSFER
        comment: Verified ancestral nuclear IBD and current target descent; independently curated
          nuclear crosslinking corroborates the target location.
