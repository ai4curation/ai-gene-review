references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PTHR14102 contains KIAA1614 in SF12; IBA asserts descent from specific ancestral IBD
      nodes. The current family and target PAINT records retain nuclear, apical-membrane, polarity,
      cortex and centrosome assertions; their scope must be assessed independently of donor count.
- id: UniProt:Q5VZ46
  title: UniProt entry for KIAA1614
  findings:
  - statement: The reviewed sequence is 1190 amino acids, with DUF4685 and extensive predicted
      disorder. IPR051741 is a family classification, not an independently detected Par6 domain.
- id: file:human/KIAA1614/KIAA1614-deep-research-falcon.md
  title: Deep research report on KIAA1614
  findings:
  - statement: >-
      No primary literature directly characterizes KIAA1614 function. All functional
      inferences are based on domain architecture. The PAR6_homolog annotation
      suggests possible scaffold/adaptor role in cell polarity, but this is
      speculative. Experimental validation through AP-MS, co-IP with Par complex
      components, and CRISPR perturbation studies would be needed to confirm
      function.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Useful unknown-function summary, but treating IPR051741 as a physical PAR6 domain
      and asserting no detected partners/localization omits independently curated high-throughput
      evidence. Lack of target studies does not refute IBA.
- id: file:human/KIAA1614/KIAA1614-deep-research-cyberian.md
  title: Cyberian deep research on KIAA1614 function
  findings: []
- id: file:human/KIAA1614/KIAA1614-hypotheses/kgap-kiaa1614-par6-polarity-scaffold/openscientist.md
  title: OpenScientist KIAA1614 Par6-like polarity-scaffold hypothesis report
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Substantive report read and reused. InterPro confirms divergent annotated
      architecture, but also a PTHR14102:SF12 match (reported score 4.6e-32); a four-mer Jaccard
      comparison does not refute homology. IBA is not circular just because the target lacks
      experimental GO rows. Missing domains or interaction-database edges do not establish inability
      to bind. AlphaFold numeric claims lack delivered computational provenance and were not
      adopted. IntAct nuclear H2B and PTPRR associations were independently confirmed; no duplicate
      report needed.
  findings:
  - statement: The report acknowledges that the family alignment underlying the classification was
      not examined.
    supporting_text: the exact basis for grouping KIAA1614 with Par6 cannot be fully evaluated
      without the underlying HMM profile alignment
- id: PMID:30021884
  title: Histone Interaction Landscapes Visualized by Crosslinking Mass Spectrometry in Intact Cell
    Nuclei.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed title/identifier verified; cached abstract and discussion read
      (full_text_available true but methods/results absent). IntAct IM-26653-2713 independently
      verifies Q5VZ46-Q93079 crosslink association. Supports a nuclear pool with high-throughput
      limits; not a KIAA1614-specific functional mechanism.
  findings:
  - statement: Intact-nucleus crosslinking provides the experimental setting for the IntAct-curated
      KIAA1614-histone H2B association.
    supporting_text: The crosslinking of intact nuclei coupled with sequential detergent
      fractionation
- id: file:human/KIAA1614/KIAA1614-uniprot.txt
  title: UniProtKB KIAA1614 sequence and domain-family annotations
  findings: []

knowledge_gaps:
- gap_statement: >-
    KIAA1614 has no established direct molecular mechanism or validated functional partner set.
  boundary: >-
    DUF4685 and the Par6-related family assignment coexist with noncanonical domain architecture. Nuclear
    H2B crosslinking and PTPRR affinity association are experimentally detected leads, not defined biochemical
    functions.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    All current process and localization annotations rest on phylogenetic/domain
    inference. Without a direct molecular activity or partner set, KIAA1614 remains
    function-unknown despite several plausible Par6-related hypotheses.
  resolution: >-
    Affinity/proximity proteomics, co-IP against Par3/Par6/aPKC and other polarity
    factors, DUF4685/PAR6_homolog domain-deletion rescue, and structural/biochemical
    assays for conserved binding surfaces.
  provenance:
  - reference_id: file:human/KIAA1614/KIAA1614-deep-research-falcon.md
    supporting_text: >-
      KIAA1614 (UniProt Q5VZ46) encodes an uncharacterized human protein originally
      identified via large-scale cDNA sequencing. The protein currently lacks an
      experimentally validated molecular function and pathway assignment.
  - reference_id: file:human/KIAA1614/KIAA1614-deep-research-falcon.md
    supporting_text: >-
      DUF4685 (PF15737; InterPro IPR032756) is a Domain of Unknown Function; by
      definition, it has no established, conserved biochemical activity.
  - reference_id: file:human/KIAA1614/KIAA1614-deep-research-falcon.md
    supporting_text: >-
      No directly citable 2023–2024 primary studies conclusively define KIAA1614
      protein function, localization, or interaction partners.
- gap_statement: >-
    The distribution, dynamics and functional relevance of KIAA1614 cellular pools remain incompletely
    characterized.
  boundary: >-
    A nuclear pool is supported by an IntAct-curated histone crosslink from an intact-nucleus study. Cortex
    and apical-membrane IBA assignments remain unresolved; these sites and a reported P-body association
    need not be mutually exclusive.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Distinguishing stable residency from transient association would connect location to a molecular mechanism.
  resolution: >-
    Endogenous tagging or validated-antibody imaging in polarized epithelial and retinal
    cell contexts, with orthogonal fractionation and perturbation of candidate domain
    determinants.
  provenance:
  - reference_id: file:human/KIAA1614/KIAA1614-deep-research-falcon.md
    supporting_text: >-
      Unresolved. Without validated antibodies and microscopy or tagged endogenous
      expression data, subcellular distribution is uncertain.
  - reference_id: file:human/KIAA1614/KIAA1614-deep-research-falcon.md
    supporting_text: >-
      If a polarity-related role exists, membrane-proximal/cortical or junctional
      localization would be plausible, but this is hypothetical.
- gap_statement: >-
    KIAA1614 has no validated pathway or biological-process assignment.
  boundary: >-
    The family IBD assertions are meaningful evolutionary evidence, but divergent annotated architecture
    leaves retention of particular polarity/centrosome roles unresolved. The uncertainty is not solely
    the lack of a KIAA1614 experiment.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    This is the process-level consequence of the MF and CC gaps: the gene cannot be
    confidently placed in a pathway until its molecular partners and site of action
    are known.
  resolution: >-
    CRISPR perturbation and rescue in relevant cells, assaying epithelial polarity,
    junctional integrity, centrosome-cycle phenotypes, and any phenotype tied to
    validated KIAA1614 interaction partners.
  provenance:
  - reference_id: file:human/KIAA1614/KIAA1614-deep-research-falcon.md
    supporting_text: >-
      Unresolved. No validated pathway membership can be assigned at this time.
  - reference_id: file:human/KIAA1614/KIAA1614-deep-research-falcon.md
    supporting_text: >-
      If the PAR6_homolog annotation reflects genuine homology, KIAA1614 may participate
      in cell polarity/signaling scaffolds.
suggested_questions:
- question: Which sequence region supports KIAA1614 placement relative to canonical PARD6 proteins,
    and do the functions asserted at PTN001019968/PTN001019969 extend to its noncanonical
    architecture?
- question: Does the nuclear histone crosslink reflect stable KIAA1614 chromatin association, and
    how does this relate to any cortical, membrane or P-body pool?
