id: Q5VZ46
gene_symbol: KIAA1614
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  KIAA1614 is a 1190-amino-acid human protein with a DUF4685 domain and extensive predicted disordered
  regions. It belongs to the PANTHER Par6-related family, but lacks annotated canonical PB1, CRIB and
  PDZ domains. Nuclear crosslinking proteomics detected an association with histone H2B, and an affinity-purification
  study detected association with PTPRR. These observations identify candidate cellular contexts without
  establishing a molecular mechanism. Its role in cell polarity or centrosome function remains unresolved.
