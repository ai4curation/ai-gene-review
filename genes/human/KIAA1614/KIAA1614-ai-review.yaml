    label: regulation of cellular localization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: >-
      Reassess the ancestral assignment using target architecture and node placement; absence of a human
      assay is not a refutation.
    action: UNDECIDED
    reason: >-
      The broad regulation-of-localization claim may be retained through a noncanonical mechanism; missing
      canonical Par6 domains does not itself refute the process. The historic PTN001019968 assertion is
      not present in the current family IBD slice, which is a version difference rather than proof of
      loss. Live InterPro confirms a DUF4685 domain and a PTHR14102/IPR051741 family match, not a separately
      detected PAR6 domain. The missing annotated PB1/CRIB/PDZ architecture is a substantive reason to
      examine functional divergence, but no family alignment or tree reconstruction establishes loss of
      this particular function. The existing OpenScientist report is incorporated critically: short k-mer
      similarity, low AlphaFold confidence and absence from interaction databases do not prove nonhomology,
      absent binding or absent process participation. Keep uncertainty pending assessment of the relevant
      conserved region and ancestral node, rather than requiring a new experiment for every inherited
      function.
