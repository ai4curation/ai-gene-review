id: Q9NZD1
gene_symbol: GPRC5D
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GPRC5D (RAIG4) is an orphan class C (metabotropic glutamate receptor-like) seven-transmembrane
  G protein-coupled receptor of group 5, with no identified physiological ligand. It is a multi-pass plasma-membrane
  protein whose expression in normal tissue is largely restricted to the hair follicle, where it is implicated
  in hard keratin expression and hair and nail development. GPRC5D forms homodimers. Because its protein
  is strongly and selectively expressed at the surface of malignant plasma cells in multiple myeloma,
  independent of BCMA, it has become a leading cell-surface target for CAR T-cell and bispecific-antibody
  immunotherapy.
