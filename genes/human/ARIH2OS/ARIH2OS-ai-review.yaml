description: ARIH2OS (ARIH2 opposite strand) encodes an uncharacterized 290-residue protein, supported
  only at the transcript level, with a predicted single transmembrane helix near its C-terminus. No publication
  describes its function, location or expression. Database records list proteome-scale interaction calls
  (BioGRID, IntAct), proteomics entries and one O-linked glycosite, which suggest the protein is made
  but do not establish an activity or pathway.
