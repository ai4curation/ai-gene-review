- term:
    id: GO:0000956
    label: nuclear-transcribed mRNA catabolic process
  evidence_type: IDA
  original_reference_id: PMID:27918561
  qualifier: involved_in
  review:
    summary: >-
      In PMID:27918561 the basis is a change in the steady-state level of one
      nonsense-mediated decay substrate (mutant p53 mRNA in Calu-6 cells) when NBDY
      levels change. NBDY knockdown decreased this mRNA and weak overexpression increased
      it. The authors say the decay rate was not measured, and they read the direction of
      the effect as negative regulation of decay. Later genome-wide work (PMID:33059440)
      showed that NBDY loss changes RNA half-lives in both directions. It also showed that
      NBDY does not affect the catalytic activity of the decapping complex.
    action: MODIFY
    reason: >-
      NBDY does not do any of the work of mRNA breakdown. It has no catalytic activity,
      and it does not change the decapping activity of the complex it binds in vitro
      (PMID:33059440). Its tethered-decay function is also dispensable: NBDY 22-41
      disrupts P-bodies without altering tethered mRNA decay (PMID:40360209). The original
      evidence is a steady-state change, not a measured decay rate, and it points toward
      inhibition. The effect NBDY does have is regulatory and bidirectional: loss of NBDY
      stabilizes about 1,200 transcripts and destabilizes about 226, and the effect on
      DCP2 targets depends on the EDC4 interaction. GO:0043488 regulation of mRNA
      stability explicitly covers processes that both stabilize and destabilize mRNAs,
      so it describes NBDY's role accurately. Direct participation in the catabolic
      process does not.
    proposed_replacement_terms:
    - id: GO:0043488
      label: regulation of mRNA stability
    additional_reference_ids:
    - PMID:33059440
    - PMID:40360209
    supported_by:
    - reference_id: PMID:27918561
      supporting_text: These results demonstrate that the cellular concentration of NoBody
        is inversely linked to steady-state abundance of an NMD substrate in Calu-6 cells,
        though the effect of NoBody on the decay rate of this mRNA has not been
        established
    - reference_id: PMID:27918561
      supporting_text: Our observation that loss of NoBody causes a decrease in the
        cellular levels of an NMD substrate is most consistent with negative regulation
        of mRNA decay in cells by NoBody
    - reference_id: PMID:33059440
      supporting_text: NBDY KO dysregulates >1400 RNA half-lives, with 1200 cellular RNAs
        post-transcriptionally stabilized and 226 destabilized relative to WT
    - reference_id: PMID:33059440
      supporting_text: We concluded that NBDY does not affect the in vitro enzymatic
        activity of the decapping complex
    - reference_id: PMID:40360209
      supporting_text: However, despite its impact on P-body formation, NBDY 22–41 did
        not affect mRNA degradation under SMG7-induced conditions
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:27918561
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6P2E9
  review:
    summary: >-
      Binding to EDC4 (Q6P2E9). This is supported by co-immunoprecipitation, GST
      pull-down with purified proteins, and benzophenone photo-crosslinking, and is
      mapped to NBDY residues 22-41 (Leu30 and Trp34). GOA carries this row twice, from
      UniProt and IntAct.
    action: REMOVE
    reason: >-
      Bare protein binding carries no functional information, so the row is removed
      rather than rewritten. Removal does not mean the interaction is false. The
      interaction is direct, specific and functionally required: the EDC4-binding mutant
      W34A fails to rescue P-body number or decay rates of DCP2 substrates
      (PMID:33059440). But GO has no MF term for a non-catalytic protein that binds an
      enhancer of decapping and interferes with its self-association (PMID:40360209).
      The biology is captured by the P-body assembly regulation and mRNA stability
      process annotations.
    additional_reference_ids:
    - PMID:33059440
    - PMID:36877681
    - PMID:40360209
    supported_by:
    - reference_id: PMID:27918561
      supporting_text: Combined, these in-cell and in vitro experiments are consistent
        with a direct interaction between NoBody and EDC4, though we cannot exclude
        additional interactions with other proteins.
    - reference_id: PMID:27918561
      supporting_text: Immunoprecipitation of FLAG-NoBody alanine mutants revealed two
        key residues, Leu30 and Trp34, that impair co-precipitation of NoBody with
        myc-EDC4 (Fig. 3d).
    - reference_id: PMID:36877681
      supporting_text: The results confirm that the N-terminus of EDC4 is required for
        interaction with NBDY inside the cell.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:27918561
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9NPI6
  review:
    summary: >-
      Binding to DCP1A (Q9NPI6), shown by reciprocal co-immunoprecipitation (IntAct
      curation). Later work mapped this contact to the DCP1A EVH1 domain and the NBDY
      C-terminal polyproline motif.
    action: REMOVE
    reason: >-
      Bare protein binding carries no functional information, so the row is removed.
      Removal does not mean the interaction is false. In the original study it may be at
      least partly indirect through EDC4, since depleting EDC4 abolished co-purification
      of the other decapping factors. It is also dispensable for NBDY's effect on
      DCP2-substrate decay (PMID:33059440), so no more informative MF term is
      supportable.
    additional_reference_ids:
    - PMID:33059440
    supported_by:
    - reference_id: PMID:27918561
      supporting_text: Reciprocal co-immunoprecipitation of FLAG-NoBody with myc-tagged
        EDC4 and Dcp1A confirmed its co-purification with these proteins (Fig. 2c,
        Supplementary Fig. 5).
    - reference_id: PMID:33059440
      supporting_text: Independently, the DCP1A EVH1 domain interacts with the C-terminal
        polyproline repeats of NBDY (Figure S2), as expected based on the binding
        specificity of EVH1 domains30, though deletion of the polyproline motif does not
        affect RNA stability and therefore may not be necessary for NBDY function
- term:
    id: GO:0010607
    label: negative regulation of cytoplasmic mRNA processing body assembly
  evidence_type: IDA
  original_reference_id: PMID:27918561
  qualifier: involved_in
  review:
    summary: >-
      Raising NBDY levels disperses P-bodies without degrading their components, and
      this depends on the EDC4-binding region. siRNA knockdown increases P-bodies 1.5- to
      2-fold. CRISPR knockout triples P-bodies, and re-expression rescues this
      (PMID:33059440). Phosphorylation of NBDY at Thr40 or Ser61 is required for P-body
      loss during mitosis and after EGF stimulation (PMID:34346674). NBDY 22-41 blocks
      EDC4-EDC4 self-association, which gives a mechanism (PMID:40360209).
    action: ACCEPT
    reason: >-
      This is NBDY's best-supported and defining biological role. It is shown by gain-
      and loss-of-function, rescue, and point mutants in the EDC4-binding motif and at
      the phosphosites. A proposed mechanism, competition with EDC4 self-association,
      shows that NBDY acts directly on the assembly process. Core annotation.
    additional_reference_ids:
    - PMID:33059440
    - PMID:34346674
    - PMID:40360209
    supported_by:
    - reference_id: PMID:27918561
      supporting_text: P-body dispersal requires residues 31–41 of NoBody, indicating that
        the interaction between NoBody and EDC4 is involved (Fig. 4c).
    - reference_id: PMID:27918561
      supporting_text: We observed a 1.5- to 2-fold increase in P-bodies per cell when
        NoBody was silenced (Fig. 4d,e).
    - reference_id: PMID:33059440
      supporting_text: Consistent with previously reported data using siRNA3, endogenous
        P-body numbers increase by 3-fold in NBDY KO cells, which can be rescued by stably
        reintroducing the NBDY coding sequence on the KO background
    - reference_id: PMID:34346674
      supporting_text: Expression of the nonphosphorylatable NBDY S61A mutant in the NBDY
        KO background abrogated EGF-dependent P-body disappearance
    - reference_id: PMID:40360209
      supporting_text: A dose-dependent reduction in EDC4-EDC4 self-interaction was
        observed as NBDY 22–41 concentration increased (Fig. 3B), indicating that NBDY
        22–41 effectively competes with EDC4, thereby disrupting its self-association.
