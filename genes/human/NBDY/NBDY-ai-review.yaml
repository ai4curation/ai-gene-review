core_functions:
- description: >-
    NBDY is a disordered microprotein that binds the decapping enhancer EDC4 and
    negatively regulates P-body assembly. It binds EDC4 through its 22-41 motif, and its
    effect is tuned by phosphorylation at Thr40 in mitosis and Ser61 after EGF
    signalling. It competes with EDC4 self-association to disperse P-bodies into
    sub-microscopic decapping complexes. The protein has no known catalytic activity,
    and no specific GO molecular function term describes this regulatory binding, so
    molecular_function is left unset.
  directly_involved_in:
  - id: GO:0010607
    label: negative regulation of cytoplasmic mRNA processing body assembly
  locations:
  - id: GO:0000932
    label: P-body
  supported_by:
  - reference_id: PMID:27918561
    supporting_text: Taken together, our results are consistent with an inverse
      correlation of the cellular concentration of the NoBody microprotein with P-body
      numbers that depends on its interaction with the mRNA-decapping complex.
  - reference_id: PMID:40360209
    supporting_text: Together, these results are consistent with our previous
      observations, suggesting that NBDY 22–41 acts as a negative regulator of P-body
      formation by interfering with EDC4-mediated assembly.
  - reference_id: PMID:34346674
    supporting_text: We therefore propose that phosphorylated NBDY is required for
      dissociation of P-bodies into sub-microscopic decapping complexes during both
      mitosis and EGF signaling
- description: >-
    Through its interaction with EDC4, NBDY sets the correct decay rates of a subset of
    DCP2 decapping substrates, stabilizing some and destabilizing others depending on
    their 5' UTR properties. It does this without changing the enzymatic activity of the
    decapping complex.
  directly_involved_in:
  - id: GO:0043488
    label: regulation of mRNA stability
  locations:
  - id: GO:0000932
    label: P-body
  supported_by:
  - reference_id: PMID:33059440
    supporting_text: We conclude that the NBDY-EDC4 interaction is required for
      specification of the stabilities of these transcripts, and propose that NBDY
      regulates the stabilities of DCP2 targets via its direct interaction with the
      decapping complex.
  - reference_id: PMID:33059440
    supporting_text: We conclude that NBDY KO differentially regulates the stability of
      DCP2 targets based on their 5′ UTR properties.
proposed_new_terms: []
suggested_questions:
- question: >-
    Should NBDY be annotated as part of the RNA decapping complex (GO:0098745)? It
    co-purifies with and binds EDC4 and DCP1A directly, but it does not change the
    complex's in vitro activity, and it may be a regulatory binder rather than a
    stoichiometric subunit.
- question: >-
    How does one EDC4-binding microprotein both stabilize and destabilize different DCP2
    substrates, and is the 5' UTR-length dependence a direct effect on substrate access
    to DCP2?
- question: >-
    Is the in vitro NBDY-RNA coacervation (critical concentration about 150 uM) relevant
    at endogenous NBDY concentrations, or is phospho-regulation of P-bodies mediated
    entirely through EDC4?
suggested_experiments:
- description: >-
    Measure decapping of specific DCP2 substrates (e.g. EPC2, GJC1) in vitro with
    purified decapping complex, with and without recombinant NBDY and full-length
    capped transcripts carrying native 5' UTRs.
  experiment_type: in vitro biochemistry
- description: >-
    Determine the stoichiometry of endogenous NBDY relative to EDC4 and DCP2 by
    quantitative proteomics, and test whether phospho-mutants (T40A, S61A) change EDC4
    self-association in cells.
  experiment_type: quantitative proteomics / co-immunoprecipitation
