gene_symbol: NBDY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  NBDY (NoBody, non-annotated P-body dissociating polypeptide) is a 68-amino-acid,
  intrinsically disordered microprotein translated from a small open reading frame in the
  LINC01420 transcript, previously annotated as a long non-coding RNA. It is conserved
  among mammals but has no homology to larger proteins or known domains. NBDY binds
  directly to the enhancer of decapping EDC4, through a short motif (residues 22-41, with
  Leu30 and Trp34 essential) that contacts the EDC4 N-terminal WD40 region and, more
  weakly, its C-terminal self-association domain; its C-terminal proline-rich segment
  also binds the EVH1 domain of DCP1A. Through these contacts it associates with the
  cytoplasmic mRNA decapping complex and localizes to processing bodies (P-bodies).
  NBDY acts as a negative regulator of P-body assembly: raising its level disperses
  P-bodies, and its loss increases P-body number. Its phosphorylation at Thr40 during
  mitosis (downstream of CDK activity) and at Ser61 after EGF receptor signalling
  (by protein kinase C) is required for P-body dissolution under those conditions,
  and the unphosphorylated protein can form liquid condensates with RNA in vitro that
  phosphorylation dissolves. NBDY does not change the catalytic activity of the
  decapping complex in vitro, but its loss alters the half-lives of more than 1,400
  transcripts. DCP2 substrates are stabilized or destabilized depending on their
  5' UTRs, which requires the EDC4 interaction; other transcripts change through
  secondary effects on gene expression.
