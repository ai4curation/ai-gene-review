- term:
    id: GO:0000932
    label: P-body
  evidence_type: IDA
  original_reference_id: PMID:27918561
  qualifier: located_in
  review:
    summary: >-
      FLAG-NoBody expressed at low levels co-localizes with the P-body marker EDC4, and
      endogenous NBDY was later shown to co-localize with P-bodies using a specific
      antibody (PMID:33059440).
    action: ACCEPT
    reason: >-
      Direct imaging evidence, confirmed for the endogenous protein. The P-body is where
      NBDY's EDC4 partner and the decapping machinery concentrate, and where NBDY acts.
      This is the most specific appropriate cellular component.
    additional_reference_ids:
    - PMID:33059440
    supported_by:
    - reference_id: PMID:27918561
      supporting_text: Indeed, lentiviral transfection of FLAG-NoBody with low viral titers
        resulted in a population of cells (~10% of total) where NoBody co-localized with
        the P-body marker EDC4 (Fig. 4a).
    - reference_id: PMID:33059440
      supporting_text: Endogenous NBDY co-purifies with components of the RNA decapping
        complex (Figure 1b) and colocalizes with P-bodies (Figure 2a and Figure S1a), as
        previously reported for epitope-tagged NBDY3.
