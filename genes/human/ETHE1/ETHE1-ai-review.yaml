id: O95571
gene_symbol: ETHE1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ETHE1 is a mitochondrial matrix persulfide dioxygenase that uses molecular oxygen to convert
  glutathione persulfide to sulfite and glutathione. Its characterized human catalytic site contains one
  iron ion per protomer within a metallo-beta-lactamase fold. The reaction removes sulfane sulfur from
  a glutathione conjugate and supplies the persulfide-oxidation step of mitochondrial sulfide catabolism.
