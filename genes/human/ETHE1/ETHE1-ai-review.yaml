core_functions:
- description: Catalyzes oxygen-dependent oxidation of glutathione persulfide to sulfite and glutathione
    in the mitochondrial matrix. The mononuclear iron center supports this reaction, which directly turns
    over a glutathione conjugate and executes the persulfide-oxidation step of sulfide catabolism.
  molecular_function:
