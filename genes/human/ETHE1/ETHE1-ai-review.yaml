  review:
    summary: ETHE1 directly performs a glutathione-persulfide metabolic reaction.
    action: ACCEPT
    reason: 'The actual glutathione-metabolism IBD is at root PTN002454072 on the human target path, grounded
      by experimental O95571 evidence; human self-WITH is expected. PMID:23144459 Experimental Procedures
      and Results directly test recombinant human Δ11 ETHE1 with a C-terminal His6 tag: GSSH-dependent
