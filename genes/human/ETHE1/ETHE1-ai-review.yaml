suggested_questions:
- question: Does endogenous human ETHE1 retain one iron ion per protomer across physiological metal and
    redox conditions, and what evidence underlies the two-zinc composition currently modeled in Reactome?
- question: Which shorter human RefSeq products are expressed, imported and processed in vivo, and do
    any retain glutathione-persulfide dioxygenase activity?
- question: Is the antibody-dependent nuclear signal attributable to ETHE1, and if so which product and
    cellular conditions produce it?
suggested_experiments:
- hypothesis: The active endogenous mitochondrial enzyme predominantly contains a single iron cofactor;
    any alternative metal occupancy is condition dependent.
  description: Isolate endogenous ETHE1 from human mitochondrial matrix under metal-controlled conditions,
    quantify metal occupancy by elemental analysis, and pair those measurements with GSSH-dependent oxygen
    consumption and sulfite HPLC assays. Compare with defined iron- and zinc-reconstituted recombinant
    controls while checking protein integrity, metal contamination and enzyme-free reactions.
  experiment_type: Metal analysis with matched enzyme kinetics and product detection
- hypothesis: Natural internal-deletion products differ from engineered N-terminal deletions in abundance,
    mitochondrial import or catalytic competence.
  description: Use transcript-junction and product-specific peptide measurements to establish which RefSeq
    products are expressed. Test detected products at matched abundance for mitochondrial import, protease
    protection, N-terminal processing and GSSH turnover, with the canonical precursor and the published
    engineered preparations as distinct controls.
  experiment_type: Product-resolved proteomics, import assays and enzymology
- hypothesis: The HPA029029 nuclear signal reflects either a conditional ETHE1 pool or antibody-dependent
    cross-reactivity rather than a uniformly nuclear protein.
  description: Compare HPA029029 and independent ETHE1 reagents in matched wild-type, ETHE1-knockout and
    endogenous-tagged human cells using a nuclear counterstain. Confirm any nuclear signal with purified
    nuclear fractions, mitochondrial-contamination markers and product-informative peptide detection before
    testing a nuclear mechanism.
  experiment_type: Genetic specificity controls, microscopy and subcellular proteomics
