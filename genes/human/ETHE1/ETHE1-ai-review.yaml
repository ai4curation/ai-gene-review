      with GSSH and minus-substrate controls; its structure contains one iron per protomer, while substrate
      docking is a model, not a bound-substrate structure. Oxidation of a glutathione conjugate and regeneration
      of glutathione constitute chemical participation in this process, not merely a secondary change
      in antioxidant levels. This does not assert glutathione synthesis, glutathione reductase activity,
      or equivalent function of all alternative products.'
