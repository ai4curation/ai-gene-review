id: Q16611
gene_symbol: BAK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'BAK1 encodes a pro-apoptotic multidomain BCL2-family effector that is constitutively anchored
  in the mitochondrial outer membrane through a C-terminal transmembrane helix. In response to direct
  activator BH3-only proteins such as BID, or to release from anti-apoptotic guardians such as MCL1 and
  BCL-XL, BAK changes conformation, dimerizes, and builds higher-order BAK pores that permeabilize the
  outer membrane, release cytochrome c and other intermembrane-space proteins, and drive intrinsic apoptotic
  signaling. BAK also has secondary stress-linked roles at the endoplasmic reticulum in calcium and unfolded-protein-response
  signaling.'
