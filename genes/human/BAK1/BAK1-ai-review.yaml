proposed_new_terms: []
suggested_questions:
- question: Should GO add a BAK/BAX-specific molecular function term for BH3-triggered mitochondrial
    outer-membrane permeabilizing pore assembly, instead of using the broader channel or porin 
    activity terms?
- question: Should legacy BAK annotations to mitochondrial permeability-transition-pore terms be 
    systematically retired in favor of BAK complex and mitochondrial outer membrane permeabilization
    terms?
suggested_experiments:
- description: For peripheral BAK contexts such as ER calcium control, UPR signaling, and chaperone 
    binding, reconstitute BAK-defined cells and measure BAK conformational activation, BAK 
    oligomerization, MOMP, cytochrome-c release, and the proposed non-mitochondrial readout in 
    parallel.
