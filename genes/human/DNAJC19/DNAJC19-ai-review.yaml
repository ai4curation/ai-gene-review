id: Q96DA6
gene_symbol: DNAJC19
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DNAJC19 is a small mitochondrial inner-membrane J-domain co-chaperone. It stimulates the
  ATPase activity of mitochondrial HSP70/Mortalin and forms a regulatory heterodimer with PAM16/Magmas,
  which attenuates that stimulation. Its association with the TIM23 translocon and conserved PAM machinery
  links this activity to protein import into the mitochondrial matrix. DNAJC19 also associates with prohibitin-containing
  membrane assemblies and contributes to regulation of cardiolipin remodeling. Biallelic loss-of-function
  variants cause dilated cardiomyopathy with ataxia syndrome. An annotated shorter splice product lacks
  the N-terminal membrane anchor; its localization and functional relationship to the full-length product
  remain unresolved.
alternative_products:
- name: '1'
  id: Q96DA6-1
  description: Canonical 116-residue product, with a predicted membrane helix at residues 4–24 and a J
    domain at residues 62–116. Human biochemical experiments use soluble engineered constructs as well
    as endogenous mitochondrial association assays; they do not provide a natural-isoform comparison.
- name: '2'
  id: Q96DA6-2
  sequence_note: 'VSP_047119: canonical residues 1–25 are absent.'
  description: Annotated 91-residue splice product, exactly canonical residues 26–116. It lacks the predicted
    membrane anchor but retains the J-domain sequence. It is not identical to the engineered 24–116 soluble
    construct in PMID:19564938 or the predicted 47-residue exon-4-skipping product described in PMID:16055927.
    Sequence retention alone establishes neither normal targeting nor inactivity.
