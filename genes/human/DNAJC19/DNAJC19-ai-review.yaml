- id: PMID:19564938
  title: 'The mitochondrial protein translocation motor: structural conservation between the human and
    yeast Tim14/Pam18-Tim16/Pam16 co-chaperones.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full original read: purified human soluble DNAJC19/PAM16 heterodimer biophysics and
      cross-linking. Its ATPase experiment uses yeast mtHsp70/yeast Pam18 with human Magmas, not direct
      human DNAJC19 activation. The engineered 24–116 construct is not natural isoform 2 (26–116).'
  findings:
  - statement: Purified soluble human DNAJC19 and PAM16 form a heterodimer with measured biophysical stability.
      The ATPase experiment uses yeast Pam18 and yeast mitochondrial Hsp70 with human Magmas; it does
      not directly assay human DNAJC19 activation.
    reference_section_type: RESULTS
- id: PMID:20053669
  title: Role of Magmas in protein transport and human mitochondria biogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full original read: direct human DNAJC19/Mortalin ATPase stimulation, attenuation by
      Magmas, reciprocal human mitochondrial co-IP and anti-Tim17 translocon co-IP. Import kinetics and
      precursor accumulation concern Magmas mutants in yeast. Purified fragments were refolded; no native-isoform
      comparison is established.'
  findings:
  - statement: Human DNAJC19 stimulates Mortalin (mtHSP70) ATPase activity, which is inhibited by the
      Magmas:DnaJC19 complex; DNAJC19 co-precipitates with the human TIM23 translocon (hTim44, hTim23,
      Magmas).
    reference_section_type: RESULTS
