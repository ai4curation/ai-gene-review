- id: file:human/DNAJC19/DNAJC19-evidence-guide.md
  title: DNAJC19 source and evidence guide
  findings: []
core_functions:
- description: Stimulates the ATPase cycle of mitochondrial HSP70/Mortalin as the J-domain co-chaperone
    of the PAM import motor. PAM16/Magmas binds DNAJC19 and attenuates that stimulation. Direct human
    biochemical activity and translocon association support one integrated import-associated function,
    combined with the conserved role in matrix protein import; yeast Magmas import-kinetics experiments
    are not represented as human DNAJC19 perturbation assays.
  molecular_function:
    id: GO:0001671
    label: ATPase activator activity
  directly_involved_in:
  - id: GO:0030150
    label: protein import into mitochondrial matrix
  locations:
  - id: GO:0099617
    label: matrix side of mitochondrial inner membrane
  in_complex:
    id: GO:0001405
    label: PAM complex, Tim23 associated import motor
  supported_by:
  - reference_id: PMID:19564938
  - reference_id: PMID:20053669
    supporting_text: human Pam18 ortholog DnaJC19 and subjected to ATPase stimulation analysis under single turnover conditions.
  - reference_id: GO_REF:0000033
  knowledge_gaps:
  - gap_statement: How are the PAM-associated and prohibitin-associated DNAJC19 pools coordinated in human
      mitochondria?
    gap_kind:
    - BIOLOGY
    boundary: Direct human ATPase activation and translocon association establish the import-associated
      unit. Curated donor evidence and the cardiolipin primary abstract support another biological context,
      but its detailed molecular substrate and dependence on co-chaperone activity were not established
      from accessible originals here.
    resolution: Compare endogenous DNAJC19 perturbation and rescue with independent protein-import and
      cardiolipin-remodeling readouts, while controlling abundance, membrane localization and PAM16/prohibitin
      association.
proposed_new_terms: []
suggested_questions:
- question: Does the natural 91-residue Q96DA6-2 product enter mitochondria or act in another compartment,
    and does it retain PAM16 binding or Mortalin activation in cells?
suggested_experiments:
- description: Reconstitute the human import motor in vitro with purified DNAJC19, PAM16, mtHSP70 and
    GRPEL to measure DNAJC19-dependent ATPase stimulation and precursor translocation, including disease-variant
    proteins.
- description: Conditional DNAJC19 depletion in cardiomyocytes followed by mitochondrial import assays
    and cardiolipin profiling to dissect import-motor versus cardiolipin-remodeling contributions to the
    DCMA phenotype.
- description: Cryo-EM of the human TIM23-PAM holo-translocase to define how the DNAJC19 J-domain engages
    mtHSP70 at the matrix exit of the channel.
