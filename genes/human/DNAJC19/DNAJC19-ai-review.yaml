    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:19564938
  qualifier: enables
  review:
    summary: Retain the verified DNAJC19–PAM16 regulatory association.
    action: KEEP_AS_NON_CORE
    reason: Purified soluble human DNAJC19 and PAM16/Magmas form a heterodimer, supported by recombinant
      purification and cross-linking in Results 2.1–2.2. The literal partner is Q9Y3D7 (official PAM16;
      also TIMM16/Magmas), traced from the genuine source. This pair is distinct from DNAJC19 activation
      of Mortalin/HSPA9, so the ATPase-activator term is not substituted for it. PAM16 inhibits co-chaperone
      stimulation and is not established here as an unfolded-substrate-binding chaperone or an ATPase.
      No more informative partner-class molecular function is asserted. The explicit ClinGen project instruction
      retains this positive generic binding as non-core.
