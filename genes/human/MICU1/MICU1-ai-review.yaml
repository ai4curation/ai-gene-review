    summary: MICU1 participates in Ca2+ transport across the inner mitochondrial membrane as the regulatory
      subunit of the uniporter.
    action: ACCEPT
    reason: Core biological process. MICU1 does not itself conduct Ca2+ - MCU is the pore - but it is
      a constitutive part of the transporting complex and sets the conditions under which transport
      occurs, so involved_in is the right relation.
