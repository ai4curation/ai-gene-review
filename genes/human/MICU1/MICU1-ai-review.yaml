- term:
    id: GO:0072732
    label: cellular response to calcium ion starvation
  evidence_type: IDA
  original_reference_id: PMID:32494073
  qualifier: involved_in
  review:
    summary: Cellular response to calcium ion starvation, assigned from the same holocomplex structural
      study.
    action: MARK_AS_OVER_ANNOTATED
    reason: This appears to read the Ca2+-free ("inhibited") state of the purified uniporter holocomplex
      as a cellular response to calcium starvation. A conformational state adopted by a purified complex
      in a low-Ca2+ buffer is not a cellular response to calcium ion starvation, which implies a deprivation
      stimulus and a coordinated cellular reaction. The underlying structural observation is sound and
      is already captured by calcium ion sensor activity and calcium channel inhibitor activity; only
      the process term over-reaches.
    supported_by:
    - reference_id: PMID:32494073
      supporting_text: Here we report cryo-electron microscopic structures of the human mitochondrial
        calcium uniporter holocomplex in inhibited and Ca2+-activated states.
