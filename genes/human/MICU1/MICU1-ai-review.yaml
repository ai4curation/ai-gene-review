    summary: Legacy annotation from the 1998 paper that first cloned this cDNA, as one of four IgE autoantigens
      recovered from an expression library screened with serum from atopic dermatitis patients.
    action: REMOVE
    reason: Being bound by autoreactive IgE is a property of the patients' immune systems, not a function
      of the protein. The paper assays IgE reactivity and skin-test responses; it does not assay any
      defense response carried out by MICU1, and nothing in the subsequent 25 years of MICU1 literature
      supports an immune function. This is a name-level artefact of the gene's original designation
      as calcium-binding atopy-related autoantigen 1 (CBARA1). Removing a TAS, not an experimental annotation.
