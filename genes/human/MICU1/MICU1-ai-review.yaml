- term:
    id: GO:0019855
    label: calcium channel inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:32494073
  qualifier: enables
  review:
    summary: MICU1 inhibits Ca2+ flux through MCU when its EF-hands are unoccupied, physically occluding
      the pore.
    action: ACCEPT
    reason: 'Core molecular function. This term sits at the centre of a genuine, still-live dispute
      that GOA already carries on both sides: structural and biochemical work says MICU1 blocks the
      pore, while mitoplast patch-clamp work argued it instead potentiates MCU allosterically. Two independent
      2023 studies addressed the clash directly and support occlusion - purified MICU1 suppresses MCU
      currents in patch-clamp in a K126-dependent manner, and MICU1 restricts cation flux through the
      mtCU in divalent-free conditions. The second of these also reports that some mtCU in cells appear
      to lack MICU1-dependent gating, so the inhibition is not absolute. Accepted as core, with the
      caveat recorded. The 2026 metabolon paper (PMID:42129466) proposes that the physiologically dominant
      role of MICU proteins is MCU-independent scaffolding of a Ca2+-sensitive GPD2/SDH metabolon. That
      claim does not retract the gatekeeper function - the same paper states that MICU1 is the primary
      regulator of mtCU-mediated uptake - and it is a single-laboratory result with no independent replication
      and no published rebuttal, so it is recorded rather than acted on here.'
    supported_by:
    - reference_id: PMID:32494073
      supporting_text: These structures define the architecture of this multicomponent Ca2+-uptake machinery
        and reveal the gating mechanism by which MICUs control uniporter activity.
