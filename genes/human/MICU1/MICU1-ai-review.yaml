id: Q9BPX6
gene_symbol: MICU1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'EF-hand calcium-binding protein of the mitochondrial intermembrane space and the principal
  regulatory subunit of the mitochondrial calcium uniporter. MICU1 sits on the intermembrane-space face
  of the inner membrane, peripherally associated with the MCU/EMRE pore, and forms disulfide-linked
  heterodimers with MICU2 or MICU3 (and, in skeletal muscle and kidney, MICU1-MICU1 homodimers). Binding
  of Ca2+ to the EF-hands of the dimer, with high affinity and strong cooperativity, switches the uniporter
  between a closed and an open state: below the threshold MICU1 occludes the pore and prevents constitutive
  Ca2+ leak into the matrix, and above it MICU1 stimulates flux, so that mitochondria respond to cytosolic
  Ca2+ transients rather than to resting Ca2+. Loss of MICU1 causes constitutive matrix Ca2+ loading,
  excess reactive oxygen species and sensitisation to apoptotic stress, and in humans causes a myopathy
  with learning difficulties and extrapyramidal signs. Whether the low-Ca2+ state reflects physical
  pore occlusion or allosteric potentiation of MCU was disputed, with recent patch-clamp and divalent-free
  flux measurements favouring occlusion. MICU1 also has functions that do not require the uniporter:
  it localises to the inner boundary membrane and cristae junctions, interacts with MIC60 and CHCHD2,
  and is required for MICOS complex assembly and normal cristae architecture, and Micu1-null lethality
  is not rescued by removing MCU or EMRE. A further uniporter-independent role has been proposed, in
  which Ca2+-dependent MICU heterodimers scaffold a metabolon coupling glycerol-3-phosphate dehydrogenase
  to succinate dehydrogenase/complex II; this is a recent single-laboratory claim and is not yet independently
  corroborated.'
