- term:
    id: GO:0046982
    label: protein heterodimerization activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: MICU1 forms disulfide-linked heterodimers with MICU2 and with MICU3; the heterodimer, not
      the monomer, is the Ca2+-sensing gating unit.
    action: ACCEPT
    reason: Core molecular function and unusually well characterised for a dimerisation term - the heterodimer
      has been reconstituted, its cooperative Ca2+ affinity measured, its structure solved by several
      groups, and the intersubunit disulfide shown to protect it from YME1L1 proteolysis. Unlike bare
      protein binding, this term is mechanistically informative and is retained as core.
- term:
    id: GO:0061891
    label: calcium ion sensor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: MICU1 is the Ca2+ sensor of the uniporter, converting intermembrane-space Ca2+ binding
      into a change in channel state.
    action: ACCEPT
    reason: 'Core molecular function, and the most informative single MF term on the gene: it names
      the sensing role rather than just the binding. Supported by reconstitution of cooperative high-affinity
      Ca2+ binding matching the measured threshold for uniporter disinhibition, and by structures of
      the holocomplex in Ca2+-free and Ca2+-bound states. The 2026 metabolon work (PMID:42129466) reinforces
      rather than undermines this term - it argues that MICU1 sensing acts on additional targets beyond
      MCU.'
- term:
    id: GO:1903852
    label: positive regulation of cristae formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: MICU1 is required for MICOS complex formation and normal cristae architecture, and does
      this independently of the uniporter.
    action: ACCEPT
    reason: 'Accepted as a genuine second function. Two independent groups converge: MICU1 stabilises
      cristae junctions from the inner boundary membrane, and MICU1 interacts with MIC60 and CHCHD2
      and is essential for MICOS assembly with the authors stating explicitly that this is independent
      of matrix Ca2+ uptake. This is the best-established MCU-independent role of MICU1 and it long
      predates the 2026 metabolon proposal.'
