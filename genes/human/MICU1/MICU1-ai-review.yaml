    review_notes: PubMed-verified (Nat Metab 2026;8:1106-1123, PMC13310417, doi 10.1038/s42255-026-01513-z).
      The contested claim of this review. Correctly cited and methodologically substantial, but it is
      a single-laboratory study with no independent replication - a PubMed search for 'MICU metabolon'
      returns only this paper and its own Research Square preprint (PMID:40678212) - and no published
