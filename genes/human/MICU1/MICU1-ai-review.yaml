core_functions:
- description: MICU1 is the calcium sensor of the mitochondrial calcium uniporter. Its two EF-hands
    face the intermembrane space and bind Ca2+ with high affinity and, in the MICU1-MICU2 heterodimer,
    strong cooperativity, with the transition matching the measured threshold for uniporter disinhibition.
    Ca2+ binding is transduced into a conformational change of the holocomplex that switches MCU between
    a blocked and a conducting state, so that matrix Ca2+ tracks cytosolic Ca2+ transients rather than
    resting Ca2+.
  molecular_function:
    id: GO:0061891
    label: calcium ion sensor activity
  directly_involved_in:
  - id: GO:0036444
    label: calcium import into the mitochondrion
  - id: GO:0051560
    label: mitochondrial calcium ion homeostasis
  locations:
  - id: GO:0005758
    label: mitochondrial intermembrane space
  - id: GO:0005743
    label: mitochondrial inner membrane
  in_complex:
    id: GO:1990246
    label: uniplex complex
  supported_by:
  - reference_id: PMID:28615291
    supporting_text: We conclude that cooperative, high-affinity interaction of the MICU1-MICU2 complex
      with Ca2+ serves as an on-off switch, leading to a tightly controlled channel, capable of responding
      directly to cytosolic Ca2+ signals.
  - reference_id: PMID:20693986
    supporting_text: MICU1 is associated with the mitochondrial inner membrane and has two canonical
      EF hands that are essential for its activity, indicating a role in calcium sensing.
  - reference_id: PMID:32494073
    supporting_text: These structures define the architecture of this multicomponent Ca2+-uptake machinery
      and reveal the gating mechanism by which MICUs control uniporter activity.
- description: In the Ca2+-free state MICU1 inhibits the uniporter, preventing Ca2+ flux through MCU
    at resting cytosolic Ca2+ and thereby setting the threshold for mitochondrial Ca2+ uptake. Purified
    MICU1 suppresses MCU currents in a manner abolished by mutating the MCU-interacting residue K126,
    and MICU1 restricts cation flux through the uniporter even under divalent-free conditions. Whether
    this is best described as physical occlusion or as allosteric inhibition has been disputed; current
    direct evidence favours occlusion.
  molecular_function:
    id: GO:0019855
    label: calcium channel inhibitor activity
  directly_involved_in:
  - id: GO:0051560
    label: mitochondrial calcium ion homeostasis
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  in_complex:
    id: GO:1990246
    label: uniplex complex
  supported_by:
  - reference_id: PMID:37036971
    supporting_text: Supporting the MICU1-occlusion mechanism, patch-clamp demonstrates that purified
      MICU1 strongly suppresses MCU Ca2+ currents, and this inhibition is abolished by mutating the
      MCU-interacting K126 residue.
  - reference_id: PMID:37126688
    supporting_text: Thus, MICU1 restricts the cation flux across the mtCU in the absence of Ca2+, but
      even in cells with high endogenous MICU1 expression such as HEK, some mtCU seem to lack MICU1-dependent
      gating.
  - reference_id: PMID:23101630
    supporting_text: MICU1 interacts with the uniporter pore-forming subunit MCU and sets a Ca(2+) threshold
      for Ca(2+)(m) uptake without affecting the kinetic properties of MCU-mediated Ca(2+) uptake.
- description: MICU1 heterodimerises with MICU2 or MICU3 through an intersubunit disulfide; the dimer,
    not the monomer, is the functional gating unit, and its composition tunes the threshold and cooperativity
    of the uniporter. MICU2 is inhibitory and MICU1 stimulatory, so the dimer imposes a sigmoidal response
    of matrix Ca2+ uptake to cytosolic Ca2+. Dimer formation is itself Ca2+-dependent and, unlike gating,
    does not require MCU.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  directly_involved_in:
  - id: GO:0036444
    label: calcium import into the mitochondrion
  locations:
  - id: GO:0005758
    label: mitochondrial intermembrane space
  supported_by:
  - reference_id: PMID:28615291
    supporting_text: We reconstitute the MICU1-MICU2 heterodimer and demonstrate that it binds Ca2+
      cooperatively with high affinity.
  - reference_id: PMID:24560927
    supporting_text: At low [Ca(2+)], the dominant effect of MICU2 largely shuts down MCU activity;
      at higher [Ca(2+)], the stimulatory effect of MICU1 allows the prompt response of mitochondria
      to Ca(2+) signals generated in the cytoplasm.
  - reference_id: PMID:36206740
    supporting_text: Cells employ protein-importation machineries to fine-tune the relative abundance
      of MICU1 homo- and heterodimers and utilize a conserved MICU intersubunit disulfide to protect
      properly assembled dimers from proteolysis by YME1L1.
- description: Independently of its role in the uniporter, MICU1 localises to the inner boundary membrane
    and cristae junctions, interacts with the MICOS components MIC60 and CHCHD2, and is required for
    MICOS complex formation and normal cristae organisation. Loss of MICU1 alters mitochondrial ultrastructure,
    membrane dynamics and cell-death signalling, and Micu1-null lethality is not rescued by deleting
    MCU or EMRE.
  molecular_function:
    id: GO:0061891
    label: calcium ion sensor activity
  directly_involved_in:
  - id: GO:1903852
    label: positive regulation of cristae formation
  locations:
  - id: GO:0044284
    label: mitochondrial crista junction
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:37098122
    supporting_text: We demonstrated that MICU1 was essential for MICOS complex formation and that MICU1
      ablation resulted in altered cristae organization, mitochondrial ultrastructure, mitochondrial
      membrane dynamics, and cell death signaling.
  - reference_id: PMID:37098122
    supporting_text: Together, our results suggest that MICU1 is an intermembrane space Ca2+ sensor
      that modulates mitochondrial membrane dynamics independently of matrix Ca2+ uptake.
  - reference_id: PMID:31427612
    supporting_text: Eventually, our findings unveil an essential function of MICU1 in CJ stabilization
      and provide mechanistic insights of how sophistically MICU1 controls the MCU-Complex while maintaining
      the structural mitochondrial membrane framework.
suggested_questions:
- question: Does the proposed MCU-independent MICU metabolon replicate outside the originating laboratory?
    The claim that Ca2+-dependent MICU heterodimers scaffold a GPD2/SDH metabolon, and that this rather
    than matrix Ca2+ is the primary physiological calcium signal regulating homeostatic energetics,
    currently rests on a single study with no independent confirmation and no published rebuttal.
  experts:
  - Elrod JW
  - Graier WF
- question: If the metabolon role is confirmed, what is the correct GO representation? There is currently
    no term for the GPD2/succinate dehydrogenase metabolon, and no molecular function term capturing
    Ca2+-dependent scaffolding of a dehydrogenase assembly by a non-catalytic subunit.
  experts: []
- question: Is the low-Ca2+ inhibited state physical occlusion of the MCU pore or allosteric inhibition?
    Two 2023 studies support occlusion, but one of them also reports that a fraction of the uniporter
    in cells with high endogenous MICU1 appears to lack MICU1-dependent gating. What accounts for that
    fraction?
  experts:
  - Tsai MF
  - Hajnoczky G
- question: How are MICU1's uniporter-dependent and MICOS/cristae functions related? Is MICOS assembly
    a consequence of MICU1 positioning at the inner boundary membrane, or a separate Ca2+-regulated
    activity, and can the two be separated by mutation?
  experts:
  - Tomar D
  - Gottschalk B
- question: Does the tissue-specific dimer composition - MICU1-MICU1 homodimers in skeletal muscle and
    kidney, near-absence of MICUs from cardiac uniporters - extend to the proposed metabolon, and could
    that explain why MICU1 loss and MCU loss give such different organismal phenotypes?
  experts: []
suggested_experiments:
- hypothesis: MICU heterodimers regulate GPD2/SDH activity independently of MCU.
  description: 'Independent replication of the central metabolon result in a second laboratory and a
    second cell background: measure GPD2+complex III and complex II activities in MICU1, MICU2 and MICU1/MICU2
    null cells, in each case on an Mcu-null and an Smdt1-null background, with Ca2+ clamped in permeabilised
    preparations. The prediction that distinguishes the models is that the MICU effect on dehydrogenase
    activity should survive complete loss of uniporter function.'
- hypothesis: Gating of MCU and scaffolding of the metabolon are separable activities of MICU1.
  description: 'Identify MICU1 separation-of-function alleles: the MCU-interacting residue K126 for
    gating, and MICOS-interface or GPD2-interface mutations for the scaffolding roles. Express each
    at endogenous level in MICU1-null cells and score, in parallel, uniporter threshold by permeabilised-cell
    Ca2+ uptake, MICOS assembly by blue-native PAGE, and GPD2/SDH coupling by the activity assay. Clean
    dissociation would justify separate GO core functions rather than one sensing function with multiple
    targets.'
- hypothesis: MICU1 is required for organismal viability through a function other than uniporter gating.
  description: Rescue Micu1-null mice with EF-hand-dead MICU1, with K126 gating-dead MICU1, and with
    a MICOS-interface mutant, on a wild-type and on an Mcu-null background. Which allele rescues lethality
    identifies which activity is the essential one; this is the cleanest available test of the claim
    that MICU1's primary physiological role is not uniporter gating.
proposed_new_terms:
- proposed_name: calcium-dependent dehydrogenase metabolon assembly
  proposed_definition: 'A molecular function in which a calcium-sensing, non-catalytic protein promotes
    assembly of a supramolecular complex of FADH2-linked dehydrogenases in response to calcium binding,
    thereby modulating their coupled activity. Proposed to capture the reported MICU-dependent coupling
    of mitochondrial glycerol-3-phosphate dehydrogenase (GPD2) to succinate dehydrogenase/complex II.
    Recorded as a candidate only: the underlying claim rests on a single study (PMID:42129466) and should
    not be implemented in the ontology until it is independently replicated.'
  justification: No existing GO term captures calcium-dependent scaffolding of a dehydrogenase metabolon
    by a non-catalytic EF-hand subunit. If the finding replicates, both a molecular function term of
    this kind and a cellular component term for the GPD2/succinate dehydrogenase metabolon itself will
    be needed.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:42129466
    supporting_text: Here we demonstrate that MICU proteins, the reported gatekeepers of mtCU, function
      in coordination to impart calcium-dependent regulation to FADH2-dependent mitochondrial dehydrogenases
      through metabolon formation independently of the mtCU and [Ca2+]m.
  - reference_id: PMID:42129466
    supporting_text: We propose that MICU-mediated mitochondrial metabolons are a fundamental system
      facilitating matching of mitochondrial energy production with cellular demand and is the primary
      physiological calcium signaling mechanism regulating homeostatic energetics, not mtCU-dependent
      changes in [Ca2+]m.
