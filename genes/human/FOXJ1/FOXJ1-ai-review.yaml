id: Q92949
gene_symbol: FOXJ1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FOXJ1 is a nuclear forkhead transcription factor that activates gene expression needed for
  the motile-cilia program. Human FOXJ1 increases ciliary-gene RNA and promoter activity in airway basal
  epithelial cells, and pathogenic human variants are associated with defective respiratory ciliogenesis,
  hydrocephalus and disturbed left/right body asymmetry. Conserved sequence-specific DNA recognition is
  grounded by mouse biochemical experiments and phylogenetic evidence. FOXJ1 also associates with RFX-family
  transcription factors; measured RFX2 interaction and RFX3 enhancement of ciliary transcription are distinct
  observations. Mouse immune-cell studies show contextual restraint of NF-kappaB-linked B-cell responses,
  while their conservation and precise signaling mechanisms in human immune cells remain less defined.
