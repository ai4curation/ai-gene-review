    reason: The exact mouse same-term IMP donor cites PMID:16339515. Its authentic abstract reports CD2-Foxj1
      transgenic lupus-prone mice, peripheral T-cell lymphopenia and accumulation of mature thymocytes
      with impaired exit. GO:0002508 specifically concerns tolerance induction in thymus or bone marrow;
