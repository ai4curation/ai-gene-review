  - ensembl:ENSMUSP00000038351
  review:
    summary: The positive immune-regulatory evidence does not establish the specifically central B-cell
      tolerance mechanism.
    action: MARK_AS_OVER_ANNOTATED
    reason: The current Q61660 same-term IMP donor cites PMID:16002694, whose selected Methods/Results
      concern mature splenic B cells, B-cell-only chimeras, germinal centers and antibody responses. The
      Discussion explicitly distinguishes amplification of existing antigen responses from loss of B-cell
      tolerance itself. GO:0002897 requires positive regulation of central B-cell tolerance, situated
      in the central lymphoid compartment. This specificity exceeds the demonstrated peripheral response
      restraint; retain the positive B-cell activation and humoral-response annotations separately. This
      is a bounded assessment of the transferred process, not denial of the measured immune phenotype.
    supported_by:
    - reference_id: PMID:16002694
