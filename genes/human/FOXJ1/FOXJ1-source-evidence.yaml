      Exact nuclear-localization imaging and construct details were not inspected. Independent nuclear function
      supports the gene-level location, without retroactive source verification.
- id: PMID:17488776
  title: RhoA-mediated apical actin enrichment is required for ciliogenesis and promoted by Foxj1.
  original_goa_reference: false
  reference_review: &id008
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original publisher Results/Methods/Discussion/captions support mouse Foxj1-null mTEC
      apical actin and docking defects plus AdFoxj1-associated RhoA/B activation. The mechanistic route is unresolved;
      no FOXJ1 actin-binding or GEF activity is inferred. Exact adenoviral coding sequence is deferred in the paper
      to an earlier source, so host species does not identify the construct. The repository publication cache remains
      abstract-only, but selected original publisher full-text sections were accessible and read; therefore the
      review does not mark the full text as unavailable. The cached source bytes are unchanged.
