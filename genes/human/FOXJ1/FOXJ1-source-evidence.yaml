      are unresolved. The positive report and matched mouse IMP are retained without an exhaustive negative conclusion.
- id: PMID:16002694
  title: Restraint of B cell activation by Foxj1-mediated antagonism of NF-kappa B and IL-6.
  original_goa_reference: false
  reference_review: &id005
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original publisher PDF Methods/Results/Figures 5–6 captions/Discussion support mouse
      B-cell intrinsic immune-response restraint, I-kappaB-beta/NF-kappaB and IL6 effects. The authors distinguish
      amplification of existing responses from breaking B-cell tolerance. These experiments do not establish central
      B-cell tolerance or the NIK/p100 non-canonical branch, nor human direct immune assays. The repository publication
      cache remains abstract-only, but selected original publisher full-text sections were accessible and read;
      therefore the review does not mark the full text as unavailable. The cached source bytes are unchanged.
- id: PMID:16339515
  title: 'Cutting edge: Foxj1 protects against autoimmunity and inhibits thymocyte egress.'
  original_goa_reference: false
  reference_review: &id006
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: 'Authentic abstract only: CD2-Foxj1 lupus-prone mice, reduced disease and peripheral T cells,
      mature thymocyte retention and impaired exit. Full original Methods/Results were inaccessible. Central tolerance
      and differentiation cannot be equated automatically with egress.'
- id: PMID:17008636
  title: Trefoil factor family 3 peptide promotes human airway epithelial ciliated cell differentiation.
  original_goa_reference: true
  reference_review: &id007
    relevance: MEDIUM
    correctness: UNVERIFIED
