synthesis:
  description: FOXJ1 is a nuclear forkhead transcription factor that activates ciliary genes and promotes motile-cilium
    formation and ciliated epithelial differentiation. In human airway basal epithelial cells, RFX3 enhances FOXJ1-dependent
    ciliary-gene transcription. FOXJ1 can also associate with the RFX2 transcription factor. Pathogenic human variants
    cause a motile ciliopathy with defective respiratory ciliogenesis, hydrocephalus and disturbed left/right body
    asymmetry. In mouse immune cells, Foxj1 restrains NF-kappaB-linked B-cell responses; its corresponding roles
    in human immune cells remain less defined.
  core_functions:
  - description: Activates Pol II transcription of ciliary genes in the nucleus to promote motile-cilium assembly
      and lung ciliated-cell differentiation. Human airway basal-cell gene transfer supports ciliary-gene RNA and
      promoter activation, complemented by impaired ciliogenesis and differentiation in FOXJ1-variant respiratory
      cells. These endpoints support the ciliogenic transcriptional program; gene transfer alone is not claimed
      to complete mature multiciliated differentiation.
    molecular_function:
      id: GO:0001228
      label: DNA-binding transcription activator activity, RNA polymerase II-specific
    directly_involved_in:
    - id: GO:0045944
      label: positive regulation of transcription by RNA polymerase II
    - id: GO:0044458
      label: motile cilium assembly
    - id: GO:1901248
      label: positive regulation of lung ciliated cell differentiation
    locations:
    - id: GO:0005634
      label: nucleus
    supported_by:
    - reference_id: PMID:23822649
    - reference_id: PMID:9096351
    - reference_id: PMID:31630787
  suggested_questions:
  - question: Which endogenous human FOXJ1 targets are sufficient to connect transcriptional activation to basal-body
      docking and mature motile-cilium formation?
  - question: Do RFX2 binding and RFX3-associated enhancement recruit distinct FOXJ1 regulatory complexes in human
      airway cells?
  - question: Does endogenous human FOXJ1 regulate B-cell activation, and can that role be separated from central
      tolerance and canonical versus non-canonical NF-kappaB signaling?
  - question: Does FOXJ1 make a causal contribution to choroid-plexus epithelial maturation, beyond its developmental
      expression and the effects of motile-cilia dysfunction elsewhere?
  suggested_experiments:
  - description: Combine inducible endogenous FOXJ1 depletion and wild-type rescue in differentiating primary human
      airway cultures with nascent-RNA profiling, occupancy mapping and stage-resolved basal-body/cilia imaging.
      Separate early target-gene changes from later docking and transport phenotypes.
  - description: Compare matched RFX2 and RFX3 perturbations in the same airway differentiation system, using endogenous
      reciprocal association assays and promoter/target-RNA measurements. Purified pair assays can distinguish direct
      interfaces from cellular complex recovery.
  - description: First establish endogenous FOXJ1 expression in defined human B-cell stages, then use controlled
      perturbation to measure activation, antigen responses and branch-specific NF-kappaB endpoints. NIK/p100/p52
      and RELA/I-kappaB readouts should be analyzed separately; mature-cell effects should not be labeled central
      tolerance.
  - description: Use stage-specific FOXJ1 perturbation in a validated choroid-plexus epithelial model, with epithelial
      maturation and barrier/secretory endpoints, rather than inferring development from expression alone.
  no_new_annotations: true
  no_quotes: true
  natural_product_scope: The current official EBI reviewed record contains a 421-aa sequence and no alternative-product/VAR_SEQ
    records; do not invent natural-product assignments from historical fragments.
