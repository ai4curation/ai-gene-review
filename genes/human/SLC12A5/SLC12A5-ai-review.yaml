      transmembrane pore/channel; KCC2 is a secondary-active electroneutral symporter, not
      a channel. Any ammonium movement occurs by NH4+ substituting for K+ in the coupled
      cotransport cycle, which is better captured by GO:0072488 ammonium transmembrane
      transport.
