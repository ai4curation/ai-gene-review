core_functions:
- description: Electroneutral potassium-chloride (K+:Cl-) cotransport across the neuronal
    plasma membrane, extruding intracellular chloride to establish and maintain the low
    neuronal [Cl-] that sets the hyperpolarizing (inhibitory) Cl- gradient for GABA-A and
    glycine receptor signaling.
  supported_by:
  - reference_id: file:human/SLC12A5/SLC12A5-uniprot.txt
    supporting_text: "Reaction=K(+)(in) + chloride(in) = K(+)(out) + chloride(out);"
    record_section: ["CC:CATALYTIC ACTIVITY"]
  - reference_id: PMID:12106695
    supporting_text: Expression of hKCC2 cRNA in Xenopus laevis oocytes results in
      significant Cl(-)-dependent (86)Rb(+) uptake under isotonic conditions
  - reference_id: PMID:26333769
    supporting_text: with impaired KCC2-mediated chloride extrusion
