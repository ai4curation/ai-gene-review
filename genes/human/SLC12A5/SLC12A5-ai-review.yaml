suggested_questions:
- question: Does human KCC2's transport-independent structural role in dendritic spine
    morphogenesis warrant a distinct core molecular-function term, and what domain/mechanism
    (e.g. C-terminal cytoskeletal scaffolding) mediates it?
- question: What is the physiological relevance, if any, of KCC2-mediated NH4+ (ammonium)
    cotransport in neurons, as distinct from the K+/Cl- transport that defines the protein?
suggested_experiments:
- description: Use transport-dead but structurally intact KCC2 mutants (separating ion
    transport from the C-terminal structural role) in neuronal cultures and knock-in models
    to dissect the contributions of chloride extrusion versus dendritic spine scaffolding to
    inhibitory synapse maturation and epileptogenesis.
