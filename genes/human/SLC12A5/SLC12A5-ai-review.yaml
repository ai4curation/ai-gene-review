    summary: NH4+ can substitute for K+ in K-Cl cotransport, but KCC2 is not an ammonium
      channel.
    action: MARK_AS_OVER_ANNOTATED
    reason: Mechanistically incorrect molecular-function characterization. GO:0008519 is
