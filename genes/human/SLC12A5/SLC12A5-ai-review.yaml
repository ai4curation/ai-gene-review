id: Q9H2X9
gene_symbol: SLC12A5
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC12A5 encodes KCC2 (K-Cl cotransporter 2), a neuron-specific, electroneutral
  potassium-chloride cotransporter of the SLC12 cation-chloride cotransporter family.
  As a multi-pass plasma-membrane protein it couples the outward movement of K+ and
  Cl- down the K+ gradient, acting as the major extruder of intracellular chloride in
  mature central neurons. By keeping intraneuronal [Cl-] low, KCC2 sets the equilibrium potential for chloride that makes GABA-A and glycine receptor activation
  hyperpolarizing (inhibitory); its developmental upregulation underlies the
  excitatory-to-inhibitory switch of GABAergic signaling. KCC2 is concentrated on the
  somatodendritic plasma membrane, including dendritic spines and the vicinity of
  inhibitory and excitatory synapses, and is essentially absent from axons. Beyond ion
  transport it has a documented transport-independent structural role in the
  morphogenesis and maturation of dendritic spines, mediated by its large C-terminal
  cytoplasmic domain. Transport activity is suppressed by WNK-SPAK/OSR1 phosphorylation
  and is activated by cell swelling. Loss-of-function and hypomorphic variants cause
  developmental and epileptic encephalopathy (DEE34 / epilepsy of infancy with
  migrating focal seizures) and confer susceptibility to idiopathic generalized
  epilepsy (EIG14).
