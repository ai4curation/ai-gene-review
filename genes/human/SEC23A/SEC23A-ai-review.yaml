- term:
    id: GO:0090110
    label: COPII-coated vesicle cargo loading
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000124617
  - SGD:S000006385
  - UniProtKB:Q15436
  review:
    summary: >-
      The Sec23/24 inner coat complex loads cargo into COPII-coated vesicles.
    action: ACCEPT
    reason: >-
      The cargo-loading term is a core SEC23A process. Sec23A acts with SEC24 in the COPII inner coat,
      and human Sec23/24 structures and packaging assays show how this complex recognizes SEC22 and
      other
      ER-export signals in cargo proteins.
    supported_by:
    - reference_id: PMID:17499046
      supporting_text: The 200 kDa crystal structure of Sec22 bound to Sec23/24 reveals that the
        transport signal is a folded epitope rather than a conventional short peptide sequence.
    - reference_id: PMID:18843296
      supporting_text: we combined X-ray crystallographic and biochemical analysis with functional
        assays of cargo packaging into COPII vesicles to establish molecular mechanisms for cargo
        discrimination by human Sec24 subunits.
