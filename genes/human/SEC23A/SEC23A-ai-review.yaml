- term:
    id: GO:0030127
    label: COPII vesicle coat
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - FB:FBgn0262125
  - PANTHER:PTN000124617
  - SGD:S000006385
  - UniProtKB:Q15436
  - UniProtKB:Q38AJ0
  - UniProtKB:Q580Y6
  review:
    summary: >-
      SEC23A is a Sec23/24 inner subunit of the COPII vesicle coat.
    action: ACCEPT
    reason: >-
      The COPII vesicle coat is the defining complex for SEC23A. The IBA node is supported by conserved
      COPII coat biology, and the human IDA/InterPro rows agree with direct Sec23/24 structural work
      showing
      SEC23A in the coat subcomplex that binds cargo signals.
    supported_by:
    - reference_id: PMID:17499046
      supporting_text: The 200 kDa crystal structure of Sec22 bound to Sec23/24 reveals that the
        transport signal is a folded epitope rather than a conventional short peptide sequence.
    - reference_id: PMID:27551091
      supporting_text: Membrane-bound Sar1-GTP recruits Sec23/24 to form the inner coat complex
        that, in turn, recruits the Sec13/31 outer coat protein
