core_functions:
- description: 'Inner-coat subunit of COPII: as a SEC23-SEC24 heterodimer recruited by SAR1-GTP at ER exit sites it captures
    cargo and recruits the SEC13-SEC31 outer coat, driving cargo loading and budding of COPII carriers for ER-to-Golgi transport.
    Experimentally established in human (localisation, yeast complementation, cell-free budding, structures).'
  molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  directly_involved_in:
  - id: GO:0090110
    label: COPII-coated vesicle cargo loading
  - id: GO:0090114
    label: COPII-coated vesicle budding
  - id: GO:0006888
    label: endoplasmic reticulum to Golgi vesicle-mediated transport
  locations:
  - id: GO:0070971
    label: endoplasmic reticulum exit site
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  in_complex:
    id: GO:0030127
    label: COPII vesicle coat
  supported_by:
  - reference_id: PMID:8898360
    supporting_text: hSec23Ap is a functional homologue of the yeast Sec23p as the hSec23A isoform complemented the temperature
      sensitivity of the Saccharomyces cerevisiae sec23-1 mutation at a restrictive temperature of 34 degrees C.
  - reference_id: PMID:16980979
    supporting_text: Cell-free vesicle budding assays show that the F382L substitution results in loss of SEC23A function.
  - reference_id: PMID:17981132
    supporting_text: In vitro assays reveal that the mutant form of SEC23A poorly recruits the Sec13-Sec31 complex, inhibiting
      vesicle formation.
  - reference_id: PMID:36594468
    supporting_text: SEC23 also functions as the GTPase-activating protein for SAR1 and stimulates SAR1 GTP hydrolysis.
  - reference_id: PMID:32358066
    supporting_text: We found that the latter cluster confers to SAR1B a binding preference for SEC23A that is stronger than
      that of SAR1A for SEC23A.
- description: PPP-motif recognition by the C-terminal gelsolin-like domain, binding the proline-rich domains of the procollagen
    export receptor TANGO1 (MIA3) and cTAGE5 (MIA2), and PPP motifs of SEC31A; proposed to template accretion of inner coat
    for large-cargo carriers. Established in human by crystallography and mutagenesis.
  molecular_function:
    id: GO:0070064
    label: proline-rich region binding
  directly_involved_in:
  - id: GO:0090110
    label: COPII-coated vesicle cargo loading
  locations:
  - id: GO:0070971
    label: endoplasmic reticulum exit site
  supported_by:
  - reference_id: PMID:27551091
    supporting_text: The affinity for Sec23 is concentrated in the proline-rich domains (PRDs) of TANGO1 and cTAGE5, but Sec23
      recognizes merely a PPP motif.
  - reference_id: PMID:27551091
    supporting_text: difference electron density reveals just a three-residue peptide element bound to a site on the gelsolin-like
      domain of Sec23a
suggested_questions:
- question: Has SAR1 GAP stimulation been measured directly for human SEC23A (versus SEC23B) with SAR1A and SAR1B, and do
    the paralogs differ in GAP potency, given that the human GAP annotation currently rests on PAINT transfer from yeast Sec23?
- question: Which cargo-recognition events attributed to Sec23/24 (SEC22B, MHC-I C-terminal signal) depend on residues of
    SEC23A rather than SEC24 at the heterodimer interface?
suggested_experiments:
- description: Reconstituted SAR1 GTP hydrolysis assays (tryptophan fluorescence or radiolabelled GTP) comparing purified
    SEC23A-SEC24 and SEC23B-SEC24 with SAR1A and SAR1B, including the CLSD F382L variant and an arginine-finger mutant.
