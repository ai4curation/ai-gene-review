- term:
    id: GO:0070971
    label: endoplasmic reticulum exit site
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - AGI_LocusCode:AT4G01810
  - FB:FBgn0262125
  - PANTHER:PTN000124617
  - UniProtKB:Q15436
  - UniProtKB:Q38AJ0
  - WB:WBGene00004754
  review:
    summary: >-
      SEC23A is recruited to endoplasmic-reticulum exit sites.
    action: ACCEPT
    reason: >-
      ER exit sites are the active COPII assembly sites for SEC23A: Paccaud et al. localized hSec23Ap
      to the transitional ER, TANGO1 can recruit COPII components to organized ER exit sites, and the
      PAINT IBA matches the conserved Sec23 ERES placement.
    supported_by:
    - reference_id: PMID:8898360
      supporting_text: hSec23Ap was found essentially in the ribosome-free transitional face of
        the endoplasmic reticulum (ER) and associated vesicles.
    - reference_id: PMID:28442536
      supporting_text: ectopically expressed TANGO1 C-terminal domain responsible for Sec16
        binding in mitochondria is capable of recruiting Sec16 and other COPII components.
