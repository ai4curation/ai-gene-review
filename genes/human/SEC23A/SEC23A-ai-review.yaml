- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: >-
      The broad endoplasmic-reticulum localization is true for SEC23A.
    action: ACCEPT
    reason: >-
      Although ER exit site and ER membrane are the more informative COPII locations, human SEC23A was
      directly localized to the transitional face of the ER and associated vesicles, so this broader
      HPA
      endoplasmic-reticulum call is retained.
    supported_by:
    - reference_id: PMID:8898360
      supporting_text: hSec23Ap was found essentially in the ribosome-free transitional face of
        the endoplasmic reticulum (ER) and associated vesicles.
    - reference_id: file:human/SEC23A/SEC23A-notes.md
      supporting_text: SEC23A's supported COPII localizations are the cytosol, the cytoplasmic
        face of the endoplasmic reticulum membrane, endoplasmic reticulum exit sites, the COPII
        vesicle coat, and the ER-to-Golgi transport vesicle membrane.
- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: EXP
  original_reference_id: PMID:8898360
  qualifier: located_in
  review:
    summary: >-
      SEC23A is recruited from the cytosol to the cytoplasmic face of ER exit membranes as part of inner
      COPII coat assembly.
    action: ACCEPT
    reason: >-
      The ER membrane is a genuine SEC23A COPII location: SAR1:GTP recruits cytoplasmic Sec23/24 to
      ERES/ER
      membrane, where the inner coat captures cargo and seeds the COPII bud. Repeated Reactome TAS rows
      add pathway context but all restate this same location.
    supported_by:
    - reference_id: file:human/SEC23A/SEC23A-notes.md
      supporting_text: SEC23A's supported COPII localizations are the cytosol, the cytoplasmic
        face of the endoplasmic reticulum membrane, endoplasmic reticulum exit sites, the COPII
        vesicle coat, and the ER-to-Golgi transport vesicle membrane.
    - reference_id: file:human/SEC23A/SEC23A-notes.md
      supporting_text: Reactome TAS rows for cytosol, ER membrane, and ER-to-Golgi transport
        vesicle membrane repeatedly describe the same Sec23/24 inner-coat cycle from cytosolic
        recruitment by SAR1:GTP to ER-exit-site membranes, cargo capture, COPII budding, and later
        coat disassembly.
    - reference_id: Reactome:R-HSA-5694522
      supporting_text: SAR1:GTP recruits the cytoplasmic SEC23:SEC24 complex. SEC24, and to a
        lesser extent SEC23, also mediate interaction with COPII cargo, concentrating it into the
        emerging vesicle.
