- term:
    id: GO:0030134
    label: COPII-coated ER to Golgi transport vesicle
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q01405
  - ensembl:ENSMUSP00000021375
  review:
    summary: >-
      COPII-coated ER-to-Golgi transport vesicle is directionally right but less precise than the coat
      and vesicle-membrane locations.
    action: MODIFY
    reason: >-
      SEC23A is not a soluble lumenal cargo of the whole COPII vesicle; it is a peripheral inner-coat
      component on the cytosolic face of the vesicle membrane. Replace the whole-vesicle term with the
      direct COPII vesicle coat and ER-to-Golgi transport vesicle membrane locations already present
      in
      GOA.
    supported_by:
    - reference_id: file:human/SEC23A/SEC23A-notes.md
      supporting_text: GO:0030134 COPII-coated ER to Golgi transport vesicle is less precise than
        SEC23A's direct structural locations in the COPII vesicle coat and ER-to-Golgi transport
        vesicle membrane.
    - reference_id: file:human/SEC23A/SEC23A-notes.md
      supporting_text: SEC23A's supported COPII localizations are the cytosol, the cytoplasmic
        face of the endoplasmic reticulum membrane, endoplasmic reticulum exit sites, the COPII
        vesicle coat, and the ER-to-Golgi transport vesicle membrane.
    proposed_replacement_terms:
    - id: GO:0030127
      label: COPII vesicle coat
    - id: GO:0012507
      label: ER to Golgi transport vesicle membrane
- term:
    id: GO:0032456
    label: endocytic recycling
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q01405
  - ensembl:ENSMUSP00000021375
  review:
    summary: >-
      The orthology-projected endocytic recycling process is not a direct SEC23A function.
    action: REMOVE
    reason: >-
      SEC23A functions in COPII ER export rather than executing endocytic recycling itself. The seeded
      row is an Ensembl-Compara transfer from rodent Sec23a, likely via GLUT4 trafficking phenotypes,
      and should not be propagated onto human SEC23A as a direct process annotation.
    supported_by:
    - reference_id: file:human/SEC23A/SEC23A-notes.md
      supporting_text: GO:0000139, GO:0032456, and GO:0048471 in the seeded SEC23A review are
        Ensembl-Compara transfers from mouse or rat SEC23A ortholog annotations rather than direct
        human SEC23A assertions; they are removed because they are either downstream of COPII
        budding or too vague for the human Sec23/24 inner COPII coat role.
