id: Q15436
gene_symbol: SEC23A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SEC23A is one of two human paralogs of SEC23, the GTPase-activating subunit of the COPII inner coat. In the cytosol
  it forms a heterodimer with a SEC24 isoform (SEC24A-D); SAR1-GTP on the ER membrane recruits SEC23-SEC24 to ER exit sites,
  where SEC24 (and to a lesser extent SEC23) captures cargo, SEC23 binds SEC13-SEC31 outer-coat PPP motifs through its C-terminal
  gelsolin-like domain, and SEC23 stimulates SAR1 GTP hydrolysis to control coat turnover. Together these drive cargo concentration
  and budding of COPII carriers for ER-to-Golgi transport. The same gelsolin-like domain binds PPP motifs in the proline-rich
  domains of the procollagen export receptor TANGO1 (MIA3) and cTAGE5 (MIA2) at ER exit sites. SEC23A is a zinc-binding protein
  (N-terminal Sec23/Sec24-type zinc finger) of about 85 kDa, ubiquitously expressed, cycling between cytosol, the cytoplasmic
  face of the transitional ER and COPII vesicles. A homozygous F382L substitution impairs SEC13-SEC31 recruitment and causes
  cranio-lenticulo-sutural dysplasia, with ER distension and defective collagen secretion.
