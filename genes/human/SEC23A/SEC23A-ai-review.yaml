- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q01405
  - ensembl:ENSMUSP00000021375
  review:
    summary: Golgi membrane, transferred by orthology from mouse Sec23a.
    action: KEEP_AS_NON_CORE
    reason: SEC23 is shed largely before COPII carriers fuse, but residual SEC23 on tethered carriers engages TRAPP at the
      cis-Golgi/ERGIC (Reactome R-HSA-5694439). A Golgi-membrane location is therefore peripheral to the ER exit site, where
      SEC23A acts; no human data place it in Golgi membranes.
    supported_by:
    - reference_id: Reactome:R-HSA-203973
      supporting_text: SAR1:GTPase activity may result in partial uncoating of the emerging vesicle, allowing SEC23 to be
        exposed for subsequent TRAPPCII binding.
- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000124617
  - SGD:S000001077
  - SGD:S000006385
  review:
    summary: SAR1 GTPase-activating activity, inferred by PAINT from node PTN000124617 with yeast Sec23 experimental donors.
    action: ACCEPT
    reason: Sec23 is the GAP for Sar1 in the COPII coat; the activity was established for yeast Sec23p and placed by PAINT
      at the ancestral SEC23 node, from which human SEC23A (PTHR11141:SF7) descends. Human SEC23A binds SAR1A/SAR1B directly
      (PMID:32358066) and Reactome models Sec23-stimulated Sar1 GTP hydrolysis. In this review the GAP activity of human SEC23A
      specifically rests on this phylogenetic inference plus the conserved SAR1-binding interface; no cached human GAP assay
      was found.
    supported_by:
    - reference_id: PMID:36594468
      supporting_text: SEC23 also functions as the GTPase-activating protein for SAR1 and stimulates SAR1 GTP hydrolysis.
    - reference_id: Reactome:R-HSA-5694527
      supporting_text: Sar1p-GTP hydrolysis is increased 15-30-fold by Sec23p.
    - reference_id: PMID:32358066
      supporting_text: We found that the latter cluster confers to SAR1B a binding preference for SEC23A that is stronger
        than that of SAR1A for SEC23A.
