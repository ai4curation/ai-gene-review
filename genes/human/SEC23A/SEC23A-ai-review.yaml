core_functions:
- molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  description: >-
    SEC23A is the Sec23 subunit of the COPII inner coat. Cytosolic SEC23A pairs with SEC24 to form the
    inner coat complex that is recruited by SAR1-GTP to ER exit sites, where Sec23/24 recognizes membrane-cargo
    export signals, concentrates cargo into prebudding complexes, and nucleates COPII coat assembly.
    SEC23A
    also provides the Sec23-family GAP activity toward SAR1, so SAR1 GTP hydrolysis is coupled to cargo
    proofreading and coat disassembly. The same inner-coat surface is reused by specialized large-cargo
    organizers such as TANGO1/cTAGE5, whose PPP motifs engage the SEC23A gelsolin-like domain to concentrate
    Sec23/24.SAR1 units for collagen-carrier biogenesis.
