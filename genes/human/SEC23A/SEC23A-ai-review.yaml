id: Q15436
gene_symbol: SEC23A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SEC23A is a cytosolic peripheral membrane component of the COPII inner coat that is recruited with
  SEC24
  by SAR1-GTP to endoplasmic-reticulum exit sites. Within the Sec23/24 complex, SEC23A helps organize
  cargo capture at the cytoplasmic face of the ER and supplies the GAP activity that stimulates SAR1
  GTP
  hydrolysis, coupling cargo-loaded prebudding complex assembly, COPII-coated vesicle budding, and coat
  turnover during ER-to-Golgi export.
alternative_products:
- name: '1'
  id: Q15436-1
- name: '2'
  id: Q15436-2
  sequence_note: VSP_056230
existing_annotations:
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q01405
  - ensembl:ENSMUSP00000021375
  review:
    summary: >-
      The orthology-projected Golgi membrane row is not retained for human SEC23A.
    action: REMOVE
    reason: >-
      SEC23A cycles between the cytosol, ER exit sites, the cytoplasmic face of the ER membrane, and
      newly
      forming COPII-coated vesicles. The seeded Golgi membrane annotation is an Ensembl-Compara transfer
      from SEC23A orthologs and would move SEC23A to a downstream compartment rather than the site where
      Sec23/24 acts.
    supported_by:
    - reference_id: file:human/SEC23A/SEC23A-notes.md
      supporting_text: GO:0000139, GO:0032456, and GO:0048471 in the seeded SEC23A review are
        Ensembl-Compara transfers from mouse or rat SEC23A ortholog annotations rather than direct
        human SEC23A assertions; they are removed because they are either downstream of COPII
        budding or too vague for the human Sec23/24 inner COPII coat role.
    - reference_id: file:human/SEC23A/SEC23A-notes.md
      supporting_text: SEC23A's supported COPII localizations are the cytosol, the cytoplasmic
        face of the endoplasmic reticulum membrane, endoplasmic reticulum exit sites, the COPII
        vesicle coat, and the ER-to-Golgi transport vesicle membrane.
- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000124617
  - SGD:S000001077
  - SGD:S000006385
  review:
    summary: >-
      SEC23A provides the Sec23-family GAP activity that stimulates SAR1 GTP hydrolysis during COPII
      coat
      cycling.
    action: ACCEPT
    reason: >-
      The PAINT IBA is at the right level: GO:0005096 is currently the substrate-agnostic GAP term,
      and
      Sec23 is the COPII inner-coat subunit that increases SAR1-GTP hydrolysis during cargo capture
      and
      coat turnover.
    supported_by:
    - reference_id: Reactome:R-HSA-5694527
      supporting_text: Sar1p-GTP hydrolysis is increased 15-30-fold by Sec23p.
    - reference_id: PMID:27551091
      supporting_text: Membrane-bound Sar1-GTP recruits Sec23/24 to form the inner coat complex
        that, in turn, recruits the Sec13/31 outer coat protein
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10075675
  qualifier: enables
  supporting_entities:
  - UniProtKB:O95487
  review:
    summary: The physical interaction may be real, but generic protein binding does not describe
      SEC23A's molecular function.
    action: REMOVE
    reason: Protein binding is non-informative here. The cited experiment reports an interaction,
      but SEC23A should be represented by its COPII coat cycle activity and by specific
      trafficking processes rather than by the generic parent binding term.
    supported_by:
    - reference_id: file:human/SEC23A/SEC23A-notes.md
      supporting_text: Generic protein binding annotations are removed because SEC23A functions as
        a Sec23/24 inner COPII coat subunit with SAR1-directed GAP/cargo-adaptor activity and has
        many real coat, receptor, and high-throughput contacts, but GO:0005515 does not capture
        the informative COPII activity.
