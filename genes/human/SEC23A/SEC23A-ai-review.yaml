- term:
    id: GO:0006886
    label: intracellular protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006895
  - InterPro:IPR006896
  - InterPro:IPR006900
  - InterPro:IPR036174
  - InterPro:IPR036175
  review:
    summary: >-
      The InterPro2GO intracellular protein transport row is true but too broad for the Sec23/24 inner
      COPII coat role.
    action: MODIFY
    reason: >-
      SEC23A executes the specific COPII branch of secretory transport: ER-to-Golgi vesicle-mediated
      transport,
      COPII budding, and cargo loading. The generic parent obscures that placement and should be narrowed
      to the ER-to-Golgi term already present in the review.
    supported_by:
    - reference_id: file:human/SEC23A/SEC23A-notes.md
      supporting_text: GO:0006886 intracellular protein transport is true but too broad for a
        Sec23/24-family COPII subunit; ER-to-Golgi vesicle-mediated transport is the precise
        process represented by direct and Reactome evidence.
    - reference_id: PMID:8898360
      supporting_text: hSec23Ap is a functional homologue of the yeast Sec23p as the hSec23A
        isoform complemented the temperature sensitivity of the Saccharomyces cerevisiae sec23-1
        mutation at a restrictive temperature of 34 degrees C.
    proposed_replacement_terms:
    - id: GO:0006888
      label: endoplasmic reticulum to Golgi vesicle-mediated transport
- term:
    id: GO:0006888
    label: endoplasmic reticulum to Golgi vesicle-mediated transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006895
  - InterPro:IPR006896
  - InterPro:IPR006900
  - InterPro:IPR036174
  - InterPro:IPR036175
  review:
    summary: >-
      SEC23A is an inner COPII coat subunit for ER-to-Golgi vesicle-mediated transport.
    action: ACCEPT
    reason: >-
      The InterPro2GO ER-to-Golgi row is appropriately specific: human SEC23A complements yeast sec23-1
      transport and functions with SEC24 in the COPII inner coat for cargo capture and carrier formation
      on the ER.
    supported_by:
    - reference_id: PMID:8898360
      supporting_text: hSec23Ap is a functional homologue of the yeast Sec23p as the hSec23A
        isoform complemented the temperature sensitivity of the Saccharomyces cerevisiae sec23-1
        mutation at a restrictive temperature of 34 degrees C.
    - reference_id: PMID:27551091
      supporting_text: Membrane-bound Sar1-GTP recruits Sec23/24 to form the inner coat complex
        that, in turn, recruits the Sec13/31 outer coat protein
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: IDA
  original_reference_id: PMID:18843296
  qualifier: enables
  review:
    summary: >-
      SEC23A coordinates zinc in its N-terminal Sec23/24 zinc-finger domain.
    action: KEEP_AS_NON_CORE
    reason: >-
      The zinc-binding annotation is retained as a real structural biochemical property of the Sec23/24-family
      fold. It is not the core GAP/cargo-loading activity of SEC23A, which is carried by the assembled
      inner COPII coat.
    supported_by:
    - reference_id: file:human/SEC23A/SEC23A-notes.md
      supporting_text: Zinc ion binding is a structural property of the N-terminal Sec23/Sec24
        zinc-finger domain, with UniProt recording Zn(2+) ligands at SEC23A residues 61, 66, 85,
        and 88 from COPII crystal and NMR structures; it is real but is not SEC23A's core COPII
        GAP or cargo-loading activity.
