    label: nuclear pore
suggested_questions:
- question: Is NUP210 required for NPC assembly in all human cell types, given reports of cell-type-specific
    expression and roles in muscle and immune cell differentiation?
- question: Does the large luminal domain of NUP210 interact with ER-lumen or inner-nuclear-membrane proteins
    to regulate pore spacing?
suggested_experiments:
- description: Degron-mediated acute depletion of endogenous NUP210 in human cells followed by expansion
    or electron microscopy of NPC density and luminal ring integrity, to separate assembly from maintenance
    roles.
