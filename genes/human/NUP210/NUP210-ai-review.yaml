  qualifier: located_in
  review:
    summary: Integrated structural analysis places NUP210 in the NPC at the nuclear envelope.
    action: MODIFY
    reason: Correct but general; NUP210 is specifically a transmembrane component of the nuclear pore
      complex (nuclear pore, already carried; more precisely the pore-membrane/transmembrane ring).
    proposed_replacement_terms:
    - &id001
      id: GO:0005643
      label: nuclear pore
    - id: GO:0070762
      label: nuclear pore transmembrane ring
    supported_by:
    - &id002
      reference_id: PMID:14517331
      supporting_text: Gp210 is an evolutionarily conserved membrane protein of the nuclear pore complex
        (NPC).
    - &id004
      reference_id: PMID:27016207
      supporting_text: Finally, the NPC assembly is anchored in the pore membrane via a set of transmembrane
        proteins, scNdc1(hsNdc1), scPom33, scPom34, scPom152, hsPom121 and hsNup210.
