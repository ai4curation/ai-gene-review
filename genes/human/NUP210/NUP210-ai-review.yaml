id: Q8TEM1
gene_symbol: NUP210
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NUP210 (gp210) is a large single-pass transmembrane nucleoporin of the nuclear pore complex
  (NPC). A short N-terminal signal sequence directs co-translational insertion so that nearly all of the
  protein (about 1,780 residues of immunoglobulin-like domains) lies in the perinuclear space/ER lumen,
  followed by one transmembrane helix in the pore membrane and a short cytoplasmic tail exposed to the
  pore. Together with NDC1 and POM121 it anchors the NPC scaffold in the pore membrane, forming a luminal
  ring around the pore, and contributes to NPC assembly, spacing and structural integrity; RNAi depletion
  causes clustered NPCs, aberrant nuclear membranes and loss of viability. It is ubiquitously expressed,
  phosphorylated in mitosis, and is an autoantigen in primary biliary cholangitis.
