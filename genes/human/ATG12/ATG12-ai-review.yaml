- term:
    id: GO:0032480
    label: negative regulation of type I interferon production
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: ATG12 conjugate can suppress innate antiviral signaling.
    action: KEEP_AS_NON_CORE
    reason: 'Full PMID:17709747 directly tests ATG12 in HEK293 cells: conjugate formation suppresses
      RIG-I/MDA5-dependent reporter signaling, whereas conjugation-deficient ATG5 fails to suppress
      it. The broad innate-response parent is therefore as valid as type-I-IFN and antiviral-defense
      children. Source PMID:19666601 instead measures HCV translation/infection and is not by
      itself an immune-suppression assay; the independent PMID:17709747 evidence supports the
      biological claim without conflating proviral replication with host-defense inhibition.'
    supported_by:
    - &id007
      reference_id: PMID:17709747
      supporting_text: Similar suppression was observed with Atg12 alone, but not with 
        Atg5-K130R
