id: O94817
gene_symbol: ATG12
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ATG12 is a ubiquitin-like modifier and an essential component of the autophagic ATG8 lipidation
  machinery. Following activation by ATG7, ATG10 promotes its covalent conjugation to ATG5.
  The ATG12–ATG5 conjugate associates with ATG16L1 and provides E3-like activity for LC3/GABARAP
  lipidation on forming autophagic membranes; ATG12 recruits the E2 enzyme ATG3. ATG12 also
  forms a distinct covalent conjugate with ATG3 in mammalian cells. Alternative ATG12-containing
  assemblies contribute to autophagosome maturation, mitochondrial homeostasis and context-dependent
  antiviral signaling. The protein acts in the cytosol and on membranes through its interaction
  partners.
alternative_products:
