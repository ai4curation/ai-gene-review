- term:
    id: GO:0050687
    label: negative regulation of defense response to virus
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: >-
      Negative regulation of defense response to virus. A genuine proviral role, supported
      by IDA, but a context-specific one.
    action: KEEP_AS_NON_CORE
    reason: >-
      The ATG5-ATG12 conjugate interacts with RIG-I and MAVS and dampens type I interferon
      production, and the autophagy proteins including ATG12 are required for translation of
      incoming hepatitis C virus RNA. Both are real findings on the human gene. They
      describe how a virus exploits the conjugate, or a signalling side activity of it,
      rather than the conjugation function itself. Non-core.
    supported_by:
    - reference_id: PMID:19666601
      supporting_text: we report that autophagy proteins (i.e., Beclin-1, Atg4B, Atg5, and Atg12) are proviral factors required for translation of incoming hepatitis C virus (HCV) RNA and, thereby, for initiation of HCV replication, but they are not required once infection is established.
