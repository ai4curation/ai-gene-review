core_functions:
- description: >-
    Acts as a ubiquitin-like covalent modifier, principally conjugated through its C-terminal
    glycine to ATG5 Lys130 following ATG7 activation and ATG10-mediated transfer. Mammalian
    ATG12 also modifies ATG3 through a distinct conjugation route.
