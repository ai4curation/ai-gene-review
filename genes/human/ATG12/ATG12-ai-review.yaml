- term:
    id: GO:0031386
    label: protein tag activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Protein tag activity. ATG12 is a ubiquitin-like modifier, and being conjugated is what
      it is for.
    action: ACCEPT
    reason: >-
      ATG12 is activated by ATG7 as E1 and transferred by ATG10 as E2 onto Lys130 of ATG5,
      where it stays constitutively. Unlike ubiquitin it is not a reversible mark on many
      substrates - it has essentially one target and never comes off - but the molecular
      activity is the same: covalent attachment of a ubiquitin-fold protein that changes
      what the target can do. Core.
- term:
    id: GO:0000421
    label: autophagosome membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Autophagosome membrane, with is_active_in; the site of the E3-like reaction.
    action: ACCEPT
    reason: >-
      The reaction happens on the elongating phagophore rather than on a completed
      autophagosome, the same conflation the proposed phagophore membrane term is meant to
      resolve. Accepted as the best available term for a core site of action.
- term:
    id: GO:0019776
    label: Atg8-family ligase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  review:
    summary: >-
      Atg8-family ligase activity with a contributes_to qualifier, which is exactly right
      for a subunit of an E3-like conjugate.
    action: ACCEPT
    reason: >-
      Neither ATG12 nor ATG5 has ligase activity alone; the conjugate does. The
      contributes_to qualifier is used correctly here and is the model for how the
      equivalent annotations on ATG5 and ATG16L1 should read. ATG12 makes a specific and
      identifiable contribution: the high-affinity ATG3-binding surface is exclusive to
      ATG12, so it is the subunit that engages the E2 carrying the ATG8 protein. Core.
    supported_by:
    - reference_id: PMID:23202584
      supporting_text: The autophagy factor ATG12~ATG5 conjugate exhibits E3 ligase-like activity which facilitates the lipidation of members of the LC3 family.
    - reference_id: PMID:23202584
      supporting_text: The ATG12~ATG5 conjugate interacts with the E2 enzyme ATG3 with high affinity through another surface location that is exclusive to ATG12, suggesting a different role of the continuous patch in E3 activity.
- term:
    id: GO:0034727
    label: piecemeal microautophagy of the nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Piecemeal microautophagy of the nucleus, a yeast process propagated by IBA.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      PMN proceeds at the budding-yeast nucleus-vacuole junction formed by Nvj1 and Vac8.
      Humans have no vacuole and no characterised NVJ equivalent, so the process does not
      transfer even though the ATG12 orthology is sound. Over-annotated rather than removed,
      since the machinery is genuinely shared. Same call as GO:0034727 on ATG9A and
      GO:0044804 on WIPI2.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: SGD:S000000421
        source_label: ATG12 (Saccharomyces cerevisiae)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Yeast Atg12 is genuinely required for piecemeal microautophagy of the nucleus, which
          proceeds at the nucleus-vacuole junction formed by Nvj1 and Vac8. Humans have no
          vacuole and no characterised NVJ equivalent.
      - source_id: PANTHER:PTN000333039
        source_label: ATG12 family node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The only non-node donor is the fungal gene, so the whole transfer rests on a
          process that has no mammalian counterpart.
- term:
    id: GO:0061723
    label: glycophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Glycophagy, propagated from a Drosophila ATG12 and the family node.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Mammalian glycophagy selectivity comes from the cargo receptor STBD1, which bridges
      glycogen to GABARAP-family proteins. The IBA asserts a cargo-specific process for the
      general conjugation machinery on the strength of family membership. Same call as
      GO:0061723 on WIPI2.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: FB:FBgn0036255
        source_label: Atg12 (Drosophila melanogaster)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          A glycogen-autophagy phenotype for fly Atg12 reflects its role in the general
          conjugation machinery; it does not establish a glycophagy-specific role for the
          human protein.
      - source_id: PANTHER:PTN000333039
        source_label: ATG12 family node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Mammalian glycophagy selectivity is supplied by the cargo receptor STBD1, not by the
          conjugation machinery. Transferring the cargo-specific term to the node conflates
          the general machinery with the receptor that gives it specificity.
- term:
    id: GO:0097352
    label: autophagosome maturation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Autophagosome maturation. Genuinely supported for this gene by the TECPR1 work, though
      the IBA route to it is weak.
    action: KEEP_AS_NON_CORE
    reason: >-
      Unusually for an IBA of this kind, the claim is independently supported on the human
      gene: TECPR1 and ATG16L1 form mutually exclusive complexes with the ATG12-ATG5
      conjugate, and the TECPR1-bound form works at the autolysosome to drive
      autophagosome-lysosome fusion. So ATG12 has a genuine second, post-assembly role. It
      is kept as non-core because it is a distinct downstream deployment of the same
      conjugate rather than the E3-like activity itself, and because the gene also carries
      the more precise GO:1901096.
    supported_by:
    - reference_id: PMID:22342342
      supporting_text: TECPR1 and Atg16 form mutually exclusive complexes with the Atg12-Atg5 conjugate, and TECPR1 binds PtdIns(3)P upon association with the Atg12-Atg5 conjugate.
