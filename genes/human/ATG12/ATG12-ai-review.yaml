- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32960676
  qualifier: enables
  review:
    summary: >-
      Bare protein binding from eighteen IPI experiments, several of which are
      high-throughput hits with no plausible connection to autophagy.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Per project curation guidance, protein binding says nothing about what the gene
      product does. The informative partners here are ATG5, to which ATG12 is constitutively
      conjugated; ATG7 and ATG3, the E1 and E2 of the two conjugation cascades; ATG16L1,
      which recruits the conjugate to membranes; and RAB33B, which recruits the complex to
      phagophores. All of these are better captured by the accepted GO:0019776, GO:0034274
      and GO:0031386 annotations. The remainder - CRX, MEOX2, IER2, SERTAD1 and SERTAD2, all
      from the same binary interactome screen PMID:32296183 - are transcription factors and
      immediate-early proteins with no known autophagy connection and no follow-up. They are
      the reason a term this generic accumulates noise.
