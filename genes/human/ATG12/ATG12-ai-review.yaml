id: O94817
gene_symbol: ATG12
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ATG12 is a ubiquitin-like protein that works as a permanent modification rather than a
  reversible mark. It is activated by ATG7 acting as an E1 enzyme, carried by ATG10 as an E2,
  and conjugated through its C-terminal glycine to Lys130 of ATG5, where it remains
  constitutively - there is no deconjugating enzyme and essentially no other substrate. The
  ATG12-ATG5 conjugate that results is itself an enzyme: it has E3 ligase-like activity for the
  second autophagy conjugation cascade, promoting attachment of ATG8-family proteins to
  membrane phospholipid. ATG12 makes an identifiable contribution to that activity, since the
  high-affinity binding surface for ATG3, the E2 that carries the activated ATG8 protein, lies
  on ATG12 and not on ATG5. Bound to the N-terminal region of ATG16L1, the conjugate is
  delivered to the phagophore and drives the membrane expansion that builds an autophagosome.
  The same conjugate has a second, later role: bound instead to TECPR1, which competes with
  ATG16L1 for it, it acts at the autolysosome to promote autophagosome-lysosome fusion. ATG12
  is also a point at which viruses engage the autophagy machinery, associating with RIG-I,
  MDA5 and MAVS to dampen type I interferon production and being required for translation of
  incoming hepatitis C virus RNA.
