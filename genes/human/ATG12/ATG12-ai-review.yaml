    label: regulation of autophagosome maturation
  evidence_type: IMP
  original_reference_id: PMID:22342342
  qualifier: involved_in
  review:
    summary: >-
      Regulation of autophagosome maturation, from the TECPR1 study, supported by IMP.
    action: KEEP_AS_NON_CORE
    reason: >-
      The specific and directly supported statement of the post-assembly role: losing TECPR1
      accumulates autophagosomes and blocks autophagic degradation, and the ATG12-ATG5
      conjugate is the partner that gives the complex its fusion specificity. Kept as
      non-core because it is a second deployment of the conjugate rather than ATG12's
      defining activity.
    supported_by:
    - reference_id: PMID:22342342
      supporting_text: Consequently, elimination of TECPR1 leads to accumulation of autophagosomes and blocks autophagic degradation of LC3-II and p62.
