core_functions:
- description: >-
    Acts as a ubiquitin-like modifier: activated by the E1 enzyme ATG7, transferred by the E2
    ATG10, and conjugated through its C-terminal glycine to Lys130 of ATG5, where it remains
    permanently. This single conjugation event is what ATG12 exists to do, and it creates the
    functional unit of the second autophagy conjugation cascade.
  molecular_function:
    id: GO:0031386
    label: protein tag activity
- description: >-
    As half of the ATG12-ATG5 conjugate, contributes E3 ligase-like activity for attachment of
    ATG8-family proteins to membrane phospholipid. The contribution is specific and
    structurally located: the high-affinity binding site for the E2 enzyme ATG3 is exclusive
    to ATG12, so it is the subunit that engages the carrier of the activated ATG8 protein.
    Neither subunit has the activity alone, which is why the qualifier is contributes_to.
  contributes_to_molecular_function:
    id: GO:0019776
    label: Atg8-family ligase activity
  directly_involved_in:
  - id: GO:0000045
    label: autophagosome assembly
  in_complex:
    id: GO:0034274
    label: Atg12-Atg5-Atg16 complex
  locations:
  - id: GO:0000421
    label: autophagosome membrane
  - id: GO:0061908
    label: phagophore
  supported_by:
  - reference_id: PMID:23202584
    supporting_text: The autophagy factor ATG12~ATG5 conjugate exhibits E3 ligase-like activity
      which facilitates the lipidation of members of the LC3 family.
  - reference_id: PMID:23202584
    supporting_text: The ATG12~ATG5 conjugate interacts with the E2 enzyme ATG3 with high
      affinity through another surface location that is exclusive to ATG12, suggesting a
      different role of the continuous patch in E3 activity.
proposed_new_terms:
- proposed_name: phagophore membrane
  proposed_definition: >-
    The membrane system of a phagophore, comprising its two closely apposed lipid bilayers
    and the continuous rim that joins them, which expands by lipid acquisition and closes to
    form the double membrane of an autophagosome.
  proposed_parent:
    id: GO:0061908
    label: phagophore
  justification: >-
    The four GO:0034045 assertions on this gene all describe the ATG12-ATG5 conjugate acting
    on the elongating phagophore bilayer, the location it reaches via ATG16L1. GO has
    autophagosome membrane and omegasome membrane but no phagophore membrane, so such
    annotations split between a term for the finished organelle and GO:0034045, which asserts
    via bounding_layer_of a bounding membrane the PAS does not have. See GO issue #29437
    recommendation R3 and projects/CONDENSATES/GO_0034045-annotation-audit.md. Same term
    proposed in the ATG9A, WIPI2 and ATG16L1 reviews.
suggested_questions:
- question: >-
    ATG12 uses contributes_to for the Atg8-family ligase activity, which is the correct
    qualifier for a subunit of an E3-like conjugate. ATG5 and ATG16L1 do not. Should the three
    be harmonised, and is contributes_to the right answer for all of them given that the
    ATG3-binding surface is exclusive to ATG12?
- question: >-
    TECPR1 and ATG16L1 bind the ATG12-ATG5 conjugate mutually exclusively, sending it to two
    different membranes for two different jobs. Is that switch regulated, and if so by what -
    is there a signal that converts assembly-competent conjugate into fusion-competent
    conjugate?
- question: >-
    ATG12 is conjugated once, to one substrate, and never removed. Is the ubiquitin-like
    machinery here doing anything a constitutive fusion protein could not, or is the
    conjugation step a vestige of a system that was once regulated?
- question: >-
    Five of the eighteen protein binding annotations (CRX, MEOX2, IER2, SERTAD1, SERTAD2) come
    from a single binary interactome screen and involve transcription factors and
    immediate-early proteins. Have any been followed up, and should unreplicated
    high-throughput hits carry the same annotation weight as the ATG5 and ATG3 interactions?
suggested_experiments:
- description: >-
    Test whether the ATG12-ATG5 conjugate can be replaced by a genetically encoded ATG12-ATG5
    fusion in cells lacking ATG7 and ATG10, scoring canonical autophagy, TECPR1-dependent
    maturation and the antiviral phenotypes, to determine what the conjugation reaction itself
    contributes beyond producing the conjugate.
- description: >-
    Structure-guided separation of the two conjugate destinations: identify ATG12 or ATG5
    surface mutations that abolish TECPR1 binding without affecting ATG16L1 binding, and the
    reverse, then assay autophagosome formation and autophagosome-lysosome fusion separately
    in each background.
- description: >-
    Co-immunoprecipitation and proximity labelling in cells infected with vesicular stomatitis
    virus and with hepatitis C virus, comparing conjugated and unconjugated ATG12, to
    establish whether the antiviral and proviral roles require the ATG5 conjugate or the free
    protein, which GOA currently does not distinguish.
