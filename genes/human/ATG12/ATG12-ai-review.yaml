- term:
    id: GO:0019776
    label: Atg8-family ligase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  review:
    summary: >-
      Atg8-family ligase activity with a contributes_to qualifier, which is exactly right for
      a subunit of an E3-like conjugate.
    action: ACCEPT
    reason: >-
      Neither ATG12 nor ATG5 has ligase activity alone; the conjugate does. The contributes_to
      qualifier is used correctly here and is the model for how the equivalent annotations on
      ATG5 and ATG16L1 should read. ATG12 makes a specific and identifiable contribution: the
      high-affinity ATG3-binding surface is exclusive to ATG12, so it is the subunit that engages
      the E2 carrying the ATG8 protein. Core.
    supported_by:
    - reference_id: PMID:23202584
      supporting_text: The autophagy factor ATG12~ATG5 conjugate exhibits E3 ligase-like 
        activity which facilitates the lipidation of members of the LC3 family.
    - reference_id: PMID:23202584
      supporting_text: The ATG12~ATG5 conjugate interacts with the E2 enzyme ATG3 with 
        high affinity through another surface location that is exclusive to ATG12, 
        suggesting a different role of the continuous patch in E3 activity.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000333039
        source_status: SUPPORTS_TRANSFER
        comment: Actual PTHR13385 v19 root is ancestral to human O94817 leaf PTN002491519.
          Matching current IBD verified; target experimental grounding is expected, not 
          circular.
- term:
    id: GO:0034727
    label: piecemeal microautophagy of the nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Conservation of ATG12-dependent piecemeal micronucleophagy in humans remains 
      unresolved.
    action: UNDECIDED
    reason: The actual root IBD lies on the target lineage, and full yeast PMID:18701704 
      demonstrates ATG12 participation in PMN through the core conjugation machinery. 
      GO:0034727 currently means degradation of a cell nucleus by microautophagy and does 
      not require named yeast junction proteins in its definition. Lack of a yeast-like 
      vacuole or identified NVJ1 ortholog is insufficient to establish loss. The conserved
      lipidation machinery could contribute, but macroautophagic nucleophagy alone would 
      not establish this route. Await the already queued ATG2A route adjudication; no 
      duplicate report requested.
    supported_by:
    - reference_id: PMID:18701704
      supporting_text: We found that the core autophagy genes ATG3, 4, 5, 7, 10, 12 , and 
        16 are all required for efficient degradation of GFP-Osh1
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000333039
        source_status: UNRESOLVED
        comment: Verified root IBD and human target ancestry. Yeast source PMID:18701704 
          directly tests ATG12; whether the same microautophagic nuclear route occurs in 
          the target context remains unresolved.
- term:
