suggested_questions:
- question: Which nuclear microautophagy routes in human cells use the ATG12 conjugation 
    machinery, as distinct from macroautophagic nucleophagy?
- question: How do ATG12–ATG5, ATG12–ATG3 and unconjugated ATG12 pools partition across 
    membrane lipidation, mitochondrial homeostasis and immune signaling contexts?
suggested_experiments:
- description: >-
    Test whether the ATG12-ATG5 conjugate can be replaced by a genetically encoded ATG12-ATG5
    fusion in cells lacking ATG7 and ATG10, scoring canonical autophagy, TECPR1-dependent maturation
    and the antiviral phenotypes, to determine what the conjugation reaction itself contributes
    beyond producing the conjugate.
- description: >-
    Structure-guided separation of the two conjugate destinations: identify ATG12 or ATG5 surface
    mutations that abolish TECPR1 binding without affecting ATG16L1 binding, and the reverse,
    then assay autophagosome formation and autophagosome-lysosome fusion separately in each
    background.
- description: >-
    Co-immunoprecipitation and proximity labelling in cells infected with vesicular stomatitis
    virus and with hepatitis C virus, comparing conjugated and unconjugated ATG12, to establish
    whether the antiviral and proviral roles require the ATG5 conjugate or the free protein,
    which GOA currently does not distinguish.
