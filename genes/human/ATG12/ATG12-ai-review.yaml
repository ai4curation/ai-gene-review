- term:
    id: GO:0034045
    label: phagophore assembly site membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phagophore assembly site membrane. Four assertions describing the ATG12-ATG5 conjugate
      acting on the isolation membrane.
    action: MODIFY
    reason: >-
      GO:0034045 asserts via bounding_layer_of that a membrane bounds the phagophore
      assembly site. The PAS is a liquid-like protein condensate with no bounding bilayer,
      and the term carries phagophore and isolation membrane as related synonyms of the
      distinct term GO:0061908 - see GO issue #29437 and
      projects/CONDENSATES/GO_0034045-annotation-audit.md. ATG12 has no membrane-binding
      domain of its own and reaches this location only as part of the ATG12-ATG5-ATG16L1
      complex, so the location it shares is whatever ATG16L1 targets, which the primary
      literature calls the isolation membrane or phagophore. Moved to GO:0061908; one of the
      four assertions carries UniProtKB-SubCell:SL-0221, so this is also an SL propagation.
      The same call was made on ATG9A, WIPI2 and ATG16L1.
    proposed_replacement_terms:
    - id: GO:0061908
      label: phagophore
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: MGI:MGI:1914776
        source_label: Atg12 (mouse)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Direct one-to-one ortholog; the localization transfers cleanly and the defect is in
          the destination term.
      - source_id: UniProtKB:O94817
        source_label: ATG12 (the target's own experimental evidence)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The target appears among its own WITH/FROM sources because its experimental
          annotation contributed to the curator's IBD placement. Not circular; it grounds the
          node-level claim in data from this gene.
      - source_id: PANTHER:PTN000333039
        source_label: ATG12 family node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Node grouping is sound. Worth noting that ATG12 has no membrane-binding domain, so
          its membrane localization is entirely inherited from ATG16L1; whichever term is
          correct for ATG16L1 is correct here.
