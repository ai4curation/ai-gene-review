suggested_questions:
- question: Does human STEAP2 reduce Fe(3+) and Cu(2+) directly in intact cells, or does it require partner
    STEAP subunits as proposed for STEAP1?
- question: Which cellular pool (plasma membrane vs transferrin-cycle endosome) predominates for STEAP2
    metalloreductase activity in prostate epithelium?
suggested_experiments:
- description: Reconstitute purified human STEAP2 in nanodiscs and measure NADPH-dependent Fe(3+)/Cu(2+)
    reductase kinetics, and knock down STEAP2 in LNCaP cells to quantify surface ferrireductase activity
    and iron/copper uptake.
