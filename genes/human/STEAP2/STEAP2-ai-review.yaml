gene_symbol: STEAP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: STEAP2 (six-transmembrane epithelial antigen of the prostate 2, also STAMP1) is a multi-pass
  membrane metalloreductase of the STEAP family. It combines a cytoplasmic N-terminal NADPH-binding oxidoreductase
  domain with a six-helix transmembrane domain that binds FAD and heme b, transferring electrons from
  cytosolic NADPH across the membrane to reduce extracellular or luminal Fe(3+) and Cu(2+) chelates, thereby
  supporting cellular uptake of iron and copper. STEAP2 is expressed predominantly in prostate epithelium,
  where it localizes to the plasma membrane, the trans-Golgi network and endosomal vesicles, and it is
  highly expressed on the surface of prostate cancer cells.
