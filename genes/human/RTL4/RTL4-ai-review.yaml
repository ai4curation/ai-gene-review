  review:
    summary: >-
      Single high-throughput yeast two-hybrid interaction with AGR2 (O95994) from the
      HuRI binary-interactome map; no functional interpretation.
    action: REMOVE
    reason: >-
      Bare protein binding is uninformative and removed under the protein-binding policy.
      The AGR2 interaction comes from a single large-scale Y2H screen with no orthogonal
      validation or mechanistic context, and does not identify a specific molecular
      function for RTL4. Removal does not assert the interaction is false.
