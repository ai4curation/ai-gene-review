core_functions:
- description: >-
    Retrotransposon-derived CCHC zinc-knuckle protein predicted to bind nucleic acid
    (single-stranded RNA); the SIRH11/RTL4 gene is implicated in brain/noradrenergic
    function and, as an X-linked loss-of-function, in autism spectrum disorder.
  molecular_function:
    id: GO:0003676
    label: nucleic acid binding
  supported_by:
  - reference_id: PMID:16093683
    supporting_text: >-
      In addition, three Mar proteins have conserved the Gag CCHC zinc finger motif,
      suggesting a role in nucleic acid binding.
  knowledge_gaps:
  - gap_statement: >-
      The direct molecular activity of human RTL4 (whether and what nucleic acid or ligand
      it binds) and the mechanism linking it to noradrenergic signalling and ASD are
      undetermined; no biochemical assay of the human protein exists.
    gap_kind:
    - BIOLOGY
proposed_new_terms: []
suggested_questions:
- question: >-
    Does human RTL4 bind single-stranded RNA or another extracellular polyanion, and is this
    activity zinc/CCHC-dependent?
- question: >-
    Is human RTL4 expressed and secreted by microglia as in mouse, and how does its loss cause
    the autism-associated phenotype?
suggested_experiments:
- hypothesis: >-
    Human RTL4 is a nucleic-acid-binding protein whose activity depends on the CCHC knuckle.
  description: >-
    Express recombinant human RTL4 and test zinc-dependent ssRNA/nucleic-acid binding (EMSA,
    anisotropy) comparing wild-type and CCHC Cys/His-to-Ala mutants.
- hypothesis: >-
    RTL4 loss of function causes the reported autism phenotype through impaired noradrenergic
    regulation.
  description: >-
    Model the reported human nonsense variant (and knockout) in neuronal/microglial systems
    and in mouse, and assess noradrenergic signalling, behaviour, and microglial secretion.
