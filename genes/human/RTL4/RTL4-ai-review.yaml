gene_symbol: RTL4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RTL4 (retrotransposon Gag-like protein 4; also ZCCHC16, SIRH11, MAR3/MART4) is an
  X-linked eutherian gene domesticated from the gag region of a Ty3/gypsy sushi-ichi-related
  LTR retrotransposon. The 310-residue protein retains a single C-terminal CCHC-type zinc
  knuckle (C-x2-C-x4-H-x4-C) of the retroviral nucleocapsid type flanked by basic residues,
  but no reverse transcriptase, integrase or protease, so it is predicted by homology to be
  a nucleic-acid (ssRNA)-binding protein rather than an enzyme. RTL4/SIRH11/ZCCHC16 is
  implicated in brain function: the mouse ortholog is a microglial gene whose secreted
  product is coupled to the noradrenergic (locus coeruleus) system, and knockout mice show
  impaired attention, impulsivity and working memory with reduced noradrenaline recovery in
  prefrontal cortex. In humans, rare loss-of-function (a nonsense variant on the X-linked
  gene) has been reported as a cause of autism spectrum disorder. The gene is highly
  conserved in three of four eutherian superorders but pseudogenized in xenarthrans.
existing_annotations:
- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001878
  - InterPro:IPR036875
  review:
    summary: >-
      InterPro2GO mapping from the retroviral-type CCHC zinc knuckle (residues 278-295).
      RTL4's only recognizable domain is this nucleocapsid-type knuckle flanked by basic
      residues.
    action: ACCEPT
    reason: >-
      The CCHC knuckle is the canonical nucleic-acid-binding module of retrotransposon and
      retroviral Gag nucleocapsids; RTL4 retains it intact. Direct nucleic-acid binding of
      the human protein has not been assayed, so the general term is as specific as the
      evidence allows. Accepted as the best available statement of molecular activity.
    supported_by:
    - reference_id: PMID:16093683
      supporting_text: >-
        In addition, three Mar proteins have conserved the Gag CCHC zinc finger motif,
        suggesting a role in nucleic acid binding.
    - reference_id: PMID:42511665
      supporting_text: >-
        SIRH11/RTL4 may contribute to the clearance of DAMPs, including nucleic acids
        released from apoptotic neurons through its conserved C-terminal CCHC RNA-binding
        motif
