  qualifier: enables
  supporting_entities:
  - InterPro:IPR001878
  - InterPro:IPR036875
  review:
    summary: >-
      InterPro2GO mapping from the CCHC zinc knuckle; the three Cys and one His coordinate
      a structural zinc ion.
    action: ACCEPT
    reason: >-
      The CCHC motif (human C-LYCSQSGHFTRDC) is a bona fide zinc-coordinating module,
      conserved from the retrotransposon nucleocapsid. Accepted as a supporting
      molecular-function term.
    supported_by:
    - reference_id: PMID:16093683
      supporting_text: >-
        In addition, three Mar proteins have conserved the Gag CCHC zinc finger motif,
        suggesting a role in nucleic acid binding.
