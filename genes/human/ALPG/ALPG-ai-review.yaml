      Reactome's statement of the substrate side of the same reaction: ALPG is a
      GPI-anchored plasma membrane protein before GPLD1 acts on it.
    action: ACCEPT
    reason: >-
      Correct and consistent with the direct PI-PLC evidence on the human enzyme.
- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: NAS
  original_reference_id: PMID:2162249
  qualifier: enables
  review:
    summary: >-
      Cited as a non-traceable author statement, but the paper contains more than
      an assertion. Lowe and Strauss cloned the alkaline phosphatase cDNA from the
      BeWo choriocarcinoma line, showed by sequence that it is the germ cell
      (Nagao) gene product rather than the term placental one, and demonstrated
      experimentally that the enzyme is released by phosphatidylinositol-specific
      phospholipase C with at least 95% carrying a PI-glycan anchor.
    action: ACCEPT
    reason: >-
      The term is correct and the paper is the gene-defining study for ALPG's
      protein product. The NAS code understates it: this is where the identity of
      the tumour-associated "placenta-like" enzyme was resolved to this gene, and
      where its GPI anchoring was directly shown. That second result is used below
      as the evidence for a proposed external-side-of-membrane annotation, which
      is what the paper actually demonstrates.
    supported_by:
    - reference_id: PMID:2162249
      supporting_text: >-
        The complementary DNA is the product of the germ cell AP (Nagao isozyme)
        gene and not of the term PLAP gene.
    - reference_id: PMID:2162249
      supporting_text: >-
        These data demonstrate that BeWo AP is the product of a gene normally
        expressed in testis, thymus, and germ cells, but not in placenta.
- term:
    id: GO:0009897
    label: external side of plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:2162249
  qualifier: located_in
  review:
    summary: >-
      Proposed new annotation. GOA records that ALPG is in the plasma membrane but
      not which face of it, even though ecto-orientation is what makes the enzyme
      an ectophosphatase. Lowe and Strauss showed directly, for the human Nagao
      isozyme, that the enzyme is released from the cell membrane by
      phosphatidylinositol-specific phospholipase C and that at least 95% of it
      carries a PI-glycan moiety at the C-terminus.
    action: NEW
    reason: >-
      A GPI anchor places the entire mature protein on the exoplasmic leaflet,
      which is what allows an alkaline phosphatase to act on extracellular
      substrates and to be shed into body fluids by phospholipase cleavage --
      the basis of its use as a serum tumour marker. GO:0009897 is a descendant of
      GO:0005886 and so consistent with every existing location row; it records
      what those rows leave unstated. The evidence here is genuinely direct on the
      human protein, unlike the sequence-predicted GPI signal alone, so IDA is
      warranted. The same annotation is proposed for the other three human
      isozymes, since the topology is common to the family.
    supported_by:
    - reference_id: PMID:2162249
      supporting_text: >-
        Immunoprecipitation of phosphaditylinositol-specific phospholipase
        C-treated AP and analysis by polyacrylamide gel electrophoresis or
        isoelectric focusing demonstrates that at least 95% of the AP contains
        PI-glycan.
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. GOA gives ALPG no metal-binding annotation at all,
      even though the binuclear zinc centre is the catalytic heart of every
      alkaline phosphatase and UniProt annotates seven zinc-coordinating residues
      in ALPG (61, 111, 334, 338, 375, 376, 451) by similarity to ALPP, whose
      metal sites are resolved in a 1.8 A crystal structure.
    action: NEW
    reason: >-
      This is the clearest gap in ALPG's record. Its two nearest paralogues both
      carry zinc and magnesium binding terms, and ALPG is 98% identical to ALPP
      and differs from it at only seven positions, none of them a metal ligand --
      so if the transfer is safe anywhere in this family it is safe here. The zinc
      pair polarises the substrate phosphate and activates the serine nucleophile,
      so this is core to the catalytic function rather than incidental metal
      association. ISS is the correct code: the metals were resolved in ALPP, not
      in ALPG.
    additional_reference_ids:
    - PMID:11124260
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation, the counterpart of the zinc row. The third
      catalytic metal of the alkaline phosphatase active site is magnesium;
      UniProt places its coordinating residues in ALPG at 61, 174 and 330 by
      similarity to ALPP.
    action: NEW
    reason: >-
      The Zn/Zn/Mg triad is a single catalytic unit and annotating part of it
      would leave the record incomplete. As with zinc, the inference is about as
      secure as a sequence-based inference can be, given 98% identity to a
      paralogue with a crystallographically resolved active site and no
      differences at the ligand positions. Both ALPI and ALPP already carry this
      term on the same kind of evidence, so its absence for ALPG looks like an
      oversight rather than a considered judgement.
    additional_reference_ids:
    - PMID:11124260
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. Beyond the catalytic metals, mammalian alkaline
      phosphatases carry a structural calcium site with no counterpart in the
      bacterial enzyme; UniProt annotates four calcium-coordinating residues in
      ALPG (235, 288, 289, 304) by similarity to ALPL, where the identity of the
      metal was established by synchrotron X-ray fluorescence.
    action: NEW
    reason: >-
      Completes the metal complement and records the mammalian-specific part of
      it. Worth distinguishing from the catalytic metals in interpretation: as
      UniProt states for ALPL, calcium binding is structural and does not
      influence phosphatase activity, so this is a real but non-catalytic
      molecular function. It also has a specific resonance for ALPG, whose
      defining Gly429 makes the enzyme unusually sensitive to EDTA -- a chelation
      phenotype that only makes sense for a metalloenzyme with several metal
      sites.
    additional_reference_ids:
    - PMID:11395499
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. UniProt records ALPG as a homodimer by similarity
      to ALPP, where the crystal structure resolves an intimate interface in which
      a long N-terminal helix from one monomer embraces the other and a residue
      from one subunit reaches into the partner's active site.
    action: NEW
    reason: >-
      Ordinarily a protein-binding term would not be worth adding, but across this
      family the dimer is a functional rather than an incidental unit: in ALPP the
      interface is credited with the mammalian-specific allostery, in ALPL
      monomeric mutants are catalytically dead and dominant-negative, and in ALPI
      disease alleles act partly by impairing dimerization. Recording it for ALPG
      keeps the family's quaternary requirement consistent. Two of the seven
      residues that differ between GCAP and PLAP lie in the N-terminal region that
      contributes to the interface, so the dimer is also where any real functional
      divergence between the two would most plausibly be found.
    additional_reference_ids:
    - PMID:11124260
core_functions:
- description: >-
    GCAP is a GPI-anchored, homodimeric, Zn/Zn/Mg-dependent phosphomonoesterase
    displayed on the external face of the plasma membrane of germ cells, where it
    hydrolyses phosphate monoesters at alkaline pH. It is distinguished from its
    98%-identical placental paralogue by Gly429, which renders it sensitive to
    L-leucine, EDTA and heat, and by its expression pattern: testis, thymus and
    germ cells normally, and strong ectopic re-expression in germ cell neoplasia
    in situ and seminoma. No substrate or pathway specific to this isozyme has
    been established, so its function is recorded at the level of the chemistry and
    the topology, without transferring ALPL's pyrophosphatase and mineralization
    roles or assuming a placental role from ALPP.
  molecular_function:
    id: GO:0004035
    label: alkaline phosphatase activity
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: PMID:1939159
    supporting_text: >-
      We report that the differential reactivity of PLAP and GCAP depends
      critically on a single amino acid at position 429. GCAP with Gly-429 is
      strongly inhibited by L-leucine, EDTA, and heat, whereas PLAP with Glu-429
      is resistant.
  - reference_id: PMID:2162249
    supporting_text: >-
      Like placental AP, the tumor AP can be released from the cell membrane by a
      phosphaditylinositol-specific phospholipase C and has a
      phosphaditylinositol-glycan (PI-glycan) moiety at the COOH terminus.
  - reference_id: file:human/ALPG/ALPG-deep-research-falcon.md
    supporting_text: >-
      No compelling ALPG-specific endogenous substrate or dedicated signaling
      pathway was identified in the retrieved literature.
  knowledge_gaps:
  - gap_statement: >-
      Nothing is known about what germ cell alkaline phosphatase does. No
      physiological substrate, no pathway, and no loss-of-function phenotype have
      been reported, and the biological reason for maintaining a second, nearly
      identical copy of the placental enzyme with a different expression pattern is
      unexplained. Its literature is dominated by its use as a tumour marker rather
      than by studies of its normal role.
    boundary: >-
      What is established is the chemistry, the topology and the identity: GCAP
      hydrolyses phosphate monoesters at alkaline pH, is GPI-anchored on the outer
      leaflet, is a homodimeric Zn/Zn/Mg metalloenzyme by close similarity to ALPP,
      differs from ALPP at seven residues of which Gly429 confers L-leucine, EDTA
      and heat sensitivity, and is expressed in testis, thymus and germ cells with
      strong ectopic expression in seminoma.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
proposed_new_terms: []
suggested_questions:
- question: >-
    What does germ cell alkaline phosphatase do in germ cells? No physiological
    substrate, pathway or loss-of-function phenotype has been described, so the
    gene is functionally dark below the level of its chemistry despite having been
    known for decades as a tumour marker.
- question: >-
    Why do humans maintain two alkaline phosphatase genes that differ at only
    seven residues? If Gly429 versus Glu429 changes only inhibitor and heat
    sensitivity, the duplication looks regulatory rather than catalytic -- but if
    that residue also shifts substrate preference, ALPG and ALPP may be doing
    genuinely different chemistry in their respective tissues.
- question: >-
    How much of the published "placental alkaline phosphatase" literature,
    particularly serum marker studies and immunohistochemistry, actually measures
    GCAP? Given roughly 98% identity and widespread antibody cross-reactivity,
    resolving this retrospectively would change how much of that evidence can be
    attributed to either gene.
- question: >-
    What drives the derepression of ALPG in germ cell neoplasia in situ and
    seminoma, and in choriocarcinoma lines where the placental gene is silenced
    instead? The switch between two adjacent, nearly identical genes is an
    unusually clean system in which to study tissue-specific and oncogenic
    promoter control.
suggested_experiments:
- hypothesis: >-
    GCAP and PLAP differ in substrate preference, not only in inhibitor and heat
    sensitivity, and Gly429 is responsible.
  description: >-
    Profile purified recombinant GCAP, PLAP and the reciprocal position-429
    variants against a broad phosphomonoester substrate panel under matched
    conditions, extending the chimera set already built in PMID:1939159. A
    difference in substrate preference would give the first functional rationale
    for maintaining both genes; its absence would support a purely regulatory
    explanation for the duplication.
  experiment_type: comparative enzyme kinetics on engineered variants
- hypothesis: >-
    ALPG has a physiological substrate at the germ cell surface that can be found
    by perturbing the enzyme rather than by guessing candidates.
  description: >-
    Knock out or inhibit ALPG in a human germ cell tumour line that expresses it
    strongly, such as a seminoma-derived line, and compare the extracellular
    phosphoproteome and phosphometabolome against control, using the L-leucine
    sensitivity of GCAP to distinguish its contribution from any co-expressed
    isozyme. This is the same design proposed for ALPP and is the only route to a
    substrate that does not depend on transferring assumptions from ALPL.
  experiment_type: comparative phosphoproteomics with genetic perturbation
- hypothesis: >-
    Existing immunoassays for placental alkaline phosphatase substantially
    conflate ALPP and ALPG.
  description: >-
    Test the commonly used anti-PLAP antibodies and activity assays against
    purified recombinant ALPP and ALPG side by side, quantifying cross-reactivity,
    and pair the results with transcript-level discrimination in the same tumour
    samples. This would establish how much of the seminoma marker literature is
    attributable to each gene and put the isozyme assignments in both reviews on a
    measured rather than an assumed footing.
  experiment_type: assay specificity validation
