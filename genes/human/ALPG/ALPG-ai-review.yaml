- id: file:human/ALPG/ALPG-deep-research-falcon.md
  title: 'Deep research report: human ALPG / germ cell alkaline phosphatase (GCAP,
    Nagao isozyme)'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Automated literature synthesis (Edison/falcon provider). Its most useful
      contribution is negative and is relied on as such here: after searching it
      reports no ALPG-specific physiological substrate or pathway in the
      literature, and it repeatedly flags that antibody and activity assays for
      "placental" alkaline phosphatase do not cleanly separate GCAP from PLAP. It
      correctly grades most cofactor and localisation claims for this gene as
      family inference rather than direct evidence, which matches the ISS codes
      used on the proposed metal-binding annotations. Its structural and
      enzymological claims were checked against the primary literature and UniProt.
