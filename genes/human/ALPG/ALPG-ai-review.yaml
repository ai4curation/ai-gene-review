- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: IDA
  original_reference_id: PMID:1939159
  qualifier: enables
  review:
    summary: >-
      Direct activity measurement on GCAP and on a panel of engineered variants
      expressed in COS-1 cells. The study is the definitive experimental
      separation of GCAP from PLAP: the two differ at only seven residues, and the
      classical differential sensitivity to L-leucine, EDTA and heat is shown to
      depend critically on position 429, where GCAP has glycine and PLAP glutamate.
    action: ACCEPT
    reason: >-
      The single most important experimental annotation for this gene. It
      establishes not only that ALPG has alkaline phosphatase activity but that
      the enzyme is biochemically distinguishable from its 98%-identical
      paralogue, which is what licenses treating the two as separate functional
      entities and what makes isozyme attribution in this family tractable at all.
      It is also the source of the L-leucine, EDTA and heat sensitivity that
      UniProt records as ALPG's activity regulation.
    supported_by:
    - reference_id: PMID:1939159
      supporting_text: >-
        We report that the differential reactivity of PLAP and GCAP depends
        critically on a single amino acid at position 429. GCAP with Gly-429 is
        strongly inhibited by L-leucine, EDTA, and heat, whereas PLAP with Glu-429
        is resistant.
    - reference_id: PMID:1939159
      supporting_text: >-
        Yet, they differ by only 7 amino acids at positions 15, 67, 68, 84, 241,
        254, and 429 within their respective 484 residues.
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8940388
  qualifier: located_in
  review:
    summary: >-
      From the Reactome reaction in which GPLD1 cleaves GPI anchors, releasing
      anchored proteins from the membrane into extracellular fluid.
    action: KEEP_AS_NON_CORE
    reason: >-
      Mechanistically sound and clinically relevant, since it is soluble
      placental-type alkaline phosphatase in serum that is measured as a seminoma
      marker. But the released pool is downstream of where the enzyme acts, and
      for ALPG it carries an extra caveat: serum assays for "PLAP" largely cannot
      distinguish the GCAP contribution from the ALPP one, so this compartment is
      exactly where the isozyme confusion in this family is worst.
- term:
    id: GO:0005886
