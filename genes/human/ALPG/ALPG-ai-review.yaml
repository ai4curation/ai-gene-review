id: P10696
gene_symbol: ALPG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ALPG, long known as ALPPL2, encodes germ cell alkaline phosphatase (GCAP, the
  Nagao isozyme, also called placental-like alkaline phosphatase). It is the third
  member of the tissue-specific alkaline phosphatase cluster on chromosome 2q and
  is the closest paralogue of placental alkaline phosphatase, sharing about 98%
  sequence identity with it and differing at only seven residues. One of those
  residues does most of the work of telling them apart: Gly429 in GCAP, where PLAP
  has Glu429, makes the germ-cell enzyme strongly inhibited by L-leucine, EDTA and
  heat while the placental enzyme resists all three, and these classical
  physicochemical criteria are what historically defined the Nagao isozyme. Like
  the rest of the family it is a homodimeric, Zn/Zn/Mg-dependent phosphomonoesterase
  attached to the outer leaflet of the plasma membrane by a C-terminal
  glycosylphosphatidylinositol anchor, hydrolysing phosphate monoesters at alkaline
  pH; no substrate specific to this isozyme has been established, so its catalytic
  description rests on the family chemistry rather than on any dedicated pathway.
  Normal expression is restricted to trace amounts in testis and thymus and to germ
  cells. Its clinical prominence comes from ectopic re-expression: GCAP is the
  predominant alkaline phosphatase transcript in germ cell neoplasia in situ and in
  seminoma, and choriocarcinoma lines that make a placenta-like enzyme in fact
  derepress this gene rather than the placental one. That near-identity with PLAP
  is also the field's central methodological hazard, since many antibodies and
  activity assays cannot separate the two.
existing_annotations:
- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      The core molecular function, placed by PAINT at a deep node of the alkaline
      phosphatase family whose donors span E. coli PhoA, yeast, fly, fish and all
      four human isozymes, ALPG itself among them. Directly confirmed for the human
      protein by activity measurements on GCAP, GCAP point mutants and GCAP/PLAP
      chimeras expressed in COS-1 cells (PMID:1939159).
    action: ACCEPT
    reason: >-
      Correct and at the right level of specificity. The appearance of ALPG's own
      accession (P10696) in the WITH/FROM list is expected rather than circular:
      the gene has its own experimental annotation for this term, so it is one of
      the descendant evidences the PAINT curator used in placing the ancestral
      assertion, and the IBA then adds the further claim that the activity is
      inherited rather than lineage-specific.
    supported_by:
    - reference_id: PMID:1939159
      supporting_text: >-
        To determine the structural basis and the amino acid(s) involved in these
        physicochemical differences, we constructed three GCAP mutants by
        site-directed mutagenesis and six GCAP/PLAP chimeras and then expressed
        these alkaline phosphatase mutants in COS-1 cells.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      GCAP is GPI-anchored on the outer leaflet of the plasma membrane with its
      catalytic domain facing outward, so the plasma membrane is where it acts and
      is_active_in is the correct qualifier. Direct evidence exists for the human
      protein: the Nagao-type enzyme made by the BeWo choriocarcinoma line is
      released from the membrane by phosphatidylinositol-specific phospholipase C
      and carries a PI-glycan moiety at its C-terminus (PMID:2162249).
    action: ACCEPT
    reason: >-
      Correct. A more precise term exists (GO:0009897, external side of plasma
      membrane) and is proposed below, but the IBA as written is right and its
      node placement -- the vertebrate GPI-anchored membrane form -- is
      appropriate.
    supported_by:
    - reference_id: PMID:2162249
      supporting_text: >-
        Like placental AP, the tumor AP can be released from the cell membrane by
        a phosphaditylinositol-specific phospholipase C and has a
        phosphaditylinositol-glycan (PI-glycan) moiety at the COOH terminus.
