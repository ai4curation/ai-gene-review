id: P02452
gene_symbol: COL1A1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL1A1 encodes the pro-alpha-1 chain of type I collagen, a major fibrillar component of extracellular
  matrices in bone, skin, tendon and many other connective tissues. Its C-terminal propeptide helps select
  and assemble collagen chains in the endoplasmic reticulum. Two alpha-1(I) chains usually associate with
  one alpha-2(I) chain, although alpha-1(I) homotrimers also form. Following secretion and propeptide
  removal by other proteins, mature collagen molecules assemble into fibrils that provide tensile support
  and organize the matrix. Native triple-helical collagen-I fibrils also act as insoluble extracellular
  matrix receptor ligands that directly bind and activate the discoidin domain receptor tyrosine kinases
  DDR1 and DDR2, and interact with integrins and matricellular proteins to regulate cellular adhesion,
  migration and signaling. Pathogenic COL1A1 variants disrupt matrix quantity or architecture
  and cause osteogenesis imperfecta and other connective-tissue disorders.
