  qualifier: enables
  review:
    summary: Propose NEW receptor ligand activity for native triple-helical collagen type I fibrils activating
      DDR1 and DDR2 receptor tyrosine kinases.
    action: NEW
    reason: Beyond its primary structural role in the extracellular matrix (GO:0030020), native triple-helical
      type I collagen ([alpha-1(I)]2[alpha-2(I)], GO:0005584) presents conserved discoidin-domain binding
      motifs (such as GVMGFO) that directly bind and activate the cell-surface receptor tyrosine kinases
      DDR1 and DDR2 (GO:0038062; Reactome:R-HSA-2327738, Reactome:R-HSA-2465890), functioning as an insoluble
      extracellular matrix receptor ligand (Category C structural/ligand protein).
