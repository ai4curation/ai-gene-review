    binding and context-specific signaling?
  experts: []
suggested_experiments:
- hypothesis: Propeptide-dependent chain selection changes mature matrix architecture independently of
    overall collagen production.
  description: Compare sequence-verified human wild-type and interface-mutant COL1A1 with controlled COL1A2
    supply; separately quantify precursor assembly, secretion, propeptide processing, mature fibril dimensions
    and tensile behavior. Normalize matrix amount and retain folding and processing controls.
- hypothesis: Some disease-associated COL1A1 regulatory variants change ocular matrix organization.
  description: Test sequence-verified regulatory alleles in isogenic ocular matrix-producing cells, measuring
    allele-dependent expression, deposited matrix and optical/mechanical properties. Include neutral-variant
    and expression-rescue controls before assigning causality from association.
