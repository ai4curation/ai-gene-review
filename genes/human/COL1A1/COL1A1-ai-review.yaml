core_functions:
- description: Provides alpha-1(I) chains for collagen-I trimers and extracellular fibrils that confer
    tensile strength and organize connective-tissue matrix. C-propeptide-mediated chain selection and
    self-association enable this integrated structural role; proteolytic processing is performed by other
    proteins.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  directly_involved_in:
  - id: GO:0030199
    label: collagen fibril organization
  locations:
  - id: GO:0031012
    label: extracellular matrix
  in_complex:
    id: GO:0005584
    label: collagen type I trimer
  supported_by:
  - reference_id: PMID:28281531
  - reference_id: PMID:17211858
  - reference_id: PMID:20551380
- description: Acts as an insoluble extracellular matrix receptor ligand within native triple-helical
    collagen type I fibrils ([alpha-1(I)]2[alpha-2(I)]), directly binding the extracellular discoidin
    domains of DDR1 and DDR2 dimers to initiate the collagen-activated tyrosine kinase receptor signaling
    pathway.
  molecular_function:
    id: GO:0048018
    label: receptor ligand activity
  directly_involved_in:
