id: O43684
gene_symbol: BUB3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BUB3 is a 328-residue WD40-repeat protein that folds into a seven-bladed beta-propeller and
  functions as a non-catalytic adaptor in the spindle assembly checkpoint (SAC). It forms constitutive,
  mutually exclusive 1:1 complexes with the checkpoint kinases BUB1 and BUB1B (BubR1), each of which binds
  the top face of the propeller through a short GLEBS motif. During prometaphase the BUB1-BUB3 complex
  is recruited to unattached or tensionless kinetochores because BUB3 directly reads MPS1/TTK-phosphorylated
  MELT repeats of the outer-kinetochore protein KNL1; BUB3 is therefore required for kinetochore localisation
  of BUB1 and, downstream, of BUBR1, MAD1-MAD2 and CDC20, and it builds the platform on which the kinetochore
  catalyses conversion of MAD2 to its CDC20-bound closed form. A second BUB3 pool, bound to BUBR1, is
  incorporated with MAD2 and CDC20 into the soluble mitotic checkpoint complex (MCC), the diffusible inhibitor
  that binds APC/C-CDC20 and blocks ubiquitination of securin and cyclin B until every chromosome is bioriented;
  within the MCC, BUB3 is a peripheral, flexibly attached subunit that supports BUBR1 rather than contacting
  the APC/C directly. Through its BUB1 partnership BUB3 also promotes the establishment of stable end-on
  kinetochore-microtubule attachments and chromosome congression. Its abundance and kinetochore loading
  are supported by the GLEBS-motif protein ZNF207/BuGZ, it binds the dynein light chain DYNLT3, and it
  is ubiquitinated by UBR5 to release the MCC from the APC/C during checkpoint silencing. BUB3 is nuclear
  in interphase and is also required for SAC function and accurate homologue segregation in oocyte meiosis
  I.
