  review:
    summary: Logarinho et al. (2008) depleted BUB3 from HeLa cells and found, by cold-stable K-fiber assays,
      interkinetochore stretch, p150Glued/CLIP-170 occupancy and nocodazole-washout recovery, that BUB3
      is required for efficient establishment (not maintenance) of end-on bipolar kinetochore-microtubule
      attachments; misaligned chromosomes were bound side-on, and the phenotype mirrors and is synergistic
      with BUB1 depletion.
    action: ACCEPT
    reason: Solid loss-of-function evidence that BUB3, with BUB1, promotes the lateral-to-end-on conversion
      of K-MT attachments in human cells. The authors acknowledge that BUB3 may act indirectly through
      a microtubule-binding partner; mechanistically its contribution is to dock BUB1 (and thereby BUBR1-PP2A
      and Sgo1/CPC) at kinetochores, which is participation in the process rather than mere necessity.
      The study is in mitotic HeLa cells, so the mitotic child term GO:0051315 would be an acceptable
      refinement, but the parent is retained because BUB3 also functions at meiotic kinetochores (UniProt;
      PMID:32284991).
    supported_by:
    - reference_id: PMID:18199686
      supporting_text: We found that Bub3 is essential for the establishment of correct K-MT attachments
      reference_section_type: ABSTRACT
    - reference_id: PMID:18199686
      supporting_text: it appears that Bub3 is required for efficient establishment rather than the maintenance
        of bipolar MT attachment
      reference_section_type: DISCUSSION
    - reference_id: PMID:18199686
      supporting_text: We do not know whether Bub3 is directly responsible for the K-MT attachments or
        if it indirectly regulates the activity of a MT-binding protein
      reference_section_type: DISCUSSION
