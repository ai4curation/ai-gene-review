suggested_questions:
- question: How is BUB3 partitioned between BUB1-BUB3 and BUBR1-BUB3 complexes in human cells, and is
    exchange between the two pools regulated during mitosis?
- question: Does human BUB3 bind ubiquitin through its WD40 top face as yeast Bub3 does in vitro, and
    if so does this compete with GLEBS/phospho-MELT binding or contribute to UBR5-dependent MCC disassembly?
- question: Is the BUB3-DYNLT3 interaction the route by which dynein strips BUB1/BUB3 from attached kinetochores,
    or does it serve chromosome congression independently of checkpoint silencing?
suggested_experiments:
- description: Generate separation-of-function BUB3 alleles (phospho-MELT-binding surface mutants versus
    GLEBS-binding mutants) in an endogenous degron background and quantify BUB1/BUBR1 kinetochore recruitment,
    MCC assembly by APC/C co-IP, and K-MT attachment stability in the same cells.
  hypothesis: Kinetochore adaptor activity (phospho-MELT reading) and MCC incorporation (BUBR1 GLEBS binding)
    are genetically separable contributions of BUB3 to SAC signalling and to chromosome congression.
- description: Test purified human BUB3 and BUB1-BUB3 for binding to mono- and poly-ubiquitin (pull-down
    and ITC), with WD40 top-face mutants, and assay whether ubiquitin competes with phospho-MELT peptide
    binding.
  hypothesis: The conserved ubiquitin-binding property of WD40 propellers inferred by PAINT is either
    absent in human BUB3 or overlaps with the GLEBS/phospho-MELT site and is therefore not used during
    checkpoint signalling.
