  review:
    summary: PAINT inference (node PTN000103865) that the Bub3 family acts at kinetochores. Human BUB3
      was shown directly to concentrate at kinetochores during prophase/prometaphase and to leave them
      after alignment (PMID:9660858), the pattern expected for a spindle-checkpoint component; the target's
      own IDA sits in the WITH/FROM list, as expected for a well-grounded IBD.
    action: ACCEPT
    reason: Kinetochore is the site where BUB3, in complex with BUB1 (and BUBR1), reads MPS1-phosphorylated
      KNL1 MELT motifs and builds the checkpoint platform. The phylogenetic placement is consistent with
      experimental data in yeast, fly, plant, mouse and human; this is the core location of the gene product.
