- term:
    id: GO:0033597
    label: mitotic checkpoint complex
  evidence_type: IPI
  original_reference_id: PMID:27509861
  qualifier: part_of
  review:
    summary: Alfieri et al. (2016) determined cryo-EM structures of human APC/C bound to the MCC reconstituted
      from BubR1, Bub3, Mad2 and Cdc20. Bub3 was flexibly attached and not resolved in density, and an
      APC/C-miniMCC lacking Bub3 and the BubR1 C-terminus was structurally and functionally indistinguishable,
      showing BUB3 is a bona fide but peripheral MCC subunit.
    action: ACCEPT
    reason: ComplexPortal-derived IPI recording BUB3 as an MCC subunit; the reconstitution used all four
      subunits. The finding that BUB3 is dispensable for APC/C inhibition in vitro bears on how its molecular
      function should be described (structural/adaptor, not inhibitory), not on whether it is part of
      the complex.
    supported_by:
    - reference_id: PMID:27509861
      supporting_text: The APC/CMCC complex was reconstituted by co-lysing APC/COA expressing cells with
        insect cells expressing separately MBP-tagged Cdc20 and the MCC (BubR1, Bub3, Mad2 and untagged
        Cdc20)
      reference_section_type: METHODS
    - reference_id: PMID:27509861
      supporting_text: both the structure and activity of APC/CMCC with Bub3 and the BubR1 C-terminus
        deleted (APC/CminiMCC) are indistinguishable from APC/CMCC
      reference_section_type: RESULTS
- term:
    id: GO:0034501
    label: protein localization to kinetochore
  evidence_type: IPI
  original_reference_id: PMID:9660858
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O60566
  review:
    summary: Taylor et al. (1998) showed that the BUB3-binding motif of BUB1 is the same 38-residue region
      required for BUB1 kinetochore localization, and that ectopic hBubR1 (O60566) localizes to prometaphase
      kinetochores only when hBub3 is co-overexpressed - i.e. BUB3 is required to localize BUB1 and BUBR1
      to kinetochores.
    action: ACCEPT
    reason: 'BUB3 does the work of this process: its WD40 propeller binds the GLEBS motifs of BUB1/BUBR1
      and, in the same complex, the MPS1-phosphorylated MELT repeats of KNL1, physically delivering both
      kinases to unattached kinetochores. This is the classic example of a kinetochore adaptor and is
      BUB3''s most specific process term.'
    supported_by:
    - reference_id: PMID:9660858
      supporting_text: the 38-amino acid deletion that abolished the ability of mBub1 to interact with
        hBub3 also abolished its ability to localize to the kinetochore. These observations suggest that
        the Bub1/Bub3 interaction is required for localizing Bub1 to the kinetochore in mitosis
      reference_section_type: RESULTS
    - reference_id: PMID:9660858
      supporting_text: in prometaphase cells coexpressing hBub3 and hBubR1, localization of hBubR1 at
        kinetochores was observed
      reference_section_type: RESULTS
- term:
    id: GO:0043130
    label: ubiquitin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000103837
  - SGD:S000005552
  review:
    summary: PAINT inference from node PTN000103837 (the Bub3/Rae1 WD40 ancestor), seeded by a single
      S. cerevisiae IDA (SGD S000005552; PMID:21070969) in which Pashkova et al. showed that the top surfaces
      of many yeast WD40 beta-propellers, including Bub3, bind the ubiquitin I44 hydrophobic patch in
      vitro.
    action: KEEP_AS_NON_CORE
    reason: The inference is phylogenetically reasonable - the ubiquitin-binding top face of the WD40
      propeller is a conserved structural property, and the same face of BUB3 also binds GLEBS motifs
      and phospho-MELT peptides - but no ubiquitin-binding activity has been shown for human BUB3 and
      no physiological role for it in checkpoint signalling has been described (BUB3 is itself ubiquitinated
      by UBR5 to disassemble MCC from APC/C, which is a different relationship). It is retained as a plausible
      biochemical property that is not part of BUB3's core adaptor/MCC function.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000103837
        source_status: SUPPORTS_TRANSFER
        comment: Ancestral Bub3/Rae1 WD40 node; the single descendant evidence is an in vitro ubiquitin
          pull-down of yeast Bub3 (PMID:21070969) with no functional context for the checkpoint.
