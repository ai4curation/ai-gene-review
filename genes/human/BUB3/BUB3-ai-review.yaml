- term:
    id: GO:0007094
    label: mitotic spindle assembly checkpoint signaling
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT3G19590
  - FB:FBgn0025457
  - PANTHER:PTN000103865
  - SGD:S000005552
  - WB:WBGene00013209
  review:
    summary: PAINT inference (PTN000103865) that Bub3-family proteins function in mitotic spindle assembly
      checkpoint signalling, seeded by yeast, fly, worm and Arabidopsis experimental data. Human BUB3
      depletion abrogates the SAC (accelerated mitosis in nocodazole; PMID:18199686).
    action: ACCEPT
    reason: 'This is the core process for BUB3, which acts at two steps: it is the phospho-MELT-reading
      adaptor that docks BUB1-BUB3 on unattached kinetochores, and it is a subunit of the MCC that inhibits
      APC/C-CDC20. The phylogenetic placement is sound and matches human loss-of-function data.'
    supported_by:
    - reference_id: PMID:18199686
      supporting_text: depletion of Bub3 to accelerate mitotic progression, both under normal condition
        and exposure to nocodazole, indicating that Bub3 is essential for SAC function
      reference_section_type: DISCUSSION
    - reference_id: PMID:11535616
      supporting_text: This search yielded a single stable complex named the mitotic checkpoint complex
        (MCC), consisting of the proteins hBUBR1, hBUB3, CDC20, and MAD2
      reference_section_type: RESULTS
    - reference_id: file:human/BUB3/BUB3-deep-research-falcon.md
      supporting_text: In a BUB1:BUB3 complex, it binds MPS1-phosphorylated MELT motifs in KNL1 at signaling
        kinetochores; this builds a platform that recruits additional SAC machinery.
    - reference_id: file:human/BUB3/BUB3-deep-research-falcon.md
      supporting_text: In a distinct BUBR1:BUB3 complex, BUB3 becomes part of the soluble mitotic checkpoint
        complex (MCC; BUBR1–BUB3–MAD2–CDC20), which inhibits APC/C–CDC20 and delays anaphase until chromosome
        attachment is satisfactory.
- term:
    id: GO:0007094
    label: mitotic spindle assembly checkpoint signaling
  evidence_type: NAS
  original_reference_id: PMID:11535616
  qualifier: involved_in
  review:
    summary: Sudakin et al. (2001) purified the APC/C-inhibitory activity from HeLa cells and identified
      it as a stoichiometric complex of BUBR1, BUB3, CDC20 and MAD2 (the MCC), 3,000-fold more potent
      than recombinant MAD2; the ComplexPortal-derived NAS annotation records BUB3's involvement in SAC
      signalling as an MCC subunit.
    action: ACCEPT
    reason: Although coded NAS (via ComplexPortal), the underlying evidence is biochemical purification
      of the MCC with BUB3 as a near-stoichiometric subunit. BUB3's presence in the diffusible APC/C inhibitor
      is direct participation in SAC signalling.
    supported_by:
    - reference_id: PMID:11535616
      supporting_text: This search yielded a single stable complex named the mitotic checkpoint complex
        (MCC), consisting of the proteins hBUBR1, hBUB3, CDC20, and MAD2
      reference_section_type: RESULTS
    - reference_id: PMID:11535616
      supporting_text: Western blot analysis confirmed that the affinity-purified GST–hBUBR1 formed the
        MCC, as it contained endogenous hBUBR1, hBUB3, CDC20, and MAD2
      reference_section_type: RESULTS
