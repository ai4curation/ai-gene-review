      is BUB1 (O43683), the canonical GLEBS-motif partner of BUB3.
    action: MODIFY
    reason: 'The interaction is real and central: BUB3''s WD40 propeller binds the BUB1 GLEBS motif, and
      this is how BUB3 delivers BUB1 to phospho-MELT sites at unattached kinetochores (PMID:9660858).
