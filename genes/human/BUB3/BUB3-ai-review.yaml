      supporting_text: we conclude that Bub1 and Bub3 can bind in mammalian cells, and that a 38-amino
        acid domain in the NH2 terminus, which is conserved among the Bub1 and Mad3-related proteins,
        is required for this interaction
      reference_section_type: RESULTS
    - reference_id: PMID:10198256
      supporting_text: In vitro, BUB1 and BUB3 proteins form a complex of monomers of each protein.
      reference_section_type: ABSTRACT
