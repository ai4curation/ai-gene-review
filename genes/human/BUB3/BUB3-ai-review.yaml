  qualifier: enables
  supporting_entities:
  - UniProtKB:O60566
  review:
    summary: Taylor et al. (1998) identified hBubR1 (BUB1B, O60566) as a Mad3/Bub1-related kinase that
      binds hBub3 through the same conserved N-terminal (GLEBS) motif as Bub1, and showed that ectopic
      hBubR1 reaches kinetochores only when hBub3 is co-overexpressed.
    action: MODIFY
    reason: 'This is the founding demonstration that BUB3 is what targets both BUB1 and BUBR1 to kinetochores:
      the BUB3-binding motif of BUB1 is the kinetochore-localization motif, and BUBR1 kinetochore loading
      is BUB3-dependent. ''Protein binding'' understates this; the activity is kinetochore adaptor activity
      (GO:0140483) - BUB3 brings the kinetochore (via phospho-MELT on KNL1) and BUB1/BUBR1 into contact.'
    proposed_replacement_terms:
    - *id001
    supported_by:
    - reference_id: PMID:9660858
      supporting_text: In contrast, hBubR1Δ42 does not copurify with GST–hBub3
      reference_section_type: RESULTS
    - reference_id: PMID:9660858
      supporting_text: in prometaphase cells coexpressing hBub3 and hBubR1, localization of hBubR1 at
        kinetochores was observed
      reference_section_type: RESULTS
