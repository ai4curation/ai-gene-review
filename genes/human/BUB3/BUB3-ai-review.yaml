- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-141409
  qualifier: located_in
  review:
    summary: Reactome reaction 'Mad1 binds kinetochore' (R-HSA-141409). BUB3 is not an active participant
      in this step; it enters the reaction only as a component of Reactome's composite mitotic-kinetochore
      or checkpoint-complex entity, and the cytosol assignment is that entity's compartment.
    action: ACCEPT
    reason: 'The annotation asserts only cytosolic localization, which is correct for BUB3: the BUBR1-BUB3
      module of the MCC is a soluble cytosolic inhibitor (PMID:11535616), and BUB3 is diffusely distributed
      through the mitotic cell once kinetochores are attached (PMID:9660858). The specific Reactome reaction
      does not itself define a BUB3 function, so this row should not be read as evidence for a role in,
      e.g., cohesin phosphorylation or formin recruitment.'
    supported_by:
    - reference_id: PMID:11535616
      supporting_text: Surprisingly, MCC is not generated from kinetochores, as it is also present and
        active in interphase cells
      reference_section_type: ABSTRACT
    - reference_id: PMID:9660858
      supporting_text: we conclude that hBub3 localizes to kinetochores during prophase and prometaphase,
        but not during and after metaphase
      reference_section_type: RESULTS
