  review:
    summary: EYA1 exhibits protein tyrosine phosphatase activity toward phosphorylated H2AX.
    action: ACCEPT
    reason: 'Figure 4B of PMID:19234442 tests affinity-isolated HA-Eya1 from irradiated 293T cells against
      phosphorylated bovine histones: wild type removes the H2AX phosphotyrosine signal while Eya1 D323A
      has little effect. Endogenous human EYA1 knockdown also increases H2AX tyrosine phosphorylation.
      These EYA1-specific results support the general tyrosine-phosphatase activity; the bacterial peptide-specificity
      experiment is Eya3 and is not reassigned to EYA1. The inherited PMID:16797546 support is retained
      as prior context, not a newly inspected original in this lane. No equivalence of the three natural
      human products is established.'
