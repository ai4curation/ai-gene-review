suggested_questions:
- question: Do the three natural human EYA1 products provide intrinsic phosphothreonine catalysis, under
    which substrate and cellular conditions, and when does activity instead depend on associated PP2A
    or another phosphatase?
- question: Which SIX-responsive endogenous genes require EYA1 tyrosine-phosphatase catalysis rather than
    its coactivator interaction, and do the 592-, 559- and 557-residue human products differ in these
    contributions?
- question: How much of the H2AX Tyr142-dependent repair response is executed specifically by EYA1, and
    how does its cooperation with EYA3 vary between cell types and DNA-damage conditions?
suggested_experiments:
- hypothesis: Phosphothreonine dephosphorylation associated with EYA1 may be intrinsic or mediated by
    an associated enzyme, with their relative contributions depending on the substrate and protein preparation.
  description: Compare sequence-verified full-length human EYA1 products purified by orthogonal methods,
    with proteomic measurement of copurifying phosphatases, against H2AX-pTyr142, Myc-pThr58 and aPKC-pThr410
    substrates. Use matched catalytic-site controls mapped to each actual sequence, PP2A depletion and
    add-back, and inhibitor controls whose selectivity is independently measured. Quantify phosphate release
    and substrate-site loss to distinguish EYA1 catalysis from activity carried by an associated enzyme.
  experiment_type: Biochemical reconstitution and catalyst attribution
- hypothesis: EYA1 coactivator interactions and tyrosine-phosphatase chemistry have separable, target-dependent
    effects on developmental transcription.
  description: In human renal or otic progenitor models, replace endogenous EYA1 with each sequence-verified
    natural product at matched abundance. Compare wild type, catalytic-site mutants and SIX-binding separation-of-function
    mutants after verifying folding and localization. Measure SIX/EYA1 occupancy, nascent transcription
    and phosphotyrosine changes at selected endogenous targets to distinguish catalytic and noncatalytic
    contributions.
  experiment_type: Product-resolved rescue and transcriptional analysis
- hypothesis: EYA1-dependent H2AX tyrosine dephosphorylation contributes to repair regulation, while the
    degree of dependence on EYA3 varies with cellular context.
  description: Independently deplete EYA1 and EYA3, singly and together, in matched human cell models
    and rescue with sequence-verified wild-type or catalytic-site variants. Following a defined DNA-damage
    pulse, quantify H2AX-pTyr142 and pSer139, recruitment of repair factors, completed-break-repair kinetics
    and apoptosis. Use the paired chemical and repair endpoints to separate histone-state regulation from
    any claimed execution of strand repair.
  experiment_type: Factor-specific damage-response kinetics and rescue
