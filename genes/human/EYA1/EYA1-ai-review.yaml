    label: protein serine/threonine phosphatase activity
  evidence_type: EXP
  original_reference_id: PMID:19234442
  qualifier: enables
  review:
    summary: Protein serine/threonine phosphatase activity attributed to EYA1 from Cook et al. 2009, which in fact
      used a pSer H2AX tail peptide as a negative comparison for the tyrosine-specific activity of the Eya domain.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited paper reports that the Eya catalytic domain had minimal activity toward serine-phosphorylated
      H2AX peptide and states that Eya acts primarily as a tyrosine phosphatase in vivo; dual specificity was only
      seen in early synthetic-peptide assays. Ser/Thr phosphatase activity is therefore at best a minor in vitro
      property of EYA1 and should not be represented as one of its functions. Not REMOVE because curators may have
      relied on data not visible in the main text.
    supported_by:
    - reference_id: PMID:19234442
      supporting_text: showed minimal activity toward a serine phosphorylated tail peptide
    - reference_id: PMID:19234442
      supporting_text: subsequent data has indicated that, in-vivo, Eya primarily functions as a tyrosine phosphatase
