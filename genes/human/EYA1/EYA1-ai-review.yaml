    label: nucleus
  supported_by:
  - reference_id: PMID:19497856
    supporting_text: As a complex, the SIX and EYA proteins are believed to form a bipartite transcription
      factor where SIX confers DNA binding and EYA confers transactivation activity.
  - reference_id: PMID:10490620
    supporting_text: Coexpression of Six2, Six4, or Six5 induced nuclear translocation of Eya1, Eya2,
      and Eya3, which were otherwise distributed in the cytoplasm.
  - reference_id: PMID:14628042
    supporting_text: The phosphatase function of Eya switches the function of Six1-Dach from repression
      to activation, causing transcriptional activation through recruitment of co-activators.
