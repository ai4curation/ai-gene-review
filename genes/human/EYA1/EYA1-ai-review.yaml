core_functions:
- description: Coactivates transcription with SIX homeodomain factors, which provide sequence-specific
    DNA recognition and promote EYA1 nuclear accumulation. Mouse Eya1/Six reporter assays and human EYA1–SIX1
    association support this conserved nuclear function; the reporter constructs are not equated with
    all three natural human products.
