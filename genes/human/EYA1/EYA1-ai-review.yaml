  - reference_id: PMID:32296183
- description: Catalyzes protein tyrosine dephosphorylation, including removal of H2AX Tyr142 phosphorylation
    after DNA damage. This histone-state change supports chromatin regulation and a repair-permissive
    response; EYA1 affinity-isolate activity, endogenous human knockdown and damage-site localization
    establish its contribution without assigning Eya3-specific recruitment experiments or DNA strand-restoration
    chemistry to EYA1.
