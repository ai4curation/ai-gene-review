    action: MODIFY
    reason: PMID:19234442 places Eya1 at irradiated nuclear foci and shows EYA1-dependent H2AX tyrosine
      dephosphorylation. The mechanistic work connects the H2AX phosphorylation state to repair-versus-apoptotic
      factor binding; this supports positive regulation of DNA repair more precisely than a claim that
      EYA1 performs the strand-restoration chemistry. No EYA1-specific completed-break-repair kinetic
      or ligation assay was inspected. Detailed I-PpoI ChIP, S219 mutation, MDC1 knockdown and the plotted
      rescue assays are Eya3-specific; the main text separately reports murine Eya1 rescue in an uninspected
      supplement. GO:0045739 is a regulatory refinement, not asserted to be an is_a descendant of GO:0006302.
    supported_by:
