  review:
    summary: EYA1-associated threonine phosphatase activity is positive, but intrinsic human EYA1 catalysis
      is unresolved.
    action: UNDECIDED
    reason: The inherited negative excerpts describe the bacterial Eya3 C-terminal fragment tested against
      pSer139-H2AX in Figure 4F of PMID:19234442; they do not demonstrate inactivity of full-length EYA1.
      FLAG-EYA1 preparations dephosphorylate pThr58-Myc and endogenous human EYA1 perturbation changes
      that phosphorylation state (PMID:27795300). Human EYA1 also co-isolates with PP2A-C and pThr activity
      in PMID:29535359, although the decisive PP2A-dependence experiments use mouse Eya3. Conversely,
      PMID:33472197 reports multistep-purified full-length Eya1 activity on aPKC-pThr410, a catalytic-mutant
      comparison and no detectable B55alpha in the active preparation; Figure S6 includes a positive insect-cell
      lysate control. Its S2/Sf9 and D327A/D328A wording and unspecified construct accession leave exact
      product attribution unresolved. These competing preparation and catalyst-assignment results warrant
      uncertainty about intrinsic human EYA1 Ser/Thr catalysis, not an activity-negative conclusion or
      automatic transfer of the Eya3 mechanism.
