id: Q99502
gene_symbol: EYA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EYA1 is a transcriptional coactivator and an aspartate-based protein tyrosine phosphatase
  of the haloacid dehalogenase superfamily. It associates with SIX homeodomain transcription factors,
  which provide DNA-sequence recognition and promote its nuclear accumulation. EYA1 contributes to developmental
  gene regulation and formation of the inner ear, kidney and branchial structures; pathogenic EYA1 variants
  cause branchio-oto-renal and branchio-otic syndromes. In the DNA-damage response, EYA1 promotes removal
  of the Tyr142 phosphate from histone H2AX, altering the histone state toward repair-factor engagement
  and cell survival. The protein occurs in both nuclear and cytoplasmic compartments.
