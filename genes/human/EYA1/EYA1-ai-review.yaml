suggested_questions:
- question: Which endogenous substrates, other than H2AX pY142 and autodephosphorylation, does the EYA1 tyrosine
    phosphatase act on during SIX1-dependent transcriptional activation, and is the phosphatase required at every
    SIX1-EYA1 target?
- question: Is the reported serine/threonine phosphatase activity of EYA proteins physiologically relevant for EYA1,
    or restricted to in vitro peptide assays (and to EYA3 via PP2A association)?
- question: Should human EYA1 be used to represent the Eya node of the retinal determination network, given that
    its loss-of-function phenotypes are otic/renal/branchial and only rarely ocular?
suggested_experiments:
- description: Knock-in of a catalytically dead EYA1 (D323A-equivalent) in mouse or human kidney organoids to separate
    phosphatase-dependent from scaffold/coactivator-dependent functions in metanephric and otic development.
- description: Phosphoproteomics of EYA1 wild-type versus phosphatase-dead cells to identify physiological pTyr
    (and any pSer/pThr) substrates.
