id: Q5SW96
gene_symbol: LDLRAP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LDLRAP1 (ARH) is a cargo-selective clathrin-associated sorting protein (CLASP) that couples
  the low-density lipoprotein receptor and other LDLR-family receptors (VLDLR, LRP2/megalin) to the clathrin
  endocytic machinery. Its N-terminal PID/PTB domain binds the FxNPxY internalization motif in the receptor
  cytoplasmic tail, while separate C-terminal motifs bind clathrin and the beta2-adaptin subunit of the
  AP-2 complex, and it binds phosphatidylinositol-4,5-bisphosphate; together these couple cargo capture
  to clathrin-coated pit assembly at the plasma membrane. It is required for efficient LDLR endocytosis
  in the liver and other polarized cells, and loss-of-function mutations cause autosomal recessive hypercholesterolemia.
