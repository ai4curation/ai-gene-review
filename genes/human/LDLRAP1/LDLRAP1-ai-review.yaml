core_functions:
- description: 'Clathrin-cargo adaptor (CLASP): LDLRAP1 couples the LDL receptor to the clathrin endocytic
    machinery, binding clathrin via a clathrin-box motif and the beta2-adaptin subunit of AP-2 via a C-terminal
    appendage-binding motif, and binding PtdIns(4,5)P2 to couple cargo capture to coated-pit assembly.'
  molecular_function:
