    label: receptor-mediated endocytosis involved in cholesterol transport
  - id: GO:0034383
    label: low-density lipoprotein particle clearance
  supported_by:
  - reference_id: PMID:15728179
    supporting_text: The carboxyl-terminal half of ARH contains a clathrin-binding sequence and a separate
      AP-2 adaptor binding region providing a plausible mechanism for how ARH can act as an endocytic
      adaptor or CLASP (clathrin-associated sorting protein) to couple LDL receptors with the clathrin
      machinery.
  - reference_id: PMID:12221107
    supporting_text: These data are consistent with the hypothesis that ARH functions as an adaptor protein
      that couples LDLR to the endocytic machinery.
- description: 'Cargo recognition: the N-terminal PID/PTB domain reads the FxNPxY (NPVY) internalization
    motif in the cytoplasmic tail of the LDL receptor, selecting it as endocytic cargo.'
