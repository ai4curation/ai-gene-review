id: P52735
gene_symbol: VAV2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'VAV2 is a broadly expressed cytoplasmic VAV-family Rho/Rac guanine nucleotide exchange factor.
  It is recruited and phosphorylated downstream of receptor tyrosine kinases, EphA receptors, Fc receptors
  and other surface receptors, where its SH2, PH and DH domains couple phosphotyrosine and phosphoinositide
  signals to activation of Rac/Rho-family GTPases and cytoskeletal remodeling.'
alternative_products:
- name: '1'
  id: P52735-1
- name: '2'
  id: P52735-2
  sequence_note: VSP_034900, VSP_034901
- name: '3'
  id: P52735-3
  sequence_note: VSP_034900, VSP_034901, VSP_034902
