suggested_questions:
- question: Which endogenous Rho-family GTPase substrates dominate VAV2
    signalling in each receptor and cell-type context?
  experts: []
suggested_experiments:
- description: Compare purified, phosphorylated full-length VAV2 against RAC1,
    RAC2, RAC3, RHOA, RHOB, RHOC, RHOG and CDC42 in matched nucleotide-exchange
    assays, and repeat with receptor-specific phosphorylated adaptor scaffolds
    where available.
  experiment_type: substrate-specific GEF assay
