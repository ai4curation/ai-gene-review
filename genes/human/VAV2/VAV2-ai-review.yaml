    reason: intracellular signal transduction is true only as a very broad
      parent of the accepted VAV-family GEF signalling role. The review keeps
      small GTPase-mediated signal transduction and regulation of small
      GTPase-mediated signal transduction, which state the relevant signalling
      axis more informatively.
