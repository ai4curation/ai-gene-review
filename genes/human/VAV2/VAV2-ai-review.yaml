- term:
    id: GO:0071466
    label: cellular response to xenobiotic stimulus
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9751201
  qualifier: involved_in
  review:
    summary: The azathioprine Reactome event is a drug-action context, not a normal VAV process.
    action: MARK_AS_OVER_ANNOTATED
    reason: Reactome models 6-thio-GTP incorporation into RAC1 as presumably VAV-mediated. That
      supports VAV-family RAC1 exchange chemistry only speculatively and in a xenobiotic drug-action
      setting, so cellular response to xenobiotic stimulus overstates VAV as a native participant in
      this process.
    supported_by:
    - reference_id: Reactome:R-HSA-9751201
      supporting_text: can block RAC1 activity by binding to it instead of GTP (presumably mediated
        by VAV proteins)
