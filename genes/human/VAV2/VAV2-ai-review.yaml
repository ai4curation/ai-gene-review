core_functions:
- description: VAV2 is a broadly expressed VAV-family GEF that couples receptor
    tyrosine kinase and cytoskeletal signals to Rho-family GDP-GTP exchange,
    with curated Reactome support for RhoA, RhoB and RhoG activation and
    contextual evidence for Rac1 and Cdc42.
