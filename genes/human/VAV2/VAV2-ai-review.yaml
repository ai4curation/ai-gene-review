  qualifier: involved_in
  review:
    summary: Fc-gamma receptor-mediated phagocytosis is a myeloid context that recruits VAV GEF
      activity.
    action: KEEP_AS_NON_CORE
    reason: Fc-gamma receptor signaling pathway involved in phagocytosis is a biologically plausible
      receptor or cytoskeletal context for VAV-family Rho GTPase exchange, but it is downstream and
      context-specific relative to the core cytoplasmic GEF activity.
