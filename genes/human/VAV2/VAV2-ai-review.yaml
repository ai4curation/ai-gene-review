      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: InterPro:IPR001331
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The Dbl-homology/RhoGEF signature supports Rho-family GEF
          signalling, but GO:0035556 is too broad once specific small-GTPase
          signalling is asserted.
