- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q60992
  - ensembl:ENSMUSP00000062782
  review:
    summary: Accepted receptor-proximal plasma membrane recruitment.
    action: ACCEPT
    reason: Activated VAV proteins are recruited from the cytosol to membrane
      receptor complexes and PIP3-rich membrane sites. The plasma membrane row
      captures this receptor-proximal activation compartment.
    supported_by:
    - &id005
      reference_id: Reactome:R-HSA-9666435
      supporting_text: VAV proteins are also recruited to membrane through their
        PH domain by binding PI(3,4,5)P3 produced by PI3K
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:Q60992
        source_status: SUPPORTS_TRANSFER
        comment: Orthology or signature support is consistent with the reviewed
          VAV-family domain architecture.
      - source_id: ensembl:ENSMUSP00000062782
        source_status: SUPPORTS_TRANSFER
        comment: Orthology or signature support is consistent with the reviewed
          VAV-family domain architecture.
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: TAS
  original_reference_id: PMID:7762982
  qualifier: involved_in
  review:
    summary: signal transduction is too broad beside accepted VAV small-GTPase
      signalling.
    action: TOO_GENERAL
    reason: signal transduction is true only as a very broad parent of the
      accepted VAV-family GEF signalling role. The review keeps small
      GTPase-mediated signal transduction and regulation of small
      GTPase-mediated signal transduction, which state the relevant signalling
      axis more informatively.
- term:
    id: GO:0007264
    label: small GTPase-mediated signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:102718
  - MGI:MGI:1888518
  - PANTHER:PTN005252413
  review:
    summary: Accepted small GTPase-mediated signalling.
    action: ACCEPT
    reason: VAV proteins signal by exchanging GDP for GTP on Rho/Rac-family
      small GTPases, so small GTPase-mediated signal transduction is the correct
      biological-process abstraction of the core GEF activity.
    supported_by:
    - reference_id: file:interpro/panther/PTHR45818/PTHR45818-paint.tsv
      supporting_text: "PTHR45818\tPTN005252413\tGO:0007264\tP\tIBD\tfalse"
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN005252413
        source_status: SUPPORTS_TRANSFER
        comment: VAV proteins signal by exchanging GDP for GTP on Rho/Rac-family
          small GTPases, so small GTPase-mediated signal transduction is the
          correct biological-process abstraction of the core GEF activity.
- term:
    id: GO:0009410
    label: response to xenobiotic stimulus
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00092608
  review:
    summary: The xenobiotic-response term overstates a speculative azathioprine
      context.
    action: MARK_AS_OVER_ANNOTATED
    reason: The ARBA xenobiotic row is best explained by VAV participation in
      the Reactome azathioprine/6TGTP model. That model is a drug-specific
      context and says 6TGTP loading is presumably mediated by VAV proteins, so
      response to xenobiotic stimulus is over-annotated for this gene product.
- term:
    id: GO:0016477
    label: cell migration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0040068
  - MGI:MGI:102718
  - MGI:MGI:1888518
  - MGI:MGI:98923
  - PANTHER:PTN001106898
  review:
    summary: Cell migration is a downstream actin-remodelling context for VAV
      GEF activity.
    action: KEEP_AS_NON_CORE
    reason: Reactome curates tyrosine-phosphorylated VAVs as RAC1 GEFs in a
      PIP3-bound complex and notes that RAC1 is a key regulator of the actin
      cytoskeleton and cell migration. That supports the PAINT-transferred
      migration row as a downstream actin-remodelling context rather than the
      core cytoplasmic GEF activity.
    supported_by:
    - reference_id: file:interpro/panther/PTHR45818/PTHR45818-paint.tsv
      supporting_text: "PTHR45818\tPTN001106898\tGO:0016477\tP\tIBD\tfalse"
    - reference_id: Reactome:R-HSA-8951586
      supporting_text: RAC1 is a key regulator for actin cytoskeleton and cell
        migration
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN001106898
        source_status: SUPPORTS_TRANSFER
        comment: PTN001106898 is seeded by fly Vav and three mouse Vav genes,
          supporting a conserved cell-migration/actin-remodelling context
          downstream of the VAV exchange reaction.
