    label: phosphotyrosine residue binding
  evidence_type: IPI
  original_reference_id: PMID:20624904
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6GX35
  review:
    summary: Kept SH2-mediated phosphotyrosine binding.
    action: KEEP_AS_NON_CORE
    reason: The C-terminal SH2 domain lets VAV proteins bind phosphorylated receptors and adaptors.
      That phosphotyrosine-dependent recruitment is a real molecular function, but secondary to the
      core DH-domain GEF activity.
    supported_by: &id002
    - reference_id: PMID:26919541
      supporting_text: tyrosine-phosphorylated PPxY motifs also bind to SH2 domains of Vav2 and Src
