id: P52735
gene_symbol: VAV2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'VAV2 is a broadly expressed cytoplasmic VAV-family Rho/Rac guanine nucleotide
  exchange factor. It is recruited and phosphorylated downstream of receptor tyrosine
  kinases, EphA receptors, Fc receptors and other surface receptors, where its SH2,
  PH and DH domains couple phosphotyrosine and phosphoinositide signals to activation
  of Rac/Rho-family GTPases and cytoskeletal remodeling.'
alternative_products:
- name: '1'
  id: P52735-1
- name: '2'
  id: P52735-2
  sequence_note: VSP_034900, VSP_034901
- name: '3'
  id: P52735-3
  sequence_note: VSP_034900, VSP_034901, VSP_034902
existing_annotations:
- term:
    id: GO:0001784
    label: phosphotyrosine residue binding
  evidence_type: IPI
  original_reference_id: PMID:20624904
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6GX35
  review:
    summary: Kept SH2-mediated phosphotyrosine binding.
    action: KEEP_AS_NON_CORE
    reason: The C-terminal SH2 domain lets VAV proteins bind phosphorylated
      receptors and adaptors. That phosphotyrosine-dependent recruitment is a
      real molecular function, but secondary to the core DH-domain GEF activity.
    supported_by:
    - reference_id: PMID:26919541
      supporting_text: tyrosine-phosphorylated PPxY motifs also bind to SH2
        domains of Vav2 and Src
- term:
    id: GO:0002768
    label: immune response-regulating cell surface receptor signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008462184
  - RGD:3951
  - UniProtKB:Q9UKW4
  review:
    summary: Immune-response receptor signalling is a recurring VAV context but
      not a distinct core activity.
    action: KEEP_AS_NON_CORE
    reason: Reactome places VAV-family RAC1 activation downstream of
      FCGR-mediated phagocytosis, and PTN008462184 transfers immune
      cell-surface receptor signalling from rat Vav1 and human VAV3. This is a
      myeloid receptor-output context rather than the core VAV2 Rho/Rac GEF
      activity.
    supported_by:
    - reference_id: file:interpro/panther/PTHR45818/PTHR45818-paint.tsv
      supporting_text: "PTHR45818\tPTN008462184\tGO:0002768\tP\tIBD\tfalse"
    - reference_id: Reactome:R-HSA-9664422
      supporting_text: Classically, phagocytosis via FCGRs has been associated
        with the subsequent activation of Rac GTPases and Cdc42
    - reference_id: Reactome:R-HSA-9666430
      supporting_text: VAV has been implicated in the activation of RAC1
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN008462184
        source_status: SUPPORTS_TRANSFER
        comment: PTN008462184 is seeded by rat Vav1 and human VAV3
          (UniProtKB:Q9UKW4), not by mouse Vav genes; it supports transfer of
          this non-core immune-receptor context across the human VAV family.
