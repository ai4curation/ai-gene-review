- term:
    id: GO:0006606
    label: protein import into nucleus
  evidence_type: IMP
  original_reference_id: PMID:42754615
  qualifier: involved_in
  review:
    summary: Proposed new annotation. TSLIG2 carries two autonomous nuclear
      localization signals (residues 97-117 and 201-225) and uses them to import the
      rest of the FAM98B-containing tRNA-splicing ligase complex into the nucleus.
      In TSLIG2 knockout cells, endogenously tagged RTCB, RTRAF/CGI-99 and DDX1 are
      lost from the nucleus and accumulate in the cytoplasm; re-expressing wild-type
      TSLIG2 re-imports them, whereas a form that cannot join the complex (delta
      56-69) does not, and point mutations in either NLS's basic clusters abolish
      import. Both NLS segments also drive a heterologous GST-mNG-mNG reporter into
      the nucleus on their own.
    action: NEW
    reason: TSLIG2, not another gene product, performs this step. The NLSs are on
      TSLIG2 and not on RTCB, DDX1, RTRAF or FAM98B, and import of those four tracks
      the presence and integrity of TSLIG2's own basic clusters. This is a carrier
      role for partners, not the necessary-therefore-participating pattern, because
      the rescue is lost by mutating TSLIG2's targeting signal while leaving the rest
      of the protein intact. The comparator check supports the term. Among the 58
      human experimental GO:0006606 annotations, the term is carried not only by
      importins and nucleoporins but by small adaptors that ferry a specific partner
      in, including AKIRIN2 (20S proteasome), HIKESHI (HSP70), HEATR3 (ribosomal
      proteins) and RPAIN (RPA). AKIRIN2 is the closest match in role shape, a small
      protein conferring nuclear import on a large multi-subunit complex, annotated
      involved_in GO:0006606 by IDA. The parent GO:0034504 protein localization to
      nucleus would also fit, but GO:0006606 is the supported specific child since
      the experiments demonstrate directed cytoplasm-to-nucleus movement. IMP rather
      than IDA because the claim rests on the knockout and mutant-rescue series.
    supported_by:
    - reference_id: PMID:42754615
      supporting_text: mNG-RTCB, mNG-CGI-99, and mNG-DDX1 were barely detectable in
        the nucleus of ASW KO cells but rather accumulated in the cytoplasm,
        indicating that ASW is indeed required for the nuclear localization of the
        tRNA-LC
    - reference_id: PMID:42754615
      supporting_text: We therefore conclude that ASW harbors two functional NLSs,
        with NLS1 spanning residues 97–117 and NLS2 spanning residues 201–225
    - reference_id: PMID:42754615
      supporting_text: Expression of FLAG-tagged WT ASW, but not ASW Δ56-69,
        re-imported the tRNA-LC to the nucleus
core_functions:
- description: Nuclear delivery of the tRNA-splicing ligase complex. TSLIG2 joins
    only the FAM98B-containing form of the complex, through an internal segment
    around residues 56-69, and supplies the targeting information the other four
    subunits lack. Its two autonomous, conserved nuclear localization signals
    (residues 97-117 and 201-225, in the basic disordered C-terminal half) import
    the assembled complex to the nucleoplasm, where the tRNA-splicing endonuclease
    has left pre-tRNA exon halves to be joined. This is a spatial function rather
    than a catalytic one. TSLIG2 is dispensable for ligation in vitro, and restoring
    nuclear localization by any other route, overexpressing FAM98C or appending a
    heterologous NLS to RTCB, substitutes for it.
  proposed_molecular_function: nuclear localization signal-bearing subunit activity
  directly_involved_in:
  - id: GO:0006606
    label: protein import into nucleus
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0072669
    label: tRNA-splicing ligase complex
  supported_by:
  - reference_id: PMID:42754615
    supporting_text: ASW, which exclusively binds to FAM98B-containing tRNA-LC,
      enables the nuclear localization of the complex through two independent,
      conserved NLSs.
  - reference_id: PMID:42754615
    supporting_text: ASW is not required for the activity of the tRNA-LC in vitro
  - reference_id: PMID:42754615
    supporting_text: Restoring the nuclear localization of the tRNA-LC through other
      means than ASW, either FAM98C overexpression or adding an NLS to RTCB, also
      rescued pre-tRNA splicing, indicating that nuclear localization of the tRNA-LC,
      independently of how it is achieved, is what matters for efficient pre-tRNA
      splicing.
  knowledge_gaps:
  - gap_statement: The nuclear import receptor that recognises the TSLIG2 NLSs is
      unidentified, so the molecular step immediately downstream of the targeting
      signal is unknown. No karyopherin has been shown to bind TSLIG2, and it is
      not established whether the two NLSs are read by the same receptor or by
      different ones.
    boundary: The NLS positions are mapped to single-residue resolution (residues
      97-117 and 201-225), each segment drives a heterologous reporter into the
      nucleus on its own, and mutating the basic clusters in either one impairs
      import of the complex. What is established is therefore the signal, not the
      reader; PMID:42754615 mapped the NLSs by prediction plus mutagenesis and did
      not assay receptor binding.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: Without the receptor, TSLIG2 cannot be given an existing
      molecular-function term. GO:0061608 nuclear import signal receptor activity
      describes the protein that reads an NLS, which TSLIG2 is not, and GO:0030674
      protein-macromolecule adaptor activity would require showing that TSLIG2
      bridges the complex to a second macromolecule. Identifying the karyopherin
      would decide between an adaptor description and a simple cargo-with-signal
      description, and would say whether import is a regulated step.
    resolution: Pull-downs or proximity labelling from nuclear and cytoplasmic
      fractions against the karyopherin-alpha family and the importin-beta and
      transportin family, with the NLS point mutants as negative controls, followed
      by in vitro import assays in permeabilised cells reconstituted with the
      candidate receptor.
- description: Participation in pre-tRNA splicing as part of the tRNA-splicing ligase
    complex. TSLIG2 does not catalyse the ligation and makes no contribution to the
    chemistry, but it is required for the reaction to proceed efficiently in cells
    because the complex must be in the nucleus to meet its substrate. Loss of TSLIG2
    causes accumulation of unligated fragments carrying 5-prime leader and 5-prime
    exon sequence, phenocopying chemical inhibition of the complex, without reducing
    the steady-state level of mature spliced tRNAs or perturbing cell growth. The
    cytoplasmic activity of the same complex, XBP1-mRNA splicing during the unfolded
    protein response, is unaffected.
  directly_involved_in:
  - id: GO:0006388
    label: tRNA splicing, via endonucleolytic cleavage and ligation
  locations:
  - id: GO:0005654
    label: nucleoplasm
  in_complex:
    id: GO:0072669
    label: tRNA-splicing ligase complex
  supported_by:
  - reference_id: PMID:42754615
    supporting_text: Indeed, we also detected accumulation of 5’ tRNA fragments in
      ASW KO cells, similar to those detected upon inhibition of the tRNA-LC with
      menadione
  - reference_id: PMID:42754615
    supporting_text: However, the defect was milder than in FAM98B KO cells, as we
      did not observe a decrease in the levels of mature, spliced tRNAs
  - reference_id: file:human/TSLIG2/TSLIG2-uniprot.txt
    supporting_text: Accessory subunit of the tRNA-splicing ligase complex that
      acts by directly joining spliced tRNA halves to mature-sized tRNAs by
      incorporating the precursor-derived splice junction phosphate into the
      mature tRNA as a canonical 3',5'-phosphodiester.
proposed_new_terms:
- proposed_name: nuclear localization signal-bearing subunit activity
  proposed_definition: The activity of a protein that confers nuclear localization
    on a protein complex of which it is a subunit, by carrying within its own
    sequence the nuclear localization signal that directs import of the assembled
    complex. The signal-bearing subunit is distinguished from a nuclear import
    signal receptor, which recognises a signal borne by a separate cargo, and from
    a simple cargo protein, whose own import does not determine the localization of
    other proteins.
  justification: GO currently offers no molecular-function term for this role, which
    leaves the one characterised activity of TSLIG2 unannotatable. GO:0061608 nuclear
    import signal receptor activity is defined as combining with a nuclear import
    signal on a cargo to be transported, which is the converse situation, since
    TSLIG2 carries the signal rather than reading one. GO:0030674
    protein-macromolecule adaptor activity would require demonstrating that TSLIG2
    bridges the complex to a second macromolecule, and the import receptor has not
    been identified. GO:0008565 protein transporter activity, the term that might
    once have served, is obsolete. The role is not unique to TSLIG2, since AKIRIN2
    and HIKESHI occupy comparable positions for the 20S proteasome and HSP70
    respectively, so a term would have more than one user. If the GO editors prefer
    to handle this with GO:0030674 once a receptor is known, that is a reasonable
    outcome and the proposal can be withdrawn.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: PMID:42754615
    supporting_text: ASW, which exclusively binds to FAM98B-containing tRNA-LC,
      enables the nuclear localization of the complex through two independent,
      conserved NLSs.
  - reference_id: PMID:42754615
    supporting_text: We further tested whether the identified NLSs of ASW can
      localize an NLS reporter construct (GST-mNG-mNG) to the nucleus and found that
      both tested regions, ASW 97–117 and 201–225, can independently act as NLSs
knowledge_gaps:
- gap_statement: What the FAM98A- and FAM98C-containing tRNA-splicing ligase
    complexes do is unknown. TSLIG2 is excluded from both, so whatever role those
    subpopulations have is one that this gene product does not serve, and the
    division of labour between the three FAM98-defined complexes is undetermined.
  boundary: All three FAM98 paralogs are known to assemble alternatively into the
    complex, FAM98A-containing complexes are cytoplasmic and FAM98B-containing ones
    nuclear, and only loss of FAM98B impairs pre-tRNA splicing. What they are for
    beyond localization is open.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: It bears directly on how much of TSLIG2's exclusivity for FAM98B
    matters. If the three complexes have distinct substrate repertoires rather than
    merely distinct addresses, then TSLIG2 selects a functional subpopulation and not
    just a destination.
  resolution: Substrate profiling of each complex separately, by immunoprecipitating
    FLAG-tagged FAM98A, FAM98B and FAM98C and sequencing the bound and ligated RNAs,
    paired with growth and stress phenotyping of the single and combined knockouts.
- gap_statement: How invertebrates import their tRNA-splicing ligase complex into
    the nucleus is unknown. They lack any TSLIG2 orthologue, yet pre-tRNA splicing
    is nuclear across animals, so an unidentified alternative targeting mechanism
    must exist.
  boundary: The ASHWIN family is restricted to vertebrates across 812 metazoan
    genomes, while RTCB, DDX1, RTRAF/CGI-99 and FAM98B occur throughout metazoans;
    nuclear pre-tRNA splicing is established in vertebrates.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: It would reveal whether the vertebrate solution replaced an older
    mechanism or added a regulatory layer on top of one, which determines how the
    TSLIG2 annotation should be read evolutionarily and whether an IBA from the
    ASHWIN node could ever extend beyond vertebrates.
  resolution: Localise the complex in a tractable invertebrate (Drosophila or
    C. elegans) and test candidate NLSs in the conserved subunits, by reporter assay
    and by CRISPR knock-in of NLS mutants.
- gap_statement: Whether mitotic phosphorylation of TSLIG2 regulates import of the
    complex is untested. The protein is phosphorylated on Ser-182, Ser-184, Ser-189,
    Ser-193, Thr-197 and Thr-198, immediately upstream of NLS2 (residues 201-225),
    but no functional consequence has been assayed.
  boundary: The phosphosites themselves are solid, reported across six independent
    phosphoproteomic datasets curated by UniProt, several of them explicitly mitotic.
    The NLS positions are mapped. Nothing connects the two.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Nuclear envelope breakdown in mitosis makes NLS-driven import
    meaningless for part of the cell cycle, so a phospho-switch beside NLS2 is a
    plausible mechanism for cell-cycle control of pre-tRNA splicing. If real, it
    would add a regulatory dimension absent from the current annotation.
  resolution: Phospho-mimetic and phospho-null substitutions at Ser-189, Ser-193,
    Thr-197 and Thr-198 in the endogenous locus, scored for complex localization by
    live imaging of tagged DDX1 through the cell cycle and for 5-prime tRNA fragment
    accumulation by northern blot.
suggested_questions:
- question: Which karyopherin reads the TSLIG2 NLSs, and are the two signals
    redundant or do they engage different receptors? The published data show partial
    rescue by single-NLS mutants, which is consistent with either.
  experts:
  - nucleocytoplasmic transport
- question: Should GO record the substrate-side relationship here at all, or is the
    has-input mechanism on the import receptor the right place once that receptor is
    known? Asked because TSLIG2 is simultaneously cargo and carrier, and the
    annotation proposed here (involved_in GO:0006606) rests on the carrier role.
  experts:
  - GO editorial
- question: The InterPro IPR024887 to GO:0048598 mapping propagates a Xenopus
    morphant phenotype to every Ashwin-domain protein. Is that mapping still wanted
    now that the family has a characterised molecular role, or should it be retired
    at the InterPro end rather than being marked over-annotated gene by gene?
  experts:
  - InterPro2GO
  - GO editorial
- question: Does TSLIG2 have any function outside the tRNA-splicing ligase complex?
    The delta 56-69 mutant that cannot join the complex is available and behaves as
    a clean null for the known function, which makes the question testable.
  experts:
  - tRNA biology
suggested_experiments:
- description: Identify the import receptor for TSLIG2 by proximity labelling
    (TurboID fused to TSLIG2) in cytoplasmic fractions, comparing wild-type with the
    NLS1 and NLS2 point mutants so that receptor candidates are scored by their
    dependence on an intact signal. Confirm hits by in vitro nuclear import assays in
    permeabilised cells reconstituted with the candidate receptor.
  hypothesis: One or both TSLIG2 NLSs are read by a karyopherin-alpha family member,
    which together with importin-beta imports the assembled FAM98B-containing complex.
  experiment_type: proximity labelling plus in vitro reconstitution
- description: Knock phospho-null and phospho-mimetic alleles of the Ser-189,
    Ser-193, Thr-197 and Thr-198 cluster into the endogenous TSLIG2 locus and follow
    endogenously tagged DDX1 through mitosis by live imaging, with northern blots for
    5-prime tRNA fragments as the functional readout.
  hypothesis: Mitotic phosphorylation immediately upstream of NLS2 suppresses import
    of the complex while the nuclear envelope is absent, coupling pre-tRNA splicing to
    the cell cycle.
  experiment_type: endogenous allele series plus live imaging
- description: Separate the three tRNA-LC populations and profile their RNA
    substrates, by immunopurifying FAM98A-, FAM98B- and FAM98C-containing complexes
    from the same cells and sequencing associated and ligated RNAs.
  hypothesis: TSLIG2's exclusivity for FAM98B selects a destination only, and the
    three complexes share one substrate repertoire; the alternative is that each
    paralog confers distinct substrate preference.
  experiment_type: complex immunopurification plus RNA sequencing
- description: Ask how invertebrates, which have no ASHWIN orthologue, localise the
    complex, by imaging tagged RTCB and DDX1 in Drosophila cells and testing the
    conserved subunits' candidate basic clusters in a heterologous NLS reporter.
  hypothesis: An NLS carried by one of the conserved subunits serves the role that
    TSLIG2 took over in vertebrates.
  experiment_type: comparative cell biology
