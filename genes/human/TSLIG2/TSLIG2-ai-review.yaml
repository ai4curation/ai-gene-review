description: TSLIG2 (Ashwin/ASW, formerly C2orf49) is a small, largely disordered,
  vertebrate-specific accessory subunit of the tRNA-splicing ligase complex (tRNA-LC),
  the machine that joins the two exon halves left behind when the tRNA-splicing
  endonuclease excises an intron from a pre-tRNA. The complex is built around the
  catalytic ligase RTCB together with DDX1, RTRAF/CGI-99 and a FAM98 paralog; TSLIG2
  joins only the FAM98B-containing form. TSLIG2 has no catalytic domain and is not
  required for ligation chemistry in vitro. Its distinctive contribution is spatial
  rather than chemical. It carries two autonomous, conserved nuclear localization
  signals (residues 97-117 and 201-225) in its basic, disordered C-terminal half,
  and these signals import the whole FAM98B-containing complex into the nucleus,
  where pre-tRNA splicing occurs. Cells lacking TSLIG2 retain the complex in the
  cytoplasm and accumulate unligated 5-prime tRNA fragments, a defect rescued by
  re-expressing TSLIG2 but not by a form unable to join the complex, and equally
  rescued by importing the complex some other way. The cytoplasmic activity of the
  same complex, splicing of XBP1 mRNA during the unfolded protein response, proceeds
  normally without TSLIG2 and is served instead by FAM98A-containing complexes. The
  protein is heavily phosphorylated during mitosis on serines and threonines flanking
  the second localization signal.
