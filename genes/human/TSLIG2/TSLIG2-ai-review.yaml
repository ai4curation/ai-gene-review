- id: PMID:42754615
  title: Ashwin and FAM98 paralogs define nuclear and cytoplasmic RNA ligase complexes
    for tRNA biogenesis.
  findings:
  - statement: TSLIG2/ASW is restricted to vertebrates, while the other four core
      subunits of the tRNA-splicing ligase complex are found throughout metazoans.
      The FAM98 expansion into three paralogs happened concurrently.
    supporting_text: While RTCB, DDX1, CGI-99, and FAM98B – core subunits of the
      tRNA-LC – occur widely throughout metazoans, ASW appears restricted to
      vertebrates
  - statement: TSLIG2 assembles only into FAM98B-containing complexes, which is why
      only those reach the nucleus.
    supporting_text: With ASW assembling into the tRNA-LC in exclusive association
      with FAM98B
  - statement: TSLIG2 is required for nuclear localization of the whole complex.
      Endogenously tagged RTCB, RTRAF/CGI-99 and DDX1 leave the nucleus and
      accumulate in the cytoplasm in TSLIG2 knockout cells.
    supporting_text: mNG-RTCB, mNG-CGI-99, and mNG-DDX1 were barely detectable in
      the nucleus of ASW KO cells but rather accumulated in the cytoplasm,
      indicating that ASW is indeed required for the nuclear localization of the
      tRNA-LC
  - statement: Two autonomous nuclear localization signals in TSLIG2, at residues
      97-117 and 201-225, mediate the import, and each works on a heterologous
      reporter by itself.
    supporting_text: We therefore conclude that ASW harbors two functional NLSs,
      with NLS1 spanning residues 97–117 and NLS2 spanning residues 201–225
  - statement: Loss of TSLIG2 causes accumulation of unligated 5-prime tRNA
      fragments, phenocopying chemical inhibition of the complex, and the rescue
      requires TSLIG2's association with the complex.
    supporting_text: indicating that ASW supports pre-tRNA splicing via its
      association with the tRNA-LC
  - statement: Nuclear localization, however achieved, is what the pre-tRNA splicing
      reaction needs. TSLIG2 itself is replaceable by other routes to the nucleus and
      is not required for ligation chemistry in vitro.
    supporting_text: Restoring the nuclear localization of the tRNA-LC through other
      means than ASW, either FAM98C overexpression or adding an NLS to RTCB, also
      rescued pre-tRNA splicing, indicating that nuclear localization of the tRNA-LC,
      independently of how it is achieved, is what matters for efficient pre-tRNA
      splicing.
  - statement: The cytoplasmic arm of the complex's work, XBP1-mRNA splicing during
      the unfolded protein response, does not need TSLIG2, and knockout cells grow
      normally.
    supporting_text: As in FAM98B KO cells, XBP1-mRNA splicing remained unaffected in
      ASW KO cells (Fig. 3C) and we did not observe anomalies in cell growth
  - statement: What the FAM98A- and FAM98C-containing complexes do remains unresolved
      by the authors' own account.
    supporting_text: While we have unveiled a function of the FAM98B/ASW-containing
      tRNA-LC, the roles of the other tRNA-LC populations remain partially unclear.
  - statement: How invertebrates, which lack TSLIG2, achieve nuclear localization of
      the complex is an open question.
    supporting_text: In turn, it remains to be determined how nuclear localization of
      the tRNA-LC is achieved in invertebrates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMC-verified (PMC13586215, Nat Commun 2026, volume 17, article
      9882); full text cached. This is the paper that assigns TSLIG2 its first
      molecular role and the source of the NEW GO:0006606 proposal, the core
      functions and most of the knowledge gaps. It is the paper behind the litscan
      module-member issue 3089.
- id: PMID:16680723
  title: Novel gene ashwin functions in Xenopus cell survival and anteroposterior
    patterning.
  findings:
  - statement: The original Xenopus laevis characterisation of ashwin, by expression
      pattern plus morpholino knockdown and overexpression. It is the source of
      InterPro IPR024887's developmental description and hence of the InterPro2GO
      GO:0048598 embryonic morphogenesis mapping that reaches human TSLIG2.
    supporting_text: Morpholino oligonucleotide-mediated reduction in ashwin
      expression leads to lethality or abnormalities in gastrulation, as well as
      significant apoptosis in midgastrula embryos.
  - statement: The authors' own conclusion is hedged, and they note that no domain
      was recognisable at the time although two nuclear localization signals could
      be spotted in the sequence. Those are the signals PMID:42754615 later validated.
    supporting_text: Ashwin has no previously characterized domains, although two
      nuclear localization signals can be identified.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Dev Dyn 2006, volume 235, pages 1895-907); title
      matches. Correctly cited and scientifically sound for Xenopus, but it is the
      basis of a domain-level electronic transfer of a frog morphant phenotype to the
      human protein, which is why the GO:0048598 row is marked over-annotated.
      Relevance is MEDIUM because the paper is not about the human gene, yet it
      predicted the NLSs that turned out to be the protein's function.
