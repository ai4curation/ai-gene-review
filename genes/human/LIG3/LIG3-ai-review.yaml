    supporting_text: MRN interacts with DNA ligase IIIα/XRCC1, stimulating intermolecular ligation, and
      together these proteins join incompatible DNA ends in a reaction that mimics alt-NHEJ.
  - reference_id: PMID:21655080
    supporting_text: two alt-NHEJ pathways, one that is biased toward microhomology use and requires Lig3
  - reference_id: PMID:26787905
    supporting_text: only deletion of nuclear Lig3, but not Lig1, could significantly reduce the interchromosomal
      translocations in Lig4(-/-) cells
suggested_questions:
- question: In human cells, which nuclear repair events strictly require LIG3alpha rather than LIG1, given
    that nuclear Lig3 is dispensable for viability and for most XRCC1-dependent repair in mouse cells?
- question: Should the IMP row to negative regulation of mitochondrial DNA replication (PMID:21878356)
    be repointed to mitochondrial DNA replication? The paper shows LIG3 knockdown impairs mtDNA replication.
suggested_experiments:
- description: Separation-of-function knock-ins in human cells that abolish either the mitochondrial (first
    ATG) or nuclear (second ATG) LIG3 isoform, with LIG1 depletion, to measure the contribution of nuclear
    LIG3alpha to SSBR, BER and microhomology-mediated end joining.
  experiment_type: genetic separation-of-function analysis
