  review:
    summary: InterPro-based DNA binding. LIG3 binds DNA through its PARP-like zinc finger, DNA-binding
      domain and catalytic core; DNA binding is an intrinsic part of nick sensing and ligation.
    action: KEEP_AS_NON_CORE
    reason: Correct (structural and mutational data show ZnF and DBD nick/end binding), but DNA binding
      here is a component of the ligase mechanism rather than a separate function. No more specific DNA-binding
      term is clearly better supported than the ligase activity itself, so keep as non-core.
    supported_by:
    - reference_id: PMID:20518483
      supporting_text: the ZnF-DNA binding domain (DBD) forms a crescent-shaped surface used for DNA end
        recognition which switches to a ring formed by the nucleotidyl transferase (NTase) and OB-fold
        (OBD) domains for catalysis
