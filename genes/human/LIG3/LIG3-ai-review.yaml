  - reference_id: Reactome:R-HSA-73931
    supporting_text: ligates the two DNA strand fragments, thus completing the base excision repair
  - reference_id: PMID:33087283
    supporting_text: 'The XRCC1 scaffold has been found to support two related DNA repair pathways: base
      excision repair (BER) and single-strand break repair (SSBR), while LIG3 participates in these and
      other pathways including nucleotide excision repair [3] and alternate non-homologous end joining
      (alt-NHEJ) [4].'
