existing_annotations:
- term:
    id: GO:0000724
    label: double-strand break repair via homologous recombination
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-5693538
  qualifier: involved_in
  review:
    summary: Reactome places LIG3 in its Homology Directed Repair pathway, which in Reactome groups homologous
      recombination, single strand annealing and microhomology-mediated end joining (MMEJ). LIG3 participates
      only in the MMEJ branch.
    action: MODIFY
    reason: LIG3 has no demonstrated role in homologous recombination; its inclusion in the Reactome HDR
      pathway derives from the MMEJ sub-pathway, where LIG3:XRCC1 seals the remaining nicks. MMEJ is alternative
      NHEJ, not HR, so the annotation should be moved to GO:0097681 (already carried by the gene via ARBA,
      and supported experimentally).
    proposed_replacement_terms:
    - id: GO:0097681
      label: double-strand break repair via alternative nonhomologous end joining
    supported_by:
    - reference_id: Reactome:R-HSA-5693538
      supporting_text: HDR preferably occurs through the error-free homologous recombination repair (HRR),
        but can also occur through the error-prone single strand annealing (SSA), or the least accurate
        microhomology-mediated end j
    - reference_id: Reactome:R-HSA-5687675
      supporting_text: LIG3:XRCC1 is recruited to MMEJ sites by the MRN complex and ligates single strand
        nicks that remain after reparative DNA synthesis
    - reference_id: PMID:21816818
      supporting_text: MRN interacts with DNA ligase IIIα/XRCC1, stimulating intermolecular ligation,
        and together these proteins join incompatible DNA ends in a reaction that mimics alt-NHEJ.
