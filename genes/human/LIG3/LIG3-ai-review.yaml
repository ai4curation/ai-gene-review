    label: mitochondrial DNA replication
  - id: GO:0043504
    label: mitochondrial DNA repair
  locations:
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:21878356
    supporting_text: These findings support the role of DNA ligase III as the replicative DNA ligase in
      human mtDNA replication
  - reference_id: PMID:24674627
    supporting_text: Overexpression of DNA ligase III in mitochondria improved the rate of overall BER
  - reference_id: PMID:21390132
    supporting_text: we find that the mitochondrial, but not nuclear, Lig3 is required for cellular viability
  - reference_id: PMID:33855352
    supporting_text: The LIG3 gene encodes the only mitochondrial DNA (mtDNA) ligase and therefore plays
      a pivotal role in mtDNA repair and replication.
- description: Nuclear LIG3alpha/XRCC1 nick ligation in short-patch base excision repair and single-strand
    break repair (partly redundant with LIG1).
  molecular_function:
