    supporting_text: We report that TDP1 is sequestered into multi-protein single-strand break repair
      (SSBR) complexes by direct interaction with DNA ligase IIIalpha
- description: Ligase of microhomology-mediated alternative end joining of double-strand breaks, recruited
    with XRCC1 by MRN; contributes to chromosomal translocations, including at deprotected telomeres.
