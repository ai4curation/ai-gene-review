id: P49916
gene_symbol: LIG3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'LIG3 encodes DNA ligase III, an ATP-dependent DNA ligase (EC 6.5.1.1) that seals single-strand
  nicks in duplex DNA through an enzyme-AMP intermediate. It has an N-terminal PARP-type zinc finger that,
  with the DNA-binding domain, senses nicks and DNA ends and hands them to the nucleotidyltransferase/OB-fold
  catalytic core. Alternative translation initiation gives two forms: isoform 1, with an N-terminal mitochondrial
  transit peptide, is imported into mitochondria, where LIG3 is the only DNA ligase and seals Okazaki
  fragments during mtDNA replication and nicks in mitochondrial base excision repair; isoform 3 (LIG3alpha)
  is nuclear and forms a stable BRCT-mediated heterodimer with XRCC1, which imports and stabilizes it.
  Nuclear LIG3alpha/XRCC1 ligates nicks in short-patch base excision and single-strand break repair, can
  complete nucleotide excision repair (alongside LIG1), and is the main ligase of the microhomology-biased
  alternative end-joining pathway of double-strand break repair, being recruited to such breaks by MRN.
  A germ-cell splice form (LIG3beta) lacks the BRCT domain. The mitochondrial function is the essential
  one: nuclear LIG3 is dispensable in mouse cells, where LIG1 can substitute, whereas loss of mitochondrial
  LIG3 depletes mtDNA, and biallelic human LIG3 variants cause a mitochondrial neurogastrointestinal encephalomyopathy-like
  mtDNA depletion syndrome. LIG3 does not take part in V(D)J recombination.'
