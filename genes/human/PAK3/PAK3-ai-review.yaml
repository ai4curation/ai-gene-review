id: O75914
gene_symbol: PAK3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PAK3 encodes a neuronal group I p21-activated serine/threonine kinase that is activated
  by CDC42/RAC binding and autophosphorylation. It phosphorylates atypical MAP kinases and other
  cytoskeletal regulators and contributes to actin filament organization, axonogenesis, dendrite and
  dendritic-spine morphogenesis, and synapse organization.
