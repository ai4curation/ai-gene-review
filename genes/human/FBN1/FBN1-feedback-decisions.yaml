  source_annotation:
    term:
      id: GO:0008201
      label: heparin binding
    evidence_type: IDA
    original_reference_id: PMID:11461921
    qualifier: enables
  previous_action: ACCEPT
  review:
    summary: Native human fibroblast-secreted FBN1 and recombinant human fragments bind heparin in controlled
      solid-phase and affinity-column assays.
    action: KEEP_AS_NON_CORE
    reason: Native human fibroblast-secreted FBN1 and recombinant human fragments bind heparin in controlled
      solid-phase and affinity-column assays. Heparin models a sulfated glycosaminoglycan interaction;
      competition by selected heparan sulfate does not imply equal affinity for every physiological HS
      structure. Retain this positive molecular interaction as non-core. The original study deliberately
      uses heparin as an experimental glycosaminoglycan analog, and competition depends on the sulfation
      and presentation of the heparan-sulfate preparation. This is a supported ligand-specific affinity/modulation
      property, rather than an additional principal activity in the synthesis; it is not rejected or converted
      into a universal physiological heparan-sulfate interaction.
    supported_by:
    - reference_id: PMID:11461921
