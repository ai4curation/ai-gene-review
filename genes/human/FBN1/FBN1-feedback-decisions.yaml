  review:
    summary: 'Retain the IC inference from microfibril structure: the original study supports FBN1 as
      a component of the tissue microfibrillar scaffold contributing to biomechanical properties.'
    action: KEEP_AS_NON_CORE
    reason: 'Retain the IC inference from microfibril structure: the original study supports FBN1 as a
      component of the tissue microfibrillar scaffold contributing to biomechanical properties. GO:0030023
      concerns the matrix''s ability to recoil after stretching, not an isolated-fibril recoil assay.
      This is a structural contribution to elastic matrices, distinct from claiming that FBN1 itself is
      elastin. Retain this true, context-dependent mechanical contribution as non-core while the structural
      core captures the broader scaffold function in both elastic and elastin-free matrices. A separate
      elasticity core would repeat that scaffold contribution rather than identify a separately resolved
      mechanism. This prioritization does not require an isolated-fibril force assay for an IC annotation,
      deny tissue recoil, or make the broader structural activity uninformative.'
    supported_by:
    - reference_id: PMID:8120105
