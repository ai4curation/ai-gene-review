- source_index: 0
  source_annotation:
    term:
      id: GO:0001501
      label: skeletal system development
    evidence_type: IMP
    original_reference_id: PMID:8188302
    qualifier: involved_in
  review:
    summary: Fibrillin-1 contributes to skeletal development by controlling matrix-bound growth-factor availability
      during bone formation.
    action: KEEP_AS_NON_CORE
    reason: The original operative evidence in the human family study PMID:8188302 remains inaccessible; its
      skeletal observation is not independently verified here. The gene-level developmental contribution can
      nevertheless be adjudicated from accessible mechanistic evidence. In PMID:20855508, Fbn1-null mouse osteoblast
      matrices retain less BMP and LTBP-associated material, media contain more available BMP/TGF-beta activity,
      and osteoblast maturation changes without corresponding increases in the ligand transcripts. Pathway-separation
      experiments support matrix sequestration as the contribution to bone formation. This is more than a Marfan
      phenotype or necessity inference. The study also excludes microfibrils as an obligatory mineralization
      substrate; that role is not asserted. Human fibrillin-1 fragments and human bone material in PMID:24039232
      add product-relevant support for regulation of bone-cell differentiation, while its functional assays
      are in mouse systems. Retain skeletal development as non-core with this cross-species and original-source
      limit explicit.
    supported_by:
    - reference_id: PMID:8188302
    - reference_id: PMID:20855508
    - reference_id: PMID:24039232
  methods:
  - Human family genetics; operative original unavailable
  - Independent PMID:20855508 Fbn1-null mouse osteoblast matrix/media BMP measurements, ligand transcripts
    and pathway-separation experiments
  - PMID:24039232 human fragments and bone material; mouse osteoclast assays
