    structures enables self-assembly.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Citation identity checked against the genuine fetched record. Human C-terminal FBN1 fragments
      form disulfide-linked multimers with stronger N-terminal binding than monomers. Last three cbEGF domains
      contribute to the interaction; biochemical binding, DLS/EM and fibroblast matrix competition support
      an assembly mechanism. Multimerization is cell associated in this experiment; autonomous catalytic activity
      is not inferred. The source-fetched correct title explicitly replaces the seed TODO title, preserving
      PMID and annotations. Source guide records the bounded original read and any supplementary limits.
