- description: Calcium coordination by the calcium-binding EGF domains is an intrinsic molecular property of
    mature fibrillin-1 extracellular architecture. Human cbEGF22 and cbEGF23 structures directly resolve coordinated
    calcium, distinguishing this activity from the intermolecular contacts that assemble microfibrils. It is
    not calcium-regulatory signaling or catalysis; the limited local change after calcium removal does not
    establish an intrinsic spring mechanism or the affinity of every repeat.
  molecular_function:
    id: GO:0005509
    label: calcium ion binding
  locations:
