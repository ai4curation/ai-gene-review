- description: The integrin-binding region of mature fibrillin-1 provides adhesive contacts between extracellular
    microfibrils and cells. Its RGD-containing TB4 region and neighboring domains support integrin binding
    and cell adhesion; receptor usage and downstream responses depend on the fragment and cellular context.
    This activity belongs to matrix fibrillin-1 rather than released asprosin.
  molecular_function:
    id: GO:0005178
    label: integrin binding
