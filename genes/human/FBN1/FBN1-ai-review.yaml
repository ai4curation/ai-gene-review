references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Both actual InterPro records map calcium-binding EGF domains/sites to GO:0005509, consistent
      with target UniProt architecture. This verifies the domain inference, not an inaccessible historical
      primary binding experiment or individual residue mechanism.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator judgment
    of sequence similarity
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The two growth-factor regulatory transfers are supported by Fbn1-specific osteoblast sequestration
      evidence, not merely by the paper title or a fibrillin-2 phenotype. Appetite retains the exact mouse
      processed-chain identifier and human raw processed-product sidecar, backed by human ligand in mouse assays;
      a current zero-hit processed-chain QuickGO query does not erase historical provenance.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The five PAINT contexts preserve their ancestral PTN sources. Family and literal node/term
      joins were captured, but topology/MSA recovery failed; phylogenetic placement was not independently reconstructed.
      Human self-donor evidence is valid. Matrix and hormone claims have independent target support; glucose
      metabolism is corrected to hormonal positive regulation, with the original glucogenic reproducibility
      dispute retained.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl
    Compara
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The 28 Ensembl contexts were traced to actual mouse Q61554 or rat G3V9M6 source annotations.
      Decisions distinguish matrix/hormone functions, contextual developmental scope, downstream mutant or
      expression phenotypes, and seven unresolved PMID:12485443 contexts. A donor phenotype is not automatically
      a target molecular role. Orthology is retained exactly; no sequence or donor replacement was made.
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology links
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The source is a logical inference from hormone activity. The broad signal-transduction term
      is redundant with the retained specific GPCR pathway through a verified three-edge is_a path, without
      claiming that GPCR is the only asprosin receptor.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'All five relevant live ARBA rules were inspected. Biological support is assessed independently:
      matrix recoil and contextual ocular/vascular development remain, while basement-membrane scope is unresolved.
      The rule payload does not itself prove a target-specific condition match or causal developmental assay.'
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The four combined-method contexts preserve all ARBA, ortholog and subcellular-location inputs.
      Human microfibrillar/ECM evidence supports structural locations; the soluble osteoclast fragment context
      remains non-core. No rule condition matching beyond the saved rule content is claimed.
- id: PMID:10424889
  title: Ultrastructural distribution of 36-kD microfibril-associated glycoprotein (MAGP-36) in human and bovine
    tissues.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Citation identity checked against the genuine fetched record. Human normal skin from the
      margin of a surgical specimen is distinguished from bovine specimens. Pre-embedding double immunogold
      identifies FBN1 on microfibrils. No complete paper or quantitative particle counting was performed; the
      MAGP36 elastin-interface pattern is not the distribution of all FBN1. Source guide records the bounded
      original read and any supplementary limits.
- id: PMID:11461921
  title: Interactions of fibrillin-1 with heparin/heparan sulfate, implications for microfibrillar assembly.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Citation identity checked against the genuine fetched record. Normal human skin fibroblasts
      secrete FBN1 into conditioned medium; the native secreted protein binds immobilized heparin with BSA
      controls. Human recombinant FBN1 fragments bind heparin by affinity chromatography and solid-phase assays;
      calcium dependence varies by region. Heparin is an experimental analog; highly sulfated heparan sulfate
      competes, but all tissue HS structures are not equivalent. Failed McGill PDF/local HTML and screenshot
      attempts do not constitute a successful PDF read. Source guide records the bounded original read and
      any supplementary limits.
- id: PMID:11886530
  title: Assembly of epithelial cell fibrillins.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Citation identity checked against the genuine fetched record. Abstract positively reports
      FBN1 throughout the lamina densa and human epithelial-cell fibrillin deposition, explicitly addressing
      more than microfibril insertion sites. Do not extrapolate lamina sparing in other tissues/papers to a
      universal negative. Exact original epithelial localization assay remains inaccessible. Source guide records
      the bounded original read and any supplementary limits.
- id: PMID:12429738
  title: Latent transforming growth factor beta-binding protein 1 interacts with fibrillin and is a microfibril-associated
    protein.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Citation identity checked against the genuine fetched record. Recombinant human FBN1 N-terminal
      fragments bind human LTBP1 C-terminal fragments and human LTBP4 C-terminal fragment. Human tissue immunolocalization
      and extracted microfibrils independently support FBN1 as a microfibril component. LTBP1 nonretention
      in extracted microfibrils is not a negative FBN1 result. Partner accession B7ZLY3 maps to human LTBP1
      in the genuine UniProt response; no separately demonstrated natural isoform-specific function is inferred
      from that identifier or Q14766-2. Source guide records the bounded original read and any supplementary
      limits.
- id: PMID:12807887
  title: Cell adhesion to fibrillin-1 molecules and microfibrils is mediated by alpha 5 beta 1 and alpha v
    beta 3 integrins.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Citation identity checked against the genuine fetched record. Human FBN1 PF9/PF11 fragments
      support attachment/spreading of human dermal fibroblasts and other human cell lines. RGD-mutant controls
      and function-blocking alpha5beta1/alphavbeta3 antibodies support integrin-dependent adhesion. Fibronectin-blocking
      controls and early time points distinguish the recombinant FBN1 interaction from an obligatory fibronectin
      bridge. Native microfibrils in the comparison are from bovine fetal aorta; recombinant human FBN1 assays
      are distinct. Bounded recovered operative text, not a complete downloaded original PDF. Source guide
      records the bounded original read and any supplementary limits.
- id: PMID:15062093
  title: Structure of the integrin binding fragment from fibrillin-1 gives new insights into microfibril organization.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Citation identity checked against the genuine fetched record. Human FBN1 cbEGF22-TB4-cbEGF23
      crystal structures directly resolve calcium binding; fragments were expressed/refolded in bacteria. SPR
      uses native human placental alpha-v-beta-3 and alpha-5-beta-1 integrins, with negative fragment/control
      subtraction. Alpha-v-beta-3 binding and differential dissociation are directly measured. The fibrillin-integrin
      complex is a docking model, not an experimentally resolved co-crystal. No alpha-5-beta-1 binding in these
      particular fragments/conditions does not negate binding by other FBN1 constructs in other papers. Source
      guide records the bounded original read and any supplementary limits.
- id: PMID:15131124
  title: MAGP-2 has multiple binding regions on fibrillins and has covalent periodic association with fibrillin-containing
    microfibrils.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Citation identity checked against the genuine fetched record. Both MAGP1 and MAGP2 bind human
      FBN1 N-terminal fragments, so the MAGP2 title does not exclude the MAGP1 context. Human FBN1 constructs
      derive from placental cDNA and are expressed in 293-EBNA cells. Native MAGPs and tissue microfibrils
      are from bovine nuchal ligament; the GOA partners P27424/Q28022 are bovine MFAP2/MFAP5. Species remain
      explicit; no human-human native assay is inferred. Some fragment interactions are assay dependent (SDS-sensitive
      MAGP2 interaction); negative C-terminal fragment results do not negate positive N-terminal binding. Source
      guide records the bounded original read and any supplementary limits.
