- id: PMID:20182440
  title: Antagonistic effect of the matricellular signaling protein CCN3 on TGF-beta- and Wnt-mediated fibrillinogenesis
    in systemic sclerosis and Marfan syndrome.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Citation identity checked against the genuine fetched record. Tsk mouse fibrillin overexpression
      and Smad3 perturbation associate with CCN3 changes; dox-regulated Marfan-like FBN1 construct disrupts
      wild-type fibrillin matrix and lowers CCN3 mRNA dose-dependently (Figure 3 Results, original line 103).
      CCN3 induction directly suppresses fibrillin network assembly without altering FBN1 mRNA/protein levels
      (Figure 6 Results, line 123). GO:0010467 definition is gene sequence conversion into mature RNA/protein;
      downstream CCN3 expression changes do not themselves identify FBN1 as executing those steps. GO:0030199
      refers to collagen-fibril size/arrangement. The source directly measures fibrillin and elastic networks;
      fibrillin is not a synonym for collagen. Do not call the reference wrong-gene: FBN1 is genuinely tested.
      Source guide records the bounded original read and any supplementary limits.'
