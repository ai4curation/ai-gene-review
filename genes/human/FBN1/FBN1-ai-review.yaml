- id: PMID:24039232
  title: Fibrillin-1 directly regulates osteoclast formation and function by a dual mechanism.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Citation identity checked against the genuine fetched record. Soluble human FBN1 N-terminal
      fragments inhibit mouse RAW264.7/marrow osteoclast differentiation; rF31 administration reduces TRAP-positive
      cells in mice. The N-terminal half binds GST-RANKL in a calcium-dependent solid-phase assay; excess RANKL
      reverses its inhibition. The shorter rF23 fragment does not bind RANKL and instead changes calcium/NFATc1
      signaling. Mineral-immobilized N-terminal half does not inhibit differentiation; effects cannot be generalized
      to all assembled matrix. Source guide records the bounded original read and any supplementary limits.
      Additional database scope: Database osteoclast transfers preserve the human-fragment/mouse-assay scope;
      the broad differentiation term is covered by the retained development term through an exact is_a edge.
      No natural active-fragment boundary is established.'
