  review:
    summary: Asprosin is a circulating glucogenic hormone derived from the C terminus of human profibrillin-1.
    action: ACCEPT
    reason: The raw annotation is specifically P35555-PRO_0000436882. PMID:27087445 Methods identify human
      residues 2732–2871 with an N-terminal His tag; this reagent increased glucose output and cAMP/PKA signaling
      in primary mouse hepatocytes, with in vivo mouse and human-plasma evidence. The activity belongs to the
      released asprosin chain, not mature matrix fibrillin-1. Negative replication with other preparations
      in PMID:30879984 and later positive studies require assay/preparation limits, rather than denial of the
      product-specific hormone activity.
