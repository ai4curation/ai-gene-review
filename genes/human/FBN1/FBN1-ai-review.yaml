knowledge_gaps:
- gap_statement: The inspected asprosin reports do not resolve why glucogenic activity differs among recombinant
    preparations and laboratories, including negative mammalian-expression and hydrodynamic-expression experiments.
  boundary: Human asprosin increased hepatocyte cAMP/PKA and glucose output in the 2016 study. The 2019 replication
    report tested several expression and administration approaches, so failed replication cannot be reduced
    to one inactive bacterial His-tagged preparation.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Preparation-dependent activity limits quantitative physiological and receptor comparisons.
  resolution: Compare sequence-verified preparations across laboratories with matched aggregation, modification,
    tag and contaminant measurements and blinded hepatocyte assays.
  provenance:
  - reference_id: PMID:27087445
  - reference_id: PMID:30879984
  - reference_id: PMID:41671088
- gap_statement: The inspected studies do not resolve the relative contributions of the reported OLFR734/OR4M1
    and PTPRF routes to glucogenic signaling by verified human asprosin under matched conditions.
  boundary: The 2019 receptor study used mouse ligand; the 2026 study supplies matched human co-immunoprecipitation
    and a PTPRF mechanism, but unchanged Olfr734 expression does not exclude a GPCR contribution. Its BLI Methods
    attach a PTPRF catalog identifier to the ligand, leaving that human affinity measurement unresolved.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Species, reagent identity and receptor contribution must be separated before assigning a single
    universal pathway.
  resolution: Clarify the BLI reagent record and compare receptor perturbation/rescue with matched species
    and verified ligand preparations.
  provenance:
  - reference_id: PMID:31230984
  - reference_id: PMID:41671088
suggested_experiments:
- description: Compare blinded human asprosin residues 2732–2871 preparations from bacterial and mammalian
    systems across laboratories. Verify sequence, tag, glycosylation, aggregation and endotoxin; measure hepatocyte
    cAMP, PKA and glucose output with matched vehicle and tag controls.
  hypothesis: A measurable preparation feature or assay condition accounts for at least part of the discrepant
    glucogenic responses.
- description: Using sequence-verified ligand and explicitly matched human or mouse receptors, compare OLFR734/OR4M1
    and PTPRF single and combined perturbations with rescue, orthogonal binding assays and glucose-output measurements.
    Confirm the proteins used in the disputed BLI reagent record before comparing affinities.
  hypothesis: The reported receptor routes make distinguishable, potentially overlapping contributions that
    depend on ligand preparation, species or cellular context.
