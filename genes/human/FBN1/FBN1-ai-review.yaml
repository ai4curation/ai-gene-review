  - reference_id: PMID:15062093
- description: Asprosin, the released C-terminal FBN1 product, acts as an extracellular hormone that promotes
    hepatic glucose output and appetite. Human asprosin tested in rodent hepatocytes and animals supports cAMP/PKA
    signaling and systemic glucose homeostasis, alongside observations of the endogenous product and human
    phenotypes. FBN1 supplies the signal; hepatocyte machinery performs glucose-metabolic reactions. The GPCR-associated
    route is supported without assigning an exclusive receptor, and human ligand in rodent assays remains distinct
    from mouse ligand tested with human receptors. Preparation-dependent responses and unresolved replication
    differences limit universal assay claims.
