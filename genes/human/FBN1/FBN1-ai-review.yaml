id: P35555
gene_symbol: FBN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FBN1 encodes profibrillin-1, a secreted, calcium-binding glycoprotein that is processed into functionally
  distinct extracellular products. Mature fibrillin-1 assembles into microfibrils that provide structural support
  in elastic and elastin-free connective tissues, organize elastic-fiber assembly, and connect the matrix to
  cell-surface integrins. Fibrillin microfibrils also control local TGF-beta and BMP availability by anchoring
  growth-factor complexes in the matrix. The released C-terminal product, asprosin, is a circulating hormone
  with glucogenic and appetite-stimulating activities, distinct from the structural functions of the mature
  matrix chain.
