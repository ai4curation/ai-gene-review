functional_isoforms:
- id: FBN1_MATURE_FIBRILLIN1
  name: Mature fibrillin-1
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000007581
    residues: 45-2731
  description: Mature extracellular matrix fibrillin-1, derived by removal of the signal peptide and N-terminal
    propeptide and cleavage at the C-terminal processing site. This chain is incorporated into microfibrils;
    it is distinct from the released C-terminal asprosin hormone.
- id: FBN1_ASPROSIN
  name: Asprosin
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000436882
    residues: 2732-2871
  description: The 140-residue C-terminal cleavage product of profibrillin-1. Human recombinant asprosin stimulates
    hepatic glucose release and cAMP/PKA signaling in mice and primary mouse hepatocytes; endogenous asprosin
    was detected in human plasma. This endocrine product is distinct from mature matrix fibrillin-1.
core_functions:
- description: Mature fibrillin-1 forms the structural framework of extracellular microfibrils in elastic and
    elastin-free tissues. This framework supports elastic-fiber assembly and provides a matrix scaffold that
    controls the availability of latent TGF-beta complexes through LTBPs and of BMP complexes through their
    prodomains. The direction of growth-factor regulation depends on tissue and developmental context; the
    retained negative-regulation contexts describe matrix sequestration demonstrated in osteoblast studies.
  molecular_function:
    id: GO:0005201
    label: extracellular matrix structural constituent
  directly_involved_in:
  - id: GO:0048251
    label: elastic fiber assembly
  - id: GO:0030512
    label: negative regulation of transforming growth factor beta receptor signaling pathway
  - id: GO:0030514
    label: negative regulation of BMP signaling pathway
  locations:
