  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Citation identity checked against the genuine fetched record. Human FBN1 N-terminal recombinant
      rF23 binds BMP2/BMP4/BMP7/BMP10/GDF5 prodomains by SPR; Table 3 lists the individual affinities. Human
      GDF5 prodomain is generated from human-cell cDNA (Table 1 NM_000557); purchased mature mouse GDF5 is
      a separate reagent. These are prodomain interactions, not proof of binding every mature free growth-factor
      dimer. Mouse tissue BMP localization is separate from recombinant human-binding data; no FBN1 growth-factor
      catalytic/receptor activity is inferred. Source guide records the bounded original read and any supplementary
      limits.
- id: PMID:18448684
