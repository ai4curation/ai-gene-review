    label: microfibril
  supported_by:
  - reference_id: PMID:3536967
  - reference_id: PMID:12429738
  - reference_id: PMID:18339631
  - reference_id: PMID:20855508
- description: Mature fibrillin-1 self-associates through N-terminal/C-terminal contacts and C-terminal multimerization,
    contributing the intermolecular connections used to build extracellular microfibrils. Human recombinant
    fragment binding, domain controls and competition with fibroblast matrix assembly establish this contribution.
    Multimerization in the original experiments is cell associated; the fragment studies do not resolve every
    contact in a complete native microfibril or establish an autonomous assembly enzyme.
  molecular_function:
    id: GO:0042802
    label: identical protein binding
  locations:
