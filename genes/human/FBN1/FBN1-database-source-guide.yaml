primary_read_scopes:
- reference_id: PMID:9815129
  original_url: https://doi.org/10.1152/ajprenal.1998.275.5.F710
  read_scope: Original author-posted paper abstract and figure captions, saved indexed L39–54; original
    text continues only through L590 before Results. ROOT genuine normal is abstract-only.
  claim_and_limit: Rat Fbn1 developmental distribution and antisense-associated metanephric dysmorphogenesis
    support a contextual matrix contribution; no full Results read is claimed.
- reference_id: PMID:11012893
  original_url: https://doi.org/10.1046/j.1523-1755.2000.00320.x
  read_scope: 'Original publisher body: mesangial immunolocalization, Figures 5–8 and Discussion; source-specific
    first part of saved response.'
  claim_and_limit: Human/rat/mouse mesangial ECM localization; rat TGFβ-induced expression with analogous
    human/mouse expression. Glomerular basement membrane was spared in this tissue; this is not universal
    basement-membrane exclusion.
- reference_id: PMID:12485443
  original_url: https://doi.org/10.1046/j.1523-1747.2002.19614.x
  read_scope: Original publisher abstract-level response only; complete operative body unavailable.
  claim_and_limit: Tsk-aorta vasodilator responses do not resolve all seven source-specific transfers.
    These remain UNDECIDED; no wrong-gene or wrong-reference allegation.
- reference_id: PMID:15610515
  original_url: https://doi.org/10.1111/j.0022-202X.2004.23471.x
  read_scope: Original publisher Discussion on elastic-fiber and fibulin matrix alterations; identity
    context in same response.
  claim_and_limit: Actual Tsk extracellular deposition phenotype supports elastic-fiber organization but
    not intracellular protein targeting.
- reference_id: PMID:16439805
  original_url: https://doi.org/10.1165/rcmb.2006-0002OC
  read_scope: 'Indexed original PMC Discussion: Role of Collagen and Possible Mechanisms of Progression;
    genuine abstract. Raw HTTP200 HTML capture is a bot page and is excluded as original evidence.'
  claim_and_limit: Developmental emphysema, alveolar architecture and matrix failure support contextual
    structural development. Mechanical failure is not a demonstrated FBN1 response-signaling mechanism.
- reference_id: PMID:17200203
  original_url: https://doi.org/10.2353/ajpath.2007.060497
  read_scope: Original publisher introduction/summary plus source-specific original PDF Results excerpt
    at printed page 305; raw PMC HTML is a bot page and excluded.
  claim_and_limit: Rat renal fibroblast supernatant FBN1 and IGF-I/decorin-induced synthesis are measured.
    FBN1 is a response output rather than the IGF receptor machinery.
- reference_id: PMID:17496220
  original_url: https://doi.org/10.1152/ajpheart.00038.2007
  read_scope: Genuine original PDF text, Results and Discussion; independently read operative Results
    beginning at character 15145 and continued disease interpretation.
  claim_and_limit: Mouse Tsk vascular, inflammatory and lipid phenotypes with D-4F intervention do not
    establish normal FBN1 as the immune, angiogenic or lipid-regulatory actor.
- reference_id: PMID:17581616
  original_url: https://doi.org/10.1038/sj.jid.5700919
  read_scope: Genuine author original PDF text, complete Results and opening Discussion at characters
    9660–18400.
  claim_and_limit: BAFF signaling, B cells and cytokines are the measured actors; Tsk is the mutant matrix
    background. No title-based wrong-gene rejection.
- reference_id: PMID:20855508
  original_url: https://doi.org/10.1083/jcb.201003089
  read_scope: Genuine full normal cache, indexed lines 131,135,137,141,153,161 independently read.
  claim_and_limit: Fbn1-null osteoblast Results distinguish TGFβ activation and BMP sequestration, including
    unchanged transcripts and pathway-separation evidence. Tissue-specific context prevents universal
    sign extrapolation.
- reference_id: PMID:29106398
  original_url: https://doi.org/10.1038/nm.4432
  read_scope: Genuine full normal cache, indexed lines 131,133,141,147,149,155,157,163,179 and human-ligand
    identity at 263 independently read.
  claim_and_limit: Human FBN1 residues 2732–2871 were used in rodent feeding/neuron experiments; direct
    AgRP activation and indirect POMC inhibition are distinguished. No mature-matrix appetite function
    or exact current donor QuickGO row is invented.
- reference_id: PMID:29112946
  original_url: https://doi.org/10.1371/journal.pone.0187109
  read_scope: Genuine exact-main full cache, complete indexed Results line 117 and Discussion line 145
    independently read.
  claim_and_limit: CDH11 blockade changes fibrosis and downstream transcripts in Tsk mice; it does not
    show FBN1 performing gene-expression machinery.
- reference_id: PMID:8120105
  original_url: https://doi.org/10.1083/jcb.124.5.855
  read_scope: Recovered original PDF text lines 390–491 independently read; direct owner/ROOT additionally
    inspected operative figure pixels. This successor did not independently inspect pixels.
  claim_and_limit: Human fetal matrix distribution and bovine elastic-fiber microfibrillar localization
    support scaffold-based elasticity inference, not isolated-molecule force measurement.
- reference_id: PMID:24039232
  original_url: https://doi.org/10.1242/jcs.127571
  read_scope: Genuine full cache original Results blocks 20–38 independently read; direct-owner full read
    scope retained.
  claim_and_limit: Human soluble N-terminal fragments inhibit mouse osteoclasts; RANKL-binding N-half
    and shorter calcium/NFATc1 fragment have distinct mechanisms. Immobilized matrix is not equivalent;
    natural active cleavage product remains undefined.
- reference_id: PMID:25406291
  original_url: https://doi.org/10.1167/iovs.14-15453
  read_scope: Correct original PMC4263138 blocks 31–37 independently read; direct-owner read scope also
    consulted. Earlier wrong PMC capture excluded.
  claim_and_limit: Specific human FBN1 developmental localization supports contextual matrix contribution,
    not a unique causal eye-patterning program. Fibrillin paralogs are not FBN1 splice isoforms.
- reference_id: PMID:11886530
  original_url: https://doi.org/10.1046/j.0022-202x.2001.01588.x
  read_scope: Genuine cached abstract and direct-owner original PubMed abstract result; operative body
    unavailable.
  claim_and_limit: Positive lamina-densa/nonfibrillar epithelial evidence prevents a global basement-membrane
    negative, while exact source context remains UNDECIDED.
- reference_id: 27087445/31230984/30879984
  original_url: https://pubmed.ncbi.nlm.nih.gov/27087445/
  read_scope: Previously sealed and ROOT-accepted asprosin source assessment reused; not re-researched.
  claim_and_limit: Human 2016 ligand, mouse 2019 ligand, and negative replication are kept distinct. Unresolved
    reproducibility across preparations/laboratories is not explained away by later positive GST results.
    Multiple receptor evidence does not exclude GPCR signaling.
propagation_boundaries:
- PAINT family and literal ancestral node/term joins are captured; topology and MSA retrieval failed.
  No reconstructed descent or donor-count argument is asserted. Human self-donor grounding is legitimate.
- ARBA payloads establish rule content, not independent target-specific condition rematching. Their biological
  conclusions are evaluated against target evidence.
- Reactome nested routes establish actual FBN1 membership and compartment; the finite graph has unresolved
  branches and is not an exhaustive pathway audit. Enzyme, substrate and matrix-scaffold roles are kept
  distinct.
- Microfibril is a cellular anatomical structure under GO:0110165, with no GO:0032991 ancestor in the
  saved live ontology; no protein-containing-complex placement is proposed.
- The exact raw processed-product joins remain external to the unchanged annotation source objects; the
  current zero-hit mouse processed-chain query does not negate historical provenance.
