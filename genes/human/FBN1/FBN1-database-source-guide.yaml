    broad structure also covers nonelastic matrix and growth-factor storage.
  stable_identities: Explanatory references to other annotation positions now name their GO terms and
    supporting publications. Source indices in structured joins remain exact.
  hierarchy: Verified is_a edges are recorded in the feedback table; no additional annotation or cache
    change.
