gene: FBN1
biological_scope:
- Fibrillin-1 supplies microfibrillar extracellular matrix structure in elastic and nonelastic tissues
  and provides context-dependent growth-factor storage scaffolds.
- The C-terminal asprosin chain has a distinct endocrine scope; source product identities remain separate
  from the mature structural chain.
- Ortholog disease phenotypes and expression changes are assessed separately from functions performed
  by FBN1. Inaccessible operative evidence remains unresolved.
