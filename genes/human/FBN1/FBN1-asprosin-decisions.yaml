  review:
    summary: The asprosin cleavage product contributes to glucose homeostasis through its glucogenic
      hormone activity.
    action: ACCEPT
    reason: The raw annotation identifies P35555-PRO_0000436882. PMID:27087445 combines human plasma/genetic
      observations with human recombinant asprosin administration and mouse-hepatocyte responses,
      linking the released chain to regulation of circulating glucose. This is a signaling contribution
      to glucose homeostasis, not direct glucose-metabolic catalysis by fibrillin-1. Reported negative
      replication with other protein preparations and later receptor studies limit universal claims
      about dose, preparation and receptor usage; they do not erase the convergent evidence for this
      product-level role.
    supported_by:
    - reference_id: PMID:27087445
    - reference_id: PMID:30879984
    - reference_id: PMID:41671088
