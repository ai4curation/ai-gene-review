  review:
    summary: The cited receptor study supports asprosin hormone biology, but direct assay provenance
      for the human chain is unresolved.
    action: UNDECIDED
    reason: PMID:31230984 explicitly describes mouse-liver-derived Asprosin and mouse GST-Asprosin
      production. Human OR4M1 expression and human host cells do not establish that the ligand assayed
      was human. The source-specific human-chain IDA claim therefore remains unresolved; no source
      field is changed and no claim is made that the entire paper concerns the wrong gene. Human
      asprosin hormone activity is independently supported by PMID:27087445, so this judgment does
      not negate that activity.
    supported_by:
    - reference_id: PMID:31230984
    - reference_id: PMID:27087445
