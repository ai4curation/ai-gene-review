  review:
    summary: Asprosin positively regulates glucose metabolism through endocrine signaling rather
      than executing glucose-metabolic chemical reactions.
    action: MODIFY
    reason: GO:0006006 denotes chemical reactions and pathways involving glucose. PMID:27087445 tests
      human asprosin as an extracellular signal that increases hepatic glucose output, including
      in isolated primary mouse hepatocytes; the hepatocyte metabolic machinery performs the chemical
      conversions. Replace this with GO:0010907, positive regulation of glucose metabolic process.
      This is a correction of the product role, not an is_a/part_of refinement and not a new annotation.
      The original study does not resolve all glucose flux into a single pathway such as gluconeogenesis,
      so that narrower replacement is not asserted. Exact target and typed ancestor/descendant comparisons
      against all 154 imported terms found no existing regulatory context.
    supported_by:
    - reference_id: PMID:27087445
    proposed_replacement_terms:
    - id: GO:0010907
      label: positive regulation of glucose metabolic process
