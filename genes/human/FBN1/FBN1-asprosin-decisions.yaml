  review:
    summary: The source paper demonstrates extracellular asprosin, while this imported annotation
      names the parent FBN1 gene product.
    action: ACCEPT
    reason: This EXP annotation has raw product P35555, unlike the chain-specific IDA context at
      index 66. PMID:27087445 Figure 2 detects the released C-terminal product in human plasma and
      shows secretion in mammalian cell systems. This supports an extracellular location for an FBN1-derived
      product; it does not show an intact 2871-residue precursor circulating as the hormone or assign
      hormone activity to mature matrix fibrillin-1. The parent source identity remains exact.
    supported_by:
    - reference_id: PMID:27087445
