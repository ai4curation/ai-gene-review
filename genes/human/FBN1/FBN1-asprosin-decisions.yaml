  review:
    summary: Human recombinant asprosin activates a cAMP/PKA signaling response with pharmacological
      support for a G-protein-coupled pathway.
    action: ACCEPT
    reason: PMID:27087445 Figure 6 and Methods show cAMP/PKA responses to the human 2732–2871 reagent
      in mice and primary mouse hepatocytes, with inhibition of signaling/glucose output by suramin
      and of output by a PKA antagonist. These experiments support the annotated pathway but do not
      identify a receptor or prove exclusivity. PMID:31230984 provides mouse-ligand OLFR734/human-OR4M1
      context, and PMID:41671088 adds PTPRF-dependent signaling without experimentally excluding
      the earlier GPCR route. The 2019 negative-replication report and the 2026 BLI reagent-label
      ambiguity are retained as source limitations; neither warrants silently replacing or removing
      this observed source-specific pathway.
    supported_by:
    - reference_id: PMID:27087445
    - reference_id: PMID:31230984
    - reference_id: PMID:41671088
    - reference_id: PMID:30879984
