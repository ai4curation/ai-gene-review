  review:
    summary: The FBN1 precursor yields the secreted hormone asprosin.
    action: ACCEPT
    reason: The PTN002778720 hormone assertion is biologically supported by the separately read human
      asprosin ligand studies, including glucogenic signaling and appetite regulation. This activity belongs
      to the C-terminal processed chain, not mature structural fibrillin-1. Glucogenic reproducibility
      remains disputed across preparations and laboratories, as recorded in the asprosin reference review.
      The saved PAINT material establishes the family and literal node/term joins, but topology/MSA retrieval
      failed; target descent was not independently reconstructed. Human self-donor evidence is legitimate,
      not circular.
