  review:
    summary: Fibrillin-1 contributes extracellular structural support during metanephric development.
    action: KEEP_AS_NON_CORE
    reason: The rat G3V9M6 donor traces to PMID:9815129. Its original abstract and Figure captions show
      mesenchymal/vascular/glomerular Fbn1 distribution and impaired metanephric organization after antisense
      perturbation. This supports a contextual matrix contribution to organ development, without making
      FBN1 a developmental signaling enzyme. The saved original capture ends before the full Results;
      no additional mechanistic claim is made.
