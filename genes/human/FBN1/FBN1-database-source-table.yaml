  review:
    summary: The mouse-derived hormone inference is supported for the asprosin product.
    action: ACCEPT
    reason: Mouse Q61554 carries hormone evidence from PMID:31230984. That paper used mouse recombinant
      ligand, so it does not independently prove the exact human-ligand assay. Human C-terminal ligand
      evidence in PMID:27087445 and PMID:29106398 independently supports the hormone function of human
      FBN1-derived asprosin. This does not assign hormone activity to the mature matrix chain.
