- term:
    id: GO:0000209
    label: protein polyubiquitination
  evidence_type: IDA
  original_reference_id: PMID:12820959
  qualifier: involved_in
  review:
    summary: SCF ligases containing SKP1 build polyubiquitin chains on receptor-bound substrates; the beta-TrCP1-SKP1-beta-catenin
      structure led to the model in which SCF raises the effective concentration of the substrate lysine at the E2 active
      site.
    action: ACCEPT
    reason: Core process, and the structural work is precisely about how the SKP1-receptor arm positions the substrate for
      chain synthesis. SKP1 contributes the positioning rather than the chemistry, which is what a non-catalytic subunit
      can contribute to a process.
    supported_by:
    - reference_id: PMID:12820959
      supporting_text: the model of SCF catalyzing ubiquitination by increasing the effective concentration of the substrate
        lysine at the E2 active site
    - reference_id: PMID:20347421
      supporting_text: We describe a mechanistic model of polyubiquitination by the SCF(beta TrCP2) E3 ubiquitin (Ub) ligase
        using human I kappaB alpha as a substrate
    - reference_id: file:human/SKP1/SKP1-deep-research-falcon.md
      supporting_text: ubiquitin is transferred through E1 and E2 enzymes to receptor-bound proteins, often generating K48-linked
        chains that direct the target to the 26S proteasome
- term:
