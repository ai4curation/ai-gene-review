    label: chromosome, centromeric region
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q9WTX5
  - ensembl:ENSMUSP00000038744
  review:
    summary: Ortholog transfer from mouse Skp1 (UniProtKB:Q9WTX5), which carries an IDA annotation to the centromeric chromosome
      region from a meiotic study; no human-cell evidence supports this location directly.
    action: KEEP_AS_NON_CORE
    reason: The source is a mouse experimental annotation, transferred by Ensembl Compara, and the orthologs are essentially
      identical, so the transfer is sound and should not be overruled. But a meiotic centromeric pool is a stage-restricted
      context rather than part of the core adaptor function, so it is kept as non-core.
    supported_by:
