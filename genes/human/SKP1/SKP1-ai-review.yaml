- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: NAS
  original_reference_id: PMID:11961546
  qualifier: involved_in
  review:
    summary: SCF(SKP2), assembled on SKP1, ubiquitinates Thr187-phosphorylated p27/CDKN1B, releasing cyclin E/A-CDK2 activity
      and committing the cell to S phase; the SCF(SKP2) structure defines how SKP1 carries SKP2.
    action: ACCEPT
    reason: 'Core process: the p27 switch at the G1/S transition is the canonical output of an SCF ligase, SKP1 performs
      the adaptor work in that ligase, and this matches the annotations kept on CUL1, RBX1 and SKP2. Human SKP1 depletion
      stabilises cyclin E1 and causes replication stress, consistent with a requirement at this transition.'
    supported_by:
    - reference_id: PMID:11961546
      supporting_text: The long stalk, which consists of three repeats of a novel five-helix motif, binds the Skp1-F boxSkp2
        protein substrate-recognition complex at its tip
    - reference_id: file:human/SKP1/SKP1-uniprot.txt
      supporting_text: SCF(SKP2) directs ubiquitination of phosphorylated CDKN1B/p27kip and is involved in regulation of
        G1/S transition.
    - reference_id: file:human/SKP1/SKP1-deep-research-falcon.md
      supporting_text: Human SKP1 depletion increases Cyclin E1 and produces replication stress, DNA double-strand-break
        markers, micronuclei, altered chromosome numbers, and chromothriptic events.
- term:
    id: GO:0000151
    label: ubiquitin ligase complex
  evidence_type: NAS
  original_reference_id: PMID:34445249
  qualifier: part_of
  review:
    summary: 'SKP1 is a subunit of ubiquitin ligase complexes generally: the ~69 SCF ligases, the CRL7(FBXW8) assembly,
      and CUL1-independent complexes such as the PAM/MYCBP2-FBXO45-SKP1 ligase.'
    action: ACCEPT
    reason: 'The general parent term is the right level for this claim because SKP1 is not confined to SCF: it is also a
      subunit of CRL7(FBXW8) and of the non-cullin PAM/FBXO45 ligase, which GO:0019005 would exclude. Keeping it alongside
      the more specific complex terms loses nothing.'
    supported_by:
    - reference_id: PMID:34445249
      supporting_text: The SKP1, CUL1, F-box protein (SCF) complex encompasses a group of 69 SCF E3 ubiquitin ligase complexes
        that primarily modify protein substrates with poly-ubiquitin chains to target them for proteasomal degradation
    - reference_id: PMID:29997255
      supporting_text: forms a noncanonical Skp/Cullin/F-box (SCF) complex that contains the F-box protein FBXO45 and SKP1
        but lacks CUL1
    - reference_id: file:human/SKP1/SKP1-uniprot.txt
      supporting_text: Core component of the Cul7-RING(FBXW8) ubiquitin ligase complex, which mediates the ubiquitination
