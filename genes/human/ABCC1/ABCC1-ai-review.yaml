suggested_questions:
- question: Is MRP1 a bona fide physiological cobalamin (vitamin B12) exporter in humans, and does loss
    of this activity contribute to any clinical B12-handling phenotype?
- question: What is the relative physiological contribution of MRP1 to glutathione redox homeostasis in
    the CNS versus other GSH-export routes (e.g. connexin hemichannels)?
suggested_experiments:
- description: Reconstitute purified human MRP1 in proteoliposomes and measure ATP-dependent cobalamin
    transport directly, to resolve whether cobalamin is a genuine MRP1 substrate.
- description: Use MRP1-selective inhibition/knockout in primary human astrocytes and brain endothelial/choroid-plexus
    cells to quantify MRP1's contribution to GSH export and xenobiotic efflux at CNS barriers under oxidative-stress
    conditions.
