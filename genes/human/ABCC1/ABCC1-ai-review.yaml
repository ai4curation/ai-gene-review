id: P33527
gene_symbol: ABCC1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABCC1 (MRP1) is a 1531-residue, 17-transmembrane-helix ATP-binding cassette transporter of
  the ABCC subfamily that couples ATP binding and hydrolysis at its two cytoplasmic nucleotide-binding
  domains to the active, unidirectional efflux of organic anions across the plasma membrane. Its highest-affinity
  physiological substrate is the glutathione S-conjugate leukotriene C4, and it transports a broad range
  of glutathione-, glucuronide- and sulfate-conjugated compounds (e.g. estradiol-17-glucuronide, bilirubin
  glucuronides, sulfated bile acids, prostaglandin A2-glutathione conjugates) as well as free reduced
  and oxidized glutathione (GSH/GSSG). Many unmodified lipophilic drugs (anthracyclines, vinca alkaloids)
  are co-transported with glutathione, making MRP1 a major determinant of multidrug resistance in tumour
  cells. Beyond detoxification it exports the signaling lipid sphingosine-1-phosphate and the immunostimulatory
  cyclic dinucleotide 2'3'-cGAMP, thereby modulating mast-cell migration, inflammation and cGAS-STING-dependent
  type I interferon responses. In polarized epithelia MRP1 localizes predominantly to the basolateral
  membrane, where it contributes to cytoprotection, glutathione redox homeostasis, leukotriene release
  and xenobiotic efflux at tissue barriers (e.g. Sertoli cells of the blood-testis barrier, choroid plexus
  epithelium). Loss-of-function variants cause autosomal dominant non-syndromic hearing loss (DFNA77).
