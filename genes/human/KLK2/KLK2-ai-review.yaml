id: P20151
gene_symbol: KLK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KLK2 (human kallikrein 2, hK2) is a trypsin-like, arginine-selective serine protease of the
  tissue kallikrein family, expressed predominantly in prostate luminal epithelium under androgen control
  and secreted into seminal plasma. It is synthesized as a pre-pro-enzyme with an 18-residue signal peptide
  and a short activation peptide. In seminal fluid, hK2 activates the zymogens of prostate-specific antigen
  (pro-PSA/KLK3), itself (pro-hK2) and urokinase-type plasminogen activator, and it is controlled by serpins
  such as protein C inhibitor, PAI-1 and PI-6, with which it forms covalent complexes. hK2 is a secreted
  extracellular protein and an established prostate cancer biomarker.
