- term:
    id: GO:0106310
    label: protein serine kinase activity
  evidence_type: EXP
  original_reference_id: PMID:16094730
  qualifier: enables
  review:
    summary: p110γ has experimentally demonstrated protein serine kinase activity in addition to lipid
      kinase activities.
    action: ACCEPT
    reason: Ser1101 autophosphorylation (PMID:12502714) and tropomyosin phosphorylation in the receptor-endocytosis
      study (PMID:16094730) establish genuine protein kinase chemistry. Preserve this activity when refining
      a broad kinase term; lipid kinase activity alone is not an adequate replacement.
    supported_by:
    - reference_id: PMID:12502714
      supporting_text: Autophosphorylation sites of both PI3K isoforms were mapped to C-terminal serine
        residues of the catalytic p110 subunit (i.e. serine 1070 of p110 beta and serine 1101 of p110
        gamma).
