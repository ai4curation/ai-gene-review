    - reference_id: PMID:16123124
      supporting_text: Whereas yeast and mammalian IPMKs form only a single product, PI3K also forms PI(3,4)P
        2 and PI (3)P in addition to PI(3,4,5)P 3 when incubated with lipid extracts, consistent with
        previous reports ( 9 ).
