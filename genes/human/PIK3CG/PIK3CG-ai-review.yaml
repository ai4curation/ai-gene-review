id: P48736
gene_symbol: PIK3CG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PIK3CG encodes p110γ, the catalytic subunit of class IB phosphoinositide 3-kinase. Complexes
  with p101 or p84/p87 couple G protein and Ras inputs to membrane PIP3 production, supporting leukocyte
  migration, activation and inflammatory responses. Recruitment and regulation vary with the regulatory
  subunit and receptor context; PKCβ can also activate p110γ after FcεRI stimulation. The enzyme phosphorylates
  additional phosphoinositide substrates in biochemical assays and has protein serine kinase activity.
  In the cardiovascular system, lipid kinase activity, protein phosphorylation and scaffolding of cAMP-regulating
  complexes contribute distinct effects on receptor trafficking and contractility.
