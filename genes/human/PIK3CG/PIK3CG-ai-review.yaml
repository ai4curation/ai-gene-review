core_functions:
- molecular_function:
    id: GO:0046934
    label: 1-phosphatidylinositol-4,5-bisphosphate 3-kinase activity
  description: ATP-dependent PIP3 synthesis by class IB p110γ complexes couples G-protein and context-dependent
    Ras/PKC inputs to membrane signaling. Regulatory-subunit identity determines recruitment and sensitivity;
    the route is not universal across immune receptors.
  directly_involved_in:
  - id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  - id: GO:0043491
    label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0005944
    label: phosphatidylinositol 3-kinase complex, class IB
  supported_by:
  - reference_id: PMID:16123124
    supporting_text: Whereas yeast and mammalian IPMKs form only a single product, PI3K also forms PI(3,4)P
      2 and PI (3)P in addition to PI(3,4,5)P 3 when incubated with lipid extracts, consistent with previous
      reports ( 9 ).
  - reference_id: file:human/PIK3CG/PIK3CG-uniprot.txt
    record_section:
    - CC:SUBUNIT
    supporting_text: Heterodimer of a catalytic subunit PIK3CG and a PIK3R5 or PIK3R6 regulatory subunit.
  - reference_id: PMID:7624799
    supporting_text: The p110 gamma enzyme was activated in vitro by both the alpha and beta gamma subunits
      of heterotrimeric guanosine triphosphate (GTP)-binding proteins (G proteins) and did not interact
      with p85.
- molecular_function:
    id: GO:0106310
    label: protein serine kinase activity
  description: Protein serine phosphorylation includes C-terminal p110γ autophosphorylation and tropomyosin
    phosphorylation implicated in beta-adrenergic receptor internalization; this chemistry is distinct
    from its lipid kinase reaction.
  supported_by:
  - reference_id: PMID:12502714
    supporting_text: Autophosphorylation sites of both PI3K isoforms were mapped to C-terminal serine
      residues of the catalytic p110 subunit (i.e. serine 1070 of p110 beta and serine 1101 of p110 gamma).
suggested_questions:
- question: Which p110γ complexes account for the reported self-association records, and does oligomerization
    alter p101- versus p84-dependent signaling?
- question: How do cell-intrinsic and stromal p110γ contributions to lymphocyte development differ from
    direct class IA PI3K signaling downstream of the BCR?
