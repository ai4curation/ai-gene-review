- term:
    id: GO:0001819
    label: positive regulation of cytokine production
  evidence_type: TAS
  original_reference_id: PMID:19075988
  qualifier: involved_in
  review:
    summary: Cytokine production is a context-dependent output of p110γ signaling.
    action: KEEP_AS_NON_CORE
    reason: The original therapeutic review discusses immune regulation. Retain positive regulation in
      the lymphocyte contexts summarized in curated evidence; human p110γ deficiency can instead increase
      myeloid IL-12/IL-23 production (PMID:31554793), so the sign is not universal.
    supported_by:
    - reference_id: file:human/PIK3CG/PIK3CG-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Regulates T-lymphocyte proliferation, activation, and cytokine production.
- term:
    id: GO:0002250
    label: adaptive immune response
  evidence_type: TAS
  original_reference_id: PMID:17290298
  qualifier: involved_in
  review:
    summary: p110γ contributes to adaptive immune responses.
    action: KEEP_AS_NON_CORE
    reason: Adaptive immune participation includes lymphocyte development and activation. This does not
      imply that p110γ is the default class IA catalytic subunit of the BCR signalosome.
    supported_by:
    - reference_id: file:human/PIK3CG/PIK3CG-uniprot.txt
