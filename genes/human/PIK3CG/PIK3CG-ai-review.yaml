- term:
    id: GO:0005943
    label: phosphatidylinositol 3-kinase complex, class IA
  evidence_type: EXP
  original_reference_id: PMID:10358071
  qualifier: part_of
  review:
    summary: p110γ forms class IB complexes with p101 or p84/p87.
    action: MODIFY
    reason: Class IA denotes p85-family regulatory complexes; p110γ instead binds PIK3R5/PIK3R6. PMID:10358071
      characterizes the p101 complex, and PMID:7624799 reports no p85 interaction. For the PAINT PTN000799659
      assertion, this is a subfamily/complex-type correction, not rejection based on donor count.
    supported_by:
    - reference_id: file:human/PIK3CG/PIK3CG-uniprot.txt
      record_section:
      - CC:SUBUNIT
      supporting_text: Heterodimer of a catalytic subunit PIK3CG and a PIK3R5 or PIK3R6 regulatory subunit.
    - reference_id: PMID:7624799
      supporting_text: The p110 gamma enzyme was activated in vitro by both the alpha and beta gamma subunits
        of heterotrimeric guanosine triphosphate (GTP)-binding proteins (G proteins) and did not interact
        with p85.
    proposed_replacement_terms:
    - id: GO:0005944
      label: phosphatidylinositol 3-kinase complex, class IB
