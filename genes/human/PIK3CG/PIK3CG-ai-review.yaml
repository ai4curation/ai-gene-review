  review:
    summary: p110γ can generate PI3P from phosphatidylinositol.
    action: KEEP_AS_NON_CORE
    reason: The human p110γ comparator in PMID:16123124 directly produces all three D3-phosphorylated
      lipid products. This is a real substrate-specific activity, distinct from the major PIP3 signaling
      reaction; a class I identity does not make PI3P production false. The PAINT inference is supported
      by the measured target chemistry.
