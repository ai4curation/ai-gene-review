- term:
    id: GO:0048015
    label: phosphatidylinositol-mediated signaling
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0015279
  - PANTHER:PTN000005673
  - dictyBase:DDB_G0278727
  review:
    summary: p110γ-generated PIP3 supports downstream AKT signaling.
    action: ACCEPT
    reason: PIP3 synthesis is an actual catalytic step of this pathway. PMID:12507995 establishes this
      signaling capacity; the S1P endothelial study PMID:18558630 finds that its migration output is AKT-dependent
      for p110β rather than p110γ, which limits that assay but does not negate p110γ–AKT signaling in
      other contexts. The Epac/angiogenesis context is independently supported by PMID:21393242.
    supported_by:
    - reference_id: file:human/PIK3CG/PIK3CG-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: PIP3 plays a key role by recruiting PH domain-containing proteins to the membrane,
        including AKT1 and PDPK1, activating signaling cascades involved in cell growth, survival, proliferation,
        motility and morphology.
