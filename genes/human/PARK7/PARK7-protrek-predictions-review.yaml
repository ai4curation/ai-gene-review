    summary: >-
      Rank 4 (score 19.96), reviewed in place of rank 3 which is obsolete. Guanine deglycation extends
      the disputed activity from proteins to nucleotides and is scored MORE_SPECIFIC under DNA repair.
      Four of the five calls are variants of one contested claim, which is why none is scored as correct
