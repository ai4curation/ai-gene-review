suggested_questions:
- question: Is the reported role of TUFM in restraining RIG-I-like receptor signalling and promoting autophagy
    (with NLRX1 and ATG5-ATG12/ATG16L1) separable from its elongation function, and which pool of TUFM
    is accessible to cytosolic or outer-membrane partners given its matrix import?
- question: Does mtEF-Tu GTP hydrolysis actively position GTPBP5 during late mt-LSU assembly, or is its
    binding to assembly intermediates incidental?
suggested_experiments:
- description: Protease-protection and submitochondrial fractionation of endogenous TUFM, combined with
    separation-of-function mutants that retain elongation activity, to test whether the antiviral/autophagy
    phenotypes require an extra-matrix pool.
