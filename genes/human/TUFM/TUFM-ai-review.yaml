id: P49411
gene_symbol: TUFM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TUFM encodes mitochondrial elongation factor Tu (mtEF-Tu), a nuclear-encoded translational
  GTPase of the TRAFAC class that is imported into the mitochondrial matrix. In its GTP-bound form it
  binds aminoacyl-tRNAs and delivers them to the A site of the 55S mitoribosome; codon recognition triggers
  GTP hydrolysis and release of EF-Tu-GDP, which is recycled to the GTP form by the nucleotide exchange
  factor EF-Ts (TSFM), with which it forms a stable EF-Tu-Ts complex. It is therefore required for elongation
  during synthesis of the 13 mtDNA-encoded OXPHOS subunits. mtEF-Tu has also been visualised bound to
  late large-subunit assembly intermediates together with GTPBP5. Biallelic TUFM variants cause combined
  oxidative phosphorylation deficiency 4 (COXPD4), a neonatal lactic acidosis with rapidly progressive
  encephalopathy and leukodystrophy and defective mitochondrial translation. A second, less well characterised
  role has been reported in which TUFM associates with NLRX1 and the ATG5-ATG12/ATG16L1 complex, dampening
  RIG-I-like receptor type I interferon signalling and promoting autophagy, and is co-opted by several
  viral proteins to induce mitophagy.
