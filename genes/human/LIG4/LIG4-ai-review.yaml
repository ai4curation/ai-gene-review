core_functions:
- description: Ligase of classical NHEJ. In complex with XRCC4, and within the Ku/DNA-PKcs/XLF synaptic
    complex, LIG4 seals double-strand break ends, including the coding and signal joints of V(D)J recombination
    and deprotected telomere ends.
  molecular_function:
    id: GO:0003910
    label: DNA ligase (ATP) activity
  directly_involved_in:
  - id: GO:0097680
    label: double-strand break repair via classical nonhomologous end joining
  - id: GO:0033151
    label: V(D)J recombination
  locations:
  - id: GO:0005634
    label: nucleus
  in_complex:
    id: GO:0032807
    label: DNA ligase IV complex
  supported_by:
  - reference_id: PMID:9809069
    supporting_text: Hence, DNA ligase IV is the activity responsible for the ligation step in NHEJ and
      in V(D)J recombination.
  - reference_id: PMID:29980672
    supporting_text: DNA ligase IV (LigIV) performs the final DNA nick-sealing step of classical nonhomologous
      end-joining
  - reference_id: PMID:9242410
    supporting_text: Ligation of DNA double-strand breaks in a cell-free system by DNA ligase IV is increased
      fivefold by purified XRCC4
  - reference_id: PMID:34352203
    supporting_text: we present cryo-EM structures of NHEJ supercomplexes that are composed of these core
      proteins and DNA
  - reference_id: PMID:24837021
    supporting_text: Most unexpectedly, however, the majority of EJing events remained LIGIV-dependent.
suggested_questions:
- question: Should the UniProt IGI row for cellular response to ionizing radiation (PMID:29463814, with
    C. elegans LEM-3) be moved to C. elegans lig-4, since the paper reports no experiment on human LIG4?
- question: Should the GO:0006297 (nucleotide-excision repair, DNA gap filling) rows from PMID:12517771
    and PMID:17290226, and the PAINT IBD they seed, be repointed to NHEJ, since both papers study gap
    filling at double-strand break ends?
- question: Does LIG4 have a function on mitotic chromosomes with condensin (hCAP-E/SMC4), separate from
    XRCC4, as suggested by PMID:12589063?
suggested_experiments:
- description: Test whether the LIG4-SMC4 (condensin) association on mitotic chromosomes is needed for
    any end-joining or chromosome-condensation outcome, using LIG4 point mutants that keep XRCC4 binding
    but lose hCAP-E binding.
  experiment_type: structure-guided mutagenesis with mitotic phenotyping
