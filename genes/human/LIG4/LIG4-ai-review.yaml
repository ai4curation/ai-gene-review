- term:
    id: GO:0000012
    label: single strand break repair
  evidence_type: IDA
  original_reference_id: PMID:8798671
  qualifier: involved_in
  review:
    summary: Purified LIG4 from HeLa nuclei joins single-strand breaks (nicks) in a double-stranded polymer
      in vitro.
    action: MARK_AS_OVER_ANNOTATED
    reason: The assay shows nick-ligation activity, not participation in cellular single-strand break
      repair. In cells, SSBR ligation is performed by LIG3/XRCC1 and LIG1; LIG4 acts at double-strand
      breaks in NHEJ. The activity is captured by DNA ligase (ATP) activity.
    supported_by:
    - reference_id: PMID:8798671
      supporting_text: The purified protein effectively joins single-strand breaks in a double-stranded
        polydeoxynucleotide in an ATP-dependent reaction.
    - reference_id: PMID:9809069
      supporting_text: Hence, DNA ligase IV is the activity responsible for the ligation step in NHEJ
        and in V(D)J recombination.
- term:
