- term:
    id: GO:0001701
    label: in utero embryonic development
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8BTF7
  review:
    summary: ISS from mouse Lig4, whose knockout causes late embryonic lethality.
    action: MARK_AS_OVER_ANNOTATED
    reason: Embryonic lethality reflects unrepaired DSBs (neuronal apoptosis) rather than a dedicated
      developmental function. This is a necessity phenotype of a housekeeping DNA repair ligase, not
      evidence that LIG4 does work specific to embryonic development, so it is marked over-annotated, as
      for NBN GO:0001701 and for the other knockout-phenotype rows here (neuron apoptosis, stem cell
      maintenance). The term is not removed because the loss-of-function lethality is real. Human
      LIG4-null somatic cells are viable, and human LIG4 syndrome is hypomorphic.
    supported_by:
    - reference_id: PMID:9823897
      supporting_text: Here we show that inactivation of the ligase IV gene in mice leads to late embryonic
        lethality.
    - reference_id: PMID:9889105
      supporting_text: targeted disruption of LIG4 in the mouse leads to lethality associated with extensive
        apoptotic cell death in the embryonic central nervous system
