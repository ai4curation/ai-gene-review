id: P49917
gene_symbol: LIG4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LIG4 encodes DNA ligase IV, the ATP-dependent DNA ligase (EC 6.5.1.1) of classical non-homologous
  end joining (NHEJ), the main pathway that repairs DNA double-strand breaks in vertebrate cells. Its
  N-terminal catalytic region (DNA-binding, adenylation and OB-fold domains) encircles nicked DNA and
  seals it through lysyl-AMP and DNA-adenylate intermediates, using Mg2+. Two C-terminal BRCT domains
  with the inter-BRCT linker bind an XRCC4 homodimer; XRCC4 stabilizes LIG4, imports it into the nucleus
  and stimulates its activity, and LIG4 in turn helps localize XRCC4 and XLF. XRCC4-LIG4 is recruited
  to Ku- and DNA-PKcs-bound DNA ends and, with XLF and PAXX, forms long- and short-range synaptic complexes
  in which it ligates the processed ends. The ligase is mechanistically flexible, joining incompatible
  ends and ligating across short gaps. LIG4 completes the joining step of V(D)J recombination and class
  switch recombination as well as repair of radiation-induced breaks, and ligates deprotected telomeres
  into chromosome fusions after loss of TRF2. Loss of Lig4 is late-embryonic lethal in mice, with neuronal
  apoptosis and blocked lymphocyte development; hypomorphic human mutations cause LIG4 syndrome (immunodeficiency,
  microcephaly, growth delay, radiosensitivity) and radiosensitive SCID.
