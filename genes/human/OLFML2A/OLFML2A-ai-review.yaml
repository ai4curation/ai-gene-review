description: OLFML2A (olfactomedin-like protein 2A, photomedin-1) is a secreted, O-glycosylated glycoprotein
  of 652 residues with an N-terminal signal peptide, cysteine-rich CXCXCX9C motifs, a coiled-coil segment,
  a Ser/Thr-rich low-complexity linker and a C-terminal olfactomedin (OLF) domain. With its paralog OLFML2B
  (photomedin-2) it forms a distinct olfactomedin subfamily. The characterized mouse ortholog is secreted
  as a disulfide-linked homodimer that is proteolytically processed in the middle of the molecule after
  secretion, and it binds sulfated glycosaminoglycans, preferentially chondroitin sulfate E and heparin,
  so it is thought to associate with proteoglycan-rich extracellular matrix. It is expressed in retinal
  photoreceptors (mouse) and, in kidney, by podocytes, where it localizes to the major processes. No
  catalytic activity, receptor or specific signaling pathway has been established; cancer studies report
  AP-1-dependent expression and expression-prognosis associations rather than a molecular mechanism.
