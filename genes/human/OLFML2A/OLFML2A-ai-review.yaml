  review:
    action: KEEP_AS_NON_CORE
    summary: Photomedin-1 forms disulfide-linked homodimers.
    reason: The mouse biochemical experiments directly distinguish dimeric photomedin-1 from multimeric
      photomedin-2. Conserved self-association supports this ortholog transfer, but it describes assembly
      state rather than the principal extracellular binding activity.
