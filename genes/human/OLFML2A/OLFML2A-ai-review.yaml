suggested_questions:
- question: Does human OLFML2A bind chondroitin sulfate E and heparin with affinities comparable to the
    mouse protein, and which region (OLF domain or N-terminal cysteine-rich/coiled-coil region) mediates
    glycosaminoglycan binding?
- question: Is the family-root IBA for signal transduction (PTN000573635) justified for the OLFML2 subfamily,
    given that its donors derive from the myocilin subfamily?
suggested_experiments:
- description: Quantitative binding (SPR or glycan microarray) of purified human OLFML2A and its post-secretion
    cleavage fragments to chondroitin sulfate E, heparin and other glycosaminoglycans.
- description: Identify native extracellular binding partners of OLFML2A in retina and kidney podocytes
    by proximity labeling or affinity purification-mass spectrometry.
