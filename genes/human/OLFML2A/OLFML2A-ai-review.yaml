  review:
    action: UNDECIDED
    summary: Family-root IBA for signal transduction; no OLFML2-subfamily evidence for or against it.
    reason: The IBD was placed at PTN000573635, the bilaterian root of PTHR23192, from three donors, human
      myocilin (UniProtKB:Q99972) and two mouse genes, one of which (MGI:1202864) also seeds the myocilin-specific
      node PTN002754680, so the signaling evidence comes from outside the OLFML2 subfamily. OLFML2A is inside the clade that inherits the node, so the inference
      is formally valid, and there is no evidence of loss in the OLFML2 subfamily. Equally, no experiment
      on OLFML2A or OLFML2B connects them to a signal transduction mechanism; the only signaling data
      (AP-1 regulation of OLFML2A expression in breast cancer cells) place OLFML2A downstream of a transcription
      factor, not as a participant in signal transduction. The PAINT curators placed other myocilin-derived
      terms (Golgi, osteoblast differentiation) at the myocilin node only, so the root placement of this
      broad term was deliberate. Without subfamily evidence the claim can be neither confirmed nor refuted
      for OLFML2A.
