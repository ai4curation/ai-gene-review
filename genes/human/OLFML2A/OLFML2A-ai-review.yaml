  review:
    action: ACCEPT
    summary: Photomedin-1 binds extracellular glycosaminoglycans.
    reason: The original mouse study tested a panel of ECM substrates and detected preferential binding
      to chondroitin sulfate E and heparin. This biochemical function supports transfer to human OLFML2A;
      it does not establish a matrix-assembly role.
