  label: Homo sapiens
description: OLFML2A (photomedin-1) is a secreted olfactomedin-domain glycoprotein associated with the
  extracellular matrix. Characterized mammalian photomedin-1 binds the glycosaminoglycans chondroitin
  sulfate E and heparin and forms disulfide-linked homodimers. Its extracellular interactions are better
  established than a specific role in matrix assembly or a defined signaling pathway.
