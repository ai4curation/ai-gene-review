  review:
    action: UNDECIDED
    summary: A specific signaling function for OLFML2A is not resolved by the photomedin experiments.
    reason: The IBA represents a phylogenetic placement of signaling function, not a weak donor-count
      inference. The available OLFML2A-specific experiments demonstrate secretion, dimerization and glycosaminoglycan
      binding but do not establish the signaling mechanism inherited at this node. These data do not refute
      the IBA; retain uncertainty pending evidence connecting OLFML2A to that ancestral signaling role.
    supported_by:
