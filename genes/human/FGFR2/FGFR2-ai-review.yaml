suggested_questions:
  - question: Which endogenous human FGFR2 splice products mediate the
      documented nuclear and intracellular receptor pools, and how do their
      activities differ from membrane-receptor signaling? Existing localization
      papers and engineered retention mutants should be resolved separately from
      natural-product identities.
  - question: What physiological functions are established for soluble P21802-14
      and P21802-19? Their documented secretion does not by itself demonstrate a
      decoy mechanism.
  - question: Does the FCER2–FGFR2 extracellular-screen association remain
      specific after the original study’s promiscuous-hit controls, and is there
      pair-specific orthogonal evidence distinct from the aggregate validation
      rate?
