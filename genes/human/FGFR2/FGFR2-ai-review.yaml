  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  FGFR2 is a fibroblast growth factor receptor tyrosine kinase. Membrane-spanning
  receptors bind extracellular FGFs with heparan sulfate-dependent modulation, dimerize
  and couple tyrosine phosphorylation to pathways including RAS–MAPK and PLCG1. These
  signals regulate proliferation, differentiation and tissue morphogenesis, including
  skeletal and branching-organ development. Alternative IIIb/IIIc exon use changes
  part of the third extracellular immunoglobulin-like domain and alters, rather than
  completely separates, ligand preferences: FGF1 can activate both receptor forms;
  FGF7 and FGF10 preferentially stimulate IIIb, whereas FGF2 and FGF9 favor IIIc in
  established receptor assays. IIIb/KGFR and IIIc/BEK are often associated with epithelial
  and mesenchymal expression, respectively, with context-dependent expression and
  signaling. Human FGFR2 variants cause craniosynostosis syndromes. Alternative splicing
  also produces soluble receptors and other forms whose physiological activities are
  less completely established than those of the principal membrane receptors.
