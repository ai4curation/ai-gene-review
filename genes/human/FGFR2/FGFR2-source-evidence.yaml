reactome_scope: Participant responses establish target-containing entity membership, not that FGFR2 performs
  every event named by its pathway or complex. Most entities are membrane receptors/complexes; R-HSA-109699
  also has a cytosol-labelled PI3K-containing complex. Mutant, fusion and mixed-species models are not
  assigned to every natural human splice product.
primary_source_locators:
  PMID:10618369:
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC26614/
    read_scope: Methods and structural Results; human FGF1 with recombinant FGFR2IIIc extracellular fragment;
      1:1 solution complex and crystallographic contacts. No natural-product-wide inference.
  PMID:11390973:
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC34643/
    read_scope: Original Results and Figure 1/2 captions describing S252W/P253R interactions with FGF2;
      complete construct Methods not recovered.
  PMID:8663044:
    url: https://doi.org/10.1074/jbc.271.25.15292
    original_pdf_sha256: 8937c09018162c13f1607605312d5f6e957f85ca5d023ebd4811f71c35dd52f4
    read_scope: Original Table I, Materials, FGFR-expression Methods, Results, Figure 1/3 captions and
      Table II; human FGFR2b versus mouse FGFR2c in murine BaF3 recipients. FGF1 is shared; mitogenic
      potency is assay-dependent and is not a binding constant.
  PMID:16844695:
    url: https://doi.org/10.1074/jbc.M600722200
    read_scope: Author-posted original Methods, Results and Figures 1–5, 7–10 captions; human FGFR2IIIc
      NM_000141 constructs in murine MC3T3-E1 and COS7 cells. Glycosylation/C278F mutants have context-dependent
      retention, dimerization and PLCG1 responses. Figure pixels not inspected; engineered mutants are
      not natural splice products.
  PMID:17959718:
