      with phosphatase inhibition. FGFR1 co-IP EV1E/EBI-34210268 and FGFR1/FGF2 AP-MS EBI-32718470 are
      associations; GRB2 EBI-32721907 is BioID proximity, not direct-affinity proof.
  PMID:35922511:
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC9365698/
    read_scope: Original screening/processing Methods and exact author workbook target cells. MOESM4 Table
      1 A498/B498 and A566/B566 identify FGFR2 and FCER2; raw reciprocal Table 2 cells JL302=1.9277 and
      QS323=1.5548. MOESM6 Figure1_network row 165 gives Sum_medpol=3.3822, Expected=0; Figure1_heatmap
      rows15080/15478 use a different processed metric. Methods explicitly name FGFRs among recurrent
      nonspecific candidates. Neither Expected=0 nor network presence settles physiological specificity;
      no pair-specific SPR/cell validation was verified.
