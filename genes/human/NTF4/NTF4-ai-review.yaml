id: P34130
gene_symbol: NTF4
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NTF4 encodes neurotrophin-4, also called NT-4/5, a secreted neurotrophin that binds and
  activates Trk-family receptors, especially NTRK2/TrkB. It supports sensory and sympathetic neuron survival,
  contributes to TrkB-dependent neuronal development and plasticity, and has contextual roles in gustatory,
  skin and tooth development.'
