- term:
    id: GO:0008021
    label: synaptic vesicle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN001697725
  - RGD:2202
  review:
    summary: The synaptic-vesicle IBA is too specific for secreted dense-core neurotrophins.
    action: MARK_AS_OVER_ANNOTATED
    reason: PTN001697725 propagates GO:0008021 synaptic vesicle across the family, but neurotrophins
      are secreted growth factors packaged in regulated secretory and dense-core vesicles rather
      than classical small synaptic vesicle proteins.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The family-level synaptic-vesicle node is too specific for neurotrophin secretory
          cargo.
        source_id: PANTHER:PTN001697725
