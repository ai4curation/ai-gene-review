      reference_id: file:human/GEMIN7/GEMIN7-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Nucleus, nucleoplasm'
    - &id016
      reference_id: PMID:20513430
      supporting_text: SMN, Gemins 2, 6, 7 and 8 accumulated in the nucleus, whereas Gemins 3, 4, 5 and
        unrip remained in the cytoplasm
