    label: nucleoplasm
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    summary: GEMIN7 has a nuclear pool, in the nucleoplasm and concentrated in gems, alongside SMN.
    action: KEEP_AS_NON_CORE
    reason: Nuclear SMN-complex pools (including GEMIN7) are well documented, and GEMIN7 accumulates in
      the nucleus with SMN, GEMIN2, 6 and 8 when protein synthesis is inhibited. The core snRNP assembly
      function is cytoplasmic, so the nuclear location is retained as non-core.
    supported_by:
