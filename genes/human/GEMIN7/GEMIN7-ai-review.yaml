core_functions:
- description: Sm-fold subunit of the SMN complex that heterodimerises with GEMIN6 and, via GEMIN8, docks
    the GEMIN6-GEMIN7 heterodimer onto the SMN core, contributing structure to SMN-complex-catalysed assembly
    of Sm cores on spliceosomal snRNAs in the cytosol.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  directly_involved_in:
  - id: GO:0000387
    label: spliceosomal snRNP assembly
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0032797
    label: SMN complex
  supported_by:
  - *id006
  - *id007
  - *id005
  - *id013
  - *id004
suggested_questions:
- question: Does the GEMIN6-GEMIN7 heterodimer act as a placeholder or template for Sm proteins (e.g.
    SmE/SmD2 positions) during ring assembly, and is it displaced by specific Sm proteins?
- question: PAINT propagates only Sm-like protein family complex (GO:0120114) from node PTN001027441,
    not SMN complex (GO:0032797). Is this deliberate because the fission yeast complex lacks Gemin3/4/5,
    and should mammalian-clade members carry SMN complex by IBA from a shallower node?
suggested_experiments:
- description: Reconstitute SMN complexes lacking GEMIN7, or carrying GEMIN7 interface mutants that disrupt
    GEMIN6 or GEMIN8 binding, and measure Sm core assembly kinetics on snRNA to determine whether GEMIN7
    contributes beyond recruiting GEMIN6.
