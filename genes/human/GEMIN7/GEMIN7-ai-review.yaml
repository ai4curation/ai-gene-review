id: Q9H840
gene_symbol: GEMIN7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GEMIN7 (gem-associated protein 7) is a small (131 aa) subunit of the survival of motor neuron
  (SMN) complex, the cytoplasmic machinery that assembles the heptameric Sm protein ring onto small nuclear
  RNAs to form the cores of spliceosomal U snRNPs. Its C-terminal region adopts an Sm fold and forms an
  obligate heterodimer with the Sm-fold protein GEMIN6 through an Sm-Sm-like beta-sheet interface; the
  GEMIN6-GEMIN7 heterodimer is recruited to the SMN oligomer by GEMIN8, and GEMIN7 additionally contacts
  unrip/STRAP and Sm proteins, particularly SmE. GEMIN7 thereby links GEMIN6 and the unrip module to the
  SMN-GEMIN8 core and is thought to help organise Sm proteins for ring assembly. No catalytic or direct
  RNA-binding activity has been shown for GEMIN7 itself. It is found in the cytoplasm, in the nucleoplasm
  and in nuclear gems with SMN. The gemin-7 family is conserved to fission yeast, where the Gemin6/7/8
  sub-complex has the same architecture and is essential.
existing_annotations:
- term:
    id: GO:0000387
    label: spliceosomal snRNP assembly
  evidence_type: EXP
  original_reference_id: PMID:12067652
  qualifier: involved_in
  review:
    summary: GEMIN7 is a core subunit of the SMN complex, the machine that loads the Sm protein ring onto
      snRNAs to form spliceosomal snRNP cores; it is therefore a direct participant in spliceosomal snRNP
      assembly.
    action: ACCEPT
    reason: Within the SMN complex, the GEMIN6-GEMIN7 Sm-fold heterodimer binds Sm proteins (notably SmE)
      and is positioned on the SMN/Gemin8 core, so GEMIN7 contributes structure to the step that the complex
      catalyses. This is a structural/organising contribution to a complex-level catalytic activity, not
      an independent enzymatic activity of GEMIN7. The cited 2002 review (Paushkin et al.) describes the
      SMN complex with Gemins 2-6 and predates/does not discuss GEMIN7 in its abstract, so the EXP code
      is weakly matched to this reference; the claim itself is well supported by the primary GEMIN7 papers,
      and the curator's assignment is deferred to.
    supported_by:
    - &id001
      reference_id: PMID:12065586
      supporting_text: Coimmunoprecipitation and immunolocalization experiments demonstrate that Gemin7
        is a component of the SMN complex and colocalizes with SMN in the cytoplasm and in gems.
    - &id002
      reference_id: PMID:12065586
      supporting_text: Gemin7 interacts with several Sm proteins of spliceosomal small nuclear ribonucleoproteins,
        in particular, with SmE.
    - &id003
      reference_id: PMID:15939020
      supporting_text: binding experiments that show that the Gemin6/Gemin7 complex binds to Sm proteins
    - &id004
      reference_id: PMID:18984161
      supporting_text: The SMN complex subsequently binds to these Sm protein units, dissociates pICln,
        and catalyzes ring closure on snRNA.
    - &id005
      reference_id: PMID:17178713
      supporting_text: Our studies reveal a modular composition of the SMN complex with the three proteins
        SMN, Gemin8, and Gemin7 in its center.
