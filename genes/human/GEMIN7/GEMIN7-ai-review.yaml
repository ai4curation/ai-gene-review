- term:
    id: GO:0000398
    label: mRNA splicing, via spliceosome
  evidence_type: TAS
  original_reference_id: PMID:12065586
  qualifier: involved_in
  review:
    summary: GEMIN7 contributes to pre-mRNA splicing only indirectly, by helping produce the spliceosomal
      snRNPs; it is not a spliceosome component.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'GEMIN7 does no part of the splicing reaction itself: it acts in cytoplasmic snRNP core assembly,
      upstream of spliceosome formation, and the SMN complex is evicted when snRNA binds the Sm proteins.
      The informative, accurate process is spliceosomal snRNP assembly (GO:0000387), which is accepted.
      Annotating splicing itself is an upstream-effect over-annotation.'
    supported_by:
    - &id014
      reference_id: file:human/GEMIN7/GEMIN7-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: The SMN complex catalyzes the assembly of small nuclear'
    - *id004
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR047575
  review:
    summary: InterPro2GO mapping from the generic Sm domain signature (IPR047575).
    action: MARK_AS_OVER_ANNOTATED
    reason: GEMIN7 has an Sm fold, but in GEMIN7 the fold mediates Sm-like protein-protein interactions
      (heterodimerisation with GEMIN6 and contacts with Sm proteins). No direct RNA binding by GEMIN7
      has been demonstrated in the available literature; RNA recognition within the SMN complex is attributed
      to other subunits (e.g. GEMIN5) and the Sm proteins. The domain-based RNA binding inference therefore
      exceeds the evidence.
    supported_by:
    - &id006
      reference_id: PMID:15939020
      supporting_text: Gemin6 and Gemin7 exist as a heterodimer, and interact with each other via an interface
        similar to that which mediates interactions among the Sm proteins.
    - *id003
