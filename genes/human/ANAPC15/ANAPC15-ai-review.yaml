- id: PMID:21926987
  title: APC15 drives the turnover of MCC-CDC20 to make the spindle assembly checkpoint responsive to
    kinetochore attachment.
  findings:
  - statement: APC15 is needed for CDC20/MCC turnover but not for APC/C activity per se.
    supporting_text: We show that the APC/C subunit APC15 is required for the turnover of the APC/C co-activator
      CDC20 and release of MCCs during SAC signalling but not for APC/C activity per se.
  - statement: Without APC15 the MCC stays locked on the APC/C.
    supporting_text: In the absence of APC15, MCCs and ubiquitylated CDC20 remain 'locked' onto the APC/C,
      which prevents the ubiquitylation and degradation of cyclin B1 when the SAC is satisfied.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Founding human APC15 study (RNAi, live imaging).
- id: PMID:23007861
  title: APC15 mediates CDC20 autoubiquitylation by APC/C(MCC) and disassembly of the mitotic checkpoint
    complex.
  findings:
  - statement: APC15 is required for APC/C(MCC)-dependent CDC20 autoubiquitylation, not substrate ubiquitylation.
    supporting_text: APC15 is located near APC/C's MCC binding site; it is required for APC/C-bound MCC
      (APC/C(MCC))-dependent CDC20 autoubiquitylation and degradation and for timely anaphase initiation
      but is dispensable for substrate ubiquitylation by APC/C(CDC20) and APC/C(CDH1).
  - statement: APC15 is a human APC/C subunit related to yeast Mnd2.
    supporting_text: Here we characterize APC15, a human APC/C subunit related to yeast Mnd2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Biochemistry with recombinant human APC/C.
- id: PMID:22940250
  title: The APC/C subunit Mnd2/Apc15 promotes Cdc20 autoubiquitination and spindle assembly checkpoint
    inactivation.
  findings:
  - statement: Yeast Mnd2/Apc15 is required for SAC-dependent Cdc20 autoubiquitination.
    supporting_text: SAC-dependent Cdc20 autoubiquitination required the Mnd2/Apc15 subunit of the APC/C.
  - statement: Mnd2 deletion delays release from SAC arrest.
    supporting_text: Specific inhibition of SAC-dependent ubiquitination, by deletion of Mnd2, allowed
      establishment of a SAC arrest but delayed release from the arrest, suggesting that Cdc20 ubiquitination
      is also required for SAC inactivation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Budding-yeast reconstitution; the role is conserved.
