- term:
    id: GO:0090266
    label: regulation of mitotic cell cycle spindle assembly checkpoint
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001096157
  - UniProtKB:P60006
  review:
    summary: 'Regulation of mitotic spindle assembly checkpoint (IBA). Correct, but the direction is known
      in both human and yeast: APC15/Mnd2 silences the checkpoint. Modified to the negative-regulation
      child.'
    action: MODIFY
    reason: APC15 drives CDC20 and MCC turnover on the APC/C during checkpoint signalling [PMID:21926987
      "We show that the APC/C subunit APC15 is required for the turnover of the APC/C co-activator CDC20
      and release of MCCs during SAC signalling but not for APC/C activity per se."]; without it the MCC
      stays locked on the APC/C and cyclin B1 is not degraded once the checkpoint is satisfied [PMID:21926987
      "In the absence of APC15, MCCs and ubiquitylated CDC20 remain 'locked' onto the APC/C, which prevents
      the ubiquitylation and degradation of cyclin B1 when the SAC is satisfied."]. The yeast ortholog
      Mnd2 is likewise needed to release the arrest [PMID:22940250 "Specific inhibition of SAC-dependent
      ubiquitination, by deletion of Mnd2, allowed establishment of a SAC arrest but delayed release from
      the arrest, suggesting that Cdc20 ubiquitination is also required for SAC inactivation."], so checkpoint
      silencing (GO:0140499, is_a GO:0090266) is the conserved role.
    supported_by:
    - reference_id: PMID:21926987
      supporting_text: We show that the APC/C subunit APC15 is required for the turnover of the APC/C
        co-activator CDC20 and release of MCCs during SAC signalling but not for APC/C activity per se.
    - reference_id: PMID:21926987
      supporting_text: In the absence of APC15, MCCs and ubiquitylated CDC20 remain 'locked' onto the
        APC/C, which prevents the ubiquitylation and degradation of cyclin B1 when the SAC is satisfied.
    - reference_id: PMID:22940250
      supporting_text: Specific inhibition of SAC-dependent ubiquitination, by deletion of Mnd2, allowed
        establishment of a SAC arrest but delayed release from the arrest, suggesting that Cdc20 ubiquitination
        is also required for SAC inactivation.
    proposed_replacement_terms:
    - id: GO:0140499
      label: negative regulation of mitotic spindle assembly checkpoint signaling
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      residue_claims_not_applicable: APC15 is a non-catalytic subunit; the propagated term makes no residue-level
        claim.
