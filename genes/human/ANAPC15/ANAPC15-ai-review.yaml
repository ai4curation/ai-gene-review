id: P60006
gene_symbol: ANAPC15
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANAPC15 (APC15, Mnd2 in budding yeast) is a small subunit of the anaphase-promoting complex/cyclosome
  (APC/C), the E3 ubiquitin ligase that triggers anaphase and mitotic exit. APC15 sits near the binding
  site for the mitotic checkpoint complex (MCC), the spindle assembly checkpoint inhibitor that holds
  the APC/C coactivator CDC20 in check. APC15 is needed for the APC/C to autoubiquitylate CDC20 within
  the MCC, which continuously disassembles the inhibitor so that the APC/C can switch on quickly once
  all kinetochores are attached. It is dispensable for ubiquitylation of ordinary substrates. Loss of
  APC15 delays anaphase onset in mitosis and arrests mouse oocytes at metaphase I.
