    supporting_text: Knockdown of APC15 via siRNA did not affect spindle organization, but led to meiotic
      arrest at metaphase I (MI) and impaired the removal of BUB3 from kinetochores, suggesting a disruption
      in Spindle Assembly Checkpoint (SAC) inactivation.
  reference_review:
