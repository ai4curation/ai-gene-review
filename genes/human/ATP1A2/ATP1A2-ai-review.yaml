id: P50993
gene_symbol: ATP1A2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP1A2 encodes the catalytic alpha2 subunit of the sodium/potassium ATPase. In
  association with beta subunits, it uses ATP to export sodium and import potassium across
  the plasma membrane. Its ion gradients support excitability, muscle calcium handling and
  glial neurotransmitter clearance. Loss of pump function is associated with familial hemiplegic
  migraine and related neurological phenotypes.
