id: Q3KP44
gene_symbol: ANKRD55
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD55 (ankyrin repeat domain-containing 55) is an ankyrin-repeat protein expressed mainly
  in CD4+ T cells, encoded at a multiple-sclerosis and autoimmune risk locus whose risk allele raises
  its expression. In T cells it binds subunits of the CCT chaperonin and promotes CCT assembly, supporting
  microtubule organization at the immune synapse and T cell receptor signaling, and it associates with
  mitochondria and sustains mitochondrial respiration. Mice lacking Ankrd55 have impaired Th17 differentiation
  and IL-17 production and are protected from experimental autoimmune encephalomyelitis and T cell-mediated
  colitis. Human ANKRD55 isoforms were reported to be predominantly nuclear in an earlier study, whereas
  imaging of the endogenous protein places it at the centrosome and mitochondria.
