  review:
    summary: Nucleus (NEW, IDA). In human CD4+ T cells and in Jurkat and U937 cells, ANKRD55 isoforms
      are predominantly nuclear.
    action: NEW
    reason: '[PMID:27183579 "ANKRD55 protein isoforms 005 and 001 were predominantly located in the nucleus
      of CD4(+) T cells and Jurkat and U937 cells."] In mouse T cells, by contrast, [PMID:40932625 "ANKRD55
      was primarily located around but not within the nucleus, and a counterstain with MitoTracker revealed
      a strong co-localization of ANKRD55 and mitochondria"], so the nuclear pool may be isoform- or species-dependent;
      both locations are recorded.'
