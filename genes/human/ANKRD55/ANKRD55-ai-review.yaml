- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:27183579
  qualifier: located_in
  review:
    summary: Nucleus (NEW, IDA). In human CD4+ T cells and in Jurkat and U937 cells, ANKRD55 isoforms
      are predominantly nuclear.
    action: NEW
    reason: '[PMID:27183579 "ANKRD55 protein isoforms 005 and 001 were predominantly located in the nucleus
      of CD4(+) T cells and Jurkat and U937 cells."] Later work in the same Jurkat line imaged endogenous
      ANKRD55 at the centrosome [PMID:41090353 "ANKRD55 and TCP1 not only aggregated near the centrosomes,
      but also colocalized in the centrosomes"], and the 2019 study found ANKRD55 in all three fractions
      [PMID:31620119 "Thus, western blot analysis of biochemically fractionated cells revealed presence
      of the isoforms 001 and 005 of ANKRD55 in all three analyzed subcellular compartments of both cell
      lines"] yet by imaging [PMID:31620119 "ANKRD55 was poorly detectable in the nucleus, despite its
      presence in biochemically or sucrose-gradient obtained nuclear fractions"] Both 2025 studies imaged
      endogenous human ANKRD55 and found it outside the nucleus (centrosome in Jurkat; mitochondria in
      TH17 cells), and the one nuclear signal there was attributed to possible contamination: [PMID:40932625
      "it is unclear whether this represents a true association or minor mitochondrial contamination,
      as we also observed low levels of the mitochondrial channel VDAC1 in nuclear extracts"] The predominantly
      nuclear 2016 signal may therefore reflect the tagged constructs used rather than the endogenous
      protein; the nuclear row is kept, but the localization is not settled.'
    supported_by:
    - reference_id: PMID:27183579
      supporting_text: ANKRD55 protein isoforms 005 and 001 were predominantly located in the nucleus
