suggested_questions:
- question: Is endogenous ANKRD55 centrosomal, mitochondrial or both in human T cells (the two 2025 studies
    used different cell types), and is the 2016 nuclear localization a property of tagged constructs?
- question: How do ANKRD55's two proposed mechanisms, CCT assembly at the immune synapse and support of
    mitochondrial respiration, relate to each other?
suggested_experiments:
- description: Localize endogenous ANKRD55 isoforms in primary human CD4+ T cells against nuclear and
    mitochondrial markers, and test which isoform rescues Th17 function in Ankrd55-deficient cells.
