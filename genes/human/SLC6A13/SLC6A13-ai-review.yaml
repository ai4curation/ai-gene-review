suggested_questions:
- question: >-
    Is GAT-2 a significant contributor to GABA transport across the human
    blood-brain barrier / leptomeninges in vivo, and what solutes does it move
    there?
- question: >-
    What is the physiological significance of GAT-2-mediated guanidinoacetate
    uptake for cerebral creatine/guanidinoacetate homeostasis, given GAT-2 and
    GAT-3 are the major astrocytic GAA transporters?
suggested_experiments:
- description: >-
    Cell-surface biotinylation plus confocal imaging of endogenously tagged GAT-2
    in polarized kidney/liver epithelial cells to confirm basolateral targeting and
    to test the unverified HPA mitochondrial signal.
- description: >-
    Quantitative flux assays (radiolabeled or stable-isotope) comparing GABA,
    beta-alanine, taurine, guanidinoacetate and creatine uptake by human GAT-2 in a
    single expression system, to delineate the physiological substrate ranking and
    confirm creatine is not transported.
