id: Q9NSD5
gene_symbol: SLC6A13
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC6A13 encodes GABA transporter 2 (GAT-2), a plasma-membrane, multi-pass
  (12-transmembrane) member of the SLC6 (neurotransmitter:sodium symporter, NSS)
  family. It is a secondary-active, Na+- and Cl--dependent symporter that couples
  uphill cellular uptake of gamma-aminobutyric acid (GABA) to the inward movement
  of 2 Na+ and 1 Cl- down their electrochemical gradients. Compared with the
  neuronal GABA transporters GAT-1 and GAT-3, GAT-2 has a broader substrate scope,
  also transporting beta-alanine (experimentally), taurine and hypotaurine (by
  similarity), and guanidinoacetate, and it can take up the heme precursor
  5-aminolevulinic acid. GAT-2 is a high-selectivity, low-affinity carrier that
  resists inhibition by typical GABAergic drugs. It is expressed mainly in
  peripheral tissues (liver, kidney, lung, testis, retina) and at the
  leptomeningeal/blood-brain barrier interface, where it contributes to GABA and
  organic-solute homeostasis rather than to synaptic neurotransmitter reuptake. In
  polarized epithelia it localizes to the basolateral membrane.
