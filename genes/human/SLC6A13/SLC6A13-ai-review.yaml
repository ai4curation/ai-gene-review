  review:
    summary: Creatine transport is not a GAT-2 function; the dedicated creatine transporter is SLC6A8/CRT.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This is an ISS transfer from a rodent ortholog. GAT-2 transports the creatine
      precursor guanidinoacetate (GAA), not creatine itself; the dedicated creatine
      transporter is SLC6A8 (CRT). In the GAA transport study, creatine (a CRT
      substrate) had little inhibitory effect on GAT-2-mediated uptake, arguing
      against creatine being a GAT-2 substrate.
