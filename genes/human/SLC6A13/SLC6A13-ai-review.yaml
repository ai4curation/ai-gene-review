    reason: >-
      GAT-2 is a plasma-membrane, 12-TM neurotransmitter:sodium symporter whose
      surface localization is supported by direct evidence, IBA, IEA, ISS and
      Reactome. A lone HPA immunofluorescence mitochondrial call is most likely an
      antibody/imaging artifact and is not corroborated by any targeting sequence
