core_functions:
- description: >-
    GAT-2 is a secondary-active, Na+- and Cl--dependent symporter that mediates
    cellular uptake of GABA, coupling inward movement of GABA to co-transport of 2
    Na+ and 1 Cl- (UniProt Rhea RHEA:70687). It is a high-selectivity, low-affinity
    carrier (KM for GABA in the low-micromolar range) whose transport is strictly
    dependent on both Na+ and Cl-. The same transport machinery also carries
    related small substrates (beta-alanine experimentally; taurine/hypotaurine by
    similarity; guanidinoacetate; 5-aminolevulinic acid), but GABA symport is the
    defining function. It acts at the plasma membrane and, in polarized epithelia,
    at the basolateral membrane.
  molecular_function:
    id: GO:0005332
    label: gamma-aminobutyric acid:sodium:chloride symporter activity
  directly_involved_in:
  - id: GO:0051939
    label: gamma-aminobutyric acid import
  - id: GO:0089718
    label: amino acid import across plasma membrane
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0016323
    label: basolateral plasma membrane
  substrates:
  - id: CHEBI:59888
    label: 4-aminobutanoate (GABA)
  - id: CHEBI:29101
    label: sodium(1+)
  - id: CHEBI:17996
    label: chloride
  supported_by:
  - reference_id: PMID:17502375
    supporting_text: The transport was saturable and dependent on both Na(+) and Cl(-).
    reference_section_type: ABSTRACT
  - reference_id: PMID:22932902
    supporting_text: high selectivity/low affinity transporter that is resistant to inhibition by typical GABAergic inhibitors
    reference_section_type: ABSTRACT
  - reference_id: file:human/SLC6A13/SLC6A13-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Mediates sodium- and chloride-dependent transport of gamma-aminobutyric acid (GABA)
