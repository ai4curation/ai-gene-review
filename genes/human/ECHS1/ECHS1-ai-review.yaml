core_functions:
- description: Catalyzes mitochondrial enoyl-CoA hydration, including crotonyl-CoA conversion to 3-hydroxybutanoyl-CoA
    during fatty acid beta-oxidation and methacrylyl-CoA conversion to 3-hydroxyisobutyryl-CoA during
    valine catabolism. Acryloyl-CoA hydration yields 3-hydroxypropionyl-CoA and is a distinct experimentally
    supported reaction of the same enzyme.
