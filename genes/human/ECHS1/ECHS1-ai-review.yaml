      pathways, with highest specificity for crotonyl-CoA and lowest for tiglyl-CoA, spanning fatty
      acid beta-oxidation and branched-chain amino acid catabolism.
    supporting_text: Human ECHS1 catalyses the hydration of five substrates via different metabolic
      pathways, with the highest specificity for crotonyl-CoA and the lowest specificity for tiglyl-CoA.
