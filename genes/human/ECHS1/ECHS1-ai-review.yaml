suggested_questions:
- question: How much do fatty-acid, valine and lysine-derived substrates contribute to ECHS1-dependent
    flux in different human tissues and metabolic states?
- question: Does the reported ECHS1–STAT3 interaction regulate signaling independently of hydratase
    activity, and where does that interaction occur?
- question: What proportion of ECHS1-deficiency pathology is caused by reactive valine-pathway intermediates
    and protein methacrylation, compared with loss of fatty acid oxidation?
suggested_experiments:
- description: Combine isotope tracing of valine, fatty acids and lysine in patient-derived cells
    and matched ECHS1 rescue lines with acyl-CoA measurements to distinguish pathway flux from changes
    in shared metabolite pools.
- description: Compare sequence-verified catalytic-site mutants and wild-type ECHS1 for hydratase
    activity, mitochondrial import and STAT3 interaction, controlling for protein abundance and folding.
- description: Test the ortholog-inferred delta(3)-delta(2)-enoyl-CoA isomerase activity using purified
    human ECHS1 and defined 3-enoyl-CoA substrates.
