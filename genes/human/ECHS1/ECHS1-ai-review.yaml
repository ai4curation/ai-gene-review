      normal cache. Operative Methods, Results, Table 2 and Figure 4 support human ECHS1 substrate
      chemistry using a 51-fold partially purified HEK293-derived preparation. Direct hydration assays
      are distinguished from methacrylyl-CoA measurement coupled to rat HIBCH. Acryloyl and methacrylyl
      substrates are chemically distinct, and nonzero weak tiglyl turnover does not establish dominant
      human isoleucine flux. Inherited excerpt access flags describe the old cache and remain unchanged.
