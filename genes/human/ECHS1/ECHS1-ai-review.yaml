id: P30084
gene_symbol: ECHS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ECHS1 is a short-chain enoyl-CoA hydratase in the mitochondrial matrix. It catalyzes
  reversible hydration of enoyl-CoA thioesters, including crotonyl-CoA in fatty acid beta-oxidation
  and methacrylyl-CoA in valine catabolism. Human enzyme assays also demonstrate hydration of acryloyl-CoA,
  3-methylcrotonyl-CoA and, less efficiently, tiglyl-CoA; this substrate range does not by itself
  establish equal contributions to the corresponding pathways in vivo. ECHS1 is synthesized as a 290-amino-acid
  precursor with a cleaved mitochondrial targeting sequence. Biallelic loss-of-function variants cause
  ECHS1 deficiency, a mitochondrial encephalopathy associated with impaired valine metabolism and
  accumulation of reactive acyl-CoA intermediates.
