suggested_questions:
- question: Should CD8 alpha-beta coreceptors be annotated part_of T cell receptor complex (GO:0042101),
    given that the term definition lists only the TCR heterodimer and CD3 chains, while CD8 beta promotes
    constitutive association of CD8 with TCR/CD3? The CD8A and CD8B reviews currently treat this row differently.
- question: Is a GO cellular component for the CD8 alpha-beta heterodimer (analogous to existing receptor
    complex terms) wanted, so that the obligate CD8A-CD8B pairing can be recorded without generic protein
    binding rows?
- question: Do the secreted CD8 beta splice isoforms (lacking the transmembrane exon) produce a soluble
    protein in vivo, and does it have any function?
suggested_experiments:
- description: Express human CD8B with the membrane-proximal cysteines mutated (C to A) together with
    CD8A in CD8-negative human T cells carrying a defined MHC class I-restricted TCR, and measure raft
    partitioning, CD8-LCK association, TCR-pMHC avidity and antigen sensitivity, to test whether the mouse
    palmitoylation mechanism holds for human CD8 beta.
- description: Determine the structure of human CD8 alpha-beta bound to HLA class I, and test CD8B CDR-like
