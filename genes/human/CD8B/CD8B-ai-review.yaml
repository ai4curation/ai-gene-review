- id: PMID:11714755
  title: CD8beta endows CD8 with efficient coreceptor function by coupling T cell receptor/CD3 to raft-associated
    CD8/p56(lck) complexes.
  findings:
  - statement: The CD8 beta cytoplasmic portion, mainly via palmitoylation, partitions CD8 into lipid rafts
      and couples CD8 to TCR/CD3, increasing TCR avidity for peptide-MHC.
    supporting_text: We find that the cytoplasmic portion of CD8beta, mainly due to its palmitoylation,
      mediates partitioning of CD8 in lipid rafts, where it efficiently associates with p56(lck).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text in cache. Mouse T cell hybridoma system with CD8 beta tail mutants (Cys179
      to Ala, tail truncations). Key mechanistic paper for CD8 beta.
