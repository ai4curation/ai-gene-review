- id: PMID:23533620
  title: The human CD8β M-4 isoform dominant in effector memory T cells has distinct cytoplasmic motifs
    that confer unique properties.
  findings:
  - statement: Humans have four membrane CD8 beta splice variants (M-1 to M-4); M-1 predominates in naive
      and M-4 in effector memory T cells, and the M-4 tail has a leucine-based internalization motif.
    supporting_text: The M-1 isoform which is the equivalent of murine CD8β, is predominantly expressed
      in naïve T cells, whereas, the M-4 isoform is predominantly expressed in effector memory T cells.
  reference_review:
