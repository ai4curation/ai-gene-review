- id: PMID:9647223
  title: The cytoplasmic domain of CD8 beta regulates Lck kinase activation and CD8 T cell development.
  findings:
  - statement: In mouse hybridomas and thymocytes, absence of CD8 beta or deletion of its cytoplasmic
      domain lowers CD8 alpha-associated LCK kinase activity, and the size of the reduction tracks the
      impairment of CD8 single-positive thymocyte development.
    supporting_text: Lack of CD8 beta expression or expression of a cytoplasmic domain-deleted CD8 beta
      resulted in a severalfold reduction in CD8 alpha-associated Lck kinase activity compared with that
      observed with cells expressing wild-type CD8 beta chain.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Irie et al. 1998, J Immunol); abstract only. Mouse knockout and transgenic
      data; used for the description only. The thymocyte development phenotype is necessity evidence and
      is not proposed as a GO process term for CD8B.
