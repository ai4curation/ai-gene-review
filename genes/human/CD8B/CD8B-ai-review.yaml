- id: PMID:23738014
  title: Extracellular domains of CD8α and CD8ß subunits are sufficient for HLA class I restricted helper
    functions of TCR-engineered CD4(+) T cells.
  findings:
  - statement: In human CD4 T cells transduced with HLA class I-restricted TCRs, CD8 alpha-beta (not CD8
      alpha-alpha) is needed for optimal function, and the extracellular domains of both subunits suffice.
    supporting_text: We demonstrate that the co-transduced CD8αβ co-receptor in HLA-I-TCR transduced CD4(+)
      T-cells behaves as an adhesion molecule, since for optimal antigen-specific HLA class I restricted
      CD4(+) T-cell reactivity the extracellular domains of the CD8α and ß subunits are sufficient.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (van Loenen et al. 2013, PLoS One); full text in cache. Human primary
      T cell evidence for the extracellular coreceptor role of CD8 beta. Lead from the falcon deep research
      report.
