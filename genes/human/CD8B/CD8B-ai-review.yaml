- id: PMID:10925291
  title: Essential role of CD8 palmitoylation in CD8 coreceptor function.
  findings:
  - statement: Palmitoylation of the CD8 beta tail partitions CD8 alpha-beta, but not CD8 alpha-alpha,
      into lipid rafts, where CD8 associates with and activates LCK.
    supporting_text: We demonstrate that CD8 is palmitoylated at the cytoplasmic tail of CD8beta and that
      this allows partitioning of CD8alphabeta, but not of CD8alphaalpha, in lipid rafts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Arcaro et al. 2000, J Immunol). Abstract only in cache; mouse T1.4 hybridoma
      system. Primary evidence for the CD8 beta palmitoylation and raft mechanism cited by UniProt for human
      CD8B.
