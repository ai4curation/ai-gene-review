- CD8 beta
- Lyt-3
- CD8B1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CD8B encodes CD8 beta, a single-pass type I transmembrane glycoprotein with an N-terminal
  immunoglobulin V-like domain, a glycosylated stalk, a transmembrane helix and a short cytoplasmic tail.
  CD8 beta does not reach the cell surface on its own; it forms a disulfide-linked heterodimer with CD8
  alpha (CD8A), and the CD8 alpha-beta heterodimer is the T cell coreceptor of conventional MHC class
  I-restricted alpha-beta T cells and thymocytes, whereas CD8 alpha-alpha homodimers are found on intestinal
  intraepithelial T cells, gamma-delta T cells and NK cells. On the T cell, CD8 alpha-beta binds the alpha3
  domain of MHC class I on the antigen-presenting cell at the same time as the T cell receptor (TCR) binds
  the peptide-MHC complex; in the mouse crystal structure the beta subunit contributes about half of the
  buried interface and sits in the T cell membrane-proximal position. CD8 alpha-beta is a much stronger
  coreceptor than CD8 alpha-alpha. The kinase LCK is bound by the CxC zinc-clasp motif of the CD8 alpha
  tail, not by CD8 beta; the CD8 beta tail instead carries a membrane-proximal palmitoylation site that
  partitions the heterodimer into plasma membrane lipid rafts, where LCK is enriched, and it promotes association
  of CD8 with TCR-CD3. Together these increase the avidity of TCR for peptide-MHC class I, the recruitment
  of active LCK to the engaged receptor, and phosphorylation of CD3 ITAMs, which lowers the antigen threshold
  for T cell activation. In mice, loss of CD8 beta or of its cytoplasmic domain reduces CD8 alpha-associated
  LCK activity and impairs development of CD8 single-positive thymocytes. Alternative splicing produces several isoforms that differ in the cytoplasmic tail, and some
  lack the transmembrane segment and are predicted to be secreted. Of the four human membrane isoforms
  (M-1 to M-4), M-1, the equivalent of mouse CD8 beta, predominates in naive T cells and M-4, whose longer
  tail carries a leucine-based internalization motif, predominates in effector memory T cells.
