id: P53004
gene_symbol: BLVRA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BLVRA is the soluble biliverdin IX-alpha reductase (EC 1.3.1.24) that converts biliverdin
  IX-alpha to bilirubin IX-alpha in the cytosolic terminal reduction step of heme catabolism. It uses
  NADPH or NADH with pH-dependent preferences; NADPH is generally favored as the physiological donor.
  Its preference for IX-alpha distinguishes it from the IX-beta reductase BLVRB, although BLVRA also reduces
  some other synthetic biliverdin configurations poorly. Purified human liver BLVRA contains approximately
  one zinc ion per protein molecule, and zinc binding is also demonstrated in recombinant human protein.
  Impaired BLVRA activity can contribute to biliverdin accumulation and hyperbiliverdinemia (green jaundice),
  particularly in the setting of cholestasis or liver failure. Human-cell experiments also report BLVRA
  binding to ERK and supporting MEK–ERK complex assembly and ERK nuclear trafficking.
