id: P53004
gene_symbol: BLVRA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BLVRA is a soluble biliverdin IX-alpha reductase that uses NADH or NADPH to produce bilirubin
  IX-alpha in the cytosolic terminal reduction step of heme catabolism. Human liver and recombinant-enzyme
  studies establish dual cofactor use with pH-dependent preferences; NADPH is generally favored as the
  physiological donor. BLVRA preferentially reduces IX-alpha substrates and contains an N-terminal NAD(P)-binding
  domain. Human liver protein binds zinc. In human-cell signaling experiments, BLVRA also binds ERK, supports
  MEK–ERK complex assembly and participates in ERK nuclear trafficking. These interaction-dependent effects
  are distinct from its biliverdin-reduction chemistry.
