id: Q9NSA1
gene_symbol: FGF21
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FGF21 encodes fibroblast growth factor 21, a secreted, non-mitogenic member of the endocrine
  FGF19 subfamily that functions as a hormone. It is produced mainly by the liver (and also by adipose
  tissue), with expression induced by fasting, ketogenic or high-carbohydrate diets and cellular stress,
  and it circulates because its low heparan-sulfate affinity lets it escape the pericellular matrix. FGF21
  acts on target cells that co-express beta-Klotho (KLB) with FGFR1c (and to a lesser extent FGFR2c/FGFR3c):
  its C-terminal tail binds beta-Klotho with high affinity, while its N-terminal FGF core engages and
  activates the FGFR tyrosine kinase, triggering FRS2alpha and ERK1/2 signaling. Principal targets are
  white and brown adipose tissue, where it increases insulin-independent glucose uptake via GLUT1 induction
  and promotes thermogenic gene expression, and the nervous system (hypothalamus, hindbrain), where it
  drives sympathetic outflow, energy expenditure and adaptive starvation responses. Through these actions
  FGF21 improves glucose and lipid homeostasis and insulin sensitivity.'
