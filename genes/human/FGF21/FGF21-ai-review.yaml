  - ZFIN:ZDB-GENE-980526-178
  review:
    summary: FGF21 engages FGFR1c (and FGFR2c/FGFR3c) through its N-terminal FGF core as part of a ternary
      FGF21-beta-Klotho-FGFR complex; the PAINT node for the FGF ligand family places FGFR binding at
      the family root.
    action: ACCEPT
    reason: FGFR binding is the ancestral and retained molecular activity of the FGF ligand family, and
      FGF21 is inside that clade. FGF21-specific experiments show that the N-terminus contacts and activates
      FGFRs while the C-terminus docks onto beta-Klotho. The direct FGF21-FGFR affinity is weak and physiological
      binding requires beta-Klotho, but the ligand-receptor contact is real and is what triggers receptor
      dimerization and kinase activation. This is the core molecular function used for FGF21 in FGFR signaling.
    additional_reference_ids:
    - PMID:19117008
    - PMID:18187602
    - PMID:29342135
    supported_by:
    - reference_id: PMID:19117008
      supporting_text: the C-terminus is important for betaKlotho interaction whereas the N-terminus likely
        interacts directly with FGF receptors
      reference_section_type: ABSTRACT
      full_text_unavailable: true
    - reference_id: PMID:18187602
      supporting_text: 'FGF21 alone does not activate FGFRs and that betaKlotho is required for FGF21
        to activate two specific FGFR subtypes: FGFR1c and FGFR3c'
      reference_section_type: ABSTRACT
    - reference_id: PMID:29342135
      supporting_text: In this model, β-Klotho functions as a primary high affinity receptor for FGF21,
        whereas FGFR1c functions as a catalytic subunit that mediates receptor dimerization and intracellular
        signaling.
      reference_section_type: RESULTS
