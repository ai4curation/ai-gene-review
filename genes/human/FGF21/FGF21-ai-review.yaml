suggested_questions:
- question: Which FGF21 target-cell populations (adipocytes vs. specific hypothalamic/hindbrain neurons)
    mediate its insulin-sensitizing and glucose-lowering effects in humans, as opposed to rodents?
- question: Does endogenous FGF21 act physiologically on human hepatocytes (e.g. LDLR regulation via IDOL/CNPY2),
    given that hepatocytes express FGFR4 and respond poorly to FGF21?
- question: Should GO represent the FGF21-beta-Klotho interaction with a dedicated ligand-side term, or
    is signaling receptor binding with a KLB extension sufficient, given beta-Klotho acts as the primary
    high-affinity receptor?
- question: Should the endocrine FGF19/21/23 clade be excluded from PAINT propagation of mitogenic, developmental
    (neurogenesis, cell migration) and cytoplasmic annotations inferred at the FGF family root?
suggested_experiments:
- hypothesis: The metabolic actions of FGF21 in humans require beta-Klotho-FGFR1c in adipocytes and specific
    neurons.
  description: Use human iPSC-derived adipocytes and hypothalamic neurons with KLB or FGFR1 knockout,
    and FGF21 C-terminal and N-terminal mutants, to measure FRS2alpha/ERK signaling, GLUT1 induction,
    glucose uptake and neuronal activation.
  experiment_type: Genetic ablation and ligand structure-function in human cell models
- hypothesis: FGF21 regulates hepatic LDL receptor levels in vivo through beta-Klotho-dependent signaling.
  description: Administer FGF21 to hepatocyte-specific Klb- or Fgfr1-deficient mice and measure hepatic
