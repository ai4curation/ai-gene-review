  review:
    summary: IBA propagation of cytoplasm (is_active_in) from the FGF family node.
    action: REMOVE
    reason: The cytoplasmic seeds are intracellular or non-classically released FGFs (e.g. FGF1, FGF2
      and intracellular FGF homologous factors) which act inside cells. FGF21 is a classically secreted
      endocrine hormone with a cleavable signal peptide, and there is no evidence that it acts in the
      cytoplasm. The propagation is inappropriate for the endocrine FGF19/21/23 clade.
