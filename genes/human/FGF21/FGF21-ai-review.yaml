- description: 'Secreted FGF21 acts as the ligand of a beta-Klotho-FGFR1c (also FGFR2c/FGFR3c) receptor
    complex on target cells: the C-terminal tail docks onto beta-Klotho while the N-terminal FGF core
    binds and activates the FGFR kinase, initiating FGF receptor signaling (FRS2alpha/ERK) in adipose
    tissue and brain.'
