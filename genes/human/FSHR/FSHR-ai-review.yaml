core_functions:
- description: >-
    Cell-surface receptor for the pituitary glycoprotein hormone FSH: the leucine-rich-repeat
    ectodomain captures the CGA-FSHB heterodimer and inserts its sulfated hinge tyrosine into
    the bound hormone, activating the seven-transmembrane domain, which engages Gs to raise
    cAMP and additionally drives PI3K/AKT and beta-arrestin-dependent ERK1/2 signalling. This
    is the activity that makes a granulosa or Sertoli cell FSH-responsive, and in the ovary it
    drives antral follicle growth.
