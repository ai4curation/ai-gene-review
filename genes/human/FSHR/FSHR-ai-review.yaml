existing_annotations:
- term:
    id: GO:0001541
    label: ovarian follicle development
  evidence_type: NAS
  original_reference_id: PMID:35002517
  qualifier: involved_in
  review:
    summary: >-
      The defining physiological process of FSHR in the ovary: receptor activity on
      granulosa cells drives follicle growth past the preantral stage, and loss of receptor
      function arrests folliculogenesis in both humans and mice.
    action: ACCEPT
    reason: >-
      This is where the receptor's activity acts, not a downstream side effect: FSHR is
      expressed on the granulosa cells of the growing follicle, and both human loss of
      function and mouse knockout arrest follicle development at the preantral/early antral
      boundary. The cached GO-CAM gomodel:69b3372b00003343 models FSHR activity in
      granulosa cells as part_of this term, which agrees with this reading. The NAS row
      cites a review, but the claim is independently established by the primary literature
      quoted here.
    additional_reference_ids:
    - PMID:9811848
    - PMID:10803590
    - PMID:7553856
    supported_by:
    - reference_id: PMID:35002517
      reference_section_type: RESULTS
      supporting_text: >-
        Female FSHR-/- mice had a small size of uterus and impaired follicular maturation
        with absence of mature follicle.
    - reference_id: PMID:9811848
      reference_section_type: ABSTRACT
      supporting_text: >-
        FSH-R-deficient females display thin uteri and small ovaries and are sterile
        because of a block in folliculogenesis before antral follicle formation.
    - reference_id: PMID:10803590
      reference_section_type: ABSTRACT
      supporting_text: >-
        In conclusion, ovarian follicular development cannot progress beyond the preantral
        stage without FSH.
- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000276
  review:
    summary: >-
      FSHR is a rhodopsin-family GPCR, shown directly by the cryo-EM structure of the
      hormone-bound receptor in complex with heterotrimeric Gs.
    action: ACCEPT
    reason: >-
      Kept rather than called too general, because GO:0004963 does not entail it: the FSH
      receptor activity term sits only under GO:0016500 protein-hormone receptor activity,
      whereas its two siblings GO:0004964 luteinizing hormone receptor activity and
      GO:0004996 thyroid-stimulating hormone receptor activity both also sit under
      GO:0004930 (checked in OLS, 2026-11-13). Until that asymmetry is fixed, which is
      requested in proposed_ontology_changes, this InterPro-derived row is the only one
      asserting that FSHR is a G protein-coupled receptor at all, and the claim is as well
      established as any here.
    supported_by:
    - reference_id: PMID:36720854
      reference_section_type: ABSTRACT
      supporting_text: >-
        Here we report cryo-EM structures of FSHR in both inactive and active states, with
        the active structure bound to FSH and an allosteric agonist compound 21 f.
    - reference_id: PMID:11847099
      reference_section_type: ABSTRACT
      supporting_text: >-
        The glycoprotein hormone receptors (thyrotrophin receptor, TSHr; luteinizing
        hormone/chorionic gonadotrophin receptor, LH/CGr; follicle-stimulating hormone
        receptor, FSHr) constitute a subfamily of rhodopsin-like G protein-coupled
        receptors (GPCRs) with a long N-terminal extracellular extension responsible for
        high-affinity hormone binding.
    - reference_id: file:human/FSHR/FSHR-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the G protein-coupled receptor 1 family.
