  predicate: rdfs:subClassOf
  justification: >-
    GO:0004963 has a single asserted parent, GO:0016500 protein-hormone receptor activity,
    whereas its two sibling terms GO:0004964 luteinizing hormone receptor activity and
    GO:0004996 thyroid-stimulating hormone receptor activity are each asserted under both
    GO:0016500 and GO:0004930 G protein-coupled receptor activity. FSHR is a rhodopsin-family
    GPCR: the cryo-EM structure of the FSH-bound receptor was solved in complex with the Gs
    heterotrimer, and the three glycoprotein hormone receptors are described as coupling
    mainly to Gs. The consequence of the missing edge is that no reasoner or query can infer
    that an FSH receptor activity annotation is a GPCR annotation, while the same query works
    for LHCGR and TSHR; it also means a separate GO:0004930 annotation on FSHR, such as the
    InterPro2GO row in this review, is not redundant and must be kept.
