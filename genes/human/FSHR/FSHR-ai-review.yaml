- id: PMID:1322283
  title: 'Expression of recombinant human follicle-stimulating hormone receptor: species-specific
    ligand binding, signal transduction, and identification of multiple ovarian messenger
    ribonucleic acid transcripts.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. The primary characterization of the cloned human receptor:
      high-affinity FSH binding at the plasma membrane, no response to LH, hCG or TSH, and
      FSH-dependent cAMP accumulation and CRE-driven reporter activity. Used here as the
      human-gene evidence behind the FSH receptor activity, plasma membrane and
      adenylate-cyclase-activating rows.
  findings: []
- id: PMID:7553856
  title: Mutation in the follicle-stimulating hormone receptor gene causes hereditary
    hypergonadotropic ovarian failure.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cache. Maps hypergonadotropic ovarian dysgenesis to FSHR and
      characterizes A189V as reducing binding capacity and signal transduction with
      unchanged affinity. Supports the ovarian rows; the ovarian phenotype it reports is a
      follicular-maturation arrest, which is why the gonad-level term is treated as the
      less informative statement here.
