description: >-
  FSHR (follicle-stimulating hormone receptor, follitropin receptor) is a class A
  rhodopsin-family G protein-coupled receptor of the glycoprotein hormone receptor
  subfamily, alongside LHCGR and TSHR. Its large N-terminal ectodomain comprises a
  leucine-rich-repeat hormone-binding subdomain and a hinge region carrying a sulfated
  tyrosine (Tyr335); the hormone, a heterodimer of CGA and FSHB, is clasped by the concave
  face of the curved repeat domain, and insertion of the sulfotyrosine into a pocket formed
  on the bound hormone completes activation of the seven-transmembrane domain. Receptor
  specificity for FSH over the other glycoprotein hormones resides in this ectodomain, and
  N-glycosylation is required indirectly for high-affinity binding. The activated receptor
  couples principally to Gs, raising cAMP and activating protein kinase A, and additionally
  drives phosphatidylinositol 3-kinase/AKT and ERK1/2 signalling, the latter partly through
  beta-arrestins recruited after GRK phosphorylation; cytoplasmic adaptors including
  14-3-3 theta and APPL1/APPL2 bind its intracellular loops. FSHR acts at the plasma
  membrane of ovarian granulosa cells and testicular Sertoli cells, and after agonist
  binding is internalized into endosomes from which most receptor recycles to the surface.
  In the ovary it drives granulosa proliferation, aromatization and antral follicle growth,
  so loss of function produces hypergonadotropic ovarian dysgenesis with follicular arrest,
  while in the testis it supports Sertoli cell function and quantitatively normal
  spermatogenesis without being essential for fertility. Variants that relax ligand
  selectivity or alter signalling underlie spontaneous ovarian hyperstimulation syndrome.
  Expression and signalling outside the gonads, including osteoclasts, adipocytes,
  pancreatic beta cells and endothelium, have been reported but rest largely on rodent
  models and antibody-based detection that has been questioned.
