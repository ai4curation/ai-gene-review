suggested_questions:
- question: >-
    Does FSHR signal as a higher-order oligomer in a native membrane? The isolated ectodomain
    crystallizes as a dimer and, with the hinge included, as a trimer, and a pharmacological
    model was built on the trimer, but both full-length cryo-EM structures are monomeric and
    bound FSH and Gs would sterically preclude the crystallographic arrangement.
- question: >-
    Should GO organize glycoprotein-hormone binding consistently? GO:0038106
    choriogonadotropin hormone binding sits directly under GO:0042562 hormone binding, while
    GO:0017046 peptide hormone binding, which is the only hormone-binding term available for
    FSHR, carries GO:0043559 insulin binding as a child. A follicle-stimulating hormone
    binding term parallel to the choriogonadotropin one, with a clear convention for whether
    glycoprotein hormones fall under the peptide branch, would remove the ambiguity.
- question: >-
    Which FSHR transcripts are translated into protein in granulosa and Sertoli cells, and do
    the exon-deleted forms do anything? UniProt lists four isoforms, two of which lack
    transmembrane exons, and no GO annotation is isoform-scoped; a dominant-negative or
    ligand-sequestering role for a truncated form has been suggested but not established.
knowledge_gaps:
- gap_statement: >-
    Whether FSHR exists and signals as a higher-order oligomer in the plasma membrane of a
    granulosa or Sertoli cell, and if so whether oligomer dissociation is part of the
    activation mechanism.
  boundary: >-
    Ligand binding, Gs coupling and the sulfotyrosine activation step are established at
    atomic resolution. The isolated ectodomain gives dimers in crystal and solution and a
    trimer with the hinge included; the full-length receptor is monomeric in both the
    inactive and the FSH- and Gs-bound cryo-EM structures, which were solved from detergent
    and membrane preparations rather than intact cells.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The trimer model predicts specific allosteric behaviour, including the threefold changes
    in hormone binding and beta-arrestin recruitment on which small-molecule FSHR modulators
    were rationalized. Whether that mechanism operates in cells determines how biased FSHR
    agonists should be designed and whether the signaling receptor complex annotation
    describes a real assembly.
  resolution: >-
    Single-molecule or super-resolution imaging and cross-linking of endogenous, tagged FSHR
    in primary granulosa cells with and without FSH, with the oligomer state read out
    independently of the detergent used for structure determination.
  provenance:
  - reference_id: PMID:24692546
    supporting_text: >-
      Direct evidence might come from the crystal structure of a full-length FSHR in the
      ground state, an electron or atomic force microscope image of FSHR on a membrane
      surface, or a super-resolution single-molecule optical image on a live cell.
  - reference_id: PMID:36720854
    supporting_text: >-
      The full-length FSHR structures we solved in the active and inactive states were both
      in monomeric states.
- gap_statement: >-
    Whether human FSHR is expressed at functionally meaningful levels in osteoclasts and
    their precursors, and whether FSH acts on bone directly through it rather than through
    the loss of gonadal steroids or cytokine-mediated indirect effects.
  boundary: >-
    Fshb and Fshr null mice are protected from hypogonadal bone loss, and Gi2-coupled FSHRs
    activating MEK/ERK, NF-kappaB and AKT have been reported on mouse and human osteoclasts.
    Against that, the protein detection rests on immunohistochemistry with an unavailable
    in-house monoclonal or poorly validated polyclonals, transcript levels do not match the
    reported protein signals, direct FSH binding to bone cells has not been shown, and the
    in vitro doses are supraphysiological.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    The claim underwrites proposals to treat postmenopausal bone loss by blocking FSH rather
    than replacing estrogen, and it is the main reason extragonadal FSHR terms are proposed
    for this gene. Settling it decides whether any bone or osteoclast annotation belongs on
    human FSHR at all.
  resolution: >-
    Antibody-independent detection in human bone: single-cell or single-nucleus RNA-seq of
    osteoclast lineages, a knock-in epitope-tagged or reporter allele in mouse, radioligand
    binding on primary osteoclasts, and osteoclast-specific conditional Fshr deletion in
    gonadally intact animals.
  provenance:
  - reference_id: PMID:30778333
    supporting_text: >-
      Taken together, further studies are needed to determine whether the FSH-FSHR system
      action in bone resorption is really functional, only species-specific, a probable
      indirect effect of inflammatory cytokines such as tumor necrosis factor α (TNF-α) (69)
      or an unidentified off-target effect of the FSH antibodies used.
  - reference_id: PMID:16630814
    supporting_text: >-
      Neither FSHbeta nor FSH receptor (FSHR) null mice have bone loss despite severe
      hypogonadism.
suggested_experiments:
- description: >-
    Settle the oligomeric state of the receptor where it works: tag endogenous FSHR in
    primary human granulosa cells by knock-in, then measure subunit stoichiometry before and
    after FSH addition by single-molecule photobleaching and super-resolution imaging,
    cross-checked by membrane cross-linking. Reading out cAMP and beta-arrestin recruitment
    in the same cells would test whether a change in oligomer state accompanies activation,
    as the trimer model predicts.
  experiment_type: single-molecule imaging / cross-linking
- description: >-
    Test the extragonadal claims with antibody-independent methods: single-cell RNA-seq and
    knock-in reporter or epitope-tagged alleles to ask whether osteoclasts, adipocytes and
    pancreatic beta cells transcribe and translate FSHR at all, radioligand binding on the
    purified primary cells, and cell-type-specific conditional deletion in gonadally intact
    animals so that any skeletal or metabolic effect cannot be attributed to loss of gonadal
    steroids.
  experiment_type: expression profiling / conditional knockout
- description: >-
    Determine whether the exon-deleted FSHR isoforms are translated and what they do:
    isoform-resolved long-read sequencing and targeted proteomics of human granulosa and
    Sertoli cells, followed by co-expression of each isoform with the full-length receptor to
    test for dominant-negative effects on surface expression, FSH binding and cAMP output.
  experiment_type: isoform expression / functional reconstitution
