  justification: >-
    GO:0042699 is asserted part_of GO:0001541 ovarian follicle development, so every
    annotation to the FSH signaling pathway entails that the gene product participates in
    ovarian follicle development. FSH signalling is not confined to the ovary: the receptor
    is expressed in testicular Sertoli cells as well as ovarian granulosa cells, mouse Fshr
    knockout males have small testes with partial spermatogenic failure, and men homozygous
    for an inactivating FSHR allele have spermatogenic failure. The same problem affects the
    hormone and its subunits, which carry this pathway term and act in both sexes. The
    pathway term should sit under GO:0007186 G protein-coupled receptor signaling pathway
    without the ovarian part_of, with the ovarian context expressed by annotating
    GO:0001541 separately where it applies, as this review does.
