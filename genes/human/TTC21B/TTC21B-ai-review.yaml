id: Q7Z4L5
gene_symbol: TTC21B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TTC21B (IFT139, THM1) is a tetratricopeptide-repeat (TPR) alpha-solenoid subunit of the
  intraflagellar transport complex A (IFT-A). It is the most distal component of the IFT-A peripheral
  subcomplex (IFT43-IFT121- IFT139), attached through the IFT43-IFT121 dimer, and is dispensable for IFT-A
  assembly. TTC21B is essential for retrograde intraflagellar transport: in its absence IFT-A, IFT-B and
  ciliary GPCRs such as Smoothened and GPR161 accumulate in bulged ciliary tips. It localizes to the primary
  cilium (axoneme and tip), basal body and centriolar satellites. By supporting retrograde trafficking
  of Hedgehog-pathway components, TTC21B restrains Hedgehog signalling (mouse Ttc21b/alien mutants show
  ligand-independent pathway activation). Biallelic TTC21B variants cause short-rib thoracic dysplasia
  (SRTD4/Jeune syndrome) and nephronophthisis (NPHP12), and TTC21B alleles act as modifiers across ciliopathies.'
