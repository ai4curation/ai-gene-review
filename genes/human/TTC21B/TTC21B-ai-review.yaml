  evidence_type: NAS
  original_reference_id: PMID:27806291
  qualifier: involved_in
  review:
    summary: Cilium assembly (NAS).
    action: KEEP_AS_NON_CORE
    reason: IFT139 is dispensable for ciliogenesis per se in RPE1 cells (cilia form but have bulged tips),
      so its role in cilium assembly is limited to maintaining normal ciliary architecture via retrograde
      IFT.
    supported_by:
