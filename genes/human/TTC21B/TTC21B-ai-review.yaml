      supporting_text: knockout (KO) of the IFT122 gene in hTERT-RPE1 cells using the CRISPR/Cas9 system
        led to a severe ciliogenesis defect, whereas KO of other IFT-A genes had minor effects on ciliogenesis
        but impaired ciliary protein trafficking
    - reference_id: PMID:27932497
      supporting_text: IFT139-KO cells showed the accumulation of IFT-A, IFT-B, and GPCRs, including Smoothened
        and GPR161, at the bulged ciliary tips
