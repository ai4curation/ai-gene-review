id: Q14126
gene_symbol: DSG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Desmoglein-2 is a single-pass desmosomal cadherin that supports adhesion in epithelial tissues and heart
               muscle. Its calcium-binding extracellular cadherin domains engage neighboring cells, and its cytoplasmic
               region connects to the desmosomal plaque. This transmembrane connection couples extracellular adhesion
               to the intracellular junctional architecture and helps tissues resist mechanical stress. Its extracellular
               region also serves as an attachment receptor for selected species B adenoviruses, including types 3,
               7, 11 and 14/14a, and supports type 3 entry into human cells. DSG2 also occurs at non-desmosomal cell
               contacts and surface pools in progenitor, endothelial and pancreatic cells. Its junctional and signalling-associated
               roles vary with cell context; proteolytic cleavage can release extracellular or intracellular fragments.
               Human DSG2 variants are associated with arrhythmogenic cardiomyopathy and altered desmosomal structure.
