core_functions:
- description: Desmoglein-2 provides a calcium-dependent extracellular adhesive interface at desmosomes.
    Its cadherin ectodomain binds desmocollins across cell contacts, while its membrane-spanning and cytoplasmic
    regions connect the adhesive interface to the intracellular plaque and intermediate-filament attachment
    machinery. These complementary parts supply an adhesive structural component during desmosome assembly
    and support epithelial and cardiomyocyte cohesion. Purified human ectodomain experiments establish
    heterophilic binding; separate atomic-force measurements detect homophilic interactions under their
    assay conditions, so adhesive specificity is not reduced to an exclusive interaction type.
  molecular_function:
    id: GO:0098641
    label: cadherin binding involved in cell-cell adhesion
  directly_involved_in:
  - id: GO:0098609
    label: cell-cell adhesion
  - id: GO:0002159
    label: desmosome assembly
  locations:
  - id: GO:0030057
    label: desmosome
  supported_by:
  - reference_id: PMID:27298358
    supporting_text: 'All Dsgs form adhesive dimers with all

      Dscs'
  - reference_id: PMID:25213555
  - reference_id: PMID:26085008
- description: Desmoglein-2 provides a cell-surface attachment receptor for selected species B adenoviruses, including
                 Ad3, Ad7, Ad11 and Ad14/Ad14a. Its extracellular domain engages virus particles, and DSG2 expression
                 enables Ad3 attachment and transduction in receptor-negative human cells. Ad11 can use DSG2 when CD46
                 is blocked. This receptor role is distinct from cadherin-mediated cell adhesion.
  molecular_function:
    id: GO:0001618
    label: virus receptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:21151137
    supporting_text: conferred efficient Ad3 attachment and transduction
  - reference_id: PMID:29849084
  - reference_id: PMID:30862836
suggested_questions:
- question: Which membrane organization, force geometry and calcium conditions explain the differing DSG2
    homophilic results across AFM and solution/bead assays?
- question: Do the narrow His–Purkinje, heart-rate and ventricular-action-potential annotations reflect
    directly measured DSG2-dependent steps, or the broader consequence of damaged cardiac adhesion?
- question: Does DSG2 actively inhibit endothelial differentiation, or do the reported lineage-marker
    changes primarily track cell state while DSG2 affects adhesion and vascular organization?
- question: Which molecular form of DSG2 is present in parotid exosomes and HPA-positive vesicles, and
    what functions, if any, accompany these contextual pools?
suggested_experiments:
- description: Compare sequence-authenticated human DSG2 ectodomains and cell-surface constructs in matched
    homophilic/DSC2 heterophilic assays while varying calcium, force geometry and membrane density; measure
    binding and adhesion separately.
- description: Separate adhesion loss from electrophysiological changes in human cardiomyocyte conduction
