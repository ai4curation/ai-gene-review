    summary: DSG2 contributes the adhesive structural component of desmosome assembly.
    action: ACCEPT
    reason: The literal mouse donor is O55111. Its curated experimental assembly records include PMID:19635863
      and PMID:26085008. The former retains morphologically normal desmosomes despite conduction disease
      and must not be described as an assembly-loss experiment; the latter reports loss of desmosome-like
      structures after cardiomyocyte-specific depletion. Human ectodomain adhesion and plaque associations
      independently explain the structural work supplied by DSG2. Accept conserved assembly participation
      without attributing a catalytic assembly activity or making necessity alone the rationale.
