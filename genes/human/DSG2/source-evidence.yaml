    extraction; no inferred direct interface or intact vesicle topology.
primary_sources:
- reference: PMID:11790773
  public_locators:
  - https://pubmed.ncbi.nlm.nih.gov/11790773/
  - https://doi.org/10.1074/jbc.M108765200
  operative_locator: 'Methods: yeast two-hybrid and immunoprecipitation; Results comparing full-length
    PKP2a and its head domain with DSG2, including native SCC9 capture.'
  actual_access_and_limits: Genuine indexed original Methods/Results were read. These are construct- and
    assay-specific associations, not a purified-interface measurement.
- reference: PMID:16505173
  public_locators:
  - https://pubmed.ncbi.nlm.nih.gov/16505173/
  - https://doi.org/10.1161/CIRCULATIONAHA.105.583674
  operative_locator: 'Complete PubMed abstract: ARVC genotypes and biopsy ultrastructure; no narrow conduction
    assay reconstructed.'
  actual_access_and_limits: The complete abstract was verified; operative full text was not recovered.
    It does not resolve the narrow Purkinje/heart-rate/action-potential experiments carried by the source
    annotations.
- reference: PMID:17559062
  public_locators:
  - https://pubmed.ncbi.nlm.nih.gov/17559062/
  - https://doi.org/10.1002/jcb.21431
  operative_locator: 'Complete PubMed abstract: staurosporine-treated HaCaT/HT-29, 70-kDa DSG2 fragment,
    plakoglobin cleavage/detachment.'
  actual_access_and_limits: Abstract-only access. Cleavage substrate, released fragment and associated
    plakoglobin are distinguished; exact binding and homophilic assay Methods were not reconstructed.
- reference: PMID:19199708
  public_locators:
  - https://pubmed.ncbi.nlm.nih.gov/19199708/
  - https://doi.org/10.1021/pr800658c
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC2693447/
  operative_locator: Discussion naming DSG2; Supplementary Table 2, sheet Paratid Exosomes, row 76. The
    available HTML extraction omits most Methods/Results.
  actual_access_and_limits: The cached Discussion explicitly names DSG2; the genuine Supplementary Table
    2 was independently read (sheet Paratid Exosomes, row 76). Most Methods/Results are missing from the
    available cached HTML extraction; the individual peptide mapping and DSG2-specific orthogonal validation
    were not reconstructed. Table background annotation columns are not new experiments.
- reference: PMID:19581412
  public_locators:
  - https://pubmed.ncbi.nlm.nih.gov/19581412/
  - https://doi.org/10.1083/jcb.200812160
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC2712992/
  operative_locator: Surface-capture/SILAC Methods and corresponding Results; the DSG2-specific peptide/table
    entry was not recovered.
  actual_access_and_limits: The full original Methods and relevant Results were recovered/read, but the
    exact DSG2 table/peptide entry was not. Integrin-specific follow-up is not presented as DSG2 validation.
- reference: PMID:20859650
  public_locators:
  - https://pubmed.ncbi.nlm.nih.gov/20859650/
  - https://doi.org/10.1007/s00018-010-0531-3
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC11114901/
  operative_locator: 'Results: DSG2 border staining in HaCaT/HCT116 controls and after PKP3 depletion;
    incomplete cached Methods.'
  actual_access_and_limits: The genuine cached original Results were read; the HTML extraction lacks complete
    Methods. The DSC2/3 antibody cross-reactivity caveat is not transferred to the distinct DSG2 staining.
- reference: PMID:21220045
  public_locators:
  - https://pubmed.ncbi.nlm.nih.gov/21220045/
  - https://doi.org/10.1016/j.hrthm.2011.01.010
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC3085091/
  operative_locator: Selected cardiac localization Results/Discussion and Supplementary Figures S4B/S5B
    referenced by IntAct; exact record EBI-6901957/IM-20978-13.
  actual_access_and_limits: The genuine original selected Results/Discussion and literal IntAct record
    were read. EBI-6901957/IM-20978-13 is anti-tag co-immunoprecipitation in COS-1; the deposited reference
    sequences and experimental tags/binding-region feature are distinct.
- reference: PMID:23381804
  public_locators:
  - https://pubmed.ncbi.nlm.nih.gov/23381804/
  - https://doi.org/10.1002/humu.22289
  operative_locator: 'Complete abstract: human patient material, wild-type/variant protein incorporation
    and altered desmosomes.'
  actual_access_and_limits: Abstract-only access; exact spatial and electrophysiological experiments are
    not reconstructed. Broad localization is supported, while narrow electrical-process assertions remain
    unresolved.
- reference: PMID:26918609
  public_locators:
  - https://pubmed.ncbi.nlm.nih.gov/26918609/
  - https://doi.org/10.18632/oncotarget.7675
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC5122330/
  operative_locator: Methods and Results for human HaCaT/A431/HT1080, raft fractionation and EGFR/c-Src/caveolin-associated
    signalling.
  actual_access_and_limits: Original Methods/Results were read. Receptor/kinase activity belongs to the
    measured signalling proteins; DSG2 is not assigned intrinsic kinase activity.
- reference: PMID:27298358
  public_locators:
  - https://pubmed.ncbi.nlm.nih.gov/27298358/
  - https://doi.org/10.1073/pnas.1606272113
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC4932976/
  operative_locator: Complete six-page original, human ectodomain constructs, binding/adhesion Results
    and Figures 2/3; independent consultation read selected figure pixels.
  actual_access_and_limits: A complete six-page original was recovered from OSTI and independently read,
    including selected figure pixels. Soluble/bead heterophilic preference is distinct from positive homophilic
    AFM contexts. The selected public cache remains abstract-only, while the full original was available.
- reference: PMID:27338829
  public_locators:
  - https://pubmed.ncbi.nlm.nih.gov/27338829/
  - https://doi.org/10.1007/s10456-016-9520-y
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC5026727/
  operative_locator: Methods, endothelial/progenitor localization and knockdown Results; separate mouse
    hypomorph vascular experiments.
  actual_access_and_limits: Original Methods/Results were read. Mouse hypomorph vascular sprouting is
    separate from human knockdown. Expression/lineage-marker correlations do not by themselves establish
    active inhibition of endothelial differentiation.
- reference: PMID:29849084
  public_locators:
  - https://pubmed.ncbi.nlm.nih.gov/29849084/
  - https://doi.org/10.1038/s41598-018-26871-x
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC5976663/
  operative_locator: Human DSG2 fragment Methods and binding/stoichiometry Results; EC2/EC3 mapping.
  actual_access_and_limits: The original was read. Fragment binding is distinguished from the independent
    receptor gain/blocking experiments and is not called a viral-entry assay by itself.
- reference: PMID:29910125
  public_locators:
  - https://pubmed.ncbi.nlm.nih.gov/29910125/
  - https://doi.org/10.1016/j.stemcr.2018.05.009
  - https://pmc.ncbi.nlm.nih.gov/articles/PMC6117473/
