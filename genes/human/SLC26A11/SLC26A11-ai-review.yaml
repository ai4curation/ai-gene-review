  review:
    summary: SLC26A11 is a lysosomal membrane protein, identified by lysosomal membrane proteomics and confirmed
      by imaging in mammalian cell lines.
    action: ACCEPT
    reason: Lysosomal membrane proteomics (PMID:20957757, a review summarising the lysosomal proteome; UniProt cites
      it for this location) and confocal studies summarised in PMID:42509233 place native SLC26A11 in lysosomes;
      in mammalian cell lines it localises exclusively to lysosomes. The biochemistry (proton-gradient driven sulfate
      transport with high luminal chloride) is consistent with operation in the lysosomal membrane. This is the
      principal location of the human protein.
