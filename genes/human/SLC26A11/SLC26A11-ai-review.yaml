    summary: Proton-coupled sulfate transport; transferred from guinea pig Slc26a11 (G3C7W6) and now shown directly
      for purified human SLC26A11 in proteoliposomes.
    action: ACCEPT
    reason: Guinea pig Slc26a11 (G3C7W6, Swiss-Prot ortholog) showed pH-dependent sulfate transport in oocytes (PMID:21593449).
      For the human protein, reconstituted SLC26A11ΔC proteoliposomes show sulfate uptake obligatorily coupled to
      proton movement in the same direction, abolished by E320Q at the proton-coupling residue (PMID:42509233).
      Core activity; the complete reaction also includes chloride antiport (see NEW GO:0160044).
