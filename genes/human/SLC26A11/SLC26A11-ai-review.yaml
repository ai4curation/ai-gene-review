- id: PMID:42509233
  title: SLC26A11 is an atypical solute carrier with dual transport-channel function mediating lysosomal sulfate
    transport.
  findings:
  - statement: Human SLC26A11 is an electroneutral proton:sulfate/chloride exchanger (1 H+ + 1 sulfate symport,
      1 chloride antiport) in reconstituted proteoliposomes.
    supporting_text: In the most parsimonious model, SLC26A11 is an exchanger that couples the symport of one proton
      and one sulfate ion (net charge of −1) to the antiport of one chloride ion (net charge of −1).
  - statement: Human SLC26A11 has a chloride-selective channel-like conductance gated by proton:sulfate transport.
    supporting_text: 'Taken together, our findings suggest that SLC26A11 exhibits two distinct transport functions:
      electroneutral proton:sulfate/chloride exchange and chloride channel activity.'
  - statement: Bicarbonate does not interact with the SLC26A11 transport site.
    supporting_text: Molybdate, iodide, acetate and chloride inhibited transport to a lesser extent, whereas phosphate
      and bicarbonate had no effect on SLC26A11ΔC activity.
  - statement: SLC26A11 is lysosomal in mammalian cell lines.
    supporting_text: whereas SLC26A11 exclusively localizes to lysosomes in various mammalian cell lines30, a fraction
      of the SLC26A11 protein localizes to the plasma membrane in Sf9 cells
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC13408680). Defining biochemistry, cryo-EM structure and electrophysiology on
      the human protein (C-terminally truncated SLC26A11ΔC). Lysosomal sulfate export in cells is inferred by the
      authors, not directly measured.
- id: PMID:21716257
  title: Slc26a11, a chloride transporter, localizes with the vacuolar H(+)-ATPase of A-intercalated cells of the
    kidney.
  findings:
  - statement: Mouse Slc26a11 co-localises with V-ATPase in kidney intercalated cells and mediates chloride transport
      and apparent Cl-/HCO3- exchange in COS-7 cells.
    supporting_text: KBAT and H+-ATPase colocalize on the apical membrane of A-intercalated cells and on the basolateral
      membrane of B-intercalated cells in the cortical collecting duct
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Mouse ortholog. Localisation data are solid; the Cl-/HCO3- exchange mode (BCECF pHi in COS-7)
      is not reproduced for guinea pig (PMID:21593449) or purified human protein (PMID:42509233).
- id: PMID:23733100
  title: 'Slc26a11 is prominently expressed in the brain and functions as a chloride channel: expression in Purkinje
    cells and stimulation of V H⁺-ATPase.'
  findings:
  - statement: Mouse Slc26a11 acts as a chloride channel in HEK293 cells and is expressed in Purkinje cells.
    supporting_text: KBAT is a novel chloride channel and may play an important role in the cell physiological properties
      of output neurons in various parts of the brain.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mouse ortholog; source of the chloride channel ISS/IEA rows. Consistent with the later human electrophysiology.
- id: PMID:21593449
  title: 'SLC26 anion exchangers of guinea pig pancreatic duct: molecular cloning and functional characterization.'
  findings:
  - statement: Guinea pig Slc26a11 shows pH-dependent chloride, oxalate and sulfate transport but no Cl-/HCO3- exchange
      in oocytes.
    supporting_text: gpSlc26a11 in Xenopus oocytes exhibited pH-dependent Cl(-), oxalate, and sulfate transport
      but no detectable Cl(-)/HCO(3)(-) exchange.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only in cache. Guinea pig ortholog G3C7W6; source of the sulfate:proton symporter and
      oxalate transport ISS rows.
- id: PMID:25910210
  title: The cellular mechanisms of neuronal swelling underlying cytotoxic edema.
  findings:
  - statement: SLC26A11 knockdown/blockade reduces depolarisation-activated chloride entry and swelling in rodent
      neurons.
    supporting_text: identified the ion exchanger SLC26A11 unexpectedly acting as a voltage-gated Cl(-) channel
  reference_review:
