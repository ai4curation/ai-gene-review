id: Q86WA9
gene_symbol: SLC26A11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC26A11 is a member of the SLC26/SulP anion transporter family, a homodimeric multipass membrane protein
  with a C-terminal cytoplasmic STAS domain. It is expressed in most tissues, highest in brain, kidney, placenta
  and high endothelial venules, and in human cells resides mainly in the lysosomal membrane. Purified human SLC26A11
  is an electroneutral secondary transporter that couples symport of a proton and a sulfate ion to antiport of a
  chloride ion; a glutamate in the substrate-binding site (Glu-320, unique among human SLC26 proteins) sets the
  pH-dependent sulfate affinity. Oxalate, selenate and thiosulfate also bind, whereas bicarbonate does not. The
  same protein shows a chloride-selective, channel-like conductance that is gated by the proton:sulfate transport
  cycle. Its biochemical properties and lysosomal location suggest it is the exporter that clears sulfate released
  by lysosomal sulfatases. In mouse, Slc26a11 is found at the plasma membrane of kidney intercalated cells and cerebellar
  Purkinje neurons, where it has been proposed to supply chloride for V-ATPase-driven acid secretion; in neurons
  it has been implicated in chloride entry during cytotoxic swelling.
