- term:
    id: GO:0005254
    label: chloride channel activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q80ZD3
  - ensembl:ENSMUSP00000050999
  review:
    summary: Chloride-selective, channel-like conductance of SLC26A11, gated by the proton:sulfate transport cycle;
      shown for the human protein by whole-cell patch clamp and for mouse Slc26a11 in HEK293 cells.
    action: ACCEPT
    reason: 'The ISS/IEA rows were transferred from mouse Slc26a11 (Q80ZD3, same PANTHER SF55 clade, one-to-one
      ortholog), whose chloride channel activity was shown in HEK293 cells (PMID:23733100). The human protein now
      has direct evidence: chloride-selective currents with reversal near the chloride Nernst potential, activated
      by conditions favouring proton:sulfate transport (PMID:42509233). PAINT did not place chloride channel activity
      on an ancestral node, so this is supported as an SLC26A11-specific experimental function rather than a family-wide
      inheritance. Core function alongside sulfate exchange.'
    supported_by: &id001
    - &id007
      reference_id: PMID:42509233
      supporting_text: 'Taken together, our findings suggest that SLC26A11 exhibits two distinct transport functions:
        electroneutral proton:sulfate/chloride exchange and chloride channel activity.'
    - &id019
      reference_id: PMID:42509233
      supporting_text: Under all conditions, the current reversal potential remained close to the Nernst equilibrium
        potential for chloride, indicating that the observed current is chloride-selective.
    - reference_id: PMID:23733100
      supporting_text: KBAT is a novel chloride channel and may play an important role in the cell physiological
        properties of output neurons in various parts of the brain.
