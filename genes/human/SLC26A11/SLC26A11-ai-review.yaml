  review:
    summary: Purified human SLC26A11 exchanges sulfate (with a proton) for chloride in proteoliposomes.
    action: NEW
    reason: 'Trans chloride stimulates proton-driven sulfate uptake about fourfold, cis chloride competes with sulfate,
      and the best-fitting model is electroneutral 1 H+ : 1 sulfate symport coupled to 1 chloride antiport (PMID:42509233).
      Sulfate efflux requires an exchangeable counter-substrate, so the protein works most efficiently as an exchanger.
      This captures the chloride-exchange half of the reaction not represented by GO:0008512.'
