suggested_questions:
- question: Does loss of SLC26A11 cause lysosomal sulfate accumulation and sulfatase inhibition in human cells,
    establishing it as the physiological lysosomal sulfate exporter?
- question: Is the chloride/bicarbonate exchange reported for mouse Slc26a11 in COS-7 cells a genuine transport
    mode, given its absence in guinea pig Slc26a11 and in purified human SLC26A11?
- question: Under what conditions, and in which cell types, does native SLC26A11 reach the plasma membrane rather
    than lysosomes?
- question: Should the lysosomal sulfate export role be captured as GO:0170063 transmembrane transport from lysosomal
    lumen to cytosol (or a sulfate-specific child term) once cell-based evidence exists?
suggested_experiments:
- description: Measure lysosomal 35S-sulfate efflux and lysosomal sulfate content in SLC26A11 knockout and E320Q
    knock-in cells, with rescue by wild-type protein.
- description: Test Cl-/HCO3- exchange of purified human and mouse SLC26A11 side by side in proteoliposomes with
    pH-sensitive dyes to resolve the species discrepancy.
