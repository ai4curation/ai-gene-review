id: Q8N8A2
gene_symbol: ANKRD44
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD44 (ankyrin repeat domain-containing 44; PP6-ARS-B) is one of three interchangeable
  ankyrin-repeat subunits of protein phosphatase 6 (PP6), together with ANKRD28 and ANKRD52. It associates
  with a SAPS-domain subunit such as PPP6R1, which in turn binds the PPP6C catalytic subunit, forming
  a heterotrimer that helps set PP6 substrate specificity. Like ANKRD28, but unlike ANKRD52, it is needed
  for PP6 function in mitosis. In a HER2-positive breast cancer line, its silencing activates NF-kB and
  confers partial trastuzumab resistance.
