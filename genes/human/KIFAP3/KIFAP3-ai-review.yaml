id: Q92845
gene_symbol: KIFAP3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KIFAP3 (kinesin-associated protein 3, KAP3; also called SMAP) is the non-motor accessory
  subunit of heterotrimeric kinesin-2. It is an armadillo-repeat protein that binds the C-terminal tail
  domains of the KIF3A/KIF3B motor heterodimer to form the KIF3A/KIF3B/KAP3 complex, and it links the
  motor to cargo, including membranous organelles, IFT trains in cilia, and N-cadherin-containing carriers.
  KIFAP3 has no motor domain or ATPase activity of its own. Through kinesin-2 it participates in anterograde
  intraflagellar transport and cilium assembly, localizing to the basal body, transition zone, axoneme
  and ciliary tip, and in plus-end-directed vesicle transport in the cytoplasm and neurons. KAP3 also
  interacts with regulators including the phosphatase POPX2 (which controls KIF3A phosphorylation) and
  the small-GTPase regulator RAP1GDS1/SmgGDS, and has been reported on mitotic spindles and chromosomes.
