- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16298999
  qualifier: enables
  supporting_entities:
  - UniProtKB:O15066
  review:
    summary: Interaction with KIF3A/KIF3B motor subunits.
    action: MODIFY
    reason: 'Interaction of KIFAP3 with the kinesin-2 motor subunits KIF3A/KIF3B. For KAP3 this interaction
      is its defining molecular function: it binds the KIF3A/KIF3B tail domains to form the heterotrimeric
      motor. ''Protein binding'' is uninformative; the more specific term kinesin binding (GO:0019894)
      is appropriate and already supported by IPI for the same pairs.'
    proposed_replacement_terms:
    - id: GO:0019894
      label: kinesin binding
    supported_by:
    - reference_id: file:human/KIFAP3/KIFAP3-uniprot.txt
      supporting_text: Binds to the tail domain of the KIF3A/KIF3B heterodimer to form a heterotrimeric
        KIF3 complex and may regulate the membrane binding of this complex
    - reference_id: PMID:16298999
      supporting_text: Kinesin-2 is composed of two microtubule-based motor subunits, KIF3A/3B, and a
        kinesin-associated protein known as KAP3, which links KIF3A/3B to cargo that is carried to cellular
        organelles along microtubules in interphase cells.
