    summary: 'Proposed: KAP3 is the non-motor subunit of heterotrimeric kinesin-2 that links the KIF3A/KIF3B
      motor to cargo.'
    action: NEW
    reason: KAP3 has no motor domain; its activity is to bridge the KIF3A/KIF3B tails and cargo-associated
      proteins. This adaptor activity is more informative than kinesin binding alone and matches how the
