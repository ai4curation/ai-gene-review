id: P51795
gene_symbol: CLCN5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CLCN5 encodes ClC-5, a voltage-dependent chloride:proton exchanger concentrated in renal
  epithelial endosomal membranes. Coupled ion transport supports proximal-tubule handling of filtered
  proteins and solutes, and pathogenic loss of function causes Dent disease. ClC-5 also occupies
  Golgi and plasma membrane pools whose abundance depends on cell context and trafficking partners,
  including KIF3B and TMEM9-family proteins. Its cytoplasmic CBS-domain region recognizes ATP, ADP
  and AMP. The physiological consequences of nucleotide occupancy and the distribution of the two
  human protein products remain incompletely resolved.
