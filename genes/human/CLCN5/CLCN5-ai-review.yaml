suggested_questions:
- question: How do native endosomal voltage, pH and chloride gradients determine ClC-5 flux direction,
    and how do these ion conditions support renal uptake independently of bulk acidification?
- question: Does adenyl-ribonucleotide occupancy regulate wild-type ClC-5 in renal endosomes, and
    how does this differ from the effects measured in an uncoupled E211A background?
- question: What are the abundance, compartment distribution and physiological roles of the two human
    ClC-5 products?
- question: Does the original NK-cell proteomics dataset contain identifiable ClC-5 peptides, and
    do they resolve a particular product or compartment?
- question: How do TMEM9 and TMEM9B stoichiometry and regulatory states control ClC-5 targeting and
    inhibition in human proximal-tubule endosomes?
suggested_experiments:
- description: Measure endosomal chloride, pH, voltage and uptake together in human proximal-tubule
    cells with matched wild-type, transport-dead and exchange-uncoupled rescue, controlling expression
    and compartment targeting.
- description: Test nucleotide-binding-site variants in native wild-type transport backgrounds with
    independently measured nucleotide occupancy, retaining uncoupled mutants as separate mechanistic
    controls.
- description: Quantify the two human products with sequence-discriminating peptides and product-specific
    rescue, then resolve KIF3B/TMEM9-dependent sorting without assuming that heterologous surface
    currents report native endosomal abundance.
