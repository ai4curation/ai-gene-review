    label: renal system process
  evidence_type: IMP
  original_reference_id: PMID:8559248
  qualifier: involved_in
  review:
    summary: Retain the experimentally grounded renal function.
    action: ACCEPT
    reason: The complete original abstract reports CLCN5 mutations in renal stone disorders and reduced
      or abolished currents for tested variants in Xenopus oocytes. Its full original body was not
      recovered. Later mouse experiments separate coupled exchange from chloride conductance and
      show impaired proximal-tubule uptake when coupling is removed, independently supporting the
      protein’s performed renal role.
    supported_by:
