core_functions:
- description: ClC-5 exchanges chloride and protons across endosomal membranes, supporting proximal-tubule
    absorption of filtered proteins and solutes. Its proton-transport activity can acidify endosomes
    under suitable ion gradients; renal uptake also depends on coupled exchange when bulk ATP-driven
    acidification remains normal. Cytoplasmic adenyl-ribonucleotide recognition and trafficking interactions
    accompany this transport function.
