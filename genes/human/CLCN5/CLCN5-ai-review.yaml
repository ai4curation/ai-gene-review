    label: endosomal lumen acidification
  evidence_type: IDA
  original_reference_id: PMID:20421284
  qualifier: involved_in
  review:
    summary: Human ClC-5 can directly contribute to endosomal acidification through its proton-transport
      activity.
    action: NEW
    reason: Full-length human ClC-5 expressed in HEK293 cells enhances acidification of VAMP2-pHluorin-positive
      endosomes, including a component that persists when V-ATPase is inhibited. E211A and E268A
      pore mutants localize to those compartments but do not confer that component. These transport-dependent
      measurements identify ClC-5 as performing proton movement, rather than merely being necessary
      for an outcome. The opossum knockdown experiment is separate. Mouse E211A knock-in retains
      bulk ATP-driven acidification despite defective uptake, so this annotation does not assert
      that ClC-5 always acidifies native renal endosomes. The active term has no ancestor/descendant
      overlap with existing process annotations; same-role CLCN3 has the term, and GO-CAM provides
      no contrary modeled target role.
