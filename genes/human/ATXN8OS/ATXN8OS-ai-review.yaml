knowledge_gaps:
- gap_statement: Whether the ATXN8OS ORF protein has any function, and whether it contributes to SCA8
    beyond the toxic CUG-repeat RNA, is unknown.
  boundary: 'Established: the ORF is translated from a GUG start (mass-spectrometry N-terminal peptide)
    and detected in several human cell types and in muscle with a cytoplasmic distribution. Not established
    in the cited study: partners, function, or a disease role.'
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  provenance:
  - reference_id: PMID:24040107
    supporting_text: Using antiserum raised against ORF, ATXN8OS ORF expression was detected in various
      human cells including lymphoblastoid, embryonic kidney 293, neuroblastoma IMR-32, SK-N-SH, SH-SY5Y
      cells and human muscle tissue.
  - reference_id: PMID:24040107
    supporting_text: The biological role of the ATXN8OS ORF and its connection to SCA8 remains to be determined.
suggested_questions:
- question: Is the ATXN8OS ORF peptide conserved and functional, or is its translation a by-product of
    IRES activity on a mainly regulatory or toxic RNA?
suggested_experiments:
- description: Test conservation and endogenous abundance of the ATXN8OS ORF peptide in cerebellum by
    targeted proteomics, and compare SCA8 cell models with and without the start codon to separate protein
    from RNA effects.
