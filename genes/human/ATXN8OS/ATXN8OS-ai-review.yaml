  label: Homo sapiens
description: ATXN8OS is the CTG-direction transcript of the spinocerebellar ataxia type 8 (SCA8) locus,
  antisense to ATXN8. Its untranslated CTG expansion was the first identified cause of SCA8. It was long
  considered noncoding, but a 200-residue ORF (about 23 kDa) is translated from an upstream in-frame non-canonical
  GUG start, and the region upstream of the ORF shows possible internal ribosome entry activity. The protein
  is detected in several human cell lines and in muscle, and an EGFP fusion is cytoplasmic. Its function
  is unknown.
