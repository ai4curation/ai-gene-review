description: ATXN8OS is the CTG-direction transcript of the spinocerebellar ataxia type 8 (SCA8) locus,
  antisense to ATXN8. Its expanded CUG-repeat RNA is implicated in SCA8 pathogenesis. It was long considered
  noncoding, but a 102-residue ORF is translated from a non-canonical GUG start, through internal ribosome
  entry activity, and the peptide is detected in human cell lines and muscle with a cytoplasmic distribution.
  The protein's function is unknown.
