id: Q9NZ52
gene_symbol: GGA3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GGA3 (Golgi-localized, gamma-adaptin ear-containing, ARF-binding protein 3) is a monomeric
  clathrin adaptor that functions in protein sorting between the trans-Golgi network and endosomes. Its
  VHS domain recognises acidic-cluster-dileucine (DXXLL) sorting motifs in the cytosolic tails of cargo
  such as the mannose-6-phosphate receptors; its GAT domain binds ARF-GTP (for membrane recruitment) and
  ubiquitin (for sorting ubiquitinated cargo); and its hinge/GAE region recruits clathrin. GGA3 directs
  cargo to endosomes and lysosomes, mediates surface export of receptors such as ADRA2B and NTRK1, and
  regulates the trafficking and stability of BACE1.
