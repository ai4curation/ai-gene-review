core: One mature cysteine endopeptidase activity with proteolysis and protein catabolism, in
  the lysosomal lumen. These two current BP terms are not ancestor/descendant; proteolysis also
  covers processing. Direct human recombinant apoB-100 degradation supports mature-protein breakdown,
  with the in-vitro and extracellular context explicit. No separately asserted cystatin-like
  inhibitor activity, disease-derived process or NEW annotation.
ontology_scope:
  GO:0043202: The volume enclosed by the lysosomal membrane; part_of GO:0005764, whose vacuolar
    ancestry is preserved. Fits the is_active_in qualifier and mature-enzyme model.
  GO:0030163: Mature-protein breakdown, not precursor maturation. Neither this term nor GO:0006508
    occurs in the other term's current ancestor closure; the proteolysis comment explicitly
    explains the separation.
