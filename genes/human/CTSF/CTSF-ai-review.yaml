id: Q9UBX1
gene_symbol: CTSF
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CTSF encodes cathepsin F, a papain-family cysteine endopeptidase that hydrolyzes
  proteins in acidic compartments. Its 484-residue precursor contains a signal peptide and an
  unusually long proregion with a cystatin-like segment; processing releases the 214-residue
  catalytic chain. Cathepsin F acts in lysosomes and can also be secreted by macrophages. It
  can cleave the MHC class II invariant chain and apolipoprotein B-containing lipoproteins in
  defined experimental settings. Biallelic CTSF defects cause adult-onset neuronal ceroid lipofuscinosis
  type B (CLN13).
