  review:
    action: KEEP_AS_NON_CORE
    reason: O76096 is human cystatin F (CST7), distinct from cathepsin F. The original inhibition
      assays used human CTSF produced in Pichia and found tight inhibition by reduced monomeric
      cystatin F, including a CTSF Ki of 0.17 ± 0.05 nM with Z-Phe-Arg-AMC at pH 5.5. This supports
      the positive enzyme–inhibitor interaction. No evidence-backed, more informative binding
      class was established, so retain the supported generic assertion as non-core under the
      explicit retention policy in projects/CLINGEN_MENDELIAN.md, lines 2976–2978. CTSF is the
      inhibited protease, not the inhibitor. The current IntAct/MINT capture lacks this exact
      historical pair, which is not negative biological evidence.
    supported_by:
