functional_isoforms:
- id: CTSF_MATURE
  name: Mature cathepsin F
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000026203
    residues: 271-484
  description: Proteolytically processed 214-residue chain of the single documented 484-residue
    UniProt precursor. The precursor has a predicted signal peptide at residues 1–19 and a propeptide
    at 20–270. Acidic processing activates recombinant enzyme. Historical 302- and 338-residue
    cDNAs are partial clones, not established alternative human splice products; the crystallized
    1M6D mature chain additionally carries three engineered N-to-Q substitutions.
core_functions:
- description: 'Mature cathepsin F catalyzes cysteine-dependent internal peptide-bond hydrolysis
    in acidic lysosomal compartments. Activation removes its long proregion. Its catalytic role
    encompasses protein degradation and protein processing: measured substrates include blocked
    synthetic peptides, invariant chain and apoB-100. Invariant-chain cleavage and extracellular
    LDL degradation are context-dependent applications; the recombinant LDL assay does not establish
    an intact-cell turnover rate or a universal extracellular role.'
  molecular_function: *id001
  directly_involved_in:
  - id: GO:0006508
    label: proteolysis
  - id: GO:0030163
    label: protein catabolic process
  locations:
  - id: GO:0043202
    label: lysosomal lumen
  supported_by:
  - reference_id: PMID:9822672
    supporting_text: 'Mature cathepsin F was highly active with comparable

      specific activities toward synthetic substrates'
  - reference_id: PMID:10318784
  - reference_id: PMID:10748235
  - reference_id: PMID:12225749
  - reference_id: PMID:15184381
    supporting_text: 'led to extensive degradation

      of apoB-100'
suggested_questions:
- question: Which endogenous human protein substrates account for CTSF-dependent neuronal lysosomal
    function, and how does their cleavage connect to CLN13 pathology?
- question: What controls activation and compartmental delivery of the full 484-residue precursor,
    and does its cystatin-like proregion have a separable inhibitory activity or primarily an
    intramolecular regulatory role?
- question: 'Which CTSF molecular form is present in extracellular vesicles: the intact proenzyme,
    the processed mature chain, or both, and is the vesicle-associated enzyme catalytically
    active?'
suggested_experiments:
- description: Compare full-length human CTSF, an active-site mutant and a processing-defective
    precursor in human neuronal cells, mapping lysosomal substrate cleavage and rescue with
    matched protein abundance and localization.
- description: Map N termini and catalytic activity of endogenous lysosomal and secreted CTSF,
    using compartment-purity controls to distinguish processed active enzyme from precursor
    or fraction carryover.
status: DRAFT
