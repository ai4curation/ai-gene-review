proposed_new_terms: []
knowledge_gaps:
- gap_statement: The molecular function of the ASNSD1 protein is unknown beyond peptide-level PDZ-motif
    binding, including whether its glutamine amidotransferase and asparagine synthetase domains are catalytically
    active.
  boundary: 'Established: domain architecture, maximal skeletal-muscle expression, and a degenerative
    myopathy in knockout mice. Reported: binding of its C-terminal PDZ-binding-motif peptide to many PDZ
    domains in screens. Not established: any enzymatic activity, substrate, location or mechanism for
    the muscle phenotype; the PAQosome role belongs to the uORF microprotein ASDURF.'
