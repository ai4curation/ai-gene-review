id: Q9NWL6
gene_symbol: ASNSD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASNSD1 (also called NS3TP1) is a protein with an N-terminal glutamine amidotransferase type-2
  domain and a C-terminal asparagine synthetase domain, related to asparagine synthetase; whether it has
  amidotransferase or synthetase activity is unknown. It is most highly expressed in skeletal muscle,
  and mice lacking it develop a progressive degenerative myopathy with severe sarcopenia and replacement
  of muscle by fat. Its C-terminal peptide binds many PDZ domains in peptide-array screens. The ASNSD1
  mRNA also encodes, from an upstream open reading frame, a separate microprotein (ASDURF) that is a subunit
  of the PAQosome chaperone; that activity belongs to ASDURF, not to the ASNSD1 protein.
