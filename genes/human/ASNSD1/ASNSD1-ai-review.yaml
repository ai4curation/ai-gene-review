  review:
    summary: Molecular_function (ND). No molecular function, location or biological process of the ASNSD1
      protein has been established. It carries glutamine amidotransferase type-2 and asparagine synthetase
      domains, but no enzymatic activity has been shown. The only phenotype is a mouse knockout myopathy.
      The no-data statement is accurate; accepted.
