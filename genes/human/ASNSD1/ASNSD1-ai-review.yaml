- id: PMID:32638637
  title: Progressive Degenerative Myopathy and Myosteatosis in ASNSD1-Deficient Mice.
  findings:
  - statement: Asnsd1-null mice develop a degenerative myopathy.
    supporting_text: Mice with an inactivating mutation in the gene encoding asparagine synthetase domain
      containing 1 (ASNSD1) develop a progressive degenerative myopathy that results in severe sarcopenia
      and myosteatosis.
  - statement: ASNSD1 is most highly expressed in skeletal muscle.
    supporting_text: ASNSD1 is conserved across many species, and whole body gene expression surveys show
      maximal expression levels of ASNSD1 in skeletal muscle.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; mouse knockout phenotyping.
  full_text_unavailable: true
