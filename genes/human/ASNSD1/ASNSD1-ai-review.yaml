suggested_questions:
- question: Is ASNSD1 an active amidotransferase or asparagine synthetase in muscle, and does loss of
    that activity explain the knockout myopathy?
suggested_experiments:
- description: Assay purified ASNSD1 for glutaminase and asparagine synthetase activity, and test catalytic-site
    (Cys2) mutants for rescue of the Asnsd1-null muscle phenotype.
