- id: file:human/ASNSD1/ASNSD1-deep-research-affinage.md
  title: Affinage mechanistic annotation for ASNSD1 (human)
  findings: []
  reference_review:
    relevance: LOW
    review_notes: Trust gates clear, but the narrative is dominated by ASDURF, the PAQosome microprotein
      encoded by an upstream ORF in the ASNSD1 mRNA, which is a different gene product from the ASNSD1
      protein reviewed here. Its ASNSD1-protein content (mouse myopathy, liver-fibrosis studies) is used
      only for the description, and its PAQosome and chaperone grounding is not applied.
