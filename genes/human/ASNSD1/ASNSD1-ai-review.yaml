suggested_questions:
- question: Is any of the screen-detected PDZ interactions physiological? Syntrophin beta-1 (SNTB1), a
    sarcolemmal PDZ scaffold, is a natural first test given the knockout myopathy.
- question: Is ASNSD1 an active amidotransferase or asparagine synthetase in muscle, and does loss of
    that activity explain the knockout myopathy?
suggested_experiments:
- description: Assay purified ASNSD1 for glutaminase and asparagine synthetase activity, and test mutants
    of the predicted glutamine amidotransferase nucleophile (Cys2) for rescue of the Asnsd1-null muscle
    phenotype.
