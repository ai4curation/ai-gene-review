- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:30126976
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q13884
  review:
    summary: Protein binding (IPI) with SNTB1, from a phospho-regulated PDZ interaction screen. SNTB1
      is a PDZ-domain protein, and the assay measured binding of the ASNSD1 C-terminal peptide, which
      ends in a class I PDZ-binding motif (T-x-L). The evidence supports the more informative term PDZ
      domain binding, as for the equivalent NRXN3 rows from the same screen. This rewrite does not imply
      that each screen-detected partner is physiologically relevant.
    action: MODIFY
    reason: Bare protein binding is uninformative; the partner is a PDZ protein and the assay measures
      PDZ-PBM binding. [PMID:30126976 "We computationally designed an oligonucleotide library encoding
      human C-terminal peptides containing known or predicted Ser/Thr phosphosites and phosphomimetic
      variants thereof."]
    proposed_replacement_terms:
