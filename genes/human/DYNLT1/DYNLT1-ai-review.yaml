- term:
    id: GO:0061523
    label: cilium disassembly
  evidence_type: IMP
  original_reference_id: PMID:21394082
  qualifier: involved_in
  review:
    summary: Thr94-phosphorylated Tctex-1 is recruited to the ciliary transition zone before S-phase entry
      and promotes ciliary resorption.
    action: NEW
    reason: 'Loss-of-function and phospho-mimic gain-of-function both affect cilium disassembly. T94E
      accelerates disassembly, and the mechanism involves actin dynamics. Recruitment is driven by IGF-1R-AGS3-Gbetagamma
      signalling at the ciliary base (PMID:23954591). Participation/comparator: DYNLT1 is a signalling
      effector acting at the transition zone, analogous to the AURKA activator NEDD9, which carries GO:0061523
      in human GOA together with AURKA and HDAC6. Saito et al. 2017 (full text) show that phospho-T94
      Tctex-1 is required for Cdc42 activation and drives branched-actin-dependent periciliary endocytosis
      at the onset of resorption. Tctex-1 therefore does part of the work of disassembly rather than only
      being required for it. The cached 2011 paper is abstract-only.'
    supported_by:
    - reference_id: PMID:21394082
      supporting_text: We show that Tctex-1 phosphorylated at Thr 94 is recruited to ciliary transition
        zones before S-phase entry and has a pivotal role in both ciliary disassembly and cell cycle progression
    - reference_id: PMID:21394082
      supporting_text: Exogenously adding a phospho-mimic Tctex-1(T94E) mutant accelerates cilium disassembly
        and S-phase entry
    - reference_id: PMID:21394082
      supporting_text: Mechanistic studies show the involvement of actin dynamics in Tctex-1-regulated
        cilium resorption
    - reference_id: PMID:23954591
      supporting_text: At the base of the cilium, phosphorylated IGF-1R activates an AGS3-regulated Gβγ
        signaling pathway that subsequently recruits phospho(T94)Tctex-1 to the transition zone
    - reference_id: PMID:28607034
      supporting_text: Mechanistically, Tctex-1 physically and functionally interacts with the actin dynamics
        regulators annexin A2, Arp2/3 complex, and Cdc42. Phospho(T94)Tctex-1 is required for Cdc42 activation
        before the onset of ciliary resorption
    - reference_id: PMID:28607034
      supporting_text: our results support a model in which phospho(T94)Tctex-1-regulated actin polymerization
        and periciliary endocytosis play an active role in orchestrating the initial phase of ciliary
        resorption
