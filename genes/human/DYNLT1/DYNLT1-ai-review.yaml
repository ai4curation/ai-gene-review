core_functions:
- description: Dimeric Tctex-type light chain of cytoplasmic dynein-1 and dynein-2 that binds dynein intermediate
    chains. It contributes to minus-end-directed transport, including retrograde IFT in cilia, where dynein-2
    Tctex-1 is required for normal cilium length.
  molecular_function:
    id: GO:0045505
    label: dynein intermediate chain binding
  directly_involved_in:
  - id: GO:0035721
    label: intraciliary retrograde transport
  in_complex:
    id: GO:0005868
    label: cytoplasmic dynein complex
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005929
    label: cilium
  supported_by:
  - reference_id: PMID:17965411
    supporting_text: In addition, both homodimers of the DYNLT family bind all six intermediate chain
      isoforms
  - reference_id: PMID:24986880
    supporting_text: We co-expressed genes for all six dynein subunits—DYNC1H1 (DHC), DYNC1I2 (DIC), DYNC1LI2
      (DLIC), DYNLT1 (Tctex), DYNLRB1 (Robl) and DYNLL1 (LC8)—from a single baculovirus in Sf9 cells
  - reference_id: PMID:25205765
    supporting_text: Here, all known dynein-1 light chain isoforms (LC8-1 and LC8-2, Tctex-1 and Tctex-3,
      and roadblock-1 and roadblock-2) were identified in association with mGFP–WDR34
  - reference_id: PMID:21700358
    supporting_text: Our data show that Tctex-1 is a key regulator of cilia length and most likely functions
      as part of dynein-2
- description: Thr94-phosphorylated Tctex-1 is recruited to the ciliary transition zone by IGF-1R/Gbetagamma
    signalling as cells re-enter the cell cycle. There it promotes actin-dependent ciliary resorption,
    coupling cilium disassembly to S-phase entry and G1 length in neural progenitors. This phospho-pool
    is not associated with dynein.
  directly_involved_in:
  - id: GO:0061523
    label: cilium disassembly
  locations:
  - id: GO:0035869
    label: ciliary transition zone
  supported_by:
  - reference_id: PMID:21394082
    supporting_text: We show that Tctex-1 phosphorylated at Thr 94 is recruited to ciliary transition
      zones before S-phase entry and has a pivotal role in both ciliary disassembly and cell cycle progression
  - reference_id: PMID:21394082
    supporting_text: Exogenously adding a phospho-mimic Tctex-1(T94E) mutant accelerates cilium disassembly
      and S-phase entry
  - reference_id: PMID:23954591
    supporting_text: At the base of the cilium, phosphorylated IGF-1R activates an AGS3-regulated Gβγ
      signaling pathway that subsequently recruits phospho(T94)Tctex-1 to the transition zone
  - reference_id: PMID:21394082
    supporting_text: Tctex-1 phosphorylated at Thr 94 is also selectively enriched at the ciliary transition
      zones of cortical neural progenitors, and has a key role in controlling G(1) length, cell cycle
      entry and fate determination of these cells during corticogenesis
  - reference_id: PMID:28607034
    supporting_text: Tctex-1, originally identified as a cytoplasmic dynein light chain, has a dynein-independent
      role in ciliary resorption upon phosphorylation at Thr94
  - reference_id: PMID:28607034
    supporting_text: Mechanistically, Tctex-1 physically and functionally interacts with the actin dynamics
      regulators annexin A2, Arp2/3 complex, and Cdc42. Phospho(T94)Tctex-1 is required for Cdc42 activation
      before the onset of ciliary resorption
  - reference_id: file:human/DYNLT1/DYNLT1-deep-research-falcon.md
    supporting_text: Following Thr94 phosphorylation, DYNLT1 is not associated with the dynein complex.
      The phosphorylated protein accumulates at the **ciliary transition zone** before S-phase entry.
suggested_questions:
- question: Does phospho-T94 Tctex-1 promote resorption as a free light chain (dynein-independent, Gbetagamma-associated)
    or within dynein-1/dynein-2 complexes at the transition zone?
- question: How can Tctex-1 depletion both lengthen steady-state cilia and impair serum-induced resorption?
    Are these the same or separable activities?
- question: Which kinase phosphorylates Tctex-1 at T94 in response to mitogens?
- question: Is DYNLT3 redundant with DYNLT1 in dynein-2 and in ciliary resorption?
suggested_experiments:
- description: Knock out DYNLT1 in RPE1 cells and rescue with WT, T94A, T94E and IC-binding-deficient
    mutants. Measure steady-state cilium length, retrograde IFT and serum-induced resorption separately.
- description: Proximity labelling of transition-zone phospho-T94 Tctex-1 to identify partners (Gbetagamma,
    actin regulators, dynein subunits) during resorption.
