id: P63172
gene_symbol: DYNLT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DYNLT1 (Tctex-1) is a small dynein light chain of the Tctex family that forms homodimers,
  and heterodimers with DYNLT3 or the dynein-2-specific DYNLT2B/TCTEX1D2. DYNLT dimers bind dynein intermediate
  chains and are non-catalytic accessory subunits of cytoplasmic dynein-1, the main minus-end-directed
  microtubule motor for retrograde transport of vesicles and organelles. They are also subunits of dynein-2,
  the retrograde intraflagellar transport motor of cilia. Depletion of Tctex-1 lengthens primary cilia,
  consistent with a role in dynein-2-dependent length control. Tctex-1 also has activities apart from
  the motor. It binds G-protein beta-gamma subunits (identical to AGS2), which compete with dynein intermediate
  chain for Tctex-1. It regulates neurite outgrowth and actin dynamics, and in cortical progenitors it
  controls G1 length and neurogenesis. When quiescent cells re-enter the cell cycle, Tctex-1 phosphorylated
  at Thr94 is recruited to the ciliary transition zone downstream of IGF-1 receptor and Gbetagamma signalling.
  There, acting apart from dynein, it activates Cdc42-dependent branched-actin polymerization and periciliary
  endocytosis. This promotes ciliary resorption, which is coupled to S-phase entry. Tctex-1 also binds
  Rab3D on osteoclast secretory vesicles and is exploited for intracellular targeting of retroviral Gag
  polyproteins.
