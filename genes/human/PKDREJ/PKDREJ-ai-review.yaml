gene_symbol: PKDREJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PKDREJ encodes a testis-enriched receptor-for-egg-jelly-like polycystin-family membrane protein. Orthology
  to mouse Pkdrej supports sperm and acrosomal membrane localization and a possible role in acrosome timing, but
  a direct human molecular activity has not been established.'
