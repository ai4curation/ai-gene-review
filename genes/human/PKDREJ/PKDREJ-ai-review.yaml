suggested_questions:
- question: What direct molecular activity does PKDREJ provide at the human sperm or acrosomal membrane?
suggested_experiments:
- description: Tag endogenous human PKDREJ in spermatogenic cells or a sperm model and test whether loss of
    PKDREJ alters acrosomal ion flux or zona pellucida-triggered exocytosis.
