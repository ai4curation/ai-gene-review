suggested_questions:
- question: Do RAMP2/RAMP3 interactions alter HRH2 trafficking, ligand pharmacology or G-protein coupling
    in vivo?
- question: How do tissue-specific HRH2 expression and desensitization explain tolerance to H2 antihistamines
    used for acid suppression?
suggested_experiments:
- description: Cryo-EM of the histamine-HRH2-Gs complex to define the agonist-binding pocket and the basis
    of H2 selectivity.
  experiment_type: structural biology
- description: Reconstitute HRH2 with and without RAMP2/RAMP3 and measure cAMP responses and surface expression
    to test RAMP modulation.
  experiment_type: pharmacology
