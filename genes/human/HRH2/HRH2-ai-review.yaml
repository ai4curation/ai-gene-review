id: P25021
gene_symbol: HRH2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HRH2 encodes the histamine H2 receptor, a class A seven-transmembrane G-protein-coupled receptor
  of the plasma membrane. Histamine binding in its transmembrane pocket couples the receptor to Gs, activating
  adenylate cyclase and raising cAMP. It is best known for driving gastric parietal cell acid secretion,
  and is also expressed in the heart, immune cells (where it shifts cytokine output toward IL-10 over
  IL-12) and the central nervous system, where it mediates histaminergic neurotransmission.
