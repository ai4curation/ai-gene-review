- id: file:genes/human/OTX2/OTX2-deep-research-falcon.md
  title: Deep research review of OTX2 function and biology
  findings:
  - statement: OTX2 recognises bicoid-type homeobox sites in regulatory DNA, with TAATCC as the
      strongest reported in vitro motif.
    supporting_text: OTX2 recognizes bicoid-like homeobox sites in regulatory DNA.
  - statement: In Group 3 medulloblastoma OTX2 behaves as a pioneer-like factor, associating with
      SWI/SNF and coactivator complexes at distal enhancers.
    supporting_text: >-
      OTX2 associated with SWI/SNF components SMARCA4, SMARCA2 and SMARCC1 and with UTX, ASH2 and
      p300.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Machine-generated deep-research report (falcon provider, 2026-09-20). Used for orientation
      and for the DNA-motif and chromatin-cofactor statements cited above; every primary claim
      carried into an annotation was independently checked against the cited PubMed record rather
      than taken from this report. Marked UNVERIFIED because the report itself is not a
      peer-reviewed source. Note it also under-covers the mouse null phenotypes, the OTX2/GBX2
      boundary and the homeoprotein-transfer literature, which were researched separately.
- id: PMID:12559959
  title: OTX2 regulates expression of DOPAchrome tautomerase in human retinal pigment epithelium.
  findings:
  - statement: OTX2 occupies the human DCT promoter in vivo in retinal pigment epithelial cells.
    supporting_text: >-
      OTX2 binds to the DCT gene promoter in vivo, as judged by chromatin immunoprecipitation
      assays.
  - statement: OTX2 activates the DCT promoter through its cognate binding site in an
      RPE-restricted manner, establishing transcriptional activator activity.
    supporting_text: >-
      Transient expression assays revealed that OTX2 activated the DCT gene promoter through
      the OTX-2-binding site in an RPE-specific manner.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. This is the primary human experiment behind the GO:0000978, GO:0001228
      and GO:0045944 IDAs - ChIP occupancy plus a promoter reporter with a mapped OTX2 site.
- id: PMID:15705863
  title: Genomic amplification of orthodenticle homologue 2 in medulloblastomas.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      This paper is a digital-karyotyping copy-number study of medulloblastoma. UniProt used it
      on 2005-06-07 as the TAS source for five annotations at once (GO:0030900, GO:0030901,
      GO:0040036, GO:0008589, GO:0008190). Only the first two are plausibly traceable to it -
      its abstract's sole functional statement is that OTX2 "functions to specify the fate of
      neuroectoderm in various regions of the developing brain". The paper is not open access
      (Europe PMC reports isOpenAccess N, inEPMC N), so the intro/discussion cannot be checked
      and the FGFR- and smoothened-regulation statements are left standing but flagged. The
      eIF4E-binding annotation is the clear error: that result is in PMID:15247416, which shows
      a direct GST pull-down with human OTX2 protein. Recommend UniProt re-referee this block.
- id: PMID:15247416
  title: Emx2 homeodomain transcription factor interacts with eukaryotic translation initiation
    factor 4E (eIF4E) in the axons of olfactory sensory neurons.
  findings:
  - statement: Human OTX2 protein binds eIF4E directly in GST pull-down assays, alongside
      Engrailed 2.
    supporting_text: >-
      Finally, we show that two other brain-expressed homeoproteins, Otx2 and Engrailed 2, also
      bind eIF4E, indicating that several homeoproteins may modulate eIF4E functions in the
      developing and adult nervous system.
  - statement: The construct used for the OTX2 pull-down was the human cDNA, so the binding
      result applies to the human protein.
    supporting_text: >-
      Mouse Emx1, Emx2 (pCMV-Emx2), and human Otx2 cDNAs were provided by A. Simeone
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. The title names Emx2, but OTX2 was assayed directly (Fig. 4E pull-down)
      using a human OTX2 construct, so this is not a paralog mis-attribution. This is the real
      evidence for GO:0008190, which GOA instead attributes to PMID:15705863.
- id: PMID:16267555
  title: The transcription factor Engrailed-2 guides retinal axons.
  findings:
  - statement: OTX2 was assayed in this study as the specificity control and is internalised by
      retinal growth cones.
    supporting_text: >-
      To address this, we tested Otx2, another homeodomain transcription factor that shares the
      secretion, internalization and eIF4E-binding properties of En-2
  - statement: The published conclusion is that OTX2 does not produce the divergent turning
      response that defines the guidance activity; it only weakly attracted both populations.
    supporting_text: >-
      Thus, unlike En-2, Otx2 does not elicit opposite turning responses in the two populations
      of retinal axons, indicating that En-2 acts specifically to induce these divergent
      behaviours.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text checked. Despite the Engrailed-2 title, OTX2 was genuinely
      assayed, so the growth-cone localisation annotation is properly attributed. The axon
      guidance annotation, however, reverses the paper's own conclusion about OTX2.
- id: PMID:19414065
  title: Expression of the homeobox genes PAX6, OTX2, and OTX1 in the early human fetal retina.
  findings:
  - statement: OTX2 protein is nuclear in human fetal retinal pigment epithelium.
    supporting_text: >-
      OTX2 was localized to the nuclei of retinal pigment epithelium
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified human fetal expression study; supports the nuclear localisation annotation
      in the tissue where OTX2's retinal role is exercised.
- id: PMID:19951692
  title: Wnt1-lmx1a forms a novel autoregulatory loop and controls midbrain dopaminergic
    differentiation synergistically with the SHH-FoxA2 pathway.
  findings:
  - statement: Otx2 acts combinatorially with Lmx1a and FoxA2 to enhance midbrain dopaminergic
      differentiation, which is the genetic interaction behind the IGI.
    supporting_text: >-
      Furthermore, coactivation of both Wnt1 and SHH pathways by exogenous expression of Lmx1a,
      Otx2, and FoxA2 synergistically enhanced the differentiation of ESCs to mDA neurons.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Otx2 is one of the three factors in the tested combination, so the IGI
      evidence code is used correctly; the role is downstream of OTX2's midbrain patterning
      function rather than a distinct core activity.
- id: PMID:20530484
  title: SOX9, through interaction with microphthalmia-associated transcription factor (MITF)
    and OTX2, regulates BEST1 expression in the retinal pigment epithelium.
  findings:
  - statement: OTX2 physically interacts with SOX9 and MITF and the three synergistically
      activate the human BEST1 promoter.
    supporting_text: >-
      Importantly, SOX9 physically interacted with MITF and OTX2 and orchestrated synergistic
      activation of the BEST1 promoter with the paired SOX site playing essential roles.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Supports the second human RPE target and the combinatorial activation
      mechanism; it is also the sole basis for the generic GO:0005515, GO:0032991 and GO:0065003
      annotations, which restate the same result at lower information content.
