  label: Homo sapiens
description: >-
  OTX2 is a bicoid-class, paired-like homeodomain transcription factor that acts in the
  nucleus on chromatin, recognising bicoid-type TAATCC cis-regulatory sequences and
  activating or repressing RNA polymerase II transcription according to promoter context
  and partner factors. Its defining role is the specification and maintenance of anterior
  neural identity: OTX2 marks the anterior neural ectoderm that arises during gastrulation
  and gives rise to the forebrain and midbrain, and its sharp caudal boundary - set by
  mutual antagonism with GBX2 - positions the midbrain-hindbrain (isthmic) organizer. Loss
  of the mouse orthologue deletes the forebrain and midbrain outright, through a failure of
  anterior neuroectoderm specification rather than later degeneration. OTX2 is redeployed at
  later stages and in several adult tissues: it determines retinal photoreceptor fate through
  direct activation of CRX, drives retinal-pigment-epithelium-restricted genes such as DCT
  and BEST1 (the latter in synergy with SOX9 and MITF), is required for pinealocyte
  development, and acts non-cell-autonomously from the hypothalamus, where it controls FGF10
  expression that in turn induces LHX3 in oral ectoderm and sustains pituitary progenitors.
  Beyond the nucleus, OTX2 is one of several homeoproteins that transfer between cells and
  bind eukaryotic translation initiation factor 4E; transferred OTX2 accumulates in cortical
  parvalbumin interneurons and times postnatal critical-period plasticity. Human
  haploinsufficiency causes a variably penetrant anophthalmia/microphthalmia, optic-nerve
  hypoplasia, retinal dystrophy and hypopituitarism spectrum, while aberrant retention or
  amplification of OTX2 sustains Group 3 and Group 4 medulloblastoma.
