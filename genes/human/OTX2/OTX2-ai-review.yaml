proposed_new_terms: []
suggested_questions:
- question: >-
    Is the eIF4E-binding activity of OTX2 used physiologically, or is it an incidental shared
    property of the homeodomain fold? The binding is direct and demonstrated with human protein,
    and OTX2 transfers non-cell-autonomously into cortical parvalbumin interneurons, but no
    experiment yet links OTX2-eIF4E binding to a specific translational readout in a cell where
    OTX2 is known to act.
  experts: []
- question: >-
    Should UniProt re-referee the block of five TAS annotations dated 2005-06-07 that all cite
    PMID:15705863? At least one (GO:0008190 eukaryotic initiation factor 4E binding) is
    demonstrably sourced from a different paper (PMID:15247416), and two more (regulation of
    smoothened and of fibroblast growth factor receptor signalling) cannot be traced to the
    cited abstract, which concerns genomic amplification in medulloblastoma.
  experts: []
- question: >-
    The methyl-SELEX survey places OTX2 among the extended homeodomain factors that prefer
    CpG-methylated binding sites. Is there a GO representation for methylation-state-dependent
    DNA binding, and does the preference have an in vivo consequence for OTX2 target selection
    in retina or anterior neural ectoderm?
  experts: []
- question: >-
    Is there an appropriate way to represent homeoprotein intercellular transfer in GO? OTX2's
    role in timing visual-cortex critical-period plasticity depends on protein made elsewhere
    accumulating in parvalbumin interneurons, which is neither secretion by a canonical pathway
    nor cell-autonomous transcriptional regulation.
  experts: []
suggested_experiments:
- experiment_type: Human anterior neural ectoderm perturbation with multi-omic readout
  hypothesis: >-
    OTX2 is required cell-autonomously to establish and maintain the committed anterior neural
    ectoderm state in human cells, and its loss permits posteriorisation by FGF and retinoic acid.
  description: >-
    Using the human pluripotent-stem-cell anterior/posterior neural ectoderm system, generate
    inducible OTX2 knockout and degron lines and ask whether day-2 anterior neural ectoderm loses
    its resistance to hindbrain-inducing signals. Combine time-resolved ATAC-seq and OTX2 CUT&RUN
    to test whether the divergent chromatin landscape that foreshadows forebrain/midbrain identity
    is OTX2-dependent, and whether OTX2 loss opens the GBX2/HOX loci that are normally kept closed.
- experiment_type: Boundary-reconstitution assay for the OTX2/GBX2 switch in human cells
  hypothesis: >-
    Mutual transcriptional repression between OTX2 and GBX2 is sufficient to generate a sharp,
    self-correcting anteroposterior boundary in a human in vitro system, as it is in mouse.
  description: >-
    Co-culture or micropattern human anterior and posterior neural ectoderm with inducible OTX2
    and GBX2 alleles, and measure boundary sharpness, organizer-gene induction (FGF8, WNT1) and
    the position of the resulting midbrain/hindbrain marker domains. Test whether forced GBX2 in
    the OTX2 domain relocates the boundary as it does in mouse embryos.
- experiment_type: Functional test of the OTX2-eIF4E interaction
  hypothesis: >-
    OTX2 binding to eIF4E modulates local translation in cells that take up transferred OTX2
    protein, and is separable from its DNA-binding activity.
  description: >-
    Map and mutate the eIF4E-binding motif in human OTX2 without disturbing the homeodomain, then
    compare wild-type and binding-deficient protein for cap-dependent translation readouts in
    recipient cells, for accumulation in parvalbumin interneurons, and for rescue of
    critical-period timing. A separation-of-function allele would determine whether GO:0008190
    describes a used activity or an incidental fold property.
