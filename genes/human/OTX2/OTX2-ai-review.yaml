    id: GO:0009952
    label: anterior/posterior pattern specification
  evidence_type: ISS
  original_reference_id: PMID:7588062
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P80206
  review:
    summary: >-
      Proposed new annotation. OTX2 is an anteroposterior selector: its expression domain defines
      the anterior neural territory during gastrulation, and its sharp caudal border - set by
      mutual antagonism with GBX2 - is the instructive determinant of where along the AP axis the
      midbrain-hindbrain organizer forms. Human GOA records the anatomical outcomes (forebrain
      and midbrain development) but nothing about the axial patterning that produces them.
    action: NEW
    reason: >-
      Proposed after running the project's NEW checks, which resolve in favour of the term on
      three counts. (1) The entity performing the step is OTX2 itself, not an upstream signal:
      the Millet experiment shifts the OTX2 border with ectopic GBX2 and a functional organizer
      re-forms at the new border, so the boundary is instructive rather than a readout, and the
      mouse null loses anterior identity through failed specification rather than degeneration.
      (2) The comparator check supports it rather than refuting it. Mouse Otx2 carries GO:0009952
      by both IMP and IGI, and so do the other regional selectors in their mouse form - Hoxa1
      (IMP, IGI), Gbx2 and Six3 via the descendants GO:0030917 and GO:0021797. The human
      orthologues GBX2, SIX3, EN1 and HOXA1 all have zero annotations under this term. That is a
      species artefact of where the perturbation experiments were done, not a GO convention about
      which kind of gene carries the term, and human OTX2 already receives four other ISS
      transfers from the same mouse protein (GO_REF:0000024) - this one is simply missing from
      that set. Checked in the other direction too: GO:0021999 neural plate anterior/posterior
      regionalization, which is the term the triggering paper is about, is annotated only to
      CELSR2, NOG and SSBP3 in mammals and to zebrafish axin1, bptf, smad2 and gsc
      experimentally - morphogen and chromatin machinery, not regional selectors - so that term
      is deliberately not proposed. (3) It is neither an ancestor nor a descendant of any term
      OTX2 already carries: GO:0009952 sits under GO:0003002 regionalization and GO:0007389,
      whereas GO:0030900 and GO:0030901 are anatomical structure development terms. The
      descendant GO:0021978 telencephalon regionalization, which mouse Otx2 carries by IMP, was
      rejected for exactly this redundancy reason, being a descendant of GO:0030900. Human
      support is now also available: OTX2-positive anterior neural ectoderm generated from human
      pluripotent stem cells is lineage committed to forebrain/midbrain fate.
    additional_reference_ids:
    - PMID:8565836
    - PMID:42760324
    supported_by:
    - reference_id: PMID:7588062
      supporting_text: >-
        These data suggest that Otx2 expression in endomesoderm and ectoderm is required for
        anterior neuroectoderm specification.
    - reference_id: PMID:10490024
      supporting_text: >-
        we transiently expressed Gbx2 in the caudal Otx2 domain and found that the Otx2 caudal
        border was indeed shifted rostrally and a normal appearing organizer formed at this new
        Otx2 border.
    - reference_id: PMID:42760324
      supporting_text: >-
        Two parallel brain progenitors emerge simultaneously during gastrulation: anterior neural
        ectoderm (forebrain/midbrain progenitor) and posterior neural ectoderm (hindbrain
        progenitor).
core_functions:
- description: >-
    OTX2 acts in the nucleus and on chromatin as a bicoid-class homeodomain sequence-specific
    DNA-binding transcription factor, recognising TAATCC-type cis-regulatory elements at RNA
    polymerase II genes. This single molecular activity is deployed as an anteroposterior
    identity selector: OTX2 marks and specifies the anterior neural ectoderm that arises during
    gastrulation, and the sharp caudal limit of its expression domain, maintained by mutual
    antagonism with GBX2, positions the midbrain-hindbrain organizer. Loss of the orthologue
    deletes the forebrain and midbrain through failure of this specification step rather than
    through later degeneration, and human OTX2-positive anterior neural ectoderm is already
    committed to forebrain/midbrain fate when challenged with posteriorising signals.
