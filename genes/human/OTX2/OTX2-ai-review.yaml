- description: >-
    In the retinal lineage the same DNA-binding activity is used as a direct transcriptional
    activator. OTX2 determines photoreceptor fate by transactivating CRX and is required for
    pinealocyte development; in the retinal pigment epithelium it occupies and activates
    RPE-restricted promoters, driving DCT through a mapped OTX2 site and BEST1 in physical and
    functional synergy with SOX9 and MITF. These are the human-cell experiments that anchor the
    activator-activity and positive-regulation annotations.
