- id: PMID:7588062
  title: Forebrain and midbrain regions are deleted in Otx2-/- mutants due to a defective
    anterior neuroectoderm specification during gastrulation.
  findings:
  - statement: Mouse Otx2 null embryos lack the forebrain and midbrain entirely.
    supporting_text: >-
      By 9.5 dpc, homozygous mutant embryos are characterized by the absence of forebrain and
      midbrain regions.
  - statement: The defect is a failure of anterior neuroectoderm specification during
      gastrulation, not later degeneration.
    supporting_text: >-
      These data suggest that Otx2 expression in endomesoderm and ectoderm is required for
      anterior neuroectoderm specification.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary mouse genetic study. This, with PMID:7590242 and PMID:8565836, is
      the strongest evidence for OTX2's anterior-patterning role - stronger than the TAS source
      GOA actually cites for GO:0030900/GO:0030901.
- id: PMID:7590242
  title: Mouse Otx2 functions in the formation and patterning of rostral head.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified independent mouse null allele replicating the rostral-head/anterior-brain
      requirement.
- id: PMID:8565836
  title: A targeted mouse Otx2 mutation leads to severe defects in gastrulation and formation
    of axial mesoderm and to deletion of rostral brain.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Independent null allele showing that the requirement begins at
      gastrulation; this is the experimental basis underpinning the mouse-derived ISS
      gastrulation and primitive-streak transfers.
- id: PMID:10490024
  title: A role for Gbx2 in repression of Otx2 and positioning the mid/hindbrain organizer.
  findings:
  - statement: GBX2 represses OTX2 and the sharp caudal OTX2 border positions the
      midbrain-hindbrain organizer.
    supporting_text: >-
      We propose that formation of a normal MHB organizer depends on a sharp Otx2 caudal border
      and that Gbx2 is required to position and sharpen this border.
  - statement: Shifting the OTX2 border by ectopic Gbx2 relocates the organizer, showing the
      boundary is instructive.
    supporting_text: >-
      we transiently expressed Gbx2 in the caudal Otx2 domain and found that the Otx2 caudal
      border was indeed shifted rostrally and a normal appearing organizer formed at this new
      Otx2 border.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified primary mouse study; establishes the OTX2/GBX2 boundary mechanism that
      links OTX2's anterior domain to midbrain-hindbrain organizer position.
- id: PMID:14625556
  title: Otx2 homeobox gene controls retinal photoreceptor cell fate and pineal gland development.
  findings:
  - statement: Conditional Otx2 loss converts differentiating photoreceptors to amacrine-like
      neurons and abolishes pinealocytes.
    supporting_text: >-
      Otx2-deficiency converted differentiating photoreceptor cells to amacrine-like neurons and
      led to a total lack of pinealocytes in the pineal gland.
  - statement: OTX2 acts through direct transactivation of CRX, and is sufficient to drive
      photoreceptor fate.
    supporting_text: >-
      We also found that Otx2 transactivates the cone-rod homeobox gene Crx, which is required
      for terminal differentiation and maintenance of photoreceptor cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified conditional-knockout study; necessity and sufficiency for photoreceptor
      fate plus the CRX target make this the reference retinal-role paper.
- id: PMID:18692473
  title: Experience-dependent transfer of Otx2 homeoprotein into the visual cortex activates
    postnatal plasticity.
  findings:
  - statement: OTX2 transfers non-cell-autonomously into cortical parvalbumin interneurons in
      response to visual experience and sets critical-period timing.
    supporting_text: >-
      Visual experience promoted the accumulation of non-cell-autonomous Otx2 in PV-cells, and
      cortical infusion of exogenous Otx2 accelerated both PV-cell development and critical
      period timing.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Strong mouse evidence for the homeoprotein-transfer function. Not
      proposed as a new human annotation here - see the notes file for the reasoning - but it is
      the biological context that makes the eIF4E-binding and growth-cone annotations coherent
      rather than stray.
- id: PMID:31845906
  title: Congenital pituitary hypoplasia model demonstrates hypothalamic OTX2 regulation of
    pituitary progenitor cells.
  findings:
  - statement: Hypothalamic OTX2 acts non-cell-autonomously on pituitary progenitors by
      controlling FGF10, which induces LHX3 in oral ectoderm.
    supporting_text: >-
      OTX2 in hypothalamus, not in oral ectoderm, was essential for progenitor cell maintenance
      by regulating LHX3 expression in oral ectoderm via FGF10 expression in the hypothalamus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified human patient-iPSC organoid study with CRISPR correction and independent
      engineered haploinsufficiency. This is the concrete mechanism that would justify a
      regulation-of-FGFR-signaling annotation, in place of the unverifiable TAS source GOA cites.
- id: PMID:33950863
  title: The phenotypic spectrum associated with OTX2 mutations in humans.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified human genetics cohort; establishes the dosage-sensitive ocular-pituitary
      phenotype and supports a hypothalamic rather than autonomous pituitary origin.
- id: PMID:28213356
  title: OTX2 Activity at Distal Regulatory Elements Shapes the Chromatin Landscape of Group 3
    Medulloblastoma.
  findings:
  - statement: OTX2 occupancy is overwhelmingly at distal enhancers rather than promoters.
    supporting_text: >-
      OTX2 binding sites were found at putative enhancer regions (91%) while only a small
      fraction were present at promoters (9%)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Cited for the chromatin/enhancer mode of action supporting the chromatin
      location term. The disease context means it is not used to propose process annotations.
- id: PMID:39025928
  title: A group 3 medulloblastoma stem cell program is maintained by OTX2-mediated alternative
    splicing.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Reports an OTX2-LASR splicing-regulatory role in Group 3 medulloblastoma.
      Recorded as context for the non-transcriptional side of OTX2 biology; too tumour-specific
      to support a normal-function annotation.
- id: PMID:42760324
  title: Two parallel neural ectoderm progenitors contribute to the developing brain.
  findings:
  - statement: OTX2-positive anterior neural ectoderm and GBX2-positive posterior neural
      ectoderm arise in parallel during gastrulation as the forebrain/midbrain and hindbrain
      progenitors respectively.
    supporting_text: >-
      Two parallel brain progenitors emerge simultaneously during gastrulation: anterior neural
      ectoderm (forebrain/midbrain progenitor) and posterior neural ectoderm (hindbrain
      progenitor).
  - statement: The two populations are already lineage committed, not merely differently
      positioned.
    supporting_text: >-
      Differentiation of human pluripotent stem cells into anterior or posterior neural
      ectoderm-like cells revealed these were lineage committed to forebrain/midbrain versus
      hindbrain fates, respectively.
  - statement: Commitment has a chromatin correlate that precedes overt regional identity.
    supporting_text: >-
      They harbored diverging chromatin landscapes foreshadowing future forebrain/midbrain versus
      hindbrain identities.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Nat Neurosci, 2026). Cached record is abstract-only. Establishes OTX2 as
      the marker of one of two parallel, lineage-committed brain progenitors, and provides the
      first human in vitro system in which an OTX2-stage anterior neural ectoderm identity can be
      assayed directly.
