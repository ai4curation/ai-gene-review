description: 'ARMS2 is a small (107-residue), primate-specific protein encoded at the 10q26 age-related
  macular degeneration (AMD) locus. Although it lacks a signal peptide, it is secreted by an unconventional
  route that recruits the cytosolic lectin chaperones calnexin and calreticulin and bypasses the Golgi.
  It is found in the extracellular matrix of the choroid and binds matrix proteins such as hemicentin-1.
  ARMS2 binds apoptotic and necrotic cell surfaces and recruits the complement activator properdin, promoting
  C3b opsonization for phagocytic clearance. Its intracellular location is disputed: one study reported
  a mitochondrial association, another found it cytosolic and not mitochondrial. The AMD-risk haplotype
  carries a 3'' UTR indel that destabilizes ARMS2 mRNA, so risk homozygotes make no detectable protein.'
