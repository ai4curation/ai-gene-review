  review:
    summary: Histone deacetylase activity of HDAC5 (IBA).
    action: MARK_AS_OVER_ANNOTATED
    reason: Class IIa HDACs, including HDAC5, carry His in place of the catalytic Tyr conserved in other HDACs and
      are about 1000-fold less active than class I enzymes on acetyl-lysine substrates (PMID:17956988). Deacetylase
      activity measured in HDAC5 immunoprecipitates (PMID:10220385, PMID:10869435) co-purifies with HDAC3, and reconstitution
      shows that class II HDACs do not contribute to the activity of the SMRT/N-CoR-HDAC3 complex (PMID:11804585).
      The in vitro histone deacetylase activity is real but weak and of uncertain physiological relevance; HDAC5
      represses chromatin mainly by recruiting HDAC3 complexes. Following the promiscuous-activity tiers, this is
      marked as an over-annotation rather than removed.
    supported_by:
    - &id008
      reference_id: PMID:17956988
      supporting_text: Previous findings have suggested that class IIa histone deacetylases (HDACs) (HDAC4, -5,
        -7, and -9) are inactive on acetylated substrates, thus differing from class I and IIb enzymes.
    - &id009
      reference_id: PMID:17956988
      supporting_text: A catalytic Tyr is conserved in all HDACs except for vertebrate class IIa enzymes where it
        is replaced by His.
    - &id010
      reference_id: PMID:11804585
      supporting_text: In vitro reconstitution experiments indicate that HDAC4 and other class II HDACs are inactive
        in the context of the SMRT/N-CoR-HDAC3 complex and do not contribute to its enzymatic activity.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: PANTHER:PTN008143312
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Deep ancestral node spanning class I and class II HDACs; activity is well grounded for class I
          members, but vertebrate class IIa descendants replaced the catalytic Tyr with His and retain only weak
          activity.
      - source_id: UniProtKB:Q9UQL6
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: HDAC5 own IDA rows (PMID:10220385, PMID:10869435) measure immunoprecipitate activity that co-purifies
          with HDAC3; expected and not circular, but weak as evidence of intrinsic activity.
      residue_claims:
      - claim_type: SUBSTITUTED
        method: MSA
        role: catalytic tyrosine that stabilises the tetrahedral intermediate
        anchor:
          accession: UniProtKB:Q13547
          position: 303
          residue: Y
        target:
          accession: UniProtKB:Q9UQL6
          position: 1006
          residue: H
        comment: Pairwise BLOSUM62 alignment of HDAC1 and HDAC5 (UniProt canonical sequences); HDAC5 H1006 corresponds
          to HDAC4 H976 described in PMID:17956988.
