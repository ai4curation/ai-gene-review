suggested_questions:
- question: Does HDAC5 have a physiological substrate that its His-containing class IIa active site processes efficiently,
    or is all deacetylation attributed to HDAC5 (GCM1, tubulin) mediated by recruited HDAC3?
- question: GO:0000976 transcription cis-regulatory region binding is_a sequence-specific DNA binding; is it appropriate
    (even with contributes_to) for coregulators recruited by DNA-binding partners, as proposed in the HDAC4 review?
- question: Is HDAC5-mediated coactivation of HIF-1alpha seen at endogenous expression levels and in hypoxic tissues?
suggested_experiments:
- hypothesis: Repression by HDAC5 does not need its own catalytic activity.
  description: Compare wild-type, catalytic-dead and His-to-Tyr (gain-of-activity) HDAC5 in HDAC5-null myoblasts
    and endothelial cells for repression of MEF2 targets and FGF2/SLIT2, with and without HDAC3 knockdown.
  experiment_type: genetic complementation
