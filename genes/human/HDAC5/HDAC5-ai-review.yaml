id: Q9UQL6
gene_symbol: HDAC5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HDAC5 is a class IIa histone deacetylase that acts mainly as a signal-regulated transcriptional corepressor.
  Its N-terminal extension binds MEF2 and other DNA-binding transcription factors (HIF-1alpha, GCM1, GATA3, XBP1s,
  RFXANK) and recruits the catalytically active HDAC3/N-CoR/SMRT complex and HP1, repressing target genes such as
  MEF2-dependent muscle genes, GLUT4, FGF2/SLIT2 in endothelium and syncytin-1 in trophoblasts. Its C-terminal deacetylase
  domain carries a His in place of the catalytic Tyr and has only weak intrinsic activity on acetyl-lysine. Phosphorylation
  of Ser259 and Ser498 by CaMK, AMPK, PKD, SIK1 and related kinases creates 14-3-3 binding sites that drive CRM1-dependent
  nuclear export, derepressing targets; this couples calcium, energy and other signals to gene expression in muscle
  differentiation, cardiac hypertrophy, angiogenesis, placental cell fusion and neuronal adaptation. In some contexts
  it can enhance transcription, as for HIF-1alpha.
