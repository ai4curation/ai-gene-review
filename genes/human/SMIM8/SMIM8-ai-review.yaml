description: >-
  SMIM8 (formerly C6orf162) is a 97-amino-acid protein with a disordered, charged
  N-terminal region (residues 1-24) and a single predicted helical transmembrane segment
  (residues 48-70). It is the founding member of the SMIM8 family (Pfam PF14937, DUF4500),
  which has no characterized members. Quantitative proteomics of purified human
  mitochondria places SMIM8 in the high-confidence mitochondrial proteome; which
  mitochondrial membrane it occupies and its orientation are not known. Human SMIM8 mRNA is
  broadly expressed, whereas the mouse gene is predominantly testicular. Mice lacking Smim8
  are viable and the males are fertile. In human adipose and muscle transcriptome studies,
  SMIM8 mRNA levels correlate positively with improvement in insulin sensitivity. No
  molecular function or biological process has been demonstrated.
existing_annotations:
- term:
