    label: mitochondrion
  evidence_type: HTP
  original_reference_id: PMID:34800366
  qualifier: located_in
  review:
    summary: >-
      High-throughput localization from MitoCoP, a quantitative proteomic definition of the
      human mitochondrial proteome, in which SMIM8 is classified as a high-confidence
      mitochondrial protein.
    action: ACCEPT
    reason: >-
      This is the only experimental localization for SMIM8, and the MitoCoP classification
      is based on quantitative enrichment in purified mitochondria rather than mere
      detection. It is consistent with SMIM8 having a single transmembrane helix. The
      sub-mitochondrial compartment is unknown, so the general term is appropriate.
    supported_by:
    - reference_id: PMID:34800366
      supporting_text: We defined a human mitochondrial high-confidence proteome (MitoCoP) of
        1,134 protein-coding genes, including 91 proteins previously not localized to
        mitochondria experimentally.
