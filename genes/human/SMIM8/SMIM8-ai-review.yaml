  findings:
  - statement: Smim8 knockout male mice are fertile, so Smim8 is not required for male
      fertility in mouse.
    supporting_text: Here, we deleted 12 mouse genes that are predicted to be expressed
      predominantly in the testis with the CRISPR/Cas9 system and revealed that all 12
      genes were dispensable for male fertility.
  reference_review:
    relevance: MEDIUM
