suggested_questions:
- question: >-
    Is SMIM8 in the outer or the inner mitochondrial membrane, and which way does its
    charged N-terminal region face?
- question: >-
    Does the co-variation of SMIM8 mRNA with mitochondrial catabolic enzymes and with
    insulin sensitivity reflect a role in mitochondrial metabolism, or only co-regulation
    with mitochondrial biogenesis?
suggested_experiments:
- hypothesis: SMIM8 is an integral protein of a specific mitochondrial membrane.
  description: >-
    Determine sub-mitochondrial localization and topology by protease protection of intact
    mitochondria and mitoplasts, carbonate extraction, and super-resolution imaging of
    tagged SMIM8 against outer- and inner-membrane markers; then look for respiratory or
    metabolic phenotypes in SMIM8-knockout cells.
  experiment_type: subcellular fractionation and protease protection
