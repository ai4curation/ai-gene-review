additional_original_access:
  PMID:11279501: 'Recovered indexed full Methods/Results: refolded human CTLA4 1-126 and CD86 1-109 extracellular
    constructs; the structure alone is not a cellular inhibitory assay.'
  PMID:11279502: 'Recovered indexed original source: CHO-expressed cleaved CTLA4 C122S 3-125 and CD80
    1-214; the publisher correction DOI 10.1038/35079149 supplies PDB 1I8L. No obligatory native membrane
    lattice inferred.'
  PMID:7544393: Authentic complete original PDF read by the independent consultant; the owner read selected
    Methods and initial Results. The adhesion assay uses CD28-positive CTLA4-negative Jurkat cells; soluble
    CTLA4-Ig binding is a separate experiment.
  PMID:18641304: Original suppression Methods and CFSE/thymidine responder endpoints read independently;
    owner read bounded Methods passages. Full-length human CTLA4 confers acquired suppressive function,
    not negative Treg differentiation.
  PMID:17875758: Full original remains unrecovered after publisher access failure. Its complete abstract
    and source assertions were retained. No categorical wrong-gene or T-cell-only rejection.
  PMID:7807015 / PMID:9398332 / PMID:9813138: Complete abstracts and literal MINT pairs support p85 SH2
    binding. Full originals remain unrecovered; MINT host is unspecified. Historical Tyr165 is not confidently
    assigned to a mature-chain convention.
  corrections: PMID:41039152 corrects the fourth equation in PMID:40205054, not a CTLA4 attribution. PMC11541189
    corrects a CLC4M figure omission, affinity-unit label and Methods citations in PMID:35922511.
