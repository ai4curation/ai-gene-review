interaction_interpretation:
  B7_ligands: CD80/CD86 contacts in structures and screens are interpreted with independently measured
    ligand capture/depletion for decoy activity; structure-only observations are not relabeled cellular
    inhibition.
  HuRI: Binary pair detection for TMEM218/A2RU14, MALL/Q13021 and CTXN3/Q4LDR2 supports interaction, without
    an established shared physiological function.
  LRBA: The 33961781 AP-MS pair is literal; the 26206937 and 40205054 exact target records remain unrecovered.
    Independent trafficking/association evidence supports non-core binding without inventing a missing
    table read.
  PIK3R1: Three MINT pairs identify p85/P27986. The class refinement does not assign PI3K catalytic activity
    to CTLA4; complete abstracts are distinguished from unavailable full originals.
