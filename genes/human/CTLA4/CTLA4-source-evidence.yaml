  judgments:
    row0: Actual common-ancestor placement and descendant surface evidence support location.
    row1: The human experimental self seed is legitimate. Its acquisition-of-suppression assay measures
      inhibition of responder division, not negative differentiation of the suppressor cells.
    row2: The mouse Cd28 seed is genuine. TCR signaling participation does not impose an activating sign
      on CTLA4.
    row3: Human self evidence is legitimate, but the source does not presently resolve cross-link-initiated
      BCR signaling; later primary CLL survival/proliferation results do not settle that pathway step.
