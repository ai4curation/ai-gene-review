id: P16410
gene_symbol: CTLA4
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CTLA4 (CD152) is an inhibitory immune receptor whose canonical protein is a single-pass
  type I membrane glycoprotein with an extracellular Ig-like V-type domain and a disulfide-linked homodimeric
  organization. It binds the B7 ligands CD80 and CD86 more strongly than the stimulatory receptor CD28,
  restricting their availability for T-cell costimulation. Ligand capture and transendocytosis remove
  B7 molecules from neighboring antigen-presenting cells, reducing responder T-cell activation and proliferation.
  CTLA4 is constitutively expressed in regulatory T cells and induced in activated conventional T cells.
  Much of the protein resides in intracellular vesicles and cycles to the surface. Its cytoplasmic YVKM
  motif regulates trafficking: phosphorylation of Tyr201 in the canonical precursor prevents AP-2 binding
  and favors surface retention. Heterozygous pathogenic CTLA4 variants cause immune dysregulation with
  autoimmunity, immunodeficiency and lymphoproliferation (IDAIL). CTLA4 is targeted by the blocking antibody
  ipilimumab, whereas the soluble CTLA4-Ig fusion abatacept exploits B7 binding to inhibit costimulation.'
