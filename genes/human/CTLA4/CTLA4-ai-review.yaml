- molecular_function:
    id: GO:0140319
    label: receptor decoy activity
  directly_involved_in:
  - id: GO:0050868
    label: negative regulation of T cell activation
  - id: GO:0050860
    label: negative regulation of T cell receptor signaling pathway
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  description: CTLA4 sequesters the CD28 co-stimulatory ligands CD80 and CD86 at the T-cell surface. Its
    stronger B7 binding than CD28 and dimeric organization favor ligand capture, limiting CD28-dependent
    costimulation. Transendocytosis removes these ligands from neighboring antigen-presenting cells and
    directs them toward degradation, thereby suppressing responder T-cell activation. Regulated surface
    exposure and endocytosis enable this ligand-depleting activity in activated and regulatory T cells.
  supported_by:
  - reference_id: PMID:11279501
  - reference_id: PMID:11279502
  - reference_id: PMID:18641304
  - reference_id: PMID:21474713
    supporting_text: CTLA-4 can capture its ligands from opposing cells
suggested_questions:
- question: Which official truncated CTLA4 products are translated and localized in primary human cells,
    and do any retain ligand binding or inhibitory activity?
- question: Do the original PMID:17875758 experiments establish a BCR-crosslink-initiated response or
    a defined DNA-damage response independently of CLL proliferation and survival?
- question: What physiological roles do the supported CTLA4 interactions with LRBA, TMEM218, MALL and
    CTXN3 perform, and which are direct in native human-cell contexts?
suggested_experiments:
- description: Compare sequence-verified official CTLA4 products in matched ligand-binding, surface-trafficking
    and responder-cell assays, with expression-normalized canonical and empty-vector controls.
- description: In primary CLL cells, combine CTLA4 perturbation with controlled BCR crosslinking or a
    defined DNA-damage stimulus and measure pathway-proximal responses separately from cell viability
    and proliferation.
