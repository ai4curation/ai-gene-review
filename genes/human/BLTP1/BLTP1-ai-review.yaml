id: Q2LD37
gene_symbol: BLTP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BLTP1, formerly KIAA1109, is a large bridge-like lipid transfer protein involved in membrane
  lipid homeostasis. Its conserved repeating beta-groove architecture forms a hydrophobic route for phospholipid
  movement between membranes. Evidence from yeast Csf1 and animal orthologs supports phosphatidylethanolamine
  supply and an ER-associated membrane-bridging function; human cell studies connect BLTP1 to ER–plasma-membrane
  contact maintenance, endosomal trafficking, recycling and phagocytic uptake. The detailed lipid-transfer
  mechanism and topology are established principally in orthologs. Biallelic pathogenic variants cause
  Alkuraya-Kucinskas syndrome, a developmental disorder with brain malformations and arthrogryposis.
