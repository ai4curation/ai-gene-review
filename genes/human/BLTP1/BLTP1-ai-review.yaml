core_functions:
- description: BLTP1 has a conserved bridge-like architecture supporting intermembrane phospholipid movement.
    The detailed structural evidence derives from worm LPD-3, while human perturbations support ER–plasma-membrane
    contact maintenance and membrane trafficking. Phosphatidylethanolamine supply is implicated by yeast
    Csf1 physiology, but substrate identity and selectivity are not resolved by the available structure
    or direct human lipid-transfer measurements.
  molecular_function:
    id: GO:0120014
    label: phospholipid transfer activity
  directly_involved_in:
  - id: GO:0120009
    label: intermembrane lipid transfer
  locations:
  - id: GO:0140268
    label: endoplasmic reticulum-plasma membrane contact site
  supported_by:
  - reference_id: PMID:35015055
  - reference_id: PMID:35491307
  - reference_id: PMID:40269155
suggested_questions:
- question: Which lipids are transferred by purified human BLTP1, and how does its substrate preference
    compare with yeast Csf1 and worm LPD-3?
- question: Which human BLTP1 isoforms and accessory proteins form functional ER–plasma-membrane bridges
    in polarized and nonpolarized cells?
- question: What experiments in the original FSA study support nuclear localization and direct regulation
    of epithelial growth or differentiation?
- question: What functional role, if any, does the curated BLTP1–beta-catenin interaction play beyond
    physical association?
suggested_experiments:
- description: Reconstitute human BLTP1 with defined donor and acceptor membranes and candidate accessory
    proteins, measuring transfer of multiple phospholipid classes and distinguishing transport from membrane
    tethering.
  hypothesis: Human BLTP1 transfers phospholipids through a conserved bridge, but its substrate preference
    remains unresolved.
- description: Use endogenous human BLTP1 tagging and loss-of-function complementation to link contact-site
    localization and lipid flux to endosomal recycling, without inferring localization from altered compartment
    markers alone.
  hypothesis: A conserved ER-associated bridge supports membrane trafficking through lipid supply and
    contact maintenance.
