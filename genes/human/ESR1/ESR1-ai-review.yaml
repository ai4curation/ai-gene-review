  evidence_type: IDA
  original_reference_id: PMID:12047722
  qualifier: enables
  review:
    summary: ESR1 can activate RNA polymerase II transcription from estrogen-responsive regulatory 
      DNA.
    action: ACCEPT
    reason: Reporter and DNA-binding assays show that ESR1 can bind a classic ERE and activate 
      transcription, which supports the Pol II-specific activator activity even though the native 
      oxytocin promoter probably uses a DNA-independent estrogen response.
