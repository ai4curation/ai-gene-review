      supporting_text: We also demonstrate that ER binds specifically to TFIIB, a key component of 
        the preinitiation complex.
      reference_section_type: ABSTRACT
- term:
    id: GO:0001221
    label: transcription coregulator binding
  evidence_type: IPI
  original_reference_id: PMID:14701856
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6STE5
  review:
    summary: ESR1 binds transcription coregulators such as SWI/SNF-associated factors.
    action: ACCEPT
    reason: Coregulator recruitment is central to ligand-dependent ESR1 transcriptional regulation; 
      this row is more informative than bare protein binding and captures the partner class 
      contacted by the receptor activation functions.
