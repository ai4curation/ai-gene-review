    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:20388878
  qualifier: involved_in
  review:
    summary: ER-alpha represses miR-221/222 transcription through recruitment of nuclear receptor 
      corepressors.
    action: ACCEPT
    reason: 'This is a direct chromatin transcriptional-repression function of ESR1: ERalpha negatively
      controls the miR-221/222 transcription unit by recruiting NCOR/SMRT-family corepressors, so the
      row fits the negative Pol II regulation branch of ESR1 core activity.'
    supported_by:
    - reference_id: PMID:20388878
      supporting_text: ERalpha negatively modulates miR-221 and -222 through the recruitment of 
        transcriptional corepressor partners
      reference_section_type: ABSTRACT
