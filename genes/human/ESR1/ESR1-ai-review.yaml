suggested_questions:
- question: Which membrane-initiated ESR1 signaling branches are carried by endogenous full-length 
    ESR1 versus shorter ESR1 isoforms in human cells?
- question: Which ESR1 physical interactors captured as historical protein-binding IPIs are 
    mechanistic cofactors of the receptor rather than context-specific regulators of receptor 
    stability or localization?
suggested_experiments:
- description: Use isoform-specific rescue of ESR1-null human cells, with endogenous tagging and 
    acute estradiol stimulation, to separate chromatin, cytosolic and plasma-membrane ESR1 pools and
    assign membrane signaling outputs to full-length ESR1 or ER-alpha46/ER-alpha36.
