    - reference_id: file:human/ESR1/ESR1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Ligand binding induces a conformational change allowing subsequent or 
        combinatorial association with multiprotein coactivator complexes through LXXLL motifs of 
        their respective components.
    - reference_id: PMID:14701856
      supporting_text: Transcription factors and nuclear receptors interact with the SWI/SNF complex
        through the BAF60c subunit.
      reference_section_type: TITLE
- term:
