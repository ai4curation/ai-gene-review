    label: TFIIB-class transcription factor binding
  evidence_type: IPI
  original_reference_id: PMID:9841876
  qualifier: enables
  supporting_entities:
  - UniProtKB:P03372
  review:
    summary: Purified ER binds the general transcription factor TFIIB.
    action: KEEP_AS_NON_CORE
    reason: TFIIB binding is a real mechanistic interaction with the preinitiation machinery, but it
      is one subordinate contact within ESR1-dependent RNA polymerase II transcription rather than 
      the receptor core activity itself.
    supported_by:
