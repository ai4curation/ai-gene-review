id: P03372
gene_symbol: ESR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Estrogen receptor alpha is a ligand-regulated nuclear receptor transcription factor. Its
  C-terminal ligand-binding domain binds 17beta-estradiol, its C4 zinc-finger DNA-binding domain recognizes
  estrogen response elements as a homodimer, and ligand-induced receptor conformations recruit coactivator
  or corepressor complexes on chromatin to activate or repress RNA polymerase II transcription. ESR1 also
  participates in non-genomic estrogen signaling from cytoplasmic and membrane-associated pools, but its
  principal molecular role is chromatin-localized estrogen receptor signaling.'
