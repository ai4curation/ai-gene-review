id: Q5T0N1
gene_symbol: CFAP70
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CFAP70 (cilia- and flagella-associated protein 70) is a large tetratricopeptide-repeat protein of motile
  cilia and sperm flagella. It is a structural component of the C2a projection of the axonemal central
  apparatus, where it forms a homodimer and assembles interdependently with CFAP65, MYCBPAP and CCDC108;
  its N-terminal half targets it to the cilium. Loss of CFAP70 collapses the C2a projection, destabilises
  the central pair and alters the ciliary beat, so that ependymal and airway cilia beat abnormally (hydrocephalus
  and sinusitis in knockout mice) and ciliary beat frequency falls. In the testis, CFAP70 is required
  for sperm flagellum biogenesis and normal sperm head shaping: it helps stabilise QRICH2, supports cytoplasmic
  preassembly of the calmodulin- and radial spoke-associated complex, and influences manchette localisation
  of axonemal proteins. Biallelic CFAP70 variants in men cause spermatogenic failure 41, an oligo-astheno-teratozoospermia
  with multiple morphological abnormalities of the sperm flagellum. An early model placing CFAP70 at the
  base of the outer dynein arm has been superseded by localisation to the central apparatus.
