    label: cilium movement
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1923920
  - PANTHER:PTN002349052
  review:
    summary: >-
      CFAP70 is required for normal ciliary and flagellar beating. Knockdown in mouse ependyma lowers
      ciliary beat frequency, Chlamydomonas fap70 mutants swim slowly, and Cfap70 knockout mice show PCD-like
      hydrocephalus and sinusitis with an altered ciliary movement pattern caused by collapse of the C2a
      projection of the central apparatus.
    action: ACCEPT
    reason: >-
      Cilium movement is a core process for CFAP70: as a structural component of the C2a projection of
      the axonemal central apparatus it contributes to the machinery that regulates dynein-driven beating,
      in ependymal, airway and sperm motile cilia (PMID:30158508, PMID:33988244, PMID:42417609). The IBA
      node (PTN002349052) covers the CFAP70 orthologs of ciliated eukaryotes and is consistent with the
      conservation from Chlamydomonas to mouse; there is no evidence of loss in the human lineage.
    supported_by: &id001
    - reference_id: PMID:30158508
      supporting_text: >-
        When CFAP70 was knocked down in cultured mouse ependyma, reductions in cilia beating frequency
        were observed.
    - &id011
      reference_id: PMID:42417609
      supporting_text: >-
        The ciliary incorporation of CCDC108, MYCBPAP, and CFAP70 is essential for one another's stability,
        with the loss of any single component triggering C2a collapse, which destabilizes the central
        pair microtubules, and ultimately alters the ciliary movement pattern.
    - &id006
      reference_id: PMID:42417609
      supporting_text: >-
        all three knockout strains exhibit distinct phenotypes related to primary ciliary dyskinesia (PCD),
        including hydrocephalus and sinusitis.
