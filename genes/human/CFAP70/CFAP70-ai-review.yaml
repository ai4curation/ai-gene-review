- term:
    id: GO:0070062
    label: extracellular exosome
  evidence_type: HDA
  original_reference_id: PMID:19056867
  qualifier: located_in
  review:
    summary: >-
      CFAP70 peptides were among 1,132 proteins identified in a large-scale LC-MS/MS proteome of human
      urinary exosomes.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      A single high-throughput detection in urinary exosomes does not show that CFAP70 is packaged into
      or acts in exosomes. CFAP70 is a tightly bound axonemal central-apparatus protein of motile cilia
      and sperm flagella, and its presence in urine is better explained by shed ciliary or sperm material.
      The claim exceeds the evidence and is not part of CFAP70 biology.
    supported_by:
    - reference_id: PMID:19056867
      supporting_text: Here, we used LC-MS/MS to profile the proteome of human urinary exosomes.
