core_functions:
- description: >-
    Structural component of the C2a projection of the axonemal central apparatus in motile cilia and sperm
    flagella; forms a homodimer at the C2a base and is required, together with CFAP65, MYCBPAP and CCDC108,
    for C2a integrity and central-pair stability, and hence for the normal ciliary beat pattern. No molecular
    function term is asserted: unlike CFAP47 and CFAP43, CFAP70 has no resolved contact map (the mouse
    model is an AlphaFold-assisted dimer fitted into C2a density, and its C-terminus has not been placed),
    so GO:0005200 structural constituent of cytoskeleton is plausible but not yet distinguishable from
    an assembly-factor role on the available data.
  directly_involved_in:
  - id: GO:0003341
    label: cilium movement
  locations:
  - id: GO:1990718
    label: axonemal central pair projection
  - id: GO:0031514
    label: motile cilium
  - id: GO:0036126
    label: sperm flagellum
  supported_by:
  - *id002
  - *id010
  - *id011
- description: >-
