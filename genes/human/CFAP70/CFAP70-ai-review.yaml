- term:
    id: GO:0036157
    label: outer dynein arm
  evidence_type: IDA
  original_reference_id: PMID:31621862
  qualifier: part_of
  review:
    summary: >-
      The annotation places CFAP70 in the outer dynein arm, following the 2018 model in which the FAP70
      N-terminus was mapped to the base of the outer dynein arm. In the human study CFAP70 loss was associated
      with absence of ODA and central-pair markers in sperm.
    action: MODIFY
    reason: >-
      The location claim has been revised by later structural work. Using the same tagged Chlamydomonas
      strain, Fu et al. showed that FAP70 is located exclusively in the central apparatus, at the base
      of the C2a projection, and not on the doublet microtubules that carry the outer dynein arms (PMID:33988244);
      in situ cryo-ET of mouse sperm assigns CFAP70 as a major C2a component (PMID:40473901), and mouse
      knockouts collapse C2a (PMID:42417609). The earlier cryo-ET signal was also seen at the nexin-dynein
      regulatory complex, which is consistent with an indirect label rather than an ODA subunit. The loss
      of ODA markers in patient sperm (PMID:31621862, abstract only) is a secondary consequence of axonemal
      disorganisation. The essence (CFAP70 is an integral axonemal substructure component that influences
      dynein-driven motility) is sound, so this is a lateral MODIFY to axonemal central pair projection
      (GO:1990718). Comparator check (QuickGO annotation search, exact term, run 2026-10-16): the C2a
      partners CFAP65 and MYCBPAP carry GO:1990716 axonemal central apparatus in human GOA (ISS, plus
      IEA for CFAP65), and HYDIN carries GO:1990718 (IEA only, Ensembl) as well as GO:1990716.
    proposed_replacement_terms:
    - id: GO:1990718
      label: axonemal central pair projection
    supported_by:
    - reference_id: PMID:31621862
      supporting_text: >-
        The CFAP70 gene encodes a regulator protein of the outer dynein arms (ODA) strongly expressed
        in the human testis.
    - reference_id: PMID:30158508
      supporting_text: >-
        Cryo-electron tomography revealed that the N-terminus of FAP70 resided stably at the base of the
        ODA.
    - reference_id: PMID:33988244
      supporting_text: >-
        streptavidin signal was present at the base of the outer dynein arm, as well as associated with
        the nexin-dynein regulatory complex
    - reference_id: PMID:33988244
      supporting_text: revealed that FAP70 is located exclusively in the CA, and not on the DMTs.
    - *id010
