  review:
    summary: >-
      Loss of CFAP70 prevents normal assembly of the sperm flagellum (MMAF in men and mice), and CFAP70
      assists cytoplasmic preassembly of the CSC and the manchette localization of axonemal proteins in
      spermatids.
    action: MODIFY
    reason: >-
      Cilium assembly is broader than the evidence. In the mouse knockout, motile cilia of brain ependyma
      and airway still form and the defect is in central-apparatus stability and beating pattern (PMID:42417609),
