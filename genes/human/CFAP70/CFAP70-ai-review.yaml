      of the work of sperm flagellum assembly, both as a C2a structural component and by assisting preassembly
      of the CSC, so the specific descendant sperm flagellum assembly (GO:0120316) is supported. The IBA
      node is not contradicted in principle (the protein is part of the motile axoneme in all ciliated
      lineages), but the assembly role has only been demonstrated in the sperm flagellum.
