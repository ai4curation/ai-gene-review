- term:
    id: GO:0034736
    label: cholesterol O-acyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:32944968
  qualifier: enables
  review:
    summary: >-
      PMID:32944968 presents a cholesterol-esterification mechanism, but its reported ACAT1 hairpin identifies
      the mitochondrial thiolase, creating an unresolved source conflict for cholesterol O-acyltransferase
      activity.
    action: UNDECIDED
    reason: >-
      The paper studies human Calu-3 cells and gives ACAT1-shRNA sequence GCCACTAAGCTTGGTTCCATT. Broad
      GPP maps that exact target to TRCN0000035583 and human ACAT1 transcript NM_000019.4 (gene 38), so
      the prior assertion that the experiment necessarily targeted SOAT1 is unsupported. GO:0034736 requires
      direct catalysis of acyl-CoA plus cholesterol to cholesteryl ester plus CoA. Viral-entry rescue
      and lipid-droplet phenotypes after knockdown do not by themselves establish that purified mitochondrial
      ACAT1 catalyzes this chemistry. Resolve reagent identity and the gene-specific assay interpretation
      before accepting or removing this experimental assertion. The same evidence is modeled in cached
      GO-CAM 6796b94c00004996; that is shared provenance, not independent confirmation.
    supported_by:
    - reference_id: PMID:32944968
      supporting_text: 'ACAT1‐shRNA: GCCACTAAGCTTGGTTCCATT'
