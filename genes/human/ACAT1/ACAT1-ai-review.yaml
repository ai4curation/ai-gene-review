- term:
    id: GO:0015936
    label: coenzyme A metabolic process
  evidence_type: IDA
  original_reference_id: PMID:17371050
  qualifier: involved_in
  review:
    summary: >-
      The thiolase reaction directly interconverts CoA and acyl-CoA species.
    action: ACCEPT
    reason: >-
      CoA is consumed during thiolytic cleavage and released during acetyl-CoA condensation. Human biochemical
      evidence in PMID:17371050 supports this broad core metabolic process. It does not establish an independent
      pathway for constructing the CoA cofactor.
- term:
    id: GO:0015937
    label: coenzyme A biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:17371050
  qualifier: involved_in
  review:
    summary: >-
      The condensation reaction releases CoA, but the intended scope of the CoA biosynthetic-process assertion
      remains uncertain.
    action: UNDECIDED
    reason: >-
      The previous rationale reversed the reaction direction: condensation releases CoA, whereas thiolysis
      consumes it. The live GO:0015937 definition describes formation of CoA and does not explicitly restrict
      the term to de novo biosynthesis. PMID:17371050 establishes reversible thiolase chemistry, but the
      complete original paper and the curator interpretation of cofactor regeneration versus biosynthesis
      were not recovered. Do not reject this experimental annotation using an assumed narrower definition;
      retain uncertainty pending clarification.
- term:
    id: GO:1902860
    label: propionyl-CoA biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:17371050
  qualifier: involved_in
  review:
    summary: >-
      Cleavage of 2-methylacetoacetyl-CoA directly forms propionyl-CoA and acetyl-CoA.
    action: ACCEPT
    reason: >-
      ACAT1 catalyzes the product-forming step of isoleucine catabolism, as supported by PMID:17371050
      and the explicit Reactome reaction. The existing propionyl-CoA biosynthetic-process assertion therefore
      describes core chemistry rather than an indirect phenotype.
