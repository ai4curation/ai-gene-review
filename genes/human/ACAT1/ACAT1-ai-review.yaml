- term:
    id: GO:0015936
    label: coenzyme A metabolic process
  evidence_type: IDA
  original_reference_id: PMID:17371050
  qualifier: involved_in
  review:
    summary: >-
      The thiolase reaction directly interconverts CoA and acyl-CoA species.
    action: ACCEPT
    reason: >-
      CoA is consumed during thiolytic cleavage and released during acetyl-CoA condensation. Human biochemical
      evidence in PMID:17371050 supports this broad core metabolic process. It does not establish an independent
      pathway for constructing the CoA cofactor.
- term:
    id: GO:0015937
    label: coenzyme A biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:17371050
  qualifier: involved_in
  review:
    summary: >-
      Release of free CoA during thiolase condensation supports CoA metabolism but overextends the evidence
      to cofactor biosynthesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Condensation of two acetyl-CoA molecules releases free CoA; thiolysis consumes it. The structural/kinetic
      source and its author-thesis account establish this interconversion, not construction of the CoA
      cofactor. The live GO:0015937 definition does not explicitly say de novo, so the judgment rests
      on reaction context and curation practice rather than an invented definition. As a comparator, MGI
      experimental annotation snapshots generated 2023-03-10 place the CoA-releasing enzymes human ACOT1,
      ACOT2 and ACOT8 in acyl-CoA metabolic processes, without this biosynthetic term. These are historical,
      incomplete comparators rather than a claim of universal current absence. Together with the measured
      thiolase chemistry, they support treating free-cofactor regeneration here as metabolism, already
      represented by GO:0015936, rather than an independent CoA biosynthetic role. The original article
      is abstract-only locally; the author thesis was read separately, not claimed as full original-paper
      access.
