- id: PMID:17371050
  title: 'Crystallographic and kinetic studies of human mitochondrial acetoacetyl-CoA thiolase: the importance
    of potassium and chloride ions for its structure and function.'
  findings:
  - statement: >-
      High-resolution crystal structures of human T2 (apo and CoA complex, with/without K+). Defines the
      homotetramer, the CoA- and K+-binding sites near the catalytic site, and K+ activation.
    reference_section_type: ABSTRACT
  - statement: >-
      T2 is important for synthesis and degradation of ketone bodies and for degradation of
      2-methylacetoacetyl-CoA; it uniquely accepts 2-methyl-branched acetoacetyl-CoA and degrades
      acetoacetyl-CoA and 2-methylacetoacetyl-CoA with similar catalytic efficiencies.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary PubMed record and cached abstract verify the human structural/kinetic study. Original article
      full text was not recovered; an author thesis reporting its methods/results was read separately
      and is linked in notes. Do not infer de novo CoA synthesis or stereospecificity beyond the measured
      substrates.
