- id: PMID:32944968
  title: Cholesterol 25-Hydroxylase inhibits SARS-CoV-2 and other coronaviruses by depleting
    membrane cholesterol.
  findings:
  - statement: >-
      The full paper infers cholesterol esterification from lipid-droplet and cholesterol-accessibility
      readouts and reports viral-entry effects of knockdown. Its stated ACAT1 hairpin matches mitochondrial
      ACAT1. These findings leave a reagent/mechanism conflict but do not establish cholesterol O-acyltransferase
      activity or ER activity of P24752.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: 'The intended paper, human Calu-3 experiments and reported hairpin were verified in
      full cached text. The paper is miscited for cholesterol O-acyltransferase activity and ER activity
      of P24752: its cellular assays do not establish either gene-specific assignment. Broad GPP maps
      the stated hairpin to ACAT1 NM_000019.4/gene 38; this genuine reagent conflict is retained, so the
      assessment does not assert a proven SOAT1-only perturbation or deny an ACAT1-dependent phenotype.
      The mapping, inhibitor chemistry and assay scope are distinguished in the notes.'
  full_text_unavailable: false
