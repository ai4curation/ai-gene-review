id: P24752
gene_symbol: ACAT1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACAT1 encodes mitochondrial acetoacetyl-CoA thiolase (T2; EC 2.3.1.9), a potassium-activated homotetramer
  acting in the mitochondrial matrix. It catalyzes reversible interconversion of two acetyl-CoA molecules
  and acetoacetyl-CoA plus CoA, contributing to ketone body synthesis and utilization. It also cleaves
  the isoleucine-catabolic intermediate 2-methylacetoacetyl-CoA into acetyl-CoA and propionyl-CoA. Biallelic
  loss of function causes beta-ketothiolase deficiency, with episodic ketoacidosis and accumulation of
  isoleucine-derived organic acids. This mitochondrial thiolase is distinct from SOAT1, the sterol O-acyltransferase
  historically also called ACAT1.
alternative_products:
- name: '1'
  id: P24752-1
- name: '2'
  id: P24752-2
  sequence_note: VSP_056844, VSP_056845
