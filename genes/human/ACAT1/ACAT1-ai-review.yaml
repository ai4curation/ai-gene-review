core_functions:
- description: >-
    Potassium-activated mitochondrial-matrix thiolase acting as a homotetramer. Reversible acetoacetyl-CoA/acetyl-CoA
    chemistry serves ketone body synthesis and utilization. The same enzyme also cleaves the branched
    isoleucine intermediate 2-methylacetoacetyl-CoA into acetyl-CoA and propionyl-CoA; this additional
    substrate specificity is described in the evidence and is not encoded by the literal two-acetyl-CoA
    reaction of GO:0003985.
  supported_by:
  - reference_id: PMID:17371050
    supporting_text: >-
      important in the pathways for the synthesis and degradation of ketone bodies
    full_text_unavailable: true
  - reference_id: PMID:9744475
    supporting_text: >-
      Mitochondrial acetoacetyl-CoA thiolase (T2) deficiency is an inborn error of ketone body and
      isoleucine catabolisms.
    full_text_unavailable: true
  - reference_id: Reactome:R-HSA-70844
    supporting_text: alpha-methylacetoacetyl-CoA + CoA => propionyl-CoA + acetyl-CoA
  molecular_function:
    id: GO:0003985
    label: acetyl-CoA C-acetyltransferase activity
  directly_involved_in:
  - id: GO:0046952
    label: ketone body catabolic process
  - id: GO:0006550
    label: L-isoleucine catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
proposed_new_terms: []
suggested_questions:
- question: Can the reported ACAT1 shRNA, measured knockdown specificity and enzyme identity in
    PMID:32944968 be reconciled with the cholesterol-esterification mechanism before resolving the
    two GO assertions and their GO-CAM propagation?
- question: Does the direct biochemical evidence underlying the earlier PDHA1/PDP1 work and the 2021
    IDH2 study justify GO:0061733 protein-lysine-acetyltransferase activity for ACAT1, with controls
    separating enzymatic lysine acetylation from thiolase chemistry and nonenzymatic acetylation?
- question: Does GO:0015937 intend to include release of CoA during thiolase condensation, or should
    this existing experimental annotation be confined to the broader CoA metabolic process?
- question: After recovering the rat source papers, which expression-based developmental or
    hormone/starvation annotations establish a transferable process role for human ACAT1?
suggested_experiments:
- description: Compare sequence-verified ACAT1 and SOAT1 perturbations, rescued with resistant
    cognate constructs, while measuring cholesterol esterification, accessible membrane cholesterol
    and subcellular protein localization.
  hypothesis: Separate perturbations will distinguish indirect effects of mitochondrial thiolase
    loss from sterol O-acyltransferase catalysis and identify which mechanism explains the reported
    viral-entry phenotype.
- description: Use purified ACAT1 and defined protein substrates to quantify site-specific lysine
    acetylation with isotope-labeled acetyl-CoA, catalytic variants and matched nonenzymatic
    controls, alongside an independent thiolase assay.
  hypothesis: A separable protein-lysine transfer activity would generate an ACAT1-dependent
    acetylated protein product beyond the rate of spontaneous acetylation.
