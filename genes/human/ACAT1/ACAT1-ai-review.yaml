- term:
    id: GO:0120225
    label: coenzyme A binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: >-
      ACAT1 binds the CoA cosubstrate as part of its catalytic mechanism.
    action: ACCEPT
    reason: >-
      The rat donor chain concerns CoA modification of mitochondrial thiolase; that mechanism is distinct
      from ordinary reversible ligand binding. Independent human CoA-complex structures in PMID:17371050
      and the cached UniProt binding features directly support CoA binding by human ACAT1. This substrate
      interaction belongs to the core catalytic mechanism.
    additional_reference_ids:
    - PMID:17371050
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:P17764
        source_status: UNRESOLVED
        comment: >-
          Rat CoA-binding IPI traces to PMID:1672610. Its abstract reports acid-stable, thiol-labile
          CoA modification confined to partially active A1/A2 forms, not the unmodified fully active
          enzyme. Human reversible cosubstrate binding is independently established by PMID:17371050;
          conservation of the specific rat modification mechanism remains unresolved.
        source_label: Acat1 (Rattus norvegicus)
      - source_id: ensembl:ENSRNOP00000010573
        source_status: UNRESOLVED
        comment: >-
          Rat CoA-binding IPI traces to PMID:1672610. Its abstract reports acid-stable, thiol-labile
          CoA modification confined to partially active A1/A2 forms, not the unmodified fully active
          enzyme. Human reversible cosubstrate binding is independently established by PMID:17371050;
          conservation of the specific rat modification mechanism remains unresolved.
        source_label: Acat1 (Rattus norvegicus)
    supported_by:
    - reference_id: PMID:1672610
      supporting_text: coenzyme A was found exclusively, e.g., in the modified, partially-active forms
        A1 und A2 of acetyl-CoA acetyltransferase and not in the unmodified fully-active enzyme. Thus it
