    action: UNDECIDED
    reason: >-
      The rat P17764/ENSRNOP00000010573 donor chain traces through NCBI Gene 25014/RGD to IEP evidence
      in PMID:5166591. The recovered abstract reports mitochondrial and cytoplasmic aceto-acetyl-CoA
      thiolase activities across postnatal rat development, with higher mitochondrial activity at all
      stages. This establishes a developmental enzyme-activity profile, rather than merely an unknown
      assay, but does not by itself resolve participation in liver development or conservation of that
      process role in human ACAT1. The full experimental basis of the donor interpretation remains
      unavailable. Retain UNDECIDED without treating IEP as intrinsically invalid or the abstract's
      limited scope as evidence against a developmental role.
