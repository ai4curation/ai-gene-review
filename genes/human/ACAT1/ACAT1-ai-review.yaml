      Phylogenetic (IBA) assignment of the acetyl-CoA C-acetyltransferase (acetoacetyl-CoA
      thiolase, EC 2.3.1.9) activity. This is the well-established core catalytic function of
      ACAT1/T2 and is concordant with direct biochemical and structural evidence.
    action: ACCEPT
