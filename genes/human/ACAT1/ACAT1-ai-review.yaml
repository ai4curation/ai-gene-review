- term:
    id: GO:0046952
    label: ketone body catabolic process
  evidence_type: IMP
  original_reference_id: PMID:1979337
  qualifier: involved_in
  review:
    summary: >-
      IMP annotation linking ACAT1 to ketone body catabolism (ketolysis), via patient fibroblast
      analysis in 3-ketothiolase deficiency. T2 catalyzes acetoacetyl-CoA + CoA <=> 2 acetyl-CoA, the
      key ketolytic thiolase step.
    action: ACCEPT
    reason: >-
      Core biological process; ketone body metabolism is a principal physiological role of T2.
    supported_by:
    - reference_id: PMID:17371050
      supporting_text: >-
        important in the pathways for the synthesis and degradation of ketone bodies
      full_text_unavailable: true
- term:
    id: GO:0006085
    label: acetyl-CoA biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:17371050
  qualifier: involved_in
  review:
    summary: >-
      Thiolytic cleavage directly produces acetyl-CoA.
    action: ACCEPT
    reason: >-
      Human T2 catalyzes acetyl-CoA production from acetoacetyl-CoA and from the isoleucine-derived branched
      substrate in PMID:17371050. ACAT1 performs the chemical step itself, so this product-level process
      is a valid description of core catalysis, even though ketone-body and isoleucine pathways provide
      more physiological context.
- term:
    id: GO:0046356
    label: acetyl-CoA catabolic process
  evidence_type: IDA
  original_reference_id: PMID:17371050
  qualifier: involved_in
  review:
    summary: >-
      The condensation direction of T2 consumes two acetyl-CoA molecules to form acetoacetyl-CoA.
    action: ACCEPT
    reason: >-
      This directly assayed reaction is part of the established reversible chemistry in PMID:17371050
      and the curated ketogenesis reaction. It supports the existing acetyl-CoA catabolic-process assertion
      without implying all acetyl-CoA-consuming pathways.
