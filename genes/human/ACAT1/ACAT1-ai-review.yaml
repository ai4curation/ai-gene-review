- id: PMID:27867011
  title: Tetrameric Acetyl-CoA Acetyltransferase 1 Is Important for Tumor Growth.
  findings:
  - statement: >-
      The study links ACAT1 Y407 phosphorylation/tetramerization to tumor phenotypes and cellular PDHA1/PDP1
      acetylation. Its stated purified ACAT1 activity assay measures acetoacetyl-CoA thiolysis at 303
      nm; the direct upstream protein-acetyltransferase assignment is attributed to earlier work. It does
      not establish IDH2 K413 acetylation.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full cached methods/results and figure descriptions were inspected, with independent annotation-reviewer
      consultation. Thiolase kinetics and cellular acetylation/epistasis must not be conflated with a
      purified protein-lysine transfer assay. The IDH2 event cites a different 2021 study. A gene-specific
      proposed GO term is unnecessary, and no new molecular-function assertion is made from the limited
      direct-catalysis assessment.
