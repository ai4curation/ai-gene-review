          recovered abstract measures mitochondrial and cytoplasmic thiolase activities across postnatal
          development, with higher mitochondrial activity throughout. Full-source developmental-process
          interpretation and transfer to human ACAT1 remain unresolved.
        source_label: Acat1 (Rattus norvegicus)
      - source_id: ensembl:ENSRNOP00000010573
        source_status: UNRESOLVED
        comment: >-
