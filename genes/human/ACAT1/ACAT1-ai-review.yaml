- term:
    id: GO:0034736
    label: cholesterol O-acyltransferase activity
  evidence_type: IDA
  original_reference_id: PMID:32944968
  qualifier: enables
  review:
    summary: >-
      The cholesterol paper does not establish cholesterol O-acyltransferase activity for mitochondrial
      ACAT1.
    action: REMOVE
    reason: >-
      Full-text methods and Figure 4 assess lipid droplets, surface-accessible cholesterol, inhibitor
      responses and viral entry after knockdown. The ER acyl-CoA/cholesterol esterification mechanism
      is a SOAT-type reaction, distinct from ACAT1 thiolase chemistry; these cellular readouts do not
      attribute that catalytic activity to P24752. The reported hairpin GCCACTAAGCTTGGTTCCATT does match
      human ACAT1 NM_000019.4 in Broad GPP, so an ACAT1-dependent phenotype cannot be dismissed as a proven
      SOAT1-only perturbation. That reagent conflict does not support an enables assertion for cholesterol
      esterification. Remove the unsupported catalytic assignment without denying a cellular ACAT1 effect
      or claiming that the actual reagent specificity was independently tested. GO-CAM 6796b94c00004996
      repeats the same source interpretation and supplies no independent assay.
    supported_by:
    - reference_id: PMID:32944968
      supporting_text: 'ACAT1‐shRNA: GCCACTAAGCTTGGTTCCATT'
    - reference_id: PMID:32944968
      supporting_text: we used a lipid droplet stain to monitor ACAT activity
- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IDA
  original_reference_id: PMID:32944968
  qualifier: is_active_in
  review:
    summary: >-
      The reported experiments do not establish ER activity or localization of the mitochondrial ACAT1
      gene product.
    action: REMOVE
    reason: >-
      The full paper states ER localization as part of its cholesterol-acyltransferase model. Figure 4
      and the methods measure lipid-droplet staining, surface cholesterol and viral-entry responses; they
      do not localize the reported ACAT1 knockdown target to the ER or demonstrate its activity there.
      The exact hairpin matches mitochondrial ACAT1, but an effect of that perturbation on cholesterol
      handling cannot identify the compartment where the protein acts. Remove this unsupported is_active_in
      assignment on the basis of the actual assay scope, not because mitochondrial localization excludes
      all additional pools or because the reagent was proven to target SOAT1. The corresponding GO-CAM
      uses the same evidence and does not resolve the localization gap.
    supported_by:
    - reference_id: PMID:32944968
      supporting_text: 'ACAT1‐shRNA: GCCACTAAGCTTGGTTCCATT'
    - reference_id: PMID:32944968
      supporting_text: The ER‐localized enzyme ACAT uses fatty acyl‐CoA and cholesterol as
        substrates to produce cholesteryl esters
