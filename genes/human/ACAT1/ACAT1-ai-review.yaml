- id: PMID:1715688
  title: Evidence for a structural mutation (347Ala to Thr) in a German family with 3-ketothiolase
    deficiency.
  findings:
  - statement: >-
      Characterized a 3KTD missense allele (A380T / "347Ala to Thr" in the mature subunit) shown by
      expression analysis to destabilize the T2 protein, linking EC 2.3.1.9 thiolase activity to ACAT1.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified disease-variant study of mitochondrial acetoacetyl-CoA thiolase (T2). Abstract-only
      in cache; supports the thiolase MF and disease association.
- id: PMID:17371050
  title: 'Crystallographic and kinetic studies of human mitochondrial acetoacetyl-CoA thiolase: the importance
    of potassium and chloride ions for its structure and function.'
  findings:
  - statement: >-
      High-resolution crystal structures of human T2 (apo and CoA complex, with/without K+). Defines the
      homotetramer, the CoA- and K+-binding sites near the catalytic site, and K+ activation.
    reference_section_type: ABSTRACT
  - statement: >-
      T2 is important for synthesis and degradation of ketone bodies and for degradation of
      2-methylacetoacetyl-CoA; it uniquely accepts 2-methyl-branched acetoacetyl-CoA and degrades
      acetoacetyl-CoA and 2-methylacetoacetyl-CoA with similar catalytic efficiencies.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary PubMed record and cached abstract verify the human structural/kinetic study. Original article
      full text was not recovered; an author thesis reporting its methods/results was read separately
      and is linked in notes. Do not infer de novo CoA synthesis or stereospecificity beyond the measured
      substrates.
- id: PMID:19056867
  title: Large-scale proteomics and phosphoproteomics of urinary exosomes.
  findings:
  - statement: >-
      Human urinary-exosome proteomics is the source of the curated extracellular-exosome annotation.
      The individual ACAT1 supplementary entry was not re-extracted; detection alone does not establish
      extracellular catalytic function or contamination.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Identifier/title and proteomics study scope match the cached record and GOA evidence. The accessible
      text supports the experimental context, not an independently rechecked ACAT1-specific peptide entry.
      Retain curator-supported detection without calling it incidental contamination.
- id: PMID:1979337
  title: Molecular cloning and sequence of the complementary DNA encoding human mitochondrial
    acetoacetyl-coenzyme A thiolase and study of the variant enzymes in cultured fibroblasts from
    patients with 3-ketothiolase deficiency.
  findings:
  - statement: >-
      Cloned/sequenced the 427-aa human T2 precursor (33-residue leader + mature subunit) and showed by
      subcellular fractionation that T2 protein localizes to mitochondria in patient fibroblasts.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Identifier, title and human study scope verified against the JCI primary PDF. Methods and results
      support import/fractionation at mitochondrial resolution; they do not independently resolve the
      matrix. The local cache remains abstract-only.
- id: PMID:23533145
  title: In-depth proteomic analyses of exosomes isolated from expressed prostatic secretions in
    urine.
  findings:
  - statement: >-
