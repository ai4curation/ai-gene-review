description: ANKRD36B (ankyrin repeat domain-containing 36B) is an uncharacterized 1353-residue protein
  of the ANKRD36 family, with N-terminal ankyrin repeats and long coiled-coil regions. It is expressed
  with low tissue specificity. No molecular activity, location or biological role has been established;
  it appears in the literature only in expression and sequencing association studies.
