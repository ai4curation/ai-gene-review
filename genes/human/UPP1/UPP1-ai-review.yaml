  review:
    summary: Thymidine phosphorylase activity transferred by Ensembl Compara from mouse Upp1, whose positive
      IMP row (PMID:12077348) coexists with a NOT row (PMID:15772079).
    action: REMOVE
    reason: The donor paper itself states that the mouse enzyme, unlike human UP, cleaves thymidine; thymidine
      phosphorolysis in human is carried out by TYMP (and to some extent UPP2), not UPP1. Human UPP1 acts
      on ribosides and 2'-deoxyribosides of uracil (RHEA:24388, RHEA:22824); UniProt lists no thymidine
      reaction. This is a species-specific substrate difference that Compara transfer cannot see, so the
      IEA is a demonstrably wrong propagation. The mouse GOA row is additionally contested by a NOT annotation
      from the knockout study.
    supported_by:
    - reference_id: PMID:12077348
      supporting_text: Murine uridine phosphorylase (UP), unlike human UP, cleaves thymidine, as well
        as uridine.
    - reference_id: PMID:7744869
      supporting_text: substrate specificity studies with recombinant protein expressed in COS-7 cells
        that demonstrated relatively high enzyme activity with uridine as substrate compared low levels
        when thymidine was used
    propagation_review:
      root_cause: PROPAGATION_BAD
