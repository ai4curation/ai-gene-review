id: O00244
gene_symbol: ATOX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATOX1 encodes a small cytosolic HMA-domain Cu(I) metallochaperone whose CXXC motif
  binds cuprous copper and hands it to the metal-binding domains of the P1B-type copper ATPases
  ATP7A and ATP7B. This cytosolic Cu(I) transfer supports copper movement into the secretory
  pathway, copper export, maturation of secretory cuproenzymes such as SOD3 and lysyl oxidase, and
  intracellular copper homeostasis. ATOX1 also has a secondary copper-responsive nuclear role in
  SOD3 transcription that links copper handling to extracellular antioxidant defense.
