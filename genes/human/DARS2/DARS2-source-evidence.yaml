    not transfer partner activity to DARS2. Rows 12 and 28 retain source-specific proximity associations
    as non-core; independent AP-MS/crosslink and MaMTH rows retain the chaperone/transporter refinements.
    Row 19 retains collagen binding for the exact unreviewed 427-residue Q4VAQ0 construct: its three recorded
    methods are pooling, validated and array two-hybrid, not three pooling records. No mature collagen
    assembly, native mitochondrial/extracellular colocalization or physiological matrix function is established.
    Q8WW34-2 remains the reconstructed 152-residue alternate product; its raw 2–152 binding-sufficiency
    feature is separate.'
