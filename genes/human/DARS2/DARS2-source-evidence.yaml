    guessed complex GO ID.
chemistry:
  reaction: tRNA(Asp) + L-aspartate + ATP = L-aspartyl-tRNA(Asp) + AMP + diphosphate
  mapping: EC:6.1.1.12 / RHEA:19649 / GO:0004815
  substrate_boundary: The 2007 original uses E. coli tRNA(Asp); the 2013 paper tests mitochondrial and
    E. coli tRNA(Asp). Non-cognate is cross-species Asp recognition, not tRNA(Asn). The inaccessible 2005
    specific Asn experiment and YARS2 pair remain undecided. The protected UniProt catalytic-activity
    block explicitly assigns the tRNA(Asp) reaction and EC:6.1.1.12 with ECO:0000269|PubMed:15779907.
    This curated support is distinct from the GO:0050560 tRNA(Asx)/EC:6.1.1.23 definition; it does not
    disclose the uninspected 2005 substrate panel or settle the two remaining source-specific Asn assertions.
