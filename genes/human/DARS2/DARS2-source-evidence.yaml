  process: GO:0070127 tRNA aminoacylation for mitochondrial protein translation
  location: GO:0005759 mitochondrial matrix is the established biological translation context; soluble
    fractionation alone does not resolve matrix from intermembrane space. No membrane-localized charging
    flux is inferred.
