independent_consultation: ROOT reviewed the four substrate assertions; Bloc independently reviewed all
  11 HuRI assertions and separately challenged the substrate consultation. Their recovery/read scope is
  attributed, not counted as an owner full-paper read.
preservation: Original 54 source dictionaries, 54 GOA keys, UniProt, provider report and old notes prefix
  remain exact. Four missing publication caches were genuinely fetched. The generated PMID24275569 cache
  exactly matches the pending shared variant; absent-main pending family caches were not prefilled or
  adopted.
followup_dispositions:
  feedback: 'PR #5060, formal review 5548570487 and detail 6216629668 on head 5e9c66daa689439c69dd56932dadbc4280b5d99f.'
  collagen: Retain MODIFY at row 19. The review summarized only the first method; the three literal records
    and exact partner sequence support the narrower class. A pair-specific non-Y2H orthogonal retest and
    a physiological extracellular encounter are not established.
  proximity: Rows 12 and 28 change from MODIFY to KEEP_AS_NON_CORE. This preserves positive contextual
    associations without borrowing stronger assay specificity from separate sources or CFTR variants.
  enzyme_classes: Retain all six enzyme-binding refinements. Actual enzyme identities support the partner
    class; assay-specific compartment, construct and endogenous-function limits are explicit. The term
    does not imply catalytic regulation or require active-site contact.
  Asn: Keep rows 50 and 52 UNDECIDED, add the actual UniProt experimental EC/tRNA(Asp) attribution, and
    distinguish obsolete-term status from the unresolved substrate premise. No assertion about human GatCAB
    absence is adopted.
  navigation: This guide remains a reference and locator, but is removed from supported_by throughout
    the review. Every primary association and all inherited quote occurrences remain exact.
