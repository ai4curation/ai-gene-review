core_functions:
- description: Catalyzes ATP-dependent attachment of L-aspartate to mitochondrial tRNA(Asp), supplying
    charged tRNA for mitochondrial protein synthesis. The active enzyme is homodimeric; its matrix placement
    reflects the established mitochondrial translation context rather than a compartment-resolved measurement
    of charging flux.
