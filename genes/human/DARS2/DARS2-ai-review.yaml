  review:
    summary: BioPlex AP-MS co-purification with testis-specific cytosolic GAPDHS; generic binding is 
      uninformative.
    action: REMOVE
    reason: Bare protein binding is uninformative about DARS2 function and is removed under the 
      repository protein-binding policy; removal does not assert that the reported interaction is false. 
      GAPDHS is a sperm-specific cytosolic glycolytic enzyme and DARS2 is a mitochondrial matrix enzyme, 
      so the HEK293T/HCT116 co-purification does not point to a physiological complex. Recasting the row 
      as enzyme binding would describe the partner, not a DARS2 activity. This supersedes the earlier 
      MODIFY to GO:0019899.
