id: Q6PI48
gene_symbol: DARS2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DARS2 encodes the nuclear-encoded mitochondrial aspartate-tRNA ligase (mt-AspRS), a 
  homodimeric bacterial-type class II aminoacyl-tRNA synthetase. Imported into mitochondria via an 
  N-terminal targeting sequence, it activates L-aspartate with ATP and esterifies it to mitochondrial 
  tRNA(Asp), supplying Asp-tRNA(Asp) for synthesis of the 13 mitochondrially encoded respiratory-chain 
  proteins. Its structure closely resembles E. coli AspRS but has an enlarged catalytic groove and 
  adaptations to the structurally degenerate mitochondrial tRNA. The enzyme is soluble in the matrix, 
  with an additional pool peripherally associated with mitochondrial membranes. DARS2 protein levels are 
  regulated by acetylation and SCF-FBXO24-mediated ubiquitination, and release of DARS2 from stimulated 
  cells with effects on macrophage cytokine production has been reported. Biallelic variants that reduce 
  aminoacylation cause leukoencephalopathy with brainstem and spinal cord involvement and lactate 
  elevation (LBSL) and axonal Charcot-Marie-Tooth disease.
