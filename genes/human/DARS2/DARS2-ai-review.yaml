id: Q6PI48
gene_symbol: DARS2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DARS2 encodes the mitochondrial aspartate-tRNA ligase, a class II homodimeric enzyme that
  activates L-aspartate with ATP and transfers it to mitochondrial tRNA(Asp). This charging reaction supplies
  the translation machinery for mitochondrially encoded proteins. The human precursor contains an N-terminal
  mitochondrial targeting sequence. Endogenous DARS2 occupies soluble mitochondrial and peripherally membrane-associated
  pools; the precise distribution of charging activity between those pools is unresolved. Pathogenic variants
  can impair aminoacylation and cause neurological disease.
