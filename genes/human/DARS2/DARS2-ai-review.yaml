    label: tRNA binding
  evidence_type: TAS
  original_reference_id: PMID:15779907
  qualifier: enables
  review:
    summary: 'tRNA binding: Human DARS2 is a dimeric mitochondrial aspartate-tRNA synthetase, with direct
      aminoacylation and structural evidence. Binding ATP and tRNA and producing charged mitochondrial
      tRNA(Asp) are parts of this core reaction; mitochondrial localization is independently supported.'
    action: ACCEPT
    reason: Human DARS2 is a dimeric mitochondrial aspartate-tRNA synthetase, with direct aminoacylation
      and structural evidence. Binding ATP and tRNA and producing charged mitochondrial tRNA(Asp) are
      parts of this core reaction; mitochondrial localization is independently supported.
    supported_by:
    - &id001
      reference_id: PMID:15779907
      supporting_text: 'Both belong to the

        expected class of synthetases, have a dimeric organization, and aminoacylate

        Escherichia coli tRNAs as well as in vitro transcribed human mitochondrial

        tRNAs.'
