    id: GO:0004815
    label: aspartate-tRNA ligase activity
  evidence_type: IDA
  original_reference_id: PMID:40814755
  qualifier: enables
  review:
    summary: Wild-type human DARS2 is an active positive control in the 2025 aminoacylation experiment.
    action: ACCEPT
    reason: The study transfects HEK293 cells with wild-type pCMV6-DARS2 or p.Pro503Leu, with mock and 
      untransfected controls. Lysates are incubated with ATP, E. coli total tRNA and isotope-labeled 
      aspartate; mock activity is subtracted. The mutant retains about 25% of the wild-type signal. This 
      supports DARS2-dependent aspartate-tRNA ligase activity, without pretending this lysate experiment 
      is a purified mitochondrial-tRNA specificity assay.
    supported_by:
    - reference_id: PMID:15779907
      supporting_text: 'Both belong to the

        expected class of synthetases, have a dimeric organization, and aminoacylate

        Escherichia coli tRNAs as well as in vitro transcribed human mitochondrial

        tRNAs.'
    - reference_id: PMID:40814755
      supporting_text: We observed that DARS2 p.Pro503Leu showed only 25% residual aminoacylation 
        activity, showing a significant reduction compared to wild‐type DARS2.
