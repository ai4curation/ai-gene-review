  - UniProtKB:P10809
  review:
    summary: The HSPD1 association supports protein-folding chaperone binding.
    action: MODIFY
    reason: 'The exact positive BioPlex 2.0 record has HSPD1/P10809 as the tagged bait and DARS2 as prey, with
      spoke expansion. Official HSPD1 is the mitochondrial Hsp60 chaperonin. GO:0051087 describes binding to
      a protein-folding chaperone and does not require DARS2 itself to be a chaperone. The assay establishes
      contextual co-purification, not purified binary binding or a DARS2 co-chaperone function. Re-review 2026-10-20:
      retained because HSPD1 (Hsp60) is itself a mitochondrial matrix chaperonin, so the partner shares the
      DARS2 compartment, and the pair recurs in independent AP-MS and crosslinking datasets. This is a binding-partner
      annotation, not a core DARS2 activity.'
    supported_by:
    - reference_id: PMID:28514442
    proposed_replacement_terms:
    - id: GO:0051087
      label: protein-folding chaperone binding
