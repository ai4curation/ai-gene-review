- term:
    id: GO:0004815
    label: aspartate-tRNA ligase activity
  evidence_type: IDA
  original_reference_id: PMID:23275545
  qualifier: enables
  review:
    summary: The 2013 study directly assays human mitochondrial aspartate-tRNA ligase activity.
    action: ACCEPT
    reason: Recombinant human HsaDRS2 begins at I41 and was expressed in E. coli. Table 1 and Methods 
      measure charging of human mitochondrial and E. coli tRNA(Asp) transcripts with aspartate; the human
      enzyme acts on both. The 40-residue experimental truncation must not be presented as proof of the 
      predicted native 48–645 maturation boundary. Cross-species Asp recognition is not evidence of 
      tRNA(Asn) charging.
    supported_by:
    - reference_id: PMID:15779907
      supporting_text: 'Both belong to the

        expected class of synthetases, have a dimeric organization, and aminoacylate

        Escherichia coli tRNAs as well as in vitro transcribed human mitochondrial

        tRNAs.'
    - reference_id: PMID:23275545
