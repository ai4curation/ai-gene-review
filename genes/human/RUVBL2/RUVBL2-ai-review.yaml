id: Q9Y230
gene_symbol: RUVBL2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  RUVBL2 is a conserved AAA+ ATPase that alternates with RUVBL1 in hexameric and dodecameric
  rings. The RUVBL1-RUVBL2 ring is used as an ATP-hydrolyzing module in the INO80, SRCAP/SWR1
  and TIP60/p400 chromatin-remodeling complexes and as the ATPase core of the R2TP/PAQosome
  chaperone that helps assemble snoRNPs, PIKK complexes, spliceosomal snRNPs and axonemal-dynein
  assembly particles. In chromatin complexes the ring is a structural ATPase module built
  around a remodeler insertion; in R2TP/PAQosome assemblies its ATPase face and DII domains
  provide regulated docking surfaces for RPAP3/PIH1D1 and client adaptors.
alternative_products:
- name: '1'
  id: Q9Y230-1
- name: '2'
  id: Q9Y230-2
  sequence_note: VSP_056584
existing_annotations:
- term:
    id: GO:0000492
    label: box C/D snoRNP assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000120244
  - SGD:S000002598
  - SGD:S000006156
  - WB:WBGene00007784
  review:
    summary: >-
      The R2TP/PAQosome ATPase ring participates in box C/D snoRNP assembly.
    action: ACCEPT
    reason: >-
      RUVBL2 is a conserved R2TP/PAQosome ATPase. The PAQosome selects NOP58 through NOPCHAP1
      and RUVBL1/2 during early box C/D snoRNP biogenesis, and this client-loading function
      is the same process captured by the PAINT IBA.
    additional_reference_ids:
    - PMID:33367824
    supported_by:
    - reference_id: PMID:33367824
      supporting_text: NOPCHAP1 makes direct physical interactions with the CC-NOP
        domain of NOP58 and domain II of RUVBL1/2 AAA+ ATPases.
    - reference_id: PMID:33367824
      supporting_text: NOPCHAP1 interaction with RUVBL1/2 is disrupted upon ATP binding.
- term:
    id: GO:0000723
    label: telomere maintenance
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9WTM5
  - ensembl:ENSMUSP00000103400
  review:
    summary: >-
      RUVBL2 has telomerase-assembly links but telomere maintenance is not its direct core
      pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      RUVBL2/Pontin and RUVBL1/Reptin are reported telomerase assembly factors, but this orthology-transfer
      row states the endpoint telomere-maintenance process rather than the R2TP-like ATPase
      assembly role. The gene product is better represented by R2TP/PAQosome complex assembly
      functions.
    additional_reference_ids:
    - PMID:33367824
- term:
    id: GO:0000786
    label: nucleosome
  evidence_type: IDA
  original_reference_id: PMID:27153538
  qualifier: part_of
  review:
    summary: >-
      RUVBL2 acts in nucleosome-remodeling complexes but is not part of the nucleosome.
    action: REMOVE
    reason: >-
      RUVBL2 is a subunit of TIP60/p400, SRCAP and INO80 complexes that bind or remodel nucleosomes.
      The nucleosome itself is the histone-DNA substrate, not the stable complex that contains
      RUVBL2.
    additional_reference_ids:
    - PMID:21303910
    - PMID:30337683
    supported_by:
    - reference_id: PMID:21303910
      supporting_text: we present evidence that the human INO80 complex is composed of
        three modules that assemble with three distinct domains of the hIno80 ATPase
    - reference_id: PMID:21303910
      supporting_text: third that is composed of the hIno80 Snf2 ATPase domain, the Ies2
        and Ies6 proteins, the AAA(+) ATPases Tip49a and Tip49b, and the actin-related
        protein Arp5
