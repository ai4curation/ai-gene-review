- term:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  evidence_type: IDA
  original_reference_id: PMID:23637611
  qualifier: enables
  review:
    summary: >-
      The CCND1 ChIP evidence does not demonstrate sequence-specific DNA binding by RUVBL2.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      RUVBL2/TIP48 occupies CCND1 regulatory chromatin in an estrogen-responsive system, but
      ChIP at a locus does not show that the AAA+ ATPase ring directly recognizes a cis-regulatory
      DNA sequence. The data are better read as recruitment of a chromatin-remodeling complex
      to that promoter/enhancer context.
    additional_reference_ids:
    - PMID:23637611
    supported_by:
    - reference_id: PMID:23637611
      supporting_text: failure of TIP60 to associate with CCND1 in the absence of TIP48
        correlated with reduced binding of ERα
