- term:
    id: GO:0003678
    label: DNA helicase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000120244
  - RGD:68373
  - SGD:S000002598
  - SGD:S000006156
  - UniProtKB:Q8IAT2
  - UniProtKB:Q8ID85
  - UniProtKB:Q8IIU3
  - UniProtKB:Q9Y230
  - UniProtKB:Q9Y265
  review:
    summary: >-
      DNA helicase activity is not the established activity of the RUVBL1-RUVBL2 ring.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The first RUVBL2 paper reported single-stranded-DNA-stimulated ATPase and helicase activity
      for TIP49b, but a later purified human TIP48/TIP49 complex had synergistic ATPase activity
      with no detectable DNA helicase or branch-migration activity. The conserved complex
      activity is ATP hydrolysis, not a demonstrated DNA helicase reaction.
    additional_reference_ids:
    - PMID:10428817
    - PMID:17157868
    supported_by:
    - reference_id: PMID:17157868
      supporting_text: TIP48/TIP49 complex formation resulted in synergistic increase in
        ATPase activity but ATP hydrolysis was not stimulated in the presence of
        single-stranded, double-stranded or four-way junction DNA and no DNA helicase or
        branch migration activity could be detected.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN000120244
        source_status: SOURCE_BAD
        comment: >-
          The ancestral PAINT IBD is seeded partly by human RUVBL1/RUVBL2 DNA-helicase rows
          that are contradicted by later purified-complex biochemistry.
