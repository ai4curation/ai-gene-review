- term:
    id: GO:0008094
    label: ATP-dependent activity, acting on DNA
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR027238
  review:
    summary: >-
      RUVBL2 ATPase activity is not primarily DNA-acting.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      RUVBL2 is an AAA+ ATPase used in chromatin and R2TP rings, but the purified human RUVBL1-RUVBL2
      complex hydrolyzed ATP without detectable DNA helicase or branch-migration activity,
      so a generic InterPro transfer to ATP-dependent activity acting on DNA overstates the
      established reaction.
    additional_reference_ids:
    - PMID:17157868
    supported_by:
    - reference_id: PMID:17157868
      supporting_text: TIP48/TIP49 complex formation resulted in synergistic increase in
        ATPase activity but ATP hydrolysis was not stimulated in the presence of
        single-stranded, double-stranded or four-way junction DNA and no DNA helicase or
        branch migration activity could be detected.
