core_functions:
- description: >-
    ATP hydrolysis by RUVBL2 as one of the three RUVBL2 subunits in an alternating RUVBL1-RUVBL2
    AAA+ ring in the INO80, SRCAP and TIP60/p400 chromatin-remodeling complexes.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  directly_involved_in:
  - id: GO:0006338
    label: chromatin remodeling
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:21303910
    supporting_text: we present evidence that the human INO80 complex is composed of
      three modules that assemble with three distinct domains of the hIno80 ATPase
  - reference_id: PMID:21303910
    supporting_text: third that is composed of the hIno80 Snf2 ATPase domain, the Ies2
      and Ies6 proteins, the AAA(+) ATPases Tip49a and Tip49b, and the actin-related
      protein Arp5
  - reference_id: PMID:30337683
    supporting_text: SRCAP-C is an ~1 MDa complex consisting of 10 components including
      SRCAP, DMAP1, YL1, RUVBL1, RUVBL2, ACTL6A, ARP6, ACTIN, GAS41 and ZNHIT1
  - reference_id: PMID:17157868
    supporting_text: TIP48/TIP49 complex formation resulted in synergistic increase in
      ATPase activity but ATP hydrolysis was not stimulated in the presence of
      single-stranded, double-stranded or four-way junction DNA and no DNA helicase or
      branch migration activity could be detected.
- description: >-
    ATPase-ring activity of RUVBL2 in the R2TP/PAQosome assembly machine, where RUVBL2 alternates
    with RUVBL1 and exposes regulatory surfaces for RPAP3/PIH1D1 and client-loading adaptors
    such as NOPCHAP1.
  molecular_function:
    id: GO:0016887
    label: ATP hydrolysis activity
  directly_involved_in:
  - id: GO:0000492
    label: box C/D snoRNP assembly
  in_complex:
    id: GO:0097255
    label: R2TP complex
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:29662061
    supporting_text: R2TP could be reconstituted by mixing RUVBL1-RUVBL2 and
      RPAP3-PIH1D1
  - reference_id: PMID:29662061
    supporting_text: Images of the fully assembled human R2TP complex revealed a single
      hexameric ring of RUVBL1-RUVBL2 in which its ATPase face was decorated with the
      RBD domain of RPAP3
  - reference_id: PMID:33367824
    supporting_text: NOPCHAP1 makes direct physical interactions with the CC-NOP domain
      of NOP58 and domain II of RUVBL1/2 AAA+ ATPases.
  - reference_id: PMID:33367824
    supporting_text: NOPCHAP1 interaction with RUVBL1/2 is disrupted upon ATP binding.
suggested_questions:
- question: Which RUVBL2 ATPase conformations and nucleotide states drive client handoff
    in each chromatin-remodeling and R2TP/PAQosome subcomplex?
  experts: []
- question: Does any physiological human RUVBL1-RUVBL2 complex use direct DNA helicase
    or DNA-branch-migration activity, or were the early isolated-protein helicase assays
    in vitro activities outside the conserved cellular mechanism?
  experts: []
suggested_experiments:
- hypothesis: RUVBL2 ATP hydrolysis has different assembly or client-release
    requirements in INO80, SRCAP, TIP60/p400 and R2TP complexes.
  description: Reconstitute RUVBL2 ATPase-dead substitutions in defined human INO80,
    SRCAP, TIP60/p400 and R2TP assemblies and assay complex assembly, ATP hydrolysis and
    client or nucleosome remodeling outputs side by side.
  experiment_type: biochemical reconstitution
- hypothesis: RUVBL2 nucleotide state gates adaptor exchange on RUVBL1-RUVBL2 rings.
  description: Measure nucleotide-state-dependent client-adaptor exchange on single-ring
    RUVBL1-RUVBL2 with NOPCHAP1, RPAP3/PIH1D1 and DHX34 using purified mutant rings that
    isolate RUVBL2 catalytic-site effects from RUVBL1 effects.
  experiment_type: structural ATPase mechanism
