- term:
    id: GO:0000791
    label: euchromatin
  evidence_type: IDA
  original_reference_id: PMID:23637611
  qualifier: located_in
  review:
    summary: >-
      RUVBL2 is recruited to euchromatic estrogen-responsive regulatory DNA.
    action: KEEP_AS_NON_CORE
    reason: >-
      RUVBL2/TIP48 ChIP at the CCND1 promoter and enhancer in MCF-7 cells supports chromatin
      association at euchromatic regulatory loci, but this locus-specific recruitment is peripheral
      to the conserved RUVBL1-RUVBL2 ATPase-ring roles.
    additional_reference_ids:
    - PMID:23637611
    supported_by:
    - reference_id: PMID:23637611
      supporting_text: failure of TIP60 to associate with CCND1 in the absence of TIP48
        correlated with reduced binding of ERα
