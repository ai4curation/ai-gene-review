- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9WTM5
  - ensembl:ENSMUSP00000103400
  - InterPro:IPR010339
  review:
    summary: >-
      RUVBL2 binds ATP through its AAA+ ATPase cassette.
    action: ACCEPT
    reason: >-
      RUVBL2 contains a conserved ATP-binding AAA+ site and purified RUVBL1-RUVBL2 rings hydrolyze
      ATP; mutating the Walker B catalytic residue abolishes or reduces ATPase activity.
    additional_reference_ids:
    - PMID:33205750
    - PMID:33367824
    supported_by:
    - reference_id: PMID:33205750
      supporting_text: RUVBL1 and RUVBL2 are two closely related AAA-type ATPases that assemble as hetero-hexameric structures
        made of alternating subunits and comprising six ADP/ATP-binding domains
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:10524211
  qualifier: located_in
  review:
    summary: >-
      RUVBL2 is a predominantly nuclear chromatin-complex and R2TP/PAQosome protein.
    action: ACCEPT
    reason: >-
      RUVBL2 is repeatedly identified in nuclear INO80, SRCAP and TIP60/p400 chromatin complexes
      and in nuclear R2TP/PAQosome assemblies, supporting the experimentally curated nucleus
      rows.
    additional_reference_ids:
    - PMID:10966108
    - PMID:21303910
    - PMID:33367824
    supported_by:
    - reference_id: PMID:21303910
      supporting_text: we present evidence that the human INO80 complex is composed of
        three modules that assemble with three distinct domains of the hIno80 ATPase
    - reference_id: PMID:21303910
      supporting_text: third that is composed of the hIno80 Snf2 ATPase domain, the Ies2
        and Ies6 proteins, the AAA(+) ATPases Tip49a and Tip49b, and the actin-related
        protein Arp5
