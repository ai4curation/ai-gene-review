core_functions:
- description: Kinase-independent scaffold/signaling adaptor in the TNFR1 signaling complex (complex I).
    Recruited via its death domain (through TRADD) to ligated TNFR1, RIPK1 is ubiquitinated by cIAP1/2
    and LUBAC and recruits NEMO/IKK and TAK1 complexes to activate canonical NF-kappaB and MAPK signaling
    and pro-survival, pro-inflammatory gene expression. This scaffold role does not require catalytic
    activity.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
  - id: GO:0033209
    label: tumor necrosis factor-mediated signaling pathway
  - id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0002947
    label: tumor necrosis factor receptor superfamily complex
  supported_by:
  - reference_id: PMID:8612133
    supporting_text: RIP is a serine-threonine kinase that is recruited by TRADD to TNFR1 in a TNF-dependent
      process
  - reference_id: PMID:11101870
    supporting_text: In contrast to its role in nuclear factor kappa B activation, RIP requires its own
      kinase activity for death signaling
  - reference_id: PMID:14653779
    supporting_text: a portion of RIP, which is similar to this 50-residue domain of ABIN-2, is also essential
      for RIP interaction with IKKgamma
  - reference_id: PMID:12887920
    supporting_text: The initial plasma membrane bound complex (complex I) consists of TNFR1, the adaptor
      TRADD, the kinase RIP1, and TRAF2 and rapidly signals activation of NF-kappa B
- description: 'Kinase-independent pro-survival function: as a scaffold, RIPK1 restrains caspase-8-dependent
    apoptosis and RIPK3/MLKL-dependent necroptosis (e.g. preventing ZBP1/RIPK3 activation and limiting
    TRADD-FADD-caspase-8 assembly), which is required for tissue homeostasis and survival during development.'
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
  - id: GO:0060546
    label: negative regulation of necroptotic process
  - id: GO:2001237
    label: negative regulation of extrinsic apoptotic signaling pathway
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:30988283
    supporting_text: As a scaffold, RIPK1 inhibits caspase-8-dependent apoptosis and RIPK3/MLKL-dependent
      necroptosis
  - reference_id: PMID:36380021
    supporting_text: these results identify RIPK1 scaffold function as an inhibitor of RIPK3–MLKL-dependent
      necroptosis in keratinocytes
  - reference_id: file:human/RIPK1/RIPK1-uniprot.txt
    supporting_text: In normal conditions, RIPK1 acts as an inhibitor of RIPK3-dependent necroptosis
- description: Kinase-dependent pro-necroptotic function. When caspase-8 is inhibited or absent, death-domain-mediated
    dimerization activates RIPK1 kinase activity; autophosphorylated RIPK1 engages RIPK3 through RHIM-RHIM
    hetero-amyloid assembly to form the necrosome (complex IIb), with reciprocal RIPK1/RIPK3 phosphorylation.
    RIPK3, not RIPK1, then phosphorylates MLKL, which executes necroptosis. RIPK1 thus acts upstream as
    the activator/nucleator of the necrosome.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0097527
    label: necroptotic signaling pathway
  - id: GO:0070266
    label: necroptotic process
  - id: GO:1901026
    label: ripoptosome assembly involved in necroptotic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:11101870
    supporting_text: In contrast to its role in nuclear factor kappa B activation, RIP requires its own
      kinase activity for death signaling
  - reference_id: PMID:29440439
    supporting_text: Our study demonstrates the role of RIPK1-DD in mediating RIPK1 dimerization and activation
      of its kinase activity during necroptosis and RIPK1-dependent apoptosis
  - reference_id: PMID:19524513
    supporting_text: The phosphorylation of RIP1 and RIP3 stabilizes their association within the pronecrotic
      complex, activates the pronecrotic kinase activity
  - reference_id: PMID:22817896
    supporting_text: the RIP homotypic interaction motifs (RHIMs) of RIP1 and RIP3 mediate the assembly
      of heterodimeric filamentous structures
  - reference_id: PMID:22265413
    supporting_text: MLKL was phosphorylated by RIP3 at the threonine 357 and serine 358 residues
  - reference_id: PMID:23473668
    supporting_text: Necrostatins, a series of small-molecule inhibitors, suppress necroptosis by specifically
      inhibiting RIP1 kinase activity
- description: Kinase-dependent RIPK1-dependent apoptosis. Released from complex I when IKK/MK2-mediated
    inhibitory phosphorylation (e.g. Ser25) or cIAP-mediated ubiquitination fails, activated RIPK1 nucleates
    cytosolic complex IIa/the ripoptosome (RIPK1-FADD-caspase-8/10-cFLIP), promoting caspase-8 activation
    and extrinsic apoptosis; caspase-8 cleavage of RIPK1 at Asp324 terminates its activity.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0097191
    label: extrinsic apoptotic signaling pathway
  - id: GO:2001238
