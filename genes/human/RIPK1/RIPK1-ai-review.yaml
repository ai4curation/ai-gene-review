    supporting_text: RIP1 is the core component of the complex
  - reference_id: PMID:30988283
    supporting_text: We identify phosphorylation of RIPK1 on Ser25 by IKKs as a key mechanism directly
      inhibiting RIPK1 kinase activity
  - reference_id: PMID:18485876
    supporting_text: leading to the release of receptor interacting protein kinase (RIPK1) from the activated
      TNF receptor complex to form a caspase-8-activating complex consisting of RIPK1, FADD, and caspase-8
  - reference_id: PMID:22173242
    supporting_text: Knockdown of RIP1 abolishes formation of this complex and subsequent activation of
      caspase-8 and -3, mitochondrial perturbations and apoptosis
  - reference_id: PMID:31827280
    supporting_text: Impaired cleavage of RIPK1 D324 variants by caspase-8 sensitized patients' peripheral
      blood mononuclear cells to RIPK1 activation, apoptosis and necroptosis induced by TNF
- description: 'Death-domain-mediated recruitment: the RIPK1 death domain binds the death domains of TRADD,
