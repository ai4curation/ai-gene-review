- term:
    id: GO:0004706
    label: JUN kinase kinase kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0030018
  - PANTHER:PTN001147669
  - RGD:1359261
  - UniProtKB:Q16584
  - UniProtKB:Q7T2V3
  review:
    summary: 'IBA: JUN kinase kinase kinase activity propagated from the PANTHER node.'
    action: MARK_AS_OVER_ANNOTATED
    reason: RIPK1 is a Ser/Thr kinase, but there is no evidence that it directly phosphorylates the JNK
      kinases MAP2K4/MAP2K7. RIPK1's contribution to JNK activation is indirect (phosphorylation of DAB2IP
      leading to ASK1 activation), so a JNKKK activity term over-states its catalytic role; protein serine/threonine
      kinase activity is the appropriate MF.
    supported_by:
    - reference_id: PMID:17389591
      supporting_text: RIP1 (the Ser/Thr protein kinase receptor-interacting protein) associates with
        the GAP domain of AIP1 and mediates TNF-induced AIP1 phosphorylation at Ser-604 and JNK/p38 activation
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN001147669
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral node carrying the JNKKK IBD; its experimental descendants are mixed-lineage
          kinases. RIPK1 belongs to the RIP kinase subfamily of the TKL group, whose characterized members
          act in death-receptor and innate immune signaling rather than as MAP3Ks for MAP2K4/7.
      - source_id: UniProtKB:Q16584
        source_label: MAP3K11
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: MLK3 is a bona fide JNKKK; its activity does not extend to the RIPK subfamily.
      - source_id: FB:FBgn0030018
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Drosophila MLK-family donor; supports the MLK clade, not RIPK1.
