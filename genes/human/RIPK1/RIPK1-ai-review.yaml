id: Q13546
gene_symbol: RIPK1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RIPK1 (receptor-interacting serine/threonine-protein kinase 1) is a cytoplasmic signaling
  protein with an N-terminal Ser/Thr kinase domain, an intermediate domain containing a RIP homotypic
  interaction motif (RHIM), and a C-terminal death domain. Recruited via its death domain to ligated TNFR1
  (through TRADD), FAS and other death receptors, and via its RHIM to TRIF (TLR3/4) and ZBP1, RIPK1 acts
  as a molecular switch between survival, inflammation and cell death. In the TNFR1 signaling complex
  (complex I) it functions as a kinase-independent scaffold: ubiquitinated by cIAP1/2 and LUBAC, it recruits
  the TAK1 and IKK complexes to drive canonical NF-kappaB and MAPK activation and pro-survival gene expression,
  and its scaffold function also restrains caspase-8-mediated apoptosis and RIPK3/MLKL-mediated necroptosis.
  When NF-kappaB signaling or IKK/MK2/TBK1 phosphorylation checkpoints fail, RIPK1 dissociates into cytosolic
  death complexes; death-domain dimerization activates its kinase, and autophosphorylated RIPK1 promotes
  assembly of complex IIa/the ripoptosome (RIPK1-FADD-caspase-8) driving RIPK1-dependent apoptosis, or,
  when caspase-8 is inactive, RHIM-mediated hetero-amyloid assembly with RIPK3 (the necrosome), in which
  RIPK3 phosphorylates MLKL to execute necroptosis. Caspase-8 cleavage of RIPK1 after Asp324 limits these
  responses; non-cleavable variants cause an autoinflammatory disease, and biallelic loss-of-function
  causes immunodeficiency with intestinal inflammation.'
