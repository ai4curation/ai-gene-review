suggested_questions:
- question: Which proteins are bona fide physiological substrates of RIPK1 kinase activity beyond RIPK1
    itself and RIPK3 (e.g. DAB2IP), and is any substrate other than autophosphorylation required for RIPK1-dependent
    apoptosis?
  experts:
  - RIPK1/necroptosis biologists
  - kinase biochemists
- question: How should GO represent the opposing kinase-independent (anti-death, pro-NF-kB) and kinase-dependent
    (pro-death) roles of RIPK1 so that both positive and negative regulation annotations are retained
    without appearing contradictory?
  experts:
  - GO cell death curators
- question: Should the RIPK1-RIPK3 necrosome (complex IIb) have its own cellular component term distinct
    from the ripoptosome (GO:0097342), whose definition centres on caspase-8/FADD/cFLIP?
  experts:
  - GO ontology editors
suggested_experiments:
- description: Compare kinase-dead (D138N/K45A) and wild-type RIPK1 knock-in human iPSC-derived neurons
    and microglia under TNF, TNF+SMAC mimetic and TNF+SMAC+zVAD conditions, measuring complex I composition,
    NF-kB targets, caspase-8 activity and pMLKL.
  hypothesis: In human neural cell types RIPK1 scaffold function is sufficient for NF-kB signaling and
    survival, whereas necroptotic and apoptotic death require RIPK1 kinase activity.
  experiment_type: genetic knock-in and pharmacological (necrostatin) perturbation
- description: Unbiased phosphoproteomics after acute activation of RIPK1 in RIPK3-null and caspase-8-null
    backgrounds, with analog-sensitive RIPK1 to label direct substrates.
  hypothesis: RIPK1 has a limited set of direct substrates beyond autophosphorylation and RIPK3.
  experiment_type: chemical-genetic kinase substrate identification
