- id: PMID:21763481
  title: Disruption of a ciliary B9 protein complex causes Meckel syndrome.
  findings:
  - statement: Mouse B9d1 mutant fibroblasts retain cilia but fail to recruit Smoothened after
      SAG stimulation and have reduced Hedgehog transcriptional responses. Other tissues show
      distinct ciliogenesis defects. The study supports ciliary compartment organization,
      while its human patient mutation concerns B9D2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The PMID, DOI 10.1016/j.ajhg.2011.06.003 and title were verified against
      the official primary record. The complete cached Methods, Results and Discussion were
      read. MGI J:178421 identifies this as the mouse donor reference. The observed signaling
      assay does not demonstrate intrinsic B9d1 receptor activity. Original images and supplements
      were not independently inspected.
- id: PMID:41165761
  title: Ciliopathy-related B9 protein complex regulates ciliary axonemal microtubule posttranslational
    modifications and initiation of ciliogenesis.
  findings:
  - statement: Human B9D1-knockout RPE1 cells have impaired ciliogenesis and CP110 removal,
      with reduced axonemal tubulin acetylation and polyglutamylation but unchanged whole-cell
      tubulin modifications. Detailed enzyme-trafficking and vesicle assays predominantly
      concern B9D2 or TMEM67; patient variants concern B9D2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The PMID, DOI 10.1172/JCI196365 and title were verified against PubMed and
      the JCI article. The full-text Results, Discussion and Methods were read, including
      the distinct human B9D1 knockout experiments and guide sequences. Images and supplements
      were not independently inspected. These data support ciliogenesis and ciliary-gate organization,
      not intrinsic tubulin-modifying enzyme activity or a demonstrated direct B9D1–TMEM67
      interaction.
core_functions:
- description: B9D1 assembles with B9D2 and MKS1 within the MKS transition-zone complex. It
    contributes to formation and organization of the ciliary gate, including interdependent
    localization of gate proteins, thereby supporting ciliogenesis and the distinct protein
    composition of the cilium.
