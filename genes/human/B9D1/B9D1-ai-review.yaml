id: Q9UPM9
gene_symbol: B9D1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: B9D1 is a B9-domain protein of the ciliary transition zone. It associates with
  B9D2 and MKS1 in a subcomplex of the MKS machinery at the base of the cilium. This assembly
  helps establish the ciliary gate and maintain the distinct protein composition of the ciliary
  compartment. B9D1 participates in interdependent recruitment of transition-zone proteins
  and supports cilium formation. Its contribution to the ciliary environment also supports
  the localization and function of Hedgehog signaling proteins. B9D1 is soluble and associates
  with the membrane-proximal gate through protein-complex organization.
