      is interdependent. Human B9-domain complex formation and localization experiments provide
      complementary support (PMID:32726168). The process reflects participation in building
      the gate assembly; B9D1 is not merely a transported cargo in this context.
    additional_reference_ids:
    - PMID:22179047
    - PMID:32726168
