    summary: B9D1 associates with B9D2 within the B9-domain complex.
    reason: The recorded partner Q9BPU9 is B9D2. Human-protein coimmunoprecipitation and three-hybrid
      experiments support an MKS1–B9D2–B9D1 subcomplex, with B9D2 linking the other two proteins
