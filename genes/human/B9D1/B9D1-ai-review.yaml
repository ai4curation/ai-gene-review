  review:
    action: ACCEPT
    summary: B9D1 contributes to cilium assembly as part of the ciliary gate machinery.
    reason: Disruption of human MKSR1/B9D1 caused ciliogenesis defects in PMID:19208769. Human
      B9D1-knockout RPE1 cells in PMID:41165761 also show reduced ciliogenesis and impaired
      CP110 removal. B9D1 complex assembly and localization provide a direct ciliary-structure
      role, independently corroborating the inherited process assertion. The newer detailed
      vesicle experiments mainly concern B9D2 and should not be relabeled B9D1 assays. The
      reported human B9D1 knockout and CP110 results were read in the full-text Results and
      Methods; the original supplementary images were not independently inspected.
    additional_reference_ids:
    - PMID:19208769
    - PMID:22179047
    - PMID:41165761
