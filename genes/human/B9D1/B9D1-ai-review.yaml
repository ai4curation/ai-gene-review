- term:
    id: GO:0008158
    label: hedgehog receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9R1S0
  - ensembl:ENSMUSP00000099717
  review:
    action: REMOVE
    summary: The transferred receptor activity conflates ciliary signaling support with ligand
      recognition.
    reason: 'GO:0008158 requires Hedgehog-family ligand recognition coupled to signaling across
      a membrane. The mouse B9d1 donor experiment in PMID:21763481 instead tests a Smoothened
      agonist: mutant fibroblasts retain cilia but fail to localize Smoothened there and show
      impaired Gli1/Ptch1 responses. The complete available Methods and Results support a
      ciliary protein-localization mechanism, without demonstrating Hedgehog binding or receptor
      activity by B9d1. Together with the established B9-domain gate-complex role, this supports
      removing the human IEA/ISS molecular-function transfer. The existing Smoothened-pathway
      annotations are retained as non-core. Original images and supplements were not independently
      inspected.'
    additional_reference_ids:
    - PMID:22179047
    - PMID:21763481
    supported_by:
    - reference_id: PMID:21763481
      supporting_text: Smo localized to cilia in WT MEFs but not B9d1 mutant MEFs
