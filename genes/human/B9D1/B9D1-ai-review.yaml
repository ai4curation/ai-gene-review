      do not show the same overt ciliary structural phenotype.
- id: PMID:22179047
  title: A ciliopathy complex at the transition zone protects the cilia as a privileged membrane
    domain.
  findings:
  - statement: B9D1, TMEM231 and CC2D2A localizations at the transition zone are interdependent.
      Disrupting their complex alters ciliary membrane composition and diffusion, linking
      the assembly to a ciliary compartment barrier.
