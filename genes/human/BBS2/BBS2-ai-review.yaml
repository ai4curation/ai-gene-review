  review:
    summary: BBS2 binds BBS9 (Q3SYG4) as part of its BBSome scaffold role.
    action: MODIFY
    reason: 'The source row records BBS2 interaction with BBS9 (UniProtKB:Q3SYG4) by IPI from
      PMID:17574030. PMID:22500027 shows BBS2 bridging BBS7 and BBS9, and PMID:22072986 shows
      BBSome disintegration after BBS2 depletion. PMID:31530639 places the BBS9 interface on
      BBS2 and tests a disruptive BBS2 mutation. This integral structural role supports the
      specific scaffold adaptor GO:0140378: BBS2 organizes distinct protein contacts needed
      to assemble the complex. This is more informative than an unspecified adaptor or structural-molecule
      term and does not assign autonomous cargo recognition.'
