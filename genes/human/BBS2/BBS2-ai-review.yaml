gene_symbol: BBS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BBS2 is a structural subunit of the BBSome, an eight-protein complex that supports
  membrane-protein trafficking at cilia. BBS2 associates with BBS7 through a coiled-coil interface
  and contacts BBS9 through its C-terminal helical region, linking these subunits within the
  assembled complex. BBSome function supports ciliary signaling and the maintenance of sensory
  cells, including retinal photoreceptors. BBS2 is found in cytoplasmic and ciliary compartments.
  Biallelic pathogenic variants cause Bardet-Biedl syndrome, and some variants are associated
  with nonsyndromic retinitis pigmentosa.
