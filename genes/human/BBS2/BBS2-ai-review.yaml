    summary: BBS2 is reported to associate with BBS1 (Q8NFJ9).
    action: KEEP_AS_NON_CORE
    reason: BBS1 and BBS2 are components of the assembled BBSome. Retain this partner-specific
      association, but co-complex membership alone does not establish a BBS2–BBS1 heterodimer
      or transfer BBS1 cargo recognition to BBS2.
core_functions:
- description: Holds the BBSome core together through distinct contacts with BBS7 and BBS9.
    A human recombinant subcomplex supports a BBS2-BBS7 coiled-coil interface and a separate
    BBS2-BBS9 interface; disruption of the latter by the BBS2 R632P substitution impairs association.
    This establishes a structural contribution without assigning BBS2 the receptor-recognition
    or ARL6-binding activities of other subunits. In human retinal pigment epithelial cells,
    BBS2 depletion destabilizes the BBSome and impairs its normal ciliary localization, linking
    this scaffold role to ciliary protein localization.
