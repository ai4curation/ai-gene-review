suggested_questions:
- question: Does BBS2 make direct contacts with ciliary cargo, or do its effects on cargo trafficking
    arise from its contribution to BBSome architecture?
- question: Which consequence of BBS2 association with RNF2 is established in human cells independently
    of the transcriptional effects measured for BBS7?
- question: How do variants associated with nonsyndromic retinal disease differ from other pathogenic
    BBS2 variants in complex assembly, abundance and photoreceptor trafficking?
suggested_experiments:
- description: Compare independently verified BBS2 variants with matched protein expression
    and stability, measuring BBS7 association, BBS9 association and assembly of the complete
    BBSome separately. Relate these measurements to ciliary cargo trafficking in an appropriate
    human-cell model.
  hypothesis: Distinct BBS2 interfaces can be perturbed separately, with different consequences
    for BBSome assembly and trafficking.
  experiment_type: controlled biochemical and cell-based structure-function analysis
- description: Test cargo contact using purified complete BBSome and BBS2 interface variants
    that retain complex integrity, distinguishing direct cargo contact from loss of other subunits
    or altered complex stability.
  hypothesis: Effects of some BBS2 variants on cargo handling result from altered complex architecture
    rather than a direct cargo-binding defect.
  experiment_type: biochemical reconstitution and cargo-binding analysis
