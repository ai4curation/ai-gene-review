id: P49023
gene_symbol: PXN
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PXN encodes paxillin, a LIM- and LD-motif focal-adhesion adaptor that localizes to integrin-based adhesion sites and binds FAK/PTK2, vinculin, talin and other signaling and cytoskeletal partners. Paxillin organizes phosphotyrosine signaling at focal adhesions: FAK/Src and other kinases phosphorylate paxillin docking sites, and paxillin-containing complexes recruit SH2/SH3 adaptors such as Crk to regulate Rac/Rho-family signaling, focal-adhesion assembly and turnover, cell spreading and migration. Paxillin also participates in context-specific links between focal adhesions and adherens junctions, endothelial migration and cancer-cell invasion, but it is a force-coupling adhesome scaffold rather than a primary mechanosensitive ion channel or a direct detector of mechanical stimulus.'
