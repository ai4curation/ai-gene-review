core_functions:
- description: Molecular adaptor at integrin focal adhesions. Paxillin uses LD motifs and LIM domains to bind FAK, vinculin, talin and other adhesion proteins, assembling a focal-adhesion signaling platform that links integrin engagement to phosphotyrosine signaling, Rac/Rho-family pathways, cell spreading, focal-adhesion turnover and migration.
  molecular_function:
    id: GO:0060090
    label: molecular adaptor activity
  directly_involved_in:
  - id: GO:0007229
    label: integrin-mediated signaling pathway
  - id: GO:0051893
    label: regulation of focal adhesion assembly
  - id: GO:0034446
    label: substrate adhesion-dependent cell spreading
  - id: GO:0016477
    label: cell migration
  locations:
  - id: GO:0005925
    label: focal adhesion
  supported_by:
  - reference_id: PMID:7561682
    supporting_text: pp125FAK is localized to focal adhesions by the direct association with paxillin
  - reference_id: PMID:9054445
    supporting_text: paxillin is one of the important molecules interacting with a variety of signaling molecules and cytoskeletal building blocks
  - reference_id: PMID:10604475
    supporting_text: distinct biochemical and biological responses to integrin-mediated cell adhesion
  - reference_id: PMID:10604475
    supporting_text: It also reduced cell spreading, focal adhesion and stress fibre formation
- description: Vinculin-binding focal-adhesion interface. Paxillin isoforms bind vinculin through LD-motif-containing N-terminal regions and thereby contribute to recruitment and organization of cytoskeletal components at focal adhesions.
  molecular_function:
    id: GO:0017166
    label: vinculin binding
  directly_involved_in:
