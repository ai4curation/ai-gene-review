    supporting_text: gamma bound to vinculin but only weakly to focal adhesion kinase
suggested_questions:
- question: Would GO benefit from a paxillin-LD-motif binding or FAK FAT-domain binding molecular-function term to replace generic protein-binding rows for the FAK/PXN interaction?
- question: For paxillin-family PAINT, should the Drosophila-only protein sequestering activity be restricted to the insect node rather than being propagated across the full paxillin/vinexin/viral-protein family?
suggested_experiments:
- experiment_type: Force-dependent adhesion signaling
  description: Compare wild-type PXN and LD-motif mutants unable to bind FAK or vinculin in PXN-null cells on substrates of defined stiffness to separate generic focal-adhesion assembly from force-dependent FAK/Src and Rho-family signaling outputs.
