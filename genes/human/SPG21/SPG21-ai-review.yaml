gene_symbol: SPG21
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Maspardin is a small, deeply conserved and ubiquitously expressed protein that partitions between the
  cytosol and the cytosolic face of late endosomal and lysosomal membranes, where it acts as an effector
  of the small GTPase RAB7A, binding preferentially to its GTP-loaded form. Through that binding it keeps
  RAB7A on retromer- and TBC1D5-positive late endosomes rather than on lysosomes; when maspardin is absent,
  RAB7A redistributes to the lysosomal membrane, loses access to its GTPase-activating protein TBC1D5 and
  stays GTP-bound, which recruits the anterograde adaptor FYCO1 and shifts lysosomes toward the cell
  periphery. The same redistribution disturbs Rag-mediated presentation of the transcription factor TFEB
  to mTORC1, so that TFEB is under-phosphorylated and accumulates in the nucleus; canonical mTORC1
  substrates such as ULK1, S6K1 and 4E-BP1 are unaffected. Maspardin is built almost entirely from an
  alpha/beta hydrolase fold, but no enzymatic activity has ever been demonstrated for it: the fold retains
  its G-x-S-x-G nucleophile elbow while sequence and structural analyses agree that the acid and histidine
  partners of the catalytic triad are absent, and the fold appears instead to serve as a protein-interaction
  module. It was originally isolated as a binding partner of the CD4 cytoplasmic tail. Biallelic
  loss-of-function variants cause SPG21 (Mast syndrome), an autosomal recessive complicated hereditary
  spastic paraplegia with dementia, thin corpus callosum and cerebellar and extrapyramidal signs.
