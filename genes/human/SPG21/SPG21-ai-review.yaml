- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
- id: PMID:40205054
  title: Multimodal cell maps as a foundation for structural and functional genomics.
- id: PMID:40833810
  title: The hereditary spastic paraplegia type 21 (SPG21) protein is a RAB7A effector that promotes noncanonical
    mTORC1-catalyzed TFEB phosphorylation and cytoplasmic retention.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Mol Biol Cell 2025;36:ar123, PMC12483374). One of the two independent 2025-2026
      studies that establish the RAB7A effector function; includes the specificity control showing canonical
      mTORC1 substrates are unaffected. Published a few months before PMID:41400694 and reaching the same
      conclusion by different methods, which is why the effector call is treated as solid rather than
      provisional.
- id: PMID:41400694
  title: Maspardin/SPG21 controls lysosome motility and TFEB phosphorylation through RAB7 positioning.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Cell Biol 2026;225(2):e202501135, PMC12707310). Independent confirmation of the
      RAB7 effector function with a CRISPR knockout model, and the source of the lysosome-motility and
      RAB7-positioning mechanism. Its own discussion is careful about what is not established - it reports
      no maspardin interaction with VPS35 or TBC1D5 - which is the basis of the second knowledge gap here.
