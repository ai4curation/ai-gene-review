core_functions:
- molecular_function:
    id: GO:0031267
    label: small GTPase binding
  description: >-
    Maspardin is an effector of RAB7A. It binds the GTP-loaded form of the GTPase from the cytosol and is
    thereby recruited to late endosomal and lysosomal membranes, and it holds RAB7A on retromer- and
    TBC1D5-positive late endosomes rather than on lysosomes. Loss of maspardin moves RAB7A onto the
    lysosomal membrane, away from its GAP TBC1D5, so RAB7A remains GTP-bound; that in turn recruits the
    anterograde adaptor FYCO1 and drives lysosomes toward the cell periphery, and it disturbs Rag-mediated
    presentation of TFEB to mTORC1 so that TFEB is under-phosphorylated and enters the nucleus. Maspardin
    does not interact with the Rag GTPases directly and does not affect canonical mTORC1 substrates. Its
    alpha/beta hydrolase fold is used as a protein-interaction module, not as a catalytic domain.
  directly_involved_in:
  - id: GO:1900181
    label: negative regulation of protein localization to nucleus
  - id: GO:0032418
    label: lysosome localization
  locations:
  - id: GO:0005770
    label: late endosome
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:40833810
    supporting_text: We conclude that SPG21 acts as a RAB7A effector that promotes noncanonical
      mTORC1-catalyzed phosphorylation of TFEB, thereby suppressing its nuclear localization and
      transcriptional activity.
  - reference_id: PMID:40833810
    supporting_text: Herein, we report that the SPG21 protein localizes to endolysosomes through interaction
      with the GTP-bound form of RAB7A.
  - reference_id: PMID:41400694
    supporting_text: These findings identify maspardin as a newly discovered RAB7 effector and shed light
      on several consequences of its deficiency.
  - reference_id: PMID:41400694
    supporting_text: Consequently, RAB7 remains primarily GTP-bound, recruiting more FYCO1 to lysosomes and
      promoting the anterograde movement of these organelles along microtubules.
  knowledge_gaps:
  - gap_statement: >-
      Whether maspardin is a pseudoenzyme is asserted but not demonstrated. No hydrolase, esterase, lipase
      or any other catalytic assay has ever been performed on maspardin, in twenty-two years. Every
      statement that it lacks enzymatic activity - including the ones in the 2025 and 2026 papers - is a
      sequence or structure inference, repeated from the 2003 disease paper onward.
    boundary: >-
      What is established is the fold and one half of the machinery. Maspardin is a bona fide member of the
      alpha/beta hydrolase superfamily (Pfam PF00561, InterPro IPR000073), with parallel beta strands and an
      intact nucleophile elbow: residues 107-111 of Q9NZD8 are G-A-S-L-G, the canonical G-x-S-x-G motif,
      with Ser109 at the nucleophile position, inside the UniProt AB hydrolase-1 domain at 87-159. Four
      independent alignment and structure-prediction analyses agree that the acid and histidine partners of
      the triad are absent, and the original CD4 study already described the domain as non-catalytic and
      functioning as a peptide-binding module. What is missing is a single negative experiment.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      A retained, unmutated nucleophile elbow in a protein with no measured activity is exactly the
      configuration in which fold-retaining proteins occasionally turn out to keep residual catalysis using
      non-canonical partner residues, and the authors of the knockout mouse said the confirmation still
      needed doing. It also matters clinically: the recurrent pathogenic missense allele p.Ala108Pro sits
      inside that G-x-S-x-G motif, immediately before the nucleophile serine, and is currently interpreted
      purely as a folding/stability defect. If the elbow were functional, that interpretation would change.
    resolution: >-
      A serine-hydrolase activity-based protein profiling experiment on recombinant maspardin, plus a
      substrate panel of lipid and small-molecule esters, would settle it either way; a competitive
      fluorophosphonate probe would directly test whether Ser109 is a reactive nucleophile.
    provenance:
    - reference_id: PMID:20661613
      supporting_text: though the presumed catalytic triad of maspardin has some differences from other
        proteins in the esterase/lipase superfamily, it will be important to confirm that it lacks enzymatic
        activity
    - reference_id: PMID:22729480
      supporting_text: Maspardin presents similarity to the α/β-hydrolase superfamily, but might lack
        enzymatic activity and rather be involved in protein-protein interactions.
    - reference_id: PMID:40833810
      supporting_text: However, SPG21 lacks a catalytic triad typical of most α/β hydrolases (Supplemental
        Figure S1), suggesting that it does not have enzymatic activity
  - gap_statement: >-
      What maspardin does to RAB7A once bound is unknown. Binding the GTP-loaded GTPase is established, and
      the downstream consequences of losing maspardin are well characterised, but the effector output itself
      - the mechanism by which maspardin retains RAB7A on retromer-positive late endosomes rather than on
      lysosomes - has not been identified. It is not by recruiting or stabilising the RAB7 GAP TBC1D5, nor
      by binding the retromer subunit VPS35, nor by acting on RagC.
    boundary: >-
      Firmly established: maspardin binds GTP-RAB7A; maspardin loss relocates RAB7A from VPS35- and
      TBC1D5-positive endosomes to LAMP1-, RagC- and LAMTOR1-positive lysosomes; that relocation reduces
      RAB7-TBC1D5 contact, leaves RAB7 GTP-loaded, increases FYCO1 on lysosomes, drives anterograde lysosome
      movement, and under-phosphorylates TFEB without touching canonical mTORC1 substrates. What is missing
      is the step between binding and repositioning. Co-immunoprecipitation under conditions that recover
      maspardin-RAB7 complexes recovers neither VPS35 nor TBC1D5, so a simple bridging model is excluded as
      currently testable, and it is unresolved whether maspardin belongs to a larger complex that
      dissociates during the experiment.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: NARROWING
    significance: >-
      'RAB7A effector' names a binding event, not an activity. Without the output step, maspardin's GO
      molecular function can only be a binding term, and the pathogenesis of Mast syndrome can only be
      described as a downstream cascade rather than as the loss of a defined molecular capability.
    resolution: >-
      Reconstitution of maspardin with prenylated RAB7A on defined membranes, testing whether maspardin
      alters RAB7A membrane extraction by GDI, its accessibility to TBC1D5, or its lateral segregation into
      membrane subdomains; and proximity labelling from maspardin in intact cells to recover the partners
      that co-immunoprecipitation loses.
    provenance:
    - reference_id: PMID:41400694
      supporting_text: It is unclear whether maspardin belongs to a complex containing these proteins that
        dissociated during these co-immunoprecipitation experiments or if maspardin independently controls
        RAB7 localization.
    - reference_id: PMID:41400694
      supporting_text: the function of the 308 amino acid protein encoded by human SPG21 (or spg21 in mice),
        called maspardin, has not yet been identified.
suggested_questions:
- question: >-
    Has maspardin ever been assayed for catalytic activity? Every source from 2003 to 2026 states that it
    lacks the catalytic triad and is therefore probably not an enzyme, but all of those statements are
    sequence or structure inferences, and the G-x-S-x-G nucleophile elbow (Gly107-Ala108-Ser109-Leu110-Gly111)
    is intact. A single activity-based protein profiling experiment would convert a twenty-two-year-old
    prediction into a fact.
  experts:
  - Craig Blackstone
  - Juan S Bonifacino
- question: >-
    Should the recurrent p.Ala108Pro allele be reinterpreted? It sits inside the nucleophile elbow,
    immediately before Ser109, and is currently explained purely as a misfolding and degradation defect. Is
    its residual activity in TFEB rescue assays consistent with a folding defect alone?
  experts:
  - Marielle Boonen
  - Thomas Jacqmin
- question: >-
    By what mechanism does maspardin hold RAB7A on retromer-positive late endosomes? Bridging to TBC1D5 or
    VPS35 is not detected in co-immunoprecipitations that do recover the maspardin-RAB7 complex, so the
    effector output is undefined.
  experts:
  - Marielle Boonen
  - Juan S Bonifacino
- question: >-
    Is the CD4 interaction worth retaining as a molecular-function annotation? It is a real 2001 two-hybrid
    result with domain mapping, never replicated and never followed up, and it is propagated as an IBA
    across a family far older than CD4 itself.
  experts:
  - Waldemar Kolanus
suggested_experiments:
- hypothesis: >-
    Maspardin retains no catalytic activity, and Ser109 is not a reactive nucleophile.
  description: >-
    Express and purify recombinant human maspardin and subject it to activity-based protein profiling with
    fluorophosphonate and related serine-hydrolase probes, alongside a panel of generic ester, thioester and
    lipid substrates. Include a Ser109Ala mutant and a well-characterised active ABHD enzyme as controls.
    A negative result with an intact, probe-accessible elbow would close a gap that has been assumed shut
    since 2003; a positive result would redirect the whole field.
  experiment_type: Activity-based protein profiling with substrate panel
- hypothesis: >-
    Maspardin acts on RAB7A by restricting its extraction from the membrane or its access to TBC1D5, rather
    than by bridging it to another protein.
  description: >-
    Reconstitute prenylated RAB7A on liposomes or giant unilamellar vesicles with and without purified
    maspardin, and measure GDI-mediated extraction, TBC1D5-stimulated GTP hydrolysis, and lateral
    partitioning of RAB7A. Pair this with proximity-dependent biotinylation from maspardin in HeLa cells to
    recover partners that survive crosslinking but not co-immunoprecipitation.
  experiment_type: In vitro membrane reconstitution plus proximity labelling
- hypothesis: >-
    The CD4 interaction is a vertebrate-specific elaboration of a conserved RAB7A-binding surface.
  description: >-
    Map the CD4-binding and RAB7A-binding surfaces of maspardin by mutagenesis and test whether they
    overlap; in parallel, test whether maspardin orthologues from a species lacking CD4 (for example the
    Spodoptera littoralis homologue) bind RAB7 orthologues. If the surfaces coincide, the CD4 annotation is
    a lineage-specific repurposing rather than a separate function.
  experiment_type: Structure-guided mutagenesis with cross-species binding assays
