- id: PMID:11113139
  title: Cloning of ACP33 as a novel intracellular ligand of CD4.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (J Biol Chem 2001;276:9123-32). Correctly cited and not contradicted; the CD4
      interaction and the domain mapping are real. Its limitation is scope, not soundness - one screen, one
      cell context, no replication in twenty-five years - which is why the annotations derived from it are
      kept as non-core. Its most durable contribution is the observation that the alpha/beta hydrolase fold
      of this protein is non-catalytic and serves as an interaction module. Cached entry is abstract-only.
- id: PMID:14564668
  title: Maspardin is mutated in mast syndrome, a complicated form of hereditary spastic paraplegia associated
    with dementia.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Am J Hum Genet 2003;73:1147-56). The origin of both the gene-disease link and the
      catalytic-triad claim. The triad analysis is an alignment argument, explicitly hedged in the paper as
      'suggests that it is unlikely to possess enzymatic function'; every later source traces back to it.
- id: PMID:16189514
  title: Towards a proteome-scale map of the human protein-protein interaction network.
- id: PMID:19184135
  title: Interaction of the SPG21 protein ACP33/maspardin with the aldehyde dehydrogenase ALDH16A1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Neurogenetics 2009;10:217-28). Cited here for its localisation data and its statement
      of the catalytic-triad inference. The ALDH16A1 interaction it reports has not been connected to the
      RAB7A effector mechanism and is not used to support any annotation in this review.
- id: PMID:20661613
  title: Targeted disruption of the Mast syndrome gene SPG21 in mice impairs hind limb function and alters
    axon branching in cultured cortical neurons.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Neurogenetics 2010;11:369-78). Used for the explicit admission that the absence of
      enzymatic activity remains to be confirmed - the field's own statement of the knowledge gap. Note that
      its axon-branching phenotype is reported in the opposite direction to a later study (PMID:26978163),
      which is why no axon-branching annotation is proposed here.
- id: PMID:21516116
  title: Next-generation sequencing to generate interactome datasets.
- id: PMID:22458338
  title: Host-pathogen interactome mapping for HTLV-1 and -2 retroviruses.
- id: PMID:22729480
  title: Characterization of maspardin, responsible for human Mast syndrome, in an insect species and analysis
    of its evolution in metazoans.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified (Naturwissenschaften 2012;99:537-43). Relevant chiefly for two contextual points: it
      restates the hedged pseudoenzyme inference, and it documents that maspardin is conserved across
      metazoans including insects - which is what makes a CD4-binding family-level assertion implausible.
      Cached entry is abstract-only.
