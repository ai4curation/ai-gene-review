- id: PMID:15544348
  title: The alpha isoform of diacylglycerol kinase exhibits arachidonoyl specificity with alkylacylglycerol.
  findings:
  - statement: The accessible abstract includes DGKE phosphorylation and substrate preference in mixed-micelle
      assays.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete cached abstract explicitly reports epsilon-catalyzed phosphorylation and
      arachidonoyl preference despite the alpha-focused title. The full original was not recovered. The
      basic reaction is independently corroborated by directly read human DGKE experiments; inaccessible
      species, construct and Methods details are not invented. This paper is not rejected as a paralog
      misattribution.
- id: PMID:18004883
  title: Substrate chirality and specificity of diacylglycerol kinases and the multisubstrate lipid kinase.
  findings:
  - statement: Controlled human recombinant DGKE assays directly establish DAG phosphorylation and substrate
      stereoselectivity.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal cache is abstract-only. A genuine author-repository original was separately
      recovered and selected Methods, Results, Table 1 and Figure 5 read. Human C-terminal His6-DGKE was
      expressed in Sf21 cells and assayed in detergent extracts with radiolabeled ATP, no-enzyme and mock
      controls. DAG stereoselectivity is supported; small apparent activity with 2,3-DAG has a possible
      1,2-isomer contamination caveat. Public source notes give the original locator.
- id: PMID:19744926
  title: Diacylglycerol kinase epsilon is selective for both acyl chains of phosphatidic acid or diacylglycerol.
  findings:
  - statement: Human recombinant DGKE selects DAG acyl chains and is competitively inhibited by PA; separate
      mouse knockout fibroblast lipidomics support PI-cycle relevance.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal cache is abstract-only; selected Methods, Results, captions and Discussion
      were read from the separately recovered original PDF. Human full-length and engineered Δ58 constructs
      were assayed in enriched lysates. The mouse lipidomics cannot assign acyl chains to sn positions
      and do not directly measure human PI synthesis. Acyl-chain-dependent product inhibition is experimentally
      supported; physiological feedback and membrane-transfer explanations remain models.
- id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: The complete abstract describes YTS membrane fractionation and proteomics, but the DGKE-specific
      peptide/table entry was not accessible. The broad membrane annotation is retained on curator deference
      and independent human platelet fractionation evidence. This particular HDA target identification
      remains unverified here; no wrong-target allegation or specific membrane-compartment claim is made.
- id: PMID:21477596
  title: Study of arachidonoyl specificity in two enzymes of the PI cycle.
  findings:
  - statement: Mutagenesis of human DGKE changes DAG kinase activity and acyl-chain preference in controlled
      cell-extract assays.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete original Methods and Results in the genuine full-text cache were read.
      Human FLAG-DGKE constructs were expressed in COS-7 cells; radiolabeled PA assays used detergent
      extracts and mock subtraction. PIP5Kalpha is a separate assayed enzyme and its activity is not assigned
      to DGKE. Proposed selectivity pockets are models, not a DGKE structure.
- id: PMID:22108654
  title: Substrate specificity of diacylglycerol kinase-epsilon and the phosphatidylinositol cycle.
  findings:
  - statement: Human DGKE has stricter sn-2 than sn-1 acyl-chain requirements, with substantial activity
      on diarachidonoyl as well as stearoyl-arachidonoyl DAG.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete original Methods and Results/Discussion in the genuine full-text cache
      were read. Human His6-DGKE in Sf21-cell detergent extracts was tested across DAG species. Linoleoyl
      at sn-2 is a poorer substrate; the result does not support exclusive specificity for stearoyl at
      sn-1. Membrane-penetration explanations are hypotheses. No short natural isoform was assayed.
- id: PMID:23542698
  title: Recessive mutations in DGKE cause atypical hemolytic-uremic syndrome.
  findings:
  - statement: Endogenous human platelet fractionation supports membrane-associated and cytoplasmic DGKE
      pools.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original human platelet fractionation Methods and Figure 4 Results, endothelial/renal
      expression and Discussion were read. Endogenous DGKE occurs in platelet membrane and cytoplasmic
      fractions with compartment controls. Rat kidney results remain distinct from human tissue experiments.
      The disease/platelet model does not establish a selective DGKE-dependent platelet-activation mechanism
      or a particular membrane subcompartment.
- id: PMID:23949095
  title: Evaluations of the selectivities of the diacylglycerol kinase inhibitors R59022 and R59949 among
    diacylglycerol kinase isozymes using a new non-radioactive assay method.
  findings:
  - statement: The abstract reports DGKE activity in a comparison of mammalian DGK isozymes and inhibitor
      selectivity.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete abstract explicitly includes epsilon in the ten-isozyme activity/inhibitor
      comparison. The full article was inaccessible, so species, tags and detailed assay implementation
      were not verified. Established DGKE catalytic activity is retained with corroborating independently
      read human assays. R59022/R59949 results are not treated as selective physiological DGKE perturbations.
