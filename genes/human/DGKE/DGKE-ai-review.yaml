- id: PMID:23274426
  title: DGKE variants cause a glomerular microangiopathy that mimics membranoproliferative GN.
  findings:
  - statement: Human DGKE perturbation changes receptor-driven TRPC6 currents, supporting a role in intracellular
      lipid signaling.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete original Methods/Results were read. Full-length human myc-tagged DGKE,
      the c.610delA variant and siRNA were tested in HEK293T cells with M3-receptor/TRPC6 signaling. Currents
      are a DAG-sensitive functional readout, not direct DAG mass measurement or an endogenous podocyte
      electrophysiology experiment.
- id: PMID:11287665
  title: Diacylglycerol kinase epsilon regulates seizure susceptibility and long-term potentiation through
    arachidonoyl- inositol lipid signaling.
  findings:
  - statement: Mouse Dgke loss perturbs synaptic potentiation and arachidonoyl phosphoinositide signaling.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The normal cache remains abstract-only; a genuine full original was separately recovered
      and selected Methods/Results read. Mouse Dgke knockout attenuates high-frequency-stimulation-induced
      potentiation in perforant path–dentate granule-cell synapses, with basic membrane properties preserved.
      The source does not image DGKE protein at a synaptic membrane. This grounds orthology-based neuronal
      context, not a direct human localization assay.
core_functions:
- description: Phosphorylates membrane diacylglycerol to phosphatidic acid using ATP, preferentially recycling
    arachidonoyl-containing diacylglycerol into the phosphatidylinositol cycle. Selectivity is strongest
    for the sn-2 acyl chain; stearoyl at sn-1 is favored among tested saturated chains, but other sn-1
    chains can support substantial activity.
  molecular_function:
    id: GO:0004143
    label: ATP-dependent diacylglycerol kinase activity
  directly_involved_in:
  - id: GO:0006654
    label: phosphatidic acid biosynthetic process
  - id: GO:0006661
    label: phosphatidylinositol biosynthetic process
  locations:
  - id: GO:0016020
    label: membrane
  supported_by:
  - reference_id: PMID:8626589
    supporting_text: 'clear selectivity

      for arachidonoyl-containing species of diacylglycerol'
  - reference_id: PMID:19744926
    supporting_text: substrate specificity for sn-2 arachidonoyl-diacylglycerol (DAG)
  - reference_id: PMID:21477596
    supporting_text: the formation of the product PA was linear over the 10-min reaction period
  - reference_id: PMID:22108654
    supporting_text: 20:4/20:4-DAG has a similar activity to 18:0/20:4-DAG
suggested_questions:
- question: What activity, stability and cellular role, if any, does the natural 177-residue P52429-2
    product have? The full-length and engineered-deletion experiments do not resolve this.
- question: Which native membrane pools carry the physiologically relevant DGKE activity during phosphatidylinositol
    recycling? Platelet fractionation establishes membrane association without resolving an organelle
    or membrane face.
