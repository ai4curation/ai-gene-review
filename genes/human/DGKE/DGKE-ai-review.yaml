id: P52429
gene_symbol: DGKE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DGKE is an ATP-dependent lipid kinase that converts diacylglycerol to phosphatidic acid.
  Its preference for substrates bearing an arachidonoyl chain at sn-2 connects diacylglycerol signaling
  with phosphatidylinositol recycling. DGKE acts at membrane interfaces and is found in membrane-associated
  and cytosolic pools. The sn-1 chain preference is more flexible, so stearoyl-arachidonoyl diacylglycerol
  is not its only efficiently used substrate.
alternative_products:
- name: '1'
  id: P52429-1
  description: The 567-residue product contains the annotated diacylglycerol kinase catalytic domain.
    Human full-length recombinant DGKE constructs support the ATP-dependent DAG-to-PA chemistry and acyl-chain
    selectivity summarized here. Engineered epitope-tagged proteins and N-terminal deletion constructs
    are experimental reagents rather than additional natural isoforms.
- name: '2'
  id: P52429-2
  sequence_note: VSP_056957, VSP_056958
  description: The 177-residue product replaces canonical residues 156–177 with an alternative sequence
    and lacks residues 178–567, including the annotated catalytic domain at 215–356. The four assessed
    biochemical papers do not test this natural product. Its activity, stability and cellular role remain
    unestablished; full-length activity and engineered-deletion results are not transferred to it.
