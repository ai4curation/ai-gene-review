core_functions:
- description: Phosphotyrosine-dependent adaptor that couples Src-family and RET/PTC tyrosine kinases
    to PI3K. Phosphorylated Tyr54 (YxxM) docks the p85alpha SH2 domains and promotes PI3K-Akt signaling
    that supports G1/S progression and cell survival.
  molecular_function:
    id: GO:0036312
    label: phosphatidylinositol 3-kinase regulatory subunit binding
  directly_involved_in:
  - id: GO:0051897
    label: positive regulation of phosphatidylinositol 3-kinase/protein kinase B signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id012
  - *id011
- description: Binds c-Src through its SH2/SH3-binding motif-rich N-terminus and enhances Src activation
    (Tyr416 phosphorylation) as a non-catalytic activator. The same N-terminal motifs engage the fifth
    SH3 domain of the scaffold Tks5.
  molecular_function:
    id: GO:0030296
    label: protein tyrosine kinase activator activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - *id005
  - *id003
- description: Actin-associated scaffold. It is recruited to the branched F-actin of lamellipodia on
    stimulation. Its C-terminal region binds F-actin directly, and N-terminal multimerization lets it
    crosslink filaments (shown for the mouse SF4 ortholog). In thyrocytes, the mouse ortholog sits at
    the apical membrane cortex.
  molecular_function:
    id: GO:0051015
    label: actin filament binding
  locations:
  - id: GO:0030027
    label: lamellipodium
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:21084565
    supporting_text: In stimulated cells, XB130 localized to the lamellipodial F-actin meshwork.
  - reference_id: PMID:27462298
    supporting_text: Furthermore, homology search analysis revealed that this region was highly conserved
      in many vertebrate species (Figure 2C).
suggested_questions:
- question: Does the C-terminal actin-binding region mapped in mouse PI3KAP/XB130 (residues 830-840 of
    the mouse construct) correspond to a conserved segment near the C-terminus of the 818-residue human
    protein, and does human XB130 crosslink F-actin in vitro?
- question: Which PH domain lipid specificities, if any, target XB130 to the thyrocyte apical membrane,
    and is the thyroid apical-cortex role conserved in human (are AFAP1L2 variants found in congenital
    hypothyroidism cohorts)?
suggested_experiments:
- description: Purify recombinant human XB130 (full length, and with C-terminal and N-terminal-40 deletions).
    Test F-actin co-sedimentation and low-speed crosslinking assays, and test multimerization by blue-native
    PAGE, so the actin-binding function is established directly on the human protein.
