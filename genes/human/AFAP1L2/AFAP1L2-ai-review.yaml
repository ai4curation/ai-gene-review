gene_symbol: AFAP1L2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AFAP1L2 (XB130, PI3KAP) is an 818-residue intracellular adaptor and actin-associated scaffold
  of the AFAP family. Its N-terminal region carries proline-rich SH3-binding and tyrosine-containing SH2-binding
  motifs, followed by two pleckstrin homology domains and a C-terminal coiled-coil and actin-binding region.
  It is a substrate of Src-family and RET/PTC tyrosine kinases. Once tyrosine phosphorylated, Tyr54 docks
  the SH2 domains of the PI3K regulatory subunit p85alpha, coupling these kinases to PI3K-Akt signaling
  that sustains G1/S progression and cell survival. It also binds Src and enhances Src activation. Its
  N-terminus binds the fifth SH3 domain of the scaffold Tks5. XB130 is cytoplasmic at rest and translocates
  to the branched F-actin of lamellipodia on Rac activation or EGF stimulation. The rodent ortholog binds
  and crosslinks actin filaments by multimerizing. In thyroid follicular cells, where expression is highest,
  the mouse protein sits at the apical membrane and is needed for apical membrane organization, follicle
  lumen formation and thyroid hormone production.
