  label: Homo sapiens
description: AFAP1L2 (XB130) is a cytoplasmic adaptor that couples Src-family kinase signaling to downstream
  phosphorylation, transcriptional responses and cell-cycle progression. Its N-terminal SH2/SH3-binding
  motifs and pleckstrin homology domains organize interactions with signaling proteins. It promotes Src
  activation and EGF-linked Akt signaling, with context-dependent effects on epithelial cytokine production.
