    of IGF mitogenic activity in FRTL-5 thyroid cells.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Independent identification of rat PI3KAP/XB130 as a p85 PI3K-associated, Src-associated
      phosphoprotein in thyroid cells. It corroborates the human data in a SF4 ortholog.
- id: PMID:26446840
  title: XB130/Tks5 scaffold protein interaction regulates Src-mediated cell proliferation and survival.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Maps the binding of the XB130 N-terminus to the Tks5 SH3 domain 5 and
      shows the knockdown effects on Src Y416, p85alpha, Akt and G1 arrest in BEAS-2B cells.
- id: PMID:27462298
  title: Phosphatidylinositol 3-Kinase-Associated Protein (PI3KAP)/XB130 Crosslinks Actin Filaments through
    Its Actin Binding and Multimerization Properties In Vitro and Enhances Endocytosis in HEK293 Cells.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Direct F-actin binding and crosslinking by mouse PI3KAP/XB130 (variant
      1), with N-terminal multimerization. Residue numbers (830-840) refer to the mouse construct, not
      the 818-aa human protein.
- id: PMID:34470464
  title: XB130 Deficiency Causes Congenital Hypothyroidism in Mice due to Disorganized Apical Membrane
    Structure and Function of Thyrocytes.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Mouse Xb130 knockout gives congenital hypothyroidism. Endogenous XB130
      is at the thyrocyte apical membrane. Used here for location only; the phenotypes are necessity evidence
      and are not process annotations.
