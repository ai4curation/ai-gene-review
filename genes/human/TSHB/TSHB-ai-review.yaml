  findings:
  - statement: >-
      Identifies a homozygous G29R (GGT to AGT) mutation in the conserved CAGYC region of TSHB
      that prevents heterodimerization with the alpha subunit and causes congenital isolated TSH
      deficiency.
    supporting_text: >-
      Thyroid-stimulating hormone (TSH) deficiency caused by a single base substitution in the
      CAGYC region of the beta-subunit.
- id: PMID:36001021
  title: Novel TSHB variant (c.217A>C) causing severe central hypothyroidism and pituitary
    hyperplasia.
  findings:
  - statement: >-
      Demonstrates that TSH is a heterodimer of a common alpha subunit (CGA) and the
      subtype-specific beta subunit (TSHB) that determines receptor specificity, and that biallelic
      pathogenic TSHB mutations cause severe isolated TSH deficiency.
    supporting_text: >-
      TSH is a member of the glycoprotein hormone family, which includes luteinising hormone,
      follicle-stimulating hormone, and human chorionic gonadotropin. All are heterodimers of a
      common α subunit and subtype-specific β subunit, which determines the biologic specificity.
