suggested_questions:
- question: >-
    How does tissue-specific sulfation versus sialylation of the N-linked oligosaccharide on
    Asn-43 of human TSHB alter its circulatory half-life and intrinsic efficacy at TSHR in
    euthyroid versus hypothyroid states?
suggested_experiments:
- description: >-
    Compare Gs (cAMP) and Gq/11 (IP1/Ca2+) concentration-response curves of recombinant human TSH
    glycoforms with defined terminal GalNAc-4-sulfate versus alpha-2,6-sialic acid on TSHB Asn-43
    using BRET biosensors in primary human thyrocytes.
  hypothesis: >-
    Variations in TSHB N-glycan terminal sulfation/sialylation bias TSHR signaling between Gs-cAMP
    and Gq-PLC pathways in addition to regulating hepatic clearance.
