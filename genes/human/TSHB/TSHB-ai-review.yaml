  label: Homo sapiens
description: >-
  Thyrotropin subunit beta (TSHB) is the hormone-specific cystine-knot beta chain of
  thyroid-stimulating hormone (thyrotropin, TSH), synthesized and secreted by thyrotroph cells of
  the anterior pituitary gland. In the endoplasmic reticulum, TSHB non-covalently heterodimerizes
  with the common glycoprotein hormone alpha subunit (CGA) via a disulfide-stabilized seatbelt
  loop to assemble biologically active TSH. Following secretion into the circulation, heterodimeric
  TSH binds the extracellular leucine-rich-repeat domain of the thyroid-stimulating hormone
  receptor (TSHR) on the basolateral plasma membrane of thyroid follicular cells, activating Gs-
  and Gq/11-coupled signaling cascades that drive thyroid follicular growth and thyroid hormone
  (T3/T4) synthesis and secretion.
