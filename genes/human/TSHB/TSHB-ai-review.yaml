core_functions:
- description: >-
    Acts as the hormone-specific beta subunit of secreted heterodimeric thyroid-stimulating
    hormone (TSH, paired with the common alpha chain CGA), binding and activating the
    thyroid-stimulating hormone receptor (TSHR) on thyroid follicular cells to initiate the
    thyroid-stimulating hormone signaling pathway and stimulate thyroid hormone synthesis and
    secretion.
