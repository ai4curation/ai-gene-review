  review:
    summary: >-
      TSHB is the hormone-specific beta subunit of thyroid-stimulating hormone (TSH) that binds
      and activates TSHR on thyrocytes to initiate the thyroid-stimulating hormone signaling
      pathway.
    action: NEW
    reason: >-
      In GOA, GO:0038194 (thyroid-stimulating hormone signaling pathway) was annotated only to the
      receptor TSHR and downstream scaffold PDE4DIP, omitting the TSH hormone subunits TSHB and
      CGA (Category A gap in the Ligands in Signaling Pathways audit). Genetic and biochemical
      evidence (PMID:36001021; Reactome:R-HSA-391375) establishes that heterodimeric TSH
      (TSHB:CGA) directly binds TSHR on thyrocytes to trigger Gs- and Gq-mediated signaling.
    supported_by:
    - reference_id: PMID:36001021
      supporting_text: >-
        TSH is a member of the glycoprotein hormone family, which includes luteinising hormone,
        follicle-stimulating hormone, and human chorionic gonadotropin. All are heterodimers of a
        common α subunit and subtype-specific β subunit, which determines the biologic specificity.
    - reference_id: Reactome:R-HSA-391375
      supporting_text: >-
        Thyroid-stimulating hormone (TSH, thyrotropin) binds thyrotropin receptor (TSHR) on the
        basolateral membrane of thyroid cells (Nagayama Y et al., 1989).
