    label: endoplasmic reticulum membrane
  in_complex:
    id: GO:1990332
    label: Ire1 complex
  supported_by:
  - *id007
  - *id005
  - *id004
- description: Luminal-domain homodimerization (opposed in unstressed cells by BiP bound via ERdj4) that
    couples the ER protein-folding state to activation of the cytosolic effector domains.
  molecular_function:
    id: GO:0042803
    label: protein homodimerization activity
