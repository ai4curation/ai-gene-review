        domain receptor internalization and interaction through C-terminal domain with the unspliced XBP1
        and the inositol requiring enzyme 1 α in the endoplasmic reticulum, leading to inositol requiring
        enzyme 1 α phosphorylation and XBP1 mRNA splicing
    - reference_id: PMID:23529610
      supporting_text: Knockdown of XBP1 or inositol requiring enzyme 1 α decreased endothelial cell proliferation
        via suppression of Akt/GSK3β phosphorylation, β-catenin nuclear translocation, and E2F2 expression.
