id: O75460
gene_symbol: ERN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ERN1 (IRE1alpha) is a single-pass type I transmembrane protein of the endoplasmic reticulum
  (ER) and the most conserved sensor of the unfolded protein response (UPR). Its ER-luminal domain senses
  misfolded proteins: in unstressed cells it is held monomeric by the Hsp70 chaperone BiP/HSPA5 (recruited
  by the J-protein ERdj4/DNAJB9), and accumulating unfolded proteins release BiP and promote dimerization
  and higher-order oligomerization. Dimerization brings together the cytosolic serine/threonine kinase
  domains, which trans-autophosphorylate and allosterically activate the C-terminal KEN endoribonuclease
  domain. The RNase excises a 26-nucleotide intron from XBP1 mRNA in the cytoplasm; after ligation by
  RtcB the frameshifted mRNA encodes XBP1s, a potent bZIP transcription factor that induces ER chaperone,
  ERAD and lipid-synthesis genes. ERN1 also degrades ER-localized mRNAs (regulated IRE1-dependent decay,
  RIDD) and, through recruitment of TRAF2/ASK1, activates JNK signaling and can promote apoptosis under
  unresolved ER stress. Its activity is tuned by many cytosolic and luminal partners, including HSP90,
  HSP72, BI-1/TMBIM6, PDIA6 and RACK1-PP2A, and it couples ER homeostasis to secretory-cell physiology
  such as insulin production and growth-factor-driven vascular cell proliferation.'
