  review:
    summary: IRE1alpha knockdown decreased VEGF-driven endothelial cell proliferation, which is mediated
      by XBP1s and downstream Akt/GSK3beta/beta-catenin/E2F2 signaling.
    action: MODIFY
    reason: ERN1 does not itself execute cell proliferation; it acts upstream as the XBP1-splicing enzyme.
      A regulatory term is more accurate, and this is a non-core, context-specific role.
    proposed_replacement_terms:
    - id: GO:0001938
      label: positive regulation of endothelial cell proliferation
    supported_by:
