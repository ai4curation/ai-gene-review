suggested_questions:
- question: Does human IRE1alpha luminal domain bind unfolded polypeptides directly (as for yeast Ire1),
    or is activation governed predominantly by BiP/ERdj4 competition?
- question: What determines the switch between XBP1 splicing and RIDD/apoptotic outputs of IRE1alpha under
    prolonged ER stress?
- question: Are the many reported cytosolic interactors (TRAF2, JAB1, USP14, RACK1, PARP16, DDRGK1) assembled
    into a single UPRosome scaffold or into distinct context-specific complexes?
suggested_experiments:
- description: In cells expressing kinase-dead but RNase-activatable IRE1alpha (e.g. ATP-site mutants
    rescued by 1NM-PP1), quantify XBP1 splicing versus RIDD target decay to separate kinase-dependent
    and kinase-independent outputs.
- description: Reconstitute IRE1alpha luminal domain with BiP, ERdj4 and model unfolded substrates in
    vitro to measure how each controls dimer/oligomer assembly.
