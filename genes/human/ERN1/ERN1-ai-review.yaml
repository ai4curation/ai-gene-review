core_functions:
- description: Site-specific endoribonuclease (KEN domain) that excises the 26-nt intron from XBP1 mRNA
    during ER stress, initiating unconventional cytoplasmic splicing that produces the XBP1s transcription
    factor; also cleaves ER-associated mRNAs (RIDD).
  molecular_function:
    id: GO:0004521
    label: RNA endonuclease activity
  directly_involved_in:
  - id: GO:0036498
    label: IRE1-mediated unfolded protein response
  - id: GO:0070054
    label: mRNA splicing, via endonucleolytic cleavage and ligation
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  in_complex:
    id: GO:1990332
    label: Ire1 complex
  supported_by:
  - *id002
  - *id026
  - *id005
- description: Serine/threonine kinase that trans-autophosphorylates upon stress-induced dimerization
    of the luminal sensor domain; autophosphorylation and nucleotide occupancy activate the RNase domain.
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0036498
    label: IRE1-mediated unfolded protein response
  locations:
