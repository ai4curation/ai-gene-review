  supporting_entities:
  - UniProtKB:P18581
  - ensembl:ENSMUSP00000058866
  review:
    summary: Over-annotation arising from CAT-2's role in supplying arginine to macrophages;
      the transporter does not itself perform the regulatory work.
    action: MARK_AS_OVER_ANNOTATED
    reason: CAT-2B imports L-arginine that nitric oxide synthase (NOS2) and macrophage
      signalling use during classical/alternative activation. This is substrate SUPPLY,
      not participation - by the participation test (CLAUDE.md) the transporter catalyses
      no step of macrophage-activation regulation and contributes no structure or cofactor
      activity to that process; it merely provides the amino acid another enzyme consumes.
      Mouse-ortholog necessity (reduced NO on CAT2 loss) establishes that arginine
      supply is required, which is exactly what being a substrate source means, not
      that the transporter regulates activation. The transport function is captured
      by the arginine transport/import rows; this regulatory process is an indirect,
      over-annotated role.
    supported_by:
