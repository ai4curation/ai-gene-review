description: Cationic amino acid transporter 2 (CAT-2) is a multi-pass plasma-membrane
  permease of the APC superfamily (CAT family, TC 2.A.3.3) that mediates Na+-independent
  facilitated transport of the cationic (basic) L-amino acids L-arginine, L-lysine
  and L-ornithine (and the arginine analogue L-homoarginine) via the system y+. Transport
  is equilibrative (uniport/exchange of substrate without a coupled ion), and the
  protein functions on its own without a heavy-chain subunit. Two alternatively spliced
  isoforms differ in affinity and capacity, comprising the high-affinity inducible
  CAT-2B (isoform 1) and the low-affinity high-capacity CAT-2A (isoform 2, liver/skeletal
  muscle). By controlling cellular uptake of arginine and lysine, CAT-2 supplies substrate
  for downstream nitrogen metabolism, including arginine provision to nitric oxide
  synthase in macrophages and lysine uptake that fuels lysine catabolism in some tumour
  cells.
