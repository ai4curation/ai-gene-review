id: Q9NSV4
gene_symbol: DIAPH3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DIAPH3 is a Rho-regulated diaphanous-related formin that binds actin and promotes filament
  assembly. Its FH1–FH2 region supports actin filament growth and bundling, while terminal regulatory
  regions restrain assembly activity. DIAPH3 also associates with microtubules; mDia2 fragment experiments
  separate microtubule binding and stabilization from actin assembly. Human DIAPH3 occupies cytosolic
  and cytoskeletal pools and accumulates at the cleavage furrow and spindle midzone during cytokinesis.
  Regulated nuclear transport and membrane recruitment provide additional cellular contexts. Increased
  DIAPH3 activity is associated with auditory neuropathy. Multiple natural splice products differ in regulatory
  and C-terminal sequences, and their individual activities are not established by the historical engineered
  constructs.
