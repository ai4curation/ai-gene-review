- id: file:human/DIAPH3/DIAPH3-source-guide.md
  title: DIAPH3 source and construct guide
  findings:
  - statement: Public original locators, assay and species limits, ancestral-node provenance and exact
      Reactome chains are recorded together.
core_functions:
- description: DIAPH3 binds actin and promotes filament assembly through its FH1–FH2 region. N-terminal
    and C-terminal regulatory regions restrain this activity. An activated human construct lacking the
    C-terminal regulatory segment promotes filopodia and concentrates at their tips. The actin-binding,
    filament-growth and regulatory properties form one integrated mechanism.
  molecular_function:
    id: GO:0003779
    label: actin binding
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005884
    label: actin filament
  directly_involved_in:
  - id: GO:0030041
    label: actin filament polymerization
  supported_by:
  - reference_id: PMID:18755006
    supporting_text: induced the formation of filopodia and accumulated at their tips.
  - reference_id: PMID:18458159
- description: DIAPH3 has a microtubule-associated function distinct from actin assembly. Purified mDia2
    fragments bind microtubule polymers and protect them against depolymerization even when their actin-assembly
    activity is impaired. Endogenous human DIAPH3 localizes to the microtubule-rich central spindle. The
    fragment biochemistry and human localization support this function together; they do not establish
    identical activity for every natural product.
  molecular_function:
    id: GO:0008017
    label: microtubule binding
  locations:
  - id: GO:0005874
    label: microtubule
  supported_by:
  - reference_id: PMID:18458159
    supporting_text: FH1FH2mDia2 directly binds to MTs
  - reference_id: PMID:19457867
  - reference_id: GO_REF:0000052
suggested_questions:
- question: Which current DIAPH3 natural products retain regulated actin assembly and microtubule binding,
    and which exact sequences correspond to the historical mDia2 fragments?
- question: Does endogenous human DIAPH3 physically occupy auditory ribbon synapses or tip-link densities,
    rather than influencing their morphology through cytoskeletal activity?
suggested_experiments:
- description: Compare sequence-verified natural DIAPH3 products in purified actin and microtubule binding/assembly
    assays, with matched expression and folding controls.
- description: Use validated endogenous DIAPH3 tagging and ultrastructural localization in hair cells
    to test the proposed precise auditory locations separately from overexpression phenotypes.
