  review:
    summary: The ESCRT-I complex assignment confuses regulation with complex membership.
    action: REMOVE
    reason: The Ensembl transfer is traceable to mouse Q9Z207, whose current part_of/IMP source is PMID:33036023.
      The actual original tests mDia2 loss and rescue in mouse erythroid cells and places mDia2 upstream
      of SRF-dependent Chmp5 expression and ESCRT-III-mediated remodeling. The source does not establish
      mDia2 as a subunit of ESCRT-I, the class-E sorting complex specified by GO:0000813. This is a source-to-complex
      mapping error, not evidence that DIAPH3 has no effect on endosomal biology.
