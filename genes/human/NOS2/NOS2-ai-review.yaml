core_functions:
- description: NOS2 produces high-output cytosolic nitric oxide from L-arginine in induced inflammatory cells,
    using the canonical NOS heme, FAD, FMN, NADPH, tetrahydrobiopterin and calmodulin cofactors to drive
    inflammatory, bactericidal and protein S-nitrosylation outputs.
