id: P35228
gene_symbol: NOS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NOS2 encodes inducible nitric-oxide synthase, a cytosolic homodimeric flavoheme enzyme that produces
  sustained nitric oxide from L-arginine after cytokine, lipopolysaccharide and microbial induction. Its high-output
  nitric oxide production supports inflammatory and antimicrobial responses in macrophages, hepatocytes, chondrocytes
  and epithelial cells and can feed protein S-nitrosylation and reactive nitrogen species chemistry.'
alternative_products:
