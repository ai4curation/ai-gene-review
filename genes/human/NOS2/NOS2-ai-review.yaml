suggested_questions:
- question: Which human inflammatory cell types use NOS2 primarily for direct NO production versus iNOS-S100A8/9 transnitrosylase target selection?
suggested_experiments:
- description: Compare induced macrophages, epithelial cells and chondrocytes with endogenous NOS2 and S100A8/S100A9 perturbations to separate NO, peroxynitrite and target-selective S-nitrosylation outputs.
