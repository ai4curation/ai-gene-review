  predicted_term:
    id: GO:1990615
    label: Kelch-containing formin regulatory complex
  predicted_term_type: GO_CC
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      Rank 2 (score 15.26). The Kelch-containing formin regulatory complex is the fission yeast tea1-tea4-for3
      polarity module - the same term ProTrek returned as rank 1 for S. pombe ral2 earlier in this
      cohort. KEAP1 is a Kelch-repeat protein, but Kelch is a beta-propeller interaction module found
      in hundreds of unrelated proteins; matching on it alone puts a human CUL3 adaptor into a yeast
      polarity complex.
    supported_by:
    - reference_id: file:human/KEAP1/KEAP1-uniprot.txt
      supporting_text: >-
        Belongs to the KEAP1 family
- source_method: ProTrek
