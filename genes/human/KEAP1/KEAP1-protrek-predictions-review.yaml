id: Q14145
gene_symbol: KEAP1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens (Human)
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for KEAP1, the CUL3 substrate adaptor that holds NRF2 down. Rank
  1 and rank 3 both describe sequestration, which is a real and central part of KEAP1's mechanism,
  but neither of this review's core functions - ubiquitin-like ligase-substrate adaptor activity and
  transcription regulator inhibitor activity - is retrieved, and the E3 ligase context never appears.
  The free-text channel names it exactly at 20.90 ('Substrate-specific adapter of a BCR (BTB-CUL3-RBX1)
  E3 ubiquitin ligase complex... targeting NFE2L2/NRF2'), so this is another GO-versus-free-text split.
  Assessment: 1 less precise (LSP), 1 uncertain (UNC), 1 nonparalog incorrect (NPI).
