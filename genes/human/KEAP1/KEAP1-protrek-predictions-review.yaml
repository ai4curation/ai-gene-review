  predicted_term:
    id: GO:0140313
    label: molecular sequestering activity
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: >-
      Rank 3 (score 15.13) and absent from GOA. Molecular sequestering activity is the general molecular-function
      form of rank 1 and is correct as far as it goes: KEAP1 does sequester NRF2. It is much less
      precise than the adaptor and inhibitor activities this review assigns, and it omits the ubiquitin
      ligase mechanism entirely. Scored LSP.
    supported_by:
