  source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
  source_reference_id: PMID:41039041
  predicted_term:
    id: GO:0042994
    label: cytoplasmic sequestering of transcription factor
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      Top-ranked hit (score 15.68). Cytoplasmic sequestering of a transcription factor is a fair description
      of what KEAP1 does to NRF2 under basal conditions, and it is close to this review's second core
      function. But the term is obsolete in the current GO release, and it also frames KEAP1 as a
      tether rather than as the degradation adaptor it is - NRF2 is not merely held in the cytoplasm,
      it is ubiquitinated and destroyed with a fifteen-minute half-life. Recorded as uncertain.
    supported_by:
