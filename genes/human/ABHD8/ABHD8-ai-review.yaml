- term:
    id: GO:0006654
    label: phosphatidic acid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Same family node as the other lipid IBAs, but with an additional problem: the WITH/FROM
      field includes UniProtKB:Q8WTS1, which is ABHD5 (CGI-58) - a human PARALOG, not an ortholog. ABHD5
      is a genuine CoA-dependent lysophosphatidic acid acyltransferase, so the activity is correct for
      the source and transferred sideways to ABHD8. The transfer is also internally awkward: this is an
      acyltransferase activity, while the same IBA set assigns ABHD8 hydrolase activities from the same
      node, and no evidence places both in this protein.


      There is a further irony worth recording. ABHD5 is the textbook case of an alpha/beta-hydrolase
      FOLD protein that is not a hydrolase at all - it lacks the catalytic serine and works as an activator
      of ATGL. So the paralog most responsible for this transfer is itself an example of fold-does-not-imply-function,
      which is precisely the caution ABHD8 needs.'
    action: REMOVE
    reason: 'Partly a paralog transfer: ABHD5 (UniProtKB:Q8WTS1) is a human paralog whose LPA acyltransferase
      activity is genuine for itself. ABHD8 has no acyltransferase evidence, and the assignment conflicts
      with the hydrolase activities inferred from the same node.'
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: UniProtKB:Q8WTS1
        comment: ABHD5/CGI-58, a human paralog rather than an ortholog. A genuine CoA-dependent LPA acyltransferase,
          and itself an alpha/beta-hydrolase-fold protein that is not a hydrolase - the classic demonstration
          that this fold does not imply a given activity.
      - source_id: PANTHER:PTN008676419
        comment: Family node also supplying hydrolase activities to this gene, which the acyltransferase
          assignment sits awkwardly beside.
    supported_by:
