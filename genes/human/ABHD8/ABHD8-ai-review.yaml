- term:
    id: GO:0006654
    label: phosphatidic acid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Acyltransferase-branch inference, carried up into a biological process. This row asserts
      more than its MF counterpart GO:0042171 does, and is correspondingly weaker.


      Resolving this row''s three WITH/FROM sources softens the action from a first reading. UniProtKB:Q8WTS1
      is ABHD5/CGI-58, a human PARALOG whose CoA-dependent LPA acyltransferase activity is genuine for
      itself - a sideways transfer. But SGD:S000004089 is yeast ICT1, also a real 1-acylglycerol-3-phosphate
      O-acyltransferase and a family member rather than a paralog artefact. So the activity is not attached
      to this node through one human paralog alone.


      The process term nonetheless overreaches further than the MF. Having an LPA acyltransferase activity
      and participating in phosphatidic acid biosynthesis are different claims: the second requires the
      gene product to act in that pathway, in a compartment where it occurs, on the pathway''s intermediates.
      Nothing places ABHD8 in phospholipid biosynthesis - no lipidomic phenotype, no pathway genetics,
      no membrane localisation (UniProt has it cytoplasmic), and its one experimental study found an adaptor
      role in inflammasome control. Marked over-annotated rather than removed because the MF it rests
      on comes from genuine family members; but if the MF is only weakly supported, the pathway claim
      built on top of it is weaker still.'
    action: MARK_AS_OVER_ANNOTATED
    reason: A pathway-participation claim inherited from a family-level activity inference. Even granting
      the inferred acyltransferase activity, no evidence places ABHD8 in phosphatidic acid biosynthesis.
      Over-annotated rather than removed, since the source activity is real in yeast ICT1 and in the ABHD5
      paralog; downgraded from an earlier REMOVE after resolving SGD:S000004089 as ICT1.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008676419
        comment: Family/subfamily node, i.e. an internal tree node rather than a protein, so it carries
          no evidence of its own. It supplies both hydrolase and acyltransferase activities to this gene,
          which sit awkwardly together given neither is demonstrated for ABHD8. It is a tree node, so
          it has no evidence of its own for this term.
      - source_id: SGD:S000004089
        comment: 'Q12385 ICT1_YEAST, recommended name ''1-acylglycerol-3-phosphate O-acyltransferase ICT1''
          - a real family member carrying the acyltransferase activity. For THIS term (GO:0006654) it
          carries its own experimental evidence: IMP (all codes: IBA/IMP).'
      - source_id: UniProtKB:Q8WTS1
        comment: 'Q8WTS1 ABHD5/CGI-58, a human PARALOG (not an ortholog). It has NO annotated active site
          yet a demonstrated CoA-dependent LPA acyltransferase activity, so it is neither the dead fold
          it is usually invoked as nor an ortholog-strength source; ABHD8 by contrast has a full predicted
          triad. For THIS term (GO:0006654) it carries its own experimental evidence: IDA (all codes:
          IBA/IDA).'
