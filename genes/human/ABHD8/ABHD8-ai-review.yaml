      independent literature synthesis over the ABHD8 corpus reaches the same conclusion - no catalytic
      activity and no substrate characterised - so the gap is in the literature, not in this review''s
      reading of it. Kept as over-annotated rather than removed because the structural basis is real:
      a full annotated Ser/Asp/His triad at 252/370/398 and MEROPS S33 membership make enzyme status a
      reasonable hypothesis, just an untested one.'
