    summary: 'Interaction with the SARS-CoV-2 nucleoprotein N (UniProtKB:P0DTC9), split out from the ZDHHC12/NLRP3
      row above because ABHD8''s role is the opposite one. N binds ABHD8 and DISRUPTS the ABHD8-NLRP3
      association, stabilising NLRP3 and driving excessive inflammasome activation. ABHD8 is the target
      of viral antagonism here, not an adaptor bringing an enzyme to a substrate - so the enzyme-substrate
      adaptor term proposed for the host interactions must not be extended to this row, which would invert
      the direction of the relationship.


      Kept as a real, mechanistically meaningful interaction under an uninformative term. It is genuine
      host-pathogen biology from the gene''s defining paper, and it is informative about ABHD8 precisely
      because disrupting the interaction reproduces the ABHD8-null phenotype - but ''protein binding''
      records none of that, and GO has no obvious better term for being the target of a viral antagonist.'
    action: KEEP_AS_NON_CORE
    reason: Real and mechanistically informative host-pathogen interaction, but ABHD8 is the target rather
      than the actor, so it cannot take the adaptor term used for the host interactions; no better term
      is available.
