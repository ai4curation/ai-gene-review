    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:39225180
  qualifier: enables
  review:
    summary: 'Interaction with ZDHHC12 (UniProtKB:Q96GR4) and NLRP3 (UniProtKB:Q96P20) - the two partners
      that constitute this protein''s characterised activity. ABHD8 binds NLRP3 via its NACHT and LRR
      domains, with the interaction enhanced by inflammasome inducers, and recruits the palmitoyltransferase
      ZDHHC12 to it, so that NLRP3 is palmitoylated and degraded by chaperone-mediated autophagy. Bare
      protein binding badly understates this: the interactions ARE the function.


      This entry covers only the ZDHHC12/NLRP3 row. The SARS-CoV-2 nucleoprotein interaction from the
      same publication is a separate GOA row and is reviewed separately below, because ABHD8''s role there
      is opposite - it is the target of the disruption, not the adaptor.'
