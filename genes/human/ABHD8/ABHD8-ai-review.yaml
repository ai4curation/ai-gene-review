- id: file:human/ABHD8/ABHD8-bioinformatics/RESULTS.md
  title: What are ABHD8's IBA source proteins, and does any of them justify a lipid activity?
  findings:
  - statement: 'Resolving all seven distinct WITH/FROM accessions on ABHD8''s five lipid-activity
      IBAs, and querying each one''s own GO evidence: SGD:S000004089 is ICT1_YEAST, whose UniProt
      recommended name is ''1-acylglycerol-3-phosphate O-acyltransferase ICT1'' - a named reviewed
      family member carrying the acyltransferase activity, not a paralog artefact. UniProtKB:Q8WTS1
      is human ABHD5, which has 0 annotated active-site residues against ABHD8''s 3 - so the
      ''ABHD5 is a fold without a function'' analogy does not transfer to ABHD8; equally, ABHD5
      itself has a demonstrated acyltransferase activity, so it is not the pseudoenzyme that
      analogy assumes.'
    supporting_text: SGD:S000004089 resolves to ICT1_YEAST (Q12385, gene ICT1), whose UniProt
      recommended name is "1-acylglycerol-3-phosphate O-acyltransferase ICT1".
  - statement: The five lipid-activity IBA rows have different WITH/FROM sets (GO:0006654 has
      3 sources, GO:0042171 has 4, GO:0004620 and GO:0052689 have 5, GO:0055088 has 2), so a
      propagation_review copied between rows misstates what was inspected.
    supporting_text: '| GO:0042171 | `AGI_LocusCode:AT4G24160`, `PANTHER:PTN008676419`, `SGD:S000004089`,
      `UniProtKB:Q8WTS1` |'
  - statement: 'Six of the seven distinct WITH/FROM sources across ABHD8''s five lipid IBAs
      carry their own experimental evidence for at least one propagated term; only the PANTHER
      node does not. So these IBAs propagate from genuinely characterised enzymes in four organisms,
      which is why every one is MARK_AS_OVER_ANNOTATED rather than REMOVE. Two source identities
      were misdescribed before this was run: MGI:MGI:1915938 is mouse ABHD4, a paralog and NOT
      ABHD8''s ortholog, and SGD:S000003342 is CLD1, a characterised cardiolipin-specific deacylase
      rather than a distant family member.'
    supporting_text: '| `SGD:S000003342` | P53264 (CLD1) — Cardiolipin-specific deacylase 1,
      mitochondrial | Swiss-Prot (reviewed) | Saccharomyces cerevisiae (strain ATCC 204508 /
      S288c) | 0004620=IBA/IDA/IMP; 0006654=IBA; 0042171=IBA; 0052689=IBA/IDA/IMP; 0055088=IBA
      |'
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Source mapping is useful, but donor counts and absent target experiments do
      not negate an IBD. Its assertion of established ABHD5 LPAAT activity is contradicted by
      PMID:24879803; plant CGI-58 activities are also challenged by PMID:26745266. The intact
      target catalytic triad and adaptor role do not establish hydrolase loss.
- id: PMID:27601076
  title: Functional mechanisms underlying pleiotropic risk alleles at the 19p13.1 breast-ovarian
    cancer susceptibility locus.
  findings:
  - statement: 'ABHD8 is a candidate target gene of the 19p13.1 breast/ovarian cancer susceptibility
      locus: risk SNPs physically contact the ABHD8 promoter and risk alleles increase its transactivation.
      This concerns regulation OF ABHD8 expression, not the protein''s molecular function, so
      it supports no GO annotation here - but it explains why the gene is studied and is the
      main reason to expect its function to be pursued.'
    supporting_text: Chromosome conformation capture identifies interactions between four candidate
      SNPs and ABHD8, and luciferase assays indicate six risk alleles increased transactivation
      of the ADHD8 promoter.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached and read. Genuinely about ABHD8, but at the level of cis-regulation
      of its expression rather than its protein activity, so deliberately generates no annotation.
      Quoted verbatim including the abstract's own 'ADHD8' typo for ABHD8.
