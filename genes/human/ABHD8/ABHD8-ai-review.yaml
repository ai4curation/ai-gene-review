- term:
    id: GO:0140767
    label: enzyme-substrate adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:39225180
  qualifier: enables
  review:
    summary: 'Proposed new annotation supplying the molecular function. ABHD8 has none: its IBAs assign
      lipid enzymology that has never been demonstrated for it, and its only characterised activity is
      adaptor-like. It recruits the palmitoyltransferase ZDHHC12 to NLRP3, so that NLRP3 is palmitoylated
      and then degraded by chaperone-mediated autophagy. That is precisely enzyme-substrate adaptor activity
      - bringing an enzyme together with a substrate it would not otherwise efficiently modify.


      The annotation also resolves the gene''s central tension. ABHD8 has an alpha/beta-hydrolase fold
      AND a full predicted Ser/Asp/His charge relay system at 252/370/398, which is why five IBAs assign
      it lipase and acyltransferase activities - a stronger prior than fold alone. But a predicted triad
      is a hypothesis about activity, not a demonstration of one: UniProt records no reaction, no substrate
      has been found, and the single experimental study identified an adaptor role. Note also that the
      usual shortcut here - reasoning by analogy to ABHD5, ''the ABHD fold that is not an enzyme'' - fails
      in both directions. ABHD5 has NO annotated active site whereas ABHD8 has a complete triad, so ABHD8
      is specifically not an ABHD5-type case; and ABHD5 is not really the dead fold it is invoked as,
      since UniProt records a demonstrated CoA-dependent LPA acyltransferase activity for it. The comparison
      settles nothing, and the narrow statement is the defensible one: ABHD8''s triad is intact and untested.'
    action: NEW
    reason: Gives the gene a molecular function matching its one characterised activity, in place of family-inferred
      enzymology with no gene-specific support.
    supported_by:
    - reference_id: file:human/ABHD8/ABHD8-uniprot.txt
      supporting_text: activation and IL1B secretion. Acts by recruiting palmitoyltransferase
    - reference_id: file:human/ABHD8/ABHD8-uniprot.txt
      supporting_text: 'CC   -!- SUBUNIT: Interacts with NLRP3 (via NACHT and LLR domains); this'
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:39225180
  qualifier: enables
  review:
    summary: 'Interaction with the SARS-CoV-2 nucleoprotein N (UniProtKB:P0DTC9), split out from the ZDHHC12/NLRP3
      row above because ABHD8''s role is the opposite one. N binds ABHD8 and DISRUPTS the ABHD8-NLRP3
      association, stabilising NLRP3 and driving excessive inflammasome activation. ABHD8 is the target
      of viral antagonism here, not an adaptor bringing an enzyme to a substrate - so the enzyme-substrate
      adaptor term proposed for the host interactions must not be extended to this row, which would invert
      the direction of the relationship.


      Kept as a real, mechanistically meaningful interaction under an uninformative term. It is genuine
      host-pathogen biology from the gene''s defining paper, and it is informative about ABHD8 precisely
      because disrupting the interaction reproduces the ABHD8-null phenotype - but ''protein binding''
      records none of that, and GO has no obvious better term for being the target of a viral antagonist.'
    action: KEEP_AS_NON_CORE
    reason: Real and mechanistically informative host-pathogen interaction, but ABHD8 is the target rather
      than the actor, so it cannot take the adaptor term used for the host interactions; no better term
      is available.
    supported_by:
    - reference_id: file:human/ABHD8/ABHD8-uniprot.txt
      supporting_text: 'CC   -!- SUBUNIT: (Microbial infection) Interacts with SARS-CoV-2 nucleoprotein'
