core_functions:
- description: Enzyme-substrate adaptor for NLRP3 palmitoylation. ABHD8 binds NLRP3 via its NACHT and
    LRR domains and recruits the palmitoyltransferase ZDHHC12 to it; the resulting palmitoylation targets
    NLRP3 for chaperone-mediated autophagy, lowering NLRP3 protein levels and damping inflammasome activation
    and IL-1beta secretion. Despite an alpha/beta-hydrolase fold, no catalytic activity of ABHD8 itself
    has been demonstrated - the protein works by bringing an enzyme and its substrate together.
  molecular_function:
    id: GO:0140767
    label: enzyme-substrate adaptor activity
  directly_involved_in:
  - id: GO:1900226
    label: negative regulation of NLRP3 inflammasome complex assembly
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: file:human/ABHD8/ABHD8-uniprot.txt
    supporting_text: activation and IL1B secretion. Acts by recruiting palmitoyltransferase
  - reference_id: PMID:39225180
    supporting_text: "ABHD8 deficiency results in the \nstabilization of NLRP3 protein and promotes NLRP3\
      \ inflammasome activation."
suggested_questions:
- question: Does ABHD8 have any catalytic activity at all? It carries an alpha/beta-hydrolase fold and
    a generic EC 3.-.-.-, and five IBAs assign it lipase and acyltransferase activities, but no substrate
    or reaction has ever been reported and its one characterised activity is adaptor-like. Testing the
    purified protein against a broad lipid-substrate panel, and checking whether the catalytic triad is
    intact, would settle whether the family inferences deserve to stand.
- question: Should the lysophosphatidic acid acyltransferase IBA be re-examined at the PANTHER node? Its
    WITH/FROM includes ABHD5, a human paralog whose acyltransferase activity is genuine for itself, and
    the same node also supplies hydrolase activities to ABHD8 - an acyltransferase and a hydrolase assignment
    sitting side by side with no evidence for either in this protein.
- question: Is the NLRP3 effect on assembly or on abundance? The demonstrated mechanism is degradation
    of the NLRP3 sensor through chaperone-mediated autophagy, so the reduction in inflammasome assembly
    is a consequence of lower NLRP3 levels. GO:1900226 captures the outcome but not the mechanism, and
    no term for regulation of NLRP3 protein stability exists.
- question: How general is the SARS-CoV-2 antagonism? The nucleocapsid protein disrupting the ABHD8-NLRP3
    association is a striking result; whether other pathogens target the same adaptor step would indicate
    how important this brake is to host defence.
suggested_experiments:
- hypothesis: ABHD8 is catalytically inactive and functions solely as an adaptor.
  description: Determine whether ABHD8's alpha/beta-hydrolase catalytic triad is intact, then test purified
    protein against broad ester, thioester and lipid substrate panels by activity-based protein profiling.
    In parallel, ask whether a putative catalytic-serine mutant still supports NLRP3 palmitoylation and
    degradation - if it does, the adaptor role is separable from any enzymology.
  experiment_type: enzymology and structure-function
- hypothesis: ABHD8 acts by increasing the local concentration of ZDHHC12 at NLRP3 rather than by allosteric
    activation.
  description: Compare NLRP3 palmitoylation kinetics with wild-type ABHD8 against a forced ZDHHC12-NLRP3
    fusion that bypasses the adaptor, and against ABHD8 variants that bind one partner but not the other,
    to distinguish proximity from activation.
  experiment_type: biochemistry
- hypothesis: The ABHD8-NLRP3 brake is a general target of viral antagonism.
  description: Screen nucleocapsid and accessory proteins from a panel of RNA viruses for disruption of
    the ABHD8-NLRP3 interaction, and correlate disruption with NLRP3 stabilisation and IL-1beta output
    in macrophages.
  experiment_type: virology
