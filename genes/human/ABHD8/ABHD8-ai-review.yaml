- term:
    id: GO:0004620
    label: glycerophospholipase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: 'Glycerophospholipase activity by phylogenetic inference - the SPECIFIC of the two hydrolase
      rows, and therefore the one that actually makes a claim. It names a substrate class for an enzyme
      with no reported substrate.


      Resolving this row''s five WITH/FROM sources changes how strong the inference looks, and it is stronger
      than an earlier reading of this record allowed. Four of the five are proteins (the fifth is the
      PANTHER node) and ALL FOUR carry their own experimental evidence for this term - queried per source
      via QuickGO over the term and its is_a/part_of descendants - across four organisms: Arabidopsis
      O22975 LPAAT (IDA), Drosophila puml, mouse Q8VD66 ABHD4 (IDA), and yeast P53264 CLD1, a characterised
      mitochondrial cardiolipin-specific deacylase (IDA and IMP). This is not a family-level guess propagated
      from nothing.


      But EVIDENCE provenance and NAME provenance are separate questions, and only three of the four are
      settled on both. The Drosophila entry has no reviewed UniProt record, and its FlyBase id maps to
      FOUR UniProt entries (per x-total-results, not inferred from a capped query), unreviewed and carrying
      different names - Q5U191 ''1-acylglycerol-3-phosphate O-acyltransferase ABHD5'' and A1Z753 ''Pummelig,
      isoform A''. Its curated GO annotations are real, but its protein NAME is an automatic by-similarity
      label and must not be read as a characterisation. So the count of independently CHARACTERISED sources
      is three (Arabidopsis, mouse, yeast), not four.


      The mouse entry is ABHD4, a PARALOG - not ABHD8''s ortholog - which is legitimate for IBA, since
      WITH/FROM lists experimentally-annotated members rather than orthologs, but it means no ortholog-strength
      inference is available anywhere on this row. That is also why failure_modes records WRONG_ORTHOLOG_OR_PARALOG:
      both non-plant animal sources (mouse ABHD4, human ABHD5) are confirmed paralogs by lookup rather
      than orthologs.


      What the fold evidence amounts to on ABHD8 itself: UniProt annotates a full Ser/Asp/His charge relay
      system at 252, 370 and 398, and assigns MEROPS S33 and ESTHER membership - a materially stronger
      prior than ''the fold is real'', since a pseudoenzyme does not usually retain an intact triad. But
      those residues are ECO:0000250, i.e. themselves transferred by similarity; UniProt records no reaction
      and assigns only EC 3.-.-.-; no substrate has ever been reported; and the gene''s one experimental
      study found an adaptor role.


      MARK_AS_OVER_ANNOTATED rather than REMOVE: with three independently characterised phospholipase/acyltransferase
      sources plus a fourth carrying curated experimental annotations under an automatic name, the inference
      is well founded for the family and merely undemonstrated for this member. REMOVE would require a
      positive argument that ABHD8 is not an enzyme, and its intact triad is evidence against that.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Well-founded at the family level and undemonstrated for this gene. All four protein sources
      in WITH/FROM carry their own experimental evidence for this term (IDA/IMP across Arabidopsis, Drosophila,
      mouse and yeast), so the SOURCES are not the problem - which is why root_cause is PROPAGATION_BAD
      rather than any SOURCE_* value; the absence of any ABHD8-specific reaction, substrate or assay is.
      Over-annotated rather than removed - the intact catalytic triad argues against a positive claim
      that ABHD8 is a pseudoenzyme, and the one mouse source is a paralog (ABHD4), so no ortholog-strength
      inference exists either way.
