- id: file:human/ABHD8/ABHD8-bioinformatics/RESULTS.md
  title: What are ABHD8's IBA source proteins, and does any of them justify a lipid activity?
  findings:
  - statement: 'Resolving all seven distinct WITH/FROM accessions on ABHD8''s five lipid-activity IBAs,
      and querying each one''s own GO evidence: SGD:S000004089 is ICT1_YEAST, whose UniProt recommended
      name is ''1-acylglycerol-3-phosphate O-acyltransferase ICT1'' - a named reviewed family member carrying
      the acyltransferase activity, not a paralog artefact. UniProtKB:Q8WTS1 is human ABHD5, which has
      0 annotated active-site residues against ABHD8''s 3 - so the ''ABHD5 is a fold without a function''
      analogy does not transfer to ABHD8; equally, ABHD5 itself has a demonstrated acyltransferase activity,
      so it is not the pseudoenzyme that analogy assumes.'
    supporting_text: SGD:S000004089 resolves to ICT1_YEAST (Q12385, gene ICT1), whose UniProt recommended
      name is "1-acylglycerol-3-phosphate O-acyltransferase ICT1".
  - statement: The five lipid-activity IBA rows have different WITH/FROM sets (GO:0006654 has 3 sources,
      GO:0042171 has 4, GO:0004620 and GO:0052689 have 5, GO:0055088 has 2), so a propagation_review copied
      between rows misstates what was inspected.
    supporting_text: '| GO:0042171 | `AGI_LocusCode:AT4G24160`, `PANTHER:PTN008676419`, `SGD:S000004089`,
      `UniProtKB:Q8WTS1` |'
  - statement: 'Six of the seven distinct WITH/FROM sources across ABHD8''s five lipid IBAs carry their
      own experimental evidence for at least one propagated term; only the PANTHER node does not. So these
      IBAs propagate from genuinely characterised enzymes in four organisms, which is why every one is
      MARK_AS_OVER_ANNOTATED rather than REMOVE. Two source identities were misdescribed before this was
      run: MGI:MGI:1915938 is mouse ABHD4, a paralog and NOT ABHD8''s ortholog, and SGD:S000003342 is
      CLD1, a characterised cardiolipin-specific deacylase rather than a distant family member.'
    supporting_text: '| `SGD:S000003342` | P53264 (CLD1) — Cardiolipin-specific deacylase 1, mitochondrial
      | Swiss-Prot (reviewed) | Saccharomyces cerevisiae (strain ATCC 204508 / S288c) | 0004620=IBA/IDA/IMP;
      0006654=IBA; 0042171=IBA; 0052689=IBA/IDA/IMP; 0055088=IBA |'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible lookup written for this review so the ICT1 identification - which is what
      downgraded two REMOVE actions to MARK_AS_OVER_ANNOTATED - can be checked from the repository rather
      than taken on trust. All data fetched from the UniProt REST API at run time.
- id: PMID:27601076
  title: Functional mechanisms underlying pleiotropic risk alleles at the 19p13.1 breast-ovarian cancer
    susceptibility locus.
  findings:
  - statement: 'ABHD8 is a candidate target gene of the 19p13.1 breast/ovarian cancer susceptibility locus:
      risk SNPs physically contact the ABHD8 promoter and risk alleles increase its transactivation. This
      concerns regulation OF ABHD8 expression, not the protein''s molecular function, so it supports no
      GO annotation here - but it explains why the gene is studied and is the main reason to expect its
      function to be pursued.'
    supporting_text: Chromosome conformation capture identifies interactions between four candidate SNPs
      and ABHD8, and luciferase assays indicate six risk alleles increased transactivation of the ADHD8
      promoter.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached and read. Genuinely about ABHD8, but at the level of cis-regulation
      of its expression rather than its protein activity, so deliberately generates no annotation. Quoted
      verbatim including the abstract's own 'ADHD8' typo for ABHD8.
core_functions:
- description: Enzyme-substrate adaptor for NLRP3 palmitoylation. ABHD8 binds NLRP3 via its NACHT and
    LRR domains and recruits the palmitoyltransferase ZDHHC12 to it; the resulting palmitoylation targets
    NLRP3 for chaperone-mediated autophagy, lowering NLRP3 protein levels and damping inflammasome activation
    and IL-1beta secretion. ABHD8 has an alpha/beta-hydrolase fold and a full predicted Ser/Asp/His charge
    relay system, but no catalytic activity of its own has been demonstrated and UniProt records no reaction;
    the characterised function is bringing an enzyme and its substrate together.
  molecular_function:
    id: GO:0140767
    label: enzyme-substrate adaptor activity
  directly_involved_in:
  - id: GO:1900226
    label: negative regulation of NLRP3 inflammasome complex assembly
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: file:human/ABHD8/ABHD8-uniprot.txt
    supporting_text: activation and IL1B secretion. Acts by recruiting palmitoyltransferase
  - reference_id: PMID:39225180
    supporting_text: "ABHD8 deficiency results in the \nstabilization of NLRP3 protein and promotes NLRP3\
      \ inflammasome activation."
suggested_questions:
- question: 'Is ABHD8''s predicted catalytic triad competent on any substrate? UniProt annotates a full
    Ser/Asp/His charge relay at residues 252, 370 and 398 and places the protein in MEROPS S33 and ESTHER,
    so this is not a fold-only prior - but the residues are ECO:0000250, UniProt records no reaction,
    and no substrate has been reported. Note the contrast with ABHD5, often cited as the alpha/beta-hydrolase-fold
    protein that is not a hydrolase: ABHD5 has NO annotated active site, whereas ABHD8 has a complete
    one, so ABHD8 is not an ABHD5-type pseudoenzyme and the analogy does not transfer.'
- question: Are the acyltransferase inferences worth retaining? Their WITH/FROM includes yeast ICT1 (SGD:S000004089),
    a genuine 1-acylglycerol-3-phosphate O-acyltransferase, as well as the human paralog ABHD5 - so the
    activity is present in more than one family member and this is not simply a paralog artefact. It remains
    untested in ABHD8, and sits oddly beside the hydrolase activities inferred from the same node.
- question: Is the NLRP3 effect on assembly or on abundance? The demonstrated mechanism is degradation
    of the sensor via chaperone-mediated autophagy, so reduced inflammasome assembly is a consequence
    of lower NLRP3 levels. GO:1900226 captures the outcome but not the mechanism, and no term for regulation
    of NLRP3 protein stability exists.
- question: How general is the viral antagonism? SARS-CoV-2 nucleoprotein disrupting the ABHD8-NLRP3 association
    is striking; whether other pathogens target the same adaptor step would show how important this brake
    is to host defence. Note GO also has no good way to record a protein being the target of a viral antagonist,
    which is why that row keeps a bare binding term.
suggested_experiments:
- hypothesis: ABHD8's predicted catalytic triad is competent on some substrate, or the protein is a genuine
    pseudoenzyme.
  description: Assay purified ABHD8 by activity-based protein profiling with serine-hydrolase-directed
    probes, which report triad reactivity independently of knowing the substrate, then follow with broad
    ester, thioester and lipid panels. In parallel test whether an active-site serine mutant still supports
    NLRP3 palmitoylation and degradation - if it does, the adaptor role is formally separable from any
    enzymology. Note this is better posed than asking whether the triad is intact, which UniProt already
    answers by similarity.
  experiment_type: enzymology and structure-function
- hypothesis: ABHD8 acts by increasing the local concentration of ZDHHC12 at NLRP3 rather than by allosteric
    activation.
  description: Compare NLRP3 palmitoylation kinetics with wild-type ABHD8 against a forced ZDHHC12-NLRP3
    fusion that bypasses the adaptor, and against ABHD8 variants that bind one partner but not the other,
    to distinguish proximity from activation.
  experiment_type: biochemistry
- hypothesis: The ABHD8-NLRP3 brake is a general target of viral antagonism.
  description: Screen nucleocapsid and accessory proteins from a panel of RNA viruses for disruption of
    the ABHD8-NLRP3 interaction, and correlate disruption with NLRP3 stabilisation and IL-1beta output
    in macrophages.
  experiment_type: virology
