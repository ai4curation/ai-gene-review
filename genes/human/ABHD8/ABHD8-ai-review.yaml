- term:
    id: GO:0004620
    label: glycerophospholipase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: 'Family-level phylogenetic inference of a lipid-hydrolase activity, from PANTHER node PTN008676419
      with Arabidopsis, Drosophila, mouse and yeast sources.


      What the fold evidence actually amounts to, stated rather than glossed: UniProt annotates a full
      Ser/Asp/His charge relay system at residues 252, 370 and 398, and assigns ABHD8 to MEROPS family
      S33 and to the ESTHER database of alpha/beta-hydrolase-fold enzymes. That is a materially stronger
      prior than ''the fold is real'' - a conserved catalytic triad is not something a pseudoenzyme usually
      retains intact.


      It is nonetheless not a demonstration. The active-site residues are ECO:0000250, i.e. themselves
      transferred by similarity; UniProt assigns only a generic EC 3.-.-.- with no reaction and no CATALYTIC
      ACTIVITY block; no substrate has been reported; and the one experimental study of the protein found
      an adaptor function. So the annotation is marked over-annotated rather than removed - the prior
      is respectable and a substrate may yet be found, but a predicted triad is a hypothesis about activity,
      not evidence of one.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Predicted rather than demonstrated. The catalytic triad, MEROPS S33 and ESTHER assignments
      give a real prior, but the residues are ECO:0000250, UniProt records no reaction, no substrate has
      been found, and the gene's one experimental study identified an adaptor role instead.
    supported_by:
    - reference_id: file:human/ABHD8/ABHD8-uniprot.txt
      supporting_text: FT   ACT_SITE        252
    - reference_id: file:human/ABHD8/ABHD8-uniprot.txt
      supporting_text: DR   MEROPS; S33.011; -.
    - reference_id: file:human/ABHD8/ABHD8-uniprot.txt
      supporting_text: DE            EC=3.-.-.-;
    - reference_id: file:human/ABHD8/ABHD8-uniprot.txt
      supporting_text: 'CC   -!- FUNCTION: Negatively regulates NLRP3-driven inflammation'
