    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: 'Catalytic activity, the root of the catalytic branch, from InterPro. Uninformative in itself,
      but note it is better founded than a bare root term usually is: UniProt annotates a full charge
      relay system and MEROPS S33 membership. What it still lacks is any reaction - EC 3.-.-.- with no
      CATALYTIC ACTIVITY block - so it asserts enzyme status without saying of what.'
