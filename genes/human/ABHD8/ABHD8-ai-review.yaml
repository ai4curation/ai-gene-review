    label: negative regulation of NLRP3 inflammasome complex assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  review:
    summary: Negative regulation of NLRP3 inflammasome complex assembly - the gene's core process and
      its best-supported annotation. ABHD8 promotes NLRP3 degradation through chaperone-mediated autophagy
      by recruiting the palmitoyltransferase ZDHHC12 to NLRP3, and ABHD8 deficiency stabilises NLRP3 protein
      and promotes inflammasome activation. Overexpression ameliorates LPS- and alum-triggered activation
      in vivo. Note the mechanism is degradation of the sensor rather than interference with assembly
      per se, so a term about NLRP3 protein stability would arguably fit better; GO offers none, and the
      downstream effect on assembly is real.
    action: ACCEPT
    supported_by:
    - reference_id: file:human/ABHD8/ABHD8-uniprot.txt
      supporting_text: activation and IL1B secretion. Acts by recruiting palmitoyltransferase
    - reference_id: PMID:39225180
      supporting_text: "ABHD8 deficiency results in the \nstabilization of NLRP3 protein and promotes\
        \ NLRP3 inflammasome activation."
