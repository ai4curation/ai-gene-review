- term:
    id: GO:0006654
    label: phosphatidic acid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Acyltransferase-branch inference. Resolving all of this row''s WITH/FROM sources changes
      the picture from a first reading, and softens the action.


      UniProtKB:Q8WTS1 is ABHD5/CGI-58, a human PARALOG whose CoA-dependent LPA acyltransferase activity
      is genuine for itself - a sideways transfer. But SGD:S000004089 is yeast ICT1, which is also a real
      1-acylglycerol-3-phosphate O-acyltransferase and is a family member rather than a paralog artefact.
      So the acyltransferase activity is not attached to this node solely through one human paralog; it
      is present in at least two members, in different organisms.


      That makes the inference weak rather than wrong. It remains unsupported for ABHD8 specifically -
      no acyltransferase assay, no acyl donor or acceptor, no CATALYTIC ACTIVITY block - and it sits awkwardly
      beside the hydrolase activities inferred from the same node. Marked over-annotated rather than removed.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Inferred from family members that genuinely have the activity (yeast ICT1, and the human paralog
      ABHD5), but never demonstrated for ABHD8, which has no acyltransferase assay and whose one experimental
      study found an adaptor role. Downgraded from an earlier REMOVE after resolving SGD:S000004089 as
      ICT1, a genuine family LPA acyltransferase rather than a paralog artefact.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: SGD:S000004089
        comment: Yeast ICT1, a genuine 1-acylglycerol-3-phosphate O-acyltransferase. A real family member
          with the activity, which is why this is not simply a paralog transfer.
      - source_id: UniProtKB:Q8WTS1
        comment: ABHD5/CGI-58, a human paralog, not an ortholog. Its LPA acyltransferase activity is genuine
          for itself. Note it has NO annotated active site, whereas ABHD8 has a full predicted triad -
          so ABHD8 is not an ABHD5-like pseudoenzyme.
      - source_id: PANTHER:PTN008676419
        comment: Family node, which also supplies hydrolase activities to this gene; an acyltransferase
          and a hydrolase assignment sit awkwardly together with no evidence for either in ABHD8.
