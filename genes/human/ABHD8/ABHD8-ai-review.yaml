id: Q96I13
gene_symbol: ABHD8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ABHD8 is a cytoplasmic alpha/beta-hydrolase-fold protein. It retains a full predicted Ser/Asp/His
  charge relay system and is placed in MEROPS family S33, but no catalytic activity has been demonstrated:
  UniProt assigns only a generic hydrolase EC number and records no reaction or substrate. Its characterised
  function is instead adaptor-like: ABHD8 binds NLRP3 through the sensor''s NACHT and LRR domains, an
  interaction strengthened by inflammasome inducers such as ATP, nigericin, silica and alum, and recruits
  the palmitoyltransferase ZDHHC12 to it. The resulting palmitoylation routes NLRP3 into chaperone-mediated
  autophagy, so the sensor is degraded and inflammasome activation and IL-1beta secretion are damped.
  Loss of ABHD8 stabilises NLRP3 and promotes inflammasome activation, while overexpression attenuates
  LPS- and alum-triggered activation in vivo. The axis is a target of viral antagonism: the SARS-CoV-2
  nucleocapsid protein disrupts the ABHD8-NLRP3 association, stabilising NLRP3 and driving excessive inflammasome
  activation.'
