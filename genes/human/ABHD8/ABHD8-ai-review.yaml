- term:
    id: GO:0140767
    label: enzyme-substrate adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:39225180
  qualifier: enables
  review:
    summary: 'Proposed new annotation supplying the molecular function. ABHD8 has none: its IBAs assign
      lipid enzymology that has never been demonstrated for it, and its only characterised activity is
      adaptor-like. It recruits the palmitoyltransferase ZDHHC12 to NLRP3, so that NLRP3 is palmitoylated
      and then degraded by chaperone-mediated autophagy. That is precisely enzyme-substrate adaptor activity
      - bringing an enzyme together with a substrate it would not otherwise efficiently modify.


      The annotation also resolves the gene''s central tension. ABHD8 has an alpha/beta-hydrolase fold
      and a generic EC 3.-.-.-, which is why five IBAs assign it lipase and acyltransferase activities;
      but fold does not imply function, and the one paralog cited as a source for those IBAs, ABHD5, is
      itself the textbook example of an alpha/beta-hydrolase-fold protein that acts as an activator rather
      than an enzyme.'
    action: NEW
    reason: Gives the gene a molecular function matching its one characterised activity, in place of family-inferred
      enzymology with no gene-specific support.
