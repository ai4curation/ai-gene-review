  - statement: BAP18 coactivates ERalpha via COMPASS-like recruitment.
    supporting_text: Also, we provide the evidence to demonstrate that BAP18 as a novel co-activator of
      ERα is required for the recruitment of COMPASS-like core subunits to the cis-regulatory element
      of ERα target genes in breast cancer cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; human breast cancer cells. It states, citing earlier work, that BAP18 is
      an H3K4me3 reader.
