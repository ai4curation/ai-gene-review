- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IMP
  original_reference_id: PMID:27226492
  qualifier: enables
  review:
    summary: Transcription coactivator activity (NEW, IMP). BAP18 coactivates AR by recruiting the MLL1
      subcomplex and AR to androgen-response elements, and it coactivates ERalpha by recruiting COMPASS-like
      core subunits to ERalpha-responsive elements. New specific child term.
    action: NEW
    reason: BAP18 has direct activating coregulator evidence in androgen- and estrogen-receptor contexts;
      GO captures this sign-specific activity as the child term transcription coactivator activity rather
      than the redundant parent transcription coregulator activity.
    supported_by:
    - reference_id: PMID:27226492
      supporting_text: Here, we demonstrate that BAP18 is identified as a coactivator of AR in Drosophilar
        experimental system and mammalian cells.
    - reference_id: PMID:27226492
      supporting_text: BAP18 facilitates the recruitment of MLL1 subcomplex and AR to androgen-response
        element (ARE) of AR target genes, subsequently increasing histone H3K4 trimethylation and H4K16
        acetylation.
    - reference_id: PMID:32986841
      supporting_text: Also, we provide the evidence to demonstrate that BAP18 as a novel co-activator
        of ERα is required for the recruitment of COMPASS-like core subunits to the cis-regulatory element
        of ERα target genes in breast cancer cells.
- term:
    id: GO:0003714
    label: transcription corepressor activity
  evidence_type: IMP
  original_reference_id: PMID:41163225
  qualifier: enables
  review:
    summary: Transcription corepressor activity (NEW, IMP). In AR-positive TNBC cells, BAP18 acts as an
      AR corepressor with SIN3A/HDAC and reduces histone H4 acetylation at P21 and PTEN. New specific
      child term.
    action: NEW
    reason: The TNBC study shows the opposite sign from BAP18's AR and ERalpha coactivator contexts,
      so this is represented as an additional corepressor activity rather than collapsed into the generic
      GO:0003712 parent.
    supported_by:
    - reference_id: PMID:41163225
      supporting_text: BAP18 was shown to act as a transcriptional corepressor of AR in AR-positive TNBC
        cells and is involved in the promotion of AR-positive TNBC.
