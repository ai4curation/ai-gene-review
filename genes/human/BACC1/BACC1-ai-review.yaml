- term:
    id: GO:0003712
    label: transcription coregulator activity
  evidence_type: IMP
  original_reference_id: PMID:27226492
  qualifier: enables
  review:
    summary: Transcription coregulator activity (NEW, IMP). In prostate cancer cells, BAP18 coactivates
      AR by recruiting the MLL1 subcomplex and AR to androgen-response elements, increasing H3K4me3 and
      H4K16ac. In breast cancer cells it coactivates ERalpha by recruiting COMPASS-like core subunits.
      In AR-positive TNBC it instead acts as an AR corepressor with SIN3A/HDAC. Because the direction
      depends on context, the parent coregulator term is used rather than coactivator or corepressor.
      BAP18 bridges receptors to chromatin-modifying complexes, so it does the coregulator work itself.
    action: NEW
    reason: '[PMID:27226492 "Here, we demonstrate that BAP18 is identified as a coactivator of AR in Drosophilar
      experimental system and mammalian cells."] [PMID:27226492 "BAP18 facilitates the recruitment of
      MLL1 subcomplex and AR to androgen-response element (ARE) of AR target genes, subsequently increasing
      histone H3K4 trimethylation and H4K16 acetylation."] [PMID:32986841 "Also, we provide the evidence
      to demonstrate that BAP18 as a novel co-activator of ERα is required for the recruitment of COMPASS-like
      core subunits to the cis-regulatory element of ERα target genes in breast cancer cells."] [PMID:41163225
      "BAP18 was shown to act as a transcriptional corepressor of AR in AR-positive TNBC cells and is
      involved in the promotion of AR-positive TNBC."]'
    supported_by:
    - reference_id: PMID:27226492
      supporting_text: Here, we demonstrate that BAP18 is identified as a coactivator of AR in Drosophilar
        experimental system and mammalian cells.
    - reference_id: PMID:27226492
      supporting_text: BAP18 facilitates the recruitment of MLL1 subcomplex and AR to androgen-response
        element (ARE) of AR target genes, subsequently increasing histone H3K4 trimethylation and H4K16
        acetylation.
    - reference_id: PMID:32986841
      supporting_text: Also, we provide the evidence to demonstrate that BAP18 as a novel co-activator
        of ERα is required for the recruitment of COMPASS-like core subunits to the cis-regulatory element
        of ERα target genes in breast cancer cells.
    - reference_id: PMID:41163225
      supporting_text: BAP18 was shown to act as a transcriptional corepressor of AR in AR-positive TNBC
        cells and is involved in the promotion of AR-positive TNBC.
