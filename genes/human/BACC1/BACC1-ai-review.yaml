id: Q8IXM2
gene_symbol: BACC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BACC1 (BAP18; BPTF-associated chromatin complex component 1) is a small nuclear chromatin-complex
  subunit. It belongs to the NURF nucleosome-remodeling complex and is a facultative component of MLL1/COMPASS-like
  H3K4 methyltransferase complexes. It is reported to read H3K4me3. As a context-dependent transcription
  coregulator, it recruits MLL1/COMPASS-like subunits and the receptor to androgen- and estrogen-responsive
  elements to coactivate AR and ERalpha, but acts as an AR corepressor with SIN3A/HDAC in AR-positive
  triple-negative breast cancer cells.
