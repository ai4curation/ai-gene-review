suggested_questions:
- question: Is BAP18 a direct H3K4me3 reader (and through which domain), and does reader activity determine
    whether it coactivates or corepresses AR?
suggested_experiments:
- description: Measure direct BAP18 binding to H3K4me3 peptides and nucleosomes by ITC, and map BAP18
    occupancy with reader-dead mutants in AR-positive prostate versus TNBC cells.
