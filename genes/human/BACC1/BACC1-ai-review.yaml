    review_notes: Full text; human prostate cancer cells and Drosophila. The erratum (Nucleic Acids Res
      2022;50:597) replaces a duplicated alpha-MLL1 immunoblot panel in Fig. 5B (publisher correction
      notice, read 2026-10-05); the conclusions are unchanged.
