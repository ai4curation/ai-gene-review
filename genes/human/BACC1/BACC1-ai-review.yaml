proposed_new_terms: []
suggested_questions:
- question: Does the BACC1 SANT domain directly read H3K4me3, does isoform Q8IXM2-2 lacking residues
    40-73 disrupt that activity, and does reader activity determine whether BAP18 coactivates or corepresses
    AR?
- question: Should BAP18's repeated recruitment of transcription factors to MLL1/COMPASS-like, NuA4/TIP60
    and ACTL6A/PAF1 complexes be captured as GO:0060090 molecular adaptor activity?
- question: Should BACC1 receive GO:0006357 regulation of transcription by RNA polymerase II, or is the
    MF-plus-complex representation more appropriate?
suggested_experiments:
- description: Measure direct BAP18 binding to H3K4me3 peptides and nucleosomes by ITC, and map BAP18
    occupancy with SANT-domain mutants or SANT-deleted isoform Q8IXM2-2 in AR-positive prostate versus
    TNBC cells.
