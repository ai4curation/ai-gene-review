  review:
    summary: The source distinguishes the RU2AS antigen from the sense RU2S/DCDC2 product and does not
      demonstrate a DCDC2 defense effector function.
    action: REMOVE
    reason: The original full Results in PMID:10601354 identify cDNA4.1 as an antisense RU2AS message
      encoding an 84-amino-acid antigenic product, while sense cDNAI.1 is the longer RU2S/DCDC2 transcript.
      The HLA-B7-restricted LPRWPPPQL epitope sensitizes target cells to CTL lysis. This is positive evidence
      about a distinct antisense product, not an immune effector activity of the 476- or 229-residue DCDC2
