  - UniProtKB:F1LQZ3
  review:
    summary: DCDC2 associates with the kinesin-2 subunit KIF3A.
    action: MODIFY
    reason: 'PMID:21698230 Figure 3 and its co-immunoprecipitation Methods establish endogenous rat Dcdc2–Kif3a
      association in rat hippocampal neurons, with proximity-ligation signals at cilia and in the cytoplasm.
      F1LQZ3 is rat Kif3a; its verified kinesin family classification and the original experiment support
      the more informative kinesin-binding class. The human assertion is retained with curator deference
      and explicit rat assay scope: the SH-SY5Y lane is an input sample, not an independent human interaction
      experiment. This is co-complex/proximity evidence, not a purified binary binding measurement, and
      does not assign motor activity or autonomous intraflagellar transport to DCDC2. The replacement
      is already represented by the separate ortholog-derived kinesin-binding row 50; it refines this
      source assertion rather than adding a NEW activity.'
    proposed_replacement_terms:
    - id: GO:0019894
      label: kinesin binding
