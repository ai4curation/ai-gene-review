suggested_questions:
- question: Does the 229-residue alternative product have a distinct cellular activity despite lacking
    both annotated doublecortin domains?
- question: Which molecular interaction couples DCDC2 to suppression of canonical Wnt output, given that
    disease-associated proteins can retain DVL association while losing suppression?
suggested_experiments:
- hypothesis: The long and short DCDC2 products differ in their ciliary or signaling activities.
  description: Compare isoform-specific depletion and matched-expression rescue in human renal epithelial
    cells or cholangiocytes, measuring localization, microtubule association, cilium number and length,
    and canonical Wnt reporter output. Confirm product expression and stability before interpreting failed
    rescue.
  experiment_type: Isoform-resolved functional complementation
- hypothesis: DVL association alone is insufficient for DCDC2-dependent Wnt suppression.
  description: Use separation-of-function constructs with verified expression and folding to compare DVL
    association, microtubule association, Wnt suppression and ciliary rescue, testing whether these activities
    can be uncoupled.
  experiment_type: Interaction and functional separation analysis
