- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25557784
  qualifier: enables
  supporting_entities:
  - UniProtKB:O14640
  review:
    summary: DCDC2 associates with the Dishevelled signaling scaffold DVL1.
    action: MODIFY
    reason: 'PMID:25557784 reports co-immunoprecipitation of human full-length DCDC2 with human DVL1 (O14640)
      in NIH 3T3 cells. Curated UniProt FUNCTION/SUBUNIT descriptions, DSH family classification, and
      multivalent DIX/PDZ/DEP organization support the partner scaffold class; the class judgment uses
      the documented signaling interactions and complex organization, not a GO label or an unvetted ARBA
      annotation. GO:0097110 describes binding to a scaffold protein, not scaffold activity performed
      by DCDC2. Refine the positive association to that class while retaining the co-IP limitation: a
      purified direct interface and the native complex stoichiometry were not established. Disease-associated
      DCDC2 constructs can retain DVL association despite losing Wnt suppression, so this binding alone
      is not proof that DCDC2 assembles an active signaling complex or that DVL binding is sufficient
      for its regulatory effect.'
    proposed_replacement_terms:
    - id: GO:0097110
      label: scaffold protein binding
