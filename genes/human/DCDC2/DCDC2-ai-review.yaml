- term:
    id: GO:0008017
    label: microtubule binding
  evidence_type: IDA
  original_reference_id: PMID:21698230
  qualifier: enables
  review:
    summary: Expressed human DCDC2 co-pellets with polymerized microtubules in a controlled binding assay.
    action: NEW
    reason: Figure S1 of PMID:21698230 incubates polymerized microtubules with NIH/3T3 cell lysates expressing
      human full-length DCDC2-V5 or engineered doublecortin-domain deletion constructs. DCDC2 co-pellets
      with microtubules but remains unpelleted in microtubule-omission controls; LacZ-V5 stays in the
      supernatant and an anti-tubulin blot confirms microtubule pelleting. This is evidence for microtubule
      binding beyond colocalization, but lysate co-pelleting does not establish a purified binary contact,
      binding kinetics or microtubule stabilization. It does not establish activity of the natural short
      product. No existing source row or proposed replacement records this microtubule-binding assay;
      the generic protein-binding rows concern distinct protein partners. The user ancestry restriction
      is stated for NEW process terms, so it does not preclude this independently supported missing molecular
      function. The addition records the same directly supported activity used in the core synthesis without
      repurposing another assay.
    supported_by:
    - reference_id: PMID:21698230
      supporting_text: DCDC2-V5 (A and B), DCDC2-Del1-V5 (A) and DCDC2-Del2-V5 (A) all pelleted with microtubules,
        but not in control samples without microtubules.
