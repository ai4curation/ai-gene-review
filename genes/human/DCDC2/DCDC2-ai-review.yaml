  - PANTHER:PTN002744418
  - RGD:1310227
  review:
    summary: PAINT supports an inherited developmental contribution to neuronal migration, with context-dependent
      rodent evidence.
    action: KEEP_AS_NON_CORE
    reason: The current PTHR23004 tree places human DCDC2 PTN002506770 below the actual IBD node PTN002744418.
      The IBD sources are rat RGD:1310227 and mouse MGI:2652818; the mouse source is IGI from PMID:21689730,
      not an isolated Dcdc2-knockout phenotype. The rat Dcdc2 record D3ZR10 has experimental neuron-migration
      annotations to PMID:16278297 and PMID:18313856. These report embryonic shRNA perturbation and a
      partial rescue of heterotopia, not a direct assay of human neuronal migration. PMID:21689730 shows
      that mouse Dcdc2 deletion alone leaves constitutive and conditional migration assays grossly normal,
      while Dcx RNAi produces greater migration defects in the Dcdc2-mutant background. Preserve a context-dependent
      developmental association, without describing DCDC2 as universally essential for neuronal migration
      or making dyslexia a Mendelian consequence.
    additional_reference_ids:
    - PMID:16278297
    - PMID:18313856
    - PMID:21689730
