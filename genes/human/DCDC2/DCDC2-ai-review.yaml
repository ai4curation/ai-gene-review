id: Q9UHG0
gene_symbol: DCDC2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DCDC2 is a microtubule-associated protein whose long isoform contains tandem doublecortin
  domains. It binds microtubules, associates with the kinesin-2 machinery and localizes along ciliary
  axonemes. DCDC2 supports epithelial cilium assembly and controls ciliary growth in sensory-cell contexts.
  It restrains canonical Wnt/beta-catenin signaling and associates with Dishevelled proteins, although
  the molecular link between those interactions and Wnt inhibition remains unresolved. Biallelic variants
  are associated with renal-hepatic ciliopathy and neonatal sclerosing cholangitis. The shorter annotated
  product lacks both doublecortin domains, and its equivalent ciliary or Wnt-regulatory activity has not
  been established.
alternative_products:
- name: '1'
  id: Q9UHG0-1
  description: Long human product containing both doublecortin domains (17–100 and 139–221). Human full-length
    constructs support the ciliary and Wnt functions. PMID:25601850 identifies NP_001182539.1 and human
    variant 1, and tests p.Gln424Pro against wild type; the present official sequence has Gln at residue
    424. Other source assays must retain their own host species and construct limits.
- name: '2'
  id: Q9UHG0-2
  sequence_note: VSP_014670, VSP_014671
  description: Short alternative product reconstructed by deleting canonical residues 1–247 and replacing
    248–307 with its alternative 60-aa sequence before retaining 308–476. It lacks both annotated doublecortin
    domains. The four scoped papers do not establish its microtubule binding, ciliary localization, or
    Wnt-regulatory activity. It is not equivalent to the engineered 222–476 deletion or any patient truncation;
    absence of testing is not a demonstrated loss of all function.
