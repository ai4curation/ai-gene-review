      than undirected Wnt regulation. The current typed is_a/part_of ancestry places it below GO:0030111.
      DVL co-IP and rescue of ciliation by a Wnt inhibitor are supporting context, not proof of a particular
      physical inhibitory mechanism. PMID:21698230 independently reports a knockdown effect rescued by
      human DCDC2, while overexpression alone has no effect in that neuronal assay. Neither experiment
      establishes DCDC2 adaptor, kinase, or motor activity.
    proposed_replacement_terms:
    - id: GO:0090090
      label: negative regulation of canonical Wnt signaling pathway
    additional_reference_ids:
    - PMID:21698230
- term:
    id: GO:0035556
    label: intracellular signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003533
  - InterPro:IPR036572
  review:
    summary: A generic doublecortin-domain mapping is insufficient to establish DCDC2 as an intracellular
      signal-transduction component.
    action: MARK_AS_OVER_ANNOTATED
    reason: Both source mappings, IPR003533 and IPR036572, genuinely assign GO:0035556 and match the DCDC2
      canonical sequence. Their descriptions span doublecortin-family cytoskeletal proteins and kinase-containing
      relatives; DCDC2 domain matches alone do not establish the passing and downstream propagation of
      an intracellular signal required by the GO definition. DCDC2 can influence cilium-dependent Wnt
      and Smoothened signaling, but those specific regulation terms are not is_a/part_of descendants of
      GO:0035556 and are assessed separately using the target experiments. The mapping overstates what
      can be inferred from the common structural domain; this does not deny the experimentally reported
      regulatory effects.
    additional_reference_ids:
    - PMID:21698230
    - PMID:25557784
- term:
    id: GO:0045880
    label: positive regulation of smoothened signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:21698230
  qualifier: involved_in
  review:
    summary: DCDC2 overexpression enhances a Hedgehog pathway reporter in cultured neurons.
    action: KEEP_AS_NON_CORE
    reason: PMID:21698230 transfects primary rat cortical neurons with human DCDC2 constructs and a Shh-responsive
      reporter. Full-length overexpression increases reporter output, whereas the deletion constructs
      and knockdown do not. Retain the positive regulation annotation as a measured, context-specific
      output rather than a central molecular activity. KIF3A-mediated Smoothened trafficking is proposed
      by the authors, not directly demonstrated in these assays; no intrinsic motor function or direct
      Smoothened binding is inferred. The original reports a statistically significant full-length gain-of-function
      effect in three independent luciferase experiments, each using at least five parallel wells. The
      absence of a knockdown effect limits an endogenous requirement claim but does not negate the measured
      increase under overexpression. GO:0045880 describes increased pathway output; KEEP_AS_NON_CORE preserves
      that restricted result without claiming direct Smoothened regulation or an established normal physiological
      role. This differs from the MTOC assertion, for which a separate original explicitly excludes localization
      at the relevant structures.
