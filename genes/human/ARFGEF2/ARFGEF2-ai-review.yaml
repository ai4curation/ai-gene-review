- term:
    id: GO:0032760
    label: positive regulation of tumor necrosis factor production
  evidence_type: IMP
  original_reference_id: PMID:17276987
  qualifier: involved_in
  review:
    summary: Positive regulation of tumour necrosis factor production, from a paper that measures release
      of the TNF *receptor* TNFR1 in exosome-like vesicles and never measures production of the TNF cytokine.
      A receptor/ligand conflation.
    action: MODIFY
    reason: 'GO:0032760 is about the appearance of tumour necrosis factor itself - its parent GO:0032680
      regulates TNF production. What this paper shows is that BIG2 knockdown reduces constitutive release
      of full-length TNFR1 in exosome-like vesicles from human endothelial cells, and explicitly not the
      proteolytic route: neither BIG2 nor BIG1 was required for IL-1beta-induced cleavage of TNFR1 ectodomains.
      The direction is doubtful too: the paper frames released TNFR1 as a soluble species that binds and
      modulates TNF bioactivity, i.e. a decoy receptor, so if anything more shed TNFR1 antagonises TNF
      rather than increasing its production. Querying GOA by this reference returns exactly 2 annotations
      on 1 entity, both on ARFGEF2, so this is one term choice on one gene, not a propagated error. GO:1903543
      positive regulation of exosomal secretion is what the experiment measures.'
    proposed_replacement_terms:
    - id: GO:1903543
      label: positive regulation of exosomal secretion
    supported_by:
    - reference_id: PMID:17276987
      supporting_text: Effects of specific RNA interference (RNAi) showed that BIG2, but not BIG1, regulated
        the release of TNFR1 exosome-like vesicles, whereas neither BIG2 nor BIG1 was required for the
        IL-1beta-induced proteolytic cleavage of TNFR1 ectodomains.
    - reference_id: PMID:17276987
      supporting_text: We conclude that the association between BIG2 and TNFR1 selectively regulates the
        extracellular release of TNFR1 exosome-like vesicles from human vascular endothelial cells via
        an ARF1- and ARF3-dependent mechanism.
    - reference_id: PMID:17276987
      supporting_text: The type I, 55-kDa tumor necrosis factor receptor (TNFR1) is released from cells
        to the extracellular space where it can bind and modulate TNF bioactivity.
- term:
    id: GO:0034237
    label: protein kinase A regulatory subunit binding
  evidence_type: IDA
  original_reference_id: PMID:12571360
  qualifier: enables
  review:
    summary: 'BIG2 is an A-kinase anchoring protein: three short amphipathic regions in its N-terminal
      half bind the RI and RII regulatory subunits of PKA, confirmed by co-immunoprecipitation of endogenous
      proteins from human HepG2 cytosol.'
    action: ACCEPT
    reason: A second, genuinely distinct molecular function of this protein, mapped to residues and verified
      on endogenous proteins. Note that the three AKAP regions (27-48, 284-301, 517-538) lie in the DCB/HUS
      half of the molecule, well N-terminal of the Sec7 domain at 654-785, so the anchoring function is
      not a property of the catalytic module. Core.
