    label: recycling endosome
  supported_by:
  - reference_id: PMID:15385626
    supporting_text: we have revealed that another population of BIG2 is associated with the recycling
      endosome and found that expression of a catalytically inactive BIG2 mutant, E738K, selectively induces
      membrane tubules from this compartment
  - reference_id: PMID:20360857
    supporting_text: BIG1 is required to maintain the normal morphology of the Golgi; BIG2 is important
      for endosomal compartment integrity and cannot replace the function of BIG1 in Golgi organization.
  - reference_id: PMID:16477018
