- term:
    id: GO:0005879
    label: axonemal microtubule
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q7TSU1
  - ensembl:ENSRNOP00000010054
  review:
    summary: Axonemal microtubule, transferred from rat Arfgef2 by Ensembl Compara. It rests on a single
      rat IDA from a synaptic-trafficking paper with no ciliary content, and conflicts with the generic
      'cytoskeleton' that the same rat record states in prose.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'This is the one row in the rat projection block I cannot reconcile. The term claims a cilium
      or flagellum: GO:0005879 is defined as a microtubule in the axoneme of a eukaryotic cilium or flagellum.
      Three observations bear on it. First, the donor paper is a study of GABA(A) receptor trafficking
      whose systems are cultured hippocampal neurons, HEK293 cells and electron-microscopic immunocytochemistry
      of rat brain; its abstract contains no ciliary or flagellar content at all. Second, the rat UniProt
      entry''s own SUBCELLULAR LOCATION section, curated from that same paper, records the generic ''Cytoplasm,
      cytoskeleton'' and lists no cilium, axoneme or flagellum. Third, no large ArfGEF carries a cilium-compartment
      term and human ARFGEF2 has no other ciliary evidence of any kind; the cytoskeletal association that
      does exist for human BIG2 is with cytoplasmic microtubules and centrosomes. I have NOT concluded
      that the rat IDA is wrong - the full text is subscription-only (Europe PMC reports isOpenAccess:
      N, inEPMC: N, no PMC identifier) and I could not see the figure the curator saw. What I am judging
      is the non-experimental transfer of an unreproduced, compartment-specific localisation into human,
      where the general parent GO:0005856 cytoskeleton is already annotated and covers everything that
      is actually established.'
    supported_by:
    - reference_id: PMID:15198677
      supporting_text: Double label immunofluorescence of cultured hippocampal neurons and electron microscopy
        immunocytochemistry of rat brain tissue show that BIG2 concentrates in the trans-Golgi network.
    - reference_id: PMID:15198677
