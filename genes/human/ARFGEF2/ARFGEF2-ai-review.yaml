- term:
    id: GO:0035556
    label: intracellular signal transduction
  evidence_type: IDA
  original_reference_id: PMID:12571360
  qualifier: acts_upstream_of_or_within
  review:
    summary: Intracellular signal transduction, taken from the AKAP-domain-mapping paper.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'What that paper measures is binding - three PKA regulatory-subunit interaction regions mapped
      with 28 deletion mutants - plus cAMP-induced redistribution of BIG2 from cytosol to membranes. It
      does not show BIG2 transducing a signal; the authors'' own conclusion is hedged as a role that ''could
      coordinate cAMP and ARF regulatory pathways''. The term is also close to contentless: almost any
      cytoplasmic regulator is under it. Everything informative that this paper establishes is already
      carried by GO:0034237 and the GO:0016020/GO:0000139 membrane rows from the same reference. Flagged
      rather than removed because BIG2 genuinely sits in a cAMP signalling module.'
    supported_by:
    - reference_id: PMID:12571360
      supporting_text: All findings are consistent with a role for BIG2 as an A kinase-anchoring protein
        (or AKAP) that could coordinate cAMP and ARF regulatory pathways.
    - reference_id: PMID:12571360
      supporting_text: Residues 27-48 (domain A) interacted with RI alpha and RI beta, 284-301 (domain
        B) interacted with RII alpha and RII beta, and 517-538 (domain C) interacted with RI alpha, RII
        alpha, and RII beta.
