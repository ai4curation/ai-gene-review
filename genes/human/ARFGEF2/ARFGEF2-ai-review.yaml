      interacted with RII alpha and RII beta, and 517-538 (domain C) interacted with RI alpha, RII alpha,
      and RII beta.
  - reference_id: PMID:12571360
    supporting_text: Coimmunoprecipitation experiments confirmed interaction of in vitro translated BIG2
      and RI alpha, as well as of the endogenous proteins in cytosol of cultured HepG2 cells.
  - reference_id: PMID:19332778
    supporting_text: Specific depletion of HeLa cell PDE3A with small interfering RNA significantly decreased
      membrane-associated BIG1 and BIG2, which by confocal immunofluorescence microscopy were widely dispersed
      from an initial perinuclear Golgi concentration.
suggested_questions:
- question: Should the rat Arfgef2 GO:0005879 axonemal microtubule annotation (IDA, PMID:15198677, assigned
    by UniProt) be re-examined? The cited paper is a study of GABA(A) receptor trafficking in hippocampal
    neurons and rat brain with no ciliary content in its abstract, and the same UniProt record's own prose
    subcellular location says only 'Cytoplasm, cytoskeleton'. The rat row is the sole origin of two human
    rows, via Ensembl Compara and UniProt ISS. I could not read the full text (subscription only) and
    am therefore flagging rather than contradicting it.
- question: Should human ARFGEF2's GO:0017022 myosin binding row be re-referenced? It is currently a Compara
    projection of a rat row made from PMID:15644318, a paper about the paralog BIG1 that put six annotations
    on human ARFGEF1 and none on human ARFGEF2. Direct human evidence for BIG2 exists in PMID:23918382
    and would replace a paralog-derived chain with a species- and gene-correct one.
- question: Was BIG2's role in holding MYCBP/AMY-1 at the trans-Golgi network (PMID:16866877, RNAi) performed
    in human cells? If so, GO:0034067 protein localization to Golgi apparatus is annotatable by IMP. I
    did not add it because the cached abstract does not name the cell system and the full text was unavailable,
    so I could not state the species the experiment was done in.
- question: Human ARFGEF1 carries GO:0005096 GTPase activator activity by IDA from PMID:15644318, a paper
    whose result is that BIG1 *inhibits* the RhoGAP activity of myosin IXb - and the same paper also gave
    ARFGEF1 GO:0034260 negative regulation of GTPase activity, which reads the opposite way. This is ARFGEF1's
    row rather than this gene's and is offered as a question, not a finding; it was noticed while tracing
    the myosin-binding chain and has not been checked against the full text.
- question: Twenty-six of the 43 papers in ARFGEF2's own literature produce no GO annotation anywhere,
    including the founding disease paper (PMID:14647276), the AP-1/GGA dominant-negative papers (PMID:11777925,
    PMID:12051703), the PP1-gamma and RII-beta AKAP papers, the DCB/HUS homodimer paper and the myosin-phosphatase
    paper. Is this gene a candidate for a targeted curation pass rather than further pruning?
suggested_experiments:
- description: Test directly whether BIG2 is ever ciliary. Image endogenous BIG2 in ciliated human cells
    (RPE-1 serum-starved, or multiciliated ependymal cultures) against acetylated tubulin and ARL13B,
    and score axonemal versus basal-body signal. This is the cheapest way to settle the GO:0005879 rows
    in either direction, and a positive result would be interesting given the centrosomal pool already
    reported.
- description: Separate the catalytic and scaffolding functions in neurons. Compare wild-type BIG2, the
    Sec7-dead E738K mutant, and a C-terminal fragment lacking Sec7 for rescue of neuronal migration and
    of myosin light-chain phosphorylation in an ARFGEF2-null background. The myosin-IIA work shows the
    C-terminus suffices for the cytoskeletal phenotype in HeLa cells; whether the migration failure in
    PVNH2 is a GEF defect or a scaffolding defect is unresolved.
- description: Measure which cargoes actually depend on BIG2 at the TGN in a human neural progenitor system,
    using degron-mediated acute depletion plus surface proteomics, rather than brefeldin A. Every current
    cargo claim (E-cadherin, beta-catenin, Filamin A) rests on brefeldin A or dominant-negative overexpression,
    neither of which distinguishes BIG2 from BIG1 or GBF1.
- description: Test whether the released TNFR1 species is functionally agonistic or antagonistic toward
    TNF signalling after BIG2 depletion. The existing GO annotation asserts positive regulation of TNF
    production, which the paper does not measure; a simple TNF bioactivity assay on conditioned medium
    would establish the sign.
