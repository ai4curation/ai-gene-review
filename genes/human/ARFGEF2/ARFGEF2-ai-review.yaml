- description: Acts as an A-kinase anchoring protein, tethering PKA regulatory subunits through three
    amphipathic regions in its N-terminal half and assembling a local cAMP module that also contains phosphodiesterase
    PDE3A. This couples cAMP signalling to ARF activation and is structurally separate from the Sec7 catalytic
    domain.
  molecular_function:
