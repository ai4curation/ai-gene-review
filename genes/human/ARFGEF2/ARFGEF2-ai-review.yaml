description: 'ARFGEF2 encodes BIG2 (brefeldin A-inhibited guanine nucleotide-exchange protein 2), a ~202
  kDa guanine-nucleotide exchange factor for ADP-ribosylation factor GTPases. Its central Sec7 domain
  catalyses GDP-to-GTP exchange on class I ARFs, principally ARF1 and ARF3, and this activity is blocked
  by the fungal metabolite brefeldin A. BIG2 works at two membrane sites: at the trans-Golgi network,
  where ARF activation recruits the clathrin adaptors AP-1 and GGA - but not the COPI coat - to drive
  traffic towards endosomes and the cell surface; and on recycling endosomes, where it is required to
  maintain compartment integrity and to return internalised cargo such as the transferrin receptor and
  integrin beta1 to the plasma membrane. It is recruited from a large cytosolic pool onto membranes, and
  its exchange activity is damped by PKA phosphorylation and restored by protein phosphatase 1. Beyond
  catalysis, BIG2 is an A-kinase anchoring protein: three short amphipathic regions in its N-terminal
  half bind PKA regulatory subunits, assembling a local cAMP module that also contains phosphodiesterase
  PDE3A, and a separate non-catalytic C-terminal region binds non-muscle myosin IIA and restrains myosin
  light-chain phosphorylation, stress fibre formation and cell migration. BIG2 forms homodimers through
  its DCB and HUS regions and is found in large complexes with its close paralog BIG1, with which it shares
  trans-Golgi functions while retaining distinct roles - BIG1 maintains Golgi morphology, BIG2 maintains
  endosomal integrity. It is broadly expressed, with highest transcript levels in placenta, lung, heart,
  brain, kidney and pancreas, and in neurons it is concentrated in the trans-Golgi network and in dendritic
  vesicles, where it contributes to GABA(A) receptor export from the endoplasmic reticulum. Biallelic
  loss-of-function mutations in ARFGEF2 cause autosomal recessive periventricular nodular heterotopia
  with microcephaly (PVNH2), in which cortical neurons fail to migrate away from the periventricular proliferative
  zone.'
