- term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  evidence_type: IDA
  original_reference_id: PMID:10212200
  qualifier: enables
  review:
    summary: 'The founding biochemistry: recombinant BIG2 made in Sf9 cells accelerates GTPgammaS binding
      by ARF1, ARF5 and ARF6, works best on native ARF1/ARF3, and is inhibited by brefeldin A but not
      by the inactive analog B17.'
    action: ACCEPT
    reason: A direct in vitro exchange assay on purified recombinant protein with a specificity control
      (B17) - the strongest single piece of evidence in the whole annotation set, and the core molecular
      function. The substrates actually assayed here are recorded as has_input extensions, since GO no
      longer has a substrate-specific ARF GEF term to carry them.
    supported_by:
    - reference_id: PMID:10212200
      supporting_text: BIG2, synthesized as a His6 fusion protein in Sf9 cells, accelerated guanosine
        5'-3-O-(thio)triphosphate binding by recombinant ARF1, ARF5, and ARF6.
    - reference_id: PMID:10212200
      supporting_text: It activated native ARF (mixture of ARF1 and ARF3) more effectively than it did
        any of the nonmyristoylated recombinant ARFs.
    - reference_id: PMID:10212200
      supporting_text: BIG2 activity was inhibited by BFA in a concentration-dependent manner but not
        by B17, a structural analog without effects on Golgi function.
