  review:
    summary: Pan-eukaryotic PAINT inference that BIG2 is a guanine-nucleotide exchange factor, placed
      at a node spanning the whole Sec7 superfamily. Correct and core.
    action: ACCEPT
    reason: 'The donor set resolves to GNOM (Arabidopsis), Sec71 and garz (Drosophila), cytohesin-1 and
      PSD3 (mouse), GEA1/GEA2/SEC7/MON2/SYT1 (budding yeast), an S. pombe PSD-like protein, and human
      PSD, CYTH1, CYTH3, CYTH4, IQSEC2 and ARFGEF1. That clade mixes BIG-type, GBF-type, cytohesin-type
      and MON2-type GEFs acting on different ARF and ARF-like substrates, so the general term is the least
      common ancestor of the donors, not a curator failing to be specific; GRANULARITY_MISMATCH does not
      apply. ARFGEF2 itself (UniProtKB:Q9Y6D5) appears among the sources, which is the expected marker
      that the target carries its own experimental grounding for the term and the function is inherited,
      not a circularity. Separately, there is no more specific term available to propose: GO:0005086 ARF
      guanyl-nucleotide exchange factor activity and eight sibling substrate-specific GEF terms were merged
      into GO:0005085 and survive only as its secondaryIds, so GO:0005085 is already maximal and the ARF1/ARF3
      preference has to be recorded machine-readably instead.'
