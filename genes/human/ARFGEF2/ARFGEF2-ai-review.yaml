- term:
    id: GO:0050811
    label: GABA receptor binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q7TSU1
  - ensembl:ENSRNOP00000010054
  review:
    summary: GABA receptor binding, transferred from rat Arfgef2 by Ensembl Compara. The rat row is an
      IMP from the paper that identified the BIG2-GABA(A) receptor beta subunit interaction.
    action: KEEP_AS_NON_CORE
    reason: 'Well founded despite being a transfer. The rat evidence is a yeast two-hybrid interaction
      between BIG2''s C-terminal 110 residues and the large intracellular loop of the GABA(A) receptor
      beta subunits, plus reciprocal co-immunoprecipitation of the native proteins from brain. Critically,
      the functional experiment in the same paper - that BIG2 promotes GABA(A) receptor exit from the
      ER - was done in human HEK293 cells, so the human relevance does not depend on the projection. It
      is non-core: this is one cargo among many for a general trafficking GEF, and GO:0050811 describes
      a cargo-recognition contact rather than the protein''s catalytic function. UniProt records the corresponding
      human interactions with GABRB1, GABRB2 and GABRB3 as By similarity.'
    supported_by:
