- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IDA
  original_reference_id: PMID:10716990
  qualifier: located_in
  review:
    summary: BIG2 is recovered with Golgi membrane markers by density-gradient fractionation and colocalises
      with Golgi 58K protein and gamma-adaptin by immunofluorescence in human HeLa S3 and HepG2 cells.
      Golgi membrane is one of BIG2's two core sites of action.
    action: ACCEPT
    reason: Direct fractionation and imaging evidence in human cell lines. The co-immunoprecipitation
      half of this paper used bovine brain cytosol, but the localisation experiments cited for this term
      are the human-cell immunofluorescence and the microsomal gradient, so the human IDA is sound.
    supported_by:
    - reference_id: PMID:10716990
      supporting_text: After density gradient centrifugation of a microsomal fraction, BIG1 and BIG2 were
        recovered in the same fraction as beta-COP, a marker for Golgi membranes.
    - reference_id: PMID:10716990
      supporting_text: endogenous BIG1 and coexpressed BIG2 were distributed in a punctate pattern throughout
        the cytosol, and also concentrated in the perinuclear region, where endogenous BIG1 and BIG2 each
        partially colocalized with Golgi-specific 58K protein and gamma-adaptin
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IDA
  original_reference_id: PMID:12571360
  qualifier: located_in
  review:
    summary: 'Independent subcellular-fractionation evidence for BIG2 at Golgi membranes, here as the
      cAMP-regulated endpoint: raising cAMP moves BIG2 from cytosol onto Golgi and other membranes.'
    action: ACCEPT
    reason: A second, mechanistically different route to the same location (regulated translocation rather
      than steady-state distribution). Duplicate GO ids from different references are expected and useful
      here.
    supported_by:
    - reference_id: PMID:12571360
      supporting_text: Western blot analysis of subcellular fractions demonstrated translocation of BIG2
        (and BIG1) from cytosol to the Golgi and other membrane structures after incubation of cells with
        8-Br-cAMP or forskolin.
- term:
    id: GO:0001881
    label: receptor recycling
  evidence_type: IDA
  original_reference_id: PMID:16477018
  qualifier: involved_in
  review:
    summary: BIG2, but not BIG1, accumulates with recycling-endosome markers during transferrin uptake,
      and BIG2 knockdown causes perinuclear accumulation of the transferrin receptor and slows transferrin
      release. Receptor recycling is a core BIG2 process.
    action: ACCEPT
    reason: 'The functional core of the paper and one of the best-supported BIG2 processes, with a clean
      BIG1 control that fails to reproduce the phenotype. Two evidence-code notes for the curator, neither
      of which changes the term: the decisive experiments are siRNA knockdowns, which is IMP rather than
      IDA; and the cells are COS7, with siRNAs designed against the human BIG1 and BIG2 sequences, so
      the reagents rather than the cell line carry the human specificity.'
    supported_by:
    - reference_id: PMID:16477018
      supporting_text: Treatment of cells with BIG2 small interfering RNA (siRNA), but not BIG1 or control
        siRNAs, decreased BIG2 protein >90% without affecting BIG1, ARF, or actin content, whereas TfnR
        was significantly increased as was its accumulation in perinuclear recycling endosomes.
    - reference_id: PMID:16477018
      supporting_text: Tfn release appeared unaffected by BIG1 siRNA but was significantly slowed from
        cells treated with BIG2 siRNA alone or plus BIG1 siRNA.
    - reference_id: PMID:16477018
      supporting_text: COS7 cells (used because they are more favorable than HepG2 cells for immunofluorescence
        microscopy)
