- term:
    id: GO:0051497
    label: negative regulation of stress fiber assembly
  evidence_type: IMP
  original_reference_id: PMID:23918382
  qualifier: involved_in
  review:
    summary: siRNA depletion of BIG2 in human HeLa cells more than doubles phosphorylation of myosin regulatory
      light chain at T18/S19 and makes actin stress fibres significantly more prominent; re-expressing
      BIG2, or its C-terminal fragment alone, reverses both effects. BIG2 therefore restrains stress fibre
      assembly.
    action: NEW
    reason: 'A well-controlled human loss-of-function result with a rescue, currently carrying no GO annotation
      of any kind - querying GOA by this reference returns zero annotations on any gene. The experiments
      are in HeLa cells with human-targeted siRNA, so IMP is the correct evidence code. The mechanism
      is non-catalytic: the rescuing C-terminal fragment does not contain the Sec7 domain, so this is
      a scaffolding function separable from ARF exchange. This paper was surfaced by the affinage deep-research
      record, whose dated-findings table summarises it accurately; the claim here nonetheless rests on
      the primary full text, which was read, and the provider sentence is cited only as corroboration.'
    supported_by:
    - reference_id: PMID:23918382
      supporting_text: Stress fibers were significantly more prominent after BIG1 or BIG2 depletion than
        in control cells
    - reference_id: PMID:23918382
      supporting_text: Motility of HeLa cells transfected with BIG1 or BIG2 siRNA was significantly impaired
        relative to that of cells transfected with NT siRNA, and overexpression of BIG1 or BIG2, full-length
        or C fragment, but not N or S fragments, reversed those effects
    - reference_id: PMID:23918382
      supporting_text: Reciprocal coimmunoprecipitation of endogenous HeLa cell BIG1 and BIG2 with myosin
        IIA was demonstrably independent of Arf guanine nucleotide-exchange factor activity
    - reference_id: file:human/ARFGEF2/ARFGEF2-deep-research-affinage.md
      supporting_text: depletion of BIG2 (or BIG1) enhances phosphorylation of myosin regulatory light
        chain (T18/S19) and increases F-actin content, impairing cell migration
- term:
    id: GO:0030335
    label: positive regulation of cell migration
  evidence_type: IMP
  original_reference_id: PMID:23918382
  qualifier: involved_in
  review:
    summary: BIG2 depletion significantly impairs HeLa cell motility in Transwell assays, and the defect
      is reversed by re-expressing BIG2 or its C-terminal fragment. A second, independent study reaches
      the same conclusion through integrin beta1 recycling and actin remodelling.
    action: NEW
    reason: Two independent human HeLa studies with consistent loss-of-function phenotypes, one with a
      rescue control, and neither has produced a single GO annotation anywhere. Both used human cells
      and human-targeted siRNA, so IMP is correct. This links BIG2's recycling function to a cell-level
      output and is the process most plausibly connecting BIG2 to the neuronal migration failure seen
      in periventricular nodular heterotopia, although that connection is not itself demonstrated and
      is deliberately not annotated.
    supported_by:
    - reference_id: PMID:23918382
      supporting_text: Motility of HeLa cells transfected with BIG1 or BIG2 siRNA was significantly impaired
        relative to that of cells transfected with NT siRNA, and overexpression of BIG1 or BIG2, full-length
        or C fragment, but not N or S fragments, reversed those effects
    - reference_id: PMID:22908276
      supporting_text: Treatment of HeLa cells with BIG2 siRNA resulted in perinuclear accumulation of
        integrin β1 and its delayed return to the cell surface. Motility of BIG2-depleted cells was simultaneously
        decreased, as were actin-based membrane protrusions
    additional_reference_ids:
    - PMID:22908276
core_functions:
- description: Catalyses guanine-nucleotide exchange on class I ADP-ribosylation factors, converting ARF1
    and ARF3 to their GTP-bound active forms through its Sec7 domain, in a reaction inhibited by brefeldin
    A. This is the protein's defining activity and the step that licenses coat and adaptor recruitment
    to donor membranes.
  molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  substrates:
  - id: UniProtKB:P84077
    label: ARF1
  - id: UniProtKB:P61204
    label: ARF3
  directly_involved_in:
  - id: GO:0032012
    label: regulation of ARF protein signal transduction
  - id: GO:0006893
    label: Golgi to plasma membrane transport
  locations:
  - id: GO:0005802
    label: trans-Golgi network
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - reference_id: PMID:10212200
    supporting_text: BIG2, synthesized as a His6 fusion protein in Sf9 cells, accelerated guanosine 5'-3-O-(thio)triphosphate
      binding by recombinant ARF1, ARF5, and ARF6.
  - reference_id: PMID:15385626
    supporting_text: We also have shown that BIG2 has an exchange activity toward class I ARFs (ARF1 and
      ARF3) in vivo and inactivation of either ARF exaggerates the BIG2(E738K)-induced tubulation of endosomal
      membranes.
  - reference_id: PMID:12051703
    supporting_text: These observations indicate that BIG2 is involved in trafficking from the TGN by
      regulating membrane association of AP-1 and GGA through activating ARF.
  knowledge_gaps:
  - gap_statement: GO cannot state which GTPase an exchange factor acts on. GO:0005086 ARF guanyl-nucleotide
      exchange factor activity, together with eight sibling substrate-specific GEF terms, was merged into
      GO:0005085 and survives only as one of its secondaryIds, so the ARF1/ARF3 substrate preference that
      is the best-measured fact about BIG2 has no term to carry it.
    boundary: The activity itself is firmly established - purified recombinant BIG2 accelerates nucleotide
      exchange on ARF1, ARF5 and ARF6 in vitro and on class I ARFs in cells, and the Sec7 domain is annotated
      at residues 654-785. What cannot be expressed is the substrate, not the activity.
    gap_kind:
    - ONTOLOGY
    significance: Substrate preference is what separates the ~15 human Sec7-family GEFs from one another;
      with the substrate-specific terms merged away, every one of them carries the same molecular-function
      term and the GO record cannot distinguish a class I ARF GEF from an ARF6 GEF.
    resolution: Either machine-readable substrate capture on the annotation (has_input extensions, as
      used here) or restoration of substrate-specific children of GO:0005085. This review uses the former
      and deliberately does not propose a new term, since recreating GO:0005086 would undo a deliberate
      merge.
    provenance:
    - reference_id: file:human/ARFGEF2/ARFGEF2-bioinformatics/RESULTS.md
      supporting_text: 'Independently: **`GO:0005086` ARF guanyl-nucleotide exchange factor activity no'
- description: Maintains the structural integrity of the recycling endosome and drives the return of internalised
    receptors from it to the plasma membrane, a function it does not share with its paralog BIG1.
  molecular_function:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  directly_involved_in:
