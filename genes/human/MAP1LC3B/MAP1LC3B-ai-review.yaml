id: Q9GZQ8
gene_symbol: MAP1LC3B
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MAP1LC3B (LC3B) is a ubiquitin-like protein of the Atg8 family (LC3 subfamily) and the most
  widely used marker of autophagic membranes. Newly made pro-LC3B is cleaved by ATG4 proteases after Gly120
  to give cytosolic LC3B-I, which the E1-like ATG7, the E2-like ATG3 and the ATG12-ATG5-ATG16L1 E3-like
  complex conjugate to phosphatidylethanolamine on the phagophore, forming membrane-anchored LC3B-II;
  ATG4 also removes it again. On the phagophore and autophagosome, LC3B promotes membrane expansion and
  serves as a docking platform: its hydrophobic LIR-docking site binds LC3-interacting region motifs of
  selective autophagy receptors (for example SQSTM1, PHB2, BNIP3, AMBRA1, TEX264), core autophagy proteins
  and regulators, coupling cargo capture to the autophagic membrane and supporting mitophagy and ER-phagy.
  Atg8-family proteins are collectively needed for efficient autophagosome formation and especially for
  autophagosome-lysosome fusion, where the GABARAP subfamily predominates. LC3B was originally identified
  as a light chain of microtubule-associated proteins MAP1A/MAP1B and binds microtubules; it also binds
  ceramide during ceramide-induced lethal mitophagy and stimulates JMY-mediated actin nucleation on autophagic
  membranes.'
