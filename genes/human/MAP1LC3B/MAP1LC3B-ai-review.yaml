- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000103522
  - RGD:735183
  - SGD:S000000174
  - UniProtKB:P60520
  - UniProtKB:Q582K6
  - UniProtKB:Q9GZQ8
  - UniProtKB:Q9H492
  review:
    summary: PE-conjugated LC3B decorates the expanding phagophore and promotes its elongation and the
      efficiency of autophagosome formation.
    action: ACCEPT
    reason: LC3-subfamily proteins act in phagophore elongation. Atg8 hexa-knockout cells still form autophagosomes,
      but they are smaller and form more slowly, so LC3B contributes to membrane expansion rather than
      being strictly required for initiation. Direct participation in assembly is therefore supported,
      at the expansion step.
    supported_by:
    - reference_id: PMID:20418806
      supporting_text: our results indicate that LC3s are involved in elongation of the phagophore membrane
        whereas the GABARAP/GATE-16 subfamily is essential for a later stage in autophagosome maturation
    - reference_id: PMID:27864321
      supporting_text: loss of all Atg8s yields smaller autophagosomes and a slowed initial rate of autophagosome
        formation
    - reference_id: PMID:33499712
      supporting_text: MAP1LC3B is known to associate with elongating phagophores as well as enclosed
        autophagosomal membranes.
