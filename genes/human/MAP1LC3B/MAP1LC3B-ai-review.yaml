  review:
    summary: LC3 knockdown reduced mitophagy-associated mitochondrial fragmentation in PINK1-deficient
      SH-SY5Y cells.
    action: ACCEPT
    reason: Genetic interaction data consistent with LC3B acting in mitophagy; the mechanistic basis (LIR-receptor
      binding on the phagophore) is established by other work.
    supported_by:
