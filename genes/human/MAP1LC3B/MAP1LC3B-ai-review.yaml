  findings: []
core_functions:
- description: Ubiquitin-like Atg8-family protein that is processed by ATG4 and covalently conjugated
    to phosphatidylethanolamine on the phagophore, where LC3B-II promotes membrane expansion and recruits
    LIR-containing cargo receptors and autophagy factors.
  molecular_function:
    id: GO:0008429
    label: phosphatidylethanolamine binding
  directly_involved_in:
  - id: GO:0000045
    label: autophagosome assembly
  - id: GO:0000423
    label: mitophagy
  locations:
  - id: GO:0000421
    label: autophagosome membrane
  supported_by:
  - reference_id: PMID:15355958
    supporting_text: Human light chain 3/MAP1LC3B, an autophagosomal ortholog of yeast Atg8, is conjugated
      to phospholipid (PL) via ubiquitylation-like reactions mediated by human Atg7 and Atg3.
  - reference_id: PMID:15355958
    supporting_text: These results indicate that the carboxyl terminus of MAP1LC3B is cleaved to expose
      Gly(120) for further ubiquitylation-like reactions.
  - reference_id: PMID:20418806
    supporting_text: our results indicate that LC3s are involved in elongation of the phagophore membrane
      whereas the GABARAP/GATE-16 subfamily is essential for a later stage in autophagosome maturation
  - reference_id: PMID:27864321
    supporting_text: loss of all Atg8s yields smaller autophagosomes and a slowed initial rate of autophagosome
      formation
  - reference_id: PMID:28017329
    supporting_text: PHB2 binds the autophagosomal membrane-associated protein LC3 through an LC3-interaction
      region (LIR) domain upon mitochondrial depolarization and proteasome-dependent outer membrane rupture.
- description: As part of the Atg8-family complement on the autophagosome outer membrane, LC3B contributes
    to autophagosome maturation and fusion with lysosomes, a step dominated by the GABARAP subfamily.
  directly_involved_in:
  - id: GO:0097352
    label: autophagosome maturation
  locations:
  - id: GO:0000421
    label: autophagosome membrane
  supported_by:
  - reference_id: PMID:27864321
    supporting_text: We show that Atg8s are dispensable for autophagosome formation and selective engulfment
      of mitochondria, but essential for autophagosome-lysosome fusion.
suggested_questions:
- question: Is there a GO molecular function term suitable for Atg8-family LIR-docking (the shared activity
    behind most of the protein binding rows), and should GO adopt one?
- question: Which LC3B functions are not shared with LC3A, LC3C and the GABARAP subfamily in cells that
    express all six Atg8 proteins?
suggested_experiments:
- description: Re-express LC3B alone in Atg8 hexa-knockout cells, with wild-type or LIR-docking-site mutants,
    and measure autophagosome size, formation rate and fusion.
  hypothesis: LC3B alone restores phagophore expansion but only partly restores autophagosome-lysosome
    fusion.
