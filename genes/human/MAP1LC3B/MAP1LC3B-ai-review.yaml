- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026840
  review:
    summary: LC3B on the phagophore binds LIR-containing mitophagy receptors (for example PHB2, AMBRA1,
      BNIP3, NIX) to engulf mitochondria.
    action: ACCEPT
    reason: Receptor engagement by LC3 on the forming autophagosome is a direct contribution of LC3B to
      mitophagy, although GABARAP-subfamily proteins dominate in PINK1/Parkin mitophagy in HeLa cells.
    supported_by:
    - reference_id: PMID:28017329
      supporting_text: PHB2 binds the autophagosomal membrane-associated protein LC3 through an LC3-interaction
        region (LIR) domain upon mitochondrial depolarization and proteasome-dependent outer membrane
        rupture.
    - reference_id: PMID:25215947
      supporting_text: upon mitophagy induction, AMBRA1 binds the autophagosome adapter LC3 through a
        LIR (LC3 interacting region) motif
