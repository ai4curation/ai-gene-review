id: Q9Y265
gene_symbol: RUVBL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RUVBL1 is an essential AAA+ ATPase that works with RUVBL2 as an alternating heteromeric ring. The RUVBL1-RUVBL2
  ring hydrolyzes ATP and forms a structural and catalytic module in nuclear chromatin-remodeling complexes such as INO80,
  SRCAP and TIP60/p400, and in the R2TP/PAQosome co-chaperone system that assembles RNPs and other large protein complexes.
alternative_products:
- name: '1'
  id: Q9Y265-1
- name: '2'
  id: Q9Y265-2
  sequence_note: VSP_021387, VSP_021388
existing_annotations:
- term:
    id: GO:0000492
    label: box C/D snoRNP assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000120244
  - SGD:S000002598
  - SGD:S000006156
  - WB:WBGene00007784
  review:
    summary: The RUVBL1/RUVBL2 ATPase ring participates in the R2TP/PAQosome-mediated assembly route for box C/D snoRNPs.
    action: ACCEPT
    reason: RUVBL1 and RUVBL2 are the AAA+ ATPases of R2TP/PAQosome, which loads NOP58 through NOPCHAP1 during box C/D snoRNP
      biogenesis; the conserved PAINT row is consistent with that human literature.
    additional_reference_ids:
    - PMID:33367824
    supported_by:
    - reference_id: PMID:33367824
      supporting_text: NOPCHAP1 makes direct physical interactions with the CC-NOP domain of NOP58 and domain II of RUVBL1/2
        AAA+ ATPases
- term:
    id: GO:0000723
    label: telomere maintenance
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P60122
  - ensembl:ENSMUSP00000032165
  review:
    summary: RUVBL1 has a reported telomerase-holoenzyme assembly role, but telomere maintenance is not the best description
      of its core RUVBL-ring activity.
    action: KEEP_AS_NON_CORE
    reason: RUVBL1/Pontin and RUVBL2/Reptin were identified as telomerase components needed for telomerase holoenzyme assembly,
      so a telomere-related process is plausible, but this is a context-specific client of the RUVBL ring rather than the
      general conserved role.
    additional_reference_ids:
    - PMID:18358808
- term:
    id: GO:0000786
    label: nucleosome
  evidence_type: IDA
  original_reference_id: PMID:27153538
  qualifier: part_of
  review:
    summary: RUVBL1 occurs in chromatin-remodeling and histone-acetyltransferase complexes that act on nucleosomes, but it
      is not a nucleosome subunit.
    action: REMOVE
    reason: The nucleosome is the substrate of SRCAP, INO80 and TIP60/p400 complexes, not a protein-containing complex that
      incorporates RUVBL1 as a stable part. Structural SRCAP data place RUVBL1 in the remodeling-complex head, separate from
      the nucleosomal histones.
    additional_reference_ids:
    - PMID:30337683
    supported_by:
    - reference_id: PMID:30337683
      supporting_text: SRCAP-C is an ~1 MDa complex consisting of 10 components including SRCAP, DMAP1, YL1, RUVBL1, RUVBL2,
        ACTL6A, ARP6, ACTIN, GAS41 and ZNHIT1
