    - reference_id: PMID:11080158
      supporting_text: Pontin52 as a nuclear protein interacting with beta-catenin and the TATA-box binding protein
- term:
    id: GO:0003678
    label: DNA helicase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000120244
  - RGD:68373
  - SGD:S000002598
  - SGD:S000006156
  - UniProtKB:Q8IAT2
  - UniProtKB:Q8ID85
  - UniProtKB:Q8IIU3
  - UniProtKB:Q9Y230
  - UniProtKB:Q9Y265
  review:
    summary: DNA helicase activity is a legacy claim for TIP49/RUVBL proteins that is not supported by later biochemical work
      on the RUVBL1/RUVBL2 complex.
    action: MARK_AS_OVER_ANNOTATED
    reason: RUVBL1/RUVBL2 is clearly an ATP-hydrolyzing AAA+ ring, but a later direct study of the assembled human TIP48/TIP49
      complex found no DNA helicase or branch-migration activity, so DNA helicase annotations are stronger than the current
      biochemical evidence warrants.
    additional_reference_ids:
    - PMID:17157868
    supported_by:
    - reference_id: PMID:17157868
      supporting_text: no DNA helicase or branch migration activity could be detected
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PANTHER:PTN000120244
        source_status: SOURCE_BAD
        comment: >-
          The ancestral PAINT IBD is seeded partly by human RUVBL1/RUVBL2 DNA-helicase rows
          that are contradicted by later purified-complex biochemistry.
