    label: TFIID-class transcription factor complex binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P60122
  - ensembl:ENSMUSP00000032165
  review:
    summary: The evidence supports direct TBP binding, not transfer to the broader TFIID-class transcription factor complex-binding
      term.
    action: MARK_AS_OVER_ANNOTATED
    reason: RUVBL1/Pontin was reported to bind TBP in vitro and can affect beta-catenin transcriptional reporters, but the
