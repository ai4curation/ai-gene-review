id: Q9Y672
gene_symbol: ALG6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALG6 is a multipass endoplasmic reticulum membrane glucosyltransferase that
  catalyzes the first of three glucose additions during assembly of the dolichol-linked
  N-glycan precursor. Its lumen-facing reaction transfers glucose from
  dolichyl-phosphate-glucose to Man9GlcNAc2-PP-dolichol, forming an alpha-1,3 linkage
  and producing Glc1Man9GlcNAc2-PP-dolichol for subsequent glucosylation. This catalytic
  step supplies the mature glycan donor used by oligosaccharyltransferase in protein
  N-linked glycosylation. ALG6 belongs to the ALG6/ALG8 glycosyltransferase family.
  Biallelic pathogenic variants cause ALG6-congenital disorder of glycosylation,
  characterized biochemically by accumulation of unglucosylated lipid-linked precursor
  and protein hypoglycosylation.
