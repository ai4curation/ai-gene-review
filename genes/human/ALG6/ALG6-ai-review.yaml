core_functions:
- description: Catalyzes the first glucose addition to the dolichol-linked N-glycan
    precursor on the lumenal side of the ER membrane, using Dol-P-Glc to convert
    Man9GlcNAc2-PP-Dol into Glc1Man9GlcNAc2-PP-Dol. This substrate-producing catalytic
    step participates directly in LLO biosynthesis and the protein N-glycosylation
    pathway.
  molecular_function:
    id: GO:0042281
    label: dolichyl pyrophosphate Man9GlcNAc2 alpha-1,3-glucosyltransferase activity
  directly_involved_in:
  - id: GO:0006488
    label: dolichol-linked oligosaccharide biosynthetic process
  - id: GO:0006487
    label: protein N-linked glycosylation
  locations:
  - id: GO:0098553
    label: lumenal side of endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:10359825
    supporting_text: Expression of the human ALG5 and ALG6 cDNA could partially
      complement the respective S. cerevisiae alg5 and alg6 deficiency.
  - reference_id: PMID:25792706
    supporting_text: We monitored glycosylation of proteins in asparagine-linked
      glycosylation 6 (ALG6) deficient cell lines that assemble Dol-PP-GlcNAc(2)Man(9)
      as the largest oligosaccharide donor.
  - reference_id: file:human/ALG6/ALG6-uniprot.txt
    supporting_text: Man(9)GlcNAc(2)-PP-Dol to produce Glc(1)Man(9)GlcNAc(2)-PP-Dol.
  - reference_id: Reactome:R-HSA-446202
    supporting_text: The donor is a dolichol-phosphate-glucose (synthesized by ALG5).
  - reference_id: file:human/ALG6/ALG6-uniprot.txt
    supporting_text: In the lumen of the endoplasmic reticulum,
proposed_new_terms: []
suggested_questions:
- question: Which features of the yeast ALG6 donor-bound structure and catalytic
    mechanism extend to purified human ALG6, and how do human disease variants alter
    activity, stability or expression?
- question: Does the reported human ALG6-ALG8 association alter glycan flux or substrate
    transfer, beyond co-purification of sequential ER enzymes?
suggested_experiments:
- description: Compare purified human wild-type and disease-variant ALG6 using defined
    lipid-linked donor and acceptor substrates, adapting the established yeast assay
    while measuring protein abundance and stability separately.
- description: Test ALG6 and ALG8 individually and together in a defined membrane system
    to distinguish independent sequential reactions from an interaction-dependent change
    in catalytic flux.
