- term:
    id: GO:0000281
    label: mitotic cytokinesis
  evidence_type: NAS
  original_reference_id: PMID:11509732
  qualifier: involved_in
  review:
    summary: Cells expressing non-cleavable SCC1 fail to complete cytokinesis, but this is a downstream consequence
      of unseparated chromatids obstructing the cleavage plane rather than a cytokinetic activity of separase.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited abstract states that cohesin cleavage is required for completion of cytokinesis, yet separase
      does none of the work of cytokinesis; the defect follows from failed sister separation. Human separase is
      lost from centrosomes at anaphase onset and, unlike budding-yeast Esp1, has no documented mitotic-exit role.
      The term overstates the evidence and should not be treated as a core process.
    supported_by:
    - &id016
      reference_id: PMID:11509732
      supporting_text: cohesin cleavage by separase is essential for sister chromatid separation and for the completion
        of cytokinesis
      reference_section_type: ABSTRACT
