    label: mitotic sister chromatid segregation
  evidence_type: IMP
  original_reference_id: PMID:12672959
  qualifier: involved_in
  review:
    summary: Antisense depletion of endogenous separase in HeLa cells caused a >4-fold increase in anaphases with
      lagging chromosomes, directly showing that separase is required for faithful mitotic sister chromatid segregation.
    action: ACCEPT
    reason: Direct human loss-of-function evidence, consistent with RNAi (PMID:12194817) and non-cleavable SCC1
      (PMID:11509732) phenotypes. Separase performs the cohesin-cleavage step itself, so it is a genuine participant
      in this process; the more specific step is captured by GO:0051306.
