id: Q14674
gene_symbol: ESPL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ESPL1 encodes separase (separin), a large caspase-like cysteine endopeptidase of clan CD whose C-terminal
  peptidase C50 domain (catalytic Cys2029) cleaves the kleisin subunit of cohesin after arginine in ExxR motifs.
  At the metaphase-to-anaphase transition it cuts RAD21/SCC1 in the residual centromeric cohesin, opening the cohesin
  ring and allowing sister chromatids to be pulled to opposite spindle poles; in meiosis it cleaves the kleisin
  REC8. Efficient cleavage depends on a docking (LPE) motif in RAD21 and is enhanced by PLK1 phosphorylation of
  the substrate. Through most of the cell cycle separase is held inactive in the separase-securin complex, in which
  securin (PTTG1) acts as a folding chaperone and pseudosubstrate inhibitor, or by mutually exclusive binding of
  CDK1-cyclin B1-CKS1 after phosphorylation of Ser1126; APC/C-Cdc20-mediated destruction of securin and cyclin B1
  unleashes the enzyme, which then autocleaves at Arg1486/1506/1535 with its fragments remaining associated. Separase
  is predominantly cytoplasmic in interphase, concentrates at centrosomes during prometaphase and metaphase, and
  at the end of mitosis cleaves centrosomal cohesin and pericentrin-B/kendrin to disengage centrioles and license
  the next round of centrosome duplication. Loss of separase leaves sister chromatids unseparated and produces lagging
  chromosomes and polyploidy, while premature activation causes precocious sister separation and centriole disengagement.
