proposed_new_terms: []
suggested_questions:
- question: Which centrosomal substrate (pericentrin-B/kendrin, centrosomal RAD21, or another) is rate-limiting
    for separase-dependent centriole disengagement in human cells, and is a GO process term for centriole disengagement
    warranted?
- question: Does human separase cleave REC8 in human oocytes/spermatocytes as it does in mouse, and how is centromeric
    REC8 protected from it at meiosis I in human germ cells?
- question: What is the physiological purpose of separase autocleavage in human cells, given that non-cleavable
    separase retains cohesin-cleaving activity but perturbs the timing of activation and PP2A/cyclin B1 binding?
suggested_experiments:
- description: N-terminomics (TAILS) on synchronized anaphase cells expressing protease-dead (C2029A) versus wild-type
    separase from the endogenous locus, to define the complete in vivo separase cleavage repertoire (RAD21, pericentrin-B,
    self, others) in human cells.
- description: Live-cell imaging of endogenously tagged separase together with securin and RAD21 after acute degron-mediated
    depletion of securin or cyclin B1, to quantify the kinetics of separase release, autocleavage and cohesin cleavage
    relative to anaphase onset.
