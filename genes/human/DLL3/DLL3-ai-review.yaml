id: Q9NYJ7
gene_symbol: DLL3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DLL3 is a single-pass type I membrane glycoprotein of the Delta/Serrate/LAG-2
  (DSL) family, with an extracellular DSL domain and six EGF-like repeats. Unlike the
  canonical ligands DLL1 and DLL4, DLL3 does not activate Notch on neighbouring cells.
  Endogenous DLL3 is retained in intracellular membranes, chiefly the Golgi apparatus and
  the late endocytic compartment, where it binds Notch1 and routes newly synthesised
  receptor to lysosomal degradation before it reaches the cell surface, acting as a
  cis-inhibitor of Notch signalling. This activity operates in the presomitic mesoderm,
  and biallelic loss-of-function mutations in humans cause autosomal recessive
  spondylocostal dysostosis, a vertebral and rib segmentation disorder. In high-grade
  pulmonary neuroendocrine tumours DLL3 is strongly overexpressed and aberrantly
  trafficked to the plasma membrane, which is the basis for DLL3-directed antibody-drug
  conjugate and T-cell-engager therapeutics.
