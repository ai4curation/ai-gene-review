suggested_questions:
- question: What retains DLL3 in the Golgi and late endosomes, and which sorting determinants
    in the transmembrane and cytoplasmic regions are responsible?
- question: Does the surface pool of DLL3 seen in neuroendocrine tumours have any signalling
    activity, in cis or in trans, or is it functionally inert cargo that happens to be
    accessible?
- question: Are the six EGF-like repeats of DLL3 genuinely calcium-loaded, and does calcium
    occupancy affect the Notch1 interaction?
suggested_experiments:
- hypothesis: DLL3 cis-inhibits Notch by diverting newly synthesised Notch1 from the
    secretory pathway to lysosomes.
  description: Pulse-chase metabolic labelling of Notch1 in cells with and without DLL3
    expression, combined with surface biotinylation and lysosomal inhibitors, to measure the
    fraction of nascent Notch1 that reaches the plasma membrane versus the lysosome.
- hypothesis: Golgi retention of DLL3 is encoded in its transmembrane and juxtamembrane
    sequences.
  description: Swap the DLL3 transmembrane and cytoplasmic regions onto DLL1 and vice versa,
    then quantify steady-state surface versus Golgi pools by surface biotinylation and
    immunofluorescence in presomitic-mesoderm-like cells.
- hypothesis: Surface DLL3 in SCLC arises from saturation of a retention mechanism rather
    than from a tumour-specific trafficking pathway.
  description: Titrate DLL3 expression in a non-neuroendocrine cell line and in SCLC lines
    and measure the surface-to-total ratio by flow cytometry on non-permeabilised cells, to
    test whether the surface fraction appears only above a threshold of total expression.
