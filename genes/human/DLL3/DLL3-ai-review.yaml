core_functions:
- description: Binds Notch1 within intracellular membranes of the same cell and prevents
    maturation and surface presentation of the receptor, thereby cis-inhibiting Notch
    signalling. This activity operates in the presomitic mesoderm and underlies the
    vertebral segmentation defects caused by human loss of function.
