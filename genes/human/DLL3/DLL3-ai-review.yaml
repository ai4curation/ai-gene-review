  review:
    action: MODIFY
    summary: DLL3 is not active at the plasma membrane. Endogenous protein is retained in
      the Golgi and the late endocytic compartment, where it engages Notch1.
    reason: The ancestral DSL-ligand node is correctly placed for Delta and Serrate ligands
      that signal in trans from the cell surface, but there is target-specific evidence that
      DLL3 diverged in trafficking. Geffers et al. localise endogenous DLL3 predominantly to
      the Golgi while DLL1 is on the surface of the same cells, and Chapman et al. show Dll3
      is not presented at the presomitic mesoderm cell surface. Replace with Golgi membrane
      and late endosome, the compartments in which the protein resides and in which the
      Notch1 interaction occurs. Surface DLL3 is seen in neuroendocrine tumours, which is a
      pathological overexpression state rather than the site of normal activity.
