  title: Mutations in the human delta homologue, DLL3, cause axial skeletal defects in
    spondylocostal dysostosis.
  findings:
  - statement: Biallelic DLL3 mutations, including truncations of conserved extracellular
      domains and a missense change in the fifth EGF repeat, cause autosomal recessive
      spondylocostal dysostosis in humans.
    supporting_text: Two of the mutations predict truncations within conserved extracellular
      domains. The third is a missense mutation in a highly conserved glycine residue of the
      fifth epidermal growth factor (EGF) repeat
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified cloning and mutation paper that establishes the human
      disease association. The cached record is abstract-only.
- id: PMID:17664336
  title: Divergent functions and distinct localization of the Notch ligands DLL1 and DLL3 in
    vivo.
  findings:
  - statement: DLL3 cannot substitute for DLL1 in mice and does not activate Notch in
      Drosophila wing discs; endogenous DLL3 is predominantly Golgi-localized while DLL1 is
      at the surface of the same presomitic mesoderm cells.
    supporting_text: In contrast to endogenous DLL1 located on the surface of presomitic
      mesoderm cells, we find endogenous DLL3 predominantly in the Golgi apparatus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read. This is the key localization evidence against a
      plasma-membrane assignment for endogenous DLL3.
- id: PMID:21147753
  title: Notch inhibition by the ligand DELTA-LIKE 3 defines the mechanism of abnormal
    vertebral segmentation in spondylocostal dysostosis.
  findings:
  - statement: DLL3 binds Notch1 in the late endocytic compartment and targets newly
      synthesised receptor for lysosomal degradation, cis-inhibiting Notch signalling in the
