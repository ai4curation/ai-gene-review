- id: PMID:18227064
  title: The SALM family of adhesion-like molecules forms heteromeric and homomeric
    complexes.
  findings:
  - statement: In rat brain and heterologous-cell experiments, SALM5 lacked the robust
      SALM1-3 brain heteromerization pattern and mediated homophilic, but not heterophilic,
      trans-cellular adhesion.
    supporting_text: Both SALMs 4 and 5 formed homophilic, but not heterophilic associations,
      whereas no trans associations were formed by the other SALMs.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: SALM5 lacks the C-terminal PDZ-binding domain present in SALM1-3.
    supporting_text: SALMs 1-3 contain PDZ-binding domains, whereas SALMs 4 and 5 do not.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed title and cached abstract were checked. This is direct SALM5-family
      interaction evidence from rat brain and heterologous cells; only the abstract is cached,
      so detailed construct provenance cannot be independently inspected here.
- id: PMID:18585462
  title: Synaptic adhesion-like molecules (SALMs) promote neurite outgrowth.
  findings:
  - statement: In cultured hippocampal neurons, overexpression of each SALM, including
      SALM5, enhanced neurite outgrowth, while extracellular-LRR antibodies and RNAi reduced it.
    supporting_text: Over-expression of each SALM resulted in enhanced neurite outgrowth,
      but with different phenotypes. Neurite outgrowth could be reduced by applying antibodies
      targeting the extracellular leucine rich regions of SALMs and with RNAi.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Epitope-tagged SALM family proteins localized throughout axons, dendrites,
      and growth cones in cultured hippocampal neurons.
    supporting_text: Expression of epitope-tagged proteins in cultured hippocampal neurons
      showed that SALMs are distributed throughout neurons, including axons, dendrites,
      and growth cones.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed title and cached abstract were checked. The work includes SALM5
      but analyzes the whole family; it supports a broader neurite-outgrowth role rather
      than a uniquely SALM5-specific mechanism.
- id: PMID:20410109
  title: Selected SALM (synaptic adhesion-like molecule) family proteins regulate synapse
    formation.
  findings:
  - statement: SALM5, together with SALM3, induces both excitatory and inhibitory
      presynaptic differentiation in contacting axons.
    supporting_text: We found that expression of the SALM family proteins SALM3 and SALM5
      in nonneural and neural cells induces both excitatory and inhibitory presynaptic
      differentiation in contacting axons.
    reference_section_type: ABSTRACT
  - statement: SALM5 is enriched in synaptic fractions, but unlike SALM3, aggregated
      SALM5 does not cluster PSD-95 on dendritic surfaces.
    supporting_text: SALM3 and SALM5 proteins are enriched in synaptic fractions, and form
      strong (SALM3) or weak (SALM5) complexes with postsynaptic density-95 (PSD-95), an
      abundant postsynaptic scaffolding protein at excitatory synapses. Aggregation of SALM3,
      but not SALM5, on dendritic surfaces induces clustering of PSD-95.
    reference_section_type: ABSTRACT
  - statement: SALM5 knockdown reduces both the number and function of excitatory and
      inhibitory synapses in cultured rat hippocampal neurons.
    supporting_text: Knockdown of SALM5 reduces the number and function of excitatory and
      inhibitory synapses.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and title were checked. Direct rat SALM5 knockdown and mixed-culture
      assays establish a synaptogenic role, while the weak PSD-95 complex must not be mistaken
      for a canonical PDZ-tail interaction because SALM5 lacks that motif.
- id: PMID:27152329
  title: Neuron-specific SALM5 limits inflammation in the CNS via its interaction
    with HVEM.
  findings:
  - statement: Human and mouse SALM5 specifically bind HVEM/TNFRSF14; human HVEM did not
      detectably bind the other four human SALM family members in the reciprocal screen.
    supporting_text: The HVEM-Ig screening did not generate any positive signal in the
      wells containing the other four SALM family members, though members of the SALM
      family share about 50% homology in their protein sequences.
    reference_section_type: RESULTS
  - statement: The SALM5 LRR domain is sufficient for HVEM binding, whereas swapping its
      Ig or FN domain with SALM3 does not abolish binding.
    supporting_text: The LRR domain, but not the Ig or FN domain from SALM5, is sufficient
      to endow the binding capacity to HVEM
    reference_section_type: RESULTS
  - statement: Cell-surface SALM5 suppresses LPS-induced macrophage activation, and blocking
      endogenous SALM5-HVEM signaling aggravates inflammation in mouse CNS models.
    supporting_text: As shown in Fig. 2C, the production of both IL-6 and TNFα from the
      cultured macrophages was significantly inhibited by SALM5+ HEK293T cells. Therefore,
      SALM5 directly suppressed macrophage activation, likely by engaging a putative receptor
      on macrophages.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and title were checked. The molecular interaction is validated
      for human and mouse SALM5/HVEM, whereas macrophage suppression and EAE phenotypes are
      mouse experiments; this species boundary is essential for human LRFN5 interpretation.
- id: PMID:27225731
  title: SALM5 trans-synaptically interacts with LAR-RPTPs in a splicing-dependent manner
    to regulate synapse development.
  findings:
  - statement: Mouse SALM5 binds all three LAR-family receptor phosphatases, and the SALM5
      LRR-containing ectodomain engages their Ig domains.
    supporting_text: We found that SALM5-expressing cells coaggregated with cells expressing
      all three LAR-RPTPs (LAR, PTPδ, and PTPσ).
    reference_section_type: RESULTS
  - statement: In cell-aggregation assays, mini-exon B strongly inhibited SALM5 binding
      to LAR, PTPδ, and PTPσ; the study used mouse full-length SALM5 and mixed human/mouse
      LAR-RPTP constructs.
    supporting_text: Taken together, these results suggest that the meA and meB splice inserts
      in LAR-RPTPs differentially regulate SALM5 binding, and that the meB splice insert strongly
      inhibits the SALM5–LAR-RPTP interactions.
    reference_section_type: RESULTS
  - statement: Loss of SALM5-LAR-RPTP binding abolishes presynaptic induction and prevents
      rescue of AMPA-receptor-mediated transmission after SALM5 knockdown in rat hippocampal
      preparations.
    supporting_text: When a mutant SALM5 (S329/S360A) that lacks LAR binding was used in the
      rescue experiment, it failed to rescue EPSCAMPA (Fig. 6c).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and title were checked. This is the key mechanistic synaptic study,
      but its primary full-length SALM5 construct is mouse and its neuronal assays are rat.
      Its cell-aggregation splice-B result conflicts with later purified-protein SPR studies.
- id: PMID:29348429
  title: Structural basis of trans-synaptic interactions between PTPδ and SALMs for
    inducing synapse formation.
  findings:
  - statement: A human SALM5 LRR-Ig fragment and mouse PTPδ ectodomain fragment form a 2:2
      structural complex in which an SALM5 dimer bridges two PTPδ molecules.
    supporting_text: We determined the crystal structures of apo-SALM5 (LRR–Ig), and PTPδ
      (Ig1–Ig3)–SALM2 (LRR–Ig) and PTPδ (Ig1–Fn1)–SALM5 (LRR–Ig) complexes at 3.08, 3.16,
      and 4.18 Å resolutions, respectively (Fig. 1 and Table 1).
    reference_section_type: RESULTS
  - statement: Disrupting human SALM5 dimerization while retaining PTPδ binding strongly
      reduces presynapse-inducing activity, showing that dimerization is functionally required.
    supporting_text: Our synaptogenic co-culture assay using site-directed SALM5 mutants
      demonstrates that presynaptic differentiation induced by PTPδ-SALM5 requires the
      dimeric property of SALM5.
    reference_section_type: ABSTRACT
  - statement: Purified-protein SPR favored the PTPδ mini-exon-B-positive isoform, in contrast
      to the earlier cell-aggregation study.
    supporting_text: A9B– had a much lower (14%) affinity than A9B+ (Table 2 and Supplementary
      Fig. 2). The meB insertion likely plays an important role in placing PTPδ Ig3 at the
      position favorable for the interaction with SALM5 Ig.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and title were checked. The work directly tests human SALM5
      fragments and human SALM5 ectodomain in rodent-neuron synaptogenic assays. The structural
      PTPδ partner is mouse, and the opposing splice-B result is explicitly preserved.
- id: PMID:29348579
  title: Structural basis of SALM5-induced PTPδ dimerization for synaptic differentiation.
  findings:
  - statement: Human SALM5 LRR-Ig forms an antiparallel dimer that bridges two human PTPδ
      Ig1-3 molecules in a 2:2 heterotetrameric complex.
    supporting_text: For the SALM5/PTPδ complex crystal, the asymmetric unit contained one
      dimeric complex, in a 2:2 stoichiometry, where a central SALM5 dimer bridges two monomeric
      PTPδ molecules together.
    reference_section_type: RESULTS
  - statement: A dimer-disrupting human SALM5 mutation retains PTPδ binding but abolishes
      SALM5-induced synapsin-I clustering in a rat-neuron heterologous synapse assay.
    supporting_text: This meant that R110N/E160S mutation abrogated the capacity of SALM5
      to induce presynaptic differentiation. Taken together, disrupting SALM5 dimerization
      may significantly impair its functionality in mediating presynaptic differentiation.
    reference_section_type: RESULTS
  - statement: SPR with human fragments found that PTPδ mini-exon B enhances SALM5 binding
      by roughly 20- to 27-fold, conflicting with the earlier cell-aggregation result.
    supporting_text: In order to quantitatively evaluate how the splice inserts in PTPδ affect
      SALM5 binding, we carried out SPR experiments (Fig. 5), which clearly showed that the
      addition of MeB to PTPδ significantly enhanced PTPδ/SALM5 interaction (by 27 or 20 folds,
      respectively, for the presence or absence of MeA).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and title were checked. This paper provides direct human-human
      SALM5-PTPδ structural and biochemical evidence plus human SALM5 ectodomain assays on
      rat neurons; it also explicitly documents the splice-B discrepancy.
- id: PMID:32822567
  title: A Human IgSF Cell-Surface Interactome Reveals a Complex Network of Protein-Protein
    Interactions.
  findings:
  - statement: A human extracellular-domain interactome independently confirmed that human
      SALM5 binds each LAR-family receptor phosphatase, PTPRF, PTPRD, and PTPRS.
    supporting_text: With the exception of PTPRF-SALM4, we observed binding of all LAR-PTPRs
      to all SALMs
    reference_section_type: RESULTS
  - statement: The three human LAR-RPTP-SALM5 pairs were previously known interactions
      and were all validated by SPR in the study.
    supporting_text: SALM5PTPRDknownN/APTPRFknownN/APTPRSknownN/A
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and title were checked. This is direct human ectodomain binding
      evidence for all three LAR-RPTP partners, but it is an interaction-mapping study and
      does not itself establish synaptogenic consequences.
core_functions:
- description: >-
    At the postsynaptic cell surface, the LRFN5 LRR-Ig ectodomain binds the
    cell-adhesion receptors PTPRF, PTPRD, and PTPRS. Structures of isolated human
    SALM5 and PTPδ ectodomain fragments show a 2:2 assembly in which an SALM5
    dimer bridges two PTPδ molecules, and dimer-disrupting substitutions impair
    presynapse-inducing activity. Together with full-length rodent SALM5
    perturbation, this supports a transsynaptic organizer activity that promotes
    excitatory and inhibitory presynaptic differentiation and synaptic membrane
    adhesion. The preferred LAR-RPTP mini-exon-B state remains unresolved.
