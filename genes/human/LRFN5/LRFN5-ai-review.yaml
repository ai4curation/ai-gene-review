suggested_questions:
- question: >-
    Which mini-exon combinations of PTPRF, PTPRD, and PTPRS engage endogenous LRFN5
    in human neurons, and why do membrane aggregation and purified-protein assays
    report opposite effects of mini-exon B?
- question: >-
    Does endogenous full-length human LRFN5 form a defined 2:2 transsynaptic assembly,
    and which LAR-RPTP partners dominate at excitatory versus inhibitory synapses?
- question: >-
    How much of LRFN5-dependent presynaptic differentiation requires heterophilic
    LAR-RPTP binding versus homophilic SALM5-SALM5 adhesion?
- question: >-
    Does human neuronal LRFN5-HVEM engagement suppress microglial or macrophage
    activation in the CNS, and which cell-autonomous signaling steps mediate the effect?
suggested_experiments:
- hypothesis: >-
    Endogenous human LRFN5 promotes presynapse assembly through an extracellular
    dimerization-dependent interaction with a partner-selective subset of LAR-RPTPs.
  description: >-
    Create isogenic human induced-pluripotent-stem-cell-derived neurons with LRFN5
    knockout, structure-guided LAR-binding substitutions, or dimer-disrupting
    substitutions and repair each allele at the endogenous locus. In paired
    pre/postsynaptic cultures, quantify surface delivery, transsynaptic proximity,
    synapsin and active-zone assembly, excitatory and inhibitory synapse numbers,
    and miniature synaptic currents.
  experiment_type: Endogenous human-neuron structure-function analysis
- hypothesis: >-
    LAR-RPTP mini-exon B has a context-dependent effect on LRFN5 binding that differs
    between soluble ectodomains and membrane-confined synaptic contacts.
  description: >-
    Express matched human PTPRF, PTPRD, and PTPRS mini-exon variants at comparable
    abundance, then measure SALM5 binding by SPR, cell-surface aggregation, and
    direction-resolved human-neuron coculture. Couple binding measurements to
    presynaptic differentiation and rescue with interface-specific mutants.
  experiment_type: LAR-RPTP splice-code reconciliation
- hypothesis: >-
    Human neuronal LRFN5 suppresses innate immune activation through direct engagement
    of HVEM on macrophages or microglia.
  description: >-
    Build human neuron-microglia and neuron-macrophage cocultures with cell-type-
    specific CRISPR disruption of LRFN5 or TNFRSF14. Restore wild-type or
    binding-defective proteins and measure contact-dependent cytokine responses,
    NF-κB pathway activation, cell-state transitions, and neuronal synaptic integrity.
  experiment_type: Human CNS neuroimmune interface dissection
