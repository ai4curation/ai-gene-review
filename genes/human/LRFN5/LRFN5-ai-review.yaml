id: Q96NI6
gene_symbol: LRFN5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRFN5 (SALM5) is a neuronal type-I single-pass cell-surface adhesion protein
  with extracellular leucine-rich-repeat, immunoglobulin-like, and fibronectin
  type III domains. At synapses, its LRR-Ig ectodomain binds LAR-family receptor
  protein tyrosine phosphatases; isolated ectodomain fragments form 2:2
  SALM5-PTPδ assemblies, and SALM5 dimerization supports induction of excitatory
  and inhibitory presynaptic differentiation. LRFN5 lacks the C-terminal
  PDZ-binding motif present in SALM1-SALM3 and therefore is not a canonical
  PDZ-tail recruiter of PSD-95. Its LRR region also binds HVEM/TNFRSF14 and
  contributes to suppression of macrophage activation and inflammatory responses
  in the central nervous system.
