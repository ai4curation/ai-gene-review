- gap_statement: >-
    The stoichiometry, membrane directionality, and partner hierarchy of endogenous
    full-length human LRFN5 complexes at excitatory and inhibitory synapses are not
    established.
  boundary: >-
    Human ectodomain fragments bind all three LAR-RPTPs, isolated LRR-Ig fragments
    form 2:2 assemblies with PTPδ, and rodent full-length SALM5 promotes presynaptic
    differentiation. Fragment structures and heterologous assays do not establish
    an obligate stable 2:2 complex or partner occupancy in human neurons.
  gap_kind:
