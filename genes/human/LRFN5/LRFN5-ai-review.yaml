knowledge_gaps:
- gap_statement: >-
    Which LAR-RPTP splice forms bind endogenous full-length LRFN5 at synapses is
    unresolved, especially because cell-aggregation assays and purified-protein
    measurements report opposite effects of mini-exon B.
  boundary: >-
    A 2016 cell-aggregation study found that mini-exon B strongly inhibits
    SALM5-LAR-RPTP interactions, whereas two 2018 structural and SPR studies found
    that mini-exon B favors PTPδ binding. These assay systems differ in constructs,
    membrane context, and species and do not establish the occupied splice form in
    vivo.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    The splice code may determine when and where the SALM5 organizer is engaged and
    is necessary for interpreting partner-selective synaptic phenotypes.
  resolution: >-
    Compare matched human PTPRF, PTPRD, and PTPRS mini-exon variants using purified
    kinetics, membrane-tethered binding, and endogenous pre-to-postsynaptic contacts
    in paired human neurons.
