  review:
    summary: Convergent sequence and cellular activity evidence supports loss of conventional catalytic
      GAP activity in ARHGAP36. This conclusion does not negate its binding, signaling or cytoskeletal
      roles.
    action: REMOVE
    reason: The exact Q6ZRI8 leaf PTN002489201 is inside the clade inheriting GAP IBD PTN000973894. An
      ancestral GAP placement can be sound while a descendant loses catalysis. Domain-alignment controls
      map the conventional arginine finger to human T258 (isoform-2 T227); mouse Arhgap36 has the corresponding
      T246. In the independently re-read PMID:32203420 supplementary screen, human isoform 2 scores negative
      for RhoA, Rac1 and Cdc42 while positive controls work. This screen is not a purified GTP-hydrolysis
      assay and includes false-negative examples, so its result is interpreted together with the catalytic
      substitution and primary domain characterization. These convergent findings justify retaining REMOVE
      for conventional GAP catalysis, without asserting exclusion of every possible GTPase/condition or
      requiring that the entire ancestral node was wrongly placed. A subfamily difference, one donor,
      and an ND root annotation are not negative functional evidence. PKA-mediated RhoA activation and
      actin organization can remain when catalytic GAP activity is lost.
    propagation_review:
      root_cause: PROPAGATION_BAD
