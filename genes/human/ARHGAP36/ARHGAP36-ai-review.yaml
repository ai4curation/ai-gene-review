- id: file:human/ARHGAP36/ARHGAP36-bioinformatics/RESULTS.md
  title: 'ARHGAP36: the arginine finger UniProt annotates, and the residue that is there'
  findings:
  - statement: UniProt annotates an arginine-finger Site at position 258 of ARHGAP36 by PROSITE ProRule
      (ECO:0000255) and asserts GTPase activator activity by similarity (ECO:0000250); the residue at
      258 is a threonine.
  - statement: Three controls carrying their own annotated arginine finger all project onto position 258
      and each recovers every other control's finger, so the Site is in register; the nearest arginine
      is 7 residues away.
  - statement: Mouse Arhgap36 carries the same substitution at its own annotated Site 246, and the human
      and mouse sites project onto each other reciprocally, so the loss predates the rodent-primate split
      and lies well below the Eumetazoan node the IBD is placed at.
  - statement: The GTPase-contacting surface from PDB 1TX4 projects onto ARHGAP36 at 8 of 25 identical
      positions against 9 of 25 for mouse Arhgap6, so the binding surface is about as conserved as the
      catalysing family member's while the catalytic residue is not.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Generated by analyze_arhgap36.py in the same directory, which fetches everything live
      from UniProt, RCSB and PROSITE and has a --self-test asserting 16 propositions including two negative
      controls that must stay silent. The report states explicitly that a missing arginine finger is not
      on its own proof of inactivity, because the sibling ARHGAP11B analysis measured the converse, and
      the review's conclusion does not rest on it alone.
