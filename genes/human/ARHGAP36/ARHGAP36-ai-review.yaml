- id: PMID:32203420
  title: Systems analysis of RhoGEF and RhoGAP regulatory proteins reveals spatially organized RAC1 signalling
    from integrin adhesions.
  findings:
  - statement: In this paper's own Supplementary Table 2, under the RhoGEF/RhoGAP activity screen columns,
      ARHGAP36 scores negative for RhoA, negative for Rac1 and negative for Cdc42, while ARHGAP35 (RhoA+,
      Rac1+) and ARHGAP1 (RhoA+, Cdc42+) score positive in the same run.
  - statement: Supplementary Table 1 records the screened construct as human isoform 2, 517 aa, and gives
      the authors' own domain classification for ARHGAP36 verbatim as "GAP-like (arginine finger missing)".
  - statement: 'The screen contains known false-negative examples, but the all-negative fraction is not
      itself a false-negative rate: 15 of its 65 scorable GAP rows are negative for all three GTPases,
      and ARHGAP17/RICH1, a characterised Cdc42 GAP, is among them. Four of the six arginine-finger-less
      PROSITE-RhoGAP proteins present in the screen are all-negative, ARHGAP36 included, against that
      23 percent base rate.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The primary source of the negative functional result on this gene: a systematic screen
      of RhoGEF and RhoGAP regulatory proteins, in which ARHGAP36 had no effect on RAC1, CDC42 or RHOA
      activity. The article is not open access -- Europe PMC returns no PMC id and isOpenAccess N -- so
      the cached record is abstract-only and no supporting_text is quoted from it anywhere in this review.
      The identity of PMID:33999959''s reference [25] as this paper was verified against the PLOS bibliography
      rather than inferred.

      The supplementary workbook, however, is freely downloadable, and the result was read from it directly
      by ARHGAP36-bioinformatics/scan_muller_supplementary.py rather than taken on the citation. Supplementary
      Table 2, activity-screen columns: ARHGAP36 negative for RhoA, Rac1 and Cdc42, with ARHGAP35 and
      ARHGAP1 positive in the same run. Supplementary Table 1: the screened construct is human isoform
      2, 517 aa, and the authors'' own domain call is "GAP-like (arginine finger missing)". Those readings
      are recorded here and in the GO:0005096 reason rather than as supporting_text, because supporting_text
      is validated as a substring of the cached publication and a quote from a supplementary file could
      not be checked there.

      The findings above are attached to this reference and not to the bioinformatics report, because
      they are statements about what this paper contains. They carry no supporting_text for the reason
      just given. The re-derivation lives in ARHGAP36-bioinformatics/scan_muller_supplementary.py and
      its committed output muller2020_arhgap36.json.

      Listed HIGH because it is the decisive experiment, and flagged as one an ARHGAP36-titled literature
      search does not return: its title names RAC1 signalling at integrin adhesions.'
- id: PMID:27481945
  title: 'Deciphering the Molecular and Functional Basis of RHOGAP Family Proteins: A SYSTEMATIC APPROACH
    TOWARD SELECTIVE INACTIVATION OF RHO FAMILY PROTEINS.'
  findings:
  - statement: A systematic survey of the human RHOGAP family found that 9 of the 66 RHOGAP-domain proteins
      do not have a catalytic domain capable of terminating RHO protein signalling.
    supporting_text: Using database searches, we extracted 66 distinct human RHOGAPs, from which 57 have
