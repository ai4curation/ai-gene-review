- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000198
  review:
    summary: >-
      True but maximally general, and supplied by the signature of the one domain in this protein
      that does not work. ARHGAP36 is a signal transduction protein, and the specific process is
      well evidenced across six primary papers: it raises Hedgehog pathway output by inhibiting
      PKA and shifting GLI towards its activator form.
    action: MODIFY
    reason: >-
      GO:0007165 is the most general biological-process term available for signalling, and it
      arrives here from IPR000198, the RhoGAP domain signature. The domain is genuinely present,
      so the mapping has not misfired; it simply cannot see that the domain is catalytically dead
      and that the protein's signalling role comes from somewhere else entirely.

      The specific process is not in doubt. PMID:25024229 identified Arhgap36 in a genome-scale
      screen as a positive regulator of the Hedgehog pathway that inhibits Gli repressor formation
      and promotes activation of full-length Gli. PMID:27713425 supplied the mechanism, direct
      pseudosubstrate inhibition of the PKA catalytic subunit. PMID:42405753 confirmed it in an
      independent system. PMID:31305241 placed it downstream of Shh in lateral motor column
      specification.

      GO:0045880 is proposed with one complication stated rather than hidden. PMID:30598432
      reports that the pool of ARHGAP36 held at the mother centriole keeps centrosomal PKAc low,
      which prevents Inversin phosphorylation and thereby restrains Smoothened ciliary
      translocation; knockdown raises both PKAc and phosphorylated Inversin. PKA has opposing
      roles in this pathway, generating GLI repressor on one arm and promoting Smoothened
      trafficking on the other, so an inhibitor of PKA is negative on one step and positive on the
      other. Every paper that measures pathway output rather than an individual step reports an
      increase, so the positive term is the right summary, and the step-level exception is
      recorded here.

      A more literal term would be better and does not exist. GO has no Hedgehog pathway term that
      is not anchored on Smoothened, checked on two independent services: OLS4 and QuickGO's
      ontology search return the same Smoothened-anchored set. The two terms that would have
      fitted an activator acting downstream of Smoothened, GO:0007228 and GO:1990787 for
      regulation of hh target transcription factor activity, are both obsolete, confirmed on the
      GO API and on QuickGO. GO:0045880 is nonetheless well precedented for downstream regulators:
      its human annotations include STK36, CDK1, MAPK1, GAS1 and EVC. The gap is raised in
      suggested_questions.
    proposed_replacement_terms:
    - id: GO:0045880
      label: positive regulation of smoothened signaling pathway
    supported_by:
    - reference_id: PMID:25024229
      supporting_text: >-
        Arhgap36 acts in a Smoothened (Smo)-independent manner to inhibit Gli repressor formation
        and to promote the activation of full-length Gli proteins.
    - reference_id: PMID:42405753
      supporting_text: >-
        Arhgap36 depletes the levels of PKA and its catalytic subunit PKAC, both strongly
        activating Hh signaling and making signal transduction less dependent on regulation via
        Smoothened.
- term:
    id: GO:0015629
    label: actin cytoskeleton
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1196332
  - PANTHER:PTN000973894
  review:
    summary: >-
      Over-annotated. Four independent papers localise ARHGAP36 to the plasma membrane, to
      endosomal and lysosomal vesicles, to the mother centriole and to the primary cilium. None
      places it in the actin cytoskeleton, and is_active_in is a claim about where the protein
      does its work.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The compartment travels with the same IBD as the other two IBA rows, from a donor whose
      actin association follows from its RhoGAP activity. ARHGAP36's own localisation has been
      examined repeatedly and consistently lands elsewhere. PMID:27713425 found human ARHGAP36
      isoform 2 concentrated at the plasma membrane, recruiting PKAC onto vesicles that colocalise
      with HRS, LAMP1 and EEA1. PMID:30598432 localised it to the centrosome and mother centriole
      in a Patched1-dependent manner. PMID:33999959 reports that four of the five isoforms reach
      the plasma membrane while isoform 1 is perinuclear, and that isoform 3 accumulates in the
      primary cilium.

      Marked over-annotated rather than removed because the evidence is an absence rather than a
      contradiction. No experiment has tested whether ARHGAP36 is present on actin structures and
      found it absent, and PMID:41644816 places some of its activity at adherens junctions, which
      are actin-associated. The honest statement is that the localisation is unsupported by
      anything specific to this gene, not that it has been ruled out. If a curator wanted a
      compartment for this protein, the evidence supports the plasma membrane and the centrosome,
      and the former is proposed as a new annotation below.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: MGI:MGI:1196332
        source_label: mouse Arhgap6
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The donor's actin-cytoskeleton localisation is a consequence of its being a working
          RhoGAP that remodels actin. The compartment is inherited here along with an activity the
          target does not have.
      residue_claims_not_applicable: >-
        A localisation claim is not a point-residue question. The objection is that the compartment
        was transferred with the activity rather than observed on this protein, and ARHGAP36's own
        localisation data point elsewhere.
    supported_by:
    - reference_id: PMID:27713425
      supporting_text: >-
        ARHGAP36 expressed alone was concentrated at the plasma membrane, while PKAC appeared
        largely cytosolic.
    - reference_id: PMID:30598432
      supporting_text: >-
        We find that Patched1 interacts with and stabilizes the PKA negative regulator ArhGAP36 to
        the centrosome.
- term:
    id: GO:0004862
    label: cAMP-dependent protein kinase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:27713425
  qualifier: enables
  isoform: Q6ZRI8-2
  review:
    summary: >-
      Proposed new annotation. This is what ARHGAP36 does, and after removing GO:0005096 the gene
      would otherwise carry no molecular function at all. An N-terminal pseudosubstrate motif
      binds the PKA catalytic subunit and blocks its catalysis, measured on purified components
      with PKI as the in-assay comparator.
    action: NEW
    reason: >-
      PMID:27713425 establishes each half of the term's definition, binds to and stops or reduces
      the activity of a cAMP-dependent protein kinase, on the human protein. Binding: the
      interaction site maps to a 25-residue N-terminal sequence requiring R153 and R154, which
      docks into the acidic active-site cleft of PKAC, and a synthesised peptide of that sequence
      binds purified PKAC with high nanomolar affinity by isothermal titration calorimetry.
      Inhibition: an in vitro kinase assay with recombinant PKAC showed the peptide strongly
      reducing the phosphorylated fraction of a PKA substrate, with a PKI peptide achieving a
      similar extent at equal concentration in the same assay, and a cellular FRET biosensor
      reproducing the effect for the full-length protein. The evidence code is IDA and the
      constructs are stated in the methods to be human ARHGAP36 Q6ZRI8-2, so this is a human
      experiment on a named isoform rather than an inference from an ortholog.

      The comparator check supports the term rather than merely permitting it. Its human
      annotations are carried by the PKI pseudosubstrate family, PKIA, PKIB and PKIG, and by the
      PKA regulatory subunits PRKAR1A, PRKAR1B, PRKAR2A and PRKAR2B, which is exactly the class of
      entity that occupies the PKAC active-site cleft and blocks catalysis. Eccles et al. make
      that comparison themselves and in the same experiment.

      Recorded as this specific inhibitor term rather than as protein binding, which would record
      that ARHGAP36 touches PKAC while discarding the only thing known about what it does to it.
      The separate ubiquitin-dependent lysosomal degradation of PKAC described in the same paper
      is a different assertion about a different mechanism and is not proposed here.

      The isoform field records what was tested, not a claim that the activity is unique to
      isoform 2. It is noted because PMID:33999959 reports that isoform 1, which is the UniProt
      canonical displayed sequence, is perinuclear and does not activate Gli, so the isoform a
      curator works from is not an incidental detail on this gene.
    supported_by:
    - reference_id: PMID:27713425
      supporting_text: >-
        These experiments demonstrate the direct interaction between ARHGAP36 and PKAC, mediated
        by a pseudosubstrate motif on ARHGAP36.
    - reference_id: PMID:27713425
      supporting_text: >-
        First, we performed an in vitro kinase assay with recombinant PKAC. Addition of 36i peptide
        strongly reduced the fraction of phosphorylated PKA substrate (Fig. 3a).
    - reference_id: PMID:27713425
      supporting_text: >-
        The above experiments collectively demonstrate that ARHGAP36 is a pseudosubstrate
        inhibitor of PKAC with potency comparable to PKI.
    - reference_id: PMID:27713425
      supporting_text: >-
        The full-length sequence refers to human ARHGAP36 UniProt ID: Q6ZRI8-2.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:27713425
  qualifier: located_in
  isoform: Q6ZRI8-2
  review:
    summary: >-
      Proposed new annotation. Human ARHGAP36 isoform 2 concentrates at the plasma membrane, and
      membrane localisation is where it captures PKAC. After marking GO:0015629 over-annotated the
      gene would otherwise have no cellular component at all.
    action: NEW
    reason: >-
      PMID:27713425 imaged human ARHGAP36 Q6ZRI8-2 in MDCK cells and found it concentrated at the
      plasma membrane while PKAC, expressed alone, was largely cytosolic; on coexpression PKAC was
      recruited to ARHGAP36. PMID:33999959 reports the same for four of the five isoforms and ties
      the localisation to function: the variants that reach the plasma membrane are the ones that
      activate Gli, while isoform 1 is perinuclear and does not. So this is not an incidental
