- id: PMID:25024229
  title: Arhgap36-dependent activation of Gli transcription factors.
  findings:
  - statement: Arhgap36 was identified in a genome-scale cDNA overexpression screen as a positive regulator
      of the Hedgehog pathway that acts independently of Smoothened, inhibiting Gli repressor formation
      and promoting activation of full-length Gli proteins.
    supporting_text: Arhgap36 acts in a Smoothened (Smo)-independent manner to inhibit Gli repressor formation
      and to promote the activation of full-length Gli proteins.
  - statement: The paper that discovered this gene's Hedgehog function names the residue that replaced
      the arginine finger and concludes that catalytic GAP function may not be required for its Gli-activating
      activity.
    supporting_text: The replacement of this structural element with a threonine (T246) suggests that
      catalytic GAP domain function may not be required for Arhgap36-induced Gli activation.
    reference_section_type: RESULTS
  - statement: Two further residues structurally equivalent to those required for Rho GAP function in
      Graf were mutated without loss of Gli activation.
    supporting_text: we mutated two other Arhgap36 residues, K283 and R287, which are structurally equivalent
      to those necessary for Rho GAP function in Graf
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text retrieved from PMC4121843 on re-fetch with --force after an initial abstract-only
      cache. This is the founding functional paper for the gene and one of the two independent full-text
      sources for the arginine-finger loss. Its T246 numbering is mouse canonical numbering; that correspondence
      was not assumed but derived, and is shown in section 4 of the bioinformatics report.
- id: PMID:27713425
  title: Bimodal antagonism of PKA signalling by ARHGAP36.
  findings:
  - statement: ARHGAP36 binds the PKA catalytic subunit directly through an N-terminal pseudosubstrate
      motif, mapped to a 25-residue sequence requiring R153 and R154, which docks into the acidic active-site
      cleft of PKAC.
    supporting_text: These experiments demonstrate the direct interaction between ARHGAP36 and PKAC, mediated
      by a pseudosubstrate motif on ARHGAP36.
  - statement: Inhibition of PKAC catalysis was measured on purified components, with a PKI peptide as
      the positive control in the same assay.
    supporting_text: First, we performed an in vitro kinase assay with recombinant PKAC. Addition of 36i
      peptide strongly reduced the fraction of phosphorylated PKA substrate (Fig. 3a).
  - statement: The authors' own summary of the inhibition experiments, stated in terms of the PKI comparison.
    supporting_text: The above experiments collectively demonstrate that ARHGAP36 is a pseudosubstrate
      inhibitor of PKAC with potency comparable to PKI.
  - statement: ARHGAP36 expressed alone concentrates at the plasma membrane, while PKAC is otherwise largely
      cytosolic and is recruited onto vesicles on coexpression.
    supporting_text: ARHGAP36 expressed alone was concentrated at the plasma membrane, while PKAC appeared
      largely cytosolic.
  - statement: The constructs are explicitly the human protein, isoform 2, which is what makes the localisation
      and inhibition results assignable to Q6ZRI8-2 rather than to an ortholog.
    supporting_text: 'The full-length sequence refers to human ARHGAP36 UniProt ID: Q6ZRI8-2.'
    reference_section_type: METHODS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text available and read. The single most important reference for this gene''s
      molecular function: it is the only one that measures an activity of ARHGAP36 on purified components,
      and it identifies the responsible domain as the N-terminal arginine-rich region rather than the
      Rho-GAP domain. Notably this paper does not discuss GAP activity at all; the same laboratory later
      published the systematic screen (PMID:32203420) that reported none.'
- id: PMID:33999959
  title: Structure-activity mapping of ARHGAP36 reveals regulatory roles for its GAP homology and C-terminal
    domains.
  findings:
  - statement: ARHGAP36 lacks the arginine finger conserved in catalytically active RhoGAP homologs and
      has no effect on the activities of Rac1, Cdc42 or RhoA; residues structurally equivalent to those
      associated with GTP hydrolysis are not required for its Gli-activating function.
    supporting_text: However, the GAP-like region in ARHGAP36 lacks the “arginine finger” motif conserved
      in catalytically active homologs [7, 24], and ARHGAP36 has no effect on the activities of Rac1,
      Cdc42, and Rho A [25]. In addition, ARHGAP36 residues that are structurally equivalent to those
      previously associated with GTP hydrolysis are not required for ARHGAP36-mediated Gli activation
      [7].
  - statement: The residue occupying the arginine-finger position is named explicitly, in the numbering
      of human isoform 2.
    supporting_text: the site that is structurally equivalent to the arginine finger (Thr227) is shown
      in blue.
  - statement: The GAP-like domain is retained as a protein interaction module rather than a catalytic
      one, which is the resolution reached for other non-catalytic RhoGAP-domain proteins.
    supporting_text: other Rho GAPs lacking the catalytic arginine finger have been found to mediate non-catalytic
      protein-protein interactions
  - statement: 'Isoform 1, the UniProt canonical sequence, behaves differently from the other four: it
      is perinuclear and does not activate Gli, whereas the others reach the plasma membrane and do.'
    supporting_text: isoform 1 adopts a perinuclear distribution and does not affect Gli function, while
      the other four variants localize to the plasma membrane and can activate Gli transcription factors
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and read. Its citation [25], resolved against the journal's own
      bibliography at journals.plos.org (DOI 10.1371/journal.pone.0251684), is Muller et al. 2020 Nat
      Cell Biol, PMID:32203420. Recording that resolution matters because it is the only route from this
      review to the primary negative GAP result, whose own cached record is abstract-only.
- id: PMID:30598432
  title: Patched1-ArhGAP36-PKA-Inversin axis determines the ciliary translocation of Smoothened for Sonic
    Hedgehog pathway activation.
  findings:
  - statement: Patched1 interacts with and stabilises ArhGAP36 at the centrosome, and activating the Shh
      pathway removes ArhGAP36 from the mother centriole, allowing centrosomal PKA to accumulate.
    supporting_text: We find that Patched1 interacts with and stabilizes the PKA negative regulator ArhGAP36
      to the centrosome. Activating the Shh pathway results in the removal of ArhGAP36 from the mother
      centriole and the centrosomal PKA accumulation.
  - statement: Knockdown of ArhGAP36 raises PKAc and phosphorylated Inversin, establishing the sign of
      the endogenous relationship by loss of function rather than by overexpression.
    supporting_text: we knocked down ArhGAP36 in WT cells and found that ArhGAP36 knockdown significantly
      increased the protein level of PKAc and pInvs
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text retrieved from PMC6338837. Important for two reasons that pull in different
      directions, and the review states both: it is independent confirmation that ARHGAP36 negatively
      regulates PKA, and it is the one paper in which ARHGAP36 restrains rather than promotes a Hedgehog
      pathway step, namely Smoothened ciliary translocation.'
