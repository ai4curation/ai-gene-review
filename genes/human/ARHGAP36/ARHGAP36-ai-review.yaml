- id: PMID:40378841
  title: Molecular and genetic characterization of sex-linked orange coat color in the domestic cat.
  findings:
  - statement: An independent group restates the resolution of the GAP question, that ARHGAP36 acts as
      a PKA inhibitor rather than on Rho GTPases, and supplies an in vivo readout of PKAC depletion in
