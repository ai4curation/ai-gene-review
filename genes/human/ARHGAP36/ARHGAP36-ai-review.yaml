id: Q6ZRI8
gene_symbol: ARHGAP36
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ARHGAP36 is an X-linked, tissue-restricted signalling protein that carries a Rho-GAP fold but
  works as an inhibitor of protein kinase A rather than as a GTPase activator. Its N-terminal
  arginine-rich region is a pseudosubstrate motif that docks into the acidic active-site cleft of
  the PKA catalytic subunit, blocking catalysis with a potency comparable to the PKI family, and
  in addition routes PKAC into a ubiquitin-dependent lysosomal degradation pathway. Because PKA
  phosphorylates GLI2 and GLI3 to generate their transcriptional repressor forms, removing PKA
  activity shifts the GLI pool towards full-length activator and turns on Hedgehog target genes
  without any requirement for ligand or for Smoothened; the protein also accumulates GLI proteins
  in the primary cilium, and this output depends on the ciliogenesis machinery KIF3A and IFT88.
  A separate pool held at the mother centriole by Patched1 restrains the centrosomal PKA that
  phosphorylates Inversin, and is displaced when the pathway is activated, placing ARHGAP36 inside
  the ciliary trafficking step as well as downstream of it. The protein sits mainly at the plasma
  membrane and on endosomal and lysosomal vesicles, with an isoform whose N-terminal extension
  keeps it perinuclear and inactive. Expression is narrow and developmentally controlled: it is
  induced by the Isl1-Lhx3 complex in lateral motor column neurons downstream of Shh, is present
  in the hair follicle outer root sheath near the stem cell bulge, and is directly activated by
  FOXC1. Its Rho-GAP domain has lost the catalytic arginine finger and does not accelerate
  hydrolysis by RAC1, CDC42 or RHOA, but remains a protein interaction module that binds PREPL
  and contributes to regulation of the protein. Misexpression drives disease across tissues:
  noncoding duplications at Xq26.1 cause Bazex-Dupre-Christol syndrome with basal cell
  carcinomas, enhancer hijacking produces heterotopic ossification, overexpression accompanies
  Smoothened-inhibitor resistance in medulloblastoma, and in the domestic cat a regulatory
  deletion driving melanocyte expression lowers PKAC and produces orange coat colour.
