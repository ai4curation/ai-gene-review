functional_isoforms:
- id: ARHGAP36_PERINUCLEAR_INACTIVE
  name: isoform 1 (UniProt canonical, perinuclear and Gli-inactive)
  type: SPLICE_CLASS
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q6ZRI8-1
  description: >-
    The displayed canonical sequence in UniProt, and the one form of ARHGAP36 reported not to
    work. Expressed in cultured cells it adopts a perinuclear distribution and does not affect
    Gli function, whereas the other four variants reach the plasma membrane and activate Gli
    transcription factors (PMID:33999959). The difference is an N-terminal extension: isoforms 2
    to 5 each begin with a different, shorter N-terminus, and membrane localisation is what
    brings the protein to where it captures PKAC. This class is recorded because the canonical
    sequence being the inactive variant is a trap for any pipeline that reads the UniProt entry
    and assumes the displayed isoform is representative; no functional experiment in the
    ARHGAP36 literature uses it.
- id: ARHGAP36_MEMBRANE_ACTIVE
  name: isoforms 2 to 5 (plasma membrane, Gli-activating)
  type: SPLICE_CLASS
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q6ZRI8-2
    - Q6ZRI8-3
    - Q6ZRI8-4
    - Q6ZRI8-5
  description: >-
    The functional class. These four localise to the plasma membrane and activate Gli
    transcription factors (PMID:33999959); isoform 3 additionally accumulates within the primary
    cilium. Every functional experiment in the literature uses a member of this class, and
    isoform 2 in particular: it is the construct in the PKAC binding, inhibition and degradation
    work (PMID:27713425, stated in the methods as Q6ZRI8-2) and the template for the
    high-throughput mutagenesis screen of the GAP-like domain (PMID:33999959). Isoform 2 also
    carries an N-terminal autoinhibitory motif that the C-terminal domain counteracts, so the
    class is not internally uniform in regulation even though its members share localisation and
    Gli activity. No GO term is declared isoform-specific here: the two NEW annotations in this
    review record Q6ZRI8-2 in their isoform field because that is what was tested, not because
    the activity has been shown to be unavailable to isoform 1.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      The pipeline is sound and IPR000198 genuinely matches this protein: ARHGAP36 has a
      structurally intact Rho-GAP fold. What the signature cannot see is that the fold has lost
      its catalytic residue, so the GO:0007165 it supplies is true of ARHGAP36 for reasons
      unrelated to the domain that triggered it. See the GO:0007165 row.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PAINT itself is not at fault; the node placement is. All three IBA rows on this gene descend
      from a single IBD on PANTHER node PTN000973894 at taxon:6072 (Eumetazoa), seeded by one
      gene, mouse Arhgap6 (MGI:MGI:1196332), which is in subfamily PTHR12635:SF6. ARHGAP36 is in
      PTHR12635:SF8. Source data read from interpro/panther/PTHR12635/PTHR12635-paint.tsv and
      PTHR12635-entries.csv in this repository.
- id: PMID:25024229
  title: Arhgap36-dependent activation of Gli transcription factors.
  findings:
  - statement: >-
      Arhgap36 was identified in a genome-scale cDNA overexpression screen as a positive regulator
      of the Hedgehog pathway that acts independently of Smoothened, inhibiting Gli repressor
      formation and promoting activation of full-length Gli proteins.
    supporting_text: >-
      Arhgap36 acts in a Smoothened (Smo)-independent manner to inhibit Gli repressor formation
      and to promote the activation of full-length Gli proteins.
  - statement: >-
      The paper that discovered this gene's Hedgehog function names the residue that replaced the
      arginine finger and concludes that catalytic GAP function may not be required for its
      Gli-activating activity.
    supporting_text: >-
      The replacement of this structural element with a threonine (T246) suggests that catalytic
      GAP domain function may not be required for Arhgap36-induced Gli activation.
    reference_section_type: RESULTS
  - statement: >-
      Two further residues structurally equivalent to those required for Rho GAP function in Graf
      were mutated without loss of Gli activation.
    supporting_text: >-
      we mutated two other Arhgap36 residues, K283 and R287, which are structurally equivalent to
      those necessary for Rho GAP function in Graf
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text retrieved from PMC4121843 on re-fetch with --force after an initial abstract-only
      cache. This is the founding functional paper for the gene and one of the two independent
      full-text sources for the arginine-finger loss. Its T246 numbering is mouse canonical
      numbering; that correspondence was not assumed but derived, and is shown in section 4 of
      the bioinformatics report.
- id: PMID:27713425
  title: Bimodal antagonism of PKA signalling by ARHGAP36.
  findings:
  - statement: >-
      ARHGAP36 binds the PKA catalytic subunit directly through an N-terminal pseudosubstrate
      motif, mapped to a 25-residue sequence requiring R153 and R154, which docks into the acidic
      active-site cleft of PKAC.
    supporting_text: >-
      These experiments demonstrate the direct interaction between ARHGAP36 and PKAC, mediated by
      a pseudosubstrate motif on ARHGAP36.
  - statement: >-
      Inhibition of PKAC catalysis was measured on purified components, with a PKI peptide as the
      positive control in the same assay.
    supporting_text: >-
      First, we performed an in vitro kinase assay with recombinant PKAC. Addition of 36i peptide
      strongly reduced the fraction of phosphorylated PKA substrate (Fig. 3a).
  - statement: >-
      The authors' own summary of the inhibition experiments, stated in terms of the PKI
      comparison.
    supporting_text: >-
      The above experiments collectively demonstrate that ARHGAP36 is a pseudosubstrate inhibitor
      of PKAC with potency comparable to PKI.
  - statement: >-
      ARHGAP36 expressed alone concentrates at the plasma membrane, while PKAC is otherwise
      largely cytosolic and is recruited onto vesicles on coexpression.
    supporting_text: >-
      ARHGAP36 expressed alone was concentrated at the plasma membrane, while PKAC appeared
      largely cytosolic.
  - statement: >-
      The constructs are explicitly the human protein, isoform 2, which is what makes the
      localisation and inhibition results assignable to Q6ZRI8-2 rather than to an ortholog.
    supporting_text: >-
      The full-length sequence refers to human ARHGAP36 UniProt ID: Q6ZRI8-2.
    reference_section_type: METHODS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. The single most important reference for this gene's molecular
      function: it is the only one that measures an activity of ARHGAP36 on purified components,
      and it identifies the responsible domain as the N-terminal arginine-rich region rather than
      the Rho-GAP domain. Notably this paper does not discuss GAP activity at all; the same
      laboratory later published the systematic screen (PMID:32203420) that reported none.
- id: PMID:33999959
  title: Structure-activity mapping of ARHGAP36 reveals regulatory roles for its GAP
    homology and C-terminal domains.
  findings:
  - statement: >-
      ARHGAP36 lacks the arginine finger conserved in catalytically active RhoGAP homologs and has
      no effect on the activities of Rac1, Cdc42 or RhoA; residues structurally equivalent to
      those associated with GTP hydrolysis are not required for its Gli-activating function.
    supporting_text: >-
      However, the GAP-like region in ARHGAP36 lacks the “arginine finger” motif conserved in
      catalytically active homologs [7, 24], and ARHGAP36 has no effect on the activities of Rac1,
      Cdc42, and Rho A [25]. In addition, ARHGAP36 residues that are structurally equivalent to
      those previously associated with GTP hydrolysis are not required for ARHGAP36-mediated Gli
      activation [7].
  - statement: >-
      The residue occupying the arginine-finger position is named explicitly, in the numbering of
      human isoform 2.
    supporting_text: >-
      the site that is structurally equivalent to the arginine finger (Thr227) is shown in blue.
  - statement: >-
      The GAP-like domain is retained as a protein interaction module rather than a catalytic one,
      which is the resolution reached for other non-catalytic RhoGAP-domain proteins.
    supporting_text: >-
      other Rho GAPs lacking the catalytic arginine finger have been found to mediate
      non-catalytic protein-protein interactions
  - statement: >-
      Isoform 1, the UniProt canonical sequence, behaves differently from the other four: it is
      perinuclear and does not activate Gli, whereas the others reach the plasma membrane and do.
    supporting_text: >-
      isoform 1 adopts a perinuclear distribution and does not affect Gli function, while the
      other four variants localize to the plasma membrane and can activate Gli transcription
      factors
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. Its citation [25], resolved against the journal's own
      bibliography at journals.plos.org (DOI 10.1371/journal.pone.0251684), is Muller et al. 2020
      Nat Cell Biol, PMID:32203420. Recording that resolution matters because it is the only
      route from this review to the primary negative GAP result, whose own cached record is
      abstract-only.
- id: PMID:30598432
  title: Patched1-ArhGAP36-PKA-Inversin axis determines the ciliary translocation of
    Smoothened for Sonic Hedgehog pathway activation.
  findings:
  - statement: >-
      Patched1 interacts with and stabilises ArhGAP36 at the centrosome, and activating the Shh
      pathway removes ArhGAP36 from the mother centriole, allowing centrosomal PKA to accumulate.
    supporting_text: >-
      We find that Patched1 interacts with and stabilizes the PKA negative regulator ArhGAP36 to
      the centrosome. Activating the Shh pathway results in the removal of ArhGAP36 from the
      mother centriole and the centrosomal PKA accumulation.
  - statement: >-
      Knockdown of ArhGAP36 raises PKAc and phosphorylated Inversin, establishing the sign of the
      endogenous relationship by loss of function rather than by overexpression.
    supporting_text: >-
      we knocked down ArhGAP36 in WT cells and found that ArhGAP36 knockdown significantly
      increased the protein level of PKAc and pInvs
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text retrieved from PMC6338837. Important for two reasons that pull in different
      directions, and the review states both: it is independent confirmation that ARHGAP36
      negatively regulates PKA, and it is the one paper in which ARHGAP36 restrains rather than
      promotes a Hedgehog pathway step, namely Smoothened ciliary translocation.
- id: PMID:31305241
  title: Critical roles of ARHGAP36 as a signal transduction mediator of Shh pathway
    in lateral motor columnar specification.
  findings:
  - statement: >-
      ARHGAP36 is a direct target of the motor-neuron Isl1-Lhx3 complex, and it promotes
      Gli-dependent transactivation partly by inhibiting PKA activity.
    supporting_text: >-
      Arhgap36 is a direct target gene of Isl1-Lhx3 complex during MN generation. The action of
      ARHGAP36 is to promote Gli-dependent transactivation partly through inhibition of PKA
      activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Establishes the developmental context and an in vivo requirement, but the
      system is mouse spinal cord, so it informs the biology rather than supplying a human
      experimental annotation.
- id: PMID:32203420
  title: Systems analysis of RhoGEF and RhoGAP regulatory proteins reveals spatially
    organized RAC1 signalling from integrin adhesions.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The primary source of the negative functional result on this gene: a systematic screen of
      RhoGEF and RhoGAP regulatory proteins, in which ARHGAP36 had no effect on RAC1, CDC42 or
      RHOA activity. The cached record is abstract-only, so no supporting_text is quoted from it
      anywhere in this review; the claim is carried by the verbatim sentence in PMID:33999959,
      which cites this paper as its reference [25]. The identity of that citation was verified
      against the PLOS bibliography rather than inferred. Listed HIGH because it is the decisive
      experiment even though this review cannot quote it, and because it is exactly the paper an
      ARHGAP36-titled literature search does not return.
- id: PMID:27481945
  title: 'Deciphering the Molecular and Functional Basis of RHOGAP Family Proteins:
    A SYSTEMATIC APPROACH TOWARD SELECTIVE INACTIVATION OF RHO FAMILY PROTEINS.'
  findings:
  - statement: >-
      A systematic survey of the human RHOGAP family found that 9 of the 66 RHOGAP-domain proteins
      do not have a catalytic domain capable of terminating RHO protein signalling.
    supporting_text: >-
      Using database searches, we extracted 66 distinct human RHOGAPs, from which 57 have a common
      catalytic domain capable of terminating RHO protein signaling by stimulating the slow
      intrinsic GTP hydrolysis (GTPase) reaction.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only even after a forced re-fetch, so only the abstract is quoted.
      The body, read at PMC5034035, names ARHGAP36 first in its list of RHOGAP-domain proteins
      that lack an arginine finger, under the section heading "Not all RHOGAP Domain-containing
      Proteins Are GAPs", and states that the serine, threonine or glutamine found there cannot
      substitute for the arginine function. It also gives OCRL1 as the documented case of a
      RHOGAP-domain protein that binds GTP-bound RAC1 without stimulating hydrolysis, which is the
      precedent this review uses to keep the UniProt RAC1 interaction separate from the catalytic
      claim. That body text is deliberately not quoted as supporting_text because it is not in the
      cache.
- id: PMID:35986704
  title: Germline intergenic duplications at Xq26.1 underlie Bazex-Dupré-Christol basal
    cell carcinoma susceptibility syndrome.
  findings:
  - statement: >-
      Noncoding intergenic duplications at Xq26.1 dysregulate ARHGAP36, and ARHGAP36 protein is
      elevated in telogen hair follicles, basal cell carcinomas and trichoepitheliomas from
      affected individuals.
    supporting_text: >-
      found increased ARHGAP36 levels in hair follicles in telogen, in BCCs and in
      trichoepitheliomas from patients with BDCS.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The only functional reference in the UniProt entry for this protein, and the source of
      UniProt's SUBUNIT line recording an interaction with the active form of RAC1 via the
      Rho-GAP domain on ECO:0000269. The cached record is abstract-only and the abstract does not
      mention RAC1, so that interaction is not quoted or relied on as evidence here; it is
      discussed in the GO:0005096 row only to state explicitly what the REMOVE does and does not
      cover. Not returned by the deep-research provider, whose title-based retrieval had no
      reason to surface a dermatology genetics paper.
- id: PMID:40378841
  title: Molecular and genetic characterization of sex-linked orange coat color in
    the domestic cat.
  findings:
  - statement: >-
      An independent group restates the resolution of the GAP question, that ARHGAP36 acts as a
      PKA inhibitor rather than on Rho GTPases, and supplies an in vivo readout of PKAC depletion
      in melanocytes.
    supporting_text: >-
      Arhgap36 functioned not as a Rho GTPase inhibitor but as an inhibitor of PKA signaling by
      directly binding the catalytic subunit of PKA (PKAC) and targeting it for lysosomal
      degradation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. The organism is the domestic cat, so it supplies no human annotation, but
      it is a useful third-party statement of how the field now reads the GAP domain and it shows
      the PKA relationship holding in a whole animal. Published version of the preprint the
      deep-research record cited without a PMID; the companion paper is PMID:40378840.
- id: PMID:42405753
  title: Mechanistic insights into transcriptional regulation of ARHGAP36 expression
    identify a factor predictive of neuroblastoma survival.
  findings:
  - statement: >-
      FOXC1 directly induces ARHGAP36, and ARHGAP36 in turn depletes PKA and its catalytic
      subunit, activating Hedgehog signalling and making it less dependent on Smoothened.
    supporting_text: >-
      Arhgap36 depletes the levels of PKA and its catalytic subunit PKAC, both strongly activating
      Hh signaling and making signal transduction less dependent on regulation via Smoothened.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Independent confirmation of the PKA-to-Hedgehog mechanism in a different
      system, and the clearest statement in the literature that the Smoothened-independence is a
      property of the ARHGAP36 route rather than an artefact of one assay. Published version of
      the preprint the deep-research record cited without a PMID.
- id: PMID:41644816
  title: ARHGAP36 imposes a bifurcate activation of adherens junction and actomyosin
    to promote entosis.
  findings:
  - statement: >-
      ARHGAP36 promotes entotic cell-in-cell formation by binding beta-catenin through its
      N-terminal arginine-rich domain and, mutually exclusively, interacting with PKAc to activate
      RhoA signalling and actomyosin contraction.
    supporting_text: >-
      Mechanistically, ARHGAP36, through the arginine-rich domain at the N-terminal, binds to
      β-catenin to stabilize P-cadherin expression in a way accompanying with, and mutually
      exclusive from, its interaction with PKAc to activate RhoA signaling.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only. Cited in the two actin rows because it is the only report
      connecting ARHGAP36 to the actin system, and because the direction is informative: the
      effect on RhoA is activation, mediated by the N-terminal PKAc-binding region, which is the
      opposite sign from a RhoA GAP and comes from the opposite end of the protein. Both actin
      rows are marked over-annotated rather than removed largely because this paper exists.
- id: PMID:37041138
  title: Enhancer hijacking at the ARHGAP36 locus is associated with connective tissue
    to bone transformation.
  findings:
  - statement: >-
      The authors summarise ARHGAP36 as a RhoGAP signal transduction protein that activates the
      non-canonical Hedgehog pathway and antagonises PKA signalling, and report that its
      overexpression drives osteoblast differentiation through that pathway.
    supporting_text: >-
      ARHGAP36 encodes a RhoGAP signal transduction protein25 that activates the non-canonical
      hedgehog (HH) pathway26 and works as a potent antagonist of the protein kinase A (PKA)
      signaling (Eccles et al., 2016).
    reference_section_type: RESULTS
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full text cached. A misexpression phenotype rather than a statement about the normal
      function of the gene, so it informs the description but supports no annotation. An Author
      Correction exists, PMID:37813867.
- id: file:human/ARHGAP36/ARHGAP36-bioinformatics/RESULTS.md
  title: 'ARHGAP36: the arginine finger UniProt annotates, and the residue that is there'
  findings:
  - statement: >-
      UniProt annotates an arginine-finger Site at position 258 of ARHGAP36 by PROSITE ProRule
      (ECO:0000255) and asserts GTPase activator activity by similarity (ECO:0000250); the residue
      at 258 is a threonine.
  - statement: >-
      Three controls carrying their own annotated arginine finger all project onto position 258
      and each recovers every other control's finger, so the Site is in register; the nearest
      arginine is 7 residues away.
  - statement: >-
      Mouse Arhgap36 carries the same substitution at its own annotated Site 246, and the human
      and mouse sites project onto each other reciprocally, so the loss predates the
      rodent-primate split and lies well below the Eumetazoan node the IBD is placed at.
  - statement: >-
      The GTPase-contacting surface from PDB 1TX4 projects onto ARHGAP36 at 8 of 25 identical
      positions against 9 of 25 for mouse Arhgap6, so the binding surface is about as conserved as
      the catalysing family member's while the catalytic residue is not.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Generated by analyze_arhgap36.py in the same directory, which fetches everything live from
      UniProt, RCSB and PROSITE and has a --self-test asserting 16 propositions including two
      negative controls that must stay silent. The report states explicitly that a missing
      arginine finger is not on its own proof of inactivity, because the sibling ARHGAP11B
      analysis measured the converse, and the review's conclusion does not rest on it alone.
- id: file:human/ARHGAP36/ARHGAP36-deep-research-affinage.md
  title: Affinage mechanistic annotation for ARHGAP36 (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: >-
      No blocking trust gate tripped: accession Q6ZRI8 and the human organism token both check
      out against the local UniProt record. The soft gate did trip, and is recorded here as the
      tool instructs. Affinage's own head-to-head self-evaluation scored this record
      pairwise = tie rather than win against the curated UniProt reference. Its narrative of the
      Hedgehog and PKA biology is accurate and was useful. Marked LOW_QUALITY for coverage rather
      than for error: its 7 citations are a subset of the 27 PubMed hits for ARHGAP36 in title or
      abstract, and the omissions include both papers that settle the GAP question
      (PMID:27481945, PMID:32203420), the only functional reference in the UniProt entry
      (PMID:35986704), and the published versions of two records it cited only as preprints.
      Each of those has a title that names a family, a disease or a partner rather than this
      gene.
existing_annotations:
- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1196332
  - PANTHER:PTN000973894
  review:
    summary: >-
      Contradicted. ARHGAP36 does not accelerate GTP hydrolysis by Rho-family GTPases: the
      catalytic arginine finger is replaced by a threonine, the substitution is shared with the
      mouse ortholog and therefore predates the rodent-primate split, and a systematic screen of
      RhoGEF and RhoGAP regulatory proteins found no effect on RAC1, CDC42 or RHOA.
    action: REMOVE
    reason: >-
      This is the whole molecular-function record for the gene and it rests on one IBD placed at
      PANTHER node PTN000973894, a Eumetazoa-level node, seeded by a single experimental donor,
      mouse Arhgap6. A short donor list is not in itself weak support, so the objection is not to
      the donor count; it is to the node placement, which is the thing an IBA actually asserts.

      Mouse Arhgap6 is in PANTHER subfamily PTHR12635:SF6 and ARHGAP36 is in PTHR12635:SF8. The
      IBD says GAP activity was present in the Eumetazoan ancestor of the family and has been
      inherited ever since. Subfamily SF8 falsifies the inheritance half of that claim. UniProt
      annotates an arginine-finger Site at position 258 of ARHGAP36 by PROSITE ProRule, and the
      residue there is threonine. Three independent controls that carry their own annotated
      arginine finger, including the PAINT donor itself, all project onto position 258, and each
      recovers every other control's finger, so the Site is in register rather than a misplaced
      profile hit. The nearest arginine is 7 residues away, too far to be a register shift. Mouse
      Arhgap36 carries threonine at its own annotated Site 246, and the human and mouse sites
      project onto each other reciprocally, so the arginine was already gone in the last common
      ancestor of mouse and human, deep inside the clade this node propagates into.

      The residue argument is deliberately not the whole case, because it would not be sufficient
      on its own. The sibling review of ARHGAP11B established that a retained arginine finger does
      not imply activity, so residue identity and curated activity are decoupled in both
      directions in this family; the inference here runs only in the direction where the residue
      is absent. The functional evidence is what closes it. PMID:33999959, from the laboratory
      that discovered this gene's Hedgehog function, states that ARHGAP36 has no effect on the
      activities of Rac1, Cdc42 and Rho A, citing Muller et al. 2020 (PMID:32203420), a systematic
      screen of RhoGEF and RhoGAP regulatory proteins. PMID:25024229 independently names the
      threonine and reports that GAP-domain mutants retain Gli-inducing activity. Amin et al.
      (PMID:27481945) place ARHGAP36 among the human RHOGAP-domain proteins that lack an arginine
      finger. PMID:40378841 restates the same conclusion from outside the field.

      The only observation pointing the other way is UniProt's SUBUNIT line recording an
      experimental interaction with active RAC1 via the Rho-GAP domain (PubMed:35986704), and it
      does not conflict. Binding a GTPase and accelerating its hydrolysis are different claims,
      and OCRL is the documented case of a RHOGAP-domain protein doing the first without the
      second. The structural measurement agrees: the GTPase-contacting surface of the 1TX4
      transition-state complex projects onto ARHGAP36 at 8 of 25 identical positions against 9 of
      25 for mouse Arhgap6, so the surface is about as conserved as the catalysing family
      member's while the catalytic residue is not. REMOVE is therefore scoped to the catalytic
      claim, which is what GO:0005096 means. It removes nothing about binding, and there is no
      binding annotation on this gene to remove. If one were added it should be an informative
      interaction term, not protein binding.

      Recorded as REMOVE rather than MARK_AS_OVER_ANNOTATED because the activity is contradicted
      rather than merely unevidenced: a direct assay reports its absence, the catalytic residue
      that defines the mechanism is gone, and the one reported effect of ARHGAP36 on a Rho GTPase
      runs in the opposite direction, activating RhoA through its PKAc-binding N-terminus
      (PMID:41644816).
