        The objection here is not a residue question. It is that a process term was transferred
        together with the catalytic activity that produced it in the donor, and ARHGAP36's only
        documented route to the actin system is a different domain acting with the opposite sign.
        The residue argument itself is recorded on the GO:0005096 row, where it belongs.
    supported_by:
    - reference_id: PMID:41644816
      supporting_text: >-
