- term:
    id: GO:0007015
    label: actin filament organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1196332
  - PANTHER:PTN000973894
  review:
    summary: >-
      Over-annotated. The basis for this term on ARHGAP36 is inheritance of mouse Arhgap6's
      GAP-mediated actin remodelling, and ARHGAP36 has no GAP activity. There is one report of an
      actin-related phenotype, but it runs through PKAc and RhoA from the N-terminal region, not
      through the Rho-GAP domain, so the term is not refuted, only unsupported as propagated.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      This row travels with GO:0005096 from the same IBD, and its rationale in the donor is that
      Arhgap6 remodels actin by acting on Rho GTPases. That mechanism is unavailable to ARHGAP36,
      for the reasons set out in the GO:0005096 row.

      It is marked over-annotated rather than removed because of PMID:41644816, which reports that
      ARHGAP36 promotes entotic cell-in-cell formation partly through RhoA-regulated actomyosin
      contraction. The connection to the actin system is therefore not fabricated. Three things
      keep it from supporting the annotation as it stands. The effect is mediated by the
      N-terminal arginine-rich domain binding PKAc, which is the PKA-inhibitory module and not the
      Rho-GAP domain. Its direction is activation of RhoA, the opposite sign from a RhoA GAP, and
      it is indirect: inhibiting PKA de-represses RhoA rather than ARHGAP36 acting on actin
      filaments itself. And the cached record is abstract-only, so the assay detail cannot be
      read.

      Whether a regulatory term for actomyosin contraction would fit better than GO:0007015 is
      raised in suggested_questions rather than proposed here, because one abstract-only report in
      an entosis-specific context is not enough to author a replacement term with.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
