- id: PMID:41644816
  title: ARHGAP36 imposes a bifurcate activation of adherens junction and actomyosin to promote entosis.
  findings:
  - statement: ARHGAP36 promotes entotic cell-in-cell formation by binding beta-catenin through its N-terminal
      arginine-rich domain and, mutually exclusively, interacting with PKAc to activate RhoA signalling
      and actomyosin contraction.
    supporting_text: Mechanistically, ARHGAP36, through the arginine-rich domain at the N-terminal, binds
      to β-catenin to stabilize P-cadherin expression in a way accompanying with, and mutually exclusive
      from, its interaction with PKAc to activate RhoA signaling.
  - statement: Accessible primary Fig.8A and supplementary S6-S8 show an actin-associated ARHGAP36 pool
      and altered polarized F-actin/pMLC2 distribution after target knockdown in MDA-MB-436-10 cells.
      These contextual data support the inherited actin process and location independently of GAP catalysis.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Main text remains subscription/PMC-embargoed. Read full PubMed abstract, accessible
      main images7/8, supplementary figures S6-S8 and the complete supplementary legend DOCX. These include
      actual actin-associated target imaging and target-depletion effects on polarized F-actin/pMLC2,
      reversing the earlier claim that no study places ARHGAP36 in the actin cytoskeleton. Source URLs,
      hashes and bounded observations are preserved in the primary-evidence note and project artifact.
      No inference of purified binary actin binding.
