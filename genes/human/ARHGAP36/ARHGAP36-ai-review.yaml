description: 'ARHGAP36 is a tissue-regulated signaling protein with a RhoGAP-like domain and an N-terminal
  protein kinase A inhibitory motif. The N-terminal region binds the PKA catalytic subunit as a pseudosubstrate
  and also promotes its ubiquitin-dependent lysosomal turnover. This can activate GLI-dependent Hedgehog
  output downstream of Smoothened, while a Patched1-dependent centrosomal pool in mouse cells regulates
  PKA and ciliary trafficking. Human isoforms differ in localization and GLI activation: isoform 1 is
  predominantly perinuclear in the tested expression systems, whereas isoforms 2–5 reach the plasma membrane
  and can activate GLI. In breast-cell entosis models, ARHGAP36 associates with actin-rich protrusions
  and junctions and coordinates catenin-dependent adhesion with PKA/RhoA-dependent actomyosin organization.
  Its RhoGAP-like domain lacks the conventional catalytic arginine, and a cellular screen detected no
  activity toward RhoA, Rac1 or Cdc42. This domain nevertheless contributes to protein interactions and
  regulation of GLI activity. Altered expression is associated with developmental abnormalities and several
  tumor phenotypes.'
