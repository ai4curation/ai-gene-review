        ARHGAP36 expressed alone was concentrated at the plasma membrane, while PKAC appeared
        largely cytosolic.
    - reference_id: PMID:33999959
      supporting_text: >-
        isoform 1 adopts a perinuclear distribution and does not affect Gli function, while the
        other four variants localize to the plasma membrane and can activate Gli transcription
        factors
core_functions:
- description: >-
    Pseudosubstrate inhibition of protein kinase A. ARHGAP36's N-terminal arginine-rich region is
    a pseudosubstrate motif that occupies the acidic active-site cleft of the PKA catalytic
    subunit, the same site the regulatory subunits and the PKI family use, and blocks catalysis
    with a potency the discovering laboratory measured as comparable to PKI in the same assay.
    The binding requires R153 and R154 on ARHGAP36 and is reciprocally disrupted by mutating
    E127, E170 and E230 in the PKAC cleft. The interaction has been shown by coimmunoprecipitation
    of the endogenous kinase, by FRET with acceptor photobleaching, and by isothermal titration
    calorimetry on a synthesised 25-residue peptide, and the inhibition by an in vitro kinase
    assay on recombinant PKAC and by a genetically encoded FRET biosensor in cells. A second,
    separable activity of the same region routes PKAC into a ubiquitin-dependent lysosomal
    degradation pathway, which full-length PKI does not do, so ARHGAP36 both blocks and depletes
    the kinase. The activity takes place at the plasma membrane, where the protein concentrates
    and from which it recruits cytosolic PKAC onto endosomal and lysosomal vesicles. Because PKA
    generates the GLI repressor forms, the downstream consequence is a shift of the GLI pool
    towards full-length activator and a rise in Hedgehog target gene expression that needs
    neither ligand nor Smoothened.
  supported_by:
  - reference_id: PMID:27713425
    supporting_text: >-
      The above experiments collectively demonstrate that ARHGAP36 is a pseudosubstrate inhibitor
      of PKAC with potency comparable to PKI.
  - reference_id: PMID:40378841
    supporting_text: >-
      Arhgap36 functioned not as a Rho GTPase inhibitor but as an inhibitor of PKA signaling by
      directly binding the catalytic subunit of PKA (PKAC) and targeting it for lysosomal
      degradation.
  - reference_id: PMID:25024229
    supporting_text: >-
      Arhgap36 acts in a Smoothened (Smo)-independent manner to inhibit Gli repressor formation
      and to promote the activation of full-length Gli proteins.
  molecular_function:
    id: GO:0004862
    label: cAMP-dependent protein kinase inhibitor activity
  directly_involved_in:
  - id: GO:0045880
    label: positive regulation of smoothened signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  knowledge_gaps:
  - gap_statement: >-
      What the retained Rho-GAP domain of ARHGAP36 does is unknown. It is required for full Gli
      activation and it binds PREPL, but no molecular activity has been assigned to it, and a
      molecular function for it cannot yet be written.
    boundary: >-
      Firmly established: the domain is present and structurally intact, its catalytic arginine
      finger is substituted by threonine in both human and mouse, point mutations within it
      abolish Gli activation, and it mediates the PREPL interaction. What is not established is
      any activity it performs.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    significance: >-
      This is the half of the protein that gives it its name and its entire current molecular
      function record. Removing GTPase activator activity leaves the domain with no annotation at
      all, so the gap becomes visible rather than being hidden behind an inherited term.
    resolution: >-
      A binding assay of the isolated domain against GTP-loaded Rho-family GTPases, with OCRL as
      the binds-without-catalysing control, would establish whether an interaction term belongs
      here.
    provenance:
    - reference_id: PMID:33999959
      supporting_text: >-
        other Rho GAPs lacking the catalytic arginine finger have been found to mediate
        non-catalytic protein-protein interactions
  - gap_statement: >-
      Whether blocking PKAC catalysis and driving PKAC lysosomal degradation are separable
      activities of the same motif, and which dominates at endogenous expression levels, is
      undetermined; every direct measurement so far has used overexpressed protein or a
      synthesised peptide.
    boundary: >-
      Firmly established: both effects require the same N-terminal arginine-rich region, and
      full-length PKI reproduces the inhibition but not the degradation, so they are at least
      mechanistically distinct.
    gap_kind:
    - BIOLOGY
    - CURATION
    dark_aspect: MF_DARK
    significance: >-
      It decides whether GO should carry one annotation here or two, and whether the degradation
      arm warrants its own process term.
    resolution: >-
      Screen substitutions in the 25-residue motif for variants that retain binding and kinase
      inhibition while losing lysosomal targeting.
- description: >-
    A second, spatially distinct role at the centrosome, currently characterised only in mouse.
    A pool of ARHGAP36 is held at the mother centriole by Patched1 and keeps centrosomal PKA
    activity low; activation of the Shh pathway displaces it, centrosomal PKA accumulates,
    Inversin is phosphorylated, and Smoothened translocates into the cilium. Knockdown raises
    both PKAc and phosphorylated Inversin, so the sign of the relationship is established by loss
    of function and not only by overexpression. This places ARHGAP36 inside the ciliary
    trafficking step of the pathway as well as downstream of it, and it is the one context in
    which ARHGAP36 restrains rather than promotes a Hedgehog step. It is recorded as a core
    function because the mechanism is well defined, but no cellular component annotation is
    proposed from it, because the experiments are in mouse cells.
  supported_by:
  - reference_id: PMID:30598432
    supporting_text: >-
      We find that Patched1 interacts with and stabilizes the PKA negative regulator ArhGAP36 to
      the centrosome. Activating the Shh pathway results in the removal of ArhGAP36 from the
      mother centriole and the centrosomal PKA accumulation.
  - reference_id: PMID:30598432
    supporting_text: >-
      we knocked down ArhGAP36 in WT cells and found that ArhGAP36 knockdown significantly
      increased the protein level of PKAc and pInvs
  molecular_function:
    id: GO:0004862
    label: cAMP-dependent protein kinase inhibitor activity
  knowledge_gaps:
  - gap_statement: >-
      Whether the Patched1-dependent centrosomal pool exists in human cells is untested. The
      mother-centriole localisation, the Inversin phosphorylation step and the knockdown result
      are all from mouse cells.
    boundary: >-
      Firmly established in mouse: Patched1 binds and stabilises ArhGAP36 at the mother centriole,
      Shh pathway activation displaces it, and knockdown raises PKAc and phosphorylated Inversin.
      Established for human: the protein inhibits PKAC directly and concentrates at the plasma
      membrane.
    gap_kind:
    - BIOLOGY
    - CURATION
    dark_aspect: CC_DARK
    significance: >-
      It is the best-characterised localisation this protein has and the only one tied to a
      defined mechanism, yet it cannot support a human cellular component annotation as things
      stand.
    resolution: >-
      Tag endogenous ARHGAP36 in a human line that expresses it and image through a Hedgehog
      stimulation timecourse.
suggested_questions:
- question: >-
    Does the Rho-GAP domain of ARHGAP36, which has lost its arginine finger but retains a
    GTPase-contacting surface about as conserved as mouse Arhgap6's, bind a Rho-family GTPase
    productively, and if so which one and with what consequence? UniProt records an interaction
    with the active form of RAC1 via this domain from PubMed:35986704, but the cached record is
    abstract-only and the experiment cannot be inspected here. OCRL is the precedent for binding
    GTP-bound RAC1 without stimulating hydrolysis; establishing whether ARHGAP36 does the same
    would let an informative interaction term replace the GTPase activator activity being
    removed.
  experts:
  - Xue Zhang
  - Mohammad Reza Ahmadian
- question: >-
    GO has no biological-process term for Hedgehog signalling that is not defined by activation
    of Smoothened, and the two terms that once covered regulation of hh target transcription
    factor activity, GO:0007228 and GO:1990787, are obsolete. ARHGAP36 is the clearest case of a
    regulator that raises Gli-dependent transcription without Smoothened involvement. Is a term
    for this warranted, and if so should it sit alongside GO:0045880 or under it?
  experts:
  - James K Chen
- question: >-
    Should ARHGAP36 carry a process term for the actomyosin phenotype reported in PMID:41644816,
    given that it acts on RhoA in the activating direction, does so indirectly by relieving PKA
    inhibition, and uses its N-terminal region rather than its Rho-GAP domain? GO:0007015 as
    currently annotated asserts something different from any of that.
  experts:
  - Qiang Sun
- question: >-
    Does the centrosomal and mother-centriole pool described in PMID:30598432 exist in human
    cells? That work was done in mouse, so no IDA can be written for the human gene, but the
    localisation is mechanistically the best characterised one this protein has and a cellular
    component annotation for it would be worth having.
  experts: []
- question: >-
    Which ARHGAP36 isoform should anchor curation? PMID:33999959 reports that isoform 1, the
    UniProt canonical displayed sequence, is perinuclear and does not activate Gli, while the
    other four reach the plasma membrane and do. Every functional experiment in the literature
    uses isoform 2, 3 or 4. A canonical sequence that is the inactive variant is a trap for any
    downstream pipeline reading the entry.
  experts:
  - James K Chen
  - Oliver Rocks
suggested_experiments:
- hypothesis: >-
    The threonine at the arginine-finger position is by itself sufficient to account for the
    absence of GAP activity, so restoring the arginine restores catalysis.
  description: >-
    Measure GAP activity of the purified ARHGAP36 Rho-GAP domain against a panel of Rho-family
    GTPases directly, alongside a T258R revertant and mouse Arhgap6 as the positive control. The
    negative result currently in the literature comes from a systems-scale screen; a targeted
    assay with the revertant would establish whether the threonine is the whole reason. The
    ARHGAP11B precedent, where the arginine is retained and the protein is still GAP-dead, is the
    reason this cannot be assumed.
  experiment_type: in vitro GTP hydrolysis assay with a catalytic revertant
- hypothesis: >-
    The Rho-GAP domain of ARHGAP36 binds a GTP-loaded Rho-family GTPase without accelerating its
    hydrolysis, as OCRL does.
  description: >-
    Test binding, rather than catalysis, of the isolated ARHGAP36 Rho-GAP domain to GTP-loaded
    RAC1, CDC42 and RHOA by isothermal titration calorimetry or biolayer interferometry, with
    OCRL as the binds-without-catalysing control and ARHGAP1 as the catalysing control. This is
    the experiment that would decide whether an interaction term belongs on this gene in place of
    the GTPase activator activity being removed.
  experiment_type: binding assay with matched positive and negative controls
- hypothesis: >-
    Blocking PKAC catalysis and driving PKAC into the lysosome are separable activities of the
    same N-terminal motif.
  description: >-
    Screen substitutions across the 25-residue pseudosubstrate motif for variants that retain
    isothermal titration calorimetry binding to PKAC and in vitro kinase inhibition while losing
    lysosomal targeting, scoring degradation by endogenous PKAC immunoblot with bafilomycin
    rescue. The answer decides whether GO needs one annotation here or two.
  experiment_type: structure-function mutagenesis with two orthogonal readouts
- hypothesis: >-
    The Patched1-dependent centrosomal pool of ARHGAP36 described in mouse also exists in human
    cells that express the protein endogenously.
  description: >-
    Tag endogenous ARHGAP36 in a human cell line that expresses it, such as the neuroblastoma
    lines in which it and PKAC are present at approximately equimolar levels, and image its
    localisation through a Hedgehog stimulation timecourse. This would test the mouse result in
    human cells and would also establish which isoform is actually expressed, which no study has
    yet reported for an endogenous human source.
  experiment_type: endogenous tagging and live-cell imaging
