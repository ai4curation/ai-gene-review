suggested_questions:
- question: For individual patient alleles, how much of the sex-reversing effect comes from reduced DNA
    bending and how much from reduced nuclear import, given that M64I was first explained by a reduced
    bend and later by a localization defect?
- question: Is the reported localization of SRY to splicing speckles, and a role in pre-mRNA splicing,
    reproducible in human pre-Sertoli cells, given conflicting results in NT2/D1 cells?
- question: What is the direct genome-wide target set of human SRY in fetal gonadal supporting cells,
    beyond SOX9?
suggested_experiments:
- description: ChIP-seq or CUT&RUN for endogenous SRY in human fetal gonad or iPSC-derived supporting-like
    cells, with matched patient alleles, to define direct targets and test enhancer occupancy at the SOX9
    TES and Enh13 regions.
