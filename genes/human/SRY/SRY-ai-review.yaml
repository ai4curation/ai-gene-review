id: Q05066
gene_symbol: SRY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SRY is the Y-linked testis-determining factor of therian mammals, a 204-residue transcription
  factor with a single central HMG box, derived in evolution from SOX3. Expressed briefly in supporting-cell
  precursors of the bipotential embryonic gonad, it binds the [AT]AACAA[AT] motif by partial intercalation
  in the DNA minor groove, sharply bending the DNA, and, together with SF1, activates the SOX9 testis
  enhancer, so committing these cells to the Sertoli lineage and initiating testis development. Nuclear
  entry uses two nuclear localization signals flanking the HMG box: the N-terminal signal binds calmodulin
  and the C-terminal one importin-beta, and exportin-4 also imports SRY; acetylation by p300 favours nuclear
  localization and deacetylation by HDAC3 cytoplasmic retention. The C terminus of human SRY binds the
  PDZ protein NHERF2. Loss-of-function variants, many de novo in the HMG box and some impairing nuclear
  import, cause 46,XY complete or partial gonadal dysgenesis, while translocation of SRY onto the X chromosome
  causes 46,XX testicular or ovotesticular differences of sex development.'
