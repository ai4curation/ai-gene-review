- term:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  evidence_type: ISS
  original_reference_id: PMID:23542644
  qualifier: enables
  review:
    summary: CDKAL1 is a radical SAM methylthiotransferase. SAM binds the unique iron of the radical
      SAM [4Fe-4S] cluster and is reductively cleaved to the 5'-deoxyadenosyl radical; a second SAM
      supplies the methyl group of the methylthio moiety.
    action: NEW
    reason: >-
      Not in GOA. Added for consistency with the RADICAL_SAM treatment rule (SAM binding is a core cosubstrate-binding
      function of every active radical SAM enzyme) and with the LIAS and ELP3 reviews. This is a molecular
      function, so CDKAL1 itself must bind SAM, and it does: the reaction it catalyses (RHEA:37075) consumes
      two SAM, and UniProt (PROSITE-ProRule PRU00780) records an exchangeable SAM on the radical SAM cluster.
      The structure and mechanism of the MTTase family member RimO show SAM bound to the radical SAM cluster
      in the canonical geometry (PMID:23542644), and that paper names CDKAL1 as a family member. Transferred
      by sequence similarity (ISS) from the family. Comparator check, against GOA rather than against
      this project's own proposals: GOA does annotate GO:1904047 to radical SAM enzymes in exactly this
      role, by UniRule -- ECOLI/queE (UR000100349), ECOLI/moaA and PSEPK/moaA (UR000101305), METEA/pqqE
      and PSEPK/pqqE (UR000098303). So the absence here is patchy UniRule coverage, which rules happen
      to carry the term, not a GO convention against annotating a radical SAM enzyme's own cosubstrate.
      That is also why those five genes have an existing row to ACCEPT or MODIFY while this one needs
      a NEW row.
    supported_by: &id014
    - reference_id: PMID:23542644
      supporting_text: Like many enzymes catalyzing biological sulfur-insertion reactions1, MiaB,
        CDKAL1, and RimO are iron-sulfur-containing Radical-SAM enzymes.
    - reference_id: PMID:23542644
      supporting_text: The Radical-SAM cluster catalyzes the reductive cleavage of
        S-Adenosylmethionine (SAM) into the 5′-deoxyadenosyl radical (Ado•) that activates the
        substrate for transformation by abstracting a hydrogen atom from a specific C-H bond4.
    - reference_id: file:human/CDKAL1/CDKAL1-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 2 [4Fe-4S] clusters. One cluster is coordinated with 3 cysteines and an
        exchangeable S-adenosyl-L-methionine.
