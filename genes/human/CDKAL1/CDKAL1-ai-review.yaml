- id: PMID:21841312
  title: Deficit of tRNA(Lys) modification by Cdkal1 causes the development of type 2 diabetes in
    mice.
  findings:
  - statement: Mouse Cdkal1 is required for ms2t6A37 in tRNA-Lys(UUU); loss causes Lys misreading in
      proinsulin, impaired insulin secretion and glucose intolerance.
    supporting_text: These results demonstrate that mouse Cdkal1 is a methylthiolase that converts t
      6 A to ms 2 t 6 A in tRNA Lys (UUU).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Defines the physiological substrate and the beta-cell phenotype; also
      shows ER localization and no p35/CDK5 interaction. Mouse study.
- id: PMID:31941883
  title: Irp2 regulates insulin production through iron-mediated Cdkal1-catalyzed tRNA modification.
  findings:
  - statement: Iron deficiency in Irp2-null beta cells lowers Fe-S-dependent Cdkal1 activity,
      causing Lys misreading in proinsulin.
    supporting_text: As a consequence of reduced Cdkal1 function in Irp2−/− β cells, lysine codons
      in proinsulin are misread and proinsulin processing is impaired, reducing insulin content and
      secretion.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. Corroborates the Fe-S dependence of Cdkal1 activity in vivo (mouse).
