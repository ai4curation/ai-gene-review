id: Q5VV42
gene_symbol: CDKAL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDKAL1 is a radical S-adenosyl-L-methionine (SAM) methylthiotransferase of the MiaB
  family (e-MtaB subfamily). It converts N6-threonylcarbamoyladenosine at position 37 (t6A37) of
  cytosolic tRNA-Lys(UUU) into 2-methylthio-N6-threonylcarbamoyladenosine (ms2t6A37), using two
  [4Fe-4S] clusters, one of which binds SAM and generates the 5'-deoxyadenosyl radical. The protein
  has an N-terminal MTTase domain, a central radical SAM domain and a TRAM domain. A C-terminal
  transmembrane segment makes it a tail-anchored protein of the endoplasmic reticulum membrane, with
  the catalytic domains facing the cytosol. The ms2t6A37 modification stabilizes codon-anticodon
  pairing and prevents misreading of the lysine codons AAA and AAG. In pancreatic beta cells, loss
  of CDKAL1 causes lysine misincorporation into proinsulin, defective proinsulin processing, ER
  stress and reduced first-phase glucose-stimulated insulin secretion. This explains the association
  of common CDKAL1 variants with type 2 diabetes. Despite its name, CDKAL1 does not bind the CDK5
  activator p35 or inhibit CDK5.
