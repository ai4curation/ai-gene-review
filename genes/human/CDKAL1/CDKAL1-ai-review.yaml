core_functions:
- description: Radical SAM methylthiotransferase that converts N6-threonylcarbamoyladenosine at
    position 37 of cytosolic tRNA-Lys(UUU) into 2-methylthio-N6-threonylcarbamoyladenosine (EC
    2.8.4.5). It acts from the cytosolic face of the ER membrane, where it is held by a C-terminal
    tail anchor.
  molecular_function: *id008
  directly_involved_in:
  - *id006
  locations:
  - *id001
  supported_by:
  - *id007
  - *id005
  - *id003
- description: 'Binds two [4Fe-4S] clusters: an MTTase N-terminal-domain cluster and the radical SAM cluster,
    which binds SAM. The radical SAM cluster cysteines are required for ms2t6A formation.'
  molecular_function: *id012
  supported_by:
  - *id010
  - *id013
  - *id011
- description: Binds S-adenosyl-L-methionine as the radical-generating cosubstrate at the unique
    iron of the radical SAM [4Fe-4S] cluster, and uses a second SAM as the methyl donor for the
    methylthio group.
  molecular_function:
    id: GO:1904047
    label: S-adenosyl-L-methionine binding
  supported_by: *id014
suggested_questions:
- question: Is CDKAL1's contribution to insulin secretion and glucose homeostasis entirely explained
    by tRNA-Lys(UUU) decoding fidelity (proinsulin and other Lys-rich beta-cell proteins), or does
    ER-membrane anchoring give it an additional local role near the translocon? Process terms such
    as insulin secretion should stay off CDKAL1 unless such a direct role is shown.
- question: Which protein donates sulfur to CDKAL1 in the cytosol (the second, N-terminal [4Fe-4S]
    cluster in MiaB-family enzymes is proposed to be the sulfur source), and does that require
    regeneration by the cytosolic Fe-S assembly (CIA) machinery?
suggested_experiments:
- description: Reconstitute purified human CDKAL1 (soluble construct lacking the tail anchor) with
    [4Fe-4S] clusters and test methylthiolation of t6A37-containing tRNA-Lys(UUU) transcripts in
    vitro, with SAM and reductant. Measure kinetics and test whether the two clusters have separate
    roles.
- description: Ribosome profiling and mass-spectrometric measurement of Lys misincorporation across
    the proteome in CDKAL1-knockout human beta-cell lines (e.g. EndoC-betaH1). This would show
    whether proinsulin is uniquely sensitive or one of many Lys-codon-dependent targets.
