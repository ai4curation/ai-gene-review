      regulation. Mouse fibroblast deficiency and human neuroblastoma starvation experiments are
      separate endpoints; the tested knockout setting does not abolish stress-granule formation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete official and normal cached abstracts read. Species and perturbation contexts
      are explicitly separated; full Methods and all individual localization experiments were not
      independently inspected.
- id: PMID:32989052
  title: Direct evidence that Ataxin-2 is a translational activator mediating cytoplasmic polyadenylation.
  findings:
  - statement: Human ATXN2 increases reporter translation efficiency and heavy-polysome association,
      and recruits PABPC1 and TENT2/PAPD4 to promote cytoplasmic polyadenylation. Partial PAPD4 depletion
      diminishes the tail-extension effect. The polymerase reaction is performed by TENT2, not ATXN2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete official and normal cached abstracts, all seven displayed figure captions
      and selected original Methods/Results were read. Reporter output is normalized to mRNA abundance,
      and polysome profiling supplies a second endpoint. The reconstructed human full-length cDNA
      and 906–1095 fragment are experimental constructs; no activity of all five natural products
      is inferred. No figure-pixel or complete-supplement review is claimed.
- id: PMID:37295429
  title: Poly(A)-binding protein is an ataxin-2 chaperone that regulates biomolecular condensates.
  findings:
  - statement: Human ATXN2-knockout HeLa cells retain arsenite-induced stress granules with altered
      size and number. PAM2-dependent PABPC interactions control partitioning and condensation; PABPC
      acts as the RNA-dependent chaperone and ATXN2 as its regulated client.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete official/normal abstracts and selected original initial Results, knockout/construct
      Methods and holdase passages were read. The knockout clone was sequence-confirmed. HeLa knockout
      and U2OS domain-deletion experiments are distinct; nonhuman ortholog experiments are not substituted
      for human evidence.
- id: PMID:38869059
  title: Concerted action of ataxin-2 and PABPC1-bound mRNA poly(A) tail in the formation of stress
    granules.
  findings:
  - statement: Human-cell perturbations link poly(A)-tail length and PABPC1 interactions to stress-granule
      formation. ATXN2 depletion reduces granule formation under the tested conditions, and full-length
      rescue outperforms a C-terminal truncation; dominant-negative PAM2 experiments are a separate
      endpoint.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete official and normal abstracts, selected original Methods/Results and Figure
      7 caption were read. All genes are specified as human; arsenite-treated HeLa cells show an
      approximately 20% reduction following ATXN2 knockdown. This does not establish abolition of
      granule formation or universal essentiality. The 1–1079 truncation is engineered, not a natural-product
      identifier.
core_functions:
- description: Binds U-rich regions in mRNA 3' untranslated regions and contributes to the stability
    of associated transcripts. This direct RNA contact is distinct from association with RNA-binding
    partners such as PABPC1.
  molecular_function:
    id: GO:0003730
    label: mRNA 3'-UTR binding
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:24954906
    supporting_text: 'targets cis-regulatory elements in 3'' UTRs to stabilize a subset of

      mRNAs and increase protein expression.'
- description: Activates translation of associated mRNAs through its protein-interaction regions,
    recruiting PABPC1 and TENT2 and promoting transcript polyadenylation. TENT2 supplies the polymerase
    activity; ATXN2 supplies recruitment and translational regulation.
  molecular_function:
    id: GO:0008494
    label: translation activator activity
  directly_involved_in:
