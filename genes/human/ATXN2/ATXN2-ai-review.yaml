  evidence_type: IMP
  original_reference_id: PMID:17392519
  qualifier: involved_in
  review:
    summary: Elevated ATXN2 reduces visible P-bodies rather than demonstrating a structural assembly
      role.
    action: MODIFY
    reason: The actual PMID17392519 Results compares full-length normal/expanded constructs and the
      DDX6-binding region; overexpression reduces P-body structures, whereas lowered ATXN2 has no
      obvious P-body effect. GO0010607 captures the direction-specific regulatory phenotype. This
      is a replacement of an existing IMP assertion, not a NEW process, and it does not establish
