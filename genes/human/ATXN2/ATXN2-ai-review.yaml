    supporting_text: Ataxin-2 enhances translation of target mRNAs.
  - reference_id: PMID:32989052
    supporting_text: 'to recruit PAPD4 to

      the targets.'
suggested_questions:
- question: Which sequence-verified natural ATXN2 splice products retain direct RNA binding, PABPC1/TENT2
    recruitment and translation activation, given their distinct deletions and replacements?
- question: How do the RNA-binding and PABPC1-interacting regions contribute separately to transcript
    stabilization, translation and stress-granule assembly in human neurons?
- question: Which assay directly supports the curated ATXN2-EGFR binding assertion, and is the interaction
    direct or mediated through the endophilin-CIN85-Src complex?
- question: Do physiological changes in endogenous ATXN2 abundance regulate P-body assembly, or is
    the strong disruption mainly an overexpression-dependent effect?
suggested_experiments:
- description: Compare sequence-verified natural products at matched abundance using RNA crosslinking,
    transcript half-life measurements, poly(A)-tail profiling and translation reporters normalized
    to mRNA abundance. Measure polymerase recruitment separately from catalytic output.
- description: Quantify stress-granule and P-body number, size and composition after graded endogenous
    ATXN2 depletion and rescue in human neurons, using distinct compartment markers and matched stress
    exposures.
