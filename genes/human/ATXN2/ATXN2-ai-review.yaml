id: Q99700
gene_symbol: ATXN2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Ataxin-2 is a predominantly cytoplasmic RNA-binding protein that associates with messenger
  ribonucleoproteins and regulates mRNA stability and translation. It contacts U-rich sequences in
  mRNA 3' untranslated regions and recruits PABPC1 and the cytoplasmic poly(A) polymerase TENT2 to
  selected transcripts, supporting poly(A)-tail extension and translation. Its RNA- and protein-interaction
  regions also influence stress-granule composition and assembly in a manner that depends on cell
  type and stress conditions. Polyglutamine expansion in ATXN2 causes spinocerebellar ataxia type
  2.
