id: Q06265
gene_symbol: EXOSC9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EXOSC9 encodes the human RRP45/PM-Scl75 subunit of the catalytically inert nine-subunit
  RNA exosome core. EXOSC9 pairs with EXOSC4 in the RNase PH-like ring, contributes to nuclear,
  nucleolar, and cytoplasmic RNA exosome complexes, and can bind AU-rich RNAs through its RNase PH
  domain while associated ribonucleases perform RNA cleavage.
