biological_questions:
- question: Which endogenous FOXP2 targets and partner combinations distinguish repression from activation
    in defined human neuronal states?
- question: How do mosaic FOXP2 reduction, uniform genetic loss and pathogenic variants produce different
    neuronal-development outcomes?
- question: Which naturally expressed FOXP2 products retain DNA recognition, nuclear localization and
    FOXP-family or CTBP association in the same human cell state?
- question: Which transcriptional changes connect FOXP2 activity to vocal motor behavior, and which are
    separable from broader neuronal development?
source_followups:
- Resolve the exact original PMID21653829 FOXP2–CTBP2 pair and whether it was included in the sampled
  HEK293 validation cohort.
- Determine the construct-specific meaning of the FOXP2 93–715 annotation in the isoform/Y2H datasets
  without assigning a natural product from coordinate correspondence alone.
- Recover the original PMID22133810 Methods and assay context; do not substitute its proposed CtBP/CNTNAP2
  mechanism for a demonstrated mediation experiment.
- Reconcile the described 714-residue BC143867 clone with current official sequences before assigning
  a natural-product identity.
- The official O15409-3 declaration remains Not described; recover its sequence rather than infer it from
  the product name or suffix.
