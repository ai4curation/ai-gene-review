  review:
    action: MODIFY
    summary: Corepressor binding is a supported refinement of the broad coregulator class.
    reason: Human FOXP2 associates with the transcriptional corepressors CTBP1 and CTBP2 in tagged-cell
      BRET, and independent source-specific Y2H records recover these partners. Their established corepressor
      class makes GO:0001222 informative for the FOXP2 transcriptional mechanism. The refinement does
      not assign corepressor activity to FOXP2 or establish isolated binding affinity.
