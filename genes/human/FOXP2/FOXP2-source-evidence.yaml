  review:
    action: ACCEPT
    summary: FOXP2 recognizes Pol II regulatory DNA.
    reason: The literal PTN000215041 IBD lies on the verified human FOXP2 lineage. Independent human CNTNAP2
      intron-1 ChIP and sequence-controlled EMSA support regulatory DNA recognition; the intronic element
      is not described as a core promoter. Preserve the original phylogenetic donors and qualifier.
    supported_by:
    - reference_id: PMID:18987363
    - reference_id: PMID:16407075
- raw_index: 1
  native_seed_index: 3
  stored_index: 3
  review:
    action: ACCEPT
    summary: The mouse-based DNA-binding transfer agrees with direct human evidence.
    reason: Human FOXP2 binds the CNTNAP2 regulatory element in chromatin and nuclear-extract EMSA, with
      probe and R553H controls. This supports the unrestricted Pol II cis-regulatory recognition term
      independently of the original P58463 electronic transfer, without assigning it to every natural
      product.
    supported_by:
    - reference_id: PMID:18987363
    - reference_id: PMID:16407075
- raw_index: 2
  native_seed_index: 4
  stored_index: 4
  review:
    action: TOO_GENERAL
    summary: The Pol II transcription-factor class is correct but less specific than the retained repressor
      activity.
    reason: TFClass identifies the appropriate transcription-factor class. GO:0001227 is an is_a subtype
      and describes the demonstrated human DNA-binding repression activity. Selected targets can instead
      be activated, so this specificity judgment does not claim that FOXP2 always represses.
    supported_by:
    - reference_id: PMID:18987363
    - reference_id: PMID:25027557
    - reference_id: PMID:27933109
    - reference_id: PMID:31067457
