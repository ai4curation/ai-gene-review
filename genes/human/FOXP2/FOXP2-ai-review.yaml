id: O15409
gene_symbol: FOXP2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FOXP2 is a forkhead DNA-binding transcription factor that regulates gene expression in the
  nucleus. It recognizes regulatory DNA and associates with FOXP-family proteins and transcriptional corepressors.
  FOXP2 can repress targets such as CNTNAP2, while other targets are activated in particular cellular
  contexts. Human pathogenic variation links it to speech and language development and altered basal-ganglia
  anatomy; experimental models establish context-dependent effects on neuronal development and vocal behavior,
  with additional cooperative roles in foregut muscle development. Alternative splicing produces proteins
  with different domain content, and the functions and localization of all declared products are not established.
