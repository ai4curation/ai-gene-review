suggested_questions:
- question: Which endogenous FOXP2 targets and partner combinations distinguish repression from activation
    in defined human neuronal states?
- question: How do mosaic FOXP2 reduction, uniform genetic loss and pathogenic variants produce different
    neuronal-development outcomes?
- question: Which naturally expressed FOXP2 products retain DNA recognition, nuclear localization and
    FOXP-family or CTBP association in the same human cell state?
- question: Which transcriptional changes connect FOXP2 activity to vocal motor behavior, and which are
