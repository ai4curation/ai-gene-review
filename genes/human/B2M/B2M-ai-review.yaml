- description: Obligate structural beta-chain subunit of non-antigen-presenting MHC class I-like heavy-chain receptors—including the hereditary hemochromatosis protein HFE (which associates with transferrin receptor TFRC to regulate cellular iron homeostasis) and the neonatal Fc receptor FCGRT/FcRn (which mediates pH-dependent endosomal salvage and transcytosis of IgG and albumin)—required for heavy-chain folding, endoplasmic reticulum export, and cell-surface/endosomal receptor expression.
