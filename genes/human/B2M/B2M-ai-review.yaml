- term:
    id: GO:0003254
    label: regulation of membrane depolarization
  evidence_type: IDA
  original_reference_id: PMID:23144825
  qualifier: involved_in
  review:
    summary: Innate immunity / antibacterial / antimicrobial humoral response and membrane depolarization,
      from the amniotic-fluid B2M study.
    action: KEEP_AS_NON_CORE
    reason: Free B2M isolated from amniotic fluid has direct antibacterial activity against Gram-positive
      and Gram-negative bacteria, likely via membrane depolarization. A moonlighting activity of secreted
      B2M, distinct from its MHC-I role.
    supported_by:
    - reference_id: PMID:23144825
      supporting_text: An antibacterial protein (about 12 kDa) was isolated from human amniotic fluid
    - reference_id: PMID:23144825
      supporting_text: The N-terminal sequence of the antibacterial protein was found to be identical
        to that of β(2)-microglobulin
