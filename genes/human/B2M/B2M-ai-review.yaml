id: P61769
gene_symbol: B2M
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Beta-2-microglobulin (B2M) is a 99-amino-acid secreted immunoglobulin-like C1-set domain protein that serves as the invariant, noncovalently associated light chain (beta chain) of major histocompatibility complex (MHC) class I and MHC class I-like heterodimers. Lacking a transmembrane domain, B2M pairs in the endoplasmic reticulum lumen with the alpha-3 domain and supports the alpha-1/alpha-2 platform of classical MHC class Ia heavy chains (HLA-A, HLA-B, HLA-C), non-classical MHC class Ib heavy chains (HLA-E, HLA-F, HLA-G), lipid-presenting CD1 glycoproteins (CD1a, CD1b, CD1c, CD1d), and the vitamin B metabolite-presenting receptor MR1. This structural pairing is essential for heavy-chain folding, incorporation into the endoplasmic reticulum peptide-loading complex, anterograde transport through the Golgi apparatus, and stable display of antigen-loaded complexes at the cell surface for recognition by T-cell and natural killer (NK) cell receptors. Beyond antigen presentation,
  B2M is an obligate structural subunit of the hereditary hemochromatosis protein HFE—enabling HFE cell-surface expression and association with transferrin receptors TFRC and TFR2 to regulate cellular iron homeostasis—and of the neonatal Fc receptor (FcRn/FCGRT), which mediates pH-dependent recycling and transcytosis of IgG and albumin. Free monomeric B2M is shed from cell surfaces into serum and body fluids and is normally cleared by the kidneys; in chronic renal failure, elevated circulating B2M can misfold and self-assemble into osteoarticular amyloid fibrils responsible for dialysis-related amyloidosis.
