  review:
    summary: B2M-stabilized MHC class I complexes engage NK cell receptors to regulate NK cell-mediated immunity.
    action: KEEP_AS_NON_CORE
    reason: Peptide-loaded B2M-MHC class I complexes (including HLA-Cw4, HLA-E, HLA-F, and HLA-G) serve as ligands for inhibitory and activating NK cell receptors (such as KIR2D in PMID:10429675, NKG2A:CD94 in PMID:35705051, and LIR1 in PMID:28636952), thereby regulating NK cell cytotoxicity; kept as a downstream non-core process.
