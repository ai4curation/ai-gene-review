      supporting_text: The crystal structure of the human class I major histocompatibility complex molecule, human histocompatibility leukocyte antigen (HLA)-Cw4, the ligand for a natural killer (NK) cell inhibitory receptor, has been determined, complexed with a nonameric consensus peptide (QYDDAVYKL).
