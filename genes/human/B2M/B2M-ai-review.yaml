- term:
    id: GO:0002503
    label: peptide antigen assembly with MHC class II protein complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000460629
  - UniProtKB:P01903
  - UniProtKB:P01911
  - UniProtKB:P28067
  - UniProtKB:P28068
  review:
    summary: Over-propagated MHC class II annotation (peptide antigen assembly with MHC class II protein complex) from PANTHER family PTN000460629.
    action: REMOVE
    reason: This IBA annotation was propagated from PANTHER node PTN000460629 (PTHR19944), which groups Ig-like C1-set domains across MHC class I and MHC class II chains (such as HLA-DRA, HLA-DRB1, HLA-DPB1, HLA-DMA, and HLA-DMB). B2M is exclusively the light chain of MHC class I and class I-like heterodimers and does not assemble with, bind, or traffic in MHC class II complexes.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000460629
        source_label: PTHR19944 ancestral node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Propagated from MHC class II and HLA-DM paralogs within PTHR19944; B2M is restricted to MHC class I/Ib/I-like heterodimers.
      residue_claims_not_applicable: Whole-subunit complex architecture difference (single Ig-like C1-set light chain vs transmembrane MHC class II alpha/beta and HLA-DM heterodimers) rather than a point-residue substitution.
