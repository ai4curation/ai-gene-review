- term:
    id: GO:0007611
    label: learning or memory
  evidence_type: IDA
  original_reference_id: PMID:26147761
  qualifier: involved_in
  review:
    summary: Pro-aging / neural / senescence roles (learning or memory, negative regulation of neurogenesis
      and forebrain neuron differentiation, positive regulation of cellular senescence, negative regulation
      of epithelial cell proliferation, cellular response to nicotine).
    action: KEEP_AS_NON_CORE
    reason: Elevated circulating B2M is a systemic pro-aging factor that impairs hippocampal neurogenesis
      and cognition and drives epithelial senescence/emphysema. These are effects of excess secreted B2M,
      peripheral to its MHC-I structural role.
    supported_by:
    - reference_id: PMID:26147761
      supporting_text: we identify β2-microglobulin (B2M), a component of major histocompatibility complex
        class 1 (MHC I) molecules, as a circulating factor that negatively regulates cognitive and regenerative
        function in the adult hippocampus
    - reference_id: PMID:28213472
      supporting_text: has been identified as a proaging factor
