- term:
    id: GO:0006879
    label: intracellular iron ion homeostasis
  evidence_type: IDA
  original_reference_id: PMID:18353247
  qualifier: involved_in
  review:
    summary: Iron-homeostasis roles (intracellular iron homeostasis, transferrin transport, regulation
      of iron ion transport, receptor-mediated endocytosis, cellular response to iron, response to metal
      ion).
    action: KEEP_AS_NON_CORE
    reason: B2M is required for cell-surface expression of HFE, the class I-like iron regulator, so loss
      of B2M perturbs HFE-dependent iron handling. These are indirect, HFE-mediated effects.
    supported_by:
    - reference_id: PMID:9465039
      supporting_text: 'This mutation

        eliminates the ability of HFE to associate with beta2-microglobulin (beta2m) and prevents cell-surface
        expression.'
    - reference_id: PMID:18353247
      supporting_text: HFE and TfR2 were recently discovered to form a stable complex at the cell membrane
