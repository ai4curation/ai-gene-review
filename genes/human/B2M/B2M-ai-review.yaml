    record_section:
    - CC:SUBUNIT
  - statement: B2M localizes to the cell surface and is secreted into serum and urine.
    supporting_text: Secreted. Cell surface. Note=Detected in serum and urine (PubMed:1336137, PubMed:7554280).
    record_section:
    - CC:SUBCELLULAR LOCATION
core_functions:
- description: Obligate structural beta-chain subunit of classical MHC class Ia (HLA-A, HLA-B, HLA-C), non-classical MHC class Ib (HLA-E, HLA-F, HLA-G), and antigen-presenting MHC class I-like heavy chains (CD1a-d and MR1), stabilizing the heavy-chain fold in the endoplasmic reticulum peptide-loading complex and at the cell surface to enable antigen assembly and presentation to T-cell and NK-cell receptors.
