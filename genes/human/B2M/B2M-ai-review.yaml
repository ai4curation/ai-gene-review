suggested_questions:
- question: How is the stoichiometric supply of nascent B2M partitioned in the endoplasmic reticulum among competing heavy-chain partners (classical HLA-A/B/C, non-classical HLA-E/F/G, CD1a-d, MR1, HFE, and FCGRT/FcRn) under basal versus interferon-stimulated conditions?
  experts:
  - Robert Tampe
  - Pamela J. Bjorkman
  - Jamie Rossjohn
- question: By what molecular mechanism does elevated circulating soluble B2M in aging plasma impair adult hippocampal neurogenesis and synaptic plasticity—via exchange onto cell-surface neuronal MHC class I heavy chains or via an MHC class I-independent receptor?
  experts:
  - Saul A. Villeda
  - Tony Wyss-Coray
suggested_experiments:
- hypothesis: Cytokine-induced upregulation of classical MHC class Ia heavy chains alters the relative ER assembly flux of B2M into non-classical receptors (FCGRT/FcRn, HFE, and MR1) when B2M levels become limiting.
  description: Perform pulse-chase metabolic labeling and quantitative co-immunoprecipitation mass spectrometry of newly synthesized B2M complexes in primary human endothelial and epithelial cells across graded IFN-gamma doses with and without B2M overexpression.
