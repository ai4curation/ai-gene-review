      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000460629
        source_label: PTHR19944 ancestral node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Propagated from MHC class II and HLA-DM paralogs within PTHR19944; B2M is a soluble luminal/extracellular beta chain without a transmembrane anchor.
      residue_claims_not_applicable: Whole-subunit complex architecture difference (soluble B2M beta chain lacking a transmembrane domain vs transmembrane MHC class II chains) rather than a point-residue substitution.
