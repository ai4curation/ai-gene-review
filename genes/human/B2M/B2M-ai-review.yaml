core_functions:
- description: Invariant light chain of MHC class I. B2M associates with the heavy chain in the ER, stabilizes
    its fold, supports peptide loading, and is displayed with the heavy chain at the cell surface, enabling
    CD8 T-cell and NK recognition.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0009897
    label: external side of plasma membrane
  - id: GO:0005576
    label: extracellular region
  directly_involved_in:
  - id: GO:0019885
    label: antigen processing and presentation of endogenous peptide antigen via MHC class I
  supported_by:
  - reference_id: PMID:36104323
    supporting_text: crucial for MHC I assembly
  - reference_id: PMID:24643698
    supporting_text: MHC class I (MHC I) antigen presentation is a ubiquitous process by which cells present
      endogenous proteins to CD8(+) T lymphocytes
- description: As the obligatory partner of class I-like heavy chains, B2M is required for surface expression
    of non-classical/class Ib molecules (HLA-E/F/G, CD1, MR1) and of HFE and FcRn.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9465039
    supporting_text: 'This mutation

      eliminates the ability of HFE to associate with beta2-microglobulin (beta2m) and prevents cell-surface
      expression.'
suggested_questions:
- question: What drives the transition of free circulating B2M to pathological amyloid in dialysis patients,
    and can it be targeted?
- question: How much of the pro-aging effect of circulating B2M is receptor-mediated versus a consequence
    of altered MHC-I signaling?
suggested_experiments:
- description: Cell-surface vs secreted B2M quantification (surface biotinylation plus conditioned-medium
    ELISA) across cell types to define the shed pool, and B2M-knockout rescue to map which class Ib/HFE/FcRn
    functions require B2M.
