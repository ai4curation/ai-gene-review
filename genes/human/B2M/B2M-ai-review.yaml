id: P61769
gene_symbol: B2M
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: B2M (beta-2-microglobulin) is the invariant light chain of MHC class I molecules. It is a
  small, soluble immunoglobulin C1-set domain protein with no transmembrane segment. It associates non-covalently
  with the polymorphic heavy chains of classical (HLA-A/B/C) and non-classical / class Ib (HLA-E/F/G,
  CD1, MR1, HFE, FcRn) MHC molecules, stabilizing their fold and supporting peptide loading in the ER
  and surface display. Through this role it underlies CD8 T-cell antigen presentation and NK-cell recognition,
  and it is required for cell-surface expression of the iron-regulatory molecule HFE and of FcRn. B2M
  is continuously shed from the cell surface, so free B2M circulates in serum and is excreted in urine;
  elevated circulating B2M acts as a pro-aging factor and, in dialysis patients, aggregates into amyloid
  fibrils (dialysis-related amyloidosis). Free B2M also has antibacterial activity.
