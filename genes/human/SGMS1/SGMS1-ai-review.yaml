proposed_new_terms:
- proposed_name: phosphatidylethanolamine:ceramide ethanolaminephosphotransferase activity
  proposed_definition: Catalysis of the transfer of phosphoethanolamine from a phosphatidylethanolamine
    to a ceramide, producing a ceramide phosphoethanolamine and a diacylglycerol.
  justification: The measured SGMS1 reaction uses PE, whereas current GO:0002950 uses CDP-ethanolamine.
    Shared SGMS1/SGMS2 OLS searches did not recover an exact donor-correct term. This proposal distinguishes
    the two reactions without inventing a GO identifier.
  proposed_parent:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
  supported_by:
  - reference_id: PMID:37715942
    supporting_text: SMS1 is a unique enzyme with PC-PLC/PE-PLC/SMS/CPES
  - reference_id: file:human/SGMS1/SGMS1-uniprot.txt
    supporting_text: phosphoethanolamine head group of phosphatidylethanolamine
