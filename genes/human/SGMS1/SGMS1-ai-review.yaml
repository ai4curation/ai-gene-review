id: Q86VZ5
gene_symbol: SGMS1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SGMS1 encodes sphingomyelin synthase 1, a multipass membrane enzyme concentrated at the Golgi
  apparatus. It transfers phosphocholine from phosphatidylcholine to ceramide, producing sphingomyelin
  and diacylglycerol and maintaining cellular membrane sphingomyelin pools. The enzyme uses ceramide delivered
  to the Golgi and supplies a diacylglycerol pool that recruits lipid-binding effectors. The reaction
  is reversible, allowing ceramide formation when sphingomyelin donates phosphocholine to diacylglycerol.
  SGMS1 can associate with glucosylceramide synthase and influence the partitioning of ceramide between
  sphingomyelin and glycosphingolipid synthesis. Purified human SGMS1 also transfers phosphoethanolamine
  from phosphatidylethanolamine to ceramide and hydrolyzes phosphatidylcholine or phosphatidylethanolamine
  to generate diacylglycerol without ceramide. These additional activities broaden its lipid chemistry,
  while sphingomyelin synthesis is its best-established cellular function.
