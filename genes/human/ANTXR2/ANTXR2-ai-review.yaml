  review:
    summary: Purified protective-antigen binding is a supported non-core pathogen interaction.
    action: KEEP_AS_NON_CORE
    reason: The actual original abstract establishes high-affinity binding of purified human CMG2 VWA
      to anthrax protective antigen; the direct receptor interface is corroborated by the read PMID:15326297
      full main Methods/Results. The interaction is real and retained as an infection-context non-core
      binding annotation. Genericity alone does not justify REMOVE. Toxic substance binding is withheld
      because PA is the delivery/pore component and its isolated poisonous-substance status has not been
      established.
    supported_by:
    - reference_id: PMID:15044490
      supporting_text: 'We expressed

        and purified the von Willebrand A (VWA) domain of CMG2 and examined its

        interactions with monomeric and heptameric forms of PA.'
    - reference_id: PMID:15326297
      supporting_text: The structure of the PA heptamer:CMG2 VWA domain complex was determined at 4.3
        Å and reveals the CMG2 MIDAS occupied by PA D683
