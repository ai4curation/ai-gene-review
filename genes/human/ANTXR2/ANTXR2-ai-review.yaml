    supporting_text: 'A recombinant CMG2 protein bound PA and mediated toxin internalization

      when expressed on receptor-deficient cells.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete normal abstract read and exact original GOA citation checked. Human CMG2 has
      direct metal-dependent protective-antigen recognition and supports uptake in receptor-deficient
      cells. Full body was not read; later human receptor studies independently corroborate surface function.
