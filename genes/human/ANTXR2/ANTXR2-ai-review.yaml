  review:
    summary: ANTXR2 recognizes anthrax toxin through its protective-antigen component.
    action: MODIFY
    reason: Purified human CMG2 VWA binds monomeric and heptameric protective antigen with defined affinity
      and stoichiometry. Protective antigen is the receptor-binding moiety of anthrax toxin, and human
      CMG2-mediated binding supports toxin entry. Toxic substance binding is therefore a specific description
      of this pathogen-recognition interaction. The term does not require each bound component of a multipart
      toxin to be independently poisonous. This does not assert binding to isolated lethal or edema factors,
      or intrinsic toxin or antitoxin activity of ANTXR2.
    supported_by:
    - reference_id: PMID:15044490
      supporting_text: 'We expressed

        and purified the von Willebrand A (VWA) domain of CMG2 and examined its

        interactions with monomeric and heptameric forms of PA.'
    - reference_id: PMID:15326297
      supporting_text: The structure of the PA heptamer:CMG2 VWA domain complex was determined at 4.3
        Å and reveals the CMG2 MIDAS occupied by PA D683
    - reference_id: PMID:12700348
      supporting_text: 'A recombinant CMG2 protein bound PA and mediated toxin internalization

        when expressed on receptor-deficient cells.'
    proposed_replacement_terms:
