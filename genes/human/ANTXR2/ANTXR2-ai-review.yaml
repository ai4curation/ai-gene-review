    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete normal abstract read. Its human capillary-morphogenesis study explicitly reports
      CMG2-GFP ER targeting. Current UniProt assigns the historical 386-aa product to isoform 2; no source
      isoform identifier was added. Full body was not read.
- id: PMID:12700348
  title: Human capillary morphogenesis protein 2 functions as an anthrax toxin receptor.
  findings:
