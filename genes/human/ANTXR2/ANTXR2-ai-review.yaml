- id: PMID:32428455
  title: Ligand Binding to the Collagen VI Receptor Triggers a Talin-to-RhoA Switch that Regulates Receptor
    Endocytosis.
  full_text_unavailable: true
  findings:
  - statement: Ligand binding switches the receptor cytoplasmic association from talin-linked actin to
      RhoA and its effectors.
    supporting_text: 'CMG2 binds talin, and thereby the actin

      cytoskeleton, only in its ligand-free state. Extracellular ligand binding leads

      to src-dependent talin release and recruitment of the actin cytoskeleton

      regulator RhoA and its effectors.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal record has the complete abstract only; its title, DOI and publication identity
      match the independently read institutional copy. Targeted external Results/Figures 1–6 captions
      and cell, construct and immunoprecipitation Methods establish human P58335-4 and distinguish native
      human cells from mouse and zebrafish experiments. This supports receptor signaling, not intrinsic
      RhoA or protease activity. Collagen-VI handling does not settle the ligand-specificity conflict
      with PMID:36185380. No complete supplement or figure-pixel inspection is claimed.
- id: PMID:42409807
  title: Dynamic S-acylation controls CMG2 maturation extracellular matrix regulation and anthrax toxin
    susceptibility in vivo.
  full_text_unavailable: false
  findings:
  - statement: In tested human cells, receptor S-acylation is required to couple ligand binding to cytoplasmic
      signaling.
    supporting_text: These findings show that CMG2 must be S-acylated for it to transduce ligand binding
      information into cytosolic signalling
  - statement: CMG2 surface abundance depends on its maturation and secretory transport in the tested
      human-cell system.
    supporting_text: In control cells, CMG2 was predominantly detected at the plasma membrane, whereas
      ZDHHC3 knockdown caused a marked accumulation of CMG2 in the Golgi
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal XML provides full-text availability. Actual main Results and Figures 4–7
      legends plus cell and construct Methods were read at the receptor maturation, surface biotinylation
      and ligand-triggered switch; the explicit human P58335-4 construct is distinct from mouse and zebrafish
      experiments. This is the published 2026 article, not the separate actin-binding preprint. ZDHHC
      enzymes and APT2 perform acylation chemistry; ANTXR2 is the regulated receptor substrate. Cellular
      collagen-VI turnover does not resolve direct ligand specificity. XML repeats portions and joins
      some headings; no exhaustive supplement or figure-image reading is claimed.
