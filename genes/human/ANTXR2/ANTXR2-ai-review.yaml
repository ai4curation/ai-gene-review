id: P58335
gene_symbol: ANTXR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANTXR2 (CMG2) is a single-pass cell-surface receptor that couples extracellular ligation
  to cytoplasmic signaling, cytoskeletal interactions and receptor internalization. Its extracellular
  von Willebrand factor A domain contains a metal-dependent ligand-binding site. Full-length surface forms
  contribute to extracellular-matrix handling, including receptor-dependent collagen uptake and lysosomal
  delivery in tested human cells, although direct collagen-VI recognition remains experimentally contested.
  ANTXR2 also binds anthrax protective antigen and enables toxin entry. Alternative products have distinct
  trafficking properties, including a reported endoplasmic-reticulum form and a predicted secreted form
  whose endogenous production is uncertain. Biallelic loss of ANTXR2 causes hyaline fibromatosis syndrome.
