  review:
    summary: Human ligand-dependent signal coupling supports the inherited receptor activity.
    action: ACCEPT
    reason: Ligand binding to full-length ANTXR2 couples the extracellular VWA domain to cytoplasmic Src-dependent
      phosphorylation and recruitment of beta-arrestin and cytoskeletal regulators. Human receptor experiments
      support this signaling-receptor function, including the ligand-induced talin-to-RhoA switch and
      its dependence on receptor S-acylation.
    supported_by:
