  review:
    summary: Human ligand-dependent signal coupling supports the inherited receptor activity.
    action: ACCEPT
    reason: The original PAINT assertion is supported by human ligand-dependent receptor phosphorylation
      and beta-arrestin recruitment in PMID:28604699, and by the published 2020/2026 human P58335-4 signaling
      studies (PMID:32428455 and PMID:42409807). The ANTXR1 donor and ancestral node are retained without
      donor-count or circularity objections; the exact tree and alignment were not reconstructed. Broad
      receptor activity remains appropriate across ligand and cellular contexts while collagen-VI specificity
      remains disputed.
    supported_by:
    - reference_id: PMID:28604699
      supporting_text: This binding event leads to intracellular signals such as the src-dependent phosphorylation
        of CMG2 cytoplasmic tail and the recruitment of β-arrestin.
    - reference_id: PMID:28604699
      supporting_text: Human CMG2 (isoform 4, Uniprot identifier P58335-4) was cloned in a pcDNA3.5/V5-HIS-TOPO
        expression vector.
    - reference_id: file:human/ANTXR2/ANTXR2-notes.md
    - reference_id: PMID:32428455
      supporting_text: 'CMG2 binds talin, and thereby the actin

        cytoskeleton, only in its ligand-free state. Extracellular ligand binding leads

        to src-dependent talin release and recruitment of the actin cytoskeleton

        regulator RhoA and its effectors.'
    - reference_id: PMID:42409807
      supporting_text: These findings show that CMG2 must be S-acylated for it to transduce ligand binding
        information into cytosolic signalling
    - reference_id: PMID:42409807
      supporting_text: Human CMG2 (isoform 4, UniProt P58335-4) WT was cloned in a pcDNA3.5/V5-HIS-TOPO
        expression vector or in pHS003-EGFP.
