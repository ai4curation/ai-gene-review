  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete normal abstract read; exact original GOA citation checked. Purified VWA-domain
      stoichiometry and kinetics establish the PA interaction. Human-domain provenance is independently
      corroborated by the read Methods of PMID:15326297. Full original body was not read.
