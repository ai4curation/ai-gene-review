suggested_questions:
- question: Which receptor species, constructs, modifications and collagen preparations account for the
    conflicting collagen-VI binding results, and which interactions occur at endogenous human receptor
    abundance?
- question: Is the predicted soluble isoform 3 translated and secreted in vivo despite its possible nonsense-mediated
    decay, and in which tissues?
- question: Does the preprint-reported direct F-actin interaction generalize across full-length human
    products, and how does it relate to the talin/vinculin-mediated interactions in published studies?
- question: Which receptor-bound adaptor directly connects ligand-engaged ANTXR2 to the vesicle coat,
    and can the cargo-receptor bridge be demonstrated separately from receptor signaling and downstream
    ligand degradation?
