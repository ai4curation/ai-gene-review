- id: PMID:28604699
  title: CMG2/ANTXR2 regulates extracellular collagen VI which accumulates in hyaline fibromatosis syndrome.
  full_text_unavailable: false
  findings:
  - statement: Ligation is coupled to intracellular receptor phosphorylation and beta-arrestin recruitment
      in the tested human-cell systems.
    supporting_text: This binding event leads to intracellular signals such as the src-dependent phosphorylation
      of CMG2 cytoplasmic tail and the recruitment of β-arrestin.
  - statement: The tested receptor-domain preparation was reported to bind the triple-helical region of
      collagen VI.
    supporting_text: Thus, CMG2 is able to bind collagen VI, and more specifically its triple helical
      domain,
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:36185380
      review_notes: The later negative study did not reproduce collagen-VI/C5 binding with murine receptor
        preparations, full-length receptor cells and NG2 controls. Species, constructs and ligand preparations
        differ; this conflict is unresolved and is not a universal refutation of human receptor signaling
        or matrix handling.
      supported_by:
      - reference_id: PMID:36185380
        supporting_text: we could not detect any interaction between collagen VI and ANTXR2
  - statement: Human patient fibroblasts lacking functional CMG2 fail to clear added collagen VI, whereas
      control-cell clearance is lysosome dependent.
    supporting_text: Thus, HFS patient fibroblasts essentially devoid of CMG2 protein are unable to degrade
      collagen VI.
  - statement: The CMG2-knockdown control distinguishes collagen handling from a general failure of IgG
      uptake and degradation.
    supporting_text: Loss of CMG2 does not have a pleiotropic effect on the endocytic pathway since internalization
      and lysosomal degradation of mouse IgGs was unaffected by CMG2 knockdown (Supplementary Fig. 6c).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The main ligand-binding and receptor-recruitment Results, targeted Discussion and ELISA,
      cell/construct, co-IP and endocytosis Methods were read. Human P58335-4 is explicit for full-length
      expression; the purified VWA preparation is not separately species-resolved. Endogenous RPE1 co-IP
      measures ligand-dependent beta-arrestin association. The assay called endocytosis measures collagen-VI
      clearance over time and bafilomycin sensitivity, rather than initial uptake directly. The later
      negative binding study remains a substantive unresolved conflict. No exhaustive supplement or figure-image
      review was performed.
