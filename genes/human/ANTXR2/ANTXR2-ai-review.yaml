- term:
    id: GO:0006898
    label: receptor-mediated endocytosis
  evidence_type: IMP
  original_reference_id: PMID:28604699
  qualifier: involved_in
  review:
    summary: ANTXR2 supplies ligand recognition and cytoplasmic recruitment during receptor-mediated uptake.
    action: NEW
    reason: ANTXR2 contributes the surface-recognition and cytoplasmic recruitment steps of endocytosis.
      In human cells, ligand exposure induces receptor phosphorylation and endogenous beta-arrestin association.
      ANTXR2 loss impairs collagen-VI lysosomal clearance while IgG internalization and degradation remain
      intact. These recruitment experiments establish receptor participation beyond a loss-of-function
      phenotype alone. Independent human CMG2 expression supports anthrax-toxin internalization, and receptor-tail
      switching studies corroborate its active role. The collagen assay measures clearance rather than
      initial uptake directly, and direct collagen-VI specificity remains disputed. ANTXR2 is not assigned
      clathrin assembly or lysosomal protease activity.
    supported_by:
    - reference_id: PMID:28604699
      supporting_text: This binding event leads to intracellular signals such as the src-dependent phosphorylation
        of CMG2 cytoplasmic tail and the recruitment of β-arrestin.
    - reference_id: PMID:28604699
      supporting_text: Thus, HFS patient fibroblasts essentially devoid of CMG2 protein are unable to
        degrade collagen VI.
    - reference_id: PMID:28604699
      supporting_text: Loss of CMG2 does not have a pleiotropic effect on the endocytic pathway since
        internalization and lysosomal degradation of mouse IgGs was unaffected by CMG2 knockdown (Supplementary
        Fig. 6c).
    - reference_id: PMID:12700348
      supporting_text: 'A recombinant CMG2 protein bound PA and mediated toxin internalization

        when expressed on receptor-deficient cells.'
    - reference_id: PMID:32428455
      supporting_text: 'CMG2 binds talin, and thereby the actin

        cytoskeleton, only in its ligand-free state. Extracellular ligand binding leads

        to src-dependent talin release and recruitment of the actin cytoskeleton

        regulator RhoA and its effectors.'
    - reference_id: file:human/ANTXR2/ANTXR2-notes.md
