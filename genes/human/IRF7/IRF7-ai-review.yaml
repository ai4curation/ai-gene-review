id: Q92985
gene_symbol: IRF7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Interferon regulatory factor 7 (IRF7) is a signal-activated IRF-family transcription
  factor that amplifies type I interferon responses. Latent cytoplasmic IRF7 is phosphorylated
  downstream of viral pattern-recognition and endosomal TLR7/8/9 pathways, dimerizes, accumulates in
  the nucleus and binds ISRE/IRF promoter elements with coactivators to drive IFN-alpha, IFN-beta
  and interferon-stimulated gene transcription.
