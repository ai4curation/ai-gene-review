id: P17787
gene_symbol: CHRNB2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHRNB2 encodes the neuronal nicotinic acetylcholine receptor β2 subunit, an integral
  plasma-membrane component of heteropentameric ligand-gated cation channels. β2 contributes pore-lining
  helices and the complementary face of agonist-binding interfaces. In receptors such as alpha4β2,
  subunit composition and stoichiometry tune acetylcholine sensitivity, desensitization, conductance
  and calcium permeability. These receptors mediate neuronal excitation and modulate transmitter
  release, with circuit-dependent effects on attention, nicotine responses and development of visual
  connections. Pathogenic variants can alter channel gating and are associated with sleep-related
  hypermotor epilepsy.
