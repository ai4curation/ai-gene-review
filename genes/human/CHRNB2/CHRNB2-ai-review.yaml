suggested_questions:
- question: Which native human neuronal receptor populations contain β2 in each stoichiometry, and
    how do their calcium permeability and presynaptic versus postsynaptic roles differ?
- question: Does β2 itself reside in plasma-membrane rafts, or do lipid perturbations primarily alter
    receptor conformation, trafficking or associated proteins?
- question: Which human cognitive phenotypes reflect altered β2 gating, developmental circuit organization
    or clinical seizure burden?
suggested_experiments:
- description: Measure acetylcholine currents and calcium permeability in native human neuronal preparations
    while independently quantifying receptor subunit composition and stoichiometry.
- description: Combine endogenous β2 localization with membrane-domain markers and acute lipid perturbation,
    separating physical redistribution from changes in channel gating.
