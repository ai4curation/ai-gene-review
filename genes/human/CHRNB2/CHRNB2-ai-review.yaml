- id: PMID:27698419
  title: X-ray structure of the human α4β2 nicotinic receptor.
  findings:
  - statement: Human alpha4/beta2 form a heteropentameric pore. Nicotine occupies alpha4(+)/beta2(-)
      interfaces, with beta2 loopD/E residues contributing. Direct ACh patch-clamp comparison supports
      both full-length and engineered crystallization constructs. Structure uses intracellular-loop
      deletions, junction linker and beta2 C-terminal Strep tag; prolonged nicotine produces a desensitized
      nonconducting structure. Structural state does not negate measured currents.
  reference_review:
    relevance: HIGH
