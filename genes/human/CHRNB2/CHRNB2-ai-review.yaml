core_functions:
- description: β2 contributes pore-lining segments and the complementary acetylcholine-binding surface
    to assembled neuronal nicotinic receptors. Agonist binding gates transmembrane cation flow, including
    calcium with composition-dependent permeability, coupling cholinergic signaling to membrane depolarization
    and transmitter-release modulation. Reconstitution and engineered human structures establish
    the subunit contribution, not an autonomous β2 channel or a universal native stoichiometry.
  contributes_to_molecular_function:
    id: GO:0022848
    label: acetylcholine-gated monoatomic cation-selective channel activity
