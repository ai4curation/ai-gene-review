suggested_questions:
- question: At which cellular sites does ARMC9 coordinate TOGARAM1 and CSPP1, and what experiments distinguish
    the adaptor activity from the protein distributions at basal bodies, daughter centrioles and ciliary
    tips?
- question: Which experimental conditions explain the differing CEP104–ARMC9 co-IP observations in the
    2020 and 2025 studies?
- question: How does NDUFAF2 association connect mitochondrial state to ciliary stability without assigning
    respiratory enzyme activity to ARMC9?
- question: Do the original 2024 TOGARAM1 experiment and urinary-exosome peptide record verify their precise
    source-local ARMC9 assertions?
suggested_experiments:
- description: Compare accession-defined human ARMC9 isoforms in endogenous localization and purified
    partner-recruitment assays, varying TOGARAM1/CSPP1/CCDC66 ratios and separating dimerization from
    each binding interface.
- description: Test ARMC9 complex composition at basal bodies and at stimulated ciliary tips, alongside
    cilium growth and resorption measurements, to distinguish structural organization from downstream
    signaling effects.
