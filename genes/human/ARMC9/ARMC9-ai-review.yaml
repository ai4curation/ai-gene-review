    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official identity, complete normal abstract and original Figure3 caption were
      checked. Endogenous human hTERT-RPE1 staining supports basal-body/daughter-centriole localization;
      human clinical observations and zebrafish perturbation remain distinct. Full original Methods
      and all supplemental data were not read. The normal cache is abstract-only.
  full_text_unavailable: true
- id: PMID:32453716
  title: Dysfunction of the ciliary ARMC9/TOGARAM1 protein module causes Joubert syndrome.
  findings:
  - statement: Patient-cell perturbations implicate the ARMC9/TOGARAM1 module in ciliary stability.
    supporting_text: "Aberrant serum-induced ciliary resorption and \ncold-induced depolymerization\
      \ in ARMC9 and TOGARAM1 patient cell lines suggest a \nrole for this new JBTS-associated protein\
      \ module in ciliary stability."
    full_text_unavailable: true
  - statement: Disease-associated TOGARAM1 changes can disrupt its ARMC9 interaction.
    supporting_text: "TOGARAM1 \nvariants cause JBTS and disrupt TOGARAM1 interaction with ARMC9."
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal abstract and external original interaction Results/Figure1, patient-cell
      stability Results, relevant Discussion and selected Supplemental Methods were read. Human
      reference cDNAs are explicit; retinal Y2H libraries, tagged co-IP and forced PalmMyr targeting
      have distinct scopes. CEP104 is a co-IP association rather than a binary Y2H positive. Complete
      supplemental target tables and later assay protocols were not exhaustively inspected. The
      newer CEP104 discrepancy is documented separately in the notes; the cache remains abstract-only.
      Actual recovered PMID:39856351 now confirms the later CEP104 nonreplication passage; it is
      independent evidence, not a replacement for this source.
  full_text_unavailable: true
