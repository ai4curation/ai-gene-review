gene_symbol: ARMC9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARMC9 is a LisH- and armadillo-repeat protein that organizes a ciliary protein interaction
  network containing TOGARAM1, CSPP1 and CCDC66. It localizes to the basal body and daughter centriole
  in human cells and shows stimulus-dependent enrichment at ciliary tips in mammalian cell studies.
  Its oligomerization and partner contacts help coordinate microtubule behavior within the ciliary
  module; isolated ARMC9 does not autonomously bind microtubules or act as a tubulin polymerase
  in the tested reconstitutions. Loss of ARMC9 alters cilium length, stability and axonemal tubulin
  modifications, with downstream effects on Hedgehog signaling. Biallelic variants cause Joubert
  syndrome 30, a neurodevelopmental ciliopathy characterized by a distinctive hindbrain malformation
  and variable neurological, retinal and other organ involvement. The mechanism connecting its association
  with NDUFAF2 to mitochondrial and ciliary phenotypes remains unresolved.
