core_functions:
- description: ARMC9 supplies an oligomeric scaffold with distinct partner-binding surfaces in a
    flexible ciliary interaction network. Partner recruitment and modulation of microtubule dynamics
    support its structural contribution to cilium formation and stability. It does not autonomously
    bind microtubules or supply TOGARAM1 polymerase activity in the tested reconstitution. Tip localization
    is condition dependent; basal-body and daughter-centriole pools are independently established,
    but the same organizing mechanism is not assumed at every location.
