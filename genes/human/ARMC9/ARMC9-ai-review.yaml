core_functions:
- description: 'ARMC9 coordinates TOGARAM1 and CSPP1 through distinct partner-binding regions, contributing
    to cilium formation and stability. Its H region supports dimerization, although dimerization is not
    established as a requirement for every interaction. Partner recruitment and modulation of microtubule
    dynamics support adaptor activity in a flexible protein network. The precise cellular site of this
    activity remains unresolved: basal-body, daughter-centriole and conditional ciliary-tip distributions
    establish protein localization without locating each biochemical interaction. ARMC9 does not autonomously
    bind microtubules or supply polymerase activity in the tested reconstitution.'
