- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:39856351
  review:
    summary: ARMC9 coordinates TOGARAM1 and CSPP1 through distinct binding regions.
    action: NEW
    reason: Reconstituted human ARMC9 binds TOGARAM1 and CSPP1 through distinct regions, is recruited
      by these partners and modifies their effects on microtubule dynamics. This supports bringing macromolecules
      together for coordinated function. The assays combine human ARMC9, mouse TOGARAM1 and porcine tubulin.
      An integral ARMC9 structural position in the assembled complex has not been resolved, so adaptor
      activity is the more conservative description of this author-added assertion. Scaffold activity
      remains plausible; flexible stoichiometry and mild effects of individual depletion do not refute
      it. No autonomous microtubule-binding or polymerase activity is assigned to ARMC9.
    supported_by:
    - reference_id: PMID:39856351
      supporting_text: ARMC9 can bind to both proteins through two distinct domains and mildly enhance
        their effects on MT dynamics
      full_text_unavailable: false
    - reference_id: PMID:39856351
      supporting_text: For all module members except TOGARAM1, the human sequence was used; because of
        technical difficulties, the mouse sequence of TOGARAM1 was used, which is 84% identical to human
        TOGARAM1.
      full_text_unavailable: false
