gene_symbol: ARMC9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARMC9 is a Joubert syndrome-associated ciliary protein that coordinates a network of microtubule
  regulators, including TOGARAM1 and CSPP1. Distinct regions mediate partner interactions, and its central
  H region supports dimerization. Reconstitution shows partner-dependent recruitment and modulation of
  microtubule dynamics, without autonomous ARMC9 microtubule binding or polymerase activity. Endogenous
  human ARMC9 localizes near basal bodies and daughter centrioles; tagged ARMC9 also shows stimulus-dependent
  ciliary-tip enrichment in mouse cells. Disruption of ARMC9 impairs ciliary formation and stability,
  and biallelic variants cause Joubert syndrome. The location and composition of the active partner-coordinating
  network in cells remain incompletely resolved.
