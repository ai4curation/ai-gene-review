  label: Homo sapiens
description: KRTAP25-1 (keratin-associated protein 25-1, KAP25.1) is a small (102 aa) member of the PMG/KRTAP_PMG family of hair keratin-associated proteins, identified from the human genome sequence. By homology it is predicted to be a hair-fibre matrix protein that associates with hair keratin intermediate filaments, but an RT-PCR survey of human organs detected no KRTAP25-1 expression, and there is no protein-level evidence for the human gene.
