- term:
    id: GO:0031424
    label: keratinization
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6809663
  qualifier: involved_in
  review:
    summary: Proposed involvement of KRTAP25-1 in keratinization of the hair shaft, as a matrix constituent of the cornified fibre.
    action: NEW
    reason: 'Participation test: KAPs do part of the work of hair keratinization in the structural/scaffold sense; they are deposited in keratinizing trichocytes and become covalently cross-linked with the keratin filaments to form the cornified hair shaft, i.e. they contribute structure to the product rather than merely being required for it. GO:0031424 explicitly includes hair. Comparator check: the trichocyte keratins KRT81, KRT85 and KRT86 carry keratinization by IBA, and KAP6-family paralogues carry it by IEA. Hair cycle and hair follicle development were not used, since KAPs act downstream in fibre formation rather than in follicle cycling or morphogenesis. Human expression of this gene was not detected by RT-PCR, so the involvement is a family-level prediction.'
    supported_by:
    - reference_id: Reactome:R-HSA-6809663
      supporting_text: These filaments have a surrounding matrix that contains keratin-associated proteins (KAPs) that are involved in the formation of cornified, resilient hair shafts
    - reference_id: PMID:18721477
      supporting_text: 'KRTAP contains two major groups: high/ultrahigh cysteine (HS) and high glycine-tyrosine (HGT) that are considered to have originated independently, and are essential for the formation of rigid and resistant hair shafts through their extensive disulfide bond cross-linking with the abundant cysteine residues of hair keratins or hydrophobic interactions with keratins'
    - reference_id: file:human/KRTAP25-1/KRTAP25-1-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: '[hair keratin-]associated proteins (KRTAP), which are essential for the formation of a rigid and resistant hair shaft through their extensive disulfide bond cross-linking with abundant cysteine residues of hair keratins'
core_functions:
- description: 'Structural matrix protein of the hair fibre: as a high-sulfur keratin-associated protein, KRTAP25-1 is predicted to be deposited in the interfilamentous matrix of keratinizing trichocytes and cross-linked (by disulfide bonds and non-covalent interactions) to hair keratin intermediate filaments, contributing to the rigidity and mechanical resistance of the keratinized hair shaft.'
  supported_by:
