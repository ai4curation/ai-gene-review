- id: PMID:33815739
  title: The structure of human dermatan sulfate epimerase 1 emphasizes the importance of C5-epimerization
    of glucuronic acid in higher organisms.
  findings:
  - statement: The human catalytic-domain structure identifies a metal-binding environment and supports a revised
      catalytic model for the established epimerization reaction.
  reference_review:
