suggested_questions:
- question: How is endogenous DSE distributed between ER, Golgi and vesicular membranes, and which pools contribute
    measurably to dermatan-sulfate chain epimerization?
- question: How does a defined chondroitin chain bind the catalytic domain, and which proposed proton-transfer
    steps explain the measured net epimerization under native membrane conditions?
suggested_experiments:
- description: Combine endogenous DSE tagging with genetic specificity controls, quantitative organelle fractionation
    and chain-composition analysis to distinguish native compartment occupancy from tagged-protein trafficking.
- description: Test sequence-defined DSE catalytic variants on chemically defined chondroitin substrates and
    pair product stereochemical analysis with substrate-bound structural work, distinguishing epimerization
    from any transient or net bond cleavage.
