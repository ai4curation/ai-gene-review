id: Q9UL01
gene_symbol: DSE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Dermatan-sulfate epimerase (DSE, also called SART2) is a membrane-associated glycoprotein of the
  secretory pathway that converts glucuronic acid residues in chondroitin chains into iduronic acid. This modification
  generates the iduronic-acid-containing regions of dermatan sulfate proteoglycans. Its manganese-dependent
  catalytic domain is N-glycosylated, and the protein is associated with endoplasmic-reticulum and Golgi compartments.
  The resulting dermatan-sulfate structures contribute to extracellular-matrix organization.
