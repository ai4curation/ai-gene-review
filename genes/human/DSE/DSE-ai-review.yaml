- id: PMID:10679095
  title: Identification of a gene coding for a new squamous cell carcinoma antigen recognized by the CTL.
  findings:
  - statement: Tagged human SART2/DSE localizes predominantly to the ER with a Golgi-associated pool; a vesicle
      pattern observed in COS7 cells is absent in the MCF-7 comparison.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier and complete cached abstract were checked. Separately recovered indexed original
      cloning, Methods, localization Results, Figure 5 caption and Discussion windows were read; no figure
      pixels or complete original PDF are claimed. Human full-length SART2/DSE-GFP was studied in COS7 and
      human MCF-7 transfectants. ER/Golgi localization is positive, the vesicle pattern differs by host, and
      native untagged localization is explicitly unresolved. A publisher URL returned a client challenge rather
      than a PDF; the normal cache remains abstract-only.
- id: PMID:16505484
  title: 'Biosynthesis of dermatan sulfate: chondroitin-glucuronate C5-epimerase is identical to SART2.'
  findings:
  - statement: Human DSE directly epimerizes glucuronic acid in chondroitin, increasing iduronic acid and iduronate-rich
      regions in cellular CS/DS chains.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The genuine Lund author manuscript was independently read for operative Methods and Results.
      Bovine spleen enzyme identification is distinct from sequence-verified human full-length SART2/DSE expression.
      Tritium release, carbon-14 product mapping and cellular chain composition establish epimerization and
      direct dermatan-sulfate biosynthetic participation. The normal cache remains abstract-only despite this
      separate original access.
- id: PMID:19004833
  title: Identification of the active site of DS-epimerase 1 and requirement of N-glycosylation for enzyme
    function.
  findings:
  - statement: Human tagged-enzyme mutagenesis and glycosylation experiments support epimerase function, while
      the proposed atomic mechanism remains distinct from the measured net reaction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The independently recovered indexed author original Methods and Results describe human NM_001080976
      tagged proteins, mutagenesis and activity measurements. The measured net epimerase reaction is supported.
      The proposed 2009 atomic mechanism was revised by the 2021 structure; the earlier homology model is not
      treated as a substrate-bound crystal or proof of glycan degradation. The normal cache remains abstract-only.
- id: PMID:7092807
  title: Biosynthesis of dermatan sulphate. Assay and properties of the uronosyl C-5 epimerase.
  findings:
  - statement: Human-fibroblast microsomal activity supports C5 epimerization on chondroitin and differs from
      the heparan-substrate epimerase system.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: All five original scanned pages 489–493 were visually read through PMC. Methods explicitly
      use cultured human skin fibroblasts for enzyme preparation; other organisms supply different substrate
      or reagent materials. C5 tritium release, membrane fractionation and substrate/pH/cofactor comparisons
      establish dermatan-forming activity and distinguish it from the heparan system. The study predates DSE/DSEL
      molecular identification and does not resolve individual organelles. The normal cache remains abstract-only.
