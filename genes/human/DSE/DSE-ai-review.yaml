core_functions:
- description: DSE catalyzes C5 epimerization of glucuronic acid residues within chondroitin chains, producing
    iduronic-acid-containing regions of dermatan sulfate. Human recombinant activity and increased iduronic
    acid in cellular chains establish its direct chemical contribution to dermatan-sulfate proteoglycan biosynthesis.
    Its glycosylated catalytic domain operates in the secretory pathway, associated with Golgi membranes; tagged
    human constructs also show an ER pool. Manganese binding and N-glycosylation support the same catalytic
    mechanism. The proposed atomic reaction mechanism has been revised by later structural work and is distinguished
    from the experimentally established net epimerization reaction.
