core_functions:
- description: Syk-family cytoplasmic protein tyrosine kinase that, once docked on the engaged TCR and
    activated by LCK, phosphorylates the adaptors LAT and LCP2/SLP-76 on multiple tyrosines to assemble
    the LAT signalosome and propagate TCR signaling.
  molecular_function:
    id: GO:0004715
    label: non-membrane spanning protein tyrosine kinase activity
  directly_involved_in:
  - id: GO:0050852
    label: T cell receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0001772
    label: immunological synapse
  substrates:
  - id: UniProtKB:O43561
    label: Linker for activation of T-cells family member 1
  - id: UniProtKB:Q13094
    label: Lymphocyte cytosolic protein 2
  supported_by:
  - reference_id: PMID:11368773
    supporting_text: Zap-70 efficiently phosphorylates LAT on tyrosine residues at positions 226, 191,
      171, 132 and 127.
  - reference_id: PMID:9489702
    supporting_text: We show that this protein is phosphorylated by ZAP-70/Syk protein tyrosine kinases
      leading to recruitment of multiple signaling molecules.
  - reference_id: Reactome:R-HSA-202216
    supporting_text: These tyrosine residues are phosphorylated by tyrosine kinase ZAP-70
  - reference_id: PMID:12447358
    supporting_text: is phosphorylated at Y138 by ZAP-70
- description: The tandem SH2 domains bind cooperatively to doubly phosphorylated ITAM tyrosines of CD3
    zeta (CD247) and CD3 epsilon, recruiting ZAP70 to the stimulated TCR and relieving its autoinhibition.
  molecular_function: *id001
  directly_involved_in:
  - id: GO:0050852
    label: T cell receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:7528772
    supporting_text: Direct binding studies demonstrated that the tandem ZAP-70 SH2 domains bind phosphorylated,
      but not nonphosphorylated, TCR zeta cyt.
  - reference_id: PMID:7528772
    supporting_text: the ZAP-70 interaction with the TCR requires prior phosphorylation of both tyrosine
      residues within a TAM motif
  - reference_id: PMID:7509083
    supporting_text: This phosphorylation leads to the recruitment of a second cytoplasmic PTK, ZAP-70,
      through both of the ZAP-70 Src homology 2 domains and its phosphorylation.
  - reference_id: PMID:7761456
    supporting_text: The association rate and equilibrium binding constants for the ZAP-70 and syk SH2
      domains were determined for the CD3 epsilon ITAM.
  - reference_id: PMID:10704231
    supporting_text: Binding of ZAP-70 to the phosphorylated immunoreceptor tyrosine-based activation
      motifs (ITAMs) of the TCR zeta chain through its two src-homology 2 (SH2) domains results in its
      activation coupled to phosphorylation on multiple tyrosine residues, mediated by Src kinases including
      Lck as well as by autophosphorylation.
suggested_questions:
- question: Should ZAP70 carry a term for its recruitment to the TCR-CD3 complex (e.g. a 'part_of T cell
    receptor complex' only in the activated state), or is phosphotyrosine residue binding plus TCR signaling
    pathway sufficient to capture it?
- question: Which of the many reported ZAP70 substrates beyond LAT and LCP2 (VAV1, DUSP3/VHR, THEMIS,
    CD3 zeta itself) are physiologically relevant in primary T cells, given conflicting reports (e.g.
    THEMIS phosphorylation being Lck- rather than ZAP70-dependent)?
- question: Does ZAP70 have a non-redundant role in normal B cell development or activation, or is its
    B-lineage expression (pre-B, CLL) functionally minor relative to SYK?
suggested_experiments:
- description: Phosphoproteomics in primary human T cells with an analog-sensitive ZAP70 allele (chemical
    genetics) to define direct ZAP70 substrates distinct from LCK/ITK substrates.
- description: Conditional ZAP70 deletion in mature peripheral B cells or CLL models to test whether ZAP70
    kinase activity (versus scaffolding) contributes to BCR signaling.
