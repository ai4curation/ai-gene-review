id: P43403
gene_symbol: ZAP70
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ZAP70 (zeta-chain-associated protein kinase 70) is a Syk-family cytoplasmic protein tyrosine
  kinase expressed in T cells, NK cells and thymocytes (and at low levels in pre-B and some CLL B cells).
  It consists of tandem N-terminal SH2 domains, an interdomain B linker carrying regulatory tyrosines
  (Y292, Y315, Y319) and a C-terminal kinase domain. In resting T cells ZAP70 is cytosolic and autoinhibited.
  After TCR engagement, LCK phosphorylates both tyrosines of the ITAMs in CD3 zeta (CD247) and the CD3
  epsilon/gamma/delta chains; the tandem SH2 domains of ZAP70 bind these doubly phosphorylated ITAMs cooperatively,
  docking ZAP70 at the engaged TCR at the plasma membrane/immunological synapse and relieving autoinhibition.
  LCK then phosphorylates the activation loop (Y493) and interdomain B (Y319, which also binds the LCK
  SH2 domain), fully activating the kinase. Active ZAP70 phosphorylates the adaptors LAT and LCP2 (SLP-76),
  creating docking sites for PLCG1, GRB2/GADS, VAV1 and ITK that drive calcium, Ras-MAPK and NFAT signaling;
  it also phosphorylates substrates such as VAV1 and DUSP3 (VHR). Its activity is terminated by phosphatases
  (PTPN22, UBASH3A/B) and CBL-mediated ubiquitination. ZAP70 is essential for TCR signaling and thymic
  selection: biallelic loss-of-function mutations cause a combined immunodeficiency with absent CD8 T
  cells and non-functional CD4 T cells, while hypomorphic/activating combinations can cause autoimmunity.'
