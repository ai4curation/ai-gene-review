suggested_questions:
- question: Which non-canonical PRDX3 interaction or localization contexts are reproducible at endogenous abundance?
  experts:
  - redox biologists
  - cell biologists
suggested_experiments:
- experiment_type: Compartment-resolved peroxide probe assay
  description: Rescue PRDX3-knockout cells with compartment-targeted wild-type and peroxidatic-cysteine mutant PRDX3 and
    measure local H2O2 clearance.
  hypothesis: The retained core compartment is the dominant site of PRDX3 thioredoxin-dependent peroxide detoxification.
