id: P30048
gene_symbol: PRDX3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PRDX3 encodes the mitochondrial typical 2-Cys peroxiredoxin of the thioredoxin 2 system. In the mitochondrial matrix it
  reduces hydrogen peroxide and other hydroperoxides, thereby protecting the organelle from peroxide stress and supporting
  mitochondrial redox homeostasis; reported kinase-binding, cytosolic, and early-endosome contexts are peripheral to this
  core mitochondrial peroxidase activity.
alternative_products:
- name: '1'
  id: P30048-1
- name: '2'
  id: P30048-2
  sequence_note: VSP_054050
existing_annotations:
- term:
    id: GO:0004601
    label: peroxidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028381
  review:
    summary: >-
      generic peroxidase activity is less informative than the established thioredoxin-dependent peroxiredoxin activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The protein is not a generic peroxidase in isolation: it is a typical 2-Cys peroxiredoxin whose core reaction is hydroperoxide
      reduction through thioredoxin. The specific GO:0140824 row should carry the activity.
    supported_by: &id011
    - &id005
      reference_id: file:human/PRDX3/PRDX3-uniprot.txt
      supporting_text: >-
        Reaction=a hydroperoxide + [thioredoxin]-dithiol = an alcohol + [thioredoxin]-disulfide + H2O
      record_section:
      - CC:CATALYTIC ACTIVITY
    - &id006
      reference_id: PMID:17707404
      supporting_text: >-
        The mitochondrial 2-Cys peroxiredoxin PrxIII serves as a thioredoxin-dependent peroxidase operating in tandem with
        its cognate partners, an organelle-specific thioredoxin (Trx2) and NADP-linked thioredoxin reductase (TRR2).
    - &id007
      reference_id: PMID:19462976
      supporting_text: >-
        we investigated the redox properties of human Prx 3, a typical 2-Cys Prx that is localized to the mitochondrial matrix.
