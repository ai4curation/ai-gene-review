gene_symbol: MT-RNR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Small humanin-like peptide 3 (SHLP3) is a predicted 38-residue peptide, the longest of the
  group, and a 16S-rRNA sORF peptide: its open reading frame lies inside MT-RNR2, the mitochondrial 16S
  ribosomal RNA gene, in the same stretch of mitochondrial DNA that encodes humanin. The six small humanin-like
  peptides SHLP1-SHLP6 were identified by an in silico search of this region and named by analogy with
  humanin, with which they share a genomic neighbourhood rather than sequence similarity. Synthetic SHLP3
  is cytoprotective in culture: at 100 nM it increased viability and reduced apoptosis in murine NIT-1
  beta-cells and human 22Rv1 cells, reduced reactive oxygen species and improved mitochondrial metabolism,
  and enhanced 3T3-L1 pre-adipocyte differentiation. In mouse cochlear explants it reduced gentamicin-induced
  hair cell loss, with lower oxidative stress and lower induction of IL1B and IL6, and changes in AKT
  and AMPK-alpha phosphorylation. The peptide was detected by immunoblot in mouse brain and spleen. No
  receptor, binding partner, structure or subcellular location has been reported for SHLP3, so the mechanism
  behind these phenotypes is unknown and UniProt classifies the entry as PE4 (predicted). How much of
  this is translated in vivo is unresolved. The peptides are read with the cytoplasmic genetic code, yet
  no route is known by which an mtDNA-encoded transcript reaches cytoplasmic ribosomes, nor by which a
  peptide made in the matrix would be exported; and the same region of mitochondrial DNA is present in
  the nuclear genome as MT-RNR2-like (NUMT-derived) copies, so antibody-based detection cannot be attributed
  to the mitochondrial locus with certainty.'
aliases:
- SHLP3
suggested_questions:
- question: What does SHLP3 bind? Two independent studies report cytoprotection by exogenous synthetic
    peptide (PMID:27070352, PMID:39433756), but with no receptor, no binding partner and no localisation
    the cytoprotective phenotypes cannot be attributed to a step that SHLP3 performs, which is why no
    GO process term is proposed here. A deorphanization screen of the kind that resolved SHLP2 (ACKR3/CXCR7)
    is the obvious next step.
- question: Are the AKT and AMPK-alpha changes in cochlear explants upstream or downstream of the protection?
    They are reported as correlates, and SHLP3 is not known to act on either kinase.
- question: Is SHLP3 translated in human tissue, and from which locus? Detection rests on a custom antibody
    in mouse tissue, which the MT-RNR2-like nuclear copies make ambiguous.
suggested_experiments:
- description: Arrayed GPCR beta-arrestin and cAMP screening with synthetic SHLP3, following the protocol
    that identified ACKR3/CXCR7 as the SHLP2 receptor.
  hypothesis: SHLP3 signals through a cell-surface receptor, which would convert its cytoprotective phenotypes
    into an annotatable mechanism.
- description: Photo-crosslinkable or APEX2-tagged SHLP3 in a responsive cell type (NIT-1 beta-cells or
    cochlear explants) followed by mass spectrometry with SAINT filtering, to identify direct partners
    and establish whether SHLP3 is intracellular, like SHLP2, extracellular, or both.
  hypothesis: SHLP3 has identifiable direct binding partners that place it in a defined compartment and
    pathway.
- description: Dose-response of SHLP3 protection in cochlear explants down to the concentrations at which
    the peptide can be measured in tissue, to establish whether the effect occurs at endogenous levels.
  hypothesis: The hair-cell protection operates in the concentration range of the endogenous peptide.
references:
- id: PMID:27070352
  title: Naturally occurring mitochondrial-derived peptides are age-dependent regulators of apoptosis,
    insulin sensitivity, and inflammatory markers.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified (Cobb et al., Aging (Albany NY) 2016); full text cached from PMC4925829.
      The founding description of SHLP1-6: in silico identification of the six ORFs, antibody detection
      of SHLP1-4 and 6 in mouse tissues (no specific antibody could be raised against SHLP5), and a panel
      of viability, apoptosis and proliferation assays with synthetic peptides at 100 nM. It is the only
      publication covering SHLP1, SHLP4, SHLP5 and SHLP6, and for those four peptides it reports a cell-culture
      phenotype without any molecular mechanism, receptor or binding partner.'
- id: PMID:39433756
  title: Mitochondrial-derived peptides, HNG and SHLP3, protect cochlear hair cells against gentamicin.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'PubMed-verified (Cell Death Discov 2024); full text cached. Mouse organ-of-Corti explants
      treated with exogenous HNG or SHLP3 against gentamicin: reduced hair cell loss, oxidative stress
      and inflammatory gene induction, with AKT/AMPK-alpha modulation. Phenotypic and ex vivo; it identifies
      no SHLP3 target, so it supports the description but no GO annotation.'
