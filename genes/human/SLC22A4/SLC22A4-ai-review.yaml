gene_symbol: SLC22A4
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC22A4 encodes OCTN1 (organic cation transporter novel 1; also ETT/ETTh,
  the ergothioneine transporter), a 551-residue, 12-transmembrane-domain plasma-membrane
  solute carrier of the SLC22 / major facilitator superfamily organic cation transporter
  family (TC 2.A.1.19). OCTN1 is a polyspecific, pH-sensitive, mixed-mechanism transporter
  whose physiologically defining and highest-affinity substrate is ergothioneine, a
  diet-derived sulfur-containing betaine antioxidant, which it takes up by Na(+)-coupled
  symport (KM ~21 uM) at the apical membrane of intestinal and renal epithelia and into
  non-parenchymal liver cells, thereby setting systemic ergothioneine levels and
  contributing to control of inflammation and oxidative stress. It transports other
  substrates by distinct mechanisms -- the prototypical organic cation tetraethylammonium
  and many xenobiotic cations and drugs by Na(+)-independent, pH-dependent facilitated
  transport/antiport; acetylcholine bidirectionally, principally as an exporter
  contributing to the non-neuronal cholinergic system; L-carnitine and glycine betaine
  by low-affinity Na(+)-dependent transport. Transport is allosterically activated by
  intracellular ATP, and apical targeting is mediated by interaction with the PDZ
  scaffold PDZK1. OCTN1 is widely expressed (kidney, intestine, trachea, bone marrow,
  blood, immune cells, testis Sertoli cells, brain, liver); a mitochondrial localization
  with low-affinity carnitine uptake has also been reported.
