core_functions:
- description: Na(+)-coupled, pH-sensitive high-affinity transmembrane uptake of
    ergothioneine (KM ~21 uM), a diet-derived sulfur-containing betaine antioxidant.
    This is OCTN1's defining physiological function, driving absorption of
    ergothioneine at the apical membrane of intestinal and renal epithelia and uptake
    into non-parenchymal liver cells, thereby setting systemic ergothioneine levels
    and contributing to control of inflammation and oxidative stress.
