suggested_questions:
- question: What is the exact transport mechanism and stoichiometry for each OCTN1
    substrate class? Ergothioneine/carnitine/glycine-betaine are Na+-coupled symport,
    TEA is Na+-independent pH-dependent antiport, and acetylcholine is bidirectional
    with uncertain coupling - a unified mechanistic model is lacking.
- question: How physiologically real and quantitatively important is mitochondrial
    OCTN1? Published evidence rests substantially on overexpressed GFP/RFP fusions and
    organelle proteomics; does endogenous OCTN1 reside in a defined mitochondrial
    sub-compartment and contribute meaningfully to mitochondrial carnitine or
    ergothioneine handling?
- question: By what mechanism do SLC22A4 risk variants (the IBD5/Crohn and rheumatoid
    arthritis associations, L503F, the RUNX1-site SNP) alter disease susceptibility -
    via changed ergothioneine/acetylcholine transport in immune cells, altered
    expression, or linkage with neighbouring genes?
suggested_experiments:
- description: Reconstitute purified human OCTN1 in proteoliposomes and measure uptake
    and efflux of ergothioneine, acetylcholine, carnitine, glycine betaine and TEA
    while independently controlling trans-side Na+, K+ and the pH gradient, with
    electrophysiology, to define coupling ion(s), stoichiometry and electrogenicity
    per substrate.
- description: Use endogenous epitope-tagging and quantitative imaging/fractionation
    in polarized human intestinal and renal epithelial cells (and immune cells) to
    determine whether native OCTN1 localizes to mitochondria and, if so, to which
    sub-compartment, resolving the plasma-membrane vs mitochondrion debate without
    overexpression artifacts.
- description: Generate OCTN1 knockout and L503F knock-in human immune cell and
    intestinal organoid models and measure ergothioneine and acetylcholine flux,
    oxidative-stress and inflammatory readouts, to test how disease-associated
    variants perturb the ergothioneine/cholinergic axis.
