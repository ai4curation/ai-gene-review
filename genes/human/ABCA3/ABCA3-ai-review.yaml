  review:
    summary: Abca3 loss alters phosphatidylglycerol abundance and surfactant composition.
    action: MODIFY
    reason: The mouse source experiments (PMID:17267394; PMID:17142808) measure reduced surfactant
      lipid species after Abca3 loss. The conserved conclusion is phospholipid homeostasis, achieved
      through lipid transport. GO metabolic-process definitions concern chemical reactions and pathways;
      the lipid-composition phenotype does not establish that ABCA3 catalyzes phosphatidylglycerol
      synthesis or degradation. Use the measured homeostatic role, without extrapolating species-level
      depletion into a substrate-specific catalytic reaction.
    additional_reference_ids:
    - PMID:17267394
    - PMID:17142808
    proposed_replacement_terms:
    - id: GO:0055091
      label: phospholipid homeostasis
    propagation_review:
