- term:
    id: GO:0005765
    label: lysosomal membrane
  evidence_type: EXP
  original_reference_id: PMID:16959783
  qualifier: located_in
  review:
    summary: ABCA3 occurs in lysosomal or lysosome-related vesicular membranes during trafficking
      and in cellular models.
    action: KEEP_AS_NON_CORE
    reason: PMID:16959783 follows wild-type ABCA3 into LAMP3-positive vesicles in HEK293 cells. Independent
      human-cell work explicitly identifies both lysosomal and lamellar-body membranes (PMID:16415354).
      Retain the endolysosomal context; the primary differentiated alveolar functional site is the
      lamellar-body limiting membrane, and a lamellar body should not simply be equated with an ordinary
      lysosome.
    additional_reference_ids:
    - PMID:16415354
    - PMID:11718719
