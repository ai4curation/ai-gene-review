- term:
    id: GO:0140326
    label: ATPase-coupled intramembrane lipid carrier activity
  evidence_type: EXP
  original_reference_id: PMID:17574245
  qualifier: enables
  review:
    summary: ATP-coupled intramembrane lipid transport is the core ABCA3 molecular activity.
    action: ACCEPT
    reason: PMID:17574245 supports the established ABCA3 transporter mechanism. Human cell assays
      demonstrate ATP-dependent phospholipid vesicle loading and variant-dependent impairment; the
      structure/ATPase study supports lateral lipid access and ATP-driven extrusion. Exact substrate
      preference and leaflet-resolved kinetics remain less certain than this encompassing activity.
      The structural paper proposes the transport cycle and does not itself perform a purified lipid-flux
      assay.
    additional_reference_ids:
    - PMID:17574245
    - PMID:28887056
    - PMID:31473345
    - PMID:35394827
    supported_by:
