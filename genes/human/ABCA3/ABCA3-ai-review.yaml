- term:
    id: GO:0046470
    label: phosphatidylcholine metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8R420
  - ensembl:ENSMUSP00000078544
  review:
    summary: Abca3 loss alters phosphatidylcholine abundance and surfactant composition.
    action: MODIFY
    reason: The mouse source experiments (PMID:17267394; PMID:17142808) measure reduced surfactant
      lipid species after Abca3 loss. The conserved conclusion is phospholipid homeostasis, achieved
      through lipid transport. GO metabolic-process definitions concern chemical reactions and pathways;
      the lipid-composition phenotype does not establish that ABCA3 catalyzes phosphatidylcholine
      synthesis or degradation. Use the measured homeostatic role, without extrapolating species-level
      depletion into a substrate-specific catalytic reaction.
    additional_reference_ids:
    - PMID:17267394
    - PMID:17142808
    proposed_replacement_terms:
    - id: GO:0055091
      label: phospholipid homeostasis
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: UniProtKB:Q8R420
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Abca3 source experiments measure surfactant lipid depletion (PMID:17267394;
          PMID:17142808). Transfer of the homeostatic phenotype is supported, but direct lipid chemical
          metabolism is not established by depletion alone.
      - source_id: ensembl:ENSMUSP00000078544
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Abca3 source experiments measure surfactant lipid depletion (PMID:17267394;
          PMID:17142808). Transfer of the homeostatic phenotype is supported, but direct lipid chemical
          metabolism is not established by depletion alone.
      failure_modes:
      - ROLE_CONFLATION
