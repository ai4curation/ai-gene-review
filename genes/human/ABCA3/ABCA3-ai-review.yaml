id: Q99758
gene_symbol: ABCA3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ABCA3 is a full-length ATP-binding cassette phospholipid transporter concentrated in
  the limiting membrane of alveolar lamellar bodies in type II epithelial cells. Its two nucleotide-binding
  domains couple ATP utilization to lipid translocation, supplying phosphatidylcholine-rich surfactant
  membranes and supporting lamellar-body formation and surfactant homeostasis. Phosphatidylglycerol
  handling is also strongly implicated by mammalian loss-of-function studies. Human cellular transport
  assays and structures support lipid export toward the lamellar-body lumen, although the detailed
  substrate selectivity and leaflet-resolved mechanism remain incompletely characterized. Biallelic
  loss-of-function variants cause pulmonary surfactant dysfunction ranging from severe neonatal respiratory
  failure to interstitial lung disease. ABCA3 also mediates miltefosine efflux in human macrophages.
