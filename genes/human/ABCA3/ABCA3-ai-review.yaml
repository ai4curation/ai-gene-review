      source_entities:
      - source_id: UniProtKB:Q8R420
        source_status: SUPPORTS_TRANSFER
        comment: Mouse Abca3 source experiments measure surfactant lipid depletion (PMID:17267394;
          PMID:17142808). Transfer of the homeostatic phenotype is supported, but direct lipid chemical
          metabolism is not established by depletion alone.
      failure_modes:
