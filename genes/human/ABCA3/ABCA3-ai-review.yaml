- id: file:human/ABCA3/ABCA3-deep-research-falcon.md
  title: Falcon literature research report for human ABCA3
  findings:
  - statement: Independent literature synthesis supports a primary role in surfactant phospholipid
      loading, with unresolved purified substrate specificity.
    supporting_text: Its principal physiological function is to load surfactant phospholipids
core_functions:
- description: Uses ATP to translocate surfactant phospholipids into alveolar lamellar bodies, supplying
    their membrane cargo and sustaining surfactant homeostasis. Human assays establish phosphatidylcholine
    loading; mammalian loss-of-function data also implicate phosphatidylglycerol. The structural
    export model is compelling, but direct leaflet-resolved flux and complete substrate specificity
    remain unresolved.
  molecular_function:
    id: GO:0140326
    label: ATPase-coupled intramembrane lipid transporter activity
  directly_involved_in:
  - id: GO:0015914
    label: phospholipid transport
  - id: GO:0043129
    label: surfactant homeostasis
  - id: GO:0070925
    label: organelle assembly
  locations:
  - id: GO:0097233
    label: alveolar lamellar body membrane
  supported_by:
  - reference_id: PMID:17574245
    supporting_text: ABCA3 mediates ATP-dependent choline-phospholipids uptake into intracellular
      vesicles.
  - reference_id: PMID:16415354
    supporting_text: Expression of recombinant ABCA3 in non-lung human embryonic kidney 293 cells
      induced formation of lamellar body-like vesicles that contained lipids.
suggested_questions:
- question: Does purified, oriented ABCA3 directly flop phosphatidylcholine from the cytosolic to
    the luminal leaflet, and what are its kinetic preferences for PC, PG, sphingomyelin and cholesterol?
- question: What experiment in the rat donor source PMID:15904872 supports ABCA3 positive regulation
    of vesicle fusion, and is the function separable from lipid loading?
- question: Which supplemental observations support the human ABCA3 vesicle-membrane annotation in
    PMID:22673903 and the minority plasma-membrane location in PMID:11718719?
- question: Does oligomerization alter native ABCA3 transport, or primarily track correct folding
    and trafficking?
suggested_experiments:
- description: Reconstitute purified ABCA3 into oriented proteoliposomes and measure ATP-dependent,
    leaflet-resolved flux of defined labeled PC and PG species alongside ATPase-deficient controls.
    This would test GO:0090554 directionality independently of organelle biogenesis and nonspecific
    vanadate effects.
- description: Combine endogenous ABCA3 oligomer-state measurements with lipid-flux assays in gene-corrected
    human alveolar type II models, controlling for protein abundance and organelle trafficking.
