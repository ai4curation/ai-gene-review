      name:
        name: Multicopper oxidase-like, C-terminal
        short: Cu-oxidase_C
      description:
      - text: <p>This entry represents the C-terminal domain of multicopper oxidase and related proteins
          some of which have lost the ability to bind copper.</p>
        llm: false
        checked: false
        updated: false
      - text: '<p>Copper is one of the most prevalent transition metals in living organisms and its biological
          function is intimately related to its redox properties. Since free copper is toxic, even at
          very low concentrations, its homeostasis in living organisms is tightly controlled by subtle
          molecular mechanisms. In eukaryotes, before being transported inside the cell via the high-affinity
          copper transporters of the CTR family, the copper (II) ion is reduced to copper (I). In blue
          copper proteins such as cupredoxin, the copper (I) ion form is stabilised by a constrained His2Cys
          coordination environment.</p>


          <p>Multicopper oxidases oxidise their substrate by accepting electrons at a mononuclear copper
          centre and transferring them to a trinuclear copper centre; dioxygen binds to the trinuclear
          centre and, following the transfer of four electrons, is reduced to two molecules of water [[cite:PUB00035913]].
          There are three spectroscopically different copper centres found in multicopper oxidases: type
          1 (or blue), type 2 (or normal) and type 3 (or coupled binuclear) [[cite:PUB00001382], [cite:PUB00001602]].
          Multicopper oxidases consist of 2, 3 or 6 of these homologous domains, which also share homology
          to the cupredoxins azurin and plastocyanin. Structurally, these domains consist of a cupredoxin-like
          fold, a β-sandwich consisting of 7 strands in 2 β-sheets, arranged in a Greek-key β-barrel [[cite:PUB00011817]].
          Multicopper oxidases include:</p>


          <ul>

          <li>Ceruloplasmin ([ec:1.16.3.1]) (ferroxidase), a 6-domain enzyme found in the serum of mammals
          and birds that oxidizes different inorganic and organic substances; exhibits internal sequence
          homology that appears to have evolved from the triplication of a Cu-binding domain similar to
          that of laccase and ascorbate oxidase.</li>

          <li>Laccase ([ec:1.10.3.2]) (urishiol oxidase), a 3-domain enzyme found in fungi and plants,
          which oxidizes different phenols and diamines. CueO is a laccase found in Escherichia coli that
          is involved in copper-resistance [[cite:PUB00011817]].</li>

          <li>Ascorbate oxidase ([ec:1.10.3.3]), a 3-domain enzyme found in higher plants.</li>

          <li>Nitrite reductase ([ec:1.7.2.1]), a 2-domain enzyme containing type-1 and type-2 copper
          centres [[cite:PUB00035911], [cite:PUB00035912]].</li>

          <li>Fission yeast fio1 (also known as SpAC1F7.08), a multicopper oxidase that contains three
          cupredoxin domains and may function together with Frp1 in iron and copper uptakes in S. pombe
          [[cite:PUB00101322]].</li>

          </ul>


          <p>In addition to the above enzymes there are a number of other proteins that are similar to
          the multi-copper oxidases in terms of structure and sequence, some of which have lost the ability
          to bind copper. These include: copper resistance protein A (copA) from a plasmid in Pseudomonas
          syringae; domain A of (non-copper binding) blood coagulation factors V (Fa V) and VIII (Fa VIII)
          [[cite:PUB00000062]]; yeast FET3 required for ferrous iron uptake [[cite:PUB00000901]] and yeast
          FET5 (YFL041w), which similarly to FET3 it is an iron transport multicopper oxidase required
          for Fe2 ion high affinity uptake [[cite:PUB00101323]]. It is targeted to vacuole via AP-3 pathway
          [[cite:PUB00101324]].</p>'
        llm: false
        checked: false
        updated: false
