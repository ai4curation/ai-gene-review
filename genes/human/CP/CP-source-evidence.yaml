        name: copper ion binding
        category:
          code: F
          name: molecular_function
      source_database: interpro
      member_databases:
        prosite:
          PS00080: Multicopper oxidases signature 2
      integrated: null
      hierarchy:
        accession: IPR002355
        name: Multicopper oxidase, copper-binding site
        type: Binding_site
        children: []
      name:
        name: Multicopper oxidase, copper-binding site
        short: Cu_oxidase_Cu_BS
      description:
      - text: <p>The entry represents a conserved region containing the Cu-binding site found in multicopper
          oxidases.</p>
        llm: false
        checked: false
        updated: false
      - text: "<p>Multicopper oxidases oxidise their substrate by accepting electrons at a mononuclear\
          \ copper centre and transferring them to a trinuclear copper centre; dioxygen binds to the trinuclear\
          \ centre and, following the transfer of four electrons, is reduced to two molecules of water\
          \ [[cite:PUB00035913]]. There are three spectroscopically different copper centres found in\
          \ multicopper oxidases: type 1 (or blue), type 2 (or normal) and type 3 (or coupled binuclear)\
          \ [[cite:PUB00001382], [cite:PUB00001602]]. Multicopper oxidases consist of 2, 3 or 6 of these\
          \ homologous domains, which also share homology to the cupredoxins azurin and plastocyanin.\
          \ Structurally, these domains consist of a cupredoxin-like fold, a β-sandwich consisting of\
          \ 7 strands in 2 β-sheets, arranged in a Greek-key β-barrel [[cite:PUB00011817]]. Multicopper\
          \ oxidases include:</p>\r\n\n<ul>\r\n<li>Ceruloplasmin ([ec:1.16.3.1]) (ferroxidase), a 6-domain\
          \ enzyme found in the serum of mammals and birds that oxidizes different inorganic and organic\
          \ substances; exhibits internal sequence homology that appears to have evolved from the triplication\
          \ of a Cu-binding domain similar to that of laccase and ascorbate oxidase.</li>\r\n<li>Laccase\
          \ ([ec:1.10.3.2]) (urishiol oxidase), a 3-domain enzyme found in fungi and plants, which oxidizes\
          \ different phenols and diamines. CueO is a laccase found in Escherichia coli that is involved\
          \ in copper-resistance [[cite:PUB00011817]].</li>\r\n<li>Ascorbate oxidase ([ec:1.10.3.3]),\
          \ a 3-domain enzyme found in higher plants.</li>\r\n<li>Nitrite reductase ([ec:1.7.2.1]), a\
          \ 2-domain enzyme containing type-1 and type-2 copper centres [[cite:PUB00035911], [cite:PUB00035912]].</li>\r\
          \n</ul>"
        llm: false
        checked: false
        updated: false
