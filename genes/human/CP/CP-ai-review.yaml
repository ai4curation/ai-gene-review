- term:
    id: GO:0098869
    label: cellular oxidant detoxification
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:88476
  review:
    summary: Ceruloplasmin can contribute to oxidant detoxification.
    action: KEEP_AS_NON_CORE
    reason: The historical mouse source resolves to Q61147. Its current same-term record is electronic,
      which does not reconstruct the earlier curator evidence. Independent human CP peroxide-removal activity
