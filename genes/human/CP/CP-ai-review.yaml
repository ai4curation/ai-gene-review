- term:
    id: GO:0047066
    label: phospholipid-hydroperoxide glutathione peroxidase activity
  evidence_type: IDA
  original_reference_id: PMID:10481051
  qualifier: enables
  review:
    summary: The source reports glutathione-dependent removal of lipid hydroperoxides.
    action: KEEP_AS_NON_CORE
    reason: PMID:10481051 explicitly describes lipid-hydroperoxide removal at physiological glutathione
      concentrations. Retain this experimentally curated secondary activity with that substrate scope.
      The inaccessible detailed Methods limit independent reconstruction of each lipid substrate and kinetic
      condition.
- term:
    id: GO:0047066
    label: phospholipid-hydroperoxide glutathione peroxidase activity
  evidence_type: IDA
  original_reference_id: PMID:10508415
  qualifier: enables
  review:
    summary: The exact lipid substrate supporting this peroxidase IDA remains unresolved.
    action: UNDECIDED
    reason: PMID:10508415 reports human CP alkyl-hydroperoxide reduction, whereas GO:0047066 specifies
      a hydroperoxy polyunsaturated fatty acid. The inaccessible original Methods may contain the relevant
      substrate assay; the abstract alone neither verifies it nor refutes the curator. Preserve the annotation
      pending the source-specific check.
- term:
    id: GO:0051087
    label: protein-folding chaperone binding
  evidence_type: IPI
  original_reference_id: PMID:19996109
  qualifier: enables
  supporting_entities:
  - UniProtKB:P10909
  review:
    summary: Stressed human plasma ceruloplasmin associates with clusterin.
    action: KEEP_AS_NON_CORE
    reason: Original PMID:19996109 identifies CP as a stress-dependent clusterin client by immunoaffinity/MS,
      immunoblotting and controlled sandwich ELISA. GO:0051087 describes binding to a folding chaperone;
      it does not require the bound client to perform chaperone activity. Retain this positive IPI as
      non-core client binding, with CP fragmentation and ten-day plasma stress limiting intact-product
      and native-condition claims. No CP folding activity or participation in a protein-folding process
      is inferred.
    supported_by:
    - reference_id: PMID:19996109
      supporting_text: These proteins were identified by mass spectrometry as ceruloplasmin, fibrinogen,
        and albumin.
- term:
