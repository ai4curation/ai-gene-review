      equating extracellular location with inability to protect cells.
    additional_reference_ids:
    - PMID:10481051
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: MGI:MGI:88476
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Official cross-reference resolves to Q61147. Current same-term evidence is IEA, not a
          reconstruction or disproof of the historical ISS premise; human peroxide chemistry independently
          supports retention.
