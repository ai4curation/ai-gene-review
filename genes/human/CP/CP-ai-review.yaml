id: P00450
gene_symbol: CP
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Ceruloplasmin is a secreted multicopper glycoprotein whose ferroxidase activity oxidizes
  Fe(II) to Fe(III), coupling extracellular iron handling to cellular iron homeostasis. Soluble plasma
  ceruloplasmin and membrane-associated forms provide different spatial contexts for this chemistry. Loss
  of ceruloplasmin causes tissue iron accumulation in aceruloplasminemia. Additional measured activities
  include glutathione-dependent peroxide reduction, cuprous-ion oxidation and inhibition of myeloperoxidase;
  stressed plasma ceruloplasmin also associates with the extracellular chaperone clusterin.
