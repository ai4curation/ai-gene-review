core_functions:
- description: Oxidizes Fe(II) to Fe(III) to support cellular iron homeostasis. Purified human soluble
    CP provides direct evidence for this extracellular ferroxidase chemistry.
  molecular_function:
    id: GO:0004322
    label: ferroxidase activity
  directly_involved_in:
  - id: GO:0006879
    label: intracellular iron ion homeostasis
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:29183916
    supporting_text: rescue of ferroxidase activity
suggested_questions:
- question: Which complete human transcripts and processed protein sequences correspond to soluble and
    GPI-associated ceruloplasmin, and how does the GEYP-containing transcript relate to those products?
- question: Does human CP cuprous-ion oxidation measurably maintain intracellular copper levels under
    physiological conditions, independently of iron homeostasis?
- question: What are the CP peptide identities and protein-group assignments in the original lysosomal,
    EPS-urine and plasma-microparticle datasets?
suggested_experiments:
- description: Compare sequence-verified human soluble and GPI-associated CP in matched expression systems,
    measuring secretion or surface attachment, copper loading, ferroxidase kinetics and iron export with
    equivalent protein amounts.
- description: Test purified human CP with defined H2O2 and phospholipid-hydroperoxide substrates, glutathione
    titrations and copper-loaded, apo and Cys-site controls to separate substrate scope from iron oxidation.
status: DRAFT
