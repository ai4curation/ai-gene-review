    label: oxidoreductase activity, acting on metal ions
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027769
  review:
    summary: Ferroxidase activity specifies the principal oxidoreductase function.
    action: MODIFY
    reason: Current ARBA00027769 branch 7 matches the official CP FunFam signatures 2.60.40.420:FF:000009
      and 2.60.40.420:FF:000015 together with the Primates taxon predicate. This supports the broad metal-ion
      oxidoreductase premise. Human enzyme and iron-homeostasis evidence identify ferroxidase activity
      as the specific principal function, so GO:0004322 is the replacement.
    additional_reference_ids:
    - PMID:29183916
    proposed_replacement_terms:
    - id: GO:0004322
      label: ferroxidase activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: ARBA:ARBA00027769
        source_status: SUPPORTS_TRANSFER
        comment: All 14 current branches were evaluated against official target signatures and taxonomy.
          Branch 7 matches both FunFam signatures and Primates (NCBITaxon:9443). This current match supports
          the broad premise without reproducing a historical rule version.
- term:
    id: GO:0016724
    label: oxidoreductase activity, acting on metal ions, oxygen as acceptor
  evidence_type: IDA
  original_reference_id: PMID:14623105
  qualifier: enables
  review:
    summary: The experimental metal-ion oxidoreductase category includes the reported cuprous activity.
    action: KEEP_AS_NON_CORE
    reason: PMID:14623105 explicitly reports human CP oxidation of Cu(I) as well as Fe(II). Retain this
      broader oxygen-acceptor category for the additional cuprous substrate scope. Replacing it solely
      with ferroxidase would erase that positive experimental distinction; the current typed children
      expose only ferroxidase, not a verified cuprous-specific child.
- term:
    id: GO:0036479
    label: peroxidase inhibitor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q61147
  - ensembl:ENSMUSP00000088857
  review:
    summary: Ceruloplasmin directly inhibits myeloperoxidase.
    action: KEEP_AS_NON_CORE
    reason: The Ensembl Compara source Q61147 has current IDA PMID:23306200 for this term. The same original
      also directly tests human plasma-purified CP binding to and inhibiting MPO, with kinetic evidence
      for trapping Compound II. This is a real secondary activity, distinct from the dominant ferroxidase
      role.
    additional_reference_ids:
    - PMID:23306200
    - PMID:23843990
    supported_by:
    - reference_id: PMID:23306200
      supporting_text: binding of ceruloplasmin to myeloperoxidase inhibits the halogenation activity
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q61147
        source_status: SUPPORTS_TRANSFER
        comment: Current mouse Q61147 same-term IDA from PMID:23306200 is present; that paper also tests
          purified human CP inhibition directly.
      - source_id: ensembl:ENSMUSP00000088857
        source_status: SUPPORTS_TRANSFER
        comment: Original mouse Ensembl premise retained; no PAINT method is inferred for this orthology
          mapping.
