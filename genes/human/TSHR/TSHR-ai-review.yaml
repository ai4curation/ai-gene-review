description: TSHR encodes the thyroid-stimulating hormone receptor, a basolateral thyroid follicular class A GPCR for pituitary TSH and the GPHA2:GPHB5 heterodimer thyrostimulin. Ligand binding at the plasma membrane activates Gs/adenylate cyclase/cAMP and phospholipase C-linked signaling branches to control thyroid hormone biosynthesis, secretion, thyroid growth, and extra-thyroid responses.
