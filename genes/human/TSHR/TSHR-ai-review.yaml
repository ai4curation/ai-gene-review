  review:
    summary: Modify the root peptide-GPCR IBA to thyroid-stimulating hormone receptor activity.
    action: MODIFY
    reason: TSH and thyrostimulin are heterodimeric glycoprotein hormones, so the root PTN000689980 peptide-receptor IBA is on the wrong ligand branch for TSHR. The same PANTHER family review places the specific type A receptor terms under GO:0016500 protein-hormone receptor activity; GO:0004996 captures TSHR's cognate receptor activity and is already directly supported in this review.
    supported_by:
    - reference_id: file:human/TSHR/TSHR-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: mediates the activation of adenylate cyclase
    - reference_id: file:human/TSHR/TSHR-deep-research-manual.md
      supporting_text: Its core molecular activity is Gs-coupled TSH/thyrostimulin receptor activity at the thyroid follicular cell surface
    - reference_id: file:interpro/panther/PTHR24372/PTHR24372-review.yaml
      supporting_text: 'GO:0008528 IBD at the root PTN000689980 and assert GO:0004930 G protein-coupled receptor activity'
    proposed_replacement_terms:
    - id: GO:0004996
      label: thyroid-stimulating hormone receptor activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000689980
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Ancestral node spanning the glycoprotein hormone receptors and the wider
          leucine-rich-repeat GPCR clade. The peptide-receptor term fits the members whose
          ligands are peptides, but descendants whose ligands are glycoprotein hormones have
          their own GO branch under protein-hormone receptor activity.
      - source_id: RGD:3007
        source_label: Lhcgr
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Rat lutropin receptor, one of the two IBD seeds. Its ligand is also a glycoprotein
          hormone, so the same branch question applies to the seed itself.
      - source_id: FB:FBgn0003255
        source_label: rk
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Drosophila rickets, the other IBD seed. The peptide-receptor term fits this
          bursicon receptor but does not generalize to the glycoprotein-hormone receptor
          descendants in the same family.
