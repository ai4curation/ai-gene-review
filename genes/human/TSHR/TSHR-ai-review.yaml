      supporting_text: Activation of the thyrotropin (TSH) receptor by bovine TSH led to increased incorporation of the photoreactive GTP analogue [alpha-32P]GTP azidoanilide into immunoprecipitated alpha subunits of all G proteins detected in thyroid membranes.
