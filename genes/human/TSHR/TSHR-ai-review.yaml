  evidence_type: IMP
  original_reference_id: PMID:11847099
  qualifier: involved_in
  review:
    summary: Remove the TRH-response row.
    action: REMOVE
    reason: PMID:11847099 supports glycoprotein hormone receptor activation by TSH, LH/CG and FSH; it does not support response to thyrotropin-releasing hormone, a distinct hypothalamic peptide that acts through TRHR rather than TSHR. UniProt used the same paper to annotate LHCGR to cellular response to luteinizing hormone stimulus, so the TSHR row appears to be a label-driven substitution of thyrotropin-releasing hormone for thyrotropin.
