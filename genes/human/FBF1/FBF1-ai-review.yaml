id: Q8TES7
gene_symbol: FBF1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  FBF1 (Fas-binding factor 1, also Albatross) is a coiled-coil protein of the distal appendages (ciliary
  transition fibers) of the mother centriole and ciliary basal body. Recruited downstream of CEP83 and
  SCLT1 (with LRRC45), FBF1 occupies the distal appendage matrix between the appendage blades, close to
  the ciliary membrane. Rather than being a core scaffold for appendage assembly, it acts at the ciliary
  base to control entry into the cilium: the C. elegans orthologue DYF-19 binds IFT-B and is needed for
  assembled IFT particles to pass the ciliary base, and human FBF1 is required for gating of ciliary transmembrane
  proteins. Depletion impairs ciliogenesis in some studies. In epithelial cells FBF1/Albatross also binds
  keratin filaments and PARD3 and is needed for apical junctional complex formation and epithelial polarity.
