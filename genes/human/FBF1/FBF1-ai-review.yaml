core_functions:
- description: "Distal appendage (transition fiber) matrix component at the ciliary base that controls\
    \ entry of\n   assembled IFT trains and ciliary transmembrane proteins into the cilium (ciliary gating),\
    \ contributing to assembly of a\n   functional cilium. No specific molecular activity has been established."
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0036064
    label: ciliary basal body
  in_complex:
    id: GO:0097539
    label: ciliary transition fiber
  supported_by:
  - *id006
  - *id003
  - *id009
  - reference_id: PMID:30131441
    supporting_text: Once there, LRRC45 recruits the keratin-binding protein FBF1.
- description: "In polarized epithelial cells, FBF1/Albatross associates with keratin filaments and PARD3\
    \ and is\n   required for apical junctional complex formation and maintenance of epithelial polarity\
    \ (non-core relative to the\n   ciliary role)."
  directly_involved_in:
  - id: GO:0043297
    label: apical junction assembly
  supported_by:
  - *id004
  - *id011
suggested_questions:
- question: Is FBF1 strictly required for cilium initiation in human cells, or (as knockout data suggest)
    mainly for gating IFT and membrane-protein entry once the cilium forms?
- question: Are the epithelial junction/keratin and distal appendage functions of FBF1 carried out by
    distinct pools or isoforms?
suggested_experiments:
- description: In FBF1-knockout RPE-1 cells, quantify IFT-B entry and ciliary transmembrane protein diffusion
    barriers by live imaging and FRAP, and rescue with FBF1 mutants lacking the IFT54-binding region to
    test the direct gating mechanism.
