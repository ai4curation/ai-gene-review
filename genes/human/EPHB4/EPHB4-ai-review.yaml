id: P54760
gene_symbol: EPHB4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EPHB4 encodes EphB4, a cell-surface receptor tyrosine kinase that recognizes the transmembrane
  ligand ephrin-B2. The canonical 987-residue receptor contains an extracellular ligand-binding region,
  one membrane-spanning helix and a cytoplasmic kinase domain. Ligand-dependent receptor signaling and
  reciprocal signaling through ephrin-B2 regulate endothelial organization and vascular growth; downstream
  effects depend on cell type and ligand presentation. Human pathogenic variants can impair receptor abundance,
  localization, kinase activation or coupling to RAS-regulatory proteins and cause vascular or lymphatic
  malformations. Three reported shorter splice isoforms retain portions of the extracellular sequence
  but lack the canonical transmembrane and kinase regions; their secretion, ligand binding and physiological
  functions remain unestablished. Selected tumor-cell experiments also report erythropoietin-dependent
  EphB4 activation, a contextual response distinct from its established ephrin receptor role.
