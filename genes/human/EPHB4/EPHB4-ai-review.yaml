  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:104757
  - PANTHER:PTN000700012
  - UniProtKB:P54760
  review:
    action: ACCEPT
    summary: EPHB4 is the receptor that initiates forward Eph signalling.
