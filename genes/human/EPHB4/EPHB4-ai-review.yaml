    label: cell surface receptor protein tyrosine kinase signaling pathway
  supported_by:
  - reference_id: PMID:8188704
    supporting_text: Purified in vitro translated Htk was enzymatically active and
      autophosphorylated on tyrosine in kinase assays.
  - reference_id: file:human/EPHB4/EPHB4-uniprot.txt
    supporting_text: Phosphorylates inactive tyrosine-protein kinase EPHB6 which promotes
      interaction of EPHB6 with SH2 domains
  - reference_id: file:human/EPHB4/EPHB4-uniprot.txt
    supporting_text: L-tyrosyl-[protein] + ATP = O-phospho-L-tyrosyl-[protein]
suggested_questions:
- question: What determines whether EPHB4 activation inhibits or stimulates the RAS-ERK
    pathway, given opposite outcomes in endothelial and breast cancer cells?
- question: Does the RASA1 interaction explain why EPHB4 and RASA1 mutations converge on
    the same capillary malformation phenotype, and is it required for EPHB4 control of
    RAS-MAPK output?
- question: How much EPHB4 signalling in vivo runs through kinase-dependent forward
    signalling versus kinase-independent scaffolding, for example through EPHB6?
suggested_experiments:
- hypothesis: The context-dependent effect of EPHB4 on RAS-ERK is set by the availability
    of RASA1 at the receptor.
  description: Compare ERK output after ephrin-B2 stimulation in endothelial and carcinoma
    cells with and without RASA1 depletion, and with EPHB4 phosphosite mutants that cannot
    recruit RASA1.
- hypothesis: Capillary malformation-associated EPHB4 variants are specifically defective
    in forward signalling rather than in ligand binding.
  description: Express patient-derived EPHB4 variants in endothelial cells and measure
    ephrin-B2 binding by surface labelling, receptor autophosphorylation, RASA1 recruitment
    and repulsion from ephrin-B2-positive cells, separating binding from signalling defects.
- hypothesis: EPHB4 kinase activity is dispensable for some of its vascular functions.
  description: Knock in a kinase-dead EPHB4 in endothelial cells and compare segregation,
    sprouting and ERK responses with those of null and wild-type cells.
