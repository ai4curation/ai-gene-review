  review:
    summary: EPHB4 is an active receptor for transmembrane ephrin-B ligands.
    action: MODIFY
    reason: PMID:8188704 remains limited to verified abstract and partial original text; its title is
      not treated as evidence of a different target. Independent human receptor and kinase experiments
      establish the specific function. The current GO:0005005 term specifies activation by a transmembrane
      ephrin and is a descendant of ephrin receptor and receptor tyrosine kinase activities. Human EPHB4
      responds to ephrin-B2 in cell-based activation assays (PMID:27400125, receptor-phosphorylation experiments;
      PMID:22555806, Figures 1–3), while purified human EPHB4 residues 588–987 catalyze phosphorylation
      in PMID:34431498 Methods and Figure 4. Those domain reagents are not full-length receptor preparations.
      This specificity concerns the canonical membrane receptor; it is not assigned indiscriminately to
      the three short splice products.
