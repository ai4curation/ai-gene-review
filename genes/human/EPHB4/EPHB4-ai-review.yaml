suggested_questions:
- question: Are the P54760-2, P54760-3 and P54760-4 products detectably translated and secreted in normal
    human tissues, and which, if any, retain folded ephrin-B2 binding activity independently of engineered
    soluble EPHB4 reagents?
- question: Which primary human EPHB4 cleavage assays support the extracellular and cytosolic fragments
    modeled in Reactome, and what are their product-specific cleavage sites and compartments?
- question: Which signaling requirements distinguish EPHB4 forward kinase signaling from its presentation
    of a ligand for ephrin-B2 reverse signaling during sprouting and vascular remodeling?
- question: What heart-specific morphogenesis observations in PMID:10518221 support the mouse donor annotation,
    and how should its scope transfer to human EPHB4?
- question: Under what physiological concentrations and cellular contexts does erythropoietin activate
    native full-length EPHB4 independently of EPOR, and how do the recombinant reagent boundaries affect
    the reported affinity?
- question: Which EPHB4 peptides and source product underlie the expressed-prostatic-secretion exosome
    identification in PMID:23533145 Supplemental Table 2?
core_functions:
- description: Binds transmembrane ephrin-B2 at the plasma membrane and transduces cell-contact signals
    through receptor tyrosine kinase activity. This receptor role supports endothelial organization, with
    vascular outputs reflecting both EphB4 forward signaling and reciprocal ephrin-B2 signaling. The molecular
    activity applies to the canonical membrane- and kinase-containing receptor; equivalent functions have
    not been established for the three shorter natural splice products.
