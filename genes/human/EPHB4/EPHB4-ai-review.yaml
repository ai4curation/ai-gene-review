- id: PMID:27400125
  title: EPHB4 kinase-inactivating mutations cause autosomal dominant lymphatic-related hydrops fetalis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identity and actual original main XML verified via PMC4966301/DOI 10.1172/JCI85794.
      Read Results on receptor phosphorylation and lymphatic/lymphovenous valves, Methods on human OriGene
      EPHB4 constructs, HEK293T and human dermal lymphatic endothelial cells, ligand stimulation, immunoprecipitation
      and mouse conditional deletion, plus Figures 3-6 captions. Human receptor phosphorylation and mouse
      developmental experiments are distinct. Supplementary files and figure pixels were not inspected.
