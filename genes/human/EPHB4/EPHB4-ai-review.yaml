core_functions:
- description: Cell-surface receptor for the transmembrane ligand ephrin-B2 on apposed
    cells. Binding is highly selective, assembles a receptor and ligand heterotetramer and
    initiates forward signalling that drives repulsion and segregation of endothelial
    cells from ephrin-B2-positive cells, thereby maintaining arteriovenous boundaries and
    controlling adhesion, migration and sprouting during angiogenesis.
  molecular_function:
    id: GO:0005003
    label: ephrin receptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0048013
    label: ephrin receptor signaling pathway
  - id: GO:0001525
    label: angiogenesis
  - id: GO:0002042
    label: cell migration involved in sprouting angiogenesis
  supported_by:
  - reference_id: PMID:16867992
    supporting_text: we determined the crystal structure of the ligand binding domain of
      EphB4 in complex with the extracellular domain of ephrinB2
  - reference_id: PMID:12734395
    supporting_text: EphrinB2-mediated repulsive signals are transduced by EphB4
  - reference_id: PMID:28687708
    supporting_text: Germline Loss-of-Function Mutations in EPHB4 Cause a Second Form of
      Capillary Malformation-Arteriovenous Malformation (CM-AVM2) Deregulating RAS-MAPK
      Signaling.
- description: Active receptor tyrosine kinase. Ligand-induced clustering triggers
    autophosphorylation of the juxtamembrane and kinase regions, creating docking sites for
    SH2-domain adaptors, and EPHB4 also phosphorylates the catalytically dead receptor
    EPHB6 in trans.
  molecular_function:
    id: GO:0004714
    label: transmembrane receptor protein tyrosine kinase activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
