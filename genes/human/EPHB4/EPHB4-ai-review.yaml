- id: PMID:10518221
  title: Symmetrical mutant phenotypes of the receptor EphB4 and its specific transmembrane ligand ephrin-B2
    in cardiovascular development.
  findings: []
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Verified identifier, mouse Ephb4 donor annotation and accessible abstract. Full original
      unavailable after the recorded publisher attempt; specific heart-morphogenesis assays remain unresolved.
      The abstract positively supports the EphB4/ephrin-B2 endothelial angiogenesis and signaling claims.
      DOI: 10.1016/s1097-2765(00)80342-1.'
- id: PMID:16424904
  title: EphB4 controls blood vascular morphogenesis during postnatal angiogenesis.
  findings:
  - statement: Endothelial EphB4 manipulations alter vessel branching and sprouting; activity of an artificial
      kinase-truncated reagent supports a contribution from ephrin-B2 reverse signaling rather than a
      uniformly forward-kinase explanation (Figures 2–5 and 7–8).
- id: PMID:17428795
  title: Ligand binding and calcium influx induce distinct ectodomain/gamma-secretase-processing pathways
    of EphB2 receptor.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Actual recovered PMC4005067 original Experimental Procedures and Results/Figure 1-2
      captions read. The construct is murine EphB2; HEK293T is a host, not evidence of human EPHB4 protein
      testing. Supports cleavage-derived extracellular/cytosolic EphB2 products and bounds the Reactome
      EPHB4 family extension. DOI: 10.1074/jbc.M611449200. No figure pixels or supplements inspected.'
- id: PMID:18593464
  title: Novel splice variants derived from the receptor tyrosine kinase superfamily are potential therapeutics
    for rheumatoid arthritis.
  findings:
  - statement: Three cloned human EPHB4 splice transcripts encode shortened products, but these EPHB4
      variants are not among the ten ASVs tested functionally in Table 2 (Table 1; Additional file 1 entries
      EU826608–EU826610).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual original Table 1 and supplement identify three EPHB4 splice transcripts; EPHB4
      is absent from the ten functionally tested ASVs in Table 2. Cloning evidence does not establish
      secretion or ligand-trap activity of these three products.
- id: PMID:18713744
  title: Ephrin-B2-induced cleavage of EphB2 receptor is mediated by matrix metalloproteinases to trigger
    cell repulsion.
