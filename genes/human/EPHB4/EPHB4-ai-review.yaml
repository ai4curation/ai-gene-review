  review:
    summary: EphB4-dependent endothelial signaling contributes to angiogenesis.
    action: ACCEPT
    reason: The original PMID:12734395 Methods/Results remain unavailable; its verified abstract is not
      used to infer assay details. The verified mammalian EPHB4 PAINT assertion is supported by the actual
      receptor biology and independent vascular experiments. PMID:16424904 Results Figures 2–5 and 7–8
      manipulate EphB4 in proliferating mouse endothelium and examine tumor/retinal vascular remodeling,
      branching and sprouting. Both full-length and kinase-truncated reagents affect vascular architecture,
      implicating bidirectional EphB4/ephrin-B2 signaling rather than proving that every vascular effect
      is caused by forward kinase signaling. These artificial reagents do not establish the functions
      of natural short human products.
