id: P54760
gene_symbol: EPHB4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EPHB4 is a single-pass type I transmembrane receptor tyrosine kinase of the
  Eph family, with an extracellular ligand-binding domain, cysteine-rich region and
  fibronectin type III repeats, and an intracellular kinase and SAM domain. Its
  extracellular region is exposed at the cell surface and binds the transmembrane ligand
  ephrin-B2 on adjacent cells with unusually high selectivity, producing contact-dependent
  bidirectional signalling. Ligand binding drives receptor clustering and
  autophosphorylation, and EPHB4 also phosphorylates the catalytically dead receptor
  EPHB6. The EPHB4 and ephrin-B2 pair marks and maintains arteriovenous identity in the
  vasculature, since forward signalling through EPHB4 drives repulsion and segregation of
  endothelial cells from ephrin-B2-positive cells and modulates adhesion, migration and
  sprouting angiogenesis. Germline loss-of-function mutations cause capillary
  malformation-arteriovenous malformation type 2 and contribute to vein of Galen
  malformation, and the receptor also influences RAS-MAPK output in a context-dependent
  way.
