- term:
    id: GO:0007155
    label: cell adhesion
  evidence_type: IDA
  original_reference_id: PMID:12734395
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: EPHB4 signalling controls endothelial adhesion, positively through the
      receptor and negatively when the ligand ectodomain engages it.
    reason: Soluble EphB4-Fc is pro-adhesive while ephrin-B2-Fc is anti-adhesive and
      detaches endothelial cells, so adhesion is directly modulated by this
      receptor-ligand pair. The curated function statement records regulation of cell
      adhesion and migration.
    supported_by:
    - reference_id: PMID:12734395
      supporting_text: In turn, soluble EphB4-Fc is pro-adhesive and stimulates EC
        migration and sprouting angiogenesis.
    - reference_id: file:human/EPHB4/EPHB4-uniprot.txt
      supporting_text: it is involved in the regulation of cell adhesion and migration
