  qualifier: part_of
  review:
    action: ACCEPT
    summary: Ligand binding assembles a heterotetramer of receptor and ephrin dimers.
    reason: UniProt records the heterotetramer composed of an ephrin dimer and a receptor
      dimer, and oligomerisation is required for signalling, so EPHB4 is genuinely part of
      a signalling receptor complex.
