  review:
    summary: CD14 accepts lipidated microbial ligands (LPS, lipopeptides) from LBP and delivers them to
      TLR4-MD-2 or TLR1/TLR2 signalling receptors, dissociating after transfer.
    action: ACCEPT
    reason: This is the most accurate description of the molecular activity of CD14 and matches the production
      GO-CAMs for TLR4 and TLR1-TLR2 signalling, which model CD14 as molecular carrier activity. Reconstitution
      shows LPS moving LBP -> CD14 -> TLR4-MD2, and sCD14 drives TLR1-TLR2-lipopeptide complex formation
      without remaining in the complex.
