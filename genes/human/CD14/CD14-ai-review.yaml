  original_reference_id: Reactome:R-HSA-166168
  qualifier: located_in
  review:
    summary: Reactome places CD14 with internalised TLR4:MD-2:LPS on the endosome membrane (Reactome:R-HSA-166168).
    action: KEEP_AS_NON_CORE
    reason: CD14 drives LPS-induced endocytosis of TLR4 and delivers it to endosomes for TRIF signalling,
      so CD14 plausibly accompanies the complex into endosomes. Its primary site of action is the plasma
      membrane.
    supported_by:
    - reference_id: PMID:22078883
      supporting_text: the plasma membrane localized Pattern Recognition Receptor (PRR) CD14 is required
        for the microbe-induced endocytosis of TLR4
    - reference_id: PMID:22078883
      supporting_text: This cascade begins with CD14 transporting LPS to TLR4, and culminates with CD14
        delivering TLR4 to the endosomal signaling machinery that is needed to induce IFN expression
    - reference_id: file:human/CD14/CD14-deep-research-falcon.md
      supporting_text: Following ligand engagement, CD14 facilitates internalization of the TLR4/MD-2
        complex from the plasma membrane into early endosomes
