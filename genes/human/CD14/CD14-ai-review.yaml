- term:
    id: GO:0016019
    label: peptidoglycan immune receptor activity
  evidence_type: TAS
  original_reference_id: PMID:8798531
  qualifier: enables
  review:
    summary: Human CD14 expressed in 70Z/3 cells conferred responsiveness to peptidoglycan, and anti-CD14
      blocked the response.
    action: MODIFY
    reason: The term note restricts GO:0016019 to proteins with receptor activity and recommends peptidoglycan
      binding otherwise. CD14 is GPI-anchored and acts by presenting ligands to transmembrane signalling
      receptors; the paper shows CD14-dependent responsiveness, consistent with CD14 binding peptidoglycan,
      not with CD14 transducing the signal itself.
    proposed_replacement_terms:
    - id: GO:0042834
      label: peptidoglycan binding
    supported_by:
    - reference_id: PMID:8798531
      supporting_text: Both peptidoglycan- and endotoxin-induced activation of NF-kappaB were inhibited
        by anti-CD14 mAb
    - reference_id: PMID:8798531
      supporting_text: 70Z/3-CD14 cells were responsive to both insoluble and soluble peptidoglycan
- term:
    id: GO:0030667
    label: secretory granule membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6798743
  qualifier: located_in
  review:
    summary: Reactome neutrophil degranulation reaction lists CD14 as a secretory granule membrane protein
      delivered to the cell surface.
    action: KEEP_AS_NON_CORE
    reason: Plausible for granulocyte CD14 (UniProt notes weak granulocyte expression); a storage compartment
      rather than a site of function.
- term:
    id: GO:0031663
    label: lipopolysaccharide-mediated signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0001875
  review:
    summary: Inferred from LPS-related MF; CD14 participates in LPS-initiated signalling by delivering
      LPS to TLR4-MD-2.
    action: ACCEPT
    reason: Participation is supported by direct evidence.
    supported_by:
    - reference_id: PMID:27986454
      supporting_text: LPS transfer to TLR4-MD2 is catalyzed by both LPS binding protein (LBP) and CD14
    - reference_id: PMID:1698311
      supporting_text: CD14, a differentiation antigen of monocytes, was found to bind complexes of LPS
        and LBP, and blockade of CD14 with monoclonal antibodies prevented synthesis of TNF-alpha by whole
        blood incubated with LPS
- term:
    id: GO:0031666
    label: positive regulation of lipopolysaccharide-mediated signaling pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P10810
  - ensembl:ENSMUSP00000056669
  review:
    summary: Ortholog-transferred positive regulation of LPS-mediated signalling.
    action: KEEP_AS_NON_CORE
    reason: CD14 sensitises cells to low LPS doses, so a positive-regulation reading is defensible, but
      CD14 is better described as a participant in the pathway (GO:0034142, GO:0031663).
