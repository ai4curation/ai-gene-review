    label: lipopolysaccharide binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001636475
  - UniProtKB:P08571
  review:
    summary: CD14 binds monomeric LPS (1-2 molecules per CD14) in an N-terminal hydrophobic pocket; LPS
      is loaded onto CD14 by LBP.
    action: ACCEPT
    reason: Direct LPS binding by soluble and membrane CD14 is one of the best-established biochemical
      properties of the protein (sucrose gradient binding, cross-linking, crystal structure of the ligand
      pocket) and is the basis of its carrier function. The IBA and IDA rows agree.
    supported_by:
    - reference_id: PMID:7537731
      supporting_text: LBP catalyzes LPS binding to sCD14
    - reference_id: PMID:7537731
      supporting_text: Complexes of LPS with sCD14 do not form large aggregates, consisting of only 1-2
        LPS bound to a single sCD14 even at high multiples of LPS to sCD14
    - reference_id: PMID:11274165
      supporting_text: LPS is cross-linked specifically to TLR4 and MD-2 only when co-expressed with CD14
    - reference_id: PMID:23264655
      supporting_text: The structure reveals a bent solenoid typical of leucine-rich repeat proteins with
        an amino-terminal pocket that presumably binds acylated ligands including LPS
