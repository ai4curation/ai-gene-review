- term:
    id: GO:0006909
    label: phagocytosis
  evidence_type: TAS
  original_reference_id: PMID:9548256
  qualifier: involved_in
  review:
    summary: CD14 on macrophages recognises apoptotic cells and triggers their phagocytosis.
    action: MODIFY
    reason: Correct but general; the evidence is specifically about recognition and clearance of apoptotic
      cells, which apoptotic cell clearance captures.
    proposed_replacement_terms:
    - id: GO:0043277
      label: apoptotic cell clearance
    supported_by:
    - reference_id: PMID:9548256
      supporting_text: Here we show that apoptotic cells interact with CD14, triggering phagocytosis of
        the apoptotic cells
    - reference_id: PMID:9548256
      supporting_text: the glycosylphosphatidylinositol-linked plasma-membrane glycoprotein CD14 on the
        surface of human macrophages is important for the recognition and clearance of apoptotic cells
- term:
    id: GO:0006915
    label: apoptotic process
  evidence_type: TAS
  original_reference_id: PMID:9548256
  qualifier: involved_in
  review:
    summary: Traceable-author statement from a study of CD14-mediated recognition of apoptotic cells.
    action: REMOVE
    reason: The cited study shows CD14 on macrophages recognising and clearing apoptotic cells; CD14 does
      not execute or regulate apoptosis of the cell it resides in. The relevant process is apoptotic cell
      clearance.
    supported_by:
    - reference_id: PMID:9548256
      supporting_text: Here we show that apoptotic cells interact with CD14, triggering phagocytosis of
        the apoptotic cells
- term:
    id: GO:0007166
    label: cell surface receptor signaling pathway
  evidence_type: TAS
  original_reference_id: PMID:8798531
  qualifier: involved_in
  review:
    summary: CD14 confers responsiveness to peptidoglycan and LPS (NF-kappaB activation) in transfected
      70Z/3 cells.
    action: MODIFY
    reason: Correct but very general. The signalling CD14 contributes to is initiated by microbial ligands
      at cell-surface PRRs, so the more informative term is cell surface pattern recognition receptor
      signaling pathway, which is also supported by IDA.
    proposed_replacement_terms:
    - id: GO:0002752
      label: cell surface pattern recognition receptor signaling pathway
    supported_by:
    - reference_id: PMID:8798531
      supporting_text: Both peptidoglycan- and endotoxin-induced activation of NF-kappaB were inhibited
        by anti-CD14 mAb
