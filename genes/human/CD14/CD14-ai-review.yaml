core_functions:
- description: Binds monomeric LPS and other acylated microbial ligands (lipopeptides, lipoteichoic acid)
    handed on by LBP and carries them to the TLR4-MD-2 complex or TLR2 heterodimers, acting as the ligand-delivery
    component of the LPS receptor complex at the cell surface and, as soluble CD14, in extracellular fluid.
  molecular_function:
    id: GO:0140104
    label: molecular carrier activity
  directly_involved_in:
  - id: GO:0034142
    label: toll-like receptor 4 signaling pathway
  - id: GO:0002752
    label: cell surface pattern recognition receptor signaling pathway
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  - id: GO:0005576
    label: extracellular region
  in_complex:
    id: GO:0046696
    label: lipopolysaccharide receptor complex
  supported_by:
  - reference_id: PMID:27986454
    supporting_text: LPS transfer to TLR4-MD2 is catalyzed by both LPS binding protein (LBP) and CD14
  - reference_id: PMID:27986454
    supporting_text: Subsequently, the single LPS molecule bound to CD14 was transferred to TLR4-MD2 in
      a TLR4-dependent manner
  - reference_id: PMID:23430250
    supporting_text: either LBP or sCD14 can drive ternary complex formation and TLR activation by acting
      as mobile carriers of triacylated lipopeptides or lipoproteins
  - reference_id: PMID:23264655
    supporting_text: CD14 physically delivers these lipidated microbial products to various TLR signaling
      complexes that subsequently induce intracellular proinflammatory signaling cascades upon ligand
      binding
  - reference_id: file:human/CD14/CD14-deep-research-falcon.md
    supporting_text: The primary molecular function of CD14 is to serve as a co-receptor that captures,
      concentrates, and transfers pathogen-associated molecular patterns (PAMPs) and damage-associated
      molecular patterns (DAMPs) to downstream signaling receptors
- description: Binds bacterial lipopolysaccharide directly through the amino-terminal hydrophobic pocket
    of its LRR solenoid.
  molecular_function:
    id: GO:0001530
    label: lipopolysaccharide binding
  directly_involved_in:
  - id: GO:0071222
    label: cellular response to lipopolysaccharide
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: PMID:7537731
    supporting_text: Complexes of LPS with sCD14 do not form large aggregates, consisting of only 1-2
      LPS bound to a single sCD14 even at high multiples of LPS to sCD14
  - reference_id: PMID:23264655
    supporting_text: The structure reveals a bent solenoid typical of leucine-rich repeat proteins with
      an amino-terminal pocket that presumably binds acylated ligands including LPS
  - reference_id: PMID:11274165
    supporting_text: LPS is cross-linked specifically to TLR4 and MD-2 only when co-expressed with CD14
suggested_questions:
- question: Membrane CD14 drives Syk/PLCgamma2-dependent TLR4 endocytosis independently of its ligand-transfer
    role. Should this be captured as coreceptor activity (GO:0015026) in addition to molecular carrier
    activity, and is the endocytosis role conserved in human monocytes as it is in mouse dendritic cells
    and macrophages?
- question: GO:0001875 lipopolysaccharide immune receptor activity is propagated from human CD14 to mouse
    Cd14 by ISO/IEA. If the human annotation is replaced by molecular carrier activity, should the propagated
    rows follow, and should GO:0001875 be reserved for the TLR4-MD-2 signalling unit?
- question: How much of the CD14 dependence of TLR2 lipopeptide and peptidoglycan responses reflects ligand
    carriage versus contaminating lipoproteins in peptidoglycan preparations?
suggested_experiments:
- description: Compare TLR4 endocytosis and TRIF-dependent IFN-beta output in CD14-knockout human monocyte-derived
    macrophages reconstituted with wild-type CD14, a pocket mutant unable to bind LPS, or a transmembrane-anchored
    CD14 lacking the GPI signal.
  hypothesis: CD14 drives TLR4 endocytosis through its GPI anchor and raft partitioning, separable from
    its LPS-carrier activity.
  experiment_type: genetic complementation with functional readouts
- description: Single-molecule reconstitution of lipopeptide transfer from LBP to CD14 to TLR2-TLR1 and
    TLR2-TLR6, measuring whether CD14 dissociates after transfer as it does for LPS and TLR4-MD-2.
  hypothesis: CD14 acts as a transient carrier for all acylated ligands rather than a stable receptor
    subunit.
  experiment_type: in vitro reconstitution / single-molecule biophysics
