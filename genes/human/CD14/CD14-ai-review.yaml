- term:
    id: GO:0001847
    label: opsonin receptor activity
  evidence_type: TAS
  original_reference_id: PMID:2402637
  qualifier: enables
  review:
    summary: Traceable-author statement from a paper on the structure of LBP; LBP-LPS complexes bind monocytes.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited abstract concerns LBP and does not name CD14. CD14 does bind LBP-LPS complexes,
      but the opsonin receptor term requires transmitting a signal across the membrane, which GPI-anchored
      CD14 cannot do on its own. Its activity toward LBP-loaded ligands is better captured by LPS binding
      and molecular carrier activity.
    supported_by:
    - reference_id: PMID:2402637
      supporting_text: LBP may control the response to LPS under physiologic conditions by forming high-affinity
        complexes with LPS that bind to monocytes and macrophages, which then secrete tumor necrosis factor
    - reference_id: PMID:1698311
      supporting_text: CD14, a differentiation antigen of monocytes, was found to bind complexes of LPS
        and LBP, and blockade of CD14 with monoclonal antibodies prevented synthesis of TNF-alpha by whole
        blood incubated with LPS
- term:
    id: GO:0001875
    label: lipopolysaccharide immune receptor activity
  evidence_type: IDA
  original_reference_id: PMID:15294986
  qualifier: enables
  review:
    summary: CD14 binds LPS and is part of the LPS receptor complex, but it is GPI-anchored and hands
      LPS on to TLR4-MD-2, which transmits the signal across the membrane.
    action: MODIFY
    reason: 'GO:0001875 is defined as combining with LPS and transmitting the signal across the cell membrane.
      CD14 has no transmembrane or cytoplasmic domain and its LPS-specific role is ligand extraction and
      transfer to TLR4-MD-2, after which the signal-transducing receptor is TLR4 (with MD-2). The cited
      abstract (about LBP and lipopeptides) supports CD14 as a ligand acceptor in receptor complexes.
      The curator-built GO-CAMs represent this activity of CD14 as molecular carrier activity; the LPS-binding
      aspect is captured by GO:0001530. The evidence is not disputed, only the term: replace with molecular
      carrier activity.'
    proposed_replacement_terms:
    - id: GO:0140104
      label: molecular carrier activity
    supported_by:
    - reference_id: PMID:15294986
      supporting_text: we were able to show that LBP transfers lipopeptides to CD14 on human monocytes
        using FACS analysis
    - reference_id: PMID:27986454
      supporting_text: Subsequently, the single LPS molecule bound to CD14 was transferred to TLR4-MD2
        in a TLR4-dependent manner
    - reference_id: PMID:2462937
      supporting_text: all monocyte CD14 is joined to the plasma membrane by a phosphatidylinositol phospholipid
