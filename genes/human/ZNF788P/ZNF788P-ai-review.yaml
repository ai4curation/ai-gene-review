suggested_questions:
- question: >-
    Was the 3' RACE product of the Sigal et al. FLJ46419 clone unique to ZNF788P, or
    could it come from a paralogous chr19 KRAB-zinc-finger gene? Should the 2015 HDA
    nucleus row on Q6ZQV5 be re-evaluated now that the entry describes an 82-aa KRAB-A
    fragment rather than the zinc-finger protein that was probably observed?
- question: >-
    Do the ZNF788P peptides reported in PeptideAtlas/MassIVE map uniquely to this locus,
    and to which part (KRAB fragment or zinc-finger ORF)?
suggested_experiments:
- description: >-
    Run ribosome profiling or targeted proteomics with peptides unique to ZNF788P,
    covering both the 82-aa KRAB-A fragment and the downstream zinc-finger ORF. This
    would show which, if either, is translated, and could revise PE5 or support
    retirement of the protein entry.
