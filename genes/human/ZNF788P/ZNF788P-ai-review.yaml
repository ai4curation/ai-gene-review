id: Q6ZQV5
gene_symbol: ZNF788P
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ZNF788P is a transcribed pseudogene on chromosome 19p13.2 (formerly ZNF788). It is
  derived from a KRAB-C2H2 zinc-finger gene. The locus contains a KRAB-A exon and a
  downstream array of about 14-17 C2H2 zinc-finger motifs, but in the known transcripts
  these two parts are separated by an in-frame stop codon and do not form a single open
  reading frame. The current UniProt product is a hypothetical 82-residue polypeptide
  that contains a truncated KRAB-A box with no KRAB-B box and no zinc fingers. A
  separate zinc-finger-only open reading frame can be translated from an internal start
  codon. An endogenously YFP-tagged product assigned to this transcript (FLJ46419) was
  nuclear in a lung carcinoma cell line. Whether any protein from the locus is stably
  made, and what it does, is unknown.
