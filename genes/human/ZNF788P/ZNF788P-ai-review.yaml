existing_annotations:
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: HDA
  original_reference_id: PMID:16791210
  qualifier: located_in
  review:
    summary: >-
      This row comes from endogenous CD-tagging (YFP inserted as an internal exon at the
      chromosomal locus in H1299 cells), not from overexpression. Clone "FLJ46419" (the
      ZNF788P alias) was one of 20 nuclear proteins tracked. The evidence is real, but
      it was attached in 2015 to the former 615-aa zinc-finger sequence of this entry,
      not to the current 82-aa KRAB fragment.
    action: UNDECIDED
    reason: >-
      I read the full text (author-hosted PDF; the publications cache holds only the
      abstract). Each tagged protein was identified by 3' RACE from YFP to the poly(A)
      tail, and Fig. 3q lists "uncharacterized protein FLJ46419" as nuclear. A
      promoterless, ATG-less YFP exon fluoresces only when spliced in frame into a
      translated mRNA. The observation is therefore direct evidence that some protein
      encoded by the FLJ46419 transcript is translated and nuclear. Because 3' RACE reads
      downstream of the insertion, the tagged protein most likely includes the
      zinc-finger region (the pre-2018 UniProt sequence) and not the current 82-aa KRAB-A
      fragment, which has no nuclear-targeting zinc fingers. This conflicts with HGNC and
      Ensembl, which classify the locus as a pseudogene, and with UniProt's PE5 and
      2018 remodelling. The 3' RACE read could also have matched a paralogous chr19
      zinc-finger gene, and that cannot be checked from the paper. The annotation is
      neither removed nor accepted. UniProt should reconcile the HDA with the current
      sequence.
    supported_by:
    - reference_id: PMID:16791210
      supporting_text: each tagged with yellow fluorescent protein (YFP) at its endogenous
        chromosomal location
    - reference_id: file:human/ZNF788P/ZNF788P-bioinformatics/RESULTS.md
      supporting_text: Since March 2018, version 3 has been an 82-aa product (PE5) with
        **0 C2H2 motifs**.
    propagation_review:
      root_cause: SOURCE_STALE_OR_MISSING
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PMID:16791210
        source_status: SOURCE_STALE_OR_MISSING
        comment: >-
          HDA assigned by UniProt in 2015 against sequence version 2 (615-aa zinc-finger
          protein). It was carried over unchanged when the entry was re-modelled to an
          82-aa KRAB-A fragment in 2018, so the sequence that was observed is no longer the
          sequence that is annotated.
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001909
  - InterPro:IPR036051
  review:
    summary: >-
      InterPro2GO mapping from a truncated KRAB-A box on a pseudogene product. The
      product has no zinc fingers or any other DNA-binding domain, no KRAB-B box, and a
      substitution in the KRAB-A MLE motif.
    action: REMOVE
    reason: >-
      A KRAB domain represses transcription only when it is tethered to DNA, which in
      KRAB-zinc-finger proteins is done by the C2H2 array. The annotated 82-aa product
      lacks any DNA-binding domain. Its KRAB-A box ends at the equivalent of ZNF10
      residue 68, so it lacks the end of the A box and the whole B box, and the central
      leucine of the conserved MLE motif is replaced by glutamine. The locus is
      classified as a pseudogene by HGNC and Ensembl, and protein existence is PE5. The
      InterPro signature correctly recognises a KRAB-A remnant, but that does not show
      participation in transcription regulation.
    supported_by:
    - reference_id: PMID:8183939
      supporting_text: the KRAB domain functions as a DNA binding-dependent transcriptional
        repressor when fused to a heterologous DNA-binding domain from the yeast GAL4
        protein
    - reference_id: file:human/ZNF788P/ZNF788P-bioinformatics/RESULTS.md
      supporting_text: The KRAB exon and the zinc-finger array are therefore in frame with
        each other but separated by a stop codon.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: InterPro:IPR001909
        source_label: KRAB
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The signature matches a truncated KRAB-A remnant. The InterPro2GO mapping
          assumes the full KRAB-zinc-finger architecture, which is absent here.
      - source_id: InterPro:IPR036051
        source_label: KRAB_dom_sf
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Same KRAB-A remnant, superfamily-level signature.
      residue_claims_not_applicable: >-
        The argument rests on absent domains (no C2H2 array, no KRAB-B box), on the
        pseudogene status of the locus, and on a truncated KRAB-A. It does not rest on the
        loss of a single functional residue.
