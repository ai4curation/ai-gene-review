references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: >-
      InterPro2GO maps the broad ribose-phosphate diphosphokinase entry to
      magnesium binding and nucleotide biosynthesis; those catalytic-family
      mappings are too broad for PRPSAP1.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      PAINT correctly assigns enzyme regulator activity at the PRPSAP node but
      older inherited catalytic-process IBAs from PTN000025022 remain in GOA.
- id: PMID:16189514
  title: Towards a proteome-scale map of the human protein-protein interaction network.
  findings:
  - statement: >-
      Proteome-scale two-hybrid study that detected PRPSAP1 interactions,
      including with PRPS1 and PRPSAP1 itself.
- id: PMID:19447967
  title: Shifted Transversal Design smart-pooling for high coverage interactome mapping.
  findings:
  - statement: Two-hybrid benchmark that detected PRPSAP1 self-association.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings:
  - statement: >-
      Proteome-scale binary interactome map that recovered PRPSAP1 interactions
      with catalytic PRPS subunits.
- id: PMID:25910212
  title: Widespread macromolecular interaction perturbations in human genetic disorders.
  findings:
  - statement: >-
      Interaction-perturbation screen that assayed the PRPSAP1/PRPS1 binary
      interaction.
- id: PMID:31515488
  title: Extensive disruption of protein interactions by genetic variants across the
    allele frequency spectrum in human populations.
  findings:
  - statement: >-
      Population-variant interaction screen that used the PRPSAP1/PRPS1
      interaction as one assayed edge.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: >-
      Reference two-hybrid interactome that recovered interactions involving
      PRPSAP1, PRPSAP2, PRPS1, PRPS2 and unrelated high-throughput partners.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human
    interactome.
  findings:
  - statement: >-
      BioPlex 3.0 AP-MS study that co-purified PRPSAP1 with PRPS catalytic and
      associated subunits.
- id: PMID:40205054
  title: Multimodal cell maps as a foundation for structural and functional genomics.
  findings:
  - statement: >-
      U2OS multimodal cell-map study that recovered PRPSAP1 interactions with
      PRPS1 and PRPSAP2.
- id: PMID:8132556
  title: A novel 39-kDa phosphoribosylpyrophosphate synthetase-associated protein
    of rat liver. Cloning, high sequence similarity to the catalytic subunits, and
    a negative regulatory role.
  findings:
  - statement: >-
      Cloned rat PAP39, placed it in PRPP synthetase aggregates with PRS I/II
      catalytic subunits, showed physical interaction with the catalytic
      subunits, and found that removing PAPs increased the remaining catalytic
      activity.
- id: PMID:8611620
  title: Cloning and sequencing of human complementary DNA for the phosphoribosylpyrophosphate
    synthetase-associated protein 39.
  findings:
  - statement: >-
      Cloned the human PAP39/PRPSAP1 cDNA and showed that it encodes a 356 aa
      protein 98% identical to rat PAP39.
- id: file:genes/human/PRPSAP1/PRPSAP1-uniprot.txt
  title: UniProt record for human PRPSAP1
  findings:
  - statement: >-
      Curates PRPSAP1 as binding PRPS1 and PRPS2 and as a likely negative
      regulator of PRPP synthesis.
- id: file:interpro/panther/PTHR10210/PTHR10210-paint.tsv
  title: PAINT IBD nodes for PTHR10210
  findings:
  - statement: >-
      Records the PTN008303105 IBD for enzyme regulator activity in the PRPSAP
      clade and the IRD blocking catalytic PRPP synthase activity.
- id: file:interpro/panther/PTHR10210/PTHR10210-review.yaml
  title: PTHR10210 family review
  findings:
  - statement: >-
      Reviews PRPSAP1/SF28 and PRPSAP2/SF29 as non-catalytic regulatory PRPS
      paralogs and judges the GO:0002189 PAINT loss too broad.
