  review:
    summary: >-
      InterPro2GO annotation from the broad ribose-phosphate diphosphokinase
      signature to the magnesium cofactor used by catalytic PRPS enzymes.
    action: REMOVE
    reason: >-
      IPR005946 covers both catalytic PRPS proteins and the non-catalytic PRPSAP
      associated subunits. PTHR10210 separates PRPSAP1/SF28 and PRPSAP2/SF29
      below PTN008303105 and records a PAINT IRD that removes ancestral
      ribose phosphate diphosphokinase activity from that clade; the InterPro2GO
      magnesium-binding projection is the same catalytic signal leaking onto a
      non-catalytic regulatory paralog.
    supported_by:
    - reference_id: file:interpro/panther/PTHR10210/PTHR10210-review.yaml
      supporting_text: >-
        PRPP synthase activity is conserved except in PRPSAP1 (SF28) and PRPSAP2 (SF29)
