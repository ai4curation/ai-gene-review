id: Q14558
gene_symbol: PRPSAP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PRPSAP1 encodes phosphoribosyl pyrophosphate synthase-associated protein 1
  (PAP39), a PRPS-family regulatory subunit that associates with the cytosolic
  PRPP synthase machinery. It is homologous to catalytic ribose-phosphate
  diphosphokinases but belongs to the divergent PRPSAP clade that lacks PRPP
  synthase catalytic activity. PRPSAP1 binds PRPS1 and PRPS2 and, together with
  the related PRPSAP2/PAP41 protein, is inferred to tune cellular
  5-phosphoribose 1-diphosphate synthesis by inhibiting or otherwise regulating
  the catalytic PRPS subunits within PRPP synthase complexes.
alternative_products:
- name: '1'
  id: Q14558-1
- name: '2'
  id: Q14558-2
  sequence_note: VSP_039062
