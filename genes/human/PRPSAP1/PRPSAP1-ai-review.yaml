    label: enzyme inhibitor activity
  evidence_type: TAS
  original_reference_id: PMID:8132556
  qualifier: enables
  review:
    summary: >-
      Rat PAP39 was cloned from a PRPP synthetase complex and shown to interact
      with the PRS catalytic subunits; removing the associated PAP proteins
      increased the activity of the remaining catalytic subunits. The human
      PRPSAP1 cDNA encodes the 98%-identical PAP39 ortholog.
    action: ACCEPT
    reason: >-
      The original rat PAP39 biochemical work supports a negative regulatory
      role for the PRPS-associated 39-kDa protein, and the human sequence cloned
      in PMID:8611620 is the direct PAP39 ortholog. Accept the TAS row as the
      specific core molecular-function assertion for PRPSAP1.
    additional_reference_ids:
