        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The InterPro2GO model follows catalytic PRPS-family chemistry and is too
          broad for the divergent non-catalytic PRPSAP subfamilies.
- term:
