id: P59768
gene_symbol: GNG2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Guanine nucleotide-binding protein gamma-2 (G-gamma-2) is a small (71 aa) G-gamma subunit
  of heterotrimeric G proteins. After C-terminal CaaX processing it is geranylgeranylated and carboxymethylated,
  which anchors it to the cytoplasmic face of the plasma membrane. It forms an obligate, tightly associated
  dimer with G-beta subunits (principally GNB1, also GNB2 and GNB5), and the Gbetagamma dimer assembles
  with GDP-bound Galpha subunits of the Gi/o, Gs and other families. The Gbetagamma dimer is required
  for receptor coupling and nucleotide exchange of the heterotrimer, and after agonist-induced dissociation
  it signals directly, most clearly by binding and opening G protein-gated inwardly rectifying K+ (GIRK/Kir3)
  channels. Gbeta1gamma2 is the canonical Gbetagamma used in structural studies of receptor-G protein
  complexes, including serotonin, dopamine, opioid, calcitonin and glucagon receptors.
