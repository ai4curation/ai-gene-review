- id: file:human/GNG2/GNG2-uniprot.txt
  title: UniProt entry P59768 (GNG2_HUMAN)
- id: PMID:42870023
  title: Ligand-dependent G protein dynamics underlying opioid efficacy.
  findings:
  - statement: smFRET study of Galpha-i dynamics in muOR-Gi complexes used human Gbeta1gamma2 as the Gbetagamma.
    supporting_text: we used a single virus containing the genes for both the human Gβ1 and Gγ2 subunits
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Background; GNG2 is a reagent, the study concerns Galpha-i conformational dynamics.
core_functions:
- description: Obligate G-gamma subunit of heterotrimeric G proteins. GNG2 binds G-beta (mainly GNB1)
    to form the Gbetagamma dimer, whose prenyl anchor targets the heterotrimer to the cytoplasmic face
    of the plasma membrane; Gbetagamma is required for receptor coupling and GDP/GTP exchange of the Galpha
    subunit, so GNG2 contributes to the G protein activity of the heterotrimer in GPCR signaling.
  molecular_function:
    id: GO:0031681
    label: G-protein beta-subunit binding
  contributes_to_molecular_function:
    id: GO:0003925
    label: G protein activity
  directly_involved_in:
  - id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  locations: *id012
  in_complex:
    id: GO:0005834
    label: heterotrimeric G-protein complex
  supported_by:
  - *id004
  - *id002
  - *id009
  - *id013
- description: After receptor-triggered dissociation from Galpha-i/o, the free Gbeta1gamma2 dimer binds
    GIRK (Kir3) channels and is sufficient to open them, providing membrane-delimited inhibition of cellular
    excitability.
  molecular_function:
    id: GO:0099104
    label: potassium channel activator activity
  directly_involved_in:
  - id: GO:0007186
    label: G protein-coupled receptor signaling pathway
  locations: *id012
  in_complex:
    id: GO:0031680
    label: G-protein beta/gamma-subunit complex
  supported_by:
  - *id010
  - *id005
suggested_questions:
- question: Which Gbeta/Ggamma combinations are actually used in vivo by specific receptors in specific
    tissues? Gbeta1gamma2 dominates structural studies because it is convenient to express, so do the
    many cryo-EM structures say anything about the physiological Ggamma partner of each receptor?
- question: UniProt describes GNG2 as involved in bitter, sweet and umami taste transduction based on
    TAS2R14 and TAS1R2/TAS1R3 complexes reconstituted with Gbeta1gamma2. Is GNG2 expressed in and required
    for taste receptor cell signaling, or is the native gustducin Gbetagamma a different combination?
- question: Does GNG2 confer any effector selectivity (e.g., GIRK vs. PLCbeta vs. adenylyl cyclase vs.
    PI3Kgamma) compared with other Ggamma subunits, or is effector choice determined by the Gbeta subunit
    and prenyl group?
suggested_experiments:
- hypothesis: GNG2 is the principal Ggamma partner for Gi/o-mediated GIRK activation in neurons.
  description: Knock out or acutely degrade GNG2 in cultured neurons and measure GABA-B or opioid receptor-evoked
    GIRK currents, with rescue by GNG2 versus other Ggamma subunits (e.g. GNG3, GNG4) to test for subunit
    selectivity.
  experiment_type: knockout with rescue and electrophysiology
- hypothesis: Native taste receptor cells use Ggamma13 rather than Ggamma2 for gustducin signaling.
  description: Single-cell RNA-seq and immunostaining of type II taste cells for GNG2 and GNG13, followed
    by conditional GNG2 deletion and taste behavioral/nerve recordings.
  experiment_type: expression profiling and conditional knockout
