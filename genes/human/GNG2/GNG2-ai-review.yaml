- term:
    id: GO:0003925
    label: G protein activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN008551661
  - UniProtKB:P63212
  review:
    summary: GNG2 is an obligate subunit of heterotrimeric G proteins; the heterotrimer is the unit that
      cycles between GDP- and GTP-bound states. The PAINT node for the G-gamma family (PTN008551661) carries
      G protein activity.
    action: ACCEPT
    reason: G-gamma has no nucleotide-binding site of its own, but the Gbetagamma dimer is required for
      GDP/GTP exchange, receptor coupling and effector interaction of the heterotrimer (UniProt FUNCTION),
      and GO/PAINT conventionally attribute the heterotrimer-level G protein activity to the beta and
      gamma subunits. GNG2 is inside the G-gamma clade with an intact CaaX prenylation site and G-beta
      interface, so there is no basis to argue with the node placement. In core_functions this is recorded
      as contributes_to G protein activity, with G-beta binding as the subunit-specific activity.
    supported_by:
    - &id004
      reference_id: file:human/GNG2/GNG2-uniprot.txt
      supporting_text: The beta and gamma chains are required for the GTPase activity
    - &id011
      reference_id: PMID:42870023
      supporting_text: we used a single virus containing the genes for both the human Gβ1 and Gγ2 subunits
