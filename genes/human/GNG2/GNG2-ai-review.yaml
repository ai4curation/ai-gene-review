  review:
    summary: Purified Gbeta1gamma2 binds GIRK2 and is sufficient to activate the channel in reconstitution;
      crystal structure of the GIRK2-Gbetagamma complex.
    action: ACCEPT
    reason: Direct structural and functional evidence that the GNG2-containing Gbetagamma dimer binds
      and opens GIRK (Kir3) channels, the classical membrane-delimited effector function of Gbetagamma
      downstream of Gi/o-coupled receptors. The activity is a property of the Gbeta-Ggamma dimer; GNG2
      contributes the prenyl anchor and the gamma subunit of the effector-binding unit.
