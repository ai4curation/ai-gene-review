- term:
    id: GO:0031680
    label: G-protein beta/gamma-subunit complex
  evidence_type: IDA
  original_reference_id: PMID:23739333
  review:
    summary: The free Gbeta1gamma2 dimer, released from Galpha after receptor activation, is the species
      that binds and activates GIRK channels; it was purified and crystallised with GIRK2.
    action: NEW
    reason: 'GNG2 carries the heterotrimeric G-protein complex term but not the Gbetagamma dimer term,
      although its effector activity (GIRK activation, already annotated) is exerted by the dissociated
      dimer. Comparator check: other G-gamma subunits in the same role carry GO:0031680 by experiment
      (S. cerevisiae STE18, S. pombe git5, rat Gng5). This is a cellular-component claim about complex
      membership, not a process claim.'
    supported_by:
    - *id010
    - *id008
    - *id011
