id: Q8WTV0
gene_symbol: SCARB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SCARB1, also called SR-BI or CLA-1, is the HDL-receptor branch of the
  CD36/SR-B family. It is a double-pass plasma-membrane and caveolar receptor that
  binds HDL and apolipoproteins to mediate selective uptake of HDL cholesteryl esters
  and bidirectional exchange of cholesterol. SCARB1 also binds LDL, acetylated LDL,
  oxidized LDL, phosphatidylserine and LPS, and a cell-surface pool can be exploited
  as an entry factor by hepatitis C virus and other pathogens, but these activities
  are secondary to the HDL/cholesterol transport role.'
