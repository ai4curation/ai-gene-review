id: Q14739
gene_symbol: LBR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LBR (lamin B receptor) is a bifunctional, polytopic integral membrane protein of the inner
  nuclear membrane, also present in the ER membrane. Its C-terminal sterol reductase domain (ERG4/ERG24
  family, eight transmembrane segments) is an NADPH-dependent 3-beta-hydroxysterol Delta14-reductase (EC
  1.3.1.70) that reduces the C14 double bond of lanosterol-derived intermediates (e.g. 4,4-dimethylcholesta-8,14,24-trienol)
  in post-squalene cholesterol biosynthesis; it shares this activity with the ER enzyme TM7SF2, but human
  LBR-deficient cells cannot sustain cholesterol synthesis. Its basic nucleoplasmic N-terminal domain
  (Tudor domain plus Ser/Arg-rich region) binds lamin B, DNA, the HP1 chromo shadow domain and the Xist
  RNA, tethering peripheral heterochromatin and the lamina to the nuclear envelope and shaping nuclear
  morphology, notably neutrophil nuclear lobulation. Heterozygous loss of LBR causes Pelger-Huet anomaly,
  biallelic variants that abolish reductase activity cause lethal Greenberg (HEM) skeletal dysplasia,
  and biallelic hypomorphic variants cause regressive spondylometaphyseal dysplasia.
