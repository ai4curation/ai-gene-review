    label: DNA binding
  evidence_type: TAS
  original_reference_id: PMID:8157662
  qualifier: enables
  review:
    summary: The nucleoplasmic N-terminal domain of LBR binds double-stranded DNA in vitro (gel retardation,
      filter binding).
    action: KEEP_AS_NON_CORE
    reason: DNA binding of the N-terminal domain is supported by in vitro assays (TAS here; also linker-DNA
      binding with high affinity in PMID:10828963) and contributes to chromatin tethering at the inner
      nuclear membrane, but it is a non-catalytic accessory property, not the core enzymatic function.
    supported_by:
    - &id004
      reference_id: PMID:8157662
      supporting_text: The LBR amino-terminal domain precipitates lamin B from nuclear extracts and retards
        the migration of double-stranded DNA subjected to agarose gel electrophoresis.
    - reference_id: PMID:10828963
      supporting_text: Data show that the LBR amino-terminal domain (AT) binds linker DNA but does not
        interact with the nucleosome core.
