id: P02724
gene_symbol: GYPA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GYPA encodes glycophorin A, the major sialoglycoprotein of the human erythrocyte membrane.
  It is a single-pass type I membrane protein whose heavily O- and N-glycosylated extracellular N-terminal
  segment is exposed on the red-cell surface and carries the MN blood group antigens. Through its transmembrane
  helix (GXXXG motif) it forms homodimers and binds the band 3 anion exchanger (SLC4A1); a GYPA monomer
  sits at each end of the SLC4A1 dimer. GYPA is an integral component of the erythrocyte ankyrin-1 complex,
  contributing to red-cell membrane stability and shape and supporting SLC4A1 activity. Its surface glycans
  are exploited as entry receptors by pathogens including Plasmodium falciparum (via EBA-175) and Hepatitis
  A virus.
