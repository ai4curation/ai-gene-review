core_functions:
- description: Structural glycoprotein of the erythrocyte membrane that forms homodimers and binds the
    band 3 anion exchanger, acting as a component of the ankyrin-1 complex that stabilizes red-cell membrane
    shape and supports SLC4A1 function.
  molecular_function:
    id: GO:0042802
    label: identical protein binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0170014
    label: ankyrin-1 complex
  supported_by:
  - reference_id: PMID:35835865
    supporting_text: a GPA monomer is bound at each end of the band 3 dimer
  - reference_id: file:human/GYPA/GYPA-uniprot.txt
    supporting_text: Appears to be important for the function of SLC4A1 and is required for high activity
      of SLC4A1.
suggested_questions:
- question: Does glycophorin A act as an obligatory folding/trafficking chaperone for band 3 in developing
    erythrocytes, given that steady-state GPA knockdown does not reduce surface AE1?
- question: How do the MN blood group glycan variants alter susceptibility to P. falciparum EBA-175-mediated
    invasion?
suggested_experiments:
- description: Reconstitute GYPA and SLC4A1 in defined lipid nanodiscs and measure anion-exchange kinetics
    with and without GYPA to quantify its contribution to transporter activity.
  experiment_type: biochemistry
- description: Erythroid differentiation of GYPA-knockout iPSCs with surface proteomics to test the chaperone/escort
    role for band 3 and other ankyrin-1 complex members.
  experiment_type: cell biology
