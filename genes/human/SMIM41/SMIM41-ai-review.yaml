  label: Homo sapiens
description: >-
  SMIM41 (small integral membrane protein 41) is a 93-amino-acid (about 9 kDa) protein
  encoded on chromosome 12q13.13. It has a single predicted helical transmembrane segment
  (residues 38-58), preceded by an alanine/serine/proline-rich N-terminal segment and
  followed by a predicted disordered, acidic C-terminal tail. It is a member of the Reprimo
  family of small single-pass membrane proteins, alongside RPRM (Reprimo) and RPRML, but
  forms its own subfamily; the cell-cycle role proposed for Reprimo has not been tested
  for SMIM41 and cannot be inferred from family membership. Orthologues are annotated in
  many placental mammals, including mouse and rat. The protein has been detected by mass
  spectrometry, and its RNA is enhanced in lung and prostate. Its membrane localisation is
  predicted from sequence; the specific membrane, topology, partners and biological role
  are unknown, and no functional study of SMIM41 has been published.
