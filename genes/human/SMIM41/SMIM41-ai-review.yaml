  review:
    summary: >-
      UniProt subcellular-location mapping to membrane, based on the single predicted
      helical transmembrane segment (residues 38-58).
    action: ACCEPT
    reason: >-
      Correct, though general. A 21-residue hydrophobic helix in a 93-residue protein makes
      SMIM41 a single-pass integral membrane protein, like the other Reprimo family members.
      No experiment identifies the specific membrane, so a more precise location cannot be
      given. This is the only annotation the gene carries and the only one the evidence
      supports.
