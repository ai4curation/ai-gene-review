suggested_questions:
- question: >-
    Does SMIM41 share any activity with Reprimo (RPRM), for example a role downstream of p53
    or in cell-cycle arrest, or did it diverge after the subfamily split?
- question: >-
    Which lung and prostate cell types express SMIM41 protein, and in which membrane?
suggested_experiments:
- hypothesis: SMIM41 is a single-pass membrane protein of a defined compartment in lung or prostate epithelium.
  description: >-
    Localise endogenously tagged SMIM41 in a lung epithelial cell line with organelle markers,
    test N-glycosylation of the Asn2 sequon to establish topology, and test whether its
    expression responds to p53 activation as Reprimo's does.
