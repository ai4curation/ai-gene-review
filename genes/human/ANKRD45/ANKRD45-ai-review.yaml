knowledge_gaps:
- gap_statement: ANKRD45's molecular activity and its precise role in cell division are unknown; it moves
    to the cleavage furrow and midbody ring, and its loss causes apoptosis, but no partner or mechanism
    is known.
  boundary: Locations through mitosis and the apoptosis phenotype are established in one study. The deposited
    interactors are a handful of high-throughput hits with no follow-up. No cytokinesis defect (for example
    binucleation) was reported.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: A midbody-ring protein whose loss kills cells could be a component of the abscission machinery,
    but nothing yet tests this.
  resolution: Identify ANKRD45 partners at the midbody ring and test whether its loss delays or blocks
    abscission.
  provenance:
  - reference_id: PMID:31208154
    supporting_text: ANKRD45 is preferably localized to the midbody ring during cytokinesis.
  - reference_id: PMID:31208154
    supporting_text: knockdown of ANKRD45 expression with either siRNA or CRISPR/Cas9 methods induced
      apoptosis in cultured cells
  - reference_id: file:human/ANKRD45/ANKRD45-uniprot.txt
    supporting_text: 'CC   -!- FUNCTION: May play a role during cell division.'
  - reference_id: file:human/ANKRD45/ANKRD45-uniprot.txt
    supporting_text: DR   Pharos; Q5TZF3; Tbio.
proposed_new_terms: []
suggested_questions:
- question: Does ANKRD45 loss cause cytokinesis failure (binucleation, delayed abscission) before cells
    die, and what does ANKRD45 bind at the midbody ring?
suggested_experiments:
- description: Live-image ANKRD45-depleted cells through cytokinesis to measure abscission timing and
    binucleation, and map ANKRD45 partners at the midbody ring by proximity labelling.
