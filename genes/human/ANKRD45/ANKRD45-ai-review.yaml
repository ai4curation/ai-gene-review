  label: Homo sapiens
description: 'ANKRD45 (ankyrin repeat domain-containing 45) is a small protein with two ankyrin repeats
  whose location changes through mitosis: it is undetectable in interphase, diffuse in the cytoplasm at
  metaphase, concentrated at the cleavage furrow in anaphase and telophase, and enriched at the midbody
  ring during cytokinesis. Loss of ANKRD45 causes apoptosis in cultured cells, and zebrafish ankrd45 mutants,
  normal otherwise, develop apoptotic liver cysts under oncogenic Kras. Its molecular activity is unknown.'
