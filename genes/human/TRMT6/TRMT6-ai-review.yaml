proposed_new_terms:
- proposed_name: tRNA substrate adaptor activity
  proposed_definition: An enzyme-substrate adaptor activity in which a protein binds a tRNA, remodels
    its tertiary structure, and presents a specific nucleotide of that tRNA to the active site of an
    associated tRNA-modifying enzyme, thereby conferring substrate selection and site specificity on
    the modification reaction.
  justification: GO can already say that TRMT6 is part of the tRNA (m1A) methyltransferase complex
    (GO:0031515) and, via contributes_to, that it enables the complex-level activity GO:0160107. What
    no existing term captures is what TRMT6 itself does, which is the mechanism resolved by the 2015
    crystal structure - bind the tRNA, splay the T- and D-loops apart, and deliver a nucleotide that
    is buried in the folded substrate into a partner subunit's active site in trans. GO:0140767
    enzyme-substrate adaptor activity is the closest existing term and is used for this gene's core
    function here, but it was framed for protein-substrate adaptors (for example in ubiquitin ligase
    complexes) and does not convey the substrate remodelling that makes this case distinctive. A
    tRNA-specific child would also serve the several other non-catalytic partners of tRNA-modifying
    enzymes that face the same annotation problem and currently attract only bare RNA binding or
    protein binding terms. Proposed only after checking that neither a suitable existing term nor a
    plausible alternative parent (GO:0008047 enzyme activator activity, rejected because TRMT6 is an
    obligate structural half of the enzyme rather than a regulator of an otherwise functional one)
    fits.
  proposed_parent:
    id: GO:0140767
    label: enzyme-substrate adaptor activity
  supported_by:
  - reference_id: PMID:26470919
    supporting_text: tRNAs bind across the dimer interface such that Trm6 from the opposing heterodimer
      brings A58 into the active site of Trm61.
  - reference_id: PMID:26470919
    supporting_text: T-loop and D-loop are splayed apart showing how A58, normally buried in tRNA,
      becomes accessible for modification.
knowledge_gaps:
- gap_statement: TRMT6's molecular function is understood structurally but is not represented in its
    annotations. Its entire GOA molecular-function coverage is six rows of GO:0005515 protein binding
    plus one high-throughput GO:0003723 RNA binding, none of which states that it binds tRNA, remodels
    it, or presents A58 to the catalytic subunit.
  boundary: The mechanism itself is not in doubt. Three crystal structures of the human complex bound
    to tRNA3(Lys) resolve the heterotetramer, the trans delivery of A58 across the dimer interface,
    and the splaying of the T- and D-loops that exposes the target base. The gap is between what is
    known and what is annotatable and annotated.
  gap_kind:
  - CURATION
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: TRMT6 is a textbook example of the protein binding failure mode - a protein whose
    function has been solved at atomic resolution for a decade yet which looks functionally
    uncharacterised in GO, because the only available molecular-function terms are uninformative ones.
    Any downstream analysis that scores molecular-function annotation depth would misclassify it as
    poorly characterised.
  resolution: Curation of GO:0000049 tRNA binding with IDA support from PMID:26470919 in place of the
    generic GO:0003723 row, together with a contributes_to GO:0160107 annotation, would close most of
    the gap immediately. Fully expressing the substrate-presentation mechanism additionally requires
    the new term proposed above.
  provenance:
  - reference_id: PMID:26470919
    supporting_text: a homologous but noncatalytic chain, Trm6, repurposed as a tRNA-binding subunit
      that acts in trans
  - reference_id: PMID:22658674
    supporting_text: We identify 860 proteins that qualify as RBPs by biochemical and statistical
      criteria
  proposed_terms:
  - proposed_name: tRNA substrate adaptor activity
    proposed_definition: An enzyme-substrate adaptor activity in which a protein binds a tRNA, remodels
      its tertiary structure, and presents a specific nucleotide of that tRNA to the active site of an
      associated tRNA-modifying enzyme, thereby conferring substrate selection and site specificity on
      the modification reaction.
    justification: See the gene-level proposed_new_terms entry. Needed to express what TRMT6 does as
      opposed to what the complex it belongs to does.
    proposed_parent:
      id: GO:0140767
      label: enzyme-substrate adaptor activity
suggested_questions:
- question: Does TRMT6 have any function outside the TRMT6-TRMT61A complex? Every annotation it
    carries is either the complex, the complex's location, or a binding term, and no free TRMT6 pool
    or TRMT61A-independent activity has been reported. A negative answer is as useful as a positive
    one and would justify treating the complex as the sole unit of function.
  experts:
  - Robert M Stroud
  - Janet Finer-Moore
  - James T Anderson
- question: Are the two nuclear-encoded mRNA m1A sites that survive SCARPET validation, PRUNE1 A58 and
    MALAT1 A7945, actually deposited by the TRMT6-TRMT61A complex? PMID:42337368 confirms them
    biochemically but never mentions either subunit, so the attribution currently rests on inference
    from the 2017 mapping studies rather than on a stated result.
  experts:
  - Samie R Jaffrey
  - Schraga Schwartz
  - Chengqi Yi
- question: Is TRMT6, rather than TRMT61A, the subunit that determines whether an mRNA is accepted as
    a substrate? Since TRMT6 performs the substrate binding and loop splaying, the reported preference
    for T-loop-like mRNA elements should be a property of TRMT6, and separating the two subunits'
    contributions would be the cleanest test of whether mRNA methylation is structural spillover.
  experts:
  - Robert M Stroud
  - Schraga Schwartz
- question: Do the four annotated TRMT6 isoforms (Q9UJA5-1 to Q9UJA5-4) differ in their ability to
    assemble with TRMT61A or to bind tRNA? The structural and biochemical work was done on the
    canonical form only, and none of the existing annotations is isoform-resolved.
  experts: []
suggested_experiments:
- hypothesis: TRMT6 binds tRNA directly and independently of TRMT61A, and its tRNA binding, not
    TRMT61A's, sets the substrate specificity of the complex.
  description: Measure the affinity of recombinant TRMT6 alone, TRMT61A alone, and the reconstituted
    heterotetramer for an authentic tRNA substrate and for an A58U mutant, by filter binding or
    biolayer interferometry. Comparing the three would show whether substrate recognition resides in
    TRMT6 and would supply IDA evidence for a GO:0000049 tRNA binding annotation to replace the
    current high-throughput RNA binding row.
  experiment_type: Quantitative RNA-binding assay on separated subunits
- hypothesis: The loop-splaying contacts made by TRMT6 are required for catalysis by the partner
    subunit, so TRMT6 is a functional adaptor rather than a passive scaffold.
  description: Mutate the TRMT6 residues that contact the T- and D-loops in the tRNA-bound structure,
    then test the reconstituted complex for assembly (by size-exclusion chromatography), for tRNA
    binding, and for methyltransferase activity. A variant that assembles and binds tRNA but does not
    support methylation would separate the adaptor function from the structural one.
  experiment_type: Structure-guided mutagenesis with separation-of-function readout
- hypothesis: TRMT6 determines whether an mRNA T-loop-like element is accepted as a substrate.
  description: Reconstitute chimeric complexes pairing human TRMT61A with TRMT6 orthologues from
    species whose transcriptomes lack the reported mRNA m1A sites, and assay each chimera on an
    authentic tRNA and on a T-loop-like mRNA fragment. A shift in the tRNA-to-mRNA activity ratio that
    tracks the TRMT6 chain would localise substrate choice to TRMT6.
  experiment_type: Chimeric complex reconstitution and comparative substrate assay
