    label: enzyme-substrate adaptor activity
  contributes_to_molecular_function:
    id: GO:0160107
    label: tRNA (adenine(58)-N1)-methyltransferase activity
  description: TRMT6 is the non-catalytic, substrate-binding subunit of the tRNA m1A58
    methyltransferase. It binds the substrate tRNA and, acting in trans across the interface of the
    TRMT6/TRMT61A dimer of heterodimers, splays the T- and D-loops apart and delivers adenosine 58,
    normally buried in the folded T-loop, into the active site of the TRMT61A chain of the opposing
    heterodimer. It therefore supplies substrate recruitment, conformational remodelling and site
    specificity for a reaction it does not itself catalyse, which is why its own molecular function is
    best expressed as an enzyme-substrate adaptor activity that contributes to the complex-level tRNA
    (adenine(58)-N1)-methyltransferase activity. TRMT6 is a catalytically dead paralogue of TRMT61A,
    and the two subunits are mutually obligate; neither has activity alone.
  directly_involved_in:
