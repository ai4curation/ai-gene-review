  qualifier: enables
  review:
    summary: Proposed new annotation, not currently in GOA. TRMT6 recruits the substrate tRNA to the
      catalytic subunit and delivers the target base into its active site, which is what the GO
      definition of this term describes - an adaptor that brings together an enzyme and its substrate,
      contributing to substrate selection and specificity.
    action: NEW
    reason: TRMT6 currently has no molecular-function annotation that says what it does. This term is
      the closest existing fit for the mechanism resolved by the crystal structure, and is used as the
      molecular function of the core function for this gene. It is proposed with IDA evidence from the
      structural work rather than asserted as existing curation. A more precise tRNA-specific child of
      this term is suggested in proposed_new_terms. GO:0008047 enzyme activator activity was
      considered and rejected, because TRMT6 is an obligate structural half of the enzyme rather than
      a regulator of an otherwise functional one.
