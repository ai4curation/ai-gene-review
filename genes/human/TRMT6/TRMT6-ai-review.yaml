gene_symbol: TRMT6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Non-catalytic, substrate-binding subunit of the nuclear tRNA m1A58 methyltransferase.
  TRMT6 is a catalytically dead paralogue of the methyltransferase TRMT61A that has been repurposed
  as the substrate-binding half of the enzyme. Two copies of TRMT6 and two of TRMT61A assemble into a
  heterotetramer, a dimer of heterodimers, in which each tRNA binds across the dimer interface so that
  TRMT6 from the opposing heterodimer delivers the target base into the TRMT61A active site. In doing
  so TRMT6 splays the T- and D-loops of the tRNA apart, making adenosine 58, normally buried within
  the folded T-loop, accessible for methylation. TRMT6 therefore supplies substrate recognition,
  tRNA remodelling and site specificity for the complex, but has no catalytic activity of its own,
  and neither subunit is active without the other. The resulting m1A58 modification stabilises
  initiator methionyl-tRNA and, in tRNA3(Lys), removes Watson-Crick pairing at the base that
  terminates the HIV-1 primer-binding sequence. The complex has also been reported to deposit m1A on
  a small number of cytosolic mRNAs that fold into tRNA T-loop-like elements, at low stoichiometry;
  this mRNA substrate class is disputed, since biochemical validation of transcriptome-wide maps
  indicates that most mapped internal mRNA m1A sites are instead inosine produced by A-to-I editing.'
