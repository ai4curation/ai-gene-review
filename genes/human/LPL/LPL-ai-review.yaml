core_functions:
- description: >-
    Hydrolyzes triacylglycerol carried in chylomicrons and VLDL at the luminal
    capillary endothelial surface, releasing fatty acids and diacylglycerol and
    thereby driving triglyceride catabolism, particle remodeling, and remnant
    clearance. GPIHBP1 captures and transports secreted LPL across endothelial cells,
    presents and stabilizes it at the luminal plasma membrane, and enables
    triglyceride-rich lipoprotein margination; this functional presentation is
    dynamic and does not imply an invariant stable complex or oligomeric state.
  molecular_function:
    id: GO:0004465
    label: lipoprotein lipase activity
  directly_involved_in:
  - id: GO:0019433
    label: triglyceride catabolic process
  - id: GO:0034371
    label: chylomicron remodeling
  - id: GO:0034372
    label: very-low-density lipoprotein particle remodeling
  - id: GO:0034447
    label: very-low-density lipoprotein particle clearance
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0005886
    label: plasma membrane
knowledge_gaps:
- gap_statement: >-
    The distribution of active monomeric and dimeric LPL in native human capillaries,
    and whether oligomeric state changes with GPIHBP1, APOC2, particle binding, or
    ANGPTL exposure, remain unresolved.
- gap_statement: >-
    The quantitative contributions of catalytic TAG hydrolysis versus noncatalytic
    GPIHBP1-dependent particle margination and receptor/proteoglycan bridging to
    tissue-specific lipid uptake have not been separated in humans.
- gap_statement: >-
    How LPL moves from parenchymal-cell secretion sites through interstitial HSPGs to
    endothelial GPIHBP1 in different human tissues is incompletely defined, including
    the kinetics and regulation of each transfer step.
- gap_statement: >-
    The relative effects of ANGPTL3, ANGPTL4, and ANGPTL3-ANGPTL8 complexes on
    GPIHBP1-bound human LPL across adipose, muscle, cardiac, and fasting/fed contexts
    remain uncertain; several decisive physiological studies are mouse-based.
- gap_statement: >-
    The physiological contribution of LPL phospholipase A1 activity relative to its
    dominant triacylglycerol lipase activity is unknown, including which particle
    phospholipids are hydrolyzed in vivo.
- gap_statement: >-
    Many reported LPL interaction partners come from high-throughput screens. Which
    interactions form reproducible, stoichiometric, and functionally consequential
    assemblies at endogenous abundance remains unresolved.
- gap_statement: >-
    Variant studies distinguish defects in folding, secretion, GPIHBP1 or HSPG
    binding, particle recognition, and catalysis, but a systematic human genotype-to-
    biochemical-mechanism map is incomplete.
proposed_new_terms: []
suggested_questions:
- question: >-
    What fraction of active LPL is monomeric versus dimeric on the luminal surface of
    human capillaries, and how does GPIHBP1 or lipoprotein binding alter that balance?
- question: >-
    How much triglyceride-rich lipoprotein margination and tissue lipid uptake depends
    on LPL particle bridging independently of catalytic hydrolysis?
- question: >-
    Which molecular signals govern transfer of newly secreted LPL from interstitial
    HSPGs to endothelial GPIHBP1 in adipose tissue, skeletal muscle, and heart?
- question: >-
    How do APOC2 and the different ANGPTL complexes compete on native human
    GPIHBP1-LPL-lipoprotein assemblies across fasting and feeding states?
- question: >-
    Does the secondary phospholipase A1 activity of LPL materially influence
    chylomicron, VLDL, or HDL remodeling in vivo?
- question: >-
    Which reported LPL partners are stable physiological regulators or trafficking
    factors rather than high-throughput interaction-screen hits?
suggested_experiments:
- description: >-
    Use endogenously tagged LPL and GPIHBP1 in perfused human microvascular organoids
    with single-particle imaging and cross-linking mass spectrometry to quantify LPL
    oligomeric state, endothelial transport, luminal residence, and lipoprotein
    margination.
  hypothesis: >-
    Native capillary LPL occupies dynamic GPIHBP1-stabilized monomeric and dimeric
    states whose proportions change upon triglyceride-rich particle engagement.
- description: >-
    Compare wild-type LPL with catalytically dead but secretion- and binding-competent
    LPL in human endothelial-parenchymal co-cultures, measuring particle margination,
    hydrolysis, remnant release, and fatty-acid uptake independently.
  hypothesis: >-
    GPIHBP1-bound LPL can support particle margination without catalysis, whereas
    efficient remnant formation and fatty-acid delivery require hydrolytic activity.
- description: >-
    Pulse-label LPL secreted by human myocytes or adipocytes and track its transfer
    through defined HSPG perturbations to endothelial GPIHBP1 under tissue-specific
    flow conditions.
  hypothesis: >-
    Interstitial HSPGs act as a mobile reservoir rather than a terminal anchor, with
    tissue-dependent sulfation patterns controlling transfer efficiency to GPIHBP1.
- description: >-
    Reconstitute human GPIHBP1-LPL-APOC2 lipoprotein particles and measure time-resolved
    inhibition, unfolding, and recovery after addition of ANGPTL3, ANGPTL4, or
    ANGPTL3-ANGPTL8 under matched lipid and temperature conditions.
  hypothesis: >-
    GPIHBP1 protection and ANGPTL inhibition depend on inhibitor identity, particle
    composition, and exposure kinetics rather than following a single absolute rule.
- description: >-
    Use reaction-selective lipidomics and catalytic-site mutants to separate LPL TAG
    lipase and phospholipase A1 flux in human plasma-particle remodeling assays.
  hypothesis: >-
    LPL phospholipase A1 activity contributes detectably to particle surface remodeling
    but accounts for substantially less physiological flux than TAG hydrolysis.
