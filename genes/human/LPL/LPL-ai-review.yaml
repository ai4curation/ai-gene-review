- id: PMID:20620994
  title: GPIHBP1 is responsible for the entry of lipoprotein lipase into capillaries.
  findings:
  - statement: LPL is secreted by myocytes and adipocytes and acts within the capillary lumen.
    supporting_text: LPL is synthesized and secreted by myocytes and adipocytes, but then finds its way into the lumen of capillaries, where it hydrolyzes lipoprotein triglycerides.
    reference_section_type: ABSTRACT
  - statement: GPIHBP1 transports LPL across capillary endothelial cells.
    supporting_text: Also, we show that GPIHBP1 is located at the basolateral surface of capillary endothelial cells and actively transports LPL across endothelial cells.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Decisive transport mechanism supported by mouse genetics and endothelial-cell experiments; it should not be recast as endothelial synthesis of LPL.
- id: PMID:24726386
  title: The GPIHBP1-LPL complex is responsible for the margination of triglyceride-rich lipoproteins in capillaries.
  findings:
  - statement: GPIHBP1-bound LPL is required for triglyceride-rich lipoprotein margination at capillaries.
    supporting_text: Both cell-culture and in vivo studies showed that TRL margination depends on LPL bound to GPIHBP1.
    reference_section_type: ABSTRACT
  - statement: HSPG-bound LPL was insufficient to restore TRL margination without GPIHBP1.
    supporting_text: Notably, the expression of LPL by endothelial cells in Gpihbp1⁻/⁻ mice did not restore defective TRL margination, implying that the binding of LPL to HSPGs is ineffective in promoting TRL margination.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Directly supports a GPIHBP1-dependent noncatalytic particle-margination role, primarily from mouse and cell-culture systems.
- id: PMID:27811232
  title: Mobility of "HSPG-bound" LPL explains how LPL is able to reach GPIHBP1 on capillaries.
  findings:
  - statement: Interstitial HSPG-bound LPL remains mobile and can transfer to endothelial GPIHBP1.
    supporting_text: We conclude that HSPG-bound LPL in the interstitial spaces of tissues is mobile, allowing the LPL to move to GPIHBP1 on endothelial cells.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mechanistic cell and mouse evidence that prevents overinterpreting HSPG binding as permanent immobilization.
- id: PMID:27929370
  title: The angiopoietin-like protein ANGPTL4 catalyzes unfolding of the hydrolase domain in lipoprotein lipase and the endothelial membrane protein GPIHBP1 counteracts this unfolding.
  findings:
  - statement: ANGPTL4 inactivates LPL by catalyzing unfolding of its hydrolase domain.
    supporting_text: >-
      We now show: (1) that ANGPTL4 inactivates LPL by catalyzing the unfolding of
      its hydrolase domain; (2) that binding to GPIHBP1 renders LPL largely refractory
      to this inhibition; and (3) that both the LU domain and the intrinsically disordered
      acidic domain of GPIHBP1 are required for this protective effect.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct biophysical mechanism for ANGPTL4-dependent LPL inactivation and GPIHBP1 protection.
- id: PMID:20581395
  title: Angiopoietin-like protein 3 inhibits lipoprotein lipase activity through enhancing its cleavage by proprotein convertases.
  findings:
  - statement: In cell-based assays, ANGPTL3 enhanced proprotein-convertase cleavage of LPL and thereby inhibited catalytic and noncatalytic functions.
    supporting_text: By enhancing LPL cleavage, ANGPTL3 dissociates LPL from the cell surface, inhibiting both the catalytic and noncatalytic functions of LPL.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mechanistic cell-based evidence for one ANGPTL3 route of LPL inhibition; physiological dominance should not be assumed from this assay alone.
- id: PMID:20042600
  title: Site-directed mutagenesis of apolipoprotein CII to probe the role of its secondary structure for activation of lipoprotein lipase.
  findings:
  - statement: APOC2 C-terminal helical structure is important for LPL activation, while the previously proposed 39-62 fragment was inactive in this study.
    supporting_text: Finally, fragment 39-62, previously claimed to activate LPL, was found to be completely inactive.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct functional mutagenesis that qualifies the earlier minimal-peptide model while retaining APOC2 as an LPL activator.
- id: PMID:24909692
  title: Purification, cellular levels, and functional domains of lipase maturation factor 1.
  findings:
  - statement: ER-resident LMF1 is required for LPL secretion and enzymatic activity.
    supporting_text: LPL requires an endoplasmic reticulum (ER)-resident, transmembrane protein known as lipase maturation factor 1 (LMF1) for secretion and enzymatic activity.
    reference_section_type: ABSTRACT
  - statement: All tested LMF1 domains were necessary for LPL maturation.
    supporting_text: N-terminal truncations of LMF1 show that all the domains are necessary for LPL maturation.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct biogenesis evidence; LMF1 is an ER maturation factor rather than a component of the extracellular catalytic complex.
- id: PMID:28413163
  title: ANGPTL8 requires ANGPTL3 to inhibit lipoprotein lipase and plasma triglyceride clearance.
  findings:
  - statement: ANGPTL8 required ANGPTL3 to inhibit LPL and raise plasma triglycerides in the mouse experiments.
    supporting_text: Collectively, these data show that ANGPTL8 has a functional LPL inhibitory motif, but only inhibits LPL and increases plasma TG levels in mice in the presence of ANGPTL3.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Supports ANGPTL3/8 regulation but is explicitly bounded to mouse physiology and heterologous expression assays.
