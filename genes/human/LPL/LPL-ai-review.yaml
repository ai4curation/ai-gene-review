id: P06858
gene_symbol: LPL
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LPL is the principal extracellular lipase that hydrolyzes triacylglycerol in
  circulating chylomicrons and very-low-density lipoproteins, releasing fatty acids
  for tissue uptake and converting the particles into remodeled remnants. It is
  synthesized and secreted chiefly by parenchymal cells such as myocytes and
  adipocytes, captured from the interstitial space by the endothelial protein
  GPIHBP1, transported across capillary endothelial cells, and presented on the
  luminal surface. GPIHBP1-bound LPL also promotes margination of triglyceride-rich
  lipoproteins at capillaries and stabilizes the enzyme against unfolding. APOC2 on
  lipoprotein particles activates LPL, whereas ANGPTL-family proteins inhibit LPL in
  tissue- and nutritional-state-dependent contexts. Heparan sulfate proteoglycan
  binding contributes to interstitial retention, mobility, stability, and transfer
  of LPL to GPIHBP1.

  LPL uses a serine-aspartate-histidine catalytic triad and has a secondary, lower
  glycerophospholipid phospholipase A1 activity. The translated precursor contains a
  cleavable N-terminal signal peptide; residues 28-475 form the mature secreted
  enzyme, with no separate regulatory propeptide. ER-resident LMF1 is required for
  productive LPL maturation and secretion but is not part of the extracellular
  catalytic assembly. LPL can form homodimers in biochemical preparations, while
  structural and biochemical evidence also supports active GPIHBP1-stabilized
  monomeric LPL, so dimerization is not an invariant requirement. Biallelic loss of
  LPL catalytic function causes familial chylomicronemia with severe
  hypertriglyceridemia; inflammatory, adipogenic, and storage phenotypes are
  downstream, context-dependent consequences of altered lipid delivery rather than
  additional core molecular activities.
