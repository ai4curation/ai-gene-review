id: P0DP25
gene_symbol: CALM3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Calmodulin-3 is a small EF-hand calcium sensor that binds target proteins and couples changes
  in intracellular calcium to enzyme and ion-channel regulation. Human CALM1, CALM2 and CALM3 share the
  canonical calmodulin protein sequence, while their transcriptional regulation and disease variants are
  gene-specific. Calcium-dependent conformational changes enable calmodulin to activate CaMKII-family
  kinases and calcineurin and to modulate nitric-oxide synthases. Channel-associated calmodulin regulates
  calcium-dependent inactivation of voltage-gated calcium channels and sarcoplasmic-reticulum calcium
  release through RyR2, linking calcium sensing to cardiac electrical activity and contraction. CALM3
  variants can disrupt these regulatory interactions and cause severe arrhythmia. Cytoplasmic, membrane-associated,
  nuclear and mitotic pools reflect recruitment to different target complexes.
