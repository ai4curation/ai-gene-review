core_functions:
- description: Calmodulin binds calcium through its EF-hand sites and couples changing calcium occupancy
    to conformational changes and target regulation. This calcium-sensor activity is shared by the identical
    human calmodulin proteins. Direct CALM3 variant affinity measurements and human calmodulin conformational
    studies support the sensing mechanism; gene-specific expression is a separate question.
  molecular_function:
    id: GO:0005509
    label: calcium ion binding
  directly_involved_in:
  - id: GO:0005513
    label: detection of calcium ion
  supported_by:
  - reference_id: PMID:8631777
  - reference_id: PMID:27516456
  - reference_id: PMID:31454269
- description: Calcium-bound calmodulin activates protein serine/threonine kinases, exemplified by human
    CaMKII, through regulatory-segment binding and relief of autoinhibition. Calcium binding is the sensing
    mechanism; the kinase performs phosphate transfer. Shared-protein experiments do not imply that every
    calmodulin-binding kinase is activated.
  molecular_function:
    id: GO:0043539
    label: protein serine/threonine kinase activator activity
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:20668654
    supporting_text: mechanism of CaMKII activation by calmodulin
- description: Calcium-responsive calmodulin activates calcineurin through direct regulatory association,
    enabling calcineurin-dependent signaling. Calmodulin supplies its own phosphatase-activator activity,
    while calcineurin hydrolyzes substrate phosphate groups.
  molecular_function:
    id: GO:0072542
    label: protein phosphatase activator activity
  directly_involved_in:
