    reason: PMID:21299499 uses recombinant human calmodulin and synthetic IQGAP3 IQ peptides to map the
      interaction to a defined protein region. All four IQ motifs interact in calcium, with motifs 2–4
      producing the longer-lived complexes; motif 1 is more transient. GO:0019904 captures this mapped
      domain recognition more precisely than bare protein binding. The original partner is preserved.
      The refinement consolidates evidence for an already present term and does not establish intact-complex
      affinity, a universal calcium requirement, GTPase activity or a new cellular process.
    supported_by:
    - reference_id: PMID:21299499
    proposed_replacement_terms:
