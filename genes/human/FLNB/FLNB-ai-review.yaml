suggested_questions:
- question: Which original target records establish FLNB RNA binding, cadherin binding, DVL1/DVL2 association
    and phagosomal localization?
- question: Does the curated Q9Y6R4 interaction correspond to a separate MAP3K4 experiment, beyond the
    inspected MKK4 assay, and is any noncovalent ISG15 recognition assay available?
- question: How do historical filamin-B splice-construct sequences map to the nine current natural products,
    particularly the one-residue var-1 boundary difference?
suggested_experiments:
- description: Compare sequence-verified FLNB products for actin association, integrin-tail recovery and
    localization at matched expression in relevant human cell contexts.
  experiment_type: product-resolved structural-function comparison
  hypothesis: Alternative sequence changes influence scaffold contacts and compartment enrichment without
    establishing a uniform phenotype across all products.
- description: Separate covalent ISG15 conjugation from noncovalent FLNB-ISG15 recognition using orthogonal
    binding measurements and conjugation-deficient controls.
  experiment_type: interaction-mechanism discrimination
  hypothesis: The documented covalent conjugate need not imply a separately measurable noncovalent binding
    activity.
