  label: Homo sapiens
description: The characterized full-length form of filamin B is a dimeric actin-binding scaffold that
  organizes actin networks and connects them to membrane-associated and signaling proteins. Its N-terminal
  actin-binding domain and repeated immunoglobulin-like domains support cytoskeletal architecture and
  regulated partner interactions. Different cellular and splice-variant contexts influence its localization
  at stress fibers, adhesion sites and the cell periphery. Changes in filamin B activity can disrupt skeletal
  development.
