proposed_new_terms:
- proposed_name: lactose synthase complex
  proposed_definition: A heterodimeric catalytic complex composed of beta-1,4-galactosyltransferase 1
    and alpha-lactalbumin. Alpha-lactalbumin promotes glucose binding to the catalytic subunit, enabling
    transfer of galactose from UDP-galactose to glucose to form lactose. In lactating mammary epithelial
    cells this complex acts at the Golgi membrane.
  justification: Mirrors the identical proposal in the human B4GALT1 review so that both subunits can
    be annotated part_of the same complex. Lactose synthase is a 1:1 complex of the catalytic galactosyltransferase
    B4GALT1 and the regulatory subunit alpha-lactalbumin, with a defined reaction (RHEA:12404); alpha-lactalbumin
    has no catalytic activity alone and B4GALT1 makes lactose efficiently only with alpha-lactalbumin
    present. GO has no lactose synthase complex term (OLS search 2026-10-24), so this review uses transferase
    complex (GO:1990234), a descendant of the proposed parent catalytic complex (GO:1902494), as the interim
    in_complex term.
  proposed_parent:
    id: GO:1902494
    label: catalytic complex
  proposed_mappings:
  - predicate: skos:relatedMatch
    target_term:
      id: RHEA:12404
      label: D-glucose + UDP-alpha-D-galactose = lactose + UDP + H(+)
  supported_by:
  - reference_id: PMID:11419947
    supporting_text: The lactose synthase (LS) enzyme is a 1:1 complex of a catalytic component, beta1,4-galactosyltransferse
      (beta4Gal-T1) and a regulatory component, alpha-lactalbumin (LA), a mammary gland-specific protein.
  - reference_id: PMID:11485999
    supporting_text: In the presence of alpha-lactalbumin (LA), it transfers Gal to Glc, which is its
      lactose synthase (LS) activity.
suggested_questions:
- question: Should GO add the lactose synthase complex term proposed in proposed_new_terms (the same proposal
    as in the human B4GALT1 review; Complex Portal already models the B4GALT1-LALBA heterodimer), so that
    alpha-lactalbumin and B4GALT1 can both be annotated part_of it instead of the generic transferase
    complex and catalytic complex terms used now?
- question: Should the PAINT node carrying lysozyme activity and antibacterial defence in PTHR11407 be
    pruned for the alpha-lactalbumin subfamily (SF32), given the documented loss of muramidase activity
    after duplication from lysozyme C?
- question: Does any physiologically relevant HAMLET-like (partially unfolded, fatty acid-bound) alpha-lactalbumin
    form in the infant gut, or is the tumoricidal and antibacterial activity confined to complexes prepared
    in vitro?
- question: Do the weak secondary Zn2+, Mn2+ and Ca2+ sites of alpha-lactalbumin contribute to lactose
    synthase assembly in the Golgi, where Mn2+ is also the B4GALT1 cofactor?
suggested_experiments:
- description: Mutate the alpha-lactalbumin residues predicted to hydrogen-bond the glucose O-1 hydroxyl
    and the B4GALT1 interface (aromatic cluster I region around Leu110) in recombinant protein and measure
    kcat/Km of lactose synthesis with glucose versus GlcNAc acceptors, to map the minimal specifier surface.
- description: Re-test purified recombinant alpha-lactalbumin (expressed in a lysozyme-free host) for
    muramidase activity against Micrococcus luteus with sensitive assays, to establish whether the reported
    trace lytic activity is intrinsic or due to lysozyme contamination.
- description: Use mammary epithelial organoids with inducible LALBA knockdown or rescue to quantify the
    contribution of alpha-lactalbumin dosage to Golgi lactose flux and vesicle swelling.
