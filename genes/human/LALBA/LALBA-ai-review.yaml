    reason: Alpha-lactalbumin is a stoichiometric subunit of lactose synthase, a 1:1 heterodimer with
      the catalytic galactosyltransferase B4GALT1 that only acquires lactose synthase activity when both
      subunits are present (the GO criterion for treating an enzyme-modifier pair as a complex). GO has
      no dedicated lactose synthase complex term (Complex Portal does model it), so the most specific
      existing class is transferase complex (GO:1990234). The human B4GALT1 review uses catalytic complex
      (GO:1902494) for the same complex; transferase complex is a more specific descendant of it, chosen
      here because the complex's activity is a galactosyltransferase reaction. A lactose synthase complex
