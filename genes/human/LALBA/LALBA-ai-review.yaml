- term:
    id: GO:0140767
    label: enzyme-substrate adaptor activity
  evidence_type: EXP
  original_reference_id: PMID:11419947
  qualifier: enables
  review:
    summary: Experimental annotation (Reactome curation) of enzyme-substrate adaptor activity from the
      lactose synthase crystal structures.
    action: ACCEPT
    reason: 'This is the best available GO description of what alpha-lactalbumin itself does: it binds
      B4GALT1 next to the monosaccharide acceptor site and holds the glucose acceptor by hydrogen bonding
      to its O-1 hydroxyl, recruiting glucose as a substrate and changing the enzyme''s acceptor selection
      from GlcNAc to glucose. GO:0140767 is defined as an adaptor that brings together an enzyme and its
      substrate and contributes to substrate selection and specificity, which matches the specifier mechanism.
      The mechanism is conserved: human alpha-lactalbumin replaces the mouse protein in vivo, and bovine-mouse-human
      hybrid complexes are fully active. Core function.'
    supported_by:
    - *id006
    - *id007
    - &id020
      reference_id: PMID:3922406
      supporting_text: alpha-lactalbumin must bind to a region on galactosyltransferase in close proximity
        to the monosaccharide binding site and exert its substrate-specifying action through competitive
        and mutually exclusive binding with the N-acetylglucosamine analogues accompanied by an increased
        affinity for glucose
    - reference_id: PMID:7708733
      supporting_text: Females homozygous for the humanized allele lactate normally, indicating that human
        alpha-lac can replace murine alpha-lac.
