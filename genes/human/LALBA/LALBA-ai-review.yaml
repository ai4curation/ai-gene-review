- term:
    id: GO:0004461
    label: lactose synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:P29752
  - ensembl:ENSMUSP00000023726
  - InterPro:IPR000545
  review:
    summary: InterPro2GO/combined IEA assignment of lactose synthase activity from the Lactalbumin signature
      (IPR000545).
    action: MODIFY
    reason: The reaction UDP-galactose + D-glucose = UDP + lactose (GO:0004461) is catalysed by B4GALT1,
      the catalytic subunit of the 1:1 lactose synthase heterodimer; alpha-lactalbumin is the regulatory
      subunit that has no catalytic residues for this reaction and acts by holding glucose in the B4GALT1
      acceptor site and redirecting acceptor specificity from GlcNAc to glucose. The correct relation
      of alpha-lactalbumin to lactose synthase activity is therefore contributes_to, not enables. Its
      own molecular activity is captured by enzyme-substrate adaptor activity (GO:0140767), which GO curators
      already assign to human LALBA from PMID:11419947; the contributes_to lactose synthase relation is
      recorded in core_functions. The biology behind this row is sound, only the enables relation is wrong;
      same action for all four orthologs.
    proposed_replacement_terms:
    - &id018
      id: GO:0140767
      label: enzyme-substrate adaptor activity
    supported_by:
    - &id014
      reference_id: PMID:11419947
      supporting_text: The lactose synthase (LS) enzyme is a 1:1 complex of a catalytic component, beta1,4-galactosyltransferse
        (beta4Gal-T1) and a regulatory component, alpha-lactalbumin (LA), a mammary gland-specific protein.
    - reference_id: PMID:11485999
      supporting_text: In the presence of alpha-lactalbumin (LA), it transfers Gal to Glc, which is its
        lactose synthase (LS) activity.
    - &id006
      reference_id: PMID:11419947
      supporting_text: Thus, the role of LA is to hold Glc by hydrogen bonding with the O-1 hydroxyl group
