- id: PMID:11419947
  title: Crystal structure of lactose synthase reveals a large conformational change in its
    catalytic component, the beta1,4-galactosyltransferase-I.
  findings:
  - statement: The lactose-synthase complex contains one catalytic galactosyltransferase and one
      regulatory alpha-lactalbumin subunit. Alpha-lactalbumin favors glucose recognition, enabling
      lactose production. The linked structures provide ortholog mechanistic evidence; their
      components are not both human.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Official PubMed identity and abstract were checked. Deposited complexes linked to this
      paper contain bovine B4GalT1 and mouse LALBA, as established from RCSB1NKH/1NF5 metadata;
      use them as ortholog structural evidence. Independent human biochemical evidence supports
      the retained human lactose-synthase annotation. The original full paper and coordinates
      were not analyzed.
- id: PMID:16157350
  title: 'Oligosaccharide preferences of beta1,4-galactosyltransferase-I: crystal structures of Met340His
    mutant of human beta1,4-galactosyltransferase-I with a pentasaccharide and trisaccharides of the N-glycan
    moiety.'
  findings:
  - statement: Human wild-type kinetic measurements favor the 1,2-1,6-arm GlcNAc acceptor over the
      other tested N-glycan branches and chitotriose. Structures of the human M340H construct
      explain this branch preference; the abstract distinguishes these mutant structures from the
      wild-type kinetics.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Official indexed PubMed identity and complete cached abstract were checked. The paper
      distinguishes human wild-type kinetics from human M340H structures. The abstract does
      not mention Mn specifically; normal UniProt cofactor evidence and RCSB2AE7 modeled Mn
      provide separate support. Deposited asymmetric-unit/PISA assemblies do not establish
      physiological trimerization.
