core_functions:
- description: >-
    Transfers galactose from UDP-galactose to terminal GlcNAc residues of protein-linked N-glycans
    in the Golgi, supporting complex N-glycan maturation. Catalysis requires manganese; the
    enzyme occupies trans cisternae and can occur more broadly across Golgi stacks.
  molecular_function:
    id: GO:0003831
    label: beta-N-acetylglucosaminylglycopeptide beta-1,4-galactosyltransferase activity
  directly_involved_in:
  - id: GO:0006487
    label: protein N-linked glycosylation
  locations:
  - id: GO:0000139
    label: Golgi membrane
  - id: GO:0000138
    label: Golgi trans cisterna
  substrates:
  - id: CHEBI:66914
    label: UDP-alpha-D-galactose
  supported_by:
  - reference_id: PMID:16157350
  - reference_id: PMID:6121819
  - reference_id: file:human/B4GALT1/B4GALT1-uniprot.txt
    supporting_text: Name=Mn(2+); Xref=ChEBI:CHEBI:29035;
  - reference_id: PMID:27872474
    supporting_text: |-
      inclusion of 1% DNA encoding for B4GALT1 to the transfection mix induced galactosylation up to 70%
    reference_section_type: RESULTS
- description: >-
    Transfers galactose from UDP-galactose to free N-acetylglucosamine to form N-acetyllactosamine,
    a substrate-specific facet of the manganese-dependent catalytic activity.
  molecular_function:
    id: GO:0003945
    label: N-acetyllactosamine synthase activity
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - reference_id: PMID:33805
  - reference_id: PMID:2120039
  - reference_id: file:human/B4GALT1/B4GALT1-uniprot.txt
    supporting_text: |-
      Reaction=N-acetyl-D-glucosamine + UDP-alpha-D-galactose = beta-D- ... galactosyl-(1->4)-N-acetyl-D-glucosamine
- description: >-
    In a 1:1 complex with alpha-lactalbumin in lactating mammary cells, transfers galactose from UDP-galactose
    to glucose to synthesize lactose. Alpha-lactalbumin promotes glucose binding and changes acceptor
    preference, enabling this tissue-specific catalytic role at the Golgi.
  molecular_function:
    id: GO:0004461
    label: lactose synthase activity
  directly_involved_in:
  - id: GO:0005989
    label: lactose biosynthetic process
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - reference_id: PMID:11419947
    supporting_text: |-
      The lactose synthase (LS) enzyme is a 1:1 complex
    reference_section_type: ABSTRACT
  - reference_id: PMID:33805
  - reference_id: file:human/B4GALT1/B4GALT1-uniprot.txt
    supporting_text: |-
      LALBA alters ... specificity ... enabling high affinity ... binding of glucose
suggested_questions:
- question: >-
    Beyond the well-established Golgi catalytic role and the lactose synthase complex, does
    the cell-surface (long isoform) pool of B4GALT1 have a physiologically significant galactosyltransferase
    or recognition function in humans (e.g. sperm-egg ZP3 binding or cell-matrix adhesion),
    or is this largely a feature inferred from mouse orthologs?
- question: >-
    What is the relative in vivo contribution of B4GALT1 versus the other B4GALT family members
    (B4GALT2-4) to the bulk galactosylation of complex N-glycans, O-glycans, keratan sulfate
    and glycolipids in different human tissues?
suggested_experiments:
- description: >-
    Glycomic/glycoproteomic profiling of B4GALT1-knockout versus wild-type human cells (and
    rescue with catalytically dead vs wild-type B4GALT1) to quantify loss of terminal Galbeta1-4GlcNAc
    on N-glycans, O-glycans and glycolipids and to define which acceptor classes are most
    dependent on B4GALT1 versus redundant family members.
  hypothesis: >-
    B4GALT1 is the dominant but partially redundant beta-1,4-galactosyltransferase for complex
    N-glycan LacNAc formation, with acceptor-class-specific dependence.
- description: >-
    Compare wild-type and disease-associated human B4GALT1 variants on defined glycan and
    glucose acceptors, with and without LALBA, to separate variant effects on donor turnover,
    acceptor preference and the established lactose-synthase switch.
  hypothesis: >-
    Variants may affect glycan and lactose synthesis differently depending on altered substrate
    recognition and LALBA responsiveness.
- description: >-
    Track both alternative-initiation products at endogenous expression levels in polarized
    human cells and measure their Golgi and surface pools separately from enzymatic and recognition
    activities.
  hypothesis: >-
    Both products can contribute to Golgi localization, while their relative surface abundance
    and functions depend on cell context.
proposed_new_terms:
- proposed_name: lactose synthase complex
  proposed_definition: A heterodimeric catalytic complex composed of beta-1,4-galactosyltransferase
    1 and alpha-lactalbumin. Alpha-lactalbumin promotes glucose binding to the catalytic subunit,
    enabling transfer of galactose from UDP-galactose to glucose to form lactose. In lactating
    mammary epithelial cells this complex acts at the Golgi membrane.
  justification: The established 1:1 catalytic/regulatory complex has a defined reaction and
    composition. PMID:11419947 provides ortholog structural evidence from bovine B4GALT1 and mouse
    alpha-lactalbumin; PMID:33805 independently demonstrates alpha-lactalbumin-dependent glucose
    activity of purified human enzyme. B4GALT1 can catalyze other acceptor reactions without
    alpha-lactalbumin, so this is not an obligatory complex for every B4GALT1 activity. The checked
    GO 2026-03-25 release has no exact lactose-synthase-complex label or synonym; confirm against
    the current ontology before submitting the candidate. No new identifier or existing-annotation
    assertion is assigned here.
  proposed_parent:
    id: GO:1902494
    label: catalytic complex
  proposed_mappings:
  - predicate: skos:relatedMatch
    target_term:
      id: RHEA:12404
      label: D-glucose + UDP-alpha-D-galactose = lactose + UDP + H(+)
