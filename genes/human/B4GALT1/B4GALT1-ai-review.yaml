id: P15291
gene_symbol: B4GALT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  B4GALT1 is a manganese-dependent, type II membrane glycosyltransferase of CAZy family GT7, with a lumen-facing
  catalytic domain concentrated in trans-Golgi cisternae. It transfers galactose from UDP-galactose in
  a beta-1,4 linkage to terminal N-acetylglucosamine residues on glycoproteins (EC 2.4.1.38), supporting
  complex N-glycan maturation. It also forms N-acetyllactosamine from free N-acetylglucosamine (EC 2.4.1.90)
  and can use selected glycolipid acceptors. In lactating mammary cells, a 1:1 complex with alpha-lactalbumin
  promotes glucose binding and enables lactose synthesis (EC 2.4.1.22). Alternative initiation produces
  long and short forms differing by a 13-residue cytoplasmic extension. Both can localize to the Golgi;
  the long form also contributes to a cell-surface pool, with relative targeting dependent on cellular
  context. Catalytically active soluble enzyme is found in human body fluids. Biallelic pathogenic variants
  cause B4GALT1 congenital disorder of glycosylation. The p.Asn352Ser hypomorph has reduced activity and
  is associated with altered serum glycoprotein glycans and lower LDL cholesterol and fibrinogen concentrations.
alternative_products:
- name: Long (Cell surface)
  id: P15291-1
  description: >-
    Long alternative-initiation product with a 13-residue N-terminal cytoplasmic extension. It shares
    the catalytic domain with the short product and localizes to the Golgi and cell surface, with relative
    enrichment at the surface in some cellular contexts.
- name: Short (Golgi complex)
  id: P15291-2
  sequence_note: VSP_018802
  description: >-
    Short alternative-initiation product lacking the 13-residue N-terminal cytoplasmic extension. It localizes
    to Golgi membranes and shares the lumen-facing catalytic domain with the long product.
