  review:
    summary: Transfer of a rodent annotation implicating NTSR1 in cAMP production; NTSR1 is a promiscuous 
      receptor that engages several G protein classes, including adenylate-cyclase-coupled ones, in addition 
      to its canonical Gq/11 coupling.
    action: MODIFY
    reason: NTSR1 does not synthesize cAMP; adenylate cyclase does. What the receptor does is couple to G 
      proteins that change cyclase activity, which is what GO:0007189 states for a receptor. Promiscuous G 
      protein coupling by NTSR1 is well documented (structures with Gi1, 'engages multiple subtypes of G 
      protein', and its use as the benchmark promiscuous GPCR in G protein selectivity assays), so the essence
      of the annotation is sound but the term type is wrong for a receptor.
    proposed_replacement_terms:
