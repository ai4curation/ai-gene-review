  review:
    summary: PAINT/IBD-based phylogenetic inference placing the neurotensin/peptide-receptor clade's activity 
      at the plasma membrane, with the human gene itself among the descendant evidences.
    action: ACCEPT
    reason: "The plasma membrane is where NTSR1 acts: it is a multi-pass membrane receptor that binds extracellular
      neurotensin and acts as a GEF for heterotrimeric G proteins on the cytoplasmic face. UniProt records cell
      membrane localization, the ultrastructural study finds receptor along somatodendritic plasma membranes, and
      the purified human receptor couples to Gi and Gq heterotrimers. This is a core location. The IBA reflects
      a curator's judgement that plasma-membrane activity arose at an ancestral node of this receptor family, which
      is uncontroversial for a 7TM peptide receptor; NTSR1's own presence in the WITH/FROM list marks experimental
      grounding on the target itself."
