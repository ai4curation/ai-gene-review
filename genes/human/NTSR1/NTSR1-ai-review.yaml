suggested_questions:
- question: Which of NTSR1's many downstream physiological roles (thermoregulation, feeding, blood pressure, 
    locomotion, reward) are mediated by the G protein arm and which by the beta-arrestin arm, and should GO 
    capture arm-specific process annotations for a receptor whose two arms are pharmacologically separable?
  experts:
  - Lauren M. Slosky
  - Marc G. Caron
  - Lawrence S. Barak
- question: Given that NTSR1 couples promiscuously in vitro and is used as the benchmark promiscuous GPCR in G
    protein selectivity assays, which G protein classes should be reflected in its pathway annotations beyond 
    Gq/11 - in particular, is the transferred cAMP-related annotation best expressed as GO:0007189?
  experts:
  - Brian K. Kobilka
  - Asuka Inoue
  - Hideaki E. Kato
- question: Is the symmetric-synapse and terminal-bouton localization of NTSR1 a functionally distinct 
    presynaptic pool, or incidental labelling of a receptor whose plasma-membrane distribution is described as
    homogeneous and predominantly extrasynaptic?
  experts:
  - Alain Beaudet
  - Virginia M. Pickel
- question: Should palmitoylation-dependent membrane-raft residence of NTSR1 be modelled as a distinct active 
    location (a prerequisite for Gq/11 coupling) rather than as an additional cellular component annotation?
  experts:
  - Mark Kester
  - Robert Levenson
- question: Do the rodent-transferred annotations for inositol phosphate catabolism and for D-aspartate / 
    L-glutamate import across the plasma membrane reflect receptor-driven regulation that deserves a 
    regulatory term, or should they be dropped as transport and degradative processes in which the receptor 
    performs no step?
  experts:
  - GO cell signaling curators
  - RGD curators
suggested_experiments:
- description: Express wild-type and C381,383S human NTSR1 in a raft-disrupted versus intact background and 
    measure, side by side, raft partitioning, Galphaq/11 and Galphai recruitment (BRET), IP1/calcium 
    responses, and beta-arrestin recruitment.
  hypothesis: Palmitoylation-dependent raft residence is required specifically for the Gq/11 arm of NTSR1 
    signaling, leaving arrestin recruitment largely intact, which would justify treating membrane raft as an 
    active location for the Gq-coupled core function.
- description: Apply the smFRET Galphai helical-domain assay used for human NTSR1-Gi complexes across a panel 
    of Galpha subtypes (Gq, G11, Gi1, GoA, Gs) with matched agonists and with SBI-553-family modulators, and 
    correlate open-state occupancy with GTP turnover for each subtype.
  hypothesis: Agonist-induced helical-domain opening predicts efficacy for every G protein subtype NTSR1 
    engages, so promiscuity is set by how far the receptor opens each heterotrimer rather than by selective 
    binding.
- description: In Ntsr1 and Ntsr2 single and double knockout mice, phenotype thermal nociception, core 
    temperature, feeding and locomotion in the same cohorts, with NTSR1-selective and biased ligands as 
    pharmacological controls.
  hypothesis: Thermal nociception maps onto Ntsr2 while thermoregulation and feeding map onto Ntsr1, 
    confirming that GO:0050965 does not belong on NTSR1 and that its thermal role is homeostatic rather than 
    sensory.
- description: In human colonic epithelial and colon cancer lines, compare neurotensin, a G protein-biased 
    agonist and SBI-553 for NF-kB activation, miR-21/miR-155 induction, PTEN/SOCS1 suppression, Akt 
    phosphorylation and anchorage-independent growth, with NTSR1 knockout rescue controls.
  hypothesis: The tumour-supporting gene-expression program downstream of NTSR1 requires the G protein arm, so
    beta-arrestin-biased modulators will not reproduce it - separating the receptor's oncogenic signaling from
    its arrestin-dependent outputs.
