  review:
    summary: Row placing NTSR1 in L-glutamate import across the plasma membrane, a transport process; NTSR1 is
      a receptor with no transport activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: Neurotensin signaling can change L-glutamate handling in neurons and astrocytes, but the entity 
      that performs import across the plasma membrane is an amino-acid transporter, not a 7TM receptor. NTSR1 
      neither catalyses the translocation nor contributes structure or cofactor activity to it; at most it 
      regulates the cells that do. Any real effect belongs in a regulatory term, so the involved_in claim is 
      flagged as an over-annotation. This row is an Ensembl-Compara transfer (GO_REF:0000107) of an 
      experimental annotation of rat Ntsr1 (P20789), the unambiguous 1:1 ortholog of human NTSR1; the rodent 
      source publication is not in the local cache, so the claim is judged on the rodent literature as a 
