gene_symbol: NTSR1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NTSR1 encodes neurotensin receptor type 1 (NTS1), a 418-residue class A seven-transmembrane G protein-coupled
  receptor and the high-affinity receptor for the tridecapeptide neurotensin. It is displayed at the plasma membrane
  - in neurons predominantly along extrasynaptic somatodendritic membranes, with smaller axonal and presynaptic
  pools, and in epithelial and tumour cells within palmitoylation-dependent, caveolin-enriched membrane rafts. Agonist
  binding by the extracellular loops and the outer transmembrane pocket switches the receptor into a conformation
  that acts as a guanine-nucleotide exchange factor for heterotrimeric G proteins: canonically Gq/11, activating
  phospholipase C to generate inositol trisphosphate and diacylglycerol and to mobilize stored calcium, and, because
  the receptor couples promiscuously, also Gi/o and other classes. Downstream signaling activates ERK and Akt, protects
  cells from apoptosis, and in colonic epithelium drives NF-kB-dependent miRNA and gene-expression programs. Receptor
  phosphorylation recruits beta-arrestin, which desensitizes and internalizes the receptor and constitutes a signaling
  arm separable from the G protein arm. Dual palmitoylation at Cys381/Cys383 is required for raft residence and
  efficient Gq/11 coupling, and the receptor homodimerizes concentration-dependently, which modulates but does not
  enable G protein activation. Physiologically, neurotensin signaling through this receptor lowers body temperature
  and blood pressure, suppresses feeding, modulates locomotion, dopaminergic transmission and inhibitory synaptic
  transmission in limbic circuits, and participates in reward-related behaviour; in colon and breast cancers the
  receptor supports proliferative and pro-survival signaling. The paralogous NTSR2, not NTSR1, mediates neurotensin''s
  effects on thermal nociception.'
