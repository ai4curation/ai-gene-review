- term:
    id: GO:0007200
    label: phospholipase C-activating G protein-coupled receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:17620610
  qualifier: involved_in
  review:
    summary: NTSR1 is a Gq/11-coupled receptor whose activation drives PLC-dependent phosphoinositide 
      hydrolysis, IP3 generation and calcium mobilization; this pathway term is absent from GOA for NTSR1 
      although the receptor's downstream inositol-phosphate and calcium consequences are annotated.
    action: NEW
    reason: 'Participation: NTSR1 itself performs the first step of this pathway. Purified human NTS1 monomers catalyse
      nucleotide exchange on Galphaq-beta1-gamma2, and the palmitoylated receptor interacts with Galphaq/11 in human
      cells, with the coupling-deficient C381,383S mutant losing both the interaction and downstream ERK signaling;
      UniProt states that signaling is effected via G proteins that activate a phosphatidylinositol-calcium second
      messenger system, and Reactome models liganded NTSR1 as a GEF for Gq/11. The receptor is therefore the entity
      doing the work of activating the G protein that activates PLC, not merely something the pathway requires.
      Comparator check (QuickGO, October 2026): other peptide and amine Gq-coupled GPCRs in exactly the same role
      carry this term - AGTR1 has 13 annotations to GO:0007200, TACR1 has 5 and HTR2A has 4 - while NTSR1 and NTSR2
      have none, so the absence is a gap rather than a GO convention about receptors. The term is neither an ancestor
      nor a descendant of any other term asserted here: it is a sibling-level refinement of GO:0007186 (marked TOO_GENERAL)
      that is more specific than the kept inositol-phosphate and calcium regulation rows and distinct from GO:0007218.'
    supported_by:
