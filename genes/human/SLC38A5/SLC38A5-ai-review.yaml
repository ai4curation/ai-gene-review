- term:
    id: GO:0150104
    label: transport across blood-brain barrier
  evidence_type: NAS
  original_reference_id: PMID:26590417
  qualifier: involved_in
  review:
    summary: NAS annotation citing a general blood-brain barrier review that does not mention
      SLC38A5/SNAT5. SNAT5's documented brain role is astroglial glutamine efflux within
      the glutamate-glutamine cycle, not transendothelial transport across the barrier
      itself.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cited reference (Zhao et al., a BBB physiology review) contains no mention
      of SLC38A5, SNAT5, System N, or glutamine transport, so it does not support a specific
      transport-across-BBB claim for this gene. GO:0150104 denotes movement of solutes
      across the barrier (endothelial/transcellular), whereas SNAT5 acts on astroglial
      and neuronal membranes supplying glutamine for the neurotransmitter cycle. The annotation
      is not clearly false but over-reaches from the gene's astroglial role to a barrier-crossing
      process it has not been shown to perform.
