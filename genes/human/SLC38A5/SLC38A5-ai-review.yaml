core_functions:
- description: Plasma-membrane System N transport of neutral amino acids - principally
    glutamine, plus histidine, asparagine, serine, glycine, alanine and cysteine - coupled
    to Na+ cotransport and H+ antiport (electroneutral 1 Na+ in / 1 H+ out), operating
    bidirectionally and pH-dependently to mediate both amino-acid uptake and efflux.
  molecular_function:
    id: GO:0140893
    label: neutral amino acid, sodium:proton antiporter activity
  directly_involved_in:
  - id: GO:0015804
    label: neutral amino acid transport
  - id: GO:0006868
    label: L-glutamine transport
  - id: GO:0089709
    label: L-histidine transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:11243884
    supporting_text: the cloned human SN2 mediates Na(+)-coupled transport of system N-specific
      amino acid substrates (glutamine, asparagine, and histidine). In addition, SN2 also
      transports serine, alanine, and glycine.
  - reference_id: UniProtKB:Q8WUX1
    supporting_text: Symporter that cotransports neutral amino acids and sodium ions, coupled
      to an H(+) antiporter activity
  - reference_id: UniProtKB:Q8WUX1
    supporting_text: The transport is electroneutral coupled to the cotransport of 1 Na(+)
      and the antiport of 1 H(+)
proposed_new_terms: []
suggested_questions:
- question: Is the SNAT5-mediated transport electrogenic (Nakanishi et al.) or electroneutral
    with 1:1 Na+:glutamine stoichiometry plus uncoupled proton fluxes (Hamdani et al.,
    PMID:11742981)? The two primary studies disagree and the UniProt CAUTION flags this;
    resolving the stoichiometry would fix the correct Rhea/mechanism representation.
- question: What determines the directionality (import vs export) of SNAT5 in different
    tissues (astrocytes, hepatocytes, intestinal and gastric epithelium, pancreatic beta
    cells), and how is net flux set by local Na+, H+ and amino-acid gradients?
- question: Does SLC38A5 function in the blood-brain barrier/neurovascular unit itself,
    or only on astroglial and neuronal membranes supplying the glutamate-glutamine cycle
    (relevant to the GO:0150104 annotation)?
suggested_experiments:
- description: Electrophysiological and radiotracer flux measurements (voltage clamp plus
    uptake/efflux assays) in a defined expression system to settle the electrogenic-vs-electroneutral
    stoichiometry dispute for each substrate.
- description: Tissue- and polarity-resolved localization (apical vs basolateral) of endogenous
    SNAT5 in gastric, intestinal, hepatic and pancreatic epithelia to define its vectorial
    transport role.
- description: Conditional knockout or knockdown of Slc38a5 in astrocytes and in pancreatic
    beta cells with metabolic/flux phenotyping to test its contribution to the brain glutamine
    cycle and to amino-acid-dependent beta-cell function.
