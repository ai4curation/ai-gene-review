id: Q8WUX1
gene_symbol: SLC38A5
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC38A5 (SNAT5/SN2) is a System N sodium-coupled neutral amino acid transporter
  of the SLC38 (amino acid/polyamine transporter 2) family. It is a multi-pass plasma
  membrane protein that cotransports neutral amino acids with Na+ while countertransporting
  H+, giving an electroneutral Na+/amino acid symport coupled to H+ antiport that can
  run in either direction depending on substrate and ion gradients. Its preferred substrates
  are the System N amino acids glutamine (principal), histidine and asparagine, and it
  also accepts serine, glycine, alanine and cysteine; it does not transport anionic,
  cationic, imino or N-alkylated amino acids. Activity is strongly pH-dependent (optimal
  near pH 8) and Li+-tolerant. Through reversible glutamine flux the transporter supports
  the glutamine/glutamate(GABA) cycle in brain (astroglial glutamine efflux and neuronal
  supply), net hepatic glutamine handling and nitrogen/ammonia metabolism, and amino-acid
  provision in stomach, intestine, lung, pancreas and retina. SLC38A5 is one of two human
  System N isoforms (the other being SLC38A3/SNAT3) and is mechanistically distinct from
  the System A transporters SLC38A1/2/4, which couple amino-acid uptake to Na+ symport
  without the H+ antiport leg.
