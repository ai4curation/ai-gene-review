id: P51572
gene_symbol: BCAP31
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BCAP31 encodes BAP31, a multipass endoplasmic reticulum membrane protein 
  involved in the handling of newly synthesized membrane proteins and in communication 
  between the endoplasmic reticulum and mitochondria. It associates with selected 
  clients and protein translocation machinery, directing misfolded CFTR toward 
  degradation. Its cytoplasmic region also participates in a FIS1-associated platform 
  that recruits procaspase-8. Caspase cleavage generates an ER-localized p20 fragment 
  that promotes calcium-dependent apoptotic signaling. At ER-mitochondria contacts, 
  BAP31 associates with TOMM40 and supports the mitochondrial localization of selected 
  respiratory-chain proteins. Pathogenic BCAP31 variants cause an X-linked disorder with
  deafness, dystonia, and cerebral hypomyelination.
