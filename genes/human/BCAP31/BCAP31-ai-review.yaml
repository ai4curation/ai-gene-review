- id: PMID:9334338
  title: p28 Bap31, a Bcl-2/Bcl-XL- and procaspase-8-associated protein in the 
    endoplasmic reticulum.
  findings:
  - statement: BAP31 is an ER membrane protein associated with BCL2, BCL-XL and 
      procaspase-8 in the reported experiments.
  - statement: Caspase cleavage produces fragments including p20; p20 expression induces
      apoptotic effects in the tested cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected recombinant p28/p20–BCL2 binding and 293T co-IP Results. No 
      complete-paper or figure-pixel claim. Association and cleavage evidence is real; 
      substrate status does not negate every signaling function. Distinguish this source
      from the later FIS1 platform mechanism.
- id: PMID:18555783
  title: BAP31 interacts with Sec61 translocons and promotes retrotranslocation of 
    CFTRDeltaF508 via the derlin-1 complex.
  findings:
  - statement: BAP31 associates with Sec61beta/TRAM and Derlin-1 machinery and binds the
      N-terminal region of CFTR F508del.
  - statement: BAP31 depletion reduces CFTR F508del degradation and permits some mutant 
      CFTR to reach the cell surface, supporting client handling in ER quality control.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract assessed. The CFTR F508del interaction, reduced degradation 
      after BAP31 depletion and Derlin-1 association support client delivery and ERAD 
      regulation. These data do not establish the ATP-dependent ratchet required by 
      GO:0140388. The source contacts with CFTR, SEC61B, TRAM1 and DERL1 remain 
      distinct.
- id: PMID:21183955
  title: Fis1 and Bap31 bridge the mitochondria-ER interface to establish a platform for
    apoptosis induction.
  findings:
  - statement: Intact FIS1-BAP31 complexes recruit procaspase-8; deletion of the 
      relevant BAP31 cytoplasmic segment disrupts recruitment.
  - statement: Caspase cleavage generates ER-associated p20, which contributes to 
      calcium-dependent mitochondrial apoptotic responses.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Abstract and selected original Results/captions assessed. FIS1-BCAP31 association,
      procaspase-8 recruitment and the cytoplasmic-region deletion experiment support a signaling
      platform; cleavage and calcium responses concern a related but distinct p20 mechanism.
      The cache is abstract-only; the selected external Results were read separately.'
- id: PMID:31206022
  title: BAP31 regulates mitochondrial function via interaction with Tom40 within 
    ER-mitochondria contact sites.
  findings:
  - statement: Endogenous DSP-crosslinked co-immunoprecipitation in human U2OS cells 
      supports BAP31 association with TOMM40 and NDUFS4.
  - statement: BAP31 depletion changes mitochondrial distribution and turnover of NDUFS4
      and NDUFB11; VDAC1 association does not show the same localization phenotype.
  - statement: The observed localization and turnover effects do not constitute a direct
      kinetic pore or motor assay.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract, selected Results, Figures 3-4 captions and 
      co-immunoprecipitation Methods assessed. Crosslinked endogenous association and 
      fractionation/turnover support a selective mitochondrial protein-localization 
      role. They do not establish purified direct binding or an autonomous import motor.
      NDUFS4/NDUFB11 localization changes differ from VDAC1 association without the same
      phenotype.
