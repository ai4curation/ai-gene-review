  review:
    summary: The cited donor experiment contradicts BAP31 enrichment in clathrin-coated 
      vesicles.
    action: REMOVE
    reason: The MGI cross-species Bcap31 comparison displays a rat IDA annotation citing
      PMID:9396746 and RGD:7483571; MGI is the display source, not the donor organism or
