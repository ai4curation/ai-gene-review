    review_notes: Abstract assessed. This mouse germ-cell expression survey and 
      quantitative-PCR study does not establish a BCAP31-specific spermatogenesis 
      mechanism in the material read. The gene-specific body/table evidence remains 
      unchecked, so the transferred functional annotation remains UNDECIDED.
- id: PMID:15187134
  title: Bap29/31 influences the intracellular traffic of MHC class I molecules.
  findings:
  - statement: Combined loss of mouse Bap29 and Bap31 delays MHC-I export and affects 
      recruitment to ER exit sites.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract assessed. Combined mouse Bap29/Bap31 loss delays MHC-I export
      and decreases class-I colocalization with mSec31-positive exit sites. Together 
      with MHC-I association, this supports a secondary exit-site localization role. It 
      does not isolate human BCAP31 or establish that it directly executes the 
      vesicle-transport step. The revised PAINT node was not reconstructed.
- id: PMID:17056546
  title: Bap31 enhances the endoplasmic reticulum export and quality control of human 
    class I MHC molecules.
  findings:
  - statement: BAP31 overexpression increases MHC-I cell-surface expression and export 
      in the tested human-cell system.
  - statement: The tested BAP31 knockdown and deficient-fibroblast comparisons do not 
      show reduced surface MHC-I, limiting claims of an obligatory mechanism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract, Results and selected Discussion assessed. Human BAP31 
      overexpression accelerates MHC-I export, but knockdown and examined 
      BAP31-deficient fibroblasts do not show a matching reduction in surface MHC-I. 
      This supports conditional or redundant trafficking and quality-control 
      contributions, not a universal requirement or absence of function. Complete 
      Methods, image pixels and supplements were not examined.
- id: PMID:23967155
  title: Structural and biophysical characterization of the cytoplasmic domains of human
    BAP29 and BAP31.
  findings:
  - statement: The isolated BAP31 variant death-effector domain forms a parallel 
      coiled-coil dimer.
  - statement: The tested isolated cytoplasmic domains did not form a BAP29-BAP31 
      heteromer; this experiment does not settle full-length membrane association.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract and selected oligomerization Results/captions assessed. The 
      isolated cytoplasmic domains form coiled coils; the historical variant 
      death-effector-domain name does not establish a canonical death-effector fold. 
      Failure of the isolated BAP29/BAP31 domains to heteromerize does not exclude 
      full-length membrane-protein association. Coordinates and supplements were not 
      reanalyzed.
- id: PMID:9396746
  title: Export of cellubrevin from the endoplasmic reticulum is controlled by BAP31.
  findings:
  - statement: Rat-liver clathrin-coated-vesicle fractions show cellubrevin enrichment 
      with virtually no BAP31; BAP31 is enriched in ER-related fractions.
  - statement: BAP31 tail-mutant expression selectively retains cellubrevin in the 
      tested system, while transferrin-receptor surface delivery is preserved.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract and selected localization, fractionation and 
      tail-mutant/client Results assessed. Rat-liver clathrin-coated vesicles contain 
      abundant cellubrevin but virtually no BAP31, contradicting the positive 
      localization transfer. BHK client-retention experiments support selective 
      cellubrevin handling, with transferrin receptor as a distinct comparison. 
      Whole-paper and figure-pixel analysis were not performed.
core_functions:
- molecular_function:
    id: GO:0140597
    label: protein carrier activity
  description: Binds newly synthesized membrane-protein clients and helps direct their 
    disposition. BAP31 associates with CFTR F508del, Sec61/TRAM and Derlin-1 machinery; 
    depletion reduces mutant-CFTR degradation and permits some protein to reach the cell
    surface. This supports client delivery and positive regulation of ERAD. Feuermann 
    proposed the narrower translocation-chaperone term in GO issue 6385, but its current
    definition requires ATP-dependent binding cycles that drive membrane translocation; 
    that motor mechanism is not established by the CFTR evidence assessed here.
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  directly_involved_in:
  - id: GO:1904294
    label: positive regulation of ERAD pathway
  supported_by:
  - reference_id: PMID:18555783
    supporting_text: "BAP31 operates at early steps to deliver newly \nsynthesized CFTRDeltaF508
      to its degradation pathway."
- molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  description: Participates with FIS1 in a platform at the ER-mitochondria interface 
    that recruits procaspase-8 during apoptotic signaling. Deletion of the BAP31 
    cytoplasmic region historically called a variant death effector domain disrupts 
    procaspase-8 recruitment. Following cleavage, ER-localized p20 contributes to 
    calcium release and downstream mitochondrial responses. The recruitment function 
    belongs to the intact platform and is distinct from BAP31 merely serving as a 
    caspase substrate.
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:21183955
- description: Supports localization of selected complex I proteins to mitochondria from
    ER-mitochondria contact sites. In human U2OS cells, BAP31 associates with TOMM40 and
    NDUFS4 in crosslinked co-immunoprecipitation experiments, while BAP31 depletion 
    alters the mitochondrial distribution and turnover of NDUFS4 and NDUFB11. These 
    experiments support a contribution to protein localization without assigning BAP31 
    the catalytic or channel activity of the mitochondrial import machinery.
  directly_involved_in:
  - id: GO:0070585
    label: protein localization to mitochondrion
  locations:
  - id: GO:0044233
    label: mitochondria-associated endoplasmic reticulum membrane contact site
  supported_by:
  - reference_id: PMID:31206022
  knowledge_gaps:
  - gap_statement: 'The molecular activity by which BCAP31 promotes mitochondrial precursor
      localization is not resolved by the binding and fractionation experiments assessed here:
      direct precursor capture and handoff remain a mechanistic model.'
    boundary: In human U2OS cells, endogenous crosslinked co-immunoprecipitation 
      associates BCAP31 with TOMM40 and pre-NDUFS4/NDUFS4; BCAP31 loss changes precursor
      distribution and turnover and decreases mitochondrial NDUFS4 and NDUFB11. These 
      establish a localization role, but do not isolate direct binary binding or a 
      carrier reaction.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    resolution: Reconstitute precursor capture and delivery using defined components, 
      and test separation-of-function BCAP31 variants for precursor binding versus 
      TOMM40 association.
    provenance:
    - reference_id: PMID:31206022
proposed_new_terms: []
suggested_questions:
- question: How do BAP31-dependent client handling and MHC-I export differ across cell 
    types and between BAP31 single loss and combined BAP29/BAP31 loss?
- question: Which molecular contacts mediate procaspase-8 recruitment by the BAP31 
    cytoplasmic region, given that its historical domain name does not establish a 
    canonical death effector fold?
- question: Does BAP31 alter the import rate, delivery, retention, or degradation of 
    specific mitochondrial precursors at ER-mitochondria contacts?
suggested_experiments:
- description: Compare client binding and delivery by BAP31 variants in reconstituted 
    systems and cellular rescue experiments, measuring folding, degradation, and surface
    arrival separately.
- description: Measure time-resolved import and turnover of NDUFS4 and NDUFB11 after 
    acute BAP31 depletion, with controls for mitochondrial integrity and precursor 
    availability.
