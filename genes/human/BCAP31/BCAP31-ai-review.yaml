  - PANTHER:PTN000294723
  review:
    summary: MHC-I recruitment to ER exit sites is a supported client-dependent role.
    action: KEEP_AS_NON_CORE
    reason: PMID:15187134 reports Bap31 association with mouse MHC-I and loss of class-I
      colocalization with the COPII component mSec31 in Bap29/Bap31-deficient cells. 
      This supports the specific exit-site localization outcome as a secondary 
      client-dependent function. It does not establish an obligatory human BAP31 cargo 
      receptor or distinguish all upstream quality-control contributions. GO annotation 
      issue 6385 records Wood and Feuermann reassessing this family, including 
      Feuermann's proposed translocation-chaperone term and completed reannotation. That
      expert reassessment is acknowledged; the revised node was not independently 
      reconstructed. The positive recruitment result is retained with these limits 
      rather than treated as proof that every ortholog directly executes COPII 
      transport.
    additional_reference_ids:
    - PMID:15187134
    - PMID:17056546
