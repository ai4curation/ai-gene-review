  review:
    summary: The conditional trafficking contribution is supported, but the precise 
      vesicle-transport inference remains unresolved.
    action: UNDECIDED
    reason: In GO annotation issue 6385, V. Wood questions whether the trafficking 
      phenotype follows from upstream client quality control; M. Feuermann explicitly 
      suggested GO:0140388 on 21 May 2026 and reported the family reannotation finished 
      on 3 June. These are curator judgments, distinct from the AI text included in the 
      issue body. Mouse Bap29/Bap31 loss delays MHC-I export, while human BAP31 
      overexpression accelerates export and deficiency does not consistently reduce 
      surface MHC-I (PMID:15187134; PMID:17056546). The latter result supports 
      redundancy or context dependence, not absence of function. The material assessed 
      here does not resolve BCAP31 participation in the vesicle-transport step 
      separately from client handling, or reconstruct the revised PAINT ancestral 
      assertion. Retain UNDECIDED for that specific inference rather than assert that 
      the curator or primary experiments are wrong.
    additional_reference_ids:
    - PMID:15187134
    - PMID:17056546
