id: Q14195
gene_symbol: DPYSL3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Dihydropyrimidinase-related protein 3 (DPYSL3/CRMP4), a cytoplasmic CRMP-family protein required
  for class-3 semaphorin signaling and cytoskeletal remodeling. A pseudoenzyme with respect to the ancestral
  dihydropyrimidinase reaction, it lacks the conserved metal-cofactor residues and has no dihydropyrimidinase
  activity. DPYSL3 is distinguished by F-actin binding/bundling and filopodium regulation, binds filamin
  and chondroitin sulfate, and modulates neuron projection development, growth-cone dynamics and cell
  migration. It forms homo- and hetero-tetramers with other CRMPs.
