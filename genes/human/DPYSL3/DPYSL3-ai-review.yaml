    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The broad catalytic mapping derives from a hydrolase domain whose ancestral active
      site has been lost.
    action: REMOVE
    reason: For this target the mapped InterPro hydrolase reaction is contradicted by loss of the
      dihydropyrimidinase metal center, and the reviewed evidence does not establish an alternative
      hydrolytic reaction. Remove this catalytic inference rather than generalizing a defunct enzyme
      activity. This is not a claim that all CRMP paralogs can never evolve another enzymatic activity.
