- term:
    id: GO:0042541
    label: hemoglobin biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:87990
  - PANTHER:PTN000343740
  - ZFIN:ZDB-GENE-001229-1
  review:
    summary: PAINT IBA from node PTN000343740 (Bilateria), seeded by erythroid ALAS2 genes of mouse and
      zebrafish.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0042541 is defined as "The chemical reactions and pathways resulting in the formation of
      hemoglobin, an oxygen carrying, conjugated protein containing four heme groups and globin". Hemoglobin
      heme is made by the erythroid isozyme ALAS2; ALAS1 is the housekeeping enzyme that supplies heme
      for cytochromes and other hemoproteins. The node sits above the ALAS1/ALAS2 duplication, so ALAS1
      inherits a role that is specific to the ALAS2 paralog; on the strength of this review the PTHR13693
      family review now prunes the node from the SF50 ALAS1 clade (NEEDS_PRUNING). A minor ALAS1 contribution in early erythroid progenitors
      cannot be excluded, so the row is marked over-annotated rather than removed.
    supported_by:
    - reference_id: PMID:16234850
      supporting_text: ALAS1 is ubiquitously expressed and provides heme for cytochromes and other hemoproteins.
        ALAS2 is expressed exclusively in erythroid cells and synthesizes heme specifically for haemoglobin.
    - reference_id: PMID:32499479
      supporting_text: ALAS1 (gene location 3p21.2) is the housekeeping enzyme providing a basal level
        of heme in non-erythroid cell types for cytochromes and other hemoproteins.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000343740
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Bilateria node seeded only by erythroid ALAS2 (mouse Alas2, zebrafish alas2) but placed
          above the ALAS1/ALAS2 split, so the housekeeping ALAS1 clade inherits hemoglobin biosynthesis.
