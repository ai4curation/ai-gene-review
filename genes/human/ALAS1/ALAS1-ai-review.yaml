- term:
    id: GO:0001666
    label: response to hypoxia
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P13195
  - ensembl:ENSRNOP00000074873
  review:
    summary: Ensembl Compara transfer from rat Alas1 (P13195) of response to hypoxia, based on expression
      or activity changes of the rat gene.
    action: MARK_AS_OVER_ANNOTATED
    reason: Hepatic ALAS1 expression is regulated by many physiological and chemical signals, and the
      rat-derived 'response to hypoxia' row reflects such a change in Alas1 level. The protein performs
      no step of the response itself, and the specific rat finding was not checked for human ALAS1, so
      this is an over-annotation of a regulatory observation. For hypoxia specifically, the cached human
      study found the oxygen-regulated degradation motif in ALAS2, stating it does not occur in ALAS1.
    supported_by:
    - reference_id: PMID:16234850
      supporting_text: A database search for proteins potentially regulated by oxygen tension revealed
        that ALAS2 contained a sequence of amino acids (LXXLAP where L is leucine, X is any amino acid,
        A is alanine, and P is proline) not occurring in ALAS1
    - reference_id: PMID:17975826
      supporting_text: Aminolevulinic acid synthase 1 (ALAS1) is the rate-limiting enzyme of heme synthesis
        in the liver and is highly regulated to adapt to the metabolic demand of the hepatocyte.
