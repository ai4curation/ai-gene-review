        the most potent natural FXR ligand, or the synthetic FXR-specific agonist GW4064.
core_functions:
- description: ALAS1 catalyses the PLP-dependent condensation of glycine and succinyl-CoA to 5-aminolevulinate
    in the mitochondrial matrix, initiating heme B synthesis for cytochromes and other hemoproteins in
    non-erythroid cells. Its level is set by heme-dependent negative feedback, including ClpXP- and LONP1-mediated
    degradation of the mature protein.
  molecular_function:
    id: GO:0003870
    label: 5-aminolevulinate synthase activity
  directly_involved_in:
  - id: GO:0006785
    label: heme B biosynthetic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: file:human/ALAS1/ALAS1-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Catalyzes the pyridoxal 5'-phosphate (PLP)-dependent condensation of succinyl-CoA
      and glycine to form aminolevulinic acid (ALA), with CoA and CO2 as by-products.
  - reference_id: PMID:32499479
    supporting_text: ALAS1 (gene location 3p21.2) is the housekeeping enzyme providing a basal level of
      heme in non-erythroid cell types for cytochromes and other hemoproteins.
  - reference_id: Reactome:R-HSA-1592238
    supporting_text: The ALAS1 precursor is imported into the mitochodrial matrix where it catalyzes the
      synthesis of 5-aminolevulinate from glycine and succinyl-CoA as part of heme biosynthesis.
  - reference_id: PMID:27496948
    supporting_text: In eukaryotic cells, heme production is tightly controlled by heme itself through
      negative feedback-mediated regulation of nonspecific 5-aminolevulinate synthase (ALAS1), which is
      a rate-limiting enzyme for heme biosynthesis.
suggested_questions:
- question: Does ALAS1 make any measurable contribution to hemoglobin heme in early erythroid progenitors,
    which would justify the PAINT hemoglobin biosynthesis node (PTN000343740) being placed above the ALAS1/ALAS2
    duplication?
- question: UniProt cites PMID:16234850 for ALAS1 Pro-576 hydroxylation and VHL binding, while that paper's
    abstract reports the LXXLAP motif and VHL-dependent turnover for ALAS2 and states the motif does not
    occur in ALAS1. Is the ALAS1 PTM annotation correct?
suggested_experiments:
- description: Measure ALAS1 and ALAS2 protein and 5-aminolevulinate output in staged human erythroid
    progenitors (e.g. CD34+ differentiation) with isoform-specific knockdown, to test whether ALAS1 supplies
    any hemoglobin heme.
