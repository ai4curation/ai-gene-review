id: P13196
gene_symbol: ALAS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ALAS1 is the housekeeping (non-specific) 5-aminolevulinate synthase, a mitochondrial pyridoxal
  5'-phosphate (PLP)-dependent enzyme. It condenses glycine and succinyl-CoA to 5-aminolevulinate, CoA
  and CO2, the first and rate-limiting step of heme biosynthesis in non-erythroid cells. It supplies a
  basal level of heme for cytochromes and other hemoproteins and is the rate-limiting heme-synthesis enzyme
  of the liver. The precursor carries an N-terminal transit peptide and is imported into the mitochondrial
  matrix, where the mature enzyme acts as a homodimer on the matrix face of the inner membrane. ALAS1
  is the main control point of heme synthesis. Heme represses its transcription, destabilises its mRNA,
  blocks import of the precursor and triggers degradation of the mature protein by the matrix proteases
  ClpXP and LONP1. Drugs and bile acids acting through FXR induce the gene in the liver. Induction of
  hepatic ALAS1 precipitates attacks of the acute hepatic porphyrias, and silencing ALAS1 mRNA is used
  to prevent them. Erythroid heme for hemoglobin is made by the paralog ALAS2.
