id: Q9GZU5
gene_symbol: NYX
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NYX encodes nyctalopin, a class IV small leucine-rich proteoglycan (SLRP) with a signal peptide, eleven
  leucine-rich repeats flanked by cysteine-rich N- and C-terminal caps, and N-glycosylation sites. Unlike other
  SLRPs it is attached to the plasma membrane rather than secreted into the matrix: the human protein is predicted
  to be GPI-anchored and the mouse protein is transmembrane, with the LRR domain facing the synaptic cleft. In the
  retina it is expressed by depolarizing (ON) bipolar cells and sits postsynaptically at their dendritic tips in
  the photoreceptor synapse, where it binds the TRPM1 cation channel directly and is required for TRPM1 to reach
  the dendritic tips; it is part of the mGluR6-TRPM1 signalling complex together with mGluR6, GPR179 and the presynaptic
  organizer LRIT3. It has no known catalytic, channel or receptor activity. Loss of nyctalopin abolishes the ON-bipolar
  response to glutamate in nob mice, and hemizygous variants cause X-linked complete congenital stationary night
  blindness (CSNB1A).'
