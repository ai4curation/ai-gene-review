core_functions:
- description: Membrane-anchored LRR proteoglycan of ON-bipolar dendritic tips that binds TRPM1 and is required
    for the channel to reach and stay in the postsynaptic membrane of the photoreceptor synapse, so that the mGluR6-TRPM1
    cascade can generate the ON response (mouse nob; human CSNB1A). No GO molecular function fits a non-catalytic
    accessory subunit without asserting an activity the evidence does not show, so the function is stated at process
    level.
  directly_involved_in:
  - id: GO:1903539
    label: protein localization to postsynaptic membrane
  - id: GO:0007601
    label: visual perception
  locations:
  - id: GO:0044292
    label: dendrite terminus
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: PMID:21734298
    supporting_text: We report that the extracellular membrane-attached protein nyctalopin is required for the normal
      expression of TRPM1 on the dendrites of DBCs in mus musculus.
  - reference_id: PMID:17881478
    supporting_text: Together, our data show that nyctalopin expression on DBC dendrites is required for normal
      function of the murine retina.
suggested_questions:
- question: Does nyctalopin only localize TRPM1, or does it also tune the channel's gating by the mGluR6-Go cascade?
- question: Is human nyctalopin GPI-anchored in the retina as predicted, and does the anchor type matter for function?
suggested_experiments:
- hypothesis: Nyctalopin's LRR domain binds the TRPM1 extracellular loops directly.
  description: Map the binding interface with purified nyctalopin ectodomain and TRPM1 extracellular segments, then
    test interface mutants for TRPM1 dendritic-tip localization in nob retina by AAV rescue.
status: COMPLETE
