id: Q96C92
gene_symbol: ENTR1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ENTR1 (endosome-associated trafficking regulator 1; formerly SDCCAG3, serologically
  defined colon cancer antigen 3) is a 435-residue cytoplasmic protein with a disordered
  N-terminal half and a C-terminal coiled-coil (ENTR1 family, Pfam PF29363). It has no
  known enzymatic activity and acts as an endosome-associated scaffold/adaptor in
  membrane-receptor sorting. ENTR1 resides mainly on early and recycling endosomes, where
  it associates with the retromer core subunit VPS35 and with the FERM domain of the
  tyrosine phosphatase PTPN13, and binds the Arf GAP GIT1 and the coiled-coil protein
  dysbindin. In human cells its depletion alters the surface levels of endocytosed
  receptors in a cargo-specific way: SNX27-retromer cargo GLUT1 is lost from the surface,
  whereas the death receptor Fas accumulates at the surface because its sorting into
  intraluminal vesicles and delivery to lysosomes is delayed; ENTR1 is itself cleaved by
  caspases during Fas-induced apoptosis. During cell division ENTR1 accumulates at the
  midbody, and both its over- and under-expression produce multinucleate cells. ENTR1 also
  localizes to the centrosome and the basal body of primary cilia through its N-terminal
  100 residues, which bind the intraflagellar transport protein IFT88; it is required for
  normal cilium number and length and for ciliary targeting of polycystin-2.
