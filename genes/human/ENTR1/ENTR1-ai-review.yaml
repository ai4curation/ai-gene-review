- term:
    id: GO:0032456
    label: endocytic recycling
  evidence_type: IMP
  original_reference_id: PMID:25278552
  qualifier: involved_in
  review:
    summary: siRNA depletion of ENTR1 in HeLa cells reduces surface and total GLUT1 and has minor effects on surface CD97 and TRAILR1, all SNX27-retromer cargos.
    action: ACCEPT
    reason: >-
      ENTR1 is a VPS35-associated endosomal protein whose loss perturbs surface levels of several
      SNX27-retromer recycling cargos, consistent with participation in endosome-to-plasma
      membrane recycling. The effects are cargo-specific and modest (GLUT1 loss did not
      correlate with lysosomal accumulation), and for Fas ENTR1 depletion increases recycling
      (PMID:31308371), so ENTR1 is better seen as a sorting regulator that influences the balance
      between recycling and degradative fates than as a core recycling component. Accepted as
      the experimentally supported process term from this study.
    supported_by:
    - reference_id: PMID:25278552
      supporting_text: Suppression of SDCCAG3 led to a decrease in GLUT1 surface expression and a reduction in whole-cell levels, but this did not correlate with an obvious accumulation of GLUT1 in lysosomes
    - reference_id: PMID:25278552
      supporting_text: For RME-8 and SDCCAG3, RNAi-mediated suppression produced minor effects on CD97 surface levels
