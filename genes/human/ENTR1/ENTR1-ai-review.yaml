suggested_questions:
- question: >-
    Does ENTR1 have a definable molecular activity (for example a molecular adaptor activity
    bridging PTPN13, dysbindin or IFT20/IFT88 to endosomal membranes), or is it best left without
    an MF term until a direct binding-dependent mechanism is reconstituted?
- question: >-
    PANTHER splits one-to-one mammalian ENTR1 orthologs between PTHR31259:SF6 (human) and SF3
    (mouse, horse). Is this a genuine functional split or an artefact of alternative-exon
    content, and should PAINT nodes PTN002039065/PTN004793274 be checked to confirm that SF3
    members inherit them?
- question: >-
    Should the Fas endolysosomal-sorting data (PMID:31308371) be annotated to the
    multivesicular-body pathway (GO:0032510) rather than the broader GO:0008333?
suggested_experiments:
- hypothesis: ENTR1 couples endosomal receptor sorting to ciliary vesicle delivery through mutually exclusive partner complexes (PTPN13/dysbindin versus IFT88/IFT20).
  description: >-
    Map binding interfaces for PTPN13, dysbindin, IFT88 and IFT20 on ENTR1, generate
    separation-of-function point mutants, and test each in ENTR1-knockout RPE1 cells for Fas
    degradation, GLUT1 surface levels, ciliogenesis and polycystin-2 ciliary targeting.
  experiment_type: separation-of-function rescue
- hypothesis: Mouse Entr1 (subfamily SF3) retains the endosomal and ciliary functions shown for human ENTR1 (SF6).
  description: Knock out Entr1 in mouse IMCD3 or mCCD cells and assay ciliogenesis, polycystin-2 targeting and Fas/TNFR1 surface levels, with rescue by mouse versus human ENTR1.
  experiment_type: cross-species complementation
