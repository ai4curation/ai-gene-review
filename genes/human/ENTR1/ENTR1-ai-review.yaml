    summary: >-
      In human HeLa and HCT-116 cells, ENTR1 depletion or knockout delays sorting of internalized
      Fas into intraluminal vesicles and its delivery to lysosomes, slows Fas degradation and
      increases Fas recycling and surface levels; this requires ENTR1 binding to PTPN13 and to
      dysbindin (via the ENTR1 C-terminal 16 residues).
    action: NEW
    reason: >-
      A full-text human study (siRNA with three independent oligos, CRISPR knockout, rescue,
      binding-site mutants) post-dating the existing GOA set. ENTR1 sits on the endosomes where
      the sorting occurs and acts there through physical complexes with PTPN13 and the
      dysbindin-HRS axis, so it contributes to the sorting machinery itself rather than being a
      cargo or an upstream requirement. The process term is the broad endosome-to-lysosome
      transport term because the cargo studied in depth is a single receptor; the more specific
      multivesicular-body pathway child (GO:0032510) is plausible from the intraluminal-vesicle
      sorting data but was not chosen to avoid over-precision.
    supported_by:
    - reference_id: PMID:31308371
      supporting_text: ENTR1 regulates, via binding to the coiled coil domain protein Dysbindin, the delivery of Fas from endosomes to lysosomes thereby controlling termination of Fas signal transduction.
    - reference_id: PMID:31308371
      supporting_text: However, in ENTR1 depleted cells, transport to lysosomes was significantly impaired
    - reference_id: PMID:31308371
      supporting_text: Here we present evidence for a role of ENTR1 and the multi-PDZ domain protein PTPN13 in post-endocytic sorting of Fas to lysosomes.
