core_functions:
- description: >-
    Endosome-associated sorting regulator: on early/recycling endosomes ENTR1 associates with
    retromer (VPS35), PTPN13 and dysbindin and controls the fate of internalized membrane
    receptors, promoting lysosomal sorting of Fas and supporting surface levels of
    SNX27-retromer cargo such as GLUT1. No enzymatic or specific binding activity term is
    established, so no molecular function is asserted.
