  evidence_type: IDA
  original_reference_id: PMID:22595670
  qualifier: involved_in
  review:
    summary: Cell migration (IDA). AVL9 depletion slowed A549 scratch-wound migration. Studies in colorectal
      carcinoma cells and AVL9-knockout cancer cells concur, and in the latter the putative catalytic
      arginine (R111A) is needed for AVL9 to enhance migration. In MDCK cells, knockdown instead increased
      migration, so the sign is context-dependent. AVL9's involvement is consistent across studies. Its
      best-characterized cellular role; accepted.
    action: ACCEPT
    reason: '[PMID:22595670 "Here, we find that Rab4, Rab11, and Rab14 and the candidate Rab GDP-GTP exchange
      factors (GEFs) FAM116A and AVL9 are required for cell migration."] [PMID:22595670 "Similarly, Avl9-depleted
      cells migrated more slowly and failed to close the wound after 16 hr (Figure 2B and Movie S3)."]
      [PMID:34991461 "Functionally, AVL9 overexpression promoted cell migration rather than cell proliferation
      in vitro, whereas AVL9 knockdown exhibited the contrary results."] [PMID:41542567 "Importantly,
      this effect was not observed in cells expressing the putative catalytic mutant AVL9-R111A despite
      similar expression levels (Figure 5D).As a complimentary approach we carried out transwell migration
      assays in which cells can traverse a porous membrane when exposed to a chemical gradient."] [PMID:25621300
