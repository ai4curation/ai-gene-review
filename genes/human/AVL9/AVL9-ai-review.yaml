taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AVL9 (late secretory pathway protein AVL9 homolog) is a conserved tripartite DENN-domain
  protein. It was first described in yeast as a late-secretory (exocytosis) gene. In human cancer cell
  lines it is required for, or modulates, cell migration. Expressed AVL9 partly overlaps recycling endosomes,
  whereas antibody staining of the endogenous protein is ER-like. Although grouped with DENN-domain Rab
  GEFs, no Rab GEF activity has been detected. Instead, yeast Avl9 is a GTPase-activating protein for
  Arf1, recruited to secretory vesicles by Rab8. The corresponding catalytic arginine of human AVL9 is
  required for its pro-migratory effect, which indicates that the GAP function is conserved. In pancreatic
  cancer cells, AVL9 has been reported to scaffold IκBα to SKP1, promoting NF-κB activation.
