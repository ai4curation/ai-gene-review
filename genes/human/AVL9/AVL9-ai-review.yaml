suggested_questions:
- question: Is human AVL9 an Arf1 (or other Arf/Arl) GAP, and does its migration phenotype reflect control
    of Arf1 at the TGN or on post-Golgi secretory/recycling carriers?
suggested_experiments:
- description: Measure GAP activity of purified human AVL9 and the R111A mutant toward ARF1-6 and ARL
