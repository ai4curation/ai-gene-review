- id: PMID:22595670
  title: Rab14 and its exchange factor FAM116 link endocytic recycling and adherens junction stability
    in migrating cells.
  findings:
  - statement: AVL9 is required for A549 cell migration.
    supporting_text: Here, we find that Rab4, Rab11, and Rab14 and the candidate Rab GDP-GTP exchange
      factors (GEFs) FAM116A and AVL9 are required for cell migration.
  - statement: No Rab GEF activity was detected for AVL9.
    supporting_text: Despite repeated attempts, it was not possible to measure Avl9 GEF activity toward
      any of the Rabs tested under the assay conditions used.
  reference_review:
    relevance: HIGH
    review_notes: Full text; siRNA migration screen plus GEF assays.
    correctness: VERIFIED
- id: PMID:41542567
  title: Avl9 defines a family of GTPase-activating proteins that regulate diverse cell biological functions.
  findings:
  - statement: Yeast Avl9 is an Arf1 GAP recruited by Rab8.
    supporting_text: We determined that Avl9 possesses robust Arf-GAP activity and is recruited to secretory
      vesicles by Rab8.
  - statement: Human AVL9 R111A fails to enhance migration.
    supporting_text: Importantly, this effect was not observed in cells expressing the putative catalytic
      mutant AVL9-R111A despite similar expression levels (Figure 5D).As a complimentary approach we carried
      out transwell migration assays in which cells can traverse a porous membrane when exposed to a chemical
      gradient.
  reference_review:
    relevance: HIGH
    review_notes: bioRxiv preprint (full text), not peer reviewed. The GAP biochemistry was done on yeast
      Avl9; the human data are a catalytic-arginine mutant migration phenotype.
    correctness: LOW_QUALITY
- id: PMID:34991461
  title: AVL9 promotes colorectal carcinoma cell migration via regulating EGFR expression.
  findings:
  - statement: AVL9 promotes CRC cell migration.
    supporting_text: Functionally, AVL9 overexpression promoted cell migration rather than cell proliferation
      in vitro, whereas AVL9 knockdown exhibited the contrary results.
  reference_review:
    relevance: MEDIUM
    review_notes: Full text; overexpression/knockdown in CRC lines.
    correctness: VERIFIED
- id: PMID:25621300
  title: Cancer driver candidate genes AVL9, DENND5A and NUPL1 contribute to MDCK cystogenesis.
  findings:
  - statement: AVL9 knockdown promotes MDCK migration.
    supporting_text: Moreover, while all knockdown clones displayed an accelerated rate of both cell proliferation
      and death, only AVL9- and DENND5A-knockdowns, but not NUPL1-knockdown, promoted cell migration.
  reference_review:
    relevance: MEDIUM
    review_notes: Full text; MDCK cystogenesis study; migration direction opposite to A549/CRC.
    correctness: VERIFIED
- id: PMID:39566663
  title: Hypoxic and Acidic Tumor Microenvironment-Driven AVL9 Promotes Chemoresistance of Pancreatic
    Ductal Adenocarcinoma via the AVL9-IκBα-SKP1 Complex.
  findings:
  - statement: AVL9 scaffolds IκBα to SKP1 in PDAC.
    supporting_text: AVL9 acts as a scaffold that facilitates the binding of IκBα to SKP1, leading to
      enhanced ubiquitination and degradation of IκBα, which further activates the nuclear factor-κB pathway.
  reference_review:
    relevance: LOW
    review_notes: Abstract-only; cancer-context mechanism, not used for any annotation.
    correctness: VERIFIED
  full_text_unavailable: true
