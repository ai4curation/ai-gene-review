    correctness: VERIFIED
- id: PMID:42714338
  title: Avl9 defines a family of DENN domain GTPase-activating proteins.
  findings:
  - statement: Yeast Avl9 is an Arf1 GAP recruited by Rab8.
    supporting_text: We determined that Avl9 possesses robust Arf-GAP activity and is recruited to secretory
      vesicles by Rab8.
  - statement: Human AVL9 R111A fails to enhance transwell migration.
    supporting_text: We found that a greater number of cells traversed the membrane when expressing wild-type
      AVL9 compared to AVL9R111A or empty vector (Fig. 5 G).
  - statement: The authors conclude human AVL9 functions as a GAP.
    supporting_text: Together these results support the prediction that human AVL9 functions as a GAP
      and indicate that the role of AVL9 in cell migration of A549 cells is directly tied to its GAP activity.
  reference_review:
    relevance: HIGH
    review_notes: Full text; the peer-reviewed J Cell Biol version of the bioRxiv preprint PMID:41542567.
      The GAP biochemistry is on yeast Avl9; the human data are a catalytic-arginine mutant migration
      phenotype. The limitation is scope, not quality.
    correctness: VERIFIED
