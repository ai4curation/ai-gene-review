knowledge_gaps:
- gap_statement: Whether human AVL9 has Arf GTPase-activating activity, and against which Arf proteins,
    is unknown. The GAP activity has been measured only for yeast Avl9, in a preprint.
  boundary: 'Established: AVL9 depletion alters cell migration in several human cell lines. No Rab GEF
    activity is detectable (PMID:22595670). Yeast Avl9 is an Arf1 GAP in vitro, and human AVL9 R111A (the
    putative catalytic arginine) fails to enhance migration (PMID:41542567, preprint). Not established:
    biochemical GAP activity of human AVL9, its Arf substrate(s) in cells, or its main subcellular site
    (recycling endosome overlap vs HPA ER staining).'
  gap_kind:
