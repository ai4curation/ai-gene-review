- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: ISS
  original_reference_id: PMID:42714338
  qualifier: enables
  review:
    summary: GTPase activator activity (NEW, ISS). Yeast Avl9 has robust GAP activity toward Arf1 in vitro,
      about tenfold faster than the established Arf-GAP Age2. The predicted catalytic arginine (R116)
      is required, Rab8 recruitment enhances the activity, and the effect was confirmed in the peer-reviewed
      version (J Cell Biol 2026). In human cells, wild-type AVL9 but not the catalytic-arginine mutant
      R111A enhances migration, and the authors conclude that human AVL9 functions as a GAP. The arginine-finger
      mechanism is conserved and the human mutant phenotype tracks it, so ISS from yeast is justified.
      No biochemistry has been done on the human protein, so the Arf substrate in human cells remains
      open (see knowledge_gaps). AVL9 performs the catalytic step itself, so the activity term is appropriate.
    action: NEW
    reason: '[PMID:42714338 "We determined that Avl9 possesses robust Arf-GAP activity and is recruited
      to secretory vesicles by Rab8."] [PMID:42714338 "Under these conditions, Avl9 exhibited robust GAP
      activity towards Arf1, with a rate of 1.5 x 104 M−1s−1, which was tenfold higher than that of the
      established Arf-GAP Age2/SMAP2 (Manzer and Fromme, 2023) (Fig. 2 D)."] [PMID:42714338 "We found
      that a greater number of cells traversed the membrane when expressing wild-type AVL9 compared to
      AVL9R111A or empty vector (Fig. 5 G)."] [PMID:42714338 "Together these results support the prediction
      that human AVL9 functions as a GAP and indicate that the role of AVL9 in cell migration of A549
      cells is directly tied to its GAP activity."]'
    supported_by:
    - reference_id: PMID:42714338
      supporting_text: We determined that Avl9 possesses robust Arf-GAP activity and is recruited to secretory
        vesicles by Rab8.
    - reference_id: PMID:42714338
      supporting_text: Under these conditions, Avl9 exhibited robust GAP activity towards Arf1, with a
        rate of 1.5 x 104 M−1s−1, which was tenfold higher than that of the established Arf-GAP Age2/SMAP2
        (Manzer and Fromme, 2023) (Fig. 2 D).
    - reference_id: PMID:42714338
      supporting_text: We find that Avl9 GAP function is conserved in humans and enhances cell migration.
    - reference_id: PMID:42714338
      supporting_text: We found that a greater number of cells traversed the membrane when expressing
        wild-type AVL9 compared to AVL9R111A or empty vector (Fig. 5 G).
    - reference_id: PMID:42714338
      supporting_text: Together these results support the prediction that human AVL9 functions as a GAP
        and indicate that the role of AVL9 in cell migration of A549 cells is directly tied to its GAP
        activity.
