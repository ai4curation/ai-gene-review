suggested_questions:
- question: Which Arf/Arl GTPase does human AVL9 inactivate, and does its migration phenotype reflect
    control of Arf1 at the TGN or on post-Golgi secretory/recycling carriers?
- question: 'Where is endogenous AVL9: on the ER as HPA staining suggests, on RAB8-positive secretory
    carriers as in yeast, or on recycling endosomes as seen for the expressed protein?'
suggested_experiments:
- description: Measure GAP activity of purified human AVL9 and the R111A mutant toward ARF1-6 and ARL
    proteins, and localize endogenously tagged AVL9 relative to RAB8, ARF1 and transferrin receptor.
