  label: Homo sapiens
description: AVL9 (late secretory pathway protein AVL9 homolog) is a conserved tripartite DENN-domain
  protein. It was first described in yeast as a late-secretory (exocytosis) gene. In human cancer cell
  lines it is required for, or modulates, cell migration, and endogenous AVL9 partly overlaps recycling
  endosomes. Although grouped with DENN-domain Rab GEFs, no Rab GEF activity has been detected. A 2026
  preprint reports that yeast Avl9 is a GTPase-activating protein for Arf1, recruited to secretory vesicles
  by Rab8, and that the corresponding catalytic arginine of human AVL9 is required for its pro-migratory
  effect. In pancreatic cancer cells, AVL9 has been reported to scaffold IκBα to SKP1, promoting NF-κB
  activation.
