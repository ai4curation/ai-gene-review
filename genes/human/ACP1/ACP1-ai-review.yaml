id: P24666
gene_symbol: ACP1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACP1 encodes the cytosolic low-molecular-weight phosphotyrosine protein
  phosphatase LMW-PTP. Its main A and B splice isoforms hydrolyze phosphotyrosyl
  proteins and small phosphate monoesters with isoform-specific substrate
  preferences, whereas the C isoform lacks catalytic activity. ACP1 is soluble
  and cytoplasmic but can be recruited near the plasma membrane or bind the
  alpha II-spectrin SH3 domain through isoform-specific contacts.
