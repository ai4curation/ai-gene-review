  id: P24666-1
- name: 2 (S, B, Beta, LMPTP-B, HCPTP-B)
  id: P24666-2, P24667-1
  sequence_note: VSP_010087
- name: 3 (C, LMPTP-C)
  id: P24666-3
  sequence_note: VSP_010088
- name: '4'
  id: P24666-4
  sequence_note: VSP_054074, VSP_054075
