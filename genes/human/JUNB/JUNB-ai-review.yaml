core_functions:
- description: JUNB is a Jun-family AP-1 bZIP subunit that binds AP-1 DNA in FOS-, ATF- or BATF-containing dimers; its
    AP-1 activity overlaps with c-Jun but is partner- and promoter-dependent and can counterbalance c-Jun/Fos
    transcriptional outputs.
