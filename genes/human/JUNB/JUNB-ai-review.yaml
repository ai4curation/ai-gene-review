id: P17275
gene_symbol: JUNB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'JUNB encodes JunB, a nuclear Jun-family bZIP transcription factor that dimerizes with FOS-, ATF-, BATF-, and
  other bZIP partners in AP-1 complexes. It binds AP-1 cis-regulatory motifs in chromatin and regulates RNA polymerase II
  transcription in immediate-early, cytokine, steroid-response, and cell-proliferation programs.'
existing_annotations:
- term:
    id: GO:0000785
    label: chromatin
  evidence_type: ISA
  original_reference_id: GO_REF:0000113
  qualifier: located_in
  supporting_entities:
  - tfclass:1.1.1
  review:
    summary: chromatin is consistent with the nuclear chromatin-associated AP-1 DNA-binding mechanism.
    action: ACCEPT
    reason: This TFClass ISA row places class 1.1.1 sequence-specific Jun bZIP factors on chromatin; that
      inference is consistent with JunB acting as a nuclear AP-1 factor rather than with a separate non-core
      location.
- term:
    id: GO:0000785
    label: chromatin
  evidence_type: TAS
  original_reference_id: PMID:2513129
  qualifier: located_in
  review:
    summary: chromatin is consistent with the nuclear chromatin-associated AP-1 DNA-binding mechanism.
    action: ACCEPT
    reason: The cached PMID:2513129 abstract supports human JunB as an AP-1 trans-activating factor but does
      not independently assay chromatin; the legacy TAS row is retained because it matches the direct AP-1
      DNA-regulatory mechanism and the paired TFClass chromatin inference.
- term:
    id: GO:0000977
    label: RNA polymerase II transcription regulatory region sequence-specific DNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P09450
  - ensembl:ENSMUSP00000064680
  review:
    summary: RNA polymerase II transcription regulatory region sequence-specific DNA binding is correct but less
      specific than AP-1 Pol II cis-regulatory DNA binding.
    action: MODIFY
    reason: The evidence supports sequence-specific AP-1 binding in RNA polymerase II regulatory DNA, so the generic
      DNA-binding or generic transcription-factor term should be refined to RNA polymerase II cis-regulatory region
      sequence-specific DNA binding.
    supported_by:
