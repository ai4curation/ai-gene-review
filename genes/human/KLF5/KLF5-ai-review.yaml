- term:
    id: GO:0008284
    label: positive regulation of cell population proliferation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:F1LSL7
  - ensembl:ENSRNOP00000054653
  review:
    summary: positive regulation of cell population proliferation is a supported but context-dependent KLF5
      output.
    action: KEEP_AS_NON_CORE
    reason: The rat Ensembl donor is coded as expression evidence, but PMID:14726538 directly showed that KLF5
      expression in non-transformed intestinal epithelial cells enhances colony formation, cyclin D1 transcription
      and cell growth. This supports a context-dependent pro-proliferative output that is downstream of KLF5's
      core transcription-factor activity.
    supported_by:
    - reference_id: PMID:14726538
      supporting_text: expression of KLF5 in non-transformed intestinal epithelial cells (ileal
        IEC-18 and Immorto-Min Colon Epithelial (IMCE) cells) enhances colony formation, cyclin
        D1 transcription, and cell growth
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:F1LSL7
        source_label: rat Klf5
        source_status: SUPPORTS_TRANSFER
        comment: The current rat donor is an IEP row to GO:0008284 from PMID:14726538, whose
          abstract reports KLF5 gain-of-function cell-growth evidence in non-transformed intestinal
          epithelial cells.
