suggested_questions:
- question: Which GO term most precisely distinguishes the mammalian FKRP second ribitol-phosphate transfer
    onto a glycopeptide-linked tandem repeat from ribitol-phosphate polymer extension? The existing GO:0016780
    is accurate; GO:0047356 needs chemical and ontology assessment before substitution.
- question: Under which native cellular conditions does FKRP form tetramers rather than catalytically
    competent protomer pairs, and which metal supports its Golgi activity in cells?
- question: How do endogenous human rough-ER, Golgi and any extracellular or sarcolemmal pools vary by
    tissue and developmental state, and does catalysis occur outside the Golgi?
