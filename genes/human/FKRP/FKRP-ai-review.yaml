id: Q9H9S5
gene_symbol: FKRP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FKRP is a Golgi membrane ribitol-phosphate transferase that extends the phosphorylated core
  M3 O-mannosyl glycan of alpha-dystroglycan. It transfers a second ribitol-phosphate unit from CDP-ribitol
  onto the ribitol-phosphate previously installed by fukutin, forming the tandem linker required for subsequent
  assembly of the matrix-binding matriglycan chain. Its luminal catalytic and stem domains cooperate across
  a protomer pair to recognize the glycan acceptor. FKRP associates with fukutin and RXYLT1 in an enzymatically
  active complex. Impaired FKRP activity disrupts functional dystroglycan glycosylation and causes a spectrum
  of recessive muscular dystrophies.
