core_functions:
- description: Transfers ribitol-phosphate from CDP-ribitol to the first ribitol-phosphate on the phosphorylated
    core M3 O-mannosyl glycan of alpha-dystroglycan, forming the tandem linker used for subsequent matriglycan
    assembly. Acceptor recognition uses cooperating stem and catalytic domains from a protomer pair in
    the Golgi-associated enzyme.
  molecular_function:
    id: GO:0016780
    label: phosphotransferase activity, for other substituted phosphate groups
  directly_involved_in:
  - id: GO:0035269
    label: protein O-linked glycosylation via mannose
  locations:
  - id: GO:0000139
    label: Golgi membrane
  in_complex:
    id: GO:1902494
    label: catalytic complex
