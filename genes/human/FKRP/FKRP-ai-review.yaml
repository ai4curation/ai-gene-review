    reason: In PMID:25279699, FKRP-deficient human patient fibroblasts retain DGFc340 phosphorylation
      yet fail to acquire the functional glycan upon LARGE overexpression. This places FKRP downstream
      of core phosphorylation and before LARGE-dependent maturation. Its independently demonstrated ribitol-phosphate
      transfer supplies the actual biochemical step supporting process participation; the IMP phenotype
      alone is not the sole rationale.
    supported_by:
    - reference_id: PMID:25279699
    - reference_id: PMID:31949166
    - reference_id: file:human/FKRP/FKRP-source-evidence.md
