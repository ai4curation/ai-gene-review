- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:28890335
  qualifier: enables
  supporting_entities:
  - UniProtKB:P16615
  review:
    summary: IPI with ATP2A2/SERCA2. The paper describes PLN as part of the SERCA inhibitory complex that VMP1 prevents
      from forming.
    action: MODIFY
    reason: The interaction with SERCA2 is the basis of PLN's core activity. Bare protein binding is uninformative;
      the cited work frames the PLN-SERCA interaction as an inhibitory complex, so ATPase inhibitor activity is
      the informative MF.
    proposed_replacement_terms:
    - id: GO:0042030
      label: ATPase inhibitor activity
    supported_by:
    - reference_id: PMID:28890335
      supporting_text: VMP1 interacts with SERCA and prevents formation of the SERCA/PLN/SLN inhibitory complex.
    - reference_id: PMID:23996003
      supporting_text: In cardiac muscle, SERCA is regulated by phospholamban (PLB), a small inhibitory phosphoprotein
        that decreases the Ca(2+) affinity of SERCA and attenuates contractile strength.
