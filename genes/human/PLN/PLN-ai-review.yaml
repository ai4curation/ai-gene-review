- term:
    id: GO:0002026
    label: regulation of the force of heart contraction
  evidence_type: IC
  original_reference_id: PMID:19708671
  qualifier: involved_in
  supporting_entities:
  - GO:0042030
  review:
    summary: PLN sets basal cardiac contractility via SERCA2a inhibition; inferred by curator from ATPase inhibitor
      activity.
    action: ACCEPT
    reason: 'Well established physiological role: PLN-null hearts show enhanced contractility and phosphorylation
      relief of PLN underlies beta-adrenergic inotropy.'
    additional_reference_ids:
    - PMID:8062415
    - PMID:22679139
    supported_by:
    - reference_id: PMID:8062415
      supporting_text: These findings indicate that phospholamban acts as a critical repressor of basal myocardial
        contractility
    - reference_id: PMID:22679139
      supporting_text: Cyclic AMP-dependent phosphorylation of PLN reverses its inhibitory effect on the Ca2+ pump.
- term:
    id: GO:0004857
    label: enzyme inhibitor activity
  evidence_type: ISS
  original_reference_id: PMID:12032137
  qualifier: enables
  supporting_entities:
  - UniProtKB:P61015
  review:
    summary: ISS from rabbit PLN (P61015), SERCA inhibition in HEK-293 co-expression.
    action: MODIFY
    reason: Correct but too general. The enzyme PLN inhibits is the SERCA Ca2+-ATPase; ATPase inhibitor activity
      is the precise term already carried by IBA and IDA.
    proposed_replacement_terms:
    - id: GO:0042030
      label: ATPase inhibitor activity
    supported_by:
    - reference_id: PMID:12032137
      supporting_text: NF-SLN binds directly to PLN and that NF-SLN inhibits the formation of PLN pentamers.
    - reference_id: PMID:19708671
      supporting_text: Only three steps in the reaction scheme were affected by the presence of PLB, namely, binding
        of the first calcium ion, a subsequent conformational change in SERCA, and binding of the second calcium
        ion.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:15598648
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q09013
  review:
    summary: Co-IP of PLN with DMPK; DMPK phosphorylates PLN.
    action: REMOVE
    reason: PLN is the kinase substrate here. Bare protein binding adds no information about PLN's own activity
      (the substrate relationship belongs on DMPK). Removal does not imply the interaction is false.
    supported_by:
    - reference_id: PMID:15598648
      supporting_text: DMPK expression in cardiac myocytes is highly enriched in the sarcoplasmic reticulum (SR)
        where it colocalizes with the ryanodine receptor and phospholamban (PLN)
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:24722188
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q5T700
  review:
    summary: High-throughput binary interaction screen (PMID:24722188) reporting PLN binding a partner with no known
      role in SERCA regulation.
    action: REMOVE
    reason: Generic protein binding from a high-throughput Y2H-type screen is uninformative. PLN is a hydrophobic
      single-pass TM peptide; most partners in these screens (EDA, BCL2L13, LDLRAD1, TMEM and SLC proteins) are
      unrelated membrane proteins without a demonstrated physiological link. Removal does not mean the interactions
      are false.
