core_functions:
- description: 'Reversible inhibitor of the SERCA2a Ca2+ pump in the cardiac SR membrane: monomeric, unphosphorylated
    PLN binds the SERCA transmembrane groove and lowers its apparent Ca2+ affinity, limiting Ca2+ re-uptake into
    the SR and thereby setting basal relaxation and contractility; PKA/CaMKII phosphorylation relieves inhibition.'
  molecular_function:
    id: GO:0042030
    label: ATPase inhibitor activity
  directly_involved_in:
  - id: GO:1902081
    label: negative regulation of calcium ion import into sarcoplasmic reticulum
  - id: GO:1901895
    label: negative regulation of ATPase-coupled calcium transmembrane transporter activity
  locations:
  - id: GO:0033017
    label: sarcoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:19708671
    supporting_text: Only three steps in the reaction scheme were affected by the presence of PLB, namely, binding
      of the first calcium ion, a subsequent conformational change in SERCA, and binding of the second calcium ion.
  - reference_id: PMID:23996003
    supporting_text: In cardiac muscle, SERCA is regulated by phospholamban (PLB), a small inhibitory phosphoprotein
      that decreases the Ca(2+) affinity of SERCA and attenuates contractile strength.
  - reference_id: PMID:23996003
    supporting_text: The two high affinity Ca 2+ -binding sites (sites I and II) of SERCA, which are formed between
      transmembrane helices M4, M5, M6, and M8 near the cytoplasmic membrane interface ( 26 ), are both severely
      disrupted by PLB4 binding.
  - reference_id: PMID:22679139
    supporting_text: Cyclic AMP-dependent phosphorylation of PLN reverses its inhibitory effect on the Ca2+ pump.
  - reference_id: PMID:8062415
    supporting_text: These findings indicate that phospholamban acts as a critical repressor of basal myocardial
      contractility
- description: Self-assembles into a homopentamer held by a transmembrane leucine/isoleucine zipper; the pentamer
    is a less active reservoir, and phosphorylation favors pentamer assembly.
  molecular_function:
    id: GO:0042802
    label: identical protein binding
  in_complex:
    id: GO:1990629
    label: phospholamban complex
  locations:
  - id: GO:0033017
    label: sarcoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:16043693
    supporting_text: Human phospholamban (PLN), expressed in the sarcoplasmic reticulum membrane as a 30-kDa homopentamer,
      controls cellular calcium levels by a mechanism that depends on its phosphorylation.
  - reference_id: PMID:16043693
    supporting_text: The unusual bellflower-like assembly is held together by leucine/isoleucine zipper motifs along
      the membrane-spanning helices.
  - reference_id: PMID:22679139
    supporting_text: Phosphorylation of PLN monomers promotes association into inactive pentamers.
suggested_questions:
- question: Should SERCA-inhibiting regulins (PLN, SLN, MRLN, ERLN) be annotated consistently to ATPase inhibitor
    activity (GO:0042030), transporter inhibitor activity (GO:0141110), or both? PLN currently carries both by IDA
    from the same paper, while DWORF carries transporter activator activity (GO:0141109). A single convention, possibly
    a dedicated 'calcium-transporting ATPase inhibitor activity' child, would make the family comparable.
- question: Does the PLN pentamer's cation channel activity observed in giant vesicles occur in native SR membranes,
    and does it have a physiological role?
- question: Is PLN present in mitochondrial membranes in human muscle, or is the proteomic detection SR carry-over?
suggested_experiments:
- hypothesis: The PLN pentamer forms a functional cation channel in native SR membranes.
  description: Compare SR vesicle K+/Cs+ permeability and single-channel recordings from wild-type versus monomeric
    (pentamer-disrupting TM zipper mutant) PLN knock-in cardiomyocytes.
  experiment_type: electrophysiology
