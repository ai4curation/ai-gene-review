  review:
    summary: 'ATPase inhibitor activity: PLN binds SERCA2a and lowers its apparent Ca2+ affinity.'
    action: ACCEPT
    reason: Core molecular function. Reconstitution, structure and genetic data show that monomeric PLN binds the
      SERCA transmembrane groove and inhibits Ca2+ binding; inhibition is reversed by phosphorylation.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002722410
        source_status: SUPPORTS_TRANSFER
        comment: Regulin node; SERCA inhibition is the defining activity of PLN and its orthologs.
      - source_id: UniProtKB:P26678
        source_label: PLN
        source_status: SUPPORTS_TRANSFER
        comment: Human PLN's own IDA (PMID:19708671) is among the descendant evidence; expected, not circular.
    supported_by:
    - reference_id: PMID:19708671
      supporting_text: Only three steps in the reaction scheme were affected by the presence of PLB, namely, binding
        of the first calcium ion, a subsequent conformational change in SERCA, and binding of the second calcium
        ion.
    - reference_id: PMID:23996003
      supporting_text: In cardiac muscle, SERCA is regulated by phospholamban (PLB), a small inhibitory phosphoprotein
        that decreases the Ca(2+) affinity of SERCA and attenuates contractile strength.
    - reference_id: PMID:23996003
      supporting_text: The two high affinity Ca 2+ -binding sites (sites I and II) of SERCA, which are formed between
        transmembrane helices M4, M5, M6, and M8 near the cytoplasmic membrane interface ( 26 ), are both severely
        disrupted by PLB4 binding.
    - reference_id: PMID:22679139
      supporting_text: Cyclic AMP-dependent phosphorylation of PLN reverses its inhibitory effect on the Ca2+ pump.
