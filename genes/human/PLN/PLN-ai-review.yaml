- term:
    id: GO:0006816
    label: calcium ion transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P61016
  - ensembl:ENSRNOP00000105613
  review:
    summary: 'IEA from rat: calcium ion transport.'
    action: MODIFY
    reason: PLN does not itself transport Ca2+ (the pentamer channel reported in vesicles does not conduct Ca2+);
      it negatively regulates SERCA-mediated Ca2+ import into the SR.
    proposed_replacement_terms:
    - id: GO:1902081
      label: negative regulation of calcium ion import into sarcoplasmic reticulum
    supported_by:
    - reference_id: PMID:19708671
      supporting_text: Only three steps in the reaction scheme were affected by the presence of PLB, namely, binding
        of the first calcium ion, a subsequent conformational change in SERCA, and binding of the second calcium
        ion.
    - reference_id: PMID:26673394
      supporting_text: highlight a preference for Cs(+) over K(+) and do not conduct Ca(2+).
