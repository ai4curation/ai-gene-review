  - ensembl:ENSMUSP00000045709
  review:
    summary: 'Mouse-derived transfer: PLN cleaved by SPPL2C in elongated spermatids, affecting Ca2+ homeostasis.'
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The mouse data (UniProt: ''Controls intracellular Ca(2+) levels in elongated spermatids'', by similarity
      to P61014) make PLN a substrate of SPPL2C whose clearance affects Ca2+; this is an indirect role, not participation
      in acrosome assembly, and nothing is known for human testis.'
