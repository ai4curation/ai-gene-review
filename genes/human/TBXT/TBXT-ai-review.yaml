  title: Brachyury and related Tbx proteins interact with the Mixl1 homeodomain protein and negatively
    regulate Mixl1 transcriptional activity.
  findings:
  - statement: Brachyury binds the Mixl1 homeodomain and represses Mixl1 transactivation.
    supporting_text: luciferase reporter experiments indicated that association of Mixl1 with Brachyury
      and related T-box factors inhibited the transactivating potential of Mixl1 on the Gsc and Pdgfrα
      promoters.
  - statement: Brachyury is a transcriptional activator expressed in nascent mesoderm, tailbud and notochord.
    supporting_text: Brachyury (T), the founding member of the T-box (Tbx) family, is a transcriptional
      activator and is expressed throughout the nascent mesoderm, tailbud and notochord
