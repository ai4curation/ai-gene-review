- description: 'Sequence-specific DNA-binding transcription activator: the T-box domain binds T-site elements
    in RNA polymerase II cis-regulatory regions and activates target genes (e.g. MESP1). The DNA-binding
    motif is conserved back to the unicellular relative Capsaspora, so this activity is ancestral (pre-metazoan).'
