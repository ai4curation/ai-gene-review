id: O15178
gene_symbol: TBXT
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TBXT (Brachyury, T) is the founding member of the T-box family of sequence-specific transcription
  factors. Its N-terminal T-box domain binds a palindromic T-site DNA motif in cis-regulatory regions,
  and the protein acts in the nucleus mainly as a transcriptional activator of RNA polymerase II target
  genes, such as MESP1 in early cardiovascular progenitors. It can also bind other developmental transcription
  factors such as the homeodomain protein MIXL1 and dampen their activity. TBXT is expressed in the primitive
  streak, nascent mesoderm, tailbud and notochord and is required for posterior mesoderm formation, axial
  elongation and notochord development; loss-of-function variants cause sacral agenesis with vertebral
  anomalies, and duplication or overexpression is associated with chordoma and other tumours. Brachyury
  is the oldest T-box class: orthologs exist in the unicellular filasterean Capsaspora owczarzaki, in
  ichthyosporeans and in early-branching fungi (they have been lost from choanoflagellates), and the Capsaspora
  protein binds a near-identical DNA motif, whereas the restricted, cofactor-dependent target specificity
  of Brachyury arose with animals.'
