suggested_questions:
- question: What is the endogenous function of Brachyury in the unicellular Capsaspora owczarzaki, which
    has no mesoderm or blastopore? Does it regulate a life-cycle transition (e.g. aggregative stage),
    and which genes does it bind in vivo?
- question: Which cofactors (e.g. Smad1) and which N- and C-terminal features confer the restricted target
    specificity of metazoan Brachyury that Capsaspora Brachyury lacks, and can they be mapped onto human
    TBXT?
- question: Should IBA process terms on the Brachyury clade (mesoderm formation, somitogenesis, heart
    morphogenesis) be placed at a Metazoa-or-later node, so that they do not propagate to Capsaspora or
    ichthyosporean Brachyury orthologs?
- question: Is the corepressor activity of Brachyury toward MIXL1 seen at endogenous levels in human primitive-streak-like
    cells, or only under overexpression?
suggested_experiments:
- description: ChIP-seq or CUT&RUN of endogenous Capsaspora Brachyury across its life stages, compared
    with human TBXT ChIP-seq in mesoderm-differentiating hESCs, to test whether shared motif binding translates
    into overlapping targets.
  hypothesis: Capsaspora Brachyury binds T-sites broadly without the restricted, cofactor-dependent target
    set of human TBXT.
- description: Domain-swap chimeras of human TBXT and Capsaspora Brachyury expressed in TBXT-null hESC-derived
    mesoderm, with RNA-seq readout.
  hypothesis: Human N- and C-terminal regions, not the T-box, confer human-like target specificity.
