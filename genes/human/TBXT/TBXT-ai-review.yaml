  title: 'Brachyury, a driver of the epithelial-mesenchymal transition, is overexpressed in human lung
    tumors: an opportunity for novel interventions against lung cancer.'
  findings:
  - statement: Brachyury is nuclear in human lung tumour cells.
    supporting_text: a single band at the expected molecular weight was observed in nuclear fractions
      derived from the primary tumor of two lung cancer patients evaluated
- id: PMID:24253444
  title: Mutations in the T (brachyury) gene cause a novel syndrome consisting of sacral agenesis, abnormal
    ossification of the vertebral bodies and a persistent notochordal canal.
  findings:
  - statement: Homozygous T-box H171R reduces DNA binding and causes sacral agenesis with persistent notochordal
      canal.
    supporting_text: The homozygous mutation results in diminished DNA binding, increased cell growth,
      and interferes with the normal expression of genes involved in ossification, notochord maintenance
      and axial mesoderm development.
