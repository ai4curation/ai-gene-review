  title: Impact of cytosine methylation on DNA binding specificities of human transcription factors.
  findings: []
- id: PMID:8963900
  title: The human homolog T of the mouse T(Brachyury) gene; gene structure, cDNA sequence, and assignment
    to chromosome 6q27.
  findings:
  - statement: T is required for posterior mesoderm and axial development; mouse mutants have abnormal
      notochord and posterior somites.
    supporting_text: Brachyury mutant mice, which lack T protein, die in utero with abnormal notochord,
      posterior somites, and allantois.
- id: PMID:24043797
  title: Early evolution of the T-box transcription factor family.
  findings:
  - statement: Brachyury is the most ancient T-box class; the family diversified at the origin of Metazoa.
    supporting_text: Our data confirm that Brachyury is the most ancient member of the T-box family and
      establish that the T-box family diversified at the onset of Metazoa.
  - statement: No T-box genes in sequenced choanoflagellates; interpreted as secondary loss.
    supporting_text: We did not identify T-box genes in either of the two sequenced choanoflagellates
      (the colonial Salpingoeca rosetta and the unicellular Monosiga brevicollis ), confirming that T-box
      genes were also lost in this group ( 16 ).
  - statement: Capsaspora Brachyury partially rescues dominant-negative XBra in Xenopus.
    supporting_text: Our data show that C. owczarzaki Brachyury ( CoBra ) can partially rescue Xenopus
      laevis embryos injected with a dominant negative XBra construct.
  - statement: Capsaspora Brachyury lacks the target specificity of metazoan Brachyury.
    supporting_text: Through experiments in Xenopus , we demonstrate that C. owczarzaki Brachyury lacks,
      however, the target specificity displayed by metazoan Brachyury homologs, including sponges.
  - statement: Capsaspora Brachyury DNA-binding motif resembles mouse T.
    supporting_text: Our results indicate that CoBra has a highly similar motif to that determined in
      the mouse Bra-homolog, called T ( Fig. 4 ) ( 28 , 34 – 36 ).
