core_functions:
- description: Activated factor IXa cleaves factor X to generate Xa, performing the
    protease step of intrinsic tenase. FVIIIa enhances this reaction as a cofactor,
    whereas FIXa supplies the catalytic activity and can also hydrolyze a peptide
    substrate without FVIIIa. Calcium coordination and Gla-domain-dependent association
    with extracellular phospholipid surfaces support assembly of the catalytic complex.
    These properties form one coagulation activity unit; calcium binding is not a
    separate catalytic reaction. The tested activated enzyme and its processing chains
    are distinct from the unactivated precursor, engineered variants and the natural
    deletion product.
  molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  directly_involved_in:
