  review:
    summary: The resolved FIX glycan-acceptor interaction with XXYLT1 is supported but
      non-core.
    action: KEEP_AS_NON_CORE
    reason: 'PMID:26414444 directly resolves a human FIX EGF-repeat glycan acceptor bound
      to mouse XXYLT1, matching the imported mouse Q3U4G3 partner. The FIX fragment was expressed
      in E. coli and enzymatically modified; the XXYLT1 ectodomain was expressed in HEK293T
      and trimmed for crystallography. A stable purified binary complex was also demonstrated
      before crystallization. Thus the physical interaction is supported. Although the literal
      enzyme-binding definition encompasses contact with a catalytic protein, replacing generic
      binding with GO:0019899 would add little functional information here: FIX is the glycan-bearing
      substrate, while XXYLT1 performs xylose transfer. Under the explicit campaign exception
      for supported generic binding, retain the original assertion as non-core rather than
      remove a demonstrated interaction. No glycosyltransferase activity, glycosylation-process
      participation or regulatory effect on XXYLT1 is assigned to FIX, and this fragment is
      not equated with either intact natural product.'
    supported_by:
    - reference_id: PMID:26414444
