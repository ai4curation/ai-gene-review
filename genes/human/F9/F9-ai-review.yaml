suggested_questions:
- question: Is the natural 423-residue F9 product expressed as a stable endogenous
    protein, and how do its secretion, activation and FVIIIa-dependent FX cleavage
    compare with the displayed 461-residue precursor?
- question: Do the observed extracellular-matrix and EPS-urine exosome fractions contain
    a specifically retained FIX pool, and which natural product and activation state
    account for the detected peptides?
suggested_experiments:
- description: Establish endogenous expression of the deletion product with
    splice-junction RNA measurements and product-discriminating peptides, then compare
    sequence-verified natural coding sequences in the same expression system. Measure
    secretion, gamma-carboxylation, activation cleavage, direct peptide hydrolysis and
    FX activation with matched FVIIIa, calcium and phospholipid conditions. Include
    precursor, activated-enzyme and catalytic-site controls.
- description: Analyze matched human plasma, extracellular-matrix extracts and EPS-urine
    vesicle fractions with FIX-specific targeted proteomics, fraction-purity markers and
    processing-state assays. Use wash, exchange and protease-protection controls to
    distinguish soluble carryover, extracellular association and vesicle enclosure, and
    require product-discriminating peptides before assigning either natural isoform.
