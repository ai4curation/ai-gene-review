id: P00740
gene_symbol: F9
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: F9 encodes coagulation factor IX, a secreted, vitamin K-dependent plasma
  glycoprotein synthesized as a zymogen. Proteolytic activation produces factor IXa, a
  serine endopeptidase that converts factor X to Xa. Calcium-dependent membrane
  association and binding to the nonenzymatic cofactor factor VIIIa organize the
  intrinsic-tenase reaction on extracellular phospholipid surfaces, supporting thrombin
  generation and blood coagulation. Its gamma-carboxyglutamate-rich domain binds
  calcium, while the activated protease supplies the catalytic activity. Pathogenic F9
  deficiency causes hemophilia B. A shorter natural splice product lacks an EGF-like
  segment and remains distinct from the proteolytically generated light and heavy chains
  of activated FIX.
