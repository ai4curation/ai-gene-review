suggested_questions:
- question: Does ESD loss raise cellular formaldehyde or S-formylglutathione in human cells, or is formate
    release rate-limited elsewhere?
- question: Does ESD hydrolyze other S-acylglutathione or carboxylic esters in vivo?
suggested_experiments:
- description: Knock out ESD in human cell lines (alone and with ALDH2 loss) and measure S-formylglutathione,
    formaldehyde-induced DNA damage and survival after formaldehyde exposure.
