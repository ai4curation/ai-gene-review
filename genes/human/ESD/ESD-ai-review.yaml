  label: Homo sapiens
description: ESD (esterase D, S-formylglutathione hydrolase) is a cytosolic homodimeric serine hydrolase
  of the alpha/beta-hydrolase fold, with a Ser153-His264-Asp230 catalytic triad. It hydrolyzes S-formylglutathione,
  produced from formaldehyde and glutathione by the class III alcohol dehydrogenase ADH5, to formate and
  glutathione, completing glutathione-dependent formaldehyde detoxification. The classical esterase D
  polymorphism, assayed with 4-methylumbelliferyl acetate in red cells, was shown to be the same protein
  as S-formylglutathione hydrolase; ESD is widely expressed and served as a genetic marker for the retinoblastoma
  locus on 13q14.
