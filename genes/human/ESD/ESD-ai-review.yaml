- term:
    id: GO:0005788
    label: endoplasmic reticulum lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-5693724
  qualifier: located_in
  review:
    summary: Reactome places the ESD dimer reaction in the ER lumen "of red blood cells".
    action: REMOVE
    reason: Demonstrably wrong location. Mature red blood cells have no endoplasmic reticulum, ESD has
      no signal peptide, and its substrate S-formylglutathione is made in the cytosol by ADH5; direct
      (HPA) and phylogenetic evidence place ESD in the cytosol.
    supported_by:
    - reference_id: Reactome:R-HSA-5693724
      supporting_text: S-formylglutathione hydrolase (ESD, esterase D) is a homodimeric enzyme in the
        ER lumen of red blood cells
    source_defects:
    - defect_type: WRONG_TERM
      resource: REACTOME
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0005788
      corrected_value: GO:0005829
      confidence: PROBABLE
      explanation: R-HSA-5693724 locates the ESD reaction in the ER lumen of red blood cells, which lack
        an ER; ESD is a cytosolic protein without a signal peptide, and the reaction should be placed
        in the cytosol.
