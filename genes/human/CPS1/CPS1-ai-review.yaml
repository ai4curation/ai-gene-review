suggested_questions:
- question: Which alternative CPS1 products are imported into mitochondria and retain coupled ammonia-dependent
    activity?
- question: Does human CPS1 participate in a defined glutamine-metabolic pathway beyond using ammonia
    that may derive from glutamine, and how should the ancestral PAINT process assertion be scoped?
- question: Which reported extra-mitochondrial pools and fragment activities occur endogenously in humans,
    and which reflect specific preparations or disease contexts?
suggested_experiments:
- description: Compare the three sequence-verified products for expression, mitochondrial import/processing
    and NAG-dependent coupled carbamoyl-phosphate synthesis; distinguish mature-enzyme constructs from
    registered splice products.
