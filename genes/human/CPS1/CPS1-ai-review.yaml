id: P31327
gene_symbol: CPS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CPS1 is a mitochondrial ammonia-dependent carbamoyl-phosphate synthetase. It uses two ATP
  molecules to combine ammonia and bicarbonate into carbamoyl phosphate, supplying the first synthetic
  step of hepatic ureagenesis and an upstream precursor for intestinal citrulline production. N-acetylglutamate
  activates the enzyme through a C-terminal allosteric pocket, and catalysis requires magnesium and potassium.
  Its ancestral glutaminase-like region does not confer the glutamine-hydrolyzing reaction of CAD or bacterial
  two-subunit synthetases. CPS1 deficiency impairs nitrogen disposal and causes hyperammonemia. Additional
  cellular pools and context-dependent functions, including support of pyrimidine synthesis in particular
  lung cancers, coexist with its principal mitochondrial metabolic role.
