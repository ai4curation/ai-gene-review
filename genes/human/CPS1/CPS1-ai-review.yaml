core_functions:
- description: CPS1 catalyzes ATP-dependent synthesis of carbamoyl phosphate from ammonia and bicarbonate
    in the mitochondrial matrix, providing the first synthetic step of the hepatic urea cycle. N-acetylglutamate
    allosterically activates the reaction, with magnesium and potassium supporting catalysis. This core
    describes the established enzyme and does not assert equivalent import or catalytic competence of
    every alternative product.
  molecular_function:
    id: GO:0004087
    label: carbamoyl-phosphate synthase (ammonia) activity
  directly_involved_in:
  - id: GO:0070409
    label: carbamoyl phosphate biosynthetic process
  - id: GO:0000050
    label: urea cycle
  locations:
