    supporting_text: N-acetyl-L-glutamate (NAG) as essential activator
  - reference_id: PMID:23649895
    supporting_text: "The kinetic and molecular properties of recombinant CPS1 are essentially \nthe same\
      \ as for natural human CPS1."
  substrates:
