      - 'DISEASE: 2,4-dienoyl-CoA reductase deficiency (DECRD) [MIM:616034]: A rare, autosomal recessive, inborn error of polyunsaturated fatty
        acids and lysine metabolism, resulting in mitochondrial dysfunction. Affected individuals have a severe encephalopathy with neurologic
        and metabolic abnormalities beginning in early infancy. Laboratory studies show increased C10:2 carnitine levels and hyperlysinemia. {ECO:0000269|PubMed:24847004}.
        Note=The protein represented in this entry is involved in disease pathogenesis. A selective decrease in mitochondrial NADP(H) levels due
        to NADK2 mutations causes a deficiency of NADPH-dependent mitochondrial enzymes, such as DECR1 and AASS. {ECO:0000269|PubMed:24847004}.;DISEASE:
        Hyperlysinemia, 1 (HYPLYS1) [MIM:238700]: An autosomal recessive metabolic condition with variable clinical features. Some patients present
        with non-specific seizures, hypotonia, or mildly delayed psychomotor development, and increased serum lysine and pipecolic acid on laboratory
        analysis. However, about half of the probands are reported to be asymptomatic, and hyperlysinemia is generally considered to be a benign
        metabolic variant. {ECO:0000269|PubMed:10775527}. Note=The disease is caused by mutations affecting the gene represented in this entry.
        In hyperlysinemia 1, both enzymatic functions of AASS are defective and patients have increased serum lysine and possibly increased saccharopine.
        Some individuals, however, retain significant amounts of lysine-ketoglutarate reductase and present with saccharopinuria, a metabolic
        condition with few, if any, clinical manifestations. {ECO:0000305|PubMed:463877}.'
