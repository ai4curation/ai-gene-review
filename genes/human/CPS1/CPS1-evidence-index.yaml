      isObsolete: false
      name: 14-3-3 protein binding
      definition:
        text: 'Binding to a 14-3-3 protein. A 14-3-3 protein is any of a large family of approximately 30kDa acidic proteins which exist primarily
          as homo- and heterodimers within all eukaryotic cells, and have been implicated in the modulation of distinct biological processes by
          binding to specific phosphorylated sites on diverse target proteins, thereby forcing conformational changes or influencing interactions
          between their targets and other molecules. Each 14-3-3 protein sequence can be roughly divided into three sections: a divergent amino
          terminus, the conserved core region and a divergent carboxy-terminus. The conserved middle core region of the 14-3-3s encodes an amphipathic
          groove that forms the main functional domain, a cradle for interacting with client proteins.'
        xrefs:
        - dbCode: PMID
          dbId: '15167810'
