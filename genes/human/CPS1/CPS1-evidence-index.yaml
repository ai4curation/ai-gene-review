        text: 'Binding to a 14-3-3 protein. A 14-3-3 protein is any of a large family of approximately 30kDa acidic proteins which exist primarily
          as homo- and heterodimers within all eukaryotic cells, and have been implicated in the modulation of distinct biological processes by
          binding to specific phosphorylated sites on diverse target proteins, thereby forcing conformational changes or influencing interactions
