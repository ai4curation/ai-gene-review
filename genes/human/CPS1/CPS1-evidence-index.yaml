      - 'DISEASE: Combined oxidative phosphorylation deficiency 8 (COXPD8) [MIM:614096]: A mitochondrial disease characterized by a lethal infantile
        hypertrophic cardiomyopathy, generalized muscle dysfunction and some neurologic involvement. The liver is not affected. {ECO:0000269|PubMed:21549344}.
        Note=The disease is caused by mutations affecting the gene represented in this entry.;DISEASE: Leukoencephalopathy, progressive, with
        ovarian failure (LKENP) [MIM:615889]: An autosomal recessive neurodegenerative disorder characterized by childhood- to adulthood-onset
        of signs of neurologic deterioration consisting of ataxia, spasticity, and cognitive decline with features of frontal lobe dysfunction.
        Brain MRI shows leukoencephalopathy with striking involvement of deep white matter, and cerebellar atrophy. All female patients develop
        premature ovarian failure. {ECO:0000269|PubMed:24808023}. Note=The disease is caused by mutations affecting the gene represented in this
        entry.'
