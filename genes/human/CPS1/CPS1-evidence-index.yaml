      - 'DISEASE: Carbamoyl phosphate synthetase 1 deficiency (CPS1D) [MIM:237300]: An autosomal recessive disorder of the urea cycle causing
        hyperammonemia. It can present as a devastating metabolic disease dominated by severe hyperammonemia in neonates or as a more insidious
        late-onset condition, generally manifesting as life-threatening hyperammonemic crises under catabolic situations. Clinical features include
        protein intolerance, intermittent ataxia, seizures, lethargy, developmental delay and mental retardation. {ECO:0000269|PubMed:11388595,
        ECO:0000269|PubMed:11474210, ECO:0000269|PubMed:12655559, ECO:0000269|PubMed:12955727, ECO:0000269|PubMed:15164414, ECO:0000269|PubMed:15617192,
        ECO:0000269|PubMed:16737834, ECO:0000269|PubMed:17310273, ECO:0000269|PubMed:20578160, ECO:0000269|PubMed:21120950, ECO:0000269|PubMed:22173106,
        ECO:0000269|PubMed:23649895, ECO:0000269|PubMed:24813853, ECO:0000269|PubMed:26440671, ECO:0000269|PubMed:9711878}. Note=The disease is
        caused by mutations affecting the gene represented in this entry.;DISEASE: Pulmonary hypertension, neonatal (PHN) [MIM:615371]: A disease
        characterized by elevated pulmonary artery pressure. Pulmonary hypertension in the neonate is associated with multiple underlying problems
        such as respiratory distress syndrome, meconium aspiration syndrome, congenital diaphragmatic hernia, bronchopulmonary dysplasia, sepsis,
        or congenital heart disease. {ECO:0000269|PubMed:11407344}. Note=Disease susceptibility is associated with variations affecting the gene
        represented in this entry. CPS1 variants influence the availability of precursors for nitric oxide (NO) synthesis and play a role in clinical
        situations where endogenous NO production is critically important, such as neonatal pulmonary hypertension, increased pulmonary artery
        pressure following surgical repair of congenital heart defects or hepatovenocclusive disease following bone marrow transplantation. Infants
        with neonatal pulmonary hypertension homozygous for Thr-1406 have lower L-arginine concentrations than neonates homozygous for Asn-1406
        (PubMed:11407344). {ECO:0000269|PubMed:11407344}.'
      - C0009421;C0023893;C0031190;C0032927;C0220994;C0282313;C0376618;C0751753;C0860634;C3714756;C3714958;C4082171;C4085580
