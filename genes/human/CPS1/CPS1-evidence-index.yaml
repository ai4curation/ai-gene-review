    - id: GO:0005730
      isObsolete: false
      name: nucleolus
      definition:
        text: A small, dense body one or more of which are present in the nucleus of eukaryotic cells. It is rich in RNA and protein, is not bounded
          by a limiting membrane, and is not seen during mitosis. Its prime function is the transcription of the nucleolar DNA into 45S ribosomal-precursor
          RNA, the processing of this RNA into 5.8S, 18S, and 28S components of ribosomal RNA, and the association of these components with 5S
          RNA and proteins synthesized outside the nucleolus. This association results in the formation of ribonucleoprotein precursors; these
          pass into the cytoplasm and mature into the 40S and 60S subunits of the ribosome.
        xrefs:
        - dbCode: ISBN
          dbId: 0198506732
      aspect: cellular_component
