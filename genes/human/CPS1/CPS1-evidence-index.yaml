      - 'DISEASE: Dyschromatosis universalis hereditaria 3 (DUH3) [MIM:615402]: An autosomal dominant pigmentary genodermatosis characterized
        by a mixture of hyperpigmented and hypopigmented macules distributed randomly over the body, that appear in infancy or early childhood.
        The trunk and extremities are the dominant sites of abnormal pigmentation. Facial lesions can be seen in 50% of affected individuals,
        but involvement of palms and soles is unusual. Abnormalities of hair and nails have also been reported. Dyschromatosis universalis hereditaria
        may be associated with abnormalities of dermal connective tissue, nerve tissue, or other systemic complications. {ECO:0000269|PubMed:23519333,
        ECO:0000269|PubMed:24224009, ECO:0000269|PubMed:24498303, ECO:0000269|PubMed:25288164}. Note=The disease is caused by mutations affecting
        the gene represented in this entry.;DISEASE: Microphthalmia, isolated, with coloboma, 7 (MCOPCB7) [MIM:614497]: A disorder of eye formation,
        ranging from small size of a single eye to complete bilateral absence of ocular tissues. Ocular abnormalities like opacities of the cornea
        and lens, scaring of the retina and choroid, and other abnormalities may also be present. Ocular colobomas are a set of malformations
        resulting from abnormal morphogenesis of the optic cup and stalk, and the fusion of the fetal fissure (optic fissure). {ECO:0000269|PubMed:22226084}.
        Note=The disease is caused by mutations affecting the gene represented in this entry.;DISEASE: Pseudohyperkalemia, familial, 2, due to
        red cell leak (PSHK2) [MIM:609153]: A dominantly inherited condition characterized by increased serum potassium levels, measured in whole-blood
        specimens stored at or below room temperature. This condition is not accompanied by clinical symptoms or biological signs except for borderline
        abnormalities of red cell shape. {ECO:0000269|PubMed:23180570, ECO:0000269|PubMed:24947683}. Note=The disease is caused by mutations affecting
        the gene represented in this entry.'
