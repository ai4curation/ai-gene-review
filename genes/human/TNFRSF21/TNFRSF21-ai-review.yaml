- term:
    id: GO:0031642
    label: negative regulation of myelination
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: DR6 is a negative regulator of oligodendrocyte maturation and myelination; blocking or deleting
      DR6 enhances myelination and remyelination.
    action: ACCEPT
    reason: Core biological process in the CNS glial context, and the correctly signed term. Established
      with three independent manipulations - overexpression, antagonist antibody and germline null - in
      two demyelination models. Independent of both the retracted APP/DR6 work and the Wallerian non-replication.
    supported_by:
