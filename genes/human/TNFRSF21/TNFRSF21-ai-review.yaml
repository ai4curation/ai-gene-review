- id: PMID:11485735
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Immunity 2001, Liu et al.). Founding DR6 knockout study; experimental
      basis, via the mouse ortholog, for the T cell proliferation and Th2 cytokine annotations.
  title: Enhanced CD4+ T cell proliferation and Th2 cytokine production in DR6-deficient mice.
- id: PMID:12515813
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (J Exp Med 2003). DR6-null B cell hyperproliferation, reduced apoptosis,
      enhanced germinal centres and antibody titres; basis for the B cell and humoral immune response
      annotations.
  title: Enhanced B cell expansion, survival, and humoral responses by targeting death receptor 6.
- id: PMID:19225519
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: RETRACTED. PubMed-verified as Nikolaev et al., Nature 2009, "APP binds DR6 to trigger
      axon pruning and neuron death via distinct caspases"; retracted January 2024 (see PMID:38110576)
      for image duplication, statistical errors and superseded mechanistic conclusions. Listed here only
      because it is the origin of the APP-receptor model for DR6. Critically, it is cited by no GO annotation
      on this gene or on the mouse ortholog, so the retraction does not invalidate anything in existing_annotations.
  is_invalid: true
  title: APP binds DR6 to trigger axon pruning and neuron death via distinct caspases.
- id: PMID:19654028
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: PubMed-verified as Klima et al., Biochim Biophys Acta 2009, on DR6 post-translational
      modification. The plasma membrane IDA it supports is well matched to the abstract. The cellular
      response to tumor necrosis factor IDA drawn from the same paper could not be connected to any experiment
      described in the abstract, and the cached record is abstract-only; flagged as UNDECIDED in that
      annotation rather than removed.
  title: Functional analysis of the posttranslational modifications of the death receptor 6.
- id: PMID:21725297
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Nat Med 2011, Mi et al.). DR6 as negative regulator of oligodendrocyte
      survival, maturation and myelination, with overexpression, antagonist-antibody and knockout evidence;
      independent of the APP/axon-degeneration disputes.
  title: Death receptor 6 negatively regulates oligodendrocyte survival, maturation and myelination.
- id: PMID:22761420
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: PubMed-verified (J Biol Chem 2012). Correctly cited, but the apoptosis it reports depends
      on ectopic overexpression of a death-domain receptor, which is weak evidence for a physiological
      role; hence KEEP_AS_NON_CORE for the apoptotic process annotation.
  title: Death receptor 6 induces apoptosis not through type I or type II pathways, but via a unique mitochondria-dependent
    pathway by interacting with Bax protein.
- id: PMID:23559013
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Cell Death Dis 2013, Hu et al.). DR6/p75NTR complex mediating amyloid-beta-induced
      cortical neuron death; the real experimental basis for the neuron apoptotic process annotation,
      and independent of the retracted Nature paper.
  title: A DR6/p75(NTR) complex is responsible for β-amyloid-induced cortical neuron death.
- id: PMID:24806670
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PubMed-verified (J Neurosci 2014, Olsen et al.). The non-retracted in vivo genetic
      analysis that the retraction notice relies on: APP and DR6 act in the same pathway to control retinal
      axon pruning, while beta-secretase activity is not required. Shares authorship with the retracted
      paper and has not been independently replicated.'
  title: Genetic analysis reveals that amyloid precursor protein and death receptor 6 function in the
    same pathway to control axonal pruning independent of β-secretase.
- id: PMID:25898930
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: PubMed-verified as Wang et al., J Mol Neurosci 2015, on DR6 and caspase-6 in prion-peptide-induced
      axonal degeneration in rat spinal neurons. It is the sole source of the rat IMP that the human GO:0007413
      axonal fasciculation IEA is propagated from, and its subject (axonal degeneration) does not match
      that term (collection of axons into a fascicle). Not cited directly by the human GOA row, listed
      here to document the provenance.
  title: Death Receptor 6 and Caspase-6 Regulate Prion Peptide-Induced Axonal Degeneration in Rat Spinal
    Neurons.
- id: PMID:28285993
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: PubMed-verified (Curr Biol 2017, Gamage et al.). The claim that DR6 is required for
      Wallerian degeneration and Schwann cell remodelling after axotomy. Directly non-replicated by PMID:41891813
      using two knockout lines including the original.
  title: Death Receptor 6 Promotes Wallerian Degeneration in Peripheral Axons.
- id: PMID:32296183
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: PubMed-verified (Nature 2020, HuRI). High-throughput yeast two-hybrid; source of a bare
      protein binding annotation with SGTA. Contributes no functional information.
  title: A reference map of the human binary protein interactome.
- id: PMID:35922511
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Nature 2022). Systematic extracellular-protein interactome of the human
      immune system; the source of the APP (P05067) and PI16 (Q6UXB8) protein binding rows. Independent
      redetection of the DR6-APP interaction, obtained without reference to the retracted work.
  title: A physical wiring diagram for the human immune system.
- id: PMID:38110576
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified retraction notice, Nature 2024, retracting PMID:19225519. Documents
      both the anomalies and the authors’ position that the DR6-APP genetic interaction itself still stands
      via later work.
  title: 'Retraction Note: APP binds DR6 to trigger axon pruning and neuron death via distinct caspases.'
- id: PMID:41891813
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (eLife 2026, Beirowski/Huang/Babetto). Full text cached. Non-replication
      of PMID:28285993 across two independent DR6 knockout lines, in vivo and in culture. Covers injury-induced
      Wallerian degeneration in peripheral nerve only; does not test developmental CNS axon pruning, trophic-deprivation
      degeneration, or the immune and oligodendrocyte roles.
  title: Death receptor 6 does not regulate axon degeneration and Schwann cell injury responses during
    Wallerian degeneration.
