existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: DR6 is a type I transmembrane TNFRSF member displayed at the cell surface; plasma membrane
      localisation is confirmed by immunofluorescence, by mutagenesis that traps the protein intracellularly,
      and by orthology.
    action: ACCEPT
    reason: Correct and well-corroborated primary location, asserted by six independent annotation routes
      (IBA, ISS, two IDA sources, an Ensembl-based IEA and Reactome TAS). Unaffected by any of the disputes
      surrounding this gene's neuronal role.
    supported_by:
    - reference_id: PMID:19654028
      supporting_text: Deletion of the entire linker region between CRDs and the transmembrane domain,
        spanning over 130 amino acids, severely compromises the plasma membrane localization of DR6 and
        leads to its intracellular retention.
    - reference_id: PMID:19654028
      supporting_text: In this study we document that DR6 is an extensively posttranslationally modified
        transmembrane protein
- term:
    id: GO:0002250
    label: adaptive immune response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Dr6-null mice show altered adaptive immune responses: CD4+ T cell hyperproliferation with
      Th2 skewing, and B cell hyperproliferation with enhanced germinal centre formation and antibody
      titres.'
    action: ACCEPT
    reason: Correct, though a grouping-level term; the informative statements are the negative-regulation
      children that this gene also carries. Grounded in two independent mouse knockout studies that are
      untouched by the retraction of PMID:19225519 or by the Wallerian non-replication in PMID:41891813.
    supported_by:
    - reference_id: PMID:11485735
      supporting_text: DR6, therefore, functions as a regulatory receptor for mediating CD4(+) T cell
        activation and maintaining proper immune responses.
    - reference_id: PMID:12515813
      supporting_text: DR6(-/-) mice exhibited enhanced germinal center formation and increased titers
        of immunoglobulins to T-dependent as well as T-independent type I and II antigens.
