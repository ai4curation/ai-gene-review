suggested_questions:
- question: What is the physiological ligand of DR6? Every function attributed to it rests on loss-of-function
    phenotypes or on forced overexpression; without a ligand, the molecular function can only be stated
    as generic transmembrane signalling receptor activity, and no death receptor activity term can be
    justified.
  experts:
  - TNF superfamily structural biologists
  - GO molecular-function curators
- question: Is APP a genuine functional ligand of DR6, or an interaction partner without receptor-ligand
    significance? The physical interaction is supported independently of the retracted work by a systematic
    extracellular interactome screen, but the mechanistic model built on it was withdrawn.
- question: Does DR6 regulate developmental axon pruning in the CNS? This is the part of the original
    claim that the 2026 Wallerian non-replication does not address - different process, different compartment,
    different trigger - and the surviving in vivo evidence comes from a single laboratory that shares
    authorship with the retracted paper.
- question: Should GOA record anything about DR6 and axon degeneration? At present it carries no axon-degeneration
    or axon-pruning term, and GO itself has no such term (only GO:0016322 neuron remodeling). The only
    axon-related annotation is an axonal fasciculation IEA whose rat source studied axonal degeneration
    instead.
  experts:
  - GO ontology developers
  - neuronal cell death curators
- question: What is the basis of the cellular response to tumor necrosis factor IDA from PMID:19654028?
    That paper characterises glycosylation, palmitoylation and raft targeting of DR6, and DR6 has no known
    TNF-family ligand.
- question: Are the lymphocyte and oligodendrocyte brakes the same signalling mechanism used in two cell
    types, or distinct pathways that converge on a shared receptor? DR6's death domain is required for
    the amyloid-beta neuronal pathway, but the proximal effectors in T and B cells were not identified.
suggested_experiments:
- hypothesis: DR6 has an unidentified cell-surface ligand whose engagement transduces the growth-restraining
    signal.
  description: Screen a recombinant ectodomain library of the human surfaceome and secretome against multimerised
    DR6 ectodomain by avidity-based extracellular interaction assay, then test the top hits for the ability
    to reproduce DR6-dependent restraint of T cell proliferation or oligodendrocyte maturation in DR6-null
    versus wild-type cells.
  experiment_type: interaction screen plus functional validation
- hypothesis: DR6 regulates developmental CNS axon pruning independently of any role in Wallerian degeneration.
  description: Repeat the retinocollicular pruning analysis of PMID:24806670 in an independent laboratory,
    side by side in the two DR6 knockout lines used by PMID:41891813, with the Wallerian assay run on
    the same animals as an internal control. This tests the surviving developmental claim while holding
    the mouse line constant.
  experiment_type: independent replication
- hypothesis: The DR6-APP interaction is direct and of physiological affinity.
  description: Measure the affinity and stoichiometry of purified DR6 ectodomain against defined APP ectodomain
    fragments by surface plasmon resonance and mass photometry, and determine a structure of the complex.
    The retraction withdrew the previous interaction model, so the binding interface is currently unmapped.
  experiment_type: biophysics and structural biology
- hypothesis: The lymphocyte and oligodendrocyte phenotypes share a proximal intracellular effector.
  description: Perform proximity labelling from DR6 in primary T cells, B cells and immature oligodendrocytes,
    and compare the interactomes; then test shared candidates by knockout for the ability to phenocopy
    DR6 loss in each cell type.
  experiment_type: comparative proximity proteomics
