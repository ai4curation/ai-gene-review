- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:23559013
  qualifier: enables
  review:
    summary: Bare protein binding from IntAct, recording physical interactions with p75NTR (P08138), SGTA
      (O43765), APP (P05067) and PI16 (Q6UXB8).
    action: REMOVE
    reason: >-
      No more informative molecular function is supportable from this evidence, so
      the row is removed rather than rewritten. Worth noting what is buried here: the APP
      interaction (PMID:35922511, with UniProtKB:P05067) is the only trace in GOA of the APP-
      receptor model, it is recorded only as generic protein binding, and it was redetected in a
      systematic extracellular-interactome screen entirely independent of the retracted
      PMID:19225519. The interaction therefore has support that the retraction does not remove, even
      though the mechanistic model built on it - beta-secretase-dependent shedding of an N-terminal
      APP fragment - was explicitly among the conclusions withdrawn. A specific amyloid-beta
      precursor protein binding molecular function, if one is created, would be more informative
      than either the bare term or silence.'. Removal does not imply the reported interaction is
      false.
    supported_by:
    - reference_id: PMID:38110576
      supporting_text: that DR6 and APP interact and function in a genetic pathway involving caspases
        to control axon pruning and neuron death
    - reference_id: PMID:38110576
      supporting_text: However, our later research also showed that certain conclusions reached in the
        article were incorrect, notably the role of caspase-3, the necessity for beta-secretase enzyme
        activity for APP-DR6 binding, and the model for the APP-DR6 interaction
    - reference_id: PMID:24806670
      supporting_text: further genetic and biochemical analysis reveals that β-secretase activity is not
        required and that high-affinity binding to DR6 requires a more C-terminal portion of the APP ectodomain
