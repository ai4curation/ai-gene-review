- term:
    id: GO:0007413
    label: axonal fasciculation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: Axonal fasciculation, transferred electronically from an experimental annotation on the rat
      ortholog.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Two independent reasons for doubt. First, the term looks mismatched to its source: the human
      row is an Ensembl Compara transfer (GO_REF:0000107) from rat D3ZF92, whose only basis is an IMP
      from PMID:25898930, a study of prion-peptide-induced axonal degeneration in cultured rat spinal
      neurons; GO:0007413 is defined as the collection of axons into a bundle of rods known as a fascicle,
      which that study does not address. Second, the underlying biology - DR6-dependent axon degeneration
      - is exactly what PMID:41891813 failed to reproduce, using two independent knockout lines including
