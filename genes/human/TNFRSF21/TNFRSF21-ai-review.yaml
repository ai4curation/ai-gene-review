      cysteine-rich domains and a cytoplasmic death domain whose deletion in mouse consistently de-represses
      lymphocyte proliferation and oligodendrocyte maturation.
    action: NEW
    reason: 'Transmembrane signalling receptor activity is the most specific molecular function the evidence
      will bear. It is deliberately not the more specific GO:0005035 death receptor activity: that term
      requires combining with an extracellular death ligand, and DR6 remains an orphan receptor with no
      identified ligand, so no ligand-binding event has been demonstrated. The evidence for receptor activity
      is architectural and genetic rather than direct - surface display that depends on an intact juxtamembrane
      stalk, a functional requirement for the cytoplasmic death domain in the amyloid-beta/p75NTR pathway,
      and loss-of-function phenotypes in three cell types in which removing DR6 releases a brake - so
      ISS from the mouse ortholog is the appropriate evidence line. Proposing this term is also what keeps
      the review from leaving the molecular-function slot to GO:0005515, which carries no information
      and is here removed.'
