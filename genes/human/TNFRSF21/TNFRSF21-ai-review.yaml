core_functions:
- molecular_function:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  description: 'DR6 is a type I plasma-membrane receptor of the tumour necrosis factor receptor superfamily,
    with four extracellular cysteine-rich domains, a heavily O-glycosylated stalk, and a cytoplasmic death
    domain. Its ligand is not established - it is routinely described as an orphan receptor - so the receptor
    activity is inferred from architecture, surface display and consistent loss-of-function phenotypes
    rather than from a characterised ligand-binding event. Signalling through DR6 acts as a brake in at
    least two settings. In lymphocytes it restrains activation: DR6-deficient CD4+ T cells hyperproliferate
    after T cell receptor stimulation and skew towards Th2 cytokine output, and DR6-deficient B cells
    overproliferate, resist apoptosis, form larger germinal centres and yield higher antibody titres.
    In the oligodendrocyte lineage it restrains differentiation: DR6 is high in immature oligodendrocytes,
    its overexpression activates caspase 3 and kills them, and blocking or deleting it enhances maturation,
    myelination and remyelination. A third, pathological engagement is that DR6 partners p75NTR in the
    complex through which amyloid-beta kills cortical neurons. Proposed roles in developmental axon pruning
    as an APP receptor and in injury-induced axon degeneration are contested and are deliberately not
    included here.'
