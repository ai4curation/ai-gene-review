      supporting_text: Here we show that death receptor 6 (DR6) is a negative regulator of oligodendrocyte
        maturation.
    - reference_id: PMID:21725297
      supporting_text: Attenuation of DR6 function leads to enhanced oligodendrocyte maturation, myelination
        and downregulation of casp3.
    - reference_id: PMID:21725297
      supporting_text: Consistent with the DR6 antagoinst antibody studies, DR6-null mice show enhanced
        remyelination in both demyelination models.
