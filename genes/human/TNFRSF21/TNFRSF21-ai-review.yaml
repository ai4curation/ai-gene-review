id: O75509
gene_symbol: TNFRSF21
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Tumour necrosis factor receptor superfamily member 21, known as death receptor 6 (DR6),
  is a type I plasma-membrane receptor with four extracellular cysteine-rich domains, an extensively N-
  and O-glycosylated juxtamembrane stalk required for surface delivery, a palmitoylated membrane-proximal
  cysteine, and a cytoplasmic death domain. No ligand has been established and it is generally treated
  as an orphan receptor. It is expressed on resting T and B lymphocytes and downregulated on activation,
  and in the nervous system on immature oligodendrocytes and neurons. Loss-of-function studies in mouse
  define it as a negative regulator: DR6-null CD4+ T cells hyperproliferate in response to T cell receptor
  stimulation and overproduce Th2 cytokines, DR6-null B cells overproliferate and resist apoptosis with
  enlarged germinal centres and elevated antibody titres, and DR6-null or antibody-blocked oligodendrocytes
  mature and myelinate more readily, with enhanced remyelination after demyelinating injury. DR6 also
  partners the p75 neurotrophin receptor in the surface complex through which amyloid-beta kills cortical
  neurons, and forced overexpression drives a Bax-dependent, caspase-8-independent mitochondrial apoptotic
  route. Two prominent neuronal roles are unresolved. The proposal that DR6 is the receptor for a shed
  N-terminal fragment of amyloid precursor protein and thereby drives developmental axon pruning and neuronal
  death rests on a paper retracted in 2024; a physical DR6-APP interaction and a shared genetic requirement
  for retinal axon pruning are still reported, but the beta-secretase-dependent mechanism is withdrawn.
  Separately, a report that DR6 drives Wallerian degeneration and Schwann cell remodelling in injured
  peripheral nerve was not reproduced in two independent knockout lines, including the original one.'
