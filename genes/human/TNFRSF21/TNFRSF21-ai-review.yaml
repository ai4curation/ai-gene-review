  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  review:
    summary: 'DR6 participates in neuronal death in a specific pathological context: it binds p75NTR and
      is a component of the complex that mediates amyloid-beta-induced cortical neuron death.'
    action: ACCEPT
    reason: 'Kept, and the provenance matters. The high-profile claim that DR6 drives developmental neuronal
      death as an APP receptor comes from PMID:19225519, which was retracted in 2024 (PMID:38110576) -
      but no GO annotation on this gene, in human or in the mouse ortholog Q9EPU5 that donates the ISS/IEA
      transfers, cites that paper. The actual experimental source behind the mouse annotation is PMID:23559013,
      in which DR6-null cortical neurons are resistant to amyloid-beta neurotoxicity; that work is independent
      of the retraction. PMID:41891813 (eLife 2026) is also not a counter-argument here: it addresses
      injury-induced Wallerian degeneration of peripheral axons and Schwann cell responses, which is a
      different process from neuronal apoptosis and a different compartment from the cortical neurons
      assayed in PMID:23559013. Two caveats are recorded rather than acted on: the supporting evidence
      is a pathological rather than a physiological setting, and the retraction notice''s continuing affirmation
      that DR6 and APP control neuron death rests on work by the retracting authors themselves.'
    supported_by:
    - reference_id: PMID:23559013
      supporting_text: Here, we demonstrate that death receptor 6 (DR6) binds to p75(NTR) and is a component
        of the p75(NTR) signaling complex responsible for Aβ-induced cortical neuron death.
    - reference_id: PMID:23559013
      supporting_text: Cortical neurons isolated from either DR6 or p75(NTR) null mice are resistant to
        Aβ-induced neurotoxicity.
