id: Q99594
gene_symbol: TEAD3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TEAD3 encodes the TEF-5 member of the human TEA-domain transcription-factor family. It binds sequence-specific cis-regulatory DNA, is enriched in placenta where it binds functional sites in the chorionic somatomammotropin-B enhancer, and, like other TEAD paralogs, can recruit YAP1 or WWTR1/TAZ to chromatin to drive Hippo-regulated RNA polymerase II transcription.
