    supporting_text: We identify unique features of mtIF2 that are required for specific recognition of
      fMet-tRNAMet and regulation of its GTPase activity.
  - reference_id: PMID:2380177
    supporting_text: Nonhydrolyzable analogs of GTP are 2-3-fold less effective in promoting initiation
