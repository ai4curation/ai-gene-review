core_functions:
- description: GTP-dependent initiation factor of mitochondrial translation. On the 28S subunit or the
    55S monosome, mtIF2 recruits formylated Met-tRNAMet to the start codon, discriminating it from the
    unformylated elongator form of the same tRNA. Its mitochondria-specific insertion domain substitutes
    for the absent IF1 and stabilises leaderless mRNAs in the decoding centre.
  molecular_function:
    id: GO:0003743
    label: translation initiation factor activity
  directly_involved_in:
  - id: GO:0070124
    label: mitochondrial translational initiation
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:36629253
    supporting_text: Omission of mtIF2 severely inhibited [3H]-fMet-tRNAfMet binding to monosomes, showing
      that mtIF2 is crucial for the formation of the mitochondrial initiation complex.
  - reference_id: PMID:30089917
    supporting_text: By closing the decoding centre, this insertion stabilizes the binding of leaderless
      mRNAs and induces conformational changes in the rRNA nucleotides involved in decoding.
  - reference_id: PMID:15477394
    supporting_text: In direct binding experiments, bovine IF-2(mt) has a 25-fold greater affinity for
      mitochondrial fMet-tRNA than Met-tRNA
- description: GTPase activity of the G domain, regulated by mitochondria-specific features and coupled
    to formation of the initiation complex.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  directly_involved_in:
  - id: GO:0070124
    label: mitochondrial translational initiation
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
