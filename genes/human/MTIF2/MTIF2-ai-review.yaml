suggested_questions:
- question: The bovine IF-2mt (P46198) IDA annotations to ribosome disassembly, small subunit binding
    and mitochondrial translational initiation cite PMID:12095986, a paper whose abstract attributes subunit
    dissociation to IF3mt. Were these annotations intended for bovine or human IF3mt?
- question: Does mtIF2, which lacks the N-terminal domains of bacterial IF2, contribute to joining of
    the 39S subunit on the minority of transcripts initiated on the 28S subunit?
suggested_experiments:
- description: Single-molecule FRET or stopped-flow subunit-joining assays with human 28S and 39S subunits,
    leadered and leaderless mRNAs, and wild-type or insertion-domain-deleted mtIF2, to test whether mtIF2
    has a subunit-association activity.
