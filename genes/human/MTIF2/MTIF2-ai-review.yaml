id: P46199
gene_symbol: MTIF2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MTIF2 encodes mitochondrial translation initiation factor 2 (mtIF2, IF-2mt), a nuclear-encoded
  translational GTPase of the IF-2 family that is imported into the mitochondrial matrix via an N-terminal
  presequence. mtIF2 binds the small (28S) mitoribosomal subunit and the 55S mitoribosome and, in a GTP-dependent
  reaction, places formylated methionyl-tRNAMet on the start codon of mitochondrial mRNAs. Because mitochondria
  use a single tRNAMet for initiation and elongation, mtIF2 selects the formylated form, preferring fMet-tRNA
  over Met-tRNA. A 37-residue insertion absent from bacterial IF2 takes over the role of the missing initiation
  factor IF1, closes the decoding centre and stabilises leaderless mRNAs on the initiating ribosome. Most
  mitochondrial mRNAs are leaderless and are initiated on intact 55S monosomes in an mtIF2-dependent manner.
  Knockout of MTIF2 in human cells abolishes mitochondrial protein synthesis and lowers the levels of
  mtDNA-encoded OXPHOS subunits.
