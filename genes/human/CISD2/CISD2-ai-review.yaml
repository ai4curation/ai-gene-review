- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: CISD2 is a positive HeLa mRNA-interactome capture hit.
    action: KEEP_AS_NON_CORE
    reason: Original Castello Table S1, HeLa mRNA interactome sheet row 526, identifies CISD2 in both
      crosslinked and control samples. Ion-count enrichment passes the study threshold (adjusted p 0.0021476),
      whereas the spectral-count/DESeq test does not (0.9304). Control detection and disagreement between
      the two tests limit confidence in the individual hit; the study nevertheless explicitly includes
      proteins enriched by either analysis. Retain this gene-level capture evidence outside the core without
      inferring an RNA target, product-specific activity or RNA-processing role. A known RNA-binding fold
      is not required by the term definition.
    supported_by:
    - reference_id: PMID:22658674
