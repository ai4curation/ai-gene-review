    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20010695
  qualifier: enables
  supporting_entities:
  - UniProtKB:P10415
  review:
    summary: Specify the experimentally mapped BCL2 BH4 interaction.
    action: MODIFY
    reason: The original paper demonstrates endogenous association and a GST-domain pull-down. Independent
      peptide-array and solution experiments map CISD2 binding to BCL2 BH4 and part of BH3; BH4 peptide
      binding also changes cluster stability and transfer. Use the directly supported BH4-domain term
      without treating this interaction as CISD2 anti-apoptotic activity or transferring the site mapping
      to BCLXL.
    supported_by:
    - reference_id: PMID:20010695
    - reference_id: PMID:24706857
    - reference_id: PMID:39370046
    proposed_replacement_terms:
    - id: GO:0051435
      label: BH4 domain binding
