references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: InterPro signatures support family-based chemistry and autophagy-regulation assertions.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Original InterPro identifiers are preserved; target-specific experiments, not a domain
      name alone, establish the negative-autophagy refinement.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator
    judgment of sequence similarity
  findings:
  - statement: Curated sequence-similarity transfer supplies the mouse-derived outer-mitochondrial-membrane
      assertion.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Exact Q9CQB5 identity and current experimental donor record were inspected; human and
      mouse compartment evidence remain distinguished.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PAINT supplies inherited mitochondrial-autophagy, outer-membrane and cluster-binding assertions.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Current donor identities and experimental annotations were checked. The historical IBD
      node placement and alignment were not reconstructed; target self-evidence is legitimate descendant
      grounding.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings:
  - statement: HPA immunofluorescence supplies direct ER localization.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Current official HPA XML identifies supported ER localization. The source-specific image
      pixels were not independently reinterpreted.
- id: GO_REF:0000054
  title: Gene Ontology annotation based on curation of intracellular localizations of expressed fusion
    proteins in living cells
  findings:
  - statement: LIFEdb supplies a historical fusion-protein complex-location assertion.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Official method description is accessible, but the exact original CISD2 fusion image
      was not recovered. Independent structural and cellular complex evidence supports the broad location;
      it is not substituted as that original experiment.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl
    Compara
  findings:
  - statement: Ensembl transfer supplies the mouse-linked mitochondrial-autophagy assertion.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Exact donor identity and the original mouse IMP source were traced; developmental or
      aging outcomes are not additional process proposals.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: ARBA supplies broad cytoplasmic localization.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Original rule identifier remains intact. Cytoplasm includes ER and other organelles
      under the actual definition, so a free cytosolic pool is not required.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: Combined electronic sources supply membrane locations and iron–sulfur binding.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Original ARBA, InterPro, ortholog and subcellular-location identifiers remain unchanged.
      Direct target chemistry and human/ortholog localization provide independent checks.
- id: PMID:17376863
  title: MitoNEET is an iron-containing outer mitochondrial membrane protein that regulates oxidative
    capacity.
  findings:
  - statement: Tagged human Miner1 localizes to a perinuclear reticular ER pattern; the paper's detailed
      mitochondrial import and membrane experiments concern mitoNEET.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected genuine normal full text, actual human construct/localization Results and Methods
      read. C-terminal V5/His constructs in COS7 cells are distinct from rat/mouse mitoNEET experiments.
- id: PMID:19580816
  title: 'Crystal structure of Miner1: The redox-active 2Fe-2S protein causative in Wolfram Syndrome 2.'
  findings:
  - statement: Human soluble Miner1 forms a homodimer with one [2Fe-2S] cluster per protomer and has measurable
      cluster redox potential and lability.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected genuine normal full Results and Methods read. Residues 57–135 carry C92S and
      a cleavage remnant; this paper suggests, rather than directly assays, cluster transfer.
- id: PMID:19946888
  title: Defining the membrane proteome of NK cells.
  findings:
  - statement: The study surveys membrane proteins in a human NK-cell preparation.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Exact main abstract retained. The original CISD2 target table remains unverified after
      bounded prior publisher/supplement attempts; independent human membrane experiments support the
      annotation, not a reconstructed NK-cell identification.
  full_text_unavailable: true
- id: PMID:20010695
  title: Antagonism of Beclin 1-dependent autophagy by BCL-2 at the endoplasmic reticulum requires NAF-1.
  findings:
  - statement: CISD2 associates with BCL2, BCLXL and IP3R1 and helps BCL2 restrain Beclin 1-dependent
      starvation autophagy at the ER.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact main abstract remains selected. Genuine freshly fetched full text was independently
      read, including endogenous co-IP, ER topology, BCL2–BECN1 association, bafilomycin/LC3 flux and
      starvation experiments. H1299 4-hour-starvation assays do not establish a universal calcium or apoptosis
      effect.
- id: PMID:22658674
  title: Insights into RNA biology from an atlas of mammalian mRNA-binding proteins.
  findings:
  - statement: CISD2 is a statistically enriched HeLa mRNA-interactome protein in the original supplement.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Exact main abstract retained; authentic author full Methods and publisher Table S1 row
      526 inspected. Ion-count enrichment passes whereas the spectral-count test does not; the study accepts
      either test. Protein groups are gene-level, without resolving an RNA target or every product.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: HuRI reports binary interactions for CISD2 with multiple screened human protein constructs.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Exact main full text retained. Selected Results, assay-validation and limitation passages
      read; all 56 original CISD2 partner rows have exact current IntAct records. Quadruplicate and orthogonal
      validation characterize the study, but individual CISD2 mammalian confirmation is not asserted without
      a matching record.
- id: PMID:32814053
  title: Interactome Mapping Provides a Network of Neurodegenerative Disease Proteins and Uncovers Widespread
    Protein Aggregation in Affected Brains.
  findings:
  - statement: The neurodegeneration interactome includes positive CISD2 yeast two-hybrid pairs.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Exact main abstract retained. Genuine author PDF from the MDC repository was read for
      screening and reporter controls; exact target-specific IntAct records support five original partners.
      No CISD2-specific mammalian confirmation or disease mechanism is inferred.
- id: PMID:23717386
  title: 'Nutrient-deprivation autophagy factor-1 (NAF-1): biochemical properties of a novel cellular
    target for anti-diabetic drugs.'
  findings:
  - statement: Purified soluble human NAF-1 delivers its bound cluster to apoferredoxin in a redox- and
      ligand-sensitive reaction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected genuine normal abstract retained; authentic PLOS full XML Results, Methods
      and legends were recovered and read. The permeabilized-cell mitochondrial probe measures labile
      iron, not an identified physiological cluster recipient. The paper's H9c2 species wording is not
      adopted.
- id: PMID:24706857
  title: Integrated strategy reveals the protein interface between cancer targets Bcl-2 and NAF-1.
  findings:
  - statement: BCL2 BH4 and BH3 peptides bind soluble NAF-1, and a BH4 peptide destabilizes its cluster
      and accelerates transfer to apoferredoxin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected genuine normal full Results and Methods read. Peptide arrays, native gels and
      deuterium exchange are separate from a predicted coevolution complex model. The Results says S92C
      whereas the earlier preparation describes C92S; an identical wild-type construct is not assumed.
- id: PMID:19451219
  title: Cisd2 deficiency drives premature aging and causes mitochondria-mediated defects in mice.
  findings:
  - statement: Mouse Cisd2 deficiency causes mitochondrial degeneration, increased autophagy and premature
      aging; endogenous fractionation supports an outer-mitochondrial-membrane pool.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected genuine normal full Results and Methods read. Damaged mitochondria precede
      broader tissue degeneration. This links the phenotype to mitochondrial autophagy without identifying
      Cisd2 as an engulfment enzyme or transferring mouse tissue measurements to a human assay.
- id: PMID:17846994
  title: A homozygous mutation in a novel zinc-finger protein, ERIS, is responsible for Wolfram syndrome
    2.
  findings:
  - statement: Human CISD2 variants disrupt splicing in Wolfram syndrome 2, and tagged human ERIS localizes
      to the ER.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected genuine normal full selected Methods and Results read. P19/HEK293 are expression
      hosts; patient lymphoblastoid cells show altered thapsigargin-stimulated calcium release. The historical
      zinc-finger interpretation is superseded by direct iron–sulfur structural chemistry.
- id: PMID:39370046
  title: CISD2 counteracts the inhibition of ER-mitochondrial calcium transfer by anti-apoptotic BCL-2.
  findings:
  - statement: Cytosolic CISD2 binds purified BCL2 BH4, while its effects on BCL2-associated calcium signaling
      differ between bulk release and ER–mitochondrial contacts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genuine normal complete abstract read; full experimental body not recovered. The abstract
      reports submicromolar purified binding and co-overexpression/knockout contexts, not a universal
      direction of calcium regulation.
  full_text_unavailable: true
