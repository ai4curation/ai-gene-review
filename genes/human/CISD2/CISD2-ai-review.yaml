  review:
    summary: Retain the BCLXL association without an untested domain assignment.
    action: KEEP_AS_NON_CORE
    reason: The original endogenous co-immunoprecipitation supports association with BCLXL. The experimentally
      mapped BCL2 BH4/BH3 interface does not establish the corresponding contact on BCLXL, and this result
      alone does not define a separate CISD2 physiological activity. Together with the separate BCL2 and
      BCL2L2 observations, this is corroborating BCL2-family interaction context; it does not establish
      a shared binding site or the same regulatory effect for each partner.
    supported_by:
    - reference_id: PMID:20010695
