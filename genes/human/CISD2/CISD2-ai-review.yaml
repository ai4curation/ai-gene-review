id: Q8N5K1
gene_symbol: CISD2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CISD2 (NAF-1/Miner1) is a small membrane-associated homodimeric protein that coordinates
  redox-active [2Fe-2S] clusters through its CDGSH domain. Its cytosolic domain can transfer a cluster
  to an apo-acceptor protein, and binding to BCL2 links it to restraint of Beclin 1-dependent autophagy
  at the endoplasmic reticulum. Human cell studies support endoplasmic reticulum localization; endogenous
  mouse tissue fractionation places Cisd2 predominantly in mitochondria, enriched at the outer membrane,
  with a smaller ER pool. CISD2 helps maintain organelle homeostasis, and loss of function causes Wolfram
  syndrome 2. Effects on calcium handling depend on the cellular context and the associated BCL2 complexes.
existing_annotations:
- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1914256
  - PANTHER:PTN008550313
  review:
    summary: The damage-associated phenotype does not establish participation in mitochondrial autophagy.
    action: MARK_AS_OVER_ANNOTATED
    reason: The authenticated mouse Cisd2 donor has a genuine IMP annotation from PMID:19451219. Its knockout
      causes mitochondrial damage, autophagic vacuoles and increased LC3-II/LC3-I; the Results interpret
      clearance of damaged organelles as a response to mitochondrial dysfunction. GO:0000422 names mitochondrial
      delivery and degradation by autophagy, but these experiments do not establish a step performed by
      Cisd2 in that process. The preserved involved_in assertion therefore exceeds the demonstrated role.
      Increased autophagy after loss also does not by itself establish specific negative regulation of
      mitophagy. The separate BCL2–BECN1 interaction and starvation-flux experiments in PMID:20010695
      support the existing general negative-regulation refinement, not a mitochondrial-selective replacement
      here.
    supported_by:
    - reference_id: PMID:19451219
    - reference_id: PMID:20010695
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN008550313
        source_status: UNRESOLVED
        comment: The exact mouse donor and its experimental annotation are authentic. The inspected primary
          evidence establishes mitochondrial damage with increased autophagy, rather than a demonstrated
          mitochondrial-autophagy step performed by Cisd2. Historical IBD evidence, node placement and
          alignment remain uninspected, so the ancestral source cannot be classified confidently; this
          is a role-scoping objection, not a claim of wrong orthology, donor-count weakness or erroneous
          phylogeny.
