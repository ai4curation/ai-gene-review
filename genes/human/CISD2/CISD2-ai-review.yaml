core_functions:
- description: The cytosolic CDGSH domain binds a [2Fe-2S] cluster and can deliver it to an apo-protein
    acceptor. Recombinant human soluble NAF-1 establishes this molecular capacity; physiological acceptor
    identity and the extent of intact-cluster transfer in cells remain unresolved. The stable homodimer
    supports the cluster-bearing fold. Human localization experiments support the ER pool; endogenous
    mouse fractionation shows a predominantly mitochondrial pool enriched at the outer membrane and a
    smaller ER pool.
  molecular_function:
    id: GO:0140132
    label: iron-sulfur cluster chaperone activity
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  - id: GO:0005741
    label: mitochondrial outer membrane
  supported_by:
  - reference_id: PMID:23717386
  - reference_id: PMID:24706857
  - reference_id: PMID:19580816
  - reference_id: PMID:17376863
  - reference_id: PMID:20010695
  - reference_id: PMID:19451219
- description: CISD2 binds the BCL2 BH4 region and supports BCL2-mediated restraint of Beclin 1-dependent
    autophagy at the ER. Direct domain/peptide binding and cellular complex and flux experiments establish
    complementary molecular and regulatory evidence. BH3-region interaction is also observed, while BCLXL
    site mapping and a universal direction of calcium regulation are not established.
  molecular_function:
    id: GO:0051435
    label: BH4 domain binding
  locations:
  - id: GO:0005789
    label: endoplasmic reticulum membrane
  directly_involved_in:
  - id: GO:0010507
    label: negative regulation of autophagy
  supported_by:
  - reference_id: PMID:24706857
    supporting_text: BH4 domain and part of the BH3 domain
  - reference_id: PMID:20010695
    supporting_text: functionally antagonize Beclin 1-dependent autophagy
  - reference_id: PMID:39370046
suggested_questions:
- question: Which physiological apo-protein accepts a CISD2 cluster in human cells, and how is intact-cluster
    delivery distinguished from release and subsequent iron uptake?
- question: How do BCL2 binding, cluster occupancy and membrane-contact context determine CISD2 effects
    on ER–mitochondrial calcium handling?
- question: Which screen-detected CISD2 interactions occur endogenously, and which physiological consequence
    follows from the verified partner-class associations?
suggested_experiments:
- description: Trace an isotopically labeled CISD2 cluster into candidate endogenous acceptors under controlled
    redox conditions, combining acceptor-specific spectroscopy with CISD2 ligand-mutant and iron-release
    controls.
- description: Compare endogenous and matched-expression CISD2–BCL2 perturbations with simultaneous ER
    and mitochondrial calcium measurements, membrane-contact quantification and Beclin-dependent autophagic
    flux.
