core_functions:
- description: WNT5A is secreted as an extracellular ligand that binds
    Frizzled/ROR receptor complexes to activate noncanonical Wnt signaling,
    including planar-cell-polarity, calcium and JNK outputs, while antagonizing
    or activating beta-catenin signaling in a receptor-context-dependent manner.
  molecular_function:
    id: GO:0005109
    label: frizzled binding
  directly_involved_in:
  - id: GO:0035567
    label: non-canonical Wnt signaling pathway
  - id: GO:0060071
    label: Wnt signaling pathway, planar cell polarity pathway
  - id: GO:0007223
    label: Wnt signaling pathway, calcium modulating pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by: *id001
suggested_questions:
- question: Which human WNT5A annotations require direct ROR1/ROR2 or Frizzled engagement, and
    which inflammatory, skeletal and synaptic rows only measure induction of WNT5A expression or
    downstream responses to exogenous ligand?
suggested_experiments:
- description: Pair endogenous WNT5A perturbation with receptor-specific ROR1, ROR2 and Frizzled
    rescue in human macrophage, chondrocyte and neuronal models to link direct WNT5A binding to
    JNK, CaMKII, NF-kappaB and beta-catenin-antagonism readouts.
