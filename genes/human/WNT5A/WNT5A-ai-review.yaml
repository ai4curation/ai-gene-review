id: P41221
gene_symbol: WNT5A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'WNT5A is a secreted Wnt ligand best known for beta-catenin-independent
  Wnt signaling. Depending on the receptor context it engages Frizzled and ROR-family
  receptors to drive planar-cell-polarity, calcium, JNK/PKC and synaptic signaling
  outputs and can either antagonize or activate canonical beta-catenin signaling.'
