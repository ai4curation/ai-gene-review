  review:
    summary: SCF ubiquitin ligase complex, inherited from an F-box/LRR family node. AMN1 has no F-box,
      the module that joins SCF complexes; marked as over-annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: The PANTHER node groups AMN1 with F-box/LRR proteins whose experimental SCF annotations seed
      it; every donor, across human, mouse, fly, zebrafish, plant and yeast, has an F-box [file:genes/human/AMN1/AMN1-notes.md
      "- **All IBA donors verified as F-box proteins (UniProt F-box DOMAIN features):**"] (neither yeast
      donor is yeast AMN1). AMN1 has no recognizable F-box [file:genes/human/AMN1/AMN1-bioinformatics/RESULTS.md
      "AMN1 therefore has no recognizable F-box, the SKP1-binding module that makes FBXL proteins SCF
      substrate receptors."]; only a fragment of its N-terminus aligns to the FBXL15 F-box [file:genes/human/AMN1/AMN1-bioinformatics/RESULTS.md
      "| FBXL15 | Q9H469 | 19-66 | 2-28 | 6 | 25 of 48 |"]. SCF membership depends on the F-box binding
      SKP1, so the inherited complex and process are unlikely to hold for AMN1. This is a sequence inference,
      not a negative experiment, so the rows are marked as over-annotated rather than removed.
    supported_by:
