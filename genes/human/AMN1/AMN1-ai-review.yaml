    action: MARK_AS_OVER_ANNOTATED
    reason: 'The PANTHER node groups AMN1 with F-box/LRR proteins. This row''s 14 WITH/FROM donors [file:genes/human/AMN1/AMN1-bioinformatics/RESULTS.md
      "## GO:0019005 SCF ubiquitin ligase complex: 14 donors"] are human, mouse, fly, zebrafish, plant
      and yeast F-box/LRR proteins, each with a UniProt F-box [file:genes/human/AMN1/AMN1-bioinformatics/RESULTS.md
      "Every donor of both IBA rows carries a UniProt F-box domain. Neither yeast donor is yeast AMN1
      (P38285)."]. PANTHER itself separates AMN1 from these donors: it sits alone among them in subfamily
      SF254, a clade of short F-box-less homologs [file:genes/human/AMN1/AMN1-bioinformatics/RESULTS.md
      "No donor is in AMN1''s own subfamily, PTHR13318:SF254 (PROTEIN AMN1 HOMOLOG). The donors are 300-807
      residues long, against AMN1''s 258."], so the IBD is placed above the split between the F-box/LRR
      substrate receptors and the AMN1 clade. AMN1 has no recognizable F-box [file:genes/human/AMN1/AMN1-bioinformatics/RESULTS.md
      "AMN1 therefore has no recognizable F-box, the SKP1-binding module that makes FBXL proteins SCF
      substrate receptors."]; only a fragment of its N-terminus aligns to the FBXL15 F-box [file:genes/human/AMN1/AMN1-bioinformatics/RESULTS.md
      "| FBXL15 | Q9H469 | 19-66 | 2-28 | 6 | 25 of 48 |"]. SCF membership depends on the F-box binding
      SKP1, so the inherited term is unlikely to hold for AMN1. This is a sequence inference, not a negative
      experiment, so the row is marked as over-annotated rather than removed.'
    supported_by:
