- term:
    id: GO:0031528
    label: microvillus membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: is_active_in
  supporting_entities:
  - UniProtKB:B8JKV0
  - ensembl:ENSMUSP00000107160
  review:
    summary: Microvillus membrane, by orthology to a mouse Amn1 IDA. The mouse source describes amnionless's
      cobalamin cargo-receptor role, a symbol mix-up between Amn and Amn1; removed.
    action: REMOVE
    reason: "The failure is on the source side. The mouse IDA comes from a 1965 vitamin B12-binding study\
      \ [PMID:14321840 \"STUDIES ON THE INTERACTION OF VITAMIN B12: INTRINSIC FACTOR AND RECEPTORS.\"\
      ], and MGI's own GO-CAM for that study places 'Amn1 Mmus' as cobalamin cargo receptor in the microvillus\
      \ membrane [file:gocams/index.tsv \"MGI:MGI:2442933\tAmn1 Mmus\t62900b6400002552\tCobalamin transport,\
      \ into enterocytes (Mouse)\tNCBITaxon:10090\tgomodel:62900b6400002552/62900b6400002624\tGO:0038024\t\
      cargo receptor activity\tGO:0015889\tcobalamin transport\tGO:0031528\tmicrovillus membrane\"], beside\
      \ cubilin and intrinsic factor [file:genes/human/AMN1/AMN1-notes.md \"- **Mouse microvillus source:**\
      \ the IEA rests on an MGI IDA for mouse Amn1 from PMID:14321840, a 1965 study of vitamin B12-binding\
      \ substances. The paper's other mouse annotations are to Cubn and Cblif, the cubilin-intrinsic factor\
      \ system whose membrane partner is amnionless (symbol Amn), not Amn1.\"]. That is the role of amnionless\
      \ (Amn), the cubilin partner, not of the LRR protein Amn1, so the source annotation is attached\
      \ to the wrong gene. AMN1 also has no transmembrane segment or signal peptide [file:genes/human/AMN1/AMN1-notes.md\
      \ \"- **No membrane features:** neither human AMN1 nor mouse Amn1 has an annotated transmembrane\
      \ segment or signal peptide in UniProt.\"], which is consistent with, though not on its own proof\
      \ of, the error."
    supported_by:
    - reference_id: file:gocams/index.tsv
      supporting_text: "MGI:MGI:2442933\tAmn1 Mmus\t62900b6400002552\tCobalamin transport, into enterocytes\
        \ (Mouse)\tNCBITaxon:10090\tgomodel:62900b6400002552/62900b6400002624\tGO:0038024\tcargo receptor\
        \ activity\tGO:0015889\tcobalamin transport\tGO:0031528\tmicrovillus membrane"
    - reference_id: file:genes/human/AMN1/AMN1-notes.md
      supporting_text: '- **Mouse microvillus source:** the IEA rests on an MGI IDA for mouse Amn1 from
        PMID:14321840, a 1965 study of vitamin B12-binding substances. The paper''s other mouse annotations
        are to Cubn and Cblif, the cubilin-intrinsic factor system whose membrane partner is amnionless
        (symbol Amn), not Amn1.'
    - reference_id: PMID:14321840
      supporting_text: 'STUDIES ON THE INTERACTION OF VITAMIN B12: INTRINSIC FACTOR AND RECEPTORS.'
    - reference_id: file:genes/human/AMN1/AMN1-notes.md
      supporting_text: '- **No membrane features:** neither human AMN1 nor mouse Amn1 has an annotated
        transmembrane segment or signal peptide in UniProt.'
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      source_entities:
      - source_id: UniProtKB:B8JKV0
        source_status: SOURCE_BAD
        comment: Mouse Amn1; its microvillus membrane IDA (PMID:14321840) and GO-CAM 62900b6400002552
          describe amnionless's cargo-receptor role, a homonym mix-up.
      - source_id: ensembl:ENSMUSP00000107160
        source_status: SOURCE_BAD
        comment: Ensembl Compara mapping of the same mouse Amn1 source.
