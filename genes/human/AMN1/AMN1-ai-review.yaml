core_functions: []
knowledge_gaps:
- gap_statement: AMN1 is wholly uncharacterized in human.
  boundary: No study addresses the human protein. Its name comes from yeast Amn1, whose literature describes
    a different biological context, and its family-level SCF inheritance is undercut by the absence of
    an F-box.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: An LRR protein related to FBXL substrate receptors but lacking an F-box could act as a
    competitor or decoy for SCF substrates.
  resolution: Test whether AMN1 binds SKP1 or CUL1, and identify its interactors and localization in human
    cells.
  provenance:
  - reference_id: file:genes/human/AMN1/AMN1-bioinformatics/RESULTS.md
    supporting_text: AMN1 therefore has no recognizable F-box, the SKP1-binding module that makes FBXL
      proteins SCF substrate receptors.
proposed_new_terms: []
suggested_questions:
- question: Should MGI reassign the mouse Amn1 microvillus membrane IDA (PMID:14321840) and the Amn1 cargo-receptor
    node in GO-CAM 62900b6400002552 (Cobalamin transport, into enterocytes) to amnionless (Amn)? The node's
    own enabled_by evidence is orthology (ECO:0000266) to UniProtKB:Q9BXJ7, which is human AMN, from PMID:14576052.
- question: Does human AMN1 bind SKP1 or any SCF component despite lacking an F-box?
suggested_experiments:
- description: Co-immunoprecipitate tagged AMN1 with SKP1 and CUL1, with FBXL15 as a positive control.
