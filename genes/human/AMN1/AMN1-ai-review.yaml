  review:
    summary: Microvillus membrane, by orthology to a mouse Amn1 IDA. The mouse source describes amnionless's
      cobalamin cargo-receptor role, a symbol mix-up between Amn and Amn1; removed.
    action: REMOVE
    reason: "The failure is on the source side, at the gene-product assignment. In MGI's GO-CAM 62900b6400002552\
      \ the node assigned to mouse Amn1 [file:gocams/62900b6400002552/62900b6400002552-src.yaml \"term:\
      \ MGI:MGI:2442933\"] gets its identity by orthology evidence to UniProtKB:Q9BXJ7 [file:gocams/62900b6400002552/62900b6400002552-src.yaml\
      \ \"- UniProtKB:Q9BXJ7\"] from the amnionless paper [file:gocams/62900b6400002552/62900b6400002552-src.yaml\
      \ \"reference: PMID:14576052\"], [PMID:14576052 \"The functional cobalamin (vitamin B12)-intrinsic\
      \ factor receptor is a novel\"]. Q9BXJ7 is human amnionless, AMN [file:genes/human/AMN/AMN-uniprot.txt\
      \ \"ID   AMNLS_HUMAN\"], which carries the same location, cargo-receptor activity and cobalamin-transport\
      \ triple by IDA from that paper. The location row also carries a second cross-gene projection, to\
      \ intrinsic factor [file:gocams/62900b6400002552/62900b6400002552-src.yaml \"- UniProtKB:P27352\"\
      ]. The mouse IDA itself comes from a 1965 vitamin B12-binding study [PMID:14321840 \"STUDIES ON\
      \ THE INTERACTION OF VITAMIN B12: INTRINSIC FACTOR AND RECEPTORS.\"], and MGI's own GO-CAM 62900b6400002552\
      \ places 'Amn1 Mmus' as cobalamin cargo receptor in the microvillus membrane [file:gocams/index.tsv\
      \ \"MGI:MGI:2442933\tAmn1 Mmus\t62900b6400002552\tCobalamin transport, into enterocytes (Mouse)\t\
      NCBITaxon:10090\tgomodel:62900b6400002552/62900b6400002624\tGO:0038024\tcargo receptor activity\t\
      GO:0015889\tcobalamin transport\tGO:0031528\tmicrovillus membrane\"]; the model's Amn1 node [file:gocams/62900b6400002552/62900b6400002552-src.yaml\
      \ \"term: MGI:MGI:2442933\"] carries cargo receptor activity [file:gocams/62900b6400002552/62900b6400002552-src.yaml\
      \ \"term: GO:0038024\"] with the microvillus location backed by this paper [file:gocams/62900b6400002552/62900b6400002552-src.yaml\
      \ \"reference: PMID:14321840\"]. It sits beside cubilin and intrinsic factor [file:genes/human/AMN1/AMN1-notes.md\
      \ \"- **Mouse microvillus source:** the IEA rests on an MGI IDA for mouse Amn1 from PMID:14321840,\
      \ a 1965 study of vitamin B12-binding substances. The paper's other mouse annotations are to Cubn\
      \ and Cblif, the cubilin-intrinsic factor system whose membrane partner is amnionless (symbol Amn),\
      \ not Amn1.\"]. That is the role of amnionless (Amn), the cubilin partner, not of the LRR protein\
      \ Amn1, so the source annotation is attached to the wrong gene. AMN1 also has no transmembrane segment\
      \ or signal peptide [file:genes/human/AMN1/AMN1-notes.md \"- **No membrane features:** neither human\
      \ AMN1 nor mouse Amn1 has an annotated transmembrane segment or signal peptide in UniProt.\"], which\
      \ is consistent with, though not on its own proof of, the error."
