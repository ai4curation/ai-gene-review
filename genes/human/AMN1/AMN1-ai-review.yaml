description: AMN1 (protein AMN1 homolog) is a small, uncharacterized leucine-rich-repeat protein of the
  FBXL-related LRR family. It is named for budding-yeast Amn1, an antagonist of the mitotic exit network,
  but no function has been studied for the human protein. Unlike the F-box/LRR proteins it is grouped
  with, it has no recognizable F-box and no membrane-targeting features.
