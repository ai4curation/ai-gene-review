    supporting_text: Bim can regulate apoptosis through direct activation of the Bax-mediated cell 
      death pathway without interaction with antiapoptotic Bcl-2 family members
  - reference_id: PMID:18948948
    supporting_text: BIM SAHB engagement directly triggers the functional activation of BAX
  - reference_id: PMID:21041309
    supporting_text: Bim and Bid are reported to be direct activators
proposed_new_terms:
- proposed_name: pro-survival BCL2 family protein inhibitor activity
  proposed_definition: Binding to a pro-survival BCL2-family protein through a BH3-mediated 
    interaction to inhibit that protein from sequestering pro-apoptotic BCL2-family effectors or 
    activators.
  justification: BIM, BID, PUMA, BAD, NOXA, and related BH3-only proteins donate BH3 helices to the 
    grooves of pro-survival BCL2 proteins and inhibit their anti-apoptotic activity. GO:0051434 BH3 
    domain binding annotates the groove-side receptor and is directionally wrong for the BH3-only 
    ligand.
  proposed_parent:
    id: GO:0140678
    label: molecular function inhibitor activity
  supported_by:
  - reference_id: PMID:18209102
    supporting_text: Bim and Puma bind to all prosurvival proteins tightly
  - reference_id: PMID:18209102
    supporting_text: ligands that merely engage its hydrophobic groove with high affinity are 
      sufficient
- proposed_name: pro-apoptotic BCL2 family effector activator activity
  proposed_definition: Binding to a pro-apoptotic BCL2-family effector such as BAX or BAK to promote
    the conformational activation and oligomerization that drives apoptotic mitochondrial 
    outer-membrane permeabilization.
  justification: Direct-activator BH3-only proteins donate a BH3 helix that activates BAX/BAK, but 
    GO:0051434 BH3 domain binding annotates the groove-containing protein that recognizes a BH3 
    helix. A BIM/BID-side molecular-function term would prevent these central interactions from 
    collapsing to GO:0005515 protein binding.
  proposed_parent:
    id: GO:0140677
    label: molecular function activator activity
  supported_by:
  - reference_id: PMID:11997495
    supporting_text: Bim can regulate apoptosis through direct activation of the Bax-mediated cell 
      death pathway without interaction with antiapoptotic Bcl-2 family members
  - reference_id: PMID:18948948
    supporting_text: BIM SAHB engagement directly triggers the functional activation of BAX
suggested_questions:
- question: Should GO add paired BIM-side molecular-function terms for BH3-only inhibition of 
    pro-survival BCL2 proteins and direct activation of BAX/BAK, so these interactions are not 
    forced into GO:0005515 or the directionally wrong GO:0051434 BH3 domain binding term?
- question: Should BIM splice isoforms that lack the canonical BH3 or C-terminal mitochondrial 
    targeting regions be separated in GOA once source papers specify exactly which human isoform was
    assayed?
suggested_experiments:
- description: For candidate BIM interactions outside the BCL2-family core, map whether the partner 
    changes BIM release from dynein, mitochondrial targeting, BH3-groove occupancy, or BAX/BAK 
    activation before curating the edge as more than generic protein binding.
