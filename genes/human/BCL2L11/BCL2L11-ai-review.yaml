id: O43521
gene_symbol: BCL2L11
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'BCL2L11 encodes BIM, a BH3-only BCL2-family apoptosis regulator that is held on cytoskeletal
  or endomembrane sites in unstressed cells and is induced, released, or stabilized after death signals.
  BH3-containing BIM isoforms promote intrinsic apoptosis at mitochondria by engaging and neutralizing
  pro-survival BCL2 relatives such as BCL2, BCL2L1/Bcl-xL, MCL1, BCL2A1, BCL2L2/Bcl-w, and BCL2L10/Bcl-B,
  and by directly activating BAX and BAK so they oligomerize, permeabilize the mitochondrial outer membrane,
  and release cytochrome c. BIM is a major effector downstream of stresses such as growth-factor withdrawal,
  ER stress, cytoskeletal damage, glucocorticoids, and anoikis, while splice variation and phosphorylation
  tune the potency, localization, and degradation of particular isoforms.'
