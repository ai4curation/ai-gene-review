  - id: GO:0005741
    label: mitochondrial outer membrane
  in_complex:
    id: GO:0097136
    label: Bcl-2 family protein complex
  supported_by:
  - reference_id: PMID:18209102
    supporting_text: Bim and Puma bind to all prosurvival proteins tightly
  - reference_id: PMID:20066663
    supporting_text: We report the crystal structure of human Mcl-1 bound to a BH3 peptide derived 
      from human Bim
  - reference_id: Reactome:R-HSA-139919
    supporting_text: it translocates to the outer mitochondrial membrane where it associates with 
      BCL2
- description: BIM directly engages BAX and BAK through an activator BH3 helix, promoting 
    conformational activation and oligomerization of the effectors that form the apoptotic MOMP 
    pore.
  proposed_molecular_function: pro-apoptotic BCL2 family effector activator activity
