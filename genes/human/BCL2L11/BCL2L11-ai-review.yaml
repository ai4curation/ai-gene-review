core_functions:
- description: BIM uses its BH3 helix to bind pro-survival BCL2-family grooves and inhibit 
    sequestration of BAX, BAK, or other BH3-only activators, thereby derepressing mitochondrial 
    outer-membrane permeabilization.
  proposed_molecular_function: pro-survival BCL2 family protein inhibitor activity
  directly_involved_in:
