- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:18948948
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q07812
  review:
    summary: BIM BH3 directly activates BAX rather than merely binding an inert partner.
    action: MODIFY
    reason: BIM supplies an activator BH3 helix that triggers BAX conformational activation and 
      downstream oligomerization. GO lacks a directionally correct MF for this direct-activator 
      role, so the row should be replaced by a BCL2-family effector-activator term rather than BH3 
      domain binding.
    proposed_replacement_terms:
    - id: NTR
      label: pro-apoptotic BCL2 family effector activator activity
