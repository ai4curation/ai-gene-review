- term:
    id: GO:0007509
    label: mesoderm migration involved in gastrulation
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P0DMC2
  review:
    summary: Mesoderm migration involved in gastrulation (ISS from zebrafish apela). In zebrafish, Toddler
      acts as a motogen for mesendodermal cells during gastrulation through APJ. In mouse, Apela loss
      affects early Aplnr-expressing mesoderm, but the mouse papers reviewed here do not report a mesendoderm
      migration defect; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:24407481 "Both absence and overproduction of Toddler reduce the movement of mesendodermal
      cells during zebrafish gastrulation."] [PMID:24407481 "These results indicate that Toddler is an
      activator of APJ/Apelin receptor signaling, promotes gastrulation movements, and might be the first
      in a series of uncharacterized developmental signals."] [PMID:29117894 "These results suggest that
      Toddler signaling regulates mesodermal cell migration downstream of Nodal signaling and indirectly
      affects endodermal cell migration via Cxcr4a-signaling."] [PMID:28854362 "Double-mutant analyses
      showed that loss of Apela signaling impacts early Aplnr-expressing mesodermal populations independently
      of the alternative ligand Apelin"]'
    supported_by:
    - reference_id: PMID:24407481
      supporting_text: Both absence and overproduction of Toddler reduce the movement of mesendodermal
        cells during zebrafish gastrulation.
    - reference_id: PMID:24407481
      supporting_text: These results indicate that Toddler is an activator of APJ/Apelin receptor signaling,
        promotes gastrulation movements, and might be the first in a series of uncharacterized developmental
        signals.
    - reference_id: PMID:29117894
      supporting_text: These results suggest that Toddler signaling regulates mesodermal cell migration
        downstream of Nodal signaling and indirectly affects endodermal cell migration via Cxcr4a-signaling.
    - reference_id: PMID:28854362
      supporting_text: Double-mutant analyses showed that loss of Apela signaling impacts early Aplnr-expressing
        mesodermal populations independently of the alternative ligand Apelin
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
