taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  APELA (ELABELA, ELA, Toddler) encodes a small secreted peptide hormone that is the second
  endogenous agonist of the apelin receptor APLNR (APJ), a Gi-coupled G-protein-coupled
  receptor. The gene lies in a transcript that was first annotated as non-coding; it encodes
  a 54-residue precursor whose 22-residue signal peptide is removed to release the mature
  32-residue peptide ELA-32. Shorter C-terminal forms (ELA-21, ELA-14, ELA-11) are also
  active, and the C-terminal residues are essential for receptor binding and signalling,
  while the positively charged N-terminal region increases affinity. ELA binds APLNR in human
  heart, inhibits forskolin-stimulated cAMP production through a pertussis-toxin-sensitive
  Gi pathway, stimulates ERK1/2 phosphorylation, recruits beta-arrestin and drives receptor
  internalization. It circulates in human plasma at subnanomolar concentrations and is
  expressed in vascular endothelium, kidney, placental trophoblasts and pluripotent stem
  cells. In zebrafish it is a motogen required for mesendoderm migration during gastrulation,
  endoderm differentiation and heart formation; in mouse it is required for normal
  cardiovascular development, sinus venosus-derived coronary vessel growth and placental
  angiogenesis, and its loss causes preeclampsia-like disease in pregnancy. In the adult it
  increases cardiac contractility and output and causes vasodilatation. In human embryonic
  stem cells, which lack APLNR, secreted ELA supports self-renewal through PI3K/AKT/mTORC1
  signalling via an unidentified alternative receptor.
