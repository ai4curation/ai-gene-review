- id: PMID:24316148
  title: 'ELABELA: a hormone essential for heart development signals via the apelin receptor.'
  findings:
  - statement: ELA is a conserved 32-residue hormone acting through APLNR, required for zebrafish heart
      formation.
    supporting_text: Loss of Ela causes embryos to develop with a rudimentary heart or no heart at all,
      surprisingly phenocopying the loss of the apelin receptor (aplnr), which we show serves as Ela's
      cognate G protein-coupled receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only; zebrafish genetics plus human ES expression.
  full_text_unavailable: true
- id: PMID:25639753
  title: Elabela-apelin receptor signaling pathway is functional in mammalian systems.
  findings:
  - statement: ELA signals through human APJ in mammalian cells and induces angiogenesis.
    supporting_text: In Chinese hamster ovarian (CHO) cells over-expressing human APJ, ELA suppresses
      cAMP production with EC50 of 11.1 nM, stimulates ERK1/2 phosphorylation with EC50 of 14.3 nM and
      weakly induces intracellular calcium mobilization.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:28137936
  title: Elabela/Toddler Is an Endogenous Agonist of the Apelin APJ Receptor in the Adult Cardiovascular
    System, and Exogenous Administration of the Peptide Compensates for the Downregulation of Its Expression
    in Pulmonary Arterial Hypertension.
  findings:
  - statement: ELA is an endogenous agonist of the human apelin receptor.
    supporting_text: These results show that ELA is an endogenous agonist of the human apelin receptor,
      exhibits a cardiovascular profile comparable to apelin
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; human heart binding, rat in vivo.
- id: PMID:28663440
  title: ELABELA deficiency promotes preeclampsia and cardiovascular malformations in mice.
  findings:
  - statement: Placenta-derived ELA prevents preeclampsia-like disease in mice.
    supporting_text: Elabela but not Apelin knockout pregnant mice exhibit PE-like symptoms, including
      proteinuria and elevated blood pressure due to defective placental angiogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:35817871
  title: Structural insight into apelin receptor-G protein stoichiometry.
  findings:
  - statement: Cryo-EM of APJ-G protein complexes with ELA bound.
    supporting_text: Protein preparations, in the presence of the endogenous peptide ligand ELA or a synthetic
      small molecule, both demonstrate these mixed stoichiometric states.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:24407481
  title: 'Toddler: an embryonic signal that promotes cell movement via Apelin receptors.'
  findings:
  - statement: Toddler promotes mesendodermal movement during zebrafish gastrulation via APJ.
    supporting_text: These results indicate that Toddler is an activator of APJ/Apelin receptor signaling,
      promotes gastrulation movements, and might be the first in a series of uncharacterized developmental
      signals.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; zebrafish.
- id: PMID:25995451
  title: Apela Regulates Fluid Homeostasis by Binding to the APJ Receptor to Activate Gi Signaling.
  findings:
  - statement: Apela binds APJ with Kd 0.51 nM and signals via Gi.
    supporting_text: Using a chimeric apela ligand, we showed direct binding of apela to APJ with high
      affinity (Kd = 0.51 nm) and the ability of apelin, the known peptide ligand for APJ, to compete
      for apela binding.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:26611206
  title: Characterization of apela, a novel endogenous ligand of apelin receptor, in the adult heart.
  findings:
  - statement: Apela increases contractility of isolated adult rat hearts.
    supporting_text: Using isolated adult rat hearts, we demonstrate, that just like the fellow receptor
      agonist apelin, apela increases cardiac contractility and induces coronary vasodilation already
      in the nanomolar level.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:28854362
  title: Loss of Apela Peptide in Mice Causes Low Penetrance Embryonic Lethality and Defects in Early
    Mesodermal Derivatives.
  findings:
  - statement: Mouse Apela loss causes low-penetrance cardiovascular defects.
    supporting_text: We found that loss of Apela results in low-penetrance cardiovascular defects that
      manifest after the onset of circulation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; mouse knockout.
