id: P0DMC3
gene_symbol: APELA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: APELA (ELABELA, Toddler) encodes a small secreted peptide hormone, processed from a signal-peptide
  precursor to ELA-32 and shorter fragments, that is an endogenous agonist of the apelin receptor APLNR
  (APJ). ELA binds APJ with sub-nanomolar affinity, competes with apelin, and signals through Gi (cAMP
  inhibition), ERK1/2 and beta-arrestin, causing receptor internalization. In zebrafish it is essential
  for endoderm differentiation, mesendodermal cell movement during gastrulation and heart formation. In
  mice its loss causes cardiovascular and vascular-remodeling defects, and placenta-derived ELA prevents
  preeclampsia-like disease by supporting placental angiogenesis. In adults ELA circulates in plasma,
  increases cardiac contractility and vasodilation, induces angiogenesis in endothelial cells, and in
  rats regulates fluid homeostasis.
