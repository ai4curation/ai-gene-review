suggested_questions:
- question: >-
    The definition of GO:0060183 apelin receptor signaling pathway says the pathway is
    "initiated by apelin binding to its receptor". Should it be broadened to any ligand
    binding APLNR, so that it applies cleanly to ELABELA, the second endogenous ligand?
- question: >-
    ELA-32, ELA-21, ELA-14 and ELA-11 have different receptor affinity and beta-arrestin
    potency, but only ELA-32 is represented as a UniProt chain. Which forms exist endogenously
    in human plasma and tissues, and which protease(s) generate them? Should the shorter forms
    be added as PRO_ chains (and then as CLEAVAGE_PRODUCT functional isoforms)?
- question: >-
    What is the alternative cell-surface receptor through which ELA sustains human embryonic
    stem cell self-renewal via PI3K/AKT/mTORC1 in cells that lack APLNR?
suggested_experiments:
- hypothesis: >-
    ELA supports hESC self-renewal through a receptor other than APLNR.
  description: >-
    Use ligand-receptor capture (e.g. photo-crosslinking ELA-32 derivatives followed by mass
    spectrometry) or a pooled CRISPR knockout screen for loss of ELA-dependent AKT
    phosphorylation in APLNR-negative hESCs to identify the receptor.
- hypothesis: >-
    Endogenous circulating ELA is processed to shorter forms with biased APLNR signalling.
  description: >-
    Immunoaffinity enrichment and targeted LC-MS/MS of ELA peptides from human plasma and
    placenta, followed by cAMP and beta-arrestin assays of the identified forms.
