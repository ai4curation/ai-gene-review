core_functions:
- description: Secreted peptide hormone that binds the apelin receptor (APLNR) with high affinity and
    activates Gi, ERK1/2 and beta-arrestin signalling, essential for embryonic heart development and acting
    in adult cardiovascular and placental physiology.
  molecular_function:
    id: GO:0005179
    label: hormone activity
  directly_involved_in:
  - id: GO:0060183
    label: apelin receptor signaling pathway
  - id: GO:0007507
    label: heart development
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:24316148
    supporting_text: We report here the discovery and characterization of a gene, ELABELA (ELA), encoding
      a conserved hormone of 32 amino acids.
  - reference_id: PMID:25995451
    supporting_text: Using a chimeric apela ligand, we showed direct binding of apela to APJ with high
      affinity (Kd = 0.51 nm) and the ability of apelin, the known peptide ligand for APJ, to compete
      for apela binding.
  - reference_id: PMID:28137936
    supporting_text: ELA competed for binding of apelin in human heart with overlap for the 2 peptides
      indicated by in silico modeling.
  - reference_id: PMID:28137936
    supporting_text: These results show that ELA is an endogenous agonist of the human apelin receptor,
      exhibits a cardiovascular profile comparable to apelin
  - reference_id: PMID:25995451
    supporting_text: Apela, similar to apelin, acts through the inhibitory G protein pathway by inhibiting
      forskolin-stimulated cAMP production and by inducing ERK1/2 phosphorylation.
  - reference_id: PMID:24316148
    supporting_text: Loss of Ela causes embryos to develop with a rudimentary heart or no heart at all,
      surprisingly phenocopying the loss of the apelin receptor (aplnr), which we show serves as Ela's
      cognate G protein-coupled receptor.
proposed_new_terms: []
suggested_questions:
- question: Which processed forms of the ELA precursor (ELA-32, ELA-11 and other furin or plasma fragments)
    carry hormone activity in vivo?
- question: Does the APELA locus act through its RNA as well as its peptide? The affinage record cites
    a mouse ES-cell study reporting an RNA-level role in p53 regulation.
- question: Does ELA act during mammalian gastrulation as Toddler does in zebrafish, or is its mouse role
    confined to later cardiovascular and extraembryonic development?
suggested_experiments:
- description: Compare ELA-32 and ELA-11 for Gi versus beta-arrestin bias at human APLNR in cardiomyocytes
    and endothelial cells.
