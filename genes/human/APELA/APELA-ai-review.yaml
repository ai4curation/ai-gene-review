core_functions:
- description: >-
    Secreted peptide hormone that is an endogenous agonist of the Gi-coupled apelin receptor
    APLNR. The mature peptide (ELA-32, and shorter C-terminal forms) binds APLNR in the
    extracellular space and activates it, inhibiting adenylyl cyclase to lower cAMP,
    stimulating ERK1/2, recruiting beta-arrestin and driving receptor internalization.
    Developmental and cardiovascular roles (mesendoderm migration, heart and coronary vessel
    formation, placental angiogenesis, cardiac contractility) are downstream of this activity.
  supported_by:
  - reference_id: PMID:28137936
    supporting_text: ELA competed for binding of apelin in human heart with overlap for
      the 2 peptides indicated by in silico modeling.
  - reference_id: PMID:28137936
    supporting_text: ELA-mediated inhibition of cAMP production confirmed as pertussis toxin
      sensitive
  - reference_id: PMID:25639753
    supporting_text: Thus, ELA's effects on intracellular signaling were APJ-dependent.
  - reference_id: PMID:28137936
    supporting_text: ELA and apelin were detectable in healthy human plasma at 0.34
  molecular_function:
    id: GO:0005179
    label: hormone activity
  directly_involved_in:
