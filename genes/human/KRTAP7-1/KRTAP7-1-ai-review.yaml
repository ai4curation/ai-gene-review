id: Q8IUC3
gene_symbol: KRTAP7-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Keratin-associated protein 7-1 (KAP7.1) is an 87-residue high glycine-tyrosine (HGT) keratin-associated protein, the sole member of the KAP7 family, encoded in the chromosome 21q22.1 KAP gene domain. It is expressed in the upper portion of the hair cortex. HGT KAPs are among the first KAPs expressed in the follicle after the hair keratins and are deposited into the interfilamentous matrix that surrounds trichocyte keratin intermediate filaments, contributing to the mechanical properties of the keratinized hair shaft. The ovine gene is highly conserved, and its variation has been associated with wool yield and staple length.
