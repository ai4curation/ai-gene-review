- term: &id002
    id: GO:0030281
    label: structural constituent of cutaneous appendage
  evidence_type: TAS
  original_reference_id: PMID:16939781
  review:
    summary: Proposed structural molecular function for KRTAP7-1 as a hair keratin-associated matrix protein.
    action: NEW
    reason: Keratin-associated proteins are the structural matrix proteins of the hair fibre that stabilise it by disulfide cross-linking with hair keratins. Structural constituent of cutaneous appendage (GO:0030281; contributes to the structural integrity of hairs) is the specific GO MF for this role. Related paralogues receive only the generic structural molecule activity by IEA.
    supported_by:
    - *id001
    - reference_id: PMID:29391282
      supporting_text: KAPs are the major constituent of the matrix between the hair keratin intermediate filaments (IFs), and stabilise hair structure by extensive disulfide bonding.
    - reference_id: PMID:18721477
      supporting_text: 'KRTAP contains two major groups: high/ultrahigh cysteine (HS) and high glycine-tyrosine (HGT) that are considered to have originated independently, and are essential for the formation of rigid and resistant hair shafts through their extensive disulfide bond cross-linking with the abundant cysteine residues of hair keratins or hydrophobic interactions with keratins [23,26-28].'
- term: &id003
    id: GO:0031424
    label: keratinization
  evidence_type: TAS
  original_reference_id: PMID:16939781
  review:
    summary: Proposed involvement of KRTAP7-1 in keratinization of the hair shaft.
    action: NEW
    reason: 'Participation test: KAPs supply structure to the keratinizing hair cell, becoming covalently cross-linked with keratin filaments in the keratogenous zone to form the cornified hair shaft. Comparator check: the trichocyte keratins (e.g. KRT81, KRT85, KRT86) carry keratinization by IBA and the KAP6 paralogues KRTAP6-1/6-2/6-3 carry it by IEA.'
    supported_by:
    - reference_id: Reactome:R-HSA-6809663
      supporting_text: In the lower and middle cortex, keratin filaments are embedded in a matrix that consists of KAPs.
    - reference_id: PMID:18721477
      supporting_text: 'KRTAP contains two major groups: high/ultrahigh cysteine (HS) and high glycine-tyrosine (HGT) that are considered to have originated independently, and are essential for the formation of rigid and resistant hair shafts through their extensive disulfide bond cross-linking with the abundant cysteine residues of hair keratins or hydrophobic interactions with keratins [23,26-28].'
- term: &id004
    id: GO:0045095
    label: keratin filament
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-6809663
  review:
    summary: Proposed location of KRTAP7-1 with hair keratin filaments, as for other KAP family members.
    action: NEW
    reason: KAPs form the interfilamentous matrix that is cross-linked to hair keratin intermediate filaments. Most KRTAP paralogues already carry keratin filament from the InterPro KAP signature; this gene lacks that signature match but belongs to the same functional class. GO has no separate term for the keratin-associated matrix, so keratin filament is the closest location.
    supported_by:
    - *id001
    - reference_id: Reactome:R-HSA-6809663
      supporting_text: In the lower and middle cortex, keratin filaments are embedded in a matrix that consists of KAPs.
    - reference_id: PMID:18721477
      supporting_text: In the hair cortex, hair keratins IFs are embedded in an in interfilamentous matrix, which consists of hair keratin-associated proteins (KATAP, usually abbreviated as KAP) [26].
