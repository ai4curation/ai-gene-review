core_functions:
- description: 'KRTAP7-1 is a high glycine-tyrosine (HGT) KAP7 family keratin-associated protein that acts as a structural matrix component of the hair fibre: it is deposited between trichocyte keratin intermediate filaments in the keratinizing zone and becomes cross-linked to them, mainly through disulfide bonds (HS/UHS KAPs) or additional non-covalent interactions (HGT KAPs), giving the hair shaft its rigidity and resistance.'
  molecular_function: *id002
  directly_involved_in:
  - *id003
  locations:
  - *id004
  anatomical_locations:
  - id: UBERON:0002077
    label: cortex of hair
  supported_by:
  - *id001
  - reference_id: PMID:18721477
    supporting_text: 'KRTAP contains two major groups: high/ultrahigh cysteine (HS) and high glycine-tyrosine (HGT) that are considered to have originated independently, and are essential for the formation of rigid and resistant hair shafts through their extensive disulfide bond cross-linking with the abundant cysteine residues of hair keratins or hydrophobic interactions with keratins [23,26-28].'
  - reference_id: file:human/KRTAP7-1/KRTAP7-1-uniprot.txt
    supporting_text: Expressed in the upper portion of the hair cortex.
suggested_questions:
- question: What does a single-member, highly conserved HGT family (KAP7) contribute to the matrix that the large HGT families do not?
- question: GO lacks a cellular component term for the keratin-associated interfilamentous matrix of the hair cortex/cuticle; should one be requested, as keratin filament is only an approximation?
suggested_experiments:
- hypothesis: KAP7.1 binds trichocyte keratin intermediate filaments.
  description: Co-sedimentation of recombinant KAP7.1 with assembled K31/K85 filaments and ITC with keratin head domains.
  experiment_type: binding assay
