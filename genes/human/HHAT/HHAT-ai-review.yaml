  review:
    summary: Buglino and Resh developed an in vitro Shh palmitoylation assay, purified Hhat to homogeneity
      with it, and showed directly that the enzyme attaches palmitate via an amide linkage to the N-terminal
      cysteine of Shh, with kinetic parameters (KM 1.25 uM for SHH, 3 uM for hexadecanoyl-CoA) recorded
