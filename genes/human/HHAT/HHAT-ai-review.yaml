- term:
    id: GO:0018009
    label: N-terminal peptidyl-L-cysteine N-palmitoylation
  evidence_type: IDA
  original_reference_id: PMID:34112694
  qualifier: involved_in
  review:
    summary: 'GO:0018009 names the exact chemistry HHAT performs: ''The covalent attachment of a palmitoyl
      group to a nitrogen (N) atom in an N-terminal cysteine residue to form N-palmitoyl-L-cysteine''.
      Human HHAT has no row for it. Its closest relatives both do: Drosophila rasp (UniProtKB:Q9VZU2,
      the other representative member of PANTHER family PTHR13285 in the Hedgehog module) carries it with
      two IDA rows and an IMP row, and mouse Hhat (UniProtKB:Q8BMT9) carries it by ISO with WITH/FROM
      UniProtKB:Q5VTY9 - that is, transferred from human HHAT.'
    action: NEW
    reason: 'Proposed after both tests. Participation: HHAT catalyses the step, and the term''s ancestors
      (GO:0018345 protein palmitoylation, GO:0006498 N-terminal protein lipidation, GO:0043543 protein
      acylation) are attachment processes, which name the enzyme that does the attaching rather than the
      substrate that receives it - the mirror image of the Drosophila hh case, where the ligand is the
      substrate and the acyltransferase activity is not the ligand''s function. Comparator check: rather
      than a systematic absence signalling a convention, the term is present on rasp with three experimental
      rows and on mouse Hhat by transfer from human HHAT itself, so a curator has already judged that
      the human protein has this function and the human row is snapshot lag. Non-redundancy: GO:0018009
      is neither an ancestor nor a descendant of GO:0051604 protein maturation, of GO:0045880, or of any
      molecular-function term on this record. It is the only NEW row proposed here; the reported palmitoyl-CoA
      conduit activity was deliberately not proposed, because no MBOAT in this family carries a transport
      term in any species and the 2021 structures recast the movement as substrate access to a membrane-embedded
      active site.'
    additional_reference_ids:
    - PMID:18534984
    - PMID:31875564
    supported_by:
    - *id016
    - *id008
    - *id014
    - *id004
