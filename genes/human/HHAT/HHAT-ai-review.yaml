core_functions:
- description: 'N-terminal palmitoylation of the Hedgehog morphogens. HHAT transfers palmitate from palmitoyl-CoA
    onto the alpha-amino group of the N-terminal cysteine of autoprocessed Sonic, Desert and Indian Hedgehog,
    forming an amide bond, with Asp339 and His379 as the catalytic residues and a bound heme b required
    for activity. Catalysis happens inside the ER membrane: palmitoyl-CoA reaches the reaction chamber
    from the cytosolic leaflet and the Hedgehog peptide from the lumen, and the enzyme also promotes movement
    of palmitoyl-CoA to the luminal side. The reaction is the last covalent step of Hedgehog ligand maturation,
    after autocleavage and autocholesterylation, and the palmitate it installs is what the receptor Patched
    reads - which is why the modification is required for Hedgehog signalling at both ranges and why HHAT,
    which never touches the receptor, counts as a positive regulator of the pathway rather than a component
    of it. Substrate selectivity is essentially absolute for the Hedgehog N-terminal CGPGR motif.'
