- term:
    id: GO:0045880
    label: positive regulation of smoothened signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:18534984
  qualifier: involved_in
  review:
    summary: Buglino and Resh established Hhat as the Shh palmitoyl acyltransferase in the same work that
      frames palmitoylation as critical for effective Shh signalling at both short and long range.
    action: ACCEPT
    reason: 'Accepted as a core role, and the reasoning matters because HHAT is not a pathway component.
      HHAT never contacts the receptor and acts before the ligand is released, so a bare GO:0007224 smoothened
      signaling pathway row would be an over-annotation. But HHAT does perform the act that raises pathway
      output: it covalently converts the ligand into its high-activity form, and the palmitate it installs
      is read directly by Patched1. The regulation branch is exactly how GO expresses an entity that acts
      on a pathway from outside it, and the work of that regulation - the palmitoyl transfer - is HHAT''s
      own chemistry, so the participation test is satisfied by the enzyme rather than by its substrate.
      Note that the human record''s use of the regulation term is preferable to the mouse and fly records,
      which carry GO:0007224 and GO:0007225 respectively.'
    supported_by:
    - reference_id: PMID:18534984
      supporting_text: Palmitoylation of Sonic Hedgehog (Shh) is critical for effective long- and short-range
        signaling.
      reference_section_type: ABSTRACT
