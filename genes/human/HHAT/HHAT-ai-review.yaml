proposed_new_terms:
- proposed_name: protein-cysteine N-palmitoyltransferase activity
  proposed_definition: Catalysis of the transfer of a palmitoyl (systematic name, hexadecanoyl) group
    to the nitrogen atom of the alpha-amino group of an N-terminal cysteine residue of a protein, in the
    reaction hexadecanoyl-CoA + N-terminal L-cysteinyl-[protein] = CoA + N-terminal N-hexadecanoyl-L-cysteinyl-[protein]
    + H(+).
  justification: 'GO has no molecular-function term for N-terminal-cysteine N-palmitoylation, although
    it distinguishes the linkage on the process side (GO:0018009 N-terminal peptidyl-L-cysteine N-palmitoylation
    versus GO:0018230 peptidyl-L-cysteine S-palmitoylation). The only available MF term, GO:0019706 protein-cysteine
    S-palmitoyltransferase activity, is defined as transfer to a sulfur atom, which is not the reaction
    HHAT catalyses: HHAT forms an amide bond to the alpha-amino group, shown biochemically and resolved
    as density for the amide linkage in the product cryo-EM structure. The existing N-palmitoyltransferase
    terms (GO:0018031, GO:0140771, GO:0140772) are all peptidyl-lysine N6, and GO:0140186 protein N-acyltransferase
    activity is likewise defined on lysine N6. The proposed name is the one both UniProt and PANTHER already
    use for this protein - UniProt''s recommended name is Protein-cysteine N-palmitoyltransferase HHAT
    and PANTHER''s subfamily PTHR13285:SF20 is PROTEIN-CYSTEINE N-PALMITOYLTRANSFERASE HHAT - and the
    reaction is already encoded as RHEA:59528, with RHEA:59580 for the cholesterylated substrate. Adding
    the term would let HHAT, mouse Hhat and Drosophila Rasp be annotated to their actual chemistry, and
    would give GOAT and Porcupine, the other protein-acylating MBOATs, a correctly-typed sibling branch.
    Until it exists, GO:0019706 is retained on this record as the closest available term.'
  proposed_parent:
    id: GO:0016409
    label: palmitoyltransferase activity
  supported_by:
  - *id008
  - *id016
  - *id006
  - reference_id: file:human/HHAT/HHAT-uniprot.txt
    supporting_text: 'RecName: Full=Protein-cysteine N-palmitoyltransferase HHAT'
suggested_questions:
- question: Is HHAT's reported palmitoyl-CoA uptake activity a distinct transport function or simply substrate
    access to the membrane-embedded active site? Liposome reconstitution showed uptake is intrinsic to
    HHAT and separable from catalysis, yet the cryo-EM structures describe an internal archway feeding
    the reaction chamber, and no MBOAT in PANTHER family PTHR13285 carries a transport annotation in any
    species. Resolving this would determine whether a transporter-activity annotation is warranted, and
    whether GO needs a term for it - the nearest existing MF term, GO:0015607, is ABC-type and does not
    apply.
- question: Should GO gain a molecular-function term for N-terminal-cysteine N-palmitoylation? The process
    side already distinguishes GO:0018009 from GO:0018230, and the reaction is encoded as RHEA:59528,
    but the only available MF term (GO:0019706) specifies transfer to a sulfur atom. The same gap affects
    mouse Hhat, Drosophila Rasp and, by analogy, the other protein-acylating MBOATs GOAT and Porcupine.
- question: Does HHAT have any function in the Golgi, or is the Golgi pool simply enzyme in transit or
    following its substrate? The Golgi assignment rests on a curator-inferred co-localization with SHH
    (ECO:0000305 on PubMed:18534984), while all catalytic characterisation places the active site in the
    ER membrane.
- question: HHATL sits in the same PANTHER family and retains the fold, and the PAINT slice records an
    explicit IRD negating acyltransferase activity in its branch. What does HHATL actually do, and does
    it regulate HHAT - for instance by competing for palmitoyl-CoA or for Hedgehog substrate in the ER
    membrane?
suggested_experiments:
- hypothesis: Palmitoyl-CoA movement across the ER membrane by HHAT is part of substrate delivery to the
    buried active site, not net transport of a cargo released into the lumen.
  description: In reconstituted liposomes, compare wild-type HHAT with catalytically dead active-site
    mutants (D339A, H379A) and with archway mutants, measuring (i) palmitoyl-CoA accumulation in the lumen
    in the absence of any Hedgehog acceptor and (ii) release of intact palmitoyl-CoA from the luminal
    compartment. Net luminal accumulation of free palmitoyl-CoA without an acceptor would support a genuine
    transport function; accumulation only as acylated product would support substrate access.
  experiment_type: liposome reconstitution with donor-tracking
- hypothesis: The ER membrane is the only compartment in which HHAT is catalytically competent.
  description: Retarget HHAT with ER-exit and Golgi-retention signals in HHAT-null cells and assay SHH
    palmitoylation stoichiometry by click chemistry or mass spectrometry, alongside Hedgehog reporter
    output. If Golgi-restricted HHAT cannot palmitoylate SHH, the Golgi annotation is transit rather than
    a site of action.
  experiment_type: compartment retargeting with quantitative palmitoylation readout
- hypothesis: HHAT is dedicated to Hedgehog proteins, so the N-terminal CGPGR motif is a sufficient acylation
    determinant and no other cellular substrate exists.
  description: Combine an unbiased palmitoyl-proteomics comparison of HHAT-null and rescued cells with
    a designed panel of reporter proteins in which the CGPGR consensus is grafted onto unrelated secreted
    proteins, and quantify N-palmitoylation of each. This would either confirm exclusive Hedgehog selectivity
    or identify substrates that current annotation misses.
  experiment_type: palmitoyl-proteomics plus designed substrate panel
- hypothesis: HHATL modulates HHAT activity in the ER membrane rather than acting as an independent acyltransferase.
  description: Test HHATL for Hedgehog palmitoylation with purified protein and in cells, and assay whether
    co-expression or co-reconstitution of HHATL changes HHAT kinetics, palmitoyl-CoA occupancy or Hedgehog
    output. This would put the PAINT IRD call on the HHATL branch on an experimental footing and clarify
    whether HHATL belongs in the Hedgehog module at all.
  experiment_type: paralog activity and interference assay
