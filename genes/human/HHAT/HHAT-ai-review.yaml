      genome-scale yeast two-hybrid screens. No follow-up assay and no functional consequence is reported
      for the pair.
    action: REMOVE
    reason: Bare GO:0005515 carries no functional information. The policy is to modify such a row when
      the cited paper supports a more informative molecular function and otherwise to remove it; here
      there is nothing to modify to, because syntenin-1 appears nowhere in the described HHAT mechanism
      - HHAT's characterised partners are its substrates (Hedgehog proteins and palmitoyl-CoA) and its
      heme cofactor - and the HuRI authors state explicitly that function does not follow from detection.
      Removal is a judgement about the annotation's informativeness, not a claim that the interaction
      is false. HHAT's informative molecular function is captured by GO:0019706 and GO:0016409.
