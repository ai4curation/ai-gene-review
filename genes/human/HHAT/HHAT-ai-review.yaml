id: Q5VTY9
gene_symbol: HHAT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'HHAT (Hedgehog acyltransferase) is a polytopic endoplasmic-reticulum membrane enzyme of
  the membrane-bound O-acyltransferase (MBOAT) superfamily, and the enzyme that lipidates the Hedgehog
  morphogens. It transfers palmitate from palmitoyl-CoA onto the alpha-amino group of the N-terminal cysteine
  exposed by autoprocessing of the Sonic, Desert and Indian Hedgehog precursors, forming an amide rather
  than a thioester bond, and it recognises the conserved Hedgehog N-terminal CGPGR motif with such selectivity
  that Hedgehog proteins are thought to be its only substrates. The protein comprises ten transmembrane
  helices and two reentrant loops, with the catalytic aspartate and histidine on opposite faces of the
  bilayer and a bound heme b that is required for activity; the active site is embedded in the membrane
  and receives palmitoyl-CoA from the cytosolic leaflet through an internal archway while the Hedgehog
  peptide enters from the ER lumen, so the enzyme brings together two chemically dissimilar substrates
  from opposite sides of the membrane. HHAT has also been reported to promote net movement of palmitoyl-CoA
  to the luminal side of the ER membrane, an activity separable from catalysis in reconstituted liposomes.
  The palmitate HHAT installs is not decoration: together with the C-terminal cholesterol added by Hedgehog
  autoprocessing it makes the dually lipidated ligand, and the palmitoyl chain is read directly by the
  receptor Patched, so palmitoylation is required for both short- and long-range Hedgehog signalling.
  HHAT is therefore a positive regulator of the pathway that acts entirely upstream of it, on the ligand
  rather than within the signalling cascade. Loss-of-function variants cause Nivelon-Nivelon-Mabille syndrome,
  an autosomal recessive disorder with progressive microcephaly, cerebellar vermis hypoplasia, skeletal
  dysplasia and, in some individuals, 46,XY gonadal dysgenesis; the enzyme is also a drug target in Hedgehog-dependent
  cancers, and small molecules such as IMP-1575 inhibit it by occluding the substrate site. Its closest
  paralog, HHATL, retains the fold but has lost acyltransferase activity, and its Drosophila counterpart
  is Rasp.'
