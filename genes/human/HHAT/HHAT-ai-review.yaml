    reason: The defining molecular function of HHAT, demonstrated directly for the human enzyme by four
      independent studies using biochemistry, reconstitution and two cryo-EM structures, and encoded by
      UniProt as RHEA:59528. One caveat is recorded rather than acted on. GO:0019706 is defined as transfer
      of a palmitoyl group to a sulfur atom on a protein cysteine, whereas HHAT forms an amide bond to
      the alpha-amino group of the N-terminal cysteine - UniProt names the protein Protein-cysteine N-palmitoyltransferase
      HHAT and PANTHER names its subfamily PTHR13285:SF20 the same way. GO currently has no molecular-function
      term for N-terminal-cysteine N-palmitoylation (the N-palmitoyltransferase terms it does have, GO:0018031,
      GO:0140771 and GO:0140772, are all peptidyl-lysine N6), so GO:0019706 is the closest available term
      and the curators had no better option. The gap is recorded in proposed_new_terms instead of being
      papered over with a wrong MODIFY, and the correct-chemistry process term GO:0018009 is added as
      a NEW row.
