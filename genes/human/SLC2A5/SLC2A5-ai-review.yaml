id: P22732
gene_symbol: SLC2A5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC2A5 (GLUT5) is a 12-transmembrane-helix member of the major facilitator
  superfamily (SLC2/GLUT class II) that acts as a fructose-specific facilitative transporter.
  It mediates the energy-independent, Na+-independent facilitated diffusion of D-fructose
  across the plasma membrane and has only low activity toward other monosaccharides;
  fructose transport is insensitive to cytochalasin B, which distinguishes it from the
  glucose-transporting GLUT1-4. GLUT5 is concentrated on the apical (brush-border) membrane
  of small-intestinal enterocytes, where it is the principal route of dietary fructose
  absorption; it is also present on the basolateral membrane of human jejunum and is expressed
  at lower levels in kidney, skeletal muscle (sarcolemma), adipose tissue and testis/spermatozoa.
  Substrate selectivity is governed by a conserved hydrophobic NXI motif in transmembrane
  helix 7. Through its control of intestinal fructose uptake, GLUT5 also contributes to
  fructose-driven physiological responses including, in rodents, salt reabsorption and
  dietary-fructose-induced hypertension.
