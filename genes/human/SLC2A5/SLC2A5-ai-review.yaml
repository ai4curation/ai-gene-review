    summary: Phylogenetic assignment of D-glucose transmembrane transporter activity, propagated
      from the class I GLUT node (PTN008599990, the GLUT1-4 glucose-transporter clade) and its
      glucose-transporting donors (GLUT1 P11166, GLUT3 P11169, GLUT4 P14672, GLUT2 P11168).
