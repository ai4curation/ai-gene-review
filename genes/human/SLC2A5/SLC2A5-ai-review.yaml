  review:
    summary: Electronic transfer from the mouse ortholog (Q9WV38) of a role in fructose-dependent
      regulation of blood pressure. Mouse studies link GLUT5-mediated intestinal/renal fructose
      handling to salt reabsorption and dietary-fructose-induced hypertension.
    action: KEEP_AS_NON_CORE
