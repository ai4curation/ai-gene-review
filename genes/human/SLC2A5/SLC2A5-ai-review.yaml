proposed_new_terms: []
suggested_questions:
- question: What is the physiological relevance, if any, of GLUT5's low-efficiency 2-deoxyglucose
    uptake, and does any tissue context make glucose handling by GLUT5 biologically meaningful?
- question: How is GLUT5 trafficking between apical and basolateral enterocyte membranes regulated
    (e.g. by RAB11A and by dietary fructose), and does basolateral GLUT5 export fructose into the
    circulation?
suggested_experiments:
- description: Quantitative radiotracer flux comparison of D-fructose versus D-glucose and
    dehydroascorbic acid transport by purified or reconstituted human GLUT5 versus GLUT1-4, to
    bound the magnitude (if any) of non-fructose substrate transport under matched conditions.
- description: Apical and basolateral surface-biotinylation and live-imaging of endogenously tagged
    GLUT5 in polarized human enterocyte organoids under varying luminal fructose, to resolve the
    functional contribution of each membrane pool and the role of RAB11A.
