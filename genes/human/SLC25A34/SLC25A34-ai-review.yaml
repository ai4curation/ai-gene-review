    summary: Inner-membrane location is consistent with the carrier fold and six transmembrane helices.
    action: ACCEPT
    reason: >-
      The UniProt location is by similarity rather than from a direct assay on
      the human protein, but two independent lines agree: SLC25A34 has the three
      mitochondrial-carrier repeats and six transmembrane helices of the SLC25
      family, whose members reside in the inner membrane, and it functionally
      replaces the yeast inner-membrane carrier Oac1p in alpha-isopropylmalate
      export. The term is a sub-compartment, not a root organelle term, and is as
      specific as the evidence allows.
