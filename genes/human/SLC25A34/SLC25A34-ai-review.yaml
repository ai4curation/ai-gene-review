knowledge_gaps:
- gap_statement: The physiological substrate(s) and exchange partner of SLC25A34 in human mitochondria
    are unknown.
  boundary: The only functional data are partial rescue of a yeast alpha-isopropylmalate export mutant;
    the human protein could not be expressed for reconstitution, and humans do not make
    alpha-isopropylmalate.
