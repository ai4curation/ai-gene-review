suggested_questions:
- question: Which dicarboxylates or sulfur oxoanions does SLC25A34 exchange across the human inner
    mitochondrial membrane, and how does its substrate range differ from its paralog SLC25A35?
suggested_experiments:
- description: Express SLC25A34 in a eukaryotic or cell-free system suited to membrane proteins,
    reconstitute it into liposomes and screen homo- and hetero-exchange of candidate dicarboxylates,
    oxaloacetate and sulfate.
