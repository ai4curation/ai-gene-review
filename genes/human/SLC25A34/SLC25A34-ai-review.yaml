  label: Homo sapiens
description: >-
  SLC25A34 is a member of the mitochondrial carrier (SLC25) family, with three
  mitochondrial-carrier repeats and six predicted transmembrane helices, and is
  placed in the mitochondrial inner membrane by similarity. Its closest yeast
  relative is the mitochondrial oxaloacetate carrier Oac1p, which exports
  alpha-isopropylmalate for leucine biosynthesis. When expressed in a yeast
  oac1 leu4 double mutant, SLC25A34 partially restored growth without leucine,
  indicating that it can move alpha-isopropylmalate across the inner membrane.
  Humans do not make leucine, so its physiological substrate is unknown; UniProt
  describes it as a putative antiporter for dicarboxylates and sulfur oxoanions.
