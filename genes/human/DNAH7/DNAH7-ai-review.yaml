  review:
    summary: Family-level PAINT inference of dynein intermediate chain binding.
    action: UNDECIDED
    reason: >-
      Single-headed inner arm species such as IDAb and IDAe are not known to contain dynein
      intermediate chains (these belong to the outer arm and the two-headed IDAf/I1 complex),
