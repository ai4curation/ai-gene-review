id: Q8WXX0
gene_symbol: DNAH7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  DNAH7 (dynein axonemal heavy chain 7, also hDHC2) is a 4024-residue heavy chain of single-headed
  inner dynein arms (IDAs) in motile cilia and sperm flagella. Like other axonemal dynein
  heavy chains it has an N-terminal stem (tail) that docks it into the axoneme, and a C-terminal
  motor head of six AAA+ modules with a coiled-coil stalk that ends in a microtubule-binding
  domain; ATP hydrolysis in the head drives minus-end-directed force on the adjacent doublet
  microtubule. Cryo-EM of human respiratory doublet microtubules assigns DNAH7 as the heavy
  chain of two IDA species, IDAb and IDAe, within each 96-nm axonemal repeat. DNAH7 is induced
  during differentiation of airway multiciliated cells and lies along the length of respiratory
  cilia and the sperm flagellum. Its axonemal assembly depends on the CCDC39/CCDC40 molecular
  ruler, and in sperm it is depleted when radial spoke 1 (IQUB) is lost. Biallelic loss-of-function
  variants cause male infertility with asthenozoospermia or multiple morphological abnormalities
  of the sperm flagella (MMAF): patient sperm lose inner dynein arms, other IDA heavy chains
  (DNAH3, DNAH6) are reduced while outer-arm proteins are retained, and mitochondrial sheath
  defects can occur. UniProt records the disorder as primary ciliary dyskinesia 50 (CILD50),
  with sinopulmonary symptoms reported in addition to infertility. Fertility can be achieved
  by ICSI.
