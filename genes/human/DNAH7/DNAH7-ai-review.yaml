suggested_questions:
- question: >-
    Do DNAH7 loss-of-function patients have clinically significant respiratory disease? UniProt
    files the disorder as CILD50, but most reported cases were ascertained through infertility
    clinics; respiratory ciliary beat and nasal NO data in DNAH7-null individuals would clarify
    whether IDAb/e loss alone causes PCD.
- question: >-
    Do IDAb and IDAe (both DNAH7) differ in light-chain composition (centrin versus DNALI1/p28)
    in human axonemes, and does this explain the family-level light intermediate chain and
    intermediate chain binding annotations?
- question: >-
    Mouse has three Dnah7 paralogs (Dnah7a, Dnah7b, Dnah7c); is there redundancy that would
    mask a single-gene knockout phenotype, and which paralog corresponds functionally to human
    DNAH7?
suggested_experiments:
- description: >-
    High-speed videomicroscopy and cryo-ET of airway cilia from DNAH7-null individuals to
    test whether loss of IDAb/e alters ciliary waveform.
  experiment_type: ciliary beat analysis and cryo-electron tomography
- description: >-
    Recombinant DNAH7 motor domain in vitro motility and microtubule gliding assays to measure
    velocity and directionality.
  experiment_type: in vitro motility assay
