- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002048
  review:
    summary: >-
      InterPro EF-hand domain signature (IPR002048) mapped to calcium ion binding. The UniProt
      entry carries the IPR002048 cross-reference, but has no EF-hand domain feature and no
      calcium-binding site annotated in DNAH7.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      There is no experimental evidence that the DNAH7 heavy chain binds calcium. Calcium
      regulation of the centrin-containing single-headed IDAs is attributed to their centrin
      light chain, and IDAb/IDAe (DNAH7) resemble IDAg in this respect. A lone InterPro signature
      that UniProt does not place as an EF-hand feature is a weak basis for an MF annotation of a
      4000-residue motor.
    supported_by:
    - reference_id: PMID:37258679
      supporting_text: >-
        the motor domains of IDAb and IDAe are copies of IDAg, the other centrin-containing
        IDA
