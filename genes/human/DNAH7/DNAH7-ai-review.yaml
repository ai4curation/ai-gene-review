- term:
    id: GO:0003341
    label: cilium movement
  evidence_type: IMP
  original_reference_id: PMID:11877439
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      Zhang et al. (2002) identified DNAH7 by mass spectrometry as a protein missing from
      cilia of a PCD patient whose cilia lacked inner dynein arms. The patient's cells still
      synthesised DNAH7, so the primary genetic lesion was probably not in DNAH7 itself.
    action: ACCEPT
    reason: >-
      The original paper is not a DNAH7 loss-of-function study in the strict sense (DNAH7
      was "synthesized but not assembled"), and its full text is not cached. However, the
      acts_upstream_of_or_within qualifier is appropriate, and later DNAH7 loss-of-function
      patients (IDA loss, impaired flagellar motility, CILD50) independently support DNAH7
      acting in cilium movement. Deferring to the curator.
    supported_by:
    - reference_id: PMID:11877439
      supporting_text: >-
        In cilia from PCD cells, DNAH7 was undetectable, whereas intracellular DNAH7 was clearly
        present.
    - reference_id: PMID:34476482
      supporting_text: >-
        The spermatozoa from the patients with DNAH7 bi-allelic mutations showed specific
        losses in the inner dynein arms.
