- description: Proline-rich motifs bind SH3 domains, and tyrosine-phosphorylated KHDRBS1 binds SH2 domains, of Src-family
    kinases, PTK6 and other signalling proteins. These phosphorylation-dependent interactions regulate its RNA binding and
    splicing activity.
