id: Q07666
gene_symbol: KHDRBS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'KHDRBS1 (Sam68) is a STAR (signal transduction and activation of RNA) family RNA-binding protein with a central
  Qua1-KH-Qua2 domain flanked by proline-rich and arginine/glycine-rich regions and a C-terminal tyrosine-rich region. It
  is predominantly nuclear, concentrating in Sam68/SLM nuclear bodies, and binds bipartite UAAA/UUUA-containing sequences
  in pre-mRNAs as a homo-oligomer. Its main experimentally established role is regulation of alternative splicing: in human
  cells it promotes the pro-apoptotic Bcl-xS 5'' splice site in BCL2L1, inclusion of CD44 variable exons, and skipping of
  SMN2 exon 7, in part in cooperation with hnRNP A1. KHDRBS1 is also a major substrate of Src-family and BRK-family tyrosine
  kinases and of ERK and Cdk1. Phosphorylation creates SH2-binding sites, its proline-rich motifs bind SH3 domains, and phosphorylation
  generally lowers its RNA affinity, coupling receptor and cell-cycle signalling to RNA processing. It also promotes polysome
  association of some cytoplasmic mRNAs.'
