- term:
    id: GO:0000082
    label: G1/S transition of mitotic cell cycle
  evidence_type: TAS
  original_reference_id: PMID:9013542
  qualifier: involved_in
  review:
    summary: Based on a dominant-negative KH-domain-deleted isoform (Sam68DeltaKH) that blocks serum-induced DNA synthesis.
    action: MARK_AS_OVER_ANNOTATED
    reason: The evidence is an overexpression phenotype of a splice variant; it does not show that KHDRBS1 performs a step
      of the G1/S transition. Effects on proliferation are plausibly indirect, via post-transcriptional control of targets
      such as cyclin D1.
    supported_by:
    - reference_id: PMID:9013542
      supporting_text: Transfected Sam68DeltaKH inhibits serum-induced DNA synthesis and cyclin D1 expression.
- term:
    id: GO:0000086
    label: G2/M transition of mitotic cell cycle
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8UUW7
  review:
    summary: ISS transfer from chicken Sam68 (Q8UUW7), based on a knockout cell-cycle phenotype.
    action: MARK_AS_OVER_ANNOTATED
    reason: UniProt records a 'role in G2-M progression' by similarity, but no evidence shows KHDRBS1 executing a step of
      the G2/M transition; it is a substrate of mitotic kinases (Src, Cdk1) whose RNA binding is switched off in mitosis.
      That is regulation of KHDRBS1 by the cell cycle, not participation in it.
    supported_by:
    - &id003
      reference_id: PMID:36537190
      supporting_text: these phosphorylation events reduce the binding of Sam68 to RNA, control its cellular localization
        and reduce its alternative splicing activity
