core_functions:
- description: Sequence-specific binding of pre-mRNA/mRNA through the STAR (Qua1-KH-Qua2) domain, which directs alternative
    splice-site selection and exon inclusion or skipping in the nucleus (BCL2L1 5' splice site, CD44 variable exons, SMN2
    exon 7).
