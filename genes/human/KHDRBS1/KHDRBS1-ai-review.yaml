suggested_questions:
- question: Which of the KHDRBS1 splicing targets and RNA-binding specificities are conserved across the KHDRBS/Sam68-SLM
    clade (PTN000879731), including the insect SF140 paralogs that lack their own experimental data?
- question: Is the reported cell-surface receptor signalling 'adaptor' role a genuine signal-transmitting activity, or does
    KHDRBS1 act only as a phosphorylation substrate that receives the signal?
- question: Does KHDRBS1 promote nuclear export of any endogenous intron-retaining mRNA, given conflicting reporter data?
suggested_experiments:
- hypothesis: KHDRBS1 SH3/SH2-mediated interactions are dispensable for its splicing activity in unstimulated cells.
  description: Compare transcriptome-wide splicing (RNA-seq) in KHDRBS1-null cells rescued with WT, proline-motif-mutant,
    or tyrosine-to-phenylalanine mutant KHDRBS1.
