  - ZFIN:ZDB-GENE-990604-42
  review:
    summary: Rhodopsin is located in, and functions in, the rod photoreceptor outer segment.
    action: ACCEPT
    reason: The outer segment is where rhodopsin works. Immunogold EM of endogenous rhodopsin in mouse rods labels
      the outer segment discs heavily (PMID:25664179); in bovine rod outer segments it is the only major disc protein
      (PMID:2447095); mouse rods lacking opsin fail to form outer segments (PMID:9892703). Immunostaining assays
      resolve the outer segment, so the term is as precise as these rows' evidence; the disc membrane rows carry
      the sub-compartment. The IBA rests on a PAINT node in the opsin clade whose descendants (mouse, rat, bovine
      rhodopsins) carry direct evidence.
    supported_by: &id002
    - reference_id: PMID:25664179
      supporting_text: As predicted [44], the OS discs were heavily labeled by rhodopsin immunogolds
    - reference_id: PMID:2447095
      supporting_text: In disk membranes rhodopsin appeared as the only major protein
    - reference_id: PMID:9892703
      supporting_text: Retinas in mice lacking both opsin alleles initially developed normally, except that rod
        outer segments failed to form
