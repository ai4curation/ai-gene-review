      half the disc density (PMID:2447095), and GO:0042622 photoreceptor outer segment membrane (row 55) is an is_a
      descendant of plasma membrane. Rhodopsin''s signalling site, the sealed disc membrane, is not plasma membrane
      in GO. The two opsin 3 papers (PMID:31380578 dermal fibroblasts, PMID:31730232 epidermal melanocytes) are
      weak: antibody staining without a specificity control, in cells where rhodopsin has no established role; the
      melanocyte paper states a membrane location explicitly only for OPN3. They do not change the claim.'
