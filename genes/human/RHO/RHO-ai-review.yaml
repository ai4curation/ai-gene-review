        for the cilium
    - reference_id: PMID:19153612
      supporting_text: the newly identified ciliary targeting VxPx motif present in rhodopsin binds the small GTPase
        Arf4 and regulates its association with the trans-Golgi network (TGN), which is the site of assembly and
