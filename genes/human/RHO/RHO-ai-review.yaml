  qualifier: located_in
  review:
    summary: Rhodopsin is in the photoreceptor disc membrane; in this gene the rod-specific disc membrane.
    action: MODIFY
    reason: Correct, but RHO is the rod pigment and the gene already carries the is_a descendant GO:0120202 rod
      photoreceptor disc membrane (row 72), which the GO-CAM and the phototransduction module use. Immunogold EM
      of endogenous rhodopsin labels mouse rod discs (PMID:25664179); in bovine rods it is the only major disc protein
      (PMID:2447095). The Reactome events (chromophore binding, photoisomerization, GRK phosphorylation, transducin
      binding and activation, dephosphorylation) all occur in the rod disc.
