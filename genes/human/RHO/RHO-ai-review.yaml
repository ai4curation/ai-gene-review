core_functions:
- description: 'Light-activated G protein-coupled receptor of rod photoreceptors: photoisomerization of the bound
    chromophore converts rhodopsin to metarhodopsin II, which catalyses GDP-GTP exchange on rod transducin (GNAT1)
    in the disc membrane, initiating dim-light phototransduction.'
