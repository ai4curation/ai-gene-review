- term:
    id: GO:0005911
    label: cell-cell junction
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P15409
  - ensembl:ENSMUSP00000032471
  review:
    summary: Cell-cell junction, Ensembl Compara transfer from a mouse Rho row made on a T cell immunological synapse
      paper.
    action: REMOVE
    reason: The mouse donor row (MGI IDA, PMID:23793062, 2014-03-06) is one of a set of cell-cell junction annotations
      on T cell signalling and actin regulators (Lat, Lck, Zap70, Vav1, Was, Cdc42, Cfl1 and others) imaged at the
      immunological synapse; the paper concerns Rltpr/CD28 in T cells. No Rhoa row is among them, and in that context
      "Rho" means the Rho GTPase, not the rhodopsin gene whose mouse symbol is Rho. Rhodopsin has no known role
      at T cell junctions. Probable symbol collision at MGI, propagated to the human gene.
    supported_by:
    - reference_id: PMID:23793062
      supporting_text: Engagement of TCR-CD28 at the immunological synapse resulted in the colocalization of CD28
        with both wild-type and mutant Rltpr proteins
    source_defects:
    - defect_type: WRONG_GENE_PRODUCT
      resource: MGI
      record: UniProtKB:P15409
      slot: DB_Object_ID
      requested_change: CHECK
      asserted_value: UniProtKB:P15409
      cause: SYMBOL_COLLISION
      confidence: PROBABLE
      explanation: MGI annotated mouse rhodopsin (Rho, P15409) to GO:0005911 cell-cell junction (IDA, PMID:23793062,
        2014-03-06) among about 40 cell-cell junction rows on T cell signalling and actin-regulatory proteins at
        the immunological synapse. In that context the intended gene is very probably a Rho GTPase (e.g. Rhoa),
        not rhodopsin. Ensembl Compara propagated the row to human RHO (P08100). The paper's full text was not read,
        so the intended Rho family member is not identified.
      supported_by:
      - reference_id: PMID:23793062
        supporting_text: Engagement of TCR-CD28 at the immunological synapse resulted in the colocalization of CD28
          with both wild-type and mutant Rltpr proteins
