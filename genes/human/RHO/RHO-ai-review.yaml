- term:
    id: GO:0007601
    label: visual perception
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001760
  review:
    summary: Rhodopsin is required for visual perception, specifically dim-light (scotopic) vision.
    action: ACCEPT
    reason: 'Organism-level process for which the gene is essential: human carriers of the constitutively active
      G90D allele have rod absolute thresholds raised nearly three log units (PMID:7846071), and heterozygous knockout
      mouse rods are about half as sensitive (PMID:9892703). The row-32 IMP citation (PMID:8107847) is an in vitro
      activation study of the night-blindness allele; the claim stands.'
    supported_by: &id010
    - reference_id: PMID:7846071
      supporting_text: Absolute threshold for visual perception was elevated nearly 3 logarithmic units in 7 individuals
        tested (ages 11-64), indicating greatly compromised rod threshold signaling
    - reference_id: PMID:8107847
      supporting_text: the mutation Gly 90-->Asp (G90D) in the second transmembrane segment of rhodopsin, which
        causes congenital night blindness, also constitutively activates opsin
