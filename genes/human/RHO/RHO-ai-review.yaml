id: P08100
gene_symbol: RHO
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Rhodopsin is the visual pigment of vertebrate rod photoreceptors, a seven-transmembrane G protein-coupled
  receptor of the opsin family. The apoprotein (rod opsin) binds 11-cis-retinal covalently through a protonated
  Schiff base at Lys-296, forming a pigment that absorbs maximally near 496 nm. Photon absorption isomerizes the
  chromophore to all-trans-retinal, and the resulting active receptor (metarhodopsin II) catalyses GDP-GTP exchange
  on the rod transducin alpha subunit (GNAT1), initiating the cGMP cascade that hyperpolarizes the rod. Signalling
  is terminated by GRK1 phosphorylation of the C-terminal tail and arrestin (SAG) binding. Rhodopsin is synthesized
  in the rod inner segment, sorted at the trans-Golgi network through a C-terminal VxPx ciliary targeting motif
  that binds ARF4, carried through the connecting cilium, and packed at very high density into the disc membranes
  of the rod outer segment, which it is also required to build. It is essential for dim-light vision and rod survival;
  misfolding mutations such as P23H cause dominant retinitis pigmentosa, and constitutively active alleles such
  as G90D cause congenital stationary night blindness.
