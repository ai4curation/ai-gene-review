suggested_questions:
- question: Does PMID:11773008 (or another MGI-curated paper) actually show human rhodopsin in the Golgi apparatus,
    or should the three MGI IDA rows on PMID:11767049 be withdrawn rather than re-pointed?
- question: Is rhodopsin protein present and functional in non-retinal human cells (sperm, dermal fibroblasts, melanocytes),
    given that the published staining lacks knockout or knockdown controls in human cells?
suggested_experiments:
- hypothesis: Rhodopsin immunoreactivity in human dermal fibroblasts and melanocytes reflects genuine RHO protein.
  description: Stain cultured human fibroblasts and melanocytes with two independent rhodopsin antibodies after
    CRISPR knockout or siRNA knockdown of RHO, and confirm by targeted mass spectrometry, to test whether the reported
    plasma membrane signal is specific.
