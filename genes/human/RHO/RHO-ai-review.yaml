    supported_by: &id019
    - reference_id: PMID:25664179
      supporting_text: As predicted [44], the OS discs were heavily labeled by rhodopsin immunogolds
    - reference_id: PMID:2447095
      supporting_text: In disk membranes rhodopsin appeared as the only major protein
    - reference_id: Reactome:R-HSA-420883
