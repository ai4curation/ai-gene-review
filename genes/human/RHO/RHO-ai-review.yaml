  review:
    summary: Reactome places rhodopsin in the Golgi membrane as VxPx-motif cargo of the ARF4-ASAP1-RAB11 ciliary
      targeting complex at the trans-Golgi network.
    action: KEEP_AS_NON_CORE
    reason: Rhodopsin is a multi-pass membrane protein that transits the trans-Golgi network, where its C-terminal
      VxPx motif actively binds ARF4 and nucleates the ciliary targeting complex (frog retina, PMID:19153612). The
      location is real but transient and biosynthetic; the functional site is the outer segment disc membrane. Golgi
      membrane is as precise as these Reactome events allow.
