- term:
    id: GO:0005502
    label: 11-cis retinal binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:P02699
  review:
    summary: Rhodopsin binds its 11-cis-retinal chromophore covalently at Lys-296.
    action: ACCEPT
    reason: 'Core: chromophore binding makes the pigment and holds the receptor inactive in the dark. Shown for
      the bovine protein (crystal structure, PMID:10926528; the ISS source P02699) and for human opsin in cells,
      which regenerates with 11-cis-retinal (PMID:8253795) and forms pigment at Lys-296 (PMID:11284701).'
    supported_by:
    - reference_id: PMID:10926528
      supporting_text: The ground-state chromophore, 11-cis-retinal, holds the transmembrane region of the protein
        in the inactive conformation
    - reference_id: PMID:8253795
      supporting_text: Three of the mutant proteins (G51V, V345M, and P347S) resemble the wild type in yield, regenerability
        with 11-cis-retinal, and accumulation in the plasma membrane (class I)
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12754272
  qualifier: enables
  supporting_entities:
  - UniProtKB:P25686-3
  review:
    summary: Bare protein binding (DNAJB2 isoform HSJ1b, ZFYVE9/SARA, EDEM1, CD79A).
    action: REMOVE
    reason: 'GO:0005515 protein binding is uninformative. None of the four papers supports a specific molecular
      function of rhodopsin: in each, rhodopsin is the client or cargo of the partner (HSJ1b co-chaperone, PMID:12754272;
      SARA-mediated vesicle targeting, PMID:17693260; EDEM1 ER quality control of misfolded opsin, PMID:19934218)
      or a high-throughput yeast two-hybrid pair with no follow-up (CD79A, HuRI, PMID:32296183). The interactions
      are better captured on the partner genes. Removed as uninformative, not as false.'
    supported_by: &id006
    - reference_id: PMID:19934218
      supporting_text: EDEM1 was detected in rod photoreceptor inner segments and EndoH-sensitive rod opsin co-immunoprecipitated
        with EDEM1 from retina, suggesting that rod opsin is a physiological EDEM1 client
    - reference_id: PMID:17693260
      supporting_text: This membrane coupling is regulated by the FYVE domain-containing protein, SARA, through
        its direct interaction with PI3P, rhodopsin, and SNARE protein syntaxin 3
    - reference_id: PMID:12754272
      supporting_text: The expression of HSJ1b, but not HSJ1a, inhibited the normal cellular processing of wild-type
        rhodopsin-GFP, which co-localized with HSJ1b at the ER
