  review:
    summary: Rhodopsin acts in G protein-coupled opsin signalling (phototransduction); the specific pathway is transducin-mediated
      opsin signalling.
    action: MODIFY
    reason: 'Each of these terms (GPCR signaling pathway, phototransduction, phototransduction visible light, G
      protein-coupled opsin signaling pathway, cellular response to light stimulus) is a true ancestor of GO:0141190
      transducin-mediated opsin signaling pathway, which the gene already carries (row 73) and which names what
      rhodopsin does: activates rod transducin in response to light. Evidence is mostly on the bovine protein (native
      ROS membranes, PMID:31300275; cytoplasmic-loop mutants that fail to activate Gt, PMID:2218504, species not
      stated in the cached abstract); human rhodopsin couples to G proteins in a heterologous yeast system (PMID:30514708)
      and human G90D carriers have raised rod thresholds (PMID:7846071). PMID:1418997 (row 36) is a transgenic degeneration
      model that does not assay signalling, but the claim stands on the other evidence.'
    proposed_replacement_terms: &id008
    - id: GO:0141190
      label: transducin-mediated opsin signaling pathway
    supported_by: &id009
    - reference_id: PMID:31300275
      supporting_text: Rhodopsin (Rho), a prototypical G-protein-coupled receptor (GPCR) in vertebrate vision, activates
        the G-protein transducin (GT) by catalyzing GDP-GTP exchange on its α subunit (GαT)
    - reference_id: PMID:2218504
      supporting_text: Three mutant opsins with alterations in their cytoplasmic loops bound 11-cis-retinal to yield
        pigments with native rhodopsin absorption spectra, but they failed to stimulate the guanosine triphosphatase
        activity of Gt
    - reference_id: PMID:30514708
      supporting_text: we successfully engineered, for the first time, activation by human rhodopsin of the yeast
        mating pathway, resulting in signaling via a fluorescent reporter
