    supporting_text: our findings implicate MyD88 as a general adaptor/regulator molecule for the Toll/IL-1R
      family of receptors for innate immunity.
  - reference_id: PMID:16751103
    supporting_text: TIRAP then functions to facilitate MyD88 delivery to activated TLR4 to initiate signal
      transduction.
  - reference_id: PMID:38961291
    supporting_text: within most myddosomes, MyD88 forms barrel-like structures that function as scaffolds
      for effector protein recruitment.
- description: 'Signaling adaptor for IL-1 family cytokine receptors (IL-1R, IL-18R, IL-33R/ST2, IL-36R):
    binds the receptor TIR domains and recruits IRAK4, coupling the receptor to a serine/threonine kinase.'
