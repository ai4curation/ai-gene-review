core_functions:
- description: Forms the calcium-conducting pore of the mitochondrial calcium uniporter complex in 
    the inner membrane, moving Ca2+ into the mitochondrial matrix and thereby coupling cytosolic 
    calcium pulses to matrix calcium homeostasis.
  molecular_function:
    id: GO:0005262
    label: calcium channel activity
  directly_involved_in:
  - id: GO:0036444
    label: calcium import into the mitochondrion
  - id: GO:0051560
    label: mitochondrial calcium ion homeostasis
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:21685888
    supporting_text: 40-kDa protein identified is the channel responsible for 
      ruthenium-red-sensitive mitochondrial Ca(2+) uptake
  - reference_id: PMID:23755363
    supporting_text: These analyses establish that MCU encodes the pore-forming subunit of the 
      uniporter channel
  - reference_id: PMID:24231807
    supporting_text: uniplex recovered MICU1 and MICU2, MCU and its paralog MCUb, and essential MCU 
      regulator (EMRE)
proposed_new_terms: []
suggested_questions:
- question: Should GOA retire MCU annotations to GO:0015292 uniporter activity now that GO:0005262 
    calcium channel activity captures the pore activity at both the direct and PAINT levels?
- question: Which MCU-dependent downstream cell responses, such as beta-cell insulin secretion and 
    neutrophil chemotaxis, should remain as non-core GO rows rather than pathway-model context?
suggested_experiments:
- description: Use endogenous tagging and patch-clamp of human disease-relevant cell types to 
    quantify how changing MCUB incorporation changes the number and conductance of MCU-containing 
    uniplex channels.
  experiment_type: endogenous tagging / mitoplast electrophysiology
  hypothesis: MCUB reduces mitochondrial Ca2+ uptake by replacing MCU within the inner-membrane pore
    and secondarily lowering MICU1/MICU2 association.
