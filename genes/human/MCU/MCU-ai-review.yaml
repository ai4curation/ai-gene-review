    reason: In low Ca2+, MICU1/MICU2 occlude the MCU pore to prevent basal uptake. MCU is the target
      channel in this starvation-response model, but the sensing and gatekeeping work is done by 
      MICU subunits, so this starvation-response process over-annotates the MCU pore itself.
    supported_by:
    - reference_id: PMID:32494073
      supporting_text: 'the uniporter complex (uniplex) contains four core components: the pore-forming
        MCU protein, the gatekeepers MICU1 and MICU2, and an auxiliary subunit, EMRE, essential for Ca2+
        transport'
