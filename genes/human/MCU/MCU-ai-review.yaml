id: Q8NE86
gene_symbol: MCU
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MCU encodes the pore-forming, calcium-conducting subunit of the mitochondrial calcium uniporter, or
  uniplex, in the inner mitochondrial membrane. Four MCU transmembrane subunits form the channel that
  moves Ca2+ from the intermembrane space into the matrix down the mitochondrial membrane potential, while
  EMRE/SMDT1 and MICU calcium sensors gate the pore. MCU-mediated matrix calcium uptake couples cytosolic
  calcium pulses to mitochondrial metabolism and calcium homeostasis; excessive uptake can contribute
  to permeability transition and cell death, and cell-type-specific uniplex regulators tune the same pore
  in beta cells, immune cells, neurons and cardiomyocytes.
