  qualifier: located_in
  review:
    summary: >-
      Nucleolar localization reported for HNP36, the truncated delayed-early
      response gene product that corresponds to a short ENT2 splice form
      (isoform 2). Immunocytochemistry placed HNP36 in the nucleolus of murine
      fibroblasts.
    action: KEEP_AS_NON_CORE
    reason: >-
      The 1995 paper identified HNP36 (later shown to be a truncated, largely
      non-functional form of ENT2) as a nucleolar protein of then-unknown
      function. UniProt flags the nuclear function of ENT2 as unclear and notes
      that the physiological existence of nuclear ENT2 isoforms has not been
      proven (PubMed:27271752). This is a genuine reported localization of a
      specific isoform but is not the core plasma-membrane transporter function;
      retained as non-core and isoform-associated rather than removed.
    supported_by:
    - reference_id: PMID:7639753
      supporting_text: localization of HNP36 to the nucleolus
