core_functions:
- description: >-
    Na+-independent, equilibrative (facilitated, bidirectional) transmembrane
    transport of purine and pyrimidine nucleosides (inosine, adenosine, uridine,
    thymidine, cytidine, guanosine) across the plasma membrane, equilibrating
    intracellular and extracellular nucleoside pools to supply the salvage
    pathway. ENT2 is distinguished from ENT1 by insensitivity to nanomolar NBMPR
    (ei-type) and by comparatively high affinity for inosine.
  molecular_function:
    id: GO:0005337
    label: nucleoside transmembrane transporter activity
  directly_involved_in:
  - id: GO:1901642
    label: nucleoside transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:9478986
    supporting_text: >-
      conferred an NBMPR-insensitive, sodium-independent nucleoside transport
      activity
  - reference_id: PMID:10722669
    supporting_text: the affinity of hENT2 for inosine is 4-fold higher than hENT1
- description: >-
    Na+-independent, equilibrative transmembrane transport of purine nucleobases
    (hypoxanthine, adenine, guanine) and pyrimidine nucleobases (thymine,
    uracil) across the plasma membrane. ENT2 and its rat ortholog were the first
    identified mammalian nucleobase transporter proteins; nucleobase handling,
    which ENT1 performs only weakly, is a defining feature of ENT2 that supports
    nucleobase salvage.
  molecular_function:
    id: GO:0015205
    label: nucleobase transmembrane transporter activity
  directly_involved_in:
  - id: GO:1904823
    label: purine nucleobase transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:21795683
    supporting_text: >-
      h/rENT2 representing the first identified mammalian nucleobase
      transporter proteins
  - reference_id: PMID:21795683
    supporting_text: >-
      ENT2 transport purine and pyrimidine nucleosides and nucleobases with
      equivalent kinetic efficiencies
proposed_new_terms: []
suggested_questions:
- question: >-
    What is the physiological significance of nuclear/nucleolar ENT2 isoforms
    (HNP36 and the isoforms described in PMID:27271752), and do they genuinely
    transport nucleosides into the nucleus during the proliferative response, or
    is the nucleolar localization an artifact of the truncated delayed-early
    gene product?
- question: >-
    Is ENT2-mediated urate transport (PMID:40367900) physiologically relevant to
    human urate handling in vivo, given its acidic pH optimum (5.5) and
    millimolar KM, and does the N68K polymorphism (which selectively reduces
    urate uptake) associate with urate-related phenotypes?
- question: >-
    How does ENT2's transport of adenosine shape purinergic/adenosine signaling
    in tissues where it predominates (e.g. skeletal muscle), and is the
    "neurotransmitter transporter" framing of ENT2 justified physiologically or
    is it an over-extension of its general nucleoside transport activity?
suggested_experiments:
- description: >-
    Quantitative, side-by-side flux assays of the full ENT2 substrate panel
    (nucleosides, nucleobases, urate, nicotinamide) in a single
    transporter-deficient cell background with endogenous transport controls, to
    rank physiological versus incidental substrates by transport efficiency
    (Vmax/KM) at physiological pH.
- description: >-
    Endogenous subcellular-localization and nucleoside-flux studies (e.g. tagged
    knock-in, fractionation, live-cell imaging) to test whether native ENT2 ever
    resides and functions at the nuclear envelope/nucleolus under proliferative
    conditions, resolving the UniProt CAUTION about nuclear ENT2 isoforms.
- description: >-
    Tissue-specific conditional knockout or knockdown of Slc29a2 to test its
    contribution to nucleoside/nucleobase and nucleoside-analog-drug flux across
    the blood-testis and blood-brain barriers, and to adenosine/hypoxanthine
    handling in skeletal muscle microvasculature.
