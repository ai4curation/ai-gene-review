- term:
    id: GO:0015747
    label: urate transport
  evidence_type: IDA
  original_reference_id: PMID:40367900
  qualifier: involved_in
  review:
    summary: >-
      Recently identified: ENT2 transports urate (the final purine metabolite),
      efficiently at acidic pH (KM 1.64 mM, optimum pH 5.5), demonstrated in
      HEK293 and Caco-2 cells and reduced by ENT2 knockdown.
    action: KEEP_AS_NON_CORE
    reason: >-
      Urate transport is a genuine, directly demonstrated ENT2 activity and may
      contribute to urate efflux/handling, but it is a newly recognized,
      pH-dependent extension of ENT2's substrate range rather than the central
      nucleoside/nucleobase function. The N68K variant specifically reduces urate
      uptake while leaving nucleoside/nucleobase transport unchanged, consistent
      with urate being a peripheral substrate. Retained as non-core.
    supported_by:
    - reference_id: PMID:40367900
      supporting_text: ENT2/SLC29A2 can also transport urate, which is the final metabolite of purine nucleobases
    - reference_id: PMID:40367900
      supporting_text: urate uptake by human ENT2 was quite efficient at an acidic pH of 5.5
