id: Q14542
gene_symbol: SLC29A2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC29A2 (ENT2, hENT2) is one of the two major plasma-membrane equilibrative
  nucleoside transporters of human cells. It is a 456-residue multi-pass
  membrane protein of the SLC29/ENT family (11 transmembrane helices) that
  mediates Na+-independent, facilitated (equilibrative), bidirectional transport
  of purine and pyrimidine nucleosides (inosine, adenosine, uridine, thymidine,
  cytidine, guanosine) down their concentration gradients. Unlike its paralog
  ENT1, ENT2 is an "ei"-type transporter that is insensitive to nanomolar
  nitrobenzylmercaptopurine riboside (NBMPR) and, importantly, also transports
  purine nucleobases (hypoxanthine, adenine, guanine) and pyrimidine nucleobases
  (thymine, uracil); ENT2 and its rat ortholog were the first identified
  mammalian nucleobase transporter proteins. It is generally a lower-affinity
  nucleoside transporter than ENT1 but has comparatively high affinity for
  inosine. By equilibrating intracellular and extracellular nucleoside/nucleobase
  pools it supplies the salvage pathway and maintains cellular homeostasis of
  these metabolites, and it is a major route for cellular entry/exit of
  nucleoside- and nucleobase-analog drugs (e.g. gemcitabine, cytarabine,
  mercaptopurine, zidovudine, didanosine). ENT2 is highly expressed in skeletal
  muscle and broadly in liver, placenta, kidney, brain and other tissues, where
  it localizes to the plasma membrane (basolateral in renal epithelia, apical in
  Sertoli cells). Additional transported substrates reported more recently
  include urate and nicotinamide. A truncated splice form (HNP36, a
  delayed-early growth-response gene product) was originally described as a
  nucleolar protein, but the physiological relevance of nuclear ENT2 isoforms
  remains unproven.
