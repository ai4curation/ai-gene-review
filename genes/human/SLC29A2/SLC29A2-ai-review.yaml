  review:
    summary: >-
      Electronic transfer (from mouse Slc29a2) of a "neurotransmitter uptake"
      process term. ENT2 handles adenosine, which acts as a neuromodulator, but
      it is a broad equilibrative nucleoside/nucleobase transporter, not a
      dedicated neurotransmitter transporter.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      ENT2 was characterized as a transporter of nucleosides and nucleobases;
      its handling of adenosine (a purine nucleoside that is also a
      neuromodulator) is the basis for the "neurotransmitter" framing. Equilibrative
      nucleoside transporters regulate extracellular adenosine available to
      purinoceptors and thereby modulate neurotransmission, but this is a
      downstream consequence of general nucleoside transport rather than a
      dedicated neurotransmitter-uptake activity. Retained but flagged as an
      over-annotation of the core transport function.
    supported_by:
    - reference_id: PMID:21795683
      supporting_text: >-
        By regulating availability of adenosine to purinoreceptors, NTs also
        modulate a diverse array of physiological processes, including
        neurotransmission
