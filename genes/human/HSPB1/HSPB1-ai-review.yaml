id: P04792
gene_symbol: HSPB1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  HSPB1 (HSP27) is a ubiquitously expressed small heat shock protein of the alpha-crystallin domain family.
  It is most abundant in muscle and is strongly induced by heat and other proteotoxic stresses. It is
  an ATP-independent molecular chaperone (holdase): dynamic dimer-based oligomers bind exposed hydrophobic
  surfaces of partially unfolded proteins, prevent their irreversible aggregation and keep them competent
  for refolding by the HSP70 system or for degradation. MAPKAPK2/3-dependent phosphorylation (Ser15/78/82)
  dissociates large oligomers into smaller species and modulates client and partner selection. HSPB1 is
  cytoplasmic, associates with actin and microtubules, and moves to nuclear speckles during heat shock.
  It contributes to stress resistance and actin cytoskeleton stability, inhibits apoptosis (for example
  by interfering with DAXX and cytochrome c pathways), and maintains neurofilament phosphorylation and
  axonal transport. Dominant mutations cause Charcot-Marie-Tooth type 2F and distal hereditary motor neuropathy.
