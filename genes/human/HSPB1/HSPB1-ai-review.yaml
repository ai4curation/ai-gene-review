core_functions:
- description: >-
    ATP-independent small heat shock protein chaperone (holdase) that binds non-native proteins via dynamic
    oligomers, prevents their aggregation and maintains them in a refolding-competent state during heat
    and proteotoxic stress.
  proposed_molecular_function: holdase chaperone activity
  directly_involved_in:
  - id: GO:0042026
    label: protein refolding
  - id: GO:0009408
    label: response to heat
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: file:human/HSPB1/HSPB1-uniprot.txt
    supporting_text: >-
      Small heat shock protein which functions as a molecular chaperone probably maintaining denatured
      proteins in a folding-competent state
  - reference_id: PMID:20178975
    supporting_text: >-
      In contrast to other chaperonopathies, our results revealed that particular HSPB1 mutations presented
      higher chaperone activity compared with wild type.
  - reference_id: PMID:15581903
    supporting_text: >-
      Human Hsp27 oligomerizes in vivo in a phosphorylation-dependent manner that regulates the functional
      activity of the protein.
proposed_new_terms:
- proposed_name: holdase chaperone activity
  proposed_definition: Binding to an unfolded or misfolded protein to prevent its aggregation without
    actively catalyzing refolding. The holdase maintains the client protein in a soluble, folding-competent
    state. This is mechanistically distinct from foldase activity (GO:0044183) and from carrier-holdase
    activity (GO:0140309).
  justification: >-
    HSPB1 is an ATP-independent small heat shock protein that keeps denatured proteins in a folding-competent
    state. Obsolete GO:0051082 captured binding only; GO:0044183 requires assisting folding, and GO:0140309
    ('unfolded protein holdase activity') keeps a carrier-specific definition requiring escort to an acceptor
    molecule or location. Same proposal as in the C. elegans hsp-16.1/16.41/16.48 reviews; see go-ontology#30552.
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - reference_id: file:human/HSPB1/HSPB1-uniprot.txt
    supporting_text: >-
      Small heat shock protein which functions as a molecular chaperone probably maintaining denatured
      proteins in a folding-competent state
suggested_questions:
- question: >-
    How does phosphorylation-driven remodelling of HSPB1 oligomers change client selection versus anti-apoptotic
    partner binding in vivo?
- question: >-
    Do CMT2F/dHMN HSPB1 variants act through gain of chaperone activity, altered oligomer dynamics, or
    loss of cytoskeletal (neurofilament/microtubule) function?
suggested_experiments:
- hypothesis: >-
    Phosphomimetic and non-phosphorylatable HSPB1 differ in which endogenous clients they protect from
    heat-induced aggregation.
  description: >-
    Proximity labelling or crosslinking mass spectrometry of HSPB1 phospho-variants in HSPB1-null cells
    before and after heat shock, coupled to aggregation proteomics.
