- term:
    id: GO:0044183
    label: protein folding chaperone
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P14602
  - ensembl:ENSMUSP00000005077
  review:
    summary: >-
      HSPB1 is an ATP-independent chaperone that binds non-native proteins and prevents their aggregation.
    action: MODIFY
    reason: >-
      Core molecular function, but HSPB1 is an ATP-independent holdase that suppresses aggregation and keeps
      clients refolding-competent rather than itself assisting folding, which GO:0044183 implies. Unfolded
      protein binding (GO:0051082) is obsolete and GO:0140309 keeps a carrier-specific definition, so, as
      for the C. elegans HSP-16 sHSPs (hsp-16.1, hsp-16.41, hsp-16.48 reviews) and go-ontology#30552, the
      replacement is the proposed holdase chaperone activity NTR.
    proposed_replacement_terms:
    - id: NTR
      label: holdase chaperone activity
    supported_by:
    - reference_id: file:human/HSPB1/HSPB1-uniprot.txt
      supporting_text: >-
        Small heat shock protein which functions as a molecular chaperone probably maintaining denatured
        proteins in a folding-competent state
    - reference_id: PMID:20178975
      supporting_text: >-
        In contrast to other chaperonopathies, our results revealed that particular HSPB1 mutations presented
        higher chaperone activity compared with wild type.
