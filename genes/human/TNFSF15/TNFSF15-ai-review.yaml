description: TNFSF15 encodes TL1A/VEGI, a TNF-superfamily ligand that can be secreted
  or membrane associated and binds DR3/TNFRSF25 and DcR3/TNFRSF6B to drive DR3-dependent
  NF-kappaB, apoptosis, and T-cell costimulatory signaling.
