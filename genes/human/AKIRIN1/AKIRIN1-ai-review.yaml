- term:
    id: GO:1902725
    label: negative regulation of satellite cell differentiation
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Retain reduced satellite/reserve-cell differentiation, distinct from increased terminal myogenesis.
    reason: GO:1902725 negatively regulates GO:0014816, which defines acquisition of satellite-cell features. The old review conflated this with a satellite-derived myoblast differentiating into a myotube. The exact mouse Q99LF1 MGI IMP source is PMID:18255059. Related primary work in the Dyer 2006 thesis describes reduced reserve-cell populations and reduced Sca-1/CD34 in Mighty-overexpressing C2C12 cultures alongside increased myotube fusion. This is consistent with the standing curator-supported transfer; the positive myogenesis result does not contradict it. The original journal full text remains unavailable and reserve-cell markers are not lineage tracing, so the precise mechanism remains a follow-up, not a confident reversal of the annotation.
    supported_by:
    - reference_id: file:human/AKIRIN1/AKIRIN1-primary-and-phylogeny-scope.md
      supporting_text: It is not synonymous with a satellite-derived myoblast forming a myotube.
