id: Q9H9L7
gene_symbol: AKIRIN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AKIRIN1 (Akirin-1/Mighty) is a small nuclear transcriptional cofactor associated with chromatin-dependent gene regulation. Mammalian Akirin1 studies support a promyogenic role involving myogenic gene expression, myoblast migration and differentiation, with proliferation effects that depend on cell state and experimental conditions. Mouse Akirin1 also promotes macrophage chemotaxis and lamellipodium formation through PI3K-dependent actin reorganization; these capacities are inferred to human AKIRIN1 through conserved ancestry. Human AKIRIN1 has direct nuclear-localization evidence, while its detailed transcriptional partners and the connection between nuclear regulation and motility remain incompletely resolved.
alternative_products:
- name: '1'
  id: Q9H9L7-1
- name: '2'
  id: Q9H9L7-2
  sequence_note: VSP_042769
