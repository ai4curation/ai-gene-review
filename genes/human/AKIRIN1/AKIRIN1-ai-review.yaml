- id: PMID:18066067
  title: Akirins are highly conserved nuclear proteins required for NF-kappaB-dependent gene expression in drosophila and mice.
  findings:
  - statement: Human HsAkirin1 and HsAkirin2 show NLS-dependent nuclear localization in HeLa cells.
  - statement: Immune rescue/essentiality experiments principally establish Akirin2 functions; the tested Akirin1-null cytokine responses were normal.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full relevant Results/Discussion read. Direct human HsAkirin1 nuclear localization is supported; fly immune rescue used HsAkirin2, and mouse Akirin1-null MEFs retained tested cytokine responses. This does not directly establish a human AKIRIN1 NF-kappaB mechanism.
- id: PMID:23516508
  title: Myostatin suppression of Akirin1 mediates glucocorticoid-induced satellite cell dysfunction.
  findings:
  - statement: Direct Akirin1 overexpression improves C2C12 proliferation and differentiation under the tested dexamethasone conditions; this does not determine the sign in every cell state.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Methods/Results read. Direct Akirin1 overexpression is in C2C12 myoblasts under dexamethasone, whereas satellite-cell and upstream myostatin experiments are separate. Positive proliferation in this condition does not refute earlier withdrawal in another condition.
- id: PMID:34711951
  title: AKIRIN2 controls the nuclear import of proteasomes in vertebrates.
  findings:
  - statement: The study concerns AKIRIN2-dependent nuclear proteasome import, not evidence for an AKIRIN1 import annotation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Abstract only: AKIRIN2 nuclear proteasome import. Existing UniProt AKIRIN1 curation explicitly contrasts that activity. Not evidence for a new AKIRIN1 proteasome-binding annotation or universal absence of contacts.'
  full_text_unavailable: true
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings:
  - statement: IntAct confirms human AKIRIN1-GOPC binary two-hybrid evidence from the exact paper.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cache full-text flag overstates coverage (mainly Introduction/Discussion). Exact IntAct records independently verify AKIRIN1-GOPC binary two-hybrid interactions from this paper; no protein-containing-complex binding assay established.
- id: PMID:19406121
  title: Akirin1 (Mighty), a novel promyogenic factor regulates muscle regeneration and cell chemotaxis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract and publisher preview checked; complete article unavailable. Exact mouse Akirin1 source supports macrophage/myoblast chemotaxis, PI3K-dependent actin reorganization and lamellipodia; not a direct human experiment.
  full_text_unavailable: true
  findings:
  - statement: Mouse Akirin1 regulates macrophage/myoblast chemotaxis and lamellipodia through PI3K-dependent actin reorganization.
- id: PMID:18255059
  title: Mighty is a novel promyogenic factor in skeletal myogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only; full article unavailable. Supports earlier C2C12 cell-cycle exit and enhanced myogenesis. MGI maps both negative satellite terms to this paper; related Dyer primary thesis corroborates reserve-cell interpretation, but is not substituted for the journal full text.
  full_text_unavailable: true
  findings:
  - statement: Mighty overexpression promotes earlier cell-cycle withdrawal and enhanced terminal myogenesis in C2C12 cultures.
- id: PMID:40211850
  title: CircEPDR1 regulates proliferation and differentiation of goat skeletal muscle satellite cells through miR-345-3p/Akirin1 axis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full relevant Methods/Results read. Direct goat Akirin1 overexpression reduces proliferation readouts while promoting differentiation; miRNA cotransfection modifies the effect. Gene-specific experiment distinguished from upstream circRNA manipulations.
  findings:
  - statement: Direct goat Akirin1 overexpression reduces proliferation readouts while increasing myogenic differentiation.
- id: PMID:30746755
  title: Role of Akirin1 in the regulation of skeletal muscle fiber-type switch.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Mouse Akirin1 promoter-reporter and fiber-type phenotypes support transcriptional/muscle function despite an outwardly normal knockout; physical mechanism remains limited.
  full_text_unavailable: true
  findings:
  - statement: Akirin1 regulates a muscle promoter reporter and influences muscle fiber composition despite no gross knockout phenotype.
- id: PMID:39856124
  title: miR-224 activates cancer-associated fibroblasts to enhance lung cancer cell migration and invasion by targeting Akirin1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full relevant Methods/Results checked. Human/mouse models coexist, but the Akirin1 cDNA and perturbation/rescue in lung fibroblast-cancer coculture are mouse. Cancer-cell movement in coculture does not contradict macrophage cell-autonomous chemotaxis.
  findings:
  - statement: Mouse Akirin1 perturbation in fibroblasts affects cancer-cell behavior in coculture; assay identity differs from macrophage chemotaxis.
- id: file:human/AKIRIN1/AKIRIN1-primary-and-phylogeny-scope.md
  title: AKIRIN1 primary evidence and phylogenetic scope
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Manual audit with actual PANTHER lineage, mouse QuickGO source records, exact GO definitions, direct source access limits, independent IntAct records and critical Falcon integration. Primary thesis treated as related evidence, not the journal full text.
  findings:
  - statement: Q9H9L7 inherits the positive muscle/motility assertions from PTN002665250 and nuclear/transcriptional assertions from PTN000329080.
  - statement: GO:1902725 concerns satellite-cell identity and is compatible with enhanced terminal myogenesis.
  - statement: The generic binary-binding evidence does not justify protein-containing complex binding.
- id: file:human/AKIRIN1/AKIRIN1-deep-research-falcon.md
  title: 'Research Report: Human AKIRIN1 (UniProt Q9H9L7; Akirin-1/Mighty) — functional annotation'
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Full biological report and evidence-table artifact read. Useful promyogenic synthesis and explicit Akirin1 versus Akirin2 immune distinction. Positive proliferation is condition-specific, and the fibroblast perturbation species was checked in the primary paper. Association studies are not additional process evidence.
  findings:
  - statement: The report emphasizes a promyogenic nuclear cofactor role, while treating detailed immune mechanisms mainly as family/Akirin2 evidence.
  - statement: Disease/fertility associations do not establish a new function; the report is a synthesis, not independent experimental proof.
- id: file:human/AKIRIN1/AKIRIN1-uniprot.txt
  title: UniProt entry Q9H9L7 (AKIRIN1_HUMAN)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Existing canonical source record read without modification; supports identity, nuclear location and the GOPC interaction entry. Ortholog-derived CC function statements are distinguished from human experiments.
  findings:
  - statement: Human AKIRIN1 is Q9H9L7; the record identifies mouse Q99LF1 as Akirin1 functional evidence.
