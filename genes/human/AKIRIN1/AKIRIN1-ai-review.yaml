- term:
    id: GO:0045663
    label: positive regulation of myoblast differentiation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: AKIRIN1 is a conserved positive regulator of myoblast differentiation.
    reason: The matching mouse Akirin1 primary studies directly connect its overexpression to earlier MyoD expression and enhanced terminal myogenesis. The target inherits the positive PTN002665250 assertion, and the direct C2C12 experiments in PMID:23516508 support the same promyogenic capacity under glucocorticoid stress. These are active gene-regulatory effects, not merely the consequences of generic viability. Muscle differentiation is a well-supported biological role and is retained as core with its ortholog-inference scope.
    supported_by:
    - reference_id: file:human/AKIRIN1/AKIRIN1-primary-and-phylogeny-scope.md
      supporting_text: The current PTHR13293 tree places human leaf PTN002491310 below PTN002665250.
