    reason: PMID:18066067 expresses tagged HsAkirin1 in HeLa cells and shows NLS-dependent nuclear localization. The source location is retained; the actual PTN000329080 nuclear assertion is also ancestral to the target. Neither broader versus narrower nuclear location nor evidence redundancy changes its biological correctness.
    supported_by:
    - reference_id: PMID:18066067
      supporting_text: the nuclear localization of HsAkirin1 and HsAkirin2
    - reference_id: file:human/AKIRIN1/AKIRIN1-primary-and-phylogeny-scope.md
      supporting_text: Nuclear/chromatin/cofactor/transcription assertions descend from PTN000329080.
