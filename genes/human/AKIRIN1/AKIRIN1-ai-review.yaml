suggested_questions:
- question: Which human AKIRIN1 partners and transcriptional targets connect its nuclear cofactor role to PI3K-dependent lamellipodium formation and chemotaxis inferred from the mouse ortholog?
- question: How do AKIRIN1 dosage, glucocorticoid exposure and cell state determine proliferation versus cell-cycle exit and satellite/reserve-cell commitment? Full-text curator follow-up on PMID:18255059 should resolve the exact assay underlying GO:1902725 without conflating satellite identity with terminal myogenesis.
suggested_experiments:
- description: Measure AKIRIN1-dependent transcription, cell-cycle exit, terminal myogenesis and reserve-cell fate in matched human myogenic cultures across differentiation and glucocorticoid conditions, using perturbation/rescue and lineage-resolved readouts.
- description: Test endogenous AKIRIN1 recruitment partners and target-gene occupancy while measuring lamellipodium dynamics and chemotaxis, separating nuclear regulation from possible cytoplasmic actions.
