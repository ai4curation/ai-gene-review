    label: positive regulation of transcription by RNA polymerase II
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Positive regulation of RNA polymerase II transcription is supported as an inherited Akirin function.
    reason: 'The actual target lineage descends from the positive PTN000329080 IBDs. The Akirin1-specific myogenic transcriptional outcomes and mouse promoter-reporter evidence are compatible with this ancestral judgment. The old rationale overstated direct human AKIRIN1 NF-kappaB evidence: PMID:18066067 tested HsAkirin2 in the fly immune rescue and found normal tested cytokine responses in Akirin1-null mouse cells. The term-specific innate-immune IRD at PTN002665250 does not erase the broader positive cofactor, transcription or chromatin assertions. Detailed recruitment partners in human AKIRIN1 remain incompletely resolved.'
