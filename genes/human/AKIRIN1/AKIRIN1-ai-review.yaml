  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: Positive regulation of lamellipodium assembly is supported by the exact mouse Akirin1 ortholog and actual positive ancestry.
    reason: Mouse Q99LF1 is Akirin1/Mighty, not Akirin2. Its experimentally curated source annotations cite PMID:19406121, whose abstract reports increased macrophage and myoblast chemotaxis with PI3K-dependent actin reorganization and lamellipodia formation. The target lies below the matching PTN002665250 IBD. Nuclear localization does not preclude regulation of cytoskeletal behavior, and viable knockout animals do not refute a cellular capacity. Retain the conserved inference without representing it as a direct human experiment or an identified actin-binding mechanism. Complete source article access remains unavailable, limiting mechanistic detail rather than overturning the positive evidence.
