id: P04198
gene_symbol: MYCN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MYCN encodes N-Myc, a nuclear Myc-family basic helix-loop-helix leucine zipper transcription
  factor. N-Myc heterodimerizes with MAX through its C-terminal bHLH-LZ region, binds E-box and other
  Pol II cis-regulatory DNA sites, and primarily activates transcription of target genes in growth and
  neural-crest programs. Its protein abundance is tightly controlled by phosphorylation-dependent ubiquitin-proteasome
  turnover through FBXW7 and by stabilizing partners such as AURKA, SIRT1 and the primate NCYM protein.
  MYCN dosage and stabilization are oncogenic in neuroblastoma and other tumors, and heterozygous loss
  of MYCN causes Feingold syndrome.'
