- description: 'Sterol uptake across the apical membrane: having bound cholesterol in its N-terminal domain,
    NPC1L1 moves the sterol through an intramolecular hydrophobic channel that runs through the protein, and
    the sterol-loaded protein is then internalized by clathrin/AP2-dependent endocytosis. The same channel
    carries alpha-tocopherol. Ezetimibe blocks this activity. No current GO molecular function term describes
    it (see proposed_new_terms), so this core function carries a proposed term rather than a GO id.'
