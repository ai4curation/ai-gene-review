id: Q9UHC9
gene_symbol: NPC1L1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NPC1L1 (Niemann-Pick C1-like 1) is a polytopic (13-transmembrane) sterol-sensing-domain protein of
  the NPC1 family, located on the apical brush-border membrane of small-intestinal enterocytes and, in humans, also
  on the hepatocyte canalicular membrane. Its luminal N-terminal domain binds free cholesterol, which triggers clathrin/AP2-
  and NUMB-dependent endocytosis of NPC1L1 together with cholesterol-enriched membrane; NPC1L1 then returns to the
  cell surface from the endocytic recycling compartment via a myosin Vb-Rab11a-Rab11-FIP2 (and LIMA1) route when
  cellular cholesterol is low. Cryo-EM shows a mostly homodimeric protein with an intramolecular channel that carries
  cholesterol and vitamin E. NPC1L1 is required for most intestinal cholesterol absorption and also mediates uptake
  of alpha-tocopherol (and, less efficiently, plant sterols); it is the molecular target of the cholesterol-absorption
  inhibitor ezetimibe, and loss-of-function variants are associated with lower LDL cholesterol and coronary risk.
  In the enterocyte, NPC1L1-mediated sterol uptake is opposed by apical efflux of sterols back into the lumen by
  the ABCG5/ABCG8 heterodimer.
