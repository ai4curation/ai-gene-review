proposed_new_terms:
- proposed_name: membrane-embedded sterol uptake channel activity
  proposed_definition: >-
    Enables the movement of a sterol from the extracellular face of a membrane into the cell
    through a hydrophobic channel formed within the polypeptide itself, the gene product
    remaining embedded in that membrane throughout. The sterol is bound at an extracellular
    sterol-binding domain and passes through the intramolecular channel; the gene product does
    not leave the membrane and does not carry the sterol through the aqueous phase.
  proposed_parent:
    id: GO:0022857
    label: transmembrane transporter activity
  justification: >-
    GO has no current molecular function term for this activity, and the two candidates both
    misdescribe it. GO:0015248 sterol transporter activity, which would have been the obvious
    choice, is obsolete. The current replacements GO:0120015 sterol transfer activity and
    GO:0120020 cholesterol transfer activity are not obsolete and are the right terms for
    soluble sterol carriers, but their definitions require the gene product to remove the sterol
    from a donor membrane and transport it "through the aqueous phase while protected in a
    hydrophobic pocket" to an acceptor membrane. NPC1L1 does the opposite: it stays in the apical
    membrane and moves the sterol through a channel inside itself
    [PMID:34407950 "the same intramolecular channel in hNPC1L1 mediates transport of VE and
    cholesterol"]. Annotating it to GO:0120020 would assert an intermembrane shuttle mechanism
    that the structural work rules out, and GO:0120020 has_part GO:0015485 cholesterol binding,
    so it would also silently restate the binding term rather than add the missing activity.
    The concept is pitched above NPC1L1 so that it also serves its paralogue NPC1 and other
    membrane-embedded sterol conduits, with the sterol identity left to annotation extensions or
    to children, since the same NPC1L1 channel carries alpha-tocopherol as well as cholesterol.
    GO:0015485 cholesterol binding, which NPC1L1 has by IDA, is a part of this activity and is
    kept as core function 1 rather than being replaced.
  supported_by:
  - reference_id: PMID:34407950
    supporting_text: the same intramolecular channel in hNPC1L1 mediates transport of VE and cholesterol
  - reference_id: PMID:21602275
    supporting_text: Here, we find that the N-terminal domain (NTD) of NPC1L1 binds cholesterol.
suggested_questions:
- question: Does NPC1L1 move cholesterol through its intramolecular channel into the membrane directly, or is endocytosis
    of NPC1L1-cholesterol microdomains the obligatory transport step in enterocytes in vivo?
suggested_experiments:
- description: Compare cholesterol absorption in mice carrying channel-blocking versus endocytosis-defective (YVNXXF)
    NPC1L1 knock-in alleles to separate channel transfer from vesicular uptake.
