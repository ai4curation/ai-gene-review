core_functions:
- description: 'Sterol-selective binding at the enterocyte brush border: the N-terminal domain binds free
    cholesterol, but not plant sterols, and also binds alpha-tocopherol. This is the step at which NPC1L1
    discriminates between dietary sterols, and it is the only part of the uptake activity that a current GO
    molecular function term describes.'
