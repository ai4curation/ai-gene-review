core_functions:
- description: >-
    ATP-dependent 3'->5' RNA helicase. This is experimentally established for purified human
    YTHDC2, whose ATP hydrolysis is abolished by a motif II E332Q mutation. Helicase activity
    is weak and is stimulated by the ankyrin-repeat-mediated interaction with XRN1, shown in
    mouse; the XRN1 interaction itself is shown in human cells. The physiological requirement
    of the helicase for meiotic prophase progression is shown in mouse.
  molecular_function:
    id: GO:0034458
    label: 3'-5' RNA helicase activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:29033321
    supporting_text: Our biochemical studies indicate that YTHDC2 is an RNA-induced ATPase with
      a 3'→5' RNA helicase activity.
  - reference_id: PMID:35058317
    supporting_text: the equivalent mutation in human YTHDC2 has been shown to abolish ATP
      hydrolysis and helicase activity in vitro (Wojtas et al. 2017)
  - reference_id: PMID:35305312
    supporting_text: Biochemical studies reveal that the weak helicase activity of YTHDC2 is
      enhanced by its interaction with the 5'→3' exoribonuclease XRN1.
- description: >-
    Sequence-selective mRNA binding through the R3H and YTH domains (human cells). In mouse
    testis, binding is to U-rich/UG-rich 3' UTR and coding-sequence sites independently of
    m6A. Together with its partner MEIOC, this binding post-transcriptionally licenses a clean
    switch from the mitotic to the meiotic gene-expression program, a process inferred for
    human from the same-subfamily mouse ortholog.
  molecular_function:
    id: GO:0003723
    label: RNA binding
  directly_involved_in:
  - id: GO:0051729
    label: germline cell cycle switching, mitotic to meiotic cell cycle
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:29970596
    supporting_text: We show that the YTH and R3H domains contribute to the binding of YTHDC2 to
      cellular RNAs
  - reference_id: PMID:29087293
    supporting_text: YTHDC2-deficient male germ cells enter meiosis but have a mixed identity,
      maintaining expression of Cyclin A2 and failing to properly express many meiotic markers.
  - reference_id: PMID:35058317
    supporting_text: Unexpectedly, mutation of the m6A-binding pocket of YTHDC2 had no detectable
      effect on gametogenesis and mouse fertility, suggesting that YTHDC2 function is
      m6A-independent.
suggested_questions:
- question: >-
    Is the m6A-binding capacity of the YTHDC2 YTH domain used in any somatic or cancer cell
    context in human, given that it is dispensable for mouse fertility?
- question: >-
    Which descendant node carries the PAINT IRD that removes helicase activity in
    Drosophila (PTN000433935)? Does it include CG8915 as well as Bgcn, and does CG8915 retain
    the Walker A and DEAH motifs needed for the 3'-5' helicase activity of mammalian YTHDC2?
- question: >-
    Does the 40S association of YTHDC2 have a translational function, given conflicting
    reports on target translation efficiency (PMID:28809393 vs PMID:35058317)?
suggested_experiments:
- description: >-
    Make catalytic-dead (E332Q), ANK-deleted and YTH-pocket (W1360A) human YTHDC2 mutants and
    test them in human germ-cell-like or iPSC-derived meiotic models for target RNA decay
    (U-rich 3' UTR reporters) and XRN1 recruitment, to confirm the mouse mechanism in human.
- description: >-
    Express recombinant Drosophila CG8915 and test RNA-stimulated ATPase and 3'->5' unwinding
    activity, with human YTHDC2 as positive control, before transferring helicase activity to
    the fly protein.
