  review:
    summary: Ensembl Compara transfer of the mouse Ythdc2 mitotic-to-meiotic switching
      annotation.
    action: ACCEPT
    reason: >-
      This is the core physiological process. In mouse, YTHDC2-deficient germ cells enter
      meiosis but keep a mixed mitotic/meiotic identity (persistent Cyclin A2) and attempt
      an aberrant mitotic-like division (PMID:29087293, PMID:29360036). YTHDC2 binds the
      relevant mitotic transcripts, so it acts directly as a post-transcriptional regulator,
      not merely as a prerequisite. The donor is a 1:1 ortholog in the same PANTHER subfamily
      (PTHR18934:SF213). For human, this is inferred, not experimentally shown. PAINT did not
      propagate this process at a subfamily node; this transfer rests on the
      mammal-to-mammal orthology.
