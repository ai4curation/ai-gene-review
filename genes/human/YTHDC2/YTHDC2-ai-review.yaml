id: Q9H6S0
gene_symbol: YTHDC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  YTHDC2 is a large (1430 aa) cytoplasmic DEAH-box (DExH) RNA helicase that combines an
  N-terminal R3H RNA-binding domain, a RecA-like helicase core interrupted by two ankyrin
  repeats, HA2/OB-fold helicase accessory domains and a C-terminal YTH domain. Purified human
  YTHDC2 is an RNA-stimulated ATPase with 3'->5' RNA helicase activity. Its YTH domain binds
  N6-methyladenosine (m6A)-containing RNA in vitro with modest affinity; the R3H and YTH domains
  both contribute to binding of cellular RNAs, the protein associates with the small ribosomal
  subunit near the mRNA entry/exit site, and the ankyrin repeats recruit the 5'->3'
  exoribonuclease XRN1. In human cell lines it is mainly cytoplasmic with perinuclear/ER
  enrichment. Physiologically, studies of the mouse ortholog show that YTHDC2 is expressed in
  germ cells at meiotic entry and, together with its partner MEIOC, is essential in both sexes
  for a clean switch from the mitotic to the meiotic gene-expression program and for
  progression through meiotic prophase I. This requires the helicase ATPase activity but not
  m6A recognition, and its mRNA binding sites are U-rich/UG-rich 3' UTR and coding regions
  rather than m6A sites. Human YTHDC2 also binds HCV NS5B and supports HCV replicon replication.
