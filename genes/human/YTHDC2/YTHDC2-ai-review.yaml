    summary: In human cells, YTHDC2 co-sediments with 40S subunits and 80S monosomes and
      crosslinks (CRAC) to 18S rRNA near the mRNA entry/exit sites.
    action: NEW
    reason: >-
      This is direct human evidence for a molecular interaction that GOA does not capture.
      Sucrose-gradient co-sedimentation and in vivo crosslinking to 18S rRNA show physical
      association with the small subunit. It is a binding activity, not a process claim, so
      the participation test does not arise. Proposed as non-core, because its physiological
      significance is unclear: whole-testis ribosome profiling in mouse found no substantial
      translational effect (PMID:35058317).
