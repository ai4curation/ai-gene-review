  review:
    summary: Ensembl Compara transfer of the mouse Ythdc2 spermatid development annotation.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      YTHDC2 acts before spermatids exist. Mouse mutant germ cells arrest in meiotic prophase I
      (no further than zygotene) and die, and YTHDC2 protein returns to background levels in
      round spermatids. The absence of spermatids is a downstream consequence of the meiotic
      block, not participation in spermatid development. The process YTHDC2 actually acts in
      is captured by GO:0051729.
    supported_by:
    - reference_id: PMID:28809393
      supporting_text: The germ cells of Ythdc2 knockout mice do not develop past the zygotene
        stage
    - reference_id: PMID:29360036
      supporting_text: Mutant germ cells enter meiosis but proceed prematurely to aberrant
        metaphase and apoptosis
