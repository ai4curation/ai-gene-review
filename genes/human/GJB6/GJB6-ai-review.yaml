- id: PMID:12490528
  title: Connexin30 (Gjb6)-deficiency causes severe hearing impairment and lack of endocochlear potential.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PubMed identity and abstract verified; selected original Methods, Results, discussion and figure captions read through an authentic article mirror. Mouse gene replacement used lacZ/neo; Cx26 staining was qualitative. The hearing and endocochlear-potential phenotype is positive evidence, reassessed alongside PMID:23303923 rather than treated as an isolated Cx30 mechanism.
- id: PMID:23303923
  title: Hearing is normal without connexin30.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PubMed identity and PMC original Methods, Results, Discussion and figure captions read. A separate mouse deletion retained about half the Cx26 protein and normal tested hearing responses, whereas the older knockout retained much less Cx26. This challenges the old allele’s mechanistic interpretation, without excluding all Cx30 auditory roles or resolving human dominant variants.
- id: PMID:17615163
  title: Human connexin26 and connexin30 form functional heteromeric and heterotypic channels.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PubMed identity and author-hosted original Methods and selected channel Results read. Human Cx30 clone AY297110 came from corpus-callosum RNA and was expressed in HeLa cells. Untagged coimmunoprecipitation, separate fluorescent-fusion FRET, dye transfer and electrophysiology support Cx26/Cx30 channel compatibility. Full historical-clone equivalence to today’s canonical sequence was not independently established. Relative to older reference sequences, the authors reported H124Q; current O95452 also has Q124. This is not evidence of a disease variant.
