suggested_questions:
- question: Which partner-specific experiments in PMID:19285977 distinguish microtubule, beta-tubulin and F-actin binding from colocalization or association through other proteins?
  experts:
  - Original study authors
  - GO annotation curators
- question: Which human auditory phenotypes reflect connexin-30 channel changes, and which reflect altered neighboring GJB2 regulation? Can variants with intact local regulation separate these effects?
  experts:
  - Auditory physiologists
  - Human geneticists
  - GO annotation curators
- question: How much of astroglial barrier support requires connexin-30 specifically, and how much is shared with or compensated by connexin-43?
  experts:
  - Astrocyte biologists
  - Blood-brain-barrier researchers
- question: Under what physiological conditions do unapposed connexin-30 hemichannels open, and how do their contributions differ from intercellular gap-junction channels?
  experts:
  - Connexin electrophysiologists
- question: Does GJB6 directly contribute to sinoatrial-node development beyond its membership in the expression program?
  experts:
  - Cardiac conduction-system biologists
suggested_experiments:
- description: Compare sequence-verified wild-type human Cx30 and selected variants at matched surface abundance, measuring paired-cell conductance, dye transfer and junctional plaque formation separately from unpaired-cell leakage.
  hypothesis: Altered channel function can be separated from changes in abundance, localization or plaque assembly.
- description: Combine endogenous Cx30 perturbation and rescue with Cx43 control in an astrocyte–barrier coculture, recording intercellular coupling, barrier permeability, cell viability and endfoot organization separately.
  hypothesis: A Cx30-specific contribution can be distinguished from combined connexin-network failure and secondary cellular injury.
