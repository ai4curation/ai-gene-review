- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology links
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic method describes logical inter-ontology propagation. Here the electrical-coupling
      process derives from GO:1903763. Preserve that actual source activity rather than describing this
      as provenance for a different process.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic method consolidates identical electronic assertions from several pipelines.
      The incoming mouse protein, Ensembl and subcellular-location sources are preserved for gap-junction
      localization. They are not several independent human experiments.
- id: Reactome:R-HSA-190861
  title: Gap junction assembly
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The genuine retained Reactome summary describes staged connexin assembly and trafficking.
      Its microtubule stabilization clause specifically names Cx43; it is not transferred to GJB6. The
      pathway overview is context rather than an independent target-specific assay or proof of obligatory
      Golgi trafficking.
- id: UniProtKB:O95452
  title: 'UniProtKB O95452 (CXB6_HUMAN): Gap junction beta-6 protein'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The current reviewed human record, exact 261-residue sequence and direct FASTA were
      inspected. No alternative-products declaration is present. Four membrane-spanning features carry
      ECO:0000255, the hexamer/CNST subunit statement ECO:0000250, and family membership ECO:0000305;
      these grades remain distinct from direct human assays.
- id: file:human/GJB6/GJB6-evidence.yaml
  title: GJB6 source scope, original contexts and sequence evidence
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
