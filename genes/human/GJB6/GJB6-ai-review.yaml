id: O95452
gene_symbol: GJB6
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Connexin-30 is a four-pass membrane protein that forms connexin complexes in gap junctions.
  These channels connect the cytoplasms of neighboring cells and support electrical coupling and small-solute
  exchange. Disease-associated GJB6 variants cause Clouston syndrome, an ectodermal disorder affecting
  hair, nails and skin.
