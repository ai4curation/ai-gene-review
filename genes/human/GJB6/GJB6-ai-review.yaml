suggested_experiments:
- description: Compare sequence-verified wild-type human Cx30 and selected variants at matched surface
    abundance, measuring paired-cell conductance, dye transfer and junctional plaque formation separately
    from unpaired-cell leakage.
  hypothesis: Altered channel function can be separated from changes in abundance, localization or plaque
    assembly.
- description: Combine endogenous Cx30 perturbation and rescue with Cx43 control in an astrocyte–barrier
    coculture, recording intercellular coupling, barrier permeability, cell viability and endfoot organization
    separately.
  hypothesis: A Cx30-specific contribution can be distinguished from combined connexin-network failure
    and secondary cellular injury.
