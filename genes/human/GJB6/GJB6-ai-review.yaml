id: O95452
gene_symbol: GJB6
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Connexin-30 is a four-pass membrane protein of gap junctions in cochlear non-sensory cells, epidermal keratinocytes and astrocytes. Its channels connect neighboring cytoplasms, supporting electrical coupling and small-solute exchange. Human connexin-30 can form homomeric channels and combine with connexin-26 in heteromeric connexons and heterotypic channels. GJB6 variants cause Clouston syndrome, affecting hair, nails and skin. GJB6 also lies in the DFNB1 hearing-loss locus; large deletions spanning this region can impair neighboring GJB2 regulation, complicating attribution to connexin-30 protein alone.
