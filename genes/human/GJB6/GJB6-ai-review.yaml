- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic method maps InterPro signatures to GO terms. The GJB6 records use IPR000500
      and IPR017990 for communication and connexin-complex membership. This is inference provenance, not
      an additional functional experiment.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The authentic phylogenetic method was read with the actual PTHR11984 tree, alignment
      and four literal IBD assertions. Three descend from AN0/PTN008334405 and intercellular transport
      from AN365/PTN002633521. Experimental target self-evidence is legitimate descendant evidence.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
