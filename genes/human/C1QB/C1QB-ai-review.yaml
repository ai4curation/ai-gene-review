core_functions:
- description: 'The B-chain globular module binds immunoglobulins, preferentially
    IgG in the tested isolated-module assays, within the multivalent C1q recognition
    assembly. Its collagen-like region supplies a C1r/C1s recruitment interface: mature
    B-chain Lys61 is required for efficient protease-tetramer binding and activation
    in recombinant human C1q. These recognition and structural activities initiate
    the classical complement pathway; C1r and C1s perform the proteolysis.'
  molecular_function:
    id: GO:0019865
    label: immunoglobulin binding
  directly_involved_in:
  - id: GO:0006958
    label: complement activation, classical pathway
  locations:
  - &id001
    id: GO:0005576
    label: extracellular region
  in_complex:
    id: GO:0005602
    label: complement component C1 complex
  supported_by:
  - reference_id: PMID:12847249
    supporting_text: the MBP-ghB bound preferentially to IgG
  - reference_id: PMID:19006321
  - reference_id: PMID:23650384
    supporting_text: LysB61 and LysC58 each play a key role
  - reference_id: PMID:34155115
- description: As a structural constituent of the heterotrimeric C1q heads, the B
    chain contributes to recognition of phosphatidylserine exposed on apoptotic cells.
    Human C1q and its globular region directly bind this lipid. The principal crystallographically
    observed phosphoserine pocket lies on the C chain; autonomous phosphatidylserine
    binding by the B chain has not been established by these experiments.
  contributes_to_molecular_function:
    id: GO:0001786
    label: phosphatidylserine binding
  locations:
  - *id001
  in_complex: &id002
    id: GO:0062167
    label: complement component C1q complex
  supported_by:
  - reference_id: PMID:18250442
    supporting_text: C1q recognizes PS specifically and avidly
  - reference_id: PMID:12960167
- description: The B chain contributes to the extracellular C1q ligand assembly that
    binds inhibitory immunoreceptors. Human whole-C1q experiments demonstrate CD33
    binding and ITIM phosphorylation and coordinated engagement of CD33 with LAIR-1
    on monocytes. This is a contributed ligand function of the intact protein assembly;
    the experiments do not establish that an isolated B chain is sufficient for receptor
    activation.
  contributes_to_molecular_function:
    id: GO:0048018
    label: receptor ligand activity
  directly_involved_in:
  - id: GO:0007165
    label: signal transduction
  locations:
  - *id001
  in_complex: *id002
  supported_by:
  - reference_id: PMID:28325905
    supporting_text: Whole C1q is required to crosslink CD33
suggested_questions:
- question: Which human B-chain residues, if any, directly contact phosphatidylserine
    independently of the C-chain pocket in the intact heterotrimer?
- question: Which C1q chain surfaces mediate CD33/LAIR-1 signaling, and can B-chain
    substitutions separate that ligand function from complement initiation?
- question: Do the original rodent donor experiments directly establish the fine presynaptic-membrane
    and glutamatergic-synapse locations of C1QB?
suggested_experiments:
- description: Reconstitute human C1q with targeted B-chain substitutions, confirm
    intact A/B/C assembly, and compare immunoglobulin binding, C1r/C1s recruitment,
    phosphatidylserine binding and CD33 signaling. Include C-chain pocket mutants
    and matched assembly controls to distinguish direct contacts from structural disruption.
