id: P02746
gene_symbol: C1QB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: C1QB encodes the B chain of the secreted complement recognition protein
  C1q. Six copies each of the A, B and C chains assemble into six collagen-like stems
  ending in heterotrimeric globular heads. The B-chain globular module recognizes
  immunoglobulins, while its collagen-like region helps recruit the C1r/C1s protease
  tetramer. These recognition and assembly functions initiate the classical complement
  pathway without conferring protease activity on C1QB. As part of intact C1q, the
  B chain also contributes to phosphatidylserine recognition and inhibitory immunoreceptor
  signaling. Complement-dependent synaptic remodeling has been demonstrated in rodents;
  these studies generally test the assembled C1q system rather than an autonomous
  B-chain activity.
