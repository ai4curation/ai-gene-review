suggested_questions:
- question: Does membrane attractin act as an adaptor that delivers the MGRN1 ubiquitin ligase to melanocortin
    receptors, and does the same mechanism underlie its role in myelination?
suggested_experiments:
- description: Map ATRN-MGRN1-MC4R complex formation and receptor ubiquitination in cells expressing ATRN
    domain mutants, and test whether oligodendrocyte-specific Atrn loss reproduces spongiform hypomyelination.
