- id: PMID:7539799
  title: A novel form of dipeptidylpeptidase IV found in human serum. Isolation, characterization, and
    comparison with T lymphocyte membrane dipeptidylpeptidase IV (CD26).
  findings:
  - statement: Serum 'DPPIV' (attractin) is a 175 kDa protein.
    supporting_text: We show that serum DPPIV is a monomer of 175 kDa in contrast to rsCD26 of 105-110
      kDa, that it exists as a trimer, and that it is probably a serine proteinase.
  - statement: The serum form has DPPIV activity.
    supporting_text: The large serum form expresses functional DPPIV activity with substrate and inhibitor
      specificities and pH activity profile similar to those of rsCD26.
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:17261078
      supported_by:
      - reference_id: PMID:17261078
        supporting_text: Nevertheless, a DP4 impurity could be demonstrated in purified plasma attractin
          and the activity could be removed by ADA affinity chromatography, resulting in a homogenous
          attractin preparation without DP4 activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; first purification. The DPPIV attribution was later traced to a contaminant
      (PMID:17261078).
  full_text_unavailable: true
- id: PMID:9736737
  title: Attractin (DPPT-L), a member of the CUB family of cell adhesion and guidance proteins, is secreted
    by activated human T lymphocytes and modulates immune cell interactions.
  findings:
  - statement: Attractin mediates monocyte spreading and T-cell clustering.
    supporting_text: We have cloned attractin and find that, as in its natural serum form, it mediates
      the spreading of monocytes that become the focus for the clustering of nonproliferating T lymphocytes.
  - statement: Attractin binds leukocytes with high affinity.
    supporting_text: We determined whether attractin was binding directly to leukocytes and found by Scatchard
      analysis that there were ≈1000 bound molecules of attractin/resting T cell, with ≈2000 bound molecules/PHA-activated
      T cell, with a K d for both between 5 and 50 pM, indicative of a specific high affinity interaction
      (data not shown).
  - statement: Recombinant attractin has DPPIV activity.
    supporting_text: Moreover, by using recombinant attractin, we confirmed the DPPIV activity and crossreactivity
      with anti-CD26 antibodies that led us to believe that attractin is related to CD26/DPPIV ( 15 ,
      19 ).
    finding_review:
