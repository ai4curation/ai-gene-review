    summary: Signaling receptor activity (IEA, mouse ortholog projection). Transgenic, biochemical and
      genetic-interaction experiments in mouse show that membrane attractin is a low-affinity receptor
      for agouti protein in vitro and in vivo, and mahogany acts genetically between Agouti and the melanocortin
      receptors. The term fits the membrane isoform's role in agouti signalling. How it transduces the
