  review:
    summary: Positive regulation of leukocyte cell-cell adhesion (NEW, IDA). Recombinant secreted attractin,
      like the natural serum form, makes monocytes spread and become foci for clustering of non-proliferating
      T lymphocytes. It binds leukocytes at about 1000-2000 high-affinity sites per cell (Kd 5-50 pM).
