- gap_statement: How membrane attractin transmits the agouti signal (as a co-receptor, an adaptor for
    the MGRN1 ubiquitin ligase, or otherwise), what the leukocyte receptor for secreted attractin is,
    and how attractin loss causes spongiform hypomyelination are unknown.
