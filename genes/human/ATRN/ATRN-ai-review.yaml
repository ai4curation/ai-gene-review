id: O75882
gene_symbol: ATRN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATRN (attractin) is a large multidomain glycoprotein with CUB, EGF-like and laminin EGF-like,
  C-type lectin, PSI and kelch domains. It is made as a secreted isoform, a circulating plasma protein
  released by activated T cells, and as a single-pass type I membrane isoform, the product of the mouse
  mahogany locus. Secreted attractin promotes monocyte spreading and T-lymphocyte clustering. Purified
  attractin lacks the dipeptidyl peptidase IV activity first attributed to it. Mahogany acts genetically
  between Agouti and the melanocortin receptors, controlling pigmentation and Agouti-driven obesity. Loss
  of attractin in rodents causes spongiform neurodegeneration and hypomyelination, and a homozygous ATRN
  splice mutation causes hypomyelinating leukodystrophy in humans.
