- id: PMID:10086356
  title: The mouse mahogany locus encodes a transmembrane form of human attractin.
  findings:
  - statement: Mouse mahogany encodes transmembrane attractin.
    supporting_text: The predicted protein encoded by Mgca is a 1,428-amino-acid, single-transmembrane-domain
      protein that is expressed in many tissues, including pigment cells and the hypothalamus.
  - statement: Mahogany acts between Agouti and melanocortin receptors.
    supporting_text: The mahogany (mg) mutation suppresses the effects of lethal yellow on pigmentation
      and body weight, and results of our previous genetic studies place mg downstream of transcription
      of Agouti but upstream of melanocortin receptors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:17261078
  title: Does human attractin have DP4 activity?
  findings:
  - statement: Purified attractin lacks DP4 activity.
    supporting_text: This indicates that the multidomain protein attractin acts as a receptor or adhesion
      protein rather than a protease.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:19056867
  title: Large-scale proteomics and phosphoproteomics of urinary exosomes.
  findings: []
- id: PMID:23533145
  title: In-depth proteomic analyses of exosomes isolated from expressed prostatic secretions in urine.
  findings: []
- id: PMID:7539799
  title: A novel form of dipeptidylpeptidase IV found in human serum. Isolation, characterization, and
    comparison with T lymphocyte membrane dipeptidylpeptidase IV (CD26).
  findings:
  - statement: Serum 'DPPIV' (attractin) is a 175 kDa protein.
    supporting_text: We show that serum DPPIV is a monomer of 175 kDa in contrast to rsCD26 of 105-110
      kDa, that it exists as a trimer, and that it is probably a serine proteinase.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; first purification. Its DPPIV attribution was later shown to be a contaminant
      (PMID:17261078).
  full_text_unavailable: true
- id: PMID:9736737
  title: Attractin (DPPT-L), a member of the CUB family of cell adhesion and guidance proteins, is secreted
    by activated human T lymphocytes and modulates immune cell interactions.
  findings:
  - statement: Attractin mediates monocyte spreading and T-cell clustering.
    supporting_text: We have cloned attractin and find that, as in its natural serum form, it mediates
      the spreading of monocytes that become the focus for the clustering of nonproliferating T lymphocytes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:10811918
  title: Secreted and membrane attractin result from alternative splicing of the human ATRN gene.
  findings:
  - statement: Membrane and secreted attractin arise by alternative splicing.
    supporting_text: The mRNA isoform for membrane attractin splices over the LINE-1 exon and includes
      five exons encoding transmembrane and cytoplasmic domains with organization and coding potential
      almost identical to that of the mouse gene.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
- id: PMID:11444801
  title: Mice with mutations in the mahogany gene Atrn have cerebral spongiform changes.
  findings:
  - statement: Atrn mutant mice have spongiform CNS degeneration.
    supporting_text: A new mutation characterized by mahogany coat color, sprawling gait, tremors, and
      severe vacuolization of cerebrum, brainstem, granular layer of cerebellum and spinal cord was discovered
      in a stock of Mus castaneus mice.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; mouse.
  full_text_unavailable: true
- id: PMID:28493104
  title: Hypomyelinating leukodystrophy associated with a deleterious mutation in the ATRN gene.
  findings:
  - statement: A homozygous ATRN splice mutation causes hypomyelinating leukodystrophy.
    supporting_text: A homozygous mutation, c.3068+5G>A, was identified in the ATRN gene, with the consequent
      insertion of an intronic sequence into the patients' cDNA and a predicted premature termination
      of the ATRN polypeptide.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; one family.
  full_text_unavailable: true
