- id: PMID:17261078
  title: Does human attractin have DP4 activity?
  findings:
  - statement: Purified attractin lacks DP4 activity.
    supporting_text: Nevertheless, a DP4 impurity could be demonstrated in purified plasma attractin and
      the activity could be removed by ADA affinity chromatography, resulting in a homogenous attractin
      preparation without DP4 activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
  full_text_unavailable: true
