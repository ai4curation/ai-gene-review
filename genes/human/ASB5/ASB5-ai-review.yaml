description: 'ASB5 is an ankyrin repeat and SOCS box protein of the ASB family, predicted to act as the
  substrate-recognition subunit of an Elongin B/C-Cullin 5 E3 ubiquitin ligase; no substrate is known.
  It is expressed in vascular and muscle lineages: it is upregulated in growing collateral arteries and
  is a specific marker of skeletal-muscle satellite cells, and its cardiac expression depends on the transcription
  factor SRF. Asb5-null mice show no defect in satellite-cell function or muscle regeneration, whereas
  loss of both zebrafish paralogs (asb5a and asb5b) disrupts early heart development, contraction and
  left-right cardiac asymmetry.'
