id: Q92830
gene_symbol: KAT2A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: KAT2A encodes GCN5, a nuclear GNAT-family lysine acetyltransferase and alternative
  catalytic subunit of the SAGA/STAGA, TFTC and ATAC coactivator complexes. KAT2A acetylates histone
  H3, including H3K9, to couple promoter and enhancer recruitment to RNAPII transcription, and it
  also acetylates non-histone targets such as CEBPB, PLK4, TBX5, PPARGC1A, cGAS and NME1 in more
  specific regulatory contexts.
