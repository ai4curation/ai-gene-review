id: Q92871
gene_symbol: PMM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PMM1 encodes phosphomannomutase 1, a soluble cytosolic member of the
  eukaryotic haloacid-dehalogenase phosphomannomutase family. The Mg(2+)-dependent
  enzyme reversibly isomerizes D-mannose 6-phosphate and alpha-D-mannose
  1-phosphate, supplying the mannose 1-phosphate precursor used for GDP-mannose
  and dolichol-phosphate-mannose biosynthesis. Human PMM1 is catalytically
  conserved with its paralog PMM2 but forms a separate vertebrate subfamily, has
  no established congenital-disorder-of-glycosylation role, and has also been
  implicated in glucose 1,6-bisphosphate phosphatase activity under ischemic
  brain-like conditions.
