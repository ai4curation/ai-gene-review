core_functions:
  - description: >-
      Soluble cytosolic, Mg(2+)-dependent phosphomannomutase that reversibly
      isomerizes D-mannose 6-phosphate and alpha-D-mannose 1-phosphate. The
      reaction is the committed mutase step in GDP-mannose biosynthesis and
      therefore feeds dolichol-phosphate-mannose and mannosyl donor production
      for secretory-pathway glycosylation. PMM1 is an active vertebrate PMM
      paralog rather than the primary PMM2-CDG locus.
    molecular_function:
      id: GO:0004615
      label: phosphomannomutase activity
    directly_involved_in:
