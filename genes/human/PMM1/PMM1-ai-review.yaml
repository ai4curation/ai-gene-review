  - id: PMID:16189514
    title: Towards a proteome-scale map of the human protein-protein interaction network.
    findings:
      - statement: >-
          This proteome-scale yeast two-hybrid screen generated the CCSB-HI1 map
          and reported a PMM1-RAB6A interaction.
  - id: PMID:16540464
    title: The X-ray crystal structures of human alpha-phosphomannomutase 1 reveal the
      structural basis of congenital disorder of glycosylation type 1a.
    findings:
      - statement: >-
          Alpha-PMM1 structures with magnesium and mannose 1-phosphate establish
          the PMM1 active site and show that PMM1 and PMM2 have conserved active
          sites and similar kinetic properties.
  - id: file:genes/human/PMM1/PMM1-uniprot.txt
    title: UniProtKB Q92871 (PMM1_HUMAN) Phosphomannomutase 1
    findings:
      - statement: >-
          UniProt curates PMM1 as a Mg(2+)-dependent EC 5.4.2.8
          phosphomannomutase and records a qualified, IMP-regulated
          glucose-1,6-bisphosphatase activity under ischemic/anoxic conditions.
        supporting_text: >-
          In addition, may be responsible for the degradation of
          glucose-1,6-bisphosphate in ischemic brain.
  - id: PMID:25416956
    title: A proteome-scale map of the human interactome network.
    findings:
      - statement: >-
          HI-II-14 is a proteome-scale binary human interactome map that reported
          a high-throughput PMM1-RAB6A hit.
  - id: PMID:32296183
    title: A reference map of the human binary protein interactome.
    findings:
      - statement: >-
          HuRI is a broad human all-by-all binary interactome map; it supports
          the reported PMM1-RAB6A isoform and PMM1-RAB6B interactions, but not a
          specific molecular function term.
  - id: PMID:9070917
    title: PMM (PMM1), the human homologue of SEC53 or yeast phosphomannomutase, is
      localized on chromosome 22q13.
    findings:
      - statement: >-
          The original PMM1 cloning paper expressed the human cDNA in E. coli and
          purified an active phosphomannomutase, establishing the gene product as
          a human PMM.
  - id: Reactome:R-HSA-446201
    title: PMM1,2 isomerise Man6P to Man1P
    findings:
      - statement: >-
          Reactome curates both PMM1 and PMM2 as cytosolic phosphomannomutases in
          the mannose 6-phosphate to mannose 1-phosphate reaction.
  - id: Reactome:R-HSA-446205
    title: Synthesis of GDP-mannose
    findings:
      - statement: >-
          GDP-mannose synthesis converts fructose 6-phosphate and GTP to the
          donor used for early N-glycan precursor mannose additions and
          dolichyl-phosphate-mannose synthesis.
