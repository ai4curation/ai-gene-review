knowledge_gaps:
  - gap_statement: >-
      Whether PMM1's IMP-enhanced glucose-1,6-bisphosphatase activity is a
      physiological brain function during anoxia or ischemia remains unresolved.
    boundary: >-
      UniProt records an experimentally grounded but qualified PMM1 role in
      glucose-1,6-bisphosphate degradation in ischemic brain and a mouse-orthology
      statement that IMP inhibits mutase activity while enhancing glucose-1,6-bisphosphatase
      activity. The reviewed GOA rows establish the Man6P/Man1P mutase as PMM1's
      main function; this review leaves the phosphatase activity as an open
      physiological question.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      Resolving this point distinguishes a genuine PMM1 secondary activity from an
      IMP-regulated in vitro activity of uncertain relevance in ischemic brain.
    resolution: >-
      Measure endogenous PMM1-dependent glucose-1,6-bisphosphate hydrolysis and
      mannose-phosphate mutase flux under controlled anoxia or ischemia-like
      conditions in brain-relevant human cells.
    provenance:
      - reference_id: file:genes/human/PMM1/PMM1-uniprot.txt
        record_section: ["CC:FUNCTION"]
        supporting_text: >-
          In addition, may be responsible for the degradation of
          glucose-1,6-bisphosphate in ischemic brain.
      - reference_id: file:genes/human/PMM1/PMM1-uniprot.txt
        record_section: ["CC:ACTIVITY REGULATION"]
        supporting_text: >-
          IMP, a metabolite whose concentration is elevated in anoxia, inhibits
          phosphomannomutase and phosphoglucomutase activities and strongly
          enhances glucose-1,6-bisphosphatase activity.
suggested_questions:
  - question: >-
      Does IMP-regulated glucose-1,6-bisphosphatase activity represent a
      physiological function of PMM1 in ischemic or anoxic brain, or is it an
      in vitro switch of unclear cellular relevance?
suggested_experiments:
  - hypothesis: >-
      IMP redirects PMM1 from mannose-phosphate mutase flux toward physiologically
      relevant glucose-1,6-bisphosphate hydrolysis during brain-cell anoxia.
    description: >-
      In PMM1 knockout and rescue neuronal or glial cells, quantify glucose-1,6-bisphosphate,
      mannose-1-phosphate, and mannose-6-phosphate pools during normoxia and anoxia
      with matched IMP manipulation; rescue with mutase-competent phosphatase-impaired
      PMM1 variants if separable active-site mutations are available.
    experiment_type: ischemia-like metabolite flux and separation-of-function rescue
