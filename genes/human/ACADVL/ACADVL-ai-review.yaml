- id: PMID:9599005
  title: Very-long-chain acyl-CoA dehydrogenase subunit assembles to the dimer form on mitochondrial inner
    membrane.
  findings:
  - statement: Mature VLCAD is a homodimer of ~70 kDa subunits associated with the mitochondrial inner
      membrane; membrane association precedes and is required for dimer assembly. The monomeric mutant
      S583W fails to bind the membrane and remains soluble in the matrix.
    supporting_text: association of VLCAD protein with mitochondrial inner membrane is necessary for dimer
      assembly and formation of mature VLCAD
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract directly describes wild-type membrane-associated dimer assembly and
      the soluble-matrix S583W mutant. Broader catalytic substrate refinement uses separate human assays
      rather than attributing uninspected kinetics to this paper.
