- id: PMID:7479827
  title: Molecular basis of human mitochondrial very-long-chain acyl-CoA dehydrogenase deficiency causing
    cardiomyopathy and sudden death in childhood.
  findings:
  - statement: VLCAD catalyzes the first step of beta-oxidation of long-chain fatty acids, the major energy
      source in heart; VLCAD deficiency reduces myocardial beta-oxidation and energy production and causes
      cardiomyopathy and sudden death.
    supporting_text: VLCAD deficiency reduces myocardial fatty acid beta-oxidation and energy production
      and is associated with cardiomyopathy and sudden death in childhood
  reference_review:
