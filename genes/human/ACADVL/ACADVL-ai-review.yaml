  title: The layered structure of human mitochondrial DNA nucleoids.
  findings:
  - statement: Table 1 assigns ACADVL/NP_000009 to Class I, with independent peptide counts of 3 for native
      anti-TFAM, 0 for native anti-mtSSB, 3 for cross-linked preparation 1 and 0 for preparation 2. This
      supports biochemical nucleoid association in one preparation of each category, without establishing
      direct DNA binding or genome maintenance.
