- id: PMID:9461620
  title: Catalytic and FAD-binding residues of mitochondrial very long chain acyl-coenzyme A dehydrogenase.
  findings:
  - statement: VLCAD is one of four flavoproteins catalyzing the initial step of mitochondrial beta-oxidation.
      Glu-422 is the catalytic base (E422Q abolishes activity by preventing the VLCAD-palmitoyl-CoA charge-transfer
      complex); Phe-418 is required for FAD binding/reduction and FAD loss destabilizes folding.
    supporting_text: Glu-422 of VLCAD has been presumed to be the catalytic residue that abstracts the
      alpha-proton in the alphabeta-dehydrogenation reaction. Replacing Glu-422 with glutamine (E422Q)
      caused a loss of enzyme activity
  reference_review:
    relevance: HIGH
