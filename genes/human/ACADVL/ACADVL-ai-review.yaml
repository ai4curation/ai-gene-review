id: P49748
gene_symbol: ACADVL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACADVL encodes very-long-chain acyl-CoA dehydrogenase (VLCAD), a mitochondrial FAD-dependent
  enzyme (EC 1.3.8.9 and EC 1.3.8.8) that catalyzes the initial dehydrogenation step of fatty acid beta-oxidation.
  It converts long-chain and very-long-chain acyl-CoA thioesters to trans-2-enoyl-CoAs, transferring reducing
  equivalents to electron-transfer flavoprotein. Its substrate range extends approximately from C12 to
  C24, with strong activity toward long-chain substrates such as palmitoyl-CoA. The mature enzyme is a
  homodimer associated peripherally with the matrix face of the inner mitochondrial membrane. This membrane-associated
  homodimer differs in organization from the soluble matrix tetramers SCAD, MCAD and LCAD. Membrane association
  contributes to dimer assembly, while bound FAD supports catalysis and protein stability. VLCAD-dependent
  fatty acid oxidation supplies energy particularly in heart and skeletal muscle. Loss of activity causes
  VLCAD deficiency, which can present with cardiomyopathy, hypoketotic hypoglycemia, or exercise-associated
  myopathy and rhabdomyolysis.
