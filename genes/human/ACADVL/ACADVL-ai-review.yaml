proposed_new_terms: []
suggested_questions:
- question: Which mouse Acadvl loss-of-function effects on lipid synthesis, oxidation and cholesterol
    metabolism reflect altered metabolic flux, and which reflect compensatory transcriptional feedback?
- question: What physiological role, if any, accompanies the VLCAD pool detected in biochemical mitochondrial
    nucleoid preparations, and does it contact DNA directly or associate through other proteins?
suggested_experiments:
- description: Measure fatty acid oxidation flux and transcriptional feedback separately in matched Acadvl-deficient
    and rescued hepatocytes under fasting-like conditions.
  hypothesis: Loss of catalytic flux can increase compensatory oxidation-gene expression without making
    VLCAD a direct transcriptional repressor.
