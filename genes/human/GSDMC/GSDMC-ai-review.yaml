core_functions:
- molecular_function:
    id: GO:0022829
    label: wide pore channel activity
  description: Gasdermin-C is an autoinhibited cytosolic precursor whose N-terminal domain, once
    released by proteolysis of the interdomain linker, binds membranes and homo-oligomerizes into
    a large transmembrane pore. Pore formation is the one property of GSDMC demonstrated by direct
    reconstitution - the cleaved fragment, but not the full-length protein, pellets with liposomes,
    decorates them with regular EM-visible pores and releases encapsulated dye. What is not settled
    is which membrane the pore forms in and what follows from it. In cancer cells the caspase-8 generated
    fragment reaches the plasma membrane and executes pyroptosis, whereas in intestinal epithelium
    the cathepsin-S generated fragment instead permeabilizes Rab7-positive late endosomal vesicles
    and alters lipid-droplet turnover, with cell death explicitly not the main consequence. GSDMC
    also carries a beta1-beta2 lipid-binding motif one residue shorter than the other gasdermins,
    and completing that motif increases both oligomerization and killing, which suggests that limited
    lytic activity is an intrinsic, evolved property of this paralog.
