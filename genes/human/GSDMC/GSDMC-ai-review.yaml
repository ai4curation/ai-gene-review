- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Plasma-membrane targeting of the cleaved N-terminal fragment - real in cancer-cell settings,
      but reported not to occur for the physiologically cleaved intestinal form.
    action: KEEP_AS_NON_CORE
    reason: 'GOA effectively carries both sides of this dispute, since the same term is also present
      with EXP evidence from PMID:32929201. Caspase-8-cleaved GSDMC does reach the plasma membrane
      and form pores there in cancer cells (PMID:32929201). However, Pandey et al. report that cathepsin-S
      cleaved GSDMC does the opposite in intestinal epithelium: instead of localizing to the plasma
      membrane, the N-terminal fragment targets Rab7+ vesicles (PMID:40701157). Because GSDMC''s
      steady-state expression is epithelial, the plasma-membrane location is retained but demoted
      to non-core, and a late endosome location is proposed as a NEW annotation. Both plasma membrane
      rows carry the same action.'
    supported_by:
    - reference_id: PMID:40701157
      supporting_text: Mechanistically, instead of localizing to the plasma membrane, we showed that
        cleaved GsdmC targeted Rab7+ vesicles, such as late endosomes.
