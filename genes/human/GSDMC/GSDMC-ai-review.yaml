- term:
    id: GO:0022829
    label: wide pore channel activity
  evidence_type: IDA
  original_reference_id: PMID:32929201
  qualifier: enables
  review:
    summary: Proposed new annotation - the reconstituted pore-forming activity of the cleaved GSDMC
      N-terminal fragment, which GOA does not currently record at all.
    action: NEW
    reason: GSDMC has no molecular-function annotation for pore formation despite this being the
      best-evidenced property of the protein and the one the family is defined by. Hou et al. showed
      directly that the caspase-8-generated N-terminal fragment, but not the full-length protein,
      binds liposomes, that the liposome surface then carries regular pores by electron microscopy,
      and that encapsulated Tb3+ leaks out (PMID:32929201). GO:0022829 is the term GO_Central already
      uses for the GSDMD pore, so this keeps GSDMC consistent with its paralog. This annotation records
      competence; the separate question of which membrane the pore forms in, and whether lysis follows,
      is handled on the localization and pyroptosis rows.
    supported_by:
    - reference_id: PMID:32929201
      supporting_text: Upon incubation with caspase-8-cleaved GSDMC, the liposome surface showed
        multiple pores of regular shape and size
    - reference_id: PMID:32929201
      supporting_text: the N-terminal domain, but not full-length GSDMC, bound to liposomes, as evidenced
        by its detection in the liposome pellet
- term:
    id: GO:0005770
    label: late endosome
  evidence_type: IDA
  original_reference_id: PMID:40701157
  qualifier: located_in
  review:
    summary: Proposed new annotation - the cleaved N-terminal fragment targets and penetrates Rab7+
      late endosomal vesicles.
    action: NEW
    reason: This is the localization claim at the heart of the current dispute and it is entirely
      absent from GOA. Pandey et al. imaged RFP-tagged cathepsin-S-generated human GSDMC N-terminal
      fragment colocalizing with and penetrating into Rab7+ vesicles in HeLa cells, reproduced the
      result with murine GSDMC2 and GSDMC4 N-terminal fragments and in C. elegans, and showed that
      Rab7 inhibition rescues the type 2 immune phenotype of Gsdmc-null mice. Rab7+ vesicles are
      identified in the paper as largely late endosomes. Proposed conservatively as a location only;
      the downstream lipid-droplet and type 2 immunity processes are left for experts to adjudicate.
    supported_by:
    - reference_id: PMID:40701157
      supporting_text: Mechanistically, instead of localizing to the plasma membrane, we showed that
        cleaved GsdmC targeted Rab7+ vesicles, such as late endosomes.
    - reference_id: PMID:40701157
      supporting_text: Red fluorescent protein (RFP)-tagged CTSS-generated GSDMCN-ter colocalized
        with, and even penetrated into Rab7+ vesicles, when expressed in HeLa cells, unlike full-length
        GSDMC
