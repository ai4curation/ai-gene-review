      cleaved GsdmC targeted Rab7+ vesicles, such as late endosomes.
suggested_questions:
- question: Does cleaved GSDMC form a pore in the limiting membrane of Rab7+ late endosomes, or does
    it permeabilize them by some non-pore mechanism? The Pandey data show penetration into and enlargement
    of Rab7+ vesicles and loss of vesicle integrity, but the pore itself has only ever been reconstituted
    on plasma-membrane-mimetic liposomes.
  experts:
  - Reinhard Hinterleitner
  - Yi-Nan Gong
- question: Is the choice between plasma membrane and Rab7+ vesicle set by the activating protease
    (caspase-8 or granzyme B versus cathepsin S), by the cleavage position, or by the cell type?
    All three proteases have now been reported, generating fragments of potentially different lengths.
  experts:
  - Surya P. Pandey
  - Qiao Wu
- question: What lipid does the GSDMC N-terminal fragment actually recognize? The three phospholipid-binding
    terms on this gene are family-level transfers from GSDMD, and the only GSDMC experiment used
    a five-component liposome mix. Given that GSDMC's beta1-beta2 lipid-binding motif is one residue
    shorter than in the rest of the family, a headgroup-resolved measurement could settle whether
    the GSDMD paradigm applies at all.
  experts: []
- question: Is the proposed nuclear scaffolding function of GSDMC (import via IPO7-KPNB1-NUP93, recruitment
    of NAT10 and of BAZ1B/SMARCA5) reproducible outside the originating laboratory, and is it a property
    of full-length GSDMC or of a cleavage fragment? This would be a major departure from gasdermin
    biology and currently rests on one paper.
  experts: []
- question: Should the PAINT annotation of defense response to bacterium (GO:0042742) extend to GSDMC?
    The donors are GSDMD, GSDMA and GSDMB, none of which is GSDMC, and GSDMC's documented in-vivo
    immune role is anti-helminth type 2 immunity rather than antibacterial defence.
  experts: []
suggested_experiments:
- hypothesis: The GSDMC N-terminal fragment forms bona fide transmembrane pores in late endosomal
    membranes, and its lipid specificity differs from that of GSDMD.
  description: Reconstitute purified cathepsin-S-cleaved human GSDMC N-terminal fragment with single-headgroup
    liposomes (separately PI4P, PI(4,5)P2, phosphatidylserine, phosphatidylinositol, bis(monoacylglycero)phosphate
    and cardiolipin) rather than a mixed-lipid preparation, and measure binding by co-sedimentation
    and permeabilization by dye release. Compare side by side with caspase-8-cleaved GSDMC and with
    GSDMD. Follow with cryo-EM of any pore that forms, to test whether the one-residue-shorter beta1-beta2
    motif changes oligomer number or geometry.
  experiment_type: Liposome reconstitution and cryo-electron microscopy
- hypothesis: Whether GSDMC lyses the cell or permeabilizes late endosomes is decided by the activating
    protease and the resulting fragment boundary, not by the cell type.
  description: Express a panel of defined human GSDMC N-terminal fragments corresponding to the caspase-8,
    granzyme B and cathepsin S cleavage positions in the same cell background, and score subcellular
    targeting (plasma membrane versus Rab7/LAMP1 compartments) by live imaging alongside LDH release
    and endosomal integrity reporters. Include the single-residue beta1-beta2 insertion mutant as
    a gain-of-lysis control.
  experiment_type: Structure-function and live-cell imaging
- hypothesis: GSDMC is present in the nucleus and associates with chromatin in lung adenocarcinoma
    cells under nutrient stress or irradiation.
  description: Independently test the nuclear model with subcellular fractionation plus quantitative
    imaging in an unrelated laboratory's LUAD lines, endogenous-tag GSDMC to avoid overexpression
    artefacts, and run CUT&RUN or ChIP-seq for GSDMC alongside NAT10 and SMARCA5. Ask specifically
    whether nuclear GSDMC is full-length or a cleavage product, and whether import depends on the
    leucine zipper and the two predicted nuclear localization signals noted in the original MLZE
    description.
  experiment_type: Subcellular fractionation, endogenous tagging and chromatin profiling
