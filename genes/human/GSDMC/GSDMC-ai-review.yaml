gene_symbol: GSDMC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Gasdermin-C, a member of the gasdermin family of membrane-permeabilizing proteins, originally
  cloned from metastatic melanoma cells as MLZE. Like other gasdermins it is a two-domain, autoinhibited
  cytosolic zymogen in which the C-terminal domain masks the lipid-binding surface of the N-terminal
  domain; proteolysis in the interdomain linker releases the N-terminal fragment, which binds membranes
  and homo-oligomerizes into a large transmembrane pore. Several proteases have been reported to
  perform this cleavage in different settings - caspase-8 downstream of TNF and of the metabolite
  alpha-ketoglutarate, granzyme B in melanoma cells, and cathepsin S in intestinal epithelium - and
  the physiological consequence of cleavage is disputed. In cancer cells the released fragment forms
  plasma-membrane pores and executes pyroptosis, whereas in intestinal epithelial cells, where the
  protein is expressed at steady state and induced by helminth infection, the cleaved fragment instead
  targets Rab7-positive late endosomal vesicles, alters lipid-droplet turnover and amplifies type
  2 immunity without lysis being the main outcome. GSDMC differs from the other gasdermins by a one-residue-shorter
  lipid-binding motif in the beta1-beta2 loop, and restoring the missing residue increases oligomerization
  and killing, which suggests that weak pore-forming activity is an intrinsic property of this paralog
  rather than an experimental artefact. A nuclear, chromatin-associated scaffolding role has also
  been proposed but is so far supported by a single study. GSDMC is expressed mainly in trachea,
  spleen, oesophagus, gastric and intestinal epithelium, and its overexpression is associated with
  poor outcome in several carcinomas.
existing_annotations:
- term:
    id: GO:0042742
    label: defense response to bacterium
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Family-level phylogenetic transfer of antibacterial defence to GSDMC. The donor genes
      carry the evidence; GSDMC itself does not.
    action: KEEP_AS_NON_CORE
    reason: The WITH/FROM donors for this row resolve to mouse Gsdmd (MGI:MGI:1916396), human GSDMA
      (UniProtKB:Q96QA5) and human GSDMB (UniProtKB:Q8TAX9) - all three of which do have direct antibacterial
      evidence. GSDMC is not among the donors, and no published work assigns GSDMC an antibacterial
      role. The one in-vivo immune function documented for GSDMC is anti-helminth type 2 immunity
      in the gut (PMID:40701157), a different arm of mucosal defence. Retained rather than removed
      because an IBA encodes a PAINT curator's judgement about where in the gasdermin tree the function
      arose, and that node placement could not be inspected here; demoted to non-core because there
      is no GSDMC-specific support. Flagged for PAINT re-examination in suggested_questions.
- term:
    id: GO:0070269
    label: pyroptotic inflammatory response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: GSDMC can execute pyroptosis, but whether pyroptosis is its physiological default is
      the central open dispute about this protein.
    action: KEEP_AS_NON_CORE
    reason: 'Pyroptotic competence is real and directly demonstrated: caspase-8-cleaved GSDMC binds
      liposomes and forms visible pores (PMID:32929201), alpha-ketoglutarate drives GSDMC-dependent
      pyroptosis through DR6/caspase-8 (PMID:34012073), and granzyme-B-cleaved GSDMC executes pyroptosis
      in melanoma cells under a synthetic Nur77 ligand (PMID:41407678). Against that, Pandey et al.
      report that in intestinal epithelium - the tissue where GSDMC is actually expressed at steady
      state - cell death is not the main consequence of cleavage, that the cleaved fragment goes
      to Rab7+ vesicles rather than the plasma membrane, and that GSDMC carries a one-residue-shorter
      lipid-binding motif whose completion is what makes it oligomerize and kill (PMID:40701157).
      A 2025 Immunity commentary frames untangling GSDMC from pyroptosis as the open problem (PMID:41092892).
      Kept as a genuine capability but demoted from core: the melanoma result shows GSDMC CAN form
      a lytic pore under a strong artificial trigger, which is not the same claim as pyroptosis being
      what GSDMC normally does. Note that GSDMC (UniProtKB:Q9BYG8) appears in this row''s own WITH/FROM,
      which is expected and marks experimental grounding on the target itself, not circular support.'
    supported_by:
    - reference_id: PMID:32929201
      supporting_text: GSDMC is specifically cleaved by caspase-8 with TNFα treatment, generating
        a GSDMC N-terminal domain that forms pores on the cell membrane and induces pyroptosis.
    - reference_id: PMID:40701157
      supporting_text: Although IEC cell death is not the main consequence of GsdmC cleavage, inserting
        a single amino acid (aa) within the lipid-binding motif to match that of the other gasdermins
        enhanced GsdmC oligomerization and increased GsdmC-mediated cell death.
- term:
    id: GO:0005546
    label: phosphatidylinositol-4,5-bisphosphate binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Inner-leaflet phosphoinositide recognition transferred from GSDMD; no headgroup-resolved
      measurement exists for GSDMC.
    action: KEEP_AS_NON_CORE
    reason: This row is seeded only by GSDMD (MGI:MGI:1916396 mouse Gsdmd and UniProtKB:P57764 human
      GSDMD). The sole GSDMC-specific lipid experiment is a bulk liposome pellet assay in which the
      liposomes contained phosphatidylcholine, phosphatidylethanolamine, phosphatidylserine, phosphatidylinositol
      and PI(4,5)P2 mixed together (PMID:32929201), so it demonstrates membrane binding by the cleaved
      N-terminal fragment but cannot attribute it to any one headgroup. The transfer is also specifically
      challenged by the observation that GSDMC's beta1-beta2 lipid-binding motif is one residue shorter
      than in the other gasdermins and that completing it improves oligomerization (PMID:40701157)
      - i.e. GSDMC may not read inner-leaflet lipids the way GSDMD does. Retained because the node
      placement in the PANTHER tree was not inspectable here and because family-level lipid binding
      is plausible, but demoted to non-core pending a GSDMC-specific lipid-specificity measurement.
    supported_by:
    - reference_id: PMID:32929201
      supporting_text: the N-terminal domain, but not full-length GSDMC, bound to liposomes, as evidenced
        by its detection in the liposome pellet
