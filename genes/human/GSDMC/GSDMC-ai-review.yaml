    summary: Cytoplasmic localization of full-length GSDMC in the original MLZE cloning paper.
    action: ACCEPT
    reason: Biologically uncontroversial - the uncleaved gasdermin is a cytosolic zymogen - and the
      more specific cytosol annotation on this gene says the same thing. Our cache of PMID:11223543
