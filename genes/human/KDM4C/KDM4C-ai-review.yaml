  review:
    summary: >-
      Broad phylogenetic inference that JmjC demethylases regulate gene expression,
      placed at the deep PTN000075014 node.
    action: MODIFY
    reason: >-
      Correct but less specific than the human evidence supports. KDM4C positively
      regulates RNA polymerase II transcription of AR and ATF4 target genes by removing
      promoter H3K9me3; the gene already carries GO:0045944 by IDA, which is a
      descendant of this term. The broad term is appropriate at the deep node but not
      the most informative claim for KDM4C itself.
