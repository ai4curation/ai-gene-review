id: Q9H3R0
gene_symbol: KDM4C
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  KDM4C (JMJD2C, GASC1) is a nuclear Fe(II)- and 2-oxoglutarate-dependent JmjC-domain
  histone lysine demethylase of the KDM4A-C subgroup. Its N-terminal JmjN-JmjC catalytic
  core (with a structural zinc site) removes methyl groups from trimethylated and
  dimethylated histone H3 lysine 9 (H3K9me3/me2), converting them to lower methylation
  states, and also demethylates H3K36me3/me2 with lower efficiency; the dual H3K9/H3K36
  selectivity is shared with KDM4A and KDM4B and conserved across vertebrates, whereas the
  KDM4D/E paralogs act only on H3K9. The C-terminal double Tudor domain specifically
  recognises H3K4me3, targeting KDM4C to H3K4me3-positive transcription start sites, and the
  protein also carries two PHD fingers. By erasing the repressive H3K9me3 mark at promoters,
  KDM4C acts as a transcriptional coactivator: it binds the androgen receptor and cooperates
  with LSD1 (KDM1A) to stimulate androgen-receptor target genes, a step accelerated by PKN1
  phosphorylation of histone H3 threonine 11, and it partners with ATF4 to activate
  serine-glycine synthesis and amino acid transport genes. KDM4C is amplified at 9p24 and
  overexpressed in oesophageal squamous carcinoma, breast cancer and mediastinal B-cell and
  Hodgkin lymphomas, where its depletion reduces proliferation; in mouse, Kdm4c alone is
  dispensable for development but acts redundantly with Kdm4a to prevent promoter
  H3K9me3/H3K36me3 accumulation in embryonic stem cells.
