      KDM4C catalytic domain structure (PDB 2XML) and kinetics on H3K9me3/me2; KDM4A-C
      accept both H3K9 and H3K36 while KDM4D/E only accept H3K9; KDM4A-C are conserved in
      all vertebrates.
  reference_review:
