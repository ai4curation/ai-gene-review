  review:
    summary: >-
      Ensembl Compara transfer from mouse Kdm4c (Q8VCD7, an ortholog in the same PANTHER
      subfamily) of a pericentric heterochromatin localisation.
    action: KEEP_AS_NON_CORE
    reason: >-
      The mouse source annotation cannot be checked here, and the dominant genomic
      binding sites established for human and mouse KDM4C are H3K4me3-positive
      euchromatic TSSs rather than pericentric heterochromatin. Overexpressed KDM4C does
      act on heterochromatic H3K9me3 (delocalising HP1), so an association with
      heterochromatin is plausible, but it is not where the protein mainly acts. Kept as
      non-core rather than removed, in deference to the experimental mouse source.
    supported_by:
    - reference_id: PMID:16732293
      supporting_text: >-
        ectopic expression of GASC1 or other JMJD2 members markedly decreases H3K9me3/me2
        levels, increases H3K9me1 levels, delocalizes HP1 and reduces heterochromatin in
