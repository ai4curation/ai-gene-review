      KDM4C binds AR, demethylates H3K9me3 at AR target genes and stimulates
      AR-dependent transcription in cooperation with LSD1; knockdown blocks this and
      reduces tumour cell proliferation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      GOA-cited; abstract-only in cache. Abstract explicitly supports AR interaction,
      H3K9me3 demethylation at AR targets, LSD1 interaction and the knockdown phenotypes.
