- term:
    id: GO:0005412
    label: D-glucose:sodium symporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR042731
  review:
    summary: >-
      D-glucose:sodium symporter activity mapped electronically from the SMIT
      InterPro signature (IPR042731).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      SMIT1 heterologously expressed in oocytes can transport glucose and other
      monosaccharides, so the activity is not strictly false, but glucose is not
      the physiological/evolved substrate of SMIT1 - dedicated Na+/glucose
      cotransporters (SGLT1/SGLT2, SLC5A1/SLC5A2) perform cellular glucose
      symport. This is in-vitro promiscuity of a dedicated myo-inositol
      transporter, so the claim over-annotates SMIT1's function. It is not an
      ancestor of the accepted myo-inositol:sodium symporter term (it is a
      sibling), so marking it is not a true-path violation.
    supported_by:
    - reference_id: PMID:25756525
      supporting_text: When expressed in Xenopus oocytes, SLC5A3 transports,
        besides myo-inositol, a wide range of substrates including glucose,
        galactose and others monomeric sugars and carbohydrates
