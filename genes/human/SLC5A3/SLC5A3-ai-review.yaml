core_functions:
- description: >-
    Electrogenic sodium/myo-inositol symport: active import of myo-inositol (and
    scyllo-inositol) across the plasma membrane coupled to the inward Na+
    electrochemical gradient (2 Na+ : 1 inositol), driving cellular accumulation
    of myo-inositol as an osmolyte and phosphoinositide precursor. Transcription
    is induced by hyperosmotic stress, underpinning osmotic adaptation and
    cell-volume regulation.
  molecular_function:
    id: GO:0005367
    label: myo-inositol:sodium symporter activity
  directly_involved_in:
  - id: GO:1904679
    label: myo-inositol import across plasma membrane
  - id: GO:0015798
    label: myo-inositol transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  substrates:
  - id: CHEBI:17268
    label: myo-inositol
  - id: CHEBI:29101
    label: sodium(1+)
  supported_by:
  - reference_id: file:human/SLC5A3/SLC5A3-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: >-
      Electrogenic Na(+)-coupled sugar symporter that actively transports
      myo-inositol and its stereoisomer scyllo-inositol across the plasma
      membrane, with a Na(+) to sugar coupling ratio of 2:1
  - reference_id: PMID:24595108
    supporting_text: SMIT1 myo-[2-3H(N)] inositol uptake was still Na+-dependent
      when KCNQ1 was coexpressed
- description: >-
    Direct regulation of voltage-gated KCNQ (Kv7) potassium channels: SMIT1 binds
    the KCNQ channel pore module and alters the channel's ion selectivity, gating
    kinetics, voltage dependence and pharmacology, independently of its transport
    activity. This is a transport-independent "moonlighting" function underlying
    channel-transporter signaling complexes at the plasma membrane.
  molecular_function:
    id: GO:0015459
    label: potassium channel regulator activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:28793216
    supporting_text: SMIT1, and likely other related sodium-dependent solute
      transporters, regulates KCNQ channel ion selectivity, gating, and
      pharmacology by direct physical interaction with the pore module
  - reference_id: file:human/SLC5A3/SLC5A3-uniprot.txt
    record_section: ["CC:SUBUNIT"]
    supporting_text: Interacts with KCNQ1; this interaction is direct
suggested_questions:
- question: >-
    Is the broad in-vitro substrate range of SMIT1 (glucose, galactose, fucose,
    pentoses) physiologically relevant in any cell type, or is it an artifact of
    heterologous overexpression?
- question: >-
    What is the physiological significance of the transport-independent KCNQ
    channel regulation by SMIT1 in native excitable and epithelial cells?
suggested_experiments:
- description: >-
    Quantitative transport assays (e.g. radiolabelled uptake or electrophysiology
    in oocytes/mammalian cells) measuring SMIT1 Km/Vmax for myo-inositol versus
    glucose, galactose, fucose and pentoses, to determine whether non-inositol
    substrates are transported at physiologically meaningful rates.
- description: >-
    Cell-type-specific SLC5A3 knockout/knock-in with transport-dead and
    KCNQ-binding-dead separation-of-function mutants, to dissect which phenotypes
    (osmoregulation vs channel modulation) depend on transport versus direct
    channel binding.
knowledge_gaps:
- gap_statement: >-
    The in-vivo substrate selectivity of SMIT1 is undetermined: whether any
    non-myo-inositol substrate (glucose, galactose, fucose, pentoses) observed in
    heterologous assays is transported at physiologically relevant rates in any
    native cell type is unknown.
  boundary: >-
    It is firmly established that SMIT1 is a high-affinity, Na+-coupled
    myo-inositol (and scyllo-inositol) symporter and that this is its
    osmoregulatory function; the broad substrate range is reported only from
    oocyte overexpression.
  gap_kind:
  - BIOLOGY
