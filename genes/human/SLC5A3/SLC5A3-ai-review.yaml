id: P53794
gene_symbol: SLC5A3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC5A3 (SMIT1) is an electrogenic sodium/myo-inositol cotransporter of the
  solute:sodium symporter (SSS, TC 2.A.21) family. It is a multi-pass plasma
  membrane protein that actively imports myo-inositol (and its stereoisomer
  scyllo-inositol) into cells by coupling solute uptake to the inward
  electrochemical sodium gradient, with a Na(+):inositol coupling ratio of 2:1.
  By accumulating myo-inositol, one of the most abundant small organic osmolytes
  in mammalian cells, SLC5A3 is central to osmotic adaptation and cell-volume
  regulation; its transcription is induced by hyperosmotic stress via the
  tonicity-responsive factor TonEBP/NFAT5, notably in the renal medulla, brain
  and fetoplacental unit. The imported myo-inositol also serves as the precursor
  pool for phosphoinositide signaling lipids such as PI(4,5)P2. In polarized
  epithelia such as the choroid plexus, SLC5A3 resides on both apical and
  basolateral membranes and helps establish the myo-inositol gradient between
  blood and cerebrospinal fluid. Independently of its transport activity, SLC5A3
  physically associates with voltage-gated KCNQ (Kv7) potassium channels and
  their KCNE subunits, binding the channel pore module and altering channel ion
  selectivity, gating and pharmacology.
