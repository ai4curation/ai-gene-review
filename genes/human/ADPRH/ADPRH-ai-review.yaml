- term:
    id: GO:0030955
    label: potassium ion binding
  evidence_type: IDA
  original_reference_id: PMID:19407395
  qualifier: enables
  review:
    summary: >-
      Over-annotation of a crystallisation additive. The potassium ion is genuinely resolved, and
      the term asserts nothing more than that - but it entered from the cocktail, does not recur in
      the two higher-resolution structures, and UniProt read the same paper and declined to record
      a potassium site.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Reading the term's definition rather than its label is what keeps this at
      MARK_AS_OVER_ANNOTATED rather than REMOVE. GO:0030955 is exactly "Binding to a potassium ion
      (K+)", with no claim of functional requirement, and PDB 3HFW's bound non-polymer components
      are literally K and MG - so a resolved potassium ion does satisfy the term as written, and
      deleting the row would be the mirror of the error this review is guarding against elsewhere.
      What the row does not deserve is to stand unqualified. Three computed facts put it in the
      over-annotation class. First, provenance - the paper's own account is that K+ was discovered
      by X-ray fluorescence as a trace contaminant of poorly diffracting apo crystals and was then
      added deliberately as K-ADP because it improved diffraction, so the ion entered from the
      cocktail rather than from biology. Second, non-recurrence - across all four ADPRH structures,
      magnesium is present in 4 of 4 while potassium is present in 1 of 4, and that one is the
      lowest-resolution member of the set; neither 6G28 at 1.23 A nor 6IUX at 1.20 A contains any
      potassium. Third, and the point that decides it, a curator reading the same paper reached the
      opposite conclusion - UniProt created six Mg2+ BINDING features citing
      ECO:0000269|PubMed:19407395 and created no potassium feature at all, and names only Mg(2+) in
      COFACTOR. So the discrepancy is not this review against a curator; it is two curators reading
      one paper differently, which is exactly what MARK_AS_OVER_ANNOTATED is for. Whether K+ affects
      activity is recorded as an experiment worth doing.
    supported_by:
    - reference_id: PMID:19407395
      supporting_text: A prerequisite for obtaining well diffracting crystals was the performance of
        X-ray fluorescence analysis on poorly diffracting apo hARH1 crystals, which revealed the
        presence of trace amounts of K(+) in the crystal.
    - reference_id: file:human/ADPRH/ADPRH-bioinformatics/RESULTS.md
      supporting_text: Every structure containing potassium is at the worst resolution in the set
        (1.92 A); all 3 better-resolved structures (6G28, 6G2A, 6IUX) contain none.
