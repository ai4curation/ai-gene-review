      same route gives GO:0003875 to the catalytically inactive paralog ADPRHL1.
- id: PMID:8349667
  title: Cloning and site-directed mutagenesis of human ADP-ribosylarginine hydrolase.
  findings:
  - statement: The human ADP-ribosylarginine hydrolase was cloned and expressed in E. coli, and
      site-directed mutants were assayed for hydrolase activity, establishing the human enzyme's
      activity and the residue basis of its dithiothreitol independence.
    supporting_text: Human hydrolase and rat C108S were DTT-independent; human S103C was, however,
      DTT-dependent.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The paper frames the enzyme as the reversing half of an arginine ADP-ribosylation
      cycle, which is the biological process the GO rows record.
    supporting_text: Mono-ADP-ribosylation of arginine is a reversible modification of proteins with
      NAD:arginine ADP-ribosyltransferases and ADP-ribosylarginine hydrolases catalyzing the
      opposing reactions in the cycle.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract-only. The reference-projection test returns 4 annotations over 2 entities
      (human P54922 and mouse P54923) and 2 terms, i.e. a normal two-species curation of one paper,
      not a bulk projection.
- id: PMID:19407395
  title: Cloning, expression, purification and crystallization as well as X-ray fluorescence and
    preliminary X-ray diffraction analyses of human ADP-ribosylhydrolase 1.
  findings:
  - statement: A potassium ion is present in the hARH1 crystal used for the 1.9 A structure (PDB
      3HFW), identified by X-ray fluorescence and then supplied deliberately as K-ADP.
    supporting_text: hARH1 has been cloned, expressed heterologously in Escherichia coli, purified
      and crystallized in complex with K(+) and ADP.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The potassium originated from the crystallisation conditions and was pursued because
      it improved diffraction, not because a functional requirement was measured.
    supporting_text: A prerequisite for obtaining well diffracting crystals was the performance of
      X-ray fluorescence analysis on poorly diffracting apo hARH1 crystals, which revealed the
      presence of trace amounts of K(+) in the crystal.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract-only, but the structural claim is independently checkable: RCSB reports PDB
      3HFW nonpolymer_bound_components as K and MG, and UniProt cites this paper as
      ECO:0000269|PubMed:19407395 for six Mg2+ BINDING features. The reference-projection test
      returns 2 annotations on 1 entity.
- id: PMID:30472116
  title: '(ADP-ribosyl)hydrolases: Structural Basis for Differential Substrate Recognition and
    Inhibition.'
  findings:
  - statement: ARH1 is specific for the arginine (N-glycosidic) linkage, whereas the paralog ARH3
      handles serine-linked ADP-ribose and poly(ADP-ribose); this is the measurement that fixes the
      granularity of GO:0003875 for ADPRH.
    supporting_text: Whereas ARH1 is specific for the N-glycolytic linkage of mono(ADP-ribosylated)
      arginines, ARH3 specifically cleaves the O-glycolytic linkage of mono(ADP-ribosylated) serine
      and, at least in vitro, other linkages as well, such as those in poly(ADP-ribose) chains.
    reference_section_type: ABSTRACT
  - statement: The division of labour across the eraser families assigns arginine de-modification to
      ARH1 alone, with PARG/ARH3 on PAR, macrodomains on acidic residues and ARH3 on serine.
    supporting_text: Arginine de-modification is catalyzed by ARH1, PARylation is removed by PARG and
      to a lesser extend ARH3, MARylation on glutamate/aspartate residues is hydrolyzed by macrodomain
      proteins, whereas the terminal modification on serine residues is removed by ARH3.
    reference_section_type: RESULTS
  - statement: The poly(ADP-ribose), 1''-O-acetyl-ADP-ribose and DNA-end activities are attributed by
      these authors to ARH3, not to ARH1 - relevant because a paper titled for ARH3 (PMID:21498885)
      reports the same activities for ARH1 in passing.
    supporting_text: In addition, ARH3 can cleave PAR chains, 1″-O-acetyl-ADPr and ADPr at the
      phosphorylated DNA ends
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. This is the reference behind ADPRH's EC number, its CATALYTIC ACTIVITY line,
      its COFACTOR line and all five "Complete loss of activity" MUTAGEN features. The
      reference-projection test returns 7 annotations over 2 entities - P54922 receives the arginine
      terms and H3BCW1 (coelacanth ADPRS) receives GO:0004649, GO:0140290 and GO:0140292 - the same
      paper discriminating the two specificities correctly in one pass.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings:
  - statement: The ADPRH-TFCP2 pair comes from this systematic binary yeast two-hybrid map, with no
      orthogonal assay reported for the pair.
    supporting_text: Here, we describe a systematic map of ?14,000 high-quality human binary
      protein-protein interactions.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited high-throughput screen; the citation is sound and the interaction is real as a
      screen output. IntAct expansion shows the pair is logged under three sub-methods (two hybrid
      array, two hybrid prey pooling approach, validated two hybrid) of the one screen, which is what
      UniProt's NbExp=3 counts.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: The ADPRH-SPSB1 pair comes from HuRI, a systematic yeast two-hybrid reference map,
      with no orthogonal assay reported for the pair.
    supporting_text: Specifically, yeast two-hybrid (Y2H) represents the only binary PPI assay that
      can be operated at sufficient throughput to systematically screen the human proteome for
      binary PPIs.
    reference_section_type: INTRODUCTION
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      As for PMID:25416956 - correctly cited, but a single screen logged as three IntAct sub-methods,
      MI-score 0.56, and SPSB1 has 78 distinct IntAct partners against ADPRH's 17.
- id: PMID:9037477
  title: Immunohistochemical localization of ADP-ribosylarginine hydrolase in rodent CNS.
  findings:
  - statement: The sole experimental basis anywhere for an extracellular location of any ADPRH
      ortholog is one western blot of rat cerebrospinal fluid; the rest of the paper localises the
      enzyme inside neurons.
    supporting_text: On Western blot analysis of rat cerebrospinal fluid (CSF), the anti-AAH
      antibodies recognized a protein with a molecular mass of 38 kDa.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The authors present the extracellular observation as a first report rather than an
      established localisation.
    supporting_text: the presence of extracellular AAH in rat CSF.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Not cited by any human ADPRH GOA row directly; it is the upstream source of the rat IDA that
      Ensembl Compara projects onto human as GO:0005576. Identified by querying the donor's own
      evidence. Cached abstract-only, so the rat IDA itself is not second-guessed here - only its
      transfer to human.
- id: PMID:1375222
  title: Molecular and immunological characterization of ADP-ribosylarginine hydrolases.
  findings:
  - statement: The rat enzyme's hydrolase activity is Mg2+- and dithiothreitol-dependent and was
      demonstrated on purified and recombinant protein; this is the experimental annotation that the
      PAINT node's rat seed carries.
    supporting_text: A hydrolase fusion protein, synthesized in Escherichia coli, reacted with
      anti-39-kDa polyclonal antibodies and exhibited Mg(2+)- and dithiothreitol-dependent hydrolase
      activity.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Not cited by a human row. Retrieved while querying what the IBA donors carry for GO:0003875 -
      rat Adprh (Q02589, RGD:2052) holds IDA and IMP from this paper, so the phylogenetic node is
      seeded by real experimental evidence in two species rather than by the human annotation alone.
- id: PMID:31599159
  title: The ARH and Macrodomain Families of α-ADP-ribose-acceptor Hydrolases Catalyze α-NAD(+)
    Hydrolysis.
  findings:
  - statement: ARH1 hydrolyses the alpha anomer of NAD+ but not beta-NAD+, an activity shared with
      ARH3 and the macrodomain hydrolases; the stereospecificity is the substance of the result.
    supporting_text: Here, we report that ARH1, ARH3, and macrodomain proteins (i.e., MacroD1,
      MacroD2, C6orf130 (TARG1), Af1521, hydrolyzed α-NAD+ but not β-NAD+.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. UniProt encodes this as a second CATALYTIC ACTIVITY on P54922
      (Rhea:RHEA:68792, ChEBI:CHEBI:77017 alpha-NAD+, ECO:0000269|PubMed:31599159), and it is also
      the source of the Asp-55/Asp-56 mutagenesis. No GO annotation exists for it because no suitable
      GO term exists; see proposed_new_terms.
- id: PMID:17526733
  title: Enhanced sensitivity to cholera toxin in ADP-ribosylarginine hydrolase-deficient mice.
  findings:
  - statement: Adprh-null mouse cells and intestinal loops accumulate more ADP-ribosylated Gs-alpha
      and more ADP-ribosylarginine after cholera-toxin challenge, and the defect is rescued by
      re-expressing wild-type ADPRH - identifying Gs-alpha as an in vivo substrate.
    supporting_text: Effects of intoxication on murine ADPRH-/- cells were greater than those on
      wild-type cells and were significantly reduced by overexpression of wild-type ADPRH in
      ADPRH-/- cells, as evidenced by both ADP-ribose-arginine content and Gsalpha modification.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract-only. Mouse knockout, so it is used here for biological context and for
      suggested experiments, not to propose a human GO annotation. Crossref could not resolve the DOI
      (HTTP 404), so the correction check for this reference rests on the PubMed
      CommentsCorrections/RefType sweep alone, which was clean.
- id: PMID:30429362
  title: Role of a TRIM72 ADP-ribosylation cycle in myocardial injury and membrane repair.
  findings:
  - statement: TRIM72/MG53 is an ART1/ARH1 substrate pair, and ADP-ribosylated TRIM72 accumulates in
      Arh1-deficient mouse heart after ischaemia/reperfusion.
    supporting_text: The membrane repair protein TRIM72 was identified as a substrate for ART1 and
      ARH1; ADP-ribosylated TRIM72 levels were greater in ARH1-deficient mice following
      ischemia/reperfusion injury.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Mouse work; used for substrate identity and for suggested experiments rather
      than for a human annotation. Crossref could not resolve the DOI (HTTP 404), so as for
      PMID:17526733 the correction check rests on the PubMed sweep alone.
- id: PMID:21697277
  title: ADP-ribosylarginine hydrolase regulates cell proliferation and tumorigenesis.
  findings:
  - statement: Arh1 heterozygous and null mice develop spontaneous lymphomas, adenocarcinomas and
      metastases, with loss of the remaining wild-type allele in tumours from heterozygotes.
    supporting_text: More significantly, ARH1(-/-) and ARH1(+/-) mice spontaneously developed
      lymphomas, adenocarcinomas, and metastases more frequently than wild-type ARH1(+/+) mice.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached. A mouse phenotype, so no human GO annotation is proposed from it; it is used
      to motivate the biological significance of the erasing activity and one suggested experiment.
- id: PMID:21498885
  title: Hydrolysis of O-acetyl-ADP-ribose isomers by ADP-ribosylhydrolase 3.
  findings:
  - statement: This ARH3-titled paper states in passing that ARH1 also hydrolyses O-acetyl-ADP-ribose
      and poly(ADP-ribose), which if measured for the human enzyme would widen its substrate scope
      beyond arginine.
    supporting_text: ARH1 also hydrolyzed OAADPr and poly(ADPr) as well as ADP-ribose-arginine, with
      arginine in α-anomeric linkage to C-1″ of ADP-ribose.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Cached abstract-only and titled for the paralog. The ARH1 statement is a one-sentence
      restatement of earlier work, not this paper's measurement, and it sits alongside PMID:30472116's
      head-to-head comparison assigning PAR and 1''-O-acetyl-ADP-ribose activity to ARH3. Recorded as
      a knowledge gap; deliberately NOT used to propose GO:0004649 or GO:0061463 for ADPRH.
- id: PMID:36497109
  title: ARH Family of ADP-Ribose-Acceptor Hydrolases.
  findings:
  - statement: Family review summarising ARH1's substrate range as alpha-ADP-ribose-arginine plus
      alpha-NAD+ and O-acetyl-ADP-ribose.
    supporting_text: ARH1 hydrolyzed α-ADP-ribose-arginine, in addition to α-NAD+ and
      O-acetyl-ADP-ribose.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Review article from the group that characterised the enzyme; used for orientation, not as
      primary evidence for any action.
- id: PMID:16278211
  title: Identification and characterization of a mammalian 39-kDa poly(ADP-ribose) glycohydrolase.
  findings:
  - statement: ARH3 was identified as an ARH1-like protein with PARG activity that does NOT hydrolyse
      ADP-ribose-arginine - the reciprocal specificity boundary to ADPRH.
    supporting_text: We report here the identification of an ARH1-like protein, termed
      poly(ADP-ribose) hydrolase or ARH3, which exhibited PARG activity, generating ADP-ribose from
      poly-(ADP-ribose), but did not hydrolyze ADP-ribose-arginine, -cysteine, -diphthamide, or
      -asparagine bonds.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Verified as used here - the paper is sound and is cited only as the reciprocal specificity
      control, which is what its abstract establishes. The miscitation is the affinage provider's,
      not this review's, and is recorded here rather than in `correctness` so that a downstream
      reader does not conclude this review miscites it. Affinage attributes "Critical
      vicinal acidic amino acids required for catalytic activity were identified by mutagenesis" to
      ARH1, whereas the abstract attributes the Asp-77/Asp-78 mutagenesis to ARH3, saying that those
      residues "are located in a region similar to that required for activity in ARH1". A paralog
      attribution error in the provider narrative, not in GOA.
- id: PMID:12464675
  title: Restoration of LDL receptor function in cells from patients with autosomal recessive
    hypercholesterolemia by retroviral expression of ARH1.
  findings: []
  reference_review:
    relevance: NONE
    correctness: WRONG_IDENTIFIER
    review_notes: >-
      A gene-symbol collision, not a finding about this gene. The "ARH1" of this paper is the
      autosomal recessive hypercholesterolaemia adaptor protein LDLRAP1, which the paper maps to
      chromosome 1p36; ADPRH is at 3q22.1 and has no role in LDL receptor internalisation. The
      affinage record lists it as an ADPRH finding, "establishing ARH1 as a functional adaptor
      required for LDL receptor-dependent LDL internalization". Recorded so that the wrong
      attribution is not inherited; nothing in this review rests on it.
- id: PMID:19895577
  title: Side chain specificity of ADP-ribosylation by a sirtuin.
  findings:
  - statement: ARH1 was used as the specificity reagent showing that arginine is the major ADP-ribose
      acceptor on unacetylated substrates - an in vitro demonstration of ADPRH acting on a protein
      substrate (histone H1.1) that is absent from GOA.
    supporting_text: Biochemical and MS data showed that arginine is the major ADP-ribose acceptor
      for unacetylated substrates, whereas arginine does not appear to be the major ADP-ribose
      acceptor in reactions with acetylated histone H1.1.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Found by querying IntAct rather than by any ADPRH-keyed literature search; IntAct records the
      pair as an "enzymatic study" of type "cleavage" (EBI-7579979). Titled for trypanosome sirtuin
      ADP-ribosylation. Corroborative only - the arginine specificity it supports is already
      established by PMID:30472116.
- id: file:human/ADPRH/ADPRH-deep-research-affinage.md
  title: Affinage mechanistic annotation for ADPRH (human)
  findings:
  - statement: The provider's one-line summary of the enzyme's reaction and direction, which agrees
      with UniProt and with PMID:30472116 and is used only as a corroborated restatement.
    supporting_text: ADPRH (ARH1) is a cytosolic, ubiquitously expressed enzyme that reverses
      arginine-specific mono-ADP-ribosylation
  - statement: The provider asserts a cytosolic localisation for which no experimental evidence was
      found in UniProt or GOA; recorded as an unsupported provider claim, not as a basis for an
      annotation.
    supporting_text: ARH1 is a cytosolic protein ubiquitously expressed in mammalian tissues.
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      The record's trust gate failed - the frontmatter reads gates_passed: False, with the
      explanation that Affinage's own head-to-head self-evaluation scored the record pairwise = tie
      rather than a win. Re-checking every claim against the cited PMIDs found two genuine defects,
      both name/paralog collisions - PMID:12464675 is about the LDL receptor adaptor LDLRAP1 rather
      than ADP-ribosylhydrolase 1, and the "critical vicinal acidic amino acids" mutagenesis
      attributed to ARH1 is ARH3's Asp-77/Asp-78 in PMID:16278211. One further citation,
      PMID:36945646, is a bioRxiv preprint. Recall was also poor - the record returned none of
      PMID:9037477, PMID:1375222, PMID:25416956, PMID:32296183 or PMID:19895577, which between them
      decide four rows of this review. Nothing mechanistic in this review rests on a provider
      sentence.
- id: file:human/ADPRH/ADPRH-bioinformatics/RESULTS.md
  title: ADPRH catalytic-residue census across PANTHER PTHR16222
  findings:
  - statement: Across the 31 reviewed Swiss-Prot members of PTHR16222 (0.104% of the family's 29,860
      proteins), all five ADPRH-clade members retain every one of the five mutagenesis-validated
      catalytic residues and all five hold GO:0003875, whereas all seven ADPRHL1 orthologues have
      lost Asp56 and Ser305 and yet all seven hold GO:0003875 by IEA.
    supporting_text: '| ADPRHL1 (ARH2) | 7 | 42.6-47.7 | 1-2 of 5 | 7/7 |'
  - statement: The residue argument is bounded by a positive control - Rhodospirillum rubrum DraG
      holds GO:0003875 by its own EXP evidence at only 27.5% identity and 3 of 5 residues, but both
      of its substitutions are hydroxyl-preserving Ser-to-Thr, i.e. zero disruptive changes.
    supporting_text: 'S305->T(conservative) | IEA(GO_REF:0000116), EXP(PMID:19706507) |'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Generated by the committed script catalytic_residue_census.py in the same folder; a fresh run
      reproduces both RESULTS.md and results.json byte-identically, and --self-test reports zero
      problems. The self-test was break-tested by reverting the anchored Swiss-Prot check to the
      buggy substring form, which makes it fail with the expected message.
existing_annotations:
- term:
    id: GO:0003875
    label: ADP-ribosylarginine-[protein] hydrolase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1098234
  - PANTHER:PTN009030515
  - RGD:2052
  - UniProtKB:P54922
  review:
    summary: >-
      Accepted as the gene's core molecular function. This is a self-referential IBA whose WITH/FROM
      also names two orthologs that carry their own experimental evidence.
    action: ACCEPT
    reason: >-
      Every WITH/FROM token was resolved and its own evidence queried. MGI:MGI:1098234 returns three
      mouse entries for Adprh - the Swiss-Prot P54923 plus two TrEMBL clones, so the lookup is
      ambiguous and is reported as such; P54923 is the reviewed one and holds GO:0003875 by IMP from
      PMID:8349667. RGD:2052 resolves unambiguously to the reviewed rat entry Q02589, which holds
      GO:0003875 by both IDA and IMP from PMID:1375222. UniProtKB:P54922 is the gene itself, which
      per campaign convention makes this a PAINT curator judging the function core rather than a
      circular inference. PANTHER:PTN009030515 is a tree node, not a protein; its reach was queried
      directly and is 20 gene products, all named adprh/Adprh/ADPRH, containing neither the inactive
      paralog ADPRHL1 nor the serine-specific ADPRS. The term's definition names exactly the reaction
      UniProt records for this protein with EC 3.2.2.19 and Rhea:RHEA:14885, so the granularity is
      right as well as the identity.
    supported_by:
    - reference_id: PMID:30472116
      supporting_text: Whereas ARH1 is specific for the N-glycolytic linkage of mono(ADP-ribosylated)
        arginines, ARH3 specifically cleaves the O-glycolytic linkage of mono(ADP-ribosylated) serine
        and, at least in vitro, other linkages as well, such as those in poly(ADP-ribose) chains.
    - reference_id: PMID:1375222
      supporting_text: A hydrolase fusion protein, synthesized in Escherichia coli, reacted with
        anti-39-kDa polyclonal antibodies and exhibited Mg(2+)- and dithiothreitol-dependent
        hydrolase activity.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: MGI:MGI:1098234
        source_status: SUPPORTS_TRANSFER
        comment: >-
