knowledge_gaps:
- gap_statement: >-
    Whether human ARH1 hydrolyses O-acetyl-ADP-ribose and poly(ADP-ribose) in addition to
    ADP-ribosyl-arginine is unresolved in the literature this review can read, and the two sources
    disagree in emphasis.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  boundary: >-
    Established - the arginine activity, by structure, kinetics and mutagenesis. Unestablished -
    whether the O-acetyl-ADP-ribose and poly(ADP-ribose) activities reported for ARH1 in a paper
    titled for ARH3 hold for the human enzyme at physiologically meaningful rates.
  significance: >-
    If they do, ADPRH would additionally warrant GO:0061463 and GO:0004649, both of which currently
    sit only on ADPRS in the human GOA. Proposing them now on the strength of a single restated
    sentence would be exactly the paralog leak this review was asked to guard against, so they are
    deliberately not proposed.
  provenance:
  - reference_id: PMID:21498885
    supporting_text: ARH1 also hydrolyzed OAADPr and poly(ADPr) as well as ADP-ribose-arginine, with
      arginine in α-anomeric linkage to C-1″ of ADP-ribose.
    full_text_unavailable: true
  - reference_id: PMID:30472116
    supporting_text: In addition, ARH3 can cleave PAR chains, 1″-O-acetyl-ADPr and ADPr at the
