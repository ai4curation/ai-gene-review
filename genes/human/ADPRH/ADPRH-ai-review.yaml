- term:
    id: GO:0036211
    label: protein modification process
  evidence_type: IMP
  original_reference_id: PMID:8349667
  qualifier: involved_in
  review:
    summary: >-
      Redundant, not misdirected. GO:0036211 is a strict ancestor of the protein de-ADP-ribosylation
      term this gene already holds, so the fix is to replace it with the specific child.
    action: MODIFY
    reason: >-
      This row looks at first like the classic direction inversion - a term naming the forward
      modification applied to an enzyme that removes it - and the check was run rather than assumed.
      It is not an inversion. QuickGO's ancestors endpoint with relations=is_a,part_of returns
      GO:0036211 in the ancestor set of GO:0051725, via GO:0043412 macromolecule modification, so GO
      deliberately classifies de-modification under protein modification process and the term is
      simply the most general possible statement of what the 1993 experiments showed. Since the gene
      already holds GO:0051725 by IDA, IBA and IEA, the row adds nothing at this level. Replacing it
      with GO:0051725 preserves the 1993 reference's contribution to the process annotation at the
      granularity the same paper's activity row already supports.
    proposed_replacement_terms:
    - id: GO:0051725
      label: protein de-ADP-ribosylation
    supported_by:
    - reference_id: PMID:8349667
      supporting_text: Mono-ADP-ribosylation of arginine is a reversible modification of proteins with
        NAD:arginine ADP-ribosyltransferases and ADP-ribosylarginine hydrolases catalyzing the
        opposing reactions in the cycle.
core_functions:
- description: >-
    Erases arginine mono-ADP-ribosylation by hydrolysing the N-glycosidic bond between ADP-ribose and
    the guanidino nitrogen of a modified arginine residue, releasing free ADP-D-ribose and
    regenerating unmodified arginyl-protein. This is the reversing arm of the ARTC1 arginine
    ADP-ribosylation cycle, and the activity by which the enzyme counteracts cholera-toxin
    modification of Gs-alpha. Both listed substrates are identified from mouse knockout work
    (Gs-alpha in PMID:17526733, TRIM72 in PMID:30429362) and are given here as the human
    orthologs of those substrates; neither has been demonstrated on the human enzyme directly.
  molecular_function:
    id: GO:0003875
    label: ADP-ribosylarginine-[protein] hydrolase activity
  directly_involved_in:
  - id: GO:0051725
    label: protein de-ADP-ribosylation
  substrates:
  - id: UniProtKB:P63092
    label: GNAS (Gs-alpha), ADP-ribosylated on arginine by cholera toxin
  - id: UniProtKB:Q6ZMU5
    label: TRIM72 (MG53), ADP-ribosylated on arginine by ARTC1
  supported_by:
  - reference_id: PMID:30472116
    supporting_text: Whereas ARH1 is specific for the N-glycolytic linkage of mono(ADP-ribosylated)
      arginines, ARH3 specifically cleaves the O-glycolytic linkage of mono(ADP-ribosylated) serine
      and, at least in vitro, other linkages as well, such as those in poly(ADP-ribose) chains.
  - reference_id: PMID:17526733
    supporting_text: Effects of intoxication on murine ADPRH-/- cells were greater than those on
      wild-type cells and were significantly reduced by overexpression of wild-type ADPRH in
      ADPRH-/- cells, as evidenced by both ADP-ribose-arginine content and Gsalpha modification.
  - reference_id: PMID:30429362
    supporting_text: The membrane repair protein TRIM72 was identified as a substrate for ART1 and
      ARH1; ADP-ribosylated TRIM72 levels were greater in ARH1-deficient mice following
      ischemia/reperfusion injury.
  - reference_id: file:human/ADPRH/ADPRH-deep-research-affinage.md
    supporting_text: ADPRH (ARH1) is a cytosolic, ubiquitously expressed enzyme that reverses
      arginine-specific mono-ADP-ribosylation
- description: >-
    Binds two catalytic magnesium ions per subunit. These are not incidental cofactor contacts - the
    six coordinating positions include all five residues whose individual substitution abolishes
    activity, so magnesium binding is inseparable from the hydrolase function rather than a separate
    property of the protein.
  molecular_function:
    id: GO:0000287
    label: magnesium ion binding
  supported_by:
  - reference_id: PMID:30472116
    supporting_text: The active sites of hARH1 and LchARH3 are structurally very similar and contain
      residues for the coordination of two Mg2+ ions.
  - reference_id: file:human/ADPRH/ADPRH-bioinformatics/RESULTS.md
    supporting_text: Magnesium is present in **4 of 4** structures (3HFW, 6G28, 6G2A, 6IUX).
proposed_new_terms:
- proposed_name: alpha-NAD(+) hydrolase activity
  proposed_definition: >-
    Catalysis of the reaction alpha-NAD(+) + H2O = ADP-D-ribose + nicotinamide + H(+). This is the
    alpha-anomer-specific reaction; enzymes with this activity do not act on the physiological beta
    anomer.
  proposed_parent:
    id: GO:0016799
    label: hydrolase activity, hydrolyzing N-glycosyl compounds
  justification: >-
    UniProt records a second experimentally evidenced catalytic activity for P54922 -
    "alpha-NAD(+) + H2O = ADP-D-ribose + nicotinamide + H(+)", Rhea:RHEA:68792, substrate
    ChEBI:CHEBI:77017, ECO:0000269|PubMed:31599159 - for which no GO term exists and which
    consequently has no GO annotation on any of the six proteins shown to catalyse it. The obvious
    candidate is wrong for a reason that is invisible from its label - GO:0003953 "NAD+ nucleosidase
    activity" is defined as "Catalysis of the reaction: NAD+ + H2O = ADP-D-ribose + nicotinamide +
    H+" with the single xref EC 3.2.2.5, i.e. the beta-anomer reaction, and the finding being
    annotated is precisely that these enzymes hydrolyse alpha-NAD+ but NOT beta-NAD+. GO:0061809 is
    the cyclic-ADP-ribose-generating variant and GO:0050135 is the NADP+ term, so neither fits
    either. The term would apply immediately to ADPRH (ARH1), ADPRS (ARH3), MACROD1, MACROD2, OARD1
    (TARG1) and archaeal Af1521.
  proposed_mappings:
  - predicate: skos:exactMatch
