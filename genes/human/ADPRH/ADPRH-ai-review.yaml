- gap_statement: >-
    The subcellular localisation of human ADPRH has never been determined experimentally. UniProt
    assigns no SUBCELLULAR LOCATION at all, and the only location annotation in GOA is an Ensembl
    Compara projection of a rat cerebrospinal-fluid western blot.
  gap_kind:
  - BIOLOGY
  - CURATION
  status: OPEN
  boundary: >-
    Known - the protein is detected at protein level (PE 1) with peptides in PeptideAtlas and jPOST,
    has no signal peptide or transmembrane segment, and acts on substrates that are intracellular.
    Unknown - whether it is cytosolic, whether any pool is genuinely extracellular, and what the
    38-kDa CSF species is.
  significance: >-
    A cytosol annotation is the expectation everyone works from and none exists; conversely the one
    location annotation that does exist points outside the cell on evidence from a different species.
    A single imaging or fractionation experiment on the human protein would resolve both.
  provenance:
  - reference_id: PMID:9037477
    supporting_text: the presence of extracellular AAH in rat CSF.
    full_text_unavailable: true
  - reference_id: file:human/ADPRH/ADPRH-deep-research-affinage.md
    supporting_text: ARH1 is a cytosolic protein ubiquitously expressed in mammalian tissues.
suggested_questions:
- question: >-
    Should the interpro2go mapping from IPR012108 and the ARBA rule behind GO_REF:0000120 be
    prevented from reaching ADPRHL1? Both routes give the catalytically inactive paralog ADPRHL1 the
    catalytic terms that are correct for ADPRH - GO:0003875 by IEA GO_REF:0000120 and GO:0000287 by
    IEA GO_REF:0000002 - even though Swiss-Prot's own entry for Q8NDY3 is titled "Inactive
    ADP-ribosyltransferase ARH2" and carries the CAUTION that it "lacks the metal-binding and
    substrate-binding residues, suggesting that it has no hydrolase activity". A census over all 31
    reviewed Swiss-Prot members of PTHR16222 shows all 7 ADPRHL1 orthologs holding GO:0003875 while
    all 7 have lost both Asp56 and Ser305, at 42.6-47.7% identity to ADPRH where the alignment is
    reliable. The contrast with PAINT is the point rather than a complaint about IEA in general -
    PAINT put the arginine terms on PTN009030515, which reaches 20 ADPRH orthologs and no ADPRHL1,
    and gave the ADPRHL1 clade nothing. So the family's catalytic loss is already modelled correctly
    by one route while two others miss it.
  experts:
  - InterPro/GO Central (interpro2go curators)
  - UniProt automatic annotation (ARBA)
- question: >-
    Does GO want a term for alpha-NAD(+) hydrolase activity? Six proteins - ARH1, ARH3, MacroD1,
    MacroD2, TARG1 and Af1521 - have a measured activity that no GO term can express, and the term
    that looks right, GO:0003953 NAD+ nucleosidase activity, is defined on the beta anomer via EC
    3.2.2.5, which is exactly the anomer these enzymes do not act on. UniProt already encodes the
    reaction as Rhea:RHEA:68792 on P54922 with ECO:0000269|PubMed:31599159.
  experts:
  - GO Central molecular function curators
- question: >-
    Should the human GO:0005576 extracellular region annotation on ADPRH be withdrawn, and should
    the rat annotation it derives from be reconsidered? Human, mouse and rat all carry this term only
    through Ensembl Compara or ISO transfer from one rat IDA (PMID:9037477), whose evidence is a
    single 38-kDa band on a western blot of cerebrospinal fluid in a paper otherwise devoted to
    intracellular neuronal immunostaining. ADPRH has no signal peptide, no transmembrane segment and
    no SUBCELLULAR LOCATION comment in UniProt.
  experts:
  - RGD
  - Ensembl Compara GO projection maintainers
- question: >-
    Is potassium functionally relevant to ARH1, or is the K+ in PDB 3HFW purely a crystallisation
    artefact? The GO:0030955 IDA is literally satisfied by the structure, but K+ is absent from the
    two later, higher-resolution structures 6G28 and 6IUX, and UniProt records no potassium BINDING
    feature and no potassium in COFACTOR while recording six magnesium sites from the same papers.
  experts:
  - UniProt structural curators
  - Authors of PMID:19407395 and PMID:30472116
suggested_experiments:
- hypothesis: >-
    ADPRHL1 has no ADP-ribosylarginine hydrolase activity, so the GO:0003875 and GO:0000287
    annotations it holds by IEA are false.
  description: >-
    Express recombinant human ADPRHL1 alongside ADPRH as a positive control and assay both against
    ADP-ribosyl-arginine and against ADP-ribosylated Gs-alpha, with and without Mg2+. Pair this with
    inductively coupled plasma mass spectrometry or X-ray fluorescence on purified ADPRHL1 to test
    directly whether it retains any metal at the degenerate site. A clean negative would let UniProt's
    CAUTION be upgraded to a measured statement and would justify an IRD at the ADPRHL1 node in PAINT.
  experiment_type: enzyme assay
- hypothesis: >-
    Human ADPRH is a cytosolic enzyme and is not present in the extracellular space; the 38-kDa
    immunoreactive species reported in rat cerebrospinal fluid is not secreted ADPRH.
  description: >-
    Perform subcellular fractionation and immunofluorescence on human cells expressing endogenously
    tagged ADPRH, and in parallel test conditioned medium for the tagged protein under basal
    conditions and after deliberate cell lysis. The lysis control is the point - it distinguishes
    regulated release from leakage, which is the ambiguity the rat CSF blot cannot resolve.
  experiment_type: cell biology
- hypothesis: >-
    Potassium occupies a real site on ARH1 and modulates its catalytic rate.
  description: >-
    Measure ADP-ribosyl-arginine hydrolysis rates across a K+ titration at fixed ionic strength, with
    Na+ and choline as counter-ion controls, and attempt to reproduce a K+-bound structure from a
    potassium-free crystallisation condition. If activity is K+-independent and the ion does not
    reappear, the GO:0030955 annotation should be re-examined by the assigning curator.
  experiment_type: enzyme assay
- hypothesis: >-
    Human ARH1 does not hydrolyse O-acetyl-ADP-ribose or poly(ADP-ribose) at rates comparable to its
    arginine activity.
  description: >-
    Run side-by-side kinetics for recombinant human ARH1 and ARH3 on ADP-ribosyl-arginine,
    1''-O-acetyl-ADP-ribose and poly(ADP-ribose) under one set of conditions, reporting kcat/KM for
    each pair. A head-to-head comparison is what is missing - the existing claims for ARH1 come from a
    paper whose subject is ARH3, and the comparison that exists (PMID:30472116) assayed the arginine
    and serine linkages rather than the acetyl and polymer substrates.
  experiment_type: enzyme kinetics
