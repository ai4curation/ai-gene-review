      label: alpha-NAD(+) + H2O = ADP-D-ribose + nicotinamide + H(+)
  supported_by:
  - reference_id: PMID:31599159
    supporting_text: Here, we report that ARH1, ARH3, and macrodomain proteins (i.e., MacroD1,
