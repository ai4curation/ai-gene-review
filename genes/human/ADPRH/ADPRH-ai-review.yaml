- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The InterPro entry supplying these rows is IPR012108 "ADP-ribosylarginine hydrolase", a
      family-specific PIRSF-backed signature rather than a bare fold. Its interpro2go mapping was
      fetched directly and contains exactly three terms - GO:0000287, GO:0003875 and GO:0051725 -
      all correct for ADPRH. The three fold-level signatures ADPRH also matches (IPR005502,
      IPR036705, IPR050792) map to nothing, so InterPro2GO's restraint is the internal control
      showing the specific mapping is deliberate.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PANTHER node PTN009030515 was checked against the cached PAINT table and against QuickGO by
      withFrom. Its seeds are UniProtKB:P54922, MGI:MGI:1098234 (mouse Adprh) and RGD:2052 (rat
      Adprh); its reach is 20 gene products, all ADPRH orthologues, and it includes neither ADPRHL1
      nor ADPRS. The sibling node PTN008564042 carries the ARH3 activities separately.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using
    Ensembl Compara
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The Compara transfer itself is mechanically correct - the donor named in WITH/FROM is rat
      Adprh Q02589, a genuine ortholog. The problem is what is being transferred: a single rat
      cerebrospinal-fluid western blot (PMID:9037477) as a location for the human protein.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The WITH/FROM field cites ARBA:ARBA00088955 together with RHEA:14885 and EC:3.2.2.19, both of
