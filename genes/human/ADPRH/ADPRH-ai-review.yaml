      reaction UniProt records for P54922 with Rhea:RHEA:14885 and EC 3.2.2.19, so there is no
      granularity slack to exploit and no more specific child exists. Backwards, none of the
      ARH3-specific terms has leaked onto ADPRH - the reference-projection test on this very PMID
      shows it annotated two entities, giving P54922 the arginine terms and the coelacanth ARH3
      ortholog H3BCW1 GO:0004649, GO:0140290 and GO:0140292, in the same curation pass. The direction
      is also correct - this is a hydrolase term, and the GOA contains no term asserting that ADPRH
      performs ADP-ribosylation.
    supported_by:
    - reference_id: PMID:30472116
      supporting_text: Whereas ARH1 is specific for the N-glycolytic linkage of mono(ADP-ribosylated)
        arginines, ARH3 specifically cleaves the O-glycolytic linkage of mono(ADP-ribosylated) serine
