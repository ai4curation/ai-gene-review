- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:30472116
  qualifier: enables
  review:
    summary: >-
      Accepted. Two Mg2+ ions are resolved in the 1.23 A structure and every residue coordinating
      them is a mutagenesis-validated catalytic residue.
    action: ACCEPT
    reason: >-
      This is the strongest of the three magnesium rows. UniProt derives from this paper a COFACTOR
      line naming Mg(2+) with the note "Binds 2 magnesium ions per subunit", six BINDING features
      (residues 54, 55, 56 for site 1; 302, 304, 305 for site 2), and five MUTAGEN entries - S54A,
      D55N, D56N, D302N and S305A - each annotated "Complete loss of activity". PDB 6G28 (1.23 A) and
      6G2A both contain bound MG. Magnesium binding here is not incidental cofactor presence but the
      catalytic requirement itself, which is why it is carried into core_functions alongside the
      hydrolase activity rather than being kept as a non-core property.
    supported_by:
    - reference_id: PMID:30472116
      supporting_text: The active sites of hARH1 and LchARH3 are structurally very similar and
        contain residues for the coordination of two Mg2+ ions.
    - reference_id: file:human/ADPRH/ADPRH-bioinformatics/RESULTS.md
