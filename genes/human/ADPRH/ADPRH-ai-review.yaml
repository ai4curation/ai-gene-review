id: P54922
gene_symbol: ADPRH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
aliases:
- ARH1
- ADP-ribosylarginine hydrolase
description: >-
  ADPRH (ARH1) is a monomeric, magnesium-dependent 39-kDa hydrolase that erases arginine
  mono-ADP-ribosylation. It cleaves the N-glycosidic bond of N(omega)-(ADP-D-ribosyl)-L-arginyl
  residues in proteins, releasing free ADP-D-ribose and regenerating unmodified arginine
  (EC 3.2.2.19). It is therefore the reversing half of the arginine ADP-ribosylation cycle whose
  forward reaction is catalysed by the cholera-toxin-like transferase ARTC1 and, in disease, by
  cholera toxin itself. Catalysis requires two active-site Mg2+ ions coordinated by a vicinal
  acidic pair and flanking serines; substituting any of Ser54, Asp55, Asp56, Asp302 or Ser305
  abolishes activity. Documented arginine-ADP-ribosylated substrates include the heterotrimeric
  G protein alpha subunit Gs-alpha, whose cholera-toxin-driven modification ADPRH reverses, and
  the muscle membrane-repair protein TRIM72/MG53. The enzyme also hydrolyses the alpha anomer of
  NAD+, but not beta-NAD+, linking it to the turnover of a minor NAD+ stereoisomer. Its
  specificity is narrow within its own family: the paralog ARH3/ADPRS acts on serine-linked
  ADP-ribose and on poly(ADP-ribose), and ADPRHL1/ARH2 has lost the metal-binding residues and
  is catalytically inactive. In mice, loss of Adprh causes cardiomyopathy, impaired myocyte
  membrane repair, greater susceptibility to cholera toxin, and spontaneous tumours.
