gene: FBXL4
rows:
- source_index: 0
  source_annotation:
    term:
      id: GO:0000151
      label: ubiquitin ligase complex
    evidence_type: TAS
    original_reference_id: PMID:10531035
    qualifier: part_of
  review:
    summary: FBXL4 belongs to the SCF ubiquitin ligase complex.
    action: TOO_GENERAL
    reason: The 1999 paper identifies Fbl4 among F-box family members by database searching; its representative
      interaction assays should not be confused with assays of the similarly named Fbx4. The family-level ubiquitin-ligase-complex
      inference is positive. Independent target co-immunoprecipitation, F-box perturbation and ubiquitination
      experiments in PMID36896912 and PMID37161784 establish the more informative SCF complex, already retained
      at GO:0019005. Official ontology ancestry confirms GO:0019005 is a descendant of GO:0000151. The generic
      complex term adds no separate complex role; this does not reject its TAS support.
    supported_by:
    - reference_id: PMID:10531035
      supporting_text: In fact, F-box proteins are one of the four subunits of ubiquitin protein ligases called
        SCFs.
    - reference_id: PMID:36896912
      supporting_text: We determined that FBXL4 functions as an integral outer-membrane protein that forms
        an SCF-FBXL4 ubiquitin E3 ligase complex.
- source_index: 2
  source_annotation:
    term:
      id: GO:0000422
      label: autophagy of mitochondrion
    evidence_type: IMP
    original_reference_id: PMID:32525278
    qualifier: acts_upstream_of_or_within
  review:
    summary: FBXL4 limits excessive mitochondrial removal by autophagy.
    action: MODIFY
    reason: The actual patient-cell and mouse study measures increased lysosome-dependent mitochondrial turnover
      after FBXL4 deficiency, rather than showing that FBXL4 executes mitochondrial degradation. Its earlier
      LC3-related interpretation is bounded to those assays. Subsequent target studies resolve SCF-mediated
      turnover of BNIP3/NIX as a mechanism restraining mitophagy. Negative regulation of mitophagy (GO:1901525)
      states this inhibitory role more precisely while preserving the original acts_upstream_of_or_within source
      qualifier.
    proposed_replacement_terms:
    - id: GO:1901525
      label: negative regulation of mitophagy
    supported_by:
    - reference_id: PMID:32525278
      supporting_text: the results we present here show that FBXL4 prevents mitochondrial removal via autophagy
        and that loss of FBXL4 leads to decreased mitochondrial content and mitochondrial disease
    - reference_id: PMID:36896912
      supporting_text: we found that knockout (KO) of FBXL4, a mitochondrial disease gene, hyperactivates mitophagy
        at basal conditions.
- source_index: 3
  source_annotation:
