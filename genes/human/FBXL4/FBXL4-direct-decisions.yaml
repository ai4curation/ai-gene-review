  review:
    summary: Human FBXL4 and the source DNM2 isoform form a positive yeast two-hybrid pair.
    action: MODIFY
    reason: Human FBXL4–DNM2 binding is supported by the original Table S2 (NN1.0 row3485; NN1.0ext row7569)
      and exact positive IntAct records EBI-25845005, EBI-26001463 and EBI-26155610 joining Q9UKA2 to P50570-2.
      These report array, pooling and validated yeast two-hybrid evidence with pairwise retesting. GO:0051020
      means binding to a GTPase; dynamin-2 is a GTPase (EC3.6.5.5). The definition does not require effector
      activity, GTP-bound-state specificity or regulation. Those activities, physiological membrane remodeling
      and target-specific mammalian validation are not established here. The gene-level workbook and curator-resolved
      P50570-2 identity remain distinct. Clone IOH28879 and empty feature fields leave insert boundaries unresolved.
      The inherited abstract quotation identifies the study, while the exact workbook and IntAct pairs support
      this binding refinement.
