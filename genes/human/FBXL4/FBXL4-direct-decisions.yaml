  review:
    summary: Human FBXL4 and TPP1 form a positive yeast two-hybrid pair.
    action: MODIFY
    reason: Human FBXL4–TPP1 binding is supported by the original Table S2 (NN1.0 row3486; NN1.0ext row7570)
      and exact positive IntAct records EBI-25838630, EBI-25995383 and EBI-26149530 joining Q9UKA2 to O14773.
      These report array, pooling and validated yeast two-hybrid evidence; the study used reporter non-autoactivation
      checks and pairwise retesting. GO:0002020 means binding to a protease or peptidase, and O14773 is tripeptidyl-peptidase
      1. The refinement describes this measured pair, not protease regulation, SCF substrate recruitment or
      an established physiological interaction. No target-specific DULIP validation was recovered. Clone CCSB_992
      and empty IntAct feature fields do not resolve insert boundaries or mature-versus-precursor state. The
      inherited abstract quotation identifies the study but does not itself support this pair; the original
      workbook and curated interaction records supply that support.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: Here, we report on an interactome map that focuses on neurodegenerative disease (ND)
    proposed_replacement_terms:
    - id: GO:0002020
      label: protease binding
