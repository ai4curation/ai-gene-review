      label: mitochondrion
    evidence_type: HTP
    original_reference_id: PMID:34800366
    qualifier: located_in
  review:
    summary: FBXL4 is directly identified in the high-confidence human mitochondrial proteome.
    action: ACCEPT
    reason: 'The original MitoCoP workbooks identify the sole Q9UKA2/FBXL4 protein group: Table S1B row340,
      subtractive Table S2B row6990 class1, spatial S2E row7954 cluster1, and TOMM40-importomics S3A row6030
      class1. The multi-cell-line S2G row9225 records mitochondrial clustering in HEK, HeLa and Huh7, with
      the U2OS mitochondrial-cluster cell blank. S3C row738 is assigned the ambiguous membrane-association
      cluster, so this HTP source is not recast as a precise outer-membrane assay. Retain the informative organelle
      location under the project organelle guidance; separate target experiments support the outer-membrane
      annotation.'
    supported_by:
    - reference_id: PMID:34800366
      supporting_text: We classified >8,000 proteins in mitochondrial preparations of human cells and defined
        a mitochondrial high-confidence proteome of >1,100 proteins (MitoCoP).
    - reference_id: PMID:23993193
      supporting_text: We show that FBXL4 is an F-box protein that colocalizes with mitochondria
- source_index: 8
  source_annotation:
    term:
      id: GO:0005741
      label: mitochondrial outer membrane
    evidence_type: IDA
    original_reference_id: PMID:36896912
    qualifier: is_active_in
  review:
    summary: FBXL4 is an integral mitochondrial outer-membrane component of the SCF ligase.
    action: ACCEPT
    reason: The actual PMID36896912 Results and submitochondrial-localization Methods combine mitochondrial
      protease accessibility, alkaline extraction, microscopy and N-terminal targeting constructs with SCF
      association. Tagged FBXL4 is accessible in intact mitochondria and remains in the membrane pellet under
      the reported conditions. Independent PMID37161784 microscopy distinguishes TOM20-associated outer-membrane
      localization from TIM50 after mitochondrial swelling. These positive experiments support the active outer-membrane
      pool, without treating the conflicting 2013 protection/fractionation result as never performed or proving
      exclusive localization in every condition. Engineered targeting constructs are not natural products.
    supported_by:
    - reference_id: PMID:36896912
      supporting_text: We determined that FBXL4 functions as an integral outer-membrane protein that forms
        an SCF-FBXL4 ubiquitin E3 ligase complex.
    - reference_id: PMID:37161784
      supporting_text: localises to the mitochondrial outer membrane in unstressed cells and mediates the constitutive
        ubiquitylation and degradation of the mitophagy receptors NIX and BNIP3 to suppress basal levels of
        mitophagy
- source_index: 10
  source_annotation:
    term:
      id: GO:0005758
      label: mitochondrial intermembrane space
    evidence_type: IDA
    original_reference_id: PMID:23993194
    qualifier: located_in
  review:
    summary: The original intermembrane-space assignment conflicts with later target topology experiments.
    action: UNDECIDED
    reason: 'The full 2013 original was recovered and read: tagged human FBXL4 was protected from trypsin in
      intact mitochondrial preparations and became accessible after digitonin treatment; separate mouse-liver
      fractionation supported a soluble mitochondrial pool. These are actual experiments, not an abstract-only
      inference. Later PMID36896912 reports protease accessibility and membrane association compatible with
      an outer-membrane pool. Preparation, expression and protease conditions differ; the 2013 Results and
      Methods also print different trypsin-concentration units. The evidence assessed here does not resolve
      that discrepancy or demonstrate which side each endogenous segment occupies. Preserve the positive historical
      observation and curator source while leaving precise intermembrane-space localization undecided.'
    supported_by:
    - reference_id: PMID:23993194
      supporting_text: We also demonstrate that FBXL4 is targeted to mitochondria and localizes in the intermembrane
        space, where it participates in an approximately 400 kDa protein complex.
    - reference_id: PMID:36896912
      supporting_text: We determined that FBXL4 functions as an integral outer-membrane protein that forms
        an SCF-FBXL4 ubiquitin E3 ligase complex.
- source_index: 21
  source_annotation:
    term:
      id: GO:0006511
      label: ubiquitin-dependent protein catabolic process
    evidence_type: TAS
    original_reference_id: PMID:10531035
    qualifier: involved_in
  review:
    summary: FBXL4 promotes SCF-dependent proteasomal substrate turnover.
    action: TOO_GENERAL
    reason: The 1999 F-box-family paper supports a broad ubiquitin-dependent catabolic role. Target-specific
      later studies establish receptor ubiquitination and proteasomal turnover by SCF-FBXL4, already represented
      by retained GO:0031146. The genuine ontology ancestry places that process under GO:0006511. The broader
      process adds no independently demonstrated alternative degradation route; it remains biologically true
      and is not rejected on evidence-code grounds.
    supported_by:
    - reference_id: PMID:10531035
      supporting_text: In fact, F-box proteins are one of the four subunits of ubiquitin protein ligases called
        SCFs.
    - reference_id: PMID:36896912
      supporting_text: SCF-FBXL4 ubiquitinates BNIP3 and NIX to target them for degradation.
- source_index: 25
  source_annotation:
    term:
      id: GO:0031146
      label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
    evidence_type: NAS
    original_reference_id: PMID:33234069
    qualifier: involved_in
  review:
    summary: FBXL4 recruits substrates to an SCF ligase for proteasomal degradation.
    action: ACCEPT
    reason: The family review provides NAS context, and target-specific primary studies establish the role
      through SCF association, F-box perturbations, in-cell ubiquitination, receptor half-life/proteasome experiments
      and rescue. FBXL4 participates by substrate recognition and recruitment, while the assembled SCF/E2 machinery
      performs ubiquitin transfer. BNIP3 and BNIP3L/NIX turnover are distinct from the downstream lysosomal
      removal of mitochondria. Contextual 2011 JMJD2A/KDM4A turnover evidence is separately assessed without
      implying a purified binary interaction or an independently imaged nuclear FBXL4 pool.
    supported_by:
    - reference_id: PMID:33234069
      supporting_text: F-box proteins (FBPs) are substrate-recruiting subunits of Skp1-cullin1-FBP (SCF)-type
        E3 ubiquitin ligases that determine which proteins are ubiquitinated.
    - reference_id: PMID:36896912
      supporting_text: SCF-FBXL4 ubiquitinates BNIP3 and NIX to target them for degradation.
