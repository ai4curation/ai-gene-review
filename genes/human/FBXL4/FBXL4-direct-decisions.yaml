  review:
    summary: The experimentally resolved mitophagy-regulatory direction is negative.
    action: TOO_GENERAL
    reason: The mitochondrial-dynamics review discusses FBXL4 in the disease and turnover context; its fusion
      model is not treated as a direct assay of fusion chemistry. Independent primary experiments establish
      restraint of mitophagy through mitophagy-receptor turnover. Retained GO:1901525 is an actual ontology
      descendant of GO:1901524 and preserves this signed role. The unsigned parent adds no demonstrated opposite
      regulatory action in the evidence assessed here.
    supported_by:
    - reference_id: PMID:36135912
      supporting_text: Then, mitochondrial disorders caused by defects in fission and fusion are summarized,
        including disorders related to MFN2, MSTO1, OPA1, YME1L1, FBXL4, DNM1L, and MFF genes.
    - reference_id: PMID:36896912
      supporting_text: we found that knockout (KO) of FBXL4, a mitochondrial disease gene, hyperactivates mitophagy
        at basal conditions.
- source_index: 27
  source_annotation:
    term:
      id: GO:1901525
      label: negative regulation of mitophagy
    evidence_type: IDA
    original_reference_id: PMID:38992176
    qualifier: involved_in
  review:
    summary: SCF-FBXL4 limits mitophagy by promoting BNIP3 and BNIP3L/NIX turnover.
    action: ACCEPT
    reason: The actual PMID38992176 target perturbation, turnover and mitophagy assays support an inhibitory
      role assisted by PPTC7-dependent receptor recruitment. FBXL4 still associates with SKP1/CUL1 after PPTC7
      knockout, separating substrate recruitment from assembly of the SCF core. The 2025 PMID40025034 study
      independently supports cooperation in human-cell ubiquitination/rescue assays, but reports a different
      PPTC7 D78A outcome and different effects of component overexpression. Cell lines, expression levels and
      treatment contexts differ; neither paper establishes a universal monotonic dose response or resolves
      those differences. The shared inhibitory pathway remains supported.
    supported_by:
    - reference_id: PMID:38992176
      supporting_text: The SCFFBXL4 ubiquitin ligase complex suppresses mitophagy by controlling the degradation
        of BNIP3 and NIX mitophagy receptors
    - reference_id: PMID:38992176
      supporting_text: a pool of PPTC7 on the mitochondrial outer membrane acts as an adaptor linking BNIP3
        and NIX to FBXL4, facilitating the turnover of these mitophagy receptors
    - reference_id: PMID:40025034
- source_index: 28
  source_annotation:
    term:
      id: GO:1990756
      label: ubiquitin-like ligase-substrate adaptor activity
    evidence_type: IDA
    original_reference_id: PMID:38992176
    qualifier: enables
  review:
    summary: FBXL4 is the substrate-recognition/adaptor component of SCF-mediated ubiquitination.
    action: ACCEPT
    reason: FBXL4 associates with SKP1/CUL1 through its F-box and connects receptor substrates to the SCF machinery;
      PPTC7 facilitates receptor recruitment. The source supports this adaptor role through co-complex, mutagenesis,
      in-cell ubiquitination and turnover experiments. PMID38992176 explicitly distinguishes its modeled ternary
      arrangement from experimentally demonstrated simultaneous ternary occupancy. PMID40025034 adds cofactor-dependent
      in-cell assays, not a purified reconstitution or independent PPTC7 E3 catalytic activity. The evidence
      supports the FBXL4 substrate-adaptor molecular function without asserting that every co-IP proves a purified
      binary contact, that PPTC7 assembles SKP1/CUL1, or that FBXL4 itself supplies ubiquitin-transfer chemistry.
    supported_by:
    - reference_id: PMID:38992176
      supporting_text: a pool of PPTC7 on the mitochondrial outer membrane acts as an adaptor linking BNIP3
        and NIX to FBXL4, facilitating the turnover of these mitophagy receptors
    - reference_id: PMID:37102372
      supporting_text: FBXL4 restricts NIX and BNIP3 levels via direct interaction and protein destabilization
    - reference_id: PMID:36896912
      supporting_text: SCF-FBXL4 ubiquitinates BNIP3 and NIX to target them for degradation.
    - reference_id: PMID:40025034
