    reason: Actual target experiments in PMID:36896912 show tagged human FBXL4 associated with endogenous SKP1
      and CUL1; deleting or altering its F-box disrupts that association. This supports membership as the substrate-recognition
      component, not independent catalytic activity of FBXL4. The actual PANTHER v19 tree places human leaf
      PTN002547906 below asserted node PTN002547163, and the ungapped 621-residue alignment exactly matches
      official Q9UKA2. The selected positive IBD assertion and literal donor list were read; the selected file
      contains no NOT row. Target functional evidence agrees with the ancestral role, with no observed target-specific
      loss of this function. Donor count is not used as a confidence measure, and the complete experimental
      history of every descendant was not independently rereviewed.
