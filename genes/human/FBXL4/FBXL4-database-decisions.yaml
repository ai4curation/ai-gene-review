- index: 1
  original_source_object:
    term:
      id: GO:0000422
      label: autophagy of mitochondrion
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: involved_in
    supporting_entities:
    - ARBA:ARBA00026840
  review:
    summary: FBXL4 restricts mitophagy through turnover of the BNIP3 and NIX receptors.
    action: MODIFY
    reason: The actual ARBA rule predicts autophagy of mitochondrion, but the target experiments distinguish the
      regulator from the machinery that delivers and degrades mitochondria. In PMID:36896912, loss of FBXL4 increases
      BNIP3/NIX-dependent mitophagy and wild-type rescue restores restraint; SCF-dependent receptor ubiquitination
      and degradation supply the mechanism. PMID:37161784 independently supports receptor turnover and basal mitophagy
      suppression. Negative regulation of mitophagy is the appropriate role correction and is already supported
      by direct row 27. This is a lateral regulatory correction, not a strict is_a/part_of refinement or a claim
      that FBXL4 performs mitochondrial degradation.
    supported_by:
    - reference_id: PMID:36896912
      supporting_text: we found that knockout (KO) of FBXL4, a mitochondrial disease gene, hyperactivates mitophagy
        at basal conditions.
    - reference_id: PMID:37161784
      supporting_text: Thus, we reveal a molecular mechanism whereby FBXL4 actively suppresses mitophagy by preventing
        NIX and BNIP3 accumulation.
    additional_reference_ids:
    - PMID:36896912
    - PMID:37161784
    proposed_replacement_terms:
    - id: GO:1901525
      label: negative regulation of mitophagy
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: ARBA:ARBA00026840
        source_label: ARBA00026840
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Actual current rule has eight alternative condition sets and predicts GO:0000422. Its full target
          FunFam condition match and historical model state were not independently replayed; target perturbation
          and receptor-turnover evidence determine the role correction.
      failure_modes:
      - ROLE_CONFLATION
- index: 5
  original_source_object:
    term:
      id: GO:0005634
      label: nucleus
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    supporting_entities:
    - UniProtKB-SubCell:SL-0191
  review:
    summary: A broad nuclear location is covered by the retained HPA nuclear-speck observation.
    action: TOO_GENERAL
    reason: Current UniProt explicitly retains SL-0191 nucleus but supplies no location-specific evidence tag for
      that field. Independently inspected HPA029140 immunofluorescence reports supported nuclear-speck staining
      in A-431, U-251MG and U2OS, retained as contextual row 22. Nuclear speck is a strict is_a/part_of descendant
      of nucleus. The broad term adds no separate resolved nuclear compartment here. PMID:23993194 reported no detectable
      nuclear FBXL4 in its assayed cell/fractionation conditions; that discrepancy and the single-antibody specificity
      limit remain explicit and do not justify a universal nuclear exclusion. The inherited mitochondrial quotes
      document the other location, not evidence against every nuclear pool.
    supported_by:
    - reference_id: PMID:36896912
      supporting_text: We determined that FBXL4 functions as an integral outer-membrane protein that forms an SCF-FBXL4
        ubiquitin E3 ligase complex.
    - reference_id: PMID:37161784
      supporting_text: localises to the mitochondrial outer membrane in unstressed cells and mediates the constitutive
        ubiquitylation and degradation of the mitophagy receptors NIX and BNIP3 to suppress basal levels of mitophagy
    additional_reference_ids:
    - PMID:23993194
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0191
        source_label: Nucleus
        source_status: SUPPORTS_TRANSFER
        comment: The literal location remains in the official record. Independent HPA nuclear-speck staining supports
          the narrower retained compartment, without establishing a nuclear molecular function.
      failure_modes:
      - GRANULARITY_MISMATCH
- index: 6
  original_source_object:
    term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    supporting_entities:
    - UniProtKB-SubCell:SL-0086
  review:
    summary: Mitochondrial residence is compatible with the broad cytoplasm term.
    action: TOO_GENERAL
    reason: GO:0005737 includes organelles and is not synonymous with cytosol. The positively supported mitochondrial
      outer-membrane location in rows 8 and 9 is a strict is_a/part_of descendant of cytoplasm and provides the
      resolved location for this source. Current UniProt retains SL-0086 cytoplasm without a field-specific evidence
      tag. The broad term is redundant with that retained organellar location; it is not biologically false. This
      action does not convert the separate cytosol records into mitochondrial annotations.
    supported_by:
    - reference_id: PMID:36896912
      supporting_text: We determined that FBXL4 functions as an integral outer-membrane protein that forms an SCF-FBXL4
        ubiquitin E3 ligase complex.
    additional_reference_ids:
    - PMID:36896912
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0086
        source_label: Cytoplasm
        source_status: SUPPORTS_TRANSFER
        comment: Official location field was read. Its broad meaning includes the experimentally supported mitochondrial
          compartment.
      failure_modes:
      - GRANULARITY_MISMATCH
- index: 9
  original_source_object:
    term:
      id: GO:0005741
      label: mitochondrial outer membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    supporting_entities:
    - ARBA:ARBA00088384
    - UniProtKB-SubCell:SL-0172
  review:
    summary: FBXL4 localizes to the mitochondrial outer membrane.
    action: ACCEPT
    reason: The combined electronic source joins ARBA00088384 and UniProt SL-0172. The current UniProt outer-membrane
      field explicitly cites PMID:36896912. In that human HeLa study, tagged FBXL4 is accessible to protease in
      intact mitochondria and remains in the membrane pellet under alkaline extraction, with compartment controls.
      PMID:37161784 independently reports tagged FBXL4 localization relative to TOM20 and TIM50 and requires mitochondrial
      targeting for receptor turnover. These target results support the mapped location. They do not establish exclusive
      localization in every cell or condition, and engineered targeting constructs are not natural products.
    supported_by:
    - reference_id: PMID:36896912
      supporting_text: We determined that FBXL4 functions as an integral outer-membrane protein that forms an SCF-FBXL4
        ubiquitin E3 ligase complex.
    additional_reference_ids:
    - PMID:36896912
    - PMID:37161784
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: ARBA:ARBA00088384
        source_label: ARBA00088384
        source_status: SUPPORTS_TRANSFER
        comment: Actual rule predicts GO:0005741 through alternative FunFam/taxon conditions. All target rule matches
          were not replayed; independent target localization supports the consequence.
      - source_id: UniProtKB-SubCell:SL-0172
        source_label: Mitochondrion outer membrane
        source_status: SUPPORTS_TRANSFER
        comment: Official target field has ECO:0000269 evidence from PMID:36896912; actual original localization
          results were read.
- index: 11
  original_source_object:
    term:
      id: GO:0005829
      label: cytosol
    evidence_type: TAS
    original_reference_id: Reactome:R-HSA-8952618
    qualifier: located_in
  review:
    summary: The Reactome model includes FBXL4 in a cytosolic ubiquitin-ligase route, but the specific compartment
      remains unresolved.
    action: UNDECIDED
    reason: "Actual source traversal confirms 8952618 -> output -> 8952593 -> hasComponent -> 8952588 -> hasComponent\
      \ -> 976085 -> hasMember -> 8850899, ending at entity 8850899, Q9UKA2 residues 1\u2013621, explicitly assigned\
      \ to cytosol. The positive target membership is preserved; this is not a title-only or wrong-gene rejection.\
      \ The event summation and target path describe a pathway model, not an inspected FBXL4-specific cytosolic\
      \ localization experiment. Human primary localization supports mitochondrial FBXL4, including integral outer\
      \ membrane in PMID:36896912, while PMID:23993194 did not detect a postmitochondrial cytosolic pool in its\
      \ tested conditions. These observations do not exclude an additional conditional pool. Cytosol excludes organelles,\
      \ and outer membrane is not its strict descendant, so replacing this source statement by outer membrane would\
      \ change the asserted compartment. Retain source-specific uncertainty pending evidence for the modeled cytosolic\
      \ pool; no biological negation or new compartment assertion is made."
    supported_by:
    - reference_id: PMID:36896912
      supporting_text: We determined that FBXL4 functions as an integral outer-membrane protein that forms an SCF-FBXL4
        ubiquitin E3 ligase complex.
    - reference_id: PMID:37161784
      supporting_text: localises to the mitochondrial outer membrane in unstressed cells and mediates the constitutive
        ubiquitylation and degradation of the mitophagy receptors NIX and BNIP3 to suppress basal levels of mitophagy
    additional_reference_ids:
    - PMID:36896912
    - PMID:23993194
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: Reactome:R-HSA-8952618
        source_label: AcM-UBE2M transfers NEDD8 to CRL1 E3 ubiquitin ligase complex
        source_status: UNRESOLVED
        comment: Literal target inclusion and cytosolic entity identity verified from actual nested source objects.
          Experimental support for this particular compartment was not resolved; other branches and every cited
          primary experiment were not exhaustively reviewed.
