gene: FBXL4
policy: Evidence-backed specific binding terms replace generic binding. These interaction observations
  do not introduce additional core functions or transfer partner catalytic/regulatory activities.
rows:
- source_index: 3
  source_annotation:
    term:
      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:32814053
    qualifier: enables
    supporting_entities:
    - UniProtKB:O14773
  review:
    summary: Human FBXL4 and TPP1 form a positive yeast two-hybrid pair.
    action: MODIFY
    reason: The original PMID32814053 Table S2 workbook lists TPP1/Entrez1200 with FBXL4/Entrez26235 in
      NN1.0 row3486 and NN1.0ext row7570. Exact IntAct records EBI-25838630, EBI-25995383 and EBI-26149530
      join Q9UKA2 to O14773 by array, pooling and validated two-hybrid methods, respectively. The primary
      Methods use yeast reporters and pairwise retesting. Official GO:0002020 describes binding to a protease
      or peptidase, and official UniProt identifies O14773 as tripeptidyl-peptidase 1. This specific physical-binding
      term fits the verified partner without asserting protease regulation or catalysis by FBXL4. Original
      top-target Table S1 gives TPP1 clone CCSB_992; neither that table nor the empty IntAct feature fields
      resolves the tested insert boundaries or a mature versus precursor state. The replacement therefore
      retains the assayed TPP1-entity scope, without claiming binding to a mapped mature catalytic chain.
      The tested association does not make TPP1 an established SCF-FBXL4 substrate, establish physiological
      colocalization or transfer TPP1 protease activity to FBXL4.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: Here, we report on an interactome map that focuses on neurodegenerative disease
        (ND)
    proposed_replacement_terms:
    - id: GO:0002020
      label: protease binding
  methods:
  - yeast two-hybrid pooling
  - two-hybrid array
  - validated two-hybrid
  partner_scope: Exact IntAct accession/isoform preserved; original supplement is gene-level.
- source_index: 4
  source_annotation:
    term:
      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:32814053
    qualifier: enables
    supporting_entities:
    - UniProtKB:P50570-2
  review:
    summary: Human FBXL4 and the source DNM2 isoform form a positive yeast two-hybrid pair.
    action: MODIFY
    reason: The original PMID32814053 Table S2 lists DNM2/Entrez1785 with FBXL4/Entrez26235 in NN1.0 row3485
      and NN1.0ext row7569. Exact IntAct records EBI-25845005, EBI-26001463 and EBI-26155610 retain Q9UKA2
      and P50570-2, distinguishing the curator-resolved DNM2 isoform identifier from the gene-level supplementary
      table. The assays are array, pooling and validated two-hybrid. Official GO:0051020 describes binding
      to a GTPase, and official UniProt identifies DNM2 as dynamin-2/GTPase EC3.6.5.5. The specific physical-binding
      term is supported without assigning GTPase activity or regulation to FBXL4. The only direct child
      returned by the official GTPase-binding ontology query is small GTPase binding, which does not describe
      dynamin. Original top-target Table S1 identifies DNM2 clone IOH28879 but supplies no insert boundaries,
      and IntAct feature fields are empty. Preserve that construct limit and P50570-2 partner identity;
      no physiological membrane-remodeling role or natural FBXL4 isoform specificity is established.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: Here, we report on an interactome map that focuses on neurodegenerative disease
        (ND)
    proposed_replacement_terms:
    - id: GO:0051020
      label: GTPase binding
  methods:
  - yeast two-hybrid pooling
  - two-hybrid array
  - validated two-hybrid
  partner_scope: Exact IntAct accession/isoform preserved; original supplement is gene-level.
