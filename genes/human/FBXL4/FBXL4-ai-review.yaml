    supporting_text: >-
      We determined that FBXL4 functions as an integral outer-membrane protein that forms an SCF-FBXL4
      ubiquitin E3 ligase complex.
  - reference_id: PMID:36896912
    supporting_text: >-
      SCF-FBXL4 ubiquitinates BNIP3 and NIX to target them for degradation.
  - reference_id: PMID:37161784
    supporting_text: >-
      localises to the mitochondrial outer membrane in unstressed cells and mediates the constitutive
      ubiquitylation and degradation of the mitophagy receptors NIX and BNIP3 to suppress basal levels
      of mitophagy
  - reference_id: PMID:37102372
    supporting_text: >-
      FBXL4 restricts NIX and BNIP3 levels via direct interaction and protein destabilization
  - reference_id: PMID:38992176
    supporting_text: >-
      a pool of PPTC7 on the mitochondrial outer membrane acts as an adaptor linking BNIP3 and NIX to
      FBXL4, facilitating the turnover of these mitophagy receptors
  - reference_id: PMID:36896912
    supporting_text: >-
      Importantly, knockout of either Bnip3 or Nix rescues metabolic derangements and viability of the
      Fbxl4-/- mice.
suggested_questions:
- question: >-
    What is the membrane topology of FBXL4 (N-terminal anchor versus intermembrane-space residence reported
    in 2013), and how does it present the LRR domain to cytosolic BNIP3/NIX?
- question: >-
    Are there SCF-FBXL4 substrates beyond BNIP3, NIX and possibly PPTC7, and do they contribute to the
    mtDNA depletion phenotype?
- question: >-
    Is the reported effect of FBXL4 on DRP1-mediated fission direct, or secondary to altered mitophagy
    and mitochondrial mass?
suggested_experiments:
- description: >-
    In FBXL4-null patient fibroblasts, test whether NIX knockdown alone, or pharmacological reduction
    of BNIP3/NIX, normalizes mtDNA copy number and respiratory-chain activity, to establish whether mtDNA
    depletion is fully downstream of excessive mitophagy.
