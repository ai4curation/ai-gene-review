id: Q9UKA2
gene_symbol: FBXL4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  FBXL4 is an F-box/leucine-rich-repeat protein anchored in the mitochondrial outer membrane. It is the
  substrate-recognition subunit of a mitochondrial SCF (SKP1-CUL1-F-box) E3 ubiquitin ligase that constitutively
  ubiquitinates the mitophagy receptors BNIP3 and BNIP3L/NIX and targets them for proteasomal degradation;
  the mitochondrial phosphatase PPTC7 acts as an adaptor that links BNIP3 and NIX to FBXL4. By keeping
  these receptors low, FBXL4 restrains basal receptor-mediated mitophagy and maintains mitochondrial mass.
  Loss of FBXL4 causes accumulation of BNIP3/NIX, excessive mitophagy, reduced mitochondrial content and
  mtDNA depletion; in mice, deleting Bnip3 or Nix rescues Fbxl4-null lethality. Biallelic FBXL4 variants
  cause an early-onset encephalomyopathic mtDNA depletion syndrome (MTDPS13) with lactic acidosis and
  combined respiratory-chain deficiency.
