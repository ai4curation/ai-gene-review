  review:
    summary: Human FBXL4 and the source DNM2 isoform form a positive yeast two-hybrid pair.
    action: MODIFY
    reason: The original PMID32814053 Table S2 lists DNM2/Entrez1785 with FBXL4/Entrez26235 in NN1.0 row3485 and
      NN1.0ext row7569. Exact IntAct records EBI-25845005, EBI-26001463 and EBI-26155610 retain Q9UKA2 and P50570-2,
      distinguishing the curator-resolved DNM2 isoform identifier from the gene-level supplementary table. The assays
      are array, pooling and validated two-hybrid. Official GO:0051020 describes binding to a GTPase, and official
      UniProt identifies DNM2 as dynamin-2/GTPase EC3.6.5.5. The specific physical-binding term is supported without
      assigning GTPase activity or regulation to FBXL4. The only direct child returned by the official GTPase-binding
      ontology query is small GTPase binding, which does not describe dynamin. Original top-target Table S1 identifies
      DNM2 clone IOH28879 but supplies no insert boundaries, and IntAct feature fields are empty. Preserve that
      construct limit and P50570-2 partner identity; no physiological membrane-remodeling role or natural FBXL4
      isoform specificity is established.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: Here, we report on an interactome map that focuses on neurodegenerative disease (ND)
