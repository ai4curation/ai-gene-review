id: Q9UKA2
gene_symbol: FBXL4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  FBXL4 is an F-box/leucine-rich-repeat protein that acts as the substrate-recognition subunit
  of a mitochondria-anchored SCF (SKP1-CUL1-F-box) ubiquitin E3 ligase, SCF-FBXL4. An N-terminal
  transmembrane segment followed by an arginine-rich stretch anchors FBXL4 in the mitochondrial
  outer membrane, with its F-box and C-terminal LRR domain exposed to the cytosol. SCF-FBXL4
  constitutively ubiquitinates the outer-membrane mitophagy receptors BNIP3 and BNIP3L/NIX
  and targets them for proteasomal degradation, thereby keeping basal receptor-mediated mitophagy
  low and preserving mitochondrial mass. The mitochondrial phosphatase PPTC7, a pool of which
  sits on the outer membrane, acts as a phosphatase-independent co-adaptor that bridges BNIP3/NIX
  to FBXL4. Biallelic loss-of-function variants cause mitochondrial DNA depletion syndrome
  13 (MTDPS13), an early-onset encephalomyopathy with lactic acidosis and combined OXPHOS
  deficiency; disease variants impair SCF-FBXL4 assembly, and the resulting BNIP3/NIX accumulation
  drives excessive mitophagy, mitochondrial protein loss and mtDNA depletion, which is rescued
  in mice by deleting Bnip3 or Nix.
existing_annotations:
- term:
    id: GO:0000151
    label: ubiquitin ligase complex
  evidence_type: TAS
  original_reference_id: PMID:10531035
  qualifier: part_of
  review:
    summary: >-
      TAS assignment to the generic term ubiquitin ligase complex, from the 1999 paper that
      identified the human F-box protein family (including FBXL4) by Skp1 two-hybrid screening
      and database searches. FBXL4 is now known to assemble specifically into a SCF (SKP1-CUL1-F-box)
      ubiquitin ligase, so the more informative complex term is SCF ubiquitin ligase complex.
    action: MODIFY
    reason: >-
      The annotation is correct in essence but too general. Cao et al. (2023) biochemically
      demonstrated that FBXL4 forms an SCF-FBXL4 complex, and Nguyen-Dien et al. (2023) showed
      SCF-FBXL4 is an SKP1/CUL1/F-box complex on the mitochondrial outer membrane. GO:0019005
      SCF ubiquitin ligase complex is the precise term.
    proposed_replacement_terms:
    - id: GO:0019005
      label: SCF ubiquitin ligase complex
    supported_by:
    - reference_id: PMID:10531035
      supporting_text: >-
        Using Skp1 as a bait in a yeast two-hybrid screen and by searching DNA databases,
        we identified a family of 26 human F-box proteins, 25 of which were novel.
    - reference_id: PMID:37161784
      supporting_text: >-
        SCFFBXL4 , an SKP1/CUL1/F-box protein ubiquitin ligase complex, localises to the mitochondrial
        outer membrane in unstressed cells
- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026840
  review:
    summary: >-
      ARBA machine-learning annotation to autophagy of mitochondrion. FBXL4 does not execute
      mitophagy; it restrains it. Loss of FBXL4 increases basal mitophagy because the mitophagy
      receptors BNIP3 and NIX are no longer degraded.
    action: MODIFY
    reason: >-
      FBXL4 acts as a negative regulator of mitophagy rather than a component of the autophagic
      machinery. Multiple independent studies show FBXL4 knockout hyperactivates basal mitophagy
      via BNIP3/NIX accumulation. The informative term is negative regulation of mitophagy
      (GO:1901525).
    proposed_replacement_terms:
    - id: GO:1901525
      label: negative regulation of mitophagy
    supported_by:
    - reference_id: PMID:36896912
      supporting_text: >-
        we found that knockout (KO) of FBXL4, a mitochondrial disease gene, hyperactivates
        mitophagy at basal conditions.
    - reference_id: PMID:37102372
      supporting_text: >-
        We identify two cullin-RING ligase substrate receptors, VHL and FBXL4, as the most
        profound negative regulators of basal mitophagy.
- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IMP
  original_reference_id: PMID:32525278
  qualifier: acts_upstream_of_or_within
  review:
    summary: >-
      IMP (acts_upstream_of_or_within) annotation from Alsina et al. (2020), who showed that
      Fbxl4 knockout mice and FBXL4-deficient human cells lose mitochondrial content through
      increased lysosomal (autophagic) turnover, reversed by lysosomal but not proteasomal
      inhibition. The data establish FBXL4 as a suppressor of mitochondrial removal by autophagy.
    action: MODIFY
    reason: >-
      The phenotype (more mitophagy when FBXL4 is lost) defines FBXL4 as a negative regulator;
      later mechanistic work identified BNIP3/NIX degradation as the basis. Replace with negative
      regulation of mitophagy.
    proposed_replacement_terms:
    - id: GO:1901525
      label: negative regulation of mitophagy
    supported_by:
    - reference_id: PMID:32525278
      supporting_text: >-
        the results we present here show that FBXL4 prevents mitochondrial removal via autophagy
        and that loss of FBXL4 leads to decreased mitochondrial content and mitochondrial
        disease.
