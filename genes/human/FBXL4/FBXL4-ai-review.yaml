id: Q9UKA2
gene_symbol: FBXL4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FBXL4 is an F-box and leucine-rich-repeat protein that serves as a substrate-recognition component
  of an SCF ubiquitin ligase at the mitochondrial outer membrane. By promoting turnover of the mitophagy receptors
  BNIP3 and BNIP3L/NIX, it restrains excessive mitochondrial removal and helps preserve mitochondrial content. PPTC7
  assists receptor recruitment without being required for FBXL4 association with the SKP1–CUL1 core. Biallelic pathogenic
  variants cause an encephalomyopathic mitochondrial disease with mitochondrial DNA depletion. A contextual role
  in JMJD2A/KDM4A turnover has also been reported; the predominant receptor-turnover function does not establish
  exclusive localization or one mechanism for every cellular phenotype.
existing_annotations:
- term:
    id: GO:0000151
    label: ubiquitin ligase complex
  evidence_type: TAS
  original_reference_id: PMID:10531035
  qualifier: part_of
  review:
    summary: FBXL4 belongs to the SCF ubiquitin ligase complex.
    action: TOO_GENERAL
    reason: The 1999 paper identifies Fbl4 among F-box family members by database searching; its representative
      interaction assays should not be confused with assays of the similarly named Fbx4. The family-level ubiquitin-ligase-complex
      inference is positive. Independent target co-immunoprecipitation, F-box perturbation and ubiquitination experiments
      in PMID36896912 and PMID37161784 establish the more informative SCF complex, already retained at GO:0019005.
      Official ontology ancestry confirms GO:0019005 is a descendant of GO:0000151. The generic complex term adds
      no separate complex role; this does not reject its TAS support.
    supported_by:
    - reference_id: PMID:10531035
      supporting_text: In fact, F-box proteins are one of the four subunits of ubiquitin protein ligases called
        SCFs.
    - reference_id: PMID:36896912
      supporting_text: We determined that FBXL4 functions as an integral outer-membrane protein that forms an SCF-FBXL4
        ubiquitin E3 ligase complex.
- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026840
  review:
    summary: FBXL4 restricts mitophagy through turnover of the BNIP3 and NIX receptors.
    action: MODIFY
    reason: The actual ARBA rule predicts autophagy of mitochondrion, but the target experiments distinguish the
      regulator from the machinery that delivers and degrades mitochondria. In PMID:36896912, loss of FBXL4 increases
      BNIP3/NIX-dependent mitophagy and wild-type rescue restores restraint; SCF-dependent receptor ubiquitination
      and degradation supply the mechanism. PMID:37161784 independently supports receptor turnover and basal mitophagy
      suppression. Negative regulation of mitophagy is the appropriate role correction and is already supported
      by direct row 27. This is a lateral regulatory correction, not a strict is_a/part_of refinement or a claim
      that FBXL4 performs mitochondrial degradation.
    supported_by:
    - reference_id: PMID:36896912
      supporting_text: we found that knockout (KO) of FBXL4, a mitochondrial disease gene, hyperactivates mitophagy
        at basal conditions.
    - reference_id: PMID:37161784
      supporting_text: Thus, we reveal a molecular mechanism whereby FBXL4 actively suppresses mitophagy by preventing
        NIX and BNIP3 accumulation.
    additional_reference_ids:
    - PMID:36896912
    - PMID:37161784
    proposed_replacement_terms:
    - id: GO:1901525
      label: negative regulation of mitophagy
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: ARBA:ARBA00026840
        source_label: ARBA00026840
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: Actual current rule has eight alternative condition sets and predicts GO:0000422. Its full target
          FunFam condition match and historical model state were not independently replayed; target perturbation
          and receptor-turnover evidence determine the role correction.
      failure_modes:
      - ROLE_CONFLATION
- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IMP
  original_reference_id: PMID:32525278
  qualifier: acts_upstream_of_or_within
  review:
    summary: FBXL4 limits excessive mitochondrial removal by autophagy.
    action: MODIFY
    reason: The actual patient-cell and mouse study measures increased lysosome-dependent mitochondrial turnover
      after FBXL4 deficiency, rather than showing that FBXL4 executes mitochondrial degradation. Its earlier LC3-related
      interpretation is bounded to those assays. Subsequent target studies resolve SCF-mediated turnover of BNIP3/NIX
      as a mechanism restraining mitophagy. Negative regulation of mitophagy (GO:1901525) states this inhibitory
      role more precisely while preserving the original acts_upstream_of_or_within source qualifier.
    proposed_replacement_terms:
    - id: GO:1901525
      label: negative regulation of mitophagy
    supported_by:
    - reference_id: PMID:32525278
      supporting_text: the results we present here show that FBXL4 prevents mitochondrial removal via autophagy
        and that loss of FBXL4 leads to decreased mitochondrial content and mitochondrial disease
    - reference_id: PMID:36896912
      supporting_text: we found that knockout (KO) of FBXL4, a mitochondrial disease gene, hyperactivates mitophagy
        at basal conditions.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32814053
  qualifier: enables
  supporting_entities:
  - UniProtKB:O14773
  review:
    summary: Human FBXL4 and TPP1 form a positive yeast two-hybrid pair.
    action: MODIFY
    reason: The original PMID32814053 Table S2 workbook lists TPP1/Entrez1200 with FBXL4/Entrez26235 in NN1.0 row3486
      and NN1.0ext row7570. Exact IntAct records EBI-25838630, EBI-25995383 and EBI-26149530 join Q9UKA2 to O14773
      by array, pooling and validated two-hybrid methods, respectively. The primary Methods use yeast reporters
      and pairwise retesting. Official GO:0002020 describes binding to a protease or peptidase, and official UniProt
      identifies O14773 as tripeptidyl-peptidase 1. This specific physical-binding term fits the verified partner
      without asserting protease regulation or catalysis by FBXL4. Original top-target Table S1 gives TPP1 clone
      CCSB_992; neither that table nor the empty IntAct feature fields resolves the tested insert boundaries or
      a mature versus precursor state. The replacement therefore retains the assayed TPP1-entity scope, without
      claiming binding to a mapped mature catalytic chain. The tested association does not make TPP1 an established
      SCF-FBXL4 substrate, establish physiological colocalization or transfer TPP1 protease activity to FBXL4.
    supported_by:
    - reference_id: PMID:32814053
      supporting_text: Here, we report on an interactome map that focuses on neurodegenerative disease (ND)
    proposed_replacement_terms:
    - id: GO:0002020
      label: protease binding
