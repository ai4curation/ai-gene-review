- id: PMID:40025034
  title: PPTC7 acts as an essential co-factor of the SCF(FBXL4) ubiquitin ligase complex to restrict BNIP3/3L-dependent
    mitophagy.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual 2025 primary human HeLa/293T assays support PPTC7/FBXL4 cooperation in receptor ubiquitination
      and turnover. The authors call the SDS-denaturing cellular ubiquitination assay in vivo; it is an in-cell
      assay, not purified reconstitution. The topology/fractionation experiments directly assay PPTC7/BNIP3/BNIP3L;
      FBXL4 outer-membrane location is a cited premise, not a new independent topology measurement. D78A rescue
      differs from PMID38992176, and excess expression of either component can increase receptor levels in these
      conditions, so a universal monotonic dose claim is unsupported. Proposed stoichiometry/evolutionary mechanisms
      remain hypotheses. Read genuine EPMC original blocks7–38/41/45/47/51/53/55/64/66/68, including Results/Methods/captions;
      no new supplementary pixels. DOI10.1038/s41419-025-07463-w and PMID40025034/PMC11873123 verified in the original
      header.
core_functions:
- description: Substrate-recognition component of the mitochondrial outer-membrane SCF-FBXL4 ubiquitin ligase. It
    recruits BNIP3 and BNIP3L/NIX for ubiquitination and proteasomal turnover, restraining receptor-mediated mitophagy.
    PPTC7 assists receptor recruitment; FBXL4 can remain associated with SKP1/CUL1 without PPTC7. This distinguishes
    substrate delivery from SCF-core assembly and from ubiquitin-transfer chemistry.
  molecular_function:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  directly_involved_in:
  - id: GO:0031146
    label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
  - id: GO:1901525
    label: negative regulation of mitophagy
  locations:
  - id: GO:0005741
    label: mitochondrial outer membrane
  in_complex:
    id: GO:0019005
    label: SCF ubiquitin ligase complex
  supported_by:
  - reference_id: PMID:36896912
    supporting_text: We determined that FBXL4 functions as an integral outer-membrane protein that forms an SCF-FBXL4
      ubiquitin E3 ligase complex.
  - reference_id: PMID:36896912
    supporting_text: SCF-FBXL4 ubiquitinates BNIP3 and NIX to target them for degradation.
  - reference_id: PMID:37161784
    supporting_text: localises to the mitochondrial outer membrane in unstressed cells and mediates the constitutive
      ubiquitylation and degradation of the mitophagy receptors NIX and BNIP3 to suppress basal levels of mitophagy
  - reference_id: PMID:37102372
    supporting_text: FBXL4 restricts NIX and BNIP3 levels via direct interaction and protein destabilization
  - reference_id: PMID:38992176
    supporting_text: a pool of PPTC7 on the mitochondrial outer membrane acts as an adaptor linking BNIP3 and NIX
      to FBXL4, facilitating the turnover of these mitophagy receptors
  - reference_id: PMID:36896912
    supporting_text: Importantly, knockout of either Bnip3 or Nix rescues metabolic derangements and viability of
      the Fbxl4-/- mice.
  - reference_id: PMID:40025034
suggested_experiments:
- description: Compare endogenous knock-in D78A and D290N in matched human-cell backgrounds, controlling protein
    abundance/localization and measuring receptor association, SCF assembly, receptor ubiquitination/turnover and
    mitophagy.
  experiment_type: Matched endogenous mutant, recruitment and turnover assays
- description: Use endogenous small epitope tags with controls for mitochondrial integrity, graded permeabilization
    and matched protease conditions, then combine protease accessibility with membrane extraction and orthogonal
    imaging.
  experiment_type: Endogenous topology, fractionation and imaging comparison
knowledge_gaps:
- gap_statement: The assessed studies do not resolve why PPTC7 D78A and excess-expression outcomes differ between
    cellular contexts, or how endogenous recruitment states account for those differences.
  boundary: FBXL4 and PPTC7 cooperate in receptor turnover. FBXL4 association with SKP1/CUL1 persists after PPTC7
    loss. The 2024 and 2025 studies differ in cell line, expression and treatment context, and D290N retains a residual
    catalytic-activity caveat.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Distinguishing recruitment, catalytic and dosage effects would define when PPTC7 supports SCF-FBXL4
    receptor turnover.
  resolution: Compare endogenous knock-in D78A and D290N in matched human-cell backgrounds, controlling protein
    abundance/localization and measuring receptor association, SCF assembly, receptor ubiquitination/turnover and
    mitophagy.
  provenance:
  - reference_id: PMID:38992176
  - reference_id: PMID:40025034
- gap_statement: The assessed 2013 protection/fractionation results and later outer-membrane results do not resolve
    the endogenous FBXL4 membrane orientation and compartment differences across their experimental conditions.
  boundary: Actual experiments support both the historical intermembrane-space interpretation and a functional outer-membrane
    pool. The preparations, expression and protease conditions differ, and the older paper prints different trypsin-concentration
    units. Neither result establishes exclusive localization in all cells.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: The orientation of the substrate-recognition region determines how the mitochondrial pool accesses
    cytosolic SCF components and receptor domains.
  resolution: Use endogenous small epitope tags with controls for mitochondrial integrity, graded permeabilization
    and matched protease conditions, then combine protease accessibility with membrane extraction and orthogonal
    imaging.
  provenance:
  - reference_id: PMID:23993194
  - reference_id: PMID:36896912
  - reference_id: PMID:37161784
