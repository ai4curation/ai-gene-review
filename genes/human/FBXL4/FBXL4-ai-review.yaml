- term:
    id: GO:0005758
    label: mitochondrial intermembrane space
  evidence_type: IDA
  original_reference_id: PMID:23993194
  qualifier: located_in
  review:
    summary: The original intermembrane-space assignment conflicts with later target topology experiments.
    action: UNDECIDED
    reason: 'The full 2013 original was recovered and read: tagged human FBXL4 was protected from trypsin in intact
      mitochondrial preparations and became accessible after digitonin treatment; separate mouse-liver fractionation
      supported a soluble mitochondrial pool. These are actual experiments, not an abstract-only inference. Later
      PMID36896912 reports protease accessibility and membrane association compatible with an outer-membrane pool.
      Preparation, expression and protease conditions differ; the 2013 Results and Methods also print different
      trypsin-concentration units. The evidence assessed here does not resolve that discrepancy or demonstrate which
      side each endogenous segment occupies. Preserve the positive historical observation and curator source while
      leaving precise intermembrane-space localization undecided.'
    supported_by:
    - reference_id: PMID:23993194
      supporting_text: We also demonstrate that FBXL4 is targeted to mitochondria and localizes in the intermembrane
        space, where it participates in an approximately 400 kDa protein complex.
    - reference_id: PMID:36896912
      supporting_text: We determined that FBXL4 functions as an integral outer-membrane protein that forms an SCF-FBXL4
        ubiquitin E3 ligase complex.
