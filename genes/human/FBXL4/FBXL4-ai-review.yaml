    label: autophagy of mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00026840
  review:
    summary: >-
      FBXL4 does not perform mitophagy; it restrains it by degrading the mitophagy receptors BNIP3 and
      NIX, and its loss hyperactivates mitophagy.
    action: MODIFY
    reason: >-
      FBXL4 does not perform mitophagy; it restrains it by degrading the mitophagy receptors BNIP3 and
      NIX, and its loss hyperactivates mitophagy. The correct process term is negative regulation of mitophagy
      (GO:1901525).
    proposed_replacement_terms:
    - id: GO:1901525
      label: negative regulation of mitophagy
    supported_by:
    - reference_id: PMID:36896912
      supporting_text: >-
        we found that knockout (KO) of FBXL4, a mitochondrial disease gene, hyperactivates mitophagy at
        basal conditions.
    - reference_id: PMID:37161784
      supporting_text: >-
        Thus, we reveal a molecular mechanism whereby FBXL4 actively suppresses mitophagy by preventing
        NIX and BNIP3 accumulation.
