core_functions:
- description: >-
    Substrate receptor of the mitochondrial outer-membrane SCF-FBXL4 E3 ubiquitin ligase:
    binds the mitophagy receptors BNIP3 and BNIP3L/NIX (directly and through the PPTC7 co-adaptor)
    and presents them to the SKP1-CUL1-RBX1 core for ubiquitination and proteasomal degradation.
  molecular_function:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  directly_involved_in:
