    supporting_text: SCF-FBXL4 ubiquitinates BNIP3 and NIX to target them for 
      degradation.
  - reference_id: PMID:37161784
    supporting_text: >-
      mediates the constitutive ubiquitylation and degradation of the mitophagy receptors
      NIX and BNIP3 to suppress basal levels of mitophagy.
- description: >-
    Restraint of basal and induced receptor-mediated mitophagy by keeping BNIP3/NIX levels
    low, thereby preserving mitochondrial mass, OXPHOS capacity and mtDNA copy number. Loss
    of this activity causes excessive mitophagy and mtDNA depletion syndrome 13.
  molecular_function:
