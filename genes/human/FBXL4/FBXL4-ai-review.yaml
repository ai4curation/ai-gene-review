- term:
    id: GO:0005741
    label: mitochondrial outer membrane
  evidence_type: IDA
  original_reference_id: PMID:36896912
  qualifier: is_active_in
  review:
    summary: FBXL4 is an integral mitochondrial outer-membrane component of the SCF ligase.
    action: ACCEPT
    reason: The actual PMID36896912 Results and submitochondrial-localization Methods combine mitochondrial protease
      accessibility, alkaline extraction, microscopy and N-terminal targeting constructs with SCF association. Tagged
      FBXL4 is accessible in intact mitochondria and remains in the membrane pellet under the reported conditions.
      Independent PMID37161784 microscopy distinguishes TOM20-associated outer-membrane localization from TIM50
      after mitochondrial swelling. These positive experiments support the active outer-membrane pool, without treating
      the conflicting 2013 protection/fractionation result as never performed or proving exclusive localization
      in every condition. Engineered targeting constructs are not natural products.
    supported_by:
    - reference_id: PMID:36896912
      supporting_text: We determined that FBXL4 functions as an integral outer-membrane protein that forms an SCF-FBXL4
        ubiquitin E3 ligase complex.
    - reference_id: PMID:37161784
      supporting_text: localises to the mitochondrial outer membrane in unstressed cells and mediates the constitutive
        ubiquitylation and degradation of the mitophagy receptors NIX and BNIP3 to suppress basal levels of mitophagy
