- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PAINT method text, selected PTHR13318 IBD TSV, current GOA joins and actual PANTHER v19
      geneinfo/tree/MSA were inspected. Family label is PARTNER OF PAIRED, ISOFORM B-RELATED; the target subfamily
      is PTHR13318:SF152 F-BOX_LRR-REPEAT PROTEIN 4. Human leaf PTN002547906 lies below PTN002547163 and its ungapped
      621-aa sequence exactly matches Q9UKA2. Positive IBD rows support SCF complex and SCF-dependent proteasomal
      catabolism; all 15 selected rows have negated=false. Human target complex assembly and receptor ubiquitination/turnover
      from PMID:36896912 and the recovered PMID:37161784 independently support inheritance. This is not donor-count
      reasoning, a claim to reread every donor, or transfer of every broad-family function.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping, accompanied
    by conservative changes to GO terms applied by UniProt
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official method text maps UniProt subcellular vocabulary to GO. Current Q9UKA2 explicitly lists
      SL-0191 nucleus and SL-0086 cytoplasm without field-specific evidence tags, and SL-0172 outer membrane with
      PMID:36896912 evidence. Cytoplasm includes organelles; strict typed paths support outer membrane within cytoplasm
      and nuclear speck within nucleus. The HPA source provides positive contextual nuclear-speck staining, whereas
      PMID:23993194 reports negative nuclear/cytosolic detection in its assayed conditions. PMID:21757720 supplies
      human JMJD2A association/turnover evidence but no direct FBXL4 nuclear imaging. These scopes do not justify
      universal exclusion of another compartment.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The official method reference describes curated antibody-based localization and is method provenance,
      not itself a target experiment. Actual HPA029140 ICC records are supported nuclear speckles in A-431, U-251MG
      and U2OS. Three selected original images were viewed. The matching Q9UKA2 antigen residues 26–110 and single-peak
      antigen-array result do not establish endogenous knockout specificity; no second antibody or speck-marker
      colocalization was independently checked. Tissue IHC evidence was not substituted for ICC. The positive curator-assigned
      compartment is kept as contextual despite unresolved differences from the 2013 localization study; no nuclear
      molecular function is inferred.
