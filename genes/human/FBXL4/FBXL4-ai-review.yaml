    label: ubiquitin ligase complex
  evidence_type: TAS
  original_reference_id: PMID:10531035
  qualifier: part_of
  review:
    summary: >-
      Places FBXL4 in a ubiquitin ligase complex, without saying which one.
    action: MODIFY
    reason: >-
      FBXL4 is the substrate-recognition subunit of an SCF (SKP1-CUL1-F-box) ubiquitin ligase; the specific
      complex term SCF ubiquitin ligase complex (GO:0019005) is more informative.
    proposed_replacement_terms:
    - id: GO:0019005
      label: SCF ubiquitin ligase complex
    supported_by:
    - reference_id: PMID:10531035
      supporting_text: >-
        In fact, F-box proteins are one of the four subunits of ubiquitin protein ligases called SCFs.
    - reference_id: PMID:36896912
      supporting_text: >-
        We determined that FBXL4 functions as an integral outer-membrane protein that forms an SCF-FBXL4
        ubiquitin E3 ligase complex.
- term:
