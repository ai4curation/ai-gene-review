  evidence_type: NAS
  original_reference_id: PMID:33234069
  qualifier: involved_in
  review:
    summary: FBXL4 recruits substrates to an SCF ligase for proteasomal degradation.
    action: ACCEPT
    reason: The family review provides NAS context, and target-specific primary studies establish the role through
      SCF association, F-box perturbations, in-cell ubiquitination, receptor half-life/proteasome experiments and
      rescue. FBXL4 participates by substrate recognition and recruitment, while the assembled SCF/E2 machinery
      performs ubiquitin transfer. BNIP3 and BNIP3L/NIX turnover are distinct from the downstream lysosomal removal
