- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review:
    summary: >-
      UniProt subcellular-location mapping to nucleus. The UniProt "Nucleus" location for
      FBXL4 carries no experimental evidence code, and all mechanistic studies place FBXL4
      on the mitochondrial outer membrane via an N-terminal anchor.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      No functional or biochemical study supports a nuclear role. FBXL4 is targeted to mitochondria
      by its N-terminal transmembrane segment and arginine stretch, and its characterised
      activity (BNIP3/NIX degradation) occurs on the outer membrane.
    supported_by:
    - reference_id: PMID:36896912
      supporting_text: >-
        We determined that FBXL4 functions as an integral outer-membrane protein that forms
        an SCF-FBXL4 ubiquitin E3 ligase complex.
