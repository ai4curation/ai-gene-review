- term:
    id: GO:0005758
    label: mitochondrial intermembrane space
  evidence_type: IDA
  original_reference_id: PMID:23993194
  qualifier: located_in
  review:
    summary: >-
      IDA from Gai et al. (2013), the original disease-gene report, which concluded that FBXL4
      localises to the mitochondrial intermembrane space within a ~400 kDa complex. Later
      protease-protection and alkaline-extraction experiments by two independent groups showed
      FBXL4 is cleaved by protease in intact mitochondria, i.e. it is an outer-membrane protein
      exposed to the cytosol, not an intermembrane-space protein.
    action: REMOVE
    reason: >-
      The intermembrane-space assignment is directly contradicted by subsequent experiments:
      in intact mitochondria FBXL4 is protease-accessible like the cytosol-exposed outer-membrane
      protein Tom70, it behaves as an integral membrane protein on alkaline extraction, and
      residues 1-23 suffice for outer-membrane anchoring. Its function as an SCF substrate
      receptor also requires assembly with the cytosolic SKP1/CUL1 core, which is incompatible
      with an intermembrane-space location.
    supported_by:
    - reference_id: PMID:23993194
      supporting_text: >-
        We also demonstrate that FBXL4 is targeted to mitochondria and localizes in the intermembrane
        space, where it participates in an approximately 400 kDa protein complex.
    - reference_id: PMID:36896912
      supporting_text: was cleaved by Protease K digestion in intact mitochondria 
        preparation
    - reference_id: PMID:37161784
      supporting_text: localises to the mitochondrial outer membrane in unstressed cells
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8952618
  qualifier: located_in
  review:
    summary: >-
      Reactome TAS cytosol annotations derive from generic cullin-RING ligase (CRL1) neddylation/CAND1/COP9
      and SCF substrate-ubiquitination reactions in which all F-box proteins are placed in
      the cytosol. FBXL4 is not a soluble cytosolic F-box protein: it is anchored in the mitochondrial
      outer membrane with its domains facing the cytosol.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cytosol placement is a by-product of Reactome's generic CRL1 reaction set rather
      than evidence about FBXL4. FBXL4's location is the cytoplasmic face of the mitochondrial
      outer membrane (GO:0005741), which is already annotated.
    supported_by:
    - reference_id: PMID:36896912
      supporting_text: >-
        We determined that FBXL4 functions as an integral outer-membrane protein that forms
        an SCF-FBXL4 ubiquitin E3 ligase complex.
