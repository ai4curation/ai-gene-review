      and EV1 support U2OS target turnover, tagged localization, ubiquitination and complex association; endogenous
      FBXL4 was not detectable with available antibodies in this study. No original figure pixels, full Methods
      or supplements independently inspected. Abstract-only normal remains unchanged.'
