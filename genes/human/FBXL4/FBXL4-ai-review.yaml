    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The original full EPMC XML was recovered although the normal cache is abstract-only. Tagged FBXL4
      localization follows TOM20 rather than TIM50 under the mitochondrial-swelling assay. Target deletion/rescue,
      F-box dependence, receptor half-life and ubiquitination assays support the SCF substrate-recruitment/negative-mitophagy
      mechanism. BioID is proximity and co-IP is complex association, not automatically purified binary binding.
      Endogenous FBXL4 detection was limited by available antibodies; tagging and expression conditions remain explicit.
      Read indexed original8–22/24/26/27/29/31/33/35/36/38–42 and Methods47/49–51/53/55/56/64/66/67/69/71/75. No
