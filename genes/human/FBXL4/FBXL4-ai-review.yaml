  review:
    summary: >-
      NAS regulation of mitophagy from a review on mitochondrial fission and fusion, which
      describes FBXL4 as an intermembrane-space protein that may regulate fusion. The direction
      of regulation is now known: FBXL4 suppresses mitophagy.
