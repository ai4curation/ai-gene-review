    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8952618
  qualifier: located_in
  review:
    summary: The Reactome model includes FBXL4 in a cytosolic ubiquitin-ligase route, but the specific compartment
      remains unresolved.
    action: UNDECIDED
    reason: Actual source traversal confirms 8952618 -> output -> 8952593 -> hasComponent -> 8952588 -> hasComponent
      -> 976085 -> hasMember -> 8850899, ending at entity 8850899, Q9UKA2 residues 1–621, explicitly assigned to
      cytosol. The positive target membership is preserved; this is not a title-only or wrong-gene rejection. The
      event summation and target path describe a pathway model, not an inspected FBXL4-specific cytosolic localization
      experiment. Human primary localization supports mitochondrial FBXL4, including integral outer membrane in
      PMID:36896912, while PMID:23993194 did not detect a postmitochondrial cytosolic pool in its tested conditions.
      These observations do not exclude an additional conditional pool. Cytosol excludes organelles, and outer membrane
      is not its strict descendant, so replacing this source statement by outer membrane would change the asserted
      compartment. Retain source-specific uncertainty pending evidence for the modeled cytosolic pool; no biological
      negation or new compartment assertion is made.
    supported_by:
