core_functions:
- description: >-
    Substrate-recognition subunit of the mitochondrial outer membrane SCF-FBXL4 E3 ubiquitin ligase, which
    recruits the mitophagy receptors BNIP3 and BNIP3L/NIX (assisted by the PPTC7 adaptor) for constitutive
    ubiquitination and proteasomal degradation, thereby restraining basal mitophagy and maintaining mitochondrial
    mass.
  molecular_function:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
