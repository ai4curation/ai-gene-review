    summary: >-
      SCF-FBXL4 ubiquitinates the mitophagy receptors BNIP3 and NIX. As the substrate receptor
      that recruits the substrates to the ligase, FBXL4 performs the substrate-selection step
      of their ubiquitination, the standard role in which F-box substrate receptors are annotated
