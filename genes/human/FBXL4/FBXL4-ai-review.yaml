  - reference_id: PMID:36896912
    supporting_text: >-
      knockout of either Bnip3 or Nix rescues metabolic derangements and viability of the
      Fbxl4-/- mice.
suggested_questions:
- question: >-
    How is SCF-FBXL4 activity toward BNIP3 and NIX regulated under physiological mitophagy-inducing
    conditions (hypoxia, erythroid maturation, differentiation), and is FBXL4 itself inactivated
    or displaced to permit programmed mitophagy?
- question: >-
    Does FBXL4 have outer-membrane substrates beyond BNIP3, NIX and the PPTC7-bridged pool,
    and do any contribute to the mtDNA depletion phenotype independently of mitophagy?
- question: >-
    What is the basis of the earlier report of an intermembrane-space FBXL4 pool, and is there
    any FBXL4 outside the outer membrane (e.g. the nuclear speck staining reported by imaging
    atlases)?
suggested_experiments:
- description: >-
    Reconstitute SCF-FBXL4 ubiquitination of BNIP3 and NIX in vitro with purified components,
    with and without PPTC7, to define whether PPTC7 is required for substrate recognition
    and to map the degron(s) recognised by the FBXL4 LRR domain.
- description: >-
    Quantify mitophagy flux and mtDNA copy number in patient-variant knock-in iPSC-derived
    neurons with and without BNIP3/NIX depletion to test whether excessive mitophagy is sufficient
    to explain the neuronal phenotype.
