    id: GO:0001221
    label: transcription coregulator binding
  evidence_type: IDA
  original_reference_id: PMID:33227311
  qualifier: enables
  review:
    summary: KLF6 binds the transcription coregulator ZZEF1.
    action: NEW
    reason: ZZEF1 is a chromatin-associated transcriptional coregulator that physically interacts with KLF6 and
      promotes KLF6/KLF9-mediated gene regulation, supporting transcription-coregulator binding rather than the
      bare protein-binding umbrella term.
    supported_by:
    - reference_id: PMID:33227311
      supporting_text: ZZEF1 physically interacts with KLF9 and KLF6, and regulates a common set of target genes
        of these transcription factors
