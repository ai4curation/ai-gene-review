      activity. All 21 GO:0005515 rows on ADGRA2 come from assays of one element - the C-terminal class-I
      PDZ-binding motif ...LWKSETTV - against PDZ domains. Resolving every WITH/FROM accession from the
      GOA TSV gives 19 distinct partners, 19/19 reviewed Swiss-Prot at canonical length (no TrEMBL or
      ORFeome substitutions), and 18/19 carrying at least one annotated PDZ domain; the exception is Q12959-2,
      a genuine DLG1 splice isoform whose features are not returned per-isoform. GO:0030165 PDZ domain
      binding captures exactly what was measured and is honest about a motif whose binding is intrinsically
      promiscuous, whereas naming 19 individual partners as biological interactors would over-read a domain-affinity
      profile. Not promoted to a core function: the biochemistry is solid but the mammalian physiology
      is not. PMID:35649360 reports that mammalian GPR124 engages Frizzled through an ICD-independent
      modality, so the in vivo role of the conserved human ETTV motif and its PDZ partners is open.'
    proposed_replacement_terms:
    - id: GO:0030165
      label: PDZ domain binding
    supported_by:
    - reference_id: PMID:36115835
      supporting_text: Here, we measure the affinities of 65,000 interactions involving PDZ domains and
        their target PDZ-binding motifs (PBM) within a human interactome region particularly relevant
        for viral infection and cancer.
