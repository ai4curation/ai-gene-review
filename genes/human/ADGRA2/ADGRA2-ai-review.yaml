- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017981
  review:
    summary: Generic transmembrane-receptor term derived from the family-2 GPCR signature; defensible
      but not the characterised activity.
    action: KEEP_AS_NON_CORE
    reason: 'IPR017981 is a ''GPCR, family 2-like'' signature and ADGRA2 genuinely has that seven-transmembrane
      architecture, so unlike its child GO:0004930 this term makes no claim about G-protein coupling and
      is not refuted. It is not accepted either, for a reason worth stating explicitly: GO:0004888 requires
      the protein to combine with a signal and transmit it across the membrane, and ADGRA2 does not bind
      Wnt7 - RECK does. Whether ADGRA2 satisfies the definition therefore turns on whether the RECK-bound
      Wnt7 complex counts as ''the signal'' it combines with. That is a genuine ambiguity rather than
      a settled yes or no, and it is what KEEP_AS_NON_CORE is for. The informative molecular function,
      and the one that needs no such reading, is the adaptor activity proposed as a NEW row (GO:0030159).'
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: InterPro:IPR017981
        source_status: SUPPORTS_TRANSFER
        source_label: GPCR, family 2-like, 7TM
- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000832
  - InterPro:IPR001879
  - InterPro:IPR017983
  - InterPro:IPR036445
  review:
    summary: G protein-coupled receptor activity is asserted from structural signatures alone; ADGRA2
      has no known ligand and no measured G-protein coupling.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'GO:0004930 requires that the protein combine with an extracellular signal and promote GDP/GTP
      exchange on a heterotrimeric G-protein alpha subunit. None of the three requirements has been met
      for ADGRA2. It is an orphan: IUPHAR/GtoPdb target 198 returns no natural ligand and an empty interactions
      list, and records no transducer. No coupling assay has been reported for ADGRA2 itself - and this
      now rests on a published statement rather than on the absence of search hits: the 2025 study that
      did measure coupling in this clade says so directly, ''Whereas ADGRA2 has never been shown to couple
      to heterotrimeric G proteins, it has been extensively studied for its role in the assembly of a
      complex signalosome'' (PMID:40127866). ''GPR124 Stachel'' and ''GPR124 tethered agonist'' return
      zero PubMed records, an ADGRA2-specific negative. The single reported heterotrimeric-G-protein contact
      runs the opposite way to the definition: Gbeta-gamma binds the ADGRA2 C-tail and promotes assembly
      of a GPR124-Elmo complex. UniProt''s own FUNCTION block states that the characterised ADGRA2 tethering
      activity does not rely on its GPCR structure. PAINT agrees: across all three human ADGRA paralogs
      there is no molecular-function IBA at all. Marked over-annotated rather than removed, and the sibling
      paralogs are what make that the right call rather than a hedge. This clade demonstrably CAN couple:
      ADGRA3 shows low-level activation of Gi and Gs, more from its C-terminal fragment, abrogated when
      the first three residues of the stachel tethered agonist are removed (PMID:40127866), and ADGRA1
      activates several G proteins, notably G-alpha-13, on the full TRUPATH BRET2 panel (PMID:41961591).
      So a fold-based inference of coupling is not absurd for an ADGRA protein - it is simply unverified
      for this member, whose 7TM plus GAIN-B architecture is genuine and has never been assayed and failed.
      An unmeasured claim, not a refuted one. Naming the responsible signatures makes the defect specific
      rather than generic, and the authoritative interpro2go mapping shows InterPro curators already drew
      the distinction being argued for here. IPR017981 ''GPCR, family 2-like, 7TM'' is the entry that
      covers ADGRA2''s transmembrane bundle, and InterPro describes it as representing the transmembrane
      domain of family 2 GPCRs AND Frizzled proteins - Frizzleds being the textbook 7TM family whose principal
      signalling is not through heterotrimeric G proteins. Accordingly interpro2go maps IPR017981 only
      to the generic GO:0004888 and GO:0007166, never to GO:0004930 or GO:0007186, and that is exactly
      which terms ADGRA2 receives from it. The GPCR-activity claim comes instead from four secretin-receptor-specific
      entries: IPR000832 and IPR017983 (secretin-like family 2 and its conserved site) and IPR001879 with
      its superfamily IPR036445, which are not the GPS or GAIN entries but the family-2 extracellular
      HORMONE RECEPTOR domain - InterPro calls it ''the major ligand recognition domain'' and names calcitonin,
      corticotropin-releasing-factor 1, diuretic hormone, GLP-1 and parathyroid hormone receptors as its
      exemplars. So a peptide-hormone ligand-recognition signature, matched on ADGRA2''s GAIN/hormone-receptor
      module, is being converted into ''activates a G protein'' for a receptor that has no ligand at all.
      That is a sharper objection than a generic fold-to-activity complaint, and it is testable: the one
      signature InterPro2GO already restricts is the one whose membership includes non-coupling 7TMs.'
    supported_by:
    - reference_id: PMID:40127866
      supporting_text: Whereas ADGRA2 has never been shown to couple to heterotrimeric G proteins, it
        has been extensively studied for its role in the assembly of a complex signalosome
    - reference_id: PMID:40127866
      supporting_text: We found low-level activation of Gi and Gs by ADGRA3 and slightly more by its CTF.
    - reference_id: PMID:41961591
      supporting_text: ADGRA1 activates several G proteins, notably Gα13, an important signaling pathway
        for inhibitory synaptic function
    - reference_id: PMID:28600358
      supporting_text: However, the signaling properties of GPR124 remain poorly defined.
    - reference_id: PMID:28600358
      supporting_text: In addition, Gβγ interacts with the C-terminal tail of GPR124 and promotes the
        formation of a GPR124-Elmo complex.
    - reference_id: PMID:30026314
      supporting_text: Gpr124 and Reck enable brain endothelial cells to selectively respond to Wnt7.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - ROLE_CONFLATION
      source_entities:
      - source_id: InterPro:IPR000832
        source_status: SOURCE_BAD
        source_label: GPCR, family 2, secretin-like
        comment: Structural signature. Valid as a domain call; the defect is the InterPro2GO mapping of
          a fold to a catalytic/transducer activity.
      - source_id: InterPro:IPR001879
        source_status: SOURCE_BAD
        source_label: GPCR, family 2, extracellular hormone receptor domain
        comment: Structural signature. Valid as a domain call; the defect is the InterPro2GO mapping of
          a fold to a catalytic/transducer activity.
      - source_id: InterPro:IPR017983
        source_status: SOURCE_BAD
        source_label: GPCR, family 2, secretin-like, conserved site
        comment: Structural signature. Valid as a domain call; the defect is the InterPro2GO mapping of
          a fold to a catalytic/transducer activity.
      - source_id: InterPro:IPR036445
        source_status: SOURCE_BAD
        source_label: GPCR family 2, extracellular hormone receptor domain superfamily
        comment: Structural signature. Valid as a domain call; the defect is the InterPro2GO mapping of
          a fold to a catalytic/transducer activity.
