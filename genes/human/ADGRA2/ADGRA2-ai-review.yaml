- term:
    id: GO:0050920
    label: regulation of chemotaxis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q91ZV8
  - ensembl:ENSMUSP00000033876
  review:
    summary: Compara transfer from mouse Adgra2 (IMP PMID:21071672); a peripheral description of the endothelial
      guidance defect.
    action: KEEP_AS_NON_CORE
    reason: The underlying mouse phenotype is directional endothelial migration into the neuroepithelium.
      'Regulation of chemotaxis' is a defensible but oblique way to describe it, and no chemoattractant
      for ADGRA2 has been identified - the receptor is an orphan. Kept rather than removed because the
      donor annotation is a curator's experimental call, but it should not be read as evidence that ADGRA2
      responds to a chemotactic ligand.
