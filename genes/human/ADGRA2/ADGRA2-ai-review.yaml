- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: TAS
  original_reference_id: PMID:15203201
  qualifier: enables
  review:
    summary: TAS to a repertoire-cataloguing paper that cannot supply a gene-specific author statement
      about ADGRA2's activity; the same reference gives 27 human entities the same generic triple, two
      of them pseudogenes.
    action: REMOVE
    reason: 'GO:0004930 requires that the protein combine with an extracellular signal and promote GDP/GTP
      exchange on a heterotrimeric G-protein alpha subunit. None of the three requirements has been met
      for ADGRA2. It is an orphan: IUPHAR/GtoPdb target 198 returns no natural ligand and an empty interactions
      list, and records no transducer. No coupling assay has been reported for ADGRA2 itself - and this
      now rests on a published statement rather than on the absence of search hits: the 2025 study that
      did measure coupling in this clade says so directly, ''Whereas ADGRA2 has never been shown to couple
      to heterotrimeric G proteins, it has been extensively studied for its role in the assembly of a
      complex signalosome'' (PMID:40127866). ''GPR124 Stachel'' and ''GPR124 tethered agonist'' return
      zero PubMed records, an ADGRA2-specific negative. The single reported heterotrimeric-G-protein contact
      runs the opposite way to the definition: Gbeta-gamma binds the ADGRA2 C-tail and promotes assembly
      of a GPR124-Elmo complex. UniProt''s own FUNCTION block states that the characterised ADGRA2 tethering
      activity does not rely on its GPCR structure. PAINT agrees: across all three human ADGRA paralogs
      there is no molecular-function IBA at all. The cited reference is a genome-mining and phylogenetics
      survey. Its abstract describes genome-database searching, phylogenetic analysis and EST expression
      charting and reports no functional assay on any receptor; the paper is abstract-only in the cache,
      so nothing here rests on a claim about its full text. Querying QuickGO by reference rather than
      by gene (?reference=PMID:15203201, fully paginated, 78 of 78 rows read) returns 78 annotations over
      27 distinct human entities, 100% TAS and 100% assignedBy GDB, carrying one identical generic triple:
      GO:0016020 to 27 entities, GO:0007186 to 26 and GO:0004930 to 25. The two entities that miss GO:0004930
      are ADGRG3 and ADGRV1, both protein-coding, so the pseudogene recipients ADGRE4P and ADGRF2P are
      confirmed to be among the 25 that DO receive the molecular function - checked by name rather than
      inferred from the 25-of-27 count, which on its own is equally consistent with the pseudogenes being
      the two that missed it. One reference giving 27 entities the same triple with identical evidence
      is a bulk classification import, not 27 traceable author statements. The whole argument is a statement
      about the DISTRIBUTION of annotations and needs no access to the full text: a paper cannot make
      25 gene-specific author statements about G-protein coupling, two of them about pseudogenes, as a
      by-product of cataloguing a repertoire. Reproducible via ADGRA2-bioinformatics/projection_test.py
      -> projection_test.json. Action calibrated deliberately against the InterPro2GO rows carrying the
      same term, because the two routes fail differently. The InterPro rows rest on a signature that genuinely
      matches ADGRA2, so the inference has a real if over-extended basis and is marked over-annotated.
      This row rests on an evidence code that asserts a traceable author statement about ADGRA2, and the
      reference cannot supply one. The distribution analysis above is what establishes that, and it needs
      no access to the full text. That is a defect in the annotation regardless of whether the underlying
      claim might one day be demonstrated, which is why REMOVE here is not in tension with the finding
      that the claim itself is unmeasured rather than refuted: the InterPro rows remain, so removing this
      one does not erase the claim from GOA. Removing two rows on this gene is also complementary to,
      not a substitute for, the suggested_questions item asking GO whether the whole 78-annotation GDB
      block across 27 entities should be retired - that is a consortium-level decision, this is the gene-level
      one a gene review exists to make. For symmetry, note what is NOT removed: the GO:0016020 TAS row
      from this same GDB block carries the identical evidentiary defect and would be a legitimate REMOVE
      on the same reasoning. It is kept because removing it would achieve nothing - membrane localisation
      is directly demonstrated for ADGRA2 elsewhere in this very GOA record, by three EXP rows, an IDA
      and an IBA to the child term GO:0005886 - so that row is redundant rather than misleading. Its shared
      defect is recorded in its own review and in the block-level suggested_questions item rather than
      acted on by deleting a redundantly-supported true statement. Cross-review consistency, stated explicitly
      because the sibling review reaches the opposite action on the identical row. ADGRA3 (merged) ACCEPTs
      both PMID:15203201 TAS rows - ''right conclusion, weak provenance - kept because the conclusion
      has since been earned'' - and recommends GOA re-evidence them against PMID:40127866. That is not
      an inconsistency with this REMOVE; both follow one rule: a defective TAS row is kept where the claim
      it makes is independently established for that gene, and removed where nothing else on the gene
      carries it. For ADGRA3 the claim was earned by a direct Gi/Gs coupling measurement. For ADGRA2 it
      was not, and the same paper says so. The rule is visible inside this review too, which is the check
      that it is a rule and not a rationalisation: the GO:0016020 TAS row from this very block is kept
      on exactly ADGRA3''s logic, because plasma-membrane localisation IS independently demonstrated for
      ADGRA2. Flagged here rather than left for someone to notice later, per the AADACL2/3/4 precedent
      where three reviews gave one row three answers and nobody reconciled them.'
    supported_by:
    - reference_id: PMID:15203201
      supporting_text: Here, 2 new human adhesion-GPCRs, termed GPR133 and GPR144, have been found by
        searches done in the human genome databases.
    - reference_id: PMID:15203201
      supporting_text: EST expression charts for the entire repertoire of adhesion-GPCRs in human and
        mouse were established.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - SOURCE_MISCITATION
      - ROLE_CONFLATION
      source_entities:
      - source_id: PMID:15203201
        source_label: Bjarnadottir et al. 2004, adhesion-GPCR repertoire survey
        source_status: SOURCE_BAD
        comment: 78 TAS annotations over 27 human entities, all assignedBy GDB, all three terms generic;
          includes the pseudogenes ADGRE4P and ADGRF2P. A bulk classification import, not a traceable
          author statement about this gene.
