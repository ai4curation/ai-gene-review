    label: Wnt signalosome
- description: 'Shed-ectodomain adhesion ligand. Proteolytic release of the ADGRA2 ectodomain - by MMP9
    or MMP1, or by thrombin with cell-surface protein disulfide-isomerase - and further processing exposes
    a cryptic RGD motif that binds integrin alpha-V/beta-3 directly. The same fragment binds heparin,
    heparan sulfate, chondroitin sulfate and dermatan sulfate, so it bridges the integrin to matrix glycosaminoglycans
    and supports survival of growth-factor-deprived endothelial cells. This is a property of the released
    fragment, not of the intact receptor. It rests on a single laboratory: PMID:16982628, PMID:22013897
    and PMID:19853600 are all from the Essler group, so the independent-replication count for this arm
    is one, not three, and no other group has reported the RGD-integrin interaction. That is why it is
    listed second, and why the molecular functions it motivates are proposed as NEW rows rather than folded
    into the primary core function.'
  supported_by:
  - reference_id: PMID:16982628
    supporting_text: Matrix metalloprotease 9-processed, but not full-length, sTEM5 mediated endothelial
      cell adhesion by direct interaction with integrin alpha(v)beta3.
  - reference_id: PMID:16982628
    supporting_text: We found that sTEM5 binds to several glycosaminoglycans.
  - reference_id: PMID:16982628
    supporting_text: Adhesion to proteolytically processed sTEM5 (ppsTEM5) or glycosaminoglycan-bound
      ppsTEM5 promoted survival of growth factor deprived endothelial cells.
  molecular_function:
    id: GO:0005178
    label: integrin binding
  locations:
  - id: GO:0005886
    label: plasma membrane
knowledge_gaps:
- gap_statement: 'No agonist and no transducer are known for ADGRA2: neither a ligand that binds the receptor
    itself nor any coupling to a heterotrimeric G protein has been demonstrated, so it is unknown whether
    the intact seven-transmembrane bundle signals at all.'
  boundary: 'Firmly established: the seven-transmembrane bundle, the GAIN-B domain and the GPS region
    are all present and intact; the receptor is at the plasma membrane; and its Wnt7 co-activator function
    is explicitly independent of the GPCR structure. So the fold is real and one function is known - what
    is missing is whether the fold does anything of its own.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: 'This gap is why three of ADGRA2''s four GOA molecular-function and GPCR-pathway rows
    are unsupported. Filling it either way would settle them: a coupling profile would justify GO:0004930,
    and a documented failure to couple would justify removing it and would be a notable result for a receptor
    already in preclinical development as a blood-brain-barrier target.'
  resolution: A standard adhesion-GPCR transducer panel (BRET or TRUPATH across Gs, Gi/o, Gq/11 and G12/13,
    plus beta-arrestin recruitment) on full-length ADGRA2 and on a constitutively active construct, with
    an ADGRL3 or GPR97 positive control. IUPHAR/GtoPdb currently has no transducer entry for target 198,
    and no such panel exists for any ADGRA-family member.
- gap_statement: It is unknown whether ADGRA2's GAIN-B/GPS region undergoes the autoproteolysis that defines
    adhesion GPCRs, and whether a tethered-agonist (Stachel) sequence is generated and used.
  boundary: 'Established: the GAIN-B domain (594-759) and GPS region (710-759) are annotated in UniProt,
    and the receptor is definitely cleaved - but at sites 5 and 34 residues downstream of the RGD motif
    at 362-364, by thrombin and MMPs, far N-terminal of the GAIN domain, yielding N60 and C50 fragments
    held together by disulfide bonds. That is protease-mediated ectodomain shedding, a different event
    from GPS autoproteolysis.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: If ADGRA2 does not autoproteolyse or has no functional Stachel, then the adhesion-GPCR
    activation paradigm does not apply to it, and the GPCR-flavoured annotations are wrong in mechanism
    as well as unsupported in evidence. If it does, the receptor has an activation mode nobody has looked
    for.
  resolution: Test GPS cleavage of full-length human ADGRA2 by mobility shift and N-terminal sequencing
    of the C-terminal fragment, and test synthetic Stachel peptides for agonism. PubMed searches for 'GPR124
    Stachel' and 'adhesion GPCR GPR124 tethered agonist' each return zero records, so this is unexamined
    rather than examined-and-negative.
- gap_statement: 'The physiological role of the human ADGRA2 intracellular domain is unresolved: its class-I
    PDZ-binding motif (...LWKSETTV) binds at least 19 PDZ proteins in quantitative assays, yet the mammalian
    receptor appears not to need its intracellular domain for the Frizzled interaction.'
  boundary: 'Established on both sides: the motif is conserved and its binding is real and quantitatively
    measured against the human PDZ-domain repertoire by two independent methods; and in zebrafish the
    equivalent ETTV motif recruits Dlg4 and Magi3 as part of a working mechanism. What is not established
    is which, if any, of the mammalian PDZ interactions is used in vivo.'
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: This determines whether GO:0030165 PDZ domain binding should ever become a core function
    for ADGRA2, and whether any individual partner deserves its own annotation. Treating a promiscuous
    motif profile as 19 biological interactions is the standard way this gets over-annotated.
  resolution: Knock-in of a PDZ-motif-disrupting mutation (for example deletion of the terminal Val) at
    the endogenous mouse or human locus, assayed for Wnt7 reporter activity, barrier formation and CNS
    vessel morphology, with the individual candidate partners tested by acute depletion in the same system.
suggested_questions:
- question: Should GO retire the GDB TAS block derived from PMID:15203201? The reference is a genome-mining
    and phylogenetics survey with no functional assay, yet it supplies 78 TAS annotations across 27 human
    adhesion-GPCR entities - GO:0016020 to 27, GO:0007186 to 26 and GO:0004930 to 25 - including the pseudogenes
    ADGRE4P and ADGRF2P, which should not carry a molecular function. This is a bulk classification import
    wearing a traceable-author-statement label, and it is the reason the GPCR-activity claim survives
    on ADGRA2 despite the retirement of Swiss-Prot-keyword annotations from GOA. Raising it once here
    for the whole affected set rather than per gene.
  experts:
  - GO Consortium curators
  - UniProt/GOA
- question: Should InterPro2GO map the adhesion-GPCR structural signatures (IPR000832, IPR001879, IPR017983,
    IPR036445) to GO:0004930 and GO:0007186? These are fold and domain signatures; the adhesion-GPCR family
    includes members with no demonstrated G-protein coupling, and for the ADGRA clade specifically PAINT
    curators declined both terms, giving the family only the parent GO:0007166 and no molecular function
    at all. PAINT and InterPro2GO currently give contradictory answers on the same three genes.
  experts:
  - InterPro
  - GO Consortium curators
- question: 'UniProt correction request for Q96PE1: the entry carries KW ''G protein-coupled receptor'',
    KW ''Receptor'' and KW ''Transducer'' in the same record whose FUNCTION block states that the ADGRA2
    tethering function does not rely on its G protein-coupled receptor structure. GOA no longer imports
    Swiss-Prot keywords, so the contradiction is now invisible from GO and lives only upstream. Should
    the transducer keyword be qualified for orphan adhesion GPCRs with no measured coupling?'
  experts:
  - UniProt curators
- question: 'UniProt correction request for Q96PE1: the FUNCTION block attributes the Dishevelled-recruitment
    step to human ADGRA2 citing PubMed:30026314, whose central genetics is zebrafish. PMID:35649360, from
    the same laboratory, reports that mammalian Gpr124 engages Frizzled through an ICD-independent mechanism
    governed by transmembrane and extracellular determinants. Should the FUNCTION text distinguish the
    zebrafish mechanism from the mammalian one?'
  experts:
  - UniProt curators
- question: 'GOA/UniProt inconsistency for Q96PE1: the UniProt entry''s DR GO block lists ''GO:0009986;
    C:cell surface; IEA:Ensembl'' but no GO:0009986 annotation exists in GOA for this protein, while the
    mouse ortholog holds it by IDA (PMID:21421844). Which record is stale?'
  experts:
  - UniProt curators
  - GOA
- question: Would GO consider adding an annotation extension or a more specific child for the shed-ectodomain
    activities? ADGRA2's integrin and glycosaminoglycan binding are properties of a proteolytically released,
    further-processed fragment, not of the intact receptor, and a plain enables GO:0005178 row does not
    carry that distinction.
  experts:
  - GO Consortium curators
suggested_experiments:
- hypothesis: ADGRA2 does not couple to any heterotrimeric G protein and is not activated by a tethered
    agonist, so its adhesion-GPCR architecture is used for ligand presentation rather than for canonical
    transduction.
  description: Run a full transducer panel (BRET or TRUPATH across Gs, Gi/o, Gq/11, G12/13, plus beta-arrestin
    recruitment) on full-length human ADGRA2, on a GPS-truncated constitutively active construct, and
    on synthetic Stachel peptides, with ADGRL3 and GPR97 as positive controls and an empty vector as negative.
    A clean negative across the panel would be publishable as such and would settle four GOA rows.
  experiment_type: cell-based signalling assay
- hypothesis: The human ADGRA2 PDZ-binding motif is dispensable for Wnt7 co-activation and blood-brain-barrier
    formation, as the ICD-independent mammalian mechanism predicts.
  description: Introduce a terminal-valine deletion or ETTV-to-ETTA substitution at the endogenous locus
    in human brain endothelial cells and in mouse, and assay Wnt7 reporter activity, RECK and Frizzled
    co-immunoprecipitation, barrier integrity and CNS vessel morphology. Compare against full ICD deletion.
  experiment_type: genome editing plus functional assay
- hypothesis: Ectodomain shedding switches ADGRA2 between a Wnt7 co-receptor and an integrin ligand, so
    the two core functions are mutually exclusive states of the same molecule.
  description: Use a non-cleavable ADGRA2 mutant (thrombin and MMP site substitutions) and a shedding-mimetic
    construct to test, in the same endothelial cells, whether blocking shedding enhances Wnt7 signalling
    while abolishing alpha-V/beta-3 dependent survival, and whether forcing shedding does the reverse.
  experiment_type: structure-function analysis
- hypothesis: ADGRA2 binds RECK through a defined extracellular surface that can be targeted pharmacologically.
  description: Map the ADGRA2-RECK interface by hydrogen-deuterium exchange mass spectrometry and cryo-EM
    of the reconstituted RECK-ADGRA2 ectodomain complex, then test whether the leucine-rich repeats, which
    UniProt records as important for potentiation of Wnt7 signalling, form the contact.
  experiment_type: structural biology
