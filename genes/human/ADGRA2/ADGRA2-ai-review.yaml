status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ADGRA2 (also known as GPR124 and tumour endothelial marker 5) is an endothelial cell-surface
  receptor of the adhesion G protein-coupled receptor family. Its extracellular region carries leucine-rich
  repeats, an immunoglobulin-like domain and a GAIN-B domain with a GPS region, followed by a seven-transmembrane
  bundle and a long cytoplasmic tail ending in a class-I PDZ-binding motif. Despite the receptor architecture,
  ADGRA2 has no identified agonist and no demonstrated coupling to heterotrimeric G proteins; its established
  activity is instead to act as a co-receptor that confers Wnt7 ligand selectivity on brain endothelium.
  Together with the GPI-anchored protein RECK, which binds WNT7A and WNT7B directly, ADGRA2 assembles
  a higher-order RECK-ADGRA2-Frizzled-LRP5/6 signalosome that concentrates Wnt7 for Frizzled and so amplifies
  canonical Wnt/beta-catenin signalling. Through this route ADGRA2 is required in endothelial cells for
  sprouting angiogenesis into the developing forebrain and spinal cord and for establishment of the blood-brain
  barrier; loss of the mouse gene causes embryonic haemorrhage, glomeruloid vascular malformations, loss
  of barrier properties and failure of cortical expansion. A second activity resides in the ectodomain,
  which is shed by matrix metalloproteinases and by thrombin in a cell-surface protein disulfide-isomerase
  dependent manner; processing exposes a cryptic RGD motif that binds integrin alpha-V/beta-3, and the
  shed fragment also binds heparin, heparan sulfate, chondroitin sulfate and dermatan sulfate, bridging
  the integrin to matrix glycosaminoglycans and supporting survival of growth-factor-deprived endothelial
  cells. ADGRA2 also localises to filopodia and lamellipodia and promotes Rac and Cdc42 activation through
  the Rho guanine nucleotide exchange factors Elmo/Dock and intersectin-1.
