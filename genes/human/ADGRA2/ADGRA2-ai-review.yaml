core_functions:
- description: Wnt7-selective co-receptor and signalosome adaptor. ADGRA2 does not bind Wnt7 itself; RECK
    does. ADGRA2 binds RECK through its extracellular region and provides the physical support that assembles
    a higher-order RECK-ADGRA2-Frizzled-LRP5/6 complex, raising the local concentration of Wnt7 available
    to Frizzled and so amplifying canonical Wnt/beta-catenin signalling specifically in brain endothelium.
    This activity is what makes ADGRA2 required for sprouting angiogenesis into the CNS and for establishment
    of the blood-brain barrier. It is explicitly independent of the receptor's GPCR machinery.
  supported_by:
  - reference_id: PMID:30026314
    supporting_text: Gpr124 and Reck enable brain endothelial cells to selectively respond to Wnt7.
  - reference_id: PMID:30026314
    supporting_text: Through polymerization, Dishevelled recruits Gpr124 and the associated Reck-bound
      Wnt7 into dynamic Wnt/Frizzled/Lrp5/6 signalosomes, resulting in increased local concentrations
      of Wnt7 available for Frizzled signaling.
  - reference_id: PMID:28289266
    supporting_text: WNT1- and WNT7B-mediated synergistic Wnt signaling requires FZD5, FZD8 and LRP6,
      as well as the WNT7B co-receptors GPR124 (also known as ADGRA2) and RECK.
  - reference_id: PMID:21421844
    supporting_text: Expression of GPR124 was found to be required for invasion and migration of blood
      vessels into neuroepithelium, establishment of BBB properties, and expansion of the cerebral cortex.
  molecular_function:
    id: GO:0030159
    label: signaling receptor complex adaptor activity
  directly_involved_in:
