- term:
    id: GO:0030159
    label: signaling receptor complex adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:30026314
  qualifier: enables
  review:
    summary: ADGRA2 has no informative molecular-function annotation; this is the activity the Wnt7 literature
      actually establishes.
    action: NEW
    reason: 'ADGRA2''s GOA molecular functions are bare protein binding plus two unsupported GPCR terms,
      so the gene''s characterised activity is unrepresented. GO:0030159 is defined as ''the binding activity
      of a molecule that provides a physical support for the assembly of a multiprotein receptor signaling
      complex'', which is precisely what ADGRA2 does: ADGRA2 is a Wnt7-specific co-activator: RECK captures
      WNT7A/WNT7B and ADGRA2 makes the RECK-bound ligand available to Frizzled by nucleating a higher-order
      RECK-ADGRA2-FZD-LRP5/6 signalosome. UniProt states the same, and adds that the activity does not
      depend on the GPCR structure but on binding RECK extracellularly and Dishevelled intracellularly.
      The term is already used this way for co-receptors and receptor scaffolds - human CD19, a B-cell
      co-receptor, holds it by EXP, and CDH5, LAT, IRS1 and MAGI2 hold it too. On species scope: the suggested_questions
      item about PMID:30026314 concerns WHICH DOMAIN mediates the interaction, not whether ADGRA2 performs
      the adaptor role, and the two must not be conflated - PMID:35649360 contrasts zebrafish, mouse and
      human Gpr124 explicitly and concludes the mammalian receptors use an alternative intracellular-domain-independent
      modality, which relocates the mechanism rather than withdrawing the function. The row is additionally
      supported by PMID:28289266, an independent group; its abstract reports the effect ''in multiple
      cell types'' without naming them. What cannot be stated from the cached records is the cell type
      or species used for the signalosome imaging in PMID:30026314, because that paper and PMID:28289266
      are both abstract-only here and neither abstract names it; that is recorded as unverified rather
      than assumed.'
    supported_by:
    - reference_id: PMID:30026314
      supporting_text: Through polymerization, Dishevelled recruits Gpr124 and the associated Reck-bound
        Wnt7 into dynamic Wnt/Frizzled/Lrp5/6 signalosomes, resulting in increased local concentrations
        of Wnt7 available for Frizzled signaling.
    - reference_id: PMID:28289266
      supporting_text: WNT1- and WNT7B-mediated synergistic Wnt signaling requires FZD5, FZD8 and LRP6,
        as well as the WNT7B co-receptors GPR124 (also known as ADGRA2) and RECK.
- term:
    id: GO:0005178
    label: integrin binding
  evidence_type: IPI
  original_reference_id: PMID:16982628
  qualifier: enables
  supporting_entities:
  - UniProtKB:P06756
  - UniProtKB:P05106
  review:
    summary: A direct, human, experimentally-demonstrated interaction that UniProt records and GO does
      not have at all.
    action: NEW
    reason: The ADGRA2 ectodomain is shed and, after further proteolytic processing, its cryptic RGD motif
      (UniProt FT MOTIF 362..364) engages integrin alpha-V/beta-3 directly. UniProt records this in both
      SUBUNIT ('The cleaved extracellular subunit interacts with the integrin heterodimer ITGAV:ITGB3')
      and DOMAIN ('The RGD motif is involved in integrin ITGAV:ITGB3 binding'), both tagged ECO:0000269|PubMed:16982628.
      No GO:0005178 row exists on ADGRA2. The interaction requires prior shedding and processing, which
      should be recorded in the annotation extension or comment rather than being read as a property of
      the intact receptor.
    supported_by:
    - reference_id: PMID:16982628
      supporting_text: Matrix metalloprotease 9-processed, but not full-length, sTEM5 mediated endothelial
        cell adhesion by direct interaction with integrin alpha(v)beta3.
    - reference_id: PMID:22013897
      supporting_text: Binding of N60 to RGD-dependent integrins may modulate cellular functions such
        as adhesion and migration during angiogenesis.
- term:
    id: GO:0005539
    label: glycosaminoglycan binding
  evidence_type: IDA
  original_reference_id: PMID:16982628
  qualifier: enables
  review:
    summary: The shed ectodomain binds several glycosaminoglycans; UniProt records it and GO has no corresponding
      row.
    action: NEW
    reason: UniProt's FUNCTION block states that ADGRA2 'Binds to the glycosaminoglycans heparin, heparin
      sulfate, chondroitin sulfate and dermatan sulfate (PubMed:16982628)'. GO:0005539 glycosaminoglycan
      binding, rather than the narrower GO:0008201 heparin binding, is the correct term because all four
      classes were bound - choosing heparin alone would assert a specificity the data do not show. Together
      with the integrin interaction this is the bridging activity named in the source paper's own title.
