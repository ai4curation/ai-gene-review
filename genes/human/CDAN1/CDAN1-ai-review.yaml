- term: &id005
    id: GO:0044692
    label: exoribonuclease activator activity
  evidence_type: IDA
  original_reference_id: PMID:42393042
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9Y2V0
  review:
    summary: Codanin-1 directly stimulates CDIN1 RNA exonuclease activity in purified assays.
    action: NEW
    reason: The CDAN1 C-terminal fragment (residues 866–1227) binds CDIN1 and enhances RNA cleavage relative
      to CDIN1 alone, broadening substrate use and product formation. Codanin-1 alone is inactive, and
      catalytic CDIN1 substitutions abolish cleavage. The experimentally demonstrated role is exoribonuclease
      activation, not intrinsic nuclease catalysis. The purified in vitro assay used bacterially expressed
      proteins, including a stabilized CDIN1 W237R/C223S/V18M background; activity of an unmodified full-length
      endogenous complex and its physiological RNA substrates remain to be established. This distinct
      directly assayed MF is absent from the seed and is not an ancestor or descendant of the proposed
      sequestering activity. No new RNA-processing BP is inferred.
    supported_by:
    - reference_id: PMID:42393042
      supporting_text: The addition of the C-terminal fragment of Codanin-1 dramatically enhances and
        modulates the nuclease activity of CDIN1 on both substrates.
