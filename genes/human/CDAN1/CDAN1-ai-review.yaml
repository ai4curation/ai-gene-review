    summary: Nuclear localization does not resolve the stronger is_active_in assertion.
    action: UNDECIDED
    reason: The IBA source qualifier asserts activity in the nucleus, not merely presence there. The 2012
      paper reports a less abundant nuclear ASF1–Codanin-1 complex, but leaves its relationship to heterochromatin
