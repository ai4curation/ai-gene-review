    supporting_text: CODANIN-1 sequesters ASF1A and prevents the formation of a complex with histones
      H3–H4.
  - reference_id: PMID:40091041
- description: Acts as a noncatalytic activator of the CDIN1 RNA exonuclease. The C-terminal Codanin-1
    fragment increases cleavage by purified stabilized CDIN1; the physiological substrates and activity
    of the unmodified full-length native complex remain unresolved.
  molecular_function: *id005
  supported_by:
  - reference_id: PMID:42393042
  knowledge_gaps:
  - gap_statement: Whether the exoribonuclease stimulation demonstrated with a Codanin-1 C-terminal fragment
      and stabilized CDIN1 is reproduced by unmodified full-length native complexes, and which endogenous
      RNAs this activity processes, remain unresolved.
    boundary: Direct binding and enhanced RNA cleavage are established for Codanin-1 residues 866–1227
      combined with CDIN1 carrying W237R/C223S/V18M. Endogenous complex formation is established in human
      erythroid cells, but that interaction evidence does not itself identify a physiological RNA substrate
      or establish the activity of the full-length native complex.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: This separates an experimentally supported molecular activity from its as-yet unestablished
      physiological role in erythroblast chromatin maintenance.
    resolution: Reconstitute unmodified full-length CDAN1–CDIN1, compare it with the published constructs,
      and combine endogenous RNA-substrate capture with selective cellular perturbation and rescue.
    provenance:
    - reference_id: PMID:42393042
suggested_questions:
- question: Which endogenous RNA substrates are processed by the CDIN1–Codanin-1 complex, and how is this
    activity coordinated with ASF1 sequestration during erythroblast maturation?
suggested_experiments:
- description: Compare matched purified full-length Codanin-1 and its C-terminal fragment with unmodified
    versus stabilized CDIN1, using catalytic-mutant controls and RNA substrates recovered from endogenous
    erythroid complexes.
  experiment_type: Biochemical reconstitution with endogenous substrate identification
