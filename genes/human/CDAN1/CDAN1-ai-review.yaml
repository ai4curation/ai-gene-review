      than demonstrated by a nuclear activity assay. The 2025 endogenous experiments establish a predominantly
      cytosolic complex in their cell system. Retain the original PAINT node and source fields, but leave
      nuclear molecular activity undecided. This does not reject independently observed nuclear localization,
      and target self-evidence in the IBA donor list is not circular.
