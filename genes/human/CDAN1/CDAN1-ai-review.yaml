gene_symbol: CDAN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Codanin-1 is an intracellular regulator of histone-chaperone availability. It binds ASF1A
  and ASF1B through multiple interaction elements, including histone-mimicking helices, and sequesters
  them away from histones and downstream partners. Its predominant cytosolic activity limits ASF1 access
  to the nucleus and thereby regulates histone supply for chromatin assembly. Codanin-1 also binds and
  stabilizes CDIN1; its C-terminal region stimulates CDIN1 RNA exonuclease activity in purified assays.
  The physiological RNA substrates and the relationship between these activities remain unresolved. Biallelic
  CDAN1 variants cause congenital dyserythropoietic anemia type I with abnormal erythroblast chromatin.
