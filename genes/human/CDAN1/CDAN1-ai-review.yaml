  review:
    summary: Codanin-1 binds and sequesters ASF1B.
    action: MODIFY
    reason: The original study demonstrates direct binding to both ASF1 paralogs using recombinant pull-downs
      and cellular coimmunoprecipitation. Binding-site mutations and cellular relocalization establish
      a regulatory interaction, while subsequent structures and mutagenesis show occupation of histone
      and downstream-chaperone interfaces. Protein sequestering activity describes the demonstrated mechanism
      more precisely than generic binding. ASF1A and ASF1B differ in their dependence on individual Codanin-1
      interaction elements; binding does not make Codanin-1 a histone chaperone.
