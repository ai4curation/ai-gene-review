  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00029034
  review:
    summary: Lysosomal lumen localization (ARBA rule; Reactome HS-GAG lysosomal degradation reactions).
    action: KEEP_AS_NON_CORE
    reason: GPC3 bound to hedgehog is internalized and the complex is degraded in lysosomes (mouse data,
