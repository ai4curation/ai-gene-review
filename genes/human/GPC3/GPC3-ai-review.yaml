- term:
    id: GO:0016477
    label: cell migration
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0041604
  - FB:FBgn0263930
  - PANTHER:PTN002247069
  - UniProtKB:Q9Y625
  - WB:WBGene00001687
  - ZFIN:ZDB-GENE-011119-1
  - ZFIN:ZDB-GENE-031212-1
  review:
    summary: 'IBA (PTN002247069, deep bilaterian node; seeds fly dally/dlp, human GPC6, worm, zebrafish
      knypek/gpc4): cell migration.'
    action: KEEP_AS_NON_CORE
    reason: Glypicans across Bilateria modulate cell migration by shaping Wnt/PCP, FGF and other ligand
      gradients, and GPC3 sits inside the clade below this node with no evidence of loss. For GPC3 the
      relevant evidence is regulatory (zebrafish gastrulation movements depend on processed GPC3 acting
      through Wnt signalling), so the term is kept but as non-core relative to the signalling-modulator
      activity.
    supported_by:
    - reference_id: PMID:14610063
      supporting_text: only a form of GPC3 that can be processed by a convertase is able to rescue epiboly
        and convergence/extension movements in GPC3 morphant embryos
- term:
    id: GO:0031012
    label: extracellular matrix
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR001863
  review:
    summary: 'IEA (InterPro glypican IPR001863): extracellular matrix.'
    action: MARK_AS_OVER_ANNOTATED
    reason: GPC3 is a GPI-anchored cell-surface proteoglycan; a shed form is soluble in body fluids. There
      is no evidence that GPC3 is a structural or resident ECM component. The InterPro2GO mapping generalises
      from HSPGs as a class; extracellular region (accepted as non-core) and plasma membrane describe
      GPC3 better.
    supported_by:
    - reference_id: PMID:14610063
      supporting_text: Both GPC3 and GPC3/AQYA accumulated at the cell surface
    - reference_id: file:human/GPC3/GPC3-uniprot.txt
      supporting_text: Lipid-anchor, GPI-anchor {ECO:0000250|UniProtKB:P13265}; Extracellular
- term:
    id: GO:0042074
    label: cell migration involved in gastrulation
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6V9Y8
  review:
    summary: 'ISS from zebrafish gpc3 (Q6V9Y8): cell migration involved in gastrulation, based on morphant
      epiboly and convergent-extension defects.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The underlying zebrafish evidence is a morpholino knockdown with rescue; it shows GPC3 is
      required for normal gastrulation movements, not that GPC3 performs cell migration. The mechanistic
      contribution is modulation of Wnt signalling, captured by the Wnt regulation terms. No human data
      address gastrulation.
    supported_by:
    - reference_id: PMID:14610063
      supporting_text: This processing is essential for GPC3 modulating Wnt signaling and cell survival
        in vitro and for supporting embryonic cell movements in zebrafish.
- term:
