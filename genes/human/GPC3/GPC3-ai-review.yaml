id: P51654
gene_symbol: GPC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Glypican-3 (GPC3) is a heparan sulfate proteoglycan of the glypican family, attached by
  a C-terminal GPI anchor to the extracellular face of the plasma membrane. The core protein is cleaved
  in the secretory pathway by a furin-like proprotein convertase into alpha and beta subunits that remain
  disulfide-linked, and can be released from the surface by a second cleavage. GPC3 acts as a cell-surface
  co-receptor/modulator of morphogen signalling: it binds Wnt ligands and, through its heparan sulfate
  chains, Frizzled receptors, promoting Wnt-Frizzled complex formation and canonical Wnt signalling in
  hepatocellular carcinoma cells, while in other cell types it can dampen canonical and non-canonical
  Wnt responses. It binds hedgehog proteins through its core protein, competing with Patched and driving
  hedgehog endocytosis and lysosomal degradation, and so restrains hedgehog signalling during development.
  GPC3 is expressed in fetal mesodermal tissues, liver, lung, kidney and placenta, is largely absent from
  adult liver but re-expressed in most hepatocellular carcinomas, and its loss of function causes the
  X-linked Simpson-Golabi-Behmel overgrowth syndrome.'
