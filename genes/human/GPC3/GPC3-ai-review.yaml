  evidence_type: ISS
  original_reference_id: PMID:18477453
  review:
    summary: GPC3 binds hedgehog proteins with high affinity through its core protein and competes with
      Patched for hedgehog binding.
    action: NEW
    reason: Hedgehog binding is the mechanism of GPC3 antagonism of hedgehog signalling. The primary data
      are from mouse embryos/fibroblasts (ortholog in the same PANTHER subfamily PTHR10822:SF4); the follow-up
      processing study, which UniProt attributes to the human entry, also shows GPC3-Shh co-immunoprecipitation.
      Proposed as ISS for human to keep the species basis explicit.
    supported_by:
    - reference_id: PMID:18477453
      supporting_text: GPC3 interacts with high affinity with Hedgehog but not with its receptor, Patched,
        and that GPC3 competes with Patched for Hedgehog binding
    - reference_id: PMID:25653284
      supporting_text: We also showed that GPC3 binds with high affinity to Hh through its core protein,
        but that it does not interact with Ptc.
