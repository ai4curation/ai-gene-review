      and stimulates canonical Wnt signalling in HCC cells.'
    action: ACCEPT
    reason: 'Direct human evidence for a co-receptor mechanism: GPC3 binds both Wnt and Frizzled and stimulates
      their signalling complex, and the complex is co-endocytosed. GPC6, which also binds Wnt, does not
      stimulate, showing specificity. Core function.'
    supported_by:
