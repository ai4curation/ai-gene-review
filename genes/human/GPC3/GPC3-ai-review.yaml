existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:17549790
  qualifier: enables
  supporting_entities:
  - UniProtKB:P27487
  review:
    summary: 'IPI: GPC3 binds DPP4 (CD26), isolated as a GPC3 interactor from cell lines; binding inhibits
      CD26 peptidase activity.'
    action: MODIFY
    reason: Generic protein binding is uninformative. The partner, DPP4 (P27487), is a serine dipeptidyl
      peptidase, and the paper reports that binding inhibits its activity, so the informative MF for the
      interaction itself is protease binding. The inhibitory consequence is captured on the peptidase-inhibitor
      row. Evidence is a single abstract-only proteomics study.
    proposed_replacement_terms:
    - id: GO:0002020
      label: protease binding
    supported_by:
    - reference_id: PMID:17549790
      supporting_text: The interaction occurred with both the glycosylated and unglycosylated forms of
        GPC3 and led to the inhibition of CD26 peptidase activity.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:29162697
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8N158
  - UniProtKB:Q96SN8
  - UniProtKB:Q9Y625
  review:
    summary: IPI with GPC2 (Q8N158), CDK5RAP2 (Q96SN8) and GPC6 (Q9Y625) from a SMYLE/EB1/myomegalin centrosomal
      complex proteomics study.
    action: REMOVE
    reason: Bare protein binding is uninformative under the protein-binding policy. The cited paper is
      about the centrosomal SMYLE-EB1-AKAP9 complex; the cached abstract does not mention GPC3, and a
      centrosomal partner set is not consistent with a luminal/extracellular GPI-anchored proteoglycan.
      No informative MF can be derived. Removal does not assert the co-purification did not occur.
    supported_by:
    - reference_id: PMID:29162697
      supporting_text: SMYLE depletion led to defective astral microtubules and abnormal orientation of
        the mitotic spindle
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:39822733
  qualifier: enables
  supporting_entities:
  - UniProtKB:P02771
  review:
    summary: IPI with alpha-fetoprotein (AFP, P02771), validated with purified proteins after a GPC3 co-IP/MS
      screen of HepG2 xenograft tumours.
    action: REMOVE
    reason: Bare protein binding is uninformative and GO has no term capturing a specific functional consequence
      of GPC3-AFP association. The interaction itself appears genuine (cell-free IP and colocalization)
      and is noted in the description context, but no function is inferred from it.
    supported_by:
    - reference_id: PMID:39822733
      supporting_text: We further validated the direct interaction of GPC3 and alpha-fetoprotein (AFP)
        in cell-free immunoprecipitation and immunofluorescence microscopy for colocalization.
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1194891
  - PANTHER:PTN002247069
  review:
    summary: 'IBA (PTN002247069, seed mouse Gpc4 MGI:1194891): extracellular region.'
    action: KEEP_AS_NON_CORE
    reason: GPC3 is primarily GPI-anchored at the cell surface, but a second proteolytic event can release
      it, and soluble GPC3 is measurable in serum of HCC patients. The IBA is therefore consistent with
      GPC3 biology, though the extracellular soluble pool is secondary to the membrane-anchored form.
    supported_by:
    - reference_id: PMID:14610063
      supporting_text: This suggests a second proteolytic event, potentially related to the shedding of
        GPC3 from the cell surface.
    - reference_id: PMID:12851874
      supporting_text: GPC3 is specifically overexpressed in most HCCs and is elevated in the serum of
        a large proportion of patients with HCC.
- term:
    id: GO:0005764
    label: lysosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q8CFZ4
  - ensembl:ENSMUSP00000064131
  review:
    summary: 'IEA (Ensembl Compara from mouse Gpc3): lysosome.'
    action: KEEP_AS_NON_CORE
    reason: GPC3 bound to hedgehog is internalized and the complex is degraded in lysosomes (mouse data,
      PMID:18477453, recorded By similarity in UniProt), and heparan sulfate proteoglycans are generally
      turned over in lysosomes. Lysosomes are a degradative destination rather than a site of GPC3 function,
      so this is non-core.
    supported_by:
    - reference_id: PMID:18477453
      supporting_text: Furthermore, GPC3 induces Hedgehog endocytosis and degradation.
    - reference_id: file:human/GPC3/GPC3-uniprot.txt
      supporting_text: endocytosis and its subsequent lysosomal degradation (By similarity).
- term:
    id: GO:0005788
    label: endoplasmic reticulum lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8952289
  qualifier: located_in
  review:
    summary: 'Reactome: GPC3 is one of the FAM20C substrates phosphorylated in the ER lumen (GPC3 Ser352
      is a FAM20C site per UniProt).'
    action: KEEP_AS_NON_CORE
    reason: As a secreted-pathway protein with a signal peptide, GPC3 transits the ER lumen, and UniProt
      records Ser352 phosphorylation by FAM20C. This is a biosynthetic transit location, not a site of
      function.
    supported_by:
    - reference_id: file:human/GPC3/GPC3-uniprot.txt
      supporting_text: /note="Phosphoserine; by FAM20C"
    - reference_id: PMID:14610063
      supporting_text: Then, it shuttles to the Golgi complex, where it is further N-glycosylated, O-glycanated,
        and processed into two subunits, and travels to the cell surface.
- term:
    id: GO:0005796
    label: Golgi lumen
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1667005
  qualifier: located_in
  review:
    summary: Reactome places the GPC3 core protein in the Golgi lumen as one of the generic HSPG acceptor
      proteins in reactions of heparan sulfate chain initiation, elongation and modification (xylosyl,
      galactosyl and glucuronosyl transfer, EXT1:EXT2 polymerisation, NDST/HS2ST/HS3ST/HS6ST sulfation,
      FAM20B/PXYLP1 xylose phosphate turnover), including the matching defective-enzyme disease reactions.
    action: KEEP_AS_NON_CORE
    reason: GPC3 is a heparan sulfate proteoglycan whose core protein transits the Golgi, where it is
      processed and glycanated before reaching the cell surface (PMID:14610063). As a GPI-anchored protein
      it faces the Golgi lumen during biosynthesis, so the location is defensible, but it is a transit
      compartment for a substrate of the glycosylation machinery, not where GPC3 acts. Kept as non-core.
    supported_by:
    - reference_id: PMID:14610063
      supporting_text: Then, it shuttles to the Golgi complex, where it is further N-glycosylated, O-glycanated,
        and processed into two subunits, and travels to the cell surface.
    - reference_id: file:human/GPC3/GPC3-uniprot.txt
      supporting_text: 'PTM: O-glycosylated; contains heparan sulfate and/or chondroitin'
