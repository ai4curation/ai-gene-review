id: P51654
gene_symbol: GPC3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'GPC3 (glypican-3) is a glycosylphosphatidylinositol-anchored heparan sulfate proteoglycan
  of the outer leaflet of the plasma membrane. Its core protein is cleaved by a furin-like convertase
  into disulfide-linked alpha and beta chains that carry heparan sulfate chains. At the cell surface GPC3
  acts as a co-receptor for morphogens: through its heparan sulfate chains it binds Wnt ligands and Frizzled
  receptors, promoting Wnt-Frizzled signaling complexes and canonical Wnt signaling, while its core protein
  binds Hedgehog proteins, competing with PTCH1 and driving their endocytosis and lysosomal degradation.
  It also binds and inhibits the peptidase CD26/DPP4. GPC3 restrains growth during development; its loss
  causes Simpson-Golabi-Behmel overgrowth syndrome, and it is an oncofetal antigen highly expressed at
  the surface of hepatocellular carcinoma cells.'
