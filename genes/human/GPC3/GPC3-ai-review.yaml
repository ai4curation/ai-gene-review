  review:
    summary: 'IBA (PTN000850517, bilaterian node; seeds fly dally FBgn0263930 and human GPC3 itself):
      positive regulation of canonical Wnt signaling.'
    action: ACCEPT
    reason: Human GPC3 is a seed of this node through its own experimental annotation, which is expected,
      not circular. Experimental human data show GPC3 binds Wnts and Frizzled and stimulates canonical
      Wnt signalling in HCC cells. PAINT curators placed this term but not the cell-type-specific repression
      or developmental terms, consistent with stimulation being the conserved property. Core function.
    supported_by:
    - reference_id: PMID:24496449
      supporting_text: GPC3 and Frizzled interact directly through the glycosaminoglycan chains of GPC3,
        indicating that this glypican stimulates the formation of signaling complexes between Wnt and
        Frizzled
    - reference_id: PMID:16024626
      supporting_text: GPC3 stimulates the in vitro and in vivo growth of hepatocellular carcinoma cells
        by increasing autocrine/paracrine canonical Wnt signaling
- term:
