- term:
    id: GO:0045732
    label: positive regulation of protein catabolic process
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8CFZ4
  review:
    summary: 'ISS from mouse Gpc3 (Q8CFZ4): positive regulation of protein catabolic process (GPC3 promotes
      hedgehog degradation).'
    action: KEEP_AS_NON_CORE
    reason: In mouse cells GPC3 binds hedgehog and induces its endocytosis and lysosomal degradation,
      which is part of how it antagonises hedgehog signalling. Mouse and human GPC3 are orthologs in the
      same PANTHER subfamily (PTHR10822:SF4). The catabolic effect is a mechanism of the core hedgehog-antagonist
      role rather than an independent function, so non-core.
    supported_by:
    - reference_id: PMID:18477453
      supporting_text: Furthermore, GPC3 induces Hedgehog endocytosis and degradation.
