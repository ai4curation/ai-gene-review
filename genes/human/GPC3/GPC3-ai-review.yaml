- term:
    id: GO:0009653
    label: anatomical structure morphogenesis
  evidence_type: TAS
  original_reference_id: PMID:8589713
  qualifier: involved_in
  review:
    summary: 'TAS from the SGBS gene identification paper: GPC3 loss causes pre- and postnatal overgrowth
      with visceral and skeletal anomalies.'
    action: MARK_AS_OVER_ANNOTATED
    reason: The paper establishes that GPC3 loss causes an overgrowth malformation syndrome; it does not
      show GPC3 executing morphogenesis. The organismal phenotype is downstream of GPC3's signalling-modulator
      role (hedgehog and Wnt regulation), which is annotated directly. The very general term adds no information
      and rests on phenotype.
    supported_by:
    - reference_id: PMID:8589713
      supporting_text: GPC3 encodes a putative extracellular proteoglycan, glypican 3, that is inferred
        to play an important role in growth control in embryonic mesodermal tissues in which it is selectively
        expressed.
- term:
    id: GO:0009966
    label: regulation of signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR001863
  review:
    summary: 'IEA (InterPro glypican IPR001863): regulation of signal transduction.'
    action: MODIFY
    reason: Correct but general. Human GPC3 has specific, experimentally supported regulatory roles in
      canonical Wnt signalling, non-canonical Wnt signalling and hedgehog (smoothened) signalling, all
      annotated elsewhere in this review; the replacement lists those descendants.
    proposed_replacement_terms:
    - id: GO:0060828
      label: regulation of canonical Wnt signaling pathway
    - id: GO:2000050
      label: regulation of non-canonical Wnt signaling pathway
    - id: GO:0045879
      label: negative regulation of smoothened signaling pathway
    supported_by:
    - reference_id: PMID:24496449
      supporting_text: GPC3 plays a more direct role in the stimulation of Wnt signaling
    - reference_id: PMID:18477453
      supporting_text: GPC3 competes with Patched for Hedgehog binding
