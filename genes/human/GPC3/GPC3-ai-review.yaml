core_functions:
- description: 'Cell-surface co-receptor for Wnt: binds Wnt ligands and, via its heparan sulfate chains,
    Frizzled receptors (FZD4/7/8), promoting Wnt-Frizzled signalling complex formation and stimulating
    canonical Wnt/beta-catenin signalling (shown for human GPC3 in HCC and 293T cells; conserved bilaterian
    glypican function placed by PAINT at PTN000850517).'
  molecular_function:
    id: GO:0005109
    label: frizzled binding
  directly_involved_in:
  - id: GO:0090263
    label: positive regulation of canonical Wnt signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:24496449
    supporting_text: GPC3 and Frizzled interact directly through the glycosaminoglycan chains of GPC3,
      indicating that this glypican stimulates the formation of signaling complexes between Wnt and Frizzled
  - reference_id: PMID:16024626
    supporting_text: Co-immunoprecipitation experiments showed that GPC3 is able to form complexes with
      Wnts, and cell-binding assays indicated that GPC3-expressing cells have an increased capacity to
      bind Wnt.
- description: Binds hedgehog proteins through its convertase-processed core protein, competes with Patched
    for hedgehog, and induces hedgehog endocytosis and degradation, thereby antagonising hedgehog/smoothened
    signalling (mouse in vivo data and cell-based work with the ortholog in PANTHER subfamily PTHR10822:SF4;
    not propagated by PAINT, so for human this is ortholog-based).
  molecular_function:
