suggested_questions:
- question: Which cellular contexts determine whether GPC3 stimulates (HCC, 293T) or represses (CHO) canonical
    Wnt signalling, and is the difference due to convertase processing, heparan sulfate sulfation pattern,
    or the available Frizzled repertoire?
- question: Is hedgehog binding and hedgehog antagonism by human GPC3 demonstrated with endogenous protein
    in human cells, given that the defining in vivo data are from mouse?
- question: Is inhibition of DPP4/CD26 peptidase activity by GPC3 reproducible and physiologically relevant,
    and should GO add a dipeptidyl-peptidase inhibitor activity term distinct from the C-terminal peptidyl-dipeptidase
    inhibitor term currently used?
suggested_experiments:
- description: Measure Shh binding, Shh internalization and GLI reporter activity in human cells with
    CRISPR knockout of endogenous GPC3, rescued with wild-type or convertase-resistant (RR-AA) GPC3, to
    establish hedgehog antagonism for the human protein directly.
- description: Quantify DPP4 enzyme kinetics with purified GPC3 alpha/beta heterodimer and core protein,
    and test DPP4 activity in GPC3-knockout versus wild-type HCC cells.
