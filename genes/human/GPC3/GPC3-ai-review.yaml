    label: regulation of protein localization to membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002247069
  - RGD:1359399
  - RGD:1593308
  review:
    summary: 'IBA (PTN002247069; seeds rat Gpc4 and Gpc6, RGD:1359399 and RGD:1593308): regulation of
      protein localization to membrane.'
    action: KEEP_AS_NON_CORE
    reason: The seeds are astrocyte-derived GPC4/GPC6 roles in recruiting receptors at synaptic membranes.
      GPC3 descends from the same deep node with no evidence of loss, and as a membrane-anchored co-receptor
      it affects whether ligands (Wnt, hedgehog) are retained at or internalized from the membrane, so
      the broad term is plausible. There is no GPC3-specific experimental support for receptor clustering,
      so it is kept as non-core.
