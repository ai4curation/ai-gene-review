    action: ACCEPT
    reason: Gpc3-null mouse embryos show increased hedgehog signalling, and GPC3 binds hedgehog with high
      affinity and competes with Patched. Convertase-processed GPC3 inhibits Shh-induced reporter activity
      in cultured cells (PMID:25653284, attributed by UniProt to the human protein). Transfer is grounded
      in shared PANTHER subfamily PTHR10822:SF4. Note that PAINT has not placed a hedgehog-regulation
      IBD on the GPC3 lineage, so this rests on ortholog and cell-based evidence, not phylogenetic inference.
      A core function.
    supported_by:
    - reference_id: PMID:18477453
      supporting_text: We conclude that GPC3 acts as a negative regulator of Hedgehog signaling during
        mammalian development
    - reference_id: PMID:25653284
      supporting_text: In this study, we show that processing by convertases is essential for GPC3-induced
        inhibition of Hh signaling.
- term:
    id: GO:0060422
    label: peptidyl-dipeptidase inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:17549790
  qualifier: enables
  review:
    summary: 'IDA: recombinant GPC3 binds CD26/DPP4 and inhibits its peptidase activity.'
    action: MODIFY
    reason: 'The term is mis-specified: GO:0060422 is defined as inhibition of peptidyl-dipeptidase activity,
      which releases C-terminal dipeptides (ACE-type), whereas DPP4 is a dipeptidyl-peptidase that removes
      N-terminal dipeptides (GO:0008239). GO has no dipeptidyl-peptidase inhibitor term, so the parent
      peptidase inhibitor activity is the accurate replacement. The finding comes from a single abstract-only
      study and has not been independently replicated; it is treated as non-core.'
    proposed_replacement_terms:
    - id: GO:0030414
      label: peptidase inhibitor activity
    supported_by:
    - reference_id: PMID:17549790
      supporting_text: The interaction occurred with both the glycosylated and unglycosylated forms of
        GPC3 and led to the inhibition of CD26 peptidase activity.
    - reference_id: file:human/GPC3/GPC3-uniprot.txt
      supporting_text: Inhibits the dipeptidyl peptidase activity of DPP4 (PubMed:17549790).
