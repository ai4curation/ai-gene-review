suggested_questions:
- question: >-
    In the human brain, how much of CAMK2B's contribution to synaptic plasticity and spine stability is
    catalytic and how much is the kinase-independent F-actin bundling role, given that both disease-variant
    classes alter Thr287 autophosphorylation?
- question: >-
    Does CAMK2B take part in IFN-gamma-induced STAT1 Ser727 phosphorylation in any cell type where it
    is expressed, or is that step carried only by the ubiquitous gamma and delta subunits?
- question: >-
    Is the centrosomal localisation recorded in UniProt by similarity supported by any experiment on CaMKII
    beta?
suggested_experiments:
- description: >-
    Replace endogenous CAMK2B in human iPSC-derived neurons with kinase-dead, actin-binding-deficient
    (variable insert deleted) and patient variants, and measure spine density, F-actin bundling and LTP-like
    potentiation separately.
- description: >-
    Test whether CAMK2B co-immunoprecipitates and phosphorylates STAT1 Ser727 after IFN-gamma stimulation
    in a cell type with endogenous beta expression.
