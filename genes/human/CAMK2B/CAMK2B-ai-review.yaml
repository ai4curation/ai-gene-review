  review:
    summary: >-
      PAINT IBA placing Ca2+/calmodulin-dependent protein kinase activity at the CaMKII ancestral node.
    action: ACCEPT
    reason: >-
      The CaMKII clade inherits CaM-dependent kinase activity; human CAMK2B lies inside the clade, retains
      the catalytic residues (active site Asp136, ATP-binding Lys43) and the CaM-binding autoinhibitory
      region, and is shown to be a CaM-activated kinase experimentally.
    supported_by:
