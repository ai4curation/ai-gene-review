    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:27173435
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9UQM7
  review:
    summary: >-
      High-throughput or structural interaction data showing CAMK2B associated with another CaMKII subunit
      (CAMK2A or CAMK2D). CaMKII subunits co-assemble into mixed dodecameric holoenzymes through their
      association domains.
    action: MODIFY
    reason: >-
      The bare protein binding term is uninformative. The partner is another CaMKII catalytic subunit,
      and the interaction reflects hetero-oligomeric holoenzyme assembly, which is captured by the calcium-
      and calmodulin-dependent protein kinase complex rows. As a molecular-function term, protein serine/threonine
      kinase binding states what the partner is, matching the treatment of the same paralog interactions
      in the CAMK2A review. Removal of the generic term does not dispute the interaction.
    proposed_replacement_terms:
    - id: GO:0120283
      label: protein serine/threonine kinase binding
    supported_by:
    - reference_id: file:human/CAMK2B/CAMK2B-uniprot.txt
      record_section:
      - CC:SUBUNIT
      supporting_text: >-
        The different isoforms assemble into homo- or heteromultimeric holoenzymes composed of 12 subunits
        with two hexameric rings stacked one on top of the other
    - reference_id: PMID:14722083
      supporting_text: all four isoforms were dodecamers with similar but highly unusual architecture
