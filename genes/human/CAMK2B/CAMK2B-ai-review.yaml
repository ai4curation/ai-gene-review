id: Q13554
gene_symbol: CAMK2B
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CAMK2B encodes the beta subunit of calcium/calmodulin-dependent protein kinase II (CaMKII), a serine/threonine
  kinase that assembles with alpha, gamma and delta subunits into dodecameric holoenzymes. Calcium-bound
  calmodulin relieves autoinhibition and permits intersubunit Thr287 autophosphorylation, which sustains
  activity after calcium falls; the beta subunit binds calmodulin with higher affinity than alpha. Beyond
  catalysis, a variable-region insert lets beta bind and bundle actin filaments independently of kinase
  activity, anchoring the holoenzyme to the spine cytoskeleton and supporting dendritic spine maintenance
  and structural plasticity at excitatory synapses, where alpha/beta CaMKII is the main postsynaptic-density
  kinase in long-term potentiation. In skeletal muscle, beta variants sit on the cytoplasmic face of the
  sarcoplasmic reticulum and phosphorylate calcium-handling proteins. Human CAMK2B also phosphorylates
  the ER-phagy receptor RETREG1/FAM134B under ER stress. De novo CAMK2B variants that raise or lower Thr287
  autophosphorylation cause intellectual disability and disturb cortical neuron migration.
