    Calcium/calmodulin-activated Ser/Thr kinase subunit of the CaMKII holoenzyme; intersubunit Thr287
    autophosphorylation confers autonomous activity, and the alpha/beta holoenzyme couples postsynaptic
    calcium signals to phosphorylation of synaptic targets in long-term potentiation.
