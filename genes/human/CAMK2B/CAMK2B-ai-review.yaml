- term:
    id: GO:0005516
    label: calmodulin binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:88256
  - PANTHER:PTN002389359
  - UniProtKB:Q13557
  - UniProtKB:Q9UQM7
  review:
    summary: >-
      Calmodulin binding by CaMKII beta, through the CaM-binding segment of the regulatory domain (IBA
      and InterPro IPR013543 based rows).
    action: KEEP_AS_NON_CORE
    reason: >-
      Ca2+/calmodulin binding is real and is how the kinase is activated; CaMKII beta has a higher CaM
      affinity than alpha or delta. It is a regulatory input to the kinase rather than a separate function,
      and the core term GO:0004683 already encodes the CaM dependence, so it is kept as non-core, consistent
      with the CAMK2A review.
    supported_by:
    - reference_id: file:human/CAMK2B/CAMK2B-uniprot.txt
      record_section:
      - CC:ACTIVITY REGULATION
      supporting_text: >-
        Activated by Ca(2+)/calmodulin. Binding of calmodulin results in conformational change that relieves
        intrasteric autoinhibition and allows autophosphorylation of Thr-287
    - reference_id: PMID:14722083
      supporting_text: the rank order of CaM binding affinity (gamma > beta > delta > alpha)
