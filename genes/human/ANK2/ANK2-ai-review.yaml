id: Q01484
gene_symbol: ANK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Ankyrin-B is a membrane-associated adaptor that binds spectrins and organizes ion channels,
  transporters and other membrane proteins. In cardiac cells it positions calcium-handling proteins and
  supports electrical activity; in muscle it contributes to dystrophin-associated membrane organization.
  A 220-kDa form also couples PI3P-bearing organelles to dynactin and recruits RabGAP1L during endosomal
  trafficking. The giant neuronal form contains an insertion that binds and bundles microtubules to constrain
  axonal branching. It also maintains L1CAM-neuropilin receptor complexes at the neuronal surface for
  Sema3A responses, through a mechanism separable from its microtubule-binding and betaII-spectrin interactions.
