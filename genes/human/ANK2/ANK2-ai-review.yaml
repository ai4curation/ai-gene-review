- term:
    id: GO:0008017
    label: microtubule binding
  evidence_type: IDA
  original_reference_id: PMID:32640013
  qualifier: enables
  review:
    summary: The giant ankyrin-B inserted domain binds and bundles microtubules.
    action: NEW
    reason: Purified fragments amplified from human 440-kDa ANK2 cDNA bind prepolymerized microtubules
      in cosedimentation assays; residues 1793–2070 also bundle microtubules in imaging and electron microscopy
      assays. The Methods identify human ENST00000264366.10, bacterial protein production and appropriate
      control fragments. PSK substitutions impair binding/bundling and full-length rescue of excess branching
      in mouse neurons. This is a direct molecular activity of the tested giant-domain sequence, not an
      inference from the protein being necessary for neuronal development. The exact construct is described
      rather than guessing a correspondence to a current UniProt isoform accession. No plus-end, minus-end
      or motor activity is inferred.
    supported_by:
    - reference_id: PMID:32640013
      supporting_text: Taken together, gAnkB contains a stretch of amino acids (1793–2070) that avidly
        bind and bundle MTs in vitro.
