- description: The neurospecific giant ankyrin-B domain directly binds and bundles microtubules through
    tandem repeats and an adjacent conserved segment. Human recombinant fragments establish the molecular
    activity; human full-length construct rescue in mouse neurons links this activity to restricting microtubule
    entry into nascent axon branches. This function is distinct from the spectrin-associated membrane-adaptor
    mechanism.
