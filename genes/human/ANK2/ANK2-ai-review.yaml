core_functions:
- description: Couples membrane proteins to spectrin-based and associated cytoskeletal assemblies, positioning
    transporters, channels and dystrophin-associated machinery. This anchoring organizes cardiac calcium-handling
    proteins and muscle membrane complexes. The giant isoform also organizes Sema3A receptor targeting
    through a membrane-organizing mechanism separable from its microtubule binding and betaII-spectrin
    interaction.
