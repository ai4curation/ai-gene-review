    label: regulation of heart rate
  evidence_type: IMP
  original_reference_id: PMID:18832177
  qualifier: involved_in
  review:
    summary: Ankyrin-B-dependent channel organization regulates cardiac pacemaking.
    action: ACCEPT
    reason: The PMID:18832177 abstract explicitly links human ANK2 variants to sinus-node disease and
      reports abnormal pacing and ion-channel organization in deficient mice. This is a supported physiological
      consequence of the cardiac membrane adaptor mechanism, without attributing pacemaker-channel conductance
      to ANK2.
