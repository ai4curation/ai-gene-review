taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACP5 encodes tartrate-resistant acid phosphatase type 5, a secreted and
  lysosomal binuclear iron purple acid phosphatase. The enzyme binds one Fe(III)
  and one Fe(II) ion per subunit and hydrolyzes phosphate monoesters under acidic
  conditions. In humans and other vertebrates ACP5 is produced by osteoclasts,
  macrophages, and dendritic cells; its secreted isoforms dephosphorylate
  extracellular phosphoproteins during bone-matrix remodeling, while its
  lysosomal pool contributes to macrophage and dendritic-cell acid phosphatase
  activity.
