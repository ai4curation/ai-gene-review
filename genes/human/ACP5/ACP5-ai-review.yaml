  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-196950
  qualifier: located_in
  review:
    summary: >-
      Reactome places a soluble signal-peptide lysosomal/secreted enzyme in the
      cytosol for FMN hydrolysis.
    action: REMOVE
    reason: >-
      ACP5 has a cleaved signal peptide and curated lysosomal/secreted
      localization, so it is routed through the endomembrane system and not the
      cytosol. Reactome R-HSA-196950 places a homodimeric TRAP reaction in the
      cytosol without matching ACP5's signal-peptide-dependent localization.
    supported_by:
    - reference_id: Reactome:R-HSA-196950
      supporting_text: >-
        Cytosolic, homodimeric tartrate-resistant acid phosphatase type 5 (TRAP)
        catalyzes the hydrolysis of flavin mononucleotide (FMN)
    - reference_id: PMID:2338077
      supporting_text: >-
        encodes a protein of 325 amino acids, including a signal peptide of 19
        residues and two potential sites for N-glycosylation
    source_defects:
