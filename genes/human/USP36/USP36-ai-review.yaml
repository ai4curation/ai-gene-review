suggested_questions:
- question: Which USP36 functions are catalysis-dependent? The NEDD4L/TrkA effect works with the C131S mutant, whereas H2B and c-Myc deubiquitination require C131. Is the SUMO E3 activity on EXOSC10 independent of the DUB active site, and which region confers it?
- question: Does USP36 bind pre-rRNA directly, or only via pre-ribosomal particles and the exosome?
- question: Is USP36 linkage-selective (e.g. K48 versus K63) as a deubiquitinase, or a general USP?
- question: Vertebrate USP36 (PTHR24006:SF653) and yeast Ubp10/fly scrawny (SF758) share H2B and RNA Pol I deubiquitination; which nucleolar functions (e.g. SUMO E3 activity, c-Myc control) are vertebrate-specific?
suggested_experiments:
- hypothesis: USP36 SUMO E3 activity resides in its C-terminal region and is independent of Cys131.
  description: Reconstitute EXOSC10 SUMOylation in vitro with purified full-length USP36, C131A, and N/C-terminal truncations; measure SUMO1/2 transfer kinetics.
  experiment_type: biochemical assay
- hypothesis: USP36 directly binds pre-rRNA.
  description: CLIP-seq or PAR-CLIP of endogenous USP36 in human cells, with RNase protection and EXOSC10-depletion controls, to map direct RNA contacts.
  experiment_type: RNA-protein interaction mapping
- hypothesis: USP36 has defined ubiquitin chain-linkage preferences.
  description: Di-ubiquitin linkage panel cleavage assays with recombinant USP36 catalytic domain.
  experiment_type: enzyme assay
