core_functions:
- description: Nucleolar cysteine-type deubiquitinase that removes ubiquitin from nucleolar ribosome-biogenesis factors (NPM1, FBL, DHX33) and from c-Myc, stabilizing them against proteasomal degradation and thereby sustaining rRNA transcription and processing. Activity demonstrated in vitro and in human cells (C131A-dependent).
  molecular_function:
    id: GO:0004843
    label: cysteine-type deubiquitinase activity
  directly_involved_in:
  - id: GO:0016579
    label: protein deubiquitination
  - id: GO:0050821
    label: protein stabilization
  - id: GO:2000234
    label: positive regulation of rRNA processing
  locations:
  - id: GO:0005730
    label: nucleolus
  supported_by:
  - *id011
  - *id012
  - *id003
  - *id010
- description: SUMO E3 ligase activity toward the nucleolar RNA exosome exonuclease EXOSC10 (K583), promoting EXOSC10 binding to pre-rRNA and exosome-dependent rRNA processing.
  molecular_function:
    id: GO:0061665
    label: SUMO ligase activity
  directly_involved_in:
  - id: GO:2000234
    label: positive regulation of rRNA processing
  locations:
  - id: GO:0005730
    label: nucleolus
  supported_by:
  - *id016
  - *id015
- description: Histone H2B deubiquitinase that removes H2Bub1 within the CDKN1A gene body, repressing p21 expression; a conserved activity shared with yeast Ubp10 and fly scrawny (different PANTHER subfamily, SF758).
  molecular_function:
