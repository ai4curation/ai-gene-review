id: Q9P275
gene_symbol: USP36
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'USP36 is a nucleolar ubiquitin-specific protease (peptidase C19 family) of about 1,120 residues, with an N-terminal USP catalytic domain (Cys131/His382 dyad) and a long, largely disordered C-terminal region whose basic stretches target it to the nucleolus. Its main role is in ribosome biogenesis: it deubiquitinates and stabilizes nucleolar proteins including nucleophosmin (NPM1), fibrillarin (FBL), the RNA helicase DHX33 and the c-Myc transcription factor, which it protects from SCF(FBW7gamma)-mediated degradation in the nucleolus. It also acts as a SUMO E3 ligase for the exosome exonuclease EXOSC10, promoting pre-rRNA processing, and binds pre-rRNA. Loss of USP36 reduces rRNA transcription and processing and impairs nucleolar structure, and the mouse knockout is lethal before implantation. Other reported activities include deubiquitination of histone H2B monoubiquitin (H2Bub1) to repress CDKN1A, stabilization of SOD2 and CEP63, restraint of p62-dependent selective autophagy, and a cytoplasmic, largely catalysis-independent modulation of the E3 ligase NEDD4L that protects TrkA and Kv7.2/3. Human USP36 complements yeast ubp10 mutants for RNA polymerase I stability and pre-rRNA processing.'
