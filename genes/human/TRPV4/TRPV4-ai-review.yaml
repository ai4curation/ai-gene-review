suggested_questions:
- question: 'Which GO BP should be preferred when TRPV4 hypotonicity activates a Ca2+ channel through membrane stretch rather
    than a pure osmolarity sensor: osmosensory signaling, detection of mechanical stimulus, or both only after an orthogonal
    mechanical assay?'
- question: What is the best GO representation for TRPV4-dependent dynamic-compression responses in articular 
    chondrocytes, and should GO add a non-neuronal compression-detection child of detection of mechanical stimulus?
suggested_experiments:
- description: Patch clamp purified or excised human TRPV4 with calibrated membrane-tension steps to test 
    force-from-lipids gating independent of phospholipase A2, AQP4 or cytoskeletal coupling.
- description: Compare wild-type and TRPV4-null primary human chondrocytes or organoids under calibrated dynamic 
    compression to link endogenous TRPV4 channel currents to cartilage anabolic and catabolic transcriptional responses.
