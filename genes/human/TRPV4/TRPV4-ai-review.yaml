id: Q9HBA0
gene_symbol: TRPV4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TRPV4 is a plasma-membrane, Ca2+-permeable nonselective cation channel of the transient receptor potential vanilloid
  family. Functional TRPV4 tetramers sense hypotonic and mechanical or mechano-osmotic stimuli and are also gated by heat
  and chemical agonists, admitting extracellular Ca2+ that drives local cytosolic Ca2+ signaling. TRPV4 acts in epithelial,
  endothelial, neural, glial and chondrocyte contexts, including osmosensory signaling, high-viscosity ciliary responses,
  endothelial permeability, regulatory cell-volume decrease with AQP4, and cartilage/bone homeostasis. Its ankyrin-repeat
  cytosolic domain and C-terminal regulatory sites bind calmodulin, phosphoinositides, DDX3X, PKD2, and cytoskeletal or kinase
  partners that tune trafficking and channel output.'
