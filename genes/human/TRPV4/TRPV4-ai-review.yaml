    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9EPK8
  - ensembl:ENSMUSP00000071859
  review:
    summary: Indirect negative regulation of Pol II transcription in adipocytes.
    action: MARK_AS_OVER_ANNOTATED
    reason: TRPV4 represses Pgc1a/Ucp1 indirectly through ERK1/2 signaling; it is not a transcriptional regulator acting
      at Pol II promoters, so this direct transcription term over-annotates the channel.
    supported_by:
    - reference_id: PMID:23021218
      supporting_text: TRPV4 negatively regulated the expression of PGC1α, UCP1, and cellular respiration
    - reference_id: PMID:23021218
      supporting_text: Mice with a null mutation for TRPV4 or wild-type mice treated with a TRPV4 antagonist showed 
        elevated thermogenesis in adipose tissues and were protected from diet-induced obesity, adipose inflammation, 
        and insulin resistance
