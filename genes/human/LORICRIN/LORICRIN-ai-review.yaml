- id: PMID:2007607
  title: Characterization of human loricrin. Structure and function of a new class
    of epidermal cell envelope proteins.
  findings:
  - statement: Human loricrin is incorporated into the cornified cell envelope through
      N-epsilon-(gamma-glutamyl)lysine isodipeptide cross-links.
    supporting_text: Furthermore, we have isolated four peptides from purified human
      cell envelopes that contain recognizable loricrin sequences and which are cross-linked
      by the N epsilon-(gamma-glutamyl)lysine isodipeptide bond.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Loricrin is highly insoluble partly because of disulfide cross-linking.
    supporting_text: We show that unlike all other putative protein components of the
      cell envelope, loricrins are highly insoluble, due at least in part to cross-linking
      by disulfide bonds.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Isopeptide attachment to the cornified envelope explains loricrin's
      extraordinary insolubility and scarcity as a monomer in epidermal extracts.
    supporting_text: The presence of such bonds thus affords an explanation for the
      extraordinary insolubility of loricrin by cross-linking to the cell envelope and
      can also explain the low steady-state levels of monomeric loricrin in cytoskeletal
      extracts of epidermis.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct biochemical characterization of cloned human loricrin and loricrin-derived
      peptides isolated from purified human cornified envelopes. The cache is abstract-only,
      so statements are restricted to the abstract.
- id: PMID:7543090
  title: The proteins elafin, filaggrin, keratin intermediate filaments, loricrin,
    and small proline-rich proteins 1 and 2 are isodipeptide cross-linked components
    of the human epidermal cornified cell envelope.
  findings:
  - statement: Loricrin is the dominant cross-linked protein in the outer portion of
      purified human epidermal cornified envelopes.
    supporting_text: Based on these data, most (94% molar mass) of the outer third of
      CE structure consists of intra- and interchain cross-linked loricrin, admixed
      with SPR1 and SPR2 proteins as bridging cross-links between loricrin.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Human envelope assembly includes loricrin cross-links to SPR proteins,
      elafin, keratins, and filaggrin.
    supporting_text: In addition, cross-links involving loricrin and keratins 1, 2e,
      and 10 or filaggrin were recovered in both levels.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct peptide sequencing of isodipeptide-linked material released
      from purified human foreskin epidermal cornified envelopes; strongly supports
      structural-envelope and cross-linking functions.
- id: PMID:7592852
  title: Biochemical, structural, and transglutaminase substrate properties of human
    loricrin, the major epidermal cornified cell envelope protein.
  findings:
  - statement: Loricrin is a major cornified-envelope barrier protein in terminally
      differentiated epidermal keratinocytes.
    supporting_text: Loricrin is the major protein of the cornified cell envelope of
      terminally differentiated epidermal keratinocytes which functions as a physical
      barrier.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: Epidermal transglutaminases 1, 2, and 3 use loricrin as a substrate,
      with TGase 3 favoring intrachain and TGase 1 favoring interchain cross-links.
    supporting_text: The transglutaminase (TGase) 1, 2, and 3 enzymes expressed during
      epidermal differentiation utilized loricrin in vitro as a complete substrate,
      but the types of cross-linking were different. The TGase 3 reaction favored certain
      lysines and glutamines by forming mostly intrachain cross-links, whereas TGase
      1 formed mostly large oligomeric complexes by interchain cross-links involving
      different lysines and glutamines.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: The in-vitro acceptor and donor residues closely match cross-link sites
      observed in vivo.
    supporting_text: Together, the glutamines and lysines used in vitro are almost identical
      to those seen in vivo.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct biochemical study of recombinant human loricrin and mouse epidermal
      loricrin. It establishes substrate behavior, cross-link topology, and a barrier-related
      structural role, while the cache is abstract-only.
- id: PMID:11038185
  title: 'Lessons from loricrin-deficient mice: compensatory mechanisms maintaining
    skin barrier function in the absence of a major cornified envelope protein.'
  findings:
  - statement: Loricrin-null mice show delayed embryonic skin-barrier formation.
    supporting_text: These mice showed a delay in the formation of the skin barrier in
      embryonic development.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: Cornified envelopes from loricrin-null mice are more susceptible to mechanical
      stress.
    supporting_text: Isolated mutant CEs were more easily fragmented by sonication in vitro,
      indicating a greater susceptibility to mechanical stress.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: Loricrin loss does not abolish steady-state epidermal permeability-barrier
      function in the knockout mice.
    supporting_text: Nevertheless, we did not detect impaired epidermal barrier function
      in these mice.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: Increased expression of other envelope components is one mechanism that
      compensates for loricrin loss.
    supporting_text: At least one of the compensatory mechanisms preventing a more severe
      skin phenotype in newborn Lor(-/-) mice is an increase in the expression of other
      CE components, such as SPRRP2D and SPRRP2H, members of the family of "small proline
      rich proteins"
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct loss-of-function study in mouse. It qualifies, rather than negates,
      loricrin's structural role by demonstrating developmental and mechanical defects together
      with strong functional compensation.
- id: PMID:8673107
  title: A molecular defect in loricrin, the major component of the cornified cell envelope,
    underlies Vohwinkel's syndrome.
  findings:
  - statement: A human LORICRIN frameshift disrupts the glycine- and glutamine/lysine-rich
      C-terminal region and is predicted to impair cornification.
    supporting_text: Sequencing of the loricrin gene revealed an insertion that shifts
      the translation frame of the C-terminal Gly- and Gln/Lys-rich domains, and is likely
      to impair cornification.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Human genetic evidence linking a LORICRIN frameshift to disease and
      perturbed cornified-envelope formation. The abstract supports causality and affected
      sequence context, but not a separate molecular activity.
- id: PMID:11038186
  title: Transgenic mice expressing a mutant form of loricrin reveal the molecular basis
    of the skin diseases, Vohwinkel syndrome and progressive symmetric erythrokeratoderma.
  findings:
  - statement: A disease-like C-terminal mutant accumulates in keratinocyte nuclei and
      cytoplasm instead of the cornified envelope.
    supporting_text: Immunofluorescence and immunoelectron microscopy showed the mutant
      loricrin protein in the nucleus and cytoplasm of epidermal keratinocytes, but did
      not detect the protein in the cornified cell envelope.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: Nuclear deposition of mutant loricrin interferes with late epidermal
      differentiation and produces a Vohwinkel-syndrome-like phenotype.
    supporting_text: Thus, deposition of the mutant protein in the nucleus appears to
      interfere with late stages of epidermal differentiation, resulting in a VS-like
      phenotype.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  - statement: The mutant C terminus gains a nuclear localization signal, distinguishing
      toxic mutant behavior from normal loricrin function.
    supporting_text: Transfection experiments indicated that the COOH-terminal domain
      of the mutant loricrin contains a nuclear localization signal.
    full_text_unavailable: false
    reference_section_type: ABSTRACT
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text mouse transgenic study testing a human-disease-like mutant.
      Its nuclear localization is a mutant gain-of-function mechanism and should not be
      generalized to the normal protein.
