id: P23490
gene_symbol: LORICRIN
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Loricrin is a glycine-, serine-, and cysteine-rich structural protein produced by
  terminally differentiating keratinocytes. It accumulates in the cytoplasm before
  becoming covalently incorporated into the cornified envelope, where epidermal
  transglutaminases create intra- and intermolecular glutamine-lysine isopeptide
  cross-links and disulfide bonds provide additional stabilization. Cross-linked
  loricrin forms a major mechanically resilient part of the human epidermal envelope.
  Loricrin loss in mice delays barrier formation and weakens isolated envelopes, but
  other envelope proteins compensate sufficiently to preserve steady-state permeability.
  Disease-associated C-terminal frameshift proteins instead accumulate in keratinocyte
  nuclei and disrupt late differentiation; this mutant gain of function is distinct
  from the normal cornified-envelope role of wild-type loricrin.
