core_functions:
- description: >-
    Acts as a non-enzymatic structural constituent of the skin epidermis that is used
    as a transglutaminase substrate during peptide cross-linking; extensive intra- and
    intermolecular isopeptide cross-links incorporate loricrin into the cornified
    envelope and create a mechanically resilient protein layer.
  molecular_function:
    id: GO:0030280
    label: structural constituent of skin epidermis
  directly_involved_in:
  - id: GO:0018149
    label: peptide cross-linking
  locations:
  - id: GO:0001533
    label: cornified envelope
  supported_by:
  - reference_id: PMID:7543090
    supporting_text: >-
      most (94% molar mass) of the outer third of CE structure consists of intra- and
      interchain cross-linked loricrin
  - reference_id: PMID:7592852
    supporting_text: >-
      The transglutaminase (TGase) 1, 2, and 3 enzymes expressed during epidermal
      differentiation utilized loricrin in vitro as a complete substrate, but the
      types of cross-linking were different.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which human cornified-envelope proteins compensate quantitatively for reduced or
    absent loricrin, and do those substitutions preserve permeability and mechanical
    resilience equally across anatomical sites and environmental stresses?
- question: >-
    Does wild-type loricrin have a reproducible physiological nucleoplasmic pool in
    differentiating human keratinocytes, or does the reviewed nucleoplasm statement
    reflect a transient or experimentally contingent localization without a nuclear
    function?
suggested_experiments:
- hypothesis: >-
    Human keratinocytes compensate for LORICRIN loss by increasing and redistributing
    small proline-rich proteins and other transglutaminase substrates, preserving
    permeability more effectively than mechanical resilience.
  description: >-
    Generate isogenic human epidermal organoids carrying LORICRIN knockout and rescue
    alleles, then combine quantitative cornified-envelope proteomics and cross-link-site
    mapping with transepidermal water-loss, rupture, abrasion, and humidity-stress assays.
  experiment_type: genetic perturbation with proteomics and biomechanical assays
- hypothesis: >-
    Nuclear accumulation is specific to frameshifted loricrin with a novel C-terminal
    targeting signal and is not a normal functional state of wild-type loricrin.
  description: >-
    Compare endogenous wild-type loricrin, disease frameshift alleles, and nuclear-targeting-
    signal-reverted mutants in differentiating primary human keratinocytes by live-cell
    imaging, biochemical fractionation, and cornified-envelope incorporation assays.
  experiment_type: endogenous allele engineering and localization analysis
knowledge_gaps:
- gap_statement: >-
    The extent and molecular composition of compensation for LORICRIN loss in human
    epidermis are unknown, including whether compensation preserves mechanical strength
    across body sites as effectively as it preserves permeability.
  boundary: >-
    Human biochemical studies establish that loricrin is a predominant cross-linked
    envelope constituent. In mice, loricrin loss delays barrier acquisition and makes
    envelopes more fragile, yet increased expression of other envelope components permits
    apparently normal steady-state permeability; equivalent causal measurements have not
    been made in human epidermis.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this gap would distinguish loricrin's conserved load-bearing contribution
    from species- and site-specific redundancy and clarify why loss and dominant mutant
    alleles can have different phenotypic consequences.
  resolution: >-
    Quantify envelope composition, covalent cross-link topology, permeability, and
    mechanical failure in LORICRIN-null and rescued human epidermal organoids across
    relevant differentiation and stress conditions.
  provenance:
  - reference_id: PMID:11038185
    supporting_text: >-
      Nevertheless, we did not detect impaired epidermal barrier function in these mice.
    reference_section_type: ABSTRACT
- gap_statement: >-
    The physiological significance of the reported nucleoplasmic localization of
    wild-type loricrin is unresolved; no normal nuclear molecular function has been
    established.
  boundary: >-
    The reviewed UniProt record reports both cytoplasmic and nucleoplasmic localization,
    whereas disease-associated frameshift proteins acquire a C-terminal nuclear-targeting
    signal, accumulate in nuclei instead of the cornified envelope, and disrupt late
    differentiation. The mutant mechanism therefore cannot establish a normal nuclear
    role for wild-type loricrin.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Clarification is needed to decide whether nucleoplasm should remain a contextual
    wild-type location and to prevent a pathogenic mutant gain of function from being
    generalized into the normal LORICRIN functional model.
  resolution: >-
    Use allele-specific endogenous tagging, nuclear-cytoplasmic fractionation, and
    envelope incorporation measurements in differentiating primary human keratinocytes,
    explicitly comparing wild-type protein with disease frameshift variants.
  provenance:
  - reference_id: PMID:11038186
    supporting_text: >-
      Transfection experiments indicated that the COOH-terminal domain of the mutant
      loricrin contains a nuclear localization signal.
    reference_section_type: ABSTRACT
