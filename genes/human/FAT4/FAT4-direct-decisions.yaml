        association in PMID:22153077, original Figure 6 and supplemental Figure S7A, with peptide identities
        in Table S6. The primary fluorescence-polarization figures assign human FAT4 peptide 1 (DDMTVRKQPEGNPKPD;
        canonical residues 4567–4582) Kd 36.7 ± 11.0 micromolar, and peptide 2 (PLSRTRNPADGIPAPE; 4822–4837)
