  review:
    summary: Two human FAT4 cytoplasmic peptides bind tankyrase-2 directly.
    action: KEEP_AS_NON_CORE
    reason: PMID:22153077 validates two human FAT4 peptides by fluorescence polarization against the tankyrase-2
      (TNKS2; Q9H2K2) ARC4 substrate-recognition domain (Figure S7A, Table S6 and Extended Experimental
      Procedures). Each FAT4 series used three experiments performed in technical duplicate. The separate
      Figure 6 co-immunoprecipitation and PARylation experiments used a mouse Fat4 fragment lacking most
      of its extracellular region, not endogenous full-length human FAT4; endogenous FAT4 was not detected
      in HEK293T cells. This supports the imported interaction as a non-core binding observation under
      the project binding exception. It does not establish an adaptor or catalytic molecular function
      for FAT4, and TNKS2-mediated substrate recognition does not transfer TNKS2 enzyme activity to FAT4.
    supported_by:
    - reference_id: PMID:22153077
