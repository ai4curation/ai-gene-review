- annotation_index: 18
  source_annotation:
    term:
      id: GO:0070062
      label: extracellular exosome
    evidence_type: HDA
    original_reference_id: PMID:23533145
    qualifier: located_in
  review:
    summary: The FAT4-specific exosome proteomics assignment remains unresolved.
    action: UNDECIDED
    reason: 'The main text of PMID:23533145 describes shotgun proteomics of differential-ultracentrifugation
      preparations from pooled expressed prostatic secretions in urine, with peptide/protein identification
      at FDR below 1%. However, the target-bearing Supplemental Table 2 and supplementary Methods could
      not be recovered as actual spreadsheet/document content in this review: available links returned
      download-gate HTML, access errors or unavailable-source responses. The main text does not independently
      identify the FAT4 protein/peptide entry. Retain the imported HDA context as undecided until that
      entry and its identification criteria can be checked. This access limitation does not demonstrate
      that the curator was wrong. Detection in a mixed vesicle preparation would not by itself establish
      a FAT4 exosome mechanism, cancer-specific role or localization of every natural product.'
    supported_by:
    - reference_id: PMID:23533145
