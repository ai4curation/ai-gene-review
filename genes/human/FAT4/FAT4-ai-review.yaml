suggested_questions:
- question: In native mammalian cell contacts, which intracellular partners link FAT4 to the boundary-complex
    internalization behavior measured in the engineered human-cell system of PMID:39955614? The cell-culture
    measurements do not by themselves establish the corresponding tissue-polarity mechanism.
- question: Where is the N-terminally shortened natural product Q6V0I7-2 expressed and localized, and
    can it support DCHS1-dependent adhesion despite lacking the N-terminal EC1–4 region studied in the
    full-length and fragment assays? Sequence architecture alone does not establish its function.
suggested_experiments:
- hypothesis: The contribution of the FAT4 intracellular region to boundary-complex turnover depends on
    cellular context.
  description: Compare sequence-verified full-length FAT4 with the published intracellular deletion construct
    at matched cell-surface abundance in a defined endogenous-expression mammalian system. Measure DCHS1
    binding, boundary accumulation and internalization separately, then test candidate intracellular partners
    without treating actin inhibition as evidence of direct FAT4–actin binding.
  experiment_type: Controlled interaction and trafficking comparison
- hypothesis: The N-terminally shortened Q6V0I7-2 product may differ from full-length FAT4 in surface
    delivery or adhesion.
  description: First establish isoform-specific transcript and protein expression in a defined human context.
    Compare sequence-verified Q6V0I7-1 and Q6V0I7-2 for abundance, surface localization, DCHS1 binding
    and cell-boundary accumulation, without assigning a canonical signal-peptide cleavage site or functional
    equivalence in advance.
  experiment_type: Isoform-resolved expression and adhesion analysis
