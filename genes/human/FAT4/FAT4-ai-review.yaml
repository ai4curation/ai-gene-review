  review:
    summary: Refine the classical adherens-junction inference to the apicolateral plasma membrane.
    action: MODIFY
    reason: 'FAT4 is inside the actual PTN001931937 IBD clade, so this is a biological scope refinement,
      not a missing-tree or donor-count objection. In mouse embryonic cortex, endogenous Fat4 lies more
      apically than the beta-catenin-marked adherens junction. Knockdown and electron microscopy distinguish
      a Fat4-dependent subapical membrane apposition from the neighboring adherens junction. PMID:25355906
      Figure 5 and the corresponding Results independently identify these appositions at the apical end
      of lateral epithelial membranes: transfected MDCK contacts lie above the tight junction, and mouse
      neuroepithelial contacts lie above the adherens junction. GO:0016327 apicolateral plasma membrane
      describes that membrane compartment without assigning a classical adherens-junction identity. The
      broader apical part of cell term is already retained at source index 15; the replacement preserves
      membrane-level resolution that the broader term lacks. This scoped localization inference does not
      deny context-dependent junctional interactions elsewhere.'
