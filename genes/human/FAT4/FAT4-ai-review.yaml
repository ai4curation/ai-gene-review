id: Q6V0I7
gene_symbol: FAT4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FAT4 is a large transmembrane atypical cadherin that forms calcium-dependent heterophilic
  cell contacts with DCHS1. Its extracellular cadherin domains bind DCHS1 on neighboring cells, while
  its intracellular region contributes to the accumulation and internalization of these boundary complexes.
  FAT4-dependent cell contacts and context-dependent signaling help organize developing epithelia and
  neural progenitors. Its effects on YAP differ among tissues and are not restricted to a single canonical
  Hippo kinase mechanism.
