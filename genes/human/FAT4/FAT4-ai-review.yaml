  review:
    summary: FAT4 directly binds DCHS1 to mediate heterophilic contacts between cells.
    action: NEW
    reason: Purified human FAT4 EC1–4 binds human DCHS1 in isothermal titration calorimetry, and the interface-disrupting
      FAT4 L379R mutation abolishes detectable binding and reduces boundary accumulation in full-length-protein
      co-cultures. The earlier full-length human constructs were cloned from MCF7 and form heterotypic
      FAT4–DCHS1 boundary complexes. FAT4 itself performs the cadherin-binding step rather than being
      merely necessary for a downstream tissue phenotype. GO:0098641 is the specific molecular activity
      for this interaction; GO:0086080 would additionally require distinct cell types, which is not established
      by nonidentical cadherin partners. This added MF is distinct from the retained TNKS2 interaction
      and from the already imported adhesion processes. It does not assert that DCHS1 is the only partner
