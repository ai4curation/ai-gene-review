    label: cadherin binding involved in cell-cell adhesion
  description: The characterized full-length FAT4 protein binds DCHS1 on an adjacent cell through its
    N-terminal extracellular cadherin domains, creating a heterophilic adhesive contact. The extracellular
    cadherin structure contains bound calcium at interdomain junctions. This activity is established for
    the tested human constructs and is not assigned to every natural splice product.
