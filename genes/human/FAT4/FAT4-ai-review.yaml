- id: PMID:39955614
  title: Fat4 intracellular domain controls internalization of Fat4/Dchs1 planar polarity membrane complexes.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID, title and DOI verified against the original PubMed/publisher record; actual PMC
      full main article Methods, Results and Discussion read by ROOT. Stable HEK293T cells express FAT4/DCHS1
      fluorescent constructs borrowed from the full-length human cDNA study PMID:28826487; artificial
      delta-ICD constructs retain the first nine cytoplasmic residues and are not natural splice isoforms.
      FAT4 ICD deletion reduces DCHS1 trans-endocytosis and boundary accumulation, with similar expression/localization
      controls; FRAP shows no detectable change in boundary-complex stability on the measured minute timescale.
      Calcium-depletion boundary loss is slower after FAT4 ICD deletion and is interpreted as altered
      internalization. Latrunculin reduces accumulation without demonstrating direct FAT4–actin binding.
      Tissue-level PCP plasticity is a proposed implication, not directly tested here. ROOT read the main
      text, captions and original Figures 1–3 pixels. One Figure 1 caption sentence says trans-endocytosis
      predominates with FAT4 ICD deletion, whereas the actual Figure 1I group labels/bars and Results
      support reduced trans-endocytosis; the interpretation here follows the plotted experiment and Results.
      This is an internal caption inconsistency, not a claimed formal erratum. Figure 2 bounds the FRAP
      result to the measured eight minutes, and Figure 3B measures the fraction of accumulating boundaries
      after calcium depletion rather than internalization directly. Videos and supplemental sequences
      were not independently inspected. Full original HTML is available despite preserved ePMC XML HTTP
      500 failures; the abstract-only normal cache remains unchanged.
