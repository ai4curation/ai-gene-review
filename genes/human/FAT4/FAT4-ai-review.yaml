    correctness: VERIFIED
    review_notes: 'Actual PANTHER v19 PTHR24026 tree, alignment and term-specific IBD records place human
      FAT4 PTN002513196 below all five source nodes: plasma membrane, adherens junction, axonogenesis,
      epithelial differentiation and cadherin-mediated adhesion. The ungapped target matches canonical
      Q6V0I7. Current InterPro PTHR24027 is a distinct classification snapshot. Epithelial-differentiation
