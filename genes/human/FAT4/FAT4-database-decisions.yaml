  review:
    summary: Retain heterophilic adhesion mediated by FAT4–DCHS1.
    action: ACCEPT
    reason: The cited mouse Q2PZL6 has a genuine experimental GOA link to PMID:19506035. Its full text
      separates mouse endogenous cortex work from rat full-length cDNA aggregation assays, so the exact
      construct species must not be relabeled as mouse. Independent human full-length co-culture experiments
      and purified human FAT4–DCHS1 structural/ITC measurements directly corroborate the conserved heterophilic
      mechanism. This is not inferred merely from disease association or classical cadherin family membership.
    supported_by:
    - reference_id: GO_REF:0000024
    - reference_id: PMID:19506035
    - reference_id: PMID:28826487
    - reference_id: PMID:36797229
- annotation_index: 8
  source_annotation:
    term:
      id: GO:0007409
      label: axonogenesis
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    supporting_entities:
    - FB:FBgn0003391
    - PANTHER:PTN008390614
  review:
    summary: Retain axonogenesis as a qualified ancestral developmental inference.
    action: KEEP_AS_NON_CORE
    reason: The recovered FAT4 target is genuinely below the axonogenesis IBD at PTN008390614. The named
      donor is fly shotgun/DE-cadherin (Q24298), whose IMP annotation is grounded in PMID:12716940, not
      fly Fat. Accessible original Results describe perturbations of secondary axon trajectories after
      neuron/glia adhesion disruption; they allow secondary distortion from altered cortical cell placement.
      This is a considered ancestral inference, not direct human FAT4 axon-outgrowth evidence. FAT4 cortical-neuron
      generation experiments do not by themselves establish axonogenesis, but neither they nor the different
      adhesion partner establish a target-specific loss of the inherited developmental role. Retain the
      IBA as non-core with that uncertainty rather than reject it from donor count or paralog naming alone.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:12716940
