    - reference_id: PMID:28826487
    - reference_id: PMID:36797229
- annotation_index: 6
  source_annotation:
    term:
      id: GO:0007156
      label: homophilic cell-cell adhesion
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    supporting_entities:
    - InterPro:IPR002126
  review:
    summary: Replace the generic homophilic cadherin mapping with heterophilic adhesion.
    action: MODIFY
    reason: The InterPro IPR002126 match is real, but its homophilic-adhesion consequence does not describe
      the characterized FAT4 interaction. Human full-length FAT4 and DCHS1 accumulate at heterotypic boundaries,
      with no corresponding homotypic accumulation in the tested co-cultures; purified human N-terminal
      fragments bind directly. The earlier full-length aggregation assay used rat constructs and showed
      efficient mixed-cell, calcium-dependent aggregation with little aggregation of either single transfectant.
      These target/ortholog experiments support heterophilic adhesion, not a universal claim that FAT4
      can never self-associate under any condition.
    supported_by:
    - reference_id: GO_REF:0000002
    - reference_id: PMID:28826487
    - reference_id: PMID:36797229
    - reference_id: PMID:19506035
    proposed_replacement_terms:
    - id: GO:0007157
      label: heterophilic cell-cell adhesion
- annotation_index: 7
  source_annotation:
