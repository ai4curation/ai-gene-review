  review:
    summary: Retain epithelial differentiation as a conserved developmental role.
    action: KEEP_AS_NON_CORE
    reason: 'FAT4 descends from the actual epithelial-differentiation IBD at PTN008601578. The later IBD
      snapshot adds a Dachsous donor relative to the frozen GOA list; both source versions are preserved.
      Mammalian corroboration comes from Fat4-null nephron progenitors and co-culture with Fat4-expressing
      cells: extracellular Fat4 signaling promotes an epithelial differentiation program, including E-cadherin,
      rather than merely being consumed by differentiation. This kidney stromal–progenitor mechanism is
      distinct from neuronal differentiation out of neuroepithelium and is retained as non-core. The identity
      of the neighboring receptor and all downstream kinase steps were not resolved by that study.'
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:23974041
- annotation_index: 13
  source_annotation:
    term:
      id: GO:0035329
      label: hippo signaling
    evidence_type: ISS
    original_reference_id: GO_REF:0000024
    qualifier: involved_in
    supporting_entities:
    - UniProtKB:Q2PZL6
  review:
    summary: Retain context-dependent Hippo/YAP signaling with explicit mechanistic limits.
    action: KEEP_AS_NON_CORE
    reason: Mouse Q2PZL6 carries an IMP source annotation to PMID:24056717. The accessible original supplement
      shows reduced phospho-Yap after Fat4 knockdown in P19 cells (Figure S7), and cortical Yap co-knockdown
      rescues proliferation/differentiation defects (Figures S4 and S8). Kidney experiments independently
      link Fat4 to Yap phosphorylation and localization. These are positive signaling results sufficient
      to retain this broad, tissue-dependent annotation; they do not identify every MST/LATS step. In
      contrast, the heart study finds an AMOTL1-dependent route that bypasses altered Hippo-kinase/Yap
      phosphorylation, and liver experiments do not show the fly-like growth phenotype. No universal fly
      Fat–Dachs mechanism or universal absence of Hippo participation is inferred. The main body of PMID:24056717
      remains inaccessible; its cited supplement experiments were read directly.
    supported_by:
    - reference_id: GO_REF:0000024
    - reference_id: PMID:24056717
    - reference_id: PMID:23974041
    - reference_id: PMID:28239148
    - reference_id: PMID:23563179
