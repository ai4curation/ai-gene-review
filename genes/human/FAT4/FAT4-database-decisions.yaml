        comment: Independent endogenous cortex localization and EM distinguish Fat4 subapical apposition
          from beta-catenin-defined adherens junctions. This supports the proposed apical-compartment
          refinement; it does not establish universal exclusion from all junctional contexts.
      residue_claims_not_applicable: This is an experimentally resolved compartment distinction, not a
        residue gain/loss argument.
- annotation_index: 5
