  review:
    summary: FAT4 has a calcium-binding extracellular cadherin architecture.
    action: ACCEPT
    reason: The actual FAT4 sequence matches the four cited cadherin/EGF InterPro records. Independently,
      the human FAT4 EC1–4–DCHS1 crystal structures resolve calcium ions at interdomain junctions, and
      purified human fragments bind heterophilically. This supports calcium binding by the extracellular
      protein; it does not imply that every EC linker binds calcium or that all splice products preserve
      the tested N-terminal region.
    supported_by:
    - reference_id: GO_REF:0000002
    - reference_id: PMID:36797229
