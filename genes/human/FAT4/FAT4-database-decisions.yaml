  review:
    summary: The broad adhesion term is covered by retained specific adhesion annotations.
    action: TOO_GENERAL
    reason: The IPR020894 mapping is biologically compatible with FAT4, but cell adhesion is an ancestor
      of the retained heterophilic cell-cell adhesion (GO:0007157, row 7) and cadherin-mediated cell-cell
      adhesion (GO:0044331, row 14). Human FAT4–DCHS1 assays provide the specific mechanism; retaining
      the broad parent adds no functional resolution.
