  review:
    summary: Retain generation of neurons as a developmental output of FAT4 signaling.
    action: KEEP_AS_NON_CORE
    reason: The captured ARBA00027116 consequence is genuine, although all FunFam eligibility conditions
      were not reproduced. Independent mouse cortical Fat4 knockdown, differentiation-marker and Yap rescue
      experiments in the original PMID:24056717 supplement support the neuronal-generation/differentiation
