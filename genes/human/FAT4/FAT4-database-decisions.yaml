- annotation_index: 4
  source_annotation:
    term:
      id: GO:0005912
      label: adherens junction
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: is_active_in
    supporting_entities:
    - FB:FBgn0003391
    - PANTHER:PTN001931937
    - UniProtKB:Q9NYQ8
    - WB:WBGene00001980
  review:
    summary: Refine the classical adherens-junction inference to the experimentally supported apical compartment.
    action: MODIFY
    reason: FAT4 is inside the actual PTN001931937 IBD clade, so this is a biological scope refinement,
      not a missing-tree or donor-count objection. In mouse embryonic cortex, endogenous Fat4 lies more
      apically than the beta-catenin-marked adherens junction. Knockdown and electron microscopy distinguish
      a Fat4-dependent subapical membrane apposition from the neighboring adherens junction. Independent
      electron tomography also distinguishes these structures. The broad cadherin-clade location should
      therefore not identify this atypical junction as a classical adherens junction. Apical part of cell
      captures the positive compartment evidence without denying context-dependent junctional interactions
      elsewhere.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:19506035
    - reference_id: PMID:25355906
    proposed_replacement_terms:
    - id: GO:0045177
      label: apical part of cell
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001931937
        source_label: PTN001931937
        source_status: UNRESOLVED
        comment: The actual IBD node lies above FAT4 in the recovered PTHR24026 tree. This verifies the
          ancestry; it does not resolve whether the classical adherens-junction compartment matches the
          experimentally distinct Fat4 subapical apposition.
      - source_id: UniProtKB:Q2PZL6
