  review:
    summary: Retain the conserved cerebral-cortex developmental role.
    action: KEEP_AS_NON_CORE
    reason: The mouse Q2PZL6 donor has a genuine IMP annotation to PMID:19506035. Its mouse in-utero knockdown,
      endogenous immunolocalization and ultrastructure show that Fat4 maintains neuroepithelial subapical
      membrane organization. The later cortical knockdown/rescue experiments corroborate a role in progenitor
      differentiation and neuron placement. This is a tissue-specific developmental consequence of the
      receptor/adhesion system, not a separate molecular activity or proof of an identical mechanism in
      all human cell types.
