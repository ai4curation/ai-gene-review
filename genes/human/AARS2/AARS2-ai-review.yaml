- id: PMID:21549344
  title: Exome sequencing identifies mitochondrial alanyl-tRNA synthetase mutations in
    infantile mitochondrial cardiomyopathy.
  full_text_unavailable: false
  findings:
  - statement: >-
      The foundational human genetics study identified AARS2 as encoding the
      mitochondrial alanyl-tRNA synthetase.
    supporting_text: >-
      Rigorous data analysis allowed us to identify a homozygous missense mutation
      in AARS2, which we showed to encode the mitochondrial alanyl-tRNA synthetase
      (mtAlaRS).
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text recovered with the supported publication fetcher on 2026-09-25. Figure 3D
      directly shows AARS2-GFP targeting mitochondria in HEK293T cells. Variant-specific aminoacylation
      and editing defects were proposed by homology modeling, while cultured patient cells
      had no detected mitochondrial translation defect under the conditions tested. Later
      direct biochemistry supports the enzyme identity; the 2011 modeling must not be quoted
      as measured variant kinetics.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      The primary HuRI supplement and UniProt/IntAct independently confirm the
      EHHADH-AARS2 and PTPA-AARS2 binary pairs. The source provides no native-complex
      context or AARS2-specific mechanism, so it validates pair provenance but not a
      useful core molecular function.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in
    cellular context.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full Supplementary Table S1 directly identifies Q5JTZ9/AARS2 in this dataset and
      assigns it to MitoCoP, with concordant subtractive, spatial and importomics
      classifications. This is valid high-throughput mitochondrial-localization evidence
      and is independently corroborated by targeted and biochemical studies.
- id: PMID:29228266
  title: Editing activity for eliminating mischarged tRNAs is essential in mammalian
    mitochondria.
  full_text_unavailable: false
  findings:
  - statement: >-
      Recombinant mature human AARS2 misactivates serine sufficiently to require
      proofreading.
    supporting_text: >-
      HmtAlaRS misactivated Ser with a discriminator factor of 1/569 (Table 1),
      which is significantly larger than 1/3300, the proposed threshold for
      frequency of errors in protein synthesis (31), suggesting that mtAlaRS
      requires editing function to prevent Ala-to-Ser misincorporation in
      mitochondria.
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: >-
      Human AARS2 directly performs post-transfer editing of Ser-tRNAAla; editing-domain
      substitutions impair this activity while largely preserving charging.
    supporting_text: >-
      In vitro aminoacylation assay indicated that the mutants C749A and V760E
      displayed only slightly decreased tRNAAla charging activity compared with wild
      type mtAlaRS (Figure 1D). Determination of post-transfer editing of mischarged
      Ser-tRNAAla showed that the C749A mutant was severely defective in editing
      while the initial velocity of the post-transfer editing activity of the V760E
      mutant was only slightly reduced (Figure 1E and F).
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary direct evidence using recombinant mature human AARS2. The biochemical
      Ser-editing assays are human in vitro experiments; evidence that editing is
      essential in vivo comes from homozygous editing-deficient mouse knock-ins.
- id: PMID:30262995
  title: Overexpression of human mitochondrial alanyl-tRNA synthetase suppresses
    biochemical defects of the mt-tRNA(Ala) mutation in cybrids.
  full_text_unavailable: false
  findings:
  - statement: >-
      AARS2 overexpression increases charging of mutant human mt-tRNAAla and improves
      mitochondrial translation.
    supporting_text: >-
      In this study, AARS2 overexpression did not result in a detectable increase of
      the mutated mt-tRNAAla but caused an increase incharged mt-tRNAAla in mutant
      cybrids, leading to enhanced mitochondrial translation. This strongly suggested
      that AARS2 improved the aminoacylation activity rather than preventing the
      degradation of mt-tRNAAla 5655A>G.
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Human-cell evidence supporting mitochondrial mt-tRNAAla charging and downstream
      translation. The system consists of transmitochondrial cybrids carrying
      pathogenic m.5655A>G plus AARS2 overexpression, so it is rescue evidence rather
      than a basal wild-type kinetic assay. The cached text itself contains the word
      form "incharged" and it is retained verbatim.
- id: PMID:30285085
  title: Instability of the mitochondrial alanyl-tRNA synthetase underlies fatal
    infantile-onset cardiomyopathy.
  full_text_unavailable: false
  findings:
  - statement: >-
      The cardiomyopathy-associated p.Arg580Trp variant primarily destabilizes AARS2
      rather than abolishing its charging or editing chemistry.
    supporting_text: >-
      Taken together, our data suggest that the p.Arg580Trp variant impacts on
      stability of mt-AlaRS protein but not aminoacylation or editing activities and
      that the β-barrel subdomain has a critical role in protein folding and
      stability.
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Includes human patient fibroblast, skeletal-muscle and cardiac-tissue data,
      recombinant human enzyme assays, and HEK293T stability assays. The conclusion
      is variant-specific and must not be generalized to all AARS2 disease alleles.
- id: PMID:30952159
  title: The G3-U70-independent tRNA recognition by human mitochondrial alanyl-tRNA
    synthetase.
  full_text_unavailable: false
  findings:
  - statement: >-
      Human mitochondrial AARS2 is monomeric and recognizes mt-tRNAAla without the
      canonical G3-U70 identity pair.
    supporting_text: >-
      In the present study, we found that hmtAlaRS is a monomer and recognizes
      mitochondrial tRNAAla in a G3-U70-independent manner, requiring several
      elements in the acceptor stem.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      Human AARS2 misactivates glycine and has strong tRNA-independent pre-transfer
      editing against glycine.
    supporting_text: >-
      In addition, we found that hmtAlaRS misactivates noncognate Gly and catalyzes
      strong transfer RNA (tRNA)-independent pre-transfer editing for Gly.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: Human AARS2 also performs post-transfer editing of Gly-tRNAAla.
    supporting_text: >-
      However, it synthesized more mischarged Gly-tRNAAla than did the wild-type
      hmtAlaRS, comparable with our previously constructed editing-defective C749A
      (42) (Figure 5D and E), supporting its defect in editing. Indeed, the result of
      the post-transfer editing assay showed that hmtAlaRS-R663E was unable to
      hydrolyze Gly-tRNAAla (Figure 5F).
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Strongest direct support for human Gly-tRNAAla editing. Enzymology used
      recombinant human AARS2 and in-vitro-transcribed human mt-tRNAAla. Monomeric
      state was additionally tested by co-immunoprecipitation in HEK293T cells; the
      data do not support a stable-complex core function.
- id: PMID:32080176
  title: Relaxed sequence constraints favor mutational freedom in idiosyncratic metazoan
    mitochondrial tRNAs.
  full_text_unavailable: false
  findings:
  - statement: Purified human mitochondrial AARS2 selectively charges cognate
      mt-tRNAAla.
    supporting_text: >-
      Hs mt AlaRS charges cognate mt tRNAAla but not mt tRNAs specific for Asp, Leu,
      or Ser.
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: >-
      The AARS2 C-Ala domain helps fold and recognize the structurally flexible human
      mitochondrial tRNAAla elbow.
    supporting_text: >-
      The appended C-Ala domain, which plays an auxiliary role in prokaryotic AlaRSs
      and is dispensable for aminoacylation in the human cytoplasmic AlaRS
      system43,44, plays a central role as a folding aid for the intrinsically
      flexible mt tRNA elbow. Fine-tuned induced-fit adaptation selects mt tRNAAla
      and rejects non-cognate mt tRNAs (Supplementary Fig. 7g).
    reference_section_type: DISCUSSION
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct human charging and substrate-discrimination evidence using purified
      mature AARS2 and unmodified in-vitro-transcribed tRNAs. Crystal structures
      concern isolated human C-Ala fragments; the full-length AARS2-tRNA complex was
      modeled rather than crystallized.
- id: PMID:38163844
  title: Hypoxia induces mitochondrial protein lactylation to limit oxidative
    phosphorylation.
  full_text_unavailable: false
  findings:
  - statement: >-
      Recombinant AARS2 directly catalyzes ATP- and lactate-dependent lactylation of
      PDHA1 and CPT2 substrate peptides.
    supporting_text: >-
      AARS2 lactylated the synthetic K336-containing PDHA1 peptide as well as the
      K457/8-containing CPT2 peptide (Fig. 5b; Supplementary information, Fig. S6b)
      via lactate- and ATP-dependent and pyrophosphate-inhibitable mechanisms.
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: >-
      AARS2-dependent PDHA1 and CPT2 lactylation was observed under high-lactate
      conditions.
    supporting_text: >-
      Treatment with 10 mM Me-Lac increased the Lac-K336 and Lac-K457/8 levels of
      ectopically expressed PDHA1 (Fig. 5d) and CPT2 (Fig. 5e) in C2C12 and HL-1
      cells (Supplementary information, Fig. S6g). However, the lactylation was not
      observed when Aars2 was knocked out (Fig. 5d, e).
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct support for conditional AARS2 lactyltransferase activity, with hypoxia
      and high lactate as central contexts. Cellular physiology and in-vivo evidence
      are predominantly from mouse cells and mice. Cytoplasmic AARS2 detected during
      hypoxia was also in mouse cells and is not direct basal human localization
      evidence.
- id: PMID:39322678
  title: AARS1 and AARS2 sense L-lactate to regulate cGAS as global lysine
    lactyltransferases.
  full_text_unavailable: false
  findings:
  - statement: >-
      AARS1 and AARS2 bind L-lactate and directly catalyze ATP-dependent lysine
      lactylation.
    supporting_text: >-
      Here we identify the alanyl-tRNA synthetases AARS1 and AARS2 (AARS1/2) as
      intracellular L-lactate sensors required for L-lactate to stimulate the lysine
      lactylome in cells. AARS1/2 and the evolutionarily conserved Escherichia coli
      orthologue AlaRS bind to L-lactate with micromolar affinity and they directly
      catalyse L-lactate for ATP-dependent lactylation on the lysine acceptor end.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      Under elevated L-lactate, AARS2 associates with and lactylates cGAS, inhibiting
      cGAS.
    supporting_text: >-
      In response to L-lactate, AARS2 associates with cyclic GMP-AMP synthase (cGAS)
      and mediates its lactylation and inactivation in cells and in mice.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and publisher full text were independently read on 2026-09-25; the standard
      cache remains abstract-only because PubMed supplies no PMC record. Figure 3 and Extended
      Data Figure 4 document purified human AARS2 chemistry. Extended Data Figure 5h tests
      human THP1 cells; 5g reports endogenous AARS2-cGAS proximity in HeLa cells after 25
      mM NaLac for 24 h. These support the conditional human mechanism but do not identify
      the precursor/mature AARS2 species or route to cGAS. Mouse conditional genetics supplies
      the in-vivo immune evidence. See notes for the publisher URL and assay boundaries.
- id: PMID:40835008
  title: Class I histone deacetylases catalyze lysine lactylation.
  full_text_unavailable: false
  findings:
  - statement: >-
      AARS1 or AARS2 depletion does not reduce global basal lysine lactylation in the
      untreated proliferating HEK293T model.
    supporting_text: >-
      To compare the relative contribution of AARS enzymes towards global basal
      levels of Kla in cells, we used siRNA to knockdown AARS1 and AARS2. However,
      the knockdown of either enzyme did not alter Kla levels (Fig. S6, B–E),
      suggesting the AARS pathway is also not required for global lysine lactylation.
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Essential counter-scope for the global-lactyltransferase framing. This result
      concerns global basal Kla in untreated proliferating HEK293T cells and does not
      refute target-specific AARS2 activity under hypoxia, high lactate, glucose
      starvation, or other induced conditions.
- id: PMID:40301335
  title: AARS2-catalyzed lactylation induces follicle development and premature ovarian
    insufficiency.
  full_text_unavailable: false
  findings:
  - statement: >-
      AARS2-dependent PDHA1/CPT2 lactylation occurs in a human granulosa-cell model,
      and the POI-associated R199C variant has increased activity.
    supporting_text: >-
      AARS2 deletion abrogated PDHA1 K336 and CPT2 K457/8 lactylation in the human
      granulosa cell line COV343 [38], and R199C exhibited a higher ability to
      lactylate PDHA1 K336 and CPT2 K457/8 in AARS2−/− COV343 cells (Fig. 3A, B).
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Human-cell and recombinant-protein evidence for conditional substrate-specific
      lactyltransferase activity, centered on ovarian disease variants and supported
      in vivo by mouse ovarian models. The prose calls the line COV343 whereas the
      adjacent figure legend calls it COV434; the cached quote is preserved while the
      internal model-label inconsistency is flagged.
