    label: mitochondrion
- description: >-
    As a conditional secondary activity under hypoxia or elevated intracellular
    lactate, AARS2 uses lactate and ATP to transfer lactyl groups to protein lysines.
    Directly demonstrated mitochondrial substrates include PDHA1 and CPT2. This is a
    context- and substrate-dependent activity. AARS2 depletion did not lower basal
    global lysine lactylation in the untreated HEK293T cells tested.
    The reported cGAS signaling outcome is non-core because the route by which
    mitochondrial AARS2 encounters cytosolic or nuclear cGAS remains unresolved.
  supported_by:
  - reference_id: PMID:38163844
    supporting_text: >-
      AARS2 lactylated the synthetic K336-containing PDHA1 peptide as well as the
      K457/8-containing CPT2 peptide (Fig. 5b; Supplementary information, Fig. S6b)
      via lactate- and ATP-dependent and pyrophosphate-inhibitable mechanisms.
