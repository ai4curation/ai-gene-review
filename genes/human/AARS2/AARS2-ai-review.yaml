    label: mitochondrion
- description: >-
    Hydrolyzes incorrectly charged Gly-tRNA(Ala), providing a second substrate-specific post-transfer
    proofreading reaction. Human AARS2 also removes glycine errors by strong pre-transfer
    editing; these assays do not establish the relative contribution of each route in intact
    human mitochondria.
  supported_by:
  - reference_id: PMID:30952159
    supporting_text: Indeed, the result of the post-transfer editing assay showed that
      hmtAlaRS-R663E was unable to hydrolyze Gly-tRNAAla (Figure 5F).
  molecular_function:
    id: GO:0106026
    label: Gly-tRNA(Ala) deacylase activity
  directly_involved_in:
  - id: GO:0106074
    label: aminoacyl-tRNA metabolism involved in translational fidelity
  locations:
