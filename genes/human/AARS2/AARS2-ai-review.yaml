core_functions:
- description: >-
    In mitochondria, AARS2 activates L-alanine with ATP and transfers it to mitochondrial
    tRNA(Ala), producing Ala-tRNA(Ala) for mitochondrial translation. This organelle-specific
    aminoacylation reaction is the enzyme's primary conserved activity.
  supported_by:
  - reference_id: PMID:32080176
    supporting_text: >-
      Hs mt AlaRS charges cognate mt tRNAAla but not mt tRNAs specific for Asp, Leu,
      or Ser.
  - reference_id: PMID:30262995
    supporting_text: >-
      In this study, AARS2 overexpression did not result in a detectable increase of
      the mutated mt-tRNAAla but caused an increase incharged mt-tRNAAla in mutant
      cybrids, leading to enhanced mitochondrial translation. This strongly suggested
      that AARS2 improved the aminoacylation activity rather than preventing the
      degradation of mt-tRNAAla 5655A>G.
  molecular_function:
    id: GO:0004813
    label: alanine-tRNA ligase activity
  directly_involved_in:
  - id: GO:0070143
    label: mitochondrial alanyl-tRNA aminoacylation
  locations:
  - id: GO:0005739
    label: mitochondrion
- description: >-
    Hydrolyzes incorrectly charged Ser-tRNA(Ala) through its embedded editing apparatus, protecting
    the fidelity of mitochondrial translation. Direct recombinant human AARS2 assays distinguish
    this post-transfer editing reaction from alanine charging.
  supported_by:
  - reference_id: PMID:29228266
    supporting_text: >-
      Determination of post-transfer editing of mischarged Ser-tRNAAla showed that
      the C749A mutant was severely defective in editing while the initial velocity
      of the post-transfer editing activity of the V760E mutant was only slightly
      reduced (Figure 1E and F).
  molecular_function:
    id: GO:0002196
    label: Ser-tRNA(Ala) deacylase activity
  directly_involved_in:
