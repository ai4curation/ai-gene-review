- id: PMID:42010330
  title: PCBP1 regulates alternative splicing of AARS2 in congenital cardiomyopathy.
  full_text_unavailable: false
  findings:
  - statement: >-
      PCBP1-binding motifs and human PCBP1 are required for inclusion of AARS2 exon
      16 in human cell-based minigene assays.
    supporting_text: >-
      We found that mutations of either PCBP1 site 1 or site 2, or canonical splice
      donor or acceptor sites, are sufficient to cause exclusion of AARS2 exon-16
      (Fig. 1l,m). Knockdown of human PCBP1 in both systems shows a similar pattern
      of AARS2 exon-16 exclusion (Fig. 1l,m and Extended Data Fig. 1c).
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Human AARS2 exon-16 minigenes were tested in HEK293T cells and hiPSC-derived
      cardiomyocytes; extensive causal heart-development and OXPHOS evidence comes
      from mouse conditional genetics. This supports regulated transcript processing
      and a loss-of-function disease mechanism, not a distinct stable AARS2 protein
      isoform with a proven alternative activity.
- id: Reactome:R-HSA-380177
  title: alanine + tRNA(Ala) + ATP => Ala-tRNA(Ala) + AMP + pyrophosphate
  findings:
  - statement: >-
      Reactome represents AARS2-catalyzed mitochondrial alanine-tRNA charging.
    supporting_text: >-
      AARS2 (mitochondrial alanyl tRNA synthetase) catalyzes the reaction of alanine,
      mitochondrial tRNA(Ala), and ATP to form Ala-tRNA(Ala), AMP, and pyrophosphate.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The reaction chemistry and mitochondrial substrate are correct and match later
      direct human biochemical evidence. Reactome explicitly states that this event
      was originally inferred computationally from other characterized mitochondrial
      tRNA synthetases, so it is pathway/database support rather than independent
      experimental evidence for AARS2.
- id: file:human/AARS2/AARS2-uniprot.txt
  title: UniProtKB/Swiss-Prot record for human AARS2 (Q5JTZ9)
  findings:
  - statement: >-
      UniProt records alanine charging and editing of incorrectly charged tRNAAla as
