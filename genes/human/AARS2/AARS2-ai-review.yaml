id: Q5JTZ9
gene_symbol: AARS2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AARS2 is a nuclear-encoded, monomeric class II alanyl-tRNA synthetase that is
  imported into mitochondria. It activates L-alanine with ATP and transfers alanine
  to mitochondrial tRNA(Ala), supplying Ala-tRNA(Ala) for mitochondrial translation.
  Its editing apparatus hydrolyzes mischarged Ser-tRNA(Ala) and Gly-tRNA(Ala), thereby
  preserving mitochondrial translational fidelity, while its C-Ala domain contributes
  to recognition of the structurally idiosyncratic mitochondrial tRNA(Ala). Under
  hypoxia or elevated intracellular lactate, AARS2 can additionally use ATP and lactate
  to lactylate protein lysines on mitochondrial substrates such as PDHA1 and CPT2.
  Lactate-responsive cGAS lactylation has also been reported, although how mitochondrial
  AARS2 accesses cytosolic or nuclear cGAS remains unresolved, and AARS2 is not required
  for basal global lysine lactylation in untreated HEK293T cells. Pathogenic biallelic
  variants can impair AARS2 abundance or alanine charging and cause tissue-selective
  mitochondrial disease, including infantile cardiomyopathy and leukodystrophy with
  ovarian failure.
