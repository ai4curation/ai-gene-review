      CC       ECO:0000269|PubMed:21549344}.
    reference_section_type: DATABASE_ENTRY
  - statement: >-
      UniProt flags the unresolved compartmental access underlying AARS2-mediated
      cGAS lactylation.
    supporting_text: |-
      CC   -!- CAUTION: Given that AARS2 is a mitochondrial protein, it is unclear how
