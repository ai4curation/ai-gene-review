    label: mitochondrion
knowledge_gaps:
- gap_statement: >-
    The relative in vivo contributions of AARS2 pre-transfer and post-transfer editing
    to clearance of glycine errors, and the physiological balance between glycine and
    serine mischarging of mitochondrial tRNA(Ala), remain unresolved in human cells.
  boundary: >-
    Purified human AARS2 directly edits both Gly-tRNA(Ala) and Ser-tRNA(Ala), with
    biochemical evidence for strong glycine pre-transfer editing and post-transfer
    hydrolysis of both mischarged products. These assays establish the activities but
    do not quantify their separate contributions under endogenous mitochondrial
    substrate concentrations.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the editing pathway used for each error would clarify which proofreading
    defect drives mitochondrial mistranslation in different AARS2 alleles and metabolic
    states.
  resolution: >-
    Use separation-of-function AARS2 variants in human cells and directly quantify
    aminoacylated and mischarged mitochondrial tRNA(Ala), together with Ala-to-Ser and
    Ala-to-Gly substitutions in newly synthesized mitochondrial proteins.
  provenance:
  - reference_id: PMID:29228266
    supporting_text: >-
      Determination of post-transfer editing of mischarged Ser-tRNAAla showed that
      the C749A mutant was severely defective in editing while the initial velocity
      of the post-transfer editing activity of the V760E mutant was only slightly
      reduced (Figure 1E and F).
  - reference_id: PMID:30952159
    supporting_text: >-
      Indeed, the result of the post-transfer editing assay showed that hmtAlaRS-R663E
      was unable to hydrolyze Gly-tRNAAla (Figure 5F).
- gap_statement: >-
    The physiological lactate range, cell states, tissues, and substrate spectrum in
    which endogenous AARS2 materially contributes to protein lysine lactylation,
    relative to class I HDACs and other routes, remain incompletely defined.
  boundary: >-
    AARS2-dependent lactylation of PDHA1 and CPT2 is supported under exercise-, hypoxia-,
    or lactate-associated conditions, whereas AARS2 knockdown does not reduce basal
    global lysine lactylation in untreated HEK293T cells.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    A quantitative boundary is needed to distinguish physiological AARS2 substrates
    from high-lactate or overexpression effects and to avoid generalizing a conditional,
    target-specific activity to the basal lactylome.
  resolution: >-
    Quantify endogenous site-resolved lactylation across calibrated intracellular
    lactate and oxygen ranges after acute AARS2 depletion and matched rescue, alongside
    class I HDAC perturbation and measurements of mitochondrial alanine charging.
  provenance:
  - reference_id: PMID:38163844
    supporting_text: >-
      AARS2 lactylated the synthetic K336-containing PDHA1 peptide as well as the
      K457/8-containing CPT2 peptide (Fig. 5b; Supplementary information, Fig. S6b)
      via lactate- and ATP-dependent and pyrophosphate-inhibitable mechanisms.
  - reference_id: PMID:40835008
    supporting_text: >-
      However, the knockdown of either enzyme did not alter Kla levels (Fig. S6, B–E),
      suggesting the AARS pathway is also not required for global lysine lactylation.
- gap_statement: >-
    Which AARS2 species encounters cGAS, and how its mitochondrial import or trafficking permits
    that encounter under elevated lactate, remain unresolved.
  boundary: >-
    Human AARS2-GFP targets mitochondria. The cGAS study reports endogenous AARS2-cGAS proximity
    in human HeLa cells and AARS2-dependent cGAS lactylation in human THP1 cells, but these
    results do not resolve precursor versus mature enzyme or the import/access route. The
    production GO-CAM leaves the AARS2 activity unlocalized. A routine cytosolic or nuclear
    location is therefore not assigned.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Defining the relevant AARS2 species and compartment is necessary to distinguish a
    direct signaling mechanism from indirect metabolic effects and to curate cellular
    locations without over-annotation.
  resolution: >-
    Endogenously tag AARS2 and resolve its precursor and mature forms by quantitative
    fractionation, protease protection, and live-cell imaging during lactate exposure;
    combine this with AARS2-cGAS proximity labeling and mitochondrial-import perturbation.
  provenance:
  - reference_id: file:human/AARS2/AARS2-uniprot.txt
    supporting_text: >-
      CC   -!- CAUTION: Given that AARS2 is a mitochondrial protein, it is unclear how
      CC       it can mediate lactylation of CGAS, which localizes in the cytosol and
      CC       nucleus. {ECO:0000269|PubMed:39322678}.
proposed_new_terms:
- proposed_name: peptidyl-lysine lactylation
  proposed_definition: >-
    A peptidyl-lysine modification process in which a lactyl group is covalently added
    to the epsilon-amino group of a lysine residue within a protein.
  justification: >-
    GO:0141207 captures the ATP-dependent molecular activity but no current biological process
    term captures its immediate protein-modification outcome. The proposed term should be
    placed under GO:0018205 peptidyl-lysine modification and related to the broader GO:0043543
    protein acylation branch; it would support curation of AARS2 and other experimentally
    established lysine lactylation mechanisms without conflating them with downstream signaling
    phenotypes. A live QuickGO ontology search on 2026-09-25 found related delactylase activities
    but no peptidyl-lysine lactylation biological-process term.
  proposed_parent:
    id: GO:0018205
    label: peptidyl-lysine modification
  supported_by:
  - reference_id: PMID:38163844
    supporting_text: >-
      AARS2 lactylated the synthetic K336-containing PDHA1 peptide as well as the
      K457/8-containing CPT2 peptide (Fig. 5b; Supplementary information, Fig. S6b)
      via lactate- and ATP-dependent and pyrophosphate-inhibitable mechanisms.
suggested_questions:
- question: >-
    In human mitochondria, what fractions of glycine and serine errors are prevented
    by AARS2 pre-transfer editing versus cleared by post-transfer deacylation under
    physiological substrate concentrations?
  experts: []
- question: >-
    Across physiological and pathological lactate concentrations, which endogenous
    protein substrates depend materially on AARS2 rather than class I HDACs or other
    lactylation routes, and in which tissues and cell states?
  experts: []
- question: >-
    What AARS2 species and trafficking mechanism permit direct encounter with cGAS,
    and does this involve the mitochondrial precursor, the mature enzyme, or an
    inducible extramitochondrial pool?
  experts: []
suggested_experiments:
- hypothesis: >-
    AARS2 uses mechanistically distinct proofreading routes for glycine and serine
    errors that make different contributions to mitochondrial translational fidelity
    in human cells.
  description: >-
    Introduce matched separation-of-function AARS2 variants into an acute AARS2-depletion
    background, then quantify charging and mischarging of mitochondrial tRNA(Ala) and
    Ala-to-Gly or Ala-to-Ser substitutions in pulse-labeled mitochondrial translation
    products. Complement the cell measurements with pre-transfer and single-turnover
    post-transfer kinetics using purified human AARS2.
  experiment_type: mitochondrial tRNA biochemistry and quantitative mitoproteomics
- hypothesis: >-
    Endogenous AARS2 contributes substantially to a restricted, high-lactate
    mitochondrial lactylome but not to basal global lysine lactylation.
  description: >-
    Use acute endogenous AARS2 degradation across calibrated intracellular lactate and
    oxygen ranges, followed by isotope-resolved quantitative lactyl-proteomics and
    targeted measurement of PDHA1 K336 and CPT2 K457/K458. Rescue with matched-expression
    AARS2 variants that retain alanine charging but differ in lactyltransferase activity,
    and compare with class I HDAC perturbation.
  experiment_type: acute perturbation and quantitative lactyl-proteomics
- hypothesis: >-
    A lactate-responsive AARS2 precursor or inducible extramitochondrial species directly
    encounters cGAS, whereas the mature mitochondrial pool does not.
  description: >-
    Endogenously tag both termini of AARS2, distinguish precursor from mature protein,
    and combine quantitative fractionation, protease protection, live-cell imaging,
    and cGAS-directed proximity labeling before and after lactate exposure. Perturb the
    mitochondrial targeting sequence and import machinery while measuring site-specific
    cGAS lactylation and cGAS-STING signaling, with charging-competent rescue controls.
  experiment_type: compartment-resolved trafficking and proximity analysis
