- gap_statement: >-
    How a mitochondrial AARS2 pool accesses cytosolic or nuclear cGAS for the reported
    lactate-responsive modification is unknown, and no stable extramitochondrial AARS2
    pool or trafficking mechanism has been established.
  boundary: >-
    Reviewed localization evidence places AARS2 in mitochondria, while a cGAS study
    reports AARS2-dependent cGAS lactylation. The compartmental mismatch is explicitly
    unresolved and does not justify assigning a routine cytosolic or nuclear location.
