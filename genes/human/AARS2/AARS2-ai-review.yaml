    hydrolyzes incorrectly attached serine and glycine. Direct human assays establish
    post-transfer Ser-tRNA(Ala) and Gly-tRNA(Ala) deacylation; glycine errors are also
    strongly cleared before transfer. Together these activities protect mitochondrial
    translational fidelity.
  supported_by:
