core_functions:
- description: >-
    SMIM22/CASIMO1 is a single-pass membrane microprotein that binds the sterol-synthesis
    enzyme squalene epoxidase (SQLE) and maintains SQLE protein levels. Higher SMIM22
    increases SQLE protein without changing SQLE mRNA; lower SMIM22 decreases SQLE protein
    and downstream ERK phosphorylation. In breast cancer cells this SQLE-dependent effect
    supports proliferation, cell motility and lipid droplet organisation. Whether SMIM22
    stabilises SQLE against degradation or acts by another post-transcriptional route has
    not been resolved.
  molecular_function:
    id: GO:0019899
    label: enzyme binding
  locations:
  - id: GO:0016020
    label: membrane
  supported_by:
  - reference_id: PMID:29765154
    supporting_text: "CASIMO1 microprotein interacts with squalene epoxidase (SQLE), a key enzyme in cholesterol synthesis and a known oncogene in breast cancer."
  - reference_id: PMID:29765154
    supporting_text: "Overexpression of CASIMO1 leads to SQLE protein accumulation without affecting its RNA levels and increased lipid droplet clustering, while knockdown of CASIMO1 decreased SQLE protein abundance and ERK phosphorylation downstream of SQLE."
  - reference_id: PMID:29765154
    supporting_text: "SQLE knockdown mimicked the CASIMO1 knockdown phenotype and in turn SQLE overexpression fully rescued the effect of CASIMO1 knockdown."
suggested_questions:
- question: >-
    Does SMIM22 stabilise SQLE against degradation? SQLE turnover is controlled by
    cholesterol-induced, MARCHF6-dependent ER-associated degradation. If SMIM22 shields SQLE
    from MARCHF6, protein stabilization (GO:0050821) or a negative regulation of
    ERAD-type term would be justified. The abstract shows only steady-state protein
    accumulation.
  experts:
  - Sven Diederichs
  - Andrew J Brown
- question: >-
    Where does SMIM22 reside at steady state: ER, lipid droplet surface, or late
    endosome? Its partners (SQLE, CANX, DDOST) are ER proteins, yet the only localisation
    recorded in UniProt is a partial late-endosome overlap.
  experts:
  - Sven Diederichs
- question: >-
    Does SMIM22 have a function outside transformed cells, for example in normal mammary
    epithelium or in tissues where it is highly expressed?
suggested_experiments:
- hypothesis: SMIM22 extends the half-life of SQLE by protecting it from MARCHF6-mediated ERAD.
  description: >-
    Measure SQLE half-life by cycloheximide chase in SMIM22-knockdown and SMIM22-overexpressing
    cells, under low and high sterol conditions and with or without MARCHF6 depletion. Test
    whether a SQLE-binding-deficient SMIM22 mutant (for example, with the TM helix or
    cysteine-rich juxtamembrane motif altered) loses the effect.
- hypothesis: SMIM22 is an ER-resident single-pass membrane protein.
  description: >-
    Map the subcellular distribution of endogenous or endogenously tagged SMIM22 by
    co-staining with ER, lipid droplet and LAMP1 markers, and determine its membrane
    topology by protease protection.
