  review:
    summary: >-
      IPI from the CASIMO1 discovery study, listing calnexin (CANX, P27824), the
      oligosaccharyltransferase subunit DDOST (P39656) and squalene epoxidase (SQLE, Q14534)
      as interactors. Bare protein binding says nothing about function.
    action: MODIFY
    reason: >-
      Of the three partners, only SQLE has functional support. SMIM22 raises SQLE protein
      levels, and SQLE knockdown and overexpression are epistatic to SMIM22 knockdown
      (PMID:29765154). CANX and DDOST are abundant ER-membrane proteins that co-purify with
      many ER-inserted transmembrane proteins, so they add no functional information. Enzyme
      binding (GO:0019899) is the most informative supported term for the SQLE interaction.
      A regulator term (for example, enzyme regulator activity) is not used, because the
      abstract reports changes in SQLE protein abundance rather than in its catalytic rate.
    proposed_replacement_terms:
