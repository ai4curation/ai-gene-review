description: >-
  SMIM22, also called CASIMO1 (cancer-associated small integral membrane open reading frame
  1), is an 83-amino-acid microprotein (about 10 kDa) encoded by a short open reading
  frame (sORF). It has a single predicted transmembrane
  helix (residues 32-52), followed by a cysteine-rich juxtamembrane stretch and a short,
  charged, disordered C-terminal tail. A splice isoform inserts five residues into this
  tail. The protein is membrane-associated; it partly overlaps with LAMP1-positive late
  endosomes and co-purifies with the ER membrane proteins calnexin and DDOST. Its best
  supported partner is squalene epoxidase (SQLE), the ER enzyme that catalyses the first
  oxygenation step of sterol synthesis. Raising SMIM22 levels increases SQLE protein
  without changing SQLE mRNA and causes lipid droplets to cluster. Lowering SMIM22
  reduces SQLE protein and ERK phosphorylation. SMIM22 RNA is elevated in hormone
  receptor-positive breast tumours. In breast cancer cell lines, knockdown slows
  proliferation with a G0/G1 arrest, disorganises the actin cytoskeleton and reduces cell
  motility. SQLE knockdown reproduces this phenotype and SQLE overexpression rescues it,
  which places SQLE downstream of SMIM22. A non-translatable mutant does not reproduce the
  overexpression phenotype, so these effects are attributed to the protein rather than to
  the RNA. A single later study in lung cancer cells linked SMIM22 to glycolysis and
  proliferation. Whether SMIM22 has a role in non-transformed cells is unknown.
