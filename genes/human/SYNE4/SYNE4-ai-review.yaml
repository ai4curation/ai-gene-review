  - *id019
  - *id020
  - reference_id: PMID:36211453
    supporting_text: This machinery relies on the interaction between Nesprin-4 and kinesin-1 motors supporting
      a microtubule cargo model for nuclear positioning.
- description: The cytoplasmic region of nesprin-4 binds kinesin-1 through a conserved LEWD motif (of the W-acidic
    type recognized by kinesin light chain TPR domains), acting as a nuclear cargo adaptor.
  molecular_function: *id005
  locations:
