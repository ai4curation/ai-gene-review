core_functions:
- description: 'As the outer-nuclear-membrane KASH subunit of a SUN1-containing LINC complex, nesprin-4 provides
    a kinesin-1 attachment site on the nuclear envelope: its KASH peptide binds SUN1/SUN2 in the perinuclear space
    while its cytoplasmic region binds kinesin-1, coupling the nucleus to microtubule plus-end-directed forces that
    keep the nucleus basally positioned in cochlear outer hair cells.'
