suggested_questions:
- question: Does nesprin-4 bind kinesin light chains through W-acidic (LEWD-like) motifs as nesprin-2 does, and
    which kinesin light chain isoforms (KLC1 vs KLC4) are relevant in cochlear hair cells?
  experts:
  - kinesin biologists
  - nuclear envelope biologists
- question: Is outer hair cell degeneration in SYNE4 deficiency a direct consequence of mispositioned nuclei (e.g.
    altered electromotility or mechanical stress), and should sensory perception of sound be annotated to nesprin-4
    or regarded as a downstream phenotype?
  experts:
  - auditory neuroscientists
  - GO editors
- question: What is the functional significance of zinc coordination by the KASH4 CCSH motif in SUN1-nesprin-4 6:6
    assemblies in vivo?
  experts:
  - structural biologists
suggested_experiments:
- description: Rescue Syne4 knockout outer hair cells (or cultured epithelial cells) with nesprin-4 lacking the
    kinesin-binding region or carrying CCSH-to-SSSS KASH mutations, and assay basal nuclear position and hair cell
    survival.
  hypothesis: Both kinesin-1 binding and stable SUN1-KASH4 assembly are required for nesprin-4 to anchor outer hair
    cell nuclei basally and maintain hair cell viability.
  experiment_type: genetic rescue and imaging
