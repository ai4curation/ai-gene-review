        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Nesprin-4 PAINT node. Membership of the SUN-KASH tethering complex is inherited correctly, but
          the meiosis-specific child does not fit nesprin-4, whose known functions are somatic.
      - source_id: UniProtKB:Q8N205
