  review:
    summary: Nesprin-4 binds kinesin-1 through its cytoplasmic region and SUN1/SUN2 through its luminal KASH peptide,
      providing a kinesin-1 attachment site on the nuclear envelope.
    action: NEW
    reason: 'GOA carries no molecular function for nesprin-4 other than protein binding. The other KASH nesprins
      (SYNE1, SYNE2, SYNE3) and the SUN partners carry GO:0140444 for the same bridging role, so this is the same-role
      comparator and not a process gap. Evidence: kinesin-1 binding via a LEWD motif (abolished by LEWD-to-LEAA
      mutation) and SUN-dependent outer nuclear membrane localization, and human SUN1/SUN2-KASH4 crystal structures.'
    supported_by:
