  review:
    summary: Phylogenetic inference (PAINT node seeded by mouse Syne4) of a role in establishing epithelial apical/basal
      polarity.
    action: KEEP_AS_NON_CORE
    reason: 'The mouse source annotation derives from Roux et al. (2009), in which nesprin-4 expression relocated
      the centrosome and Golgi relative to the nucleus through kinesin-1 binding, suggesting a contribution to secretory
      epithelial organization; the full text is not available here, so the curator''s judgement is respected. However,
      the more specific and better-supported role is kinesin-dependent positioning of the nucleus: in Nesp4 knockout
      mice outer hair cells form and polarize normally but fail to keep their nuclei basal. Nesprin-4 therefore
