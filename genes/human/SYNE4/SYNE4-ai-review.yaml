- term:
    id: GO:0051647
    label: nucleus localization
  evidence_type: ISS
  original_reference_id: PMID:23348741
  qualifier: involved_in
  review:
    summary: Nesprin-4, with SUN1, is required to keep outer hair cell nuclei at the base of the cell; loss of either
      causes apical nuclear displacement followed by hair cell degeneration and hearing loss.
    action: NEW
    reason: 'Participation test: nesprin-4 does part of the work by physically linking the nucleus to kinesin-1
      and the microtubule cytoskeleton (it is the cargo attachment site on the nucleus, as a cargo adaptor is for
      vesicle transport), not merely being required; in vivo, AAV-delivered nesprin-4 carrying a mutated kinesin-binding
      LEWD motif fails to restore basal nuclear position, whereas wild-type nesprin-4 rescues it, showing that the
      nesprin-4 activity itself drives the step. Comparator: the other KASH nesprins that couple motors to the nucleus
      (SYNE1, SYNE2) carry nuclear migration terms. The broader term nucleus localization is chosen because the
      OHC phenotype is failure to maintain nuclear position rather than migration per se. Evidence is from mouse
      knockouts and the human orthologue is associated with the same hearing phenotype (DFNB76).'
    supported_by:
    - *id013
    - *id018
    - &id019
      reference_id: PMID:23348741
      supporting_text: Therefore, we would predict that loss of nesprin-4, and hence kinesin-1, from the cytoplasmic
        face of the NE, should result in an untethering of the nucleus from the microtubule cytoskeleton and a subsequent
        inability to efficiently localize the nucleus to the base of the cell, which is precisely what we observed.
    - &id020
      reference_id: PMID:36211453
      supporting_text: Using in vivo AAV gene delivery, we show that this interaction is critical for nuclear positioning
        and hearing in mice.
    - reference_id: PMID:36211453
      supporting_text: Thus, the LEWD interaction domain in Nesprin-4 is required for proper nuclear positioning,
        hearing function, and survival of OHC.
    - reference_id: PMID:33350593
      supporting_text: Syne4-/- mice have severe-to-profound progressive hearing loss and exhibit mislocalization
        of hair cell nuclei and hair cell degeneration.
    - reference_id: file:human/SYNE4/SYNE4-deep-research-falcon.md
      supporting_text: In Syne4-null OHCs, nuclei progressively move toward the apical region, followed by OHC degeneration
        and hearing loss.
