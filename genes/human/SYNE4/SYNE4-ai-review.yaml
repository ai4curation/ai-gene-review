    reason: Nesprin-4 forms LINC complexes with SUN1 (and SUN2) that couple kinesin-1 and microtubules to the nucleus,
      but its roles are somatic (hair cells, secretory epithelia); there is no evidence of a meiotic function (the
      meiotic KASH protein is KASH5). GO:0034993 is the meiosis-specific child; consistent with the SUN1, SUN2,
      SYNE1 and SYNE2 reviews, the non-meiotic parent GO:0106094 nuclear membrane microtubule tethering complex
      is appropriate, and fits nesprin-4 particularly well as a microtubule-motor-coupled KASH protein.
