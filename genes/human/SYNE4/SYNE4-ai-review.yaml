id: Q8N205
gene_symbol: SYNE4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SYNE4 encodes nesprin-4, a 404-residue member of the nesprin (KASH-domain) family. It has a cytoplasmic
  region containing a coiled-coil, a single spectrin repeat and a kinesin-1-binding region, followed by a C-terminal
  transmembrane KASH domain that anchors it as a tail-anchored protein in the outer nuclear membrane. In the perinuclear
  space the KASH peptide binds the SUN domains of SUN1 and SUN2; nesprin-4 KASH forms 6:6 SUN-KASH assemblies in
  which opposing KASH4 chains coordinate zinc through a conserved CCSH motif, and its nuclear envelope localization
  depends on SUN1. On the cytoplasmic face nesprin-4 binds kinesin-1 (KIF5B/kinesin light chain) through a conserved
  LEWD motif, acting as a nuclear envelope cargo adaptor that couples the nucleus to plus-end-directed microtubule
  motor activity. Ectopic expression relocates the centrosome and Golgi apparatus relative to the nucleus in a kinesin-dependent
  manner. Nesprin-4 is expressed mainly in secretory epithelia and in cochlear hair cells, where a nesprin-4-SUN1
  LINC complex keeps outer hair cell nuclei at the base of the cell; in its absence the nuclei move apically and
  the outer hair cells degenerate after the onset of hearing, and wild-type but not LEWD-mutant nesprin-4 delivered
  by AAV restores nuclear position and hearing in knockout mice. Homozygous truncating SYNE4 variants that fail
  to localize to the outer nuclear membrane cause progressive high-frequency hearing loss (DFNB76).
