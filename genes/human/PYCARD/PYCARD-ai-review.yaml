id: Q9ULZ3
gene_symbol: PYCARD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PYCARD (ASC; also TMS1) is a small 195-residue cytosolic adaptor protein built from only
  two death-fold domains - an N-terminal pyrin domain (PYD) and a C-terminal caspase recruitment domain
  (CARD) joined by a flexible linker - with no catalytic or ligand-sensing module. It is the shared adaptor
  of ASC-dependent inflammasomes. On activation, a sensor (NLRP3, NLRP1, NLRP6, AIM2, IFI16 or pyrin/MEFV)
  nucleates polymerization of the ASC PYD into filaments; the clustered ASC CARDs then nucleate procaspase-1
  CARD filaments, bringing procaspase-1 molecules into proximity for autoprocessing. These filaments condense
  into a single micrometre-scale perinuclear 'speck' (also called the pyroptosome) per cell. Active caspase-1
  matures pro-interleukin-1 beta and pro-interleukin-18 and cleaves gasdermin D to execute pyroptosis.
  ASC thus supplies the connectivity and signal-amplification geometry of the inflammasome rather than
  any enzymatic step. In resting monocytes/macrophages a pool of ASC is nuclear and must redistribute
  to the cytosol for inflammasome function; the protein is otherwise cytosolic. Its activity is tuned
  by post-translational modification (K63 ubiquitination at K174, tyrosine phosphorylation) and by competing
  pyrin-domain-only proteins (POP1/2/3). Released ASC specks persist extracellularly and propagate inflammation.
  Beyond the inflammasome, ASC has context-dependent, inflammasome-independent activities reported in
  apoptosis (as a CARD/pyrin aggregating adaptor engaging caspase-8, caspase-9 and the p53-Bax mitochondrial
  pathway) and in NF-kB and MAPK signalling, where it can both activate and, via IKK suppression and DUSP10
  regulation, dampen downstream cytokine output. PYCARD/ASC is central to the monogenic autoinflammatory
  syndromes driven by its sensor partners and to IL-1-driven inflammatory disease.
