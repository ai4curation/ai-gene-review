- term:
    id: GO:0001773
    label: myeloid dendritic cell activation
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00089633
  review:
    summary: Electronic (ARBA) myeloid dendritic cell activation.
    action: KEEP_AS_NON_CORE
    reason: ASC's reported role in dendritic-cell function is a secondary, inflammasome-independent effect,
      and much of the mouse DC/antigen-presentation phenotype attributed to ASC was later shown to be
      a Dock2 passenger-mutation artifact (PMID:22905357). An electronic activation term is an over-annotation.
    supported_by:
    - reference_id: PMID:22905357
      supporting_text: 'Addendum: defective Dock2 expression in a subset of ASC-deficient mouse lines.'
- term:
    id: GO:0001773
    label: myeloid dendritic cell activation
  evidence_type: IMP
  original_reference_id: PMID:22732093
  qualifier: involved_in
  review:
    summary: ASC knockdown impairs human dendritic-cell maturation and their capacity to stimulate T cells
      (RNAi in human monocyte-derived DCs).
    action: KEEP_AS_NON_CORE
    reason: Experimental (IMP) support in human DCs via RNAi (PMID:22732093), independent of the mouse
      Dock2 confound. This is a genuine but secondary, non-core role of ASC distinct from its canonical
      inflammasome-adaptor function.
    supported_by:
    - reference_id: PMID:22732093
      supporting_text: RNAi mediated inhibition of the inflammasome component ASC leads to marked inhibition
        of the capacity of lipopolysachharide (LPS)-matured DCs to stimulate antigen-specific T cells.
- term:
    id: GO:0002020
    label: protease binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:G3V8L1
  - ensembl:ENSRNOP00000026699
  review:
    summary: Electronic protease-binding transfer from the rat ortholog.
    action: REMOVE
    reason: Uninformative bare-binding molecular function propagated electronically from a rat ortholog;
      ASC's biologically meaningful proteolysis link (procaspase-1 activation) is captured by GO:0140608
      cysteine-type endopeptidase activator activity. The bare term adds nothing.
- term:
    id: GO:0002020
    label: protease binding
  evidence_type: IPI
  original_reference_id: PMID:24407287
  qualifier: enables
  supporting_entities:
  - UniProtKB:P98073
  review:
    summary: Protease-binding from a PML-focused interactome screen.
    action: MARK_AS_OVER_ANNOTATED
    reason: This 'protease binding' derives from a single PML-centred proteomic interaction dataset and
      names enteropeptidase (an intestinal serine protease unrelated to ASC biology). This interaction
      is reported only from a single PML-focused proteomic interaction screen (PMID:24407287); it does
      not describe an informative, reproducible molecular function of ASC and reads as a high-throughput
      interactome artifact rather than a biologically meaningful binding activity.
- term:
