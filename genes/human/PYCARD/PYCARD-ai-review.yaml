  - UniProtKB:Q9C000
  - UniProtKB:Q9Y2G2
  review:
    summary: Phylogenetic assignment of pattern-recognition-receptor activity.
    action: REMOVE
    reason: 'ASC is the inflammasome adaptor, not a sensor: it has only PYD and CARD death-fold domains
      and lacks the LRR/NACHT/HIN ligand-recognition modules that confer PRR activity. The function arose
      in the NLR/ALR sensors of this PANTHER family (e.g. NLRP1), not in ASC, so the IBA is mis-propagated
      to the adaptor.'
    supported_by:
    - reference_id: PMID:24630722
      supporting_text: The adaptor protein ASC bridges the sensor proteins and caspase-1 to form ternary
        inflammasome complexes, achieved through pyrin domain (PYD) interactions between sensors and ASC
        and through caspase activation and recruitment domain (CARD) interactions between ASC and caspase-1.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN005327833
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node-level PRR activity reflects the NLR/ALR sensor members; ASC is the adaptor and does
          not itself recognize a molecular pattern.
