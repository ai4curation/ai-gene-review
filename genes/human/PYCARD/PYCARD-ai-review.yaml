- description: Through its clustered CARD filament ASC nucleates procaspase-1 CARD filaments, driving
    proximity-induced autoactivation of caspase-1 that matures IL-1 beta and IL-18 and drives gasdermin-D-dependent
    pyroptosis. This is the catalytic output ASC enables (without itself being an enzyme).
