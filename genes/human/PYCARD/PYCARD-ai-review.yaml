    label: activation of innate immune response
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1931465
  - PANTHER:PTN005327833
  - UniProtKB:Q9C000
  - UniProtKB:Q9ULZ3
  - UniProtKB:Q9Y2G2
  review:
    summary: ASC-dependent inflammasomes activate caspase-1 and the innate immune response; phylogenetically
      inferred.
    action: ACCEPT
    reason: IBA from the inflammasome-family node. ASC is the shared adaptor that activates caspase-1
      across multiple inflammasomes, so participation in activation of the innate immune response is correct.
    supported_by:
    - reference_id: PMID:24630722
      supporting_text: The adaptor protein ASC bridges the sensor proteins and caspase-1 to form ternary
        inflammasome complexes, achieved through pyrin domain (PYD) interactions between sensors and ASC
        and through caspase activation and recruitment domain (CARD) interactions between ASC and caspase-1.
