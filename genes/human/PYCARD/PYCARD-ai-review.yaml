suggested_questions:
- question: Which of ASC's reported inflammasome-independent activities (NF-kB modulation via IKK, MAPK/DUSP10-driven
    chemokine output, caspase-8/Bax apoptosis) occur at endogenous ASC levels in primary human cells,
    as opposed to overexpression systems?
- question: Are any of the dendritic-cell, antigen-presentation, actin-polymerization, phagocytosis and
    T-cell annotations genuine ASC functions in human cells, given that the mouse phenotypes were attributed
    to a Dock2 passenger mutation present in only some ASC-knockout lines (PMID:22905357)?
suggested_experiments:
- description: Reconstitute endogenous-level ASC in ASC-null human macrophages with separation-of-function
    PYD and CARD point mutants and measure speck formation, caspase-1 activation, IL-1 beta/IL-18 release
    and pyroptosis, to map which residues support each step of the adaptor function.
- description: In Dock2-wild-type and Dock2-mutant isogenic ASC-knockout mouse lines (and CRISPR ASC-knockout
    human DCs), directly test antigen uptake, macropinocytosis, actin polymerization and T-cell priming
    to resolve which adaptive-immunity phenotypes are ASC-intrinsic versus Dock2-confounded.
