existing_annotations:
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IDA
  original_reference_id: PMID:23229815
  qualifier: located_in
  review:
    summary: ASC localizes to Golgi membrane/lipid rafts specifically during respiratory syncytial virus
      infection (HRSV SH viroporin), not as a constitutive location.
    action: KEEP_AS_NON_CORE
    reason: This IDA reflects an infection-specific redistribution of ASC to Golgi lipid rafts seen with
      the HRSV small hydrophobic viroporin, not a resting ASC location. Retained as a non-core, context-specific
      localization; the core sites are cytosol and the assembled speck.
    supported_by:
    - reference_id: PMID:23229815
      supporting_text: SH seems to accumulate within lipid rafts in the Golgi compartments
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
