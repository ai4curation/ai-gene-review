      the Dock2/actin/DC/T-cell annotations as over-annotations.
core_functions:
- description: ASC is the bipartite adaptor that links an activated inflammasome sensor to procaspase-1.
    Its pyrin domain is nucleated into a filament by the sensor (NLRP3, NLRP1, AIM2, NLRP6, IFI16 or pyrin),
    and the clustered CARDs then recruit procaspase-1; this is the defining molecular function of the
    protein and it is purely a connectivity/geometry role with no catalytic activity.
  molecular_function:
    id: GO:0035591
    label: signaling adaptor activity
  directly_involved_in:
