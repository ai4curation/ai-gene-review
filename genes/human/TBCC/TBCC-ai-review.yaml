- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IDA
  original_reference_id: PMID:11847227
  qualifier: enables
  review:
    action: MODIFY
    summary: GTPase activity (GTP + H2O = GDP + phosphate) assigned from Bartolini et al. 2002. The paper
      shows that cofactor C, with cofactors D and E, stimulates GTP hydrolysis by native beta-tubulin,
      and that the conserved arginine R262 acts as an arginine finger. The hydrolysis is catalysed by
      tubulin, not by TBCC.
    reason: TBCC has no GTPase domain (no P-loop or tubulin/FtsZ fold); its C-terminal CARP beta-helix
      domain is the RP2-like GAP module that inserts an arginine finger into the GTPase active site. The
      cited abstract describes stimulation of tubulin GTPase activity, and the UniProt mutagenesis feature
      from the same paper reads "Inhibits stimulation of tubulin GTPase activity". GO:0003924 is defined
      as catalysis of GTP hydrolysis, whereas GO:0005096 GTPase activator activity ("Binds to and increases
      the activity of a GTPase") matches the experiment. The same paper is already annotated to GO:0005096
      by MGI. The essence (TBCC drives tubulin GTP hydrolysis) is right; the term is wrong, so MODIFY
      rather than REMOVE. Flagged by rule FRR:0010.
    proposed_replacement_terms:
    - &id011
      id: GO:0005096
      label: GTPase activator activity
    additional_reference_ids:
