  review:
    action: ACCEPT
    summary: 'GTPase activator activity: TBCC, with TBCD and TBCE, stimulates GTP hydrolysis by beta-tubulin;
      the conserved R262 arginine finger is required.'
    reason: This is the core molecular function of TBCC. The cofactors were shown to act as GAPs for beta-tubulin,
      and GTP hydrolysis by beta-tubulin in the cofactor supercomplex is the switch that releases the
      native heterodimer. Reconstitution with yeast proteins suggests TBCC may also (or instead) activate
      GTP hydrolysis by ARL2 in the TBCD-TBCE-ARL2 complex, and fission yeast Tbc1 is a GAP for Arl2;
      either target is captured by this term.
