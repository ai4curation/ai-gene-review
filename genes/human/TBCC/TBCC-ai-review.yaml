  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TBCC (tubulin folding cofactor C) is a cytosolic tubulin-specific chaperone that acts at
  the final step of the post-chaperonin tubulin folding pathway. After the chaperonin CCT partially folds
  alpha- and beta-tubulin, cofactors A and D, and B and E, capture the subunits, and TBCD and TBCE (with
  the small GTPase ARL2) assemble them into a supercomplex. TBCC then joins and acts as a GTPase-activating
  protein: through the conserved arginine finger (R262) in its C-terminal CARP/beta-helix domain, homologous
  to the GAP domain of RP2, it stimulates GTP hydrolysis that releases the native alpha/beta-tubulin heterodimer.
  In vitro, TBCC with TBCD and TBCE also stimulates GTP hydrolysis by native beta-tubulin. In reconstituted
  yeast proteins it activates the ARL2 GTPase within the TBCD-TBCE-ARL2 cage. Its N-terminal spectrin-like
  domain binds tubulin. TBCC thus governs the supply of polymerization-competent tubulin; altering its
  levels changes the soluble/polymerized tubulin balance and microtubule dynamics. It is mostly cytoplasmic,
  concentrates at centrosomes and spindle poles, and its depletion causes multipolar spindles and mitotic
  failure. In retina it is enriched at the photoreceptor connecting cilium.'
