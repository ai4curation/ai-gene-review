suggested_questions:
- question: Is the physiological GAP target of human TBCC beta-tubulin, ARL2, or both in sequence? The
    Cowan-lab assays measured tubulin GTP hydrolysis, whereas reconstitution with yeast proteins attributes
    the hydrolysis to ARL2 in the TBCD-TBCE-ARL2 cage.
- question: Is TBCC centrosomal enrichment linked to its tubulin-folding role, or does it reflect a separate
    spindle-pole function, given the multipolar spindle phenotype on depletion?
suggested_experiments:
- hypothesis: Human TBCC R262 is the arginine finger for ARL2 GTP hydrolysis within the human TBCD-TBCE-ARL2-tubulin
    complex.
  description: Reconstitute the human TBCD-TBCE-ARL2 complex with alpha/beta-tubulin, add wild-type or
    R262A TBCC, and measure single-turnover GTP hydrolysis using ARL2 locked in the GTP state (Q70L) and
    GTP-locked tubulin to assign which GTPase hydrolyses.
