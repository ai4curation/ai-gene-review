gene_symbol: GPR158
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Atypical class C G protein-coupled receptor of the brain, highly expressed in cortex,
  hippocampus, striatum and the aqueous outflow pathway of the eye. GPR158 is a homodimer built from
  an extracellular Cache-like domain, a seven-transmembrane bundle and a long cytoplasmic coiled-coil;
  it lacks the Venus flytrap ligand-binding domain of other class C receptors. Its defining feature
  is that it does not signal by activating a heterotrimeric G protein. Instead it binds, stabilises
  and allosterically enhances the RGS7-Gbeta5 GTPase-activating complex, recruiting it to the plasma
  membrane and thereby accelerating deactivation of Galpha(i/o) produced by neighbouring receptors;
  through this route GPR158 sets cAMP tone and controls A-type and M-type potassium currents and
  neuronal excitability. Glycine, and more weakly taurine, bind the Cache domain and inhibit the
  associated RGS7-Gbeta5 complex, so GPR158 has been designated a metabotropic glycine receptor;
  this ligand assignment is one of three models advanced for the receptor, alongside a proposed role
  as a neuronal receptor for the bone hormone osteocalcin and a ligand-independent role as a postsynaptic
  organiser. In the latter capacity GPR158 forms a complex with the constitutively active phospholipase
  PLCXD2 that controls spine apparatus abundance and dendritic spine maturation, and it acts as a
  synaptic organiser at hippocampal mossy fibre-CA3 synapses. GPR158 is implicated in stress-induced
  depressive states, cognition, and glucocorticoid-induced ocular hypertension.'
