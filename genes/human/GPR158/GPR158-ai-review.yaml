- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: Nuclear localisation propagated from the UniProt subcellular-location vocabulary, which
      in turn derives from the two ocular-cell studies below.
    action: KEEP_AS_NON_CORE
    reason: Reported by a single group in trabecular meshwork and ocular cells, both for endogenous
      and overexpressed protein, and not reproduced in any of the neuronal or structural work. UniProt
      itself flags the observation as mechanistically unexplained for a multi-pass membrane protein.
      Retained because the underlying observations are experimental and were not read here in full,
      but it cannot be a core location for a dimeric seven-transmembrane receptor whose function is
      to hold RGS7-Gbeta5 at the plasma membrane.
