  review:
    summary: InterPro signature-based assignment of generic G protein-coupled receptor activity.
    action: MODIFY
    reason: Correct in kind but under-specific, and the mechanism the term implies is the one thing
      GPR158 demonstrably does not do. Hajj et al. found no constitutive or canonical activation
      of Go by GPR158 and concluded it acts by trapping Galpha(o) and by scaffolding RGS7-Gbeta5
      rather than by nucleotide exchange. The informative molecular function terms for this receptor
      are the ligand-specific GO:0160079 and the effector-specific GO:0008047, both of which the
      gene already carries with IDA support.
