suggested_experiments:
- hypothesis: Osteocalcin binds the GPR158 Cache domain at a site overlapping or adjacent to the glycine
    site.
  description: Perform quantitative binding measurements (surface plasmon resonance or microscale
    thermophoresis) of recombinant undercarboxylated osteocalcin against the purified GPR158 ectodomain
    and against full-length receptor in nanodiscs, with glycine competition, and attempt a cryo-EM
    structure of the complex. Include the Cache-pocket mutants that abolish glycine responses as specificity
    controls.
  experiment_type: Biophysical binding and structural biology
- hypothesis: Glycine occupancy is required for the spine apparatus and spine maturation phenotypes
    of GPR158.
  description: Rescue Gpr158 knockout cortical neurons in vivo with wild-type GPR158 versus Cache-domain
    pocket mutants that cannot bind glycine but retain RGS7-Gbeta5 and PLCXD2 binding, and score spine
    apparatus incorporation, spine maturation and miniature EPSC properties.
  experiment_type: Structure-function rescue with imaging and electrophysiology
