core_functions:
- molecular_function:
    id: GO:0008047
    label: enzyme activator activity
  description: GPR158 binds the RGS7-Gbeta5 heterodimer through its cytoplasmic coiled-coil and intracellular
    loops, stabilises it against degradation, recruits it to the plasma and postsynaptic membranes,
    and allosterically enhances RGS7 GTPase-activator activity towards Galpha(i/o). This accelerates
    deactivation of G proteins activated by neighbouring receptors and thereby sets local cAMP tone
    and the gating of A-type and M-type potassium currents. Two independent cryo-EM structures resolve
    the GPR158-RGS7-Gbeta5 interface, and loss of GPR158 in mice destabilises RGS7 and strips it from
    membranes.
  directly_involved_in:
  - id: GO:0008277
    label: regulation of G protein-coupled receptor signaling pathway
  - id: GO:0072659
    label: protein localization to plasma membrane
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0098839
    label: postsynaptic density membrane
  supported_by:
  - reference_id: PMID:25792749
    supporting_text: The results of this study establish GPR158 as an essential regulator of RGS7
      in the native nervous system with a critical role in controlling its expression, membrane localization,
      and catalytic activity.
  - reference_id: PMID:22689652
    supporting_text: We show that GPR158/179 recruited RGS complexes to the plasma membrane and augmented
      their ability to regulate GPCR signaling.
  - reference_id: PMID:34815401
    supporting_text: Among class C GPCRs, GPR158 is unique as it lacks a Venus flytrap-fold ligand-binding
      domain and terminates Gαi/o protein signaling through the RGS7-Gβ5 heterodimer.
- molecular_function:
    id: GO:0160079
    label: G protein-coupled glycine receptor activity
  description: Glycine, and with about twofold lower affinity taurine, binds the extracellular Cache-like
    domain of the GPR158 homodimer. Occupancy changes the conformation of the intracellular surface
    and inhibits the GTPase-activator activity of the receptor-bound RGS7-Gbeta5 complex, which prolongs
    Galpha(i/o) activation and lowers cAMP. In neurons this alters intrinsic excitability - suppression
    of the medium afterhyperpolarisation in cortical neurons and Kv7/M-current modulation in nucleus
    accumbens medium spiny neurons. The ligand assignment is the best supported of three competing
    models for GPR158 and has been replicated in an independent laboratory, but osteocalcin has also
    been proposed as a ligand and some GPR158 functions appear to be ligand-independent.
  directly_involved_in:
  - id: GO:0008277
    label: regulation of G protein-coupled receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0098839
    label: postsynaptic density membrane
  knowledge_gaps:
  - gap_statement: Whether glycine is the dominant physiological input to GPR158 in vivo is undetermined,
      and it is unknown whether the bone hormone osteocalcin engages the receptor directly at all.
    boundary: Direct binding of glycine and taurine to the GPR158 Cache domain, the resulting inhibition
      of RGS7-Gbeta5, and the cAMP and excitability consequences are established and independently
      replicated. What is missing is any binding site, affinity or structure for the osteocalcin-GPR158
      pair, which is asserted only from mouse genetics and behaviour.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: GPR158 is being pursued as a drug target for depression and cognition on the strength
      of both ligand models at once; which ligand actually drives the therapeutic phenotype determines
      what a useful agonist or antagonist would have to look like.
    resolution: Quantitative binding measurements of osteocalcin against purified GPR158, with glycine
      competition and with Cache-pocket mutants as controls, plus a structure of any resulting complex.
    provenance:
    - reference_id: PMID:40337551
      supporting_text: Although the precise biological mechanisms underlying the OCN/GPR158 signaling
        pathway remain incompletely understood
  - gap_statement: It is undetermined how much GPR158 function is ligand-gated at all, because the
      postsynaptic GPR158-PLCXD2 module that controls spine apparatus abundance operates with no ligand
      invoked and is instead tuned by extracellular heparan sulfate proteoglycan binding.
    boundary: The GPR158-PLCXD2 interaction, its control of spine apparatus incorporation and spine
      maturation, and its independence from canonical G-protein-mediated PLC regulation are established.
      What is not known is whether glycine occupancy of the Cache domain modulates this arm.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: If the synaptic-organiser arm is ligand-independent, then GPR158 has at least two
      separable outputs and pharmacological blockade of the glycine site would leave the structural
      phenotype untouched.
    resolution: Rescue of Gpr158-null neurons with Cache-pocket mutants that cannot bind glycine but
      retain PLCXD2 binding, scoring spine apparatus incorporation and spine maturation.
    provenance:
    - reference_id: PMID:40393451
      supporting_text: The molecular mechanisms that dictate SA localization at selected synapses
        remain elusive.
  supported_by:
  - reference_id: PMID:36996198
    supporting_text: We identified an orphan G protein-coupled receptor, GPR158, as a metabotropic
      glycine receptor (mGlyR).
  - reference_id: PMID:36996198
    supporting_text: Glycine and a related modulator, taurine, directly bind to a Cache domain of
      GPR158, and this event inhibits the activity of the intracellular signaling complex regulator
      of G protein signaling 7-G protein β5 (RGS7-Gβ5), which is associated with the receptor.
  - reference_id: PMID:38884814
    supporting_text: we found that glycine-dependent activation of GPR158 increased the firing rate
      of NAc medium spiny neurons (MSNs)
suggested_questions:
- question: Is osteocalcin a direct ligand of GPR158, or does GPR158 act downstream of osteocalcin
    by an indirect route? No binding site, affinity or structure has been reported for the osteocalcin-GPR158
    pair, in contrast with the Cache-domain glycine site, yet reviews continue to describe GPR158
    as a critical receptor for osteocalcin.
  experts:
  - Gerard Karsenty
  - Kirill A Martemyanov
- question: Can glycine and osteocalcin engage GPR158 simultaneously or competitively, and does osteocalcin
    signalling also read out through inhibition of RGS7-Gbeta5?
  experts:
  - Franck Oury
  - Kirill A Martemyanov
- question: Are the postsynaptic phenotypes of GPR158 loss - spine apparatus abundance, spine maturation,
    mossy fibre-CA3 organisation - ligand-dependent, or purely structural? The GPR158-PLCXD2 study
    invokes no ligand and is modulated instead by extracellular heparan sulfate proteoglycan binding.
  experts:
  - Joris de Wit
  - Bram Verpoort
