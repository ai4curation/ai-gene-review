- term:
    id: GO:0160079
    label: G protein-coupled glycine receptor activity
  evidence_type: IDA
  original_reference_id: PMID:36996198
  qualifier: enables
  review:
    summary: Direct binding of glycine (and, more weakly, taurine) to the extracellular Cache domain,
      with a defined intracellular readout and a cellular electrophysiological consequence.
    action: ACCEPT
    reason: 'Core molecular function, and the best-supported of the three competing ligand models
      for GPR158. Independent functional replication exists in a different laboratory and a different
      brain region: Aceto et al. showed glycine-dependent activation of GPR158 increases firing of
      nucleus accumbens medium spiny neurons through Kv7/M-current modulation (PMID:38884814). UniProt
      has adopted mGlyR as the recommended protein name. The competing models are recorded rather
      than suppressed: osteocalcin is asserted as a GPR158 ligand in mouse genetic and behavioural
      work (PMID:28851741) and is still stated flatly in reviews (PMID:40337551), but no direct binding
      site has been defined; and a 2025 Dev Cell study describes a postsynaptic GPR158-PLCXD2 module
      controlling spine apparatus abundance with no ligand invoked at all (PMID:40393451). The honest
      reading is that GPR158 is a glycine receptor whose ligand-independent scaffolding functions
      are equally real, not that one model displaces the other.'
    supported_by:
    - reference_id: PMID:36996198
      supporting_text: We identified an orphan G protein-coupled receptor, GPR158, as a metabotropic
        glycine receptor (mGlyR).
    - reference_id: PMID:36996198
      supporting_text: We further show that glycine, but not taurine, acts through mGlyR to regulate
        neuronal excitability in cortical neurons.
    - reference_id: PMID:38884814
      supporting_text: we found that glycine-dependent activation of GPR158 increased the firing rate
        of NAc medium spiny neurons (MSNs)
