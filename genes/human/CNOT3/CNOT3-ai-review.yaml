  review:
    summary: CNOT3 structurally participates in CCR4–NOT-mediated poly(A) shortening.
    action: ACCEPT
    reason: The mapped fly, fungal and yeast donors include positive deadenylation experiments. Human
      recombinant-complex dissection independently shows that the noncatalytic NOT module containing CNOT3
      stimulates the exonucleases together with other modules. This is structural participation in shortening,
      not an assertion that CNOT3 cleaves RNA. Current donor records corroborate the function without
      reconstructing the original PAINT ancestral placement.
    supported_by:
