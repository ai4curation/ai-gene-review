id: O75175
gene_symbol: CNOT3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CNOT3 is a noncatalytic subunit of the CCR4–NOT complex that connects translation to mRNA
  turnover. Its N-terminal region recognizes ribosomes with a vacant E-site and contacts the P-site tRNA,
  while its C-terminal region assembles with CNOT2 on the CNOT1 scaffold. Recognition of particular tRNA
  features helps recruit CCR4–NOT to slowly decoded transcripts and promotes their decay. The CNOT3-containing
  NOT module also supports efficient deadenylation by the complex’s catalytic subunits. CNOT3 acts in
  cytosolic RNA-regulatory assemblies, including context-dependent P-body pools, and has a nuclear pool
  associated with transcription regulation. Its RNA-regulatory functions support stem-cell maintenance
  and tissue-specific developmental and metabolic programs. Heterozygous pathogenic variants can cause
  a neurodevelopmental disorder with developmental delay, intellectual disability and hypotonia.
