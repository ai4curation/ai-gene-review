      is independently resolved with CNOT1 and CNOT2. This fits the current protein-tRNA adaptor definition:
      protein and tRNA are brought into coordinated function; the definition is not restricted to presenting
      tRNA to a modifying enzyme. Direct tRNA contact is established in the ribosome-bound context, without
      a free-tRNA affinity claim. GO:0000049 is neither ancestor nor descendant of this term; not adding
      it separately is a conservative choice to describe this same recognition activity once, not a claim
      of typed ontology redundancy.'
    supported_by:
    - reference_id: PMID:39571015
      supporting_text: contacts the D-loop, D-stem, and anticodon stem of the P-site tRNA
    - reference_id: PMID:24121232
    - reference_id: file:human/CNOT3/CNOT3-source-evidence.json
- term:
    id: GO:0043022
    label: ribosome binding
  evidence_type: IDA
  original_reference_id: PMID:39571015
  qualifier: enables
  review:
    summary: CNOT3 directly recognizes translating ribosomes.
    action: NEW
    reason: The human HEK293T translation system and cryo-EM reconstruction resolve CNOT3 contacting both
      ribosomal subunits in the vacant E-site. An independent study combines recombinant human CCR4–NOT
      with rabbit ribosomes and resolves the same recognition region. These are direct binding observations
      with defined complexes, not a claim that isolated CNOT3 arrests every ribosome or that all tRNAs
      recruit it equally.
    supported_by:
    - reference_id: PMID:39571015
    - reference_id: PMID:37653243
      supporting_text: The N-terminal region (NTR) of CNOT3 (residues 1-236) binds the vacant E site of
        the 80S ribosome
