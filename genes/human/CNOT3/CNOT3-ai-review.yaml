core_functions:
- description: CNOT3 couples ribosome binding and P-site tRNA recognition to recruitment of the CCR4-NOT
    mRNA-decay complex. Its N-terminal region contacts the ribosomal E site, ribosomal proteins and P-site
    tRNA; its C-terminal region assembles with CNOT2 and the CNOT1 scaffold. Ribosome binding (GO:0043022)
    is an enabling part of this same integrated protein-tRNA adaptor role, rather than a separate core
    mechanism. Human structural and tRNA/protein-mutagenesis experiments connect these contacts to selective
    recruitment and transcript turnover. The noncatalytic NOT module also supports efficient deadenylation
    by the assembled complex, without assigning RNA hydrolysis to CNOT3.
  molecular_function:
    id: GO:0180014
    label: protein-tRNA adaptor activity
  directly_involved_in:
  - id: GO:0000289
    label: nuclear-transcribed mRNA poly(A) tail shortening
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0030015
    label: CCR4-NOT core complex
  supported_by:
  - reference_id: PMID:39571015
  - reference_id: PMID:37653243
  - reference_id: PMID:24121232
  - reference_id: PMID:31320642
suggested_questions:
- question: How do the N-terminal ribosome/tRNA-recognition region and C-terminal NOT assembly module
    coordinate transcript selection in native human tissues?
- question: Which disease-associated variants primarily disrupt tRNA recognition, ribosome binding, complex
    assembly or the regulation of particular transcript classes?
- question: Which nuclear and P-body pools of CNOT3 have functions separable from its cytosolic cotranslational
    mRNA-decay role?
suggested_experiments:
- description: Compare sequence-verified CNOT3 tRNA-contact and assembly mutants in human cells using
    selective ribosome profiling, transcript half-life measurements and matched complex-assembly controls.
- description: Use endogenous tagging and tissue-relevant cells to relate CNOT3 compartment-specific interactions
    to RNA targets, separating direct recruitment from secondary differentiation or metabolic effects.
