core_functions:
- description: "Structural root component of the mother-centriole distal appendages (ciliary transition\
    \ fibers).\n   CEP83 is required to assemble the appendages by recruiting SCLT1 and CEP89 (and through\
    \ SCLT1, FBF1 and CEP164),\n   and thereby enables docking of the mother centriole to ciliary vesicles\
    \ and the plasma membrane, TTBK2 recruitment,\n   CP110 removal and initiation of primary cilium assembly."
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0097539
    label: ciliary transition fiber
  supported_by:
  - *id008
  - *id004
  - *id007
  - *id005
suggested_questions:
- question: Which CEP83 surfaces directly contact SCLT1 and CEP89, and does TTBK2 phosphorylation of CEP83
    alter these contacts or the docking of ciliary vesicles?
- question: Does the Golgi-associated CEP83 pool have a function independent of the distal appendages,
    for example in IFT20-dependent membrane trafficking?
suggested_experiments:
- description: Reconstitute CEP83 with SCLT1 and CEP89 in vitro and map binding interfaces by crosslinking
    mass spectrometry, then test interface mutants for distal appendage assembly and ciliogenesis in CEP83-knockout
    RPE-1 cells.
