id: Q9Y592
gene_symbol: CEP83
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CEP83 (centrosomal protein of 83 kDa, also CCDC41) is a coiled-coil protein of the distal appendages
  (ciliary transition fibers) of the mother centriole. It sits at the root of the appendage blades and
  is the most upstream component of the appendage assembly hierarchy: CEP83 recruits SCLT1 and CEP89,
  and through SCLT1 the more distal components FBF1 and CEP164. Loss of CEP83 abolishes distal appendages
  and blocks docking of the mother centriole to ciliary vesicles and the plasma membrane, so that TTBK2
  is not recruited, the CP110 cap is not removed and primary cilia fail to form. CEP83 is itself phosphorylated
  by TTBK2 at the appendage root, which supports vesicle docking and CP110 removal. A minor pool associates
  with IFT20 at the Golgi. In mouse neural progenitors CEP83-dependent appendages anchor the centrosome
  to the apical membrane. Biallelic CEP83 variants cause infantile nephronophthisis (NPHP18), often with
  intellectual disability.
