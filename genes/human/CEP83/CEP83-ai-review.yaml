- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-5617816
  qualifier: located_in
  review:
    summary: >-
      Reactome places this distal appendage protein in its 'cytosol' compartment for a ciliogenesis reaction;
      Reactome has no centriole/distal-appendage compartment, so centrosomal reactions are modelled in
      cytosol.
    action: KEEP_AS_NON_CORE
    reason: >-
      This TAS row reflects a Reactome compartment convention rather than an independent localization
      experiment. The protein is a structural component of the centriolar distal appendages (ciliary transition
      fibers), which are part of the centrosome in the cytoplasm rather than the soluble cytosol. The
      location is broadly compatible (the centrosome lies in the cytoplasm and is not membrane-bounded)
      but uninformative, so it is retained only as non-core; the informative location is ciliary transition
      fiber.
