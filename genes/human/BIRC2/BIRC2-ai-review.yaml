core_functions:
- description: >-
    RING-dependent ubiquitin-protein ligase activity toward RIPK/TRAF signaling substrates
    in cytosolic
    TNF-family and innate receptor complexes, creating ubiquitin chains that route
    receptors toward NF-kappaB
    signaling and away from RIPK1/caspase-8 or RIPK1/RIPK3 death-platform assembly.
  molecular_function: *id003
  locations:
  - id: GO:0005829
    label: cytosol
  directly_involved_in:
  - id: GO:0033209
    label: tumor necrosis factor-mediated signaling pathway
  - id: GO:0060546
    label: negative regulation of necroptotic process
  - id: GO:0007249
    label: canonical NF-kappaB signal transduction
  supported_by:
  - *id009
  - *id001
  - *id007
- description: >-
    Context-dependent regulation of non-canonical NF-kappaB and selected innate receptor
    pathways through
    cIAP E3 complexes that control NIK, RIPK-family, and related receptor-proximal
    signaling proteins.
  molecular_function: *id003
  locations:
  - id: GO:0005829
    label: cytosol
  directly_involved_in:
  - id: GO:0038061
    label: non-canonical NF-kappaB signal transduction
  supported_by:
  - *id010
  - *id002
proposed_new_terms: []
suggested_questions:
- question: >-
    Which receptor and cell-type contexts require BIRC2 versus BIRC3 rather than redundant
    cIAP1/cIAP2 activity,
    especially for NOD/TLR/RIG-I signaling?
suggested_experiments:
- description: >-
    Use matched BIRC2 and BIRC3 single- and double-knockout human cells with RIPK1,
    RIPK2, TRAF3, and BCL10
    ubiquitin-chain proteomics after TNF, TNFR2, CD40, NOD2, TLR3, and RIG-I stimulation
    to separate shared
    from paralog-specific cIAP substrates.
