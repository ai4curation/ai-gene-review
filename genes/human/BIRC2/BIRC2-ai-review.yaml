- term:
    id: GO:0002947
    label: tumor necrosis factor receptor superfamily complex
  evidence_type: NAS
  original_reference_id: PMID:15861135
  qualifier: part_of
  review:
    summary: BIRC2 can be recruited to cytosolic faces of TNF-family receptor
      complexes.
    action: KEEP_AS_NON_CORE
    reason: cIAP1/2 are soluble E3 ligases that TRAF proteins recruit to TNF
      receptor-family complexes on the cytoplasmic side of the plasma membrane.
      Keep these receptor-complex component rows as contextual locations rather
      than the main steady-state cytosolic location.
    supported_by:
    - &id001
      reference_id: Reactome:R-HSA-5357780
      supporting_text: Activation of tumor necrosis factor receptor 1 (TNFR1)
        stimulates the formation of complex that consists of TNFR1,
        TNFR-associated via death domain (TRADD), RIPK1, TNFR-associated factor
        2 (TRAF2) and cellular inhibitor of apoptosis (BIRC2/3 also known as
        cIAP1/2).
