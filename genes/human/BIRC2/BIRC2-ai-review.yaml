id: Q13490
gene_symbol: BIRC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  BIRC2/cIAP1 is a cytosolic and nuclear inhibitor-of-apoptosis family RING E3 ubiquitin
  ligase. It uses
  N-terminal BIR domains, a UBA region, a CARD regulatory segment, and a C-terminal
  RING to assemble with
  TRAF/RIPK signaling proteins and ubiquitylate substrates that tune TNF-family receptor,
  NF-kappaB, innate-immune,
  apoptotic, and necroptotic signaling outputs.
alternative_products:
- name: '1'
  id: Q13490-1
- name: '2'
  id: Q13490-2
  sequence_note: VSP_045314
existing_annotations:
- term:
    id: GO:0000209
    label: protein polyubiquitination
  evidence_type: IDA
  original_reference_id: PMID:11907583
  qualifier: involved_in
  review:
    summary: BIRC2 promotes ubiquitination of signaling substrates.
    action: ACCEPT
    reason: The cIAP RING is responsible for ubiquitin-chain attachment to
      receptor-signaling substrates and, in some contexts, proteasome-directed
      K48 chains.
    supported_by:
    - &id009
      reference_id: PMID:11907583
      supporting_text: Expression of wild-type c-IAP1, but not an E3-defective
        mutant, resulted in TRAF2 ubiquitination and degradation.
- term:
    id: GO:0001666
    label: response to hypoxia
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6P6S1
  - ensembl:ENSRNOP00000014560
  review:
    summary: The rat orthology response-to-hypoxia transfer is indirect for
      BIRC2.
    action: MARK_AS_OVER_ANNOTATED
    reason: The rat orthology response-to-hypoxia transfer is indirect for
      BIRC2; the local evidence supports USP19 binding to both HIF1A and cIAP1
      but not BIRC2 as a hypoxia-response effector.
    supported_by:
    - reference_id: file:genes/human/BIRC2/BIRC2-notes.md
      supporting_text: The Ensembl Compara transfers from rat Q6P6S1 for
        response to hypoxia, XY body, response to ethanol, response to cAMP, and
        response to bleomycin were treated as rodent orthology side annotations
        rather than cIAP1 core functions; the human review found no direct BIRC2
        evidence for those endpoint terms.
