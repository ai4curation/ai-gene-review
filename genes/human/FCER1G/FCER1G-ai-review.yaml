  evidence_type: IDA
  original_reference_id: PMID:8611682
  review:
    summary: FcRgamma associates with human FcgammaRI (CD64, FCGR1A) and is required for its surface expression
      and signaling.
    action: NEW
    reason: GO:0033000 is defined as a complex of Fc-gamma RI alpha chain and an Fc-epsilon RI gamma chain
      dimer, i.e. FCER1G is a defining subunit. Human FcgammaRI signaling and phagocytosis are lost without
      the gamma chain, and CD64 has been co-purified with the gamma chain.
    additional_reference_ids:
    - PMID:29143175
    supported_by:
    - *id012
    - *id028
    - *id029
- term:
    id: GO:0038065
    label: collagen-activated signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:9280292
  review:
    summary: FcRgamma is the ITAM signaling subunit of the platelet collagen receptor GPVI.
    action: NEW
    reason: 'Collagen binding to GPVI is transduced by phosphorylation of the FcRgamma ITAM and SYK recruitment;
      FcRgamma therefore performs the signal-transducing step of the pathway rather than merely being
      required for it. Comparator: GP6 (the ligand-binding partner in the same receptor) carries this
      term. This NEW term replaces the downstream secretion/platelet-activation annotations as the receptor-proximal
      process.'
    supported_by:
    - *id002
    - *id006
