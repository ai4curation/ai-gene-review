- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:9280292
  qualifier: enables
  supporting_entities:
  - UniProtKB:P43405
  review:
    summary: Interaction annotated from the GPVI/FcRgamma platelet paper with SYK listed as partner.
    action: REMOVE
    reason: Generic protein binding is uninformative. The abstract describes co-association of FcRgamma
      with GPVI and its tyrosine phosphorylation leading to SYK activation; the SYK interaction itself
      is better captured mechanistically as SH2 domain binding (see PMID:8810294 annotation). Removal
      does not mean the reported interaction is false.
    supported_by:
    - *id002
