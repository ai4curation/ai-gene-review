- id: PMID:8611682
  title: FcR gamma-chain is essential for both surface expression and function of human Fc gamma RI (CD64)
    in vivo.
  findings:
  - statement: FcRgamma is required for surface expression and signaling (phagocytosis) of human FcgammaRI,
      but not for its IgG binding.
    supporting_text: This documents the FcR gamma-chain to be indispensable for both surface membrane
      expression and function of human Fc gamma RI in vivo.
- id: PMID:8313472
  title: FcR gamma chain deletion results in pleiotrophic effector cell defects.
  findings:
  - statement: FcRgamma-deficient mice lack antibody-mediated phagocytosis, ADCC and mast cell allergic
      responses.
    supporting_text: Defects in NK cell-mediated antibody-dependent cytotoxicity and mast cell-mediated
      allergic responses are evident in these animals
- id: PMID:18776906
  title: Mincle is an ITAM-coupled activating receptor that senses damaged cells.
  findings:
  - statement: Mincle (CLEC4E) signals via FcRgamma.
    supporting_text: Mincle selectively associated with the Fc receptor common gamma-chain and activated
      macrophages to produce inflammatory cytokines and chemokines
- id: PMID:17050534
  title: Dectin-2 is a pattern recognition receptor for fungi that couples with the Fc receptor gamma
    chain to induce innate immune responses.
  findings:
  - statement: Dectin-2 signals via FcRgamma ITAM phosphorylation to induce NF-kappaB and cytokine responses.
    supporting_text: We conclude that dectin-2 is a PRR for fungi that employs signaling through FcRgamma
      to induce innate immune responses.
- id: PMID:19098920
  title: Fc receptor gamma-chain, a constitutive component of the IL-3 receptor, is required for IL-3-induced
    IL-4 production in basophils.
  findings:
  - statement: FcRgamma constitutively associates with IL-3R common beta chain and recruits SYK.
    supporting_text: Through its transmembrane portion, FcRgamma associated constitutively with the common
      beta-chain of the IL-3 receptor and signaled by recruiting the kinase Syk.
- id: PMID:23395392
  title: Multimolecular signaling complexes enable Syk-mediated signaling of CD36 internalization.
  findings:
  - statement: CD36 couples to FcRgamma to engage Src kinases and SYK for ligand internalization (mouse).
    supporting_text: By coupling to FcRgamma, CD36 is able to engage Src-family kinases and Syk, which
      in turn drives the internalization of CD36 and its bound ligands.
- id: file:human/FCER1G/FCER1G-uniprot.txt
  title: UniProtKB P30273 FCERG_HUMAN entry
  findings:
  - statement: ITAM adaptor transducing activation signals from various immunoreceptors.
    supporting_text: Adapter protein containing an immunoreceptor tyrosine-based activation motif (ITAM)
      that transduces activation signals from various immunoreceptors
- id: file:human/FCER1G/FCER1G-deep-research-falcon.md
  title: Falcon deep research report on FCER1G
  findings:
  - statement: FcRgamma is a receptor-assembly and signaling adaptor that does not bind ligand itself.
    supporting_text: Its partner receptor recognizes the extracellular ligand. FcRγ helps assemble or
      display certain receptors and converts their clustering into an intracellular phosphotyrosine signal
      that recruits SYK.
  - statement: Human CD16a can use CD247 instead of FcRgamma in adaptive NK cells.
    supporting_text: Human CD16a can associate with **CD3ζ/CD247** as an alternative ITAM adaptor.
core_functions:
- description: 'ITAM-bearing transmembrane signaling adaptor: the disulfide-linked FcRgamma dimer pairs
    via transmembrane contacts with ligand-binding receptor chains lacking signaling motifs and, after
    Src-family kinase phosphorylation of its ITAM, recruits and activates SYK through its tandem SH2 domains.'
