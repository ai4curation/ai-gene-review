id: P30273
gene_symbol: FCER1G
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FCER1G encodes the Fc receptor common gamma chain (FcRgamma), an 86-residue single-pass type
  I transmembrane adaptor with a vestigial extracellular region, a transmembrane helix carrying a conserved
  aspartate, and a cytoplasmic immunoreceptor tyrosine-based activation motif (ITAM). FcRgamma forms disulfide-linked
  homodimers (or heterodimers with CD247) that associate through transmembrane contacts with ligand-binding
  receptor chains that lack signaling motifs, and it is required for their surface expression and signaling.
  Partners include the high-affinity IgE receptor FcepsilonRI (alpha-beta-gamma2), the IgG receptors FcgammaRI
  (CD64) and FcgammaRIIIA (CD16A), the platelet collagen receptor GPVI, myeloid C-type lectin pattern-recognition
  receptors (Dectin-2/CLEC6A, Mincle/CLEC4E, CLEC4D), and immunoglobulin-superfamily receptors such as
  ILT7/LILRA4, OSCAR, TARM1 and CD300 family members. Upon receptor engagement, Src-family kinases phosphorylate
  the two ITAM tyrosines, creating a high-affinity docking site for the tandem SH2 domains of SYK, which
  propagates signals (PLCG2, LAT/SLP-76, CARD9/NF-kappaB) driving mast cell degranulation, antibody-dependent
  phagocytosis and cytotoxicity, platelet activation, and innate antifungal and antimycobacterial responses.
  FcRgamma also associates with the IL-3 receptor beta chain in basophils to route IL-3 signals to IL-4
  production. It is expressed mainly in myeloid cells, mast cells, basophils, NK cells and platelets.
existing_annotations:
- term:
    id: GO:0002283
    label: neutrophil activation involved in immune response
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P20491
  - ensembl:ENSMUSP00000078875
  review:
    summary: Ortholog transfer (mouse Fcer1g) of a role in neutrophil activation; FcRgamma is required
      for beta2-integrin-triggered neutrophil activation via SYK.
    action: KEEP_AS_NON_CORE
    reason: Mouse genetic evidence (summarized in UniProt by similarity) links FcRgamma ITAM signaling
      to ITGB2-mediated neutrophil activation. This is a genuine but context-specific downstream cellular
      role of a broadly used ITAM adaptor; it is retained as non-core.
    supported_by:
    - &id005
      reference_id: file:human/FCER1G/FCER1G-uniprot.txt
      supporting_text: Functionally linked to integrin beta-2/ITGB2-mediated neutrophil activation
- term:
    id: GO:0002554
    label: serotonin secretion by platelet
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P20491
  - ensembl:ENSMUSP00000078875
  review:
    summary: Ortholog transfer (mouse) of serotonin secretion by platelets, based on loss of collagen-induced
      platelet responses in FcRgamma-deficient mice.
    action: MARK_AS_OVER_ANNOTATED
    reason: FcRgamma is the ITAM-bearing signaling subunit of the platelet collagen receptor GPVI and
      acts at the receptor-proximal signaling step. Dense-granule (serotonin) secretion is a distal consequence
      executed by the platelet secretory machinery; FcRgamma is required upstream but does not perform
      the secretion step. The process is better captured by collagen-activated signaling (proposed as
      NEW).
    supported_by:
    - &id002
      reference_id: PMID:9280292
      supporting_text: These results support a model where GPVI couples collagen-stimulation of platelets
        to phosphorylation of the Fc receptor gamma-chain leading to activation of Syk and phospholipase
        Cgamma2.
    - &id006
      reference_id: file:human/FCER1G/FCER1G-uniprot.txt
      supporting_text: Also involved in integrin alpha-2/ITGA2-mediated platelet activation
- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003110
  review:
    summary: InterPro ITAM-domain mapping to transmembrane signaling receptor activity.
    action: MODIFY
    reason: FcRgamma does not bind any extracellular ligand itself (its extracellular region is ~5 residues);
      ligand recognition is performed by partner alpha chains (FCER1A, FCGR1A, FCGR3A, GP6, CLEC4E, CLEC6A,
      LILRA4 etc.). The protein is the ITAM-bearing signal-transducing adaptor of these receptors, coupling
      ligand-binding subunits to SYK. A ligand-free adaptor annotation (protein-macromolecule adaptor
      activity) better describes its activity.
    proposed_replacement_terms:
    - id: GO:0030674
      label: protein-macromolecule adaptor activity
    supported_by:
    - &id004
      reference_id: file:human/FCER1G/FCER1G-uniprot.txt
      supporting_text: Adapter protein containing an immunoreceptor tyrosine-based activation motif (ITAM)
        that transduces activation signals from various immunoreceptors
    - &id008
      reference_id: PMID:8611682
      supporting_text: suggesting FcR gamma-chain not to be critical for hFc gamma RI ligand-binding capacity
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16735691
  qualifier: enables
  supporting_entities:
  - UniProtKB:P59901
  review:
    summary: Co-immunoprecipitation of FcRgamma with the plasmacytoid DC receptor ILT7 (LILRA4), forming
      a signaling receptor complex.
    action: MODIFY
    reason: The interaction is a specific association between the ITAM adaptor and the ligand-binding
      receptor ILT7, through which ILT7 signals (NFAT, SYK, calcium). Generic protein binding is uninformative;
      signaling receptor binding captures the adaptor's binding to its receptor partner.
    proposed_replacement_terms: &id001
    - id: GO:0005102
      label: signaling receptor binding
    supported_by:
    - &id016
      reference_id: PMID:16735691
      supporting_text: Thus, our results demonstrate that ILT7 associates with the ITAM-containing signaling
        adapter FcɛRIγ to form a stable receptor complex.
    - &id017
      reference_id: PMID:16735691
      supporting_text: Cross-linking ILT7 with immobilized anti-ILT7 mAb resulted in GFP expression, indicating
        that ILT7-FcɛRIγ is able to activate NFAT, similar to the effect of TCR activation.
