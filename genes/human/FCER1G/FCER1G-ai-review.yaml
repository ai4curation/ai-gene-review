suggested_questions:
- question: Should FCER1G receptor-activity annotations (IgE receptor activity) carry a contributes_to
    qualifier, given that ligand binding is performed by FCER1A and the gamma chain supplies the signal-transducing
    ITAM?
- question: In human cells, how is FcRgamma partitioned among its many competing receptor partners (FcepsilonRI,
    FcgammaRI/IIIA, GPVI, CLEC6A/CLEC4E, LILRA4, OSCAR, TARM1, CD300 family), and does adaptor availability
    limit receptor surface expression in vivo?
- question: Does FcRgamma associate with the IL-3 receptor common beta chain (CSF2RB) in human basophils
    as shown in mouse, and does it route IL-3 signals to IL-4 production in humans?
- question: To what extent do human FcRgamma-low adaptive NK cells rely on CD247 rather than FCER1G for
    CD16A-mediated ADCC, and does this redundancy differ from mouse?
suggested_experiments:
- description: Quantitative proteomics of FcRgamma immunoprecipitates from primary human myeloid cells,
    mast cells and platelets to map cell-type-specific receptor partner repertoires.
  experiment_type: affinity purification mass spectrometry
- description: CRISPR knockout of FCER1G in human iPSC-derived basophils/mast cells to test requirement
    for IL-3-induced IL-4 production and FcepsilonRI signaling in a human system.
  experiment_type: CRISPR knockout
