id: Q7Z739
gene_symbol: YTHDF3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Cytoplasmic RNA-binding protein of the YTHDF family and one of the three paralogous
  readers of N6-methyladenosine (m6A) in messenger RNA. Its C-terminal YTH domain engages m6A through
  an aromatic cage, while its long N-terminal low-complexity region drives assembly of multivalent
  ribonucleoprotein condensates. YTHDF3 binds essentially the same pool of m6A-modified transcripts
  as YTHDF1 and YTHDF2, in proportion to the number of methylated sites, and the three paralogs
  act largely redundantly to destabilise those transcripts by recruiting deadenylation and decay
  machinery, so that the effect on mRNA stability and on cell differentiation becomes fully apparent
  only when all three are depleted together. Together with the bound mRNA, YTHDF3 partitions into
  phase-separated compartments including P-bodies, cytoplasmic stress granules and neuronal RNA
  granules, and it is required for efficient stress granule formation. Whether YTHDF3 also actively
  promotes translation is disputed: it was originally reported to bind 40S and 60S ribosomal proteins
  and to enhance translation initiation in synergy with YTHDF1, but a later study using simultaneous
  depletion of all three paralogs found no translation-promoting effect and attributed the shared
  function entirely to mRNA degradation. Additional proposed activities - reading N1-methyladenosine
  in mRNA, and reading N6-methyladenine in genomic DNA - rest on antibody-based mapping methods
  whose specificity has been independently challenged.'
