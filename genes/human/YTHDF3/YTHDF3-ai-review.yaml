core_functions:
- molecular_function:
    id: GO:1990247
    label: N6-methyladenosine-containing RNA reader activity
  description: YTHDF3 binds N6-methyladenosine in messenger RNA through the aromatic cage of its
    C-terminal YTH domain. It engages essentially the same pool of m6A-modified transcripts as its
    paralogs YTHDF1 and YTHDF2, with occupancy scaling with the number of methylated sites on a
    transcript rather than with site identity. Binding commits the transcript to destabilisation
    - the three paralogs act redundantly to recruit deadenylation and decay machinery, so that the
    full effect on transcript stability and on cell differentiation appears only when all three
    are depleted together. The long N-terminal low-complexity region couples this recognition to
    condensate formation, so that polymethylated mRNAs and their bound YTHDF proteins partition
    into P-bodies, cytoplasmic stress granules and neuronal RNA granules.
  directly_involved_in:
  - id: GO:0061157
    label: mRNA destabilization
  - id: GO:0043488
    label: regulation of mRNA stability
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0000932
    label: P-body
  - id: GO:0010494
    label: cytoplasmic stress granule
  supported_by:
  - reference_id: PMID:32492408
    supporting_text: In contrast to the prevailing model, we show that DF proteins bind the same
      m6A-modified mRNAs rather than different mRNAs.
  - reference_id: PMID:32492408
    supporting_text: Instead, the DF paralogs act redundantly to mediate mRNA degradation and cellular
      differentiation.
  - reference_id: PMID:28106072
    supporting_text: Cells deficient in all three YTHDF proteins experience the most dramatic accumulation
      of m6A-modified transcripts.
  - reference_id: PMID:31292544
    supporting_text: The resulting mRNA-YTHDF complexes then partition into different endogenous
      phase-separated compartments, such as P-bodies, stress granules or neuronal RNA granules.
suggested_questions:
- question: Does YTHDF3 promote translation initiation, or not? GOA currently carries an IDA asserting
    it (PMID:28106076) and a NOT|involved_in IDA denying it (PMID:32492408) for the same term. Is
    the discrepancy explained by paralog redundancy masking the effect in single knockdowns, by
    cell type, or by the reporter system used?
  experts:
  - RNA modification biology
  - Translational control
- question: If all three YTHDF paralogs bind the same transcripts and act redundantly, is there
    any YTHDF3-specific function at all, or is the correct unit of annotation the DF1/DF2/DF3 group?
  experts:
  - Gene Ontology curation
  - RNA modification biology
- question: Does the YTH domain of YTHDF3 bind N6-methyladenine in DNA with an affinity and specificity
    that could matter in cells? A co-crystal or cryo-EM structure of the YTH domain with 6mA-containing
    duplex DNA would settle whether the aromatic cage can accommodate a deoxyribose backbone.
  experts:
  - Structural biology of nucleic acid recognition
- question: Is there any regulated N6-methyladenine in mammalian genomic DNA for YTHDF3 to read?
    Several independent audits attribute reported mammalian 6mA to contamination, antibody cross-reactivity
    and nucleotide-salvage misincorporation, and animals appear to have lost the AMT1 writer lineage.
  experts:
  - Chromatin and DNA modification
  - Comparative genomics
- question: How much mRNA m1A actually exists, and is YTHDF3's reported m1A binding physiologically
    meaningful given that mRNA m1A mapping was shown to be dominated by antibody cross-reactivity
    with the 5' cap?
  experts:
  - Epitranscriptomics
  - Analytical nucleic acid chemistry
- question: Is the interaction of YTHDF3 with 40S and 60S ribosomal proteins a regulatory contact
    or incidental co-purification of an abundant cytoplasmic mRNA-binding protein with polysomes?
  experts:
  - Translational control
suggested_experiments:
- hypothesis: The translation-promoting role of YTHDF3 is detectable only in specific cell types
    or under specific stress conditions, which explains the contradiction between PMID:28106076
    and PMID:32492408.
  description: Perform matched ribosome profiling and mRNA-seq in a panel of cell lines carrying
    degron-tagged YTHDF1, YTHDF2 and YTHDF3, comparing acute single, double and triple depletion
    on the same day, with m6A-site-resolved analysis of translation efficiency. Acute degradation
    avoids the compensatory upregulation that confounds stable knockdown, and the panel tests whether
    HeLa is atypical.
  experiment_type: acute protein degradation with ribosome profiling
- hypothesis: The YTH domain of YTHDF3 cannot bind 6mA in duplex DNA with physiologically relevant
    affinity.
  description: Measure binding of purified recombinant YTHDF3 YTH domain to matched m6A-RNA, 6mA-ssDNA
    and 6mA-dsDNA oligonucleotides by isothermal titration calorimetry and fluorescence polarisation,
    reporting dissociation constants side by side, and attempt a co-crystal or cryo-EM structure
    with the 6mA-DNA ligand. An aromatic-cage mutant provides the specificity control.
  experiment_type: quantitative binding biophysics and structural biology
- hypothesis: YTHDF3 is not associated with chromatin in cells.
  description: Perform CUT&RUN and ChIP-seq for endogenously tagged YTHDF3 in unstressed human cells,
    with a nuclear-localised positive control reader and an IgG negative control, and quantify the
    nuclear versus cytoplasmic pool by fractionation and quantitative western blot. Absence of reproducible
    chromatin occupancy would argue against a genomic reader role independently of whether 6mA exists.
  experiment_type: chromatin occupancy profiling
- hypothesis: The trophoblast phenotype attributed to m1A reading is in fact mediated by m6A.
  description: Re-map the YTHDF3 binding sites on IGF1R mRNA in trophoblast cells using an m1A antibody
    that lacks 5'-cap cross-reactivity alongside an m6A antibody and a misincorporation-based, antibody-free
    method, and test whether an aromatic-cage YTH mutant that abolishes m6A binding also abolishes
    the IGF1R and migration effects.
  experiment_type: antibody-independent modification mapping with structure-guided mutants
