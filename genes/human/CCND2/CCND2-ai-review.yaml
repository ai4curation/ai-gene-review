  review:
    action: ACCEPT
    summary: Cyclin D2-CDK4 promotes entry into S phase.
    reason: The official full paper reports human CCND2 and CDK4 constructs, coexpression in HeLa and
      NIH-3T3 cells, and accelerated DNA synthesis in synchronized NIH-3T3 cells compared with empty-vector
