id: P30279
gene_symbol: CCND2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Cyclin D2 is a noncatalytic regulatory subunit of cyclin-dependent kinases that couples growth
  signals to G1 progression and entry into S phase. Its association with CDK4 or CDK6 promotes retinoblastoma-family
  protein phosphorylation by the kinase subunit, relieving restraint on cell-cycle progression. Cyclin
  D2-containing complexes redistribute between the cytoplasm and nucleus, with nuclear-envelope and chromatin-associated
  populations observed during cell-cycle entry. Cyclin D2 abundance is controlled by ubiquitin-dependent
  proteolysis. Pathogenic CCND2 variants cause megalencephaly-polymicrogyria-polydactyly-hydrocephalus
  syndrome 3.
