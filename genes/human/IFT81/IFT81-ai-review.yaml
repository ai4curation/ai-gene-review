      Located in motile cilium (ISS). IFT is also required to assemble motile cilia and flagella.
    action: KEEP_AS_NON_CORE
    reason: >-
      IFT is conserved in motile cilia and flagella (it was discovered in Chlamydomonas flagella), so
      the location is correct; it is kept as non-core because the core role reviewed here is assembly
      of cilia in general, with most human data from primary cilia.
    supported_by:
    - &id007
      reference_id: PMID:11062270
      supporting_text: >-
        Intraflagellar transport (IFT) is a rapid movement of multi-subunit protein particles along flagellar
        microtubules and is required for assembly and maintenance of eukaryotic flagella.
