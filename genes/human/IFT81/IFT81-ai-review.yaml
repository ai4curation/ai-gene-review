id: Q8WYA0
gene_symbol: IFT81
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  IFT81 is a coiled-coil core (IFT-B1) subunit of the intraflagellar transport B complex. It forms an
  obligate heterodimer with IFT74 through their C-terminal coiled coils, and the IFT81/IFT74 pair constitutes
  the main tubulin-binding module of IFT-B: the N-terminal calponin-homology (CH) domain of IFT81 binds
  the globular body of alpha/beta-tubulin while the basic N-terminus of IFT74 binds the beta-tubulin acidic
  tail, together giving micromolar affinity suited to loading tubulin onto anterograde trains. Tubulin
  binding by IFT81 is required for ciliogenesis in human cells. The C-terminal parts of IFT81/IFT74 also
  bind GTP-RABL2B, which captures IFT-B at the ciliary base. IFT81 localizes to the ciliary base, along
  the axoneme and at the ciliary tip, and is required for sperm flagellum assembly in mice. Biallelic
  IFT81 variants cause short-rib thoracic dysplasia (SRTD19).
