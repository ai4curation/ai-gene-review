id: P50148
gene_symbol: GNAQ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNAQ encodes Galpha-q, the alpha subunit of the Gq class of heterotrimeric G proteins. Anchored
  to the cytoplasmic face of the plasma membrane by N-terminal palmitoylation, and shuttling between the
  plasma membrane and Golgi, Galpha-q associates with G-beta-gamma and is activated by a large set of
  Gq-coupled receptors (muscarinic, alpha1-adrenergic, tachykinin, CCK, CaSR, MRGPRX and many others),
  which catalyse exchange of GDP for GTP. GTP-bound Galpha-q directly activates phospholipase C-beta isoforms,
  increasing their catalytic rate and producing IP3 and diacylglycerol that mobilize Ca2+ and activate
  protein kinase C; it also engages RhoGEFs and directly inhibits the TRPM8 channel. Its intrinsic GTPase,
  accelerated by RGS proteins and by PLC-beta itself, terminates signaling. Through these pathways GNAQ
  contributes to platelet activation, endocrine secretion, itch and many other physiological responses.
  Somatic activating mutations (Q209, R183) cause uveal melanoma, Sturge-Weber syndrome and port-wine
  stains.
