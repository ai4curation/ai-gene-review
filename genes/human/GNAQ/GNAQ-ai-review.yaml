- term:
    id: GO:0007603
    label: phototransduction, visible light
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q5F3B5
  review:
    summary: Comparative mammalian experiments support a secondary phototransduction role with overlapping
      G-protein contributions.
    action: KEEP_AS_NON_CORE
    reason: 'Retain a secondary visible-light phototransduction role for human GNAQ as comparative functional
      inference, not a direct human retinal assay. Full PMID:24958088 Fig. 4 isolates endogenous mouse
      Gnaq and Gna11 contributions in melanopsin-expressing Neuro-2A cells: either supports the calcium
      response, whereas joint silencing eliminates it. Fig. 5 combines native retinal knockdown with pupil
      measurements and supports overlapping Gnaq/Gna11/Gna14 participation without separately establishing
      each isoform as necessary in vivo. This mammalian evidence supplements the older chicken source
      PMID:12196552. PMID:24870805 preserves responses in tested single/double knockout combinations and
      discusses compensation or alternative signaling; this limits necessity claims, not the demonstrated
      participation capacity. Neither experiment establishes an exclusive human isoform assignment or
      every ipRGC subtype.'
    additional_reference_ids:
    - PMID:12196552
    - PMID:24958088
    - PMID:24870805
    supported_by:
    - reference_id: PMID:12196552
    - reference_id: PMID:24958088
      supporting_text: These data confirm that Gnaq and Gna11 convey the melanopsin signal in Neuro-2A
        cells.
    - reference_id: PMID:24870805
      supporting_text: Another possibility is that there is compensatory upregulation from other remaining
        Gq/11 family members in the tested mutant lines.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB:Q5F3B5
        source_status: UNRESOLVED
        comment: 'The original chicken-source transfer is retained in light of independent mammalian functional
          evidence, not relabeled as a direct human experiment. Retain a secondary visible-light phototransduction
          role for human GNAQ as comparative functional inference, not a direct human retinal assay. Full
          PMID:24958088 Fig. 4 isolates endogenous mouse Gnaq and Gna11 contributions in melanopsin-expressing
          Neuro-2A cells: either supports the calcium response, whereas joint silencing eliminates it.
          Fig. 5 combines native retinal knockdown with pupil measurements and supports overlapping Gnaq/Gna11/Gna14
          participation without separately establishing each isoform as necessary in vivo. This mammalian
          evidence supplements the older chicken source PMID:12196552. PMID:24870805 preserves responses
          in tested single/double knockout combinations and discusses compensation or alternative signaling;
          this limits necessity claims, not the demonstrated participation capacity. Neither experiment
          establishes an exclusive human isoform assignment or every ipRGC subtype.'
