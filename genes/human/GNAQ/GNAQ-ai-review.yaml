suggested_questions:
- question: How does continuous PM-Golgi shuttling of Galpha-q shape the spatial pattern of PLC-beta signaling,
    and is there functional Gq signaling from the Golgi?
- question: Which effectors beyond PLC-beta (p63RhoGEF, TRPM8, ARF6-GEFs) are directly engaged by oncogenic
    Galpha-q Q209L in uveal melanoma?
suggested_experiments:
- description: Compartment-targeted Galpha-q (PM-anchored vs Golgi-anchored) with PIP2/IP3 biosensors
    to test whether Golgi-resident Galpha-q signals.
