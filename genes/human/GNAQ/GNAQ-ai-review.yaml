- term:
    id: GO:0001750
    label: photoreceptor outer segment
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q5F3B5
  review:
    summary: Mouse retinal evidence does not resolve the precise transferred human outer-segment location.
    action: UNDECIDED
    reason: The precise human GNAQ outer-segment localization remains unresolved. PMID:12196552 reports
      chicken Gq/11 immunolocalization with G11-associated opsin signaling. Full PMID:24958088 adds adult
      mouse retinal localization, including Gnaq-selective cone-photoreceptor staining and cross-reactive
      Gnaq/11 staining, but the reported cone/photoreceptor-layer signal does not independently resolve
      this exact human subcompartment for each isoform. Its melanopsin experiments concern inner-retinal
      ganglion cells, not rod/cone outer segments. PMID:24870805 examines neonatal ipRGC expression and
      function, which likewise does not settle outer-segment residence. These limitations do not demonstrate
      absence.
    additional_reference_ids:
    - PMID:12196552
    - PMID:24958088
    - PMID:24870805
    supported_by:
    - reference_id: PMID:12196552
    - reference_id: PMID:24958088
      supporting_text: These data confirm that Gnaq and Gna11 convey the melanopsin signal in Neuro-2A
        cells.
    - reference_id: PMID:24870805
      supporting_text: Another possibility is that there is compensatory upregulation from other remaining
        Gq/11 family members in the tested mutant lines.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: UniProtKB:Q5F3B5
        source_status: UNRESOLVED
