id: P50148
gene_symbol: GNAQ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNAQ encodes G alpha q, a membrane-associated guanine-nucleotide switch in heterotrimeric
  G proteins. Activated receptors promote GDP/GTP exchange, allowing Gq to activate phospholipase C beta
  and generate inositol trisphosphate and diacylglycerol signals. Intrinsic GTP hydrolysis, accelerated
  by regulatory proteins and PLC beta, terminates signaling. Gq participates in diverse endocrine, vascular,
  platelet and neuronal responses; nuclear-membrane and Golgi pools coexist with plasma-membrane signaling
  in particular cells.
