- term:
    id: GO:0009649
    label: entrainment of circadian clock
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q5F3B5
  review:
    summary: Mammalian circadian assays limit necessity claims but do not independently resolve this human
      entrainment assignment.
    action: UNDECIDED
    reason: 'The precise human GNAQ contribution to circadian entrainment remains unresolved after mammalian
      source review. Chicken pineal phase shifting in PMID:12196552 is a different photoreceptive implementation.
      PMID:24958088 measures cellular phototransduction and pupillary responses, not circadian entrainment.
      Full PMID:24870805 actually tests mouse wheel-running rhythms: the tested mutant combinations retain
      light-dark entrainment and light-pulse phase shifting; Gnaq/Gna11 double mutants show a small reduction
      of period lengthening in constant light. That combined-genotype effect does not separately establish
      human GNAQ entrainment, and normal entrainment does not demonstrate absence of a redundant contribution.
      Do not equate melanopsin participation with proof of every downstream circadian role.'
    additional_reference_ids:
    - PMID:12196552
    - PMID:24958088
    - PMID:24870805
    supported_by:
    - reference_id: PMID:12196552
    - reference_id: PMID:24958088
