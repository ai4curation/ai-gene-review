  review:
    summary: Adenylate cyclase-activating GPCR signaling inherited at a Galpha node.
    action: MARK_AS_OVER_ANNOTATED
    reason: Galpha-q's effector is PLC-beta, not adenylyl cyclase; stimulation of adenylyl cyclase is
      the Gs function. Gq signaling can secondarily affect Ca2+/PKC-sensitive cyclases but does not participate
      in the Gs-type pathway.
    supported_by:
    - reference_id: file:human/GNAQ/GNAQ-uniprot.txt
      supporting_text: leading to production of diacylglycerol (DAG) and inositol 1,4,5-trisphosphate
        (IP3)
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008496048
        comment: Node carrying the adenylate cyclase-activating assertion; the Gq subfamily signals through
          PLC-beta, so the assertion does not fit GNAQ.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
