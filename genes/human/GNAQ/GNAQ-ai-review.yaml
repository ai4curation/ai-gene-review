- id: PMID:24958088
  title: Using siRNA to define functional interactions between melanopsin and multiple G Protein partners.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Fig. 4 distinguishes endogenous mouse Gnaq/Gna11 by selective siRNA
      in Neuro-2A cells expressing mouse melanopsin; Gna14 rescue is a separate transfection. Fig. 5 tests
      overlapping native contributions in rod/cone-deficient mice. Adult retinal immunolabeling is distinct
      from human outer-segment proof; no circadian outcome is measured.
  findings:
  - statement: Mouse cellular assays establish separate Gnaq and Gna11 melanopsin-signaling capacity;
      native combined knockdown supports overlapping contributions, with human involvement inferred comparatively.
    supporting_text: These data confirm that Gnaq and Gna11 convey the melanopsin signal in Neuro-2A cells.
- id: PMID:24870805
  title: Loss of gq/11 genes does not abolish melanopsin phototransduction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Single/double mouse knockouts retain pupil and neonatal ipRGC responses.
      Fig. 3 retains entrainment/phase shifting but detects a small constant-light period effect in Gnaq/Gna11
      double mutants. Fig. 1 samples P1/P4 cells; absent Gnaq detection there does not exclude adult expression.
      Whole-retina compensatory expression and alternative signaling are hypotheses, not cell-specific
      proof. Necessity and participation remain distinct.
  findings:
  - statement: Retained responses after tested mouse single/double losses constrain essentiality; possible
      compensation prevents interpreting these results as absence of participation.
    supporting_text: Another possibility is that there is compensatory upregulation from other remaining
      Gq/11 family members in the tested mutant lines.
core_functions:
- description: A heterotrimeric G alpha molecular switch couples activated GPCRs to intracellular effectors
    through GDP/GTP exchange and GTP hydrolysis; receptor and effector selectivity remain protein- and
    context-dependent.
