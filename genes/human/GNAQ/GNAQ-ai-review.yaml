- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IDA
  original_reference_id: PMID:15611106
  qualifier: enables
  review:
    summary: Galpha-q with beta-arrestin-1 is required for AT1R-driven RhoA activation.
    action: REMOVE
    reason: GTPase activator activity means stimulating a GTPase's hydrolysis (GAP activity), which would
      inactivate RhoA. The cited abstract reports the opposite outcome - Galpha-q and beta-arrestin-1
      jointly activate RhoA - so the MF term has the wrong sense; any GTPase-activating role toward RhoA
      is indirect via RhoGEFs.
    supported_by:
    - reference_id: PMID:15611106
      supporting_text: the concurrent recruitment of beta-arrestin 1 and activation of G(alphaq/11) leads
        to full activation of RhoA
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO ID
      requested_change: CHECK
      asserted_value: GO:0005096
      confidence: PROBABLE
      explanation: PMID:15611106 shows Galpha-q/11 plus beta-arrestin-1 are required for RhoA activation
        and stress fibre formation downstream of AT1AR. GTPase activator activity (GAP) is the opposite
        activity; a process term such as positive regulation of Rho protein signal transduction, or no
        MF, would fit the finding.
