id: P11487
gene_symbol: FGF3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGF3 is a secreted fibroblast growth factor that engages FGF receptors and promotes receptor-dependent
  proliferative and developmental responses. Conserved receptor-selectivity experiments favor the epithelial
  splice forms FGFR1b and FGFR2b. Human recessive FGF3 variants cause inner-ear agenesis, microtia and
  microdontia, linking this ligand to early otic and craniofacial development. Intracellular targeting
  and nuclear effects in mouse FGF3 construct studies have not established equivalent endogenous human
  product-specific functions.
