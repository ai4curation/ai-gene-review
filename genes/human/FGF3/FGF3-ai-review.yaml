core_functions:
- description: Acts as an extracellular growth factor through FGF receptor binding, initiating receptor
    signaling and promoting proliferation in responsive cells. Receptor binding is the recognition mechanism
    of this growth-factor function. Mouse FGF3 assays corroborate the conserved human ligand role.
  molecular_function:
    id: GO:0008083
    label: growth factor activity
  directly_involved_in:
  - id: GO:0008543
    label: fibroblast growth factor receptor signaling pathway
  - id: GO:0008284
    label: positive regulation of cell population proliferation
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: GO_REF:0000033
  - reference_id: PMID:8663044
  - reference_id: file:human/FGF3/FGF3-uniprot.txt
suggested_questions:
- question: How much endogenous human FGF3 functions intracellularly, and how is that activity separated
    from the secreted ligand pool?
- question: Which human FGF3 molecular forms and receptor splice forms provide the inducing signal during
    inner ear development (GO:0048839), inner ear morphogenesis (GO:0042472), or otic vesicle development
    (GO:0071599)? Human LAMM cases establish developmental necessity but do not resolve the precise stage
    or direct process contribution. Mouse Fgf3/Fgf8/Fgf10 comparator records include experimental
    acts_upstream_of_or_within assertions and TAS involved_in assertions; which corresponding role and
    stage are supported for human FGF3?
