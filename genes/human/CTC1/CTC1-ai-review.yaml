suggested_questions:
- question: Can the erroneous Q8K2X3 mouse STN1 WITH/FROM mapping be removed from the CTC1
    CST-complex ISS record while retaining the independent experimental and valid Ctc1-based
    membership assertions?
- question: Does human CTC1 perform a separable telomere-end protection step beyond preventing
    replication-associated damage, and which direct assays distinguish these roles?
- question: Is the predicted 1,031-residue product expressed despite the premature-stop/NMD
    caveat, and does its altered C-terminal region support CST assembly, DNA binding or polymerase
    recruitment?
suggested_experiments:
- description: Measure expression and sequence identity of the shorter product, then compare
    matched full-length and short-product CST preparations for heterotrimer assembly, DNA
    affinity and polymerase-primase initiation.
- description: Separate replication failure from end-protection defects using acute CTC1 perturbation
    outside S phase, matched restoration of replication support, and direct telomere damage/fusion
    readouts.
