core_functions:
- description: CTC1 contacts single-stranded DNA within CST and organizes the template
    with polymerase alpha–primase for initiation. This DNA-binding cofactor activity
    supports telomere maintenance and DNA replication, while substrate sequestration
    also limits telomerase initiation.
