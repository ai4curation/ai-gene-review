id: Q2NKJ3
gene_symbol: CTC1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CTC1 is the large DNA-binding subunit of the CTC1–STN1–TEN1 (CST) complex.
  Its oligonucleotide-binding domains contact single-stranded DNA and organize the
  template with polymerase alpha–primase, supporting initiation of telomeric C-strand
  synthesis and replication recovery. CST also limits telomerase initiation by sequestering
  DNA substrate. CTC1 acts in the nucleus, including chromosome ends, and defects
  in its replication-support functions cause telomere instability. The characterized
  full-length product contains 1,217 residues; a shorter alternatively spliced product
  lacks part of the C-terminal DNA-binding and assembly region, and its functional
  activity has not been established.
