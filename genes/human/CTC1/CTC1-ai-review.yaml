- id: PMID:19854130
  title: RPA-like mammalian Ctc1-Stn1-Ten1 complex binds to single-stranded DNA and protects
    telomeres independently of the Pot1 pathway.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The complete abstract establishes mammalian CST and ssDNA/telomere association.
      Increased G-strand telomeric DNA is reported after Stn1 knockdown; the unavailable full
      text leaves CTC1-specific capping experiments unresolved. Its failure to colocalize
      with replication foci is an assay-specific observation, not disproven by later work.
      The broader proposal of no direct conventional-fork role should not exclude the subsequently
      demonstrated regulation of non-telomeric origin firing (PMID:25483097); direct action
      at ordinary forks is a separate question. Positive experimental annotations retain curator
      deference plus independent human corroboration.
