core_functions:
- description: CTC1 contacts single-stranded DNA within CST and organizes the template with
    polymerase alpha–primase for telomeric C-strand synthesis. DNA substrate sequestration
    limits telomerase initiation. CTC1-containing CST also enhances new origin firing during
    recovery from replication stress; this regulatory effect is distinct from the DNA-binding
    cofactor contribution and does not assign polymerase or primase chemistry to CTC1.
