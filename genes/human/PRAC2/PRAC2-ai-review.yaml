      UniProt sequence.
    action: ACCEPT
    reason: The only experimental localization for this protein, and consistent with its
      short, arginine-rich, domain-less sequence. The cached record is abstract-only and
      the abstract hedges ("seems to encode"), so the assay behind the nuclear call could
      not be inspected; the curator saw the full text and the annotation is accepted on
      that basis. Nucleus is the only established property of PRAC2.
