description: >-
  PRAC2 (prostate, rectum and colon expressed gene protein 2) encodes a small, 90-amino-acid
  arginine-rich protein of about 10.5 kDa from a locus on chromosome 17q21 that lies
  between HOXB13 and PRAC1; the same locus has also been catalogued as the antisense
  RNA HOXB13-AS1. The transcript is expressed mainly in prostate, rectum, distal colon and
  testis, with weaker expression in several other tissues and prostate cancer cell lines.
  The protein has no recognisable domains and has been reported to be nuclear. No
  molecular activity, binding partner or biological process has been demonstrated for it.
