suggested_questions:
- question: >-
    Is endogenous PRAC2 protein detectable in prostate or colorectal epithelium, and does
    it remain nuclear at endogenous levels? The only localization comes from a single
    2003 study, and the locus is also studied as a non-coding antisense RNA
    (HOXB13-AS1), so it is open whether the protein or the RNA carries the locus's
    reported effects.
suggested_experiments:
- hypothesis: PRAC2 protein is made endogenously and acts in the nucleus independently of
    the HOXB13-AS1 RNA function.
  description: >-
    Raise antibodies or knock in an epitope tag at the endogenous PRAC2 ORF in a
    prostate cell line (e.g. LNCaP); confirm translation by immunoblot and targeted mass
    spectrometry; localize by immunofluorescence and fractionation; identify nuclear
    partners by proximity labelling; and compare start-codon mutation (protein-null,
    RNA-intact) with RNA knockdown to separate protein from RNA functions.
  experiment_type: protein detection, localization and separation-of-function
