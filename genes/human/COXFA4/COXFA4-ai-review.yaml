id: O00483
gene_symbol: COXFA4
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COXFA4, formerly named NDUFA4, is an 81-amino-acid single-pass membrane
  subunit of mitochondrial cytochrome c oxidase (complex IV). Its transmembrane helix
  and intermembrane-space region contribute to the architecture of the terminal respiratory
  enzyme, which transfers electrons from cytochrome c to oxygen and couples this reaction
  to proton translocation. COXFA4 supports efficient complex-IV oxidase function as
  part of the enzyme, rather than acting as an autonomous oxidase or a complex-I NADH
  dehydrogenase subunit. Pathogenic loss of COXFA4 causes mitochondrial complex-IV
  deficiency and neurological disease. COXFA4 abundance can also be regulated by the
  C15ORF48/miR-147 system, with respiratory and innate-response effects demonstrated
  in defined human cell models.
