core_functions:
- description: COXFA4 is a membrane-integrated structural subunit of cytochrome c
    oxidase. Its incorporation into complex IV supports efficient terminal respiratory
    electron transfer and proton-coupled oxidase activity. Proton transport is included
    at the complex-structural contribution level, without assigning an isolated pumping
    mechanism or stoichiometry to COXFA4. Human endogenous immunocapture, depletion/rescue,
    patient biochemistry and structure establish this contribution; detectable patient
    holoenzyme without normal COXFA4 limits an obligatory assembly-factor interpretation.
  contributes_to_molecular_function:
    id: GO:0004129
    label: cytochrome-c oxidase activity
  directly_involved_in:
  - id: GO:0006123
    label: mitochondrial electron transport, cytochrome c to oxygen
  - id: GO:1902600
    label: proton transmembrane transport
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  in_complex:
    id: GO:0045277
    label: respiratory chain complex IV
  supported_by:
  - reference_id: PMID:22902835
    supporting_text: Rather, proteomic, genetic, evolutionary, and biochemical analyses
      reveal that NDUFA4 plays a role in CIV function and biogenesis
  - reference_id: PMID:30030519
    supporting_text: Intriguingly, NDUFA4 lies exactly at the dimeric interface observed
      in previously reported crystal structures of complex-IV homodimer which would
      preclude complex-IV dimerization
suggested_questions:
- question: How does the COXFA4 structural contribution alter complex-IV electron-transfer
    and proton-coupling kinetics independently of changes in enzyme abundance?
- question: What functional consequence follows from the direct PARK7–COXFA4 interaction
    after distinguishing complex-IV biology from the original complex-I interpretation?
- question: Which molecular step links regulated COXFA4 abundance to innate-response
    changes in the C15ORF48/miR-147 cell models?
suggested_experiments:
- description: Compare matched amounts of purified or membrane-reconstituted complex
    IV with defined COXFA4 occupancy, measuring oxidase turnover and proton coupling
    together with structural integrity.
- description: Test the consequences of selectively disrupting the PARK7–COXFA4 interface
    while preserving each protein’s abundance, localization and intrinsic properties.
status: DRAFT
