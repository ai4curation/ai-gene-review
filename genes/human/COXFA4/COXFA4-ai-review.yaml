  review:
    summary: Structural participation in proton-coupled complex IV supports this process,
      but the current electronic premise is wrong.
    action: ACCEPT
    reason: GO:1902600 concerns proton movement across a membrane. COXFA4 supplies
      part of the human complex-IV structure and supports oxidase function in depletion/rescue
      and patient experiments. Retain participation at this complex-subunit scope;
      this is not a claim that isolated COXFA4 is a proton channel or that its individual
      pumping stoichiometry was measured. The complete current GO_REF:0000108 record
      is inferred from GO:0008137, not GO:0004129. That complex-I activity premise
      is contradicted by reassignment and is marked adverse independently of the retained
      biological conclusion.
