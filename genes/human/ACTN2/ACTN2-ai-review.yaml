  review:
    action: REMOVE
    summary: The EF-hand-domain inference incorrectly assigns calcium binding to calcium-insensitive ACTN2.
    reason: 'This is not inferred merely from calcium-insensitive actin binding: the human ACTN2 structure
      identifies substitutions at calcium-coordinating positions in all four EF hands, including an inhibitory
      Arg in EF1, altered ligands in EF2/3 and no calcium-promoting residue in EF4. The broad InterPro
