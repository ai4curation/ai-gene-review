id: P35609
gene_symbol: ACTN2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Alpha-actinin-2 is a calcium-insensitive actin-filament crosslinking protein that forms antiparallel
  dimers. Its N-terminal actin-binding domains and central spectrin-repeat rod organize actin filaments,
  while its C-terminal calmodulin-like region binds titin. In cardiac and skeletal muscle, it forms structural
  connections at the sarcomeric Z-disc that organize and stabilize the contractile apparatus. Phosphatidylinositol
  4,5-bisphosphate and titin binding regulate its conformational state. Alpha-actinin-2 also organizes
  the actin cytoskeleton of neuronal dendritic spines and connects cytoskeletal structures to selected
  ion channels and signaling partners. Pathogenic ACTN2 variants cause cardiac and skeletal muscle disease.
