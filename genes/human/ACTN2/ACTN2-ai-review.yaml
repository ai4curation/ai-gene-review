core_functions:
- description: Crosslinks actin filaments and integrates them with titin at the muscle Z-disc. The antiparallel
    dimer provides structural connections for sarcomere organization; phosphoinositide-sensitive titin
    binding regulates these connections.
  molecular_function:
    id: GO:7770064
    label: actin-filament cross-linking activity
  directly_involved_in:
  - id: GO:0045214
    label: sarcomere organization
  locations:
  - id: GO:0030018
    label: Z disc
  supported_by:
  - reference_id: PMID:25433700
    supporting_text: where it plays a central role crosslinking actin and titin filaments.
  - reference_id: PMID:11101506
  - reference_id: PMID:27287556
- description: Provides structural organization of the postsynaptic actin cytoskeleton that supports spine
    maturation and postsynaptic-density assembly. Endogenous knockdown and rescue with human ACTN2 were
    tested in rat hippocampal neurons; this supports the human protein’s structural capacity in that model
    without establishing its necessity in human neurons.
  molecular_function:
    id: GO:0098973
    label: structural constituent of postsynaptic actin cytoskeleton
  directly_involved_in:
  - id: GO:0098974
    label: postsynaptic actin cytoskeleton organization
  locations:
  - id: GO:0098978
    label: glutamatergic synapse
  supported_by:
  - reference_id: PMID:25007055
    supporting_text: α-actinin-2 re-organizes the actin cytoskeleton in filopodia-like dendritic protrusions
      to promote assembly of the PSD
  - reference_id: PMID:37489746
suggested_questions:
- question: How do endogenous ACTN2 splice products and phosphoinositide-dependent conformations divide
    their contributions to Z-disc assembly and maintenance in cardiac versus skeletal muscle?
- question: How much of the neuronal ACTN2 structural role is conserved in human neurons, and how does
    endogenous ACTN2 partition structural and channel-associated interactions during synaptic activity?
suggested_experiments:
- hypothesis: ACTN2 variants that alter its conformational equilibrium can disrupt Z-disc organization
    independently of total protein abundance.
  description: Compare matched-expression wild-type and variant human ACTN2 in isogenic cardiomyocytes,
    measuring Z-disc architecture and exchange dynamics alongside purified-protein actin crosslinking
    and titin-binding assays with defined phosphoinositide conditions. Include localization, protein stability
    and contractility controls to separate structural defects from changes in abundance.
  experiment_type: Isogenic cardiomyocyte rescue and purified-protein biochemistry
- hypothesis: The calcium-insensitive structural role of ACTN2 observed in rodent spines is conserved
    in human neurons.
  description: Use ACTN2-selective depletion and matched-expression rescue in human induced pluripotent
    stem cell-derived neurons. Quantify spine actin architecture and postsynaptic-density recruitment
    with wild-type and actin-binding-defective ACTN2, controlling for other alpha-actinin paralogs, neuronal
    maturity and toxicity.
  experiment_type: Human neuronal depletion/rescue and quantitative imaging
