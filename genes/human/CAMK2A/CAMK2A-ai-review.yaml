  evidence_type: IEA
  review:
    action: UNDECIDED
    summary: Holoenzyme assembly alone does not establish postsynaptic-density organization.
    reason: The prior proposal inferred PSD organization from CAMK2A abundance and dodecamer formation.
      PMID:16120608 supplies stronger biochemical evidence for a multivalent alpha/NR2B/densin/alpha-actinin
      complex and proposes a nucleating model, but the accessible abstract does not directly measure native
      PSD assembly or organization. The kinase clearly performs binding and phosphotransfer work; whether
      that independently warrants this additional organization assertion remains unresolved. Retain the
      historical proposal as UNDECIDED, not as a newly verified process.
