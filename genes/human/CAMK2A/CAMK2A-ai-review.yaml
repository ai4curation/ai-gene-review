  title: Requirement of Ca2+ and CaMKII for Stat1 Ser-727 phosphorylation in response to IFN-gamma.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract and Results/Discussion read; detailed Methods are absent. Cellular
      STAT1 interaction/activity uses gamma/delta, with rat-brain alpha/beta kinase as a positive control.
      Independent human alpha evidence and a target-specific GO-CAM support retention with explicit isoform
      limits.
- id: PMID:17052756
  title: Bcl10 is phosphorylated on Ser138 by Ca2+/calmodulin-dependent protein kinase II.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete normal cached abstract checked. BCL10 Ser138 phosphorylation and attenuating
      NF-kappaB regulation are explicit; original alpha-specific constructs and interaction assays were
      not available. The obsolete positive-direction source annotation remains unresolved rather than
      inferred from a different signaling step.
  full_text_unavailable: true
- id: PMID:19453375
  title: Phosphorylation status of the NR2B subunit of NMDA receptor regulates its interaction with calcium/calmodulin-dependent
    protein kinase II.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete normal cached abstract read. It explicitly identifies CaMKII-alpha-GFP, NR2B
      constructs and GST pull-down assays. Full detailed Methods were not recovered; activation-state
      mutants are distinguished from unmodified kinase.
  full_text_unavailable: true
- id: PMID:20668654
  title: Structure of the CaMKIIdelta/calmodulin complex reveals the molecular mechanism of CaMKII kinase
    activation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and selected complete Results/Methods read. All four human kinase
      domains were analyzed; the calmodulin-bound crystal is delta, while alpha was tested as residues13–301
      in the domain study. Weak domain self-association does not describe the entire native holoenzyme.
