core_functions:
- description: Phosphorylates neuronal targets as a calcium/calmodulin-regulated CaMKII-alpha subunit,
    coupling calcium signals and intersubunit autophosphorylation to synaptic potentiation and spine development.
    Target binding and holoenzyme assembly organize this catalytic activity rather than constituting redundant
    kinase cores.
