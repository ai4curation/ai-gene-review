suggested_questions:
- question: Which endogenous human CAMK2A-specific assays establish the cardiac mitochondrial and cell-cycle
    contexts currently transferred from mouse, and how should the disputed direct MCU mechanism be separated
    from injury phenotypes?
- question: Does CAMK2A directly organize native postsynaptic-density architecture independently of its
    catalytic activity, beyond biochemical complex assembly and abundance?
- question: Which original experiments resolve the alpha-specific IFN-gamma and NF-kappaB source assertions,
    including the opposing CARMA1 and BCL10 regulatory steps?
- question: How do the two recorded human CAMK2A splice products differ in localization and signaling
    when tested at endogenous expression?
suggested_experiments:
- description: Compare endogenous alpha-specific depletion and rescue with wild-type, kinase-dead and
    activation-state mutants, measuring substrate phosphorylation and compartment-specific localization
    separately.
- description: Test PSD assembly with separation-of-function target-binding and catalytic mutants, using
    structural measurements of the native PSD rather than holoenzyme formation alone.
