id: Q9UQM7
gene_symbol: CAMK2A
aliases:
- CAMKA
- KIAA0968
- CaMKIINalpha
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CAMK2A encodes the alpha subunit of calcium/calmodulin-dependent protein kinase II, an intracellular
  serine/threonine kinase enriched at excitatory neuronal synapses. Calcium-bound calmodulin relieves
  autoinhibition, and intersubunit Thr286 autophosphorylation can sustain activity after calcium falls.
  Alpha subunits form homo- and heteromeric CaMKII assemblies and couple synaptic calcium signals to phosphorylation
  and association of glutamate-receptor complexes and other targets. These activities support synaptic
  potentiation and dendritic-spine development. Alpha-specific perturbations also influence presynaptic
  release and endocannabinoid signaling in rodent models. Human pathogenic variants can disrupt catalytic
  regulation, target association and neuronal development; their effects differ by variant and should
  not be equated with a single activation defect.
