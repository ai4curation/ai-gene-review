- term:
    id: GO:0060996
    label: dendritic spine development
  evidence_type: IMP
  original_reference_id: PMID:28130356
  review:
    action: ACCEPT
    summary: Catalytic and interaction defects in human CAMK2A affect dendritic-spine development.
    reason: The E183V study reports reduced kinase activity, WT/mutant holoassembly and altered spine
      density in neuronal expression models. These findings connect CAMK2A catalytic/interaction work
      with spine development. Mutant overexpression and model context are preserved; this is not presented
      as direct imaging of a human patient's neurons or as a universal gain/loss-of-function rule.
    supported_by:
    - reference_id: PMID:28130356
      supporting_text: decreases both dendritic spine density and excitatory synaptic transmission
  qualifier: involved_in
- term:
    id: GO:1990443
    label: peptidyl-threonine autophosphorylation
  evidence_type: IMP
  original_reference_id: PMID:28130356
  review:
    action: ACCEPT
    summary: Regulatory threonine autophosphorylation is part of CAMK2A activation.
    reason: Adjacent activated alpha subunits phosphorylate Thr286, generating autonomous activity; E183V
      impairs regulatory autophosphorylation. This is phosphotransfer performed by the kinase on another
      subunit of its assembly, not an inferred process based only on being a phosphorylation substrate.
    supported_by:
    - reference_id: PMID:28130356
    - reference_id: PMID:20668654
  qualifier: involved_in
