    summary: Human alpha constructs target dendritic spines.
    reason: PMID:28130356 compares wild-type human alpha with E183V and describes spine targeting and
      synaptic effects in neuronal models. The available cached abstract/Discussion supports the location,
      although detailed Methods and original imaging panels were not accessible. This is target localization
      evidence, not merely the compartment of a phosphorylated substrate.
