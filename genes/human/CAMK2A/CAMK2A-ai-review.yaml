    label: calcium- and calmodulin-dependent protein kinase complex
  evidence_type: IDA
  original_reference_id: PMID:28130356
  review:
    action: ACCEPT
    summary: CAMK2A functions within CaMKII homo- and heteromeric assemblies.
    reason: Human alpha structural studies and WT/E183V coassembly support CaMKII-complex membership.
      PMID:20668654 compares isolated kinase-domain self-association, while PMID:21884935 uses a specifically
      engineered alpha holoenzyme for crystallography; neither is evidence that every native holoenzyme
      has the same conformation or isoform composition. Human WT/mutant coassembly supplies independent
      target support.
    supported_by:
    - reference_id: PMID:21884935
      supporting_text: "Calcium/calmodulin-dependent kinase II (CaMKII) forms a highly conserved \ndodecameric\
        \ assembly"
    - reference_id: PMID:28130356
  qualifier: part_of
- term:
