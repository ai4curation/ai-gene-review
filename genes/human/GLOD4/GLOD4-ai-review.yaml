- term:
    id: GO:0140096
    label: catalytic activity, acting on a protein
  evidence_type: IDA
  original_reference_id: PMID:41628334
  qualifier: enables
  review:
    summary: >-
      Proposed NEW annotation, and deliberately an unspecific one. GLOD4 is reported to be an
      enzyme that transfers a nitro group onto tyrosine residues of protein substrates using
      peroxynitrite as cosubstrate. GO has no term for protein nitration in either the
      molecular-function or the biological-process branch, so this general term is used as an
      explicit placeholder for the activity until the terms filed under proposed_new_terms exist.
    action: NEW
    reason: >-
      The underlying evidence is strong for a single study - Michaelis-Menten kinetics on an
      alpha-synuclein peptide with kcat/Km of 1.6e7 per M per s, MS localisation of the modified
      tyrosines, stopped-flow demonstration that GLOD4 accelerates peroxynitrite decomposition,
      loss of activity in structure-guided active-site mutants, an 86% reduction of
      alpha-synuclein nitration in knockout cells and gene-dose-dependent reductions in knockout
      mice. It is nevertheless a single paper from a single laboratory with a declared patent
      application on the activity, the authors themselves present the enzyme class as a proposal
      ("tentatively refer to as nitrases"), and the catalytic mechanism and the role of the zinc
      are stated to be unresolved. This annotation is therefore offered as a reviewer proposal
      for a well-evidenced but as yet unreplicated activity, not as a settled assignment. It is
      placed at this general altitude on purpose: the specific alternatives in GO today would be
      wrong. GO:0017014 protein nitrosylation is S-nitrosylation by nitric oxide, and the paper
      explicitly excludes nitric oxide and NO-derived oxidants as GLOD4 cosubstrates;
      GO:0072541 peroxynitrite reductase activity and GO:0062213 peroxynitrite isomerase
      activity denote detoxification of peroxynitrite to nitrite or nitrate, which would assert
      the opposite biological consequence from nitrating a target protein.
    supported_by:
    - reference_id: PMID:41628334
      supporting_text: >-
        Here, we showed that glyoxalase domain-containing protein 4 (GLOD4), a previously
        uncharacterized protein, is an enzyme that catalyzes selective protein nitration.
    - reference_id: PMID:41628334
      supporting_text: confirmed that GLOD4 catalyzed the nitration of the tyrosine residues Y39
        and Y125 of α-syn
    - reference_id: PMID:41628334
      supporting_text: >-
        The estimated catalytic efficiency kcat/Km was 1.6 × 107 M−1 s−1, indicating that GLOD4
        is an efficient enzyme for nitrating α-synuclein.
    - reference_id: PMID:41628334
      supporting_text: >-
        The data illustrate that GLOD4 selectively uses peroxynitrite as a cosubstrate, and not
        nitric oxide or nitric oxide-derived oxidants, or H2O2 combined with nitrite, to nitrate
        α-syn.
    - reference_id: PMID:41628334
      supporting_text: >-
        In the GLOD4-KO line, tyrosine nitration of α-syn was reduced by 86% upon adding
        peroxynitrite under the same experimental conditions, indicating that GLOD4 mediates
        α-syn nitration in cells.
