id: Q9HC38
gene_symbol: GLOD4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  GLOD4 (glyoxalase domain-containing protein 4, formerly C17orf25) is a 313-residue
  metalloprotein of the vicinal oxygen chelate (VOC) superfamily, the structural fold shared by
  glyoxalase I, glyoxalase II and related enzymes. Despite the fold and the gene name, no
  glyoxalase or other metabolic activity has been demonstrated for it and it carries no EC
  number. Its first assigned catalytic activity, reported in 2026, is an unusual one: GLOD4
  accelerates the decomposition of peroxynitrite and uses it to nitrate tyrosine residues on a
  small set of protein substrates, principally alpha-synuclein and beta-synuclein, with
  protein phosphatase PPM1B and polyglutamine-binding protein PQBP1 nitrated in vitro. The
  reaction is selective for peroxynitrite as cosubstrate - nitric oxide, NO-derived oxidants and
  hydrogen peroxide plus nitrite do not substitute - and depends on a zinc site formed by His8
  and Glu70 together with Cys254, mutation of which abolishes activity. Cells and mice lacking
  GLOD4 show large, gene-dose-dependent reductions in alpha-synuclein tyrosine nitration, both
  at baseline and after methamphetamine challenge, although knockout mice are viable and
  outwardly normal to 18 months. The protein is found in both cytosol and mitochondria, with
  more in the cytosol, and is expressed in neurons, astrocytes and microglia as well as in
  erythrocytes. Because tyrosine nitration of alpha-synuclein promotes its aggregation and is a
  feature of Parkinson's disease pathology, enzymatic rather than purely chemical nitration is
  of pathological interest; the enzymatic-nitration category itself rests on this one study.
