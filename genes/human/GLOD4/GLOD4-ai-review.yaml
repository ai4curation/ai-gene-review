core_functions:
- description: >-
    Metal-dependent enzyme that uses peroxynitrite to nitrate tyrosine residues on a small,
    selected set of protein substrates. GLOD4 accelerates peroxynitrite decomposition about
    5.5-fold and channels it into the addition of a nitro group to specific tyrosines, giving
    3-nitrotyrosine; the demonstrated targets are alpha-synuclein (Tyr39, Tyr125, Tyr133,
    Tyr136) and beta-synuclein, with PPM1B and PQBP1 nitrated in vitro only, out of 23,000
    proteins screened on a protein array. Gamma-synuclein, which lacks the C-terminal tyrosine
    cluster, is not a substrate. The activity requires a metal site formed by His8 and Glu70,
    occupied by zinc in the purified protein, together with Cys254; all three substitutions
    abolish or strongly reduce catalysis. Cosubstrate use is specific to peroxynitrite, and
    GLOD4 is not an oxidase or a peroxidase. In cells and in mice GLOD4 accounts for most
    alpha-synuclein tyrosine nitration, both basal and induced. The molecular_function term
    below is a flagged placeholder, not a description: GO contains no term for protein nitration
    of any kind, and the nearest specific alternatives would assert either the wrong chemistry
    (S-nitrosylation) or the opposite outcome (peroxynitrite detoxification). The intended terms
    are the two entries under proposed_new_terms. This function rests on a single 2026 study
    from one laboratory with a declared patent interest and has not been independently
    replicated.
  molecular_function:
    id: GO:0140096
    label: catalytic activity, acting on a protein
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005739
    label: mitochondrion
  supported_by:
  - reference_id: PMID:41628334
    supporting_text: >-
      Collectively, these data indicate that GLOD4 nitrates select target proteins and is the
      principal enzyme responsible for α-syn nitration.
  - reference_id: PMID:41628334
    supporting_text: GLOD4 catalyzed the nitration of α-syn and β-syn, PPM1B and PQBP1.
  - reference_id: PMID:41628334
    supporting_text: >-
      Collectively, these data indicate that enzymatic nitration, specifically GLOD4-mediated
      nitration, is responsible for a significant portion of the in vivo α-syn nitration in both
      the periphery and brain in untreated basal and methamphetamine-treated mice.
  knowledge_gaps:
  - gap_statement: >-
      The catalytic mechanism of GLOD4-mediated tyrosine nitration is undetermined: it is not
      known how the enzyme converts bound peroxynitrite into a nitrating species, whether zinc
      is the catalytic metal or a structural one, or what role Cys254 plays.
    boundary: >-
      Established: GLOD4 accelerates peroxynitrite decomposition about 5.5-fold; zinc is present
      in the purified protein by ICP-MS; alanine substitution of the metal ligands His8 and
      Glu70 and of Cys254 reduces or abolishes nitration of alpha-synuclein; the reaction
      requires peroxynitrite specifically and GLOD4 is neither an oxidase nor a peroxidase.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    significance: >-
      Without a mechanism it is difficult to distinguish genuine catalysis from a metal-dependent
      scaffold that positions a target tyrosine for radical chemistry, and impossible to design
      selective inhibitors - the one inhibitor tested, nitromethane, is explicitly nonspecific.
    resolution: >-
      Spectroscopic and structural characterisation of the enzyme-peroxynitrite intermediate,
      metal substitution series, and turnover measurements with limiting enzyme.
    provenance:
    - reference_id: PMID:41628334
      supporting_text: Work to further dissect the catalytic mechanism of GLOD4 activity is
        ongoing.
    - reference_id: PMID:41628334
      supporting_text: This includes determining if zinc is the only metal for catalysis by
        GLOD4.
  - gap_statement: >-
      No biological process has been tied to GLOD4. Knockout mice lose most alpha-synuclein
      tyrosine nitration yet are outwardly normal, so what the activity is for - in development,
      in homeostasis, or only under oxidative or nitrosative challenge - is unknown.
    boundary: >-
      Established: GLOD4 accounts for roughly 86% of peroxynitrite-driven alpha-synuclein
      nitration in knockout cells, and for 97% (erythrocytes) and 66% (striatum) of basal
      alpha-synuclein nitration in knockout mice, with intermediate values in heterozygotes.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
    significance: >-
      Alpha-synuclein nitration promotes aggregation and is a feature of Parkinson's disease
      pathology, so whether an enzyme drives it is directly relevant to whether it can be
      targeted; a viable, normal knockout is also the strongest available argument that such
      targeting could be tolerated.
    resolution: >-
      Challenge the knockout in a synucleinopathy model and under inflammatory or nitrosative
      stress, and determine whether any nitration-dependent phenotype emerges.
    provenance:
    - reference_id: PMID:41628334
      supporting_text: >-
        We also observed that GLOD4-KO mice were viable, follow Mendelian genetics in terms of
        birth rates, and show no phenotypic defects through 18 mo of age.
    - reference_id: PMID:41628334
      supporting_text: >-
        Since GLOD4 is a previously uncharacterized protein, little is known particularly in
        relation to association with Parkinson’s disease (PD).
  - gap_statement: >-
      Even where the biology is established, it cannot be expressed: GO contains no term for
      protein tyrosine nitration in either the molecular-function or the biological-process
      branch, so GLOD4's characterised activity can only be recorded at the uninformative
      altitude of "catalytic activity, acting on a protein".
    boundary: >-
      Established: the modification is chemically defined (3-nitrotyrosine), the residues
      modified on alpha-synuclein are mapped (Y39, Y125, Y133, Y136), and the cosubstrate is
      identified. The obstacle is the vocabulary, not the evidence.
    gap_kind:
    - ONTOLOGY
    dark_aspect: MF_DARK
    significance: >-
      Tyrosine nitration is a long-studied modification with an established literature in
      neurodegeneration, inflammation and cancer; the absence of a term means none of that
      literature is annotatable, whether the nitration is enzymatic or chemical.
    resolution: >-
      Create the two terms filed under this gene's proposed_new_terms - a molecular function for
      the nitrase activity and a biological process for peptidyl-tyrosine nitration - once the
      activity has been independently replicated.
    provenance:
    - reference_id: PMID:41628334
      supporting_text: >-
        The data identified a function of GLOD4 and other structurally related proteins that
        catalyze the peroxynitrite-mediated selective protein tyrosine nitration.
proposed_new_terms:
- proposed_name: protein-tyrosine nitrase activity
  proposed_definition: >-
    Catalysis of the peroxynitrite-dependent addition of a nitro group to position 3 of the
    phenolic ring of a tyrosine residue in a protein substrate, producing peptidyl-3-nitro-L-
    tyrosine.
  justification: >-
    GO currently has no term, in any branch, for protein nitration. Querying the ontology for
    "nitration" returns nothing, and every candidate that exists says something else:
    GO:0017014 protein nitrosylation covers addition of a nitric oxide group (S-nitrosylation of
    cysteine), which is different chemistry on a different residue and is specifically excluded
    for GLOD4 because nitric oxide and NO-derived oxidants do not support the reaction;
    GO:0072541 peroxynitrite reductase activity and GO:0062213 peroxynitrite isomerase activity
    both denote conversion of peroxynitrite to a free anion, that is detoxification, and would
    invert the biological meaning of GLOD4's action even though GLOD4 does accelerate
    peroxynitrite decomposition; and GO:0018212 peptidyl-tyrosine modification is obsolete. Every
    other post-translational modification of comparable biological standing - phosphorylation,
    sulfation, hydroxylation of tyrosine - has both an MF and a BP term, and tyrosine nitration
    is a long-studied modification with an established role in neurodegeneration, inflammation
    and cancer. The term is proposed as a reviewer suggestion tied to a single 2026 study and
    should be created only if the activity is independently replicated; if it is, the term will
    be needed for a family rather than one protein, since the same work reports autonitration by
    several other vicinal-oxygen-chelate superfamily members.
  proposed_parent:
    id: GO:0140096
    label: catalytic activity, acting on a protein
  supported_by:
  - reference_id: PMID:41628334
    supporting_text: >-
      Here, we showed that glyoxalase domain-containing protein 4 (GLOD4), a previously
      uncharacterized protein, is an enzyme that catalyzes selective protein nitration.
  - reference_id: PMID:41628334
    supporting_text: >-
      Thus, we propose that GLOD4 is a putative member of a discovered enzyme family, which we
      tentatively refer to as nitrases based on their ability to catalyze self- or targeted
      protein tyrosine nitration.
- proposed_name: peptidyl-tyrosine nitration
  proposed_definition: >-
    The nitration of peptidyl-tyrosine to form peptidyl-3-nitro-L-tyrosine.
  justification: >-
    The biological-process counterpart of the molecular function above, and missing for the same
    reason. GO has peptidyl-tyrosine phosphorylation (GO:0018108), sulfation (GO:0006478) and
    hydroxylation (GO:0018336) but nothing for nitration, so a protein that nitrates tyrosines
    can only be annotated to the generic GO:0036211 protein modification process. Tyrosine
    nitration is measured routinely as 3-nitrotyrosine, is implicated in Parkinson's disease
    through alpha-synuclein, and would be annotatable from many existing studies once a term
    exists - including studies of non-enzymatic nitration, which the term would also serve. The
    wording follows the pattern of the existing peptidyl-tyrosine modification terms and is
    deliberately silent on mechanism, so that it does not depend on the enzymatic-catalysis
    claim being upheld.
  proposed_parent:
    id: GO:0036211
    label: protein modification process
  supported_by:
  - reference_id: PMID:41628334
    supporting_text: confirmed that GLOD4 catalyzed the nitration of the tyrosine residues Y39
      and Y125 of α-syn
  - reference_id: PMID:41628334
    supporting_text: >-
      A primary in vivo target for GLOD4-mediated nitration is alpha-synuclein (α-syn), which is
      central to the pathogenesis of Parkinson's disease (PD) and related disorders.
suggested_questions:
- question: >-
    Can the nitrase activity be reproduced by an independent laboratory? The entire assignment
    rests on one study from one company that has filed a patent application on the activity.
    Replication with recombinant GLOD4, the published H8A/E70A/C254A mutants and an orthogonal
    nitration readout is the single most valuable next step, and should precede creation of new
    GO terms for the activity.
  experts:
  - Harry Ischiropoulos
  - Irene Griswold-Prenner
- question: >-
    What is the catalytic mechanism, and is zinc the catalytic metal? The authors state that the
    mechanism is unresolved and raise manganese, nickel and iron as alternatives. Without a
    mechanism it is hard to distinguish true catalysis from a metal-dependent scaffold that
    positions a target tyrosine for radical chemistry.
  experts:
  - Aaron L. Lucius
  - Andy Jennings
- question: >-
    Does GLOD4 have any glyoxalase-family metabolic activity at all? The gene name and the
    UniProt family assignment are fold-based, no EC number has ever been assigned, and no
    systematic screen of small-molecule substrates has been published.
  experts: []
- question: >-
    Why is GLOD4 mitochondrial as well as cytosolic, and does it nitrate mitochondrial proteins?
    All characterised substrates are cytosolic, yet fractionation and the MitoCoP proteome both
    place a substantial pool in mitochondria.
  experts:
  - Harry Ischiropoulos
- question: >-
    What is the physiological consequence of losing selective alpha-synuclein nitration? GLOD4
    knockout mice are healthy to 18 months, so the activity is either dispensable, redundant, or
    important only under pathological challenge.
  experts:
  - Robert P. Brendza
  - Mike Beckstead
suggested_experiments:
- hypothesis: >-
    GLOD4 is a true catalyst of tyrosine nitration rather than a peroxynitrite-binding protein
    that accelerates adventitious chemistry on bound substrates.
  description: >-
    Establish turnover independently: measure multiple catalytic cycles per enzyme molecule with
    limiting GLOD4 and excess substrate and peroxynitrite, determine the full steady-state
    kinetic parameters for several substrates, and test whether the enzyme is consumed or
    inactivated by autonitration during the reaction. Pair this with the published active-site
    mutants as internal negative controls, in a laboratory with no interest in the outcome.
  experiment_type: independent enzymology and turnover measurement
- hypothesis: >-
    Substrate selection by GLOD4 is determined by a docking interaction with the substrate
    rather than by local tyrosine chemistry.
  description: >-
    Swap the C-terminal tyrosine-containing region between alpha-synuclein (a substrate) and
    gamma-synuclein (not a substrate), and test nitration of the chimeras; in parallel, measure
    binding of GLOD4 to each synuclein by a label-free method in the absence of peroxynitrite.
    If selectivity follows the transplanted segment but binding does not, selectivity is local
    chemistry; if binding tracks substrate status, GLOD4 has a substrate-recognition surface
    worth mapping.
  experiment_type: chimera and binding analysis
- hypothesis: >-
    GLOD4-dependent alpha-synuclein nitration modifies synuclein pathology rather than baseline
    physiology, which is why knockout mice appear normal.
  description: >-
    Cross GLOD4 knockout mice into an alpha-synuclein preformed-fibril or A53T transgenic model
    and quantify seeding, spread, nitrated-synuclein burden and dopaminergic loss against
    GLOD4-competent littermates. A conditional, adult-onset knockout would separate
    developmental compensation from an ongoing requirement.
  experiment_type: mouse genetics in a synucleinopathy model
- hypothesis: >-
    GLOD4 retains an ancestral vicinal oxygen chelate metabolic activity in addition to, or
    instead of, protein nitration.
  description: >-
    Screen purified GLOD4 against a panel of glyoxalase-pathway and related VOC-superfamily
    substrates (methylglyoxal, S-D-lactoylglutathione, hydroxyacylglutathiones, bleomycin,
    fosfomycin-type epoxides) with and without added Zn2+, Mn2+, Ni2+ and Fe2+, reading out by
    coupled assay or LC-MS. A negative result would be publishable and would firmly retire the
    glyoxalase framing of the gene name.
  experiment_type: broad enzymatic substrate screen
