- id: PMID:41628334
  title: Selective peroxynitrite-mediated protein nitration catalyzed by glyoxalase domain
    containing protein 4.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Verified against PubMed as Wright S, Dang VC, Hussain S, et al., Proc Natl Acad Sci USA
      2026 Feb 2;123(6):e2515002123, doi 10.1073/pnas.2515002123, PMC12890929; full text cached.
      The sole source for every functional claim about GLOD4, and internally well controlled:
      kinetics, MS site mapping, cosubstrate exclusion, active-site mutants, a 23,000-protein
      selectivity screen, knockout cells and gene-dose-dependent knockout mice. Marked VERIFIED
      because the citation and the science are sound as far as one study can be, but two
      limitations should travel with it. Most authors are employees of Nitrase Therapeutics and
      the paper declares a patent application on GLOD4 activity; and the enzyme class is
      presented by the authors themselves as a proposal, with the catalytic mechanism explicitly
      unresolved. Independent replication is not yet available.
