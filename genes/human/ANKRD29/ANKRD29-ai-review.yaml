references:
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: HuRI proteome-scale Y2H screen; source of all ten IPI rows.
- id: PMID:37277814
  title: ANKRD29, as a new prognostic and immunological biomarker of non-small cell lung cancer, inhibits
    cell growth and migration by regulating MAPK signaling pathway.
  findings:
  - statement: ANKRD29 overexpression slows NSCLC proliferation and migration.
    supporting_text: Overexpression of ANKRD29 significantly inhibited cell proliferation and migration,
      promoted the cancerous cells' sensitivity to carboplatin and enhanced the killing ability of T cells
      in NSCLC cells.
  - statement: ANKRD29 is silenced by promoter hypermethylation in NSCLC.
    supporting_text: we found that the hub gene ANKRD29 was remarkedly decreased in NSCLC tissues and
      cell lines due to the promoter hypermethylation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. Overexpression phenotypes in cancer lines plus RNA-seq and docking; no binding
      partner, localization or mechanism. Knockdown data from DRIVE affect growth in only some lines.
- id: PMID:41662930
  title: 'Spatial and multi-omics transcriptomic dissects platinum resistance in lung adenocarcinoma:
    a five-gene predictive model with tumor microenvironment dynamics.'
  findings:
  - statement: ANKRD29 overexpression sensitizes A549/DDP cells to cisplatin.
    supporting_text: Functional validation confirmed that ANKRD29/CACNA2D2 overexpression sensitized A549/DDP
      cells to cisplatin
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; a five-gene prognostic signature study with overexpression validation.
