description: ANKRD29 (ankyrin repeat domain-containing 29) is an uncharacterized ankyrin-repeat protein.
  No molecular activity, location or physiological role is known. In non-small cell lung cancer it is
  reported to be silenced by promoter hypermethylation, and forced overexpression in lung adenocarcinoma
  lines slows proliferation and migration and increases sensitivity to platinum drugs.
