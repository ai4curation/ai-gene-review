knowledge_gaps:
- gap_statement: ANKRD29's molecular activity, partners, location and physiological role are unknown.
  boundary: All ten GOA rows are HuRI yeast two-hybrid hits with no follow-up, and all are removed. PAN-GO
    assigns no annotations, and although PTHR24166 has annotated PAINT nodes, none propagates to ANKRD29.
    The functional literature consists of overexpression phenotypes in lung cancer cell lines.
  gap_kind:
  - BIOLOGY
  dark_aspect: WHOLLY_DARK
  status: OPEN
  significance: ANKRD29 is repeatedly nominated as a tumour-suppressor or prognostic marker in lung cancer,
    but without a molecular function those effects cannot be interpreted.
  resolution: Identify endogenous ANKRD29 partners (for example by proximity labelling) and localization
    in a cell type that expresses it, then test loss of function.
  provenance:
  - reference_id: file:human/ANKRD29/ANKRD29-uniprot.txt
    supporting_text: DR   PAN-GO; Q8N6D5; 0 GO annotations based on evolutionary models.
  - reference_id: PMID:37277814
    supporting_text: Overexpression of ANKRD29 significantly inhibited cell proliferation and migration,
      promoted the cancerous cells' sensitivity to carboplatin and enhanced the killing ability of T cells
      in NSCLC cells.
  - reference_id: PMID:37277814
    supporting_text: found that knock-down of ANKRD29 by shRNA only promotes cell growth in a part of
      NSCLC cells
  - reference_id: file:human/ANKRD29/ANKRD29-deep-research-affinage.md
    supporting_text: no binding partners, enzymatic activity, or upstream/downstream pathway position
      have been characterized in the available corpus
proposed_new_terms: []
suggested_questions:
- question: In which normal tissue or cell type is ANKRD29 expressed, and does its loss there produce
    a phenotype?
suggested_experiments:
- description: Perform proximity labelling of endogenous, tagged ANKRD29 in a cell line that expresses
    it, to identify bona fide partners before any functional assignment.
