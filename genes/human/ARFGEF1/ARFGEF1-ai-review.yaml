    action: MARK_AS_OVER_ANNOTATED
    reason: 'GO:0006887 is defined as a secretion process that ends when molecules
      are secreted from the cell. BIG1 demonstrated territory is upstream of that -
      the trans-Golgi network and endosomes. Where BIG1 has been implicated in surface
      delivery the cargo is an integral membrane protein, ABCA1 or GABA-A receptors,
