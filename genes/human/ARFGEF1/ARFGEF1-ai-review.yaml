- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IDA
  original_reference_id: PMID:15644318
  qualifier: enables
  negated: true
  review:
    summary: A NOT annotation, asserting that BIG1 does not stimulate GTP hydrolysis.
      It is the correct reading of an experiment in which BIG1 did the opposite - it
      inhibited the Rho-GAP activity of myosin IXb, with an IC50 of 0.06 microM, by
      competing with RhoA for the myosin IXb zinc finger/GAP domain.
    action: ACCEPT
    reason: The negation is well founded and worth keeping explicitly, because a Sec7-domain
      protein sitting in a paper about a GAP is exactly the situation in which a positive
      GAP annotation could be created by mistake. BIG1 is a GEF, not a GAP, and its
      effect on the Rho pathway runs through inhibiting someone else's GAP. This row
      and the GO:0034260 IDA from the same paper are two halves of one coherent result,
      not a contradiction.
    supported_by:
    - reference_id: PMID:15644318
      supporting_text: These results suggest that BIG1 and RhoA compete with each other
        for the binding to myosin IXb, thus resulting in the inhibition of the GAP
        activity by BIG1.
