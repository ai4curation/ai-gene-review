- question: Should the interpro2go mapping from IPR000904 (Sec7 domain) be sharpened
    from GO:0032012 regulation of ARF protein signal transduction to GO:0032014 positive
    regulation of ARF protein signal transduction? Every characterised Sec7-domain
    protein is an activator, but the node also covers proteins such as yeast Mon2 whose
    Sec7 region is degenerate, so the family-wide safety of the change is a question
    for InterPro rather than something to infer from one gene.
  experts: []
- question: GO:0005085 is now the maximal molecular-function term for any
    guanine-nucleotide exchange factor. Fourteen ids were merged into it and it has no
    substrate-specific is_a children; its narrow synonyms still name ARF, Rab, Rac, Ral,
    Ran, Rap, Ras, Rho and Sar guanyl-nucleotide exchange factor activity, which is the
    only retrievable record of what was absorbed. Substrate
    specificity is the single most characteristic property of a GEF and is now expressible
    only through annotation extensions. Was this consequence intended, and is has_input
    the recommended way to record it?
  experts: []
- question: PMID:10393931 measured guanine-nucleotide exchange by a fragment spanning
    the BIG1 Sec7 domain and determined the brefeldin A inhibition constant on the
    human protein, and it carries no GO annotation anywhere in GOA. The GO:0005085
    IDA on ARFGEF1 instead cites PMID:15644318, a study of myosin IXb. Should the exchange
    annotation be re-referenced or supplemented?
  experts:
  - Melançon P
- question: ARFGEF1 haploinsufficiency causes a neurodevelopmental disorder in which
    about half of affected individuals have seizures, and the mouse model attributes
    the lowered seizure threshold to reduced surface GABA-A receptors. Has GABA-A receptor
    trafficking been tested in human neurons? PMID:24198228 does not state the species
    of the neurons used, which is why no human GABA-A trafficking annotation is proposed
    here.
  experts:
  - Shen X
suggested_experiments:
- hypothesis: The requirement of BIG1 for normal Golgi morphology is genuinely independent
    of its exchange activity, rather than reflecting residual catalysis below the detection
    threshold of the rescue assays.
  description: Rescue BIG1-depleted cells with a catalytically dead SEC7 mutant (for
    example the glutamate of the catalytic finger, in the 709-840 domain) and with
    the E793K dominant-negative already used in the literature, and score Golgi ribbon
    integrity by electron microscopy alongside cargo export and ARF1-GTP loading. If
    morphology is rescued while ARF1-GTP is not, the structural role is separable and
    deserves its own molecular function term.
  experiment_type: mutagenesis and rescue
- hypothesis: The nuclear and nucleolar pool of BIG1 has a function in ribosome biogenesis
    rather than being a storage or sequestration form.
  description: Use auxin-inducible degradation to deplete BIG1 acutely and measure
    pre-rRNA processing intermediates by northern blot, with U3 snoRNP integrity assessed
    by fibrillarin and nucleolin co-immunoprecipitation. Compare an NLS-dead mutant
    (the 711-715 KPK motif) that cannot enter the nucleus with wild type, so the nuclear
    and Golgi pools can be separated. This is the experiment that would decide whether
    GO:0005732 for BIG1 should ever acquire a companion biological-process term.
  experiment_type: acute depletion and RNA processing
- hypothesis: ARL1 binding is the rate-limiting step for BIG1 recruitment, so the DCB
    point mutants that abolish it should phenocopy BIG1 loss.
  description: Knock in the K105D, Y109K, L156D or Q200E substitutions at the endogenous
    ARFGEF1 locus and measure Golgi ribbon integrity, furin retrograde transport and
    integrin beta-1 glycosylation against a full knockout. A separation of phenotypes
    would show which BIG1 functions require membrane recruitment and which are satisfied
    by the cytosolic pool.
  experiment_type: genome editing and trafficking assays
- hypothesis: The myosin phosphatase scaffold and the AKAP function are two instances
    of one adaptor surface in the BIG1 C-terminus.
  description: Map the myosin IIA, PP1-delta and MYPT1 binding sites within the C-terminal
    region that rescues depletion, and test whether the same fragment competes with
    PKA regulatory subunit binding. If the sites are separable, GO:0030674 is correctly
    stated once for the protein; if they overlap, the adaptor activity is a single
    surface and should be described as such.
  experiment_type: domain mapping and competition binding
knowledge_gaps:
- gap_statement: What BIG1 does in the nucleus and nucleolus is unknown. It concentrates
    there on serum starvation, associates with nucleolin, fibrillarin and U3 snoRNA
    in a nucleic-acid-dependent complex, and notably does not bring ARF with it, so
    the nuclear pool is not performing the known catalytic role of the protein.
  gap_kind:
  - BIOLOGY
  provenance:
  - reference_id: PMID:14973189
    supporting_text: Also of note, ARF was never detected among proteins precipitated
      from purified nuclei by anti-BIG1 antibodies
  - reference_id: PMID:18292223
    supporting_text: Nuclear functions of BIG1 remain to be determined.
- gap_statement: GO can no longer express the substrate specificity of a guanine-nucleotide
    exchange factor. Fourteen ids were merged into GO:0005085, which has no
    substrate-specific is_a children; the activities they named survive only as narrow
    synonyms on the parent, which still lists ARF, Rab, Rac, Ral, Ran, Rap, Ras, Rho and
    Sar guanyl-nucleotide exchange factor activity. So for ARFGEF1 - whose defining
    property is that it is an ARF1/ARF3 exchange factor - the most informative molecular
    function term available says only guanyl-nucleotide exchange factor activity, and
    the specificity survives only as an annotation extension.
  gap_kind:
  - ONTOLOGY
  provenance:
  - reference_id: file:human/ARFGEF1/ARFGEF1-bioinformatics/RESULTS.md
    supporting_text: GO:0005085 now lists 14 merged ids among its secondaryIds and
      has no substrate-specific is_a children.
- gap_statement: The great majority of what is known about human BIG1 has never reached
    GO. Of the twenty-six functional papers returned by the affinage deep-research
    provider, only six have produced any GO annotation on ARFGEF1 and seventeen have
    produced none anywhere in GOA - including the paper that measured the exchange
    reaction and the brefeldin A inhibition constant, the PKA/PP1-gamma regulatory
    switch, both ARL1 crystal structures, the homodimer, the retrograde transport step
    and the myosin phosphatase scaffold. This is a curation-coverage gap, not an over-annotation
    problem.
  gap_kind:
  - CURATION
  provenance:
  - reference_id: file:human/ARFGEF1/ARFGEF1-bioinformatics/RESULTS.md
    supporting_text: of the 26 functional papers affinage returned, only 6 have produced
      any GO annotation on human ARFGEF1
  - reference_id: file:human/ARFGEF1/ARFGEF1-deep-research-affinage.md
    supporting_text: 'citation_count: 26'
