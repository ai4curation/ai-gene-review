  review:
    summary: Guanine-nucleotide exchange is the defining activity of the whole Sec7-domain
      superfamily, and the PAINT node behind this row spans it - yeast Sec7, Gea1,
      Gea2, Syt1 and Mon2, Arabidopsis GNOM, Drosophila Sec71 and garz, the human
      and mouse cytohesins, PSD, PSD3, IQSEC2, and ARFGEF2. ARFGEF1 itself appears
      in the WITH/FROM because it carries its own IDA for the term.
    action: ACCEPT
    reason: 'Sound at every level. All eighteen protein donors carry their own experimental
      evidence for this exact term (sixteen are Swiss-Prot; the two TrEMBL entries
      are Drosophila Sec71 and garz), and ARFGEF1 has the SEC7 domain (UniProt DOMAIN
      709..840) plus a direct measurement of the activity on the human protein. Note
      that no more specific term is available:
      GO:0005085 carries 14 merged ids among its secondaryIds, including GO:0005086, and
      has no substrate-specific is_a children at all. Those merged ids now resolve to
      the parent, so their former labels are gone from the ontology; what identifies the
      absorbed activities is the narrow synonym list GO:0005085 still carries, naming
      ARF, Rab, Rac, Ral, Ran, Rap, Ras, Rho and Sar guanyl-nucleotide exchange factor
      activity. Consistently, not one of the eighteen donors holds any descendant of
      GO:0005085 - they all hold GO:0005085 itself. So this is already the maximal
      term and no child should be proposed.'
    supported_by:
    - reference_id: PMID:10393931
      supporting_text: A 39-kDa fragment spanning the Sec7 domain catalyzed loading
        of guanosine 5'-[gamma-thio]triphosphate onto class I ARFs and displayed clear
        sensitivity to BFA.
    - reference_id: file:human/ARFGEF1/ARFGEF1-bioinformatics/RESULTS.md
      supporting_text: All 18 protein donors of the GO:0005085 IBA carry their own
        experimental evidence for that term, 16 of them as Swiss-Prot entries, and
        none holds a descendant of it.
