  review:
    summary: BIG1 and its paralogue BIG2 (ARFGEF2) co-purify in >670 kDa complexes
      from brain cytosol and co-immunoprecipitate reciprocally and near-quantitatively.
      The interaction is real and well replicated, but the term states nothing about
      function.
    action: REMOVE
    reason: Removal is on the ground that GO:0005515 is uninformative, not that the
      interaction is doubtful - IntAct holds six distinct experiments across four publications
      for this pair, with a maximum MI score of 0.84. No more informative molecular
      function can be substituted, because BIG1 and BIG2 are paralogues rather than
      identical, and the shared assembly is described by UniProt only as the same or
      very similar macromolecular complexes, which does not support a named complex
      term.
    supported_by:
    - reference_id: PMID:10716990
      supporting_text: All observations were consistent with the conclusion that significant
        fractions of BIG1 and BIG2 exist as components of the same macromolecular complexes
        in bovine brain cytosol and are similarly localized in cultured cells.
