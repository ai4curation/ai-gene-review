    describes only myosin IXb. If the full text has no MYO9A experiment, the affected
    rows are ARFGEF1 GO:0017022 with B2RTY4, MYO9A GO:0005515 with Q9Y6D6, MYO9A GO:0005515
    with P61586, and RHOA GO:0005515 with B2RTY4.
