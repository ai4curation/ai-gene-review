- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IDA
  original_reference_id: PMID:10716990
  qualifier: located_in
  review:
    summary: BIG1 co-fractionates with the Golgi marker beta-COP on density gradients
      of a microsomal fraction and partially colocalises with Golgi 58K protein and
      gamma-adaptin, placing the membrane-associated pool of the protein on Golgi
      membranes. This is where the SEC7 domain does its work, so the location is
      core.
    action: ACCEPT
    reason: Directly measured, consistent with every other localisation study of BIG1,
      and mechanistically necessary - a peripheral Arf-GEF has to be on the donor
      membrane to load ARF1/ARF3 with GTP there.
    supported_by:
    - reference_id: PMID:10716990
      supporting_text: After density gradient centrifugation of a microsomal fraction,
        BIG1 and BIG2 were recovered in the same fraction as beta-COP, a marker for
        Golgi membranes.
