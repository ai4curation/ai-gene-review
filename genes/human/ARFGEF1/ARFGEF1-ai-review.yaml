      nuclear RNA (snRNA) class; GO:0005732 is a ribonucleoprotein complex that contains
      an RNA molecule of the snoRNA family and associated proteins. They are sibling
      is_a children of GO:0030529, so GO:0030532 is not a parent of the right answer,
      it is a different branch. The likeliest cause is a sno-to-sn transcription slip.
      I stopped at GO:0005732 rather than going on to GO:0031428 box C/D methylation
      guide snoRNP complex, because U3 is a box C/D snoRNA but guides pre-rRNA cleavage
      rather than 2-O-methylation, and GO:0031428 requires the complex be capable of
      ribose-2-O-methylation. The part_of qualifier is kept because it is the curator
      call and only the RNA class is being corrected - though the authors themselves
      hedge, and the association is nucleic-acid-dependent.'
