  review:
    summary: The direct-assay record of the exchange activity. BIG1 loads GTP onto
      the class I ARFs ARF1 and ARF3; the reaction is catalysed by the SEC7 domain
      and inhibited by brefeldin A.
    action: ACCEPT
    reason: 'Correct and core. The substrate identity, which is the single most characteristic
      fact about this protein, cannot be carried by the term itself because the substrate-specific
      GEF terms were merged into GO:0005085, so it is recorded here as has_input extensions
      on ARF1 and ARF3 instead. Two independent grounds for the substrate call: the
      cited paper itself describes BIG1 as a GEF for Arf1, and UniProt FUNCTION states
      it for both class I ARFs. A separate curation observation, not a defect in this
      row: the experiment that actually measured the exchange reaction and the brefeldin
      A inhibition constant on the human protein is PMID:10393931, which carries no
      GO annotation anywhere in GOA.'
    supported_by:
    - reference_id: PMID:15644318
      supporting_text: we found BIG1, a guanine nucleotide exchange factor for ADP-ribosylation
        factor (Arf1), as a potential binding partner for myosin IXb
    - reference_id: file:human/ARFGEF1/ARFGEF1-uniprot.txt
