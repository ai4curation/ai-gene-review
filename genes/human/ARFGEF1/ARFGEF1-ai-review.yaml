id: Q9Y6D6
gene_symbol: ARFGEF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARFGEF1 encodes BIG1 (brefeldin A-inhibited guanine nucleotide-exchange
  protein 1), a 1849-residue peripheral membrane protein of the large, brefeldin
  A-sensitive Arf-GEF family. Its central SEC7 domain (residues 709-840) catalyses
  GDP-to-GTP exchange on the class I ADP-ribosylation factors ARF1 and ARF3,
  converting them to the membrane-bound active form that recruits vesicle coats,
  chiefly the AP-1 clathrin adaptor, at the trans-Golgi network. Brefeldin A acts
  as an uncompetitive inhibitor that traps an abortive BIG1-ARF complex, which is
  why the drug collapses Golgi morphology. BIG1 is recruited to the trans-Golgi by
  the Arf-like GTPase ARL1, which binds an N-terminal DCB domain that also
  mediates homodimerisation and packs against the adjacent HUS domain. Through
  this activity BIG1 supports traffic between the TGN and endosomes, including
  retrograde delivery of furin from late endosomes, and the surface delivery and
  correct Golgi glycosylation of cargo such as integrin beta-1. It is separately
  required, apparently independently of its exchange activity, to maintain normal
  Golgi ribbon morphology - depleting BIG1 breaks the Golgi into mini-stacks that
  remain polarised and competent for export. BIG1 also works as a scaffold,
  binding protein kinase A regulatory subunits in the manner of an A-kinase
  anchoring protein and holding together a myosin phosphatase complex containing
  non-muscle myosin IIA, PP1-delta and MYPT1, thereby restraining myosin
  regulatory light chain phosphorylation, F-actin accumulation and directed cell
  migration; it binds the tail of myosin IXb and blocks that protein's Rho-GAP
  activity by competing with RhoA. Its own catalysis is under cyclic-AMP control -
  PKA phosphorylation of Ser-883 lowers exchange activity and is reversed by
  PP1-gamma, and the same modification, with a 711-715 nuclear localisation
  signal, drives accumulation of BIG1 in the nucleus and nucleolus, where it
  associates with nucleolin, fibrillarin and U3 snoRNA in a nucleic-acid-dependent
  complex of undetermined function. Heterozygous loss of ARFGEF1 causes an
  autosomal dominant neurodevelopmental disorder with impaired intellectual
  development, language and motor delay, behavioural abnormalities and, in about
  half of affected individuals, seizures.
