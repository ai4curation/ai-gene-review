      is necessary for ANKS4B targeting to the BB.
  - statement: ANKS4B and USH1C bind distinct sites on the MYO7B tail.
    supporting_text: ANKS4B and USH1C also bind to the MYO7B cargo-binding tail at distinct sites.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; human CACO-2BBE knockdown/rescue plus mouse tissue.
