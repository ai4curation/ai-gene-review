    supporting_text: These data indicate that ANKS4B plays an essential role in IMAC assembly, most likely
      by functioning as a multivalent scaffold, which promotes targeting of IMAC components to the BB
      and stabilizes the resulting adhesion complexes.
  - reference_id: PMID:26812018
    supporting_text: However, a tripartite complex only forms if ANKS4B and MYO7B are first activated
