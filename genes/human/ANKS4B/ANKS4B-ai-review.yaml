suggested_questions:
- question: What did PMID:31644917 show that supported GO:0002141 stereocilia ankle link for ANKS4B, which
    is not known in hair cells? Was a tip-link density term intended?
- question: Is the beta-cell GRP78 and ER-stress role of Anks4b reproducible in human cells, and does
    ANKS4B associate with ER membranes at all?
suggested_experiments:
- description: Test whether ANKS4B mutants that cannot phase-separate with USH1C and MYO7B still rescue
    microvillar clustering in ANKS4B-knockdown CACO-2BBE cells.
