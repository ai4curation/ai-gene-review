  evidence_type: IDA
  original_reference_id: PMID:31644917
  qualifier: is_active_in
  review:
    summary: Stereocilia ankle link (IDA). The cited paper is abstract-only here. Its abstract places
      ANKS4B in the MYO7B/USH1C complex at intestinal microvillar tip links, not in hair-cell stereocilia,
      and it does not mention ankle links (basal links of developing stereocilia).
    action: UNDECIDED
    reason: '[PMID:31644917 "Here, we show that Myosin VIIB (MYO7B), USH1C, and ANKS4B, which form a specific
      complex stabilizing tip-links in intestine microvilli, could form dense condensates via liquid-liquid
      phase separation in vitro and in cells."] The abstract describes ANKS4B condensates at microvillar
      tip links; GO:0002141 is defined for basal links of developing stereocilia. The full text, which
      the curator read, is not available to us, so we cannot tell what supported this; flagged rather
      than removed.'
    supported_by:
    - reference_id: PMID:31644917
      supporting_text: Here, we show that Myosin VIIB (MYO7B), USH1C, and ANKS4B, which form a specific
        complex stabilizing tip-links in intestine microvilli, could form dense condensates via liquid-liquid
        phase separation in vitro and in cells.
