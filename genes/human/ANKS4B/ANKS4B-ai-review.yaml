id: Q8N8V4
gene_symbol: ANKS4B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKS4B (ankyrin repeat and SAM domain-containing protein 4B; also called Harp) is a cytoplasmic
  scaffold of intestinal and kidney brush-border epithelia, built from N-terminal ankyrin repeats, a central
  region and a C-terminal SAM domain ending in a class I PDZ-binding motif. It is the ankyrin-repeat scaffold
  of the intermicrovillar adhesion complex (IMAC), the protocadherin CDHR2/CDHR5 links that join the tips
  of neighbouring microvilli. ANKS4B binds the first PDZ domain of USH1C (harmonin) and the cargo-binding
  tail of the motor MYO7B, forming a tripartite complex that anchors the protocadherins to actin. In vitro
  and in cells this complex forms dense condensates by phase separation. A cryptic apical targeting sequence,
  with a coiled coil and a membrane-binding basic-hydrophobic repeat, directs ANKS4B to microvillar tips.
  Loss of ANKS4B in enterocyte cells abolishes microvillar clustering and brush-border assembly. In mouse
  pancreatic beta cells, Anks4b is an HNF4A target that binds the ER chaperone GRP78 and enhances ER stress-induced
  apoptosis.
