suggested_questions:
- question: How is KIF1A anchored to the nuclear envelope of radial glial progenitors during basal interkinetic
    nuclear migration (LINC/nesprin, PH-domain lipid binding, or another adaptor)?
  experts:
  - neural progenitor cell biologists
  - kinesin-3 cargo-adaptor researchers
- question: Should GO represent KIF1A's role in retrograde dense core vesicle transport, given that it
    is a plus-end motor?
  experts:
  - PAINT curators
  - neuronal trafficking experts
suggested_experiments:
- description: Test KIF1A PH-domain and cargo-binding mutants for rescue of basal nuclear migration after
    Kif1a knockdown in embryonic cortex.
  hypothesis: Nuclear attachment of KIF1A requires its C-terminal cargo-recognition region, not only motor
    activity.
  experiment_type: in utero electroporation rescue with live imaging
- description: Correlate single-molecule motility of KAND variants with synaptic vesicle precursor flux
    in human iPSC-derived neurons.
  hypothesis: Rigor/non-motile variants dominantly impair synaptic vesicle precursor transport more than
    reduced-binding variants.
  experiment_type: TIRF motility plus live-cell cargo imaging
