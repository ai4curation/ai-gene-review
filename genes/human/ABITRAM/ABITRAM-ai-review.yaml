- term:
    id: GO:0048813
    label: dendrite morphogenesis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2677850
  - PANTHER:PTN000342113
  review:
    summary: Dendrite morphogenesis (IBA); downstream neuronal developmental role in vertebrates.
    action: KEEP_AS_NON_CORE
    reason: Somatic Simiate expression promotes proximal dendritic branching and growth via actin dynamics,
      while nuclear Simiate triggers primary dendrite formation counterbalanced by nuclear FAK1 (PMID:24782708,
      PMID:35787638). Retained as non-core because dendrite morphogenesis is a cell-type-specific developmental
      outcome of ABITRAM's actin-regulatory and nuclear speckle functions.
    supported_by:
    - reference_id: PMID:24782708
      supporting_text: specifically increases the branching of proximal, but not distal dendrites of developing
        neurons
    - reference_id: PMID:35787638
      supporting_text: while Simiate expression in somata induces dendritic growth and branching (Fig.
        14.6), nuclear Simiate triggers primary dendrite development and enhances transcription as well
        as processing activity
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000342113
        source_label: PTN000342113
        source_status: SUPPORTS_TRANSFER
        comment: Supported in jawed vertebrates from rodent primary neuron arborization assays (PMID:24782708,
          PMID:35787638), secondary to core actin and nuclear functions.
