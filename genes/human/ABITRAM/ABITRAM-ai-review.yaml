- id: file:human/ABITRAM/ABITRAM-deep-research-affinage.md
  title: Affinage mechanistic annotation for ABITRAM (human)
  findings:
  - statement: Affinage passes automated citation trust gates with five real peer-reviewed PubMed citations
      (PMID:24349419, PMID:24782708, PMID:26013685, PMID:35787638, PMID:41617053) and no preprint identifiers
      in PMID fields.
    supporting_text: 'faith_pct: 100.0'
    finding_review:
      finding_status: CURRENT
  - statement: Affinage misparses the ambiguous abstract clause of PMID:24349419 ('whose mRNA contains
      several FMRP recognition motifs and associates with FMRP upon co-precipitation') as a protein-protein
      co-precipitation between ABITRAM protein and FMRP, whereas full-text RT-PCR in PMID:24349419 tested
      FMRP co-immunoprecipitation of Simiate mRNA.
    supporting_text: ABITRAM mRNA contains FMRP recognition motifs and the protein co-precipitates with
      FMRP
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:24349419
      review_notes: Full-text RT-PCR in PMID:24349419 assayed Simiate-mRNA co-immunoprecipitated with
        FMRP, not ABITRAM protein.
  - statement: Affinage's GO grounding uses coarse goslim_generic terms (GO:0008092 cytoskeletal protein
      binding; GO:0005654 nucleoplasm) that lose the experimentally demonstrated G-actin/F-actin binding
      and nuclear speck specificity and are not imported.
    supporting_text: '- **molecular_activity:** GO:0008092 cytoskeletal protein binding'
    finding_review:
      finding_status: CURRENT
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: 'Trust gates clear (five real PMIDs from the Dahlhaus group, including PMID:35787638
      and PMID:41617053 which are absent from GOA). Marked LOW_QUALITY for curatorial use on two grounds:
      (1) it conflates mouse brain/retinal, recombinant mouse protein, and rat hippocampal neuron experiments
      with human ABITRAM without noting that direct human experiments were limited to HEK-293 cells; and
      (2) it misstates PMID:24349419''s FMRP-Simiate mRNA RT-PCR immunoprecipitation as an ABITRAM-FMRP
      protein co-precipitation.'
