proposed_new_terms:
- proposed_name: nuclear speckle structural scaffold activity
  proposed_definition: Providing structural integrity or architectural organization to nuclear speckles
    (interchromatin granule clusters) through macromolecular interactions within the speckle core or periphery.
  justification: Endogenous mammalian ABITRAM/Simiate concentrates specifically in the core domain of
    SC35-positive nuclear speckles (PMID:41617053) and intracellular antibody blockade of endogenous ABITRAM
    in human HEK-293 cells causes acute rounding/compaction of nuclear speckles followed by apoptosis
    (PMID:24349419, PMID:27167171), whereas GO currently lacks a molecular function term for nuclear speckle
    structural scaffold/maintenance activity and nuclear actin binding within speckles has not been demonstrated.
  proposed_parent:
    id: GO:0005198
    label: structural molecule activity
  supported_by:
  - reference_id: PMID:24349419
    supporting_text: An antibody-based block of endogenous Simiate revealed that the protein is essential
      for cell survival.
  - reference_id: PMID:27167171
    supporting_text: loss of functional Simiate radiused nuclear speckles
  - reference_id: PMID:41617053
    supporting_text: While FAK1 is predominantly localised in peripheral areas, Simiate is highly enriched
      in the core domain.
suggested_questions:
- question: Which surface residues on ABITRAM's GCV_H-like barrel-sandwich fold mediate G-actin versus
    F-actin binding, and does FAK80 binding compete with nuclear actin binding?
- question: How does ABITRAM maintain the three-dimensional architecture of the nuclear speckle core domain—preventing
    the speckle rounding and compaction observed upon anti-Simiate antibody blockade—through interactions
    with SON/SRRM2, spliceosomal snRNPs, or nuclear FAK80?
- question: Are the reproducible binary/AP-MS interactions of human ABITRAM with PUS10 and HMBOX1 physiologically
    relevant in nuclear speckles?
suggested_experiments:
- description: Determine cryo-EM or crystal structures (and AlphaFold-guided point mutants) of human ABITRAM
    bound to G-actin/F-actin and the FERM-kinase fragment FAK80 to map binding interfaces and test separation-of-function
    alleles.
- description: Perform acute auxin-inducible degron depletion of endogenous ABITRAM coupled with nascent
    Bru-seq/TT-seq and spliceosome iCLIP in human cells to separate direct pre-mRNA splicing or transcription
    roles from secondary apoptosis.
