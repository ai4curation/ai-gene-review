- term:
    id: GO:0043490
    label: malate-aspartate shuttle
  evidence_type: IMP
  original_reference_id: PMID:37647199
  qualifier: involved_in
  review:
    summary: GOT supplies one catalytic transamination step of the malate-aspartate shuttle.
    action: ACCEPT
    reason: The original PMID:37647199 perturbs a panel of MAS components in human HEK293 cells. Its
      abstract does not enumerate every genotype, but the established compartment-specific chemistry and
      curated pathway support the assertion. The shuttle transfers reducing equivalents through several
      enzymes and carriers; GOT itself is not an NADH transporter or dehydrogenase. Impaired serine
      synthesis is a redox consequence, not direct serine synthesis by GOT.
    supported_by:
    - reference_id: PMID:37647199
      supporting_text: "We genetically disrupted each MAS component to generate a panel of \nMAS-deficient
        HEK293 cell lines"
    - reference_id: file:human/GOT2/GOT2-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=L-aspartate + 2-oxoglutarate = oxaloacetate + L-glutamate;
