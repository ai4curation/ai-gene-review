id: P00505
gene_symbol: GOT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  GOT2 is the mitochondrial matrix aspartate aminotransferase, a homodimeric pyridoxal 5'-phosphate-dependent
  enzyme. It reversibly interconverts L-aspartate and 2-oxoglutarate with oxaloacetate and L-glutamate, providing
  the mitochondrial transamination step of the malate-aspartate shuttle and linking amino-acid and carbon metabolism.
  The shuttle transfers reducing equivalents through coupled metabolic and transport reactions; GOT2 itself
  neither transports NADH nor catalyzes its oxidation. Biallelic loss of function causes a developmental and
  epileptic encephalopathy with disrupted cellular redox metabolism. Additional activities include kynurenine
  transamination and participation in hydroxyproline degradation. A plasma-membrane-associated pool, also called
  FABPpm, is linked to long-chain fatty-acid uptake in particular cellular contexts.
