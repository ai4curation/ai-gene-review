core_functions:
- description: >-
    Mitochondrial matrix PLP-dependent aspartate aminotransferase reversibly interconverts L-aspartate plus
    2-oxoglutarate with oxaloacetate plus L-glutamate. This directly supports amino-acid interconversion and
    the compartment-specific transamination step of the malate-aspartate shuttle; GOT itself is neither an
    NADH transporter nor a dehydrogenase. Secondary substrate and contextual regulatory roles are distinguished
    in the annotation reviews.
  molecular_function:
    id: GO:0004069
    label: L-aspartate:2-oxoglutarate transaminase activity
  directly_involved_in:
  - id: GO:0006531
    label: aspartate metabolic process
  - id: GO:0006536
    label: glutamate metabolic process
  - id: GO:0043490
    label: malate-aspartate shuttle
  locations:
