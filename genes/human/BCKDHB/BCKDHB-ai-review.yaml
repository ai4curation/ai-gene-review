suggested_questions:
- question: Does the P21953-2 product, whose sequence changes after residue 211 and lacks canonical residues
    219–392, undergo mitochondrial import or assemble into a functional E1 enzyme?
- question: How do substitutions at the beta-chain potassium-coordinating residues affect local ion coordination,
    folding and the two E1 reaction steps separately?
suggested_experiments:
- description: Compare sequence-verified canonical and P21953-2 products for mitochondrial import, alpha2-beta2
    assembly, ThDP occupancy, ketoacid decarboxylation and DBT-lipoyl-domain reductive acylation. Test
    selected potassium-coordinating residue substitutions with folding controls.
  hypothesis: The large alternative-product truncation and changes near the potassium site may affect
    assembly and catalytic steps differently; equivalent activity is not established by the sources inspected.
