id: P21953
gene_symbol: BCKDHB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BCKDHB encodes the beta subunit of the mitochondrial branched-chain alpha-ketoacid dehydrogenase
  complex. Two BCKDHB and two BCKDHA chains form its E1 enzyme (EC 1.2.4.4), whose shared active sites
  decarboxylate the ketoacids derived from leucine, isoleucine and valine and reductively acylate the
  lipoyl group of DBT. The beta chain contributes cofactor-binding and catalytic residues at the alpha-beta
  interface, as well as contacts for a structural potassium ion. E1 tetramers and DLD dimers associate
  with a 24-subunit cubic DBT core. DBT transfers the acyl group to CoA, and DLD reoxidizes the reduced
  lipoyl group. This coupled oxidation is the committed step of branched-chain amino acid catabolism in
  the mitochondrial matrix, downstream of transamination. Reversible phosphorylation of the alpha subunit
  regulates the assembled enzyme. Biallelic damaging BCKDHB variants cause maple syrup urine disease type
  1B; loss of the beta subunit can also destabilize the alpha subunit.
