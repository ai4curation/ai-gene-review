  description: Contributes ThDP contacts and catalytic residues to the shared active sites of the alpha2-beta2
    E1 enzyme. Together with BCKDHA, it supports branched-chain ketoacid decarboxylation and reductive
    acylation of the DBT lipoyl domain. A structural potassium site helps organize the beta chain. The
    subsequent CoA transfer and lipoyl reoxidation are performed by DBT and DLD, respectively. The enzyme
    is regulated through phosphorylation of its alpha subunit rather than a separate kinase or phosphatase
    activity of BCKDHB.
