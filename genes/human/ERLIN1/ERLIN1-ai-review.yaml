- id: file:human/ERLIN1/ERLIN1-uniprot.txt
  title: UniProt entry O75477 (ERLN1_HUMAN), Erlin-1 / SPFH1
  findings:
  - statement: ERLIN1 is a single-pass type II ER membrane SPFH/prohibitin protein that forms the ERLIN1/ERLIN2
      complex mediating ERAD of IP3 receptors, binds cholesterol, restricts SREBP activation, and interacts
      with the ER ubiquitin ligases AMFR/gp78, SYVN1 and (with ERLIN2) RNF170; variants cause SPG62.
    reference_section_type: OTHER
- id: PMID:19751772
  title: SPFH1 and SPFH2 mediate the ubiquitination and degradation of inositol 1,4,5-trisphosphate receptors
    in muscarinic receptor-expressing HeLa cells.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: '[PMID:19751772](https://doi.org/10.1016/j.bbamcr.2009.09.004): genuine fetched full
      text, actual cell/RNAi/construct Methods and stimulated-IP3-receptor Results were read. Human muscarinic-receptor-expressing
      HeLa cells with endogenous ERLIN1 depletion show impaired receptor ubiquitination and degradation;
      the calcium response and the tested IκBα degradation control remain intact. ERLIN2 depletion also
      partly reduces ERLIN1, and the rescue construct is mouse SPFH2. Selected other model ERAD substrates
      differ in response, so no universal ERAD requirement is inferred. The human ERLIN1 perturbation
      is independent of the rodent source experiments in PMID:19240031. No figure pixels or separate supplements
      were inspected.'
  full_text_unavailable: false
- id: PMID:21610068
  title: RNF170 protein, an endoplasmic reticulum membrane ubiquitin ligase, mediates inositol 1,4,5-trisphosphate
    receptor ubiquitination and degradation.
  findings:
  - statement: The erlin complex associates with RNF170 before activated IP3-receptor turnover. Reciprocal
      depletion in human mHeLa cells places erlin-complex recruitment upstream of RNF170 recruitment;
      the complex is monitored through ERLIN2 rather than an isolated ERLIN1 recruitment perturbation.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: '[PMID:21610068](https://doi.org/10.1074/jbc.M111.251983): the genuine pre-existing
      normal record remains abstract-only. Actual indexed original Experimental Procedures, Results including
      Priority of Binding to Activated IP3 Receptors, Figures 4–5 captions and Discussion were recovered
      and read separately. Native alphaT3-1 and Rat-1 experiments are rodent, while endogenous SH-SY5Y
      association and mHeLa reciprocal depletion provide human cellular evidence. The 257-aa RNF170 WT
      and ligase-mutant constructs are mouse even when transfected into HeLa; the recombinant ubiquitin-transfer
      activity belongs to RNF170. ERLIN2 depletion inhibits RNF170 recruitment, whereas RNF170 depletion
      does not inhibit erlin-complex recruitment. This supports complex-level ordering, not an isolated
      human ERLIN1 binary-binding or recruitment assay. No figure pixels or separate supplements were
      inspected.'
  full_text_unavailable: false
core_functions:
- description: 'Forms part of the oligomeric ERLIN1/ERLIN2 structural platform at the ER membrane and
    contributes to its scaffold activity. Human complex-dependent TMUB1-L/RNF170 association supports
    this contribution without resolving individual ERLIN1 contact surfaces or independent bridging by
    ERLIN1. The complex supports selective protein turnover: activated IP3 receptor handling is a regulatory
    substrate context, while separate misfolded A1AT-NHK and TTR-D18G reporter experiments support a modest
    quality-control contribution. ERLIN1 does not provide ubiquitin-transfer chemistry.'
