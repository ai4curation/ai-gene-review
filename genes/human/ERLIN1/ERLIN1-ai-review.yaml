  review:
    summary: The fresh ERAD IBA is a genuine inherited functional context.
    action: ACCEPT
    reason: The actual IBD at PTN000794169 asserts GO:0036503 from experimentally annotated human ERLIN1
      and ERLIN2 descendants. O75477 lies inside that clade, its target MSA is exact, and no target-path
      NOT is present. The annotation is not invalidated by self-WITH or by its absence from the older
      local review. PMID:19240031 Results show SPFH1/2 association with activated IP3 receptors before
      substantial polyubiquitination, loss of receptor polyubiquitination/degradation after Rat-1 SPFH1
      depletion and rescue by reintroduction, with preserved calcium mobilization. This supports a substrate-recognition/processing
      assembly role in ERAD rather than merely a downstream disease phenotype. The recovered Plasmids
      and retroviral-expression Methods identify mouse SPFH1 and SPFH2 cDNAs; the Rat-1 depletion/rescue
      and alphaT3-1 native-complex experiments are rodent evidence for the conserved assembly role, not
      direct human ERAD perturbations. HeLa tagged-coassembly experiments also use mouse constructs. SPFH2-specific
      effects are not reassigned to ERLIN1. Complete Methods, figure pixels and supplements were not inspected.
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:19240031
    additional_reference_ids:
    - PMID:19240031
