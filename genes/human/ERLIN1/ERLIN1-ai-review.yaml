suggested_questions:
- question: 'How does ERLIN1 cholesterol binding couple to SREBP regulation: through Insig stability,
    sterol accessibility to SOAT1, or separable contributions of both mechanisms?'
- question: Which ERLIN1 structural contributions determine cargo selection versus RNF170 recruitment,
    and can TMUB1-L and RNF170 occupy one functional erlin assembly simultaneously?
- question: For SPG62 variants, how much of the neuronal phenotype reflects abnormal RNA splicing or protein
    abundance versus a specific defect in erlin assembly, sterol handling or cargo turnover?
suggested_experiments:
- description: Compare expression-matched ERLIN1 sterol-binding variants with wild-type rescue while measuring
    protein stability, ERLIN2 association, accessible ER cholesterol, cholesteryl-esters, Insig abundance
    and SREBP processing. Include SOAT1 inhibition and a direct isotopic sterol-synthesis readout to distinguish
    accessibility and regulatory effects from altered biosynthetic flux.
- description: Reconstitute composition-defined ERLIN1/ERLIN2 assemblies with TMUB1-L, RNF170 and a controlled
    activated-IP3-receptor substrate. Measure partner occupancy, cargo association, RNF170 recruitment
    and substrate ubiquitination separately, with matched assembly/stability controls, to distinguish
    a structural ERLIN1 contribution from ligase chemistry and to test simultaneous versus separate complexes.
- description: Introduce selected splice and missense SPG62 variants into isogenic human neuronal cells.
    Quantify transcript isoforms, endogenous ERLIN1 abundance and assembly before measuring IP3-receptor
    turnover and sterol responses; compare genomic variants with expression-matched cDNA rescue to separate
    RNA defects from protein-level mechanisms.
