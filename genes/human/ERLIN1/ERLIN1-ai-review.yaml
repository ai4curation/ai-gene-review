      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000794169
        source_status: SUPPORTS_TRANSFER
        comment: Verified ERAD IBD and target inheritance, with independently read substrate-processing
          evidence. This target conclusion does not validate every possible family-wide ERAD substrate.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual human O75477 InterPro match IPR033294 (residues 2–317) and its current ER/ubiquitin-ligase-binding
      mappings were inspected. Transfer is supported for this target by independent original assays; the
      broad family includes taxa whose exact substrate repertoire is not established here.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Actual PTHR15351 tree/MSA/IBD were read: O75477 target leaf has an exact 348-aa MSA
      and descends from all three imported ancestral nodes, carrying four matching IBD assertions with
      no target-path NOT. Self-donor grounding is legitimate. This is a target placement assessment, not
      a new family-wide experimental review.'
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual HPA ERLIN1 structured ICC/IF record reports supported ER localization with HPA011252
      in four human cell contexts. Antigen sequence maps exactly to O75477 residues 254–344; absence of
      the full exact antigen in ERLIN2 is not a cross-reactivity experiment. No HPA figure pixels were
      inspected; membrane refinement uses independent target topology/model evidence.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: All five source ARBA rule objects were inspected and actual O75477 FunFam/taxon disjuncts
      matched. Rule matching is provenance, not independent biological verification; the source-specific
      decisions cite original SREBP/ligase/ERAD evidence and actual human complex membership.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The actual ARBA00028685 rule matches the O75477 erlin FunFam/Eukaryota branch and the
      official subcellular mapping is ER membrane. Independent primary and human participant evidence
      corroborate the location.
- id: PMID:16835267
  title: Erlin-1 and erlin-2 are novel members of the prohibitin family of proteins that define lipid-raft-like
    domains of the ER.
  findings:
  - statement: Erlin-1 and erlin-2 are prohibitin-family ER membrane proteins that define lipid-raft-like
      domains of the ER.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: '[PMID:16835267](https://doi.org/10.1242/jcs.03060): the original publisher PDF''s Results
      on ER colocalization/internal detergent-resistant membranes and Methods for constructs, fractionation
      and cholesterol depletion were read. Human ERLIN1 was cloned from U937 cells and expressed in HeLa;
      experiments with human proteins in mouse 3T3 cells are separate. Cholesterol depletion after hypotonic
      disruption affects internal membrane detergent resistance differently from whole-cell treatment.
      Engineered N-terminal fragments are targeting probes, not natural products. No figure pixels or
      separate supplements were inspected.'
  full_text_unavailable: false
- id: PMID:18468998
  title: Blood pressure is regulated by an alpha1D-adrenergic receptor/dystrophin signalosome.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: '[PMID:18468998](https://doi.org/10.1074/jbc.M801860200): original Table 3 lists ERLIN1
      in the HEK293 ADRA1D tandem-affinity preparation (four peptides, 16% coverage). IntAct EBI-21277437
      independently identifies that pair. The association is retained as an ancillary assembly observation.
      Receptor physiology and dystrophin/syntrophin mechanisms do not establish an ERLIN1-specific signaling
      role. Operative TAP Methods, raw spectra and figure pixels were not independently read.'
  full_text_unavailable: true
- id: PMID:19240031
  title: An endoplasmic reticulum (ER) membrane complex composed of SPFH1 and SPFH2 mediates the ER-associated
    degradation of inositol 1,4,5-trisphosphate receptors.
  findings:
  - statement: SPFH1 (ERLIN1) and SPFH2 (ERLIN2) form a ring-shaped ~2 MDa heteromeric ER membrane complex
      that binds IP3R tetramers and mediates their ER-associated degradation; depletion blocks IP3R degradation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: '[PMID:19240031](https://doi.org/10.1074/jbc.M809801200): the actual Molecular Properties
      and IP3-receptor ERAD Results, recovered Plasmids/shRNA/TEM Methods and selected captions were read.
      Mouse SPFH1 BC011220 and mouse SPFH2 constructs remain mouse proteins in HeLa hosts. Native Rat-1/alphaT3-1
      experiments are distinguished from endogenous HeLa glycosylation. The selected Figure 2C caption
      does not establish its cell context. The original large-complex size is an estimate; it is not a
      modern structural subunit count. No complete-Methods, figure-pixel or supplemental-data read is
      claimed.'
  full_text_unavailable: false
- id: PMID:21343306
  title: Membrane-associated ubiquitin ligase complex containing gp78 mediates sterol-accelerated degradation
    of 3-hydroxy-3-methylglutaryl-coenzyme A reductase.
  findings:
  - statement: SPFH2 (ERLIN2) and TMUB1 associate with the ER ubiquitin ligase gp78/AMFR in sterol-accelerated
      ERAD of HMG-CoA reductase; ERLIN1 interacts with AMFR and SYVN1.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: '[PMID:21343306](https://doi.org/10.1074/jbc.M110.211326): original XML Results, Figure
      2 discussion and construct/immunoprecipitation Methods show human SPFH1 association with human SYVN1/HRD1
      and AMFR/gp78 in CHO-7 cells. The SPFH1 result differs from SPFH2 for TRC8 and sterol-triggered
      HMGCR turnover. Co-immunoprecipitation supports association with an E3 ligase but does not establish
      purified binary contacts, ubiquitin-transfer catalysis or a universal ERAD substrate relationship.
      No figure pixels or independent supplementary data were inspected.'
  full_text_unavailable: false
- id: PMID:22119785
  title: Defining human ERAD networks through an integrative mapping strategy.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: '[PMID:22119785](https://doi.org/10.1038/ncb2383): original Results and experimental-design
      passages describe tagged-bait affinity purification, mass spectrometry and interaction scoring in
      human HEK293 cells. Actual [IntAct](https://www.ebi.ac.uk/intact/) records EBI-25769871/EBI-25770016
      identify the ERLIN1–ERLIN2 pair; EBI-25770037 identifies ERLIN1–SYVN1 and EBI-25770556 ERLIN1–AMFR.
      Detergent dependence and the global validation rate do not establish the precise condition or confidence
      score for every pair. The separate Online Methods/supplementary files were not independently read.
      Independent PMID:21343306 supports the two specific E3-association refinements.'
  full_text_unavailable: false
- id: PMID:24217618
  title: Erlins restrict SREBP activation in the ER and regulate cellular cholesterol homeostasis.
  findings:
  - statement: Erlins are cholesterol-binding proteins that restrict SREBP activation by stabilizing the
      SREBP-Scap-Insig complex and promoting its ER retention; erlin depletion activates SREBP target
      genes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: '[PMID:24217618](https://doi.org/10.1083/jcb.201305076): original Results and binding,
      cell-culture, lipid and biochemical Methods were read. Recombinant human ERLIN1 produced in S2 cells
      and immobilized through its tag directly binds radiolabeled cholesterol, with competition, saturation
      and cooperativity. Native mouse-liver complex binding is a separate experiment. Human HeLa ERLIN1
      depletion raises SREBP-responsive cholesterol/fatty-acid synthesis transcripts and lipid abundance;
      processing, localization, SCAP inhibition and Insig turnover connect the phenotype to regulation.
      FLAG-SREBP processing and Insig turnover use HEK293 cells; HeLa nuclear staining and the fatostatin
      experiment are distinct assays. A scaffolding mechanism is one proposed model, not an established
      unique mechanism. These are not direct synthesis-flux measurements. ERLIN2-specific FRAP observations
      and mixed-species SCAP/Insig preparations are not treated as pure human ERLIN1 experiments. No figure
      pixels or separate supplementary data were inspected.'
  full_text_unavailable: false
