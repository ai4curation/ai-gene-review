- id: PMID:37683630
  title: Usp25-Erlin1/2 activity limits cholesterol flux to restrict virus infection.
  findings:
  - statement: In human A549 cells, USP25-dependent stabilization of ERLIN1/ERLIN2 and erlin perturbations
      influence SREBP processing, HMGCR abundance, total cholesterol and influenza-virus output. The labeled-cholesterol
      efflux experiment specifically depletes ERLIN2, and the T65I mutant is ERLIN2; these are not ERLIN1-specific
      efflux or mutant assays.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: '[PMID:37683630](https://doi.org/10.1016/j.devcel.2023.08.013): the unchanged normal
      cache is abstract-only, but the actual full original was recovered separately at [PMC10914638](https://pmc.ncbi.nlm.nih.gov/articles/PMC10914638/).
      Results/Figures 6–7 captions, Discussion/Limitations and operative cell, infection, knockdown/knockout,
      interaction, pulse-chase and lipid Methods were read. ERLIN1/ERLIN2 perturbation and USP25 catalytic
      controls support a contextual stability/SREBP mechanism. Figure 7J measures labeled-cholesterol
      efflux after shERLIN2, and Figure 7D uses ERLIN2 T65I. HMGCR protein abundance and total cholesterol
      are not an isotopic measurement of de-novo cholesterol biosynthesis. No ERLIN1 deubiquitinase activity,
      general antiviral role across viruses, figure-pixel or supplementary-data inspection is inferred.'
  full_text_unavailable: false
- id: PMID:38782601
  title: ERLIN1/2 scaffolds bridge TMUB1 and RNF170 and restrict cholesterol esterification to regulate
    the secretory pathway.
  findings:
  - statement: Human HeLa endogenous interactions and ERLIN1/ERLIN2 double-knockout/rescue establish erlin-complex-dependent
      TMUB1-L/RNF170 association. Loss of the erlins increases cholesterol esterification and perturbs
      Golgi morphology; SOAT1 inhibition rescues selected endpoints. Adjacent-subunit contacts and sterol-accessibility
      mechanisms are models, and the tested disease-analogous interface mutants are ERLIN2 constructs.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: '[PMID:38782601](https://doi.org/10.26508/lsa.202402620): the genuine normal record
      contains substantive original manuscript text. Actual Results/Figures 1–3 and 6–8 captions, Discussion
      and operative cell, knockout/rescue, interaction, lipid and AlphaFold Methods were read. Endogenous
      human HeLa co-immunoprecipitation and double-knockout/rescue support complex-dependent association;
      the Discussion leaves separate RNF170-containing and TMUB1-containing complexes possible. The interface
      structures are AlphaFold models, and R36K, G48V, H50Y and their tested combinations are ERLIN2-FLAG,
      not a direct ERLIN1 G50V assay. The rescue Methods give coding-region primers without independently
      resolving the original cDNA-template provenance. Cholesteryl-ester, gene-expression, morphology
      and inhibitor-rescue endpoints support sterol regulation, not directly measured ERLIN1 cholesterol
      transport. No fixed subunit count, atomic experimental interface, figure-pixel inspection or separate
      supplement read is claimed.'
  full_text_unavailable: false
- id: PMID:39367212
  title: 'Biallelic variants in ERLIN1: a series of 13 individuals with spastic paraparesis.'
  findings:
  - statement: The study describes 13 individuals from six families with biallelic ERLIN1 variants and
      spastic paraparesis. Patient RNA-seq/RT-PCR demonstrates abnormal splicing for two investigated
      variants. Proposed effects on ERLIN1/ERLIN2 assembly derive from AlphaFold modeling and a bacterial
      structural analogy rather than direct assembly measurements.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: '[PMID:39367212](https://doi.org/10.1007/s00439-024-02702-0): the genuine normal record
      contains the substantive author manuscript. Participants, DNA/RNA analysis and protein-modeling
      Methods, variant/splicing Results, Discussion and Figures 1–2 captions were read. RNA evidence establishes
      the investigated exon-skipping outcomes; a third splice variant is predicted rather than tested
      by the same RNA analysis. Human O75477/O94905 AlphaFold models and a bacterial SPFH/FtsH analogy
      motivate predicted assembly effects. This paper does not experimentally measure ERLIN complex stoichiometry,
      a human cryo-EM architecture or assembly defects of the patient proteins. No figure pixels or separate
      supplement were inspected.'
  full_text_unavailable: false
- id: PMID:31810281
  title: The Host Factor Erlin-1 is Required for Efficient Hepatitis C Virus Infection.
  findings:
  - statement: ERLIN1 depletion in human Huh-7 cells reduces establishment of HCV RNA replication and
      efficient infectious-particle production, while tested entry, initial translation and maintenance
      of established replication are less affected. The molecular step linking ERLIN1 to these viral phenotypes
      remains unresolved.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: '[PMID:31810281](https://doi.org/10.3390/cells8121555): actual full original Methods,
      Results and Discussion in the genuine normal cache were read, including the entry, translation,
      replicon, persistently infected-cell and particle-production experiments. Human Huh-7 siRNA results
      distinguish establishment from maintenance of HCV replication and support a later particle-production
      effect. Different depletion efficiencies limit an absolute ERLIN1-versus-ERLIN2 specificity claim.
      The paper does not establish a universal proviral function or a defined enzymatic viral-replication
      step performed by ERLIN1. No figure pixels or separate supplementary files were inspected.'
  full_text_unavailable: false
