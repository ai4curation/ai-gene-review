id: O75477
gene_symbol: ERLIN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ERLIN1 (SPFH1) is a 348-amino-acid, single-pass endoplasmic reticulum membrane protein with
  a lumenal SPFH domain. It forms an oligomeric complex with ERLIN2 that organizes membrane-associated
  protein interactions and contributes to selective ER protein turnover. The complex participates in recruitment
  of the ubiquitin ligase RNF170 to activated inositol 1,4,5-trisphosphate receptors and supports degradation
  of selected misfolded ER substrates; ERLIN1 itself is not the ubiquitin-transfer enzyme. ERLIN1 also
  binds cholesterol. Erlin-dependent sterol handling restrains SREBP activation and lipid biosynthetic
  gene expression, while ERLIN1/ERLIN2 loss increases cholesterol esterification. How cholesterol binding
  couples to these responses remains unresolved: effects on Insig-dependent regulation and on sterol accessibility
  to SOAT1 are distinct mechanistic possibilities. Biallelic ERLIN1 variants cause hereditary spastic
  paraplegia type 62; some variants alter RNA splicing, whereas their effects on protein assembly require
  separate experimental assessment.'
