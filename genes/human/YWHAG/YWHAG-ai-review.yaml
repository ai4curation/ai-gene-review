    label: positive regulation of T cell mediated immune response to tumor cell
  evidence_type: IDA
  original_reference_id: PMID:38377992
  qualifier: involved_in
  review:
    summary: The abstract of the UFL1/PD-1 paper does not expose the YWHAG-specific step.
    action: UNDECIDED
    reason: PMID:38377992 is abstract-only in the cache and the abstract establishes the UFL1-PD-1
      T-cell pathway but not the 14-3-3 gamma row, so this row remains undecided pending full-text
      inspection.
    supported_by:
    - reference_id: PMID:38377992
      supporting_text: UFL1 ablation in T cells suppresses PD-1 UFMylation
- term:
