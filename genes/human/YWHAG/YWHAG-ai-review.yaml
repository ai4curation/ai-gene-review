id: P61981
gene_symbol: YWHAG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'YWHAG encodes 14-3-3 protein gamma, a conserved soluble 14-3-3 adaptor that binds phosphorylated
  serine/threonine motifs in many client proteins. It dimerizes through the canonical 14-3-3 fold and
  regulates client localization or activity in the cytosol, including WDR24/GATOR2 inhibition during glucose
  starvation, phosphorylated ABL1 and MDM4 control, desmosomal plakophilin regulation in keratinocytes,
  and mitochondrial protein-quality-control branches.'
