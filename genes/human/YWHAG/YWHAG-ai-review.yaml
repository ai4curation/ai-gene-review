    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: RNA binding is not an established 14-3-3 molecular function for YWHAG.
    action: MARK_AS_OVER_ANNOTATED
