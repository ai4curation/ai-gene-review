- term:
    id: GO:0005080
    label: protein kinase C binding
  evidence_type: IPI
  original_reference_id: PMID:10433554
  qualifier: enables
  supporting_entities:
  - UniProtKB:P04049
  review:
    summary: Keep protein kinase C binding from PMID:10433554.
    action: KEEP_AS_NON_CORE
    reason: PMID:10433554 reports direct 14-3-3 gamma association with several PKC isoforms, supporting
      protein kinase C binding as a non-core client-class interaction branch. The row's RAF1 WITH/FROM
      entity does not name one of those PKC isoforms and is recorded as a source_defects query, but
      the GO:0005080 claim itself is supported.
    supported_by:
    - reference_id: PMID:10433554
      supporting_text: We also demonstrated interaction between 14-3-3gamma and several PKC isoforms
        (alpha, beta, gamma, theta, and delta)
    source_defects:
    - defect_type: WRONG_WITH_FROM
      resource: UNIPROT
      slot: With/From
      requested_change: CHECK
      asserted_value: UniProtKB:P04049
      confidence: PROBABLE
      explanation: The human YWHAG GOA row for GO:0005080 protein kinase C binding from PMID:10433554
        carries UniProtKB:P04049 (RAF1) as its WITH/FROM value. The PMID:10433554 abstract reports that
        14-3-3gamma interacts with several PKC isoforms and separately says it interacts with Raf-1,
        so the PKC-binding assertion is supported but the RAF1 WITH/FROM value should be checked.
      supported_by:
      - reference_id: PMID:10433554
        supporting_text: We also demonstrated interaction between 14-3-3gamma and several PKC isoforms
          (alpha, beta, gamma, theta, and delta)
