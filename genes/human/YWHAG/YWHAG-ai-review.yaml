core_functions:
- molecular_function:
    id: GO:0050815
    label: phosphoserine residue binding
  description: Recognizes phosphorylated serine/threonine motifs in client proteins; this
    phosphomotif specificity is the biochemical basis of 14-3-3 client binding.
  directly_involved_in:
  - id: GO:0007165
    label: signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:human/YWHAG/YWHAG-uniprot.txt
    supporting_text: Binds to a large number of partners, usually by recognition of a phosphoserine
      or phosphothreonine motif
- molecular_function:
    id: GO:0042802
    label: identical protein binding
  description: Forms 14-3-3 homodimers whose paired grooves can engage one or two phosphorylated
    client motifs and support client sequestration or scaffolding.
  directly_involved_in:
  - id: GO:0007165
    label: signal transduction
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:human/YWHAG/YWHAG-uniprot.txt
    supporting_text: Homodimer
- molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  description: Retains phosphorylated clients in the cytosol or otherwise masks access to their
    normal partners or compartments.
  directly_involved_in:
  - id: GO:0008104
    label: intracellular protein localization
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:human/YWHAG/YWHAG-uniprot.txt
    supporting_text: Reduces keratinocyte intercellular adhesion, via interacting with PKP1
      and sequestering it in the cytoplasm
proposed_new_terms: []
suggested_questions:
- question: Which WDR24/GATOR2 and desmosomal effects require 14-3-3 gamma homodimers rather than
    mixed 14-3-3 dimers?
suggested_experiments:
- description: Use endogenous tagging plus phosphosite mutants of representative YWHAG clients to
    separate paralog-specific 14-3-3 regulation from redundant binding by other human 14-3-3 dimers.
