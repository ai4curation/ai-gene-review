suggested_questions:
- question: Should the direct, structurally characterized activation of TRPC5 by GTP-bound GNAI3 be captured as an ion channel
    regulator molecular function on GNAI3 (as a G protein effector relationship), and if so which GO term best expresses an
    activated Galpha acting on a channel?
- question: Which Gai isoform-specific functions, if any, distinguish GNAI3 from GNAI1 and GNAI2 in vivo, given the high sequence
    identity and frequent compensatory up-regulation of Gai1 after Gai3 loss?
- question: 'How does a Gi-class alpha subunit variant (p.Gly40Arg) disrupt the endothelin-1/EDNRA-DLX5/6 pathway in auriculocondylar
    syndrome: dominant-negative sequestration of Gbeta-gamma or receptors, or a gain-of-function Gi signal?'
- question: Do non-receptor GBA-motif GEFs (GIV, DAPLE, PLCD4) activate GNAI3 at the plasma membrane only, or also on intracellular
    membranes such as the Golgi and endosomes?
suggested_experiments:
- description: Knock-in of the ARCND1 GNAI3 p.Gly40Arg variant in cranial neural crest-derived cells or mouse, with BRET biosensors
    of Gi activation, Gbeta-gamma release and EDNRA-Gq signaling, plus DLX5/DLX6 expression readouts.
  hypothesis: GNAI3 G40R acts as a dominant-interfering Galpha that blunts endothelin-1-driven DLX5/6 induction in the mandibular
    arch.
- description: Isoform-selective CRISPR knockouts of GNAI1, GNAI2 and GNAI3 in the same cell line, followed by receptor-panel
    cAMP inhibition assays and live imaging of mitosis/cytokinesis.
  hypothesis: GNAI3 contributes non-redundantly to specific receptor-AC coupling and to mitotic timing, independent of Gai1/Gai2
    compensation.
- description: Electrophysiology of TRPC5 in cells expressing GNAI3 versus GNAI3 mutants unable to bind the TRPC5 ankyrin
    repeat edge, with Gi-coupled receptor stimulation.
  hypothesis: Receptor-activated GNAI3 directly sensitizes TRPC5 to PIP2 in cells, independently of Gbeta-gamma.
