core_functions:
- description: 'Heterotrimeric G protein alpha subunit that acts as a GTP/GDP-cycling molecular switch: GDP-bound GNAI3 binds
    Gbeta-gamma at the cytoplasmic face of the plasma membrane; receptor- or GBA-motif-catalysed nucleotide exchange yields
    GTP-GNAI3 which engages effectors until intrinsic, RGS-accelerated GTP hydrolysis returns it to the inactive state.'
  molecular_function:
