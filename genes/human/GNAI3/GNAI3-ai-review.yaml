id: P08754
gene_symbol: GNAI3
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNAI3 encodes Gi alpha-3, the alpha subunit of the pertussis toxin-sensitive Gi3 heterotrimeric G protein. It
  is a 354-residue, N-terminally lipid-anchored GTPase of the G(i/o/t/z) subfamily that sits on the cytoplasmic face of the
  plasma membrane in complex with a Gbeta-gamma dimer. Agonist-bound Gi/o-coupled receptors catalyse GDP-to-GTP exchange on
  GNAI3; GTP-bound GNAI3 dissociates from Gbeta-gamma and inhibits adenylyl cyclase, lowering cAMP, and can directly activate
  effectors such as the TRPC5 cation channel. Intrinsic GTP hydrolysis, accelerated by RGS-domain GAPs (e.g. RGS10, RGS16),
  terminates signaling. GNAI3 is also activated outside receptors by GBA-motif guanine nucleotide exchange factors (GIV/Girdin,
  DAPLE, PLCD4) that couple growth factor and Wnt-Frizzled signaling to Gi, and its GDP-bound form is bound by GoLoco-motif
  proteins (GPSM1/AGS3, GPSM2/LGN, GPSM3, RGS14). Intracellular pools at the Golgi, centrosome and midbody have been implicated
  in macroautophagy control and cell division. Dominant missense variants (e.g. p.Gly40Arg in the G1 motif) cause auriculocondylar
  syndrome 1, a craniofacial malformation attributed to disrupted endothelin-1-DLX5/6 signaling in mandibular development.
