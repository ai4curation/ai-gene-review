- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IDA
  original_reference_id: PMID:12642577
  qualifier: colocalizes_with
  review:
    summary: GNAI3 colocalizes with Golgi membranes in HT-29 intestinal cells, in the context of AGS3/Gai3 control of macroautophagy.
    action: KEEP_AS_NON_CORE
    reason: Gai3 has repeatedly been reported on Golgi membranes (including earlier antibody studies discussed in PMID:17635935)
      and the curator's colocalizes_with qualifier appropriately limits the claim. The cached paper is abstract-only, so I
      defer to the curator. Golgi association is a secondary, non-canonical location relative to the plasma membrane heterotrimer.
    supported_by:
    - &id005
      reference_id: PMID:12642577
      supporting_text: Both the endogenous form of AGS3 and a tagged expressed form have a localization compatible with a
        role in the Galphai3-dependent control of autophagy.
    - &id006
      reference_id: PMID:17635935
      supporting_text: (1994) reported strong plasma membrane and Golgi staining by an anti-Giα3 antibody in certain cells.
- term:
    id: GO:0003924
    label: GTPase activity
  evidence_type: IDA
  original_reference_id: PMID:19478087
  qualifier: enables
  review:
    summary: GTPase activity of GNAI3, assayed in the context of RGS-accelerated GTP hydrolysis of Gai subunits.
    action: ACCEPT
    reason: Intrinsic GTPase activity terminating the active state is the defining catalytic activity of Galpha subunits.
      Gai3 GTP hydrolysis is directly accelerated by RGS GAPs (RGS10, RGS16, RGS8); the curator's IDA from the full text is
      consistent with this.
    supported_by:
    - &id014
      reference_id: PMID:19478087
      supporting_text: a trio of point mutations to RGS2 that elicits Galpha(i)-directed binding and GAP activities
    - &id001
      reference_id: PMID:8774883
      supporting_text: RGS10 increases potently and selectively the GTP hydrolytic activity of several members of the G alphai
        family, including G alphai3, G alphaz, and G alpha0.
