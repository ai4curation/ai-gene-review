  review:
    summary: PAINT IBA assignment of G protein activity (GTP/GDP-cycling switch that engages effectors in the GTP-bound state)
      to the Galpha family node.
    action: ACCEPT
    reason: 'This is the most informative molecular function term for GNAI3: it cycles between GDP-bound inactive heterotrimer
      and GTP-bound active Galpha that regulates effectors (adenylyl cyclase inhibition, TRPC5 activation). GNAI3 sits well
      within the Gi/o clade from which the IBD was propagated.'
    supported_by:
    - &id003
      reference_id: file:human/GNAI3/GNAI3-uniprot.txt
      supporting_text: The alpha chain contains the guanine nucleotide binding site and alternates between an active, GTP-bound
        state and an inactive, GDP-bound state.
    - reference_id: PMID:37137991
      supporting_text: Here, we present the cryo-electron microscopy structures of the human transient receptor potential
        canonical 5 (TRPC5)-Gαi3 complexes with a 4:4 stoichiometry in lipid nanodiscs.
