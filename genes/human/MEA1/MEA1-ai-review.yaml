      heterologous reconstitution in E. coli, domain mapping with interface point mutants,
      endogenous co-IP, knockout-and-rescue in two human cell lines, and cargo-trafficking
      readouts. The AlphaFold-derived interface details are predictions, but each was tested by
      mutagenesis. Still a single study and a single laboratory; independent replication of the
      dual-chaperone collision model is not yet available.
