- term:
    id: GO:0035650
    label: AP-1 adaptor complex binding
  evidence_type: IDA
  original_reference_id: PMID:41559075
  qualifier: enables
  review:
    summary: >-
      Proposed NEW annotation, offered as the nearest available molecular-function term rather
      than an exact one. MEA1 binds the mu1 and beta1 subunits of AP-1 directly and
      domain-specifically - the N-terminal domain to mu1, the C-terminal domain to beta1 -
      demonstrated by co-expression in E. coli (which has neither AP-1 nor MEA1), by GST and
      nickel pull-downs of the reconstituted complexes, by co-immunoprecipitation of the
      endogenous proteins from human cells, and by loss of binding on mutation of the
      interface residues L73 (mu1 side) and the V141/K142/T144/M145 motif (beta1 side).
    action: NEW
    reason: >-
      There is no GO molecular-function term for an assembly chaperone that binds free,
      folded subunits of a complex it will not join, so GO:0035650 is used as a flagged
      stand-in in the same way GO:0035612 is used in this repository's AAGAB review. The flag
      is important and should not be lost: GO defines GO:0035650 as binding the assembled
      heterotetramer, whereas MEA1 binds only unassembled subunits and is expelled as the
      tetramer forms - structural modelling places MEA1 on the gamma-binding surface of beta1,
      so MEA1 and gamma cannot occupy it simultaneously. The term therefore names the right
      complex at the wrong altitude. The two entries under proposed_new_terms (carried over
      from the AAGAB review rather than duplicated as new proposals) are what this annotation
      should become.
    supported_by:
    - reference_id: PMID:41559075
      supporting_text: These results demonstrate that MEA1 directly binds to μ1 and β1, and
        stabilizes them in a soluble state.
    - reference_id: PMID:41559075
      supporting_text: >-
        Pull-down assays showed that MEA1-NTD bound and stabilized μ1 to a similar extent as FL
        MEA1, whereas MEA1-CTD neither bound nor stabilized μ1
    - reference_id: PMID:41559075
      supporting_text: Conversely, MEA1-CTD, but not NTD, bound and stabilized β1
    - reference_id: PMID:41559075
      supporting_text: In agreement with this, structural modeling showed that MEA1 occupies the
        γ-binding site on β1
- term:
    id: GO:0051131
    label: chaperone-mediated protein complex assembly
  evidence_type: IMP
  original_reference_id: PMID:41559075
  qualifier: involved_in
  review:
    summary: >-
      Proposed NEW annotation. CRISPR knockout of MEA1 in HeLa and RPE1 cells depletes all four
      AP-1 subunits and the trans-Golgi AP-1 puncta, and re-expression of MEA1 restores subunit
      levels; the reconstituted system shows that the MEA1-held mu1:beta1 pair and the
      AAGAB-held gamma:sigma1 pair combine into the tetramer with release of both chaperones.
    action: NEW
    reason: >-
      This term's definition - assembly "mediated by chaperone molecules that do not form part
      of the finished complex" - fits MEA1 exactly, and it is the same biological process the
      AAGAB review assigns to the other AP-1 assembly chaperone, which keeps the two files
      consistent. It is the strongest, least speculative statement that can be made about MEA1
      in the ontology as it currently stands.
    supported_by:
    - reference_id: PMID:41559075
      supporting_text: >-
        Interestingly, immunoblotting revealed that all four AP1 subunits—γ, β1, μ1, and
        σ1—were strongly reduced in MEA1 KO cells compared to WT controls
    - reference_id: PMID:41559075
      supporting_text: >-
        These findings support a dual-chaperone collision model, in which MEA1:μ1:β1 and
        AAGAB:γ:σ1 collide without stably associating with each other, and both MEA1 and AAGAB
        are released upon formation of the full AP1 tetramer
core_functions:
- description: >-
    Assembly chaperone for the AP-1 clathrin adaptor complex. MEA1 is an intrinsically
    disordered cytosolic protein with two functionally independent hands: its N-terminal domain
    binds and stabilizes the free mu1 subunit, its C-terminal domain binds and stabilizes the
    free beta1 subunit, and neither domain recognises the other's client. Holding both at once
    it forms a soluble mu1:beta1 hemicomplex that is otherwise degraded, and this hemicomplex is
    completed by collision with the gamma:sigma1 hemicomplex held by AAGAB. The two chaperones
    do not touch each other and both are released as the tetramer closes; MEA1 must leave
    because it sits on the gamma-binding surface of beta1. MEA1 therefore never binds assembled
    AP-1, stays in the cytosol while mature AP-1 goes to membranes, and is not a subunit of the
    adaptor. Its client range is narrow - AP-1 above all, AP-2 weakly, AP-3/AP-4/AP-5 not at
    all. The molecular_function term below is a stand-in: it names the assembled complex, while
    MEA1 in fact binds the free subunits, which is the interaction the mechanism turns on. The
    accurate terms are the two entries under proposed_new_terms.
  molecular_function:
    id: GO:0035650
    label: AP-1 adaptor complex binding
  directly_involved_in:
  - id: GO:0051131
    label: chaperone-mediated protein complex assembly
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:41559075
    supporting_text: >-
      Mechanistically, MEA1 acts as a bi-handed chaperone, simultaneously engaging and
      stabilizing the μ1 and β1 subunits of AP1.
  - reference_id: PMID:41559075
    supporting_text: >-
      The MEA1-stabilized μ1 and β1 collide with the γ and σ1 subunits stabilized by Alpha- and
      Gamma-Adaptin Binding Protein (AAGAB), another bi-handed chaperone, leading to formation
      of the tetrameric AP1 adaptor and release of both chaperones.
  - reference_id: PMID:41559075
    supporting_text: >-
      These results demonstrate that MEA1 is critical for maintaining the integrity of the AP1
      adaptor complex, and suggest that its function is primarily dedicated to AP1, without
      broadly regulating adaptor protein complexes.
proposed_new_terms:
- proposed_name: AP-type membrane coat adaptor complex subunit binding
  proposed_definition: >-
    Binding to a free, unassembled subunit of a heterotetrameric AP-type membrane coat adaptor
    complex (GO:0030119) - for example the mu1 or beta1 subunit of AP-1, the gamma or sigma1
    subunit of AP-1, or the alpha or sigma2 subunit of AP-2 - as distinct from binding the
    assembled adaptor complex.
  justification: >-
    This is the same term proposed in this repository's AAGAB review, repeated here with MEA1
    evidence attached rather than duplicated as a separate proposal, so that the two assembly
    chaperones argue for one term. GO's adaptor-binding terms are all complex-level: AP-1
    (GO:0035650), AP-2 (GO:0035612) and AP-3 (GO:0035651) adaptor complex binding all denote
    binding to the assembled heterotetramer, which is precisely what assembly chaperones do not
    do. MEA1 makes the point sharply: it binds free mu1 and free beta1, and structural modelling
    shows it occupies the gamma-binding site on beta1, so MEA1 physically cannot be bound to a
    complete AP-1. Annotating MEA1 with GO:0035650 therefore asserts the one interaction the
    published mechanism excludes. A single subunit-level term would serve MEA1, AAGAB and
    CCDC32 alike.
  proposed_parent:
    id: GO:0005515
    label: protein binding
  supported_by:
  - reference_id: PMID:41559075
    supporting_text: These results demonstrate that MEA1 directly binds to μ1 and β1, and
      stabilizes them in a soluble state.
  - reference_id: PMID:41559075
    supporting_text: In agreement with this, structural modeling showed that MEA1 occupies the
      γ-binding site on β1
- proposed_name: protein complex assembly chaperone activity
  proposed_definition: >-
    Binding to one or more folded subunits of a protein complex in order to stabilise them and
    promote their ordered assembly into that complex, where the binding protein does not form
    part of the finished complex.
  justification: >-
    Also carried over from the AAGAB review. GO's chaperone molecular functions concern folding
    (GO:0044183 protein folding chaperone is defined around binding an unfolded protein to fold
    it), whereas MEA1's clients are folded adaptor subunits whose problem is exposed interaction
    surfaces and rapid degradation, not misfolding - the structural models suggest MEA1 binding
    shields exposed hydrophobic residues on mu1 and beta1. The biological process side is
    covered by GO:0051131 chaperone-mediated protein complex assembly, but there is no matching
    molecular function, which is why both MEA1 and AAGAB can currently only be annotated with
    complex-binding terms that misstate what they do. MEA1 adds a second, independent example of
    the gap and a new mechanistic variant of it - two chaperones loading complementary halves of
    one complex and colliding.
  proposed_parent:
    id: GO:0005515
    label: protein binding
  supported_by:
  - reference_id: PMID:41559075
    supporting_text: >-
      Mechanistically, MEA1 acts as a bi-handed chaperone, simultaneously engaging and
      stabilizing the μ1 and β1 subunits of AP1.
  - reference_id: PMID:41559075
    supporting_text: >-
      These findings support a dual-chaperone collision model, in which MEA1:μ1:β1 and
      AAGAB:γ:σ1 collide without stably associating with each other, and both MEA1 and AAGAB
      are released upon formation of the full AP1 tetramer
suggested_questions:
- question: >-
    Is MEA1 genuinely dispensable for spermatogenesis? Every testis-related annotation on this
    gene descends from a 1989 expression study, and a germline knockout with a fertility readout
    has never been reported. Given that the gene is named for the hypothesis, testing it would
    settle a 35-year-old annotation.
  experts:
  - Jingshi Shen
- question: >-
    What sets the stoichiometry of the dual-chaperone collision? MEA1 and AAGAB do not interact,
    so nothing obviously couples production of the mu1:beta1 and gamma:sigma1 hemicomplexes.
    Is there a quality-control route that disposes of unpaired MEA1:mu1:beta1, and does either
    chaperone become limiting under stress?
  experts:
  - Jingshi Shen
  - Chun Wan
- question: >-
    Does MEA1's role in AP-2 matter in any cell type? AP-2 subunits fall only moderately in MEA1
    knockouts, which could mean a weak direct activity or redundancy with AAGAB and CCDC32.
    A triple-depletion series would distinguish these.
  experts:
  - Jingshi Shen
- question: >-
    Do AP-3 and AP-5 have their own assembly chaperones, and is any of them a MEA1 paralogue or
    analogue? MEA1 has no sequence similarity to anything, so the family of "bi-handed"
    chaperones may be structurally unrecognisable and only findable functionally.
  experts:
  - Qian Yin
suggested_experiments:
- hypothesis: >-
    MEA1 is an intrinsically disordered protein that folds only on engaging its clients, and one
    MEA1 molecule can bridge mu1 and beta1 simultaneously in cells.
  description: >-
    Determine the structure of the reconstituted MEA1:mu1:beta1 ternary complex by cryo-EM or
    crystallography, and compare the conformational state of free MEA1 by NMR or hydrogen-
    deuterium exchange mass spectrometry. This would test the AlphaFold trimeric model directly
    and establish whether the two hands are used together or alternately.
  experiment_type: structural biology of the reconstituted chaperone-client complex
- hypothesis: >-
    The testis annotations on MEA1 are an artefact of its name and its expression pattern, not a
    reflection of a germ-cell-specific requirement.
  description: >-
    Generate a germline Mea1 knockout and a germ-cell-conditional knockout in mouse and assess
    fertility, sperm counts and spermatid morphology alongside AP-1 subunit levels in testis and
    in somatic tissues. A fertility phenotype that tracks AP-1 loss would reframe the old
    annotation as a downstream consequence rather than a distinct function; no phenotype would
    retire it.
  experiment_type: mouse genetics with fertility and AP-1 biochemistry readouts
- hypothesis: >-
    AP-1 assembly proceeds by collision of two independently loaded hemicomplexes rather than by
    sequential subunit addition.
  description: >-
    Reconstitute assembly in vitro from purified components with fluorescently labelled MEA1 and
    AAGAB and follow single molecules, measuring the order and timing of chaperone release and
    testing whether tetramer formation requires both hemicomplexes to be pre-loaded. Titrating
    individual free subunits would show whether any sequential path exists at all.
  experiment_type: single-molecule in vitro reconstitution
