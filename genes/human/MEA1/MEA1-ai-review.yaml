      supporting_text: >-
        The genetic conservation and testis-specific expression of the MEA gene support the
        hypothesis that it plays an important role in mammalian spermatogenesis and/or testis
        development.
    - reference_id: PMID:2813404
      supporting_text: >-
        Although the Mea gene was transcribed as a 1-kilobase mRNA in most tissues, it was
        expressed at the highest level in adult testis.
- term:
