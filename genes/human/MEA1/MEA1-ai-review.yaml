id: Q16626
gene_symbol: MEA1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MEA1 is a small (~20 kDa), intrinsically disordered cytosolic protein that acts as an
  assembly chaperone for the heterotetrameric clathrin adaptor complex AP-1. It has no
  recognizable fold or sequence similarity to other protein families, yet it is
  functionally bipartite: its N-terminal region binds and stabilizes the mu1 subunit of
  AP-1 while its C-terminal region independently binds and stabilizes the beta1 subunit,
  so that a single molecule holds two different unassembled subunits at once. This
  MEA1-bound mu1:beta1 hemicomplex is completed when it meets the complementary gamma:sigma1
  hemicomplex held by the assembly chaperone AAGAB; the two chaperones never contact each
  other, and both are ejected as the AP-1 tetramer closes, MEA1 in particular because it
  occupies the gamma-binding surface of beta1. MEA1 therefore acts only on free subunits and
  is not part of the mature adaptor, and it remains cytosolic while assembled AP-1 is
  membrane-associated. Cells lacking MEA1 lose all four AP-1 subunits and the trans-Golgi
  AP-1 puncta, mis-sort constitutive AP-1 cargo such as folate receptor alpha, and fail to
  terminate STING signalling. MEA1 is dedicated mainly to AP-1, contributes little to AP-2
  and nothing detectable to AP-3, AP-4 or AP-5. Despite its name, which comes from its
  original cloning out of a testis cDNA library in 1989, MEA1 is expressed ubiquitously and
  is conserved across vertebrates and in some invertebrates.
existing_annotations:
- term:
    id: GO:0007283
    label: spermatogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      InterPro2GO mapping from IPR009685, the MEA1 family signature. The mapping exists
      because the family was named for a hypothesis about spermatogenesis, not because any
      member has been shown to act in it.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The entire evidential chain behind this term is a single 1989 expression study whose own
      conclusion was framed as a hypothesis, and whose data show the transcript present in most
      tissues with testis enrichment. No functional experiment in any species has tested MEA1 in
      spermatogenesis. The 2026 characterisation of the protein states plainly that it is
      ubiquitously expressed and has a general cellular role as an AP-1 assembly chaperone, so
      the testis association is best read as a naming artefact. REMOVE would be defensible for
      this InterPro-derived row in particular, but nothing positively excludes an additional
      germ-cell requirement for an adaptor-assembly chaperone in a tissue with heavy membrane
      traffic, so the weaker action is used, consistently across all three testis-related rows.
    supported_by:
    - reference_id: PMID:41559075
      supporting_text: >-
        Although initially cloned from a testis cDNA library (hence its name)38, MEA1 is
        ubiquitously expressed across tissue types and is detected in all examined human cell
        lines39,40, indicating a general cellular role.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:16189514
  qualifier: enables
  review:
    summary: >-
      Bare protein binding from a yeast two-hybrid interactome map. The recorded partner
      (UniProtKB:P63010) is AP2B1, the beta2 subunit of the AP-2 adaptor - which the 2026
      work independently recovers as a genuine, if secondary, MEA1 client.
    action: REMOVE
    reason: >-
      Not because the interaction is doubtful, but because bare protein binding
      conveys none of what makes it interesting. This screen captured a real adaptor-subunit
      interaction two decades before anyone could interpret it; the content belongs in the
      molecular-function and core-function entries. No more informative molecular function is
      supportable from this evidence, so the row is removed rather than rewritten. Removal does not
      imply the reported interaction is false.
    supported_by:
    - reference_id: PMID:41559075
      supporting_text: >-
        Besides μ1 and β1, the interactome of MEA1 also included the β2 and μ2 subunits of AP2
        (BioGRID)37, a central regulator of clathrin-mediated endocytosis18,43–47.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  review:
    summary: >-
      Bare protein binding from the HuRI binary interactome. The recorded partner
