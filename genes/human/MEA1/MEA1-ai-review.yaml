      Verified against PubMed as Wan C, Wu J, Ouyang Y, Puscher H, Tian Y, Li S, Yin Q, Shen J,
      Nat Commun 2026 Jan 20;17(1), doi 10.1038/s41467-026-68662-3, PMC12923701; full text
