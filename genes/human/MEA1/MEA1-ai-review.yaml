    summary: >-
      Traceable author statement from the 1989 cloning paper. The statement being traced is
      itself a hypothesis drawn from an expression pattern, not a result.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cited paper reports that the transcript is present in most tissues but highest in
      adult testis, and concludes only that this "supports the hypothesis" of a role in
      spermatogenesis. TAS is not experimental evidence, and no later study has tested the
      hypothesis. Marked over-annotated rather than removed, for the reasons given on the
      InterPro row; all GO:0007283 rows share this action.
    supported_by:
