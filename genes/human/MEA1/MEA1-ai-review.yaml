- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: >-
      Orthology-based transfer from mouse Mea1 (UniProtKB:Q64327). The compartment is right but
      under-specific now that human MEA1 has been localised directly.
    action: MODIFY
    reason: >-
      Confocal imaging and biochemical fractionation both place MEA1 in the soluble cytosol,
      separate from membrane-bound AP-1, which is the functionally meaningful statement - AP-1
      assembly happens in the cytosol and MEA1 is released before the adaptor is recruited to
      membranes. GO:0005829 cytosol should replace the generic cytoplasm term.
    supported_by:
    - reference_id: PMID:41559075
      supporting_text: Confocal imaging revealed that both MEA1 and AAGAB displayed diffuse
        cytosolic localization
    - reference_id: PMID:41559075
      supporting_text: >-
        cell fractionation showed that the transferrin receptor (TfR) and AP1 γ subunit were
        exclusively in the membrane fraction, whereas MEA1 and AAGAB were confined to the
        soluble cytosolic fraction along with glyceraldehyde 3-phosphate dehydrogenase (GAPDH),
        a cytosolic marker
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
- term:
    id: GO:0007283
    label: spermatogenesis
  evidence_type: TAS
  original_reference_id: PMID:2813404
  qualifier: involved_in
