id: Q86TY3
gene_symbol: ARMH4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARMH4 (UT2) is a 774-residue single-pass transmembrane protein with an armadillo-like helical
  domain. Mouse Armh4/UT2 binds the mTORC2 subunit RICTOR through its cytoplasmic tail and inhibits mTORC2
  signalling in hematopoietic progenitors. UT2 also binds GP130 (IL6ST) and inhibits STAT3 Y705 phosphorylation,
  dampening IL-6 family cytokine signalling. In kidney epithelial cells and podocytes ARMH4 reduces IL-1B
  and IL-8 release. A study of aging reports that ARMH4 binds the receptor tyrosine kinases IGF1R and
  FGFR1 through an acidic ectodomain segment and sensitizes their signalling, and that it promotes aging.
  ARMH4 is found at the cell surface, and in mouse Purkinje cells it regulates dendrite morphogenesis
  through its conserved cytoplasmic domain.
