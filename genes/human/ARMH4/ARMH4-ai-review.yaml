suggested_questions:
- question: How does ARMH4 both inhibit mTORC2 and IL6ST/STAT3 signalling and, in another study, sensitize
    IGF1R/FGFR1 signalling? Are these cell-type-specific activities?
suggested_experiments:
- description: Test RICTOR and GP130 binding by human ARMH4 in human cells, and map the cytoplasmic-tail
    residues required for each interaction.
