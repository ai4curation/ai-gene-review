  label: Homo sapiens
description: 'PON1 is a calcium-dependent secreted paraoxonase/arylesterase that associates with HDL particles
  through a retained hydrophobic N-terminal segment. It hydrolyzes lactones, aryl esters, and organophosphates,
  can act on N-acyl-homoserine lactones, and contributes contextually to HDL lipid handling and xenobiotic
  detoxification.'
