- term:
    id: GO:0004239
    label: initiator methionyl aminopeptidase activity
  evidence_type: IDA
  original_reference_id: PMID:36173861
  qualifier: enables
  review:
    summary: >-
      The activity is real but this is the wrong term for it, on three grounds that were
      computed rather than assumed. First, the term means canonical methionine
      aminopeptidase: its definition is "Catalysis of the release of N-terminal initiator
      methionine from peptides" and its only EC cross-reference is 3.4.11.18. ACTMAP does
      not release methionine; UniProt's own four Rhea reactions have it releasing
      N-acetyl-L-methionine or N-acetyl-L-cysteine, and UniProt deliberately assigns EC
      3.4.11.-, not 3.4.11.18. The 2022 paper's central point is that actin "defies this
      rule". Second, the whole aminopeptidase branch is definitionally strained here:
      GO:0004239 descends from GO:0008238 exopeptidase activity, whose definition requires
      "a free N-terminal amino group", which an N-alpha-acetylated substrate does not have.
      GO already models the exact analogue correctly, in that GO:0016920
      pyroglutamyl-peptidase activity releases a single N-terminal residue whose alpha-amino
      group is blocked and sits under GO:0008242 omega peptidase activity plus GO:0008234
      cysteine-type peptidase activity, and not under GO:0004177 aminopeptidase activity.
      This second ground does not by itself discriminate GO:0004239 from the GO:0070005
      proposed in its place, since both are descendants of GO:0008238; it is an argument for
      the new term in proposed_new_terms, which the first and third grounds are not. Third,
      the term is now doing double duty: across
      five model organisms it is carried by 74 gene products, of which only 4 are
      ACTMAP-family and 70 are METAP1/METAP1D/METAP2, yeast MAP1/MAP2, RNPEPL1 and fly
      MAP1A/MAP1B/und, so one term covers both the metal-dependent co-translational MetAPs
      that remove unmodified methionine and the cysteine-nucleophile ACTMAP family that
      removes the acetylated residue post-translationally.
    action: MODIFY
    reason: >-
      Modified, not removed, and explicitly not a criticism of the curator. GO:0004239 was
      obsoleted in 2015 and reinstated on 2023-03-14 with its present narrow definition
      (QuickGO carries the comment "This term was reinstated from obsolete"); this
      annotation is dated 2023-03-31, seventeen days later. The curator picked the closest
      term available at the time, and the underlying problem is that the ontology has no
      term for release of an N-alpha-acetylated N-terminal residue. GO:0070005 is proposed
      as the replacement because it is the best currently existing term: it is already on
      this record with the same IDA support, it retains single-N-terminal-residue release
      and the cysteine mechanism, and it drops the false assertion of EC 3.4.11.18 MetAP
      activity. Only the first and third grounds above discriminate the two terms and so
      motivate this MODIFY; the second applies equally to both and motivates the term
      request instead. What it loses is the residue identity, which is exactly what the proposed
      new term would restore. Replacing the term here also removes the incorrect
      implication that ACTMAP belongs to the METAP family, and the same correction applies
      family-wide: all six reviewed members of PTHR28631 now carry GO:0004239, the five
      non-human ones (mouse, bovine, Xenopus, zebrafish, Drosophila) having inherited it
      from this human annotation.
    proposed_replacement_terms:
    - id: GO:0070005
      label: cysteine-type aminopeptidase activity
    supported_by:
    - reference_id: file:human/ACTMAP/ACTMAP-uniprot.txt
      supporting_text: EC=3.4.11.- {ECO:0000269|PubMed:36173861}
    - reference_id: file:human/ACTMAP/ACTMAP-uniprot.txt
      supporting_text: Reaction=N-terminal N(alpha)-acetyl-L-methionyl-L-aspartyl-[protein]
        +
    - reference_id: PMID:36173861
      supporting_text: >-
        Protein synthesis generally starts with a methionine that is removed during
        translation. However, cytoplasmic actin defies this rule because its synthesis
        involves noncanonical excision of the acetylated methionine by an unidentified
        enzyme after translation.
      full_text_unavailable: true
    - reference_id: file:human/ACTMAP/ACTMAP-bioinformatics/RESULTS.md
      supporting_text: '- `GO:0004239` (initiator methionyl aminopeptidase activity) is under
        `GO:0008238`: **True**'
    - reference_id: file:human/ACTMAP/ACTMAP-bioinformatics/RESULTS.md
      supporting_text: '- `GO:0008242` omega peptidase activity is under `GO:0008238`: **False**'
    - reference_id: file:human/ACTMAP/ACTMAP-bioinformatics/RESULTS.md
      supporting_text: '- of these, **4** are ACTMAP-family (PANTHER PTHR28631) and **70**
        are not'
    knowledge_gaps:
    - gap_statement: >-
        GO has no term for hydrolytic release of an N-alpha-acetylated N-terminal residue
        from a protein, which is the reaction ACTMAP catalyses, so every term currently
        available to it is either wrong about the substrate or silent about it.
      gap_kind:
      - ONTOLOGY
      dark_aspect: RESIDUAL_SUBGAP
      boundary: >-
        The chemistry is not in doubt. UniProt records four Rhea reactions releasing
        N-acetyl-L-methionine or N-acetyl-L-cysteine, the catalytic residue is mapped and
        mutated, and the omega-peptidase branch that should hold such a term exists and is
        cross-referenced to EC 3.4.19.1. What is missing is a child term under it.
