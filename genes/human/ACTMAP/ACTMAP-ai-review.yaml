      GO:0006508. The two branches are disjoint, so a proteolytic event does not belong in
      the modification branch, and NAA80's precedent is an acetyl transfer that does not
      extend to peptide-bond hydrolysis. The extension records the same substrate fact with
      no branch violation and without the unwanted GO:0030036
