- id: PMID:36173861
  title: Actin maturation requires the ACTMAP/C19orf54 protease.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The defining paper for this gene and the source of every experimental annotation in
      GOA. PubMed-verified; no retraction or correction notice (E-utilities
      CommentsCorrections is empty). Only the abstract is cached, so all claims taken from
      it here are abstract-level; the mechanistic details (Cys132 active site, C132A
      mutagenesis, PFN1/PFN2 interaction, catalytic-activity reactions) are taken from the
      UniProt entry's own ECO:0000269|PubMed:36173861 annotations rather than from
      paraphrase.
  findings:
  - statement: >-
      Cytoplasmic actin is the exception to co-translational initiator-methionine removal:
      its initiator methionine is acetylated and then excised after translation.
    supporting_text: >-
      Protein synthesis generally starts with a methionine that is removed during
      translation. However, cytoplasmic actin defies this rule because its synthesis
      involves noncanonical excision of the acetylated methionine by an unidentified
      enzyme after translation.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: C19orf54/ACTMAP is that enzyme.
    supporting_text: >-
      Here, we identified C19orf54, named ACTMAP (actin maturation protease), as this
      enzyme.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: >-
      Loss of ACTMAP in mice leaves the animals viable but builds the cytoskeleton from
      immature actin in all tissues.
    supporting_text: >-
      Its ablation resulted in viable mice in which the cytoskeleton was composed of
      immature actin molecules across all tissues.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  - statement: >-
      The consequence is tissue-restricted: skeletal muscle shows shortened sarcomeric
      actin filaments, reduced function and centralized nuclei.
    supporting_text: >-
      However, in skeletal muscle, the lengths of sarcomeric actin filaments were shorter,
      muscle function was decreased, and centralized nuclei, a common hallmark of
      myopathies, progressively accumulated.
    full_text_unavailable: true
    reference_section_type: ABSTRACT
- id: PMID:42159598
  title: A Global Ligandability Map of Tryptoline Butynamide Stereoprobes Identifies
    Covalent Inhibitors of the Actin Maturation Protease.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Peer-reviewed JACS version of the covalent-probe study; full text available from
      PMC13367750. Independent laboratory (Cravatt) and independent methodology, so it is
      genuine corroboration of the cysteine-nucleophile mechanism and of the cellular
      consequence of blocking it. Note that the paper's "45 kDa" description of ACTMAP is
      an apparent mass; UniProt computes 37,779 Da for the 351-residue canonical form, so
      that figure is not used here.
  findings:
  - statement: >-
      Pathway order: ACTMAP removes the N-terminally acetylated methionine of beta- and
      gamma-actin post-translationally, and NAA80 then re-acetylates the new N-terminus.
    supporting_text: >-
      protein identified in a haploid genetic screen to function as a protease that
      post-translationally cleaves the N-terminally acetylated methionine from β- and
      γ-actin, which are then reacetylated by N-acetyltransferase NAA80 to generate
      mature actins.
    reference_section_type: RESULTS
  - statement: >-
      The fold is that of a bacterial cysteine protease and Cys132 is the catalytic
      nucleophile.
    supporting_text: >-
      AlphaFold predictions revealed that ACTMAP has structural similarity to bacterial
      cysteine proteases with C132 representing the catalytic nucleophile.
    reference_section_type: RESULTS
  - statement: Covalent stereoprobes react with WT ACTMAP but not with the C132A mutant.
    supporting_text: >-
      we confirmed the stereoselective reactivity of WX-02-570 with recombinant WT-ACTMAP,
      but not a C132A mutant, both in HEK293T cells and in cell lysates by gel-ABPP
    reference_section_type: RESULTS
  - statement: >-
      Specificity control on the residue assignment: two other cysteines remain reactive.
    supporting_text: >-
      Other representative cysteine mutants of ACTMAP (C119A and C271A) retained
      reactivity with WX-02-570
    reference_section_type: RESULTS
  - statement: >-
      Genetic disruption of ACTMAP in human cells causes immature actin to accumulate,
      assayed with an antibody specific for the unprocessed beta-actin N-terminus.
    supporting_text: >-
      genetic disruption of ACTMAP by CRISPR/Cas9 gene editing resulted in substantial
      accumulation of immature actin as measured by Western blotting with an antibody
      recognizing the N-terminus of β-actin
    reference_section_type: RESULTS
  - statement: >-
      Pharmacological engagement of Cys132 reproduces the genetic phenotype in human
      cancer cells.
    supporting_text: >-
      which produced a concentration-dependent increase in immature β-actin
    reference_section_type: RESULTS
  - statement: >-
      Profilin 1 and 2 are established ACTMAP interactors and are recovered in ACTMAP
      immunoprecipitates.
    supporting_text: >-
      These IP-MS experiments also revealed stereoselective reductions in the enrichment
      of established ACTMAP-interacting proteins, such as profilin 1 and 2 (PFN1/2)
    reference_section_type: RESULTS
