id: Q5BKX5
gene_symbol: ACTMAP
aliases:
- C19orf54
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACTMAP, formerly C19orf54, is a cytoplasmic cysteine protease that carries out the
  final proteolytic step of actin N-terminal maturation. Most proteins lose their
  initiator methionine co-translationally, but cytoplasmic beta- and gamma-actin
  instead retain it and have it N-terminally acetylated; ACTMAP subsequently excises
  the residue intact, as N-alpha-acetyl-methionine, after translation, exposing the
  Asp2 (or Glu2) that N-alpha-acetyltransferase NAA80 then acetylates to give mature
  actin. In muscle alpha-actins, whose initiator methionine is removed canonically, the
  equivalent substrate is the acetylated cysteine that becomes residue 1; this activity is
  established for the mouse enzyme and inferred for the human one by similarity.
  Catalysis depends on Cys132 inside a peptidase C39-like region structurally related
  to bacterial cysteine proteases: substituting this residue abolishes cleavage of
  immature actin, and covalent tryptoline butynamide probes that react with it cause
  immature actin to accumulate in human cells. A proline-rich disordered N-terminal
  region binds profilin 1 and profilin 2, the carriers of monomeric actin. Mice
  lacking ACTMAP are viable but build their cytoskeleton from immature actin in every
  tissue and develop a skeletal-muscle phenotype comprising shortened sarcomeric
  actin filaments, reduced muscle function and progressively centralized myonuclei.
alternative_products:
- name: '1'
  id: Q5BKX5-1
  description: >-
    Canonical 351-residue form and the MANE-Select product (ENST00000378313.7). It is
    the only isoform that retains both the catalytic Cys132 and the complete peptidase
    C39-like region (residues 124-244), and therefore the only isoform that can be
    catalytically active. All functional and structural data on ACTMAP refer to this
    form.
- name: '2'
  id: Q5BKX5-2
  sequence_note: VSP_039884, VSP_039885
  description: >-
    Carries VSP_039884, which replaces residues 1-216 with an unrelated 35-residue
    N-terminus, plus VSP_039885 in the C-terminus. VSP_039884 deletes the catalytic
    Cys132 and most of the peptidase C39-like region, so this isoform cannot perform
    the protease reaction; no activity has been reported for it.
- name: '3'
  id: Q5BKX5-3
  sequence_note: VSP_039884
  description: >-
    Carries VSP_039884 only, so like isoform 2 it lacks the catalytic Cys132 and most
    of the peptidase C39-like region and cannot be catalytically active. This is
    nevertheless the form used in the large-scale interaction screens: all 66 partners
    listed in the UniProt INTERACTION block, and 212 of 216 ACTMAP-side IntAct records,
    are recorded against Q5BKX5-3, and the great majority are yeast two-hybrid records.
    Interaction data attributed to ACTMAP therefore describe a catalytically dead form.
