      Accepted as the core biological process, with has_input extensions to ACTB and ACTG1
      so that the substrate is recorded machine-readably. The term itself is silent about
      the substrate, and the obvious repair - adding GO:0030047 actin modification, which
      the pathway's next enzyme NAA80 carries by IDA from three papers - is wrong on GO's
      own structure: GO:0016485 sits under GO:0006508 proteolysis and NOT under GO:0036211
