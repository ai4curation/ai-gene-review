  review:
    summary: >-
      Correct and core. ACTMAP's only known biological role is a protein-maturation
      cleavage event, which is precisely what GO:0016485 denotes: "Any protein maturation
      process achieved by the cleavage of a peptide bond or bonds within a protein."
      Removing the acetylated initiator residue is the step that converts immature actin
      into a substrate for NAA80 and hence into mature actin, and genetic loss of ACTMAP in
