proposed_new_terms:
- proposed_name: protein N-terminal N(alpha)-acetylamino-acid hydrolase activity
  proposed_definition: >-
    Catalysis of the hydrolysis of the peptide bond between the N-alpha-acetylated
    N-terminal residue of a protein and the second residue, releasing an N-acetyl-amino
    acid such as N-acetyl-L-methionine or N-acetyl-L-cysteine and generating a new protein
    N-terminus. Unlike aminopeptidase activities, the alpha-amino group of the substrate's
    N-terminal residue is blocked by acetylation, so the released product is a substituted
    amino acid.
  proposed_parent:
    id: GO:0008242
    label: omega peptidase activity
  justification: >-
    ACTMAP catalyses this reaction and GO has no term for it, so both of the terms GOA
    currently uses are wrong in different ways. GO:0004239 initiator methionyl
    aminopeptidase activity is defined as release of N-terminal initiator methionine and
    cross-references only EC 3.4.11.18, the canonical co-translational metal-dependent
    MetAP reaction, whereas ACTMAP releases N-acetyl-L-methionine and UniProt assigns it EC
    3.4.11.-, deliberately not 3.4.11.18. GO:0070005 cysteine-type aminopeptidase activity
    gets the mechanism right but, like GO:0004239, descends from GO:0008238 exopeptidase
    activity, whose definition requires "a free N-terminal amino group" that an
    N-alpha-acetylated N-terminus does not have. GO:0008242 omega peptidase activity is the
    correct parent branch: it is not under exopeptidase activity, it is defined for
    "cleavage of non-standard peptide bonds releasing substituted amino acids", and it
    cross-references EC 3.4.19.1 acylaminoacyl-peptidase, the EC subclass for release of an
    N-acetyl amino acid from a polypeptide. The ontology already contains the pattern to
    copy: GO:0016920 pyroglutamyl-peptidase activity releases a single N-terminal residue
    whose alpha-amino group is blocked and is placed under GO:0008242 and GO:0008234
    cysteine-type peptidase activity, and explicitly not under GO:0004177 aminopeptidase
    activity, so a dual-parented term of the same shape would fit ACTMAP exactly. Because
    the term should be substrate-agnostic it would also serve any other enzyme that removes
    an N-acetylated N-terminal residue. Adding it would let GO:0004239 revert to meaning
    only the METAP family, which is what 70 of the 74 gene products carrying it in five
    model organisms actually are.
  proposed_mappings:
  - predicate: skos:relatedMatch
    target_term:
      id: RHEA:74571
      label: N-terminal N(alpha)-acetyl-L-methionyl-L-aspartyl-[protein] + H2O = N-terminal
        L-aspartyl-[protein] + N-acetyl-L-methionine
  - predicate: skos:broadMatch
    target_term:
      id: EC:3.4.19.1
      label: acylaminoacyl-peptidase
  supported_by:
  - reference_id: file:human/ACTMAP/ACTMAP-uniprot.txt
    supporting_text: Reaction=N-terminal N(alpha)-acetyl-L-methionyl-L-aspartyl-[protein]
      +
  - reference_id: file:human/ACTMAP/ACTMAP-uniprot.txt
    supporting_text: EC=3.4.11.- {ECO:0000269|PubMed:36173861}
  - reference_id: file:human/ACTMAP/ACTMAP-bioinformatics/RESULTS.md
    supporting_text: '- `GO:0016920` pyroglutamyl-peptidase activity under aminopeptidase:
      **False**'
suggested_questions:
- question: >-
    Should GO create a term for release of an N-alpha-acetylated N-terminal residue,
    parented under GO:0008242 omega peptidase activity and GO:0008234 cysteine-type
    peptidase activity in the same way as GO:0016920 pyroglutamyl-peptidase activity? At
    present GO:0004239 initiator methionyl aminopeptidase activity, whose sole EC
    cross-reference is 3.4.11.18, is carried by 74 gene products across five model
    organisms, 70 of them METAP-family and 4 of them ACTMAP-family; that five-taxon count
    understates the family, because asking each reviewed PTHR28631 member directly gives
    six of six carrying the term. One new term would separate the two families and would
    fix all six reviewed ACTMAP-family records together.
  experts:
  - GO ontology editors
  - MEROPS and peptidase classification curators
- question: >-
    Does GO intend "covalent modification" in GO:0030047 actin modification to include
    hydrolytic removal of a residue, or only additive modifications? The question decides
    whether a substrate-specific process term is available to ACTMAP at all. On GO's present
    structure the answer looks like no: GO:0016485 protein processing sits under GO:0006508
    proteolysis and not under GO:0036211 protein modification process, while GO:0030047 sits
    under GO:0036211 and not under GO:0006508, so the two branches are disjoint and a
    proteolytic event has no place in the modification branch. Both existing users of the
    term are consistent with that reading, since NAA80's three IDAs are acetyl transfer and
    the term's only child is actin ubiquitination. This review therefore records ACTMAP's
    substrate with has_input extensions rather than a process term. A secondary question
    follows if the answer is yes: GO:0030047 also entails GO:0030036 actin cytoskeleton
    organization, which an enzyme that merely modifies an actin molecule has not earned.
  experts:
  - GO ontology editors
  - cytoskeleton curators
- question: >-
    Does UniProt's SUBCELLULAR LOCATION for ACTMAP rest on a fractionation or imaging
    experiment that would support Cytosol rather than the current Cytoplasm? Both primary
    papers describe ACTMAP as cytosolic in prose, and the substrate, profilin-bound
    unpolymerised actin, is cytosolic, but the current annotation is ECO:0000305 curator
    inference and the Science full text was not available for checking.
  experts:
  - UniProt curators
- question: >-
    Should PAN-GO annotate ACTMAP? UniProt's DR line records 0 GO annotations based on
    evolutionary models for Q5BKX5, yet PTHR28631 is a single-subfamily family
    (PTHR28631:SF1 ACTIN MATURATION PROTEASE, 1109 proteins, 845 proteomes, 2999 taxa)
    with one reviewed member per species and IDA-grade evidence on the human protein. There
    is no paralog to confound a transfer, so this looks like a coverage gap rather than a
    deliberate exclusion.
  experts:
  - PAN-GO and PAINT curators
- question: >-
    Will MGI curate mouse Actmap? It still carries root ND annotations in all three aspects
    (GO:0003674, GO:0008150, GO:0005575 via GO_REF:0000015), so the knockout phenotype
    reported in the same paper that named the gene, namely shortened sarcomeric actin
    filaments, reduced muscle function and centralized myonuclei, is unrepresented in GO,
    and the human record has nothing to receive by orthology beyond the UniProt annotations.
  experts:
  - MGI curators
- question: >-
    Does human ACTMAP cleave the acetylated cysteine of muscle alpha-actins directly?
    UniProt annotates this activity for human by similarity from mouse (ECO:0000250
    UniProtKB:J3QPC3) while the human demonstration covers beta- and gamma-actin, so the
    human enzyme's activity on ACTA1, ACTC1 and ACTA2 is inferred rather than shown.
  experts:
  - muscle cell biologists
  - UniProt curators
suggested_experiments:
- hypothesis: >-
    Profilin binding by the proline-rich disordered N-terminus is functionally required for
    efficient cleavage of immature actin, rather than being an incidental interaction.
  description: >-
    Compare full-length ACTMAP with an N-terminally truncated form lacking the proline-rich
    region (residues 1-70) in a reconstituted cleavage assay on purified immature
    beta-actin, with and without profilin 1 or profilin 2, measuring cleavage kinetics by
    mass spectrometry of the released N-acetyl-methionine. Re-express the same constructs in
    ACTMAP-knockout human cells and quantify immature beta-actin with the
    N-terminus-specific antibody. UniProt currently states the functional role only as a
    possibility.
  experiment_type: biochemical reconstitution and cellular rescue
- hypothesis: >-
    ACTMAP is an omega-type peptidase whose activity requires the substrate N-terminus to be
    N-alpha-acetylated, and it cannot act on a free N-terminal methionine.
  description: >-
    Present purified ACTMAP with matched substrates differing only in N-terminal acetylation
    state (acetyl-Met-Asp-Asp-Asp versus Met-Asp-Asp-Asp, and acetyl-Cys-Asp-Asp versus
    Cys-Asp-Asp) and measure release of the first residue. A strict requirement for
    acetylation would settle the EC assignment as 3.4.19-type rather than 3.4.11-type, and
    would decide the ontology placement question directly instead of by analogy to
    pyroglutamyl-peptidase.
  experiment_type: enzyme substrate-specificity assay
- hypothesis: >-
    The muscle phenotype of ACTMAP loss is mediated by failure to process muscle
    alpha-actin, not by the beta- and gamma-actin defect that is present in all tissues.
  description: >-
    In human iPSC-derived skeletal myotubes, disrupt ACTMAP and measure the N-terminal
    processing state of ACTA1 separately from ACTB and ACTG1 by targeted mass spectrometry,
    then assay sarcomeric thin-filament length and contractile function. This tests directly
    whether the tissue restriction of the mouse phenotype follows from substrate identity,
    and would supply the human evidence the current record lacks.
  experiment_type: cellular genetics with targeted proteomics
- hypothesis: >-
    Covalent Cys132 ligands can be used as acute chemical probes of actin maturation,
    separating the consequences of losing mature actin from the consequences of losing the
    ACTMAP protein.
  description: >-
    Exploit the observation that WX-02-623 both inhibits and destabilises ACTMAP: compare
    acute inhibition with an equipotent non-degrading analogue, and with the
    stereochemically matched inactive enantiomer WX-02-624, in a time course of immature
    beta-actin accumulation and of actin filament dynamics. The reported
    proteasome-dependent but neddylation-independent degradation is itself unexplained and
    would be addressed by the same series.
  experiment_type: chemical biology with stereochemical controls
knowledge_gaps:
- gap_statement: >-
    Nothing is known about how ACTMAP itself is regulated, and no function has been
    attached to its one mapped post-translational modification.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  boundary: >-
    Ser316 is a confidently mapped phosphosite, reported independently by three
    large-scale mitotic phosphoproteomics studies, so the modification is not in question;
    its consequence for activity, localisation or stability is entirely unstudied, as is
    why the site should be mitotic.
  resolution: >-
    Phosphomimetic and non-phosphorylatable substitutions at Ser316 assayed for cleavage
    activity, profilin binding and protein stability across the cell cycle.
  status: OPEN
  provenance:
  - reference_id: file:human/ACTMAP/ACTMAP-uniprot.txt
    supporting_text: /note="Phosphoserine"
- gap_statement: >-
    Why loss of ACTMAP produces a functional defect only in skeletal muscle, when immature
    actin accumulates in every tissue, is unexplained.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  boundary: >-
    Both halves of the contrast are established in the knockout mouse: the cytoskeleton is
    built from immature actin across all tissues, yet the phenotype is restricted to
    shortened sarcomeric filaments, reduced muscle function and centralized nuclei.
  resolution: >-
    Determine whether the tissue restriction follows from substrate identity (muscle
    alpha-actin versus beta- and gamma-actin) or from the mechanical demands placed on
    thin-filament length.
  status: OPEN
  provenance:
  - reference_id: PMID:36173861
    supporting_text: >-
      Its ablation resulted in viable mice in which the cytoskeleton was composed of
      immature actin molecules across all tissues.
    full_text_unavailable: true
  - reference_id: PMID:36173861
    supporting_text: >-
      However, in skeletal muscle, the lengths of sarcomeric actin filaments were shorter,
      muscle function was decreased, and centralized nuclei, a common hallmark of
      myopathies, progressively accumulated.
    full_text_unavailable: true
- gap_statement: >-
    There is no experimental structure of ACTMAP; the fold assignment and the identity of
    the catalytic nucleophile rest on AlphaFold models combined with mutagenesis, and no
    enzyme-substrate complex exists.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  boundary: >-
    The functional conclusion is nonetheless secure, because C132A is catalytically dead and
    covalent probes engage WT but not C132A protein while two other cysteines stay reactive.
    What is missing is how the enzyme recognises an acetylated N-terminus, which no model
    predicts.
  resolution: >-
    A crystal or cryo-EM structure of ACTMAP, ideally with a covalent butynamide adduct or
    an N-terminal actin peptide bound.
  status: OPEN
  provenance:
  - reference_id: PMID:42159598
    supporting_text: >-
      AlphaFold predictions revealed that ACTMAP has structural similarity to bacterial
      cysteine proteases with C132 representing the catalytic nucleophile.
- gap_statement: >-
    How covalent liganding of Cys132 triggers proteasomal degradation of ACTMAP, and which
    ligase does it, is unknown.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  boundary: >-
    The phenomenon is characterised: degradation is stereoselective, requires the catalytic
    cysteine, is blocked by MG-132 and is not blocked by the neddylation inhibitor MLN4924,
    and liganding promotes binding to HSP90AA1, HSP90AB1 and CCT2.
  resolution: >-
    Genetic screens for the mediators of stereoprobe-induced ACTMAP degradation, as the
    authors themselves propose.
  status: OPEN
  provenance:
  - reference_id: PMID:42159598
    supporting_text: >-
      We do not yet understand how covalent liganding by tryptoline butynamides leads to
