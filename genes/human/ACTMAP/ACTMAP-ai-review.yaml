core_functions:
- description: >-
    Post-translational excision of the N-alpha-acetylated N-terminal residue of actin.
    ACTMAP hydrolyses the bond between residue 1 and residue 2 of immature actin,
    releasing N-acetyl-L-methionine from cytoplasmic beta- and gamma-actin and, on the
    mouse enzyme with the human activity inferred by similarity, N-acetyl-L-cysteine from
    muscle alpha-actins whose initiator methionine has already been removed canonically,
    exposing the Asp or Glu that NAA80 then acetylates to complete maturation. Catalysis uses Cys132 as the nucleophile within a peptidase
    C39-like region of bacterial-cysteine-protease fold; the C132A substitution is
    catalytically dead, and covalent probes that react selectively with Cys132 cause
    immature actin to accumulate in human cells. The enzyme binds profilin 1 and profilin
    2 through its proline-rich disordered N-terminus, which is the plausible route to its
    substrate since profilin is the carrier of monomeric actin, though whether that binding
    is required for efficient cleavage has not been tested.
