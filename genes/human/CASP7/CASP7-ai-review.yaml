suggested_questions:
- question: Should human CASP7 carry a direct extracellular-region annotation for the gasdermin/perforin pore-repair 
    SMPD1 pathway, or should current human assertions remain similarity-based until the pathway is demonstrated in human
    primary cells?
  experts: []
- question: Should CASP7 RNA binding be modeled as a substrate-recognition cofactor for PARP1 and RNA-binding protein 
    cleavage in GO-CAM annotations rather than as a standalone flat MF row?
  experts:
  - Denault JB
suggested_experiments:
- hypothesis: CASP7 N-terminal RNA binding determines a discrete nuclear substrate repertoire during apoptotic 
    execution.
  description: Use isogenic CASP7 knockout cells rescued with wild-type CASP7 or K38-K41 exosite mutants and perform 
    apoptotic N-terminomics plus RNAse/add-back cleavage assays for PARP1, p23, and RNA-binding protein substrates.
  experiment_type: structure-function degradomics
- hypothesis: Human CASP7 is secreted through GSDMD or perforin pores and activates extracellular SMPD1 for 
    ceramide-dependent membrane repair.
  description: Trigger inflammasome or granzyme/perforin pore formation in human epithelial or hepatocyte models, 
    perturb CASP7 cleavage and secretion, and assay extracellular pro-SMPD1 processing, ceramide production, and 
    membrane resealing.
  experiment_type: cellular pathway rescue assay
