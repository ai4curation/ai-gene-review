id: P55210
gene_symbol: CASP7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CASP7 is a short-prodomain executioner caspase that is synthesized as a cytosolic zymogen and activated by initiator
  caspases, granzyme B, CASP1, or calpain cleavage into an Asp-directed cysteine endopeptidase. In apoptosis, mature CASP7
  cleaves PARP1, p23, YY1, claspin, and other nuclear and cytosolic substrates, using a positively charged N-terminal exosite
  that can bind RNA to accelerate PARP1 and RNA-binding-protein proteolysis. CASP7 is inhibited by IAP proteins such as XIAP/BIRC4
  and BIRC6 and by PAK2 phosphorylation, and it also has non-apoptotic roles in inflammasome/NF-kB signaling and SMPD1 activation
  for membrane-pore repair.'
