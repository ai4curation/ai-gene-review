    label: cytosol
  - id: GO:0005634
    label: nucleus
  supported_by:
  - *id005
  - reference_id: PMID:22451931
    supporting_text: "caspase-7, which shares the same substrate\nprimary sequence preference as caspase-3, is better at cleaving
      poly(ADP ribose)\npolymerase 1 (PARP) and Hsp90 cochaperone p23"
    reference_section_type: ABSTRACT
- description: CASP7 binds RNA through a lysine-rich N-terminal exosite to enhance cleavage of PARP1 and other 
    RNA-binding protein substrates.
