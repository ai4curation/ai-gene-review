- description: CASP7 is an Asp-directed cysteine endopeptidase that is activated by intersubunit-linker cleavage and 
    cleaves PARP1, p23, YY1, claspin, and other substrates during apoptotic execution.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
