core_functions:
- description: CASP3 is an Asp-directed cysteine endopeptidase with preference for DEVD-like
    substrates. It is produced as a zymogen and activated by processing into catalytic large and
    small chains; native protein recognition extends beyond a short peptide motif.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0006508
    label: proteolysis
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: file:human/CASP3/CASP3-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Strict requirement for an Asp residue at positions P1 and P4. It has a
      preferred cleavage sequence of Asp-Xaa-Xaa-Asp-|-
  - reference_id: PMID:7596430
    supporting_text: This enzyme, named apopain, is composed of two subunits of relative molecular
      mass (M(r)) 17K and 12K that are derived from a common proenzyme identified as CPP32.
    reference_section_type: ABSTRACT
- description: As the principal executioner caspase, caspase-3 carries out the demolition phase of
    apoptosis by cleaving many cellular substrates (e.g., PARP1; ICAD/DFF45 to release the CAD/DFF40
    DNA-fragmentation nuclease; cytoskeletal, junctional and signaling proteins) and by driving
    phosphatidylserine exposure through cleavage of XKR scramblases and the ATP11C flippase.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0097194
    label: execution phase of apoptosis
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:18723680
    supporting_text: Caspase-3 was found to be generally more promiscuous than caspase-7 and appears
      to be the major executioner caspase during the demolition phase of apoptosis.
    reference_section_type: ABSTRACT
  - reference_id: PMID:22253444
    supporting_text: the main processing of pro-caspase-3 takes place in the cytosol of both cells
      lines analyzed even if caspase-3 active fragments can also be evidenced in the nuclear
      fractions after STP treatment
    reference_section_type: DISCUSSION
- description: CASP3 can cleave GSDME to generate a pore-forming fragment, converting apoptosis into
    lytic inflammatory death in cells expressing sufficient functional GSDME. This outcome is
    conditional rather than an obligatory consequence of CASP3 activation.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0140639
    label: positive regulation of pyroptotic inflammatory response
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:28459430
    supporting_text: Chemotherapy drugs induce pyroptosis through caspase-3 cleavage of a gasdermin.
    reference_section_type: TITLE
- description: Caspase-3 restrains innate immune and cytokine signaling by cleaving antiviral
    signaling proteins (cGAS, MAVS, IRF3) and NF-kB subunits (p65/RelA, RelB, c-Rel) and by
    processing cytokines such as IL-18, dampening cytokine production during apoptosis.
  molecular_function:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  directly_involved_in:
  - id: GO:0001818
    label: negative regulation of cytokine production
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:30878284
    supporting_text: Apoptotic Caspases Suppress Type I Interferon Production via the Cleavage of
      cGAS, MAVS, and IRF3.
    reference_section_type: TITLE
  - reference_id: PMID:36002459
    supporting_text: Apoptotic caspase inhibits innate immune signaling by cleaving NF-κBs in both
      Mammals and Flies.
    reference_section_type: TITLE
proposed_new_terms: []
suggested_questions:
- question: To what extent are caspase-3 non-apoptotic roles (erythroid/keratinocyte
    differentiation, synapse pruning, platelet formation) driven by spatially or temporally
    restricted sublethal caspase-3 activity, and can substrate repertoires be defined that
    distinguish lethal from non-lethal activation?
  experts:
  - Salvesen GS
  - Martin SJ
- question: Which GO_REF:0000107 ortholog-transferred stimulus/response and tissue terms on CASP3
    represent genuine direct roles versus over-propagation across the caspase family, and should
    questionable molecular-function transfers (aspartic-type endopeptidase, CDK inhibitor,
    phospholipase A2 activator) be removed upstream?
  experts:
  - Thornberry NA
suggested_experiments:
- hypothesis: Caspase-3 substrate cleavage during sublethal/non-apoptotic activation produces a
    distinct proteome from that during full apoptosis, explaining its differentiation roles.
  description: Perform N-terminomics (e.g., TAILS/subtiligase) on cells undergoing
    caspase-3-dependent differentiation versus apoptosis, with caspase-3 knockout and
    caspase-resistant substrate mutants as controls, to map the differentiation-specific cleavage
    repertoire.
  experiment_type: degradomics / N-terminomics
- hypothesis: The balance between caspase-3-driven apoptosis and GSDME-driven pyroptosis is set by
    GSDME abundance and caspase-3 activity kinetics.
  description: Titrate GSDME expression and caspase-3 activation kinetics in isogenic cell lines
    (including non-cleavable GSDME D270A) and quantify apoptosis versus pyroptosis outcomes and IL-1
    beta release.
  experiment_type: cell death pathway dissection
