  review:
    summary: "neuron differentiation: retain with the primary study's context and species limits."
    action: KEEP_AS_NON_CORE
    reason: 'The PAINT assertion traces to PANTHER:PTN002573018, with rat Casp3 experimental grounding.
      This is an inherited-node judgment, not a donor-count or pairwise-similarity test; no target-specific
      loss is inferred. The rat donor publication PMID:15248196 distinguishes active-caspase-3-positive
      proliferating/differentiating cerebellar cells from apoptotic cells. Independent PMID:16103108 goes
      beyond colocalization: caspase activity rises in nonapoptotic differentiating neuronal populations
      and peptide inhibition impairs neurosphere differentiation. The inhibitor experiment is not a caspase-3-specific
      genetic knockout, but together with the PAINT/conserved caspase context it supports a non-core neuronal
      differentiation role, not universal dependence of all neurons. The abstract does not specify the
      neurosphere species, so no direct human or mouse assay is invented.'
    supported_by:
    - reference_id: PMID:16103108
      supporting_text: peptide inhibition of protease activity effectively inhibits the
        differentiation process in a cultured neurosphere model.
    - reference_id: PMID:15248196
      supporting_text: Proliferative (Ki67-positive) and differentiated (TUJ1-positive) cells within
        the EGL exhibited a cytosolic expression of caspase-3
