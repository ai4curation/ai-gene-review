id: P36776
gene_symbol: LONP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LONP1 is the nuclear-encoded mitochondrial Lon protease, synthesized as a
  precursor and processed after import into the mitochondrial matrix. The
  canonical protein assembles into a homo-oligomeric ring-shaped AAA+ machine
  whose ATPase cycle recognizes, unfolds, and translocates selected misfolded,
  unassembled, oxidatively damaged, or short-lived proteins into a serine
  protease chamber for degradation. LONP1 also has a separable,
  protease-independent ATP-dependent chaperone activity that assists folding
  and suppresses aggregation of newly imported matrix and inner-membrane
  proteins, thereby supporting mitochondrial proteostasis and organization.
  Binding to single-stranded mitochondrial DNA and RNA is a genuine secondary
  property, but its physiological regulatory consequences remain incompletely
  defined. Isoforms 2 and 3 delete N-terminal sequence that overlaps or removes
  the canonical targeting region, so their mitochondrial localization and
  ability to execute the matrix protease and chaperone functions are not
  established.
