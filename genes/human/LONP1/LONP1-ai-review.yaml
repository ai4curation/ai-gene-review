core_functions:
- description: >-
    Homo-oligomeric LONP1 couples ATP-driven substrate recognition, unfolding,
    and translocation to serine-type endopeptidase activity, selectively
    degrading damaged, misfolded, unassembled, and regulatory proteins in the
    mitochondrial matrix. This is the principal mitochondrial protein-quality
    control and protein-catabolic activity of the canonical protein.
  molecular_function:
    id: GO:0004176
    label: ATP-dependent peptidase activity
  directly_involved_in:
  - id: GO:0035694
    label: mitochondrial protein catabolic process
  - id: GO:0006515
    label: protein quality control for misfolded or incompletely synthesized proteins
  - id: GO:0070407
    label: oxidation-dependent protein catabolic process
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:8248235
    supporting_text: >-
      A truncated LON gene, in which translation was initiated at Met118 of the coding sequence, was expressed in Escherichia coli and produced a protease that degraded alpha-casein in vitro in an ATP-dependent manner and had other properties similar to E. coli Lon protease.
  - reference_id: PMID:12198491
    supporting_text: >-
      Lon protease, an ATP-stimulated mitochondrial matrix protein, selectively recognizes and degrades the oxidized, hydrophobic form of aconitase after mild oxidative modification, but that severe oxidation results in aconitase aggregation, which makes it a poor substrate for Lon.
  - reference_id: PMID:14739292
    supporting_text: >-
      Eukaryotic Lon is a homo-oligomeric ring-shaped complex localized to the mitochondrial matrix.
  - reference_id: PMID:34050165
    supporting_text: >-
      We show that, like bacterial Lon, human LONP1 adopts both an open and closed spiral staircase orientation dictated by the presence of substrate and nucleotide.
  - reference_id: PMID:35870450
    supporting_text: >-
      Our data indicate how sequential ATP hydrolysis controls substrate protein translocation in a 6-fold binding change mechanism.
- description: >-
    LONP1 uses its AAA+ ATPase cycle as a protease-independent protein-folding
    chaperone, maintaining client solubility and cooperating with the mtHSP70
    system during biogenesis of newly imported mitochondrial proteins. This
    activity is mechanistically separable from peptide-bond hydrolysis and does
    not imply that LONP1, mtHSP70, and their partners form one stable obligate
    heteromeric complex.
  molecular_function:
    id: GO:0140662
    label: ATP-dependent protein folding chaperone
  directly_involved_in:
