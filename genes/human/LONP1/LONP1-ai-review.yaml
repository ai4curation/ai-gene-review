knowledge_gaps:
- gap_statement: >-
    The molecular features and regulatory states that direct a LONP1-bound
    client toward productive folding rather than ATP-coupled degradation are
    unknown.
  boundary: >-
    LONP1 has directly demonstrated ATP-dependent protease and
    protease-independent chaperone activities, and OXA1L can behave as a
    chaperone client in cells while being degraded by wild-type LONP1 in a
    minimal reconstitution. The unresolved point is how the intact mitochondrial
    system selects between these outcomes.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Defining this decision mechanism is necessary to distinguish physiological
    degradation substrates from folding clients and to interpret substrate-trap
    or aggregation datasets without conflating the two activities.
  resolution: >-
    Reconstitute client handling with wild-type and catalytic-separation mutants
    under controlled nucleotide, phosphorylation, co-chaperone, and client-state
    conditions, then measure folding, release, translocation, and cleavage in
    parallel.
  provenance:
  - reference_id: PMID:33431889
    supporting_text: >-
      We speculate that the interaction of LONP1 with folding substrates versus
      proteolytic substrates is normally controlled by regulatory mechanisms
      absent in our minimal in vitro system
- gap_statement: >-
    The causal physiological role of LONP1 binding to single-stranded mtDNA,
    promoter sequences, G-quadruplex-prone DNA, and GU-rich RNA remains
    unresolved.
  boundary: >-
    Direct biochemical and cellular evidence supports nucleic-acid binding and
    association with mitochondrial genome control regions. These findings do
    not yet establish whether nucleic-acid binding recruits particular protein
    substrates, regulates replication or transcription directly, or mainly
    tunes LONP1 activity within nucleoids.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Resolving this would determine whether nucleic-acid binding is a secondary
    targeting property or a distinct regulatory function with specific
    mitochondrial gene-expression process annotations.
  resolution: >-
    Compare nucleic-acid-binding-deficient, ATPase-deficient, and
    protease-deficient separation-of-function alleles in LONP1-null cells using
    mtDNA occupancy, replication, transcription, nucleoid dynamics, and
    substrate-turnover readouts.
- gap_statement: >-
    The subcellular localization, processing, oligomerization, and catalytic
    competence of LONP1 isoforms 2 and 3 are unknown.
  boundary: >-
    The canonical isoform contains an N-terminal mitochondrial transit peptide
    and functions in the matrix. Isoform 2 deletes residues 42-105, overlapping
    that targeting region, and isoform 3 deletes residues 1-196; no current
    human GOA source row establishes an isoform-specific localization or
    activity for either product.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Without isoform-resolved evidence, canonical matrix localization and the
    protease/chaperone model must not be propagated automatically to all three
    splice products.
  resolution: >-
    Express endogenously tagged isoforms at physiological levels and quantify
    import, processing, matrix protease protection, homo-oligomer assembly,
    ATPase, protease, and chaperone activity relative to isoform 1.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which client features and LONP1 regulatory states determine folding versus
    degradation in the mitochondrial matrix?
- question: >-
    Does nucleic-acid binding directly couple LONP1 proteolysis to mitochondrial
    replication or transcription, or does it primarily localize and regulate
    the protease within nucleoids?
- question: >-
    Are isoforms 2 and 3 imported into mitochondria and assembled into active
    LONP1 oligomers, or do their N-terminal deletions confer distinct
    localization and function?
suggested_experiments:
- hypothesis: >-
    Client conformation and nucleotide-dependent LONP1 state determine whether
    a bound protein is released in a folding-competent state or translocated for
    proteolysis.
  description: >-
    Reconstitute wild-type LONP1 with matched native, folding-intermediate,
    mildly oxidized, and aggregated forms of selected clients; quantify ATPase
    cycling, binding, release, folding, translocation, and cleavage using
    protease-dead and ATPase-dead controls and with or without the
    mtHSP70-DNAJA3-GRPEL1 system.
  experiment_type: biochemical fate-selection reconstitution
- hypothesis: >-
    LONP1 nucleic-acid binding controls local substrate turnover at
    mitochondrial nucleoids without being required for its general matrix
    protease activity.
  description: >-
    Rescue LONP1-null human cells with wild-type or nucleic-acid-binding-deficient
    separation-of-function variants and compare mtDNA/RNA occupancy, TFAM and
    TWNK turnover, mtDNA replication, transcription, and global matrix
    proteostasis.
  experiment_type: separation-of-function nucleoid analysis
- hypothesis: >-
    Isoforms 2 and 3 have reduced mitochondrial import because their N-terminal
    deletions disrupt the canonical targeting and processing sequence.
  description: >-
    Introduce isoform-specific tags at endogenous loci or express matched
    low-level constructs, then combine live-cell localization, mitochondrial
    fractionation, protease protection, N-terminomics, and oligomer-resolved
    native electrophoresis with protease and chaperone rescue assays.
  experiment_type: isoform-resolved localization and function
