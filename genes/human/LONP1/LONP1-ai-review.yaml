- id: PMID:12198491
  title: Lon protease preferentially degrades oxidized mitochondrial aconitase by
    an ATP-stimulated mechanism.
  full_text_unavailable: true
  findings:
  - statement: Human LONP1 selectively degrades mildly oxidized aconitase, whereas severe aggregation makes it a poor substrate.
    supporting_text: >-
      Lon protease, an ATP-stimulated mitochondrial matrix protein, selectively recognizes and degrades the oxidized, hydrophobic form of aconitase after mild oxidative modification, but that severe oxidation results in aconitase aggregation, which makes it a poor substrate for Lon.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human-cell substrate-selectivity and loss-of-function evidence for mitochondrial protein quality control.
- id: PMID:14739292
  title: DNA and RNA binding by the mitochondrial lon protease is regulated by nucleotide and protein substrate.
  full_text_unavailable: true
  findings:
  - statement: Human LONP1 is a mitochondrial-matrix homo-oligomer that binds GT-rich single-stranded mtDNA.
    supporting_text: >-
      Eukaryotic Lon is a homo-oligomeric ring-shaped complex localized to the mitochondrial matrix. In vitro, human Lon binds specifically to a single-stranded GT-rich DNA sequence overlapping the light strand promoter of human mitochondrial DNA (mtDNA).
    reference_section_type: ABSTRACT
  - statement: Human LONP1 co-immunoprecipitates with POLG and TWNK.
    supporting_text: >-
      Co-immunoprecipitation experiments show that Lon interacts with mtDNA polymerase gamma and the Twinkle helicase, which are components of mitochondrial nucleoids.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct human biochemical evidence for oligomerization, nucleic-acid binding, and nucleoid-protein interactions; binding partners are not thereby established as degradation substrates.
