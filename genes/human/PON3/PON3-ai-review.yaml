  label: Homo sapiens
description: 'PON3 is a secreted paraoxonase-family lactonase/arylesterase with low paraoxonase activity
  and stronger activity toward aromatic and bulky drug lactones, including statin lactones. It is closely
  related to HDL-associated PON1 and contrasts with the intracellular membrane-associated PON2 paralog.'
