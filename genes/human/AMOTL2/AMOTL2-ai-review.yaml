id: Q9Y2J4
gene_symbol: AMOTL2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AMOTL2 (angiomotin-like 2) is a peripheral membrane scaffold of the angiomotin family, with
  N-terminal PPxY motifs, a central coiled-coil domain and a C-terminal PDZ-binding motif. At epithelial
  junctions its p100 isoform forms a complex with E-cadherin that is linked to radial, contractile actin
  filaments, and its loss disturbs epithelial packing in cells, zebrafish and mouse. Through its PPxY
  motifs it binds the WW domains of the Hippo co-activators YAP1 and TAZ, holding them at tight junctions
  and in the cytoplasm, so that its loss releases YAP into the nucleus and relieves contact inhibition.
  It is also found at podosomes, including those that remodel the neuromuscular junction, and has roles
  in endothelial migration and angiogenesis.
