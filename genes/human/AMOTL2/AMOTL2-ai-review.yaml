  review:
    summary: Plasma membrane, inherited through the PANTHER node; AMOTL2 is a peripheral junctional membrane
      scaffold. Accepted.
    action: ACCEPT
    reason: AMOTL2 forms a complex with E-cadherin linked to radial actin filaments at epithelial junctions
      [PMID:28842668 "In this report we show that p100 amotL2 forms a complex with E-cadherin that associates
      with radial actin filaments connecting cells over multiple layers."], and its loss in cells, zebrafish
      and mouse disrupts these contractile filaments [PMID:28842668 "Genetic inactivation or depletion
      of amotL2 in epithelial cells in vitro or zebrafish and mouse in vivo, resulted in the loss of contractile
      actin filaments and perturbed epithelial packing geometry."].
