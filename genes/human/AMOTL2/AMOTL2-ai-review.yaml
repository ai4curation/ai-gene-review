- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A0A8I3QA39
  review:
    summary: Negative regulation of transcription by RNA polymerase II, by similarity. AMOTL2 limits YAP/TAZ-dependent
      transcription indirectly, by holding the co-activators in the cytoplasm; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: AMOTL2 binds YAP1 and TAZ through its N-terminal PPxY motifs and their WW domains [PMID:23911299
      "Here we demonstrate that AMOTL2 robustly co-immunoprecipitates with TAZ, and their interaction
      is dependent on the WW domain of TAZ and the PPXY motif in the N-terminus of AMOTL2."], [PMID:21187284
      "We demonstrate that AMOTL1 and AMOTL2 can regulate YAP1 cytoplasm-to-nucleus translocation through
      direct protein-protein interaction, which can occur independent of YAP1 phosphorylation status."],
      holding them at junctions and in the cytoplasm; its knockdown releases YAP into the nucleus [PMID:21205866
      "Knockdown of AMOT family protein AMOTL2 in polarized Madin-Darby canine kidney (MDCK) cells leads
      to YAP activation, as indicated by decreased YAP tight junction localization, attenuated YAP phosphorylation,
      accumulation of nuclear YAP, and induction of YAP target gene expression."]. Its effect on transcription
      is indirect [PMID:23911299 "we show that AMOTL2 colocalizes with TAZ in the cytoplasm of H441 human
      lung cells and regulates TAZ cytoplasm-to-nucleus translocation through direct protein-protein interaction."].
    supported_by:
    - reference_id: PMID:23911299
      supporting_text: Here we demonstrate that AMOTL2 robustly co-immunoprecipitates with TAZ, and their
        interaction is dependent on the WW domain of TAZ and the PPXY motif in the N-terminus of AMOTL2.
    - reference_id: PMID:21205866
      supporting_text: Knockdown of AMOT family protein AMOTL2 in polarized Madin-Darby canine kidney
        (MDCK) cells leads to YAP activation, as indicated by decreased YAP tight junction localization,
        attenuated YAP phosphorylation, accumulation of nuclear YAP, and induction of YAP target gene
        expression.
    - reference_id: PMID:23911299
      supporting_text: we show that AMOTL2 colocalizes with TAZ in the cytoplasm of H441 human lung cells
        and regulates TAZ cytoplasm-to-nucleus translocation through direct protein-protein interaction.
