suggested_questions:
- question: Does MAK regulate cilium length outside photoreceptors (e.g., in testis or in HPA-annotated
    basal bodies of cultured cells), or is its ciliary role photoreceptor-specific?
- question: Why does human retina immunostaining place MAK mainly in inner segments while mouse Mak is
    in the connecting cilium and outer-segment axoneme?
- question: Are the prostate-cancer AR coactivator and mitotic CDH1 functions relevant to normal physiology?
suggested_experiments:
- hypothesis: MAK phosphorylation of RP1 (and IFT/kinesin-2 substrates) controls photoreceptor axoneme
    length.
  description: Phosphoproteomics of wild-type versus MAK-null human iPSC-derived retinal organoids, with
    phosphosite mutant rescue scored by connecting-cilium and axoneme length.
  experiment_type: Organoid phosphoproteomics and rescue
- hypothesis: The retina-specific MAK isoform (exons 9 and 12) is required for ciliary localization.
  description: Compare localization and length-control activity of MAK isoforms in photoreceptor-like
    cells.
  experiment_type: Isoform-specific localization and rescue
