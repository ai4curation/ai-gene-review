id: P20794
gene_symbol: MAK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MAK (male germ cell-associated kinase) is a serine/threonine protein kinase of the RCK group
  of the CMGC family, closely related to CILK1 (ICK) and MOK. Like ICK, it is activated by dual phosphorylation
  of a TDY motif, through autophosphorylation and phosphorylation by CDK20 (CCRK). MAK is highly expressed
  in testis and in retinal photoreceptors. In photoreceptors it localizes to the connecting cilium and
  outer-segment axoneme (mouse) and to the inner segment (human), where it restrains ciliary length: Mak-null
  mouse photoreceptors have elongated cilia with accumulated IFT88/IFT57 and progressive degeneration,
  and MAK phosphorylates the axonemal protein RP1, whose overexpression-induced ciliary elongation MAK
  suppresses. Homozygous loss of the retina-specific MAK isoform (e.g., an exon 9 Alu insertion) causes
  autosomal recessive retinitis pigmentosa. In prostate cancer cells MAK has been reported to act as an
  androgen receptor coactivator and, during mitosis, to associate with spindle, centrosomes and midbody
  and phosphorylate CDH1/FZR1.'
