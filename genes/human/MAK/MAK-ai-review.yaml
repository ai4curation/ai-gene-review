      of Mak concentrates IFT components at connecting-cilium tips. Evidence is from the mouse ortholog
      (ISS); human retina immunostaining did not resolve a tip pool, and HPA calls basal body in cultured
      cells, so the tip location is best supported in photoreceptors.
