  supporting_entities:
  - InterPro:IPR006689
  review:
    summary: GTP binding (IEA, InterPro ARF family). In vitro-expressed ARL16 binds radiolabelled GTP,
      and the T37N mutant does not. Mutants restricted to the GTP-free form fail to bind RIG-I and lose
      their inhibitory function; accepted as its core molecular property.
    action: ACCEPT
    reason: '[PMID:21233210 "The results showed that, like ARF1 and ARL1, wild type of ARL16, T61N, and
      C81L expressed in vitro bound to P 32 -labeled GTP, but T37N did not"] [PMID:21233210 "ARL16 (T37N)
      and ARL16Δ45–54, which were restricted to the GTP-disassociated form, did not interact with RIG-I
      and also lost the inhibitory function."]'
    supported_by:
    - reference_id: PMID:21233210
      supporting_text: The results showed that, like ARF1 and ARL1, wild type of ARL16, T61N, and C81L
        expressed in vitro bound to P 32 -labeled GTP, but T37N did not
    - reference_id: PMID:21233210
      supporting_text: ARL16 (T37N) and ARL16Δ45–54, which were restricted to the GTP-disassociated form,
        did not interact with RIG-I and also lost the inhibitory function.
