    label: mitochondrion
  evidence_type: EXP
  original_reference_id: PMID:35196065
  qualifier: located_in
  review:
    summary: Mitochondrion (EXP). In RPE1 cells ARL16 co-localizes with the mitochondrial protein HSP60.
      The authors attribute this to a longer ARL16 variant, so it may be isoform-dependent. Kept as non-core,
      as its known functions are ciliary and RIG-I-related.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:35196065 "ARL16 also localized to both the cytosol and the mitochondria, as evidenced
      by its diffuse staining across the cell and colocalization with the mitochondrial protein HSP60,
      respectively (Supplemental Figure S2A)."] [PMID:35196065 "Because the endogenous staining of ARL16
      in RPE1 cells displays prominent mitochondrial localization, we believe that these cells express
      at least some of the longer form of ARL16."]'
    supported_by:
