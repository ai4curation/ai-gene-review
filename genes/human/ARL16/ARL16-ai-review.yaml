id: Q0P5N6
gene_symbol: ARL16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARL16 is a 173-residue Arf-family small GTPase, present since the last eukaryotic common
  ancestor, with an atypical G-3 motif. In its GTP-bound form it binds the C-terminal domain of the viral
  RNA sensor RIG-I and blocks RNA binding, restraining RIG-I-mediated interferon signalling. It localizes
  along the ciliary axoneme, in the cytosol and in mitochondria of RPE1 cells, and in the ciliary region
  and inner segment of human photoreceptors. In mouse cells it is needed for normal ciliogenesis and for
  export of IFT140 and INPP5E from the Golgi to cilia.
