suggested_questions:
- question: Which non-catalytic or regulatory contacts of this topoisomerase are reproducible direct functions rather than
    condition-specific interaction-screen hits or consequences of DNA damage and drug exposure?
suggested_experiments:
- description: Use endogenous degron or catalytic-tyrosine rescue alleles with locus-specific topological reporters and compartment-resolved
    imaging to separate direct DNA-relaxation functions from downstream transcriptional, stress-response and interaction phenotypes.
