id: Q969P6
gene_symbol: TOP1MT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TOP1MT encodes a mitochondrially targeted type IB DNA topoisomerase that uses the conserved ATP-independent single-strand
  breakage and rejoining mechanism to relax torsional stress in the circular mitochondrial genome. Its N-terminal targeting
  sequence sends the enzyme to mitochondria, where it acts at mitochondrial nucleoids during mtDNA replication and transcription
  rather than in the nuclear TOP1 compartments inherited by the ancestral family.
