- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:18448518
  qualifier: enables
  supporting_entities:
  - UniProtKB:P59595
  review:
    summary: Contextual association with SARS-CoV nucleocapsid.
    action: KEEP_AS_NON_CORE
    reason: The original study reports human EF1α–SARS-CoV nucleocapsid association by two-hybrid, coimmunoprecipitation,
      far-Western and surface plasmon resonance. Its Methods distinguish the human fetal-liver cDNA constructs
      from endogenous EF1α purified from 293T cells; the latter is not independently paralog-resolved.
      The curated Q05639 interaction records include the 291–463 target fragment. This positive pathogen-protein
      association is retained as contextual binding. The assays do not establish a normal host exogenous-protein-binding
      function or an autonomous antiviral activity. IntAct EBI-25498109, EBI-25498133, EBI-25498269, EBI-25498163,
      EBI-25498187, EBI-25498249, EBI-25498294, EBI-25506724, EBI-25506746, EBI-25566262. Reference-sequence
      ROGIDs match the official participant sequences; this is not an experimental-insert sequencing claim.
    supported_by:
    - reference_id: PMID:18448518
    - reference_id: file:human/EEF1A2/EEF1A2-bioinformatics/evidence/RESULTS.md
