core_functions:
- description: Delivers aminoacyl-tRNA to the ribosome during translational elongation. GTP binding and
    hydrolysis are parts of this delivery cycle rather than a separate signaling function.
  molecular_function:
    id: GO:0003746
    label: translation elongation factor activity
  directly_involved_in:
  - id: GO:0006414
    label: translational elongation
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: file:human/EEF1A2/EEF1A2-uniprot.txt
  - reference_id: PMID:36697828
- description: Binds PI4KB and increases its phosphatidylinositol 4-kinase activity. Direct activation
    is demonstrated with purified proteins and is supported by endogenous interaction and depletion experiments
    in MCF7 cells; its contribution in normal tissues remains to be established.
  molecular_function:
    id: GO:0098744
    label: 1-phosphatidylinositol 4-kinase activator activity
  directly_involved_in:
  - id: GO:0090218
    label: positive regulation of lipid kinase activity
  supported_by:
  - reference_id: PMID:17088255
suggested_questions:
- question: How much does endogenous EEF1A2-dependent PI4KB activation contribute to phosphoinositide
    metabolism in neurons, cardiomyocytes and skeletal muscle independently of translational elongation?
- question: Which EEF1A gene product supports the reported lysosomal chaperone-mediated autophagy mechanism,
    and under which cellular conditions?
suggested_experiments:
- description: Test endogenous EEF1A2 depletion and rescue in differentiated human cells, measuring PI4KB
    activity, phosphatidylinositol 4-phosphate and translation in parallel to separate the two functions.
- description: Use paralog-specific detection and selective depletion to identify the EEF1A protein associated
    with lysosomes and determine its contribution to chaperone-mediated autophagy.
