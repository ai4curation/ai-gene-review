- id: PMID:12426392
  title: Exp5 exports eEF1A via tRNA from nuclei and synergizes with other transport pathways to confine
    translation to the cytoplasm.
  findings:
  - statement: Human eEF1A2/S2 GFP constructs were cytoplasmic and excluded from nuclei under the tested
      conditions.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Methods, Results and captions were recovered from PMC137205 and read;
      no figure pixels. The preserved normal cache is abstract-only. The human construct is distinguished
      from endogenous antibody staining and the BHK host. Nuclear exclusion is assay-qualified, not universal.
- id: PMID:17088255
  title: Binding of elongation factor eEF1A2 to phosphatidylinositol 4-kinase beta stimulates lipid kinase
    activity and phosphatidylinositol 4-phosphate generation.
  findings:
  - statement: Purified human EEF1A2 binds and activates PI4KB, with supporting endogenous MCF7 interaction
      and depletion experiments.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The original Methods, Results and captions were read from indexed author-deposited paper
      text; no figure pixels. Purified-pair activation increases catalytic output, and PI4KB is a lipid
      kinase. The normal cache remains abstract-only. GO:0098744 matches the demonstrated activator function;
      it does not assign lipid kinase catalysis to EEF1A2.
- id: PMID:18448518
  title: The nucleocapsid protein of severe acute respiratory syndrome coronavirus inhibits cell cytokinesis
    and proliferation by interacting with translation elongation factor 1alpha.
  findings:
  - statement: SARS coronavirus nucleocapsid associates with EF1A, including a positive human EF1A cDNA
      fragment.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Selected full original Methods, Results and captions were read from PMC2446950. Human
      fetal-liver cDNA constructs and a 291–463 fragment are distinguished from endogenous EF1A purified
      from 293T cells, whose paralog identity was not independently resolved. Stable curated Q05639 pair
      records support the association; no infected-human physiological function is inferred.
- id: PMID:19559761
  title: Interaction of elongation factor 1-alpha with leucine-rich repeat kinase 2 impairs kinase activity
    and microtubule bundling in vitro.
  findings:
  - statement: LRRK2 associates with EF1A in the source-specific interaction assays.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete abstract and exact curated human IntAct pair/construct records were inspected;
      full original Methods were not recovered. The verified LRRK2 protein-serine/threonine kinase class
      supports a binding-class refinement, not autonomous kinase activity of EEF1A2.
- id: PMID:20797626
  title: Identification of regulators of chaperone-mediated autophagy.
  findings:
  - statement: Lysosome-associated EF1α participates in GFAP/LAMP2A regulation in the reported chaperone-mediated
      autophagy system.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Operative original Results, Discussion and Methods were read in the full cache. Rat
      liver/hepatocytes and mouse fibroblast experiments establish an EF1α mechanism, but the Discussion
      explicitly leaves the participating gene variant unresolved. The two imported human EEF1A2 annotations
      remain UNDECIDED for that identity question, not because the positive family-level mechanism is
      absent.
