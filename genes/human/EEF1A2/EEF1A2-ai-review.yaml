  review:
    summary: Association with thromboxane-A synthase TBXAS1.
    action: MODIFY
    reason: 'The curator-supported IPI row is matched to the positive IntAct anti-tag coimmunoprecipitation
      record and the BioPlex 2.0 filtered network: TBXAS1 (P24557) is bait and EEF1A2 is prey, with model
      interaction score 0.841854892390855. No reciprocal edge for this pair appears in the saved directed
      network. Independent reviewed partner evidence establishes the class represented by GO:0019899;
      this refines the existing association without assigning the partner activity or its regulation to
      EEF1A2. BioPlex used technical duplicates and peptide, abundance and background-frequency filters,
      but nonspecific recovery of an abundant elongation factor and indirect association remain possible.
      The spectra, prey-discriminating peptides and exact bait insert were not independently reanalysed.
      BioPlex 3.0 includes reanalysis of 2.0, so the two sources are not independent confirmation. Retain
      the class refinement at the evidential resolution of the imported association, without a native
      or direct-interface claim.'
