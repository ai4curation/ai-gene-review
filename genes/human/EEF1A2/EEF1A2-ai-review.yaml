id: Q05639
gene_symbol: EEF1A2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EEF1A2 is a cytoplasmic translation elongation factor expressed prominently in brain, heart
  and skeletal muscle. It uses a GTP-dependent cycle to deliver aminoacyl-tRNAs to the ribosomal A site
  during protein synthesis, including translation associated with the endoplasmic reticulum. EEF1A2 also
  binds and activates the lipid kinase PI4KB. Pathogenic variants cause neurodevelopmental disorders,
  frequently including epilepsy.
