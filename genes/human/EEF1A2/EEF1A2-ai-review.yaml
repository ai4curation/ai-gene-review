  qualifier: enables
  supporting_entities:
  - UniProtKB:Q5S007
  review:
    summary: Binding to the serine/threonine protein kinase LRRK2.
    action: MODIFY
    reason: The primary abstract reports LRRK2/EF1A coassociation and reduced LRRK2 kinase activity upon
      recombinant-protein co-incubation. The curated human Q05639–Q5S007 record specifies T7-tagged EEF1A2
      and GST-tagged LRRK2 residues 970–2527 with mutation features; complete original Methods were not
      recovered. LRRK2 is independently established as a serine/threonine protein kinase. The positive
      pair supports the informative partner-class term without assigning kinase activity to EEF1A2 or
      extrapolating inhibition to every cellular setting. IntAct EBI-6509067. Reference-sequence ROGIDs
      match the official participant sequences; this is not an experimental-insert sequencing claim.
    proposed_replacement_terms:
    - id: GO:0120283
      label: protein serine/threonine kinase binding
    supported_by:
    - reference_id: PMID:19559761
