- id: PMID:33070343
  title: Novel loss-of-function variants in DNAH17 cause multiple morphological abnormalities of the sperm
    flagella in humans and mice.
  findings:
  - statement: >-
      Dnah17-/- mice show MMAF with disorganized axonemes and impaired flagellar assembly in spermatids.
    supporting_text: >-
      Clusters of disorganized microtubules and outer dense fibers were observed in developing spermatids,
      indicating impaired sperm flagellar assembly.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Two consanguineous families with loss of DNAH17 protein, plus a Dnah17-/- mouse that
      reproduces MMAF; establishes functional causality.
- id: PMID:40009974
  title: Novel variants in DNAH17 cause sperm flagellar outer dynein arm defects but not total fertilization
