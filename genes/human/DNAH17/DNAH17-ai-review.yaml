- id: PMID:31178125
  title: Mutations in DNAH17, Encoding a Sperm-Specific Axonemal Outer Dynein Arm Heavy Chain, Cause Isolated
    Male Infertility Due to Asthenozoospermia.
  findings:
  - statement: >-
      Bi-allelic DNAH17 variants cause isolated male infertility with sperm ODA loss; DNAH17 and DNAH8
      are the ODA heavy chains of sperm but not respiratory cilia.
    supporting_text: >-
      By analyzing five male individuals who consulted for isolated infertility and displayed a loss of
      ODAs in their sperm cells but not in their respiratory cells, we identified bi-allelic mutations
      in DNAH17.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only (PMC6612517). Defining disease-gene paper for SPGF39; source of the GOA IDA rows.
- id: PMID:39503742
  title: DNAH3 deficiency causes flagellar inner dynein arm loss and male infertility in humans and mice.
  findings:
  - statement: >-
      DNAH17 is used as an ODA marker in human and mouse sperm flagella; it is unaffected by DNAH3 loss.
    supporting_text: >-
      DNAH8/DNAH17 and DNAI1, corresponding to the heavy and intermediate chains of ODAs
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
