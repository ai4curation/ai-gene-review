core_functions:
- description: >-
    Force-generating beta heavy chain of the sperm outer dynein arm. Together with the gamma chain DNAH8,
    DNAH17 hydrolyses ATP in its AAA1 site and moves towards microtubule minus ends, sliding doublet microtubules
    to power sperm flagellar beating. It is an essential structural subunit of the sperm ODA: without
    it the other ODA subunits do not accumulate, and men and mice lacking it have immotile, malformed
    sperm while motile cilia elsewhere are spared.
  molecular_function:
    id: GO:0008569
    label: minus-end-directed microtubule motor activity
  directly_involved_in:
  - id: GO:0030317
    label: flagellated sperm motility
  locations:
  - id: GO:0036126
    label: sperm flagellum
  - id: GO:0005930
    label: axoneme
  in_complex:
    id: GO:0036157
    label: outer dynein arm
  supported_by:
  - reference_id: PMID:31178125
    supporting_text: >-
      the outer dynein arms (ODAs), through ATPase activity of their heavy chains (HCs), play a major
      role for cilia and flagella beating
  - reference_id: PMID:31178125
    supporting_text: >-
      We show that DNAH17 and DNAH8, but not DNAH5, DNAH9, or DNAH11, colocalize with α-tubulin along
      the sperm axoneme, whereas the reverse picture is observed in respiratory cilia, thus explaining
      the phenotype restricted to sperm cells.
  - reference_id: PMID:31178125
    supporting_text: >-
      By analyzing five male individuals who consulted for isolated infertility and displayed a loss of
      ODAs in their sperm cells but not in their respiratory cells, we identified bi-allelic mutations
      in DNAH17.
  - reference_id: file:human/DNAH17/DNAH17-uniprot.txt
    supporting_text: >-
      Produces force towards the minus ends of microtubules
  - reference_id: PMID:33070343
    supporting_text: >-
      Similar to those found in patients, Dnah17-/- mice also displayed MMAF phenotype along with completely
      disorganized axonemal structures.
suggested_questions:
- question: >-
    Is DNAH17 truly absent from all multiciliated epithelia (airway, ependyma, oviduct) and from the embryonic
    node, and can the reported laterality-disorder variants be explained by a nodal role?
- question: >-
    Why do some DNAH17 genotypes give isolated asthenozoospermia with ODA loss but normal flagellar shape,
    while others give full MMAF with axonemal disorganization; does the protein have a structural role
    in flagellar assembly beyond the ODA?
- question: >-
    Is the association of DNAH17 deficiency with fertilization failure after ICSI a direct consequence
    of DNAH17 loss (e.g. via reduced PLCZ1) or an independent defect?
suggested_experiments:
- description: >-
    Cryo-electron tomography of Dnah17-/- and Dnah8-/- mouse sperm axonemes, and of patient sperm with
    missense alleles, to locate the beta and gamma heavy chains in the sperm ODA and to test their interdependence.
  experiment_type: cryo-electron tomography
- description: >-
    Examine Dnah17-/- mouse embryos for nodal cilia motility and situs defects, to test the candidate
    left-right asymmetry association.
  experiment_type: mouse genetics and live imaging of nodal cilia
