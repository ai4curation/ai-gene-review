- term:
    id: GO:0030317
    label: flagellated sperm motility
  evidence_type: IMP
  original_reference_id: PMID:31178125
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. Bi-allelic DNAH17 loss causes asthenozoospermia/MMAF with ODA loss in sperm,
      and Dnah17-/- mice reproduce MMAF.
    action: NEW
    reason: >-
      DNAH17 does part of the work of this process: it is a force-generating beta heavy chain of the sperm
      outer dynein arm, whose ATPase activity powers flagellar beating. Comparator check: other axonemal
      dynein heavy chains required in sperm (mouse Dnah1, Dnah7a, Dnah7b, Dnah7c, Dnah11) carry flagellated
      sperm motility in GOA. The term is more specific than the IBA cilium movement involved in cell motility
      and reflects the sperm restriction of DNAH17.
    supported_by:
    - reference_id: PMID:31178125
      supporting_text: >-
        By analyzing five male individuals who consulted for isolated infertility and displayed a loss
        of ODAs in their sperm cells but not in their respiratory cells, we identified bi-allelic mutations
        in DNAH17.
    - reference_id: PMID:31178125
      supporting_text: >-
        the outer dynein arms (ODAs), through ATPase activity of their heavy chains (HCs), play a major
        role for cilia and flagella beating
    - reference_id: PMID:33070343
      supporting_text: >-
        Similar to those found in patients, Dnah17-/- mice also displayed MMAF phenotype along with completely
        disorganized axonemal structures.
