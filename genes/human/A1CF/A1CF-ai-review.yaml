- id: PMID:10669759
  title: Molecular cloning of apobec-1 complementation factor, a novel RNA-binding
    protein involved in the editing of apolipoprotein B mRNA.
  findings:
  - statement: >-
      A1CF binds APOB mRNA and docks APOBEC1, providing the minimal noncatalytic
      RNA-targeting component needed to reconstitute APOB editing in vitro.
    supporting_text: >-
      ACF and apobec-1 comprise the minimal protein requirements for apo-B mRNA
      editing in vitro.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The PubMed-cached abstract directly supports APOB mRNA binding,
      A1CF-APOBEC1 complex formation, and substrate-docking activity.
- id: PMID:10781591
  title: Purification and molecular cloning of a novel essential component of the
    apolipoprotein B mRNA editing enzyme-complex.
  findings:
  - statement: >-
      Recombinant A1CF/ASP stimulates APOBEC1-dependent APOB RNA editing in a
      purified in-vitro system.
    supporting_text: >-
      Purified recombinant glutathione S-transferase (GST)-ASP, but not recombinant
      GST-KSRP, stimulated recombinant GST-APOBEC-1 to edit apoB RNA in vitro.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The abstract directly supports biochemical complementation and editing-complex
      membership, while the historical word "essential" is qualified by later genetics.
