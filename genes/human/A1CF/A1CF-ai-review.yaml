id: Q9NQ94
gene_symbol: A1CF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  A1CF (APOBEC1 complementation factor) is a three-RRM, nucleocytoplasmic
  RNA-binding protein that recognizes sequence-defined single-stranded RNA
  elements and regulates tissue-selective alternative splicing, including
  metabolic transcripts in hepatocytes and pancreatic beta
  cells. A1CF can also bind APOB RNA and recruit the catalytic deaminase APOBEC1
  within an APOB mRNA-editing complex, but this contribution is
  tissue- and substrate-dependent and partly redundant with RBM47 rather than
  universally required. A1CF-containing editosomes can protect edited APOB RNA
  from nonsense-mediated decay; in mouse Kupffer cells, A1cf also stabilizes IL6
  mRNA after partial hepatectomy. A1CF shuttles between the nucleoplasm and
  cytoplasm through a TNPO2-recognized nuclear-targeting sequence.
