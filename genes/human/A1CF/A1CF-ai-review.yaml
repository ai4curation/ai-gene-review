- id: PMID:28069890
  title: APOBEC1 complementation factor (A1CF) is dispensable for C-to-U RNA editing
    in vivo.
  findings:
  - statement: >-
      Conditional A1cf loss did not reduce APOBEC1-dependent editing in normal adult
      mouse liver, intestine, or kidney.
    supporting_text: >-
      Taken together, these observations demonstrate that A1CF does not act as the
      APOBEC1 complementation factor in vivo under normal physiological conditions
      and suggests new roles for A1CF, specifically within the male adult kidney.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text provides strong in-vivo counterevidence to the historical claim that
      A1CF is universally essential for editing.
- id: PMID:30309881
  title: Apobec1 complementation factor (A1CF) and RBM47 interact in tissue-specific
    regulation of C to U RNA editing in mouse intestine and liver.
  findings:
  - statement: >-
      A1CF and RBM47 make independent, partially redundant, tissue-specific
      contributions to APOBEC1 editing and site selection.
    supporting_text: >-
      These data suggest that A1CF and RBM47 each function independently, yet
      interact in a tissue-specific manner, to regulate the activity and site
      selection of APOBEC1 dependent C-to-U RNA editing.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text reconciles biochemical A1CF activity with single-knockout results
      and provides the preferred physiological calibration.
