suggested_questions:
- question: >-
    Which endogenous human transcripts are direct A1CF splicing targets in each
    A1CF-expressing tissue, and which effects are conserved between hepatocytes,
    beta cells, kidney, and intestine?
- question: >-
    Which RNA sequence, structure, binding position, and partner features determine
    whether A1CF regulates exon choice, stabilizes an mRNA, or presents it to
    APOBEC1 for editing?
- question: >-
    How do A1CF and RBM47 divide and compensate for endogenous APOBEC1-dependent
    editing targets across human tissues and physiological states?
- question: >-
    Do the six reported A1CF isoforms differ in abundance, localization, RNA-target
    selection, or splicing and editing activity?
suggested_experiments:
- hypothesis: >-
    A1CF directly controls distinct but partially overlapping alternative-splicing
    programs in human hepatocytes and pancreatic beta cells.
  description: >-
    Introduce an acute endogenous A1CF degron in matched human hepatocyte and beta-cell
    models, then combine time-resolved eCLIP with short- and long-read RNA sequencing.
    Rescue from the endogenous locus with wild-type A1CF or an RRM RNA-contact mutant
    to distinguish direct binding-dependent exon choices from secondary effects.
- hypothesis: >-
    A1CF and RBM47 have both redundant and substrate-selective roles in endogenous
    human APOBEC1 editing.
  description: >-
    Generate single and double A1CF/RBM47 perturbations in APOBEC1-expressing human
    intestinal and hepatic organoids, quantify editing transcriptome-wide with
    orthogonal targeted validation, and rescue each genotype at physiological protein
    levels. Measure protein abundance and RNA binding to separate compensation from
    intrinsic substrate preference.
- hypothesis: >-
    RNA structure and A1CF binding position determine whether a target is spliced,
    stabilized, or edited.
  description: >-
    Use massively parallel reporters spanning validated APOB, KHK, SLC7A2, and IL6
    elements with systematic sequence and structure perturbations, paired with A1CF
    occupancy measurements and biochemical editing, splicing, and half-life readouts.
