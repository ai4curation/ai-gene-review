  - statement: >-
      The exposed record implicates TET1 and APOBEC1 in mouse neuronal DNA
      demethylation but does not expose an A1CF-specific experiment.
    supporting_text: >-
      Furthermore, Tet1 and Apobec1 are involved in neuronal activity-induced,
