- id: PMID:24916387
  title: C to U RNA editing mediated by APOBEC1 requires RNA-binding protein RBM47.
  findings:
  - statement: >-
      RBM47 interacts with A1CF and can replace it as a stronger APOBEC1 editing
      cofactor, arguing against an universally essential A1CF role.
    supporting_text: >-
      RBM47 can substitute for A1CF and is necessary and sufficient for
      APOBEC1-mediated editing in vitro.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The abstract supplies important counterevidence that calibrates A1CF editing
      annotations as context-dependent rather than obligatory.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings:
  - statement: >-
      This proteome-scale binary-interaction map is the provenance for several A1CF
      interaction partners but does not establish an A1CF-specific mechanism.
    supporting_text: >-
      Here, we describe a systematic map of ?14,000 high-quality human binary
