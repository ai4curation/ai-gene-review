    interacts with both apobec-1 and apobec-1 complementation factor to modulate C
    to U editing.
  findings:
  - statement: >-
      SYNCRIP/GRY-RBP binds A1CF and inhibits A1CF-APOB RNA association and C-to-U
      editing in vitro.
    supporting_text: >-
      GRY-RBP binds to ACF and inhibits both the binding of ACF to apoB RNA and C to
      U RNA editing.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The cached abstract directly supports regulation of the A1CF editing complex;
      it is secondary to A1CF's defining RNA-binding activities.
- id: PMID:11871661
  title: Identification of domains in apobec-1 complementation factor required for
    RNA binding and apolipoprotein-B mRNA editing.
  findings:
  - statement: >-
      A1CF recognizes the APOB mooring region and binds single-stranded, but not
      double-stranded, APOB RNA with high affinity through all three RRMs and
      auxiliary residues.
    supporting_text: >-
      Here, we show that ACF binds with high affinity to single-stranded but not
      double-stranded apo-B mRNA.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The abstract directly establishes substrate discrimination and maps structural
      requirements for A1CF RNA binding and complementation.
- id: PMID:12881431
  title: The apolipoprotein B mRNA editing complex performs a multifunctional cycle
    and suppresses nonsense-mediated decay.
  findings:
  - statement: >-
      The APOBEC1-A1CF complex remains associated with edited APOB RNA, shields the
      transcript from NMD, and participates in nucleocytoplasmic transport.
    supporting_text: >-
      The APOBEC1-ACF complex edits and remains associated with the edited RNA to
      protect it from NMD.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text directly supports NMD protection and shuttling. It supports mRNA,
