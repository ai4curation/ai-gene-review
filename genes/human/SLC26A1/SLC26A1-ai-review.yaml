- id: PMID:30383413
  title: Absence of the sulfate transporter SAT-1 has no impact on oxalate handling by mouse intestine
    and does not cause hyperoxaluria or hyperoxalemia.
  findings:
  - statement: A second Slc26a1-knockout mouse line was profoundly hyposulfatemic but not hyperoxaluric;
      intestinal oxalate and sulfate fluxes were SAT-1-independent.
    supporting_text: Additionally, SAT-1-KO mice were neither hyperoxaluric nor hyperoxalemic.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mouse knockout; contradicts the oxalate phenotype of PMID:20160351.
- id: PMID:20160351
  title: Urolithiasis and hepatotoxicity are linked to the anion transporter Sat1 in mice.
  findings:
  - statement: The first Sat1-null mouse showed hyperoxaluria, hyperoxalemia, calcium oxalate stones,
      hypersulfaturia and hyposulfatemia.
    supporting_text: These mice exhibited hyperoxaluria with hyperoxalemia, nephrocalcinosis, and calcium
      oxalate stones in their renal tubules and bladder.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Mouse knockout; the oxalate phenotype was not reproduced by PMID:30383413.
- id: PMID:27210743
  title: Mutations in SLC26A1 Cause Nephrolithiasis.
  findings:
  - statement: Biallelic SLC26A1 variants in two calcium oxalate stone formers reduce transporter activity.
    supporting_text: We detected biallelic mutations in SLC26A1 (solute carrier family 26 member 1) in
      two unrelated individuals with calcium oxalate kidney stones.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
