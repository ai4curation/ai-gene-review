description: 'SLC26A1 (sulfate anion transporter 1, SAT1) is a member of the SLC26A/SulP anion transporter
  family: a 12-transmembrane, STAS-domain, sodium-independent and electroneutral anion exchanger that
  moves sulfate in exchange for oxalate, bicarbonate or thiosulfate, with chloride acting mainly as an
  allosteric activator. It is expressed most highly in kidney and liver and, in rodents, sits in the basolateral
  plasma membrane of renal proximal tubule, hepatocytes and intestinal epithelium. Its best-established
  physiological role is renal sulfate reabsorption: human and mouse loss of function causes urinary sulfate
  wasting and hyposulfatemia, and rare damaging variants lower plasma sulfate in the population. SLC26A1
  also transports oxalate, and biallelic variants have been reported in calcium oxalate stone formers,
  but whether it contributes materially to whole-body oxalate homeostasis is unresolved, since a second
  knockout mouse line was not hyperoxaluric.'
