  review:
    summary: 'Chloride:bicarbonate exchange is the canonical activity of several SLC26 paralogs (SLC26A3,
      SLC26A6), propagated here by phylogeny. Human SLC26A1 differs: chloride mainly activates sulfate
      exchange allosterically, and SLC26A1-associated chloride transport has divergent, partly DIDS-insensitive
      and cation-dependent properties; direct Cl-/HCO3- exchange has not been shown for SLC26A1.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Target-specific functional data (PMID:27125215) indicate SLC26A1 diverged from the Cl-/HCO3-
      exchanger clade activity; its supported exchange modes are sulfate/oxalate, sulfate/bicarbonate
      and sulfate/thiosulfate.
    supported_by:
    - *id012
    - *id004
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008330351
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Ancestral node carrying the Cl-/HCO3- exchange IBD. Node placement not re-examined here; the target-specific oocyte data (PMID:27125215) show divergent chloride handling and no demonstrated Cl-/HCO3- exchange by SLC26A1.
      - source_id: UniProtKB:Q9BXS9
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: SLC26A6 is a bona fide Cl-/HCO3- exchanger; its activity does not transfer to SLC26A1.
      - source_id: UniProtKB:O43511
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Pendrin (SLC26A4) Cl-/HCO3- exchange; paralog activity.
