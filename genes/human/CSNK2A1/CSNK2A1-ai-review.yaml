id: P68400
gene_symbol: CSNK2A1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CSNK2A1 encodes the catalytic alpha subunit of protein kinase CK2, a broadly expressed protein
  serine/threonine kinase that often recognizes acidic substrate sequences. It phosphorylates nuclear
  and cytosolic proteins, both as a catalytic subunit of alpha/beta CK2 assemblies and in alpha-subunit
  assays. Substrate phosphorylation regulates protein stability, DNA-damage signaling and repair, transcription-associated
  complexes, chaperone systems and translation. The outcome depends on the substrate and cellular context:
  CK2 can stabilize one protein while promoting degradation or inhibiting a regulatory interaction in
  another. The shorter N-terminally truncated product lacks part of the annotated kinase domain and has
  not been established as catalytically equivalent to the canonical product.'
