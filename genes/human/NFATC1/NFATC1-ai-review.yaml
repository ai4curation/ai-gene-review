- term:
    id: GO:0005528
    label: FK506 binding
  evidence_type: TAS
  original_reference_id: PMID:8702849
  qualifier: enables
  review:
    summary: 'TAS: FK506 binding, citing characterization of the NFATc.beta isoform.'
    action: REMOVE
    reason: NFATC1 does not bind FK506. FK506 binds FKBP12 (FKBP1A), and the FKBP12-FK506 complex inhibits calcineurin,
      which is why NFAT activation is FK506/CsA-sensitive. The cited paper shows only that NFATc.beta activity is
      CsA-sensitive, which reflects calcineurin dependence, not drug binding by NFATC1.
    supported_by:
    - reference_id: PMID:8702849
      supporting_text: Transient expression of NFATc.beta was capable of activating an interleukin-2 NFAT-driven
        reporter gene in stimulated Jurkat cells in a CsA-sensitive manner.
