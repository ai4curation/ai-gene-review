suggested_questions:
- question: Which NFATC1 isoforms (P1-driven inducible alpha-A versus P2-driven constitutive beta/B/C forms) carry
    the osteoclast, valve and T cell programs, and do the C-terminal TAD-B-containing long isoforms have distinct
    target sets?
- question: Should cooperative NFAT:AP-1 complexes on composite elements be represented in GO-CAM as NFATC1 activator
    activity with has_input/part_of links to the FOS/JUN activities, rather than via binding terms?
- question: Is the reported NFATC1-Dvl interaction and Wnt repression relevant in mammalian tissues, or restricted
    to the chick neural tube context in which it was characterized?
- question: Does NFATC1 directly repress replication-dependent histone genes in non-transformed human cells (as
    reported in MCF7 cells, PMID:38926604), and if so does it act as a sequence-specific repressor that would warrant
    negative regulation of transcription by RNA polymerase II (GO:0000122)?
- question: In chronically stimulated CD8+ T cells, which survival and exhaustion genes (e.g. TOX, BCL2L11/BCL2)
    are direct NFATC1/alphaA targets, and is this program AP-1 independent as proposed for NFAT-driven exhaustion?
suggested_experiments:
- description: Isoform-specific knockout or degron alleles of human NFATC1 in primary T cells and iPSC-derived osteoclasts,
    followed by CUT&RUN and RNA-seq, to separate direct targets of the inducible short isoform from the long isoforms.
- description: Genome-wide NFATC1 and JUN/FOS co-occupancy mapping with AP-1-binding-deficient NFATC1 mutants to
    quantify which NFATC1 target genes require cooperative AP-1 binding.
- description: NFATC1 knockout or degron in non-transformed human cells (e.g. primary endothelial cells or T cells)
    with calcineurin inhibitor and ionomycin controls, followed by CUT&RUN and nascent RNA profiling of the histone
    gene clusters, to test whether NFATC1 directly represses histone transcription.
