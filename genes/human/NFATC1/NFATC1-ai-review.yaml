gene_symbol: NFATC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'NFATC1 (NFATc1, NFAT2) is a calcium-regulated transcription factor of the NFAT family, with an N-terminal
  NFAT homology (regulatory) region carrying serine-rich phosphorylation motifs and the PxIxIT and LxVP calcineurin-docking
  sites, a central Rel homology DNA-binding domain that recognizes GGAA-core NFAT sites, and variable N- and C-terminal
  transactivation domains generated by alternative promoters and splicing. In resting cells NFATC1 is heavily phosphorylated
  and held in the cytoplasm. Receptor-triggered phospholipase C activity (for example PLCG1 downstream of the T
  cell antigen receptor) produces IP3 and store-operated Ca2+ entry; Ca2+/calmodulin-activated calcineurin docks
  on NFATC1 and dephosphorylates it, exposing its nuclear localization signal and driving nuclear import. Rephosphorylation
  by GSK3, CK1 and DYRK kinases returns it to the cytoplasm. In the nucleus NFATC1 binds DNA weakly as a monomer
  and acts mainly cooperatively with partners such as AP-1 (FOS/JUN) at composite elements, as well as with ATF/CREB
  bZIP factors, PU.1, MITF, GATA4 and others, to activate RNA polymerase II target genes. NFATC1 is pleiotropic:
  in T lymphocytes it drives activation-induced cytokine genes such as IL2 and IL4 and supports effector and memory
  responses (with an autoregulated inducible short isoform, NFATc1/alphaA, that is induced by chronic antigen stimulation
  and promotes survival of exhausted CD8+ T cells), and contributes to TH2 differentiation; downstream of RANKL it is the master transcriptional
  switch of osteoclast terminal differentiation (inducing genes such as cathepsin K); and in the endocardium it
  is required for semilunar heart valve formation. It also regulates gene expression in other cell types, including
  vascular smooth muscle and mesangial cells.'
