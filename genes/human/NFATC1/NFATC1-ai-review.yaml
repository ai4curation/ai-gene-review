  review:
    summary: 'Proposed NEW: NFATC1 is the master transcription factor of osteoclast terminal differentiation downstream
      of RANKL (mouse evidence, orthologous function).'
    action: NEW
    reason: 'Participation test: NFATC1 does the transcriptional work of the osteoclast differentiation program
      (it is induced by RANKL, activated by calcineurin, and directly activates osteoclast genes such as cathepsin
      K with PU.1 and MITF); it is not merely necessary, since ectopic NFATc1 drives differentiation without RANKL.
      Comparator: the partner lineage transcription factor SPI1 (PU.1) carries osteoclast differentiation (GO:0030316)
      in human GOA, so transcription factors that execute the program are conventionally annotated to it. Evidence
      is from mouse cells; the human gene is orthologous and the pathway conserved.'
