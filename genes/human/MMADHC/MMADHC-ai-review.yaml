- term:
    id: GO:0005759
    label: mitochondrial matrix
  evidence_type: IC
  original_reference_id: PMID:42709793
  qualifier: located_in
  review:
    summary: >-
      Proposed sub-compartment for the mitochondrial pool of MMADHC. This pool is linked to
      the adenosylcobalamin (AdoCbl) branch, but its molecular step there is undetermined.
    action: NEW
    reason: >-
      The existing mitochondrion annotations are correct but stop at the organelle.
      Several independent lines place the mitochondrial pool in the matrix: (1) an
      N-terminal mitochondrial targeting sequence (UniProt transit peptide 1-38; no
      predicted TM segment), whose deletion (MMADHC-deltaN38) leaves the protein almost
      exclusively cytosolic; (2) import depends on the proton motive force, the hallmark
      of presequence import across the inner membrane, and fails on depolarization;
      (3) MMADHC is turned over by the matrix protease LONP1 and accumulates in the
      mitochondrial fraction when LONP1 is inhibited; in mouse HSCs it is also turned
      over by the matrix-facing m-AAA protease AFG3L2. These three lines carry the
      location on their own. The pool is linked to the AdoCbl branch, whose enzymes MMAB
      and MMUT are matrix proteins, but no matrix-side partner or step has been shown (see
      the core-function knowledge gap), so that link is not used as evidence of location.
      No sub-mitochondrial fractionation or protease-protection assay has been reported,
      so this is a curator inference (IC) rather than IDA.
    supported_by:
    - reference_id: file:human/MMADHC/MMADHC-uniprot.txt
      supporting_text: Mitochondrion {ECO:0000269|PubMed:23270877}.
    - reference_id: PMID:18385497
      supporting_text: a putative cobalamin binding motif and a putative mitochondrial targeting
