  knowledge_gaps:
  - gap_statement: >-
      What the mitochondrial MMADHC pool does at the molecular level is undetermined: no
      matrix-side partner (MMAB, MMUT, MMAA) or matrix-localized carrier step has been
      demonstrated, so it is unknown whether the imported pool hands cobalamin into the
      AdoCbl pathway or mainly regulates the cytosol/mitochondrion partition as a turnover
      substrate.
    boundary: >-
      The N-terminally targeted form is required for the AdoCbl branch (null mutations
      N-terminal to Met116 cause isolated methylmalonic aciduria, and enhancing mitochondrial
      targeting raises AdoCbl at the expense of MeCbl). The imported pool reaches the matrix
      and is turned over by LONP1, and in mouse haematopoietic stem cells its accumulation on
      loss of Afg3l2 increases mitochondrial cobalamin import and AdoCbl. The only
      characterized interaction, with MMACHC, is cytosolic.
