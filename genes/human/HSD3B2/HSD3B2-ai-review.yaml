id: P26439
gene_symbol: HSD3B2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HSD3B2 is the adrenal and gonadal type-2 3beta-hydroxysteroid dehydrogenase/steroid Delta-isomerase.
  It sequentially oxidizes the 3beta-hydroxyl group with NAD+ and shifts the Delta5 double bond to Delta4,
  converting pregnenolone to progesterone, 17alpha-hydroxypregnenolone to 17alpha-hydroxyprogesterone,
  and DHEA to androstenedione. These reactions supply corticosteroid, progestin and androgen biosynthesis.
  HSD3B2 acts at endoplasmic-reticulum membranes and also associates with the mitochondrial inner membrane
  on the intermembrane-space side. It is highly expressed in adrenal cortex and gonads; damaging variants
  cause 3beta-hydroxysteroid dehydrogenase deficiency with impaired adrenal and sex-steroid synthesis.
