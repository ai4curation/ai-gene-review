  review:
    summary: Calcium ion binding (InterPro IEA from the EF-hand). The EF-hand loop is non-canonical, and
      ANKEF1's known interactions are calcium-independent; over-annotated.
    action: MARK_AS_OVER_ANNOTATED
    reason: A motif check finds [file:genes/human/ANKEF1/ANKEF1-bioinformatics/RESULTS.md "the ANKEF1
      EF-hand loop departs from the canonical calcium-binding pattern and lacks the Glu at position 12"],
      and UniProt annotates no calcium-binding residues. ANKEF1's N-DRC interactions occur independently
      of calcium [PMID:41460250 "We found that ANKEF1 interacts with DRC5/TCTE1 and DRC4/GAS8, two key
      components of the N-DRC, and these interactions occur independently of calcium regulation."]. Calcium
      binding has not been tested directly, so the IEA is likely, but not certainly, an over-extension
      of the domain signature.
