gene_symbol: ANKEF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKEF1 (ankyrin repeat and EF-hand domain-containing 1, also ANKRD5) is an axonemal protein
  with eight ankyrin repeats and a single, non-canonical EF-hand. It is highly expressed in the sperm
  tail, where it binds the nexin-dynein regulatory complex (N-DRC) subunits DRC4/GAS8 and DRC5/TCTE1 independently
  of calcium. Male mice lacking Ankef1 are infertile, with poorly motile sperm whose axonemal doublet
  microtubules are intact but structurally irregular, suggesting ANKEF1 helps the N-DRC stabilize adjacent
  doublets during beating. The zebrafish ortholog localizes to hair-cell kinocilia.
