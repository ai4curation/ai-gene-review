- term:
    id: GO:0030317
    label: flagellated sperm motility
  evidence_type: ISS
  original_reference_id: PMID:41460250
  qualifier: involved_in
  review:
    summary: Proposed. Ankef1 knockout mice have impaired sperm motility, with structurally unstable axonemal
      doublets.
    action: NEW
    reason: '[PMID:41460250 "Male Ankef1-/- mice exhibited impaired sperm motility and infertility."]
      ANKEF1 does part of the work, not just being necessary: without it the axonemal doublet microtubules
      lose structural consistency [PMID:41460250 "Cryo-electron tomography revealed a typical ''9 + 2''
      axoneme structure with intact DMTs in Ankef1 null sperm; however, the DMTs showed pronounced morphological
      variability and increased structural heterogeneity."], while energy metabolism is unaffected [PMID:41460250
      "Notably, ANKEF1 deficiency did not alter ATP levels, reactive oxygen species levels, or mitochondrial
      membrane potential."]. This places it in the axonemal machinery that produces motility. Comparator:
      the N-DRC subunit TCTE1 carries GO:0030317. Transferred to human by ISS from the mouse knockout.'
    supported_by:
    - reference_id: PMID:41460250
      supporting_text: Male Ankef1-/- mice exhibited impaired sperm motility and infertility.
    - reference_id: PMID:41460250
      supporting_text: Cryo-electron tomography revealed a typical '9 + 2' axoneme structure with intact
        DMTs in Ankef1 null sperm; however, the DMTs showed pronounced morphological variability and increased
        structural heterogeneity.
    - reference_id: PMID:41460250
      supporting_text: Notably, ANKEF1 deficiency did not alter ATP levels, reactive oxygen species levels,
        or mitochondrial membrane potential.
    - reference_id: PMID:41460250
      supporting_text: We found that ANKEF1 interacts with DRC5/TCTE1 and DRC4/GAS8, two key components
        of the N-DRC, and these interactions occur independently of calcium regulation.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: PMID:41460250
  title: ANKEF1 is a key axonemal component essential for murine sperm motility and male fertility.
  findings:
  - statement: ANKEF1 binds N-DRC subunits DRC4 and DRC5, calcium-independently.
    supporting_text: We found that ANKEF1 interacts with DRC5/TCTE1 and DRC4/GAS8, two key components
      of the N-DRC, and these interactions occur independently of calcium regulation.
  - statement: Ankef1 knockout males have impaired sperm motility and are infertile.
    supporting_text: Male Ankef1-/- mice exhibited impaired sperm motility and infertility.
  - statement: Knockout doublet microtubules are intact but structurally heterogeneous.
    supporting_text: Cryo-electron tomography revealed a typical '9 + 2' axoneme structure with intact
      DMTs in Ankef1 null sperm; however, the DMTs showed pronounced morphological variability and increased
      structural heterogeneity.
  - statement: ANKEF1 is in the sperm tail and fractionates with the axoneme.
    supporting_text: ANKEF1 was primarily enriched in the SDS-soluble fraction, suggesting its association
      with axonemal structures
  - statement: ANKEF1 loss does not change ATP, ROS or mitochondrial potential.
    supporting_text: Notably, ANKEF1 deficiency did not alter ATP levels, reactive oxygen species levels,
      or mitochondrial membrane potential.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text (eLife). Mouse knockout, cryo-ET and interaction mapping.
- id: PMID:37367482
  title: Regionalized Protein Localization Domains in the Zebrafish Hair Cell Kinocilium.
  findings:
  - statement: Zebrafish Ankef1a localizes to hair-cell kinocilia.
    supporting_text: We made transgenic fish that express fluorescently tagged versions of their proteins,
      demonstrating their localization to the kinocilia of zebrafish hair cells.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. Zebrafish transgenic localization.
