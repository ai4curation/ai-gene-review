- term:
    id: GO:0005930
    label: axoneme
  evidence_type: ISS
  original_reference_id: PMID:41460250
  qualifier: located_in
  review:
    summary: Proposed. ANKEF1 is an axonemal protein in mouse sperm.
    action: NEW
    reason: 'In mouse sperm, ANKEF1 is in the tail [PMID:41460250 "Western blot analysis revealed that
      ANKEF1 was predominantly localized to the sperm tail"] and fractionates with axonemal proteins [PMID:41460250
      "ANKEF1 was primarily enriched in the SDS-soluble fraction, suggesting its association with axonemal
      structures"]. It binds the N-DRC subunits DRC4/GAS8 and DRC5/TCTE1 [PMID:41460250 "We found that
      ANKEF1 interacts with DRC5/TCTE1 and DRC4/GAS8, two key components of the N-DRC, and these interactions
      occur independently of calcium regulation."]. The zebrafish ortholog localizes to hair-cell kinocilia
      [PMID:37367482 "We made transgenic fish that express fluorescently tagged versions of their proteins,
      demonstrating their localization to the kinocilia of zebrafish hair cells."]. Comparator: its N-DRC
      partner TCTE1 carries GO:0005930. Transferred to human by sequence similarity (ISS) from the mouse
      data.'
    supported_by:
    - reference_id: PMID:41460250
      supporting_text: Western blot analysis revealed that ANKEF1 was predominantly localized to the sperm
        tail
    - reference_id: PMID:41460250
      supporting_text: ANKEF1 was primarily enriched in the SDS-soluble fraction, suggesting its association
        with axonemal structures
    - reference_id: PMID:41460250
      supporting_text: We found that ANKEF1 interacts with DRC5/TCTE1 and DRC4/GAS8, two key components
        of the N-DRC, and these interactions occur independently of calcium regulation.
    - reference_id: PMID:37367482
      supporting_text: We made transgenic fish that express fluorescently tagged versions of their proteins,
