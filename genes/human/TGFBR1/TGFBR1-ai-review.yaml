id: P36897
gene_symbol: TGFBR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TGFBR1, also called ALK5, is the canonical type I transforming growth factor beta
  receptor. At the plasma membrane, TGFB ligands assemble TGFBR2 and TGFBR1 into an active receptor
  complex; TGFBR2 phosphorylates and activates the TGFBR1 GS domain, and TGFBR1 then phosphorylates
  SMAD2/3 and additional substrates. TGFBR1-dependent signaling regulates transcription,
  epithelial-mesenchymal transition, cell migration and receptor down-regulation in cell-specific
  contexts.
