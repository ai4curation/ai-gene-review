id: Q9UJU2
gene_symbol: LEF1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'LEF1 is a nuclear HMG-box TCF/LEF transcription factor that bends cis-regulatory
  DNA and couples Wnt-responsive enhancers to beta-catenin. Full-length LEF1 activates or
  represses RNA polymerase II transcription on chromatin depending on the recruited cofactor,
  while dominant-negative or context-specific isoforms tune Wnt target transcription in lymphoid,
  myeloid, endothelial, osteoblast, and cancer-cell settings.'
