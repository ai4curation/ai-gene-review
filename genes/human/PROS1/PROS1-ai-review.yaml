- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-159729
  qualifier: located_in
  review:
    summary: Golgi membrane reflects ER-to-Golgi transport of the secretory pro-protein, not a membrane location.
    action: MARK_AS_OVER_ANNOTATED
    reason: PROS1 is a soluble secreted plasma glycoprotein with a cleavable signal peptide and propeptide and no
      transmembrane segment or membrane anchor (UniProt topology). Reactome places the pro-protein in the ER and
      Golgi only while it is gamma-carboxylated, transported and furin-processed on its way out of the cell. That
      is biosynthetic transit of a secretory cargo, not residence, and a lumenal cargo is not a membrane protein;
      no direct localization evidence for the endogenous protein at this compartment exists.
    supported_by:
    - reference_id: Reactome:R-HSA-159729
      supporting_text: Gamma-carboxylated pro-protein S is transported from the endoplasmic reticulum to the Golgi
        apparatus
