core_functions:
- description: 'Non-enzymatic cofactor of activated protein C: bound to phosphatidylserine on cell membranes through
    its Gla domain, protein S enhances APC cleavage of factor Va at Arg306 and of factor VIIIa, limiting thrombin
    generation.'
  molecular_function:
    id: GO:0061133
    label: endopeptidase activator activity
  directly_involved_in:
  - id: GO:0030195
    label: negative regulation of blood coagulation
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  supported_by:
  - reference_id: PMID:20308596
    supporting_text: The protein S D95A had a severely impaired APC cofactor activity
  - reference_id: PMID:10959700
    supporting_text: In the FVa degradation, protein S selectively accelerates the cleavage at Arg306, having no
      effect on the Arg506 cleavage.
- description: 'Cofactor of tissue factor pathway inhibitor: protein S lowers the inhibition constant of TFPI for
    factor Xa about tenfold, enabling plasma TFPI to shut down tissue factor-initiated coagulation.'
  contributes_to_molecular_function:
    id: GO:0004867
    label: serine-type endopeptidase inhibitor activity
  directly_involved_in:
  - id: GO:0030195
    label: negative regulation of blood coagulation
  supported_by:
  - reference_id: PMID:16488980
    supporting_text: The stimulatory effect of protein S on FXa inhibition by TFPI is caused by a 10-fold reduction
      of the K(i) of the FXa/TFPI complex
- description: Ligand of the TAM receptor tyrosine kinases that bridges phosphatidylserine on apoptotic cells to
    phagocytes and promotes their engulfment.
  molecular_function:
    id: GO:0048018
    label: receptor ligand activity
  directly_involved_in:
  - id: GO:0043277
    label: apoptotic cell clearance
  supported_by:
  - reference_id: Reactome:R-HSA-202710
    supporting_text: The biological ligands for MerTK are two highly similar vitamin K-dependent proteins, Gas6
      and protein S (PS)
  - reference_id: PMID:12447359
    supporting_text: Protein S acted by binding to phosphatidylserine expressed on the apoptotic cell surface.
suggested_questions:
- question: Does protein S inhibit factor Va, factor Xa or factor IXa directly in plasma, independently of activated
    protein C and TFPI, or is the APC-independent activity of purified protein S explained by multimers?
- question: Should the UniProt FUNCTION text for P07225, which rests on APC-independent FVa/FXa inhibition, be updated
    to lead with the APC and TFPI cofactor activities?
- question: About 60-70% of plasma protein S circulates bound to the beta chain of C4b-binding protein, which abolishes
    its activated protein C cofactor activity. Should GO represent the protein S-C4BP complex (as a cellular component
    or complex term) so that this inactive pool can be annotated, given that no informative molecular function term
    covers protein S binding to C4BP?
suggested_experiments:
- description: Measure APC-independent anticoagulant activity of monomeric recombinant protein S in TFPI-depleted
    plasma, with and without FIXa-binding-site mutants, to separate direct protease inhibition from the two cofactor
    activities.
