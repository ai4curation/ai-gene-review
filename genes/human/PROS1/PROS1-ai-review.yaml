  review:
    summary: Calcium binding by the Gla and calcium-binding EGF-like domains is real but structural.
    action: KEEP_AS_NON_CORE
    reason: 'The InterPro mappings (EGF-like calcium-binding domains, Gla domain) are correct for PROS1: three of
      its four EGF-like domains are calcium-binding and its Gla domain binds calcium to adopt its membrane-binding
      conformation. Calcium binding stabilises the protein and enables membrane binding; it is a prerequisite for
      the cofactor functions rather than the function itself.'
