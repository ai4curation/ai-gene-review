id: P07225
gene_symbol: PROS1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Vitamin K-dependent protein S is a secreted plasma glycoprotein made mainly by liver and endothelium,
  with a pool stored in platelet alpha granules. It has an N-terminal Gla domain, a thrombin-sensitive region, four
  EGF-like domains and a C-terminal sex hormone-binding globulin-like region of two laminin G-type domains, and
  has no catalytic activity. Through its calcium-dependent Gla domain it binds phosphatidylserine on activated,
  damaged or apoptotic cell membranes. There it acts as a non-enzymatic anticoagulant cofactor: it enhances activated
  protein C cleavage of factor Va (selectively at Arg306) and factor VIIIa, and it lowers the inhibition constant
  of tissue factor pathway inhibitor for factor Xa about tenfold. About 60-70% of plasma protein S circulates bound
  to the beta chain of C4b-binding protein, which abolishes its activated protein C cofactor activity. Protein S
  is also a ligand for the TAM receptor tyrosine kinases TYRO3, AXL and MERTK, bridging phosphatidylserine on apoptotic
  cells to phagocytes to promote their clearance, and it can trigger TAM-dependent PI3K-Akt survival signalling.
  Inherited protein S deficiency causes venous thrombosis, and homozygous deficiency causes neonatal purpura fulminans.'
