suggested_questions:
- question: Is CEBPZOS in the inner or the outer mitochondrial membrane, and which
    terminus faces the intermembrane space?
- question: Does CEBPZOS associate with a respiratory chain complex, an assembly
    intermediate or another inner-membrane machine, as several other mitochondrial
    microproteins do? No such evidence was found.
- question: Is the rise in CEBPZOS protein after mtDNA depletion a specific response
    (for example, part of the mitochondrial integrated stress response) or a
    non-specific change?
suggested_experiments:
- description: Protease-protection and carbonate-extraction assays on isolated mitochondria
    and mitoplasts, using epitope tags at either terminus, to assign membrane and topology.
- description: Affinity purification or proximity labelling with tagged CEBPZOS, combined
    with blue-native PAGE, to identify partner complexes; then measure respiration and
    complex assembly in CEBPZOS-knockout human cells.
