- CEBPZ-AS1
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CEBPZOS (CEBPZ opposite strand) encodes an 80-amino-acid protein from a gene transcribed
  from the strand opposite CEBPZ; it is the canonical product of its own gene rather than
  an alternative reading frame of CEBPZ. The protein has a single predicted transmembrane
  helix near its N-terminus (residues 15-32) followed by a short hydrophilic C-terminal
  region, and no recognised domain outside its own family (InterPro CEBPZOS family). It is
  conserved across animals, with Drosophila CG42371 as its fly ortholog. CEBPZOS is a
  mitochondrial membrane protein: it was captured by proximity labelling from the
  mitochondrial intermembrane space and confirmed as mitochondrial by imaging or
  immunoblotting, and it is part of the high-confidence human mitochondrial proteome.
  Which mitochondrial membrane it occupies and its topology have not been resolved. Its
  molecular function is unknown. Its abundance rises when mitochondrial DNA is depleted
  in cultured human cells, and flies lacking CG42371 develop normally on standard food
  but show reduced viability on high-salt or high-fat diets.
