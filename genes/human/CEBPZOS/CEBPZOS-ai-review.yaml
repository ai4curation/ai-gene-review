  review:
    summary: >-
      CEBPZOS (as A8MTT3) was detected in the ratiometric IMS-APEX proteome of HEK293T
      cells and was one of nine previously non-mitochondrial proteins validated as
      mitochondrial by imaging or western blotting. Labelling by IMS-targeted APEX places a
      segment of the protein in the intermembrane space; with a single predicted
      transmembrane helix this fits an integral mitochondrial membrane protein.
    action: ACCEPT
    reason: >-
      Best available localization evidence and the appropriate level of specificity. The
      data do not distinguish inner from outer membrane, so a more specific term is not
      justified.
