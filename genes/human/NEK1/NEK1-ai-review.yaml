  title: 'Focused Primary-Evidence Audit: Human NEK1 (Q96PY6) Uncertain Claims for GO Curation'
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Secondary research report with explicit incomplete full-text inspection. Correctly
      distinguishes ATR priming from direct Thr1989 phosphorylation and flags the RAD54 dispute,
      but overstates direct NEK1-CFAP410 binding despite the primary authors explicitly leaving directness
      unproved. Its all-stages localization and old-artifact framing overlook the observed axonemal
      pool and human localization evidence; its claim of an S572 discussion in PMID:37439356 was
      not found in the cached full text. Primary-source conclusions govern this review; see notes
      for corrections.
  findings: []
