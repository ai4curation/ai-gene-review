- id: PMID:27264870
  title: Nek1 Regulates Rad54 to Orchestrate Homologous Recombination and Replication Fork Stability.
  findings:
  - statement: The original study reports NEK1 phosphorylation of RAD54 Ser572 as a mechanism promoting
      homologous recombination.
    supporting_text: 'We show that human Nek1 regulates homologous

      recombination (HR) by phosphorylating Rad54 at Ser572 in late G2 phase.'
    finding_review:
      finding_status: DISPUTED
      review_notes: The 2023 NEK1-CFAP410 study explicitly notes a challenge to RAD54 as a NEK1 substrate
        in a 2022 preprint. This is a reported unresolved challenge, not an established refutation;
        the specific substrate assignment is not used as a settled core mechanism. A subsequent December
        2025 preprint (DOI:10.64898/2025.12.19.695536; bioRxiv metadata checked 2026-09-13, not linked
        to a published version) reports genetic support for NEK1-dependent RAD54 Ser572 function
        in adult mice, with embryonic cells instead using NEK3/NEK5. This counters a blanket refutation
        but does not settle the physiological human substrate assignment; its full text was inaccessible
        during this audit, so only the provider abstract was assessed.
      supported_by:
      - reference_id: PMID:37188479
        supporting_text: 'However, RAD54 as a NEK1 target has been challenged recently (Ghosh et
          al, 2022

          Preprint).'
