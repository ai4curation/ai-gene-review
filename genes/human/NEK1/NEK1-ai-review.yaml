- term:
    id: GO:0005930
    label: axoneme
  evidence_type: IDA
  original_reference_id: PMID:42265085
  review:
    action: NEW
    summary: NEK1 is detected along the ciliary axoneme in serum-starved human RPE1 cells.
    reason: Ultrastructure expansion microscopy of endogenous NEK1 in RPE1 cells after 48 hours of
      serum starvation detects an axonemal pool. In this same setting the basal-body signal is depleted.
