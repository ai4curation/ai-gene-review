suggested_questions:
- question: Which endogenous NEK1 substrates drive primary-cilium assembly, and does CFAP410 regulate
    substrate access, localization, stability, or catalytic output?
- question: Which phosphorylation events mediate NEK1-dependent homologous recombination, given disagreement
    over RAD54 Ser572 as a NEK1 substrate?
- question: How do ALS-associated and skeletal-ciliopathy variants differentially affect NEK1 kinase
    activity, CFAP410 association, ciliogenesis, and DNA repair?
- question: Do endogenous phosphorylation of alpha-tubulin or importin-beta1 and the relevant phosphosites
    mediate NEK1-dependent microtubule homeostasis and nuclear import in human motor neurons?
- question: Does basal-body NEK1 disappear by degradation or redistribution into the ciliary axoneme
    during ciliogenesis, and what does CEP78 regulate in this transition?
suggested_experiments:
- description: Compare endogenous phosphoproteomes of NEK1-null human ciliated cells rescued at matched
    expression with wild-type, kinase-inactive, and CFAP410-binding-defective NEK1, followed by direct
    substrate assays and ciliary rescue tests.
- description: Measure endogenous RAD54 Ser572 phosphorylation by targeted mass spectrometry after
    irradiation in synchronized NEK1-null and rescued cells, alongside HR reporter activity and RAD51-focus
    clearance.
