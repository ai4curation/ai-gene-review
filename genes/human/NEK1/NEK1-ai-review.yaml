id: Q96PY6
gene_symbol: NEK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NEK1 is a NIMA-related serine/threonine protein kinase with an N-terminal catalytic
  domain and an extended regulatory region. It forms a stable cellular complex with CFAP410 (C21ORF2)
  and acts in primary-cilium assembly and genome maintenance. NEK1 kinase activity limits centriole
  microtubule elongation through a pathway operating alongside CP110-CEP97, and is required for normal
  ciliogenesis, while nuclear and cytoplasmic pools support DNA-damage checkpoint signaling and homologous-recombination
  repair. NEK1 helps maintain the ATR-ATRIP signaling complex and also phosphorylates VDAC1 in a
  mitochondrial-associated pathway that limits injury-induced cell death. In human motor-neuron models,
  NEK1 loss also perturbs microtubule homeostasis and nuclear import. Biallelic loss of function
  causes skeletal ciliopathies, and other NEK1 variants confer susceptibility to amyotrophic lateral
  sclerosis.
