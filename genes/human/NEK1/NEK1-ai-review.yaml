- term:
    id: GO:1903723
    label: negative regulation of centriole elongation
  evidence_type: IMP
  original_reference_id: PMID:42265085
  review:
    action: NEW
    summary: NEK1 kinase activity restricts centriolar microtubule elongation.
    reason: Human-cell NEK1 knockout and acute degradation produce hyperelongated centriolar microtubules.
      Wild-type rescue restores control, whereas kinase-dead NEK1 fails to restore it fully. The
      kinase-dead phenotype is milder than the knockout phenotype, so a noncatalytic contribution
      remains possible. The phenotype occurs with CP110-Cep97 still present and is enhanced by CP110
      co-depletion, supporting a parallel length-control mechanism rather than assigning NEK1 as
      a CP110-Cep97 subunit.
    supported_by:
    - reference_id: PMID:42265085
      supporting_text: 'Loss of Nek1 induces pronounced centriolar

        microtubule hyperelongation without displacement of the CP110-Cep97 complex,

        indicating that Nek1 restricts centriole extension through a distinct mechanism.'
    - reference_id: PMID:42265085
      supporting_text: we cannot exclude that the kinase-independent function of Nek1 is also involved.
