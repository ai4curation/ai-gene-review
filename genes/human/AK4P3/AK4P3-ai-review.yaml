- id: PMID:11485571
  title: Structure and expression of human mitochondrial adenylate kinase targeted to the mitochondrial
    matrix.
  findings:
  - statement: Overexpressed AK3, but not AK4, gave GTP:AMP phosphotransferase activity and complemented
      a temperature-sensitive E. coli adenylate kinase mutant.
    supporting_text: Over expression of AK3, but not AK4
- id: PMID:19130895
  title: Enzymatically inactive adenylate kinase 4 interacts with mitochondrial ADP/ATP translocase.
  findings:
  - statement: AK4 is inactive as an adenylate kinase in vitro because Gln159 replaces a conserved
      active-site arginine; Q159R restores activity with GTP.
    supporting_text: Mutation of the glutamine residue to arginine (Q159R) restored the adenylate kinase
      activity
- id: PMID:19766732
  title: Evidence of an intact N-terminal translocation sequence of human mitochondrial adenylate kinase
    4.
  findings:
  - statement: Recombinant AK4 phosphorylated AMP, dAMP, CMP and dCMP with ATP or GTP as donors, contrary
      to the earlier reports of no activity.
    supporting_text: The enzyme catalyzed the phosphorylation of AMP, dAMP, CMP and dCMP with ATP or GTP
      as phosphate donors
- id: PMID:33971925
  title: Long-read cDNA sequencing identifies functional pseudogenes in the human transcriptome.
  findings:
  - statement: AK4P3 is one of four spliced pseudogenes whose intact ORFs were amplified from human cDNA
      and cloned - so the locus is genuinely transcribed, not merely predicted.
    supporting_text: we amplified the 5′ exons and coding sequence of four spliced pseudogenes with intact
      ORFs (HMGB1P1, AK4P3, IFITM3P2 and RPL13AP20) and cloned them into a vector with a C-terminus 3XHA
      tag
  - statement: 'The AK4P3 ORF is translation-competent: a tagged construct produced detectable protein
      in HEK293T cells.'
    supporting_text: Transfection into HEK293T cells resulted in clear translation of the HMGB1P1 and
      AK4P3 transcripts
  - statement: The figure legend states the result plainly, and equally plainly scopes it to cultured
      cells rather than endogenous expression.
    supporting_text: HMGB1P1 and AK4P3 are translated when expressed in cultured cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text cached. The only AK4P3-specific experimental paper found, and it is in no
      GO annotation on this gene. It is what moves the locus from ''predicted ORF'' to ''transcribed and
      translation-competent'', which is the single most decision-relevant fact available. Note carefully
      what it does not show: the translation was from a transfected construct, so endogenous protein production
      remains unproven, and no activity was assayed.'
- id: file:genes/human/AK4P3/AK4P3-bioinformatics/RESULTS.md
  title: Is human AK4P3 an over-annotated pseudogene, or a functional AK4 duplicate?
  findings:
  - statement: The AK4P3 ORF is 99.1% identical to AK4, differing at two conservative positions.
    supporting_text: '| Identity to AK4 | **221/223 (99.1%)** |'
  - statement: The catalytic Walker A P-loop is intact and at the same position in both.
    supporting_text: '| Catalytic P-loop (Walker A) | `GPPGSGK` at position 12 — **intact in both** |'
  - statement: Nothing in the protein sequence marks this locus as pseudogenised.
    supporting_text: The sequence gives no evidence of pseudogenisation at the protein level.
  - statement: Two fully tryptic peptides are unique to AK4P3, so the PE=1 protein-level claim is in principle
      attributable rather than necessarily a paralog misassignment.
    supporting_text: '**The PE=1 is checkable, which is the useful part.**'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Analysis written for this review; script, raw output and limitations are in genes/human/AK4P3/AK4P3-bioinformatics/.
      Sequences are fetched live from the UniProt REST API and the comparison and tryptic digest are computed,
      so nothing is hardcoded. Its most useful result is the negative one: there is no sequence-level
      evidence of pseudogenisation, so the automatic annotations are not misfiring on a decayed relic
      the way they would for a frameshifted remnant. Its limitations are stated in the file - it says
      nothing about the genomic context on which HGNC''s pseudogene call presumably rests, and an intact
      active site is not evidence of activity.'
- id: file:genes/human/AK4P3/AK4P3-uniprot.txt
  title: UniProtKB A0A8I5KW96 (AK4P3, unreviewed) flat file
  findings:
  - statement: UniProt assigns protein-existence level 1, evidence at protein level, to this unreviewed
      entry.
    record_section: [PE]
    supporting_text: 'PE   1: Evidence at protein level;'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Machine-fetched UniProt record, unreviewed (TrEMBL). Its functional content is applied
      by HAMAP-Rule MF_03170, which is a sequence rule rather than curation of this protein, and that
      rule is the proximate source of most of the GO annotations under review. The PE=1 is cross-referenced
      to PeptideAtlas.
- id: file:genes/human/AK4P3/AK4P3-deep-research-falcon.md
  title: Falcon deep research report for human AK4P3
  findings:
  - statement: The report's summary verdict, which this review adopts.
    supporting_text: Human transcribed AK4-related pseudogene with an intact, translation-competent ORF;
      putative adenylate-kinase-family protein whose catalytic function and localization remain unvalidated.
  - statement: It states precisely what the transcription evidence does not establish.
    supporting_text: It does **not** establish endogenous protein production, enzymatic activity, substrate
      specificity, mitochondrial localization, pathway membership, disease causality, or physiological
      function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Fallback provider: affinage has no record for this locus at all, which is consistent
      with its human protein-coding gene set excluding pseudogenes. Falcon handled the nomenclature trap
      well - it separated AK4P3 from canonical AK4/AK3L1 explicitly, warned that the AK4 literature cannot
      be reassigned, and surfaced PMID:33971925, which is the paper this review turns on and which no
      GO annotation cites. Its citation keys are internal rather than PMIDs, so it is cited here for its
      assessment of the evidence state, which is checkable against the file, with the biology anchored
      to the PMID.'
core_functions:
- description: 'Predicted mitochondrial nucleoside phosphate kinase of the AK4 type, recorded as a projection
    rather than an observation. If the AK4P3 ORF is translated endogenously, its product should behave
    like AK4: it is 99.1% identical, retains the Walker A P-loop and the targeting information, and also
    keeps Gln159, the residue that makes AK4 inactive as an adenylate kinase in one set of assays. Whether
    AK4 itself is an AMP kinase is contested (no activity in vitro in two studies, AMP phosphorylation
    with ATP or GTP in a third), so this entry does not assert AMP kinase activity. It asserts the nucleoside
    diphosphate kinase activity that PAINT places on the AK4 clade, seeded by AK4 itself, and the matrix
    location AK4 shares with AK3. Two further caveats travel with it. The locus is transcribed and its
    ORF is translation-competent from a transfected construct, but endogenous protein has not been demonstrated;
    and no AK4P3 protein has ever been assayed, so every function here is inherited from AK4 rather than
    measured.'
  molecular_function:
    id: GO:0004550
    label: nucleoside diphosphate kinase activity
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  knowledge_gaps:
  - gap_statement: Whether the AK4P3 locus yields endogenous protein, and whether that protein has any
      adenylate kinase activity, is undetermined. No AK4P3 protein has been purified or assayed, and the
      only demonstration of translation is from a transfected 3xHA construct in HEK293T cells, not from
      the endogenous locus. Every molecular function, process and location on this gene is therefore projected
      from AK4 (P27144) rather than measured for this gene product.
    boundary: 'What IS established: the locus is transcribed, with a spliced transcript recovered from
      human RNA by long-read sequencing; its ORF is intact, full length, and translation-competent when
      expressed ectopically; and the encoded sequence is 99.1% identical to AK4 with the Walker A P-loop
      conserved at the same position. So the gap is not ''is this a decayed pseudogene'' - the sequence
      answers that - but ''is the protein made, and does it work''.'
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    provenance:
    - reference_id: PMID:33971925
      supporting_text: Transfection into HEK293T cells resulted in clear translation of the HMGB1P1 and
        AK4P3 transcripts
    - reference_id: file:genes/human/AK4P3/AK4P3-bioinformatics/RESULTS.md
      supporting_text: The sequence gives no evidence of pseudogenisation at the protein level.
    - reference_id: file:genes/human/AK4P3/AK4P3-deep-research-falcon.md
      supporting_text: It does **not** establish endogenous protein production, enzymatic activity, substrate
        specificity, mitochondrial localization, pathway membership, disease causality, or physiological
        function.
  supported_by:
  - reference_id: file:genes/human/AK4P3/AK4P3-bioinformatics/RESULTS.md
    supporting_text: '| Residue 159 (AK4''s inactivating Gln) | `Q` in both'
  - reference_id: PMID:19130895
    supporting_text: Mutation of the glutamine residue to arginine (Q159R) restored the adenylate kinase
      activity
  - reference_id: PMID:19766732
