      MF_03170, InterPro2GO and PANTHER - on similarity to genuine human AK4 (P27144), which is itself
      a well-characterised enzyme carrying IDA and EXP evidence for these activities. So the question
      is not whether the terms describe AK4: they do. It is whether they should be asserted of this locus.
      Two lines settle more of that than one might expect. A sequence analysis run for this review finds
      the ORF near-identical to AK4 [file:genes/human/AK4P3/AK4P3-bioinformatics/RESULTS.md "| Identity
