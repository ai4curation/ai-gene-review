- term:
    id: GO:0004550
    label: nucleoside diphosphate kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002764060
  - UniProtKB:P27144
  review:
    summary: Nucleoside diphosphate kinase activity, inherited through the PANTHER node with human AK4
      among the donors - the very gene this locus duplicates.
    action: ACCEPT
    reason: 'Context for the whole gene. HGNC names this locus ''adenylate kinase 4 pseudogene 3'' with
      locus_type pseudogene, while Ensembl gives the same locus biotype protein_coding and UniProt lists
      it unreviewed at [file:genes/human/AK4P3/AK4P3-uniprot.txt "PE   1: Evidence at protein level;"].
      All 19 of its GO annotations are IEA or IBA, applied by automatic pipelines - chiefly HAMAP-Rule
      MF_03170, InterPro2GO and PANTHER - on similarity to genuine human AK4 (P27144), which is itself
      a well-characterised enzyme carrying IDA and EXP evidence for these activities. So the question
      is not whether the terms describe AK4: they do. It is whether they should be asserted of this locus.
      Two lines settle more of that than one might expect. A sequence analysis run for this review finds
      the ORF near-identical to AK4 [file:genes/human/AK4P3/AK4P3-bioinformatics/RESULTS.md "| Identity
      to AK4 | **221/223 (99.1%)** |"] with the catalytic machinery intact [file:genes/human/AK4P3/AK4P3-bioinformatics/RESULTS.md
      "| Catalytic P-loop (Walker A) | `GPPGSGK` at position 12 — **intact in both** |"], so [file:genes/human/AK4P3/AK4P3-bioinformatics/RESULTS.md
      "The sequence gives no evidence of pseudogenisation at the protein level."] And the locus is genuinely
      transcribed and its ORF is translation-competent: long-read sequencing recovered the spliced transcript
      from human RNA [PMID:33971925 "we amplified the 5′ exons and coding sequence of four spliced pseudogenes
      with intact ORFs (HMGB1P1, AK4P3, IFITM3P2 and RPL13AP20) and cloned them into a vector with a C-terminus
      3XHA tag"] and [PMID:33971925 "Transfection into HEK293T cells resulted in clear translation of
      the HMGB1P1 and AK4P3 transcripts"]. What is NOT shown anywhere is endogenous protein production
      or any assay of this protein''s activity [file:genes/human/AK4P3/AK4P3-deep-research-falcon.md "It
      does **not** establish endogenous protein production, enzymatic activity, substrate specificity,
      mitochondrial localization, pathway membership, disease causality, or physiological function."].
      This row asserts a specific catalytic activity. No AK4P3 protein has ever been assayed, so the assertion
      rests entirely on 99.1% identity to an enzyme that has been. That is ordinary ISS-grade reasoning
      and it is not being disputed here, but the caveat belongs on the row: the activity is inferred,
      not measured, for this gene product. The donor here is P27144 itself, which holds an IDA for this
      term, so the node placement is sound and the transfer is to a near-identical sequence.'
    additional_reference_ids:
    - PMID:33971925
    - file:genes/human/AK4P3/AK4P3-bioinformatics/RESULTS.md
    - file:genes/human/AK4P3/AK4P3-uniprot.txt
    supported_by:
    - reference_id: file:genes/human/AK4P3/AK4P3-bioinformatics/RESULTS.md
      supporting_text: '| Identity to AK4 | **221/223 (99.1%)** |'
    - reference_id: file:genes/human/AK4P3/AK4P3-bioinformatics/RESULTS.md
      supporting_text: '| Catalytic P-loop (Walker A) | `GPPGSGK` at position 12 — **intact in both**
        |'
    - reference_id: PMID:33971925
      supporting_text: Transfection into HEK293T cells resulted in clear translation of the HMGB1P1 and
        AK4P3 transcripts
    - reference_id: file:genes/human/AK4P3/AK4P3-deep-research-falcon.md
      supporting_text: It does **not** establish endogenous protein production, enzymatic activity, substrate
        specificity, mitochondrial localization, pathway membership, disease causality, or physiological
        function.
