- term:
    id: GO:0046033
    label: AMP metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008598552
  - RGD:619885
  - UniProtKB:P27144
  - UniProtKB:Q9UIJ7
  review:
    summary: AMP metabolic process, from the PANTHER node with AK4 among the donors.
    action: UNDECIDED
    reason: 'AMP metabolic process follows from the AMP kinase activity alone, so it stands or falls with
      GO:0004017. The IBA comes from node PTN008598552, above the AK4 clade node that carries the
      IRDs. Undecided because the activity is disputed for AK4 itself, and AK4P3 carries the residue
      blamed for AK4''s inactivity. Liu et al. found AK4 inactive as an adenylate kinase in vitro
      and traced this to a glutamine where other adenylate kinases have a conserved arginine; the
      Q159R mutation restored activity with GTP [PMID:19130895 "Mutation of the glutamine residue to
      arginine (Q159R) restored the adenylate kinase activity"]. Noma et al. likewise found no
      GTP:AMP phosphotransferase activity and no complementation of an E. coli adenylate kinase
      mutant from overexpressed AK4 [PMID:11485571 "Over expression of AK3, but not AK4"].
      Panayiotou et al., by contrast, measured AMP phosphorylation by recombinant AK4 [PMID:19766732
      "The enzyme catalyzed the phosphorylation of AMP, dAMP, CMP and dCMP with ATP or GTP as
      phosphate donors"]. PAINT
      has taken the inactive reading: the AK4 clade node PTN002764060 carries IRDs negating
      GO:0004017 and GO:0046899 [file:interpro/panther/PTHR23359/PTHR23359-paint.tsv "PTN002764060"]. AK4P3 keeps
      Gln159 [file:genes/human/AK4P3/AK4P3-bioinformatics/RESULTS.md "| Residue 159 (AK4''s
      inactivating Gln) | `Q` in both"], so the sequence predicts AK4''s enzymology, whichever
      reading of it is right. No AK4P3 protein has been assayed. With the template''s own activity
      contested, projection to AK4P3 settles nothing, so neither ACCEPT nor REMOVE is justified.'
    propagation_review:
      root_cause: UNRESOLVED
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      source_entities:
      - source_id: PANTHER:PTN008598552
        source_label: AK3/AK4/ADK2 clade node
        source_status: UNRESOLVED
      - source_id: UniProtKB:P27144
        source_label: AK4 (Homo sapiens)
        source_status: UNRESOLVED
      - source_id: UniProtKB:Q9UIJ7
        source_label: AK3 (Homo sapiens)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: RGD:619885
        source_label: Ak3 (Rattus norvegicus)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
    supported_by:
    - reference_id: PMID:19130895
      supporting_text: Mutation of the glutamine residue to arginine (Q159R) restored the adenylate kinase
        activity
    - reference_id: PMID:11485571
      supporting_text: Over expression of AK3, but not AK4
    - reference_id: PMID:19766732
      supporting_text: The enzyme catalyzed the phosphorylation of AMP, dAMP, CMP and dCMP with ATP or GTP
        as phosphate donors
    - reference_id: file:interpro/panther/PTHR23359/PTHR23359-paint.tsv
      supporting_text: "PTHR23359\tPTN002764060\tGO:0004017\tF\tIRD\ttrue"
    - reference_id: file:interpro/panther/PTHR23359/PTHR23359-paint.tsv
      supporting_text: "PTHR23359\tPTN002764060\tGO:0046899\tF\tIRD\ttrue"
    - reference_id: file:genes/human/AK4P3/AK4P3-bioinformatics/RESULTS.md
      supporting_text: '| Residue 159 (AK4''s inactivating Gln) | `Q` in both'
