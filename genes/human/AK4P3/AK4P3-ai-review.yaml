gene_symbol: AK4P3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AK4P3 is a human locus that duplicates adenylate kinase 4 and sits in an unusual position
  between gene and pseudogene. HGNC names it ''adenylate kinase 4 pseudogene 3'' and classifies it as
  a pseudogene, while Ensembl gives the same locus a protein-coding biotype and UniProt holds an unreviewed
  entry for its product at protein-existence level 1. Its predicted 223-residue ORF is 99.1% identical
  to genuine AK4, differing at only two conservative positions, and retains an intact Walker A P-loop
  at the same position, so nothing in the protein sequence marks it as a decayed relic. The locus is demonstrably
  transcribed: long-read cDNA sequencing recovered a spliced AK4P3 transcript with an intact open reading
  frame from human RNA, and that ORF is translation-competent, producing a detectable protein when expressed
  from a tagged construct in cultured cells. What remains unestablished is whether the protein is made
  endogenously and whether it has any enzymatic activity: no AK4P3 protein has been purified or assayed.
  If it is made and behaves like its template, it would be a mitochondrial matrix nucleoside phosphate
  kinase transferring phosphate from ATP or GTP to AMP, but every functional statement about this gene
  product is currently a projection from AK4 rather than an observation of AK4P3.'
