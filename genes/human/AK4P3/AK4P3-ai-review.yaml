- term:
    id: GO:0004017
    label: AMP kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006259
  - InterPro:IPR007862
  - InterPro:IPR036193
  review:
    summary: AMP kinase activity, from the InterPro adenylate-kinase signatures. Appropriate to the sequence;
      never measured for this protein.
    action: UNDECIDED
    reason: 'This row is the InterPro adenylate-kinase signature mapping, which cannot see residue 159.
      Undecided because the activity is disputed for AK4 itself, and AK4P3 carries the residue
      blamed for AK4''s inactivity. Liu et al. found AK4 inactive as an adenylate kinase in vitro
      and traced this to a glutamine where other adenylate kinases have a conserved arginine; the
      Q159R mutation restored activity with GTP [PMID:19130895 "Mutation of the glutamine residue to
      arginine (Q159R) restored the adenylate kinase activity"]. Noma et al. likewise found no
      GTP:AMP phosphotransferase activity and no complementation of an E. coli adenylate kinase
      mutant from overexpressed AK4 [PMID:11485571 "Over expression of AK3, but not AK4"].
      Panayiotou et al., by contrast, measured AMP phosphorylation by recombinant AK4 [PMID:19766732
      "The enzyme catalyzed the phosphorylation of AMP, dAMP, CMP and dCMP with ATP or GTP as
      phosphate donors"]. PAINT
      has taken the inactive reading: the AK4 clade node PTN002764060 carries IRDs negating
      GO:0004017 and GO:0046899 [file:interpro/panther/PTHR23359/PTHR23359-paint.tsv "PTN002764060"]. AK4P3 keeps
      Gln159 [file:genes/human/AK4P3/AK4P3-bioinformatics/RESULTS.md "| Residue 159 (AK4''s
      inactivating Gln) | `Q` in both"], so the sequence predicts AK4''s enzymology, whichever
      reading of it is right. No AK4P3 protein has been assayed. With the template''s own activity
      contested, projection to AK4P3 settles nothing, so neither ACCEPT nor REMOVE is justified.'
    supported_by:
