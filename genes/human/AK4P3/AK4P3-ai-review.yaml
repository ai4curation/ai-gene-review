proposed_new_terms: []
suggested_questions:
- question: Should a locus HGNC classifies as a pseudogene carry 19 enzyme annotations in GOA? Nothing
    here is wrong on the sequence, but a curator scanning GOA sees a mitochondrial adenylate kinase with
    no indication that the gene is named a pseudogene and that no protein from it has ever been assayed.
    This is a presentation problem GO has no slot for.
- question: Is the PE=1 assignment attributable? Two fully tryptic peptides are unique to AK4P3 (ASTEVGEVAK
    and DAAKPVIELYK), and both substitutions are mass-distinguishable, so proteomic evidence CAN be assigned
    correctly here. Whether the observed PeptideAtlas peptides are those two, rather than peptides shared
    with AK4, decides whether PE=1 means anything.
- question: Do HGNC, Ensembl and UniProt intend to disagree? HGNC says pseudogene, Ensembl gives the same
    locus a protein_coding biotype while keeping the pseudogene name, and UniProt holds an unreviewed
    entry at PE=1. PMID:33971925 exists precisely to argue that some pseudogenes are functional, so this
    may be a case where the nomenclature has not caught up.
- question: Does endogenous AK4P3 protein exist? Everything else here is downstream of that one question,
    and it has never been asked directly.
suggested_experiments:
- description: Targeted mass spectrometry for the two AK4P3-unique tryptic peptides - ASTEVGEVAK and DAAKPVIELYK
    - in tissues where the transcript is detected. This is the cheapest decisive experiment available
    and would settle PE=1 either way.
- description: Express and purify the AK4P3 ORF product and assay adenylate kinase activity against ATP
    and GTP alongside AK4, which would convert every catalytic annotation on this gene from projection
    to measurement, or refute them.
- description: Image a tagged AK4P3 construct against mitochondrial markers, testing the matrix localization
    that is currently inherited wholesale from AK4.
- description: CRISPR deletion of the AK4P3 locus with adenine-nucleotide profiling, to test whether it
    contributes anything measurable in cells that transcribe it - the question of endogenous relevance
    rather than of ORF competence.
