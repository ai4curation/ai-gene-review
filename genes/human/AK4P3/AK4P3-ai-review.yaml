    action: UNDECIDED
    reason: 'Context for the whole gene. HGNC names this locus ''adenylate kinase 4 pseudogene 3'' with
      locus_type pseudogene, while Ensembl gives the same locus biotype protein_coding and UniProt lists
      it unreviewed at [file:genes/human/AK4P3/AK4P3-uniprot.txt "PE   1: Evidence at protein level;"].
