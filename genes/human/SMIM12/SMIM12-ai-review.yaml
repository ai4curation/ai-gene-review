      proteins (MitoCoP).
suggested_questions:
- question: >-
    Which mitochondrial membrane does SMIM12 occupy, and which side does its charged
    C-terminal tail face? An N-terminal anchor with a long C-terminal tail would fit an
    outer-membrane, cytosol-facing protein, but this has not been tested.
- question: >-
    Does SMIM12 depletion produce any measurable mitochondrial phenotype (respiration,
    morphology, protein import), or is it dispensable in cultured cells?
suggested_experiments:
- hypothesis: SMIM12 is an integral protein of the mitochondrial outer membrane with its
    C-terminal tail in the cytosol.
  description: >-
    Fractionate mitochondria from cells expressing endogenously tagged SMIM12 and test
    sodium carbonate extraction, protease protection with and without outer-membrane
    swelling, and super-resolution co-localisation with TOMM20 and inner-membrane markers.
- hypothesis: SMIM12 has stable interaction partners in mitochondria.
  description: >-
    Perform affinity purification-mass spectrometry or proximity labelling from
    endogenously tagged SMIM12 in a mitochondria-rich cell line, and test whether the
    candidate partner SH3GLB1 is recovered.
