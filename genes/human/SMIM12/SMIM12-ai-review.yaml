    action: ACCEPT
    reason: >-
      MitoCoP was built to separate genuine mitochondrial proteins from contaminants, and
      the assignment is independently supported by Human Protein Atlas antibody
      immunofluorescence, which gives mitochondria as the main location. This is the only
      localisation of SMIM12 supported by experimental data and the most specific term
      available; the sub-mitochondrial compartment is unknown.
