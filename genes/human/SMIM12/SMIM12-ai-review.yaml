description: >-
  SMIM12 (formerly C1orf212) is a 92-amino-acid (about 10.8 kDa) protein of the SMIM12
  family (Pfam UPF0767). It has a single predicted transmembrane helix near the N terminus
  (residues 15-34) followed by a hydrophilic, charge-rich C-terminal tail of about 58
  residues. The protein is detected in a high-confidence mass-spectrometry inventory of
  the human mitochondrial proteome, and antibody immunofluorescence in the Human Protein
  Atlas also places it in mitochondria. Which mitochondrial membrane it occupies, and its
  orientation, have not been determined. The transcript is expressed broadly across
  tissues. No molecular activity, binding partner or biological process has been
  established for SMIM12; the only reported interactions are unconfirmed yeast two-hybrid
  hits.
