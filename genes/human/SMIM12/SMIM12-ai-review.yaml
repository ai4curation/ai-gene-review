core_functions:
- description: >-
    No molecular activity or biological process is known for SMIM12. The one
    experimentally supported property is residence in mitochondria as a predicted
    single-pass membrane protein; this entry records that location only and asserts no
    function.
  locations:
  - id: GO:0005739
