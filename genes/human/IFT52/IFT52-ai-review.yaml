core_functions:
- description: >-
    IFT52 is a structural hub of the IFT-B complex that bridges the two IFT-B1 subcomplexes and links
    IFT-B1 to IFT-B2; it is required for IFT-B integrity, anterograde IFT and ciliogenesis. No specific
    molecular-function term beyond complex scaffolding is established.
  directly_involved_in:
  - id: GO:0035720
    label: intraciliary anterograde transport
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0036064
    label: ciliary basal body
  - id: GO:0005929
    label: cilium
  - id: GO:0097542
    label: ciliary tip
  in_complex:
    id: GO:0030992
    label: intraciliary transport particle B
  supported_by:
  - reference_id: PMID:28625565
    supporting_text: >-
      IFT52 is a critical bridge between the IFT-B1 to the IFT-B2 subcomplexes (Taschner et al., 2016),
      and also links two IFT-B1 subcomplexes (IFT81/74/22/27/25 and IFT88/70/52/46) (Taschner et al.,
      2014).
  - *id006
  - *id011
  - reference_id: file:human/IFT52/IFT52-deep-research-falcon.md
    supporting_text: >-
      Direct human genetics and knockout/rescue experiments strongly establish IFT52 as an IFT-B scaffold
      required for ciliary assembly and anterograde transport.
  - reference_id: file:human/IFT52/IFT52-deep-research-falcon.md
    supporting_text: >-
      In human hTERT-RPE1 cells, IFT52 knockout eliminates detectable mother-centriole IFT88 and IFT38
      and prevents ciliogenesis.
suggested_questions:
- question: >-
    Which IFT52 interfaces (IFT88/IFT46 versus IFT57/IFT38) are disrupted by SRTD16 variants, and does
    loss of IFT-B1/IFT-B2 bridging explain the reduced levels of IFT74, IFT81 and IFT88 in patient cells?
suggested_experiments:
- description: >-
    Rescue of IFT52-knockout RPE1 cells with interface mutants (IFT46-, IFT88- and IFT57-binding) to test
    which contacts are needed for IFT-B stability, ciliary entry and ciliogenesis.
