id: Q9Y366
gene_symbol: IFT52
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  IFT52 is a core (IFT-B1) subunit of the intraflagellar transport B complex, built from an N-terminal
  GIFT-like domain, a central domain and a C-terminal region that mediate multiple subunit contacts. IFT52
  is a structural hub of IFT-B: it bridges the IFT88/IFT70/IFT52/IFT46 and IFT81/IFT74/IFT27/IFT25/IFT22
  portions of the IFT-B1 core and connects IFT-B1 to the peripheral IFT-B2 subcomplex via IFT57/IFT38.
  As part of anterograde IFT trains moved by kinesin-2, IFT52 is required for ciliary entry of IFT-B and
  for cilium assembly and length control. IFT52 resides at the ciliary base and within cilia. Biallelic
  IFT52 variants cause short-rib thoracic dysplasia (SRTD16); patient cells show reduced levels of other
  IFT-B subunits and impaired ciliogenesis.
