suggested_questions:
- question: What is the molecular function and cognate receptor (if any) of SCGB3A1/HIN-1,
    and by what mechanism does the secreted protein inhibit epithelial/carcinoma cell
    growth?
- question: Is the mouse Scgb3a1 myoblast-fusion phenotype reproduced by the human
    protein, and is it a direct activity or an indirect consequence of altered secretion?
suggested_experiments:
- description: Affinity-purify SCGB3A1 interactors / perform receptor-capture on growth-inhibited
    carcinoma cells to identify the binding partner responsible for growth suppression.
- description: Restore SCGB3A1 expression (or add recombinant protein) to a panel
    of hypermethylated carcinoma lines and measure proliferation, apoptosis and invasion
    to define the tumor-suppressor mechanism.
