- id: PMID:16266985
  title: HIN-1, an inhibitor of cell growth, invasion, and AKT activation.
  findings:
  - statement: HIN-1 binds a high-affinity cell-surface receptor on epithelial cells
      and is a potent inhibitor of cell growth, migration and invasion; it suppresses
      mitogen-induced AKT activation, and constitutively active AKT abrogates its growth
      arrest, placing AKT downstream of HIN-1.
