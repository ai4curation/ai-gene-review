id: Q96QR1
gene_symbol: SCGB3A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SCGB3A1 (Secretoglobin family 3A member 1), also known as HIN-1 (high
  in normal-1), UGRP2 or PnSP-2, is a small (~10 kDa) secreted protein of the secretoglobin
  superfamily, UGRP subfamily, and the closest paralog of SCGB3A2. It is produced
  by airway and glandular epithelial cells (highly expressed in lung and prostate,
  and in mammary luminal epithelium) and is secreted as a disulfide-linked homodimer.
  SCGB3A1 is a candidate tumor suppressor; it acts as a secreted ligand that binds
  a high-affinity (still unidentified) cell-surface receptor on epithelial cells and
  inhibits mitogen-induced PI3K/AKT signaling, thereby suppressing proliferation,
  migration and invasion and promoting apoptosis. The gene is epigenetically silenced
  by promoter hypermethylation at high frequency in breast and other epithelial carcinomas.
  It was originally described as a putative cytokine with no homology to known proteins,
  and its cognate receptor remains to be identified.
existing_annotations:
- term:
    id: GO:0005125
    label: cytokine activity
  evidence_type: NAS
  original_reference_id: PMID:11481438
  qualifier: enables
  review:
    summary: SCGB3A1/HIN-1 is a secreted protein that binds a high-affinity cell-surface
      receptor on epithelial cells and modulates intracellular signaling, consistent
      with a cytokine-like secreted-ligand activity, although the cognate receptor
      is still unidentified and no classical immune-cytokine signaling has been shown.
    action: KEEP_AS_NON_CORE
    reason: The term was originally assigned NAS from the "putative cytokine" designation
      at cloning (Krop et al.), but subsequent work provides functional support for
      a secreted-ligand/receptor-mediated activity; ligand-binding studies show high-affinity
      cell-surface HIN-1 binding on epithelial cells, and HIN-1 engages this surface
      activity to suppress mitogen-induced AKT signaling (PMID:16266985). This supports
      a cytokine-like secreted signaling activity, so the term is retained rather than
      removed. It is marked non-core because the cognate receptor remains unidentified
      and the specific GO "cytokine activity" assignment (which connotes immune/inflammatory
      signaling) is not firmly established; the characterized core role is receptor-mediated
      growth suppression captured by the BP annotations below.
    supported_by:
