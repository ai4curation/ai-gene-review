- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0005125
  review:
    summary: Generic signal-transduction term (logically inferred from the cytokine
      activity annotation) is uninformatively broad; the specific, experimentally
      demonstrated signaling effect of SCGB3A1 is inhibition of the PI3K/AKT pathway.
    action: MODIFY
    reason: The bare "signal transduction" IEA is an inter-ontology inference from
      GO:0005125 cytokine activity and is too general. Krop et al. (PMID:16266985)
      directly showed that HIN-1 inhibits mitogen-induced AKT phosphorylation/activation
      and that constitutively active AKT abrogates HIN-1-mediated growth arrest, placing
      AKT downstream of HIN-1. The verified claim is therefore negative regulation
      of PI3K/AKT signaling, which should replace the generic term. This is a specificity
      refinement grounded in experimental data, and it mechanistically underlies the
      growth-suppressive phenotype.
    proposed_replacement_terms:
    - id: GO:0051898
      label: negative regulation of phosphatidylinositol 3-kinase/protein kinase B
        signal transduction
    supported_by:
    - reference_id: PMID:16266985
      supporting_text: mitogen-induced phosphorylation and activation of AKT are inhibited
        in HIN-1-expressing cells
    - reference_id: PMID:16266985
      supporting_text: expression of constitutively activate AKT abrogates HIN-1-mediated
        growth arrest
- term:
    id: GO:0030308
    label: negative regulation of cell growth
  evidence_type: NAS
  original_reference_id: PMID:11481438
  qualifier: involved_in
  review:
    summary: Reintroduction of SCGB3A1/HIN-1 into breast cancer cells inhibits cell
      growth, the central verified functional property of the protein.
    action: MODIFY
    reason: This is the core functional claim for SCGB3A1, but the measured endpoints
      are proliferation and cell-cycle control, not individual-cell biomass accumulation.
      The cloning study shows re-expression of HIN-1 in HIN-1-negative breast cancer
      cells suppresses growth, and Krop et al. 2005 show HIN-1 inhibits anchorage-dependent
      and -independent colony formation, blocks Rb phosphorylation and cell-cycle re-entry,
      and induces apoptosis in proliferating cells. GO:0030308 (negative regulation of
      cell growth) is defined relative to GO:0016049 cell growth, i.e. an increase in
      individual-cell size, which none of these assays measure. Refine to GO:0008285
      negative regulation of cell population proliferation, the term that matches the
      proliferation/colony-formation evidence and its tumor-suppressor role (cf. the
      human CDKN2A precedent, which refines GO:0030308 to GO:0008285 for the same reason).
    proposed_replacement_terms:
    - id: GO:0008285
      label: negative regulation of cell population proliferation
    supported_by:
    - reference_id: PMID:11481438
      supporting_text: Reintroduction of HIN-1 into breast cancer cells inhibits cell
        growth
    - reference_id: PMID:16266985
      supporting_text: HIN-1 is a potent inhibitor of anchorage-dependent and anchorage-independent
        cell growth, cell migration, and invasion
    - reference_id: file:human/SCGB3A1/SCGB3A1-deep-research-openscientist.md
      supporting_text: Through AKT inhibition it blocks anchorage-dependent and anchorage-independent
        growth, migration, and invasion; it inhibits Rb phosphorylation and cell-cycle
        re-entry; and it induces apoptosis in proliferating cells.
