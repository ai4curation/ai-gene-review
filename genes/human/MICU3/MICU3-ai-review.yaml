    label: positive regulation of neurotransmitter secretion
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: acts_upstream_of_positive_effect
  supporting_entities:
  - UniProtKB:A0A8I6A2H6
  review:
    summary: MICU3 supports presynaptic function indirectly through mitochondrial Ca2+ uptake and
      ATP synthesis, but neurotransmitter secretion is too specific.
    action: MARK_AS_OVER_ANNOTATED
    reason: The orthology transfer overstates the direct presynaptic phenotype. MICU3 lowers the
      Ca2+ threshold of axonal mitochondria and thereby helps nerve terminals maintain local ATP
      synthesis under oxidative fuel conditions, but the clearest vesicle-cycle phenotype in the
      MCU/MICU3 pathway is slowed synaptic-vesicle recycling rather than a direct positive effect on
      neurotransmitter exocytosis or secretion.
    supported_by:
    - reference_id: PMID:31862210
      supporting_text: This inability to sustain ATP synthesis resulted in slowing of SV recycling
        as probed with vGLUT1-pH (Fig. 6C and D).
      reference_section_type: RESULTS
    - reference_id: PMID:31862210
      supporting_text: These experiments show that in neurons where MCU is knocked down with either
        of two different shRNA constructs, SV endocytosis and reacidification are slowed (Fig. 2E–F,
        and Fig. S1E), while exocytosis is not significantly perturbed (Fig. S1F).
      reference_section_type: RESULTS
