id: Q86XE3
gene_symbol: MICU3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'EF-hand calcium-binding regulatory subunit of the mitochondrial calcium uniporter that is
  enriched in the central nervous system and skeletal muscle. MICU3 localizes to the mitochondrial intermembrane
  space at the inner membrane, heterodimerizes with MICU1 through a disulfide-linked interface, and acts
  as a Ca2+ sensor that lowers the activation threshold for MCU-dependent Ca2+ import, allowing excitable-cell
  mitochondria to take up Ca2+ during small, rapid cytosolic Ca2+ transients and adjust local ATP production.'
