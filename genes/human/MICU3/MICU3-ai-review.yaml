references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: InterPro IPR039800 covers MICU1/2/3-family EF-hand regulators and supports
      parent-level mitochondrial Ca2+ transport for MICU3; the generic EF-hand record supports Ca2+
      binding.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by
    curator judgment of sequence similarity
  findings:
  - statement: Manual orthology transfers from human MICU2 to MICU3 correctly carry the shared IMS
      and inner-membrane placement of the MICU-family EF-hand regulators.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: The PAINT node for MICU-family proteins supports Ca2+ binding, mitochondrial Ca2+
      import, mitochondrial Ca2+ homeostasis and uniplex membership for MICU3; just paint-losses
      reported no IRD or IKR loss on the human MICU3 lineage.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary
    mapping, accompanied by conservative changes to GO terms applied by UniProt
  findings:
  - statement: UniProt SubCell maps MICU3 to both the mitochondrial intermembrane space and the
      inner membrane; these are complementary because MICU3 is an IMS-side soluble regulator
      associated with the inner-membrane uniporter.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using
    Ensembl Compara
  findings:
  - statement: The mouse-to-human orthology transfers for mitochondrion and heterodimerization match
      the vertebrate MICU3 subfamily and are supported by direct human MICU3 evidence.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings:
  - statement: ARBA predicts the broad cellular response to Ca2+ process for MICU3; this is true as
      context but less informative than the direct mitochondrial Ca2+ import mechanism.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: The UniProt automatic consensus rows for calcium import into the mitochondrion and
      calcium ion sensor activity are corroborated by direct human MICU3 papers and rat axonal MICU3
      work.
- id: PMID:29725115
  title: MICU3 is a tissue-specific enhancer of mitochondrial calcium uptake.
  findings:
  - statement: Primary human MICU3 functional paper showing that MICU3 is an EF-hand regulator,
      forms a disulfide-linked heterodimer with MICU1 but not MICU2, enhances MCU-dependent
      mitochondrial Ca2+ uptake, and supports synaptic-activity-evoked mitochondrial Ca2+ uptake in
      primary cortical neurons.
- id: PMID:30699349
  title: Dimerization of MICU Proteins Controls Ca(2+) Influx through the Mitochondrial Ca(2+)
    Uniporter.
  findings:
  - statement: Abstract-only cached structural paper that solved human MICU2 and MICU3 crystal
      structures and supports the Ca2+-dependent rearrangement of MICU-family dimers.
- id: PMID:31862210
  title: Molecular Tuning of the Axonal Mitochondrial Ca(2+) Uniporter Ensures Metabolic Flexibility
    of Neurotransmission.
  findings:
  - statement: Primary neuronal study showing that rat MICU3 sets a low Ca2+ threshold in
      presynaptic mitochondria so activity-driven mitochondrial uptake can accelerate ATP synthesis
      under oxidative fuel conditions; the full text supports slowed synaptic-vesicle recycling, not
      a direct neurotransmitter-secretion role.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular
    context.
  findings:
  - statement: High-confidence human mitochondrial proteome resource supporting a root mitochondrion
      localization row for MICU3.
- id: Reactome:R-HSA-8949178
  title: MCU translocates calcium from the mitochondrial intermembrane space to the mitochondrial
    matrix
  findings:
  - statement: Reactome event that correctly describes MICU3 as the neuronal MICU paralog regulating
      the MCU pore.
- id: Reactome:R-HSA-8953461
  title: SMDT1 assists in assembling MCU, MCUB, MICU1, MICU2 (or MICU3) yielding the MCU complex
  findings:
  - statement: Reactome assembly event that correctly includes MICU3 as the neuronal alternative to
      MICU2 in assembled MCU complexes.
- id: file:human/MICU3/MICU3-uniprot.txt
  title: UniProtKB entry Q86XE3
  findings:
  - statement: UniProt records MICU3 expression in both the central nervous system and skeletal
      muscle.
    record_section:
    - CC:TISSUE SPECIFICITY
    supporting_text: "CC   -!- TISSUE SPECIFICITY: Specifically expressed in the central nervous\nCC \
      \      system and skeletal muscle. {ECO:0000269|PubMed:29725115}."
  - statement: UniProt infers a skeletal-muscle mitochondrial calcium uptake role for MICU3 by
      similarity from mouse Micu3.
    record_section:
    - CC:FUNCTION
    supporting_text: "CC       also required to increase mitochondrial calcium uptake in skeletal\nCC\
      \       muscle cells, thereby increasing ATP production (By similarity)."
  - statement: The CC:DOMAIN note places MICU3 EF-hand sensing on matrix calcium even though MICU
      proteins sense Ca2+ from the IMS/cytosolic face of the inner membrane.
    record_section:
    - CC:DOMAIN
    supporting_text: CC       as sensors of mitochondrial matrix calcium levels (PubMed:30699349).
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The entry correctly summarizes MICU3 tissue specificity, heterodimerization with
      MICU1, and IMS/inner-membrane localization, but its DOMAIN comment appears to say the EF-hands
      sense matrix calcium; MICU3 should sense extramitochondrial Ca2+ from the intermembrane-space
      side of MCU.
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q86XE3
      slot: CC:DOMAIN
      requested_change: CHECK
      asserted_value: CC       as sensors of mitochondrial matrix calcium levels (PubMed:30699349).
      cause: OTHER
      confidence: PROBABLE
      explanation: The MICU EF-hand domains are in soluble regulators on the intermembrane-space
        side of the MCU/EMRE pore and respond to extramitochondrial, cytosolic-side Ca2+, not matrix
        Ca2+. The Q86XE3 DOMAIN note probably should say mitochondrial calcium uptake or
        mitochondrial uniporter calcium levels rather than matrix calcium levels.
      supported_by:
