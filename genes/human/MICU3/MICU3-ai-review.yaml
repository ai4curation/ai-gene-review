core_functions:
- description: MICU3 uses its EF-hand domains as the Ca2+ sensor of the MICU1-MICU3 regulatory
    branch of the mitochondrial calcium uniporter. The MICU1-MICU3 dimer is recruited to the IMS
    face of the inner-membrane MCU/EMRE pore and enhances MCU opening at small, rapid cytosolic Ca2+
    transients, lowering the uptake threshold used by neuronal, axonal and skeletal-muscle
    mitochondria.
