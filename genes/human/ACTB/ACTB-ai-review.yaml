- term:
    id: GO:0016787
    label: hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: ACTB hydrolyzes its bound ATP during filament turnover.
    action: MODIFY
    reason: The hydrolase keyword captures real chemistry, but ATP hydrolysis activity describes the directly
      measured reaction more precisely. Human recombinant beta-actin filament turnover was measured separately
      from actin-stimulated myosin ATPase (PMID:25255767, Figure 4,
      https://febs.onlinelibrary.wiley.com/doi/10.1111/febs.13068). That human assay is externally accessible
      but absent from its local abstract. The cached PMID:3672117 abstract independently describes
      F-actin ATP hydrolysis at the actin-family level; it is not a human ACTB kinetic measurement.
    proposed_replacement_terms:
    - id: GO:0016887
      label: ATP hydrolysis activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: UniProtKB-KW:KW-0378
        source_status: SUPPORTS_TRANSFER
        comment: The broad hydrolase keyword can be refined to the measured ATP-hydrolysis reaction.
    supported_by:
    - reference_id: PMID:25255767
      full_text_unavailable: true
    - reference_id: PMID:3672117
      supporting_text: The hydrolysis reaction occurs on the F-actin subsequent to the polymerization reaction in two steps
      full_text_unavailable: true
