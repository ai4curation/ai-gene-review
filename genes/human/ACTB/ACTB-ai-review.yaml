- id: PMID:36248738
  title: Differential N-terminal processing of beta and gamma actin.
  full_text_unavailable: false
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Primary indexed PMC9556930 and PubMed identity independently verified: https://pubmed.ncbi.nlm.nih.gov/36248738/,
      DOI 10.1016/j.isci.2022.105186. The provider PMC link identifies this real paper despite its neighboring
      incorrect DOI ending 105181. The recovered normal full body, including Results, Discussion,
      Limitations and STAR Methods, was read. Mouse embryonic fibroblasts and mouse tissues are distinct
      from human HAP1 cells and commercial human platelet actin. Mass spectrometry detects low-abundance
      N-terminal beta-actin Asp removal, with differential gamma-actin processing. HAP1 DNPEP/ENPEP
      deletions alter processing and cytoskeletal phenotypes, but both enzymes have other substrates.
      Purified ENPEP cleaves synthetic non-acetylated N-terminal peptides; DNPEP has no detectable peptide
      activity under that assay, and neither cleaves the acetylated peptides tested. ACTB is the processed
      substrate, not the aminopeptidase. The authors limit absolute quantification and attribution of
      phenotypes solely to actin processing; no new ACTB annotation is proposed.'
