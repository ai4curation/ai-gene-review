    reason: The externally read Results and Figure 6 of PMID:25255767 measure actin-dependent activation of
      nonmuscle myosin-2A ATP turnover with human WT/variant beta-actin preparations. Myosin binding is an
      informative interaction function supported by this assay. The preparations contain 5–15% endogenous
