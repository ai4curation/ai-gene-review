      at https://febs.onlinelibrary.wiley.com/doi/10.1111/febs.13068 report approximately 15-fold stimulation
      of human NM-2A by 30 micromolar WT beta-actin. This externally read functional interaction assay
      is absent from the local abstract; the general F-actin hydrolysis review does not substitute for it.
