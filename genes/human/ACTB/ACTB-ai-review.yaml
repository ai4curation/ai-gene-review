id: P60709
gene_symbol: ACTB
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Human ACTB encodes cytoplasmic beta-actin, an ATP-binding protein that assembles into dynamic
  filaments. Its polymers provide mechanical support and force for cell motility, cell shape, epithelial
  junctions and membrane remodeling. ATP hydrolysis and phosphate release alter filament turnover, while
  actin-binding proteins control assembly and coupling to cellular structures. Nuclear beta-actin also
  participates in chromatin-remodeling and histone-modifying complexes: the ACTB–ACTL6 module helps connect
  the SWI/SNF motor to the rest of the complex. Distinct structural pools occur in dynactin and non-activated
  gamma-tubulin ring complexes. Pathogenic ACTB variants can disrupt actin dynamics and cause developmental
  disease.'
