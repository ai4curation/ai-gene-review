id: P13945
gene_symbol: ADRB3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ADRB3 encodes the beta-3 adrenergic receptor, a class A seven-transmembrane G protein-coupled receptor
  for the catecholamines noradrenaline and adrenaline (noradrenaline more potent), expressed mainly in white and
  brown adipocytes and also in detrusor and vascular smooth muscle, gallbladder and heart. Agonist-bound ADRB3 catalyses
  GDP/GTP exchange on heterotrimeric Gs and Gi: Gs activation of adenylyl cyclase and cAMP/PKA signaling drives
  adipocyte lipolysis and brown-fat thermogenesis, while constitutive Gi coupling restrains cAMP and triggers ERK1/2
  activation. Unlike beta1 and beta2 receptors it has atypical pharmacology (low affinity for classical beta-blockers)
  and resists agonist-induced internalization, and it can hetero-oligomerize with the beta2 receptor. ADRB3 mediates
  relaxation of the urinary bladder (the target of beta3 agonists such as mirabegron for overactive bladder) and
  NO/cGMP-dependent negative inotropy in the human heart. Its contribution to human (as opposed to rodent) brown
  adipose tissue thermogenesis is debated, and the Trp64Arg variant has been associated with obesity and type 2
  diabetes.'
