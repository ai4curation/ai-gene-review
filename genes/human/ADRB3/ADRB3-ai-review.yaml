suggested_questions:
- question: How much does ADRB3, versus ADRB2, contribute to human brown adipose tissue lipolysis and thermogenesis
    at physiological agonist concentrations?
  experts:
  - adipocyte biologists
  - GPCR pharmacologists
- question: Should GO provide guidance (or a taxon/domain check) to prevent receptor-stimulated G protein GTP exchange
    assays being annotated to GO:0003925 G protein activity rather than G protein-coupled receptor activity?
  experts:
  - GO editors
  - UniProt curators
suggested_experiments:
- description: CRISPR knockout of ADRB3 versus ADRB2 in human brown adipocytes with rescue, measuring mirabegron-
    and noradrenaline-stimulated cAMP, lipolysis and UCP1-dependent respiration across agonist concentrations.
  hypothesis: ADRB3 makes a quantitatively significant, agonist-concentration-dependent contribution to human brown
    adipocyte thermogenesis distinct from ADRB2.
