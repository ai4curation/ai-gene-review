- term:
    id: GO:0003925
    label: G protein activity
  evidence_type: IDA
  original_reference_id: PMID:10207024
  qualifier: enables
  review:
    summary: IDA from Soeder et al. 1999 (PMID:10207024), which shows beta3AR agonist stimulates GTP exchange on
      Galpha-s and Galpha-i in adipocyte membranes. Annotated as G protein activity.
    action: MODIFY
    reason: 'GO:0003925 G protein activity is_a GTPase activity and is defined as a molecular function regulator
      that cycles between GTP- and GDP-bound states and hydrolyses GTP with intrinsic GTPase activity; it describes
      the G protein alpha subunit (or a small GTPase), not the receptor. ADRB3 is a class A seven-transmembrane
      GPCR with no P-loop NTPase or Ras-like domain (InterPro IPR000276/IPR017452/IPR000681; Gene3D 1.20.1070.10
      only), so it cannot bind and hydrolyse GTP itself. What PMID:10207024 measured is agonist (CL316,243)-stimulated
      incorporation of 8-azido-GTP into Galpha-s and Galpha-i: the receptor catalysing GDP/GTP exchange on its heterotrimeric
      G proteins, which is exactly the definition of G protein-coupled receptor activity (GO:0004930, ''promotes
      the exchange of GDP for GTP on the alpha subunit of a heterotrimeric G-protein complex''). The essence (ADRB3
      activates Gs and Gi) is sound, so MODIFY to the most specific receptor term, GO:0015052 beta3-adrenergic receptor
      activity (is_a GO:0004930), which ADRB3 already carries by IDA from this same paper.'
    proposed_replacement_terms:
    - &id002
      id: GO:0015052
      label: beta3-adrenergic receptor activity
    supported_by:
    - &id001
      reference_id: PMID:10207024
      supporting_text: CL316,243 (5 microM) stimulated the incorporation of 8-azido-[32P]GTP into Galphas (1.57
        +/- 0.12; n = 3) and Galphai (1. 68 +/- 0.13; n = 4) in adipocyte plasma membranes, directly demonstrating
        that beta3AR stimulation results in Gi-GTP exchange
    - &id013
      reference_id: PMID:10207024
      supporting_text: constitutive beta3AR coupling to Gi proteins serves both to restrain Gs-mediated activation
        of adenylyl cyclase and to initiate additional signal transduction pathways, including the ERK1/2 MAP kinase
        cascade
