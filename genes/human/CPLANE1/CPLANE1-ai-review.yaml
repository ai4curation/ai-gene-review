    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0162
  review:
    summary: Retain the broad membrane prediction as non-core context.
    action: KEEP_AS_NON_CORE
    reason: Retain the broad UniProt membrane prediction outside the primary functional
      synthesis. The reviewed record supplies membrane/multipass provenance and two
      sequence-predicted transmembrane segments. The primary experiments considered
      here do not establish insertion or membrane topology; the GO definition also
      includes proteins attached to a membrane. Basal-body or transition-zone localization
      is compatible with this prediction but does not demonstrate integral insertion
      or justify a more specific ciliary-membrane term.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
