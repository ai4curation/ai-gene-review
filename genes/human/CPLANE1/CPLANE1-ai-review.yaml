existing_annotations:
- term:
    id: GO:0005929
    label: cilium
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0066
  review:
    summary: Refine broad cilium localization to the supported transition zone and
      ciliary basal body.
    action: MODIFY
    reason: The UniProt cilium vocabulary mapping is sound but broader than two supported
      locations. Mouse Jbts17 immunostaining, NPHP1 colocalization and siRNA validation
      in PMID:25877302 support the transition zone, corroborating the existing accepted
      IBA. In PMID:27158779, full-length Xenopus GFP-Jbts17 forms a ring around centrin4-marked
      basal bodies; depletion and rescue experiments place recruitment of selected
      CPLANE components and peripheral IFT-A proteins at that site. Add ciliary basal
      body alongside transition zone to represent this supported core location. These
      are ortholog-level localization contexts, not a direct human localization experiment
      or an exclusive-compartment claim. The human patient-fibroblast experiment establishes
      impaired ciliogenesis. The separate wheat-germ binding construct comprises Jbts17
      residues 907–1569 and is not the full-length localization construct.
    proposed_replacement_terms:
    - id: GO:0035869
      label: ciliary transition zone
    - id: GO:0036064
      label: ciliary basal body
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0066
        source_status: SUPPORTS_TRANSFER
        comment: The vocabulary mapping yields broad cilium. Mouse transition-zone
          localization and verified ancestral placement support one refinement; full-length
          Xenopus GFP-Jbts17 basal-body-ring localization supports the second. The
          transition-zone term corroborates the existing IBA, while basal body is
          newly represented by this source-preserving MODIFY.
    additional_reference_ids:
    - PMID:25877302
    - PMID:27158779
