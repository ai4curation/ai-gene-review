id: Q9H799
gene_symbol: CPLANE1
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CPLANE1, also called JBTS17, is a large ciliary-base protein that promotes
  cilium assembly by supporting recruitment of selected CPLANE components and peripheral
  IFT-A subunits. It acts in the basal-body and transition-zone region, while the
  molecular activity connecting its interactions to recruitment remains unresolved.
  Biallelic variants cause Joubert and oral-facial-digital syndromes. A mitotic kinetochore-associated
  role has also been reported.
