- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:25877302
  qualifier: involved_in
  review:
    summary: Accept the directly measured human fibroblast ciliogenesis defect.
    action: ACCEPT
    reason: PMID:25877302 directly compares serum-starved fibroblasts from a human
      patient carrying compound-heterozygous JBTS17 variants with an unaffected control
      and finds defective ciliogenesis. Mutant mouse fibroblasts are also impaired.
      This supports the existing IMP assembly assertion from a cellular assay, independently
      of the associated developmental abnormalities. Subsequent Xenopus localization,
      recruitment and rescue experiments help define the cellular work underlying
      the assembly phenotype.
    supported_by:
    - reference_id: PMID:25877302
      supporting_text: JBTS patient with a JBTS17 mutation showed ciliogenesis defects.
