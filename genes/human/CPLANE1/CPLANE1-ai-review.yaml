- id: PMID:25877302
  title: Novel Jbts17 mutant mouse model of Joubert syndrome with cilia transition
    zone defects and cerebellar and other ciliopathy related anomalies.
  findings:
  - statement: Human patient fibroblasts have impaired ciliogenesis; mouse Jbts17
      localizes to the transition zone with siRNA-sensitive staining.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The original main Methods/Results/Discussion and the recovered Figure
      5 caption were read. Mouse antibody localization/siRNA validation is distinct
      from human patient-fibroblast ciliogenesis. The selected cache contains main
      text; the separately recovered original supplies the figure caption.
- id: PMID:27158779
  title: The ciliopathy-associated CPLANE proteins direct basal body recruitment of
    intraflagellar transport machinery.
  findings:
  - statement: Xenopus Jbts17 promotes recruitment of selected CPLANE components and
      peripheral IFT-A proteins at basal bodies; the biochemical mechanism remains
      unresolved.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original target Results/Discussion, captions and author-lab PDF
      Online Methods were read. Target functional tests use Xenopus Jbts17; the wheat-germ
      binding experiment uses FLAG-Jbts17 residues 907–1569 with GFP-tagged Intu/Fuz/Wdpcp.
      Recruitment hierarchy and pairwise association do not identify an autonomous
      bridging or scaffolding molecular activity. The appended author correction is
      typographic.
- id: PMID:31004438
  title: Extraciliary roles of the ciliopathy protein JBTS17 in mitosis and neurogenesis.
  findings:
  - statement: Human cell experiments identify mitotic kinetochore localization and
      NDC80/LIS1 association; these contextual findings do not establish a molecular
      motor or bridging mechanism.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The complete abstract and original Figures 1–5 captions/first-page
      preview were recovered and read, but the full Methods/Results were not obtained.
      Captions distinguish endogenous human HeLa kinetochore staining and JBTS17 immunoprecipitation
      from tagged full-length/JCD constructs, and human RPE1 ciliation from mouse
      spheroid/neurodevelopment contexts. Exact fragment boundaries and detailed antibody
      controls remain unassessed.
- id: PMID:35582950
  title: Whole-exome sequencing identified novel variants in CPLANE1 that causes oral-facial-digital
    syndrome Ⅵ by inducing primary cilia abnormality.
  findings:
  - statement: Cplane1 depletion in mouse NIH/3T3 cells reduces ciliation and alters
      migration and Hedgehog-pathway readouts.
  full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The original main text and captions were read. Human family sequencing
      is distinct from mouse NIH/3T3 siRNA ciliation, migration and Hedgehog-readout
      experiments. Ciliary tubulin staining is not localization of CPLANE1 itself.
      The paper contains inconsistent narrative wording about Ptch1; no directional
      Ptch1 mechanism is assigned here.
- id: PMID:40593758
  title: The human ciliopathy protein RSG1 links the CPLANE complex to transition
    zone architecture.
  findings:
  - statement: Xenopus Jbts17 supports basal-body docking; the published study separates
      this target assay from human RSG1 transition-zone experiments.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Published original target Results and relevant Methods/captions
      were read. Xenopus Jbts17 depletion impairs basal-body docking, with wild-type
      but not Arg1569* rescue. Human transition-zone experiments target RSG1; mouse
      experiments target Fuz/Intu. Those data are not reassigned to human CPLANE1.
      The subsequent correction concerns author metadata.
core_functions:
- description: Supports cilium assembly at the ciliary base by promoting recruitment
    of selected CPLANE components and peripheral IFT-A subunits. Mouse transition-zone
    localization and Xenopus basal-body recruitment/rescue experiments complement
    human fibroblast ciliogenesis evidence. The molecular activity coupling CPLANE1
    interactions to recruitment remains unresolved.
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  locations:
  - id: GO:0036064
    label: ciliary basal body
  - id: GO:0035869
    label: ciliary transition zone
  knowledge_gaps:
  - gap_statement: The molecular activity by which CPLANE1 enables basal-body recruitment
      of CPLANE and peripheral IFT-A components is unresolved; direct bridging, complex
      scaffolding, trafficking and protein-stability mechanisms have not been distinguished.
    boundary: Target-specific binding and localization/depletion/rescue evidence establishes
      a role in cilium assembly, without assigning the GEF or lipid-binding activities
      measured for other CPLANE subunits.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    resolution: Use defined CPLANE1 constructs and reconstituted complexes to test
      simultaneous partner bridging, assembly/stability and recruitment functions,
      with separation-of-function rescue.
    provenance:
    - reference_id: PMID:27158779
      supporting_text: the precise mechanisms by which it acts remain to be determined
  supported_by:
  - reference_id: PMID:27158779
    supporting_text: Jbts17 localized robustly around basal bodies
suggested_questions:
- question: Does CPLANE1 directly bridge recruitment partners, stabilize their assembly,
    or control their delivery to the ciliary base?
- question: Do the two official human products differ in membrane topology, ciliary
    recruitment or mitotic localization?
- question: How should the CPLANE1–INTU–FUZ–WDPCP module be represented, and which
    components and stoichiometries form a stable complex rather than condition-dependent
    associations?
suggested_experiments:
- hypothesis: Defined CPLANE1 interfaces separate recruitment from protein stability.
  description: Reconstitute defined CPLANE1 fragments with Intu, Fuz, Wdpcp and peripheral
    IFT-A proteins; test simultaneous binding and assembly, then compare separation-of-function
    variants in depletion/rescue assays with matched expression and localization controls.
  experiment_type: Biochemical reconstitution and cellular rescue
- hypothesis: The two human products differ in localization or recruitment efficiency.
  description: Express the exact Q9H799-1 and Q9H799-5 sequences at comparable endogenous
    levels and compare topology, transition-zone/basal-body localization and rescue
    of ciliogenesis.
  experiment_type: Product-resolved rescue and topology analysis
status: COMPLETE
