- query: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO%3A0097711
  response_sha256: 77d2068d97f1791177dab6a6a6842dac41de2da796048d9a8b33d99417882a27
  definition_response:
    numberOfHits: 1
    results:
    - id: GO:0097711
      isObsolete: true
      name: obsolete ciliary basal body-plasma membrane docking
      definition:
        text: OBSOLETE. The docking of a cytosolic centriole/basal body to the plasma membrane via the
          ciliary transition fibers. In some species this may happen via an intermediate step, by first
          docking to the ciliary vesicle via the ciliary transition fibers. The basal body-ciliary vesicle
          then relocates to the plasma membrane, followed by the ciliary vesicle fusing with the plasma
          membrane, effectively attaching the basal body to the plasma membrane.
        xrefs:
        - dbCode: PMID
          dbId: '13978319'
        - dbCode: PMID
          dbId: '23348840'
        - dbCode: PMID
          dbId: '23530209'
        - dbCode: PMID
          dbId: '25686250'
        - dbCode: PMID
          dbId: '26981235'
      comment: The reason for obsoletion is that this term is redundant with GO:1905349 ciliary transition
        zone assembly. Per PMID:27646273, transition zone assembly is a complex process that begins with
        docking of the mother centriole to cytoplasmic vesicles, so the docking step is encompassed by
        transition zone assembly.
      aspect: biological_process
      usage: Unrestricted
    pageInfo: null
  typed_ancestors:
