- reference_id: PMID:27158779
  selected_cache: publications/PMID_27158779.md
  cache_sha256: 4e576f3776cb9086856e965f0fdaf2417cc3d761ad0a4fef660867c841cd283f
  cache_full_text_available: true
  review_full_text_unavailable: false
  public_original: https://pmc.ncbi.nlm.nih.gov/articles/PMC4978421/
  doi: https://doi.org/10.1038/ng.3558
  read_scope: Target Results and Discussion; original author-lab PDF Online Methods, Plasmid constructs
    and In vitro protein translation and pulldown assays (text lines 1322–1349 in the archived extraction).
  interpretation: Original target Results/Discussion, captions and author-lab PDF Online Methods were
    read. Target functional tests use Xenopus Jbts17; the wheat-germ binding experiment uses FLAG-Jbts17
    residues 907–1569 with GFP-tagged Intu/Fuz/Wdpcp. Recruitment hierarchy and pairwise association do
    not identify an autonomous bridging or scaffolding molecular activity. The appended author correction
    is typographic.
  additional_original_methods_url: https://www.marcottelab.org/users/paper-pdfs/NatureGenetics_CPLANE_2016.pdf
- reference_id: PMID:31004438
  selected_cache: publications/PMID_31004438.md
  cache_sha256: 98f06eb904e69e16512f6546fe2d5f241dd07ca620b235b0f21b4769cebfcc7c
  cache_full_text_available: false
  review_full_text_unavailable: true
  public_original: https://www.researchgate.net/publication/332542172
  doi: https://doi.org/10.1002/ana.25491
  read_scope: Original abstract and Figures 1–5 captions/first-page preview only; full Methods/Results
    unavailable.
  interpretation: The complete abstract and original Figures 1–5 captions/first-page preview were recovered
    and read, but the full Methods/Results were not obtained. Captions distinguish endogenous human HeLa
    kinetochore staining and JBTS17 immunoprecipitation from tagged full-length/JCD constructs, and human
    RPE1 ciliation from mouse spheroid/neurodevelopment contexts. Exact fragment boundaries and detailed
    antibody controls remain unassessed.
- reference_id: PMID:35582950
  selected_cache: publications/PMID_35582950.md
  cache_sha256: 1d0e83097dae00b4d5ae71c95ab72ec20dad305f5f94dd449ca9dff705b94103
  cache_full_text_available: true
  review_full_text_unavailable: false
  public_original: https://pmc.ncbi.nlm.nih.gov/articles/PMC9170817/
  doi: https://doi.org/10.1111/jcmm.17326
  read_scope: Original main text and captions, including Results/Figure 2 and cell-culture Methods.
  interpretation: The original main text and captions were read. Human family sequencing is distinct from
    mouse NIH/3T3 siRNA ciliation, migration and Hedgehog-readout experiments. Ciliary tubulin staining
    is not localization of CPLANE1 itself. The paper contains inconsistent narrative wording about Ptch1;
    no directional Ptch1 mechanism is assigned here.
- reference_id: PMID:40593758
  selected_cache: publications/PMID_40593758.md
  cache_sha256: 295706b4649df722af4beda8f1e7bb2c09493dd2c6c15d088bd1991368b59d34
  cache_full_text_available: true
  review_full_text_unavailable: false
  public_original: https://pmc.ncbi.nlm.nih.gov/articles/PMC12219219/
  doi: https://doi.org/10.1038/s41467-025-61005-8
  read_scope: 'Results: RSG1 and JBTS17 variants disrupt basal body docking; target Jbts17 paragraph and
    relevant imaging/construct Methods. Human RSG1 and mouse Fuz/Intu scope kept distinct.'
  interpretation: Published original target Results and relevant Methods/captions were read. Xenopus Jbts17
    depletion impairs basal-body docking, with wild-type but not Arg1569* rescue. Human transition-zone
    experiments target RSG1; mouse experiments target Fuz/Intu. Those data are not reassigned to human
    CPLANE1. The subsequent correction concerns author metadata.
