location_refinement_assessment:
  assessed_at: '2026-10-12'
  row: 0
  action: MODIFY
  proposed_replacement_terms:
  - id: GO:0035869
    label: ciliary transition zone
  - id: GO:0036064
    label: ciliary basal body
  reason: The UniProt cilium vocabulary mapping is sound but broader than two supported locations. Mouse
    Jbts17 immunostaining, NPHP1 colocalization and siRNA validation in PMID:25877302 support the transition
    zone, corroborating the existing accepted IBA. In PMID:27158779, full-length Xenopus GFP-Jbts17 forms
    a ring around centrin4-marked basal bodies; depletion and rescue experiments place recruitment of
    selected CPLANE components and peripheral IFT-A proteins at that site. Add ciliary basal body alongside
    transition zone to represent this supported core location. These are ortholog-level localization contexts,
    not a direct human localization experiment or an exclusive-compartment claim. The human patient-fibroblast
    experiment establishes impaired ciliogenesis. The separate wheat-germ binding construct comprises
    Jbts17 residues 907–1569 and is not the full-length localization construct.
  scope: The five original source objects, all actions, both products, references, core/MF_DARK and existing
    quote accounting are unchanged. This additive assessment interprets the existing raw source sections;
    no NEW row.
  primary_locators:
  - reference_id: PMID:25877302
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4476446/
    section: Results associated with Figure 5; Methods for target-antibody validation and siRNA controls
    species: mouse IMCD3 localization; human fibroblast ciliogenesis is a separate assay
  - reference_id: PMID:27158779
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4978421/
    section: Results associated with Figure 2g–h and Figure 3 (XML paragraphs P12–P16); Online Methods
      for tagged constructs and wheat-germ binding preparations
    species_construct: Full-length Xenopus GFP-Jbts17 localization and rescue; separate wheat-germ fragment
      907–1569 binding
  ontology_scope: Both locations are current cilium components in the saved definitions/typed ancestry.
    Basal body is newly represented in the replacement list; transition zone also remains independently
    accepted as IBA.
  complex_question: How should the CPLANE1–INTU–FUZ–WDPCP module be represented, and which components
    and stoichiometries form a stable complex rather than condition-dependent associations?
  search_limit: Zero hits for a literal CPLANE search is not a proof of ontology-wide absence.
  qualifier_disposition: Ordinary source relationship strings remain exact and are not biological decision
    premises; unknown molecular activity does not invalidate positive localization.
