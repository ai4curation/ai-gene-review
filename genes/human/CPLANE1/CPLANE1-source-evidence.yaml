- query: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO%3A0036064
  response_sha256: a46ec61de8aae27f02aa4e0147844ae49f2f73217b9a45e6204c490536d559bf
  definition_response:
    numberOfHits: 1
    results:
    - id: GO:0036064
      isObsolete: false
      name: ciliary basal body
      definition:
        text: A membrane-tethered, short cylindrical array of microtubules and associated proteins found
          at the base of a eukaryotic cilium (also called flagellum) that is similar in structure to a
          centriole and derives from it. The cilium basal body is the site of assembly and remodeling
          of the cilium and serves as a nucleation site for axoneme growth. As well as anchoring the cilium,
          it is thought to provide a selective gateway regulating the entry of ciliary proteins and vesicles
          by intraflagellar transport.
        xrefs:
        - dbCode: PMID
          dbId: '21750193'
      comment: In most eukaryotic cells, 'ciliary basal body' (GO:0036064) and 'centriole' (GO:0005814)
        represent a common entity that cycles through its function in cell division, then ciliogenesis,
        then cell division again. However, these structures are modified extensively as they transition
        into each other, and may contain different proteins, specific to each component.
      synonyms:
      - name: basal body
        type: broad
      - name: cilial basal body
        type: exact
      - name: cilium basal body
        type: exact
      - name: kinetosome
