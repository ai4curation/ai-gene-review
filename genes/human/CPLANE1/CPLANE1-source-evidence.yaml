- query: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO%3A0035869
  response_sha256: 53717c0b5d03b56da3697589e576a8a14f0ec5ea563d3531e2ea9e501533981c
  definition_response:
    numberOfHits: 1
    results:
    - id: GO:0035869
      isObsolete: false
      name: ciliary transition zone
      definition:
        text: A region of the cilium between the basal body and proximal segment that is characterized
          by Y-shaped assemblages that connect axonemal microtubules to the ciliary membrane. The ciliary
          transition zone appears to function as a gate that controls ciliary membrane composition and
          separates the cytosol from the ciliary plasm.
        xrefs:
        - dbCode: PMID
          dbId: '21422230'
      comment: Depending on the species, this region may have a distinct geometrically shaped electron-dense
        structure within the axonemal lumen visible in electron microscopy images; most animals don't
        display this inner structure. The axoneme extends through the ciliary transition zone, but only
        consists of the outer doublets. The central pair, axonemal spokes, and dynein complexes are not
        found in this part of the ciliary shaft. Note that the connecting cilium of the photoreceptor
        cells is thought to be equivalent to the transition zone.
      synonyms:
      - name: cilial transition zone
        type: exact
      - name: cilium transition zone
        type: exact
