- id: PMID:18307834
  title: Cathepsin C propeptide interacts with intestinal alkaline phosphatase and
    heat shock cognate protein 70 in human Caco-2 cells.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly cited for GO:0002020 protease binding. Immunoprecipitation and
      mass spectrometry in human Caco-2 cells identified IAP among cathepsin C
      propeptide partners, and pulse-chase showed the interaction accelerates IAP
      degradation. The finding is about how ALPI is regulated rather than about
      what ALPI does, and it rests on a single cell line, which is why the
      annotation is kept as non-core.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Rolland et al. binary yeast two-hybrid interactome. Correctly cited for the
      interactions it reports; the problem is interpretive. For ALPI it
      contributes two KRTAPs and NOTCH2NLA, none of which is a plausible partner
      for a brush-border ectoenzyme, and none has been independently validated.
- id: PMID:2841341
  title: Sequence and characterization of the human intestinal alkaline phosphatase
    gene.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The gene-defining paper for ALPI: complete genomic sequence, 11-exon
      structure, promoter characterisation, and the demonstration that intron
      positions are shared across the intestinal, placental and liver/bone/kidney
      genes. Cited in GOA only as an NAS source for the enzymatic activity, but its
      lasting value is in establishing the common ancestry and chromosomal
      arrangement that make isozyme misattribution such a persistent hazard in
      this family.
- id: PMID:29567797
  title: Human ALPI deficiency causes inflammatory bowel disease and highlights a key
    mechanism of gut homeostasis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The single most informative paper on human ALPI, and conspicuously absent
      from GOA's annotation set for this gene. Biallelic loss-of-function variants
      in two unrelated patients cause severe inflammatory bowel disease; every
      variant was reconstituted in HEK293T cells and shown to impair stability,
      dimerization, catalytic activity, surface expression or GPI anchoring, LPS
      dephosphorylating activity was measured directly, ALPI staining was reduced
      in patient biopsies, and faecal ALPI activity was undetectable in the
      deficient patient. Full text available and verified. Four of the five
      proposed new annotations rest on it.
- id: PMID:31515488
  title: Extensive disruption of protein interactions by genetic variants across the
    allele frequency spectrum in human populations.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      A yeast two-hybrid study of how coding variants perturb interactions.
      Correctly cited, but for ALPI it re-detects a single partner already
      reported in the same assay format by PMID:25416956, so it adds assay
      reproducibility rather than biological support.
- id: Reactome:R-HSA-8878787
  title: ALPI dimer hydrolyses phosphate monoesters
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction for ALPI's chemistry at the plasma membrane; the basis of
      one of the TAS plasma membrane rows. Two details of the cached entry are
      worth noting. Its name treats the dimer as the catalytic entity, which is
      independent support for the proposed GO:0042803 homodimerization
      annotation. And its summary states that ALPI "has no specific physiological
      substrate defiend for it yet" -- a curator's assessment that predates the
      Parlato et al. work establishing lipid A as the physiologically decisive
      substrate, so this Reactome text should not be read as current.
- id: Reactome:R-HSA-8940388
  title: GPLD1 hydrolyses GPI-anchors from proteins
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Documents the GPI-anchor cleavage that releases anchored proteins from the
      membrane. More consequential for ALPI than for the other isozymes, since
      release into the gut lumen is how this enzyme reaches its physiological
      substrate rather than merely a route into serum.
- id: file:human/ALPI/ALPI-deep-research-falcon.md
  title: 'Deep research report: human ALPI / intestinal alkaline phosphatase (IAP)'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Automated literature synthesis (Edison/falcon provider). Used here for its
      account of ALPI's substrate range beyond lipid A -- ATP, ADP, AMP and UDP --
      and for the point that ALPL upregulation does not rescue luminal function in
      ALPI-deficient intestine. Its central claims were checked against the
      primary Parlato et al. paper rather than accepted on their own. It correctly
      flags that clinical trials of exogenous alkaline phosphatase use bovine or
      engineered enzymes and should not be read as evidence about native ALPI.
