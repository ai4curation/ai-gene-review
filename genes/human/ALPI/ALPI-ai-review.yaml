- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  review:
    summary: >-
      Three hits from the Rolland et al. binary interactome map: KRTAP10-8
      (P60410), KRTAP10-9 (P60411) and NOTCH2NLA (Q7Z3S9). Two of the three are
      keratin-associated proteins, among the most frequently recovered and least
      interpretable classes of yeast two-hybrid partner.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0005515 without a functional interpretation is uninformative by the
      project's curation standard, and the specific partner list gives no reason
      to think otherwise here. Hair-matrix KRTAPs and a nucleus-adjacent
      NOTCH2NL paralogue have no plausible route to encountering a GPI-anchored
      brush-border ectoenzyme. The screen is a legitimate resource, but these rows
      should not be read as evidence that ALPI has a protein-binding function.
      Note the contrast with the two annotations that do concern real ALPI
      protein-protein contacts: the cathepsin C propeptide interaction below, and
      the homodimerization proposed as a new annotation.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:31515488
  qualifier: enables
  review:
    summary: >-
      A single NOTCH2NLA (Q7Z3S9) interaction from a yeast two-hybrid study
      designed to measure how coding variants disrupt interactions, rather than to
      discover new biology about either partner.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Same assessment as the other interactome row, and this one adds only a
      redundant re-detection of a partner already reported by PMID:25416956 in the
      same assay format. Re-detection in a second two-hybrid screen raises
      confidence that the pair interacts under assay conditions, not that they
      meet in an enterocyte.
