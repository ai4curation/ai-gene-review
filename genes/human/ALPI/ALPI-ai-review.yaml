- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-8940388
  qualifier: located_in
  review:
    summary: >-
      From the Reactome reaction in which GPLD1 cleaves GPI anchors, releasing
      anchored proteins from the membrane. For ALPI this is not merely a
      biochemical possibility but the physiological route to its main site of
      action: the enzyme is shed from the brush border into the gut lumen, and
      faecal ALPI activity is the assay used to demonstrate deficiency in patients.
    action: ACCEPT
    reason: >-
      Unusually load-bearing for a term that is generic elsewhere in this family.
      Luminal, released ALPI is what encounters microbiota-derived LPS, so the
      extracellular pool is a genuine functional compartment for this isozyme
      rather than a by-product, and its absence from stool is the clinical readout
      of ALPI deficiency.
    additional_reference_ids:
    - PMID:29567797
    supported_by:
    - reference_id: PMID:29567797
      supporting_text: >-
        ALPI is produced in the intestinal brush border and released in an active
        form into the intestinal lumen where it can dephosphorylate
        microbiota-derived LPS and thereby considerably reduces its TLR4 agonist
        activity.
