- term:
    id: GO:0002020
    label: protease binding
  evidence_type: IPI
  original_reference_id: PMID:18307834
  qualifier: enables
  review:
    summary: >-
      Interaction with cathepsin C (DPP1, P80067) demonstrated in human Caco-2
      intestinal epithelial cells by immunoprecipitation and mass spectrometry.
      The interaction is specifically with the cathepsin C propeptide, and its
      functional consequence is on ALPI rather than on the protease: propeptide
      overexpression accelerated ALPI degradation, reducing IAP protein and
      activity without changing its transcript level.
    action: KEEP_AS_NON_CORE
    reason: >-
      A real, directed experiment in a physiologically appropriate human cell
      type, and the one protein-interaction row for this gene that is worth
      keeping -- unlike the two-hybrid rows above. It is non-core because ALPI is
      the target of this interaction rather than the agent: the finding concerns
      how ALPI is sorted and degraded, not what ALPI does. A curator wanting to
      capture the biology could add a regulation-of-protein-catabolism term to
      cathepsin C rather than expanding ALPI's annotation.
    supported_by:
    - reference_id: PMID:18307834
      supporting_text: >-
        Cathepsin C propeptide interacted with proteins with a molecular mass of
        approximately 70 kDa, including IAP and heat shock cognate protein 70.
    - reference_id: PMID:18307834
      supporting_text: >-
        Pulse-chase analysis confirmed that the reduction in IAP activity was due
        to an increase in IAP degradation, but not a decrease in IAP expression.
- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      Sequence-similarity transfer of the catalytic magnesium site from mouse
      intestinal AP (P15693). UniProt places the coordinating residues at 61, 174
      and 330 in human ALPI.
    action: ACCEPT
    reason: >-
      Magnesium is one of the three catalytic metals of the alkaline phosphatase
      active site and is required for activity, so this is a genuine molecular
      function. The transfer is safe: the metal-coordinating residues are the most
      strongly conserved positions in the family, and human ALPI shares roughly 90
      percent exonic identity with its human paralogues, whose metal sites are
      resolved crystallographically.
- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      Sequence-similarity transfer of the core catalytic function from mouse
      intestinal AP, duplicating the IBA, IEA and NAS rows.
    action: ACCEPT
    reason: >-
      Correct, and independently established for the human protein by direct
      assay, so nothing rests on the similarity argument alone.
- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  review:
    summary: >-
      Sequence-similarity transfer of the two catalytic zinc sites, whose
      coordinating residues UniProt places at 61, 111, 334, 338, 375, 376 and 451
      in human ALPI.
    action: ACCEPT
    reason: >-
      The binuclear zinc centre performs the chemistry, polarising the substrate
      phosphate and activating the serine nucleophile, so this is core to the
      catalytic function rather than incidental metal association. Zinc dependence
      is also what the comparative enzymology of this family is built on.
- term:
    id: GO:0016311
    label: dephosphorylation
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  review:
    summary: >-
      The root-level biological process corresponding to the enzyme's chemistry,
      transferred by sequence similarity. It is the only process term GOA gives
      ALPI, which leaves the gene's actual biology -- luminal LPS detoxification
      and restraint of TLR4 signalling -- entirely unannotated.
    action: KEEP_AS_NON_CORE
    reason: >-
      Not wrong, but nearly contentless: "dephosphorylation" restates the
      molecular function as a process and would be true of any phosphatase. It is
      kept rather than removed because it is accurate and because removing it
      would leave the gene with no process annotation at all, but the substantive
      remedy is the two process annotations proposed below, which record what ALPI
      dephosphorylates and to what end.
- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: NAS
  original_reference_id: PMID:2841341
  qualifier: enables
  review:
    summary: >-
      Non-traceable author statement from the paper that isolated and sequenced
      the human intestinal alkaline phosphatase gene, establishing its 11-exon
      structure and its shared ancestry with the placental and liver/bone/kidney
      genes.
    action: ACCEPT
    reason: >-
      A weak evidence code on a correct and foundational claim: this is the paper
      that defined the gene. The activity is independently established by direct
      assay, so nothing rests on the NAS. The paper is also worth retaining for
      the isozyme-discrimination problem that pervades this family, since it
      establishes that the four ALP genes arose from one ancestral gene and that
      three of them are linked on chromosome 2.
    supported_by:
    - reference_id: PMID:2841341
      supporting_text: >-
        Introns in intestinal, placental, and liver/bone/kidney ALPs occur at
        analogous positions (see accompanying articles), confirming that these
        genes arose from a single ancestral ALP gene.
- term:
    id: GO:0008653
    label: lipopolysaccharide metabolic process
  evidence_type: IMP
  original_reference_id: PMID:29567797
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation, and the most important gap in this gene's record.
      ALPI's defining activity is removal of phosphate from the lipid A moiety of
      lipopolysaccharide, and Parlato et al. measured exactly this: LPS
      dephosphorylating activity of wild-type versus patient-mutant ALPI in
      HEK293T cells, with loss of function in every mutant tested and no
      detectable ALPI activity in the deficient patient's stool.
    action: NEW
    reason: >-
      As it stands GOA describes ALPI only as a phosphatase that dephosphorylates
      things, with no record that its substrate is a bacterial glycolipid or that
      its physiological setting is the gut lumen. GO:0008653 is the right term and
      has a close precedent in human: AOAH, the other host enzyme that chemically
      modifies LPS to detoxify it, carries it with IDA evidence. The evidence code
      is IMP because the demonstration runs through loss-of-function variants and
      their reconstitution rather than through purified enzyme kinetics.
    supported_by:
    - reference_id: PMID:29567797
      supporting_text: >-
        ALPI encodes for intestinal phosphatase alkaline, a brush border
        metalloenzyme that hydrolyses phosphate from the lipid A moiety of
        lipopolysaccharides and thereby drastically reduces Toll-like receptor 4
        agonist activity.
    - reference_id: PMID:29567797
      supporting_text: >-
        To measure the LPS dephosphorylating activity of ALPI, HEK293T cells
        expressing WT and mutant forms of ALPI were first incubated with LPS 100
        ng/ml.
- term:
    id: GO:0034144
    label: negative regulation of toll-like receptor 4 signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:29567797
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation capturing the consequence of the reaction above.
      Bisphosphorylated lipid A is a potent TLR4 agonist; removing a phosphate
      converts it to a much weaker one, so ALPI acts as a negative regulator of
      TLR4 signalling by chemically disarming the ligand. Every patient variant
      tested was unable to detoxify LPS-dependent signalling, and the clinical
      consequence was severe inflammatory bowel disease.
    action: NEW
    reason: >-
      This is the biological process for which ALPI has the strongest causal
      evidence of any kind -- human Mendelian genetics with functional
      reconstitution -- yet GOA records none of it. Acting on the ligand rather
      than on the receptor or its transducers is well precedented for this term in
      human: BPIFB1, a secreted LPS-binding protein, carries GO:0034144 with IDA
      evidence, and the mechanism here is more direct still, since ALPI covalently
      alters the agonist. IMP is the correct code, resting on biallelic
      loss-of-function alleles plus in vitro reconstitution of each variant.
    supported_by:
    - reference_id: PMID:29567797
      supporting_text: >-
        ALPI mutations impaired either stability or catalytic activity of ALPI and
        rendered it unable to detoxify lipopolysaccharide-dependent signalling.
    - reference_id: PMID:29567797
      supporting_text: >-
        Our findings highlight the crucial role of ALPI in regulating
        host-microbiota interactions and restraining host inflammatory responses.
- term:
    id: GO:0031526
    label: brush border membrane
  evidence_type: TAS
  original_reference_id: PMID:29567797
  qualifier: located_in
  review:
    summary: >-
      Proposed new annotation. What makes ALPI the intestinal isozyme is not that
      it sits in a plasma membrane -- so do all four paralogues -- but that it is
      concentrated at the apical brush border of enterocytes, from which it is
      shed into the lumen. GOA records only the generic plasma membrane.
    action: NEW
    reason: >-
      The brush border is the compartment that makes ALPI's biology work: it puts
      the enzyme at the interface between the epithelium and the luminal bacterial
      load, which is what allows it to act on microbiota-derived LPS before that
      LPS engages TLR4. GO:0031526 is a descendant of GO:0016020 and is
      well-populated for human intestinal brush-border proteins, so it conflicts
      with nothing already annotated. TAS is the honest evidence code here: the
      localisation is stated as established background in this paper rather than
      demonstrated by a new experiment in it, and the supporting imaging in the
      primary literature predates it.
    supported_by:
    - reference_id: PMID:29567797
      supporting_text: >-
        ALPI is produced in the intestinal brush border and released in an active
        form into the intestinal lumen where it can dephosphorylate
        microbiota-derived LPS and thereby considerably reduces its TLR4 agonist
        activity.
- term:
    id: GO:0009897
    label: external side of plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:29567797
  qualifier: located_in
  review:
    summary: >-
      Proposed new annotation. GOA records which membrane ALPI is in but not which
      face of it, even though ecto-orientation is what makes the enzyme able to act
      on luminal substrates. Parlato et al. show the mature enzyme is a dimer of
      two processed subunits held at the cell surface by a post-translationally
      added GPI anchor, and that the Q439X truncation, which removes the GPI
      signal, is undetectable at the surface by flow cytometry.
    action: NEW
    reason: >-
      The GPI anchor places the whole mature protein on the exoplasmic leaflet,
      which is why ALPI can dephosphorylate LPS and nucleotides that never enter
      the cell, and why phospholipase cleavage releases active enzyme into the
      lumen. GO:0009897 is a descendant of GO:0005886 and so is consistent with
      every existing location row. The same annotation is proposed for ALPL, ALPP
      and ALPG, since ecto-orientation is common to the whole family, but here it
      is supported by direct human cell-surface measurement rather than by
      sequence prediction.
    supported_by:
    - reference_id: PMID:29567797
      supporting_text: >-
        As expected, given the lack of a GPI anchoring site at the CT domain, the
        Q439X truncated protein was undetectable at the cell surface by flow
        cytometry (Fig 3B).
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: IMP
  original_reference_id: PMID:29567797
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. Active ALPI is a homodimer of two identically
      processed subunits, and dimerization is a functional requirement rather than
      an incidental oligomeric state: patient variants were predicted to disrupt
      inter-subunit interactions, and the Q439X truncation was shown to have
      impaired dimerization and reduced stability.
    action: NEW
    reason: >-
      Normally a protein-binding term would not earn a place, but the dimer is
      mechanistically load-bearing across this whole family -- in ALPP the crystal
      structure attributes mammalian-specific allostery to the interface, and in
      ALPL monomeric mutants are catalytically dead and act dominant-negatively.
      For ALPI specifically it is one of the two mechanisms by which disease
      alleles destroy function, the other being direct active-site damage, so
      recording it explains part of the mutational spectrum. It also gives a
      concrete contrast to the two uninformative GO:0005515 two-hybrid rows.
    supported_by:
    - reference_id: PMID:29567797
      supporting_text: >-
        Active ALPI consists of two identically processed subunits (each lacking
        the first 19 and last 24 aa) bound to the cell surface via a
        post-translationally added GPI anchor (Fig 2D).
    - reference_id: PMID:29567797
      supporting_text: >-
        dimerization of the truncated Q439X mutant and affect protein stability
        (Fig 3D, centre).
core_functions:
- description: >-
    ALPI is a GPI-anchored, homodimeric, Zn/Zn/Mg-dependent alkaline
    phosphomonoesterase displayed on the external face of the enterocyte brush
    border and shed in active form into the gut lumen. There it removes phosphate
    from the lipid A moiety of microbiota-derived lipopolysaccharide, converting
    the strongly TLR4-stimulatory bisphosphorylated species into a much weaker
    agonist and so restraining host inflammatory responses to the commensal
    bacterial load. Biallelic loss of function causes Mendelian inflammatory bowel
    disease, and upregulated ALPL does not substitute for it in this compartment.
  molecular_function:
    id: GO:0004035
    label: alkaline phosphatase activity
  directly_involved_in:
  - id: GO:0008653
    label: lipopolysaccharide metabolic process
  - id: GO:0034144
    label: negative regulation of toll-like receptor 4 signaling pathway
  locations:
  - id: GO:0031526
    label: brush border membrane
  - id: GO:0009897
    label: external side of plasma membrane
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:29567797
    supporting_text: >-
      ALPI encodes for intestinal phosphatase alkaline, a brush border
      metalloenzyme that hydrolyses phosphate from the lipid A moiety of
      lipopolysaccharides and thereby drastically reduces Toll-like receptor 4
      agonist activity.
  - reference_id: PMID:29567797
    supporting_text: >-
      Herein, we report the first identification of biallelic-inherited mutations
      in ALPI as a Mendelian cause of inflammatory bowel disease in two unrelated
      patients.
  - reference_id: file:human/ALPI/ALPI-deep-research-falcon.md
    supporting_text: >-
      Upregulation of TNAP in ALPI-deficient intestine did not restore luminal
      ALPI function, supporting functional non-equivalence in this compartment.
proposed_new_terms: []
suggested_questions:
- question: >-
    How much of ALPI's protective effect in the gut is attributable to lipid A
    dephosphorylation as opposed to hydrolysis of luminal nucleotides? Both
    activities are documented and both are anti-inflammatory, one through TLR4 and
    the other through purinergic signalling, but no experiment has separated them.
    A separation-of-function allele that retained nucleotide hydrolysis while
    losing lipid A activity would settle it.
- question: >-
    Why does compensatory ALPL upregulation fail to substitute for ALPI in the
    intestine? Both enzymes are GPI-anchored alkaline phosphatases with the same
    catalytic machinery, so the answer presumably lies in localisation, luminal
    stability, or substrate preference at the relevant pH rather than in
    chemistry. Distinguishing these would clarify how much of isozyme identity in
    this family is catalytic and how much is contextual.
- question: >-
    What is the population-level contribution of ALPI variants to inflammatory
    bowel disease? The Mendelian cases establish non-redundancy in at least some
    people, but penetrance and the effect of hypomorphic or heterozygous alleles
    on common IBD risk remain undefined.
- question: >-
    Does the cathepsin C propeptide interaction represent a genuine physiological
    control point for brush-border ALPI abundance, or a phenomenon specific to
    Caco-2 cells? If real, protease-driven ALPI turnover would be a candidate
    mechanism for the reduced ALPI seen in inflamed intestine.
suggested_experiments:
- hypothesis: >-
    ALPI's lipid A dephosphorylating activity, rather than its general
    phosphatase activity, is what protects against intestinal inflammation.
  description: >-
    Use the structural models from the ALPI deficiency study to design variants
    that separate lipid A hydrolysis from pNPP and nucleotide hydrolysis, then
    reconstitute each in ALPI-deficient intestinal organoids and measure TLR4
    activation, barrier integrity and inflammatory cytokine output on defined LPS
    chemotypes. This tests the causal chain directly rather than inferring it from
    total enzyme loss, which is all the existing patient alleles support.
  experiment_type: structure-guided separation-of-function analysis in organoids
- hypothesis: >-
    ALPL cannot substitute for ALPI in the gut lumen because it is not delivered
    to or retained in the same compartment, not because it lacks the catalytic
    capability.
  description: >-
    Express ALPL under ALPI's own regulatory and targeting context in
    ALPI-deficient intestinal epithelium, and conversely express ALPI in a
    TNAP-dependent setting, then measure luminal enzyme output, LPS
    dephosphorylation and inflammation. Comparing chimeras that swap the crown
    domain and the C-terminal GPI signal would show whether the non-equivalence is
    a targeting or a catalytic property.
  experiment_type: isozyme swap and domain chimera analysis
- hypothesis: >-
    Cathepsin C-driven degradation is a physiological regulator of brush-border
    ALPI levels.
  description: >-
    Test whether cathepsin C loss or inhibition raises brush-border ALPI protein
    and faecal ALPI activity in primary human intestinal organoids and in mouse
    intestine, and whether the propeptide interaction reported in Caco-2 cells is
    recovered by proximity labelling in primary epithelium. A positive result
    would turn a single-cell-line observation into a regulatory mechanism worth
    annotating on cathepsin C.
  experiment_type: genetic and pharmacological perturbation in primary epithelium
references:
- id: GO_REF:0000002
