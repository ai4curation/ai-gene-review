id: P09923
gene_symbol: ALPI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ALPI encodes intestinal alkaline phosphatase (IAP), the brush-border member of
  the human alkaline phosphatase family. Like its paralogues it is a homodimeric,
  GPI-anchored metalloenzyme with two Zn(2+) and one Mg(2+) per active site,
  displayed on the outer leaflet of the plasma membrane; the mature subunits lack
  the first 19 and last 24 residues of the precursor and are anchored through a
  glycolipid added at the C-terminus. Its distinguishing feature is where it works
  and what it acts on: it is concentrated at the apical brush border of
  enterocytes and is shed in active form into the gut lumen, where it strips
  phosphate from the lipid A moiety of bacterial lipopolysaccharide, converting
  the strongly TLR4-stimulatory bisphosphorylated form into a much weaker agonist.
  It also dephosphorylates luminal extracellular nucleotides including ATP, ADP
  and AMP, damping pro-inflammatory purinergic signalling and favouring adenosine
  production. Human genetics gives this an unusually direct causal foundation:
  biallelic loss-of-function ALPI variants are a Mendelian cause of severe
  inflammatory bowel disease, with patient variants shown to impair stability,
  dimerization, catalytic activity, surface expression or GPI anchoring, and
  faecal ALPI activity absent in the deficient patient. Compensatory upregulation
  of tissue-nonspecific ALPL in the ALPI-deficient intestine did not restore
  luminal function, so the two enzymes are not interchangeable in this
  compartment. ALPI therefore sits at the interface of diet, microbiota and innate
  immunity, restraining host inflammatory responses to the commensal bacterial
  load.
existing_annotations:
- term:
    id: GO:0004035
    label: alkaline phosphatase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      The core molecular function, placed by PAINT at a deep node of the alkaline
      phosphatase family whose donors span E. coli PhoA, yeast, fly, fish and all
      four human isozymes. Directly confirmed for human ALPI by p-nitrophenyl
      phosphate assays of wild-type and patient-mutant protein expressed in
      HEK293T cells (PMID:29567797).
    action: ACCEPT
    reason: >-
      Correct, ancestral, and at the right level of specificity. The IBA names the
      chemistry without committing to a substrate, which is appropriate given that
      ALPI's physiologically decisive substrates -- lipid A and luminal nucleotides
      -- are specific to this isozyme rather than to the family node.
    supported_by:
    - reference_id: PMID:29567797
      supporting_text: >-
        Phosphatase activity was measured in cell lysates of HEK293T cells
        expressing WT and mutant forms of ALPI by assessing p-nitrophenyl
        phosphate (pNPP) dephosphorylation using Alkaline Phosphatase Assay Kit
        (ab83369, Abcam) according to the manufacturer's instructions.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      ALPI is GPI-anchored on the outer leaflet of the enterocyte plasma membrane
      with its catalytic domain facing the lumen, so the plasma membrane is where
      it acts and is_active_in is the correct qualifier. Confirmed directly for
      the human protein by flow cytometry of wild-type and truncation mutants
      (PMID:29567797).
    action: ACCEPT
    reason: >-
      Correct, though it understates the case in two respects addressed by
      proposed annotations below: the enzyme is on the external face specifically,
      and it is concentrated at the brush border rather than distributed over the
      whole plasma membrane.
    supported_by:
    - reference_id: PMID:29567797
      supporting_text: >-
        Active ALPI consists of two identically processed subunits (each lacking
        the first 19 and last 24 aa) bound to the cell surface via a
        post-translationally added GPI anchor (Fig 2D).
