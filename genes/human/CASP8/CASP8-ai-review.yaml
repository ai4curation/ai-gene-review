- id: PMID:10442631
  title: 'PED/PEA-15: an anti-apoptotic molecule that regulates FAS/TNFR1-induced apoptosis.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract. Human MCF7/HeLa work reports PED/PEA15 coprecipitation with
      FLICE and competition experiments involving FADD. This supports association but does not alone resolve
      a purified two-protein interface or confer PEA15 antiapoptotic activity on CASP8.
- id: PMID:10521396
  title: Cleavage of the death domain kinase RIP by caspase-8 prompts TNF-induced apoptosis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and short abstract-like cached body read; the full_text_available
      flag overstates the actual extracted coverage. Supports CASP8-dependent RIP1 cleavage and TNF/NF-kappaB
      effects; no complete Methods/Results inspection claimed.
- id: PMID:10891503
  title: Identification of the cytolinker plectin as a major early in vivo substrate for caspase 8 during
    CD95- and tumor necrosis factor receptor-mediated apoptosis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and selected unique Methods, localization, fractionation, substrate-cleavage
      Results and Discussion read. Endogenous human-cell subunit localization is distinguished from recombinant
      rat plectin fragments and knockout-cell phenotype comparisons. Exact outer-membrane attachment partly
      invokes unpublished evidence; no universal localization claim.
- id: PMID:11101870
  title: Fas triggers an alternative, caspase-8-independent cell death pathway using the kinase RIP as
    effector molecule.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Complete abstract read; the exact CASP8 positive/control assays in the full paper remain
      uninspected. The alternative RIP-dependent caspase-independent pathway is not evidence that CASP8
      lacks its independently established DISC/apoptotic functions. No wrong-gene conclusion.
- id: PMID:11717445
  title: Caspase-10 is an initiator caspase in death receptor signaling.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract explicitly reports both CASP8 and CASP10 FADD/DED signaling. The CASP10
      title is not a target exclusion; target-specific full controls remain uninspected.
- id: PMID:12198154
  title: Caspase-10 is recruited to and activated at the native TRAIL and CD95 death-inducing signalling
    complexes in a FADD-dependent manner but can not functionally substitute caspase-8.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract; selected cached Results and IP Methods. Native CD95/TRAIL
      DISC experiments recruit CASP8 and FADD despite the title emphasizing CASP10. Ligand capture establishes
      complex association; extracellular FASLG is not thereby shown to contact cytosolic CASP8 directly.
- id: PMID:12761501
  title: Large-scale identification and characterization of human genes that activate NF-kappaB and MAPK
    signaling pathways.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Complete abstract establishes experimental human-cDNA signaling screens; the exact CASP8
      table/construct was not inspected. IEP is experimental rather than electronic. Independent prodomain
      evidence corroborates the direction without authenticating this screen entry.
- id: PMID:12884866
  title: Caspase-8 and caspase-10 activate NF-kappaB through RIP, NIK and IKKalpha kinases.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract; indexed original-paper Discussion/Methods in official grant archive;
      PDF figure screenshots timed out. GST experiments explicitly establish prodomain-only CASP8 binding to
      RIPK1 and NIK, unlike RICK or IKKalpha/beta. Both DED modules are required. Indexed original Discussion
      also reports TRAF2 interaction, but exact mouse-accession/construct mapping for P39429 and Q61160 was
      not established. Do not generalize the prodomain result to all intact isoforms. The cached abstract itself
      states the GST pull-down specificity; the external Methods section 4.2 supplies construct provenance,
      not a substitute for the abstract.
- id: PMID:12887920
  title: Induction of TNF receptor I-mediated apoptosis via two sequential signaling complexes.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract; indexed original publisher Results and Fig2C. Human HT1080
      signaling experiments distinguish TNFR1 complex I from a later CASP8/FADD/RIPK1/CASP10/FLIP-containing
      complex. Fig2C separately supplies a positive FasL-captured Fas DISC control with CASP8 recruitment.
      Do not mistake absence from TNFR1 complex I for absence from the Fas complex or infer direct ligand
      contact.
- id: PMID:12888622
  title: 'Caspase cleavage of tau: linking amyloid and neurofibrillary tangles in Alzheimer''s disease.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract; selected cached Methods/Results. Recombinant caspase assays
      include CASP8 cleavage of human tau, with the cleavage-site D421E mutant and enzyme-concentration
      controls. This supports a transient enzyme-substrate encounter, not a stable physiological tau complex
      or attribution of Alzheimer pathology specifically to CASP8. No finer binding term is proposed from
      cleavage alone.
- id: PMID:14612908
  title: Defects in death-inducing signalling complex formation prevent JNK activation and Fas-mediated
    apoptosis in DU 145 prostate carcinoma cells.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract; selected cached Methods/Results and Fig5 context. The negative
      DU145 result is accompanied by a positive Jurkat control showing FADD-associated CASP8 after Fas
      stimulation. The title/negative cell context must not erase that experimental binding evidence.
      Co-IP is not sufficient to identify an isolated interface.
- id: PMID:15069192
  title: Suppression of caspase-8- and -10-associated RING proteins results in sensitization to death
    ligands and inhibition of tumor cell growth.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract; selected cached Results and construct Methods. CARP1/RNF34
      interaction is supported by yeast assays and mammalian co-IP, with E3-inactive CARP constructs used
      to avoid loss of CASP8. CASP8 prodomains supply DEDs; this does not make CARP a demonstrated DED-bearing
      binding target or CASP8 an E3 ligase.
- id: PMID:15509781
  title: Calcium binding of ARC mediates regulation of caspase 8 and cell death.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract; selected cached Results. GST assays require intact ARC; neither
      isolated CARD nor the isolated P/E region reproduces full-length binding. Reciprocal endogenous
      HEK293 co-IP corroborates association, with calcium dependence. CARD-domain binding would therefore
      overstate the tested interface.
- id: PMID:16169070
  title: 'A human protein-protein interaction network: a resource for annotating the proteome.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Complete interaction-screen abstract read. Exact CASP8 self-pair is curator/UniProt
      supported and independently corroborated by target assembly experiments, but its original target
      table remains uninspected.
- id: PMID:16498403
  title: The role of receptor internalization in CD95 signaling.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract; indexed official primary Results and Fig1/5 captions. Control
      BJAB cells show CASP8 coprecipitation with CD95/CD95L complexes. Perturbing internalization reduces
      recruitment; fractionated experiments distinguish membrane and endosomal complexes. This supports
      receptor/ligand complex association but not direct CASP8-FASLG binding. Indexed text, rather than
      an inspected blot image, supplies the assay description.
- id: PMID:16916640
  title: 'Engineered hybrid dimers: tracking the activation pathway of caspase-7.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Canonical cache is abstract-only. Separately accessed author-hosted Stanford PDF Results,
      Figure 1 caption, kinetic table and Methods explicitly assay recombinant DED-deleted CASP8 activation
      of human procaspase-7. Optimized high-salt comparisons and activation-site mutants constrain interpretation.
      Supplements and raw figure images were not independently reanalysed. The short external Figure 1C anchor
      and exact primary PDF URL are recorded in the notes evidence-anchor appendix; supporting_text_fulltext
      is explicitly distinct from a cache-validated quotation.
- id: PMID:16920334
  title: Protective role of Cop in Rip2/caspase-1/caspase-4-mediated HeLa cell death.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Complete abstract foregrounds COP/RIP2/caspase-1/4; the original CASP8-specific control
      remains uninspected. No paralog misattribution is inferred. Independent target chemistry supports
      retention of the molecular function without claiming this assay was reverified.
- id: PMID:16936772
  title: Integrin-linked kinase interacts with caspase-9 and -8 in an adhesion-dependent manner for promoting
    radiation-induced apoptosis in human leukemia cells.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Complete cached abstract; original target-level binding assay remains uninspected. The
      abstract describes human HL60 ILK overexpression, adhesion, irradiation and caspase activation,
      but does not describe the exact CASP8-ILK interaction assay. The title alone cannot justify a finer
      binding term; ILK naming must not be used to infer kinase binding or transfer kinase activity.
- id: PMID:17047155
  title: Caspase-8 prevents sustained activation of NF-kappaB in monocytes undergoing macrophagic differentiation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract; indexed official Results/Methods/Fig3 and original-paper extraction.
      Differentiation-associated CASP8 complexes contain FADD, RIPK1 and FLIP. Fig3 includes apoptotic U937
      positive controls with TRAIL or agonistic Fas antibody; original Results describe receptor association
      in those controls. Absence of receptor association during differentiation does not contradict the positive
      controls. Exact O15519-1 source identity is preserved; no new isoform assignment is made. Short cached
      RIP1-cleavage and external Figure 3 positive-control anchors are distinguished in the notes evidence-anchor
      appendix.
- id: PMID:17159907
  title: Palmitoylation of CD95 facilitates formation of SDS-stable receptor aggregates that initiate
    apoptosis signaling.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract. The reported high-molecular-weight DISC contains CD95-associated
      FADD, CASP8, CASP10 and FLIP. This supports contextual coassociation without proving every pair
      is in direct contact or establishing a unique activity for the exact supplied FLIP isoform.
- id: PMID:17167422
  title: Hsp70 regulates erythropoiesis by preventing caspase-3-mediated cleavage of GATA-1.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Complete Hsp70/GATA1 abstract read, but CASP8 localization controls remain inaccessible.
      Independent target microscopy and cytosolic complex evidence support the compartments; this is not
      verification of the original target experiment.
- id: PMID:17170703
  title: A novel function of caspase-8 in the regulation of androgen-receptor-driven gene expression.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract. Human-library and target-motif interaction experiments identify
      CASP8-AR binding; mutations at interaction-critical residues disrupt the transcriptional effect.
      This supports nuclear androgen receptor binding. It does not require reclassifying CASP8 as a receptor
      or adding a new regulatory process.
- id: PMID:17245429
  title: FLASH links the CD95 signaling pathway to the cell nucleus and nuclear bodies.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract; selected cached Results and Methods. FLASH-CASP8 association
      is supported in transfected CV1 cells without adenoviral E1B19K and in endogenous human mitochondrial
      preparations. Construct Methods cite donated FLASH vectors but the exact mouse Q9WUF3 construct
      mapping was not resolved. Human and mouse partner rows must remain distinct; viral ternary-complex
      observations do not establish an endogenous human viral complex.
- id: PMID:17479112
  title: Ectopic expression of the serine protease inhibitor PI9 modulates death receptor-mediated apoptosis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract. Human PI9/SERPINB9 is reported to associate directly with
      an intermediate active CASP8 form; P1-site mutation affects its antiapoptotic effect. CASP8 is the
      inhibited enzyme, not the serpin inhibitor. This supports contextual binding without transfer of
      inhibitor function.
- id: PMID:18086677
  title: Dynamic regulation of neutrophil survival through tyrosine phosphorylation or dephosphorylation
    of caspase-8.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract. The source explicitly links CASP8 Tyr310 phosphorylation to
      SHP1 association and CASP8 dephosphorylation in neutrophil survival. Protein phosphatase binding
      is supported by target-specific association, not merely SHP1 identity. CASP8 supplies the phosphotyrosine;
      do not invert this into CASP8 phosphotyrosine binding or phosphatase activity.
- id: PMID:18216014
  title: Identification of a critical tyrosine residue in caspase 8 that promotes cell migration.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and selected full Methods/Results read. Human neuroblastoma CASP8
      reconstitution, Y380 and catalytic-site variants and imaging/migration assays separate recruitment
      from catalytic activity. No inference of a universal motility effect.
- id: PMID:18245485
  title: Inhibition of endoplasmic reticulum stress-induced apoptosis of melanoma cells by the ARC protein.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract. The abstract reports exogenous/endogenous ARC coprecipitation
      with CASP8 in the melanoma study. This supports association; it does not specify that ARC CARD alone
      is the binding interface or make CASP8 antiapoptotic.
- id: PMID:18309324
  title: 'No death without life: vital functions of apoptotic effectors.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Complete review abstract read; direct PMC access was challenged. Its exact lymphocyte
      and placental sections were not inspected. The lymphocyte and macrophage assertions have independent
      target support; the specific placental assertion remains unresolved.
- id: PMID:18328427
  title: Yes and PI3K bind CD95 to signal invasion of glioblastoma.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: Complete cached abstract; relevant original target assay not accessed. The accessible
      source foregrounds CD95/Yes/PI3K invasion signaling. The exact CASP8-FAS association assay remains
      uninspected. This is an access limit, not evidence of wrong-gene attribution, and does not justify
      removal.
- id: PMID:18387192
  title: A pathway sensor for genome-wide screens of intracellular proteolytic cleavage.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and selected unique Results/Methods read. CASP8 transfection stimulates
      a DEVDG reporter in human 293ET cells with concentration and no-cleavage-motif controls; downstream
      caspases may produce the readout. The experiment supports pathway proteolysis, not purified CASP8
      specificity.
- id: PMID:18485876
  title: TNF-alpha induces two distinct caspase-8 activation pathways.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract. Smac-mimetic experiments describe assembly of a CASP8-activating
      complex with FADD and RIPK1, distinguished from cycloheximide-associated signaling. This supports
      coassociation, not a purified binary kinase-binding interface.
- id: PMID:18846110
  title: Identification of an antiapoptotic protein complex at death receptors.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete cached abstract; indexed PubMed Fig7A caption and official primary Methods.
      TRAIL-R2 immunoprecipitation in stimulated sensitive MDA-MB-231 cells detects CASP8 and FADD; resistant
      cells differ. This directly establishes the human DR5-associated complex. It does not make CASP8
      a member of the unstimulated GSK3/DDX3/cIAP1 inhibitory cap or prove direct receptor contact.
- id: PMID:19060883
  title: ABIN-1 is a ubiquitin sensor that restricts cell death and sustains embryonic development.
  findings: []
