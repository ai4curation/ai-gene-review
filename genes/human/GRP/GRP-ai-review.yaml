- term:
    id: GO:0031989
    label: bombesin receptor signaling pathway
  evidence_type: IC
  original_reference_id: Reactome:R-HSA-375384
  qualifier: involved_in
  review:
    summary: >-
      Propose NEW annotation for bombesin receptor signaling pathway (GO:0031989); GRP is the
      canonical mammalian bombesin-like peptide ligand that activates GRPR to initiate this pathway.
    action: NEW
    reason: >-
      In human GOA, GO:0031989 (bombesin receptor signaling pathway) is annotated on the receptors
      GRPR, NMBR, and BRS3, but missing on the endogenous peptide ligands GRP and NMB (a Category A
      receptor-only pathway gap). Mature GRP(1-27) and neuromedin C (GRP-10) directly bind and
      activate GRPR to initiate the bombesin receptor signaling pathway.
    supported_by:
    - reference_id: Reactome:R-HSA-375384
      supporting_text: >-
        Bombesin-like receptors are widely distributed in the CNS as well as in the GI tract where
        they modulate smooth-muscle contraction, exocrine and endocrine processes, metabolism, and
        behaviour through the binding of bombesin-like peptides. They include gastrin-releasing
        peptide receptor (GRP-R), neuromedin B receptor (NMB-R) (Corjay MH et al, 1991) and
        bombesin-like receptor-3 (BRS-3) (Fathi Z et al, 1993).
core_functions:
- description: >-
    Secreted bombesin-like neuropeptide hormone that binds and activates the Gq/11-coupled
    gastrin-releasing peptide receptor (GRPR) on target neuroendocrine, smooth muscle, and neuronal
    cells to initiate the bombesin receptor signaling pathway and stimulate phospholipase C-beta
    signaling.
  molecular_function:
    id: GO:0005184
    label: neuropeptide hormone activity
  directly_involved_in:
  - id: GO:0031989
    label: bombesin receptor signaling pathway
  - id: GO:0007218
    label: neuropeptide signaling pathway
  - id: GO:0007200
    label: phospholipase C-activating G protein-coupled receptor signaling pathway
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0034774
    label: secretory granule lumen
