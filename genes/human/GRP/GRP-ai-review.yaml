id: P07492
gene_symbol: GRP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Gastrin-releasing peptide (GRP) is a secreted bombesin-like neuropeptide and gut-brain hormone
  synthesized as a preprohormone and processed by dibasic cleavage and C-terminal alpha-amidation
  into the 27-amino-acid peptide GRP(1-27) and the decapeptide neuromedin C (GRP-10). Released
  from neuroendocrine cells and peptidergic neurons into the extracellular space, GRP binds and
  activates the Gq/11-coupled gastrin-releasing peptide receptor (GRPR) to initiate the bombesin
  receptor signaling pathway, stimulating phospholipase C-beta, intracellular calcium mobilization,
  gastrointestinal hormone release, smooth muscle contraction, and sensory neurotransmission.
