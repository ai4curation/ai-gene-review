suggested_questions:
- question: >-
    Should PAINT annotate GO:0031989 (bombesin receptor signaling pathway) directly at the
    jawed-vertebrate root PTN008565241 of PANTHER:PTHR16866 alongside GO:0007218 (neuropeptide
    signaling pathway)?
- question: >-
    Should PAINT annotate the existing GO term GO:0031709 (gastrin-releasing peptide receptor
    binding, child of GO:0031705 bombesin receptor binding) at the GRP subfamily clade
    PTN002704045 (PANTHER:PTHR16866:SF2) parallel to its annotation of GO:0031710 (neuromedin B
    receptor binding) at the NMB subfamily clade PTN002704034 (PANTHER:PTHR16866:SF3)?
suggested_experiments:
- description: >-
    Determine high-resolution cryo-EM structures of human GRPR bound to full-length GRP(1-27)
    versus the decapeptide neuromedin C (GRP-10) in complex with heterotrimeric Gq to define how
    the N-terminal extension of GRP(1-27) modulates receptor residence time and signaling efficacy.
  hypothesis: >-
    The conserved C-terminal decapeptide (GRP-10) occupies the orthosteric transmembrane pocket of
    GRPR similarly to neuromedin B in NMBR, whereas the N-terminal 17 residues of GRP(1-27) form
    additional contacts with the extracellular loops of GRPR.
