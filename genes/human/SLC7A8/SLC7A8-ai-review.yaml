core_functions:
- description: Catalytic light chain of the LAT2-4F2hc heteromeric amino-acid transporter; an
    obligate, Na+-independent 1:1 antiporter that exchanges a broad range of small and large neutral
    (zwitterionic) L-amino acids across the plasma membrane. High extracellular / low intracellular
    affinity means it equilibrates relative amino-acid concentrations rather than producing net uptake.
    It is disulfide-linked to and dependent on the heavy chain SLC3A2 (4F2hc) for surface delivery.
  molecular_function:
