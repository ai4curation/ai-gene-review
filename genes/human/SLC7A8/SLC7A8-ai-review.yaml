id: Q9UHI5
gene_symbol: SLC7A8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC7A8 encodes LAT2 (L-type amino acid transporter 2), the catalytic light
  chain of a heteromeric amino-acid transporter. It is disulfide-linked to the heavy chain
  SLC3A2 (4F2hc/CD98hc), which is required for its folding, stabilization and delivery to the
  plasma membrane. The LAT2-4F2hc complex is an obligate, Na+-independent amino-acid antiporter
  that exchanges a broad range of small and large neutral (zwitterionic) amino acids with 1:1
  stoichiometry. It has high affinity on the extracellular side and much lower affinity on the
  intracellular side, so it equilibrates the relative concentrations of neutral amino acids
  across the membrane rather than producing net uptake. In polarized epithelia (kidney proximal
  tubule, small intestine) it resides in the basolateral membrane and provides the efflux arm of
  transepithelial neutral-amino-acid reabsorption; it is also expressed in placenta, brain and
  many other tissues. Beyond canonical amino acids it transports thyroid hormones (diiodothyronine
  T2, and less T3) and iodotyrosines, and can carry xenobiotics such as the methylmercury-L-cysteine
  complex by molecular mimicry. Loss of function is associated with age-related hearing loss.
