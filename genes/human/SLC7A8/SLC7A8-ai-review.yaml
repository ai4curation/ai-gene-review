      strongly asymmetrical substrate affinities such that the intracellular amino acid concentration
      controls their activity
proposed_new_terms: []
suggested_questions:
- question: Does LAT2 contribute to neutral amino-acid transport at the human blood-brain barrier, or
    is this role essentially restricted to LAT1 (SLC7A5)?
- question: What is the physiological significance of LAT2-mediated thyroid-hormone (T2/T3) and
    iodotyrosine transport relative to dedicated thyroid-hormone transporters (MCT8/MCT10)?
suggested_experiments:
- description: Polarized-epithelium (kidney proximal tubule / intestinal) transport assays with
    tagged LAT2-4F2hc to quantify the directionality and substrate selectivity of the basolateral
    efflux arm in the context of apical B0AT1 uptake.
- description: Tissue-specific LAT2 knockout and knock-in of human ARHL variants to dissect the cochlear
    amino-acid-transport requirement underlying age-related hearing loss.
