- id: PMID:10514485
  title: Prenylated prelamin A interacts with Narf, a novel nuclear protein.
  findings:
  - statement: Human NARF constructs localize to nuclei and bind prenylated prelamin A; the paper does
      not establish activity of the selected 217-residue product.
    supporting_text: 'When a FLAG epitope-tagged Narf is expressed

      in HeLa cells, it is exclusively nuclear and partially co-localizes with the

      nuclear lamina.'
  - statement: NARF binding to the prelamin A tail requires prelamin A farnesylation and its CaaX motif.
    supporting_text: The farnesylation status of prelamin A determines its ability to
      bind to Narf.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding report on canonical NARF, checked against the cached abstract. It supports
      nuclear localization and prenyl-dependent prelamin A binding of the full-length protein, but
      does not test the J3KS48 product.
- id: PMID:18270200
  title: A role for IOP1 in mammalian cytosolic iron-sulfur protein biogenesis.
  findings:
  - statement: Compared with IOP1 depletion, IOP2/NARF depletion did not impair cytosolic or mitochondrial
      aconitase activity, distinguishing the paralogs in this tested CIA phenotype.
    supporting_text: 'Knockdown of IOP2, in contrast, had no

      effect on either.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Checked against the cached abstract. It sets the paralog boundary, so the
      cytosolic Fe-S assembly role of NARFL/IOP1 must not be transferred to NARF/IOP2.
- id: PMID:36490339
  title: NARF is a hypoxia-induced coactivator for OCT4-mediated breast cancer stem cell specification.
  findings:
  - statement: In hypoxic human breast cancer cells, NARF is a HIF-1 target that acts as a coactivator
      recruiting KDM6A to OCT4-bound pluripotency genes.
    supporting_text: NARF
      functions as an essential coactivator by recruiting the histone demethylase
      KDM6A to OCT4 bound to genes encoding the pluripotency factors NANOG, KLF4, and
      SOX2
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. This is gene-level, knockdown-based work in breast cancer cell
      lines; it does not say which NARF isoform was expressed, and it does not study J3KS48. Used
      only in the description. No GO annotation is proposed for this product from it.
