id: J3KS48
gene_symbol: NARF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  NARF (nuclear prelamin A recognition factor, also called IOP2) is a nuclear protein of the
  NARF/Nar1 family, which is related to iron-only (FeFe) hydrogenases. The canonical 456-residue
  NARF protein binds the farnesylated C-terminal tail of prelamin A and is found in the nucleus,
  partly at the nuclear lamina. In hypoxic breast cancer cells it acts as a transcriptional
  coactivator that recruits the histone demethylase KDM6A to OCT4-bound pluripotency genes. It
  has no demonstrated hydrogenase activity or Fe-S cluster, and unlike its paralog NARFL/IOP1
  it is not needed for cytosolic aconitase activity. J3KS48 is a 217-residue product of an
  alternative NARF gene model (Ensembl ENST00000581202). It matches canonical residues 1-128
  and 174-258 and lacks residues 129-173 and nearly all of 259-456. It therefore keeps the
  N-terminal cysteine-rich region and about 40% of the hydrogenase-like large-subunit domain,
  and loses the C-terminal part of that domain, including a C-terminal cysteine pair, and the
  whole small-subunit-like domain. Whether this product is stably expressed, goes to the
  nucleus or binds prelamin A has not been tested.
existing_annotations:
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review:
    action: UNDECIDED
    summary: >-
      Nuclear localization is well established for the canonical NARF protein (Q9UHQ1). On
      J3KS48 this row comes from a UniProt subcellular-location statement that is itself
      ARBA-derived, not from any assay of this product.
    reason: >-
      The localization claim is true of the NARF gene's canonical product: FLAG-tagged NARF is
      exclusively nuclear in HeLa cells, and endogenous NARF is in the nuclear fraction. J3KS48,
      however, is a 217-residue alternative gene-model product. Independent re-mapping shows it
      keeps canonical residues 1-128 and 174-258 and lacks 129-173 and nearly all of 259-456,
      including all of the small-subunit-like domain and most of the large-subunit-like domain.
      No nuclear localization signal or prelamin-A-binding region has been mapped in NARF, so
      we cannot tell whether the deletions keep the localization determinants. No experiment
      reports J3KS48 protein specifically. The Ser29 phosphopeptide behind the PE level lies in
      the shared N-terminus, so it cannot tell J3KS48 apart from canonical NARF. Because the
      donor is the same gene, a nuclear location is plausible, but it is not established for
      this truncated product, so I leave the row UNDECIDED rather than accept or remove it.
      PANTHER places canonical NARF in subfamily PTHR11615:SF124 (NUCLEAR PRELAMIN A
      RECOGNITION FACTOR). The PAINT node PTN002614243 propagates lamin binding and lamin
      filament to Q9UHQ1, but not to J3KS48.
    supported_by:
    - reference_id: PMID:10514485
      supporting_text: 'When a FLAG epitope-tagged Narf is expressed

        in HeLa cells, it is exclusively nuclear and partially co-localizes with the

        nuclear lamina.'
    - reference_id: file:human/NARF/NARF-deep-research-falcon.md
      supporting_text: nuclear/nuclear-lamina localization should remain the primary annotation
    - reference_id: file:human/NARF/NARF-bioinformatics/RESULTS-rereview.md
      supporting_text: J3KS48 lacks Q9UHQ1 129-173 (an internal 45-residue segment) and essentially
        all of 259-455.
    - reference_id: file:human/NARF/NARF-bioinformatics/RESULTS.md
      supporting_text: Selected J3KS48 has 217 residues; reference Q9UHQ1 has 456 residues.
