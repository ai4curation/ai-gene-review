core_functions: []
suggested_questions:
- question: Does J3KS48 produce a stable endogenous protein, retain nuclear localization, or bind an iron-sulfur
    cluster despite the large deletions?
- question: Which region of canonical NARF mediates prenyl-dependent prelamin A binding and the OCT4/KDM6A
    interaction, and does the J3KS48 alternative product (lacking canonical 129-173 and 259-456) retain
    either?
suggested_experiments:
- description: Detect J3KS48-specific peptides (spanning the 128/174 junction or the alternative C-terminal
    tail) by targeted mass spectrometry, then express tagged J3KS48 next to canonical NARF in HeLa cells
    to compare nuclear localization and binding to farnesylated prelamin A.
