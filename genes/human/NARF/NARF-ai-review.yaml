id: J3KS48
gene_symbol: NARF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  NARF (nuclear prelamin A recognition factor, also called IOP2) is a nuclear protein of the
  iron-only hydrogenase-like (Nar1/NARF) family. The full-length 456-residue product (Q9UHQ1)
  binds the farnesylated C-terminal tail of prelamin A and is found in the nucleoplasm, partly
  associated with the nuclear lamina. In hypoxic breast cancer cells, HIF-1 induces NARF, and
  NARF acts as a coactivator that is recruited to OCT4-bound sites at the NANOG, SOX2 and KLF4
  genes and recruits the H3K27 demethylase KDM6A. Despite its hydrogenase-like fold, no
  hydrogenase activity or iron-sulfur cluster has been shown for NARF. Unlike its paralog
  NARFL/CIAO3, it is not required for cytosolic iron-sulfur protein maturation. The UniProt
  entry J3KS48 is a 217-residue alternative gene-model product of NARF. It keeps reference
  residues 1-128 and 174-258 but lacks residues 129-173, the C-terminal half of the hydrogenase
  large-subunit-like domain and the whole small-subunit-like domain (reference 259-456).
existing_annotations:
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review:
    summary: >-
      Nuclear localization of the NARF gene product rests on experiment. Endogenous NARF is
      found in HeLa nuclear fractions, and FLAG-tagged NARF is exclusively nuclear. The
      full-length protein carries IDA annotations to more specific nuclear parts (lamin
      filament, nuclear lumen, nucleoplasm). The PAINT node for the NARF subfamily
      (PANTHER PTHR11615:SF124, node PTN002614243) carries lamin filament (is_active_in), so
      the nuclear lamina role is inherited across vertebrate NARF orthologs and is not
      specific to this lineage. J3KS48 is a shortened product of the same gene. It keeps the
      N-terminal 128 residues, including the basic/acidic disordered segment, and has no
      signal peptide or transmembrane segment that would point to another compartment.
    action: ACCEPT
    reason: >-
      The UniProt SubCell line on J3KS48 comes from an ARBA rule, which is not evidence in
      itself. The annotation is still correct for the gene product. NARF protein is nuclear
      by direct experiment (PMID:10514485), and the PANTHER subfamily that contains NARF
      (SF124, distinct from the NARFL/CIAO3 subfamily SF322) is placed at the nuclear lamina
      by PAINT. "nucleus" is a broad term, deliberately not refined here: the more specific
      lamina and nucleoplasm terms rest on assays of the full-length protein, and the region
      that binds prelamin A has not been mapped, so lamina association cannot be assumed for
      a product that lacks 239 reference residues. Nobody has tested where J3KS48 itself
      localizes, but nothing in its sequence contradicts nuclear residence.
    supported_by:
    - reference_id: PMID:10514485
      supporting_text: 'When a FLAG epitope-tagged Narf is expressed

        in HeLa cells, it is exclusively nuclear and partially co-localizes with the

        nuclear lamina.'
    - reference_id: PMID:36490339
      supporting_text: Hypoxia-induced NARF was recruited to the OCT4 binding sites in the NANOG,
        SOX2, and KLF4 genes in the NTC cells.
    - reference_id: file:human/NARF/NARF-bioinformatics/RESULTS.md
      supporting_text: Selected J3KS48 has 217 residues; reference Q9UHQ1 has 456 residues.
references:
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  findings: []
- id: PMID:10514485
  title: Prenylated prelamin A interacts with Narf, a novel nuclear protein.
  findings:
  - statement: Human NARF binds the farnesylated C-terminal tail of prelamin A, is found in HeLa
      nuclear fractions, and as a FLAG-tagged protein is exclusively nuclear and partly at the
      nuclear lamina. This work used the full-length cloned protein, not J3KS48.
    supporting_text: 'When a FLAG epitope-tagged Narf is expressed

      in HeLa cells, it is exclusively nuclear and partially co-localizes with the

      nuclear lamina.'
  - statement: NARF shows only limited similarity to iron-only bacterial hydrogenases.
    supporting_text: 'Narf has limited homology to iron-only bacterial hydrogenases and eukaryotic

      proteins of unknown function.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding NARF paper (Barton and Worman 1999, J Biol Chem). The cached copy is
      abstract-only, and the localization and prelamin A binding statements are taken from the
      abstract.
- id: PMID:18270200
  title: A role for IOP1 in mammalian cytosolic iron-sulfur protein biogenesis.
  findings:
  - statement: Knockdown of IOP1/NARFL impaired cytosolic aconitase activity, but knockdown of
      IOP2/NARF did not. The cytosolic iron-sulfur assembly role therefore belongs to the paralog
      and should not be transferred to NARF.
    supporting_text: 'Knockdown of IOP2, in contrast, had no

      effect on either.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct paralog comparison (Song and Lee 2008). The abstract states the IOP2
      knockdown result.
- id: PMID:36490339
  title: NARF is a hypoxia-induced coactivator for OCT4-mediated breast cancer stem cell specification.
  findings:
  - statement: In hypoxic breast cancer cells, HIF-1 induces NARF. NARF is recruited to OCT4
      binding sites at NANOG, SOX2 and KLF4 and recruits KDM6A, which leads to H3K27me3
      demethylation and transcriptional activation. The protein studied was endogenous or
      full-length NARF, not shown to be J3KS48.
    supporting_text: NARF recruits histone lysine demethylase 6A (KDM6A) to OCT4 binding sites,
      thereby licensing OCT4-mediated transcriptional activation of the NANOG, SOX2, and KLF4 genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Yang et al. 2022 Sci Adv; full text cached. This is the main mechanistic evidence
      for a nuclear coactivator role of NARF. It comes from a single group and was done in cancer
      cell lines.
- id: file:human/NARF/NARF-bioinformatics/RESULTS.md
  title: Exact NARF product-to-reference sequence mapping
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reproducible global alignment of J3KS48 (read from the UniProt flat file) against
      Q9UHQ1. It shows reference blocks 1-128 and 174-258, loss of residues 129-173 (including the
      TSACP motif cysteine C172) and loss of reference 259-456 (including C374 and C378 in the
      large-subunit-like domain and the whole small-subunit-like domain).
core_functions:
- description: >-
    At the gene level, NARF is a nuclear protein that binds farnesylated prelamin A and acts as
    an OCT4-associated transcriptional coactivator that recruits KDM6A. The only location
    supported for this shortened J3KS48 product is the nucleus. The prelamin A binding and
    coactivator activities were shown for the full-length protein and are not assigned to J3KS48,
    because it lacks more than half of the reference sequence and the regions responsible for
    those activities have not been mapped.
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:10514485
    supporting_text: 'When a FLAG epitope-tagged Narf is expressed

      in HeLa cells, it is exclusively nuclear and partially co-localizes with the

      nuclear lamina.'
  - reference_id: PMID:36490339
    supporting_text: NARF recruits histone lysine demethylase 6A (KDM6A) to OCT4 binding sites,
      thereby licensing OCT4-mediated transcriptional activation of the NANOG, SOX2, and KLF4 genes.
suggested_questions:
- question: Is the ENST00000581202 transcript that encodes J3KS48 translated into a stable protein,
    or is it degraded by nonsense-mediated decay? If it is made, does it stay nuclear and bind
    prelamin A without the C-terminal half of the hydrogenase-like domain?
- question: Which NARF region binds the farnesylated prelamin A tail, and which region binds OCT4
    or KDM6A? Does either map within reference residues 1-128 or 174-258, which J3KS48 keeps?
suggested_experiments:
- description: Express tagged J3KS48 and full-length Q9UHQ1 side by side in HeLa cells. Compare
    nuclear versus cytoplasmic distribution, lamina association, and pull-down of farnesylated
    prelamin A tail and OCT4/KDM6A.
- description: Use isoform-specific RT-PCR and targeted proteomics with a peptide that spans the
    128/174 junction to test whether the J3KS48 product exists in vivo.
