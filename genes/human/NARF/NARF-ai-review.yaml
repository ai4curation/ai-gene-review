id: J3KS48
gene_symbol: NARF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NARF is a nuclear prelamin A-associated protein related to iron-only hydrogenases. The human
  J3KS48 product is a 217-residue form with major internal and C-terminal deletions relative to the 456-residue
  NARF reference. Its ability to localize to the nucleus, bind prelamin A or coordinate an iron-sulfur
  cluster is unresolved. NARF is distinct from the cytosolic iron-sulfur assembly factor NARFL/CIAO3.
existing_annotations:
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review:
    action: UNDECIDED
    summary: Nuclear localization is experimentally supported for human NARF, but J3KS48 deletes an internal
      segment and most of the reference C-terminal region. No localization assay or intact localization
      determinant has been established for this 217-residue product. The same-gene evidence makes nuclear
      localization plausible without resolving this product-specific transfer.
    supported_by:
    - reference_id: PMID:10514485
      supporting_text: 'When a FLAG epitope-tagged Narf is expressed

        in HeLa cells, it is exclusively nuclear and partially co-localizes with the

        nuclear lamina.'
    - reference_id: file:human/NARF/NARF-bioinformatics/RESULTS.md
      supporting_text: Selected J3KS48 has 217 residues; reference Q9UHQ1 has 456 residues.
