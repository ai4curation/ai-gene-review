    label: 4 iron, 4 sulfur cluster binding
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: UNC. Neither J3KS48 nor the canonical NARF product Q9UHQ1 carries any iron-sulfur annotation
      in GOA, and no experiment has shown a bound Fe-S cluster in NARF, so the term would be novel but
      is unsupported. Hydrogenase-family (PTHR11615) homology makes cysteine-ligated cluster binding a
      hypothesis only; the family review keeps NARF/IOP2 distinct from NARFL/IOP1 and transfers no Fe-S
      term to NARF. A report of in vitro H2 production with a sequence-inferred [4Fe4S] cluster
      concerns recombinant IOP1/NARFL, not NARF, so it does not transfer across this paralog split. At the product level the required feature is unresolved. J3KS48 is a
      217-residue product lacking much of the 456-residue reference, including Cys172, the C-terminal
      Cys374/Cys378 pair of the large-subunit-like domain and the whole small-subunit-like domain, so a
      complete hydrogenase-like cluster site is unlikely, but it keeps the N-terminal cysteine-rich region
      (12 of 15 cysteines), and no mapping establishes whether any cluster site in NARF depends only on
      the lost cysteines. The IOP2 knockdown result
      distinguishes CIA function but does not test cluster occupancy, so it neither validates nor refutes
      the claim.
    supported_by:
    - reference_id: file:human/NARF/NARF-bioinformatics/RESULTS.md
      supporting_text: Selected J3KS48 has 217 residues; reference Q9UHQ1 has 456 residues.
    - reference_id: file:human/NARF/NARF-bioinformatics/RESULTS-rereview.md
      supporting_text: It loses Cys172 and the C-terminal Cys374/Cys378 pair inside PF02906, and all of
        PF02256.
    - reference_id: file:human/NARF/NARF-bioinformatics/RESULTS-rereview.md
      supporting_text: J3KS48 keeps the N-terminal cysteine-rich region and roughly the first 40% of the
        hydrogenase-like large-subunit domain.
    - reference_id: PMID:18270200
      supporting_text: 'Knockdown of IOP2, in contrast, had no

        effect on either.'
    - reference_id: PMID:40073536
      supporting_text: both HsIOP1 and SsCIAO3 may contain four conserved cysteine residues, forming a [4Fe4S]
        cluster
