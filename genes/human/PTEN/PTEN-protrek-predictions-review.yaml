description: >-
  ProTrek sequence-to-text retrieval for PTEN. Rank 2 is the exact primary core molecular function
  - PIP3 3-phosphatase activity - and ranks 3 and 5 stay within phosphoinositide phosphatase chemistry.
  Ranks 1 and 4 are downstream neuronal phenotypes. The protein phosphatase activity that makes PTEN
  a dual-specificity enzyme, and that this review lists as a third core function, is not retrieved.
  Assessment: 2 correct not novel (CNN), 1 less precise (LSP).
