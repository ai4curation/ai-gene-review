id: P19022
gene_symbol: CDH2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDH2 encodes N-cadherin, a classical single-pass transmembrane cadherin. Its extracellular
  cadherin domains bind cadherins on neighboring cells to mediate calcium-dependent adhesion, while
  its cytoplasmic tail binds catenins that organize and stabilize adherens junctions. This adhesive
  architecture supports tissue integrity and the development and organization of neural and cardiac
  tissues. Neural stem-cell anchorage, synaptic organization and axon growth are specialized contexts
  of this adhesion system. De novo variants affecting the extracellular or cytoplasmic domains are
  associated with a multisystem developmental disorder that includes callosal, cardiac, ocular and
  genital abnormalities.
