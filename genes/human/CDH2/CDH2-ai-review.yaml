suggested_questions:
- question: Which target-specific protein–RNA assay underlies the mouse P15116 RNA-binding IDA linked
    to PMID:27783602 and its transfer to human CDH2?
- question: What human CDH2 constructs and target data support the focal-adhesion, ECM, ER-lumen,
    connexin43, and cortical-actin/lamellipodium source assertions that remain unresolved?
- question: Does N-cadherin contact alpha-catenin directly under the conditions of PMID:7650039,
    or does the reported recovery reflect the catenin complex?
- question: How do P19022-1 and P19022-2 differ in processing, surface delivery, cadherin adhesion
    and catenin association? The preserved source annotations do not resolve functional equivalence.
- question: Which native cardiac experiments isolate CDH2-dependent conversion of mechanical stretch
    into a molecular signal from the broader cadherin/catenin mechanosensing complex?
