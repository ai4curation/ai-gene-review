gene_symbol: NSUN7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Testis-enriched member of the NOL1/NOP2/Sun (NSUN) protein family that, unlike
  its paralogues NSUN1-NSUN6, is not an active RNA m5C methyltransferase. NSUN7 retains the
  canonical NSUN fold and motifs IV and VI, but the aspartate of motif IV that contacts
  S-adenosyl-L-methionine in the active members is replaced by leucine; purified mouse and human
  NSUN domains fail to bind SAM, loss of Nsun7 does not alter RNA m5C levels measured by mass
  spectrometry or bisulfite sequencing, and mice carrying a substitution of the putative catalytic
  cysteine are phenotypically normal. The protein instead behaves as an RNA-binding protein:
  CLIP-seq from testis recovers a largely mRNA set of interactors specific to elongated spermatids,
  and NSUN7 protein stability is itself RNA-dependent. NSUN7 is expressed in spermatids and
  localises to the cytoplasm and to the sperm flagellum, where it is required for normal axoneme
  structure, for correct positioning of the fibrous-sheath longitudinal columns, and hence for
  progressive sperm motility; loss-of-function causes male infertility in mice and variants are
  associated with asthenozoospermia in men. Whether NSUN7 stabilises or destabilises its bound
  transcripts is unresolved, with knockout studies reporting effects in opposite directions.
  Reports that NSUN7 deposits m5C on specific transcripts in kidney, ovarian granulosa cells and
  glioblastoma rest on knockdown-plus-mapping correlations rather than on direct tests of catalysis.'
