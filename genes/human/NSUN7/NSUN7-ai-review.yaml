- term:
    id: GO:0008168
    label: methyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: Electronic assignment of methyltransferase activity from the NOL1/NOP2/Sun family
      signature InterPro:IPR001678, i.e. from the fold rather than from any measurement on NSUN7
      itself.
    action: REMOVE
    reason: Directly contradicted by biochemistry on the protein. Isothermal titration calorimetry
      shows that neither the mouse nor the human NSUN domain binds the methyl donor SAM, because
      the motif IV aspartate that coordinates SAM in NSUN1-NSUN6 is a leucine in NSUN7; knockout
      testis shows no change in RNA m5C by mass spectrometry or ultrafast bisulfite sequencing
      (PMID:41381527); and a mouse carrying a substitution of the putative catalytic cysteine of
      motif IV is fertile with normal sperm motility and normal longitudinal-column positioning,
      so the knockout phenotype is not caused by loss of methyl transfer (PMID:40545153). UniProt
      has itself added a CAUTION stating that NSUN7 lacks RNA cytosine C5-methyltransferase activity.
      Three disease papers do assert NSUN7-catalysed m5C (PMID:41871257 kidney injury, PMID:41062800
      polycystic ovary syndrome, PMID:41275291 glioblastoma), but each infers catalysis from a
      knockdown or knockout followed by MeRIP or bisulfite mapping; none measures SAM binding, in
      vitro methyl transfer by purified NSUN7, or rescue by a catalytically dead allele, and all
      place a testis-restricted protein as a dominant m5C writer in somatic tissues. Removing an
      electronic, signature-derived inference that direct assays on the protein refute is the case
      the project guidelines explicitly allow; the informative replacement function is mRNA binding
      (GO:0003729), proposed in core_functions.
    supported_by:
    - reference_id: PMID:41381527
      supporting_text: Intriguingly, we found that the NSUN domain of mouse NSUN7 does not bind
        SAM at all
    - reference_id: PMID:41381527
      supporting_text: Consistent with the result of mouse NSUN7, the NSUN domain of human NSUN7
        also failed to bind SAM
    - reference_id: PMID:41381527
      supporting_text: Through transcriptome-wide m5C mass spectrometry and ultrafast bisulfite
        sequencing, we found that Nsun7 knockout has no impact on RNA m5C modification.
    - reference_id: PMID:40545153
      supporting_text: Contrary to predictions based on the typical reaction mechanism of NOP2/Sun
        family methyltransferases, Nsun7C382A mice did not exhibit any phenotypical characteristics
        of knockouts and had normal fertility, sperm motility, and longitudinal column positioning,
        similar to wild-type mice.
