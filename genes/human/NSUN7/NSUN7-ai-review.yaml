core_functions:
- molecular_function:
    id: GO:0003729
    label: mRNA binding
  description: NSUN7 is a catalytically dead member of the NSUN m5C methyltransferase family whose
    retained activity is sequence-specific binding of RNA. UV CLIP-seq from mouse testis recovers
    a set of NSUN7-bound transcripts that is predominantly mRNA and is enriched for transcripts
    specific to elongated spermatids; the association with RNA is reciprocally required for NSUN7
    protein stability, since RNase treatment destabilises the protein. Acting in the cytoplasm and
    flagellum of elongated spermatids, NSUN7 uses this binding to control the abundance of a cohort
    of cilium- and flagellum-related transcripts, which is required for assembly of the sperm axoneme
    and for correct positioning of the fibrous-sheath longitudinal columns. This role does not
    require methyl transfer - a mouse carrying a substitution of the putative catalytic cysteine
    is normal - and the protein does not bind SAM.
  directly_involved_in:
  - id: GO:0120316
    label: sperm flagellum assembly
  - id: GO:0030317
    label: flagellated sperm motility
  locations:
  - id: GO:0036126
    label: sperm flagellum
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:40032361
    supporting_text: The CLIP-seq experiment performed on testes extract allowed us to identify multiple
      NSUN7 binding RNAs. The majority of those belong to mRNAs, although several noncoding RNAs
      have also been identified.
  - reference_id: PMID:40032361
    supporting_text: We identified m5C-specific NSUN7 RNA methyltransferase as a protein present
      in elongated spermatids and interacting with RNAs specific for this type of spermatozoid's
      precursor cells.
  - reference_id: PMID:41381527
    supporting_text: Our results show that RNase treatment has an impact on NSUN7 protein stability,
      further indicating that the association of NSUN7 with RNA contributes to maintaining its
      protein stability.
  - reference_id: PMID:41381527
    supporting_text: Nsun7 deficiency impairs sperm progressive motility, accompanied by defects
      in axonemes and mispositioning of longitudinal columns.
suggested_questions:
- question: Does NSUN7 stabilise or destabilise the transcripts it binds? CLIP-seq plus RNA-seq of
    the Nsun7 knockout reports upregulation of NSUN7-bound RNAs, implying destabilisation, whereas
    single-cell RNA-seq of an independent knockout reports downregulation of cilium-organisation
    mRNAs, implying stabilisation. Are these opposite signs explained by different transcript sets,
    different knockout alleles, or by secondary consequences of the structural defect?
  experts:
  - Petr V Sergiev
  - Ru-Juan Liu
- question: Given that NSUN7 does not bind SAM and that a catalytic-cysteine knock-in mouse is
    phenotypically normal, what accounts for the reports that Nsun7 deletion lowers bulk m5C in
    kidney and that NSUN7 knockdown lowers m5C on specific transcripts in granulosa cells and
    glioblastoma? Is NSUN7 acting indirectly on a genuine NSUN enzyme, or are these off-target or
    mapping artefacts?
  experts:
  - Xiao-Ming Meng
- question: Does NSUN7 retain SAM binding or methyl-transfer activity in any vertebrate lineage?
    The motif IV aspartate is replaced by leucine in most vertebrate NSUN7 orthologues but by valine
    or threonine in some, and it is unknown whether any of these variants restores the cofactor site.
  experts:
  - Ru-Juan Liu
- question: What is the RNA sequence or structure element that NSUN7 recognises, and does the PUA-like
    or NSUN-domain surface that normally positions the substrate cytosine now serve purely as an
    RNA-binding platform?
  experts:
  - Petr V Sergiev
suggested_experiments:
- hypothesis: NSUN7 acts as a sequence-specific mRNA-binding protein in elongated spermatids, not
    as a methyltransferase.
  description: Determine a crystal or cryo-EM structure of the NSUN7 NSUN domain with and without
    a CLIP-derived RNA ligand, and test SAM and SAH binding directly by ITC and by differential
    scanning fluorimetry alongside NSUN2 and NSUN6 as positive controls. A structure showing an
    occluded or re-arranged cofactor pocket together with an occupied RNA groove would settle the
    pseudoenzyme assignment.
  experiment_type: Structural biology and biophysics
- hypothesis: The flagellar phenotype of Nsun7 knockout mice is caused by loss of RNA binding, not
    by loss of catalysis.
  description: Generate knock-in mice carrying point substitutions that abolish RNA binding (guided
    by the structure above) while leaving the fold intact, and compare them with the existing null
    and with the catalytic-cysteine Nsun7C382A line for fertility, progressive motility, axonemal
    ultrastructure and longitudinal-column position.
  experiment_type: Mouse genetics
- hypothesis: The direction of the NSUN7 effect on transcript abundance can be resolved by measuring
    decay rather than steady-state levels.
  description: Measure transcript half-lives directly in sorted wild-type and Nsun7 knockout elongated
    spermatids using metabolic labelling (SLAM-seq or TimeLapse-seq) rather than steady-state RNA-seq,
    and restrict the analysis to CLIP-defined direct targets, so that secondary effects of the
    structural defect are separated from the primary effect on decay.
  experiment_type: RNA metabolic labelling
- hypothesis: The reported somatic m5C-writer activity of NSUN7 is indirect.
  description: In a kidney injury model, compare Nsun7 knockout with knock-in of the catalytically
    dead-equivalent allele; if bulk m5C falls in the null but not in the point mutant, the m5C change
    is not produced by NSUN7 catalysis. In parallel, quantify NSUN7 protein in kidney by targeted
    mass spectrometry and test in vitro methylation of the proposed SPARC and NLRP3 transcripts by
    purified NSUN7.
  experiment_type: Mouse genetics and in vitro biochemistry
