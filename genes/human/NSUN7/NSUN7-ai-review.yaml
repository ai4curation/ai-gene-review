- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: ISS
  original_reference_id: PMID:40032361
  qualifier: enables
  review:
    summary: Proposed NEW annotation, and the informative molecular function that should stand in
      place of the removed GO:0008168 methyltransferase activity. UV CLIP-seq from mouse testis
      recovers a set of NSUN7-crosslinked RNAs that is predominantly mRNA and is enriched for
      transcripts of elongated spermatids; NSUN7 protein stability is itself RNase-sensitive. The
      human protein is a one-to-one orthologue and already carries the UniProt RNA-binding keyword,
      so the evidence code is given as ISS by transfer from mouse Nsun7 (UniProtKB:Q14AW5).
    action: NEW
    reason: A catalytically dead member of an enzyme family still has a molecular function, and for
      NSUN7 the measured one is RNA binding. Asserting it makes the removal of the family-signature
      methyltransferase term informative rather than merely subtractive.
    supported_by:
    - reference_id: PMID:40032361
