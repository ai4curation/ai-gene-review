    label: kinetochore
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q9JJ66
  - ensembl:ENSMUSP00000006565
  review:
    summary: >-
      CDC20 localises to kinetochores, where the spindle assembly checkpoint catalyses its incorporation into the
      MCC; kinetochore localisation of human CDC20 is shown directly in oocytes, and GFP-Cdc20 turns over dynamically
      at unattached kinetochores in living cells.
    action: ACCEPT
    reason: >-
      Kinetochore is a genuine site of CDC20 action (MCC assembly). The mouse-derived transfer is corroborated by
      human CDC20 constructs localising to kinetochores in oocytes (PMID:32666501), by live-cell FRAP at unattached
      kinetochores (PMID:15182668) and by UniProt subcellular location. Accepted as a core location.
    supported_by:
    - reference_id: PMID:32666501
      supporting_text: CDC20 showed normal kinetochore localization as the wild-type
    - reference_id: PMID:15182668
      supporting_text: GFP-Cdc20 and GFP-BubR1 exhibit biphasic exponential kinetics at unattached kinetochores
