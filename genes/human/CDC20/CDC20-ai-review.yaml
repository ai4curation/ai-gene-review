- term:
    id: GO:0005813
    label: centrosome
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - UniProtKB:Q62623
  - ensembl:ENSRNOP00000037772
  - UniProtKB:Q9JJ66
  - ensembl:ENSMUSP00000006565
  - UniProtKB-SubCell:SL-0048
  review:
    summary: >-
      Combined IEA (UniProt subcellular location plus mouse/rat ortholog transfer): CDC20 at the centrosome; in
      rodent neurons a centrosomal Cdc20-APC pool regulates dendrite morphogenesis.
    action: KEEP_AS_NON_CORE
    reason: >-
      Centrosome localisation is reported (UniProt, PubMed:20034488) and underlies the rodent neuronal Cdc20-APC
      pathway, but it is not the site of the core mitotic function. Kept as non-core.
- term:
    id: GO:0005819
    label: spindle
  evidence_type: TAS
  original_reference_id: PMID:7513050
  qualifier: located_in
  review:
    summary: >-
      The 1994 p55CDC discovery paper; its spindle statement is an inference from homology to yeast Cdc20/Cdc4,
      which were 'proposed to be involved in the formation of a functional bipolar mitotic spindle'.
    action: KEEP_AS_NON_CORE
    reason: >-
      The cited source does not localise p55CDC to the spindle experimentally, so the TAS is weakly grounded; nevertheless
      later work places CDC20 at spindle poles and kinetochores (UniProt; PMID:15182668), and the mitotic spindle
      is used for the CDC20/USP44 GO-CAM 6348a65d00002236. Kept as a non-core location rather than removed.
    supported_by:
    - reference_id: PMID:7513050
      supporting_text: >-
        the highest degree of homology in these repeats was found with the Saccharomyces cerevisiae Cdc20 and Cdc4
        proteins, which have been proposed to be involved in the formation of a functional bipolar mitotic spindle
        in yeast cells
- term:
