- term:
    id: GO:0007094
    label: mitotic spindle assembly checkpoint signaling
  evidence_type: NAS
  original_reference_id: PMID:11535616
  qualifier: involved_in
  review:
    summary: >-
      Purification of the mitotic checkpoint complex from HeLa cells: BUBR1, BUB3, CDC20 and MAD2 in near-equal
      stoichiometry inhibit APC/C 3,000-fold more potently than MAD2 alone.
    action: ACCEPT
    reason: >-
      CDC20 is a stoichiometric constituent of the checkpoint effector complex and the entity the checkpoint acts
      on; its sequestration is the output of SAC signalling, and the human GO-CAM 6348a65d00002236 places CDC20
      in this process. Core, accepted.
    supported_by:
    - reference_id: PMID:11535616
      supporting_text: >-
        We call this factor the mitotic checkpoint complex (MCC) as it consists of hBUBR1, hBUB3, CDC20, and MAD2
        checkpoint proteins in near equal stoichiometry
- term:
    id: GO:0007346
    label: regulation of mitotic cell cycle
  evidence_type: NAS
  original_reference_id: PMID:15678131
  qualifier: involved_in
  review:
    summary: Review of APC/C structure, regulation and substrate recognition; CDC20 as the mitotic coactivator.
    action: MODIFY
    reason: >-
      Regulation of mitotic cell cycle is correct but far too general: CDC20's specific contribution is activating
      APC/C to trigger the metaphase/anaphase transition, captured by GO:0045842 (IDA). Modify to the specific term.
    proposed_replacement_terms:
    - id: GO:0045842
      label: positive regulation of mitotic metaphase/anaphase transition
    supported_by:
    - reference_id: PMID:15678131
      supporting_text: >-
        Two different ubiquitin ligases play an important role in the cell cycle: the SCF (Skp1/Cullin/F-box) and
        the anaphase-promoting complex (APC)
- term:
    id: GO:0008284
    label: positive regulation of cell population proliferation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q62623
  - ensembl:ENSRNOP00000037772
  review:
    summary: Positive regulation of cell population proliferation transferred from rat.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Cells lacking CDC20 arrest in metaphase, so proliferation depends on it, but that is a downstream consequence
      of being an essential mitotic coactivator, not a regulatory activity directed at proliferation. Over-annotation
      of a pleiotropic outcome.
    supported_by:
    - reference_id: PMID:7513050
      supporting_text: The p55CDC protein appears to be essential for cell division
