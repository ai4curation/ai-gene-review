  original_reference_id: Reactome:R-HSA-141409
  qualifier: located_in
  review:
    summary: >-
      Reactome compartment assignment (cytosol) for 'Mad1 binds kinetochore', a reaction in which CDC20 is present
      only as a constituent of a larger kinetochore/spindle or cohesin-regulatory assembly.
