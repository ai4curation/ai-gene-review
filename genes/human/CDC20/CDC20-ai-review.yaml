      CDC20 is partly nuclear before nuclear-envelope breakdown and the Reactome events cited occur there; this
      is a legitimate but secondary compartment relative to the mitotic cytosol where APC/C-CDC20 and the MCC act.
      Kept as non-core.
- term:
    id: GO:0005680
    label: anaphase-promoting complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - FB:FBgn0001086
  - FB:FBgn0262699
  - PANTHER:PTN000460086
  - SGD:S000002971
  - SGD:S000003084
  - SGD:S000003457
  review:
    summary: >-
      CDC20 is the mitotic coactivator subunit of the APC/C: it docks on the phosphorylated APC/C through its C-box
      (APC8/CDC23) and IR tail (APC3/CDC27) to form the substrate-recognising, catalytically competent APC/C-CDC20.
    action: ACCEPT
    reason: >-
      PAINT node PTN000460086 places the CDC20/CDH1 family as APC/C coactivator subunits, seeded by human CDC20/FZR1,
      fly fzy and budding-yeast CDC20/CDH1. Cryo-EM of human APC/C-CDC20 and APC/C-MCC confirms CDC20 as an integral,
      if cell-cycle-regulated, subunit of the active ligase. Accepted as the core complex.
    supported_by:
    - reference_id: PMID:27509861
      supporting_text: >-
        Degron-like sequences of the MCC subunit BubR1 block degron recognition sites on Cdc20, the APC/C coactivator
        subunit responsible for substrate interactions
    - reference_id: PMID:27120157
      supporting_text: >-
        Hyperphosphorylation of APC/C subunits, notably Apc1 and Apc3, is required for Cdc20 to activate the APC/C
- term:
    id: GO:0005680
    label: anaphase-promoting complex
  evidence_type: IDA
  original_reference_id: PMID:11459825
  qualifier: colocalizes_with
  review:
    summary: >-
      Kirschner-lab study of MAD2L2 inhibition of CDH1-APC, in which APC bound to CDC20 or CDH1 is characterised
      biochemically (colocalizes_with qualifier).
    action: ACCEPT
    reason: >-
      The paper works with CDC20-APC and CDH1-APC complexes and the curator recorded only the weaker colocalizes_with
      claim. Consistent with CDC20's established role as the APC/C coactivator; accepted.
    supported_by:
    - reference_id: PMID:11459825
      supporting_text: >-
        Exit from mitosis requires the degradation of regulatory proteins including the mitotic cyclins and securin
        through ubiquitination by the anaphase promoting complex (APC) bound to Cdc20 or Cdh1
- term:
    id: GO:0005680
    label: anaphase-promoting complex
  evidence_type: IDA
  original_reference_id: PMID:14743218
  qualifier: part_of
  review:
    summary: >-
      RASSF1A study: CDC20 is characterised as the activator of the APC and the APC-CDC20 complex is the target
      of RASSF1A inhibition.
