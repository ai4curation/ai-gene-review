- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:10700282
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q13257
  review:
    summary: >-
      IPI with MAD2L1 (UniProtKB:Q13257). NMR structure of MAD2 and mapping of its binding site to a 40-residue
      segment of CDC20 N-terminal to the WD40 repeats.
    action: MODIFY
    reason: >-
      Bare protein binding carries no functional information. The paper characterises the direct MAD2-CDC20 interaction
      that assembles the CDC20-MAD2 subcomplex of the mitotic checkpoint complex, so the informative annotation
      is membership of that subcomplex (GO:1990333), the same replacement used in the MAD2L1 review; the replacement
      is a cellular-component term because CDC20 is the inhibited target in this pair and no molecular-function
      term describes being sequestered.
    proposed_replacement_terms:
    - id: GO:1990333
      label: mitotic checkpoint complex, CDC20-MAD2 subcomplex
    supported_by:
    - reference_id: PMID:10700282
      supporting_text: >-
        identified the minimal Mad2-binding region of human Cdc20 as a 40-residue segment immediately N-terminal
        to the WD40 repeats
