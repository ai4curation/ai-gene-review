      The ubiquitin ligase anaphase-promoting complex (APC/C) targets USP22 for degradation by using the substrate
      adapter CDC20 during cell exit from M phase
  - reference_id: PMID:29343641
    supporting_text: >-
      the APC/C coactivators CDH1 and CDC20 bind to a destruction-box (D-box) motif present in FBXO31 to promote
      its polyubiquitination and degradation in a cell-cycle-regulated manner
- description: >-
    Inhibited effector of the spindle assembly checkpoint: at unattached kinetochores CDC20 is captured by C-MAD2
    and BUBR1-BUB3 into the mitotic checkpoint complex, which blocks its degron receptor sites and E2 access and
    can also inhibit a second APC/C-bound CDC20, holding APC/C inactive until chromosome biorientation; APC/C-mediated
    ubiquitination of MCC-bound CDC20 then reactivates the ligase.
