    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official method record read. This is a pathway-vocabulary mapping from the
      discontinued UniPathway resource, whose last release was March 2015. That maintenance
      limit does not contradict independently supported glycerol phosphorylation and catabolic
      entry.
