id: P32189
gene_symbol: GK
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GK encodes an ATP-dependent glycerol kinase that produces sn-glycerol-3-phosphate
  for glycerol utilization and glycerolipid synthesis. Alternative splicing affects catalytic
  behavior and subcellular distribution, with cytosolic and mitochondria-associated forms. Loss
  of enzyme activity causes glycerol kinase deficiency.
