  review:
    summary: ETV6 repression depends on its DNA-targeting and regulatory domains.
    action: ACCEPT
    reason: PMID:10514502 tests human TEL deletion and domain-substitution constructs in HeLa reporter
      assays. B-domain loss impairs repression, an EBV EB1 oligomerization segment can restore repression,
      and distinct central repression domains are mapped (Figures 4–6). The EBS-mutant Fli1 reporter establishes
      sequence-dependent regulation. These are experimental human TEL constructs and chimeras, not additional
      natural products. The positive repressor role does not imply that ETV6 is repressive in every cell
      and promoter context.
    supported_by:
    - reference_id: PMID:10514502
