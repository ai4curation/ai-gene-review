  review:
    summary: ETV6 binding to NRF2 is supported by targeted interaction assays.
    action: KEEP_AS_NON_CORE
    reason: PMID:32911434 Supplementary Table S1 row 20 explicitly records ETV6 as Y2H-positive with NRF2;
      Table S2 lists the mCherry-ETV6 and FL-V5-ETV6 constructs. The actual main Results also report reduced
      apparent ETV6–NRF2 affinity in KEAP1-knockout versus wild-type cells in the cellular DULIP assay.
