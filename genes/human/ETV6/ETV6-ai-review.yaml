- id: PMID:17606295
  title: Ets factors and a newly identified polymorphism regulate Fli1 promoter activity in lymphocytes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed/Europe PMC identity and the genuine normal record are verified. Actual PMC main
      Methods (expression vectors, transfections, EMSA, RT-PCR), Results and Figures 4–5 captions were
      read. Native BALB/c splenic nuclear extracts show anti-Tel supershift/sequence controls at Fli1
      EBS2; pcDNA3 Tel increases endogenous Fli1 mRNA in mouse S1A T cells. The gift expression insert
      has no stated accession/species in the inspected Methods, so host species is not used to identify
      the insert. This positively supports contextual activation, not a direct human assay or universal
      activator role. No figure pixels or supplements inspected. https://pmc.ncbi.nlm.nih.gov/articles/PMC2045641/
