  review:
    summary: TEL has context-dependent transcriptional activator evidence.
    action: KEEP_AS_NON_CORE
    reason: Current mouse P97360 GOA traces this transfer to IDA PMID:17606295. In that original, native
      BALB/c splenic nuclear extracts show Tel-specific binding to Fli1 EBS2 (Figure 4B), and pcDNA3 Tel
      overexpression increases endogenous Fli1 mRNA in mouse S1A T cells relative to empty vector (Figure
      5; Methods, RNA isolation and real-time RT-PCR). The expression insert accession/species is not
      stated, so the T-cell host is not used to assign its sequence. This is positive contextual regulatory
      evidence and is not refuted by ETV6 being a repressor in other settings. Human TEL represses an
      Fli1 promoter reporter in HeLa cells in PMID:10514502, illustrating the assay-context distinction.
      Retain the conserved activation facet as non-core, without claiming a universal activator role,
      direct human FLI1 induction, or equivalent activity of every natural product.
