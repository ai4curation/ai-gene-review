  evidence_type: IDA
  original_reference_id: PMID:10514502
  qualifier: involved_in
  review:
    summary: Human ETV6 directly represses RNA polymerase II reporter transcription.
    action: ACCEPT
    reason: The actual human TEL experiments in PMID:10514502 show dose-dependent repression of an EBS-containing
      reporter in HeLa cells, with little effect on the minimal promoter control (Figure 1). Human TEL
      also represses a mouse Fli1 promoter reporter, and mutation of its ETS-binding site abolishes repression
      (Figure 5). Thus the raw mouse Fli1 input identifier denotes the tested target promoter, not a mouse
      ETV6 construct. The M1 construct carries M43A to prevent internal initiation; M1 and M43 are separately
      tested, rather than presumed equivalent in every function.
