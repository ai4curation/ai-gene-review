id: P41212
gene_symbol: ETV6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ETV6 (TEL) is an ETS-family transcription factor that recognizes ETS cis-regulatory DNA sites
  and regulates RNA polymerase II transcription. Its ETS domain mediates sequence recognition, while its
  pointed/SAM domain supports protein association. Nuclear ETV6 represses transcription and associates
  with corepressors including HDAC9/MITR and L3MBTL1; L3MBTL1 can strengthen ETV6-dependent reporter repression
  through their SAM/SPM domains. ETV6 also has context-dependent positive regulatory effects, including
  increased Fli1 expression in mouse lymphoid cells. It participates in hematopoietic regulation, and
  pathogenic germline variants cause familial thrombocytopenia with predisposition to hematologic malignancy.
  Alternative translation initiation produces M1 and M43 forms. Pathological ETV6 fusions with receptor
  tyrosine kinases are distinct from the native transcription factor.
