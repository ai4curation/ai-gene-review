        source_status: SUPPORTS_TRANSFER
        comment: Actual positive mouse-cell regulatory source recovered; conserved contextual interpretation
          retains the unresolved expression-insert identity.
      - source_id: ensembl:ENSMUSP00000079818
        source_status: SUPPORTS_TRANSFER
        comment: Official donor identity verified; not reinterpreted as a human assay.
