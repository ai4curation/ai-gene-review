  review:
    summary: PIN1 affinity purification supports an ETV6-containing association in human 293T cells.
    action: KEEP_AS_NON_CORE
    reason: The actual BioPlex 3.0 293T interaction table records PIN1 (Q13526; gene 5300) as bait and
      ETV6 (P41212; gene 2120) as prey, with a high-confidence interaction call. The original Methods
      use C-terminal FLAG-HA-tagged human ORFeome baits, anti-HA affinity purification and mass spectrometry.
