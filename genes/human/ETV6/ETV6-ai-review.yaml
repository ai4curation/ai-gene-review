- id: file:human/ETV6/ETV6-source-guide.md
  title: ETV6 source guide
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Compiled source guide with public Reactome object endpoints, representative and alternate
      fusion-participant routes, and the HPA000264 cellular-localization evidence and specificity limits.
      The saved official Reactome objects verify each displayed route edge and the P41212 segment with
      foreign sequence insertions. The saved HPA XML reports nucleoli and cytosol for A-431, U-251MG and
      U2OS; prior qualitative A-431/U2OS image inspection and additional western bands are explicitly
      bounded. This local guide makes those primary source records traceable; it is not an independent
      experiment or a new native-localization annotation.
core_functions:
- description: Recognizes ETS cis-regulatory DNA sites and represses RNA polymerase II transcription in
    the nucleus. Human ETV6 associates with HDAC9/MITR and L3MBTL1 corepressors; L3MBTL1 enhances ETV6-dependent
    reporter repression through a SAM/SPM-dependent interaction. These DNA-recognition and corepressor-association
    facets form one transcriptional repression mechanism.
  molecular_function:
    id: GO:0001227
    label: DNA-binding transcription repressor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:9018121
  - reference_id: PMID:10514502
  - reference_id: PMID:12590135
  - reference_id: PMID:12588862
suggested_questions:
- question: How do endogenous M1, M43 and the independently annotated ETV6 transcript products differ
    in abundance, DNA occupancy and corepressor use?
- question: Which cis-regulatory elements and cofactors determine whether ETV6 represses transcription
    or increases Fli1 expression, and is the positive mouse lymphoid context reproduced by endogenous
    human ETV6?
- question: Do HDAC9/MITR and L3MBTL1 act with ETV6 at the same endogenous loci or in distinct repression
    contexts?
- question: Does the HPA000264 cytosolic signal represent endogenous native ETV6 in the tested human cell
    lines, which natural translation products contribute, and can genetic controls or orthogonal fractionation
    establish their localization despite the antibody's additional western bands? The positive HPA observation
    is distinct from the disease-fusion compartments underlying the removed Reactome projections.
suggested_experiments:
- description: Combine translation-initiation profiling and product-resolved proteomics in human hematopoietic
    cells with matched-expression rescue of individually sequence-verified ETV6 products. Measure nascent
    transcription, DNA occupancy and corepressor association while distinguishing engineered M1(M43A)
    from native M1 and preserving the separate RefSeq product models.
  experiment_type: Product-resolved expression and matched functional rescue
  hypothesis: Alternative initiation or transcript structure changes regulatory interactions in a cell-context-dependent
    manner rather than making all natural products functionally equivalent.
- description: Compare endogenous ETV6 perturbation in human and mouse lymphoid cells with Fli1 promoter
    reporters carrying intact or mutated ETS sites, nascent-RNA measurements and ETV6/cofactor occupancy.
    Test matched promoter and cellular contexts before assigning a species difference or general activating
    mechanism.
  experiment_type: Context-dependent transcription and cis-element analysis
  hypothesis: The transcriptional sign depends on the promoter and cellular cofactor environment, rather
    than an invariant activating or repressing action at every target.
- description: Acute depletion and rescue of HDAC9/MITR or L3MBTL1, individually and together, followed
    by ETV6 occupancy and nascent-transcription measurements can test their contributions at endogenous
    targets. Include sequence-verified interaction-domain mutants, expression controls and DNA-binding
    controls to distinguish loss of recruitment from loss of ETV6 stability or occupancy.
  experiment_type: Corepressor perturbation with occupancy and transcription readouts
  hypothesis: Different corepressors contribute to overlapping but nonidentical ETV6 target programs;
    the existing pairwise and reporter evidence does not require one constitutive complex.
