    summary: Accepted as correct but redundant. The term is right - ADIRF has its own IDA to nucleus and
      a more specific HPA IDA to nucleoplasm - but this row carries no independent evidence, because both
      tokens in its WITH/FROM trace back to the same experiment the IDA row already records.
    reason: 'InterPro''s IPR034450 is a single-family signature whose entire curated basis is this gene:
      its InterPro description is written from human ADIRF''s own papers, and it has exactly one reviewed
      Swiss-Prot member, human ADIRF itself. interpro2go maps IPR034450 to exactly two terms, GO:0045600
      and GO:0005634. The second WITH/FROM token, UniProtKB-SubCell:SL-0191, is UniProt''s own Nucleus
      subcellular-location term, and UniProt''s SUBCELLULAR LOCATION line attributes it to ECO:0000269|PubMed:23239344
      - the same paper as the IDA row. So both routes into this row originate in PMID:23239344. Correct
      term, zero added information; ACCEPT rather than REMOVE because nothing false is asserted. The WITH/FROM
      names no ARBA rule id, so there was no rule to fetch at rest.uniprot.org/arba/ despite the GO_REF:0000120
      reference.'
    supported_by:
