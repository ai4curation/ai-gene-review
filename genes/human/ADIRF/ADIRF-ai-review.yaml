- term:
    id: GO:0045600
    label: positive regulation of fat cell differentiation
  evidence_type: IDA
  original_reference_id: PMID:23239344
  qualifier: involved_in
  review:
    action: ACCEPT
    summary: 'Accepted as the term, with a correction to the evidence code: the supporting experiment
      is over-expression, so this should be IMP rather than IDA. This is ADIRF''s only characterised biological
      role and the one UniProt''s FUNCTION line leads with, but the experiment shows that ADIRF can promote
      adipogenic differentiation, not that adipogenesis requires it.'
    reason: 'The abstract names the assay outright as over-expression in 3T3-L1 cells, and GO''s IMP definition
      explicitly covers over-expression and ectopic expression of wild-type genes while IDA is reserved
      for a direct assay of the gene product''s own activity or location. The mis-coding is therefore
      decidable from the abstract alone and needs no full text. I did not change the term, which is well
      supported. A second boundary on the interpretation, measured rather than assumed: 3T3-L1 is a mouse
      line, and ADIRF is absent from the entire Muroidea clade - 0 genes in mouse, rat and Muroidea in
      NCBI Gene against positive controls of 1, 1 and 30 for ADIPOQ, with the sister rodent clade Sciuridae
      retaining 9 ADIRF genes so the loss is localised rather than a query artefact. PMID:31945134 identifies
      the mechanism as a 43-kb deletion removing the promoter and first exon. So the only functional experiments
      on this gene are gain-of-function in a background with no endogenous orthologue, murine adipogenesis
      demonstrably proceeds without any ADIRF, and no loss-of-function experiment exists in any system
      that has the gene. That does not make the term wrong - it bounds what it means - so the requirement
      claim is filed as a knowledge gap rather than asserted or used to reject the row.'
    supported_by:
    - reference_id: PMID:23239344
      supporting_text: Over-expression studies in 3T3-L1 cells indicated that it up-regulates the levels
        of CCAAT/enhancer binding protein α (C/EBPα) and PPARγ and promotes adipogenic differentiation
        starting from the early stage of adipogenesis.
      full_text_unavailable: true
    - reference_id: PMID:31945134
      supporting_text: The mouse locus corresponding to human ADIRF harbors a deletion of close to 43
        kb (Fig 5A). This deletion is predicted to remove the promoter and first exon of ADIRF, a sequence
        that encodes the first 42 amino acids of the 76 amino acid gene product.
    - reference_id: file:human/ADIRF/ADIRF-bioinformatics/RESULTS.md
      supporting_text: 'ADIRF absent from Muroidea: **True**; retained in the sister rodent clade Sciuridae:
        **True** (9 genes).'
    knowledge_gaps:
    - gap_statement: It is unknown whether ADIRF is required for adipocyte differentiation in any cell
        that expresses it endogenously. Every functional experiment on the gene is ectopic over-expression
        in mouse 3T3-L1 preadipocytes, and the mouse lineage carries a 43-kb deletion of the ADIRF locus,
        so the assay system has no endogenous orthologue and murine adipogenesis proceeds without any
        ADIRF.
      boundary: 'Established: expressing human ADIRF in 3T3-L1 cells raises C/EBP-alpha and PPAR-gamma
        levels and accelerates adipogenic differentiation. Not established: any loss-of-function phenotype,
        in any species, in any cell that has the gene.'
      gap_kind:
      - BIOLOGY
      - CURATION
      dark_aspect: RESIDUAL_SUBGAP
      status: OPEN
      significance: 'Distinguishes a sufficiency claim from a necessity claim for the gene''s only annotated
        biological process, and explains why the gene has remained dark: the standard model organism for
        adipose biology cannot be used, and PMID:31945134 notes ADIRF has no clear paralogue that could
        substitute.'
      provenance:
      - reference_id: PMID:23239344
        supporting_text: Over-expression studies in 3T3-L1 cells indicated that it up-regulates the levels
          of CCAAT/enhancer binding protein α (C/EBPα) and PPARγ and promotes adipogenic differentiation
          starting from the early stage of adipogenesis.
        full_text_unavailable: true
      - reference_id: PMID:31945134
        supporting_text: deletion of this segment (and loss of ADIRF expression) occurred in the evolutionary
          predecessor to mouse, rat, and hamster.
- term:
