    - gap_statement: The mechanism by which ADIRF increases C/EBP-alpha and PPAR-gamma expression is unknown.
        No DNA-binding activity, promoter occupancy, chromatin association or transcriptional cofactor
        has been reported for the protein, so it is not known whether it acts at transcription at all
        or at some earlier step whose output is a change in the levels of these factors.
      boundary: 'Established: ectopic ADIRF raises C/EBP-alpha and PPAR-gamma levels, and the protein
        is nuclear. Not established: any direct molecular interaction with DNA, chromatin, a transcription
        factor or the Pol II machinery.'
      gap_kind:
