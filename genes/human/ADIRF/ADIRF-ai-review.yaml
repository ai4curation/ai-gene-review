    label: positive regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:23239344
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Kept as non-core. The term is the UniProt curator's reading of the full text, which I do
      not overrule, but it rests on the same single over-expression experiment as the GO:0045600 row -
      so it is a mechanistic interpretation of one result rather than an independent finding, and the
      PAN-GO curators reviewing the same paper selected GO:0045600 and not this term as ADIRF's core process.
    reason: 'What the abstract reports is a change in the levels of C/EBP-alpha and PPAR-gamma, which
      does not by itself localise the effect to RNA polymerase II transcription. UniProt''s curator, who
      read the full text I cannot see, wrote that ADIRF ''stimulates transcription initiation'' of these
      factors, and per project policy an experimental call made from the full text is not overruled from
      an abstract - so the term stands and this is not a MODIFY. What keeps it non-core is that no mechanism
      has been established: ADIRF has no annotated DNA-binding activity, no measured promoter occupancy,
      and no identified cofactor, so whether it acts at Pol II transcription directly or several steps
      upstream is unknown. The evidence code has the same problem as the GO:0045600 row - the supporting
      experiment is over-expression, which GO codes as IMP, not IDA.'
    supported_by:
    - reference_id: PMID:23239344
      supporting_text: Over-expression studies in 3T3-L1 cells indicated that it up-regulates the levels
        of CCAAT/enhancer binding protein α (C/EBPα) and PPARγ and promotes adipogenic differentiation
        starting from the early stage of adipogenesis.
      full_text_unavailable: true
    - reference_id: PMID:23239344
      supporting_text: C10orf16 manifested the characteristics of an adipocyte lineage-specific nuclear
        factor that can modulate the master adipogenesis transcription factors early during differentiation.
      full_text_unavailable: true
