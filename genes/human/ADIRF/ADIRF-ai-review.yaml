    summary: Accepted as correct but redundant. Pure InterPro2GO from IPR034450, a signature built from
      this gene's own papers, so for human ADIRF the row restates the IDA. The term is right; the route
      is circular. The same mapping over-reaches badly on other species, which is filed as an upstream
      question rather than acted on here.
    reason: 'InterPro''s IPR034450 is a single-family signature whose entire curated basis is this gene:
      its InterPro description is written from human ADIRF''s own papers, and it has exactly one reviewed
      Swiss-Prot member, human ADIRF itself. interpro2go maps IPR034450 to exactly two terms, GO:0045600
      and GO:0005634. Measured over the whole propagation (withFrom=InterPro:IPR034450, fully paginated,
      1512 annotations asserted complete): GO:0045600 reaches 723 gene products, of which only 130 are
      ADIRF-sized (60-90 aa) while 504 are larger than 200 aa and therefore cannot be orthologues of a
      76-aa protein, and 237 are non-vertebrate metazoans. Human ADIRF is not one of the mis-hit recipients,
      so this row''s action turns on the human evidence alone and is ACCEPT. The upstream defect - an
      Ala/Gln-rich 76-aa signature matching long tandem-repeat proteins in molluscs, insects and nematodes
      and carrying a mammal-derived adipocyte term to them - is raised in suggested_questions for InterPro
      and GO.'
