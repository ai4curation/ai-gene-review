- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IDA
  original_reference_id: GO_REF:0000052
  qualifier: located_in
  review:
    action: NEW
    summary: Proposed as missing. The Human Protein Atlas gives ADIRF TWO main subcellular locations,
      Nucleoplasm and Cytosol, from the same immunofluorescence experiment at reliability 'Supported',
      but GOA imported only the nucleoplasm half. GO:0005829 is absent from ADIRF's entire GOA record.
    reason: 'This is a gap in the HPA import rather than a disagreement with it, and it was verified against
      a positive control so that a zero cannot be a broken query: GAPDH is also called Cytosol by HPA
      and does carry GO:0005829 in GOA, with the term id resolved through the same location-to-term mapping
      used for ADIRF. GO:0005829 is not a descendant of GO:0005634, so this adds genuinely new information
      rather than restating the nuclear rows. This row rests on the HPA immunofluorescence call alone,
      which is sufficient for it. It deliberately does NOT lean on the sub-diffusion-limit argument: at
      7855 Da ADIRF is below the nuclear-pore passive-diffusion limit, but that predicts BOTH compartments
      and so discounts both equally - it cannot be evidence for one of them. That argument therefore appears
      only in the knowledge gap asking whether nuclear enrichment is active. Proposed as located_in only
      - no claim is made that any ADIRF function is executed in the cytosol, and cytosol is deliberately
      absent from core_functions locations for that reason.'
    supported_by:
    - reference_id: file:human/ADIRF/ADIRF-bioinformatics/RESULTS.md
