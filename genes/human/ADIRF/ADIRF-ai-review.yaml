existing_annotations:
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN008674116
  - UniProtKB:Q15847
  review:
    action: ACCEPT
    summary: Accepted. This is the PAN-GO curator's core-function statement for ADIRF, and its WITH/FROM
      names ADIRF itself (UniProtKB:Q15847) as the IBD seed alongside the node, so it is a self-referential
      IBA recording a human curator's judgement rather than a transfer from another species. The nucleus
      is independently supported by the gene's own IDA and by HPA immunofluorescence, and it is where
      a factor acting upstream of PPARG and CEBPA would have to act.
    reason: 'PANTHER:PTN008674116 reaches seven mammalian ADIRF orthologues by IBA (human, chimpanzee,
      gorilla, dog, pig, cow, opossum) and every one of them lists UniProtKB:Q15847 as the seed, because
      human ADIRF is the only member of the family with any experimental annotation. Mouse and rat are
      absent from that list for a concrete reason: Muroidea have no ADIRF gene at all. I note but do not
      act on the fact that `is_active_in` asserts the molecular function is executed in the nucleus, which
      is a stronger claim than `located_in` for a protein whose molecular function is entirely unknown,
      and that HPA calls cytosol a main location alongside nucleoplasm. Both points are raised as questions
      for GO_Central rather than used to downgrade a curator''s deliberate core-function call.'
    supported_by:
    - reference_id: PMID:23239344
      supporting_text: Our data demonstrated that C10orf116 is highly expressed in adipose tissue and
        is localized primarily within the nucleus.
    - reference_id: file:human/ADIRF/ADIRF-bioinformatics/RESULTS.md
      supporting_text: 'IBD seeds named in the WITH/FROM, with the `db` field read rather than flattened
        away: UniProtKB:Q15847 x14. The seed is the gene under review, so both IBA rows are **self-referential**:
        **True**.'
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN008674116
        source_label: PANTHER ancestral node for the ADIRF family
        source_status: SUPPORTS_TRANSFER
        comment: A PANTHER internal tree node, not a protein. It reaches 7 mammalian ADIRF orthologues
          by IBA, all seeded from human Q15847.
      - source_id: UniProtKB:Q15847
        source_label: human ADIRF (the gene under review; self-referential IBD seed)
        source_status: SUPPORTS_TRANSFER
        comment: 'Self-referential: the seed is the target. Per campaign convention this is valid and
          records a PAN-GO curator judging nuclear residence core, not a circular chain. Q15847 carries
          its own IDA to GO:0005634.'
