taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ADIRF (adipogenesis regulatory factor, formerly C10orf116, also known as APM2 and AFRO)
  is a 76-residue nuclear and cytosolic protein of vertebrates, originally identified as one of the most
  abundant transcripts in human adipose tissue. It is a small, alanine- and glutamine-rich polypeptide
  with no recognisable domain, no resolved structure and no known molecular activity: its only sequence
  feature is the mature chain itself. Introduced into preadipocytes it raises the levels of the master
  adipogenic transcription factors PPARG and CEBPA during the early phase of differentiation and accelerates
  adipogenic conversion, placing it upstream of the core adipogenic transcriptional program, though the
  mechanism by which it does so - and whether it acts at transcription directly - is unresolved. Immunofluorescence
  places the protein in both the nucleoplasm and the cytosol, a distribution consistent with its being
  far smaller than the nuclear-pore diffusion limit, and it is also recovered from extracellular fluids:
  it is present in human serum at microgram-per-millilitre concentrations and in urinary and prostatic
  exosome preparations, despite lacking any signal peptide or transmembrane segment. Expression is highest
  in arterial tissue and in adipose tissue, with additional expression in heart, cornea, liver, kidney
  and spleen, and the protein is detected in vascular and non-vascular smooth muscle. Elevated ADIRF is
  associated with obesity and, in tumour cells, with resistance to cisplatin. The gene is present across
  vertebrates: orthologues in teleost fish, birds and mammals all align across essentially the whole 76-residue
  protein. It was nonetheless lost in the ancestor of mice, rats and hamsters through a 43-kilobase deletion
  that removed its promoter and first exon, and it has no paralogue, so rodent models of the standard
  kind cannot report on its function.'
