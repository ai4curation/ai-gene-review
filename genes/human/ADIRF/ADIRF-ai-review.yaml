- term:
    id: GO:0070062
    label: extracellular exosome
  evidence_type: HDA
  original_reference_id: PMID:23533145
  qualifier: located_in
  review:
    action: KEEP_AS_NON_CORE
    summary: Kept as non-core. A real high-throughput detection in exosomes purified from expressed prostatic
      secretions in urine, but one of 1046 proteins given this single term from this one paper, with no
      ADIRF-specific validation - and the authors themselves caution that abundant contaminating proteins
      in such preparations must be verified before their presence is generalised.
    reason: 'The reference-projection test shows this PMID annotates 1046 distinct gene products with
      GO:0070062 and nothing else, all HDA, all assigned by UniProt. That is a bulk import, not 1046 independent
      findings; ADIRF is not mentioned anywhere in the paper''s narrative and the row derives from a supplementary
      identification list. One count I could not reconcile and am recording rather than explaining away:
      the paper''s text says close to 900 proteins were identified in the two pools, while GOA imported
      1046 entities from it, and the identifications live in a supplemental table absent from the cached
      text. ADIRF''s presence outside the cell is independently real and better supported than the exosome-specific
      claim: it is measured in human serum by ELISA at microgram-per-millilitre concentrations across
      139 patients (PMID:33737617) and detected as an intact protein by top-down mass spectrometry in
      lipoaspirate fluid (PMID:26719138). Neither is in GOA. That corroboration is why this row is kept
      rather than marked over-annotated. It supports the parent - GO:0070062 is a verified descendant
      of GO:0005576 extracellular region - and not the exosome mechanism, which requires release by multivesicular-body
      fusion and has never been tested for ADIRF. I did not propose GO:0005576 separately because this
      row already entails it. The protein has no signal peptide and no transmembrane segment, so the export
      route is unknown; that is filed as a knowledge gap.'
    supported_by:
    - reference_id: PMID:23533145
      supporting_text: Certainly the presence of high abundant contaminating proteins, in exosome preparations
        from cancer-related biofluids such as EPS-urine, must be taken into account and further verified
        before generalizing their presence to a clinical association with the cancerous condition.
    - reference_id: PMID:23533145
      supporting_text: in total, close to 900 proteins were identified in the two EPS-urine exosome pools
    - reference_id: PMID:33737617
      supporting_text: cut-off value was determined as 18.7 µg/mL, with a sensitivity and specificity
