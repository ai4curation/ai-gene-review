core_functions:
- description: 'Acts in the nucleus of cells of the adipocyte lineage to raise the expression of the master
    adipogenic transcription factors PPARG and CEBPA at early stages of preadipocyte differentiation,
    thereby promoting adipogenic differentiation. No molecular function is asserted: the protein is 76
    residues with no domain, no resolved structure and no measured catalytic, nucleic-acid-binding or
    protein-binding activity beyond a single unreplicated two-hybrid hit, so how it produces this effect
    is unknown. The supporting experiment is ectopic expression in a mouse cell line whose lineage lacks
    the gene, so this records what ADIRF can do rather than a demonstrated requirement.'
