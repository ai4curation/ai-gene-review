- id: PMID:19056867
  title: Large-scale proteomics and phosphoproteomics of urinary exosomes.
  full_text_unavailable: true
  findings:
  - statement: Profiles the proteome of exosomes from normal human urine and identifies 1132 proteins;
      ADIRF is one of the 1016 gene products GOA annotates to extracellular exosome from this study, from
      the supplementary identification list rather than from any ADIRF-specific result.
    supporting_text: Overall, the analysis identified 1132 proteins unambiguously, including 177 that
      are represented on the Online Mendelian Inheritance in Man database of disease-related genes, suggesting
      that exosome analysis is a potential approach to discover urinary biomarkers.
    full_text_unavailable: true
  - statement: Defines the vesicle population being sampled, which is what makes GO:0070062 rather than
      a generic extracellular term the assigned annotation.
    supporting_text: Normal human urine contains large numbers of exosomes, which are 40- to 100-nm vesicles
      that originate as the internal vesicles in multivesicular bodies from every renal epithelial cell
      type facing the urinary space.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title verified against the cached record. Correctly cited for a high-throughput detection,
      but it is a bulk import annotating 1016 gene products with a single term and it says nothing specific
      about ADIRF; cached abstract-only. No retraction, erratum or correction found on the PubMed record.
- id: PMID:23239344
  title: A Novel pro-adipogenesis factor abundant in adipose tissues and over-expressed in obesity acts
    upstream of PPARγ and C/EBPα.
  full_text_unavailable: true
  findings:
  - statement: The only functional characterisation of ADIRF in the nucleus, and the source of three of
      the eleven GOA rows. The assay is explicitly over-expression, which is why the two process rows
      should carry IMP rather than IDA.
    supporting_text: Over-expression studies in 3T3-L1 cells indicated that it up-regulates the levels
      of CCAAT/enhancer binding protein α (C/EBPα) and PPARγ and promotes adipogenic differentiation starting
      from the early stage of adipogenesis.
    full_text_unavailable: true
  - statement: Direct observation of nuclear localisation, supporting the GO:0005634 IDA row; this observation
      is a direct assay and IDA is correct for it.
    supporting_text: Our data demonstrated that C10orf116 is highly expressed in adipose tissue and is
      localized primarily within the nucleus.
    full_text_unavailable: true
  - statement: The authors' own summary of the inference, which is the basis for the GO:0045944 annotation;
      note it is framed as characteristics rather than a demonstrated mechanism.
    supporting_text: C10orf16 manifested the characteristics of an adipocyte lineage-specific nuclear
      factor that can modulate the master adipogenesis transcription factors early during differentiation.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Title verified against the cached record; note the source itself contains the typo 'C10orf16'
      in the abstract, reproduced verbatim above. Cached abstract-only, so claims here are bounded to
      what the abstract states; UniProt's 'stimulates transcription initiation' wording comes from the
      full text and is deferred to rather than re-derived. No retraction or erratum. This paper is absent
      from the affinage record despite being the reference behind three GOA rows.
- id: PMID:23533145
  title: In-depth proteomic analyses of exosomes isolated from expressed prostatic secretions in urine.
  findings:
  - statement: The authors caution that abundant contaminating proteins in these preparations require
      verification before their presence is generalised - directly relevant to a small, very abundant
      protein like ADIRF being detected in a urogenital-tract exosome preparation.
    supporting_text: Certainly the presence of high abundant contaminating proteins, in exosome preparations
      from cancer-related biofluids such as EPS-urine, must be taken into account and further verified
      before generalizing their presence to a clinical association with the cancerous condition.
  - statement: The paper's own protein count, which does not reconcile with the 1046 gene products GOA
      annotates from it; the identifications are in a supplemental table absent from the cached text,
      so the difference is recorded as unresolved.
    supporting_text: in total, close to 900 proteins were identified in the two EPS-urine exosome pools
  - statement: The authors note that proteins recovered in urine exosome preparations are often simply
      abundant, or may exist in soluble form - a further reason the exosome-specific claim is weaker than
      the extracellular one.
    supporting_text: This evidence suggests that, proteins found in urine exosome preparations are relatively
      abundant and thus also detected when the whole fluid is analyzed, or alternatively, some of these
      proteins could also exist as a soluble form.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title verified; full text available and read. Correctly cited for the HDA detection.
      ADIRF is not mentioned anywhere in the paper's text, so the annotation rests on a supplementary
      list; the caveats quoted are the authors' own. No retraction or erratum.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings:
  - statement: Establishes that the HuRI dataset screened with three Y2H assay versions, which is why
      IntAct logs the single ADIRF-IL18 interaction under three sub-methods and UniProt reports NbExp=3
      for what is one screen.
    supporting_text: We screened this search space a total of nine times with a panel of three Y2H assay
      versions
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title verified; full text available. Correctly cited as the source of the GO:0005515
      IPI row. Neither ADIRF nor IL18 appears in the paper's text, so the pair comes from the supplementary
      interaction list. The reference-projection test is uninformative for this reference - 85,343 annotations
      over 854 pages - and that is stated rather than a first-page count being substituted. No retraction
      or erratum.
- id: PMID:31945134
  title: Tripartite factors leading to molecular divergence between human and murine smooth muscle.
  findings:
  - statement: 'Identifies the genomic basis of ADIRF''s absence in the mouse lineage: a 43-kb deletion
      removing the promoter and first exon, which encodes the first 42 of the protein''s 76 residues.'
    supporting_text: The mouse locus corresponding to human ADIRF harbors a deletion of close to 43 kb
      (Fig 5A). This deletion is predicted to remove the promoter and first exon of ADIRF, a sequence
      that encodes the first 42 amino acids of the 76 amino acid gene product.
  - statement: Places the loss in the common ancestor of mouse, rat and hamster, which matches the independently
      measured absence of ADIRF across all of Muroidea.
    supporting_text: deletion of this segment (and loss of ADIRF expression) occurred in the evolutionary
      predecessor to mouse, rat, and hamster.
  - statement: ADIRF is more abundant in arterial tissue than in the adipose tissue that gave it its name
      - relevant because all eleven GOA rows are adipogenesis or localisation and none is vascular.
    supporting_text: The ADIRF gene is relatively highly expressed (over 700 RKMP in tibial artery in
      GTEx [Release V6]) and more abundant in arterial than adipose tissue where it was initially characterized.
  - statement: 'Provides a specificity control for antibody Sigma HPA026810, the same antibody behind
      HPA''s immunofluorescence call and therefore behind the GO:0005654 IDA row: it gives no signal in
      any mouse tissue, the species lacking the gene.'
    supporting_text: Finally, mouse did not stain for LPHN2/ADGRL2 in lung non-vascular SMC or for ADIRF
      in any tissue.
  - statement: ADIRF has no clear paralogue, so no functional redundancy can compensate for its absence
      in the mouse lineage - independently confirmed here, since the only other human PTHR39227 entry,
      Q5TBU5, is an unreviewed TrEMBL duplicate with the identical 76-aa sequence.
    supporting_text: The chances that ADIRF could result in functional changes is increased because it
      appears to encode a protein with no clear paralogs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Title verified; full text available and read. This is the single most consequential
      reference for interpreting ADIRF''s annotations and it is absent from GOA, from UniProt''s reference
      list and from the affinage record. One claim in it is NOT relied on, and is adjudicated on sequence
      rather than on a symbol count: it also states ADIRF is absent from zebrafish and lamprey. An earlier
      version of this review declined that on the strength of an NCBI symbol/alias count, which is orthology
      asserted by an annotation pipeline rather than measured, and is exactly the name-based inference
      the rest of this analysis refuses. Aligning the actual RefSeq proteins instead: NP_001373520.1 (Danio
      rerio) and XP_085644419.1 (Trachurus japonicus) are both 81 aa and align over 71 of the 76 human
      residues at 38.2% identity, passing the same coverage criterion used throughout - with a chicken
      positive control, the 938-aa Cyprinus carpio family member as a negative control that fails as expected,
      and only 1 of 30 composition-matched shuffles passing. So an ADIRF-like protein is annotated in
      zebrafish and the paper''s zebrafish claim is inconsistent with current RefSeq annotation - though
      this review examined sequence, not synteny, so it does not adjudicate the genomic-deletion argument
      the paper actually makes. The mouse/rat/hamster claim, which is what this review does rely on, is
      independently confirmed. No retraction or erratum.'
- id: PMID:33737617
  title: Adipose most abundant 2 protein is a predictive marker for cisplatin sensitivity in cancers.
  findings:
  - statement: Measures ADIRF/APM2 in human serum by ELISA at microgram-per-millilitre concentrations
      in 139 patients, independently corroborating that the protein reaches an extracellular fluid - a
      route absent from GOA.
    supporting_text: cut-off value was determined as 18.7 µg/mL, with a sensitivity and specificity of
      84.0% and 71.7%, respectively
  - statement: The authors treat secretion into the blood as a premise for their assay design rather than
      demonstrating it, so this paper establishes that ADIRF is present in serum but not how it gets there
      - and the protein has no signal peptide or transmembrane segment.
    supporting_text: To determine serum APM2 concentration as a potential biomarker of CDDP sensitivity,
      as it is secreted into the blood stream, the APM2 serum level was tested with ELISA in 71 HCC patients
      who were treated with CDDP intra-arterial infusion
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Title verified; full text available and read. Cited only for the measured serum concentration,
      which is used to corroborate extracellular presence and hence to keep rather than downgrade the
      GO:0070062 rows. The paper's ERCC6L-upregulation claim rests on bioinformatic plus histological
      analysis and is deliberately NOT used to support any annotation. No retraction or erratum. Absent
      from the affinage record.
- id: PMID:26719138
  title: 'Lipoaspirate fluid proteome: A preliminary investigation by LC-MS top-down/bottom-up integrated
    platform of a high potential biofluid in regenerative medicine.'
  full_text_unavailable: true
  findings:
  - statement: Detects intact ADIRF by top-down mass spectrometry in the acid-soluble fraction of lipoaspirate
      fluid, a third independent extracellular detection route and one from adipose tissue itself.
    supporting_text: adipogenesis regulatory factor, perilipin-1 fragments, and S100A6, along with their
      PTMs
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'Title verified against the cached record; cached abstract-only, and the quoted sentence
      is from the abstract. Corroborating only: a preliminary two-sample study, cited for the fact of
      detection in an extracellular adipose fluid and for nothing more. No retraction or erratum.'
- id: PMID:19444912
  title: APM2 is a novel mediator of cisplatin resistance in a variety of cancer cell types regardless
    of p53 or MMR status.
  full_text_unavailable: true
  findings:
  - statement: 'The second phenotype attributed to ADIRF: over-expression confers cisplatin resistance
      and silencing sensitises cancer cell lines. No molecular mechanism is identified, and no GO annotation
      exists or is proposed for it, because a drug-resistance phenotype is not a molecular function or
      a biological process the gene participates in.'
    supporting_text: APM2 is a novel mediator of cisplatin resistance in a variety of cancer cell types
      regardless of p53 or MMR status.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'Title verified. One of the two references the affinage record returned, and it checks
      out. Cited here to record why no GO annotation follows from it: the cisplatin phenotype is downstream
      physiology in tumour cell lines, not a function of the protein, and it is explicitly not proposed
      as a new term. Cached abstract-only. No retraction or erratum.'
- id: PMID:23467766
  title: Overexpression of C10orf116 promotes proliferation, inhibits apoptosis and enhances glucose transport
    in 3T3-L1 adipocytes.
  full_text_unavailable: true
  findings:
  - statement: 'A third over-expression study in the same mouse 3T3-L1 line, reporting effects on proliferation,
      apoptosis and insulin-stimulated glucose uptake. No GO annotation is proposed from it: it shares
      the interpretive limit of PMID:23239344, being ectopic expression in a lineage with no ADIRF gene,
      and the reported effects are cellular phenotypes rather than the protein''s own activity.'
    supporting_text: Overexpression of C10orf116 promotes proliferation, inhibits apoptosis and enhances
      glucose transport in 3T3-L1 adipocytes.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Title verified. The second of the two affinage citations; it checks out. InterPro cites
      this paper in its IPR034450 description, which is part of why the InterPro2GO rows for this gene
      are circular. Cached abstract-only; cited for scope rather than as support for any annotation. No
      retraction or erratum.
- id: PMID:24052233
  title: Characterization of microRNA expression profiles in 3T3-L1 adipocytes overexpressing C10orf116.
  full_text_unavailable: true
  findings:
  - statement: A fourth study, again over-expression in mouse 3T3-L1. Cited to establish the completeness
      of the claim that every functional experiment on ADIRF used this one heterologous system; no annotation
      is drawn from it.
    supporting_text: Characterization of microRNA expression profiles in 3T3-L1 adipocytes overexpressing
      C10orf116.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Title verified. Cached abstract-only. Cited only to support the scope claim that all
      ADIRF functional work is 3T3-L1 over-expression. No retraction or erratum.
- id: PMID:36261012
  title: Circadian lncRNA ADIRF-AS1 binds PBAF and regulates renal clear cell tumorigenesis.
  findings:
  - statement: 'Concerns ADIRF-AS1, a distinct antisense lncRNA gene at the ADIRF locus, not the ADIRF
      protein. Recorded to make the boundary explicit: 10 of the 37 PubMed records matching ADIRF in title
      or abstract are about this lncRNA, and none of ADIRF''s eleven GOA rows cites any of them.'
    supporting_text: Circadian lncRNA ADIRF-AS1 binds PBAF and regulates renal clear cell tumorigenesis.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: 'Title verified; full text available. Deliberately included as a NEGATIVE control on
      the review''s scope rather than as evidence: it documents that the locus/transcript confusion hazard
      was checked and that the GO record is free of it. Nothing in this review''s verdicts depends on
      it. Separately noted: another ADIRF-AS1 paper, PMID:35937391, is a Retracted Publication, and nothing
      here rests on it either.'
- id: file:human/ADIRF/ADIRF-deep-research-affinage.md
  title: Affinage mechanistic annotation for ADIRF (human)
  findings: []
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: 'Recorded so the provider''s performance on this gene is measurable, and deliberately
      NOT cited as supporting_text for any annotation. Precision is fine: gates_passed is True, both citations
      (PMID:19444912, PMID:23467766) are real numeric PubMed ids rather than bioRxiv DOIs in a PMID-shaped
      field, both resolve to papers genuinely about this gene under its former names, and neither is retracted.
      Recall for annotation purposes is close to zero: it returned none of the four PMIDs GOA cites -
      including PMID:23239344, the reference behind three of the eleven rows and the only nuclear characterisation
      of the protein - and it missed PMID:31945134 (the 43-kb Muroid deletion and the arterial expression
      data), which is the single most consequential fact about this gene, and PMID:33737617 (serum at
      microgram-per-millilitre). Marked LOW_QUALITY for one substantive inaccuracy rather than for its
      citations: the narrative asserts that no binding partner has been characterised, while a curated
      IL18 interaction sits in the GO record it did not consult. Its empty molecular_activity, localization,
      partners and complexes fields are, by contrast, correct for this gene.'
