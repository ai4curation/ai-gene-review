  provenance:
  - reference_id: PMID:23239344
    supporting_text: Our data demonstrated that C10orf116 is highly expressed in adipose tissue and is
      localized primarily within the nucleus.
    full_text_unavailable: true
suggested_questions:
- question: 'Should the InterPro2GO mapping from IPR034450, or the signature itself, be restricted? Measured
    with a fully paginated QuickGO query (withFrom=InterPro:IPR034450, 1512 annotations, completeness
    asserted): GO:0045600 positive regulation of fat cell differentiation reaches 723 gene products, of
    which only 130 are ADIRF-sized (60-90 aa) while 504 exceed 200 aa and 237 are non-vertebrate metazoans
    - among them a 2304-aa Toxocara canis protein, a 1578-aa Melipona quadrifasciata protein and nine
    Mizuhopecten yessoensis proteins. The cause is that human ADIRF is a 76-aa low-complexity sequence
    whose three commonest residues are 43.4% of it, and PTHR39227 accordingly contains 556 members over
    200 aa including 39 fungal, 16 bacterial and 15 plant entries. Aligning human ADIRF against five genuine
    orthologues and twelve oversized recipients separates them cleanly on coverage: orthologues align
    over 75-76 of 76 residues, oversized members over 23-65, and the oversized members are tandem-repeat
    proteins with 11/22/33-residue periods. Note this is a signature-specific problem, not a general indictment
    of InterPro2GO: the mapping consists of exactly two terms and both are correct for the gene the entry
    was built from. There is a reciprocal half worth fixing at the same time: the family has 50 teleost
    members in UniProtKB and not one of them is ADIRF-sized, so its entire fish content is oversized spurious
    matches, while the genuine teleost ADIRF proteins - for example NP_001373520.1 in Danio rerio, 81
    aa, aligning over 71 of the 76 human residues - are annotated in RefSeq and absent from the family.
    The signature is thus simultaneously over-inclusive of unrelated repeat proteins and under-inclusive
    of real orthologues.'
  experts:
  - InterPro curators
  - GO Central
- question: 'Should UniProtKB:A0A5F8H3S4 be removed from PANTHER subfamily PTHR39227:SF1, and is the Monodelphis
    domestica proteome missing its real ADIRF? PANTHER node PTN008674116 propagates both of human ADIRF''s
    IBA terms - including is_active_in GO:0005634, which asserts the molecular function is executed there
    - to 7 gene products. Six are genuine orthologues of 75-76 aa aligning over 73-76 of the 76 human
    residues at 81.6-100% identity. The seventh, A0A5F8H3S4, is a 447-aa ''Uncharacterized protein'' built
    from a 22-residue tandem repeat at 85.4% periodicity whose three commonest residues are 52.1% of the
    sequence; it aligns over only 62 of 76 residues at 15.8% identity, inside the same band as the unambiguously
    spurious IPR034450 matches. Importantly the root cause looks to be upstream of PAINT rather than in
    the tree curation: NCBI Gene has a real 3-exon ADIRF gene for this species (GeneID 100020286, ADIPOQ
    control non-zero for the same taxon), but UniProt''s Monodelphis proteome contains no ADIRF-sized
    member of the family, so the only candidate the HMM had to match was the repeat protein. The actionable
    items are therefore (a) whether the family HMM should admit a 447-aa tandem-repeat protein at all,
    and (b) whether the missing opossum ADIRF protein should be added to the reference proteome. Stated
    as a question rather than a finding about PAINT, whose placement of the six real orthologues is correct.'
  experts:
  - PANTHER curators
  - GO Central
  - UniProt proteomes
- question: Is GO:0045600's taxon constraint of only_in_taxon NCBITaxon:6072 (Eumetazoa) intended to admit
    invertebrates? The constraint machinery is demonstrably working - of the 723 recipients of GO:0045600
    via IPR034450, zero are outside Metazoa, so the fungal, plant and bacterial family members are correctly
    excluded, and GO:0005634's Eukaryota constraint likewise excludes the bacterial and archaeal ones.
    But 237 recipients are invertebrate metazoans, and they pass the constraint. GO:0045444's definition
    is 'The process in which a relatively unspecialized cell acquires specialized features of an adipocyte,
    an animal connective tissue cell specialized for the synthesis and storage of fat' - so the question
    is whether an insect fat body cell or a mollusc storage cell satisfies that differentia. If not, the
    constraint may want tightening toward Vertebrata. Raised as a question because the answer determines
    whether the invertebrate annotations are a constraint problem or purely a signature problem.
  experts:
  - GO Central
  - GO taxon constraint working group
- question: Should the two PMID:23239344 process rows (GO:0045600 and GO:0045944) be recoded from IDA
    to IMP? The abstract states the assay as 'Over-expression studies in 3T3-L1 cells', and GO's IMP definition
    explicitly covers over-expression and ectopic expression of wild-type genes, whereas IDA is for a
    direct assay of the gene product's own activity or location. The GO:0005634 row from the same paper
    is a genuine direct observation and should stay IDA. Flagged rather than acted on because the review
    schema records term-level actions, not evidence-code corrections.
  experts:
  - UniProt curators
  - GO Central
- question: Is is_active_in the right qualifier for GO_Central's GO:0005634 IBA on a gene with no known
    molecular function? is_active_in asserts that the molecular function is executed in the nucleus, but
    ADIRF has no measured molecular function of any kind, and the Human Protein Atlas gives it two main
    locations - Nucleoplasm and Cytosol - from one immunofluorescence experiment at reliability Supported.
    At 7855 Da the protein is well below the nuclear-pore passive-diffusion limit and has no annotated
    NLS, so dual distribution is the physical expectation. The row was accepted as a deliberate core-function
    judgement by curators who read the same literature; the question is whether located_in would be the
    safer qualifier until a molecular function is known.
  experts:
  - GO Central
  - PAN-GO curators
- question: Should GOA import the cytosol half of HPA's ADIRF immunofluorescence call? HPA gives Nucleoplasm
    and Cytosol as co-equal main locations for ENSG00000148671 (antibody HPA026810, IF reliability Supported),
    but the GO_REF:0000052 row carries only GO:0005654, and GO:0005829 is absent from ADIRF's whole GOA
    record. Verified against a positive control - GAPDH is also called Cytosol by HPA and does carry GO:0005829
    - so this is a gap in the import rather than a broken query. Proposed here as a NEW row.
  experts:
  - HPA curators
  - GOA curators
- question: 'Should UniProt entry Q15847 drop or qualify its two keyword-derived GO cross-references?
    The entry carries ''DR   GO; GO:0030154; P:cell differentiation; IEA:UniProtKB-KW.'' and ''DR   GO;
    GO:0006351; P:DNA-templated transcription; IEA:UniProtKB-KW.'', neither of which is entailed by the
    gene''s evidence. I fetched the relations rather than inferring them from labels: GO:0045944 is not
    a descendant of GO:0006351, and GO:0045600 is a descendant of neither GO:0030154 nor GO:0045444, because
    GO deliberately keeps regulation out of the is_a hierarchy. GO:0006351 is ''The synthesis of an RNA
    transcript from a DNA template'', i.e. it says ADIRF performs transcription rather than regulating
    it. GOA no longer imports the Swiss-Prot keyword route - GO_REF:0000043 returns 0 human annotations
    against 139,714 for GO_REF:0000044 - so these claims are now invisible from GOA and there is no GO
    row to correct; it is a UniProt-side request only.'
  experts:
  - UniProt curators
- question: Should UniProt entry Q15847 add the arterial expression data and the two missing primary references?
    Its TISSUE SPECIFICITY line leads with adipose tissue, but PMID:31945134 reports over 700 RKMP in
    tibial artery in GTEx and states the gene is more abundant in arterial than adipose tissue. That paper
    is also the only source for the 43-kb Muroid deletion that explains why the gene has no mouse orthologue
    - highly relevant to anyone planning experiments - and PMID:33737617 provides the only quantitative
    measurement of the protein in a body fluid. Neither is in the entry's reference list.
  experts:
  - UniProt curators
- question: Is ADIRF's real biology vascular rather than adipose, and if so what accounts for the adipose
    framing? The gene's approved name, its InterPro entry name, its PANTHER family name and all eleven
    of its GOA rows derive from its discovery as the second most abundant transcript in adipose tissue,
    but expression is higher in artery, and the one study that examined vascular smooth muscle found it
    there while noting its complete absence in mouse. No GO action is proposed because no vascular function
    has been assayed.
  experts:
  - vascular smooth muscle biologists
  - adipose tissue biologists
suggested_experiments:
- hypothesis: ADIRF is required for, and not merely sufficient to accelerate, adipocyte differentiation
    in cells that express it endogenously.
  description: 'CRISPR knockout and inducible degron-tagged depletion of ADIRF in a human preadipocyte
    model that expresses it endogenously (for example SGBS cells or primary human adipose-derived stromal
    cells), scoring differentiation by lipid accumulation and by PPARG and CEBPA induction. This is the
    experiment the entire existing literature lacks: every published functional result is ectopic expression
    in mouse 3T3-L1 cells, and the mouse lineage carries a 43-kb deletion of the ADIRF locus, so no loss-of-function
    has ever been tested in a background that has the gene. Reconstitution with the human protein should
    rescue.'
  experiment_type: loss-of-function genetics
- hypothesis: ADIRF acts through a protein partner rather than through an intrinsic biochemical activity.
  description: Proximity-dependent biotinylation (TurboID or BioID2) with ADIRF fused at each terminus,
    performed in parallel in differentiating human preadipocytes and in primary human vascular smooth
    muscle cells, with a size-matched inert bait as control. Because ADIRF is only 76 residues, run a
    free-tag control to subtract compartment background, and compare nuclear and cytosolic fractions separately.
    This directly targets the gene's largest gap - no molecular function of any kind is known - and the
    vascular arm addresses the tissue where the gene is most abundant but wholly unannotated.
  experiment_type: proximity labelling proteomics
- hypothesis: ADIRF associates with chromatin at the PPARG and CEBPA loci, as its GO:0045944 annotation
    implies.
  description: 'CUT&RUN or ChIP-seq for endogenous ADIRF (or a knock-in epitope tag to avoid over-expression
    artefacts) in differentiating human preadipocytes, with matched input and an IgG control, asking whether
    the protein occupies the PPARG and CEBPA regulatory regions. A negative result would be informative:
    it would argue that ADIRF acts upstream of transcription rather than at it, and would justify generalising
    GO:0045944 to a term that does not assert action at Pol II.'
  experiment_type: chromatin occupancy
- hypothesis: Nuclear enrichment of ADIRF is active rather than a consequence of free diffusion through
    the nuclear pore.
  description: Compare the nucleocytoplasmic distribution of ADIRF-GFP with ADIRF fused to a tandem multimeric
    tag that raises the fusion above the passive-diffusion limit (for example ADIRF-3xGFP, roughly 90
    kDa), alongside free GFP and free 3xGFP controls, and measure exchange by fluorescence loss in photobleaching.
    If nuclear enrichment persists for the oversized fusion, retention is active and a retention factor
    exists to be found; if it collapses, the observed distribution is equilibration and the GO nuclear
    annotations describe an accessible compartment rather than a functional site.
  experiment_type: live-cell imaging
- hypothesis: ADIRF reaches serum by unconventional secretion or in extracellular vesicles, not by release
    from damaged cells.
  description: Fractionate conditioned medium from human adipocytes and vascular smooth muscle cells by
    size-exclusion chromatography and density gradient, and ask whether ADIRF co-migrates with CD9/CD63/TSG101-positive
    vesicles or with the free protein fraction; test protease protection with and without detergent to
    distinguish luminal cargo from surface-associated protein; and test brefeldin A insensitivity to exclude
    the classical pathway, which the absence of a signal peptide already predicts. Include a cell-death
    marker such as LDH release as the control that discriminates secretion from lysis. This decides whether
    GO:0070062 or a generic extracellular-region annotation is the supportable term.
  experiment_type: secretion and vesicle biochemistry
- hypothesis: The ADIRF-IL18 interaction reported by the HuRI two-hybrid screen occurs at native expression
    levels.
  description: 'Test the interaction orthogonally: reciprocal co-immunoprecipitation of endogenous ADIRF
    and pro-IL18 from a cell type expressing both, in situ proximity ligation assay, and NanoBiT complementation
    with a non-interacting pair as negative control. Because pro-IL18 is cytosolic and ADIRF is cytosolic
    and nucleoplasmic the interaction is topologically possible, so this is a genuine open question rather
    than an implausible one - but the current annotation rests on a single screen logged under three assay
    versions and has never been replicated by any other method.'
  experiment_type: interaction validation
