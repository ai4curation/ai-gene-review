- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q14116
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Marked as over-annotated. The interaction with IL18 is a single unreplicated yeast-two-hybrid
      hit from the HuRI systematic screen, its apparent triplicate support is one screen logged under
      three assay versions, and `protein binding` conveys nothing about what ADIRF does. No informative
      replacement term is proposed because no functional consequence of the interaction has ever been
      measured.
    reason: 'UniProt records NbExp=3 for this pair, but IntAct returns a single interaction record (EBI-11784632,
      MI-score 0.56) logged under three sub-methods - two hybrid array, two hybrid prey pooling approach,
      and validated two hybrid - and the source paper states it screened with a panel of three Y2H assay
      versions. So NbExp counts assay versions, not independent experiments. Neither ADIRF nor IL18 is
      named in the paper''s text; the pair comes from the supplementary interaction list. There is no
      orthogonal assay and no follow-up literature linking the two proteins. Three checks that would have
      strengthened the case came back NEGATIVE and are reported as such rather than omitted: (1) the partner
      accession resolves to reviewed canonical Swiss-Prot IL18 at the full 193 aa, so there is no TrEMBL
      or partial-ORFeome substitution; (2) neither protein is a promiscuous hub - IL18 has 15 distinct
      IntAct partners and ADIRF has 4; (3) the interaction is not topologically impossible, because IL18
      is a leaderless cytokine whose precursor UniProt describes as cytosolic and ADIRF is nucleoplasmic
      and cytosolic, so both could meet in the cytosol. The verdict therefore rests only on the absence
      of replication and the uninformativeness of the term, not on any argument that the observation is
      impossible.'
    supported_by:
    - reference_id: PMID:32296183
      supporting_text: We screened this search space a total of nine times with a panel of three Y2H assay
        versions
    - reference_id: file:human/ADIRF/ADIRF-uniprot.txt
      supporting_text: 'CC       Q15847; Q14116: IL18; NbExp=3; IntAct=EBI-7162516, EBI-3910835;'
