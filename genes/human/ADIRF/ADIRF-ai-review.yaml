- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:23239344
  qualifier: located_in
  review:
    action: ACCEPT
    summary: Accepted. Direct observation of nuclear localisation in the paper that first characterised
      the gene, independently corroborated by HPA immunofluorescence with a well-controlled antibody.
      Unlike the two process rows from the same paper, this one is a direct assay and IDA is the correct
      evidence code for it.
    reason: 'The abstract states the localisation directly. The full text is not available (full_text_available:
      false) so the method is not visible to me, but the result is corroborated by an independent antibody-based
      dataset and by UniProt''s curated SUBCELLULAR LOCATION line. One caveat is recorded as a knowledge
      gap rather than used against the row: at 76 aa and 7855 Da ADIRF is far below the nuclear-pore passive-diffusion
      limit and has no annotated NLS, so nuclear presence is the default expectation for a protein this
      small and carries little information. The paper says ''primarily within the nucleus'', which implies
      enrichment rather than mere presence, and enrichment of a freely diffusible protein requires a retention
      mechanism that nobody has identified.'
