  review:
    action: REMOVE
    summary: Huntingtin (HTT) interaction from a yeast two-hybrid huntingtin interactome screen.
    reason: GO:0005515 protein binding is uninformative about GNAO1 function. These screen-derived partners
      (huntingtin, VCP, calreticulin, ABCD3, CBX5, DLST, NEK7, RPS6KA3, TGFBR2, SYNGAP1) do not establish
