    action: TOO_GENERAL
    summary: Galpha-o hydrolyses bound GTP to GDP (Rhea:19669 in UniProt, measured with BODIPY-GTP in
      PMID:39103320); the intrinsic GTPase is what times the end of each signalling event.
    reason: The claim is correct, but GO:0003924 GTPase activity is a direct is_a parent of GO:0003925
      G protein activity, which this review accepts as the core molecular function on IDA and IBA evidence.
      G protein activity says everything GTPase activity says, and also captures the GTP/GDP switch that
      regulates effectors. TOO_GENERAL judges the term, not this row's evidence; it does not mean the
      GTPase claim is wrong.
