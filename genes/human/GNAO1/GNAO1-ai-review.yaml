id: P09471
gene_symbol: GNAO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNAO1 encodes Galpha-o, the alpha subunit of the Go heterotrimeric G protein (Gi/o/t/z subfamily),
  the most abundant G protein in the brain, also expressed in heart and endocrine cells. Lipid-anchored
  on the cytoplasmic face of the plasma membrane (with a Golgi pool), GDP-bound Galpha-o associates with
  Gbeta-gamma; agonist-activated Gi/o-coupled receptors (e.g. dopamine D2, serotonin 5-HT1B, mu-opioid,
  M2 muscarinic, alpha2-adrenergic, GABA-B, adhesion GPR97) catalyse GDP/GTP exchange, releasing GTP-Galpha-o
  and Gbeta-gamma, which inhibit adenylyl cyclase and regulate ion channels such as GIRK K+ channels and
  voltage-gated Ca2+ channels; the intrinsic GTPase, accelerated by RGS proteins, terminates signalling.
  Two splice isoforms (GoA, GoB) exist. De novo dominant missense variants cause GNAO1 encephalopathy
  (developmental and epileptic encephalopathy 17 and neurodevelopmental disorder with involuntary movements),
  by disrupting nucleotide binding/hydrolysis or Gbeta-gamma release, often with dominant-negative effects.
