  review:
    action: REMOVE
    summary: Interaction with RIC8A from a proteome-scale interactome map (PMID:33961781). RIC8A is a
      non-receptor guanine-nucleotide exchange factor and folding chaperone for Galpha-i/o subunits, so
      this pair is biologically meaningful.
    reason: GO:0005515 is uninformative. The RIC8A interaction is real and meaningful, since RIC8A acts
      on Galpha subunits as a GEF/chaperone, but the activity belongs to RIC8A. GNAO1 is its substrate
      and has no distinct molecular function to annotate beyond G protein activity. Removal does not mean
      the interaction is false.
