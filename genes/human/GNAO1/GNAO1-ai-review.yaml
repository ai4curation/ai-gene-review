- description: Binding and release of Gbeta-gamma. GDP-Galpha-o holds Gbeta-gamma in the inactive heterotrimer,
    and GTP loading releases it to gate effectors such as GIRK K+ channels and voltage-gated Ca2+ channels.
    Several encephalopathy variants act dominant-negatively by failing to release Gbeta-gamma.
