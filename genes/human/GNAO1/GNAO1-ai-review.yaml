id: P09471
gene_symbol: GNAO1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNAO1 encodes the Go alpha subunit, an abundant neuronal heterotrimeric G protein that switches
  between GDP- and GTP-bound states to transmit receptor signals. Go participates in neurotransmitter-receptor
  control of channels, vesicle release and cAMP signaling, with different alpha isoforms and cellular
  contexts determining the output. Cellular suppression of cAMP can involve beta/gamma availability and
  pathway coupling rather than direct inhibition of every cyclase isoform. Go is prominent at neuronal
  plasma membranes and synapses and also regulates endocrine secretory-vesicle docking.
