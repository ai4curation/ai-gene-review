suggested_questions:
- question: Which GNAO1 encephalopathy variants act by loss of nucleotide binding (K46E, Q52P/R) and which
    by impaired Gbeta-gamma release (R209C), and does this mechanistic class predict epilepsy-dominant
    (DEE17) versus movement-disorder-dominant (NEDIM) phenotypes?
- question: Do the GoA and GoB splice isoforms differ in receptor coupling or effector preference (e.g.
    GoB in beta-cell insulin secretion versus GoA in neurons) enough to justify isoform-specific annotations?
- question: Is the PAINT-propagated corticotropin-releasing hormone receptor 1 binding (GO:0051430) supported
    by any direct CRHR1–Go coupling data, or should the IBD node be restricted?
suggested_experiments:
- description: Compare a panel of GNAO1 patient variants in BRET-based receptor–G protein coupling, GTP
    binding/hydrolysis and Gbeta-gamma release assays (D2R, GABA-B, alpha2A-AR) with and without co-expressed
    wild-type Galpha-o, in striatal neurons derived from patient iPSCs.
  hypothesis: Variants that trap receptor–Gbeta-gamma complexes act dominant-negatively on wild-type Go
    signalling, and the strength of this effect correlates with clinical severity.
  experiment_type: cell biology
- description: Use isoform-specific knock-in mice (GoA-only or GoB-only) to quantify neuronal GIRK/Ca2+
    channel modulation and beta-cell insulin secretion.
  hypothesis: GoA and GoB have partly non-redundant effector coupling in neurons and endocrine cells.
  experiment_type: genetic
