- term:
    id: GO:0005525
    label: GTP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - UniProtKB:P18872
  - ensembl:ENSMUSP00000114144
  - InterPro:IPR001408
  review:
    action: ACCEPT
    summary: Galpha-o binds GTP (and GDP) in its nucleotide-binding pocket formed by the Ras-like domain
      P-loop/switch regions (UniProt BINDING features). GTP binding is the activating step of the G protein
      cycle.
    reason: Correct and mechanistically central. Encephalopathy variants Q52P/R and K46E abolish GTP binding
      (PMID:34685729, PMID:39103320), linking this function to the disease. Kept alongside G protein activity
      because it describes the nucleotide-binding capacity that the switch depends on.
    supported_by:
    - *id003
    - reference_id: PMID:34685729
      supporting_text: At the biochemical level, the three mutant proteins are deficient in binding and
        hydrolyzing GTP, which is the fundamental function of the healthy G proteins.
    - reference_id: PMID:39103320
      supporting_text: GαoK46E has a charge reversal that clashes with the phosphate groups of GDP and
        GTP.
