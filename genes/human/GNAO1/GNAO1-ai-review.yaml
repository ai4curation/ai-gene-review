  review:
    action: ACCEPT
    summary: Core molecular function. Galpha-o is a heterotrimeric G-protein alpha subunit. An agonist-bound
      GPCR catalyses GDP/GTP exchange, the GTP-bound alpha subunit and the freed Gbeta-gamma regulate
      effectors, and the intrinsic GTPase ends the signal. Supported directly by receptor–Go cryo-EM and
      coupling assays (PMID:29925951, PMID:33408414, PMID:39103320) and by disease variants that disrupt
      the nucleotide cycle (PMID:34685729).
    reason: GO:0003925 is the right term for a GTP/GDP-switch G protein, and it matches the human GO-CAM
      models for GNAO1 (HTR1B, ADGRG3, CHRM2, ADRA2B). The PAINT IBA, the IDA rows and the IEA/ISS transfers
      all agree.
    supported_by: &id006
    - *id003
    - &id004
      reference_id: PMID:39103320
      supporting_text: Many neurotransmitter receptors activate G proteins through exchange of GDP for
        GTP.
    - &id005
      reference_id: PMID:39103320
      supporting_text: the purified protein binds poorly to guanine nucleotides yet retains wild-type
        affinity for G protein βγ subunits
