core_functions:
- description: Heterotrimeric G-protein alpha subunit acting as a GTP/GDP switch that transduces signals
    from Gi/o-coupled GPCRs. Receptor-catalysed GDP/GTP exchange activates Galpha-o and releases Gbeta-gamma,
    adenylyl cyclase is inhibited, and the intrinsic GTPase ends the signal.
  molecular_function:
