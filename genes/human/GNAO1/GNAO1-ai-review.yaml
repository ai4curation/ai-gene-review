  review:
    summary: The GDP-state G alpha subunit associates with a G beta/gamma dimer to form a functional heterotrimer.
    action: ACCEPT
    reason: The GDP-state G alpha subunit associates with a G beta/gamma dimer to form a functional heterotrimer.
      Receptor-coupling and structural/reconstitution experiments support this assembly and beta/gamma
      binding as integral functions. A particular experimental beta/gamma combination does not imply universal
      interchangeability.
