- term:
    id: GO:0010008
    label: endosome membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      This is the annotation where WITH/FROM resolution changes the reading, even though it
      does not change the outcome. The donors are PANTHER:PTN001142372 (the deep
      superfamily node), RGD:1562939 and WB:WBGene00000565. RGD:1562939 is rat Acap2 - a
      PARALOGUE, the orthologue of human ACAP2, not of ACAP3 - carrying GO:0010008 by IDA
      from PMID:23572513 in an NGF/endocytic-recycling context, and it is the only
      mammalian donor. WB:WBGene00000565 is C. elegans cnt-1, the worm's single
      centaurin-beta, with GO:0031901 early endosome membrane IDA from PMID:22869721;
      being single-copy it cannot discriminate ACAP1/2/3 sub-functions.

      The diagnostic detail is what is absent: mouse Acap3, the 1:1 orthologue, is NOT in
      this WITH/FROM, although it IS in the WITH/FROM of both neuronal terms. PAINT
      therefore had no orthologue evidence for the endosomal compartment and fell back to
      the superfamily node; the orthologue's own experimentally determined location is the
      growth cone (GO:0030426 IDA, PMID:27330119). So when this annotation was made, the
      mammalian case for it rested entirely on a paralogue.

      Independent human evidence has since caught up. ACAP3 impairs EGFR recycling and
      accelerates lysosome-mediated EGFR degradation in a GAP-activity-dependent manner
      (PMID:41520057) - endosomal sorting biology, on the human protein. The compartment is
      therefore right, and it is now justified for the human gene by human data rather than
      by the paralogue transfer that originally produced it. Accepted, with the propagation
      caveat recorded rather than buried: no study has yet imaged ACAP3 itself on an
      endosome, so this remains an activity-site inference.
    action: ACCEPT
    reason: >-
      The compartment is correct and is where the newly described human function is
      exercised, so it is retained as a core site of action. The route by which it arrived
      is worth flagging: its only mammalian experimental donor is the paralogue ACAP2 and
      the 1:1 orthologue is absent from the WITH/FROM, so the annotation was right for the
      wrong reason until PMID:41520057 supplied human evidence.
    additional_reference_ids:
    - PMID:41520057
    propagation_review:
      root_cause: NO_FAILURE_CORE
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      source_entities:
      - source_id: RGD:1562939
        source_label: rat Acap2 (paralogue)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          GO:0010008 IDA (PMID:23572513) is solid for Acap2, the family member specialised
          for endocytic recycling (GO:0032456 IMP in the same paper). It is the orthologue
          of human ACAP2, not of ACAP3, and it is the only mammalian donor here.
      - source_id: WB:WBGene00000565
        source_label: C. elegans cnt-1
        source_status: SUPPORTS_TRANSFER
        comment: >-
          GO:0031901 early endosome membrane IDA (PMID:22869721) in the worm's single
          centaurin-beta, so it cannot discriminate ACAP1/2/3 sub-functions.
      - source_id: PANTHER:PTN001142372
        source_label: deep centaurin/ArfGAP node
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The superfamily node was used because the ACAP3-restricted node had nothing to
          offer for this compartment, which is precisely why the resulting statement is
          family-level rather than ACAP3-level.
      - source_id: MGI:MGI:2153589
        source_label: mouse Acap3 (1:1 orthologue)
        source_status: SOURCE_STALE_OR_MISSING
        comment: >-
          Absent from this WITH/FROM although present for both neuronal terms. Its own
          recorded location is the growth cone (GO:0030426 IDA, PMID:27330119).
    supported_by:
    - reference_id: PMID:41520057
      supporting_text: >-
        Mechanically, ACAP3 inhibits epidermal growth factor receptor (EGFR) signalling via
        impairing EGFR recycling and accelerating lysosome-mediated EGFR degradation in a
        GTPase-activating protein (GAP) activity-dependent manner.
- term:
    id: GO:0010975
    label: regulation of neuron projection development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Like the neuron migration annotation, this comes from the narrow ACAP3 subfamily node
      PANTHER:PTN002754173 with mouse Acap3 (MGI:MGI:2153589) as its only gene donor, so
      the transfer itself is an orthologue transfer and is sound. The mouse gene carries
      GO:0010975 by IMP from PMID:27330119.

      The term is nonetheless less informative than the evidence supports. PMID:27330119
      determined the direction: knockdown abrogated neurite outgrowth, wild-type ACAP3
      rescued it and a GAP-dead mutant did not, and the authors state the conclusion as
      positive regulation. GO:0010976 "positive regulation of neuron projection
      development" is available and is what the experiment shows. Modify to the directional
      child.

      A caveat worth recording rather than hiding: the direction should not be read as
      "ACAP3 keeps Arf6 off". Outgrowth was rescued by a fast-cycling Arf6 mutant but not
      by GTP-locked or GDP-locked Arf6, so the requirement is for Arf6 cycling. ACAP3 is
      one arm of a GEF/GAP cycle, and the positive regulation of outgrowth is a property of
      the cycle, not of Arf6 inactivation.
    action: MODIFY
    reason: >-
      The parent term understates a directionally determined result. PMID:27330119
      establishes positive regulation by knockdown plus wild-type and GAP-dead rescue, so
      GO:0010976 is the correct term. Note on where the fix has to land: an IBA term is
      constrained to whatever the ancestral node carries, which is constrained in turn by
      the descendant experimental annotations - here mouse Acap3's GO:0010975 IMP. PAINT
      cannot refine this row on its own. The recommendation is therefore addressed to MGI
      first (refine the mouse annotation to GO:0010976 from the same paper), after which
      the human IBA follows automatically. It is recorded as MODIFY rather than ACCEPT
      because the term genuinely should change, not because PAINT can change it unilaterally.
    proposed_replacement_terms:
    - id: GO:0010976
      label: positive regulation of neuron projection development
    additional_reference_ids:
    - PMID:27330119
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: MGI:MGI:2153589
        source_label: mouse Acap3 (1:1 orthologue)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          GO:0010975 IMP from PMID:27330119. The source annotation is also at the
          non-directional parent, so the granularity loss originates upstream rather than
          in the propagation step.
      - source_id: PANTHER:PTN002754173
        source_label: ACAP3 subfamily node
        source_status: SUPPORTS_TRANSFER
        comment: Orthologue-restricted node; the transfer is safe, only the term is coarse.
    supported_by:
    - reference_id: PMID:27330119
      supporting_text: >-
        In primary cultured mouse hippocampal neurons, knockdown of ACAP3 abrogated neurite
        outgrowth, which was rescued by ectopically expressed wild-type ACAP3, but not by
        its GAP activity-deficient mutant.
    - reference_id: PMID:27330119
      supporting_text: >-
        These results demonstrate that ACAP3 positively regulates neurite outgrowth through
        its GAP activity specific to Arf6.
    - reference_id: PMID:27330119
      supporting_text: >-
        Thus cycling between active and inactive forms of Arf6, which is precisely
        regulated by ACAP3 in concert with a guanine-nucleotide-exchange factor(s), seems
        to be required for neurite outgrowth of hippocampal neurons.
- term:
    id: GO:0030036
    label: actin cytoskeleton organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Propagated from the deep node PANTHER:PTN001142372 with three gene donors, and one of
      them should not be there. FB:FBgn0004133 is Drosophila blow (blown fuse), and its
      entire InterPro content is IPR011993 plus IPR001849 - a PH domain and nothing else.
      It has no ACAP1/2/3-like signature (IPR045258), no ArfGAP domain (IPR001164), no BAR
      domain and no ankyrin repeats, so it cannot be an Arf GAP at all. PTHR23180
      (CENTAURIN/ARF) has clustered it in on the PH domain alone. FlyBase describes blow as
      a cytoplasmic myoblast-fusion protein acting through WASp-Vrp1 complex stability, and
      its GO:0030036 is an IMP from that myoblast-fusion work - a mechanism with no ArfGAP
      component. Its contribution to this annotation should be discounted. The reciprocal
      cost of the same mis-clustering is visible on blow itself, which now carries
      GO:0005096 GTPase activator activity by IBA despite having no GAP domain; that is the
      clearer error of the two and is worth reporting to PAINT.

      The term survives regardless, because the other two donors are legitimate. The
      Dictyostelium ACAPs Q54WI0 and Q551Q8 both carry the full BAR-PH-ArfGAP-ANK
      architecture, and Q54WI0 has GO:0030036 by IMP (PMID:23264736) and IGI
      (PMID:20062541) plus GO:0031941 filamentous actin IDA and GO:0051489 regulation of
      filopodium assembly IMP. Arf6, ACAP3's substrate, is itself a cortical actin
      regulator, and the mouse orthologue's phenotypes - neurite outgrowth and the
      morphological change of migrating cortical neurons - are actin-driven.

      Kept as non-core: for ACAP3 actin reorganisation is a downstream consequence of
      Arf6 cycling rather than a distinct job, and the term is generic.
    action: KEEP_AS_NON_CORE
    reason: >-
      Correct in substance but generic, and one of its three gene donors (Drosophila blow) is a
      PH-domain-only protein that is not an ArfGAP and should not be in this family. The
      Dictyostelium ACAP donors carry it legitimately, and Arf6's role in cortical actin
      makes the term defensible - but as a downstream consequence, not a core function.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: FB:FBgn0004133
        source_label: D. melanogaster blow (blown fuse)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          InterPro content is IPR011993 + IPR001849 only - a PH domain, no ACAP1/2/3-like
          signature, no ArfGAP domain, no BAR domain, no ANK repeats. Not an ArfGAP;
          clustered into PTHR23180 on the PH domain alone. Its GO:0030036 IMP comes from
          myoblast fusion via WASp-Vrp1 stability.
      - source_id: dictyBase:DDB_G0279649
        source_label: D. discoideum ACAP-A (Q54WI0)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Full ACAP architecture; GO:0030036 IMP (PMID:23264736) and IGI (PMID:20062541),
          plus filamentous actin IDA and regulation of filopodium assembly IMP. The IMP
          paper is titled for exactly this: ACAP-A is "an ArfGAP involved in cytokinesis,
          cell migration and actin cytoskeleton dynamics".
      - source_id: dictyBase:DDB_G0276395
        source_label: D. discoideum ACAP-B (Q551Q8)
        source_status: SUPPORTS_TRANSFER
        comment: Full ACAP architecture; GO:0030036 IGI (PMID:20062541).
      - source_id: PANTHER:PTN001142372
        source_label: deep centaurin/ArfGAP node
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: >-
          The node has absorbed a PH-domain-only protein, so annotations drawn from it need
          per-donor checking rather than blanket trust.
    supported_by:
    - reference_id: PMID:11062263
      supporting_text: >-
        The GTP-binding protein ADP-ribosylation factor 6 (Arf6) regulates endosomal
        membrane trafficking and the actin cytoskeleton in the cell periphery.
    - reference_id: PMID:28919417
      supporting_text: >-
        Furthermore, morphological changes of neurons during migration in the cortical
        layer were impeded in ACAP3-knocked-down cortical neurons.
