          Arf6. This is the donor that makes the transfer safe.
      - source_id: UniProtKB:Q15057
        source_label: human ACAP2 (paralogue)
        source_status: SUPPORTS_TRANSFER
        comment: GO:0005096 IDA, PMID:11062263; same architecture, same Arf6 preference.
      - source_id: SGD:S000002932
        source_label: S. cerevisiae AGE1
        source_status: SUPPORTS_TRANSFER
        comment: >-
          A real ArfGAP but not an ACAP - it has the ArfGAP domain without BAR, PH or ANK
