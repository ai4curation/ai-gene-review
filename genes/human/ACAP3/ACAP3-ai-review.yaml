  qualifier: enables
  review:
    summary: >-
      Same partner, same conclusion, different method - and this is the row that makes the
      pair believable. OpenCell tags proteins at their endogenous loci with a split
      fluorescent protein and pulls them down at native expression levels, so it is not
      subject to the overexpression artefacts that afflict transfected AP-MS such as
      BioPlex. Recovering ACAP2 with ACAP3 by both routes is independent replication across
      orthogonal methods, not one screen counted twice.

      Treated exactly as the BioPlex row: kept at GO:0005515 rather than replaced with
      GO:0046982, because endogenous split-tag IP-MS is a better method for establishing
      that the two proteins are in one complex but is no better than AP-MS at establishing
      that the complex is a dimer. It is also not a spatial assay, so it supports no
      localisation claim either.
    action: KEEP_AS_NON_CORE
    reason: >-
      Independent, endogenous-level replication of the ACAP2 interaction, which is what
      makes the partner credible rather than an overexpression artefact. Retained at
      GO:0005515 for the same reason as the other row: replication establishes that the
      interaction is real, not that it is a dimer, and GO offers no honest intermediate
      between bare binding and an explicit dimerization term.
    supported_by:
    - reference_id: file:human/ACAP3/ACAP3-uniprot.txt
      supporting_text: "Q96P50; Q15057: ACAP2; NbExp=4"
