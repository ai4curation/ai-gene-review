knowledge_gaps:
- gap_statement: >-
    GO can no longer express which GTPase a GAP acts on, so the defining fact about ACAP3's
    molecular function - that its GAP activity is specific to Arf6 - cannot be recorded as
    a molecular function.
  boundary: >-
    The specificity itself is not in doubt. ACAP3 showed GAP activity specific to Arf6 in a
    cellular assay, GTP-bound Arf6 rises on ACAP3 knockdown, and every ACAP3 phenotype is
    abolished by a GAP-dead mutant. The obstacle is ontological: GO:0008060 "ARF GTPase
    activator activity" has been merged into GO:0005096 "GTPase activator activity" - it
    appears among the secondaryIds of GO:0005096 in QuickGO, together with GO:0005097
