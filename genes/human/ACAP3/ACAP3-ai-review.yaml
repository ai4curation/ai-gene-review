- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: >-
      InterPro2GO mapping from a single signature, IPR004148 - the BAR domain. The
      inference does not follow from the premise. A BAR domain is a membrane-binding and
      membrane-curvature module: it dimerises into a banana-shaped scaffold that binds and
      bends bilayers, and in ACAP1, the paralogue where this module has been solved, the
      BAR-PH tandem assembles into a lattice on tubulated membrane. What a BAR domain
      predicts is peripheral membrane association, not residence in the cytoplasm. Mapping
      it to GO:0005737 discards the informative half of the signal and substitutes a
      near-root compartment.

      The statement is not false - ACAP3 has no transmembrane segment or signal peptide, so
      it is a soluble/peripheral protein and formally cytoplasmic - but it is uninformative.
      It is also partly redundant, though only partly, and the distinction is worth being
      exact about: GO:0005737 is an ancestor of GO:0010008 endosome membrane, so the
      endosomal annotation already entails it, but it is NOT an ancestor of GO:0005886
      plasma membrane (whose path runs through cell periphery), so cytoplasm is not simply
      subsumed by the record as a whole. Marked as over-annotated rather than removed,
      because the compartment itself is not wrong.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      A BAR domain implies peripheral membrane binding and curvature generation, not
      cytoplasmic residence; the mapping loses the informative content and yields a
      near-root term already covered by the two specific compartment annotations. Not
      removed because the assertion is technically true.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - ROLE_CONFLATION
      source_entities:
      - source_id: InterPro:IPR004148
        source_label: BAR domain
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          A real and correctly assigned ACAP3 feature (IPR042695 ACAP3_BAR, CDD cd07637
          BAR_ACAP3), but its biological implication is membrane binding and curvature
          generation. GO:0005737 is not what it predicts.
    supported_by:
    - reference_id: PMID:25284369
      supporting_text: >-
        The BAR (Bin-Amphiphysin-Rvs) domain undergoes dimerization to produce a curved
        protein structure, which superimposes onto membrane through electrostatic
        interactions to sense and impart membrane curvature.
    - reference_id: file:human/ACAP3/ACAP3-uniprot.txt
      supporting_text: "DR   InterPro; IPR042695; ACAP3_BAR."
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:33961781
  qualifier: enables
  review:
    summary: >-
      The WITH/FROM is UniProtKB:Q15057, which is human ACAP2 - ACAP3's own paralogue. The
      source is BioPlex 3.0, a proteome-scale AP-MS interactome. Judged on its own a single
      screen hit would be weak, but three things make this partner credible. First it
      replicates in an orthogonal method: the second GO:0005515 row on this gene is the
      same pair from OpenCell endogenous split-tag IP-MS (PMID:35271311). Second it is
      reciprocal - ACAP2's own GOA record carries GO:0005515 with UniProtKB:Q96P50 from the
      same two papers. Third UniProt curates it as ACAP3's only interaction, with four
      supporting experiments.

      There is also a structural reason to expect it. The ACAP N-terminal BAR-PH tandem is
      a dimerisation module: ACAP1 dimerises in solution and its BAR-PH unit assembles into
      a membrane-deforming lattice (PMID:31291238, PMID:25284369). ACAP2 and ACAP3 both
      carry that module, so a BAR-mediated ACAP2-ACAP3 heterodimer is the parsimonious
      interpretation.

      GO:0046982 protein heterodimerization activity was considered as a replacement and
      rejected. Its definition is "Binding to a nonidentical protein to form a heterodimer",
      and neither AP-MS nor IP-MS measures stoichiometry: both establish co-complex
      membership, which is compatible with a direct heterodimer, with co-residence in a
      larger assembly, and with two BAR proteins sharing a membrane surface. The structural
      precedent is also weaker than it first looks - what PMID:31291238 shows is ACAP1
      dimerising with ITSELF, a homotypic interaction. Extending that to a heterotypic
      ACAP2-ACAP3 dimer is a hypothesis, and co-purification of BAR-domain paralogues is a
      known way to produce this signal without a direct dimer. The heterodimer belongs in
      suggested_experiments, where it is stated as a testable hypothesis, not in a
      replacement term that instructs a curator to assert stoichiometry.

      Retaining GO:0005515 is less lossy here than it would be for a partnerless binding
      row, because the partner identity travels in the WITH/FROM field: this annotation is
      not "binds something" but "binds UniProtKB:Q15057", which is the informative part and
      is already recorded. Kept as non-core because a physical association with no measured
      stoichiometry and no known functional consequence is a lead about ACAP3, not one of
      its roles.

      Neither cached full text names ACAP3 in its body - the pair lives in the
      supplementary interactome tables - so the claim is anchored on the UniProt
      INTERACTION line and the IntAct/GOA records rather than on a quotable sentence.
    action: KEEP_AS_NON_CORE
    reason: >-
      The partner is real and worth keeping: replicated across two orthogonal
      proteome-scale methods, reciprocal in ACAP2's own GOA record, and curated by UniProt
      with NbExp=4, with the partner identity carried in WITH/FROM. But no more specific GO
      term is honestly available - GO:0046982 would assert a dimeric stoichiometry that
      neither method measures, and the only solved ACAP dimer is homotypic ACAP1. Keep the
      annotation, record the partner and the replication argument here, and leave the
      heterodimer as a hypothesis in suggested_experiments.
    additional_reference_ids:
    - PMID:31291238
    supported_by:
    - reference_id: file:human/ACAP3/ACAP3-uniprot.txt
      supporting_text: "Q96P50; Q15057: ACAP2; NbExp=4"
    - reference_id: PMID:31291238
      supporting_text: >-
        Simulation studies then revealed how ACAP1, which dimerizes into a symmetrical
        structure in solution, is recruited asymmetrically to the membrane through dynamic
        behavior.
- term:
    id: GO:0005515
