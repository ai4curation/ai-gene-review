id: Q96P50
gene_symbol: ACAP3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACAP3 (ArfGAP with coiled-coil, ANK repeat and PH domains 3; also centaurin-beta-5)
  is a multidomain GTPase-activating protein for the small GTPase Arf6. Its 834-residue
  chain carries the canonical ACAP module set: an N-terminal BAR domain, a
  pleckstrin-homology domain, an Arf-GAP domain built around a C4-type zinc finger, and
  three C-terminal ankyrin repeats. It works as a peripheral membrane protein at the cell
  surface and on endosomal membranes, accelerating GTP hydrolysis on Arf6 and so returning
  it to the GDP-bound state. In neurons this activity is required for neurite outgrowth
  and for the migration of newly born neurons through the developing cerebral cortex;
  both requirements depend on catalysis, and rescue with nucleotide-locked Arf6 shows that
  what the neuron needs is continuous cycling of Arf6 between its active and inactive
  states rather than simple suppression of Arf6, so ACAP3 is best understood as one arm of
  a GEF/GAP cycle rather than as an Arf6 switch-off device. In epithelial cells the same
  activity is directed at receptor traffic: ACAP3 restrains epidermal growth factor
  receptor recycling and accelerates lysosomal EGFR degradation, damping EGFR signalling
  and proliferation. Expression is enhanced in brain. The gene is transcriptionally
  silenced by Myc-driven DNA hypermethylation in lung adenocarcinoma and by HDAC2 in
  papillary thyroid carcinoma, and in both settings reduced ACAP3 accompanies greater
  tumour-cell growth, migration and invasion. ACAP3 physically associates with its
  paralogue ACAP2, consistent with the dimeric character of the BAR-PH module shared
  across the ACAP family.
