    GO:0030675 and GO:0046582. GO:0005096 is now the terminal GAP term for every substrate.
  gap_kind:
  - ONTOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    ACAP3, ACAP1 and ACAP2 are Arf6-preferring GAPs, whereas ASAP1 in the same ArfGAP
    superfamily is measurably less Arf6-selective in the same side-by-side assay. After the
    merge all of them carry the identical molecular function term, so the ontology cannot
    distinguish paralogues that differ in substrate preference. Substrate identity is the main axis of variation in
    this family, and it is exactly what is now invisible.
  resolution: >-
    Annotate GO:0005096 with a has_input extension naming ARF6 (UniProtKB:P62330), which is
    the mechanism GO retained; alternatively GO could reinstate a substrate-partitioned
    grouping under GO:0005096. The GO:0032012 regulation of ARF protein signal transduction
    biological-process annotation proposed here is a partial workaround, since it at least
    records the Arf family.
  provenance:
  - reference_id: PMID:27330119
    supporting_text: >-
      Ectopically expressed ACAP3 in HEK (human embryonic kidney)-293T cells showed the GAP
      activity specific to Arf6.
- gap_statement: >-
    Not one of ACAP3's ten GOA annotations derives from an experiment; every annotation is
    either a phylogenetic or an electronic inference, although four functional papers exist.
  boundary: >-
    The protein is not undetected - the UniProt entry is "PE 1: Evidence at protein level"
    and ACAP3 has been identified by mass spectrometry. And the functional literature is not
    empty: PMID:27330119 and PMID:28919417 characterise the mouse orthologue, PMID:41520057
    and PMID:39098591 the human protein in tumour cells. The mouse orthologue has been
    curated from these papers (GO:0005096 IMP, GO:0001764 IMP, GO:0010975 IMP, GO:0030426
    IDA). The human gene has not: its record consists of six IBAs, two InterPro IEAs and two
    high-throughput IPIs, and the UniProt entry cites none of the four functional papers.
  gap_kind:
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    ACAP3 looks moderately well annotated - it has a molecular function, two compartments
    and three biological processes - but the whole record is inference. A curation pass over
    the four papers, plus ISS transfer from the curated mouse orthologue, would convert the
    gene from inferred to evidenced without any new experiment.
  resolution: >-
    Curate PMID:41520057 and PMID:39098591 for the human gene, and transfer the mouse
    orthologue's IMP/IDA annotations by ISS. The four NEW annotations proposed in this review
    are that curation pass.
  provenance:
  - reference_id: file:human/ACAP3/ACAP3-uniprot.txt
    supporting_text: "PE   1: Evidence at protein level;"
- gap_statement: >-
    ACAP3's only known physical partner is its own paralogue ACAP2, and neither the
    architecture of that association nor its purpose is known.
  boundary: >-
    The interaction itself is well supported: two orthogonal proteome-scale methods
    (BioPlex AP-MS, PMID:33961781; OpenCell endogenous split-tag IP-MS, PMID:35271311),
    reciprocal annotation on both genes, UniProt NbExp=4. Dimerisation of the ACAP BAR-PH
    module is established for ACAP1 by structural and simulation work, but homotypically -
    ACAP1 with ACAP1. What is untested for ACAP2-ACAP3 is the stoichiometry, whether the BAR
    domains mediate it at all, where in the cell it happens, and whether it changes anything
    about Arf6 specificity, membrane curvature generation or localisation. Because none of
    that is settled, the interaction is recorded here as a gap rather than promoted to a
    core function or to a dimerization term.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    If ACAPs form obligate dimers and can mix, then ACAP2 and ACAP3 phenotypes are not
    independent, and the division of labour between the three human ACAPs may be set by
    which partners are co-expressed rather than by intrinsic differences between them. The
    question is also what stands between the current uninformative GO:0005515 annotation and
    a term that says something: no GO term can currently express "physically associates with
    a specific paralogue" without also asserting a stoichiometry nobody has measured.
  resolution: >-
    Measure the stoichiometry of the purified complex (SEC-MALS, mass photometry), map the
    interface by crosslinking mass spectrometry, and test whether BAR-domain interface
    mutants that abolish heterodimerisation change Arf6 GAP activity or ACAP3 localisation.
    A positive dimer result would justify GO:0046982; a larger-assembly result would point
    to GO:0032403 protein-containing complex binding instead.
  provenance:
  - reference_id: PMID:25284369
    supporting_text: >-
      The BAR (Bin-Amphiphysin-Rvs) domain undergoes dimerization to produce a curved
      protein structure, which superimposes onto membrane through electrostatic
      interactions to sense and impart membrane curvature.
  - reference_id: file:human/ACAP3/ACAP3-uniprot.txt
    supporting_text: "Q96P50; Q15057: ACAP2; NbExp=4"
- gap_statement: >-
    ACAP3 has no lipid-binding annotation and no lipid-binding data, despite carrying both a
    PH domain and a BAR domain, and despite the family's GAP activity being
    phosphoinositide-dependent.
  boundary: >-
    The modules are unambiguous: FT DOMAIN 268-363 PH, plus a BAR domain recognised as
    IPR042695 ACAP3_BAR and CDD cd07637 BAR_ACAP3. In the paralogues, phosphoinositide
    dependence is demonstrated - all ACAPs have phosphoinositide-dependent GAP activity
    (PMID:11062263) and the ACAP1 BAR-PH tandem binds and tubulates PI(4,5)P2-containing
    liposomes. Worm cnt-1 has direct binding data for PI(4,5)P2, PI(3,4,5)P3 and PI4P. For
    ACAP3 itself there is no binding assay of any kind, so which phosphoinositide recruits
    it, and whether its GAP activity is lipid-stimulated, are unknown.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Phosphoinositide dependence is how ACAP-family GAPs are targeted to the right membrane
    at the right time, so it is a load-bearing part of the mechanism rather than an
    accessory property. Its absence also means the BAR and PH domains - two of ACAP3's four
    modules - contribute nothing to the annotation record, and the one place a BAR domain
    does appear (the IPR004148 to GO:0005737 mapping) uses it to infer the wrong thing.
  resolution: >-
    Liposome binding and tubulation assays with recombinant ACAP3 BAR-PH across the
    phosphoinositide series, plus a GAP assay on Arf6 with and without PI(4,5)P2, would
    support a specific phosphoinositide-binding annotation (GO:0005546 or a sibling) and
    test lipid stimulation. A tubulation result would also be annotatable: GO:0180020
    membrane bending activity is current and is defined for exactly this, yet it has only
    four human annotations (CHMP2A, CHMP3, OPA1) and not one BAR-domain protein among them -
    even ACAP1, for which liposome tubulation by the BAR-PH module has been shown directly
    (PMID:25284369). The term is waiting for this whole protein family.
  provenance:
  - reference_id: PMID:11062263
    supporting_text: "All contain phosphoinositide-dependent GAP activity."
  - reference_id: file:human/ACAP3/ACAP3-uniprot.txt
    supporting_text: "DR   CDD; cd07637; BAR_ACAP3; 1."
suggested_questions:
- question: >-
    Should PANTHER family PTHR23180 (CENTAURIN/ARF) continue to contain Drosophila blow
    (FBgn0004133)? Its InterPro content is a PH domain and nothing else - no ACAP1/2/3-like
    signature, no ArfGAP domain, no BAR domain, no ankyrin repeats - so it cannot be an Arf
    GAP, yet it is a WITH/FROM donor for ACAP3's actin annotation and has itself acquired
    GO:0005096 GTPase activator activity by IBA. Both directions of that transfer look
    unsafe.
- question: >-
    Now that GO:0008060 has been merged into GO:0005096, how should the Arf6 specificity of
    ACAP1, ACAP2 and ACAP3 be recorded? A has_input extension naming ARF6 is available but
    is not used on any of the three, so the ontology currently cannot distinguish an
    Arf6-preferring GAP from an Arf1-preferring one anywhere in this family.
- question: >-
    Should the mouse orthologue's curated annotations be transferred to human ACAP3 by ISS?
    Mouse Acap3 has GO:0005096 IMP, GO:0001764 IMP, GO:0010975 IMP and GO:0030426 IDA from
    PMID:27330119 and PMID:28919417, while the human gene carries only IBA/IEA/IPI. The IBAs
    are already drawn from that same mouse gene, so the evidence exists but arrives in its
    weakest available form.
- question: >-
    Will MGI refine two mouse Acap3 annotations at source? Both fixes this review proposes
    for the human gene are blocked upstream: GO:0010975 should be GO:0010976 (PMID:27330119
    determines the direction), and GO:0032012 regulation of ARF protein signal transduction
    should be asserted by IMP from the same paper. An IBA cannot be refined past its
    ancestral node, so until the mouse annotations change, the human MODIFY and the human
    ISS are both requests PAINT alone cannot honour.
- question: >-
    Was the withdrawal of GO_REF:0000043 meant to drop zinc ion binding for the whole ArfGAP
    family? The C4-type zinc finger is a defining feature of the ArfGAP domain and the
    UniProt entries still carry the keyword-derived GO statement, but InterPro2GO maps
    IPR001164 only to GO:0005096, so nothing replaced the withdrawn route. If the loss was
    incidental rather than intended, an InterPro2GO mapping from IPR001164 to GO:0008270
    would restore it across the family in one step instead of gene by gene.
- question: >-
    What determines the division of labour between the three human ACAPs? All three are
    Arf6-preferring GAPs with identical domain architecture; ACAP1 and ACAP2 are broadly
    expressed while ACAP3 is brain-enhanced, and ACAP2 and ACAP3 physically associate. Is
    the specialisation set by expression, by localisation, or by which partners each one
    dimerises with?
- question: >-
    Is ACAP3's tumour-suppressive behaviour entirely explained by EGFR downregulation? Two
    independent tumour types report growth suppression on ACAP3 restoration with different
    proximal read-outs - EGFR trafficking in lung adenocarcinoma, AKT and p53 in papillary
    thyroid carcinoma - and it is unclear whether these are one mechanism seen twice or two.
suggested_experiments:
- hypothesis: >-
    ACAP3 acts on Arf6 at the growth cone plasma membrane in human neurons, not at
    endosomes, and the endosomal annotation is a transfer from the paralogue ACAP2.
  description: >-
    Knock in a fluorescent tag at the endogenous human ACAP3 locus in iPSC-derived neurons
    and in a lung adenocarcinoma line, and image against Arf6, EEA1, RAB11, LAMP1 and
    surface EGFR. Compare the two cell types directly: if the compartment differs between
    them, the current single set of compartment annotations is wrong for at least one
    context.
  experiment_type: live-cell imaging with endogenous tagging
- hypothesis: >-
    ACAP3's requirement in neurite outgrowth reflects a GEF/GAP cycle, and the partner GEF
    can be identified by epistasis.
  description: >-
    In ACAP3-depleted hippocampal neurons, screen the known Arf6 GEFs (the cytohesin/ARNO
    family, EFA6 family, BRAG family) by co-depletion and by rescue with the fast-cycling
    Arf6 mutant, scoring neurite length and GTP-Arf6. A GEF whose loss phenocopies ACAP3
    loss and whose double depletion is not additive is the cycle partner.
  experiment_type: genetic epistasis in primary neurons
- hypothesis: >-
    ACAP2 and ACAP3 form a BAR-mediated heterodimer whose properties differ from either
    homodimer.
  description: >-
    Purify the ACAP2 and ACAP3 BAR-PH modules separately and together, measure stoichiometry
    by SEC-MALS and mass photometry, map the interface by crosslinking mass spectrometry,
    then compare liposome tubulation and Arf6 GAP kinetics of the heterodimer against both
    homodimers. Test interface mutants in cells for effects on ACAP3 localisation and on the
    EGFR phenotype.
  experiment_type: structural biochemistry and reconstitution
- hypothesis: >-
    ACAP3's GAP activity is stimulated by a specific phosphoinositide bound through its
    BAR-PH module, as it is in the paralogues.
  description: >-
    Assay recombinant full-length ACAP3 and its BAR-PH module for binding to liposomes
    across the phosphoinositide series, and measure Arf6 GAP kinetics with and without each
    lipid. Score tubulation by negative-stain EM in the same experiment, which would supply
    the first BAR-protein annotation to GO:0180020 membrane bending activity. Then test
    whether PH-domain mutants that lose the preferred lipid also lose growth-cone
    localisation and the neurite outgrowth rescue.
  experiment_type: in vitro lipid binding and enzymology
- hypothesis: >-
    Drosophila blow is mis-assigned to PTHR23180 and its inclusion is injecting an
    ArfGAP-independent actin mechanism into the family node.
  description: >-
    Rebuild the PTHR23180 alignment with and without blow and score whether blow places
    inside the ACAP clade on the ArfGAP and BAR regions or only on the PH domain, then check
    how many other PTHR23180 members lack IPR001164. Report the result, and blow's own
    GO:0005096 IBA, to the PANTHER and PAINT curators.
  experiment_type: comparative sequence and family analysis
