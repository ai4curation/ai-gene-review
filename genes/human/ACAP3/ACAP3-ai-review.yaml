    - reference_id: PMID:8533093
      supporting_text: >-
        The GAP function required an intact zinc finger and additional amino-terminal
        residues.
core_functions:
- description: >-
    Arf6-directed GTPase-activating protein sustaining the Arf6 cycle during neuronal
    morphogenesis. ACAP3 binds Arf6 and accelerates its intrinsic GTP hydrolysis, and its
    Arf-GAP domain (403-525, C4-type zinc finger at 418-441) is essential for every
    phenotype attributed to it. In hippocampal neurons ACAP3 is required for neurite
    outgrowth, and in the developing cerebral cortex for the migration of newly born
    neurons and for the morphological changes that accompany migration; both are rescued
    by wild-type but not GAP-dead protein, and both fail when ACAP3 is depleted and
    GTP-Arf6 accumulates. Critically, outgrowth is restored by a fast-cycling Arf6 mutant
    but not by GTP-locked or GDP-locked Arf6, so the function is to keep Arf6 turning over
    together with an as-yet-unidentified GEF, not to switch Arf6 off. The activity is
    exercised at the cell periphery, and in the mouse orthologue is localised to the growth
    cone. Actin reorganisation and the resulting change in cell shape are the downstream
    output, consistent with Arf6's role as a cortical actin regulator.
  molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  directly_involved_in:
  - id: GO:0032012
    label: regulation of ARF protein signal transduction
  - id: GO:0010976
    label: positive regulation of neuron projection development
  - id: GO:0001764
    label: neuron migration
  locations:
  - id: GO:0030426
    label: growth cone
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:27330119
    supporting_text: >-
      These results demonstrate that ACAP3 positively regulates neurite outgrowth through
      its GAP activity specific to Arf6.
  - reference_id: PMID:27330119
    supporting_text: >-
      Thus cycling between active and inactive forms of Arf6, which is precisely regulated
      by ACAP3 in concert with a guanine-nucleotide-exchange factor(s), seems to be
      required for neurite outgrowth of hippocampal neurons.
  - reference_id: PMID:28919417
    supporting_text: >-
      These results provide evidence that ACAP3 plays a crucial role in migration of
      cortical neurons by regulating their morphological change during development of
      cerebral cortex.
  knowledge_gaps:
  - gap_statement: >-
      The guanine-nucleotide-exchange factor that ACAP3 pairs with to maintain the Arf6
      cycle in neurons is not identified.
    boundary: >-
      That a GEF is required is not speculative: neurite outgrowth in ACAP3-depleted
      neurons is rescued by a fast-cycling Arf6 mutant but not by wild-type, GTP-locked or
      GDP-locked Arf6, so the cell needs continuous nucleotide turnover on Arf6 and
      therefore both a GAP and a GEF. The GAP arm is ACAP3; the GEF arm is unassigned.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Without the GEF, ACAP3's function cannot be placed in a causal model: the phenotype
      belongs to a cycle, and annotating only the GAP arm makes ACAP3 look like an Arf6
      inhibitor, which the nucleotide-locked rescue experiments specifically exclude.
    resolution: >-
      Identify the Arf6 GEF acting with ACAP3 in hippocampal neurons and migrating cortical
      neurons - candidate-based epistasis over the known Arf6 GEFs, or proximity labelling
      from ACAP3 at the growth cone - then model the pair as a GEF/GAP cycle.
    provenance:
    - reference_id: PMID:27330119
      supporting_text: >-
        Thus cycling between active and inactive forms of Arf6, which is precisely
        regulated by ACAP3 in concert with a guanine-nucleotide-exchange factor(s), seems
        to be required for neurite outgrowth of hippocampal neurons.
- description: >-
    The same Arf6 GAP activity applied to endosomal receptor sorting in non-neuronal cells.
    In lung adenocarcinoma cells ACAP3 restrains recycling of the epidermal growth factor
    receptor back to the surface and speeds its lysosomal degradation, lowering EGFR
    signalling and proliferation; the effect requires GAP activity, so it is the same
    catalytic function redeployed rather than a separate activity. This places ACAP3 in the
    Arf6-dependent recycling-endosome pathway where its paralogues ACAP1 and ACAP2 also
    act. Because ACAP3 is transcriptionally silenced in lung adenocarcinoma by Myc-driven
    DNA hypermethylation and in papillary thyroid carcinoma by HDAC2, loss of this arm is
    the route by which the gene behaves as a tumour suppressor.
  molecular_function:
    id: GO:0005096
    label: GTPase activator activity
  directly_involved_in:
  - id: GO:0001920
    label: negative regulation of receptor recycling
  - id: GO:0042059
    label: negative regulation of epidermal growth factor receptor signaling pathway
  locations:
