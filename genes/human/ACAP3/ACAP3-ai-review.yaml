- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      The core molecular function, and correct. All five gene donors in the WITH/FROM (the
      sixth entry is the PANTHER node itself) resolve to genuine ArfGAPs: Arabidopsis AGD3,
      mouse Acap3 (the 1:1 orthologue), yeast AGE1
      (Q04412, an ArfGAP of the ASAP rather than ACAP type), human ACAP2 (GO:0005096 IDA,
      PMID:11062263) and Dictyostelium Q54WI0 (GO:0005096 IDA, PMID:20062541). ACAP3
      itself has an Arf-GAP domain at 403-525 with a C4-type zinc finger at 418-441.

      Direct orthologue evidence exists and is stronger than this IBA: mouse Acap3 carries
      GO:0005096 by IMP from PMID:27330119, which showed Arf6-specific GAP activity and a
      rise in GTP-bound Arf6 on knockdown. GOA has not transferred that, so the human gene
      still rests on phylogenetic inference for its central activity - an ISS or IBD from
      PMID:27330119 would be a straightforward upgrade.

      One thing this term cannot express is the specificity, which is the most interesting
      fact about the activity. GO:0008060 "ARF GTPase activator activity" has been MERGED
      into GO:0005096 - QuickGO lists it among the secondaryIds of GO:0005096, along with
      every other substrate-specific GAP term (GO:0005097 Rab, GO:0005098 Ras, GO:0005100
      Rho, GO:0005099, GO:0005101, GO:0017123, GO:0030675, GO:0046582). GO:0005096 is now
      the terminal GAP term, so Arf6 specificity has to live in a has_input extension
      (ARF6, UniProtKB:P62330) or be lost. No MODIFY is possible: there is no more
      specific term to move to.
    action: ACCEPT
    reason: >-
      Correct core molecular function, sound propagation from true ArfGAPs including the
      1:1 mouse orthologue. Retained as-is because GO has merged away every
      substrate-specific GAP term, leaving no more precise option.
    additional_reference_ids:
