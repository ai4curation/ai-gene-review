- term:
    id: GO:0032012
    label: regulation of ARF protein signal transduction
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q6NXL5
  review:
    summary: >-
      Proposed new annotation, and the only route by which GO can currently record the
      single most specific fact about ACAP3's activity. Its GAP activity is specific to
      Arf6, but GO:0008060 "ARF GTPase activator activity" has been merged into the generic
      GO:0005096 (it appears among the secondaryIds of GO:0005096 in QuickGO), so the
      molecular function aspect cannot express substrate identity at all. The biological
      process aspect still can: GO:0032012 regulation of ARF protein signal transduction is
      current and is precisely what an Arf GAP does.

      The evidence is the mouse orthologue's IMP for GO:0005096 from PMID:27330119, where
      ACAP3 showed GAP activity specific to Arf6 in a cellular assay and GTP-bound Arf6
      rose on knockdown. On the evidence code: the mouse orthologue does not itself carry
      GO:0032012, so this is not a like-for-like ISS of an existing term. IC from the human
      GO:0005096 annotation was considered and rejected, because GO:0005096 no longer names
      a substrate - it cannot support an inference about ARF specifically, which is the whole
      point here. What is being transferred by orthology is the mouse experimental finding
      that the GAP activity acts on Arf6, expressed with the only current term that can name
      the substrate family; ISS with the orthologue as supporting entity is the honest
      coding for that. The cleaner curation route, if MGI will take it, is two-step: assert
      GO:0032012 on the mouse record by IMP from PMID:27330119, then ISS it across, which
