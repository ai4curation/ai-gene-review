- term:
    id: GO:0008270
    label: zinc ion binding
  evidence_type: ISM
  original_reference_id: file:human/ACAP3/ACAP3-uniprot.txt
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation, and unlike the other three proposals here it rests on ACAP3's
      own sequence rather than on orthology. The FT table places a C4-type zinc finger at
      418-441, inside the Arf-GAP domain (403-525), called from the PROSITE ARFGAP profile
      (PS50115 / ProRule PRU00288). The UniProt entry still carries the resulting GO
      statement - "DR   GO; GO:0008270; F:zinc ion binding; IEA:UniProtKB-KW." - but GOA does
      not, because the keyword-derived route (GO_REF:0000043) was withdrawn for cellular
      organisms, and InterPro2GO does not fill the gap: IPR001164's only mapping is
      GO:0005096. So no automatic route now supplies it, which is why it is absent rather
      than because anyone judged it wrong.

      Two limits stated plainly. First, the basis is a sequence-model call, not a
      metal-binding measurement on ACAP3 - hence ISM, with the UniProt record as the
      reference, rather than an experimental code. Second, at the family level the motif is
      known to be functionally required rather than merely present: the founding ArfGAP
      paper reported that the ARF1 GAP "predicts a protein with a zinc finger motif near the
      amino terminus" and that "The GAP function required an intact zinc finger", which is
      mutational evidence that the motif matters, though still not a demonstration that zinc
      is bound.

      Not a core function. Zinc coordination here is a structural requirement of the ArfGAP
      fold, not a distinct biological activity of ACAP3, so it is recorded as a molecular
      feature and deliberately left out of core_functions.
    action: NEW
    reason: >-
      Better founded than either of the orthology-based proposals, because it rests on a
      feature of ACAP3's own sequence, and it is missing from GOA for a purely mechanical
      reason - the withdrawal of the keyword route with no InterPro2GO replacement - rather
      than on any judgement about the protein.
    supported_by:
    - reference_id: file:human/ACAP3/ACAP3-uniprot.txt
