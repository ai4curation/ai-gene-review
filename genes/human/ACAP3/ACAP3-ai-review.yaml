  review:
    summary: >-
      Phylogenetic propagation from the deep centaurin/ArfGAP node PANTHER:PTN001142372.
      All seven WITH/FROM entries were resolved: Arabidopsis AGD3 (Q5W7F2) and AGD1
      (Q9FIT8), fission yeast cnt5 (Q9UUE2), human ACAP2 (Q15057), C. elegans cnt-1
      (Q9XXH8) and the Dictyostelium ACAP Q54WI0. This is the best-supported of the four
      superfamily-level IBAs, because peripheral-membrane localisation is independently
      demonstrated by IDA in four separate lineages: cnt5 (GO:0005886 IDA,
      PMID:19076239), human ACAP2 (GO:0005886 IDA, PMID:30905672), Dictyostelium Q54WI0
