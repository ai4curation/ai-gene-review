      operates at the cell periphery, and the mouse orthologue is localised by IDA to the
      growth cone (GO:0030426 IDA, PMID:27330119), a plasma-membrane-rich structure.
      is_active_in is the appropriate qualifier for a peripheral membrane GAP.
