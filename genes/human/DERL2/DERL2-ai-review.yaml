gene_symbol: DERL2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'DERL2 is a multi-pass endoplasmic-reticulum membrane Derlin-family ERAD factor specialized
  for misfolded glycoprotein disposal. It forms homo- and hetero-oligomers with DERL3, connects EDEM-family
  substrate recognition to VCP/p97 and SEL1L/SYVN1-containing ubiquitin-ligase complexes, supports retrotranslocation
  of glycoprotein ERAD substrates, and binds SRP/SRPR during ER stress-induced pre-emptive quality control.'
