      display_name: Formation of definitive endoderm
      species: Homo sapiens
      summary: 'The endoderm in mammalian embryos originates from two different populations of cells:
        the visceral endoderm, which is present before gastrulation as the hypoblast underlying the epiblast,
        and the definitive endoderm, which is derived from epiblast cells ingressing through the anterior-most
        region of the primitive streak. After ingression, the cells of the definitive endoderm then intercalate
        with the cells of the visceral endoderm to form the embryonic endoderm that will give rise to
        the gut and visceral organs associated with the gut such as the pancreas and liver (reviewed in
        Lewis and Tam 2006, Nowotschin et al. 2019). In the discoid human gastrula (differs from the rodent
        gastrula which acquires a cup shape), the endoderm initially is organized in a flat epithelial
        sheet that later rolls into a tube to form the gut. Due to ethical considerations, research on
        gastrulation is undertaken primarily in non-human primate species (for example Bergmann et al.
        2022) and stem cells (D''Amour et al. 2005, reviewed in Salehin et al. 2022), which have provided
        insight into germ layer formation in human embryos.<br>The definitive endoderm originates in the
        anterior region of the primitive streak where there are high levels of NODAL signaling (inferred
        from mouse embryos in Vincent et al. 2003) and lower levels of BMP signaling (inferred from mouse
        embryos in Bachiller et al. 2000) and Wnt signaling (inferred from mouse embryos in Mukhopadhyay
        et al. 2001). In mouse, Eomesodermin (EOMES), whose expression is activated by NODAL signaling
        via SMAD2 and SMAD3 in the primitive streak, is required for formation of both mesoderm and endoderm
        (Arnold et al. 2008). Experiments in human embryonic stem cells and mouse embryos indicate that
        EOMES is a core element of a gene regulatory network that specifies definitive endoderm by activating
        expression of transcription factors such as FOXA2 and SOX17 which then activate sets of endodermally
        expressed genes (Teo et al. 2011, Chia et al. 2019). As endoderm progenitors enter the primitive
        streak they redistribute E-cadherin (CDH1) on their surface, which may play a role in sorting
        the cells into an epithelial layer (inferred from mouse homologs in Viotti et al. 2014). Unlike
        mesoderm, endoderm progenitors do not undergo a complete epithelial to mesenchymal transition
        (EMT) (inferred from mouse embryos and stem cells in Scheibner et al. 2021). They do not switch
        cadherin expression from E-cadherin (CDH1) to N-cadherin (CDH2) and do not require the EMT transcription
        factor SNAI1 (inferred from mouse homologs in Scheibner et al. 2021). The endodermal transcription
        factor FOXA2 may repress EMT activity (inferred from the mouse homolog in Scheibner et al. 2021).<br>Though
        no single marker gene is expressed exclusively in definitive endoderm, the definitive endoderm
        is characterized by the expression of a combination of genes, including FOXA2, SOX17, GATA4, GATA6,
        CXCR4, GSC, and E-cadherin (CDH1). CDH1, a general marker of epithelial cells, and the chemokine
        receptor CXCR4 are often used together as surface markers of definitive endoderm (inferred from
        mouse homologs in Yasunaga et al. 2005).'
  actual_native_disposition: missing_only_F
