      display_name: Developmental Lineage of Multipotent Pancreatic Progenitor Cells
      species: Homo sapiens
      summary: Definitive endoderm forms during gastrulation and then undergoes patterning along anterior/posterior,
        dorsal/ventral, and median/lateral axes. Definitive endoderm cells produce, among other embryonal
        cell types, endoderm cells of dorsal and ventral foregut. The dorsal foregut endoderm cells, which
        transition through an intermediary duodeno-pancreatic endoderm cell state, and the ventral foregut
        endoderm cells, which possibly transition through a hepato-pancreatic or pancreato-biliary intermediary
        state, give rise to primary multipotent pancreatic progenitor cells (MPCs) that form dorsal and
        ventral pancreatic buds, respectively (Yu et al. 2019, reviewed in Jennings et al. 2015).
