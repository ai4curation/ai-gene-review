id: Q92908
gene_symbol: GATA6
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GATA6 is a GATA-family zinc-finger transcription factor that binds GATA regulatory elements
  and activates or represses RNA polymerase II target genes. It acts in nuclear regulatory complexes with
  context-dependent cofactors, including MED1, and helps establish and maintain epithelial, endodermal
  and cardiovascular cell programs. Its downstream effects include lineage differentiation, cardiac patterning
  and specialized responses controlling proliferation and survival. Haploinsufficiency can cause pancreatic
  agenesis in humans. Alternative translation initiation produces 595- and 449-residue proteins that retain
  the zinc-finger region; their transcriptional output can differ with promoter and cellular context.
alternative_products:
- id: Q92908-1
  name: '1'
  sequence_note: Displayed 595-residue product; upstream translation initiation. Direct FASTA and official
    sequence are identical.
  description: The long product has 146 additional N-terminal residues. It activates more strongly in
    the tested HepG2 context, but the COS-cell result precludes a universal ranking. M147L is engineered.
    Endogenous adrenal MED1 association includes both natural forms.
- id: Q92908-2
  name: '2'
  sequence_note: 449 residues, exactly the displayed sequence without residues 1–146 (VSP_035778); alternative
    initiation, not an inferred splice deletion.
  description: The short product retains regulatory activity and zinc fingers. Alternative 5-prime untranslated
    transcripts can each produce both forms. Historical constructs require sequence verification before
    accession-specific assignment; the short product is not an inactive truncation.
status: COMPLETE
