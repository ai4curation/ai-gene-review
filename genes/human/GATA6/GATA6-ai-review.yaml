suggested_questions:
- question: How do endogenous 595- and 449-residue GATA6 products differ in occupancy, cofactor recruitment
    and regulatory output across human cell types?
- question: Which direct human GATA6 perturbation and lineage measurements resolve the intestinal epithelial
    differentiation assertion associated with PMID:9566909?
- question: Which endogenous targets account for GATA6-dependent survival and proliferation responses,
    and how do their effects depend on growth-factor conditions?
- question: Can the precise mouse-donor SAN reporter construct and ChIP cell context be recovered to separate
    developmental transcriptional work from downstream electrical phenotypes?
suggested_experiments:
- description: Compare sequence-verified long and short GATA6 products at matched expression in human
    lineage models using occupancy profiling and target RNA measurements, alongside endogenous initiation-site
    perturbations.
- description: Perturb endogenous GATA6 in human intestinal differentiation models with rescue by sequence-verified
    products and measure lineage markers, regulatory occupancy and differentiation outcomes.
