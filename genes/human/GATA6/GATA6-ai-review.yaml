core_functions:
- description: GATA6 recognizes regulatory GATA sites and works with context-dependent cofactors to activate
    or repress PolII transcription, contributing to conserved cell-fate programming. Its nuclear regulatory
    role includes the nucleoplasmic promoter-binding context explicitly represented in the curated SFTPA
    event.
