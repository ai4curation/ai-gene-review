core_functions:
- description: Substrate-targeting subunit of the eIF2alpha holophosphatase. A conserved middle
    module (R15B340-639, helices H1-H3) clamps the trimeric eIF2 complex through eIF2gamma and
    the eIF2alpha C-terminal domain, far from Ser51, while the C-terminal RVxF region
    (R15B639-713) docks the PP1 catalytic subunit; joining the two presents the phosphosite to
    PP1, and either module alone is inactive.
