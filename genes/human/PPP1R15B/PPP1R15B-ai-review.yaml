  - statement: This paper describes G-actin as an essential cofactor recruited by the C-terminal
      core of PPP1R15B.
    supporting_text: It is located in the conserved COOH-terminal functional core of PPP1R15B
      that specifies interaction with PP1, the recruitment of the essential cofactor G-actin, and
