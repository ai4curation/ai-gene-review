proposed_new_terms:
- proposed_name: negative regulation of integrated stress response signaling
  proposed_definition: Any process that stops, prevents or reduces the frequency, rate or extent
    of integrated stress response signaling.
  justification: 'GO:0140467 integrated stress response signaling has four branch children,
    GO:0036499 PERK-mediated unfolded protein response, GO:0140469 GCN2-mediated signaling,
    GO:0140468 HRI-mediated signaling and GO:0039585 PKR/eIFalpha signaling, but regulation
    terms exist only for the PERK branch (GO:1903897, GO:1903898, GO:1903899). The two eIF2alpha
    holophosphatase subunits, PPP1R15B and PPP1R15A, act on phospho-eIF2alpha, the single
    product that all four kinase branches converge on, so neither can be annotated at the right
    scope: both currently carry GO:1903898 by TAS, which names one branch out of four. A
    regulation child of GO:0140467, ideally the full regulates/positively/negatively triple so
    that the eIF2alpha kinases and their activators such as DELE1 can also be placed, would let
    the phosphatase arm of the ISR be annotated at the level at which it actually works.'
  proposed_parent:
    id: GO:0140467
    label: integrated stress response signaling
  supported_by:
  - reference_id: PMID:34847777
    supporting_text: In mammals, the phosphorylation levels of eIF2α are tuned to cellular needs
      through the antagonistic actions of four different eIF2α kinases, PKR, HRI, PERK and GCN2
      and two eIF2α phosphatases
    reference_section_type: INTRODUCTION
  - reference_id: file:human/PPP1R15B/PPP1R15B-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Maintains low levels of EIF2S1 phosphorylation in unstressed cells by
      promoting its dephosphorylation by PP1.
suggested_questions:
- question: Is PP1 recruitment to PPP1R15B driven by substrate engagement, as the low PP1
    occupancy of full-length PPP1R15B suggests, and if so does phospho-eIF2alpha itself trigger
    holoenzyme assembly?
- question: Does the division of labour between PPP1R15B and PPP1R15A reflect expression timing
    alone, or do the two paralogues also differ in which eIF2 species they prefer, for example
    free eIF2 versus eIF2 engaged with eIF2B or with the 43S preinitiation complex?
- question: PPP1R15B R658C and N423D patients share a syndrome dominated by microcephaly and
    short stature. Which cell types are rate-limiting, and is the phenotype driven by
    translational attenuation in neural progenitors or by secretory-cell failure as in the
    beta-cell?
- question: Does the reported PPP1R15B-NCK1/2 association have a function, and is it the route by
    which the holophosphatase is positioned relative to translating ribosomes?
suggested_experiments:
- hypothesis: PP1 binding to PPP1R15B is licensed by substrate engagement rather than
    constitutive.
  description: Measure PP1 occupancy of full-length PPP1R15B by quantitative
    immunoprecipitation-mass spectrometry in cells where eIF2alpha phosphorylation is clamped
    high by eIF2alpha kinase activation versus clamped low in an EIF2S1 S51A knock-in, and in the
    substrate-binding-dead N423D and H1A backgrounds. A substrate-licensed model predicts that
    PP1 occupancy tracks phospho-eIF2alpha availability and collapses in N423D.
  experiment_type: quantitative interaction proteomics
- hypothesis: PPP1R15B dephosphorylates substrates other than eIF2alpha.
  description: Use the substrate-trapping fragment R15B340-639, which binds phospho-substrate but
    cannot recruit PP1, as an affinity reagent in phosphoproteomic pulldowns from stressed and
    unstressed cells, with the same fragment carrying the H1A clamp mutation as the specificity
    control. Any trapped phosphoprotein other than eIF2 subunits is a candidate substrate.
  experiment_type: substrate trapping / phosphoproteomics
- hypothesis: The ER association of PPP1R15B inferred from the family node is real for the human
    protein and is conferred by its N-terminal 340 residues.
  description: Image endogenously tagged PPP1R15B against ER, Golgi and ribosome markers by
    confocal and expansion microscopy, and repeat with the R15B1-340 and R15B340-713 fragments.
    This would settle whether the IBA ER row reflects human PPP1R15B localization or only the
    better-studied PPP1R15A, and whether an ER-membrane sub-compartment term is warranted.
  experiment_type: imaging / subcellular fractionation
