      only one line of human PPP1R15B evidence, punctate foci with no ER marker co-stain, there
      is no basis for adding an ER-membrane term as NEW. It is non-core because the
      dephosphorylation reaction itself is on cytosolic eIF2 and activity does not require the
      N-terminal 340 residues that carry the localization signal.'
