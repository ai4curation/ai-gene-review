  findings:
  - statement: PPP1R15B/CReP is the constitutively acting eIF2alpha phosphatase regulatory
      subunit, whereas PPP1R15A/GADD34 is induced by eIF2alpha phosphorylation as negative
      feedback on PERK signalling.
    supporting_text: the constitutive repressor of eIF2α phosphorylation (CReP), encoded by
      PPP1R15B, acts under basal conditions (8), while GADD34, encoded by PPP1R15A, is activated
      by eIF2α phosphorylation and feeds back negatively on PERK signaling to promote the
      recovery of protein synthesis as the stress response wanes (9)
    reference_section_type: INTRODUCTION
  - statement: The homozygous R658C variant lies in the conserved C-terminal PP1-binding core,
      reduces PP1 binding and eIF2alpha dephosphorylation, and causes beta-cell apoptosis.
    supporting_text: The R658C mutation decreases PP1 binding and eIF2α dephosphorylation and
