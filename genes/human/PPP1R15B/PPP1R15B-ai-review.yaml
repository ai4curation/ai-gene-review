gene_symbol: PPP1R15B
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
aliases:
- CReP
description: 'PPP1R15B (CReP, the "constitutive repressor of eIF2alpha phosphorylation") is one
  of the two non-catalytic targeting subunits of the mammalian eIF2alpha holophosphatase; the
  other is its paralogue PPP1R15A/GADD34. It has no catalytic activity of its own. Instead it is
  a two-module adaptor: a conserved middle region (roughly residues 340-639, containing the short
  helices H1-H3) clamps the trimeric eIF2 complex through contacts on eIF2gamma and the eIF2alpha
  C-terminal domain, far from the phosphosite, while a C-terminal RVxF-containing region
  (639-713) docks the PP1 catalytic subunit. Joining the two allows PP1 to dephosphorylate
  eIF2alpha Ser51 selectively, and either module alone is inactive. Unlike GADD34, which is
  induced as stress-triggered negative feedback, PPP1R15B works largely constitutively, keeping
  basal eIF2alpha phosphorylation low so that cap-dependent translation initiation proceeds in
  unstressed cells; it is nonetheless induced by endoplasmic reticulum stress in pancreatic
  beta-cells. Loss of function raises phospho-eIF2alpha, switches on downstream stress genes such
  as ATF3, blunts glucose-stimulated insulin secretion and sensitises beta-cells to apoptosis.
  Two human recessive missense variants dissect the two modules and cause the same syndrome of
  microcephaly, short stature, intellectual disability and impaired glucose metabolism (MSSGM2):
  R658C abolishes PP1 binding, while N423D leaves PP1 binding intact and cripples substrate
  recruitment. The holophosphatase is the pharmacological target of salubrinal and of the
  R15B-selective compound Raphin1.'
