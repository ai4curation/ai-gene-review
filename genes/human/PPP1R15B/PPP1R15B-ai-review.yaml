- term:
    id: GO:1903898
    label: negative regulation of PERK-mediated unfolded protein response
  evidence_type: TAS
  original_reference_id: PMID:22013210
  qualifier: involved_in
  review:
    summary: TAS (IRE1 review) for negative regulation of PERK-mediated UPR.
    action: KEEP_AS_NON_CORE
    reason: >-
      CReP-PP1 dephosphorylates eIF2alpha constitutively and so opposes the PERK translational arm, but
      it is not the stress-induced feedback (that is GADD34); its effect on the UPR is a consequence of
      setting basal phospho-eIF2alpha. Non-core.
    supported_by:
    - reference_id: PMID:14638860
      supporting_text: >-
        Blocking CReP expression activated the ISR and protected cells from oxidative, nitrosative, and
        ER stress
core_functions:
- description: >-
    Constitutive PP1 regulatory subunit that binds PP1c and recruits trimeric eIF2, directing dephosphorylation
    of eIF2alpha Ser51 to keep basal eIF2alpha phosphorylation low and translation initiation active in
    unstressed cells.
  molecular_function:
    id: GO:0019888
    label: protein phosphatase regulator activity
