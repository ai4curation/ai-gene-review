  supported_by:
  - reference_id: PMID:14638860
    supporting_text: >-
      Here, we report on identification of a regulatory subunit of a constitutive eIF2α phosphatase complex
      that regulates basal levels of eIF2α phosphorylation.
  - reference_id: PMID:26307080
    supporting_text: >-
      We show that patient cells have greatly diminished levels of PPP1R15B-PPP1C interaction, which results
      in increased eIF2α phosphorylation and resistance to cellular stress.
