suggested_questions:
- question: >-
    Where in the cell does endogenous CReP act? The ER is assigned only by phylogenetic inference from
    GADD34-type N-terminal targeting; is CReP ER-membrane-associated in human cells?
suggested_experiments:
- description: >-
    Localize endogenous PPP1R15B (tagged at the native locus) by imaging and fractionation with ER and
    mitochondrial markers, and test whether its N-terminal region is required for membrane association
    and basal eIF2alpha dephosphorylation.
  hypothesis: >-
    CReP, like GADD34, is targeted to the cytoplasmic face of the ER by its N-terminal region, and this
    targeting is needed for efficient basal dephosphorylation.
knowledge_gaps:
- gap_statement: The subcellular site where CReP-PP1 dephosphorylates eIF2alpha in human cells is not
    established.
  gap_kind:
