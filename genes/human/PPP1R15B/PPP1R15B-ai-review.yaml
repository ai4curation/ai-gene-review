id: Q5SWA1
gene_symbol: PPP1R15B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PPP1R15B encodes CReP (constitutive repressor of eIF2alpha phosphorylation), the constitutively expressed,
  short-lived paralog of GADD34 (PPP1R15A) and a non-catalytic regulatory subunit of protein phosphatase
  1. CReP binds the PP1 catalytic subunit through a C-terminal PP1-binding region and captures the trimeric
  eIF2 substrate through a largely disordered central recruitment module whose helical elements clamp
  eIF2gamma and the C-terminal domain of eIF2alpha, far from the Ser51 phosphosite, presenting it to PP1
  for dephosphorylation. The resulting holophosphatase keeps basal eIF2alpha phosphorylation low in unstressed
  cells; loss of CReP raises phospho-eIF2alpha and activates the integrated stress response. The CReP-PP1
  complex is a target of the eIF2alpha dephosphorylation inhibitor salubrinal. Biallelic PPP1R15B variants
  that impair PP1 or eIF2 binding cause a syndrome of microcephaly, short stature, intellectual disability
  and impaired glucose metabolism.
