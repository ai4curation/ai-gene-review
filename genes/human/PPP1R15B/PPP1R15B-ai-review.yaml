  title: Substrate recognition determinants of human eIF2α phosphatases.
  findings:
  - statement: PPP1R15B is modular, with the middle region R15B340-639 binding eIF2alpha and the
      C-terminal R15B639-713 binding PP1, and no overlap between the two.
    supporting_text: R15B340–639 binds eIF2α while the carboxy-terminal region R15B639–713 binds
      PP1
    reference_section_type: RESULTS
  - statement: Only fragments containing both the substrate-binding and the PP1-binding region
      dephosphorylate eIF2alpha in cells.
    supporting_text: Similarly, full-length R15B1–713 as well as R15B340–713 were highly active
    reference_section_type: RESULTS
  - statement: The middle region of PPP1R15B acts as a selective substrate receptor that enhances
      PP1 activity toward eIF2alpha; PP1 alone is not selective.
    supporting_text: PP1 can dephosphorylate eIF2α but its activity is enhanced by the middle
      region of R15 which serves as a selective substrate receptor
    reference_section_type: DISCUSSION
  - statement: G-actin is not required for substrate recruitment; it is captured only by short
      C-terminal fragments, which may be a neomorphic property.
    supporting_text: These findings establish that that actin is not required for substrate
      recruitment.
    reference_section_type: RESULTS
  - statement: PP1 binds PPP1R15A about ten-fold more tightly than PPP1R15B.
    supporting_text: the affinity of PP1 is approximately 10-fold higher for R15A than R15B
    reference_section_type: DISCUSSION
  - statement: Full-length PPP1R15B captures little PP1 relative to its isolated RVxF fragment,
      raising the possibility that holoenzyme assembly is substrate-driven rather than
      constitutive.
    supporting_text: Thus, it is conceivable that the binding of PP1 to R15s is not constitutive
      but driven by the substrates or other modes of regulation.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Hodgson, Andreeva and Bertolotti, Open Biol 2021, full text cached. The
      definitive module mapping in cells and the paper that retires the G-actin selectivity
      model. Note that its GOA row for GO:0019888 is coded IEP, which this paper does not
      support; that is recorded as a source defect on the annotation.
- id: PMID:38159565
  title: Recruitment of trimeric eIF2 by phosphatase non-catalytic subunit PPP1R15B.
  findings:
  - statement: The substrate-recruitment module of PPP1R15B is largely disordered with three
      short helices H1-H3, and H1 and H2 form a clamp that grasps eIF2 far from the phosphosite.
    supporting_text: H1 and H2 form a clamp that grasps the substrate in a region remote from the
      phosphorylated residue
    reference_section_type: ABSTRACT
  - statement: PPP1R15B binding protects regions at the C-terminal end of eIF2gamma, with H1
      contacting the eIF2gamma G-domain and DIII interface, so the substrate is the eIF2 trimer
      rather than an isolated eIF2alpha.
    supporting_text: Unexpectedly, binding of R15B to eIF2 protected residues 294–309 and 405–436
      at C-terminal end of eIF2γ
    reference_section_type: RESULTS
  - statement: A homozygous N423D variant adjacent to H1 was found in a patient with
      microcephaly, developmental delay and intellectual disability; it reduces eIF2 capture
      while leaving PP1 binding intact.
    supporting_text: The N423D variant has no effect on PP1 binding but decreases substrate
      recruitment and dephosphorylating activity, whereas the R658C reduces dephosphorylation by
      decreasing PP1 binding.
    reference_section_type: DISCUSSION
  - statement: Substrate recruitment may precede PP1 recruitment, implying a two-step catalytic
      pathway in which a module distant from the catalytic subunit captures the substrate first.
    supporting_text: our findings raise the possibility that the substrate could assemble with
      R15 independently or prior to PP1 binding, suggesting a two-step pathway for catalysis
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Fatalska et al., Mol Cell 2024, full text cached. The structural and
      biophysical definition of the substrate clamp, plus the second disease variant N423D that
      separates substrate recruitment from PP1 binding.
