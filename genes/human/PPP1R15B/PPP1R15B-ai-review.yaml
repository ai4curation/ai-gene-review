- term:
    id: GO:0034976
    label: response to endoplasmic reticulum stress
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: Family-node annotation. PPP1R15B is itself induced by ER stress in beta-cells and
      sets the level of the eIF2alpha phosphorylation that ER stress produces.
    action: KEEP_AS_NON_CORE
    reason: 'The claim holds for PPP1R15B on its own evidence, not only by descent: it is
      transcriptionally induced by ER stressors in a PERK-dependent manner in beta-cells, and
      its loss raises phospho-eIF2alpha and induces ATF3. It is non-core because ER stress is
      one of several inputs that converge on phospho-eIF2alpha, alongside amino-acid starvation,
