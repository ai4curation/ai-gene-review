suggested_questions:
- question: Which YAP/TAZ target genes and developmental outputs are uniquely dependent on TEAD4, rather than buffered by the other human TEAD paralogs?
- question: Which VGLL-family cofactors form physiological complexes with TEAD4 in human tissues, and do they activate or repress the same cis-regulatory targets as YAP/TAZ?
suggested_experiments:
- description: Use single and combinatorial CRISPR knockouts of TEAD1-4 followed by YAP/TAZ ChIP-seq and RNA-seq to separate TEAD4-specific Hippo targets from redundant pan-TEAD targets.
