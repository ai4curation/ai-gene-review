id: Q15561
gene_symbol: TEAD4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TEAD4 encodes the RTEF-1/TEF-3 member of the human TEA-domain transcription-factor family. It is a nuclear sequence-specific DNA-binding protein that partners with YAP1 or WWTR1/TAZ to activate Hippo-responsive RNA polymerase II transcription, binds VGLL-family transcription coregulators, and is expressed in skeletal muscle, heart, placenta and other tissues while sharing conserved cis-regulatory and YAP/TAZ-binding functions with TEAD1-3.
