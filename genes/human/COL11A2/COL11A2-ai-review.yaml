id: P13942
gene_symbol: COL11A2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COL11A2 encodes the alpha-2 chain of type XI collagen, a minor fibrillar extracellular matrix collagen.
  Full-length chains assemble with alpha-1(XI) and a COL2A1-derived alpha-3(XI) chain in collagen-XI heterotrimers,
  which participate in the organization of cartilage collagen fibrils. The protein is synthesized through the secretory
  pathway and acts in extracellular matrices. Human variants cause skeletal dysplasia and sensorineural hearing
  loss; human cartilage ultrastructure and mouse tectorial-membrane studies connect these phenotypes to altered
  fibril organization. Alternative splicing generates products that differ in sequence and length.
