  evidence_type: IDA
  original_reference_id: PMID:9188673
  qualifier: involved_in
  review:
    summary: Human COL11A2-associated cartilage shows altered fibril organization.
    action: ACCEPT
    reason: The complete PMID:9188673 abstract explicitly reports increased fibril diameter and aggregation in cartilage
      from human siblings homozygous for a COL11A2 mutation. This directly supports the original organization assertion
      in its stated structural context. Preserve the curator evidence code; do not reclassify it mechanically from
      the shorter cache or present it as a purified-protein assay.
    supported_by:
    - reference_id: PMID:9188673
