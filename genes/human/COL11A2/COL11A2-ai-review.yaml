    - reference_id: PMID:10581026
- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: NAS
  original_reference_id: PMID:10677296
  qualifier: enables
  review:
    summary: The cited clinical study does not establish macromolecule-adaptor activity.
    action: MARK_AS_OVER_ANNOTATED
    reason: The complete original PMID:10677296 Methods and Results concern human family phenotypes, variants and
      RNA analysis; its collagen-XI heterotrimer and fibril discussion does not demonstrate COL11A2 bringing distinct
      macromolecules together for coordinated action as required by GO:0030674. Matrix incorporation is real, but
      is already represented by the supported collagen structural and fibril annotations. Mark this NAS adaptor
      specificity as over-annotated without denying interactions or inventing a separate scaffold mechanism.
    supported_by:
    - reference_id: PMID:10677296
