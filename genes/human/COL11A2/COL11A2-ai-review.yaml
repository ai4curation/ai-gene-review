core_functions:
- description: Full-length alpha-2(XI) chains contribute structural integrity and fibril organization as components
    of collagen-XI heterotrimers in extracellular matrix. Human COL11A2-associated cartilage shows altered fibril
    diameter and aggregation; targeted mouse Col11a2 disruption separately connects tectorial-fibril disorganization
    to hearing loss. The tensile-strength term follows the explicit GO convention for ECM collagens, without claiming
    an isolated human COL11A2 mechanical measurement. Biosynthetic ER residence and downstream skeletal or hearing
    phenotypes are integrated with this matrix role rather than represented as additional molecular cores. The recorded
    short product and all splice forms are not assumed to have been tested equivalently.
  molecular_function:
    id: GO:0030020
    label: extracellular matrix structural constituent conferring tensile strength
  directly_involved_in:
  - id: GO:0030199
    label: collagen fibril organization
  locations:
  - id: GO:0031012
    label: extracellular matrix
  in_complex:
    id: GO:0005592
    label: collagen type XI trimer
  supported_by:
  - reference_id: PMID:9188673
    supporting_text: 'collagen fibrils are increased in diameter and

      show aggregation'
  - reference_id: PMID:10581026
  - reference_id: PMID:10677296
  - reference_id: PMID:28344315
suggested_questions:
- question: Which COL11A2 splice products are incorporated into mature collagen-XI trimers in cartilage and the
    tectorial membrane, and what is the function of the recorded short product?
  experts: []
- question: Does purified, sequence-defined COL11A2-containing collagen XI directly bind DDR2, independently of
    collagen-II preparations and their associated components?
  experts: []
- question: How does alpha-2(XI) composition alter human heterofibril diameter and mechanical behavior relative
    to compensating type-V/XI assemblies?
  experts: []
suggested_experiments:
- hypothesis: COL11A2 product composition changes collagen-XI assembly and its control of heterofibril architecture.
  description: Compare sequence-verified full-length human products in defined alpha-1(XI)/COL2A1-derived heterotrimers.
    Measure secretion, chain incorporation, fibril diameter and matrix mechanics separately, with folding/processing
    controls and explicit short-product testing.
- hypothesis: A COL11A2-containing collagen-XI preparation can be distinguished from type-II collagen in DDR2-binding
    assays.
  description: Use composition-verified collagen-XI heterotrimers, collagen-II controls and human DDR2 ectodomain
    preparations in direct binding assays. Quantify contaminating collagen chains and retain nonbinding/denatured
    controls before assigning chain-specific contacts or signaling activity.
