  review:
    summary: The COL11A2-specific attribution of the recorded DDR2 interaction remains unresolved.
    action: UNDECIDED
    reason: "Full publisher text is available and its assays were inspected, but the participant mapping needed to adjudicate this COL11A2 assertion remains unresolved. Two positive MINT records map P13942 to DDR2 and are preserved literally. The original experiments use human DDR2 residues 26–186, commercial collagen type II in SPR and TCS, explicitly bovine nasal-septum type II for the TCS preparation, and a generic GPO-repeat computational docking model; they do not identify a tested COL11A2 chain. The campaign policy retains UNDECIDED when the relevant evidence cannot be adjudicated and does not remove a positive generic-binding assertion merely for lack of specificity. Full-text access therefore does not justify REMOVE or establish this exact interaction. Preserve the source pending substrate/mapping clarification, without retargeting it, denying possible DDR2–COL11A2 biology, or promoting an unsupported partner-class refinement."
