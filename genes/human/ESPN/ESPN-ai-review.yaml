id: B1AK53
gene_symbol: ESPN
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Espin binds and cross-links actin filaments, organizing actin bundles in epithelial microvilli
  and sensory hair-cell stereocilia. Its WH2 domain binds actin monomers, while its C-terminal region
  supports filament binding and bundling. Bundling contributes to microvillar assembly and projection
  elongation. Rodent studies show isoform-dependent shaft and tip distributions. Human products include
  an 854-residue form and a 288-residue form that retains the WH2 and C-terminal bundling regions but
  lacks the long N-terminal region.
