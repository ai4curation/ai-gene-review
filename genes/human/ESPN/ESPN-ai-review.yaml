- id: PMID:12598619
  title: Novel espin actin-bundling proteins are localized to Purkinje cell dendritic spines and bind
    the Src homology 3 adapter protein insulin receptor substrate p53.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official Europe PMC metadata and recovered original PMC2854510 verify PMID, title and
      DOI. Operative Methods, rat product Results, Figures 5/7 captions and binding/deletion Results were
      read from the accepted original capture. Rat Purkinje-cell espin variants and engineered proline-region
      deletions were tested with a human IRSp53 186-aa SH3-containing GST fusion; mouse IRSp53/Neuro-2a
      experiments are separate. Binding constants suggested in Discussion are not measured for those variants.
      No figure pixels or supplements inspected; no natural human product equivalence inferred.
- id: PMID:29572253
  title: Inframe deletion of human ESPN is associated with deafness, vestibulopathy and vision impairment.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official Europe PMC metadata and original PMC6232856 verify PMID, title and DOI. Actual
      construct/cell/binding Methods, functional Results and Figure 4/5 captions were read; both figure
      images were inspected. GFP-human espin 3A was tested in LLC-PK1-CL4 cells and mouse cochlear explants;
      purified His-human 3A was tested with rabbit F-actin. The 3A template is reported as NM_031475 nucleotides
      1777-2733, and no exact equivalence to the current human 854/288-aa products is asserted. Figures
      5K/L distinguish residual binding from impaired bundling in the deletion mutant. Clinical association
      is not substituted for these functional assays. Supplements were not inspected.
