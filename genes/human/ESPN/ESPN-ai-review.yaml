- question: How does deletion of canonical residues 543–572 in the 288-residue human product affect bundling
    and projection targeting relative to the 318-residue C-terminal interval specified by the published
    espin 3A coordinates?
- question: Which human espin products support MYO3A/MYO3B-dependent transport or adaptor interactions,
    and how do their proline-rich regions influence shaft versus tip enrichment?
suggested_experiments:
- hypothesis: The shared C-terminal regions preserve filament binding, while the 30-residue difference
    can alter bundling or cellular targeting.
  description: Compare sequence-verified human 318-residue C-terminal and 288-residue products, with the
    long product as a separate comparator. Measure F-actin binding and bundling in distinct high- and
    low-speed sedimentation assays, then compare expression-normalized projection localization and elongation
    in the same epithelial or hair-cell system. Verify the historical construct sequence before identifying
    a reagent as espin 3A.
