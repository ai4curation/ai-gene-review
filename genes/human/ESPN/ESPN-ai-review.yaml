  evidence_type: ISS
  original_reference_id: PMID:12598619
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q63618
  review:
    summary: Retain the specific SH3-binding interaction as a contextual, non-core partner-binding activity.
    action: KEEP_AS_NON_CORE
    reason: PMID:12598619 supplies positive experimental evidence for the rat Q63618 donor. Rat Purkinje-cell
      espin variants bind a GST fusion containing the 186-aa C-terminal SH3-containing region of human
      IRSp53; GST controls and deletion of the espin N-terminal proline-rich segment support domain-directed
      association (Methods; Figure 7C/D; interaction Results). Mouse IRSp53 and Neuro-2a colocalization
      experiments are separate from this biochemical assay. The current human long sequence contains a
      corresponding proline-rich region, supporting the curator's gene-level ISS transfer, while the 288-aa
      product lacks the long N-terminal region. Retain the specific binding as a contextual interaction
      rather than making it the principal actin-bundling function. The tested rat PC products are not
      natural human isoform equivalents, and neither a human ESPN binding assay nor a binding constant
      for these constructs was reported.
    supported_by:
    - reference_id: PMID:12598619
