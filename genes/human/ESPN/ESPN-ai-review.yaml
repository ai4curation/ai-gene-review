core_functions:
- description: Cross-links actin filaments, supplying structural work in microvillar actin-bundle assembly.
    Purified human espin 3A bundles F-actin in a low-speed sedimentation assay; a deletion variant retains
    reduced binding in the separate high-speed assay but loses efficient bundling and projection elongation.
    Human GFP-espin 3A targets microvilli in epithelial cells and stereocilia in mouse cochlear explants,
    with complementary native rat brush-border evidence. The microvillar process and sensory location
    are distinct contexts of the same activity.
