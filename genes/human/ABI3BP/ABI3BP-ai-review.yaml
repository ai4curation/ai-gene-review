- term:
    id: GO:0005201
    label: extracellular matrix structural constituent
  evidence_type: RCA
  original_reference_id: PMID:28675934
  qualifier: enables
  review:
    summary: >-
      This is the central problem with the record. GO:0005201 is defined as "The action of a
      molecule that contributes to the structural integrity of the extracellular matrix"
      (definition retrieved from QuickGO), and it is asserted here three times over, by the same
      BHF-UCL reviewed-computational-analysis pipeline, from three ECM proteomics sources. What
      those sources establish is that ABI3BP peptides are recovered from ECM-enriched fractions of
      human tissue. That is a statement about location, and the very same three papers are already
      cited for the HDA GO:0031012 and GO:0005576 rows, which I accept. Being present in the matrix
      is not the same as holding the matrix together, and the RCA inference silently crosses that
      line.

      This particular citation is the weakest of the three: PMID:28675934 is a protocols paper. It
      supplies a workflow for solubilising and quantifying ECM proteins and illustrates it on
      triple-negative breast cancer versus adjacent mammary tissue and on ovarian omental
      metastasis versus normal omentum. It contains no experiment addressed to ABI3BP, and no
      experiment addressed to matrix mechanics.

      No study has asked whether removing ABI3BP alters the mechanical properties of any matrix.
      The only assembly-relevant observation in the literature is second-hand and concerns a
      fragment rather than the protein: a partial fragment containing one fibronectin type-III
      domain promoted cell attachment and could assemble into a matrix in vitro. That fragment
      result argues for adhesion, and if anything for the cell-instructive reading, not for a
      load-bearing role. What has actually been measured for the full-length protein is receptor
      binding, receptor activation and a signalling output: ABI3BP behaves as a matricellular
      protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Not wrong that ABI3BP is a matrix constituent, but wrong about what it does there. Detection
      in an ECM-enriched proteome supports the co-annotated cellular-component terms, not a
      molecular function asserting a contribution to structural integrity, and this citation is a
      methods paper with no ABI3BP-specific and no mechanics-specific experiment. Not removed,
      because the protein genuinely is matrix-resident and a fragment can assemble into matrix in
      vitro, so a structural contribution has not been excluded - it has simply never been tested.
      See proposed_new_terms: GO offers no molecular function for the matricellular class, which is
      why this term keeps being reached for.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      - SOURCE_EVIDENCE_WEAK
      source_entities:
      - source_id: PMID:28675934
        source_label: Naba et al. ECM proteomics protocols paper
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Supports the co-annotated HDA cellular-component row from the same dataset; cannot
          support a molecular function, and contains no ABI3BP-specific or matrix-mechanics
          experiment.
      - source_id: GO:0005201
        source_label: extracellular matrix structural constituent
        source_status: NOT_RELEVANT
        comment: >-
          Term is mechanically scoped ("contributes to the structural integrity of the
          extracellular matrix") and all its children are mechanical, so it cannot express
          matrix-resident cell-instructive activity. This is the scoping gap recorded in
          proposed_new_terms.
    supported_by:
    - reference_id: PMID:28675934
      supporting_text: >-
        We provide here optimized protocols to solubilize ECM proteins from normal or tumor
        tissues, digest the proteins into peptides, analyze ECM peptides by mass spectrometry, and
        interpret the mass spectrometric data.
    - reference_id: PMID:23666637
      supporting_text: >-
        Computational screening followed by in vitro assays identified that a partial fragment of
        Abi3bp, containing one of the two Fibronectin type-III domains found in the full length
        protein, promoted cell attachment and was capable of assembling into an extracellular
        matrix
    - reference_id: PMID:23666637
      supporting_text: >-
        Upon Abi3bp binding to integrin-β1 Src associated with paxillin which inhibited
        proliferation.
