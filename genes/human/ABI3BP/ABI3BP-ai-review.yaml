- term:
    id: GO:0033625
    label: positive regulation of integrin activation
  evidence_type: ISS
  original_reference_id: PMID:23666637
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2444583
  review:
    summary: >-
      Proposed new annotation. ABI3BP does not merely bind integrin beta-1, it changes the
      receptor's state, which is the difference between a binding annotation and a process
      annotation. The authors state the model directly: without Abi3bp the receptor stays inactive
      and paxillin is not phosphorylated, and once enough Abi3bp is present the receptor is
      activated and drives paxillin phosphorylation. The measured correlate is a lower
      phospho-paxillin to paxillin ratio in knockout cells, restored in the presence of the ligand.
    action: NEW
    reason: >-
      The activation step is what makes ABI3BP a receptor ligand rather than a passive matrix
      component, and it is the basis for the proposed matricellular molecular-function term. Coded
      ISS: the experiments are on mouse cells and a mouse knockout.

      One caveat a curator should weigh, flagged here in the same spirit as the GO:0098640 rejection
      documented on the GO:0005178 row. GO:0033622 integrin activation is defined as "The
      aggregation, arrangement and bonding together of an integrin... that lead to the increased
      affinity of the integrin for its extracellular ligands", and that branch is conventionally
      applied to inside-out affinity modulation by talin and kindlin from the cytoplasmic face.
      ABI3BP acts from the other direction: it is itself an extracellular ligand that engages the
      receptor and, on the authors' model, holds it in the active state. The annotation is defensible
      on the explicit wording of the paper - "the integrin-β1 is maintained in a non-active state"
      in its absence - and the term is not restricted to inside-out signalling by its definition, but
      an outside-in ligand is not the canonical filler and a curator may reasonably prefer to carry
      this claim on GO:0005178 alone.
    supported_by:
    - reference_id: PMID:23666637
      supporting_text: >-
        In the absence of Abi3bp, the integrin-β1 is maintained in a non-active state and the lack
        of phosphorylated paxillin prevents sequestration of Src and ERK at the plasma membrane,
        leaving these kinases to activate cyclin-d1 and drive proliferation.
    - reference_id: PMID:23666637
      supporting_text: >-
        Abi3bp knockout MSCs were found to have a significantly lower phospho-paxillin/paxillin
        ratio for stained foci area
