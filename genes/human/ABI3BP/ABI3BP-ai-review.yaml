      protein; the species of the myc-tagged construct expressed in HEK293 is given only in the
      supplementary methods, which are not in the publication cache, so no human direct-binding
      claim is made here. Human ABI3BP is 1068 residues with the same two fibronectin type-III
      domains and the same C-terminal TARSH domain, and human cells respond to ABI3BP levels with
      the expected proliferative phenotype, so the transfer is well founded.
