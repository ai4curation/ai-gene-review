  review:
    summary: >-
      Proposed new annotation. This is the molecular function the gene actually has, and its
      absence is why three RCA rows of GO:0005201 were reached for instead. Mouse Abi3bp
      (MGI:MGI:2444583) binds integrin beta-1, shown three ways in one paper: co-precipitation of
