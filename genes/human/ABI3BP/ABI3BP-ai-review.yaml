  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: >-
      Cached title matches; abstract-only; mouse knockout. Correctly cited, but marked DISPUTED
      because the senescence direction opposes PMID:19338757 and PMID:18559958. Documents the
      conflict only.
- id: PMID:41232761
  title: Integrated analysis of the transcriptome and proteome reveals that ABI3BP is
    involved in the pathogenesis of osteoarthritis.
  findings:
  - statement: >-
      ABI3BP is elevated in human osteoarthritic cartilage, in a dataset whose enriched pathways
      are extracellular matrix organisation and ECM-receptor interaction. This adds cartilage to
      the interstitial matrix compartments in which the protein is found, and the ECM-receptor
      enrichment is consistent with a receptor-engaging rather than load-bearing role.
    supporting_text: >-
      Enriched pathways included extracellular matrix (ECM) organization, ECM-receptor interaction,
      and phenylalanine metabolism. ABI3BP was notably elevated in OA cartilage.
  - statement: >-
      Knockdown reduces senescence markers in chondrocytes - the third study in which losing the
      gene reduces senescence.
    supporting_text: >-
      Its knockdown mitigated IL-1β-induced ECM degradation and reduced the level of
      senescence-associated markers
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cached title matches; abstract-only; human cartilage and chondrocytes. Used for the cartilage
      matrix compartment, which corroborates the interstitial matrix assignment. Its senescence
      result is part of the unresolved conflict and supports no annotation.
- id: PMID:41839242
  title: ABI3BP protects against cerebral ischemia-reperfusion injury by preserving blood-brain
    barrier integrity and activating PI3K/Akt signaling.
  findings:
  - statement: >-
      Thrombin cleaves ABI3BP at arginine 337. The site is independently plausible: residue 337 of
      the canonical human sequence is arginine and its context is Pro-336/Arg-337/Ser-338, a
      canonical thrombin motif, and it lies in the disordered linker between the two fibronectin
      type-III domains.
    supporting_text: Thrombin hydrolyzed ABI3BP at arginine 337.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cached title matches; abstract-only; 2026, single laboratory. Used only for the cleavage
      site, which was checked against the canonical sequence in ABI3BP-uniprot.txt rather than
      accepted on trust - residue 337 is indeed arginine, with proline at P2 and serine at P1'. The
      blood-brain-barrier protection arm uses supraphysiological recombinant protein and is not
      annotated.
- id: file:human/ABI3BP/ABI3BP-deep-research-affinage.md
  title: Affinage mechanistic annotation for ABI3BP (human)
  findings:
  - statement: >-
      Machine-generated summary of the gene as a secreted matrix protein restraining stem and
      progenitor proliferation while licensing differentiation. Used only as a pointer to the
      primary literature; the substance is carried by PMID:23666637 and PMID:25296984.
    supporting_text: >-
      ABI3BP is a secreted extracellular matrix protein that acts as a brake on stem and progenitor
      cell proliferation while licensing their differentiation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Precomputed LLM-generated research, not a curated annotation, and treated as a preliminary
      source throughout. Its frontmatter reports 100% self-assessed faith and carries no
      self_evaluation_pairwise score, and all 12 citations are numeric PMIDs - there are no bioRxiv DOIs sitting in a PMID-shaped
      field, which is the failure mode to check for. Every finding it lists was checked against the
      cited PMID and the substantive ones were independently quoted from those papers instead.

      Cited exactly once in this review, on the GO:1902461 row, and only for its high-level summary
      sentence, which is independently carried on that same row by two verbatim PMID:23666637
      quotes and one from PMID:18559958. Deliberately not used for any mechanistic claim: every
      domain boundary, binding partner, cleavage site and signalling step in this review is quoted
      from the UniProt feature table or from the primary paper. Note also that the file's own
      machine "mechanism profile" block grounds the gene to GO:0098631 cell adhesion mediator
      activity and GO:0098772 molecular function regulator activity with no biological process at
      all, which is coarser than and partly inconsistent with its own narrative; those ids were not
      imported, and the molecular function proposed here was re-grounded from the primary papers.
- id: file:human/ABI3BP/ABI3BP-uniprot.txt
  title: UniProt entry Q7Z7G0 (TARSH_HUMAN) for human ABI3BP
  findings:
  - statement: >-
      Secreted, with a signal peptide at residues 1-21 and a mature chain 22-1068. This is the
      source of the GO:0005576 IEA row via the SL-0243 keyword.
    supporting_text: "SUBCELLULAR LOCATION: Secreted"
  - statement: >-
      The ABI3 interaction that gives the gene its name is hedged by UniProt itself, consistent
      with it never having been shown for the full-length protein.
    supporting_text: "SUBUNIT: Probably interacts with ABI3."
  - statement: >-
      No PAINT/PAN-GO annotation exists for this protein, which is why the record contains no IBA
      row despite PANTHER family PTHR23197 subfamily SF10 being assigned to it.
    supporting_text: "PAN-GO; Q7Z7G0; 0 GO annotations based on evolutionary models."
  - statement: >-
      Two fibronectin type-III domains, at 116-214 and 833-926, separated by a large disordered
      proline-rich region; no catalytic domain anywhere in the sequence.
    supporting_text: '/note="Fibronectin type-III 1"'
  - statement: >-
      The protein is detected at protein level, so the total absence of biological-process
      annotation is a curation gap rather than a reflection of an uncharacterised gene product.
    supporting_text: "PE   1: Evidence at protein level;"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The downloaded UniProt record for this gene, entry version 171. All quotations are single
      physical lines from the flat file, checked by grep rather than reconstructed. Used for
      architecture, secretion, the ABI3 hedge, the tissue distribution and the absence of PAN-GO
      annotation.
