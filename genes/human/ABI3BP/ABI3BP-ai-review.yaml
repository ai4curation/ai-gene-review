suggested_questions:
- question: >-
    Should ABI3BP have any biological-process annotation at all? At present it has none - not one
    BP row in the whole GOA record - despite a knockout mouse with proliferation and
    differentiation phenotypes in two independent progenitor lineages, a defined receptor, a
    worked-out signalling chain, and loss-of-function data in three human tumour types. The
    candidates that follow from the published work, and that are proposed as NEW rows here, are
    negative regulation of mesenchymal stem cell proliferation (GO:1902461), positive regulation of
    integrin activation (GO:0033625), negative regulation of the ERK1/ERK2 cascade (GO:0070373),
    positive regulation of osteoblast differentiation (GO:0045669), positive regulation of fat cell
    differentiation (GO:0045600), positive regulation of cardiac muscle cell differentiation
    (GO:2000727) and negative regulation of dendrite morphogenesis (GO:0050774). Because every
    perturbation experiment is mouse-based, all are ISS on the human gene with mouse Abi3bp
    (MGI:MGI:2444583) as supporting entity. Note that GO:0050774 comes from a different axis of the
    biology with no identified receptor, which is why it is the one proposed process kept out of
    core_functions.

    A curator taking these up should note the term-definition trap documented on the GO:0045669
    row: the apparently ideal lineage-agnostic terms GO:2000738 and GO:2000741 both target
    differentiation *into* a stem cell, so they invert the claim, and the two mesenchymal lineages
    have to be annotated by outcome instead.
- question: >-
    Does ABI3BP act where it is deposited, or does it diffuse? This is the crux of the proposed
    matricellular term and the evidence currently cuts both ways for the same protein. It forms
    discrete extracellular deposits and is recovered from insoluble matrix fractions of four
    tissues, which is matrix-tethered behaviour. Yet concentrated medium from cells expressing it
    inhibits mesenchymal stem cell proliferation, and purified secreted TARSH reduces mitral cell
    dendritic complexity in dissociated culture - both of which are action at a distance from the
    source. Thrombin cleavage at Arg-337 may be the reconciling mechanism, releasing a soluble
    fragment from a tethered pool, but that has not been tested. Until it is, "matricellular" should
    be justified for this gene by receptor class and matrix residence rather than by any claim that
    the protein cannot diffuse.
- question: >-
    What receptor mediates the neuronal effect? The dendritic-refinement activity is the one
    demonstrated function with no receptor attached, which is why it is annotated as a process
    (GO:0050774) but kept out of core_functions - there is no molecular function to hang it on.
    Integrin beta-1 is the obvious candidate to test first given the rest of the biology, but no
    integrin experiment has been done in neurons, and mitral cell dendritic refinement is not an
    adhesion phenotype in any obvious way.
- question: >-
    Does ABI3BP contribute to the structural integrity of any matrix, or only to signalling through
    it? This is the question that decides whether the three GO:0005201 rows should stand. Nothing
    published measures a mechanical property in the absence of ABI3BP. The only assembly-relevant
    datum is a fibronectin type-III fragment that promoted cell attachment and assembled into
    matrix in vitro, reported second-hand through PMID:23666637 from PMID:18757743, whose full text
    is not retrievable and whose abstract does not name the protein.
- question: >-
    Is the effect on senescence positive or negative? The literature supports both signs with
    perturbation experiments, and says so explicitly. Knockdown in mouse embryonic fibroblasts
    increases senescence-associated beta-galactosidase in a p53/p21-dependent way, and
    re-expression in human thyroid carcinoma lines also triggers senescence through p21 - opposite
    manipulations reported to give the same outcome. Meanwhile knockdown or knockout reduces
    senescence in vascular smooth muscle, renal tubular epithelium and chondrocytes. Until this is
    resolved, whether by cell type or by distinguishing replicative from stress-induced senescence,
    no senescence term should be asserted, and senescence has deliberately been left out of
    core_functions.
- question: >-
    Does full-length ABI3BP actually bind ABI3? The gene is named for this interaction, but it was a
    yeast two-hybrid hit against the isolated Nesh/ABI3 SH3 domain, and the clone recovered was the
    486-residue short isoform - canonical 1068 residues minus the 1-607 deletion plus the
    25-residue insertion at position 669 gives exactly the 486 residues the cloning paper reports.
    Twelve years later the caveat still stood in print, and UniProt still hedges with "Probably
    interacts with ABI3". GOA carries no annotation for this pair, which is the right outcome; the
    open question is whether the interaction is real or whether the gene is named after an
    artefact.
- question: >-
    Why is the colocalizes_with qualifier used on the GO:0031012 row from PMID:20551380 when the
    same paper, the same experiment and the same pipeline produced located_in for the parent term
    GO:0005576, and located_in GO:0031012 for the breast and atrial datasets? colocalizes_with is
    for evidence that cannot resolve whether a protein is genuinely within a structure, which does
    not describe stepwise biochemical fractionation of the extracellular space. There is no review
    action for correcting a qualifier alone, so it is raised here.
- question: >-
    What is the significance of the huge disordered, proline-rich central region? Of 21 PxxP motifs
    in the 1068-residue sequence, 18 fall inside the MobiDB-lite disordered segment 384-811 - 4.2
    per 100 residues against 0.47 per 100 residues elsewhere, a roughly ninefold enrichment. This
    is the region that alternative splicing rearranges across all four human isoforms and the
    region reported as an SH3-binding motif cluster in mouse Tarsh. Does it recruit SH3-domain
    proteins at the cell surface, or is it a spacer that projects the fibronectin type-III domains
    away from the matrix?
- question: >-
    Are the four isoforms functionally different? Isoforms 2, 3 and 4 all lack the first fibronectin
    type-III domain at residues 116-214, which is the domain implicated in the cell-attachment and
    matrix-assembly fragment experiment, and isoforms 3 and 4 substitute alternative
    proline-and-basic-rich N-termini. If integrin beta-1 engagement requires that domain, three of
    the four isoforms would be signalling-dead - and no annotation in the record is isoform-resolved.
- question: >-
    Is thrombin cleavage at Arg-337 a physiological regulatory step? The site is chemically
    convincing without taking the report on trust: residue 337 of the canonical human sequence is
    arginine, and the local context is Pro-336/Arg-337/Ser-338, a textbook thrombin recognition
    motif with proline at P2, arginine at P1 and serine at P1'. It also sits in the disordered
    linker rather than in either fibronectin type-III domain, so cleavage would separate the two
    halves of the protein. If it is regulatory rather than incidental, coagulation-linked terms may
    eventually be warranted.
suggested_experiments:
- hypothesis: >-
    ABI3BP is a matricellular signalling ligand and contributes nothing measurable to matrix
    mechanics, so GO:0005201 should give way to an integrin-binding molecular function.
  description: >-
    Assemble matrix from wild-type and ABI3BP-null human fibroblasts, or from wild-type matrix
    immunodepleted of ABI3BP, and measure mechanical properties directly - AFM indentation
    stiffness, tensile testing of decellularised sheets, and collagen fibril architecture by
    second-harmonic imaging. In parallel measure integrin beta-1 activation state on cells plated on
    each matrix using conformation-specific antibodies. The prediction is unchanged stiffness and
    fibril architecture with a large change in integrin activation. A negative mechanical result
    together with a positive signalling result would settle the GO:0005201 question and support the
    proposed matricellular term.
  experiment_type: biomechanics and cell biology
- hypothesis: >-
    Human ABI3BP binds human integrin beta-1 directly, and the interaction requires the first
    fibronectin type-III domain, so isoforms 2, 3 and 4 cannot signal.
  description: >-
    Express and purify human full-length ABI3BP, each of the four isoforms, and isolated fibronectin
    type-III domain constructs, then measure binding to recombinant integrin alpha5-beta1 and
    alpha4-beta1 ectodomains by surface plasmon resonance or biolayer interferometry, with and
    without manganese activation. This would convert the mouse co-immunoprecipitation result into a
    direct human affinity measurement suitable for an experimental GO:0005178 annotation, and would
    test the isoform prediction in the same experiment.
  experiment_type: biophysics and protein biochemistry
- hypothesis: >-
    The opposing senescence phenotypes are cell-type-dependent rather than contradictory, and
    reflect replicative versus stress-induced senescence.
  description: >-
    Deplete ABI3BP in a single panel of primary human cells - fibroblasts, mesenchymal stem cells,
    vascular smooth muscle cells, renal tubular epithelium and chondrocytes - with one shared
    reagent set and one shared readout panel of SA-beta-galactosidase, p16, p21, lamin B1 and SASP
    cytokines, assayed both under serial passage and under acute stress such as angiotensin II,
    irradiation or interleukin-1 beta. Running every cell type in one experiment with one protocol
    is the only way to separate a genuine cell-type dependence from between-laboratory variation,
    and the outcome determines whether any senescence GO term can be asserted for this gene.
  experiment_type: cell biology
- hypothesis: >-
    Full-length ABI3BP does not bind ABI3, and the gene name records a two-hybrid artefact of the
    proline-rich central region.
  description: >-
    Test the interaction in mammalian cells with full-length proteins at near-endogenous levels -
    co-immunoprecipitation from a cell type expressing both, proximity labelling, and a
    split-luciferase complementation assay - comparing full-length ABI3BP against the 486-residue
    isoform 2 that the original two-hybrid screen recovered. A negative full-length result would
    justify UniProt dropping the "Probably" and would confirm that GOA is right to carry no
    annotation for this pair.
  experiment_type: interaction proteomics
- hypothesis: >-
    Thrombin cleavage at Arg-337 inactivates ABI3BP signalling by separating the two fibronectin
    type-III domains.
  description: >-
    Treat purified recombinant human ABI3BP with thrombin, confirm the cleavage position by
    N-terminal sequencing or mass spectrometry of the fragments, and compare intact protein, cleaved
    protein and an R337A mutant for integrin beta-1 binding, for the ability to hold integrin beta-1
    in the active conformation, and for suppression of mesenchymal stem cell proliferation. This
    distinguishes regulated inactivation from incidental proteolysis.
  experiment_type: protein biochemistry and cell biology
