core_functions:
- description: >-
    Matricellular integrin beta-1 ligand that couples the proliferation-to-differentiation switch
    in stem and progenitor cells. ABI3BP is secreted and deposited into the interstitial matrix,
    where its molecular activity is to bind integrin beta-1 on the surface of the cell that
    encounters it and hold the receptor in its activated state. Engaged integrin beta-1 drives
    paxillin phosphorylation at Tyr-118; phosphorylated paxillin then sequesters Src, and through
    Src the Ras-MEK-ERK cascade, at the plasma membrane, so cyclin-D1 is not induced and cells do
    not enter S phase. Removing ABI3BP releases the brake in both directions at once: mesenchymal
    stem cells over-proliferate through cyclin-D1, ERK1/2 and Src while losing the ability to
    differentiate down osteogenic or adipogenic routes, and cardiac progenitor cells expand while
    failing to express cardiomyocyte markers. Receptor dependence rests on reciprocal experiments -
    co-immunoprecipitation of integrin beta-1 with both tagged and endogenous ABI3BP, a
    blocking-antibody panel in which only the beta-1 antibody had an effect, and abolition of the
    differentiation rescue by beta-1 blocking antibodies. The mechanism is demonstrated in mouse
    cells and a mouse knockout, so for human it is a sequence-similarity inference rather than a
    direct result; the growth-suppressive consequence is separately reproduced in human thyroid,
    lung and gallbladder cells, where loss of ABI3BP accompanies transformation and restoring it
    arrests proliferation and motility.

    Scope note: ABI3BP's other demonstrated activity, restriction of olfactory mitral cell dendritic
    complexity, is annotated as a process (GO:0050774) but is deliberately not folded into this core
    function. No receptor has been identified for the neuronal effect, so it cannot be attributed to
    integrin beta-1 binding without assuming the answer, and it has not been reproduced outside the
    originating laboratory. If a common receptor is eventually shown, the two axes should be merged.
