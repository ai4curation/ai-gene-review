suggested_questions:
- question: Does SHLP5 exist? No specific antibody could be obtained (PMID:27070352), so unlike its five
    neighbours it has no protein-level detection, and the entry is PE4. Targeted mass spectrometry is
    the only way to settle this.
- question: Should GO annotations be made at all for sORF products with no existence evidence? SHLP5's
    only GOA row is an InterPro2GO transfer of an enzyme activity to a 24-residue peptide, which illustrates
    how signature-based pipelines can assert catalytic function for a product that may not be translated.
- question: Does InterPro2GO need a length guard? IPR019774 describes a multi-hundred-residue catalytic
    plus oligomerisation domain; a match on a 24-residue sequence cannot represent it, and the same failure
    mode will recur as more sORF entries enter UniProt.
suggested_experiments:
- description: Parallel reaction monitoring mass spectrometry of human tissue lysates and plasma with
    a heavy-labelled SHLP5 standard and peptides diagnostic against the MT-RNR2-like nuclear paralogs,
    to test existence directly without an antibody.
  hypothesis: SHLP5 is translated and detectable, which would make further functional work worthwhile.
- description: Ribosome profiling of the MT-RNR2 region (cytoplasmic and mitochondrial ribosome fractions
    separately) to test whether the SHLP5 ORF is occupied by ribosomes at all.
  hypothesis: The SHLP5 ORF is actively translated rather than being an in silico prediction only.
