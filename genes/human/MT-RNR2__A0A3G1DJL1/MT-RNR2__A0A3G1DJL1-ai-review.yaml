gene_symbol: MT-RNR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Small humanin-like peptide 5 (SHLP5) is a predicted 24-residue peptide and a 16S-rRNA sORF
  peptide: its open reading frame lies inside MT-RNR2, the mitochondrial 16S ribosomal RNA gene, in the
  same stretch of mitochondrial DNA that encodes humanin. The six small humanin-like peptides SHLP1-SHLP6
  were identified by an in silico search of this region and named by analogy with humanin, with which
  they share a genomic neighbourhood rather than sequence similarity. It is the least characterised of
  the six: no specific antibody against SHLP5 could be raised in the founding study, so there is no expression
  evidence for it at the protein level, and none of the viability, apoptosis or proliferation assays assigned
  it a phenotype. No receptor, binding partner, activity or subcellular location has been reported, and
  UniProt classifies the entry as PE4 (predicted). How much of this is translated in vivo is unresolved.
  The peptides are read with the cytoplasmic genetic code, yet no route is known by which an mtDNA-encoded
  transcript reaches cytoplasmic ribosomes, nor by which a peptide made in the matrix would be exported;
  and the same region of mitochondrial DNA is present in the nuclear genome as MT-RNR2-like (NUMT-derived)
  copies, so antibody-based detection cannot be attributed to the mitochondrial locus with certainty.'
existing_annotations:
- term:
    id: GO:0016714
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction of molecular
      oxygen, reduced pteridine as one donor, and incorporation of one atom of oxygen
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR019774
  review:
    summary: InterPro2GO electronic annotation assigning a pterin-dependent aromatic amino acid hydroxylase
      activity to this 24-residue peptide, on the basis of a match to InterPro IPR019774, 'Aromatic amino
      acid hydroxylase, C-terminal'.
    action: REMOVE
    reason: 'A false-positive domain match. IPR019774 covers the catalytic domain plus the C-terminal
      coiled-coil oligomerisation motif of the aromatic amino acid hydroxylases (phenylalanine, tyrosine
      and tryptophan hydroxylase) - several hundred residues including a non-heme iron site and a tetrahydrobiopterin-binding
      pocket. A 24-residue peptide (MYCSEVGFCSEVAPTEIFNAGLVV) cannot contain it, has none of the iron-coordinating
      histidine/glutamate residues, and cannot oligomerise through a motif it does not possess. There
      is no pterin, no monooxygenase chemistry and no catalytic residue anywhere in the SHLP5 literature.
      This is the short-peptide failure mode of signature-based transfer: a signature built for a long
      domain scores above threshold on a peptide that is shorter than the signature''s own functional
      core, and the resulting annotation asserts an enzyme activity for a gene product with no experimental
      evidence of existing at all. It should be withdrawn, and the InterPro2GO rule is a candidate for
      a length guard.'
    supported_by:
    - reference_id: PMID:27070352
      supporting_text: Despite multiple attempts, we were unable to obtain a specific antibody against
        SHLP5
