id: P51610
gene_symbol: HCFC1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Host cell factor 1 (HCF-1) is a predominantly nuclear, chromatin-associated transcriptional
  coregulator. Its N-terminal Kelch domain binds transcription factors and other regulatory
  proteins, while HCF-1 scaffolds the recruitment and coordination of chromatin-modifying complexes,
  including SET1/MLL histone methyltransferase and SIN3 histone deacetylase complexes. Depending
  on the promoter and interacting factors, it supports transcriptional activation or repression,
  including regulation of cell-cycle gene expression. O-GlcNAc transferase (OGT) initiates processing
  at central HCF repeats by glycosylating a glutamate residue, leading to pyroglutamate formation
  and peptide-bond cleavage. The resulting N- and C-terminal products usually remain associated;
  human-cell studies distinguish N-fragment functions in G1/S progression from C-fragment functions
  in mitotic exit and cytokinesis. During herpes simplex virus infection, HCF-1 supports VP16-dependent
  immediate-early gene transcription.
