core_functions:
- description: Coordinates promoter-specific transcription by binding DNA-binding transcription
    factors and scaffolding chromatin-regulatory complexes. Recruitment of SET1/MLL-associated
    machinery supports activation of E2F-responsive cell-cycle genes, while interactions with
    repressive regulators support context-dependent transcriptional repression.
  molecular_function:
    id: GO:0003712
    label: transcription coregulator activity
  directly_involved_in:
  - id: GO:0006355
    label: regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:12670868
    supporting_text: 'HCF-1 tethers the

      Sin3 and Set1/Ash2 transcriptional regulatory complexes together'
  - reference_id: PMID:17612494
    supporting_text: 'coactivator properties when bound to

      the E2F1 activator and corepressor properties when bound to the E2F4 repressor.'
  - reference_id: PMID:26416877
