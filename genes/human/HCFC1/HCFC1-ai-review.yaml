      factors, including THAP11 and ZNF143, and transcriptional coregulators.'
functional_isoforms:
- id: HCFC1_N_TERMINAL_PRODUCTS
  name: HCF-1 N-terminal proteolytic products
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000016611
    - PRO_0000016612
    - PRO_0000016613
    - PRO_0000016614
    - PRO_0000016615
    - PRO_0000016616
  description: Grouped N-terminal proteolytic products generated from the HCFC1 precursor at
    alternative central HCF repeats. The N-terminal Kelch domain binds HCF-binding motifs in
    transcription factors and coregulators, and adjacent regions recruit chromatin regulators.
    Human HeLa depletion/rescue experiments support N-fragment functions in G1 progression and
    S-phase entry (PMID:12743030). These experiments used an engineered HCF-1N1011 construct;
    they do not establish identical activity for every mapped native chain. The products usually
    remain associated with complementary C-terminal products.
- id: HCFC1_C_TERMINAL_PRODUCTS
  name: HCF-1 C-terminal proteolytic products
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000016617
    - PRO_0000016618
    - PRO_0000016619
    - PRO_0000016620
    - PRO_0000016621
    - PRO_0000016622
  description: Grouped C-terminal proteolytic products generated from the HCFC1 precursor at
    alternative central HCF repeats. Human HeLa depletion/rescue experiments support a C-fragment
    role in proper mitotic exit and cytokinesis (PMID:12743030); proteolytic maturation is important
    for this function (PMID:21295698). The rescue experiments used an engineered HCF-1C600 construct,
    not a separate functional test of every mapped native chain. These fragments usually remain
    associated with complementary N-terminal products. OGT-dependent glutamate glycosylation
    triggers cleavage; this does not establish autonomous HCFC1 protease activity.
suggested_questions:
- question: Can primary full text and annotation provenance resolve the three localization contexts
    citing PMID:20091349, without guessing a replacement identifier?
- question: Can original interaction tables resolve WDR5 in PMID:15960975, CREB3/CREBZF isoforms
    in PMID:18391022, and WDR5/DIDO1/ASH2L in PMID:24981860?
- question: Do the membrane proteomics and cadherin proximity results establish HCFC1-specific
    residence or direct binding beyond the currently accessible evidence?
- question: Which native N/C cleavage-product pairs support distinct cell-cycle functions in
    human cells, beyond the engineered rescue fragments, and how do the four splice products
    affect those roles?
suggested_experiments:
- hypothesis: Different native N/C processing products can differ in recruitment or cell-cycle
    function despite sharing the same interaction architecture.
  description: Compare endogenous HCFC1 processing products with matched expression, nuclear
    localization and partner recruitment in human cells; use selective perturbations and rescue
    that distinguish cleavage-product identity from global OGT effects.
  experiment_type: Endogenous fragment-resolved perturbation and rescue
