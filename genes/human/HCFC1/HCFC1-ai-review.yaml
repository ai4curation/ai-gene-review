  review:
    summary: The original reporter experiment uses the human E2F4 activation region fused to
      a GAL4 DNA-binding domain in hamster tsBN67 cells.
    action: MODIFY
    reason: The original reporter experiment uses the human E2F4 activation region fused to
      a GAL4 DNA-binding domain in hamster tsBN67 cells. It supports HCF1-dependent activation
      in that engineered context, not constitutive activation by endogenous full-length E2F4.
      Human E2F studies separately establish HCF1-associated E2F4 repression. Refine to transcription
      coregulator activity to preserve both documented contexts without assigning a single direction
      to every E2F4 interaction.
