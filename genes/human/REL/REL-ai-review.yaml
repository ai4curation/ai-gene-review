description: REL encodes c-Rel, a Rel-homology-domain NF-kappaB transcription factor subunit. c-Rel binds kappaB cis-regulatory DNA as homodimers and as heterodimers with p50, p52 or p65 and contributes transactivation activity to nuclear NF-kappaB complexes that regulate immune and inflammatory RNA polymerase II target genes.
