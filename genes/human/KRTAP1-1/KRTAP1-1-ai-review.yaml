    label: keratin filament
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR002494
  review:
    summary: InterPro2GO annotation from the KAP/keratin-matrix domain signature placing the protein with keratin filaments.
    action: ACCEPT
    reason: KAPs are deposited in the interfilamentous matrix surrounding hair keratin intermediate filaments and are covalently cross-linked to them, so keratin filament is the most specific GO location for the matrix in which KRTAP1-1 functions. Strictly the KAP matrix lies between filaments rather than in the filament core, but GO has no separate term for the keratin-associated matrix.
