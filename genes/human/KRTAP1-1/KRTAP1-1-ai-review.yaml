    - reference_id: file:human/KRTAP1-1/KRTAP1-1-deep-research-openscientist.md
      supporting_text: it is a matrix protein of the hair-shaft cortex that becomes extensively disulfide (cystine) cross-linked to hard keratin intermediate filaments (IFs) and to neighbouring KAPs
- term: &id002
    id: GO:0030281
    label: structural constituent of cutaneous appendage
  evidence_type: TAS
  original_reference_id: PMID:16939781
  review:
    summary: Proposed structural molecular function for KRTAP1-1 as a hair keratin-associated matrix protein.
    action: NEW
    reason: Keratin-associated proteins are the structural matrix proteins of the hair fibre that stabilise it by disulfide cross-linking with hair keratins. Structural constituent of cutaneous appendage (GO:0030281; contributes to the structural integrity of hairs) is the specific GO MF for this role. Related paralogues receive only the generic structural molecule activity by IEA.
    supported_by:
    - *id001
    - reference_id: PMID:29391282
      supporting_text: KAPs are the major constituent of the matrix between the hair keratin intermediate filaments (IFs), and stabilise hair structure by extensive disulfide bonding.
    - reference_id: PMID:18721477
      supporting_text: 'KRTAP contains two major groups: high/ultrahigh cysteine (HS) and high glycine-tyrosine (HGT) that are considered to have originated independently, and are essential for the formation of rigid and resistant hair shafts through their extensive disulfide bond cross-linking with the abundant cysteine residues of hair keratins or hydrophobic interactions with keratins [23,26-28].'
    - reference_id: file:human/KRTAP1-1/KRTAP1-1-deep-research-openscientist.md
      supporting_text: it is a matrix protein of the hair-shaft cortex that becomes extensively disulfide (cystine) cross-linked to hard keratin intermediate filaments (IFs) and to neighbouring KAPs
