id: Q07627
gene_symbol: KRTAP1-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Keratin-associated protein 1-1 (KAP1.1, historically hKAP1.1B, with size alleles hKAP1.1A, KAP1.6 and KAP1.7) is a 177-residue high-sulfur keratin-associated protein of the KAP1 family, encoded in the KRTAP cluster embedded in the type I keratin locus on chromosome 17q21. Its central domain is built from tandem cysteine-rich pentapeptide repeats whose number varies between alleles. KAP1 proteins are synthesised in the keratogenous zone of the middle and upper hair cortex, where they form part of the interfilamentous matrix that surrounds the trichocyte keratin intermediate filaments. Through extensive intermolecular disulfide bonds with the cysteine-rich head and tail domains of hair keratins, the matrix cross-links the filaments into the rigid, chemically resistant hair shaft. The ovine orthologue is a wool fibre protein and is used as a wool-trait marker gene.
