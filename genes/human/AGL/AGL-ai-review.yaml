id: P35573
gene_symbol: AGL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AGL (glycogen debranching enzyme, GDE) is a large bifunctional enzyme that removes glycogen branch points
  during cytosolic glycogenolysis. Its GH13 transferase region transfers a short alpha-1,4-linked glucan
  segment to another chain, leaving one glucose attached at the branch point. Its GH133 glucosidase region
  then hydrolyses that alpha-1,6 linkage to release free glucose, allowing glycogen phosphorylase to continue
  degradation. Glycogen binding helps position and stabilize the enzyme. The two catalytic activities
  reside in the same polypeptide; purified human AGL can form both monomers and dimers. AGL is also detected
  in nuclear compartments, whose physiological contribution is less well defined. Biallelic loss of AGL
  function causes glycogen storage disease type III (Cori or Forbes disease), with accumulation of glycogen
  bearing short outer chains and variable liver, skeletal-muscle and cardiac involvement.
