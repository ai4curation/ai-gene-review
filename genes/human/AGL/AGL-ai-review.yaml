  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  review:
    summary: The donor experiment measures covalent ubiquitination of Agl.
    action: REMOVE
    reason: GO:0031593 means binding a target protein upon its polyubiquitination. In PMID:17908927
      Figures 1F and 4, tagged Agl was immunoprecipitated after SDS denaturation and boiling, and
      anti-ubiquitin detected covalent modification of Agl itself. The full source therefore
      supports Agl as a ubiquitination substrate, rather than the molecular recognition asserted by
      this propagated term.
    additional_reference_ids:
    - PMID:17908927
    supported_by:
