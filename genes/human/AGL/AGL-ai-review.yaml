proposed_new_terms: []
suggested_questions:
- question: What physiological conditions control human AGL monomer-dimer exchange, and how does
    oligomerization affect the two catalytic steps?
- question: Does endogenous human AGL execute a distinct nuclear function, and what evidence
    resolves its specific granule-lumen and extracellular assignments?
- question: Does AGL directly participate in glycogen formation or branching correction during
    synthesis, beyond its established work in glycogen breakdown?
suggested_experiments:
- description: Measure both catalytic activities in purified human monomeric and dimeric fractions
    under matched substrate conditions, and test whether the assembly distribution persists in
    native cells.
- description: Use endogenous AGL detection and controlled fractionation to distinguish nuclear,
    SR-associated and granule-luminal pools, with topology and release assays for the neutrophil
    assignments.
