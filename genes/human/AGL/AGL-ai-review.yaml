        source_status: SOURCE_BAD
        comment: MGI links the mouse source annotation to PMID:17908927. Its denaturing
          immunoprecipitation assay tests ubiquitination of Agl, not Agl binding to a protein
          conditional on that partner being polyubiquitinated.
      failure_modes:
      - ROLE_CONFLATION
