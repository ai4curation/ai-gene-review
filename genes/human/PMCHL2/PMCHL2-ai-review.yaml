id: Q9BQD1
gene_symbol: PMCHL2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PMCHL2 (5q13.2) is a hominid-specific locus, classified by HGNC as a pseudogene. It arose
  5-10 million years ago by duplication of a roughly 92 kb segment of chromosome 5p14 that
  contains the chimeric PMCHL1 gene, itself a retrocopy of the pro-melanin-concentrating
  hormone gene PMCH. Like PMCHL1, it is a 5'-truncated copy of PMCH: it lacks the region
  encoding the PMCH signal peptide and N-terminal pro-region, but retains sequence
  corresponding to the C-terminal NGE-, NEI- and MCH-peptide segments, with amino-acid
  substitutions. PMCHL2 is not transcribed in the brain. Spliced transcripts, using a
  PMCHL2-specific splice donor, are found only in testis and are less abundant than PMCHL1
  transcripts. The UniProt entry (86 aa) is a short ORF that begins with a lysine-rich putative
  nuclear localization signal instead of a secretory signal peptide. No protein product has been
  detected, and the PMCHL transcripts are proposed to act as mRNA-like noncoding RNAs. No
  function of a PMCHL2 protein has been demonstrated.
