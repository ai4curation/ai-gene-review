- id: PMID:9729295
  title: Antisense expression of the human pro-melanin-concentrating hormone genes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified (Brain Res 1998). Hypothalamic variant-locus transcripts are
      antisense and come from the 5p (PMCHL1) locus, not 5q (PMCHL2).
  findings:
  - statement: Brain variant-locus transcripts derive from PMCHL1, not PMCHL2.
    supporting_text: to be derived from the 5p (pMCHL1), not the 5q (pMCHL2) locus
- id: PMID:11070051
  title: 'Structure and expression of the variant melanin-concentrating hormone genes: only PMCHL1
    is transcribed in the developing human brain and encodes a putative protein.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Mol Biol Evol 2000). Abstract only in cache. Shows that PMCHL2
      is not expressed in fetal, newborn or adult brain, and that both variant genes are
      5'-truncated copies of PMCH.
  findings:
  - statement: PMCHL2 is not transcribed in human brain.
    supporting_text: we provided strong evidence for the expression of the PMCHL1 gene but not the
      PMCHL2 gene in the human fetal, newborn, and adult brains
- id: PMID:11181993
  title: Birth of two chimeric genes in the Hominidae lineage.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (Science 2001). Abstract only in cache. PMCHL2 cloned from
      testis (UniProt RN[1]); origin by segmental duplication of the PMCHL1 locus.
  findings:
  - statement: PMCHL2 arose by duplication of the PMCHL1 locus in hominids.
    supporting_text: PMCHL2 arose 5 to 10 Ma by an event of duplication involving a large chromosomal
      region encompassing the PMCHL1 locus
- id: PMID:19068116
  title: Primate-specific spliced PMCHL RNAs are non-protein coding in human and macaque tissues.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (BMC Evol Biol 2008), full text cached. Key paper. PMCHL2
      transcripts are found only in testis and use a gene-specific splice donor. Western blots with
      anti-VMCH-p8 antiserum (raised against the PMCHL1 N-terminal epitope; PMCHL2 differs at
      one position, KTKKK versus KPKKK) detected no protein in adult testis or in transfected
      HEK293 cells. Detection of PMCHL2-specific product is therefore slightly less direct than
      for PMCHL1.
  findings:
  - statement: PMCHL2 transcripts are restricted to testis.
    supporting_text: Thus, PMCHL1 transcripts are found in testis and fetal brain and are more abundant
      than PMCHL2 transcripts that are observed only in testis.
  - statement: No PMCHL protein is detected in expressing tissues.
    supporting_text: This strongly suggests that these putative proteins are not translated in vivo
      in the human and macaque tissues that we tested.
- id: file:human/PMCHL2/PMCHL2-bioinformatics/RESULTS.md
  title: Pairwise comparison of PMCHL2 (Q9BQD1) with parent pro-MCH (PMCH, P20382)
  findings:
  - statement: Q9BQD1 aligns only to PMCH 81-165 and lacks the PMCH signal peptide and N-terminal
      pro-region.
    supporting_text: PMCH residues 1-80 have no counterpart in Q9BQD1
suggested_questions:
- question: Should the PANTHER PTN002636265 IBD be blocked for subfamily PTHR12091:SF1 (PMCHL1/PMCHL2)?
    These are primate retrocopies lacking the PMCH signal peptide, with no detected protein.
- question: Is there any transcript-level support for the specific 86-aa Q9BQD1 model, given that
    PMCHL2 RNAs are testis-restricted and use a PMCHL2-specific splice donor (exon 3b2)?
suggested_experiments:
- description: Search testis ribosome-profiling and deep proteomics datasets for PMCHL2-specific
    peptides (distinguishable from PMCHL1 and PMCH at positions such as T6 (P6 in PMCHL1) and the MCH-like
    segment) to establish whether any PMCHL2 product is translated.
  experiment_type: ribosome profiling / targeted mass spectrometry
