- term:
    id: GO:0030354
    label: melanin-concentrating hormone activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005456
  review:
    summary: InterPro2GO mapping of hormone activity onto a 5'-truncated, signal-peptide-less copy
      of the PMCH C-terminal region with no detected protein.
    action: REMOVE
    reason: >-
      MCH activity requires a mature cyclic MCH peptide released from pro-MCH in the secretory
      pathway. PMCHL2, like PMCHL1, is a 5'-truncated version of the MCH gene (PMID:11070051).
      The putative 86-aa product aligns only to PMCH 81-165 and lacks the signal peptide. Its
      MCH-like segment is substituted at three positions (M150T, R160Q, P161R in PMCH numbering),
      although the disulfide cysteines are retained (PMCHL2-bioinformatics/RESULTS.md). The
      transcripts are restricted to testis, and no protein has been detected (PMID:19068116). A
      peptide that cannot be secreted cannot act as a hormone, whether or not its cysteines are
      conserved.
    supported_by:
    - reference_id: PMID:11070051
      supporting_text: They correspond to a 5'-end truncated version of the MCH gene mapped on chromosome
        12q23 and encoding a neuropeptide precursor.
    - reference_id: file:human/PMCHL2/PMCHL2-bioinformatics/RESULTS.md
      supporting_text: 'MCH region (PMCH 147-165): M150->T71, R160->Q81, P161->R82'
    - reference_id: PMID:19068116
      supporting_text: Western blot analyses of human and macaque tissues expressing PMCHL RNA failed
        to reveal any protein corresponding to VMCH-p8 and protein variants encoded by spliced transcripts.
- term:
    id: GO:0031777
    label: type 1 melanin-concentrating hormone receptor binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002636265
  - RGD:3358
  review:
    summary: Phylogenetic inheritance of MCHR1 ligand binding from the euteleost pro-MCH node onto
      a hominid duplicate of a truncated PMCH retrocopy that encodes no secreted precursor and
      has no detected protein.
    action: REMOVE
    reason: >-
      The IBD at PTN002636265 (taxon Euteleostomi, seeded by rat Pmch, RGD:3358) is sound for
      PMCH orthologs. PMCHL2 descends from that node only indirectly. It is a duplicate of
      PMCHL1 (PMID:11181993), which is a primate retrocopy of a PMCH transcript, and PANTHER
      places both in their own subfamily (PTHR12091:SF1). The copy has lost what the function
      depends on: the signal peptide and N-terminal pro-region are absent (PMCH 1-80), and the
      MCH-like segment is substituted. The locus is an HGNC pseudogene that is not expressed in
      brain (PMID:11070051). No PMCHL protein was detected in testis or in transfected HEK293
      cells (PMID:19068116). The inherited ligand function should not apply.
    supported_by:
    - reference_id: PMID:11181993
      supporting_text: PMCHL2 arose 5 to 10 Ma by an event of duplication involving a large chromosomal
        region encompassing the PMCHL1 locus
    - reference_id: PMID:19068116
      supporting_text: Even though high levels of ORF1-bearing PMCHL1/2 transcripts were detected
        by RT-PCR, no signal corresponding to the VMCH-p8 protein could be detected (data not shown).
    - reference_id: file:human/PMCHL2/PMCHL2-bioinformatics/RESULTS.md
      supporting_text: PMCH residues 1-80 have no counterpart in Q9BQD1
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN002636265
        source_label: PTN002636265
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IBD at Euteleostomi pro-MCH node (seed RGD:3358 rat Pmch) is sound for PMCH
          orthologs; PTHR12091:SF1 (PMCHL1/PMCHL2) is a truncated, signal-peptide-less primate
          retrocopy lineage that should be excluded from this node's propagation.
      residue_claims_not_applicable: The defect is the absence of a whole region (PMCH 1-80,
        including the 1-21 signal peptide) rather than a point-residue substitution; MCH-segment
        substitutions are recorded in RESULTS.md but receptor-binding consequences are untested.
