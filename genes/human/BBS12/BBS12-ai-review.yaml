taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BBS12 is a divergent type II chaperonin-like protein that participates in the assembly
  of the BBSome, a complex that controls membrane-protein trafficking at cilia. BBS12 associates
  with MKKS/BBS6, BBS7 and CCT/TRiC proteins in assembly machinery whose formation is regulated by
  BBS10. These interactions support the stability and incorporation of BBSome subunits, including
  BBS2 and BBS7. BBS12 dissociates during assembly and is not a subunit of the mature BBSome. It
  has been detected at ciliary basal bodies in human cell models. Its relationship to canonical chaperonins
  does not establish independent nucleotide-driven folding activity. Biallelic pathogenic variants
  cause Bardet-Biedl syndrome type 12, a ciliopathy affecting retinal, renal and other tissues.
