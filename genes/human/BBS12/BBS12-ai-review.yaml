gene_symbol: BBS12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BBS12 is a divergent type II chaperonin-like protein that participates
  in BBSome assembly. It associates with MKKS/BBS6, BBS10, BBS7 and CCT/TRiC proteins
  in machinery that stabilizes assembly intermediates and supports incorporation of
  BBSome subunits. BBS12 is released as assembly proceeds. The mature BBSome contains
  BBS1, BBS2, BBS4, BBS5, BBS7, TTC8/BBS8, BBS9 and BBIP1 and controls membrane-protein
  trafficking at cilia. BBS12 has a cytoplasmic pool and localizes to ciliary basal
  bodies in human cell models. Biallelic pathogenic variants cause Bardet-Biedl syndrome
  type 12, with variable retinal degeneration, obesity, polydactyly, renal abnormalities
  and hypogenitalism.
