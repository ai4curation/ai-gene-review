core_functions:
- description: Participates in BBSome assembly through the BBS-chaperonin machinery.
    Association with MKKS/BBS6, BBS7 and CCT proteins, together with BBS12 depletion
    experiments, links BBS12 to stabilization of assembly intermediates and subsequent
    incorporation of BBSome subunits. BBS12 is released as assembly proceeds. These
    experiments establish an assembly role but do not resolve an independent folding
    activity or the contribution of nucleotide binding by BBS12 itself.
  directly_involved_in:
  - id: GO:0051131
    label: chaperone-mediated protein complex assembly
  supported_by:
  - reference_id: PMID:22500027
    supporting_text: Reduction of each of these proteins greatly decreases BBS2 protein
      levels.
  knowledge_gaps:
  - gap_statement: The molecular activity performed by BBS12 in BBSome assembly, and
      whether that activity depends on nucleotide binding, remains unresolved by the
      reviewed experiments.
    boundary: Assembly and partner-association experiments support BBS12's participation
      in the BBS-chaperonin machinery. Published sequence comparisons describe divergence
      of nucleotide-related motifs, but they do not measure human BBS12 binding or
      hydrolysis of ATP or distinguish direct folding from assembly assistance.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    resolution: Reconstitute defined human BBS12-containing assemblies and measure
      nucleotide binding, hydrolysis, substrate conformation and complex assembly
      separately, with controls for CCT activity and the stability of BBS12 constructs.
suggested_questions:
- question: Which physical step does BBS12 perform during BBS7 engagement and release
    from the BBS-chaperonin machinery, and can it be separated from the contributions
    of MKKS/BBS6 and CCT proteins?
- question: Does human BBS12 bind a nucleotide under physiological conditions, despite
    divergence of the motifs identified in comparative sequence studies, and does
    nucleotide occupancy affect assembly?
- question: How does the ciliary defect caused by BBS12 depletion alter the adipogenic
    behavior of human mesenchymal stem cells?
suggested_experiments:
- hypothesis: BBS12 makes a specific assembly contribution that can be measured independently
    of the ATP-dependent folding activity of CCT.
  description: Reconstitute BBS12 with defined combinations of MKKS/BBS6, BBS7, BBS10
    and CCT. Compare substrate conformation, complex formation and subunit release
    while directly measuring nucleotide binding and hydrolysis by the individual proteins
    and complete assemblies.
  experiment_type: biochemical reconstitution
- hypothesis: Some disease-associated interaction defects arise from reduced BBS12
    stability rather than loss of a particular partner contact.
  description: Compare verified BBS12 variants at matched protein abundance and folding
    state before measuring association with MKKS/BBS6 and BBS7 and assessing BBSome
    assembly and ciliary phenotypes in cells.
  experiment_type: controlled structure-function analysis
