- id: file:human/BBS12/BBS12-deep-research-falcon.md
  title: Falcon deep research report for BBS12
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Preserved LLM-generated lead map, with primary evidence assessed
      separately. Assembly and intermediate-stability claims are supported independently
      by PMID:20080638 and PMID:22500027; basal-body localization is checked against
      PMID:19190184. The report's vertebrate-only origin is superseded by PMID:24010126.
      Its absolute absence-from-axoneme claim, absent intrinsic nucleotide activity
      and assignment of a substrate-binding/folding mechanism to BBS12 are not established
      by those primary studies. Downstream signaling-pathway assignments, variant
      totals, prevalence percentages and other quantitative claims are not adopted.
      The report remains MEDIUM/UNVERIFIED rather than direct evidence for these claims.
- id: PMID:19190184
  title: Transient ciliogenesis involving Bardet-Biedl syndrome proteins is a fundamental
    characteristic of adipogenic differentiation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official primary abstract and selected complete cached localization
      and RNAi Results paragraphs were read. They describe endogenous BBS12 basal-body
      localization in human primary renal proximal tubular epithelial cells and differentiating
      preadipocytes, and reduced ciliogenesis after depletion. No microscopy images
      or localization-specific supplements were re-scored. This supports a specific
      location without asserting exclusivity or absence from the axoneme.
- id: PMID:24010126
  title: Ancient Origin of Chaperonin Gene Paralogs Involved in Ciliopathies.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official identity, abstract and selected complete motif Results/Discussion
      paragraphs were checked. The authors compare non-vertebrate sequences and explicitly
      relate BBS12 binding-site divergence to earlier vertebrate findings. This challenges
      a fold-based ATP-binding inference without directly measuring human BBS12 ATP
      binding or hydrolysis. No new sequence or phylogenetic analysis was performed.
- id: PMID:40914337
  title: Truncating mutations in BBS10 and BBS12 impair proteostasis and ciliary architecture
    in Bardet-Biedl Syndrome.
  findings:
  - statement: The complete abstract reports variant-dependent BBS10/BBS12 instability
      and altered partner association/ciliary length in transfected human-cell models;
      it does not establish autonomous BBS12 nucleotide or protein-folding activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official PubMed identity, DOI10.1016/j.exer.2025.110626 and complete
      abstract checked. Transfected human HEK293T and hTERT-RPE1 experiments concern
      BBS10/BBS12 variant stability, partner association and ciliary architecture.
      The publisher full-text request returned403, so complete Methods/Results, figures
      and construct controls were not inspected. Primary-cilium localization does
      not distinguish basal body from shaft and no nucleotide/folding assay is established.
  full_text_unavailable: true
