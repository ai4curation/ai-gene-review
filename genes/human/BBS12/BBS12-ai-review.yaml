  review:
    summary: The InterPro ATP-binding inference is uncertain for this divergent chaperonin-like
      protein.
    action: UNDECIDED
    reason: The InterPro inference is weakened by published divergence of the BBS12
      nucleotide-binding region, including the ATP-contacting GP motif. PMID:24010126
      relates its non-vertebrate comparison explicitly to divergence previously reported
      in vertebrate orthologs. This is relevant to BBS12, but sequence divergence
      does not determine whether human BBS12 retains ATP binding. Binding and hydrolysis
      are distinct activities; the reviewed studies do not directly measure either
      for human BBS12. The activity remains unresolved.
