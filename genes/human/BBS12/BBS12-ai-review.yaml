  title: Intrinsic protein-protein interaction-mediated and chaperonin-assisted sequential
    assembly of stable bardet-biedl syndrome protein complex, the BBSome.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and selected complete cached assembly/stability
      Results and Discussion passages were read. BBS12 depletion reduces BBS2 protein
      levels, and BBS12 is released as BBSome core assembly proceeds. BBS10 regulation
      and Bbs6/Bbs7 protease-sensitivity experiments are distinguished from BBS12
      evidence. No complete-paper, image or supplementary-record audit is claimed.
