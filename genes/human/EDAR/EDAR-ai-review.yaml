id: Q9UNE0
gene_symbol: EDAR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EDAR is a single-pass cell-surface receptor for the EDA-A1 form of ectodysplasin. Its extracellular
  region recognizes the ligand, while its intracellular death domain couples receptor activation to adaptor-dependent
  signaling, including NF-kappaB activation. This signaling helps organize the development of ectodermal
  appendages, including teeth, hair and sweat glands. Pathogenic EDAR variants cause hypohidrotic ectodermal
  dysplasia.
alternative_products:
- name: '1'
  id: Q9UNE0-1
  description: 448-amino-acid displayed precursor. The signal peptide is cleaved; this processing does
    not create an additional splice isoform.
- name: '2'
  id: Q9UNE0-2
  sequence_note: VSP_054187
  description: 480-amino-acid product in which Ala219 of the displayed sequence is replaced by a 33-residue
    segment in the cytoplasmic region. The sequence difference is established; equivalent ligand responses,
    trafficking and downstream signaling have not been demonstrated by the inspected studies.
