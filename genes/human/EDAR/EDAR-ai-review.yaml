      target-specific corroboration beyond a shared-family mapping. Retain this signaling output as non-core
      while endogenous ligand, expression and tissue conditions remain less resolved than the central
      NF-kappaB mechanism. No XEDAR-specific assay is silently reassigned to EDAR.
    supported_by:
