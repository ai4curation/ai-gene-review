core_functions:
- description: Receives the extracellular EDA-A1 signal and transmits it across the plasma membrane to
    intracellular signaling machinery, promoting canonical NF-kappaB signaling. Ligand recognition and
    signal transmission constitute one cytokine-receptor function.
  molecular_function:
    id: GO:0004896
    label: cytokine receptor activity
  directly_involved_in:
  - id: GO:0019221
    label: cytokine-mediated signaling pathway
  - id: GO:0043123
    label: positive regulation of canonical NF-kappaB signal transduction
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:11039935
  - reference_id: PMID:11035039
  - reference_id: file:human/EDAR/EDAR-uniprot.txt
suggested_questions:
- question: Does the longer EDAR product differ from the displayed product in trafficking, ligand responsiveness
    or recruitment of signaling adaptors?
- question: Under which endogenous expression and ligand conditions does EDAR activate JNK or cell death,
    and how do those outputs relate to its developmental NF-kappaB function?
suggested_experiments:
- description: Compare sequence-verified EDAR products in an EDAR-deficient epithelial system using matched
    expression and surface abundance, measuring EDA-A1 binding, NF-kappaB signaling and adaptor recruitment.
- description: Test ligand-dependent signaling at endogenous EDAR abundance in ectodermal organoid models,
    distinguishing developmental responses from cell death observed after receptor overexpression.
