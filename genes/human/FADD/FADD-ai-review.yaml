core_functions:
- description: FADD bridges death-domain receptor platforms to CASP8/CASP10-containing DED assemblies to form 
    death-inducing signaling complexes that initiate extrinsic apoptotic signaling.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0008625
    label: extrinsic apoptotic signaling pathway via death domain receptors
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  in_complex:
    id: GO:0031264
    label: death-inducing signaling complex
  supported_by:
  - *id011
  - *id012
  - *id013
  - *id014
proposed_new_terms: []
suggested_questions:
- question: Should FADD annotations to broad lymphoid-organ, T-cell, and antiviral phenotypes be collapsed into a small 
    set of curated adaptor activities plus GO-CAM inputs for FAS, TRAIL, TNFR1, MAVS, and TLR/ripoptosome complexes?
  experts: []
- question: Should GO distinguish receptor-proximal death-inducing signaling complexes from cytosolic complex-II and 
    ripoptosome variants more explicitly for FADD, CASP8, CFLAR, TRADD, and RIPK1 annotations?
  experts: []
suggested_experiments:
- description: For generic FADD interaction partners that remain in IntAct-only protein-binding imports, perturb the 
    interaction surface in endogenous FADD and assay receptor-proximal DISC assembly, CASP8 recruitment, CASP8 
    activation, and death-receptor apoptosis before making partner-specific GO annotations.
