id: Q13158
gene_symbol: FADD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'FADD is a cytosolic death-fold adaptor that couples activated death receptors to initiator caspase assemblies.
  Its C-terminal death domain binds receptor or receptor-associated death domains at FAS, TRAIL, and TNFR1 signaling platforms,
  while its N-terminal death effector domain recruits and oligomerizes CASP8, CASP10, and CFLAR-family partners to form death-inducing
  signaling complexes and related cytosolic complexes. Through this scaffold role, FADD initiates extrinsic apoptotic signaling,
  contributes to RIPK1/caspase-8 ripoptosome decisions between apoptosis and necroptosis, and has a secondary adaptor role
  in MAVS/RIG-I-like receptor antiviral signaling.'
