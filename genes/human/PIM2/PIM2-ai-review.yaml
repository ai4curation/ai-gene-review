  label: Homo sapiens
description: 'PIM2 encodes a constitutively active PIM-family serine/threonine kinase that phosphorylates
  regulators of survival and proliferation, including BAD, CDKN1A/p21, CDKN1B/p27 and MYC-linked targets.
  PIM2 functions as a soluble kinase in growth and survival signaling, with evidence for anti-apoptotic,
  protein-stabilizing and NF-kappaB/autophagy outputs in selected mammalian contexts.'
