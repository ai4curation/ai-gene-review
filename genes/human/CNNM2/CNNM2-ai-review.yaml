gene_symbol: CNNM2
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CNNM2 is a multipass membrane protein that controls cellular and systemic magnesium balance.
  It is present at basolateral membranes of renal tubules, where its dysfunction causes renal magnesium
  wasting, and is also expressed in the nervous system. CNNM2 supports magnesium export and interacts
  with the TRPM7 channel to regulate divalent-cation entry. Its cytoplasmic tandem CBS domain binds Mg–ATP
  and regulatory partners including ARL15 and PRL phosphatases; these interactions link magnesium handling
  to changes in protein conformation and channel activity. The mechanism of autonomous human magnesium
  translocation remains unresolved. Pathogenic variants can cause hypomagnesemia with seizures and neurodevelopmental
  impairment.
