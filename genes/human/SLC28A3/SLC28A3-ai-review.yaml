core_functions:
- description: Concentrative (inwardly directed), Na+-coupled symport of broadly selective
    nucleosides - both purine (adenosine, guanosine, inosine) and pyrimidine (uridine,
    cytidine, thymidine) nucleosides - across the plasma membrane, with a 2 Na+ to 1
    nucleoside stoichiometry. This is the cib/N3 nucleoside transport system and drives
    cellular nucleoside salvage and homeostasis.
  molecular_function:
    id: GO:0005415
    label: nucleoside:sodium symporter activity
  directly_involved_in:
  - id: GO:1901642
    label: nucleoside transmembrane transport
  - id: GO:0015860
    label: purine nucleoside transmembrane transport
  - id: GO:0015864
    label: pyrimidine nucleoside transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  substrates:
  - id: CHEBI:16335
    label: adenosine
  - id: CHEBI:16704
    label: uridine
  - id: CHEBI:17562
    label: cytidine
  supported_by:
  - reference_id: file:human/SLC28A3/SLC28A3-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Sodium-dependent, pyrimidine- and purine-selective
  - reference_id: file:human/SLC28A3/SLC28A3-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Employs a 2:1 sodium/nucleoside ratio
  - reference_id: Reactome:R-HSA-109538
    supporting_text: The plasma membrane-associated protein SLC28A3 mediates the transport of
      one molecule of adenosine, cytidine, guanosine, inosine, thymidine, or uridine, and two
      sodium ions, from the extracellular space to the cytosol.
proposed_new_terms: []
suggested_questions:
- question: CNT3 has been reported to couple nucleoside transport to H+ as well as Na+ (and
    to show a shifted stoichiometry at acidic pH). Should a proton-coupled nucleoside
    symporter molecular function and/or a proton transmembrane transport process be annotated
    in addition to the Na+-coupled terms?
- question: Galectin-4 (LGALS4) binds the hCNT3 N-terminal domain and regulates its
    trafficking/plasma-membrane retention, and RS1 down-regulates CNT3 surface localization.
    What specific molecular-adaptor or regulatory GO terms (rather than bare protein binding)
    best capture these regulatory interactions?
- question: GO:0015389 (pyrimidine- and adenosine-specific:sodium symporter activity) is
    mis-placed in the GO graph under the nucleobase-transport hierarchy (its is_a/part_of
    ancestors include GO:0005345, GO:0005350, GO:1904823 and GO:0015855), whereas the sibling
    GO:0015390 has no nucleobase ancestors. Should GO:0015389 be relocated under the
    nucleoside-transport hierarchy so that annotating a nucleoside:sodium symporter no longer
    entails free-nucleobase transport?
suggested_experiments:
- description: Quantify the relative in vivo contribution of the plasma-membrane isoform 1
    versus the ER-retained hCNT3ins isoform 2 to intracellular nucleoside salvage, e.g. by
    isoform-specific knockdown and metabolic-flux measurement of nucleoside pools.
- description: Resolve the cation-coupling stoichiometry of hCNT3 under physiological versus
    acidic pH (two-electrode voltage clamp / charge-flux measurements) to define whether and
    when it operates as a Na+/H+-coupled versus strictly Na+-coupled symporter.
