- term:
    id: GO:0005345
    label: purine nucleobase transmembrane transporter activity
  evidence_type: NAS
  original_reference_id: PMID:22492015
  qualifier: enables
  review:
    summary: NAS (ARUK-UCL) assertion that CNT3 is a purine nucleobase transporter, citing
      the RS1-regulation paper.
    action: REMOVE
    reason: CNT3 is nucleoside-specific and does NOT transport free nucleobases. Yao et al.
      directly tested hCNT1, hCNT2 and hCNT3 against a panel of purine and pyrimidine
      nucleobases in Xenopus oocytes and found no nucleobase uptake above water-injected
      controls, concluding the hCNTs are nucleoside-specific. The cited reference
      (PMID:22492015) is about RS1-mediated trafficking regulation and does not assay or
      support nucleobase transport. This MF (nucleobase, not nucleoside) is contradicted by
      direct experiment and should be removed; a WRONG_TERM source defect is recorded
      (the likely intended term is a purine nucleoside transporter activity).
    supported_by:
    - reference_id: PMID:21795683
      supporting_text: Unlike hENTs, therefore, hCNTs were demonstrated to lack nucleobase
        transport activities and to be nucleoside-specific.
    source_defects:
    - defect_type: WRONG_TERM
      resource: ARUK_UCL
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0005345
      corrected_value: GO:0015390
      corrected_label: purine-specific nucleoside:sodium symporter activity
      cause: LABEL_WITHOUT_DEFINITION
      confidence: CONFIRMED
      explanation: SLC28A3/CNT3 transports purine and pyrimidine nucleosides, not free
        nucleobases. Yao et al. 2011 (PMID:21795683) tested hCNT1/2/3 against purine and
        pyrimidine nucleobases and showed no nucleobase transport, concluding the hCNTs are
        nucleoside-specific. The "purine nucleobase transmembrane transporter activity"
        (GO:0005345) NAS annotation (cited to PMID:22492015, a trafficking paper that does
        not assay nucleobase transport) appears to be a nucleoside-vs-nucleobase slip and
        should be re-pointed to a purine nucleoside transporter activity (e.g. GO:0015390).
      supported_by:
      - reference_id: PMID:21795683
        supporting_text: Human concentrative nucleoside transporters hCNT1, hCNT2, and hCNT3,
          in contrast, did not transport nucleobases and thus should be considered
          nucleoside-specific.
