    reason: This is an incorrect automated inter-ontology mapping. The source molecular
      function GO:0015389 is a pyrimidine- and adenosine-specific NUCLEOSIDE symporter; the
      logically inferred process should be pyrimidine NUCLEOSIDE transport, not pyrimidine
      NUCLEOBASE transport. CNT3 is nucleoside-specific and does not transport free
      nucleobases (Yao et al. 2011 tested hCNT1/2/3 and found no nucleobase uptake). The
