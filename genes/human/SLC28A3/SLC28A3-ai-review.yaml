id: Q9HAS3
gene_symbol: SLC28A3
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC28A3 (concentrative nucleoside transporter 3, CNT3/hCNT3) is a polytopic
  plasma membrane protein of the SLC28/CNT family (TC 2.A.41) that mediates sodium-coupled,
  concentrative (inwardly directed) uptake of nucleosides. Unlike the pyrimidine-preferring
  CNT1 and purine-preferring CNT2, CNT3 is broadly selective, transporting both purine
  and pyrimidine nucleosides (adenosine, guanosine, inosine, cytidine, thymidine, uridine)
  with a 2 Na+ to 1 nucleoside stoichiometry, corresponding to the cib/N3 nucleoside transport
  system; it can also use H+ as a coupling cation. The cryo-EM structure shows a homotrimer
  of 11-TM-helix subunits with two reentrant hairpin regions forming the translocation
  pathway. By importing physiological nucleosides it contributes to nucleoside salvage and
  nucleoside homeostasis, and because many nucleoside-analog drugs are substrates it is a
  determinant of the cellular uptake and pharmacology of anticancer and antiviral agents
  (gemcitabine, cladribine, fludarabine, AZT, ribavirin, thiopurines such as 6-mercaptopurine).
  It is expressed in many tissues, with apical (brush-border) localization in intestinal and
  renal epithelia. An alternatively spliced isoform lacking the N-terminal 69 residues
  (hCNT3ins) is retained in the endoplasmic reticulum membrane while retaining transport
  activity.
