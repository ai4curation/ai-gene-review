- term:
    id: GO:0006805
    label: xenobiotic metabolic process
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9748784
  qualifier: involved_in
  review:
    summary: Reactome Drug ADME - CNT3 as a drug-uptake transporter.
    action: MARK_AS_OVER_ANNOTATED
    reason: CNT3 transports many xenobiotic nucleoside-analog drugs, so it participates in
      their disposition (ADME). However, it does not chemically metabolize xenobiotics - it
      transports them - so "xenobiotic metabolic process" (a transformation term) overstates
      the activity. The transport role is better captured by xenobiotic transmembrane
      transport (GO:0006855, annotated separately). Marked as over-annotation rather than
      removed because drug uptake is a genuine, if pharmacological and non-core, contribution
      to xenobiotic handling.
    supported_by:
    - reference_id: file:human/SLC28A3/SLC28A3-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Also able to transport gemcitabine, 3'-azido-3'-deoxythymidine (AZT),
        ribavirin and 3-deazauridine
