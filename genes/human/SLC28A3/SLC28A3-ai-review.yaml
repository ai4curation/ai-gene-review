  review:
    summary: Phylogenetic assertion of the CNT1/cit-type (pyrimidine nucleoside + adenosine)
      Na+ symporter activity (GO:0015389), generalized here to the clean parent symporter
      term.
    action: MODIFY
    reason: CNT3 does transport pyrimidine nucleosides (uridine, cytidine, thymidine) and
      adenosine with Na+ coupling, so the pyrimidine- and adenosine-specific symport captured
      by GO:0015389 is real for CNT3. However, GO:0015389 is the narrow CNT1 (N2/cit) profile
      and, critically, it is mis-placed in the GO graph under the nucleobase-transport
      hierarchy; its is_a/part_of ancestors include GO:0005345, GO:1904823 and GO:0015855, so
      asserting GO:0015389 would logically entail that CNT3 transports free nucleobases - which
      is directly contradicted by experiment (Yao et al. 2011, hCNTs are nucleoside-specific).
      CNT3's genuine pyrimidine/adenosine Na+ symport is therefore better captured by the clean
      generic term GO:0005415 (nucleoside:sodium symporter activity, already annotated and
      accepted here, whose ancestors contain no nucleobase terms), alongside the purine-specific
      GO:0015390. GO:0015389's mis-placement is flagged as a GO ontology defect.
    proposed_replacement_terms:
    - id: GO:0005415
      label: nucleoside:sodium symporter activity
