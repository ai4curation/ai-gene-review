    supported_by:
    - reference_id: file:human/SLC28A3/SLC28A3-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Sodium-dependent, pyrimidine- and purine-selective
    - reference_id: file:human/SLC28A3/SLC28A3-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=adenosine(out) + 2 Na(+)(out) = adenosine(in) + 2 Na(+)(in)
    source_defects:
    - defect_type: OTHER
      resource: GOC
      slot: is_a
      requested_change: CHECK
      asserted_value: GO:0015389 is_a GO:0005345
      cause: OTHER
      confidence: CONFIRMED
      explanation: GO:0015389 (pyrimidine- and adenosine-specific:sodium symporter activity)
        is mis-placed under the nucleobase-transport hierarchy. Its is_a/part_of ancestor
        closure includes GO:0005345 (purine nucleobase transmembrane transporter activity),
        GO:0005350 (pyrimidine nucleobase transmembrane transporter activity), GO:1904823
        (purine nucleobase transmembrane transport) and GO:0015855 (pyrimidine nucleobase
        transport). A nucleoside/sodium symporter should not be a subtype of a nucleobase
        transporter/transport term; by contrast the sibling GO:0015390 (purine-specific
