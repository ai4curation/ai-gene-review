- id: PMID:18827020
  title: A splice variant of the SLC28A3 gene encodes a novel human concentrative
    nucleoside transporter-3 (hCNT3) protein localized in the endoplasmic reticulum.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. Characterizes the hCNT3ins splice variant (isoform 2),
      which lacks the N-terminal 69 residues, is retained in the ER membrane, retains hCNT3
      transport activity, and is proposed to salvage nucleosides from the ER lumen. Supports
      the isoform-2 ER localization rows.
- id: PMID:21795683
  title: Nucleobase transport by human equilibrative nucleoside transporter 1 (hENT1).
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available (PMC3173155). Although centered on hENT1, it directly
      tested hCNT1, hCNT2 and hCNT3 against purine and pyrimidine nucleobases and showed they
      transport no nucleobases and are nucleoside-specific. This is the key evidence for
      removing the three nucleobase-transport annotations on CNT3. Also confirms hCNT3
      transports uridine and is broadly selective for purine and pyrimidine nucleosides.
- id: PMID:21998139
  title: Functional analysis of the human concentrative nucleoside transporter-1 variant
    hCNT1S546P provides insight into the sodium-binding pocket.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified. Primarily on hCNT1 but assays the analogous hCNT3 Ser568
      mutant (partial loss of function) and documents that hCNT3 uses a 2 Na+ to 1 nucleoside
      stoichiometry with specific Na+-binding properties, and that hCNT3 localizes to the cell
      membrane. Supports the plasma-membrane and sodium-coupling annotations.
- id: PMID:22492015
  title: Role of the transporter regulator protein (RS1) in the modulation of concentrative
    nucleoside transporters (CNTs) in epithelia.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: PubMed-verified paper on RS1-mediated down-regulation of CNT1/2/3 plasma-membrane
      localization and activity. It is a trafficking-regulation study and does NOT assay or
      support nucleobase transport, yet it is cited (as NAS) for the purine nucleobase
      transporter activity and transport annotations - which are also biologically wrong for
      this gene. Marked MISCITED with respect to the nucleobase rows; it is an appropriate
      reference for RS1 regulation of CNT3 trafficking.
- id: PMID:26481311
