core_functions:
- description: The GH2 region binds the MYO6 cargo-binding domain in mouse, supporting the corresponding human
    interaction by orthology. Force transmission and human hair-cell localization remain untested; donor IPI
    curation is required before implementing ISO.
  molecular_function:
