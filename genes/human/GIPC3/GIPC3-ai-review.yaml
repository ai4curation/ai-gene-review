status: COMPLETE
description: GIPC3 is a broadly expressed, 312-residue member of the GIPC family, with a central PDZ domain
  and flanking GH1 and GH2 regions. Recessive variants cause nonsyndromic sensorineural hearing loss. Mouse
  orthology supports a MYO6-binding role, while the human hair-cell mechanism remains incompletely characterized.
