- question: Can mouse Q8R5M0 be curated to GO:0070853 with IPI from PMID:37096733 before implementing the proposed
    human ISO annotation?
product_type: PROTEIN
knowledge_gaps:
- gap_statement: The molecular mechanism by which human GIPC3 supports hair-cell organization is unresolved,
    including whether it forms a force-transmitting MYO6–MYO18A bridge.
  boundary: Mouse experiments establish partner binding and apical organization; the corresponding human interaction
    is inferred by orthology. MYO6 may act as a motor or anchor, but simultaneous force coupling and human
    apical localization remain untested.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  resolution: Test human partner binding and simultaneous complex formation, then separate structural coupling
    from protein abundance in hair cells.
  provenance:
  - reference_id: PMID:37096733
  - reference_id: PMID:21326233
  - reference_id: PMID:21660509
suggested_experiments:
- description: Compare purified human GIPC3 binding to MYO6 and MYO18A individually and together. In a hair-cell
    model, test interaction-defective mutants with matched expression/localization for rescue of apical geometry.
  experiment_type: Binding, ternary-complex reconstitution and controlled rescue
