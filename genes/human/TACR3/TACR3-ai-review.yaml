- term:
    id: GO:0001659
    label: temperature homeostasis
  evidence_type: EXP
  original_reference_id: PMID:28385352
  qualifier: involved_in
  review:
    summary: >-
      Proposed: the receptor transduces neurokinin B signalling onto the hypothalamic
      circuit that activates heat-loss effectors, so selective receptor blockade in women
      reduces the frequency of vasomotor episodes and infusing the receptor's ligand
      induces them.
    action: NEW
    reason: >-
      A vasomotor episode is an activation of thermoregulatory effectors, not a sensation
      only: the trial literature defines it as intermittent cutaneous vasodilatation,
      sweating and behavioural change that reduce temperature (PMID:28385352), and in the
      ligand-infusion study flushes came with measured rises in skin temperature and in
      sternal skin conductance (PMID:25683060). Loss of signalling, in human: the
      NK3R-selective antagonist MLE4901 cut weekly flushes by 45 percentage points in a
      randomised crossover trial, confirmed objectively by skin-conductance monitoring
      (PMID:28385352), and the NK3R-selective antagonist fezolinetant reduced vasomotor
      symptom frequency in phase 3 (PMID:36924778); elinzanetant replicates the effect but
      is a dual neurokinin-1,3 antagonist, so it supports the pathway rather than this
      receptor specifically (PMID:39172446). Pharmacological blockade is receptor-specific
      evidence in a way a ligand experiment is not, because the drug's target is this gene
      product. Gain of signalling, from the ligand side and in women with intact ovarian
      function: intravenous NKB induced flushes in healthy premenopausal women
      (PMID:25683060). Participation test: the receptor performs the transduction step
      between the peptide and the heat-loss circuit, so it does part of the work of the
      regulatory process rather than being acted upon by it. What the human evidence does
      not establish, and why the row is worded as participation in temperature homeostasis
      rather than as a specific heat-dissipation claim: the antagonist trials were run in
      postmenopausal women, so they are evidence about the estrogen-deprived state, in
      which endogenous NKB-NK3R signalling drives the episodes; whether the receptor
      contributes to body-temperature regulation in the eugonadal human is not tested by
      them, and the infusion study reports no change in mean skin temperature across the
      whole infusion, only during flush episodes. That normal-physiology arm rests on
      rodent data instead: senktide into the rat median preoptic nucleus lowers core
      temperature, MnPO NK3R neurons are required for that hypothermia, and in mouse
      ablating the median preoptic NK3R population raises core temperature. Term choice:
      GO:0031653 heat dissipation and its regulation terms would be closer to the
      phenotype but carry no annotations in any species (QuickGO, 2026-11-13), and the
      human measurements are symptom frequency, skin temperature and sweating rather than
      a measured heat-dissipation process, so GO:0001659 is the right granularity.
      Comparator check (QuickGO, GO:0001659, 2026-11-13): 26 human rows, every one a
      transfer (IEA, ISS, IBA or TAS) including the GPCRs ADORA1, DRD2, GRM5, HTR2A, MC5R
      and NTSR1 and the neuropeptides HCRT and NMU, against 42 mouse rows of which about
      twenty are IMP. So the term is used for receptors of this kind, and its absence from
      the human set reflects how rarely human thermoregulation is perturbed
      experimentally, not a decision against it: the rodent orthologs carry no GOA
      GO:0001659 row either, so there was nothing to transfer. The earlier decision not to
      propose a thermoregulatory term for this gene checked only the heat-dissipation
      terms, which is why it is revised here. The companion mouse Tacr3 review proposes
      the same term from independent mouse evidence, so this row is not a transfer of it.
      Evidence code: I use EXP rather than IDA or IMP. ECO classes an experiment that
      assays an organism's response to a receptor agonist or antagonist as pharmacological
      assay evidence (ECO:0006053), which sits under experimental phenotypic evidence, not
      under mutant-phenotype evidence (ECO:0000315, the IMP class, whose descendants cover
      mutation, RNAi, morpholino, antisense and over-expression but no drug) nor under
      direct-assay evidence; its manual-assertion form resolves to experimental evidence
      used in manual assertion, which is EXP. I could not reach GO's own IMP and IDA
      guidance pages to confirm consortium practice for drug-inhibition experiments
      (wiki.geneontology.org returns 403 from this environment), so that is reasoning from
      ECO rather than a verified GO convention, and IDA would also be defensible for the
      ligand-infusion arm.
    additional_reference_ids:
    - PMID:36924778
    - PMID:39172446
    - PMID:25683060
    - PMID:22028440
    - PMID:25825817
    supported_by:
    - &flush_is_heat_loss
      reference_id: PMID:28385352
      supporting_text: A hot flush is characterised by an intense feeling of heat, which often rises through the body, and intermittent activation of heat dissipation effectors, including peripheral cutaneous vasodilatation, sweating, and behavioural change, to reduce temperature.
    - &mle4901_effect
      reference_id: PMID:28385352
      supporting_text: MLE4901 significantly reduced the total weekly number of hot flushes by 45
    - &mle4901_objective
      reference_id: PMID:28385352
      supporting_text: The reported subjective effect of decreased flushes by MLE4901 was confirmed by objective measurement using the skin conductance monitor and detection algorithm software
    - &fezolinetant_effect
      reference_id: PMID:36924778
      supporting_text: Compared with placebo, fezolinetant 30 mg and fezolinetant 45 mg significantly reduced the frequency of vasomotor symptoms at week 4
    - &elinzanetant_dual
      reference_id: PMID:39172446
      supporting_text: To evaluate the efficacy and safety of elinzanetant, a selective neurokinin-1,3 receptor antagonist, for the treatment of moderate to severe menopausal vasomotor symptoms.
    - &nkb_induces_flushes
      reference_id: PMID:25683060
      supporting_text: In summary, our data shows that intravenous infusion of NKB acutely induces hot flushes in premenopausal healthy women.
    - &flush_skin_temp
      reference_id: PMID:25683060
      supporting_text: Mean skin temperature increased significantly during flushing symptoms when compared with the pre-symptom period
    - &mnpo_senktide
      reference_id: PMID:22028440
      supporting_text: Senktide microinfusion into the rat MnPO decreased core temperature in a dose-dependent manner.
    - &mnpo_required
      reference_id: PMID:25825817
      supporting_text: These data show that NK3R neurons in the MnPO are required for the hypothermic effects of senktide but not for the E2 modulation of thermoregulation.
