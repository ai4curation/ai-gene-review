id: P29371
gene_symbol: TACR3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TACR3 encodes the neurokinin-3 receptor (NK3R), also called the neuromedin-K
  receptor, a 465-residue class A (rhodopsin-like) seven-transmembrane G
  protein-coupled receptor of the tachykinin receptor subfamily. It is the
  preferred receptor for the tachykinin neurokinin B (NKB, the TAC3 product),
  and also binds and responds, with lower potency, to the other mammalian
  tachykinins neurokinin A and substance P; all three share the C-terminal
  FxGLM-NH2 motif that engages the orthosteric pocket, while their divergent
  N-termini set subtype preference. Agonist binding couples the receptor mainly
  to Gq/11, activating phospholipase C and raising intracellular calcium; a
  weaker Gs/adenylate-cyclase/cAMP output has been shown for the rodent receptor
  and is inferred for human. The receptor functions at the plasma membrane of
  neurons, with somatodendritic and axonal distribution in the central nervous
  system. Its best-established physiological role is in the central control of
  reproduction: NK3R is expressed on arcuate KNDy (kisspeptin/neurokinin
  B/dynorphin) neurons, where NKB-NK3R signalling helps shape the pulsatile
  gonadotropin-releasing hormone drive that sets gonadotropin secretion, and
  biallelic loss-of-function TACR3 mutations cause normosmic congenital
  hypogonadotropic hypogonadism with pubertal failure. NK3R in hypothalamic
  thermoregulatory (median preoptic) neurons also contributes to central
  heat-dissipation control: infusing neurokinin B induces flush episodes, with
  measured rises in skin temperature and sweating, in women with intact ovarian
  function, and selective NK3R antagonists reduce the frequency of such episodes
  in postmenopausal women, which is the basis of their use against menopausal
  vasomotor symptoms. Additional roles reported largely from rodent
  agonist pharmacology (dopaminergic modulation, cardiovascular and ingestive
  behaviour) are peripheral.
