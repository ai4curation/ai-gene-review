  - UniProtKB:P25103
  - UniProtKB:P29371
  - ZFIN:ZDB-GENE-061207-19
  - ZFIN:ZDB-GENE-090312-106
  review:
    summary: >-
      Phylogenetic (IBD/IBA) assignment of tachykinin receptor activity to the whole
      tachykinin-receptor clade, which NK3R belongs to.
    action: ACCEPT
    reason: >-
      The three mammalian tachykinin receptors (NK1R/P25103, NK2R/P21452, NK3R/P29371,
      the WITH/FROM seeds) all transduce tachykinin signals, so this family-level MF is
      placed at the correct node. P29371 appears in its own WITH/FROM because it has
      direct evidence (PMID:37391393), which grounds rather than inflates the IBA. The
      NKB-preferring subfamily specialisation is captured by the more specific child
      GO:0016498. Retained as a true, correctly levelled annotation.
    supported_by:
    - &rank_order
      reference_id: file:human/TACR3/TACR3-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'The rank order of affinity of this receptor to tachykinins is: neuromedin-K > substance K and substance P'
