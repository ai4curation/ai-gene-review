- term:
    id: GO:0004995
    label: tachykinin receptor activity
  evidence_type: TAS
  original_reference_id: PMID:8990205
  qualifier: enables
  review:
    summary: >-
      Functional characterisation of the human NK-3 receptor: tachykinin agonists stimulate
      phosphoinositide hydrolysis and arachidonic acid release, with neurokinin B among the most
      potent agonists, ahead of neurokinin A and substance P.
    action: MODIFY
    reason: >-
      The term is correct, but this row's own paper identifies the preferred ligand: at the
      human NK-3 receptor cell line the rank order of potency puts neurokinin B (with
      [MePhe7]neurokinin B and senktide) ahead of neurokinin A and substance P. That supports
      the child GO:0016498 neuromedin K receptor activity (neuromedin K is neurokinin B), which
      the gene already carries on its direct-evidence rows. The IBA and InterPro rows to
      tachykinin receptor activity stay as they are, because their evidence (a node spanning
      NK1R, NK2R and NK3R, and signatures mapped to GO:0004995) does not identify the ligand.
    proposed_replacement_terms:
    - id: GO:0016498
      label: neuromedin K receptor activity
    supported_by:
    - reference_id: PMID:8990205
      supporting_text: Tachykinin peptides stimulated both inositol phospholipid hydrolysis and arachidonic acid release at NK-3 and NK-3 receptor homolog cell lines
    - reference_id: PMID:8990205
      supporting_text: 'neurokinin B = senktide > NKA = substance P'
