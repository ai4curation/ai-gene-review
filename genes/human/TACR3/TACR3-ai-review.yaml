proposed_new_terms: []
suggested_questions:
- question: >-
    Through which hypothalamic circuit and effector neurons does human NK3R trigger vasomotor
    (hot-flush) episodes, and is this the same median-preoptic heat-dissipation pathway defined
    pharmacologically in the rat?
suggested_experiments:
- description: >-
    Define the human NK3R-expressing neuronal populations and their projections in the
    hypothalamic reproductive and thermoregulatory circuits using single-nucleus RNA-seq and
    spatial transcriptomics of human hypothalamus, cross-referenced with functional imaging of
    vasomotor episodes evoked by NKB infusion and blocked by selective NK3R antagonists.
  hypothesis: >-
    The same arcuate KNDy to median-preoptic NK3R pathway that paces GnRH pulses also drives
    central heat-dissipation responses, explaining why NK3R antagonists relieve menopausal
    vasomotor symptoms.
knowledge_gaps:
- gap_statement: >-
    The central site and neuronal circuit by which human NK3R signalling triggers vasomotor
    flushing, and whether it is the same KNDy/median-preoptic pathway that paces GnRH, is not
    established.
  boundary: >-
    It is firmly established that NKB infusion induces flushes in women, that NK3R antagonists
    relieve menopausal vasomotor symptoms in phase 2/3 trials, and that in the rat median
    preoptic NK3R neurons modulate heat-dissipation effectors; the human circuit and effector
    neurons remain to be defined. Two further limits of the human evidence, which the
    GO:0001659 row records rather than hides: the antagonist trials were conducted in
    postmenopausal women, so they establish the receptor's role in the estrogen-deprived
    state and not that it sets body temperature in the eugonadal human; and no human
    experiment has measured core temperature, as opposed to skin temperature, sweating and
    symptom frequency, during NK3R agonism or blockade.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  status: OPEN
  significance: >-
    Resolving the human circuit would explain the mechanism of a validated drug class
    (fezolinetant, elinzanetant) and clarify how reproductive and thermoregulatory NK3R
    functions are segregated.
  resolution: >-
    Map human NK3R-expressing neurons and their projections and test, with selective agonists
    and antagonists, which population mediates the flush response; alongside that, measure
    core as well as skin temperature during selective NK3R agonism or blockade, and include
    premenopausal participants, so that the receptor's contribution to temperature regulation
    outside the estrogen-deprived state can be assessed.
  provenance:
  - reference_id: PMID:25683060
    supporting_text: However, the central mechanisms through which sex steroid deficiency triggers flushing remain unclear.
