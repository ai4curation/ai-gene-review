existing_annotations:
- term:
    id: GO:0004930
    label: G protein-coupled receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000276
  review:
    summary: >-
      Generic GPCR activity from the rhodopsin-family InterPro signature IPR000276. Correct, and
      as specific as that signature can make it.
    action: ACCEPT
    reason: >-
      NK3R is a rhodopsin-family GPCR, so the term is correct. The row rests only on IPR000276,
      a generic signature whose InterPro2GO mapping is GO:0004930 itself; it identifies no
      ligand, so this row's evidence does not support GO:0016498 neuromedin K receptor activity,
      which the gene carries on its own direct-evidence rows. G protein-coupled receptor
      activity is a respectably specific statement of the core receptor function, so the row is
      kept as it is.
    supported_by:
    - &nkb_function
      reference_id: file:human/TACR3/TACR3-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Receptor for the tachykinin neuromedin-K (neurokinin B)
- term:
    id: GO:0004995
    label: tachykinin receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001544873
  - RGD:3810
  - RGD:3811
  - RGD:3812
