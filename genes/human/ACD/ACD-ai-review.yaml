- id: file:human/ACD/ACD-uniprot.txt
  title: UniProtKB record for human ACD (Q96AP0)
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Displays canonical 458-aa TPP1-S (Q96AP0-3, SV 4) with accurate PWI (11-13), POT1-binding, and TIN2-binding features, but CC:SEQUENCE CAUTION erroneously dismisses the physiological 544-aa germ-cell isoform TPP1-L (AAH16904.1, PMID:31216472) as 'Erroneous initiation'.
- id: file:human/ACD/ACD-deep-research-affinage.md
  title: Affinage mechanistic annotation for ACD (human)
  findings:
  - statement: Summarizes ACD/TPP1 bridging of TIN2 and POT1, TEL-patch delta-K170 bone marrow failure, IPF variants S295N/H358Q, and mouse acd p53-dependent developmental apoptosis.
    supporting_text: It physically bridges TIN2 and POT1, with the POT1 interaction occurring through the POT1 C-terminus; disrupting this bridge prevents POT1 from localizing to telomeres and deregulates telomere length
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Self-evaluation pairwise = win, faith_pct = 85.7%, 12 real PubMed citations (0 bioRxiv pseudo-PMIDs) and zero contamination from the homonymous lysosomal protease TPP1/CLN2 (O14773), because Affinage queried by official symbol ACD/Acd. All 12 cited claims were verified against cached publications. Three curatorial limitations were identified and not imported: (1) severe symbol-driven recall gap — querying ''ACD'' missed the core ''TPP1''-titled structural/biochemical canon (OB-fold crystal structure PMID:17237767, telomerase processivity discovery PMID:17237768/PMID:20231318, TEL-patch discovery PMID:22863003/PMID:23103865, CST termination PMID:22763445, TPP1-S/TPP1-L isoforms PMID:31216472, and telomerase-TPP1-POT1 cryo-EM structures PMID:35201900/PMID:35418675) while pulling in 5 mouse Acd papers; (2) unflagged mixed residue numbering combining 544-aa TPP1-L coordinates (delta-K170, G223V, Q320X) with 458-aa canonical coordinates (S295N, H358Q); and (3) coarse goslim/Reactome grounding (GO:0098772, GO:0000228, R-HSA-73894 DNA Repair, R-HSA-5357801 Programmed Cell Death).'
