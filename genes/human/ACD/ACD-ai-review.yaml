    action: NEW
    reason: 'While gene-level GO:0032212 is already introduced via MODIFY on GO:0032206, this NEW row records explicit isoform-specific scoping to canonical 458-aa somatic Q96AP0-3 (TPP1-S): direct primer-extension, tethering, and isoform-comparison assays (PMID:17237768; PMID:20231318; PMID:22863003; PMID:31216472) demonstrate that somatic TPP1-S (Q96AP0-3), unlike 544-aa male germ-cell TPP1-L, lacks the inhibitory 86-aa basic N-terminal extension and activates telomerase repeat-addition processivity via its N-terminal NOB PWI and OB-fold TEL-patch surfaces.'
