    supporting_text: Through reconstitution experiments, we demonstrate here that TIN2 and TPP1 are key components in mediating the six-protein complex assembly.
  - reference_id: PMID:22763445
    supporting_text: Here we show that the human CST (CTC1, STN1 and TEN1) complex, previously implicated in telomere protection and DNA metabolism, inhibits telomerase activity through primer sequestration and physical interaction with the protection of telomeres 1 (POT1)–TPP1 telomerase processivity factor.
  - reference_id: file:human/ACD/ACD-deep-research-affinage.md
    supporting_text: It physically bridges TIN2 and POT1, with the POT1 interaction occurring through the POT1 C-terminus; disrupting this bridge prevents POT1 from localizing to telomeres and deregulates telomere length
- description: Directly binds the telomerase catalytic subunit TERT via its N-terminal NOB PWI motif (Pro11-Trp12-Ile13) and OB-fold acidic TEL-patch loop (Glu82-Glu83-Lys84-Glu85) to recruit telomerase to chromosome ends and stimulate processive TTAGGG repeat synthesis.
