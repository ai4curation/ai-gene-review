  review:
    summary: Remove uninformative bare protein binding to deubiquitinase USP7 (UniProtKB:Q93009), for which ACD/TPP1 is a deubiquitination substrate.
    action: REMOVE
    reason: UniProtKB:Q93009 is ubiquitin carboxyl-terminal hydrolase 7 (USP7), which binds the OB fold of human TPP1 and deubiquitinates oligo-ubiquitinated TPP1 lysines (PMID:25172512). Because ACD/TPP1 is the enzymatic substrate rather than an adaptor bridging USP7 to another macromolecule, bare GO:0005515 carries no molecular-function specificity for ACD and is removed per the protein-binding policy.
    supported_by:
    - reference_id: PMID:25172512
      supporting_text: In this study, we identified the deubiquitinase USP7 as an interacting protein of human TPP1 and show that TPP1 is ubiquitinated and is a substrate of USP7.
