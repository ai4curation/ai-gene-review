id: Q96AP0
gene_symbol: ACD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Core architectural adaptor and telomerase recruitment subunit of the human six-protein shelterin complex (TERF1, TERF2, TERF2IP/RAP1, TINF2/TIN2, POT1, and ACD, widely called TPP1 in telomere literature and distinct from lysosomal protease TPP1). Canonical somatic ACD/TPP1-S (458 amino acids, Q96AP0-3) contains an N-terminal hydrophobic PWI motif (Pro11-Trp12-Ile13; NOB), an oligonucleotide/oligosaccharide-binding (OB) fold bearing the surface-exposed acidic TEL-patch loop (Asp80-Trp81-Glu82-Glu83-Lys84-Glu85), a central POT1-binding domain, and a C-terminal TIN2-interacting helix. ACD does not contact telomeric repeat DNA directly; instead, it bridges single-stranded G-overhang-binding POT1 to TIN2 and duplex-bound TERF1/TERF2 to cap chromosome ends against ATR DNA damage signaling and non-homologous end joining. During S phase, the NOB PWI peptide and acidic TEL patch dock directly onto the TEN and IFD-TRAP domains of telomerase reverse transcriptase (TERT) to recruit telomerase to telomeres and stimulate processive TTAGGG repeat synthesis, whereas POT1 overhang sequestration, CST (CTC1-STN1-TEN1) recruitment, and an 86-residue N-terminally extended male germ-cell isoform (TPP1-L) restrain telomere over-elongation.
