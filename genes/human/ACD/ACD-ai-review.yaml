functional_isoforms:
- id: ACD_TPP1_S
  name: TPP1-S (canonical 458-aa somatic isoform)
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q96AP0-3
  description: Predominant 458-residue isoform expressed in human somatic and stem cells (initiating at Met87 of historical 544-aa numbering and lacking the 86-residue basic upstream extension of TPP1-L). Contains the N-terminal PWI NOB motif (Pro11-Trp12-Ile13) and OB-fold TEL patch (Glu82-Glu83-Lys84-Glu85) that both recruit telomerase to telomeres and activate repeat-addition processivity, while also mediating somatic shelterin POT1/TIN2 bridging, CST recruitment, and cis-restraint of telomere over-elongation.
- id: ACD_TPP1_L
  name: TPP1-L (544-aa N-terminally extended germ-cell isoform)
  type: SPLICE_VARIANT
  description: Alternative 544-residue isoform (historical RefSeq NP_001075955.1 / GenBank AAH16904.1) transcribed from an upstream promoter and containing an unstructured, highly basic glycine-proline-arginine-rich 86-amino-acid N-terminal extension preceding Met1 of TPP1-S; constitutes the major isoform in differentiated male germ cells (spermatocytes/spermatids). Retains shelterin assembly, telomere capping, and full TEL-patch- and NOB-mediated telomerase recruitment to TERT, but introduces an isoform-specific post-recruitment restraint mechanism (distinct from somatic POT1/CST cis-restraint) in which basic residues within its 86-aa extension (including Arg43/Arg46/Arg48, mutated in R43E-R46E-R48E) together with N-terminal steric bulk block telomerase repeat synthesis after recruitment (PMID:31216472).
  source_defects:
  - defect_type: MISSING_ISOFORM
    resource: UNIPROT
    record: UniProtKB:Q96AP0
    slot: CC:SEQUENCE CAUTION
    requested_change: ADD
    asserted_value: Sequence=AAH16904.1; Type=Erroneous initiation; Note=Extended N-terminus.
    cause: PRACTICE_CHANGE
    confidence: CONFIRMED
    explanation: UniProt Q96AP0 retired the 544-aa N-terminally extended sequence (AAH16904.1 / AAS80318.1 / BAB14658.1) under CC:SEQUENCE CAUTION as 'Erroneous initiation', leaving only 458-aa Q96AP0-3 and 455-aa Q96AP0-2. Grill et al. 2019 (PMID:31216472) demonstrate that 544-aa TPP1-L is a genuine, physiologically expressed alternative transcript isoform predominant in human male germ cells with separation-of-function telomerase restraint, and nearly all pre-2020 clinical/structural literature (e.g., delta-K170 = Lys84del) uses 544-aa TPP1-L coordinates.
    supported_by:
    - reference_id: file:human/ACD/ACD-uniprot.txt
      record_section:
      - CC:SEQUENCE CAUTION
      supporting_text: Sequence=AAH16904.1; Type=Erroneous initiation; Note=Extended N-terminus.
    - reference_id: PMID:31216472
      supporting_text: Here, we identify separation-of-function long (TPP1-L) and short (TPP1-S) isoforms of TPP1 that appear to be generated from separate transcripts and differ only in 86 amino acids at their N terminus.
    corrected_value: RefSeq:NP_001075955.1
  maps_to:
  - type: REFSEQ_PROTEIN
    ids:
    - NP_001075955.1
