  review:
    summary: The combined orthology and reaction mapping correctly identifies protein O-GlcNAc transferase
      activity.
    action: ACCEPT
    reason: Current Rhea 48904 and 48908 describe transfer of N-acetylglucosamine from UDP-GlcNAc to protein
      serine or threonine, matching the alternatives in GO:0097363 and EC 2.4.1.255. The Q8BYW9 and Ensembl
