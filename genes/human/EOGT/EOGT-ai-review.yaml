  review:
    summary: Refine the broad glycosyltransferase activity to the experimentally established protein O-acetylglucosaminyltransferase
      activity.
    action: MODIFY
    reason: Both current InterPro mappings, IPR007657 (Glycosyltransferase 61 family) and IPR049625 (its
      catalytic domain), supply only the broad GO:0016757 assertion. This family also includes enzymes
      with other substrate specificities, so the mapping alone does not identify the acceptor. Human EOGT
      activity in PMID:23671640 Figure 1 and purified fly-enzyme assays in PMID:22158438 Figure 2 establish
      O-GlcNAc transfer to EGF-domain proteins. GO:0097363, already asserted by the IBA, combined IEA and ISS annotations, expresses that
      established reaction and is a verified is_a descendant of GO:0016757. Use that nonredundant specific
      replacement; the refinement does not imply the InterPro mapping is false.
