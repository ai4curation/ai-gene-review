id: Q5NDL2
gene_symbol: EOGT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EOGT is an endoplasmic-reticulum glycosyltransferase that adds O-linked N-acetylglucosamine
  to serine or threonine residues between the fifth and sixth conserved cysteines of folded extracellular
  EGF-like domains of secretory-pathway proteins. The
  canonical 527-residue human protein has demonstrated activity on Notch EGF-repeat reporters in a heterologous
  system. This enzyme is distinct from intracellular OGT. Biallelic EOGT variants cause Adams-Oliver syndrome;
  the activities and locations of its shorter natural protein products remain incompletely characterized.
