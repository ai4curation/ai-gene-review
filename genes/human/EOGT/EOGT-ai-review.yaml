      Full cached Experimental Procedures, Results and Discussion were read from the original
      article https://pmc.ncbi.nlm.nih.gov/articles/PMC4303666/. The expressed protein is mouse
      EOGT even in human HEK293T host cells. Results associated with Figure 1B show EOGT ER
