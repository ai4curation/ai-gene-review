  review:
    summary: Orthology-based protein O-linked glycosylation is supported by donor provenance and direct
      human EOGT assays.
    action: ACCEPT
    reason: 'EOGT catalyzes the initiating transfer itself, rather than merely being a glycosylated substrate.
      The official mouse donor Q8BYW9 maps to MGI:2141669 and Ensembl ENSMUSP00000061610.5 and carries
      direct IDA annotations to this process and GO:0097363 from PMID:22310717. That older paper is abstract-only
      in the normal cache; its full Methods were not recovered, so its assay detail is not claimed. Independently
      read PMID:23671640 Results/Figure 1 and Methods demonstrate that the human 527-residue clone restores
      O-GlcNAc modification of Notch EGF repeats in fly S2 cells, establishing the same catalytic process
      on the human product. Retain GO:0006493: the current narrower GO:7770074 explicitly restricts the
      product to an unextended single sugar, whereas the mammalian donor report describes further galactosylation.
      This is a definition-based specificity limit, not evidence that EOGT itself performs the downstream
      galactosylation. Full Methods and Results in PMID:25488668 additionally establish catalysis by purified
      CHO-expressed mouse EOGT using radiolabeled UDP-GlcNAc and a fly Notch EGF20 substrate, providing
      a separately read primary mouse assay.'
