  review:
    summary: The inherited ER-lumen localization agrees with experimentally tested fly Eogt and the targeting
      features of canonical human EOGT.
    action: ACCEPT
    reason: The two EOGT IBA assertions reside at the same PAINT node, PTN001841612. The current PANTHER
      19 tree places human Q5NDL2 below this node, and the ungapped target MSA sequence exactly matches
      the 527-residue canonical protein; the pinned August 2026 IBD contains the expected FlyBase donor
      and no matching NOT assertion on the target path. In PMID:22158438, Results/Figure 3c–f and Methods,
      fly Eogt in S2 cells colocalizes with GFP-KDEL, while deletion of its terminal RNEL or C-terminal
      tagging shifts the protein into culture medium. These are fly assays, not direct human microscopy.
      Human Q5NDL2-1 has an N-terminal signal sequence and terminal HDEL consistent with the conserved
      location. The activity and location of shorter natural products are not established by this inference.
      Independent mouse experiments in PMID:25488668 show expressed EOGT in the ER (Results/Figure
      1B) and the O-GlcNAc product signal overlapping calnexin (Figure 1C); purified-enzyme transfer is
      measured in Figure 2. The expressed enzyme is mouse even when HEK293T cells are the host.
