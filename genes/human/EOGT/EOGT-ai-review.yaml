  review:
    summary: The PAINT-inherited protein O-acetylglucosaminyltransferase activity is corroborated directly
      for human EOGT.
    action: ACCEPT
    reason: PTN001841612 carries the exact IBD term and fly/mouse donor set in the pinned PAINT data.
      Human, mouse and fly Eogt occupy the EOGT subfamily, and the human target descends from the asserted
      node without a matching loss annotation on its path. PMID:22158438 Figure 2 measures transfer from
      UDP-[3H]GlcNAc to folded EGF20 using affinity-purified fly Eogt; denatured/disulfide-altered acceptors
      and the T34A acceptor give little or no activity. PMID:23671640 Figure 1 establishes activity of
      the canonical human 527-residue clone in a heterologous cellular assay. The older mouse source is
      not needed as the sole basis for this accepted function, and no equivalence of shorter isoforms
      is inferred. Independently read PMID:25488668 Methods and Results corroborate this chemistry with
      purified mouse enzyme; the reported kinetic constants belong to that mouse preparation.
