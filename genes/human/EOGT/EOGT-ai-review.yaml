suggested_questions:
- question: Are the 208-residue and 443-residue natural human products stable proteins, and what are their
    cellular locations and substrate-transfer activities when expressed with their natural termini?
- question: Which endogenous human EGF-domain substrates and tissue contexts connect impaired EOGT-mediated
    glycosylation to the limb and scalp manifestations of Adams-Oliver syndrome?
- question: Should the current GO:7770074 definition be broadened or a distinct term provided for secretory-pathway
    O-GlcNAc glycans that can subsequently be elongated?
core_functions:
- description: Transfers N-acetylglucosamine from UDP-GlcNAc to serine or threonine residues within folded
    EGF-like domains of secretory-pathway proteins in the endoplasmic reticulum lumen, initiating protein
    O-linked glycosylation. Human catalytic activity is established for the canonical 527-residue protein;
    the two shorter natural products remain functionally uncharacterized.
