id: Q9NZN8
gene_symbol: CNOT2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  CNOT2 is a conserved noncatalytic NOT-module subunit of the CCR4-NOT complex. Its C-terminal NOT-box heterodimerizes
  with the corresponding region of CNOT3 and anchors the module on the CNOT1 scaffold, stabilizing the core assembly
  that positions catalytic CCR4/CAF1-family deadenylases for cytosolic mRNA poly(A)-tail shortening. CNOT2 also
  has a nuclear Not-box-dependent transcriptional corepressor activity through SMRT/NCoR-HDAC3 contacts and contributes
  to embryonic stem-cell maintenance through the CNOT1-CNOT2-CNOT3 module.
