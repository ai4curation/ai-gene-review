core_functions:
- description: >-
    CNOT2 forms the NOT module of human CCR4-NOT by heterodimerizing with CNOT3 through its C-terminal NOT-box and
    anchoring the heterodimer to the CNOT1 scaffold. This noncatalytic module stabilizes CCR4-NOT and helps the
    assembled complex stimulate processive mRNA poly(A)-tail shortening by the CNOT6/CNOT6L and CNOT7/CNOT8 nuclease
    modules.
  molecular_function:
    id: GO:0046982
    label: protein heterodimerization activity
  directly_involved_in:
  - id: GO:0000289
    label: nuclear-transcribed mRNA poly(A) tail shortening
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0030015
    label: CCR4-NOT core complex
  supported_by:
  - reference_id: PMID:24121232
    supporting_text: CNOT2-C and CNOT3-C heterodimerize through their SH3-like NOT-box domains.
  - reference_id: PMID:31320642
    supporting_text: the non-enzymatic CAF40 and NOT modules are together necessary and sufficient to fully
      stimulate deadenylation in vitro
  - reference_id: PMID:21299754
    supporting_text: CNOT2 depletion destabilizes the complex, resulting in the formation of a complex smaller
      than that formed in control siRNA-treated cells
suggested_questions:
- question: Which native human transcripts require the CNOT2-CNOT3 NOT module, rather than the CAF40 or
    NOT10-NOT11 noncatalytic modules, for efficient CCR4-NOT recruitment and deadenylation?
- question: Which endogenous promoters use CNOT2 Not-box recruitment of SMRT/NCoR-HDAC3 complexes, and how
    often is that nuclear activity coupled to cytosolic decay of the same transcripts?
suggested_experiments:
- description: >-
    Create sequence-verified CNOT2 Not-box interface mutants that separately disrupt CNOT3 heterodimerization, CNOT1
    anchoring and SMRT/NCoR-HDAC3 binding, then compare CCR4-NOT assembly, transcript half-lives and nuclear-reporter
    repression in the same human cell background.
  hypothesis: CNOT2 assembly mutants will impair cytosolic CCR4-NOT deadenylation, while corepressor-specific
    mutants will separate the contextual nuclear repression activity.
