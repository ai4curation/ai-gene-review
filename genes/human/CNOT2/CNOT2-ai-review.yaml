  supporting_entities:
  - UniProtKB:A5YKK6
  review:
    summary: CNOT2 associates with the CNOT1 scaffold.
    action: MODIFY
    reason: >-
      The GOA row records CNOT2 association with CNOT1, and the human NOT-module structure shows how the CNOT2-CNOT3
      heterodimer is anchored to the CNOT1 scaffold. Scaffold protein binding is more informative than bare protein
      binding and does not imply that CNOT2 is itself the scaffold.
