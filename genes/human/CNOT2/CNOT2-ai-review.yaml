existing_annotations:
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:14707134
  qualifier: involved_in
  review:
    summary: Tethered CNOT2 can repress RNA polymerase II reporter transcription.
    action: KEEP_AS_NON_CORE
    reason: >-
      The original human reporter assay targeted CCR4-NOT subunits to a promoter and found that CNOT2 acts as a
      direct transcriptional repressor. This nuclear Not-box activity is supported but contextual relative to CNOT2's
      conserved cytosolic CCR4-NOT assembly role.
    supported_by:
    - reference_id: PMID:14707134
      supporting_text: we found that the CNOT2 and CNOT9(hRcd1/hCaf40) subunits act as repressors of reporter
        gene activity
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:16712523
  qualifier: involved_in
  review:
    summary: CNOT2-mediated repression is linked to SMRT/NCoR-HDAC3 cofactors.
    action: KEEP_AS_NON_CORE
    reason: >-
      The follow-up CNOT2 Not-box study connected the repressive reporter activity to physical contacts with SMRT/NCoR-HDAC3
      components. Retain the transcriptional repression process as a supported nuclear context, not as the family-wide
      CCR4-NOT deadenylation mechanism.
    supported_by:
    - reference_id: PMID:16712523
      supporting_text: We observed physical interactions of CNOT2 with several subunits of the SMRT/NCoR-HDAC3
        complex.
- term:
    id: GO:0000289
    label: nuclear-transcribed mRNA poly(A) tail shortening
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0017550
  - FB:FBgn0033029
  - PANTHER:PTN000595684
  - PomBase:SPAC1B3.05
  - PomBase:SPCC4G3.15c
  - SGD:S000001300
  - SGD:S000006276
  review:
    summary: CNOT2 structurally participates in CCR4-NOT-mediated poly(A) shortening.
    action: ACCEPT
    reason: >-
      The root PAINT node is seeded by fungal and animal NOT-family proteins and independently agrees with human
      depletion and reconstitution studies: CNOT2 maintains CCR4-NOT integrity and the CNOT2/CNOT3-containing NOT
      module helps the noncatalytic arm of the complex stimulate poly(A) shortening. This is structural participation,
      not a CNOT2 nuclease assignment.
    supported_by:
    - reference_id: file:interpro/panther/PTHR23326/PTHR23326-paint.tsv
      supporting_text: "PTHR23326\tPTN000595684\tGO:0000289\tP\tIBD\tfalse\tFB:FBgn0017550|FB:FBgn0033029|PomBase:SPAC1B3.05|PomBase:SPCC4G3.15c|SGD:S000001300|SGD:S000006276\t\
        taxon:\t20200930"
    - reference_id: PMID:21299754
      supporting_text: P-bodies, where mRNA degradation supposedly takes place, was largely suppressed in
        CNOT2-depleted cells.
    - reference_id: PMID:31320642
      supporting_text: the non-enzymatic CAF40 and NOT modules are together necessary and sufficient to fully
        stimulate deadenylation in vitro
    propagation_review:
      source_entities:
      - source_id: PANTHER:PTN000595684
        source_status: UNRESOLVED
        comment: The ancient NOT2/NOT3/NOT5-family node supports a conserved noncatalytic contribution to
          CCR4-NOT poly(A)-tail shortening; CNOT2 has no loss on this lineage.
      root_cause: NO_FAILURE_CORE
- term:
    id: GO:0000289
    label: nuclear-transcribed mRNA poly(A) tail shortening
  evidence_type: NAS
  original_reference_id: PMID:31320642
  qualifier: involved_in
  review:
    summary: The human NOT module supports efficient deadenylation.
    action: ACCEPT
    reason: >-
      Recombinant human CCR4-NOT dissection showed that the CAF40 and CNOT2/CNOT3-containing NOT modules together
      fully stimulate deadenylation by the catalytic CCR4a:CAF1 nuclease pair. The NAS assertion is retained as
      noncatalytic contribution by CNOT2 within the assembled complex.
    supported_by:
    - reference_id: PMID:31320642
      supporting_text: the non-enzymatic CAF40 and NOT modules are together necessary and sufficient to fully
        stimulate deadenylation in vitro
- term:
    id: GO:0000932
    label: P-body
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:2385261
  - PANTHER:PTN000595684
  review:
    summary: P-body association is a conserved contextual CCR4-NOT feature.
    action: KEEP_AS_NON_CORE
    reason: >-
      The exact PAINT placement is rooted at the same NOT2/NOT3/NOT5-family node as the CCR4-NOT core-complex row.
      CNOT2 depletion suppresses P-body formation in human cells, supporting the inherited RNA-granule context while
      leaving cytosolic CCR4-NOT complex assembly as the core location/function.
    supported_by:
    - reference_id: file:interpro/panther/PTHR23326/PTHR23326-paint.tsv
      supporting_text: "PTHR23326\tPTN000595684\tGO:0000932\tC\tIBD\tfalse\tMGI:MGI:2385261\ttaxon:\t20170228"
    - reference_id: PMID:21299754
      supporting_text: P-bodies, where mRNA degradation supposedly takes place, was largely suppressed in
        CNOT2-depleted cells.
    propagation_review:
      source_entities:
      - source_id: PANTHER:PTN000595684
        source_status: UNRESOLVED
        comment: P-body activity is retained as a non-core localization/regulatory context for CNOT2; no IRD
          or IKR loss occurs on the human CNOT2 lineage.
      root_cause: NO_FAILURE_NON_CORE
- term:
    id: GO:0001222
    label: transcription corepressor binding
  evidence_type: IDA
  original_reference_id: PMID:16712523
  qualifier: enables
  review:
    summary: CNOT2 binds SMRT/NCoR-HDAC3 corepressor components through its Not-box.
    action: KEEP_AS_NON_CORE
    reason: >-
      The human CNOT2 Not-box interacts with GPS2 and NCoR/SMRT regions, and CNOT2 coimmunoprecipitates with HDAC3
      in overexpressing cells. This supports transcription corepressor binding as a precise nuclear activity, but
      it is contextual beside CNOT2's conserved NOT-module assembly role.
    supported_by:
    - reference_id: PMID:16712523
      supporting_text: We observed physical interactions of CNOT2 with several subunits of the SMRT/NCoR-HDAC3
        complex.
- term:
    id: GO:0001829
    label: trophectodermal cell differentiation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8C5L3
  - ensembl:ENSMUSP00000100902
  review:
    summary: CNOT2 regulates the trophectoderm differentiation context.
    action: KEEP_AS_NON_CORE
    reason: >-
      Mouse ESC depletion/rescue and human H1/H9 depletion show that CNOT2 restrains extraembryonic marker induction.
      Keep this transferred developmental row as a supported non-core context; it should not be read as saying that
      CNOT2 is a trophectoderm lineage determinant.
    supported_by:
    - reference_id: PMID:22367759
      supporting_text: Cnot1, Cnot2, and Cnot3 are important for human ESC maintenance and they mainly, but
        not exclusively, inhibit differentiation into the extraembryonic lineages.
