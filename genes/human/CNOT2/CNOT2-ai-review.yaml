- term:
    id: GO:0004535
    label: poly(A)-specific ribonuclease activity
  evidence_type: IMP
  original_reference_id: PMID:21299754
  qualifier: contributes_to
  review:
    summary: CNOT2 contributes to complex-level poly(A)-specific ribonuclease activity.
    action: ACCEPT
    reason: >-
      The qualifier is contributes_to, and the perturbation evidence shows that CNOT2 depletion destabilizes the
      CCR4-NOT complex and reduces CNOT6L-containing deadenylase activity. This is an appropriate noncatalytic subunit
      contribution rather than a claim that CNOT2 hydrolyzes RNA.
    supported_by:
    - reference_id: PMID:21299754
      supporting_text: CNOT2 depletion destabilizes the complex, resulting in the formation of a complex
        smaller than that formed in control siRNA-treated cells
- term:
