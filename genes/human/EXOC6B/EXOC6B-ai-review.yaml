  review:
    summary: Human Sec15 participation in cytokinesis is positive, but its EXOC6B attribution remains
      unresolved.
    action: UNDECIDED
    reason: 'The cited review discusses mammalian exocyst recruitment to the midbody and cites PMID:16213214.
      That original is now accessible as a reproduced Cell article in a thesis: a human-testis two-hybrid
      screen recovered a sec15 clone, Sec15 immunofluorescence marks the HeLa midbody (Figure 3A5), and
      Results p. 81 reports cytokinesis defects after Sec15 depletion as data not shown. The inspected
      main Methods/Results do not provide the recovered clone accession or a Sec15A-versus-Sec15B distinction;
      the antibody is referred to Yeaman 2003 and the listed siRNA coordinates cover Sec5, Sec8 and snapin
      rather than Sec15. Thus there is meaningful human Sec15/exocyst process evidence, but the specific
      link to EXOC6B is not established by this read. This is an attribution uncertainty, not an assertion
      that cytokinesis is false, that full text is absent, or that every exocyst subunit must itself sever
      the membrane.'
