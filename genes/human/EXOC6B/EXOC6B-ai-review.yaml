description: EXOC6B (Sec15B) is a component of the exocyst, a conserved multisubunit complex that brings
  transport vesicles into contact with the plasma membrane before docking and fusion. Through this complex,
  EXOC6B contributes to intracellular protein delivery, Golgi-to-plasma-membrane transport and exocytosis.
  Human EXOC6B associates with the exocyst subunit EXOC5. Biallelic loss-of-function variants cause spondylo-epi-metaphyseal
  dysplasia with joint laxity type 3, and shortened primary cilia occur in EXOC6B-deficient patient fibroblasts.
