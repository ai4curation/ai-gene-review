  knowledge_gaps:
  - gap_statement: The EXOC6B-specific contribution to membrane bridging and the identity of its direct
      vesicle-recruitment partners remain unresolved within the established exocyst role.
    boundary: Human cellular association assays and verified 811-residue EXOC6B constructs support complex
      incorporation. Mammalian brain biochemistry identifies a Sec15B-containing exocyst, while yeast
      assembly and Dictyostelium membrane-contact experiments provide ortholog evidence. These results
      do not demonstrate autonomous tethering by isolated human EXOC6B or transfer EXOC6/Sec15A-specific
      Rab-binding observations to EXOC6B. The 672-residue natural product has not been functionally equated
      with the 811-residue product. The unresolved cytokinesis and membrane-fission annotations concern
      attribution to the human Sec15 paralog, rather than evidence that the exocyst lacks those roles.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: Identifying the subunit-specific contact would distinguish vesicle recruitment from
      complex assembly and establish which mechanism depends on EXOC6B rather than EXOC6.
    resolution: Combine paralog-specific depletion and controlled rescue with direct membrane-tethering
      assays using compositionally verified exocyst complexes and candidate recruitment partners.
    provenance:
    - reference_id: PMID:27173435
    - reference_id: PMID:11406615
    - reference_id: PMID:22323285
    - reference_id: PMID:15292201
    - reference_id: PMID:16213214
suggested_questions:
- question: Which molecular contact does human EXOC6B contribute to exocyst-mediated membrane tethering,
    and how does it differ from the corresponding EXOC6/Sec15A contribution?
- question: Is the 672-residue EXOC6B product endogenously expressed and incorporated into functional
    exocyst complexes, and how does its altered C-terminal region affect recruitment or assembly?
- question: Does the ciliary phenotype of EXOC6B-deficient human cells arise from altered delivery of
    specific cargo, a secondary turnover response, or another separable activity?
suggested_experiments:
- hypothesis: EXOC6B supports tethering through a specific interface that can be separated experimentally
    from its incorporation into the exocyst.
  description: Compare acute, paralog-specific EXOC6B and EXOC6 depletion with matched-expression rescue
    in human cells. Verify exocyst composition and abundance, and measure vesicle arrival, membrane contact
    and fusion separately. Test compositionally defined complexes with or without EXOC6B, and with interaction-guided
    variants, in a membrane-tethering assay that distinguishes membrane clustering from fusion. Identify
    any candidate Rab or membrane interaction directly rather than inferring it from a shared Sec15 name.
  experiment_type: Paralog-specific rescue and biochemical membrane-tethering analysis
- hypothesis: The natural C-terminal replacement and deletion in the 672-residue product alter its exocyst
    incorporation or vesicle-recruitment properties.
  description: Establish endogenous product-specific transcripts and discriminating peptides before comparing
    Q9Y2D4-1 and Q9Y2D4-2 at matched abundance. Quantify stability, localization, EXOC5 association, complete-complex
    incorporation and rescue of directly measured transport. Keep the natural products distinct from disease-associated
    truncations and from engineered affinity-tag constructs; overexpression alone does not establish physiological
    equivalence.
  experiment_type: Product-resolved expression and controlled functional comparison
- hypothesis: A specific defect in cargo delivery precedes ciliary shortening after EXOC6B loss and can
    be distinguished from downstream changes in protein turnover.
  description: Use isogenic loss and rescue alongside patient-derived human fibroblasts, measuring ciliary
    cargo delivery, cilium length and frequency, and autophagic flux over time. Normalize for cell-cycle
    state and exocyst abundance. Test whether restoring the affected trafficking step rescues the ciliary
    phenotype independently of bulk turnover changes. This separates a causal transport step from secondary
    changes accompanying EXOC6B loss.
  experiment_type: Time-resolved human-cell rescue with cargo transport and turnover measurements
