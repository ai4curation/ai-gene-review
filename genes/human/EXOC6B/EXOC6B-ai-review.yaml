- id: PMID:36150098
  title: Biallelic loss-of-function variants in EXOC6B are associated with impaired primary ciliogenesis
    and cause spondylo-epi-metaphyseal dysplasia with joint laxity type 3.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original identity and title match the genuine normal record (DOI 10.1002/humu.24478;
      PMC7615863). This is an original patient and cell study despite the normal metadata also classifying
      it as a review. Actual Methods, Results and Figures 3–4 were inspected, including figure pixels.
      Patient 1 carries an exon-20-spanning deletion and lacks detectable EXOC6B protein; serum-starved
      fibroblasts show shortened cilia relative to both controls, while frequency is not conclusively
      changed across both comparisons. Patient 2 carries p.Leu134Ter and supplies transcript, RNA-seq
      and osteogenic-differentiation results, not the same ciliary measurement. These findings support
      disease and ciliary context, not a reconstituted human exocytic step, rescue mechanism, or functional
      equivalence of natural products.
- id: PMID:38305850
  title: Early insights into the role of Exoc6B associated with spondyloepimetaphyseal dysplasia with
    joint laxity type 3 in primary ciliogenesis and chondrogenic differentiation in vitro.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Identifier and title verified against the genuine normal record (DOI 10.1007/s11033-023-09114-9).
      The original abstract and publisher figure captions were read; complete Methods/Results and figure
      pixels were not accessible. The ATDC5 model is mouse. Captions describe EXOC6B localization, knockdown-associated
      ciliary and IFT88 changes, Hedgehog signaling and differentiation measurements. This provides contextual
      evidence for the ciliary question; it does not establish a human construct, native-product equivalence,
      or an independently inspected molecular transport step.
  full_text_unavailable: true
- id: PMID:42068746
  title: EXOC6B promotes cilial elongation via autophagy-dependent protein turnover.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Identifier/title and DOI 10.1016/j.bbrc.2026.153828 verified from original publisher/Europe
      PMC metadata and the genuine normal record. Access comprises the abstract and clipped publisher
      Methods/Results, not the complete paper, figures or supplement. The available Methods identify human
      HEK293T cells and a pCMV EXOC6B reagent (Sino Biological HG23270-UT), without a verified insert
      sequence or natural-product assignment. Reported knockout/overexpression ciliary effects and AMPK/mTOR/autophagy
      findings motivate the turnover question; direct cargo degradation, all flux controls and the proposed
      mechanistic chain have not been independently established from the accessible text. No new autophagy
      or ciliogenesis annotation is made.
  full_text_unavailable: true
core_functions:
- description: Contributes to vesicle tethering by the exocyst, supporting protein cargo delivery, Golgi-to-plasma-membrane
    transport and exocytosis. The membrane-bridging activity belongs to the assembled complex; EXOC6B's
    individual membrane- or GTPase-engagement mechanism is not established by the available human association
    assays.
  contributes_to_molecular_function:
    id: GO:7770062
    label: vesicle membrane tethering activity
  directly_involved_in:
  - id: GO:0006886
    label: intracellular protein transport
  - id: GO:0006893
    label: Golgi to plasma membrane transport
  - id: GO:0006887
    label: exocytosis
  in_complex:
    id: GO:0000145
    label: exocyst
