id: O14512
gene_symbol: SOCS7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SOCS7 is a SOCS-box scaffold and Cullin5/ECS substrate receptor that binds phosphotyrosine-containing
  substrates and adaptor proteins through a C-terminal SH2 domain and extended N-terminal proline-rich
  regions. In insulin signaling it associates with INSR and IRS1 and contributes to IRS-protein downregulation,
  while in the Reelin pathway mouse orthology supports CRL5/SOCS7-mediated turnover of phosphorylated
  DAB1 in the developing cortex. Human SOCS7 also shuttles between cytoplasm and nucleus, binds NCK through
  SH3-domain interactions, and can restrain prolactin, growth hormone, and leptin signaling by interacting
  with activated STAT3/STAT5.
