- id: file:human/SOCS7/SOCS7-uniprot.txt
  title: UniProtKB entry O14512 (SOCS7_HUMAN)
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Reviewed UniProt record summarizing SOCS7 CRL5/ECS substrate-receptor function, 
      DAB1/IRS1 degradation, NCK/septin/STAT interactions, and cytoplasm/nucleus/cell-membrane 
      localization.
core_functions:
- description: >-
    Phosphotyrosine-dependent CRL5/ECS substrate-adaptor activity that promotes ubiquitination and proteasomal
    degradation of pathway substrates such as IRS1 and, by mouse orthology, DAB1.
  molecular_function:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  directly_involved_in:
  - id: GO:0016567
    label: protein ubiquitination
  - id: GO:0043161
    label: proteasome-mediated ubiquitin-dependent protein catabolic process
  in_complex:
    id: GO:0031466
    label: Cul5-RING ubiquitin ligase complex
  supported_by:
  - reference_id: file:human/SOCS7/SOCS7-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Substrate-recognition component of a cullin-5-RING E3 ubiquitin-protein ligase 
      complex (ECS complex, also named CRL5 complex), which mediates the ubiquitination and 
      subsequent proteasomal degradation of target proteins, such as DAB1 and IRS1
proposed_new_terms: []
suggested_questions:
- question: Which endogenous human SOCS7 substrates are degraded through the CRL5/ECS complex, and 
    are IRS1 and DAB1 direct degrons in human cells?
suggested_experiments:
- description: Test phospho-IRS1, phospho-DAB1 and phospho-STAT3/5 peptide binding against wild-type
    and SH2-mutant human SOCS7-ElonginBC-CUL5-RBX2, then measure endogenous substrate ubiquitination
    after SOCS7 SOCS-box disruption.
