- term:
    id: GO:0004465
    label: lipoprotein lipase activity
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-1482811
  qualifier: enables
  review:
    summary: Reactome-derived "lipoprotein lipase activity" for the reaction in which PNPLA2/3 hydrolyze diacylglycerol
      at the ER membrane. Lipoprotein lipase activity is defined for hydrolysis of triacylglycerol carried in lipoproteins;
      ATGL is an intracellular lipid-droplet lipase and does not act on circulating lipoproteins.
    action: REMOVE
    reason: The term is a mis-mapping of an intracellular acylglycerol hydrolysis reaction onto the extracellular
      lipoprotein lipase activity term. ATGL activity on diacylglycerol is minor compared with its triacylglycerol
      preference, so no replacement term is proposed; the core activity is captured by GO:0004806.
    supported_by:
    - reference_id: Reactome:R-HSA-1482811
      supporting_text: patatin-like phospholipase domain-containing proteins 2/3 (PNPLA2/3) hydrolyze diacylglycerol
        (DAG)
    - reference_id: PMID:15550674
      supporting_text: It exhibits high substrate specificity for triacylglycerol and is associated with lipid droplets.
