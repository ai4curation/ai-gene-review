core_functions:
- description: 'Triacylglycerol lipase acting on cytoplasmic lipid droplets: hydrolyzes the first ester bond of
    stored triacylglycerol to give diacylglycerol and a fatty acid, the rate-limiting step of intracellular lipolysis.
    Activity depends on the patatin-domain active-site serine and is stimulated by ABHD5/CGI-58. The same hydrolysis
    drives turnover and shrinkage of the droplets themselves in adipose and non-adipose cells, which is why both
    triglyceride catabolism and lipid droplet disassembly are listed here rather than split across two entries:
    catalytically inactive ATGL still targets droplets but cannot reduce them, so the disassembly is a consequence
    of this one activity in this one location.'
