id: Q96AD5
gene_symbol: PNPLA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PNPLA2 encodes adipose triglyceride lipase (ATGL; also desnutrin, iPLA2-zeta, PEDF-R), a patatin-domain
  serine hydrolase that catalyzes the first, rate-limiting step of intracellular triacylglycerol hydrolysis, converting
  triacylglycerol to diacylglycerol and a fatty acid. ATGL acts on the surface of cytoplasmic lipid droplets in
  adipocytes and many non-adipose cells, including skeletal and cardiac muscle, and its activity is strongly stimulated
  by the co-activator ABHD5/CGI-58 and limited by inhibitory partners and ubiquitin-dependent degradation. Purified
  ATGL also shows acylglycerol transacylase activity, which generates fatty acid esters of hydroxy fatty acids,
  and minor phospholipase A2 and retinyl ester hydrolase activities. Biallelic loss-of-function variants cause neutral
  lipid storage disease with myopathy, with triacylglycerol accumulation in muscle, heart and leukocytes.
