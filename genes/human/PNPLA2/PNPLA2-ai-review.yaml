  supported_by:
  - reference_id: PMID:15550674
    supporting_text: a second enzyme, adipose triglyceride lipase (ATGL), catalyzes the initial step in triglyceride
      hydrolysis
  - reference_id: PMID:15550674
    supporting_text: It exhibits high substrate specificity for triacylglycerol and is associated with lipid droplets.
  - reference_id: PMID:16150821
    supporting_text: All four proteins show lipase activity in vitro, which is dependent on the presence of the
      active site serine for Adiponutrin, Desnutrin/ATGL, and GS2.
  - reference_id: PMID:16679289
    supporting_text: CGI-58 interacts with ATGL, stimulating its TG hydrolase activity up to 20-fold.
  - reference_id: PMID:17187067
    supporting_text: The block in triglyceride degradation was mimicked by short interfering RNA directed against
      ATGL.
  - reference_id: PMID:16239926
    supporting_text: Overexpression of wild-type ATGL causes a marked decrease in LD size, whereas a catalytically
      inactive mutant retains the ability to localize to LDs, but is unable to decrease their size.
  - reference_id: PMID:16239926
    supporting_text: Depletion of ATGL by RNA interference leads to a significant increase in the size of LDs.
suggested_questions:
- question: How much of ATGL-dependent FAHFA synthesis and acylglycerol transacylation occurs in human adipose tissue
    relative to its lipase flux, and should a FAHFA biosynthetic process annotation be added?
- question: Is the PEDF-R plasma-membrane receptor model of PNPLA2 compatible with its lipid-droplet localization,
    or does it reflect a distinct pool or isoform?
suggested_experiments:
- description: Quantify the residual triacylglycerol hydrolase and transacylase activities of NLSDM patient missense
    and C-terminally truncated ATGL variants in purified form with and without ABHD5, to separate catalytic loss
    from loss of lipid-droplet targeting.
