gene_symbol: TINCR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TINCR encodes an 87-amino-acid ubiquitin-like microprotein (also called TUBL or pTINCR)
  translated from the main open reading frame of the TINCR transcript on chromosome 19,
  which was long classified as the long noncoding RNA "terminal differentiation-induced
  ncRNA". The protein is a single beta-grasp ubiquitin-like domain with a C-terminal
  SUMO-interacting motif; it is conserved in mammals, has been detected in the cornified
  stratum corneum and in other epithelia, and is induced by keratinocyte differentiation and
  by UV-induced DNA damage in a TP53-dependent manner. Endogenous protein is found in the
  nucleus and at cell-cell junctions, and overexpressed protein is also cytoplasmic. It binds
  SUMO1 and SUMO2/3 non-covalently through its SIM and associates with the Rho GTPase CDC42,
  increasing CDC42 SUMOylation and GTP loading, which promotes actin remodelling, junction
  formation and epithelial (keratinocyte) differentiation. Loss of the protein delays skin
  wound closure in mice and accelerates UVB-induced squamous cell carcinoma, and its
  expression suppresses growth of squamous carcinoma cells; in normal keratinocytes it has
  instead been reported to promote cell-cycle progression.
