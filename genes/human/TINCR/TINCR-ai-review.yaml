core_functions:
- description: >-
    SUMO-binding ubiquitin-like microprotein that promotes epithelial (keratinocyte)
    differentiation. Through its C-terminal SUMO-interacting motif it binds SUMO1/2/3 and
    associates with CDC42, increasing CDC42 SUMOylation and GTP loading, which drives actin
    remodelling, cell-cell junction formation and expression of differentiation markers.
  molecular_function:
    id: GO:0032183
    label: SUMO binding
  directly_involved_in:
  - id: GO:0030858
    label: positive regulation of epithelial cell differentiation
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0070161
    label: anchoring junction
  supported_by:
  - reference_id: PMID:36369429
    supporting_text: GST-pull down assays confirmed that pTINCR binds to SUMO1 and SUMO2/3 in
      a non-covalent manner and that the interaction is lost in the pTINCR-SIMmut
  - reference_id: PMID:36369429
    supporting_text: In particular, pTINCR increases CDC42 SUMOylation and promotes its activation,
      leading to epithelial differentiation and tumor suppression.
suggested_questions:
- question: How does a non-catalytic SUMO-binding ubiquitin-like protein increase CDC42
    SUMOylation? Does it recruit a SUMO E2/E3 to CDC42, protect SUMO-CDC42 from SENPs, or
    act as a SUMO-loaded adaptor? The answer decides whether an adaptor or enzyme-regulator
    MF term is appropriate.
- question: Why does the protein promote proliferation in normal keratinocytes (PMID:34351912)
    but suppress proliferation in transformed epithelial and squamous carcinoma cells
    (PMID:36369429, PMID:36899004)?
- question: Is the CDC42 interaction direct? Only co-immunoprecipitation has been shown, so a
    small GTPase binding MF is not yet asserted.
suggested_experiments:
- hypothesis: pTINCR binds CDC42 directly and SUMO-dependently.
  description: Binding assays with purified pTINCR (wild type and SIM mutant), SUMO2 and CDC42
    in GDP and GTP states, plus in vitro SUMOylation of CDC42 with and without pTINCR.
- hypothesis: The differentiation and proliferation phenotypes reflect one pathway acting in
    different cell states.
  description: Compare start-codon knockout and SIM mutant knock-in in primary human
    keratinocytes, measuring cell-cycle progression, CDC42-GTP and differentiation markers in
    the same cells.
