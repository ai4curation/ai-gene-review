  review:
    summary: Transfer from mouse, where ORF-frameshift (TUBL-deficient) mice show delayed skin
      wound closure associated with reduced keratinocyte proliferation.
    action: KEEP_AS_NON_CORE
    reason: >-
      The mouse phenotype is protein-specific and the ortholog is conserved, so the transfer is
      reasonable. It is a tissue-level outcome downstream of the keratinocyte effects, the
      delay is transient (days 4-10), and there is no human wound-healing evidence, so it is
      non-core.
    supported_by:
