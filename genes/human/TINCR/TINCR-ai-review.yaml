- term:
    id: GO:0010838
    label: positive regulation of keratinocyte proliferation
  evidence_type: IMP
  original_reference_id: PMID:34351912
  qualifier: involved_in
  review:
    summary: In normal human epidermal keratinocytes, siRNA depletion of TINCR (and with it
      TUBL) reduced S-phase cells and TUBL overexpression increased them; in mouse keratinocytes
      an ORF frameshift that preserves RNA structure abolished the pro-proliferative effect,
      and frameshift mice showed reduced keratinocyte proliferation during wound repair.
    action: KEEP_AS_NON_CORE
    reason: >-
      The experiments are sound and protein-specific (frameshift controls), so the
      annotation stands. It is kept as non-core because the effect is context dependent and
      without a molecular mechanism: in transformed epithelial cells and squamous carcinoma the
      same protein decreases proliferation (PMID:36369429, PMID:36899004), and the
      best-characterised molecular activity of the protein (SUMO binding and CDC42 activation)
      is linked to differentiation rather than proliferation.
    supported_by:
    - reference_id: PMID:34351912
      supporting_text: Expression of WT or SM forms of TINCR resulted in a marked increase in the
        percentage of cells in S phase of the cell cycle, whereas expression of WT_del or SM_del
        forms had no such effect
    - reference_id: PMID:34351912
      supporting_text: In addition, we found that the proportion of cells in S phase of the cell
        cycle was markedly decreased for NHEKs transfected with the siRNAs targeting both TINCR
        and TUBL compared with those transfected with control siRNAs
    - reference_id: PMID:36369429
      supporting_text: In addition, pTINCR reinforces cell-to-cell junctions and decreases proliferation.
