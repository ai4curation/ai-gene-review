        compared with WT control animals
- term:
    id: GO:0032183
    label: SUMO binding
  evidence_type: IDA
  original_reference_id: PMID:36369429
  review:
    summary: GST pull-down shows that pTINCR binds SUMO1 and SUMO2/3 non-covalently, and the
      binding is lost when the SUMO-interacting motif (VLLL79-82AAAA) is mutated. The SIM
      mutant is less stable, does not activate CDC42 and does not reproduce pTINCR's cellular
      effects.
    action: NEW
    reason: >-
      Direct, motif-dependent binding of the human protein, and the motif is required for its
      function, so this is the most specific molecular activity that can be stated. It is an
      intrinsic activity of TINCR, not inferred from a complex. No existing annotation covers
      a molecular function.
    supported_by:
    - reference_id: PMID:36369429
      supporting_text: GST-pull down assays confirmed that pTINCR binds to SUMO1 and SUMO2/3 in
        a non-covalent manner and that the interaction is lost in the pTINCR-SIMmut
    - reference_id: PMID:36369429
      supporting_text: Interestingly, mutating the pTINCR SIM-domain or treating with a SUMOylation
        inhibitor impair the ability of pTINCR to activate CDC42
- term:
    id: GO:0030858
    label: positive regulation of epithelial cell differentiation
  evidence_type: IMP
  original_reference_id: PMID:36369429
  review:
    summary: Start-codon knockout of pTINCR (lncRNA preserved) in HaCaT keratinocytes and MCF7
      cells blocks calcium- and DNA-damage-induced differentiation, partially rescued by a
      synthetic ORF; overexpression induces differentiation markers, dependent on CDC42.
    action: NEW
    reason: >-
      Participation test: this is a regulation term, and pTINCR is itself the regulator, acting
      through binding SUMO and CDC42 and increasing CDC42 activation; the effect was separated
      from the RNA with a start-codon mutant and a recoded ORF. A keratinocyte-specific child
      (GO:0045618) was not chosen because MCF7 mammary cells were also used. Note that Nita et
      al. (PMID:34351912) saw no differentiation effect with two of three TINCR siRNAs in
      NHEKs, so the finding comes from one group.
    supported_by:
    - reference_id: PMID:36369429
      supporting_text: By contrast, pTINCR-KO cells failed to activate CDC42 and to differentiate
        (measured by the expression of INVOLUCRIN) upon exposure to differentiation conditions,
        despite having a functional TINCR lncRNA
    - reference_id: PMID:36369429
      supporting_text: Remarkably, this effect was partially reverted upon pTINCR re-expression
        in pTINCR-KO cells (pTINCR-KO + OE), demonstrating that it is pTINCR microprotein and
        not the lncRNA that is responsible for CDC42 activation during differentiation.
