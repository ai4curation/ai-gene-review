- term:
    id: GO:0038187
    label: pattern recognition receptor activity
  evidence_type: IDA
  original_reference_id: PMID:39914456
  qualifier: enables
  review:
    summary: >-
      Pattern recognition receptor activity, attributed to the complement study, which did not test a
      microbial pattern.
    action: ACCEPT
    reason: >-
      The term is right for granzyme K but this row's citation does not support it, and the mismatch is
      traceable to a UniProt statement rather than to a curator's reading. GO:0038187 requires combining
      with a pathogen-associated molecular pattern to initiate an innate immune response. Granzyme K
      does exactly that, but the evidence is in the LPS study, not here: it binds Gram-negative bacteria
      and LPS, disaggregates LPS from micelles, augments LPS-CD14 complex formation, and thereby boosts
      monocyte activation, with no requirement for catalysis. That is a soluble pattern-recognition
      function. The cited complement paper instead shows charge-driven binding to heparan sulfate on
      host endothelial cells, synovial fibroblasts and monocytes; read in full it never tests a
      microbial surface, and the only mention of pattern recognition receptors in it is background
      describing the soluble receptors that initiate the classical and lectin pathways, which the
      authors explicitly contrast with granzyme K. So the row is kept with its support re-pointed to
      the paper that establishes it, and the UniProt wording that produced the confusion is recorded as
      a source defect.
    supported_by:
    - *id013
    - &id016
      reference_id: PMID:24711407
      supporting_text: GrK disaggregates LPS from micelles and augments LPS-CD14 complex formation
    source_defects:
    - defect_type: WRONG_STATEMENT
      resource: UNIPROT
      record: UniProtKB:P49863
      slot: CC:FUNCTION
      requested_change: CHECK
      asserted_value: First acts as a pattern recognition receptor, which specifically recognizes and
        binds heparan sulfate glycosaminoglycans on the pathogen surface to drive opsonization (PubMed:39914456)
      corrected_value: GZMK binds heparan sulfate glycosaminoglycans on host plasma membranes (PubMed:39914456);
        separately, GZMK binds Gram-negative bacteria and LPS (PubMed:24711407)
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        Two problems in one sentence, and they look like a conflation of two papers rather than a
        misreading of one. Heparan sulfate glycosaminoglycans are host molecules and are not displayed
        on bacterial surfaces, so "on the pathogen surface" cannot be right for the binding the cited
        paper reports; read in full, PubMed:39914456 shows the binding on human endothelial cells,
        synovial fibroblasts and monocytes and never assays a microbe. The pathogen-binding half of the
        statement is true of granzyme K but comes from PubMed:24711407, which is cited elsewhere in the
        same FUNCTION block. Recorded as CHECK rather than a confident correction because the fix is a
        question of how to split the sentence between its two sources, which is UniProt's call; the
        full text of the complement paper was read for this assessment.
