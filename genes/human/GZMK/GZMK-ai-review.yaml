id: P49863
gene_symbol: GZMK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Granzyme K is a tryptase-like serine protease of CD8 T cells, cleaving after arginine, and one of the
  two tryptic granzymes alongside granzyme A. It was long read as a cytotoxin: delivered into a target
  cell it cleaves Bid, damaging the outer mitochondrial membrane so that cytochrome c and endonuclease G
  are released, and it kills without caspases. That arm is real but is no longer where the protein's
  importance lies. Granzyme K is secreted constitutively, without T-cell receptor stimulation, and most
  of what it does happens outside the cell. Being strongly cationic, it binds heparan sulfate
  glycosaminoglycans on plasma membranes, which anchors it where its substrates are; from there it
  cleaves complement C2 and C4, and the C4b and C2b fragments assemble a C3 convertase that drives the
  rest of the cascade to C3a, C5a, C4b, C3b and the membrane attack complex. This is a route into
  complement independent of the classical, lectin and alternative pathways, driven entirely by a
  lymphocyte protease, and GO now names it the GZMK pathway. The protease also cleaves the
  protease-activated receptors PAR1 and PAR2 at their canonical arginine, which releases IL-6 and IL-8
  from epithelial cells and fibroblasts through beta-arrestin and ERK rather than a calcium flux, and it
  binds Gram-negative bacteria and their LPS, disaggregating LPS micelles and boosting monocyte
  activation without any catalysis at all. The consequences are inflammatory rather than cytotoxic:
  GZMK-expressing CD8 T cells accumulate in rheumatoid synovium, nasal polyps and ageing tissue, and
  mice lacking Gzmk are protected from arthritis and dermatitis.
