  review:
    summary: >-
      Direct assay through peptide and protease proteomic screens that mapped the tryptase specificity.
    action: ACCEPT
    reason: >-
      Core, and this is the row that pins down what kind of protease granzyme K is. Granzyme K and
      granzyme A are the two tryptase-like granzymes, cleaving after arginine, and the screens here
      separated them: the two cleave SET at similar sites but hnRNP K with different kinetics, and
      granzyme K alone cleaves beta-tubulin, after two distinct arginines. The paper also found no clear
      consensus around P1, concluding that specificity comes from exosite interactions rather than from
      the P1 pocket alone, which is worth carrying because it explains how one tryptase can pick out
      substrates as different as beta-tubulin and complement C2.
    supported_by:
    - *id001
    - &id003
      reference_id: PMID:19059912
      supporting_text: GrK, but not GrA, cleaved the microtubule network protein beta-tubulin after two
        distinct Arg residues
