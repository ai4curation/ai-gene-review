core_functions:
- molecular_function:
    id: GO:0004252
    label: serine-type endopeptidase activity
  description: >-
    A tryptase, cleaving after arginine, whose specificity comes less from the P1 pocket than from
    exosite contacts with the substrate - which is how one enzyme picks out targets as unalike as
    beta-tubulin, a protease-activated receptor and complement C2. Two uses of the activity are
    established and they point in opposite directions. Inside a target cell it is destructive: Bid is
    cleaved to tBid, the outer mitochondrial membrane is breached, cytochrome c and endonuclease G come
    out, and the death needs no caspases. Outside the cell it is activating, and this is now the better
    supported arm: cleaving C2 and C4 on a membrane the protease has bound through heparan sulfate
    builds a C3 convertase and runs the whole complement cascade, and cleaving PAR1 and PAR2 at their
    canonical arginine makes epithelial cells and fibroblasts release IL-6 and IL-8. A third activity
    needs no catalysis: granzyme K binds Gram-negative bacteria and LPS and amplifies LPS-driven
    monocyte activation, so part of what this protein does is not proteolysis at all.
  directly_involved_in:
  - id: GO:0160257
    label: complement activation, GZMK pathway
  - id: GO:0050729
    label: positive regulation of inflammatory response
  - id: GO:0031638
    label: zymogen activation
  - id: GO:0051604
    label: protein maturation
  - id: GO:0008228
    label: opsonization
  - id: GO:0006508
    label: proteolysis
  locations:
  - id: GO:0005576
    label: extracellular region
  - id: GO:0009986
    label: cell surface
  - id: GO:0044194
    label: cytolytic granule
  supported_by:
  - *id008
  - *id009
  - *id004
  - *id013
  knowledge_gaps:
  - gap_kind:
    - BIOLOGY
    gap_statement: >-
      What granzyme K is for physiologically is unsettled. Every in vivo demonstration is of damage -
      arthritis, dermatitis, asthma, nasal polyps, inflammaging - and the two papers behind the GZMK
      complement pathway are both disease studies, so the protective role such a pathway would be
      expected to have, and against what, has not been shown. The LPS and bacterial binding points one
      way, but that arm needs no catalysis and has not been tested in infection in vivo.
    dark_aspect: BP_DARK
  - gap_kind:
    - BIOLOGY
    gap_statement: >-
      Whether the intracellular cytotoxic arm matters at physiological concentrations is open. Bid
      cleavage and the caspase-independent death that follows are well demonstrated, but granzyme K is
      secreted constitutively and most of its documented activity is extracellular, and no study has
      measured how much of a target cell's death during real killing is attributable to this protease
      rather than to granzyme B or perforin.
    dark_aspect: BP_DARK
