suggested_questions:
- question: >-
    GO:0160257 complement activation, GZMK pathway is defined as a pathway "which allows for the direct
    killing of microbes and the regulation of other immune processes", but neither paper behind the term
    shows microbial killing: both are disease studies, in rheumatoid synovium and in airway
    inflammation, and the GZMK-deficient mouse phenotype is protection from arthritis and dermatitis.
    Should the definition be re-worded to describe what was demonstrated, with the antimicrobial role
    stated as expected rather than established?
- question: >-
    Granzyme K cleaves and activates PAR1 and PAR2, and that is how it makes epithelial cells and
    fibroblasts release IL-6 and IL-8, but nothing in the GO record says so. The obvious term,
    GO:0070493 thrombin-activated receptor signaling pathway, is defined as being initiated by thrombin
    binding its receptor, so it does not fit a different protease cleaving the same receptor. Is a
    protease-activated-receptor activation term needed, or is this best left to protein maturation plus
    an annotation extension naming the receptor?
- question: >-
    Granzyme K binds Gram-negative bacteria and LPS and amplifies monocyte activation with no
    requirement for catalysis, which makes part of this protein's function non-enzymatic. How should a
    record represent an activity that depends on the protein but not on its active site, when every
    molecular-function term it carries is about proteolysis?
- question: >-
    Thrombin carries no annotation to positive regulation of inflammatory response or to the
    interleukin-production terms, even though it activates the same receptors; GO annotates the receptor
    and the downstream signalling instead. Granzyme K now carries five inflammatory-response rows on the
    strength of genetic and in vivo evidence. Is that a deliberate distinction, or should the convention
    for receptor-activating proteases be revisited now that one of them has a knockout phenotype?
suggested_experiments:
- hypothesis: >-
    The GZMK complement pathway is protective against infection, and the inflammatory phenotypes
    described so far are what it looks like when it runs in the wrong tissue.
  description: >-
    Challenge Gzmk-deficient and wild-type mice with Gram-negative bacteria by routes that engage
    tissue CD8 T cells, and measure bacterial burden, complement deposition on the organisms and
    survival, with a catalytically inactive Gzmk knock-in as the discriminating control. Every in vivo
    result for this protease is currently a disease model, so a protective readout is the missing half
    of the picture and is what the term's own definition assumes.
  experiment_type: Infection challenge in Gzmk-null and catalytically dead knock-in mice
- hypothesis: >-
    The non-catalytic LPS-binding arm and the proteolytic complement arm are separable, and they
    contribute to inflammation independently.
  description: >-
    Compare wild-type granzyme K with an active-site mutant in the LPS-CD14 and monocyte-activation
    assays and in the complement-activation assay side by side, then test both proteins in the
