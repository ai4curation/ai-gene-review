  review:
    summary: IBA heme transmembrane transporter activity for the HRG1 clade (PTN002418776), seeded by
      mouse, human, worm and zebrafish members.
    action: ACCEPT
    reason: Function placed at the HRG clade node with experimental support from nematode, fish and mammalian
      members; the human gene is among the donors because it has its own experimental evidence. Heme transmembrane
      transporter activity is the core molecular function of HRG1. Human and worm HRG-1 bind and transport
      heme; human HRG1 rescues heme-dependent growth of heme-synthesis-deficient (hem1-deletion) yeast
      at sub-micromolar heme, a TMD2 histidine is required, and the population variant P36L abolishes
      transport. In vivo, loss of the mouse ortholog traps heme in macrophage lysosomes as hemozoin, and
      zebrafish Hrg1a/Hrg1b are functional heme transporters. UniProt records the reaction heme b(in)
      = heme b(out) (RHEA:75443).
    supported_by:
