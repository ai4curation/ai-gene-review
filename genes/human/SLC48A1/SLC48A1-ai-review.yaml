id: Q6P1K1
gene_symbol: SLC48A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC48A1 (HRG1) is a small (146 aa) multi-pass membrane protein of the HRG family that transports
  heme across endolysosomal membranes. Discovered as the heme-responsive permease of the heme-auxotrophic
  nematode C. elegans, the human protein binds and transports heme, with a conserved histidine in the
  second transmembrane segment required for activity. It resides in late endosome and lysosome membranes
  and is strongly expressed in reticuloendothelial macrophages, where it is induced by heme and recruited
  to the phagolysosomal membrane during erythrophagocytosis to move heme released from digested hemoglobin
  into the cytosol for degradation by heme oxygenase and recycling of its iron. Loss of the mouse ortholog
  traps heme in enlarged macrophage lysosomes as crystalline hemozoin and impairs heme-iron recycling,
  and the zebrafish orthologs are needed for kidney macrophage heme-iron recycling. SLC48A1 is also highly
  expressed in myelinating oligodendrocytes, where heme import supports myelin integrity. A role in V-ATPase
  assembly and endosomal acidification has been reported in cultured cells.
