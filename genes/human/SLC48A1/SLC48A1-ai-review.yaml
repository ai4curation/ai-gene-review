suggested_questions:
- question: What is the transport mechanism of HRG1 (uniporter, coupled to protons, or channel-like),
    and is transport driven by the lysosomal pH gradient? No structure or reconstituted-liposome transport
    assay has been reported.
- question: Does HRG1 genuinely associate with and regulate the V-ATPase (c subunit), as reported in HeLa
    and cancer cells, and is that association needed for heme export? The localization and topology reported
    in those studies conflict with macrophage data.
- question: Do loss-of-function SLC48A1 variants (e.g. P36L) cause iron disorders or hemozoin accumulation
    in humans?
- question: In oligodendrocytes, does HRG1 import heme across the plasma membrane or export it from endolysosomes
    after endocytic uptake?
suggested_experiments:
- hypothesis: HRG1 is sufficient for heme translocation and its activity depends on the pH gradient across
    the lysosomal membrane.
  description: Reconstitute purified human HRG1 (wild type, P36L and TMD2 histidine mutants) into proteoliposomes
    and measure heme or fluorescent heme-analog translocation under imposed pH gradients and membrane
    potentials.
  experiment_type: in vitro transport assay
- hypothesis: Human SLC48A1 loss-of-function causes macrophage heme sequestration.
  description: Generate SLC48A1-knockout human iPSC-derived macrophages, feed senescent red cells and
    quantify lysosomal heme/hemozoin, HMOX1 induction and ferroportin-dependent iron export, with rescue
    by wild-type versus P36L HRG1.
  experiment_type: genetic knockout with rescue
