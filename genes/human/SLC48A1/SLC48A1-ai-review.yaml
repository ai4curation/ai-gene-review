      supporting_text: mutation of the synonymous histidine in TMD2 of hHRG-1 eliminates heme transport
        activity
    - reference_id: PMID:30248094
      supporting_text: we show that zebrafish Hrg1a and its paralog Hrg1b are functional heme transporters
