  review:
    summary: IBA heme transport for the HRG1 clade (PTN002418776).
    action: MODIFY
    reason: 'HRG1 moves heme across a membrane, so the process is correct, but GO:0015886 heme transport
      is broader than the evidence supports. The specific process is heme transmembrane transport (GO:0035351),
      and in macrophages the physiological direction is from the (phago)lysosomal lumen to the cytosol,
      i.e. heme export from vacuole to cytoplasm (GO:0140357, a descendant of GO:0035351 via vacuolar
      transmembrane transport). Both are proposed: GO:0035351 covers the general transport demonstrated
      in yeast and cultured cells; GO:0140357 captures the in vivo role shown by knockdown in macrophages
      and by heme/hemozoin accumulation in lysosomes of Slc48a1-null mice.'
    proposed_replacement_terms:
    - &id010
