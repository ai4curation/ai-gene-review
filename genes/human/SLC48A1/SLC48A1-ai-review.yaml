  review:
    summary: ARBA machine-learning mapping placing HRG1 in the lysosome.
    action: ACCEPT
    reason: 'Root organelle term (lysosome) from an electronic rule. Checked against the experimental
      record rather than the rule: human and worm HRG1 co-localize with LAMP1 in HEK293 cells, endogenous
      mouse Hrg1 is endolysosomal and co-localizes with Lamp1 on phagolysosomes during erythrophagocytosis,
      and Slc48a1-null macrophages accumulate heme in LAMP1-positive lysosomes. The organelle claim holds.
      Per the organelle policy the root term is kept; the membrane sub-compartment is already captured
      by the lysosomal membrane rows. One study (PMID:19875448) found overexpressed HA-HRG-1 in endosomes
      but not LAMP1-positive lysosomes in HeLa cells, but the weight of evidence, including endogenous
      protein in macrophages, supports lysosomal residence.'
