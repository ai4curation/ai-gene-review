core_functions:
- description: Heme transmembrane transport from the lumen of (phago)lysosomes into the cytosol. HRG1
    is a four-TM heme permease that binds heme and moves it across endolysosomal membranes; in reticuloendothelial
    macrophages it is recruited to the phagolysosomal membrane during erythrophagocytosis and exports
    heme liberated from digested hemoglobin to the cytosol, where heme oxygenase releases its iron for
    recycling. Loss of function traps heme in lysosomes as hemozoin.
  molecular_function:
    id: GO:0015232
    label: heme transmembrane transporter activity
