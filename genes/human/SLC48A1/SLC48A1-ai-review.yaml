  review:
    summary: IBA plasma membrane (PTN002418776), seeded by human SLC48A1 and C. elegans hrg-4.
    action: KEEP_AS_NON_CORE
    reason: 'The PAINT node includes the worm plasma-membrane paralog HRG-4 as a donor; the human gene
      also carries its own IDA. A minor plasma-membrane pool is supported: O''Callaghan et al. detected
      HRG-1 at the surface of live HeLa cells by flow cytometry, increased by serum starvation, and Fogarty
      et al. found surface HRG-1 in invasive cancer cell lines. In the C. elegans family the plasma-membrane
      heme importer is the paralog HRG-4, whereas HRG-1 itself is endolysosomal, and the physiological
      function of mammalian HRG1 (heme export from the phagolysosome) is at the lysosomal membrane. The
      location is plausible (transit through the plasma membrane is expected for a di-leucine-sorted endolysosomal
      protein, and heme uptake assays in cultured cells are consistent with some surface activity) but
      peripheral to the core function.'
    supported_by:
