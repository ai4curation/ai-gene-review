  label: Homo sapiens
description: >-
  PHRF1 (PHD and RING finger domain-containing protein 1, KIAA1542) is a large (1649 aa), largely
  disordered nuclear protein with an N-terminal RING-type zinc finger (residues ~108-149, annotated as
  degenerate) followed by a PHD finger (~183-233) and a C-terminal SCAF11-like region; the rat ortholog
  (rA9) was isolated as a protein binding the C-terminal domain of RNA polymerase II. Its PHD finger is a
  reader of the extreme N-terminus of histone H3, binding H3 tails and nucleosomes that are unmodified at
  H3K4 (low-micromolar affinity) and losing all binding when the cancer-associated P221L substitution is
  introduced; an earlier report of H3K36me2/3 binding is now attributed to N-terminal engagement. The RING
  domain confers E3 ubiquitin ligase activity in cells: a C108A RING mutant fails to restore substrate
  ubiquitination. Reported substrates are TGIF (ubiquitinated at K130 and degraded, releasing cPML to promote
  TGF-beta/Smad2 cytostatic signalling), PARP1 (polyubiquitinated for proteasomal degradation) and TopBP1
  (mono-ubiquitinated at K73, enhancing TopBP1-ATR interaction and ATR-Chk1 signalling under replication
  stress); p53 has also been proposed. PHRF1 is found in nuclear speckles, partly in Cajal bodies, and is
  rapidly and transiently recruited to DNA damage sites in a PHD- and CK2-site (SDTE motif)-dependent manner,
  where it binds NBS1 and promotes non-homologous end-joining. Loss of PHRF1 impairs DNA damage repair and
  alters transcription and alternative splicing. PHRF1 lies in the 11p15.5 tumour-suppressor region and is
  deleted or silenced in many breast cancers; conditional knockout mice die early.
