suggested_questions:
- question: Which E2 enzyme(s) partner with the PHRF1 RING, and can purified PHRF1 RING-PHD ubiquitinate
    TopBP1, TGIF or PARP1 in a fully reconstituted reaction given that UniProt annotates the RING as degenerate?
- question: How do the substrate outcomes differ (mono-ubiquitination of TopBP1 vs degradative ubiquitination
    of TGIF and PARP1), and are they governed by different chain types or E2s?
- question: Does human PHRF1 bind the RNA polymerase II CTD directly (and in which phosphorylation state),
    and is this how it influences splicing in nuclear speckles?
- question: Which functions of PHRF1 are conserved in its fungal relatives in PANTHER subfamily PTHR12618:SF20
    (e.g. S. pombe asr1), which retain the RING and PHD region but lack most of the long disordered mammalian
    region? The TGIF/cPML axis is vertebrate-specific and should not be transferred.
suggested_experiments:
- description: In vitro ubiquitination with purified PHRF1 RING-PHD (WT vs C108A), an E2 panel, and purified
    TopBP1/TGIF/PARP1 to establish direct E3 activity and chain type.
- description: CTD-peptide binding assays (unphosphorylated, Ser2P, Ser5P) with human PHRF1 fragments, combined
    with mapping of the CTD-binding region.
- description: Complementation of PHRF1-knockout cells with chimeric or truncated proteins limited to the conserved
    RING-PHD region to test which DDR and splicing functions the shared core (as found in fungal SF20 members)
    can perform.
