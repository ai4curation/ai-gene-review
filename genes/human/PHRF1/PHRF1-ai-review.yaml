    - reference_id: PMID:40052822
      supporting_text: PHRF1 is recruited to DNA lesions in a manner dependent on its PHD domain and histone
        methylation
- term:
    id: GO:2001034
    label: positive regulation of double-strand break repair via nonhomologous end joining
  evidence_type: IMP
  original_reference_id: PMID:25855964
  review:
    summary: PHRF1 knockdown lowers and overexpression raises plasmid end-joining efficiency; PHD and SDTE
      mutants and an NBS1-binding-deficient mutant fail to promote NHEJ.
    action: NEW
    reason: PHRF1 is recruited to the break, binds NBS1 and ubiquitinates PARP1, so it acts at the lesion
      rather than indirectly; but it is not a core NHEJ enzyme and its effect is modulatory in reporter assays,
      so a positive-regulation term is used rather than direct involvement in NHEJ itself. Evidence comes from
      one laboratory; the broader DNA-damage-repair role is independently supported by knockout studies.
    supported_by:
    - reference_id: PMID:25855964
      supporting_text: The results showed that end-joining activity was significantly reduced in PHRF1-knockdown
        cells, but increased in PHRF1-overexpressing cells compared with control cells
    - reference_id: PMID:25855964
      supporting_text: indicating that both PHD domain and SDTE motif in PHRF1 are required to promote NHEJ repair
- term:
    id: GO:0030511
    label: positive regulation of transforming growth factor beta receptor signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:23911286
  review:
    summary: PHRF1 ubiquitinates and degrades the TGF-beta/Smad repressor TGIF, releasing cPML to the cytoplasm
      where it coordinates Smad2 activation; PHRF1 depletion blocks TGIF decay and Smad2 phosphorylation in
      APL blasts, which TGIF depletion rescues.
    action: NEW
    reason: PHRF1's own catalytic step (TGIF ubiquitination) is the regulatory act, and epistasis (TGIF depletion
      rescues Smad2 phosphorylation in PHRF1-depleted cells) places it upstream of TGF-beta receptor-mediated
      Smad2 activation. Supported by two papers from one laboratory (the 2013 study is abstract-only in our
      cache) and consistent with the reduced TGF-beta responses of forebrain-specific knockout mice. Tumour
      suppression, APL formation and dendritic/memory phenotypes are downstream organismal consequences and
      are not annotated.
    additional_reference_ids:
    - PMID:25683711
    supported_by:
    - reference_id: PMID:23911286
      supporting_text: PHRF1 ensures redistribution of cPML into the cytoplasm, where it associates with SARA
        and coordinates activation of Smad2 by the TGF-β receptor
    - reference_id: PMID:25683711
      supporting_text: depleting TGIF restored RA-induced Smad2 phosphorylation in cells depleted for PHRF1 (Figure
        3C), reinforcing the hypothesis that PHRF1 influences the PML-RARα/cPML/Smad2 axis by enforcing TGIF degradation
