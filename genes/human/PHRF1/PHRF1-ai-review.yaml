- term:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  evidence_type: IMP
  original_reference_id: PMID:40052822
  review:
    summary: PHRF1 acts as a RING E3 ubiquitin ligase. It mono-ubiquitinates TopBP1 at K73, and a catalytically
      inactive RING mutant (C108A) cannot restore TopBP1 ubiquitination in PHRF1-knockout cells. It also drives
      TGIF ubiquitination at K130 and PARP1 polyubiquitination, the latter dependent on the RING domain.
    action: NEW
    reason: Three independent human studies, from different laboratories and on different substrates, show
      RING-dependent substrate ubiquitination by PHRF1, and mutation of the first RING cysteine (C108A) abolishes
      activity. The evidence is cell-based (overexpression, knockout-rescue, denaturing His-ubiquitin pull-downs)
      rather than a fully reconstituted assay with purified components, and UniProt annotates the RING as degenerate,
      so the direct catalytic mechanism (E2 partner, chain type) is still to be defined. This is the activity
      underlying most PHRF1 biology and was missing from GOA.
    additional_reference_ids:
    - PMID:23911286
    - PMID:25855964
    supported_by:
    - reference_id: PMID:40052822
      supporting_text: Only WT PHRF1 restored TopBP1 ubiquitination, whereas neither the C108A nor S925A mutant
        was able to do so (Fig. 4F). These results indicate that both the E3 ligase activity and phosphorylation
        of PHRF1 are essential for TopBP1 ubiquitination.
    - reference_id: PMID:23911286
      supporting_text: we identify PHRF1 as a ubiquitin ligase that enforces TGIF decay by driving its ubiquitination
        at lysine 130
    - reference_id: PMID:25855964
      supporting_text: indicating that the RING domain of PHRF1 is responsible for the ubiquitination of PARP1
        in vivo
- term:
    id: GO:0006513
    label: protein monoubiquitination
  evidence_type: IMP
  original_reference_id: PMID:40052822
  review:
    summary: PHRF1 mono-ubiquitinates TopBP1 at K73 without affecting TopBP1 stability, enhancing the TopBP1-ATR
      interaction.
    action: NEW
    reason: PHRF1 is the E3 that performs the step (participation, not mere requirement); the RING mutant
      is inactive. Of the reported PHRF1 ubiquitination outcomes this is the best-characterised mechanistically
      (site mapped, mono- versus poly- distinguished).
    supported_by:
    - reference_id: PMID:40052822
      supporting_text: PHRF1 mono-ubiquitinates TopBP1 at lysine 73, which enhances the TopBP1-ATR interaction
        and activates ATR.
- term:
    id: GO:0140006
    label: histone H3 reader activity
  evidence_type: IDA
  original_reference_id: PMID:40671529
  review:
    summary: The PHRF1 PHD finger binds the extreme N-terminus of histone H3 (H3K4me0) in peptide arrays,
      fluorescence polarisation (KD ~2.6-3.8 uM), nucleosome pull-downs and BLI (KD ~1 uM); binding is lost
      on deletion of H3 residues 1-2, on H3K4 methylation/acetylation, and with the P221L PHD mutant, which
      also fails to rescue the DNA damage defect of knockout cells.
    action: NEW
    reason: Direct, quantitative binding with defined specificity, plus functional coupling (the binding-dead
      P221L mutant fails to complement), satisfies the reader-activity definition for an unmodified/K4-unmethylated
      H3 tail. A more specific GO term for an H3K4me0 reader does not exist, so the parent histone H3 reader
      activity is used. The H3K36me2/3 reader specificity reported earlier is not adopted as a term because
      the later, more rigorous nucleosome study found no K36me3 preference.
    additional_reference_ids:
    - PMID:31980037
    - PMID:25855964
    supported_by:
    - reference_id: PMID:40671529
      supporting_text: our results show PHRF1’s PHD to have distinct preference for binding the extreme N-terminus
        of H3 and that this binding is crucially controlled by one residue that is also reported to be mutated
        in cancer, PHRF1 P221.
    - reference_id: PMID:31980037
      supporting_text: The domain microarrays also identified two poorly characterized proteins—TRIM66 and PHRF1—as
        readers of the unmodified H3 tail.
