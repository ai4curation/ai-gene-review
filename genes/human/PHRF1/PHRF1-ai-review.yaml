core_functions:
- description: >-
    RING-dependent E3 ubiquitin ligase acting on nuclear signalling and genome-maintenance proteins. PHRF1
    mono-ubiquitinates TopBP1 at K73 to promote ATR activation under replication stress, and ubiquitinates
    TGIF (K130) and PARP1 for proteasomal degradation. Activity is established in human cells by RING
    point-mutant (C108A) loss of function; a purified reconstituted assay and the cognate E2 have not been
    reported. Through TGIF degradation PHRF1 positively regulates TGF-beta receptor/Smad2 signalling.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0006513
    label: protein monoubiquitination
  - id: GO:0030511
    label: positive regulation of transforming growth factor beta receptor signaling pathway
  locations:
  - id: GO:0035861
    label: site of double-strand break
  supported_by:
  - reference_id: PMID:40052822
    supporting_text: These results indicate that both the E3 ligase activity and phosphorylation of PHRF1
      are essential for TopBP1 ubiquitination.
  - reference_id: PMID:23911286
    supporting_text: we identify PHRF1 as a ubiquitin ligase that enforces TGIF decay by driving its ubiquitination
      at lysine 130
- description: >-
    PHD-finger histone reader of the unmodified (K4-unmethylated) histone H3 N-terminus, on peptides and
    nucleosomes. The reader function is needed for PHRF1 recruitment to DNA lesions and for its role in the
    DNA damage response, where PHRF1 is transiently recruited to double-strand breaks, binds NBS1 and
    promotes non-homologous end-joining.
  molecular_function:
    id: GO:0140006
    label: histone H3 reader activity
  directly_involved_in:
