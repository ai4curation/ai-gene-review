proposed_new_terms: []
suggested_questions:
- question: >-
    Which of PTPRF, PTPRD, and PTPRS engages endogenous LRFN1 in human excitatory
    neurons, and which interactions are trans-synaptic rather than cis on the same
    postsynaptic membrane?
- question: >-
    Which PSD-95-family and other PDZ scaffolds occupy the LRFN1 ESTV motif at
    endogenous abundance, and how does this motif control postsynaptic receptor
    organization and neurite growth?
- question: >-
    Do LRFN1-containing cis SALM homo- or heteromers regulate surface trafficking,
    ectodomain avidity, or postsynaptic signaling without mediating trans-cellular
    homophilic adhesion?
- question: >-
    Are the excitatory-synapse, spine, and neurite phenotypes reported in rodent
    neurons conserved in human neurons, and under which developmental or activity
    states are they most important?
suggested_experiments:
- hypothesis: >-
    Endogenous human LRFN1 promotes excitatory postsynaptic maturation through
    separable extracellular LAR-PTPR-binding and intracellular ESTV-PDZ-scaffold
    interfaces, without acquiring SALM3/5-like presynaptic-induction activity.
  description: >-
    Generate isogenic human induced-pluripotent-stem-cell-derived excitatory neurons
    carrying LRFN1 knockout, an ESTV deletion, and structure-guided LRR-Ig interface
    substitutions. Rescue at the endogenous locus and quantify PSD nanostructure,
    dendritic spines, AMPA/NMDA receptor clustering, neurite morphology, miniature
    synaptic currents, and presynaptic differentiation in paired cocultures.
  experiment_type: Endogenous human-neuron structure-function analysis
- hypothesis: >-
    Human LRFN1 uses a partner-selective subset of PTPRF, PTPRD, and PTPRS in trans,
    while other detected ectodomain contacts can occur in cis or remain unoccupied in
    neurons.
  description: >-
    Perturb each LAR-family receptor singly and combinatorially on defined pre- versus
    postsynaptic cells, combine cell-compartment-specific proximity labeling and
    fluorescence lifetime interaction measurements with binding-interface rescue,
    and relate partner occupancy to postsynaptic maturation and transmission.
  experiment_type: Direction-resolved receptor-partner epistasis
- hypothesis: >-
    The LRFN1 ESTV motif recruits a defined PSD-95-family scaffold ensemble that
    immobilizes glutamate receptors in postsynaptic nanodomains.
  description: >-
    Perform endogenous LRFN1 tail interactomics and quantitative proximity labeling
    in human neurons, comparing wild type with ESTV-deleted LRFN1. Validate direct
    PDZ interactions biochemically and measure scaffold nanoscale organization,
    receptor diffusion, synaptic retention, and electrophysiological rescue.
  experiment_type: PDZ-scaffold interactomics and receptor-dynamics analysis
- hypothesis: >-
    LRFN1-containing cis SALM oligomers regulate surface avidity or trafficking but
    are dispensable for trans-cellular homophilic adhesion.
  description: >-
    Define SALM2 cis interfaces by cross-linking mass spectrometry and endogenous
    single-molecule stoichiometry, introduce interface-specific substitutions that
    preserve folding and surface delivery, and test effects on SALM partner assembly,
    LAR-PTPR binding, PSD organization, neurite outgrowth, and cell-cell adhesion.
  experiment_type: Cis-oligomer interface dissection
