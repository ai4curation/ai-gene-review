- gap_statement: >-
    The physiological role, if any, of LRFN1-containing cis homo- and heteromeric
    SALM complexes in postsynaptic assembly or neurite development is unknown.
  boundary: >-
    SALM2 forms same-cell homo- and heteromeric complexes, but did not mediate
    SALM-SALM trans adhesion in the tested assay. Complex formation therefore cannot
    be treated as evidence for homophilic cell-cell adhesion or for a defined stable
    functional complex.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Determining whether cis oligomerization controls trafficking, avidity, or
    signaling would explain a conserved interaction without conflating it with the
    paralog-specific trans organization of presynaptic terminals.
  resolution: >-
    Map endogenous SALM stoichiometry and cis interfaces in neurons, then disrupt
    those interfaces without altering surface delivery and measure LAR-PTPR binding,
    PSD assembly, and neurite phenotypes.
  provenance:
  - reference_id: Reactome:R-HSA-8849900
    supporting_text: >-
