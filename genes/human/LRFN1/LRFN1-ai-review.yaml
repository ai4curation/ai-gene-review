knowledge_gaps:
- gap_statement: >-
    Which LAR-family receptor phosphatase interactions are physiologically occupied
    by endogenous human LRFN1, whether they occur predominantly in trans or can also
    occur in cis, and how each interaction contributes to human postsynaptic
    maturation remain unresolved.
  boundary: >-
    Purified human LRFN1 ectodomain binds PTPRF, PTPRD, and PTPRS, mouse structural
    work defines a SALM2-PTPδ interface, and rodent neurons support a postsynaptic
    maturation role. These findings do not identify partner-specific endogenous
    complexes or their directionality in human neurons.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving partner use and membrane directionality is necessary to connect the
    direct human binding activity to LRFN1's physiological neuronal process without
    importing the trans-synaptogenic behavior of SALM3 or SALM5.
  resolution: >-
    Use compartment-specific endogenous tagging and partner-selective perturbation
    in paired human excitatory neurons, combined with interface-mutant rescue,
    proximity measurements, synaptic imaging, and electrophysiology.
  provenance:
  - reference_id: PMID:32822567
    supporting_text: >-
