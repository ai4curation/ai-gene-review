- id: PMID:32822567
  title: A Human IgSF Cell-Surface Interactome Reveals a Complex Network of Protein-Protein
    Interactions.
  findings:
  - statement: A human ectodomain screen followed by SPR detected direct binding of SALM2/LRFN1 to all three LAR-family receptor phosphatases (PTPRD, PTPRF, and PTPRS).
    supporting_text: PHA led us to test binding of all LAR-PTPRs to all SALMs by SPR. With the exception of PTPRF-SALM4, we observed binding of all LAR-PTPRs to all SALMs
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text primary human ectodomain study; directly supports LRFN1 binding to the LAR-PTPR family, but does not by itself establish the in-neuron consequence of each pair.
- id: Reactome:R-HSA-8849881
  title: SALM2 associate with AMPA and NMDA receptors
  findings:
  - statement: Reactome summarizes SALM2 association with AMPA and NMDA receptor subunits and localization at mature excitatory synapses.
    supporting_text: SALM2 coimmunoprecipitates with NMDAR and AMPAR subunits isolated from detergent-solubilized brain (Ko et al. 2006). SALM2 co localizes with both pre- and post-synaptic proteins at excitatory synapses in mature neurons.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Curated secondary database record whose claims trace chiefly to Ko et al. 2006; useful provenance, with the primary paper preferred for mechanistic assertions.
- id: Reactome:R-HSA-8849891
  title: SALMs 1-3 bind to PSD-95 family members
  findings:
  - statement: Reactome summarizes binding of SALM1-3, including SALM2/LRFN1, to PSD-95-family scaffolds.
    supporting_text: SALMs 1-3 interact with the PDZ domain containing proteins PSD 95 (DLG4) and synapse associated protein 97 (SAP97 or DLG1) and SAP102 (DLG3)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Curated secondary database record supported by multiple primary SALM papers; it appropriately distinguishes the lack of presynaptic-differentiation activity for SALM2.
- id: Reactome:R-HSA-8849900
  title: SALMs1-3 bind each other in cis interactions
  findings:
  - statement: Reactome summarizes cis homo- and heteromeric complex formation among SALM1-3, while noting that the functional consequence remains unresolved.
    supporting_text: SALM1, SALM2, and SALM3 form homo- and heteromeric complexes in a cis manner. These SALMs 1-3 coimmunoprecipitate with each other in extracts from brain. Whether the homo  and heteromeric complexes formed between SALMs 1-3 contribute to synapse formation or neurite outgrowth remains to be determined (Seabold et al. 2008).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Curated secondary database record accurately captures Seabold et al. 2008 and its explicit functional uncertainty.
- id: PMID:16630835
  title: SALM synaptic cell adhesion-like molecules regulate the differentiation of excitatory synapses.
  findings:
  - statement: SALM2 localizes to excitatory rather than inhibitory synaptic sites and organizes postsynaptic scaffold/receptor clustering.
    supporting_text: excitatory, but not inhibitory, synaptic sites. ... Bead-induced direct aggregation of SALM2 results in coclustering of PSD-95 and ... other postsynaptic proteins, including GKAP and AMPA receptors.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: Bidirectional perturbation of SALM2 abundance supports a role in excitatory-synapse and spine differentiation, with knockdown lowering miniature-EPSC frequency but not amplitude.
    supporting_text: Overexpression of SALM2 ... increases the number of excitatory synapses and dendritic spines. ... Knockdown of ... SALM2 by RNA interference reduces the number of excitatory synapses and ... dendritic spines and the frequency, but not amplitude, of miniature excitatory ... postsynaptic currents.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Foundational primary SALM2 study in cultured neurons; the cache is abstract-only, so assay details beyond the abstract were not independently audited here.
- id: PMID:16828986
  title: Comparative analysis of structure, expression and PSD95-binding capacity of Lrfn, a novel family of neuronal transmembrane proteins.
  findings:
  - statement: LRFN proteins are type-I plasma-membrane glycoproteins with extracellular LRR, Ig-like, and fibronectin-III domains.
    supporting_text: Lrfn proteins share leucine-rich repeat ... (LRR)-immunoglobulin-like (Ig)-fibronectin type III (Fn)-transmembrane domain ... structure ... Lrfn1-5 ... commonly encode glycoproteins spanning the plasma membrane, with their ... N-terminus located on the extracellular side.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: The Lrfn1 cytoplasmic C terminus binds PSD95 PDZ domains and can recruit PSD95 toward Lrfn-positive cell periphery.
    supporting_text: C-termini of Lrfn1, Lrfn2 and ... Lrfn4 were bound by PDZ domains of postsynaptic protein PSD95, re-distributing ... PSD95 to cell periphery where the Lrfn proteins were detected.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary comparative mouse/human family study that directly includes Lrfn1; the cache is abstract-only and the functional experiments were not human-neuron assays.
- id: PMID:18227064
  title: The SALM family of adhesion-like molecules forms heteromeric and homomeric complexes.
  findings:
  - statement: SALM1-3 form a co-immunoprecipitable complex in rat brain, and heterologous-cell assays detect SALM2-containing homo- and heteromeric complexes.
    supporting_text: SALMs 1-3 strongly co-immunoprecipitated with each other ... In ... heterologous cells transfected with SALMs, co-immunoprecipitation studies showed ... that all five SALMs form heteromeric and homomeric complexes.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: SALM2 did not mediate trans-cellular SALM-SALM adhesion in this assay, constraining its homomeric/heteromeric associations to cis or same-cell complexes.
    supporting_text: Both SALMs 4 and 5 formed homophilic, but not heterophilic associations, ... whereas no trans associations were formed by the other SALMs.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary rat-brain and heterologous-cell interaction study; supports SALM2 cis/co-complex associations and explicitly argues against SALM2 trans SALM-SALM adhesion in the tested system.
- id: PMID:18585462
  title: Synaptic adhesion-like molecules (SALMs) promote neurite outgrowth.
  findings:
  - statement: SALM2 overexpression in cultured hippocampal neurons promotes neurite outgrowth, while extracellular-LRR antibodies and RNAi reduce SALM-family-dependent outgrowth.
    supporting_text: Over-expression of each SALM resulted in enhanced ... neurite outgrowth ... Neurite outgrowth could be ... reduced by applying antibodies targeting the extracellular leucine rich regions ... of SALMs and with RNAi.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: SALM2 neurite-outgrowth activity depends on both its C-terminal PDZ-binding region and determinants in its N-terminal extracellular region.
    supporting_text: the C-terminal PDZ binding domains of SALMs 1-3 are required for most ... aspects of neurite outgrowth. In addition, by using a chimera of SALMs 2 and 4, ... we found that the N-terminus is also involved in neurite outgrowth.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary cultured rat hippocampal-neuron study directly testing SALM2 among all five family members; cache access is abstract-only.
- id: PMID:20410109
  title: Selected SALM (synaptic adhesion-like molecule) family proteins regulate synapse formation.
  findings:
  - statement: In the heterologous-cell/hippocampal-neuron coculture assay, SALM2 did not induce presynaptic differentiation, unlike SALM3 and SALM5.
    supporting_text: Here we demonstrate that SALM3 and SALM5, but not other members of the SALM family, are capable of inducing excitatory and inhibitory presynaptic differentiation in contacting axons.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text primary comparative study; its negative SALM2 result is an important paralog-specific boundary and does not contradict SALM2's postsynaptic maturation phenotype.
- id: PMID:29348429
  title: Structural basis of trans-synaptic interactions between PTPδ and SALMs for inducing synapse formation.
  findings:
  - statement: The mouse SALM2 LRR-Ig ectodomain forms a crystallographic 2:2 complex with mouse PTPδ in which SALM2 LRR and Ig regions contact PTPδ Ig2 and Ig3.
    supporting_text: We determined the crystal structures of apo-SALM5 (LRR–Ig), and PTPδ (Ig1–Ig3)–SALM2 (LRR–Ig) and PTPδ (Ig1–Fn1)–SALM5 (LRR–Ig) complexes ... the Ig2 and Ig3 domains of PTPδ sandwiches the Ig domain of SALM2 or SALM5. The Ig2 domain of PTPδ also interacts with the LRR domain of SALM2 or SALM5
    reference_section_type: RESULTS
  - statement: SALM2 has an eight-repeat LRR domain and dimerizes to bridge two PTPδ monomers, but this structural complex does not establish a stable obligate complex in cells.
    supporting_text: The LRR domains of SALM2 and SALM5 are composed of eight parallel β-strands flanked by the N- and C-terminal caps. ... Our structures revealed the 2:2 binding mode of PTPδ and SALMs. SALMs form a dimer, which bridges two PTPδ monomers.
    reference_section_type: RESULTS
  - statement: PTPδ mini-exon A is not required for SALM binding, whereas mini-exon B is preferred but dispensable; the authors could not exclude that the crystallized SALM2-PTPδ arrangement might also occur in cis.
    supporting_text: meA is not involved in the binding between the type-IIa RPTPs and SALMs, whereas the insertion of meB is preferred but dispensable for the binding. ... we cannot exclude the possibility that the present PTPδ–SALM2 and PTPδ–SALM5 structures may also reflect the cis complex formed on the postsynaptic membrane.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text primary structural study. The SALM2 construct and PTPδ were mouse proteins; functional mutagenesis was performed on human SALM5, so the SALM5 synaptogenic mechanism must not be assigned wholesale to LRFN1.
core_functions:
- description: >-
    At the excitatory postsynaptic cell surface, the LRR-Ig portion of the LRFN1
    ectodomain binds LAR-family cell-adhesion receptors. Direct human ectodomain
    experiments support binding to PTPRF, PTPRD, and PTPRS, while a mouse
    SALM2-PTPδ structure defines a distributed LRR-Ig interface. Together with
    rodent-neuron evidence, this activity supports organization and maturation of
    the postsynaptic density, but it is not assigned the trans-presynaptic-organizer
    activity observed specifically for SALM3 and SALM5.
  molecular_function:
    id: GO:0050839
    label: cell adhesion molecule binding
  directly_involved_in:
  - id: GO:0099151
    label: regulation of postsynaptic density assembly
  locations:
  - id: GO:0098839
    label: postsynaptic density membrane
  supported_by:
  - reference_id: PMID:32822567
    supporting_text: >-
      PHA led us to test binding of all LAR-PTPRs to all SALMs by SPR. With the exception of PTPRF-SALM4, we observed binding of all LAR-PTPRs to all SALMs
    reference_section_type: RESULTS
  - reference_id: PMID:29348429
    supporting_text: >-
      the Ig2 and Ig3 domains of PTPδ sandwiches the Ig domain of SALM2 or SALM5. The Ig2 domain of PTPδ also interacts with the LRR domain of SALM2 or SALM5
    reference_section_type: RESULTS
  - reference_id: PMID:16630835
    supporting_text: >-
      Bead-induced direct aggregation of SALM2 results in coclustering of PSD-95 and ... other postsynaptic proteins, including GKAP and AMPA receptors.
    reference_section_type: ABSTRACT
- description: >-
    The cytoplasmic C-terminal ESTV motif of LRFN1 binds PDZ domains of
    PSD-95-family scaffold proteins, recruiting postsynaptic scaffolds and receptors
    to membrane sites. Rodent Lrfn1/SALM2 experiments link this scaffold-binding
    module, together with determinants in the extracellular region, to postsynaptic
    organization and positive regulation of neurite development. These conserved
    activities are not yet demonstrated at endogenous abundance in human neurons.
  molecular_function:
    id: GO:0097110
    label: scaffold protein binding
