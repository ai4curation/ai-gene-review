    reference_section_type: DISCUSSION
- gap_statement: >-
    The endogenous human-neuronal requirement for the LRFN1 ESTV motif, the identity
    and stoichiometry of its occupied PDZ-scaffold partners, and the mechanism by
    which those interactions organize receptor nanodomains are not established.
  boundary: >-
    Lrfn1 C termini bind PSD95 PDZ domains, SALM2 aggregation clusters PSD-95 and
    glutamate-receptor-associated proteins, and the human sequence conserves the
    ESTV motif. The available functional experiments are predominantly rodent or
    heterologous and do not resolve endogenous human complexes.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This intracellular linkage is the likely bridge between extracellular adhesion
    and postsynaptic organization, but its human partner hierarchy and causal
    architecture remain unknown.
  resolution: >-
    Compare endogenous wild-type and ESTV-deleted LRFN1 in human neurons using
    quantitative PDZ-scaffold interactomics, single-molecule localization imaging,
    receptor-mobility measurements, and matched functional rescue.
  provenance:
