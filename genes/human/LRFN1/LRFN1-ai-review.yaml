  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRFN1, also called SALM2, is a brain-enriched type I single-pass synaptic
  adhesion-like membrane glycoprotein. Its extracellular leucine-rich-repeat,
  immunoglobulin-like, and fibronectin type III domains bind LAR-family receptor
  protein tyrosine phosphatases, while its cytoplasmic C-terminal ESTV motif binds
  PDZ-domain postsynaptic scaffolds. LRFN1 is concentrated at excitatory
  postsynaptic membranes, where rodent studies show that it organizes scaffold and
  glutamate-receptor clusters, supports postsynaptic-density and dendritic-spine
  maturation, and promotes neurite outgrowth. It also forms cis homo- and
  heteromeric SALM complexes. Unlike SALM3 and SALM5, SALM2 did not induce
  presynaptic differentiation across contacting cells in the standard coculture
  assay. Direct human evidence establishes LRFN1 binding to PTPRF, PTPRD, and
  PTPRS; most cellular evidence for its neuronal roles comes from rodent systems.
