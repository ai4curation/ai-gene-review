id: Q08357
gene_symbol: SLC20A2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SLC20A2 encodes the sodium-dependent phosphate transporter 2 (PiT2, GLVR2), a multi-pass
  plasma-membrane symporter of the SLC20/PiT family that imports inorganic phosphate coupled to sodium
  (about two sodium ions per phosphate, monovalent form). It is the principal phosphate transporter of
  the brain, where loss-of-function mutations cause primary familial brain calcification. In polarized
  epithelia it localizes to the apical/brush-border membrane, supplies phosphate for bone mineralization,
  and can functionally compensate for PiT1 in vascular smooth-muscle calcification. Like PiT1 it also
  serves as a gammaretroviral cell-entry receptor (amphotropic murine leukaemia virus and related viruses).'
