suggested_questions:
- question: Why does loss of PiT2, a broadly expressed housekeeping Na-phosphate symporter, produce 
    selective basal-ganglia (and other brain-region) calcification rather than a generalized 
    phosphate-handling defect?
- question: Does PiT2 set cerebrospinal-fluid phosphate levels in humans (the mouse role is inferred
    by similarity, UniProtKB:Q80UP8, with no human GOA row), and is that the proximate cause of the 
    perivascular calcification in primary familial brain calcification?
suggested_experiments:
- description: Measure phosphate flux and CSF/interstitial phosphate in human-relevant PiT2 
    loss-of-function models (patient-derived or knock-in PFBC mutations) across brain regions to 
    test whether regional calcification tracks local phosphate dysregulation rather than uniform 
    transport loss.
knowledge_gaps:
- gap_kind:
  - BIOLOGY
  gap_statement: 'The mechanism linking PiT2 loss to region-selective brain calcification is unknown:
    whether it acts through CSF/interstitial phosphate homeostasis, a local pericyte/astrocyte phosphate-sensing
    role, or a transport-independent function remains to be established by new wet-lab experiments.'
