id: Q14956
gene_symbol: GPNMB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GPNMB (glycoprotein non-metastatic melanoma protein B; also osteoactivin or DC-HIL) is a
  heavily glycosylated type I transmembrane protein of the PMEL/NMB family, found at the plasma membrane,
  in melanosome membranes of melanocytes and in endosomes. Its large extracellular domain contains an
  RGD integrin-binding motif and a PKD domain and can be shed by ADAM10 as a soluble fragment. On antigen-presenting
  cells GPNMB acts as a membrane-bound ligand for syndecan-4 on activated T cells, recognizing its heparan
  sulfate chains and inhibiting T-cell activation, proliferation and cytokine production. The shed ectodomain
  promotes endothelial cell migration, and GPNMB is highly expressed by macrophages, osteoclasts, melanocytes
  and many cancers. Biallelic loss-of-function variants cause amyloidosis cutis dyschromica.
