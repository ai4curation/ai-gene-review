      explanation: Intramolecular cis-autoinhibition of the ARID DNA-binding surface by ARID4A's own acidic loop L12 (PMID:34506790) is conformational autoregulation, not intermolecular GO:0140313 (molecular sequestering activity).
      supported_by:
