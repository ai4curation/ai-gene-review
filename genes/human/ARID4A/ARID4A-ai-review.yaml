- id: PMID:11283269
  title: RBP1 recruits the mSIN3-histone deacetylase complex to the pocket of retinoblastoma tumor suppressor family proteins found in limited discrete regions of the nucleus at growth arrest.
  findings:
  - statement: Shows RBP1/ARID4A bridges RB pocket proteins to class I HDAC-containing mSIN3-SAP30-HDAC complexes in discrete nuclear foci during growth arrest.
    supporting_text: RB family proteins were shown to associate via the pocket with previously identified mSIN3-SAP30-HDAC complexes containing exclusively class I HDACs. Such enzymes do not interact directly with RB family proteins but rather utilize RBP1 to target the pocket.
- id: PMID:12724404
  title: Identification and characterization of three new components of the mSin3A corepressor complex.
  findings:
  - statement: Confirms RBP1/ARID4A and its paralog SAP180/ARID4B as subunits of functional human mSin3A corepressor complexes.
    supporting_text: SAP180 is 40% identical to a previously identified mSin3A-associated protein, RBP1.
- id: PMID:15640446
  title: DNA-binding properties of ARID family proteins.
  findings:
  - statement: Shows that ARID4A and most human ARID subfamilies outside ARID3/ARID5 bind DNA without sequence preference.
    supporting_text: The results indicate that the majority of ARID subfamilies (i.e. five out of seven) bind DNA without obvious sequence preference.
- id: PMID:22865885
  title: Family with sequence similarity 60A (FAM60A) protein is a cell cycle-fluctuating regulator of the SIN3-HDAC1 histone deacetylase complex.
  findings:
  - statement: Characterizes cell-cycle-regulated association of FAM60A with the SIN3-HDAC transcriptional corepressor complex.
    supporting_text: Here we describe family with sequence similarity 60A (FAM60A), a cell cycle-regulated protein that binds to the SIN3-HDAC complex.
- id: PMID:22984288
  title: 'Human family with sequence similarity 60 member A (FAM60A) protein: a new subunit of the Sin3 deacetylase complex.'
  findings:
  - statement: Identifies FAM60A as a Sin3-HDAC subunit whose loss alters TGF-beta pathway gene expression and increases cell migration.
    supporting_text: Moreover, our studies reveal that loss of FAM60A or another component of the Sin3 complex, SDS3, leads to a change in cell morphology and an increase in cell migration.
  full_text_unavailable: true
- id: PMID:28554894
  title: Fam60a defines a variant Sin3a-Hdac complex in embryonic stem cells required for self-renewal.
  findings:
  - statement: Defines endogenous Sin3a-Hdac subunit stoichiometry across ES and differentiated cells and shows Fam60a is required for ES cell proliferation.
    supporting_text: We define the precise composition of the Sin3a complex in multiple cell types and identify the Fam60a subunit as a key defining feature of a variant Sin3a complex present in ES cells, which also contains Ogt and Tet1.
  full_text_unavailable: true
- id: PMID:8414517
  title: Characterization of the retinoblastoma binding proteins RBP1 and RBP2.
  findings:
  - statement: Clones full-length human RBP1 (ARID4A) as a ubiquitously expressed nuclear phosphoprotein that complexes with pRB in vivo and is displaced by HPV E7.
    supporting_text: The products of the RBP1 and RBP2 genes are ubiquitously expressed, large (200 kDa for RBP1 and 195 kDa for RBP2) nuclear phosphoproteins with structural motifs that suggest a role in transcriptional regulation.
  full_text_unavailable: true
- id: PMID:8455946
  title: Alternative splicing of the RBP1 gene clusters in an internal exon that encodes potential phosphorylation sites.
  findings:
  - statement: Demonstrates nuclear localization of endogenous human RBP1/ARID4A and characterizes internal exon alternative splicing.
    supporting_text: Immunohistochemical analysis using the alpha-RBP1 antiserum demonstrated a distinct nuclear staining pattern that was eliminated when the antiserum was preabsorbed with RBP1 peptide.
  full_text_unavailable: true
- id: PMID:9651585
  title: SAP30, a novel protein conserved between human and yeast, is a component of a histone deacetylase complex.
  findings:
  - statement: Defines the human Sin3-SAP30-HDAC1/2 histone deacetylase corepressor complex.
    supporting_text: Here, we identify SAP30 as a novel component of the human histone deacetylase complex that includes Sin3, the histone deacetylases HDAC1 and HDAC2, histone binding proteins RbAp46 and RbAp48, as well as other polypeptides.
  full_text_unavailable: true
- id: Reactome:R-HSA-3769447
  title: HDAC1:2-containing complex deacetylate histones
  findings: []
- id: Reactome:R-HSA-9679787
  title: HDAC1:2-containing complex binds HDAC2 Inhibitors
  findings: []
- id: PMID:10490602
  title: RBP1 recruits both histone deacetylase-dependent and -independent repression activities to retinoblastoma family proteins.
  findings:
  - statement: Maps two distinct transcriptional repression domains in RBP1/ARID4A (HDAC-independent R1 and HDAC-dependent R2) that mediate E2F promoter repression via the RB pocket.
    supporting_text: We show here that RBP1 contains two repression domains, one of which binds all three known HDACs and represses them in an HDAC-dependent manner while the other domain functions independently of the HDACs.
- id: PMID:17043311
  title: Deficiency of Rbbp1/Arid4a and Rbbp1l1/Arid4b alters epigenetic modifications and suppresses an imprinting defect in the PWS/AS domain.
  findings:
  - statement: Shows ARID4A complexes with ARID4B at the Snrpn promoter to maintain maternal H4K20me3, H3K9me3, and DNA methylation at the PWS/AS imprinting center.
    supporting_text: Combined homozygous deficiency for Rbbp1/Arid4a and heterozygous deficiency for Rbbp1l1/Arid4b altered epigenetic modifications at the PWS-IC with reduced trimethylation of histone H4K20 and H3K9 and reduced DNA methylation, changing the maternal allele toward a more paternal epigenotype.
- id: PMID:18728284
  title: Identification of chromatin remodeling genes Arid4a and Arid4b as leukemia suppressor genes.
  findings:
  - statement: Demonstrates that Arid4a deficiency causes CMML-like myelodysplastic/myeloproliferative disease progressing to AML with altered histone trimethylation.
    supporting_text: Five of 42 Arid4a(-/-) mice and 10 of 12 Arid4a(-/-)Arid4b(+/-) mice progressed to acute myeloid leukemia (AML) and had rapid further increases of leukocyte counts.
- id: PMID:22247551
  title: Structural insight into recognition of methylated histone tails by retinoblastoma-binding protein 1.
  findings:
  - statement: Solves the NMR structure of the ARID4A chromobarrel domain and demonstrates DNA-enhanced recognition of H4K20me3 and H3K9me3/H3K27me3/H3K36me3 via an aromatic cage.
    supporting_text: Among the three Royal Family domains, only the chromobarrel domain could recognize trimethylated H4K20 (with an affinity of ∼3 mm), as well as recognizing trimethylated H3K9, H3K27, and H3K36 (with lower affinities). The affinity could be further enhanced up to 15-fold by the presence of DNA.
- id: PMID:23487765
  title: ARID4A and ARID4B regulate male fertility, a functional link to the AR and RB pathways.
  findings:
  - statement: Establishes ARID4A and ARID4B as Sertoli-cell transcriptional coactivators for the androgen receptor and RB1 required for spermatogenesis and blood-testis barrier integrity.
    supporting_text: Our results thus indicate that ARID4A and ARID4B function as transcriptional coactivators for AR and RB and play an integral part in the AR and RB regulatory pathways involved in the regulation of Sertoli cell function and male fertility.
  full_text_unavailable: true
- id: PMID:24379399
  title: Retinoblastoma-binding protein 1 has an interdigitated double Tudor domain with DNA binding activity.
  findings:
  - statement: Solves the NMR structure of the ARID4A interdigitated double Tudor domain and proves sequence-nonspecific dsDNA and ssDNA binding.
    supporting_text: NMR titration and isothermal titration calorimetry experiments indicate that the RBBP1 Tudor domain binds both double- and single-stranded DNA with an affinity of 10-100 μM; no apparent DNA sequence specificity was detected.
- id: PMID:34506790
  title: Structural Insight into Chromatin Recognition by Multiple Domains of the Tumor Suppressor RBBP1.
  full_text_unavailable: true
  findings:
  - statement: Demonstrates by NMR that the ARID4A ARID domain binds dsDNA without AT- or GC-rich sequence preference and is autoinhibited by its acidic DNA-mimic loop L12.
    supporting_text: NMR titration results indicated that the ARID domain interacts with DNA with no GC- or AT-rich preference. Surprisingly, we found that the loop L12 binds to the DNA-binding region of the ARID domain as a DNA mimic and inhibits DNA binding.
- id: PMID:35365808
  title: A novel heterozygous missense variant of the ARID4A gene identified in Han Chinese families with schizophrenia-diagnosed siblings that interferes with DNA-binding activity.
  full_text_unavailable: true
  findings:
  - statement: Determines the 2.05 A crystal structure of the ARID4A PWWP-ARID supramodule and shows p.His411Asp weakens dsDNA binding and G0/G1 arrest.
    supporting_text: Our results further showed that compared with the wild type, the p.His411Asp ARID mutant protein adopts a less compact conformation and exhibits a weaker dsDNA-binding ability.
- id: PMID:40066676
  title: Arid4a Suppresses Breast Tumor Metastasis by Enhancing MTSS1 Expression via mRNA Stability.
  full_text_unavailable: false
  findings:
  - statement: Reports ARID-dependent binding of ARID4A to a conserved 3'-UTR structural element in MTSS1, TIMP2, RB1, and PTEN transcripts in breast cancer cells.
    supporting_text: Mechanistically, Arid4a preferentially stabilizes metastasis-suppressing transcripts, including metastasis suppressor 1 (MTSS1), tissue inhibitor of metalloproteinase 2 (TIMP2), retinoblastoma 1 (Rb1), and phosphatase and tensin homolog (PTEN), through binding to a conserved structural RNA element localized in the 3' untranslated region (3'UTR).
- id: file:human/ARID4A/ARID4A-deep-research-affinage.md
  title: Affinage mechanistic annotation for ARID4A (human, UniProtKB:P29374)
  findings:
  - statement: Synthesizes PWWP-ARID supramodule dsDNA engagement, loop L12 DNA-mimic autoinhibition, and chromobarrel histone-mark recognition alongside PWS/AS imprinting and Sertoli AR/RB coactivation.
    supporting_text: Structurally, ARID4A engages chromatin through a PWWP-ARID supramodule whose ARID domain binds dsDNA without sequence preference, while an intramolecular acidic loop L12 acts as a DNA mimic that autoinhibits DNA binding and modulates histone-mark engagement by the chromobarrel domain [PMID:34506790, PMID:35365808]
  reference_review:
    relevance: HIGH
    correctness: LOW_QUALITY
    review_notes: Correctly matches UniProtKB:P29374 without falling into the RBP1 retinol-binding protein (P09455) homonym trap, and accurately summarizes PWS/AS imprinting (PMID:17043311), leukemogenesis (PMID:18728284), Sertoli AR/RB coactivation (PMID:23487765), and PWWP-ARID/loop-L12 structural studies (PMID:34506790, PMID:35365808). However, it completely omits the foundational discovery and biochemical mechanism of ARID4A/RBP1 as the LXCXE-containing corepressor that bridges RB1 pocket proteins to the mSin3A-SAP30-HDAC1/2 complex (PMID:10490602, PMID:11283269, PMID:12724404), misgrounds intramolecular loop-L12 cis-autoinhibition as GO:0140313 (molecular sequestering activity), and emits a malformed bioRxiv pseudo-PMID.
