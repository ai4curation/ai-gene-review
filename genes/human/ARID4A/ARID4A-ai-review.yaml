id: P29374
gene_symbol: ARID4A
aliases:
- RBP1
- RBBP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Multidomain nuclear chromatin regulator and retinoblastoma-binding corepressor (~1257 aa) containing an N-terminal interdigitated double Tudor dsDNA-binding domain, a PWWP-ARID dsDNA-binding supramodule autoinhibited by an acidic DNA-mimic loop (L12), a methyl-lysine-reading chromobarrel domain (recognizing H4K20me3 and H3K4me3/H3K9me3), an HDAC-independent R1 repression domain, a canonical 957-LVCHE-961 (LXCXE) RB1 pocket-binding motif, and a C-terminal mSin3A-binding R2 domain. Recruits mSin3A-SAP30-HDAC1/2 complexes to RB1/p107/p130-bound E2F promoters during cell-cycle arrest, partners with paralog ARID4B to maintain maternal genomic imprinting at the PWS/AS locus and suppress myeloid leukemogenesis, and acts as a Sertoli-cell coactivator for androgen receptor and RB1 transcriptional programs.
core_functions:
- description: Bridges RB family pocket proteins via its 957-LVCHE-961 (LXCXE) motif to the nucleoplasmic mSin3A-SAP30-HDAC1/2 complex and an HDAC-independent R1 domain to repress RNA polymerase II transcription, while cooperating with ARID4B to regulate imprinted and nuclear-receptor target loci.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  in_complex:
    id: GO:0070822
    label: Sin3-type complex
  locations:
  - id: GO:0005654
    label: nucleoplasm
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  supported_by:
  - reference_id: PMID:10490602
    supporting_text: We show here that RBP1 contains two repression domains, one of which binds all three known HDACs and represses them in an HDAC-dependent manner while the other domain functions independently of the HDACs.
  - reference_id: PMID:11283269
    supporting_text: RB family proteins were shown to associate via the pocket with previously identified mSIN3-SAP30-HDAC complexes containing exclusively class I HDACs. Such enzymes do not interact directly with RB family proteins but rather utilize RBP1 to target the pocket.
  - reference_id: PMID:12724404
    supporting_text: SAP180 is 40% identical to a previously identified mSin3A-associated protein, RBP1.
  - reference_id: file:human/ARID4A/ARID4A-deep-research-affinage.md
    supporting_text: Structurally, ARID4A engages chromatin through a PWWP-ARID supramodule whose ARID domain binds dsDNA without sequence preference, while an intramolecular acidic loop L12 acts as a DNA mimic that autoinhibits DNA binding and modulates histone-mark engagement by the chromobarrel domain [PMID:34506790, PMID:35365808]
- description: Engages nucleosomal double-stranded DNA without sequence specificity through its N-terminal interdigitated double Tudor domain and central PWWP-ARID supramodule to couple DNA binding to chromobarrel recognition of methylated histone tails.
  molecular_function:
    id: GO:0003690
    label: double-stranded DNA binding
  locations:
  - id: GO:0005654
    label: nucleoplasm
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  supported_by:
  - reference_id: PMID:24379399
    supporting_text: NMR titration and isothermal titration calorimetry experiments indicate that the RBBP1 Tudor domain binds both double- and single-stranded DNA with an affinity of 10-100 μM; no apparent DNA sequence specificity was detected.
  - reference_id: PMID:34506790
    supporting_text: NMR titration results indicated that the ARID domain interacts with DNA with no GC- or AT-rich preference. Surprisingly, we found that the loop L12 binds to the DNA-binding region of the ARID domain as a DNA mimic and inhibits DNA binding.
  - reference_id: PMID:35365808
    supporting_text: Our results further showed that compared with the wild type, the p.His411Asp ARID mutant protein adopts a less compact conformation and exhibits a weaker dsDNA-binding ability.
