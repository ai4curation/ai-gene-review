    - defect_type: MISSING_STATEMENT
      resource: OTHER
      record: https://affinage.wi.mit.edu/api/gene/ARID4A
      slot: complexes
      requested_change: ADD
      asserted_value: https://affinage.wi.mit.edu/api/gene/ARID4A
      corrected_value: GO:0070822
      corrected_label: Sin3-type complex
      cause: OTHER
      confidence: CONFIRMED
      explanation: Affinage omits ARID4A's defining biochemical membership in the mSin3A-SAP30-HDAC1/2 corepressor complex and its LXCXE-mediated bridging of RB1 pocket proteins to class I HDACs (PMID:10490602, PMID:11283269, PMID:12724404).
      supported_by:
