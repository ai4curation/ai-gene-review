        supporting_text: RB family proteins were shown to associate via the pocket with previously identified mSIN3-SAP30-HDAC complexes containing exclusively class I HDACs. Such enzymes do not interact directly with RB family proteins but rather utilize RBP1 to target the pocket.
      - reference_id: PMID:12724404
        supporting_text: SAP180 is 40% identical to a previously identified mSin3A-associated protein, RBP1.
    - defect_type: WRONG_STATEMENT
      resource: OTHER
      record: https://affinage.wi.mit.edu/api/gene/ARID4A
      slot: molecular_activity
      requested_change: CHECK
      asserted_value: '- **molecular_activity:** GO:0003677 DNA binding, GO:0003723 RNA binding, GO:0042393 histone binding, GO:0140110 transcription regulator activity, GO:0140313 molecular sequestering activity'
      corrected_value: GO:0003714
      corrected_label: transcription corepressor activity
      cause: LABEL_WITHOUT_DEFINITION
