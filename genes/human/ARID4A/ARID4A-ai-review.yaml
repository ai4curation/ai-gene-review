knowledge_gaps:
- gap_statement: Whether reported 3'-UTR RNA binding and mRNA stabilization by ARID4A in breast cancer cells occurs via direct cytoplasmic shuttling or co-transcriptional nuclear RNP engagement—and how its sequence-nonspecific ARID domain achieves RNA motif selectivity—remains unresolved.
  boundary: Solution NMR and crystal structures establish sequence-nonspecific dsDNA binding by the Tudor and PWWP-ARID domains in the nucleus (PMID:24379399, PMID:34506790, PMID:35365808), whereas 3'-UTR mRNA stabilization of MTSS1/TIMP2/RB1/PTEN rests on a single 2025 study (PMID:40066676) without biophysical Kd or structural validation.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Determines whether mRNA stabilization is a general physiological function of ARID4A analogous to paralogous clade member ARID5A or a context-restricted cancer phenomenon.
suggested_questions:
- question: What post-translational modification or chromatin partner (such as H2A-H2B engagement) displaces the acidic DNA-mimic loop L12 from the ARID4A PWWP-ARID surface in vivo to license nucleosomal DNA binding?
- question: Does purified recombinant ARID4A PWWP-ARID directly bind structured 3'-UTR RNA elements in NMR/ITC titrations with affinities comparable to dsDNA, and does endogenous ARID4A shuttle to the cytoplasm?
suggested_experiments:
- description: Determine a cryo-EM structure of full-length ARID4A-mSin3A-HDAC1 bound to an H4K20me3-modified mononucleosome and the RB1 pocket to visualize coordinated Tudor, PWWP-ARID, loop L12, and chromobarrel engagement.
- description: Perform parallel NMR chemical-shift perturbation and ITC titrations of purified ARID4A PWWP-ARID (with and without loop L12) against the reported MTSS1/PTEN 3'-UTR RNA hairpins versus canonical dsDNA.
