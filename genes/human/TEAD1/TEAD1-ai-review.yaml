core_functions:
- description: Sequence-specific DNA-binding transcription factor that binds M-CAT/GT-IIC-type (GGAATG)
    enhancer elements through its TEA domain and regulates RNA polymerase II target genes in the nucleus.
    This activity is ancestral to the TEA-domain family and predates animals.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  supported_by:
  - reference_id: PMID:20123905
    supporting_text: TEAD contains an N-terminal TEA DNA-binding domain ( Anbanandam et al. 2006 ) and
      a C-terminal region responsible for YAP interaction
  - reference_id: PMID:18579750
    supporting_text: Interestingly, our results demonstrated that YAP and TEAD1 co-occupy >80% of the
      promoters pulled down by either of them
  - reference_id: PMID:26045994
    supporting_text: ChIP results revealed that TEAD1 factually binds to Site A and Site B within the
      potential miR-222 promoter ( Figure 4D ).
  - reference_id: PMID:38729842
    supporting_text: TEAD family members were identified in Drosophila, the filamentous fungus A. nidulans,
      and S. cerevisiae (Figure 2), and were found to regulate wing development, [37], sporulation [38],
      and pseudohyphal growth [39], respectively.
- description: 'DNA-anchoring partner of the Hippo-regulated coactivators YAP1 and WWTR1/TAZ: the C-terminal
    YAP-binding domain forms a TEAD-YAP heterodimer (interface 3, Y406) that recruits the coactivator
    to target promoters such as CTGF and activates their transcription. The Sd/TEAD-Yorkie partnership
    is present in the unicellular holozoan Capsaspora (heterologous assays), so the coactivator-docking
    function predates animals.'
