taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TEAD1 (TEF-1) is a nuclear sequence-specific DNA-binding transcription factor of the TEA/ATTS
  domain family. Its N-terminal TEA domain recognizes M-CAT/GT-IIC-type enhancer elements (GGAATG core),
  and its C-terminal YAP-binding (transactivation) domain docks the transcriptional coactivators YAP1
  and WWTR1/TAZ and the vestigial-like cofactors (VGLL1-4). Because YAP and TAZ lack DNA-binding activity,
  TEAD1 and its paralogs TEAD2-4 are the main DNA-binding partners that bring these Hippo-regulated coactivators
  to promoters and enhancers, activating genes such as CTGF/CCN2 that drive cell proliferation, epithelial-mesenchymal
  transition and oncogenic growth; VGLL4 competes with YAP for TEAD binding and represses this output.
  TEAD1 is expressed broadly, highest in skeletal muscle, acts in muscle-gene regulation via M-CAT elements
  and in cardiac development, and the Y406H substitution in its YAP-binding interface, which abolishes
  YAP binding, causes Sveinsson chorioretinal atrophy. TEAD1 activity is also modulated post-translationally,
  for example by AARS1-catalyzed lactylation of K108. Evolutionarily, TEA-domain transcription factors
  are older than animals (they occur in fungi), and a single Scalloped/TEAD ortholog in the unicellular
  holozoan Capsaspora binds the Capsaspora Yorkie ortholog and co-activates a Hippo-responsive reporter,
  so the TEAD-coactivator partnership predates animals, whereas roles in organ growth and tissue development
  are animal-specific uses of this ancient module.
