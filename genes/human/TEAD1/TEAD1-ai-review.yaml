- id: PMID:22832104
  title: Premetazoan origin of the hippo signaling pathway.
  findings:
  - statement: The Capsaspora Scalloped/TEAD ortholog (Co-Sd) and Yorkie ortholog (Co-Yki) co-immunoprecipitate
      and together activate a Hippo-responsive reporter when expressed in Drosophila S2R+ cells.
    supporting_text: epitope-tagged Co-Sd and Co-Yki immunoprecipitated with each other in Drosophila
      S2R+ cells (Figure 4A), demonstrating their ability to form a protein complex.
  - statement: Unicellular holozoan Sd/TEAD homologs retain the C-terminal tyrosine (human TEAD1 Y406)
      required for YAP-TEAD interaction.
    supporting_text: Indeed, these holozoan species contain homologues of Sd/TEAD with the C-terminal
      Y460 residue known to be important for YAP-TEAD interaction
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Evidence for premetazoan Sd-Yki complex is heterologous (Drosophila
      cells/tissue), not in Capsaspora itself; human TEAD1 not assayed.
- id: PMID:38729842
  title: 'Assembling a Hippo: the evolutionary emergence of an animal developmental signaling pathway.'
  findings:
  - statement: TEA-domain factors occur in fungi as well as animals and appear to predate Yorkie; the
      review proposes that TEAD and the Hippo-Warts kinase module were initially unlinked and were joined
      by the holozoan novelty Yorkie.
    supporting_text: The fact that Sd/TEAD apparently predates Yorkie in evolutionary history suggests
      a model in which the Hippo-Warts kinase module and a TEAD transcription factor functioned in unlinked
      signaling modules
  - statement: Whether choanoflagellate Yorkie orthologs bind Sd/TEAD is unresolved, because their TEAD-binding
      helices are poorly conserved.
    supporting_text: The degree to which choanoflagellate Yorkie orthologs interact with Sd/TEAD proteins
      is therefore currently unclear
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Review article (full text cached); used only for evolutionary framing. It does not report
      TEAD experiments in choanoflagellates.
- id: PMID:38517944
  title: The Hippo kinase cascade regulates a contractile cell behavior and cell density in a close unicellular
    relative of animals.
  findings:
  - statement: In Capsaspora, phenotypes of hyperactive coYki require the residue aligned with YAP1 F95
      (TEAD-binding), implying a TEAD-dependent transcriptional output in a unicellular holozoan.
    supporting_text: We found that, in contrast to coYki 4SA, the expression of a coYki 4SA F123A mutant
      did not affect cell or aggregate morphology (Figure 7).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Indirect for TEAD: coSd itself was not perturbed; the inference rests on a coYki point
      mutant.'
