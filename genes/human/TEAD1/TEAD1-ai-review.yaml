suggested_questions:
- question: Does Capsaspora coSd bind DNA at GGAATG-type sites and occupy the promoters of the 'core Hippo'
    genes deregulated in coYki, coHpo and coWts mutants? Current evidence for a premetazoan Sd-Yki transcriptional
    module is heterologous (Drosophila S2R+ cells and fly eye) plus a coYki TEAD-binding point mutant
    (PMID:22832104, PMID:38517944).
- question: Do choanoflagellate Sd/TEAD orthologs bind their Yorkie orthologs, given that S. rosetta and
    M. brevicollis Yorkie lack conserved TEAD-binding helix residues (PMID:38729842)? If not, the TEAD-Yorkie
    link may have been lost or remodelled in choanoflagellates.
- question: Which of the experiments attributed to TEAD1 are paralog-specific? Key knockdowns in PMID:18579750
    and PMID:19324877 used a shRNA hitting TEAD1, TEAD3 and TEAD4 together; TEAD1-specific evidence rests
    on ChIP, reporter, dominant-negative and structural data.
- question: Is the VGLL4/Tgi-TEAD default-repression mode, whose components are both present in Capsaspora
    (PMID:38729842), functional there, and should human TEAD1 carry a repressor-side term in addition
    to activator activity?
suggested_experiments:
- hypothesis: Capsaspora coSd is the DNA-binding partner that mediates coYki transcriptional output in
    Capsaspora.
  description: CUT&RUN or ChIP-seq of tagged coSd in wild-type, coYki-/- and coWts-/- Capsaspora cells,
    with motif analysis for GGAATG-type sites, combined with coSd knockout or a coSd YAP-binding-interface
    (Y406-equivalent) mutant to test whether it phenocopies coYki loss.
  experiment_type: genomics and genetics
- hypothesis: Human TEAD1 has paralog-specific target genes not shared with TEAD2-4.
  description: Single-paralog CRISPR knockouts and rescue with TEAD1 versus TEAD4 cDNAs in MCF10A cells,
    followed by RNA-seq and YAP ChIP-seq, to separate TEAD1-specific from redundant TEAD functions.
  experiment_type: genetic perturbation and genomics
- hypothesis: Human TEAD1 can complement loss of the Capsaspora or Drosophila Sd ortholog for Yorkie-dependent
    transcription.
  description: Cross-species complementation of sd mutant fly tissue and of coSd-deficient Capsaspora
    with human TEAD1, reading out Hippo-responsive reporters and target genes.
  experiment_type: complementation
