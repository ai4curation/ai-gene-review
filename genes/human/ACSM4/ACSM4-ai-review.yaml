suggested_questions:
- question: Is human ACSM4 an active medium-chain acyl-CoA synthetase, and is its
    expression restricted to the olfactory epithelium as in rat?
- question: Does ACSM4 activate xenobiotic carboxylic acids such as benzoate or salicylate,
    like other ACSM family members, in addition to medium-chain fatty acids?
