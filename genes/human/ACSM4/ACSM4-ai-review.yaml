- term:
    id: GO:0006633
    label: fatty acid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2152200
  - MGI:MGI:99538
  - PANTHER:PTN001944787
  review:
    summary: >-
      Over-annotation. An acyl-CoA synthetase activates existing fatty acids to
      their CoA thioesters; it does not perform a step in the synthesis of fatty
      acids. The seed paper points to oxidation, not synthesis.
    action: MARK_AS_OVER_ANNOTATED
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001944787
        source_label: PTN001944787
        source_status: UNRESOLVED
        comment: Root IBD seeded by two mouse ACSM paralogs; the activating ligase reaction makes acyl-CoA, not fatty acid.
      - source_id: MGI:MGI:2152200
        source_label: mouse Acsm1 (MACS1)
        source_status: UNRESOLVED
        comment: Seed paper PMID:11470804 (abstract only) reports its acyl-CoA products are used mainly for oxidation.
      - source_id: MGI:MGI:99538
        source_label: mouse Acsm3 (Sa)
        source_status: UNRESOLVED
        comment: Same seed paper and same oxidation finding as Acsm1.
    reason: >-
      The IBD on PTHR43605 root node PTN001944787 is seeded by mouse Acsm1
      (MGI:2152200) and Acsm3 (MGI:99538), annotated by MGI from PMID:11470804.
      That paper characterises both as medium-chain acyl-CoA synthetases whose
      acyl-CoA products are "utilized mainly for oxidation", which argues against
      a fatty acid biosynthetic role. The ligase reaction forms a fatty-acyl-CoA,
      not a fatty acid, so the intended concept was probably fatty-acyl-CoA
      biosynthetic process (GO:0046949), proposed here as the replacement for the
      acyl-CoA metabolic process row. Nothing places ACSM4 in de novo or
      mitochondrial fatty acid synthesis. Not removed because only the seed
      paper's abstract was read.
    supported_by:
    - reference_id: file:interpro/panther/PTHR43605/PTHR43605-paint.tsv
      supporting_text: "PTHR43605\tPTN001944787\tGO:0006633\tP\tIBD\tfalse\tMGI:MGI:2152200|MGI:MGI:99538\ttaxon:\t20170228"
    - reference_id: PMID:11470804
      supporting_text: (14)C-Fatty acid incorporation studies indicated that acyl-CoAs
        produced by MACS1 and Sa protein are utilized mainly for oxidation.
