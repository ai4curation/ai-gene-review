id: P0C7M7
gene_symbol: ACSM4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ACSM4 (acyl-CoA synthetase medium-chain family member 4) encodes a
  mitochondrial AMP-forming acyl-CoA synthetase of the medium-chain (ACSM)
  subfamily of the ANL adenylate-forming enzyme superfamily, one of the
  xenobiotic/medium-chain fatty acid:CoA ligases. It carries an N-terminal
  mitochondrial transit peptide and the AMP-binding and AMP-binding C domains.
  By orthology with rat O-MACS, the experimentally characterised olfactory
  epithelium-specific ortholog, it is expected to catalyse the ATP-dependent
  ligation of free medium-chain fatty acids (C6-C12) to coenzyme A, forming the
  acyl-CoA thioester with release of AMP and diphosphate, the activation step
  that precedes their use in downstream metabolism. The human protein was
  detected in a high-confidence mitochondrial proteome. Its enzymatic activity,
  substrates and physiological role in human have not been characterised
  directly.
existing_annotations:
- term:
    id: GO:0004321
    label: fatty-acyl-CoA synthase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001944787
  - RGD:727928
  review:
    summary: >-
      Wrong reaction. GO:0004321 is the fatty acid synthase reaction (acetyl-CoA
      + n malonyl-CoA + NAD(P)H -> long-chain acyl-CoA, EC 2.3.1.86), not the
      ATP-dependent acyl-CoA synthetase (ligase, EC 6.2.1.2) reaction of ACSM4.
      The term is not a broader form of the ligase activity; it names a
      different reaction.
    action: REMOVE
    propagation_review:
      root_cause: SOURCE_BAD
      source_entities:
      - source_id: PANTHER:PTN001944787
        source_label: PTN001944787
        source_status: SOURCE_BAD
        comment: Root IBD of PTHR43605 for a fatty acid synthase reaction term in a family of AMP-forming acyl-CoA ligases; its only seed is RGD:727928.
      - source_id: RGD:727928
        source_label: rat Acsm4 (O-MACS)
        source_status: SOURCE_BAD
        comment: RGD IDA from PMID:12709059, which measured acyl-CoA synthetase (ligase) activity, mapped to the fatty-acyl-CoA synthase term.
    reason: >-
      ACSM4 is an AMP-forming acyl-CoA synthetase (EC 6.2.1.2, Pfam AMP-binding,
      PANTHER PTHR43605) with no ketoacyl synthase, reductase, dehydratase or acyl
      carrier domains, so it cannot catalyse the fatty acid synthase reaction this
      term defines. The IBA comes from a PAINT IBD on PTHR43605 root node
      PTN001944787 whose only seed is the RGD IDA on rat Acsm4 (RGD:727928) from
      PMID:12709059, a paper that measured acyl-CoA synthetase activity for fatty
      acid activation, i.e. the ligase reaction. The correct activity is captured
      on this gene by medium-chain fatty acid-CoA ligase activity (GO:0031956).
    supported_by:
    - reference_id: file:interpro/panther/PTHR43605/PTHR43605-paint.tsv
      supporting_text: "PTHR43605\tPTN001944787\tGO:0004321\tF\tIBD\tfalse\tRGD:727928\ttaxon:\t20170228"
    - reference_id: PMID:12709059
      supporting_text: Recombinant O-MACS protein tagged with c-Myc and His6
        demonstrated an acyl-CoA synthetase activity for fatty acid activation
    - reference_id: file:human/ACSM4/ACSM4-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: DR   Pfam; PF00501; AMP-binding; 1.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN001944787
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0004321
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The PAINT IBD placing GO:0004321 fatty-acyl-CoA synthase activity (EC
        2.3.1.86, the fatty acid synthase reaction from acetyl-CoA and
        malonyl-CoA) on PTHR43605 root node PTN001944787 should be retracted.
        PTHR43605 is the acyl-coenzyme A synthetase family of AMP-forming ligases
        (EC 6.2.1); its members activate fatty acids to acyl-CoA and have none of
        the fatty acid synthase domains. The IBD's only seed, RGD:727928 (rat
        Acsm4), carries this term from a paper that measured acyl-CoA synthetase
        (ligase) activity. The same node already carries the correct GO:0015645
        fatty acid ligase activity.
