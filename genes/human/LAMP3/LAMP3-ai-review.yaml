id: Q9UQV4
gene_symbol: LAMP3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: LAMP3 (DC-LAMP, CD208) is a single-pass type I glycoprotein of the LAMP family with a heavily
  glycosylated luminal domain containing a single LAMP domain and a short cytoplasmic tail with a lysosomal
  targeting motif. Unlike the ubiquitous LAMP1/LAMP2 it is expressed in restricted cell types, notably
  mature interdigitating dendritic cells (where it is strongly induced on activation), alveolar type II
  pneumocytes (in the limiting membrane of surfactant-storing lamellar bodies), activated B cells and
  many carcinomas. In dendritic cells it appears in MHC class II compartments before MHC II is transferred
  to the cell surface and then concentrates in perinuclear lysosomes. It resides mainly in lysosomal and
  late endosomal membranes, with a small cell-surface pool. Reported roles include promoting autophagic
  flux as an ATF4/UPR target, supporting influenza A virus post-entry replication and Salmonella intracellular
  growth, but its molecular activity is not defined.
