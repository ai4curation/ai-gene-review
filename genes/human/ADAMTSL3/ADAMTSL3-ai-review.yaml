  review:
    summary: 'Correct, well founded, and the best-supported statement in this gene''s record. Accepted
      as core.


      Resolving the WITH/FROM field settles it rather than merely making it plausible. The seventeen tokens
      are sixteen protein donors plus the PANTHER node PTN000347317, and every one of the sixteen resolves:
      Drosophila papilin and lonely heart, C. elegans mig-6/papilin, mouse Adamts1, Adamts2, Adamts7,
      Adamtsl2, Adamtsl4, Adamtsl5, Papln and Thsd4, rat Adamts1, and human ADAMTS9, ADAMTS10, ADAMTS17
      and ADAMTSL5. Asking what each donor carries for this term in its own right, rather than assuming,
      returns sixteen out of sixteen with their own IDA or HDA to GO:0031012 or a descendant. There is
      no self-referential token, so none of the support is circular. Two of the sixteen (Drosophila loh
      and mouse Adamtsl5) are unreviewed TrEMBL entries, which weakens their names as evidence but not
      their curated annotations.


      The donors are not, however, in the same place. Their experimental annotations are spread across
      GO:0005604 basement membrane (both papilins, mouse Adamts1), GO:0005614 interstitial matrix (mouse
      Adamtsl4), GO:0001527 microfibril (mouse Thsd4) and GO:0031012 itself. So the general term is the
      genuine least common ancestor of a heterogeneous donor set, and refining it downward would mean
      picking one donor''s compartment over another''s. No specificity upgrade is warranted, and the row
      is not less precise than its donors.


      ADAMTSL3 also has its own direct evidence for this location, which the propagation happens to agree
      with: punctin-2 expressed in COS-7 cells is deposited in the extracellular matrix, and UniProt records
      the subcellular location with ECO:0000269 against that paper. That experimental annotation has never
      been transferred into GOA, so the IBA is currently doing work that an IDA should be doing alongside
      it.'
    action: ACCEPT
    reason: Sixteen of sixteen protein donors carry their own experimental annotation to this term or
      a descendant, with no self-referential token; the donor set is heterogeneous across basement membrane,
      interstitial matrix and microfibril, so GO:0031012 is the correct LCA rather than an under-specified
      term; and the target has independent direct evidence for the same location from PMID:14667842.
    supported_by:
    - reference_id: file:human/ADAMTSL3/ADAMTSL3-bioinformatics/RESULTS.md
      supporting_text: '**16 of 16** carry their own experimental annotation to GO:0031012 or a descendant.'
    - reference_id: file:human/ADAMTSL3/ADAMTSL3-bioinformatics/RESULTS.md
      supporting_text: the donor set is heterogeneous in *which* matrix compartment it occupies, so the
        general parent is the least common ancestor rather than a curator failing to be specific.
