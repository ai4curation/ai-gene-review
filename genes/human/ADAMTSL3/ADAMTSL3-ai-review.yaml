- id: PMID:36539599
  title: ADAMTSL3 knock-out mice develop cardiac dysfunction and dilatation with increased TGFβ signalling
    after pressure overload.
  findings:
  - statement: Overexpression of human ADAMTSL3 in human foetal cardiac fibroblasts lowers phospho-SMAD2
      and active TGF-beta - the only human-cell functional experiment on this protein.
    supporting_text: Immunoblotting revealed reduced pSMAD (Fig. 4h) and reduced active TGFβ (Fig. 4i),
      indicating reduced TGFβ signalling.
  - statement: The gain-of-function experiment used adenoviral overexpression, so the appropriate evidence
      code is IMP rather than IDA.
    supporting_text: For further mechanistic insights, we overexpressed full-length ADAMTSL3 (L3) and
      a vehicle control adenovirus (veh) in cultures of human foetal CFBs (hfCFBs)
  - statement: Loss and gain of function agree in sign, which is what makes the negative-regulation direction
      safe.
    supporting_text: Taken together, the loss-of-function and gain-of-function studies suggest ADAMTSL3
      as an inhibitor of TGFβ signalling in the heart in vivo and in cardiac fibroblasts in vitro.
  - statement: Adamtsl3-null mouse hearts show raised active TGF-beta and cardiac fibroblast activation
      after aortic banding.
    supporting_text: We found that Adamtsl3 knock-out mice develop exacerbated cardiac dysfunction and
      dilatation with increased mortality, and hearts show increased TGFβ activity and CFB activation
      after pressure overload by aortic banding.
  - statement: 'The authors state the family-level premise independently: ADAMTSLs lack a catalytic domain.'
    supporting_text: ADAMTSLs are structurally related to the ADAMTS ECM proteases12, but lack a catalytic
      domain, leaving their biological function largely unknown.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Verified against the PMC full text. Loss-of-function is mouse; the gain-of-function
      is human protein in human cells, which is what carries the human annotation. Not in ADAMTSL3's GOA.
- id: PMID:37572323
  title: Adamtsl3 mediates DCC signaling to selectively promote GABAergic synapse function.
  findings:
  - statement: Mouse conditional deletion of Adamtsl3 in neurons reduces DCC protein and the density of
      glutamatergic and GABAergic synapses.
    supporting_text: We demonstrate that early post-natal deletion of Adamtsl3 in neurons impairs DCC
      protein expression, causing reduced density of both glutamatergic and GABAergic synapses.
    full_text_unavailable: true
  - statement: Adamtsl3 acts as a hippocampal synapse organiser through the DCC receptor.
    supporting_text: Here, we identify that the secreted protein Adamtsl3 functions as critical hippocampal
      synapse organizer acting through the transmembrane receptor DCC (deleted in colorectal cancer).
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract-only. Mouse conditional knockouts, so it supports an ISS rather than
      an IMP annotation for the human gene.
- id: PMID:42277231
  title: Schizophrenia-associated glycoprotein Adamtsl3 regulates perineuronal net formation, maintenance,
    and adult cortical plasticity.
  findings:
  - statement: Adamtsl3 is required cell-autonomously by parvalbumin interneurons for perineuronal net
      integrity - independent evidence that this protein organises a specialised extracellular matrix.
    supporting_text: Here, we identify the schizophrenia-associated glycoprotein Adamtsl3 as a PV+ cell-autonomous
      regulator of PNN integrity.
    full_text_unavailable: true
  - statement: 'The proposed mechanism runs through MMP9: Adamtsl3 loss raises MMP9 and the perineuronal
      net defect is rescued by MMP9 inhibition.'
    supporting_text: Mechanistically, Adamtsl3 modulates matrix metalloprotease-9 (MMP9) activity, and
      Adamtsl3 deletion results in elevated MMP9 levels, PNN reduction, decreased Otx2 uptake, and heightened
      oxidative stress in PV+ cells.
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: '2026 paper, cached abstract-only, mouse. Cited as independent corroboration of extracellular
      matrix organisation rather than as the basis for an MMP-inhibitor annotation: the abstract reports
      elevated MMP9 levels as well as activity, so whether ADAMTSL3 inhibits the enzyme or limits its
      abundance is not resolved from the abstract.'
- id: file:human/ADAMTSL3/ADAMTSL3-deep-research-affinage.md
  title: Affinage mechanistic annotation for ADAMTSL3 (human)
  findings:
  - statement: 'Machine-generated record. Its one directly usable contribution is a corpus-level negative:
      no biochemical mechanism has been published for the effect of ADAMTSL3 on DCC. Independently confirmed
      here by searching the ADAMTSL3 literature.'
    supporting_text: The biochemical mechanism by which this non-catalytic ECM protein controls DCC receptor
      levels has not been characterized in the available corpus.
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: 'gates_passed: False. The tripped gate is a suspected symbol collision raised because
      the narrative opens on C. elegans; on inspection that is a false positive, since the narrative correctly
      identifies human ADAMTSL3/punctin-2 and is discussing the worm orthologue Ce-Punctin/madd-4. Every
      claim taken from the record was nonetheless re-verified against the cited PMIDs, and four defects
      were found. (1) A mis-joined citation: the record attributes a synaptic-organiser function for human
      ADAMTSL3 to PMID:14667842 plus PMID:24896188, but the first is a 2003 ECM cloning paper with no
      synaptic content and the second is about the worm protein - each constituent statement is defensible
      and the join is not. (2) A finding sourced to bioRxiv with an em dash in the PMID column; it has
      since appeared as PMID:42497245 but supports no GO term. (3) PMID:18474779 is over-read as showing
      an antiangiogenic role for ADAMTSL-3 when it shows only that the transcript is raised in glaucoma
      astrocytes. (4) It misses the two most informative papers for this gene, PMID:22242013 and PMID:36539599,
      so its statement that no mechanism has been characterised is a statement about its own corpus. Used
      here only for that corpus-level negative, and only after confirming it independently.'
- id: PMID:24896188
  title: C. elegans Punctin specifies cholinergic versus GABAergic identity of postsynaptic domains.
  findings:
  - statement: The nematode orthologue is a secreted synaptic organiser that assigns neurotransmitter
      identity to postsynaptic domains, establishing that the synaptic role is ancestral.
    supporting_text: C. elegans Punctin specifies cholinergic versus GABAergic identity of postsynaptic
      domains.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: About the worm protein, not human ADAMTSL3, and MADD-4 is the co-orthologue of ADAMTSL1
      and ADAMTSL3 - so it supports conservation of the role, not a claim about the human gene. The affinage
      record cites this paper together with PMID:14667842 to assert a synaptic-organiser function for
      human ADAMTSL3; neither paper makes that claim.
- id: PMID:22014523
  title: MADD-4 is a secreted cue required for midline-oriented guidance in Caenorhabditis elegans.
  findings:
  - statement: MADD-4 signals through UNC-40/DCC, the same receptor that mediates Adamtsl3's effect in
      the mouse hippocampus - so the receptor pairing, not just the protein, is conserved.
    supporting_text: MADD-4's activity is dependent on UNC-40/DCC, a netrin receptor, which functions
      cell-autonomously to direct membrane extension.
    full_text_unavailable: true
  - statement: MADD-4 is the co-orthologue of both ADAMTSL1 and ADAMTSL3, so worm phenotypes cannot be
      assigned to either human paralogue alone.
    supporting_text: The biological role of MADD-4 orthologs, including ADAMTSL1 and 3 in mammals, is
      unknown.
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Worm genetics. Cited for the conserved MADD-4/UNC-40-DCC axis and for the explicit statement
      that MADD-4 has two mammalian orthologues.
- id: PMID:18391952
  title: Genome-wide association analysis identifies 20 loci that influence adult height.
  findings:
  - statement: ADAMTSL3 is one of the reproducible genome-wide association loci for adult height, and
      was interpreted by the authors as an extracellular matrix gene. This motivates the growth-plate
      experiment but supports no GO term on its own.
    supporting_text: The genes implicate a number of biological pathways and processes in the normal determination
      of human height, including Hedgehog signaling (IHH, HHIP, PTCH1), basic cell cycle regulation (CDK6,
      one of the cyclin-dependent kinases implicated in cell cycle progression13), extracellular matrix
      (ADAMTSL3 and EFEMP1) and chromatin rearrangement and polycomb proteins (HMGA2 and SCMH1).
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: A locus association, not a statement about the protein's activity. Recorded because
      it is why the gene is studied; deliberately not used to support any annotation.
- id: PMID:21239144
  title: 'ADAMTSL3 as a candidate gene for schizophrenia: gene sequencing and ultra-high density association
    analysis by imputation.'
  findings:
  - statement: The schizophrenia association at ADAMTSL3 is refined but not resolved; the paper's own
      conclusion is that the gene remains a candidate.
    supporting_text: Our study confirms ADAMTSL3 as a candidate for further investigation in schizophrenia,
      using the variants identified here.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Genetic association only, correctly described by its own abstract as a candidate rather
      than an established gene. Cited for context behind the two mouse neuronal papers; supports no GO
      term.
- id: PMID:32266537
  title: Genome-wide CRISPR knockout screens identify ADAMTSL3 and PTEN genes as suppressors of HCC proliferation
    and metastasis, respectively.
  findings:
  - statement: ADAMTSL3 emerged from a genome-wide CRISPR screen in one hepatocellular carcinoma line
      as a suppressor of proliferation. Single screen, single line, no mechanism.
    supporting_text: Moreover, knocking out either the ADAMTSL3 or PTEN genes promoted either the proliferation
      or metastasis of HCC cells, respectively.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: The ADAMTSL3 result rests on sgRNAs appearing twice in one genome-wide screen in one
      cell line, with no mechanistic follow-up and no independent replication. Cited so the claim is on
      record and explicitly not annotated.
- id: PMID:18474779
  title: Antiangiogenic characteristics of astrocytes from optic nerve heads with primary open-angle glaucoma.
  findings:
  - statement: ADAMTSL-3 transcript is raised in optic-nerve-head astrocytes from glaucoma donors. The
      reduced tube formation reported in the same paper is a property of the astrocyte populations, not
      of ADAMTSL3, which was never perturbed.
    supporting_text: The ONH astrocytes from donors with POAG decreased expression of proangiogenic factors
      (vascular endothelial growth factor C and platelet-derived growth factor A) and increased expression
      of antiangiogenic factors (collagen XVIII and ADAMTSL-3) when compared with normal ONH astrocytes.
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: 'Cited by the affinage deep-research record as showing an antiangiogenic role for ADAMTSL-3.
      It shows no such thing: ADAMTSL-3 is one of two transcripts raised in glaucoma astrocytes, and the
      coculture tube-formation assay compares whole astrocyte populations with no ADAMTSL3 gain or loss
      of function. Correlation presented as function.'
