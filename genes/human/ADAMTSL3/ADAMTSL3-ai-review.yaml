      method names - two hybrid array, two hybrid prey pooling approach and validated two hybrid - which
      are sub-methods of one Y2H pipeline rather than three independent assays, so the NbExp values in
      the UniProt INTERACTION block count Y2H variants and not orthogonal confirmation. Disaggregating
      IntAct by pair rather than by gene - which is the only way the question can be answered, because
      ADAMTSL3''s gene-level record also covers 17 partners that are not in GOA - shows that 0 of these
      13 pairs carries any non-Y2H detection method. The anti-tag co-immunoprecipitation and BioID methods
      present in ADAMTSL3''s IntAct record belong entirely to those other 17 partners, from separate publications
      that are not the source of any GOA row reviewed here.


