suggested_questions:
- question: 'PAINT has already made the key-residue judgement that the ADAMTS catalytic domain is lost
    in this family, but has attached it to the wrong node. In PTHR13723, the root node PTN000347317 carries
    GO:0004222 metalloendopeptidase activity and GO:0006508 proteolysis as IBD, seeded exclusively by
    genuine ADAMTS proteinases; node PTN002673039 carries NOT GO:0004222 by IKR and NOT GO:0006508 by
    IRD. Streaming the PANTHER leaf GAF shows PTN002673039 projects onto exactly 22 leaves, every one
    an ADAMTSL2 orthologue. The identical loss of the metalloprotease and disintegrin domains is shared
    by ADAMTSL1, ADAMTSL3, ADAMTSL4, ADAMTSL5, PAPLN, THSD4 and the invertebrate members madd-4, loh and
    papilin, none of which carries the NOT. Could the IKR be moved or duplicated to the ancestral node
    of the non-catalytic ADAMTSL clade? That single edit would state the catalytic loss for six further
    human genes. I have not proposed a gene-level NOT GO:0004222 row for ADAMTSL3 alone, because the defect
    is clade-wide and fixing one leaf would leave the other five untouched while duplicating machinery
    PAINT already has in the right form - but a leaf-level NOT, inferred from the absent metalloprotease
    and disintegrin domains, would be the correct fallback if the node cannot be re-annotated. Related
    observation for the same curators: the NOT GO:0006508 IRD row at PTN002673039 produces no leaf annotation
    at all, not even on ADAMTSL2.'
  experts:
  - GO Central / PAINT curators
  - PANTHER
- question: Within PTHR13723, why does GO:0030198 extracellular matrix organization reach ADAMTSL2, ADAMTSL4
    and THSD4 from node PTN000347317 but not ADAMTSL3 or ADAMTSL5, and why do human ADAMTSL1 and PAPLN
    receive no PAINT annotation at all when their mouse and fly orthologues do? The split does not track
    any biological criterion I can find - ADAMTSL3 has direct fibrillin-1 binding data and a matrix phenotype
    in two independent mouse knockouts, which is more than several of the members that do receive the
    term.
  experts:
  - GO Central / PAINT curators
- question: PMID:22242013 contradicts itself about the species of the ADAMTSL-3 reagent. The Results describe
    recombinant human ADAMTSL-1, -2 and -3, while the Methods state that the ADAMTSL3 constructs were
    made from a RIKEN clone and mouse lung cDNA, and say the same explicitly for ADAMTSL2. Which is correct?
    The answer decides whether the fibrillin-1, ADAMTS-10 and LTBP-1 interactions should be annotated
    to human ADAMTSL3 as IPI or as ISS from the mouse orthologue.
  experts:
  - Authors of PMID:22242013 (Sakai / Apte laboratories)
- question: UniProt records ADAMTSL3's extracellular matrix localisation with ECO:0000269|PubMed:14667842,
    but GOA has no corresponding IDA row, so the only localisation annotation the gene carries is a phylogenetic
    inference. Can the UniProt experimental localisation be propagated into GOA?
  experts:
  - UniProt-GOA
- question: ADAMTSL3 binds fibrillin-1 and LTBP-1 and restrains TGF-beta signalling, and the ADAMTSL2
    and ADAMTS10 mutations that cause geleophysic dysplasia and Weill-Marchesani syndrome act on the same
    microfibril axis - yet no Mendelian disorder has been attributed to ADAMTSL3, only common-variant
    associations with height and lean mass. Is that because loss of ADAMTSL3 is tolerated, or because
    the phenotype has not been looked for? Are there biallelic loss-of-function carriers in large sequencing
    cohorts, and what are their stature and cardiac phenotypes?
  experts:
  - Human genetics of the fibrillinopathies
  - gnomAD / large cohort sequencing
suggested_experiments:
- hypothesis: ADAMTSL3 is a component of fibrillin microfibrils rather than a soluble matrix protein that
    binds fibrillin-1 transiently.
  description: Raise and validate ADAMTSL3-specific antibodies against a region absent from the other
    ADAMTSLs, using Adamtsl3-null tissue as the specificity control - the reagent gap has blocked this
    question since 2012. Then perform immunofluorescence and immunoelectron microscopy on skin, aorta
    and myocardium with fibrillin-1 co-staining, and test whether ADAMTSL3 co-fractionates with microfibrils
    extracted by bacterial collagenase digestion.
  experiment_type: immunolocalisation and biochemical fractionation
- hypothesis: ADAMTSL3 restrains TGF-beta signalling by retaining the large latent complex on microfibrils,
    not by altering transcription of the pathway.
  description: Separate the two mechanisms in the human cardiac fibroblast system. Compare full-length
    ADAMTSL3 with a C-terminal fragment carrying the fibrillin-1 and LTBP-1 binding activity but nothing
    else, and with a construct in which those binding surfaces are disrupted; read out phospho-SMAD2 and
    active TGF-beta against matrix-bound versus soluble LTBP1 and LAP. If sequestration is the mechanism,
    the binding-competent fragment should suffice and the effect should require an assembled fibrillin
    scaffold - testable by repeating in FBN1-null fibroblasts.
  experiment_type: structure-function and epistasis in human cells
- hypothesis: ADAMTSL3 and ADAMTS10 act as a complex on fibrillin-1, as the 2 nM binding affinity suggests.
  description: 'Test whether ADAMTSL3 modulates ADAMTS10''s activity or its microfibril association: reconstitute
    fibrillin-1 microfibril assembly in vitro and in cell culture with and without ADAMTSL3, and ask whether
    ADAMTSL3 alters ADAMTS10 binding to fibrillin-1, its zymogen processing, or its proteolytic activity.
    A non-catalytic family member that binds a proteinase of the same family at nanomolar affinity is
    a candidate regulator of that proteinase, which no GO term currently records.'
  experiment_type: in vitro reconstitution
- hypothesis: The mouse Adamtsl3 neuronal phenotypes reflect a function conserved in human ADAMTSL3.
  description: 'Do the experiment that would license an experimental rather than an inferred annotation
    for the human gene: delete or knock down ADAMTSL3 in human iPSC-derived cortical neuron and parvalbumin-interneuron
    cultures and assay DCC protein levels, synapse density and perineuronal net formation, with rescue
    by wild-type human ADAMTSL3. Include the reported schizophrenia-associated variant rs950169 in the
    rescue panel.'
  experiment_type: human iPSC neuronal model
- hypothesis: The height and lean-mass association at the ADAMTSL3 locus acts through TGF-beta availability
    in the growth plate.
  description: Measure growth-plate architecture, chondrocyte proliferation and phospho-SMAD2 in Adamtsl3-null
    mice against littermate controls, and test whether long-bone growth retardation is rescued by TGF-beta
    pathway inhibition. The Weill-Marchesani fibrillin-1 mouse, which loses the ADAMTSL binding site,
    already shows retardation of long bone growth, so the axis is testable genetically.
  experiment_type: mouse skeletal phenotyping
