- description: Negative regulator of TGF-beta signalling in the extracellular matrix. Overexpression of
    human ADAMTSL3 in human foetal cardiac fibroblasts lowers phospho-SMAD2 and active TGF-beta and depletes
    the large latent complex components LAP and LTBP1 from both cell and matrix fractions, with coordinate
    downregulation of TGFB1, TGFB2, SMAD3, SMAD4 and TGFBR1 and upregulation of the inhibitory SMAD6;
    Adamtsl3-null mouse hearts show the reciprocal rise in active TGF-beta and phospho-SMAD2 after pressure
    overload, with worse dilatation and increased mortality. Whether the restraint operates by sequestering
    latent complex through the LTBP-1 and fibrillin-1 interactions, or through the transcriptional changes,
    is not resolved.
