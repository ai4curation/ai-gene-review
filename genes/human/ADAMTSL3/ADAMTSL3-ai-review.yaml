description: 'ADAMTSL3, also called punctin-2, is a large secreted glycoprotein of the extracellular matrix.
  Despite the family name it is not a proteinase: it is built from two arrays of thrombospondin type-1
  repeats flanking three immunoglobulin-like C2-type domains, with an ADAMTS-type cysteine-rich region
  and a C-terminal PLAC domain, and it lacks both the catalytic metalloprotease domain and the disintegrin-like
  domain that define the ADAMTS proteinases. It carries a cleaved signal peptide and extensive N-linked
  glycosylation, and is deposited into the matrix as a roughly 210-kDa glycoprotein.


  Its molecular role is that of a matricellular adaptor within the fibrillin microfibril network. It binds
  the N-terminal, assembly-competent half of fibrillin-1 at a site deleted in Weill-Marchesani syndrome,
  binds the non-catalytic C-terminal region of the proteinase ADAMTS10 with nanomolar affinity, and binds
  the C-terminal domains of latent TGF-beta binding protein 1 - the two matrix proteins that between them
  sequester the large latent TGF-beta complex. Consistent with that placement, ADAMTSL3 restrains TGF-beta
  signalling: its loss in mice raises active TGF-beta and SMAD2 phosphorylation in the pressure-overloaded
  heart, while raising it in human cardiac fibroblasts lowers SMAD2 phosphorylation, myofibroblast differentiation
  and collagen synthesis. In the nervous system it acts through the receptor DCC to set hippocampal synapse
  density and GABAergic synapse function, and parvalbumin interneurons require it cell-autonomously to
  build and maintain perineuronal nets, a role conserved to the nematode orthologue Ce-Punctin/MADD-4,
  which specifies cholinergic versus GABAergic postsynaptic identity through UNC-40/DCC.


  The protein is broadly expressed - in epithelia of colon, skin, breast, prostate, liver and pancreas,
  and in endothelium, smooth muscle, fibroblasts, cortical and ganglionic neurons and cardiac myocytes.
  Common variants at the ADAMTSL3 locus are among the reproducible genome-wide association signals for
  adult height and lean body mass, and the gene has been proposed as a candidate at schizophrenia.'
