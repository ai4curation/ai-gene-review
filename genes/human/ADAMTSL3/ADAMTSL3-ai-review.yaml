- id: PMID:22242013
  title: Microenvironmental regulation by fibrillin-1.
  findings:
  - statement: The C-terminal region of ADAMTSL-3 binds the N-terminal half of fibrillin-1 by SPR; ADAMTSL-1
      does not, so the interaction is selective within the family.
    supporting_text: Similar to ADAMTSL-6 [24], ADAMTSL-2, -3, and papilin polypeptides interacted with
      the N-terminal half of fibrillin-1, while ADAMTSL-1 did not.
  - statement: The Weill-Marchesani three-domain deletion in fibrillin-1 abolishes ADAMTSL binding, mapping
      the site.
    supporting_text: ADAMTSL-2, -3, and -6 and papilin polypeptides did not bind to recombinant fibrillin-1
      polypeptides with the WMS three-domain deletion (Figure 5a and Table S1).
  - statement: ADAMTSL-3 binds the non-catalytic C-terminal region of ADAMTS-10 with a KD of 2 nM, and
      this too is selective within the family.
    supporting_text: SPR also showed that the C-terminal end of ADAMTS-10 interacted with the C-terminal
      end of ADAMTSL-3 with high binding affinity (KD = 2 nM) (Figure 5c).
  - statement: ADAMTSL-3 binds the C-terminal domains of LTBP-1 but not LTBP-4, connecting it to latent
      TGF-beta sequestration.
    supporting_text: Binding between ADAMTSL-3 and the C-terminal domains of LTBP-1 was also detected,
      but neither ADAMTSL-2 nor -3 interacted with LTBP-4.
  - statement: No colocalisation of ADAMTSL-3 with fibrillin-1 was tested, because ADAMTSL3-specific antibodies
      did not exist. This is the reason the elastic-fiber annotation cannot be treated as an established
      location.
    supporting_text: Since antibodies specific for ADAMTSL-2 and -3 are not yet available, we were unable
      to determine whether these proteins also colocalize with fibrillin-1 in skin and whether these are
      also reduced in WMΔ mutant mice.
  - statement: 'The Methods contradict the Results on the species of the ADAMTSL-3 reagent: the Results
      call it human, the Methods describe a RIKEN clone plus mouse lung cDNA.'
    supporting_text: Constructs for ADAMTSL3 were made using a clone (RIKEN) and mouse lung cDNA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The single most informative paper for ADAMTSL3''s molecular function, and entirely
      absent from its GOA. Verified against the PMC full text. One internal inconsistency, recorded above
      and raised as a question rather than silently resolved: Results say the ADAMTSL-3 polypeptide was
      human, Methods say the construct came from a RIKEN clone and mouse lung cDNA.'
