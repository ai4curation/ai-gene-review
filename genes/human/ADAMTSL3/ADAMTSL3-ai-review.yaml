- term:
    id: GO:0030198
    label: extracellular matrix organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR013273
  review:
    summary: 'Accepted, and it is better founded than its provenance suggests.


      As delivered this is a family-level signature mapping: IPR013273 is the ADAMTS/ADAMTS-like PRINTS
      signature, which matches catalytic ADAMTS proteinases and non-catalytic ADAMTS-like proteins alike,
      so on its own it says only that ADAMTSL3 belongs to a family that remodels matrix. For a protein
      with no catalytic domain that would be a thin argument, since the family''s best-known route to
      matrix organisation is proteolysis, which ADAMTSL3 cannot perform.


      Three independent lines of evidence nonetheless support the term for this protein specifically.
      It binds the N-terminal, assembly-competent half of fibrillin-1 by surface plasmon resonance, and
      the Weill-Marchesani three-domain deletion in fibrillin-1 abolishes that binding, so the interaction
      maps to a defined region of a microfibril scaffold protein. Adamtsl3 knock-out mice show altered
      matrix output and TGF-beta activity in the pressure-overloaded heart, and ADAMTSL3 overexpression
      in human cardiac fibroblasts lowers collagen synthesis and myofibroblast differentiation. And in
      the brain, loss of Adamtsl3 reduces perineuronal nets, which are a specialised extracellular matrix,
      in a cell-autonomous manner in parvalbumin interneurons.


      So the term is right, and the interesting point is that the reasoning behind the automatic assignment
      is not the reasoning that justifies it. Kept general rather than refined: the three lines of evidence
      point at three different matrices (microfibril, cardiac interstitium, perineuronal net), which is
      exactly the situation in which the parent term is the correct call.'
    action: ACCEPT
    reason: 'A family-level InterPro signature term that independent gene-specific evidence happens to
      support: fibrillin-1 binding by SPR with a mapped binding site, altered cardiac matrix output in
      Adamtsl3-null mice with a human-cell gain-of-function counterpart, and cell-autonomous loss of perineuronal
      nets in Adamtsl3-null parvalbumin interneurons. Left general because those three lines implicate
      three different matrices.'
    additional_reference_ids:
    - PMID:22242013
    - PMID:36539599
    - PMID:42277231
    supported_by:
    - reference_id: file:human/ADAMTSL3/ADAMTSL3-uniprot.txt
      supporting_text: DR   InterPro; IPR013273; ADAMTS/ADAMTS-like.
    - reference_id: PMID:22242013
      supporting_text: ADAMTSL-2, -3, and -6 and papilin polypeptides did not bind to recombinant fibrillin-1
        polypeptides with the WMS three-domain deletion (Figure 5a and Table S1).
    - reference_id: PMID:42277231
      supporting_text: Here, we identify the schizophrenia-associated glycoprotein Adamtsl3 as a PV+ cell-autonomous
        regulator of PNN integrity.
      full_text_unavailable: true
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0C7H8
  review:
    summary: 'Over-annotated. KRTAP2-3 (P0C7H8, 128 aa) is a cysteine-rich hair-cortex keratin-associated
      protein. The pair was reported only in HI-II-14, the CCSB proteome-scale binary interactome map
      (PMID:25416956), and KRTAP2-3 has 10 distinct partners in IntAct - the one partner in this set that
      is not a high-degree prey.


      All fifteen GO:0005515 rows on this gene come from two systematic yeast two-hybrid interactome maps
      and nothing else. Querying IntAct directly for P82987 returns the same pairs logged under three
      method names - two hybrid array, two hybrid prey pooling approach and validated two hybrid - which
      are sub-methods of one Y2H pipeline rather than three independent assays, so the NbExp values in
      the UniProt INTERACTION block count Y2H variants and not orthogonal confirmation. Disaggregating
      IntAct by pair rather than by gene - which is the only way the question can be answered, because
      ADAMTSL3''s gene-level record also covers 17 partners that are not in GOA - shows that 0 of these
      13 pairs carries any non-Y2H detection method. The anti-tag co-immunoprecipitation and BioID methods
      present in ADAMTSL3''s IntAct record belong entirely to those other 17 partners, from separate publications
      that are not the source of any GOA row reviewed here.


      The partner set behaves like screen background rather than like biology. Nine of the thirteen partners
      are hair keratins or keratin-associated proteins and a tenth, CYSRT1, is a cornified-envelope protein
      embedded in the same interaction network; the remaining three are cytosolic or nuclear. The median
      number of distinct IntAct partners across the thirteen is 188 against 30 for ADAMTSL3 itself, and
      six of them exceed 180, so most of this set consists of high-degree promiscuous preys.


      There is also a compartment problem that the assay cannot see. ADAMTSL3 has a cleaved signal peptide
      and is secreted into the extracellular matrix; hair keratin-associated proteins are intracellular
      constituents of the hair cortex, GLRX3 is cytosolic and MDFI is nuclear and cytoplasmic. In a two-hybrid
      assay both proteins are expressed in the yeast nucleus, where a signal peptide is inert, so the
      pairing is never tested in a compartment where it could occur.


      Marked over-annotated rather than removed. These are real observations recorded correctly by IntAct
      curators from published screens, and a screen hit can turn out to matter; what it does not do is
      license a functional claim, and bare protein binding conveys none in any case.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Unreplicated systematic yeast two-hybrid hit. KRTAP2-3 is a cysteine-rich hair-cortex keratin-associated
      protein and carries 10 distinct IntAct partners against ADAMTSL3's 30. Disaggregating IntAct per
      pair rather than per gene shows this pair, like all 13, carries no non-Y2H detection method; it
      has no orthogonal assay, no follow-up in the ADAMTSL3 literature, and ADAMTSL3 is a secreted matrix
      protein that does not share a compartment with it in vivo. Bare protein binding conveys no function
      even where the pairing is real.
    supported_by:
    - reference_id: file:human/ADAMTSL3/ADAMTSL3-bioinformatics/RESULTS.md
      supporting_text: ADAMTSL3 itself has 30 distinct IntAct partners; the median for its 13 annotated
        partners is 188.
    - reference_id: file:human/ADAMTSL3/ADAMTSL3-bioinformatics/RESULTS.md
      supporting_text: '**GOA partners with any non-Y2H detection method: 0 of 13** - every one of these
        pairs rests on yeast two-hybrid sub-methods alone, with no orthogonal assay.'
    - reference_id: file:human/ADAMTSL3/ADAMTSL3-uniprot.txt
      supporting_text: FT   SIGNAL          1..26
