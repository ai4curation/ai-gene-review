- term:
    id: GO:0071953
    label: elastic fiber
  evidence_type: TAS
  original_reference_id: PMID:23962539
  qualifier: located_in
  review:
    summary: 'Kept, but as a non-core location, because no one has ever localised ADAMTSL3 protein to
      an elastic fibre.


      The source is a specialist review of elastic-fibre biology, not primary data, and the cached record
      is abstract-only. Its abstract does not mention ADAMTSL3, so the supporting statement is in text
      I cannot read.


      I therefore tested whether this is a bulk projection. Querying QuickGO by reference returns 66 annotations
      over 62 distinct entities, all TAS and all from GO_Central, split across four terms - so it is indeed
      a reference-driven curation of an elastic-fibre proteome. But it is not an indiscriminate family
      sweep, and that is what decides the action: the GO:0071953 set takes ADAMTSL3, ADAMTSL4, ADAMTSL5
      and THSD4 with their mouse orthologues while leaving out ADAMTSL1, ADAMTSL2 and PAPLN. A curator
      applying the term by family membership would have taken all seven. The selection therefore tracks
      the review''s content, which makes this a genuine traceable author statement rather than an artefact.


      Against that, the biochemistry stops short of a location. ADAMTSL3 binds the N-terminal half of
      fibrillin-1 and the C-terminal domains of LTBP-1, which is why the association is plausible - but
      the paper that established the binding says in as many words that the colocalisation experiment
      could not be done for want of antibodies, and no later work has done it. The gap is therefore not
      an oversight in this review; it is the state of the field.


      Kept as non-core rather than removed: overruling a specialist curator''s traceable statement on
      the strength of a full text I have not read would be exactly the wrong call, and the term is consistent
      with everything that is known. Not accepted as core because a location for which no localisation
      experiment exists should not be presented as established.'
    action: KEEP_AS_NON_CORE
    reason: A traceable author statement from a specialist elastic-fibre review, applied selectively within
      the ADAMTSL family rather than by family membership, and consistent with ADAMTSL3's demonstrated
      binding to fibrillin-1 and LTBP-1. But no published experiment localises ADAMTSL3 protein to an
      elastic fibre or a microfibril - the study that established the fibrillin-1 binding states that
      the colocalisation could not be attempted because antibodies did not exist - so it is retained without
      being treated as an established core location.
    additional_reference_ids:
    - PMID:22242013
    supported_by:
    - reference_id: PMID:23962539
      supporting_text: They are laid down during development, and comprise a cross-linked elastin core
        within a template of fibrillin-based microfibrils.
      full_text_unavailable: true
    - reference_id: PMID:22242013
      supporting_text: Since antibodies specific for ADAMTSL-2 and -3 are not yet available, we were unable
        to determine whether these proteins also colocalize with fibrillin-1 in skin and whether these
        are also reduced in WMΔ mutant mice.
    knowledge_gaps:
    - gap_statement: ADAMTSL3 has never been localised in tissue. There is no published immunolocalisation
        of the endogenous protein to microfibrils, elastic fibres, or any other defined matrix structure.
      boundary: The binding side is solid - SPR against fibrillin-1 and LTBP-1 with mapped sites and negative
        controls - and the protein is unambiguously secreted into matrix in transfected cells.
      gap_kind:
      - BIOLOGY
      dark_aspect: CC_DARK
      status: OPEN
      significance: Whether ADAMTSL3 is a microfibril component or a soluble matrix protein that binds
        fibrillin-1 transiently changes what it can be doing to latent TGF-beta, and the elastic-fibre
        annotation currently rests on the more committal of those two readings.
      resolution: Raise ADAMTSL3-specific antibodies and perform immunofluorescence and immunoelectron
        microscopy on skin, aorta and myocardium, with fibrillin-1 co-staining and an Adamtsl3-null control
        for specificity.
      provenance:
      - reference_id: PMID:22242013
        supporting_text: Since antibodies specific for ADAMTSL-2 and -3 are not yet available, we were
          unable to determine whether these proteins also colocalize with fibrillin-1 in skin
- term:
    id: GO:0050840
    label: extracellular matrix binding
  evidence_type: ISS
  original_reference_id: PMID:22242013
  qualifier: enables
  supporting_entities:
  - UniProtKB:G3UXC7
  review:
    summary: 'Proposed. This is the gene''s best-characterised molecular activity and it is entirely absent
      from GOA, which currently gives ADAMTSL3 no molecular function beyond bare protein binding to a
      set of two-hybrid preys.


      Surface plasmon resonance shows that the C-terminal end of ADAMTSL-3 binds the N-terminal half of
      fibrillin-1, that the Weill-Marchesani three-domain deletion in fibrillin-1 abolishes that binding,
      that the same ADAMTSL-3 fragment binds the non-catalytic C-terminal region of ADAMTS-10 with a KD
      of 2 nM, and that it binds the C-terminal domains of LTBP-1. Two negative controls in the same panel
      show the binding is selective rather than sticky: ADAMTSL-1 does not bind fibrillin-1 or ADAMTS-10,
      and ADAMTSL-3 does not bind LTBP-4.


      Fibrillin-1 and LTBP-1 are both extracellular matrix components, so GO:0050840 states what was measured.
      The same term was chosen independently for the same biology in this repository''s ADAMTSL4 review,
      which keeps the two paralogues consistent.


      Deliberately not the child term GO:0050436 microfibril binding, which is defined as binding to a
      microfibril - a supramolecular assembly. What was assayed was binding to soluble recombinant fibrillin-1
      polypeptides, which is binding to a microfibril component, not to a microfibril; and the two other
      measured partners, LTBP-1 and ADAMTS-10, are not microfibrils at all, so the child term would cover
      only part of the evidence while asserting more than any of it. Whether ADAMTSL3 engages assembled
      microfibrils is precisely the untested question recorded against the elastic-fiber row.


      Coded ISS rather than IPI because the species of the ADAMTSL-3 reagent is not resolvable from the
      paper. The Results describe the panel as recombinant human ADAMTSL-1, -2 and -3, but the Methods
      say the ADAMTSL3 constructs were made from a RIKEN clone and mouse lung cDNA - and say the same,
      explicitly, for ADAMTSL2, which the Results sentence also calls human. Only ADAMTSL1 is unambiguously
      human in the Methods. A curator should upgrade this to IPI, with UniProtKB:P35555 (human FBN1) as
      the WITH/FROM interactor, if the authors confirm the construct was human; until then the conservative
      code is the honest one. Note the WITH/FROM here carries only UniProtKB:G3UXC7, the mouse orthologue:
      for ISS the field must hold the sequence-similar entity from which the inference is drawn, and the
      binding partner belongs there only under IPI.'
    action: NEW
    reason: ADAMTSL3 binds fibrillin-1 and LTBP-1, both extracellular matrix proteins, by surface plasmon
      resonance with mapped sites and selective negative controls, yet GOA records no molecular function
      for this gene other than bare protein binding to two-hybrid preys. ISS rather than IPI because the
      paper contradicts itself about whether the ADAMTSL-3 polypeptide was human or mouse.
    supported_by:
    - reference_id: PMID:22242013
      supporting_text: Similar to ADAMTSL-6 [24], ADAMTSL-2, -3, and papilin polypeptides interacted with
        the N-terminal half of fibrillin-1, while ADAMTSL-1 did not.
    - reference_id: PMID:22242013
      supporting_text: SPR also showed that the C-terminal end of ADAMTS-10 interacted with the C-terminal
        end of ADAMTSL-3 with high binding affinity (KD = 2 nM) (Figure 5c).
    - reference_id: PMID:22242013
      supporting_text: Binding between ADAMTSL-3 and the C-terminal domains of LTBP-1 was also detected,
        but neither ADAMTSL-2 nor -3 interacted with LTBP-4.
    - reference_id: PMID:22242013
      supporting_text: Constructs for ADAMTSL3 were made using a clone (RIKEN) and mouse lung cDNA.
- term:
    id: GO:0030512
    label: negative regulation of transforming growth factor beta receptor signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:36539599
  qualifier: involved_in
  review:
    summary: 'Proposed. Loss-of-function and gain-of-function agree in sign, and the gain-of-function
      half was done on human cells with the human protein.


      Adenoviral overexpression of full-length ADAMTSL3 in cultured human foetal cardiac fibroblasts reduced
      phospho-SMAD2 and active TGF-beta, and reduced the large latent complex components LAP and LTBP1
      in both cell and matrix lysates; a 84-gene TGF-beta pathway array showed TGFB1, TGFB2, SMAD3, SMAD4
      and TGFBR1 down and the inhibitory SMAD6 up. In the reciprocal direction, Adamtsl3-null mouse hearts
      show raised active TGF-beta and phospho-SMAD2 after aortic banding.


      Coded IMP because adenoviral overexpression is a perturbation, not an assay of the protein at native
      levels.


      The mechanism is consistent with the binding data: LTBP-1 and fibrillin-1 are the two proteins that
      hold the large latent TGF-beta complex in the matrix, and ADAMTSL3 binds both. What is not yet shown
      is whether the reduction in signalling follows from sequestering latent complex or from the transcriptional
      changes, so the term is proposed at the level of the pathway rather than as a specific molecular
      mechanism.


      The cardiac phenotypes themselves are deliberately not proposed as GO terms. They are mouse, and
      they are responses to experimental pressure overload rather than normal physiology; the reviewable
      claim is the regulation of the signalling pathway, which has human-cell support.'
    action: NEW
    reason: Human ADAMTSL3 overexpressed in human cardiac fibroblasts reduces phospho-SMAD2, active TGF-beta
      and large-latent-complex components, and Adamtsl3-null mouse hearts show the reciprocal increase
      after pressure overload. GOA carries no biological-process annotation for this gene beyond a family-level
      InterPro term, and this is the best-supported process claim in its literature.
    supported_by:
    - reference_id: PMID:36539599
      supporting_text: For further mechanistic insights, we overexpressed full-length ADAMTSL3 (L3) and
        a vehicle control adenovirus (veh) in cultures of human foetal CFBs (hfCFBs)
    - reference_id: PMID:36539599
      supporting_text: Immunoblotting revealed reduced pSMAD (Fig. 4h) and reduced active TGFβ (Fig. 4i),
        indicating reduced TGFβ signalling.
    - reference_id: PMID:36539599
      supporting_text: Taken together, the loss-of-function and gain-of-function studies suggest ADAMTSL3
        as an inhibitor of TGFβ signalling in the heart in vivo and in cardiac fibroblasts in vitro.
- term:
    id: GO:0050808
    label: synapse organization
  evidence_type: ISS
  original_reference_id: PMID:37572323
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:G3UXC7
  review:
    summary: 'Proposed, on mouse conditional knockouts, and coded ISS for that reason.


      Early post-natal neuronal deletion of Adamtsl3 in mouse reduces DCC protein and the density of both
      glutamatergic and GABAergic synapses; adult deletion in GABAergic or glutamatergic neurons leaves
      DCC-Netrin-1 function at glutamatergic synapses intact but controls DCC signalling at GABAergic
      synapses, and the Adamtsl3-DCC unit is required for activity-dependent adaptation there. A second
      mouse study finds Adamtsl3 is required cell-autonomously in parvalbumin interneurons for perineuronal
      net formation and maintenance, with adult deletion reactivating juvenile ocular-dominance plasticity.


      The orthology behind the inference is unusually good for a mouse-to-human transfer. The C. elegans
      orthologue Ce-Punctin/MADD-4 is itself a secreted synaptic organiser that specifies whether a postsynaptic
      domain is cholinergic or GABAergic, and it acts through UNC-40/DCC - the same receptor as in the
      mouse hippocampus. So the receptor and the synaptic role are conserved from nematode to mouse, which
      is a stronger basis than sequence similarity alone. Human ADAMTSL3 protein is present in cortical
      and ganglionic neurons.


      One caveat is recorded rather than glossed: MADD-4 is the orthologue of both ADAMTSL1 and ADAMTSL3,
      so the worm data are shared between the two human paralogues and cannot be assigned to ADAMTSL3
      alone. The mouse conditional knockouts can, and they are what the annotation rests on; the worm
      work is cited as evidence that the DCC-dependent synaptic role is ancestral, not as evidence about
      the human gene.


      Held as non-core, and deliberately not carried into core_functions: the direct evidence is entirely
      non-human and the molecular activity underlying the effect on DCC is unknown, which is recorded
      below as an MF_DARK knowledge gap. An earlier draft of this review listed the neuronal role among
      the core functions while this row called it non-core; the two passages rested on the same premise
      and reached opposite conclusions, so the core_functions entry has been removed and this row is the
      single statement of the position. The biology is not lost: it is described in the gene description,
      set out in full here, and its matrix component is carried by GO:0030198 in core function 1.'
    action: NEW
    reason: Mouse conditional knockouts show Adamtsl3 is required for hippocampal synapse density and
      for DCC signalling at GABAergic synapses, and a second mouse study shows a cell-autonomous requirement
      in parvalbumin interneurons for perineuronal nets. The DCC-dependent synaptic role is conserved
      to the C. elegans orthologue, and human ADAMTSL3 is expressed in cortical and ganglionic neurons.
      Coded ISS because no human experiment exists, and proposed as non-core for the same reason.
    additional_reference_ids:
    - PMID:42277231
    - PMID:24896188
    - PMID:22014523
    - PMID:17597111
    knowledge_gaps:
    - gap_statement: No molecular activity is known for ADAMTSL3 in the nervous system. How a secreted
        matrix glycoprotein raises DCC protein levels, and whether it does so by binding DCC, by binding
        something that presents DCC, or by altering the matrix in which DCC sits, is unestablished.
      boundary: The genetic requirement is firm - conditional deletion in mouse reduces DCC protein and
        synapse density, and the effect is cell-autonomous in parvalbumin interneurons in an independent
        study.
      gap_kind:
      - BIOLOGY
      dark_aspect: MF_DARK
      status: OPEN
      significance: Without a molecular activity the neural role cannot be given a molecular-function
        term, and it is the reason this row is proposed as a process annotation only.
      resolution: Test direct ADAMTSL3-DCC binding by SPR with purified ectodomains, and ask whether the
        fibrillin-1-binding C-terminal region is sufficient for the synaptic effect in a rescue experiment.
      provenance:
      - reference_id: file:human/ADAMTSL3/ADAMTSL3-deep-research-affinage.md
        supporting_text: The biochemical mechanism by which this non-catalytic ECM protein controls DCC
          receptor levels has not been characterized in the available corpus.
    supported_by:
    - reference_id: PMID:37572323
      supporting_text: We demonstrate that early post-natal deletion of Adamtsl3 in neurons impairs DCC
        protein expression, causing reduced density of both glutamatergic and GABAergic synapses.
      full_text_unavailable: true
    - reference_id: PMID:22014523
      supporting_text: MADD-4's activity is dependent on UNC-40/DCC, a netrin receptor, which functions
        cell-autonomously to direct membrane extension.
      full_text_unavailable: true
    - reference_id: PMID:17597111
      supporting_text: ADAMTSL3 is expressed in epithelial cells of the colon, fallopian tube, skin, breast,
        prostate, epididymis, liver, pancreatic islets and bile ducts, as well as by vascular endothelial
        cells, smooth muscle cells, fibroblasts, cortical and ganglionic neurons and cardiac myocytes.
      full_text_unavailable: true
    - reference_id: file:human/ADAMTSL3/ADAMTSL3-deep-research-affinage.md
      supporting_text: The biochemical mechanism by which this non-catalytic ECM protein controls DCC
        receptor levels has not been characterized in the available corpus.
- term:
    id: GO:0002020
    label: protease binding
  evidence_type: ISS
  original_reference_id: PMID:22242013
  qualifier: enables
  supporting_entities:
  - UniProtKB:G3UXC7
  review:
    summary: 'Proposed. The tightest measured interaction this protein has is with a protease, and no
      term currently records it.


      Surface plasmon resonance gives a KD of 2 nM between the C-terminal end of ADAMTSL-3 and the C-terminal
      end of ADAMTS-10, a secreted metalloproteinase mutated in recessive Weill-Marchesani syndrome. GO:0002020
      is defined as binding to a protease or a peptidase, so the term states exactly that. It is selective
      within the family in the same experiment: neither ADAMTSL-1 nor ADAMTSL-2 bound ADAMTS-10, which
      the authors read as ADAMTS enzymes partnering with specific ADAMTSL proteins.


      Worth being clear about what this does and does not claim. The region of ADAMTS-10 involved is its
      non-catalytic C-terminal Tsp1-repeat region, not the catalytic domain, so this is not evidence of
      protease inhibition, and no inhibitor term is proposed. Whether ADAMTSL3 modulates ADAMTS-10 activity
      or merely co-occupies fibrillin-1 with it is untested, and is one of the suggested experiments.


      Coded ISS for the same reason as the GO:0050840 row: the paper''s Results call the ADAMTSL-3 reagent
      human while its Methods describe a RIKEN clone and mouse lung cDNA. On an IPI upgrade the WITH/FROM
      interactor would be UniProtKB:Q9H324 (human ADAMTS10). This row is part of the same matricellular
      adaptor function as GO:0050840 rather than a separate one, which is why core function 1 describes
      the ADAMTS-10 binding but carries GO:0050840 as its single molecular_function term.


      Family precedent: this repository''s merged ADAMTSL4 review also carries GO:0002020, so the two
      paralogues stay consistent.'
    action: NEW
    reason: 'ADAMTSL3 binds the non-catalytic C-terminal region of the metalloproteinase ADAMTS10 with
      a KD of 2 nM by SPR, selectively within the family, and no GO term currently records the tightest
      measured interaction this protein has. ISS rather than IPI because the source paper contradicts
      itself about whether the ADAMTSL-3 polypeptide was human or mouse. No inhibitor term is proposed:
      the contact is with the Tsp1 region, not the catalytic domain.'
    supported_by:
    - reference_id: PMID:22242013
      supporting_text: SPR also showed that the C-terminal end of ADAMTS-10 interacted with the C-terminal
        end of ADAMTSL-3 with high binding affinity (KD = 2 nM) (Figure 5c).
    - reference_id: PMID:22242013
      supporting_text: However, neither ADAMTSL-2 nor -1 bound to ADAMTS-10, indicating that ADAMTS enzymes
        may partner only with specific ADAMTSL proteins.
    - reference_id: PMID:22242013
      supporting_text: The C-terminal recombinant ADAMTS-10 polypeptide used in the SPR studies represents
        the noncatalytic region of ADAMTS-10, a region composed primarily of Tsp1 repeats (Figure S3).
core_functions:
- description: Secreted matricellular adaptor of the fibrillin-1 microfibril network. The C-terminal region
    of ADAMTSL3 binds the N-terminal, assembly-competent half of fibrillin-1 at the site removed by the
    Weill-Marchesani three-domain deletion, binds the non-catalytic C-terminal region of ADAMTS10 with
    a KD of 2 nM, and binds the C-terminal domains of LTBP-1; the same panel shows it does not bind LTBP-4,
    and that ADAMTSL1 binds neither fibrillin-1 nor ADAMTS10, so the interactions are selective. Because
    fibrillin-1 and LTBP-1 are the proteins that tether the large latent TGF-beta complex to the matrix,
    this places ADAMTSL3 at the point where microfibril architecture and TGF-beta availability meet.
