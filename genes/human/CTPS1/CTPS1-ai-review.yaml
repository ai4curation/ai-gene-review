gene_symbol: CTPS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CTPS1 is a glutamine-dependent CTP synthase that couples ATP consumption to the amination
  of UTP, supplying CTP for nucleotide and membrane-lipid synthesis. Its homotetrameric enzyme can assemble
  into regulated cytoophidia in the cytoplasm and nucleus; substrate-associated human filaments enhance
  catalytic activity. Increased CTP supply is particularly important for proliferation of activated lymphocytes.
  CTPS1 also catalyzes protein asparagine deamidation: modification of histone H1 facilitates subsequent
  acetylation and chromatin relaxation during DNA repair, while IRF3 deamidation limits interferon induction.
  These catalytic roles are regulated by cellular context and phosphorylation.'
