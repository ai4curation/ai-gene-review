core_functions:
- description: CTPS1 couples glutamine hydrolysis to ATP-dependent amination of UTP, producing CTP for
    nucleotide synthesis. The performed UTP-to-CTP step is stated without assigning an upstream route
    of precursor production. Homotetramers form regulated filaments; substrate-associated human assemblies
    have enhanced activity, and phosphorylation tunes catalytic output. Cytosolic CTP production supports
    the increased nucleotide demand of activated lymphocytes.
  molecular_function:
    id: GO:0003883
    label: CTP synthase activity
  directly_involved_in:
  - id: GO:0006241
    label: CTP biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0097268
    label: cytoophidium
  supported_by:
  - reference_id: PMID:17189248
  - reference_id: PMID:17463002
  - reference_id: PMID:28459447
    supporting_text: polymerization increases catalytic activity.
  - reference_id: PMID:34583994
- description: CTPS1 deamidates protein asparagine residues in distinct regulatory contexts. At chromatin,
    histone H1 N76/N77 deamidation enables subsequent EP300 acetylation and chromatin relaxation for DNA
    repair. IRF3 N85 deamidation reduces promoter binding and interferon induction; human cellular perturbations
    and mouse genetic experiments support this second substrate context. CTPS1 performs the deamidation,
    while EP300 performs acetylation and IRF3 carries transcription-factor activity.
  molecular_function:
    id: GO:0160260
    label: protein asparagine deamidase activity
  directly_involved_in:
  - id: GO:0140861
    label: DNA repair-dependent chromatin remodeling
  - id: GO:0032480
    label: negative regulation of type I interferon production
  locations:
