core_functions:
- description: 'Obligate Ca2+-sensing regulatory subunit of calcineurin: binds the calcineurin A catalytic subunit
    and, upon Ca2+ binding to its EF hands, induces the conformational change in CnA required for activation, thereby
    contributing to the Ca2+/calmodulin-dependent serine/threonine phosphatase activity of the holoenzyme that dephosphorylates
    NFAT.'
  molecular_function:
    id: GO:0008597
    label: calcium-dependent protein serine/threonine phosphatase regulator activity
  contributes_to_molecular_function:
    id: GO:0033192
    label: calmodulin-dependent protein phosphatase activity
  directly_involved_in:
  - id: GO:0033173
    label: calcineurin-NFAT signaling cascade
  locations:
  - id: GO:0005829
    label: cytosol
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0005955
    label: calcineurin complex
  supported_by:
  - reference_id: PMID:11123943
    supporting_text: Ca(2+) binding to the low-affinity sites of calcineurin B affects the conformation of calcineurin
      B and induces a conformational change of the regulatory domain of calcineurin A
  - reference_id: PMID:11123943
    supporting_text: This conformational change is needed for the partial activation of the enzyme in the absence
      of calmodulin and its full activation by calmodulin
  - reference_id: PMID:26794871
    supporting_text: a heterodimer composed of a catalytic subunit A and an essential regulatory subunit B
  - reference_id: PMID:20639889
    supporting_text: CnB is the exclusive and obligate binding partner of the CnA catalytic subunit, and neither
      protein is appreciably stable without expression of the other
  - reference_id: PMID:8631904
    supporting_text: the activation state of NFAT1 in T cells is remarkably sensitive to the level of calcineurin
      activity
- description: Ca2+ binding by the four EF hands of CnB, which make it the Ca2+ sensor of calcineurin and stabilise
    the CnA-CnB interface that forms the LxVP substrate-docking pocket and the immunophilin-drug binding site.
  molecular_function:
    id: GO:0005509
    label: calcium ion binding
  in_complex:
    id: GO:0005955
    label: calcineurin complex
  supported_by:
  - reference_id: PMID:23468591
    supporting_text: CN is always composed of a catalytic A subunit (CNA), bound to a regulatory B subunit (CNB)
      that binds four Ca2+ ions
  - reference_id: PMID:23468591
    supporting_text: these drug-immunophilin complexes do not target the active site, but instead bind in a pocket
      ∼30 Å away at the interface of the CNA/CNB subunits
  - reference_id: PMID:12218175
    supporting_text: The CyPA-CsA complex binds to a composite surface formed by the catalytic and regulatory subunits
      of CN
suggested_questions:
- question: Should calcineurin B carry 'contributes_to calmodulin-dependent protein phosphatase activity' in GOA,
    given that CnA is inactive without CnB, rather than the current unqualified phosphatase activity rows inferred
    by ortholog projection and NAS?
- question: Does the LxVP-docking contribution of CnB residues (e.g. Val119, Leu123) warrant a distinct MF for substrate
    docking by the regulatory subunit, or is it adequately described by the holoenzyme activity?
- question: Do PPP3R1 and the testis-specific PPP3R2 differ in Ca2+ affinity or in which CnA isoforms they preferentially
    pair with in lymphocytes, and does this affect NFAT activation thresholds downstream of the TCR?
suggested_experiments:
- description: Measure NFAT nuclear translocation and IL2 induction after TCR stimulation in human T cells expressing
    CnB EF-hand mutants that selectively abolish the low-affinity Ca2+ sites, to quantify how CnB Ca2+ sensing sets
    the threshold of the calcineurin-NFAT response.
- description: Compare membrane-proximal calcineurin signaling (AKAP79-anchored NFAT activation) in cells expressing
    wild-type CnB versus a non-myristoylatable G2A mutant, to test the contribution of CnB myristoylation to membrane
    targeting and signaling output.
