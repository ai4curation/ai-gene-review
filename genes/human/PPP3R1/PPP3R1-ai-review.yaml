    summary: IEA (Ensembl ortholog projection from rat Cnb1) assigning phosphoprotein phosphatase activity to calcineurin
      B. PPP3R1 is an EF-hand Ca2+-binding regulatory subunit with no phosphatase domain; catalysis is performed
      by the calcineurin A subunit.
