id: P63098
gene_symbol: PPP3R1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PPP3R1 encodes calcineurin B type 1 (CnB1), the 19 kDa N-myristoylated EF-hand Ca2+-binding regulatory
  subunit of calcineurin (protein phosphatase 2B), the Ca2+/calmodulin-activated serine/threonine phosphatase. CnB
  binds constitutively to the CnB-binding helix of a calcineurin A catalytic subunit (PPP3CA, PPP3CB or PPP3CC)
  to form the obligate heterodimer; neither subunit is stable alone. CnB has no catalytic activity: its four EF
  hands bind Ca2+ (two high-affinity structural sites and two low-affinity regulatory sites), and Ca2+ occupancy
  of the low-affinity sites reorganises the CnA regulatory region, exposing the calmodulin-binding domain and allowing
  partial and then calmodulin-dependent full activation. CnB also forms part of the hydrophobic CnA/CnB groove that
  recognises LxVP docking motifs in substrates such as NFAT and is the binding site for the immunosuppressant complexes
  FKBP12-FK506 (tacrolimus) and cyclophilin A-cyclosporin A. Calcineurin is cytosolic, with pools tethered to the
  plasma membrane via CnB myristoylation and anchoring proteins such as AKAP79/150. Through dephosphorylation of
  NFAT transcription factors, calcineurin couples Ca2+ signals to gene expression in T cell activation downstream
  of the T cell receptor, in cardiac hypertrophy, and in neuronal and synaptic signaling. PPP3R1 is broadly expressed
  and highly abundant in brain.'
