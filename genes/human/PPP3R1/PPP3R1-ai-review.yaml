  review:
    summary: 'IPI: crystal structure of calcineurin (CnA-CnB) with cyclophilin A-cyclosporin A (WITH PPIA, PPP3CA).
      The immunophilin-drug complex binds a composite surface of CnA and CnB.'
    action: MODIFY
    reason: Generic protein binding is uninformative. The partner is a calcineurin A catalytic subunit, which CnB
      binds constitutively as its obligate regulatory subunit; the informative MF is phosphatase regulator activity
      (CnB Ca2+ occupancy drives the CnA conformational change required for activation). The cyclophilin contact
      is part of the drug-target interface rather than a physiological binding function of CnB, so no separate MF
      is proposed for it.
