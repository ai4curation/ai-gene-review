  review:
    summary: 'Core function: ER-directed degradation of cytosolic and micronuclear DNA keeps cGAS from
      being activated.'
    action: ACCEPT
    reason: 'The mechanism is resolved in the cited paper and TREX1 does the work itself - it removes
      the agonist. Both requirements are demonstrated: catalysis (the D18N mutant lets cGAMP accumulate)
      and ER tethering (the C-terminal truncation never reaches ruptured micronuclei), and the downstream
      readout is interferon-stimulated gene induction. This is the term that places TREX1 in the cGAS-STING
      module.'
    supported_by:
    - reference_id: PMID:33476576
      supporting_text: the endoplasmic reticulum (ER)-associated nuclease TREX1 inhibits cGAS activation
        at micronuclei by degrading micronuclear DNA upon micronuclear envelope rupture
    - reference_id: PMID:33476576
      supporting_text: indicating that TREX1 nucleolytic activity is necessary to inhibit cGAS activation
        in chromosomally unstable cells
