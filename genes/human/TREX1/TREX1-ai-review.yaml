- term:
    id: GO:0008250
    label: oligosaccharyltransferase complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: part_of
  supporting_entities:
  - UniProtKB:Q91XB0
  - ensembl:ENSMUSP00000107684
  review:
    summary: TREX1 binds the OST complex through its C-terminus and restrains its hydrolase activity,
      but is not a subunit of the 7-8 protein catalytic complex.
    action: MODIFY
    reason: 'The donor mouse IDA (PMID:26320659) shows co-immunoprecipitation with two OST subunits, DDOST
      and RPN1, and no detectable interaction with RPN2 or STT3A - a regulatory contact made by the TREX1
      C-terminal tail, not incorporation into the catalytic complex. part_of therefore over-states the
      evidence while the real, and functionally important, claim is binding: GO:0062062 oligosaccharyltransferase
      complex binding says exactly what was shown. This is the DNase-independent arm of TREX1 function
      and the proposed mechanism of RVCL, so the claim should be kept, with the right relation.'
    supported_by:
    - reference_id: PMID:26320659
      supporting_text: We found strong interactions between TREX1 and two subunits, DDOST and RPN1, but
        failed to detect interaction with two other subunits, RPN2 and STT3A
    - reference_id: PMID:26320659
      supporting_text: Notably, C-terminal truncation of TREX1 (TREX1_TM) drastically reduced the interaction
        with RPN1, consistent with OST interacting with TREX1 through its C-terminus
    additional_reference_ids:
