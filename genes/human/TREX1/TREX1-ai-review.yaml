- term:
    id: GO:0008296
    label: 3'-5'-DNA exonuclease activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1328317
  - PANTHER:PTN001772011
  - UniProtKB:Q9BQ50
  - UniProtKB:Q9NSU2
  review:
    summary: TREX1 is the major mammalian 3'-to-5' DNA exonuclease; this is its core molecular function,
      demonstrated with recombinant human protein and in cells.
    action: ACCEPT
    reason: The activity is established biochemically on purified recombinant protein (PMID:10391904),
      in a reconstituted repair reaction (PMID:10393201), and in cells where the catalytically dead D18N
      mutant fails to degrade micronuclear DNA (PMID:33476576). The six rows carrying this term (IBA,
      IDA x2, IEA, ISS, TAS) are independent evidence for one claim and reinforce each other. The IBA
      rests on PANTHER node PTN001772011, the TREX1/TREX2 ancestral node, whose WITH/FROM includes human
      TREX1 itself alongside mouse Trex1 and TREX2 (Q9BQ50) - the expected marker that experimental grounding
      exists on the target, with the IBA additionally asserting the activity is inherited rather than
      human-specific.
    supported_by:
    - reference_id: PMID:10391904
      supporting_text: Expression of TREX1 and TREX2 in Escherichia coli demonstrates that these recombinant
        proteins are active 3'-->5' exonucleases
    - reference_id: PMID:33476576
      supporting_text: indicating that TREX1 nucleolytic activity is necessary to inhibit cGAS activation
        in chromosomally unstable cells
