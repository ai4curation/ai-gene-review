    summary: Reflects the nucleotide used to trap the product complex, not a base-specific binding function.
    action: MARK_AS_OVER_ANNOTATED
    reason: The donor mouse IDA is the crystal structure solved with deoxyadenosine monophosphate occupying
      the 3'-terminal nucleotide pocket - the reaction product. TREX1 excises nucleoside 5'-monophosphates
      regardless of base, so an adenyl-specific binding term over-reads the crystallisation ligand. The
      active-site contacts it describes are already covered by the exonuclease activity terms.
    supported_by:
    - reference_id: PMID:17293595
      supporting_text: The structures show the specific interactions between the bound nucleotides and
        the residues lining the binding pocket of the 3' terminal nucleotide within the enzyme active
        site that account for specificity
