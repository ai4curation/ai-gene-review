    summary: 'Supported, but less specific than the cited experiment: 3''-mispair removal was shown in
      a reconstituted base-excision repair reaction.'
    action: MODIFY
    reason: The TAS row's own paper reconstitutes repair with DNA polymerase beta and DNA ligase III-XRCC1
      - the short-patch base-excision/single-strand-break machinery - and shows accurate rejoining depends
      on the exonuclease, which is a specific statement that the generic parent loses. GO:0006284 is an
      is_a descendant and the gene already carries it. The ARBA IEA row on the same term is an unvetted
      association rule, kept consistent with the TAS row rather than treated as independent support.
    supported_by:
    - reference_id: PMID:10393201
      supporting_text: In a reconstituted human DNA repair system containing DNA polymerase beta and DNA
        ligase III-XRCC1, accurate rejoining of a 3' mismatched base residue at a single-strand break
        is dependent on addition of the exonuclease
    proposed_replacement_terms:
    - id: GO:0006284
      label: base-excision repair
