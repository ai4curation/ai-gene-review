  review:
    summary: TREX1 is an obligate homodimer; dimerisation is required for its activity and underlies dominant-negative
      disease variants.
    action: ACCEPT
    reason: 'Both published TREX1 structures are dimers, the dimer is the species purified from bacteria,
      and all twelve human PDB entries contain two or more chains. Dimerisation is functionally load-bearing
      rather than incidental: it is why single heterozygous DNase-domain variants such as D18N and D200H
      act dominantly, by poisoning the wild-type protomer.'
    supported_by:
