  review:
    summary: Proofreading of 3' mispairs at single-strand breaks, reconstituted with the base-excision
      repair machinery.
    action: KEEP_AS_NON_CORE
    reason: 'The ComplexPortal NAS rests on the SET complex''s base-excision repair role, which is carried
      mainly by APEX1; the better support for TREX1 itself is the reconstituted Pol-beta/Lig-III-XRCC1
      reaction in which accurate rejoining of a 3'' mismatch requires the exonuclease. That makes TREX1
      a genuine participant - it performs the excision step - so the term is kept, but non-core: the activity
      has been shown in vitro and in a complex context, whereas the knockout phenotype in mouse and human
      disease is an interferonopathy, not a DNA-repair deficiency.'
