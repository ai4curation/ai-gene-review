proposed_new_terms:
- proposed_name: micronucleus
  proposed_definition: A membrane-bounded compartment of a eukaryotic cell that forms around one or a
    few mis-segregated chromosomes or chromosome fragments after mitosis, enclosed by an envelope that
    is prone to rupture, after which its DNA becomes accessible to the cytosol.
  justification: There is no GO cellular component for the aberrant micronucleus of animal cells. GO:0031040
    micronucleus is defined as the germline nucleus of ciliated protozoa and cannot be reused. The compartment
    is where TREX1 and CGAS meet - TREX1 is recruited to roughly 75% of ruptured micronuclei and degrades
    their DNA to prevent cGAS activation - so neither the location of this activity nor the equivalent
    localisations of CGAS, MB21D1-pathway components and ESCRT repair factors can currently be annotated.
    A sibling of GO:0031040 under GO:0043231 is the obvious placement; a separate term rather than a broadening
    of GO:0031040, whose ciliate definition is in use.
  proposed_parent:
    id: GO:0043231
    label: intracellular membrane-bounded organelle
  supported_by:
  - reference_id: PMID:33476576
    supporting_text: GFP-TREX1 localized to approximately 40% of MN within 24 h of mitotic exit
  - reference_id: PMID:33476576
    supporting_text: Micronuclei are aberrant nuclear compartments that can form as a result of chromosome
      mis-segregation
suggested_questions:
- question: Is TREX1 a peripheral or an integral single-pass membrane protein at the ER? UniProt records
    a peripheral association with no TRANSMEM feature, while the publication it cites for the location
    describes a single-pass C-terminal transmembrane helix.
  experts:
  - Maciejowski J
  - Yan N
  - Perrino FW
- question: Should the substrate relationship between TREX1 and cGAS-activating DNA be made machine-readable
    on the cGAS side as well? TREX1 carries GO:0160049 because it destroys the agonist; the corresponding
    has_input on CGAS activities in GO-CAM models would make the competition for the same DNA pool explicit.
  experts: []
- question: Does the SET complex warrant complex-level GO annotation rather than propagation of chromatin
    and base-excision-repair terms to each nuclease subunit? Three of the six members are nucleases with
    distinct activities, and the complex-level terms currently land on TREX1 as located_in chromatin.
  experts:
  - Lieberman J
suggested_experiments:
- hypothesis: In an unperturbed, chromosomally stable cell, retroelement-derived cDNA rather than micronuclear
    DNA is the dominant TREX1 substrate.
  description: Sequence the DNA that co-immunoprecipitates with catalytically dead, ER-tethered GFP-TREX1-D18N
    (a substrate trap) from untreated cells and from cells after Mps1 inhibition, and classify reads by
    origin (L1/LTR/SINE, replication-associated, chromosomal). Compare with cGAS-bound DNA from the same
    conditions to see which pool escapes TREX1 and reaches the sensor.
  experiment_type: substrate-trap sequencing
- hypothesis: The ER anchor of TREX1 is a single-pass transmembrane helix rather than a peripheral membrane
    association.
  description: Determine the topology of endogenous TREX1 by protease-protection on sealed microsomes
    with and without detergent, by alkaline and urea extraction to test peripheral versus integral behaviour,
    and by glycosylation-site insertion scanning across the C-terminal 79 residues to locate the luminal
    segment. Interpret alongside the AlphaFold model of the C-terminus.
  experiment_type: membrane topology mapping
- hypothesis: The TREX1 C-terminus restrains OST hydrolase activity by binding RPN1/DDOST at the lipid-linked
    oligosaccharide entry site.
  description: Reconstitute purified OST with the isolated TREX1 C-terminal peptide and measure transfer
    versus hydrolysis of lipid-linked oligosaccharide as a function of peptide concentration; map the
    contact by crosslinking mass spectrometry or cryo-EM of the OST-peptide complex, and test RVCL-associated
    frameshift peptides in the same assay.
  experiment_type: in vitro reconstitution and structural mapping
