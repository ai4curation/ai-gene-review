  review:
    summary: The cited paper assays ATR-ATRIP recruitment by MutSalpha/MutLalpha and does not concern
      TREX1; the row appears to belong to ATRIP, whose locus overlaps TREX1.
    action: REMOVE
    reason: PMID:16713580 is about mismatch-repair-dependent recruitment of ATR-ATRIP to O6-methylguanine/T
      mispairs. Three checks point away from TREX1 and towards ATRIP rather than at the curator's reading
      of a full text. (1) UniProt itself cautions that the TREX1 and ATRIP genes are identical or adjacent
      and that some ATRIP mRNAs also encode TREX1 in another reading frame, which is exactly the mechanism
      by which an ATRIP assertion lands on Q9NSU2. (2) A QuickGO query on 2026-11-03 for this term in
      human returns the paper twice, on ATR and on TREX1; ATR is correct, and human ATRIP (Q8WXE1) carries
      no annotation from this paper at all, which is implausible for a study whose central claim is about
      the ATR-ATRIP complex. (3) No literature places TREX1 in a MutSalpha or MutLalpha complex, and nothing
      in TREX1's biochemistry or structure suggests it. REMOVE rather than UNDECIDED because the defect
      is in the gene the row is attached to, which is checkable without the full text, not in the experiment.
    supported_by:
    - reference_id: PMID:16713580
      supporting_text: ATR-ATRIP, but not RPA, is preferentially recruited to O(6)-meG/T mismatches in
        a MutSalpha- and MutLalpha-dependent manner
