    supporting_text: In a reconstituted human DNA repair system containing DNA polymerase beta and DNA
      ligase III-XRCC1, accurate rejoining of a 3' mismatched base residue at a single-strand break is
      dependent on addition of the exonuclease
    reference_section_type: ABSTRACT
  - statement: The enzyme was originally purified from liver nuclei, which is why the oldest localisation
