- term:
    id: GO:0006260
    label: DNA replication
  evidence_type: NAS
  original_reference_id: PMID:10391904
  qualifier: involved_in
  review:
    summary: Taken from the cited paper's closing statement of intent, not from a result.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The only sentence in PMID:10391904 that mentions replication proposes it as future work.
      No study has placed TREX1 in DNA replication: the closest finding is that Trex1 acts on ssDNA arising
      from aberrant replication intermediates and thereby attenuates checkpoint signalling, which makes
      it a responder to replication by-products rather than a participant in replication itself. Not removed
      outright because TREX1 does act on replication-derived substrates; the claim is mis-levelled rather
      than baseless.'
    supported_by:
    - reference_id: PMID:10391904
      supporting_text: provides the genetic tools to investigate the physiological roles of these exonucleases
        in mammalian DNA replication, repair, and recombination pathways
    - reference_id: PMID:18045533
      supporting_text: Trex1 acts on a single-stranded DNA polynucleotide species generated from processing
        of aberrant replication intermediates to attenuate DNA damage checkpoint signaling
    additional_reference_ids:
    - PMID:18045533
