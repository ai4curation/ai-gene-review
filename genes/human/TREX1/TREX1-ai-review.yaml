  review:
    summary: Conflates 3'-mispair excision with the MutS/MutL mismatch repair pathway, which TREX1 is
      not part of.
    action: MARK_AS_OVER_ANNOTATED
    reason: The source is the same closing sentence of intent. TREX1 excises mispaired 3' termini at DNA
      ends, which is end proofreading, whereas GO:0006298 denotes the MutSalpha/MutLalpha-initiated correction
      of mispairs within duplex DNA. No study assigns TREX1 a role in that pathway, and the two GOA rows
      that seemed to - the MutSalpha and MutLalpha complex binding rows from PMID:16713580 - are reviewed
      here as belonging to ATRIP. Marked over-annotated rather than removed since substrate-level mispair
      removal is real.
