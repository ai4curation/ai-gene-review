id: Q9NSU2
gene_symbol: TREX1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'TREX1 (three-prime repair exonuclease 1, DNase III) is the major 3''-to-5'' DNA exonuclease
  of mammalian cells: a two-Mg(2+) DEDDh-family enzyme that excises nucleoside 5''-monophosphates from
  DNA 3'' ends, acting on single-stranded DNA and on duplex DNA with mispaired or recessed 3'' termini,
  and having no activity on RNA. It works as an obligate homodimer tail-anchored in the endoplasmic reticulum
  membrane by its C-terminal segment, which leaves the nuclease domain facing the cytosol. Its principal
  role is to destroy cytosolic DNA before the sensor CGAS can detect it: in the absence of TREX1, single-stranded
  DNA from endogenous retroelements accumulates, and DNA exposed when a micronuclear envelope ruptures
  is left intact, in both cases activating cGAS-STING signalling and type I interferon. The ER tether
  is part of the mechanism rather than incidental, directing the enzyme onto ruptured micronuclei. Oxidative
  damage to DNA makes it a poor TREX1 substrate, which couples ultraviolet exposure to interferon signalling
  in skin. A regulated nuclear pool enters the S-phase nucleus after replication stress and degrades single-stranded
  DNA arising from aberrant replication intermediates, attenuating ATM-dependent checkpoint signalling,
  and TREX1 is a subunit of the ER-associated SET complex, where it resects the 3'' ends of nicks made
  by NME1 during granzyme-A-mediated killing. Independently of catalysis, the C-terminal region binds
  the ER oligosaccharyltransferase complex through DDOST and RPN1 and restrains hydrolysis of lipid-linked
  oligosaccharides. The two functional modules map onto distinct human diseases: loss of nuclease activity
  causes Aicardi-Goutieres syndrome 1, familial chilblain lupus and systemic lupus erythematosus susceptibility,
  whereas C-terminal frameshifts that leave the enzyme active but untethered cause retinal vasculopathy
  with cerebral leukoencephalopathy.'
