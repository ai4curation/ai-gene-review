- id: PMID:16818237
  title: The exonuclease TREX1 is in the SET complex and acts in concert with NM23-H1 to degrade DNA during
    granzyme A-mediated cell death.
  findings:
  - statement: TREX1, but not TREX2, is a component of the ER-associated SET complex and binds SET directly.
    supporting_text: We now find the 3'-to-5' exonuclease TREX1, but not its close homolog TREX2, in the
      SET complex
    reference_section_type: ABSTRACT
  - statement: During granzyme-A-mediated death TREX1 resects the 3' ends of NME1-generated nicks to prevent
      religation, and silencing it blocks death by granzyme A but not granzyme B.
    supporting_text: After granzyme A activates NM23-H1 to make single-stranded nicks, TREX1 removes nucleotides
      from the nicked 3' end to reduce the possibility of repair by rejoining the nicked ends
    reference_section_type: ABSTRACT
