- id: PMID:10391904
  title: Identification and expression of the TREX1 and TREX2 cDNA sequences encoding mammalian 3'-->5'
    exonucleases.
  findings:
  - statement: Recombinant TREX1 is an active 3'-to-5' exonuclease whose highest activity is on a partial
      duplex with five mispaired nucleotides at the 3' terminus.
    supporting_text: The greatest activity of the TREX1 protein was detected using a partial duplex DNA
      containing five mispaired nucleotides at the 3' terminus
    reference_section_type: ABSTRACT
  - statement: TREX1 is DNA-specific; no activity was detected on RNA or RNA-DNA hybrid substrates.
    supporting_text: No activity was detected using single-stranded RNA or an RNA-DNA partial duplex
    reference_section_type: ABSTRACT
  - statement: The paper's only mention of replication, repair and recombination is a proposal for future
      work, which is the source of three NAS annotations reviewed here as over-annotations.
