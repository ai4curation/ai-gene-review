- term:
    id: GO:0005634
    label: nucleus
  evidence_type: EXP
  original_reference_id: PMID:10393201
  qualifier: located_in
  review:
    summary: 'A real but stimulus-dependent nuclear pool: TREX1 relocates to the nucleus after replication
      stress and during granzyme-A death.'
    action: KEEP_AS_NON_CORE
    reason: The claim is sound and the term is as precise as the evidence allows. The enzyme was originally
      purified from liver nuclei, and nuclear entry is regulated rather than constitutive - it follows
      gamma-irradiation or hydroxyurea, and accompanies SET-complex translocation during granzyme-A death.
      Non-core because the steady-state pool and the function that defines TREX1, clearing cytosolic DNA
      to keep cGAS off, are at the ER membrane and in the cytosol.
    supported_by:
    - reference_id: PMID:10393201
      supporting_text: We isolated a widely distributed DNA-specific 3' exonuclease from rabbit liver
        nuclei
    - reference_id: PMID:18045533
      supporting_text: Trex1, ordinarily associated with the endoplasmic reticulum (ER), relocalizes to
        the S phase nucleus after gamma irradiation or hydroxyurea treatment
    additional_reference_ids:
    - PMID:18045533
