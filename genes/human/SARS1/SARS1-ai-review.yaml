  original_reference_id: PMID:22353712
  qualifier: located_in
  review:
    summary: Confocal immunofluorescence and fractionation show endogenous nuclear SerRS in HUVEC and
      HEK293T cells.
    action: ACCEPT
    reason: A minor (~10%) fraction of endogenous SARS1 is nuclear in HUVEC and HEK293T cells, directed
      by the bipartite NLS in the vertebrate-specific UNE-S domain (PMID:22353712); in the nucleus it
      binds the VEGFA promoter and represses transcription (PMID:24940000). The nucleus is therefore where
      its second, non-translational function acts.
