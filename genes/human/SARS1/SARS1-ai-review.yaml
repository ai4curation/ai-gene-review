suggested_questions:
- question: What fraction of cellular tRNA(Sec) serylation capacity is limiting for selenoprotein synthesis
    in neurons of SARS1 patients, and do NEDMAS variants reduce selenoprotein levels?
- question: Does nuclear SARS1 regulate genes other than VEGFA (genome-wide ChIP), and is the nuclear
    pool regulated physiologically (e.g. by phosphorylation or hypoxia)?
- question: Should the METTL6 substrate-selection role be captured as enzyme activator activity rather
    than molecular adaptor activity, given the ~1,000-fold stimulation independent of aminoacylation substrates?
suggested_experiments:
- description: Measure Ser-tRNA(Sec) levels and selenoprotein (e.g. GPX4, TXNRD1) synthesis by 75Se labelling
    in patient fibroblasts or iPSC-derived neurons carrying NEDMAS SARS1 variants.
- description: Genome-wide ChIP-seq of endogenous SARS1 in endothelial cells, comparing wild-type with
    an NLS-deleted knock-in, to define the nuclear target repertoire.
