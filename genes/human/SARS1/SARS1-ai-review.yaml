id: P49591
gene_symbol: SARS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SARS1 encodes the cytoplasmic seryl-tRNA synthetase (SerRS), a homodimeric class II aminoacyl-tRNA
  synthetase of the type-1 seryl-tRNA synthetase subfamily. In the cytosol it activates L-serine with
  ATP to seryl-adenylate and transfers it to tRNA(Ser), supplying Ser-tRNA(Ser) for cytoplasmic protein
  synthesis; its N-terminal coiled-coil tRNA-binding domain recognises the long variable arm characteristic
  of tRNA(Ser) and tRNA(Sec), and the tRNA binds across the dimer. SARS1 also serylates tRNA(Sec), forming
  Ser-tRNA(Sec), the first intermediate of selenocysteine biosynthesis that PSTK and SEPSECS then convert
  to Sec-tRNA(Sec) for selenoprotein synthesis. Vertebrate SerRS carries an appended C-terminal UNE-S
  domain with a bipartite nuclear localization signal that sends a minor fraction of the protein to the
  nucleus, where it binds the proximal VEGFA promoter, competes with c-Myc/MAX and recruits the SIRT2
  deacetylase to remove H4K16 acetylation, repressing VEGFA transcription and restraining angiogenesis;
  this activity is independent of aminoacylation and is required for normal vascular development in zebrafish.
  SerRS also acts as a tRNA(Ser) substrate-selection and activation factor for the m3C32 tRNA methyltransferase
  METTL6. Biallelic loss-of-function variants cause a neurodevelopmental disorder with microcephaly, ataxia
  and seizures, and a dominant-negative in-frame insertion causes complex spastic paraplegia.
