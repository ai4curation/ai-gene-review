  review:
    summary: Nuclear SerRS binds a specific 21-27 bp sequence in the proximal VEGFA promoter (ChIP, DNase
      I footprint, EMSA, SPR), overlapping the c-Myc/MAX site but with distinct sequence specificity.
    action: ACCEPT
    reason: Direct, sequence-specific binding of purified human SerRS to the VEGFA (RNA polymerase II)
      promoter is well documented in PMID:24940000 by footprinting, EMSA (Kd ~211 nM) and mutational mapping,
      and endogenous SerRS occupancy is shown by ChIP. This vertebrate-specific nuclear activity depends
      on the UNE-S domain and is a defined second function of the protein.
