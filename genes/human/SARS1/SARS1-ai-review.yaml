- term:
    id: GO:0001514
    label: selenocysteine incorporation
  evidence_type: IMP
  original_reference_id: PMID:34570399
  qualifier: involved_in
  review:
    summary: UniProt IMP for selenocysteine incorporation from the R213L case report (abstract-only in
      cache).
    action: KEEP_AS_NON_CORE
    reason: 'SARS1 performs real work in the selenocysteine pathway: it serylates tRNA(Sec), the step
      the GO definition of GO:0001514 places before incorporation (''Selenocysteine is synthesized from
      serine before its incorporation''). Recoding of UGA itself is carried out by EEFSEC and SECISBP2.
      The cited abstract does not show the selenoprotein data the curator relied on, so the experimental
      row is not overruled; it is kept as non-core because the SARS1 contribution is upstream charging
      rather than decoding.'
    supported_by:
    - reference_id: Reactome:R-HSA-2408526
      supporting_text: The synthetic cycle of selenocysteine (Sec) synthesis starts with misacylation
        (serylation) of the cognate transfer RNA (tRNA) for Sec, tRNASec, with serine (Ser) by Serine--tRNA
        ligase (SARS) homodimer.
    - reference_id: PMID:26433229
      supporting_text: Here we present two cocrystal structures of human SerRS bound with tRNA(Sec)
