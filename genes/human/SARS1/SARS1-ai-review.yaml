  review:
    summary: Automated assignment of selenocysteine-tRNA ligase activity (ARBA plus Ensembl transfer from
      mouse Sars).
    action: ACCEPT
    reason: GO:0098619 is defined as tRNASec + L-Ser + ATP = Ser-tRNASec + AMP + diphosphate, which is
      exactly the serylation of tRNA(Sec) by SerRS that initiates selenocysteine biosynthesis on its tRNA.
      Human SerRS-tRNA(Sec) cocrystal structures and serylation assays (PMID:26433229) and Reactome R-HSA-2408526
      support it. In eukaryotes there is no separate tRNA(Sec)-charging enzyme, so this is a genuine,
      physiologically required activity of SARS1, secondary in flux to tRNA(Ser) charging but not promiscuous
      noise.
