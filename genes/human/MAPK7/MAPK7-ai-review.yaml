suggested_questions:
- question: Should the kinase-independent transcriptional activation by the ERK5 C-terminal tail be captured as transcription
    coactivator activity (GO:0003713) on MAPK7, and would a GO-CAM model need two separate ERK5 activities (MAP kinase activity
    and coactivator activity) feeding MEF2?
- question: Which physiological ERK5 functions (e.g. endothelial survival, vascular integrity) depend on catalytic activity
    versus the C-terminal TAD, given that selective kinase inhibitors fail to phenocopy genetic loss?
- question: Is the reported ERK5-Nrf2 (NFE2L2) interaction direct, and is Nrf2 an ERK5 substrate, or does ERK5 act on Nrf2
    indirectly (e.g. via KLF2 or KEAP1)?
suggested_experiments:
- description: Endothelial-specific knock-in of kinase-dead versus TAD-deleted Mapk7 alleles in mice to separate catalytic
    and transcriptional functions in vascular integrity.
- description: Quantitative phosphoproteomics in human endothelial cells after acute analog-sensitive ERK5 inhibition to define
    direct substrates under laminar flow.
