id: Q13164
gene_symbol: MAPK7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MAPK7 encodes ERK5 (big MAP kinase 1, BMK1), an 816-residue atypical member of the MAP kinase family. Its N-terminal
  half is a conventional proline-directed Ser/Thr kinase domain with a TEY activation motif that is dually phosphorylated
  by the dedicated MAP2K MEK5 (MAP2K5), itself activated by MEKK2/MEKK3; ERK5 does not interact with MEK1/2. A unique ~400-residue
  C-terminal tail carries a nuclear localization signal, a MEF2-interacting region and a transcriptional activation domain.
  In resting cells ERK5 is held in the cytoplasm as a client of the HSP90-CDC37 chaperone; activation and C-terminal autophosphorylation
  release Hsp90 and drive nuclear import, where ERK5 phosphorylates and coactivates MEF2 transcription factors (MEF2A/C/D)
  and other substrates such as SGK1 and PML. ERK5 is activated by growth factors (EGF), oxidative and osmotic stress and,
  notably, laminar shear stress in endothelium, where it drives MEF2-dependent KLF2/KLF4 and NRF2 programs that promote endothelial
  quiescence and survival. Loss of ERK5 in mice causes embryonic lethality from cardiovascular defects, and adult endothelial
  loss causes vascular leakage and endothelial apoptosis.
