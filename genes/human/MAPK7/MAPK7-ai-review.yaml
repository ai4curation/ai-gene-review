core_functions:
- description: 'Terminal MAP kinase of the MEKK2/3-MEK5-ERK5 cascade: once dually phosphorylated on its TEY motif by MEK5,
    ERK5 phosphorylates Ser/Thr-Pro sites in cytoplasmic and nuclear substrates, notably MEF2 transcription factors (MEF2C
    Ser387), SGK1 and PML.'
