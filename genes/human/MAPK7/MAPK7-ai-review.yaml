  - *id009
- description: 'Kinase-independent transcriptional coactivator: the C-terminal tail binds MEF2 and contains a transcriptional
    activation domain that coactivates MEF2-dependent transcription (e.g. KLF2/KLF4 in endothelium) once ERK5 enters the nucleus.'
