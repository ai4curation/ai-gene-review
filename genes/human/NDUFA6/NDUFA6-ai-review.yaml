    supporting_text: "function is the transport of electrons from NADH to ubiquinone, which is"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The paper reports cDNA sequences for the eight remaining uncharacterized nuclear-encoded
