    summary: >-
      ATP synthesis is carried out by Complex V, not Complex I. Complex I contributes
      upstream by generating the proton-motive force, and NDUFA6 contributes only as a
      structural subunit of Complex I. This term is well removed from NDUFA6's direct
      function and represents a system-level over-attribution rather than the gene's
      specific role.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The entity that performs proton-motive-force-driven ATP synthesis is Complex V.
      Complex I contributes only upstream, by pumping protons, and NDUFA6 contributes to
