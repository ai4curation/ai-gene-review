- id: PMID:12611891
  title: The subunit composition of the human NADH dehydrogenase obtained by rapid
    one-step immunopurification.
  findings:
  - statement: >-
      Immunocapture of human Complex I followed by 1D/2D gel electrophoresis, MALDI-TOF
      peptide mass fingerprinting and nanoflow LC-MS/MS resolved 42 polypeptides, matching
      the subunit inventory of the better-characterized bovine complex; NDUFA6 is among
      them.
    supporting_text: "homologues of 42 polypeptides detected so far in the more extensively studied"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The concordance between human and bovine Complex I isolated by different procedures
      gives confidence that the identified polypeptides really are constituents of the
      complex rather than co-purifying contaminants.
    supporting_text: "The concordance of data from human and bovine complex I isolated by different"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Immunopurified human Complex I resolved and identified 42 subunits by MS, including
      NDUFA6; direct support for Complex I membership. Abstract-only in cache but the
      subunit-composition claim is stated in the abstract.
- id: PMID:17209039
  title: Identification of mitochondrial complex I assembly intermediates by tracing
    tagged NDUFS3 demonstrates the entry point of mitochondrial subunits.
  findings:
  - statement: >-
      An inducible NDUFS3-GFP system in HEK293 cells resolved six distinct
      NDUFS3-GFP-containing subcomplexes on blue-native blots, also seen in wild-type
      mitochondria, giving direct evidence that Complex I assembles stepwise.
    supporting_text: "NDUFS3-GFP-containing subcomplexes gradually appeared on a blue native Western"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Differential solubilization and heat incubation distinguished genuine assembly
      intermediates from breakdown products, so the composition analysis that places NDUFA6
      in the complex is reporting assembly rather than instability.
    supporting_text: "demonstrated by differential solubilization and heat incubation, which"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Traces Complex I assembly intermediates via tagged NDUFS3; supports NDUFA6 membership
      and inner-membrane localization. Abstract-only in cache.
- id: PMID:27626371
  title: Accessory subunits are integral for assembly and function of human mitochondrial
    complex I.
  findings:
  - statement: >-
      Human complex I comprises 45 subunits, of which only 14 core subunits are shared with
      bacteria and essential for enzymatic function; the role of the remaining 31 accessory
      subunits, NDUFA6 among them, was previously unclear.
    supporting_text: "mitochondrial respiratory chain and is composed of 45 subunits in humans, making"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Knockout cell lines were generated by gene editing for every accessory subunit and
      profiled by quantitative proteomics; 25 accessory subunits proved strictly required for
      assembly of a functional complex.
    supporting_text: "Here we use gene editing to generate human knockout"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Loss of any given subunit destabilized the other subunits of the same structural
      module - the observation that assigns each accessory subunit, including NDUFA6, to a
      module of the complex.
    supporting_text: "of each subunit affects the stability of other subunits residing in the same"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Systematic knockout/complexome study of Complex I accessory subunits; basis of the
      UniProt FUNCTION statement that accessory subunits are integral for assembly and
      function. Abstract-only in cache.
