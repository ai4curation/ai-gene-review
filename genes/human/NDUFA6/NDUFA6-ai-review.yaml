    label: mitochondrial respiratory chain complex I assembly
  evidence_type: IMP
  original_reference_id: PMID:30245030
  qualifier: involved_in
  review:
    summary: >-
      Strong experimental (IMP) evidence: bi-allelic NDUFA6 variants in patients cause an
      isolated Complex I assembly defect, with reduced fully assembled Complex I and
      concomitant loss of other Q-module subunits, rescued by re-expression. This is a
      core biological-process annotation for NDUFA6.
    action: ACCEPT
    reason: >-
      This is the strongest evidence in the record and the one that distinguishes NDUFA6 from
      a merely co-purifying subunit: four unrelated children with bi-allelic NDUFA6 variants,
      complexome profiling showing reduced incorporated NDUFA6 together with loss of the
      other Q-module subunits NDUFAB1, NDUFA7 and NDUFA12, and normalization of Complex I on
      lentiviral re-expression. NDUFA6 does part of the work of assembly - it holds the
      Q-module together - rather than merely being required for it.
