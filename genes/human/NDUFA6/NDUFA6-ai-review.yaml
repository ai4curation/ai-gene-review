suggested_questions:
- question: >-
    Does the LYR motif of human NDUFA6 bind the acylated mitochondrial acyl carrier protein
    NDUFAB1 as it does in Yarrowia lipolytica, and if so is that interaction the mechanism
    by which NDUFA6 stabilizes the Q-module - or a separate, regulatory acyl-chain-sensing
    input to Complex I?
  experts:
  - Alston CL
  - Taylor RW
- question: >-
    Loss of NDUFA6 reduces NDUFAB1, NDUFA7 and NDUFA12 in parallel. Is NDUFA6 required for
    those subunits to be incorporated in the first place, or does it stabilize an already
    assembled Q-module against turnover?
  experts:
  - Alston CL
- question: >-
    In NDUFA6-deficient fibroblasts an ~830 kDa P+Q-module intermediate remains associated
    with assembled Complex III and IV despite lacking the N-module. Does this partial
    supercomplex have any residual activity, and does it imply that supercomplex assembly is
    independent of Complex I completion?
  experts:
  - Alston CL
  - Taylor RW
- question: >-
    Two of the GO:0008137 'enables' annotations on NDUFA6 trace to a cDNA-characterization
    paper and an in situ hybridisation gene-mapping paper, neither of which assayed any
    enzymatic activity. Should the GO consortium replace such name-derived MF annotations on
    non-catalytic accessory subunits with `contributes_to` qualifiers, or with a structural
    molecule activity term?
  experts: []
suggested_experiments:
- hypothesis: >-
    NDUFA6 stabilizes the Q-module by tethering NDUFAB1 through its LYR motif, so that LYR
    motif mutants fail to rescue Complex I assembly in NDUFA6-null cells even though the rest
    of the protein folds normally.
  description: >-
    Re-express wild-type NDUFA6 and LYR-motif point mutants in NDUFA6-null or patient
    fibroblasts and assay incorporation into Complex I by blue-native PAGE and complexome
    profiling, tracking NDUFAB1, NDUFA7 and NDUFA12 levels alongside Complex I activity. A
    mutant that is imported and stable but fails to recruit NDUFAB1 would separate the
    tethering function from mere presence.
  experiment_type: Structure-guided complementation with complexome profiling
- hypothesis: >-
    The residual P+Q-module intermediate seen in NDUFA6-deficient cells is catalytically
    inactive for NADH:ubiquinone oxidoreduction but still contributes to supercomplex
    architecture.
  description: >-
    Isolate the ~830 kDa intermediate and the Complex III/IV-associated supercomplex from
    patient fibroblasts by blue-native PAGE and measure in-gel NADH dehydrogenase activity,
    NADH:decylubiquinone oxidoreductase activity and cytochrome c reduction, comparing with
    wild-type supercomplexes.
  experiment_type: In-gel and segmental respiratory-chain enzymology
- hypothesis: >-
    NDUFA6 is a structural constituent of the mature holoenzyme rather than a transient
    assembly factor, so it should be present at unit stoichiometry in the fully assembled
    complex and absent from the pool of factors that dissociate on maturation.
  description: >-
    Determine absolute stoichiometry of NDUFA6 relative to core subunits in purified mature
    Complex I by targeted quantitative proteomics with isotope-labelled standards, and
    compare with the assembly factors (NDUFAF2-7, TIMMDC1) that Reactome models as
    dissociating at the final step.
  experiment_type: Absolute quantitative proteomics of purified Complex I
