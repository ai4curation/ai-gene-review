- term:
    id: GO:0006120
    label: mitochondrial electron transport, NADH to ubiquinone
  evidence_type: NAS
  original_reference_id: PMID:9878551
  qualifier: involved_in
  review:
    summary: >-
      This is the process performed by Complex I, of which NDUFA6 is a structural subunit
      required for assembly and activity. NDUFA6 does not itself catalyze electron transfer,
      but as a Q-module structural subunit it is genuinely required for the complex to carry
      out this process, so it is retained as a core process annotation for the gene.
    action: ACCEPT
    reason: >-
      NDUFA6 does not catalyse any step of electron transfer - the flavin and Fe-S chain
      belong to the NDUFV/NDUFS core subunits. It nevertheless does part of the work of the
      process in the sense GO requires: it is a structural constituent of the Q-module that
      houses the ubiquinone-reduction site, and its loss collapses that module and abolishes
      assembled Complex I. Retained as a core process on that basis, with the catalytic
      activity itself represented as contributes_to rather than enables.
    supported_by:
    - reference_id: PMID:9878551
      supporting_text: "function is the transport of electrons from NADH to ubiquinone, which is"
      reference_section_type: ABSTRACT
