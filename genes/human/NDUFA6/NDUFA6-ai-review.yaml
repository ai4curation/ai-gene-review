- id: Reactome:R-HSA-6799191
  title: Intermediate 2 binds MT-ND1:NDUFAF5:NDUFAF6 to form a 315kDa subcomplex
  findings:
  - statement: >-
      The 315 kDa intermediate is centred on the core iron-sulfur subunits NDUFS2 and NDUFS3,
