- description: >-
    Structural (non-catalytic) subunit of the peripheral (matrix) arm of mitochondrial
    respiratory Complex I, forming part of the Q-module near the ubiquinone-reduction site;
    as a stable constituent of the assembled holoenzyme it contributes to the complex-level
    NADH:ubiquinone oxidoreductase activity but does not itself catalyze electron transfer.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  contributes_to_molecular_function:
    id: GO:0008137
    label: NADH dehydrogenase (ubiquinone) activity
  directly_involved_in:
