      I subunits were placed.
    supporting_text: "chain megacomplex-I2III2IV2 (MCI2III2IV2) with 140 subunits and a subset of"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The structure gives a precise individual assignment of the subunits of human Complex I,
      the basis for the ComplexPortal IDA/IPI annotations placing NDUFA6 in Complex I in the
      inner membrane.
    supporting_text: "The structure not only reveals the precise assignment of individual subunits of"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cryo-EM of the human respiratory megacomplex assigns individual Complex I subunits;
      supports NDUFA6 membership (IPI/IDA) and inner-membrane localization. Abstract-only
      in cache.
- id: PMID:30030361
  title: Assembly of mammalian oxidative phosphorylation complexes I-V and supercomplexes.
  findings:
  - statement: >-
      In the OXPHOS complexes the catalytic work is done by a set of core proteins, while the
      numerous supernumerary subunits - the class NDUFA6 belongs to - serve assembly,
      regulation and stability roles.
    supporting_text: "supernumerary' subunits that play essential roles in assembly, regulation"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      Complexes I, III and IV associate into respiratory supercomplexes or respirasomes, the
      higher-order context in which Complex I subunits such as NDUFA6 operate.
    supporting_text: "established that complexes I, III and IV interact with each other, forming the"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Review of OXPHOS complex assembly; source of the system-level aerobic respiration /
      PMF-driven ATP synthesis NAS annotations, which are broader than NDUFA6's specific
      role.
- id: PMID:30245030
  title: Bi-allelic Mutations in NDUFA6 Establish Its Role in Early-Onset Isolated
    Mitochondrial Complex I Deficiency.
  findings:
  - statement: >-
      Next-generation sequencing of four unrelated children with suspected mitochondrial
      disease identified bi-allelic variants in NDUFA6, which encodes a 15 kDa
      LYR-motif-containing Complex I subunit forming part of the Q-module.
    supporting_text: "identified bi-allelic variants in NDUFA6, encoding a 15 kDa LYR-motif-containing"
    reference_section_type: ABSTRACT
  - statement: >-
      Complexome profiling of subjects' fibroblasts showed a marked reduction of incorporated
      NDUFA6 together with a concomitant reduction of the other Q-module subunits NDUFAB1,
      NDUFA7 and NDUFA12 - the structural evidence that NDUFA6 holds the Q-module together.
    supporting_text: "concomitant reduction in other Q-module subunits, including NDUFAB1, NDUFA7, and"
    reference_section_type: ABSTRACT
  - statement: >-
      Lentiviral transduction of the subjects' fibroblasts normalized Complex I,
      establishing that the assembly defect is attributable to loss of NDUFA6 rather than to
      linkage or genetic background.
    supporting_text: "Lentiviral transduction of subjects' fibroblasts showed normalization"
    reference_section_type: ABSTRACT
  - statement: >-
      The residual ~830 kDa Complex I intermediate (P- and Q-modules, lacking the N-module)
      was found in complex with assembled Complex III and IV holoenzymes, supporting
      supercomplex formation independent of a complete Complex I.
    supporting_text: "complex with assembled complex III and IV holoenzymes despite lacking the"
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full-text available. Establishes NDUFA6 as required for Complex I assembly (isolated
      CI deficiency, MC1DN33): patient fibroblasts show reduced assembled Complex I with
      loss of Q-module subunits, rescued by re-expression. Directly supports the IMP
      assembly annotation and the accessory structural-subunit characterization.
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics
    in cellular context.
  findings:
  - statement: >-
      More than 8,000 proteins were classified in mitochondrial preparations of human cells
      to define MitoCoP, a high-confidence mitochondrial proteome of over 1,100 proteins;
      NDUFA6's membership supports its mitochondrial localization.
    supporting_text: "mitochondrial high-confidence proteome of >1,100 proteins (MitoCoP)"
    reference_section_type: ABSTRACT
  - statement: >-
      The dataset is quantitative and spans six orders of magnitude of abundance, but it is
      an organelle-level inventory that does not resolve submitochondrial compartment, so it
      cannot support the inner-membrane term.
    supporting_text: "The abundance of MitoCoP proteins covers six orders of"
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      High-throughput mitochondrial proteome; supports mitochondrial localization (HTP).
- id: PMID:9345899
  title: In situ hybridisation mapping of genomic clones for five human respiratory
    chain complex I genes.
  findings:
  - statement: >-
      Human cosmid and P1 libraries were screened with short cDNA probes to isolate genomic
      clones for five Complex I subunit genes, including cI-B14 (NDUFA6).
    supporting_text: "and P1 libraries for components of the complex I multi-subunit enzyme of"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      The study's result is a set of chromosomal assignments obtained by in situ
      hybridisation - NDUFA6 to 21q22 - and nothing more; no enzymatic activity of any of the
      five proteins was assayed, so it cannot support an `enables` claim for GO:0008137.
    supporting_text: "situ hybridisation studies we determined the following chromosome locations:"
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: >-
      This is a chromosomal gene-mapping (in situ hybridisation) study; it maps NDUFA6 to
      21q22 but does not demonstrate any catalytic (NADH dehydrogenase) activity of NDUFA6.
      Cited as TAS for GO:0008137 (enables), which it does not support; used here to justify
      MARK_AS_OVER_ANNOTATED of that MF.
