- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IDA
  original_reference_id: PMID:10938276
  qualifier: enables
  review:
    summary: Marked DNA binding as unsupported by the modern Roquin-2 model.
    action: MARK_AS_OVER_ANNOTATED
    reason: The 2000 MNAB paper described a nucleic-acid-binding activity as DNA binding, but later structural and biochemical work resolved the conserved Roquin architecture as an RNA-binding ROQ domain plus RING and CCCH-type zinc fingers. The older DNA-binding claim is therefore kept as a likely overbroad nucleic-acid-binding result rather than treated as the core RC3H2 activity.
    supported_by:
    - &id007
      reference_id: PMID:10938276
      supporting_text: Characterization of the MNAB protein as a cell-surface DNA-binding protein, critical in binding and internalization of extracellular DNA, awaits confirmation of its localization to cell surfaces.
    - &id004
      reference_id: PMID:25026078
      supporting_text: Mutagenesis studies confirm that the ROQ domain has two separate RNA-binding sites, one for stem-loop RNA (A site) and the other for double-stranded RNA (B site).
