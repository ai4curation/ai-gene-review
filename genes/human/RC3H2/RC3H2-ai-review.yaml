id: Q9HBD1
gene_symbol: RC3H2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Roquin-2 is a vertebrate Roquin paralog with the same conserved RING, ROQ and CCCH-type zinc-finger architecture as Roquin-1. It binds stem-loop constitutive decay elements in target mRNAs, recruits CCR4-NOT to promote transcript deadenylation and decay, localizes in the cytoplasm and stress granules, and can act as a RING-type ubiquitin protein ligase on protein substrates such as ASK1.
