suggested_questions:
- question: Which endogenous protein substrates, if any, are selected by Roquin-1 versus Roquin-2 RING activity in the same cells where their ROQ domains drive mRNA decay?
- question: How do Roquin-1 and Roquin-2 split immune-regulatory target mRNAs between CCR4-NOT-mediated deadenylation, decapping, and Regnase-1-coupled endonucleolytic decay?
suggested_experiments:
- description: Perform matched RC3H2 rescue with RING-dead, ROQ RNA-binding-site and C-terminal CCR4-NOT-recruitment mutants in RC3H2/paralog double-knockout human lymphoid cells, then separately measure target mRNA half-lives, CCR4-NOT recruitment and protein substrate ubiquitination.
