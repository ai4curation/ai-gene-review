id: Q8IXJ9
gene_symbol: ASXL1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASXL1 is a nuclear chromatin regulator containing HARE-HTH, DEUBAD and PHD regions.
  As a noncatalytic component of the BAP1-containing PR-DUB complex, it activates BAP1 and helps
  position nucleosomal DNA and monoubiquitinated histone H2A for deubiquitination. ASXL1 also participates
  in transcriptional coactivation and context-dependent nuclear-receptor regulation. These chromatin
  functions influence developmental gene expression and cellular identity. Pathogenic variants cause
  Bohring-Opitz syndrome, and somatic alterations occur in myeloid neoplasia.
