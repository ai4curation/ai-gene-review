  review:
    summary: The measured serotonin transport is vesicular/reconstituted-membrane loading, not established
      uptake into a cell.
    action: MODIFY
    reason: The live GO definition of serotonin uptake explicitly specifies directed movement into a cell.
      Full PMID25355561 measures serotonin transport by a human VAChT-YbeL fusion in proteoliposomes,
      not uptake into an intact neuron or glial cell. Preserve the demonstrated chemistry using GO:0015837
      amine transport, whose definition includes movement within a cell. The more specific grouping terms
      serotonin transport GO:0006837 and monoamine transport GO:0015844 are obsolete; the reason retains
      the actual serotonin substrate and the unresolved native relevance.
    supported_by:
    - reference_id: PMID:25355561
      supporting_text: All three transporters tested took up serotonin to a similar extent, indicating
        that serotonin is a mutual transport substrate in the SLC18 family.
    - reference_id: PMID:25355561
      supporting_text: The cDNAs of rat VMAT2 and human VAChT were described previously
    proposed_replacement_terms:
    - id: GO:0015837
      label: amine transport
