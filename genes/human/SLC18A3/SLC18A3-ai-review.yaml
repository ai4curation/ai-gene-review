id: Q16572
gene_symbol: SLC18A3
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC18A3 encodes the vesicular acetylcholine transporter (VAChT), a proton-coupled antiporter
  that accumulates acetylcholine inside cholinergic synaptic vesicles using the gradient generated by
  vesicular V-ATPase. Its cytoplasmic sorting signals govern retrieval and delivery to secretory vesicles.
  Vesicular filling determines the acetylcholine available for quantal release and supports neuromuscular
  and central cholinergic transmission. Purified human VAChT also transports serotonin in reconstituted
  liposomes, but a native serotonergic role has not been established by that assay.
