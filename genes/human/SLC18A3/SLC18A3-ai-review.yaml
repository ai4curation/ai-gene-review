  review:
    summary: VAChT passes through the plasma membrane during synaptic-vesicle recycling.
    action: ACCEPT
    reason: The curated Reactome endocytic intermediates locate VAChT in the cell surface before retrieval.
      This is compatible with its principal synaptic-vesicle destination and cytoplasmic adaptor-binding
      motifs; plasma-membrane residence need not be the site of sustained physiological acetylcholine
