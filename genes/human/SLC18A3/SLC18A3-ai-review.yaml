          The primary VAChT study demonstrates cytoplasmic-tail binding and coimmunoprecipitation with
          adaptins during cargo sorting. That physical association does not make this multipass transporter
          one of the defined adaptor subunits. The inherited rat-source assertion therefore overextends
          cargo interaction into adaptor-complex membership; genuine binding and trafficking are retained.
