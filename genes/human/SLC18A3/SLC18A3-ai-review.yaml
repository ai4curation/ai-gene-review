- term:
    id: GO:0006836
    label: neurotransmitter transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027067
  review:
    summary: VAChT moves acetylcholine and assayed serotonin across vesicular or reconstituted membranes.
    action: MODIFY
    reason: Refine the general transport process to acetylcholine transport and amine transport. The former
      covers native vesicular acetylcholine loading, while the latter preserves directly measured serotonin
      transport by the human VAChT-YbeL fusion in proteoliposomes. Live GO uptake definitions require
      movement into a cell, which these vesicle/liposome assays do not establish. GO:0015870 and GO:0015837
      allow movement within a cell; serotonin transport GO:0006837 and monoamine transport GO:0015844
      are obsolete. The amine replacement is supported specifically by serotonin here, not by all amines,
      and does not assert native serotonergic vesicle loading.
    supported_by:
    - reference_id: PMID:8910293
    - reference_id: PMID:25355561
      supporting_text: All three transporters tested took up serotonin to a similar extent, indicating
        that serotonin is a mutual transport substrate in the SLC18 family.
    proposed_replacement_terms:
    - id: GO:0015870
      label: acetylcholine transport
    - id: GO:0015837
      label: amine transport
