- term:
    id: GO:0022857
    label: transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR011701
  - InterPro:IPR020846
  review:
    summary: VAChT has substrate-specific proton-coupled transporter activities.
    action: MODIFY
    reason: The original term is a molecular function, not a membrane compartment. Refine the broad transport
      activity to the already-supported acetylcholine:proton antiporter activity and retain the independently
      assayed monoamine:proton antiporter breadth. Human VAChT expressed in PC12 cells supports proton-gradient-dependent
      acetylcholine loading; purified human VAChT fusion protein also takes up serotonin in reconstituted
      liposomes. The latter is a non-core biochemical capacity, not evidence that VAChT normally loads
      serotonergic synaptic vesicles. Neither location nor a fixed proton stoichiometry is inferred from
      this refinement.
    proposed_replacement_terms:
    - id: GO:0005278
      label: acetylcholine:proton antiporter activity
    - id: GO:0015311
      label: monoamine:proton antiporter activity
    supported_by:
    - reference_id: PMID:8910293
    - reference_id: PMID:25355561
      supporting_text: All three transporters tested took up serotonin to a similar extent, indicating
        that serotonin is a mutual transport substrate in the SLC18 family.
- term:
    id: GO:0030121
    label: AP-1 adaptor complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN000607168
  - RGD:62072
  review:
    summary: VAChT is adaptor-bound cargo rather than a subunit of the AP heterotetramer.
    action: REMOVE
    reason: 'Current GO definitions describe the four-subunit AP-1 or AP-2 membrane-coat adaptor complex.
      The primary VAChT study demonstrates cytoplasmic-tail binding and coimmunoprecipitation with adaptins
      during cargo sorting. That physical association does not make this multipass transporter one of
      the defined adaptor subunits. The inherited rat-source assertion therefore overextends cargo interaction
      into adaptor-complex membership; genuine binding and trafficking are retained. Original ancestral
      source: PANTHER:PTN000607168.'
    supported_by:
    - reference_id: PMID:14724281
      supporting_text: 'The cytoplasmic tail of VAChT has been shown to contain signals that

        direct its sorting and trafficking.'
    - reference_id: PMID:14724281
      supporting_text: 'In vivo

        coimmunoprecipitation confirmed adaptin alpha and adaptin gamma complexes'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN000607168
        source_status: UNRESOLVED
