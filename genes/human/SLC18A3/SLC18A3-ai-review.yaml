  qualifier: enables
  review:
    summary: VAChT is specifically an acetylcholine:proton antiporter.
    action: MODIFY
    reason: The human transporter drives vesicular acetylcholine uptake using the proton electrochemical
      gradient. Human PC12 expression experiments show protonophore and V-ATPase inhibitor sensitivity,
      and independent reconstitution supports the proton-coupled transport mechanism. Refine the general
      transporter activity to the existing antiporter term.
    supported_by:
    - reference_id: PMID:8910293
      supporting_text: 'Vesicular

        [3H]ACh accumulation increased approximately 20 times over levels attained by

        the endogenous rat VAChT'
    - reference_id: PMID:20225888
    - reference_id: PMID:25355561
      supporting_text: vesamicol specifically inhibited VAChT-mediated acetylcholine transport
    proposed_replacement_terms:
