suggested_questions:
- question: What are the expression, stability, localization and biochemical activities of the natural
    P28715-2 and P28715-3 products, and which functions of full-length XPG do they retain?
- question: Which constructs and controls in PMID:16246722 and PMID:8652557 establish the precise XPG
    contacts with RNA polymerase II, CSB, p62 and p44, beyond assembly of multiple proteins at a repair
    site?
- question: Which exact ERCC5–BRAF records in the supplementary data for PMID:35512704 support the imported
    interaction, and do they distinguish wild-type from mutation-dependent association?
- question: What damaged substrate and binding readout support the GO:0003684 assertion from PMID:32821917,
    beyond binding to the synthetic splayed-arm substrate used in the inspected structural experiments?
- question: What molecular association or localization was measured for XPG and the RPA complex in PMID:7700386,
    and how does it relate to XPG recruitment into the larger NER assembly?
- question: Under which cellular conditions does XPG-dependent stimulation of NTHL1 contribute measurably
    to base-excision repair, and can its effects on substrate binding, glycosylase chemistry and AP-lyase
    processing be separated?
core_functions:
- description: Full-length XPG recognizes single-strand/double-strand DNA junctions and catalyzes the
    3′ incision of the damaged strand during nucleotide-excision repair, acting in repair assemblies in
    the nucleoplasm in both global-genome and transcription-coupled pathways. Its DNA endonuclease activity
    also cleaves covalently closed single-stranded DNA in purified-protein assays. The repair-complex
    context does not imply a permanently preassembled complex or constitutive TFIIH membership. These
    activities are established for the canonical 1,186-residue protein; the functions of the natural 419-
    and 232-residue products remain unresolved.
