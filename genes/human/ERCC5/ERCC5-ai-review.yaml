id: P28715
gene_symbol: ERCC5
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ERCC5 encodes XPG, a nuclear structure-specific DNA endonuclease that recognizes single-strand/double-strand
  DNA junctions and makes the 3′ incision during nucleotide-excision repair. The full-length 1,186-residue
  protein acts with TFIIH and other repair factors in both global-genome and transcription-coupled repair.
  XPG also contributes non-catalytically to homologous-recombination repair through association with BRCA1
  and the BRCA2–PALB2–RAD51 machinery and regulation of repair-protein recruitment. In biochemical systems
  it stimulates NTHL1 substrate binding and glycosylase/AP-lyase activity without itself performing glycosylase
  chemistry. XPG accumulates at nuclear repair sites and supports genome stability and cellular resistance
  to ultraviolet damage. Two reported shorter splice products contain 419 and 232 residues; their physiological
  functions and relationship to the activities of full-length XPG remain unresolved.
