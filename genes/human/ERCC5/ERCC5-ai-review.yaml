  review:
    summary: The structural substrate does not by itself resolve the damaged-DNA binding assertion.
    action: UNDECIDED
    reason: The actual PMID:32821917 Methods and Results use synthetic splayed-arm DNA with an engineered
      XPG catalytic core; the resolved structure chiefly shows duplex contacts. GO:0003684 means binding
      to damaged DNA and does not require preferential affinity over undamaged DNA. Nevertheless, this
      experiment does not directly identify the annotated damaged substrate. Retain uncertainty about
      this source-specific claim without denying XPG incision in NER. The supplement and figure pixels
