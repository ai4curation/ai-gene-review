      not defined as yeast-only. The actual donor original PMID:8855246, Methods/Results pp.10718–10721
      and Figures 2–3, purifies a stable yeast Rad2–TFIIH complex and reconstitutes UV-DNA incision/excision
      with other NER factors. Human corroboration is provided by PMID:31253769, Results “NER factors stimulate
      the TFIIH helicase XPD” and “XPG in lesion scanning,” and the protein-purification/crosslinking
      Methods: recombinant full-length human XPG assembles with core TFIIH and XPA on DNA and crosslinks
      to TFIIH subunits. XPG was absent from the final cryo-EM density, so it is the biochemical assembly/crosslinking
      evidence, not direct visualization in that density, that supports human conservation. This does
      not make XPG a constitutive transcriptional TFIIH subunit or confer helicase activity on XPG itself.
      PMID:11259578 Figure 6 further recovers functionally active human XPG with TFIIH after washing at
      150 mM KCl, but not 300 mM KCl. This supports a recoverable repair subassembly with condition-dependent
      stability; the absence of a permanent all-factor repairosome does not contradict that smaller NEF3-class
      association.'
