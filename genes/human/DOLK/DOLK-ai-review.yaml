    supporting_text: Dolichol kinase (DK) catalyzes the CTP-dependent phosphorylation of dolichol in the
      biosynthesis de novo and possibly the recycling of dolichyl monophosphate
  - reference_id: PMID:12213788
    supporting_text: "overexpression of hDK1p in Sf-9 cells resulted in a 15-fold increase in DK activity but not DAG kinase activity in crude microsomal fractions."
  - reference_id: PMID:17273964
  - reference_id: PMID:22242004
