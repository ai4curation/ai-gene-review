      publication cache. DOLK_1 rescues restrictive-temperature yeast growth and binds KCNA3; DOLK_2 fails
      that rescue and has different partners. Unavailable clone sequences prevent mapping these labels
      to additional official products. The imported KCNA3 record specifies residues 53–575.
