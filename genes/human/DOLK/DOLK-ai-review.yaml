gene_symbol: DOLK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: "DOLK is a polytopic endoplasmic reticulum membrane enzyme of the polyprenol kinase family (EC 2.7.1.108). It uses CTP to phosphorylate dolichol, producing dolichyl monophosphate (Dol-P) in the terminal step of de novo carrier synthesis. Dol-P supplies downstream N-glycosylation and, after conversion to Dol-P-mannose, O- and C-mannosylation and GPI-anchor biosynthesis. DOLK supplies the lipid carrier rather than transferring the glycosyl groups itself. Its nucleotide-binding region faces the cytoplasm. DOLK-CDG (formerly CDG-Im) compromises glycosylation and causes variable multisystem disease, including dilated cardiomyopathy associated with deficient alpha-dystroglycan O-mannosylation."
