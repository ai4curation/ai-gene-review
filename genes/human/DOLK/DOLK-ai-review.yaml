core_functions:
- description: DOLK phosphorylates dolichol using CTP to produce dolichyl monophosphate at the endoplasmic
    reticulum membrane. This reaction completes de novo synthesis of the lipid carrier needed by several
    glycosylation pathways. The human protein has a cytoplasm-facing nucleotide-binding region; glycosyl-chain
    assembly is performed by downstream enzymes.
  molecular_function:
    id: GO:0004168
    label: dolichol kinase activity
  directly_involved_in:
