    summary: The historical additional LLO-process proposal is withdrawn pending direct scope justification.
    action: NEW
    reason: 'This is an inherited authored proposal, not a current GOA assertion. DOLK directly supplies
      Dol-P, whereas the current GO:0006488 definition describes glycosyl-chain assembly on that carrier.
      CPY rescue and reduced LLO abundance establish downstream dependence without locating DOLK in a
      glycosyl-addition step. Comparator annotations are mixed: SRD5A3 carries this term, while DHDDS,
      DOLPP1 and yeast SEC59 do not; no universal exclusion is claimed. The target GO-CAM models the established
      kinase/Dol-P process. The conservative active review retains that performed step and withdraws this
      unestablished expansion without deleting its historical identity.'
