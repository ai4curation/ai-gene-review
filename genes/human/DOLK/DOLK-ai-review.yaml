gene_symbol: DOLK
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DOLK is a polytopic endoplasmic reticulum membrane kinase that uses CTP to phosphorylate
  dolichol, producing dolichyl monophosphate (Dol-P). This reaction completes de novo synthesis of a lipid
  carrier used in protein glycosylation. Its nucleotide-binding region faces the cytoplasm. Human DOLK
  deficiency reduces kinase activity and compromises glycosylation, with variable multisystem disease
  that can include dilated cardiomyopathy associated with deficient alpha-dystroglycan O-mannosylation.
