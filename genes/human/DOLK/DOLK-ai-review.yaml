suggested_questions:
- question: Does DOLK make a measurable contribution to Dol-P recycling as well as de novo synthesis in
    different human tissues?
- question: What molecular species accounts for the supported nucleolar immunofluorescence, and is it
    related to the ER-resident kinase?
- question: Which sequences were present in the historical DOLK_1 and DOLK_2 clones, and which sequence
    differences explain their distinct yeast rescue and partner profiles?
suggested_experiments:
- description: Use endogenous tagging and DOLK depletion controls with orthogonal fractionation to distinguish
    ER-resident protein from the antibody-detected nuclear pool.
- description: Recover and sequence the historical DOLK splice constructs, then compare Dol-P formation,
    ER localization, yeast rescue and interaction profiles under matched expression conditions.
