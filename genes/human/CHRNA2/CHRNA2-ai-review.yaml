id: Q15822
gene_symbol: CHRNA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Human alpha2 forms functional heteromeric receptors with beta2 or beta4. Expression ratios
  produce distinct sensitivity populations; the isolated alpha2 extracellular-domain homopentamer is not
  evidence for a native alpha2-only channel. These pentameric membrane proteins couple extracellular acetylcholine
  recognition to cation flux and neuronal excitability. Alpha2-containing receptors occur in restricted
  neuronal populations and influence inhibitory circuits by exciting interneurons.
