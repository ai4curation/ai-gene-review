  review:
    action: ACCEPT
    summary: Retain the PAINT-supported calcium-transport contribution of a cation-permeable neuronal
      receptor.
    reason: Calcium permeability depends on subunit combination; human alpha5 and alpha6 complex measurements
      provide specific examples, not an assertion that this isolated subunit is a calcium-selective channel.
      For alpha2, the target current assay establishes receptor function while the conserved permeability
      inference is retained without inventing an alpha2-specific calcium-flux experiment.
    supported_by:
    - reference_id: PMID:24467848
    - reference_id: PMID:18723036
