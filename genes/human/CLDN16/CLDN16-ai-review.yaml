suggested_questions:
- question: How do native human TAL junction composition and CLDN16–CLDN19 stoichiometry determine magnesium,
    calcium and sodium selectivity across physiological states?
- question: Which original measurements underlie the intracellular cation-homeostasis assertion attributed
    to PMID:10390358, as distinct from renal or transepithelial ion handling?
- question: How do weak CLDN16 cis self-association, partner-dependent trans contacts and the older negative
    homomeric two-hybrid result relate at endogenous expression levels?
- question: What molecular changes distinguish the older CLDN14–CLDN16 association assays from the newer
    CLDN14-for-CLDN16 strand-replacement mechanism in intact human junctions?
suggested_experiments:
- description: Reconstitute sequence-verified human CLDN16 and CLDN19 in a junctional background depleted
    of endogenous competing claudins, measuring Mg2+, Ca2+, Na+ and Cl- permeability together with strand
    architecture and protein abundance.
- description: Compare matched CLDN16 terminal-motif and interaction-interface variants in polarized human
    renal cells, separating trafficking defects from changes in junctional ion selectivity.
- description: Use endogenous-level spatial interaction measurements to distinguish cis self-association
    from trans pairing and test how CLDN14 changes partner occupancy and paracellular conductance.
