id: Q9Y5I7
gene_symbol: CLDN16
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CLDN16 encodes claudin-16, a four-pass membrane protein that contributes to cation-selective
  paracellular channels at renal epithelial tight junctions. It cooperates with claudin-19 in junctional
  complexes that support magnesium and calcium reabsorption in the thick ascending limb. Its C-terminal
  PDZ-binding motif engages ZO-1 and supports junctional targeting. Junctional composition and cellular
  background influence the measured ion selectivity, and claudin-14 can reshape claudin-16/19-containing
  junctions. Pathogenic variants can impair targeting, partner interactions or permeability, causing familial
  hypomagnesemia with hypercalciuria and nephrocalcinosis.
