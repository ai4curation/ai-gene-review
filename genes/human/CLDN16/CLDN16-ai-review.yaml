    summary: Retain the family adhesion inference with explicit partner and calcium-assay limits.
    action: KEEP_AS_NON_CORE
    reason: 'The preserved mouse Cldn1 donor has experimentally grounded calcium-independent adhesion
      evidence (PMID:10508613). Target experiments distinguish autonomous adhesion from cooperative junction
