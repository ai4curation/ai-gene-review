core_functions:
- description: Phosphorylates the RNA-polymerase-II CTD as the catalytic subunit of a cyclin K complex,
    supporting nuclear transcriptional output and the elongation-associated program. Human biochemical
    assays establish Ser2/Ser5 activity; preference for a pre-phosphorylated Ser7 substrate is not Ser7
    catalysis.
  molecular_function:
    id: GO:0008353
    label: RNA polymerase II CTD heptapeptide repeat kinase activity
  in_complex:
    id: GO:0002945
    label: cyclin K-CDK13 complex
  directly_involved_in:
  - id: GO:0032968
    label: positive regulation of transcription elongation by RNA polymerase II
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:20952539
  - reference_id: PMID:22012619
  - reference_id: PMID:26748711
- description: Phosphorylates RNA-processing proteins in the nucleus. In a cyclin-associated context,
    CDK13 influences splice-site selection; independently, CDK13/cyclin T1 directly phosphorylates ZC3H14
    Ser475 to promote recruitment of nuclear RNA-surveillance machinery. These are protein-kinase functions,
    not intrinsic RNA-cleavage activities.
  molecular_function:
    id: GO:0106310
    label: protein serine kinase activity
  directly_involved_in:
  - id: GO:0000380
