id: Q14004
gene_symbol: CDK13
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDK13 is a nuclear cyclin-dependent protein kinase that couples RNA-polymerase-II transcription
  with RNA processing. In association with cyclin K, it phosphorylates serines in the polymerase C-terminal
  repeat domain and supports transcriptional output. Its N-terminal arginine/serine-rich region directs
  enrichment in nuclear speckles, and CDK13 influences alternative splice-site selection. A distinct substrate,
  ZC3H14, is phosphorylated at Ser475 by a cyclin-associated CDK13 complex to promote recruitment of nuclear
  RNA-surveillance machinery. Heterozygous kinase-domain variants cause a developmental syndrome that
  can include congenital heart defects, distinctive facial features and intellectual disability.
