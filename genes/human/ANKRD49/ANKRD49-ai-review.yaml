    summary: Transcription coactivator activity (NEW, IDA). ANKRD49 has a potent N-terminal acidic transactivation
      domain, and it physically binds the DNA-binding transcription factor PKNOX1, raising expression
      of the PKNOX1 target TGF-B1.
    action: NEW
    reason: '[PMID:11162141 "The second pair coded for a protein containing an acidic domain in the N-terminus
      and three consecutive CDC10/SW16/ankyrin repeats in the C-terminus."] [PMID:11162141 "Transactivation
      assays in the yeast hybrid system and transient transfection assays in COS cells showed that a potent
      trans-activating domain resides in the N-terminus of this protein."] [PMID:41821002 "Mechanistically,
      ANKRD49 physically interacts with PKNOX1, and PKNOX1 binds to the TGF-β1 promoter, elevating TGF-β1
      expression and subsequently activating SMAD signaling."] In ANKRD49-overexpressing cells, [PMID:41821002
      "ChIP-qPCR analysis showed specific enrichment of the − 1455 to − 1441 region in Flag-PKNOX1 pulldowns
      from ANKRD49-OE cells compared with controls"], [PMID:41821002 "confirming that PKNOX1 directly
      binds this site and that ANKRD49 strengthens the interaction"] An acidic activation domain, binding
      to a DNA-binding factor, and increased occupancy of that factor at its target fit the coactivator
      signature, and ANKRD49 has no DNA-binding domain. Limits: overexpression also raises PKNOX1 itself,
      as [PMID:41821002 "both mRNA and protein levels of PKNOX1 were significantly elevated in ANKRD49-OE
      A549 or H1299 cells"], so the higher occupancy and TGF-B1 output could reflect more PKNOX1 rather
      than coactivation. The reporter assays did not test whether ANKRD49 enhances PKNOX1-driven transcription,
      and ANKRD49 occupancy at the promoter was not measured. The annotation rests jointly on the 2001
      activation-domain assays and the PKNOX1 binding.'
