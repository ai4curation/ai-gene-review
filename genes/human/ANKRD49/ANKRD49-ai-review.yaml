suggested_questions:
- question: Does ANKRD49's HuRI partner SMARCD1 (BAF60a, a SWI/SNF subunit) mediate its activation function
    at target promoters?
- question: Does FIH hydroxylate the ankyrin repeats of ANKRD49, and does that affect its coactivator
    activity?
- question: What is the significance of the reproducible ANKRD49-FKBPL interaction?
suggested_experiments:
- description: With PKNOX1 expressed from a constant promoter, test whether ANKRD49 (wild type or lacking
    its acidic domain) enhances PKNOX1-driven TGF-B1 reporter activity, and measure ANKRD49 occupancy
    at the TGF-B1 promoter by ChIP.
