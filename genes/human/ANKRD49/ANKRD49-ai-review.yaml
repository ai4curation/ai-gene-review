id: Q8WVL7
gene_symbol: ANKRD49
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD49 (ankyrin repeat domain-containing 49; fetal globin-inducing factor, FGIF) is a nuclear
  protein with an N-terminal acidic transactivation domain and C-terminal ankyrin repeats. It was identified
  as a fetal-expressed activator of gamma-globin expression, and it binds the transcription factor PKNOX1
  and raises expression of the PKNOX1 target TGF-B1, though whether by coactivation or by raising PKNOX1
  levels is not resolved. It has been reported to bind RAN, consistent with an importin-independent nuclear
  entry route used by ankyrin-repeat proteins, and to interact with the ankyrin-repeat hydroxylase FIH.
  It is highly expressed in testis, where it is nuclear in germ cells and promotes starvation-induced
  autophagy via NF-kB, and it promotes invasion and epithelial-mesenchymal transition in lung cancer cells.
