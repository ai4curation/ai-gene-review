- term:
    id: GO:0001508
    label: action potential
  evidence_type: IDA
  original_reference_id: PMID:11299204
  qualifier: involved_in
  review:
    summary: Action potential. The abstract reports voltage-clamp currents only; whether the full text
      contains action-potential data could not be checked.
    action: UNDECIDED
    reason: 'PMID:11299204 shows a real experimental result - [PMID:11299204 "coexpression of the neuronal
      A kinase anchoring protein (AKAP)79, a fragment of a cardiac AKAP (mAKAP), or cardiac AKAP15/18
      restored cAMP regulation of KvLQT1/IsK complexes"] - but read its framing: the three AKAPs are interchangeable,
      the effect is attributed to PKA anchoring in general [PMID:11299204 "We concluded that cAMP regulation
      of I(Ks) requires protein kinase A anchoring by AKAPs"], and it is heterologous and modest [PMID:11299204
      "However, in cells expressing an AKAP, the effects of cAMP stimulation on the I(Ks) amplitude remained
      modest compared with those previously reported in cardiac myocytes."]. So AKAP15/18 can confer cAMP
      regulation on the IKs channel when supplied, which is a property of being an AKAP, not evidence
      that AKAP7 is the anchor for IKs in myocytes. The curator read the full text and the result stands;
      it is kept, but marked non-core. This row needs more than the others. The abstract describes IKs
      currents in heterologous expression systems under voltage clamp and never mentions action potentials.
      The full text may contain action-potential recordings or modelling that justify the curator''s IDA,
      but it could not be accessed (the publisher returns 403 and there is no PMC copy). Per the action
      definition, an annotation that cannot be checked against its publication is UNDECIDED rather than
      removed - the curator saw what I could not.'
    supported_by:
    - reference_id: PMID:11299204
      supporting_text: coexpression of the neuronal A kinase anchoring protein (AKAP)79, a fragment of
        a cardiac AKAP (mAKAP), or cardiac AKAP15/18 restored cAMP regulation of KvLQT1/IsK complexes
