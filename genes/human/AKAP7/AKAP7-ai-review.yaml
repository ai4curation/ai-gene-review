- id: file:genes/human/AKAP7/AKAP7-deep-research-affinage.md
  title: Affinage mechanistic annotation for AKAP7 (human)
  findings:
  - statement: The affinage narrative attributes the 2H phosphoesterase activity to the long isoforms,
      which are not in this entry.
    supporting_text: Beyond scaffolding, the central 2H phosphoesterase domain of long isoforms binds
      AMP and functions as a 2',5'-phosphodiesterase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Trust gates passed. Unusually strong recall here: it surfaced the CaV1.1 leucine-zipper
      paper, the knockout negative and the mossy-fiber work, none cited by GOA. One trap it does not flag:
      much of its narrative - the 2H phosphoesterase activity, RNase L antiviral function, and USP4/SERCA2
      in the heart - belongs to the long gamma/delta isoforms in UniProt Q9P0M2, and must not be read
      onto this entry. None of that is imported here.'
core_functions:
- description: 'Membrane-anchored PKA scaffold that couples the kinase to L-type calcium channels. The
    short AKAP7 isoforms are lipid-anchored at the plasma membrane, bind the RII D/D domain of PKA through
    an amphipathic helix, and bind the C-terminus of CaV1.1 and CaV1.2 through a leucine-zipper interaction,
    so they place PKA beside the channel it regulates. The molecular activity is adaptor binding; channel
    regulation is its consequence. How necessary this is in vivo is unresolved: disrupting the interaction
    with peptides impairs beta-adrenergic channel regulation, but deleting every AKAP7 isoform does not.'
  molecular_function:
    id: GO:0060090
    label: molecular adaptor activity
  directly_involved_in:
  - id: GO:0072659
    label: protein localization to plasma membrane
  - id: GO:0051924
    label: regulation of calcium ion transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:14569017
    supporting_text: Site-directed mutagenesis studies reveal that AKAP15 directly interacts with the
      distal C terminus of the cardiac CaV1.2 channel via a leucine zipper-like motif.
  - reference_id: PMID:27102985
    supporting_text: Here, we elucidated the structure of an extended PKA-binding domain of AKAP18β bound
      to the D/D domain of the regulatory RIIα subunits of PKA.
  - reference_id: PMID:9545239
    supporting_text: Membrane anchoring is mediated by the first 10 amino acids of AKAP18, and involves
      residues Gly1, Cys4 and Cys5 which are lipid-modified through myristoylation and dual palmitoylation,
      respectively.
  - reference_id: PMID:14569017
    supporting_text: Disruption of PKA anchoring to CaV1.2 channels via AKAP15 using competing peptides
      markedly inhibits the beta-adrenergic regulation of CaV1.2 channels via the PKA pathway in ventricular
      myocytes.
  - reference_id: PMID:23035250
    supporting_text: KO cardiomyocytes responded normally to adrenergic stimulation, as measured by whole-cell
      patch clamp or a fluorescent intracellular Ca(2+) indicator.
  knowledge_gaps:
  - gap_statement: Whether AKAP7 is required for beta-adrenergic regulation of the cardiac L-type calcium
      channel in vivo is contested.
    boundary: 'Established: AKAP15 binds CaV1.2 directly via a leucine zipper and co-purifies with it,
      and peptides disrupting that anchoring inhibit beta-adrenergic regulation in ventricular myocytes.
      Also established: a knockout lacking every AKAP7 isoform shows normal beta-adrenergic responses.
      Both results stand; what they leave open is whether the peptides act on other AKAPs or whether other
      AKAPs compensate in the knockout.'
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
    provenance:
    - reference_id: PMID:14569017
      supporting_text: Disruption of PKA anchoring to CaV1.2 channels via AKAP15 using competing peptides
        markedly inhibits the beta-adrenergic regulation of CaV1.2 channels via the PKA pathway in ventricular
        myocytes.
    - reference_id: PMID:23035250
      supporting_text: KO cardiomyocytes responded normally to adrenergic stimulation, as measured by
        whole-cell patch clamp or a fluorescent intracellular Ca(2+) indicator.
  - gap_statement: Human AKAP7 carries no annotation for its role at hippocampal mossy fiber synapses,
      although the mouse ortholog carries synaptic-transmission terms by IDA and IMP from the same study.
    boundary: The mouse work is a conditional deletion in dentate granule cells. Whether the human-side
      absence is deliberate or an omission is not evident; recorded rather than added as NEW, as for the
      analogous AKAIN1 case.
    gap_kind:
    - CURATION
    dark_aspect: BP_DARK
    provenance:
