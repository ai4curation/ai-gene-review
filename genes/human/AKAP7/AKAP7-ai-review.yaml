- term:
    id: GO:0060090
    label: molecular adaptor activity
  evidence_type: IPI
  original_reference_id: PMID:14569017
  review:
    summary: AKAP15 bridges PKA to CaV1 calcium channels - binding the RII subunit on one side and the
      channel's C-terminal leucine zipper on the other. That is molecular adaptor activity, and the AKAP
      family carries this term.
    action: NEW
    reason: 'Participation: AKAP15 itself makes both contacts. It binds PKA''s regulatory subunit [PMID:27102985
      "Here, we elucidated the structure of an extended PKA-binding domain of AKAP18β bound to the D/D
      domain of the regulatory RIIα subunits of PKA."] and the channel, directly [PMID:14569017 "Site-directed
      mutagenesis studies reveal that AKAP15 directly interacts with the distal C terminus of the cardiac
      CaV1.2 channel via a leucine zipper-like motif."], co-purifying with it [PMID:14569017 "A kinase-anchoring
      protein 15 (AKAP15) coimmunoprecipitates with CaV1.2 channels"], and the same for skeletal CaV1.1
      [PMID:11733497 "Here we report that AKAP15 directly interacts with the C-terminal domain of the
      alpha(1) subunit of Ca(V)1.1 via a leucine zipper (LZ) motif."]. GO:0060090 is the binding activity
      that brings two or more molecules together so they function in a coordinated way, which is the definition
      of an AKAP. Comparator check: AKAP5 and AKAP9 carry GO:0060090, by IBA among other codes, so PAINT
      places it on the AKAP lineage - its absence here looks like a gap rather than a convention. Not
      an ancestor or descendant of GO:0034237, which is a binding term in a different branch. Evidence
      code IPI because the load-bearing experiments are physical interactions.'
    supported_by:
    - reference_id: PMID:14569017
      supporting_text: Site-directed mutagenesis studies reveal that AKAP15 directly interacts with the
        distal C terminus of the cardiac CaV1.2 channel via a leucine zipper-like motif.
    - reference_id: PMID:14569017
      supporting_text: A kinase-anchoring protein 15 (AKAP15) coimmunoprecipitates with CaV1.2 channels
    - reference_id: PMID:11733497
      supporting_text: Here we report that AKAP15 directly interacts with the C-terminal domain of the
        alpha(1) subunit of Ca(V)1.1 via a leucine zipper (LZ) motif.
    - reference_id: PMID:27102985
      supporting_text: Here, we elucidated the structure of an extended PKA-binding domain of AKAP18β
        bound to the D/D domain of the regulatory RIIα subunits of PKA.
