      supporting_text: Genetic ablation of AKAP7 specifically from dentate granule cells results in disruption
        of MF-CA3 LTP directly initiated by cAMP
proposed_new_terms: []
suggested_questions:
- question: Do the AKAP15-disrupting peptides also displace PKA from other AKAPs at CaV1.2, which would
    reconcile them with the normal knockout phenotype?
- question: Should human AKAP7 carry the mossy-fiber synaptic terms that the mouse ortholog has by IDA
    and IMP?
- question: Is the PKA-independent suppression of ENaC by AKAP15 seen in epithelia, or only in oocytes?
    A single heterologous study is too thin to annotate.
- question: Which isoform mediates the mossy-fiber role? The conditional deletion removes all of them,
    and only the short isoforms are in this entry.
suggested_experiments:
- description: Isoform-selective knockout of AKAP18alpha in cardiomyocytes, which separates its CaV1.2
    role from compensation by the long isoforms.
- description: Test whether the CaV1.2 leucine-zipper disrupting peptides displace PKA anchored by AKAP5
    or other AKAPs in myocytes.
- description: Rescue the dentate granule cell knockout with individual isoforms to assign the mossy-fiber
    LTP function.
