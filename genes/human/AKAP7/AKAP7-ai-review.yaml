  - statement: AKAP18 targets PKA to the plasma membrane and couples it to the L-type calcium channel.
    supporting_text: targets the cAMP-dependent protein kinase (PKA) to the plasma membrane, and permits
      functional coupling to the L-type calcium channel.
  - statement: Membrane anchoring is by N-terminal myristoylation and dual palmitoylation.
    supporting_text: Membrane anchoring is mediated by the first 10 amino acids of AKAP18, and involves
      residues Gly1, Cys4 and Cys5 which are lipid-modified through myristoylation and dual palmitoylation,
      respectively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. The cloning paper; source of the PKA-binding IDA and the curator's localization
      inference.
- id: PMID:10613906
  title: Alternative splicing regulates the subcellular localization of A-kinase anchoring protein 18
    isoforms.
  findings:
  - statement: All isoforms share one R-subunit binding site but differ in targeting.
    supporting_text: The AKAP18 isoforms share a common R subunit binding site, but have distinct targeting
      domains.
  - statement: Alpha goes to lateral, beta to apical membranes in epithelial cells.
    supporting_text: When expressed in epithelial cells, AKAP18alpha is targeted to lateral membranes,
      whereas AKAP18beta is accumulated at the apical membrane.
  - statement: Alpha and beta are membrane-targeted; gamma is cytosolic.
    supporting_text: The original AKAP18 (renamed AKAP18alpha) and AKAP18beta target the plasma membrane
      when expressed in HEK-293 cells, while AKAP18gamma is cytosolic.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Establishes the isoform-specific locations, and that gamma is cytosolic
      - which matters because gamma is a separate UniProt entry.
- id: PMID:11299204
  title: AKAP proteins anchor cAMP-dependent protein kinase to KvLQT1/IsK channel complex.
  findings:
  - statement: Several unrelated AKAPs restore cAMP regulation of IKs interchangeably.
    supporting_text: coexpression of the neuronal A kinase anchoring protein (AKAP)79, a fragment of a
      cardiac AKAP (mAKAP), or cardiac AKAP15/18 restored cAMP regulation of KvLQT1/IsK complexes
  - statement: The authors attribute the effect to PKA anchoring generally.
    supporting_text: We concluded that cAMP regulation of I(Ks) requires protein kinase A anchoring by
      AKAPs
  - statement: The effect is modest relative to myocytes.
    supporting_text: However, in cells expressing an AKAP, the effects of cAMP stimulation on the I(Ks)
      amplitude remained modest compared with those previously reported in cardiac myocytes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; publisher full text returned 403. A heterologous reconstitution in which
      AKAP15/18 is one of three interchangeable AKAPs. The four IDA rows from it are kept but marked non-core,
      and the action-potential row is UNDECIDED because the abstract reports currents only.
- id: PMID:11733497
  title: A novel leucine zipper targets AKAP15 and cyclic AMP-dependent protein kinase to the C terminus
    of the skeletal muscle Ca2+ channel and modulates its function.
  findings:
  - statement: AKAP15 binds the CaV1.1 C-terminus through a leucine zipper.
    supporting_text: Here we report that AKAP15 directly interacts with the C-terminal domain of the alpha(1)
      subunit of Ca(V)1.1 via a leucine zipper (LZ) motif.
  - statement: Disrupting it blocks voltage-dependent potentiation in skeletal muscle.
    supporting_text: Disruption of the LZ interaction effectively inhibits voltage-dependent potentiation
      of L-type Ca(2+) channels in skeletal muscle cells.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. Not cited by any GO annotation on this gene; surfaced by the affinage
      record. The defining mechanistic paper for AKAP15 in skeletal muscle.
- id: PMID:14569017
  title: Beta-adrenergic regulation requires direct anchoring of PKA to cardiac CaV1.2 channels via a
    leucine zipper interaction with A kinase-anchoring protein 15.
  findings:
  - statement: AKAP15 co-purifies with CaV1.2.
    supporting_text: A kinase-anchoring protein 15 (AKAP15) coimmunoprecipitates with CaV1.2 channels
  - statement: It binds the CaV1.2 C-terminus via a leucine-zipper-like motif.
    supporting_text: Site-directed mutagenesis studies reveal that AKAP15 directly interacts with the
      distal C terminus of the cardiac CaV1.2 channel via a leucine zipper-like motif.
  - statement: Competing peptides inhibit beta-adrenergic regulation of CaV1.2 in myocytes.
    supporting_text: Disruption of PKA anchoring to CaV1.2 channels via AKAP15 using competing peptides
      markedly inhibits the beta-adrenergic regulation of CaV1.2 channels via the PKA pathway in ventricular
      myocytes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Not cited by any GO annotation on this gene; found by an independent
      PubMed search. Grounds the NEW molecular adaptor row. Its peptide-disruption result conflicts with
      the genetic knockout in PMID:23035250.
- id: PMID:23035250
  title: Cardiomyocytes from AKAP7 knockout mice respond normally to adrenergic stimulation.
  findings:
  - statement: All AKAP7 isoforms were deleted.
    supporting_text: We generated an AKAP7 KO mouse in which all isoforms were deleted
  - statement: Knockout cardiomyocytes respond normally to adrenergic stimulation.
    supporting_text: KO cardiomyocytes responded normally to adrenergic stimulation, as measured by whole-cell
      patch clamp or a fluorescent intracellular Ca(2+) indicator.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only. A genetic negative that directly conflicts with the peptide-disruption
      result in PMID:14569017. Neither is wrong on its own terms; the conflict is recorded as a knowledge
      gap rather than resolved here.
- id: PMID:27911261
  title: Targeted deletion of AKAP7 in dentate granule cells impairs spatial discrimination.
  findings:
  - statement: Deleting AKAP7 in dentate granule cells disrupts cAMP-initiated mossy fiber LTP.
    supporting_text: Genetic ablation of AKAP7 specifically from dentate granule cells results in disruption
      of MF-CA3 LTP directly initiated by cAMP
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. The mouse ortholog carries synaptic-transmission terms from this paper
      by IDA and IMP; human does not - recorded as a curation gap.
- id: PMID:27102985
  title: AKAP18:PKA-RIIα structure reveals crucial anchor points for recognition of regulatory subunits
    of PKA.
  findings:
  - statement: Crystal structure of the AKAP18beta PKA-binding domain bound to the RIIalpha D/D domain.
    supporting_text: Here, we elucidated the structure of an extended PKA-binding domain of AKAP18β bound
      to the D/D domain of the regulatory RIIα subunits of PKA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Structural evidence for RII binding on this entry's own beta isoform;
      grounds the GO:0034237 refinement.
- id: PMID:9748250
  title: AKAP15 anchors cAMP-dependent protein kinase to brain sodium channels.
  findings:
  - statement: PKA co-purifies with brain sodium channels.
    supporting_text: Bound PKA was immunoprecipitated with anti-SP19 antibodies directed against the sodium
      channel alpha subunit.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Supports AKAP15 as a channel-associated PKA anchor beyond CaV1; not used
      to ground any annotation.
- id: PMID:17244820
  title: The A-kinase anchoring protein 15 regulates feedback inhibition of the epithelial Na+ channel.
  findings:
  - statement: Co-expressed AKAP15 strongly reduces ENaC conductance in oocytes.
    supporting_text: oocytes coexpressing AKAP15 exhibited an 80% and 91% reduction in the amiloride-sensitive,
      whole-cell conductance in high and low Na+ conditions, respectively.
  - statement: The effect is PKA-independent.
    supporting_text: The reduced channel activity was unaffected by PKA activation or inhibition, indicating
      a PKA-independent mechanism.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Cited by UniProt but by no GO annotation. A single heterologous study
      of a PKA-independent effect, so raised as a question rather than proposed as an annotation.
