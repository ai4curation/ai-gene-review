gene_symbol: AKAP7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'AKAP7 (A-kinase anchoring protein 7, also called AKAP15 or AKAP18) encodes a family of PKA
  anchoring proteins produced by alternative splicing. This entry covers the two short isoforms, AKAP18alpha
  (AKAP15) and AKAP18beta, which are targeted to the plasma membrane by myristoylation of the N-terminal
  glycine and dual palmitoylation of two adjacent cysteines; the longer, cytosolic gamma and delta isoforms,
  which carry a central 2H phosphoesterase domain, are a separate UniProt entry. In polarised epithelial
  cells the alpha form goes to the lateral membrane and the beta form to the apical membrane. Both bind
  the dimerization/docking domain of the PKA type II regulatory subunit through a shared amphipathic helix,
  positioning PKA at the membrane. The best-characterised target is the L-type calcium channel: AKAP15
  binds the C-terminus of the CaV1.1 and CaV1.2 alpha1 subunits through a leucine-zipper interaction,
  placing PKA where it phosphorylates the channel, and peptides that disrupt this interaction blunt voltage-dependent
  potentiation in skeletal muscle and beta-adrenergic regulation of the channel in ventricular myocytes.
  A mouse lacking all AKAP7 isoforms nonetheless shows normal beta-adrenergic responses in ventricular
  myocytes, so the gene''s necessity for cardiac calcium-channel regulation in vivo is unresolved. AKAP15
  also co-purifies with brain voltage-gated sodium channels, can confer cAMP sensitivity on the cardiac
  IKs potassium channel when co-expressed, and reduces epithelial sodium channel activity by a PKA-independent
  mechanism in oocytes. In the hippocampus, AKAP7 in dentate granule cells is required for cAMP-induced
  long-term potentiation at mossy fiber synapses and for pattern-separation behaviour.'
