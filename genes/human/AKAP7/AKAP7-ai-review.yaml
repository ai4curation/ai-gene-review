- term:
    id: GO:0006811
    label: monoatomic ion transport
  evidence_type: TAS
  original_reference_id: PMID:9545239
  qualifier: involved_in
  review:
    summary: Monoatomic ion transport. AKAP18 does not transport ions; it regulates a channel that does.
      Modified to the regulatory term.
    action: MODIFY
    reason: 'The participation test is the issue. An AKAP does none of the work of moving ions - the CaV1
      channel does - but it does regulate that channel by anchoring PKA to it, directly and via a defined
      motif: [PMID:11733497 "Here we report that AKAP15 directly interacts with the C-terminal domain
      of the alpha(1) subunit of Ca(V)1.1 via a leucine zipper (LZ) motif."], and disrupting that interaction
      [PMID:11733497 "Disruption of the LZ interaction effectively inhibits voltage-dependent potentiation
      of L-type Ca(2+) channels in skeletal muscle cells."]. The same holds for cardiac CaV1.2 [PMID:14569017
      "Site-directed mutagenesis studies reveal that AKAP15 directly interacts with the distal C terminus
      of the cardiac CaV1.2 channel via a leucine zipper-like motif."]. So the essence of this traceable
      author statement is sound but the role is conflated; GO:0051924 regulation of calcium ion transport
      states it correctly. One caveat travels with it: in ventricular myocytes, knocking out every AKAP7
      isoform did not impair beta-adrenergic regulation [PMID:23035250 "KO cardiomyocytes responded normally
      to adrenergic stimulation, as measured by whole-cell patch clamp or a fluorescent intracellular
      Ca(2+) indicator."], which conflicts with the peptide-disruption result. The regulatory capacity
      is established; its necessity in the heart is contested, and is recorded as a knowledge gap.'
    proposed_replacement_terms:
    - id: GO:0051924
      label: regulation of calcium ion transport
    supported_by:
    - reference_id: PMID:11733497
      supporting_text: Here we report that AKAP15 directly interacts with the C-terminal domain of the
        alpha(1) subunit of Ca(V)1.1 via a leucine zipper (LZ) motif.
