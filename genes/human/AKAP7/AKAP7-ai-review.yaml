      modest compared with those previously reported in cardiac myocytes."]. So AKAP15/18 can confer cAMP
      regulation on the IKs channel when supplied, which is a property of being an AKAP, not evidence
      that AKAP7 is the anchor for IKs in myocytes. The curator read the full text and the result stands;
      it is kept, but marked non-core. IKs is the slow delayed rectifier, a repolarising current, so regulation
      of repolarisation is a fair reading of the current data even though the abstract does not measure
