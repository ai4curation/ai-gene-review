id: A0A3G1DJN1
gene_symbol: MT-RNR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Small humanin-like peptide 6 (SHLP6) is a predicted 20-residue peptide, the shortest of
  the group, and a 16S-rRNA sORF peptide: its open reading frame lies inside MT-RNR2, the mitochondrial
  16S ribosomal RNA gene, in the same stretch of mitochondrial DNA that encodes humanin. The six small
  humanin-like peptides SHLP1-SHLP6 were identified by an in silico search of this region and named by
  analogy with humanin, with which they share a genomic neighbourhood rather than sequence similarity.
  Its only reported activity sets it apart from its neighbours: synthetic SHLP6 at 100 nM significantly
  increased apoptosis in murine NIT-1 beta-cells and human 22Rv1 prostate cancer cells, the opposite of
  the cytoprotective effects of SHLP2 and SHLP3 in the same assay. The peptide was detected by immunoblot
  in mouse liver and kidney. No receptor, binding partner, structure or subcellular location has been
  reported, and UniProt classifies the entry as PE4 (predicted). How much of this is translated in vivo
  is unresolved. The peptides are read with the cytoplasmic genetic code, yet no route is known by which
  an mtDNA-encoded transcript reaches cytoplasmic ribosomes, nor by which a peptide made in the matrix
  would be exported; and the same region of mitochondrial DNA is present in the nuclear genome as MT-RNR2-like
  (NUMT-derived) copies, so antibody-based detection cannot be attributed to the mitochondrial locus with
  certainty.'
aliases:
- SHLP6
suggested_questions:
- question: Is the pro-apoptotic effect of SHLP6 a genuine signalling activity or peptide toxicity? A
    20-residue synthetic peptide that kills two unrelated cell lines could be acting through a receptor,
    through membrane perturbation, or as a contaminant effect; the founding study (PMID:27070352) does
    not distinguish these, which is why no GO process term is proposed here.
- question: Why would the same mitochondrial locus encode both cytoprotective (humanin, SHLP2, SHLP3)
    and pro-apoptotic (SHLP6) peptides? If real, this would be a notable feature of the locus; if it reflects
    the properties of synthetic peptides rather than of endogenous products, it is a caution for the whole
    SHLP set.
- question: Is SHLP6 translated in human tissue, and from the mitochondrial or a nuclear MT-RNR2-like
    locus?
suggested_experiments:
- description: Dose-response apoptosis assays with synthetic SHLP6, a scrambled-sequence control of identical
    composition, and a membrane-integrity readout (LDH release, propidium iodide) alongside caspase activation,
    to separate receptor-mediated apoptosis from non-specific membrane damage.
  hypothesis: The pro-apoptotic effect is sequence-specific and caspase-dependent rather than a membrane-permeabilising
    artefact.
- description: Targeted mass spectrometry of SHLP6 in human tissues and plasma, with heavy-labelled standard,
    to establish existence and abundance before attributing a physiological pro-apoptotic role.
  hypothesis: SHLP6 is present endogenously at concentrations comparable with those used in the apoptosis
    assay.
