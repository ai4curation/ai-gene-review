    review_notes: 'PubMed-verified (Cobb et al., Aging (Albany NY) 2016); full text cached from PMC4925829.
      The founding description of SHLP1-6: in silico identification of the six ORFs, antibody detection
      of SHLP1-4 and 6 in mouse tissues (no specific antibody could be raised against SHLP5), and a panel
      of viability, apoptosis and proliferation assays with synthetic peptides at 100 nM. It is the only
      publication covering SHLP1, SHLP4, SHLP5 and SHLP6, and for those four peptides it reports a cell-culture
      phenotype without any molecular mechanism, receptor or binding partner.'
