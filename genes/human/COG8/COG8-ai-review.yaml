id: Q96MW5
gene_symbol: COG8
product_type: PROTEIN
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COG8 is a peripheral Golgi-associated subunit of the eight-subunit conserved oligomeric
  Golgi complex. It binds Golgi SNARE proteins and couples their recognition to complex-dependent
  carrier recruitment and SNARE-complex organization. These activities help maintain Golgi architecture
  and the recycling environment needed for normal glycosylation. COG8 also supports endosome-to-trans-Golgi
  traffic; its loss disrupts COG subassemblies and the localization or assembly of selected SNAREs.
