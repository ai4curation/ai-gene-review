core_functions:
- description: Binds Golgi SNAREs, including STX16, as a subunit of the COG complex, coupling recognition
    to complex-dependent carrier capture and SNARE-complex organization. Human experiments establish
    COG8-dependent endosome-to-TGN transport and ectopic recruitment of STX16-bearing carriers, with
    lobe B retained in the retargeting context. Binding alone is insufficient for recruitment; COG8
    is not itself a fusogenic SNARE or a demonstrated autonomous tether. Complex assembly and maintenance
    of Golgi organization are integrated aspects of this trafficking role.
