      HeLa cells and alters retrograde cargo distributions in patient fibroblasts. COG8 performs
      machinery work rather than being the transported substrate. This route is distinct from the
      retained COPI intra-Golgi process and Golgi organization; typed ancestor/descendant checks
      against every original, replacement and core term find no overlap. Role-matched GARP components
      VPS53 and VPS54 carry this exact process in current GO records, with qualifier-specific differences
      preserved in the notes; no indexed GO-CAM target model gives a competing role. No autonomous
      fusion or universal product activity is implied.
    supported_by:
    - reference_id: PMID:23462996
    - reference_id: PMID:23865579
