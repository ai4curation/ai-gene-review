  - *id020
  - *id011
  - *id021
  - *id012
  - reference_id: file:human/KASH5/KASH5-deep-research-falcon.md
    supporting_text: It is therefore regarded as the first established transmembrane dynein-activating
      adaptor
- description: 'KASH subunit of the meiotic LINC complex: the C-terminal KASH peptide binds SUN1 (and
    SUN2) SUN-domain trimers in the perinuclear space, forming SUN-KASH 6:6 assemblies that anchor KASH5
    and its dynein cargo at telomere attachment sites, transmitting microtubule force across the nuclear
    envelope to telomeres.'
  molecular_function: *id004
  directly_involved_in:
  - id: GO:0034397
    label: telomere localization
  locations:
  - id: GO:0005640
    label: nuclear outer membrane
  in_complex:
