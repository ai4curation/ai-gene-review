  review:
    summary: Lateral element (synaptonemal complex axis) localization transferred from mouse Kash5.
    action: MARK_AS_OVER_ANNOTATED
    reason: KASH5 foci sit at the telomeric ends of SCP3-stained chromosome axes because telomeres attach
      to the nuclear envelope, but KASH5 is an outer nuclear membrane protein, separated from the chromosome
      axis by the nuclear envelope. It is not a synaptonemal complex / lateral element component; this
      CC is an over-interpretation of co-localization at axis ends.
