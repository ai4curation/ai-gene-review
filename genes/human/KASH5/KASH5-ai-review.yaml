      supporting_text: 'we solved high resolution crystal structures of human SUN2 in complex with the
        KASH-peptides of

        Nesprin3, Nesprin4, and KASH5'
    - &id005
      reference_id: PMID:24062341
      supporting_text: KASH5 is a dynein-binding protein tethered in the ONM via interactions with SUN1,
        an INM resident
