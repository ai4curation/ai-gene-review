  review:
    summary: Structural/biophysical evidence that the KASH5 C-terminal KASH peptide binds the SUN domain
      of SUN2, forming the meiotic LINC complex.
    action: MODIFY
    reason: Generic protein binding is uninformative. The partner is a SUN-domain protein, and insertion
      of the KASH5 KASH peptide into the SUN domain trimer is how KASH5 is anchored in the outer nuclear
      membrane and how its dynein cargo is coupled through the nuclear envelope to telomeres; GO:0140444
      cytoskeleton-nuclear membrane anchor activity captures this, consistent with the SUN1, SUN2, SYNE1
      and SYNE2 reviews. (No KASH-domain/SUN-domain binding MF term exists in GO.)
