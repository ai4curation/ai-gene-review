- term:
    id: GO:0007015
    label: actin filament organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2687329
  - PANTHER:PTN002933398
  review:
    summary: Actin filament organization, from mouse oocyte knockdown data (reduced cytoplasmic F-actin
      mesh after Kash5 depletion).
    action: MARK_AS_OVER_ANNOTATED
    reason: KASH5 has no actin-binding domain; it is a dynein activating adaptor. The only support is
      a single siRNA/morpholino study in mouse oocytes reporting lower cytoplasmic F-actin intensity after
      SUN1 or KASH5 depletion, an indirect downstream consequence of disrupted maturation rather than
      KASH5 acting on actin filaments.
    supported_by:
    - &id009
      reference_id: PMID:26842404
      supporting_text: As F-actin mesh level in cytoplasm was decreased in SUN1 or KASH5 depleted oocytes,
        the spindle migration would also be affected.
    - &id010
      reference_id: PMID:35703493
      supporting_text: KASH5 is a bona fide activating adaptor that converts dynein and dynactin into
        a processive complex
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002933398
        comment: KASH5 clade node; human KASH5 is correctly inside the clade (true ortholog), so the issue
          is the scope of the descendant assertion, not node placement.
        source_status: SOURCE_WEAK_OR_INFERRED
      - source_id: MGI:MGI:2687329
        source_label: Kash5
        comment: Mouse oocyte knockdown (PMID:26842404) with reduced F-actin mesh as an indirect downstream
          phenotype.
        source_status: SOURCE_WEAK_OR_INFERRED
