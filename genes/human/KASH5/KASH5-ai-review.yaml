- term:
    id: GO:0007129
    label: homologous chromosome pairing at meiosis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:2687329
  - PANTHER:PTN002933398
  review:
    summary: Homologous chromosome pairing at meiosis.
    action: ACCEPT
    reason: 'Core process. Kash5-null spermatocytes arrest with homologues largely unpaired, and KASH5
      does part of the work: it is the ONM dynein activating adaptor that supplies the motor force for
      telomere-led chromosome movements that promote pairing. Human KASH5 variants cause NOA and POI with
      defective pairing.'
    supported_by:
    - &id021
      reference_id: PMID:24062341
      supporting_text: In the absence of KASH5, spermatocytes arrest at the leptotene/zygotene stage of
        meiosis with the majority of chromosomes never forming homologous pairs.
    - &id011
      reference_id: PMID:24062341
      supporting_text: KASH5 is therefore essential for the recruitment of dynein to telomere attachment
        sites at the NE during meiosis.
    - *id010
