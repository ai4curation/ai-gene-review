- term:
    id: GO:0000781
    label: chromosome, telomeric region
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:2687329
  - PANTHER:PTN002933398
  review:
    summary: KASH5 is concentrated at nuclear-envelope sites where meiotic telomeres attach, from leptotene
      to diplotene.
    action: MARK_AS_OVER_ANNOTATED
    reason: KASH5 co-localizes with telomeres at light-microscopy resolution, but it is a tail-anchored
      outer nuclear membrane protein whose bulk faces the cytoplasm and whose KASH peptide reaches only
      the perinuclear space; it contacts telomeres indirectly via SUN1/SUN2 across the inner nuclear membrane.
      It is therefore not a component of the chromosomal telomeric region. Its location is better captured
      by nuclear outer membrane (GO:0005640) and the meiotic LINC complex term (GO:0034993).
    supported_by:
    - &id001
      reference_id: PMID:22826121
      supporting_text: These results indicate that KASH5 is a telomere-associated protein at early meiosis
        during both male and female meiosis.
    - &id002
      reference_id: PMID:22826121
      supporting_text: KASH5 associates with the dynein–dynactin complexes, whereas SUN1 may associate
        with telomeres on the opposite outsides of the NE, thus transferring the driving force generated
        by cytoplasmic microtubules to telomeres in the nucleus.
    - &id003
      reference_id: file:human/KASH5/KASH5-uniprot.txt
      supporting_text: Single-pass type IV
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN002933398
        comment: KASH5 clade node; human KASH5 is correctly inside the clade (true ortholog), so the issue
          is the scope of the descendant assertion, not node placement.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: MGI:MGI:2687329
