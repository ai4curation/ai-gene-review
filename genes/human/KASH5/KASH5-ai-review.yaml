core_functions:
- description: 'Transmembrane dynein activating adaptor of the outer nuclear membrane: the N-terminal
    EF-hand pair binds the dynein light intermediate chain and, with the coiled coil, assembles dynein-dynactin-LIS1
    into processive motors that pull on telomere attachment sites to drive meiotic telomere clustering
    and homologue pairing.'
  molecular_function:
    id: GO:0140660
    label: cytoskeletal motor activator activity
  directly_involved_in:
  - id: GO:0045141
    label: meiotic telomere clustering
  - id: GO:0007129
    label: homologous chromosome pairing at meiosis
  locations:
  - id: GO:0005640
    label: nuclear outer membrane
  in_complex:
    id: GO:0034993
    label: meiotic nuclear membrane microtubule tethering complex
  supported_by:
