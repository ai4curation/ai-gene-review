id: Q86UX7
gene_symbol: FERMT3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FERMT3 encodes kindlin-3, an intracellular FERM-domain adhesion protein expressed predominantly in
  hematopoietic cells. It associates with beta-integrin cytoplasmic tails and contributes to integrin activation
  at adhesive contacts, supporting platelet aggregation, leukocyte firm adhesion and adhesion-dependent spreading.
  Kindlin-3 localizes to podosome-associated adhesion structures and is recruited to the plasma membrane during
  adhesion. Its F1 loop and PH domain interact with acidic phospholipids. The two natural splice products differ
  by an IPRR insertion in the PH domain. Both support beta2-integrin activation in human neutrophil-like cells;
  the long, IPRR-containing form shows greater membrane recruitment and adhesion under the tested conditions.
