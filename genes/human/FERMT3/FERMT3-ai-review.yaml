  review:
    summary: Human kindlin-3 is recruited to the plasma membrane during adhesion; refine the broad membrane annotation
      using independent cellular evidence.
    action: MODIFY
    reason: 'The original NK-cell HDA record is retained unchanged. Its final published supplement remains inaccessible;
      the related author thesis has positive ENSP00000279227/Kindlin-3 membrane-fraction detections but is not an
      established identical dataset. Independent human evidence supports the more precise gene-level plasma-membrane
      location: PMID:19234460 Figure 4e shows KINDLIN3-EGFP at adherent B-cell contacts, and PMID:42574321 Figure
      2B–F directly follows full-length human short and IPRR-containing long proteins at the plasma-membrane contact
      zone in rescued neutrophil-like HL-60 cells. Both forms recruit during arrest, with greater recruitment of
      the long form in that setting. PMID:27101375 supplies complementary isolated F1-loop lipid-binding evidence,
      not an independent full-length localization measurement. GO:0005886 includes membrane-associated proteins
      and does not require an integral topology. This refinement uses matching independent location evidence; it
      does not retrospectively establish the final NK-cell target join or its detected natural splice product.'
    proposed_replacement_terms:
