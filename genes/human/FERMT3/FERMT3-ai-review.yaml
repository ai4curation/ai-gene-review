- id: PMID:19234460
  title: A point mutation in KINDLIN3 ablates activation of three integrin subfamilies in humans.
  findings: []
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Actual original Results, main Methods and Figures 1–4 captions were read, using the complete cached
      body and independently recovered NCBI BioC article. Human patient platelets/leukocytes show preserved receptor
      abundance but defective activation-dependent ligand binding, aggregation and spreading. KINDLIN3-EGFP from
      IMAGE clone 6709978 restores adhesion and spreading in transformed human lymphocytes, and knockdown corroborates
      the phenotype. Upstream P-selectin/other signaling responses persist; no catalytic role is inferred. The 56-kDa
      patient band and possible downstream initiation are not established normal splice products. Osteopetrosis
      mechanism remains exploratory. Supplementary experimental panels and movies were not independently inspected.
