core_functions:
- description: Associates with beta-integrin cytoplasmic tails at adhesion sites and contributes to integrin activation.
    Human deficiency and rescue establish the activation role; mouse ortholog experiments provide tail-association
    and F3-domain binding evidence. The isolated F1 loop also binds acidic phospholipids, but its full-length membrane
    orientation remains unresolved.
  molecular_function:
    id: GO:0005178
    label: integrin binding
  directly_involved_in:
  - id: GO:0033622
    label: integrin activation
  locations:
  - id: GO:0030055
    label: cell-substrate junction
  - id: GO:0002102
    label: podosome
  supported_by:
  - reference_id: PMID:19234460
  - reference_id: PMID:19234463
  - reference_id: PMID:18278053
  - reference_id: PMID:19234461
  - reference_id: PMID:16876785
  - reference_id: PMID:27101375
suggested_questions:
- question: How do F1-loop phospholipid contacts and the PH domain cooperate with integrin-tail binding in intact
    kindlin-3, and which effects can be separated from altered folding or expression?
- question: How do the reported URP2SF NF-kappaB and apoptosis effects relate to endogenous short kindlin-3 function,
    and do they differ from the long product? The 2026 direct comparison establishes an adhesion-context membrane-recruitment
    difference, whereas the older accessed material does not establish four-residue-specific causality for NF-kappaB
    or apoptosis.
- question: What directly supports the extracellular-exosome and platelet alpha-granule-lumen assignments for FERMT3,
    and can vesicular release, surface association and cell lysis be distinguished?
suggested_experiments:
- description: Reconstitute sequence-verified full-length kindlin-3 with beta-integrin tails and composition-controlled
    lipid bilayers. Compare F1-loop and PH-domain variants while independently testing protein folding and tail
    binding, then measure membrane recruitment and integrin activation in a cellular rescue assay.
  hypothesis: The isolated F1-loop phospholipid interaction may contribute to membrane recruitment in cooperation
    with other domains, without uniquely determining the full-length orientation.
  experiment_type: Biochemical reconstitution and cellular complementation
- description: Use targeted mass spectrometry and orthogonal localization on purified platelet alpha granules, B-cell
    extracellular vesicles and matched supernatants, with compartment markers, protease-protection tests, lysis
    controls and isoform-discriminating peptides where available.
  hypothesis: Reported extracellular detection may involve distinct pools or release routes rather than uniquely
    locating kindlin-3 in the alpha-granule lumen.
  experiment_type: Compartment-resolved proteomics and localization
functional_isoforms:
- id: FERMT3_LONG_IPRR
  name: Long IPRR-containing kindlin-3
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q86UX7-1
  description: The 667-residue long product contains IPRR at residues 360–363 of the PH domain. Full-length N-terminally
    tagged human protein rescues beta2-integrin activation and arrest in FERMT3-deficient neutrophil-like HL-60
    cells and shows greater membrane recruitment than the matched short product in that setting (PMID:42574321,
    Figures 1 and 2; Methods, manuscript lines 136–171). The spread-area comparison is not significantly different.
    Stronger lipid binding was measured separately with isolated PH-domain constructs (residues 348–479), not purified
    full-length protein (Figure 3). Human constructs also rescue mouse fetal-liver HSPCs; this is a separate cross-species
    assay. The results do not establish a universal advantage across cell types or causal recovery after transplantation.
- id: FERMT3_SHORT
  name: Short kindlin-3 / URP2SF
  type: SPLICE_VARIANT
  maps_to:
  - type: UNIPROT_ISOFORM
    ids:
    - Q86UX7-2
  description: The 663-residue short product lacks the four IPRR residues represented by UniProt VSP_009226. Full-length
    N-terminally tagged human short protein rescues beta2-integrin activation and arrest and recruits to the plasma
    membrane in FERMT3-deficient neutrophil-like HL-60 cells; its recruitment is lower than the matched long product
    under the tested conditions (PMID:42574321, Figures 1 and 2). It is therefore functional, rather than an inactive
    counterpart. The 2008 URP2SF report concerns a 663-residue construct and NF-kappaB/apoptosis readouts, but the
    accessed abstract and cloning sections do not establish that the four-residue difference causes those effects
    or demonstrate a long-versus-short comparison (PMID:18280249).
