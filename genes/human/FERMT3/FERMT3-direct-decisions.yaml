decisions:
- annotation_index: 8
  source_annotation:
    term:
      id: GO:0007159
      label: leukocyte cell-cell adhesion
    evidence_type: IMP
    original_reference_id: PMID:19234460
    qualifier: involved_in
  review:
    summary: Kindlin-3 supports integrin-dependent leukocyte adhesion.
    action: KEEP_AS_NON_CORE
    reason: Human affected leukocytes had normal integrin abundance but defective activation-dependent adhesion
      and aggregation. PMID:19234460 Figure 2B,C directly examines lymphocyte and neutrophil aggregation, while
      Figure 4 provides KINDLIN3 rescue and knockdown evidence for adhesion. Retain this positive leukocyte context
      as an output of the integrin-activation role, without extending it to all adhesion mechanisms or all splice
      products.
    supported_by:
    - reference_id: PMID:19234460
  methods:
  - Human patient/control adhesion and aggregation
  - KINDLIN3 rescue and knockdown corroboration
  primary_locators:
  - PMID:19234460 Results; Figures 2B,C and 4C–F; Methods, Cell lines and kindlin rescue experiments
- annotation_index: 11
  source_annotation:
    term:
      id: GO:0007229
      label: integrin-mediated signaling pathway
    evidence_type: IMP
    original_reference_id: PMID:19234460
    qualifier: involved_in
  review:
    summary: Kindlin-3 supports integrin-dependent adhesion and spreading while several upstream signaling responses
      remain intact.
    action: KEEP_AS_NON_CORE
    reason: The official term describes signaling initiated by ligand binding to integrin. PMID:19234460 establishes
      defective receptor activation together with adhesion-dependent spreading, substrate contacts, and their rescue;
      it does not identify a kinase activity of kindlin-3. Figure 1D and the signaling controls preserve P-selectin
      induction and several agonist responses, so this is not a global signaling defect. Keep the supported signaling/adhesion
      context as non-core, with integrin activation the more directly resolved process. Inside-out activation alone
      is not being relabeled as the entire outside-in pathway.
    supported_by:
    - reference_id: PMID:19234460
  methods:
  - Human receptor activation and spreading assays
  - Rescue and signaling controls
  primary_locators:
  - PMID:19234460 Figures 1B–D, 4C–F; Results, intact upstream signaling controls; Methods, rescue experiments
- annotation_index: 12
  source_annotation:
    term:
      id: GO:0008289
      label: lipid binding
    evidence_type: EXP
    original_reference_id: PMID:27101375
    qualifier: enables
  review:
    summary: The isolated kindlin-3 F1 loop binds acidic phospholipid vesicles.
    action: MODIFY
    reason: PMID:27101375 Figure 3 and its Results show NMR signal attenuation with POPS and POPG vesicles, with
      substantially weaker changes for POPC. GO:0005543 phospholipid binding captures the actual substrate class
      more precisely than lipid binding while covering both tested acidic phospholipids. The assay used the recombinant
      Leu142–Gln224 loop and a separate synthetic peptide, not a comparison of intact natural splice products. The
      proposed full-length membrane orientation in Figure 6 remains a hypothesis.
    supported_by:
    - reference_id: PMID:27101375
    proposed_replacement_terms:
    - id: GO:0005543
      label: phospholipid binding
  methods:
  - NMR titration of isolated F1 loop with lipid vesicles
  - Circular-dichroism and peptide characterization
  primary_locators:
  - PMID:27101375 Methods, F1-loop expression and SUV/NMR sections; Results and Figure 3; Discussion and hypothetical
    Figure 6
- annotation_index: 13
  source_annotation:
    term:
      id: GO:0016020
      label: membrane
    evidence_type: HDA
    original_reference_id: PMID:19946888
    qualifier: located_in
  review:
    summary: Kindlin-3 has positive membrane-association evidence, while the exact published NK-cell supplement
      remains unverified.
    action: KEEP_AS_NON_CORE
    reason: The published PMID:19946888 supplement was inaccessible, but the first author’s related institutional
      thesis directly identifies ENSP00000279227/Kindlin-3 in human YTS membrane fractions (Tables S7/S8). Its combined
      dataset differs in size from the published article, so this is corroborating primary evidence, not a verified
      join to the final published table. Together with human cell-contact localization in PMID:19234460 and lipid-vesicle
      binding in PMID:27101375, it supports retaining the broad gene-level membrane claim with curator deference.
      It does not establish an integral membrane topology, exclusive plasma-membrane residence or a natural isoform-specific
      detection.
    additional_reference_ids:
    - PMID:19234460
    - PMID:27101375
    supported_by:
    - reference_id: PMID:19946888
    - reference_id: PMID:19234460
    - reference_id: PMID:27101375
  methods:
  - Related first-author thesis membrane-fraction mass spectrometry
  - Independent human adherent-contact imaging and phospholipid interaction
  primary_locators:
  - Ghosh 2008 thesis, Tables S7/S8, printed pages 304/378 (PDF pages 323/397); human YTS Methods; Chapter 3 section
    7.2.8.1
  - PMID:19234460 Figure 4E; PMID:27101375 Figure 3
  published_target_join_verified: false
- annotation_index: 15
  source_annotation:
    term:
      id: GO:0030335
      label: positive regulation of cell migration
    evidence_type: IDA
    original_reference_id: PMID:19234463
    qualifier: involved_in
  review:
    summary: Kindlin-3 restores adhesion-dependent migration of deficient human B cells.
    action: KEEP_AS_NON_CORE
    reason: PMID:19234463 Figure 4B,C measures restored movement on ICAM-1 after kindlin-3 complementation of human
      LAD-III B cells. Methods explicitly identifies the rescue construct as mouse EGFP-KINDLIN3; the human genetic
      lesions and recipient-cell phenotype remain distinct from that cross-species complementation. Retain migration
      as a positive cellular consequence of the integrin-adhesion function, without inferring a separate motility
      motor or a human splice-product-specific activity.
    supported_by:
    - reference_id: PMID:19234463
  methods:
  - Human patient-cell genetics and protein analysis
  - Mouse-protein complementation in human B cells
  - Time-lapse cell tracking
  primary_locators:
  - PMID:19234463 Results, rescue of adhesion/migration; Figure 4B,C; Methods, Antibodies and other reagents and
    Video microscopy
- annotation_index: 19
  source_annotation:
    term:
      id: GO:0033622
      label: integrin activation
    evidence_type: IDA
    original_reference_id: PMID:19234463
    qualifier: involved_in
  review:
    summary: Kindlin-3 is required for productive activation of leukocyte integrin adhesion.
    action: ACCEPT
    reason: PMID:19234463 identifies human FERMT3 lesions with loss of kindlin-3 protein and shows recovery of LFA-1-dependent
      adhesive contacts and migration after expression of mouse EGFP-KINDLIN3 in human patient B cells. This supports
      the gene-level integrin-activation role, reinforced by the independent human activation-specific antibody
      and ligand-binding measurements in PMID:19234460. It does not establish that kindlin-3 alone activates purified
      integrin or define a unique human splice product.
    supported_by:
    - reference_id: PMID:19234463
    - reference_id: PMID:19234460
    additional_reference_ids:
    - PMID:19234460
  methods:
  - Human genetic and protein-expression analysis
  - Integrin-mediated adhesion rescue
  - Independent receptor activation readouts
  primary_locators:
  - PMID:19234463 Figures 2–4; Methods, mouse EGFP-KINDLIN3 construct; PMID:19234460 Figures 1D and 2F,G
- annotation_index: 21
  source_annotation:
    term:
      id: GO:0033622
      label: integrin activation
    evidence_type: IMP
    original_reference_id: PMID:19234460
    qualifier: involved_in
  review:
    summary: Human kindlin-3 supports agonist-dependent activation of several integrin subfamilies.
    action: ACCEPT
    reason: PMID:19234460 measures loss of activation-dependent ligand or antibody binding despite preserved integrin
      abundance in patient platelets and leukocytes. Bypass activation remains possible, and KINDLIN3 expression
      restores adhesion/spreading while knockdown reproduces the cellular defect. These experiments support kindlin-3
      participation in the machinery that enables integrin activation; they do not assign a catalytic activity or
      imply that all upstream agonist signaling is absent.
    supported_by:
    - reference_id: PMID:19234460
  methods:
  - Activation-specific antibody and ligand binding
  - Human patient/control comparison
  - KINDLIN3 rescue and knockdown
  primary_locators:
  - PMID:19234460 Figures 1C,D, 2F–H and 4C–F; Results, bypass activation and upstream signaling controls; Methods,
    rescue experiments
- annotation_index: 23
  source_annotation:
    term:
      id: GO:0033632
      label: regulation of cell-cell adhesion mediated by integrin
    evidence_type: IDA
    original_reference_id: PMID:19234463
    qualifier: involved_in
  review:
    summary: Kindlin-3 regulates integrin-mediated adhesive contacts in leukocytes.
    action: KEEP_AS_NON_CORE
    reason: Human LAD-III cells in PMID:19234463 lose kindlin-3 and show poor LFA-1-mediated attachment to ICAM-1;
      mouse EGFP-KINDLIN3 restores contact area and migration in the human recipient cells. The assay uses immobilized
      ICAM-1 rather than a second living cell. Independent human leukocyte aggregation in PMID:19234460 Figure 2B,C
      supports the gene-level cell-cell adhesion context. Retain this regulation as non-core downstream coverage
      of integrin activation, with both assay boundaries explicit.
    supported_by:
    - reference_id: PMID:19234463
    - reference_id: PMID:19234460
    additional_reference_ids:
    - PMID:19234460
  methods:
  - Interference-reflection microscopy of ICAM-1 contacts
  - Cross-species complementation
  - Independent human leukocyte aggregation
  primary_locators:
  - PMID:19234463 Figure 4A; Methods, Interference reflection microscopy and construct species; PMID:19234460 Figure
    2B,C
- annotation_index: 25
  source_annotation:
    term:
      id: GO:0034446
      label: substrate adhesion-dependent cell spreading
    evidence_type: IMP
    original_reference_id: PMID:19234460
    qualifier: involved_in
  review:
    summary: Kindlin-3 supports spreading after adhesion to integrin substrates.
    action: KEEP_AS_NON_CORE
    reason: PMID:19234460 directly reports impaired spreading of human platelets and patient-derived cells, and
      rescue of adherent contacts, ruffling and spreading after KINDLIN3 expression. Figures 1B and 4C–F support
      this morphological process. Retain it as a positive cellular output of the integrin-associated machinery,
      without treating deficient spreading alone as evidence for a new enzymatic or cytoskeletal motor activity.
    supported_by:
    - reference_id: PMID:19234460
  methods:
  - Adhesion-dependent spreading microscopy
  - KINDLIN3 rescue and knockdown
  - TIRF localization at substrate contacts
  primary_locators:
  - PMID:19234460 Figures 1B and 4C–F; Results, rescue experiments; Methods, Cell lines and kindlin rescue experiments
- annotation_index: 26
  source_annotation:
    term:
      id: GO:0070062
      label: extracellular exosome
    evidence_type: HDA
    original_reference_id: PMID:20458337
    qualifier: located_in
  review:
    summary: FERMT3 detection in the reported B-cell exosome preparation remains unverified.
    action: UNDECIDED
    reason: The actual author-posted PMID:20458337 Methods and Results describe human RN B-cell exosome purification
      and identify 539 proteins in Supplementary Table 1. The exact FERMT3/Q86UX7 entry could not be recovered because
      the published workbook remained inaccessible. Broad membrane association does not independently establish
      membership in these exosomes. Preserve uncertainty and defer to the original curator rather than infer a false
      positive. Total-exosome detection would also not by itself establish membership in the smaller MHC-II-associated
      subset or a role in exosome biogenesis.
    supported_by:
    - reference_id: PMID:20458337
  methods:
  - Author-posted original exosome-proteomics Methods/Results
  - Bounded unsuccessful exact supplement retrieval
  primary_locators:
  - PMID:20458337 Results, Identification of exosomal proteins and Supplementary Table 1 pointer; Methods, Cell
    culture/exosome isolation and MS data analysis; Table 1 is the distinct MHC-II-associated subset
  published_target_join_verified: false
- annotation_index: 27
  source_annotation:
    term:
      id: GO:0070527
      label: platelet aggregation
    evidence_type: HMP
    original_reference_id: PMID:23382103
    qualifier: involved_in
  review:
    summary: Kindlin-3 contributes to the integrin-dependent platelet aggregation context.
    action: KEEP_AS_NON_CORE
    reason: The original PMID:23382103 Table I identifies URP2_HUMAN/Kindlin-3 (spot 6) among several proteins reduced
      in MDS platelets; Figure 8 measures aggregation defects. The study does not selectively perturb FERMT3, and
      its FRET assay measures talin-1 rather than kindlin-3. Keep the positive platelet role as non-core contextual
      evidence, corroborated by the human FERMT3-deficiency and platelet activation/aggregation measurements in
      PMID:19234460 Figure 1. This does not assign the MDS phenotype uniquely to kindlin-3 or prove a natural isoform
      effect.
    supported_by:
    - reference_id: PMID:23382103
    - reference_id: PMID:19234460
    additional_reference_ids:
    - PMID:19234460
  methods:
  - Human platelet comparative proteomics
  - Aggregation and receptor-activation assays
  - Independent FERMT3 patient phenotype
  primary_locators:
  - PMID:23382103 Table I spot 6; Results and Figures 5–8; Methods, protein identification and aggregometry; PMID:19234460
    Figure 1
