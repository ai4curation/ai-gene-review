- id: PMID:42647630
  title: The molecular basis of mitochondrial crista formation by the MIC10 complex.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: The current structural model of the MIC10 subcomplex, and the only source making any
      cardiolipin-recruitment claim about MIC26 itself. Graded LOW_QUALITY not because the work is poor
      - it is careful and explicit about its limits - but because the evidence class is AlphaFold 3 models
      plus coarse-grained and all-atom molecular dynamics, with no experimental measurement. Cited here
      to define a knowledge gap and to justify NOT annotating cardiolipin binding on APOO. Human sequences
      were used (Mic26 residues numbered to 198, Mic27 to 268). Missed by the affinage record.
- id: file:human/APOO/APOO-bioinformatics/RESULTS.md
  title: APOO / MIC26 (Q9BUR5) - N-terminal targeting sequence and paralogue architecture
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'This review''s own analysis, reproducible from genes/human/APOO/APOO-bioinformatics/targeting_sequence_analysis.py
