  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Adipocyte-specific Apoo knockout mouse: impaired oxidative phosphorylation and brown
      adipose whitening. Real physiology, but mouse and tissue-specific, and downstream of the cristae
      defect; cited as context and in a knowledge gap, not annotated on the human gene. Cached abstract
