description: 'APOO encodes MIC26 (also called MIC23), a 22 kDa subunit of the mitochondrial contact site
  and cristae organising system (MICOS), the inner-membrane protein complex that builds and maintains
  crista junctions - the narrow tubular necks connecting each crista to the inner boundary membrane. MIC26
  is an integral inner-membrane protein that belongs, with its paralogue MIC27, with MIC10 and with MIC13,
  to the MIC10 subcomplex of MICOS; the other subcomplex is built around MIC60, which reaches across the
  intermembrane space to SAMM50 and the metaxins in the outer membrane so that MICOS forms the core of
  the ~2 MDa mitochondrial intermembrane space bridging (MIB) complex. MIC26 and MIC27 are confined to
  opisthokonts and are the most recently acquired MICOS subunits; they add onto an otherwise complete
  complex late in assembly, and neither is needed for the stability or incorporation of the other subunits.
  Loss of MIC26 is nonetheless not silent: crista junction number falls, the mitochondrial network fragments,
  and cellular cardiolipin drops, while loss of both MIC26 and MIC27 collapses cristae into concentric
  onion-like whorls and destabilises respiratory chain supercomplexes and the F1Fo-ATP synthase, a defect
  that restoring cardiolipin reverses. The two paralogues also set each other''s abundance post-transcriptionally,
  so removing one raises the other. In humans, loss-of-function variants in the X-linked APOO gene cause
  mitochondrial disease through cristae disruption, presenting either as myopathy with lactic acidosis,
  cognitive impairment and autistic features or, for a C-terminal truncation, as a lethal progeria-like
  syndrome of infancy. Despite the gene name, which was given when a 55 kDa serum glycoprotein was attributed
  to this locus, MIC26 is not a circulating apolipoprotein: that species persists in APOO knockout cells
  and contains no MIC26 peptides, and the protein is found only in mitochondria.'
