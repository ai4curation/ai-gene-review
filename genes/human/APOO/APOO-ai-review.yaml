- id: file:human/APOO/APOO-deep-research-affinage.md
  title: Affinage mechanistic annotation for APOO (human)
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: 'Machine-generated deep research (Affinage, LLM-authored). Trust gates clear and self_evaluation_pairwise
      ''win''; the narrative is about the right protein, with no symbol collision, and it correctly leads
      with the 2023 refutation of the secreted isoform, which is the most important fact for this gene''s
      annotations. Graded LOW_QUALITY for two defects: it cites PMID:26217776 twice for MIC26 content
      when that identifier resolves to an unrelated K63-ubiquitination Data Brief (the intended paper
      is PMID:26217777), and its citation list omits five references this review needed - PMID:23704930,
