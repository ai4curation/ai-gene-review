- term:
    id: GO:1900208
    label: regulation of cardiolipin metabolic process
  evidence_type: IMP
  original_reference_id: PMID:32788226
  review:
    summary: 'Mass-spectrometric lipidomics of CRISPR knockout human HAP1 cells shows that cellular cardiolipin
      falls significantly when MIC26 alone is deleted, and also in the MIC26/MIC27 double knockout, while
      MIC27 single knockout leaves it normal. The reduction affects all cardiolipin molecular species
      rather than a subset, so it reflects the amount of cardiolipin rather than a remodelling defect.
      That cardiolipin pool is functionally consequential: restoring it by overexpressing cardiolipin
      synthase rescues respiratory chain supercomplex stability in the double knockout. An independent
      link had already been noted, MIC26 levels correlating with those of tafazzin, the cardiolipin-remodelling
      acyltransferase (PMID:25764979).'
    action: NEW
    reason: 'A cardiolipin phenotype that is specific to MIC26 among the two paralogues, measured in a
      human single-gene knockout, and shown to be causally upstream of the OXPHOS defect by a synthase-overexpression
      rescue. The obvious objection - that low cardiolipin is a passive consequence of disrupted cristae
      - is answered inside the same experiment: the MIC27 single knockout also loses crista junctions,
      yet its cardiolipin is normal. Crista junction loss therefore does not by itself lower cardiolipin,
      and the MIC26 requirement is separable from the architectural phenotype. GO:1900208 is used rather
      than the positive-regulation child because reduced steady-state cardiolipin does not by itself distinguish
      decreased synthesis from increased turnover, and the study does not resolve which. This is deliberately
      NOT annotated as GO:1901612 cardiolipin binding: direct cardiolipin binding has been demonstrated
      in vitro for the paralogue APOOL/MIC27 (PMID:23704930), not for MIC26, and the only claim of cardiolipin
      recruitment by MIC26 itself comes from coarse-grained molecular dynamics on an AlphaFold model (PMID:42647630).'
    supported_by:
