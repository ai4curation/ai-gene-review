suggested_experiments:
- hypothesis: MIC26 binds cardiolipin directly through the basic loop between its transmembrane segments,
    and that binding is what maintains the cellular cardiolipin pool.
  description: Express and purify recombinant human MIC26 and MIC27 in detergent, and assay cardiolipin
    binding by liposome flotation and native mass spectrometry against phosphatidylglycerol and phosphatidylcholine
    controls, replicating the MIC27 result as the positive control in the same hands. Then charge-reverse
    the basic loop residues predicted to contact cardiolipin, and test whether the mutant (i) loses lipid
    binding in vitro and (ii) fails to restore cardiolipin levels and crista junction number when re-expressed
    in MIC26 knockout HAP1 cells. A mutant that separates the two would show the cardiolipin phenotype
    is not simply a consequence of disrupted cristae.
  experiment_type: in vitro lipid binding plus structure-guided mutagenesis rescue
- hypothesis: Residues 1-25 of MIC26 are a mitochondrial targeting presequence, not a secretory signal
    peptide, and are removed during import.
  description: Immunopurify MIC26 from human mitochondria and determine its N terminus by N-terminal-oriented
    proteomics (TMPP or TAILS labelling), comparing the mature N terminus with the predicted 1-25 boundary.
    In parallel, import radiolabelled MIC26 into isolated mitochondria with and without membrane potential
    and with MPP inhibition, and test whether the precursor is processed. Substituting the MIC26 N-terminal
    segment for that of a canonical presequence protein, and vice versa, would test sufficiency.
  experiment_type: N-terminomics plus in vitro mitochondrial import
- hypothesis: MIC26 spans the inner membrane twice, with both amphipathic helices facing the intermembrane
    space.
  description: Map MIC26 topology by protease protection of intact mitochondria versus mitoplasts versus
    solubilised membranes, using epitope tags at the N terminus, the C terminus and the inter-helix loop,
    combined with cysteine-accessibility scanning using membrane-permeant and membrane-impermeant maleimides
    on single-cysteine variants in a cysteine-free background.
  experiment_type: membrane topology mapping
- hypothesis: The fragmented network of MIC26 knockout cells reflects an increased fission rate rather
    than a passive consequence of disordered cristae.
  description: 'Measure fission and fusion events directly in MIC26 knockout, MIC27 knockout and double
    knockout HAP1 cells by live-cell imaging of matrix-targeted photoactivatable GFP and by scoring DRP1
    puncta at constriction sites, with MIC26 re-expression as the specificity control. Then test epistasis
    by deleting DNM1L in the MIC26 knockout background: if fragmentation is fission-driven it should be
    abolished, whereas cristae disorder should persist.'
  experiment_type: live-cell mitochondrial dynamics with epistasis
- hypothesis: Cardiolipin falls in MIC26 knockout cells because synthesis decreases, not because turnover
    increases.
  description: Perform pulse-chase lipidomics with stable-isotope-labelled precursors in wild-type and
    MIC26 knockout cells to separate the synthesis and degradation arms, measuring CRLS1, PTPMT1, TAZ
    and PLA2 activities and levels alongside. Re-expression of MIC26 should restore whichever arm is affected.
  experiment_type: stable-isotope pulse-chase lipidomics
