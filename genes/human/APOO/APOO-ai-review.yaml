    reason: A single projection over a co-migrating assembly, applied to a protein in the wrong membrane.
      GO:0001401 is defined as 'A large complex of the mitochondrial outer membrane'; MIC26 is a single-pass
      INNER-membrane protein whose only transmembrane helix is annotated at residues 108-128 and which
      interacts with the inner-membrane subunits MIC60, MIC27 and MIC10. The genuine relationship between
      MIC26 and SAMM50/MTX1/MTX2 is bridging across the intermembrane space, and that is exactly what
      GO:0140275 MIB complex says - a term this same reference already supplies for this gene. Nothing
      is lost by removing the SAM row and a false compartment claim is.
