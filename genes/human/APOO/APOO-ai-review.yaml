- term:
    id: GO:0001401
    label: SAM complex
  evidence_type: HDA
  original_reference_id: PMID:26477565
  qualifier: part_of
  review:
    summary: MIC26 is assigned to the sorting and assembly machinery complex of the mitochondrial OUTER
      membrane on the basis of one complexome profile. Querying QuickGO by this reference and this term
      returns 12 entities - MIC10, MIC13, MIC19, MIC25, MIC26, MIC27, MIC60, SAMM50, MTX1, MTX2, MTX3
      and HSPA9 - which is the whole MIB complex, not the SAM complex. Everything that co-migrated received
      the SAM term.
