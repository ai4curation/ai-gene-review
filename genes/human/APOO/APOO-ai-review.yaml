    supporting_text: 'The proteins of the MICOS complex include two subcomplexes: MIC60/MIC25/MIC19 and
      MIC10/MIC26/MIC27 which are bridged by MIC13'
  - reference_id: PMID:32788226
    supporting_text: we found that MIC26 and MIC27 are dispensable for the stability and integration of
      the remaining MICOS subunits into the complex suggesting that they assemble late into the MICOS
      complex
knowledge_gaps:
- gap_statement: MIC26 has no demonstrated molecular activity of its own. No biochemical assay has been
    performed on purified MIC26, so it is undetermined whether it contributes to crista junction formation
    by deforming the bilayer through its amphipathic helices, by binding a lipid, or purely as a scaffold
    that positions MIC10 and MIC27 - and consequently whether the membrane-bending activity of the MIC10
    subcomplex requires MIC26 or merely tolerates it. The one positive result on that question, that a
    Mic10-Mic26 dimer bends the bilayer, is coarse-grained molecular dynamics on an AlphaFold 3 model,
    with no measurement behind it.
  boundary: 'Firmly established: MIC26 is an integral inner-membrane protein, a constituent of the MIC10
    subcomplex of MICOS, physically associated with MIC60, MIC27 and MIC10; its deletion in human cells
    significantly reduces crista junction number; and both known human pathogenic variants disrupt cristae.
    What is missing is the step between membership and phenotype.'
