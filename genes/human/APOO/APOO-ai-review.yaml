    label: extracellular region
  evidence_type: EXP
  original_reference_id: PMID:16956892
  qualifier: located_in
  review:
    summary: The original 2006 characterisation of 'apolipoprotein O' as a secreted chondroitin sulfate
      proteoglycan recovered from HDL, LDL and VLDL, and promoting cholesterol efflux from macrophages.
      Every one of those observations was read from a 55 kDa immunoreactive band, against a recombinant
      protein of 22 kDa.
    action: REMOVE
    reason: 'This row traces to the 55 kDa glycosylated species that was assigned to MIC26 before knockout
      controls existed. PMID:37279200, from the same laboratory that reported the three-form model, showed
      that species is not MIC26: it is unchanged by three independent siRNAs, unchanged by CRISPR knockout
      in HEK293, HepG2, HeLa and HAP1 cells, not generated by GFP- or myc-tagged MIC26, unaffected by
      mutagenesis of the predicted glycosylation sites, and devoid of MIC26 peptides when the 47-63 kDa
      gel region is excised and sequenced. With the 55 kDa band gone, nothing supports a secretory-pathway
      pool of MIC26. The independent checks all point the same way: MIC26 is absent from HDL proteomes
      in which the major apolipoproteins are detected, and this review''s own sequence analysis finds
      that the N-terminal segment UniProt calls a SIGNAL peptide (ECO:0000255, prediction only) lacks
      the hydrophobic core that every member of a ten-protein secretory control panel has, while matching
      mitochondrial presequences in charge and amphipathicity - the paralogue MIC27''s equivalent N-terminus
      is annotated by UniProt as a TRANSIT peptide. The 2006 paper remains a valid record of a 55 kDa
      serum proteoglycan; what has failed is its assignment to this gene. The machine-generated deep research
      record is listed as an additional reference because it is what first pointed to PMID:37279200; nothing
      here is supported by a sentence from it, and every claim is quoted from the primary papers or from
      UniProt.'
