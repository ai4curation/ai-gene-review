  title: ApoO, a novel apolipoprotein, is an original glycoprotein up-regulated by diabetes in human heart.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'The paper that named APOO, and the origin of every secretory annotation on this gene.
      Correctly cited and historically important, but its central protein assignment has been overturned:
      the 55 kDa immunoreactive species on which the secretion, glycosylation, lipoprotein-association
