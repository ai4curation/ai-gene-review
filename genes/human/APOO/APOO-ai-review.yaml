core_functions:
- description: Structural subunit of the MICOS complex at the crista junction. MIC26 is an integral protein
    of the mitochondrial inner membrane and a member of the MIC10 subcomplex of MICOS (MIC10, MIC13, MIC26,
    MIC27), which is bridged to the MIC60/MIC19/MIC25 subcomplex by MIC13 and is the part of the complex
    that shapes the high-curvature neck of each crista. MIC26 physically associates with MIC60, MIC27
    and MIC10, is recovered in the MICOS and MIB assemblies by complexome profiling and by radiolabelled
    import into isolated mitochondria, and is degraded when the complex disassembles. It adds late onto
    an otherwise complete MICOS and is not required for the stability or incorporation of the other subunits,
    so its contribution is architectural rather than assembly-critical - yet it is a real contribution,
    because deleting MIC26 alone in human cells significantly reduces crista junction number, deleting
    MIC26 and MIC27 together collapses cristae into concentric whorls, and both known human pathogenic
    variants disrupt cristae, one by failing to insert into the inner membrane and one by destabilising
    the protein while leaving its localisation and complex binding intact. No complex-level molecular
    function is asserted alongside the structural one. The obvious candidate would be the membrane-bending
    activity of the MIC10 subcomplex, but the only evidence that MIC26 contributes to it is coarse-grained
    molecular dynamics on an AlphaFold 3 model of a Mic10-Mic26 dimer - the same evidence class this review
    rules insufficient for cardiolipin binding, so it is recorded as a knowledge gap rather than an annotation.
