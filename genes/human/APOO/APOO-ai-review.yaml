- id: PMID:37279200
  title: MIC26 and MIC27 are bona fide subunits of the MICOS complex in mitochondria and do not exist
    as glycosylated apolipoproteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The paper that settles this gene''s central ambiguity, and the basis for eight REMOVE
      actions. Knockdown with three siRNAs, CRISPR knockout in four human cell lines, four independent
      antibodies, GFP- and myc-tagged constructs, glycosylation site mutagenesis and mass spectrometry
      of the excised 47-63 kDa gel region all agree that the 55 kDa species is not MIC26. Weight is increased,
      not reduced, by the authorship: Anand and Reichert are authors of the 2015 paper whose three-form
      model this withdraws. Full text available and read in full.'
- id: PMID:37649161
  title: A X-linked nonsense APOO/MIC26 variant causes a lethal mitochondrial disease with progeria-like
    phenotypes.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Second pathogenic APOO variant, the C-terminal nonsense E178*. Useful because the residual
      mutant protein still reaches mitochondria and still binds MICOS subunits yet cannot restore cristae
      - separating localisation and complex membership from function. Cached abstract only.
- id: PMID:37995600
  title: Macrophage-specific deletion of MIC26 (APOO) mitigates advanced atherosclerosis by increasing
