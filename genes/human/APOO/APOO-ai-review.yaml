      partner identities are not lost, because each stays in its row''s supporting_entities and the interactions
      themselves are recorded as complex membership by the GO:0061617 rows. Second, the evidence code
      has to change with the term: IPI belongs to the binding itself, whereas structural molecule activity
      inferred from co-immunoprecipitation with the rest of the complex is IC - or IDA if taken from the
