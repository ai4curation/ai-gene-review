- description: Maintenance of the mitochondrial cardiolipin pool, and through it of OXPHOS complex integrity.
    Cardiolipin is the signature phospholipid of the inner membrane and is required to stabilise respiratory
    chain supercomplexes. Deleting MIC26 alone in human cells significantly lowers total cardiolipin,
    and does so across all cardiolipin molecular species rather than a subset - so it is the size of the
    pool that changes, not its acyl-chain composition - whereas deleting MIC27 alone does not; deleting
    both lowers cardiolipin further and destabilises respiratory chain supercomplexes and the F1Fo-ATP
    synthase, and overexpressing cardiolipin synthase in those double-knockout cells restores supercomplex
    stability, placing cardiolipin causally between the two. An earlier and independent link ran through
    tafazzin, the cardiolipin-remodelling acyltransferase, whose levels correlate with those of MIC26
    and MIC27. How MIC26 sets the cardiolipin level is not known; direct cardiolipin binding is demonstrated
    for the paralogue MIC27 and not for MIC26.
