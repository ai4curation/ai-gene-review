- id: PMID:25997101
  title: QIL1 is a novel mitochondrial protein required for MICOS complex stability and cristae morphology.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The QIL1/MIC13 paper. Its relevance to APOO is that MIC26 appears in systematic human
