- id: PMID:25764979
  title: The non-glycosylated isoform of MIC26 is a constituent of the mammalian MICOS complex and promotes
    formation of crista junctions.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'The single most heavily used reference on this gene, supplying nine GOA rows. Its mitochondrial
      conclusions - inner-membrane MIC26 as a MICOS subunit interacting with MIC60, MIC27 and MIC10, and
      required for crista junction number - are accepted in full. Its three-form model is not: the glycosylated/secreted
