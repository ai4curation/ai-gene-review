- id: file:human/APOO/APOO-uniprot.txt
  title: UniProtKB entry Q9BUR5 (MIC26_HUMAN)
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'The fetched Q9BUR5 record; accession asserted to be the expected protein (MIC26_HUMAN,
