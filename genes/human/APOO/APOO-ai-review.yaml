- id: PMID:32439808
  title: Mutation in the MICOS subunit gene APOO (MIC26) associated with an X-linked recessive mitochondrial
    myopathy, lactic acidosis, cognitive impairment and autistic features.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The first pathogenic APOO variant, I117T, with patient fibroblasts plus yeast and Drosophila
      models. Supplies human loss-of-function evidence for cristae junction disruption, and is also the
      experimental basis of the Drosophila IMP that seeds one side of the MICOS-complex IBD. Full text
      available and read.
- id: PMID:32788226
  title: MIC26 and MIC27 cooperate to regulate cardiolipin levels and the landscape of OXPHOS complexes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The decisive functional study: CRISPR single and double knockouts of MIC26 and MIC27
      in human HAP1 cells, with crista junction counts, complexome profiling, respiration, mitochondrial
      morphology and cardiolipin lipidomics side by side. It is what separates MIC26''s own contribution
      from MIC27''s and from the complex''s, and it supplies the single NEW annotation proposed here.
      Full text available and read.'
- id: PMID:34800366
  title: Quantitative high-confidence human mitochondrial proteome and its dynamics in cellular context.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: MitoCoP, the high-confidence human mitochondrial proteome. Supports mitochondrial localisation
      with explicit contaminant discrimination, which is why it is graded above a bare proteomic detection,
      but it says nothing about function.
- id: PMID:37088120
  title: Loss of APOO (MIC26) aggravates obesity-related whitening of brown adipose tissue via PPARα-mediated
