proposed_new_terms:
- &id005
  proposed_name: structural constituent of MICOS complex
  proposed_definition: The action of a molecule that contributes to the structural integrity of the mitochondrial
    contact site and cristae organizing system (MICOS) complex, the inner mitochondrial membrane complex
    that shapes and maintains crista junctions.
  justification: 'GO:0005198 structural molecule activity is currently the only molecular function assignable
    to MIC26, and it is uninformative: every structural subunit of every complex in the ontology receives
    the same term. GO already provides complex-specific children of this pattern - structural constituent
    of ribosome, of chromatin, of cytoskeleton, of proteasome, of synapse - and MICOS, with seven mammalian
    subunits of which at least two (MIC26 and MIC27) have no demonstrated activity beyond a structural
    contribution, is the same situation. A MICOS-specific child would let the MF slot carry the information
    that currently exists only in the CC slot.'
  proposed_parent:
    id: GO:0005198
    label: structural molecule activity
  supported_by:
