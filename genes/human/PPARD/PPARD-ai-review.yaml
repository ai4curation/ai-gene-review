id: Q03181
gene_symbol: PPARD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PPARD encodes the broadly expressed lipid-activated nuclear receptor PPAR-delta, an RXR-heterodimeric
  transcription factor that binds PPAR response elements in nuclear regulatory DNA. It controls transcriptional
  programs for fatty-acid oxidation, energy expenditure, metabolic adaptation, and cell-type-specific proliferative,
  apoptotic, implantation and tissue-remodeling responses.
