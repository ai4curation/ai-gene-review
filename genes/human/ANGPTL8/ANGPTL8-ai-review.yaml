  title: ANGPTL8 binds ANGPTL3
  findings: []
- id: PMID:23150577
  title: Atypical angiopoietin-like protein that regulates ANGPTL3.
  findings:
  - statement: ANGPTL8 coexpression with ANGPTL3 causes hypertriglyceridemia.
    supporting_text: Plasma TAG level did not change in mice expressing ANGPTL3 alone, whereas coexpression
      with ANGPTL8 resulted in hypertriglyceridemia, despite a reduction in circulating ANGPTL3.
  - statement: ANGPTL8 increases N-terminal ANGPTL3 release.
    supporting_text: In cultured hepatocytes, ANGPTL8 expression increased the appearance of N-terminal
      ANGPTL3 in the medium, suggesting ANGPTL8 may activate ANGPTL3.
  - statement: ANGPTL8 needs ANGPTL3 to raise triglycerides.
    supporting_text: Consistent with this scenario, expression of ANGPTL8 in Angptl3(-/-) mice failed
      to promote hypertriglyceridemia.
  - statement: ANGPTL8 circulates in human plasma.
    supporting_text: ANGPTL8 is expressed in liver and adipose tissue, and circulates in plasma of humans.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Identification of ANGPTL8 as an ANGPTL3 regulator. Not the retracted betatrophin
      paper (PMID:23623304).
- id: PMID:28413163
  title: ANGPTL8 requires ANGPTL3 to inhibit lipoprotein lipase and plasma triglyceride clearance.
  findings:
  - statement: ANGPTL8 has a functional LPL inhibitory motif, active only with ANGPTL3.
    supporting_text: ANGPTL8 has a functional LPL inhibitory motif, but only inhibits LPL and increases
      plasma TG levels in mice in the presence of ANGPTL3
  - statement: The complex's inhibitory activity mainly derives from ANGPTL8.
    supporting_text: suggesting the major inhibitory activity of this complex derives from ANGPTL8
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
- id: PMID:29031715
  title: ANGPTL8 promotes the ability of ANGPTL3 to bind and inhibit lipoprotein lipase.
  findings:
  - statement: ANGPTL3-ANGPTL8 complexes inhibit LPL much more than either alone.
    supporting_text: Importantly, ANGPTL3-ANGPTL8 complexes had a dramatically increased ability to inhibit
      LPL compared to either protein alone.
  - statement: ANGPTL8 increases ANGPTL3 binding to LPL.
    supporting_text: Protein interaction assays showed that ANGPTL8 greatly increased the ability of ANGPTL3
      to bind LPL.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text.
- id: PMID:32730227
  title: ANGPTL8 has both endocrine and autocrine effects on substrate utilization.
  findings:
  - statement: Hepatic ANGPTL8 acts endocrinally; adipose ANGPTL8 acts locally on ANGPTL4.
    supporting_text: Thus, hepatic A8 (with A3) acts in an endocrine fashion to inhibit intravascular
      LPL in oxidative tissues, whereas A8 in adipose tissue enhances LPL activity by autocrine/paracrine
      inhibition of A4.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Tissue-specific knockouts.
- id: PMID:31388006
  title: Angptl8 mediates food-driven resetting of hepatic circadian clock in mice.
  findings:
  - statement: ANGPTL8 resets the liver clock via the membrane receptor PirB.
    supporting_text: Mechanistically, the resetting function of Angptl8 is dependent on the signal relay
      of the membrane receptor PirB, phosphorylation of kinases and transcriptional factors, and consequently
      transient activation of the central clock gene Per1.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. Mouse liver clock entrainment.
- id: PMID:35851270
  title: ANGPTL8 is a negative regulator in pathological cardiac hypertrophy.
  findings:
  - statement: ANGPTL8 binds LILRB3 (PIRB).
    supporting_text: Moreover, we demonstrated that ANGPTL8 directly bound to the paired Ig-like receptor
      PIRB (LILRB3) by RNA-seq and immunoprecipitation-mass screening.
  reference_review:
    relevance: MEDIUM
    review_notes: 'Full text. Cardiac hypertrophy models. A 2025 erratum (PMID:40480993) corrects duplicated
      images: DAPI panels in Fig. 1F and beta-MHC bands in Figs. 4I and 7G. The authors state the conclusions
      are unchanged. The LILRB3 binding result cited here is not among the corrected figures. Correctness
      is left unset because image-duplication corrections are a soundness concern that VERIFIED would
      hide; the row it supports also rests on PMID:31388006 and PMID:39095838.'
- id: PMID:39095838
  title: Inhibition of ANGPTL8 protects against diabetes-associated cognitive dysfunction by reducing
    synaptic loss via the PirB signaling pathway.
  findings:
  - statement: PirB knockout mice resist ANGPTL8-induced neuroinflammation.
    supporting_text: In vivo, PirB-/- mice exhibited resistance to ANGPTL8-induced neuroinflammation and
      synaptic damage.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. Diabetic cognitive dysfunction; PirB knockout mice.
- id: PMID:27117576
  title: The Arg59Trp variant in ANGPTL8 (betatrophin) is associated with total and HDL-cholesterol in
    American Indians and Mexican Americans and differentially affects cleavage of ANGPTL3.
  findings:
  - statement: The ANGPTL8 R59W variant is associated with more cleaved ANGPTL3.
    supporting_text: The variant allele was associated with increased levels of cleaved ANGPTL3.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text. Human genetic association; corroborates the ANGPTL3-processing row.
- id: PMID:25417115
  title: ANGPTL8/betatrophin does not control pancreatic beta cell expansion.
  findings:
  - statement: ANGPTL8 does not control beta cell expansion.
    supporting_text: ANGPTL8/betatrophin does not control pancreatic beta cell expansion.
  - statement: Angptl8 knockouts have low triglycerides but normal glucose homeostasis.
    supporting_text: revealed profound reduction of triglyceride levels, but no abnormalities in glucose
      homeostasis
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Refutes the betatrophin hypothesis; source of the NOT annotation.
