- id: file:genes/human/ANGPTL8/ANGPTL8-deep-research-affinage.md
  title: Affinage mechanistic annotation for ANGPTL8 (human)
  findings: []
  reference_review:
    relevance: MEDIUM
    review_notes: Trust gates clear. Its LPL/ANGPTL3/ANGPTL4 narrative matches the primary papers used
      here, and it correctly states that ANGPTL8 does not control beta cell proliferation. Its PirB/LILRB2/LILRB3
