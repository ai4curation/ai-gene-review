      triglycerides [PMID:23150577 "Plasma TAG level did not change in mice expressing ANGPTL3 alone,
      whereas coexpression with ANGPTL8 resulted in hypertriglyceridemia, despite a reduction in circulating
      ANGPTL3."]. Without ANGPTL3, ANGPTL8 cannot raise triglycerides [PMID:23150577 "Consistent with
      this scenario, expression of ANGPTL8 in Angptl3(-/-) mice failed to promote hypertriglyceridemia."];
      Angptl8 knockout mice have markedly lower triglycerides [PMID:25417115 "revealed profound reduction
      of triglyceride levels, but no abnormalities in glucose homeostasis"].
