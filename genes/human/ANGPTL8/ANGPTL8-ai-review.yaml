id: Q6UXH0
gene_symbol: ANGPTL8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANGPTL8 (angiopoietin-like 8, also called lipasin or RIFL, and formerly betatrophin) is a
  small secreted protein made by liver and adipose tissue whose expression rises with feeding. It is an
  atypical angiopoietin-like protein that lacks a fibrinogen-like domain. ANGPTL8 binds ANGPTL3, and the
  complex inhibits lipoprotein lipase far more potently than either protein alone, with the inhibitory
  motif in the ANGPTL8 N-terminus. Liver-derived ANGPTL8 acts with ANGPTL3 to suppress lipoprotein lipase
  in heart and muscle, while adipose ANGPTL8 restrains ANGPTL4, so together they route dietary triglyceride
  to fat for storage after a meal. Mice lacking ANGPTL8 have low plasma triglycerides. In rodent studies,
  ANGPTL8 also signals through the PirB/LILRB family of receptors in liver, heart and brain. Despite the
  betatrophin name, ANGPTL8 does not control pancreatic beta cell proliferation.
