  original_reference_id: PMID:29031715
  qualifier: contributes_to
  review:
    summary: Proposed. ANGPTL8 supplies the LPL-inhibitory motif of the ANGPTL3-ANGPTL8 complex, which
      inhibits lipoprotein lipase.
    action: NEW
    reason: 'The ANGPTL3-ANGPTL8 complex is a far stronger LPL inhibitor than either protein alone [PMID:29031715
      "Importantly, ANGPTL3-ANGPTL8 complexes had a dramatically increased ability to inhibit LPL compared
      to either protein alone."]. ANGPTL8 does part of the work: it carries a functional LPL inhibitory
      motif [PMID:28413163 "ANGPTL8 has a functional LPL inhibitory motif, but only inhibits LPL and increases
      plasma TG levels in mice in the presence of ANGPTL3"], and the major inhibitory activity of the
      complex derives from it [PMID:28413163 "suggesting the major inhibitory activity of this complex
      derives from ANGPTL8"]. Because ANGPTL8 alone is inactive, contributes_to is the right qualifier.
      Comparator check: ANGPTL3 and ANGPTL4, the other LPL-inhibiting angiopoietin-like proteins, both
      carry GO:0055102 in GOA. No current ANGPTL8 annotation is an ancestor or descendant of this term.'
    supported_by:
    - reference_id: PMID:29031715
      supporting_text: Importantly, ANGPTL3-ANGPTL8 complexes had a dramatically increased ability to
        inhibit LPL compared to either protein alone.
    - reference_id: PMID:28413163
      supporting_text: ANGPTL8 has a functional LPL inhibitory motif, but only inhibits LPL and increases
        plasma TG levels in mice in the presence of ANGPTL3
    - reference_id: PMID:28413163
      supporting_text: suggesting the major inhibitory activity of this complex derives from ANGPTL8
    - reference_id: PMID:29031715
      supporting_text: Protein interaction assays showed that ANGPTL8 greatly increased the ability of
        ANGPTL3 to bind LPL.
