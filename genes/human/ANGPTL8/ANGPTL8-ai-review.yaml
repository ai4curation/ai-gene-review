  review:
    summary: Positive regulation of protein processing (IDA, acts_upstream_of_or_within). ANGPTL8 increases
      release of the N-terminal ANGPTL3 fragment; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: '[PMID:23150577 "In cultured hepatocytes, ANGPTL8 expression increased the appearance of N-terminal
      ANGPTL3 in the medium, suggesting ANGPTL8 may activate ANGPTL3."] In humans, the ANGPTL8 R59W variant
      is associated with more cleaved ANGPTL3 in plasma [PMID:27117576 "The variant allele was associated
      with increased levels of cleaved ANGPTL3."]. This is an effect on ANGPTL3 maturation that accompanies
      complex formation, not ANGPTL8''s main activity, which is LPL inhibition within the complex.'
