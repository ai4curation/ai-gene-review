suggested_questions:
- question: How do ANGPTL8's PirB/LILRB receptor effects relate to its LPL-inhibiting role with ANGPTL3?
    Does receptor binding need the same N-terminal motif or the ANGPTL3 complex?
- question: How does ANGPTL8 inhibit ANGPTL4 in adipose tissue while activating ANGPTL3 in the circulation?
    Does it form a distinct complex with each?
suggested_experiments:
- description: Map the ANGPTL8 N-terminal inhibitory motif by mutagenesis and test LPL inhibition by ANGPTL3-ANGPTL8
    and ANGPTL4-ANGPTL8 complexes with each mutant.
