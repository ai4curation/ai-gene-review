- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0005179
  review:
    summary: Signal transduction (IEA, inferred from hormone activity). ANGPTL8 does signal through the
      PirB/LILRB receptors in several tissues, but this is secondary to its LPL role; kept as non-core.
    action: KEEP_AS_NON_CORE
    reason: 'The mapping follows automatically from hormone activity, but independent groups support it:
      ANGPTL8 resets the liver clock through the membrane receptor PirB [PMID:31388006 "Mechanistically,
      the resetting function of Angptl8 is dependent on the signal relay of the membrane receptor PirB,
      phosphorylation of kinases and transcriptional factors, and consequently transient activation of
      the central clock gene Per1."], binds LILRB3 in cardiomyocytes [PMID:35851270 "Moreover, we demonstrated
      that ANGPTL8 directly bound to the paired Ig-like receptor PIRB (LILRB3) by RNA-seq and immunoprecipitation-mass
      screening."], and acts through PirB in the hippocampus [PMID:39095838 "In vivo, PirB-/- mice exhibited
      resistance to ANGPTL8-induced neuroinflammation and synaptic damage."]. These receptor effects are
      tissue- and disease-specific. ANGPTL8''s best-established physiological role remains LPL inhibition
      with ANGPTL3 [PMID:29031715 "Importantly, ANGPTL3-ANGPTL8 complexes had a dramatically increased
      ability to inhibit LPL compared to either protein alone."].'
    supported_by:
    - reference_id: PMID:31388006
      supporting_text: Mechanistically, the resetting function of Angptl8 is dependent on the signal relay
        of the membrane receptor PirB, phosphorylation of kinases and transcriptional factors, and consequently
        transient activation of the central clock gene Per1.
    - reference_id: PMID:35851270
      supporting_text: Moreover, we demonstrated that ANGPTL8 directly bound to the paired Ig-like receptor
        PIRB (LILRB3) by RNA-seq and immunoprecipitation-mass screening.
    - reference_id: PMID:39095838
      supporting_text: In vivo, PirB-/- mice exhibited resistance to ANGPTL8-induced neuroinflammation
        and synaptic damage.
    - reference_id: PMID:29031715
      supporting_text: Importantly, ANGPTL3-ANGPTL8 complexes had a dramatically increased ability to
        inhibit LPL compared to either protein alone.
