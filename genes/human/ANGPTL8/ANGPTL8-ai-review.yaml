      is single-study and is not used.
core_functions:
- description: Secreted partner of ANGPTL3 that supplies the inhibitory motif of the ANGPTL3-ANGPTL8 complex,
    inhibiting lipoprotein lipase to route postprandial triglyceride toward adipose storage. Hormone activity
    is the MF ANGPTL8 enables on its own, as a circulating hepatokine acting on distant tissues; lipase
    inhibition is the activity of the complex it contributes to.
