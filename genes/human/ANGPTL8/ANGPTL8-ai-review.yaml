  qualifier: involved_in
  negated: true
  review:
    summary: NOT type B pancreatic cell proliferation (IDA). The paper refutes the betatrophin hypothesis;
      the negated annotation is correct and accepted.
    action: ACCEPT
    reason: '[PMID:25417115 "ANGPTL8/betatrophin does not control pancreatic beta cell expansion."] Angptl8
      knockout mice have low triglycerides but normal glucose homeostasis [PMID:25417115 "revealed profound
      reduction of triglyceride levels, but no abnormalities in glucose homeostasis"]. The original betatrophin
      report was retracted (UniProt CAUTION, PMID:28038792), so the NOT annotation records the settled
      result.'
    supported_by:
    - reference_id: PMID:25417115
      supporting_text: ANGPTL8/betatrophin does not control pancreatic beta cell expansion.
