- term:
    id: GO:0000425
    label: pexophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: VPS15 contributes the conserved PI3KC3 execution complex to pexophagy.
    action: KEEP_AS_NON_CORE
    reason: The VPS15-node PTN000426471 assertion is supported by yeast experiments. Full 
      PMID:21121900 Fig. 4B directly tests VPS15 deletion alongside VPS30, ATG14 and 
      VPS38, linking complex I to peroxisome degradation. Human VPS15 preserves complex 
      organization and membrane-coupled VPS34 activation (PMID:39913640), providing the 
      required cofactor/scaffold work. Retain the conditional inherited process without 
      requiring cargo-recognition activity or an independent human experiment for each 
      conserved context.
    additional_reference_ids:
    - PMID:25490155
    - PMID:40442316
    - PMID:10625637
    supported_by:
    - reference_id: file:human/PIK3C3/PIK3C3-PMID21121900-primary-check.md
      supporting_text: Loss of the first three blocks peroxisomal thiolase degradation; 
        VPS38 deletion does not.
    - reference_id: PMID:39913640
      supporting_text: GTP binding functions in concert with the N-myristate to dock 
        PI3KC3-C1 onto membranes and orient and activate VPS34KD for PI3P production.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000426471
        source_label: PTN000426471
        source_status: SUPPORTS_TRANSFER
        comment: Direct yeast VPS15 loss blocks pexophagy in the tested 
          complex-I-dependent route. Conserved human scaffold/allosteric function supports
          transfer; no loss or incompatible mechanism has been demonstrated.
