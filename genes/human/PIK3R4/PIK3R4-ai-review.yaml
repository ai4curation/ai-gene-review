- term:
    id: GO:0071561
    label: nucleus-vacuole junction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: Focused adjudication confirms the yeast source but does not settle human 
      contact-site localization.
    action: UNDECIDED
    reason: Actual PTHR17583 version19 topology places human Q99570 leaf PTN002497817 
      below the GO:0071561 IBD at root PTN000426471; no loss event was recovered on this 
      path. Source PMID:23335340 observes a fraction of yeast Vps15-GFP near nuclear pores
      at NVJ edges. This grounds the ancestral inference, while conservation of the 
      specific human contact remains unresolved. The focused report supplies no target 
      loss or exclusion assay. Its assertion that humans lack vacuoles conflicts with 
      GO:0005764 lysosome is_a GO:0000323 lytic vacuole; the yeast Vac8/Nvj1 example in 
      GO:0071561 is not a universal scaffold requirement. Neither predominant endosomal 
      localization nor absent PIK3C3 annotation refutes this inherited conditional site. 
      Retain uncertainty after adjudication, without adding a NOT assertion.
    supported_by:
    - reference_id: PMID:23335340
      supporting_text: "colocalization of a fraction of Vps15-GFP and Vps34-GFP with nuclear
        pores at\nnucleus-vacuole (NV) junctions in live cells."
    - reference_id: 
        file:human/PIK3R4/PIK3R4-hypotheses/nucleus-vacuole-junction-and-nuclear-lysosomal-contacts/openscientist.md
      supporting_text: "absence of a curated human NVJ annotation is not absolute proof that
        human class\nIII PI3K never visits a nuclear-envelope contact site"
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000426471
        source_status: UNRESOLVED
        comment: The real v19 root-to-Q99570 path and literal root IBD were inspected, not
          inferred from donor count. SGD:S000000301 has independent IDA PMID:23335340. The
          provider did not reconstruct the tree or demonstrate human loss; human 
          contact-site conservation remains unresolved.
