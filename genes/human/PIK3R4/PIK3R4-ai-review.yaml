- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Human VPS15 has a GTP-binding regulatory pseudokinase domain rather than the 
      asserted protein-kinase activity.
    action: REMOVE
    reason: 'PMID:39913640 combines human PI3KC3-C1 structures with HPLC and mass spectrometry:
      bound GTP is detected, ATP/ADP are not, and the phosphate geometry plus altered P-loop
      prevent transfer to an external protein phosphoacceptor. This is direct target-specific
      mechanistic evidence against the legacy catalytic inference, not a rejection because scaffolding
      is the better-known function. The demonstrated allosteric control of VPS34 is retained.'
    additional_reference_ids:
    - PMID:8999962
    - PMID:40442316
    - file:human/PIK3R4/PIK3R4-uniprot.txt
    supported_by:
    - reference_id: PMID:39913640
      supporting_text: This structure rules out that VPS15 is a GTP-dependent protein 
        kinase.
    - reference_id: PMID:39913640
      supporting_text: This directly confirmed that the dominant nucleotide present was 
        GTP, with no detectable ATP or ADP.
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: PANTHER:PTN000426471
        source_label: PTN000426471
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Actual PTHR17583 v19 root PTN000426471 is ancestral to exact Q99570 leaf 
          PTN002497817, and its kinase IBD uses experimentally grounded yeast VPS15. No 
          loss is present in the cached PAINT path. Independent human PMID:39913640 
          structural/nucleotide evidence argues against the retained catalytic assertion 
          for this target; the phylogenetic review proposes a catalytic-function 
          correction without denying conserved scaffolding or every possible noncatalytic 
          process role.
      failure_modes:
      - PSEUDO_OR_SUBACTIVITY_LOSS
