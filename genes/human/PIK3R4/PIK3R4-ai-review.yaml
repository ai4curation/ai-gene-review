suggested_questions:
- question: Does endogenous human VPS15 occupy nuclear-envelope/lysosome contact sites 
    corresponding to the ancestral nucleus-vacuole junction assertion?
- question: Which selective-autophagy cargo contexts require VPS15-dependent PI3P 
    production, including pexophagy, and which operate through alternative 
    membrane-building routes?
- question: Which tissues or conditions support the inferred axonemal VPS15 pool, given 
    its demonstrated cis-Golgi localization in human fibroblasts?
- question: Which protein catalyzes the historical GST-p150/VPS34 preparation 
    protein-substrate reaction, and does disrupting VPS15 scaffold contacts while 
    retaining VPS34 integrity selectively alter that reaction?
suggested_experiments:
- description: Use PIK3R4 depletion and rescue mutants that disrupt VPS34 binding, 
    ATG14/BECN1 bridging, or membrane anchoring to measure PI3P production, WIPI2/DFCP1 
    recruitment, LC3 lipidation, and starvation-induced autophagic flux.
  experiment_type: PI3KC3-C1 autophagy initiation rescue assay
  hypothesis: PIK3R4 supports autophagosome assembly primarily by organizing PI3KC3-C1 and
    enabling local VPS34-dependent PI3P production.
- description: Separate ATG14-containing and UVRAG-containing PIK3R4 complexes by affinity
    purification or endogenous tagging, then compare lipid kinase activity, endosomal 
    localization, receptor degradation, and autophagosome maturation readouts.
  experiment_type: subcomplex-specific functional profiling
  hypothesis: PIK3R4 has separable C1 and C2 roles, with C1 biased toward autophagy 
    initiation and C2 biased toward endosomal trafficking and maturation.
- description: Mutate predicted catalytic/ATP-binding residues in the PIK3R4 kinase-like 
    domain while preserving PI3KC3 complex assembly, then assay autophosphorylation, PI3P 
    production, and autophagy/endosomal phenotypes.
  experiment_type: kinase-domain separation-of-function assay
  hypothesis: PIK3R4 kinase-domain chemistry, if present in cells, is secondary to its 
    structural/scaffolding role in PI3KC3 complexes.
