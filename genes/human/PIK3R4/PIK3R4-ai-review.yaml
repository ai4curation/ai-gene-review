- id: PMID:34121209
  title: Phosphoproteomic identification of ULK substrates reveals VPS15-dependent 
    ULK/VPS34 interplay in the regulation of autophagy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full relevant Results/Fig3-4 read after official retrieval. 
      ULK-dependent sites on human VPS15 and phosphorylation-site mutants regulate VPS34 
      lipid-kinase output. Discovery includes mouse Ulk1/2-deficient MEFs, followed by 
      human HEK293A VPS15 perturbation and human-sequence site assays. This establishes 
      VPS15 as a substrate/regulator, not absence of every possible structural 
      contribution to protein phosphorylation.
