- term:
    id: GO:0006623
    label: protein targeting to vacuole
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: PIK3R4 contributes to protein delivery through the endolysosomal system.
    action: ACCEPT
    reason: The class III PI3K complex organizes membrane traffic that delivers proteins 
      for lysosomal degradation. PMID:20643123 directly implicates the VPS15-containing 
      UVRAG complex in receptor degradation. GO vacuole is a broad eukaryotic compartment 
      and includes the lytic vacuole/lysosome lineage, so human lysosomes do not create a 
      taxon contradiction. This broad core trafficking claim does not imply that PIK3R4 is
      a cargo-recognition receptor.
    additional_reference_ids:
    - PMID:8999962
    - PMID:16467569
    supported_by:
