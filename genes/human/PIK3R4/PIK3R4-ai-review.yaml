- term:
    id: GO:0006622
    label: protein targeting to lysosome
  evidence_type: NAS
  original_reference_id: PMID:16467569
  qualifier: involved_in
  review:
    summary: PIK3R4 contributes to protein delivery through the endolysosomal system.
    action: ACCEPT
    reason: The class III PI3K complex organizes membrane traffic that delivers proteins 
      for lysosomal degradation. PMID:20643123 directly implicates the VPS15-containing 
      UVRAG complex in receptor degradation. GO vacuole is a broad eukaryotic compartment 
      and includes the lytic vacuole/lysosome lineage, so human lysosomes do not create a 
      taxon contradiction. This broad core trafficking claim does not imply that PIK3R4 is
      a cargo-recognition receptor.
    additional_reference_ids:
    - PMID:8999962
    - PMID:16467569
    supported_by:
    - reference_id: PMID:20643123
      supporting_text: a specific sub-complex containing VPS15, VPS34, Beclin 1, UVRAG and
        BIF-1 regulates both receptor degradation and cytokinesis
- term:
    id: GO:0010506
    label: regulation of autophagy
  evidence_type: IDA
  original_reference_id: PMID:16799551
  qualifier: involved_in
  review:
    summary: PIK3R4 regulates autophagy through class III PI3K complex activation.
    action: ACCEPT
    reason: A structural complex subunit can directly regulate a pathway. PMID:39913640 
      shows that the VPS15 nucleotide pocket and myristate control membrane docking and 
      VPS34 activation, with combined mutations strongly reducing autophagic flux. Thus 
      participation in autophagy does not displace the separately supported regulatory 
      relationship.
    additional_reference_ids:
    - PMID:10625637
    - PMID:16799551
    - PMID:19270696
    supported_by:
    - reference_id: PMID:39913640
      supporting_text: GTP binding functions in concert with the N-myristate to dock 
        PI3KC3-C1 onto membranes and orient and activate VPS34KD for PI3P production.
