id: Q99570
gene_symbol: PIK3R4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PIK3R4 encodes VPS15/p150, the regulatory scaffold of class III phosphatidylinositol 3-kinase
  complexes. Its GTP-binding pseudokinase domain and N-terminal myristate control membrane engagement
  and the conformation of the catalytic VPS34 subunit. VPS15 supports PI3P production in ATG14-containing
  complex I for autophagosome formation and in UVRAG-containing complex II for endosomal trafficking,
  receptor degradation and later autophagy-associated events. A cis-Golgi pool interacts with
  GM130 and contributes to IFT20-dependent trafficking toward the primary cilium.
