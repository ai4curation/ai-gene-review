- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: The VPS15 pseudokinase domain binds GTP.
    action: MODIFY
    reason: Human-complex cryo-EM, HPLC and mass spectrometry in PMID:39913640 directly 
      identify GTP in the VPS15 nucleotide pocket, with no detectable ATP or ADP. Arg103 
      confers guanine specificity and couples nucleotide occupancy to myristate-dependent 
      regulation of VPS34. Replace the legacy ATP-binding inference with the 
      experimentally demonstrated nucleotide.
    additional_reference_ids:
    - PMID:40442316
    - file:human/PIK3R4/PIK3R4-uniprot.txt
    supported_by:
    - reference_id: PMID:39913640
      supporting_text: VPS15PKD is an unusual pseudokinase that binds GTP instead of ATP.
    proposed_replacement_terms:
    - id: GO:0005525
      label: GTP binding
