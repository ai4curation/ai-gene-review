- term:
    id: GO:0004672
    label: protein kinase activity
  evidence_type: NAS
  original_reference_id: PMID:8999962
  qualifier: enables
  review:
    summary: Human VPS15 has a GTP-binding regulatory pseudokinase domain rather than the 
      asserted protein-kinase activity.
    action: REMOVE
    reason: 'PMID:39913640 combines human PI3KC3-C1 structures with HPLC and mass spectrometry:
      bound GTP is detected, ATP/ADP are not, and the phosphate geometry plus altered P-loop
      prevent transfer to an external protein phosphoacceptor. This is direct target-specific
      mechanistic evidence against the legacy catalytic inference, not a rejection because scaffolding
      is the better-known function. The demonstrated allosteric control of VPS34 is retained.'
    additional_reference_ids:
    - PMID:8999962
    - PMID:40442316
    - file:human/PIK3R4/PIK3R4-uniprot.txt
    supported_by:
    - reference_id: PMID:39913640
      supporting_text: This structure rules out that VPS15 is a GTP-dependent protein 
        kinase.
    - reference_id: PMID:39913640
      supporting_text: This directly confirmed that the dominant nucleotide present was 
        GTP, with no detectable ATP or ADP.
- term:
    id: GO:0006468
    label: protein phosphorylation
  evidence_type: NAS
  original_reference_id: PMID:8999962
  qualifier: involved_in
  review:
    summary: The focused report leaves VPS15 contribution to protein phosphorylation 
      unresolved.
    action: UNDECIDED
    reason: Full PMID:8999962 Table I establishes peptide/protein phosphorylation by an 
      Sf9-produced affinity-purified GST-p150/VPS34 preparation; this is distinct from 
      p150 being phosphorylated in Fig4 and from its stimulation of lipid kinase in Fig5. 
      The catalyst and a required VPS15 structural contribution were not isolated. Full 
      PMID:39913640 strongly disfavors intrinsic VPS15 phosphotransfer, while 
      PMID:34121209 establishes VPS15 as a ULK substrate regulating VPS34 lipid output. 
      Neither result excludes all noncatalytic participation in a protein-kinase reaction.
      Full PMID:40442316 supports physical FIP200/VPS15 contacts but does not show 
      VPS15-specific phosphorylation activation; adding PI3KC3-C1 did not enhance the 
      2:2:2 fraction in matched solution assays. The focused report admits key full-text 
      gaps, supplies no new subunit-resolved test, and its REMOVE/noncore alternatives are
      therefore not adopted automatically. Retain UNDECIDED after adjudication; a 
      substrate-only observation is insufficient for involvement, but an active scaffold 
      contribution could qualify if demonstrated.
    supported_by:
    - reference_id: PMID:39913640
      supporting_text: This structure rules out that VPS15 is a GTP-dependent protein 
        kinase.
    - reference_id: PMID:34121209
      supporting_text: VPS15 is phosphorylated at six sites by ULK and mutation of these 
        residues inhibits autophagy in cells and VPS34 lipid kinase activity in vitro.
    - reference_id: PMID:40442316
      supporting_text: Addition of PI3KC3-C1 did not lead to a further enhancement of the 
        2:2:2-to-2:1:1 ratio in solution
    - reference_id: 
        file:human/PIK3R4/PIK3R4-hypotheses/protein-phosphorylation-complex-contribution/openscientist.md
      supporting_text: 'Checked: abstract + seed description; unresolved.'
    additional_reference_ids:
    - PMID:8999962
    - file:human/PIK3R4/PIK3R4-notes.md
    - file:human/PIK3R4/PIK3R4-hypotheses/protein-phosphorylation-complex-contribution/openscientist.md
