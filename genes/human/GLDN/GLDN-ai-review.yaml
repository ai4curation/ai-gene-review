  label: Homo sapiens
description: Gliomedin is a Schwann-cell glycoprotein that links glial surfaces and perinodal extracellular
  matrix to axonal adhesion receptors. It is produced as a type-II membrane protein and released by proteolysis
  into extracellular assemblies. Its olfactomedin domain recognizes neurofascin and NrCAM. Together with
  glial NrCAM, gliomedin promotes sodium-channel clustering at developing heminodes; paranodal barriers
  provide a cooperating route to mature-node assembly. Gliomedin and NrCAM also support long-term nodal
  stability with overlapping contributions. Biallelic GLDN variants cause a severe inherited nodopathy
  associated with fetal akinesia and congenital contractures.
