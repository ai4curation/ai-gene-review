- id: PMID:37938170
  title: ATG9B is a tissue-specific homotrimeric lipid scramblase that can compensate for ATG9A.
  findings:
  - statement: ATG9B is a homotrimeric lipid scramblase.
    supporting_text: Consistent with the experimental structure and computational chemistry, we establish
      that ATG9B is a functional lipid scramblase.
  - statement: ATG9B compensates for ATG9A loss.
    supporting_text: We show that ATG9B can compensate for the absence of ATG9A in starvation-induced
      autophagy displaying similar subcellular trafficking and steady-state localization.
  - statement: ATG9B localizes to Golgi and endosomes.
    supporting_text: Like ATG9A, ATG9B was mainly co-localized with the Golgi marker GOLGA2/GM130, to
      a lesser extent with early endosomes, positive for EEA1, and recycling endosomes labeled using RAB11
      (Figure 6A).
  - statement: ATG9B binds ATG2A.
    supporting_text: Finally, we demonstrate that ATG9B can form a heteromeric complex with ATG2A.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text (re-fetched; the earlier cache was a metadata stub).
