suggested_questions:
- question: What does ATG9B do in placental trophoblast and pituitary that ATG9A cannot, and is the recently
    reported mitochondrial pool of ATG9B physiological?
suggested_experiments:
- description: Delete ATG9B in trophoblast organoids or in mouse placenta and pituitary, measure autophagy
    flux and tissue function, and test whether ATG9A can rescue.
