id: Q674R7
gene_symbol: ATG9B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATG9B is the vertebrate-specific, tissue-restricted paralog of the core autophagy protein
  ATG9A, expressed mainly in placental trophoblast and pituitary. Like ATG9A, it is a multispanning membrane
  protein that forms a homotrimer and acts as a phospholipid scramblase. It binds the lipid-transfer protein
  ATG2A. At steady state it is mostly on the Golgi, with some on early and recycling endosomes. In starvation,
  ATG9B vesicles join LC3-positive sites of autophagosome formation, where ATG9-family scramblases equilibrate
  lipids delivered by ATG2 across the growing phagophore. ATG9B can replace ATG9A in starvation-induced
  autophagy. The ATG9B locus overlaps NOS3 antisense.
