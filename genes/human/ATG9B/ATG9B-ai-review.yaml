  review:
    summary: Autophagosome assembly (IDA). ATG9B complements ATG9A knockdown in starvation-induced autophagosome
      formation, and in ATG9A-knockout cells it restores autophagy flux with ATG9A-like trafficking. As
      an ATG9-family scramblase that delivers and redistributes phagophore lipids, it does part of the
      work of assembly. Core process.
    action: ACCEPT
    reason: '[PMID:15755735 "In addition, APG9L2 can functionally complement APG9L1 in this process."]
      [PMID:37938170 "We show that ATG9B can compensate for the absence of ATG9A in starvation-induced
      autophagy displaying similar subcellular trafficking and steady-state localization."] [PMID:37938170
      "Consistent with the experimental structure and computational chemistry, we establish that ATG9B
      is a functional lipid scramblase."]'
