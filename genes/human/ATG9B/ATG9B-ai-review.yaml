      that ATG9B is a functional lipid scramblase.
  - reference_id: PMID:37938170
    supporting_text: Herein, we characterize the structure of human ATG9B revealing the conserved homotrimeric
      quaternary structure and explore the conformational dynamics of the protein.
  - reference_id: PMID:37938170
