suggested_questions:
- question: To what extent do XBP1s homodimers versus ATF6-XBP1 heterodimers account for target selectivity
    among UPRE, ERSE and ERSE-II elements in human cells?
- question: Is the XBP1u-mediated negative feedback on XBP1s physiologically important in human secretory
    tissues, and does it depend on SPP-mediated cleavage?
- question: Which XBP1-dependent metabolic programs (hepatic lipogenesis, FOXO1 degradation) are independent
    of ER stress in human cells?
