id: P17861
gene_symbol: XBP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: XBP1 (X-box binding protein 1) is a basic-leucine zipper (bZIP) transcription factor and
  the transcriptional effector of the IRE1 branch of the endoplasmic reticulum (ER) unfolded protein response
  (UPR). Its mRNA is induced by ATF6 and, under ER stress, is spliced in the cytoplasm by the ER-membrane
  endoribonuclease IRE1alpha (ERN1), which removes a 26-nucleotide intron; RtcB ligation produces a frameshifted
  mRNA encoding XBP1s, which carries a C-terminal transactivation domain and nuclear localization signal.
  Nuclear XBP1s binds UPR elements, ER stress response elements and CRE-like sequences, often as homodimers
  or heterodimers with ATF6 and other bZIP proteins, and activates transcription of genes for ER chaperones,
  ER-associated degradation, phospholipid synthesis and ER expansion. The unspliced product XBP1u is a
  short-lived protein that cotranslationally targets its own mRNA to the ER membrane to facilitate splicing,
  is cleaved by signal peptide peptidase, and acts as a negative feedback regulator by sequestering XBP1s
  for proteasomal degradation. Through these activities XBP1 is required for differentiation and function
  of professional secretory cells, notably plasma cells, and contributes to hepatic lipogenesis, adipogenesis,
  glucose homeostasis and endothelial proliferation and angiogenesis.
