id: P47928
gene_symbol: ID4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ID4 is a helix-loop-helix transcriptional regulator inhibitor that lacks the basic DNA-binding region of bHLH transcription factors. It inhibits bHLH-dependent gene expression by heterodimerizing with DNA-binding transcription factors through its HLH region and preventing their productive E-box DNA binding, and is implicated in developmental and cancer-associated transcriptional programs.
