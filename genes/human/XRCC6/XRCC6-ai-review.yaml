- term:
    id: GO:0000725
    label: recombinational repair
  evidence_type: NAS
  original_reference_id: PMID:9362500
  qualifier: involved_in
  review:
    summary: 'Recombinational repair is not the precise Ku pathway.'
    action: MARK_AS_OVER_ANNOTATED
