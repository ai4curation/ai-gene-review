id: P12956
gene_symbol: XRCC6
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'XRCC6 encodes Ku70, the smaller subunit of the Ku70:Ku80 heterodimer. Ku binds double-stranded
  DNA ends through a preformed ring, seeds assembly of DNA-PK and downstream classical non-homologous
  end joining factors, and binds telomeric repeats to support telomere maintenance. Ku70 also carries
  the reported DNA helicase and 5-prime dRP/AP lyase biochemistry of Ku and has secondary roles in cytosolic
  DNA sensing and transcriptional regulation.'
