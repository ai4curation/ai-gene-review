    label: chromosome, telomeric region
  evidence_type: HDA
  original_reference_id: PMID:19135898
  qualifier: located_in
  review:
    summary: 'Retain telomeric chromosome localization.'
    action: ACCEPT
    reason: Human Ku localizes to telomeric chromosomal DNA, which matches its direct
      telomeric-repeat DNA binding and telomere-maintenance roles.
- term:
    id: GO:0000783
    label: nuclear telomere cap complex
  evidence_type: TAS
  original_reference_id: PMID:15100233
  qualifier: part_of
  review:
    summary: 'Keep telomere cap-complex membership as a telomere side context.'
    action: KEEP_AS_NON_CORE
    reason: Ku can associate with telomeric end-protection complexes, but its primary complex
      identity is the Ku70:Ku80 heterodimer that binds DNA ends.
- term:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  evidence_type: IDA
  original_reference_id: PMID:18809223
  qualifier: enables
  review:
    summary: 'Keep promoter-region DNA binding as non-core.'
    action: KEEP_AS_NON_CORE
    reason: Ku has reported promoter and transcription-factor interactions, but these are peripheral
      to the conserved Ku DNA-end and telomere functions.
- term:
