- id: file:human/CRMP1/CRMP1-hypotheses/function-hypothesis-go-0016812/openscientist.md
  title: OpenScientist hypothesis investigation - CRMP1 cyclic-amide hydrolase activity
  publication_type: DEEP_RESEARCH
  findings:
  - statement: OpenScientist judged the CRMP1 GO:0016812 IBA annotation to be an over-annotation and recommended
      removing it.
    supporting_text: No experimental evidence — direct assay, mutant phenotype, or otherwise — has ever
      demonstrated hydrolase activity for any CRMP family member.
  - statement: The report found no experimental hydrolase evidence for CRMP family members and traced
      the annotation to computational propagation from true dihydropyrimidinases.
    supporting_text: A systematic search of GO annotations for all five human CRMP paralogs (CRMP1-5/DPYSL1-5)
      found zero experimental evidence codes (IDA, IMP, IGI, IEP) supporting hydrolase activity for any
      CRMP family member.
  - statement: The report supports loss of cyclic-amide catalysis from missing metal-center residues and
      CRMP2 structural evidence. The CRMP5 negative assay is paralog evidence. Neither loss of this reaction
      nor a noncatalytic alternative role proves exclusion from all broader metabolic processes.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: The residue-loss analysis and primary CRMP2 structural evidence substantiate loss of
      the ancestral cyclic-amide reaction. The report overstates that no CRMP has any catalytic activity
      (the CRMP3/DPYSL4 HDAC report PMID:23443259 is a counterexample needing assessment), and cannot
      establish that abstract-only PMID:8973361 contains no assay anywhere in its full text. Its author
      attribution of PMID:28044206 and PMID:25358863 is incorrect; canonical cached records identify Myllykoski
      et al. and Nakamura et al. respectively. A distinct CRMP1 metabolic BP must not be excluded solely
      from catalytic loss.
