id: Q14194
gene_symbol: CRMP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Dihydropyrimidinase-related protein 1 (CRMP1/DPYSL1), a cytoplasmic CRMP-family protein required
  for class-3 semaphorin (Sema3A) signaling and growth-cone collapse during neuronal development. A pseudoenzyme
  with respect to the ancestral dihydropyrimidinase reaction, it lacks the conserved metal-cofactor residues
  and has no dihydropyrimidinase activity. CRMP1 regulates neuron projection development and dendritic/synaptic
  organization, binds filamin, and forms homo- and hetero-tetramers with other CRMPs; it also has reported
  roles in cell migration and as an invasion suppressor.
