core_functions:
- description: Nephrin ectodomains engage each other homophilically in trans and bind Neph-family (KIRREL) IgSF receptors
    heterophilically, forming the adhesive core of the podocyte slit diaphragm. Shown for human nephrin by SPR, cell aggregation
    and co-immunoprecipitation; conserved across the SF136 subfamily (fly Sns-Kirre, worm SYG-2-SYG-1).
  molecular_function:
    id: GO:0050839
    label: cell adhesion molecule binding
