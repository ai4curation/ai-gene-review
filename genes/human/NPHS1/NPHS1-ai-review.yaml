id: O60500
gene_symbol: NPHS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Nephrin is a single-pass type I transmembrane protein of the immunoglobulin superfamily (eight Ig-like C2 domains
  and a fibronectin type III repeat), expressed almost exclusively in kidney glomerular podocytes, with minor expression in
  brain and pancreas. It is the principal structural component of the slit diaphragm, the specialised cell-cell junction that
  bridges interdigitating podocyte foot processes and forms the final layer of the glomerular filtration barrier. Nephrin
  ectodomains from adjacent foot processes interact homophilically in trans and associate with Neph-family (KIRREL) adhesion
  receptors, building the zipper-like slit diaphragm. Its cytoplasmic tail acts as a phosphotyrosine signalling scaffold:
  Src-family kinase (FYN) phosphorylation of YDxV motifs recruits Nck SH2/SH3 adaptors that drive local actin polymerisation,
  and other sites recruit PI3K; podocin and CD2AP associate with the tail. Loss-of-function mutations cause congenital nephrotic
  syndrome of the Finnish type, with absent slit diaphragms and massive proteinuria. Mouse and zebrafish studies suggest an
  additional role in myoblast fusion, paralleling its Drosophila subfamily relative Sns.'
