suggested_questions:
- question: Should nephrin's phosphotyrosine-scaffold role in Nck-dependent actin polymerisation be captured as a process
    annotation (e.g. regulation of actin filament polymerization), or does that belong only to Nck/N-WASP with nephrin as
    the recruiting receptor?
- question: Does nephrin act cell-autonomously in mammalian myoblast fusion, and why did PAINT not propagate myoblast fusion
    from the nephrin/Sns node despite fly donor evidence?
suggested_experiments:
- description: Conditional muscle-specific Nphs1 deletion in mouse to test a cell-autonomous role in secondary myoblast fusion
    in vivo, independent of renal lethality.
