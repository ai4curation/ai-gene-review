id: P21754
gene_symbol: ZP3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ZP3 is one of the four glycoproteins (ZP1-ZP4) that build the zona pellucida, the thick extracellular
  coat surrounding mammalian oocytes and pre-implantation embryos. It is made by growing oocytes as a
  type I membrane precursor and is proteolytically cleaved just before its transmembrane segment, so the
  mature, heavily N- and O-glycosylated ectodomain is released and incorporated into the coat. Through
  its ZP domain, ZP3 polymerizes with ZP2 into long filaments that ZP1 cross-links, giving the zona its
  structure; human variants that disrupt this yield oocytes with no zona pellucida and female infertility.
  At fertilization ZP3 is the principal sperm-binding component of the coat and the physiological inducer
  of the acrosome reaction, binding the anterior head of capacitated sperm and triggering calcium-dependent
  acrosomal exocytosis in a manner that depends on its glycans; it also binds proacrosin/acrosin. ZP3
  is widely used as an immunogen in contraceptive-vaccine and autoimmune-oophoritis models, which is the
  origin of several immune-process annotations rather than a function of the protein.
