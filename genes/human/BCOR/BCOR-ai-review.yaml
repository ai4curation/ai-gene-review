core_functions:
- description: Binding to DNA-binding regulators, including BCL6, recruits BCOR for repression of RNA polymerase II transcription. BCOR connects this recruitment to a PCGF1-containing PRC1.1 chromatin-modifying assembly and can associate with selected HDACs. It contributes to the ubiquitin-transferase activity of the assembled complex; RNF2 supplies the catalytic activity.
