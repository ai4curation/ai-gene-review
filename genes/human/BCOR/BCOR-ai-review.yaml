id: Q6W2J9
gene_symbol: BCOR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BCOR is a predominantly nuclear transcriptional corepressor recruited by DNA-binding regulators such as BCL6. It forms a variant Polycomb repressive complex, PRC1.1, with PCGF1, RING proteins and associated chromatin regulators, linking promoter recruitment to histone modification and transcriptional repression. BCOR also associates with selected histone deacetylases in repression assays. Its regulatory effects depend on cell type and partner composition, including germinal-center B-cell programs and osteo/dentinogenic differentiation of mesenchymal stem cells. Alternative isoforms differ in interaction capacity and localization. Pathogenic loss-of-function variants cause oculofaciocardiodental syndrome.
