suggested_questions:
- question: Which exact mouse Acvr2b experiments support the lymphatic, arterial, venous and retinal vascular GO transfers to human ACVR2B?
- question: Should ACVR2B BMP9 GO-CAM activities be typed with GO:0098821 BMP receptor activity while reserving GO:0016362 for activin-bound receptor complexes?
- question: Which BMP ligands use endogenous ACVR2B rather than BMPR2 or ACVR2A in primary human cell types beyond pulmonary arterial endothelium?
suggested_experiments:
- hypothesis: Endogenous ACVR2B is the ActR-II component that produces the BMP9-dependent Smad2 branch in endothelial cells.
  description: Individually disrupt ACVR2A and ACVR2B in primary human pulmonary endothelial cells, stimulate with BMP9 or BMP10, and compare pSMAD2, pSMAD1/5 and ID gene induction with BMPR2-disrupted and double-disrupted controls.
