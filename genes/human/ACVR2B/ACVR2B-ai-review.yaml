id: Q13705
gene_symbol: ACVR2B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACVR2B is a single-pass plasma-membrane type II serine/threonine kinase receptor for activin A, myostatin/GDF8, GDF11 and selected BMP-family ligands. Its extracellular domain binds ligand and its constitutively active intracellular kinase phosphorylates partner type I receptors such as ACVR1B/ALK4 or ACVRL1/ALK1, which then relay signals to receptor-regulated SMADs and transcriptional outputs. Ligand and type I receptor context determine whether ACVR2B propagates activin/myostatin SMAD2/3 signaling or BMP-family responses such as BMP9-ALK1 signaling. These pathways influence axial patterning, skeletal and adipose homeostasis, and vascular signaling in context-dependent ways.
alternative_products:
