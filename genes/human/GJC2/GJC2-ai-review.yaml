    review_notes: Official combined-method provenance read. The gap-junction assertion retains both the
      mouse orthology and UniProt SL-0124 inputs; these are not counted as separate experiments.
- id: UniProtKB:Q5T442
  title: Gap junction gamma-2 protein
  reference_review:
