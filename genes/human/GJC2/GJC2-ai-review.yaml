- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology links
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official method read. This row derives transmembrane transport from channel activity;
      the connexon pore performs transport across the adjacent membranes.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: MEDIUM
