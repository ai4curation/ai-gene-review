      provides genomic context; it is not a target-specific functional assay.
  full_text_unavailable: true
- id: PMID:17344063
  title: Loss-of-function GJA12/Connexin47 mutations cause Pelizaeus-Merzbacher-like disease.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original human channel sections read; rhesus tissue evidence is distinct. Deposited
      constructs are compared reproducibly in the linked sequence analysis.
  full_text_unavailable: true
- id: PMID:19056803
  title: Hereditary spastic paraplegia is a novel phenotype for GJA12/GJC2 mutations.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original selected Methods/Results and Figure 7 assessed. I33M has impaired gating despite
      surface plaques. AF014643 differs from AY285161 at two residues; the actual plasmid sequence was
      not published. Heterotypic pairing is distinct from heteromeric coassembly.
  full_text_unavailable: true
- id: PMID:20537300
  title: GJC2 missense mutations cause human lymphedema.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Selected original clinical and segregation sections read. Lymphedema association is
      supported; proposed altered docking, channel function and lymph flow were not directly assayed.
  full_text_unavailable: true
- id: PMID:20578039
  title: Dynamic expression of Cx47 in mouse brain development and in the cuprizone model of myelin plasticity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original IHC and immunoprecipitation sections read. Knockout controls support
      mouse myelin localization despite nonspecific crude Western bands. Expression changes do not establish
      that Cx47 performs myelin biosynthesis.
  full_text_unavailable: true
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official method read. The actual human connexin features support the family and complex
      roles; the broad communication mapping is less specific than retained child terms.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PAINT method and actual family tree/IBDs read. The three assertions originate
      at AN0/PTN008334405 on the target lineage; donor count and target self-inclusion are not failure
      criteria.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Official method and human SL-0039 mapping verified. A vocabulary mapping is not itself
      a localization experiment.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official method and actual HPA069619 records read. Plasma membrane is reported in EFO-21
      and SH-SY5Y; U2OS is cytosolic. Aggregate reliability and antibody-level uncertainty are distinguished.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl
    Compara
  reference_review:
    relevance: HIGH
