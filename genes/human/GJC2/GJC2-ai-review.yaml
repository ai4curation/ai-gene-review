suggested_questions:
- question: Which translation start predominates in endogenous human Cx47, and do the three N-terminal
    residues absent from historical constructs affect channel behavior?
- question: How closely does endogenous human myelin localization match the experimentally established
    mouse pattern?
- question: Which native connexon subunit combinations underlie Cx47 coupling, distinguished from heterotypic
    channels formed by connexons in opposing cells?
- question: How do lymphedema-associated variants affect channel function in lymphatic cells?
suggested_experiments:
- description: Compare sequence-verified 439- and 436-residue human constructs at matched expression,
    testing surface localization, dye transfer and paired-cell currents; independently resolve endogenous
    initiation.
  experiment_type: Controlled construct comparison and endogenous N-terminal identification
