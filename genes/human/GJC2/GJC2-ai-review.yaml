taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
status: COMPLETE
product_type: PROTEIN
description: GJC2 encodes connexin-47, a four-pass membrane protein that forms gap junction channels.
  Oligodendrocyte connexin-47 pairs with astrocyte connexin-43 across opposing cells, supporting intercellular
  ion and small-solute transfer. Pathogenic variants cause hypomyelinating neurological disorders, and
  other variants have been associated with inherited lymphedema.
references:
- id: PMID:11160382
  title: Functional expression of the new gap junction gene connexin47 transcribed in mouse brain and
    spinal cord neurons.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original mouse construct and channel sections read. Electrical/dye coupling
      establishes donor activity. The reported 437-residue construct is distinct from the current 440-residue
      record; full clone equivalence is unresolved. Historical neuronal localization is not used to override
      later glial evidence.
  full_text_unavailable: true
- id: PMID:15192806
  title: Mutations in the gene encoding gap junction protein alpha 12 (connexin 46.6) cause Pelizaeus-Merzbacher-like
    disease.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original genetic and RT-PCR sections read. Supports human disease association
      and tissue RNA expression, without a mutant channel assay or direct myelin protein localization.
  full_text_unavailable: false
- id: PMID:15489334
  title: 'The status, quality, and expansion of the NIH full-length cDNA project: the Mammalian Gene Collection
    (MGC).'
  reference_review:
