core_functions:
- description: CASQ2 binds and sequesters calcium in the sarcoplasmic-reticulum lumen. Calcium-dependent oligomer
    and polymer assembly supports a high-capacity calcium reservoir for cardiac contraction. This storage activity
    is coupled to release-complex regulation but is distinct from modulation of the channel itself.
  molecular_function:
    id: GO:0140314
    label: calcium ion sequestering activity
  directly_involved_in:
  - id: GO:0010881
    label: regulation of cardiac muscle contraction by regulation of the release of sequestered calcium ion
  locations:
  - id: GO:0033018
    label: sarcoplasmic reticulum lumen
  in_complex:
    id: GO:0034704
    label: calcium channel complex
  supported_by:
  - reference_id: PMID:17881003
    supporting_text: 'the linear polymerization behavior of CSQ is linked directly to its

      high-capacity Ca2+ binding'
  - reference_id: Reactome:R-HSA-2855020
- description: CASQ2 modulates RyR2 calcium-channel activity through luminal release-complex interactions.
    Reconstituted channels show inhibition under defined low-luminal-calcium conditions, while human CSQ2–RyR2
    association and cell assays support regulation whose observed kinetics also include calcium buffering.
    The effect depends on luminal calcium and accessory-protein context. CASQ2 performs the regulatory contribution;
    RyR2 forms the conducting pore.
  molecular_function:
    id: GO:0005246
    label: calcium channel regulator activity
