id: O14958
gene_symbol: CASQ2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Calsequestrin-2 is an acidic calcium-storage protein of the cardiac sarcoplasmic reticulum. Calcium-dependent
  assembly into oligomers and polymers supports its high-capacity buffering of luminal calcium. Association
  with the ryanodine-receptor release complex couples this reservoir to regulated calcium release for cardiac
  contraction. CASQ2 variants can disturb calcium storage, polymerization or release-complex regulation. Biallelic
  pathogenic variants and certain heterozygous variants cause catecholaminergic polymorphic ventricular tachycardia,
  with variant-dependent mechanisms and penetrance. The protein supplies calcium buffering and regulatory interactions;
  the ryanodine receptor supplies the ion-conducting pore.
