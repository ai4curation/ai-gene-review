    label: mitochondrial permeability transition pore complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  review:
    summary: >-
      ANT isoforms are associated with the mitochondrial permeability transition pore
      complex (PTPC) and ANT3 has been directly implicated in it, but whether ANT is a
      pore-forming subunit or a regulator is unresolved, and this is a secondary role
      shared across ANT paralogs rather than the core function. Retain as non-core.
    action: KEEP_AS_NON_CORE
    reason: >-
      Kept because the association is real and reported for ANT3 specifically: PB1-F2 pulls down ANT3
      together with VDAC1, both permeability-transition components, and PTPC blockers abolish the
      resulting permeabilisation. It is non-core because UniProt itself records that whether ANT is a
      pore-forming subunit or a regulator of the pore is unresolved, so part_of membership is a weaker
      claim than ADP/ATP exchange, and it is shared across all ANT paralogs rather than specific to
      ANT3.
