  review:
    summary: >-
      Legacy TAS from a 1989 gene-sequencing paper. ANT is a well-known cargo/substrate
      of the mitochondrial carrier (TIM22) import pathway, not a stable structural
      subunit of the TIM23 presequence translocase, and the cited paper does not assay
      translocase-complex membership. This looks like a mis-mapped part_of annotation.
      Because I cannot access the full text to verify what the curator saw, I mark it
      UNDECIDED (likely substrate, not subunit) rather than removing an existing
      annotation.
    action: UNDECIDED
    reason: >-
      Left undecided. ANT is a substrate of the carrier import pathway, which uses TIMM22 and the
      small TIM chaperones, not of the TIM23 presequence translocase; consistent with that, the same
      sequencing paper notes that ADP/ATP translocases carry no processed presequence, which is the
      signal TIM23 recognises. That makes a structural part_of relationship to the TIM23 complex
      unlikely. But the cited 1989 paper is abstract-only in this cache, so what the curator read
      cannot be checked, and an author-statement annotation is not overruled from an abstract.
      Recorded as undecided rather than removed, with the question raised in suggested_questions.
