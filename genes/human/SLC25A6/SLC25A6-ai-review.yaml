- id: Reactome:R-HSA-163215
  title: SLC25A5,6 dimers exchange ATP for ADP across the mitochondrial inner membrane
  findings:
  - statement: >-
      The SLC25A4/5/6 antiporters export ATP from the mitochondrial matrix while importing
      cytosolic ADP, maintaining a high matrix ADP:ATP ratio.
    supporting_text: >-
      A family of  antiport, ATP-ADP translocases (SLC25A4,5,6), preferentially export ATP from
      the matrix while importing ADP from the cytosol,  thereby maintaining a high ADP:ATP ratio
      in the matrix.
    reference_section_type: DATABASE_ENTRY
  - statement: >-
      Reactome records SLC25A6 as the third of three human translocase isoforms, described as the
      liver form, and models all of them as homodimers.
    supporting_text: >-
      There are 3 isoforms of translocases in humans; isoform 1 (SLC25A4) is the heart/skeletal
      muscle form, isoform 2 (SLC25A5) is the fibroblast form and isoform 3 (SLC25A6) is the liver
      form. All isoforms exist as homodimers.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reactome reaction directly describing ANT3 (SLC25A6) ADP/ATP exchange at the inner
      membrane; supports both the core MF and the inner-membrane localization.
