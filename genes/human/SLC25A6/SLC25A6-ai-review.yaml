- id: Reactome:R-HSA-1955380
  title: TIMM9:TIMM10 transfers proteins to TIMM22
  findings:
  - statement: >-
      In the carrier import pathway TIMM22 inserts the substrate into the inner membrane after the
      small TIM chaperones hand it over, which is how ANT3 reaches its compartment; ANT3 is a
      substrate of this machinery, not a subunit of it.
    supporting_text: >-
      It is believed that TIMM22 then inserts the protein into the inner membrane and
      TIMM9:TIMM10 and FXC1 are released.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Reactome mitochondrial-import reaction; used only as a TAS source for inner-membrane
      localization. Notably this is the TIM22 (carrier) pathway, of which ANT is a
      substrate.
