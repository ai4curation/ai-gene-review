suggested_questions:
- question: Which cytosolic chaperones receive Cu(I) directly from the full-length human CTR1
    C-terminal tail in living cells?
  experts:
  - Kaplan JH
  - Kahra D
- question: Which polarized human epithelial and cardiac cell types use apical, basolateral, or
    intercalated-disc CTR1 pools for physiologic copper import?
  experts:
  - Lee J
suggested_experiments:
- hypothesis: The C-terminal HCH motif regulates CTR1 copper exit and chaperone handoff without
    being required for bulk Cu(I) permeation through the plasma-membrane pore.
  description: Introduce C-terminal HCH-to-AAA and tail-truncation variants at the endogenous
    SLC31A1 locus in human cells, then measure acute 64Cu uptake, copper-stimulated endocytosis, and
    copper transfer to ATOX1 and CCS reporters.
  experiment_type: endogenous structure-function transport and handoff assay
