id: O15431
gene_symbol: SLC31A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC31A1 encodes CTR1, a homotrimeric multi-pass membrane transporter that forms the
  major high-affinity route for Cu(I) import across the plasma membrane. Its extracellular and
  transmembrane methionine motifs coordinate copper entry through the trimeric pore, and its
  cytosolic C terminus can hand Cu(I) to copper chaperones such as ATOX1 and CCS. CTR1 abundance at
  the cell surface is acutely controlled by copper-induced internalization and Rab11-dependent
  recycling, and in endothelial cells CTR1 also has a noncanonical redox-adaptor role in
  VEGF-induced VEGFR2 signaling.
