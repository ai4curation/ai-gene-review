  title: A new family of small, palmitoylated, membrane-associated proteins, characterized
    by the presence of a cysteine-rich hydrophobic motif.
  findings:
  - statement: The original CHIC2 family paper established that the CHIC motif cysteines
      are palmitoylated and that CHIC2 associates with vesicular structures and the
      plasma membrane.
    supporting_text: Our data illustrate that cysteines in this central CHIC motif are
      palmitoylated and that CHIC2 is associated with vesicular structures and the
      plasma membrane.
