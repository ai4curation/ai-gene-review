- term:
    id: GO:0000151
    label: ubiquitin ligase complex
  evidence_type: IPI
  original_reference_id: PMID:40796662
  qualifier: part_of
  review:
    summary: CHIC2 forms a membrane-associated complex with the U-box E3 ubiquitin
      ligase STUB1/CHIP in T cells. CHIC2 binds STUB1 through its C-terminal IFRPD
      motif, the STUB1-CHIC2 complex regulates cytokine receptor levels, and loss
      of STUB1 or CHIC2 produces non-additive phenotypes. CHIC2 is non-catalytic,
      so the conservative assertion is membership in a STUB1-containing ubiquitin
      ligase complex rather than ubiquitin ligase activity.
    action: NEW
    reason: The 2025 STUB1-CHIC2 study directly supports CHIC2 membership in a
      STUB1 ubiquitin ligase complex that regulates cytokine receptors in T cells.
      GOA currently captures only CHIC2 localization and high-throughput bare protein
      binding; GO:0000151 records the complex-membership aspect without incorrectly
      assigning E3 catalytic activity to CHIC2.
    supported_by:
    - reference_id: PMID:40796662
      supporting_text: CHIC2 could co-precipitate STUB1 but CHIC2 ΔIFRPD could not.
    - reference_id: PMID:40796662
      supporting_text: Collectively, these findings demonstrate that the complex of
        STUB1 and CHIC2 regulates cytokine receptor expression in T cells.
