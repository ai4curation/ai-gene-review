proposed_new_terms: []
suggested_questions:
- question: Does CHIC2's STUB1-adapter function extend beyond IFNγR1, IL-27Rα, and CSF2RB to additional cytokine receptors, membrane proteins, or cell types?
- question: Is CHIC2 functionally related to the Erf4/Golgin-A7 family (which participates in RAB GTPase palmitoylation), and does it have any role in protein palmitoylation or membrane targeting of partner proteins?
- question: Does loss of CHIC2 (as occurs in the 4q12 FIP1L1-PDGFRA deletion) contribute to disease phenotype, or is CHIC2 deletion purely a positional marker?
suggested_experiments:
- description: Acyl-biotin exchange or click-chemistry palmitoylproteomics to confirm CHIC2 palmitoylation sites and identify the responsible palmitoyltransferase(s).
- description: Affinity purification-mass spectrometry or proximity labeling under native membrane conditions, comparing wild-type CHIC2 with IFRPD- and palmitoylation-defective mutants, to identify reproducible STUB1-dependent and STUB1-independent CHIC2 partners beyond high-throughput Y2H preys.
- description: CHIC2 knockout/knockdown with cytokine-receptor ubiquitination, lysosomal flux, secretion, and surface-recycling assays to test which membrane-protein clients depend on CHIC2.
