id: P61586
gene_symbol: RHOA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'RHOA is a ubiquitously expressed Rho-family small GTPase that cycles between an active GTP-bound
  and an inactive GDP-bound state and is anchored by C-terminal geranylgeranylation to the cytoplasmic
  face of the plasma membrane, with an inactive RhoGDI-bound cytosolic pool. In the GTP-bound state it
  engages effectors including ROCK1/2, the formins DIAPH1/mDia and PKN kinases to drive actomyosin contractility:
  it is the principal organizer of actin stress fibres and focal adhesions downstream of plasma-membrane
  receptors, and it is activated at the equatorial cortex by ECT2 during anaphase, where it specifies
  the cleavage furrow and the contractile ring for cytokinesis. RHOA also controls apical junction formation
  in epithelia, microtubule stabilization at the cell cortex through the MEMO1-RHOA-DIAPH1 axis, directed
  and chemokine-driven cell migration, and actin remodelling at postsynaptic sites. It is the target of
  bacterial toxins (C3 exoenzyme, YopT) and is recurrently mutated in diffuse gastric cancer and T-cell
  lymphoma.'
