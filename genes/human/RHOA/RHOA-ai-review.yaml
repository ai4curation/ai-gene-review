core_functions:
- description: Acts as a nucleotide-dependent molecular switch on the cytoplasmic face of the plasma membrane,
    loaded with GTP by RhoGEFs and inactivated by RhoGAPs, binding ROCK kinases and formins only in the
    GTP state to drive actomyosin contractility - the assembly of actin stress fibres and focal adhesions
    downstream of membrane receptors - and thereby controlling cell shape, adhesion and migration.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  locations:
  - id: GO:0009898
    label: cytoplasmic side of plasma membrane
  - id: GO:0005829
    label: cytosol
  - id: GO:0005938
    label: cell cortex
  directly_involved_in:
  - id: GO:0007266
    label: Rho protein signal transduction
  - id: GO:0043149
    label: stress fiber assembly
  - id: GO:0051893
    label: regulation of focal adhesion assembly
  - id: GO:0016477
    label: cell migration
  supported_by:
  - reference_id: file:human/RHOA/RHOA-uniprot.txt
    supporting_text: Regulates a signal transduction pathway linking plasma membrane receptors to the
      assembly of focal adhesions and actin stress fibers
  - reference_id: file:human/RHOA/RHOA-uniprot.txt
    supporting_text: Reaction=GTP + H2O = GDP + phosphate + H(+)
- description: Is activated by ECT2 at the equatorial cortex in anaphase and specifies the cleavage furrow,
    assembling and constricting the myosin contractile ring that completes cytokinesis.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  locations:
  - id: GO:0032154
    label: cleavage furrow
  - id: GO:0030496
    label: midbody
  directly_involved_in:
  - id: GO:0036089
    label: cleavage furrow formation
  - id: GO:0000281
    label: mitotic cytokinesis
  - id: GO:0032467
    label: positive regulation of cytokinesis
  supported_by:
  - reference_id: file:human/RHOA/RHOA-uniprot.txt
    supporting_text: Involved in a microtubule-dependent signal that is required for the myosin contractile
      ring formation during cell cycle cytokinesis
  - reference_id: file:human/RHOA/RHOA-uniprot.txt
    supporting_text: Translocates to the equatorial region before furrow formation in a ECT2-dependent
      manner.
- description: Organizes cortical actin at epithelial cell-cell contacts, where it is required for apical
    junction complex formation and hence for apical-basal polarity of epithelial sheets.
  molecular_function:
    id: GO:0003924
    label: GTPase activity
  locations:
  - id: GO:0043296
    label: apical junction complex
  directly_involved_in:
  - id: GO:0043297
    label: apical junction assembly
  - id: GO:0034329
    label: cell junction assembly
  supported_by:
  - reference_id: file:human/RHOA/RHOA-uniprot.txt
    supporting_text: Required for the apical junction formation of keratinocyte cell-cell adhesion
suggested_questions:
- question: What determines whether RHOA activation produces stress fibres, a cleavage furrow or a junctional
    actin belt - the GEF that loads it, the effector available, or the membrane microdomain in which it
    is activated?
- question: How do the recurrent RHOA mutations in diffuse gastric cancer (Y42C, G17V in lymphoma) change
    effector selection rather than simply switching the protein on or off?
- question: How are the RHOA and RAC1 activity zones kept spatially separate in a migrating cell, and
    which GAPs and GEFs enforce that separation?
suggested_experiments:
- description: Biosensor imaging of RHOA activity combined with acute, localized optogenetic activation
    in human epithelial cells, to test whether the same activity level produces junctional versus stress-fibre
    outputs depending on where it is generated.
- description: Effector-selective RHOA mutants (separating ROCK, DIAPH1 and PKN binding) expressed in
    RHOA-null human cells, scored for stress fibres, furrow formation, junction assembly and postsynaptic
    spine morphology.
- description: Comparative analysis of cancer-derived RHOA variants in isogenic cells, measuring nucleotide
    cycling, GEF/GAP responsiveness and effector binding, to connect genotype to the cytoskeletal phenotype.
