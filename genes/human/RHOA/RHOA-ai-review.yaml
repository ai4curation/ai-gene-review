  review:
    summary: RHOA acts at the plasma membrane.
    action: MODIFY
    reason: Geranylgeranylation anchors RHOA to the plasma membrane, where it is activated by GEFs downstream
      of receptors. Note that it is on the cytoplasmic face and is not surface-exposed. The more specific supported term the gene already carries is cytoplasmic side of plasma membrane (GO:0009898) -- the protein is lipid-anchored or recruited to the inner (cytoplasmic) leaflet and faces the cytosol, not the cell exterior.
    proposed_replacement_terms:
    - id: GO:0009898
      label: cytoplasmic side of plasma membrane
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
    supported_by:
    - reference_id: file:human/RHOA/RHOA-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Cell membrane; Lipid-anchor; Cytoplasmic side.'
