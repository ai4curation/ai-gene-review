taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MGAT4C is a poorly characterized Golgi type-II glycosyltransferase homolog in the 
  GnT-IV branch of glycosyltransferase family 54. Its sequence places it with MGAT4A and MGAT4B, 
  which form a GlcNAc-beta-1,4 branch on the alpha-1,3 arm of complex N-glycans, but human MGAT4C 
  catalytic activity is inferred rather than directly characterized.
