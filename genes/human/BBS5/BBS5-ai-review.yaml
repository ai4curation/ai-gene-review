id: Q8N3I7
gene_symbol: BBS5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BBS5 is a subunit of the BBSome, an eight-protein complex involved in ciliary membrane-protein
  trafficking. It contains two pleckstrin-homology-like domains and binds phosphoinositides in isolated-protein
  assays. BBS5 occurs in the cytoplasmic BBSome and at ciliary membranes and basal bodies. In human
  retinal pigment epithelial cells, BBS5 supports cilium formation and entry of the BBSome into cilia.
  Biallelic pathogenic variants cause Bardet-Biedl syndrome, with variable retinal degeneration,
  obesity, polydactyly, renal abnormalities and other manifestations.
