  review:
    summary: BBS5 binds phosphatidylinositol-3-phosphate in a protein–lipid overlay assay.
    action: ACCEPT
    reason: Original experiments show phosphoinositide binding by recombinant full-length BBS5 and
      the isolated N-terminal PH-like domain. This supports the binding function. Native BBSome liposome
      preferences differ from isolated BBS5 overlays, and a recombinant BBS4/8/9/18 subcomplex also
      binds lipids without BBS5; therefore the assay does not establish BBS5 as the exclusive physiological
      membrane anchor or its in-vivo lipid specificity.
