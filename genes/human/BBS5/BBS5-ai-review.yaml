core_functions:
- description: 'Binds phosphatidylinositol-3-phosphate in recombinant protein-lipid overlay assays.
    Full-length BBS5 and its N-terminal PH-like domain bind this lipid and phosphatidic acid. This
    isolated-protein activity does not establish physiological lipid selectivity or an exclusive
    membrane-anchor mechanism: native BBSome liposome specificity differs, and a recombinant BBS4/BBS8/BBS9/BBIP1
    subcomplex also binds lipids without BBS5.'
  molecular_function:
    id: GO:0032266
    label: phosphatidylinositol-3-phosphate binding
  supported_by:
  - reference_id: PMID:17574030
  - reference_id: PMID:20603001
  - reference_id: PMID:31951201
- description: 'Contributes as a BBSome subunit to cilium formation in human retinal pigment epithelial
    cells. BBS5 depletion reduces ciliation and impairs normal ciliary entry of the remaining BBSome.
    Most of the complex can remain assembled after BBS5 depletion, and reducing LZTFL1 restores its
    ciliary localization. These observations distinguish the BBS5 contribution from an obligatory
    scaffold for BBSome assembly. Cargo requirements differ: BBS5 depletion does not impair PC1 ciliary
    trafficking in the reported assay.'
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
  in_complex:
    id: GO:0034464
    label: BBSome
  locations:
  - id: GO:0060170
    label: ciliary membrane
  - id: GO:0036064
    label: ciliary basal body
  supported_by:
  - reference_id: PMID:17574030
  - reference_id: PMID:22072986
    supporting_text: All BBSome subunits are required for BBSome ciliary entry.
  - reference_id: PMID:24939912
suggested_questions:
- question: Which lipid contacts made by BBS5 contribute to BBSome behavior in living cells, and
    how do they differ from the interactions detected by recombinant protein-lipid overlays?
- question: How does BBS5 promote ciliary entry of an otherwise largely assembled BBSome, and how
    is this requirement bypassed by reducing LZTFL1?
- question: For which ciliary cargoes does BBS5 contribute to entry, exit or transport within
    cilia, separately from its effect on ciliary entry of the BBSome itself?
suggested_experiments:
- description: Compare full-length BBS5 and PH-domain mutants in quantitative liposome binding and
    cellular rescue experiments while measuring protein stability, BBSome assembly, ciliary entry
    and several defined cargoes independently.
- description: Track the remaining BBSome after acute BBS5 depletion with and without LZTFL1 depletion
    to distinguish effects on entry, retention and transport within cilia.
