- id: PMID:24559376
  title: Functional modelling of a novel mutation in BBS5.
  findings:
  - statement: Zebrafish bbs5 morpholino perturbation produced abnormal heart looping, retinal layering
      and pronephric phenotypes. Wild-type and c.966dupT mRNAs differed in their ability to rescue
      the tested composite and organ phenotypes.
  - statement: Tagged wild-type BBS5 colocalized with pericentrin in HEK293 cells, whereas the tested
      mutant had diffuse localization. This does not establish every endogenous compartment or autonomous
      transport activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete normal-source abstract and selected original Results/captions on morpholino
      dose response, heart looping, pronephric defects, wild-type versus mutant mRNA rescue and HEK293
      localization read. Selected Methods in the initial display were incomplete and are not claimed
      as a complete Methods read. Images and supplements were not independently inspected. Retain
      the existing zebrafish heart-looping transfer as non-core. Bbs5 morphants show abnormal looping;
      wild-type mRNA improves composite phenotypes and renal/retinal outcomes. The text reports absence
      of situs inversus among rescue phenotypes, but does not provide a separately quantified heart-looping
      rescue series. No direct human cardiac mechanism or genetic-knockout claim is made.
- id: PMID:31690665
  title: Defining the layers of a sensory cilium with STORM and cryoelectron nanoscopy.
  findings:
  - statement: Mouse rod-cilium STORM imaging detected BBS5 near basal bodies/pericentriolar material,
      along the outer-segment axoneme and in connecting-cilium clusters. Some clusters colocalized
      with IFT88; others did not.
  - statement: In Bbs2-, Bbs4- and Bbs7-deficient rods, BBS5 localization within the connecting cilium
      was largely retained despite other abnormalities. These comparisons should not be presented
      as Bbs5 perturbation phenotypes.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Complete normal-source abstract; selected primary BBS5 STORM localization Results
      at lines147,153,155,165,169, selected Discussion187,189 and Methods197-207 read. Bbs5-null
      antibody control is described in text; images and supplementary controls were not independently
      reanalyzed. No whole-paper claim. Retain basal-body and specialized axonemal localization.
      BBS5 labeling occurs in several rod-cilium compartments, with Bbs5-null tissue used to validate
      the antibody. The principal mutant comparisons concern Bbs2, Bbs4 and Bbs7. Spatial association
      with IFT88 is not purified direct binding or proof of motor activity.
