    summary: Mouse donor P49582 traces these assertions to PMID20164328.
    reason: Mouse donor P49582 traces these assertions to PMID20164328. Its recovered abstract reports
      increased soluble amyloid oligomer accumulation after alpha7 loss in an early-stage APP model; it
      does not resolve the exact protein-metabolic reaction, positive amyloid-formation sign, or fibril-versus-oligomer
      distinction. Normal force retrieval remained abstract-only. PMID19587288 reports a different model/context
      and PMID20708605 measures reduced amyloidogenic processing in engineered human cells; neither permits
      blindly reversing the donor claim. Preserve the specific unresolved source and direction rather
      than fabricate a universal pro- or anti-amyloid function.
