id: P36544
gene_symbol: CHRNA7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHRNA7 encodes the alpha7 subunit of calcium-permeable nicotinic acetylcholine receptors.
  Five alpha7 chains can assemble into a rapidly desensitizing, acetylcholine-gated cation channel, and
  alpha7 can also participate in beta2-containing heteromeric receptors. Neuronal receptors contribute
  to presynaptic transmitter modulation and postsynaptic excitation, with downstream effects on synaptic
  plasticity and cognition. Alpha7 is also expressed in non-neuronal cells, where receptor signaling can
  regulate inflammatory mediator production, endothelial responses and epithelial physiology. Anti-inflammatory
  signaling need not require ion-channel conduction, and the direction of downstream responses depends
  on cell type, ligand, receptor assembly and physiological context. Alpha7 interacts with amyloid-beta
  in experimental systems; effects on amyloid processing and neuronal injury differ among preparations
  and disease models.
