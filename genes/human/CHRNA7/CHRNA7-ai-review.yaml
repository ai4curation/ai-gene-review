core_functions:
- description: Human alpha7 chains assemble a calcium-permeable acetylcholine-gated homopentamer; beta2-containing
    heteromers are also experimentally supported. The pore performs cation transport and cholinergic signal
    reception, with rapid activation/desensitization rather than constitutive ion flow.
