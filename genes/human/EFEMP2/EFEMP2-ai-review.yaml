    label: extracellular matrix structural constituent
  evidence_type: RCA
  original_reference_id: PMID:28327460
  qualifier: enables
  review:
    summary: EFEMP2 contributes to extracellular-matrix organization.
    action: ACCEPT
    reason: The RCA source classifies matrisome proteins, and its recovered Supplementary Table I explicitly
      detects EFEMP2 in decellularized bone-marrow MSC matrices from five of six donors. Detection alone
      is not a mechanical assay; the structural contribution is supported independently by direct elastic-fiber
      assembly and LOX–tropoelastin organization studies. Retain this broad structural assertion without
      assigning LOX catalysis to EFEMP2.
    supported_by:
