  review:
    summary: Binding to SGTA supports a specific partner class.
    action: MODIFY
    reason: The curated pair records identify EFEMP2 and SGTA (O43765), with reference-sequence checksums
      matching the current official record. SGTA directly binds hydrophobic and misfolded clients for
      transport and quality control, satisfying the current folding-or-transport chaperone definition.
      The refinement describes the bound partner; it does not transfer that partner’s activity to EFEMP2
      or demonstrate a native interaction in every compartment. The source-linked records report two hybrid
      pooling approach. These are assay-context associations; a native extracellular complex is not established
      by the screen alone.
