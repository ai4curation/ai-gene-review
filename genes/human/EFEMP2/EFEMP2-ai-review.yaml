      PANTHER tree/MSA. Node placement and donor paths, not donor count or self-inclusion, ground the
      inference.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl
    Compara
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The literal Ensembl Compara donor chain to mouse Efemp2 was checked against current
      donor records and selected primary studies; this is ortholog inference rather than a human experiment.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The applicable ARBA rule records were checked. General matrix membership does not alone
      resolve the non-collagenous compartment of basement-membrane extracellular matrix.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The combined electronic source assertion is preserved and evaluated against actual source
      location and partner evidence; ordinary qualifiers are retained unchanged.
- id: PMID:10601734
  title: Sequence, recombinant expression and tissue localization of two novel extracellular matrix proteins,
    fibulin-3 and fibulin-4.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The bibliographic identity and complete abstract were checked. The paper introduces
      fibulin-3 and fibulin-4, but the target-specific full localization experiment was not recovered.
      Its abstract does not settle the narrower basement-membrane assignment. Historical construct lengths
      are not assumed to equal the current 443-residue EFEMP2 sequence.
- id: PMID:16174808
  title: Functional characterization of human monocarboxylate transporter 6 (SLC16A5).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The complete primary abstract reports transport of bumetanide and other drugs by human
      MCT6/SLC16A5 expressed in Xenopus oocytes. This supports the partner transporter class despite an
      unresolved physiological substrate; full Methods and the exact experimental insert were not recovered.
      It is not evidence that EFEMP2 transports drugs.
- id: PMID:16189514
  title: Towards a proteome-scale map of the human protein-protein interaction network.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The bibliographic record and source-linked IntAct records were checked. The selected
      human interaction records identify their detection methods and reference sequences. Screen associations
      support the assayed binding context; they do not establish a native extracellular complex or transfer
      a partner activity to EFEMP2.
- id: PMID:16478991
  title: Targeted disruption of fibulin-4 abolishes elastogenesis and causes perinatal lethality in mice.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Methods, Results and captions were read. Mouse Efemp2 disruption establishes
      an elastic-fiber assembly defect. The human EFEMP2/elastin cell-lysate coimmunoprecipitation is
      distinct from the purified mouse fibulin-4/bovine elastin experiment. Neither assay makes EFEMP2
      a cross-linking enzyme.
- id: PMID:16713569
  title: A protein-protein interaction network for human inherited ataxias and disorders of Purkinje cell
    degeneration.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The bibliographic record and exact source-linked interaction records were checked. Pair
      identities, methods, reference-sequence checksums and recorded features are retained. An interaction
      in the reported assay does not establish the same association in extracellular matrix or imply EFEMP2
      has a neuronal disease-protein activity.
- id: PMID:17324935
  title: A comparative analysis of the fibulin protein family. Biochemical characterization, binding interactions,
    and tissue localization.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The complete comparative-family abstract and the literal mouse Efemp2 donor annotation
      were inspected. The abstract supports microfibril-associated matrix localization, but the target-specific
      basement-membrane images and assay were not recovered. Bibliographic verification does not resolve
      that narrower location.
- id: PMID:18973305
  title: Fibrillins, fibulins, and matrix-associated glycoprotein modulate the kinetics and morphology
    of in vitro self-assembly of a recombinant elastin-like polypeptide.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original Methods, Results and Discussion were read. The study tests matrix proteins
      in an in-vitro recombinant elastin-like-polypeptide self-assembly system. Its kinetic and morphological
      effects support matrix organization within that reconstituted context, not autonomous EFEMP2 catalysis
      or identical behavior of all native elastic tissues.
  full_text_unavailable: false
- id: PMID:19199708
  title: Proteomic analysis of human parotid gland exosomes by multidimensional protein identification
    technology (MudPIT).
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The archived article sections and original supplementary workbook were inspected. The
      Paratid Exosomes sheet contains an EFEMP2 precursor record at physical row 284 with three sequences,
      five spectra and 0.063 sequence coverage. This is positive parotid exosome proteomic detection,
      not proof of an essential vesicle function. The available article cache does not expose the complete
      operative Methods.
  full_text_unavailable: true
- id: PMID:19349279
  title: Latent transforming growth factor beta-binding proteins and fibulins compete for fibrillin-1
    and exhibit exquisite specificities in binding sites.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Methods and Results establish binding-site specificity and competition
      among fibrillins, fibulins and latent TGF-beta-binding proteins. The fibulin-4/fibrillin-1 SPR evidence
      supports matrix-protein binding; the assay and reagent scope are retained without implying an independently
      demonstrated cellular signaling pathway.
- id: PMID:19570982
  title: Differential regulation of elastic fiber formation by fibulin-4 and -5.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The operative original Methods, Results and Discussion support fibulin-4 binding to
      pro-lysyl oxidase and tropoelastin and concentration-dependent ternary organization. Literal human
      constructs are reported as residues 26–418, 26–217 and 98–303 and are not equated to the current
      443-residue reference sequence. Human ARPE19 fibulin-4 knockdown modestly increased desmosine; rat
      RFL6 knockdown concerned fibulin-5. The evidence supports an assembly adaptor, not EFEMP2 oxidase
      activity.
  full_text_unavailable: false
- id: PMID:19855011
  title: Fibulin-4 conducts proper elastogenesis via interaction with cross-linking enzyme lysyl oxidase.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Operative original Methods and Results support pro-lysyl oxidase recruitment, mouse
      elastic-fiber phenotypes and human fibroblast localization. The ternary assay combined purified
      tropoelastin with HEK293T-conditioned pro-lysyl oxidase; it was not a fully purified three-component
      system. Supplementary construct details were not recovered, so the tested preparations are not assigned
      to an exact current natural product.
- id: PMID:20019329
  title: 'Fibulin-4 deficiency results in ascending aortic aneurysms: a potential link between abnormal
    smooth muscle cell phenotype and aneurysm progression.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Selected original mouse knockout Methods and Results show disrupted elastic laminae,
      smooth-muscle organization and aortic pathology after germline or smooth-muscle Efemp2 loss. These
      support the donor developmental and morphogenetic associations while leaving extracellular matrix
      effects distinct from cell-intrinsic transcription or catalysis.
  full_text_unavailable: false
