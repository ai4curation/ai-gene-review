id: O95967
gene_symbol: EFEMP2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EFEMP2, also called fibulin-4, is a secreted extracellular matrix glycoprotein with EGF-like
  repeats and a C-terminal fibulin domain. It helps organize elastic fiber assembly by interacting with
  tropoelastin, lysyl oxidase, fibrillin-1 and fibulin-5. Binding of fibulin-4 to the propeptide of lysyl
  oxidase helps position the enzyme near tropoelastin for cross-link formation. Fibulin-4 contributes
  to the organization and mechanical integrity of elastic tissues, particularly arterial elastic laminae;
  it does not itself catalyze lysine oxidation.
