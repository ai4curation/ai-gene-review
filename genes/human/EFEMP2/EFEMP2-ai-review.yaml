core_functions:
- description: Organizes an extracellular enzyme-substrate assembly by recruiting pro-lysyl oxidase to
    tropoelastin. Recombinant-protein binding and ternary-association experiments support this adaptor
    mechanism, while human fibroblast localization and mouse loss-of-function studies connect it to elastic
    fiber organization. Lysyl oxidase performs the cross-linking chemistry; fibulin-4 positions interacting
    components, with effects that depend on their relative abundance and matrix context.
  molecular_function:
    id: GO:0140767
    label: enzyme-substrate adaptor activity
  directly_involved_in:
  - id: GO:0048251
    label: elastic fiber assembly
  locations:
  - id: GO:0031012
    label: extracellular matrix
  supported_by:
  - reference_id: PMID:19570982
  - reference_id: PMID:19855011
suggested_questions:
- question: How do the relative amounts of fibulin-4, fibulin-5, pro-lysyl oxidase and tropoelastin determine
    cross-linking and deposition of mature elastic fibers?
- question: How do the historical fibulin-4 constructs compare with the current 443-residue human reference
    protein, and which differences alter secretion, oligomerization or partner binding?
- question: Which effects on vascular cell behavior follow directly from extracellular matrix assembly,
    and which require distinct signaling interactions?
suggested_experiments:
- description: Reconstitute elastic fiber assembly with sequence-verified human fibulin-4, pro-lysyl oxidase,
    tropoelastin and fibrillin microfibrils. Vary component ratios and measure enzyme recruitment, lysyl
    oxidase processing, cross-link formation and matrix deposition separately.
- description: Compare graded fibulin-4 depletion with complete loss and extracellular rescue in human
    vascular cell cultures, distinguishing total cross-link abundance from fiber organization and mechanical
    properties.
