  review:
    summary: Calcium binding is an accessory property of the EGF-like repeats.
    action: KEEP_AS_NON_CORE
    reason: The InterPro mapping names calcium-binding EGF-like domains, which are retained in the official
      443-residue EFEMP2 sequence. Calcium-dependent matrix interactions are compatible with this prediction.
      Retain the inferred ion-binding property as non-core; calcium dependence of an interaction is not
      itself a measurement of ion-binding stoichiometry.
