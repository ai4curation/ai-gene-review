id: Q01814
gene_symbol: ATP2B2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP2B2 encodes plasma membrane calcium ATPase 2 (PMCA2), a multipass P-type pump
  that uses ATP hydrolysis to export calcium from the cytosol. Its ATP-dependent phosphorylation
  cycle helps restore low cytosolic calcium after cellular activity. Alternative splicing of
  the first intracellular loop and C-terminal regulatory region changes membrane targeting and
  regulation, adapting calcium extrusion to neuronal, auditory and epithelial cells. PMCA2 is
  especially important for calcium clearance in sensory hair cells; impaired activity can contribute
  to hearing loss. Calmodulin regulates the pump through its cytoplasmic regulatory region.
