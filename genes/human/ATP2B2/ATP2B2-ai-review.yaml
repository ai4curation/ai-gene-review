core_functions:
- description: ATP-coupled calcium export across the plasma membrane lowers cytosolic calcium
    and helps terminate calcium transients. PMCA2 itself performs the transport step. Splice-dependent
    targeting and regulation adapt this same activity to specialized cellular environments.
    In sensory hair cells this export returns calcium from stereocilia to endolymph after
    mechanotransduction; it is a specialized setting of the same pump mechanism.
  molecular_function:
    id: GO:0005388
    label: P-type calcium transporter activity
  directly_involved_in:
  - id: GO:0051480
    label: regulation of cytosolic calcium ion concentration
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:17234811
    supporting_text: 'delayed

      the dissipation of Ca2+ transients induced in CHO cells by InsP3.'
    full_text_unavailable: false
  - reference_id: PMID:7929331
    supporting_text: formation of the phosphoenzyme intermediate from ATP
    full_text_unavailable: true
suggested_questions:
- question: Which SynGO evidence records connect PMID:7929331 to the glutamatergic, GABAergic
    and postsynaptic-specific assertions, beyond its recombinant pump biochemistry?
- question: How does the exact P01258 interaction record map to PMID:17689535, whose accessible
    abstract concerns calcineurin, and which peptide and phosphorylation state support the
    ATP2B2-SCRIB pair in PMID:30126976?
- question: Which target-level observations resolve differentiation, exosome detection, cochlear
    development, the precise mouse-donor locations and cardiac-conduction context?
suggested_experiments:
- description: Compare defined human PMCA2 splice products in the same cellular background
    using matched surface abundance, calcium-clearance measurements and ATP-dependent transport
    assays, separating targeting effects from intrinsic catalytic differences.
