id: Q01814
gene_symbol: ATP2B2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ATP2B2 encodes plasma membrane calcium ATPase 2 (PMCA2), a multipass P-type pump
  that uses ATP hydrolysis to export calcium from the cytosol. Its ATP-dependent phosphorylation
  cycle helps restore low cytosolic calcium after cellular activity. Alternative splicing
  of the first intracellular loop and C-terminal regulatory region changes targeting and regulation.
  In sensory hair cells, PMCA2 exports calcium from stereocilia into endolymph, helping restore
  calcium levels after mechanotransduction. Heterozygous loss-of-function variants can cause
  autosomal dominant deafness 82 (DFNA82); other variants have been described as hearing-loss
  modifiers. Calmodulin regulates the pump through its cytoplasmic regulatory region.
