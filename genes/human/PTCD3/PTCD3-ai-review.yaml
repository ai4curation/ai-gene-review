id: Q96EY7
gene_symbol: PTCD3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PTCD3 encodes mS39, a pentatricopeptide repeat (PPR) protein that is an integral,
  mitochondria-specific component of the 28S small subunit of the 55S mitochondrial ribosome.
  It associates with 12S mt-rRNA and, together with mS31, forms the mRNA entry corridor of the
  small subunit, where mitochondrial mRNAs are delivered by the LRPPRC-SLIRP complex for translation
  initiation. PTCD3 is required for mitochondrial protein synthesis; knockdown reduces translation
  and respiratory complex III and IV activity without changing mt-mRNA levels, and biallelic
  PTCD3 variants cause loss of small-subunit proteins, generalized mitochondrial translation
  defects and combined oxidative phosphorylation deficiency 51 (Leigh/Leigh-like syndrome).
