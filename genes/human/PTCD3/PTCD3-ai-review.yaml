suggested_questions:
- question: Do the PPR motifs of mS39 contact mitochondrial mRNA directly, and with any sequence
    preference, or does mS39 act only as a docking platform for LRPPRC-SLIRP?
- question: Does PTCD3 contribute to translation of all mt-mRNAs equally, or preferentially
    to LRPPRC-dependent transcripts such as MT-CO1 and MT-CO2?
suggested_experiments:
- description: Mitoribosome profiling and transcript-resolved metabolic labelling in PTCD3-knockout
    cells complemented with PPR-motif mutants, to test whether mS39 RNA contacts are needed
    for mRNA recruitment.
