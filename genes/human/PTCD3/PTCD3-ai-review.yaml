    label: mitochondrial inner membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00028608
  review:
    summary: Inner-membrane localization asserted from Reactome mitochondrial translation events,
      a mitoribosome review, and ARBA.
    action: KEEP_AS_NON_CORE
    reason: The mitoribosome is peripherally associated with the matrix face of the inner membrane
