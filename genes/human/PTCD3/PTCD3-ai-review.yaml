- term:
    id: GO:0043024
    label: ribosomal small subunit binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000417987
  - UniProtKB:Q96EY7
  review:
    summary: Ribosomal small subunit binding, from the original observation that PTCD3 co-sediments
      with the 28S subunit (IDA) and propagated by IBA/InterPro.
    action: MODIFY
    reason: PTCD3 was first described as a protein that associates with the small subunit, but
      it is now established as an integral mitoribosomal protein (mS39), resolved in cryo-EM
      structures where its PPR domain forms part of the mRNA entry site. For a ribosomal protein,
      structural constituent of ribosome is the appropriate molecular function rather than binding
      to the subunit it belongs to.
    proposed_replacement_terms:
    - id: GO:0003735
      label: structural constituent of ribosome
    supported_by:
    - reference_id: PMID:30607703
      supporting_text: PTCD3, a member of the pentatricopeptide repeat domain protein family,
        is a component of the small mitoribosomal subunit
    - reference_id: PMID:32812867
      supporting_text: Hence, the human mitoribosome evolved a specialized mechanism involving
        auxiliary factors and linker PPR protein mS39 for regulation and alignment of the transcripts
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000417987
        comment: mS39 family node; the inherited association with the small subunit is correct,
          but for an integral mitoribosomal protein it is better expressed as structural constituent
          of ribosome than as binding to the subunit.
        source_status: SUPPORTS_TRANSFER
      - source_id: UniProtKB:Q96EY7
        comment: Human PTCD3 itself, whose IDA (PMID:19427859) seeds the node; expected self-appearance,
          not circular.
        source_status: SUPPORTS_TRANSFER
