      it is now established as an integral mitoribosomal protein (mS39), resolved in cryo-EM
      structures where its PPR domain forms part of the mRNA entry site. For a ribosomal protein,
      structural constituent of ribosome is the appropriate molecular function rather than binding
      to the subunit it belongs to.
    proposed_replacement_terms: *id006
    supported_by: *id007
