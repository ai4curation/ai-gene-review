  review:
    action: KEEP_AS_NON_CORE
    summary: Context-dependent transcriptional repression by the CRD1 region is supported.
    reason: The original Methods and Results identify p300 residues1004–1044 as a repression region in
      targeted reporter assays. Fig.8 also tests untethered p300 with p53-responsive reporters. The effect
      depends on promoter and cell context, and the Discussion cautions that cofactor titration can contribute.
      Retain this experimentally supported regulatory mode as non-core alongside the predominant coactivator
      function.
