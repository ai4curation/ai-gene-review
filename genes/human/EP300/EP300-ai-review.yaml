suggested_questions:
- question: Does EP300 bind damaged DNA directly, or is its damage-site association mediated through chromatin
    proteins such as PCNA?
- question: Which endogenous substrates and physiological acyl-CoA concentrations support EP300 lactylation,
    crotonylation and other alternative acylation reactions independently of acetylation?
- question: How do EP300 recruitment/scaffolding, acetyl-lysine recognition and catalytic acetylation
    contribute separately to promoter-specific transcription in intact cells?
- question: Can selective EP300 perturbations distinguish direct neuronal differentiation and neurite-development
    roles from CREBBP compensation and pharmacological effects?
- question: Do the unresolved intronic-RNA, mitochondrial-organization and brown-fat annotations reflect
    direct EP300 activities or downstream transcriptional consequences?
