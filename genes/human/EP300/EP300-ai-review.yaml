  evidence_type: IDA
  original_reference_id: PMID:24939902
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: p300-mediated PCNA acetylation contributes to regulation of repair-associated DNA synthesis
      and PCNA turnover.
    reason: 'PMID:24939902 Figures3–8 connect direct p300/CBP acetylation of PCNA with acetylation-site
      mutants, impaired UV-induced unscheduled DNA synthesis, delayed PCNA removal and reduced degradation.
      Cellular acetylation/retention experiments primarily deplete both enzymes; Figure7D also tests separate
      depletion. This supports a contextual regulatory role in nucleotide-excision repair without assigning
      p300 the DNA synthesis or lesion-excision chemistry performed by other proteins. Original: https://doi.org/10.1093/nar/gku533.'
    supported_by:
    - reference_id: PMID:24939902
