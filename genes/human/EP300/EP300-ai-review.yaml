id: Q09472
gene_symbol: EP300
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EP300 encodes p300, a predominantly nuclear transcriptional coactivator and protein lysine
  acetyltransferase. Using acetyl-CoA, p300 modifies histones and nonhistone proteins, influencing chromatin-dependent
  transcription and regulatory-protein activity. Its interaction domains recruit and stabilize transcriptional
  complexes, while its bromodomain recognizes acetylated proteins. The enzyme also supports context-dependent
  lysine acylation with alternative acyl-CoA donors. These activities connect transcriptional responses
  to developmental and cellular signals.
