      of PCNA with acetylation-site mutants, impaired UV-induced unscheduled DNA synthesis, delayed PCNA
      release and reduced turnover. Cellular acetylation and retention experiments primarily deplete both
      enzymes, while Figure7D also tests each separately. Retain the contextual nucleotide-excision-repair
      regulatory contribution with this attribution limit; p300 does not perform lesion excision or DNA
