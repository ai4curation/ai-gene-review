      records. The normal cache contains the abstract only. Separately, official primary figure
      captions and indexed PMC Methods and relevant BAX Results were read, identifying rat C6
      as the mechanistic assay system; no whole-paper or supplementary-data assessment is claimed.
core_functions:
- description: BAG3 uses its BAG domain to bind Hsp70-family nucleotide-binding domains and
    promote nucleotide exchange and client release. This co-chaperone activity regulates productive
    folding cycles in a concentration- and partner-dependent manner.
