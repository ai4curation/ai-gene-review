- term:
    id: GO:0010664
    label: negative regulation of striated muscle cell apoptotic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    action: KEEP_AS_NON_CORE
    summary: BAG3 supports striated-muscle cell survival, a context-dependent consequence of
      its protective functions.
    reason: Human BAG3-associated myopathy includes apoptotic nuclei and severe muscle pathology
      (PMID:19085932). Cell survival is a context-dependent consequence of BAG3-mediated protein
      quality control; the disease phenotype does not establish a single autonomous apoptosis-suppressing
      mechanism. P209L can retain chaperone binding while disrupting productive client processing
      (PMID:30559338).
    additional_reference_ids:
    - PMID:19085932
    - PMID:30559338
  qualifier: involved_in
