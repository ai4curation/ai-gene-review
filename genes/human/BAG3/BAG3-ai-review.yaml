    label: chaperone-mediated autophagy
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    action: MODIFY
    summary: BAG3-directed selective macroautophagy is distinct from canonical chaperone-mediated
      autophagy.
    reason: CASA is a selective macroautophagy pathway distinct from canonical chaperone-mediated
      autophagy (PMID:20060297). BAG3 promotes disposal of aggregation-prone clients through
      chaperone coordination and aggresome targeting (PMID:18006506; PMID:21252941), supporting
      positive regulation of aggrephagy. These experiments do not assign BAG3 the direct lysosomal
      translocation step of chaperone-mediated autophagy.
    additional_reference_ids:
