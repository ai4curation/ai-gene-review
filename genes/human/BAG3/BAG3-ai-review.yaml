  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    action: KEEP_AS_NON_CORE
    summary: The broad membrane location is compatible with experimentally observed sarcolemmal
      BAG3.
    reason: Normal human muscle shows BAG3 at the Z-disc and sarcolemma (PMID:19085932). Membrane
      localization includes attached proteins and therefore does not require BAG3 to contain
      a transmembrane segment. This muscle-associated membrane pool is compatible with the broad
      PAINT localization.
