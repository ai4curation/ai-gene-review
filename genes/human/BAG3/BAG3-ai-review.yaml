- id: PMID:21561597
  title: BAG3 protein is overexpressed in human glioblastoma and is a potential target for therapy.
  findings:
  - statement: BAG3 supports cytosolic retention of BAX in association with HSP70 in rat C6
      glioma cells. Depletion promotes mitochondrial BAX localization and apoptosis. Human glioblastoma
      expression and survival experiments are distinct from these rat subcellular-fractionation
      and complex-association assays.
