    label: protein folding
  evidence_type: NAS
  original_reference_id: PMID:9873016
  review:
    action: ACCEPT
    summary: BAG3 regulates chaperone-assisted protein folding.
    reason: 'BAG3 regulates Hsp70-dependent luciferase refolding in reconstituted assays (PMID:27884606;
      PMID:30559338). The outcome depends on chaperone identity and relative concentrations:
      suitable ratios promote folding, whereas excess BAG3 can inhibit it. This is cooperation
      with the chaperone cycle rather than autonomous BAG3 holdase activity.'
