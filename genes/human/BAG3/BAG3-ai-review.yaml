- term:
    id: GO:0000774
    label: adenyl-nucleotide exchange factor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    action: ACCEPT
    summary: BAG3 is an adenyl-nucleotide exchange factor for Hsp70-family chaperones.
    reason: The BAG domain binds the Hsp70 nucleotide-binding domain and promotes nucleotide
      release. Human BAG-family comparisons and BAG3 fluorescent-nucleotide release assays support
      this exchange activity (PMID:24318877; PMID:27884606; PMID:30559338). Hsp70 supplies the
      ATPase activity.
