      BAG3-dependent chaperone cooperation can support these outcomes even though other clients
      are routed for degradation. Functional refolding experiments provide independent support
      (PMID:27884606; PMID:30559338); the detailed assay underlying the PMID:18006506 IDA was
      unavailable in the accessible abstract.
