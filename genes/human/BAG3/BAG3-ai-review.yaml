id: O95817
gene_symbol: BAG3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BAG3 is a human BAG-family co-chaperone that coordinates Hsp70-family and small
  heat-shock proteins. Its BAG domain regulates Hsp70 nucleotide exchange, while its IPV motifs
  recruit small heat-shock proteins including HSPB8 and HSPB1. This modular organization supports
  chaperone-assisted folding and routes damaged clients toward selective autophagy. BAG3 also
  couples Hsp70-associated cargo to dynein for transport to aggresomes. It acts mainly in the
  cytoplasm and at muscle Z-discs, where it helps maintain protein integrity under mechanical
  stress. Stress-dependent nuclear localization supports HSF1 regulation, and BAG3 can modulate
  cell survival in specific contexts.
