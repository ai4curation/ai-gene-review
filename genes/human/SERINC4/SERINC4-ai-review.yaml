  label: Homo sapiens
description: SERINC4 is a multipass SERINC-family membrane protein whose steady-state abundance is
  strongly limited by proteasome-mediated turnover. Family-level evidence links SERINC proteins to
  serine-derived membrane lipid synthesis, but direct purified SERINC4 phospholipid-scramblase activity
  has not been demonstrated. When human SERINC4 expression is experimentally normalized or stabilized,
  it is incorporated into HIV-1 virions and restricts HIV-1 replication in an envelope-dependent manner;
  HIV-1 Nef antagonizes this activity through lysosomal targeting. The importance of endogenous SERINC4
  abundance and activity under physiological conditions remains unresolved.
