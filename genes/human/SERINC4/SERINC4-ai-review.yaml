knowledge_gaps:
- gap_statement: The endogenous physiological contribution of SERINC4 to antiviral defense is unresolved.
  boundary: SERINC4 restricts HIV-1 when expression is normalized, stabilized, or overexpressed, but
    human SERINC4 has very low steady-state abundance in the tested system.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: The distinction between an overexpression-detectable activity and an endogenous restriction
    factor determines how broadly SERINC4 should be interpreted in host defense.
  resolution: Measure endogenous SERINC4 abundance and HIV-1 restriction in relevant primary human cell
    states, then test loss and rescue without ectopic overexpression artifacts.
  provenance:
  - reference_id: file:human/SERINC4/SERINC4-notes.md
    supporting_text: Measure endogenous SERINC4 abundance and antiviral contribution
- gap_statement: SERINC4's direct molecular activity is not established.
  boundary: Family-level evidence links SERINC proteins to membrane-lipid synthesis, and other SERINC
    paralogs have purified scramblase activity, but purified human SERINC4 has not been tested locally.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: A direct molecular activity is needed to connect SERINC4 topology and antiviral phenotype
    to a biochemical mechanism.
  resolution: Purify human SERINC4 and test non-ATP-dependent lipid flipping across phospholipid probes
    and membrane compositions, with matched SERINC2/SERINC3/SERINC5 controls.
  provenance:
  - reference_id: file:human/SERINC4/SERINC4-notes.md
    supporting_text: Determine whether purified human SERINC4 has phospholipid scramblase activity
- gap_statement: Functional differences between the two human SERINC4 isoforms are unknown.
  boundary: Reviewed UniProt defines two SERINC4 isoforms, but the available studies do not resolve
    isoform-specific stability, topology, localization, virion incorporation, Nef sensitivity, or restriction.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Isoform-specific N-terminal changes could alter the same stability and antiviral determinants
    highlighted by SERINC4 chimeras.
  resolution: Compare both isoforms under matched expression for topology, proteasomal turnover, membrane
    trafficking, Nef antagonism, virion incorporation, and HIV-1 restriction.
  provenance:
  - reference_id: file:human/SERINC4/SERINC4-notes.md
    supporting_text: Compare the two UniProt isoforms
suggested_questions:
- question: Does endogenous SERINC4 reach sufficient abundance in any human cell state to restrict retroviral
    infection?
- question: Does purified human SERINC4 have phospholipid scramblase activity, and if so, what substrate
    range and regulation distinguish it from SERINC2, SERINC3, and SERINC5?
- question: Do the two human SERINC4 isoforms differ in stability, topology, virion incorporation, Nef
    sensitivity, or antiviral potency?
suggested_experiments:
- hypothesis: SERINC4 contributes to antiviral defense only in cell states where proteasome-mediated
    turnover is reduced or SERINC4 expression is induced.
  description: Quantify endogenous SERINC4 protein abundance across primary immune and epithelial cell
    states, combine SERINC4 loss/rescue with HIV-1 infection assays, and test proteasome or signaling
    conditions without relying on overexpression.
  experiment_type: Endogenous antiviral restriction profiling
- hypothesis: SERINC4 has a direct lipid-scramblase activity that contributes to its conditional HIV-1
    restriction phenotype.
  description: Purify human SERINC4 and compare phospholipid flipping, membrane leakiness controls,
    and lipid specificity against SERINC2, SERINC3, and SERINC5 in reconstituted proteoliposomes.
  experiment_type: Purified-protein scramblase assay
- hypothesis: SERINC4 N-terminal isoform differences alter stability and antiviral activity.
  description: Express both UniProt SERINC4 isoforms under matched promoters after endogenous deletion,
    then compare proteasomal turnover, topology, cell-surface trafficking, Nef-mediated downregulation,
    virion incorporation, and HIV-1 restriction.
  experiment_type: Isoform-resolved stability and antiviral complementation
