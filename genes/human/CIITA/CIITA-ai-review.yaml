core_functions:
- description: CIITA coactivates transcription of MHC and antigen-presentation genes by engaging promoter-bound
    regulatory factors and basal transcription machinery. Its activity integrates nucleotide binding,
    protein interactions and regulated acetylation and phosphorylation. CIITA also phosphorylates protein
    substrates and acetylates histones in vitro; the allocation of these catalytic activities during cellular
    initiation remains unresolved.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  directly_involved_in:
  - id: GO:0045348
    label: positive regulation of MHC class II biosynthetic process
  - id: GO:0045345
    label: positive regulation of MHC class I biosynthetic process
  - id: GO:0045944
    label: positive regulation of transcription by RNA polymerase II
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:9171108
  - reference_id: PMID:10938133
  - reference_id: PMID:20639463
  - reference_id: PMID:24036077
  - reference_id: PMID:10464099
suggested_questions:
- question: Which CIITA catalytic reactions are required at endogenous MHC promoters, and can catalytic
    defects be separated from altered folding, nucleotide binding, recruitment or stability?
- question: How do the four human CIITA products differ in basal-factor recruitment, catalytic capacity
    and promoter selection under matched expression conditions?
- question: What promoter-specific mechanism accounts for CIITA-dependent collagen repression, and how
    does HDAC2 antagonism differ from SIRT1-mediated activation?
- question: Can the original 2008 Results and product-to-assay mapping be recovered to refine the CIITA–HDAC2
    and collagen annotations?
- question: Should the antibiotic-response source be corrected from PMID:107465 to the official MGI-linked
    PMID:16280321 and the regulated-expression readout distinguished from participation by CIITA protein?
suggested_experiments:
- description: Use matched, independently purified human CIITA products and separation-of-function mutants
    to measure nucleotide binding, serine phosphorylation and histone acetylation, with orthogonal purity
    controls and rescue at endogenous MHC loci.
- description: Compare CIITA occupancy, chromatin state and nascent transcription at MHC and collagen
    promoters while independently perturbing HDAC2, SIRT1 and the relevant promoter-bound factors.
