id: P33076
gene_symbol: CIITA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CIITA is a nuclear transcriptional coactivator that drives MHC class II and associated antigen-presentation
  gene expression and can also enhance MHC class I transcription. It associates with promoter-bound regulatory
  factors, including RFX, and basal transcription machinery rather than recognizing promoter DNA directly.
  Nucleotide binding and regulated acetylation, phosphorylation and protein stability shape its activity.
  CIITA has measured protein kinase and histone acetyltransferase capacities. Context-dependent collagen
  repression and induction of host-defense genes broaden its transcriptional effects, while loss of functional
  CIITA causes MHC class II deficiency.
