core_functions:
- description: Concentrative, Na+- and Cl--coupled symport (import) of a broad range
    of dipolar (neutral) and cationic (basic) L-amino acids across the apical plasma
    membrane, constituting system B0+ amino acid transport. Two Na+ and one Cl- are
    co-transported per amino acid, enabling uphill accumulation; substrates span
    neutral, aromatic, branched-chain and basic amino acids (favouring hydrophobic
    and cationic residues) with the notable exclusion of proline.
  molecular_function:
    id: GO:0015374
    label: neutral, basic amino acid:sodium:chloride symporter activity
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:10446133
    supporting_text: Amino acid transport was Na(+) and
  - reference_id: file:human/SLC6A14/SLC6A14-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Mediates the uptake
      of a broad range of neutral and cationic amino acids (with the
      exception of proline) in a Na(+)/Cl(-)-dependent manner
- description: Na+/Cl--coupled transmembrane transport of carnitine and acylcarnitines
    (and related amino-acid-derived prodrugs), a genuine secondary transport activity
    of the same transporter relevant to intestinal carnitine absorption.
  molecular_function:
    id: GO:1901235
    label: (R)-carnitine transmembrane transporter activity
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  supported_by:
  - reference_id: PMID:17855766
    supporting_text: ATB(0,+) is a low-affinity/high-capacity
  - reference_id: file:human/SLC6A14/SLC6A14-uniprot.txt
    record_section: ["CC:CATALYTIC ACTIVITY"]
    supporting_text: Reaction=(R)-carnitine(out) + chloride(out) + 2 Na(+)(out)
suggested_questions:
- question: What is the physiological hierarchy of SLC6A14 substrates in vivo, and
    which tissues depend on it for amino acid (or carnitine) supply given the
    overlapping specificity of co-expressed transporters?
- question: Does SLC6A14 upregulation in epithelial cancers and inflamed intestine
    reflect a nutrient-supply (glutamine/arginine) dependency that is therapeutically
    targetable?
suggested_experiments:
- description: Tissue-specific conditional knockout of Slc6a14 in mouse lung, salivary
    gland and intestinal epithelium with quantification of luminal amino acid and
    carnitine absorption, to define its non-redundant in vivo contribution.
- description: Cryo-EM structure determination of human SLC6A14 with bound substrate,
    Na+ and Cl- to map the determinants of its unusually broad (neutral + cationic)
    substrate selectivity and the proline exclusion.
knowledge_gaps:
- gap_statement: The in vivo physiological role and non-redundant substrate
    contribution of SLC6A14 in its major expression sites (lung, salivary gland,
    mammary gland) are undetermined; no human loss-of-function phenotype is
    established beyond statistical obesity associations.
  boundary: SLC6A14 is firmly established in vitro as the Na+/Cl--coupled system B0+
    transporter of broad neutral and cationic amino acids and of carnitine.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: Defining its non-redundant physiological role would clarify its
    contribution to epithelial amino acid absorption and its proposed exploitation
    in cancer nutrient supply.
