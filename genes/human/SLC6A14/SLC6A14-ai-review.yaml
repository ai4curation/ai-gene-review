id: Q9UN76
gene_symbol: SLC6A14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC6A14 (ATB0+) is a plasma-membrane amino acid transporter of the SLC6
  (sodium:neurotransmitter symporter / SNF) family that constitutes the molecular
  basis of system B0+. It catalyses concentrative, Na+- and Cl--coupled symport
  (import) of a broad range of dipolar (neutral) and cationic (basic) L-amino acids,
  with the notable exception of proline, favouring hydrophobic and cationic amino
  acids and accepting non-alpha-amino acids such as beta-alanine at lower affinity.
  Each transport cycle couples two Na+ and one Cl- to the uphill movement of one
  amino acid substrate, giving it unusually high concentrative capacity. Beyond
  amino acids it also transports carnitine and acylcarnitines (and amino-acid-related
  drugs/prodrugs such as valaciclovir), coupled to the same Na+/Cl- gradients. The
  protein is a polytopic (12-transmembrane) glycoprotein localized to the apical
  (brush-border) membrane of epithelial cells, with highest expression in lung,
  trachea, salivary gland and mammary gland and lower levels in gastrointestinal
  tract and other tissues, where it contributes to epithelial amino acid absorption
  and delivery of amino acids for cell growth. SLC6A14 is strongly upregulated in
  several epithelial cancers and in inflamed intestinal epithelium, and allelic
  variants have been associated with obesity susceptibility.
