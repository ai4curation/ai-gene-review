    label: neurotransmitter transport
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-442660
  qualifier: involved_in
  review:
    summary: Reactome groups SLC6A14 under "SLC-mediated transport of
      neurotransmitters" by virtue of its membership in the SLC6
      (neurotransmitter:sodium symporter) family.
    action: MARK_AS_OVER_ANNOTATED
    reason: Although SLC6A14 can transport glycine (which is also a neurotransmitter),
      it is an epithelial broad-specificity nutrient amino acid transporter expressed
      in lung, salivary gland, mammary gland and gut, not a synaptic/neuronal
      transporter, and has no established role in neurotransmission. The
      "neurotransmitter transport" grouping is a family-level over-annotation; its
      genuine role is Na+/Cl--coupled amino acid absorption.
    supported_by:
    - reference_id: file:human/SLC6A14/SLC6A14-uniprot.txt
      record_section: ["CC:TISSUE SPECIFICITY"]
