- term:
    id: GO:0009636
    label: response to toxic substance
  evidence_type: IDA
  original_reference_id: PMID:17575980
  qualifier: involved_in
  review:
    summary: SLC6A14 mRNA/protein is upregulated in the intestinal epithelium of
      acute cholera patients relative to convalescence.
    action: MARK_AS_OVER_ANNOTATED
    reason: The evidence is differential expression (SLC6A14 upregulated during
      cholera), not a demonstration that the transporter itself executes a response
      to the toxin. Changed expression of a nutrient transporter during infection is
      a transcriptional/host adaptation; SLC6A14 does not perform the work of a toxin
      response, so this is an over-annotation of the gene's function. Its documented
      function remains amino acid transport.
    supported_by:
    - reference_id: PMID:17575980
      supporting_text: Two amino acid transporters, SLC7A11 and SLC6A14, were upregulated
        in acute cholera patients compared to convalescence
