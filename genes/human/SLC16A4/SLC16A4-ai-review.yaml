description: 'SLC16A4 encodes monocarboxylate transporter 5 (MCT5; historically also called MCT4), a multi-pass
  plasma-membrane protein of the SLC16/monocarboxylate-transporter family within the major facilitator
  superfamily (monocarboxylate porter family, TC 2.A.1.13). Like its characterised relatives it is predicted
  to have a 12-transmembrane-helix topology with a large cytoplasmic loop between helices 6 and 7 and
  to act as a proton-coupled monocarboxylate transporter. MCT5 is one of the uncharacterised (''orphan'')
  members of the family: its specific physiological substrate(s), transport mechanism and tissue roles
  have not been established experimentally, and its functional assignment rests on sequence homology within
  the MCT family rather than on direct transport assays.'
