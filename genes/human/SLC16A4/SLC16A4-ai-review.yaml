suggested_questions:
- question: What endogenous substrate(s), if any, does human MCT5 (SLC16A4) transport, and is it a 
    proton-coupled monocarboxylate carrier like the characterised MCT1-4?
suggested_experiments:
- description: Express human SLC16A4 in Xenopus oocytes or mammalian cells (with and without 
    basigin/embigin ancillary subunits) and screen radiolabelled monocarboxylates (lactate, 
    pyruvate, ketone bodies, short-chain fatty acids) and candidate drug substrates for transport to
    identify the substrate and ion-dependence of this orphan transporter.
