id: Q9Y2L9
gene_symbol: LRCH1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRCH1 is a cytoplasmic leucine-rich-repeat and calponin-homology-domain protein
  that restrains chemokine-guided T-cell migration. Its leucine-rich repeats bind
  the catalytic DHR-2 region of DOCK8, competing with Cdc42 and reducing
  DOCK8-dependent Cdc42 activation. Chemokine-induced PKC-alpha phosphorylation of
  DOCK8 releases it from LRCH1 and permits its recruitment to the leading edge of
  migrating T cells. Suppression of CXCL12-directed migration has also been observed
  after LRCH1 manipulation in primary human CD4-positive T cells. LRCH1 associates
  with DOCK7, although an effect on DOCK7 exchange activity has not been established.
  Additional studies implicate LRCH1 in LAT signaling and in the restraint of
  lymphocyte and microglial activation, with much of that evidence confined to
  engineered immune cells or mouse and rat models. Three splice isoforms are known,
  but their endogenous functional differences and any direct actin-binding activity
  of the calponin-homology domain remain unresolved.
