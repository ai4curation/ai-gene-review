suggested_questions:
- question: >-
    Does endogenous human LRCH1 inhibit the nucleotide-exchange activity of DOCK7 or
    other DOCK-C-family GEFs, or is functional inhibition selective for DOCK8?
  experts:
  - Rho GTPase signaling experts
  - T-cell migration experts
- question: >-
    Which LRCH1 residues contact the DOCK8 DHR-2 domain, and how does phosphorylation
    of DOCK8 at Ser2077, Ser2082, and Ser2087 destabilize that interaction?
  experts:
  - Structural biologists
  - DOCK-family experts
- question: >-
    Does the LRCH1 calponin-homology domain bind actin directly in human cells, and is
    it required for LRCH1 localization or regulation of chemotaxis?
  experts:
  - Cytoskeleton experts
- question: >-
    Are the three endogenous LRCH1 splice isoforms differentially expressed or
    functionally specialized across human T-cell and NK-cell states?
  experts:
  - Human immunologists
  - Isoform biology experts
suggested_experiments:
- hypothesis: >-
    The LRCH1 leucine-rich-repeat region directly inhibits DOCK8 by occupying a
    Cdc42-interaction surface on its DHR-2 domain.
  description: >-
    Reconstitute nucleotide exchange with purified DOCK8 DHR-2, Cdc42, and full-length
    LRCH1 or a systematic LRCH1 deletion and point-mutant series. Quantify exchange
    kinetics and binding, then determine the structure of the inhibitory complex and
    test interface mutants by rescue in LRCH1-deficient primary human T cells.
  experiment_type: biochemistry and structural biology
- hypothesis: >-
    Chemokine-induced DOCK8 phosphorylation is the switch that releases endogenous
    DOCK8 from LRCH1 and restores localized Cdc42 activation in human T cells.
  description: >-
    Introduce phospho-null and phosphomimetic substitutions at endogenous DOCK8 in
    primary human CD4-positive T cells, and combine proximity measurements, a Cdc42
    activity biosensor, live leading-edge imaging, and CXCL12 chemotaxis assays before
    and after acute LRCH1 depletion.
  experiment_type: cell signaling and live-cell imaging
- hypothesis: >-
    LRCH1 association with DOCK7 is biochemical but does not reproduce its inhibitory
    effect on DOCK8.
  description: >-
    Compare purified DOCK7 and DOCK8 DHR-2 exchange reactions in the presence of LRCH1,
    map partner interfaces in matched human cells, and test whether selectively
    disrupting each interaction changes Cdc42 activation and chemotaxis.
  experiment_type: comparative biochemistry
- hypothesis: >-
    Endogenous LRCH1 isoforms differ in partner preference or immune-cell regulatory
    activity.
  description: >-
    Use long-read RNA sequencing and isoform-specific proteomics across resting and
    chemokine-stimulated primary human T-cell and NK-cell subsets, followed by
    isoform-specific rescue of an LRCH1-null background to compare DOCK8, DOCK7, and
    LAT association, localization, Cdc42 activation, migration, and cytokine outputs.
  experiment_type: isoform-resolved functional genomics
