- id: PMID:28028151
  title: LRCH1 interferes with DOCK8-Cdc42-induced T cell migration and ameliorates
    experimental autoimmune encephalomyelitis.
  findings:
  - statement: LRCH1 competes with Cdc42 for DOCK8 binding and restrains T-cell migration.
    supporting_text: >-
      Using two screening systems, we found that LRCH1 competes with Cdc42 for
      interaction with DOCK8 and restrains T cell migration.
    reference_section_type: ABSTRACT
  - statement: >-
      LRCH1 binds the catalytic DHR-2 domain of DOCK8 and restricts its guanyl-nucleotide
      exchange activity.
    supporting_text: >-
      Next, we identified that LRCH1 competes with Cdc42 for binding to the catalytic
      DHR-2 domain of DOCK8 and restricts the GEF activity of DOCK8.
    reference_section_type: DISCUSSION
  - statement: >-
      Chemokine stimulation promotes PKC-alpha-dependent DOCK8 release from LRCH1
      and DOCK8 movement to the leading edge.
    supporting_text: >-
      In response to chemokine stimulation, PKCα phosphorylates DOCK8 at its three
      serine sites, promoting DOCK8 separation from LRCH1 and translocation to the
      leading edge to guide T cell migration.
    reference_section_type: ABSTRACT
  - statement: >-
      The downstream autoimmune phenotype was established in mouse EAE models and
      should not be generalized as direct human disease mechanism.
    supporting_text: >-
      Importantly, Dock8 mutant mice or Lrch1 transgenic mice were protected from
      MOG (35-55) peptide-induced experimental autoimmune encephalomyelitis (EAE),
      whereas Lrch1-deficient mice displayed a more severe phenotype.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text and PubMed metadata checked. This is the decisive DOCK8-Cdc42 and
      chemokine-guided T-cell migration study, but it mixes human screening/cell
      systems with mouse primary-cell and EAE experiments; organism and assay
      boundaries must be retained claim by claim.
- id: PMID:29467281
  title: The MYO6 interactome reveals adaptor complexes coordinating early endosome
    and cytoskeletal dynamics.
  findings:
  - statement: LRCH1 co-immunoprecipitates DOCK7 but was not observed to interact with MYO6.
    supporting_text: >-
      Although other LRCH family members such as LRCH1 were identified in the MYO6
      and DOCK7 BioID data sets, no interaction between LRCH1 and MYO6 was observed,
      although LRCH1 did co‐immunoprecipitate DOCK7
    reference_section_type: RESULTS
  - statement: >-
      DOCK7 proximity labeling recovered LRCH1, LRCH3, and LRCH4, but the paper's
      mapped MYO6-linker and cytoskeletal mechanism concerns LRCH3 rather than LRCH1.
    supporting_text: >-
      BirA*‐DOCK7 labelling identified only three high‐confidence interactions, all
      of which were LRCH family proteins (LRCH1, LRCH3 and LRCH4)
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text and PubMed metadata checked. It directly supports an LRCH1-DOCK7
      association and explicitly refutes LRCH1-MYO6 binding in the tested system;
      the LRCH3-MYO6-DOCK7 DISP-complex and septin-remodeling functions must not be
      transferred to LRCH1.
