knowledge_gaps:
- gap_statement: >-
    The structural interface by which the LRCH1 leucine-rich-repeat region occludes
    Cdc42 binding to the DOCK8 DHR-2 domain has not been resolved, and the residues
    that determine inhibition are unknown.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    An interface-level mechanism would distinguish direct catalytic inhibition from
    sequestration and reveal how DOCK8 phosphorylation promotes dissociation from
    LRCH1.
  provenance:
  - reference_id: PMID:28028151
    supporting_text: >-
      Using two screening systems, we found that LRCH1 competes with Cdc42 for
      interaction with DOCK8 and restrains T cell migration.
- gap_statement: >-
    LRCH1 co-immunoprecipitates with DOCK7, but it is unknown whether LRCH1 inhibits
    DOCK7 nucleotide-exchange activity or whether this association has a distinct
    cellular consequence.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving this question would determine whether GEF inhibition is selective for
    DOCK8 or is a broader activity toward DOCK-C-family proteins.
  provenance:
  - reference_id: PMID:29467281
    supporting_text: >-
      Although other LRCH family members such as LRCH1 were identified in the MYO6
      and DOCK7 BioID data sets, no interaction between LRCH1 and MYO6 was observed,
      although LRCH1 did co‐immunoprecipitate DOCK7
- gap_statement: >-
    Direct actin binding by the calponin-homology domain of human LRCH1 has not been
    demonstrated, and the cortical function reported for the single Drosophila LRCH
    protein has not been resolved among the four human paralogues.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Direct biochemical evidence is needed before the domain architecture can be
    interpreted as a cytoskeletal molecular activity of human LRCH1.
  provenance:
  - reference_id: PMID:20805893
    supporting_text: >-
      Taking advantage of the existence of a single LRCH gene in flies, dLRCH, we
      explored its function in cultured cells, and show that dLRCH act to stabilize
      the cell cortex during cell division.
- gap_statement: >-
    The endogenous expression, localization, and partner specificity of the three
    LRCH1 splice isoforms have not been compared in immune cells.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Isoform-resolved measurements are required to determine whether the DOCK8,
    DOCK7, and LAT observations apply to all LRCH1 products or to a restricted
    endogenous isoform.
- gap_statement: >-
    It remains unclear whether the DOCK8 and LAT mechanisms operate in the same
    endogenous human T-cell state and whether the Src/Lck and inflammatory phenotypes
    observed in other immune contexts reflect the same proximal LRCH1 activity.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: >-
    Defining the relationship among these mechanisms would separate a conserved
    proximal immune-signaling role from cell-type-specific downstream effects.
  provenance:
  - reference_id: PMID:32727906
    supporting_text: >-
      Here we have demonstrated that LRCH1 (leucine-rich repeats and calponin homology
      domain containing 1) directly binds LAT, reduces LAT phosphorylation and
      interaction with GRB2, and also promotes the endocytosis of LAT.
