- id: PMID:32727906
  title: LRCH1 deficiency enhances LAT signalosome formation and CD8(+) T cell responses
    against tumors and pathogens.
  findings:
  - statement: >-
      LRCH1 binds LAT, reduces LAT phosphorylation and GRB2 association, and promotes
      LAT endocytosis in the study's T-cell signaling system.
    supporting_text: >-
      Here we have demonstrated that LRCH1 (leucine-rich repeats and calponin homology
      domain containing 1) directly binds LAT, reduces LAT phosphorylation and
      interaction with GRB2, and also promotes the endocytosis of LAT.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      LRCH1 knockout increased migration and proliferation of human glypican-3 CAR T
      cells in vitro; this is an engineered-cell context.
    supporting_text: >-
      Furthermore, knockout of LRCH1 in human chimeric antigen receptor (CAR) T cells
      that recognize the liver tumor-associated antigen glypican-3 could improve CAR
      T cell migration and proliferation in vitro.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and abstract checked; cached full text is unavailable. The LAT
      mechanism and infection/tumor phenotypes are largely bounded by mouse experiments,
      whereas the explicit human result is limited to engineered CAR T cells in vitro.
- id: PMID:32210709
  title: LRCH1 suppresses migration of CD4(+) T cells and refers to disease activity
    in ulcerative colitis.
  findings:
  - statement: >-
      Manipulating LRCH1 in human peripheral CD4-positive T cells altered CXCL12-directed
      migration without altering T-cell differentiation or the assayed cytokines.
    supporting_text: >-
      Up or down regulation of LRCH1 did not affect the differentiation of CD4+ T
      cells, and the related cytokines expression. Moreover, LRCH1 inhibited migratory
      capacity of CD4+ T cells toward CXCL12 by PKCα.
    reference_section_type: ABSTRACT
  - statement: >-
      LRCH1 expression was lower in active ulcerative-colitis mucosa and PBMCs and
      inversely associated with disease activity.
    supporting_text: >-
      LRCH1 expression was highly decreased in colonic mucosa and PBMCs from patients
      with A-UC, and negatively correlated with disease activity.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text and PubMed metadata checked. The human primary-cell migration result
      corroborates negative regulation of chemotaxis; the ulcerative-colitis expression
      correlation is disease context and does not establish causality.
- id: PMID:32631435
  title: Inhibition of leucine-rich repeats and calponin homology domain containing
    1 accelerates microglia-mediated neuroinflammation in a rat traumatic spinal cord
    injury model.
  findings:
  - statement: >-
      LRCH1 knockdown enhanced inflammatory cytokine production and p38/ERK signaling
      in primed rat microglia.
    supporting_text: >-
      LRCH1 knockdown increased the production of pro-inflammatory cytokines such as
      IL-1β, TNF-α, and IL-6 after in vitro priming with lipopolysaccharide and adenosine
      triphosphate.
    reference_section_type: ABSTRACT
  - statement: The study was explicitly performed in primary microglia and a rat SCI model.
    supporting_text: >-
      To elucidate the significance of LRCH1 to microglial functions, we applied
      lentivirus-induced LRCH1 knockdown in primary microglia culture and tested the
      role of LRCH1 in microglia-mediated inflammatory reaction both in vitro and in
      a rat SCI model.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text and PubMed metadata checked. This is useful immune-context evidence,
      but it is rat microglia/rat spinal-cord injury and should not be promoted to a
      direct human LRCH1 core mechanism without human confirmation.
- id: PMID:32173150
  title: Leucine rich repeats and calponin homology domain containing 1 inhibits NK-92
    cell cytotoxicity through attenuating Src signaling.
  findings:
  - statement: >-
      LRCH1 knockout increased NK-92 cytotoxicity and activation of Src and Lck after
      tumor-cell contact.
    supporting_text: >-
      Further experiments revealed that LRCH1 knockout enhanced the activation of Src
      and Lck kinase which are important for natural killer cell cytotoxicity.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  - statement: >-
      LRCH1 knockout also increased IFN-gamma and TNF-alpha production in primary human
      natural killer cells.
    supporting_text: >-
      Importantly, human primary natural killer cells exhibited a similar increase in
      the production of IFN-γ and TNF-α when LRCH1 was knocked out.
    reference_section_type: ABSTRACT
    full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed metadata and abstract checked; full text is unavailable. Most mechanistic
      detail is from the NK-92 cell line, with a bounded cytokine result in primary
      human NK cells; direct LRCH1-Src/Lck binding is not shown by the abstract.
- id: PMID:20805893
  title: 'LRCH proteins: a novel family of cytoskeletal regulators.'
  findings:
  - statement: >-
      The sole Drosophila LRCH protein stabilizes the cell cortex during division,
      but this family-level result cannot be assigned specifically to human LRCH1.
    supporting_text: >-
      Taking advantage of the existence of a single LRCH gene in flies, dLRCH, we
      explored its function in cultured cells, and show that dLRCH act to stabilize
      the cell cortex during cell division.
    reference_section_type: ABSTRACT
  - statement: Human LRCH1-4 share the combined LRR and calponin-homology architecture.
    supporting_text: >-
      In human, only four highly-related proteins (hLRCH1-4) simultaneously harbor
      these two motifs.
    reference_section_type: RESULTS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text and PubMed metadata checked. It supports LRCH-family architecture and
      a cytoskeletal hypothesis, but the functional experiments concern the single fly
      dLRCH ortholog; mitotic-cortex and spindle roles are not direct human LRCH1 evidence.
core_functions:
- description: >-
    LRCH1 binds the catalytic DHR-2 region of DOCK8 through its leucine-rich-repeat
    region and limits access of Cdc42, thereby inhibiting DOCK8 guanyl-nucleotide
    exchange activity. In resting T cells this cytoplasmic inhibitory mechanism
    restrains Cdc42 activation and chemokine-guided migration; chemokine-induced
    PKC-alpha phosphorylation releases DOCK8 from LRCH1 for leading-edge recruitment.
    The molecular mechanism was defined in biochemical and cellular systems together
    with mouse T-cell experiments, while inhibition of CXCL12-directed migration in
    primary human CD4-positive T cells independently supports the human cellular role.
  supported_by:
  - reference_id: PMID:28028151
    supporting_text: >-
      Next, we identified that LRCH1 competes with Cdc42 for binding to the catalytic
      DHR-2 domain of DOCK8 and restricts the GEF activity of DOCK8.
  - reference_id: PMID:28028151
    supporting_text: >-
      Using two screening systems, we found that LRCH1 competes with Cdc42 for
      interaction with DOCK8 and restrains T cell migration.
  - reference_id: PMID:28028151
    supporting_text: >-
      In response to chemokine stimulation, PKCα phosphorylates DOCK8 at its three
      serine sites, promoting DOCK8 separation from LRCH1 and translocation to the
      leading edge to guide T cell migration.
  - reference_id: PMID:32210709
    supporting_text: >-
      Up or down regulation of LRCH1 did not affect the differentiation of CD4+ T
      cells, and the related cytokines expression. Moreover, LRCH1 inhibited migratory
      capacity of CD4+ T cells toward CXCL12 by PKCα.
