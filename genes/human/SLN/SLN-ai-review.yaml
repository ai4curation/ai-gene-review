gene_symbol: SLN
aliases:
- sarcolipin
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Sarcolipin (SLN) is a 31-amino-acid single-pass transmembrane peptide of the sarcoplasmic
  reticulum (SR) membrane and a member of the regulin family of SERCA calcium-pump regulatory subunits,
  with phospholamban (PLN), myoregulin, endoregulin, another-regulin and DWORF. It has a short cytosolic
  N-terminus, a transmembrane helix and a conserved lumenal C-terminal tail (RSYQY) that is required for
  function. SLN binds SERCA1a and SERCA2a in the same transmembrane groove used by PLN, lowers the pump's
  apparent Ca2+ affinity and so slows Ca2+ re-uptake into the SR; it acts synergistically with PLN and
  can bind PLN and other regulins. It is most abundant in fast-twitch skeletal muscle and, in the heart,
  in the atria, where its protein level falls in human atrial fibrillation. In mouse, SLN stays bound
  to SERCA at high Ca2+ and uncouples ATP hydrolysis from Ca2+ transport, which makes it necessary for
  muscle-based non-shivering thermogenesis and influences whole-body energy metabolism.
