- term:
    id: GO:0004857
    label: enzyme inhibitor activity
  evidence_type: ISS
  original_reference_id: PMID:12032137
  qualifier: enables
  supporting_entities:
  - UniProtKB:P42532
  review:
    summary: ISS from rabbit sarcolipin (P42532). SLN lowers the apparent Ca2+ affinity of SERCA1a and
      SERCA2a; human SLN behaves the same in HEK-293 co-expression.
    action: MODIFY
    reason: 'The inhibition of SERCA is the core activity of SLN and is well supported, but enzyme inhibitor
      activity is too general and a loose fit: in current GO the regulin target term GO:0042030 ATPase
      inhibitor activity sits under molecular function inhibitor activity, not under enzyme inhibitor
      activity. GO:0042030 names the activity inhibited and is the term carried by the paralog PLN (IDA,
      IBA) and used in the MRLN and ERLN reviews.'
    proposed_replacement_terms:
    - &id001
      id: GO:0042030
      label: ATPase inhibitor activity
    additional_reference_ids:
    - PMID:9575189
    - PMID:23455424
    supported_by:
    - reference_id: PMID:12032137
      supporting_text: NF-SLN can reduce the apparent Ca(2+) affinity of both SERCA1a (DeltaK(Ca) = -0.22
        +/- 0.01 pCa units) and SERCA2a (DeltaK(Ca) = -0.37 +/- 0.04 pCa units).
    - reference_id: PMID:9575189
      supporting_text: Coexpression of native rabbit SLN or NF-SLN with SERCA1 decreased the apparent
        affinity of SERCA1 for Ca2+ but stimulated maximal Ca2+ uptake rates (Vmax).
    - reference_id: PMID:23455424
      supporting_text: The regulatory SLN traps the Ca(2+)-ATPase in a previously undescribed E1 state,
        with exposure of the Ca(2+) sites through an open cytoplasmic pathway stabilized by Mg(2+).
