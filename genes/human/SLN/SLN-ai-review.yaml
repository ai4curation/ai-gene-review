core_functions:
- description: Sarcolipin is a transmembrane regulatory subunit of the SERCA calcium pump in the SR membrane.
    Its helix binds SERCA1a/SERCA2a in the regulin groove and lowers the apparent Ca2+ affinity of the
    pump, slowing Ca2+ re-uptake into the SR; in mouse it also uncouples ATP hydrolysis from Ca2+ transport.
