suggested_questions:
- question: Should SERCA inhibition by regulins (PLN, SLN, MRLN, ERLN, ALN) be annotated as GO:0042030
    ATPase inhibitor activity or GO:0141110 transporter inhibitor activity? SLN in particular inhibits
    Ca2+ transport more than ATP hydrolysis (uncoupling), which arguably fits the transporter term better;
    PLN currently carries both.
- question: Does human SLN uncouple SERCA and contribute to non-shivering thermogenesis in human skeletal
    muscle, as shown in mouse?
suggested_experiments:
- hypothesis: Human SLN uncouples SERCA1a ATP hydrolysis from Ca2+ transport.
  description: Co-reconstitute synthetic human SLN with purified human SERCA1a in proteoliposomes and
    measure ATPase activity and Ca2+ uptake in parallel to obtain the coupling ratio; include the C-terminal
    RSYQY deletion as a control.
  experiment_type: in vitro reconstitution enzyme kinetics
