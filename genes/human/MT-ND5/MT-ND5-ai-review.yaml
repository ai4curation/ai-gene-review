  review:
    summary: >-
      IBA annotation to electron transport coupled proton transport.
    action: ACCEPT
    reason: >-
      The membrane arm of Complex I is the proton pump, and ND5 forms part of one of its four proton-translocation
      units. Proton transport coupled to electron transfer is core work done by this subunit, not a downstream
      consequence.
