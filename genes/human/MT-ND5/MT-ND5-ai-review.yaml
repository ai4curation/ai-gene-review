- term:
    id: GO:0032981
    label: mitochondrial respiratory chain complex I assembly
  evidence_type: IMP
  original_reference_id: PMID:15250827
  qualifier: involved_in
  review:
    summary: >-
      IMP annotation to mitochondrial respiratory chain complex I assembly.
    action: KEEP_AS_NON_CORE
    reason: >-
      Loss or pathogenic variants of ND5 block or destabilise Complex I assembly, and ND5 enters at a
      defined assembly step. This shows ND5 is a required building block of the complex rather than an
      assembly factor; the annotation is kept, but the core role is catalytic (contribution to proton-pumping
      NADH:ubiquinone oxidoreduction).
    supported_by:
