id: P03915
gene_symbol: MT-ND5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  MT-ND5 encodes NADH-ubiquinone oxidoreductase chain 5 (ND5), the largest mitochondrial-DNA-encoded core
  subunit of respiratory Complex I. This 603-residue protein in the inner mitochondrial membrane is the
  most distal of the three antiporter-like (Mrp-family) subunits (ND2, ND4, ND5) of the membrane arm.
  Each of these subunits carries a proton-translocation unit with a conserved central lysine/histidine
  axis. ND5's long lateral helix spans the arm, and proton expulsion has been proposed to occur from ND5.
  ND5 joins the complex late in assembly together with ND4. It is required for the proton-pumping NADH:ubiquinone
  oxidoreductase activity of the complex. Pathogenic variants, notably m.13513G>A, are a frequent cause
  of MELAS, Leigh syndrome and their overlap, and occasionally of LHON.
