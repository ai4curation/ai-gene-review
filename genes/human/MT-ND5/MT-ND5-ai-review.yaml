- term:
    id: GO:0015078
    label: proton transmembrane transporter activity
  evidence_type: ISS
  original_reference_id: PMID:36920092
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation: ND5 enables proton transmembrane transporter activity as the distal antiporter-like
      proton-translocation unit of Complex I.
    action: NEW
    reason: >-
      ND5 is one of three antiporter-like (Mrp-family) subunits of the Complex I membrane arm. Each carries
      a proton-uptake and a proton-exit half-channel, and current mechanisms place final proton expulsion
      in the distal antiporter-like subunit. Translocating protons is the subunit-level activity by which
      ND5 contributes to the complex's proton-pumping NADH:ubiquinone oxidoreductase activity. The evidence
      comes from structures of the conserved mammalian and bacterial enzyme, so ISS.
    supported_by:
    - reference_id: PMID:36920092
      supporting_text: The rest of MA is formed by three homologous antiporter-like subunits (ALS), ND2/NuoN,
        ND4/NuoM and ND5/NuoL, containing 14 conserved transmembrane helices (TM) each.
    - reference_id: PMID:36920092
      supporting_text: eventually resulting in proton expulsion from the distal antiporter-like subunit
    - reference_id: PMID:32747785
      supporting_text: The four units each comprise a proton-uptake and a proton-exit half-channel
core_functions:
- description: >-
    Distal antiporter-like (Mrp-family) core subunit of the Complex I membrane arm. ND5 carries the most
    distal of the four proton-translocation units and its long lateral helix spans the arm. It contributes
    to the complex's proton-pumping NADH:ubiquinone oxidoreductase activity by translocating protons across
    the inner membrane.
