- term:
    id: GO:0140659
    label: cytoskeletal motor regulator activity
  evidence_type: IDA
  original_reference_id: PMID:37086789
  review:
    summary: NDEL1 binds cytoplasmic dynein (intermediate chain N-terminus) and LIS1 and modulates dynein
      activation.
    action: NEW
    reason: 'The defining molecular activity of NDEL1 is regulation of cytoplasmic dynein: it binds the
      dynein intermediate chain and recruits LIS1 to dynein, promoting assembly of active dynein-dynactin-adaptor
      complexes in vivo, while in reconstitutions with purified human proteins it can also restrain activation.
      ''Binds to and modulates the activity of a motor protein'' fits both directions and replaces the
      uninformative protein binding rows. LIS1 carries the same term in the nucleokinesis module.'
    supported_by:
    - &id022
      reference_id: PMID:37086789
      supporting_text: we observed that Ndel1 inhibits dynein activation in two distinct ways
    - reference_id: PMID:37086789
      supporting_text: here we found that the C-terminal region of Ndel1 contributes to dynein binding
        and negatively regulates binding to Lis1
    - &id023
      reference_id: PMID:37730751
      supporting_text: the latter of which recruits LIS1 to drive complex assembly
    - reference_id: PMID:20403325
      supporting_text: We find that NudE stably recruits LIS1 to the dynein holoenzyme molecule
    - &id021
      reference_id: PMID:15473966
      supporting_text: positively regulates dynein activity by facilitating the interaction between LIS1
        and dynein
    - reference_id: file:human/NDEL1/NDEL1-deep-research-falcon.md
      supporting_text: NDEL1 acts upstream and spatially within this pathway rather than functioning as
        the motor itself.
- term:
    id: GO:0030473
    label: nuclear migration along microtubule
  evidence_type: ISS
  original_reference_id: PMID:38194050
  review:
    summary: NDEL1 is required, as a LIS1/dynein regulator, for dynein-driven nuclear translocation in
      migrating cortical neurons.
    action: NEW
    reason: 'Participation test: the dynein motor does the pulling, and NDEL1 contributes the regulatory
      activity (LIS1 recruitment to dynein) that the step depends on, the same role for which LIS1/PAFAH1B1
      carries nuclear migration (comparator check: PAFAH1B1 GO:0007097, DYNC1H1 GO:0007097). Genetic loss
      of Ndel1 abolishes nuclear movement and uncouples nucleus and centrosome in mouse cortex; the evidence
      is from mouse and rat, transferred to the conserved human ortholog. A de novo human NDEL1 variant
      (p.R105P) found in pachygyria/subcortical band heterotopia abolishes LIS1 binding and, expressed
      in mouse cortex, impairs nucleus-centrosome coupling and nucleokinesis.'
    supported_by:
    - *id020
    - reference_id: PMID:38194050
      supporting_text: Mechanistically, p.R105P disrupted NDEL1 binding to the dynein regulator LIS1.
    - *id012
    - *id019
    - *id021
- term:
    id: GO:0034454
    label: microtubule anchoring at centrosome
  evidence_type: IMP
  original_reference_id: PMID:16291865
  review:
    summary: NDEL1 depletion in human HeLa cells reduces centrosomal microtubule anchoring; NDEL1 tethers
      dynein/dynactin at the mother centriole.
    action: NEW
    reason: Silencing NDEL1 represses centrosomal microtubule nucleation and anchoring, and NDEL1 is needed
      to target dynactin, LIS1, PCM-1, pericentrin and gamma-tubulin to the centrosome. NDEL1 contributes
      adaptor/tethering activity at the mother centriole that anchoring depends on, so it participates
      rather than being merely required. UniProt records the same function.
    supported_by:
    - *id003
    - &id024
      reference_id: PMID:16291865
      supporting_text: Moreover, Nudel seems to tether dynactin and dynein to the mother centriole for
        MT anchoring.
    - reference_id: file:human/NDEL1/NDEL1-uniprot.txt
      supporting_text: Required for organization of the cellular microtubule array and microtubule anchoring
        at the centrosome.
