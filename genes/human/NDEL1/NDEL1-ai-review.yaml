      binding is removed rather than kept; removal does not dispute the reported interaction. The informative
      activity of NDEL1 -- binding the dynein intermediate chain and recruiting LIS1 so as to regulate
      dynein -- is captured by the proposed NEW annotation to GO:0140659 cytoskeletal motor regulator
