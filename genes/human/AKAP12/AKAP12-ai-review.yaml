  review:
    summary: >-
      Barrier formation is one of AKAP12's best-replicated biological roles, but the
      knockdown in the cited study used mouse-specific siRNA in mouse endothelial cells, so
      the code is ISS and not IMP.
    action: NEW
    reason: >-
      GOA's only barrier-related row is GO:0043116, whose rodent provenance is sign-inverted
      (see that row). This term states the positive claim directly and rests on evidence
      that the Compara transfer did not use. The species check matters: although the study
      analysed human, mouse and rat material, the methods state that down-regulation used
      mouse-specific siRNA and the knockdown barrier measurements were made in MyEnd mouse
      endothelial cells, so IMP would assert a human experiment that was not performed. The
      supporting entity is mouse Akap12 (Q9WTQ5, reviewed, 1684 aa), a 1:1 orthologue in the
      same PTHR23209:SF4 subfamily. Independent corroboration comes from a separate
      laboratory and a separate vascular bed: siRNA against AKAP12 in cultured cerebral
      endothelial cells raises permeability and dysregulates ZO-1 and claudin-5, and Akap12
      knockout mice sustain more blood-brain barrier damage after stroke (PMID:33260683) -
      also a mouse system, so it corroborates the ISS rather than converting it to an IMP.
    supported_by:
    - reference_id: PMID:25188285
      supporting_text: siRNA-mediated AKAP12 and AKAP220 knockdown significantly impaired
        endothelial barrier function.
    - reference_id: PMID:25188285
      supporting_text: Down-regulation of mouse specific AKAP12- and AKAP220 mRNA was
        obtained by using ON-Target SMARTpool siRNA
    - reference_id: PMID:33260683
      supporting_text: When AKAP12 expression was suppressed by an siRNA approach in cultured
        endothelial cells, endothelial permeability was increased along with the
        dysregulation of ZO-1/Claudin 5 expression.
