      GO:0090036. Pushing the node term down to either branch would arbitrarily pick one
      donor over the other, so the general parent is the honest LCA. Recorded as a negative
      result of a check that was run, not skipped. The reciprocal half is a coverage gap and
      is raised in suggested_questions rather than acted on here.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes: []
      source_entities:
      - source_id: PANTHER:PTN002755149
