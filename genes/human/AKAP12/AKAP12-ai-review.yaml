      CaM-binding sites biochemically on the rodent orthologue and showed that PKC
      prephosphorylation antagonises CaM binding - which is the phosphorylation gate that
      makes this a real regulatory interaction rather than a sequence coincidence. UniProt
      also carries the Calmodulin-binding keyword.
    supported_by:
    - reference_id: PMID:11820772
      supporting_text: Four CaM binding sites were identified by binding assays that conform
        to the so-called 1-5-10 motif.
    - reference_id: PMID:11820772
      supporting_text: Notably, CaM binding was antagonized by prephosphorylation of SSeCKS
        by PKC.
