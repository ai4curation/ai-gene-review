  original_reference_id: PMID:20029029
  qualifier: enables
  supporting_entities:
  - UniProtKB:P00533
  review:
    summary: >-
      An unvalidated hit from a membrane-yeast-two-hybrid screen against unliganded EGFR;
      the paper never discusses AKAP12, and the only other EGFR row comes from the same
      platform and an overlapping author group.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      P00533 is reviewed canonical human EGFR (1210 aa) and carries 2526 IntAct interaction
      records - a 20-fold hub against AKAP12's 128, so recovery in an abundance-sensitive
      screen is weak evidence of a specific pairing. The source is a modified membrane
      yeast two-hybrid (MYTH) screen that returned 87 candidate EGFR interactors; AKAP12
      appears nowhere in the cached article text, and no orthogonal experiment on this pair
      is reported. The second EGFR row on this gene (PMID:31980649) is recorded by IntAct
      under the same detection method ("ub reconstruction", i.e. split-ubiquitin MYTH) and
      shares authors (Curak, Stagljar) with this study, so the two rows are not independent
      replication of the pair. AKAP12's documented receptor scaffolding is for the
      beta2-adrenergic receptor, a different receptor class; the one paper that examined EGF
      signalling on this protein concluded that the EGF receptor is probably not the direct
      kinase of SSeCKS, and that its mitogen-induced tyrosine phosphorylation is
      FAK-dependent. Kept rather than removed because a screen hit against a real human bait
      is not refuted, merely unreplicated.
    supported_by:
    - reference_id: PMID:20029029
      supporting_text: We used a modified membrane yeast two-hybrid system together with
        bioinformatics to identify 87 candidate proteins interacting with the
        ligand-unoccupied EGFR.
