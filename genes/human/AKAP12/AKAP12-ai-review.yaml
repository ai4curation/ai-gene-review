- term:
    id: GO:0005080
    label: protein kinase C binding
  evidence_type: IDA
  original_reference_id: PMID:9000000
  qualifier: enables
  review:
    summary: >-
      Direct in-vitro binding of protein kinase C to a defined region of the human protein,
      demonstrated in the paper that named gravin a kinase scaffold; GOA carries no PKC
      binding term at all.
    action: NEW
    reason: >-
      Half of what UniProt states this protein does - compartmentation of protein kinase A
      and protein kinase C - has no molecular function term in GOA. PKA binding is
      represented twice; PKC binding is absent. The evidence is on the human protein and
      direct: residues 265-556 of gravin bind protein kinase C in vitro (PMID:9000000),
      which is the observation UniProt encodes as its PKC-binding region 266-557. It is
      independently supported by a separate determinant mapped in the rodent orthologue,
      where two homologous motifs mediate phosphatidylserine-independent PKC binding
      (PMID:21903576) - and those published motifs match the human sequence exactly, at
      residues 605-633 and 754-782 (see the notes file), so the second determinant is
      present in human as well. IDA rather than IPI because the assay identifies PKC as the
      ligand without naming a specific isoform accession, and asserting one would claim an
      interaction that was not measured.
    supported_by:
    - reference_id: PMID:9000000
      supporting_text: residues 1526-1780 of gravin bind the regulatory subunit (RII) of
        protein kinase A with high affinity, and residues 265-556 bind protein kinase C
    - reference_id: PMID:21903576
      supporting_text: phosphatidylserine-independent binding of PKC by SSeCKS is facilitated
        by two homologous SSeCKS motifs
- term:
    id: GO:0035591
    label: signaling adaptor activity
  evidence_type: IMP
  original_reference_id: PMID:16642035
  qualifier: enables
  review:
    summary: >-
      The bridging activity itself, measured in human cells: RNAi against gravin
      disassembles a subplasmalemmal module whose components it co-precipitates.
    action: NEW
    reason: >-
      GOA records the individual partners AKAP12 binds but never the activity of bringing
      them together, which is the whole point of a scaffold and the only molecular function
      that is not simply an inventory of its clients. GO:0035591 is defined as bringing
      together two or more molecules in a signalling pathway so that they act in a
      coordinated way, with the explicit note that scaffold proteins tether components and
      localise them to specific areas of the cell - which is what was demonstrated here in
      human HEK293 cells by RNA interference against membrane-associated AKAPs, with
      co-immunoprecipitation confirming a gravin complex containing PKA and PDE4D. Choosing
      the adaptor term rather than importing the clients' activities is deliberate: PKA's
      kinase activity and PDE4D's hydrolase activity are not AKAP12's, and this term states
      what AKAP12 contributes without borrowing them. IMP because the demonstration that the
      module requires gravin is a knockdown.
    supported_by:
    - reference_id: PMID:16642035
      supporting_text: Knockdown of specific membrane-associated AKAPs using RNAi identified
        gravin (AKAP250) as the central organizer of the PDE4 complex.
    - reference_id: PMID:16642035
      supporting_text: Co-immunoprecipitation confirmed that gravin maintains a signaling
        complex that includes PKA and PDE4D.
- term:
    id: GO:0001921
    label: positive regulation of receptor recycling
  evidence_type: IMP
  original_reference_id: PMID:19055733
  qualifier: involved_in
  review:
    summary: >-
      AKAP12 knockdown in two human cell lines abolishes beta2-adrenergic receptor
      resensitisation, and the same study shows the effect is specific to AKAP12 rather than
      shared with AKAP5.
    action: NEW
    reason: >-
      GOA represents this gene's receptor biology only as GO:0007186 by TAS, which is far
      above what has been measured. The experiment is clean and human: suppressing AKAP12 in
      either A431 or HEK293 cells abolishes the ability to resensitise the beta2-adrenergic
      receptor, while suppressing AKAP5 in the same cells does not - and the reciprocal
      readout, ERK1/2 activation, depends on AKAP5 and not AKAP12. A double dissociation
      between two AKAPs in the same cells is much stronger than a single knockdown, because
      it excludes a generic anchoring artefact. The earlier antisense work reaches the same
      conclusion (PMID:10858453). IMP with human cell lines, so the experimental code is
      species-correct.
    supported_by:
    - reference_id: PMID:19055733
      supporting_text: Suppression of the expression of AKAP12 in either cell line leads to
        loss of the ability of these cells to resensitize the beta2-adrenergic receptor.
    - reference_id: PMID:19055733
      supporting_text: A431 cells were found to highly express AKAP12, but little of AKAP5.
- term:
    id: GO:0061028
    label: establishment of endothelial barrier
  evidence_type: ISS
  original_reference_id: PMID:25188285
  qualifier: involved_in
  supporting_entities:
