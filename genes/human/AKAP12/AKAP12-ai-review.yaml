id: Q02952
gene_symbol: AKAP12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AKAP12 (gravin / SSeCKS / AKAP250) is a 1782-residue, almost entirely intrinsically
  disordered multivalent scaffold that concentrates cyclic-AMP and diacylglycerol signalling
  machinery at the inner face of the plasma membrane. It is N-myristoylated at Gly2 and
  carries an A-kinase-anchoring region near its C-terminus that binds the dimeric RII
  regulatory subunit of protein kinase A with high affinity, a separate central region that
  binds protein kinase C, and three copies of the AKAP calmodulin-binding (WSK) motif.
  Through these modules it assembles a subplasmalemmal signalling module containing PKA,
  PKC, PDE4D and adenylate cyclases AC4/AC6, so that cAMP produced at the membrane is both
  sensed and rapidly degraded within a restricted microdomain. Ligand binding at the
  scaffold is phosphorylation-gated: PKC phosphorylation of the central serine cluster
  antagonises calmodulin binding and releases bound cyclin D, coupling kinase activity to
  the scaffold's own composition. Functionally, AKAP12 is required for resensitisation and
  recycling of the internalised beta2-adrenergic receptor, contributes to cAMP-dependent
  stabilisation of the endothelial barrier, and is concentrated at the cell periphery,
  filopodia, cell cortex and focal adhesions, where it associates with a detergent-resistant
  cortical cytoskeletal matrix and modulates PKC-driven actin remodelling. Three
  promoter-specified isoforms (alpha, beta, gamma) differ in their N-termini and in
  subcellular targeting. The protein is strongly expressed in endothelium and fibroblasts,
  is induced by phorbol ester and lysophosphatidylcholine, and is the autoantigen recognised
  by a subset of myasthenia gravis sera.
