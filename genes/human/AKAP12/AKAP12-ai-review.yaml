proposed_new_terms:
- proposed_name: cyclic-nucleotide phosphodiesterase binding
  proposed_definition: Binding to a cyclic-nucleotide phosphodiesterase, an enzyme that
    hydrolyses the 3',5'-cyclic phosphate bond of cAMP or cGMP.
  proposed_parent:
    id: GO:0019899
    label: enzyme binding
  justification: >-
    GO can express binding to the enzyme that makes cAMP but not to the enzyme that destroys
    it. GO:0019899 enzyme binding has 28 direct children, including GO:0008179 adenylate
    cyclase binding, GO:0019902 phosphatase binding, GO:0035473 lipase binding and
    GO:0043274 phospholipase binding, and none of them covers a phosphodiesterase; text
    searches for "phosphodiesterase binding" and "cyclic nucleotide phosphodiesterase
    binding" return only catalysis and regulation terms (GO:0004112, GO:0170005,
    GO:0051344), so the absence was checked by enumerating the parent's children and not
    only by keyword search. The asymmetry has a direct cost here: the single best-evidenced
    human experiment on AKAP12 shows that it maintains a signalling complex containing PKA
    and PDE4D, and GOA can record the PKA half but has no term for the PDE4D half. The gap
    is general to cAMP-microdomain biology - other AKAPs and beta-arrestins anchor PDE4
    isoforms too - so the term would be used well beyond this gene. GO already models the
    analogous regulatory relationship with GO:0170005 cyclic nucleotide phosphodiesterase
    activator activity, so a binding term completes a pattern rather than introducing a new
    one.
  supported_by:
  - reference_id: PMID:16642035
    supporting_text: Co-immunoprecipitation confirmed that gravin maintains a signaling
      complex that includes PKA and PDE4D.
suggested_questions:
- question: >-
    Should RGD re-examine the Akap12 annotation to GO:0043116 negative regulation of
    vascular permeability from PMID:20454828? That paper reports that depleting SSeCKS
    attenuated the cytokine-induced fall in transendothelial resistance and rise in dextran
    flux, and concludes that SSeCKS is involved in endothelial hyperpermeability - i.e. the
    experiment supports GO:0043117 positive regulation of vascular permeability, the
    opposite sign. Because Ensembl Compara transfers the rat annotation to human, the
    inversion is currently propagated to AKAP12 as well.
  experts:
  - RGD curators
  - GO Consortium
- question: >-
    Does the full text of PMID:23925424 contain a hepatic stellate cell migration assay or
    any perturbation of Akap12? The abstract describes only expression measurement, yet RGD
    records both an IMP to GO:0061870 positive regulation of hepatic stellate cell migration
    and an IEP to GO:0035733 hepatic stellate cell activation from it. If no perturbation
    exists, both rows and their human Compara transfers should be revisited.
  experts:
  - RGD curators
- question: >-
    Should PAINT consider placing a Rho-axis term on PTHR23209? The zebrafish orthologue
    akap12b carries GO:0035024 negative regulation of Rho protein signal transduction by its
    own IMP, and the mammalian literature independently reports AKAP12 reducing RhoA and
    Cdc42 activity more than fivefold (PMID:16547152) and restraining the Rho kinase pathway
    in cerebral endothelium (PMID:33260683); at present the node propagates only GO:0007165
    signal transduction, and the specific Rho observation stops at the zebrafish gene.
  experts:
  - GO Central / PAINT curators
- question: >-
    Should UniProt add the two PKC-binding motifs mapped in PMID:21903576 as FT MOTIF
    features on Q02952? The published consensus matches the human sequence exactly at
    residues 605-633 and 754-782, overlapping the annotated AKAP CaM-binding motifs 1
    (607-627) and 2 (756-776). UniProt currently annotates only the region 266-557 from
    PMID:9000000, so the entry represents one of two mapped PKC determinants and does not
    record that the second coincides with the calmodulin sites.
  experts:
  - UniProt curators
- question: >-
    Should UniProt correct the SUBUNIT line on Q02952? It states that the protein binds the
    dimeric RII-alpha regulatory subunit of PKC, but RII-alpha (PRKAR2A) is a regulatory
    subunit of protein kinase A, not protein kinase C. The line as written contradicts the
    entry's own FUNCTION text and its RII-binding region feature.
  experts:
  - UniProt curators
- question: >-
    Does human AKAP12 bind F-actin directly? Bacterially expressed unphosphorylated rodent
    SSeCKS co-sediments with F-actin (PMID:12083796), which would license GO:0051015, but
    the same laboratory reports SSeCKS decorating a cytoskeletal network explicitly distinct
    from F-actin in mesangial cells (PMID:9885289). The evidence is currently self-opposed
    and no actin-binding term was proposed here for that reason.
  experts:
  - Cytoskeleton researchers
- question: >-
    Is AKAP12 a molecular sequestering agent for cyclin D1 in human cells? Bacterially
    expressed rodent SSeCKS CY motifs bind cyclins D1 and E, and PKC phosphorylation
    releases cyclin D1 for nuclear translocation (PMID:10982843). If the CY motifs are
    conserved and functional in human AKAP12, GO:0140313 molecular sequestering activity
    would be appropriate, but no human experiment tests it.
  experts:
  - Cell cycle researchers
suggested_experiments:
- hypothesis: >-
    Human AKAP12 binds PDE4D directly rather than through PKA, and the contact is separable
    from the RII-binding helix.
  description: >-
    Map the PDE4D-binding determinant on human AKAP12 by fragment pull-down with purified
    recombinant PDE4D3 and PDE4D5, then test whether a deletion that abolishes PDE4D binding
    but leaves RII binding intact still supports rapid decay of subplasmalemmal cAMP
    transients in a gravin-knockout cell line reconstituted with the mutant. This would
    convert the current complex-level observation into a defined binary interaction, and it
    would supply the experimental anchor for the proposed cyclic-nucleotide phosphodiesterase
    binding term.
  experiment_type: biochemical reconstitution plus live-cell cAMP biosensor
- hypothesis: >-
    Calmodulin and protein kinase C compete for the same WSK motifs in human AKAP12, so that
    calcium and diacylglycerol signals are mutually exclusive inputs to the scaffold.
  description: >-
    Measure calmodulin and PKC-alpha binding to synthetic human peptides spanning residues
    605-633 and 754-782 by isothermal titration calorimetry, in the presence and absence of
    prior PKC phosphorylation, and test direct competition by titrating one ligand against
    the other. The prediction from the sequence analysis is that motifs 1 and 2 bind both
    ligands competitively while motif 3 (801-821), which does not match the PKC consensus,
    binds calmodulin only.
  experiment_type: quantitative in vitro binding and competition
- hypothesis: >-
    AKAP12's effect on endothelial permeability is sign-reversed by inflammatory cytokine
    stimulation, which would reconcile the rodent hyperpermeability result with the
    barrier-protective knockout phenotype.
  description: >-
    In a single human microvascular endothelial system, measure transendothelial electrical
    resistance after AKAP12 knockdown under basal conditions, under forskolin and rolipram
    stimulation, and under IL-1beta and TNF-alpha stimulation, in the same cells and in
    parallel. If AKAP12 loss impairs the barrier basally but protects it under cytokine
    challenge, both GO:0043116 and GO:0043117 are correct in different contexts, and the
    annotations should carry that distinction rather than one displacing the other.
  experiment_type: transendothelial resistance with matched stimulation arms
- hypothesis: >-
    The three promoter-specified isoforms differ in which signalling module they assemble,
    not merely in where they sit.
  description: >-
    Reconstitute an AKAP12-null human cell line separately with the alpha, beta and gamma
    isoforms and compare their interactomes by endogenous-tag IP-MS, then ask whether
    beta2-adrenergic receptor resensitisation and subplasmalemmal cAMP decay are supported
    by all three or only by the myristoylated alpha form. The isoforms differ only in short
    N-terminal segments, one of which carries the myristoylation site, so this directly
    tests whether the membrane anchor is what selects the client set.
  experiment_type: isoform reconstitution with interactome and functional readouts
