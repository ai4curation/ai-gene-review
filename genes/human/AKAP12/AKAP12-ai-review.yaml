      The two InterPro signatures involved were checked directly. IPR028540 is an
      AKAP12-only family (1185 proteins, integrated with the single-subfamily PANTHER
      orthogroup PTHR23209) and IPR001573 is the AKAP calmodulin-binding WSK motif shared
      with AKAP5 - both are specific signatures rather than bare folds, so the four IEA rows
      they generate are well founded.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Both IBA rows were checked by resolving every WITH/FROM token and querying each
      donor's own evidence in QuickGO. The zebrafish donor carries two independent IDA
      annotations to GO:0005737, so neither row is a family-level guess without measurement.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Mechanically correct, but all three source UniProt subcellular-location statements
      carry ECO:0000305 and one is explicitly hedged as something the protein may be part
      of, so the rows inherit curator inference rather than measurement. Noted per row.
- id: GO_REF:0000052
  title: Gene Ontology annotation based on curation of immunofluorescence data
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Checked against the Human Protein Atlas API, which returns exactly two subcellular
      main locations for AKAP12 - Plasma membrane and Cytosol - and no additional locations.
      Both GO_REF:0000052 rows are therefore main calls.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to
    orthologs using Ensembl Compara
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: >-
      The orthology itself is sound - Q5QD51 is reviewed rat Akap12 in the same single-gene
      PANTHER subfamily as human AKAP12, so these are ortholog and not paralog transfers.
      The donor annotations are mixed in quality, and the pipeline propagates them without
      distinction: three of the eleven transferred rows rest on expression correlation or,
      in the GO:0043116 case, invert the sign of the experiment they cite. Marked DISPUTED
      for that reason rather than for any identifier problem.
- id: PMID:9000000
  title: Gravin, an autoantigen recognized by serum from myasthenia gravis patients, is a
    kinase scaffold protein.
  findings:
  - statement: >-
      Human gravin binds the RII regulatory subunit of PKA with high affinity through
      residues 1526-1780 and binds protein kinase C through residues 265-556; a PKA-gravin
      complex is isolable from human erythroleukemia cells.
    supporting_text: residues 1526-1780 of gravin bind the regulatory subunit (RII) of
      protein kinase A with high affinity, and residues 265-556 bind protein kinase C
  - statement: >-
      Human gravin is concentrated at the cell periphery and enriched in filopodia, and its
      staining coincides with an AKAP detected by in situ RII overlay.
    supporting_text: gravin is concentrated at the cell periphery and is enriched in
      filopodia
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The decisive paper for this gene, and it is absent from the affinage record entirely -
      the provider's citation list starts in 1997 with PMID:9187136 and never reaches this
      one, presumably because the title names an autoimmune disease rather than a function.
      Found instead in the UniProt RN list. It is the only publication that maps both the
      PKA and the PKC determinant on the human protein, and it is the basis of UniProt's
      266-557 PKC-binding region. PubMed record verified; the round-numbered PMID is a
      coincidence, not a placeholder.
- id: PMID:1522245
  title: Molecular cloning and preliminary characterization of a novel cytoplasmic antigen
    recognized by myasthenia gravis sera.
  findings:
  - statement: >-
      Gravin was cloned from an endothelial expression library using myasthenia gravis
      serum; it is a 250 kDa cytoplasmic protein of endothelial and adherent cells, absent
      from platelets and leukocytes, and inducible in HEL cells by phorbol ester.
    supporting_text: Gravin was not detected in platelets, leukocytes, U937, or human
      erythroleukemic (HEL) cell lines, but was expressed in HEL cells after induction with
      phorbol myristate acetate.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The original description of the human protein. Cited here for the cytoplasmic
      localisation and tissue distribution that UniProt's TISSUE SPECIFICITY line
      summarises; not load-bearing for any annotation action.
- id: PMID:10858453
  title: Gravin-mediated formation of signaling complexes in beta 2-adrenergic receptor
    desensitization and resensitization.
  findings:
  - statement: >-
      Agonist stimulation drives assembly of a receptor-gravin complex containing PKA, PKC,
      GRK2, beta-arrestin and clathrin, and antisense suppression of gravin blocks both that
      assembly and receptor recovery from desensitisation.
    supporting_text: Suppression of gravin expression via antisense oligodeoxynucleotides
      disrupted agonist-induced association of the receptor with G-protein-linked receptor
      kinase-2, beta-arrestin, and clathrin as well as receptor recovery from
      desensitization.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Source of all three TAS rows on this gene. The TAS code understates it - the paper
      reports antisense knockdown experiments, not an author assertion - but the terms
      chosen are correct, so the rows were accepted or kept rather than modified. The cell
      system is not named in the abstract and the full text is not cached, so no
      species-specific claim was built on it beyond what the GOA row already asserts.
- id: PMID:16642035
  title: An anchored PKA and PDE4 complex regulates subplasmalemmal cAMP dynamics.
  findings:
  - statement: >-
      RNA interference against membrane-associated AKAPs in human HEK293 cells identified
      gravin as the organiser of a PDE4 complex that terminates subplasmalemmal cAMP
      transients.
    supporting_text: Knockdown of specific membrane-associated AKAPs using RNAi identified
      gravin (AKAP250) as the central organizer of the PDE4 complex.
  - statement: >-
      Co-immunoprecipitation confirms that gravin maintains a signalling complex containing
      PKA and PDE4D.
    supporting_text: Co-immunoprecipitation confirmed that gravin maintains a signaling
      complex that includes PKA and PDE4D.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The strongest human functional evidence on this gene and the basis of the proposed
      GO:0035591 row. IntAct records the AKAP12-PRKAR2A pair from this study under detection
      method "filter binding", a direct in-vitro assay rather than a screen, which is why
      the PRKAR2A rows were promoted to GO:0034237 rather than left as bare protein binding.
- id: PMID:17081159
  title: Role of protein kinase C-dependent A-kinase anchoring proteins in lysophosphatidic
    acid-induced cAMP signaling in human diploid fibroblasts.
  findings:
  - statement: >-
      In human diploid fibroblasts gravin co-immunoprecipitates adenylate cyclase types 4
      and 6 but not type 2, and siRNA against gravin greatly reduces basal cAMP and reverses
      the cAMP response to lysophosphatidic acid.
    supporting_text: Co-immunoprecipitation experiments revealed that Gravin and AKAP79 do
      not associate with adenylyl cyclase type 2 (AC2) but bind to AC4/6
  - statement: >-
      The authors conclude that gravin couples adenylate cyclase to inhibitory signals in
      young cells and to stimulatory signals in senescent cells - a bidirectional,
      age-dependent role.
    supporting_text: may play important roles in maintaining the basal AC activity and in
      coupling the AC systems to inhibitory signals such as Gialpha in young cells, and to
      stimulatory signals such as PKCs in senescent cells
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      A genuinely human experimental study, which is scarce for this gene. Supports both
      GO:0008179 rows as they stand, with the AC2 negative control giving unusual
      specificity for an interaction row. The only issue is directional: the paper's
      conclusion is explicitly bidirectional, which is why the GO:0007193 row was modified
      to the neutral parent GO:0007188.
- id: PMID:19055733
  title: 'G-protein-coupled receptor-associated A-kinase anchoring proteins AKAP5 and
    AKAP12: differential signaling to MAPK and GPCR recycling.'
  findings:
  - statement: >-
      Knocking down AKAP12 in A431 or HEK293 cells abolishes beta2-adrenergic receptor
      resensitisation, whereas knocking down AKAP5 does not; the reciprocal readout, ERK1/2
      activation, depends on AKAP5 and not AKAP12.
    supporting_text: Suppression of the expression of AKAP12 in either cell line leads to
      loss of the ability of these cells to resensitize the beta2-adrenergic receptor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The double dissociation between two AKAPs in the same human cell lines is what makes
      this stronger than an ordinary knockdown, and it is the basis of the proposed
      GO:0001921 row. Cell lines are human, so IMP is species-correct.
- id: PMID:20029029
  title: Regulation of epidermal growth factor receptor trafficking by lysine deacetylase
    HDAC6.
  findings:
  - statement: >-
      A modified membrane yeast two-hybrid screen against ligand-unoccupied EGFR returned 87
      candidate interactors; the paper follows up HDAC6 and does not discuss AKAP12.
    supporting_text: We used a modified membrane yeast two-hybrid system together with
      bioinformatics to identify 87 candidate proteins interacting with the ligand-unoccupied
      EGFR.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited, but it is a screen resource for this gene rather than a study of it -
      AKAP12 is not named anywhere in the cached text. Shares platform and authors (Curak,
      Stagljar) with PMID:31980649, so the two EGFR rows are not independent.
- id: PMID:20195357
  title: A comprehensive resource of interacting protein regions for refining human
    transcription factor networks.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      An mRNA-display interacting-region resource built around 50 transcription factors, in
      which AKAP12 appears as a prey for beta-catenin. The core data set is reported at a 70
      percent verification rate. Usable only because a second, orthogonal method (OpenCell
      endogenous-tag co-IP) recovered the same pair.
- id: PMID:21423176
  title: Analysis of the myosin-II-responsive focal adhesion proteome reveals a role
    for β-Pix in negative regulation of focal adhesion maturation.
  findings: []
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      Correctly cited and a sound paper, but as a GO source it supplies GO:0005925 to 285
      annotations, all HDA and all UniProt-assigned, including RPLP0, RPLP1 and RPLP2 -
      cytoplasmic large-ribosomal-subunit proteins that are not focal adhesion components.
      Flagged LOW_QUALITY as an annotation source, not as science: a proteomic inventory of
      isolated adhesions is not per-protein validation.
- id: PMID:21900206
  title: A directed protein interaction network for investigating intracellular signal
    transduction.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Automated yeast-two-hybrid interaction mating covering more than 450 signalling
      proteins and yielding 2626 interactions. Screen-level support for the AKAP12-FHL1
      pair; AKAP12 is not individually discussed.
- id: PMID:23414517
  title: 'A human skeletal muscle interactome centered on proteins involved in muscular
    dystrophies: LGMD interactome.'
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Independent Y2H recovery of the AKAP12-FHL1 pair from a human skeletal-muscle library,
      from a different laboratory than PMID:21900206. Its value here is replication, not
      characterisation.
- id: PMID:31980649
  title: Extensive rewiring of the EGFR network in colorectal cancer cells expressing
    transforming levels of KRAS(G13D).
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited but methodologically redundant with PMID:20029029 for this gene: the
      same split-ubiquitin membrane-Y2H platform, overlapping authors, and no mention of
      AKAP12 in the text. Treating the two EGFR rows as independent replication would repeat
      the NbExp error.
- id: PMID:35271311
  title: 'OpenCell: Endogenous tagging for the cartography of human cellular organization.'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Endogenous tagging plus IP-MS, so free of the over-expression artefact that weakens
      most interactome sources; but QuickGO shows it supplies 2872 GO:0005515 annotations,
      so any one edge remains a high-throughput call. Used here as the orthogonal
      confirmation that promoted the PRKAR2A and CTNNB1 rows, not as standalone evidence.
- id: PMID:9744295
  title: Control of cytoskeletal architecture by the src-suppressed C kinase substrate,
    SSeCKS.
  findings:
  - statement: >-
      Tetracycline-regulated induction of SSeCKS in NIH3T3 fibroblasts elaborates a
      detergent-resistant cortical cytoskeletal matrix, flattens cells, and transiently
      removes actin stress fibres and vinculin-associated adhesion plaques.
    supporting_text: The induction of SSeCKS (removal of tet) caused significant cell
      flattening and the elaboration of an SSeCKS-associated cortical cytoskeletal matrix
      resistant to Triton X-100 extraction.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Mouse NIH3T3 and an over-expression system, so the result is an IMP-class observation
      in rodent, not a human direct assay - relevant to the cytoskeleton and focal adhesion
      location rows but not usable as human evidence. Note this is an ectopic-expression
      phenotype: it shows what happens when the protein's level is raised, which is weaker
      evidence for a normal physiological process than for a localisation.
- id: PMID:9885289
  title: Involvement of the protein kinase C substrate, SSeCKS, in the actin-based stellate
    morphology of mesangial cells.
  findings:
  - statement: >-
      SSeCKS is enriched in mesangial cell podosomes and along a cytoskeletal network that
      the authors state is distinct from F-actin; antisense ablation repositions
      vinculin-associated focal complexes.
    supporting_text: enrichment of SSeCKS in mesangial cell podosomes and along a
      cytoskeletal network distinct from F-actin
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Read for the cytoskeleton rows. Its observation that the network is distinct from
      F-actin is the reason no GO:0051015 actin filament binding term was proposed despite
      the co-sedimentation result in PMID:12083796 - the two findings from the same
      laboratory are in tension and the question was recorded rather than resolved.
- id: PMID:10469144
  title: Developmental expression of the protein kinase C substrate/binding protein (clone
    72/SSeCKS) in rat testis identification as a scaffolding protein containing an
    A-kinase-anchoring domain which is expressed during late-stage spermatogenesis.
  findings:
  - statement: >-
      Deletion mutagenesis localises the RII-interacting element of rat clone 72/SSeCKS to
      residues 1495-1524, independently confirming the C-terminal AKAP helix.
    supporting_text: Deletion mutagenesis demonstrated that amino acids 1495-1524 of clone
      72/SSeCKS had the ability to interact with RII.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Rat, and reached by an independent route (interactive cloning with the PKA type II
      regulatory subunit as bait). Corroborates the human RII mapping in PMID:9000000 from a
      different species and method; not used as human evidence.
- id: PMID:10982843
  title: SSeCKS, a major protein kinase C substrate with tumor suppressor activity,
    regulates G(1)-->S progression by controlling the expression and cellular
    compartmentalization of cyclin D.
  findings:
  - statement: >-
      Bacterially expressed SSeCKS CY motifs bind cyclins D1 and E, and lysine-to-serine
      mutation of either motif ablates binding; PKC activation releases cyclin D1 from
      cytoplasmic sequestration.
    supporting_text: Bacterially expressed SSeCKS-CY bound cyclins D1 and E, whereas K-->S
      mutations within either CY motif ablated binding.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Mouse NIH3T3 and rat embryo fibroblasts. Cited for the cyclin-sequestration mechanism,
      which is recorded in suggested_questions rather than annotated, because no human
      experiment tests it. Note the G1 arrest is a tetracycline-induced over-expression
      phenotype, which is why no cell-cycle BP term was proposed from it.
- id: PMID:11820772
  title: Calmodulin and cyclin D anchoring sites on the Src-suppressed C kinase substrate,
    SSeCKS.
  findings:
  - statement: >-
      Four calmodulin-binding sites conforming to the 1-5-10 motif were mapped in vitro on
      SSeCKS, and calmodulin binding is antagonised by prior PKC phosphorylation.
    supporting_text: Four CaM binding sites were identified by binding assays that conform to
      the so-called 1-5-10 motif.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The biochemical basis of the GO:0005516 row. Explicitly about the rodent protein - the
      abstract frames it as SSeCKS and its human orthologue Gravin - so it supports the term
      by orthology, not as a human measurement; recorded as a knowledge gap in
      core_functions.
- id: PMID:12083796
  title: Mitogen-induced, FAK-dependent tyrosine phosphorylation of the SSeCKS scaffolding
    protein.
  findings:
  - statement: >-
      Bacterially expressed unphosphorylated SSeCKS co-sediments with F-actin, and in FAK+/+
      cells the protein stains the cell edge and a cortical cytoskeletal matrix rather than
      stress fibres.
    supporting_text: in FAK-/- cells, SSeCKS costains along F-actin stress fibers, in
      contrast to FAK+/+ cells, where most SSeCKS stains at the cell edge and along a
      cortical cytoskeletal matrix
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      NIH3T3 and rodent embryo fibroblasts. Supports the cell cortex row. Its F-actin
      co-sedimentation result would license GO:0051015 but is opposed by PMID:9885289 from
      the same laboratory, so it was not used to propose a term.
- id: PMID:11814414
  title: SSeCKS immunolabeling in rat primary sensory neurons.
  findings:
  - statement: >-
      Immunofluorescence of rat brain, spinal cord and dorsal root ganglia labels SSeCKS in
      neuronal cell bodies of a restricted nociceptive sensory population.
    supporting_text: A small portion of the SSeCKS-labeled cell bodies appeared to represent
      a subpopulation of substance P (4.8%) and CGRP (4.7%) containing neurons
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      The rat IDA underlying the GO:0043025 Compara transfer. Verified through QuickGO on
      the donor accession rather than assumed. Rat, and cell-type restricted, so the
      transferred row is kept as non-core.
- id: PMID:17873284
  title: Src suppressed C kinase substrate regulates the lipopolysaccharide-induced
    TNF-alpha biosynthesis in rat astrocytes.
  findings:
  - statement: >-
      siRNA knockdown of SSeCKS in rat astrocytes partly inhibits LPS-induced signalling,
      including ERK activation and TNF-alpha production.
    supporting_text: By using siRNA knockdown of SSeCKS expression, LPS-induced signaling
      events were partly inhibited
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      One of the two rat IMPs behind GO:0032760, identified by querying the donor accession
      in QuickGO. Genuine loss-of-function evidence, in rat.
- id: PMID:19937403
  title: A critical role of SRC-suppressed C kinase substrate in rat astrocytes after
    chronic constriction injury.
  findings:
  - statement: >-
      Silencing SSeCKS in rat spinal astrocytes prevents the rise in phospho-ERK and
      pro-inflammatory cytokines after stimulation by damaged sensory neurons.
    supporting_text: SSeCKS gene silencing by siRNA inhibited the up-regulation of p-ERK and
      the pro-inflammation cytokines
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The rat IMP behind both GO:0070374 and the second GO:0032760 annotation. Its ERK
      result runs opposite to the fibroblast literature, which is recorded in the GO:0070374
      row rather than resolved.
- id: PMID:20155814
  title: 'Involvement of Src-suppressed C kinase substrate in experimental autoimmune
    encephalomyelitis: a link between release of astrocyte proinflammatory factor and
    oligodendrocyte apoptosis.'
  findings:
  - statement: >-
      siRNA against SSeCKS in rat astrocytes blocks TNF-alpha and nitric oxide induction and
      prevents astrocyte-conditioned medium from killing oligodendrocytes.
    supporting_text: siRNA targeted to SSeCKS in astrocytes inhibited oligodendrocyte cell
      death
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      The rat IMP behind GO:1900143. The perturbation is real but the effect is
      non-cell-autonomous and observed only in an EAE model, which is why the transferred
      row is non-core.
- id: PMID:20454828
  title: Role of src-suppressed C kinase substrate in rat pulmonary microvascular
    endothelial hyperpermeability stimulated by inflammatory cytokines.
  findings:
  - statement: >-
      Depleting SSeCKS in rat pulmonary microvascular endothelial cells attenuates the
      cytokine-induced fall in transendothelial resistance and rise in dextran flux; the
      authors conclude SSeCKS is involved in endothelial hyperpermeability.
    supporting_text: Depletion of endogenous SSeCKS in RPMVEC significantly attenuated
      cytokine-induced decrease in TER and increase in P (d), but not to the basal levels.
  - statement: >-
      IL-1beta and TNF-alpha applied directly to the same cells activate PKC signalling and
      up-regulate SSeCKS message and protein.
    supporting_text: IL-1β and TNF-α activated the PKC signaling pathway in RPMVEC, and
      up-regulated the gene and protein expression of SSeCKS.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Correctly cited, and the source of three transferred rows. The paper itself is sound;
      what is wrong is the sign of the GO:0043116 annotation drawn from it, which asserts
      negative regulation of vascular permeability while the paper reports the protein
      promoting permeability. Assessed from the abstract, whose RESULTS and CONCLUSIONS
      sentences are unambiguous; the full text was not available.
- id: PMID:23912647
  title: Vagal efferent fiber stimulation ameliorates pulmonary microvascular endothelial
    cell injury by downregulating inflammatory responses.
  findings:
  - statement: >-
      In LPS-induced rat acute lung injury, vagus nerve stimulation reduces lung injury
      markers and lowers SSeCKS protein in lung tissue.
    supporting_text: vagus nerve stimulation not only decreased the expressions of
      Src-suppressed C kinase substrate and E-selectin proteins in lung tissue
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited, but a poor basis for GO:0051602 response to electrical stimulus: the
      electrode was on the vagus nerve of a whole animal and Akap12 was measured in lung
      tissue several causal steps downstream. The GO:0032496 row from the same paper is the
      defensible one.
- id: PMID:23925424
  title: Increased SSeCKS expression in rat hepatic stellate cells upon activation in vitro
    and in vivo.
  findings:
  - statement: >-
      SSeCKS message and protein rise in CCl4-injured rat liver and in primary hepatic
      stellate cells activating in vitro; the functional interpretation is offered as a
      possibility rather than a result.
    supporting_text: The upregulation of SSeCKS protein expression in rat HSCs during
      activation in vitro and in vivo suggested the possibility of SSeCKS, an important part
      of function of the activated HSCs, perhaps through modulation of liver regeneration or
      formation of liver fibrosis after various injuries.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Correctly cited. The concern is what was drawn from it: RGD records an IMP to
      GO:0061870 from a paper whose abstract describes no perturbation and no migration
      assay, alongside an IEP to GO:0035733. Both transferred rows were marked
      over-annotated. Assessed from the abstract; full text not accessible, so the question
      is passed to a curator rather than settled.
- id: PMID:21903576
  title: Control of protein kinase C activity, phorbol ester-induced cytoskeletal
    remodeling, and cell survival signals by the scaffolding protein SSeCKS/GRAVIN/AKAP12.
  findings:
  - statement: >-
      Two homologous motifs mediate phosphatidylserine-independent binding of PKC by SSeCKS,
      and that binding lowers PKC-alpha kinase activity; SSeCKS-null fibroblasts show raised
      PKC activity, rescued by full-length but not PKC-binding-domain-deleted protein.
    supporting_text: SSeCKS binding to PKCα decreased kinase activity and was dependent on
      the two PKC-binding motifs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The mechanistic basis for GO:0090036. The experiments are rodent (SSeCKS-null mouse
      embryo fibroblasts, rat MAT-LyLu cells alongside human LNCaP), so it is not used as
      human evidence. Its published motif consensus was tested against the human sequence
      independently for this review and matches at residues 605-633 and 754-782, which is
      how the human protein was shown to carry the same determinants.
- id: PMID:25188285
  title: PKA compartmentalization via AKAP220 and AKAP12 contributes to endothelial barrier
    regulation.
  findings:
  - statement: >-
      siRNA-mediated AKAP12 knockdown impairs endothelial barrier function and abolishes
      cAMP-mediated barrier stabilisation; the knockdown used mouse-specific siRNA in MyEnd
      mouse endothelial cells.
    supporting_text: Down-regulation of mouse specific AKAP12- and AKAP220 mRNA was obtained
      by using ON-Target SMARTpool siRNA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The abstract states the study analysed human, mouse and rat material, which would
      invite an IMP. Reading the methods shows the AKAP12 knockdown itself used
      mouse-specific siRNA in MyEnd mouse cells, so the proposed GO:0061028 row is ISS with
      mouse Akap12 as the supporting entity. Checking which reagent was human is the
      difference between a correct and an incorrect evidence code here.
- id: PMID:20018890
  title: SSeCKS/Gravin/AKAP12 inhibits cancer cell invasiveness and chemotaxis by suppressing
    a protein kinase C- Raf/MEK/ERK pathway.
  findings:
  - statement: >-
      SSeCKS suppresses serum-induced Raf/MEK/ERK activation with consequent loss of MMP-2
      expression, and its suppression of phorbol-ester-induced ERK1/2 activity requires the
      PKC-binding domain (aa 553-900), implying the effect runs through direct PKC
      scaffolding.
    supporting_text: SSeCKS suppressed serum-induced activation of the Raf/MEK/ERK pathway,
      resulting in down-regulation of matrix metalloproteinase-2 expression.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Rat MAT-LyLu prostate carcinoma cells and a re-expression design, so it is rodent and
      gain-of-function. Cited only to show that AKAP12's effect on the ERK cascade is
      context-dependent, which is why the transferred GO:0070374 row is non-core rather than
      core. Its invasion and metastasis results are deliberately not annotated: forced
      re-expression in a cancer line does not establish a normal physiological process.
- id: PMID:16547152
  title: SSeCKS/Gravin/AKAP12 metastasis suppressor inhibits podosome formation via RhoA- and
    Cdc42-dependent pathways.
  findings:
  - statement: >-
      Re-expressing SSeCKS at physiological levels in v-Src-transformed NIH3T3 cells
      suppresses podosome formation and lowers RhoA and Cdc42 activity more than fivefold;
      activated RhoA or Cdc42 rescues podosomes.
    supporting_text: this correlated with the ability of SSeCKS to inhibit RhoA and Cdc42
      activity levels by >5-fold
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Mouse NIH3T3, and a re-expression rather than loss-of-function design. Used only to
      support the PAINT suggestion that the Rho axis is conserved between the zebrafish
      orthologue's own IMP and the mammalian literature; no Rho term was annotated on this
      gene from it, because the human protein has no such measurement.
- id: PMID:33260683
  title: AKAP12 Supports Blood-Brain Barrier Integrity against Ischemic Stroke.
  findings:
  - statement: >-
      siRNA against AKAP12 in cultured cerebral endothelial cells raises permeability and
      dysregulates ZO-1 and claudin-5 through Rho kinase activation; Akap12 knockout mice
      sustain greater blood-brain barrier damage after stroke, mitigated by Y-27632.
    supporting_text: When AKAP12 expression was suppressed by an siRNA approach in cultured
      endothelial cells, endothelial permeability was increased along with the dysregulation
      of ZO-1/Claudin 5 expression.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      A mouse system throughout (cultured cerebral endothelial cells plus Akap12 knockout
      mice), so it corroborates the ISS-coded GO:0061028 row from a second laboratory and a
      second vascular bed without converting it to an IMP. Read in full rather than taken
      from the provider summary, because the species of the perturbed cells is what decides
      the evidence code.
