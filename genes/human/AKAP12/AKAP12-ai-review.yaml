- term:
    id: GO:0005516
    label: calmodulin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001573
  review:
    summary: >-
      A motif-level InterPro signature whose defining feature is the calmodulin-binding
      element itself, present in three copies in the human protein and mapped biochemically
      in the rodent orthologue.
    action: ACCEPT
    reason: >-
      IPR001573 is "A kinase-anchoring protein AKAP5 and AKAP12, calmodulin (CaM)-binding
      motif" - the WSK/WXSXK motif - i.e. the signature is the binding element, not a bare
      fold, which is the case in which a signature-derived molecular function is best
      founded. UniProt annotates three instances in human AKAP12 (residues 607-627, 756-776
