    reason: >-
      P35222 resolves to reviewed canonical beta-catenin (781 aa, Swiss-Prot), so the
      identifier is sound. IntAct records the pair from two publications under two different
      detection methods - "display technology" (this mRNA-display resource, core data set
      reported at 70% verification) and "anti tag coip" (PMID:35271311, OpenCell). I first
