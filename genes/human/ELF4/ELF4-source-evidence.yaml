molecular_scope:
  DNA_and_transactivation: Human MEF DNA binding and polymerase-II promoter activation are supported by
    complementary sources; missing Methods in one citation are not represented as a direct assay read.
  RUNX1_binding: PMID10207087 provides reciprocal/domain-resolved binding and reporter cooperation beyond
    partner-class labeling. PMID14970218 independently reports MEF–AML1 association; its NERF2 reporter
    experiments are not assigned to ELF4. Current Q01196-1/-8 metadata does not establish the exact assayed
    isoform sequences.
  PML: PMID14976184 supports PML-dependent enhancement of ELF4 lysozyme transactivation together with
    reciprocal association and mammalian two-hybrid mapping, supporting transcription coactivator binding.
    The directly tested interaction fragment is MEF 477–663; 477–517 is an overlapping-truncation inference.
    The precise downstream recruitment/modification mechanism and basal-machinery contacts were not established.
    HPA supports nuclear bodies without PML-marker specificity; no autonomous ELF4 scaffold or coactivator
    activity is assigned.
  inflammation: Human and mouse cytokine perturbations are retained with genotype, exposure and assay
    limits. Final published Figure 5, not the earlier preprint alone, supports the PMID35266071 TNF polarity.
