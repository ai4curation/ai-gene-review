id: Q99607
gene_symbol: ELF4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ELF4 encodes an ETS-family nuclear transcription factor that recognizes specific DNA motifs
  in cis-regulatory regions and activates RNA polymerase II-dependent transcription. It regulates cytokine
  and antimicrobial gene expression in hematopoietic and epithelial cells, with promoter activity influenced
  by interactions with RUNX1 and PML. PML can recruit ELF4 into nuclear bodies, linking its subnuclear
  distribution to enhanced transcriptional activation under particular cellular conditions.
