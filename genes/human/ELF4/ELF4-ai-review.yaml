- id: PMID:14970218
  title: Isoforms of the Ets transcription factor NERF/ELF-2 physically interact with AML1 and mediate
    opposing effects on AML1-mediated transcription of the B cell-specific blk gene.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected original Methods, Results and Discussion confirm FLAG-MEF/Myc-AML1 association
      in 293T cells, including Figure 3B. The inspected BLK reporter and deletion experiments concern
      NERF2. The PML-body and positive-transcription source assignments are therefore retained with conditional
      reference queries; the binding result is positive. No claim is made about every unavailable supplement
      or a confirmed curator error.
- id: PMID:14976184
  title: Myeloid Elf-1-like factor, an ETS transcription factor, up-regulates lysozyme transcription in
    epithelial cells through interaction with promyelocytic leukemia protein.
  findings: []
  reference_review:
