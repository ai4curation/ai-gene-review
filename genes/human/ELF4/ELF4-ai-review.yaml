    action: MODIFY
    summary: The RUNX1 interaction supports transcription-factor binding with partner-product limits.
    reason: The source retains Q01196-8 as the partner. Current UniProt names that product AML-1G, whereas
      PMID10207087 uses historical AML1/AML1B nomenclature and a 479-residue AML1B construct. Exact insert
