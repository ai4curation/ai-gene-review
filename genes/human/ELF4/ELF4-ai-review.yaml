  review:
    action: ACCEPT
    summary: ELF4 is a chromatin-associated DNA-binding transcription factor.
    reason: The TFClass-derived location is consistent with a nuclear ETS factor that recognizes regulatory
      DNA and activates target promoters. Human ELF4 sequence-specific promoter binding and transactivation
      support its chromatin-associated role. This does not imply that ELF4 is a constitutive structural
      chromatin component or occupies every chromatin region.
