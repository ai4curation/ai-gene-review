    label: positive regulation of epithelial to mesenchymal transition
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q9ES03
  - ensembl:ENSMUSP00000052591
  review:
    summary: Ensembl ortholog transfer (mouse IMP, Cai 2011) for positive regulation of EMT.
    action: KEEP_AS_NON_CORE
    reason: Myocardial Tbx20 is required non-cell-autonomously for AVC endocardial EMT, acting through
      maintenance of Bmp2 expression; an indirect, developmental regulatory role.
    supported_by:
    - reference_id: PMID:21983003
      supporting_text: mice lacking Tbx20 in the AVC myocardium fail to form the AVC constriction, and
        the endocardial epithelial-mesenchymal transition (EMT) is severely perturbed
    - reference_id: PMID:21983003
      supporting_text: re-expression of Bmp2 in the AVC myocardium substantially rescues the EMT defects
        resulting from the lack of Tbx20, suggesting Bmp2 is one of the key downstream targets of Tbx20
        in AVC development
