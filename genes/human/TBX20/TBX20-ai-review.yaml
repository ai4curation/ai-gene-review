- term:
    id: GO:0030513
    label: positive regulation of BMP signaling pathway
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: acts_upstream_of
  supporting_entities:
  - UniProtKB:Q9ES03
  review:
    summary: ISS from mouse (Cai 2011) for positive regulation of BMP signaling pathway.
    action: KEEP_AS_NON_CORE
    reason: Myocardial Tbx20 maintains Bmp2 expression in the AVC, so TBX20 acts upstream of BMP signaling.
      However, in chamber myocardium Tbx20 attenuates Bmp/Smad signaling by sequestering Smad1/5; the
      net effect on the pathway is context-dependent. Indirect, non-core.
    supported_by:
    - reference_id: PMID:21983003
      supporting_text: re-expression of Bmp2 in the AVC myocardium substantially rescues the EMT defects
        resulting from the lack of Tbx20, suggesting Bmp2 is one of the key downstream targets of Tbx20
        in AVC development
    - reference_id: PMID:19661464
      supporting_text: both Tbx20 and mutant isoforms of Tbx20 unable to bind DNA attenuate Bmp/Smad-dependent
        activation of Tbx2 by binding Smad1 and Smad5 and sequestering them from Smad4
