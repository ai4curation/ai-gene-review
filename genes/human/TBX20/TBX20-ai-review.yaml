- term:
    id: GO:0043065
    label: positive regulation of apoptotic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:A0A0G2KAH3
  - ensembl:ENSRNOP00000075397
  review:
    summary: Ensembl ortholog transfer from a rat IMP (Liu et al. 2016, PMID:27572266) for positive regulation
      of apoptotic process.
    action: REMOVE
    reason: The source paper reports that silencing TBX20 induced apoptosis in H9c2 rat cardiomyoblasts
      and HEK293 cells, which if anything implies that TBX20 suppresses apoptosis, the opposite direction
      of the annotated term. The underlying evidence is a single cell-line knockdown study, and no in
      vivo data support a pro-apoptotic role. The transferred annotation is contradicted by its own source.
    supported_by:
    - reference_id: PMID:27572266
      supporting_text: Silencing of TBX20 in H9c2 and HEK293 cells significantly inhibited cell proliferation,
        induced cell apoptosis and led to G2/M cell cycle arrest
