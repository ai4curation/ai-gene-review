- term:
    id: GO:0001706
    label: endoderm formation
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8AXW8
  review:
    summary: ISS from Xenopus tbx20 for endoderm formation.
    action: MARK_AS_OVER_ANNOTATED
    reason: The Xenopus source (Stennard 2003) showed that ectopic overexpression of Tbx20a induced mesodermal
      and endodermal markers in Xenopus embryos. Gain-of-function induction of markers is not evidence
      that TBX20 normally participates in germ layer formation; no loss-of-function data support a role
      for TBX20 in endoderm or lateral mesoderm formation, and TBX20 expression begins in the cardiac
      crescent after gastrulation.
    supported_by:
    - reference_id: PMID:14550786
      supporting_text: enforced expression of Tbx20a, but not Tbx20b, led to induction of mesodermal and
        endodermal lineage markers as well as cell migration
