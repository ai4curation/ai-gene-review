  review:
    summary: ISS from mouse for negative regulation of DNA-templated transcription.
    action: ACCEPT
    reason: TBX20 acts as a context-dependent transcriptional repressor; in mouse it represses Tbx2 in
      prospective chamber myocardium and ChIP-seq/RNA-seq in adult heart identified directly repressed
