id: Q9UMR3
gene_symbol: TBX20
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TBX20 is a T-box family sequence-specific DNA-binding transcription factor expressed in cardiac
  progenitors, myocardium and endocardium (including endocardial cushions), and in hindbrain branchiomotor/visceromotor
  neurons. Through its T-box domain it binds brachyury-like half sites and acts as a context-dependent
  activator or repressor of RNA polymerase II target genes; the long isoform carries C-terminal transactivation
  and transrepression domains. TBX20 physically cooperates with NKX2-5, GATA4/5, TBX5 and ISL1 to activate
  cardiac enhancers (e.g. NPPA, GJA5, MEF2C, NKX2-5), and represses TBX2 in prospective chamber myocardium,
  partly by binding SMAD1/5 and blocking BMP/SMAD-dependent activation. In mouse it is required for heart
  tube elongation, chamber formation, atrioventricular canal and valve development and cardiomyocyte proliferation,
  and continues to maintain ion channel and contractile gene programs in adult cardiomyocytes. Human TBX20
  variants cause atrial septal defect 4 and are associated with valve defects, tetralogy of Fallot and
  dilated cardiomyopathy.
