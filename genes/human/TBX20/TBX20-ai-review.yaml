suggested_questions:
- question: 'How does TBX20 switch between activator and repressor output at a given target: isoform choice
    (Tbx20a C-terminal domains), partner cohort (NKX2-5/GATA4 vs repressive partners), or DNA-binding-independent
    SMAD sequestration?'
- question: Which directly bound TBX20 targets in adult cardiomyocytes (ion channels, sarcomeric genes)
    account for the arrhythmia and cardiomyopathy seen after adult ablation, and are the same targets
    affected by human cardiomyopathy-associated variants?
suggested_experiments:
- description: Map TBX20 interactomes (RIME/IP-MS) and isoform-specific ChIP-seq in human iPSC-derived
    cardiomyocytes, comparing activated vs repressed target loci, to define the partner cohorts that determine
    activator vs repressor output.
- description: Knock-in human ASD4 variants (I152M, I121M, Q195X) in iPSC-derived cardiomyocytes and measure
    target occupancy and expression (Nppa, Gja5, Tbx2) to test loss- vs gain-of-function mechanisms.
