- term:
    id: GO:0046332
    label: SMAD binding
  evidence_type: ISS
  original_reference_id: PMID:19661464
  review:
    summary: 'Proposed: SMAD1/SMAD5 binding, by similarity to mouse Tbx20 (Singh et al. 2009).'
    action: NEW
    reason: Mouse Tbx20 (including DNA-binding-deficient mutants) binds Smad1 and Smad5 and sequesters
      them from Smad4, attenuating Bmp/Smad-dependent activation of the Tbx2 AVC enhancer; this is how
      Tbx20 confines Tbx2 to the AVC. The T-box domain is conserved in human TBX20. MGI annotates mouse
      Tbx20 to negative regulation of SMAD protein signal transduction (IDA, PMID:19661464), but no SMAD
      binding MF is annotated; the binding itself is the activity that executes the regulation.
    supported_by:
    - reference_id: PMID:19661464
      supporting_text: both Tbx20 and mutant isoforms of Tbx20 unable to bind DNA attenuate Bmp/Smad-dependent
        activation of Tbx2 by binding Smad1 and Smad5 and sequestering them from Smad4
- term:
    id: GO:0060392
    label: negative regulation of SMAD protein signal transduction
  evidence_type: ISS
  original_reference_id: PMID:19661464
  review:
    summary: 'Proposed: negative regulation of SMAD signal transduction by SMAD1/5 sequestration, by similarity
      to mouse Tbx20 (MGI IDA).'
    action: NEW
    reason: Mouse Tbx20 (including DNA-binding-deficient mutants) binds Smad1 and Smad5 and sequesters
      them from Smad4, attenuating Bmp/Smad-dependent activation of the Tbx2 AVC enhancer; this is how
      Tbx20 confines Tbx2 to the AVC. The T-box domain is conserved in human TBX20. MGI annotates mouse
      Tbx20 to negative regulation of SMAD protein signal transduction (IDA, PMID:19661464), but no SMAD
      binding MF is annotated; the binding itself is the activity that executes the regulation. TBX20
      itself performs the regulatory step by binding the R-SMADs, so the participation test is met.
    supported_by:
    - reference_id: PMID:19661464
      supporting_text: both Tbx20 and mutant isoforms of Tbx20 unable to bind DNA attenuate Bmp/Smad-dependent
        activation of Tbx2 by binding Smad1 and Smad5 and sequestering them from Smad4
    - reference_id: PMID:15843414
      supporting_text: Our data demonstrate a repressive activity for Tbx20 and place it upstream of Tbx2
        in the cardiac genetic program
