  - UniProtKB:Q9C0K1
  review:
    summary: >-
      Zn2+/bicarbonate symport is documented for the LIV-1 paralogs ZIP8 (Q9C0K1) and
      ZIP14 (Q15043) that seed this node, but ZIP12 is curated as a Zn2+ uniporter, so the
      symport mechanism is not established for ZIP12.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IBD placed cation:bicarbonate symporter activity at the ZIP node largely on the
      strength of ZIP8 and ZIP14, which are experimentally electroneutral symporters of
      zinc and bicarbonate. For ZIP12 specifically, UniProt (via the rodent ortholog Q5FWH7)
      describes a uniporter with a Zn2+-only reaction (Zn2+(in) = Zn2+(out)) and no
      bicarbonate co-substrate. This is target-specific evidence of mechanistic divergence
      from the symport subfamily members, so the symporter term over-states what is known
      for ZIP12. Marked over-annotated rather than removed because the mechanism of ZIP12
      has not been directly assayed and symport remains possible; the accepted GO:0005385
      row captures the undisputed zinc-transport activity.
    propagation_review:
