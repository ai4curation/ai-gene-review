    summary: >-
      ZIP12 orthologs are required for neural tube closure; loss of ZIP12 in Xenopus
      impairs neurulation. This is a developmental process that depends on ZIP12's
      zinc-import activity rather than a step ZIP12 itself catalyses.
    action: KEEP_AS_NON_CORE
    reason: >-
      The ISS is transferred from the Xenopus ortholog (A0A6I8PMZ8), where ZIP12
      knockdown disrupts neural tube closure, and UniProt records a role in neurulation
      for the entry. ZIP12's molecular action is Zn2+ import across the plasma membrane;
      neural tube formation requires that cytosolic zinc (for downstream neuronal
      differentiation) but ZIP12 does not perform a morphogenetic step of the process
      itself. Under the participation test this is a developmental process that merely
      requires the transporter, so it is kept as a non-core, context role rather than
      ACCEPTed as a core function or removed.
