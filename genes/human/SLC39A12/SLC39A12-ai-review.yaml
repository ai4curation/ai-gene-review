id: Q504Y0
gene_symbol: SLC39A12
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC39A12 (ZIP12) is a multi-pass plasma-membrane protein of the LIV-1 subfamily of
  the ZIP (SLC39 / ZRT-IRT-like) family of metal-ion transporters. It mediates influx
  of Zn2+ from the extracellular space into the cytoplasm, acting as a zinc uniporter
  with temperature-dependent transport activity, and thereby raises cytosolic zinc.
  ZIP12 is expressed most strongly in the nervous system and eye (brain, retina and
  choroid). The cytosolic zinc it supplies is required for neuronal differentiation,
  neuron-projection (neurite) extension and neural tube closure during early
  development, and by controlling intracellular zinc content it contributes to cellular
  zinc homeostasis. Like other LIV-1/ZIP transporters, ZIP12 redistributes between
  perinuclear compartments and the plasma membrane in response to extracellular zinc
  availability. It has additionally been implicated in the pulmonary vascular response
  to chronic hypoxia and, through maintenance of intracellular zinc, in protecting
  germ cells from oxidative stress during spermatogenesis.
