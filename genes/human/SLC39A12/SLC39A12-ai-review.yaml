    Does human ZIP12 operate as a Zn2+ uniporter, or as a Zn2+/bicarbonate symporter like
    its LIV-1 paralogs ZIP8 and ZIP14? UniProt curates it as a uniporter, but the transport
    mechanism has not been directly assayed for ZIP12.
- question: >-
    What is the mechanistic basis of ZIP12's role in the pulmonary vascular response to
    chronic hypoxia, and is the relevant zinc import in pulmonary arterial smooth muscle?
suggested_experiments:
- hypothesis: >-
    Human ZIP12 imports Zn2+ by facilitated diffusion (uniport) and does not require
    bicarbonate co-transport.
  description: >-
    Reconstitute purified human ZIP12 in proteoliposomes or express it in cells lacking
    endogenous zinc uptake, and measure radiolabeled 65Zn2+ uptake as a function of extracellular
    bicarbonate concentration and membrane potential, comparing directly against ZIP8/ZIP14
    under identical conditions to test for electroneutral symport versus uniport.
  experiment_type: transport assay / electrophysiology
- hypothesis: >-
    ZIP12-mediated zinc import is required cell-autonomously for neurite outgrowth and
    neural tube closure.
  description: >-
    Knock out or knock down SLC39A12 in human neuronal/organoid models and in Xenopus,
    quantify neurite extension and neural tube closure, and test rescue with wild-type
    versus transport-dead ZIP12 and with zinc supplementation to separate the transport
    function from any structural role.
  experiment_type: loss-of-function / rescue
knowledge_gaps:
- gap_statement: >-
    The transport mechanism of human ZIP12 - whether it moves Zn2+ alone (uniport) or
    co-transports bicarbonate (symport) - has not been directly determined.
  boundary: >-
    It is firmly established that ZIP12 is a plasma-membrane member of the LIV-1/ZIP family
    that raises cytosolic Zn2+; UniProt curates a Zn2+-only uniporter reaction by similarity,
    while the paralogs ZIP8 and ZIP14 are experimentally Zn2+/HCO3- symporters.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    The mechanism determines the correct molecular-function term (uniporter versus
    cation:bicarbonate symporter) and the pH/bicarbonate dependence of zinc import in the
    tissues where ZIP12 acts.
