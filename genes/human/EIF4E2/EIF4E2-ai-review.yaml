proposed_new_terms: []
suggested_questions:
- question: How does EIF4E2 switch between GIGYF-associated repression and eIF4G3-associated hypoxic
    translation initiation, and which physiological oxygen ranges and mRNA features determine each
    mode?
- question: How is 4EHP partitioned among its distinct repressor complexes (GIGYF1/2-RQC,
    4E-T/CCR4-NOT miRNA silencing), and does ARIH1-mediated ubiquitylation regulate this?
suggested_experiments:
- description: Cap-binding separation-of-function mutants of 4EHP tested in RQC reporter assays
    versus miRNA-silencing reporters to dissect the contributions of cap binding to each pathway.
- description: Quantitative proteomics of 4EHP complexes (GIGYF1/2, ZNF598, 4E-T, CCR4-NOT) across
    conditions to map context-dependent complex assembly and target mRNA selection.
