id: O60573
gene_symbol: EIF4E2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EIF4E2 (4EHP) is a class II eIF4E-family protein that binds the 7-methylguanosine cap
  of mRNA and controls translation through distinct complexes. With GIGYF1/2 and associated
  repressors, it suppresses initiation on selected messages, including faulty transcripts that
  trigger ribosome quality control. Through 4E-T and the CCR4-NOT machinery it also contributes to
  miRNA-mediated translational silencing. Under hypoxia, EIF4E2 assembles with eIF4A and eIF4G3 into
  the eIF4FH complex and supports cap-dependent translation of an oxygen-regulated mRNA program. Its
  inability to recruit canonical eIF4G1 therefore does not preclude translation initiation through
  eIF4G3. EIF4E2 localizes to the cytoplasm and P-bodies, binds the RBR ubiquitin ligase
  ARIH1/HHARI, and is subject to ubiquitylation.
