    action: ACCEPT
    reason: 'PTHR11960 places initiation-factor, initiation-process and eIF4F-complex assertions at PTN000238660.
      The prior review generalized inability to recruit canonical eIF4G1 into inability to recruit any
      eIF4G. Primary studies PMID:22678294 and PMID:26854219 demonstrate hypoxic translation and assembly
      of eIF4E2 with eIF4A and eIF4G3 (eIF4FH), together with functional depletion and polysome evidence.
