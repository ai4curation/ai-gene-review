- description: As the cap-binding core of the 4EHP-GIGYF2 module (with GIGYF1/2, ZNF598 and DDX6)
    and of miRNA/CCR4-NOT silencing, 4EHP represses cap-dependent translation initiation of specific
    mRNAs, including ribosome-stalling messages in ribosome-associated quality control.
