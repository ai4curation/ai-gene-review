    review_notes: Full narrative and delivered plot provenance code read. Supported
      initiation/repression findings retained. The complex-composition rejection overlooks primary
      endogenous eIF4E2/eIF4A/eIF4G3 pull-downs and depletion evidence in PMID:26854219 and eIF4A
