- term:
    id: GO:0072344
    label: rescue of stalled cytosolic ribosome
  evidence_type: IDA
  original_reference_id: PMID:32726578
  qualifier: involved_in
  review:
    summary: EIF4E2 suppresses additional translation initiation on faulty messages, acting
      alongside ribosome quality-control machinery.
    action: MODIFY
    reason: GO:0072344 specifically requires freeing an already stalled cytosolic ribosome. The full
      primary study instead establishes cap-dependent inhibition of new initiation by 4EHP/GIGYF2,
      including genetic separation from degradation machinery. Participation in the larger
      quality-control response does not demonstrate release of the stalled ribosome. Replace with
      the experimentally measured negative regulation of translational initiation, already
      independently annotated here.
    proposed_replacement_terms:
    - id: GO:0045947
      label: negative regulation of translational initiation
    supported_by:
    - reference_id: PMID:32726578
      supporting_text: inhibition of additional rounds of translation acts in concert with known RQC
        pathways to prevent buildup of toxic proteins.
