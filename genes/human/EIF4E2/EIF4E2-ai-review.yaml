      opposite dorsal partner-binding surface and labels IBA/ISS evidence weak without evaluating
      the ancestral assertion. Plot code hard-codes claimed sequence identities rather than
      delivering the alignment, so exact numbers are not adopted as reproduced analyses.
  findings:
  - statement: The report usefully distinguishes condition-dependent initiation from
      GIGYF-associated repression, which coexist in this review. Its negative complex-composition
      conclusion is contradicted by the cited primary pull-down evidence and is not adopted.
