id: Q8IVJ1
gene_symbol: SLC41A1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'SLC41A1 is the principal plasma-membrane Na+/Mg2+ exchanger of human cells, mediating Mg2+ efflux driven by the inwardly directed Na+ electrochemical gradient. It is the major cellular Mg2+ extrusion system and a key determinant of intracellular Mg2+ homeostasis, and it generates circadian cellular Mg2+ oscillations that couple to metabolism. It is broadly expressed, with highest levels in heart and testis, and localizes to the plasma membrane (basolateral in polarized epithelia). It belongs to the SLC41/MgtE family of integral-membrane Mg2+ transporters.'
