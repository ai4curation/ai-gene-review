suggested_questions:
- question: Does native human CDHR1 directly bind PCDH15, and what stoichiometry and geometry connect
    the outer-segment membrane to calyceal processes in rods versus cones?
- question: Which calcium sites and affinities govern human CDHR1 ectodomain structure and partner
    binding? The inspected ortholog aggregation study did not measure calcium dependence.
- question: How does the preserved alternative product Q96JP9-2, whose sequence differs around the
    canonical transmembrane region and lacks the canonical distal tail, localize and function relative
    to Q96JP9-1?
- question: Which protease cleaves CDHR1, and how is ectodomain shedding coupled to disc formation
    and release in rods versus cones? CDHR1 is the cleaved substrate, not an established protease.
- question: Is the CDHR1-PROM1 association a direct molecular interaction, and how does it relate
    to the PCDH15-associated outer-segment connection? Existing mouse PCDH21 co-immunoprecipitation
    does not resolve a purified binary interface or the native human complex.
