gene_symbol: CDHR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CDHR1 (photoreceptor cadherin, formerly PCDH21) is an atypical cadherin with six extracellular
  cadherin repeats and a single transmembrane segment in its canonical 859-amino-acid product. It
  is concentrated near the base of photoreceptor outer segments and contributes to outer-segment
  membrane organization and photoreceptor survival. Human biallelic variants cause retinal dystrophy.
  Mouse ultrastructure places its ortholog at contacts between nascent outer-segment membranes and
  the inner segment of the same photoreceptor. Zebrafish Cdhr1a associates with Pcdh15b and supports
  heterotypic adhesion in cell assays, suggesting a conserved cadherin-based connection between outer
  segments and calyceal processes; the precise human molecular complex remains unresolved. Ectodomain
  shedding and association with prominin-1 have been demonstrated in mammalian ortholog systems.
