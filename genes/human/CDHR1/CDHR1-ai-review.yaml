  review:
    summary: Refine the broad morphogenesis assertion to outer-segment organization.
    action: MODIFY
    reason: The original human IMP study uses SD-OCT and AOSLO to characterize outer-retinal
      abnormalities in adults with a segregating truncating allele; the authors interpret the
      structural lesions as possible disorganized outer segments. It does not directly assay the
      acquisition of specialized photoreceptor features described by GO:0008594. The replacement
      GO:0035845 therefore captures the anatomical scope of this human evidence as a lateral semantic
      refinement, not an ontology-descendant narrowing. Independent fish work supports the
      outer-segment structural role and shows early changes at 5 and 15 dpf; those findings are a
      caveat against excluding developmental biology, not the justification for this source-specific
      replacement. The original source and evidence code remain unchanged. The replacement already
      has another source row, so no NEW assertion is added.
