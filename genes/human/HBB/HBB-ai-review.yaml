      and NO restriction. This mechanism is not substituted for erythrocyte SNO export or isolated-beta
      nitrite-reductase activity.
functional_isoforms:
- id: HBB_MATURE_CHAIN
  name: Mature hemoglobin subunit beta
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000052976
    residues: 2-147
  description: The 146-residue beta-globin chain after initiator-methionine removal. It binds heme and
    supplies the two beta subunits of adult hemoglobin A, functioning principally in erythrocyte gas transport.
    Its oxygen-carrier activity is distinct from the pharmacological activities reported for shorter internal
    globin-derived peptides.
- id: HBB_LVV_HEMORPHIN_7
  name: LVV-hemorphin-7
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000296641
    residues: 33-42
  description: The decapeptide LVVYPWTQRF corresponds to HBB precursor residues 33-42. Mass spectrometry
    and sequencing identified it in human ventricular CSF after cerebrovascular bleeding, but not in control
    samples (PMID:1575724). Its sequence is shared with other beta-like globins, so detection does not
    uniquely establish HBB as its source. Bradykinin-potentiating activity was investigated with mammalian
    peptide isolates and pharmacology in anesthetized rats (PMID:16904236), not demonstrated as a normal
    human blood-pressure-regulatory function.
- id: HBB_SPINORPHIN
  name: Spinorphin
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000424226
    residues: 33-39
  description: The heptapeptide LVVYPWT corresponds to HBB precursor residues 33-39. It antagonized recombinant
    human P2X3 receptors in Xenopus oocytes in a peptide structure-activity study (PMID:17676725). Bovine
    spinal-cord isolation and inhibition of monkey-brain enkephalin-degrading enzymes are summarized in
    PMID:12470213. These peptide experiments do not establish endogenous human HBB-dependent pain regulation
    or assign those activities to intact beta-globin.
core_functions:
- description: Reversibly binds oxygen through its heme group as the beta subunit of adult hemoglobin
    A, supporting oxygen loading in the lungs and delivery to peripheral tissues. Within erythrocyte HbA,
    N-terminal carbamation and proton binding also contribute to carbon dioxide carriage and its exchange
    for oxygen in the lungs.
  molecular_function:
    id: GO:0005344
    label: oxygen carrier activity
  directly_involved_in:
  - id: GO:0015671
    label: oxygen transport
  - id: GO:0015670
    label: carbon dioxide transport
  locations:
  - id: GO:0005829
    label: cytosol
  in_complex:
    id: GO:0005833
    label: hemoglobin complex
  supported_by:
  - reference_id: PMID:16765986
    supporting_text: a hydrogen bond to exist between the distal histidine and oxygen ligand of both the
      alpha and beta-subunits
    reference_section_type: ABSTRACT
  - reference_id: Reactome:R-HSA-1237325
    supporting_text: chemical reaction (carbamation) of the N-terminal valines of HbA by CO2
  - reference_id: Reactome:R-HSA-1247668
    supporting_text: facilitates the exchange of CO2 for O2 in the lungs
knowledge_gaps:
- gap_statement: The quantitative contribution and physiological necessity of beta-Cys93-dependent NO-group
    transfer in human microvascular oxygen delivery remain unresolved.
  boundary: Human molecular-transfer and beta-chain structural evidence exist, but mouse physiological
    studies reach conflicting conclusions about beta-Cys93 necessity. A demonstrated chemical transfer
    is not proof of an obligatory organism-level mechanism.
  gap_kind:
  - BIOLOGY
  resolution: Compare source-resolved SNO transfer, oxygen delivery and vascular responses across matched
    models and human erythrocyte preparations, while distinguishing heme-NO, beta-thiol SNO, AE1 transfer
    and other NO-export routes.
  provenance:
  - reference_id: PMID:11214321
    supporting_text: which subserves NO group transfer to the membrane
    reference_section_type: ABSTRACT
  - reference_id: PMID:25810253
    supporting_text: mice with a βCys93Ala mutation are deficient in hypoxic vasodilation
    reference_section_type: ABSTRACT
  - reference_id: PMID:30905171
    supporting_text: but this occurs independently of SNO formation at the β93 cysteine of Hb.
    reference_section_type: ABSTRACT
- gap_statement: The endogenous human sources, concentrations and receptor contributions of beta-like-globin-derived
    peptides remain incompletely resolved.
  boundary: Human LVV-hemorphin-7 detection after bleeding is real but its sequence is shared across globins;
    spinorphin receptor pharmacology and nonhuman isolation do not establish a normal human HBB-specific
    signaling role.
  gap_kind:
  - BIOLOGY
  resolution: Quantify sequence-resolved endogenous peptides and their precursors in human samples, distinguish
    pathological release from baseline production and compare measured concentrations with receptor activity.
  provenance:
  - reference_id: PMID:1575724
    supporting_text: beta-, delta-, gamma- or epsilon-chains of hemoglobin
    reference_section_type: ABSTRACT
  - reference_id: PMID:17676725
    supporting_text: recombinant human P2X3 receptors expressed in Xenopus oocytes
    reference_section_type: ABSTRACT
suggested_questions:
- question: Can full source papers or protein/peptide tables resolve the chromatography/tomography interactions,
    prostatic-exosome identification, plasma-microvesicle identification and thalassemia-minor renal annotation
    currently held UNDECIDED?
- question: How much of HBB-associated vascular NO bioactivity in humans depends on beta-Cys93 SNO transfer,
    compared with heme-bound NO, other erythrocyte thiols and endothelial Hb/eNOS chemistry?
- question: Which endogenous beta-like-globin processing routes generate LVV-hemorphin-7 and spinorphin
    in humans, and can their source loci and concentrations be distinguished without assigning proteolytic
    processing to the globin substrate?
