- term:
    id: GO:0030185
    label: nitric oxide transport
  evidence_type: IDA
  original_reference_id: PMID:8292032
  qualifier: involved_in
  review:
    summary: Beta-chain NO-group transfer has support, while its obligatory physiological role is disputed.
    action: KEEP_AS_NON_CORE
    reason: The original PMID:8292032 establishes heme-NO spectroscopy, not directed transport by itself.
      Distinct beta-specific corroboration identifies Cys93beta S-nitrosylation (PMID:9843411) and human
      erythrocyte Hb-derived SNO transfer to AE1 with deoxygenation-associated export (PMID:11214321),
      alongside reported arterial-venous NO-group release (PMID:8637569). Retain this bounded NO-derived-group/bioactivity
      transfer as non-core, not free-NO diffusion or an obligatory universal hypoxic-vasodilation mechanism.
      Positive beta-Cys93Ala mouse physiology in PMID:25810253 conflicts with PMID:18516054 and PMID:30905171,
      which find the residue nonessential in their tested models; nonessentiality does not show that SNO
      transfer cannot occur. Conventional mature beta-Cys93 is precursor Cys94.
    supported_by:
    - reference_id: PMID:8292032
      supporting_text: nitric oxide bound to heme iron in human hemoglobin A nitrosyl
      reference_section_type: ABSTRACT
    - reference_id: PMID:9843411
      supporting_text: The specific reaction of NO with Cys93beta is confirmed in this structure
      reference_section_type: ABSTRACT
    - reference_id: PMID:11214321
      supporting_text: which subserves NO group transfer to the membrane
      reference_section_type: ABSTRACT
    - reference_id: PMID:8637569
      supporting_text: the NO group is released during arterial-venous transit
      reference_section_type: ABSTRACT
    - reference_id: PMID:30905171
      supporting_text: but this occurs independently of SNO formation at the β93 cysteine of Hb.
      reference_section_type: ABSTRACT
