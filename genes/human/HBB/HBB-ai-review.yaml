id: P68871
gene_symbol: HBB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HBB encodes beta-globin, the heme-binding beta subunit of adult hemoglobin A. Two beta chains
  assemble with two alpha chains to form the principal respiratory hemoglobin of adult erythrocytes. Reversible
  oxygen ligation, cooperative changes in subunit contacts, proton binding and N-terminal carbamation
  couple oxygen delivery to carbon dioxide carriage. Beta-globin can also form beta4 hemoglobin in alpha-chain
  deficiency and assemble with zeta-globin in distinct developmental or disease contexts. Hemoglobin influences
  nitric oxide availability through ligand binding, redox chemistry and transfer of NO-derived groups;
  the physiological necessity of beta-Cys93 S-nitrosylation remains disputed. Extracellular hemoglobin
  binds haptoglobin for clearance and can generate damaging peroxide-dependent chemistry. Internal globin
  sequences include LVV-hemorphin-7 and spinorphin, whose peptide activities and source attribution are
  distinct from those of the intact oxygen carrier.
