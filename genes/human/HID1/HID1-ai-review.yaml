id: Q8IV36
gene_symbol: HID1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  HID1 is a conserved 788-residue peripheral membrane protein of the HID1/Ecm30
  family (PANTHER PTHR21575, subfamily SF12) with no recognised catalytic,
  lipid-binding or protein-interaction domain. Despite early predictions of
  transmembrane segments, it is a soluble protein that shuttles between the
  cytosol and the cytoplasmic face of the medial- and trans-Golgi and the
  trans-Golgi network (TGN). Membrane association depends on an N-terminal
  myristoylated glycine and an adjacent polybasic patch, while TGN specificity
  and function reside in a highly conserved C-terminal domain. In neuroendocrine
  and endocrine cells HID1 is required for the biogenesis of large dense core
  vesicles (secretory granules): it supports sorting of soluble and membrane
  cargo into these granules, formation of the dense core, acidification of the
  TGN with correct localisation of the V-ATPase a2 subunit, and homotypic fusion
  of immature granules during their maturation, and so the storage and regulated
  release of peptide hormones and neuropeptides. Most of this functional
  evidence comes from rat neuroendocrine cell lines and mouse pancreatic beta
  cells, whose HID1 orthologs are about 95% identical to the human protein; in
  humans, biallelic HID1 variants cause an early infantile epileptic
  encephalopathy with hypopituitarism (DEE105). Its molecular activity is
  unknown.
