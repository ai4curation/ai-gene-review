- term:
    id: GO:0007030
    label: Golgi organization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000491103
  - PomBase:SPAC17A5.16
  review:
    summary: Placed at the eukaryote-level node PTN000491103 by PAINT, seeded only by the fission
      yeast HID paralog SPAC17A5.16, whose mutant lacks stacked Golgi.
    action: KEEP_AS_NON_CORE
    reason: The PAINT curator judged Golgi organization ancestral to the whole family and placed it at
      the eukaryote node, with explicit IRD negations on the Schizosaccharomyces-specific paralog
      branches; human HID1 sits inside the clade that inherits the node. The sole seed, SPAC17A5.16,
      is in a different subfamily (PTHR21575:SF13, about 32% identity) from human HID1 (SF12), and no
      SF12 member has been shown to maintain Golgi stack structure. HID1 loss in mammalian cells does
      perturb TGN function (acidification, V-ATPase a2 localization), so a role in Golgi organization
      is plausible but is inferred only; the specific SF12 function is dense core vesicle biogenesis.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      failure_modes: []
      source_entities:
      - source_id: PANTHER:PTN000491103
        comment: Eukaryote-level node carrying the Golgi organization IBD, seeded by fission yeast
          SPAC17A5.16 (SF13). Human HID1 (SF12) descends from it and no loss is documented, but no SF12
          member has direct evidence for Golgi stack maintenance.
        source_status: SUPPORTS_TRANSFER
    supported_by:
    - reference_id: PMID:40899782
      supporting_text: Transmission electron microscopy revealed that the SPAC17A5.16 mutant lacks a stacked
        Golgi apparatus (GA) form, suggesting a role in maintaining GA structure
    - reference_id: file:human/HID1/HID1-bioinformatics/RESULTS.md
      supporting_text: is in a different subfamily (SF13)
    - reference_id: PMID:29074564
      supporting_text: HID-1 KO cells also exhibit defects in TGN acidification together with mislocalization
        of the Golgi-enriched vacuolar H+-ATPase subunit isoform a2
