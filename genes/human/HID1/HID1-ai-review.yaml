core_functions:
- description: HID1 is recruited from the cytosol to the cytoplasmic face of the trans-Golgi network,
    where it is required for the biogenesis of large dense core vesicles (secretory granules) in
    neuroendocrine and endocrine cells, including cargo sorting into nascent granules and dense core
    formation. The evidence is genetic and structure-function work with the rat ortholog in PC12 and
    INS-1 cells, including the human DEE105 patient frameshift modelled in rat HID1; the human protein
    itself has been shown only to localize to the TGN. Its molecular activity is unknown, so no
    molecular function is asserted.
  directly_involved_in:
  - id: GO:0061110
    label: dense core granule biogenesis
  locations:
  - id: GO:0032588
    label: trans-Golgi network membrane
  - id: GO:0098548
    label: cytoplasmic side of Golgi membrane
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:29074564
    supporting_text: Loss of HID-1 causes a reduction in the number of LDCVs and affects their morphology
      and biochemical properties, due to impaired cargo sorting and dense core formation
  - reference_id: PMID:37751424
    supporting_text: this isolated domain, when tethered to the TGN, can rescue the neuroendocrine secretion
      and sorting defects observed in HID-1 KO cells
  - reference_id: PMID:33999436
    supporting_text: Colocalization of HID1 protein with the TGN was not altered in fibroblasts of patients
      compared to controls
  - reference_id: PMID:21337012
    supporting_text: dynamically shuttled between the Golgi apparatus and the cytosol
- description: HID1 is required for maturation of immature secretory granules by homotypic fusion,
    and so for proinsulin processing, in pancreatic beta cells. This rests on conditional knockout of
    the mouse ortholog (same PANTHER subfamily, about 96% identical) and is a metazoan-level inference
    for the human protein.
  directly_involved_in:
  - id: GO:0061792
    label: secretory granule maturation
  locations:
  - id: GO:0032588
    label: trans-Golgi network membrane
  supported_by:
  - reference_id: PMID:27751232
    supporting_text: HID-1 deficiency prevented secretory granule maturation by blocking homotypic fusion
      of immature secretory granules
  - reference_id: file:human/HID1/HID1-bioinformatics/RESULTS.md
    supporting_text: Human, mouse and rat HID1 share PANTHER subfamily SF12
  knowledge_gaps:
  - gap_statement: The molecular activity of HID1 is unknown. It has no recognised domain, and how its
      conserved C-terminal domain promotes cargo sorting, TGN acidification and granule fusion, and which
      proteins or lipids it acts on, has not been determined.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Does HID1 act directly on the Golgi V-ATPase (for example on a2-subunit trafficking or
    assembly), or is mislocalization of a2 a secondary consequence of defective granule formation?
- question: Is the Golgi organization IBA, seeded only by the SF13 fission yeast paralog SPAC17A5.16,
    appropriate for metazoan SF12 members whose experimentally shown role is dense core vesicle biogenesis?
- question: Do any of the DEE105 missense variants (for example p.R433W) disrupt dense core vesicle
    biogenesis when expressed as the human protein in HID1-null neuroendocrine cells?
suggested_experiments:
- description: Identify direct binding partners of the conserved C-terminal domain (residues ~686-788)
    by proximity labelling at the TGN in HID1-knockout neuroendocrine cells rescued with TGN-tethered
    human HID1, and test candidates by in vitro binding with purified protein.
  experiment_type: proximity labelling and in vitro reconstitution
- description: Rescue HID1-knockout PC12 or INS-1 cells with human HID1 wild type and DEE105 patient
    variants, measuring secretogranin sorting, regulated secretion and TGN pH, to establish the activity
    directly for the human protein.
  experiment_type: complementation assay
