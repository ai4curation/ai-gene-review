        supporting_text: COA7 is a soluble protein of the IMS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete abstract and selected actual Methods, human rescue Results and suborganellar
      localization Discussion were read. Clinical/complex-IV rescue evidence remains valid; the matrix-localization
      interpretation is disputed by later independent swelling/protease and imaging experiments.
