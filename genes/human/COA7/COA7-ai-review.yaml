id: Q96BR5
gene_symbol: COA7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COA7 is a disulfide-rich, Sel1-like repeat protein in the mitochondrial intermembrane space.
  Its heme-dependent protein-disulfide reductase activity supports the reduced state of SCO1 and SCO2
  during cytochrome c oxidase assembly, maintaining cysteine redox states compatible with SCO-mediated
  biogenesis of the CuA copper site in MT-CO2/COX2. COA7 is itself imported and oxidatively folded through
  CHCHD4/MIA40. Recessive variants cause a mitochondrial neurological disorder that can include spinocerebellar
  ataxia with axonal neuropathy type 3 (SCAN3) and leukoencephalopathy.
