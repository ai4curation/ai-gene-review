  findings:
  - statement: Wild-type COA7 complementation restores complex-IV assembly and activity in patient-derived
      fibroblasts.
  - statement: The authors interpreted their trypsin-protection and fractionation experiments as predominantly
      matrix localization.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
