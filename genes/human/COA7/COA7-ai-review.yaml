- term:
    id: GO:0015035
    label: protein-disulfide reductase activity
  evidence_type: IDA
  original_reference_id: PMID:35210360
  qualifier: enables
  review:
    summary: Reduced heme-bound COA7 directly reduces SCO protein disulfides.
    action: ACCEPT
    reason: Recombinant human COA7 expressed in E. coli was GST-cleaved, heme-loaded and reduced; excess
      dithionite was removed before reaction with soluble SCO1 128–301 or SCO2 96–266. Mass shifts identify
      disulfide reduction. SCO1 controls include hemin alone, apo protein, heme-ligand mutant and cytochrome
      c; SCO2 SI S18 separately compares WT and Y137C. Cellular rescue supports the redox role, while
      electron-donor identity and turnover kinetics remain open.
    supported_by:
    - reference_id: PMID:35210360
      supporting_text: reduction of a single disulfide bond
