- id: PMID:30885959
  title: Inhibition of proteasome rescues a pathogenic variant of respiratory chain assembly factor COA7.
  findings:
  - statement: CHCHD4 imports COA7 as a disulfide-bonded substrate, and human biochemical/imaging experiments
      favor soluble IMS localization.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected human-cell Results, localization legends and Methods were read. Cysteine-dependent
      CHCHD4 association, mitochondrial import, swelling/protease assays and compartment-resolved imaging
      support substrate import and IMS residence. Reciprocal COA7 overexpression controls do not establish
      an import-catalyst role.
