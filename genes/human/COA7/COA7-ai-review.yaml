core_functions:
- description: In the mitochondrial intermembrane space, heme-bound COA7 supplies disulfide-reducing capacity
    to SCO proteins during complex-IV assembly. Reduced recombinant human COA7 directly reduces SCO1 and
    SCO2 substrate disulfides, and human cellular loss/rescue shifts their redox states and complex-IV
    assembly. Heme is a cofactor in this role; the physiological electron donor and repeated turnover
    remain to be established.
  molecular_function:
    id: GO:0015035
    label: protein-disulfide reductase activity
  directly_involved_in:
  - id: GO:0033617
    label: mitochondrial respiratory chain complex IV assembly
  locations:
  - id: GO:0005758
    label: mitochondrial intermembrane space
  supported_by:
  - reference_id: PMID:35210360
  - reference_id: PMID:30885959
  - reference_id: PMID:24333015
suggested_questions:
- question: Which physiological reductant regenerates reduced heme-COA7, and how does COA7 cooperate with
    COA6 and the SCO proteins during CuA-site maturation?
- question: Which screen-defined COA7 interactions occur in native cellular compartments, and which depend
    on recombinant fragments, tags or expression conditions?
suggested_experiments:
- description: Reconstitute COA7-dependent SCO disulfide reduction with candidate physiological electron
    donors, measuring multiple turnover and testing heme-ligand variants while monitoring substrate redox
    state.
- description: Test selected screen-defined pairs by endogenous reciprocal capture and compartment-resolved
    perturbation, retaining the exact assayed isoforms and fragment boundaries.
