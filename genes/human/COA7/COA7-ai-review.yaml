- id: PMID:35210360
  title: Mitochondrial COA7 is a heme-binding protein with disulfide reductase activity, which acts in
    the early stages of complex IV assembly.
  findings:
  - statement: Human COA7 combines heme binding with disulfide-reducing capacity toward SCO proteins and
      supports complex-IV assembly.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected complete primary Results/Methods and the independently sealed supplemental
      consultation support recombinant human COA7 heme binding, SCO disulfide reduction and human cellular
      assembly/redox rescue. Human protein was expressed in E. coli; soluble SCO domains were tested.
      No physiological upstream donor, catalytic cycling, heme delivery or copper-chaperone role was demonstrated.
