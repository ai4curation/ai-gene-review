id: Q96BR5
gene_symbol: COA7
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: COA7 is a disulfide-rich, Sel1-like repeat protein in the mitochondrial intermembrane space.
  Its heme-dependent protein-disulfide reductase activity supports the reduced state of SCO1 and SCO2
  during cytochrome c oxidase assembly, linking redox chemistry to maturation of the copper-containing
  COX2 module. COA7 is itself imported and oxidatively folded through CHCHD4/MIA40. Recessive variants
  cause a mitochondrial neurological disorder that can include spinocerebellar ataxia, axonal neuropathy
  and leukoencephalopathy.
