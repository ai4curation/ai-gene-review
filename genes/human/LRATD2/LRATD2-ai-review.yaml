- id: PMID:34433667
  title: An in vitro vesicle formation assay reveals cargo clients and factors that
    mediate vesicular trafficking.
  findings:
  - statement: >-
      Human LRATD2 associates with vesicle membranes in a GTP-dependent manner and
      occupies cytoplasmic, juxtanuclear Golgi, and peripheral membrane-associated
      pools in HEK293T assays.
    supporting_text: >-
      Western blot analysis confirmed that FAM84B/LRATD2 was significantly enhanced
      in the vesicle fraction when the incubation was conducted in the presence of
      GMPPNP (Fig. 3A, compare lanes 2 and 3). HA-tagged FAM84B/LRATD2 (FAM84B-HA)
      was partially located at the cytoplasm and partially located at the
      juxtanuclear Golgi area colocalized with TGN46 (SI Appendix, Fig. S1A).
    reference_section_type: RESULTS
  - statement: >-
      Cross-linked coimmunoprecipitation detected LRATD2 with AP1gamma1 and
      Sec23A/B, but not Sar1A.
    supporting_text: >-
      FAM84B-HA coimmunoprecipitated with AP1γ1 and Sec23A/B, but not Sar1A in
      the presence of a cross-linker (Fig. 3B).
    reference_section_type: RESULTS
  - statement: >-
      LRATD2 knockdown selectively delayed ER-to-Golgi transport of EGFR and was
      rescued by siRNA-resistant LRATD2, while ShhN and IGF2 transport was unaffected.
    supporting_text: >-
      Knockdown of FAM84B/LRATD2 caused a significant delay of EGFR transport from
      the ER to the Golgi in the RUSH transport system (Fig. 3C and SI Appendix,
      Fig. S3 A and B). The defects were rescued by expressing a siRNA-resistant
      construct of FAM84B-HA (Fig. 3 D and E). In contrast, knockdown of
      FAM84B/LRATD2 did not cause defects in the ER-to-Golgi transport of
      SBP-EGFP-ShhN and SBP-EGFP-IGF2-HA (Fig. 3 F–I).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text, title, and exact quotes are verified. This is the strongest focused
      evidence for a direct cellular role of human LRATD2. The knockdown/rescue and
      cargo selectivity support anterograde EGFR trafficking, while localization and
      co-IP used tagged protein in HEK293T cells and the discovery assay included rat
      liver cytosol, which limits claims about a native stable coat complex.
- id: PMID:34956690
  title: Binding Affinity Determines Substrate Specificity and Enables Discovery of
    Substrates for N-Myristoyltransferases.
  findings:
  - statement: >-
      Chemical-proteomic labeling identified LRATD2, LRATD1, and ERICH5 as candidate
      substrates of human NMT1/2.
    supporting_text: >-
      However, three proteins LRATD1 (LRAT domain-containing 1, also called FAM84A or
      neurological sensory protein 1 NSE1), LRATD2 (FAM84B/NSE2), and ERICH5
      (glutamate-rich protein 5) demonstrated clear fluorescence signals in the Alk12
      treated samples compared to the control without Alk12 treatment, and the signals
      were hydroxylamine-resistant, suggesting that they are potentially N-myristoylated.
    reference_section_type: RESULTS
  - statement: >-
      NMT inhibition and loss of labeling in Gly2-to-Ala mutants confirmed LRATD2
      and LRATD1 separately as NMT1/2 substrates.
    supporting_text: >-
      Alk12 labeling signals decreased with the treatment of NMT inhibitor in LRATD1,
      LRATD2, and ERICH5 and were completely removed in G2A mutants, confirming
      LRATD1, LRATD2, and ERICH5 as substrates of NMT1/2 (Figure 4C).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text, title, and exact quotes are verified. This directly establishes
      overexpressed human LRATD2 as an NMT substrate in HEK293T cells, not as a lipid-
      metabolic enzyme. LRATD1 was tested separately, so its phenotypes cannot be
      transferred to LRATD2.
- id: PMID:31205500
  title: FAM84B promotes prostate tumorigenesis through a network alteration.
  findings:
  - statement: >-
      Full-length LRATD2, but not a construct deleting the LRAT/HRASLS-homologous
      region, increased DU145 invasion and anchorage-independent growth.
    supporting_text: >-
      FAM84B but not FAM84B (ΔHRASLS) increased DU145 cell invasion and growth in
      soft agar.
    reference_section_type: ABSTRACT
  - statement: >-
      Tagged full-length and deletion constructs co-precipitated and colocalized,
      suggesting self-association under overexpression conditions.
    supporting_text: >-
      Co-immunoprecipitation and co-localization analyses revealed an interaction
      between FAM84B and FAM84B (ΔHRASLS), suggesting an intramolecular association
      among FAM84B molecules.
    reference_section_type: ABSTRACT
  - statement: >-
      The authors inferred from loss of the catalytic cysteine that LRATD2 is
      unlikely to retain HRASLS phospholipase or O-acyltransferase activity.
    supporting_text: >-
      Since the catalytic residue Cys is not conserved (Figure 2), FAM84B is unlikely
      to have either enzymatic activities, which implies that FAM84B facilitates Ras
      signaling.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text, title, and exact quotes are verified. This links the LRAT-like region
      to prostate-cancer cell phenotypes and suggests self-association, but does not
      demonstrate a normal physiological role or catalytic activity. The no-catalysis
      conclusion is sequence-based and the self-association assays used tagged
      overexpressed constructs.
- id: PMID:35396552
  title: Elevated FAM84B promotes cell proliferation via interacting with NPM1 in esophageal
    squamous cell carcinoma.
  findings:
  - statement: >-
      LRATD2 perturbation altered proliferation and cell-cycle status in ESCC cells,
      with NPM1 implicated as the mediator.
    supporting_text: >-
      Furthermore, we found that the forced expression change of FAM84B can influence
      ESCC cell proliferation and cell-cycle status, which is probably mediated by
      NPM1.
    reference_section_type: ABSTRACT
  - statement: >-
      LRATD2 directly interacted with the NPM1 C terminus and increased nuclear NPM1
      in the ESCC model.
    supporting_text: >-
      A direct interaction between FAM84B and the C-terminal (189-294aa) of NPM1 was
      identified, which increased the NPM1 nuclear expression.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text, title, and exact quotes are verified. This is focused partner-level
      evidence with functional consequences, but it is bounded to amplified/perturbed
      ESCC models and does not establish NPM1 binding as a universal normal-tissue role.
- id: PMID:32291380
  title: FAM84B, amplified in pancreatic ductal adenocarcinoma, promotes tumorigenesis
    through the Wnt/β-catenin pathway.
  findings:
  - statement: >-
      LRATD2 knockdown suppressed proliferation, mitochondrial function, and
      glycolysis in PDAC cell lines, whereas overexpression produced opposite effects.
    supporting_text: >-
      FAM84B knockdown also suppressed mitochondrial function and glycolysis of PDAC
      cells.
    reference_section_type: ABSTRACT
  - statement: >-
      LRATD2 perturbation altered nuclear beta-catenin and downstream readouts, and a
      Wnt/beta-catenin inhibitor blocked the overexpression phenotypes.
    supporting_text: >-
      On the contrary, FAM84B overexpression displayed reversed effects in cell
      proliferation, apoptosis, mitochondrial function, and glycolysis, which was
      blocked by the Wnt/β-catenin pathway inhibitor (XAV939).
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text, title, and exact quotes are verified. The work supports cancer-
      context metabolic and signaling consequences of LRATD2 perturbation, but does
      not show that LRATD2 is itself a glycolytic enzyme, Wnt component, or direct
      beta-catenin partner.
- id: PMID:26759717
  title: Genomic analyses reveal FAM84B and the NOTCH pathway are associated with the
    progression of esophageal squamous cell carcinoma.
  findings:
  - statement: >-
      LRATD2 was recurrently amplified and overexpressed in ESCC and preclinical
      lesions.
    supporting_text: >-
      In particular, the FAM84B gene was amplified and overexpressed in preclinical
      and ESCC tumors.
    reference_section_type: ABSTRACT
  - statement: >-
      LRATD2 knockdown reduced growth, migration, and invasion in ESCC cell lines.
    supporting_text: >-
      Knockdown of FAM84B in ESCC cell lines significantly reduced in vitro cell
      growth, migration and invasion.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text, title, and exact quotes are verified. The knockdown result supports
      tumor-cell phenotypes, but the genomic association is disease-context evidence.
      The paper's statement that FAM84B forms DNA-repair complexes appears to inherit
      the NSE2 naming collision with NSMCE2 and is not accepted as LRATD2 function.
core_functions:
