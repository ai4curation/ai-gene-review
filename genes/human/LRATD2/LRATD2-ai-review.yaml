  resolution: >-
    Determine the LRATD2 structure and map separation-of-function mutations across
    the LRAT-like region in trafficking and partner-binding assays.
  provenance:
  - reference_id: PMID:31205500
    supporting_text: >-
      Since the catalytic residue Cys is not conserved (Figure 2), FAM84B is unlikely
      to have either enzymatic activities, which implies that FAM84B facilitates Ras
