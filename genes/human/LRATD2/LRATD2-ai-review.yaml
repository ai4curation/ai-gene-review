id: Q96KN1
gene_symbol: LRATD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRATD2 (FAM84B/BCMP101) is a cytoplasmic, peripheral membrane-associated
  LRAT-like protein implicated in selective secretory cargo transport. In human
  HEK293T cells, LRATD2 is recruited to vesicle fractions in a GTP-dependent
  manner, occupies cytoplasmic and juxtanuclear Golgi pools, and promotes
  ER-to-Golgi transport of EGFR without detectably affecting the tested ShhN or
  IGF2 cargoes. Cross-link-dependent coimmunoprecipitation with AP1gamma1 and
  SEC23A/B places LRATD2 near vesicle-coat machinery, although its direct
  molecular activity and the composition of its endogenous trafficking
  assemblies remain unresolved. LRATD2 is an NMT1/2 substrate whose Gly2 is
  required for chemical detection of N-myristoylation. Its LRAT-like region
  lacks the conserved catalytic cysteine of related phospholipase/acyltransferase
  enzymes, and no retinoid acyltransferase or phospholipase activity has been
  demonstrated. Alpha-catenin and NPM1 interactions have been reported in
  breast- and esophageal-cancer models, respectively, while amplification or
  perturbation of LRATD2 alters growth, migration, invasion, and signaling in
  several tumor-cell contexts.
