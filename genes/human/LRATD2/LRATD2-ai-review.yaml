    Cargo-selective positive regulator of ER-to-Golgi vesicle-mediated transport.
    GTP-dependent vesicle recruitment, Golgi localization, cross-link-dependent
    association with AP1gamma1 and SEC23A/B, and LRATD2 loss-and-rescue experiments
    support a role in EGFR transport in human HEK293T cells. The data do not yet
    establish a direct cargo-adaptor molecular activity or stable coat-complex
    membership.
