knowledge_gaps:
- gap_statement: >-
    The direct molecular activity by which LRATD2 selects or advances EGFR cargo is
    unknown, including whether it binds EGFR, a cargo receptor, a coat component,
    or a regulatory GTPase directly.
  boundary: >-
    LRATD2 depletion selectively delays EGFR ER-to-Golgi transport and rescue restores
    it, while ShhN and IGF2 transport are unaffected in the same human-cell system.
  gap_kind:
  - MOLECULAR_MECHANISM
  dark_aspect: MOLECULAR_FUNCTION
  status: OPEN
  significance: >-
    Resolving the direct activity is necessary to distinguish a cargo adaptor from a
    coat regulator or another class of trafficking factor.
  resolution: >-
    Purified-component binding and reconstitution assays with LRATD2, EGFR cytosolic
    regions, cargo receptors, AP-1, COPII components, and candidate small GTPases.
  provenance:
  - reference_id: PMID:34433667
    supporting_text: >-
      Knockdown of FAM84B/LRATD2 caused a significant delay of EGFR transport from
      the ER to the Golgi in the RUSH transport system (Fig. 3C and SI Appendix,
      Fig. S3 A and B). The defects were rescued by expressing a siRNA-resistant
      construct of FAM84B-HA (Fig. 3 D and E). In contrast, knockdown of
      FAM84B/LRATD2 did not cause defects in the ER-to-Golgi transport of
      SBP-EGFP-ShhN and SBP-EGFP-IGF2-HA (Fig. 3 F–I).
- gap_statement: >-
    The endogenous composition, stoichiometry, and lifetime of LRATD2-containing
    trafficking assemblies are unknown.
  boundary: >-
    Tagged LRATD2 coimmunoprecipitates with AP1gamma1 and SEC23A/B only under the
    reported cross-linking conditions; this supports proximity but not a stable,
    stoichiometric complex.
  gap_kind:
  - COMPLEX_MEMBERSHIP
  dark_aspect: MOLECULAR_FUNCTION
  status: OPEN
  significance: >-
    Endogenous interaction architecture would locate LRATD2 within AP-1-, COPII-, or
    other transport machinery without overinterpreting tagged cross-linking assays.
  resolution: >-
    Endogenous tagging followed by quantitative affinity purification, proximity
    labeling, cross-linking mass spectrometry, and perturbation of individual partners.
  provenance:
  - reference_id: PMID:34433667
    supporting_text: >-
      FAM84B-HA coimmunoprecipitated with AP1γ1 and Sec23A/B, but not Sar1A in
      the presence of a cross-linker (Fig. 3B).
- gap_statement: >-
    The endogenous occupancy and trafficking consequence of LRATD2 N-myristoylation
    are unknown.
  boundary: >-
    Chemical labeling, NMT inhibition, and Gly2 mutation establish overexpressed
    LRATD2 as an NMT1/2 substrate in human cells, but do not define how the
    modification affects membrane recruitment or EGFR transport.
  gap_kind:
  - REGULATION
  dark_aspect: MOLECULAR_FUNCTION
  status: OPEN
  significance: >-
    N-myristoylation could provide the missing physical basis for regulated vesicle
    association.
  resolution: >-
    Quantify endogenous LRATD2 myristoylation and compare wild-type and Gly2-mutant
    proteins for membrane partitioning, coat proximity, and EGFR transport rescue.
  provenance:
  - reference_id: PMID:34956690
    supporting_text: >-
      Alk12 labeling signals decreased with the treatment of NMT inhibitor in LRATD1,
      LRATD2, and ERICH5 and were completely removed in G2A mutants, confirming
      LRATD1, LRATD2, and ERICH5 as substrates of NMT1/2 (Figure 4C).
- gap_statement: >-
    The normal tissue-level physiological role of LRATD2 and the relationship between
    its trafficking function and tumor-associated phenotypes remain unresolved.
  boundary: >-
    LRATD2 amplification or perturbation changes proliferation, migration, invasion,
    and signaling in several human cancer-cell models, whereas direct trafficking
    evidence is currently centered on a reconstituted HEK293T cargo assay.
  gap_kind:
  - PHYSIOLOGICAL_ROLE
  dark_aspect: BIOLOGICAL_PROCESS
  status: OPEN
  significance: >-
    This distinction is needed to separate an endogenous trafficking function from
    context-dependent consequences of cancer amplification and overexpression.
  resolution: >-
    Analyze endogenous LRATD2 loss in nontransformed, tissue-relevant human models and
    connect cargo-trafficking defects to cellular and organismal phenotypes.
  provenance:
  - reference_id: PMID:26759717
    supporting_text: >-
      Knockdown of FAM84B in ESCC cell lines significantly reduced in vitro cell
      growth, migration and invasion.
- gap_statement: >-
    The structural function of the catalytically divergent LRAT-like region is unknown.
  boundary: >-
    The region is required for LRATD2-driven invasion and anchorage-independent growth
    in DU145 cells, but its conserved catalytic cysteine is absent and enzymatic
    activity has not been demonstrated.
  gap_kind:
  - MOLECULAR_MECHANISM
  dark_aspect: MOLECULAR_FUNCTION
  status: OPEN
  significance: >-
    A structural explanation could reveal whether the domain mediates membrane,
