proposed_new_terms: []
suggested_questions:
- question: >-
    Does LRATD2 directly recognize EGFR or a cargo receptor, and what feature explains
    its selectivity over the tested ShhN and IGF2 cargoes?
- question: >-
    Which coat machinery and small GTPase recruit LRATD2 to vesicles, and are the
    AP1gamma1 and SEC23A/B contacts direct and endogenous?
- question: >-
    Is endogenous LRATD2 constitutively N-myristoylated, and is this modification
    required for Golgi/vesicle association and EGFR transport?
- question: >-
    Do alpha-catenin and NPM1 represent tissue-specific LRATD2 mechanisms, or
    cancer-state interactions secondary to amplification or overexpression?
suggested_experiments:
- hypothesis: >-
    LRATD2 directly couples EGFR-containing carriers to a defined coat component.
  description: >-
    Reconstitute binding and vesicle recruitment with purified LRATD2, EGFR cargo
    regions or candidate cargo receptors, AP-1, SEC23/24, and candidate small GTPases;
    quantify nucleotide dependence and direct stoichiometry.
  experiment_type: Biochemical reconstitution and quantitative binding
- hypothesis: >-
    Gly2 N-myristoylation is required for LRATD2 membrane recruitment and selective
    EGFR ER-to-Golgi transport.
  description: >-
    Create an endogenous LRATD2 knockout or degron line and compare rescue by
    expression-matched wild-type and G2A LRATD2 using RUSH cargo kinetics,
    membrane/cytosol fractionation, and live-cell Golgi localization.
  experiment_type: Genetic rescue and live-cell trafficking
- hypothesis: >-
    LRATD2 forms transient, cargo-dependent contacts with coat machinery rather than
    a constitutive stable complex.
  description: >-
    Endogenously tag LRATD2 and perform time-resolved proximity labeling and
    cross-linking mass spectrometry during synchronized EGFR export, with ShhN and
    IGF2 as cargo controls and partner knockdowns to test causality.
  experiment_type: Endogenous interactomics
- hypothesis: >-
    LRATD2 has a conserved physiological trafficking role outside amplified cancer
    cells.
  description: >-
    Perturb LRATD2 in nontransformed human epithelial organoids from tissues with
    endogenous expression, profile secretory cargo flux, and test whether any
    trafficking defect precedes changes in proliferation, migration, or signaling.
  experiment_type: Human organoid functional genomics
