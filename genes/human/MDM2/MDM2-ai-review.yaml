id: Q00987
gene_symbol: MDM2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'MDM2 is a nucleocytoplasmic RING E3 ubiquitin ligase that binds p53-family transcription factors and ubiquitinates p53 and other substrates, thereby driving proteasomal substrate degradation and suppressing p53-mediated cell-cycle arrest and apoptosis. MDM2 also undergoes autoubiquitination and is restrained by nucleolar ribosomal-protein and 5S RNP stress signals that block its p53-directed ligase activity.'
