core_functions:
- description: RING E3 ubiquitin ligase that binds p53 and ubiquitinates p53-family and accessory substrates to promote proteasomal degradation and restrain p53-mediated cell-cycle arrest and intrinsic apoptotic signaling.
  molecular_function:
    id: GO:0061630
    label: ubiquitin protein ligase activity
  directly_involved_in:
  - id: GO:0006511
    label: ubiquitin-dependent protein catabolic process
  - id: GO:0043518
    label: negative regulation of DNA damage response, signal transduction by p53 class mediator
  - id: GO:1902254
    label: negative regulation of intrinsic apoptotic signaling pathway by p53 class mediator
  locations:
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: file:genes/human/MDM2/MDM2-uniprot.txt
    record_section: *id002
    supporting_text: E3 ubiquitin-protein ligase that mediates ubiquitination of p53/TP53, leading to its degradation by the proteasome
  - reference_id: file:genes/human/MDM2/MDM2-uniprot.txt
    record_section: *id001
    supporting_text: Inhibits p53/TP53- and p73/TP73-mediated cell cycle arrest and apoptosis by binding its transcriptional activation domain.
  - reference_id: PMID:9450543
    supporting_text: p53 was polyubiquitinated in the presence of E1, UbcH5 as E2 and MDM2 oncoprotein
  - reference_id: PMID:10722742
    supporting_text: Mdm2 is a ubiquitin protein ligase (E3) for p53 and that its activity is dependent on its RING finger
suggested_questions:
- question: Which non-p53 MDM2 substrates are directly ubiquitinated by endogenous MDM2 in normal human cells rather than in cancer overexpression systems?
suggested_experiments:
- description: Use endogenous MDM2 substrate trapping with a RING-inactive knock-in allele and quantitative ubiquitinomics after acute p53-pathway activation to distinguish direct MDM2 substrates from indirect p53-dependent abundance changes.
