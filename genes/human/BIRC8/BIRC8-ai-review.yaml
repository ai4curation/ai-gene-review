gene_symbol: BIRC8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'BIRC8, or ILP-2, is a primate inhibitor-of-apoptosis family paralog produced by retroposition
  from XIAP/BIRC4 and encoding a single BIR domain plus a C-terminal RING finger. It is a testis-specific
  protein in normal tissues that binds processed caspase-9 and suppresses Bax- or Apaf-1/caspase-9-induced
  apoptosis, but unlike XIAP it lacks the two N-terminal BIR domains and does not measurably protect transfected
  cells from Fas- or TNF-triggered death-receptor apoptosis.'
