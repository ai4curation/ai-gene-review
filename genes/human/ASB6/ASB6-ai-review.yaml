- id: PMID:34164402
  title: CUL5-ASB6 Complex Promotes p62/SQSTM1 Ubiquitination and Degradation to Regulate Cell Proliferation
    and Autophagy.
  findings:
  - statement: CUL5-ASB6 ubiquitinates p62 for degradation.
    supporting_text: Here, we show that the CUL5-ASB6 complex is a ubiquitin E3 ligase complex mediating
      p62 ubiquitination and degradation.
  - statement: ASB6 depletion raises p62.
    supporting_text: Depletion of CUL5 or ASB6 induced p62 accumulation, and overexpression of ASB6 promoted
      ubiquitination and degradation of p62.
  - statement: MG132 blocks ASB6-driven p62 degradation.
    supporting_text: On the other hand, co-expression of FLAG-ASB6 caused degradation of ectopically expressed
      HA-p62 in 293T cells, which could be blocked by proteasome inhibitor MG132 in a dose-dependent manner
      (Figure 3C).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; human and mouse cells.
- id: PMID:37087475
  title: A novel protein encoded by circINSIG1 reprograms cholesterol metabolism by promoting the ubiquitin-dependent
    degradation of INSIG1 in colorectal cancer.
  findings:
  - statement: CUL5-ASB6 builds K48 chains on INSIG1 when recruited by circINSIG1-121.
    supporting_text: Mechanistically, circINSIG1 encoded a 121 amino acid protein circINSIG1-121 to promote
      K48-linked ubiquitination of the critical cholesterol metabolism regulator INSIG1 at lysine 156
      and 158 by recruiting CUL5-ASB6 complex, a ubiquitin E3 ligase complex, thereby inducing cholesterol
      biosynthesis to promote CRC proliferation and metastasis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text; colorectal cancer cells.
- id: PMID:15231829
  title: Asb6, an adipocyte-specific ankyrin and SOCS box protein, interacts with APS to enable recruitment
    of elongins B and C to the insulin receptor signaling complex.
  findings:
  - statement: Asb6 binds APS in adipocytes.
    supporting_text: Yeast two-hybrid screening of a 3T3-L1 adipocyte library using APS as a bait identified
      a 418-amino acid ankyrin and SOCS (suppressor of cytokine signaling) box protein Asb6 as an interactor.
  - statement: Asb6 promotes APS degradation.
    supporting_text: Prolonged insulin stimulation resulted in the degradation of APS when Asb6 was co-expressed
      but not in the absence of Asb6.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; mouse 3T3-L1 adipocytes.
  full_text_unavailable: true
