id: Q9NWX5
gene_symbol: ASB6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ASB6 is an ankyrin repeat and SOCS box protein of the ASB family that serves as the substrate-recognition
  subunit of a Cullin 5-RBX2 (CRL5) E3 ubiquitin ligase. The CUL5-ASB6 ligase ubiquitinates the autophagy
  adaptor p62/SQSTM1 for proteasomal degradation, restraining cell proliferation and autophagy. Recruited
  by a peptide encoded by circINSIG1, it builds K48-linked chains on INSIG1, promoting cholesterol biosynthesis
  in colorectal cancer cells. In adipocytes, mouse Asb6 binds the insulin-signalling adaptor APS, is recruited
  with Elongins B/C to the activated insulin receptor, and promotes APS degradation under prolonged insulin
  stimulation.
