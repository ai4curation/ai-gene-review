    id: GO:0005905
    label: clathrin-coated pit
  evidence_type: IDA
  original_reference_id: PMID:18775314
  qualifier: located_in
  review:
    summary: >-
      Proposed. GOA records cytoplasmic vesicle and cytosol for this protein but not the
