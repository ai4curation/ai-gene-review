description: >-
  AGFG1 is a two-part protein: an N-terminal ArfGAP domain (residues 11-135) built around
  a C4-type zinc finger, followed by roughly 430 residues of intrinsically disordered,
  low-complexity sequence carrying ten phenylalanine-glycine (FG) repeats of the kind
  found in nucleoporins, three FxxFxxF motifs that bind AP-2 appendage domains, and
  Asn-Pro-Phe (NPF) motifs that bind EH domains. The disordered tail is where its
  best-characterised activity lies: a 40-residue stretch immediately after the ArfGAP
  domain wraps around the folded longin domain of the R-SNARE VAMP7 and selects it as
  cargo for clathrin-mediated endocytosis, so AGFG1 is a cargo-selective clathrin adaptor
  (a CLASP) that retrieves post-fusion VAMP7 from the plasma membrane. Because VAMP7's own
  SNARE helix competes for the same groove, AGFG1 engages VAMP7 only once it is part of
  a cis-SNARE complex, which couples retrieval to prior fusion. The same NPF and FxxFxxF
  motifs place AGFG1 in the endocytic coat alongside EPS15, EPS15R, intersectin, FCHO1 and
  AP-2. In spermiogenesis the protein coats Golgi-derived proacrosomal vesicles and is
  required for their docking and fusion into a single acrosomic vesicle; loss of the mouse
  orthologue blocks acrosome formation, yields round-headed spermatozoa and male
  infertility, and leaves the acroplaxome deficient in keratin 5. AGFG1 is also the
  cellular cofactor, historically named hRIP/RIP/Rab, that HIV-1 Rev requires to move
  RRE-containing viral RNAs from the nuclear periphery into the cytoplasm; that role is
  specific to Rev-directed RNA, since bulk host mRNA distribution is unaffected when AGFG1
  is ablated, and the Rev contact is indirect, bridged by CRM1 through the FG repeats. The
  protein is ubiquitously expressed and distributes between the nucleus and cytoplasmic
  vesicles including clathrin-coated pits and vesicles. Its ArfGAP domain is structurally
  genuine - the four zinc-coordinating cysteines hold a zinc ion in both solved structures
  and the arginine finger is present at Arg57 - but two of the three residues required for
  GTP hydrolysis are substituted, as they are throughout the AGFG proteins examined, so the
  domain is predicted to bind Arf GTPases without efficiently accelerating their hydrolysis.
  A family-level review states that some member of every ArfGAP subfamily except ADAP has
  shown in-vitro GAP activity, but names no AGFG protein or assay; the AGFG-specific section
  reports none. Together with direct human ARF proximity, the sequence evidence is therefore
  most consistent with AGFG1 acting as an Arf-binding effector with substantially reduced GAP
  activity, pending a direct catalytic assay.
