- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: TAS
  original_reference_id: PMID:7634337
  qualifier: enables
  review:
    summary: >-
      Removed. The direction of the interaction is inverted: in the cited paper Rev binds
      the RNA and AGFG1 binds Rev's protein activation domain. AGFG1 has no RNA-binding
      module, UniProt declines the claim, and the mouse orthologue carries no such
      annotation.
    action: REMOVE
    reason: >-
      Five independent grounds, all checkable. First, the cited reference does not support
      the term: its own abstract states that Rab (AGFG1) binds the Rev activation domain
      when Rev is assembled onto its RNA target, so the RNA is bound by Rev, and the paper
      reports only protein-protein interactions with Rev and Rex activation domains.
      Second, the AGFG1-Rev contact is not even direct - the family reference states it is
      indirect and probably bridged by CRM1 - so AGFG1 is two steps from the RNA. Third,
      AGFG1 has no RNA-binding domain: its only modules are the ArfGAP domain, whose C4
      zinc finger is buried, fully occupied by structural zinc and described by the family
      reference as architectural rather than catalytic, and the nucleoporin-like FG
      repeats, which are protein-interaction motifs that bind CRM1 and EH domains. Fourth,
      UniProt records only a hedge, "May play a role in RNA trafficking or localization",
      and assigns no RNA-binding keyword. Fifth, the provenance is a legacy bulk import:
      this reference annotates exactly one entity in all of GOA, with three rows, and the
      mouse orthologue Agfg1 carries zero GO:0003723 rows. A recorded Europe PMC query for
      direct RNA-binding evidence returned no such study - that is a statement about the
      query, not a proof of absence, and it is the weakest of the five grounds. This is the
      same shape as annotating a protein that carries a sugar as a lectin: a
      partner-of-an-RNA-binding-protein study read as a binding activity.
    supported_by:
    - reference_id: PMID:7634337
      supporting_text: Rab binds the Rev activation domain when Rev is assembled onto its
        RNA target and can significantly enhance Rev activity when overexpressed.
    - reference_id: PMID:7634337
      supporting_text: We report the identification of a novel human gene product that binds
        to not only the HIV-1 Rev activation domain in vitro and in vivo but also to functionally
        equivalent domains in other Rev and Rex proteins.
    - reference_id: PMID:18809720
      supporting_text: The Rev–AGFG1 interaction is indirect and possibly bridged by the
        nuclear export receptor CRM1.
    - reference_id: PMID:18809720
      supporting_text: The zinc finger has an architectural rather than catalytic role
    - reference_id: file:human/AGFG1/AGFG1-bioinformatics/RESULTS.md
      supporting_text: '**Mouse Agfg1 carries zero `GO:0003723` rows, no `GO:0005643`, and no `GO:0006406`.**'
    - reference_id: file:human/AGFG1/AGFG1-bioinformatics/RESULTS.md
      supporting_text: '| `PMID:7634337` | 3 | **1** (AGFG1) | `GO:0003723`, `GO:0005634`, `GO:0006406` | legacy single-gene ProtInc import |'
- term:
    id: GO:0005643
    label: nuclear pore
  evidence_type: TAS
  original_reference_id: PMID:7637788
  qualifier: part_of
  review:
    summary: >-
      Removed. The term's definition asserts membership of the nuclear pore complex, while
      the cited paper claims only sequence homology with nucleoporins - and a primary paper
      states outright that AGFG1's status as an authentic NPC constituent is not
      established.
    action: REMOVE
    reason: >-
      GO:0005643 is defined as a protein complex providing a discrete opening in the
      nuclear envelope, so part_of asserts that AGFG1 is a component of the NPC. The
      support offered is the title claim of PMID:7637788, and its abstract makes the nature
      of that claim explicit: the protein "has homology with nucleoporins". The only
      nucleoporin-like feature is the FG repeats, which are protein-interaction motifs that
      also occur outside nucleoporins, and AGFG1 carries no nucleoporin signature - PANTHER
      places it in PTHR46134 and InterPro in the ArfGAP domain family. A primary paper
      states the negative directly. UniProt, curating this same paper together with
      PubMed:10613896, records Nucleus and Cytoplasmic vesicle and neither nuclear envelope
      nor nuclear pore. Provenance is the same legacy import as the RNA-binding row: this
      reference annotates exactly one entity in all of GOA, with this one row, and the
      mouse orthologue has no such annotation. Nothing is proposed in its place, because
      nuclear localisation is already recorded by four other rows and no finer compartment
      has been demonstrated.
    supported_by:
    - reference_id: PMID:7637788
      supporting_text: This hRIP protein has homology with nucleoporins, a class of proteins
        that mediate nucleocytoplasmic transport.
    - reference_id: PMID:10613896
      supporting_text: Second, it is not yet certain whether Hrb is an authentic constituent
        of the nuclear pore complex (Bogerd et al. 1995; Fritz et al. 1995).
    - reference_id: file:human/AGFG1/AGFG1-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Nucleus'
    - reference_id: file:human/AGFG1/AGFG1-bioinformatics/RESULTS.md
      supporting_text: '| `PMID:7637788` | 1 | **1** (AGFG1) | `GO:0005643` | legacy single-gene ProtInc import |'
- term:
    id: GO:0006406
    label: mRNA export from nucleus
  evidence_type: TAS
  original_reference_id: PMID:7634337
  qualifier: involved_in
  review:
    summary: >-
      Modified. The evidence is entirely Rev-dependent export of RRE-containing viral RNA,
      and the same laboratory later showed that bulk host mRNA distribution is unaffected -
      so a host-process term reads much more broadly than the data. Moved to the
      viral-process branch, with the term that is actually needed filed as a request.
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:0075733
      label: intracellular transport of virus
    reason: >-
      GO:0006406's definition does not exclude viral mRNA, so the row is imprecise rather
      than false; what makes it the wrong branch is that AGFG1's requirement is specific to
      Rev-directed RNA. Ablating AGFG1 leaves the distribution of cellular poly(A)+ mRNA,
      nuclear proteins and even NES-containing proteins unaffected while Rev-directed RNAs
      accumulate at the nuclear periphery. The obvious viral term cannot be used: GO:0046784
      viral mRNA export from host cell nucleus specifies intronless viral mRNA in its
      definition and in all four of its synonyms, whereas Rev exports unspliced and partly
      spliced, intron-retaining RNA - the term's differentia excludes this pathway. So the
      replacement is GO:0075733, whose definition, "the directed movement of a virus, or
      part of a virus, within the host cell", is satisfied by what RNA in situ hybridisation
      actually measured. This is a sideways move between the host-process and viral-process
      branches rather than a generalisation, and it was verified as such: GO:0075733 is NOT
      a descendant of GO:0006406 over is_a/part_of. The missing term is filed under
      proposed_new_terms.
    supported_by:
    - reference_id: PMID:14701878
      supporting_text: 'We further show that the RNA mislocalization pattern resulting from
        loss of hRIP activity is highly specific to Rev function: the intracellular distribution
        of cellular poly(A)(+) mRNA, nuclear proteins, and, most important, NES-containing
        proteins, are unaffected.'
    - reference_id: PMID:14701878
      supporting_text: 'Thus, hRIP is an essential cellular Rev cofactor, which acts at a
        previously unanticipated step in HIV-1 RNA export: movement of RNAs from the nuclear
        periphery to the cytoplasm.'
    - reference_id: PMID:15749819
      supporting_text: We find that ablation of hRIP activity by a dominant-negative mutant
        or RNA interference inhibits virus production by mislocalizing Rev-directed RNAs
        to the nuclear periphery.
- term:
    id: GO:0035615
    label: clathrin-cargo adaptor activity
  evidence_type: IMP
  original_reference_id: PMID:18775314
  qualifier: enables
  review:
    summary: >-
      Proposed. This is AGFG1's characterised molecular function and GOA records nothing
      like it: the protein selects the R-SNARE VAMP7 for incorporation into endocytic
      clathrin-coated vesicles, and depleting it leaves VAMP7 on the cell surface exactly as
      depleting clathrin does.
    action: NEW
    reason: >-
      The term's definition is "bringing together a cargo protein with clathrin,
      responsible for the formation of endocytic vesicles", and it was verified to sit under
      GO:0140312 cargo adaptor activity and hence under GO:0060090. The functional support
      is a depletion phenotype, which is why the evidence code is IMP rather than IDA:
      roughly 90% knockdown of AGFG1 doubles surface VAMP7, and clathrin knockdown does the
      same, while a VAMP7 longin-domain mutant that folds correctly but cannot bind AGFG1
      also accumulates at the surface - and does so even when fused to an unrelated
      reporter, which shows the longin domain alone is the sorting determinant. The authors
      state the conclusion in exactly these terms. A second, independent laboratory
      classifies AGFG1 as a CLASP and shows concentration-dependent binding to the FCHO1
      mu-homology domain with controls excluding an indirect route. One restraint: the
      AGFG1-clathrin and AGFG1-AP-2 contacts themselves are motif-based inference in the
      2008 paper - its own supporting figure is a sequence figure and the citation is to a
      review - so GO:0030276 clathrin binding is deliberately NOT proposed. The functional
      term rests on cargo binding, coated-pit colocalisation and the depletion phenotype,
      not on a measured clathrin contact. The entailment between the two runs one way and
      is worth stating rather than eliding: because GO:0035615 sits under GO:0140312,
      asserting it does commit to bridging cargo to the coat. Retreating to that parent
      would not avoid the commitment - GO:0140312's own definition reads "Binding directly
      to the structural scaffolding elements of a vesicle coat (such as clathrin or COPII),
      and bridging the membrane, cargo receptor, and membrane deformation machinery", so it
      names the coat too and adds a cargo-receptor clause that is wrong here, since VAMP7
      is the cargo and not a receptor. What discharges the commitment is measurement rather
      than the motif argument: concentration-dependent binding to the FCHO1 mu-homology
      domain with controls excluding an indirect route, direct colocalisation with clathrin
      and AP-2 in coated pits and vesicles, and a depletion phenotype that phenocopies
      clathrin depletion for this cargo. GO:0030276 remains withheld because it would
      assert something narrower and stronger - a directly assayed AGFG1-clathrin contact -
      which no experiment provides.
    supported_by:
    - reference_id: PMID:18775314
      supporting_text: Taken together, these experiments demonstrate that Hrb functions as
        a cargo/clathrin adaptor in clathrin-mediated endocytosis of VAMP7 through the interaction
        of the VAMP7 longin domain with Hrb.
    - reference_id: PMID:18775314
      supporting_text: Quantification using an 125I-labeled monoclonal anti-HA antibody indicated
        that there was a doubling of VAMP7-HA on the cell surface following
    - reference_id: PMID:22484487
      supporting_text: In addition, Dab2, Hrb and CALM, three tandem Asn-Pro-Phe-containing
        CLASPs bind the μHDs in a concentration-dependent manner (Fig. 2c).
- term:
    id: GO:0072583
    label: clathrin-dependent endocytosis
  evidence_type: IMP
  original_reference_id: PMID:18819912
  qualifier: involved_in
  review:
    summary: >-
      Proposed. Two independent knockdown studies place AGFG1 in clathrin-mediated
      endocytosis. They disagree about how general the requirement is, and this row records
      only what both support.
    action: NEW
    reason: >-
      In HRB knockdown cells the endocytosis of both fluorescent transferrin and
      pHLuorin-tagged TI-VAMP is strongly reduced by FACS uptake assay, and AGFG1
      colocalises with clathrin-, AP-2-, EPS15- and transferrin-receptor-positive vesicles.
      Independently, AGFG1 depletion causes surface accumulation of VAMP7 in the same way
      clathrin depletion does. The two studies are not fully consistent - the second reports
      no effect of AGFG1 depletion on EGF internalisation or degradation and reads AGFG1 as
      a cargo-selective rather than general adaptor - so this row asserts involvement in
      clathrin-dependent endocytosis, which both support, and does not assert that AGFG1 is
      required for bulk clathrin-dependent uptake. The discrepancy is recorded as a
      knowledge gap rather than adjudicated. Evidence code IMP: both studies are siRNA
      knockdowns.
    supported_by:
    - reference_id: PMID:18819912
      supporting_text: uptake experiments followed by fluorescence-activated cell sorting
        showed that the endocytosis of fluorescent transferrin and pHLuorin-TI-VAMP is strongly
        reduced in HRB knockdown cells
    - reference_id: PMID:18775314
      supporting_text: Consistent with Hrb functioning as a SNARE-specific adaptor, depleting
        HeLaM cells of Hrb by siRNA had no effect on the internalization and intracellular
        accumulation of EGF nor on its degradation when compared to mock transfected cells
        (Figure S5).
