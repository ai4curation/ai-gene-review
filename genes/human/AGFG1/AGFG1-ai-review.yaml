    action: NEW
    reason: >-
      Computed from the deposited coordinates of both AGFG1 ArfGAP-domain entries: 2OLM
      (X-ray, 1.48 Angstrom) and 2D9L (NMR, 20 models) each contain one zinc ion, and in
      both it is coordinated by the thiolates of Cys29, Cys32, Cys49 and Cys52 at 2.26-2.40
      Angstrom. Author numbering is not UniProt numbering - 2D9L is offset by +6 - so the
      offset was taken from SIFTS and each converted position checked against the UniProt
      sequence. The four cysteines are exactly the ones predicted independently by the
      published CX2CX16CX2CX4R spacing, so the structural result and the sequence scan
      corroborate each other. UniProt already carries the term as
      "GO:0008270; F:zinc ion binding; IEA:UniProtKB-KW", but that route was withdrawn from
      GOA, so the term is absent from all 35 GOA rows. This is the mirror of the DNA-binding
      keyword on the same entry, which is not supported and is filed as a UniProt
      correction request instead. On the choice of reference: neither structure has a
      primary publication. PDBe reports 2OLM as "ArfGap domain of HIV-1 Rev binding
      protein" and 2D9L as "Solution structure of the ArfGap domain of human RIP", both
      "To be published" with a null PubMed id and a null DOI, and UniProt records 2D9L
      only as submitted to the PDB. So no PMID exists to carry original_reference_id. The
      evidence code stays IDA because the assay is the two deposited structures
      themselves; the file: reference points at the committed computation over their
      coordinates, which is the only citable record of the coordination shell.
    supported_by:
    - reference_id: file:human/AGFG1/AGFG1-bioinformatics/RESULTS.md
      supporting_text: '| 2OLM | X-ray 1.48 Å | 1 | +0 | Cys29, Cys32, Cys49, Cys52 | 2.30–2.40 Å |'
    - reference_id: file:human/AGFG1/AGFG1-uniprot.txt
      supporting_text: 'DR   GO; GO:0008270; F:zinc ion binding; IEA:UniProtKB-KW.'
    - reference_id: PMID:18809720
      supporting_text: The side chains of only the conserved arginine (Arg50, on the right)
        and the four zinc finger cysteines (center; Cys22, 25, 42, and 45) are displayed
        along with the coordinated Zn2+ (gray sphere).
- term:
    id: GO:0120211
    label: proacrosomal vesicle fusion
  evidence_type: ISS
  original_reference_id: PMID:11711676
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8K2K6
  review:
    summary: >-
      Proposed as the specific process the mouse experiments actually measured. The accepted
      GO:0001675 acrosome assembly IBA is correct but general; what the null blocks is
      precisely the fusion step, and GO has a term for it.
    action: NEW
    reason: >-
      GO:0120211's definition is "Fusion of the membrane of proacrosomal vesicle with the
      membrane of another proacrosomal vesicle to form the acrosome", which is the mouse
      phenotype verbatim: the vesicles form, coat with AGFG1, and cannot fuse. It was
      verified to be a descendant of GO:0001675 over is_a/part_of, so this row is additive
      and asserts strictly more than - not something different from - the IBA it sits under.
      Evidence code ISS with the mouse orthologue in supporting_entities, because the
      measurement is on mouse Agfg1 (Q8K2K6) and human AGFG1's support is orthology; ISS
      takes the sequence-similar entity, not the interactor. This row also records the
      decision on the acrosome-associated cellular component, which was raised in review:
      GO:0001669 acrosomal vesicle is NOT proposed, on two grounds. Its definition denotes
      the mature organelle - "A structure in the head of a spermatozoon that contains acid
      hydrolases ... derived from the lysosome" - whereas AGFG1 is documented on the
      cytosolic surface of the precursor vesicles, and in the null the mature acrosome never
      forms at all; and the evidence is mouse-only, so a human CC row would rest on
      orthology for a compartment whose human counterpart has not been imaged. Searching
      for that CC is what surfaced GO:0120211, which is the better annotation.
    supported_by:
    - reference_id: PMID:11711676
      supporting_text: Although proacrosomic vesicles form in spermatids that lack Hrb, the
        vesicles are unable to fuse, blocking acrosome development at step 2.
    - reference_id: PMID:11711676
      supporting_text: We conclude that Hrb is required for docking and/or fusion of proacrosomic
        vesicles during acrosome biogenesis.
core_functions:
- description: >-
    Cargo-selective clathrin adaptor (CLASP) for the R-SNARE VAMP7. A short stretch of
    AGFG1's intrinsically disordered tail immediately C-terminal to the ArfGAP domain
    (residues 136-176) wraps around the folded VAMP7 longin domain, and AGFG1's FxxFxxF and
    NPF motifs hold it in the forming clathrin coat, so VAMP7 is retrieved from the plasma
    membrane into clathrin-coated vesicles. Because VAMP7's own SNARE helix competes for the
    same groove, selection is restricted to VAMP7 that is already in a cis-SNARE complex,
    coupling retrieval to prior fusion.
  molecular_function:
    id: GO:0035615
    label: clathrin-cargo adaptor activity
  directly_involved_in:
  - id: GO:0072583
    label: clathrin-dependent endocytosis
  locations:
  - id: GO:0005905
    label: clathrin-coated pit
  - id: GO:0030136
    label: clathrin-coated vesicle
  - id: GO:0031410
    label: cytoplasmic vesicle
  supported_by:
  - reference_id: PMID:18775314
    supporting_text: Taken together, these experiments demonstrate that Hrb functions as
      a cargo/clathrin adaptor in clathrin-mediated endocytosis of VAMP7 through the interaction
      of the VAMP7 longin domain with Hrb.
  - reference_id: PMID:18775314
    supporting_text: A series of truncated, C-terminally His6-tagged Hrb constructs (Figure
      1E) indicated that the sequence of Hrb that bound VAMP7 longin domain was between
      residues 136 and 176.
- description: >-
    Vesicle docking and fusion factor in acrosome biogenesis. AGFG1 coats the cytosolic face
    of Golgi-derived proacrosomal vesicles in round spermatids and is required for them to
    fuse into a single acrosomic vesicle; without it the vesicles form, tether to the
    acroplaxome and flatten into a pseudoacrosome instead, the acroplaxome is left deficient
    in keratin 5, and the resulting spermatozoa are round-headed and non-functional. This
    may be the same activity as the somatic one operating in a different compartment -
    selection and retention of SNARE-bearing vesicles - but that has not been tested, so no
    molecular function is asserted for this core function. The SNARE-binding activity is
    recorded on the VAMP7 row, where it was measured.
  directly_involved_in:
  - id: GO:0001675
    label: acrosome assembly
  - id: GO:0120211
    label: proacrosomal vesicle fusion
  locations:
  - id: GO:0031410
    label: cytoplasmic vesicle
  supported_by:
  - reference_id: PMID:11711676
    supporting_text: In wild-type spermatids, Hrb is associated with the cytosolic surface
      of proacrosomic transport vesicles that fuse to create a single large acrosomic vesicle
      at step 3 of spermiogenesis.
  - reference_id: PMID:11711676
    supporting_text: Although proacrosomic vesicles form in spermatids that lack Hrb, the
      vesicles are unable to fuse, blocking acrosome development at step 2.
  knowledge_gaps:
  - gap_statement: >-
      Whether the acrosomal role uses the same VAMP7-longin-domain interaction as the
      somatic one is undetermined: no study has examined VAMP7 localisation or the
      VAMP7-AGFG1 contact in Agfg1-null spermatids.
    boundary: >-
      Established: AGFG1 is required for proacrosomal vesicle docking/fusion in mouse
      spermatids, and AGFG1 binds the VAMP7 longin domain with a mapped interface and a
      measured affinity in somatic cells. What is missing is the link between the two.
    gap_kind:
    - BIOLOGY
    resolution: >-
      Test VAMP7 localisation in Agfg1-null spermatids, and ask whether the AGFG1
      substitutions that abolish VAMP7 binding in vitro fail to rescue acrosome formation.
    provenance:
    - reference_id: PMID:11711676
      supporting_text: We conclude that Hrb is required for docking and/or fusion of proacrosomic
        vesicles during acrosome biogenesis.
- description: >-
    Cellular cofactor for HIV-1 Rev. AGFG1 (as hRIP/RIP/Rab) is required for RRE-containing
    viral RNAs to move from the nuclear periphery into the cytoplasm; ablating it traps them
    at the periphery and blocks virus production, and the block is specific to Rev-directed
    RNA rather than to nuclear export generally. The contact with Rev is indirect, bridged by
    CRM1 through AGFG1's FG repeats, so no direct molecular function is asserted for this
    role. This is host machinery appropriated by a virus rather than an evolved function of
    AGFG1, and it is kept here as a deliberate judgement rather than by default: GO annotates
    host gene products to viral-process terms as a matter of course, and this is the only
    characterised activity of AGFG1's nuclear pool, so dropping the block would leave the
    four accepted nucleus rows with no functional account at all. That absence is itself the
    finding, and it is recorded as a knowledge gap below.
  directly_involved_in:
  - id: GO:0075733
    label: intracellular transport of virus
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:14701878
    supporting_text: 'Thus, hRIP is an essential cellular Rev cofactor, which acts at a previously
      unanticipated step in HIV-1 RNA export: movement of RNAs from the nuclear periphery
      to the cytoplasm.'
  - reference_id: PMID:15749819
    supporting_text: We find that ablation of hRIP activity by a dominant-negative mutant
      or RNA interference inhibits virus production by mislocalizing Rev-directed RNAs to
      the nuclear periphery.
  knowledge_gaps:
  - gap_statement: >-
      The host function of AGFG1's nuclear pool is undetermined. Every characterised
      activity of the nuclear fraction is the appropriated HIV-1 Rev role; no endogenous
      nuclear substrate, cargo or process has been identified.
    boundary: >-
      Established: AGFG1 is in the nucleus by two independent immunofluorescence studies,
      its FG repeats bind CRM1, and it is required for Rev-directed viral RNA to leave the
      nuclear periphery. Excluded: a general host mRNA-export role, since bulk poly(A)+
      mRNA, nuclear proteins and NES-containing proteins are all unaffected when AGFG1 is
      ablated. What is missing is any endogenous counterpart of the viral cargo.
    gap_kind:
    - BIOLOGY
    resolution: >-
      Identify the endogenous RNAs or proteins whose nuclear-periphery-to-cytoplasm
      movement requires AGFG1, if any - for example by CRM1-dependent export profiling in
      AGFG1-depleted cells.
    provenance:
    - reference_id: PMID:14701878
      supporting_text: 'We further show that the RNA mislocalization pattern resulting from
        loss of hRIP activity is highly specific to Rev function: the intracellular distribution
        of cellular poly(A)(+) mRNA, nuclear proteins, and, most important, NES-containing
        proteins, are unaffected.'
  - gap_statement: >-
      GO has no term for Rev-dependent export of intron-retaining viral RNA, so this role
      can only be recorded with a general viral-transport parent.
    boundary: >-
      Established over three papers: AGFG1 is required for Rev-directed, RRE-containing RNA
      to leave the nuclear periphery, and the requirement does not extend to host mRNA. What
      is missing is a term whose differentia matches intron-retaining viral RNA.
    gap_kind:
    - ONTOLOGY
    resolution: >-
      Create a sibling of GO:0046784, or relax GO:0046784's definition, so that
      intron-retaining viral RNA export is expressible. See proposed_new_terms.
    provenance:
    - reference_id: PMID:14701878
      supporting_text: 'Thus, hRIP is an essential cellular Rev cofactor, which acts at a previously
        unanticipated step in HIV-1 RNA export: movement of RNAs from the nuclear periphery
        to the cytoplasm.'
proposed_new_terms:
- proposed_name: Rev-dependent viral RNA export from host cell nucleus
  proposed_definition: >-
    The directed movement of intron-retaining viral RNA from the host cell nucleus to the
    cytoplasm, mediated by a viral RNA-binding adaptor protein such as HIV-1 Rev acting on a
    cis-acting RNA element, in cooperation with host nuclear export machinery.
  justification: >-
    GO's only viral nuclear-RNA-export term, GO:0046784 viral mRNA export from host cell
    nucleus, specifies intronless viral mRNA in its definition and in all four of its
    synonyms ("intronless viral mRNA transport from nucleus to cytoplasm", "intronless viral
    mRNA export out of nucleus", "intronless viral mRNA export from host nucleus",
    "intronless viral mRNA-nucleus export"). That differentia excludes the Rev/RRE pathway,
    which exists precisely to export unspliced and partly spliced, intron-retaining RNA past
    the host's splicing-dependent export machinery. The consequence is visible in this gene's
    record: AGFG1's role, established over three papers, is currently carried either by a
    host term that its own data contradict (GO:0006406 mRNA export from nucleus, which this
    review moves away from) or by a general viral-transport parent (GO:0075733). Either a new
    sibling of GO:0046784 or a relaxation of GO:0046784's definition to cover intron-retaining
    viral RNA would let this and the other Rev cofactors be annotated for what they do. The
    same gap applies to HTLV-1 Rex, whose activation domain AGFG1 also binds.
  proposed_parent:
    id: GO:0019080
    label: viral gene expression
  supported_by:
  - reference_id: PMID:14701878
    supporting_text: 'Thus, hRIP is an essential cellular Rev cofactor, which acts at a previously
      unanticipated step in HIV-1 RNA export: movement of RNAs from the nuclear periphery
      to the cytoplasm.'
suggested_questions:
- question: >-
    PAINT/GO Central: should the three spermiogenesis terms on PANTHER node PTN002919572 -
    GO:0001675 acrosome assembly, GO:0007289 spermatid nucleus differentiation and GO:0045109
    intermediate filament organization - be moved down to the AGFG1-orthologue subfamily node
    (PTHR46134:SF1)? The node's 36 recipients comprise 21 AGFG1-type, 12 AGFG2-type and 3
    unnamed gene products across 17 species, so its human reach is exactly AGFG1 plus AGFG2.
    The entire experimental basis for all three terms is mouse Agfg1 (Q8K2K6), by IMP; mouse
    and rat Agfg2 are themselves IBA recipients, so no AGFG2 orthologue in any species holds
    experimental evidence for any of them. Human AGFG2's own characterised function is
    Weibel-Palade body sizing and von Willebrand factor secretion in endothelium, which is
    unrelated. One node edit would retract three incorrect terms from 12 AGFG2-named
    recipients while leaving all 21 AGFG1-named recipients correct. Stated once here for both
    genes rather than repeated per row; a concurrent review of AGFG2 is in progress and should
    treat this as a claim to verify rather than a finding.
- question: >-
    MGI/GO Central: mouse Agfg1's GO:0007289 spermatid nucleus differentiation IMP cites
    PMID:16765935, but that paper's result for hrb-null spermatids is a negative - H1T2 polar
    localisation is unaltered, which the authors use to argue that acrosome development is
    not required for nuclear polarity. The phenotype that does support the term, round
    spermatid nuclei bearing protrusions the authors call nucleopodes, is reported in
    PMID:14724135. Should the reference on that annotation be corrected? The human IBA
    descends from it.
- question: >-
    UniProt: the AGFG1 entry (P52594) carries "KW DNA-binding" and
    "DR GO; GO:0003677; F:DNA binding; IEA:UniProtKB-KW", but AGFG1 has no DNA-binding
    module. Its only zinc site is the ArfGAP C4 finger, which two structures show is buried
    and fully occupied by structural zinc on Cys29/32/49/52, and which the family's consensus
    reference describes as architectural rather than catalytic. The keyword appears to follow
    InterPro's remark that the ArfGAP zinc finger resembles the C4-type GATA finger, which is
    a fold resemblance rather than a measured activity. GOA no longer imports the keyword
    route, so there is no GO row to act on and no GO action is proposed; this is a request to
    withdraw the keyword upstream. The same entry's "GO:0008270; F:zinc ion binding" keyword
    is the mirror case - correct, dropped from GOA with the route, and proposed here as a NEW
    annotation.
- question: >-
    CATH/Gene3D and UniProt: AGFG1 is assigned G3DSA:3.30.450.50 "Longin domain" over
    residues 154-234, a region UniProt itself annotates as disordered (MobiDB-lite 145-193)
    and polar-biased (COMPBIAS 176-191). The cause is traceable: PDB 2VX8's chains A-D are
    each a single 169-residue polypeptide that PDBe maps to two UniProt entries, AGFG1
    136-175 and mouse VAMP7 1-120, and the authors describe building exactly that fusion. The
    longin fold belongs to VAMP7 and the domain call has crossed the fusion junction. The
    negative control is the paralogue: AGFG2, with the identical InterPro signature set and
    71.2% identity over the ArfGAP domain, has no 3.30.450.50 assignment - so the error is
    keyed on having a chimeric PDB entry, not on family membership. It currently produces no
    wrong GO term, since the derived FunFam is one condition of an ARBA rule that grants only
    cytoplasm, but it is worth correcting before it propagates.
- question: >-
    GOA/UniProt: UniProt's SUBUNIT line records "Interacts with EPS15R and EPS15. Interacts
    with FCHO1." and none of the three has a GOA counterpart. All are from low-throughput
    studies with mapped determinants - the EPS15 interaction is NPF/EH-dependent and its
    disruption abolishes the synergy with Rev, and the FCHO1 interaction is
    concentration-dependent with controls excluding an indirect route. Is there a reason these
    were not annotated?
- question: >-
    Has AGFG1 or AGFG2 ever been assayed for Arf GTPase-activating activity? The consensus
    nomenclature paper states that GAP activity has been demonstrated in vitro for at least
    one member of each subfamily except the ADAPs, but its own AGFG section reports none for
    either paralogue and says only that much less information is available on AGFG2. If no
    such assay exists, the family-level statement should not be read as covering the AGFG
    subfamily.
suggested_experiments:
- hypothesis: >-
    Human AGFG1 retains Arf binding but has substantially reduced GAP activity because two
    catalytically required residues are substituted.
  description: >-
    Measure Arf GAP activity of recombinant human AGFG1 directly, using the standard
    single-turnover GTP-hydrolysis assay on myristoylated ARF1 and ARF6 loaded with GTP on
    liposomes. Compare full-length AGFG1, the isolated ArfGAP domain (residues 1-141, the
    construct already crystallised as 2OLM), loss-of-function Arg57Ala, and restoration
    Tyr39Trp and Thr71Asp single and double mutants. ARFGAP1 is the positive control and
    ADAP1 the negative control, since the ADAP subfamily is reported to lack in-vitro
    activity despite an intact motif. Rescue by the restoration mutants would directly test
    the residue-level pseudoenzyme model; appreciable wild-type activity would instead show
    that AGFG1 uses a different catalytic solution and support retaining GO:0005096.
  experiment_type: in vitro GTP hydrolysis assay with structure-guided mutagenesis
- hypothesis: >-
    The acrosomal and somatic activities of AGFG1 are one mechanism - selection of
    SNARE-bearing vesicles through the VAMP7 longin domain.
  description: >-
    Ask whether VAMP7 is mislocalised in Agfg1-null mouse spermatids, and whether the AGFG1
    substitutions that abolish VAMP7 longin-domain binding in vitro (L160S/L163S,
    L163P/L164P, L171S/L173S) fail to rescue acrosome formation when expressed in Agfg1-null
    spermatids. A positive result would unify the two literatures on this gene under one
    molecular function; a negative one would show the acrosomal role uses a different cargo.
  experiment_type: knock-in rescue with binding-deficient mutants plus immunolocalisation
- hypothesis: >-
    AGFG1 is a cargo-selective adaptor rather than a general component of clathrin-mediated
    endocytosis.
  description: >-
    Resolve the transferrin/EGF discrepancy with a single cargo panel in one cell line. Knock
    AGFG1 down and measure uptake of transferrin, EGF, VAMP7 and a clathrin-independent
    control in parallel, with clathrin knockdown as the reference. The two 2008 studies used
    different cargoes in different cells and reached different conclusions about whether
    AGFG1 is a general clathrin-mediated-endocytosis component or a cargo-selective adaptor,
    and the answer determines whether GO:0072583 should carry a general or a cargo-restricted
    framing.
  experiment_type: parallel cargo-uptake panel after siRNA depletion
- hypothesis: >-
    Loss of AGFG1 function causes globozoospermia in humans, as it does in mice.
  description: >-
    Screen globozoospermia cohorts for AGFG1 loss-of-function variants. The mouse null
    phenotype is unambiguous and human AGFG1 is expressed in sperm, but the human acrosome
    annotations rest entirely on orthology; a human loss-of-function allele would convert
    them from similarity-based to direct evidence, and AGFG1 is absent from the current
    globozoospermia gene panels.
  experiment_type: targeted human genetics in an infertility cohort
- hypothesis: >-
    AGFG1's ArfGAP domain and its adjacent cargo-adaptor tail act on the same membrane event
    rather than being two independent activities that share a polypeptide.
  description: >-
    Because the VAMP7-binding stretch lies immediately C-terminal to the ArfGAP domain, and
    because Arf1/Arf6 recruit and release coat components, test whether Arf GTP loading
    modulates AGFG1-VAMP7 binding in vitro, and whether an Arg57Ala AGFG1 still supports
    VAMP7 retrieval in cells.
  experiment_type: in vitro binding under defined Arf nucleotide states plus cellular rescue
