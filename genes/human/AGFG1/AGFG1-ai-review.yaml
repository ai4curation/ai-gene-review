existing_annotations:
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - FB:FBgn0020304
  - MGI:MGI:1333754
  - PANTHER:PTN002353603
  - UniProtKB:P52594
  review:
    summary: >-
      Kept as non-core. AGFG1 is genuinely cytoplasmic and the propagation chain is sound,
      but cytoplasm is the least informative of this protein's locations - the ones that
      carry information are the clathrin-coated pit and vesicle, proposed separately.
    action: KEEP_AS_NON_CORE
    reason: >-
      Every donor token was resolved. FB:FBgn0020304 is Drosophila drongo, which has no
      Swiss-Prot entry, so seven TrEMBL accessions were used and reported as such; the
      longest, E1JHR0, holds GO:0005737 by its own IDA. MGI:MGI:1333754 is mouse Agfg1
      (Q8K2K6, Swiss-Prot, 561 aa) whose experimental evidence in this branch is a
      cytoplasmic-vesicle IDA rather than one at cytoplasm itself. UniProtKB:P52594 is
      AGFG1 itself, so this row is partly self-referential: that records a PAINT curator
      judging the location core for this gene and is valid, not circular. The same
      WITH/FROM field appears verbatim on the paralogue AGFG2, where P52594 makes it
      paralogue-derived instead - the same bytes with a different evidential status.
    supported_by:
    - reference_id: file:human/AGFG1/AGFG1-uniprot.txt
      supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Nucleus'
    - reference_id: PMID:10613896
      supporting_text: Hrb was present both in the nucleus and in extranuclear compartments
        (Fig. 4 A).
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN002353603
        source_label: PANTHER tree node, not a protein
        source_status: NOT_RELEVANT
        comment: An internal tree node; it is the inference structure, not an evidence
          source.
      - source_id: FB:FBgn0020304
        source_label: Drosophila melanogaster drongo (no Swiss-Prot entry; E1JHR0 and six
          other TrEMBL accessions)
        source_status: SUPPORTS_TRANSFER
        comment: Holds GO:0005737 by IDA from PMID:27654348. An unreviewed entry is weaker
          support and that is stated rather than hidden.
      - source_id: MGI:MGI:1333754
        source_label: Mus musculus Agfg1 (Q8K2K6, Swiss-Prot, 561 aa)
        source_status: SUPPORTS_TRANSFER
        comment: Experimental evidence in this branch is GO:0031410 IDA (PMID:11711676),
          i.e. at a descendant rather than at cytoplasm itself.
      - source_id: UniProtKB:P52594
        source_label: AGFG1 itself - self-referential IBA
        source_status: SUPPORTS_TRANSFER
        comment: A self-referential WITH/FROM records the curator's own judgement for this
          gene; it is valid and is not circular propagation.
- term:
    id: GO:0031410
    label: cytoplasmic vesicle
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:1333754
  - PANTHER:PTN002919572
  - UniProtKB:P52594
  review:
    summary: >-
      Accepted. This is where AGFG1 works, in both of its characterised roles: on
      clathrin-coated endocytic vesicles in somatic cells and on Golgi-derived
      proacrosomal vesicles in spermatids.
    action: ACCEPT
    reason: >-
      The IBA lands on exactly the term its donor holds, so no downward correction is
      warranted: mouse Agfg1 carries GO:0031410 by IDA from PMID:11711676, which places
      the protein on the cytosolic surface of proacrosomal transport vesicles. AGFG1's own
      human EXP row from PMID:10613896 agrees independently, and PMID:18775314 refines the
      compartment to clathrin-coated pits and vesicles - proposed as separate, more
      specific rows rather than by modifying this one, since the general term is true of
      both the somatic and the spermatid pools.
    supported_by:
    - reference_id: PMID:11711676
      supporting_text: In wild-type spermatids, Hrb is associated with the cytosolic surface
        of proacrosomic transport vesicles that fuse to create a single large acrosomic
        vesicle at step 3 of spermiogenesis.
    - reference_id: PMID:18819912
      supporting_text: In the cytoplasm, HRB colocalized with clathrin-, AP-2-, EPS15-,
        and transferrin receptor-containing vesicles.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002919572
        source_label: PANTHER tree node covering both the AGFG1 and AGFG2 subfamilies
        source_status: NOT_RELEVANT
        comment: A tree node rather than an evidence source. Its reach is discussed on the
          GO:0001675 row, where it matters.
      - source_id: MGI:MGI:1333754
        source_label: Mus musculus Agfg1 (Q8K2K6, Swiss-Prot)
        source_status: SUPPORTS_TRANSFER
        comment: Holds GO:0031410 by IDA from PMID:11711676 - the same term, not a more
          specific one, so the propagation does not land above its donor.
      - source_id: UniProtKB:P52594
        source_label: AGFG1 itself - self-referential IBA
        source_status: SUPPORTS_TRANSFER
        comment: Valid; and note the identical field on AGFG2 is paralogue-derived.
- term:
    id: GO:0001675
    label: acrosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1333754
  - PANTHER:PTN002919572
  review:
    summary: >-
      Accepted for AGFG1, which is the true orthologue of the mouse gene whose null
