references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The interpro2go route, and the source of the only molecular-function row in GOA.
      Which signature supplies the term was checked rather than assumed: of AGFG1's four
      InterPro signatures, only IPR001164 (the pan-ArfGAP catalytic-domain entry) maps to
      GO:0005096. The signature correctly identifies the conserved domain but cannot
      distinguish the AGFG subfamily, whose members examined here lack two of three residues
      required for efficient GAP catalysis; the AGFG-specific IPR052248 maps to no GO term.
      The row is therefore retained but marked as over-annotated rather than dismissed as a
      spurious domain match.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      All five IBA rows. Every protein donor named in their WITH/FROM fields was resolved
      and its own evidence for the propagated term queried; each row's chain contains at
      least one donor with its own experimental annotation at the exact term, so no row
      rests on family-level inference alone. The defect these rows do carry is node reach,
      not evidence quality - see the GO:0001675 entry.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      SL-0191 Nucleus and SL-0088 Cytoplasmic vesicle, both of which derive from the same
      UniProt SUBCELLULAR LOCATION statement (evidenced by PubMed:10613896 and
      PubMed:7634337) that the EXP rows already record independently.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      ARBA00026971. All 2414 of the rule's condition sets were evaluated against AGFG1's
      own signature and taxon profile: exactly one fires, and it requires both
      FunFam 1.10.220.150:FF:000005 and FunFam 3.30.450.50:FF:000005, two FunFams named
      for AGFG1 itself. A second set mentioning IPR001164 does not fire because it also
      requires IPR051718, which AGFG1 does not have. So this is a gene-specific rule
      granting one location AGFG1 independently has by experiment.
- id: PMID:7634337
  title: Identification of a novel cellular cofactor for the Rev/Rex class of retroviral
    regulatory proteins.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      A sound paper cited for two things it does not establish. Its own abstract has Rev
      binding the RNA and Rab/AGFG1 binding Rev's protein activation domain, so it cannot
      support GO:0003723 RNA binding; and the RNA it concerns is RRE-containing viral RNA,
      not host mRNA, so GO:0006406 mRNA export from nucleus reads more broadly than the
      evidence. The nucleus localisation it also carries is correct. This reference
      annotates exactly one entity in all of GOA, with three rows, which is the legacy
      ProtInc import signature.
- id: PMID:7637788
  title: A human nucleoporin-like protein that specifically interacts with HIV Rev.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      The abstract's nucleoporin claim is explicitly one of sequence homology, yet it is
      the sole support for GO:0005643 nuclear pore, a term whose definition asserts
      membership of the nuclear pore complex. A primary paper states outright that it is
      not certain whether AGFG1 is an authentic NPC constituent, and UniProt, curating this
      same paper, records Nucleus rather than nuclear envelope or nuclear pore. This
      reference annotates exactly one entity in all of GOA, with one row.
- id: PMID:10613896
  title: The eps15 homology (EH) domain-based interaction between eps15 and hrb connects
    the molecular machinery of endocytosis to that of nucleocytosolic transport.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. Supplies the nucleus and cytoplasmic-vesicle
      localisations, the EPS15/EPS15R interaction and its NPF/EH dependence, and - directly
      against the nuclear-pore row - the statement that AGFG1's status as an NPC
      constituent is not established.
- id: PMID:11545741
  title: Two closely related human nuclear export factors utilize entirely distinct
    export pathways.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited for the AGFG1-NXF3 IPI row. Not retrievable (Europe PMC reports isOpenAccess
      N, inEPMC N, no PMC id), so the interaction's mechanism cannot be read. The
      reference-projection test argues it is considered curation rather than pipeline
      output: it annotates four proteins (AGFG1, NXF3, NXF1, XPO1) with five different
      terms. IntAct holds no record of the pair, consistent with a curator reading the
      paper directly.
- id: PMID:11711676
  title: Lack of acrosome formation in Hrb-deficient mice.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The decisive orthologue phenotype and the basis of the acrosome-assembly IBA. Also
      the source of the mouse cytoplasmic-vesicle IDA. Absent from the affinage record.
- id: PMID:14701878
  title: hRIP, a cellular cofactor for Rev function, promotes release of HIV RNAs from
    the perinuclear region.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes that the export defect is specific to Rev-directed RNA and that bulk
      host poly(A)+ mRNA distribution is unaffected. This is the result that makes
      GO:0006406 mRNA export from nucleus the wrong branch for this gene.
- id: PMID:14724135
  title: The acroplaxome is the docking site of Golgi-derived myosin Va/Rab27a/b- containing
    proacrosomal vesicles in wild-type and Hrb mutant mouse spermatids.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The donor evidence for both the acrosome-assembly and the intermediate-filament
      IBAs. It supports the latter specifically: the mutant acroplaxome retains F-actin
      but is deficient in keratin 5, an intermediate-filament protein.
- id: PMID:15749819
  title: The cellular HIV-1 Rev cofactor hRIP is required for viral replication.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Corroborates the Rev-cofactor role with two independent ablation methods and a
      rescue, and adds that AGFG1 is not required for cell viability. Not cited by any
      GOA row.
- id: PMID:16765935
  title: Changes in intranuclear chromatin architecture induce bipolar nuclear localization
    of histone variant H1T2 in male haploid spermatids.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: >-
      This is the sole reference behind mouse Agfg1's GO:0007289 IMP, from which the human
      IBA descends, and its result for hrb is a NEGATIVE: H1T2 polar localisation is
      unaltered in hrb-null spermatids, which the authors use to argue that acrosome
      development is not required for nuclear polarity. The mouse spermatid nuclear
      phenotype (nucleopodes) is reported in PMID:14724135 instead, so the term is
      defensible for the orthologue but attached to the wrong reference.
- id: PMID:18775314
  title: Molecular basis for the sorting of the SNARE VAMP7 into endocytic clathrin-coated
    vesicles by the ArfGAP Hrb.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The strongest molecular study on this gene and the basis for most of the proposed new
      annotations: cargo-binding region mapped to residues 136-176, ITC affinity, a crystal
      structure, reciprocal mutations that abolish binding on both sides, colocalisation
      with clathrin and AP-2 in coated pits and vesicles, and a depletion phenotype. In all
      of GOA it has produced only two annotations, both bare protein binding. Absent from
      the affinage record.
- id: PMID:18809720
  title: Consensus nomenclature for the human ArfGAP domain-containing proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The family reference, used for two opposite purposes. It supplies the published
      catalytic-spacing anchor (CX2CX16CX2CX4R) and ArfGAP1's residue numbers, which the
      motif scan reproduces as a positive control; and it supplies the disconfirming
      control, since it reports that the ADAP subfamily lacks in vitro GAP activity
      although ADAP1's motif is complete. Both clauses of that sentence are used: the same
      sentence also asserts, at subfamily level and without a citation, that at least one
      member of every non-ADAP subfamily - which includes AGFG - has demonstrated in vitro
      GAP activity. Its AGFG section names no such measurement for either paralogue, so the
      blanket clause is treated as raising the prior rather than as the evidence.
- id: PMID:18819912
  title: Role of HRB in clathrin-dependent endocytosis.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Supports the clathrin-dependent-endocytosis role by knockdown, and is one of only two
      papers the affinage record returned. Marked DISPUTED because its generality is
      contested rather than because the paper is unsound: it reports transferrin uptake
      strongly reduced on HRB knockdown, while PMID:18775314 reports no effect of HRB
      depletion on EGF internalisation or degradation and reads AGFG1 as a
      SNARE-specific adaptor. Both results are recorded; this review does not adjudicate
      between them. The cache's Full Text section holds only page boilerplate, so only the
      abstract is used.
- id: PMID:22484487
  title: Distinct and separable activities of the endocytic clathrin-coat components
    Fcho1/2 and AP-2 in developmental patterning.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      An independent second laboratory classifying AGFG1 as a CLASP and showing
      concentration-dependent binding of Hrb to the FCHO1 mu-homology domain in HeLa
      lysates, with controls excluding an indirect, Asn-Pro-Phe-mediated route. The source
      of UniProt's FCHO1 SUBUNIT line, which has no GOA counterpart.
- id: PMID:23433073
  title: Ancient complexity, opisthokont plasticity, and discovery of the 11th subfamily
    of Arf GAP proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The paper that reverses this review's verdict on GO:0005096, and it was nearly
      missed: it was fetched, judged to be a family-classification paper with nothing
      resting on it, deleted before the first commit, and came back only through the
      concurrent AGFG2 review. Full text available and read. It names three
      catalytically required ASAP3 positions with the statement that mutating any one
      severely impairs activity, reports that only 2 of 40 AGFG sequences retain the
      aspartate and that the AGFG consensus uniquely lacks the tryptophan, and concludes
      that the AGFG subfamily is predicted to have lost substantial GAP activity while
      explicitly warning that this must not be confused with loss of Arf binding. Every
      claim used from it was re-measured here on AGFG1's own sequence with GAP-competent
      positive controls, rather than transferred from the paper's consensus analysis or
      from the sibling review.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      The HuRI yeast two-hybrid screen behind the POLE2 and NYAP2 rows. Correctly cited;
      the objection is evidence strength, not identity. Its projection test is
      uninformative by construction - it carries 24,599 annotations, too many to enumerate
      honestly - so no entity count is reported for it.
- id: PMID:27654348
  title: The temporally controlled expression of Drongo, the fruit fly homolog of AGFG1,
    is achieved in female germline cells via P-bodies and its localization requires
    functional Rab11.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      The donor evidence for the cytoplasm IBA: Drosophila drongo holds GO:0005737 by its
      own IDA from this paper. Cited to show that the cytoplasm row's chain is not empty of
      experimental evidence.
- id: PMID:31533044
  title: The ArfGAP Drongo Promotes Actomyosin Contractility during Collective Cell
    Migration by Releasing Myosin Phosphatase from the Trailing Edge.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The only functional evidence anywhere that an AGFG-family GTPase-activating function
      matters in vivo, and it names a specific Arf class. Abstract-only, so what is used is
      the abstract's statement that the GTPase-activating function is essential; the assay
      that established it is not asserted here.
- id: PMID:34369554
  title: Arf GTPase-activating proteins SMAP1 and AGFG2 regulate the size of Weibel-Palade
    bodies and exocytosis of von Willebrand factor.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited only for the paralogue argument. It gives AGFG2 its own characterised function
      in endothelial von Willebrand factor secretion and does not mention AGFG1 anywhere,
      which is what makes the spermatid terms reaching AGFG2 by IBA look like node
      over-reach rather than genuine shared biology.
- id: PMID:38606629
  title: Mapping the global interactome of the ARF family reveals spatial organization
    in cellular signaling pathways.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The only human dataset placing AGFG1 in the ARF orbit, and it is proximity labelling
      rather than a GAP assay - evidence for association, not catalysis. Absent from GOA and
      from the affinage record. It supports retained Arf binding while leaving the catalytic
      prediction untested.
- id: PMID:39089666
  title: AGFG1 increases cholesterol biosynthesis by disrupting intracellular cholesterol
    homeostasis to promote PDAC progression.
  full_text_unavailable: true
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Recorded as an uncurated human result, not used to propose terms. A single
      cancer-cell study reporting a CAV1 interaction and altered cholesterol biosynthesis
      is not a basis for new process annotations here.
- id: file:human/AGFG1/AGFG1-uniprot.txt
  title: UniProtKB entry AGFG1_HUMAN (P52594)
- id: file:human/AGFG1/AGFG1-bioinformatics/RESULTS.md
  title: AGFG1 computational analyses supporting the GO review
- id: file:human/AGFG1/AGFG1-deep-research-affinage.md
  title: Affinage mechanistic annotation for AGFG1 (human)
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Machine-generated provider record, gates_passed True, and its two citations
      (PMID:10613896 and PMID:18819912) are real and correctly quoted - so its precision
      is fine. Its recall is not, and that was measured rather than asserted: it returned
      neither of the two papers that decide this review (PMID:18775314, the VAMP7 structure
      and depletion phenotype, and PMID:11711676, the mouse null with no acrosome), nor
      PMID:18809720, the family reference supplying the catalytic-motif anchor, nor
      PMID:38606629, the only human dataset placing AGFG1 with ARF1/ARF3/ARF6. It also
      states the general clathrin-mediated-endocytosis requirement as settled when
      PMID:18775314 contradicts it for EGF. Cited here for exactly one thing: its explicit
      statement about the extent of its own corpus, used as a statement about that corpus
      and corroborated independently.
