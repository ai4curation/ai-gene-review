core_functions:
- description: Catalytic alpha/beta subunits of the Golgi GlcNAc-1-phosphotransferase complex that recognise
    soluble lysosomal acid hydrolases and transfer GlcNAc-1-phosphate from UDP-GlcNAc to their high-mannose
    N-glycans, the first step in forming the mannose 6-phosphate lysosomal targeting signal.
  molecular_function:
    id: GO:0003976
    label: UDP-N-acetylglucosamine-lysosomal-enzyme N-acetylglucosaminephosphotransferase activity
  directly_involved_in:
  - id: GO:0016256
    label: N-glycan processing to lysosome
  locations:
  - id: GO:0000139
    label: Golgi membrane
  in_complex:
    id: GO:0070622
    label: UDP-N-acetylglucosamine-lysosomal-enzyme N-acetylglucosaminephosphotransferase complex
  supported_by:
  - reference_id: PMID:19955174
    supporting_text: the alpha/beta subunits recognize the protein determinant of acid hydrolases in addition
      to mediating the catalytic function of the transferase
  - reference_id: PMID:19955174
    supporting_text: mediates the first step in the synthesis of the mannose 6-phosphate recognition marker
      on lysosomal acid hydrolases
  - reference_id: PMID:16200072
    supporting_text: expression and localization of GNPTA in the Golgi apparatus, accompanied by the correction
      of hypersecretion of lysosomal enzymes
  - reference_id: PMID:21719679
    supporting_text: Cleavage of the membrane-bound α/β-subunit precursor by an unknown protease is required
      for catalytic activity.
suggested_questions:
- question: Is LYSET a stoichiometric subunit of the GlcNAc-1-phosphotransferase complex or a transient
    chaperone/retention factor?
  experts:
  - lysosomal enzyme trafficking biochemists
suggested_experiments:
- description: Cryo-EM of endogenous GlcNAc-1-phosphotransferase purified from human Golgi membranes,
    with and without LYSET.
  experiment_type: structural biology
  hypothesis: LYSET binds the hydrophilic transmembrane segment of the GNPTAB beta subunit and is part
    of the active Golgi complex.
