id: Q3T906
gene_symbol: GNPTAB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: GNPTAB encodes the alpha/beta-subunit precursor of UDP-GlcNAc:lysosomal enzyme N-acetylglucosamine-1-phosphotransferase
  (EC 2.7.8.17), the alpha2beta2gamma2 Golgi membrane enzyme complex (with GNPTG) that transfers GlcNAc-1-phosphate
  from UDP-GlcNAc to mannose residues of high-mannose N-glycans on soluble lysosomal acid hydrolases.
  This is the first step in generating the mannose 6-phosphate (M6P) recognition marker that directs hydrolases
  to M6P receptors and thence to endosomes and lysosomes. The alpha/beta subunits are catalytic and also
  recognise a conformational protein determinant on acid hydrolases; the precursor is activated in the
  Golgi by site-1 protease cleavage and depends on LYSET/TMEM251 for stability and Golgi retention. Biallelic
  loss of GNPTAB causes mucolipidosis II (I-cell disease) and, with residual activity, mucolipidosis III
  alpha/beta.
