  supporting_entities:
  - PANTHER:PTN002779133
  - UniProtKB:Q3T906
  - ZFIN:ZDB-GENE-030131-4714
  review:
    summary: GlcNAc-1-phosphotransferase activity is the core catalytic function of GNPTAB.
    action: ACCEPT
    reason: Recombinant alpha/beta subunits carry the catalytic activity (EC 2.7.8.17); disease mutations
      in catalytic and recognition domains abolish phosphorylation of acid hydrolases.
    supported_by:
    - reference_id: PMID:19955174
      supporting_text: the alpha/beta subunits recognize the protein determinant of acid hydrolases in
        addition to mediating the catalytic function of the transferase
    - reference_id: PMID:16120602
      supporting_text: results in a 3.6- or 17-fold increase in GlcNAc-phosphotransferase activity in
        cell lysates, suggesting that the precursor cDNA contains the catalytic domain
    - reference_id: PMID:25505245
      supporting_text: We show that the Stealth domain harbors the catalytic site
