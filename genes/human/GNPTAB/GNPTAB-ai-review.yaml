- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002048
  review:
    summary: Calcium ion binding is inferred from an EF-hand-like InterPro signature only.
    action: KEEP_AS_NON_CORE
    reason: The signature support is stronger than an EF-hand domain call alone - UniProt
      annotates per-residue Ca(2+) BINDING features, in the EF-hand domain at 1005..1040 and
      in the LNR repeats - but every one is ECO:0000255, inferred from a sequence model rather
      than measured, so calcium binding by GNPTAB and its functional relevance still have not
      been demonstrated experimentally. Non-core on the strength of the evidence, not on doubt
      about the signature.
    supported_by:
    - reference_id: file:human/GNPTAB/GNPTAB-uniprot.txt
      record_section: ["FT:DOMAIN"]
      supporting_text: /note="EF-hand"
    - reference_id: file:human/GNPTAB/GNPTAB-uniprot.txt
      record_section: ["FT:BINDING"]
      supporting_text: /ligand="Ca(2+)"
