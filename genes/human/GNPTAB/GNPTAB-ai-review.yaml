- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:36074821
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q8N6I4
  review:
    summary: GNPTAB binds the Golgi membrane protein LYSET, which stabilises it and retains it in the
      Golgi.
    action: REMOVE
    reason: A functionally validated interaction (LYSET loss destabilises and mislocalises GNPTAB), but
      the activity belongs to LYSET as a regulator; for GNPTAB the generic 'protein binding' term adds
      no functional information. The interaction itself is real and is captured on the LYSET review; removal
      does not assert it is false.
    supported_by:
    - reference_id: PMID:36074821
      supporting_text: LYSET deficiency resulted in global loss of M6P tagging and mislocalization of
        GlcNAc-1-phosphotransferase from the Golgi complex to lysosomes.
