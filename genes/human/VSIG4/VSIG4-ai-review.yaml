  review:
    summary: >-
      Phylogenetic inference that VSIG4 binds complement C3b. Human VSIG4 itself is among the
      experimental sources; the C3b-CRIg crystal structure and binding studies establish this
      activity directly.
    action: ACCEPT
    reason: >-
      Direct binding of CRIg/VSIG4 to C3b (and iC3b) is well established structurally and
      biochemically, and is the molecular basis of both its phagocytic receptor function and its
      convertase inhibition. The IBA is consistent with the experimental data, and VSIG4 appearing
      in its own WITH/FROM reflects experimental grounding on the target.
