suggested_questions:
- question: >-
    What is the receptor on T cells that VSIG4 engages to deliver coinhibitory signals, and does
    membrane VSIG4 on macrophages inhibit T cells in vivo as well as the soluble Ig fusion protein?
- question: >-
    Does membrane-bound VSIG4 on Kupffer cells make a quantitatively significant contribution to
    alternative-pathway regulation in vivo, or is convertase inhibition mainly a property seen with
    soluble ectodomain constructs?
- question: >-
    Is the complement-independent binding of lipoteichoic acid by CRIg seen in mouse conserved in
    human VSIG4, and should it be annotated as lipoteichoic acid binding?
- question: >-
    Which human protein (MS4A family or other) partners with VSIG4 to transmit the anti-inflammatory
    JAK2-STAT3-A20 signal described for mouse MS4A6D?
suggested_experiments:
- description: >-
    Unbiased receptor screens (cell-surface protein arrays or CRISPR screens in human T cells) using
    VSIG4-Fc to identify the T cell counter-receptor, followed by blocking studies in co-cultures of
    human macrophages and T cells.
- description: >-
    Binding assays (SPR or flow cytometry) of human VSIG4 ectodomain with purified lipoteichoic acid
    and Gram-positive bacteria in complement-depleted serum, to test whether the mouse LTA recognition
    is conserved in human VSIG4.
- description: >-
    Liver-specific or Kupffer-cell-specific VSIG4 deletion in humanized-complement mice, measuring
    alternative pathway activation products (Bb, C3a, C5a) on opsonized particles in the circulation,
    to separate the receptor and regulator roles of membrane VSIG4.
