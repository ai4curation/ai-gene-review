id: Q9Y279
gene_symbol: VSIG4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  VSIG4 (also called CRIg, complement receptor of the immunoglobulin superfamily, or Z39Ig)
  is an X-linked single-pass type I transmembrane protein with an extracellular IgV domain
  (plus an IgC2 domain in the long isoform). It is expressed on resting tissue-resident
  macrophages, most prominently liver Kupffer cells. VSIG4 is a phagocytic receptor for the
  complement C3 fragments C3b and iC3b: it captures C3-opsonized particles and pathogens from
  the circulation and promotes their phagocytosis and intracellular killing. Binding of its IgV
  domain to the C3b beta-chain also inhibits the alternative-pathway C3 and C5 convertases, so
  the ectodomain acts as a selective inhibitor of alternative-pathway complement activation.
  Mouse studies also show complement-independent capture of Gram-positive bacteria through
  lipoteichoic acid. VSIG4 is related to the B7 family. Soluble VSIG4-Ig suppresses T cell
  proliferation and IL-2 production, and VSIG4 signaling in macrophages (PI3K/Akt-STAT3,
  JAK2-STAT3-A20) dampens inflammatory activation, including NLRP3/IL-1B expression.
