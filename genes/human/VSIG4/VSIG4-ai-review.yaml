  - PANTHER:PTN001810319
  review:
    summary: >-
      Phylogenetic inference from mouse Vsig4. VSIG4-Ig fusion protein inhibits IL-2 production
      by mouse and human T cells.
    action: KEEP_AS_NON_CORE
    reason: >-
      Vogt et al. 2006 showed that soluble VSIG4-Ig suppresses IL-2 production by both human and
      mouse T cells, so the inference is consistent with the data. Reduced IL-2 is, however, a
      readout of the broader coinhibition of T cell activation, which is captured better by negative
      regulation of T cell proliferation. The T cell counter-receptor and the in vivo contribution
      of membrane VSIG4 are unknown, so this annotation is kept as non-core.
    supported_by:
    - reference_id: PMID:17016562
      supporting_text: In vitro experiments using VSIG4-Ig fusion molecules showed that VSIG4 is a strong negative regulator of murine and human T cell proliferation and IL-2 production.
