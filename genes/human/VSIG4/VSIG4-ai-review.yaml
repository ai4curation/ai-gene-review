- term:
    id: GO:0004877
    label: complement component C3b receptor activity
  evidence_type: IDA
  original_reference_id: PMID:16530040
  review:
    summary: >-
      VSIG4/CRIg is a transmembrane macrophage receptor that binds C3b/iC3b on opsonized particles
      and transmits signals that drive phagocytosis, phagosome killing (via CLIC3) and autophagy.
    action: NEW
    reason: >-
      The existing annotations capture C3b binding but not the receptor activity, which is the main
      function UniProt describes ("Phagocytic receptor"). CRIg is required for binding and
      phagocytosis of C3-opsonized particles by Kupffer cells. Engagement of CRIg by opsonized
      bacteria or agonist antibody triggers intracellular signaling: CLIC3 binds its cytoplasmic
      domain, and engagement induces autophagosome formation. Comparator check: CR1 (P17927), the
      classical C3b/C4b receptor, carries GO:0004877 by IDA, so this term is used for C3b-binding
      phagocytic receptors.
    additional_reference_ids:
    - PMID:23280470
    - PMID:27440002
    supported_by:
    - reference_id: PMID:16530040
      supporting_text: CRIg expression on Kupffer cells is required for efficient binding and phagocytosis of complement C3-opsonized particles.
    - reference_id: PMID:23280470
      supporting_text: CLIC3, an intracellular chloride channel protein, was essential for CRIg-mediated LM killing by directly interacting with the cytoplasmic domain of CRIg
    - reference_id: PMID:27440002
      supporting_text: VSIG4 signaling triggered by C3-opsonized Listeria (opLM) or by agonistic anti-VSIG4 monoclonal antibody (mAb) induced macrophages to form autophagosomes.
- term:
    id: GO:0001852
    label: complement component iC3b binding
  evidence_type: IDA
  original_reference_id: PMID:16530040
  review:
    summary: >-
      VSIG4/CRIg binds iC3b as well as C3b, so it recognizes the main opsonic C3 fragments
      deposited on particles.
    action: NEW
    reason: >-
      Both the discovery paper and the structural paper state that CRIg binds C3b and iC3b. iC3b is
      a major opsonin on particle surfaces, and its binding is directly relevant to the phagocytic
      receptor function. This MF annotation is not yet present.
    supported_by:
    - reference_id: PMID:16530040
      supporting_text: CRIg, that binds complement fragments C3b and iC3b.
    - reference_id: PMID:17051150
      supporting_text: CRIg, a complement receptor expressed on macrophages, binds to C3b and iC3b mediating phagocytosis of the particles
- term:
    id: GO:0006910
    label: phagocytosis, recognition
  evidence_type: IMP
  original_reference_id: PMID:16530040
  review:
    summary: >-
      As a surface receptor for C3-opsonized particles, VSIG4 carries out the recognition and
      capture step of complement-mediated phagocytosis by tissue macrophages (Kupffer cells,
      peritoneal macrophages).
    action: NEW
    reason: >-
      VSIG4 performs the recognition step itself: it binds the opsonin on the particle surface.
      This passes the participation test, as opposed to being only required for the process.
      CRIg-deficient Kupffer cells fail to bind and clear C3-opsonized pathogens, and CRIg dominates
      immediate binding of complement-coated particles in peritoneal macrophages. The process is not
      represented among the existing annotations, although UniProt describes VSIG4 as a phagocytic
      receptor.
    additional_reference_ids:
    - PMID:19017980
    supported_by:
    - reference_id: PMID:16530040
      supporting_text: Kupffer cells from CRIg-deficient mice are unable to efficiently clear C3-opsonized pathogens in the circulation, resulting in increased infection and mortality of the host.
    - reference_id: PMID:19017980
      supporting_text: Although CRIg dominated in immediate binding of complement-coated particles, CRIg and CR3 contributed independently to subsequent particle phagocytosis.
    - reference_id: file:human/VSIG4/VSIG4-uniprot.txt
      supporting_text: 'FUNCTION: Phagocytic receptor'
