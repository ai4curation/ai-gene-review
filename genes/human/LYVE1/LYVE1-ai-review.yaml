- id: PMID:10037799
  title: LYVE-1, a new homologue of the CD44 glycoprotein, is a lymph-specific receptor for
    hyaluronan.
  findings:
  - statement: The founding LYVE1 paper cloned human LYVE1 as a CD44-related type-I hyaluronan
      receptor on lymphatic endothelium and showed that LYVE1 binds soluble and immobilized HA.
    supporting_text: Like CD44, the LYVE-1 molecule binds both soluble and immobilized HA.
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding primary paper for human LYVE1 sequence, lymphatic localization and
      hyaluronan-binding activity; later work refined the avidity and in vivo leukocyte-entry
      mechanism.
- id: PMID:23533145
  title: In-depth proteomic analyses of exosomes isolated from expressed prostatic secretions in
    urine.
  findings: []
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings: []
- id: PMID:26823460
  title: Binding of Hyaluronan to the Native Lymphatic Vessel Endothelial Receptor LYVE-1 Is
    Critically Dependent on Receptor Clustering and Hyaluronan Organization.
  findings:
  - statement: Native lymphatic endothelial LYVE1 binds HA when the receptor or ligand is organized
      into higher-order clusters, and macrophage-surface HA supports LYVE1-dependent lymphatic
      endothelial adhesion and transmigration in vitro.
    supporting_text: native endogenous LYVE-1 can in fact engage HA when the polymer is presented in
      an appropriately cross-linked state
    reference_section_type: RESULTS
  - statement: The authors explicitly cautioned that high molecular weight HA uptake had not yet
      been demonstrated for native masked LYVE1 in lymphatic endothelial cells.
    supporting_text: no such activity has been demonstrated for LYVE-1 in its native
    reference_section_type: DISCUSSION
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary evidence for avidity-dependent native LYVE1-HA binding and macrophage
      transendothelial migration in vitro; its native-LEC uptake caveat is addressed by PMID:32736525.
- id: PMID:28504698
  title: Dendritic cells enter lymph vessels by hyaluronan-mediated docking to the endothelial
    receptor LYVE-1.
  findings:
  - statement: Lyve1 deletion, LYVE1 antibody blockade, and DC hyaluronan-coat depletion delayed
      dendritic-cell trafficking through dermal lymphatics to draining lymph nodes.
    supporting_text: targeted deletion of the gene Lyve1, antibody blockade or depletion of the DC
      hyaluronan coat not only delayed lymphatic trafficking of dermal DCs but also blunted their
      capacity to prime CD8+ T cell responses in skin-draining LNs
    full_text_unavailable: true
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache, but the abstract directly verifies the in vivo Lyve1
      loss-of-function and antibody-blockade evidence used to support LYVE1-dependent lymphatic
      docking of dendritic cells.
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  findings: []
- id: PMID:32736525
  title: FK506 induces lung lymphatic endothelial cell senescence and downregulates LYVE-1
    expression, with associated decreased hyaluronan uptake.
  findings:
  - statement: Function-blocking LYVE1 antibody reduced FITC-HA uptake in primary lung lymphatic
      endothelial cells, corroborating a native LEC uptake role.
    supporting_text: inhibiting LYVE-1 with function blocking antibody, which significantly reduced
      the HA uptake
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary lung LEC evidence that endogenous LYVE1 contributes to HA uptake in a
      native lymphatic endothelial setting.
