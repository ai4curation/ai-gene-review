id: Q9Y5Y7
gene_symbol: LYVE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'LYVE1 is a type I plasma-membrane hyaluronan receptor of lymphatic endothelial cells. Its
  extracellular Link domain binds clustered or multimerized hyaluronan, allowing LYVE1 to tether extracellular
  HA, contribute to HA-dependent immune-cell entry into lymphatics, and act as a cargo receptor for
  receptor-mediated HA uptake linked to downstream HA clearance.'
existing_annotations:
- term:
    id: GO:0002693
    label: positive regulation of cellular extravasation
  evidence_type: IDA
  original_reference_id: PMID:26823460
  qualifier: involved_in
  review:
    summary: LYVE1-bound hyaluronan on macrophages and dendritic cells can promote lymphatic endothelial
      adhesion and transmigration.
    action: ACCEPT
    reason: Human dermal lymphatic endothelial LYVE1 engages hyaluronan displayed on macrophage
      surfaces; the 2016 study showed that this interaction supports macrophage adhesion and
      transendothelial migration. Mouse Lyve1 deletion, LYVE1 antibody blockade, and DC hyaluronan-coat
      depletion independently delay dermal dendritic-cell trafficking to lymph nodes in vivo. Although
      GO:0002693 formally regulates blood-vessel extravasation, it is the closest existing term for this
      HA-dependent immune-cell passage into lymphatic vessels, so the row is kept as a direct but
      context-specific LYVE1 process.
    supported_by:
    - reference_id: PMID:26823460
      supporting_text: HA assembled on the surface of macrophages, like that in the surface capsule
        of Group A streptococci, can interact with endogenous LYVE-1 in lymphatic endothelium in
        vitro and support transendothelial migration
    - reference_id: PMID:28504698
      supporting_text: targeted deletion of the gene Lyve1, antibody blockade or depletion of the DC
        hyaluronan coat not only delayed lymphatic trafficking of dermal DCs but also blunted their
        capacity to prime CD8+ T cell responses in skin-draining LNs
- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:2136348
  - MGI:MGI:88338
  - PANTHER:PTN000812484
  - UniProtKB:P16070
  review:
    summary: LYVE1 is a single-pass hyaluronan receptor with non-core evidence for HA-linked
      signaling.
    action: KEEP_AS_NON_CORE
    reason: LYVE1 is a plasma-membrane HA receptor and the PTHR10225 IBD is placed on a node that
      covers both the LYVE1 and CD44 branches, with mouse Lyve1 and mouse/human CD44 among its seeds.
      Directly assayed HA binding and uptake are the core functions; HA- or HA-fragment-induced
      signaling through LYVE1 is reported but is secondary to those
      receptor/cargo roles.
    supported_by:
    - reference_id: PMID:26823460
      supporting_text: Although evidence suggests an interaction between HA or HA degradation
        products and LYVE-1 in lymphatic endothelial cells can transduce downstream signaling and
        cell proliferation
    - reference_id: file:interpro/panther/PTHR10225/PTHR10225-paint.tsv
      supporting_text: "PTHR10225\tPTN000812484\tGO:0004888\tF\tIBD\tfalse"
