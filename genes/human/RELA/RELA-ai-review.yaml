- term:
    id: GO:0038124
    label: toll-like receptor TLR6:TLR2 signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:27708357
  qualifier: involved_in
  review:
    summary: toll-like receptor TLR6:TLR2 signaling pathway is a supported non-core upstream context for RELA.
    action: KEEP_AS_NON_CORE
    reason: The TLR2/TLR6 GO-CAM models RELA as the terminal NF-kappaB DNA-binding transcription factor downstream of MYD88. Ren et al. measured MyD88-dependent NF-κB/AP-1 reporter activation downstream of TLR2/TLR6-stimulating lactic acid bacteria; that paper does not identify RELA alone, so the row is best read as a pathway synthesis and is non-core in the same way as the TLR4, TNF and IL-1 pathway branches.
    additional_reference_ids:
    - PMID:1406630
    - PMID:2006423
    supported_by:
    - reference_id: PMID:27708357
      supporting_text: We found that several strains such as L. plantarum CCFM634, L. plantarum CCFM734, L. fermentum CCFM381, L. acidophilus CCFM137, and S. thermophilus CCFM218 stimulated TLR2/TLR6.
    - reference_id: PMID:27708357
      supporting_text: NF-κB/AP-1 activation induced by bacteria in THP1-XBlueTM-MD2-CD14 reporter cells was measured.
    - reference_id: PMID:2006423
      supporting_text: Therefore the rel-related 65-kD protein may represent the p65 subunit of the active NF-kappa B transcription factor complex.
