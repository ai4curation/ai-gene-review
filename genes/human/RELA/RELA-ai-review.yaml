- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: EXP
  original_reference_id: PMID:1493333
  qualifier: located_in
  review:
    summary: cytoplasm is a supported non-core RELA localization.
    action: KEEP_AS_NON_CORE
    reason: RELA-containing NF-kappaB dimers can be held in the cytoplasm by I-kappaB proteins before pathway activation. This cytoplasmic or cytosolic pool is real and mechanistically important, but the core DNA-binding transcription-factor activity acts after nuclear translocation.
