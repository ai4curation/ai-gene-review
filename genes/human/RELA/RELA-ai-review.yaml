id: Q04206
gene_symbol: RELA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RELA encodes transcription factor p65, a Rel-homology-domain subunit of NF-kappaB transcription factor dimers. RELA uses its N-terminal Rel homology domain for kappaB-site DNA binding, dimerization and nuclear localization and its C-terminal activation domains to drive RNA polymerase II transcription. In resting cells RELA-containing NF-kappaB dimers are commonly held inactive in the cytoplasm by I-kappaB proteins; immune and stress pathways that degrade I-kappaB permit RELA-containing dimers, especially the abundant p50/p65 complex, to enter the nucleus and regulate cytokine, inflammatory, survival and host-defense target genes.
