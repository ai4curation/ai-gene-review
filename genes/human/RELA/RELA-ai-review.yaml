- term:
    id: GO:0098978
    label: glutamatergic synapse
  evidence_type: IDA
  original_reference_id: PMID:12947408
  qualifier: is_active_in
  review:
    summary: glutamatergic synapse is a supported neuron-specific RELA/NF-kappaB context.
    action: KEEP_AS_NON_CORE
    reason: The cited SynGO paper directly localizes p65:p50 NF-kappaB at synapses and reports that p65-deficient mice lack detectable synaptic NF-kappaB, supporting the postsynaptic localization and synapse-to-nucleus signaling claims. These rows are peripheral to RELA's core immune transcription-factor role, so they are kept as non-core rather than removed.
    supported_by:
    - reference_id: PMID:12947408
      supporting_text: The p65:p50 NF-kappa B form is selectively localized at synapses; p65-deficient mice have no detectable synaptic NF-kappa B.
    - reference_id: PMID:12947408
      supporting_text: Activated NF-kappa B moves to the nucleus and could directly transmute synaptic signals into altered gene expression.
