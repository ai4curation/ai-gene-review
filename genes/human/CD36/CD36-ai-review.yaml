id: P16671
gene_symbol: CD36
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CD36 is a two-pass class B scavenger receptor that acts at the cell
  surface to bind oxidized lipoproteins, long-chain fatty acids, thrombospondins,
  amyloid-beta, and microbial lipid ligands. Palmitoylated CD36 captures long-chain
  fatty acids and, after ligand-triggered LYN/ZDHHC5/APT1 signalling, undergoes caveola-dependent
  endocytosis to import fatty acids. As an oxLDL receptor it mediates modified-LDL
  uptake and macrophage foam-cell formation; as a thrombospondin receptor it contributes
  to antiangiogenic signalling; and as a co-receptor for TLR4:TLR6 or TLR2:TLR6 it
  couples sterile or microbial ligands to inflammatory NF-kappaB and NLRP3 outputs.'
