suggested_questions:
- question: How much of CD36-dependent fatty-acid uptake uses caveolae in human
    macrophages, muscle and enterocytes compared with the adipocyte systems used
    to define the LYN-ZDHHC5-APT1 cycle?
- question: Which human CD36 ligands induce productive TLR4:TLR6 versus
    TLR2:TLR6 signalling at physiological concentrations?
suggested_experiments:
- description: Quantitatively perturb LYN, ZDHHC5, APT1 and CAV1 in primary
    human CD36-positive cells and measure ligand-specific fatty-acid uptake and
    oxLDL internalization to separate the shared and ligand-specific endocytic
    routes.
- description: Reconstitute purified human CD36 with TLR4:TLR6 or TLR2:TLR6 in
    defined membranes and measure ligand-driven complex formation for oxLDL,
    amyloid-beta and bacterial diacylated lipopeptide ligands.
