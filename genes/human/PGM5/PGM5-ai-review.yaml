id: Q15124
gene_symbol: PGM5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PGM5, also called aciculin or phosphoglucomutase-related protein, is a
  catalytically inactive vertebrate paralog of phosphoglucomutase. It lacks the
  conserved phosphomutase active-site consensus and does not show
  phosphoglucomutase activity, so it acts as a structural cytoskeletal protein
  rather than as a carbohydrate-metabolism enzyme. Human aciculin is enriched at
  adherens-type cell-cell and cell-matrix junctions, focal contacts, the inner
  side of the sarcolemma, costameric and myotendinous junctional regions, and
  cardiomyocyte intercalated discs, where it associates with actin-linked
  cytoskeletal structures and can bind dystrophin or utrophin.
