- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - FB:FBgn0023441
  - PANTHER:PTN001018050
  - UniProtKB:Q6NXG1
  - UniProtKB:Q9H6T0
  review:
    summary: 'IBA from PAINT node PTN001018050 (Eumetazoa ESRP clade; IBD seeded by Drosophila fusilli,
      human ESRP1 and ESRP2). Human ESRP1 is inside the clade and is itself an experimental seed. ESRP1
      binds specific GU-rich/UGG-containing sequences in target pre-mRNAs: UV-crosslinking to the FGFR2
      ISE/ISS-3 element is lost when GU/UG dinucleotides are mutated, and endogenous human ESRP1 is pulled
      down from KATO III nuclear extract by wild-type but not mutant ISE/ISS-3 RNA.'
    action: MODIFY
    reason: 'The node placement is sound: ESRP1, ESRP2 (PTHR13976:SF30) and fusilli (SF25) form the ESRP
      clade, ESRP1 is a seed, and fusilli can substitute for the mammalian protein in FGFR2 splicing.
      Because the binding is sequence-specific (GU-rich motif), refine to sequence-specific mRNA binding
      (GO:1990825), a descendant of mRNA binding; actions kept consistent with the IDA row.'
    proposed_replacement_terms:
    - &id003
      id: GO:1990825
      label: sequence-specific mRNA binding
    supported_by:
    - *id002
    - &id008
      reference_id: PMID:19285943
      supporting_text: Our demonstration that D. Melanogaster Fusilli can regulate endogenous FGFR2 splicing
        provides the first evidence that this fly protein is a splicing factor
    - reference_id: file:human/ESRP1/ESRP1-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: DR   InterPro; IPR050666; ESRP.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      failure_modes: []
      source_entities:
      - source_id: PANTHER:PTN001018050
        source_status: SUPPORTS_TRANSFER
        comment: Eumetazoan ESRP-clade node seeded by fusilli, ESRP1 and ESRP2; ESRP1 is inside the clade
          and is itself a seed. The inherited term is correct; the MODIFY only refines it to sequence-specific
          mRNA binding.
- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IDA
  original_reference_id: PMID:19285943
  qualifier: enables
  review:
    summary: 'IDA from Warzecha et al. 2009. ESRP1 binds specific GU-rich/UGG-containing sequences in
      target pre-mRNAs: UV-crosslinking to the FGFR2 ISE/ISS-3 element is lost when GU/UG dinucleotides
      are mutated, and endogenous human ESRP1 is pulled down from KATO III nuclear extract by wild-type
      but not mutant ISE/ISS-3 RNA.'
    action: MODIFY
    reason: The binding is established in human cells for endogenous ESRP1 and is sequence-specific, so
      the more precise descendant sequence-specific mRNA binding (GO:1990825; is_a GO:0003729, verified)
      is warranted. The bound element lies in FGFR2 intron 8, which is also captured by the NEW pre-mRNA
      intronic binding row.
    proposed_replacement_terms:
    - *id003
    supported_by:
    - *id002
    - *id004
