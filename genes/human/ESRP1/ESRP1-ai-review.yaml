- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:25416956
  qualifier: enables
  supporting_entities:
  - UniProtKB:P54253
  review:
    summary: High-throughput binary interactome/Y2H screen IPI (PMID:25416956) reporting an interaction
      with UniProtKB:P54253. ESRP1 appears as a frequent prey/bait in these screens (e.g. ATXN1, TARDBP,
      RBPMS2).
    action: REMOVE
    reason: Bare protein binding is uninformative under the repository protein-binding policy. The interaction
      is not disputed, but the screen establishes no specific molecular function (no adaptor, regulator
      or complex role) for ESRP1, whose established activity is sequence-specific RNA binding in splicing
      regulation.
