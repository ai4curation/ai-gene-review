      supporting_text: DR   SMART; SM00360; RRM; 3.
    - &id002
      reference_id: PMID:19285943
      supporting_text: Crosslinking of overexpressed Esrp1 and Esrp2 was observed with the wild-type,
        but not the functional mutant of this sequence, suggesting that they bind specific GU-rich sequence
