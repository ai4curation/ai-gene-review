core_functions:
- description: Sequence-specific binding, via its RRM domains, of GU-rich/UGG-containing cis-elements
    in intronic and exonic regions of target pre-mRNAs (e.g. FGFR2 ISE/ISS-3), through which ESRP1 enhances
    or silences alternative exons in a position-dependent manner in the nucleoplasm of epithelial cells.
    Established experimentally for human ESRP1 (endogenous-protein pulldown, knockdown/rescue, genome-wide
    splicing profiling).
