    reason: Direct molecular-function evidence for binding an intronic pre-mRNA element, not captured
      by any existing annotation (GO:0097157 sits under pre-mRNA binding, not under mRNA binding, so it
      is not redundant with the GO:0003729 rows). Genome-wide motif mapping places functional ESRP binding
      sites in introns flanking regulated exons.
