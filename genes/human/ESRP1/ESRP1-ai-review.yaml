- term:
    id: GO:0042669
    label: regulation of inner ear auditory receptor cell fate specification
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q3US41
  review:
    summary: ISS transfer from mouse Esrp1 (Q3US41; same PANTHER subfamily PTHR13976:SF37, a 1:1 ortholog).
      The mouse annotation reflects Esrp1-/- embryos with altered cochlear morphogenesis, hair cell differentiation
      and cell fate specification (Rohacek et al. 2017).
    action: MARK_AS_OVER_ANNOTATED
    reason: The ortholog relationship is sound, but the underlying claim is a knockout developmental phenotype
      downstream of ESRP1-dependent splicing of many transcripts (e.g. Fgfr2), not participation in auditory
      receptor cell fate specification. The direct activity is regulation of alternative splicing; inner-ear
      defects (and human DFNB109 deafness) are consequences of losing that splicing program.
    supported_by:
    - reference_id: PMID:29107558
      supporting_text: we evaluated Esrp1−/− mouse embryos and uncovered alterations in cochlear morphogenesis,
        auditory hair cell differentiation, and cell fate specification
    - reference_id: PMID:29107558
      supporting_text: Patient derived induced pluripotent stem cells (iPSCs) showed alterations in alternative
        splicing, consistent with a loss of ESRP1 function
- term:
    id: GO:0043484
    label: regulation of RNA splicing
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0023441
  - MGI:MGI:1917326
  - PANTHER:PTN000360053
  - UniProtKB:P31943
  - UniProtKB:P52597
  - UniProtKB:Q6NXG1
  - UniProtKB:Q9H6T0
  review:
    summary: IBA from PAINT node PTN000360053 (seeds include fusilli, mouse Esrp1, hnRNP H1/F, human ESRP1,
      ESRP2).
    action: MODIFY
    reason: 'Correct but general. ESRP1 directly regulates alternative mRNA splicing: it binds UGG/GU-rich
      intronic and exonic elements and enhances or silences specific exons in a position-dependent RNA
      map, across hundreds of events of all alternative-splicing types. The specific descendant regulation
      of alternative mRNA splicing, via spliceosome (GO:0000381; is_a chain to GO:0043484 verified) is
      warranted; all three rows are refined consistently.'
    proposed_replacement_terms:
    - &id009
      id: GO:0000381
      label: regulation of alternative mRNA splicing, via spliceosome
    supported_by:
    - &id010
      reference_id: PMID:19285943
      supporting_text: Two separate combinations of effective siRNAs against ESRP1 and ESRP2 caused a
        significant switch from exon IIIb to exon IIIc splicing in the endogenous FGFR2 transcript
    - *id008
    - &id011
      reference_id: PMID:20711167
      supporting_text: Mapping of this motif relative to ESRP-regulated exons revealed a trend suggestive
        of an RNA map of position-dependent ESRP binding in which binding sites in the downstream intron
        promote exon inclusion and binding within or upstream of an exon promote exon skipping
    - &id012
      reference_id: PMID:19829082
      supporting_text: The ESRP regulated events encompass all known types of alternative splicing events
    propagation_review:
      root_cause: NO_FAILURE_CORE
      failure_modes: []
      source_entities:
      - source_id: PANTHER:PTN000360053
        source_status: SUPPORTS_TRANSFER
        comment: ESRP/hnRNP H/F node whose seeds include human ESRP1 and mouse Esrp1; the general splicing-regulation
          term is appropriate at the node, and ESRP1-specific evidence warrants the alternative-splicing
          refinement.
