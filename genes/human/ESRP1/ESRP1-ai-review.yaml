  review:
    summary: IDA from Warzecha et al. 2009 (also UniProt subcellular location Nucleus, ECO:0000269 PubMed:19285943).
      Endogenous ESRP1 was recovered from KATO III nuclear extract bound to ISE/ISS-3 RNA, consistent
      with nuclear action on pre-mRNA.
    action: MODIFY
    reason: Nuclear localization is correct, and ESRP1 already carries the more specific nucleoplasm (GO:0005654,
      part_of nucleus) by IBA (PTN000360053), HPA immunofluorescence and Reactome. Nucleoplasm is where
      an intronic pre-mRNA splicing regulator acts, so refine to it. Not a REMOVE; the family-level nucleus
      assessment (PTHR13976 review, scope UNRESOLVED) is not contradicted for ESRP1.
