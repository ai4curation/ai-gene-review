- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000504
  review:
    summary: InterPro2GO (IPR000504 RRM domain) IEA for RNA binding. ESRP1 has three RRM domains and directly
