    label: pre-mRNA intronic binding
  evidence_type: IDA
  original_reference_id: PMID:19285943
  review:
    summary: ESRP1 binds the ISE/ISS-3 auxiliary cis-element in FGFR2 intron 8; binding requires GU/UG
      dinucleotides and endogenous human ESRP1 is captured by wild-type but not mutant ISE/ISS-3 RNA.
