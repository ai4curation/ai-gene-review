  - InterPro:IPR036397
  review:
    summary: InterPro-based IEA (RRM / RNA-binding domain superfamily) assigning generic nucleic acid
      binding. ESRP1 has three RRMs and binds RNA sequence-specifically.
    action: TOO_GENERAL
    reason: 'True but uninformative: ESRP1 is an RNA-binding protein whose sequence-specific binding of
      GU-rich/UGG-containing pre-mRNA elements is directly demonstrated, and the more specific sequence-specific
      mRNA binding (GO:1990825) and pre-mRNA intronic binding (GO:0097157) asserted in this review entail
      this term.'
    supported_by:
