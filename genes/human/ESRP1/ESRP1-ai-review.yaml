suggested_questions:
- question: Which RRM(s) of ESRP1 confer UGG/GU-rich motif specificity, and do the three RRMs bind cooperatively
    or recognise distinct sub-motifs?
- question: Do the reported cytoplasmic or 3-prime-end (alternative polyadenylation) activities of ESRP1
    reflect direct binding in the cytoplasm, warranting additional location and mRNA-processing annotations,
    or are they secondary to nuclear splicing changes?
- question: 'How does ESRP1 enhance versus silence exons mechanistically: which spliceosomal or auxiliary
    factors (e.g. RBFOX2, hnRNP H/F) does it recruit or antagonise at ISE/ISS-3?'
suggested_experiments:
- hypothesis: ESRP1 directly binds UGG-rich motifs downstream of exons it promotes and within/upstream
    of exons it represses in human epithelial cells.
  description: Perform eCLIP of endogenous ESRP1 in a human epithelial line (e.g. PNT2 or KATO III) combined
    with acute degron depletion and RNA-seq, then test position-dependent motif enrichment and rescue
    with RRM point mutants to separate direct from indirect splicing changes.
- hypothesis: Individual RRMs of ESRP1 have distinct contributions to RNA specificity.
  description: Express single and paired RRM constructs for in vitro RNA Bind-n-Seq and structural analysis
    with ISE/ISS-3 RNA, and test the corresponding RRM mutants for FGFR2 IIIb rescue in ESRP1/2-depleted
    cells.
