id: Q6NXG1
gene_symbol: ESRP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ESRP1 (epithelial splicing regulatory protein 1, also RBM35A) is an epithelium-specific
  RNA-binding protein with three RNA-recognition motifs that regulates alternative pre-mRNA splicing.
  It binds GU-rich/UGG-containing cis-elements in target pre-mRNAs, such as the ISE/ISS-3 element in FGFR2
  intron 8, and acts in a position-dependent manner: binding downstream of an alternative exon promotes
  its inclusion, whereas binding within or upstream promotes skipping. Together with its paralog ESRP2
  it drives an epithelial splicing program (FGFR2-IIIb, CD44, CTNND1, ENAH and hundreds of other events
  in genes for cell-cell adhesion, polarity and migration) that is lost when ESRP expression falls during
  the epithelial-to-mesenchymal transition; it has also been reported to influence alternative polyadenylation.
  ESRP1 acts in the nucleus (nucleoplasm). Loss of Esrp1 in mice causes cleft lip and palate and other
  epithelial developmental defects, and biallelic ESRP1 mutations in humans cause autosomal recessive
  sensorineural hearing loss (DFNB109) through defective splicing in cochlear development.'
