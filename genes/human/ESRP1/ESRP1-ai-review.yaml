    action: TOO_GENERAL
    reason: Correct (ESRP1 binds RNA via its RRMs; PAINT also places RNA binding at PTN000360053) but
      entailed by the more specific sequence-specific mRNA binding (GO:1990825) proposed as the replacement
      for the mRNA binding rows and by the NEW pre-mRNA intronic binding row.
    supported_by:
    - *id001
    - *id002
    - &id004
      reference_id: PMID:19285943
