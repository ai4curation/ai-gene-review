      A homozygous truncating LRGUK variant was identified in an infertile man
      with absent LRGUK protein in sperm, severe flagellar malformations,
      disorganized axonemal architecture and central-pair abnormalities. This
      human evidence licenses the sperm-specific assembly term without extending
      the claim to all motile cilia or assigning a catalytic molecular function.
