suggested_questions:
- question: >-
    Does the human LRGUK GUK-like domain bind guanine nucleotides or catalyze
    ATP-dependent GMP phosphorylation, or is its physiological role limited to
    partner recognition and scaffolding?
- question: >-
    What is the endogenous composition, stoichiometry and spatial organization of
    the human LRGUK complex with HOOK1-3, RIMBP3 and KLC3 during successive stages
    of spermiogenesis?
- question: >-
    Is human LRGUK a structural or regulatory component of the sperm axonemal
    C1b/C1f projection, and does any equivalent function operate in somatic motile
    or primary cilia?
- question: >-
    Are there functionally relevant human LRGUK transcripts or proteoforms not
    represented as curated UniProt isoforms, and do they differ from the
    mouse-Lrguk-1 mechanism?
suggested_experiments:
- description: >-
    Purify full-length human LRGUK and its isolated GUK-like domain and quantify
    GMP/GDP/ATP/ADP binding and ATP-dependent phosphotransfer or hydrolysis using
    orthogonal biochemical assays, with canonical human GUK1 and binding-defective
    LRGUK mutants as controls.
  hypothesis: >-
    The LRGUK GUK-like region is optimized for partner binding and lacks measurable
    guanylate kinase catalysis under physiological conditions.
  experiment_type: biochemical activity and nucleotide-binding assays
- description: >-
    Endogenously tag LRGUK in a human spermatogenic organoid or germ-cell model and
    combine stage-resolved super-resolution imaging, proximity labeling and
    quantitative co-immunoprecipitation to map LRGUK localization and its HOOK,
    RIMBP3, KLC3 and central-apparatus partners.
  hypothesis: >-
    Human LRGUK changes partners as it moves from the acrosome/manchette axis to the
    basal body and sperm flagellum, forming a defined sperm-specific assembly complex.
  experiment_type: endogenous spatial proteomics
- description: >-
    Generate isogenic human LRGUK-null cells or spermatogenic organoids and rescue
    them with wild-type LRGUK, the patient p.Arg355Ter allele, HOOK/RIMBP3-binding
    GUK-like-domain mutants, and KLC3-binding LRR/LRRCT mutants; quantify manchette,
    basal-body, head-shaping, flagellar and central-pair phenotypes.
  hypothesis: >-
    Partner-binding surfaces in both the GUK-like and LRR regions are independently
    required for ordered manchette transport and sperm-flagellum assembly.
  experiment_type: separation-of-function genetic rescue
- description: >-
    Compare airway multiciliated cells and primary-cilium-forming somatic cells from
    LRGUK-deficient and corrected patient-derived induced pluripotent stem cells for
    LRGUK localization, cilium assembly, ultrastructure and motility.
  hypothesis: >-
    The essential human LRGUK requirement is sperm-biased and does not generalize to
    all somatic cilia despite comparative ciliate evidence.
  experiment_type: patient-derived ciliary phenotyping
knowledge_gaps:
- gap_statement: >-
    The biochemical activity of the human LRGUK GUK-like domain is unresolved:
    partner binding is demonstrated in mouse LRGUK1, but nucleotide binding,
    phosphotransfer and ATPase activity have not been established, so neither a
    guanylate kinase nor a definitive pseudokinase assignment is justified.
  boundary: >-
    The 825-aa human protein contains a predicted GUK-like domain, and mouse
    experiments show that this region is required for HOOK2 and RIMBP3 binding.
    The current evidence therefore supports a scaffold interface without excluding
    an additional catalytic function.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Resolving catalytic status is necessary to prevent family-name and domain-based
    transfer of guanylate kinase activity and to define the correct molecular
    function of LRGUK.
  resolution: >-
    Directly measure nucleotide binding and catalysis with purified human LRGUK and
    separation-of-function mutants, then determine whether catalytic activity is
    required for cellular rescue independently of HOOK/RIMBP3 binding.
  provenance:
  - reference_id: PMID:28003339
    supporting_text: |-
      In the present study, we showed that the GUK-like domain is
      essential for binding to HOOK2 and RIMBP3, and the LRR domain is essential for
      binding to KLC3.
    reference_section_type: ABSTRACT
- gap_statement: >-
    The endogenous human LRGUK interaction complex and the causal contribution of
    each partner to sperm assembly remain unresolved; the direct human HOOK2
    observation is a binary-interactome result, whereas the broader
    HOOK1-3/RIMBP3/KLC3 complex is established in mouse Lrguk-1 experiments.
  boundary: >-
    Human genetics establishes LRGUK-dependent sperm morphogenesis, and mouse
    evidence establishes domain-specific partner interactions. Neither source
    defines an endogenous, stage-resolved human spermatid complex.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Identifying the physiological human complex is required to distinguish a cargo,
    adaptor, structural-scaffold or regulatory role and to interpret partner-binding
    variants mechanistically.
  resolution: >-
    Perform endogenous stage-specific interaction proteomics and imaging in human
    spermatids, followed by partner-specific knockout and interaction-defective
    rescue experiments.
  provenance:
  - reference_id: PMID:32296183
    supporting_text: >-
      While HuRI displays highly significant overlap with known functional relationships,
      the cellular function of most individual PPIs remains to be elucidated.
    reference_section_type: DISCUSSION
- gap_statement: >-
    The precise placement and molecular role of LRGUK within the mammalian sperm
    C1b/C1f central-apparatus region, and any role in non-sperm cilia, remain
    unresolved despite patient sperm abnormalities and ciliate comparative evidence.
  boundary: >-
    Human loss of LRGUK is associated with central-pair defects and altered
    central-apparatus proteins. Tetrahymena Cfap246 is a likely C1b/C1f component,
    but it is a shorter partial ortholog that lacks the mammalian C-terminal
    GUK-like domain.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    This distinction controls whether sperm-specific central-apparatus annotations
    can be made and whether any ciliary role may be propagated to somatic contexts.
  resolution: >-
    Localize endogenous LRGUK within human sperm by super-resolution microscopy or
    cryo-electron tomography, test C1b/C1f assembly after LRGUK loss and rescue, and
    independently assay somatic motile and primary cilia.
  provenance:
  - reference_id: PMID:34083607
    supporting_text: >-
      It remains to be determined if LRGUK is indeed a C1b/C1f component in mammals.
    reference_section_type: DISCUSSION
