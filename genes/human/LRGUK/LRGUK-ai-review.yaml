- id: PMID:25781171
  title: LRGUK-1 is required for basal body and manchette function during spermatogenesis
    and male fertility.
  findings:
  - statement: >-
      Mouse LRGUK-1 is required for acrosome attachment, sperm-head shaping,
      basal-body attachment, axoneme initiation and manchette organization.
    supporting_text: |-
      that leucine-rich repeats and guanylate kinase-domain containing isoform 1
      (LRGUK-1) is required for multiple aspects of sperm assembly, including acrosome
      attachment, sperm head shaping and the initiation of the axoneme growth to form
      the core of the sperm tail. Specifically, LRGUK-1 is required for basal body
      attachment to the plasma membrane, the appropriate formation of the sub-distal
      appendages, the extension of axoneme microtubules and for microtubule movement
      and organisation within the manchette.
    reference_section_type: ABSTRACT
  - statement: >-
      During mouse spermiogenesis, LRGUK localizes sequentially along the
      acrosome-acroplaxome-manchette axis and is also detected at the sperm basal
      body and tail.
    supporting_text: >-
      As maturation proceeded and nuclear elongation initiated, LRGUK moved distally
      to ultimately reside on the microtubules of the manchette (Fig. 3D and S2 Fig.).
      LRGUK was also evident in the sperm basal body and the sperm tail (Fig. 3E).
    reference_section_type: RESULTS
  - statement: >-
      Full-length mouse LRGUK-1 binds HOOK2 in yeast two-hybrid and heterologous
      co-immunoprecipitation assays, whereas the R528Stop allele abolishes the
      yeast two-hybrid interaction.
    supporting_text: >-
      Specific transfection of the full length HOOK2 with LRGUK-1 in a separate
      yeast two hybid assay confirmed this interaction and the introduction of the
      R528Stop mutation into the Lrguk-1 sequence completely abolished binding to
      HOOK2 (Fig. 6A). An interaction between LRGUK-1 and endogenous HOOK2 was confirmed
      by co-immunoprecipitation, wherein full-length mouse Lrguk-1-GFP was transfected
      into HEK293T cells then the complex co-precipitated (Fig. 6B).
    reference_section_type: RESULTS
  - statement: >-
      The mouse Kaos mutation selectively disrupts the longest of three predicted
      Lrguk splice variants, so its phenotypes establish an LRGUK-1 requirement
      rather than equivalence among all isoforms.
    supporting_text: >-
      Lrguk is predicted to encode 3 splice variants, Lrguk transcript 1 (Lrguk-1),
      -2 (Lrguk-2) and -3 (Lrguk-3). Lrguk-1 is the longest transcript and the only
      isoform affected by the mutation (Fig. 1A).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct mouse genetic, localization and interaction evidence establishes
      Lrguk-1 function in spermiogenesis. Transfer to human is strongly supported
      for conserved sperm assembly but remains species- and isoform-bounded.
- id: PMID:28003339
  title: LRGUK1 is part of a multiprotein complex required for manchette function and
    male fertility.
  findings:
  - statement: >-
      Mouse LRGUK1 associates with HOOK1-3, RIMBP3 and KLC3, proteins linked to
      cargo-adaptor transport and the spermatid manchette.
    supporting_text: |-
      The data indicate that LRGUK1
      likely achieves its function in partnership with members of the HOOK family of
      proteins (HOOK-1-3), Rab3-interacting molecule binding protein (RIMBP)-3 and
      kinesin light chain (KLC)-3, all of which are associated with intracellular
      protein transport as cargo adaptor proteins and are localized to the manchette.
    reference_section_type: ABSTRACT
  - statement: >-
      The LRGUK1 GUK-like domain is required for HOOK2 and RIMBP3 binding, while
      the LRR domain is required for KLC3 binding.
    supporting_text: |-
      In the present study, we showed that the GUK-like domain is
      essential for binding to HOOK2 and RIMBP3, and the LRR domain is essential for
      binding to KLC3.
    reference_section_type: ABSTRACT
  - statement: >-
      These interaction-domain results support a scaffold role in a
      manchette-associated complex while leaving guanylate kinase catalytic
      status unresolved.
    supporting_text: |-
      These findings establish LRGUK1 as a key component of a
      multiprotein complex with an essential role in microtubule dynamics within
      haploid male germ cells.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The cached abstract directly supports interaction partners and domain
      requirements. Because full text is unavailable locally, assay detail beyond
      the abstract is not inferred; no catalytic guanylate-kinase activity was tested.
- id: PMID:34083607
  title: Composition and function of the C1b/C1f region in the ciliary central apparatus.
  findings:
  - statement: >-
      Tetrahymena Cfap246 is homologous only to the N-terminal portion of human
      LRGUK and lacks the mammalian C-terminal guanylate kinase-like domain.
    supporting_text: >-
      In contrast to the much larger human ortholog (94 kDa), Tetrahymena Cfap246
      protein lacks the guanylate kinase domain within its C-terminal region (Fig. S1).
    reference_section_type: RESULTS
  - statement: >-
      Proximity labeling and immunoprecipitation place Tetrahymena Cfap246 near
      Spef2A and support its assignment as a likely C1b/C1f subunit.
    supporting_text: >-
      We conclude that Cfap69, Cfap246, Adgb, Cfap174, and Tt170 are positioned
      near Spef2A, and thus, most likely are subunits of the C1b/C1f projections.
    reference_section_type: RESULTS
  - statement: >-
      Cfap246 knockdown causes only modest ciliary-motility changes in the
      Tetrahymena model.
    supporting_text: >-
      only minor alterations in ciliary motility.
    reference_section_type: ABSTRACT
  - statement: >-
      The paper explicitly leaves mammalian LRGUK membership in C1b/C1f unresolved.
    supporting_text: >-
      It remains to be determined if LRGUK is indeed a C1b/C1f component in mammals.
    reference_section_type: DISCUSSION
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      This is direct ciliate evidence for a partial Cfap246 ortholog, not direct
      human or mouse LRGUK evidence. The missing C-terminal GUK-like region and the
      authors' explicit mammalian caveat sharply limit cross-species transfer.
- id: PMID:42493466
  title: Biallelic Truncating Variant in LRGUK Is Associated With Severe Multiple Morphological
    Abnormalities of the Sperm Flagella and Sperm Nuclear Defects in Humans.
  findings:
  - statement: >-
      A homozygous human LRGUK p.Arg355Ter variant in an infertile man is predicted
      to remove the C-terminal guanylate kinase-like domain.
    supporting_text: |-
      Here, we identify a homozygous truncating
      variant in LRGUK (c.1063C>T; p.Arg355Ter) in an infertile man presenting with a
      typical MMAF phenotype. The variant, identified by whole-exome sequencing in a
      cohort of 168 MMAF patients and confirmed by Sanger sequencing, is predicted to
      result in loss of the C-terminal guanylate kinase-like domain.
    reference_section_type: ABSTRACT
  - statement: >-
      Patient sperm lacked detectable LRGUK and showed impaired motility, complete
      teratozoospermia, and severe sperm-head and flagellar defects.
    supporting_text: |-
      Immunofluorescence showed absence of LRGUK protein in patient spermatozoa,
      supporting a loss-of-function effect. Semen analysis revealed impaired motility
      and complete teratozoospermia. Morphological and ultrastructural analyzes
      demonstrated severe defects affecting both sperm head and flagellum, including
      disorganized axonemal architecture and central pair abnormalities.
    reference_section_type: ABSTRACT
  - statement: >-
      Altered central-apparatus proteins in the patient's sperm support a human
      role in C1b organization, although the evidence comes from a single affected
      individual and an abstract-only report.
    supporting_text: |-
      Immunostaining further indicated alterations of
      central apparatus-associated proteins, supporting a role for LRGUK in C1b
      projection organization.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      This is the decisive direct human loss-of-function report. The abstract
      supports the variant, absent protein and sperm phenotypes, but the single-case
      design and lack of cached full text limit mechanistic and isoform resolution.
core_functions:
- description: >-
    LRGUK engages cytoskeletal transport-associated partners to organize the
    spermatid acrosome-manchette-basal-body axis and support sperm-head shaping
    and sperm-flagellum axoneme assembly. Human binary-screen evidence identifies
    HOOK2 isoform 2 as a partner, while mouse Lrguk-1 experiments establish
    HOOK-family, RIMBP3 and KLC3 interactions and link loss of Lrguk-1 to defective
    manchette organization, basal-body attachment and axoneme extension. The
    GUK-like region mediates HOOK2/RIMBP3 binding and the LRR region mediates KLC3
    binding; these data support a cytoskeletal-partner/scaffold activity but not
    direct microtubule binding, molecular-adaptor activity, or guanylate kinase
    catalysis.
  molecular_function:
    id: GO:0008092
    label: cytoskeletal protein binding
  directly_involved_in:
