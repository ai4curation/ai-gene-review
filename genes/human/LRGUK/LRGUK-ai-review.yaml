id: Q96M69
gene_symbol: LRGUK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  LRGUK is an intracellular 825-amino-acid protein that contains nine leucine-rich
  repeats, an LRR C-terminal domain and a guanylate kinase-like domain. It supports
  spermatid morphogenesis and sperm-flagellum assembly along the
  acrosome-acroplaxome-manchette-basal-body axis. A biallelic truncating human
  variant that removes the C-terminal region is associated with absent LRGUK in
  sperm, severe multiple morphological abnormalities of the sperm flagella,
  axonemal central-pair disruption, sperm-head defects and male infertility. Mouse
  Lrguk-1 binds HOOK-family cytoskeletal transport proteins, RIMBP3 and KLC3; its
  GUK-like and LRR regions mediate different partner interactions, consistent with
  a scaffold role in manchette microtubule organization and early axoneme growth.
  No guanylate kinase catalytic activity has been demonstrated, and neither a
  catalytic-enzyme nor a definitive pseudokinase assignment is warranted. No
  functionally distinct human isoforms have been established; mouse Lrguk-1 and
  the shorter Tetrahymena Cfap246 ortholog therefore provide bounded comparative
  evidence rather than interchangeable models of every human protein form or
  ciliary context.
