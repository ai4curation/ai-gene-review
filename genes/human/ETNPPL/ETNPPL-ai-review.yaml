- term:
    id: GO:0046434
    label: organophosphate catabolic process
  evidence_type: IDA
  original_reference_id: PMID:22241472
  review:
    summary: ETNPPL itself catalyses the breakdown of the organophosphate
      O-phosphoethanolamine; no biological process annotation currently exists.
    action: NEW
    reason: >-
      Participation test: ETNPPL is the enzyme that performs the catabolic step
      (irreversible elimination of phosphate and ammonia from
      phosphoethanolamine), not a substrate or a required factor. The cellular
      relevance of this catabolism is supported by mouse Etnppl knockout
      hepatocytes, which convert more ethanolamine to phosphoethanolamine and
      phosphatidylethanolamine, and by ETNPPL overexpression in Huh7 cells,
      which reduces cellular phosphoethanolamine. GO has no
      phosphoethanolamine-specific catabolic term (OLS search returned only
      ceramide phosphoethanolamine catabolic process), so the nearest accurate
      parent, organophosphate catabolic process, is used and a specific term is
      proposed. The lipid and lipoprotein phenotypes of knockout mice are
      downstream consequences and are not annotated.
    supported_by:
