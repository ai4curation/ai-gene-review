gene_symbol: ETNPPL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ETNPPL (formerly AGXT2L1) encodes ethanolamine-phosphate phospho-lyase, a
  pyridoxal 5'-phosphate (PLP)-dependent enzyme of the class-III aminotransferase
  fold that irreversibly degrades O-phosphoethanolamine to acetaldehyde, ammonia
  and inorganic phosphate. Although it evolved from transaminases, the purified
  human enzyme has no significant aminotransferase activity and is highly selective
  for phosphoethanolamine, with an active site tuned to bind dianionic groups; its
  crystal structure (PDB 6TOR) shows the class-III fold with bound pyridoxamine
  phosphate. Because phosphoethanolamine is the precursor of
  phosphatidylethanolamine in the CDP-ethanolamine (Kennedy) pathway, ETNPPL
  removes substrate from phospholipid synthesis; loss of the mouse enzyme increases
  conversion of ethanolamine to phosphoethanolamine and phosphatidylethanolamine in
  hepatocytes, and overexpression in hepatoma cells lowers both. ETNPPL is
  expressed mainly in brain, where it is an astrocyte-selective, fasting- and
  glucocorticoid-induced gene, and in liver. Antibody staining in human and mouse
  brain places the protein in the nucleus and cytoplasm; a mitochondrial location
  has been inferred but not shown experimentally. Altered ETNPPL expression has
  been reported in neuropsychiatric disorders, gliomas and liver disease.
