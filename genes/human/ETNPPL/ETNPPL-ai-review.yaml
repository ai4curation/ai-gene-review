core_functions:
- description: Pyridoxal 5'-phosphate-dependent ammoniophospholyase that
    irreversibly degrades O-phosphoethanolamine to acetaldehyde, ammonia and
    inorganic phosphate, removing the precursor of phosphatidylethanolamine
    synthesis by the CDP-ethanolamine pathway. Activity, specificity, cofactor and
    structure are established experimentally for the human protein; the absence
    of transaminase activity is also experimentally established.
  molecular_function:
    id: GO:0050459
    label: ethanolamine-phosphate phospho-lyase activity
  directly_involved_in:
  - id: GO:0046434
    label: organophosphate catabolic process
  supported_by:
  - reference_id: PMID:22241472
    supporting_text: AGXT2L1 catalyzed a similar reaction on phosphoethanolamine, converting it to ammonia, inorganic phosphate, and acetaldehyde.
  - reference_id: PMID:23761375
    supporting_text: is at least 500-fold more active as a lyase than as an aminotransferase
  - reference_id: PMID:39312446
    supporting_text: Primary hepatocytes isolated from Etnppl-/- mice showed increased conversion of [3H]ethanolamine to [3H]p-ETN and [3H]PE compared to Etnppl+/+ mice.
proposed_new_terms:
- proposed_name: phosphoethanolamine catabolic process
  proposed_definition: The chemical reactions and pathways resulting in the
    breakdown of O-phosphoethanolamine (ethanolamine phosphate).
  justification: ETNPPL catalyses the only known dedicated step of
    phosphoethanolamine breakdown in animals; GO currently offers only the broad
    parent organophosphate catabolic process or ceramide phosphoethanolamine
    catabolic process, which is a different substrate.
suggested_questions:
- question: Where in the cell does ETNPPL act? Antibody staining finds it mainly in
    the nucleus and cytoplasm, while databases infer a mitochondrial matrix location.
    Is there a mitochondrial pool, and does the nuclear pool have catalytic activity?
- question: Is the phosphoethanolamine phospho-lyase activity conserved in the
    invertebrate PTHR45688:SF13 relatives such as Drosophila CG8745, which branch outside
    the vertebrate ETNPPL (SF1) and PHYKPL (SF6) subfamilies, or do those proteins act on
    a different phosphorylated amine?
- question: What is the physiological purpose of irreversibly diverting
    phosphoethanolamine from phospholipid synthesis in fasting astrocytes?
suggested_experiments:
- experiment_type: Subcellular fractionation and imaging
  description: Fractionate astrocytes or hepatocytes expressing endogenous ETNPPL into
    nuclear, cytosolic and mitochondrial (with protease protection) fractions and
    co-stain with organelle markers, using knockout cells as negative controls.
  hypothesis: ETNPPL is predominantly nucleocytoplasmic rather than mitochondrial.
- experiment_type: Enzyme assay of homologues
  description: Express Drosophila CG8745 and other SF13 members and assay against
    phosphoethanolamine, 5-phosphohydroxy-L-lysine and related phosphorylated amines,
    with human ETNPPL and PHYKPL as positive controls.
  hypothesis: The substrate preference of SF13 members differs from or overlaps with
    vertebrate ETNPPL, indicating whether activity can be transferred across subfamilies.
