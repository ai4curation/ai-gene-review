  evidence_type: IPI
  original_reference_id: PMID:16189514
  qualifier: enables
  review:
    summary: >-
      Interaction with EAPP (UniProtKB:Q56P03) from an early proteome-scale two-hybrid map.
      EAPP is best known as the E2F-associated phosphoprotein, but it is NOT unconnected to
      this gene's biology: PMID:34131137 - the same paper that establishes TSSC4 as a U5
      chaperone - describes EAPP as "a putative chaperone EAPP that has been shown to interact
      with U5 proteins PRPF8 and EFTUD2". So the AAR2-EAPP interaction is at least
      compartmentally and functionally plausible, and it should not be dismissed as a
      cross-pathway artefact.

      It is nonetheless marked over-annotated, on narrower grounds: EAPP's own U5 role is
      explicitly "putative", the AAR2-EAPP pair specifically has never been followed up in any
      focused study, and bare "protein binding" conveys nothing about AAR2's activity
      regardless of whether the partner is real. This is a weaker verdict than "wrong partner"
      - if EAPP's U5 chaperone role is confirmed, these annotations would deserve upgrading to
      an informative term rather than discounting.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Uninformative term for a pair that has never been characterised. Not dismissed as
      cross-pathway: EAPP is a putative U5 chaperone, so this may be real and merely
      under-annotated.
    supported_by:
