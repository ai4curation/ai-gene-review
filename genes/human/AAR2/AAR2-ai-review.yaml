core_functions:
- description: >-
    U5 snRNP assembly factor acting as a placeholder and conformational checkpoint. AAR2 binds
    the RNase H-like domain of PRPF8 in the precursor U5 snRNP, occupying the surface that the
    SNRNP200/Brr2 helicase must ultimately engage and blocking U4/U6 di-snRNA loading, so that
    premature spliceosome activation cannot occur; AAR2 is absent from the tri-snRNP and the
    assembled spliceosome. The exchange step is species-qualified: in yeast, Aar2p and Brr2p
    are mutually exclusive Prp8 binders and Aar2p is displaced by Brr2p, whereas human AAR2
    co-purifies with all four RNA-free heterotetrameric complex members, suggesting it remains
    bound until that complex is complete. In the human complex AAR2 additionally locks the
    PRPF8 RNase H domain in a conformation compatible only with the first transesterification
    step, indicating a regulatory role beyond steric placeholding. On the reading used here,
    GO:0045292 mRNA cis splicing is retained in directly_involved_in as the process this
    assembly factor is required for, in the same sense as the GO:0045292 IBA row above: AAR2
    contributes by producing a catalytically competent U5 snRNP, not by acting in the splicing
    reaction, from which it is excluded. Both statements describe the same indirect
    contribution.
