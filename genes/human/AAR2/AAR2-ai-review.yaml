gene_symbol: AAR2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AAR2 (C20orf4) is the human ortholog of yeast Aar2p and functions as an assembly
  factor for the U5 small nuclear ribonucleoprotein particle, controlling the timing
  of spliceosome maturation. It is a component of a cytoplasmic precursor U5 snRNP
  containing PRPF8, EFTUD2/Snu114, U5 snRNA and the Sm proteins, but is excluded
  from the mature tri-snRNP and from the assembled spliceosome. AAR2 binds the
  RNase H-like domain of PRPF8 and acts as a placeholder and checkpoint: it occupies
  the surface that the SNRNP200/Brr2 helicase must ultimately engage and blocks
  loading of U4/U6 di-snRNA, so premature spliceosome activation is prevented. In
  yeast, where the mechanism was solved structurally, Aar2p and Brr2p are mutually
  exclusive binders of Prp8 and Aar2p is exchanged for Brr2p to yield the mature
  particle, with the handoff governed by phosphorylation. The human protein appears
  to differ in an important respect: human AAR2 co-purifies with all four members of
  the RNA-free heterotetrameric complex, which suggests it stays associated until
  that complex is fully formed rather than being displaced at the SNRNP200 step, and
  the human AAR2-PRPF8 interaction itself is structurally distinct from the yeast
  one. Structural work on the human complex also indicates a role beyond simple
  steric placeholding, since AAR2 locks the PRPF8 RNase H domain in a conformation
  compatible only with the first transesterification step of splicing and blocks the
  switch to the step-2 conformation.
