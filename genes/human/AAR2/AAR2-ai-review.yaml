- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:34131137
  qualifier: enables
  review:
    summary: >-
      This one is different from the other three protein-binding annotations and should not be
      dismissed with them. The partner is TSSC4 (UniProtKB:Q9Y5U2), and the source is not a
      screen but a dedicated functional study establishing TSSC4 as a U5 snRNP component and
      chaperone that promotes tri-snRNP formation, interacting with the U5-specific proteins
      PRPF8, EFTUD2 and SNRNP200. AAR2 and TSSC4 are therefore both U5 snRNP assembly
      chaperones acting on the same particle with overlapping partners, so the interaction is
      what the biology predicts rather than an unexplained hit.

      On the replacement term, one caveat is recorded rather than glossed. GO:0044877
      protein-containing complex binding normally expects a complex in the WITH/FROM field,
      whereas this row's WITH/FROM is a single protein accession, and the AAR2-specific datum
      in the source is IP-MS co-purification with the paper explicitly declining to establish
      direct contacts. The term is chosen because the interaction demonstrably occurs in the
      context of the U5 particle rather than as an isolated pair - which is exactly what
      co-purification shows and what a bare pairwise term misses - but a curator may reasonably
      prefer to leave the row as GO:0005515 until a direct AAR2-TSSC4 contact is demonstrated.
      Flagged in suggested_questions.
    action: MODIFY
    reason: >-
      A real, mechanistically expected interaction recorded under an uninformative term.
      GO:0044877 is used because TSSC4 is engaged in the context of the U5 snRNP particle,
      which is what the co-purification evidence supports; a term for snRNP assembly-factor
      binding would be better still.
