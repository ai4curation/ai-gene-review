suggested_questions:
- question: >-
    Should the three NAS annotations from PMID:36322420 be upgraded? That paper is a
    structure-function study of the human AAR2-PRPF8 RNase H complex, with a crystal structure,
    designed interface variants that fail to bind PRPF8 in vitro, and size-exclusion
    interaction mapping. Its results support GO:0000387, GO:0005682 and GO:0048025 directly, so
    IDA or IPI would reflect the evidence better than a non-traceable author statement.
- question: >-
    Does AAR2 have a molecular function term it should carry? Its activity is well defined -
    binding the PRPF8 RNase H domain so as to exclude SNRNP200 and block di-snRNA loading - yet
    GOA records only bare protein binding. This is the same gap seen for AAGAB in this
    campaign: assembly chaperones and placeholder factors have no molecular-function vocabulary
    in GO beyond binding terms.
- question: >-
    Is the AAR2-TSSC4 interaction direct? The evidence is IP-MS co-purification within U5
    particles and the source paper explicitly declines to establish direct contacts, describing
    "multiple weak contacts". That distinction determines whether GO:0044877
    protein-containing complex binding is the right replacement term for that row, or whether
    it should stay as bare protein binding pending a demonstrated direct contact.
- question: >-
    Does human AAR2 leave the particle at the same step as yeast Aar2p? In yeast, Aar2p is
    exchanged for Brr2p, but human AAR2 co-purifies with all four members of the RNA-free
    heterotetrameric complex, indicating it stays bound until that complex is complete. The
    human AAR2-PRPF8 structure also differs from the yeast one. Resolving this determines
    whether the SNRNP200-displacement model transfers to human at all.
- question: >-
    Which kinases actually control the AAR2-PRPF8 handoff in human cells? CK2alpha1 and SGK2
    have been proposed as candidates that abrogate the interaction, and the yeast S253E
    phospho-mimetic lowers Aar2p affinity for Prp8. Establishing the physiological kinase and
    site would allow a specific phosphorylation-dependent regulatory annotation.
- question: >-
    Is EAPP's putative U5 chaperone role real, and is the AAR2-EAPP interaction an
    assembly-context contact? PMID:34131137 describes EAPP as "a putative chaperone EAPP that
    has been shown to interact with U5 proteins PRPF8 and EFTUD2", which places it in the same
    pathway as AAR2 rather than only in the E2F pathway it is better known for. The AAR2-EAPP
    pair is reproducible across three screens including an orthogonal AP-MS method, but has
    never been followed up directly, and EAPP's U5 role is still labelled putative. Confirming
    it would turn three uninformative protein-binding rows into an assembly-context annotation.
- question: >-
    How do AAR2 and TSSC4 divide labour? Both are U5 snRNP assembly chaperones binding
    overlapping sets of U5 proteins, and they interact with each other, but whether they act
    sequentially, competitively or as a complex during de novo biogenesis versus post-splicing
    recycling is unresolved.
suggested_experiments:
- hypothesis: >-
    AAR2 enforces the order of U5 snRNP maturation, so bypassing it produces prematurely
    activated particles rather than simply fewer particles.
  description: >-
    Deplete AAR2 in human cells and characterise the resulting U5 particles by gradient
    fractionation and mass spectrometry, asking specifically whether SNRNP200 loads onto PRPF8
    early and whether U4/U6 di-snRNA associates prematurely, rather than only quantifying
    tri-snRNP yield.
  experiment_type: cell biology and proteomics
- hypothesis: >-
    The AAR2-PRPF8 handoff is triggered by phosphorylation at a defined site by a specific
    kinase.
  description: >-
    Map AAR2 phosphosites by mass spectrometry in human cells, test the candidate kinases
    CK2alpha1 and SGK2 by targeted inhibition and knockdown, and assay phospho-mimetic and
    phospho-dead AAR2 variants for PRPF8 binding and for the ability to support tri-snRNP
    formation.
  experiment_type: phosphoproteomics and biochemistry
- hypothesis: >-
    AAR2 and TSSC4 act at distinct steps of U5 snRNP biogenesis rather than redundantly.
  description: >-
    Determine whether AAR2 and TSSC4 occupy the same particle simultaneously or sequentially,
    using sequential immunoprecipitation and cryo-EM of isolated precursor particles, and test
    whether depletion of one is compensated by the other in de novo biogenesis versus
    post-splicing recycling.
  experiment_type: structural and cell biology
- hypothesis: >-
    The human-specific conformational lock on the PRPF8 RNase H domain is functionally
    important, not a crystallisation artefact.
  description: >-
    Use the designed AAR2 interface variants that fail to bind PRPF8, plus variants that bind
    but do not impose the step-1 conformation, to test in cells whether the conformational lock
    is required for splicing fidelity as opposed to merely for particle assembly.
  experiment_type: structure-function
