    label: autophagosome assembly
  evidence_type: IDA
  original_reference_id: PMID:28890335
  qualifier: involved_in
  review:
    summary: >-
      Autophagosome assembly, WIPI2's core biological process.
    action: ACCEPT
    reason: >-
      WIPI2 is required for the formation of LC3-positive autophagosomes: it binds PtdIns3P
