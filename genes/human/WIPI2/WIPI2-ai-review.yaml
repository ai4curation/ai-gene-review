- term:
    id: GO:0080025
    label: phosphatidylinositol-3,5-bisphosphate binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Phosphatidylinositol-3,5-bisphosphate binding, a second PROPPIN ligand that is not
      the autophagy-relevant one.
    action: KEEP_AS_NON_CORE
    reason: PtdIns(3,5)P2 binding is a supported secondary lipid-binding activity of
      WIPI2/PROPPIN proteins. PI3P is the ligand established for recruitment of WIPI2 during
      canonical autophagosome formation; the physiological contexts that specifically use the
      other ligand are less well resolved.
