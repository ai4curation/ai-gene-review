- term:
    id: GO:0000421
    label: autophagosome membrane
  evidence_type: IDA
  original_reference_id: PMID:31006538
  qualifier: located_in
  review:
    summary: >-
      Autophagosome membrane. Defensible only in the phagophore sense, and in tension with
      the NOT autophagosome annotation on this same gene.
    action: KEEP_AS_NON_CORE
    reason: >-
      WIPI2 marks the growing phagophore and leaves before the autophagosome matures, which
      is exactly what the NOT|colocalizes_with GO:0005776 annotation from PMID:20505359
      records. Reading GO:0000421 as the phagophore membrane makes the two consistent;
      reading it as the membrane of a completed autophagosome makes them contradictory.
      Retained as non-core rather than removed, because the source full text is not
      available here and the curator may have used the term in the phagophore sense that
      GO's autophagy branch has long conflated. This ambiguity is the same one that
      motivates the proposed phagophore membrane term below.
