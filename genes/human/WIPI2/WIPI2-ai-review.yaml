existing_annotations:
- term:
    id: GO:0034045
    label: phagophore assembly site membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  review:
    summary: >-
      Phagophore assembly site membrane. Seven assertions on this one gene, all of which
      describe WIPI2 on the omegasome-anchored phagophore rather than on a membrane bounding
      the assembly site.
    action: MODIFY
    reason: >-
      GO:0034045 asserts via bounding_layer_of that a membrane bounds the phagophore
      assembly site. The PAS is a liquid-like protein condensate with no bounding bilayer,
      and the term carries phagophore and isolation membrane as related synonyms of the
      distinct term GO:0061908 - see GO issue #29437 and
      projects/CONDENSATES/GO_0034045-annotation-audit.md. WIPI2 accumulates seven
      assertions here from four different evidence routes (EXP x4, IDA, IBA, and an IEA
      carrying UniProtKB-SubCell:SL-0221), which makes it one of the heaviest single-gene
      loads on the term and a good illustration of how the ambiguity compounds. The
      underlying observation is consistent across all of them: WIPI2 is a peripheral protein
      on the cytoplasmic face of the omegasome-anchored phagophore. Moved to GO:0061908, the
      existing term those synonyms belong to. The precise destination is the phagophore
      membrane, proposed under proposed_new_terms, since WIPI2's membrane association is the
      point of the annotation and GO:0061908 is a structure rather than a membrane term.
    proposed_replacement_terms:
    - id: GO:0061908
      label: phagophore
    supported_by:
    - reference_id: PMID:20505359
      supporting_text: Mammalian Atg18 (WIPI2) localizes to omegasome-anchored phagophores and  positively regulates LC3 lipidation.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      - CIRCULAR_PROPAGATION
      source_entities:
      - source_id: MGI:MGI:1923831
        source_label: Wipi2 (mouse)
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Direct one-to-one ortholog; the localization itself transfers cleanly. The problem
          is the destination term, not the inference.
      - source_id: UniProtKB:Q9Y4P8
        source_label: WIPI2 (the annotation target itself)
        source_status: CIRCULAR_OR_REDUNDANT
        comment: >-
          The target is listed among its own WITH/FROM sources, so it contributes no
          independent support. The same self-reference appears on the STBD1 GO:0016020 IBA.
      - source_id: SGD:S000001917
        source_label: ATG18 (Saccharomyces cerevisiae)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          This is where the two senses of GO:0034045 come apart. In yeast the PAS is a
          discrete perivacuolar condensate and Atg18 is genuinely at it; in mammals there is
          no equivalent focus and the annotation is really about the omegasome-anchored
          phagophore. One term is carrying both readings.
      - source_id: PANTHER:PTN000132136
        source_label: PROPPIN/WIPI family node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The node correctly groups PROPPINs, all of which act at autophagic membranes.
- term:
    id: GO:0032266
    label: phosphatidylinositol-3-phosphate binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Phosphatidylinositol-3-phosphate binding, the ligand-recognition half of the adaptor.
    action: ACCEPT
    reason: >-
      WIPI2 is a seven-bladed PROPPIN beta-propeller with two PtdIns3P sites built around
      the conserved FRRG motif, and it is a bona fide mammalian PtdIns3P effector. This
      binding is what localizes it to omegasome and phagophore membranes. Supported by two
      IDA experiments as well as by IBA across the family. Core.
    supported_by:
    - reference_id: PMID:20505359
      supporting_text: We show that WIPI2 is a mammalian effector of PtdIns3P and is ubiquitously  expressed in a variety of cell lines.
    - reference_id: PMID:24954904
      supporting_text: All known members have two PtdIns(3)P binding sites formed around a conserved FRRG motif and a hydrophobic loop that is predicted to insert into the membrane
- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Autophagy of mitochondrion, a selective-autophagy subtype that follows from the core
      role.
    action: KEEP_AS_NON_CORE
    reason: >-
      Mitophagy in mammalian cells uses the same PtdIns3P-to-ATG16L1 relay that WIPI2
      provides for bulk autophagy, so the claim is biologically defensible, but it is a
      consequence of the core adaptor function rather than a dedicated mitochondrial
      activity. Non-core.
- term:
    id: GO:0000425
    label: pexophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Pexophagy, propagated from yeast PROPPINs with no mammalian WIPI2 evidence.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Pexophagy is defined and dissected in yeasts, where the PROPPIN family members have
      distinct and partly non-overlapping roles. The IBA transfers a specific
      cargo-selectivity claim to human WIPI2 on the strength of family membership alone. Not
      false in principle - a core autophagy adaptor is likely needed for any selective
      variant - but the term asserts more than was tested. This is the same pattern as the
      yeast-specific process terms flagged on ATG9A.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      - ROLE_CONFLATION
      source_entities:
      - source_id: SGD:S000001917
        source_label: ATG18 (Saccharomyces cerevisiae)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Yeast Atg18 is required for pexophagy, but the yeast PROPPINs divide the selective
          pathways among themselves, so family membership alone does not say which mammalian
          member inherits which pathway.
      - source_id: PANTHER:PTN000132136
        source_label: PROPPIN/WIPI family node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Propagating a cargo-specific process across the whole node converts a general
          requirement for autophagy machinery into a specific selectivity claim.
- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Protein-macromolecule adaptor activity. This is WIPI2's defining molecular function:
      it couples a lipid signal to a protein complex.
    action: ACCEPT
    reason: >-
      WIPI2 has no catalytic activity. What it does is read PtdIns3P through its
      FRRG-centred binding sites and, from that membrane vantage point, bind ATG16L1 and so
      deliver the ATG12-ATG5-ATG16L1 conjugation machinery to the phagophore. The two halves
      are separable: an FRRG-to-FTTG mutant that cannot bind PtdIns3P still binds ATG16L1,
      showing the lipid-reading and the cargo-holding are distinct surfaces of one adaptor.
      Core.
    supported_by:
    - reference_id: PMID:24954904
      supporting_text: Inhibition of PtdIns(3)P binding through mutation of the PtdIns(3)P binding motif FRRG to FTTG (GFP-WIPI2b FTTG) had no significant effect on the ability of WIPI2b to bind Atg16L1
- term:
    id: GO:0044804
    label: nucleophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Nucleophagy, a process characterised in budding yeast, propagated by IBA.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Nucleophagy as annotated here descends from piecemeal microautophagy of the nucleus,
      which proceeds at the yeast nucleus-vacuole junction formed by Nvj1 and Vac8. Humans
      have no vacuole and no characterised NVJ equivalent, so the process term does not
      transfer even though the PROPPIN orthology is sound. Over-annotated rather than
      removed, since the machinery is genuinely shared. Same call as GO:0034727 on ATG9A.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: SGD:S000001917
        source_label: ATG18 (Saccharomyces cerevisiae)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Nucleophagy here descends from piecemeal microautophagy of the nucleus, which
          proceeds at the nucleus-vacuole junction. Humans have no vacuole and no
          characterised NVJ equivalent.
      - source_id: SGD:S000003455
        source_label: HSV2 (Saccharomyces cerevisiae)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Hsv2 is the PROPPIN most specifically implicated in yeast micronucleophagy, which
          makes it the least safe donor for a mammalian transfer.
      - source_id: SGD:S000006021
        source_label: ATG21 (Saccharomyces cerevisiae)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Atg21 acts in the Cvt pathway, which has no mammalian counterpart at all.
      - source_id: PANTHER:PTN000132136
        source_label: PROPPIN/WIPI family node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Three of the four donors are fungal genes acting at fungal-specific structures;
          the node grouping is sound but the process does not travel with it.
- term:
    id: GO:0061723
    label: glycophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Glycophagy, propagated from a Drosophila PROPPIN and the family node.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Mammalian glycophagy is driven by the cargo receptor STBD1, which bridges glycogen to
      GABARAP-family proteins. Whether WIPI2 specifically is required is not established;
      the IBA asserts it from family membership, which amounts to the generic claim that a
      core autophagy adaptor participates in every selective variant. That claim may well be
      true but it is not what was tested, and stating it as a cargo-specific process term
      overstates the evidence.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - ROLE_CONFLATION
      - CONTEXT_OR_TISSUE_MISMATCH
      source_entities:
      - source_id: FB:FBgn0035850
        source_label: Atg18a (Drosophila melanogaster)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Drosophila Atg18a is a general autophagy factor; a glycogen-autophagy phenotype in
          the fly does not establish that human WIPI2 carries a glycophagy-specific role.
      - source_id: PANTHER:PTN000132136
        source_label: PROPPIN/WIPI family node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Mammalian glycophagy selectivity is supplied by the cargo receptor STBD1, not by
          the PROPPIN. Transferring the cargo-specific term to the node conflates the
          general machinery with the receptor that gives it specificity.
