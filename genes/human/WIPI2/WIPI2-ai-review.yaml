- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:28890335
  qualifier: enables
  review:
    summary: >-
      Bare protein binding from ten independent IPI experiments; uninformative as a function
      statement.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Per project curation guidance, protein binding says nothing about what the gene
      product does. The underlying interactions are individually informative and are
      precisely what makes WIPI2 an adaptor: ATG16L1 and ATG5 on the conjugation side, ULK1
      and RB1CC1 on the initiation side, WIPI1 and WDR45 within the PROPPIN family, plus
      TECPR1, ARL6IP1, RABAC1, POT1 and UBAC2. The informative molecular function is
      GO:0030674 protein-macromolecule adaptor activity, already annotated on this gene and
      accepted as core, which is where these interactions belong.
