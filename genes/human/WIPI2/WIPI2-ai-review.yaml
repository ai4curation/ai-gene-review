- term:
    id: GO:0034045
    label: phagophore assembly site membrane
  evidence_type: EXP
  original_reference_id: PMID:28890335
  qualifier: located_in
  review:
    summary: >-
      Phagophore assembly site membrane. Seven assertions on this one gene, all of which
      describe WIPI2 on the omegasome-anchored phagophore rather than on a membrane bounding
      the assembly site.
    action: MODIFY
    reason: >-
      GO:0034045 asserts via bounding_layer_of that a membrane bounds the phagophore
      assembly site. The PAS is a liquid-like protein condensate with no bounding bilayer,
      and the term carries phagophore and isolation membrane as related synonyms of the
      distinct term GO:0061908 - see GO issue #29437 and
      projects/CONDENSATES/GO_0034045-annotation-audit.md. WIPI2 accumulates seven
      assertions here from four different evidence routes (EXP x4, IDA, IBA, and an IEA
      carrying UniProtKB-SubCell:SL-0221), which makes it one of the heaviest single-gene
      loads on the term and a good illustration of how the ambiguity compounds. The
      underlying observation is consistent across all of them: WIPI2 is a peripheral protein
      on the cytoplasmic face of the omegasome-anchored phagophore. Moved to GO:0061908, the
      existing term those synonyms belong to. The precise destination is the phagophore
      membrane, proposed under proposed_new_terms, since WIPI2's membrane association is the
      point of the annotation and GO:0061908 is a structure rather than a membrane term.
    proposed_replacement_terms:
