- term:
    id: GO:0097352
    label: autophagosome maturation
  evidence_type: IMP
  original_reference_id: PMID:20505359
  qualifier: involved_in
  negated: true
  review:
    summary: >-
      NOT autophagosome maturation. WIPI2 depletion does not block maturation; it blocks an
      earlier step.
    action: ACCEPT
    reason: >-
      The companion negative to NOT GO:0005776. Together they place WIPI2's requirement at
      omegasome-to-phagophore progression and explicitly exclude the downstream maturation
      step, which is a sharper functional statement than either positive annotation on its
      own. Depleting WIPI2 causes omegasomes to accumulate rather than autophagosomes to
      stall. Retained as stated.
    supported_by:
    - reference_id: PMID:20505359
      supporting_text: Furthermore, when WIPI2 is depleted, we observe a  remarkable
        accumulation of omegasomes, ER-localized PtdIns3P-containing  structures labeled by
        DFCP1 (double FYVE domain-containing protein 1), which are  thought to act as platforms
        for autophagosome formation.
