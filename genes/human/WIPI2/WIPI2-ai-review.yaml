core_functions:
- description: >-
    Reads the PtdIns3P signal generated on omegasome and phagophore membranes by the
    ULK1-activated class III PI3-kinase, and from that membrane position recruits the
    ATG12-ATG5-ATG16L1 conjugation complex, coupling the initiating lipid mark to
    ATG8-family lipidation and phagophore expansion.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0034497
    label: protein localization to phagophore assembly site
  - id: GO:0000045
    label: autophagosome assembly
  locations:
  - id: GO:0061908
    label: phagophore
  - id: GO:0000407
    label: phagophore assembly site
  supported_by:
  - reference_id: PMID:24954904
    supporting_text: Inhibition of PtdIns(3)P binding through mutation of the PtdIns(3)P
      binding motif FRRG to FTTG (GFP-WIPI2b FTTG) had no significant effect on the ability
