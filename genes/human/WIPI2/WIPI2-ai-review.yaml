proposed_new_terms:
- proposed_name: phagophore membrane
  proposed_definition: >-
    The membrane system of a phagophore, comprising its two closely apposed lipid bilayers
    and the continuous rim that joins them, which expands by lipid acquisition and closes to
    form the double membrane of an autophagosome.
  proposed_parent:
    id: GO:0061908
    label: phagophore
  justification: >-
    WIPI2 is a peripheral membrane protein on the cytoplasmic face of this bilayer, so its
    membrane association is the substance of the annotation rather than an incidental detail,
    and GO:0061908 phagophore records a structure rather than a membrane. GO has autophagosome
    membrane (GO:0000421) and omegasome membrane (GO:1903349) but no phagophore membrane,
    which is why such annotations accumulated on GO:0034045 phagophore assembly site membrane -
    a term that asserts via bounding_layer_of a bounding membrane the PAS does not have. Seven
    of the forty-five annotations on this gene sit on that term. See GO issue #29437
    recommendation R3 and projects/CONDENSATES/GO_0034045-annotation-audit.md. This is the same
    term proposed in the ATG9A review.
suggested_questions:
- question: >-
    Does WIPI2 leave the phagophore at closure, or is it displaced earlier, and what
    displaces it? The NOT autophagosome and NOT autophagosome maturation annotations record
    that it is gone by the mature organelle but not when or how.
- question: >-
    The six WIPI2 isoforms differ at the N and C termini, and only isoform 4 (WIPI2b) has a
    documented function in ATG16L1 recruitment and antibacterial autophagy. What do the other
    five do, and are any of the annotations on this entry isoform-restricted in a way GOA does
    not record?
- question: >-
    Is human WIPI2 actually required for pexophagy, nucleophagy and glycophagy, or are those
    three IBA annotations generic transfers from yeast and fly PROPPINs? Each is currently
    asserted from family membership alone.
- question: >-
    WIPI2 and WIPI1 are both mammalian Atg18 orthologues and both bind PtdIns3P. What makes
    WIPI2 the one that recruits ATG16L1, and is the division of labour a property of the
    propeller or of the flanking sequences?
suggested_experiments:
- description: >-
    Live imaging of an endogenously tagged WIPI2 alongside a closure marker to time its
    departure from the phagophore relative to scission, which would convert the two NOT
    annotations from a static absence into a kinetic statement.
- description: >-
    Isoform-resolved rescue in a WIPI2-null background, testing each of the six isoforms
    separately for PtdIns3P binding, ATG16L1 recruitment, LC3 lipidation and Salmonella
    clearance, to establish which annotations are isoform-restricted.
- description: >-
    Direct test of the selective-autophagy IBA transfers in mammalian cells: assay pexophagy,
    nucleophagy and glycophagy flux in WIPI2-knockout cells, with WIPI1 knockout as a
    specificity control, to determine whether the family-level propagation is warranted.
