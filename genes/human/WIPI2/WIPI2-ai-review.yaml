id: Q9Y4P8
gene_symbol: WIPI2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  WIPI2 is a seven-bladed beta-propeller of the PROPPIN family and one of the two mammalian
  orthologues of yeast Atg18. It has no catalytic activity; it works as an adaptor that
  converts a lipid signal into the recruitment of a protein complex. Two phosphoinositide
  pockets built around a conserved FRRG motif read phosphatidylinositol 3-phosphate, which is
  generated on omegasomes - endoplasmic-reticulum-connected platforms - when starvation
  activates the ULK1 kinase complex and the class III PI3-kinase. Bound to that lipid at the
  membrane, WIPI2 binds ATG16L1 and so delivers the ATG12-ATG5-ATG16L1 conjugation machinery
  to the growing phagophore, where it drives lipidation of ATG8-family proteins and expansion
  of the nascent autophagosomal membrane. The lipid-reading and complex-binding surfaces are
  separable: an FRRG-to-FTTG mutant that cannot bind the lipid still binds ATG16L1. WIPI2 also
  helps hold isolation membranes against the ER through its interaction with the ULK1-RB1CC1
  complex. It marks the phagophore and leaves before the autophagosome matures, and depleting
  it causes omegasomes to accumulate rather than autophagosomes to stall. Beyond bulk
  starvation-induced autophagy, the WIPI2b isoform binds the phagophore membrane forming around
  cytosolic Salmonella and is required for the autophagic response to that infection. Biallelic
  loss-of-function variants cause an autosomal recessive intellectual developmental disorder
  with short stature and skeletal anomalies.
