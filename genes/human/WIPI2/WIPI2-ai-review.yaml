- term:
    id: GO:0009267
    label: cellular response to starvation
  evidence_type: IDA
  original_reference_id: PMID:28561066
  qualifier: involved_in
  review:
    summary: >-
      Cellular response to starvation, the physiological trigger for WIPI2 recruitment.
    action: KEEP_AS_NON_CORE
    reason: >-
      Amino-acid starvation activates ULK1 and the class III PI3K, generating the PtdIns3P
      that recruits WIPI2, so this is a genuine and directly observed response. It is the
      upstream context in which the core adaptor function is deployed rather than the
      function itself, so non-core.
- term:
    id: GO:0032266
    label: phosphatidylinositol-3-phosphate binding
  evidence_type: IDA
  original_reference_id: PMID:28561066
  qualifier: enables
  review:
    summary: >-
      Phosphatidylinositol-3-phosphate binding, the ligand-recognition half of the adaptor.
    action: ACCEPT
    reason: >-
      WIPI2 is a seven-bladed PROPPIN beta-propeller with two PtdIns3P sites built around
      the conserved FRRG motif, and it is a bona fide mammalian PtdIns3P effector. This
      binding is what localizes it to omegasome and phagophore membranes. Supported by two
      IDA experiments as well as by IBA across the family. Core.
    supported_by:
    - reference_id: PMID:20505359
      supporting_text: We show that WIPI2 is a mammalian effector of PtdIns3P and is ubiquitously  expressed in a variety of cell lines.
    - reference_id: PMID:24954904
      supporting_text: All known members have two PtdIns(3)P binding sites formed around a conserved FRRG motif and a hydrophobic loop that is predicted to insert into the membrane
- term:
