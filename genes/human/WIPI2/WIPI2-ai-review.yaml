proposed_new_terms: []
suggested_questions:
- question: Which step causes WIPI2 release from the nascent phagophore, and how does that
    timing vary among selective-autophagy contexts?
- question: How do the WIPI2 splice isoforms differ in membrane recruitment, ATG16L1 interaction
    and cargo-context usage?
- question: What target or ortholog experiments distinguish conserved WIPI2 participation in
    pexophagy, nucleophagy and glycophagy from partitioning among PROPPIN paralogs?
suggested_experiments:
- description: >-
    Live imaging of an endogenously tagged WIPI2 alongside a closure marker to time its
    departure from the phagophore relative to scission, which would convert the two NOT
    annotations from a static absence into a kinetic statement.
- description: >-
    Isoform-resolved rescue in a WIPI2-null background, testing each of the six isoforms
    separately for PtdIns3P binding, ATG16L1 recruitment, LC3 lipidation and Salmonella
    clearance, to establish which annotations are isoform-restricted.
- description: >-
    Direct test of the selective-autophagy IBA transfers in mammalian cells: assay pexophagy,
    nucleophagy and glycophagy flux in WIPI2-knockout cells, with WIPI1 knockout as a
    specificity control, to determine whether the family-level propagation is warranted.
