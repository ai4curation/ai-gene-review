- term:
    id: GO:0000045
    label: autophagosome assembly
  evidence_type: IMP
  original_reference_id: PMID:20505359
  qualifier: involved_in
  review:
    summary: >-
      Autophagosome assembly, WIPI2's core biological process.
    action: ACCEPT
    reason: >-
      WIPI2 is required for the formation of LC3-positive autophagosomes: it binds PtdIns3P
      generated on the omegasome and recruits the ATG12-ATG5-ATG16L1 complex that drives LC3
