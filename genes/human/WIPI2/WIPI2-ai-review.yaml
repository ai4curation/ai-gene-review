- term:
    id: GO:0032266
    label: phosphatidylinositol-3-phosphate binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Phosphatidylinositol-3-phosphate binding, the ligand-recognition half of the adaptor.
    action: ACCEPT
    reason: >-
      WIPI2 is a seven-bladed PROPPIN beta-propeller with two PtdIns3P sites built around
      the conserved FRRG motif, and it is a bona fide mammalian PtdIns3P effector. This
      binding is what localizes it to omegasome and phagophore membranes. Supported by two
      IDA experiments as well as by IBA across the family. Core.
    supported_by:
    - reference_id: PMID:20505359
      supporting_text: We show that WIPI2 is a mammalian effector of PtdIns3P and is
        ubiquitously  expressed in a variety of cell lines.
    - reference_id: PMID:24954904
      supporting_text: All known members have two PtdIns(3)P binding sites formed around a
        conserved FRRG motif and a hydrophobic loop that is predicted to insert into the
        membrane
- term:
    id: GO:0000422
    label: autophagy of mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Autophagy of mitochondrion, a selective-autophagy subtype that follows from the core
      role.
    action: KEEP_AS_NON_CORE
    reason: >-
      Mitophagy in mammalian cells uses the same PtdIns3P-to-ATG16L1 relay that WIPI2
      provides for bulk autophagy, so the claim is biologically defensible, but it is a
      consequence of the core adaptor function rather than a dedicated mitochondrial
      activity. Non-core.
- term:
    id: GO:0000425
    label: pexophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: WIPI2 participates in experimentally demonstrated human pexophagy.
    action: KEEP_AS_NON_CORE
    reason: Full PMID:37621214 Fig. EV3B measures peroxisome-targeted Keima-SKL in wild-type and
      WIPI2-knockout HeLa cells after phenanthroline treatment and finds blocked pexophagy in
      the knockout. Combined with the demonstrated WIPI2 adaptor function in recruiting
      autophagic conjugation machinery, this supports execution of peroxisome clearance rather
      than cargo-substrate necessity. It corroborates the inherited PROPPIN assertion
      independently of donor count. Retain this stimulus-specific role as noncore without
      claiming every pexophagy route requires WIPI2.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000132136
        source_label: PTN000132136
        source_status: SUPPORTS_TRANSFER
        comment: The ancestral PROPPIN pexophagy IBD now has corroborating target-specific human
          WIPI2 knockout evidence in PMID:37621214 Fig. EV3B. WIPI2 performs
          adaptor/conjugation-machinery work, not merely cargo recognition.
    supported_by:
    - reference_id: PMID:37621214
      supporting_text: finding a complete block of pexophagy in WIPI2 KO cells (Fig EV3B ).
- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Protein-macromolecule adaptor activity. This is WIPI2's defining molecular function:
      it couples a lipid signal to a protein complex.
    action: ACCEPT
    reason: >-
      WIPI2 has no catalytic activity. What it does is read PtdIns3P through its
      FRRG-centred binding sites and, from that membrane vantage point, bind ATG16L1 and so
      deliver the ATG12-ATG5-ATG16L1 conjugation machinery to the phagophore. The two halves
      are separable: an FRRG-to-FTTG mutant that cannot bind PtdIns3P still binds ATG16L1,
      showing the lipid-reading and the cargo-holding are distinct surfaces of one adaptor.
      Core.
    supported_by:
    - reference_id: PMID:24954904
      supporting_text: Inhibition of PtdIns(3)P binding through mutation of the PtdIns(3)P
        binding motif FRRG to FTTG (GFP-WIPI2b FTTG) had no significant effect on the ability of
        WIPI2b to bind Atg16L1
- term:
    id: GO:0044804
    label: nucleophagy
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: The inherited nucleophagy contribution remains unresolved, not disproven.
    action: UNDECIDED
    reason: PTN000132136 places this selective-autophagy process in the ancestral PROPPIN
      family, with descendant evidence from SGD:S000001917, SGD:S000003455 and SGD:S000006021.
      WIPI2 performs membrane-localized adaptor work that recruits ATG16L1 and enables ATG8
      lipidation, so a shared execution role can count as participation without providing cargo
      selectivity. The term is not rejected merely because a different receptor recognizes
      cargo. Nucleophagy is not limited by definition to yeast piecemeal microautophagy. The
      exact conservation or division of these functions among WIPI paralogs requires focused
      evidence adjudication.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000132136
        source_label: PTN000132136
        source_status: UNRESOLVED
        comment: The IBD is a genuine ancestral PROPPIN assertion supported by SGD:S000001917,
          SGD:S000003455 and SGD:S000006021. No target-specific loss has been established.
          Shared machinery versus cargo recognition does not itself invalidate process
          participation; the relevant target/ortholog experiments remain to be adjudicated.
    supported_by:
    - reference_id: PMID:20505359
      supporting_text: WIPI2 is recruited to early autophagosomal
