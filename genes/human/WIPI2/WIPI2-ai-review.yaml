- term:
    id: GO:0080025
    label: phosphatidylinositol-3,5-bisphosphate binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      Phosphatidylinositol-3,5-bisphosphate binding, a second PROPPIN ligand that is not the
      autophagy-relevant one.
    action: KEEP_AS_NON_CORE
    reason: >-
      PROPPINs bind PtdIns3P and PtdIns(3,5)P2 through the same pair of pockets, so the in
      vitro binding is real and directly demonstrated. In autophagy the functional ligand is
      PtdIns3P, generated on the omegasome by the ULK1-activated class III PI3K;
      PtdIns(3,5)P2 is an endolysosomal lipid and no WIPI2 function has been tied to it.
      Kept as a genuine binding activity, marked non-core.
