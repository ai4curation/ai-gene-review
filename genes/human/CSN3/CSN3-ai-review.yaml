proposed_new_terms:
- proposed_name: casein micelle
  proposed_definition: A colloidal protein-mineral particle, typically 50-500 nm in diameter, found in
    the milk of mammals and formed in the lumen of mammary alveoli from calcium-sensitive phosphorylated
    caseins (alpha-s1, alpha-s2 and beta-casein) associated with nanoclusters of amorphous calcium phosphate,
    together with kappa-casein, which limits micelle growth and confers colloidal stability.
  justification: 'Kappa-casein is a component of the casein micelle, but GO has no cellular component
    for this assembly, so its location can only be given as extracellular region. The same term is proposed
    in the human CSN2 review. The definition deliberately does not fix kappa-casein at the micelle surface:
    the classic model places it in a surface layer, while scattering data interpreted under a multivalent-binding
    model place kappa-casein throughout coat and core (PMID:38318529).'
- proposed_name: casein micelle stabilizing activity
  proposed_definition: Binding to the surface of a casein micelle and thereby preventing calcium-induced
    aggregation, precipitation or fusion of the micelles, typically by forming a hydrophilic, sterically
    and electrostatically repulsive surface layer.
  justification: The molecular activity that defines kappa-casein has no GO molecular function. Protein
    stabilization (a process) and protein-containing complex stabilizing activity (which concerns preventing
    dissociation of a complex) do not describe a surface colloid-stabilizing layer. The core function
    uses GO:0140777 as the closest existing term, for consistency across the casein family reviews, but
    that term's definition (binding a subunit to prevent dissociation of a complex) only approximates
    kappa-casein's micelle surface stabilization.
suggested_questions:
- question: Should GO define a molecular function for colloidal (casein micelle) surface stabilization,
    so that kappa-casein need not be annotated with the approximate protein-containing complex stabilizing
    activity (GO:0140777)?
- question: Does the fucosylated glycan-dependent inhibition of Helicobacter pylori adhesion by human
    kappa-casein (shown ex vivo) operate in the infant stomach, and does it persist after gastric cleavage
    releases the caseinomacropeptide?
- question: How does the much higher O-glycosylation of human kappa-casein compared with ruminant kappa-casein
    affect human micelle size, gastric clotting and the rate of casein digestion by infants?
suggested_experiments:
- hypothesis: The glycosylated caseinomacropeptide of human kappa-casein is required for micelle stabilization
    and for limiting micelle size.
  description: Reconstitute micelles from human beta-casein and recombinant human kappa-casein produced
    with or without O-glycans (or truncated at the chymosin-sensitive bond), and measure micelle size,
    calcium-phosphate content and resistance to calcium-induced precipitation; complement with a Csn3-null
    mouse rescued by transgenic human CSN3 glycosylation-site variants.
