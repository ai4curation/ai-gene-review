description: 'CSN3 encodes kappa-casein, a secreted milk glycoprotein made by mammary alveolar epithelial
  cells during lactation. Unlike the calcium-sensitive phosphorylated caseins (alpha-s1, alpha-s2 and
  beta-casein), kappa-casein is calcium-insensitive: it does not precipitate with calcium and instead
  prevents calcium-induced precipitation of the other caseins. It is located mainly at the surface of
  casein micelles, where its amphipathic structure (a hydrophobic N-terminal para-kappa-casein region
  that anchors into the micelle and a hydrophilic, extensively O-glycosylated C-terminal macropeptide
  that projects into the milk serum as a brush) stabilizes the micelle colloid and limits micelle size.
  In human milk kappa-casein is roughly a quarter of the casein and forms disulfide-linked heteromultimers
  with alpha-s1-casein. The human protein carries many more O-glycans than the ruminant proteins, and
  the fucosylated glycans of purified human kappa-casein inhibit Helicobacter pylori adhesion to gastric
  cells ex vivo. Gastric proteases (chymosin and pepsin) cleave kappa-casein at the Phe-Met region between
  para-kappa-casein and the caseinomacropeptide, which destabilizes the micelle and allows clotting. Mice
  lacking the orthologous gene fail to lactate because their casein micelles are destabilized in the alveolar
  lumen, so kappa-casein is essential for milk production.'
