core_functions:
- description: Calcium-insensitive, glycosylated kappa-casein coats the surface of milk casein micelles,
    where its hydrophobic para-kappa-casein region anchors into the micelle and its glycosylated macropeptide
    forms a hydrophilic brush, preventing calcium-induced precipitation of the calcium-sensitive caseins,
    limiting micelle size and keeping the micelles colloidally stable in the alveolar lumen so that milk
    can be produced and released. The molecular function is given as protein-containing complex stabilizing
    activity (GO:0140777) as the closest available term; it is an approximation, because kappa-casein
    stabilizes a colloidal protein-mineral particle against aggregation and precipitation rather than
    preventing dissociation of a defined complex (see proposed_new_terms).
  molecular_function:
    id: GO:0140777
    label: protein-containing complex stabilizing activity
