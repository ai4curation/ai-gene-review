- id: PMID:32449767
  title: Nuclear Receptor Coactivators (NCOAs) and Corepressors (NCORs) in the Brain.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review read for the distinction between conserved coregulator mechanisms and animal-model
      endocrine/behavioral phenotypes. It does not establish every human developmental GO assertion.
  findings:
  - statement: Nuclear coregulators have broad, context-dependent physiological roles, much of whose causal
      experimental evidence comes from animal models.
    supporting_text: Studies using genetic animal models started to reveal pivotal roles of NCOAs/NCORs
      in the brain
core_functions:
- description: Corepresses transcription by linking nuclear receptors and other DNA-bound transcription
    factors to HDAC-containing repression machinery. The NCOR1 scaffold/deacetylase-activating domain
    supports complex function; HDAC3 supplies deacetylase catalysis. AR repression is one context among
    many.
  molecular_function:
    id: GO:0003714
    label: transcription corepressor activity
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0000785
    label: chromatin
  directly_involved_in:
  - id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  supported_by:
  - reference_id: PMID:18052923
    supporting_text: 'We demonstrated that siRNA (small

      interfering RNA) treatment against either N-CoR or SMRT is sufficient for the

      de-repression of multiple TR target genes.'
    full_text_unavailable: true
  - reference_id: PMID:11931768
    supporting_text: 'GPS2 and TBL1, another component of the

      N-CoR-HDAC3 complex, interact cooperatively with repression domain 1 of N-CoR to

      form a heterotrimeric structure'
    full_text_unavailable: true
suggested_questions:
- question: Which receptor, ligand, isoform and cell contexts require this coregulator, and where can
    paralogous cofactors compensate?
