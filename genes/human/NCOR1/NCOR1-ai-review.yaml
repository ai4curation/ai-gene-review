id: O75376
gene_symbol: NCOR1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: NCOR1 (N-CoR) is a large nuclear transcriptional corepressor recruited by nuclear receptors
  and other transcription factors. It organizes repression complexes containing histone deacetylases,
  including HDAC3, and its deacetylase-activating domain supports HDAC3 function. NCOR1 thereby links
  DNA-bound regulators to chromatin repression without acting as the catalytic histone deacetylase. Its
  recruitment and effects depend on receptor, ligand and cellular context, including repression at selected
  androgen-responsive promoters. Metabolic, circadian, developmental and proliferative effects arise from
  diverse target-gene programs, and an NCOR1-containing HDAC3 complex also has a demonstrated mitotic
  spindle role.
