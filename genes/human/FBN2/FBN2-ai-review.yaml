  review:
    summary: Recombinant FBN2 rF86 binds the BMP10 prodomain.
    action: MODIFY
    reason: 'PMID18339631 Figure 6 and Table 3 directly measure binding of the recombinant FBN2 N-terminal
      fragment rF86 to the BMP10 prodomain by surface plasmon resonance (reported Kd 13 nM); the more distal
      rF37 fragment is negative. GO:0036122 covers binding to a BMP-family member and does not require the
      mature growth-factor domain. This evidence therefore supports BMP binding more precisely than generic
      protein binding. The assayed ligand is a prodomain: no receptor activation, mature-ligand affinity, pathway
      sign or natural splice-product specificity is inferred. This is a specific matrix interaction, not an
      additional core molecular activity.'
    supported_by:
