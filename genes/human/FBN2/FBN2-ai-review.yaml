- term:
    id: GO:0006006
    label: glucose metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002778720
  - UniProtKB:P35555
  review:
    summary: Placensin positively regulates hepatocyte gluconeogenesis.
    action: MODIFY
    reason: 'The actual PAINT node includes FBN2; the correction concerns the extracellular hormone role rather
      than target descent. In PMID:32329225, human recombinant placensin increases glucose output in mouse
      primary hepatocytes and AML12 cells assayed in glucose-free medium supplied with lactate and pyruvate,
      accompanied by PEPCK/G6Pase transcript induction (Glucogenic actions of placensin, Figure 3A–B; Methods,
      Stimulation of hepatocyte functions). These observations support positive regulation of gluconeogenesis
      (GO:0045722), a more precise child of GO:0010907. The recipient hepatocyte machinery performs the chemistry;
      placensin regulates it. This is a lateral role correction from imported GO:0006006, not a strict descendant
      refinement of that original term. The assay is not claimed to resolve all glucose output by isotope tracing
      or to demonstrate a human in-vivo metabolic intervention. The role belongs to C-terminal placensin, not
      mature fibrillin-2 or truncated splice isoform 2. The FBN1 comparator is acknowledged: its raw GOA has
      glucose metabolism by IDA, but the current reviewed asprosin record also corrects that role to positive
      regulation of glucose metabolism; the narrower placensin choice follows its own accessible assay scope.'
    additional_reference_ids:
    - PMID:32329225
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN002778720
        source_label: PTN002778720
        source_status: SUPPORTS_TRANSFER
        comment: The actual PANTHER v19 tree places human FBN2 leaf PTN002513885 below this node; its ungapped
          2,912-residue alignment exactly matches official P35556. Current InterPro/PANTHER source files use
          PTHR47333, whereas the live v19 geneinfo/tree use PTHR24039; these releases are kept distinct. The
          selected GO:0006006 IBD is seeded by P35555. The target path is confirmed and human FBN2-derived
          placensin supplies independent positive regulatory evidence; the propagated metabolic-participant
          wording needs correction.
      failure_modes:
      - ROLE_CONFLATION
    proposed_replacement_terms:
    - id: GO:0045722
      label: positive regulation of gluconeogenesis
