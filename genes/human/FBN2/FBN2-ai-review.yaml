references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official GO_REF method text and target-specific InterPro JSON were read. The method maps
      protein signature matches to GO terms. Actual P35556 responses show IPR001881 (44 EGF-like calcium-binding
      domain intervals) and IPR018097 (17 conserved-site intervals), both mapped to GO:0005509 on the 2,912-residue
      displayed sequence. The conserved-domain inference supports calcium binding without assigning affinity
      to every repeat or calcium signaling. This is method/domain provenance, not a target binding experiment;
      mapped domains are not attributed to the isolated C-terminal placensin product.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator judgment
    of sequence similarity
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Official method text was read: this is manual transfer of experimentally grounded annotations
      by curator judgment of sequence similarity/orthology. All four owned ISS contexts cite Q61555, confirmed
      as mouse Fbn2. Current donor QuickGO records carry IMP annotations from PMID:20855508 for bone mineralization,
      negative TGF-beta receptor signaling, osteoblast differentiation and trabecula formation. The actual
      mouse Results, figure captions and relevant Methods support these contextual matrix roles. Human transfer
      is kept distinct from direct mouse experiments; Fbn1 outcomes in the same paper are not substituted for
      Fbn2. Bone mineralization is regulated through matrix growth-factor control rather than microfibrils
      being the necessary mineralizing substrate. No human perturbation or splice-product-specific assay is
      inferred.'
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official PAINT method text, selected PTHR47333 IBD TSV, current target GOA joins and genuine
      PANTHER v19 geneinfo/tree/MSA were read. Current InterPro membership identifies P35556 in PTHR47333 (von
      Willebrand factor C/EGF & Fibrillin), with literal SF5 label FIBRILLIN-3; v19 maps the target to PTHR24039:SF26
      FIBRILLIN-2. Actual leaf PTN002513885 matches the official 2,912-aa sequence exactly and descends from
      both PTN000620536 (structural/ECM) and PTN002778720 (hormone/glucose). All five selected IBD assertions
      are positive; the selected file contains no NOT row. Current GOA versus selected IBD seed differences
      remain explicit. Target self-WITH is legitimate experimental grounding. The target matrix and human placensin
      evidence independently support the conserved roles; glucose-metabolism wording is refined to positive
      regulation of gluconeogenesis because recipient hepatocytes perform the chemistry. Sequence placement
      does not establish all functions of every descendant, processing of isoform 2, or exact endogenous cleavage.
      The failed first tree request and nonmatching v19 PTHR47333 MSA are preserved, followed by successful
      identity-guided recovery of the actual v19 family. The matrix IBA is retained as a positive non-core
      compartment, consistent with independently verified matrix detections; this does not resolve the inaccessible
      exact HDA target join. For the glucose role, actual PMID:32329225 Figure 3 and hepatocyte Methods include
      glucose-free lactate/pyruvate conditions and gluconeogenic transcripts; GO:0045722 is used instead of
      the broader GO:0010907. No receptor-class transfer follows from the cAMP/PKA response.
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl
    Compara
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Official method text was read: Ensembl Compara transfers eligible experimental annotations
      across computed orthologs. The four owned rows join Q61555 and ENSMUSP00000025497. Mouse UniProt identifies
      Fbn2 and cross-references the versioned protein ENSMUSP00000025497.6; its actual QuickGO IMP source for
      all four terms is PMID:20855508. Original mouse skeletal and osteoblast evidence supports contextual
      bone phenotypes and matrix-mediated restriction of TGF-beta signaling. The Ensembl lookup returned HTTP
      503, so a fresh independent Ensembl gene-tree replay is not claimed. This access limit does not erase
      the recorded donor, experimental grounding or prior curated orthology. No source fields are changed,
      and mouse results are not described as direct human or truncated-isoform evidence.'
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology links
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official method text explains automatic inter-ontology inference. The source entity in this
      row is GO:0005179 hormone activity. Genuine QuickGO paths show GO:0005179 is_a GO:0048018 receptor agonist
      activity, part_of GO:0007165 signal transduction. Retained target hormone activity therefore entails
      the generic signaling claim. TOO_GENERAL preserves the positive inference while avoiding an extra undifferentiated
      statement. Neither the method nor the placensin experiments identify a specific receptor or establish
      a complete GPCR pathway. This inter-ontology inference supports the retained hormone-to-signal hierarchy
      only. Shared cAMP/PKA readouts with asprosin do not establish the placensin receptor class or justify
      a new GO:0007189 assertion.
- id: GO_REF:0000117
  title: Electronic Gene Ontology annotations created by ARBA machine learning models
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Official ARBA method text and all four literal rules were read: ARBA00086221 elasticity,
      ARBA00084629 camera-type eye development, ARBA00090262 embryonic eye morphogenesis and ARBA00096893 non-collagenous
      basement-membrane component. The rule payloads expose conditions and consequences; complete training
      examples and every current target FunFam match were not recovered. Independent FBN2 protein evidence
      supports contextual elastic-matrix and developing-eye roles, plus specific human kidney and ocular basement-membrane
      locations. Eye-development claims remain spatial/structural inferences, not human perturbation proof,
      and neither eye term is a verified strict ancestor of the other. Bruch membrane central elastin-layer
      localization is not generalized to every RPE basal lamina; human glomerular basement membrane and Descemet/anterior
      lens-capsule data provide additional specific grounding. Rule metadata alone is not treated as a primary
      assay.'
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Official method text explains that identical electronic assertions from multiple pipelines
      are combined; the WITH/FROM list retains their separate sources. Owned microfibril and extracellular-region
      rows join mouse Q61555/Ensembl with ARBA00028288 or UniProt subcellular location SL-0243. Mouse donor
      identity and current annotations, actual ARBA rule and official target secretion metadata were read.
      Human matrix localization and endogenous placensin secretion supply independent target grounding. Reciprocal
      electronic human/mouse rows are not the only support: experimental donor microfibril records and target
      original evidence exist. Microfibril refers to matrix fibrillin-2; extracellular region additionally
      remains useful for secreted precursor/C-terminal material. The Ensembl HTTP 503 and unreplayed full FunFam
      condition set remain explicit.'
- id: PMID:12429738
  title: Latent transforming growth factor beta-binding protein 1 interacts with fibrillin and is a microfibril-associated
    protein.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Human FBN2 fragments rF37/rF46 bind LTBP1 in overlay/solid-phase assays. B7ZLY3 is an unreviewed
      human LTBP1 entry, distinct from reviewed Q14766 in the source records. No claim that the exact B7ZLY3
      transcript product was separately tested. The paper supports the LTBP1 partner identity; its LTBP4 panel
      is specifically FBN1 and is not reused as FBN2 evidence here. Read scope: Source-specific original Methods807–884;
      Results1146–1279; Figures 8/9 captions1309–1362; Discussion1442–1527; current B7ZLY3 identity.'
- id: PMID:12429739
  title: Fibrillins can co-assemble in fibrils, but fibrillin fibril composition displays cell-specific differences.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Human fetal dermal microfibrils contain FBN2 and FBN1; neonatal/postnatal FBN2 staining
      includes the dermal-epidermal junction. Human cell co-cultures demonstrate coassembly. Junctional staining
      alone does not establish uniform lamina-densa incorporation. The basement-membrane decision also uses
      direct human localization in PMID15277214 and PMID25406291; no unsupported source-error assertion is
      made. Read scope: Author-uploaded original Methods614–786; antibody specificity871–1005; Results1022–1134;
      original source search capture human coassembly Results and Figure9 caption.'
- id: PMID:15131124
  title: MAGP-2 has multiple binding regions on fibrillins and has covalent periodic association with fibrillin-containing
    microfibrils.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Recombinant human FBN2 N-terminal fragment binds MAGP1 and MAGP2 in controlled solid-phase
      assays; competition distinguishes their binding-site behavior. The partner accessions P27424 and Q28022
      identify bovine MAGPs. The tissue ultrastructure is bovine nuchal ligament. Neither native human MAGP
      interaction nor a natural FBN2 splice-product-specific function is inferred. Read scope: Only source
      block headed MAGP-2 paper: Methods378–514; Results781–862; Figures1–4 captions870–1026; bovine native-MAGP
      provenance in accepted original source.'
- id: PMID:15277214
  title: Regulation of fibrillin-1 by biglycan and decorin is important for tissue preservation in the kidney
    during pressure-induced injury.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Human kidney immunostaining explicitly detects FBN2 in GBM and mesangial matrix, with only
      trace Bowman capsule/tubular basement-membrane signal. The title highlights FBN1 but FBN2 was assayed.
      Human localization is distinct from mouse obstruction/genotype and rat-cell experiments; FBN1-specific
      induction/compensation is not transferred to FBN2. Read scope: Original Methods11/19/22/24/26; Results42/Figure
      3captions43–44/45/51; Discussion71–72. Additional independent database assessment: DB independently read
      original Methods blocks 11/19/22 and Results 42/Figure 3 caption 43. Despite the FBN1-focused title,
      the original explicitly assays FBN2 in tumor-free human nephrectomy kidney and shows mesangial matrix/GBM
      and afferent/efferent arteriole staining, with only trace Bowman capsule/TBM signal. This supports a
      bounded positive compartment, not all basement membranes or FBN1-specific biglycan mechanisms. The illustrated
      sample is from a 52-year-old patient. Figure pixels and the separate mouse injury experiments were not
      independently read in this lane.'
- id: PMID:18339631
  title: Targeting of bone morphogenetic protein growth factor complexes to fibrillin.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'FBN2 rF86 binds the prodomains of BMP2, BMP4, BMP7, BMP10 and GDF5 by SPR; Table 3 gives
      five positive target measurements. The ligands are recombinant prodomains, not an assay of receptor activation
      by mature growth factors. GDF5 prodomain cDNA is human SW1353-derived; the purchased mouse mature growth
      factor is a different reagent. No pathway sign or protease activity is assigned from binding. Read scope:
      Only original Targeting of BMP Growth Factor Complexes source blocks: Methods470–633 and SPR908–940;
      Results1457–1530; Figure 6 caption1628–1633; Table 3 headers1658 and rF86 row1679.'
- id: PMID:20855508
  title: Fibrillin-1 and -2 differentially modulate endogenous TGF-β and BMP bioavailability during bone formation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Recombinant FBN2 rF86 binds LTBP1 and LTBP4 by SPR; mouse Fbn2-null osteoblast matrix stores
      less latent TGF-beta, with signaling and maturation rescue after pathway inhibition. Mouse bone findings
      are not human in-vivo perturbation. Fbn2 loss does not reproduce the Fbn1 BMP increase in these cultures.
      Double-deficient cultures still mineralize; fibrillins are not obligatory mineralization substrates.
      The tested fragments are not natural splice products. Read scope: Full individual normal-cache lines117,119,121,125,141,147,153,161,163,179,185,203,209.
      Additional independent database assessment: DB scope independently read from the full original XML-derived
      normal. Fbn2-null mouse vertebrae show reduced bone density/volume, fewer trabeculae and lower bone formation;
      mouse osteoblast cultures show impaired maturation and mineralized nodules. Excess pSmad/TGF-beta signaling,
      reduced matrix LTBP1/TGF-beta incorporation and rescue after TGF-beta antagonism support a matrix regulatory
      role. Double-fibrillin depletion still permits mineralization, distinguishing regulation from a necessary
      mineralizing structural substrate. The source reports rF86–LTBP1/LTBP4 binding, but this DB reading does
      not independently assign construct species from a name alone. The direct owner supplies its verified
      construct provenance. Main text/captions and relevant Methods read; figure pixels and supplements not
      independently read in this lane.'
- id: PMID:23658023
  title: Comparative proteomic analysis of supportive and unsupportive extracellular matrix substrates for
    human embryonic stem cell maintenance.
  findings: []
