core_functions:
- description: 'Contributes the microfibrillar scaffold used in early elastic-fiber assembly and supplies structural
    organization in nonelastic matrices. The matrix also provides a platform for latent growth-factor complexes:
    fibrillin-2-dependent sequestration limits TGF-β signaling in mouse osteoblasts, rather than directly inhibiting
    receptor chemistry. These structural and storage roles are broader than an isolated elasticity measurement.'
  molecular_function:
    id: GO:0005201
    label: extracellular matrix structural constituent
  directly_involved_in:
  - id: GO:0030512
    label: negative regulation of transforming growth factor beta receptor signaling pathway
  locations:
  - id: GO:0001527
    label: microfibril
  supported_by:
  - reference_id: PMID:8120105
  - reference_id: PMID:12429739
  - reference_id: PMID:20855508
- description: Binds calcium through the repeated calcium-binding EGF-like domains of fibrillin-2, supporting
    its extracellular matrix-chain architecture. The target sequence and curated domain assignments support
    this activity; they do not measure affinity at every repeat. This activity is not assigned to isolated
    placensin and does not imply calcium signaling.
  molecular_function:
    id: GO:0005509
    label: calcium ion binding
  locations:
  - id: GO:0001527
    label: microfibril
  supported_by:
