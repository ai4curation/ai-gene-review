id: P35556
gene_symbol: FBN2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Fibrillin-2 is a secreted glycoprotein that forms extracellular microfibrils in connective tissues
  and contributes to the scaffold for early elastic-fiber assembly. Its matrix chain contains repeated calcium-binding
  EGF-like domains and provides structural organization in both elastic and nonelastic matrices, including
  binding sites for latent growth-factor complexes. In mouse osteoblasts, fibrillin-2-dependent matrix sequestration
  limits TGF-β bioavailability and supports maturation. Pathogenic FBN2 variants cause congenital contractural
  arachnodactyly, and rare variants have also been associated with early-onset macular degeneration. The long
  precursor is the source of placensin, a secreted C-terminal product detected in human placenta, trophoblast
  cultures and circulation. Recombinant human placensin stimulates glucose production in mouse hepatocytes
  and invasion by human trophoblast cells. The shorter splice product lacks the C-terminal placensin sequence.
