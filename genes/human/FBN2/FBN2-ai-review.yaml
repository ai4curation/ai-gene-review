  - reference_id: GO_REF:0000002
- description: Acts as the secreted hormone placensin. Recombinant human placensin stimulates recipient-cell
    cAMP/PKA and glucose output in mouse hepatocytes and increases circulating glucose in mice; endogenous
    human trophoblast secretion establishes the product source. The role belongs to the released C-terminal
    product rather than mature matrix fibrillin-2.
  molecular_function:
