- id: PMID:8120105
  title: Structure and expression of fibrillin-2, a novel microfibrillar component preferentially located in
    elastic matrices.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Human fetal tissue immunostaining and target-specific antibodies identify FBN2 in connective
      matrices; bovine immunogold directly labels elastic-fiber microfibrils. Human MG63 cultures secrete the
      protein. Bovine ultrastructure and human light-microscopy localization are distinct. Elasticity is an
      IC inference about the matrix, not a measured intrinsic single-molecule recoil or an exclusive elastic-tissue
      role. Read scope: Original p856 Methods; p858–859 target Results; p862 Discussion; actual page5/6/7 pixels,
      Figures5–9 and captions. Additional independent database assessment: DB independently read the preserved
      original text at lines 75–105, 390–443 and 447–493. Bovine immunogold in Figure 5 localizes FBN2 to peripheral
      microfibrils rather than the amorphous elastin core; separate human fetal staining supports FBN2 matrix
      localization and preferential elastic-tissue distribution. This supports a contextual elasticity inference
      at matrix level, not a direct isolated-protein recoil assay. Human ocular/kidney staining is tissue-specific.
      The historical sequence length is not substituted for current official sequence/product coordinates.
      Figure captions, not the original figure pixels, were read by this lane. Feedback follow-up: the target
      FBN2 primary-sequence analysis and Discussion p. 862 identify numerous calcium-binding EGF-like repeats;
      this is target architecture evidence, not an independently measured affinity for every repeat. Reviewed
      UniProt P35556 FT DOMAIN records independently identify calcium-binding EGF-like intervals, including
      276–317 and 318–359 (PROSITE-ProRule PRU00076). UniProt FUNCTION assigns early elastic-fiber assembly
      with ortholog evidence ECO:0000250/Q61555; the original paper directly establishes preferential elastic-matrix
      localization and a microfibrillar scaffold, while its assembly/maintenance distinctions are interpretations
      of sequence and spatial expression. Neither this paper nor the curated disease summary establishes one
      loss-of-function mechanism for all dominant FBN2 disorders.'
