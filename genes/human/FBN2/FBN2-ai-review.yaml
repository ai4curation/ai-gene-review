      from a mouse feeder sample (0.671). Extraction and separate human/mouse protein databases are described.
      FBN2 is not detected in the listed human feeder samples. Generic ECM detection does not resolve intact
      microfibril assembly, processing, or a role in stem-cell self-renewal. Read scope: Original blocks6/8/10/12/20/26/27/41/42/45/49/56–58;
      Table 1 actual FBN2 row and column headers.'
- id: PMID:24899048
  title: Rare and common variants in extracellular matrix gene Fibrillin 2 (FBN2) are associated with macular
    degeneration.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Human fetal Bruch membrane and choroid/sclera contain FBN2; co-labeling particularly associates
      it with the central elastin layer. Human RPE/choroid extracts contain approximately350-kDa protein. Bruch
      membrane is multilayered: central elastic-layer localization does not imply uniform epithelial basal-lamina
      staining. Disease association does not by itself establish a developmental mechanism. Monkey and aged/AMD
      samples are separately identified. Read scope: Original blocks4/13/14/28–31/36–38. Additional independent
      database assessment: DB independently read original Results/Figure 2 blocks 13–14, variant/modeling context
      15–22 and Methods 37–38. Human fetal FBN2 protein occurs in Bruch membrane, choroid and sclera, and immunoblot
      detects a 350-kDa species in RPE/choroid. Colabeling places it in the central elastin layer of Bruch
      membrane; this is not a uniform RPE basal-lamina assertion. Human maculopathy/AMD associations and modeled
      structural changes are not treated as direct embryonic morphogenesis experiments. No figure pixels, supplements
      or raw association data independently reread in this lane. Feedback follow-up: Results describing the
      two-generation family and the c.3430G>A/p.Glu1144Lys variant establish segregation with early-onset macular
      degeneration in that family. The paper distinguishes this phenotype from congenital contractural arachnodactyly,
      and its proposed altered matrix flexibility/packaging mechanism remains a hypothesis. No universal loss-of-function
      or dominant-negative mechanism is assigned to all disease-associated variants. Additional actual reread:
      original Results blocks 8–13 and Discussion 28–31.'
- id: PMID:25034023
  title: Heparin/heparan sulfate controls fibrillin-1, -2 and -3 self-interactions in microfibril assembly.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Human recombinant FBN2 fragments interact with fibronectin and FBN1. Heparin inhibits fibrillin
      heterotypic interactions but not the fibronectin interaction under the tested conditions. Fragment binding
      and human fibroblast network inhibition are distinct measurements; no specific natural splice product,
      fixed stoichiometry, or direct heparan-sulfate synthesis is established. Read scope: ScienceDirect original
      Results3.3 and Figure 3A/B/C caption; only first Wiley primary-PDF source block Methods2.1–2.3.'
- id: PMID:25406291
  title: Human eye development is characterized by coordinated expression of fibrillin isoforms.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Target-specific immunostaining shows FBN2-containing ECM in developing human eye, with Descemet
      membrane and anterior lens capsule signal at defined stages. IEP supports a contextual structural-role
      inference, not a demonstrated perturbational morphogenesis mechanism. FBN1/2/3 are paralogs despite the
      paper calling them isoforms. Juvenile human zonule/retina are not positive FBN2 findings; some epithelial
      signal is explicitly nonspecific. Read scope: Original Methods24/26/28; Results31/33–34/37/41/45/49/52;
      captions39/43/47/51; Discussion58–63. Additional independent database assessment: DB independently read
      Methods blocks 24/26/28, FBN2 Results 37/41/45/49/52 and captions 39/43/47/51, plus Discussion 59. The
      source establishes stage-dependent human FBN2-containing ocular ECM, including Descemet membrane and
      anterior lens-capsule basal lamina. It distinguishes negative or nonspecific regions, including Bowman
      membrane at the stated stage and juvenile retinal signal. The early vascular scaffold becoming the zonule
      is explicitly speculative. Developmental annotations remain bounded spatial/structural IEP inferences;
      no functional perturbation of human morphogenesis is claimed. Figure pixels and supplements were not
      independently read in this lane.'
