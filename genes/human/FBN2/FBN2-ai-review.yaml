functional_isoforms:
- id: FBN2_MATURE_FIBRILLIN2
  name: Mature fibrillin-2
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000007584
    residues: 78-2779
  description: The extracellular microfibrillar chain represented by the curated 78–2779 interval of the displayed
    FBN2 precursor. It contributes to connective-tissue matrix and growth-factor organization, separately from
    released C-terminal placensin. Exact endogenous processing boundaries were not experimentally mapped in
    the primary studies read here.
- id: FBN2_PLACENSIN
  name: Placensin
  type: CLEAVAGE_PRODUCT
  maps_to:
  - type: UNIPROT_CHAIN
    ids:
    - PRO_0000436888
    residues: 2780-2912
  description: The secreted C-terminal FBN2-derived product. Human placental/trophoblast and serum evidence
    supports its release; recombinant human placensin stimulates glucose output in mouse hepatocytes and invasion
    in a human trophoblast cell line. The 2780–2912 interval follows reviewed UniProt and experimental Methods,
    with an unresolved one-residue figure-caption discrepancy and no direct endogenous N-terminal mapping.
knowledge_gaps:
- gap_statement: The exact intact endogenous placensin N terminus and the quantitative dependence of its release
    on furin in human trophoblasts remain unresolved in the primary experiments assessed here.
  boundary: UniProt P35556 explicitly annotates secretion of linked fibrillin-2/placensin followed by furin
    separation with ECO:0000269 citing PMID32329225, and the article adopts this processing model. Its Results
    identify the site by PiTou prediction and show furin colocalization, secreted C-terminal immunoreactivity
    and IP-MS peptides after proteolytic digestion. Those observations support release of the product but do
    not map an intact endogenous N terminus or isolate furin necessity. The recombinant Methods specify 2780–2912,
    while Figure 2 gives 2779–2912. This is a bounded processing-resolution question, not a denial of the curated
    processing model or of placensin secretion.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Defining endogenous processing would distinguish the naturally released hormone from an active
    recombinant fragment and test how its production is separated from matrix-chain secretion.
  resolution: Map intact secreted placensin termini and test furin perturbation with rescue while controlling
    precursor abundance, cell viability and general secretion.
  provenance:
  - reference_id: PMID:32329225
suggested_experiments:
- hypothesis: Furin-dependent processing generates a defined endogenous placensin species from the long FBN2
    precursor.
  description: Test the curated furin-processing model in human trophoblast cultures by enriching the native
    secreted C-terminal product and mapping its intact mass and N terminus, without inferring the terminus
    from digested internal peptides. Compare furin depletion with rescue by wild-type and catalytically inactive
    furin, measuring long-precursor expression, matrix-chain secretion, general secretion and viability in
    parallel. Test isolated products at matched concentrations in the established recipient-cell assays; distinguish
    reduced cleavage from a global loss of precursor secretion.
  experiment_type: Intact-protein mass spectrometry and controlled protease perturbation
