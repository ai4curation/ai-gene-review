- id: PMID:32329225
  title: Placensin is a glucogenic hormone secreted by human placenta.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Human trophoblast cultures and serum contain secreted FBN2-derived placensin immunoreactivity
      and IP-MS peptides. Recombinant human 2780–2912 stimulates glucose output/cAMP/PKA in mouse hepatocytes
      and trophoblast invasion in a human cell line. Methods specify 2780–2912, while Figure 2 caption says
      2779–2912. The furin site is computationally predicted; IP-MS after digestion does not map an intact
      endogenous N terminus. Furin co-localization is not a cleavage-dependence assay. Human serum associations
      are not human intervention evidence. The 1473-residue splice product lacks the placensin sequence. Read
      scope: Original blocks10/11/14/15/17/19/23/24/27/31/33/36/40/41/43/45/48/50/51/53/54/56/57. Additional
      independent database assessment: DB independently read original blocks 10–27 and Methods 43–57. Human
      endogenous trophoblast secretion and serum IP-MS/immunoreactivity support a secreted C-terminal product;
      recombinant human 2780–2912 placensin has positive effects in mouse hepatocytes/liver/mice and human
      trophoblast cells. The recipient cells execute glucose chemistry, so positive regulation is the appropriate
      glucose-process role. Methods specify 2780–2912, whereas the Figure 2 caption says 2779–2912; the official
      2780 boundary remains metadata-supported, not an experimentally mapped endogenous N terminus. Furin-site
      prediction and colocalization do not establish furin necessity. No human in-vivo intervention, endogenous
      FBN2-loss systemic glucose test or placensin production by truncated isoform 2 is inferred. No figure
      pixels or original supplements independently read in this lane. Feedback follow-up explicitly reconciles
      the curated source: UniProt P35556 SUBCELLULAR LOCATION states that fibrillin-2 and placensin are linked
      during secretion and subsequently separated by furin, with ECO:0000269/PMID32329225. The paper itself
      adopts that model, but Results/Figure 1 identify the cut site by PiTou prediction, Results/Figure EV1
      report furin colocalization, and Figures 2/4/5 report C-terminal immunoreactivity and secreted product.
      Expression Methods specify the separately expressed 2780–2912 recombinant fragment, and IP-MS Methods
      digest immunoprecipitated material before peptide analysis. These actual observations support secretion
      and the proposed processing model without independently resolving the intact endogenous terminus or furin-specific
      necessity. The model is retained; the bounded gap asks how to resolve its exact endogenous implementation.
      Accessible original: https://pmc.ncbi.nlm.nih.gov/articles/PMC7271319/ . Additional database feedback
      assessment: Independently read original Glucogenic actions of placensin, Figure 3 and Methods Stimulation
      of hepatocyte functions. Recombinant human ligand increases mouse primary-hepatocyte/AML12 glucose output
      in glucose-free lactate/pyruvate medium, with PEPCK/G6Pase transcript induction. This supports positive
      regulation of gluconeogenesis, without claiming tracer-resolved allocation of every glucose molecule,
      a human metabolic intervention, or a GPCR identity from cAMP/PKA alone. The official OLS and QuickGO
      definition and strict GO:0045722 is_a GO:0010907 edge were verified. FBN1 source-specific pharmacology
      is not transferred to FBN2.'
