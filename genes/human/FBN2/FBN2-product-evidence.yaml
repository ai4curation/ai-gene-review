  coordinate_provenance: Reviewed UniProt P35556 displayed-sequence CHAIN features PRO_0000007584 and PRO_0000436888;
    both ECO:0000305. Signal 1–28 and N-propeptide 29–77 are likewise preserved as official metadata, not newly
    measured boundaries.
  source_limits:
  - The Methods construct is 2780–2912; Figure 2 caption says 2779–2912. No silent normalization of the article
    is made.
  - Furin-site prediction and placental co-localization do not demonstrate furin necessity; digested IP-MS
    peptides do not map intact termini.
  - Placensin activity is not assigned to mature matrix FBN2. The FBN2 substrate does not catalyze its own
    processing.
  - The two seed splice objects remain exact. P35556-2 is 1,473 aa and deletes displayed residues 1507–2912;
    it cannot supply the mapped placensin interval. No measured isoform 2 function is proposed.
  - All 60 raw annotations use parent UniProtKB:P35556; no row is relabeled as a processed product or natural
    splice isoform. No NEW annotation or supporting_text is added.
  status: APPLIED_TO_FINAL_GENE_REVIEW
  functional_isoforms:
  - id: FBN2_MATURE_FIBRILLIN2
    name: Mature fibrillin-2
    type: CLEAVAGE_PRODUCT
    maps_to:
    - type: UNIPROT_CHAIN
      ids:
      - PRO_0000007584
      residues: 78-2779
    description: The extracellular microfibrillar chain represented by the curated 78–2779 interval of the
      displayed FBN2 precursor. It contributes to connective-tissue matrix and growth-factor organization,
      separately from released C-terminal placensin. Exact endogenous processing boundaries were not experimentally
      mapped in the primary studies read here.
  - id: FBN2_PLACENSIN
    name: Placensin
    type: CLEAVAGE_PRODUCT
    maps_to:
    - type: UNIPROT_CHAIN
      ids:
      - PRO_0000436888
      residues: 2780-2912
    description: The secreted C-terminal FBN2-derived product. Human placental/trophoblast and serum evidence
      supports its release; recombinant human placensin stimulates glucose output in mouse hepatocytes and
      invasion in a human trophoblast cell line. The 2780–2912 interval follows reviewed UniProt and experimental
      Methods, with an unresolved one-residue figure-caption discrepancy and no direct endogenous N-terminal
      mapping.
