  review:
    summary: Recombinant FBN2 rF86 binds the GDF5/BMP14 prodomain.
    action: MODIFY
    reason: 'PMID18339631 Figure 6 and Table 3 directly measure binding of the recombinant FBN2 N-terminal
      fragment rF86 to the GDF5/BMP14 prodomain by surface plasmon resonance (reported Kd 24 nM); the
      more distal rF37 fragment is negative. GO:0036122 covers binding to a BMP-family member and does
      not require the mature growth-factor domain. This evidence therefore supports BMP binding more precisely
      than generic protein binding. The assayed ligand is a prodomain: no receptor activation, mature-ligand
      affinity, pathway sign or natural splice-product specificity is inferred. This is a specific matrix
      interaction, not an additional core molecular activity. The verified human P43026 record identifies
      GDF5 as BMP14; the human SW1353-derived prodomain is distinct from the mouse mature growth factor
      used elsewhere in the paper.'
    supported_by:
