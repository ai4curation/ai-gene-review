  review:
    summary: Recombinant human FBN2 N- and C-terminal fragments bind fibronectin.
    action: MODIFY
    reason: PMID25034023 Results 3.3 and Figure 3B test recombinant human FBN2 N- and C-terminal fragments
      against immobilized human plasma fibronectin in solid-phase binding assays. Binding persists in
      the tested heparin concentrations. GO:0001968 fibronectin binding captures the measured partner
      specificity, rather than leaving a generic protein-binding label. The separate FBN1 interaction
      in Figure 3A retains its own source context. No fibronectin receptor activity, natural FBN2 splice-product
      specificity or new core molecular activity is inferred.
    supported_by:
    - reference_id: PMID:25034023
    proposed_replacement_terms:
    - id: GO:0001968
      label: fibronectin binding
