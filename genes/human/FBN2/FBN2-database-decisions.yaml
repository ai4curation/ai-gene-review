        comment: Actual rule conditions and GO:0001527 consequence were inspected; target InterPro cross-references
          support the fibrillin-related domain context, but all alternative FunFam rule matches were not independently
          replayed.
      - source_id: UniProtKB:Q61555
        source_label: Mouse Fbn2
        source_status: SUPPORTS_TRANSFER
        comment: Current QuickGO includes microfibril IDA records as well as the PMID:20855508 matrix statement;
          human-to-mouse electronic rows are separately identifiable.
      - &id001
        source_id: Ensembl:ENSMUSP00000025497
        source_label: Mouse Fbn2 protein model
        source_status: SUPPORTS_TRANSFER
