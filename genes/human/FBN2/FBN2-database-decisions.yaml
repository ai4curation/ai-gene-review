      matrix. Retain this broad, biologically informative positive compartment consistently with the other verified
      matrix detections; the term is not discarded because microfibril and basement-membrane components are more
      specific. The PAINT statement concerns matrix fibrillin-2 and does not assign the soluble hormone to matrix.
      Current GOA and selected IBD extant-source lists differ; that source-version difference is retained and is
