  review:
    summary: Placensin contributes to glucose homeostasis as an extracellular regulatory product.
    action: ACCEPT
    reason: 'The target descends from the actual positive IBD node. PMID:32329225 independently shows that a human
      FBN2-derived C-terminal construct increases glucose output in mouse hepatocytes and liver and raises circulating
      glucose in mice. This supports the conserved glucogenic regulatory role while retaining the limits: no human
      intervention or endogenous FBN2-loss test of systemic glucose homeostasis was reported in the inspected study,
      and pregnancy serum associations alone do not prove causality. The role belongs to placensin rather than matrix
      fibrillin-2 or truncated splice isoform 2.'
    additional_reference_ids:
    - PMID:32329225
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002778720
        source_label: PTN002778720
        source_status: SUPPORTS_TRANSFER
        comment: The actual PANTHER v19 tree places human FBN2 leaf PTN002513885 below this node; its ungapped 2,912-residue
          alignment exactly matches official P35556. Current InterPro/PANTHER source files use PTHR47333, whereas
          the live v19 geneinfo/tree use PTHR24039; these releases are kept distinct. Selected GO:0042593 IBD is
          seeded by P35555; current GOA additionally lists MGI:95490. Target ancestry and independent human-ligand
          experiments support retention without using donor counts.
