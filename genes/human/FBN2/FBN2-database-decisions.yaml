          lookup returned HTTP 503; an independent current Ensembl gene-tree replay was not obtained. The literal
          GOA source identifier is preserved.
- index: 3
  original_source_object:
    term:
      id: GO:0005179
      label: hormone activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    supporting_entities:
    - MGI:MGI:95489
    - MGI:MGI:95490
    - PANTHER:PTN002778720
    - UniProtKB:P35555
    - UniProtKB:P35556
  review:
    summary: The C-terminal FBN2 product placensin has hormone activity.
    action: ACCEPT
    reason: 'The PAINT hormone assertion is supported independently on the target: PMID:32329225 reports endogenous
      human trophoblast secretion and serum immunoreactivity/IP-MS, and a recombinant human C-terminal placensin
      construct activates recipient-cell cAMP/PKA and glucose output. The glucose assays used mouse hepatocytes/liver/mice;
      human trophoblast responses were also tested. The exact endogenous cleavage boundary and furin necessity were
      not demonstrated in the inspected experiments. This activity is assigned to the C-terminal product of the
      displayed precursor, not to mature matrix fibrillin-2 or the truncated 1,473-residue splice isoform 2. Target
      self-WITH is legitimate descendant grounding.'
    additional_reference_ids:
    - PMID:32329225
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002778720
        source_label: PTN002778720
        source_status: SUPPORTS_TRANSFER
        comment: The actual PANTHER v19 tree places human FBN2 leaf PTN002513885 below this node; its ungapped 2,912-residue
          alignment exactly matches official P35556. Current InterPro/PANTHER source files use PTHR47333, whereas
          the live v19 geneinfo/tree use PTHR24039; these releases are kept distinct. The selected positive IBD
          row is hormone activity; target P35556 is a legitimate experimental seed. Current GOA adds MGI:95490 relative
          to the selected IBD seed list; the source difference is retained.
