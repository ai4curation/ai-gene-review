- index: 33
  original_source_object:
    term:
      id: GO:0006006
      label: glucose metabolic process
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    supporting_entities:
    - PANTHER:PTN002778720
    - UniProtKB:P35555
  review:
    summary: Placensin positively regulates hepatocyte gluconeogenesis.
    action: MODIFY
    reason: "The actual PAINT node includes FBN2; the correction concerns the extracellular hormone role rather\
      \ than target descent. In PMID:32329225, human recombinant placensin increases glucose output in mouse primary\
      \ hepatocytes and AML12 cells assayed in glucose-free medium supplied with lactate and pyruvate, accompanied\
      \ by PEPCK/G6Pase transcript induction (Glucogenic actions of placensin, Figure 3A\u2013B; Methods, Stimulation\
      \ of hepatocyte functions). These observations support positive regulation of gluconeogenesis (GO:0045722),\
      \ a more precise child of GO:0010907. The recipient hepatocyte machinery performs the chemistry; placensin\
      \ regulates it. This is a lateral role correction from imported GO:0006006, not a strict descendant refinement\
      \ of that original term. The assay is not claimed to resolve all glucose output by isotope tracing or to demonstrate\
      \ a human in-vivo metabolic intervention. The role belongs to C-terminal placensin, not mature fibrillin-2\
      \ or truncated splice isoform 2. The FBN1 comparator is acknowledged: its raw GOA has glucose metabolism by\
      \ IDA, but the current reviewed asprosin record also corrects that role to positive regulation of glucose\
      \ metabolism; the narrower placensin choice follows its own accessible assay scope."
    additional_reference_ids:
    - PMID:32329225
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN002778720
        source_label: PTN002778720
        source_status: SUPPORTS_TRANSFER
        comment: The actual PANTHER v19 tree places human FBN2 leaf PTN002513885 below this node; its ungapped 2,912-residue
          alignment exactly matches official P35556. Current InterPro/PANTHER source files use PTHR47333, whereas
          the live v19 geneinfo/tree use PTHR24039; these releases are kept distinct. The selected GO:0006006 IBD
          is seeded by P35555. The target path is confirmed and human FBN2-derived placensin supplies independent
          positive regulatory evidence; the propagated metabolic-participant wording needs correction.
      failure_modes:
      - ROLE_CONFLATION
    proposed_replacement_terms:
    - id: GO:0045722
      label: positive regulation of gluconeogenesis
- index: 34
  original_source_object:
    term:
      id: GO:0007165
      label: signal transduction
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    qualifier: involved_in
    supporting_entities:
    - GO:0005179
  review:
    summary: The generic signaling inference is already entailed by retained hormone activity.
    action: TOO_GENERAL
    reason: GO_REF:0000108 derives this row from GO:0005179 using an inter-ontology link. The official typed path
      is hormone activity is_a receptor agonist activity (GO:0048018), part_of signal transduction (GO:0007165).
      Retained hormone row 3 therefore provides the more informative assertion. This is a positive but uninformative
      inference, not evidence that placensin lacks signaling effects, nor a claim that a particular receptor or
      complete intracellular pathway was identified in PMID:32329225. The cAMP/PKA response in PMID:32329225 is
      a downstream readout and does not by itself establish a G-protein-coupled receptor or the adenylate-cyclase-activating
      GPCR pathway. FBN1/asprosin has a separate source-specific GO:0007189 annotation supported by pharmacological
      observations; that assertion is not transferred to placensin by paralogy or a shared second messenger. No
      new signaling-pathway assertion is proposed.
    additional_reference_ids:
    - PMID:32329225
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: GO:0005179
        source_label: hormone activity
        source_status: SUPPORTS_TRANSFER
        comment: Actual GO_REF method and the two-edge typed GO path explain the inference. The target hormone evidence
          is retained.
      failure_modes:
      - GRANULARITY_MISMATCH
