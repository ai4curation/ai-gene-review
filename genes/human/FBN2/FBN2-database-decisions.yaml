  review:
    summary: Fibrillin-2 is a constituent of extracellular microfibrils.
    action: ACCEPT
    reason: The combined electronic record joins ARBA and mouse/Ensembl sources. Actual human fetal matrix localization
      and bovine microfibril immunogold in PMID:8120105, together with mouse Fbn2 matrix evidence in PMID:20855508,
      support the microfibrillar location. Mouse Q61555 has independent experimental microfibril records; the reciprocal
      electronic human/mouse annotations are not the only grounding. This concerns matrix fibrillin-2, not a claim
      that soluble placensin belongs to microfibrils.
    additional_reference_ids:
    - PMID:8120105
    - PMID:20855508
