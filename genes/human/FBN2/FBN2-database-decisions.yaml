  review:
    summary: Fibrillin-2 has a contextual structural role in the developing eye.
    action: KEEP_AS_NON_CORE
    reason: The actual ARBA00084629 rule predicts camera-type eye development. Human tissue observations in PMID:25406291
      identify FBN2-containing ECM around the developing lens, ciliary margins, corneal stroma, choroid and sclera,
      with stage-dependent distribution. This supports a bounded, non-core developmental structural inference, not
      proof from a human functional perturbation or a resolved mechanism of morphogenesis. The proposed early vascular
      scaffold for the future zonule remains a hypothesis. PMID:24899048 provides fetal ocular localization but
      its disease associations do not independently establish embryonic causality. The actual typed GO query does
      not place GO:0048048 below GO:0043010, so these rows are not collapsed by label similarity.
    additional_reference_ids:
    - PMID:25406291
    - PMID:24899048
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: ARBA:ARBA00084629
        source_label: ARBA00084629
        source_status: SUPPORTS_TRANSFER
        comment: Actual rule conditions and consequence read; the primate/FunFam condition pair is documented, but
          all rule training examples and exact current FunFam matches were not independently recovered. Human FBN2
          protein localization, not a FBN1-only title, grounds the contextual assessment.
