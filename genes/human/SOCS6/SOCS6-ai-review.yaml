id: O14544
gene_symbol: SOCS6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SOCS6 is a long-N-terminal SOCS-family SH2/SOCS-box protein that recognizes selected activated tyrosine
  kinases and promotes their ubiquitin-dependent downregulation. Its SH2 domain binds phosphotyrosine
  motifs in receptor tyrosine kinases such as KIT, while an N-terminal kinase-interacting domain binds
  active LCK in stimulated T cells and helps target LCK for ubiquitination and proteasomal degradation
  at the immunological synapse. SOCS6 is therefore best viewed as a substrate adaptor for active tyrosine
  kinases rather than as a direct JAK inhibitor.
