- term:
    id: GO:0035591
    label: signaling adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002228257
  - UniProtKB:Q9H6Q3
  review:
    summary: The SLA2-seeded PAINT signaling-adaptor assertion is compatible with SOCS6 substrate
      recognition.
    action: KEEP_AS_NON_CORE
    reason: PAINT places this assertion at a cross-family PTN002228257 node seeded by SLA2
      (UniProtKB:Q9H6Q3) outside PTHR10155; the inherited broad adaptor activity is compatible with
      SOCS6, which binds active tyrosine kinases and links them to ubiquitin-ligase machinery.
    supported_by:
    - reference_id: PMID:20007709
      supporting_text: SOCS-6 was identified as a protein binding to the kinase domain of p56(lck) 
        through yeast two-hybrid screening
