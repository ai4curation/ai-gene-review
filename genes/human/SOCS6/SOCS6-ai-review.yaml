- term:
    id: GO:1990756
    label: ubiquitin-like ligase-substrate adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:21030588
  review:
    summary: SOCS6 recognizes phosphorylated KIT and promotes ubiquitin-dependent turnover of 
      activated tyrosine kinases.
    action: NEW
    reason: The existing rows capture protein ubiquitination and LCK proteasomal degradation but 
      miss the direct MF for the SH2/SOCS-box receptor role; SOCS6 functions as a substrate adaptor 
      that recognizes phosphorylated KIT and active LCK for ubiquitination.
    supported_by:
    - reference_id: PMID:21030588
      supporting_text: We demonstrate that SOCS6 has ubiquitin ligase activity toward c-KIT and 
        regulates c-KIT protein turnover in cells
    - reference_id: PMID:20007709
      supporting_text: SOCS-6 promoted p56 lck ubiquitination and its subsequent targeting to the 
        proteasome
