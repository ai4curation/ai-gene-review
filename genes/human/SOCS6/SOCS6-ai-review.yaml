  evidence_type: TAS
  original_reference_id: PMID:9344848
  qualifier: involved_in
  review:
    summary: PMID:9344848 does not establish SOCS6 as a JAK-STAT-pathway regulator.
    action: MARK_AS_OVER_ANNOTATED
    reason: The cached abstract reports that JAB and CIS3, not CIS4/SOCS6, bound JAK2 and strongly 
