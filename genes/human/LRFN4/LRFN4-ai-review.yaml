core_functions:
- description: >-
    At the postsynaptic membrane, the LRFN4/SALM3 ectodomain binds the cell-adhesion
    receptors PTPRF, PTPRD and PTPRS on an apposed presynaptic membrane. Direct human
    ectodomain measurements establish the binding activity, while rodent neuronal,
    genetic and partial-structure studies show that the splice-dependent trans-synaptic
    complex promotes excitatory and inhibitory presynaptic differentiation and supports
    excitatory-synapse development. The extracellular SALM3 dimer and receptor-binding
    interfaces are required for synaptogenic activity, but no full-length human complex
    structure has been determined.
