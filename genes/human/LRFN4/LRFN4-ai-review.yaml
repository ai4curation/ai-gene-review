knowledge_gaps:
- gap_statement: >-
    The endogenous human-neuronal requirement for each SALM3-LAR-RPTP pair, the
    presynaptic splice isoforms that engage LRFN4, and the relative contribution of
    PTPRF, PTPRD and PTPRS to excitatory versus inhibitory presynapse assembly are
    unknown.
  boundary: >-
    Human ectodomains bind all three LAR-family receptors, and rodent experiments show
    mini-exon-dependent trans-synaptic binding and strong loss of SALM3-induced
    presynaptic differentiation after triple receptor knockdown. These findings do
    not resolve partner-specific occupancy or necessity in human neurons.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Partner- and splice-specific resolution is needed to connect the conserved human
    binding activity to physiological synapse organization and to avoid treating all
    ectodomain interactions as functionally equivalent.
  resolution: >-
    Use paired human excitatory and inhibitory neurons with compartment-specific
    endogenous tagging and single, combined and splice-selective LAR-RPTP perturbation,
    followed by interface-mutant rescue, proximity measurements, synaptic imaging and
    electrophysiology.
  provenance:
  - reference_id: PMID:26321637
    supporting_text: >-
      In triple knockdown of LAR-RPTPs, SALM3-induced synapsin I clustering was decreased by 85.2% ± 3.0%, suggesting that LAR-RPTPs play a major role in SALM3-dependent presynaptic differentiation.
    reference_section_type: RESULTS
- gap_statement: >-
    The architecture and conformational dynamics of full-length human LRFN4 alone and
    in a membrane-spanning LRFN4-LAR-RPTP adhesion complex have not been determined.
  boundary: >-
    Mouse SALM3 LRR fragments form stable antiparallel dimers, and SAXS supports a
    flexible 2:2 assembly of partial SALM3 and PTPσ ectodomains. The crystallized
    material is not full-length human LRFN4, and the low-resolution complex model is
    an ensemble average rather than a single rigid conformation.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    A full-length membrane-context structure would define how dimerization, splice-
    dependent receptor engagement and intracellular scaffold coupling are coordinated.
  resolution: >-
    Reconstitute glycosylated full-length human LRFN4 with defined human LAR-RPTP
