suggested_questions:
- question: >-
    Which human LAR-RPTP splice isoforms engage endogenous postsynaptic LRFN4, and
    which receptor is required for excitatory versus inhibitory presynapse assembly?
- question: >-
    How do the LRFN4 extracellular dimerization/receptor-binding interfaces and the
    cytoplasmic ESVV-PDZ interaction cooperate across the postsynaptic membrane?
- question: >-
    Which of DLG1, DLG2, DLG3, DLG4 and other PDZ scaffolds occupy endogenous LRFN4
    in human neurons, and how does tail-dependent binding control postsynaptic-density
    assembly and neurite growth?
- question: >-
    What activates LRFN4 in human monocytes, and how are 14-3-3, NCK1 and Rac1 ordered
    between LRFN4 engagement, actin remodeling and transendothelial migration?
- question: >-
    Do LRFN4-containing cis SALM homo- or heteromers control surface delivery,
    LAR-RPTP avidity or synaptic signaling without mediating SALM-SALM trans adhesion?
suggested_experiments:
- hypothesis: >-
    Endogenous human neuronal LRFN4 promotes presynapse assembly through a
    splice-selective trans interaction with LAR-family receptor phosphatases.
  description: >-
    Generate LRFN4-null human induced-pluripotent-stem-cell-derived neurons and rescue
    them with endogenous-level wild-type LRFN4 or structure-guided LRR-Ig interface
    mutants. Perturb PTPRF, PTPRD and PTPRS singly and combinatorially in the apposed
    presynaptic cells, control their mini-exon content, and quantify trans-synaptic
    proximity, excitatory and inhibitory presynaptic marker recruitment, synapse
    density and miniature synaptic currents.
  experiment_type: Direction- and splice-resolved human-neuron epistasis
- hypothesis: >-
    The human LRFN4 ESVV motif recruits a defined PDZ-scaffold ensemble that couples
    trans-synaptic adhesion to postsynaptic-density assembly.
  description: >-
    Introduce an endogenous ESVV deletion in human neurons and compare wild-type,
    motif-deleted and repaired cells by quantitative LRFN4 interactomics, proximity
    labeling, PSD nanostructure imaging, scaffold and receptor mobility measurements,
    neurite morphology and electrophysiological rescue.
  experiment_type: Endogenous PDZ-tail structure-function analysis
- hypothesis: >-
    Full-length LRFN4 and a mini-exon-containing LAR-RPTP form a flexible membrane-
    spanning 2:2 adhesion assembly whose dimer and receptor interfaces are both
    required for signaling.
  description: >-
    Purify glycosylated full-length human proteins, reconstitute them in nanodiscs or
    apposed supported membranes, determine stoichiometry and conformational ensembles
    by cryo-electron microscopy and cross-linking mass spectrometry, and test
    structure-guided interface mutants in matched neuron cocultures.
  experiment_type: Full-length membrane-complex structural analysis
- hypothesis: >-
    A stimulus-dependent extracellular interaction activates a distinct LRFN4-
    14-3-3-NCK1-Rac1 pathway that drives human monocyte migration.
  description: >-
    Endogenously tag LRFN4 in primary human monocytes and differentiated macrophages,
    use extracellular cross-linking and cytoplasmic proximity labeling across
    migration stimuli to identify upstream ligands and signaling partners, then test
    their order with acute perturbations, domain-specific rescue, live Rac1 biosensors,
    actin imaging and transendothelial-migration assays.
  experiment_type: Human monocyte ligand discovery and signaling epistasis
