  label: Homo sapiens
description: >-
  LRFN4 (SALM3) is a type-I transmembrane cell-adhesion molecule with extracellular
  leucine-rich-repeat, immunoglobulin-like and fibronectin type-III domains and a
  cytoplasmic C-terminal ESVV PDZ-binding motif. At postsynaptic membranes, SALM3
  engages presynaptic LAR-family receptor phosphatases in a splice-dependent
  trans-synaptic complex that promotes presynapse differentiation and excitatory
  synapse development; its cytoplasmic tail associates with PSD-95-family scaffolds
  and supports postsynaptic-density organization. In human monocytes and macrophages,
  LRFN4 also signals through 14-3-3, NCK1 and Rac1 to reorganize actin, regulate cell
  elongation and promote transendothelial migration. SALM3 can associate with other
  SALMs in cis but, unlike SALM4 and SALM5, does not mediate SALM-SALM homophilic
  trans-cellular adhesion.
