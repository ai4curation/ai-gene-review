    reference_section_type: RESULTS
- description: >-
    Human LRFN4/SALM3 directly interacts with DLG1, DLG2, DLG3 and DLG4, and deletion
    of terminal residues 633-635 abolishes DLG1, DLG3 and DLG4 binding, establishing
    the importance of the C-terminal PDZ-binding tail for those interactions. In
    rodent neurons, SALM3 forms a strong PSD-95 complex, is enriched in synaptic
    fractions and recruits PSD-95 when clustered on dendritic surfaces, linking the
    conserved tail activity to positive regulation of postsynaptic-density assembly.
    Endogenous partner occupancy and the tail's downstream role in human neurons
    remain unresolved; the reported deletion result does not state its effect on DLG2.
