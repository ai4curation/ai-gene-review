- gap_statement: >-
    Which of the demonstrated DLG1, DLG2, DLG3 and DLG4 partners, or other PDZ proteins,
    occupy endogenous LRFN4 in human neurons, and how that interaction module coordinates
    postsynaptic-density assembly with extracellular LAR-RPTP adhesion, remain unresolved.
  boundary: >-
