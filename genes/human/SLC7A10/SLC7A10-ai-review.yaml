core_functions:
- description: Catalytic light-chain subunit of the asc-1-SLC3A2/4F2hc heteromeric
    amino acid transporter; a sodium- and chloride-independent obligate antiporter
    (exchanger) that moves small neutral amino acids - glycine, L-alanine, L-serine,
    L-threonine, L-cysteine - and their D-isomers (notably high-affinity D-serine and
    D-alanine) across the plasma membrane, operating preferentially in exchange mode.
    Functional transport requires the disulfide-linked SLC3A2 heavy chain.
