- term:
    id: GO:1902495
    label: transmembrane transporter complex
  evidence_type: NAS
  original_reference_id: PMID:10734121
  qualifier: part_of
  review:
    summary: ComplexPortal assertion that asc-1 is part of a transmembrane transporter
      complex (the disulfide-linked Asc1-4F2hc/SLC3A2 heterodimer).
    action: MODIFY
    proposed_replacement_terms:
    - id: GO:1990184
      label: amino acid transport complex
    reason: GO:1990184 (amino acid transport complex) is the structurally accurate
      complex class for the asc-1-SLC3A2/4F2hc disulfide-linked heterodimer. This
      is a lateral MODIFY rather than an is_a refinement. Verified via OLS
      getAncestors, GO:1990184 is a child of GO:0032991 (protein-containing
      complex, via membrane protein complex and plasma membrane protein complex),
      and GO:1902495 (transmembrane transporter complex) is also a child of
      GO:0032991, so the two are siblings under GO:0032991. Same treatment applied
      to the batch-7 SLC7A5-A9 light chains. The SLC3A2 partnership is modeled here
      and as in_complex on the core function, not as bare protein binding.
    supported_by:
    - reference_id: PMID:10734121
      supporting_text: confirming that Asc-1 and 4F2hc are linked via a disulfide bond.
    - reference_id: PMID:10863037
      supporting_text: 4F2 heavy chain for its functional expression in Xenopus oocytes.
