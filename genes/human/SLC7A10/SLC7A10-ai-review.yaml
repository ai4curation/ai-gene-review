proposed_new_terms:
- proposed_name: small neutral amino acid to amino acid antiporter activity
  proposed_definition: Enables the obligatory, electroneutral 1:1 exchange of a small
    neutral amino acid (glycine, L-alanine, L-serine, L-threonine, L-cysteine, or
    their D-isomers including D-serine and D-alanine) on one side of a membrane for
    another neutral amino acid on the opposite side, in a sodium- and
    chloride-independent manner.
  justification: GO provides the generic GO:0015297 (antiporter activity) and the
    substrate-class GO:0015175 (neutral L-amino acid transmembrane transporter
    activity), but no single molecular-function term combining the obligatory-exchange
    mechanism with the small-neutral-amino-acid substrate class (system asc) that
    characterizes asc-1 (SLC7A10). Such a term - analogous to GO:0015327
    (cystine/glutamate antiporter activity) for xCT/SLC7A11 - would let asc-1 be
    annotated to one precise MF encoding both the antiport mechanism and its
    substrate set, matching the many Rhea exchange reactions curated in UniProt.
suggested_questions:
- question: >-
    Does human asc-1 operate as a strictly obligate antiporter, or does the
    facilitated-diffusion (net flux) mode contribute physiologically to extracellular
    D-serine and glycine levels in brain?
suggested_experiments:
- description: >-
    Reconstitute purified human asc-1-SLC3A2 in proteoliposomes with defined
    internal/external amino acid pools to quantify the exchange stoichiometry and the
    relative contribution of exchange versus facilitated diffusion for D-serine and
    glycine.
