taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Asc-1 (asc-type amino acid transporter 1) is the catalytic light-chain
  subunit of a heteromeric amino acid transporter (HAT). It is disulfide-linked to
  the heavy chain SLC3A2 (4F2hc/CD98hc), which is required for its folding, stability
  and plasma-membrane targeting. The complex is a sodium- and chloride-independent
  obligate antiporter (exchanger) of small neutral amino acids - glycine, L-alanine,
  L-serine, L-threonine, L-cysteine and alpha-aminoisobutyrate - and, distinctively,
  of their D-isomers, most notably D-serine and D-alanine, with D-serine transported
  at high affinity. Through this activity asc-1 governs extracellular and synaptic
  levels of the gliotransmitters D-serine (an NMDA-receptor co-agonist) and glycine
  in the central nervous system, modulating both glycinergic inhibitory transmission
  in the spinal cord/brainstem and NMDA-receptor-dependent glutamatergic transmission
  in the hippocampus. It is also expressed in adipose tissue, where its D-serine
  transport has been linked to white versus thermogenic adipocyte lineage commitment.
