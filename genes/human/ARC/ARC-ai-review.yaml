core_functions:
- description: 'Retroelement Gag-derived capsid protein. Arc self-assembles, through a seven-residue motif
    in an N-terminal helical coil and through conserved inter-protomer surfaces on both Gag lobes, into
    double-shelled virus-like particles roughly 32 nm across. This is the protein''s defining structural
    activity: it contributes to the integrity of a higher-order assembly, and disrupting the interface
    arrests the protein at the dimer stage. The assembly is RNA-dependent in the same way retroviral Gag
    assembly is - stripping bound nucleic acid suppresses capsid formation and adding back an unrelated
    mRNA restores it - and the requirement is quantitative rather than sequence-specific.'
  supported_by:
  - reference_id: PMID:33175445
    supporting_text: Within this region, we identified a 7-residue oligomerization motif, critical for
      the formation of virus-like capsids.
  - reference_id: PMID:33175445
    supporting_text: Purified wild-type Arc formed capsids as shown by transmission and cryo-electron
      microscopy, whereas mutant Arc with disruption of the oligomerization motif formed homogenous dimers.
  - reference_id: PMID:29328916
    supporting_text: prArc capsids exhibited a double-shell structure with a mean diameter of 32±0.2nm.
  - reference_id: PMID:29328916
    supporting_text: Stripping RNA resulted in significantly fewer fully-formed capsids (Figure 2E), suggesting
      that Arc capsids require RNA for normal assembly.
