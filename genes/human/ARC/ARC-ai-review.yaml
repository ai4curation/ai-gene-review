- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:O95935
  review:
    summary: 'A binary yeast two-hybrid interaction with TBX18 (a T-box transcription factor of the sclerotome
      and ureteric mesenchyme) from the HuRI reference interactome. UniProt records it as NbExp=3, which
      is three assay replicates inside that one screen, not three independent studies. There is no follow-up
      anywhere linking TBX18 to Arc biology: it does not appear in the Arc capsid, endocytosis, plasticity
      or nuclear literature, and it is not in UniProt''s SUBUNIT block.'
    action: REMOVE
    reason: 'Removed because GO:0005515 carries no functional information, not because the TBX18 interaction
      is false - the HuRI identification is reproducible and is retained in IntAct and in UniProt''s INTERACTION
      block, where it belongs. MODIFY is not available here: the screen is an all-by-all two-hybrid assay
      with no functional follow-up on this pair, so there is no evidence-supported molecular function
      to replace the term with, and inventing one from interaction evidence alone is exactly what the
      policy forbids. The contrast is instructive: the partners that do carry mechanism - endophilin 2/3,
      dynamin 2, CaMKIIbeta, PSEN1 - sit in UniProt''s SUBUNIT block only as ''By similarity'' and have
      no human IPI row at all, so the human interaction record for this gene is inverted with respect
      to biological importance. The informative molecular function the record was missing is added separately
      as GO:0030674 protein-macromolecule adaptor activity, on the characterised partners rather than
      on these four.'
    supported_by:
    - reference_id: file:human/ARC/ARC-uniprot.txt
      supporting_text: 'Q7LC44; O95935: TBX18; NbExp=3;'
    - reference_id: file:human/ARC/ARC-uniprot.txt
      supporting_text: 'SUBUNIT: Homooligomer; homooligomerizes into virion-like capsids'
