  review:
    summary: 'UniProt records ''Cytoplasmic vesicle, clathrin-coated vesicle membrane {ECO:0000269|PubMed:24945773}'',
      and the SubCell mapping turns that into GO:0030665. But the cited paper reports association with
      clathrin-coated PITS, not with the membrane of budded clathrin-coated vesicles: Mabb et al. used
      TIRF microscopy and described a pool of Arc at CCPs, with the association explicitly transient and
      compared to the CCP dynamics of endophilin-3 and dynamin-2. The distinction is not pedantic - GO:0005905
      is defined as the invagination on which a clathrin coat forms and which can then be converted by
      budding into a vesicle, whereas GO:0030665 is the lipid bilayer of the vesicle that has already
      budded. A protein that arrives before scission and departs with uncoating is at the pit.'
    action: MODIFY
    reason: The evidence of record supports the sibling term. Mabb et al. also observed a large fraction
      of Arc surface events that did not co-localise with CCPs at all, and suggested Arc may act in clathrin-independent,
      dynamin-dependent endocytosis, which argues further against committing Arc to the coated vesicle
      itself. GO:0005905 resolves and sits under the endomembrane system, so the replacement is well-formed.
    proposed_replacement_terms:
    - id: GO:0005905
      label: clathrin-coated pit
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
