- description: 'Postsynaptic endocytic adaptor for AMPA receptor removal. Arc bridges the endocytic machinery
    to the postsynaptic membrane: separate regions of the protein bind endophilin 2/3 and dynamin 2, both
    interactions are needed for endosome association, and the resulting assembly accelerates internalisation
    of AMPA-type glutamate receptors into early endosomes. The role is that of an adaptor bringing components
    together rather than of an enzyme - Arc has no catalytic activity - and it is the same oligomerisation
    interface that supports capsid formation, since mutating the coil motif blocks Arc-facilitated endocytosis.
    Membrane attachment is by palmitoylation of an N-terminal cysteine cluster, not by a transmembrane
    segment. Perturbation works in both directions: losing Arc raises surface AMPA receptors and slows
    endocytosis, raising Arc blocks the inactivity-induced increase.'
