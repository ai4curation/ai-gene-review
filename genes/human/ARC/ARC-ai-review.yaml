- description: 'Consolidation switch for activity-dependent plasticity and memory. Arc is induced within
    minutes of plasticity-inducing activity and is then required for changes to persist: blocking its
    expression leaves LTP induction intact but abolishes maintenance, and leaves task acquisition and
    short-term memory intact but abolishes consolidation of long-term memory. Arc-null animals show the
    same dissociation as a biphasic LTP phenotype - enhanced early phase, absent late phase - together
    with impaired long-term depression. The switch is gated at the oligomerisation interface: CaMKII phosphorylation
    of the Gag N-lobe disrupts high-order assembly, and a phosphorylation-resistant knock-in alters the
    magnitude of metabotropic-receptor LTD.'
