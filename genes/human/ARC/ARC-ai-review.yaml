- description: 'RNA capture and intercellular delivery. Arc binds mRNA and packages it inside the capsid,
    which is then released from neurons in extracellular vesicles, endocytosed by recipient neurons, and
    delivers its cargo into their cytoplasm where it remains available for activity-dependent translation.
    RNase treatment of purified capsids does not abolish transfer, showing the cargo is genuinely enclosed,
    and capsids stripped of RNA fail to be taken up at all. Binding is not transcript-selective: what
    makes Arc mRNA the dominant cargo is its abundance at the site of Arc synthesis, not recognition of
    a specific element.'
  supported_by:
