    reason: Not wrong in spirit - Arc does influence spine structure through local actin regulation during
      LTP consolidation - but involved_in GO:0060997 claims participation in the morphogenetic process
      itself, which no experiment in this reference supports. The defensible version of the claim is already
      on the gene as GO:0061001 regulation of dendritic spine morphogenesis, so nothing is lost by marking
      this one down rather than proposing a replacement that duplicates an existing row.
    supported_by:
    - reference_id: PMID:15537891
      supporting_text: Arc protein is coupled to F-actin and linked functionally to spine morphology,
        and its chronic overexpression has been suggested to generate abnormal spine structure ( Kelly
        and Deadwyler, 2003 ).
