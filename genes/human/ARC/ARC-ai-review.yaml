        source_label: UniProt SubCell keyword SL-0071, Clathrin-coated vesicle membrane
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The SubCell keyword Clathrin-coated vesicle membrane is the proximate source, anchored
          to ECO:0000269|PubMed:24945773. The citation is correct and the compartment family is right,
          but the paper's observation is pit association, not coated-vesicle membrane residence, so the
          keyword - and the GO term it maps to - overshoots by one step along the endocytic pathway.
    supported_by:
