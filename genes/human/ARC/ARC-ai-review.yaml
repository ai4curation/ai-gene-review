id: Q7LC44
gene_symbol: ARC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'ARC (activity-regulated cytoskeleton-associated protein, Arg3.1) is a neuronal immediate-early
  gene product that is, structurally and functionally, a domesticated retrotransposon capsid protein.
  Its 396-residue chain folds into two lobes whose arrangement matches the capsid domain of retroviral
  Gag polyproteins, and tetrapod Arc genes derive from a vertebrate lineage of Ty3/gypsy retrotransposons;
  fly Arc genes come from a separate insect lineage of the same element family, so the two are convergent
  domestications rather than orthologues of a single cellular ancestor.


  The protein does two things that reflect that ancestry. First, it self-assembles. A short helical coil
  in the N-terminal domain drives oligomerisation beyond the dimer stage, and the assembled protein forms
  double-shelled capsids roughly 32 nm across that encapsidate RNA. RNA is required for efficient assembly,
  and the RNA taken up is not sequence-selective - abundant transcripts are packaged roughly in proportion
  to their abundance, with Arc''s own mRNA prominent because it is abundant where Arc is made. Neurons
  release these capsids in extracellular vesicles; recipient neurons endocytose them, and the delivered
  mRNA reaches the cytoplasm where it can be translated on demand. Arc is therefore a vehicle for intercellular
  RNA transfer in the nervous system.


  Second, Arc weakens synapses. Induced within minutes of strong activity and delivered as mRNA to stimulated
  dendritic regions, the protein accumulates at the postsynaptic density and the lateral margins of dendritic
  spines, anchored to the membrane by palmitoylation of an N-terminal cysteine cluster rather than by
  a transmembrane segment. There it binds endophilin 2/3 and dynamin 2 through separate regions and accelerates
  clathrin- and dynamin-dependent endocytosis of AMPA-type glutamate receptors into early endosomes. Losing
  Arc raises surface AMPA receptor levels and slows their internalisation; raising Arc does the reverse.
  This single mechanism underlies the late, protein-synthesis-dependent phase of long-term potentiation,
  metabotropic-receptor long-term depression, homeostatic downscaling of synaptic strength during chronic
  inactivity, and the consolidation of long-term memory. Targeting is paradoxical and deliberate: CaMKII-beta
  in its calmodulin-free state recruits Arc preferentially to synapses that have fallen silent, so the
  protein prunes the weak rather than the active. A separate nuclear pool, controlled by a dedicated localisation
  signal, retention domain and export signal, raises promyelocytic leukaemia body formation and lowers
  GluA1 transcription, giving the same downscaling by a transcriptional route. During cerebellar development
  Arc mediates the final stage of climbing-fibre synapse elimination.


  Both activities depend on the same interface. Mutating the seven-residue oligomerisation motif abolishes
  capsid formation and also blocks Arc-facilitated endocytosis; CaMKII phosphorylation of the Gag N-lobe
  disrupts the same surface and switches high-order assembly off. Protein levels are held brief by ubiquitination
  - by RNF216/Triad3A at two adjacent lysines, and by UBE3A - so that the signal is transient. Outside
  the nervous system, Arc is confined to skin-migratory dendritic cells, where it accelerates migration
  through myosin II-dependent actin dynamics and thereby shapes T-cell activation.'
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: InterPro2GO. The single mapping it supplies here is IPR023263 -> GO:0003729 mRNA binding.
      Unusually safe for an InterPro2GO rule because IPR023263 is the Arc family signature itself, with
      one member per tetrapod genome, rather than a broad Gag superfamily signature; the rule therefore
      asserts of Arc what was demonstrated for Arc.
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by curator
    judgment of sequence similarity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Supplies 18 of the 57 rows. Every one traces, via QuickGO, to a named experimental annotation
      on rat Arc (Q63053) or mouse Arc (Q9WV31). Human, mouse and rat Arc are all 396 aa and the gene
      is single-copy in mammals, so there is no paralogue-confusion risk. The one donor row whose own
      evidence is contextual is GO:0061001 (an ARUK-UCL IGI on PMID:15537891), noted on that annotation.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'PAINT/IBA. The six IBA rows all descend from one node, PTN008562333 of PTHR15962, placed
      at Tetrapoda (taxon:32523). Verified against the fetched PAINT slice. The placement is the substantive
      curation act here: PANTHER puts Drosophila Arc1 in the same family and subfamily, but the node excludes
      it, which is correct because the fly and tetrapod genes are independent Ty3/gypsy domestications.
      Confirmed empirically - dArc1 receives no IBA from this node.'
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping,
    accompanied by conservative changes to GO terms applied by UniProt
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Supplies nine CC rows from SubCell keywords. The mapping mechanism is sound; the variable
      is what each keyword is anchored to on the human record. Two are anchored to citations that do not
      support them: SL-0090 Cytoskeleton (ECO:0000269|PubMed:21834987, a paper showing diffuse cytoplasmic
      GFP-ARC plus an actin phenotype, not cytoskeletal localisation) and SL-0071 Clathrin-coated vesicle
      membrane (ECO:0000269|PubMed:24945773, which reports coated-PIT association). Both are handled on
      the corresponding rows.'
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using Ensembl
    Compara
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Eight rows, all projected from mouse Arc (Q9WV31 / ENSMUSP00000023268). Note that UniProtKB:Q9WV31
      and ensembl:ENSMUSP00000023268 in these WITH/FROM columns are the same entity under two identifiers,
      so a two-item list here is one donor, not two. Most of the projections are well founded; GO:0071598
      inherits the weakness of its mouse source.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Three rows combining Compara projection from mouse Arc with a SubCell keyword and, for
      GO:0050804, the InterPro signature. All three land on terms that the manual evidence independently
      supports.
- id: PMID:7857651
  title: Arc, a growth factor and activity-regulated gene, encodes a novel cytoskeleton-associated protein
    that is enriched in neuronal dendrites.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The discovery paper, and the sole recorded seed behind the GO:0048168 IBD via rat Arc's
      RGD IEP row. Verified against the fetched PubMed record. It establishes activity-dependent induction,
      dendritic enrichment of mRNA and protein, F-actin co-precipitation and subplasmalemmal-cortex localisation
      - so it correctly underpins the cell cortex and cytoskeleton claims - but its own plasticity conclusion
      is explicitly hypothetical, which is why an IEP code from it is thin support for a process annotation.
      Abstract-only in cache.
  full_text_unavailable: true
- id: PMID:10818134
  title: Inhibition of activity-dependent arc protein expression in the rat hippocampus impairs the maintenance
    of long-term potentiation and the consolidation of long-term memory.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'One of the two IMP seeds behind the GO:1900271 IBD, and the donor evidence behind the
      rat-sourced long-term memory ISS. The design carries the argument: antisense knockdown dissociates
      LTP maintenance from LTP induction and memory consolidation from acquisition, which is what justifies
      the regulation-of formulation rather than a bare participation claim. Abstract-only in cache.'
  full_text_unavailable: true
- id: PMID:12493697
  title: Developmental association of the synaptic activity-regulated protein arc with the mouse acrosomal
    organelle and the sperm tail.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: The entire basis of the acrosomal vesicle annotation, reached via UniProt's ECO:0000250|UniProtKB:Q9WV31
      SubCell entry. A single 2003 mouse immunofluorescence study with no follow-up; nothing human, and
      nothing connecting the germ-cell pool to Arc's characterised functions. Abstract-only in cache.
  full_text_unavailable: true
- id: PMID:15537891
  title: Synaptic targeting by Alzheimer's-related amyloid beta oligomers.
  reference_review:
    relevance: LOW
    correctness: MISCITED
    review_notes: 'An amyloid-beta oligomer paper, not an Arc paper: Arc appears as a readout of aberrant
      synaptic induction. It carries four ARUK-UCL TAS rows on the human gene plus the rat IGI behind
      GO:0061001. A reference-projection check (QuickGO by reference, paginated) returns 16 annotations
      over only four entities, so it is gene-specific rather than boilerplate - but its Arc statements
      are second-hand citations of Guzowski, Steward and Kelly. Marked MISCITED for the GO:0060997 row
      specifically: the sentence used there reports that chronic overexpression ''has been suggested''
      to distort spine structure, which does not support an involved_in dendritic spine morphogenesis
      annotation. The long-term memory and LTP statements it also supports are accurate.'
- id: PMID:17088210
  title: Arc/Arg3.1 is essential for the consolidation of synaptic plasticity and memories.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The germline Arc/Arg3.1 knockout. Supplies the loss-of-function direction for long-term
      memory, LTP and LTD, and the biphasic LTP phenotype (enhanced early, absent late) that makes 'regulation
      of' the right formulation. Abstract-only in cache, which is enough for the claims used here.
  full_text_unavailable: true
- id: PMID:17088211
  title: Arc/Arg3.1 interacts with the endocytic machinery to regulate AMPA receptor trafficking.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The mechanistic core of the synaptic half of this gene, and the donor evidence behind
      more rows in this file than any other paper - GO:0014069, GO:0031901, GO:0005886, GO:0045202, GO:0098978
      and GO:0099149 all trace here. Full text verified: separate endophilin and dynamin interaction regions,
      immunogold EM at the PSD and its lateral margins, early-endosome co-localisation with transferrin
      receptor but not LAMP1, and bidirectional perturbation.'
- id: PMID:17088213
  title: Arc/Arg3.1 mediates homeostatic synaptic scaling of AMPA receptors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Establishes the homeostatic-scaling arm with both perturbation directions in one paper:
      overexpression blocks the inactivity-induced rise in surface AMPARs, knockout abolishes scaling.
      Not cited by any GOA row, but it is what makes GO:0048168 and GO:0050804 defensible beyond their
      recorded seeds.'
- id: PMID:17898216
  title: Sustained Arc/Arg3.1 synthesis controls long-term potentiation consolidation through regulation
    of local actin polymerization in the dentate gyrus in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Donor evidence behind rat Arc''s GO:0045202 rows and the strongest in vivo support
      for the actin/spine-regulation claims. Full text verified. It is the reason GO:0061001 is kept while
      GO:0060997 is not: Arc regulates local actin polymerisation, and spine and PSD expansion follow,
      rather than Arc executing spine morphogenesis.'
- id: PMID:21834987
  title: Identification and characterization of a set of conserved and new regulators of cytoskeletal
    organization, cell morphology and migration.
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: 'The source of both human IDAs in this file (GO:0005737, GO:0005886) and, via UniProt,
      of the cytoskeleton SubCell keyword. Full text verified. Two problems, neither fatal: the localisation
      data are GFP-ARC overexpressed in PC3 prostate carcinoma cells, which do not express ARC, and the
      paper carries a 2024 author correction stating that the siARC panels of Fig. 6 duplicated the siZRANB1
      panels. The correction affects the knockdown figure rather than the localisation figure and the
      authors state the conclusions are unaffected, but it is a data-integrity event on this gene''s panels
      and the rows resting on it are graded accordingly. It is also the source of the useful and independently
      checkable fact that ARC has no closely related mammalian paralogue.'
- id: PMID:22036569
  title: Arc/Arg3.1 regulates an endosomal pathway essential for activity-dependent beta-amyloid generation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Donor evidence behind mouse Arc's GO:0005886 and GO:0045211 rows. Its one-sentence statement
      of the mechanism - Arc recruits endophilin2/3 and dynamin to early/recycling endosomes trafficking
      AMPA receptors - is the cleanest summary of the postsynaptic function in the literature. Also the
      origin of UniProt's PSEN1/APP statements. Abstract-only in cache.
  full_text_unavailable: true
- id: PMID:22579289
  title: Inverse synaptic tagging of inactive synapses via dynamic interaction of Arc/Arg3.1 with CaMKIIbeta.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Donor evidence behind a rat Arc GO:0045202 EXP row, and the explanation for UniProt''s
      otherwise cryptic ''Targeted to inactive synapses following interaction with CAMK2B in the kinase
      inactive state''. Full text verified. It is why Arc''s synaptic targeting is counter-intuitive:
      the protein goes to synapses that have gone quiet, not to active ones.'
- id: PMID:23749147
  title: Arc in the nucleus regulates PML-dependent GluA1 transcription and homeostatic plasticity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The basis of the NEW GO:0005634 row. Full text verified: activity-regulated nuclear
      expression in vivo and in vitro, a mapped NLS, nuclear retention domain and NES, and a PML-dependent
      transcriptional route to synaptic downscaling. The absence of any nuclear CC term for human ARC
      in GOA is the clearest compartment gap in this record.'
- id: PMID:23791196
  title: Arc/Arg3.1 is a postsynaptic mediator of activity-dependent synapse elimination in the developing
    cerebellum.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The basis of the NEW GO:0098883 row, and the source of UniProt's by-similarity statement
      about climbing-fibre synapse elimination. Purkinje-cell-specific knockdown with an occlusion experiment
      placing Arc downstream of P/Q-type VDCCs, which is stronger than a correlative developmental observation.
      Abstract-only in cache.
  full_text_unavailable: true
- id: PMID:23936366
  title: Conditional knockout of tumor overexpressed gene in mouse neurons affects RNA granule assembly,
    granule translation, LTP and short term habituation.
  reference_review:
    relevance: MEDIUM
    correctness: MISCITED
    review_notes: The sole gene-level seed behind the GO:0071598 IBD, and the reason that row is downgraded.
      Full text verified. The paper is about TOG/Ckap5; Arc enters it as the A2RE reporter TRANSCRIPT
      used to count granules, with Arc protein measured only as nascent translation output near granules
      and as bulk immunostaining intensity. It is a real Arc observation but it is about Arc mRNA as granule
      cargo, so it does not establish the Arc protein as a constituent of a neuronal RNP granule. Marked
      MISCITED for that specific claim; the paper is not itself flawed. Found only by donor tracing -
      its title makes it unreachable from any Arc keyword search.
- id: PMID:24945773
  title: Triad3A regulates synaptic strength by ubiquitination of Arc.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: UniProt's cited source for the Lys-268/Lys-269 ubiquitination sites and for the clathrin-coated
      vesicle membrane location. Full text verified. Supports the first unreservedly; the second is the
      basis for the MODIFY to GO:0005905, because what the paper reports is transient association with
      clathrin-coated PITS, plus a large fraction of surface Arc events with no CCP co-localisation at
      all.
- id: PMID:25748042
  title: Arc is a flexible modular protein capable of reversible self-oligomerization.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The only paper in this set that worked on purified recombinant HUMAN Arc. Full text
      verified. It demonstrates reversible self-association into large soluble oligomers by DLS, AFM and
      EM, and a large conformational change on presenilin-1 peptide binding. GOA does not cite it anywhere,
      so GO:0051260 sits as an ISS from rat when direct human evidence exists.
- id: PMID:25864631
  title: 'Structural basis of arc binding to synaptic proteins: implications for cognitive disease.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Crystal structures of both Arc lobes, establishing the bi-lobar Gag architecture and
      naming the N-lobe and C-lobe. Full text verified. Also records the functional corollary of the convergence
      argument: insect Arc domestication followed a different path, with a role in stress-induced behaviour
      rather than learning and memory.'
- id: PMID:28783680
  title: Arc/Arg3.1 governs inflammatory dendritic cell migration from the skin and thereby controls T
    cell activation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: The basis of the NEW GO:0036336 row and the source of UniProt's immune-system FUNCTION
      statement, which GO does not currently reflect at all. Mouse work; the mechanism given is myosin
      II-dependent actin dynamics, which is the one demonstrated functional payoff of the protein's 'cytoskeleton-associated'
      name outside neurons. Abstract-only in cache.
  full_text_unavailable: true
- id: PMID:29264923
  title: 'Palmitoylation and Membrane Binding of Arc/Arg3.1: A Potential Role in Synaptic Depression.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Donor evidence behind three separate rows (GO:0045121, GO:0050804, GO:1900452) and
      the mechanistic explanation for why a protein with no transmembrane segment is annotated to membranes
      at all. Full text verified: the 94-CLCRC-98 motif, ~50% of detergent-insoluble synaptosomal Arc
      in raft fractions, and abolition of Arc-dependent synaptic depression when the cysteines are mutated.
      Reachable only through the mouse donor, not by keyword search on the gene.'
- id: PMID:29328915
  title: Retrovirus-like Gag Protein Arc1 Binds RNA and Traffics across Synaptic Boutons.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'The Drosophila companion paper. Not evidence for the human protein and not cited by
      any row here, but it is what makes the PANTHER family question answerable: dArc1 independently earned
      IDA annotations for capsid formation, mRNA binding, intercellular vesicle transport and regulation
      of neuronal synaptic plasticity - nearly the same term set human ARC holds - which is why placing
      the IBD node at Tetrapoda rather than at the family root matters.'
- id: PMID:29328916
  title: The Neuronal Gene Arc Encodes a Repurposed Retrotransposon Gag Protein that Mediates Intercellular
    RNA Transfer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The single most important paper for this gene, and the donor evidence behind five human
      ISS rows (GO:0003729, GO:0051028, GO:0051260, GO:0110077, GO:1903561). Full text verified. Capsid
      assembly, RNA dependence of assembly, non-selective RNA packaging, EV release requiring an intact
      C-terminal domain, neuron-to-neuron mRNA transfer with Arc-null recipients as the control, and the
      phylogenomic analysis placing tetrapod Arc orthologues throughout tetrapods and absent from fish
      - which is exactly the clade boundary the PAINT node uses. All experiments used rat Arc, so it is
      ISS-grade for human.
- id: PMID:31151856
  title: 'Arc Oligomerization Is Regulated by CaMKII Phosphorylation of the GAG Domain: An Essential Mechanism
    for Plasticity and Memory Formation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Donor evidence behind mouse Arc''s GO:0007616, GO:1900271, GO:0043197, GO:0030425 and
      GO:0050804 rows. Full text verified. One caveat recorded on the GO:1900271 ISS row: in the knock-in
      model hippocampal LTP was explicitly normal and it was mGluR-LTD that changed, so this paper is
      a stronger source for the LTD terms than for the LTP ones.'
- id: PMID:32296183
  title: A reference map of the human binary protein interactome.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: HuRI. The source of all four GO:0005515 rows. The identifications are correct and reproducible
      - UniProt records NbExp=3, which is three assay replicates within this one screen rather than three
      independent studies - but none of the four partners (TBX18, S100P, CSRP2, SH2D4A) has any follow-up
      with Arc. Correctly cited, uninformative for function.
- id: PMID:33175445
  title: Arc self-association and formation of virus-like capsids are mediated by an N-terminal helical
    coil motif.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The reference behind all three human IDAs and, through human ARC''s own accession,
      behind two of the six IBD seeds. Cache is abstract-only and the abstract says ''mammalian Arc''
      without naming a species for the capsid preparations, which is the one thing that could not be checked
      directly. The human anchor is nonetheless solid: UniProt cross-references PDB 6YTU (0.95 A, chains
      A/B = residues 99-132) to Q7LC44, and the RCSB entry gives the source organism as Homo sapiens with
      the sequence XQETIANLERWVKREMHVWREVFYRLERWADRLES, which is the human 99-132 segment. Accepted per
      project policy on experimental annotations whose full text is unavailable.'
  full_text_unavailable: true
- id: PMID:39390519
  title: 'Author Correction: Identification and characterization of a set of conserved and new regulators
    of cytoskeletal organization, cell morphology and migration.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'The 2024 correction to PMID:21834987, recorded here because it concerns this gene''s
      panels specifically. Full text verified: the siARC images in Fig. 6 duplicated the siZRANB1 images
      and have been replaced; the authors state the conclusions are unaffected. It does not touch Fig.
      8, which is where the GO:0005737 and GO:0005886 IDAs come from, but it is why those rows are graded
      non-core rather than accepted at face value.'
- id: Reactome:R-HSA-9031624
  title: ARC gene expression
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: A Reactome expression pathway, the source of the cytosol TAS row. Correct and uncontroversial
      as a compartment assignment for a newly translated protein with no signal peptide or transmembrane
      segment, but it is a pathway-diagram statement rather than an observation, and it says nothing about
      function.
- id: file:human/ARC/ARC-uniprot.txt
  title: UniProtKB Q7LC44 (ARC_HUMAN) flat file
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The Swiss-Prot record fetched by the pipeline, entry version 156 of 02-SEP-2026. Used
      for sequence length, feature table, subcellular locations, PTMs and the DOMAIN block's statement
      of independent tetrapod and fly domestication. Accession verified as Q7LC44 (ARC_HUMAN, 396 aa),
      which matters here because the affinage prefetch returned O60936 (NOL3) under the same symbol. Note
      that most of its FUNCTION and SUBCELLULAR LOCATION statements are ECO:0000250 by-similarity from
      rat Q63053 and mouse Q9WV31, and that two of its ECO:0000269 anchors over-read their citations (see
      GO_REF:0000044).
existing_annotations:
- term:
    id: GO:0001669
    label: acrosomal vesicle
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0007
  review:
    summary: Arc protein was detected in the developing acrosome of mouse spermatids and in the acrosomal
      region, neck and principal piece of mature mouse sperm. That single mouse study is the entire basis
      of the claim; UniProt records the human location as 'Cytoplasmic vesicle, secretory vesicle, acrosome
      {ECO:0000250|UniProtKB:Q9WV31}', i.e. by similarity from mouse, and the SubCell-to-GO mapping then
      converts that by-similarity statement into a GO annotation on the human protein.
    action: KEEP_AS_NON_CORE
    reason: Plausible and not contradicted, but three steps removed from any human observation and orthogonal
      to everything Arc is known for. The germ-cell pool is also biochemically different from the neuronal
      one - Arc is lost during capacitation and the acrosome reaction - so this is a distinct context
      rather than a refinement of the synaptic localisation. Peripheral.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: UniProtKB-SubCell:SL-0007
        source_label: UniProt SubCell keyword SL-0007, Acrosome
        source_status: SOURCE_WEAK_OR_INFERRED
        comment: The SubCell keyword Acrosome is the proximate source of this IEA. Its entry on the human
          record carries ECO:0000250|UniProtKB:Q9WV31, so the chain is mouse immunofluorescence (PMID:12493697)
          -> UniProt by-similarity on Q7LC44 -> SubCell keyword -> GO IEA. No human evidence exists at
          any point in that chain, and the underlying observation is a single 2003 study that has not
          been followed up.
    supported_by:
    - reference_id: PMID:12493697
      supporting_text: In isolated mature sperm, arc is present in the acrosomal region of the sperm head,
        the centriole region of the neck, and the principal piece of the tail.
    - reference_id: file:human/ARC/ARC-uniprot.txt
      supporting_text: acrosome {ECO:0000250|UniProtKB:Q9WV31}. Cytoplasmic vesicle, clathrin-
    additional_reference_ids:
    - PMID:12493697
- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IDA
  original_reference_id: PMID:33175445
  qualifier: enables
  review:
    summary: 'Arc binds mRNA, and the binding is functionally coupled to its capsid activity rather than
      incidental. Eriksen et al. showed by single-molecule photobleaching that Arc mRNA drives Arc into
      higher-order oligomers, and that this depends on the same 7-residue N-terminal oligomerisation motif
      that is required for capsid formation. Pastuzyn et al. showed the converse in purified material:
      stripping nucleic acid from recombinant Arc suppresses capsid assembly and adding GFP mRNA back
      restores it. The binding is not sequence-selective - Arc capsids purified from bacteria package
      abundant cellular RNA roughly in proportion to its abundance - so mRNA binding here means ''binds
      mRNA as the RNA cargo of a Gag-like capsid'', not ''recognises a specific transcript''. The GO term
      is still the right one: mRNA is what is demonstrably bound and what is demonstrably transferred
      between cells.'
    action: ACCEPT
    reason: RNA binding is one half of what a domesticated Gag protein does, and it is the half that makes
      the intercellular mRNA transfer possible. The IDA is on the human protein and FlyBase curators read
      the full text; the human anchor in that paper is the 0.95 A structure of the human oligomerisation
      coil, PDB 6YTU, which UniProt cross-references to Q7LC44 over residues 99-132. Core.
    supported_by:
    - reference_id: PMID:33175445
      supporting_text: Furthermore, using single-molecule photobleaching, we show that Arc mRNA greatly
        enhances higher-order oligomerization in a manner dependent on the oligomerization motif.
    - reference_id: PMID:29328916
      supporting_text: Stripping RNA resulted in significantly fewer fully-formed capsids (Figure 2E),
        suggesting that Arc capsids require RNA for normal assembly.
    - reference_id: PMID:29328916
