proposed_new_terms:
- proposed_name: virus-like capsid assembly
  proposed_definition: The aggregation, arrangement and bonding together of protein subunits encoded by
    endogenous, non-viral genes to form a virus-like capsid, a non-infectious protein coat that surrounds
    nucleic acid.
  proposed_parent:
    id: GO:0065003
    label: protein-containing complex assembly
  justification: 'GO already recognises the product of this process: GO:0170047 virus-like capsid is a
    cellular component whose definition explicitly names fly and tetrapod Arc. There is no corresponding
    biological-process term. The only capsid-assembly terms in the ontology are viral - GO:0019069 viral
    capsid assembly and its children GO:0039708 and GO:0039709 - and none of them can be used for a protein
    encoded by a host gene that assembles a non-infectious particle. As a result the assembly step of
    Arc, the step that every other Arc function depends on, has to be annotated as GO:0051260 protein
    homooligomerization, which is true of any trimer and says nothing about the shell. The same gap will
    be hit by every domesticated Gag gene as they are curated: fly Arc1 and Arc2, the PNMA/MOAP family,
    and PEG10 and the other retroelement-derived mammalian genes.'
  supported_by:
  - reference_id: PMID:29328916
    supporting_text: Here, we show that Arc self-assembles into virus-like capsids that encapsulate RNA.
  - reference_id: PMID:33175445
    supporting_text: In conclusion, a helical coil in the Arc NT domain supports self-association above
      the dimer stage, mRNA-induced oligomerization, and formation of virus-like capsids.
  - reference_id: PMID:29328915
    supporting_text: Here, we report that the Drosophila Arc1 protein forms capsid-like structures that
      bind darc1 mRNA in neurons and is loaded into extracellular vesicles that are transferred from motorneurons
      to muscles.
- proposed_name: structural constituent of virus-like capsid
  proposed_definition: The action of a molecule that contributes to the structural integrity of a virus-like
    capsid, a non-infectious protein coat encoded by endogenous, non-viral genes that surrounds nucleic
    acid.
  proposed_parent:
    id: GO:0005198
    label: structural molecule activity
  justification: The molecular-function half of the same gap. GO:0039660 structural constituent of virion
    exists for viral capsid proteins, but a domesticated Gag protein cannot use it, so Arc's capsid role
    is annotated to the bare parent GO:0005198 structural molecule activity - a term shared with keratins,
    tubulins and ribosomal proteins. A sibling of GO:0039660 under GO:0005198 would make the annotation
    say what the structure actually is, and would pair with the CC term GO:0170047 that already exists.
  supported_by:
  - reference_id: PMID:25864631
    supporting_text: We report crystal structures of Arc subdomains that form a bi-lobar architecture
      remarkably similar to the capsid domain of human immunodeficiency virus (HIV) gag protein.
  - reference_id: PMID:33175445
    supporting_text: Purified wild-type Arc formed capsids as shown by transmission and cryo-electron
      microscopy, whereas mutant Arc with disruption of the oligomerization motif formed homogenous dimers.
knowledge_gaps:
- gap_statement: Almost nothing about Arc's function has been measured on the human protein. Of the 57
    GOA rows, three IDAs rest on one structural paper and two more on an overexpression experiment in
    a carcinoma cell line; everything mechanistic is rat or mouse, reaching the human record through ISS,
    IBA and Compara projection.
  boundary: 'Firmly established for the human protein: the sequence is 396 aa with the Gag N-lobe and
    C-lobe solved on human material (PDB 6TN7, 6TNQ, 6TQ0, 6YTU, 7R1Z, 7R23, 8QF4, 8QF5); purified recombinant
    human Arc reversibly self-associates into large soluble oligomers; and the 0.95 A structure of the
    human oligomerisation coil exists. Not established for the human protein: that human Arc capsids form,
    package RNA, are released in extracellular vesicles, transfer mRNA between human neurons, bind human
    endophilin or dynamin, or drive AMPA receptor endocytosis in human neurons. Every one of those is
    rodent-only.'
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: NARROWING
  significance: 'Human and rodent Arc are the same length and highly conserved, so the transfers are reasonable
    and the annotations are honestly coded. But ARC is implicated in human neurodevelopmental and neurodegenerative
    disease, and there is a specific reason to check: the capsid pathway is a horizontal-transfer mechanism
    whose efficiency could differ between species without any change to the fold. Human iPSC-derived neurons
    make this testable now.'
  resolution: 'Repeat the core Pastuzyn experiments with human sequence and human cells: purify recombinant
    human Arc and look for 32 nm double-shelled particles by cryo-EM; isolate extracellular vesicles from
    human iPSC-derived cortical neurons and assay Arc protein and ARC mRNA content; and test neuron-to-neuron
    transfer using ARC-knockout human neurons as recipients.'
- gap_statement: It is unresolved whether the Arc protein is a component of canonical dendritic transport
    RNP granules, or whether its only RNA-containing assembly is the virus-like capsid.
  boundary: 'Established: ARC mRNA carries an A2RE element, is a bona fide granule cargo, and is translated
    in bursts at granules; and Arc protein binds RNA and builds capsids that encapsidate it. Not established:
    that Arc protein resides in the granules that carry its transcript. The single annotation asserting
    it (mouse Arc IDA on PMID:23936366, which seeds the human IBA) comes from a TOG/Ckap5 knockout study
    in which Arc protein is imaged only as nascent translation output near granules.'
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: CC_DARK
  status: OPEN
  significance: The two structures have opposite fates - a transport granule keeps mRNA inside the cell
    and releases it at a synapse, a capsid exports it to another cell - so which one Arc protein occupies
    determines whether GO:0071598 or GO:0170047 describes its RNA-associated pool. At present the record
    asserts both, on very unequal evidence.
  resolution: 'Co-immunostain endogenous Arc protein with established granule markers (hnRNP A2, Staufen,
    FMRP) in dendrites of stimulated neurons, and separate the two assemblies biochemically: granules
    and capsids differ in density and in detergent and RNase sensitivity, so a gradient fractionation
    with RNase and Triton controls would distinguish them directly.'
- gap_statement: GO can say that Arc forms a virus-like capsid but not that it assembles one, and not
    that it is a structural constituent of one.
  boundary: The cellular component exists and names Arc in its definition (GO:0170047). The matching process
    and function terms exist only in viral form (GO:0019069, GO:0039660) and are unusable for a host-encoded
    protein. Consequently Arc's assembly step is annotated as GO:0051260 protein homooligomerization and
    its capsid role as bare GO:0005198 structural molecule activity.
  gap_kind:
  - ONTOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: Domesticated retroelement Gag genes are a growing class - fly Arc1 and Arc2, PEG10, the
    PNMA family - and all of them will hit the same two missing terms. Without them the annotations cannot
    distinguish a capsid builder from any protein that trimerises.
  resolution: Add the two terms proposed in proposed_new_terms, as siblings of the viral terms under GO:0065003
    and GO:0005198 respectively, mirroring the precedent already set by GO:0170047.
- gap_statement: 'How the two halves of Arc''s biology relate is unknown: whether capsid-mediated intercellular
    mRNA transfer is part of the same mechanism as AMPA receptor endocytosis, or a second function that
    happens to use the same interface.'
  boundary: 'Established: the same seven-residue N-terminal coil motif is required for capsid formation
    and for Arc-facilitated endocytosis, and CaMKII phosphorylation of the Gag N-lobe switches off both
    high-order oligomerisation and Arc''s synaptic weakening action. Not established: whether an Arc capsid
    is the species that recruits endophilin and dynamin at the postsynaptic membrane, or whether endocytosis
    uses lower-order oligomers and the capsid is a separate, exported form. UniProt raises but does not
    settle a third possibility - that capsids are how eliminated synaptic material is removed.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: This determines whether Arc has one molecular function with two outputs or two distinct
    functions, which is exactly the distinction core_functions is meant to make. It also determines whether
    the intercellular transfer is a signalling mechanism in its own right or a by-product of synaptic
    protein turnover.
  resolution: Separation-of-function mutants are the route. Point mutations that block higher-order assembly
    while preserving the endophilin- and dynamin-binding regions (and the converse) would test whether
    endocytosis needs the capsid state; combining them with single-particle imaging of tagged Arc at spines
    would show which oligomeric species is present when receptors are internalised.
suggested_questions:
- question: 'For the PAINT curators of PTHR15962: would it be worth recording the Tetrapoda placement
    of PTN008562333 as a deliberate exclusion rather than leaving it implicit in the node taxon? PANTHER
    assigns Drosophila Arc1 (Q7K1U0) to this family and to subfamily SF0 alongside vertebrate Arc, and
    dArc1 has independently accumulated IDA annotations for virus-like capsid, mRNA binding, mRNA transport,
    vesicle-mediated intercellular transport and regulation of neuronal synaptic plasticity - nearly the
    same term set the node propagates to tetrapods. Anyone reading the family without reading the node
    taxon would reasonably conclude the two sets are homologous inheritance, when the published phylogenomics
    says they are convergent domestications of different Ty3/gypsy lineages.'
  experts:
  - GO_Central PAINT curators
  - PANTHER family curators
- question: 'For MGI: does the GO:0071598 IDA on mouse Arc (PMID:23936366) intend to assert that the Arc
    protein is a component of neuronal RNP granules, or that Arc mRNA is granule cargo? In that study
    Arc is the A2RE reporter transcript and the protein appears only as nascent translation output imaged
    near granules. The distinction matters beyond mouse, because this annotation is the sole gene-level
    seed of the IBD node that propagates the term to human, chicken and every other tetrapod Arc.'
  experts:
  - MGI curators
  - GO_Central PAINT curators
- question: 'For UniProt: two ECO:0000269 anchors on the Q7LC44 subcellular-location block appear to over-read
    their citations. ''Cytoplasm, cytoskeleton {ECO:0000269|PubMed:21834987}'' cites a paper whose ARC
    localisation figure shows diffuse cytoplasmic GFP-ARC with plasma-membrane enrichment, with the cytoskeletal
    connection coming from a knockdown phenotype rather than from localisation; the genuine localisation
    evidence is rat (PubMed:7857651). ''Cytoplasmic vesicle, clathrin-coated vesicle membrane {ECO:0000269|PubMed:24945773}''
    cites a paper reporting transient association with clathrin-coated pits. Both propagate into GO as
    IEAs through the SubCell mapping. Note also that PubMed:21834987 now carries an author correction
    (PubMed:39390519) about its siARC panels.'
  experts:
  - UniProt curators
- question: 'For SynGO and GO_Central: is there a reason human ARC has no nuclear cellular component annotation?
    Nuclear Arc has a mapped NLS, nuclear retention domain and NES, is activity-regulated in vivo, and
    mediates a distinct PML-dependent transcriptional route to synaptic downscaling (PMID:23749147). The
    absence looks like an oversight rather than a judgement, since the same record carries far more peripheral
    locations such as acrosomal vesicle.'
  experts:
  - SynGO curators
  - GO_Central curators
suggested_experiments:
- hypothesis: Human ARC forms RNA-containing capsids and transfers its own mRNA between human neurons,
    as rat Arc does.
  description: Express and purify recombinant human ARC (Q7LC44) and image it by negative-stain and cryo-EM,
    scoring particle diameter and shell structure against the published rat values of ~32 nm and a double
    shell, with an oligomerisation-motif mutant as the negative control. In parallel, isolate extracellular
    vesicles from human iPSC-derived cortical neurons before and after depolarisation and quantify ARC
    protein and ARC mRNA in the vesicle fraction. Finally, incubate ARC-knockout human iPSC neurons with
    those vesicles, or with purified human ARC capsids, and measure acquired ARC mRNA by qRT-PCR with
    RNase-treated capsids and RNA-stripped capsids as controls. This converts the five ISS rows that currently
    carry the capsid pathway into direct human evidence.
  experiment_type: biochemical and cell-biological reconstitution
- hypothesis: The Arc protein is not a constituent of canonical dendritic transport RNP granules; its
    RNA-containing assembly is the capsid.
  description: Fractionate stimulated neuronal lysates on a density gradient and assay each fraction for
    Arc protein, ARC mRNA, and established granule markers (hnRNP A2, Staufen, FMRP), with and without
    RNase and with and without non-ionic detergent - transport granules and Gag-like capsids differ in
    all three properties. Complement this with super-resolution co-immunostaining of endogenous Arc protein
    and granule markers in dendrites, quantifying co-localisation against a same-cell randomised control.
    A negative result would justify retiring GO:0071598 from the Arc IBD node; a positive one would put
    it on evidence it does not currently have.
  experiment_type: subcellular fractionation and imaging
- hypothesis: Capsid assembly and AMPA receptor endocytosis are separable functions of the same interface.
  description: Build a panel of Arc point mutants that dissects the oligomerisation surfaces already mapped
    on the N-lobe and C-lobe from the endophilin-binding region (residues 89-100) and the dynamin-binding
    region (residues 195-214), aiming for one mutant that binds partners but cannot assemble beyond a
    dimer and one that assembles but cannot bind. Assay each for capsid formation by EM, for surface AMPA
    receptor levels and endocytosis rate in Arc-null neurons, and for extracellular vesicle release. If
    endocytosis survives loss of high-order assembly, Arc has two functions; if it does not, the capsid
    is the active species at the synapse and the intercellular transfer is a consequence of the same machinery.
  experiment_type: structure-guided separation-of-function mutagenesis
- hypothesis: Human ARC localises to clathrin-coated pits rather than to the membrane of budded clathrin-coated
    vesicles.
  description: Repeat the TIRF experiment that underlies the current annotation, but with dual-colour
    imaging of ARC alongside both clathrin light chain and dynamin, and score the timing of ARC arrival
    and departure relative to scission. A protein that arrives during pit maturation and leaves at uncoating
    is at the pit; one that persists on the vesicle after scission is on the vesicle membrane. This settles
    the GO:0030665 versus GO:0005905 question directly rather than by re-reading the published figures,
    and the same experiment would test whether the CCP-independent surface pool that Mabb et al. reported
    corresponds to a clathrin-independent endocytic route.
  experiment_type: live-cell TIRF microscopy
