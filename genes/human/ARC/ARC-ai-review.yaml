- term:
    id: GO:0060997
    label: dendritic spine morphogenesis
  evidence_type: TAS
  original_reference_id: PMID:15537891
  qualifier: involved_in
  review:
    summary: 'The cited statement is doubly hedged and second-hand: Lacor et al. write that Arc ''is coupled
      to F-actin and linked functionally to spine morphology, and its chronic overexpression has been
      suggested to generate abnormal spine structure'', citing Kelly and Deadwyler. The paper''s own spine
      observation is that spines in amyloid-beta-oligomer-treated cultures - where Arc is ectopically
      induced fivefold - are longer and more protruded than controls. A spine-shape abnormality under
      pathological ectopic induction is not evidence that Arc executes spine morphogenesis.'
