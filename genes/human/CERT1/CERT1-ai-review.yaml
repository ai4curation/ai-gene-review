- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-429730
  qualifier: located_in
  review:
    summary: Narrow ER membrane to the cytoplasmic side of the ER membrane.
    action: MODIFY
    reason: Reactome places CERT1 at an ER-membrane complex, but CERT1 is soluble and binds the 
      cytosolic MSP domains of VAPA, VAPB, PPM1L-associated tethers and MOSPD2 through its FFAT 
      motif. The precise compartment for this row is therefore the cytoplasmic side of the 
      endoplasmic reticulum membrane rather than the full ER membrane.
    proposed_replacement_terms:
    - id: GO:0098554
      label: cytoplasmic side of endoplasmic reticulum membrane
    supported_by:
    - reference_id: Reactome:R-HSA-429730
      supporting_text: VAPA/B (VAMP-associated proteins A or B) and PPM1L
    - reference_id: Reactome:R-HSA-9956909
      supporting_text: CERT1-2 is associated with the cytosolic face of the ER membrane
    - reference_id: PMID:16895911
      supporting_text: Both VAPs were actually co-immunoprecipitated with CERT
