    START-domain exchange kinetics, or residence at ER-Golgi membrane contact sites?
suggested_experiments:
- description: Quantify transfer of C14-C24 ceramide species by purified CERT1 isoforms and 
    phosphomimetic mutants in reconstituted ER-to-TGN membrane systems containing VAPA/VAPB or 
    MOSPD2 tethers.
- description: Rescue CERT1-null, CERK-active cells with FFAT-, PH-, and START-domain mutants and 
    combine organelle lipidomics with sphingomyelin/C1P pulse labeling to measure flux at TGN 
    contact sites.
