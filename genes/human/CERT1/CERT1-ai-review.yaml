core_functions:
- description: CERT1 binds ceramide with its START domain and transfers it non-vesicularly from 
    cytosolic ER membrane surfaces to Golgi/TGN membranes at ER-trans-Golgi contact sites, supplying
    Golgi sphingomyelin synthesis and the CERK route to C1P.
  molecular_function:
    id: GO:0120017
