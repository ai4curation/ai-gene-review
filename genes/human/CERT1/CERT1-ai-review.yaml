id: Q9Y5P4
gene_symbol: CERT1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CERT1 is a cytosolic START-domain lipid transfer protein that binds ceramide and transfers
  it non-vesicularly from endoplasmic-reticulum membranes to Golgi and trans-Golgi membranes at ER-Golgi
  contact sites. Its PH and FFAT-containing targeting regions position the ceramide-transfer START domain
  between the Golgi/TGN and ER VAP/MOSPD-family tethers, supplying ceramide for Golgi sphingomyelin synthesis
  and for ceramide kinase-dependent ceramide 1-phosphate production.'
