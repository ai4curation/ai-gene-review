id: O95831
gene_symbol: AIFM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: AIFM1 encodes apoptosis-inducing factor, a FAD-containing mitochondrial NADH oxidoreductase
  with additional roles in protein import and regulated cell death. The mature full-length protein is
  anchored in the inner mitochondrial membrane, with its major domain exposed to the intermembrane space.
  NADH-driven dimerization enables AIF to anchor and activate CHCHD4/MIA40, supporting oxidative folding
  and import through the mitochondrial disulfide relay. Following appropriate death signals, further proteolytic
  processing releases AIF for cytoplasmic and nuclear redistribution; DNA and poly(ADP-ribose) interactions
  contribute to chromatin-associated cell death. Alternative products separate mitochondrial redox activity
  from proapoptotic activity. AIFM1 variants cause a spectrum of X-linked mitochondrial, peripheral neurological
  and auditory disorders.
