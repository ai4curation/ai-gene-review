core_functions:
- description: Catalyzes NADH-dependent reduction of electron acceptors through its FAD-containing domain
    in the mitochondrial intermembrane compartment. Human purified-protein assays establish the chemistry,
    while the dominant physiological acceptor remains unresolved; no proton-pump or peroxide-product activity
    is implied.
  molecular_function:
    id: GO:0003954
    label: NADH dehydrogenase activity
  locations:
  - id: GO:0005758
    label: mitochondrial intermembrane space
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: PMID:27178839
    supporting_text: an FAD-containing and NADH-specific oxidoreductase
  - reference_id: PMID:24914854
    supporting_text: The crystal structure of the human AIF (hAIF):NAD(H)-bound dimer revealed one FAD
      and, unexpectedly, two NAD(H) molecules per protomer.
  - reference_id: PMID:15775970
    supporting_text: Topology analysis revealed that mature AIF is a type-I inner membrane protein with
      the N-terminus exposed to the matrix and the C-terminal portion to the intermembrane space.
  - reference_id: UniProt:O95831
    supporting_text: Reaction=A + NADH + H(+) = AH2 + NAD(+);
  knowledge_gaps:
  - gap_statement: Which physiological electron acceptor accounts for conserved human AIF redox function
      in each cellular context?
- description: NADH-activated dimeric AIF anchors CHCHD4 at the inner membrane and sequesters its autoinhibitory
    N-terminal region, enabling substrate recognition and oxidative folding through the disulfide-relay
    import pathway. AIF supplies structural/regulatory work; CHCHD4 and ALR supply relay chemistry.
  molecular_function:
    id: GO:0043495
    label: protein-membrane adaptor activity
  directly_involved_in:
  - id: GO:0160203
    label: mitochondrial disulfide relay system
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  - id: GO:0005758
    label: mitochondrial intermembrane space
  supported_by:
  - reference_id: PMID:39806100
    supporting_text: NADH allosterically configures AIF to anchor CHCHD4's β-hairpin and histidine-helix
      motifs to the inner mitochondrial membrane.
  - reference_id: PMID:39806100
    supporting_text: Regulatory-domain sequestration by NADH-activated AIF directly stimulates chaperone
      binding and folding
- description: Released proapoptotic AIF engages chromatin through DNA binding after processing and nuclear
    translocation. PAR recognition can couple release to redistribution. AIF acts as a death effector;
    intrinsic DNA cleavage is not assigned, and mechanisms/products depend on stimulus and splice form.
  molecular_function:
    id: GO:0003677
    label: DNA binding
  directly_involved_in:
  - id: GO:0043065
    label: positive regulation of apoptotic process
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: UniProt:O95831
    supporting_text: Binds to DNA in a sequence-independent manner
  - reference_id: PMID:23217327
    full_text_unavailable: true
suggested_questions:
- question: Which physiological electron acceptors/products are used by human AIF, distinguished from
    artificial-acceptor assays and ALR-derived peroxide?
- question: Does AIF perform a respiratory-complex assembly step beyond the CHCHD4 import platform, or
    do import/proteostasis changes explain the assembly phenotype?
- question: How should historical mouse AIF parthanatos evidence be represented relative to current RIPK/MLKL-associated
    necroptosis terms?
- question: Which human and mouse constructs underlie each purified-protein glutathione-reductase assay in PMID:39979311,
    and how much does this activity contribute to human mitochondrial glutathione regeneration in vivo?
