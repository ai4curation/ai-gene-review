- term:
    id: GO:0008061
    label: chitin binding
  evidence_type: IDA
  original_reference_id: PMID:19710473
  qualifier: enables
  review:
    summary: >-
      Recombinant FIBCD1 ectodomain/FReD binds chitin and chitin fragments with high affinity
      and in a calcium-dependent manner. This is the founding characterization of the protein.
    action: ACCEPT
    reason: >-
      Several independent lines of evidence establish chitin binding as a core,
      experimentally demonstrated activity of human FIBCD1. A ligand screen identified chitin
      and chitin fragments as high-affinity ligands [PMID:19710473]. Mutating the S1
      acetyl-binding funnel (H415G, A432V) abolishes chitin binding [PMID:19892701].
      Crystal structures show the N-acetyl group bound in S1, and binding assays show that
      FIBCD1 prefers longer chitooligosaccharides [PMID:24293368, PMID:38072065]. The
      residue-level UniProt mutagenesis features (ECO:0000269) also support it. Chitin binding
      is one case of a broader acetyl-group recognition. FIBCD1 also binds N-acetylated
      monosaccharides, acetylated BSA and sulfated GAGs, but GO has no general
      "acetylated ligand binding" term, and chitin binding is precise for what was tested.
      PAINT did not propagate chitin binding to any PTHR19143 ancestral node, so this is a
      FIBCD1-level (SF45) experimental finding, not an established family-wide function.
    supported_by:
    - reference_id: PMID:19710473
      supporting_text: Screening for ligands revealed that the FIBCD1 is a high-affinity receptor for chitin and chitin fragments.
    - reference_id: PMID:19892701
      supporting_text: We show that mutations of central residues (A432V and H415G) in the hydrophobic funnel (S1) abolish the binding of FIBCD1 to acetylated bovine serum albumin and chitin.
    - reference_id: PMID:38072065
