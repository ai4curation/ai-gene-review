id: Q8N539
gene_symbol: FIBCD1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  FIBCD1 (fibrinogen C domain-containing protein 1) is a 461-residue single-pass type II
  transmembrane protein of the fibrinogen-related domain (FReD) family. A short cytoplasmic
  N-terminus is followed by a signal-anchor helix and an extracellular ectodomain made of a
  coiled-coil region, a polycationic segment and a C-terminal fibrinogen-like domain. The
  FReDs assemble into disulfide-linked homotetramers. The FReD binds acetylated ligands with
  high affinity and in a calcium-dependent manner. Ligands include chitin and
  chitooligosaccharides (longer oligomers are preferred), N-acetylated sugars such as ManNAc
  and GlcNAc, and acetylated proteins. The acetyl group sits in a hydrophobic S1 pocket that
  crystal structures and mutagenesis have defined (H415, A432, Y405/Y431; Ca2+ ligands D393/D395).
  Adjacent pockets take up sulfate and N-acetyl groups. Consistent with this, FIBCD1
  binds the sulfated glycosaminoglycan chondroitin 4-sulfate (CS-4S), and cells expressing
  human FIBCD1 take CS-4S up by dynamin/clathrin-sensitive endocytosis and deliver it to
  lysosomes. FIBCD1 therefore acts as an endocytic cargo receptor for acetylated and sulfated
  glycans. It is expressed on epithelial surfaces of the gut (enterocyte brush border),
  airways, salivary ducts and skin, and in discrete brain regions including the hippocampus.
  In mice, epithelial FIBCD1 limits intestinal fungal colonization and colitis. In
  cultured lung epithelial cells it dampens inflammatory responses to Aspergillus
  cell-wall polysaccharides. In brain, loss of Fibcd1 alters hippocampal chondroitin
  sulfate content, synaptic plasticity and learning. Biallelic FIBCD1 variants that abolish
  CS-4S binding have been reported in two patients with a neurodevelopmental disorder.
  The signaling mechanisms behind these immunomodulatory and neural effects are not known.
