    id: GO:0031012
    label: extracellular matrix
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:2665790
  - MGI:MGI:99516
  - PANTHER:PTN000441162
  - RGD:3886
  - UniProtKB:P55083
  - UniProtKB:P55918
  - UniProtKB:Q9UQP3
  review:
    summary: >-
      IBA from the PTHR19143 family-root node PTN000441162. Its descendant evidence comes
      from secreted matrix FReD proteins (tenascins, MFAP4, angiopoietin-like/FGL relatives),
      not from FIBCD1.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The IBD sits at the root of the fibrinogen/tenascin/angiopoietin family. It is sound for
      the many secreted members that are deposited in the matrix, and FIBCD1 does sit inside
      the clade. But FIBCD1 has diverged in architecture: it is a signal-anchored type II
      transmembrane receptor [PMID:19710473] that works at the plasma membrane and in the
      endocytic pathway. It binds GAG chains of the brain ECM and internalizes them, and so
      changes ECM composition [PMID:35916241], but that makes ECM a substrate it acts on, not
      the place where FIBCD1 resides or acts. A soluble FIBCD1 fragment appears in feces
      during intestinal inflammation [PMID:38090485], which suggests shedding into the
      extracellular region, not incorporation into matrix. FIBCD1 is not wrong to carry a
      family-level extracellular localization, but "extracellular matrix" as an active
      location overstates what is known for this subfamily (SF45).
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000441162
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Family-root PTHR19143 IBD seeded by secreted matrix FReD proteins (tenascins,
          MFAP4 and relatives). FIBCD1 (SF45) is a signal-anchored type II transmembrane
          endocytic receptor that acts on ECM glycans, not one that resides in the matrix.
    supported_by:
    - reference_id: PMID:19710473
      supporting_text: We have identified a novel homotetrameric 55-kDa type II transmembrane protein encoded by the FIBCD1 gene
    - reference_id: PMID:35916241
      supporting_text: we conclude that FIBCD1 is an endocytic receptor for GAGs of the brain ECM, with a preference for CS‐4S, that regulates the composition of the brain ECM.
    - reference_id: PMID:38090485
      supporting_text: we identify a soluble variant of FIBCD1 that is significantly increased in feces during acute inflammation
- term:
