core_functions:
- description: >-
    Calcium-dependent recognition of acetylated glycans by the tetrameric extracellular FReD,
    whose S1 hydrophobic pocket binds N-acetyl groups. Experimentally demonstrated for human
    FIBCD1 with chitin and chitooligosaccharides, N-acetylated monosaccharides and acetylated
    proteins.
  molecular_function:
    id: GO:0008061
    label: chitin binding
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:19710473
    supporting_text: Screening for ligands revealed that the FIBCD1 is a high-affinity receptor for chitin and chitin fragments.
  - reference_id: PMID:19892701
    supporting_text: We show that mutations of central residues (A432V and H415G) in the hydrophobic funnel (S1) abolish the binding of FIBCD1 to acetylated bovine serum albumin and chitin.
- description: >-
    Endocytic cargo receptor at the plasma membrane. FIBCD1 binds sulfated
    glycosaminoglycans, preferentially chondroitin 4-sulfate, and acetylated ligands, and
    internalizes them by dynamin/clathrin-sensitive endocytosis for lysosomal delivery.
    Shown with human FIBCD1 in HEK293T cells; in mouse brain this activity regulates
    the CS content of the extracellular matrix.
  molecular_function:
    id: GO:0038024
    label: cargo receptor activity
  directly_involved_in:
  - id: GO:0006898
    label: receptor-mediated endocytosis
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:35916241
    supporting_text: Internalised CS‐4S co‐localised with both FIBCD1 and LysoTracker, which stains lysosomal vesicles (Fig 4H), indicating that FIBCD1 facilitates endocytosis of CS‐4S to the lysosomes.
  - reference_id: PMID:35916241
    supporting_text: Consistent with mFIBCD1 (Fig 4E), we determined that cells expressing hFIBCD1 showed increased FITC+ cells relative to unstained controls or cells expressing FIBCD1_W6* negative control (Fig 4J).
suggested_questions:
- question: How does FIBCD1 ligand binding at the epithelial surface lead to suppression of inflammatory mediators (IL-8, mucins) and to control of fungal colonization? Is a signaling partner involved, or is it a consequence of ligand clearance by endocytosis?
- question: Is the soluble FIBCD1 found in feces during inflammation, and the recombinant "myokine" activity reported for mouse Fibcd1, produced by proteolytic shedding of the ectodomain? If so, what protease is responsible and what does the soluble form bind?
- question: Do the chitin/acetyl-binding S1 site and the CS-4S binding surface overlap, and do chitin and CS-4S compete for FIBCD1?
- question: >-
    Which of FIBCD1's experimentally established activities (chitin binding, GAG binding,
    endocytic receptor activity, membrane anchoring) are transferable to invertebrate FReD
    proteins? The type II transmembrane anchor is absent from secreted relatives such as
    Drosophila CG10359, which PANTHER places in a different subfamily (SF327) from FIBCD1
    (SF45).
suggested_experiments:
- hypothesis: FIBCD1 endocytosis of CS-4S and of chitin oligomers uses the same FReD binding surface.
  description: Measure binding and uptake of labelled CS-4S and (GlcNAc)n oligomers in HEK293T cells expressing wild-type human FIBCD1 or the S1 mutants H415G, A432V and K381L, with cross-competition between the two ligand classes.
