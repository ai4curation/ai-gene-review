  review:
    summary: >-
      FIBCD1 was identified as a type II transmembrane protein in the intestinal epithelial
      brush border, where it localizes to the apical surface.
    action: MODIFY
    reason: >-
      The location is right but too general. The evidence places FIBCD1 at the cell surface
      as a signal-anchored type II plasma membrane receptor. It localizes to the apical
      surface/brush border of enterocytes and to the surface of bronchial and alveolar
      epithelium [PMID:19710473, PMID:19892701, PMID:30279687]. It also acts as an endocytic
      receptor from the cell surface [PMID:35916241]. Plasma membrane (GO:0005886) is the
      supported specific term. Apical polarization depends on cell type: von Huth et al.
      found apical-only staining in salivary gland and gallbladder, but equal apical and
      basolateral staining in intestine and bronchi [PMID:29220632]. For that reason
      apical plasma membrane is not proposed as a general replacement.
