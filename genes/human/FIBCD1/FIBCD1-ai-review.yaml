    label: chondroitin sulfate binding
  evidence_type: IDA
  original_reference_id: PMID:35916241
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. HEK293T cells expressing human FIBCD1 bind FITC-labelled
      chondroitin 4-sulfate (CS-4S), and the patient missense variants abolish this binding.
      Mouse FIBCD1 shows the same binding in N2a cells, which depends on the FReD.
    action: NEW
    reason: >-
      Fell et al. show direct cell-surface binding of CS-4S by human FIBCD1. Binding is lost
      with the W6* truncation and with the FReD patient variants R406C and P456L. The FReD
      crystal structures had already shown sulfate- and N-acetyl-binding pockets suited to
      sulfated GalNAc residues of chondroitin and dermatan sulfate [PMID:24293368]. This
      molecular-function claim is supported by human-protein data and is not covered by any
      existing GOA row.
    supported_by:
    - reference_id: PMID:35916241
      supporting_text: Consistent with mFIBCD1 (Fig 4E), we determined that cells expressing hFIBCD1 showed increased FITC+ cells relative to unstained controls or cells expressing FIBCD1_W6* negative control (Fig 4J).
    - reference_id: PMID:24293368
      supporting_text: These ion binding sites are ideally placed to receive the N-acetyl and sulfate groups of sulfated GalNAc residues of glycosaminoglycans such as chondroitin and dermatan sulfate.
- term:
    id: GO:0038024
    label: cargo receptor activity
  evidence_type: IDA
  original_reference_id: PMID:35916241
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation. FIBCD1 binds extracellular acetylated or sulfated glycan ligands
      and internalizes them by endocytosis. In human-FIBCD1 HEK293T cells, CS-4S uptake is
      blocked by dynamin (Dynole) and clathrin (PitStop) inhibitors, and the internalized
      ligand reaches lysosomes together with FIBCD1.
    action: NEW
    reason: >-
      GO defines cargo receptor activity as binding a substance in order to deliver it into a
      transport vesicle. Its synonyms include "endocytic receptor activity", which is the
      activity FIBCD1 was characterized with from the start ("a function in endocytosis was
      demonstrated" [PMID:19710473]; "type II transmembrane endocytic receptor"
      [PMID:19892701]). Fell et al. later showed it directly with human FIBCD1 for CS-4S
      [PMID:35916241]. No evidence couples ligand binding to a defined signal transduction
      pathway, so signaling receptor activity is not proposed.
    supported_by:
    - reference_id: PMID:35916241
      supporting_text: Internalised CS‐4S co‐localised with both FIBCD1 and LysoTracker, which stains lysosomal vesicles (Fig 4H), indicating that FIBCD1 facilitates endocytosis of CS‐4S to the lysosomes.
    - reference_id: PMID:19710473
      supporting_text: a function in endocytosis was demonstrated
- term:
    id: GO:0006898
    label: receptor-mediated endocytosis
  evidence_type: IDA
  original_reference_id: PMID:35916241
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. FIBCD1 is the receptor that captures and internalizes ligand
      (CS-4S, acetylated compounds) through a dynamin- and clathrin-dependent route.
    action: NEW
    reason: >-
      This passes the participation test. FIBCD1 is the receptor entity in receptor-mediated
      endocytosis: it binds the cargo and is internalized with it. It is not a substrate or a
      bystander requirement. Comparator check: other endocytic cargo receptors such as LRP2,
      STAB1 and MRC1 carry GO:0006898, so the term is the conventional process partner of
      endocytic cargo receptor activity. Uptake in human-FIBCD1 cells is sensitive to
      endocytosis inhibitors.
    supported_by:
    - reference_id: PMID:35916241
      supporting_text: To investigate whether FIBCD1 facilitates internalisation of GAGs, we incubated HEK293T cells stably overexpressing hFibcd1with FITC‐tagged CS‐4S and observed an increased uptake of CS‐4S in FIBCD1‐expressing cells compared with untransduced controls (Figs 4F and EV4F–G), which was abrogated by compounds that inhibit endocytosis, Dynole and PitStop (Fig 4G).
