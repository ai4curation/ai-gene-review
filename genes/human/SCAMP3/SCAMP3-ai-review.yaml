  - id: PMID:21951651
    title: Regulation of the MVB pathway by SCAMP3.
    findings:
      - statement: SCAMP3 acts in EGF receptor sorting into multivesicular
          endosomes, in intralumenal vesicle formation within them, and thereby
          in EGF receptor delivery to lysosomes.
        supporting_text: We find that SCAMP3 plays a role in EGF receptor
          sorting into multivesicular endosomes and in the formation of
          intralumenal vesicles within these endosomes in vitro and thus also
          controls EGF receptor targeting to lysosomes.
      - statement: SCAMP3 has a positive role in sorting into and budding of
          intralumenal vesicles, controlling multivesicular endosome biogenesis.
        supporting_text: the transmembrane protein SCAMP3 has a positive role in
          sorting into and budding of intralumenal vesicles and thereby controls
          the process of multivesicular endosome biogenesis
