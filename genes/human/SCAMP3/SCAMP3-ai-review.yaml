id: O14828
gene_symbol: SCAMP3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SCAMP3 (Secretory carrier-associated membrane protein 3) is a 
  tetraspanning integral membrane protein that functions as a key regulator of 
  endosomal trafficking and multivesicular body (MVB) biogenesis. The protein 
  contains an N-terminal cytoplasmic domain with functionally critical motifs 
  including a PPAY motif that binds WW-domain E3 ubiquitin ligases (NEDD4 
  family) and a PSAP motif that mediates interaction with the ESCRT-I component 
  TSG101. SCAMP3 localizes to the Golgi apparatus, early endosomes, and a subset
  of late endosomes. It plays a central role in regulating epidermal growth 
  factor receptor (EGFR) trafficking fate, balancing receptor recycling versus 
  lysosomal degradation through ESCRT-dependent sorting into intralumenal 
  vesicles. SCAMP3 is multi-monoubiquitinated and is itself phosphorylated by 
  EGFR at Tyr86, which promotes EGFR-SCAMP3 interaction and EGFR degradation. 
  SCAMP3 is essential for WW domain-activated extracellular vesicle (WAEV) 
  budding, positioning it as a critical factor in exosome/EV biogenesis.
existing_annotations:
  - term:
      id: GO:0006887
      label: exocytosis
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    review:
      summary: This IBA annotation derives from phylogenetic inference across 
        the SCAMP family. While SCAMP3 is involved in vesicular trafficking 
        pathways, the primary experimental evidence supports its role in 
        endosomal sorting and MVB biogenesis rather than classical exocytosis. 
        The original SCAMP1/2 literature focused on post-Golgi recycling 
        carriers, but SCAMP3-specific studies emphasize EGFR trafficking and 
        intralumenal vesicle formation (PMID:19158374).
      action: MODIFY
      reason: The term 'exocytosis' is too general and does not capture the 
        specific role of SCAMP3. The deep research indicates SCAMP3 functions 
        primarily in endosomal sorting, MVB biogenesis, and regulation of 
        receptor recycling vs degradation rather than classical exocytosis. A 
        more appropriate term would be the MVB sorting route the gene is shown 
        to act in. The replacement is GO:0032509 endosome transport via 
        multivesicular body sorting pathway, which this review already asserts as 
        a NEW row on PMID:21951651, rather than its parent GO:0016197 endosomal 
        transport, because CLAUDE.md prefers a replacement the gene already carries and 
        GO:0032509 is the more specific of the two.
      proposed_replacement_terms:
        - id: GO:0032509
          label: endosome transport via multivesicular body sorting pathway
      additional_reference_ids:
        - PMID:19158374
        - file:human/SCAMP3/SCAMP3-deep-research-falcon.md
      supported_by:
        - reference_id: PMID:19158374
          supporting_text: SCAMP3 negatively regulates epidermal growth factor 
            receptor degradation and promotes receptor recycling
  - term:
      id: GO:0032588
      label: trans-Golgi network membrane
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: is_active_in
    review:
      summary: This IBA annotation is consistent with experimental findings. The
        deep research indicates SCAMP3 localizes to the Golgi apparatus, and the
        original 1997 paper (PMID:9378760) showed SCAMPs have similar 
        subcellular distributions including Golgi-associated compartments. The 
        2012 Traffic paper confirmed SCAMP3 localization to Golgi and endosomal 
        compartments.
      action: ACCEPT
      reason: The annotation accurately reflects SCAMP3 localization. Literature
        demonstrates SCAMP3 presence at Golgi and trans-Golgi network membranes 
        consistent with its role in post-Golgi trafficking.
      supported_by:
        - reference_id: PMID:9378760
          supporting_text: Examination of the codistribution of the three forms 
            within individual cells using double label immunofluorescence 
            indicates extensive colocalization of SCAMP2 and SCAMP3 with 
            endogenous SCAMP1
  - term:
      id: GO:0055038
      label: recycling endosome membrane
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: is_active_in
    review:
      summary: This IBA annotation is well-supported by experimental evidence. 
        SCAMP3 promotes receptor recycling and localizes to endosomal 
        compartments including recycling endosomes. The 2009 Mol Biol Cell paper
        demonstrated that SCAMP3 promotes EGFR recycling rather than degradation
        (PMID:19158374).
      action: ACCEPT
      reason: The annotation accurately reflects SCAMP3 localization and 
        function. SCAMP3 functions as a recycling carrier and promotes receptor 
        recycling from endosomal compartments back to the plasma membrane.
      supported_by:
        - reference_id: PMID:19158374
          supporting_text: SCAMP3 negatively regulates epidermal growth factor 
            receptor degradation and promotes receptor recycling
  - term:
      id: GO:0015031
      label: protein transport
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
    review:
      summary: This IEA annotation inferred from InterPro domain and UniProtKB 
        keywords is accurate but very general. SCAMP3 is indeed involved in 
        protein transport through its role in vesicular trafficking, EGFR 
        sorting, and MVB pathway regulation.
      action: ACCEPT
      reason: The annotation is correct but represents a high-level term. More 
        specific annotations like post-Golgi vesicle-mediated transport and 
        endosomal transport better capture SCAMP3 function. However, this IEA 
        annotation is not incorrect and provides appropriate coverage.
      supported_by:
        - reference_id: PMID:9378760
          supporting_text: The SCAMPs may largely function at the same sites 
            during vesicular transport rather than in separate post-Golgi 
            recycling pathways
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: This IEA annotation is correct. SCAMP3 is a tetraspanning 
        integral membrane protein with four transmembrane helices (residues 
        171-191, 197-217, 247-267, 277-297) according to UniProt annotation.
      action: ACCEPT
      reason: The annotation is accurate. SCAMP3 is clearly a membrane protein 
        with four transmembrane domains. More specific membrane localizations 
        (trans-Golgi network membrane, recycling endosome membrane) are captured
        in other annotations.
      supported_by:
        - reference_id: PMID:9378760
          supporting_text: SCAMPs are highly related products of distinct genes
  - term:
      id: GO:0031625
      label: ubiquitin protein ligase binding
    evidence_type: IPI
    original_reference_id: PMID:23418353
    qualifier: enables
    review:
      summary: This IPI annotation is well-supported. SCAMP3 contains a PPAY 
        motif that binds WW-domain E3 ubiquitin ligases including NEDD4 and 
        NEDD4L. The UniProt entry confirms interactions with NEDD4, NEDD4L, 
        TSG101, and RNF126. The cited paper (PMID:23418353) demonstrates SCAMP3 
        interaction with RNF126 E3 ubiquitin ligase.
      action: ACCEPT
      reason: The annotation accurately reflects SCAMP3's molecular function. 
        The PPAY motif mediates binding to WW-domain containing E3 ubiquitin 
        ligases. This interaction is functionally important for SCAMP3's role in
        endosomal sorting and receptor trafficking.
      supported_by:
        - reference_id: PMID:23418353
          supporting_text: We also show that the depletion of Rabring7 
            attenuates the degradation of MET and that both RNF126 and Rabring7 
            regulate the sorting of CXCR4 from an early endocytic compartment
        - reference_id: PMID:19158374
          supporting_text: SCAMP3 is multimonoubiquitylated and is able to 
            associate with Nedd4 HECT ubiquitin ligases and the ESCRT-I subunit 
            Tsg101 via its PY and PSAP motifs, respectively
  - term:
      id: GO:0070062
      label: extracellular exosome
    evidence_type: HDA
    original_reference_id: PMID:20458337
    qualifier: located_in
    review:
      summary: >-
        Detected in an extracellular-vesicle proteome. The protein is plausible EV content, but this is
        not where it functions.
      action: KEEP_AS_NON_CORE
      reason: >-
        Endosomal/post-Golgi membrane protein. The earlier ACCEPT said SCAMP3 is required for EV
        biogenesis, but the cited work (PMID:19158374, PMID:23418353) shows it regulates ESCRT-dependent
        MVB sorting of EGFR, not EV biogenesis. Transmembrane/lipid-anchored protein of the plasma
        membrane or endosomal system (UniProt membrane topology; compartment from GO); such proteins are
        expected EV contents (MISEV2018 (PMID:30637094) category 1). True, but not its core location.
        (Manual re-review for OMICS_EVIDENCE, 2026-10-10; previous action: ACCEPT.)
      supported_by:
        - reference_id: PMID:20458337
          supporting_text: We first analyzed the total proteome of highly 
            purified B cell-derived exosomes using sensitive and accurate mass 
            spectrometry (MS), and identified 539 proteins
  - term:
      id: GO:0006892
      label: post-Golgi vesicle-mediated transport
    evidence_type: TAS
    original_reference_id: PMID:9378760
    qualifier: involved_in
    review:
      summary: This TAS annotation from the original SCAMP characterization 
        paper is well-supported. The 1997 paper established that SCAMPs function
        in post-Golgi recycling pathways, and subsequent studies have confirmed 
        SCAMP3's role in trafficking from Golgi through endosomal compartments.
      action: ACCEPT
      reason: The annotation accurately reflects a core function of SCAMP3. The 
        protein functions in post-Golgi vesicular transport, mediating carrier 
        function between Golgi, endosomal compartments, and plasma membrane.
      supported_by:
        - reference_id: PMID:9378760
          supporting_text: These findings suggest that the SCAMPs may largely 
            function at the same sites during vesicular transport rather than in
            separate post-Golgi recycling pathways
  - term:
      id: GO:0032509
      label: endosome transport via multivesicular body sorting pathway
    evidence_type: IMP
    original_reference_id: PMID:21951651
    review:
      summary: NEW annotation for SCAMP3's role in the multivesicular body 
        sorting route that delivers ubiquitylated receptors from endosomes to 
        the lysosome. SCAMP3 is an endosomal tetraspanning membrane protein that
        engages ESCRT-0 (HRS) and ESCRT-I (TSG101) through its PY and PSAP 
        motifs; its depletion reduces EGFR sorting into intralumenal vesicles 
        and delays EGFR delivery to lysosomes (Falguieres, Castle and Gruenberg,
        Traffic 2012, PMID:21951651, now cached and cited directly). This annotation 
        previously used GO:0070676 'intralumenal vesicle formation', which GO 
        obsoleted on 2026-10-20 with no replacement because the term was not 
        clearly defined and usage had been inconsistent; GO:0032509 is one of 
        its two 'consider' targets and is the one that matches what was actually
        measured here, namely cargo movement through the MVB route to the 
        lysosome rather than the membrane-deformation event itself.
      action: NEW
      reason: SCAMP3 does part of the work of this transport process rather than
        merely being required for it. It resides on the endosomal membrane where
        sorting occurs and provides the PSAP/PY docking sites that bring the 
        ESCRT-0 and ESCRT-I cargo-sorting machinery to that membrane, and loss 
        of SCAMP3 redirects EGFR away from the lysosomal route. The primary
        reference is now PMID:21951651 itself rather than the deep-research file
        that summarised it. The paper was fetched on 2026-11-23, its title and
        authors confirm it is the Falguieres/Castle/Gruenberg Traffic 2012 study,
        and its abstract states the sorting and lysosomal-targeting result quoted
        below. Only the abstract is cached (no PMC record), so the quantitative
        depletion and in vitro budding data are taken on the abstract's own
        summary of them. The obsoleted 
        term's other 'consider' target, GO:1990182 exosomal secretion, is not 
        used, because nothing here shows SCAMP3-dependent release of vesicles 
        to the 
        extracellular space (the exosome-proteome row elsewhere in this review 
        is presence in exosomes, not a role in their secretion). The evidence is
        loss-of-function (IMP), and the claim is corroborated by the
        independently cited ESCRT interactions in PMID:19158374. The
        deep-research file is retained in additional_reference_ids as the route
        by which the paper was found, not as support.
      additional_reference_ids:
        - file:human/SCAMP3/SCAMP3-deep-research-falcon.md
      supported_by:
        - reference_id: PMID:21951651
          supporting_text: SCAMP3 plays a role in EGF receptor sorting into
            multivesicular endosomes and in the formation of intralumenal
            vesicles within these endosomes in vitro and thus also controls EGF
            receptor targeting to lysosomes.
        - reference_id: PMID:19158374
          supporting_text: SCAMP3, its modification with ubiquitin, and its 
            interactions with ESCRTs coordinately regulate endosomal pathways 
            and affect the efficiency of receptor down-regulation
  - term:
      id: GO:0005770
      label: late endosome
    evidence_type: IDA
    original_reference_id: file:human/SCAMP3/SCAMP3-deep-research-falcon.md
    review:
      summary: NEW annotation supported by experimental evidence. The 2012 
        Traffic paper demonstrated that approximately 30% of late endosomes 
        contain SCAMP3 based on quantitative image analysis. SCAMP3 localizes to
        a subset of late endosomes/MVBs.
      action: NEW
      reason: Direct evidence from immunofluorescence and EM studies shows 
        SCAMP3 localization to late endosomal compartments where it functions in
        cargo sorting and ILV formation.
      supported_by:
        - reference_id: PMID:19158374
          supporting_text: SCAMP3 depletion appeared to sustain the incidence of
            EGFR-containing MVBs detected by immunoelectron microscopy
  - term:
      id: GO:0001881
      label: receptor recycling
    evidence_type: IMP
    original_reference_id: PMID:19158374
    review:
      summary: NEW annotation supported by experimental evidence. The 2009 Mol 
        Biol Cell paper demonstrated that SCAMP3 promotes EGFR recycling. SCAMP3
        overexpression enhanced EGFR recycling while knockdown accelerated 
        degradation and impaired recycling.
      action: NEW
      reason: Strong experimental evidence from mutant analysis shows SCAMP3 
        functions in promoting receptor recycling, balancing recycling vs 
        degradation fate.
      additional_reference_ids:
        - PMID:19158374
      supported_by:
        - reference_id: PMID:19158374
          supporting_text: Depletion of SCAMP3 in HeLa cells by inhibitory RNA 
            accelerated degradation of EGFR and EGF while inhibiting recycling
  - term:
      id: GO:0032585
      label: multivesicular body membrane
    evidence_type: IDA
    original_reference_id: file:human/SCAMP3/SCAMP3-deep-research-falcon.md
    review:
      summary: NEW annotation supported by experimental evidence. SCAMP3 
        localizes to and functions at MVB membranes, where it is required for 
        ILV formation and cargo sorting.
      action: NEW
      reason: SCAMP3 localization to MVB membranes is demonstrated through its 
        role in MVB biogenesis and ESCRT-dependent sorting.
      supported_by:
        - reference_id: PMID:19158374
          supporting_text: SCAMP3 depletion appeared to sustain the incidence of
            EGFR-containing MVBs detected by immunoelectron microscopy
