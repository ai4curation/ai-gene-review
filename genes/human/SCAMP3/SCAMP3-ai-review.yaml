proposed_new_terms: []
suggested_questions:
  - question: How does SCAMP3 ubiquitination state regulate the balance between 
      receptor recycling and degradation?
  - question: What is the precise mechanism by which SCAMP3 coordinates with 
      ESCRT-0 (HRS) in addition to ESCRT-I (TSG101)?
suggested_experiments:
  - description: Structure-function analysis of SCAMP3 using site-directed 
      mutagenesis of the ubiquitination sites to determine how ubiquitination 
      state affects recycling vs degradation outcomes. This could resolve the 
      apparent discrepancy between SCAMP3's role in promoting recycling versus 
      driving lysosomal degradation.
