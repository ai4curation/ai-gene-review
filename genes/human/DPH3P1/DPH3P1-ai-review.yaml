suggested_questions:
- question: >-
    Is there any proteomic evidence (peptides covering the DPH3P1-specific substitutions, e.g.
    E38, G44, M47, G50) for translation of the DPH3P1 retrocopy? Without it, should PAINT and
    InterPro2GO pipelines stop propagating function to this PE 5 leaf?
- question: >-
    Should PANTHER subfamily PTHR21454:SF23 (DPH3 HOMOLOG B-RELATED), which contains only this
    processed-pseudogene leaf, be excluded from IBA propagation from PTN000485452?
suggested_experiments:
- description: >-
    Targeted mass spectrometry (or reanalysis of deep human proteomes) for peptides unique to
    DPH3P1, together with RNA-seq read assignment using multi-mapping-aware quantification, to
    test whether any DPH3P1 transcript or product exists.
