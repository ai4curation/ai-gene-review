      source_entities:
      - source_id: PANTHER:PTN000485452
        comment: DPH3 ortholog node; BP IBD is sound for Dph3/KTI11 orthologs but propagated
          to a processed-pseudogene leaf.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: SGD:S000007587
        source_label: KTI11
