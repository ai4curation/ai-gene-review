  label: Homo sapiens
description: >-
  DPH3P1 (diphthamide biosynthesis 3 pseudogene 1; previously C20orf143, ZCSL1, DPH3B) is a
  processed pseudogene of DPH3 on chromosome 20q13.33. It is a single-exon retrocopy whose
  conceptual 78-residue translation (UniProt Q9H4G8, "Putative DPH3 homolog B") is about 85%
  identical to DPH3. It keeps the four cysteines that coordinate metal in the CSL-type zinc
  finger (DPH-type metal-binding domain) but lacks DPH3's last four residues. There is no
  experimental evidence that the locus is transcribed into a coding RNA or translated. It has
  no cDNA or annotated CDS, no protein-coding transcript model, and no detectable expression
  in GTEx. UniProt rates protein existence as uncertain. The parent protein DPH3 is a
  cytosolic iron-binding electron donor that reduces the Fe-S cluster of the Dph1-Dph2
  enzyme in diphthamide biosynthesis, and it is also required for tRNA wobble uridine
  modification. No such function has been shown for any DPH3P1 product.
