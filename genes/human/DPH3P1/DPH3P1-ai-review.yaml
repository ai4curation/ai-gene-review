- term:
    id: GO:0017183
    label: protein histidyl modification to diphthamide
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:1922658
  - PANTHER:PTN000485452
  - SGD:S000007587
  review:
    summary: >-
      Diphthamide biosynthesis role inherited from DPH3 orthologs. DPH3 does the work as the
      electron donor to Dph1-Dph2, but this pseudogene locus has no evidence of a product.
    action: REMOVE
    reason: >-
      Yeast Dph3 reduces the Dph1-Dph2 Fe-S cluster in the first step of diphthamide
      biosynthesis (PMID:24422557) and donates an iron atom to form the [4Fe-4S] cluster
      (PMID:34154323), so DPH3 orthologs do participate in this process. For DPH3P1 the
      phylogenetic inference is not undermined by residue loss, because the metal ligands are
      retained. The locus is a processed pseudogene with no evidence of transcription into
      mRNA or of translation, and no study has asked whether a DPH3P1 product could substitute
      for DPH3 in eEF2 diphthamide modification. Human cells depend on DPH3 for this process.
    additional_reference_ids:
    - PMID:24422557
    - PMID:34154323
    supported_by:
    - reference_id: PMID:24422557
      supporting_text: can bind iron and in the reduced state can serve as an electron
    - reference_id: file:human/DPH3P1/DPH3P1-bioinformatics/RESULTS.md
      supporting_text: The open question is whether a product exists at all.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
