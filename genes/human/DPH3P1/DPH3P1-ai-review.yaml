  review:
    summary: >-
      Inherited from the DPH3 ortholog node, which is seeded by yeast Dph3/Kti11 iron binding.
      The DPH3P1 sequence keeps all four metal-ligand cysteines, but the locus is a processed
      pseudogene with no evidence of transcription into mRNA or of translation.
    action: REMOVE
    reason: >-
      The PAINT inference at PTN000485452 is sound for genuine DPH3 orthologs. Yeast Dph3 binds
      iron through four conserved cysteines (PMID:24422557). DPH3P1 is a leaf in that clade only
      because it is a recent processed retrocopy of DPH3. Its residues do not argue against the
      inference: the conceptual translation keeps C26, C28, C48 and C51
      (file:human/DPH3P1/DPH3P1-bioinformatics/RESULTS.md). The annotation fails at the first
      Tier 3 question instead, because the product is not shown to exist. HGNC classifies the
      locus as a pseudogene, Ensembl annotates a processed_pseudogene transcript with no
      translation, GTEx reports no expression, and UniProt rates it PE 5 with a pseudogene
      caution. A molecular function should not be asserted for a gene product that is
      probably never made.
