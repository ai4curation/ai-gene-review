suggested_questions:
- question: Is TRUB2 the enzyme that installs Psi55 in the four human mitochondrial tRNAs that carry it
    (mt-tRNA-Glu, -Gln, -Ser(UCN), -Tyr) in vivo, and if so should PAINT propagate tRNA pseudouridine(55)
    synthase activity to the Bilateria TRUB2 node?
- question: Does TRUB2 pseudouridylate COX1/COX3 mt-mRNA directly, or is its effect indirect through reduced
    RPUSD3 expression?
- question: Should GO provide a mitochondrial RNA granule cellular component term, given the number of
    mtRNA-processing and modification enzymes localized there?
- question: Is 'positive regulation of mitochondrial translation' the right process term for modifying
    enzymes whose loss reduces mitochondrial translation, or does it overstate a regulatory role?
suggested_experiments:
- description: Map Psi55 in purified mitochondrial tRNAs (e.g. by CMC/RT stop, BID-seq or LC-MS of isolated
    mt-tRNAs) in TRUB2 knockout cells rescued with wild-type or catalytic Asp98 mutant TRUB2.
- description: Test recombinant TRUB2 on in vitro transcribed COX1 and COX3 mt-mRNA fragments, and measure
    COX1/COX3 Psi levels in TRUB2 knockout cells with RPUSD3 expression restored.
- description: Determine whether the ATP8/ATP6 translation defect of TRUB2 depletion requires catalytic
    activity by complementing with a catalytically dead TRUB2.
