    reason: TRUB2 depletion lowers pseudouridylation at COX1 and COX3 mt-mRNA sites, and recombinant TRUB2
      modified one site in vitro. However, the authors of the in vivo study argue RPUSD3 is the major
      enzyme and the TRUB2 effect secondary (TRUB2 knockdown also halves RPUSD3 mRNA), and the in vitro
      site was a cytosolic mRNA. The process is therefore plausible but only weakly established as a direct
      TRUB2 activity; kept as non-core.
    supported_by:
    - *id011
    - *id015
