id: O95900
gene_symbol: TRUB2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: TRUB2 is a nuclear-encoded pseudouridine synthase of the TruB family that is imported into
  the mitochondrial matrix, where it is concentrated in mitochondrial RNA granules and co-sediments with
  the large mitoribosomal subunit. Recombinant TRUB2 isomerizes uridine-55 of tRNA to pseudouridine, and
  it accounts for the tRNA Psi55 synthase activity of mitochondria, consistent with modification of the
  T-loop of the subset of mitochondrial tRNAs that carry Psi55. It also contributes, apparently as a minor
  enzyme alongside RPUSD3, to pseudouridylation of specific sites in the COX1 and COX3 mitochondrial mRNAs.
  TRUB2 associates with RPUSD3, RPUSD4, NGRN, RCC1L (WBSCR16), FASTKD2 and MTERF3 in a mitochondrial RNA-granule
  module that supports 16S rRNA stability, mitoribosome assembly and mitochondrial translation; its depletion
  impairs mitochondrial protein synthesis, particularly of ATP8/ATP6, and oxidative phosphorylation, and
  it is essential for viability in several human cell lines.
