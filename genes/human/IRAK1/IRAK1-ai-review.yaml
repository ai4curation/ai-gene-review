- term:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  evidence_type: EXP
  original_reference_id: PMID:11960013
  qualifier: enables
  review:
    summary: Li et al. 2002 (IRAK4 discovery) compared IRAK family members; IRAK1 is the IRAK with 
      potent kinase activity and IRAK4 phosphorylates it.
    action: ACCEPT
    reason: IRAK1 is a catalytically active Ser/Thr kinase. Its activity is dispensable for 
      IL-1-induced NF-kappaB (where it acts as a scaffold) but required for TLR7/9-induced IRF7 
      activation, and it phosphorylates Pellino E3 ligases and Mal. The kinase activity is therefore
      a core function, alongside the scaffold role.
    supported_by:
    - reference_id: PMID:11960013
      supporting_text: the three proteins is that only IRAK-1 has potent kinase activity
    - reference_id: PMID:33238146
      supporting_text: IRAK1 and IRAK4 are catalytically active members of the IRAK family
