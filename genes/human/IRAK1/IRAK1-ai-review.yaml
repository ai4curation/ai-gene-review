id: P51617
gene_symbol: IRAK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'IRAK1 (interleukin-1 receptor-associated kinase 1) is a cytosolic Pelle-family serine/threonine
  protein kinase with an N-terminal death domain, a Pro/Ser/Thr-rich (ProST) linker, a kinase domain and
  a C-terminal region carrying TRAF6-binding motifs. In resting cells it is held inactive with TOLLIP.
  After IL-1 family receptor or Toll-like receptor engagement it is recruited by MYD88 into the receptor-proximal
  Myddosome, phosphorylated by IRAK4 (Thr209) and then autophosphorylates (Thr387 and the ProST region),
  which releases it from MYD88/TOLLIP while it keeps hold of TRAF6. IRAK1 thus acts as a scaffold that
  recruits TRAF6 and couples it to the TAK1-TAB complex; after Pellino- and TRAF6-dependent K63-linked
  polyubiquitination it also recruits NEMO and the IKK complex, driving NF-kappaB and MAP kinase activation,
  before K48 ubiquitination and degradation. Kinase-dead IRAK1 fully supports IL-1-induced NF-kappaB and
  JNK activation, and IRAK1 is partly redundant with IRAK2. Its catalytic activity phosphorylates Pellino
  E3 ligases, TIRAP/Mal and IRF7, and is essential for TLR7/TLR9-induced IRF7 activation and interferon-alpha
  production in plasmacytoid dendritic cells. Sumoylated IRAK1 can enter the nucleus. Several splice variants
  (IRAK1b, IRAK1c) are kinase-inactive.'
