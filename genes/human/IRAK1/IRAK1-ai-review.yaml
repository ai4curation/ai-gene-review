      complex (complex I)
  - reference_id: PMID:18347055
    supporting_text: only ubiquitinated IRAK-1 bound NEMO, the regulatory subunit of IkappaB kinase 
      (IKK)
  - reference_id: PMID:10217414
    supporting_text: This strongly suggests that the intrinsic kinase activity is not required for 
      downstream signaling via IRAK.
- description: Protein serine/threonine kinase activated by IRAK4 that autophosphorylates (Thr209, 
    Thr387, ProST region) to release itself from MYD88/TOLLIP, and phosphorylates Pellino E3 
    ligases, TIRAP/Mal and IRF7. Its catalytic activity is essential for TLR7/TLR9-induced IRF7 
    activation and type I interferon production.
