existing_annotations:
- term:
    id: GO:0001959
    label: regulation of cytokine-mediated signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:10383454
  qualifier: involved_in
  review:
    summary: IRAK1-deficient 293 cells (I1A) do not respond to IL-1, and this paper (on IRAK-M) used
      them to show IRAK family members reconstitute the IL-1 response. IRAK1 is a direct participant
      in IL-1 receptor signalling, not a regulator of a cytokine pathway from outside it.
    action: MODIFY
    reason: The regulation term is less accurate than the participation term. IRAK1 is a core 
      transducer inside the IL-1 receptor pathway (Myddosome to TRAF6), and the same IMP from 
      PMID:10383454 is already annotated to GO:0070498 interleukin-1-mediated signaling pathway, 
      which is the precise claim.
    proposed_replacement_terms:
    - id: GO:0070498
      label: interleukin-1-mediated signaling pathway
    supported_by:
    - reference_id: PMID:10383454
      supporting_text: Although IRAK-M and IRAK-2 exhibit only a negligible autophosphorylation 
        activity, they can reconstitute the IL-1 response in a 293 mutant cell line lacking IRAK.
    - reference_id: PMID:10373513
      supporting_text: Neither NFkappaB nor Jun kinase is activated in IL-1-treated I1A cells, but 
        these responses are restored in I1A-IRAK cells, indicating that IRAK is required for both.
