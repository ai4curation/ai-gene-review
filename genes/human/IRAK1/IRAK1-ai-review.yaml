suggested_questions:
- question: Kinase-dead IRAK1 still restores IL-1 signalling, so its IL-1 role is a scaffold one. 
    Should GO-CAM models of IL-1 signalling (e.g. gomodel:59cc772c00000000) type the IRAK1 step as 
    signaling adaptor activity, keeping protein serine/threonine kinase activity for the TLR7/9-IRF7 
    branch where its catalysis is required?
- question: What experiment underlies the BHF-UCL IMP of IRAK1 to negative regulation of canonical 
    NF-kappaB signal transduction from PMID:10383454, given that all other data show IRAK1 promotes 
    NF-kappaB activation?
suggested_experiments:
- description: Compare IL-1beta- and TLR7/9-ligand-induced TRAF6 K63 ubiquitination, NEMO 
    recruitment, NF-kappaB activation and IRF7 phosphorylation in human cells lacking IRAK1 and 
    IRAK2, reconstituted with wild-type or kinase-dead (K239A/D340N) IRAK1, to separate scaffold 
    from catalytic requirements by pathway branch and stimulus duration.
  experiment_type: genetic complementation with kinase-dead mutants
knowledge_gaps:
- gap_statement: Which IRAK1 substrates mediate its kinase-dependent functions in human cells is not
    established; IRF7, Pellino proteins and Mal are phosphorylated in vitro or on overexpression, 
    but which phosphorylation events are needed for TLR7/9-induced interferon production in human 
    pDCs is unknown.
  gap_kind:
  - BIOLOGY
