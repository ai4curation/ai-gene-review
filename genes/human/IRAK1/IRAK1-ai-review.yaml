- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - FB:FBgn0003882
  - FB:FBgn0010441
  - PANTHER:PTN000701353
  review:
    summary: IBA from Drosophila Pelle/Tube; IRAK1 is recruited to the cytoplasmic face of the 
      IL-1R/TLR receptor complex.
    action: KEEP_AS_NON_CORE
    reason: IRAK1 is not a membrane protein; it is recruited transiently to the cytoplasmic face of 
      activated IL-1R/TLR complexes (via MYD88 and TOLLIP) and stays membrane-associated while 
      modified. The location is real but transient and peripheral to its function, so kept as 
      non-core; cytosol is the core location.
    supported_by:
    - reference_id: PMID:22851693
      supporting_text: It is important to note that the modified IRAK1 is always membrane associated
        and detected in membrane-bound receptor complex I and II (IRAK-TRAF6-TAK1-TAB2-TAB3).
