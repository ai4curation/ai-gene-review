  review:
    summary: IRAK1 is a Myddosome component in TLR signalling; it acts redundantly with IRAK2 
      downstream of MyD88 and IRAK4.
    action: MODIFY
    reason: True but general. IRAK1 acts in the MyD88-dependent branch of TLR signalling (it is 
      recruited by MYD88 and phosphorylated by IRAK4); the row should be refined to GO:0002755 
      MyD88-dependent toll-like receptor signaling pathway, which IRAK1 already carries.
    proposed_replacement_terms:
    - id: GO:0002755
      label: MyD88-dependent toll-like receptor signaling pathway
    supported_by:
    - reference_id: PMID:38961291
      supporting_text: IRAK1 and IRAK2 appeared to be redundant, as double (but not single) 
        knockouts abolished all responses to LPS
    - reference_id: PMID:36865541
      supporting_text: The myddosome is a supramolecular signaling complex assembled upon 
        dimerization of IL-1Rs and most TLRs (except TLR3), and is composed of MyD88, IRAK4, IRAK1 
        and/or IRAK2, in addition to TRAF6.
