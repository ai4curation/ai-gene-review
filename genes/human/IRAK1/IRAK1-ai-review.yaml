- term:
    id: GO:0008063
    label: Toll signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0003882
  - FB:FBgn0010441
  - PANTHER:PTN000701353
  review:
    summary: IBA from Drosophila Pelle and Tube (PTN000701353). GO:0008063 is defined by ligand 
      binding to the receptor Toll itself, which mammals lack.
    action: MODIFY
    reason: The ancestral function (a Pelle-family kinase in Toll/TLR-MyD88 signalling) is 
      conserved, but the Drosophila Toll receptor term does not apply to a human protein. The 
      mammalian equivalent IRAK1 carries is MyD88-dependent toll-like receptor signaling pathway.
    proposed_replacement_terms:
    - id: GO:0002755
      label: MyD88-dependent toll-like receptor signaling pathway
    supported_by:
    - reference_id: PMID:12496252
      supporting_text: Toll initiates its signal through the adapter molecule Tube and the 
        serine-threonine kinase Pelle. Pelle is highly homologous to members of the IL-1R-associated
        kinase (IRAK) family in mammals.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000701353
        source_status: SUPPORTS_TRANSFER
        comment: Ancestral node seeded by Drosophila Pelle and Tube. The Toll/TLR-MyD88 signalling 
          role is conserved, but GO:0008063 names the insect Toll receptor; the vertebrate 
          descendant should carry the toll-like receptor term instead.
