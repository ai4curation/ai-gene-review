    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-446862
  qualifier: located_in
  review:
    summary: IRAK1 is a cytosolic protein held with TOLLIP in resting cells and recruited from the 
      cytosol to the receptor-proximal Myddosome on stimulation.
    action: ACCEPT
    reason: Cytosol is the resting location of IRAK1 and where it couples to TRAF6 and the TAK1/IKK 
      machinery. UniProt records cytoplasm by experiment (PubMed:16690127); HPA immunofluorescence 
      shows cytosol.
    supported_by:
    - reference_id: file:human/IRAK1/IRAK1-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Interacts with TOLLIP; this interaction occurs in the cytosol prior to 
        receptor activation
