core_functions:
- description: "Signalling scaffold of the IL-1R/TLR pathway: after recruitment to the MYD88-IRAK4 Myddosome
    and phosphorylation, IRAK1 recruits TRAF6 and couples it to TAK1-TAB, and once K63-ubiquitinated recruits
    NEMO/IKK, driving NF-kappaB and MAPK activation. This role does not require IRAK1's own catalytic
    activity and is partly redundant with IRAK2."
