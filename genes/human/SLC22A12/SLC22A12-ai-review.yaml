    supporting_text: Interacts with PDZK1.
    record_section:
    - CC:SUBUNIT
proposed_new_terms:
- proposed_name: urate:monocarboxylate antiporter activity
  proposed_definition: Enables the transfer of urate from one side of a membrane to the
    other (uptake) in exchange for a monocarboxylate anion (such as (S)-lactate or
    nicotinate) moving in the opposite direction.
  justification: URAT1's defining molecular function is urate uptake in electroneutral
    exchange for intracellular monovalent organic anions - chiefly monocarboxylates such
    as (S)-lactate, nicotinate and pyrazinoate (UniProt curates the urate/(S)-lactate and
    nicotinate/urate Rhea exchange reactions to PubMed:12024214). This substrate-coupled
    exchange is captured today only by the generic GO:0015297 antiporter activity plus
    GO:0015143 urate transmembrane transporter activity; a specific MF term would precisely
    describe the "urate trap" mechanism shared by the renal urate reabsorbers. This is a
    substrate-specific exchange term, not a re-proposed obsolete organic-anion grouping term
    (GO:0008514/GO:0015347/GO:0015301, all obsolete and deliberately avoided).
  proposed_parent:
    id: GO:0015297
    label: antiporter activity
suggested_questions:
- question: What is the definitive exchange stoichiometry and electrogenicity of URAT1?
    The urate/monocarboxylate and urate/chloride exchanges are established, but the number
    of counter-anions per urate, the relative physiological contribution of lactate vs
    nicotinate vs chloride vs pyrazinoate as counter-substrates in vivo, and whether the
    electroneutral description holds for all modes remain to be unified.
- question: How does the recently determined cryo-EM structure of URAT1 (PDB 9B1F-9B1O,
    9DK9-9DKC, etc.) explain substrate recognition and the mechanism of uricosuric drug
    inhibition (benzbromarone, lesinurad, dotinurad, verinurad), and how do the RHUC1
    loss-of-function variants map onto the substrate/counter-anion sites and the
    conformational cycle?
suggested_experiments:
- description: Reconstitute purified URAT1 in proteoliposomes preloaded with defined
    monocarboxylates (lactate, nicotinate, pyrazinoate) or chloride and measure urate
    uptake while independently controlling trans-side counter-anion identity/concentration,
    membrane potential and pH, with electrophysiology, to establish the exchange
    stoichiometry and electrogenicity unambiguously.
- description: Use the apo and substrate/inhibitor-bound cryo-EM structures together with
    structure-guided mutagenesis to define the urate-binding site, the counter-anion site,
    and the binding modes of uricosuric drugs, and test predicted contacts by uptake assays.
- description: Quantify in vivo the contribution of URAT1 to renal urate reabsorption and
    serum urate relative to GLUT9 (SLC2A9) and the secretory transporters (ABCG2, NPT1/4)
    using humanized or knock-in mouse models carrying defined RHUC1 variants, under
    exercise and uricosuric-drug challenge.
