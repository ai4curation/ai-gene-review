id: Q96S37
gene_symbol: SLC22A12
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC22A12 encodes URAT1 (urate anion exchanger 1), a 553-residue, 12-transmembrane-domain
  member of the SLC22/organic cation transporter family within the major facilitator
  superfamily. It is the apical urate/anion antiporter of the renal proximal tubule
  brush-border membrane and the principal molecular determinant of serum urate. URAT1
  reabsorbs urate from the tubular lumen by electroneutral exchange, taking up urate
  coupled to efflux of intracellular monovalent organic or inorganic anions (notably
  (S)-lactate, nicotinate and other monocarboxylates such as pyrazinoate, and chloride).
  The transporter itself is sodium-independent; the outward counter-anion gradient
  that drives urate uptake is maintained by separate Na(+)-monocarboxylate cotransporters,
  so coupling to the sodium gradient is indirect and URAT1 is neither a facilitative
  uniporter nor directly Na(+)- or H(+)-coupled. It also transports orotate (coupled
  to nicotinate efflux, chloride-dependent), indicating a minor role in renal orotate
  reabsorption. URAT1 is apically scaffolded and functionally regulated by the PDZ-domain
  protein PDZK1. Loss-of-function variants cause renal hypouricemia type 1 (exercise-induced
  acute kidney injury, nephrolithiasis), and URAT1 is the target of uricosuric drugs
  (benzbromarone, probenecid, lesinurad, dotinurad, verinurad).
