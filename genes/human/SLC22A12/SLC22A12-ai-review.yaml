core_functions:
- description: Apical urate/anion antiport - URAT1 operates as an electroneutral exchanger
    that takes up urate from the tubular lumen in exchange for efflux of intracellular
    monovalent anions (notably (S)-lactate, nicotinate and other monocarboxylates, and
    chloride). The transporter is sodium-independent; the outward counter-anion gradient
    is maintained by Na(+)-monocarboxylate cotransporters, so coupling to the sodium
    gradient is indirect. This exchange mechanism is the mechanistic core of renal urate
    reabsorption.
  molecular_function:
    id: GO:0015297
    label: antiporter activity
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0031526
    label: brush border membrane
  substrates:
  - id: CHEBI:17775
    label: urate
  - id: CHEBI:16651
    label: (S)-lactate
  - id: CHEBI:32544
    label: nicotinate
  - id: CHEBI:17996
    label: chloride
  supported_by:
  - *uni_func
  - *uni_exch
- description: Urate transmembrane transport - URAT1 is the principal renal apical urate
    transporter, reabsorbing filtered urate across the brush-border membrane and thereby
    setting serum urate levels (Km approx. 371 uM). Loss of function causes renal
    hypouricemia type 1.
  molecular_function:
    id: GO:0015143
    label: urate transmembrane transporter activity
  directly_involved_in:
  - id: GO:0015747
    label: urate transport
  locations:
  - id: GO:0016324
    label: apical plasma membrane
  - id: GO:0031526
    label: brush border membrane
  substrates:
  - id: CHEBI:17775
    label: urate
  supported_by:
  - *uni_func
  - *uni_reabs
- description: Apical scaffolding via PDZ-motif binding - URAT1's C-terminal PDZ-binding
    motif binds the PDZ-domain protein PDZK1, which anchors URAT1 at the brush-border
    membrane and up-regulates its urate transport activity.
  molecular_function:
    id: GO:0030165
    label: PDZ domain binding
