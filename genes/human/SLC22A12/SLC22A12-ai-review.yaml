- term:
    id: GO:0046415
    label: urate metabolic process
  evidence_type: IMP
  original_reference_id: PMID:19503597
  qualifier: involved_in
  review:
    summary: GWAS meta-analysis associates SLC22A12 variants with serum uric acid concentrations.
    action: MARK_AS_OVER_ANNOTATED
    reason: URAT1 is a transporter, not a urate-metabolizing enzyme - it performs no chemical
      reaction on urate. Its effect on serum urate operates through transport/reabsorption, which
      is accurately captured by urate transport (GO:0015747) and urate homeostasis. The GWAS
      evidence shows association with urate levels (necessity), not participation in a urate
      metabolic reaction, so the broad metabolic-process term over-reaches for a transporter.
    supported_by:
    - *uni_reabs
    source_defects:
    - defect_type: WRONG_EVIDENCE_CODE
      resource: ARUK_UCL
      requested_change: CHECK
      slot: Evidence_Code
      asserted_value: ECO:0000315
      confidence: SUSPECTED
      explanation: This annotation (GO:0046415 urate metabolic process, PMID:19503597,
        assigned_by BHF-UCL) carries evidence code IMP (ECO:0000315, inferred from mutant
        phenotype), but PMID:19503597 is a GWAS meta-analysis reporting a statistical
        association between SLC22A12 variants and serum urate levels, not a mutant-phenotype
        experiment demonstrating a gene-specific effect. A genetic-association finding does
        not meet the IMP definition, so the evidence code should be re-examined; the term
        itself also over-reaches for a transporter that performs no urate-metabolizing
        reaction (see this row's review action). This is not an isolated row. BHF-UCL applied
        the identical GO:0046415 / ECO:0000315 (IMP) annotation from PMID:19503597 to the
        other urate GWAS loci on the same date (2010-09-29) - SLC2A9 (Q9NRM0) and ABCG2
        (Q9UNQ0) - so the question is about a reference-wide GWAS-era convention of coding
        statistical locus associations as IMP, not about this single annotation. GO's IMP
        definition is conventionally read to include natural and allelic variation, which
        BHF-UCL plausibly relied on; the narrower objection here is that a population-level
        statistical association across a cohort is not an observed phenotype of a
        characterised variant.
