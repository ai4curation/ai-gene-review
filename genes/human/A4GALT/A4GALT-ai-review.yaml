suggested_questions:
- question: Which experiment in PMID:10747952 supports the plasma membrane organization annotation,
    and does it demonstrate membrane organization beyond restoration of P(k) antigen expression?
- question: What fraction of endogenous human P1 is carried on N-glycoproteins in normal tissues,
    and how does it depend on A4GALT expression and competing sialylation?
