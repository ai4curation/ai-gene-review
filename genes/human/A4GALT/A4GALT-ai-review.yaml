description: 'A4GALT (Gb3/CD77 synthase; EC 2.4.1.228) is a single-pass type II Golgi membrane
  glycosyltransferase with a lumenal catalytic domain. It transfers galactose from UDP-galactose
  in an alpha-1,4 linkage to lactosylceramide, producing globotriaosylceramide (Gb3, CD77
  or P(k) antigen) and initiating globo-series glycosphingolipid biosynthesis. The wild-type
  enzyme also produces the P1 antigen by galactosylating paragloboside in the neolacto series.
  Recombinant-enzyme and transfected-cell studies additionally demonstrate P1 glycotope synthesis
  on complex N-glycans. Its glycan products contribute to blood-group identity and can serve
  as receptors for Shiga toxins. Biallelic loss-of-function variants cause the p-null blood-group
  phenotype, classified as A4GALT-congenital disorder of glycosylation. The Q211E variant
  has a distinct effect: it broadens acceptor specificity to terminal GalNAc and produces
  NOR antigens associated with inherited polyagglutination.'
