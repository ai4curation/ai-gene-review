- id: PMID:10747952
  title: 'Cloning and expression of the histo-blood group Pk UDP-galactose: Ga1beta-4G1cbeta1-cer
    alpha1, 4-galactosyltransferase. Molecular genetic basis of the p phenotype.'
  findings:
  - statement: Expression in insect cells demonstrated P(k) synthase activity, and homozygous
      M183K was found in six individuals with the p-null phenotype. The original assay did
      not detect P1 activity; later direct biochemical evidence establishes that wild-type
      A4GALT can also synthesize P1.
    supporting_text: Expression of full coding constructs of alpha4Gal-T1 in insect cells
      revealed it encoded P(k) but not P(1) synthase activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed record and cached abstract checked. Supports P(k) synthesis and the
      M183K p-null association. The full text was not available for checking the plasma membrane
      organization annotation. Its original failure to detect P1 activity must not be generalized
      to an inability of the enzyme to make P1; see PMID:26773500.
- id: PMID:10748143
  title: Molecular cloning of globotriaosylceramide/CD77 synthase, a glycosyltransferase that
    initiates the synthesis of globo series glycosphingolipids.
  findings:
  - statement: Expression cloning of the A4GALT cDNA (Gb3/CD77 synthase) produced alpha-1,4-galactosyltransferase
      activity on lactosylceramide (and galactosylceramide), yielding Gb3/CD77 and initiating
      globo-series glycosphingolipid synthesis; the protein is a type II membrane protein.
    supporting_text: the extracts of the transfectant cells showed alpha1, 4-galactosyltransferase
      activity only on lactosylceramide and galactosylceramide
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed record and cached abstract checked. Supports expression cloning,
      catalytic activity, and predicted type II membrane topology. The cache is abstract-only;
      topology prediction is not a direct Golgi-localization assay.
- id: Reactome:R-HSA-9840309
  title: Glycosphingolipid biosynthesis
  findings: []
- id: Reactome:R-HSA-9846477
  title: A4GALT transfers galactose to LacCer
  findings: []
- id: file:human/A4GALT/A4GALT-uniprot.txt
  title: UniProt entry Q9NPC4 (A4GAT_HUMAN), Lactosylceramide 4-alpha-galactosyltransferase
  findings:
  - statement: A4GALT is a Golgi apparatus membrane, single-pass type II membrane glycosyltransferase
      (EC 2.4.1.228) that transfers galactose from UDP-alpha-D-galactose in an alpha-1,4 linkage
      to lactosylceramide to produce globotriaosylceramide/Gb3Cer (P(k)/CD77 antigen), the
      root structure of the globo-series neutral glycosphingolipids.
    supporting_text: 'SUBCELLULAR LOCATION: Golgi apparatus membrane'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authoritative UniProt record for Q9NPC4.
- id: PMID:26773500
  title: Human Gb3/CD77 synthase reveals specificity toward two or four different acceptors
    depending on amino acid at position 211, creating P(k), P1 and NOR blood group antigens.
  findings:
  - statement: Direct biochemical assays show that wild-type A4GALT synthesizes both P(k)
      and P1; Q211E adds NOR acceptor specificity.
    supporting_text: the consensus enzyme synthesizes both the P(k) and P1 antigens, while
      its p.Q211E variant additionally synthesizes the NOR antigen
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed record and abstract checked. Direct recombinant-enzyme evidence resolves
      the older P1-synthase ambiguity; the cache is abstract-only.
- id: PMID:33460651
  title: Human Gb3/CD77 synthase produces P1 glycotope-capped N-glycans, which mediate Shiga
    toxin 1 but not Shiga toxin 2 cell entry.
  findings:
  - statement: Recombinant and transfected-cell assays demonstrate P1 glycotope synthesis
      on complex N-glycans. The glycoprotein products, rather than the A4GALT enzyme, can
      act as Stx1 receptors.
    supporting_text: both enzymes produce P1 glycotopes on N-glycoproteins, with the mutein
      exhibiting elevated activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed record and PMC full text checked. The study uses purified enzyme
      and transfected CHO-Lec2 cells; it establishes acceptor capacity without establishing
      the quantitative contribution of endogenous N-glycoprotein modification in normal human
      tissues.
- id: PMID:22965229
  title: A single point mutation in the gene encoding Gb3/CD77 synthase causes a rare inherited
    polyagglutination syndrome.
  findings:
  - statement: Q211E broadens A4GALT acceptor specificity to produce NOR antigens, a mechanism
      distinct from p-null loss of function.
    supporting_text: Cells transfected with the vector encoding the Gb3/CD77 synthase with
      Glu at position 211 expressed both P1 and NOR antigens.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed record and cached abstract checked. NOR-positive donors were heterozygous
      for the specificity-altering allele. The publication cache is abstract-only; the automated
      PMC retrieval did not obtain full text.
- id: PMID:10993874
  title: Molecular basis for the p phenotype. Identification of distinct and multiple mutations
    in the alpha 1,4-galactosyltransferase gene in Swedish and Japanese individuals.
  findings:
  - statement: Distinct homozygous A4GALT variants cause loss or severe reduction of enzyme
      activity in p-phenotype individuals.
    supporting_text: P251L and M183K mutations showed complete loss of enzyme function
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: NCBI-fetched PubMed record and abstract checked. Supports the loss-of-function
      mechanism through variant transfection assays; the cache is abstract-only.
