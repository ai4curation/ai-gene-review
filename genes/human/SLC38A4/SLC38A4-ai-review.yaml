core_functions:
- description: >-
    Sodium-coupled symport of small neutral amino acids (preferentially glycine,
    L-alanine, L-serine, L-asparagine and L-threonine) from the extracellular space
    into the cell across the plasma membrane; transport is electrogenic and
    pH-dependent and cotransports Na(+) with the amino acid substrate.
  molecular_function:
    id: GO:0005295
    label: neutral L-amino acid:sodium symporter activity
  directly_involved_in:
  - id: GO:0015804
    label: neutral amino acid transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:33928121
    supporting_text: >-
      LC-MS analysis confirmed glycine, alanine, serine, threonine and glutamine as
      SNAT4 substrates
  - reference_id: PMID:11414754
    supporting_text: >-
      the strongest transport activities were specific for l-alanine. In addition,
      hNAT3 is a Na(+)- and pH-dependent, low-affinity transporter
- description: >-
    At the placental syncytiotrophoblast microvillous (and basal) plasma membrane,
    mediates Na(+)-coupled neutral amino acid uptake contributing to the System A
    activity that supplies neutral amino acids for fetal growth.
  molecular_function:
    id: GO:0005283
