id: Q969I6
gene_symbol: SLC38A4
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  SLC38A4 (SNAT4/ATA3/NAT3) is a multi-pass plasma-membrane solute carrier of the
  SLC38 (System N/A) family. It is a sodium-coupled symporter that cotransports
  small neutral amino acids (preferentially glycine, L-alanine, L-serine,
  L-asparagine and L-threonine, with lower-affinity handling of L-cysteine,
  L-histidine, L-proline, L-glutamine and L-methionine) together with Na(+) from
  the extracellular to the intracellular compartment; transport is electrogenic
  and pH-dependent and partially tolerates Li(+) in place of Na(+). It is a
  System A-like activity but, unlike SNAT1/SNAT2, has low affinity for the System
  A model substrate MeAIB. Earlier work reported additional Na(+)-independent
  transport of cationic amino acids (arginine, lysine), but a recent quantitative
  study could not reproduce cationic transport, and this remains unresolved. The
  protein is strongly enriched in liver (and kidney) and is also expressed at the
  microvillous and basal plasma membranes of the placental syncytiotrophoblast,
  where System A transporters supply neutral amino acids for fetal growth.
