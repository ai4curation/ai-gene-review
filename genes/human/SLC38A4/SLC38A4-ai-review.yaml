proposed_new_terms: []
suggested_questions:
- question: >-
    Does human SLC38A4 transport cationic amino acids (arginine, lysine) in a
    Na(+)-independent mode, or was the original System y(+)L-like activity an
    artifact? Resolving the Hatanaka vs Fairweather disagreement would determine
    whether cationic transporter-activity terms belong on this gene.
- question: >-
    What is the physiological consequence of SLC38A4 imprinting and loss for human
    fetal/neonatal amino-acid supply and growth, given the strong liver and
    placental expression?
suggested_experiments:
- description: >-
    Re-measure cationic amino acid (arginine, lysine) transport by cleanly
    expressed human SLC38A4 under matched ionic conditions, using complementary
    methods (radiolabel flux, electrophysiology, and LC-MS), to settle whether
    Na(+)-independent cationic transport is a genuine function.
- description: >-
    Determine SLC38A4 substrate kinetics and transport stoichiometry (Na(+):amino
    acid coupling ratio) for the full neutral-substrate range to refine the
    molecular-function annotations and quantify substrate preference.
