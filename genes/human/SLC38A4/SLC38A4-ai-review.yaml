  review:
    summary: >-
      Phylogenetically inferred amino acid transmembrane transport; SLC38A4 is a
      bona fide amino acid transmembrane transporter, so this is the correct
      process term at an appropriate (genus) level.
    action: ACCEPT
    reason: >-
      SLC38A4 directly transports neutral amino acids across the plasma membrane
      (experimentally shown in several studies), so membership of this process is
      well founded. The IBD node placement across the SLC38/amino-acid transporter
      family is sound, and SLC38A4 (Q969I6) appears among its own WITH/FROM, which
      reflects experimental grounding on the target and is expected, not circular.
      This is the core transport process of the gene.
    supported_by:
    - reference_id: PMID:11414754
      supporting_text: >-
        hNAT3 is a Na(+)- and pH-dependent, low-affinity transporter and partially
        tolerates substitution of Na(+) by Li(+).
