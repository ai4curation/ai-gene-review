id: Q9UQ53
gene_symbol: MGAT4B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: MGAT4B encodes GnT-IVb, a type-II Golgi glycosyltransferase that adds the 
  beta-1,4-linked GlcNAc branch to the GlcNAc-beta-1,2-Man-alpha-1,3 arm of complex N-glycans. 
  Recombinant human MGAT4B has the same acceptor specificity as MGAT4A but lower acceptor and donor 
  affinities, so it functions as a supported lower-affinity GnT-IV isozyme in N-glycan branching; its
  interaction with the UDP-GlcNAc transporter SLC35A3 may tune Golgi UDP-GlcNAc supply.
