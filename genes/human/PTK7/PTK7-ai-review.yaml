  review:
    summary: 'InterPro2GO mapping from the protein kinase catalytic domain and tyrosine kinase active-site signatures.
      PTK7 retains a kinase fold but is a pseudokinase: it lacks catalytic consensus residues, does not bind ATP,
      and its ATP pocket is occluded in the crystal structure of the human domain.'
    action: REMOVE
    reason: Domain-signature transfer of catalytic activity to a fold-retaining pseudokinase. The absence of nucleotide
      binding is shown directly for human PTK7 (thermal-shift assay) and structurally (occluded ATP site), and the
      protein was recognized as catalytically inactive at cloning. The human NOT ATP binding IDA row in this review
      is the consistent claim.
    supported_by:
    - reference_id: PMID:7478540
      supporting_text: These define CCK-4 as a catalytically inactive member of the RTK family of proteins
    - &id001
      reference_id: PMID:24107129
      supporting_text: CCK4 (colon carcinoma kinase 4)/PTK7 (protein tyrosine kinase 7) [56], BubR1 [35], IRAK3/IRAK-M
        [57] and MviN [28] were not catalytically active in vitro in previously published studies, consistent with
        our observations that they do not bind ATP
    - &id002
      reference_id: PMID:32619402
      supporting_text: ATP binding to PTK7 and ROR2 is prevented by projection of a tyrosine side-chain from the
        β5/αD hinge region (Y877 and Y555 respectively) into the adenine ring binding site
