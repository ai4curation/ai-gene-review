- term:
    id: GO:0007411
    label: axon guidance
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0008046
  review:
    summary: IEA axon guidance inferred by inter-ontology link from the IBA axon guidance receptor activity (GO:0008046).
    action: MARK_AS_OVER_ANNOTATED
    reason: Derived mechanically from the PTN002895063 axon guidance receptor activity IBA, which is itself an over-propagation
      of an L1CAM-family function. This IBA descends from PANTHER node PTN002895063, whose IBD seeds are exclusively
      L1-family neuronal cell adhesion molecules (human L1CAM P32004, mouse L1cam MGI:96721, rat L1cam RGD:61941
      and Nrcam RGD:619777). PTK7 sits in a separate subfamily of PTHR45080 (SF21, inactive tyrosine-protein kinase
      7) that is classified with L1CAM only at the level of a heterogeneous Ig-superfamily family; the PTK7-clade
      node (PTN000701324) carries only cell-cell junction and regulation of canonical Wnt signaling, both seeded
      by human PTK7 itself. No PTK7 ortholog has experimental evidence for this neuronal L1-type function, and PTK7
      is studied as an epithelial planar-cell-polarity regulator. The node placement therefore over-reaches for
      this branch.
