suggested_questions:
- question: Which Wnt receptor complexes does human PTK7 join in a given tissue - Frizzled7, ROR2, VANGL
    or others - and does the pseudokinase domain select among them?
- question: Is the soluble PTK7 ectodomain released by MT1-MMP an active ligand trap or signalling molecule,
    or simply the by-product of inactivating the membrane receptor?
- question: Does the pseudokinase domain bind any nucleotide or metabolite that could act as an allosteric
    switch, given that it folds stably but does not bind ATP?
suggested_experiments:
- description: Structure-guided separation-of-function mutants of the PTK7 pseudokinase domain, assayed
    for binding to candidate Wnt-pathway partners and for rescue of canonical and planar polarity readouts
    in PTK7-null human cells.
- description: Quantify the membrane and shed PTK7 pools in matched normal and invasive carcinoma cells
    with surface biotinylation plus targeted mass spectrometry, and test whether the uncleavable L622D
    mutant alters migration in human cells as it does in zebrafish.
- description: Proximity labelling from an extracellular PTK7 bait in polarized epithelial monolayers
    to map its junctional receptor complex, comparing apical/basolateral and leading-edge pools.
