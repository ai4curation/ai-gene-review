    label: coreceptor activity
  evidence_type: NAS
  original_reference_id: PMID:24431302
  qualifier: enables
  review:
    summary: NAS coreceptor activity citing a review on Wnt signaling in midbrain dopaminergic neuron development;
      the cached abstract does not mention PTK7.
    action: UNDECIDED
    reason: 'PTK7 is widely described as a Wnt co-receptor: it forms a complex with Frizzled-7, and soluble PTK7
