id: Q13308
gene_symbol: PTK7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PTK7 (colon carcinoma kinase 4, CCK-4) is a single-pass type I transmembrane glycoprotein
  with seven extracellular immunoglobulin-like domains and an intracellular pseudokinase domain. The kinase-like
  domain has lost the residues required for catalysis - PTK7 does not bind ATP and is catalytically inactive
  - so the protein works as a cell-surface coreceptor and scaffold rather than an enzyme. PTK7 is a core
  component of the non-canonical Wnt/planar cell polarity pathway and also acts upstream of GSK3 in canonical
  Wnt/beta-catenin signalling, where it interacts with CTNNB1. Through these pathways it controls cell
  polarity, directional migration, actin cytoskeleton organization and epithelial tissue organization,
  and it concentrates at cell-cell junctions and at the leading edge of migrating cells. MT1-MMP (MMP14)
  cleaves the seventh Ig-like domain, shedding a soluble ectodomain and switching PTK7 output; this proteolytic
  balance is required for normal convergent extension in vertebrate embryos and is altered in invasive
  carcinoma.
