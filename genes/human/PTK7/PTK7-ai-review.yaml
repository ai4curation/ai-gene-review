  - *id008
  - *id009
  - *id001
  - *id002
suggested_questions:
- question: Does the PTK7 ectodomain bind Wnt ligands directly, or only as part of a Frizzled-7 (or ROR2) receptor
    complex, and does that justify a coreceptor activity annotation?
- question: What determines whether PTK7 promotes (HCT116, MEFs) or inhibits (Xenopus, Drosophila, reporter assays)
    canonical Wnt/beta-catenin signaling?
- question: Should the PCP role established by mouse and Xenopus genetics be captured for human PTK7 through a Wnt/PCP
    process term, given that the PAINT PTK7 node does not propagate it and the mouse annotations are acts_upstream_of_or_within
    phenotypes?
- question: Should the neuronal L1CAM-derived IBD assertions at PANTHER node PTN002895063 (axon guidance receptor
    activity, axon, neuronal cell body, synapse organization) be moved below the split from the PTK7 subfamily?
suggested_experiments:
- description: Purified-protein binding (SPR or BLI) of the human PTK7 ectodomain to Wnt3a, Wnt5a and the Frizzled-7
    CRD, alone and in combination, to test direct versus complex-dependent Wnt binding.
- description: CRISPR knockout of PTK7 in several human epithelial lines with rescue by wild-type, beta-catenin-binding-deficient
    and MT1-MMP-uncleavable (L622D) PTK7, scoring TCF/LEF activity, junctional Src activity and planar polarity
    readouts, to resolve the context dependence of its Wnt effects.
