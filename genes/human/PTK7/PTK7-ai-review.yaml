core_functions:
- description: Non-catalytic transmembrane pseudokinase receptor at the plasma membrane and cell-cell junctions
    that modulates canonical Wnt/beta-catenin signaling; its intracellular pseudokinase domain binds beta-catenin
    (shown for human PTK7). Lack of ATP binding is shown for the human protein. The sign of the Wnt effect is context
    dependent.
  molecular_function:
    id: GO:0008013
    label: beta-catenin binding
  directly_involved_in:
  - id: GO:0060828
    label: regulation of canonical Wnt signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  - id: GO:0005911
    label: cell-cell junction
