- term:
    id: GO:0060828
    label: regulation of canonical Wnt signaling pathway
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000701324
  - UniProtKB:Q13308
  review:
    summary: IBA regulation of canonical Wnt signaling pathway from the PTK7-clade node PTN000701324 (Amniota),
      seeded by human PTK7.
    action: ACCEPT
    reason: 'PTK7 modulates canonical Wnt/beta-catenin signaling in human cells, mouse fibroblasts, Xenopus and
      Drosophila, but the sign is context dependent: knockdown in human HCT116 cells reduced Wnt3a-induced TCF/LEF
      activity, whereas Xenopus and Drosophila experiments and reporter assays with human PTK7 constructs showed
      inhibition, and canonical Wnts trigger Fz7-dependent PTK7 degradation. The unsigned ''regulation of'' term
      is the correct level, and PAINT placed it on the PTK7 clade. Q13308 in WITH/FROM marks the human experimental
      grounding.'
    supported_by:
    - &id008
      reference_id: PMID:21132015
      supporting_text: decreased expression of PTK7 in the two shPTK7 clones prevented Wnt3a-induced TCF/LEF transcriptional
        activity
    - &id009
      reference_id: PMID:21772251
      supporting_text: PTK7 inhibits rather than activates canonical Wnt activity in Xenopus , Drosophila and luciferase
        reporter assays
    - reference_id: PMID:28420671
      supporting_text: our data suggest a mutual inhibition of canonical and PTK7 Wnt signaling
