    summary: IMP from the SH-SY5Y siRNA screen in which neurite extension was induced by retinoic acid.
    action: UNDECIDED
    reason: Retinoic acid was the differentiation stimulus used in the screen; the phenotype scored was neurite
      extension. Whether PTK7 knockdown altered a response to retinoic acid itself, as opposed to neurite outgrowth
      in RA-treated cells, cannot be assessed from the abstract, which does not mention PTK7. The curator read the
      full text, so the row is left undecided rather than removed.
