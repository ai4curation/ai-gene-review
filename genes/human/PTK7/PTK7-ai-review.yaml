- term:
    id: GO:0090263
    label: positive regulation of canonical Wnt signaling pathway
  evidence_type: IMP
  original_reference_id: PMID:21132015
  qualifier: involved_in
  review:
    summary: 'IMP (Puppo et al. 2011): stable PTK7 knockdown in human HCT116 cells prevented Wnt3a-induced TCF/LEF
      reporter activity; Ptk7-null mouse fibroblasts showed reduced Wnt3a responses rescued by full-length PTK7,
      and PTK7 acts upstream of GSK3 in Xenopus.'
    action: KEEP_AS_NON_CORE
    reason: 'The experiment is sound for the human cell line tested and is retained. The positive sign is not general:
      other studies, including reporter assays with human PTK7, found that PTK7 inhibits canonical Wnt signaling.
      The unsigned regulation of canonical Wnt signaling (IBA) is accepted as the core claim; this signed, context-specific
      term is kept as non-core.'
    supported_by:
    - *id008
    - *id009
