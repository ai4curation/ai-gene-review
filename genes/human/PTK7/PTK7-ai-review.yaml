id: Q13308
gene_symbol: PTK7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PTK7 (protein tyrosine kinase 7, also called colon carcinoma kinase 4, CCK-4) is a single-pass type
  I transmembrane receptor with seven extracellular immunoglobulin-like domains and an intracellular tyrosine-kinase-like
  domain that is catalytically inactive: it lacks key catalytic residues, does not bind ATP, and its ATP pocket
  is occluded by a tyrosine side chain (Y877). PTK7 localizes to the plasma membrane, concentrating at cell-cell
  junctions and the leading edge of migrating cells. It acts as a non-catalytic receptor/scaffold in Wnt signaling:
  it forms complexes with Frizzled-7, recruits Dishevelled (shown in Xenopus), binds beta-catenin through its pseudokinase
  domain, and modulates canonical Wnt/beta-catenin signaling positively or negatively depending on context. In vertebrates
  it is a regulator of planar cell polarity (from mouse and Xenopus genetics), where junctional PTK7-Src signaling
  organizes actomyosin contractility. MT1-MMP (MMP14) sheds its ectodomain between Pro621 and Leu622, generating
  a soluble fragment. In human cells PTK7 affects actin organization, migration, invasion, endothelial tube formation
  and survival. It is widely expressed (high in lung, liver, pancreas, kidney, placenta), is upregulated in several
  cancers, and a human missense variant has been linked to idiopathic scoliosis.'
