core_functions:
- description: Acts at the cell surface as a catalytically inactive Wnt coreceptor and scaffold, partnering
    with Wnt pathway receptors to support canonical Wnt/beta-catenin signalling upstream of GSK3 and to
    organize planar cell polarity signalling at cell-cell junctions.
  molecular_function:
    id: GO:0015026
