  evidence_type: IMP
  original_reference_id: PMID:20837484
  qualifier: involved_in
  review:
    summary: PTK7 and its MT1-MMP-dependent shedding control cell motility.
    action: ACCEPT
    reason: Membrane PTK7 expression inhibits cell invasion and its cleavage by MT1-MMP changes motile
      behaviour; in embryos the same axis is required for convergent extension. Directional migration
      is a principal output of PTK7 planar polarity signalling.
    supported_by:
