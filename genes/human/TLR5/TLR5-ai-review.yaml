id: O60602
gene_symbol: TLR5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  TLR5 is a single-pass type I transmembrane pattern recognition receptor of the Toll-like
  receptor family that detects bacterial flagellin, the structural subunit of the flagellar
  filament, from both Gram-positive and Gram-negative bacteria. Its extracellular
  leucine-rich-repeat ectodomain binds a conserved site on monomeric flagellin that is
  normally buried in the assembled filament and is required for bacterial motility, and TLR5
  forms homodimers at the cell surface. Ligand engagement drives receptor activation that,
  through the intracellular TIR domain and the adaptors MyD88 (and, in intestinal epithelium,
  TRIF/TICAM1), activates NF-kappaB and MAP kinase signalling and induces proinflammatory
  cytokines including TNF, IL-6 and IL-8. TLR5 is expressed on the basolateral surface of
  intestinal epithelia and in lung epithelium and myeloid cells, where it is a key sensor of
  flagellated bacteria and a regulator of mucosal innate immunity and gut homeostasis. Unlike
  most cell-surface TLRs, TLR5 requires the chaperone UNC93B1 for proper plasma membrane
  localization and signalling. A common dominant stop-codon polymorphism (R392STOP) abolishes
  flagellin signalling and is associated with altered susceptibility to bacterial infection
  and autoimmune disease.
