  review:
    summary: TLR5 is a Toll-like receptor whose engagement by flagellin initiates MyD88-dependent innate
      immune signalling; the general TLR signalling pathway is the correct PAINT-level parent of the TLR5-specific
      pathway.
    action: ACCEPT
    reason: Phylogenetically placed at the vertebrate TLR node, which includes TLR5; TLR5 has direct experimental
      evidence for initiating TLR signalling on flagellin binding. The specific GO:0034146 is annotated
      separately.
    supported_by:
    - &id001
      reference_id: PMID:11323673
      supporting_text: 'mammalian TLR5 recognizes bacterial flagellin from both

        Gram-positive and Gram-negative bacteria, and that activation of the receptor

        mobilizes the nuclear factor NF-kappaB and stimulates tumour necrosis

        factor-alpha production'
    - &id002
      reference_id: PMID:11489966
      supporting_text: 'cell

        surface expression of Toll-like receptor 5 (TLR5) conferred NF-kappaB gene

        expression in response to flagellin. The response depended on both extracellular

        leucine-rich repeats and intracellular Toll/IL-1R homology region of TLR5 as

        well as the adaptor protein MyD88'
