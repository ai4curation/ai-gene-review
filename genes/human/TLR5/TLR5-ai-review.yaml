suggested_questions:
- question: What is the physiological role, if any, of the TLR5 ectodomain interaction with
    amyloid-beta for membrane-anchored TLR5 in the brain, as opposed to the engineered soluble
    decoy receptor?
- question: Why does the cell-surface receptor TLR5, unlike TLR1/2/4/6, require the ER chaperone
    UNC93B1 for plasma membrane delivery and signalling?
- question: How is the balance between MyD88-dependent and TRIF-dependent TLR5 signalling set in
    different epithelial and myeloid cell types?
suggested_experiments:
- description: Cryo-EM of the full-length TLR5 homodimer bound to monomeric flagellin to define the
    activated receptor conformation and dimer geometry
- description: Cell-type-resolved knockout/rescue of UNC93B1 to quantify its contribution to TLR5
    surface delivery and flagellin responsiveness across epithelial and myeloid lineages
- description: Structure-guided mutagenesis of the flagellin recognition site to separate ligand
    binding from downstream MyD88 versus TRIF adaptor recruitment
