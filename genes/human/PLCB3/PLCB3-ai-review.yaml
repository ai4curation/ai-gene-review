suggested_questions:
- question: Which endogenous human GPCR pathways require PLCB3 specifically, rather than another
    PLC-beta isoform, in native cells?
- question: How often is PLCB3 activated by coincident G alpha q and G beta/gamma signals in human
    cells, and which Gi-coupled receptors supply the G beta/gamma arm?
- question: Does the OSBPL2-PLCB3 interaction regulate endogenous keratinocyte PLCB3 stability
    strongly enough to warrant a specific non-core pathway annotation?
suggested_experiments:
- description: Endogenously tag PLCB3 in a CaSR-expressing human cell type and compare wild-type,
    PLCB3 knockout, catalytic-dead rescue, and G beta/gamma-binding mutants for calcium-triggered
    PI(4,5)P2 depletion, IP3 production and calcium release.
- description: Measure PLCB3 versus PLCB1/2/4 recruitment and PI(4,5)P2 hydrolysis after selective
    activation of matched Gq-coupled, Gi-coupled and co-stimulated receptors in the same human
    cells.
