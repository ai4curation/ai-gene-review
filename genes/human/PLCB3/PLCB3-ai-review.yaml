id: Q01970
gene_symbol: PLCB3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PLCB3 encodes phospholipase C beta 3, a soluble phosphoinositide-specific phospholipase
  that is recruited to the cytoplasmic face of PI(4,5)P2-containing membranes by G alpha q and G beta/gamma
  subunits downstream of G protein-coupled receptors. It hydrolyzes PI(4,5)P2 to inositol 1,4,5-trisphosphate
  and diacylglycerol, coupling receptor activation to intracellular calcium mobilization and protein kinase
  C signaling, and it also acts as a GTPase-activating effector for G alpha q to help terminate the same
  signaling complex.'
