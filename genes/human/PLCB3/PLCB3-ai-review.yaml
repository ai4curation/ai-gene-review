    label: regulation of systemic arterial blood pressure
  evidence_type: IDA
  original_reference_id: PMID:18468998
  qualifier: acts_upstream_of_or_within
  review:
    summary: The alpha1D-adrenergic receptor signalosome paper does not establish a PLCB3-specific
      blood-pressure role.
    action: MARK_AS_OVER_ANNOTATED
    reason: TAP/MS detected PLCB3 near alpha-syntrophin in a study focused on dystrophin/syntrophin
      control of the alpha1D-adrenergic receptor. The blood-pressure phenotype follows loss of
      syntrophins, not direct PLCB3 perturbation, so this organism-level term over-extends the
      complex-membership lead.
    supported_by:
    - reference_id: PMID:18468998
      supporting_text: TAP/MS of α-syntrophin identified proteins involved in signal transduction
