- id: PMID:12821674
  title: Calmodulin is a phospholipase C-beta interacting protein.
  findings:
  - statement: Calmodulin binds human PLCB3 at its N terminus in yeast two-hybrid, in vitro binding
      and CaM-Sepharose pulldown assays.
    supporting_text: Physical interaction between CaM and PLC beta 3 is supported
- id: PMID:18468998
  title: Blood pressure is regulated by an alpha1D-adrenergic receptor/dystrophin signalosome.
  findings:
  - statement: PLCB3 was detected as an alpha-syntrophin TAP/MS hit in an alpha1D-adrenergic
      receptor signalosome study, but the blood-pressure experiments tested syntrophins, not PLCB3.
    supporting_text: TAP/MS of α-syntrophin identified proteins involved in signal transduction
- id: PMID:20966218
  title: Kinetic scaffolding mediated by a phospholipase C-beta and Gq signaling complex.
  findings:
  - statement: Activated G alpha q binds PLCB3, stimulates PLCB3-dependent inositol lipid
      hydrolysis, and is inactivated by PLCB3 EF3/4-loop GAP activity.
    supporting_text: PLC-β3 promoted up to 100-fold stimulation of GTP hydrolysis
- id: PMID:21822282
  title: An autoinhibitory helix in the C-terminal region of phospholipase C-β mediates Gαq
    activation.
  findings:
  - statement: The PLC-beta proximal C-terminal autoinhibitory helix restrains basal activity and
      mediates G alpha q regulation.
    supporting_text: Mutations designed to disrupt the analogous interaction in human PLCβ3
- id: PMID:23377541
  title: Full-length Gα(q)-phospholipase C-β3 structure reveals interfaces of the C-terminal
    coiled-coil domain.
  findings:
  - statement: Full-length human PLCB3 forms a monomeric complex with activated G alpha q, and its
      distal C-terminal domain contributes to membrane targeting and catalytic-core orientation.
    supporting_text: Functional analysis suggests that the distal CTD has roles in membrane
      targeting and in optimizing the orientation of the catalytic core at the membrane
- id: PMID:25468996
  title: E-cadherin interactome complexity and robustness resolved by quantitative proteomics.
  findings:
  - statement: A high-throughput E-cadherin BioID/proteomics screen nominated many
      E-cadherin-proximal candidate proteins.
    supporting_text: Our proteomic analysis as well as localization analysis provided a wealth of
      candidate cadhesome proteins
- id: PMID:27276689
  title: mGlu1 receptor canonical signaling pathway contributes to the opening of the orphan GluD2
    receptor.
  findings:
  - statement: mGlu1 activates the canonical Gq-PLC-PKC pathway at Purkinje-cell synapses, providing
      a neuronal context for PLC signaling rather than a PLCB3-specific postsynaptic function.
    supporting_text: the opening of the GluD2 channel by mGlu1 receptor mobilizes the canonical
      Gq-PLC-PKC pathway
- id: PMID:29122926
  title: Defect in phosphoinositide signalling through a homozygous variant in PLCB3 causes a new
    form of spondylometaphyseal dysplasia with corneal dystrophy.
  findings:
  - statement: A homozygous p.A878S PLCB3 variant destabilizes PLCB3, reduces enzymatic activity,
      raises PIP2 in patient fibroblasts and causes spondylometaphyseal dysplasia with corneal
      dystrophy.
    supporting_text: 95% reduction in PLCB3-p.A878S protein levels
- id: PMID:37172014
  title: Gβγ activates PIP2 hydrolysis by recruiting and orienting PLCβ on the membrane surface.
  findings:
  - statement: G beta/gamma activates PLCB3 by recruiting soluble PLCB3 to the membrane and
      orienting its catalytic core toward PIP2.
    supporting_text: Two Gβγ proteins assemble to form a complex with PLCβ3 on vesicle surfaces.
- id: PMID:37991948
  title: The mechanism of Gα(q) regulation of PLCβ3-catalyzed PIP2 hydrolysis.
  findings:
  - statement: G alpha q directly activates PLCB3 by increasing kcat, and G alpha q can bind
      simultaneously with G beta/gamma to stimulate PLCB3.
    supporting_text: we show that Gαq increases the catalytic rate constant, kcat, of PLCβ3.
- id: PMID:38701954
  title: OSBPL2 compound heterozygous variants cause dyschromatosis, ichthyosis, deafness and atopic
    disease syndrome.
  findings:
  - statement: OSBPL2 was reported to bind PLCB3 and stabilize it by limiting PLCB3 ubiquitylation
      and degradation in a keratinocyte-differentiation disease context.
    supporting_text: OSBPL2 effectively inhibits the ubiquitylation of PLCB3
- id: PMID:7607669
  title: Genomic organization and complete cDNA sequence of the human phosphoinositide-specific
    phospholipase C beta 3 gene (PLCB3).
  findings:
  - statement: The human PLCB3 cDNA and gene structure identify PLCB3 as a phosphoinositide-specific
      PLC-beta isozyme.
    supporting_text: phosphoinositide-specific phospholipase C beta 3 gene (PLCB3)
- id: PMID:9188725
  title: Phosphoinositide binding specificity among phospholipase C isozymes as determined by
    photo-cross-linking to novel substrate and product analogs.
  findings:
  - statement: PLC-beta3 catalysis was assayed in a substrate-specificity study of PLC isozymes.
    supporting_text: no inhibition of PLC-beta1, -beta2, or -beta3 activity was observed
