core_functions:
- description: BLM couples ATP hydrolysis to 3-prime-to-5-prime DNA strand separation and branched-DNA
    remodeling. In the BTR complex it supplies the helicase step of double-Holliday-junction dissolution,
    while TOP3A supplies topoisomerase chemistry. The same DNA motor participates in DNA-end processing,
    stalled-fork remodeling and telomeric DNA transactions.
  molecular_function:
    id: GO:0043138
    label: 3'-5' DNA helicase activity
  in_complex:
    id: GO:0031422
    label: RecQ family helicase-topoisomerase III complex
  directly_involved_in:
  - id: GO:0000724
    label: double-strand break repair via homologous recombination
  - id: GO:0031297
    label: replication fork processing
  - id: GO:0000723
    label: telomere maintenance
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:9388193
    supporting_text: DNA helicase activity that displays 3'-5' directionality
  - reference_id: PMID:25901030
    supporting_text: 4-way junction branch migration and double Holliday junction dissolution
  - reference_id: PMID:21325134
  - reference_id: PMID:17115688
  - reference_id: PMID:16030011
- description: BLM promotes annealing of complementary DNA strands, a molecular activity distinct from
    strand separation. Together with unwinding, annealing can contribute to replication-fork regression.
    The purified catalytic-fragment assay shows concentration-dependent annealing, and does not establish
    that every cellular BLM assembly or modification has the same balance of activities.
  molecular_function:
    id: GO:1990814
    label: DNA/DNA annealing activity
  directly_involved_in:
  - id: GO:0031297
    label: replication fork processing
  supported_by:
  - reference_id: PMID:17878217
    supporting_text: we did detect the strand annealing activity with BLM642–1290 at protein concentrations
      above 80 nM
  - reference_id: PMID:17115688
suggested_questions:
- question: Which full experimental results support BLM regulation of CDC2 in PMID:15604258, rather than
    BLM phosphorylation simply reporting CDC2 activity?
- question: What exact RPS27/P42677 interaction experiment underlies the separate PMID:16864798 row, and
    how should it be distinguished from MPS1/TTK and PLK1?
- question: Which primary BLM experiment supports t-circle formation in PMID:27918544, given the reported
    BLM C-circle null result and the separate NBS1/XRCC3 experiments?
- question: Which human cellular context supports the inherited cytoplasmic localization, and does it
    involve a specific physiological or cell-cycle-dependent BLM pool?
- question: Should GO:0071139 explicitly distinguish non-crossover BTR dissolution from endonucleolytic
    Holliday-junction resolution, while retaining both routes to intact repair products?
suggested_experiments:
- hypothesis: BLM DNA strand annealing and unwinding make separable contributions to fork remodeling.
  description: Compare full-length human BLM and the characterized catalytic fragment at matched active
    concentrations, with ATP, RPA and BTR components varied independently; quantify annealing, fork regression
    and unwinding on defined substrates.
- hypothesis: The cellular BLM–NABP2 association requires either an additional factor or a modification
    absent from the recombinant proteins.
  description: Reconstitute binding with defined BLM/NABP2 modification states and candidate bridging
    factors, alongside cellular co-IP and DNA/nuclease controls. Measure direct binding separately from
    BLM stability and chromatin recruitment.
