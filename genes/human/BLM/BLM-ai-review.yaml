id: P54132
gene_symbol: BLM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BLM is a RecQ-family ATP-dependent DNA helicase that moves with 3-prime-to-5-prime polarity
  and remodels branched DNA structures during genome maintenance. Its helicase, RecQ C-terminal and HRDC
  regions recognize and process duplex overhangs, replication forks, Holliday junctions, D-loops and G-quadruplex
  DNA. In the BLM–TOP3A–RMI1–RMI2 complex, BLM drives convergent branch migration and TOP3A removes the
  resulting DNA entanglement, promoting non-crossover recombination products. BLM also cooperates with
  DNA2 and EXO1 during DNA-end resection and with shelterin-associated proteins during telomeric DNA processing.
  It can anneal complementary DNA strands, an activity that cooperates with unwinding during fork remodeling.
  Nuclear BLM is enriched at repair-associated chromatin and PML nuclear bodies, with localization changing
  through the cell cycle and after DNA damage. Loss of BLM causes Bloom syndrome and a marked increase
  in sister-chromatid exchange and chromosome instability.
