- id: PMID:42386731
  title: Nuclear-specific reductive carboxylation of alpha-ketoglutarate fuels histone acetylation
    to induce chromatin accessibility and gene activation.
  findings:
  - statement: Human MDA-MB-468 and mouse GL261 cells showed nuclear ACO2 staining; human fractionation
      and nuclear immunoprecipitation independently support the human location.
    supporting_text: depicted strong nuclear ACO2 and IDH2 staining
    reference_section_type: RESULTS
  - statement: Fig. 4e assays labeled citrate formation in isolated human MDA-MB-468 nuclei after
      ACO2 or IDH2 depletion, supporting local citrate metabolism in this context.
    supporting_text: isolated nuclei from MDA-MB-468
    reference_section_type: RESULTS
  - statement: Qualitative inspection of Fig. 1a shows ACO2 signal in the human 22Rv1 C fraction,
      but the displayed controls do not distinguish a resident cytosolic pool from soluble mitochondrial
      carryover; the paper does not independently establish that cytosolic interpretation.
    supporting_text: Mouse and human cell lines were fractionated to isolate sub-cellular proteins
      localized within cytoplasm (C), nucleus (N), and mitochondria (M).
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-linked PMC13462710 primary full text and figure legends inspected. Human
      nuclear localization is supported by Fig. 1b,c and Fig. 2b,f; Fig. 4e contains human isolated-nucleus
      flux. Fig. 1e,f,h and Fig. 2h use mouse GL261. ACO2 supplies isomerization, IDH2 carboxylation,
      and KAT2A acetylation; the latter activities are not assigned to ACO2. Fig. 1a has visible
      ACO2, FH and OGDH C signal in 22Rv1; SDHA C is not confidently resolved and MDH2 C is faint
      or ambiguous. Marker absence lacks a calibrated detection limit. These qualitative observations
      leave cytosolic residency versus soluble mitochondrial carryover unresolved; they do not
      overturn the paper's independently supported nuclear findings. The notes record the reviewer's
      inference and its limits.
