  review:
    summary: A cytosolic ACO2 pool is possible, but fractionation does not resolve its residency.
    action: UNDECIDED
    reason: 'Fig. 1a of PMID:42386731 shows an ACO2 band in the human 22Rv1 C fraction. Reinspection
      also finds C signal for FH and OGDH, predominantly M signal without a confidently resolved
      discrete C band for SDHA, and faint or ambiguous C signal for MDH2. Beta-tubulin is C, Lamin
      A/C predominantly N and Tom20 predominantly M, but these by-eye controls have no calibrated
      detection limit and do not exclude soluble mitochondrial carryover. FH/OGDH C signal also
      does not establish contamination: the Results contrast nuclear versus mitochondrial distributions,
      and include OGDH in the nuclear group. The Methods optimize nuclear and mitochondrial purity.
      A resident cytosolic pool is plausible but not distinguished from carryover by this panel
      or independently corroborated by the paper''s nuclear assays. The PAINT gain/loss placement
      for human ACO2 was not resolved. Retain UNDECIDED for the uncertain location, without asserting
      erroneous propagation or a human compartment-specific loss. Mitochondrial targeting and
      the yeast/fission-yeast precedents do not prove exclusive human mitochondrial localization.'
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN001705783
        source_label: PTN001705783
        source_status: UNRESOLVED
