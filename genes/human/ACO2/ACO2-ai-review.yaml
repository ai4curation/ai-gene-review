id: Q99798
gene_symbol: ACO2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ACO2 is the mitochondrial aconitate hydratase, an iron–sulfur enzyme that reversibly
  interconverts citrate and isocitrate through cis-aconitate. Its active subunit binds one [4Fe-4S]
  cluster. In the mitochondrial matrix it catalyzes the citrate-isomerization step of the tricarboxylic
  acid cycle and helps prevent citrate accumulation when citrate production is high. A nuclear
  pool with local citrate-metabolic activity has also been demonstrated in human MDA-MB-468 cells;
  the importance of this pool across normal tissues is not established. ACO2 is distinct from
  the cytosolic aconitase/iron-regulatory protein ACO1.
