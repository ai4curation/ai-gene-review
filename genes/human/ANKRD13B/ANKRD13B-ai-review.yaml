- id: PMID:22298428
  title: The Ankrd 13 family of UIM-bearing proteins regulates EGF receptor endocytosis from the plasma
    membrane.
  findings:
  - statement: ANKRD13 UIMs bind ubiquitinated EGFR.
    supporting_text: Stimulation of human HeLa cells with epidermal growth factor (EGF) rapidly induced
      direct binding of Ankrd 13 proteins to ubiquitinated EGF receptor (EGFR) via the UIMs.
  - statement: ANKRD13 binds Lys63-linked chains.
    supporting_text: Ankrd 13 proteins bound specifically to Lys-63-linked ubiquitin chains, which was
      consistent with a previous report that EGFR mainly undergoes Lys-63-linked polyubiquitination.
  - statement: ANKRD13 is at the plasma membrane with EGFR.
    supporting_text: Ankrd 13 proteins were anchored, via the central region and UIMs, to the plasma membrane,
      where they colocalized with EGFR.
  - statement: Overexpression blocks rapid EGFR internalization.
    supporting_text: Finally, overexpression of wild-type as well as truncated-mutant Ankrd 13 proteins
      strongly inhibited rapid endocytosis of ubiquitinated EGFR from the surface in EGF-treated cells.
  - statement: ANKRD13B colocalizes with a late endosome marker.
    supporting_text: 13A and 13B colocalized considerably with a late endosome marker—cation-independent
      mannose 6-phosphate receptor (CI-M6PR)—in the perinuclear region
  - statement: ANKRD13B uniquely colocalizes with EEA1.
    supporting_text: Ankrd 13B, but not 13A or 13D, also colocalized with an early endosome marker—early
      endosome antigen 1 (EEA1; Supplemental Figure S1, D–F′′).
  - statement: The sign of regulation is open because dominant-negative truncations also inhibit.
    supporting_text: raising the question of whether Ankrd 13 proteins have a stimulatory or inhibitory
      role in the process
  - statement: The authors propose a positive role in EGFR internalization.
    supporting_text: we propose that Ankrd 13A, 13B, and 13D positively regulate the internalization of
      ligand-activated EGFR
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. HeLa cells; source of most GOA rows.
- id: PMID:31985874
  title: Ring Finger Protein 11 acts on ligand-activated EGFR via the direct interaction with the UIM
    region of ANKRD13 protein family.
  findings:
  - statement: ANKRD13A, 13B and 13D bind RNF11 through their UIMs.
    supporting_text: We show that ANKRD13A, ANKRD13B and ANKRD13D form a complex with RNF11 in vivo and
      that the UIMs are required for complex formation.
  - statement: RNF11 promotes lysosomal sorting of activated EGFR.
    supporting_text: RNF11 promotes sorting of the activated EGFR for lysosomal degradation.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only. Primary paper behind the Affinage narrative; corroborates the UIM-EGFR
      adaptor role.
- id: PMID:26797118
  title: The Ankrd13 Family of Ubiquitin-interacting Motif-bearing Proteins Regulates Valosin-containing
    Protein/p97 Protein-mediated Lysosomal Trafficking of Caveolin 1.
  findings:
  - statement: ANKRD13 cooperates with VCP in caveolin-1 lysosomal trafficking.
    supporting_text: Collectively, our results suggest that Ankrd13 proteins cooperate with VCP to regulate
      the lysosomal trafficking of ubiquitinated Cav-1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only.
- id: file:human/ANKRD13B/ANKRD13B-deep-research-affinage.md
  title: Affinage mechanistic annotation for ANKRD13B (human)
  findings: []
  reference_review:
    relevance: LOW
