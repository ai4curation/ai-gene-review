  review:
    summary: Negative regulation of receptor internalization (IEA). Overexpression of ANKRD13 blocks rapid
      EGFR internalization, but the source paper argues the endogenous role is positive; the sign-neutral
      parent is the defensible term.
    action: MODIFY
    reason: The inhibition is an overexpression phenotype [PMID:22298428 "Finally, overexpression of wild-type
      as well as truncated-mutant Ankrd 13 proteins strongly inhibited rapid endocytosis of ubiquitinated
      EGFR from the surface in EGF-treated cells."]. Truncated mutants [PMID:22298428 "which were expected
      to act as dominant-negative versions"] inhibit as strongly as wild type, which the authors read
      as [PMID:22298428 "ectopic overexpression of not only truncated but also wild-type Ankrd 13 inhibits
      the function of endogenous Ankrd 13"]. They therefore pose the sign as open [PMID:22298428 "raising
      the question of whether Ankrd 13 proteins have a stimulatory or inhibitory role in the process"]
      and conclude [PMID:22298428 "we propose that Ankrd 13A, 13B, and 13D positively regulate the internalization
      of ligand-activated EGFR"]. RNAi could not test this because the siRNAs [PMID:22298428 "failed to
      deplete the three Ankrd 13 mRNAs/proteins simultaneously"]. So the negative term asserts a direction
      the evidence does not establish; GO:0002090 regulation of receptor internalization keeps what is
      shown.
    proposed_replacement_terms:
    - id: GO:0002090
      label: regulation of receptor internalization
    supported_by:
    - reference_id: PMID:22298428
      supporting_text: Finally, overexpression of wild-type as well as truncated-mutant Ankrd 13 proteins
        strongly inhibited rapid endocytosis of ubiquitinated EGFR from the surface in EGF-treated cells.
    - reference_id: PMID:22298428
