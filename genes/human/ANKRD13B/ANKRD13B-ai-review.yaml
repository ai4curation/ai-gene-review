gene_symbol: ANKRD13B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ANKRD13B (ankyrin repeat domain-containing 13B) is a ubiquitin-binding adaptor of the ANKRD13
  family, with C-terminal ubiquitin-interacting motifs (UIMs) that bind Lys63-linked polyubiquitin chains.
  It binds ubiquitinated, ligand-activated EGF receptor at the plasma membrane, and its ANKRD13 proteins
  regulate rapid internalization of that receptor; overexpression blocks it, but because dominant-negative
  truncations block it too, the endogenous role is proposed to be positive. They also bind the E3 ligase
  RNF11 through the UIMs. Unlike its paralogs ANKRD13A and ANKRD13D, it also colocalizes with early endosomes,
  and it colocalizes with late endosomes in the perinuclear region. With VCP/p97, the ANKRD13 proteins
  route ubiquitinated caveolin-1 toward lysosomes.
