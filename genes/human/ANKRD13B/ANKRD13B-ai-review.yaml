suggested_questions:
- question: What does ANKRD13B's distinctive early-endosome localization contribute, compared with ANKRD13A
    and ANKRD13D, and is it required at endogenous levels for EGFR trafficking?
suggested_experiments:
- description: Measure EGFR internalization and degradation in ANKRD13A/B/D triple-knockout cells, since
    the existing evidence comes from overexpression and the siRNAs used so far failed to deplete all three
    paralogs, leaving the sign of regulation open.
