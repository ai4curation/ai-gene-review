    review_notes: 'Trust gate tripped: Affinage''s pairwise self-evaluation scored this record a tie against
      UniProt, so it was checked. Its narrative rests on the RNF11 paper (PMID:31985874, cited directly
      instead), a single study of the RNF11-ANKRD13 interaction, and omits PMID:22298428, the source of
      most GOA rows. Nothing is taken from it.'
