- hypothesis: WDR35 directly binds lipid membranes or vesicle cargo through its beta-propellers.
  description: Liposome flotation and cargo-peptide binding assays with purified WDR35/IFT43 heterodimer
    and disease variants, coupled with rescue of WDR35-KO RPE1 ciliary membrane delivery.
  experiment_type: biochemical reconstitution
