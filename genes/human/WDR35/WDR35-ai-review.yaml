- term:
    id: GO:0035720
    label: intraciliary anterograde transport
  evidence_type: IDA
  original_reference_id: PMID:20889716
  qualifier: involved_in
  review:
    summary: Intraciliary anterograde transport.
    action: ACCEPT
    reason: IFT-A rides anterograde trains and WDR35 is essential for ciliary entry of many membrane proteins,
      i.e. for their anterograde import. The 40472089 full text discusses TULP3-dependent GPR45 entry
      with IFT-A as the TULP3 partner; deferring to the curator, the term is biologically correct.
    supported_by:
    - reference_id: PMID:27806291
      supporting_text: Wdr35 is essential for entry of many membrane proteins into the cilium through
        robust interactions with cargoes and other IFT-A subunits
    - reference_id: PMID:20889716
      supporting_text: IFT-A is linked to retrograde ciliary transport, but, surprisingly, we find that
        the IFT-A complex has a second role directing ciliary entry of TULP3.
    - reference_id: PMID:27932497
      supporting_text: the IFT-A complex mediates not only retrograde trafficking but also entry into
        cilia of GPCRs
