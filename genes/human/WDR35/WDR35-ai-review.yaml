id: Q9P2L0
gene_symbol: WDR35
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: WDR35 (IFT121) is a subunit of the intraflagellar transport complex A (IFT-A), built from
  two N-terminal WD40 beta-propellers followed by a TPR-rich alpha-solenoid, an architecture related to
  COPI/clathrin vesicle coat proteins. Within IFT-A it belongs to the peripheral subcomplex (IFT43-IFT121-IFT139),
  where the IFT43-IFT121 dimer connects to the IFT122 core subunit. IFT-A mediates retrograde intraflagellar
  transport along the axoneme and, with the TULP3 adaptor, the entry of membrane proteins (GPCRs, Smoothened,
  EVC/EVC2) into the primary cilium; WDR35 is required for ciliary import of many membrane cargoes and
  for efficient delivery of membrane to the nascent cilium. WDR35 localizes to cilia (axoneme, tip), the
  basal body and centrosome. Fibroblasts lacking WDR35 fail to form or form short, bulbous cilia, and
  mouse Wdr35 mutants die at midgestation with Hedgehog-pathway defects. Biallelic WDR35 variants cause
  short-rib thoracic dysplasia with polydactyly (SRTD7) and cranioectodermal dysplasia (CED2).
