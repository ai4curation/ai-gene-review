- id: PMID:41061852
  title: Mitochondrial phosphopantetheinylation is required for oxidative metabolism.
  full_text_unavailable: false
  findings:
  - statement: >-
      In mouse C2C12 cells, Aasdhppt deficiency reduces holo- and octanoyl-NDUFAB1,
      directly connecting the enzyme to mitochondrial ACP modification and mtFAS.
    supporting_text: >-
      We found that relative to control cells, PPT-deficient cells have reduced levels
      of both holo- and octanoyl-NDUFAB1 (Fig. 2F and G).
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: >-
      Complementary localization assays place a subpopulation of the tested mammalian
      PPT in the mitochondrial matrix.
    supporting_text: >-
      We observed significant Venus signal only when PPT-VN cells were co-expressed
      with either CS-VC or NDUFAB1-VC, indicating that PPT localizes to the
      mitochondrial matrix (Fig. 3F–H, see Supplementary Fig. 3G for gating strategy).
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: >-
      Five substitutions corresponding to human AASDHPPT ClinVar variants of uncertain
      significance (R47H, A72T, W79G, R83C, and K96E) showed reduced rescue of mtFAS
      endpoints when modeled in the PPT-deficient C2C12 system.
    supporting_text: >-
      We found that all variants, except for PPT-GFP P12S, exhibited weaker rescue than
      wild type PPT (Fig. 5F–H, Supplementary Fig. 5G). Of note, cells expressing the
      PPT-GFP W79G variant showed low levels of protein expression compared to the other
      variants (Fig. 5F, Supplementary Fig. 5G–H) despite expression from the same
      promoter, suggesting that this variant may result in protein instability. These
      data identify R47H, A72T, W79G, R83C, and K96E as potential clinically observed
      pathologic variants of AASDHPPT, with molecular phenotypes attributable to altered
      mtFAS activity and perturbed cellular respiration.
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Strong mechanistic mammalian evidence for a mitochondrial AASDHPPT pool,
      NDUFAB1 phosphopantetheinylation, mtFAS, and oxidative metabolism. The core loss-
      of-function, localization, and rescue experiments used C2C12 mouse skeletal
      myoblasts. The study also functionally modeled five substitutions corresponding
      to human ClinVar variants in that mouse rescue system, strengthening its human-
      disease relevance without providing direct endogenous-human-cell localization
      evidence. Full text is cached.
- id: Reactome:R-HSA-199202
  title: Phosphopantetheine conjugation of the ACP domain of FAS
  findings:
  - statement: >-
      Reactome represents cytosolic AASDHPPT transferring phosphopantetheine from CoA
      to FASN ACP Ser2156.
    supporting_text: >-
      Cytosolic AASDHPPT (alpha-aminoadipic semialdehyde
      dehydrogenase-phosphopantetheinyl transferase) catalyzes the transfer of a
      phosphopantetheine moiety from coenzyme A to serine 2156 within the ACP domain of
      FAS (fatty acyl synthase).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      This curated human reaction accurately captures the FASN ACP modification and
      cytosolic reaction context, supported by PMID:12815048 and PMID:18022563. It is a
      database synthesis, not an additional independent experiment.
- id: Reactome:R-HSA-199220
  title: Vitamin B5 (pantothenate) metabolism
  findings:
  - statement: >-
      Reactome places the AASDHPPT reaction in the broad vitamin B5/CoA metabolism
      pathway because pantothenate supplies CoA and phosphopantetheine.
    supporting_text: >-
      Vitamin B5 ((R)-pantothenate, PanK), is an essential precursor for the synthesis
      of the metabolic cofactor Coenzyme A (CoA-SH) (Robishaw and Neely 1985) and is
      the prosthetic group of acyl carrier protein (ACP) (Joshi et al. 2003).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The pathway placement is correct as broad CoA/phosphopantetheine context, but the
      entry does not show that AASDHPPT directly transforms pantothenate. It supports
      pathway membership only at a broad mapping level; the specific process is
      peptidyl-serine phosphopantetheinylation.
- id: file:human/AASDHPPT/AASDHPPT-uniprot.txt
  title: UniProtKB/Swiss-Prot record for human AASDHPPT (Q9NRN7)
  findings:
  - statement: >-
      UniProt records broad transfer of CoA-derived phosphopantetheine to serine in
      protein acceptors including the FASN ACP domain.
    supporting_text: |-
      CC   -!- FUNCTION: Catalyzes the post-translational modification of target
      CC       proteins by phosphopantetheine. Can transfer the 4'-phosphopantetheine
      CC       moiety from coenzyme A, regardless of whether the CoA is presented in
      CC       the free thiol form or as an acetyl thioester, to a serine residue of a
      CC       broad range of acceptors including the acyl carrier domain of FASN.
    reference_section_type: DATABASE_ENTRY
  - statement: UniProt records cytosolic localization for the reviewed human protein.
    supporting_text: >-
      CC   -!- SUBCELLULAR LOCATION: Cytoplasm, cytosol
      {ECO:0000269|PubMed:12815048}.
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Authoritative reviewed snapshot for Q9NRN7, including reaction, Mg2+ cofactor,
      substrate breadth, cytosolic localization, isoforms, and IntAct provenance. Its
      location field currently records only cytosol and therefore does not by itself
      adjudicate the newer mitochondrial-matrix evidence from the mouse C2C12 study.
      Screen-derived interactions are not treated as stable complexes.
core_functions:
- description: >-
    In the directly established human cytosolic context, monomeric AASDHPPT uses
    Mg2+ and coenzyme A to phosphopantetheinylate conserved serines in protein
    acceptors. This broad catalytic activity converts apo substrates such as the
    FASN ACP domain and ALDH1L1 to functional holo forms; substrate engagement is a
    transient catalytic interaction rather than stable complex membership.
  supported_by:
  - reference_id: PMID:18022563
    supporting_text: >-
      Molecular cloning and biochemical characterization of human PPT revealed that
      this cytosolic enzyme is a Mg2+-requiring monomeric enzyme that exhibits a broad
      acceptor substrate specificity [9].
  - reference_id: PMID:19933275
    supporting_text: >-
      In our experiments, incubation of this enzyme with purified recombinant human
      PPT in the presence of CoA and Mg 2+ restored 10-fTHF dehydrogenase activity.
