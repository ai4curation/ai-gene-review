    full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Direct purified-human-protein and human A549 knockdown evidence identifies
      AASDHPPT as the ALDH1L1 phosphopantetheinyl transferase, establishes the Ser354
      acceptor, and links modification to FDH activity. Full text is cached.
