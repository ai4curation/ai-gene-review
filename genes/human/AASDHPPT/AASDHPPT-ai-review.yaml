- id: PMID:19933275
  title: Acyl carrier protein-specific 4'-phosphopantetheinyl transferase activates
    10-formyltetrahydrofolate dehydrogenase.
  full_text_unavailable: false
  findings:
  - statement: >-
      Human AASDHPPT converts apo-ALDH1L1/FDH to its catalytically active holoenzyme.
    supporting_text: >-
      In the current study, we demonstrate that the broad specificity human PPT
      converts apo-FDH to holoenzyme and thus activates FDH catalysis.
    reference_section_type: ABSTRACT
    full_text_unavailable: false
  - statement: >-
      Recombinant human AASDHPPT transfers phosphopantetheine specifically to FDH
      Ser354, restoring 10-formyltetrahydrofolate dehydrogenase activity.
    supporting_text: >-
      In our experiments, incubation of this enzyme with purified recombinant human
      PPT in the presence of CoA and Mg 2+ restored 10-fTHF dehydrogenase activity.
      Using a CoA-derived fluorescent reporter, we have also directly demonstrated
      that recombinant PPT can modify FDH in vitro . Phosphopantetheinylation by PPT
      occurs specifically at serine 354 of FDH because replacement of this serine with
      alanine prevented this covalent modification.
