- description: >-
    In a second compartmental activity supported for human AASDHPPT by orthology,
    the mitochondrial-matrix enzyme phosphopantetheinylates NDUFAB1 to generate
    holo mitochondrial ACP, enabling mitochondrial fatty acid synthesis and its
    downstream support of oxidative metabolism. The matrix localization and cellular
    mtFAS requirement were demonstrated with mouse Aasdhppt in C2C12 myoblasts, not
    by IDA on the human protein; purified human enzyme can nevertheless modify the
    mitochondrial ACP in vitro.
  supported_by:
