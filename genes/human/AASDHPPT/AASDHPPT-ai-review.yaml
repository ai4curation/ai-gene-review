- term:
    id: GO:0015939
    label: pantothenate metabolic process
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-199220
  qualifier: involved_in
  review:
    summary: >-
      Placement of AASDHPPT in Reactome's vitamin B5 pathway reflects use of
      CoA-derived phosphopantetheine, but pantothenate metabolism is not the
      reaction catalyzed by this enzyme.
    action: MODIFY
    reason: >-
      Pantothenate is an upstream precursor of CoA. AASDHPPT neither transforms
      pantothenate nor controls its synthesis; it transfers the
      phosphopantetheine moiety of CoA to a serine in protein substrates. The
      mechanistically accurate biological-process term is GO:0018070
      peptidyl-serine phosphopantetheinylation.
    proposed_replacement_terms:
    - id: GO:0018070
      label: peptidyl-serine phosphopantetheinylation
    additional_reference_ids:
    - PMID:19933275
    supported_by:
    - reference_id: Reactome:R-HSA-199220
      supporting_text: >-
        Vitamin B5 ((R)-pantothenate, PanK), is an essential precursor for the
        synthesis of the metabolic cofactor Coenzyme A (CoA-SH) (Robishaw and
        Neely 1985) and is the prosthetic group of acyl carrier protein (ACP)
        (Joshi et al. 2003).
    - reference_id: PMID:19933275
      supporting_text: >-
        Phosphopantetheinylation by PPT occurs specifically at serine 354 of FDH
        because replacement of this serine with alanine prevented this covalent
        modification.
