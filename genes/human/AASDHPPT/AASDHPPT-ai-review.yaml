    supporting_text: >-
      The enzyme is capable of transferring the 4'-phosphopantetheine moiety of
      coenzyme A to a conserved serine residue in both the acyl carrier protein domain
      of the human cytosolic multifunctional fatty acid synthase and the acyl carrier
      protein associated independently with human mitochondria.
  - reference_id: PMID:41061852
    supporting_text: >-
      From these data, we conclude that PPT is required for 4’PP modification of
      NDUFAB1 and downstream mtFAS activity [15].
