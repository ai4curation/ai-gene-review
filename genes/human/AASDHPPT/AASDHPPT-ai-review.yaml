- term:
    id: GO:0009258
    label: 10-formyltetrahydrofolate catabolic process
  evidence_type: IMP
  original_reference_id: PMID:19933275
  qualifier: acts_upstream_of_positive_effect
  review:
    summary: >-
      AASDHPPT phosphopantetheinylation activates ALDH1L1/FDH and thereby acts
      upstream of its 10-formyltetrahydrofolate catabolic reaction.
    action: KEEP_AS_NON_CORE
    reason: >-
      The directional qualifier is important: AASDHPPT does not itself catabolize
      10-formyltetrahydrofolate, but its modification of FDH restores that
      enzyme's dehydrogenase activity. This is a valid substrate-specific
      downstream consequence of the core transferase function, not the core
      reaction of AASDHPPT itself.
    supported_by:
    - reference_id: PMID:19933275
      supporting_text: >-
        In our experiments, incubation of this enzyme with purified recombinant
        human PPT in the presence of CoA and Mg 2+ restored 10-fTHF dehydrogenase
        activity.
