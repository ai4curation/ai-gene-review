id: Q9NRN7
gene_symbol: AASDHPPT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AASDHPPT is a monomeric, magnesium-dependent 4'-phosphopantetheinyl transferase
  that uses coenzyme A to install 4'-phosphopantetheine on conserved serines in a
  broad set of carrier-protein and dehydrogenase acceptors. Its directly established
  human cytosolic pool matures the ACP domain of FASN and ALDH1L1, while purified
  human enzyme also modifies mitochondrial acceptors including NDUFAB1 and ALDH1L2.
  Experiments on the mouse ortholog in C2C12 myoblasts support an additional
  mitochondrial-matrix pool that phosphopantetheinylates NDUFAB1 and enables
  mitochondrial fatty acid synthesis and oxidative metabolism; this compartmental
  role has not yet been demonstrated directly in human cells. The catalogued
  truncated isoform 2 lacks much of the catalytic region, and its protein abundance,
  activity, and localization remain unknown.
