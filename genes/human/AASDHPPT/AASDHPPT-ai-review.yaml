knowledge_gaps:
- gap_statement: >-
    Endogenous human AASDHPPT has not been directly localized to the mitochondrial
    matrix, and the size, regulation, and physiological importance of a human matrix
    pool remain unknown.
  boundary: >-
    Human fractionation and reviewed UniProt evidence establish a predominantly
    cytosolic pool, and purified human enzyme modifies mitochondrial ACP in vitro.
    Mouse C2C12 loss-of-function, localization, targeting-sequence, and rescue assays
    directly establish a matrix pool required for NDUFAB1 modification and mtFAS. The
    same mouse rescue system found reduced mtFAS rescue for five substitutions
    corresponding to human ClinVar variants, strengthening the human-allele relevance
    without directly demonstrating an endogenous human matrix pool. The corresponding
    human location and process assignments therefore remain supported by orthology
    rather than IDA.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Direct human evidence is needed to define the compartmental route by which
    AASDHPPT matures NDUFAB1 and to calibrate the strength of human matrix and mtFAS
    annotations.
  resolution: >-
    Endogenously tag AASDHPPT in human cells and combine quantitative fractionation,
    protease protection, matrix-directed proximity labeling, and selective disruption
    of its N-terminal targeting region. Measure NDUFAB1 4'-phosphopantetheinylation,
    mtFAS products, protein lipoylation, and respiration with matched rescue controls.
  provenance:
  - reference_id: PMID:18022563
    supporting_text: >-
      Subcellular fractionation studies indicate that the human PPT is located in the
      cytosolic compartment, implying that the mitochondrial ACP and aminoadipate
      semialdehyde dehydrogenase undergo posttranslational modification prior to their
      import into mitochondria.
  - reference_id: PMID:41061852
    supporting_text: >-
      To test whether PPT is required for mitochondrial oxidative metabolism, we used
      CRISPR/Cas-9 to mutate Aasdhppt in C2C12 mouse skeletal myoblasts.
  - reference_id: PMID:41061852
    supporting_text: >-
      We further identify five variants of uncertain significance in AASDHPPT that are
      likely pathogenic in humans due to loss of mtFAS activity.
- gap_statement: >-
    It is unknown whether human AASDHPPT isoform 2 produces a stable protein with any
    phosphopantetheinyl-transferase activity or whether it has a distinct cellular
    location.
  boundary: >-
    UniProt catalogs two splice isoforms; isoform 2 changes residue 138 and lacks
    residues 139-309, including Glu181 and Lys185, which are required for efficient
    catalysis in the canonical protein. No compartment or core activity is therefore
    assigned by isoform.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Establishing whether isoform 2 is translated and functional would prevent a
    truncated, untested sequence from being conflated with the canonical enzyme in
    compartment-specific or catalytic interpretations.
  resolution: >-
    Quantify isoform-specific transcript and protein abundance, then compare
    endogenous-level Q9NRN7-1 and Q9NRN7-2 for stability, cytosolic and mitochondrial
    localization, CoA/Mg2+ binding, and phosphopantetheinylation of FASN ACP and
    NDUFAB1. Use purified proteins to distinguish intrinsic activity from import or
    stability effects.
  provenance:
  - reference_id: file:human/AASDHPPT/AASDHPPT-uniprot.txt
    supporting_text: |-
      FT   VAR_SEQ         139..309
      FT                   /note="Missing (in isoform 2)"
  - reference_id: PMID:18022563
    supporting_text: >-
      Besides the structural data observed in the complexes, the role of Glu181 and
      Lys185 as key acid/base catalysts is strongly supported by the observed
      significant loss of activity for the Glu181Gln, Glu181Ala, and Lys185Ala mutant
      proteins.
- gap_statement: >-
    The endogenous AASDHPPT dependence and site occupancy of proposed substrates such
    as AASDH and DHRS2 have not been established directly in human cells.
  boundary: >-
    Human AASDHPPT activity is established directly for FASN ACP, NDUFAB1, ALDH1L1,
    and ALDH1L2. AASDH is supported by heterologous yeast complementation, whereas
    human-cell chemical proteomics describes the DHRS2 modification as potential.
  gap_kind:
  - BIOLOGY
  - CURATION
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving this substrate boundary would separate physiological human targets from
    conserved-pathway or discovery-screen candidates and sharpen the scope of the
    enzyme's broad specificity.
  resolution: >-
    Acutely degrade endogenous AASDHPPT in human cells and quantify site-resolved
    phosphopantetheinylation of AASDH and DHRS2 alongside established substrates.
    Rescue with wild-type and catalytic-dead AASDHPPT and confirm candidate sites by
    targeted mass spectrometry and purified-protein reconstitution.
  provenance:
  - reference_id: PMID:32537878
    supporting_text: >-
      using targeted chemical proteomics, a potential 4'-phosphopantetheinylation site
      in the protein of mitochondrial dehydrogenase/reductase SDR family member 2
      (DHRS2).
proposed_new_terms: []
suggested_questions:
- question: >-
    Is endogenous human AASDHPPT imported into the mitochondrial matrix, and how does
    its cytosol-to-matrix partitioning vary across tissues and metabolic states?
  experts: []
- question: >-
    Is Q9NRN7-2 translated into a stable protein, and does it retain any catalytic
    activity or acquire a localization distinct from canonical Q9NRN7-1?
  experts: []
- question: >-
    Which proposed human acceptors, especially AASDH and DHRS2, are directly and
    physiologically phosphopantetheinylated by AASDHPPT?
  experts: []
suggested_experiments:
- hypothesis: >-
    A small endogenous human AASDHPPT pool enters the mitochondrial matrix through
    its N-terminal targeting region and is required there for NDUFAB1 maturation and
    mtFAS.
  description: >-
    Endogenously tag AASDHPPT in human cells and combine matrix-resolved fractionation,
    protease protection, and proximity labeling with precise N-terminal targeting-
    sequence mutations. Quantify apo, holo, and acylated NDUFAB1, mtFAS products,
    lipoylation, respiratory-complex assembly, and oxygen consumption, with wild-type
    and matrix-targeted rescue controls.
  experiment_type: compartment-resolved human-cell genetics and mitochondrial biochemistry
- hypothesis: >-
    Truncated AASDHPPT isoform 2 is unstable or catalytically inactive because it lacks
    the C-terminal portion containing key active-site residues.
  description: >-
    Measure isoform-specific RNA and protein at endogenous levels, then compare
    Q9NRN7-1 and Q9NRN7-2 stability, localization, CoA/Mg2+ binding, and activity on
    FASN ACP and NDUFAB1 in matched cell-rescue and purified-protein assays. Do not
    infer an isoform-specific compartment from transcript detection alone.
  experiment_type: isoform-resolved expression and enzyme analysis
- hypothesis: >-
    AASDH and DHRS2 are endogenous human AASDHPPT substrates with measurable,
    enzyme-dependent phosphopantetheine site occupancy.
  description: >-
    Use an acute endogenous AASDHPPT degron followed by quantitative chemical
    proteomics and targeted mass spectrometry for candidate acceptor serines. Rescue
    with wild-type or catalytic-dead AASDHPPT and reconstitute positive targets with
    purified proteins to distinguish direct substrates from downstream changes.
  experiment_type: acute perturbation and site-resolved chemical proteomics
