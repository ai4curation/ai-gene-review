id: P20823
gene_symbol: HNF1A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: HNF1A (hepatocyte nuclear factor 1-alpha) is a homeodomain transcription activator,
  with an atypical POU-specific domain and an N-terminal dimerization domain, expressed in
  liver, kidney, intestine and pancreatic islets. It binds the inverted palindrome GTTAATNATTAAC
  as a homodimer or heterodimer with HNF1B and, together with the coactivator DCoH/PCBD1 (forming
  a heterotetramer), CBP/p300 and partner factors such as HNF4A, activates RNA polymerase
  II transcription of tissue-specific target genes, including hepatic plasma-protein and drug-metabolism
  genes, the renal glucose cotransporter SGLT2, and genes of beta-cell glucose metabolism
  and insulin secretion. Heterozygous loss-of-function variants cause maturity-onset diabetes
  of the young type 3 (MODY3), a primary insulin-secretion defect with low renal glucose threshold,
  and have been reported in some neonates with hyperinsulinaemic hypoglycaemia; somatic biallelic
  inactivation causes familial and sporadic hepatocellular adenomas.
