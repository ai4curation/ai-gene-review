suggested_questions:
- question: Is neonatal hyperinsulinism a genuine feature of HNF1A haploinsufficiency, given
    that the cohort that established the HNF4A association found no excess neonatal hypoglycaemia
    in HNF1A carriers?
suggested_experiments:
- description: Compare fetal-stage glucose-stimulated insulin secretion and HNF1A target expression
    in human stem-cell-derived beta cells heterozygous for HNF1A versus HNF4A loss-of-function,
    to test whether HNF1A haploinsufficiency can cause transient hypersecretion.
