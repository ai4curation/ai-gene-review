id: P23975
gene_symbol: SLC6A2
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC6A2 (NET, norepinephrine/noradrenaline transporter) is a plasma-membrane,
  Na+- and Cl--dependent (secondary-active) symporter of the SLC6/neurotransmitter:sodium
  symporter (SNF) family. It is expressed in noradrenergic neurons and sympathetic
  nerve terminals, as well as in adrenal medulla and placenta. Its principal activity
  is the presynaptic reuptake of norepinephrine from the synaptic cleft into presynaptic
  terminals, coupling the downhill movement of Na+ and Cl- to the uphill accumulation
  of the amine, thereby terminating and recycling the noradrenergic signal and maintaining
  extracellular norepinephrine homeostasis. The same transport cycle also carries dopamine
  with comparable or higher affinity, so NET is a significant dopamine-clearance route
  in regions with low dopamine-transporter expression such as the prefrontal cortex.
  The protein is a 12-transmembrane-helix, N-glycosylated, palmitoylated monomer that
  can form cholesterol-dependent homodimers. It is the molecular target of noradrenaline-reuptake-inhibitor
  antidepressants and of psychomotor stimulants including cocaine and amphetamines,
  and loss-of-function variants cause orthostatic intolerance / postural orthostatic
  tachycardia syndrome.
