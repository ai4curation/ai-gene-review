proposed_new_terms: []
suggested_questions:
- question: In the current Gene Ontology, norepinephrine:sodium symporter activity
    (GO:0005334) and dopamine:sodium symporter activity (GO:0005330) are classified
    under monoamine transmembrane transporter activity and sodium:chloride symporter
    activity, but not under neurotransmitter:sodium symporter activity (GO:0005328)
    despite norepinephrine and dopamine being neurotransmitters. Is this intended,
    or should the amine:sodium symporter terms also be is_a children of neurotransmitter:sodium
    symporter activity?
- question: NET transports dopamine with affinity comparable to or higher than norepinephrine;
    should dopamine clearance by NET (e.g. in prefrontal cortex) be modeled as a distinct
    physiological role in a GO-CAM, separate from its noradrenergic reuptake role?
suggested_experiments:
- description: Quantify the relative contribution of NET versus the dopamine transporter
    to dopamine clearance across brain regions (e.g. prefrontal cortex vs striatum)
    using region-specific NET and DAT inhibition in combination with voltammetry in
    wild-type and Slc6a2-null tissue, to define when NET-mediated dopamine uptake is
    physiologically dominant.
