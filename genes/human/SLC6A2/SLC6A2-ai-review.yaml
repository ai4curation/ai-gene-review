  review:
    summary: Over-broad phylogenetic inference from an SLC6 node that spans amino-acid-transporting
      paralogs; NET is a monoamine transporter and does not transport amino acids.
    action: REMOVE
    reason: NET (SLC6A2) transports the biogenic amines norepinephrine and dopamine,
      not amino acids. The IBD node PTN000907004 is seeded by the amino-acid-transporting
      subfamilies of SLC6 (e.g. B0AT/system-B0, glycine/proline transporters), and
      the amino-acid-transport term over-propagates onto the functionally divergent
      monoamine-transporter subfamily. There is no experimental evidence for amino-acid
      transport by NET; the biogenic amines are not GO amino acids. This is an argued
      over-propagation on biological grounds.
    supported_by:
    - reference_id: UniProtKB:P23975
      supporting_text: Mediates sodium- and chloride-dependent transport of
      record_section:
      - CC:FUNCTION
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000907004
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Node spans amino-acid-transporting SLC6 paralogs; amino-acid transport
          is real for those members but does not transfer to the monoamine-transporter
          subfamily to which NET belongs.
