  review:
    summary: Cryo-EM/functional study resolving dopamine bound in the NET substrate
      site and Na+/Cl--coupled dopamine transport; a genuine secondary activity of NET.
    action: KEEP_AS_NON_CORE
    reason: NET genuinely transports dopamine in a Na+- and Cl--dependent manner, captured
      structurally and kinetically (KM dopamine 0.52 uM in this study). This is a real
      activity, but NET is defined by and physiologically dedicated to norepinephrine
      reuptake; dopamine transport is a well-supported secondary activity (physiologically
