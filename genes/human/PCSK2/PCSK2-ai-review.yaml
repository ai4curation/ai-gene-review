suggested_questions:
- question: Which neuropeptide precursors in human brain and enteroendocrine cells depend on PC2 rather
    than PC1/3, given that most substrate assignments come from PC2-null mice?
- question: Does the elevated beta-cell PC2 seen in type 2 diabetes donors alter proinsulin or proIAPP
    processing, and does it contribute to beta-cell dysfunction?
- question: Does the broadened pH optimum of the R430W variant change granule processing of PC2 substrates
    in human alpha cells or neurons?
suggested_experiments:
- description: Knock out PCSK2 in human stem-cell-derived alpha cells and hypothalamic neurons and profile
    the peptidome by mass spectrometry to define the human PC2 substrate set directly.
- description: Measure proinsulin and proIAPP processing in human islets after beta-cell-specific PC2
    overexpression to test whether the PC2 rise in type 2 diabetes changes processing.
