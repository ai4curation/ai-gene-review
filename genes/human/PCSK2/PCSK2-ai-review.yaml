id: P16519
gene_symbol: PCSK2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  PCSK2 encodes prohormone convertase 2 (PC2, neuroendocrine convertase 2), a calcium-dependent,
  subtilisin/kexin-like serine endoprotease of the regulated secretory pathway of neurons and endocrine
  cells. It is synthesised as a preproenzyme (signal peptide, propeptide, S8 catalytic domain with the
  Asp-His-Ser charge-relay triad, and a P domain), travels through the secretory pathway as an inactive
  proenzyme in complex with the neuroendocrine chaperone 7B2 (SCG5), and becomes active after
  autocatalytic removal of its propeptide in the acidic, calcium-rich environment of dense-core
  secretory granules. Mature PC2 has an acidic pH optimum (about pH 5-5.5) and cleaves prohormone and
  proneuropeptide precursors C-terminal to pairs of basic residues (typically Lys-Arg). Experiments
  with recombinant human PC2 show cleavage of proinsulin intermediates at the C-peptide/A-chain
  junction, processing of pro-corticotrophin releasing hormone, and liberation of glucagon from
  proglucagon; in human islets PC2 is the convertase of glucagon-producing alpha cells, whereas healthy
  human beta cells process proinsulin with PC1/3 and contain little PC2. Work in rodent models extends
  its substrate range to proenkephalin, pro-islet amyloid polypeptide and many hypothalamic
  neuropeptide precursors. Some proPC2 and mature PC2 is released from cells with granule contents.
  Common noncoding PCSK2 variants are associated with type 2 diabetes risk and glucagon levels.
