- term:
    id: GO:0120116
    label: glucagon processing
  evidence_type: IDA
  original_reference_id: PMID:28719828
  qualifier: involved_in
  review:
    summary: Proposed new annotation. Human PC2 co-expressed with human proglucagon in GH4C1 cells
      liberates glucagon, and in human islets inhibitors that block PC2 block production of mature
      glucagon while PC1/3 suppression does not.
    action: NEW
    reason: PC2 is the enzyme that performs the cleavages releasing glucagon from proglucagon (it can do so
      alone with carboxypeptidase E), so it passes the participation test as the catalyst, not a substrate.
      The comparator check runs the other way from the substrate case; the processing enzymes PCSK1 and
      PCSK2 already carry the parallel term GO:0030070 insulin processing. GO:0120116 is a descendant of
      GO:0016486 peptide hormone processing and is not yet annotated to any convertase, which looks like
      term recency rather than a deliberate omission. Glucagon processing in alpha cells is the best
      documented physiological role of human PC2.
    supported_by:
    - reference_id: PMID:28719828
      supporting_text: we also evaluated the cleavage of co-transfected proglucagon to glucagon; the liberation
        of this peptide is known to be dependent on PC2 expression
    - reference_id: PMID:32291281
      supporting_text: Conversely, suppression of PC1/3 blocked processing of proinsulin but not proglucagon.
    - reference_id: PMID:9287128
      supporting_text: It is concluded that PC2 is able to act alone in the pancreatic pathway of proglucagon
        processing.
