suggested_questions:
- question: Should granulysin carry GO:0140911 pore-forming activity after all? The alpha-defensins, its
    functional class, carry it, and GO may in practice use the term more broadly than its definition's
    requirement of a defined transmembrane pore. If so, this review's proposed new term is unnecessary
    and the right action is to annotate GO:0140911 and widen that term's definition instead.
  experts:
  - Alan M Krensky
  - Carol Clayberger
  - Pascale Gaudet
- question: Does granulysin require perforin as a cofactor to enter a host cell, or can it enter unaided
    through lipid-raft internalisation? Reactome records both the raft route and the possible perforin
    requirement, and the answer decides whether granulysin's intracellular killing should be modelled
    as perforin-dependent.
  experts:
  - Steffen Stenger
  - Michael Walch
  - Judy Lieberman
- question: Perforin, granzyme A and granzyme B carry no bacterial-defense term while granulysin carries
    three. Is that the correct division of labour - granulysin attacks the microbe, the others attack
    the host cell - or should the granzymes be annotated for their own documented antibacterial activities,
    which this project has proposed for GZMA and GZMB?
  experts:
  - Judy Lieberman
  - Farokh Dotiwala
- question: Granulysin has no mouse orthologue, so the usual knockout evidence does not exist and the
    record rests heavily on one 1998 paper plus Reactome. Would a humanised or transgenic model change
    what can be annotated, particularly for the in vivo contribution to tuberculosis control?
  experts:
  - Steffen Stenger
  - Robert L Modlin
suggested_experiments:
- hypothesis: Granulysin lyses microbes by charge-dependent membrane disruption rather than by forming
    a defined transmembrane pore, so it does not belong on a pore-forming activity term.
  description: Reconstitute purified 9 kDa granulysin into planar lipid bilayers of bacterial-mimetic
    and eukaryotic lipid composition and record single-channel conductance, comparing directly with perforin
    and with an alpha-defensin under identical conditions. Pair this with cryo-EM of granulysin on liposomes.
    Discrete, quantised conductance steps and a visible oligomeric assembly would support the existing
    pore term; graded leakage without defined steps would support the proposed new term.
  experiment_type: Comparative planar-bilayer electrophysiology and cryo-EM
- hypothesis: Granulysin requires perforin to reach intracellular bacteria, rather than entering host
    cells unaided.
  description: Deliver purified granulysin to macrophages infected with Mycobacterium tuberculosis or
    Listeria in the presence and absence of perforin at sublytic concentrations, and separately with lipid-raft
    internalisation blocked, tracking granulysin to the phagosome by imaging and scoring bacterial viability.
    Distinguishing the two entry routes would settle whether granulysin's intracellular killing is perforin-dependent
    and whether the two proteins should be modelled as a single delivery module.
  experiment_type: Infected-macrophage delivery with entry-route blockade
- hypothesis: Granulysin's lipid-composition selectivity is what allows a cytotoxic lymphocyte to kill
    an intracellular pathogen without lysing the target cell.
  description: Titrate granulysin against matched liposome panels differing only in the lipids that distinguish
    microbial from eukaryotic membranes, including cardiolipin and phosphatidylserine content, and measure
    leakage thresholds. Then test whether engineering a target cell's membrane composition toward the
    microbial profile makes it granulysin-sensitive. A composition-dependent threshold would ground the
    selectivity clause of the proposed term in measurement.
  experiment_type: Defined-liposome titration with membrane-composition engineering
