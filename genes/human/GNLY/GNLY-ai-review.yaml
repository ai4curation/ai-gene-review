proposed_new_terms:
- proposed_name: microbial membrane disrupting activity
  proposed_definition: Binding to the anionic surface of a microbial cell and disrupting the integrity
    of its membrane without forming a defined transmembrane pore, typically by charge-dependent association
    followed by adoption of an amphipathic conformation, resulting in loss of membrane integrity and lysis
    of the microbial cell. Distinguished from pore-forming activity by the absence of a discrete transmembrane
    channel, and selective for membranes of microbial rather than eukaryotic lipid composition.
  justification: 'Granulysin has no molecular function annotation at all: its only two molecular-function
    rows are bare protein binding from a two-hybrid interactome map, both removed here under the protein-binding
    policy. The gap is real rather than an oversight, because no existing term fits. GO:0140911 pore-forming
    activity is the obvious candidate and is carried by the alpha-defensins, which are granulysin''s functional
    class, but its definition requires that the protein form transmembrane pores, and the mechanism recorded
    for granulysin is charge-dependent amphipathic membrane disruption causing lysis by osmotic shock,
    explicitly not a defined pore. Searching the ontology found no membrane-disruption or antimicrobial-peptide
    molecular function term of any kind. Proposed as a sibling of GO:0140911 directly under molecular_function,
    which is where GO:0140911 itself sits. The term would also serve the wider saposin-like NK-lysin family
    and would let curators stop choosing between a mechanistically wrong pore term and no annotation at
    all.'
  proposed_parent:
    id: GO:0003674
    label: molecular_function
  supported_by:
  - &id009
    reference_id: Reactome:R-HSA-6806732
    supporting_text: It is believed that the electrostatic interaction between the cationic GNLY and the
      negatively charged microbial cell surface increases the ability of GNLY to fold into amphipathic
      conformation which can disrupt microbial membranes resulting in cytolysis by osmotic shock (Wang
      Z et al.
  - *id005
core_functions:
- proposed_molecular_function: microbial membrane disrupting activity
  description: 'Charge-dependent disruption of microbial membranes. Granulysin is strongly cationic; electrostatic
    attraction to the anionic microbial surface promotes folding into an amphipathic conformation that
    breaches the membrane and lyses the cell by osmotic shock, rather than assembling a defined transmembrane
    pore as perforin and the gasdermins do. The activity is selective by lipid composition and spares
    eukaryotic membranes, which is what allows a lymphocyte to deliver it into its own target cell and
    kill the pathogen inside without lysing the target. No GO molecular function term describes this,
    so it is recorded here as a proposed term rather than forced onto pore-forming activity, whose definition
    requires a transmembrane pore. The antimicrobial-humoral-peptide term this gene also carries is deliberately
    left out of this core function''s process list: it is kept as non-core in the annotation review, because
    its peptide and humoral framings understate a protein whose best-evidenced activity is delivered into
    a host cell and acts in the phagosome.'
