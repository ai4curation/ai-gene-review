id: P22749
gene_symbol: GNLY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Saposin-like antimicrobial protein of cytotoxic lymphocyte granules, and the effector through
  which those cells kill the pathogens inside an infected cell rather than the cell itself. Granulysin
  is made by activated CD8 T cells, NK cells and NKT cells as a 15 kDa precursor that is proteolytically
  trimmed at both termini to a 9 kDa form; the 9 kDa form is stored in the perforin- and granzyme-containing
  cytolytic granules and released by directed exocytosis on target recognition, while the 15 kDa form
  is constitutively secreted from separate granules that contain neither. It carries a saposin-B domain
  and is strongly cationic, and its mechanism follows from that: electrostatic attraction to the anionic
  surface of a microbe promotes folding into an amphipathic conformation that disrupts the microbial membrane,
  lysing the cell by osmotic shock rather than by forming a defined transmembrane pore. The selectivity
  is lipid-composition-dependent, so granulysin does not permeabilise membranes of eukaryotic composition,
  which is what lets a lymphocyte deploy it inside its own target without destroying it. It reduces the
  viability of a broad range of bacteria, fungi and parasites, including Listeria, Trypanosoma cruzi and
  Mycobacterium tuberculosis, and it kills extracellular M. tuberculosis directly. Against intracellular
  pathogens it works with perforin, which it may require as a cofactor to enter the host cell; once inside,
  granulysin bound to lipid rafts is internalised to early endosomes that fuse with bacteria-containing
  phagosomes, where lysis of the bacteria occurs. It has no orthologue in mouse, which has limited its
  genetic analysis.'
