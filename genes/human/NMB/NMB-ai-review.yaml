suggested_questions:
- question: >-
    Should PAINT node PTN000370826 (Euteleostomi root of PTHR16866) restrict GO:0160023 (sneeze
    reflex) to the mammalian NMB subfamily clade (PTN002704034) rather than propagating it across
    all jawed-vertebrate GRP and NMB paralogs?
- question: >-
    Should PAINT add GO:0031989 (bombesin receptor signaling pathway) to PTN008565241 alongside
    GO:0007218 (neuropeptide signaling pathway)?
suggested_experiments:
- description: >-
    Compare the receptor-binding kinetics and Gq/11 versus beta-arrestin signaling bias of
    N-terminally extended neuromedin B-32 (NMB-32) and the decapeptide neuromedin B-10 (NMB-10) at
    human NMBR and GRPR using BRET biosensor assays.
  hypothesis: >-
    Both NMB-32 and NMB-10 potently activate Gq/11 via NMBR, but NMB-32 exhibits slower
    dissociation kinetics and distinct receptor internalization dynamics due to contacts with the
    NMBR extracellular vestibule.
