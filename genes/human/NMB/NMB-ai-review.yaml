id: P08949
gene_symbol: NMB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Neuromedin-B (NMB) is a secreted bombesin-like neuropeptide and hormone synthesized as a
  preprohormone and processed by proteolytic cleavage and C-terminal alpha-amidation into the
  32-amino-acid peptide neuromedin B-32 and the amidated decapeptide neuromedin B (NMB-10), the
  mammalian homolog of amphibian ranatensin. Released into the extracellular space by peptidergic
  neurons and endocrine cells, NMB binds with high affinity to the Gq/11-coupled neuromedin-B
  receptor (NMBR) to initiate the bombesin receptor signaling pathway, stimulating phospholipase C
  activation, intracellular calcium mobilization, smooth muscle contraction, exocrine and endocrine
  secretion, and sensory reflex circuits including the sneeze and itch pathways.
