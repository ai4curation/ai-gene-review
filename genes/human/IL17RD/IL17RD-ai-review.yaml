- term:
    id: GO:0040037
    label: negative regulation of fibroblast growth factor receptor signaling pathway
  evidence_type: IDA
  original_reference_id: PMID:12807873
  review:
    summary: Human IL17RD (hSef) inhibits FGF-induced signalling in human cells; FGF-induced feedback antagonist
      conserved from zebrafish to human.
    action: NEW
    reason: 'This is the defining function of SEF/IL17RD and is absent from human GOA. IL17RD itself performs the
      inhibitory step: it associates with FGFR1/FGFR2 and reduces FGFR1/FRS2 tyrosine phosphorylation and downstream
      Ras-ERK signalling (mouse), and human hSef inhibits FGF2/FGF8-induced reporter and differentiation responses,
      with Kallmann-syndrome variants losing this inhibition. Comparator check: the analogous FGF feedback inhibitors
      SPRY4, SPRY2 and DUSP6 carry this term, so its absence here is a gap rather than a convention.'
    supported_by:
    - reference_id: PMID:12807873
      supporting_text: Overexpression of this receptor inhibits FGF induction of an FGF-responsive reporter gene
        in human 293T cells
    - reference_id: PMID:12958313
      supporting_text: possibly functioning upstream of the Ras molecule
    - reference_id: PMID:23643382
      supporting_text: cells coexpressing WT IL17RD exhibited markedly lower activity (70% inhibition)
    - reference_id: PMID:12604616
      supporting_text: Sef exerts its inhibitory effects at the level of FGFR and upstream of Ras providing an additional
        level of negative regulation of FGF signaling
    - reference_id: PMID:11802165
      supporting_text: Sef functions as a feedback-induced antagonist of Ras/Raf/MEK/MAPK-mediated FGF signalling
