  review:
    summary: Ensembl Compara transfer of mouse Il17rd IDA (PMID:25576668) for negative regulation of TGFbeta receptor
      signalling.
    action: UNDECIDED
    reason: Derived from the mouse IDA annotation to PMID:25576668, which is abstract-only in our cache. The abstract
      reports that overexpressed Sef blocks TGFbeta-induced EMT (cell elongation, alpha-SMA), which is captured
      by the EMT term; it does not state that TGFbeta receptor signalling itself (e.g. SMAD activation) was measured
      or reduced. Sef is otherwise characterised as an RTK/ERK pathway antagonist, so an effect on EMT need not
      mean inhibition of the TGFbeta receptor pathway. Without the full text we cannot verify the curator's basis
      for the pathway-level term.
