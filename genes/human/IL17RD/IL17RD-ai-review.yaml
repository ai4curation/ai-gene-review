- term:
    id: GO:0030547
    label: signaling receptor inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:12604616
  review:
    summary: Sef associates with FGFR1/FGFR2 and reduces FGF-induced FGFR1 and FRS2 tyrosine phosphorylation, acting
      at the level of the receptor upstream of Ras.
    action: NEW
    reason: 'Best available MF for the receptor-level mechanism: IL17RD associates with FGFR1 and FGFR2 (ligand-independent
      co-IP, human and mouse) and reduces FGFR1 activation (receptor and FRS2 phosphorylation; inhibits constitutively
      active FGFR1 but not active Ras). The primary mechanistic data are from mouse Sef (abstract-only), with human
      hSef shown to bind FGFR1/FGFR2 and act upstream of Ras. Whether the association is a direct protein-protein
      contact has not been shown biophysically, so the more specific protein tyrosine kinase inhibitor activity
      is not asserted.'
    supported_by:
    - reference_id: PMID:12604616
      supporting_text: Sef exerts its inhibitory effects at the level of FGFR and upstream of Ras providing an additional
        level of negative regulation of FGF signaling
    - reference_id: PMID:12958313
      supporting_text: hSef interacts with FGFR1 and FGFR2 but not FGFR3
    - reference_id: PMID:33436016
      supporting_text: The interaction of SEF with FGFR is independent of factors such as ligand stimulation, FGFR
