- term:
    id: GO:0030368
    label: interleukin-17 receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:107399
  - PANTHER:PTN001436609
  - UniProtKB:Q8NAC3
  - UniProtKB:Q96F46
  review:
    summary: IBA from the IL-17 receptor family node PTN001436609 (donors Il17ra, IL17RA, IL17RC).
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0030368 means combining with an IL-17-family cytokine and transducing the signal. IL17RD is still
      described as an orphan receptor; its IL-17-family membership is based on homology of the intracellular SEFIR
      domain, and no direct binding of any IL-17 cytokine to IL17RD has been demonstrated. Experimental work shows
      that IL17RD associates with IL17RA and modulates (both positively and negatively) IL-17A signalling outputs,
      i.e. it is an accessory/regulatory component of the receptor complex rather than an IL-17 receptor in its
      own right. The PAINT node (PTN001436609) covers the whole IL-17R family and is seeded by IL17RA/IL17RC, which
      do bind ligand; IL17RD is inside the clade but has evidence of functional divergence (FGFR feedback inhibitor,
      orphan with respect to ligand). The term therefore over-states what is known for IL17RD.
    supported_by:
    - reference_id: PMID:33436016
      supporting_text: it was designated as a member of the IL17 receptor family (IL17RD) based on sequence homology
        with other IL17 receptors
    - reference_id: PMID:19079364
      supporting_text: the orphan receptor IL-17RD (Sef, similar expression to FGF genes or IL-17RLM) is associated
        and colocalized with IL-17R
    - reference_id: PMID:23047677
      supporting_text: Interleukin-17 receptor D disrupts the interaction of Act1 and TRAF6 causing differential
        regulation of nuclear factor-kappa B and p38 mitogen-activated protein kinase signalling pathways
    - reference_id: file:human/IL17RD/IL17RD-deep-research-falcon.md
      supporting_text: They do not by themselves show direct IL-17A binding to purified IL17RD.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001436609
        comment: IL-17 receptor family ancestral node; the ligand-binding receptor activity is grounded by IL17RA/IL17RC,
          but IL17RD (an orphan with respect to IL-17 ligands, acting as an accessory/regulatory subunit) shows
          divergence from that activity.
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
      - source_id: UniProtKB:Q96F46
