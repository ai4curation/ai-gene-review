id: Q8NFM7
gene_symbol: IL17RD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: IL17RD (SEF, "similar expression to FGF genes"; hSef) is a single-pass type I transmembrane glycoprotein
  with an extracellular Ig-like/fibronectin III region and a cytoplasmic SEFIR domain related to IL-17 receptors.
  Its expression is induced by FGF signalling and it acts as a negative-feedback inhibitor of FGF receptor signalling
  to the Ras-RAF-MEK-ERK cascade. The membrane isoform resides at the plasma membrane and Golgi apparatus, associates
  (by co-immunoprecipitation) with FGFR1 and FGFR2 independently of ligand, and reduces FGFR1/FRS2 tyrosine phosphorylation
  and downstream ERK activation; in addition it binds activated MEK, retains the MEK-ERK complex at cytoplasmic/Golgi
  sites and blocks nuclear translocation of active ERK, selectively suppressing nuclear ERK targets. A cytosolic
  splice isoform (hSef-b) lacks the signal peptide. Despite its name, IL17RD has no demonstrated IL-17 ligand-binding
  activity, but it associates with IL17RA and modulates IL-17A signalling outputs (via Act1-TRAF6), and its SEFIR
  domain engages TIR adaptors to restrain Toll-like receptor signalling. Loss-of-function variants cause hypogonadotropic
  hypogonadism with anosmia (Kallmann syndrome, HH18), often with hearing loss, consistent with a role in fine-tuning
  FGF8-FGFR1 signalling during GnRH-neuron and olfactory development.
