core_functions:
- description: 'FGF-induced negative-feedback inhibitor acting at the receptor level: membrane IL17RD (hSef-a) associates
    with FGFR1 and FGFR2 (co-IP; ligand-independent; directness not established) and reduces FGF-induced FGFR1/FRS2
    tyrosine phosphorylation and downstream Ras-RAF-MEK-ERK activation.'
  molecular_function:
    id: GO:0030547
    label: signaling receptor inhibitor activity
  directly_involved_in:
  - id: GO:0040037
    label: negative regulation of fibroblast growth factor receptor signaling pathway
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:12958313
    supporting_text: hSef interacts with FGFR1 and FGFR2 but not FGFR3
  - reference_id: PMID:12807873
    supporting_text: this receptor is capable of forming homomeric complexes and can interact with fibroblast growth
      factor (FGF) receptor 1
  - reference_id: PMID:12604616
    supporting_text: Overexpression of mSef in NIH3T3 cells results in a decrease in FGF-induced cell proliferation
      associated with a decrease in Tyr phosphorylation of FGFR1 and FRS2
  - reference_id: PMID:12604616
    supporting_text: Sef exerts its inhibitory effects at the level of FGFR and upstream of Ras providing an additional
      level of negative regulation of FGF signaling
  - reference_id: PMID:23643382
    supporting_text: cells coexpressing WT IL17RD exhibited markedly lower activity (70% inhibition)
  - reference_id: PMID:33436016
    supporting_text: The interaction of SEF with FGFR is independent of factors such as ligand stimulation, FGFR
      dimerization and kinase activity
- description: 'Spatial regulator of ERK signalling: binds activated MEK, retains the MEK-ERK complex at cytoplasmic/Golgi
    sites and blocks nuclear translocation of activated ERK, suppressing nuclear (Elk-1) but not cytoplasmic (RSK2)
    ERK outputs.'
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  directly_involved_in:
  - id: GO:0040037
    label: negative regulation of fibroblast growth factor receptor signaling pathway
  locations:
  - id: GO:0000139
    label: Golgi membrane
  supported_by:
  - reference_id: PMID:15239952
    supporting_text: hSef binds to activated forms of MEK, inhibits the dissociation of the MEK-ERK complex, and
      blocks nuclear translocation of activated ERK
  - reference_id: PMID:15239952
    supporting_text: Downregulation of endogenous hSef by hSef siRNA enhances the stimulus-induced ERK nuclear translocation
      and the activity of Elk-1
  - reference_id: Reactome:R-HSA-5674366
    supporting_text: IL17RD is a spatial regulator of MAPK signaling that binds activated MAP2K dimers at the Golgi
      membrane
  - reference_id: PMID:23643382
    supporting_text: on downstream components of the Ras-ERK1/2 pathway by capturing active MEK and ERK complexes
      at the Golgi apparatus and inhibiting their dissociation
suggested_questions:
- question: Does IL17RD bind FGFR1/FGFR2 directly, and through which domains? Existing evidence is co-immunoprecipitation
    in overexpression systems, with conflicting mapping (intracellular vs extracellular/TM domains).
- question: Which mechanism (receptor-level inhibition of FGFR/FRS2 phosphorylation vs. Golgi retention of MEK-ERK)
    predominates for endogenous IL17RD in physiological FGF8-FGFR1 signalling, e.g. in GnRH-neuron/olfactory development?
- question: Does IL17RD bind any IL-17-family cytokine directly, or is it solely an accessory/regulatory component
    of IL17RA-containing complexes? This determines whether interleukin-17 receptor activity is ever appropriate.
- question: Does IL17RD inhibit TGFbeta receptor signalling itself (e.g. SMAD2/3 activation) or only TGFbeta-induced
    EMT via ERK crosstalk?
suggested_experiments:
- hypothesis: IL17RD binds FGFR1 directly.
  description: Purified recombinant IL17RD extracellular/TM and intracellular regions tested against FGFR1 by SPR/BLI
    or in reconstituted nanodiscs; proximity ligation of endogenous proteins in FGF-responsive cells.
  experiment_type: biophysical binding assay
- hypothesis: Endogenous IL17RD limits FGF-induced FGFR/FRS2 phosphorylation and nuclear ERK signalling in human
    cells.
  description: CRISPR knockout of IL17RD in human iPSC-derived neural progenitors or GnRH-neuron models; FGF8 time-course
    of pFGFR1, pFRS2, pERK and ERK nuclear localization, with rescue by WT vs Kallmann-variant IL17RD.
  experiment_type: genetic knockout with rescue
- hypothesis: IL17RD lacks intrinsic IL-17 ligand-binding activity.
  description: Binding of labelled IL-17A, IL-17F and IL-17A/F to cells expressing IL17RD alone vs with IL17RA/IL17RC,
    and to purified IL17RD ectodomain.
  experiment_type: ligand binding assay
