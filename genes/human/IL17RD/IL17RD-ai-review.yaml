- term:
    id: GO:0140311
    label: protein sequestering activity
  evidence_type: IDA
  original_reference_id: PMID:15239952
  review:
    summary: Human hSef binds activated MEK, prevents dissociation of the MEK-ERK complex and blocks nuclear translocation
      of activated ERK.
    action: NEW
    reason: Human hSef retains activated ERK (in a MEK-ERK complex, at Golgi membranes per Reactome) in the cytoplasm,
      restricting it from nuclear substrates while leaving cytoplasmic substrates unaffected; siRNA knockdown of
      endogenous hSef enhances ERK nuclear translocation. Sequestering activity captures this retention function
      better than a kinase-inhibitor term, since ERK catalytic activity is not inhibited.
    supported_by:
    - reference_id: PMID:15239952
      supporting_text: hSef binds to activated forms of MEK, inhibits the dissociation of the MEK-ERK complex, and
        blocks nuclear translocation of activated ERK
    - reference_id: PMID:15239952
      supporting_text: Downregulation of endogenous hSef by hSef siRNA enhances the stimulus-induced ERK nuclear
        translocation and the activity of Elk-1
