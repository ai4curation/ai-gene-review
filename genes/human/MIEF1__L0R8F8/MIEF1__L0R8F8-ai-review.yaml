gene_symbol: MIEF1
product_type: PROTEIN
status: COMPLETE
aliases:
- AltMIEF1
- AltMiD51
- MIEF1-MP
- MIEF1 microprotein
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  AltMIEF1 (also called AltMiD51 or MIEF1-MP; UniProt L0R8F8) is a 70-amino-acid protein
  translated from an upstream open reading frame located in exon 2 of the bicistronic
  human MIEF1 gene, in the 5' leader of the mRNA that also encodes MIEF1/MiD51. It is
  encoded in a different reading frame and shares no sequence with MiD51 (Q9NQG6), the
  outer-mitochondrial-membrane DRP1 adaptor of mitochondrial fission; the two are
  distinct proteins that happen to share a transcript and a gene symbol. In cultured human
  cells and colon tissue AltMIEF1 is two- to six-fold more abundant than MiD51. AltMIEF1
  is a member of the LYR-motif (complex I LYR / LYRM) family, consisting of three
  alpha-helices with an N-terminal LYR tripeptide, and it resides in the mitochondrial
  matrix. Through its LYR motif it binds the 4'-phosphopantetheine arm of the
  mitochondrial acyl carrier protein NDUFAB1 (mt-ACP), and together with MALSU1 and
  mt-ACP it forms a heterotrimeric module that sits on the intersubunit face of
  late-stage mitoribosomal large-subunit (mt-LSU) assembly intermediates next to uL14m
  and bL19m. This MALSU1-AltMIEF1-mt-ACP module persists through multiple maturation
  steps alongside factors such as NSUN4-MTERF4, GTPBP5, GTPBP7 and GTPBP10, and
  sterically blocks premature joining of the small subunit until maturation is complete.
  Knockout of AltMIEF1 impairs mt-LSU assembly, and depletion with rescue experiments
  indicates that it supports the overall rate of mitochondrial protein synthesis.
  Overexpression in HeLa cells causes DRP1-dependent mitochondrial fragmentation,
  but this phenotype has not been linked to a loss-of-function defect.
