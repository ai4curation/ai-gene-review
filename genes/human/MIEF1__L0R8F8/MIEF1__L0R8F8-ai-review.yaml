- term:
    id: GO:0032981
    label: mitochondrial respiratory chain complex I assembly
  evidence_type: IMP
  original_reference_id: PMID:31666358
  qualifier: involved_in
  review:
    summary: >-
      From the NDUFAB1 interaction-network study of Dibley et al., in which AltMiD51
      knockout cells were analysed. UniProt states that AltMIEF1 is required for complete
      complex I assembly, citing this paper.
    action: UNDECIDED
    reason: >-
      The cached record is abstract-only and full text could not be retrieved. The abstract
      reports only that AltMiD51 knockout impairs mt-LSU assembly, and attributes the
      complex I (N-module) assembly defect to LYRM2. A complex I deficit in AltMiD51
      knockout cells is plausible, but it would be expected as a downstream consequence of
      reduced synthesis of the mtDNA-encoded ND subunits. That would not show direct
      participation in complex I assembly, unlike the dedicated LYRM assembly factors.
      Overexpression did not change complex I activity (PMID:30215512). Without the full
      data, the curator's call cannot be assessed, so the annotation is neither accepted
      as core nor removed.
    supported_by:
    - reference_id: PMID:31666358
      supporting_text: Subsequent knockout and interaction network studies in human cells
        revealed the LYRM member AltMiD51 to be important for optimal assembly of the large
        mitoribosome subunit, consistent with recent structural studies.
    - reference_id: PMID:31666358
      supporting_text: we used proteomics coupled with topographical heat-mapping to reveal
        that knockout of LYRM2 impairs assembly of the NADH-dehydrogenase module of complex
        I, leading to defects in cellular respiration.
- term:
    id: GO:0070131
    label: positive regulation of mitochondrial translation
  evidence_type: IDA
  original_reference_id: PMID:30215512
  qualifier: involved_in
  review:
    summary: >-
      BONCAT/AHA labelling showed that overexpression of MIEF1-MP increased mtDNA-encoded
      protein synthesis by about 54%. Knockdown decreased it by about 32%, and the decrease
      was rescued by siRNA-resistant MIEF1-MP.
    action: KEEP_AS_NON_CORE
    reason: >-
      The data are sound and the rescue experiment controls for co-depletion of MiD51.
      Mechanistically, however, the effect on translation rate reflects the role of
      AltMIEF1 in mt-LSU biogenesis rather than a regulatory activity on translation itself.
      The authors interpret it the same way, as support for an assembly-factor role. The
      annotation is retained as a valid downstream consequence, not as a core function.
    supported_by:
    - reference_id: PMID:30215512
      supporting_text: We expressed a siRNA resistant MIEF1-MP in cells treated with siRNA
        against the MIEF1-MP transcript and found that expression of MIEF1-MP rescued the
        loss of protein translation (Figure 6) supporting a role for MIEF1-MP and not MIEF1
        in the mitochondrial translation.
    - reference_id: PMID:30215512
      supporting_text: We tested the hypothesis that MIEF1-MP might be a functional component
        of the mitoribosome and obtained data from overexpression and knockdown studies that
        indicates that MIEF1-MP can regulate mitochondrial translation, which supports the
        hypothesis that MIEF1-MP is a mitoribosome assembly factor.
