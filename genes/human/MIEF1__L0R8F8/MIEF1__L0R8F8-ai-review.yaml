existing_annotations:
- term:
    id: GO:0000266
    label: mitochondrial fission
  evidence_type: IMP
  original_reference_id: PMID:29083303
  qualifier: involved_in
  review:
    summary: >-
      Based on overexpression of Flag- or GFP-tagged AltMiD51 in HeLa cells, which
      fragmented the mitochondrial network in an LYR-motif- and DRP1-dependent manner.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The full text of PMID:29083303 shows that the only evidence is a gain-of-function
      phenotype: overexpression fragments the network, the LYR->AAA mutant does not, and
      DRP1 knockdown or dominant-negative DRP1 prevents it. No loss-of-function fission
      defect was reported. A matrix-resident LYR protein has no plausible direct access to
      the outer-membrane DRP1 machinery, and the authors themselves suggest the effect may be
      indirect. All later work places AltMIEF1 in the MALSU1-mt-ACP module on assembling
      mt-LSU (PMID:28892042, PMID:34135318, PMID:38042949, PMID:35177605). The fragmentation
      is best read as a secondary consequence of overexpression in the matrix rather than
      participation in the fission process. The annotation is also easily confused with
      the genuine fission role of MiD51, the protein from the downstream ORF of the same
      gene. It should not be propagated as a core function.
    supported_by:
    - reference_id: PMID:29083303
      supporting_text: Remarkably, we found that altMiD51 also localizes at the mitochondria
        (Figure 12c; Figure 12—figure supplement 3) and that its overexpression results in
        mitochondrial fission (Figure 12d).
    - reference_id: PMID:29083303
      supporting_text: It remains possible that altMiD51 promotes mitochondrial fission
        independently of Drp1 and is able to reverse the hyperfusion induced by Drp1
        inactivation.
    - reference_id: PMID:28892042
      supporting_text: We conclude that L0R8F8 and mt-ACP are assembly factors for the human
        mitoribosome.
