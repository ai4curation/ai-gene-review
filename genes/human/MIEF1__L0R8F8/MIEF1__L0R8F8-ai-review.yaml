core_functions:
- description: >-
    LYR-motif subunit of the MALSU1-AltMIEF1-mt-ACP anti-association module, which binds
    late-stage mitoribosomal large-subunit assembly intermediates in the mitochondrial
    matrix next to uL14m. Through its LYR motif, AltMIEF1 docks the 4'-phosphopantetheine
    arm of mt-ACP (NDUFAB1), and the module sterically prevents premature joining of the
    small subunit until mt-LSU maturation is complete. Loss of AltMIEF1 impairs mt-LSU
    assembly and lowers the rate of mitochondrial translation.
  molecular_function:
    id: GO:0140978
    label: mitochondrial large ribosomal subunit binding
  directly_involved_in:
  - id: GO:1902775
    label: mitochondrial large ribosomal subunit assembly
  locations:
  - id: GO:0005759
    label: mitochondrial matrix
  supported_by:
  - reference_id: PMID:28892042
    supporting_text: However, one functional consequence of the MALSU1–L0R8F8–mt-ACP
      module is that it would sterically obstruct the binding of the mt-SSU.
  - reference_id: PMID:38042949
    supporting_text: Both, NSUN4—MTERF4 and MALSU1—L0R8F8—mtACP bind early in the mtLSU
      maturation process and persist over multiple maturation steps.
  - reference_id: PMID:31666358
    supporting_text: Subsequent knockout and interaction network studies in human cells
      revealed the LYRM member AltMiD51 to be important for optimal assembly of the large
      mitoribosome subunit, consistent with recent structural studies.
proposed_new_terms: []
suggested_questions:
- question: >-
    Is the complex I assembly defect reported for AltMiD51 knockout cells (PMID:31666358)
    distinguishable from the secondary effect of reduced mitochondrial translation of ND
    subunits? For example, are nuclear-encoded complex I modules affected differently
    from mtDNA-encoded ones, and is the defect rescued by restoring translation?
- question: >-
    Does the mitochondrial fragmentation caused by AltMIEF1 overexpression (PMID:29083303)
    have any loss-of-function counterpart, or is it a secondary stress response to matrix
    overexpression?
- question: >-
    What does AltMIEF1 contribute that MALSU1 and mt-ACP alone cannot? For example, is it
    required for mt-ACP recruitment to the module, or for module release before subunit
    joining?
suggested_experiments:
- description: >-
    In AltMIEF1 knockout cells made by frameshifting only the uORF, so that MiD51 is
    preserved (as in PMID:30181344), perform cryo-EM or sucrose-gradient analysis of mt-LSU
    particles. This would test whether MALSU1 and mt-ACP still bind and whether premature
    subunit association occurs.
- description: >-
    Run complexome profiling of complex I assembly intermediates in uORF-specific knockout
    cells, with and without re-expression of AltMIEF1 or of an LYR->AAA mutant. This
    would separate a direct assembly-factor role from a translation-dependent effect.
