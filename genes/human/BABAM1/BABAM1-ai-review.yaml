suggested_questions:
- question: MERIT40 localizes to psoralen ICLs in HeLa cells, its knockdown reduces BRCA1/RAD51/RPA recruitment
    there, and Merit40-null MEFs are MMC-sensitive but not IR-sensitive. Should BABAM1 (and the BRCA1-A
    complex) carry interstrand cross-link repair (GO:0036297)? BRCA1, RAP80 and ABRAXAS1 currently have
    no such GOA annotation, so it is not asserted here.
- question: Is MERIT40's tankyrase-recruiting RXXPEG motif a distinct, separable adaptor function from
    its structural role in BRCA1-A and BRISC, and is it regulated by Akt/mTORC2 phosphorylation?
- question: Does BABAM1 have any activity beyond scaffolding (for example ubiquitin or chromatin binding
    through its VWA domain), and how does it partition between the BRCA1-A and BRISC complexes?
suggested_experiments:
- description: Use structure-guided BABAM1 mutants that disrupt BRE binding versus other VWA surfaces
    to separate complex-integrity functions from any direct substrate engagement, in both BRCA1-A foci
    formation and BRISC-IFNAR1 assays.
