id: Q9NWV8
gene_symbol: BABAM1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BABAM1 (BRISC and BRCA1-A complex member 1; MERIT40/NBA1) is a scaffold subunit, with a von
  Willebrand factor A-like fold (InterPro vWFA superfamily), of two BRCC3/BRCC36-containing K63-linked
  deubiquitinase complexes. In the nuclear BRCA1-A complex (RAP80, ABRAXAS1, BRCC3, BABAM2/BRE, BABAM1),
  it binds BABAM2 directly and maintains complex stability, BRCC3 deubiquitinase activity, and targeting
  of BRCA1 to ubiquitinated chromatin at DNA double-strand breaks. It is required for the G2/M DNA damage
  checkpoint and for resistance to ionizing radiation. In the cytoplasmic and nuclear BRISC complex (ABRAXAS2,
  BRCC3, BABAM2, BABAM1, regulated by SHMT2), it likewise stabilizes the complex, which deubiquitinates
  substrates such as IFNAR1 to sustain interferon signalling and NUMA1 for spindle assembly. BABAM1 also
  binds tankyrases through an RXXPEG motif, recruiting tankyrase to DSBs and regulating TNKS1 at the spindle.
  It is recruited early to DNA interstrand cross-links with RAP80, and it is phosphorylated by Akt and,
  at Ser29, downstream of mTORC2 after DNA damage.
