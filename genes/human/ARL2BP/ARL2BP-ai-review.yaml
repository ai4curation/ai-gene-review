  - statement: BART stabilizes GTP-bound ARL3 by limiting nucleotide dissociation.
    supporting_text: BART binds to ARL3GTP and inhibits the dissociation of the otherwise relatively fast
      dissociating GTP (Figure 5B).
    full_text_unavailable: false
  full_text_unavailable: false
