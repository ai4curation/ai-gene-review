- id: file:human/ARL2BP/ARL2BP-notes.md
  title: ARL2BP primary-source assessment and functional synthesis
  findings:
  - statement: Original human BART comparator assays establish ARL2 and ARL3 association.
    supporting_text: The original PMID:11847227 human BART positive-control pull-down experiments directly
      support association with both ARL2 and ARL3. They do not assign the RP2 tubulin-GAP activity to
      BART.
  - statement: Original depletion and vanadate observations support STAT3 phosphorylation regulation.
    supporting_text: In the original PMID:18234692 Results, BART depletion reduces STAT3 tyrosine phosphorylation,
      and vanadate sustains phosphorylation in the depleted cells. This supports a regulatory contribution
      without establishing kinase activity of BART.
  - statement: Original SOCS3 and reporter observations support context-dependent transcriptional regulation.
    supporting_text: In the original PMID:18234692 Results, BART depletion reduces IL-6-induced SOCS3
      mRNA in Hep3B cells and LIF-dependent reporter output in HeLa cells. These observations support
      context-dependent transcriptional regulation without demonstrating BART action at a genomic locus.
