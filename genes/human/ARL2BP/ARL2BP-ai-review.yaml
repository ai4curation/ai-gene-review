- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IMP
  original_reference_id: PMID:18234692
  qualifier: enables
  review:
    summary: Transcriptional output does not establish a locus-specific coactivator mechanism.
    action: MARK_AS_OVER_ANNOTATED
    reason: The actual original Methods and Results establish STAT3 binding, nuclear retention, and cytokine-dependent
      reporter/endogenous SOCS3 output. The current coactivator definition requires action through a DNA-bound
      transcription factor at a genomic locus. BART recruitment or action at such a locus was not established;
      the authors discuss retention and leave stabilization of STAT3-DNA binding as a possibility. Retain
      the experimental context while flagging the stronger molecular interpretation, without declaring
      the transcriptional phenotype false.
    supported_by:
    - reference_id: PMID:18234692
      supporting_text: "BART plays an essential \nrole in the nuclear retention of STAT3 through interaction\
        \ with ARL2."
      full_text_unavailable: true
    - reference_id: file:human/ARL2BP/ARL2BP-notes.md
      supporting_text: The current GO coactivator definition requires action via a DNA-bound transcription
        factor at a genomic locus. Reporter activity and nuclear retention do not alone demonstrate that
        mechanism.
