id: Q9Y2Y0
gene_symbol: ARL2BP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ARL2BP, also called BART, is a small helical protein that binds the active forms of the ARL2
  and ARL3 GTPases. It cooperates with ARL13B in ARL3 nucleotide exchange and stabilizes GTP-bound GTPases.
  ARL2BP is predominantly cytosolic, with additional mitochondrial, centrosomal, ciliary and nuclear pools.
  It also binds STAT3 and supports its nuclear retention in human cells. Human variants and mouse loss-of-function
  studies associate ARL2BP with photoreceptor and sperm ciliary integrity, although the relationship between
  its GTPase-regulatory activity and ciliary microtubule architecture is not fully resolved.
