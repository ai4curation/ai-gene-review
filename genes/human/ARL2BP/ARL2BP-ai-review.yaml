- id: PMID:33438581
  title: ARL3 activation requires the co-GEF BART and effector-mediated turnover.
  findings:
  - statement: BART cooperates with ARL13B in ARL3 nucleotide exchange independently of product trapping.
    supporting_text: The presence of BART is able to accelerate and increase the nucleotide exchange of
      ARL3mantGDP with unlabelled GDP, excluding the necessity of binding to the product, ARL3GTP, to
      accelerate the dissociation of the bound GDP (Figure 3B).
