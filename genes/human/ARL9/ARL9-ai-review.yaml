knowledge_gaps:
- gap_statement: ARL9 has no characterized biochemical activity, location, effector or regulator, and
    no biological process can be assigned.
  boundary: 'Established: Arf-family G domain with conserved nucleotide-binding motifs, and a serine at
    the catalytic glutamine position. Protein-level evidence exists in UniProt, and BioGRID records a
    few interaction calls. Knockdown phenotypes are limited to one gastric cancer cell line and a Xenopus
    neurogenesis screen. Not established: nucleotide binding or hydrolysis measured in vitro, a validated
    subcellular location (only antibody-atlas staining exists), interaction partners or physiological
    role.'
