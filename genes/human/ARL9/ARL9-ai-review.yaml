  significance: ARL9 and ARL10 form an ancient eukaryotic subfamily; ARL10 is mitochondrial and peroxisomal,
    but whether ARL9 shares any of that biology is unknown.
  resolution: Measure GTP binding and hydrolysis of purified ARL9, localize a tagged construct, and identify
    GTP-dependent partners by affinity purification.
suggested_questions:
- question: Does ARL9 share the mitochondrial/peroxisomal localization of its paralog ARL10, given that
    BioID places ARL9 near mitochondria even though it lacks the 76-residue N-terminal sequence that tethers
    ARL10 to mitochondria?
suggested_experiments:
- description: Compare GTP hydrolysis of wild-type ARL9 with an S73Q mutant that restores the ARF-type
    catalytic glutamine.
