description: ARL9 is a 187-residue Arf-family small GTPase that forms an Arl9/Arl10 subfamily with ARL10,
  conserved across eukaryotes. It retains the nucleotide-binding P-loop, switch I threonine and NKxD motifs,
  but has a serine in place of the catalytic glutamine. Its partners and regulators are uncharacterized,
  and its localization has not been studied beyond antibody atlas staining. ARL9 knockdown reduced growth,
  migration and invasion of AGS gastric cancer cells, and a morpholino screen in Xenopus optic tectum
  identified arl9 as altering neural progenitor proliferation or differentiation.
