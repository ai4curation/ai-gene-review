description: ARL9 is a 187-residue Arf-family small GTPase that forms an Arl9/Arl10 subfamily with ARL10,
  conserved across eukaryotes. It retains the nucleotide-binding P-loop, switch I threonine and NKxD motifs,
  but has a serine in place of the catalytic glutamine. Proximity labelling (BioID) suggests that it acts
  in mitochondria and near the actin and microtubule cytoskeletons, but this has not been confirmed by
  imaging, and its regulators are unknown. ARL9 knockdown reduced growth, migration and invasion of AGS
  gastric cancer cells, and a morpholino screen in Xenopus optic tectum identified arl9 as altering neural
  progenitor proliferation or differentiation.
