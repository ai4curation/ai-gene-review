- question: Does mammalian ARMC2 directly couple radial-spoke precursors to intraflagellar transport,
    and which cargo and train contacts distinguish this role from secondary central-pair destabilization?
suggested_experiments:
- hypothesis: Mammalian ARMC2 supports radial-spoke cargo delivery during cilium assembly.
  description: Tag endogenous ARMC2 and selected radial-spoke precursors in differentiating mammalian
    multiciliated cells; combine live cotransport measurements with interface perturbation, rescue and
    biochemical interaction tests. Distinguish direct transport effects from later central-pair loss.
