description: 'ARMC2 is an armadillo-repeat protein required for normal sperm axoneme assembly and organization.
  Loss of ARMC2 disrupts sperm flagellar structure, with prominent central-pair defects, and biallelic
  human variants cause autosomal recessive spermatogenic failure 38 with severe asthenoteratozoospermia.
  The algal ortholog transports radial-spoke precursors as an intraflagellar-transport cargo adaptor;
  the corresponding mammalian binding mechanism remains unresolved. In mice, ARMC2 loss also alters tracheal
  and oviductal motile cilia: tracheal axonemal ultrastructure is disrupted, whereas oviductal ultrastructure
  is largely preserved despite altered ciliary length, beat frequency and transport.'
