core_functions:
- description: Supports assembly and organization of the sperm axoneme, including formation or maintenance
    of its central-pair architecture.
  directly_involved_in:
  - id: GO:0007288
    label: sperm axoneme assembly
  supported_by:
  - reference_id: file:human/ARMC2/ARMC2-notes.md
    supporting_text: Central-pair loss and absent human SPAG6 staining support an assembly/stability role.
  knowledge_gaps:
  - gap_statement: The mammalian ARMC2 cargo-binding partners and molecular mechanism linking it to axonemal
      assembly remain unresolved.
    boundary: Human and mouse sperm-assembly defects are established. Radial-spoke cargo-adaptor function
      is directly demonstrated in Chlamydomonas, while the 2026 mammalian RSPH1 interaction is predicted
      rather than experimentally demonstrated.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    status: NARROWING
    resolution: Test endogenous mammalian ARMC2 interactions and cargo transport during ciliogenesis,
      then distinguish transport defects from secondary axonemal instability.
    provenance:
    - reference_id: file:human/ARMC2/ARMC2-notes.md
      supporting_text: Reduced RSPH1 staining and a structural interaction prediction do not demonstrate
        an ARMC2–RSPH1 interaction; the Discussion explicitly calls for experimental confirmation.
suggested_questions:
- question: Does mammalian ARMC2 directly couple radial-spoke precursors to intraflagellar transport,
    and which cargo and train contacts distinguish this role from secondary central-pair destabilization?
suggested_experiments:
- hypothesis: Mammalian ARMC2 supports radial-spoke cargo delivery during cilium assembly.
  description: Tag endogenous ARMC2 and selected radial-spoke precursors in differentiating mammalian
    multiciliated cells; combine live cotransport measurements with interface perturbation, rescue and
    biochemical interaction tests. Distinguish direct transport effects from later central-pair loss.
  experiment_type: Live imaging and interaction analysis
