- id: PMID:34982025
  title: Chlamydomonas ARMC2/PF27 is an obligate cargo adapter for intraflagellar transport of radial
    spokes.
  findings:
  - statement: In Chlamydomonas, tagged ARMC2 co-transports with radial-spoke cargo RSP3, whose IFT depends
      on ARMC2.
    supporting_text: Fluorescent protein (FP)-tagged ARMC2 and the RS subunit RSP3 co-migrate on anterograde
      IFT trains in regenerating Chlamydomonas flagella whereas IFT of RSP3 was abolished in armc2.
    full_text_unavailable: false
  - statement: Conservation of the algal radial-spoke transport mechanism in other organisms remains unresolved.
    supporting_text: To conclude, further studies are required to determine if the role of Chlamydomonas
      ARMC2 in RS transport is conserved in other organisms.
    full_text_unavailable: false
