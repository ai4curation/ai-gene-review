id: O15105
gene_symbol: SMAD7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SMAD7 is an inhibitory SMAD that broadly antagonizes TGF-beta superfamily signaling. It binds
  activated type I receptors for TGF-beta and activin to block R-SMAD access, recruits SMURF ubiquitin
  ligases that down-regulate receptor complexes, and can enter the nucleus to inhibit SMAD-dependent transcriptional
  complexes.
