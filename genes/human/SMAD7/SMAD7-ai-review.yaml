suggested_questions:
- question: Which cells use nuclear SMAD7-DNA binding as a major inhibitory mechanism instead of receptor-level
    SMAD7-SMURF recruitment?
  experts: []
- question: How much of SMAD7 regulation of beta-catenin and adherens junctions is independent of canonical
    TGF-beta receptor inhibition?
  experts: []
suggested_experiments:
- hypothesis: SMAD7 nuclear DNA binding contributes measurably to TGF-beta inhibition in cells where SMURF-mediated
    receptor turnover is blocked.
  description: Use endogenous SMAD7 mutants that retain type I receptor and SMURF binding but lose MH2-dependent
    DNA association, and measure TGF-beta target-gene repression after acute inhibition of receptor ubiquitination.
