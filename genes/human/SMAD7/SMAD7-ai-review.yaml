  sequence_note: VSP_047540
existing_annotations:
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IDA
  original_reference_id: PMID:17438144
  qualifier: involved_in
  review:
    summary: Accept nuclear repression of RNA polymerase II transcription as core.
    action: ACCEPT
    reason: SMAD7 can antagonize SMAD-DNA complexes in the nucleus and thereby repress SMAD-responsive
      transcription, but its dominant core is type I receptor inhibition.
    supported_by:
    - reference_id: PMID:17438144
      supporting_text: Smad7 disrupts the formation of the TGF-beta-induced functional Smad-DNA complex
- term:
    id: GO:0000785
    label: chromatin
  evidence_type: ISA
  original_reference_id: GO_REF:0000113
  qualifier: located_in
  supporting_entities:
  - tfclass:7.1.1
  review:
    summary: Keep chromatin as a non-core nuclear site.
    action: KEEP_AS_NON_CORE
    reason: SMAD7 has direct evidence for DNA binding and chromatin immunoprecipitation at a TGF-beta
      target promoter.
    supported_by:
    - reference_id: PMID:17438144
      supporting_text: A ChIP assay showed that endogenous Smad7 could pull down the PAI-1 promoter DNA
        in Hep3B cells
- term:
    id: GO:0000978
    label: RNA polymerase II cis-regulatory region sequence-specific DNA binding
  evidence_type: IDA
  original_reference_id: PMID:17438144
  qualifier: enables
  review:
    summary: Add sequence-specific DNA binding for the SMAD7 nuclear mechanism.
    action: NEW
    reason: Smad7 binds Smad-binding-element-containing ARE and PAI-1 promoter sequences via its MH2
      domain and can compete with signaling Smad-DNA complexes.
    supported_by:
    - reference_id: PMID:17438144
      supporting_text: EMSA with purified GST-Smad7 further confirmed that Smad7 can directly interact
        with DNA in a sequence-specific manner
    - reference_id: PMID:17438144
      supporting_text: Smad7 could directly bind the DNA fragment derived from the ARE in vitro and the
        natural PAI-1 promoter in vivo
- term:
