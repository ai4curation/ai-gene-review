  label: Homo sapiens
description: ANKRD6 (Diversin) is the vertebrate ortholog of the Drosophila core planar cell polarity
  protein Diego. It acts as a switch between Wnt branches, inhibiting canonical Wnt/beta-catenin signaling
  while promoting the beta-catenin-independent planar cell polarity (PCP) and JNK pathway. Mouse Ankrd6
  localizes asymmetrically in inner-ear sensory cells, its loss causes PCP defects and raises canonical
  Wnt signaling, and it rescues fly diego mutants. In Xenopus, Diversin forms tension-sensitive PCP complexes
  needed for neural tube closure and wound healing. It can also enter the nucleus, where it binds AF9
  and boosts JNK-dependent gene expression. Hypomorphic human ANKRD6 variants occur in neural tube defects.
