core_functions:
- description: Mitochondrial complex I assembly factor associated with the inner membrane and assembly
    intermediates. FOXRED1 participates in the productive assembly or stability of intermediate complexes;
    its exact molecular activity and the relation of the predicted flavoprotein fold to this assembly
    role remain unresolved.
