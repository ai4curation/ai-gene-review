id: Q96CU9
gene_symbol: FOXRED1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FOXRED1 is a nuclear-encoded mitochondrial protein with a predicted FAD-dependent oxidoreductase
  fold. It associates with the inner membrane and respiratory-chain complex I assembly intermediates and
  is required for productive complex I biogenesis. Its precise molecular activity, physiological substrate
  and flavin-dependent mechanism remain unresolved. FOXRED1 loss also impairs complex II assembly in human
  myoblasts in a cell-type-dependent manner. Biallelic pathogenic variants cause mitochondrial complex
  I deficiency, nuclear type 19. Reported membrane association and predicted transmembrane topology remain
  incompletely reconciled.
