id: Q96CU9
gene_symbol: FOXRED1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FOXRED1 is a nuclear-encoded mitochondrial complex I assembly factor with a predicted flavoprotein
  fold. It associates with the mitochondrial inner membrane and complex I assembly intermediates and supports
  productive middle-to-late assembly. Human cell studies link its loss to reduced mature complex I and
  abnormal assembly intermediates; myoblasts also show a context-dependent complex II assembly defect.
  Biallelic pathogenic variants cause mitochondrial complex I deficiency, nuclear type 19 (MC1DN19). Its
  physiological molecular activity and flavin-dependent mechanism remain unresolved.
