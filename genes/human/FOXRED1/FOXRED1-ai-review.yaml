proposed_new_terms: []
suggested_questions:
- question: Does FOXRED1 bind FAD and catalyze a physiologically relevant reaction, and can those biochemical
    properties be separated from its complex I assembly role?
- question: Which assembly intermediate and contact partners depend directly on FOXRED1, and how do disease-associated
    variants affect its abundance, folding, localization and assembly activity?
- question: Why does FOXRED1 depletion impair complex II assembly in myoblasts while measured fibroblast
    complex II levels remain comparatively preserved?
suggested_experiments:
- description: Purify correctly folded FOXRED1 and measure cofactor occupancy and candidate redox activity
    with appropriate protein-free, denatured-protein and substrate controls. If activity is detected,
    test variants that specifically impair it while retaining folding, abundance and localization before
    attributing altered cellular assembly to loss of catalysis.
- description: Compare complexome profiles and cross-linking mass spectrometry in FOXRED1-null, wild-type-rescued
    and variant-rescued cells, distinguishing physical contacts from co-migration and calibrating intermediate
    masses consistently across experiments.
