core_functions:
- description: Mitochondrial complex I assembly factor associated with the inner membrane and assembly
    intermediates. Human perturbation and physical-association evidence support productive middle-to-late
    assembly, with assay-specific intermediate or stability defects. Its exact molecular activity and
    the contribution of its predicted flavoprotein fold remain unresolved.
  directly_involved_in:
  - id: GO:0032981
    label: mitochondrial respiratory chain complex I assembly
  locations:
  - id: GO:0005743
    label: mitochondrial inner membrane
  supported_by:
  - reference_id: file:human/FOXRED1/FOXRED1-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Involved in mid-late stages of complex I assembly
  - reference_id: PMID:25678554
    supporting_text: co-immunoprecipitate with a number of complex I subunits.
  - reference_id: PMID:25678554
    supporting_text: Cells lacking FOXRED1 had ∼10% complex I levels,
  - reference_id: PMID:20858599
    supporting_text: human disease, is now shown to be a complex I-specific molecular chaperone.
  - reference_id: PMID:27215383
  knowledge_gaps:
  - gap_statement: Does FOXRED1 catalyze an oxidation-reduction reaction or bind a flavin cofactor in
      the relevant assembly state, and how would that activity support complex I assembly?
    boundary: Human genetic, perturbation and physical-association evidence establish complex I assembly
      involvement. The UniProt FAD annotation is a manual similarity inference (ECO:0000250), and Pfam
      PF01266, InterPro IPR006076/IPR036188 and SUPFAM SSF51905 support a FAD/NAD(P)-binding oxidoreductase-like
      fold. These are meaningful mechanistic clues, but the inspected human studies and structural model
      do not identify a FOXRED1 substrate reaction or measure FOXRED1-bound cofactor. Four specific molecular-function
      IBDs in the retained PTHR13847 tree are outside the FOXRED1 ancestral path; this limits transfer
      of those specific activities and does not establish catalytic inactivity or absence of FAD binding.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    provenance:
    - reference_id: file:human/FOXRED1/FOXRED1-uniprot.txt
      supporting_text: EC=1.-.-.-;
    - reference_id: PMID:25765152
    - reference_id: PMID:40859035
  - gap_statement: What accounts for the cell-type-dependent complex II defect after FOXRED1 loss?
    boundary: Myoblast perturbation and rescue establish a contextual dependency, but the inspected experiments
      do not identify a complex II partner or altered SDHA flavination. No new complex II process annotation
      is proposed.
    gap_kind:
    - BIOLOGY
    dark_aspect: BP_DARK
    provenance:
    - reference_id: PMID:27215383
proposed_new_terms: []
suggested_questions:
- question: Does FOXRED1 bind FAD and catalyze a physiologically relevant reaction, and can those biochemical
    properties be separated from its complex I assembly role?
- question: Which direct molecular contacts and biochemical changes mediated by FOXRED1 enable productive
    assembly, beyond the reported co-immunoprecipitation with AIFM1, ACAD9 and complex I subunits, and
    how do pathogenic variants alter these steps rather than simply protein abundance, folding or localization?
- question: Why does FOXRED1 depletion impair complex II assembly in myoblasts while measured fibroblast
    complex II levels remain comparatively preserved?
suggested_experiments:
- description: Purify correctly folded FOXRED1 and measure cofactor occupancy and candidate redox activity
    with appropriate protein-free, denatured-protein and substrate controls. If activity is detected,
    test variants that specifically impair it while retaining folding, abundance and localization before
    attributing altered cellular assembly to loss of catalysis.
- description: Compare calibrated complexome profiles and cross-linking mass spectrometry in FOXRED1-null,
    wild-type-rescued and variant-rescued cells. Test direct contacts with the reported AIFM1, ACAD9 and
    complex I partners separately from co-immunoprecipitation or co-migration, and distinguish failed
    assembly from subsequent intermediate breakdown.
