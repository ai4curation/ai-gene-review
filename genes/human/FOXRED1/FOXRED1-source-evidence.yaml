  review:
    summary: Human FOXRED1 loss and complementation support its participation in productive complex I
      assembly.
    action: ACCEPT
    reason: The verified 2015 abstract reports a late ~815-kDa intermediate that fails to mature and breaks
      down to ~475 kDa, reduced complex I in null cells and co-immunoprecipitation with complex I subunits.
      The independently read 2016 study reports FOXRED1 association with a ~370-kDa subcomplex and impaired
      formation of a ~550-kDa mid-assembly complex. Its Discussion notes uncertainty over whether the
      accumulated ~340-kDa material is an assembly intermediate or breakdown product and whether BN-PAGE
      mass calibration accounts for the difference from 2015. These source-specific observations support
      productive assembly without fixing one universal intermediate mass or identifying a FOXRED1 redox
      substrate.
    supported_by:
    - reference_id: PMID:25678554
      supporting_text: Cells lacking FOXRED1 had ∼10% complex I levels,
    - reference_id: PMID:25678554
      supporting_text: that FOXRED1 is a crucial component in the productive assembly of complex I and
    - reference_id: PMID:27215383
