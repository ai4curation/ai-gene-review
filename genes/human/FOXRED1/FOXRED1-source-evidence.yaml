selected_primary_scope:
- reference_id: PMID:20858599
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4560042/
  scope: 'Indexed original Results: complementation/silencing, subcellular/submitochondrial localization,
    Figures5–7 captions and selected Discussion; no figure-pixel read.'
  finding: Human patient-cell rescue and knockdown support complex I assembly/function. C-terminal fusion
    localization and fractionation support mitochondrial inner-membrane association, with soluble mitochondrial
    signal also reported. Precursor cleavage is an interpretation. Figure5 caption and Results give inconsistent
    knockdown percentages, so no exact percentage is adopted. FAD-site consequences are modeled, not measured
    binding.
- reference_id: PMID:25678554
  url: https://pubmed.ncbi.nlm.nih.gov/25678554/
  scope: Authentic PubMed abstract only; original publisher page/PDF retrieval failed403/429, preserved.
  finding: Human null-cell and patient-cell assembly results support the existing IMP annotation. Co-immunoprecipitation
    supports association with complex I subunits. Retain curated inner-membrane IDA with the full-text
    access limitation and independent2010 corroboration. Do not attribute a FOXRED1 enzyme assay to complex
    I activity measurements.
- reference_id: PMID:27215383
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC4968213/
  scope: Original Methods, Results, Discussion and figure captions read; HTML extraction paragraphs61–81
    explicitly inspected. No pixels or supplements.
  finding: Co-immunoprecipitation identified AIFM1, ACAD9 and complex I subunits. The study models FOXRED1
    involvement in formation of a ~550-kDa mid-assembly complex from smaller subassemblies; its Discussion
    explicitly leaves unresolved whether accumulated material is an intermediate or breakdown product
    and whether calibration explains differences from the 2015 late-intermediate results. Myoblast complex
    II loss and rescue remain contextual; the flavination assay measured SDHA, not FOXRED1-bound FAD.
- reference_id: PMID:25765152
  url: https://pubmed.ncbi.nlm.nih.gov/25765152/
  scope: Verified PubMed identity and original publisher abstract/selected section snippets, not full
    original Methods.
  finding: The modeled pocket and possible oxygen-binding site motivate a catalytic hypothesis; no wet-lab
    FOXRED1 catalytic or cofactor measurement is established by this consultation.
- reference_id: PMID:40859035
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12489013/
  scope: Original FOXRED1-specific complexome Results paragraph63 and Discussion paragraph80; article
    identity/PMID metadata verified. No full supplement or figure-pixel review.
  finding: RTN4IP1 perturbation changes FOXRED1 association with complex I intermediates. Detergent-specific
    complexome patterns are not a direct binding or enzymatic assay. The paper treats FOXRED1 catalytic
    function and proposed RTN4IP1/FOXRED1 cooperation as unresolved.
