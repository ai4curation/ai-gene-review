id: Q9H6U8
gene_symbol: ALG9
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  ALG9 is a glycosyltransferase-22-family membrane enzyme that uses dolichyl-phosphate-mannose to build
  the oligomannose core of the lipid-linked precursor for protein N-linked glycosylation. Its catalytic
  site faces the endoplasmic reticulum lumen. ALG9 adds an alpha-1,2-linked seventh mannose to Man(6)GlcNAc(2)-PP-dolichol
  and, after ALG12 adds the eighth mannose, adds an alpha-1,2-linked ninth mannose to Man(8)GlcNAc(2)-PP-dolichol.
  Purified human isoform 1 catalyzes both reactions with synthetic dolichol analogs, and its structure
  contains 11 transmembrane helices. Reduced ALG9 activity causes accumulation of the Man6 and Man8 lipid-linked
  intermediates and deficient protein glycosylation. Biallelic pathogenic variants cause ALG9 congenital
  disorder of glycosylation, including severe presentations with skeletal and renal abnormalities.
