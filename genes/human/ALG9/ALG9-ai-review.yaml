- id: file:human/ALG9/ALG9-uniprot.txt
  title: UniProtKB entry Q9H6U8 (ALG9_HUMAN), Alpha-1,2-mannosyltransferase ALG9
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Exact cached Q9H6U8 human ALG9 entry read, including the two catalytic Rhea/EC
      records, ER location and four alternative products. This is a curated database source. The
      2026 human structure supersedes older predicted helix counts, without editing the downloaded
      sequence/features or implying that every isoform was structurally tested.
- id: PMID:41807832
  title: Structures of ALG3/9/12 reveal the assembly logic of the N-glycan oligomannose core.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary full cached Methods/Results read. Purified human ALG9 isoform 1 Q9H6U8
      catalyzes both Man6 and Man8 acceptor reactions using synthetic Dol25 lipid analogs; products
      are analyzed after transfer to a reporter peptide by TbSTT3B. Human ALG9 has 11 transmembrane
      helices. Wild-type enzyme activity assays are distinct from substrate-trapped D82A structural
      complexes. The same paper uses yeast ALG3 and chicken ALG12; those species are not substituted
      for human ALG9.
  findings:
  - statement: Purified human ALG9 isoform 1 catalyzes both lipid-linked acceptor reactions;
      synthetic Dol25 substrates isolate the two transfer steps.
    supporting_text: Assays with Dol25-PP-GlcNAc2Man6 or Dol25-PP-GlcNAc2Man8 acceptor substrates
      confirmed the dual activity of ALG9 in vitro (Fig. 1d,f).
  - statement: The human ALG9 structure contains 11 transmembrane helices.
    supporting_text: ALG9 and ALG12 are classified as GT-22 enzymes. They contain 11 TM helices and
      a cytosolic N terminus.
