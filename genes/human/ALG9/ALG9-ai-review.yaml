    review_notes: 'Cached and live human reaction identity verified: ninth-mannose transfer to the Man8
      lipid-linked acceptor, using Dol-P-Man in the ER lumen. Its generic catalyst activity is refined
      to GO:0052918. The ancillary bipolar exclusion wording exceeds the scope of the negative common-variant
      association study.'
- id: Reactome:R-HSA-4720478
  title: Defective ALG9 does not add the seventh mannose to the N-glycan precursor
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached human event identity and summary read. This models defective
      seventh-mannose addition by ALG9 and reports E523K/Y286C and accumulated precursor substrates.
