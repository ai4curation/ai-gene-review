    label: alpha-1,2-mannosyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: Refine the inherited alpha-1,2-mannosyltransferase activity to both measured
      lipid-linked acceptor reactions.
    action: MODIFY
    reason: The PAINT parent activity is biologically correct. Human patient glycan profiles and
      complementation support both ALG9 steps, and purified human ALG9 isoform 1 independently
      transfers mannose to synthetic Man6 and Man8 lipid-linked acceptors in PMID:41807832. The two
      existing substrate-specific descendants describe this chemistry more precisely. This is a
      specificity refinement, not evidence of an erroneous ancestral placement or functional loss.
    supported_by:
    - reference_id: PMID:41807832
      supporting_text: Assays with Dol25-PP-GlcNAc2Man6 or Dol25-PP-GlcNAc2Man8 acceptor substrates
        confirmed the dual activity of ALG9 in vitro (Fig. 1d,f).
    - reference_id: PMID:15148656
      supporting_text: The functional homology between the human ALG9 and Saccharomyces cerevisiae
        ALG9, as well as the deleterious effect of the E523K mutation detected in the patient with
        CDG, were confirmed by a yeast complementation assay lacking the ALG9 gene.
    proposed_replacement_terms:
