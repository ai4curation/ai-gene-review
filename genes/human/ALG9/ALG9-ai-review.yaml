  locations:
  - id: GO:0098553
    label: lumenal side of endoplasmic reticulum membrane
  supported_by:
  - reference_id: PMID:41807832
    supporting_text: Assays with Dol25-PP-GlcNAc2Man6 or Dol25-PP-GlcNAc2Man8 acceptor substrates
      confirmed the dual activity of ALG9 in vitro (Fig. 1d,f).
  - reference_id: PMID:15148656
    supporting_text: Using this approach, we have found, in a patient with CDG, a deficiency of the
      ALG9 alpha 1,2 mannosyltransferase enzyme, which causes an accumulation of
      lipid-linked-GlcNAc(2)Man(6) and -GlcNAc(2)Man(8) structures, which was paralleled by the
      transfer of incomplete oligosaccharides precursors to protein.
  - reference_id: PMID:15945070
    supporting_text: "A defect in the ALG9 enzyme was suggested by the accumulation of the DolPP-GlcNAc2Man6
      and DolPP-GlcNAc2Man8 in the patient's fibroblasts and confirmed by mutation analysis: the patient
      is homozygous for the ALG9 mutation p.Y286C."
- description: ALG9 transfers the ninth mannose from dolichyl-phosphate-mannose to the Man8
    lipid-linked N-glycan precursor at the luminal face of the ER membrane. This completes the C
    branch after ALG12 adds the eighth mannose.
