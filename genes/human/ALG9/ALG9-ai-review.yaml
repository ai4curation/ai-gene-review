core_functions:
- description: ALG9 transfers the seventh mannose from dolichyl-phosphate-mannose to the Man6
    lipid-linked N-glycan precursor at the luminal face of the ER membrane. This completes the B
    branch before the intervening ALG12 addition.
  molecular_function:
    id: GO:0052926
    label: dol-P-Man:Man(6)GlcNAc(2)-PP-Dol alpha-1,2-mannosyltransferase activity
