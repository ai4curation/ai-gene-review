  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'The cached human pathway identity and LLO-assembly context support the process annotation;
      individual ALG9 reactions are established separately. The summary calls the three terminal sugars
      GlcNAcs, an apparent source-text error: the completed precursor terminates in three glucoses. That
      wording is not adopted as biology and the machine record is preserved.'
- id: Reactome:R-HSA-446215
  title: ALG9 transfers Man to N-glycan precursor (GlcNAc)2 (Man)6 (PP-Dol)1
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Cached and live human reaction identity verified: seventh-mannose transfer to the Man6
      lipid-linked acceptor, using Dol-P-Man in the ER lumen. Its broad GO:0000026 catalyst mapping is
      refined to GO:0052926. The historical bipolar paragraph overstates the later common-variant negative
      study as proving the hypothesis wrong; no such universal exclusion is inferred.'
- id: Reactome:R-HSA-446216
  title: ALG9 transfers Man to N-glycan precursor (GlcNAc)2 (Man)8 (PP-Dol)1
  findings: []
