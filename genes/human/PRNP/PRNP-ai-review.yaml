- term:
    id: GO:0001540
    label: amyloid-beta binding
  evidence_type: IDA
  original_reference_id: PMID:24012003
  qualifier: enables
  review:
    summary: PrP(C) binds soluble amyloid-beta oligomers with nanomolar affinity at the neuronal surface.
    action: ACCEPT
    reason: Expression cloning identified PrP(C) as a high-affinity amyloid-beta oligomer binding site,
      and many independent studies confirm direct binding (N-terminal residues 23-27 and 95-110). This
      is one of the best-characterized molecular interactions of PrP(C).
    supported_by:
    - reference_id: PMID:19242475
      supporting_text: Here we identify the cellular prion protein (PrP(C)) as an amyloid-beta-oligomer
        receptor by expression cloning.
    - reference_id: PMID:24012003
      supporting_text: Soluble amyloid-β oligomers (Aβo) trigger Alzheimer's disease (AD) pathophysiology
        and bind with high affinity to cellular prion protein (PrP(C)).
