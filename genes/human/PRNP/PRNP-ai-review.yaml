- term:
    id: GO:0005507
    label: copper ion binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1346999
  - MGI:MGI:97769
  - PANTHER:PTN008560095
  - UniProtKB:P04156
  - UniProtKB:Q9UKY0
  review:
    summary: Copper binding is a conserved property of the PrP family.
    action: ACCEPT
    reason: The octarepeat copper-binding region is conserved across mammalian PrP, so the PAINT node
      placement is sound and matches direct human evidence.
    supported_by:
    - reference_id: PMID:11900542
      supporting_text: This region selectively binds Cu2+ in vivo.
- term:
    id: GO:0005507
    label: copper ion binding
  evidence_type: IDA
  original_reference_id: PMID:11900542
  qualifier: enables
  review:
    summary: The octarepeat region of PrP(C) binds Cu(2+) with high affinity.
    action: ACCEPT
    reason: Copper binding by His residues of the octapeptide repeats (PHGGGWGQ, residues 60-91) and flanking
      His96/His111 is established structurally (crystallography, EPR) and is a core biochemical property
      of PrP(C).
    supported_by:
    - reference_id: PMID:11900542
      supporting_text: This region selectively binds Cu2+ in vivo.
    - reference_id: file:human/PRNP/PRNP-uniprot.txt
      supporting_text: At low copper concentrations, the sidechains of His residues from three or four
        repeats contribute to the binding of a single copper ion.
