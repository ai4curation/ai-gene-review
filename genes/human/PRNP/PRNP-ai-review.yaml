id: P04156
gene_symbol: PRNP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PRNP encodes the cellular prion protein (PrP(C)), a GPI-anchored glycoprotein attached to
  the outer leaflet of the plasma membrane, enriched in cholesterol-rich lipid rafts and at synapses of
  neurons, and also expressed in many other cell types. Its N-terminal flexible region contains octapeptide
  repeats that bind Cu(2+) (and other divalent cations); copper binding drives PrP(C) out of rafts and
  stimulates its clathrin-dependent endocytosis, and the C-terminal domain is a globular alpha-helical
  fold. PrP(C) can undergo liquid-liquid phase separation and acts as a high-affinity cell-surface binding
  site for soluble amyloid-beta oligomers, coupling them, with co-receptors such as mGluR5 and LRP1, to
  Fyn kinase activation and synaptic dysfunction. PrP(C) also restrains BACE1 cleavage of APP and, in
  mouse, promotes myelin maintenance by activating ADGRG6. Its primary physiological role remains unresolved.
  Misfolding of PrP(C) into the beta-sheet-rich, protease-resistant, self-propagating PrP(Sc) conformer
  causes transmissible spongiform encephalopathies including Creutzfeldt-Jakob disease, fatal familial
  insomnia and Gerstmann-Straussler-Scheinker syndrome.
