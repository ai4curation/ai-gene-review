suggested_questions:
- question: What is the primary physiological function of PrP(C) that is conserved across mammals, given
    that Prnp-null animals are viable with only subtle phenotypes?
- question: Does human PrP(C) act as a copper transporter or buffer in vivo, or is copper binding purely
    a regulatory switch for its trafficking?
- question: Is the human PrP(C)-ADGRG6 agonist relationship described in mouse myelin maintenance operative
    in human peripheral nerve?
- question: Which of the many reported PrP(C) interactors represent physiological extracellular partners
    versus artefacts of cytosolic or in vitro exposure of the protein?
suggested_experiments:
- description: Quantitative surface proteomics with proximity labelling from a GPI-anchored PrP(C) bait
    in human neurons, to define the physiological extracellular interactome separately from interactors
    reported for cytosolic PrP.
- description: Isogenic human iPSC-derived neurons with PRNP knockout or octarepeat deletion, assayed
    for copper uptake, raft composition and synaptic transmission, to separate copper-dependent from copper-independent
    PrP(C) functions.
- description: Single-molecule imaging of PrP(C) diffusion and clustering at the neuronal surface before
    and after amyloid-beta oligomer exposure, with and without mGluR5 or LRP1 knockdown, to test the co-receptor
    model directly in human cells.
