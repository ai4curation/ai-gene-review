core_functions:
- description: Binds Cu(2+) through the histidine-containing octapeptide repeats of its flexible N-terminal
    region at the outer face of the neuronal plasma membrane; copper binding alters raft partitioning
    and drives clathrin-dependent endocytosis of the protein.
  molecular_function:
    id: GO:0005507
    label: copper ion binding
  locations:
  - id: GO:0009897
    label: external side of plasma membrane
  - id: GO:0045121
    label: membrane raft
  directly_involved_in:
  - id: GO:0071280
    label: cellular response to copper ion
  supported_by:
  - reference_id: PMID:11900542
    supporting_text: The crystal structure of HGGGW in a complex with Cu2+ reveals equatorial coordination
      by the histidine imidazole, two deprotonated glycine amides, and a glycine carbonyl
  - reference_id: PMID:16254249
    supporting_text: Copper caused PrP(C) to move laterally out of detergent-insoluble lipid rafts into
      detergent-soluble regions of the plasma membrane.
- description: Acts as a high-affinity cell-surface binding site for soluble amyloid-beta oligomers; the
    resulting complexes, together with transmembrane co-receptors such as mGluR5 and LRP1, transduce signals
    that activate Fyn kinase and impair synaptic function.
