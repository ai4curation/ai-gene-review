id: Q9BQ52
gene_symbol: ELAC2
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: ELAC2 encodes the long tRNase Z endoribonuclease, which removes 3′ trailers from precursor
  tRNAs to generate their mature 3′ ends. It acts in the nucleus and mitochondria, supporting tRNA maturation
  in both compartments. In the mitochondrial processing system, association with TRMT10C and SDR5C1 enhances
  ELAC2 cleavage. Alternative translation initiation contributes to its nuclear and mitochondrial targeting.
