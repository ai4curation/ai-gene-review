- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: HDA
  original_reference_id: PMID:22658674
  qualifier: enables
  review:
    summary: Human ELAC2 binds RNA directly in a tRNA-bound structure; the original capture-screen measurement
      remains unverified.
    action: KEEP_AS_NON_CORE
    reason: PMID:39516281 directly places human ELAC2 residues against the mitochondrial tRNA T loop,
      acceptor-arm backbone and 5′ phosphate in a reconstituted RNase Z complex (Results Par22–25, Fig.
      3). These ELAC2–RNA contacts establish RNA binding independently of the capture screens; the conclusion
      is not inferred only from the need for a nuclease to encounter its substrate. The recombinant
      preparation is an added serine plus canonical residues 31–826, with TRMT10C/SDR5C1 in the structural
      complex, and does not establish equivalent binding by all four natural splice products. Retain
      the broad gene-level term as a corroborating non-core annotation because the established catalytic
      activity is represented in the core. The ELAC2-specific supplementary result in PMID:22658674
      was not recovered from the accessible original overview. Defer to the curated positive HDA assertion
      while leaving its original measurement unverified; this independent structural evidence does not
      authenticate that mRNA-capture result or establish an mRNA-regulatory function.
    supported_by:
    - reference_id: PMID:22658674
    - reference_id: PMID:39516281
    additional_reference_ids:
    - PMID:39516281
