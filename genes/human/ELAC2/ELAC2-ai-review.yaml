      catalyst 6786864 and matrix physical entity 6786837. Its ELAC2 step is tRNA 3′ cleavage, with 5′
      cleavage assigned separately to mitochondrial RNase P. This verifies the target-specific database
      chain, not a new assay or a claim that all splice products act in the matrix.
- id: Reactome:R-HSA-9708296
  title: tRNA-derived small RNA (tsRNA or tRNA-related fragment, tRF) biogenesis
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The current official pathway is tRNA-derived small RNA biogenesis. Its ELAC2 child reaction
      9708812 removes the 3′ trailer from a pre-tRNA, while other pathway children concern other enzymes.
      This supports the accepted lateral correction from tRNA breakdown to tRNA 3′ processing; it is not
      an ontology descendant refinement or evidence that ELAC2 destroys mature tRNA. PMID:19933153 was
      followed through to the operative original.
