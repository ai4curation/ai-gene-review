- term:
    id: GO:0016078
    label: tRNA decay
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-9708296
  qualifier: involved_in
  review:
    summary: The target-resolved source supports precursor 3′ processing rather than tRNA decay.
    action: MODIFY
    reason: 'R-HSA-9708296 currently describes tRNA-derived small RNA biogenesis. Its ELAC2 child R-HSA-9708812
      consumes pre-tRNA and releases a downstream trailer, whereas GO:0016078 describes tRNA breakdown.
      PMID:19933153 shows reduced trailer tRF-1001 and increased precursor after ELAC2 RNAi; it does
      not demonstrate destruction of mature tRNA. This is a lateral correction of the modeled process,
      not an ontology descendant refinement: replace the decay assignment with GO:0042780 for the actual
      maturation step. Other ANG/DICER pathway reactions cannot supply ELAC2 with their distinct substrate
      or chemistry, and no additional small-RNA regulatory process is proposed.'
    proposed_replacement_terms:
    - id: GO:0042780
      label: tRNA 3'-end processing
    supported_by:
    - reference_id: Reactome:R-HSA-9708296
    - reference_id: Reactome:R-HSA-9708812
    - reference_id: PMID:19933153
    additional_reference_ids:
    - Reactome:R-HSA-9708812
    - PMID:19933153
    source_defects:
    - defect_type: WRONG_TERM
      resource: REACTOME
      slot: GO TERM
      requested_change: REPOINT
      asserted_value: GO:0016078
      corrected_value: GO:0042780
      corrected_label: tRNA 3'-end processing
      confidence: CONFIRMED
      explanation: The enclosing ELAC2 annotation, assigned by Reactome with R-HSA-9708296, maps the
        gene to tRNA decay. The current pathway describes tRNA-derived small RNA biogenesis, and its
        target-resolved ELAC2 child R-HSA-9708812 removes a pre-tRNA 3′ trailer. PMID:19933153 supports
        that precursor-processing step, not destruction of mature tRNA. Repoint this ELAC2 GO association
        to GO:0042780. This is a lateral correction of the modeled process, not an ontology descendant
        refinement or a request to remove the valid Reactome reaction.
      report_status: NOT_REPORTED
