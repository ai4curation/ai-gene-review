existing_annotations:
- term:
    id: GO:0007605
    label: sensory perception of sound
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetic (IBA) annotation of clarin-1 to hearing. This is the best-supported
      core function of CLRN1: loss of function causes Usher syndrome type 3A with
      progressive sensorineural hearing loss, and the clarin family has a conserved
      role in vertebrate hair-cell function.
    action: ACCEPT
    reason: >-
      Core function, concordant with the human IMP evidence (PMID:15650299) and with the
      role of clarin-1 in organizing the F-actin stereociliary hair bundle required for
      mechanotransduction. The IBA node placement across the clarin family is sound.
- term:
    id: GO:0050957
    label: equilibrioception
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Phylogenetic (IBA) annotation to vestibular function. Clarin-1 is expressed in
      vestibular as well as cochlear hair cells, and USH3A patients show variable
      vestibular dysfunction, so a role in equilibrioception is a genuine hair-cell
      function.
    action: ACCEPT
    reason: >-
      Supported by the same hair-bundle F-actin organizing role that underlies hearing,
      and concordant with the human IMP annotation (PMID:15521980). Vestibular
      involvement in USH3A is variable but real.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      Electronic annotation from the UniProt Subcellular Location mapping (SL-0039).
      Clarin-1 is a multi-pass cell-membrane protein; this is well corroborated by
      experimental evidence.
    action: ACCEPT
    reason: >-
      Concordant with EXP (PMID:21310491) and IDA (PMID:19423712) plasma-membrane
      annotations and with UniProt's curated Cell membrane subcellular location. Core
      compartment where clarin-1 functions.
- term:
    id: GO:0007605
    label: sensory perception of sound
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      ARBA machine-learning electronic annotation to hearing, duplicating the IBA and
      IMP annotations for the same term.
    action: ACCEPT
    reason: >-
      Correct core function; duplicate of well-supported experimental (PMID:15650299)
      and phylogenetic evidence. Duplicate GO terms across evidence codes are acceptable.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  review:
    summary: >-
      All 27 GOA "protein binding" IPI rows for CLRN1 derive from a single systematic
      yeast-two-hybrid screen, the human binary reference interactome (HuRI/HI-III-20;
      PMID:32296183). The recovered partners (e.g. ALG8, MGST3, SEC22B, ITGAM, CLDN19,
      multiple TMEM proteins) are largely ER/membrane proteins and do not include the
      physiologically meaningful interactors (harmonin/USH1C, CACNB2). Bare "protein
      binding" conveys no specific molecular function.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0005515 is uninformative as a molecular-function annotation, and these come from
      a high-throughput binary screen with no functional follow-up for clarin-1. Per
      curation guidelines, bare protein binding should not be endorsed as a core function.
      Retained (not removed) because the interactions are experimentally recorded, but
      flagged as over-annotation.
    supported_by:
      - reference_id: PMID:32296183
        supporting_text: >-
          yeast two-hybrid (Y2H) represents the only binary PPI assay that can be operated
          at sufficient throughput to systematically screen the human proteome for binary
          PPIs
- term:
    id: GO:0015630
    label: microtubule cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: >-
      Electronic annotation transferred from the mouse ortholog (Q8K445) by Ensembl
      Compara. Clarin-1 is consistently linked to the F-actin cytoskeleton, not the
      microtubule cytoskeleton; there is no experimental support for a microtubule
      localization.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Biologically unsupported and likely an over-propagated electronic transfer. All
      direct evidence places clarin-1's cytoskeletal role with F-actin (PMID:19423712),
      making a microtubule-cytoskeleton localization implausible as a functional
      annotation.
- term:
    id: GO:0030140
    label: trans-Golgi network transport vesicle
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: >-
      Electronic annotation transferred from the mouse ortholog. Clarin-1 is
      N-glycosylated and matures through the ER and Golgi en route to the plasma
      membrane, so it transiently occupies the Golgi/trans-Golgi trafficking pathway.
    action: KEEP_AS_NON_CORE
    reason: >-
      Reflects a trafficking-transit compartment rather than the site where clarin-1
      carries out its function (plasma membrane / stereocilia). Consistent with the
      Endo H-resistant, Golgi-processed glycan reported for clarin-1, but non-core.
    supported_by:
      - reference_id: PMID:19423712
        supporting_text: >-
          Resistance to Endo H f suggests that the N -linked glycan moiety on CLRN1 was
          processed by Golgi-mannosidase II and passed through the protein quality control
          mechanism of the Golgi apparatus
- term:
    id: GO:0032420
    label: stereocilium
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  review:
    summary: >-
      Electronic annotation transferred from the mouse ortholog. The stereocilium is a
      core site of clarin-1 action: it localizes to the F-actin-rich stereociliary hair
      bundle, and Clrn1-null hair cells show disorganized stereocilia.
    action: ACCEPT
    reason: >-
      Well supported by mouse in-vivo evidence that clarin-1 is required for stereocilia
      organization (PMID:19423712). This is a central, correct localization for the wild-type
      hair-bundle function.
    supported_by:
      - reference_id: PMID:19423712
        supporting_text: >-
          F-actin-enriched stereocilia of auditory hair cells evidenced structural
          disorganization in Clrn1
