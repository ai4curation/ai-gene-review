id: P58418
gene_symbol: CLRN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Clarin-1 is a four-pass membrane glycoprotein that supports the organization of actin-associated
  membrane structures in sensory tissues. Its major studied human product contains 232 residues and an
  N-linked glycosylation site at Asn48. Clarin-1 promotes cortical actin remodeling and cell-surface protrusions,
  and vertebrate models establish roles in maintaining auditory and vestibular hair-cell function. In
  the inner ear, apical hair-bundle integrity and basolateral ribbon-synapse organization are separable
  aspects of its function. Retinal expression is enriched in Müller glia, with cell-specific rescue supporting
  a non-cell-autonomous role in photoreceptor protection. Human loss-of-function variants cause Usher
  syndrome type 3A with hearing loss, retinal degeneration and variable vestibular dysfunction; some variants
  cause nonsyndromic retinitis pigmentosa. Glycosylation and folding influence delivery to the cell surface.
  The molecular operation linking clarin-1 interactions to membrane and actin organization remains unresolved.
