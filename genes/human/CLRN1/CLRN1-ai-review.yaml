- term:
    id: GO:0048870
    label: cell motility
  evidence_type: IDA
  original_reference_id: PMID:19423712
  qualifier: acts_upstream_of_or_within
  review:
    summary: The reported endpoint establishes cellular spreading and protrusions, without resolving cell
      translocation.
    action: MARK_AS_OVER_ANNOTATED
    reason: GO:0048870 requires controlled self-propelled translocation of a cell from one place to another.
      PMID:19423712 describes low-density plating and four-day colony morphology, with loosely packed
      colonies and actin-rich protrusions in human CLRN1-expressing HEK293 clones. Although the authors
      interpret these findings as increased motility, the presented endpoint does not distinguish cell
      displacement from altered spreading, protrusion formation or colony organization. Mark this process
      scope as over-annotated while retaining the positive protrusion and localization observations in
      their own assertions; the heterologous model alone is not the reason for this judgment.
