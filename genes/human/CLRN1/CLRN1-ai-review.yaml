- id: PMID:15650299
  title: Serial audiometry and speech recognition findings in Finnish Usher syndrome type III patients.
  findings:
  - statement: Serial audiometry in 59 Finnish patients and speech testing in 31 document variable progressive
      hearing impairment.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete authentic abstract read; full original article not recovered. No unavailable
      individual-patient or Methods detail is asserted.
  full_text_unavailable: true
- id: PMID:19423712
  title: 'Clarin-1, encoded by the Usher Syndrome III causative gene, forms a membranous microdomain:
    possible role of clarin-1 in organizing the actin cytoskeleton.'
  findings:
  - statement: Human 232-residue CLRN1 in HEK293 cells reaches the surface, concentrates in protrusions
      and changes cortical actin organization; direct actin partners remain unresolved.
    finding_review:
      finding_status: CURRENT
      review_notes: Human NM_174878 CLRN1 expression changes HEK293 actin-rich protrusions. The study
        does not resolve direct actin binding or a self-contained organizing activity. PMID:19539019 examines
        endogenous mouse UB/OC-1 colocalization and does not test the same perturbation or readout.
      supported_by:
      - reference_id: PMID:19539019
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full Methods, Results and Discussion read. The N48K comparison also affects
      expression and trafficking; mouse knockout bundle findings are a separate species context. Cell-motility
      wording is narrowed to the reported colony/protrusion endpoint rather than measured self-propelled
      cell translocation; the other positive localization and organization findings are retained.
- id: PMID:21310491
  title: CLRN1 mutations cause nonsyndromic retinitis pigmentosa.
