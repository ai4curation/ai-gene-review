id: P58418
gene_symbol: CLRN1
product_type: PROTEIN
status: INITIALIZED
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: >-
  Clarin-1 is a 232-amino-acid, four-transmembrane (tetraspanin-like) glycoprotein
  of the clarin family (paralogs CLRN2 and CLRN3), carrying a single N-linked
  glycosylation site at Asn48 in its first extracellular loop. It is expressed in
  the sensory hair cells of the inner ear and in the retina. At the plasma membrane
  it acts as a membrane-associated organizer of the cortical F-actin cytoskeleton
  rather than as an enzyme, channel, or transporter. In cochlear and vestibular hair
  cells clarin-1 supports the organization and maintenance of the F-actin-rich
  stereociliary hair bundle and thereby efficient mechanotransduction, and at the
  basolateral inner-hair-cell ribbon synapse it organizes cortical actin and the
  presynaptic calcium-channel machinery required for synaptic maturation and
  transmission. Clarin-1 traffics through the endoplasmic reticulum and Golgi to the
  cell surface, and disease-associated variants that disrupt glycosylation or folding
  (e.g. N48K) are retained and degraded, reducing surface delivery. In the retina,
  clarin-1 is expressed predominantly in Muller glia and appears to support
  photoreceptor maintenance non-cell-autonomously. Loss of function causes Usher
  syndrome type 3A (progressive post-lingual sensorineural hearing loss, variable
  vestibular dysfunction, and rod-cone retinal degeneration) and non-syndromic
  retinitis pigmentosa.
