suggested_questions:
- question: Does clarin-1 directly bridge defined membrane partners to the actin network, or does its
    organizational effect require another adaptor? The existing tripartite calcium-channel experiment
    identifies CaVβ2 as the bridge.
- question: Which current human alternative products are present and functional in hair cells and Müller
    glia, and how do their membrane topology and trafficking differ?
- question: Which native-cell conditions explain microtubule-associated trafficking, actin-associated
    surface domains and the fixation sensitivity of clarin-1 localization?
- question: How does Müller-glial clarin-1 protect photoreceptors, and which observed junctional changes
    are direct rather than consequences of tissue stress?
suggested_experiments:
- description: Reconstitute defined clarin-1, CaVβ2 and harmonin combinations in membranes, with binary
    and simultaneous binding measurements, to distinguish partner association from clarin-1-mediated bridging.
- description: Compare sequence-verified human alternative products at matched expression in hair-cell
    and Müller-glial systems, using endogenous tagging, surface delivery and actin-organization readouts.
- description: Test temporal and cell-specific rescue in retinal models with matched protein abundance,
    measuring microvillus architecture before degeneration and separating protective low expression from
    overexpression toxicity.
knowledge_gaps:
- gap_statement: The molecular operation by which clarin-1 changes actin-associated membrane organization
    remains unresolved, including whether it directly recruits an actin linker or acts through another
    membrane organizer.
  boundary: Human CLRN1 expression induces actin-rich protrusions, and mouse deletion/rescue establishes
    a role in sensory-cell actin and synaptic organization. Microtubule-associated localization is positive
    in mouse UB/OC-1 cells. The tested tripartite calcium-channel association is bridged by CaVβ2, not
    evidence that CLRN1 itself bridges the partners.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: A defined molecular operation would connect the cellular organization phenotypes to a
    specific activity without inferring a scaffold or actin-binding function from necessity alone.
  resolution: Test sequence-defined clarin-1 and candidate linkers using binary and simultaneous binding
    measurements, matched membrane delivery and actin-organization assays.
