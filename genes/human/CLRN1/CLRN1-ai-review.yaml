core_functions:
- description: Clarin-1 supports organization of actin-associated membrane domains in sensory cells, maintaining
    the stereociliary hair bundle and the synaptic machinery that couples auditory hair cells to afferent
    neurons. Its membrane-associated organization role supports hearing and vestibular function; retinal
    Müller-glial activity provides a related tissue-support context for photoreceptor survival. Apical
    bundle and basolateral synaptic functions can be experimentally separated even though their precise
    molecular organizing mechanism remains unresolved. The human HEK293 organization phenotype and the
    mouse UB/OC-1 localization pattern concern different cellular contexts; direct actin contact by clarin-1
    is not established by either result.
