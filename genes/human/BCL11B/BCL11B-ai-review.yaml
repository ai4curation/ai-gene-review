gene_symbol: BCL11B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BCL11B (CTIP2) is a nuclear C2H2 zinc-finger transcriptional regulator that recognizes regulatory
  DNA and controls transcription through context-dependent activation and chromatin-cofactor recruitment.
  It associates with HDAC1, HDAC2 and SUV39H1 and can be stably incorporated into mammalian SWI/SNF complexes.
  In activated CD4+ T cells it promotes IL2 expression. In hematopoietic progenitors it supports T-lineage
  development and regulates chemokine-responsive migration. Human variants can alter DNA recognition and
  cause combined immune and neurodevelopmental abnormalities.
