- id: PMID:16809611
  title: BCL11B participates in the activation of IL2 gene expression in CD4+ T lymphocytes.
  findings:
  - statement: Activated T-cell experiments establish IL2-site recognition and transcriptional activation.
      Abstract and selected primary Figure 5/Discussion text were read; this is not a complete-paper audit.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official primary PMC/PubMed identity and selected primary text independently read. The
      normal cache remains abstract-only; external selected passages do not make it a full-text cache.
- id: PMID:17245431
  title: Recruitment of chromatin-modifying enzymes by CTIP2 promotes HIV-1 transcriptional silencing.
  findings:
  - statement: CTIP2 recruits chromatin enzymes in the HIV promoter setting. Abstract, selected primary
      Results and PubMed figure captions support HDAC1/2 and SUV39H1 associations; full PMC access was
      challenged.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Official primary PMC/PubMed identity and selected primary text independently read. The
      normal cache remains abstract-only; external selected passages do not make it a full-text cache.
- id: PMID:23644491
  title: Proteomic and bioinformatic analysis of mammalian SWI/SNF complexes identifies extensive roles
    in human malignancy.
  findings:
  - statement: Mouse discovery and human T-cell biochemical experiments support stable BCL11B SWI/SNF
      membership. The selected data do not establish exclusive membership in every tissue.
- id: PMID:23752268
  title: The functional interactome landscape of the human histone deacetylase family.
  findings:
  - statement: The human CEM T-cell HDAC interactome explicitly identifies BCL11B among HDAC1 interactions.
      The exact HDAC2 supplementary pair remains unchecked.
- id: PMID:27959755
  title: Multisystem Anomalies in Severe Combined Immunodeficiency with Mutant BCL11B.
  findings:
  - statement: Human CD34 and zebrafish experiments connect BCL11B perturbation with progenitor positioning,
      chemokine responsiveness and T-cell development. The N441K variant alters target recognition, including
      gain of a new site, and retains p300 association.
- id: PMID:28473536
  title: Impact of cytosine methylation on DNA binding specificities of human transcription factors.
  findings:
  - statement: Human transcription-factor SELEX provides the source of the curated DNA-binding assertion.
      The exact BCL11B motif/construct entry and a methylation preference were not independently established.
- id: PMID:33961781
  title: Dual proteome-scale networks reveal cell-specific remodeling of the human interactome.
  findings:
  - statement: Two cell-line affinity-purification networks provide the interaction resource. The two
      BCL11B–HDAC source pairs and their cell contexts were not inspected.
- id: Reactome:R-HSA-9934021
  title: Formation of neuronal progenitor BAF (npBAF)
  findings:
  - statement: The normal summary gives mouse neural-progenitor BAF context. It is not a direct human
      BCL11B localization experiment.
- id: Reactome:R-HSA-9934024
  title: SMARCA4, BCL11A,B-containing ATPase module binds SMARCC1:SMACC2 dimer:SMARCD1:SMARCE1:SMARCB1:ARID1A:DPF2,
    PHF10
  findings:
  - statement: The normal assembly summary includes BCL11A/B and preserves unresolved BAF-subtype distribution.
      It does not give BCL11B ATPase activity.
- id: file:human/BCL11B/BCL11B-uniprot.txt
  title: UniProt entry for human BCL11B (Q9C0K0)
  findings:
  - statement: Normal record identifies BCL11B/CTIP2, nuclear localization, HDAC1/2 and SUV39H1 interaction
      partners, and two alternative products. Product-specific functional differences are not established
      here.
core_functions:
- description: Sequence-specific transcriptional regulation in the nucleus, with activation in the IL2
    T-cell context and context-dependent recruitment of chromatin-regulatory partners. Stable BAF association
    is documented in human T-cell extracts; it is not assumed to describe every BCL11B pool.
  molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
