    supporting_text: 'BCL11B augments expression from the IL2 promoter

      through direct binding to the US1 site.'
  - reference_id: PMID:17245431
  - reference_id: PMID:23644491
suggested_questions:
- question: Which cell-specific experiments support the transferred neuron-projection location of BCL11B,
    and do they resolve the protein isoform?
- question: Can the original HDAC2 interactome entry and both BioPlex BCL11B–HDAC pairs be recovered with
    their assay and cell-line assignments?
