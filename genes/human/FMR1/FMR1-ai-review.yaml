  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00089956
  review:
    action: KEEP_AS_NON_CORE
    summary: FMRP can regulate alternative splicing of its own transcript.
    reason: 'The ARBA inference is consistent with PMID:18653529: induced human FMRP in rat PC12 cells
      changes endogenous Fmr1 splice-form proportions, with a complementary knockout-mouse observation.
      This is contextual autoregulation rather than a principal spliceosomal activity. The RNA element
      itself is an exonic splicing enhancer, but its minigene enhancer activity was not detectably altered
      by the tested FMRP isoforms; those two findings should not be conflated.'
