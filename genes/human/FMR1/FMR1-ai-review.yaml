id: Q06787
gene_symbol: FMR1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FMR1 encodes FMRP, an RNA-binding protein that recognizes selected RNA sequences and structures
  and organizes messenger ribonucleoprotein particles. It regulates the translation, stability and intracellular
  transport of target mRNAs, with prominent roles in neuronal processes and synapses. Its effects on translation
  depend on the target RNA and regulatory context and include both repression and activation. The low-complexity
  region can scaffold RNA-containing condensates, with assembly and translation influenced by phosphorylation,
  methylation and interacting proteins. FMRP occurs in cytoplasmic RNA complexes and granules, while alternative
  splicing and cellular conditions permit nuclear and nucleolar pools. FMRP also modulates selected ion-channel
  complexes and excitability in studied neuronal systems.
