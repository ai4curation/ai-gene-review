core_functions:
- description: FMRP binds selected mRNA sequences and structured elements through its KH and RGG-containing
    regions and participates in regulatory ribonucleoprotein assemblies. This recognition supports target-dependent
    control of mRNA stability and localization of mRNA cargoes in neuronal processes. Human cellular and
    biochemical experiments establish RNA recognition; activity-dependent transport is directly supported
    in rodent neuronal systems. These roles depend on the RNA and cellular context and are not assumed
    to be shared identically by all natural products.
  molecular_function:
    id: GO:0003729
    label: mRNA binding
  directly_involved_in:
