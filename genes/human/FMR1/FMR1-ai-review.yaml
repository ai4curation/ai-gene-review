    label: regulation of alternative mRNA splicing, via spliceosome
  evidence_type: IDA
  original_reference_id: PMID:18653529
  qualifier: involved_in
  review:
    action: KEEP_AS_NON_CORE
    summary: The original study supports FMRP-dependent changes in Fmr1 splicing.
    reason: PMID:18653529 separates the intrinsic splicing-enhancer activity of an FMR1 RNA element from
      protein-mediated autoregulation. Induction of human FMRP in rat PC12 cells changes endogenous exon
      usage, and mouse cortex supplies a separate loss-of-function comparison. Retain this limited splicing-regulatory
      role without assigning general spliceosome catalysis or equating the paper’s isoform numbers with
      current UniProt products.
    supported_by:
