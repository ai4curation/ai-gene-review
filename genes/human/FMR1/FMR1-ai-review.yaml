- description: FMRP regulates ribosome-mediated protein synthesis from selected mRNAs. It represses translation
    in cell-free and oocyte systems and can enhance translation of particular targets, including ASCL1
    in tested human cells and Sod1 in mouse neuronal and STEK-cell experiments. The direction depends
    on the RNA, protein construct and experimental setting. Reconstitution with human C-terminal fragments
    links repression to condensate formation without establishing a single universal mechanism or equivalent
    activity of all natural products.
  molecular_function:
    id: GO:0045182
    label: translation regulator activity
  directly_involved_in:
