- description: The FMRP low-complexity region supplies multivalent contacts that scaffold RNA-containing
    condensates and connect assembly with translation regulation. Experiments with human FMRP fragments,
    RNA and CAPRIN1 demonstrate this molecular capacity and its sensitivity to phosphorylation and arginine
    methylation. Cellular RNA-granule localization supports the biological setting, while the reconstituted
    systems do not establish that every neuronal granule has the same physical state or that every natural
    product behaves identically.
  molecular_function:
    id: GO:0140693
    label: molecular condensate scaffold activity
