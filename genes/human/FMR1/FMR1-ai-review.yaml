suggested_questions:
- question: Which modern FMRP products account for the nuclear, nucleolar and neuronal RNA-granule observations,
    after historical isoform names are aligned to exact sequences?
- question: Which RNA features and partner or modification states determine whether FMRP represses translation,
    promotes translation, or stabilizes a target transcript?
- question: Does the unresolved presynaptic-translation IBA reflect direct local translation control in
    the relevant compartment, independently of the established translation-independent channel and exocytosis
    effects?
- question: Which components mediate FMRP association with microtubules and dynein, and which interactions
    are direct rather than bridged within ribonucleoprotein particles?
suggested_experiments:
- description: Compare sequence-verified natural FMRP products at endogenous expression in matched human
    neuronal and non-neuronal cells, combining localization with target-resolved RNA binding, transport,
    stability and translation measurements.
- description: Measure local presynaptic translation and rapid channel/exocytosis responses separately
    after acute FMRP perturbation, using RNA-binding and channel-association separation-of-function constructs
    whose sequences are reported.
- description: Reconstitute FMRP–RNA–motor assemblies with defined components and compare their transport
    behavior with endogenous particles, separating direct contacts from lysate-dependent associations.
