- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0162
  review:
    summary: Membrane location mapped from the UniProt subcellular-location annotation (single-pass membrane
      protein, by similarity/sequence).
    action: ACCEPT
    reason: SMIM3 has one predicted transmembrane helix (residues 20-40) and essentially no other domain;
      the original cloning paper also inferred a transmembrane domain. Which membrane it resides in has
      not been determined, so the generic term is the appropriate level.
    supported_by:
    - reference_id: PMID:11288140
      supporting_text: The central 29 amino acids are very hydrophobic and very likely comprise a transmembrane
        domain.
    - reference_id: UniProt:Q9BZL3
      supporting_text: 'SUBCELLULAR LOCATION: Membrane'
- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:32296183
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9BZL3
  review:
    summary: SMIM3 self-interaction detected once in the HuRI yeast two-hybrid screen.
    action: MARK_AS_OVER_ANNOTATED
    reason: A single high-throughput Y2H self-pair for a 60-residue peptide whose only feature is a transmembrane
      helix. Homo-oligomerisation of single-pass helices is common and is not contradicted, but it has
      not been tested by an orthogonal method in membranes, and no functional consequence is known, so
      the term does not describe a function of SMIM3.
    supported_by:
    - *id003
