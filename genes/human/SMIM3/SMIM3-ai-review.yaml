      from a high-throughput binary-interaction hit, so the row is removed rather than rewritten. Across
      the four interactome screens SMIM3 has about 55 partners, almost all of them unrelated membrane
      proteins (PMP22, MAL, BSCL2, CNIH1/3, EMP1/3, claudins, tetraspanins, ATP6V0C, SLC transporters,
      C-type lectins). This broad pattern is what a single hydrophobic transmembrane helix typically produces
      in yeast two-hybrid assays, and none of the pairs has been followed up with a functional readout.
      Removal does not imply that the reported interaction is false.
    supported_by:
    - *id003
