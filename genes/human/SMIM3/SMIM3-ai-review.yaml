      row. Partners are mostly unrelated membrane proteins.
- id: PMID:11288140
  title: NID67, a small putative membrane protein, is preferentially induced by NGF in PC12 pheochromocytoma
    cells.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original cloning paper (rat PC12). Abstract only in cache. Establishes induction by
      NGF/FGF, tissue distribution, 60-aa ORF translated in vitro; channel-regulator role is a speculation
      from similarity.
- id: PMID:36550462
  title: Downregulation of SMIM3 inhibits growth of leukemia via PI3K-AKT signaling pathway and correlates
    with prognosis of adult acute myeloid leukemia with normal karyotype.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: LOW_QUALITY
    review_notes: Only functional study of SMIM3. Expression/prognosis correlation plus shRNA knockdown
      in two AML lines with reduced p-PI3K/p-AKT; no rescue, single knockdown approach, no mechanism linking
      a membrane peptide to PI3K. Not sufficient for a GO process annotation.
- id: PMID:19966810
  title: A p53-dependent mechanism underlies macrocytic anemia in a mouse model of human 5q- syndrome.
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Nid67 is only a boundary marker of the engineered Cd74-Nid67 deletion; phenotype attributed
      to Rps14/p53, not to Nid67.
