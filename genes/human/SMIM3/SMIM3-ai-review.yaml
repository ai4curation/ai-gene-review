  title: UniProtKB entry Q9BZL3 (SMIM3_HUMAN), Small integral membrane protein 3
  findings: []
aliases:
- NID67
- C5orf62
core_functions:
- description: No molecular activity or biological process is known for SMIM3. This entry records only
    that it is a predicted single-pass membrane protein and asserts no function.
  locations:
  - id: GO:0016020
    label: membrane
  supported_by:
  - reference_id: UniProt:Q9BZL3
    supporting_text: 'SUBCELLULAR LOCATION: Membrane'
suggested_questions:
- question: Which membrane does endogenous SMIM3 occupy (plasma membrane, ER, Golgi), and what is its
    topology? No localization experiment with endogenous or tagged protein has been reported.
- question: Does SMIM3 modulate any ion channel or pump, as proposed by analogy to other single-helix
    membrane regulators (e.g. FXYD proteins, regulins)? Among the ~55 interactome partners, are any (e.g.
    ATP1B4, ATP6V0C, PMP22) reproducible in membranes by co-immunoprecipitation or proximity labelling?
- question: Is the reduced proliferation of AML cells after SMIM3 knockdown reproducible with independent
    guides or CRISPR knockout and rescued by an shRNA-resistant cDNA?
suggested_experiments:
- hypothesis: SMIM3 is an NGF-inducible single-pass membrane protein that associates with and regulates
    a specific membrane transporter or channel.
  description: Tag endogenous SMIM3 in a neuronal or adrenal cell line, determine its compartment by imaging,
    identify partners by proximity labelling (e.g. TurboID) with a membrane-protein control, and test
    candidate channel or pump activity electrophysiologically or by flux assays with and without SMIM3.
  experiment_type: proximity labelling and functional assay
