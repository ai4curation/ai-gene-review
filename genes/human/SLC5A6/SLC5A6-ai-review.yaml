core_functions:
- description: Electrogenic, Na(+)-coupled import of the water-soluble vitamins biotin
    (vitamin B7) and pantothenate (vitamin B5) and the cofactor (R)-lipoate across the
    plasma membrane, with a 2 Na(+) per substrate stoichiometry driven by the inward
    electrochemical Na(+) gradient. The transporter is polyspecific (the three organic
    substrates compete for a shared pathway) and is concentrated at the apical/brush-border
    membrane of absorptive epithelia (intestine, renal proximal tubule) and the luminal
    membrane of brain capillary endothelium, where it provides cells and the brain with
    these essential micronutrients.
  molecular_function:
    id: GO:0008523
    label: sodium-dependent multivitamin transmembrane transporter activity
