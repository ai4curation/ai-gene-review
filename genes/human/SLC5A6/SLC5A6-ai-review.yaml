suggested_questions:
- question: What is the physiological significance, if any, of SMVT-mediated iodide
    transport, given that NIS/SLC5A5 is the dedicated thyroidal and intestinal iodide
    symporter and SMVT is perchlorate-insensitive?
- question: Does SMVT contribute to the intracellular delivery of other anionic or
    organic substrates beyond biotin, pantothenate, lipoate and iodide, and what
    determines its substrate selectivity at the shared binding site?
suggested_experiments:
- description: Determine a cryo-EM or crystal structure of human SMVT with each of its
    substrates (biotin, pantothenate, R-lipoate, iodide) bound, to define the shared
    substrate-binding site and the Na(+)-coupling mechanism.
- description: Perform tissue-specific conditional knockout of Slc5a6 (intestine,
    blood-brain barrier endothelium) in mouse to dissect the relative contributions of
    SMVT to systemic versus brain vitamin homeostasis and to the multisystem disease
    phenotype.
- description: Quantify endogenous SMVT-mediated iodide flux in physiologically relevant
    epithelia (e.g. intestine) to test whether SMVT contributes measurably to whole-body
    iodide homeostasis in vivo.
