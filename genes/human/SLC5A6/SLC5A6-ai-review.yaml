- term:
    id: GO:0015111
    label: iodide transmembrane transporter activity
  evidence_type: IDA
  original_reference_id: PMID:20980265
  qualifier: enables
  review:
    summary: Electrophysiology in oocytes demonstrates Na(+)-coupled I(-) uptake by
      hSMVT; this iodide transport is inhibited by the organic SMVT substrates but
      not by NIS substrates, and is perchlorate-insensitive.
    action: KEEP_AS_NON_CORE
    reason: Iodide transport is a directly demonstrated, bona fide transport activity
      of this polyspecific symporter (iodide shares the substrate pathway). It is,
      however, not the gene's core evolved function; the dedicated physiological iodide
      symporter is NIS/SLC5A5, and the physiological relevance of SMVT-mediated iodide
      transport is explicitly stated to be unknown. Kept as a genuine secondary
      activity rather than a core function.
    supported_by:
    - reference_id: PMID:20980265
      supporting_text: Here, we describe Na(+)-coupled I(-) uptake by the human
        Na(+)/multivitamin transporter (hSMVT)
    - reference_id: PMID:35013551
      supporting_text: SMVT's role in iodide transport and homeostasis is unknown up
        to date
