- term:
    id: GO:0006768
    label: biotin metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q5U4D8
  - ensembl:ENSMUSP00000110316
  review:
    summary: Ortholog-based electronic transfer of biotin metabolic process to SMVT.
    action: MARK_AS_OVER_ANNOTATED
    reason: SMVT transports biotin across the membrane but does not catalyse any step
      of biotin biosynthesis or catabolism; transport (a localization process) is not
      metabolism. The gene makes biotin available to the cell, while the biotin-dependent
      chemistry is performed by downstream enzymes (e.g. holocarboxylase synthetase,
      biotinidase, the biotin-dependent carboxylases). This is an over-broad electronic
      annotation; the specific, correct process terms (biotin transport, biotin import
      across plasma membrane) are already present.
    supported_by:
    - reference_id: file:human/SLC5A6/SLC5A6-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Sodium-dependent multivitamin transporter that mediates the
        electrogenic transport of pantothenate, biotin, lipoate and iodide
