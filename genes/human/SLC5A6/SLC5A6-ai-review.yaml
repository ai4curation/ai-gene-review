- term:
    id: GO:0016323
    label: basolateral plasma membrane
  evidence_type: ISS
  original_reference_id: PMID:25809983
  qualifier: located_in
  supporting_entities:
  - UniProtKB:A0A287BEL5
  review:
    summary: Sequence-similarity-based assignment of basolateral plasma-membrane
      localization.
    action: MARK_AS_OVER_ANNOTATED
    reason: The native, functionally relevant localization of SMVT is apical/brush-border
      (intestine, kidney) or luminal (brain endothelium). Basolateral localization is
      what results when the C-terminal apical-targeting determinant is disrupted
      (deletion of residues 616-635 redirects the transporter basolaterally), i.e. it is
      a mistargeting phenotype rather than the wild-type location. The directly studied
      reference (PMID:25809983) places human SMVT at the luminal membrane, not the
      basolateral membrane. The basolateral claim overstates the localization.
    supported_by:
    - reference_id: PMID:25809983
      supporting_text: SLC5A6 was preferentially localized at the luminal membrane of
        brain capillary endothelium
