id: Q9Y289
gene_symbol: SLC5A6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: SLC5A6 encodes the sodium-dependent multivitamin transporter (SMVT;
  hSMVT), a polytopic plasma-membrane protein of the sodium:solute symporter (SSF/SLC5,
  TC 2.A.21) family with 12-13 transmembrane helices. It catalyses electrogenic,
  Na(+)-coupled import of the water-soluble vitamins biotin (vitamin B7) and
  pantothenate (vitamin B5) and the essential cofactor (R)-lipoate (alpha-lipoic
  acid), co-transporting approximately two Na(+) ions per substrate molecule down
  the electrochemical Na(+) gradient; it can also transport iodide. The protein is
  broadly expressed and is concentrated at the apical/brush-border membrane of
  absorptive epithelia (intestine, renal proximal tubule) and at the luminal membrane
  of brain capillary endothelium, where it mediates vitamin uptake from the gut lumen
  and transport across the blood-brain barrier. Biallelic loss-of-function variants
  cause an autosomal-recessive multisystem metabolic disorder (SMVT deficiency;
  childhood-onset biotin-responsive peripheral motor neuropathy) with
  neurodegeneration, developmental delay, and immune, bone and intestinal dysfunction
  that is partially responsive to supplementation with biotin, pantothenate and
  lipoate.
