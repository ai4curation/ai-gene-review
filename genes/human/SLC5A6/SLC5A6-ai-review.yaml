  review:
    summary: Yeast two-hybrid, GST-pulldown and co-IP identify the PDZ-domain adapter
      PDZD11 (Q5EBL8) as an interacting partner that binds the SMVT C-terminal PDZ
      motif and promotes SMVT membrane expression and biotin uptake.
    action: REMOVE
    reason: Bare protein binding (GO:0005515) is uninformative about molecular function
      and is removed per the protein-binding policy. The PDZD11 interaction is real
      and functionally relevant (it regulates SMVT cell-surface expression) but the
      generic term adds no functional information, and the evidence supports a
      regulatory/trafficking partnership rather than a distinct SMVT molecular
      activity. Removal does not imply the interaction is false.
