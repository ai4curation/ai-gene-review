- id: PMID:20479219
  title: Ancient origin of the integrin-mediated adhesion and signaling machinery.
  findings:
  - statement: Talin, vinculin, paxillin and alpha-actinin are found across unikonts (opisthokonts plus
      amoebozoans), predating animals; they were later co-opted into the integrin adhesome.
    supporting_text: Many of the scaffolding proteins (talin, vinculin, paxillin) most likely evolved
      in the common ancestor of amoebozoans and opisthokonts, where they had ancestrally different functions
- id: PMID:29880641
  title: Analysis of a vinculin homolog in a sponge (phylum Porifera) reveals that vertebrate-like cell
    adhesions emerged early in animal evolution.
  findings:
  - statement: A sponge talin vinculin-binding-site peptide binds sponge vinculin and activates its F-actin
      binding.
    supporting_text: In the presence of Op talin peptide, full-length Op vinculin bound to F-actin filaments
- id: PMID:32857975
  title: Integrin-Mediated Adhesion in the Unicellular Holozoan Capsaspora owczarzaki.
  findings:
  - statement: Integrin beta2 and vinculin localize to adhesive filopodia of Capsaspora; talin itself
      was not examined in the abstract.
    supporting_text: We show that integrin β2 and its associated protein vinculin localize as distinct
      patches in the filopodia.
core_functions:
- description: Cytoskeletal adaptor linking integrin beta tails and the plasma membrane (FERM head) to
    actin filaments (rod and I/LWEQ domain) at focal adhesions; required for assembly of integrin-matrix
    adhesions.
  molecular_function:
    id: GO:0008093
    label: cytoskeletal adaptor activity
  directly_involved_in:
