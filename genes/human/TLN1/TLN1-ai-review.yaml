- term:
    id: GO:0005200
    label: structural constituent of cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR015224
  review:
    summary: InterPro mapping from the talin central domain (IPR015224) to structural constituent of cytoskeleton.
    action: MODIFY
    reason: Talin is not a polymer-forming structural subunit of the cytoskeleton. It is a large adaptor
      that links integrin tails and membrane lipids (FERM head) to actin filaments and vinculin (rod),
      i.e. it brings a cytoskeletal polymer together with membrane receptors. Cytoskeletal adaptor activity
      describes this better.
    proposed_replacement_terms:
    - id: GO:0008093
      label: cytoskeletal adaptor activity
    supported_by:
    - *id001
    - &id005
      reference_id: PMID:15494027
      supporting_text: The cytoskeletal proteins talin and vinculin form part of a macromolecular complex
        on the cytoplasmic face of integrin-mediated cellular junctions with the extracellular matrix.
