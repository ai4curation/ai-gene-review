- description: 'Integrin binding and activation: the FERM head (F3 PTB-like subdomain) binds the NPxY
    motif of integrin beta cytoplasmic tails, enhanced by PI(4,5)P2, driving inside-out integrin activation
    (e.g. alphaIIb beta3 in platelets). Ancestral potential: the NPxY motif is conserved in Capsaspora
    integrin beta subunits, and Dictyostelium talin binds an NPxY motif in a non-integrin receptor.'
  molecular_function:
    id: GO:0005178
    label: integrin binding
