id: Q9Y490
gene_symbol: TLN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Talin-1 is a large (about 270 kDa) cytoplasmic adaptor protein that links integrin adhesion
  receptors to the actin cytoskeleton. Its N-terminal FERM head binds the membrane-proximal NPxY motif
  of integrin beta cytoplasmic tails and acidic phospholipids, notably PI(4,5)P2; head binding to the
  integrin tail, together with kindlins, is a final step of inside-out integrin activation. The long rod
  of helical bundles carries cryptic vinculin-binding sites that are exposed under mechanical force and
  recruit and activate vinculin, and the rod and C-terminal I/LWEQ domain bind actin filaments, so talin
  acts as a mechanosensitive scaffold at focal adhesions. Talin-1 is widely expressed, is concentrated
  at focal adhesions and membrane ruffles, and keeps an autoinhibited cytosolic pool. It is required for
  assembly of integrin-matrix adhesions and, in platelets and leukocytes, for integrin activation underlying
  platelet aggregation and immune cell adhesion. Talin is older than animals: homologs are present in
  amoebozoans and in unicellular holozoans such as Capsaspora, whose integrin beta tails retain the NPxY
  motif, and a sponge talin vinculin-binding peptide activates sponge vinculin, so the integrin-talin-vinculin
  link was in place in the earliest animals.'
