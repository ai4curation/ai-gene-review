- description: 'Vinculin binding and activation: rod vinculin-binding sites bind the vinculin head, displace
    the vinculin tail and activate vinculin F-actin binding, reinforcing the integrin-actin link. Conserved
    in sponges, where a talin VBS peptide activates sponge vinculin.'
