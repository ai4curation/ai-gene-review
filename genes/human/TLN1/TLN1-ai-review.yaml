suggested_questions:
- question: Talin is common to amoebozoans and opisthokonts, where it predates integrins in some lineages.
    Does Capsaspora talin bind the NPxY motif of Capsaspora integrin beta2 and localize with integrin
    beta2 and vinculin in adhesive filopodia, i.e. was talin already an integrin adaptor before animals?
- question: Which talin activities are ancestral (actin binding, membrane/phosphoinositide binding, NPxY-tail
    binding) and which arose with the animal integrin adhesome (force-dependent cryptic vinculin-binding
    sites, KANK-mediated microtubule targeting)?
- question: Should the talin-family IBA for cell-cell adhesion (PTN000463398) be restricted to lineages
    with integrin-mediated cell-cell adhesion, given that talin core function is cell-matrix adhesion?
suggested_experiments:
- experiment_type: Cross-species binding assay
  description: Express the Capsaspora talin FERM head and test binding to Capsaspora integrin beta1-3
    cytoplasmic tails (wild type and NPxY mutants) and to PI(4,5)P2 liposomes; test whether Capsaspora
    talin VBS peptides activate Capsaspora vinculin F-actin binding.
- experiment_type: Genetic complementation
  description: Rescue talin-1/talin-2 double-knockout mammalian cells with talins from sponge, Capsaspora
    and Dictyostelium and measure integrin activation, focal adhesion assembly and spreading on fibronectin.
