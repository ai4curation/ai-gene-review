  review:
    summary: 'Proposed: talin participates in integrin-mediated adhesion of cells to the extracellular
      matrix.'
    action: NEW
    reason: 'Talin does the work of cell-matrix adhesion: it binds integrin beta tails, activates integrins
      and physically links them to actin, and is essential for assembling junctions with the extracellular
      matrix. Comparator check: cytoplasmic integrin partners ITGB1BP1, LIMS1 and PPFIA2 carry this term
      in human GOA, so the term is used for intracellular participants. The existing annotations carry
      only cell adhesion and cell-cell adhesion.'
