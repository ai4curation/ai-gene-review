id: Q5TC82
gene_symbol: RC3H1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: Roquin-1 is a cytoplasmic RING- and CCCH-zinc-finger RNA-binding protein that recognizes stem-loop constitutive decay elements in target mRNA 3-prime UTRs through its ROQ domain and recruits CCR4-NOT deadenylase machinery to destabilize those transcripts. It also has RING-type ubiquitin protein ligase activity and helps tune inflammatory and lymphocyte programs by controlling the stability of immune-regulatory mRNAs and miR-146a.
alternative_products:
- name: '1'
  id: Q5TC82-1
- name: '2'
  id: Q5TC82-2
  sequence_note: VSP_015015, VSP_015016
existing_annotations:
- term:
    id: GO:0000184
    label: nuclear-transcribed mRNA catabolic process, nonsense-mediated decay
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q4VGL6
  review:
    summary: Remove the nonsense-mediated decay transfer.
    action: REMOVE
    reason: Roquin proteins promote CDE/stem-loop 3-prime UTR decay through CCR4-NOT recruitment; the available human evidence does not place RC3H1 in nonsense-mediated decay.
    supported_by:
    - &id002
      reference_id: PMID:25026078
      supporting_text: A conserved stem-loop motif of the constitutive decay element (CDE) in the 3' UTR of mRNAs is recognized by the ROQ domain of Roquin, which mediates mRNA degradation.
    - &id003
      reference_id: PMID:28165457
      supporting_text: Human (Hs) Roquin1 and Roquin2 are RNA-binding proteins that promote mRNA target degradation through the recruitment of the CCR4-NOT deadenylase complex
