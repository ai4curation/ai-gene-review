    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:12007189
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q16385
  review:
    summary: Generic protein binding (IPI, PMID:12007189) with SSX2.
    action: REMOVE
    reason: RAB3IP was identified as an SSX2 interactor by yeast two-hybrid and GST pull-down; the interaction
      relocates RAB3IP to the nucleus only upon co-expression, and no physiological role has been established.
      Bare 'protein binding' is uninformative. Removal does not mean the interaction is false.
    supported_by:
    - reference_id: PMID:12007189
      supporting_text: coexpression of both RAB3IP and SSX2 led to colocalization of both proteins in
        the nucleus
