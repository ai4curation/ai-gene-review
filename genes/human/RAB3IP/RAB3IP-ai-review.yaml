  review:
    summary: Generic protein binding (IPI, PMID:21273506) with TRAPPC6A.
    action: REMOVE
    reason: TRAPPC6A is a subunit of the TRAPPII complex, which binds the Rabin8 N-terminal domain (via
      TRAPPC14) and is required for Rabin8 preciliary targeting to the centrosome. This interaction is
      functionally important, but 'protein binding' carries no functional information and no specific
      MF term describes it; the biology is captured by the cilium assembly and vesicle annotations. Removal
      does not mean the interaction is false.
