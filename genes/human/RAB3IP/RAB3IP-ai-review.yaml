suggested_questions:
- question: Does RAB3IP act only after EHD1/EHD3-dependent ciliary vesicle assembly (as Rab8 activation
    timing suggests), or is a pool of Rabin8 already required for distal appendage vesicle delivery?
- question: What is the physiological significance of the nucleoplasmic RAB3IP signal reported by HPA,
    given that RAB3IP enters the nucleus in transfected cells only upon SSX2 co-expression?
- question: How redundant are RAB3IP and its paralog RAB3IL1 (GRAB) as RAB8 GEFs in ciliogenesis in vivo?
suggested_experiments:
- description: RAB3IP knockout RPE1 cells imaged by correlative light/electron microscopy during serum
    starvation to determine whether distal appendage vesicles and the ciliary vesicle form normally and
    which step of ciliary membrane growth fails; rescue with GEF-dead (catalytic interface) and RAB11-binding-deficient
    mutants.
  experiment_type: knockout, CLEM and rescue
- description: RAB3IP/RAB3IL1 double knockout to test GEF redundancy for RAB8A activation (RAB8-GTP pulldown)
    and ciliogenesis.
  experiment_type: genetic interaction
