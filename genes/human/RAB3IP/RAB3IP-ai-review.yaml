  review:
    summary: Generic protein binding (IPI, PMID:27173435) with RAB8A.
    action: MODIFY
    reason: RAB8A is the substrate of the Rabin8 GEF; the interaction (structurally characterized, and
      used in kinetic GEF assays) is the physical basis of RAB3IP's core activity. 'Protein binding' is
      uninformative; the interaction is better expressed as small GTPase binding, with the catalytic consequence
      captured by the accepted guanyl-nucleotide exchange factor activity annotation.
