id: Q96QF0
gene_symbol: RAB3IP
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: RAB3IP (Rabin8) is a coiled-coil Sec2-family guanine nucleotide exchange factor that specifically
  activates RAB8A and RAB8B. It is a cytosolic protein recruited to RAB11-positive, phosphatidylserine-containing
  vesicles through binding to RAB11-GTP (an effector interaction that also stimulates its exchange activity)
  and to the TRAPPII complex via TRAPPC14. At the onset of ciliogenesis these vesicles carry Rabin8 to
  the mother centriole, where NDR2-dependent phosphorylation switches Rabin8 from phosphatidylserine to
  the exocyst subunit SEC15 and RAB8A is activated to drive ciliary membrane growth; Rabin8 also contacts
  the BBSome at the basal body. Outside cilia, Rabin8-mediated RAB8 activation supports polarized membrane
  traffic to the cell cortex and actin-rich protrusions. The catalytic activity of Rabin8 is sufficient
  to determine where RAB8A is targeted on membranes.
