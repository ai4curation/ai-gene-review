    label: ciliary transition zone assembly
  evidence_type: TAS
  original_reference_id: Reactome:R-HSA-5620912
  qualifier: involved_in
  review:
    summary: Ciliary transition zone assembly (Reactome TAS, R-HSA-5620912 'Anchoring of the basal body
      to the plasma membrane'; automatic replacement of the obsoleted GO:0097711).
    action: MARK_AS_OVER_ANNOTATED
    reason: This row is the mechanical replacement for the obsoleted 'ciliary basal body-plasma membrane
      docking' term, and Reactome has since revised the underlying RAB3IP entry. RAB3IP acts upstream,
      activating RAB8A on preciliary vesicles to supply and extend the ciliary membrane; the transition-zone
      structure is assembled by TZ components (CEP290, MKS and NPHP modules). EHD1-dependent ciliary vesicle
      formation, not Rab8 activation, is the step linked to TZ protein recruitment, and Rab8 activation
      occurs only after ciliary vesicle assembly. RAB3IP is therefore better described by cilium assembly
      than by transition zone assembly.
    supported_by:
    - reference_id: PMID:25686250
      supporting_text: only after ciliary vesicle assembly is Rab8 activated for ciliary growth
    - reference_id: PMID:25686250
