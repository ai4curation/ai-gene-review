  review:
    summary: Guanyl-nucleotide exchange factor activity (IBA, IDA, IEA, Reactome TAS).
    action: ACCEPT
    reason: 'Rabin8/RAB3IP is the Sec2-family GEF for RAB8A/RAB8B: purified Rabin8 stimulates nucleotide
      exchange on Rab8 but not Rab3A, Rab5 or Rab10, its activity is stimulated by Rab11-GTP, and a Rabin8-RAB8A
      co-crystal structure exists. GO:0005085 is now the term for Rab GEF activity (GO:0017112 was merged
      into it). This is the core molecular function.'
