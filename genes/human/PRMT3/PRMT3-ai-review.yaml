description: 'PRMT3 encodes a cytosolic C2H2-zinc-finger type-I protein arginine methyltransferase whose
  principal characterized in vivo substrate is the small-ribosomal-subunit protein RPS2; a ZNF200-dependent
  nuclear pool can also methylate H4R3, and a methyltransferase-independent interaction with ALDH1A1 links
  PRMT3 to retinoic-acid signaling.'
