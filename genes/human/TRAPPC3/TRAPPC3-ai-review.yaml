- term:
    id: GO:0070971
    label: endoplasmic reticulum exit site
  evidence_type: IC
  original_reference_id: PMID:16880271
  qualifier: located_in
  review:
    summary: >-
      NEW (ORGANELLES, 2026-11-06). The ER pool of TRAPPC3/Bet3 sits at ER exit
      sites (transitional ER), where TRAPP tethers COPII vesicles; this
      sub-compartment is added beside the root ER row, which is kept.
    action: NEW
    reason: >-
      Two independent lines agree. (1) Localization: endogenous mammalian mBet3p
      overlaps the COPII marker Sec31p, its localization is BFA-resistant and
      clusters with ER exit sites under Sar1p H79G, and immuno-EM places it on
      Sec31p-labelled transitional ER at 7.6-22-fold higher density than over
      the rest of the ER (PMID:16880271, NRK and BSC-1 cells; the antibody is to
      mammalian Bet3, so this is ortholog-level for human TRAPPC3, which is why
      the row is IC). (2) Mechanism: TRAPPC3 is the subunit that recruits TRAPP
      to ER-derived COPII vesicles by binding the coat protein SEC23
      (Reactome:R-HSA-5694439), a function that only makes sense at the ER exit
      site; comparator COPII components (SEC23A, SEC31A, SAR1A) carry
      GO:0070971 in GOA. TRAPPC3 is peripheral (most of it is cytosolic,
      PMID:15728249), so neither ER membrane nor ER lumen is asserted.
      core_functions is left unchanged (rule 6).
    supported_by:
    - reference_id: PMID:16880271
      supporting_text: Unlike Man II and GM130, mBet3p always clustered with the ER
        exit sites
    - reference_id: PMID:16880271
      supporting_text: The observed localization of mBet3p to the tER was significant,
        as quantitation revealed that the labeling density of mBet3p at the tER was
        7.6–22 times higher than the labeling density of mBet3p over the ER and other
        organelles
    - *id005
    - reference_id: PMID:15728249
      supporting_text: In contrast to yeast Bet3p, the majority of Bet3 is present in
        the cytosol.
