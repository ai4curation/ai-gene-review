- term:
    id: GO:0005783
    label: endoplasmic reticulum
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: TRAPPC3 participates in ER-derived vesicle trafficking and is mapped to the
      endoplasmic reticulum.
    action: ACCEPT
    reason: >-
      Accept as a supported location for ER-to-Golgi trafficking. ORGANELLES check
      (2026-11-06): the IEA comes from the UniProt location "Endoplasmic reticulum
      {ECO:0000250}", a by-similarity line, but the claim holds on mammalian
      evidence. Endogenous mBet3p (TRAPPC3) was immunolocalized with the COPII
      marker Sec31p, clustered with ER exit sites under Sar1p H79G, and by
      immuno-EM was concentrated 7.6-22-fold on Sec31p-labelled transitional ER
      over other ER (PMID:16880271); the TRAPPC12 paper summarises that TRAPPC3
      localizes to the transitional ER (PMID:21525244). Most Bet3 is cytosolic
      (PMID:15728249), so the ER pool is a recruited membrane-bound pool on the
      cytosolic face, not a membrane or lumen resident, and no ER membrane or lumen
      row is added. The ER exit site, where the COPII-vesicle tethering function is
      exercised, is added as a NEW row (GO:0070971). Kept ACCEPT because the
      core tethering/RAB1 GEF function is exercised there.
    additional_reference_ids:
    - PMID:18930054
    - Reactome:R-HSA-5694439
    - PMID:16880271
    - PMID:21525244
    - PMID:15728249
    supported_by:
    - *id004
    - *id005
    - reference_id: PMID:16880271
      supporting_text: Immuno-EM in NRK cells confirmed that mBet3p (5-nm gold particles)
        resides on the tER region labeled with Sec31p (10-nm gold particles).
    - reference_id: PMID:21525244
      supporting_text: C3, a core component of the complex, localizes to the transitional
        ER
