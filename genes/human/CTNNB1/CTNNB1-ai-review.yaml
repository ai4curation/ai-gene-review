  review:
    summary: 'protein polyubiquitination: the specific source assignment is contradicted or
      assigns the wrong performed role.'
    action: REMOVE
    reason: 'The actual publisher-indexed Results and Figure5 identify beta-catenin as the
      ubiquitinated substrate: FOXF2 raises IRF2BPL expression, and IRF2BPL perturbation changes
      beta-catenin ubiquitination and turnover in gastric-cancer cells. These experiments
      do not show beta-catenin performing ubiquitin-chain addition, the activity described
      by GO:0000209. Retain the original experimental source assertion and its provenance
      while rejecting this process assignment; this does not dispute the observed beta-catenin
      modification.'
