  review:
    summary: 'chromatin binding (GO:0003682; IEA; GO_REF:0000107): Chromatin binding.'
    action: MARK_AS_OVER_ANNOTATED
    reason: Beta-catenin has no DNA- or chromatin-binding domain; it reaches chromatin only through 
      DNA-binding partners such as TCF/LEF. Its activity there is captured by transcription 
