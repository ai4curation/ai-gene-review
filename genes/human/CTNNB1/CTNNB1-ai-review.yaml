    reason: PMID:30097457 directly supports FLYWCH1 binding to beta-catenin and inhibition
      of beta-catenin/TCF-dependent transcription, including recombinant binding, competition
      and reporter assays. The current GO:0001222 definition additionally specifies a corepressor
      that mediates interactions with basal transcription machinery. That partner-class mechanism
