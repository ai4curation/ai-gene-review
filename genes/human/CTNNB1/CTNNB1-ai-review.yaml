  - reference_id: PMID:17052462
    supporting_text: Stimulation of the Wnt pathway leads to the association of beta-catenin with 
      Tcf and BCL9 in the nucleus
- description: Binding of the cytoplasmic domain of classical cadherins at adherens junctions. 
    Beta-catenin is required for cadherin-mediated cell-cell adhesion and for stabilizing cadherin 
    at the cell surface. In sponges the beta-catenin residues needed for cadherin binding are 
    conserved, so this function was present in the last common ancestor of animals.
