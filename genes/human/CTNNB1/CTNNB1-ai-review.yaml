      alpha-catenin which mediates its interaction with beta-catenin and plakoglobin
  - reference_id: PMID:21393547
    supporting_text: Although D. discoideum lacks a cadherin homolog, we identify an α-catenin 
      ortholog that binds a β-catenin-related protein
suggested_questions:
- question: Is Dictyostelium Aardvark (Q54I71) a divergent beta-catenin ortholog or a different 
    armadillo protein? PANTHER places it in PTHR22895 (ARMADILLO REPEAT-CONTAINING PROTEIN 6), not 
    in the beta-catenin family PTHR45976. A phylogeny of ARM-repeat catenins would show whether the 
    alpha-/beta-catenin junction module is shared by descent with animals or arose convergently in 
    social amoebae.
- question: No beta-catenin-family protein is classified in choanoflagellates, Capsaspora or 
    ichthyosporeans, yet choanoflagellates have alpha-catenin-family (VIN) proteins and many 
    cadherins. Do unicellular holozoans use another ARM protein to bind alpha-catenin or cadherin 
    tails? Or did the catenin module seen in Dictyostelium become lost and then reassemble around 
    beta-catenin in animals?
- question: Sponge (Oscarella) vinculin did not bind a beta-catenin peptide, while the human VCL 
    review records a beta-catenin binding IBA with a Dictyostelium donor. Does the Dictyostelium 
    alpha-catenin-Aardvark interaction justify placing beta-catenin binding at the root of the 
    vinculin/alpha-catenin family, or should that IBD sit on the alpha-catenin clade?
- question: Many GOA rows attach Wnt-dependent developmental and tissue-level processes to 
    beta-catenin. Which of these reflect beta-catenin as a structural participant (adhesion, 
    junction assembly) and which are downstream outputs of its target genes that would be better 
    captured through the TCF/LEF targets themselves?
suggested_experiments:
- hypothesis: The junctional and the transcriptional functions of beta-catenin use separable 
    surfaces, and only the junctional/alpha-catenin-binding function is shared with Dictyostelium 
    Aardvark.
  description: Express Aardvark, or chimeras of Aardvark with beta-catenin, in CTNNB1-null human 
    epithelial cells. Score rescue of E-cadherin surface levels and junction assembly separately 
    from TOPflash/TCF reporter activity. In parallel, measure binding of Aardvark to human 
    alpha-catenin, E-cadherin tail and TCF7L2 in vitro.
  experiment_type: cross-species complementation / binding assays
- hypothesis: Sponge beta-catenin binds both its classical cadherin and TCF, so the dual role was 
    present in the animal common ancestor.
  description: Purify Oscarella beta-catenin and test direct binding to the OcCdh1 cytoplasmic 
    domain, Oscarella alpha-catenin and Oscarella TCF. Test transactivation by Oscarella 
    beta-catenin with Oscarella TCF in a heterologous reporter assay.
  experiment_type: in vitro binding / reporter assay
