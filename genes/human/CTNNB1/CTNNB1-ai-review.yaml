id: P35222
gene_symbol: CTNNB1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'CTNNB1 (beta-catenin) is a 781-residue armadillo-repeat protein with two cellular roles:
  it is a structural component of cadherin-based adherens junctions and the nuclear effector of canonical
  Wnt signaling. At junctions, the groove formed by its twelve armadillo repeats binds the cytoplasmic
  catenin-binding domain of classical cadherins (E-, N- and VE-cadherin), and its N-terminal region binds
  alpha-catenin, which links the cadherin-catenin complex to the actin cytoskeleton. Beta-catenin is needed
  for cadherin-mediated cell-cell adhesion and for stable cadherin at the cell surface. A separate cytoplasmic
  pool is kept low by the destruction complex: APC and Axin present beta-catenin to CK1 and GSK3B, which
  phosphorylate its N-terminal degron, and SCF(beta-TrCP) then ubiquitinates it for proteasomal degradation.
  Wnt signaling inhibits this complex, so beta-catenin accumulates and enters the nucleus. There it has
  no DNA-binding domain of its own; it binds TCF/LEF transcription factors through the armadillo groove
  and recruits coactivators (BCL9-Pygopus, CBP/p300, TBL1-TBLR1, the PAF1 complex) to activate Wnt target
  genes. It also coactivates nuclear receptors (AR, LRH-1) and FOXO factors. A C-terminal PDZ-binding
  motif binds PDZ-domain scaffolds, and a centrosomal pool, phosphorylated by NEK2, contributes to centrosome
  cohesion. Through its target genes, beta-catenin controls axis formation, cell fate, proliferation and
  stem cell maintenance in animal development and tissue homeostasis. Stabilizing mutations in its degron,
  or loss of APC, drive colorectal and other cancers. The beta-catenin family and its Wnt and TCF/LEF
  partners are found only in animals, and classical cadherins also arose with animals. However, the social
  amoeba Dictyostelium, which has no cadherins and no Wnt pathway, uses an armadillo-repeat beta-catenin-related
  protein (Aardvark) together with an alpha-catenin ortholog to build a polarized epithelium. A catenin-based
  junction and polarity module is therefore older than animals, whereas TCF/LEF-dependent transcriptional
  coactivation and classical-cadherin binding appear to be animal innovations.'
