primary_scope_limits:
- reference: PMID:10868478
  url: https://pubmed.ncbi.nlm.nih.gov/10868478/
  repository_cache: publications/PMID_10868478.md
  scope: Original protein-analysis Methods, target Results/Discussion and Figure 5 caption
    support catenin abundance changes after indole-3-carbinol in human breast-cell lines.
    A proposed joint adhesion mechanism does not isolate beta-catenin participation in the
    response; the positive expression result is preserved.
- reference: PMID:11713476
  url: https://pubmed.ncbi.nlm.nih.gov/11713476/
  repository_cache: publications/PMID_11713476.md
  scope: Recovered original Methods/Results establish human TCF7L2 residues 8–54 and beta-catenin
    residues 134–668 coexpressed in bacteria, with 293-cell OT/OF reporter tests. These constructs
    do not establish every historical TCF4 accession.
- reference: PMID:11751639
  url: https://pubmed.ncbi.nlm.nih.gov/11751639/
  repository_cache: publications/PMID_11751639.md
  scope: Selected original Methods/Results establish LEF-dependent cooperative chromatin association
    and transcriptional coactivation. ICAT can inhibit transcription without displacing the
    occupied LEF–beta-catenin chromatin complex at the tested doses; simple competitive displacement
    is not universal.
- reference: PMID:12370829
  url: https://pubmed.ncbi.nlm.nih.gov/12370829/
  repository_cache: publications/PMID_12370829.md
  scope: Original Figure 3B, Results and Methods distinguish positive DEP1 substrate trapping
    from negative CD45 D/A lanes. GST catalytic-domain constructs and HUVEC lysates contradict
    the specific positive CD45 record; no universal cellular nonbinding claim is made.
- reference: PMID:16574648
  url: https://pubmed.ncbi.nlm.nih.gov/16574648/
  repository_cache: publications/PMID_16574648.md
  scope: Recovered original text supports PTPRU association with beta-catenin. Its active-phosphatase
    interpretation is disputed by the direct later PTPRU pseudophosphatase study PMID:32591542;
    preserve positive binding separately from catalytic class.
- reference: PMID:18291362
  url: https://pubmed.ncbi.nlm.nih.gov/18291362/
  repository_cache: publications/PMID_18291362.md
  scope: The abstract and accessible Discussion report beta-catenin abundance, TCF activity
    and target changes after sulindac. The cache lacks operative Methods/Results despite its
    full-text flag, leaving the specific performed drug-response contribution unresolved.
- reference: PMID:19996314
  url: https://pubmed.ncbi.nlm.nih.gov/19996314/
  repository_cache: publications/PMID_19996314.md
  scope: Selected original HMEC-1 and HEK293 Methods/Results establish contact-dependent TRPC4
    association, targeting and calcium-entry effects. Mouse channel constructs and human host
    cells are distinct; additional bridging scaffolds remain possible.
- reference: PMID:20086044
  url: https://pubmed.ncbi.nlm.nih.gov/20086044/
  repository_cache: publications/PMID_20086044.md
  scope: Indexed original Results/Methods identify mouse beta-catenin M8P, chick vinculin
    and human epithelial cell contexts. The selective vinculin-binding defect and rescue distinguish
    cadherin-surface stabilization from loss of all beta-catenin interactions.
- reference: PMID:20126258
  url: https://pubmed.ncbi.nlm.nih.gov/20126258/
  repository_cache: publications/PMID_20126258.md
  scope: Selected SATB1/beta-catenin Methods and Results retain the reported positive interaction
    and transcriptional context. The subsequent editorial notices were read and must accompany
    interpretation; the source is not represented as retracted or unaffected by concerns.
- reference: PMID:20300119
  url: https://pubmed.ncbi.nlm.nih.gov/20300119/
  repository_cache: publications/PMID_20300119.md
  scope: 'The repository cache contains Abstract/Introduction/Methods but omits Results/Discussion
    despite its true flag. The original main Results/Discussion/Methods were independently
    recovered and read: centrosome distance/cohesion, not centromeric sister-chromatid cohesion,
    is measured.'
- reference: PMID:21724833
  url: https://pubmed.ncbi.nlm.nih.gov/21724833/
  repository_cache: publications/PMID_21724833.md
  scope: The selected cache is incomplete despite its full-text flag. Recovered indexed original
    Methods/Results report p130cas peptide turnover and beta-catenin capture by an E1357A
    trapping domain. That capture is not stable wild-type binding or direct beta-catenin dephosphorylation.
- reference: PMID:22056988
  url: https://pubmed.ncbi.nlm.nih.gov/22056988/
  repository_cache: publications/PMID_22056988.md
  scope: Actual selected Methods/Results establish PKM2 recognition of SRC-phosphorylated
    beta-catenin Y333 and context-specific binding. The publisher correction concerns clinical
    IHC scoring and reversed supplemental axes; it does not retract the inspected binding
    results.
- reference: PMID:23245942
  url: https://pubmed.ncbi.nlm.nih.gov/23245942/
  repository_cache: publications/PMID_23245942.md
  scope: The complete primary abstract explicitly describes phosphorylated beta-catenin bridging
    TAZ to beta-TrCP. The original full paper remains inaccessible after publisher failure;
    this is abstract-supported regulation of another substrate, not a full mechanistic read.
- reference: PMID:24115276
  url: https://pubmed.ncbi.nlm.nih.gov/24115276/
  repository_cache: publications/PMID_24115276.md
  scope: The review presents a receptor-recruitment model; the corresponding inspected primary
    co-IP establishes cytosolic association. Direct beta-catenin membership in the receptor
    signalosome is unresolved.
- reference: PMID:25402006
  url: https://pubmed.ncbi.nlm.nih.gov/25402006/
  repository_cache: publications/PMID_25402006.md
  scope: Literal experimental GST/radiolabel pull-down records support the curated pairs,
    including P15884 in Supplementary Figure 2B/Data File 4. The complete abstract and records
    were read, but original inserts/SI were not; class refinements explicitly defer to the
    experimental curator.
- reference: PMID:28296634
  url: https://pubmed.ncbi.nlm.nih.gov/28296634/
  repository_cache: publications/PMID_28296634.md
  scope: Selected original human-cell BioID, co-IP, reporter and construct Methods/Results
    distinguish Wnt-dependent beta-catenin docking from constitutive BCL9/B9L scaffold associations.
    Proximity is not assigned as direct binary binding.
- reference: PMID:29374064
  url: https://pubmed.ncbi.nlm.nih.gov/29374064/
  repository_cache: publications/PMID_29374064.md
  scope: Recovered indexed original Methods/Results/Discussion and Figure 5 caption identify
    beta-catenin as an IRF2BPL-modified substrate. Turnover is real; the source does not assign
    beta-catenin the ubiquitination or proteolytic step.
- reference: PMID:30097457
  url: https://pubmed.ncbi.nlm.nih.gov/30097457/
  repository_cache: publications/PMID_30097457.md
  scope: Selected original Methods/Results establish FLYWCH1 binding, repression and competition
    with TCF4. Extract-containing EMSA/ChIP does not settle intrinsic DNA binding or the current
    corepressor-class definition; that narrower annotation remains unresolved.
- reference: PMID:30568254
  url: https://pubmed.ncbi.nlm.nih.gov/30568254/
  repository_cache: publications/PMID_30568254.md
  scope: The reviewed expression/localization observations and cited complex-mechanosensing
    literature do not resolve the specific muscle-stretch participation assertion. Original
    cited primary abstracts were read, but operative full papers were not recovered.
- reference: PMID:35271311
  url: https://pubmed.ncbi.nlm.nih.gov/35271311/
  repository_cache: publications/PMID_35271311.md
  scope: The OpenCell publication and endogenous-tagging framework are authenticated, but
    the five specific imported beta-catenin partner rows were not independently resolved in
    the underlying target data. The individual assertions remain uncertain.
- reference: PMID:36115835
  url: https://pubmed.ncbi.nlm.nih.gov/36115835/
  repository_cache: publications/PMID_36115835.md
  scope: Original selected Methods, legend, correction and authentic workbook were inspected.
    The beta-catenin tail has 133 measured DAPF rows and 133 blank entries. Literal interaction
    records, censored assays and positive alternate domains are kept distinct; LNX1 is marginally
    above threshold without reported SD.
- reference: PMID:40205054
  url: https://pubmed.ncbi.nlm.nih.gov/40205054/
  repository_cache: publications/PMID_40205054.md
  scope: The publication identity and framework are authenticated, but the exact beta-catenin
    pair-specific target records were not recovered. Unresolved source-specific interactions
    are not made positive merely by the existence of independent associations elsewhere.
- reference: PMID:10898789
  url: https://pubmed.ncbi.nlm.nih.gov/10898789/
  repository_cache: publications/PMID_10898789.md
  scope: Complete cached Results/Discussion identify ICAT as an inhibitor and beta-catenin
    as its inhibited target. Methods/figure pixels are not claimed as read. This source does
    not establish beta-catenin performing negative Wnt regulation.
- reference: PMID:19340315
  url: https://pubmed.ncbi.nlm.nih.gov/19340315/
  repository_cache: publications/PMID_19340315.md
  scope: Actual Methods/Results/Discussion report negative wild-type HD-PTP/PTPN23 synthetic-substrate
    activity and rescue by S1394A. Later substrate-dependent positive reports are assessed
    separately; no PTPRU analogy substitutes for this evidence.
- reference: PMID:22899650
  url: https://pubmed.ncbi.nlm.nih.gov/22899650/
  repository_cache: publications/PMID_22899650.md
  scope: Selected original evidence supports a cytosolic LRRK2–beta-catenin/destruction-complex
    association; membrane/receptor experiments concern LRRK2. Direct beta-catenin membership
    in the Wnt signalosome remains unresolved.
- reference: PMID:29066500
  url: https://pubmed.ncbi.nlm.nih.gov/29066500/
  repository_cache: publications/PMID_29066500.md
  scope: Selected original Methods/Results report bacterial wild-type PTPN23 domain dephosphorylation
    of immunoprecipitated FYN, unlike C1392S. This supports a disputed partner catalytic class,
    not a demonstrated CTNNB1 substrate reaction.
- reference: PMID:30024850
  url: https://pubmed.ncbi.nlm.nih.gov/30024850/
  repository_cache: publications/PMID_30024850.md
  scope: Independent original reading establishes a force-responsive beta-catenin/cadherin
    interface through mouse-structure simulations and fly FRET/FLIM, force rescue, accessibility
    and FRAP. Application to conserved human Y654 is an explicit inference, not a human or
    muscle experiment.
- reference: PMID:32591542
  url: https://pubmed.ncbi.nlm.nih.gov/32591542/
  repository_cache: publications/PMID_32591542.md
  scope: Genuine later original PTPRU structural/enzymatic evidence establishes pseudophosphatase
    domains for Q92729. This qualifies the older catalytic interpretation without negating
    recovered beta-catenin association.
- reference: PMID:33428810
  url: https://pubmed.ncbi.nlm.nih.gov/33428810/
  repository_cache: publications/PMID_33428810.md
  scope: Selected mouse PTEN/beta-catenin promoter-occupancy passages support a transcriptional
    model, not an independently resolved beta-catenin-specific LTD experiment. The author
    correction changes an IRB approval number only.
inherited_evidence:
  preservation: Relevant repository excerpts and the exact 13,340-byte notes prefix are retained.
    Full old source identities, cache flags and six histories are unchanged.
  scientific_support_corrections:
  - PTPRU catalytic excerpts are not used to prove unrelated phosphatase classes.
  - TCF7L2 excerpts do not prove a distinct P15884 pair.
  - Comparative Dictyostelium evidence remains in inherited notes/reference findings rather
    than being treated as a direct human-core experiment.
  new_quote: One17-word PMID23245942 source anchor is used once; no new quotes are duplicated
    here.
core_function_followup:
  basis: The schema stores one molecular function per core unit. Alpha-catenin binding is
    now an explicit third unit, distinct from cadherin binding; five existing GO:0045294 assertions
    and eleven generic-binding refinements already support the activity.
  support:
  - PMID:7890674
  - PMID:9264463
  access_scope: The two existing source-exact anchors are relocated from the cadherin unit,
    not duplicated. Their complete cached abstracts support direct interaction and domain
    mapping; full experimental construct identities were not recovered. Comparative Dictyostelium
    evidence PMID:21393547 remains in existing reference findings and notes, not presented
    as a direct human-reagent experiment.
  other_changes: Remove one redundant bare PMID:15829978 support item while retaining its
    quoted item and the independent TAZ mechanism. State the LNX1 n=2/no-SD caveat explicitly;
    actions and source assertions stay unchanged.
