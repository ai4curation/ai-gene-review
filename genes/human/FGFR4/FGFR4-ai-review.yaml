- term:
    id: GO:1903412
    label: response to bile acid
  evidence_type: IMP
  original_reference_id: PMID:19085950
  qualifier: involved_in
  negated: true
  review:
    summary: 'NOT annotation: FGFR4 not involved in response to bile acid. In Song et al. 2009 (full text),
      CDCA did not change total FGFR4 protein, but CDCA increased FGFR4 tyrosine phosphorylation and FGFR4
      siRNA blunted FXR-agonist repression of CYP7A1.'
    action: REMOVE
    reason: The only negative result in the paper is that CDCA did not change total FGFR4 protein, which
      is an expression observation and cannot show that FGFR4 lacks a function; a NOT to a 'response
      to' process should not rest on an expression or abundance null. A positive 'response to bile
      acid' annotation would not be right either. The paper states that CDCA is not itself an activator
      of FGFR4; FGFR4 phosphorylation follows bile-acid induction of FGF19 through FXR, so FGFR4 senses
      FGF19, not bile acid. That role is captured by negative regulation of bile acid biosynthetic process
      (GO:0070858). Neither the NOT nor a positive response-to-bile-acid annotation is warranted.
    supported_by:
    - reference_id: PMID:19085950
      supporting_text: CDCA treatment (50 μM) did not alter total FGFR4 protein levels.
    - reference_id: PMID:19085950
      supporting_text: However, an anti-phosphotyrosine antibody detected increased expression of phosphorylated
        FGFR4 in primary human hepatocytes after CDCA treatment for 24 h
    - reference_id: PMID:19085950
      supporting_text: Since CDCA is not an activator of FGFR4, this result suggests that a FXR/FGF19/FGFR4 auto regulatory loop may exist in human hepatocytes.
    - *id022
