  review:
    summary: PAINT IBD at the eumetazoan FGFR node PTN004704281.
    action: KEEP_AS_NON_CORE
    reason: Node placement is sound (FGFR4 inherits this from the FGFR clade). FGFR4 activation drives
      proliferation in engineered BaF3 cells and FGF19-driven hepatocyte proliferation in vivo, but proliferation
      is a context-dependent downstream outcome of FGFR signaling rather than the defining role of FGFR4
      (which is hepatic endocrine metabolic signaling).
    additional_reference_ids:
    - PMID:20018895
    supported_by:
    - reference_id: PMID:20018895
      supporting_text: These data suggest that activation of FGFR4 is the mechanism whereby FGF19 can
        increase hepatocyte proliferation and induce hepatocellular carcinoma formation.
