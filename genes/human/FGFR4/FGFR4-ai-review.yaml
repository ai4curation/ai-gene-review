gene_symbol: FGFR4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: FGFR4 is a single-pass type I transmembrane receptor tyrosine kinase of the fibroblast growth
  factor receptor family, with three extracellular immunoglobulin-like domains and a split intracellular
  tyrosine kinase domain. Unlike FGFR1-3 it lacks the IIIb/IIIc alternative exon pair and has a single
  c-type-like ligand-binding domain; a soluble secreted splice form also exists. FGFR4 binds several paracrine
  FGFs in a heparan sulfate-dependent manner and is the principal receptor for the endocrine hormone FGF19
  (FGF15 in mouse), which it binds together with the coreceptor beta-Klotho (KLB) and sulfated glycosaminoglycans.
  Ligand-induced dimerization triggers trans-autophosphorylation and phosphorylation of FRS2 and PLCG1,
  activating RAS-MAPK/ERK1/2, PI3K-AKT, PLC-gamma and STAT3 outputs. Its best-defined physiological role
  is in hepatocytes, where intestinal FGF19 acting through the KLB-FGFR4 complex and ERK1/2 represses
  CYP7A1 and thereby bile acid synthesis, forming the enterohepatic feedback loop that maintains bile
  acid and cholesterol homeostasis. FGFR4 also contributes to FGF19-driven hepatocyte proliferation and
  liver regeneration. Only fully N-glycosylated FGFR4 reaches the cell surface; after endocytosis a larger
  fraction of FGFR4 recycles to the plasma membrane than for FGFR1-3, although it is still subject to
  ligand- and partner-dependent degradation. The common G388R polymorphism stabilizes the receptor and
  is associated with cancer progression, and FGF19-FGFR4 signaling is an oncogenic driver in a subset
  of hepatocellular carcinomas.
