  evidence_type: IDA
  original_reference_id: PMID:18480409
  qualifier: enables
  review:
    summary: Heparin binding by FGFR4 (abstract-only paper centred on FGFR1).
    action: ACCEPT
    reason: FGFRs contain a heparin/heparan sulfate binding site in D2 that is part of the FGF-HS-FGFR
      ternary complex, and FGF19 signaling via FGFR4 depends on sulfated GAGs; function is clearly correct,
