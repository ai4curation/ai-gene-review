- term:
    id: GO:0003713
    label: transcription coactivator activity
  evidence_type: IDA
  original_reference_id: PMID:41540007
  qualifier: enables
  review:
    summary: CHAMP1 coactivates MyoD-dependent transcription in human myoblasts.
    action: NEW
    reason: Human CHAMP1 and MyoD associate by reported co-IP and controlled endogenous proximity
      ligation, co-occupy the MYMK enhancer and require each other for enhancer occupancy despite
      preserved nuclear expression. CHAMP1 loss reduces MYMK transcription; re-expression restores
      it, and MYMK expression bypasses the fusion defect. Interaction-sensitive zinc-finger mutants
      connect this association to function. Together these experiments support transcription coactivator
      activity, not autonomous sequence-specific DNA binding or a purified binary interface. CHAMP1
      regulates the fusogen transcriptionally rather than performing membrane fusion, and no new fusion
      process is proposed.
    supported_by:
    - reference_id: PMID:41540007
      supporting_text: a key cofactor for MyoD
