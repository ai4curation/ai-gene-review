suggested_questions:
- question: Which physical partner or molecular activity links the CHAMP1 FPE region to stable kinetochore–microtubule
    attachment, separately from its direct WK-region REV7 interaction?
- question: Can the exact CHAMP1–REV7 source result in the PMID:29656893 supplementary interaction
    dataset be recovered and its bait, prey and experimental context verified?
- question: Which direct physical step, if any, is performed by CHAMP1 itself in the CHAMP1–POGZ–HP1α
    chromatin module, given that POGZ recruits SETDB1, SETDB1 methylates H3K9 and MRE11 executes
    nascent-strand degradation at stalled forks?
- question: How do cell type, mitotic phosphorylation and CHAMP1 variant dosage distinguish chromosome-alignment,
    competitive REV7-binding and heterochromatin-associated functions?
suggested_experiments:
- description: Test separation-of-function FPE and WK mutants at endogenous expression for attachment
    stability, CENP-E/F localization, REV7 competition and repair readouts, controlling cell-cycle
    distribution.
- description: Reconstitute defined CHAMP1–POGZ–HP1α assemblies to determine direct contacts and chromatin-bridging
    capacity, separately from SETDB1 catalytic activity.
