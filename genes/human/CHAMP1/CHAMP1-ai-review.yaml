- term:
    id: GO:1905168
    label: positive regulation of double-strand break repair via homologous recombination
  evidence_type: IMP
  original_reference_id: PMID:36044844
  review:
    summary: CHAMP1 positively regulates homologous-recombination repair through competitive REV7
      binding.
    action: NEW
    reason: Replace the prior authored recombinational-repair proposal with the more precise regulatory
      process. CHAMP1 itself occupies REV7 and reduces its SHLD3 association; human CHAMP1 loss and
      binding-defective rescue experiments connect that performed molecular step to DSB end resection
      and HR output. This is more than necessity alone, but does not identify CHAMP1 as the strand-exchange
      catalyst. Complete comparator queries show related regulators are annotated using broader repair
      terms or positive-effect relationships, not uniformly GO:1905168; no annotation gap is inferred
      from their absence. Official bidirectional ancestry checks exclude redundancy with the four
      existing machine biological processes, and the authenticated GO-CAM index contains no target
      activity. The additional REV7-independent heterochromatin mechanism is not treated as identical
      to competitive sequestration.
    supported_by:
    - reference_id: PMID:36044844
      supporting_text: decreased DSB end resection
    - reference_id: file:human/CHAMP1/CHAMP1-source-evidence.json
