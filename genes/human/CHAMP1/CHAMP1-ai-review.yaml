id: Q96JM3
gene_symbol: CHAMP1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CHAMP1 is a nuclear and mitotic chromosome-associated protein with repeat motifs and
  zinc-finger regions. It supports stable kinetochore–microtubule attachment and sister-chromatid
  biorientation, with phosphorylation-sensitive functions in chromosome alignment and kinetochore
  protein localization. CHAMP1 also binds REV7/MAD2L2 and competes with SHLD3, favoring DNA end resection
  and homologous-recombination repair. A distinct CHAMP1–POGZ–HP1α complex contributes to heterochromatin
  organization and recruitment of repair-associated proteins at damaged telomeres in human ALT cells.
  At stalled replication forks, the chromatin complex supports SETDB1-dependent histone methylation
  and protects nascent DNA from excessive MRE11-dependent degradation. In differentiating human myoblasts,
  CHAMP1 cooperates with MyoD at the MYMK enhancer to activate fusogen expression and enable myoblast
  fusion. Pathogenic CHAMP1 variants cause a neurodevelopmental disorder with intellectual disability
  and prominent speech impairment.
