core_functions:
- description: Supports stable kinetochore–microtubule attachment and chromosome alignment through
    its FPE region and phosphorylation-sensitive mitotic function. CHAMP1 affects CENP-E/CENP-F kinetochore
    localization and MAD2L2 spindle localization; the physical molecular activity implementing the
    attachment function remains unresolved.
  directly_involved_in:
  - id: GO:0051315
    label: attachment of mitotic spindle microtubules to kinetochore
  - id: GO:0031134
    label: sister chromatid biorientation
  - id: GO:0034501
    label: protein localization to kinetochore
  - id: GO:0035372
    label: protein localization to microtubule
  locations:
  - id: GO:0000776
    label: kinetochore
  - id: GO:0005819
    label: spindle
  - id: GO:0000793
    label: condensed chromosome
  supported_by:
  - reference_id: PMID:21063390
    supporting_text: essential for proper chromosome alignment
- description: Binds REV7/MAD2L2 through its WK-region interface and prevents productive association
    with SHLD3, reducing Shieldin assembly and favoring DSB end resection and homologous-recombination
    repair. This competitive binding mechanism is distinct from the REV7-independent CHAMP1–POGZ–HP1α
    chromatin complex.
  molecular_function:
    id: GO:0140311
    label: protein sequestering activity
  directly_involved_in:
  - id: GO:1905168
    label: positive regulation of double-strand break repair via homologous recombination
  locations:
  - id: GO:0005634
    label: nucleus
  - id: GO:0005654
    label: nucleoplasm
  supported_by:
  - reference_id: PMID:36044844
    supporting_text: reducing the level of the REV7/SHLD3 complex
  - reference_id: PMID:28887307
- description: Coactivates MyoD-dependent MYMK transcription in differentiating human myoblasts through
    association with MyoD and reciprocal occupancy at the MYMK enhancer. This nuclear activity enables
    fusogen expression and is separable from CHAMP1’s mitotic role; it does not make CHAMP1 a membrane
    fusogen or establish intrinsic sequence-specific DNA recognition.
  molecular_function:
    id: GO:0003713
    label: transcription coactivator activity
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:41540007
    supporting_text: activating MYMK transcription
