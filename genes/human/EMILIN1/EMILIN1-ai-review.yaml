  review:
    summary: The EMILIN1 gC1q ligand directly supports cell-matrix adhesion.
    action: ACCEPT
    reason: Human recombinant gC1q supports Jurkat and EA.hy926 attachment, and selective ligand mutations
      impair this activity in the original assays. EMILIN1 supplies the adhesive contact itself, rather
      than merely being required for a downstream phenotype. Domain constructs and coated-substrate assays
      do not establish equal activity of both complete natural products.
