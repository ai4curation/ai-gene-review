id: Q9Y6C2
gene_symbol: EMILIN1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: EMILIN1 is a secreted extracellular matrix glycoprotein that self-assembles into homotrimers
  and larger extracellular structures. It contributes to elastic-fiber organization and cell anchorage
  through interactions with matrix proteins including elastin and fibulins. Its matrix-organizing role
  promotes fibulin-4/EFEMP2 deposition and supports lysyl oxidase-dependent matrix crosslinking. The C-terminal
  globular C1q domain mediates integrin-dependent cell-matrix adhesion, with direct binding to alpha4beta1
  and functional engagement of alpha9beta1 in defined cell types. EMILIN1 also modulates TGF-beta availability
  and signaling and can affect cell proliferation and vascular homeostasis. Biallelic loss-of-function
  variants cause a connective-tissue disorder with arterial tortuosity and bone fragility.
