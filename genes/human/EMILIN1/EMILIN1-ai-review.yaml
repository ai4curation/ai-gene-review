- term:
    id: GO:1904027
    label: negative regulation of collagen fibril organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q99K41
  - ensembl:ENSMUSP00000031055
  review:
    summary: EMILIN1 regulates collagen fibril organization; the unsigned term captures the established
      matrix role.
    action: MODIFY
    reason: 'The mouse donor study, PMID:25056700, documents increased collagen deposition together with
      randomly arranged, heterogeneous aortic fibrils (Results and Supplementary Figure S2M), not a resolved
      inhibitory effect on organization itself. PMID:36351433 provides direct human and mouse evidence
      for altered fibril architecture and reduced crosslinking: cultured deficient fibroblasts produce
      abnormal fibrils, whereas skin contains larger, more variable fibrils without a significant change
      in the area occupied by fibrils (Figures 5 and 7). The paper separately reports increased collagen
      synthesis and disorganized aortic deposits (Figure 6). The GO organization process concerns fibril
      size and arrangement; collagen abundance, fibril diameter and successful network assembly are distinct
      readouts and do not select one signed rate or extent across these contexts. Generalize to GO:1904026,
      regulation of collagen fibril organization. This is supported beyond a loss-of-function requirement:
      EMILIN1 binds EFEMP2/fibulin-4 and promotes its matrix deposition (PMID:28717224, Figure 5), while
      the human and mouse study connects deficient EFEMP2 deposition with reduced LOX function and collagen
      crosslinking. EMILIN1 supplies matrix-organizing interactions; LOX performs the crosslinking chemistry.
      The positive contribution to stable assembly is retained without claiming that all tissue-specific
      collagen responses have the same regulatory sign.'
    supported_by:
    - reference_id: PMID:25056700
    - reference_id: PMID:36351433
    - reference_id: PMID:28717224
    - reference_id: file:human/EMILIN1/EMILIN1-source-guide.md
    proposed_replacement_terms:
    - id: GO:1904026
      label: regulation of collagen fibril organization
