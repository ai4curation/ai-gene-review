  review:
    summary: Secreted human EMILIN1 is deposited in the extracellular matrix.
    action: MODIFY
    reason: The original compared sequence-confirmed human wild-type and A22T constructs. Human HEK293
      conditioned-medium immunoblots demonstrate secretion; transfected mouse NIH3T3 cultures distinguish
      human from endogenous mouse EMILIN1, and human control fibroblasts and skin show extracellular matrix
      deposition. The mutant secretion defect does not negate wild-type localization. Extracellular matrix
      is the better resolved location. This is a compartment refinement through extracellular-structure
      part_of relationships, not a claim that GO:0031012 is an is_a descendant of GO:0005576.
    supported_by:
    - reference_id: PMID:26462740
    proposed_replacement_terms:
    - id: GO:0031012
      label: extracellular matrix
