  qualifier: located_in
  review:
    summary: The Reactome participant is EMILIN1 assembled within an elastic-fiber complex.
    action: MODIFY
    reason: The captured event input contains an elastic-fiber/fibulin/emilin complex. Its Emilin set
      has a literal EMILIN1-polymer member, a trimer repeated unit, and three human Q9Y6C2 components
      modeled as residues 22–1016. Thus elastic fiber resolves the broad extracellular location more precisely.
      These are structural component edges, not evidence that EMILIN1 catalyzes crosslinking; the chain
      is not assigned to the short natural product.
