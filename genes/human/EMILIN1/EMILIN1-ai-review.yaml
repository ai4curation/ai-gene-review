  review:
    summary: EMILIN1 promotes integrin-mediated cell adhesion.
    action: MODIFY
    reason: The 1999 original directly tested a recombinant human gC1q fragment in cell-attachment assays,
      with fibronectin and albumin controls; adhesion was cell-line dependent and the receptor was not
      identified there. Subsequent direct purified alpha4beta1 binding, receptor blockade and ligand-mutant
      experiments establish integrin-mediated adhesion. GO:0033627 is a verified is_a descendant of cell
      adhesion. The refinement integrates that later evidence without recasting the 1999 experiment as
      an integrin-specific assay.
