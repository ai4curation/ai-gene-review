  review:
    summary: EMILIN1 acts as an extracellular ligand in integrin-mediated signaling.
    action: KEEP_AS_NON_CORE
    reason: The current definition of signal transduction expressly includes ligand–receptor interaction.
      Human gC1q adhesion and integrin-blocking experiments, together with the contact-dependent proliferation
      and signaling study, support this broad context. Extracellular location does not exclude the ligand
      from signal transduction. The annotation is retained as non-core; no intracellular catalytic relay
      or autonomous kinase activity is attributed to EMILIN1.
