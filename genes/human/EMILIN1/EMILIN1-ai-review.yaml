  review:
    summary: Macrophage accumulation is supported, but the migration-specific inference remains unresolved.
    action: UNDECIDED
    reason: PMID:25056700, Figure 5C-D and the associated Results, detects increased Mac-3-positive cells
      in aged Emilin1-deficient valves, with unchanged CD45 staining. These are endpoint tissue-abundance
      measurements. The Discussion proposes several explanations involving systemic TGF-beta signaling,
      cells entering from the adventitia, new vessels and endothelial disruption; it does not resolve
      which route contributes. GO:1905522 concerns a reduction in the frequency, rate or extent of macrophage
      movement between sites. The operative Methods and Results do not separately measure that movement
      or exclude altered local retention, survival or proliferation as contributors to accumulation. The
      donor observation and its possible migration interpretation are retained, but inflammation alone
      does not settle the process-specific inference. This is scientific uncertainty despite accessible
      evidence, not an access failure or a claim that the curator annotated the wrong gene.
