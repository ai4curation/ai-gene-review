    id: GO:0006886
    label: intracellular protein transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000804
  review:
    summary: 'Intracellular protein transport, mapped from the family-wide clathrin small-chain signature
      IPR000804. Broad but true: clathrin-mediated endocytosis moves plasma-membrane proteins into the
      endosomal system.'
    action: ACCEPT
    reason: A generic InterPro2GO mapping from a signature shared by all AP-complex sigma subunits, 
      so it cannot be more specific than the family's common role. It is correct for AP2S1 and sits 
      above the AP-2-specific terms GO:0072583 and GO:0016192 that the record already carries, so no
      modification is warranted.
    supported_by:
    - reference_id: PMID:12086608
      supporting_text: AP2 functions in clathrin-mediated endocytosis, the process whereby cargo 
        enters the endosomal system from the plasma membrane.
    - reference_id: PMID:31671891
      supporting_text: For efficient internalization, the cargo proteins need to be linked to the 
        endocytic machinery via adaptor proteins such as the heterotetrameric endocytic adaptor 
        complex AP-2 and a variety of mostly monomeric endocytic adaptors.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: InterPro:IPR000804
        source_label: InterPro IPR000804 Clathrin_sm-chain_CS
        source_status: SUPPORTS_TRANSFER
        comment: Clathrin adaptor small-chain signature (PROSITE PS00989 CLAT_ADAPTOR_S), matched by
          AP2S1 per its own DR lines. A family-wide signature shared with the AP-1, AP-3 and AP-4 
          sigma subunits, so terms mapped from it are necessarily family-level.
