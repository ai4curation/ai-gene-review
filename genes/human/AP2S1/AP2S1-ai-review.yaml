  title: UniProtKB P53680 (AP2S1_HUMAN) curated record
  publication_type: DATABASE
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: "The fetched Swiss-Prot record. Accession asserted to be the expected one, not a merged
