- term:
    id: GO:0030100
    label: regulation of endocytosis
  evidence_type: TAS
  original_reference_id: PMID:10753805
  qualifier: involved_in
  review:
    summary: Regulation of endocytosis, a legacy UniProt TAS from a structural review of clathrin 
      coat construction. Notably this reference projects to exactly one entity in all of GOA -- 
      AP2S1 -- and the cached record is abstract-only, its abstract discussing the clathrin cage, 
      the mu2 subunit and the alpha-appendage without mentioning the sigma subunit.
    action: MODIFY
    reason: GO:0030100 is defined as 'Any process that modulates the frequency, rate or extent of 
      endocytosis'. AP-2 does not modulate clathrin-mediated endocytosis; it is the cargo-selection 
      machinery that carries it out, and cargo uptake fails outright in cells deficient in AP2S1. 
      Annotating core machinery as a regulator of its own process is a role conflation, and the 
      correct term is the process itself. Proposing GO:0072583, which the record already carries 
      from three better-grounded rows, so the modification loses no information and removes a 
      misleading regulatory reading.
