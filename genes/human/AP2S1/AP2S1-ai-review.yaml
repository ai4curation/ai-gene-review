    - reference_id: PMID:15941406
      supporting_text: while AP-2 is present in nearly all static clathrin spots, it is excluded 
        from the disappearing population of clathrin spots
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: UniProtKB:P63010
        source_label: AP2B1 (Homo sapiens)
        source_status: SUPPORTS_TRANSFER
        comment: AP2B1_HUMAN, the beta-2 subunit of the same AP-2 complex -- not a sequence 
          orthologue of sigma2 and not a paralogue of it. UniProt uses ECO:0000250 with this 
          accession as a complex-level 'inferred from' marker rather than a similarity claim, so the
          transfer is sound about the destination (AP-2 works at the plasma membrane) while being 
          weak as a sequence inference. The conclusion is independently confirmed by the 
          ComplexPortal NAS row for the cytoplasmic face of the plasma membrane and by UniProt's own
          coated-pit location.
      residue_claims_not_applicable: The question here is where a peripheral complex subunit is 
        recruited, which no residue-level argument bears on; the transfer was judged on the 
        relationship between source and target (co-complex, not orthologue) and on independent 
        corroboration of the destination.
