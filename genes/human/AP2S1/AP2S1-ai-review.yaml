    id: GO:0009898
    label: cytoplasmic side of plasma membrane
  evidence_type: NAS
  original_reference_id: PMID:29184887
  qualifier: located_in
  review:
    summary: Cytoplasmic side of the plasma membrane, a ComplexPortal statement applied to all 
      fourteen AP-2 entities (four ComplexPortal complexes plus the five human and five mouse 
      subunits). The most informative location term on the whole record.
    action: ACCEPT
    reason: 'Exactly right and exactly specific: AP-2 is a peripheral complex on the cytoplasmic leaflet,
      reading cargo tails that project into the cytosol while holding PtdIns(4,5)P2 in the membrane. It
      is a complex-level statement rather than a sigma2-specific one -- fourteen entities share it --
      but sigma2 is an obligate subunit and one of the two subunits that contact the dileucine motif,
      so the location is its own. Core.'
    supported_by:
    - reference_id: PMID:29184887
      supporting_text: The key stages in this step-wise process, from the starting point of cargo 
        recognition, to the later stage of assembly of the clathrin coat, are dependent on weak 
        interactions between a large network of proteins.
    - reference_id: PMID:19140243
      supporting_text: The major recognition events are the two leucine residues binding in 
        hydrophobic pockets on σ2.
    - reference_id: file:human/AP2S1/AP2S1-uniprot.txt
      supporting_text: Membrane, coated pit {ECO:0000269|PubMed:33859415}; Peripheral membrane
    additional_reference_ids:
    - PMID:19140243
