- term:
    id: GO:0016192
    label: vesicle-mediated transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - CGD:CAL0000182525
  - FB:FBgn0039132
  - FB:FBgn0043012
  - MGI:MGI:1098244
  - MGI:MGI:1889383
  - PANTHER:PTN000204281
  - PomBase:SPAP27G11.06c
  - RGD:620188
  - SGD:S000003561
  - SGD:S000004160
  - UniProtKB:P53680
  - WB:WBGene00000157
  review:
    summary: "The family's single PAINT inference, and it is placed correctly. Node PTN000204281 is the
      only PTN node in PTHR11753, and its GO:0016192 IBD is seeded by sigma subunits of three different
      AP complexes: the AP-3 sigmas of budding yeast and Candida (Golgi-to-vacuole transport, IMP), the
      AP-1 sigmas of yeast, fission yeast, fly and mouse (endosome-to-Golgi retrieval and synaptic-vesicle
      budding, IDA/IMP), and the AP-2 sigmas of fly, worm, rat and human (clathrin-dependent endocytosis,
      IMP/IDA). Human AP2S1 is inside that clade -- UniProt assigns it to PTHR11753 -- and its cargo-binding
      surface is intact, so the inference transfers cleanly."
    action: ACCEPT
    reason: "Vesicle-mediated transport is true of AP2S1 and is core: the AP-2 heterotetramer it belongs
      to is the cargo-selection module of clathrin-mediated endocytosis, and cells lacking AP2S1 fail
      to internalise cargo at all. The term is broad, but that breadth is the right answer rather than
      a defect. The node's seeds do not agree on a pathway -- AP-3 seeds act between Golgi and vacuole,
      AP-1 seeds between endosome and Golgi, AP-2 seeds at the plasma membrane -- so their last common
      ancestor supports nothing more specific than vesicle-mediated transport, and GRANULARITY_MISMATCH
      (which applies only when donors agree and a finer term was available) does not. The more specific
      human-appropriate term GO:0072583 is separately annotated three times, so nothing is lost. There
      is no IRD or IKR anywhere in this family's PAINT slice, and no target-specific evidence of loss
      or divergence: the eight residues that build sigma2's dileucine-binding site are all present in
      P53680. Bookkeeping note, recorded rather than explained: the GOA/QuickGO WITH/FROM carries eleven
      gene donors while the current local PAINT slice lists ten seeds for this term, the extra one (FB:FBgn0043012)
      appearing in the same node's GO:0043231 seed list."
    supported_by:
    - reference_id: file:human/AP2S1/AP2S1-uniprot.txt
      supporting_text: DR   PANTHER; PTHR11753; ADAPTOR COMPLEXES SMALL SUBUNIT FAMILY; 1.
    - reference_id: PMID:42234739
      supporting_text: AP-2 is composed of two large subunits (α and β2), a medium subunit (μ2), and
        a small subunit (σ2) that assemble hierarchically from hemicomplexes (α/σ2 and β2/μ2) before
        forming the final heterotetramer
    - reference_id: PMID:31353312
      supporting_text: the uptake of the cargo reporter was abolished in AAGAB KO cells or cells 
        deficient in AP2S1, which encodes the σ2 subunit of AP2 adaptor
    - reference_id: file:human/AP2S1/AP2S1-bioinformatics/RESULTS.md
      supporting_text: 'All eight positions match the literature: **True**'
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: CGD:CAL0000182525
        source_label: APS3 (Candida albicans)
        source_status: SUPPORTS_TRANSFER
        comment: Resolves to Q59QC5, Candida albicans APS3, the AP-3 complex sigma subunit. Its 
          experimental grounding is GO:0006896 Golgi-to-vacuole transport (IMP, PMID:20870878) -- a 
          different vesicle pathway from AP-2, which is why the node sits at the 
          vesicle-mediated-transport parent.
      - source_id: FB:FBgn0039132
        source_label: AP-1sigma (Drosophila melanogaster)
        source_status: SUPPORTS_TRANSFER
        comment: Resolves to Drosophila AP-1sigma (four TrEMBL entries share the cross-reference; 
          B8A403 carries the family IBA and a GO:0016192 NAS from PMID:11598180). An AP-1 subunit, 
          so again a different pathway from the target's.
      - source_id: FB:FBgn0043012
        source_label: AP-2sigma (Drosophila melanogaster)
        source_status: SUPPORTS_TRANSFER
        comment: Resolves to Q9VDC3, Drosophila AP-2sigma -- the fly orthologue of the target. It 
          carries GO:0035615 clathrin-cargo adaptor activity by IMP (PMID:20226669), so the AP-2 
          branch of this node has its own experimental endocytic evidence.
      - source_id: MGI:MGI:1098244
        source_label: Ap1s1 (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: Resolves to P61967, mouse Ap1s1 (AP-1 complex subunit sigma-1A), which carries 
          GO:0042147 retrograde endosome-to-Golgi transport by IMP (PMID:24928897).
      - source_id: MGI:MGI:1889383
        source_label: Ap1s2 (Mus musculus)
        source_status: SUPPORTS_TRANSFER
        comment: Resolves to Q9DB50, mouse Ap1s2, which carries GO:0016192 itself by IMP 
          (PMID:24928897) plus GO:0016182 synaptic vesicle budding from endosome by IDA 
          (PMID:20203623). One of the strongest direct experimental anchors for the transferred 
          term.
      - source_id: PANTHER:PTN000204281
        source_status: SUPPORTS_TRANSFER
        comment: "PTHR11753 ADAPTOR COMPLEXES SMALL SUBUNIT FAMILY IBD node (the family's only PTN node;
          seeded by AP-1, AP-2 and AP-3 sigma subunits from fungi, flies, nematodes, rodents and human).
          Human AP2S1 is inside the clade: UniProt assigns it to PTHR11753, and it is itself one of the
          node's seeds."
      - source_id: PomBase:SPAP27G11.06c
        source_label: vas2 (Schizosaccharomyces pombe)
        source_status: SUPPORTS_TRANSFER
        comment: Resolves to Q9P7N2, S. pombe vas2 (AP-1 complex subunit sigma-1), with GO:0042147 
          and GO:0099638 by IDA (PMID:19624755). Extends the node's experimental span to fission 
          yeast.
      - source_id: RGD:620188
        source_label: Ap2s1 (Rattus norvegicus)
        source_status: SUPPORTS_TRANSFER
        comment: Resolves to P62744, rat Ap2s1 -- the direct rodent orthologue, identical to the 
          human protein over all 142 residues. It carries GO:0098884 postsynaptic neurotransmitter 
          receptor internalization by IDA and EXP (PMID:17289840).
      - source_id: SGD:S000003561
        source_label: APS3 (Saccharomyces cerevisiae)
        source_status: SUPPORTS_TRANSFER
        comment: Resolves to P47064, S. cerevisiae APS3 (AP-3 sigma), GO:0006896 by IMP 
