references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  publication_type: DATABASE
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: "InterPro2GO. Three signatures are used on this gene and each was checked against AP2S1's
      own DR lines: IPR000804 (clathrin small-chain signature) and IPR016635 (AP complex small subunit)
      are family-wide and supply the generic transport and membrane-coat terms, while IPR027156 (APS2)
      is specific to the AP-2 sigma subunit and supplies GO:0035615 and GO:0072583. Every mapped term
      is true of AP2S1 and the subfamily-specific entry is not over-generalised."
- id: GO_REF:0000024
  title: Manual transfer of experimentally-verified manual GO annotation data to orthologs by 
    curator judgment of sequence similarity
  publication_type: DATABASE
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Manual ISS transfer. Correctly identified, and the destination it reaches (plasma 
      membrane) is right. Worth flagging that its source here, UniProtKB:P63010, is AP2B1 -- a 
      co-complex subunit rather than a sequence orthologue or paralogue of sigma2 -- so the evidence
      code implies a similarity argument the relationship does not actually supply.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  publication_type: DATABASE
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PAINT/GO_Central phylogenetic annotation. Traced to node PTN000204281 of PTHR11753
      in the refreshed PAINT slice -- the family's only PTN node -- and all eleven gene-level donors
      were resolved individually. Because the seeds span AP-1, AP-2 and AP-3 sigma subunits acting 
      in different vesicle pathways, the curator's choice of the vesicle-mediated-transport parent 
      is the correct last common ancestor rather than an under-call.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary 
    mapping, accompanied by conservative changes to GO terms applied by UniProt
  publication_type: DATABASE
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: "UniProt subcellular-location vocabulary mapping. Both terms used here were checked
      against the record: SL-0039 (Cell membrane) and SL-0162 (Membrane) are both carried by AP2S1's SUBCELLULAR
      LOCATION lines, and both map to the GO term actually used."
- id: GO_REF:0000107
  title: Automatic transfer of experimentally verified manual GO annotation data to orthologs using 
    Ensembl Compara
  publication_type: DATABASE
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Ensembl Compara ortholog transfer. The donor UniProtKB:P62743 was verified to be 
      mouse Ap2s1, the 1:1 orthologue and the same subunit; human and mouse sigma2 are identical 
      over all 142 residues, so the orthology step is as safe as it can be. What it delivers is 
      nonetheless a tissue-restricted rather than a core location.
- id: GO_REF:0000108
  title: Automatic assignment of GO terms using logical inference, based on on inter-ontology links
  publication_type: DATABASE
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: GOC inter-ontology logical inference. Both rows it supplies here are location 
      terms derived from process annotations (presynapse from GO:0048488, postsynapse from 
      GO:0098884) rather than from any observation of the protein, so each is only as good as its 
      input; both inputs are complex-level annotations of AP-2.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  publication_type: DATABASE
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 'Combined automated IEA methods. The single row it supplies, GO:0030122, was traced
      to its ARBA component: ARBA00027293 was fetched from the UniProt endpoint and its firing condition
      set is FunFam 3.30.450.60:FF:000004 within Chordata, which AP2S1 satisfies exactly. Correctly applied.'
