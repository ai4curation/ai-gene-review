        comment: Resolves to Q19123, C. elegans aps-2 (AP complex subunit sigma, 142 aa, PTHR11753),
          which carries GO:0072583 clathrin-dependent endocytosis by IMP (PMID:25303366). Not a 
          UniProtKB accession, so not a key in PTHR11753-entries.csv; resolved instead through 
          UniProt's own WormBase cross-reference line on Q19123.
