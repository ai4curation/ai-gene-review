        source_status: SUPPORTS_TRANSFER
        comment: Resolves to P35181, S. cerevisiae APS1 (AP-1 sigma-1), GO:0006896 by IMP 
          (PMID:17003107).
      - source_id: UniProtKB:P53680
        source_label: AP2S1 (Homo sapiens, the target)
        source_status: SUPPORTS_TRANSFER
        comment: The target itself. AP2S1's own GO:0048488 IDA and IMP (PMID:11102472) are among the
          descendant evidences the PAINT curator had in view when placing the IBD, so its appearance
          here is expected and is a marker that experimental grounding exists on the target, not a 
          circular transfer.
      - source_id: WB:WBGene00000157
        source_label: aps-2 (Caenorhabditis elegans)
