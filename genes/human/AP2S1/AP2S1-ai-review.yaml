- id: PMID:19140243
  title: A structural explanation for the binding of endocytic dileucine motifs by the AP2 complex.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The decisive paper for this gene's molecular function and the one affinage missed.
      PubMed-verified by exact-title search on Europe PMC; the AP2-core/CD4-peptide co-crystal plus 
      liposome-binding mutagenesis establishes that the dileucine motif's two leucines bind pockets 
      built from sigma2 residues, with a YxxPhi/PtdIns(4,5)P2 specificity control. Every residue 
      claim in this review traces to it. Note that the parent task brief cited PubMed:18497731 for 
      this structure; that identifier resolves to an unrelated FAAH gene-variant paper.
- id: PMID:23222959
  title: Mutations in AP2S1 cause familial hypocalciuric hypercalcemia type 3.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: "PubMed-verified; the FHH3 discovery paper and the source of UniProt's three HHC3 variant
      features at Arg15. Full text available and read: exome sequencing, cosegregation in 55 family members,
      11 further Arg15 mutations in 50 CASR-negative FHH patients, and HEK293 CaSR EC50 and cell-surface
      ELISA assays on wild-type versus mutant AP2S1."
- id: PMID:42234739
  title: CCDC32 collaborates with the membrane to assemble the AP-2 clathrin adaptor complex.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; explains the CCDC32 interaction row by showing CCDC32 engaging 
      the alpha/sigma2 hemicomplex through a canonical dileucine cargo motif, i.e. through sigma2's 
      own cargo-binding site. Found by independent Europe PMC search, not by affinage.
- id: PMID:31353312
  title: AAGAB Controls AP2 Adaptor Assembly in Clathrin-Mediated Endocytosis.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; the mechanistic account of the seven AAGAB protein-binding rows. 
      Its co-IP and GST pull-down data show sigma2 associates with AAGAB only when the alpha subunit
      is present, which is what makes those rows uninformative about sigma2 as an individual binder.
      Also supplies independent confirmation that AP2S1 is required for cargo uptake.
- id: PMID:33729479
  title: Ap2s1 mutation causes hypercalcaemia in mice and impairs interaction between 
    calcium-sensing receptor and adaptor protein-2.
  publication_type: PRIMARY_RESEARCH
  reference_review:
