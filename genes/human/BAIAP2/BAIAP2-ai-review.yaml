- molecular_function:
    id: GO:0003779
    label: actin binding
  description: >-
    The IMD binds F-actin directly and cross-links filaments into tightly packed
    parallel bundles, an activity mapped to conserved basic residues at the two extreme
    ends of the zeppelin-shaped dimer. This is the molecular function underlying the
    actin filament bundle assembly and actin crosslink formation processes the gene is
    annotated to, and it had no molecular-function representation in GOA. It is listed
    last deliberately: Mattila et al. showed the filopodia-forming activity of the
    domain survives loss of F-actin bundling and tracks membrane deformation instead,
    so actin binding is a genuine property of the domain rather than the mechanism by
    which protrusions are built. In cells it operates alongside Eps8, with which IRSp53
    synergizes to bundle actin.
  directly_involved_in:
