    label: positive regulation of actin filament polymerization
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  review:
    summary: IRSp53 promotes actin polymerization by recruiting nucleation-promoting
      factors via its SH3 domain to sites of membrane curvature. This is a well-established
      core function.
    action: ACCEPT
    reason: >-
      Deep research confirms IRSp53 recruits WAVE/Arp2/3 and triggers actin
      polymerization bursts at sites of membrane curvature. The SH3 domain binds proline-rich
      regions of actin effectors.
    supported_by:
