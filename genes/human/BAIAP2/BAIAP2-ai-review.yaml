  original_reference_id: PMID:17371834
  review:
    summary: Direct PI(4,5)P2 binding by the IMD/I-BAR domain is the membrane-targeting
      step that all of IRSp53's downstream activity depends on. Mattila et al. showed
      that IRSp53 binds PI(4,5)P2-rich membranes and deforms them into tubules, and
      mapped the PI(4,5)P2-binding site on the IMD; the inverted geometry of that
      site relative to classical BAR domains is what makes I-BAR proteins generate
      protrusions rather than invaginations. Picas et al. (PMID:38724689) independently
      show full-length IRSp53 deforming PI(4,5)P2 giant unilamellar vesicles.
    action: NEW
    reason: >-
      Re-grounded on the primary structural and biochemical paper (PMID:17371834)
      rather than on the deep-research summary file the earlier draft cited. The binding
      is direct and site-mapped, so IRSp53 itself performs the step, and GOA carries
      no phosphoinositide-binding term for this gene despite PI(4,5)P2 dependence
      being the defining feature of the I-BAR family.
    supported_by:
    - reference_id: PMID:17371834
      supporting_text: Here, we provide evidence that IMDs deform PI(4,5)P2-rich membranes
        into tubular structures.
    - reference_id: PMID:17371834
