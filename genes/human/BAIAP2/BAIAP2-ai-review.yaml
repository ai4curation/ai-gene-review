- molecular_function:
    id: GO:0140090
    label: membrane curvature sensor activity
  description: The N-terminal I-BAR/IMD domain reads negative membrane curvature,
    and this is what makes IRSp53 a shape sensor rather than a constitutive scaffold.
    Quiroga et al. compressed fibroblasts to generate bud-shaped plasma membrane evaginations
    on the ~100 nm scale and found IRSp53 selectively enriched at them, with maximal
    sorting near 0.05 nm^-1 and roughly twofold enrichment over control. Enrichment
    creates a local node that couples membrane topography to a transient Rac1/Arp2/3
    actin burst, which re-flattens the evagination -- a mechanochemical feedback loop
    maintaining plasma membrane shape homeostasis.
  directly_involved_in:
  - id: GO:0007009
    label: plasma membrane organization
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:37747150
    supporting_text: We show that upon cell compression, bud-shaped PM deformations
      of negative curvature (evaginations) on the 100 nm scale are formed and enriched
      by IRSp53, a negative curvature-sensing protein.
- molecular_function:
    id: GO:0005546
    label: phosphatidylinositol-4,5-bisphosphate binding
  description: Direct binding of the IMD/I-BAR domain to PI(4,5)P2 is the membrane-targeting
    step on which the adaptor and curvature-sensing activities both depend, and it
    is the feature that distinguishes the I-BAR subfamily mechanically. Mattila et
    al. mapped the PI(4,5)P2-binding site and showed that its geometry is inverted
    relative to classical BAR domains, so the domain binds the interior of the tubule
    and induces curvature of the opposite sign; this is the molecular reason I-BAR
    proteins generate plasma membrane protrusions where BAR proteins generate invaginations.
    The same study found the filopodia-forming activity of the IMD to depend on this
    membrane-deforming activity rather than on the previously proposed F-actin-bundling
    or GTPase-binding activities -- a point worth carrying, since it means the actin
    bundling terms this gene carries by IBA are a secondary property of the domain
    and not the mechanism by which it builds protrusions.
