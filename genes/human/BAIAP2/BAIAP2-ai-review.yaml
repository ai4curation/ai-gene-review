core_functions:
- molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  description: IRSp53 is fundamentally an adaptor that bridges the plasma membrane
    and the Rho-family GTPases to the actin machinery. The central partial-CRIB and
    proline-rich region receives activated Cdc42 and Rac1; the C-terminal SH3 domain
    recruits the actin effectors that do the polymerizing and bundling -- WAVE2, N-WASP,
    Eps8 and Mena/VASP. IRSp53 itself neither nucleates nor elongates filaments; its
    contribution is to hold the GTPase signal, the membrane surface and the nucleation-promoting
    factor in the same place, which is what determines whether a protrusion forms
    and what shape it takes. The same adaptor logic operates in neurons, where binding
    to PSD-95/PSD-93 and the Shank family positions IRSp53 in the postsynaptic density
    and drives dendritic spine morphogenesis.
