      summary file that the earlier draft cited; a generated summary is not admissible
      evidence for an IDA. The comparator check supports the term rather than warning
      against it: GO:0140090 is already carried in human by the BAR-domain proteins
      ARFIP2, ICA1 and PICK1, each IDA from PMID:29768204, so annotating curvature
      sensing to a BAR-superfamily protein is established GO practice and IRSp53''s
      absence is a gap rather than a convention. The activity is executed by IRSp53''s
      own I-BAR domain, which satisfies the requirement that the gene product perform
      the step.'
    supported_by:
    - reference_id: PMID:37747150
      supporting_text: We show that upon cell compression, bud-shaped PM deformations
