id: Q9UQB8
gene_symbol: BAIAP2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BAR/IMD domain-containing adapter protein 2 (IRSp53) is a curvature-sensitive
  membrane-cytoskeleton adaptor that couples plasma membrane shape to actin remodeling.
  The protein contains an N-terminal I-BAR/IMD domain that senses and generates negative
  membrane curvature by binding PI(4,5)P2-rich membranes, a central CRIB/proline-rich
  region for small GTPase (Rac1/Cdc42) coupling, and a C-terminal SH3 domain that
  recruits actin nucleation-promoting factors (WAVE, N-WASP, Eps8, Mena/VASP). IRSp53
  integrates Rho-family GTPase signaling with actin network assembly to drive filopodia,
  lamellipodia, and membrane ruffles, and is held in an autoinhibited conformation by
  14-3-3 binding to a phosphorylated region between the CRIB and SH3 modules. The protein
  is enriched at plasma membrane protrusions and at sites of negative membrane curvature,
  where it couples membrane shape to a Rac1/Arp2/3 actin burst that restores the
  membrane's resting topography. In neurons it is a postsynaptic density protein that
  binds PSD-95, PSD-93 and the Shank scaffolds and drives dendritic spine morphogenesis;
  loss of function disrupts cortical neuronal migration, and variants that break the
  autoinhibited state cause developmental and epileptic encephalopathy.
