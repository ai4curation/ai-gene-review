- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:2137336
  - PANTHER:PTN001022094
  - RGD:619814
  - UniProtKB:Q9UHR4
  - UniProtKB:Q9UQB8
  review:
    summary: >-
      Phylogenetic inference that IRSp53 is active at the plasma membrane, from the
      PANTHER node PTN001022094 with mouse Baiap2 (MGI:2137336), rat Baiap2
      (RGD:619814) and BAIAP2L1 (Q9UHR4) among the descendant evidences.
    action: ACCEPT
    reason: >-
      This is where the protein does its work: the I-BAR domain binds PI(4,5)P2 in the
      inner leaflet and reads plasma membrane curvature there. The is_active_in
      qualifier is the right one -- the site of activity, not merely of detection.
      BAIAP2 itself appears in the WITH/FROM list, which per the repository rule on
      IBAs is expected and marks experimental grounding on the target rather than
      circularity.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00027801
  review:
    summary: >-
      ARBA machine-learning assignment of plasma membrane localization, concordant with
      the IBA, the UniProt subcellular location and the protein's PI(4,5)P2-dependent
      membrane targeting.
    action: ACCEPT
    reason: >-
      Redundant with better-evidenced rows for the same term but not wrong, and the
      localization is central to every characterized IRSp53 activity.
- term:
    id: GO:0009898
    label: cytoplasmic side of plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:38149472
  qualifier: located_in
  review:
    summary: >-
      Direct localization to the cytoplasmic face of the plasma membrane, from the
      lissencephaly variant study. The functional point of the observation is that the
      p.Arg29Trp variant interferes with BAIAP2 membrane localization, tying the
      localization to the disease mechanism.
    action: ACCEPT
    reason: >-
      More precise than the bare plasma membrane rows and exactly right for the
      biology: IRSp53 is a peripheral protein with no transmembrane segment, recruited
      to the inner leaflet through I-BAR binding of PI(4,5)P2. Arg29 lies in the I-BAR
      domain, so a membrane-localization defect from that substitution is the expected
      consequence and corroborates the mechanism.
    supported_by:
    - reference_id: PMID:38149472
      supporting_text: 'Mechanistically, the variant interfered with the ability of BAIAP2
        to localize to the cell membrane.'
- term:
    id: GO:0030182
    label: neuron differentiation
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q8BKX1
  review:
    summary: >-
      Sequence-similarity transfer from mouse Baiap2, independently supported by
      PMID:38149472, where Baiap2 knockdown in developing mouse cortex disrupted
      neuronal differentiation alongside migration and morphogenesis.
    action: KEEP_AS_NON_CORE
    reason: >-
      Real but far downstream and broad. Neuron differentiation is an outcome that many
      cytoskeletal regulators affect; it does not name an activity IRSp53 executes, and
      the specific contribution is better captured by GO:0048812 neuron projection
      morphogenesis and GO:0061003.
- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:2137336
  - PANTHER:PTN001022094
  review:
    summary: >-
      Phylogenetic inference of adaptor activity from PANTHER node PTN001022094, with
      mouse Baiap2 (MGI:2137336) among the descendant evidences. This is the core
      molecular function of the I-BAR/SH3 architecture.
    action: ACCEPT
    reason: >-
      The IBD placement is sound and the term is the right one: IRSp53 has no catalytic
      activity and does not itself nucleate or elongate actin. Its function is to hold
      the activated GTPase, the curved PI(4,5)P2 membrane and the nucleation-promoting
      factor in one place. Retained as a core function.
- term:
    id: GO:0046847
    label: filopodium assembly
  evidence_type: IMP
  original_reference_id: PMID:41133935
  qualifier: involved_in
  review:
    summary: >-
      Mutational evidence from six patients with de novo BAIAP2 missense variants
      clustered in the phosphorylation region that mediates 14-3-3-dependent
      autoinhibition. In cell spreading assays the mutants disrupted the autoinhibited
      state and induced hybrid filopodia-lamellipodia protrusions.
    action: ACCEPT
    reason: >-
      Filopodium assembly is a core IRSp53 function and this adds human genetic
      loss-of-autoinhibition evidence to the existing IEA and IBA support. The direction
      is informative: these are gain-of-function variants that release the protein into
      a constitutively protrusive state, which is the cleanest demonstration that
      IRSp53 activity is what drives the protrusion rather than merely permitting it.
    supported_by:
    - reference_id: PMID:41133935
      supporting_text: 'In silico modeling and HeLa cell spreading assays demonstrated that
        BAIAP2 mutants potentially disrupted its autoinhibited state and induced hybrid
        filopodia-lamellipodia protrusions in cells, phenocopying the effects of Rac1/Cdc42
        overexpression.'
- term:
    id: GO:0048812
    label: neuron projection morphogenesis
  evidence_type: IMP
  original_reference_id: PMID:41133935
  qualifier: involved_in
  review:
    summary: >-
      From the same DEE variant study: transgenic expression of mutant BAIAP2 mRNA in
      zebrafish embryos produced developmental defects and abnormal neurite growth, and
      neurons expressing the variants showed increased excitability from enhanced
      excitatory synaptogenesis.
    action: KEEP_AS_NON_CORE
    reason: >-
      Genuine and experimentally grounded, but a tissue-specific morphogenetic outcome
      of the same filopodial and spine machinery rather than a distinct activity. Kept
      non-core for the same reason as the rest of the neuronal set, alongside
      GO:0061003 and GO:0001764.
    supported_by:
    - reference_id: PMID:41133935
      supporting_text: 'transgenic overexpression of mutant BAIAP2 mRNA in zebrafish embryos
        led to developmental defects, abnormal neurite growth, and enhanced sensitivity to
        pentylenetetrazole-induced locomotor hyperactivity.'
- term:
    id: GO:0003779
    label: actin binding
  evidence_type: IDA
  original_reference_id: PMID:14752106
  review:
    summary: >-
      The IMD/I-BAR domain binds and bundles F-actin directly. Yamagishi et al. showed
      the isolated IMD of IRSp53 assembles purified actin filaments into tightly packed
      parallel bundles in vitro, and Millard et al. localized the activity to conserved
      basic residues at the extreme ends of the zeppelin-shaped dimer, whose mutation
      abolishes bundling in vitro and filopodia in vivo.
    action: NEW
    reason: >-
      This is a genuine gap rather than a term curators declined. BAIAP2 carries the
      process terms GO:0051017 actin filament bundle assembly and GO:0051764 actin
      crosslink formation by IBA, IEA and ISS, but no molecular function anywhere in
      GOA says the protein binds actin, so the activity that produces those processes is
      unrepresented. The evidence is in vitro on purified IMD and purified actin, which
      answers the "which entity performs the step" test directly: IRSp53 does the
      binding itself, with mapped residues. The comparator check supports the term --
      within the I-BAR family MTSS1 carries GO:0003779 by IDA (PMID:12570871) and IBA,
      and MTSS2 by IEA and IBA -- so there is no convention against the family. Note
      the PAINT placement differs: MTSS1/MTSS2 inherit from PTN004481656, not from
      BAIAP2's PTN001022094, which is why the term has not propagated here. The
      argument above is target-specific direct evidence, not a propagation claim.
      One caveat belongs on the record: Mattila et al. (PMID:17371834) found the
      filopodia-forming activity of the IMD to be independent of F-actin bundling,
      depending instead on membrane deformation. Actin binding is a real property of
      the domain but not the mechanism by which IRSp53 builds protrusions, and it is
      asserted here on that narrower footing.
    supported_by:
    - reference_id: PMID:14752106
      supporting_text: The IMD alone, derived from either IRSp53 or MIM, induced filopodia
        in HeLa cells and the formation of tightly packed parallel F-actin bundles in vitro
    - reference_id: PMID:14752106
      supporting_text: the N-terminal predicted helical stretch of 250 amino acids of IRSp53
        is an evolutionarily conserved F-actin bundling domain involved in filopodium formation
    - reference_id: PMID:15635447
      supporting_text: Mutagenesis of conserved basic residues at the extreme ends of the
        dimer abrogated actin bundling in vitro and filopodia formation in vivo
