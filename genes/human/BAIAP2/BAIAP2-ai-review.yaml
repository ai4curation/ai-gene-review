- term:
    id: GO:0001221
    label: transcription coregulator binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: >-
      This IEA traces to a real experimental annotation, not to a modelling artefact.
      The Ensembl ortholog transfer derives from rat Baiap2 (UniProtKB:Q6GMN2), where
      RGD made the annotation IPI from PMID:10332026, the DRPLA paper showing that
      atrophin-1 binds the IRSp53 SH3 domain through a proline-rich region adjacent to
      its polyglutamine tract. Atrophin-1 (ATN1) is a transcriptional corepressor, so
      the interaction is correctly typed as transcription coregulator binding.
    action: KEEP_AS_NON_CORE
    reason: >-
      Corrected from MARK_AS_OVER_ANNOTATED, whose rationale -- not supported by deep
      research or UniProt annotations -- misdescribed the provenance. This is a
      specifically-typed binding resting on a curator's reading of a focused paper, and
      per the repository rule an experimental annotation is not overruled from an
      abstract. It is non-core because IRSp53's core activity is curvature-sensitive
      membrane-actin coupling; binding a polyglutamine-tract corepressor through the
      SH3 domain is a partner interaction, not evidence that IRSp53 acts in
      transcriptional coregulation. Worth noting for future passes: human GOA has since
      retired its own generic GO:0005515 row citing PMID:10332026, so this transferred
      term is now the only place the atrophin-1 interaction is recorded for BAIAP2,
      which is a further reason not to discard it.
    supported_by:
    - reference_id: PMID:10332026
      supporting_text: Dentatorubral-pallidoluysian atrophy protein interacts through
        a proline-rich region near polyglutamine with the SH3 domain of an insulin
        receptor tyrosine kinase substrate.
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q6GMN2
  - ensembl:ENSRNOP00000005687
- term:
    id: GO:0005874
    label: microtubule
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  review:
    summary: 'Traced to rat Baiap2 (UniProtKB:Q6GMN2), where RGD annotated this IDA
      from PMID:24639075, a pre-embedding immunogold electron-microscopy survey of
      IRSp53 in rat brain. The observation is direct: in large dendritic shafts the
      gold particles lay along microtubules. This is an experimental localization,
      not an ortholog-transfer artefact.'
    action: KEEP_AS_NON_CORE
    reason: >-
      'The previous rationale here was wrong on provenance, so the call is corrected
      rather than defended. Immunogold proximity in dendritic shafts is real evidence
      of where the protein sits, but it does not make IRSp53 a microtubule-associated
      protein: the same study concentrates the label in dendritic spines at the PSD,
      and every characterized IRSp53 activity (I-BAR curvature sensing, SH3 recruitment
      of actin nucleators, Rac1/Cdc42 coupling) is actin-directed. Kept as a non-core
      localization.'
    supported_by:
    - reference_id: PMID:24639075
      supporting_text: Intracellular labeling was observed in somata, where particles
        were associated with rough endoplasmic reticulum and Golgi apparatus; and
        large dendritic shafts, where it was typically associated with microtubules
  qualifier: located_in
