suggested_questions:
- question: >-
    Should IRSp53 carry a term for membrane bending as well as membrane curvature
    sensing? The I-BAR domain does not only read negative curvature, it generates it:
    purified IMD deforms PI(4,5)P2-rich membranes into tubules by binding the interior
    of the tubule (PMID:17371834), and full-length IRSp53 indents PI(4,5)P2 giant
    unilamellar vesicles (PMID:38724689). This review asserts GO:0140090 membrane
    curvature sensor activity and GO:0005546 PI(4,5)P2 binding but deliberately stops
    short of the deformation half, because the comparator evidence is equivocal:
    GO:0097753 membrane bending (a biological process) has only a handful of human
    annotations, and the molecular-function term GO:0180020 membrane bending activity
    is carried in human only by CHMP2A, CHMP3 and OPA1 and by no BAR-superfamily
    protein at all. Is that absence a curation convention about how BAR-domain
    activity is represented, or a genuine gap across the whole superfamily?
- question: Does IRSp53 have preference for specific phosphoinositide species beyond
    PI(4,5)P2? The I-BAR domain binds PI(4,5)P2-rich membranes, but specificity for
    other PIP species is not fully characterized.
- question: What is the quantitative relationship between membrane curvature and IRSp53
    recruitment in human cells? eLife 2023 provides quantitative data but further
    studies on curvature thresholds and residence times would be valuable.
suggested_experiments:
- description: Liposome binding assays with defined curvatures and lipid compositions
    to quantify PI(4,5)P2 vs other PIP binding specificity. This would clarify lipid
    binding specificity of the I-BAR domain.
