        a burst of actin polymerization mediated by Rac1 and Arp2/3.
    - reference_id: PMID:11130076
      supporting_text: IRSp53 is essential for Rac to induce membrane ruffling, probably
        because it recruits WAVE, which stimulates actin polymerization mediated by the
        Arp2/3 complex
