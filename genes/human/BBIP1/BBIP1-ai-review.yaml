core_functions:
- description: BBIP1 is an integral BBSome scaffold that connects BBS4 and BBS8 and stabilizes the human
    complex architecture. Through this structural contribution, it participates in the complex’s ciliary
    receptor localization and cilium-assembly roles. The scaffold activity is distinct from the unresolved
    proposal that BBIP1 coordinates HDAC6 with BBS4.
  molecular_function:
    id: GO:0140378
    label: protein complex scaffold activity
  in_complex:
    id: GO:0034464
    label: BBSome
  locations:
  - id: GO:0005929
    label: cilium
  - id: GO:0060170
    label: ciliary membrane
  directly_involved_in:
  - id: GO:0097500
    label: receptor localization to non-motile cilium
  - id: GO:0060271
    label: cilium assembly
  supported_by:
  - reference_id: PMID:19081074
    supporting_text: "We have now discovered a \nBBSome subunit that we named BBIP10."
  - reference_id: PMID:22500027
    supporting_text: BBIP10, an integral BBSome protein that binds to the complex through BBS4
  - reference_id: PMID:31951201
    supporting_text: BBS18 functions as a structural scaffold protein that is essential for the proper
      assembly and structural stability of the BBSome complex.
proposed_new_terms: []
suggested_questions:
- question: Does BBIP1 directly alter tubulin assembly or HDAC6 catalysis, or are the cytoplasmic microtubule
    phenotypes mediated through another cellular step?
  experts:
  - Maxence V. Nachury
- question: Are the BBSome scaffold and HDAC6-associated effects separable, and does the latter occur
    in BBSome-bound or free BBIP1?
- question: Which BBIP1 product was used for the 104-residue BBS18 construct in the 2017 interaction study,
    and how does it relate to the current UniProt products?
suggested_experiments:
- description: Separation-of-function mutagenesis of BBIP1 to uncouple BBSome incorporation (BBS4 binding)
    from HDAC6 binding/microtubule acetylation, assayed by ciliary GPCR trafficking versus cytoplasmic
    microtubule acetylation in BBIP1-null cells.
  hypothesis: BBIP1's BBSome-structural role and its microtubule/HDAC6-related role are genetically separable
    functions of the same small protein.
- description: Map the BBIP1-HDAC6 interaction interface and test whether BBIP1 directly inhibits HDAC6
    tubulin-deacetylase activity in vitro.
  hypothesis: BBIP1 promotes microtubule acetylation by directly antagonizing HDAC6 rather than by an
    indirect cellular mechanism.
