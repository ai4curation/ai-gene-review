id: A8MTZ0
gene_symbol: BBIP1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: BBIP1, also called BBIP10 or BBS18, is a small structural subunit of the BBSome, a protein
  complex that supports ciliary membrane-protein trafficking. In the human BBSome core, BBIP1 contacts
  BBS4 and BBS8 and helps maintain complex architecture. It localizes to primary cilia and the cytoplasm
  and contributes to ciliogenesis. BBIP1 depletion also affects cytoplasmic microtubule polymerization
  and acetylation, and inhibition of the associated deacetylase HDAC6 restores acetylation in depleted
  cells. The molecular connection between this phenotype and its BBSome role remains unresolved. Loss-of-function
  variants cause Bardet–Biedl syndrome type 18.
