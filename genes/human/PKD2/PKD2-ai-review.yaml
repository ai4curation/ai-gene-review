id: Q13563
gene_symbol: PKD2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'PKD2 encodes polycystin-2/TRPP2, a multi-pass nonselective cation channel found in ciliary, plasma,
  and endoplasmic-reticulum membranes. It forms homotetrameric channels and PKD1-containing heterotetramers that
  conduct Ca(2+), Na(+) and K(+) and link the polycystin complex to ciliary and intracellular Ca(2+) signaling.'
