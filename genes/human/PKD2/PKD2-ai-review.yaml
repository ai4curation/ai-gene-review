core_functions:
- description: PKD2 forms membrane nonselective cation channels as a homotetramer and as the TRPP2 subunits of
    PKD1-containing polycystin channels, supporting Na(+), K(+) and Ca(2+) transport at ciliary, plasma and
    endoplasmic-reticulum membranes.
