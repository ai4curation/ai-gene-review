existing_annotations:
- term:
    id: GO:0000077
    label: DNA damage checkpoint signaling
  evidence_type: IMP
  original_reference_id: PMID:12717439
  qualifier: involved_in
  review:
    summary: Stevens et al. 2003 (abstract-only cache) show that CHK2 phosphorylates a consensus site
      in E2F1 (Ser364) after etoposide, stabilizing the protein and activating its transcription and apoptotic
      output; dominant-negative CHK2 blocks E2F1 induction and E2F1-dependent apoptosis. E2F1 is therefore
      a downstream effector of the ATM-CHK2 checkpoint kinase cascade, executing the transcriptional/apoptotic
      arm of the damage response, rather than a component of the checkpoint signal transduction itself.
    action: KEEP_AS_NON_CORE
    reason: The paper establishes E2F1 as a CHK2 substrate whose stabilization couples DNA damage to transcriptional
      activation of pro-apoptotic genes; the authors only 'suggest a role for E2F-1 in checkpoint control'.
      E2F1 does not generate or transduce the checkpoint signal (ATM/ATR-CHK2 do) - it is the transcriptional
      output. GO:0008630 (intrinsic apoptotic signaling in response to DNA damage, same paper) and the
      damage-responsive transactivation captured in core_functions are the better representation; this
      row is kept as a non-core, DNA-damage-context annotation rather than removed, since the IMP evidence
      (S364A mutant, dn-CHK2) is sound.
    supported_by:
    - reference_id: PMID:12717439
      supporting_text: A Chk2 consensus phosphorylation site in E2F-1 is phosphorylated in response to
        DNA damage, resulting in protein stabilization, increased half-life, transcriptional activation
        and localization of phosphorylated E2F-1 to discrete nuclear structures.
    - reference_id: PMID:12717439
      supporting_text: These results suggest a role for E2F-1 in checkpoint control and provide a plausible
        explanation for the tumour suppressor activity of E2F-1.
- term:
    id: GO:0000122
    label: negative regulation of transcription by RNA polymerase II
  evidence_type: IMP
  original_reference_id: PMID:20224733
  qualifier: involved_in
  review:
    summary: 'Sahin & Sladek 2010 (full text) compare wild-type E2F1 with the pRB-binding-defective E2F1-Y411C
      mutant in murine fibroblasts: in asynchronously cycling cells wild-type E2F1, as part of the E2F1/pRB
      complex, represses DHFR, b-myb, TK and cdc2, whereas in cells re-entering the cycle it activates
      the same genes. The repression is pRB-dependent (the 411 mutant cannot repress).'
    action: ACCEPT
    reason: 'E2F1 does part of the work of this process: it supplies the sequence-specific DNA binding
      that positions the RB1 corepressor and its associated histone deacetylase activity on E2F target
      promoters, and the repression is lost when the E2F1-RB1 interface is disrupted (the Y411C/411 mutant
      cannot repress). This is a scaffold-type contribution rather than intrinsic repressor activity,
      and it is one half of the G1/S switch that defines E2F1 biology - the same assembly captured by
      GO:0035189 (Rb-E2F complex) and by core_functions[1]. Accepted rather than demoted, because grading
      it non-core while treating the Rb-E2F corepressor platform as a core function would be internally
      inconsistent.'
    supported_by:
    - reference_id: PMID:20224733
      supporting_text: E2F-1 acts as part of the repression complex with pRB in the expression of DHFR,
        b-myb, TK and cdc2 in asynchronously growing cells; on the other hand, E2F-1 acts as an activator
        in the expression of the same genes in cells that are re-entering the cycle.
