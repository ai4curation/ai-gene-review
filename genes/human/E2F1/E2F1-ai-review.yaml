- description: After DNA damage or oncogenic stress, ATM/ATR-CHK2 phosphorylation (Ser31, Ser364) and
    PCAF acetylation stabilise E2F1 and enhance its DNA binding, and the stabilised factor transactivates
    pro-apoptotic target genes - TP73, ASPP1/ASPP2, caspases, CDKN2D and the E2F1-selective mediators
