suggested_questions:
- question: E2F1's transcription-independent role at DNA lesions (TopBP1-dependent retention, GCN5/p300
    recruitment, support for NER and HR) is well documented but carries no GO annotation. Should E2F1
    receive a DNA-repair annotation in this capacity, and is the correct representation a process term
    on E2F1 or a causal GO-CAM edge from E2F1 to the acetyltransferase activity it recruits?
  experts:
  - David G. Johnson
  - Swarnalatha Manickavinayaham
- question: E2F1 both activates and represses the same target genes depending on cell-cycle position and
    RB1 status. Given that the repression is executed by the recruited pocket protein rather than by E2F1
    itself, should negative-regulation annotations sit on E2F1 at all, or only on RB1 with E2F1 recorded
    as the DNA-binding recruiter?
  experts:
  - Nicholas B. La Thangue
- question: Several rodent-derived electronic annotations on human E2F1 (response to lipopolysaccharide,
    cellular response to fatty acid, hypoxia and NGF, negative regulation of fat cell proliferation) reflect
    single-context ortholog observations. Are these appropriate for cross-species propagation, or should
    response-to-stimulus terms for a broadly stress-responsive transcription factor be restricted to the
    species in which they were assayed?
  experts: []
suggested_experiments:
- hypothesis: The apoptotic and proliferative outputs of E2F1 are separable at the level of promoter selection
    rather than of E2F1 abundance, and are specified by the post-translational modification state of E2F1
    (PCAF acetylation, Ser31/Ser364 phosphorylation, PRMT5 methylation) rather than by which DP partner
    it uses.
  description: Introduce modification-site knock-in alleles of E2F1 (K117/120/125R, S31A, S364A, arginine-methylation-deficient)
    into an E2F1-null human cell line and profile genome-wide occupancy (ChIP-seq or CUT&RUN) alongside
    nascent transcription (TT-seq) after serum restimulation and after etoposide or UV. Determine whether
    pro-apoptotic promoters (TP73, ASPP1/2, CDKN2D) and G1/S promoters (CCNE1, CDC6, MCM2-7) are differentially
    occupied as a function of modification state, with DP partner occupancy measured in parallel.
  experiment_type: genome-wide occupancy and nascent transcription profiling of modification-site knock-in
    alleles
- hypothesis: E2F1's contribution to nucleotide-excision repair is mediated solely by recruitment of acetyltransferase
    activity to damaged chromatin, and is therefore fully separable from its sequence-specific DNA binding
    and transactivation.
  description: 'Complement E2F1-depleted human fibroblasts with separation-of-function alleles: a DNA-binding-domain
    mutant, a transactivation-domain deletion, and an S31A allele that cannot bind TopBP1. Measure recruitment
    to locally UV-irradiated nuclear areas, H3K9 acetylation at lesions, XPA/XPC loading, and CPD/(6-4)PP
    removal kinetics. If the DNA-binding and transactivation mutants retain repair competence while S31A
    does not, the repair role is a discrete recruitment function and should be annotated separately from
    the transcriptional core functions.'
  experiment_type: separation-of-function complementation with local UV irradiation and repair kinetics
