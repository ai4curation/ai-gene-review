gene_symbol: E2F1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'E2F1 encodes transcription factor E2F1 (E2F-1, originally identified as the retinoblastoma-binding
  protein RBBP3/RBAP-1), the prototypical member of the activator E2F class (E2F1-3) of the E2F/DP family.
  It is a nuclear, chromatin-associated, sequence-specific transcription factor that functions obligately
  as a heterodimer with a DP partner (TFDP1 or TFDP2): the two winged-helix domains contact opposite halves
  of the E2F consensus site (TTTC[CG]CGC) in RNA polymerase II promoters, while the coiled-coil and marked-box
  regions of the two subunits form an intertwined dimerization module. Through this activity E2F1-DP activates
  the G1/S gene cluster - cyclin E, CDC6, CDT1, the MCM helicase subunits, thymidine kinase, DHFR, B-MYB
  and E2F1 itself - thereby committing cells to DNA replication and S-phase entry. The activity is gated
  by the retinoblastoma protein: hypophosphorylated RB1 binds the E2F1 C-terminal transactivation domain
  in its A/B pocket and simultaneously contacts the E2F1 and DP1 marked boxes through its C-terminal domain,
  masking the activation surface and converting promoter-bound E2F1 into a corepressor platform that recruits
  histone deacetylases and other chromatin modifiers. Sequential phosphorylation of RB1 by cyclin D-CDK4/6
  and cyclin E-CDK2 releases E2F1 and licenses the G1/S transition; later in S phase cyclin A-CDK2, which
  docks on an N-terminal region of E2F1, phosphorylates the heterodimer and terminates its DNA binding.
  E2F1 output is further tuned by an unusually dense set of post-translational modifications - KAT2B/PCAF
  acetylation of Lys117/120/125 (which enhances DNA binding), CHK2 phosphorylation of Ser364 and ATM/ATR
  phosphorylation of Ser31 (which stabilize the protein after DNA damage), GSK3B phosphorylation of Ser403/Thr433
  coupled to USP11-mediated deubiquitination, SETD7 methylation of Lys185 that triggers L3MBTL3/CRL4-DCAF5-dependent
  degradation, and PRMT5 arginine methylation. E2F1 is biologically bifunctional: besides driving proliferation,
  stabilized or deregulated E2F1 transactivates pro-apoptotic genes (TP73, ASPP1/ASPP2, caspases, RRP1B,
  BBC3) and induces the ARF-MDM2-p53 axis, making it an effector of the intrinsic apoptotic response to
  DNA damage and oncogenic stress. Independently of transcription, damage-modified E2F1 accumulates at
  UV lesions and double-strand breaks, where TopBP1 binding retains it on damaged chromatin and it recruits
  the acetyltransferases GCN5/KAT2A and p300/CBP to promote histone acetylation and the loading of nucleotide-excision
  and homologous-recombination repair factors. Additional characterised activities include pocket-protein-independent
  antagonism of C/EBPalpha, which blocks adipocyte differentiation, and repression of beta-catenin/TCF-dependent
  transcription. E2F1 is not an enzyme, transporter or structural protein, and it has no established function
  outside the nucleus.'
