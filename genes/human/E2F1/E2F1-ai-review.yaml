core_functions:
- description: As an obligate heterodimer with TFDP1/TFDP2, E2F1 binds E2F consensus sites (TTTC[CG]CGC)
    in RNA polymerase II cis-regulatory regions through its winged-helix domain and activates the G1/S
    gene cluster (cyclin E, CDC6, CDT1, MCMs, thymidine kinase, DHFR, B-MYB, E2F1 itself), committing
    the cell to DNA replication and S-phase entry. The activity is switched on when cyclin D-CDK4/6 and
    cyclin E-CDK2 phosphorylation of RB1 releases the E2F1 transactivation domain, and is terminated in
    S phase by cyclin A-CDK2 phosphorylation of the heterodimer.
