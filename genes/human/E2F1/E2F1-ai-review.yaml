- description: 'Independently of its transcriptional program, damage-modified E2F1 accumulates on chromatin
    at UV photoproducts and double-strand breaks (retained there by TopBP1 binding to phospho-Ser31, with
    its DNA-binding and transactivation domains dispensable) and recruits the histone acetyltransferases
    GCN5/KAT2A and p300/CBP. The resulting H3K9 (and H3K18/H3K56) acetylation opens the damaged chromatin
    and promotes loading of nucleotide-excision repair factors and of the resection and homologous-recombination
    machinery. E2F1 acts here as an accessory chromatin organiser rather than as a repair enzyme. No GO
    biological-process term is asserted here: the acetyltransferase-recruitment activity is what E2F1
    itself contributes, and whether that warrants a DNA-repair process annotation is raised as a question
    for experts instead.'
