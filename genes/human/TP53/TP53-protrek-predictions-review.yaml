description: >-
  ProTrek sequence-to-text retrieval for p53. All five calls are apoptosis terms in two specific cell
  types - oligodendrocytes and thymocytes - and four are exact GOA matches, so nothing is wrong. But
  p53 has one of the largest annotation sets in GOA, and this review's two core functions are both
  about sequence-specific transcription-factor activity at p53 response elements; neither DNA binding
  nor transcriptional regulation appears anywhere in the top five. The same two cell-type apoptosis
  terms headed p53's list when it was run as a positive control in the ARGO-ProtNLM-50 work, so this
  is a stable property of the query rather than a one-off. Assessment: 2 correct not novel (CNN),
  1 less precise (LSP).
