- term:
    id: GO:0000209
    label: protein polyubiquitination
  evidence_type: IDA
  original_reference_id: PMID:27708159
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: p85α undergoes KBTBD2/Cullin-3-mediated polyubiquitination controlling PI3K abundance in adipocytes.
    action: KEEP_AS_NON_CORE
    reason: p85α is the SUBSTRATE of this polyubiquitination (recognized by the BTB-Kelch protein KBTBD2 of a Cullin-3 E3 ligase), not the enzyme performing it. This is a regulated event governing p85α levels and insulin signaling rather than a core molecular function of p85α; retained as non-core with the GOA-supplied qualifier.
    supported_by:
    - reference_id: PMID:27708159
      supporting_text: KBTBD2 targeted p85α, the regulatory subunit
    - reference_id: PMID:27708159
      supporting_text: causing p85α ubiquitination
