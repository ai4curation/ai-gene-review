    label: phosphotyrosine residue binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00089668
  review:
    summary: SH2 domains of p85α bind phosphotyrosine (pYXXM) motifs – a core adaptor activity.
    action: ACCEPT
    reason: p85α has two SH2 domains that dock tyrosine-phosphorylated YXXM motifs on activated receptors
      and adaptor/scaffold proteins; this is a well-established core molecular function and the basis
      of its receptor-coupling role.
