- term:
    id: GO:0000209
    label: protein polyubiquitination
  evidence_type: IDA
  original_reference_id: PMID:27708159
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: The cited ubiquitination experiment acts on p85alpha as the substrate.
    action: MARK_AS_OVER_ANNOTATED
    reason: Full PMID27708159 identifies KBTBD2 as the substrate-recognition subunit of a CUL3 ligase
      and p85alpha as its polyubiquitinated degradation target. It does not establish p85alpha performing
      the ubiquitination step. The separate ability of p85alpha to protect PTEN from WWP2-dependent degradation
      (PMID26222500) is regulation of another protein, not evidence that this substrate-only assay establishes
      protein polyubiquitination participation. Its insulin/PI3K regulatory work is retained separately.
    supported_by:
    - reference_id: PMID:27708159
      supporting_text: 'KBTBD2 targeted p85α, the regulatory subunit

        of the phosphoinositol-3-kinase (PI3K) heterodimer, causing p85α ubiquitination

        and proteasome-mediated degradation.'
    - reference_id: PMID:26222500
- term:
    id: GO:0001678
    label: intracellular glucose homeostasis
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P26450
  - ensembl:ENSMUSP00000056774
  review:
    summary: Role in intracellular glucose homeostasis via insulin/PI3K signaling.
    action: KEEP_AS_NON_CORE
    reason: p85α contributes to glucose handling as the regulatory subunit coupling the insulin receptor/IRS
