id: P27986
gene_symbol: PIK3R1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: PIK3R1 encodes p85alpha and shorter regulatory isoforms of class IA phosphatidylinositol
  3-kinase. Its SH2 domains recognize phosphorylated receptors and adaptor proteins, while its p110-binding
  region stabilizes catalytic PI3K subunits, restrains basal activity and permits stimulus-dependent activation.
  These functions link growth-factor, insulin and immune-receptor signaling to phosphoinositide production
  and AKT responses. P110-free p85alpha also has regulatory roles, including IRS sequestration, PTEN stabilization/activity,
  and XBP1-dependent unfolded-protein responses. The protein is predominantly cytosolic with recruited
  membrane and context-dependent intracellular pools. Different isoforms and variants can therefore increase
  or decrease pathway activity and produce distinct metabolic or immune phenotypes.
