- id: file:human/PIK3R1/PIK3R1-deep-research-falcon.md
  title: Deep research report on PIK3R1/p85α (Falcon/Edison), synthesized literature review
- id: PMID:20348926
  title: The regulatory subunits of PI3K, p85alpha and p85beta, interact with XBP-1 and increase its nuclear
    translocation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected as the traced mouse nuclear-location donor; this is a specific stress/insulin
      mechanism, not constitutive nuclear residence.
  findings:
  - statement: p85alpha/p85beta association changes with insulin and contributes to XBP1 nuclear translocation.
- id: PMID:25217619
  title: Phosphoinositide 3-kinase p85beta regulates invadopodium formation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full target Results/Fig. 1 inspected. Title foregrounds p85beta, but p85alpha is directly
      compared. Exact ER-membrane assignment remains unresolved because the inspected main localization
      passages specify perinuclear/cis-Golgi, not an ER marker.
  findings:
  - statement: NIH3T3 comparison places p85alpha in perinuclear internal membranes including cis-Golgi,
      distinct from p85beta adhesion enrichment.
- id: PMID:11038173
  title: Role of the PI3K regulatory subunit in the control of actin organization and cell migration.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full Methods/Results inspected for the mouse donor claims: perinuclear localization,
      filopodia, stress fibers and focal adhesions. No human direct assay is invented.'
  findings:
  - statement: Mouse fibroblast experiments distinguish p85alpha/Cdc42/N-WASP cytoskeletal remodeling
      from PI3K catalytic activity.
- id: PMID:26222500
  title: Regulation of the PI3K pathway through a p85α monomer-homodimer equilibrium.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full target Results inspected; distinguishes homodimer/PTEN regulation from catalytic
      PI3K complex membership and from p85 acting as an ubiquitin-ligase substrate.
  findings:
  - statement: p110-free p85alpha homodimers bind and stabilize PTEN and enhance its phosphatase activity/membrane
      association.
- id: PMID:22351933
  title: Agammaglobulinemia and absent B lineage cells in a patient lacking the p85α subunit of PI3K.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected for the stated finding.
  findings:
  - statement: A human patient lacking p85alpha but retaining shorter isoforms has a profound early B-cell
      developmental block.
    supporting_text: 'The mutation results in the absence of p85α but normal expression

      of the p50α and p55α regulatory subunits of PI3K.'
- id: PMID:8599763
  title: Crystal structure of the PI 3-kinase p85 amino-terminal SH2 domain and its phosphopeptide complexes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract inspected; the finding is restricted to the experiment explicitly reported
      there, without inventing inaccessible methods.
  findings:
  - statement: p85 N-terminal SH2 phosphopeptide structures establish the basis of phosphotyrosine recognition.
core_functions:
- description: 'Non-catalytic regulatory subunit of class IA PI3K: binds and stabilizes the p110 catalytic
    subunit, restrains its basal lipid-kinase activity, and enables its activation as part of the class
    IA PI3K heterodimer that produces PI(3,4,5)P3.'
  supported_by:
  - reference_id: PMID:19805105
    supporting_text: 'The N-terminal SH2 (nSH2)

      domain of p85alpha is shown to form a scaffold for the entire enzyme complex'
