- term:
    id: GO:0005911
    label: cell-cell junction
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: located_in
  supporting_entities:
  - UniProtKB:P26450
  - ensembl:ENSMUSP00000056774
  review:
    summary: Cell-cell junction localization (electronic, mouse ortholog).
    action: KEEP_AS_NON_CORE
    reason: Retain the inherited cell-contact localization. The mouse donor traces to PMID23793062 (immunological-synapse
      signaling), while PMID14699157 independently reports p85/PI3K recruitment to E-cadherin-mediated
      contacts in human intestinal epithelial cells. The latter supports the broad cell-cell-junction
      claim without claiming every junctional pool or assigning structural adhesion-molecule activity
      to p85.
    supported_by:
    - reference_id: PMID:14699157
    - reference_id: PMID:23793062
- term:
    id: GO:0005942
    label: phosphatidylinositol 3-kinase complex
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: part_of
  supporting_entities:
  - UniProtKB:P23727
  review:
    summary: Specify the class IA phosphatidylinositol 3-kinase complex.
    action: MODIFY
    reason: 'PIK3R1 forms the regulatory component of class IA p85–p110 heterodimers. The specific complex
      term is already supported by human structures and retained independently. This does not imply that
      every p85 molecule is p110-bound: free p85 and p85 dimers have additional roles.'
    supported_by:
    - reference_id: PMID:19805105
