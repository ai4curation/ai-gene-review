core_functions:
- description: NADPH-dependent reduction of 7,8-dihydrofolate (and, slowly, folic acid) to tetrahydrofolate
    in the cytosol, regenerating the THF carrier on which cellular one-carbon metabolism depends.
  molecular_function:
    id: GO:0004146
    label: dihydrofolate reductase activity
  directly_involved_in:
  - id: GO:0046654
    label: tetrahydrofolate biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - *id002
  - *id001
  - reference_id: PMID:21310277
    supporting_text: DHFR activity and fluorescein-labeled methotrexate (FMTX) binding were severely reduced
      in EBV-immortalized lymphoblastoid cells of all patients
  - reference_id: PMID:21310277
    supporting_text: DHFR is necessary for maintaining sufficient CSF and RBC folate levels, even in the
      presence of adequate nutritional folate supply and normal plasma folate
- description: Within the SHMT1-scaffolded nuclear thymidylate-synthesis complex, reduces the dihydrofolate
    produced by thymidylate synthase so that de novo dTMP synthesis can continue during DNA replication
    and repair.
  molecular_function:
    id: GO:0004146
