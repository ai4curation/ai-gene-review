  review:
    summary: 'A mitochondrial pool of canonical DHFR is supported: a 2024 proteomic study of purified
      HEK293 mitochondria (PMID:38224738) measured reductase activity
      and found peptides unique to DHFR but none unique to the paralog DHFR2, revising the earlier attribution
      of mitochondrial reductase activity to DHFR2/DHFRL1 (PMID:21876184). The mitochondrial pool supports
      local THF regeneration, including mitochondrial dTMP synthesis.'
    action: ACCEPT
    reason: Consistent with the high-throughput mitochondrial proteome (PMID:34800366), UniProt (by similarity
      to mouse) and the newer human proteomic evidence. The cytosol remains the principal site; the tissue
      generality of the mitochondrial pool is not established.
    supported_by:
    - &id005
      reference_id: PMID:38224738
      supporting_text: This data provides compelling evidence that DHFR (and not DHFR2) is the reductase
        activity in human mitochondria.
    - &id006
      reference_id: PMID:38224738
      supporting_text: the DHFR activity of the mitochondria can be definitely assigned to DHFR.
    - reference_id: file:human/DHFR/DHFR-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Mitochondrion {ECO:0000250|UniProtKB:P00375}'
