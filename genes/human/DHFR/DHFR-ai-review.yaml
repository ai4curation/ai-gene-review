id: P00374
gene_symbol: DHFR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: DHFR is cytosolic dihydrofolate reductase (EC 1.5.1.3), a small monomeric NADPH-dependent
  oxidoreductase that reduces 7,8-dihydrofolate to 5,6,7,8-tetrahydrofolate (THF). This is the only route
  by which dietary folic acid and the dihydrofolate released by thymidylate synthase re-enter the active
  THF pool, so DHFR sustains the one-carbon reactions that make thymidylate, purines and methionine. A
  mitochondrial pool has also been reported. During S and G2/M a fraction of DHFR moves to the nucleus,
  where SHMT1 anchors it with thymidylate synthase to the nuclear lamina and replication forks for de
  novo dTMP synthesis. DHFR also reduces 7,8-dihydrobiopterin to tetrahydrobiopterin, a salvage reaction
  with low affinity, and binds its own mRNA to repress translation. It is the target of antifolate drugs
  such as methotrexate. Biallelic destabilizing missense variants cause DHFR deficiency, with megaloblastic
  anemia and cerebral folate and tetrahydrobiopterin deficiency that respond to folinic acid.
