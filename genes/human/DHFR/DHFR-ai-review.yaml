  title: The Differential Translation Capabilities of the Human DHFR2 Gene Indicates a Developmental and
    Tissue-Specific Endogenous Protein of Low Abundance.
  findings:
  - statement: Purified HEK293 mitochondria have DHFR reductase activity, and targeted proteomics detects
      canonical DHFR but not DHFR2 peptides, assigning mitochondrial reductase activity to DHFR and revising
      the earlier attribution to DHFR2/DHFRL1.
    supporting_text: This data provides compelling evidence that DHFR (and not DHFR2) is the reductase
      activity in human mitochondria.
