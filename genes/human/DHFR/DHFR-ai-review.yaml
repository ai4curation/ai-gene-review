    reason: 'Consistent with the high-throughput mitochondrial proteome (PMID:34800366), UniProt (by similarity
      to mouse) and the newer human proteomic evidence. The cytosol remains the principal site; the tissue
      generality of the mitochondrial pool is not established. Examined as a synthesis row (ORGANELLES,
      2026-10-20): the PAINT IBD at PTN000556119 (PTHR48069-paint.tsv, Eukaryota) is seeded by mouse Dhfr
      (MGI:94890), rat Dhfr (RGD:2500) and human DHFR2 (Q86XF0). The DHFR2 seed is a paralog, and on its
      own would be a paralog transfer of the kind seen for SHMT1, but the two rodent seeds are canonical
      DHFR orthologues with their own IDA for mitochondrion (PMID:25980602, which found mitochondrial
      reductase activity in rat and mouse and no second enzyme to carry it), and the 2024 human study
      assigns the mitochondrial activity to canonical DHFR. So the organelle claim holds for the target.
      No sub-compartment is added: DHFR has no presequence or transmembrane segment, and the only
      sub-mitochondrial data (matrix and inner membrane, PMID:21876188) were reported for DHFRL1/DHFR2,
      an attribution the 2024 study revised; that leaves fewer than two agreeing lines for DHFR itself.'
    supported_by:
    - *id005
    - *id006
    - reference_id: file:human/DHFR/DHFR-uniprot.txt
      supporting_text: 'SUBCELLULAR LOCATION: Mitochondrion {ECO:0000250|UniProtKB:P00375}'
