      no specific CFAP410 activity is established.
    supporting_text: 'By systematically screening half of the interactome space with minimal

      inspection bias, we more than doubled the number of high-quality binary PPIs

      available from the literature.'
- id: PMID:26167768
  title: An siRNA-based functional genomics screen for the identification of regulators of ciliogenesis
    and ciliopathy genes.
  findings:
  - statement: CFAP410 localizes to basal bodies and associates with NEK1; disease variants impair this
      association.
    supporting_text: C21orf2 localises to the basal body in mIMCD3 and hTERT-RPE1 cells and to the base
      of the connecting cilium in mouse photoreceptors
- id: PMID:26290490
  title: The NEK1 interactor, C21ORF2, is required for efficient DNA damage repair.
  findings:
  - statement: CFAP410 depletion impairs homologous recombination, while the protein remains cytoplasmic.
    supporting_text: Knockdown of both C21ORF2 and NEK1 resulted in defective HR repair, as shown by significantly
      decreased percentages of GFP-positive (HR-repaired) cells
- id: PMID:26294103
  title: C21orf2 is mutated in recessive early-onset retinal dystrophy with macular staphyloma and encodes
    a protein that localises to the photoreceptor primary cilium.
  findings:
  - statement: Retinal immunohistochemistry identifies CFAP410 in photoreceptor ciliary structures.
    supporting_text: 'Immunohistochemical studies in human, pig and mouse retinas localised C21orf2

      protein to the ciliary structures of the photoreceptor cell (the daughter basal

      body, the centriole adjacent to the basal body, and the connecting cilium).'
  full_text_unavailable: true
- id: PMID:27548899
  title: Identification of Novel Mutations in the LRR-Cap Domain of C21orf2 in Japanese Patients With
    Retinitis Pigmentosa and Cone-Rod Dystrophy.
  findings:
  - statement: CFAP410 is present in adult photoreceptor cilia; retinal-disease variants affect stability/localization.
    supporting_text: 'the protein localized to the photoreceptor

      cilia in the adult retina.'
  full_text_unavailable: true
- id: PMID:9325172
  title: Immunochemical characterization of a novel mitochondrially located protein encoded by a nuclear
    gene within the DFNB8/10 critical region on 21q22.3.
  findings:
  - statement: Antibody staining and a mitochondrial dye supported an early mitochondrial localization.
    supporting_text: 'Immunofluorescence studies and co-staining with a

      mitochondrial-specific dye suggest the subcellular localization of the protein

      to mitochondria.'
  full_text_unavailable: true
- id: PMID:37188479
  title: Functional characterization of C21ORF2 association with the NEK1 kinase mutated in human in diseases.
  findings:
  - statement: Human CFAP410 knockout causes a primary-ciliogenesis defect.
    supporting_text: Here, we show that ARPE-19 cells lacking C21ORF2, like cells lacking NEK1, also show
      major defects in ciliogenesis.
- id: PMID:39703094
  title: C21ORF2 mutations point towards primary cilia dysfunction in amyotrophic lateral sclerosis.
  findings:
  - statement: CFAP410 depletion perturbs ciliary IFT88 distribution; this does not by itself establish
      an IFT motor or cargo-adapter activity.
    supporting_text: In cells with reduced levels of C21ORF2, IFT88 accumulates primarily at the tip of
      the cilium and forms a ‘bulb’ phenotype
- id: PMID:39255848
  title: The C-terminus of CFAP410 forms a tetrameric helical bundle that is essential for its localization
    to the basal body.
  findings:
  - statement: CFAP410 CTDs, including human CFAP410, form tetrameric helical bundles; functional localization
      assays were performed in T. brucei.
    supporting_text: 'The crystal

      structures reveal that the three proteins all adopt the same conformation as a

      tetrameric helical bundle.'
- id: PMID:40018707
  title: CFAP410 has a bimodular architecture with a conserved surface patch on its N-terminal leucine-rich
    repeat motif for binding interaction partners.
  findings:
  - statement: The N-terminal interaction domain was structurally characterized in T. brucei; the human
      CFAP410–NEK1 interface in this study is a computational model.
    supporting_text: We carried out structural modelling using AlphaFold-multimer for the complex of HsCFAP410-NTD
      (aa1-150) and HsNEK1-CTD (aa1208-1286).
- id: PMID:39227882
  title: ALS-associated C21ORF2 variant disrupts DNA damage repair, mitochondrial metabolism, neuronal
    excitability and NEK1 levels in human motor neurons.
  findings:
  - statement: ALS-associated V58L affects mitochondrial respiratory reserve in human motor-neuron cultures;
      this phenotype does not identify a mitochondrial catalytic function of CFAP410.
    supporting_text: Analysis of mitochondrial activity using the Seahorse XF analysis system showed a
      decrease in maximum respiration and spare respiratory capacity in C21ORF2-V58L MNs as compared to
      control cultures
- id: file:human/CFAP410/CFAP410-deep-research-falcon.md
  title: Falcon literature research report for human CFAP410
  findings:
  - statement: The research synthesis agrees with primary evidence for CFAP410-NEK1 association in ciliogenesis
      and homologous recombination; specific scaffold or kinase-activator functions remain unproven.
    supporting_text: The complex is required for efficient primary-cilium formation and homologous-recombination
      DNA repair.
- id: PMID:26974433
  title: Axial Spondylometaphyseal Dysplasia Is Caused by C21orf2 Mutations.
  findings:
  - statement: Human CFAP410-EGFP expressed in mouse photoreceptors localizes to connecting cilia and
      is spatially separated from a mitochondrial marker.
    supporting_text: We stained mitochondria by Kusabira-Orange fused with mitochondria localizing signal
      and found that subcellular distribution of the C21orf2-EGFP fusion protein was complementary to
      that of mitochondria (Fig 6O–6Q).
- id: file:human/CFAP410/CFAP410-deep-research-openscientist.md
  title: 'Focused Primary-Evidence Audit: Human CFAP410 (O43822) Subcellular Localization for GO Curation'
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: 'Useful secondary audit corroborating the independently checked Bai2011 source mismatch.
      Several recommendations exceed the evidence: it equates unsupported PM source attribution with a
      biologically contradicted location; proposes outer-segment remapping from abstract wording; treats
      locally available Fang full text as inaccessible; summarizes HPA without its per-location/antibody
      limitations; and calls the 2023 complex paper association-only despite its functional and localization
      experiments. Only claims checked against primary sources are adopted.'
  findings:
  - statement: The targeted provider audit corroborates the absence of a CFAP410 localization assay in
      the Bai2011 paper/supplementary materials; this does not demonstrate that CFAP410 can never associate
      with the plasma membrane.
    supporting_text: No supplementary file reports any GFP or antibody localization of C21orf2/CFAP410
      or any plasma-membrane assay of it.
