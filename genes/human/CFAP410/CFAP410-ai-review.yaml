id: O43822
gene_symbol: CFAP410
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CFAP410 (C21ORF2/LRRC76) is a leucine-rich-repeat protein associated with the serine/threonine
  kinase NEK1. It is found at ciliary basal bodies and photoreceptor connecting cilia, with an additional
  cytoplasmic pool. Its C-terminal domain forms a tetrameric helical bundle in vitro. Loss of CFAP410
  or disease-associated variants disrupt primary-cilium formation and function in human cellular models,
  including motor neurons. Depletion also reduces homologous-recombination reporter repair, although the
  repair-specific molecular contribution of the CFAP410–NEK1 complex remains unresolved. Biallelic variants
  cause retinal ciliopathies with variable skeletal involvement, and some variants are associated with
  amyotrophic lateral sclerosis.
