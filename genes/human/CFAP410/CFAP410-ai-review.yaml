id: O43822
gene_symbol: CFAP410
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: CFAP410 (C21ORF2/LRRC76) is a leucine-rich-repeat-containing protein that associates with
  NEK1 and is required for primary-cilium formation and function. It localizes to ciliary basal bodies
  and photoreceptor ciliary structures and also has a cytoplasmic pool. Loss or pathogenic variants impair
  ciliogenesis, with associated intraflagellar-transport and Hedgehog-signaling defects in human cellular
  models. CFAP410 also supports homologous-recombination repair of DNA double-strand breaks through a
  mechanism linked to NEK1; a catalytic activity of CFAP410 itself has not been established. Biallelic
  variants cause retinal ciliopathies with variable skeletal involvement, and some variants are associated
  with amyotrophic lateral sclerosis.
