- id: PMID:21834987
  title: Identification and characterization of a set of conserved and new regulators of cytoskeletal
    organization, cell morphology and migration.
  findings:
  - statement: CFAP410 depletion alters cortical actin organization in PC3 cells; the available text does
      not establish CFAP410 plasma-membrane localization.
    supporting_text: C21orf2cortical actin 55%NPNPNPNP
  - statement: The GFP localization assay identifies a restricted set of proteins that does not include
      CFAP410.
    supporting_text: To investigate how overexpression of selected PMMs affected cell morphology and cytoskeletal
      organisation and to determine their localization, cDNAs for ARC, FAM40A, FAM40B, FMNL3 and ZRANB1
      were cloned downstream of GFP and transfected into PC3 cells (Figure 8A).
  reference_review:
    relevance: MEDIUM
    review_notes: 'The paper is correctly identified and supports CFAP410 knockdown effects on cortical
      actin. The unsupported cytoplasm and plasma-membrane IDA assertions are assessed individually in
      existing_annotations: full text, Figure 8 and supplements show localization experiments on other
      proteins. No reference-level MISCITED classification is asserted; a lack of support for a particular
      annotation is distinguished from citing the wrong paper.'
