    id: GO:1905515
    label: non-motile cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:37188479
  review:
    summary: CFAP410 is required for primary-cilium formation in human cells.
    action: NEW
    reason: CRISPR loss and rescue studies in ARPE-19 cells demonstrate a requirement for CFAP410 in primary
      ciliogenesis. Earlier knockdown/rescue experiments (PMID:26167768) and human neuronal studies (PMID:39703094)
      corroborate this role. Add this missing process annotation; this does not imply that CFAP410 is
      a ciliary motor or an enzyme.
    additional_reference_ids:
    - PMID:39703094
    supported_by:
    - reference_id: PMID:37188479
      supporting_text: Here, we show that ARPE-19 cells lacking C21ORF2, like cells lacking NEK1, also
        show major defects in ciliogenesis.
