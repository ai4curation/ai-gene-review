- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IDA
  original_reference_id: PMID:9325172
  qualifier: located_in
  review:
    summary: An early immunochemical study reported mitochondrial CFAP410 localization.
    action: KEEP_AS_NON_CORE
    reason: PMID:9325172 explicitly reports antibody staining and co-localization with a mitochondrial
      dye in human cells; the available abstract does not establish an isoform-specific mitochondrial
      pool. Retain this historical localization as non-core. In a distinct context, human CFAP410 (NM_004928.2)
      fused to EGFP and expressed in mouse photoreceptors localized to connecting cilia and showed a distribution
      complementary to a mitochondrial marker (PMID:26974433, Figure 6O–Q). This argues against universal
      mitochondrial localization, not against the original human-cell observation. Variant-induced respiratory
      defects do not themselves demonstrate mitochondrial residence or an intrinsic mitochondrial enzymatic
      function.
    supported_by:
    - reference_id: PMID:9325172
      supporting_text: 'Immunofluorescence studies and co-staining with a

        mitochondrial-specific dye suggest the subcellular localization of the protein

        to mitochondria.'
    - reference_id: PMID:26974433
      supporting_text: We stained mitochondria by Kusabira-Orange fused with mitochondria localizing signal
        and found that subcellular distribution of the C21orf2-EGFP fusion protein was complementary to
        that of mitochondria (Fig 6O–6Q).
    additional_reference_ids:
    - PMID:26974433
