- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:21834987
  qualifier: located_in
  review:
    summary: Remove the unsupported CFAP410 plasma-membrane IDA attributed to Bai2011; native plasma-membrane
      association remains an unresolved biological possibility.
    action: REMOVE
    reason: 'Complete full-text, Figure 8 image and supplementary-material inspection of PMID:21834987
      establish that its GFP localization experiment tested ARC, FAM40A, FAM40B, FMNL3 and ZRANB1, not
      CFAP410. CFAP410 appears in the knockdown morphology screen, where cortical actin is measured; this
      is not a CFAP410 localization assay. Remove this evidence-specific annotation because its claimed
      direct-assay support is demonstrably misattributed. This decision follows inspection of the actual
      experiments and supplemental contents, not absence from an abstract or incompatibility with a ciliary
      role. Live QuickGO traces the row to UniProt on 20110926; mouse annotations transferred from human
      provide no independent experimental corroboration. The targeted OpenScientist audit corroborates
      the source mismatch. Its stronger claim that plasma-membrane localization is biologically contradicted
      is not adopted: no NOT annotation is proposed, and a native peripheral membrane pool remains a question
      for controlled experiments.'
    supported_by:
    - reference_id: PMID:21834987
      supporting_text: To investigate how overexpression of selected PMMs affected cell morphology and
        cytoskeletal organisation and to determine their localization, cDNAs for ARC, FAM40A, FAM40B,
        FMNL3 and ZRANB1 were cloned downstream of GFP and transfected into PC3 cells (Figure 8A).
    - reference_id: PMID:21834987
      supporting_text: GFP-ARC, FAM40A, FAM40B and FMNL3 proteins showed cytoplasmic localization with
        some enrichment on the plasma membrane compared to GFP alone (Figure 8B).
    - reference_id: file:human/CFAP410/CFAP410-deep-research-openscientist.md
      supporting_text: No supplementary file reports any GFP or antibody localization of C21orf2/CFAP410
        or any plasma-membrane assay of it.
    additional_reference_ids:
    - file:human/CFAP410/CFAP410-deep-research-openscientist.md
