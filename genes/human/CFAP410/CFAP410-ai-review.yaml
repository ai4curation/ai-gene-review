- id: PMID:21834987
  title: Identification and characterization of a set of conserved and new regulators of cytoskeletal
    organization, cell morphology and migration.
  findings:
  - statement: CFAP410 depletion alters cortical actin organization in PC3 cells; its localization was
      not assayed by the GFP construct experiments.
  - statement: The GFP localization assay identifies a restricted set of proteins that does not include
      CFAP410.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full primary Results/cloning Methods, Figure 8 pixels and supplementary captions were
      read. CFAP410 has a knockdown cortical-actin phenotype, whereas the localization constructs are
      other named proteins. Individual supplemental download attempts returned challenges; no fresh full-supplement
      reading is claimed. PMID:39390519 corrects Figure 6 siARC images and does not alter this Figure
      8 source-scope conclusion.
- id: PMID:25416956
  title: A proteome-scale map of the human interactome network.
  findings:
  - statement: Systematic interactome mapping is the source of the generic CFAP410 protein-binding annotation;
      no specific CFAP410 activity is established.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Authentic source cache plus exact IntAct human O43822/O00244 records were checked. Verification
      is scoped to publication/pair/method linkage; three records represent stages of one yeast two-hybrid
      study, not independent replication or a physiological copper-transfer mechanism.
- id: PMID:26167768
  title: An siRNA-based functional genomics screen for the identification of regulators of ciliogenesis
    and ciliopathy genes.
  findings:
  - statement: CFAP410 localizes to basal bodies and associates with NEK1; disease variants impair this
      association.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Selected full Results and Methods were read: human tagged co-IP in HEK293T, endogenous
      bovine retinal co-IP, human/mouse basal-body localization and mutation/rescue contexts are distinguished.'
- id: PMID:26290490
  title: The NEK1 interactor, C21ORF2, is required for efficient DNA damage repair.
  findings:
  - statement: CFAP410 depletion impairs homologous recombination, while the protein remains cytoplasmic.
    supporting_text: Knockdown of both C21ORF2 and NEK1 resulted in defective HR repair
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Selected full primary co-IP, localization, HR/NHEJ/checkpoint and rescue experiments
      were independently read by the bounded peer. NEK1 overexpression rescue concerns gamma-H2AX, not
      an HR-reporter rescue. The reported repair phenotype remains valid without an established CFAP410
      repair-specific cofactor step.
- id: PMID:26294103
  title: C21orf2 is mutated in recessive early-onset retinal dystrophy with macular staphyloma and encodes
    a protein that localises to the photoreceptor primary cilium.
  findings:
  - statement: Retinal immunohistochemistry identifies CFAP410 in photoreceptor ciliary structures.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Authentic cached abstract explicitly states retinal species and ciliary compartments;
      full Methods/images remain unavailable. Citation verification is limited to that explicit target-level
      report.
- id: PMID:27548899
  title: Identification of Novel Mutations in the LRR-Cap Domain of C21orf2 in Japanese Patients With
    Retinitis Pigmentosa and Cone-Rod Dystrophy.
  findings:
