- term:
    id: GO:1905515
    label: non-motile cilium assembly
  evidence_type: IMP
  original_reference_id: PMID:37188479
  review:
    action: NEW
    summary: CFAP410 makes a local nonenzymatic contribution to primary-cilium assembly.
    reason: Retain the prior authored proposal on combined participation evidence, not knockout necessity
      alone. PMID:37188479 identifies an endogenous human NEK1 complex at the ciliary base and shows interaction-sensitive
      loss/rescue of ciliogenesis; PMID:26167768 independently supports the local complex and mutation-sensitive
      association. PMID:39703094 adds CFAP410 association with gamma-tubulin/CEP290, mutation-sensitive
      basal-body clustering and ciliation rescue. Together these support an inferred local assembly-cofactor
      contribution by CFAP410 itself, while the exact molecular step remains unresolved. No purified binary
      binding, NEK1 recruitment/activation, IFT cargo transport or a demonstrated scaffold bridge is claimed.
      The original Figure5 compares each protein with its own knockout and does not establish cross-recruitment.
      Official assembly ancestry has no overlap with the 19 machine terms; contextual comparator records
      and the target-free GO-CAM index are documented in the source artifact. The human ARPE-19 and hTERT-RPE1
      experiments assess primary cilia, supporting the non-motile specialization; the
      contextual comparator annotations use parent cilium-assembly/organization terms.
      This human assertion does not exclude motile-cilium or flagellar roles of orthologs.
    supported_by:
    - reference_id: PMID:37188479
      supporting_text: association of NEK1 and C21ORF2
    - reference_id: PMID:37188479
      supporting_text: show major defects in ciliogenesis
    - reference_id: PMID:26167768
    - reference_id: PMID:39703094
    - reference_id: file:human/CFAP410/CFAP410-source-evidence.json
