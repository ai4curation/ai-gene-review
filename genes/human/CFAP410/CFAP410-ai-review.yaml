    id: GO:0000724
    label: double-strand break repair via homologous recombination
  evidence_type: IMP
  original_reference_id: PMID:26290490
  review:
    summary: CFAP410 supports efficient homologous-recombination repair of DNA double-strand breaks.
    action: NEW
    reason: CFAP410 knockdown reduces HR reporter repair, and the 2015 study distinguishes this defect
      from NHEJ and G2 checkpoint activation. The HR requirement was independently reproduced in PMID:37188479.
