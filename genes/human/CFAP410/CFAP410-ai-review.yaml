core_functions:
- description: Associate with the serine/threonine kinase NEK1 in a basal-body and cytoplasmic complex.
    Local partner association, basal-body clustering and interaction-sensitive ciliation rescue support
    a nonenzymatic contribution to primary-cilium assembly, while the precise assembly step remains unresolved.
  molecular_function:
    id: GO:0120283
    label: protein serine/threonine kinase binding
  directly_involved_in:
  - id: GO:1905515
    label: non-motile cilium assembly
  locations:
  - id: GO:0036064
    label: ciliary basal body
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - reference_id: PMID:26167768
  - reference_id: PMID:37188479
    supporting_text: endogenous NEK1–C21ORF2 complex in human cells
  - reference_id: PMID:37188479
    supporting_text: show major defects in ciliogenesis
  - reference_id: PMID:39703094
suggested_questions:
- question: 'Which repair-specific work does CFAP410 perform: does its NEK1 association control kinase
    stability, localization, substrate selection or phosphorylation in homologous recombination, beyond
    the demonstrated depletion phenotype?'
- question: Are reported mitochondrial and plasma-membrane pools isoform-, cell-type- or antibody-dependent,
    and do endogenous tagging and knockout controls confirm them?
- question: Are IFT and Hedgehog defects primary consequences of CFAP410 loss, or downstream effects of
    altered cilium assembly and structure?
suggested_experiments:
- hypothesis: CFAP410 supports NEK1 function through a separable binding-dependent mechanism.
  description: Reconstitute purified human NEK1 and CFAP410, compare wild-type and binding-disrupting
    variants for physical association, kinase kinetics and substrate phosphorylation, and rescue matched
    CFAP410-null cells with variants controlled for abundance.
  experiment_type: Biochemical reconstitution and cellular rescue
- hypothesis: Native peripheral plasma-membrane association can be distinguished from basal-body/ciliary
    localization and may depend on isoform or cell context.
  description: Compare endogenous isoform-aware tags in retinal epithelial cells, motor neurons and B
    cells, including EBV-transformed B cells. Confirm tagged-protein function and use CFAP410-null controls.
    Resolve membrane-associated signal from adjacent basal bodies/cilia by three-dimensional imaging with
    compartment markers, then test membrane association by orthogonal fractionation with plasma-membrane,
    mitochondrial, ER and cytosolic purity controls. Use extraction conditions that distinguish peripheral
    association from integral-membrane residence; extracellular surface labeling alone cannot assess a
    cytosolic peripheral pool.
  experiment_type: Endogenous tagging, compartment-resolved imaging and controlled fractionation
