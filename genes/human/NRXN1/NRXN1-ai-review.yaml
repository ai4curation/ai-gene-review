  review:
    summary: 'ISS from mouse Nrxn1 (IGI in alpha-neurexin multiple knockouts): alpha-neurexins are essential
      for Ca2+-triggered neurotransmitter release.'
    action: KEEP_AS_NON_CORE
    reason: Alpha-neurexin triple knockout severely impairs Ca2+-triggered release without abolishing
      synapse formation, because synaptic Ca2+ channel function is reduced; alpha-neurexins likewise support
