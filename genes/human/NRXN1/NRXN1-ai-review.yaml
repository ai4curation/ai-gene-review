existing_annotations:
- term:
    id: GO:0004888
    label: transmembrane signaling receptor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1096362
  - MGI:MGI:1096391
  - PANTHER:PTN002227321
  - RGD:628659
  review:
    summary: IBA from the neurexin clade node PTN002227321. Neurexins act as the presynaptic receptor
      for postsynaptic organizers such as LRRTM2 and neuroligins, whose presynaptic-differentiation activity
      requires neurexin.
    action: KEEP_AS_NON_CORE
    reason: 'The node placement is sound: neurexins in vertebrates and invertebrates bind postsynaptic
      ligands and neurexin knockdown abolishes LRRTM2-induced presynaptic differentiation, i.e. neurexin
      behaves as a receptor. However, how ligand binding is transduced across the presynaptic membrane
      is not established, and most of what neurexin does is as a bidirectional adhesion/organizer molecule
      (it equally acts as the ligand that induces postsynaptic differentiation). The adhesion-mediator
      and trans-synaptic signaling terms capture the core activity better, so this is retained as non-core.'
    supported_by:
    - reference_id: PMID:20064388
      supporting_text: LRRTM2 binds to both Neurexin 1alpha and Neurexin 1beta, and shRNA-mediated knockdown
        of Neurexin1 abrogates LRRTM2-induced presynaptic differentiation.
    - reference_id: PMID:20064387
      supporting_text: two unrelated postsynaptic cell-adhesion molecules, LRRTMs and neuroligins, unexpectedly
        bind to neurexins as the same presynaptic receptor
    - reference_id: PMID:15620359
      supporting_text: We show here that neurexin alone is sufficient to induce glutamate postsynaptic
        differentiation in contacting dendrites.
- term:
    id: GO:0005246
    label: calcium channel regulator activity
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9CS84
  review:
    summary: ISS from mouse Nrxn1, whose source annotation is an IGI from alpha-neurexin double/triple
      knockouts showing reduced synaptic Ca2+ channel function.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Alpha-neurexin deletion reduces synaptic Ca2+ current and Ca2+-triggered release, but the
      effect is indirect: cell-surface Ca2+ channel number is normal, and recordings from melanotrophs,
      transfected HEK cells and brainstem neurons showed that alpha-neurexins do not affect Ca2+ channel
      activation or inactivation directly; they appear to couple channels to release-ready vesicles. A
      molecular-function claim that NRXN1 itself modulates channel activity goes beyond this evidence.
      The biology is better represented at the process level (Ca2+-triggered neurotransmitter secretion).'
    supported_by:
    - reference_id: PMID:12827191
      supporting_text: Neurotransmitter release is impaired because synaptic Ca2+ channel function is
        markedly reduced, although the number of cell-surface Ca2+ channels appears normal.
    - reference_id: PMID:17035546
      supporting_text: alpha-neurexins do not affect the activation or inactivation properties of Ca2+
        channels directly but may be responsible for coupling them to release-ready vesicles and metabotropic
        receptors
- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q63372
  review:
    summary: ISS from rat neurexin-1. LNS domains of neurexins carry Ca2+-binding sites (UniProt annotates
      Ca2+-binding residues in LNS2, LNS4 and LNS6) and ligand binding is Ca2+-dependent.
    action: KEEP_AS_NON_CORE
    reason: 'Correct: mutating the LNS Ca2+-binding site abolishes dystroglycan binding, and neuroligin
      binding is Ca2+-dependent. Ca2+ acts as a structural cofactor at the ligand-binding edge of LNS
      domains rather than being the function in itself, so this is kept as a supporting, non-core activity.'
    supported_by:
    - reference_id: PMID:11470830
      supporting_text: As with the Ig fusion proteins, the GST fusion protein bound dystroglycan in a
        Ca2+-dependent manner; binding was completely abolished by the Ca2+-binding site mutant.
    - reference_id: file:human/NRXN1/NRXN1-uniprot.txt
      supporting_text: interactions with NLGN1, NLGN2, NLGN3 and NLGN4L are calcium-dependent
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:11152476
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q9H190
  review:
    summary: IPI for an interaction between the NRXN1 cytoplasmic tail and a PDZ-domain protein (SDCBP2/syntenin-2).
      The NRXN1 C-terminus ends in the class II PDZ-binding motif ...EYYV, which is how neurexins recruit
      CASK, Mints and other presynaptic PDZ scaffolds.
    action: MODIFY
    reason: Bare protein binding is uninformative. The partner is a PDZ-domain protein and the assay probes
      the neurexin cytoplasmic tail/C-terminal PDZ-binding motif, so the evidence supports the more informative
      GO:0030165 PDZ domain binding. This is consistent with the classic finding that neurexin I binding
      to the PDZ-containing MAGUK CASK depends on the three C-terminal residues. Rewriting the term does
      not imply that every screen-detected PDZ partner is physiologically relevant at the synapse.
    proposed_replacement_terms:
    - id: GO:0030165
      label: PDZ domain binding
    additional_reference_ids:
    - PMID:8786425
    - PMID:12827191
    supported_by:
    - reference_id: PMID:11152476
      supporting_text: syntenin-2alpha, which interacts with neurexin I
    - reference_id: PMID:8786425
      supporting_text: In neurexin I, this interaction is dependent on the C-terminal three residues.
    - reference_id: PMID:12827191
      supporting_text: link the pre- and postsynaptic compartments of synapses by binding extracellularly
        to postsynaptic cell adhesion molecules and intracellularly to presynaptic PDZ domain proteins
