id: Q9ULB1
gene_symbol: NRXN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9606
  label: Homo sapiens
description: 'Neurexin-1 (NRXN1) is a neuron-specific, presynaptic single-pass type I membrane protein
  and a central organizer of synapses. The gene uses two promoters: the upstream promoter produces the
  long neurexin-1-alpha isoforms described by this entry, whose extracellular region has six laminin/neurexin/sex-hormone-binding
  globulin (LNS) domains interspersed with three EGF-like repeats, and an internal promoter produces the
  short neurexin-1-beta isoforms (separate UniProt entry P58400) that carry only the sixth LNS domain;
  both share a heparan-sulfate-modified stalk, a transmembrane helix and a short cytoplasmic tail ending
  in a PDZ-binding motif. Extensive alternative splicing, most importantly at splice site 4 (SS4) in LNS6,
  controls which partners are bound. Through Ca2+-dependent binding of its LNS domains, NRXN1 forms cleft-spanning
  adhesion complexes with postsynaptic neuroligins (NLGN1-4), LRRTMs (SS4-lacking forms), latrophilins/CIRLs,
  dystroglycan and, via secreted cerebellins (SS4-containing forms), with delta-type glutamate receptors;
  alpha isoforms additionally bind neurexophilins. These complexes hold pre- and postsynaptic membranes
  together and signal in both directions: neurexin presented to dendrites induces clustering of glutamatergic
  and GABAergic postsynaptic components, and postsynaptic ligands induce presynaptic differentiation through
  neurexin. Intracellularly the tail binds PDZ scaffolds such as CASK and Mints. Alpha-neurexins are essential
  for Ca2+-triggered neurotransmitter release, organizing presynaptic terminals by functionally coupling
  Ca2+ channels to the release machinery, yet they are largely dispensable for synapse formation per se,
  so neurexins act mainly as context-dependent specifiers of synaptic properties. Neurexin-1 was first
  identified as the receptor for the spider venom neurotoxin alpha-latrotoxin. Heterozygous NRXN1 deletions
  confer risk for autism, schizophrenia and intellectual disability, and biallelic loss causes Pitt-Hopkins-like
  syndrome 2.'
