    summary: IBA to the very general signal transduction, from a broad node (PTN002309037) spanning neurexins
      and related LNS/neurexin-like proteins.
    action: MODIFY
    reason: 'Neurexin signalling is trans-synaptic: neurexin-partner complexes spanning the cleft convey
      organizing signals in both directions (neurexin induces postsynaptic differentiation, postsynaptic
      ligands induce presynaptic differentiation via neurexin). Beyond synapse organization, the neurexin-1
      SS4+ - cerebellin-2 - GluD1 complex controls postsynaptic NMDA receptor responses without changing
      synapse number, and mouse Nrxn1 carries GO:0099557 by IDA from that study. The informative term is
      therefore GO:0099557 trans-synaptic signaling by trans-synaptic complex, modulating synaptic transmission
      (a child of GO:0099545, used for NRXN3 on the same evidence). Generic signal transduction implies
      an intracellular cascade that is not established for neurexin.'
