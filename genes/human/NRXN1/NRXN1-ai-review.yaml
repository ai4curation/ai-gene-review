  review:
    summary: ISS (endoplasmic reticulum) from mouse Nrxn1; reflects biosynthetic/transit pools of a neuronal
      type I membrane protein rather than a site of action.
    action: MARK_AS_OVER_ANNOTATED
    reason: The ISS source is mouse Nrxn1 (UniProtKB:Q9CS84), but current mouse GOA carries no experimental
      annotation to this term, so the donor annotation is stale or was withdrawn. Newly synthesised type
      I membrane proteins necessarily transit the ER/nuclear envelope and secretory vesicles, and neurexins
      assemble with partners during biosynthesis, but these are transit compartments, not where NRXN1
      acts. NRXN1 functions at the presynaptic plasma membrane and active zone.
