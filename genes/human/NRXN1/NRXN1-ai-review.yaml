  supported_by:
  - reference_id: PMID:12827191
    supporting_text: Using triple-knockout mice, we show that alpha-neurexins are not required for synapse
      formation, but are essential for Ca2+-triggered neurotransmitter release.
  - reference_id: PMID:12827191
    supporting_text: alpha-neurexins organize presynaptic terminals by functionally coupling Ca2+ channels
      to the presynaptic machinery
  - reference_id: PMID:12827191
    supporting_text: link the pre- and postsynaptic compartments of synapses by binding extracellularly
      to postsynaptic cell adhesion molecules and intracellularly to presynaptic PDZ domain proteins
  - reference_id: PMID:8786425
    supporting_text: In neurexin I, this interaction is dependent on the C-terminal three residues.
  - reference_id: PMID:17035546
    supporting_text: Our data support a general and essential role for alpha-neurexins in Ca2+-triggered
      exocytosis that is similarly important for secretion from neurons and endocrine cells.
suggested_questions:
- question: What presynaptic molecule(s) transduce ligand binding by neurexin into presynaptic differentiation
    and Ca2+ channel coupling? The cytoplasmic tail binds CASK and Mints, but it is not established that
    these interactions carry the signal, so whether neurexin is a signaling receptor in the GO sense remains
    open.
- question: This review uses GO:0099557 (trans-synaptic signaling modulating transmission) for NRXN1 and
    NRXN3, where cerebellin-GluD1 evidence shows receptor tuning without synapse loss, and its parent GO:0099545
    for NRXN2, whose evidence is synapse organization. Should the postsynaptic partners (NLGN1-4, LRRTM1-4,
    CBLN1/2, GRID1/2) be annotated on the same split?
- question: Behaviour annotations (vocal learning, vocalization, adult behaviour, social behaviour) for
    NRXN1 derive from clinical features of patients with severe intellectual disability. Is there a curation
    convention for when patient phenotypes justify behaviour-process IMP annotations for a synaptic organizer?
suggested_experiments:
- hypothesis: Human NRXN1-alpha, like rodent neurexins, mediates cell-cell adhesion with LRRTM2, NLGN1
    and ADGRL1 in an SS4-dependent manner.
  description: Cell aggregation assays using human NRXN1-alpha SS4+ and SS4- isoforms against cells expressing
    human LRRTM2, NLGN1 and ADGRL1, with Ca2+ chelation and LNS6 Ca2+-site mutants as controls.
  experiment_type: cell aggregation assay
- hypothesis: NRXN1-alpha contributes to Ca2+ channel coupling at human synapses independently of NRXN2/3.
  description: Isogenic human iPSC-derived neurons with NRXN1-alpha-specific deletion versus pan-alpha-neurexin
    deletion; measure evoked release, presynaptic Ca2+ transients and release probability.
  experiment_type: electrophysiology in iPSC-derived neurons
