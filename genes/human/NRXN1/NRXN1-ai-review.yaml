core_functions:
- description: Presynaptic trans-synaptic adhesion molecule. From the presynaptic (active zone) membrane,
    the NRXN1 LNS domains bind postsynaptic neuroligins, LRRTMs and latrophilins (and cerebellin-GluD
    bridges) in Ca2+-dependent, SS4-regulated interactions, forming trans-synaptic complexes that physically
    link the pre- and postsynaptic membranes.
  molecular_function:
    id: GO:0098632
    label: cell-cell adhesion mediator activity
  directly_involved_in:
  - id: GO:0099560
    label: synaptic membrane adhesion
  locations:
  - id: GO:0042734
    label: presynaptic membrane
  - id: GO:0048787
    label: presynaptic active zone membrane
  in_complex:
    id: GO:0098820
    label: trans-synaptic protein complex
  supported_by:
  - reference_id: PMID:20064387
    supporting_text: Binding of neurexins to LRRTM2 can produce cell-adhesion junctions, consistent with
      a trans-interaction regulated by neurexin alternative splicing
  - reference_id: PMID:16242404
    supporting_text: neuroligin binding to alpha- and beta-neurexins mediates trans-synaptic cell adhesion
      but has distinct effects on synapse formation
  - reference_id: PMID:22262843
    supporting_text: Cell adhesion assays using cells expressing neurexins and CL1 revealed that their
      interaction produces a stable intercellular adhesion complex, indicating that their interaction
      can be trans-cellular.
  - reference_id: PMID:18923512
    supporting_text: Neurexins and neuroligins are synaptic cell-adhesion molecules that connect presynaptic
      and postsynaptic neurons at synapses, mediate signalling across the synapse, and shape the properties
      of neural networks by specifying synaptic functions
- description: 'Bidirectional trans-synaptic organizer. By binding the postsynaptic adhesion molecules
    neuroligins, LRRTMs and cerebellin-GluD, NRXN1 conveys organizing signals across the cleft: presented
    to dendrites it induces clustering of glutamatergic (PSD-95, LRRTM2) and GABAergic (NLGN2, gephyrin)
    postsynaptic components, and it serves as the presynaptic receptor through which LRRTM2, neuroligins
    and cerebellins induce presynaptic differentiation. Splice-site-4 choice selects which bridge forms,
    and the SS4+ neurexin-1 - cerebellin-2 - GluD1 bridge tunes postsynaptic NMDA receptor responses without
    changing synapse number.'
  molecular_function:
    id: GO:0050839
    label: cell adhesion molecule binding
  directly_involved_in:
  - id: GO:0099557
    label: trans-synaptic signaling by trans-synaptic complex, modulating synaptic transmission
  locations:
  - id: GO:0042734
    label: presynaptic membrane
  in_complex:
    id: GO:0098820
    label: trans-synaptic protein complex
  supported_by:
  - reference_id: PMID:15620359
    supporting_text: We show here that neurexin alone is sufficient to induce glutamate postsynaptic differentiation
      in contacting dendrites.
  - reference_id: PMID:15620359
    supporting_text: Surprisingly, neurexin also induces GABA postsynaptic differentiation.
  - reference_id: PMID:20064388
    supporting_text: LRRTM2 binds to both Neurexin 1alpha and Neurexin 1beta, and shRNA-mediated knockdown
      of Neurexin1 abrogates LRRTM2-induced presynaptic differentiation.
  - reference_id: PMID:20064387
    supporting_text: two unrelated postsynaptic cell-adhesion molecules, LRRTMs and neuroligins, unexpectedly
      bind to neurexins as the same presynaptic receptor
  - reference_id: PMID:20537373
    supporting_text: Here, we show that the N-terminal domain (NTD) of GluRdelta2 interacts with presynaptic
      neurexins (NRXNs) through cerebellin 1 precursor protein (Cbln1).
  - reference_id: PMID:21424692
    supporting_text: Whereas wild-type HA-neurexin1α induced robust clustering of glutamatergic postsynaptic
      components YFP-LRRTM2 and endogenous PSD-95 at dendrite contact sites
  - reference_id: PMID:34135511
    supporting_text: binding of presynaptic neurexin-cerebellin complexes to postsynaptic GluD1 controls
      glutamate receptor activity without affecting synapse numbers
- description: Presynaptic release-site organization by alpha-neurexins. The cytoplasmic tail binds presynaptic
    PDZ-domain scaffolds (CASK, Mints) and alpha-neurexins are essential for Ca2+-triggered neurotransmitter
    release, functionally coupling Ca2+ channels to the release machinery without being required for synapse
    formation. NRXN1 sets release properties rather than executing vesicle exocytosis itself, and Nrxn1-alpha
    single knockout lowers spontaneous excitatory release.
