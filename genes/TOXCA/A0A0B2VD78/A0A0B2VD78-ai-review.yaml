id: A0A0B2VD78
gene_symbol: tbb-4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6265
  label: Toxocara canis
description: >-
  tbb-4 encodes a 444 aa Toxocara canis beta-tubulin chain predicted from the
  PN_DK_2014 draft genome. The protein contains the conserved Tubulin/FtsZ
  GTPase and C-terminal beta-tubulin domains needed to heterodimerize with
  alpha-tubulin and contribute beta subunits to the microtubule lattice.
  Current UniProt/PANTHER searches place several T. canis beta-tubulin
  sequences in PTHR11588, including adjacent Tcan_18884 and Tcan_18889 loci on
  the same WGS scaffold, so A0A0B2VD78's isotype-level relationship to the
  benzimidazole-sensitive beta-tubulin pool has not been experimentally
  resolved.
