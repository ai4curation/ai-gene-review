knowledge_gaps:
- gap_statement: >-
    The T. canis beta-tubulin isotype or isotypes that form the
    benzimidazole-engaged microtubule target have not been genetically
    identified.
  boundary: >-
    The C. elegans BEN-1 beta-tubulin genetically defines one nematode
    benzimidazole-sensitive beta-tubulin, but this review did not find
    tbb-4-specific expression, loss-of-function, allele-swap, or
    resistance-mapping evidence showing that the T. canis locus encoding
    A0A0B2VD78 belongs to the equivalent drug-sensitive isotype pool.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Resolving the drug-sensitive Toxocara beta-tubulin isotype would define the
    on-target microtubule species for benzimidazole response and resistance
    surveillance.
  resolution: >-
    Reconcile cloned or expressed T. canis beta-tubulin sequences to the
    current genome models, then use isotype-resolved expression,
    resistance-allele surveillance and parasite perturbation or allele
    replacement to test whether tbb-4 encodes a benzimidazole-sensitive
    beta-tubulin.
  provenance:
  - reference_id: PMID:2592410
    supporting_text: >-
      Since the deletion strains appear to be fully resistant to the drugs, the
      ben-1 product appears to be the only benzimidazole-sensitive beta-tubulin
      in C. elegans.
    full_text_unavailable: true
suggested_questions:
- question: >-
    Which T. canis beta-tubulin loci encode the benzimidazole-sensitive
    microtubule pool, and is tbb-4/Tcan_18889 one of those loci?
suggested_experiments:
- description: >-
    Compare codon-167/198/200 haplotypes and isoform-resolved expression for
    the T. canis beta-tubulin repertoire, then perturb tbb-4 and other
    near-full-length candidates singly to test which loci alter parasite
    microtubule integrity, viability and benzimidazole sensitivity.
  hypothesis: >-
    A subset of T. canis beta-tubulin isotypes constitutes the
    benzimidazole-sensitive microtubule pool, and tbb-4 may be one such
    isotype.
  experiment_type: comparative genomics and targeted perturbation
