- id: PMID:25649139
  title: Genetic blueprint of the zoonotic pathogen Toxocara canis.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      This is a T. canis genome and transcriptome resource paper rather than a
      tbb-4 functional study; it is cited here because UniProt imports
      A0A0B2VD78 from the KHN79367.1 protein predicted on the genome accession
      submitted with this work.
  findings:
  - statement: >-
      Zhu et al. sequenced and annotated a 317 Mb draft genome and
      transcriptome of the T. canis PN_DK_2014 strain, providing the WGS
      assembly from which UniProt imports the A0A0B2VD78 gene model.
    supporting_text: >-
      Here we use next-generation sequencing to produce a draft genome and
      transcriptome of T. canis to support future biological and
      biotechnological investigations.
  - statement: >-
      The T. canis protein-coding gene set was built by merging de novo,
      RNA-seq, EST and homology-based predictions into a non-redundant GLEAN
      set.
    supporting_text: >-
      In addition, RNA-seq-, EST- and homology-based gene sets were predicted,
      which were then, together with de novo-predictions, subjected to analysis
      using the program GLEAN to infer a reference set of genes for T. canis.
- id: PMID:2592410
  title: >-
    Genetic and molecular analysis of a Caenorhabditis elegans beta-tubulin
    that conveys benzimidazole sensitivity.
  full_text_unavailable: true
  findings:
  - statement: >-
      C. elegans ben-1 encodes a beta-tubulin whose deletion confers full
      benzimidazole resistance while leaving animals viable and coordinated.
    supporting_text: >-
      Since the deletion strains appear to be fully resistant to the drugs, the
      ben-1 product appears to be the only benzimidazole-sensitive beta-tubulin
      in C. elegans.
