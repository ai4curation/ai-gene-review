  review:
    summary: InterPro2GO beta-tubulin GTPase assignment.
    action: ACCEPT
    reason: >-
      A0A0B2VD78 has the beta-tubulin InterPro signature, a Tubulin/FtsZ
      GTPase-domain signature and the conserved beta-tubulin domain
      architecture. This row keeps GO's enables qualifier by convention for
      beta-tubulins while core_functions models the activity as
      contributes_to_molecular_function; it should be read as the beta-chain
      contribution to the tubulin nucleotide cycle, not as evidence that
      T. canis tbb-4 was assayed in isolation or independently autohydrolyzes
      GTP away from an alpha/beta-tubulin interface. UniProt's rule text also
      describes the tubulin dimer nucleotide cycle, but it attributes GTPase
      activity to alpha-tubulin and is therefore used here only to contextualize
      the contributes-to framing.
