source_commit: fe3698c9e9df478c834c6deb6a6a22d9afba590e
reason: Retire inherited adaptor and bare protein-binding NEW proposals supported only by a report misapplied
  across organisms. Preserve their full original contents here; the active core now records the supported
  complex contribution.
retired_proposals:
- term:
    id: GO:0060090
    label: molecular adaptor activity
  evidence_type: ISS
  original_reference_id: file:METTP/gatC/gatC-deep-research-manual.md
  review:
    summary: GATC functions as a molecular adaptor that brings together GatA and GatB subunits to form
      the functional heterotrimer. Structural studies show GATC is positioned at the interface between
      the larger catalytic subunits, and mutations disrupting these interfaces destabilize the entire
      complex. This is GATC's core molecular function.
    action: NEW
    supported_by:
    - reference_id: file:METTP/gatC/gatC-deep-research-manual.md
      supporting_text: GATC is a small protein (~100 amino acids) that serves as a critical structural
        scaffold and catalytic cofactor in the GatCAB heterotrimer. GATC is essential for stabilizing
        the GatA glutaminase domain and enabling its binding to GatB.
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: ISS
  original_reference_id: file:METTP/gatC/gatC-deep-research-manual.md
  review:
    summary: GATC directly binds to both GatA and GatB subunits through specific interaction surfaces.
      The protein presents multiple contact points that enable it to serve as a bridge between the two
      larger catalytic subunits. This is a fundamental molecular function of GATC.
    action: NEW
    supported_by:
    - reference_id: file:METTP/gatC/gatC-deep-research-manual.md
      supporting_text: GATC directly binds to both GatA and GatB subunits through specific interaction
        surfaces, serving as a bridge between the two larger catalytic subunits.
