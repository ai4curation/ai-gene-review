    label: translation
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    action: MODIFY
    summary: GatC contributes to modification of an amino acid already attached to tRNA.
    reason: The supported mechanistic process is charged-tRNA amino acid modification. GO:0070681 is obsolete,
      and its Gln-specific native-pathway interpretation is not established for Methanothrix. Comparative
      archaeal evidence assigns GatCAB to Asn-tRNA formation and distinguishes GatDE-mediated Gln-tRNA
      formation. The target family assignment supports the GatCAB contribution by homology, not a target-specific
      substrate assay.
