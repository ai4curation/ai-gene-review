id: A0B5K3
gene_symbol: gatC
product_type: PROTEIN
taxon:
  id: NCBITaxon:349307
  label: Methanothrix thermoacetophila PT
description: GatC is a 93-residue GatC-family subunit of the heterotrimeric tRNA-dependent amidotransferase
  in Methanothrix thermoacetophila PT. Its conserved role is to contribute to GatCAB assembly and charged-tRNA
  amino-acid modification. Family assignment and comparative archaeal biology support a role in Asn-tRNA
  formation from Asp-tRNA; the native substrate range and physiological pathway allocation in this species
  are not experimentally established.
