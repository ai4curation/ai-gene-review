    Loaded with the mature crRNA, recognises a complementary single-stranded RNA transcript and
    cleaves it preferentially before uridines. Formation of a guide-target duplex of at least
    twenty base pairs drives the HEPN1 fold against HEPN2 to assemble one composite catalytic
    site, and the enzyme in that state is substrate-non-specific: it degrades unrelated bystander
