- term:
    id: GO:0004521
    label: RNA endonuclease activity
  evidence_type: IDA
  original_reference_id: PMID:27669025
  qualifier: enables
  review:
    summary: >-
      Purified LbuCas13a cleaves its own precursor crRNA within the repeat, and, once a
      complementary target transcript is bound, cleaves both that target and unrelated
      bystander RNA. The two reactions are at different sites and are chemically different:
      processing is metal-independent and leaves a 2',3'-cyclic phosphate, while target
      cleavage requires a divalent metal and is about eightyfold faster. Both are
      endonucleolytic cleavage of RNA, which is what this term states.
    action: NEW
    reason: >-
      GOA holds no annotation of any kind for this entry, so every row here is NEW. The step
      is performed by this protein itself, in both directions of the control experiment:
      HEPN mutants lose target cleavage but keep processing, and an R1079A mutant loses
      processing but keeps target cleavage, which locates both activities in this
      polypeptide and excludes a contaminating nuclease. GO:0004521 rather than its children
      GO:0016891 or GO:0016892 because each of those stipulates a hydrolytic mechanism and a
      particular phosphomonoester product; the processing reaction is metal-independent and
      yields a 2',3'-cyclic phosphate and a 5'-hydroxyl, which is neither, and the end-group
      chemistry of the HEPN target reaction is not established in the cited literature.
      GO:0004521 is defined without reference to mechanism and descends from GO:0004519 and
      GO:0004540 rather than from a hydrolase parent. One row covers both activities because
      GO cannot presently distinguish them; the distinction is carried in two separate
      core_functions entries.
