- id: PMID:40542106
  title: LbuCas13a directly targets DNA and elicits strong trans-cleavage activity.
  full_text_unavailable: true
  findings:
  - statement: LbuCas13a can base-pair with a DNA target without PFS or PAM restrictions and is
      activated for trans-cleavage by it
    supporting_text: We discover the ability of Leptotrichia buccalis Cas13a (LbuCas13a) to
