- term:
    id: GO:0099048
    label: CRISPR-cas system
  evidence_type: IC
  original_reference_id: PMID:27669025
  qualifier: involved_in
  review:
    summary: >-
      The native biological process. GO:0099048 names three stages, and LbuCas13a carries out
      two of them in its own right: it matures the crRNA from the array transcript, and it
      destroys a complementary transcript once the guide has engaged it. The gene sits in a
      type VI-A CRISPR-Cas locus, so the array that supplies its guides is present in the
      same organism.
    action: NEW
    reason: >-
      GOA holds no biological-process annotation for this entry, and GO:0099048 is the term
      GO provides for this system; it has no children, so there is no more specific
      alternative. The evidence code is IC rather than IMP because no interference phenotype
      has been measured for this ortholog: both activities are demonstrated in vitro with
      purified protein, and the step from those activities to the process is a curator's
      inference from them plus the locus context. Deliberately not ISS from the Leptotrichia
      shahii ortholog either, even though that one has a quantitative phage-immunity
      phenotype, because PMID:28475872 found the Cas13a family splits into two functionally
      orthogonal groups whose crRNA recognition and ssRNA cleavage specificities could not be
      predicted bioinformatically; the generic process is safe to infer within the family, the
      specificity is not, and IC states that honestly where ISS would overclaim. For the same
      reason GO:0051607 defense response to virus is NOT asserted here, only on P0DOC6.
    supported_by:
    - reference_id: PMID:27669025
