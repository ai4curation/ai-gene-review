- id: PMID:28475872
  title: RNA targeting by functionally orthogonal type VI-A CRISPR-Cas enzymes.
  full_text_unavailable: true
  findings:
  - statement: Type VI-A Cas13a carries two separate ribonuclease activities, for crRNA
      maturation and for ssRNA degradation
    supporting_text: In type VI-A CRISPR-Cas systems, the signature protein Cas13a (formerly
      C2c2) contains two separate ribonuclease activities that catalyze crRNA maturation and
      ssRNA degradation.
    reference_section_type: ABSTRACT
  - statement: The Cas13a family splits into two functionally orthogonal groups whose crRNA
      recognition and ssRNA cleavage specificities could not be predicted bioinformatically
    supporting_text: we show that the Cas13a enzyme family comprises two distinct functional
      groups that recognize orthogonal sets of crRNAs and possess different ssRNA cleavage
      specificities
    reference_section_type: ABSTRACT
  - statement: pre-crRNA processing is not essential for ssRNA cleavage but enhances targeting
      by array-internal crRNAs
    supporting_text: we find that Cas13a pre-crRNA processing is not essential for ssRNA
      cleavage, although it enhances ssRNA targeting for crRNAs encoded internally within the
      CRISPR array
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached abstract only (publisher restricts PMC full text). Cited correctly, and load-bearing
      here in two ways: it supplies the family-level statement of the two activities, and its
      finding that the family's specificities cannot be predicted from sequence is the reason the
      process annotation on this entry is IC rather than ISS from the better-characterised
