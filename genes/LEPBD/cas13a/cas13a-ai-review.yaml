    reference_section_type: ABSTRACT
  - statement: The DNA target itself is not degraded
    supporting_text: 'Contrary to conventional understanding, LbuCas13a does not degrade DNA
      targets.'
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Cached abstract only (no PMC record). The identifier resolves to the intended paper and the
      claim is correctly represented, but the citation is easy to misread: UniProt summarises it as
      "Also targets DNA", which looks like a DNase claim, whereas the abstract states explicitly
      that the DNA is not degraded - a DNA target base-pairs with the guide and activates the HEPN
      site, whose trans activity then destroys RNA. No DNA nuclease function is asserted on that
      basis. Relevance is LOW because the work is a genotyping-platform paper and makes no claim
      about Leptotrichia buccalis biology.
core_functions:
- description: >-
    Matures its own CRISPR guide, cleaving the precursor crRNA transcribed from the array within
    the repeat, with no tracrRNA and no dedicated Cas6-type ribonuclease. The reaction is
    metal-independent, unaffected by EDTA or EGTA, and leaves a 2',3'-cyclic phosphate on the 5'
    product and a 5'-hydroxyl on the 3' product, so it is a transesterification rather than a
    hydrolysis to a phosphomonoester. Recognition depends on the structure of the repeat hairpin
    and the sequences flanking it, with no dependence on the spacer. The catalytic site is
    distinct from the HEPN target-cleavage site, as shown reciprocally: HEPN substitutions leave
    processing intact, and an R1079A substitution outside the HEPN motifs attenuates processing
    while leaving target cleavage and crRNA binding intact. Processing is not strictly required
    for target cleavage but enhances the use of guides encoded internally in the array.
