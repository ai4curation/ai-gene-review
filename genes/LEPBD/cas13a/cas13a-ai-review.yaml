proposed_new_terms:
- proposed_name: guide RNA-dependent nucleic acid endonuclease activity
  proposed_definition: >-
    Catalysis of the cleavage of ester linkages within a nucleic acid molecule by creating internal
    breaks, where the position of cleavage is determined by base pairing between the substrate and
    a separate guide RNA bound non-covalently by the enzyme. The guide RNA is neither substrate nor
    product; it programs the sequence specificity of an enzyme whose active site is otherwise
    sequence-non-specific, so that the specificity of the catalysis is a property of the bound
    guide rather than of the protein.
  proposed_parent:
    id: GO:0004519
    label: endonuclease activity
  justification: >-
    GO has no molecular-function term for guide-RNA-programmed target recognition or cleavage.
    Checked against the current GO release: no molecular-function label contains "RNA-guided",
    "guide RNA" or "CRISPR". The consequence is that every CRISPR effector, and every other
    guide-dependent nuclease, can only be annotated with a term that describes its chemistry
    (GO:0004520, GO:0004521, GO:0004530, GO:1990238) and is therefore indistinguishable in GO from
    an unguided nuclease of the same chemistry. LbuCas13a makes the cost unusually visible, because
    its two reactions are separable in both directions by mutation, differ in metal requirement and
    in product chemistry, and sit in different domains, yet both have to be annotated with the same
    single term GO:0004521 - and the property that distinguishes them is precisely guide dependence.
    Two children are needed, guide RNA-dependent DNA endonuclease activity (Cas9 and Cas12 families)
    and guide RNA-dependent RNA endonuclease activity (Cas13 and type III effectors), and the parent
    would also accommodate class 1 multi-subunit effectors through contributes_to. This request is
    deliberately scoped to the nuclease function rather than to recognition in general, so that
    catalytically dead guide-loaded effectors - which Cas13a HEPN mutants are, and which retain full
    crRNA and target binding - are handled by a binding term instead. This is the same request as in
    the reviews of U2UMQ6, A0Q7Q2 and P0DOC6 and should be merged with them.
  supported_by:
  - reference_id: PMID:28757251
    supporting_text: Cas13a, a type VI-A CRISPR-Cas RNA-guided RNA ribonuclease, degrades invasive
      RNAs targeted by CRISPR RNA (crRNA)
  - reference_id: PMID:27669025
    supporting_text: Here we show that bacterial C2c2 possesses a unique RNase activity responsible
      for CRISPR RNA maturation that is distinct from its RNA-activated single-stranded RNA
      degradation activity. These dual RNase functions are chemically and mechanistically different
      from each other
- proposed_name: defense response to virus by induction of host dormancy
  proposed_definition: >-
    A defense response to virus in which the infected cell halts its own growth and enters a
    reversible non-growing state, so that the viral replication cycle cannot be completed. The
    invader is not cleared from the infected cell and the cell does not necessarily lyse; the
    protective output is realised at the level of the population, because an arrested cell continues
    to adsorb virions while producing no progeny.
  proposed_parent:
    id: GO:0051607
    label: defense response to virus
  justification: >-
    Type VI-A immunity does not work by destroying the invader. Target recognition licenses
    indiscriminate cleavage of cellular transcripts, and it is that degradation, not clearance of the
    phage, that halts the infection; trans-cleavage alone is sufficient to abort the infectious
    cycle. GO cannot express this. The nearest existing terms fail in different ways: GO:0051607
    defense response to virus is correct but silent about the mechanism and about the fate of the
    infected cell; GO:0022611 dormancy process and its children GO:0097436 and GO:0097437 descend
    from GO:0032502 developmental process and describe a developmental programme, so applying them to
    phage-induced bacterial growth arrest would be a branch error rather than a stretch; and
    GO:0012501 programmed cell death is wrong because the arrest is reversible and the cell is not
    killed. On the question of which entity performs the step, the answer here favours the term:
    Cas13a itself degrades the host transcripts, and the arrest follows directly from that
    degradation rather than being executed by something else. The gap is not specific to CRISPR:
    abortive-infection defence by growth arrest is shared with toxin-antitoxin systems, retrons and
    Thoeris, none of which can be annotated for it either, so a term under GO:0051607 would serve a
    whole class of prokaryotic defence systems. No annotation to this term is asserted on C7NBY4,
    because the dormancy outcome was demonstrated on the Listeria seeligeri ortholog and this entry
    has no in vivo infection data of its own. This is the same request as in the review of P0DOC6 and
    should be merged with it.
  supported_by:
  - reference_id: PMID:31142834
    supporting_text: Here we show that trans-cleavage of transcripts halts the growth of the host
      cell and is sufficient to abort the infectious cycle.
  - reference_id: PMID:31142834
    supporting_text: we believe that the fundamental feature of type VI-A immunity is the dormancy of
      the host cell produced by the destruction of host transcripts. This is similar to other phage
      defense strategies known as abortive infection
  - reference_id: PMID:27669025
    supporting_text: the activation of C2c2 to cleave thousands of trans-RNAs for every target RNA
      detected enables potent signal amplification
suggested_questions:
- question: >-
    Is the Leptotrichia buccalis type VI-A system functional as immunity in its own host, and what do
    its native spacers match? No interference experiment on this ortholog exists in the cited
    literature, which is why the process annotation here is IC rather than IMP.
- question: >-
    What are the end-group products of LbuCas13a target-RNA cleavage, as opposed to pre-crRNA
    cleavage? The processing chemistry is settled (metal-independent, 2',3'-cyclic phosphate and
    5'-OH) but the HEPN reaction is not, and no term below GO:0004521 can be justified for it until it
    is.
- question: >-
    Does target-activated trans cleavage arrest a Leptotrichia buccalis host as it arrests a Listeria
    seeligeri host, and is the arrest reversible? This bears directly on whether the proposed
    dormancy term would ever be annotated to this gene.
- question: >-
    Does activation by a DNA target, reported without PFS or PAM restriction and without cleavage of
    the DNA, occur at physiological guide and target concentrations, and does it have any consequence
    for a cell carrying this locus?
- question: >-
    What holds the HEPN site inactive in the guide-loaded but unengaged enzyme, such that activation
    needs a twenty-base-pair duplex yet responds to ten femtomolar target and then turns over
    thousands of bystander RNAs?
- question: >-
    What determines the functional split in the Cas13a family, which could not be predicted
    bioinformatically? Until this is understood, guide and substrate specificity should not be
    propagated between orthologs by sequence similarity.
suggested_experiments:
- description: >-
    Challenge a Leptotrichia buccalis strain, or a tractable host carrying the reconstituted locus,
    with phages matched to its native spacers, and compare wild type against the HEPN and R1079A
    mutants, to convert the IC process annotation into an IMP one and to test whether the system
    confers immunity at all.
- description: >-
    Determine the chemical end groups of LbuCas13a target-RNA cleavage products by alkaline
    phosphatase and T4 polynucleotide kinase treatment, exactly as was done for the pre-crRNA
    products, to establish whether the HEPN reaction is hydrolytic and which GO child term applies.
- description: >-
    Follow growth, viability and colony-forming ability of cells after targeted infection, with and
    without the HEPN mutants, to test whether this ortholog arrests its host and whether arrested
    cells resume growth.
- description: >-
    Repeat the DNA-target activation experiment with physiological concentrations and a
    non-diagnostic readout, and ask whether a DNA target competes with RNA targets for the loaded
    enzyme, which would make DNA binding a liability for immunity rather than an extension of it.
- description: >-
    Sequence the native Leptotrichia buccalis CRISPR array and search its spacers against phage and
    plasmid databases, to establish whether the system is directed at RNA phages, at transcripts of
    DNA phages, or at mobile elements.
