id: A0A8C5FPT8
gene_symbol: tbc1d14
taxon:
  id: NCBITaxon:8049
  label: Gadus morhua
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for Atlantic cod TBC1D14, a TBC-domain protein that
  functions as a RAB11 effector and TRAPPIII-recruiting scaffold rather than as a
  catalytically active Rab-GAP. ProTrek's top two calls describe exactly the trafficking
  route this review attributes to the protein - recycling endosome to Golgi transport,
  and vesicle tethering to Golgi - and both are strict refinements of GOA's generic
  vesicle-mediated transport. The failure is the one the TBC domain invites: rank 4
  asserts activation of GTPase activity, the canonical Rab-GAP function that mammalian
  TBC1D14 has been shown *not* to perform on RAB11. ProtNLM2 predicted autophagosome for
  the same protein, which is downstream of the right biology but is a compartment
  TBC1D14 regulates rather than occupies.
  Assessment: 2 correct novel (COR), 1 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/GADMO/A0A8C5FPT8/A0A8C5FPT8-uniprot.txt
