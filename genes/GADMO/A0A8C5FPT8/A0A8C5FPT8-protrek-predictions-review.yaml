predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0071955
      label: recycling endosome to Golgi transport
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 15.59), absent from GOA and a strict descendant of the
        annotated vesicle-mediated transport. It matches this review's core account
        precisely: TBC1D14 coordinates membrane exchange between RAB11-positive recycling
        endosomes and the early Golgi/ERGIC. A specific, correct and genuinely new call.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0099041
      label: vesicle tethering to Golgi
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Rank 2 (score 15.07), also absent from GOA. TBC1D14 recruits the TRAPPIII tethering
        complex via its TRAPP-binding region, so a tethering role at the Golgi is the correct
        mechanistic description of what the scaffold does. Correct and novel, though a
        curator would want to check whether the protein tethers directly or recruits the
        tether.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0032483
      label: regulation of Rab protein signal transduction
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PSEUDOENZYME_OVERANNOTATION
      summary: >-
        Rank 3 (score 14.96). Together with rank 4 (activation of GTPase activity) this is
        the TBC-domain assumption: that a protein carrying the Rab-GAP fold regulates Rab
        nucleotide state. Studies of the mammalian orthologs show TBC1D14 has no GAP activity
        toward RAB11 and acts as an effector instead, which is why this review assigns small
        GTPase binding rather than GTPase activator activity as the core function. The
        existing GOA already carries the same over-annotation by IEA (GTPase activator
        activity), so ProTrek is reproducing a known error rather than introducing one - but
        it is still the wrong call, and a retrieval model has no way to notice that a domain
        is degenerate.
      supported_by:
        - reference_id: GO_REF:0000002
          supporting_text: Gene Ontology annotation through InterPro
