predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0005776
      label: autophagosome
    predicted_term_type: GO_CC
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Autophagosome is not among the cod gene's GOA terms; its only related annotation is the broader
        ARBA vacuole term (autophagosome is_a vacuole per OLS4), so the prediction is novel and more
        specific. The re-review sequence tree places cod tbc1d14 inside the vertebrate TBC1D14 clade,
        separate from TBC1D12, which makes the PANTHER SF15 assignment a subfamily mis-routing; the cod
        protein retains the TBC1D14 architecture and has its strongest phmmer match to reviewed bovine
        TBC1D14. Human TBC1D14 has an IDA autophagosome annotation from PMID:22613832 (partial
        colocalization of endogenous protein with LC3), and PAINT placed the same term on the
        TBC1D14-clade node; the human gene review keeps both rows as correct but non-core. This is a
        justified orthology transfer of experimentally grounded evidence. The localization is peripheral
        and partial: TBC1D14 acts mainly from recycling endosomes and the Golgi to regulate autophagosome
        formation, and no fish experiment addresses it, so it should not be read as constitutive residence.
      supported_by:
