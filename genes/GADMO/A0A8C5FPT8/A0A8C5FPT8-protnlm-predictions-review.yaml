id: A0A8C5FPT8
gene_symbol: tbc1d14
taxon:
  id: NCBITaxon:8049
  label: Gadus morhua
status: COMPLETE
description: >-
  Atlantic cod tbc1d14 falls inside the vertebrate TBC1D14 clade by sequence phylogeny, despite its
  PANTHER SF15 (TBC1D12-like) placement. Human TBC1D14 carries an experimentally supported, partial
  autophagosome localization that PAINT places on the TBC1D14-clade node, so the single ProtNLM2
  autophagosome prediction is a supported, peripheral localization transfer; the ortholog's predominant
  compartments are recycling endosomes and, on starvation, the Golgi.
