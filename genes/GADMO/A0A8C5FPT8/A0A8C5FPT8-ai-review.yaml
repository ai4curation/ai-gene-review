id: A0A8C5FPT8
gene_symbol: tbc1d14
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8049
  label: Gadus morhua
description: >-
  tbc1d14 encodes a TBC (Tre2-Bub2-Cdc16) Rab-GAP-domain protein of the vertebrate TBC1D14
  orthology group. In vertebrates it acts as a non-catalytic regulator of membrane traffic
  between recycling endosomes and the early Golgi. Characterised mammalian TBC1D14 binds the
  GTP-bound forms of RAB11A and RAB11B, but it shows no detectable GAP activity toward RAB11
  or a broad panel of other Rabs, and it behaves as a RAB11 effector. Its N-terminal region
  binds the TRAPPIII tethering complex through TRAPPC8, which is needed for RAB1 activation.
  The protein also binds the autophagy kinase ULK1. TBC1D14 sits on RAB11-positive recycling
  endosomes and moves toward the Golgi under amino-acid starvation. It controls the supply of
  recycling-endosome membrane and the cycling of ATG9 to sites of autophagosome formation,
  and so acts as a negative regulator of starvation-induced macroautophagy. The Atlantic cod
  protein shares this architecture: an N-terminal disordered region, a TRAPP-binding segment
  aligned to the mammalian region, a coiled coil, and a C-terminal TBC domain (residues
  388-596) that keeps the arginine- and glutamine-finger residues.
existing_annotations:
- term:
    id: GO:0005096
    label: GTPase activator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      TreeGrafter transfer from PANTHER node PTN009208344. The cod protein was placed in
      PTHR47219:SF15 (the TBC1D12 subfamily) and inherits GAP activity from a deep node seeded
      by RABGAP1/RABGAP1L. The re-review tree puts cod tbc1d14 inside the vertebrate TBC1D14
      clade, not with TBC1D12, so the correct comparator is TBC1D14. Human TBC1D14 binds
      GTP-locked RAB11A and RAB11B. In a screen of 47 [32P]GTP-loaded Rabs, recombinant TBC1D14
      showed no detectable GAP activity, and the authors describe it as having no GAP activity.
      The arginine- and glutamine-finger positions are retained in the cod sequence (R457/Q493).
      Keeping these residues does not show catalysis.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The direct experimental test on the ortholog is negative: no GAP activity toward RAB11 or
      46 other Rabs. The ortholog's function is that of a Rab11 effector and TRAPPIII scaffold.
      The term reaches cod only through a subfamily placement that the phylogeny does not
      support. PAINT does propagate GTPase activator activity to human TBC1D14 from a deep
      TBC-family node, and a substrate outside the tested panel cannot be ruled out formally,
      so this is recorded as an over-annotation rather than a removal.
    supported_by:
    - reference_id: PMID:22613832
      supporting_text: We then performed a GAP assay screen using a panel of 47 Rabs loaded
        with [32P]GTP but were unable to detect GAP activity with either recombinant GST-TBC1D14
    - reference_id: PMID:22613832
      supporting_text: S4 shows that TBC1D14 has no GAP activity toward a panel of GTP-loaded
        mammalian Rab proteins.
    - reference_id: file:GADMO/A0A8C5FPT8/A0A8C5FPT8-deep-research-falcon.md
      supporting_text: TBC1D14 does not function as a canonical GAP for RAB11
    - reference_id: file:GADMO/A0A8C5FPT8/A0A8C5FPT8-bioinformatics/RESULTS-rereview.md
      supporting_text: The catalytic residues
        are retained, but retaining them does not show GAP activity.
