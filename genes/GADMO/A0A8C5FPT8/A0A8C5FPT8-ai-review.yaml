- term:
    id: GO:0016192
    label: vesicle-mediated transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  review:
    summary: >-
      ARBA rule-based process. The mammalian ortholog regulates membrane traffic from
      RAB11-positive recycling endosomes. The proposed model is a constitutive step from
      peripheral recycling endosomes to the early Golgi, mediated by TRAPPIII and RAB1, that
      maintains the cycling ATG9 pool. More specific GO transport terms (e.g. GO:0042147
      retrograde transport, endosome to Golgi) are not annotated to the experimentally studied
      ortholog. The precise transport step is a proposed model, not a measured transport
      reaction.
    action: ACCEPT
    reason: >-
      The term is correct and is as specific as the evidence allows. TBC1D14 is part of the
      membrane-trafficking machinery: it binds RAB11, recruits TRAPPIII and is required for
      RAB1 activation. The exact transport step it carries out is not established well enough
      to justify a narrower process term.
    supported_by:
    - reference_id: PMID:26711178
      supporting_text: We also demonstrate that TBC1D14 is required for activation of RAB1
        through its TRAPP‐binding ability.
    - reference_id: PMID:26711178
      supporting_text: In support of an interaction of TBC1D14 and TRAPPIII, it has been
        shown that exchange between the transferrin/RAB11‐positive RE and the RAB1‐positive
        ERGIC/early Golgi can occur
- term:
    id: GO:0019899
    label: enzyme binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  review:
    summary: >-
      ARBA rule-based function. The term is true but uninformative. The enzyme partners
      documented for the ortholog are the small GTPases RAB11A/B, bound in the GTP-loaded form,
      and the autophagy kinase ULK1. Both are better described by specific descendants of
      enzyme binding: small GTPase binding (GO:0031267, already carried by this gene) and
      protein kinase binding (GO:0019901).
    action: MODIFY
    reason: >-
      The term is correct but too general. Replace it with the specific supported descendants
      small GTPase binding (RAB11) and protein kinase binding (ULK1).
    proposed_replacement_terms:
    - id: GO:0031267
      label: small GTPase binding
    - id: GO:0019901
      label: protein kinase binding
