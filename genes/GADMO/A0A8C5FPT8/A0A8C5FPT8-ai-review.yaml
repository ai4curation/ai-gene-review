  title: TBC1D14 regulates autophagy via the TRAPP complex and ATG9 traffic.
  findings:
  - statement: >-
      TBC1D14 binds TRAPPIII via TRAPPC8 through an N-terminal region and is required for RAB1
      activation and ATG9 trafficking; it acts as a negative regulator of autophagy.
    supporting_text: We also demonstrate that TBC1D14 is required for activation of RAB1
      through its TRAPP‐binding ability.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; defines the TRAPPIII scaffold mechanism in mammalian cells.
