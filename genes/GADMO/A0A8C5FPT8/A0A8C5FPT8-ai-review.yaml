  title: Re-review sequence analysis of cod tbc1d14 (gene model, orthology, catalytic residues)
  findings:
  - statement: >-
      All cod tbc1d14 entries are transcripts of ENSGMOG00000018292; A0A8C5FPT8 is an
      alternative model with a non-conserved N-terminus and a non-conserved 48-residue
      C-terminal tail; it groups with vertebrate TBC1D14, not TBC1D12, despite PANTHER SF15.
    supporting_text: A0A8C5FPT8 is therefore a
      near-complete alternative gene model.
