      ARBA rule-based location. In GO, the only route from TBC1D14 biology to vacuole is
      autophagosome (GO:0005776), which is_a vacuole. Mammalian TBC1D14 is mainly on recycling
      endosomes and moves to the Golgi on starvation. Its contact with autophagosome-forming
      membrane comes from overexpressed protein on ULK1-positive tubules. No lysosomal or
      vacuolar residence has been reported.
