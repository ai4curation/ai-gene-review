suggested_questions:
- question: >-
    Should PANTHER move teleost and coelacanth tbc1d14 from PTHR47219:SF15 (TBC1D12) to SF21
    (TBC1D14)? A distance tree puts them in the TBC1D14 clade, and the SF15 placement routes
    TBC1D12/RABGAP1 node annotations to them while blocking the TBC1D14-clade PAINT terms.
  experts: []
- question: >-
    Does cod tbc1d14 retain any GAP activity toward a Rab outside the 47-Rab panel tested for
    the human ortholog, given that its arginine and glutamine fingers are intact?
  experts: []
- question: >-
    Is the non-conserved 48-residue C-terminal tail of the A0A8C5FPT8 model supported by
    transcript evidence, or is it a read-through artefact relative to the A0A8C5FCB4 model?
  experts: []

suggested_experiments:
- description: >-
    Pulldown of recombinant cod tbc1d14 with GTP- and GDP-locked cod rab11a/rab11b, and
    co-immunoprecipitation with trappc8, to test whether the effector and TRAPPIII-scaffold
    interactions are conserved in teleosts.
  hypothesis: Cod tbc1d14 binds active Rab11 and TRAPPIII as the mammalian ortholog does.
- description: >-
    RT-PCR or long-read sequencing across the 3' end of ENSGMOG00000018292 to determine which
    C-terminal exon (conserved ...QKDQERSSPVLRR versus the A0A8C5FPT8 tail) is used in vivo.
  hypothesis: The conserved C-terminus of the A0A8C5FCB4 model is the predominant product.
