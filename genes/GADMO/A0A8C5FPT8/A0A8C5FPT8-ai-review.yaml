- term:
    id: GO:2000785
    label: regulation of autophagosome assembly
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. PAINT placed regulation of autophagosome assembly on node
      PTN008586039, seeded by human TBC1D14 IMP data, which covers the TBC1D14 clade. The cod
      protein belongs to that clade by phylogeny but was routed by TreeGrafter through SF15
      and so did not inherit the term. TBC1D14 does part of the regulatory work itself: it
      binds RAB11 and TRAPPIII and is required for RAB1 activation and ATG9 cycling. This is
      the role the curators assigned, not a downstream phenotype.
    action: NEW
    reason: >-
      The term matches the ortholog's established role and the PAINT node that covers the
      TBC1D14 clade. It is missing in cod only because of a subfamily mis-assignment shown by
      the re-review tree.
    supported_by:
    - reference_id: PMID:26711178
      supporting_text: We show here TBC1D14 acts as a negative regulator of autophagy by
        modulating the contribution of both RE and Golgi membranes to the growing autophagosome
        through its interaction with Rab11 and TRAPPIII.
    - reference_id: file:GADMO/A0A8C5FPT8/A0A8C5FPT8-bioinformatics/RESULTS-rereview.md
      supporting_text: the two cod
        tbc1d14 models fall inside the vertebrate TBC1D14 clade

