        the other 55 Rabs tested
    - reference_id: PMID:22613832
      supporting_text: TBC1D14 and ULK1 interact and colocalize on TBC1D14-induced tubules
- term:
    id: GO:0031267
    label: small GTPase binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: >-
      TreeGrafter transfer. It arrives through the SF15 placement, but the function is
      independently supported for the true ortholog group. Human TBC1D14 binds GTP-locked
      RAB11A and RAB11B selectively in a yeast two-hybrid screen of GTP-locked Rabs. RAB11
      binding recruits the protein to recycling endosomes, and loss of RAB11 prevents
      TBC1D14-induced tubulation. The cod protein falls in the TBC1D14 clade and keeps the
      TBC domain through which Rab binding occurs. The more specific Rab GTPase binding term
      (GO:0017137) is obsolete, so small GTPase binding is the appropriate term.
    action: ACCEPT
    reason: >-
      Binding of active RAB11 is the best-characterised molecular activity of TBC1D14
      orthologs, and the cod protein is a phylogenetic member of that orthology group.
    supported_by:
    - reference_id: PMID:22613832
      supporting_text: TBC1D14 binds specifically to both Rab11a and 11b but not to any of
        the other 55 Rabs tested
