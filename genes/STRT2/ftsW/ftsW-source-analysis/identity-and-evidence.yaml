identity_and_construct_scope: Q5M5I9, ftsW/stu0486, current 431 residues, LMG18311.
  PMID30692671 calls the construct M1–R426. Supplementary Table 5 primers oAT01/oAT02
  align to CP000023.1 CDS 465656..466951 at relative nucleotides 15..1296, encoding
  current residues 6–431. Paper D292A/L345G map to current D297A/L350G. Current UniProt
  sequence version 1 dates from 2005; this is a five-residue construct omission, not
  evidence of a later database extension or proven native start-site error.
interpretation_limits: Direct biochemical evidence is on the shortened 426-residue
  construct. Native full-length kinetics and physiological flipping are not established
  by that assay. The positive polymerase result does not exclude every possible secondary
  flippase activity.
