gene_symbol: ftsW
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:264199
  label: Streptococcus thermophilus LMG 18311
description: FtsW is the membrane-integrated SEDS peptidoglycan polymerase of Streptococcus
  thermophilus LMG18311. It extends glycan strands from lipid II in association with a compatible
  class-B penicillin-binding protein, PBP2x. The partner transmembrane interaction activates FtsW
  even when PBP2x transpeptidase catalysis is disabled. Purified activity has been demonstrated
  using an N-terminally shortened FtsW construct.
