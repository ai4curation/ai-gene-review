- term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:30692671
  qualifier: involved_in
  review:
    summary: The purified FtsW construct directly polymerizes peptidoglycan.
    action: NEW
    reason: The protein itself performs glycan-chain synthesis, satisfying the participation test
      independently of mutant necessity. The assay used this strain-derived construct with a compatible
      PBP partner; exact construct omissions and substrate donor are documented in the core and identity
      analysis. QuickGO comparator checks of same-role E. coli FtsW P0ABG4 and Bacillus FtsW O07639
      found the same process assertion. That check tests annotation convention and is not cited as
      biological evidence. Current GO parents describe chemical formation; none of the target existing
      BP terms is its ancestor or descendant. The cached GO-CAM index has no target entry supplying
      a conflicting role.
    supported_by:
    - reference_id: PMID:30692671
      supporting_text: when we added the cognate divisome bPBP to the FtsW reactions, peptidoglycan
        polymers were produced
