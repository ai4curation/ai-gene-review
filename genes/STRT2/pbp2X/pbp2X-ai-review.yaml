  label: Streptococcus thermophilus LMG 18311
description: 'PBP2x is a membrane-anchored class-B penicillin-binding protein of Streptococcus thermophilus
  LMG18311. Its serine transpeptidase domain crosslinks peptidoglycan peptide stems, while its transmembrane
  segment activates the cognate FtsW glycan polymerase. These functions are separable: a catalytically
  inactive PBP2x can activate FtsW, and a soluble PBP2x domain can crosslink polymer synthesized
  by other glycosyltransferases.'
