    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    supporting_entities:
      - PANTHER:PTN002024644
    review:
      summary: Peptidoglycan crosslinking contributes directly to cell wall organization.
      action: ACCEPT
      reason: 'The inherited wall-assembly role is sound: peptide crosslinking organizes the peptidoglycan
        wall. GO:0009252 is a separately supported biosynthetic process, not a descendant that replaces
        GO:0071555. Retain the true organizational claim, alongside the separately supported biosynthetic
        chemistry.'
      supported_by:
