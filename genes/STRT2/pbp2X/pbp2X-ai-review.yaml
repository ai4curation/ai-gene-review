proposed_new_terms:
- proposed_name: serine-type peptidoglycan D,D-transpeptidase activity
  proposed_definition: 'Catalysis of peptide crosslink formation in peptidoglycan by a serine-dependent
    D,D-transpeptidase: transfer of the donor D-Ala4 acyl group from a pentapeptide stem to an amino
    acceptor on another stem or its bridge, with release of terminal D-Ala5. The acceptor chemistry
    depends on the organism; this differs from L,D-transpeptidase-mediated 3–3 linkage formation.'
  justification: The reviewed enzyme performs the class-B PBP crosslink reaction; neither a carboxypeptidase
    hydrolysis term nor an L,D-transpeptidase term accurately represents this endpoint. Reaction
    and physiological-scope limits are stated in the core description.
  supported_by:
  - reference_id: PMID:30692671
    supporting_text: Catalytic inactivation of StPBP2x led to the disappearance of this peak
