  qualifier: enables
  supporting_entities:
  - InterPro:IPR001460
  - InterPro:IPR005311
  - InterPro:IPR036138
  - PANTHER:PTN002024644
  review:
    summary: Beta-lactam binding reports the PBP active site but is not its native catalytic function.
    action: KEEP_AS_NON_CORE
    reason: The penicillin-binding claim is appropriate for this class-B PBP and is retained as an
      experimentally useful drug-binding property. Native function is peptide crosslinking and, for
      the cognate divisomal PBPs, a separable physical role in synthase assembly. Drug binding alone
      is not proof of net transpeptidation. The term is retained as a conserved PBP-family inference;
      the 2019 crosslinking assay is not represented as a direct penicillin-binding measurement.
    supported_by:
    - reference_id: PMID:30692671
      supporting_text: Catalytic inactivation of StPBP2x led to the disappearance of this peak
- term:
    id: GO:0071555
    label: cell wall organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002024644
  review:
    summary: Cell-wall organization is refined to peptidoglycan biosynthesis.
    action: MODIFY
    reason: This PBP contributes by peptide crosslink formation during peptidoglycan synthesis. The
      specific biosynthetic process is supported rather than a generic wall-organization role. Catalyzes
      serine-dependent D,D transpeptidation of peptidoglycan peptide stems. LC-MS detected a crosslinked
      dimer that disappeared with PBP2x catalytic inactivation. Activity also occurs with polymer
      produced by SgtB or transpeptidase-dead PBP1a and survives deletion of the PBP2x transmembrane
      segment; therefore crosslink catalysis is not an activity supplied only by an inseparable FtsW–PBP2x
      complex. The assay used E. faecalis substrate and does not fix the exact native S. thermophilus
      bridge chemistry. This is a lateral mechanistic refinement from wall assembly to chemical biosynthesis;
      GO:0009252 is not asserted to be a formal descendant of GO:0071555.
    supported_by:
    - reference_id: PMID:30692671
      supporting_text: Catalytic inactivation of StPBP2x led to the disappearance of this peak
    proposed_replacement_terms:
    - id: GO:0009252
      label: peptidoglycan biosynthetic process
