    qualifier: enables
    supporting_entities:
      - InterPro:IPR001460
      - InterPro:IPR005311
      - InterPro:IPR036138
      - PANTHER:PTN002024644
    review:
      summary: Beta-lactam binding reports the PBP active site but is not its native catalytic
        function.
      action: KEEP_AS_NON_CORE
      reason: The penicillin-binding claim is appropriate for this class-B PBP and is retained as an
        experimentally useful drug-binding property. Native function is peptide crosslinking and,
        for the cognate divisomal PBPs, a separable physical role in synthase assembly. Drug binding
        alone is not proof of net transpeptidation. The term is retained as a conserved PBP-family
        inference; the 2019 crosslinking assay is not represented as a direct penicillin-binding
        measurement.
      supported_by:
        - reference_id: PMID:30692671
          supporting_text: Catalytic inactivation of StPBP2x led to the disappearance of this peak
  - term:
