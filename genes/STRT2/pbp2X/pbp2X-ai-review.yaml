- id: PMID:30692671
  title: FtsW is a peptidoglycan polymerase that is functional only in complex with its cognate penicillin-binding
    protein.
  findings:
  - statement: LMG18311 PBP2x produces an LC-MS crosslinked dimer from E. faecalis lipid-II-derived
      polymer; catalytic S343A removes the product. PBP2x also crosslinks polymer produced by other
      glycosyltransferases, including when its own transmembrane segment is removed.
  reference_review:
    review_notes: Q5M2U8, official pbp2X/stu1701, 755 residues, LMG18311. PMID30692671 cloned M1–D755
      with a C-terminal His6 tag and S343A catalytic mutant; the soluble G53–D755 construct lacked
      the transmembrane segment. Full-length constructs were expressed in E. coli C43(DE3), soluble
      protein in BL21. Direct LC-MS crosslinking used E. faecalis lipid II-derived polymer, not isolated
      native S. thermophilus lipid II. Physical activation of FtsW requires the PBP2x transmembrane
      interface; peptide crosslinking does not require that interface once a suitable polymer is
      available. Native bridge specificity and physiological kinetic preference are not established
      by the heterologous-lipid II assay.
