  - term: &id001
      id: GO:0008047
      label: enzyme activator activity
    evidence_type: IDA
    original_reference_id: PMID:30692671
    qualifier: enables
    review:
      action: NEW
      summary: The bPBP directly activates its compatible FtsW glycan polymerase independently of
        transpeptidase catalysis.
      reason: The sequence-mapped cognate bPBP directly stimulates FtsW polymerization in a purified
        system, including the transpeptidase-inactive variant. The transmembrane interface is
        required, and the effect does not require covalent modification of FtsW. Thus GO:0008047
        captures direct enzyme activation separately from the bPBP crosslinking reaction; it does
        not confer glycosyltransferase chemistry on the bPBP.
      supported_by: &id002
        - reference_id: PMID:30692671
          supporting_text: Strikingly, when we added the cognate divisome bPBP to the FtsW
            reactions, peptidoglycan polymers were produced, implying that the bPBP stimulates
            peptidoglycan polymerase activity (Fig. 1d, Supplementary Fig. 3).
        - reference_id: PMID:30692671
          supporting_text: The observed polymerase activity was abolished when an invariant
            aspartate in or near the presumed FtsW active site was mutated to alanine, but not when
            the TP active site of the bPBP was inactivated (Fig. 1d, Supplementary Figs. 1, 3).
        - reference_id: PMID:30692671
          supporting_text: These results, along with the evolutionary covariation analysis, imply
            that the TM helix of the cognate bPBP interacts with FtsW and is necessary for the
            effect of this bPBP on FtsW polymerase activity.
