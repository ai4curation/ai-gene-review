target: Q5M2U8
organism: STRT2
gene: pbp2X
identity_and_construct_scope: Q5M2U8, official pbp2X/stu1701, 755 residues, LMG18311.
  PMID30692671 cloned M1–D755 with a C-terminal His6 tag and S343A catalytic mutant;
  the soluble G53–D755 construct lacked the transmembrane segment. Full-length constructs
  were expressed in E. coli C43(DE3), soluble protein in BL21. Direct LC-MS crosslinking
  used E. faecalis lipid II-derived polymer, not isolated native S. thermophilus lipid
  II.
interpretation_limits: Physical activation of FtsW requires the PBP2x transmembrane
  interface; peptide crosslinking does not require that interface once a suitable
  polymer is available. Native bridge specificity and physiological kinetic preference
  are not established by the heterologous-lipid II assay.
