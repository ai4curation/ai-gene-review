proposed_new_terms:
- proposed_name: coenzyme F430 binding
  proposed_definition: Binding to coenzyme F430, a nickel-containing tetrapyrrole
    (hydrocorphinoid) cofactor of methyl-coenzyme M reductase and related alkyl-coenzyme
    M reductases.
  justification: Every MCR and alkyl-coenzyme M reductase alpha subunit binds F430
    (or a modified F430) through an axial ligand to its nickel. GO has heme, chlorophyll
    and cobalamin binding under tetrapyrrole binding but no F430 term.
  proposed_parent:
    id: GO:0046906
    label: tetrapyrrole binding
  supported_by:
  - reference_id: file:METKA/mcrA/mcrA-uniprot.txt
    record_section: ["CC:COFACTOR"]
    supporting_text: Note=Binds 2 coenzyme F430 non-covalently per MCR complex.
suggested_questions:
- question: How does the M. kandleri MCR, whose active site matches that of mesophilic
    and thermophilic MCRs, remain stable and active near 100 C, and does the salt-dependent
    surface adaptation also tune F430 loading or activation at that temperature?
suggested_experiments:
- experiment_type: Enzyme characterization
  hypothesis: M. kandleri MCR has a temperature optimum near the organism's growth
    optimum and requires high concentrations of lyotropic salt for activity.
  description: Measure methane formation by MCR purified from M. kandleri across 60-110
    C and a range of potassium cyclic 2,3-diphosphoglycerate concentrations, comparing
    stability and activity with Methanothermobacter MCR I under the same conditions.
