taxon:
  id: NCBITaxon:190192
  label: Methanopyrus kandleri AV19
description: mcrA (MK0655) encodes the alpha subunit of methyl-coenzyme M reductase
  (MCR) in Methanopyrus kandleri, a hyperthermophilic hydrogenotrophic methanogen
  that grows near 100 C and is the only cultured member of the order Methanopyrales.
  MCR is a cytoplasmic alpha2beta2gamma2 heterohexamer that catalyzes the final, methane-forming
  step of methanogenesis, the reduction of methyl-coenzyme M by coenzyme B to methane
  and the CoM-S-S-CoB heterodisulfide (EC 2.8.4.1). The crystal structure of M. kandleri
  MCR shows an active site almost identical to that of the Methanothermobacter enzyme,
  occupied by coenzyme M and coenzyme B, with two coenzyme F430 molecules per hexamer
  and the alpha-subunit Gln150 as the axial ligand to the F430 nickel. Adaptation
  to high temperature and high intracellular salt is seen at the protein surface,
  which is rich in glutamate, rather than in the active site. mcrA lies in the mcrBDCGA
  operon immediately upstream of the mtr operon, as in other methanogens.
