- id: PMID:31801798
  title: An ancient type of MnmA protein is an iron-sulfur cluster-dependent sulfurtransferase for tRNA
    anticodons.
  findings:
  - statement: HB27 IscS and SufS each support reconstituted MnmA thiolation after reductants are removed,
      establishing donor capacity rather than exclusive native assignment.
    supporting_text: In the absence of reductant, s2U was readily formed by the cysteine desulfurases
      using cysteine as the sulfur donor.
  - statement: The assayed recombinant MnmA is the exact HB27 Ttc1727 target, rather than an HB8 paralog.
    supporting_text: The gene encoding T. thermophilus HB27 MnmA (Ttc1727) was cloned into the NdeI and
      HindIII sites of pET22b (Novagen), resulting in the generation of a carboxy-terminally His6-tagged
      fusion protein.
  - statement: The U34 substrate control locates the catalytic modification at wobble uridine.
    supporting_text: A tRNALys U34A mutant was not a MnmA substrate
  - statement: ATP is required in the reconstituted sulfur-incorporation assay.
    supporting_text: The reaction also required ATP (e) and sodium sulfide (f) in the reaction mixture.
  - statement: Iron stoichiometry supports [4Fe–4S] binding by reconstituted recombinant MnmA, not a measurement
      of native cellular occupancy.
    supporting_text: The Fe content of the reconstituted TtMnmA sample was 3.72 ± 0.03 mol per mol of
      protein (n = 3), further supporting the presence of a [4Fe–4S]-type Fe–S cluster.
  - statement: The apoenzyme does not support the tested thiolation reaction.
    supporting_text: When we used apo-MnmA (d), no s2U formation was detected.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary/review text consulted.
- id: PMID:39660893
  title: '2-Thiouridine formation in Escherichia coli: a critical review.'
  findings:
  - statement: The 2025 critical review identifies the terminal TusE-to-MnmA covalent handoff as unresolved.
    supporting_text: Consequently, proof that TusE transfers the persulfide directly to MnmA in E. coli
      remains to be definitively provided.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary/review text consulted. This critical review bounds terminal E. coli
      sulfur chemistry and disputed Fe-S dependence; it is not a new target assay.
