taxon:
  id: NCBITaxon:262724
  label: Thermus thermophilus HB27
description: MnmA of Thermus thermophilus HB27 is a C-type ATP-dependent tRNA-uridine 2-sulfurtransferase.
  Its characterized reconstituted [4Fe–4S] form catalyzes C2 thiolation of tRNA wobble uridine. Purified
  IscS or SufS can supply cysteine-derived sulfur to this reaction without added reductants; the physiological
  choice of donor and possible additional carriers remain unresolved.
