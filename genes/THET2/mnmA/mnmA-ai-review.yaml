- term:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  evidence_type: IDA
  original_reference_id: PMID:31801798
  review:
    summary: Propose directly measured [4Fe–4S] cluster binding by recombinant HB27 MnmA.
    action: NEW
    reason: The exact HB27 Ttc1727 protein was expressed recombinantly and its cluster reconstituted.
      Iron stoichiometry, UV-visible/EPR characterization and conserved-cysteine mutagenesis support binding
      of a [4Fe–4S] cluster; the apoenzyme lacks thiolation activity under the tested conditions. This
      proposal concerns measured protein binding, not demonstrated native-cell cluster occupancy, and
      does not generalize the requirement to D-type MnmA. No seeded binding row or existing replacement
      covers this molecular function.
    supported_by:
    - reference_id: PMID:31801798
      supporting_text: The gene encoding T. thermophilus HB27 MnmA (Ttc1727) was cloned into the NdeI
        and HindIII sites of pET22b (Novagen), resulting in the generation of a carboxy-terminally His6-tagged
        fusion protein.
    - reference_id: PMID:31801798
      supporting_text: The Fe content of the reconstituted TtMnmA sample was 3.72 ± 0.03 mol per mol of
        protein (n = 3), further supporting the presence of a [4Fe–4S]-type Fe–S cluster.
    - reference_id: PMID:31801798
      supporting_text: When we used apo-MnmA (d), no s2U formation was detected.
