  label: Thermus thermophilus HB27
description: TT_C1373 encodes the Thermus thermophilus HB27 SufS cysteine desulfurase. It uses pyridoxal
  phosphate to mobilize sulfur from L-cysteine, and purified SufS supports C2 thiolation of tRNA wobble
  uridine by reconstituted MnmA. Its physiological allocation between sulfur pathways and its relative
  contribution compared with IscS remain unresolved. The same named donor also enhances the separate TtuA/TtuB-dependent
  tRNA U54 thiolation reaction in vitro.
