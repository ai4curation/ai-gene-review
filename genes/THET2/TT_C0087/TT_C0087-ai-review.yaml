  review:
    summary: Retain the supported cysteine desulfurase activity annotation.
    action: ACCEPT
    reason: The official HB27 locus identity and PMID:31801798 reconstitution identify this protein as
      the assayed IscS or SufS sulfur donor. Cysteine-derived sulfur supports MnmA-catalyzed U34 thiolation
      even after reductants are removed. Accept the desulfurase chemistry without claiming a uniquely
      assigned native U34 route, a measured complete native flux, or generic Fe-S assembly participation.
    supported_by:
    - reference_id: PMID:31801798
      supporting_text: The initial velocities were 0.136 ± 0.010 and 0.329 ± 0.013 (pmol s2U/pmol MnmA/min,
        n = 3) for 1.25 µM IscS and SufS with 0.1 mM cysteine, respectively.
    - reference_id: PMID:31801798
      supporting_text: In this assay, the reductants included in the enzyme stock solutions were eliminated
        by gel filtration to prevent possible sulfide release into the reaction mixture.
    - reference_id: PMID:16547008
      supporting_text: The addition of cysteine desulfurases such as IscS (TTC0087) or SufS (TTC1373)
        enhances the sulfur transfer reaction in vitro.
