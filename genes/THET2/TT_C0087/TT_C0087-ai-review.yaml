taxon:
  id: NCBITaxon:262724
  label: Thermus thermophilus HB27
description: TT_C0087 encodes the Thermus thermophilus HB27 IscS cysteine desulfurase, a pyridoxal-phosphate-dependent
  enzyme that mobilizes sulfur from L-cysteine. Purified IscS supports sulfur incorporation into tRNA
  U34 in a reaction with reconstituted MnmA. This biochemical donor capacity does not establish that IscS
  is the sole native donor or exclude intervening carriers in the cell. The same named donor also enhances
  the separate TtuA/TtuB-dependent tRNA U54 thiolation reaction in vitro.
