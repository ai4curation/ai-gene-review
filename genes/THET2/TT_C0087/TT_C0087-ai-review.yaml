  findings:
  - statement: HB27 IscS and SufS each support reconstituted MnmA thiolation after reductants are removed,
      establishing donor capacity rather than exclusive native assignment.
    supporting_text: In the absence of reductant, s2U was readily formed by the cysteine desulfurases
      using cysteine as the sulfur donor.
  - statement: Separate donor assays demonstrate IscS and SufS capacity; physiological donor allocation
      remains unresolved.
    supporting_text: The initial velocities were 0.136 ± 0.010 and 0.329 ± 0.013 (pmol s2U/pmol MnmA/min,
      n = 3) for 1.25 µM IscS and SufS with 0.1 mM cysteine, respectively.
  - statement: Removing stock reductants reduces the alternative explanation of released sulfide in the
      coupled assay.
