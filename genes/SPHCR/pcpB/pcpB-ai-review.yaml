core_functions:
- description: >-
    PcpB is the FAD-dependent monooxygenase that hydroxylates pentachlorophenol
    at the para position with release of chloride, giving
    tetrachlorobenzoquinone and committing PCP to degradation. It is the
    rate-limiting enzyme of the pathway, with low turnover and substantial
    uncoupling to H2O2.
  molecular_function:
    id: GO:0018677
    label: pentachlorophenol monooxygenase activity
  directly_involved_in:
  - id: GO:0019338
    label: pentachlorophenol catabolic process
  supported_by:
  - reference_id: PMID:22482720
    supporting_text: >-
      In the presence of NADPH, PCP hydroxylase converts PCP to
      tetrachlorobenzoquinone (TCBQ).
  - reference_id: PMID:22482720
    supporting_text: >-
      The k(cat) for PCP (0.024 s(-1)) is very low, suggesting that the enzyme
      is not well evolved for turnover of this substrate.
  knowledge_gaps:
  - gap_statement: >-
      The substrate on which PcpB's monooxygenase activity was selected before
      pentachlorophenol existed is undetermined.
    boundary: >-
      The reaction with PCP, its product, FAD dependence, kcat and the
      structure-activity determinants (low phenolic pKa, hydrophobicity, an
      ortho substituent) are all measured, and the para-specificity rule is
      established across nitro- and halo-substituted phenols. No natural phenol
      has been shown to be a better substrate than PCP. A structural narrowing
      of the candidate set is currently blocked rather than merely undone: the
      AlphaFold model carries no FAD and no bound substrate, and the nearest
      experimental structure in the family is only about 20 percent identical,
      so the flavin and substrate positions cannot be transferred by
      superposition.
    gap_kind:
    - BIOLOGY
    significance: >-
      Identifying it would show whether PCP degradation was recruited from a
      pre-existing halophenol activity or arose from a generic phenol
      hydroxylase, and would calibrate how fast such pathways assemble.
    resolution: >-
      Kinetic screen of purified PcpB against naturally occurring halogenated
      and nitro-substituted phenols, measuring coupled turnover and uncoupling.
      Biogenic ortho-halogenated para-substituted phenols with free 3,5
      positions satisfy the published structure-activity rules best and are the
      priority candidates; a co-crystal or cryo-EM structure with FAD and a
      bound phenol would make the pocket argument testable.
    provenance:
    - reference_id: file:SPHCR/pcpB/pcpB-hypotheses/ancestral-phenol-pocket-alphafold/openscientist.md
      supporting_text: >-
        pocket volume and the substrate-to-C4a-hydroxyflavin distance were **not
        measured de novo**
  - gap_statement: >-
      It is undetermined how much of PcpB's slow turnover is an unoptimized
      recent acquisition and how much is actively maintained by selection.
    boundary: >-
      The kcat is measured at about 0.024 per second and the original report
      reads it as poor adaptation to PCP. A later study from the same group
      proposes instead that slow turnover is selected, because the product TCBQ
      is a potent alkylating agent and slow release lets PcpD reduce it before
      it escapes. Both readings fit the same kinetic number, and no experiment
      yet separates them.
    gap_kind:
    - BIOLOGY
    significance: >-
      This decides whether PcpB is an example of incomplete optimization or of
      a kinetic optimum set by product toxicity, which in turn determines
      whether low catalytic efficiency can ever be read as evidence that an
      activity is non-physiological.
    resolution: >-
      Compare faster PcpB variants in vivo for growth on PCP and for TCBQ
      escape, with and without PcpD, to test whether accelerating the enzyme is
      deleterious.
    provenance:
    - reference_id: PMID:23676275
      supporting_text: >-
        The toxicity of TCBQ may have exerted selective pressure to maintain
        slow turnover of PcpB (0.02 s(-1)) so that a transient interaction
        between PcpB and PcpD can occur before TCBQ is released from the active
        site of PcpB.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which natural chlorinated or nitro-substituted phenol is PcpB's ancestral
    substrate? The enzyme's preference for low phenolic pKa and ortho
    substitution should predict it, and naturally occurring halogenated phenols
    do exist in marine and soil environments.
- question: >-
    Should GO or an associated resource be able to record that an activity is
    physiologically real yet kinetically poor? PcpB is simultaneously the
    pathway's committed step and a slow, uncoupled, flux-limiting enzyme, which
    no GO annotation currently conveys. Note that slowness here may be a
    selected optimum rather than a defect, so the question is how to record a
    kinetic property at all, not how to record a deficiency.
- question: >-
    Is the slow turnover of PcpB maintained by selection to let PcpD sequester
    the alkylating TCBQ intermediate, as proposed, or is it simply an
    unoptimized recent acquisition? The same measured kcat supports both
    readings.
- question: >-
    Is the promiscuous activity on tetrachlorohydroquinone, which reverses
    pathway flux, worth annotating? It is a measured activity of this enzyme
    that is detrimental to the host rather than beneficial.
suggested_experiments:
- description: >-
    Screen purified PcpB against a library of naturally occurring halogenated
    and nitro-substituted phenols selected for low phenolic pKa and ortho
    substitution, measuring both coupled turnover and the uncoupling ratio.
  experiment_type: enzyme kinetics
  hypothesis: >-
    A natural para-substituted phenol is turned over faster and with less
    uncoupling than PCP, identifying the activity from which PCP hydroxylation
    was recruited.
