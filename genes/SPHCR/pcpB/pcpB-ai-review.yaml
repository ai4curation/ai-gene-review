- term:
    id: GO:0018677
    label: pentachlorophenol monooxygenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:18685
  - EC:1.14.13.50
  review:
    summary: >-
      Rhea/EC-mapped IEA on the exactly matching term; the activity is
      experimentally established but not annotated as such.
    action: ACCEPT
    reason: >-
      RHEA:18685 is an exactMatch of GO:0018677 and the reaction has been
      characterized in purified enzyme, including identification of TCBQ as the
      product and full structure-activity analysis. As with tfdA, the only MF
      annotation is electronic although experimental evidence exists; the term
      itself is right. This entry is a good test case for the project's
      distinction between a synthetic substrate and a non-physiological one: PCP
      is wholly man-made, introduced in the 1930s, yet the enzyme is the
      committed, selected, rate-limiting step of its host's catabolic pathway.
    supported_by:
    - reference_id: PMID:22482720
      supporting_text: >-
        In the presence of NADPH, PCP hydroxylase converts PCP to
        tetrachlorobenzoquinone (TCBQ).
- term:
    id: GO:0019338
    label: pentachlorophenol catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00691
  review:
    summary: >-
      UniPathway-mapped process term; PcpB is the flux-limiting step of a
      recently assembled degradation pathway.
    action: ACCEPT
    reason: >-
      S. chlorophenolicum strains were isolated from PCP-contaminated soil and
      degrade PCP through this pathway, with PcpB catalysing the entry step and
      limiting overall flux. The pathway's patchwork origin and the enzyme's
      poor kinetics do not make the process assignment wrong; they make it an
      example of a function caught early in optimization.
    supported_by:
    - reference_id: PMID:22482720
      supporting_text: >-
        Flux through the pathway is limited by PCP hydroxylase.
