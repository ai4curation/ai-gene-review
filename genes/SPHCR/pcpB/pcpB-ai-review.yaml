    pocket analysis)'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      AI-generated analysis, cited for its negative structural result and its
      tool provenance rather than for any positive claim. It fetched AlphaFold
      model v6, parsed pLDDT (mean 91.5), ran MolProbity and Foldseek, and
      reported honestly that pocket volume and the substrate-to-flavin distance
      could not be measured because the model lacks FAD and substrate and the
      nearest experimental structure is only 20 percent identical. Its
      candidate ranking is a declared SAR heuristic, not docking, and is not
      treated here as evidence.
