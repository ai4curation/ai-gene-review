id: P42535
gene_symbol: pcpB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:46429
  label: Sphingobium chlorophenolicum
description: >-
  PcpB is the FAD-dependent pentachlorophenol 4-monooxygenase (PCP hydroxylase)
  of Sphingobium chlorophenolicum, a dimeric member of the PheA/TfdB family of
  flavin-dependent phenol hydroxylases. Using NADPH and O2 it converts
  pentachlorophenol to 2,3,5,6-tetrachloro-1,4-benzoquinone with release of
  chloride, the first step of PCP degradation. It also acts on other
  para-substituted phenols, removing hydrogen, nitro, amino and cyano groups.
  The enzyme is notably inefficient: kcat for PCP is about 0.024 per second, it
  uncouples extensively so that the C4a-hydroxyflavin intermediate decomposes to
  H2O2 in a futile cycle consuming NADPH, and it acts promiscuously on the
  downstream metabolite tetrachlorohydroquinone, which reverses pathway flux.
  This makes PcpB the rate-limiting step of a pathway that appears to have been
  assembled recently by patching horizontally acquired enzymes into existing
  metabolism, and an unusually clear case of a real but poorly optimized
  physiological function.
