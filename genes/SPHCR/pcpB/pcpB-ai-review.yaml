  review:
    summary: >-
      Rhea/EC-mapped IEA on the exactly matching term; the activity is
      experimentally established but not annotated as such.
    action: ACCEPT
    reason: >-
      RHEA:18685 is an exactMatch of GO:0018677 and the reaction has been
      characterized in purified enzyme, including identification of TCBQ as the
      product and full structure-activity analysis. As with tfdA, the only MF
      annotation is electronic although experimental evidence exists; the term
      itself is right. This entry is a good test case for the project's
      distinction between a synthetic substrate and a non-physiological one: PCP
      is wholly man-made, introduced in the 1930s, yet the enzyme is the
      committed, selected, rate-limiting step of its host's catabolic pathway.
    supported_by:
