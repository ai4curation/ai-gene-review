core_functions:
- description: >-
    PcpB is the FAD-dependent monooxygenase that hydroxylates pentachlorophenol
    at the para position with release of chloride, giving
    tetrachlorobenzoquinone and committing PCP to degradation. It is the
    rate-limiting enzyme of the pathway, with low turnover and substantial
    uncoupling to H2O2.
  molecular_function:
    id: GO:0018677
    label: pentachlorophenol monooxygenase activity
  directly_involved_in:
  - id: GO:0019338
    label: pentachlorophenol catabolic process
  supported_by:
  - reference_id: PMID:22482720
    supporting_text: >-
      In the presence of NADPH, PCP hydroxylase converts PCP to
      tetrachlorobenzoquinone (TCBQ).
  - reference_id: PMID:22482720
    supporting_text: >-
      The k(cat) for PCP (0.024 s(-1)) is very low, suggesting that the enzyme
      is not well evolved for turnover of this substrate.
  knowledge_gaps:
  - gap_statement: >-
      The substrate on which PcpB's monooxygenase activity was selected before
      pentachlorophenol existed is undetermined.
    boundary: >-
      The reaction with PCP, its product, FAD dependence, kcat and the
      structure-activity determinants (low phenolic pKa, hydrophobicity, an
      ortho substituent) are all measured; no natural phenol has been shown to
      be a better substrate than PCP.
    gap_kind:
    - BIOLOGY
    significance: >-
      Identifying it would show whether PCP degradation was recruited from a
      pre-existing halophenol activity or arose from a generic phenol
      hydroxylase, and would calibrate how fast such pathways assemble.
    resolution: >-
      Kinetic screen of purified PcpB against naturally occurring halogenated
      and nitro-substituted phenols, measuring coupled turnover and uncoupling.
proposed_new_terms: []
suggested_questions:
- question: >-
    Which natural chlorinated or nitro-substituted phenol is PcpB's ancestral
    substrate? The enzyme's preference for low phenolic pKa and ortho
    substitution should predict it, and naturally occurring halogenated phenols
    do exist in marine and soil environments.
- question: >-
    Should GO or an associated resource be able to record that an activity is
    physiologically real but poorly optimized? PcpB is simultaneously the
    pathway's committed step and a slow, uncoupled, flux-limiting enzyme, which
    no GO annotation currently conveys.
- question: >-
    Is the promiscuous activity on tetrachlorohydroquinone, which reverses
    pathway flux, worth annotating? It is a measured activity of this enzyme
    that is detrimental to the host rather than beneficial.
suggested_experiments:
- description: >-
    Screen purified PcpB against a library of naturally occurring halogenated
    and nitro-substituted phenols selected for low phenolic pKa and ortho
    substitution, measuring both coupled turnover and the uncoupling ratio.
  experiment_type: enzyme kinetics
  hypothesis: >-
    A natural para-substituted phenol is turned over faster and with less
    uncoupling than PCP, identifying the activity from which PCP hydroxylation
    was recruited.
