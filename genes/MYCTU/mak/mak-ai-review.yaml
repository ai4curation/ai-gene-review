- term:
    id: GO:0019200
    label: carbohydrate kinase activity
  evidence_type: ISS
  original_reference_id: PMID:20507595
  qualifier: enables
  review:
    summary: Maltokinase activity, shown on the identical M. bovis BCG enzyme; GO lacks a maltokinase term.
    action: NEW
    reason: >-
      GOA has no molecular-function row for Mak. The M. bovis BCG Mak, 99-100%
      identical to M. tuberculosis Mak, was expressed and shown to produce
      maltose 1-phosphate from maltose and ATP with measured Km values, and
      UniProt assigns the RHEA:31915 reaction (EC 2.7.1.175). GO has no
      substrate-specific maltokinase term, so GO:0019200 carbohydrate kinase
      activity is the most specific available parent, and a maltokinase
      activity term is proposed below.
    supported_by:
    - reference_id: PMID:20507595
      supporting_text: >-
        The enzyme was dependent on maltose and ATP, although GTP and UTP could
        be used to produce maltose-1-phosphate, which we identified by TLC and
        characterized by NMR. The Km for maltose was 2.52 +/- 0.40 mM and 0.74
        +/- 0.12 mM for ATP
    - reference_id: PMID:20507595
      supporting_text: >-
        The sequence of the Mak from M. bovis BCG was identical to that from M.
        tuberculosis strains (99-100% amino acid identity).
