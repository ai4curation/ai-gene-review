proposed_new_terms:
- proposed_name: maltokinase activity
  proposed_definition: >-
    Catalysis of the reaction D-maltose + ATP = alpha-maltose 1-phosphate +
    ADP + H(+).
  justification: >-
    Mak has a curated EC 2.7.1.175/RHEA:31915 reaction, characterized on the
    identical M. bovis BCG enzyme, but GO has no substrate-specific
    molecular-function term for this activity.
  proposed_parent:
    id: GO:0019200
    label: carbohydrate kinase activity
suggested_questions:
- question: >-
    Why was mak scored as essential for M. tuberculosis growth when treS is
    not, and does maltose 1-phosphate have a role beyond GlgE-dependent
    alpha-glucan synthesis?
suggested_experiments:
- description: >-
    Construct a conditional mak knockdown in M. tuberculosis and measure
    maltose, maltose 1-phosphate and alpha-glucan pools with and without a
    glgE or glgC lesion.
