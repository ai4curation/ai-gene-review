  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00028292
  review:
    summary: Correct; Mak phosphorylates maltose, and GO has no more specific maltose-phosphorylation process.
