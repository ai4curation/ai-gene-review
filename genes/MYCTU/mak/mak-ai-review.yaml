        mass spectrometer
- term:
    id: GO:0005978
    label: glycogen biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00164
  review:
    summary: Core process; Mak makes the maltose 1-phosphate donor that GlgE polymerizes.
    action: ACCEPT
    reason: >-
      Mak catalyses the second step of the TreS-Pep2-GlgE-GlgB route, forming
      the maltose 1-phosphate that GlgE transfers onto alpha-1,4-glucan. In M.
      tuberculosis the TreS-Pep2 branch provides most of that donor for
      intracellular (glycogen-like) and capsular alpha-glucan, so Mak performs
      an enzymatic step of glycogen formation.
    supported_by:
    - reference_id: PMID:27513637
      supporting_text: >-
        This indicates that under the tested culture conditions the TreS-Pep2
        branch provides most of the M1P for the GlgE pathway in M.
        tuberculosis whereas the GlgC-GlgA branch is much less active.
    - reference_id: PMID:20305657
      supporting_text: >-
        We describe a new pathway from trehalose to alpha-glucan in
        Mycobacterium tuberculosis comprising four enzymatic steps mediated by
        TreS, Pep2, GlgE (which has been identified as a maltosyltransferase
        that uses maltose 1-phosphate) and GlgB.
- term:
    id: GO:0005992
    label: trehalose biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00027073
  review:
    summary: Wrong direction; Mak consumes trehalose-derived maltose and makes no trehalose.
    action: REMOVE
    reason: >-
      Mak phosphorylates maltose to maltose 1-phosphate, which GlgE uses to
      build alpha-glucan. In the TreS-Pep2 route trehalose is the starting
      substrate that TreS converts to maltose; no step catalysed by Mak forms
      trehalose. The machine-learned association apparently arises from the
      genomic linkage of mak with treS, which is not evidence that Mak takes
      part in trehalose synthesis.
    supported_by:
    - reference_id: file:MYCTU/mak/mak-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: >-
        Reaction=D-maltose + ATP = alpha-maltose 1-phosphate + ADP + H(+);
    - reference_id: PMID:27513637
      supporting_text: >-
        First, trehalose is isomerized to maltose by trehalose synthase TreS
        [17–19] with subsequent phosphorylation by maltokinase Pep2 to give
        maltose 1-phosphate (M1P) [19–21].
- term:
    id: GO:0005992
    label: trehalose biosynthetic process
  evidence_type: ISS
  original_reference_id: GO_REF:0000024
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:Q7U2S7
  review:
    summary: Wrong direction, transferred from the identical M. bovis maltokinase; Mak does not form trehalose.
    action: REMOVE
    reason: >-
      The donor is the M. bovis AF2122/97 maltokinase, whose biochemistry
      (characterized on the identical BCG enzyme) is maltose phosphorylation.
      That paper describes maltose 1-phosphate as an intermediate linking
      trehalose to glycogen synthesis, not as a precursor of trehalose. The
      same biological objection as for the ARBA row applies: Mak's reaction
      consumes trehalose-derived maltose and forms no trehalose.
    supported_by:
    - reference_id: PMID:20507595
      supporting_text: >-
        Recently, this metabolite was proposed to be the intermediate in a
        pathway linking trehalose with the synthesis of glycogen in M.
        smegmatis.
- term:
