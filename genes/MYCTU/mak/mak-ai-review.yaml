  review:
    summary: Uninformative bare protein binding from a pathogen-host library-versus-library yeast two-hybrid screen.
    action: REMOVE
    reason: >-
      The row records a high-throughput yeast two-hybrid hit between Mak and
      mouse Atg2b. Bare protein binding carries no functional information, and
      no specific molecular function of Mak follows from the hit, so the
      generic annotation is removed under the protein-binding policy. Removal
      does not assert that the reported interaction is false.
    supported_by:
