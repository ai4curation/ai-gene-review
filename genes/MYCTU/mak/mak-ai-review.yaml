  evidence_type: HDA
  original_reference_id: PMID:14532352
  qualifier: located_in
  review:
    summary: Detected in a membrane-fraction proteome; retained as non-core, not the site of the core activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      The curator read the membrane-proteome tables and recorded Mak among the
      proteins identified in the H37Rv membrane fraction; the cached record is
      abstract-only, so target peptides and fractionation controls cannot be
      re-examined. Mak has no predicted transmembrane segment, and peripheral
      association or carryover cannot be distinguished here. The experimental
      row is kept, but as a peripheral location: the core activity acts on the
      cytosolic maltose pool.
    supported_by:
