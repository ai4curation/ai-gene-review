id: O07177
gene_symbol: mak
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: >-
  Mak (also called Pep2; Rv0127) is the maltokinase of Mycobacterium
  tuberculosis, a cytosolic enzyme of the aminoglycoside phosphotransferase
  (protein kinase-like) fold encoded next to treS. It uses ATP to phosphorylate
  D-maltose at the anomeric carbon, producing alpha-maltose 1-phosphate
  (EC 2.7.1.175). The identical M. bovis BCG enzyme is a monomer that requires
  divalent cations, preferring Mg2+, and can also use GTP or UTP. Maltose
  1-phosphate is the activated donor that the maltosyltransferase GlgE uses to
  extend alpha-1,4-glucans, so Mak links trehalose, via TreS-derived maltose, to
  synthesis of cytosolic glycogen-like alpha-glucan and capsular alpha-glucan.
