    reason: >-
      In M. tuberculosis, combined inactivation of TreS with GlgC or GlgA left
      cells virtually devoid of cytosolic and capsular alpha-glucan, and TreS
      loss alone had a profound effect, because the TreS-Pep2 branch provides
      most of the maltose 1-phosphate that GlgE polymerizes. TreS performs the
      first enzymatic step of that route by converting trehalose to maltose,
      so it does part of the work of alpha-glucan formation rather than only
      being necessary for it. GO:0030979 is not an ancestor or descendant of
      glycogen biosynthetic process in GO, and it names the capsular as well
      as the cytosolic polymer.
    supported_by:
    - reference_id: PMID:27513637
      supporting_text: >-
        As with M. smegmatis, combined inactivation of either GlgC and TreS or
        GlgA and TreS resulted in mutants that were virtually devoid of
        α-glucans
    - reference_id: PMID:20305657
      supporting_text: >-
        We describe a new pathway from trehalose to alpha-glucan in
        Mycobacterium tuberculosis comprising four enzymatic steps mediated by
        TreS, Pep2, GlgE
core_functions:
- description: >-
    Isomerizes trehalose to maltose (reversibly) in the cytosol, supplying the
    maltokinase Pep2/Mak with maltose for alpha-maltose 1-phosphate synthesis,
    the donor that GlgE polymerizes into alpha-glucan.
