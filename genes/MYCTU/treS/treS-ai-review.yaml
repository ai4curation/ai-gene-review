gene_symbol: treS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: >-
  TreS (Rv0126) is the trehalose synthase of Mycobacterium tuberculosis, a
  cytosolic glycoside hydrolase family 13 (GH13) enzyme of the TreS subfamily.
  It reversibly isomerizes the alpha,alpha-1,1 linkage of trehalose into the
  alpha-1,4 linkage of maltose (EC 5.4.99.16). Recombinant enzyme also shows a
  calcium-stimulated amylase activity that releases maltose from glycogen and
  maltooligosaccharides. In vivo TreS supplies maltose to the adjacent
  maltokinase Pep2/Mak (Rv0127); the resulting alpha-maltose 1-phosphate is the
  donor used by the maltosyltransferase GlgE to extend alpha-1,4-glucans, which
  GlgB then branches. Under laboratory growth this TreS-Pep2 branch supplies
  most of the maltose 1-phosphate for cytosolic glycogen-like alpha-glucan and
  capsular alpha-glucan, and TreS can also contribute to trehalose formation
  from maltose.
