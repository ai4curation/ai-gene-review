- term:
    id: GO:0016161
    label: beta-amylase activity
  evidence_type: IDA
  original_reference_id: PMID:18505459
  qualifier: enables
  review:
    summary: Likely over-annotation; the curated TreS hydrolase reaction is endo-acting alpha-amylase, not exo beta-amylase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The paper showed that TreS releases maltose from glycogen and
      maltoheptaose. Maltose release alone does not distinguish exo-acting
      beta-amylase (EC 3.2.1.2) from endo-acting alpha-amylase, and the
      UniProt curators, citing the same paper, recorded only the EC 3.2.1.1
      endohydrolysis reaction. GH13 enzymes are alpha-retaining, whereas
      beta-amylases are inverting GH14 enzymes. The assay is real, so the row
      is not removed, but the beta-amylase reading likely exceeds what was
      shown. The cached record is abstract-only.
    supported_by:
    - reference_id: PMID:18505459
      supporting_text: >-
        TreS produced both radioactive maltose and radioactive trehalose when
        incubated with [(3)H]glycogen, and also converted
        maltooligosaccharides, such as maltoheptaose, to both maltose and
        trehalose.
    - reference_id: file:MYCTU/treS/treS-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: >-
        SIMILARITY: Belongs to the glycosyl hydrolase 13 family. TreS
        subfamily.
