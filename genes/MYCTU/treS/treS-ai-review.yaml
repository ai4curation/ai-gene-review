suggested_questions:
- question: >-
    Does the calcium-stimulated amylase activity of TreS release maltose from
    glycogen in vivo, and does that contribute measurably to maltose
    1-phosphate supply or trehalose recycling?
suggested_experiments:
- description: >-
    Express catalytic-site variants that separate the isomerase and amylase
    activities of TreS in a treS deletion strain and measure trehalose,
    maltose 1-phosphate and alpha-glucan pools during growth and starvation.
