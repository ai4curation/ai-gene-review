- term:
    id: GO:0001671
    label: ATPase activator activity
  evidence_type: IC
  original_reference_id: PMID:27872278
  review:
    action: NEW
    summary: ATPase activator activity.
    reason: Titration and HPD-mutant experiments assign stimulation to this J protein and hydrolysis to
      DnaK. This distinct molecular activity is absent from the existing folding, zinc-binding and partner-binding
      rows. The H37Rv reference assignment is a species-level inference with the donor-sequence limitation
      documented. Activation was significant only near equimolar DnaJ1:DnaK in the reported titration,
      unlike the more efficient substoichiometric DnaJ2 stimulation; this annotation does not claim identical
      potency.
    supported_by:
    - reference_id: PMID:27872278
      supporting_text: significant activation was only observed at equimolar DnaJ1 and DnaK regardless
        of the presence of DnaJ2 or GrpE
