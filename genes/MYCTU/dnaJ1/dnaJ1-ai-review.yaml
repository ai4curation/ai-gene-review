gene_symbol: dnaJ1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: DnaJ1 is a J-domain cochaperone that assists DnaK-dependent protein folding. The two mycobacterial
  J proteins make distinct, partly overlapping contributions to DnaK activation and refolding; DnaJ2 activates
  DnaK more efficiently at substoichiometric concentrations.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012724
  review:
    summary: DnaJ-family membership does not establish intrinsic ATP binding.
    action: MARK_AS_OVER_ANNOTATED
    reason: The InterPro:IPR012724 assignment identifies a J protein, whereas the measured nucleotide
      turnover belongs to DnaK. DnaJ stimulates that partner through its J domain. Without a direct target
      ATP-binding assay, this binding claim exceeds the evidence; no absolute absence of nucleotide affinity
      or evolutionary loss is asserted.
    supported_by:
    - reference_id: PMID:27872278
      supporting_text: Hence, the ATP hydrolysis observed in these reactions is due to the activity of
        Mtb DnaK.
    - &id002
      reference_id: PMID:27872278
      supporting_text: significant activation was only observed at equimolar DnaJ1 and DnaK regardless
        of the presence of DnaJ2 or GrpE
