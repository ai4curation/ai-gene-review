- term:
    id: GO:0010468
    label: regulation of gene expression
  evidence_type: IDA
  original_reference_id: PMID:15207487
  qualifier: involved_in
  review:
    summary: DnaJ1 overexpression alters transcription, but direct regulatory participation is unresolved.
    action: UNDECIDED
    reason: The accessible abstract reports altered chaperone-gene transcription and suggests indirect
      effects through client load; the full paper was not accessible after normal retrieval. Retain uncertainty
      about the precise regulatory role rather than converting perturbation into direct regulation. The
      DnaJ2 row is explicitly negated and reports no detectable transcriptional effect in that assay;
      DnaJ1 perturbation changes transcription but does not by itself establish participation in regulation.
      Different judgments reflect different biological assertions, not different standards for the same
      abstract.
    supported_by:
    - reference_id: PMID:15207487
      supporting_text: Overexpression of DnaJ1 resulted in elevated transcription of both the hsp70/dnaK
        and hsp60/groE chaperone genes
