    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012724
  review:
    summary: DnaJ-family membership does not establish intrinsic ATP binding.
    action: MARK_AS_OVER_ANNOTATED
    reason: The InterPro:IPR012724 assignment identifies a J protein, whereas the measured nucleotide
      turnover belongs to DnaK. DnaJ stimulates that partner through its J domain. Without a direct target
      ATP-binding assay, this binding claim exceeds the evidence; no absolute absence of nucleotide affinity
      or evolutionary loss is asserted.
    supported_by:
    - reference_id: PMID:27872278
      supporting_text: Hence, the ATP hydrolysis observed in these reactions is due to the activity of
        Mtb DnaK.
    - reference_id: PMID:27872278
      supporting_text: significant activation was only observed at equimolar DnaJ1 and DnaK regardless
        of the presence of DnaJ2 or GrpE
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      record: InterPro:IPR012724
      slot: GO mapping
      asserted_value: GO:0005524
      requested_change: CHECK
      confidence: PROBABLE
      explanation: The current InterPro entry maps the DnaJ-family domain to ATP binding. Primary mycobacterial
        assays assign nucleotide turnover to DnaK, while DnaJ1 and DnaJ2 act as cofactors. Check whether
        this broad mapping transfers partner nucleotide chemistry to J proteins without direct ATP-binding
        evidence; no universal absence of nucleotide affinity is asserted.
      supported_by:
      - reference_id: PMID:27872278
