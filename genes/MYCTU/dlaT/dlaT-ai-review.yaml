gene_symbol: dlaT
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: DlaT is the lipoylated E2 acetyltransferase of the mycobacterial pyruvate dehydrogenase complex,
  which converts pyruvate to acetyl-CoA with AceE and Lpd. Its lipoyl cofactor also transfers reducing
  equivalents from Lpd to AhpD in an AhpC-dependent peroxide-reduction relay. Historically called SucB,
  it is experimentally distinguished from the succinyltransferase of a conventional oxoglutarate dehydrogenase
  complex. Its metabolic and nitrosative-defense roles contribute to bacterial growth and persistence.
