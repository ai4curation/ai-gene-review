- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: HDA
  original_reference_id: PMID:14532352
  qualifier: located_in
  review:
    action: UNDECIDED
    summary: Membrane-fraction detection does not yet resolve the location of the active TFE.
    reason: PMID:14532352 explicitly profiles H37Rv membrane fractions, so this is not rejected as a different
      strain or gene. The cached source is abstract-only and publisher PDF acquisition failed 403; target-level
      fractionation controls and the proteomic table could not be independently reassessed. Later soluble-complex
      biochemistry does not disprove peripheral association. Preserve uncertainty rather than removing
      an experimental annotation or placing the catalytic core at the membrane.
    supported_by:
    - reference_id: PMID:14532352
      supporting_text: 'we have profiled the membrane protein fraction of the M. tuberculosis

        H37Rv strain'
