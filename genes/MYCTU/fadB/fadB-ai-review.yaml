id: O53872
gene_symbol: fadB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: FadB (Rv0860) is the alpha subunit of the Mycobacterium tuberculosis H37Rv trifunctional
  beta-oxidation enzyme, paired with FadA (Rv0859). It catalyzes 2E-enoyl-CoA hydration and NAD-dependent
  oxidation of the resulting 3S-hydroxyacyl-CoA. The characterized complex favors linear medium- and long-chain
  substrates; isolated FadB retains both activities but is less stable and less active. Its assembly differs
  from the Pseudomonas complex, and its inability to process cis-unsaturated substrates unaided requires
  separate auxiliary enzymes.
existing_annotations:
- term:
    id: GO:0003857
    label: (3S)-3-hydroxyacyl-CoA dehydrogenase (NAD+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00043364
  - EC:1.1.1.35
  review:
    action: MODIFY
    summary: FadB oxidizes long-chain 3S-hydroxyacyl-CoA using NAD+.
    reason: The C-terminal HAD domain and assays support NAD-dependent oxidation of long-chain intermediates.
      GO:0016509 is a verified descendant of the broader dehydrogenase/oxidoreductase terms; it covers
      13–22 carbon acyl chains. The complex processes long-chain substrates; direct 2021 C16 coupled hydration/HAD
      assays yield NADH, alongside C10 activity. This specificity is not an assertion that shorter chains
      are impossible or that FadB performs the beta-chain thiolase reaction.
    supported_by: &id001
    - reference_id: file:genes/MYCTU/fadB/fadB-source-analysis/primary-scope.md
      supporting_text: At 60 µM 2E-hexadecenoyl-CoA, reported activities are 125.2±15.9 and 5.3±0.2µmol mg−1
        min−1, respectively.
    proposed_replacement_terms:
    - &id002
      id: GO:0016509
      label: long-chain (3S)-3-hydroxyacyl-CoA dehydrogenase (NAD+) activity
