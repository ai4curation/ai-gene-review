suggested_questions:
- question: How does Rv2747 sustain physiological N-acetylglutamate production despite low apparent affinity
    for glutamate in vitro, and is an activating protein partner involved?
- question: Does its measured glutamine acetylation contribute to arginine synthesis in vivo through N-acetylglutamine
    deamidation?
suggested_experiments:
- description: Compare glutamate and glutamine turnover and product identity for Rv2747 alone and with
    candidate native partners, then measure isotope flux into N-acetylglutamate in complemented conditional
    mutants.
  experiment_type: substrate kinetics, product analysis and native metabolic flux
