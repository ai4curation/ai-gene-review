- id: PMID:15838030
  title: Functional characterization of a novel ArgA from Mycobacterium tuberculosis.
  findings:
  - statement: Rv2747 turns over glutamate and glutamine, with glutamine the better tested acyl acceptor.
    supporting_text: Although l -glutamate and l -glutamine served as substrates for Rv2747
  - statement: Both oligomeric forms were detected by analytical gel filtration.
    supporting_text: the protein existed as a mixture of equal amounts of a dimer and a tetramer.
  - statement: The purified enzyme is inhibited by the pathway end product arginine.
    supporting_text: The IC 50 value determined for arginine was 26 ± 3 μM
  - statement: The physiological efficiency problem and a possible protein partner remain unresolved.
    supporting_text: Another reason might be that Rv2747 requires a protein partner for efficient and
      more selective acetylation of l -glutamate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article inspected after normal fetch. Exact target Rv2747 was expressed
      and purified. Glutamate turnover is observed but unsaturated at 600 mM; the detailed sequential
      kinetics and NMR-confirmed acetylated product are glutamine assays. Gel filtration supports dimer/tetramer
      mixture. Native pathway efficiency and protein partnership are hypotheses.
- id: file:MYCTU/argA/argA-uniprot.txt
  title: UniProtKB O33289 ArgA from Mycobacterium tuberculosis H37Rv
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Curated function and catalytic evidence are tied to primary15838030. A localized kinetic-unit
      error is present in CC BIOPHYSICOCHEMICAL PROPERTIES: acetyl-CoA KM is printed 150 mM, whereas the
      primary paper reports 150 micromolar. The primary value is used; the downloaded record is preserved
      unchanged. PTHR43626/SF4 is verified membership but not a NAGS-exclusive family.'
  findings:
  - statement: Curated target function supports glutamate acetylation and identifies glutamine as a better
      substrate.
    record_section: ["CC:FUNCTION"]
    supporting_text: 'L-glutamine is a significantly better substrate compared to

      CC       L-glutamate.'
  - statement: The protein belongs to a broad GNAT acyltransferase family.
    record_section: ["DR:PANTHER"]
    supporting_text: DR   PANTHER; PTHR43626; ACYL-COA N-ACYLTRANSFERASE; 1.
- id: PMID:17347518
  title: 'Surprising arginine biosynthesis: a reappraisal of the enzymology and evolution of the pathway
    in microorganisms.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full comparative review inspected: places mycobacterial short NAGS in the alternative
      architecture of glutamate acetylation. It does not make all broad GNAT-family proteins NAGS or establish
      a native Rv2747 partner.'
  findings:
  - statement: Mycobacteria provide the short, single-protein NAGS architecture.
    supporting_text: Short NAGSs can be single gene products, as in Mycobacterium spp. and Thermus spp.
