id: O33289
gene_symbol: argA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: ArgA (Rv2747) is a short, approximately 19-kDa GNAT-family amino-acid N-acetyltransferase
  of Mycobacterium tuberculosis that acetylates L-glutamate and supplies N-acetylglutamate for L-arginine
  biosynthesis. Purified enzyme also acetylates L-glutamine, which was a better substrate in vitro, and
  is inhibited by L-arginine. Unlike classical two-domain bacterial N-acetylglutamate synthases, it lacks
  the extended N-terminal kinase-like region. Dimers and tetramers were observed in solution; efficient
  physiological glutamate turnover and any activating protein partner remain unresolved.
