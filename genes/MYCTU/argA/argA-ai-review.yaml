  evidence_type: IDA
  original_reference_id: PMID:15838030
  qualifier: involved_in
  review:
    summary: Rv2747 supplies the acetylated glutamate intermediate of arginine biosynthesis.
    action: ACCEPT
    reason: The enzyme itself performs the initiating acetylation, rather than merely affecting arginine
      abundance. Primary15838030 supports this biochemical pathway assignment and arginine feedback inhibition.
      Native flux efficiency, possible glutamine-to-acetylglutamate conversion and a proposed activating
      partner are not directly established; the existing process annotation is retained without claiming
      those mechanisms.
    supported_by:
