id: P9WG47
gene_symbol: gyrA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: GyrA is the DNA cleavage-religation and DNA-wrapping subunit of Mycobacterium tuberculosis
  H37Rv DNA gyrase. Together with the ATP-binding GyrB subunit, it forms an A2B2 type II topoisomerase
  that introduces negative supercoils and decatenates DNA. Its cytoplasmic DNA-topology activities
  support chromosome replication and transcription. GyrA carries the active-site tyrosine and a DNA-binding
  C-terminal domain; ATP hydrolysis is assigned to GyrB.
