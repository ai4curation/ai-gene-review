- id: PMID:11266418
  title: Inhibitory activity of quinolones against DNA gyrase of Mycobacterium tuberculosis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Only the abstract is cached. It verifies quinolone inhibition of gyrase and GyrA
      resistance mutants, but does not resolve subunit-specific ATP binding/hydrolysis or magnesium
      binding. No experimental annotation is rejected merely from that access limitation.
- id: PMID:14532352
  title: Comprehensive proteomic profiling of the membrane constituents of a Mycobacterium tuberculosis
    strain.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only membrane proteomics study. Detection/fractionation and target-specific
      peptide support cannot be assessed; membrane rows remain UNDECIDED, not rejected from canonical
      soluble function.
- id: PMID:15047530
  title: 'Mycobacterium tuberculosis DNA gyrase: interaction with quinolones and correlation with
    antimycobacterial drug activity.'
  findings:
  - statement: Supercoiling requires the reconstituted GyrA/GyrB enzyme.
    supporting_text: Neither subunit alone induced DNA supercoiling
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text. Recombinant GyrA and GyrB came from cosmid T776; drug susceptibility
      used H37Rv. GyrA has a C-terminal hexahistidine tag and GyrB an N-terminal decahistidine tag.
      Reconstitution directly establishes partner-dependent supercoiling. This study does not itself
      measure native chromosome segregation.
- id: PMID:16876125
  title: 'First functional characterization of a singly expressed bacterial type II topoisomerase:
    the enzyme from Mycobacterium tuberculosis.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only primary characterization reports both supercoiling and decatenation.
      Subunit/construct details cannot be independently resolved here; exact H37Rv decatenation grounding
      instead comes from full PMID17038336.
- id: PMID:17020913
  title: Glutamate racemase from Mycobacterium tuberculosis inhibits DNA gyrase by affecting its
    DNA-binding.
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full primary text concerns a protein inhibitor of gyrase. Physical binding does
      not justify retaining bare protein-binding GO annotations under repository policy.
- id: PMID:17038336
  title: The key DNA-binding residues in the C-terminal domain of Mycobacterium tuberculosis DNA
    gyrase A subunit (GyrA).
  findings:
  - statement: Both assayed genes derive from H37Rv genomic DNA.
    supporting_text: The gyrA and gyrB genes were both amplified from the genomic DNA from M.tuberculosis
