references:
- id: PMID:15047530
  title: 'Mycobacterium tuberculosis DNA gyrase: interaction with quinolones and correlation with
    antimycobacterial drug activity.'
  findings:
  - statement: Supercoiling requires the reconstituted GyrA/GyrB enzyme.
    supporting_text: Neither subunit alone induced DNA supercoiling
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text. Recombinant GyrA and GyrB came from cosmid T776; drug susceptibility
      used H37Rv. GyrA has a C-terminal hexahistidine tag and GyrB an N-terminal decahistidine tag.
      Reconstitution directly establishes partner-dependent supercoiling. This study does not itself
      measure native chromosome segregation.
- id: PMID:17038336
  title: The key DNA-binding residues in the C-terminal domain of Mycobacterium tuberculosis DNA
    gyrase A subunit (GyrA).
  findings:
  - statement: Both assayed genes derive from H37Rv genomic DNA.
    supporting_text: The gyrA and gyrB genes were both amplified from the genomic DNA from M.tuberculosis
      H37Rv, and ligated to pET20b and pET32a, respectively.
  - statement: Wild-type H37Rv gyrase directly decatenates the kDNA substrate in the mutant comparison.
    supporting_text: However, lowering gyrase concentration to 0.01 μM, mutants of D669A, R691A,
      G729A and R745A showed no decatenation activity, whereas the wild-type enzyme and E514A still
      had (Figure 8C).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text explicitly identifies H37Rv genomic templates and sequencing
      identical to NC000962. His-tagged recombinant proteins were assayed; no tag removal is reported.
      Fig8 directly compares kDNA decatenation by wild-type GyrA/GyrB and GyrA mutants. Fig9 measures
      ATP hydrolysis of assembled A2B2 variants, not isolated GyrA ATPase. The text has inconsistent
      G729A/G729W naming; this review does not annotate that mutant residue or equate it to the wild-type
      target.
- id: PMID:21745817
  title: 'The dimer state of GyrB is an active form: implications for the initial complex assembly
    and processive strand passage.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text distinguishes isolated GyrB monomer/dimer preparations, assembly
      with GyrA, and topology reactions. Mutants, truncated B-prime constructs and GyrA-SBP affinity
      constructs are not relabeled as full-length wild type; assay-specific conclusions retain partner
      dependence.
- id: PMID:22844097
  title: The role of Ca²⁺ in the activity of Mycobacterium tuberculosis DNA gyrase.
  findings:
  - statement: The mutant retains decatenation while losing supercoiling, separating the two activities.
    supporting_text: The quadruple mutant displays normal relaxation and decatenation activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text uses the earlier PMID17038336 preparations with modifications.
      Wild-type and mutant kDNA decatenation are functional results; calcium regulation is proposed
      and does not establish native physiological regulation. Calcium depletion is not evidence for
      direct magnesium binding by GyrA.
- id: PMID:31953321
  title: Functional interactions between gyrase subunits are optimized in a species-specific manner.
  findings:
  - statement: Comparative assay conditions yield relatively low M. tuberculosis supercoiling and
      decatenation efficiency.
    supporting_text: 'M. tuberculosis gyrase

      hydrolyzes ATP only slowly and is a poor supercoiling enzyme and decatenase.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache after a genuine force retry; PMC/Europe PMC/publisher full-text
      retrievals failed. Its primary comparative result explicitly calls M. tuberculosis gyrase a
      poor decatenase under the tested conditions. This qualifies claims of universally enhanced
      efficiency without negating positive decatenation. No unverified strain or construct sequence
      is inferred from this abstract.
- id: PMID:41255390
  title: Indole-containing inhibitors with improved efficacy targeting the gyrase of Mycobacterium
    tuberculosis.
  findings:
  - statement: The study explicitly identifies both full-length H37Rv target accessions.
    supporting_text: encoding each full-length gyrase subunit (UniProt accession numbers P9WG47 and
      P9WG45, respectively).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text explicitly names full-length H37Rv P9WG47 and P9WG45 in pET28a constructs.
      His-affinity purification is reported without tag removal. Supercoiling and ATPase inhibition
      assays concern assembled gyrase; this source is not a decatenation assay. Its introductory
      attribution of ATPase to the TOPRIM region is not adopted: the GyrB N-terminal GHKL ATPase
      domain is distinguished from its TOPRIM DNA-cleavage metal-binding domain.'
evidence_items:
- planned_role: daughter-DNA unlinking
  evidence:
    source_id: PMID:17038336
    title: The key DNA-binding residues in the C-terminal domain of Mycobacterium tuberculosis DNA
      gyrase A subunit (GyrA).
    statement: Reconstituted H37Rv GyrA/GyrB directly decatenates kDNA; wild type remains active
      at the low concentration where selected GyrA mutants fail.
    supporting_text: However, lowering gyrase concentration to 0.01 μM, mutants of D669A, R691A,
      G729A and R745A showed no decatenation activity, whereas the wild-type enzyme and E514A still
      had (Figure 8C).
  integration_limit: Linked-circle biochemical assay, not native daughter-chromosome segregation;
    both subunits required for the complete enzyme. Do not adopt the inconsistent G729A/G729W mutant
    designation as a curated residue assertion.
- planned_role: torsional management
  evidence:
    source_id: PMID:15047530
    title: 'Mycobacterium tuberculosis DNA gyrase: interaction with quinolones and correlation with
      antimycobacterial drug activity.'
    statement: GyrA and GyrB reconstitute supercoiling, while neither individual subunit executes
      it.
    supporting_text: Neither subunit alone induced DNA supercoiling
  integration_limit: Complex contribution; no single GyrB ATPase grants whole topoisomerase capacity.
- planned_role: topoisomerase assembly
  evidence:
    source_id: PMID:21745817
    title: 'The dimer state of GyrB is an active form: implications for the initial complex assembly
      and processive strand passage.'
    statement: M. tuberculosis GyrB exhibits a monomer-dimer equilibrium relevant to assembly with
      GyrA.
    supporting_text: These results indicate that M. tuberculosis GyrB alone exists as a monomer–dimer
      equilibrium in solution and this equilibrium process is slow
  integration_limit: Physical assembly supports the complex architecture; separate topology assays
    are needed for activity. Truncated B-prime and GyrA-SBP constructs are not the unmodified exemplars.
- planned_role: daughter-DNA unlinking
  evidence:
    source_id: PMID:22844097
    title: The role of Ca²⁺ in the activity of Mycobacterium tuberculosis DNA gyrase.
    statement: A GyrA mutant preserves decatenation despite loss of supercoiling, demonstrating distinct
      measured capacities.
    supporting_text: The quadruple mutant displays normal relaxation and decatenation activity.
  integration_limit: Mutant-versus-WT comparison in vitro; calcium-based native regulation is a hypothesis.
- planned_role: comparative activity limitation
  evidence:
    source_id: PMID:31953321
    title: Functional interactions between gyrase subunits are optimized in a species-specific manner.
    statement: M. tuberculosis gyrase has relatively low supercoiling and decatenation rates in this
      comparative study.
    supporting_text: 'M. tuberculosis gyrase

      hydrolyzes ATP only slowly and is a poor supercoiling enzyme and decatenase.'
  integration_limit: Abstract-only access. Preserve positive decatenation capacity but avoid universal
    enhanced-efficiency language; do not infer the unverified construct strain.
- planned_role: target identity
  evidence:
    source_id: PMID:41255390
    title: Indole-containing inhibitors with improved efficacy targeting the gyrase of Mycobacterium
      tuberculosis.
    statement: The study explicitly identifies full-length H37Rv GyrA P9WG47 and GyrB P9WG45.
    supporting_text: encoding each full-length gyrase subunit (UniProt accession numbers P9WG47 and
      P9WG45, respectively).
  integration_limit: This study provides accession-level identity and supercoiling/ATPase inhibition;
