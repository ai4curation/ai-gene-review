integration_boundaries:
- GyrA2GyrB2 is one two-subunit implementation of two topological capacities, not two independently
  enabled activities.
- H37Rv decatenation is experimentally supported in vitro. Assignment to native daughter-DNA unlinking
  is physiological inference, not a measured segregation phenotype in these sources.
- No topoisomerase-IV absence alone is used to infer activity. Do not transfer M. smegmatis efficient-decatenase
  results as direct H37Rv evidence.
- All original annotation payloads and raw sources are preserved. GyrA ATP-related rows and membrane
  localization remain unresolved.
