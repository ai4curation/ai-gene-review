      explanation: >-
        InterPro maps IPR006048 (alpha-amylase/branching enzyme C-terminal
        all-beta domain) to GO:0043169 cation binding, which GOA applies as an
        IEA to GlgB. GlgB has no established cofactor or cation-binding site and
        its activity is inhibited, not activated, by divalent cations, so the
        cation-binding mapping is not supported for this family member.
