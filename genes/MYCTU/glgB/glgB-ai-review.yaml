  label: Mycobacterium tuberculosis H37Rv
description: >-
  GlgB (Rv1326c) is the 1,4-alpha-glucan branching enzyme of Mycobacterium
  tuberculosis, a cytosolic glycoside hydrolase family 13 (GH13) enzyme of the
  GlgB subfamily (EC 2.4.1.18). It introduces the alpha-1,6 branch points of
  alpha-glucan: it cleaves an alpha-1,4-glucosidic linkage within a growing
  alpha-1,4-glucan chain and reattaches the excised oligosaccharide through a new
  alpha-1,6 linkage. GlgB is a monomer whose multidomain structure (an
  N-terminal beta-sandwich, a central (beta/alpha)8 catalytic domain and a
  C-terminal beta-sandwich; PDB 3K1D) tunes substrate specificity. It acts in
  the final step of the TreS-Pep2-GlgE-GlgB route, branching the linear
  alpha-1,4-glucan made by GlgE, and contributes to the biosynthesis of both
  intracellular glycogen-like alpha-glucan and the surface-exposed capsular
  alpha-glucan. GlgB is essential for M. tuberculosis in vitro.
