core_functions:
- description: >-
    Introduces alpha-1,6 branch points into alpha-1,4-glucan by excising a
    short alpha-1,4-linked chain segment and reattaching it through an
    alpha-1,6 linkage, converting the linear chains made by GlgE into branched
    alpha-glucan for intracellular glycogen-like and capsular storage.
  molecular_function:
    id: GO:0003844
    label: 1,4-alpha-glucan branching enzyme activity
  directly_involved_in:
  - id: GO:0005978
    label: glycogen biosynthetic process
  - id: GO:0030979
    label: alpha-glucan biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:17005418
    supporting_text: >-
      The recombinant protein is a monomer as evidenced by gel filtration
      chromatography, is active as an enzyme, and uses amylose as the substrate.
  - reference_id: PMID:18808383
    supporting_text: >-
      the synthesis of glucan and glycogen involves the
      alpha-1,4-glucosyltransferases Rv3032 and GlgA (Rv1212c), the ADP-glucose
      pyrophosphorylase GlgC (Rv1213) and the branching enzyme GlgB (Rv1326c).
suggested_questions:
- question: >-
    Does the redox-dependent GlgB-WhiB1 disulfide exchange regulate branching
    activity, localization, or partner interactions in vivo under oxidative
    stress, given that the disulfide state does not change branching activity in
    vitro?
suggested_experiments:
- description: >-
    Measure alpha-glucan chain length and branching frequency, and capsular
    versus cytosolic alpha-glucan content, in a conditional glgB knockdown of M.
    tuberculosis, and test whether WhiB1 redox state modulates GlgB function
    during stress.
