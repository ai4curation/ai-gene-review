  review:
    summary: Over-annotation; GlgB activity is inhibited by divalent cations, not dependent on them.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The alpha-amylase C-domain signature (IPR006048) maps generically to
      cation binding, but GlgB does not require a cation for activity: its
      branching activity is inhibited by Zn2+ and Cu2+ and unaffected by Mg2+,
      Mn2+ and Ca2+. No functional or structural cation-binding site has been
      established, so the term is a structural-signature over-annotation. The
      underlying InterPro2GO mapping is flagged as a source defect.
