- term:
    id: GO:0016209
    label: antioxidant activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000084072
  review:
    summary: AhpD has a defined disulfide-reductase role in the antioxidant relay.
    action: MODIFY
    reason: Refine the broad antioxidant annotation to the experimentally resolved disulfide oxidoreductase
      relay and the independently assayed weak hydroperoxide-reducing activity. The latter remains non-core
      and was measured with a heterologous Salmonella AhpF reducing system, not as proof of a separate
      native physiological route. Current GO:0051920 specifies protein-dithiol oxidation to a protein
      disulfide coupled to hydroperoxide reduction, not membership in a particular structural family.
      PMID:11914371 describes Cys133 peroxide attack followed by a Cys130–Cys133 disulfide, and PMID:12761216
      tests that mechanism by mutagenesis, crystallography and kinetics. This specific chemistry supports
      GO:0051920 despite AhpD's distinct fold; GO:0004601 would discard supported reaction detail. The
      activity remains secondary to the physiological AhpC-regeneration relay.
    supported_by:
    - reference_id: PMID:15178486
      supporting_text: A key step in the reduction of oxidized AhpC by reduced AhpD is formation of a
        disulfide cross-link between Cys61 of AhpC and Cys133 of AhpD.
    - &id002
      reference_id: PMID:10766746
      supporting_text: AhpD, which has only been identified in the genomes of mycobacteria and Streptomyces
        viridosporus, is shown here to also be an alkylhydroperoxidase.
    - reference_id: PMID:11914371
      supporting_text: The cysteine then reacts with the peroxide to give a sulfenic acid that subsequently
        forms a disulfide bond with Cys-130.
    - reference_id: PMID:12761216
      supporting_text: The collective results strongly support the proposed catalytic mechanism for AhpD.
    proposed_replacement_terms:
    - id: GO:0015036
      label: disulfide oxidoreductase activity
    - &id001
      id: GO:0051920
      label: peroxiredoxin activity
