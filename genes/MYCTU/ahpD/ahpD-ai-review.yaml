gene_symbol: ahpD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: AhpD is a thiol-disulfide oxidoreductase that regenerates the peroxide-reducing enzyme AhpC.
  Its active-site cysteines exchange reducing equivalents with AhpC in a relay connected to lipoyl-DlaT
  and NADH-dependent Lpd. Purified AhpD also has weak alkylhydroperoxidase activity with an artificial
  reducing system. It forms a homotrimer and contributes to the mycobacterial antioxidant network without
  replacing all other peroxide-defense pathways.
