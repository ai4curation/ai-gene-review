suggested_questions:
- question: Is GO:0051920 intended to include AhpD, whose protein-dithiol-to-disulfide
    hydroperoxide-reduction chemistry matches the reaction definition despite its distinct fold,
    or does the comment referring to peroxiredoxin itself restrict the class to that family?
- question: What fraction of native peroxide detoxification derives from direct AhpD turnover rather than
    AhpC regeneration?
suggested_experiments:
- description: Compare intact native relay turnover with AhpD-only peroxide reduction at physiological
    protein and substrate concentrations, using active-site mutants and product measurements.
  experiment_type: biochemical and native genetic dissection
