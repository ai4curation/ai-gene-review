- term:
    id: GO:0019631
    label: quinate catabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000479790
  - UniProtKB:P05147
  review:
    summary: PAINT IBA placing quinate catabolism at the PTHR21272 root node PTN000479790, with
      A. nidulans QutE as the only seed.
    action: REMOVE
    reason: Over-propagation. The PTHR21272 family review assesses this IBD as TOO_DEEP and
      scopes quinate catabolism to SF5 (Pezizomycotina QutE/qa-2); AroQ is in SF3. In M.
      tuberculosis AroQ is the sole, biosynthetic dehydroquinase, and Reactome states that it
      does not take part in catabolism. Its ability to rescue quinate use in an A. nidulans
      qutE mutant shows catalytic capacity in a heterologous pathway, not participation in
      quinate catabolism in its own organism.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000479790
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The IBD rests on A. nidulans QutE (P05147) of the fungal quinic acid
          utilization cluster; placing it at the family root passes the catabolic process to
          bacterial biosynthetic AroQ enzymes. The family review recommends moving it to the
          Pezizomycotina node PTN002723599.
    supported_by:
    - reference_id: Reactome:R-MTU-964851
      supporting_text: Unlike fungi DHQ dehydratases, AroQ doesn't take part in catabolism
        reactions (Moore et al, 1992).
    - reference_id: file:MYCTU/aroQ/aroQ-notes.md
      supporting_text: This shows catalytic capacity in a heterologous catabolic pathway, not
        a catabolic role in M. tuberculosis.
