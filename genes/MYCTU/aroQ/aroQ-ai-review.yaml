  label: Mycobacterium tuberculosis H37Rv
description: >-
  AroQ (Rv2537c) is the type II 3-dehydroquinate dehydratase (3-dehydroquinase, EC 4.2.1.10)
  of Mycobacterium tuberculosis and the only 3-dehydroquinase encoded in its genome. It
  catalyses the third step of the shikimate (chorismate) pathway, the dehydration of
  3-dehydroquinate to 3-dehydroshikimate, by a trans elimination through an enolate
  intermediate, with Tyr-25 abstracting the C-2 proton, His-102 protonating the leaving
  hydroxyl and Arg-20 stabilising the transition state. The 147-residue protein has a
  flavodoxin-like fold, assembles into a very heat-stable cytosolic homododecamer, and has an
  unusually low Km for its substrate. It is unrelated in sequence and mechanism to the type I
  (Schiff base) dehydroquinases of enteric bacteria but related to the catabolic
  dehydroquinases of the fungal quinic acid utilization pathway, and when expressed in an
  Aspergillus qutE mutant it can substitute for the catabolic enzyme. In M. tuberculosis its
  role is biosynthetic, supplying the chorismate needed for aromatic amino acids, folate,
  menaquinone and mycobactin, and it has been studied extensively as an antitubercular drug
  target, with many inhibitor-bound crystal structures.
