gene_symbol: grpE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: GrpE is a soluble dimeric nucleotide-exchange factor for the Hsp70 chaperone DnaK. It binds
  DnaK and accelerates nucleotide release, allowing ATP rebinding and continuation of client folding cycles.
  The mycobacterial GrpE dimer also couples its interaction with the nucleotide-binding and substrate-binding
  domains to peptide release.
