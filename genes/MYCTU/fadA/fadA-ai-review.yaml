id: O53871
gene_symbol: fadA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: FadA (Rv0859) is the catalytic thiolase beta subunit of the Mycobacterium tuberculosis H37Rv
  FadBA complex. It performs CoA-dependent cleavage of medium- and long-chain 3-ketoacyl-CoA intermediates
  in fatty-acid beta-oxidation. The FadA dimer binds two FadB alpha chains in a divergent heterotetrameric
  assembly. Acetoacetyl-CoA turnover was undetectable under reported assay conditions, distinguishing
  this enzyme from a conventional short-chain acetoacetyl-CoA thiolase; its native substrate distribution
  remains incompletely resolved.
