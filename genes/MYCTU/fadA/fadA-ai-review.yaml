  review:
    action: UNDECIDED
    summary: Membrane-fraction detection does not yet resolve the location of the active TFE.
    reason: PMID:14532352 explicitly profiles H37Rv membrane fractions, so this is not rejected as a different
      strain or gene. The cached source is abstract-only and publisher PDF acquisition failed 403; target-level
