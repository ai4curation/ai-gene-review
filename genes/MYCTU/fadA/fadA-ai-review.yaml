  review:
    action: NEW
    summary: The protein is a structurally resolved TFE subunit.
    reason: Sequence-matched PDB 4B3H and the primary complex structure establish physical membership
      of the alpha2beta2 enzyme. This adds a complex location absent from the seed, not a redundant cellular
      location or an untested pathway completion claim.
    supported_by:
