        comment: Original IBA node retained. Current family/tree lookup does not resolve this target lineage.
          Direct target C10/C16-positive versus acetoacetyl-CoA-undetectable assays support a broader
          thiolase term, without inventing a phylogenetic loss or discrediting short-chain-active donor
          members.
