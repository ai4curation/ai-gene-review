      supporting_text: This qualitative thiolase assay showed activity when testing for degradation of
        3-ketodecanoyl-CoA and 3-ketohexadecanoyl-CoA.
    proposed_replacement_terms:
    - &id002
      id: GO:0003988
      label: acetyl-CoA C-acyltransferase activity
