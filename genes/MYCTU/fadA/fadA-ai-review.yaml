      supporting_text: TFE is an α(2)β(2) complex
- term:
    id: GO:0006635
    label: fatty acid beta-oxidation
  evidence_type: IC
  original_reference_id: PMID:34371166
  review:
    action: NEW
    summary: FadA performs the thiolytic step of fatty-acid beta-oxidation.
    reason: The beta chain supplies the KAT active center; matched-complex assays show CoA-triggered cleavage
      of C10/C16 ketoacyl-CoAs. It therefore performs pathway chemistry rather than merely being necessary.
      GO:0006635 is a fatty-acid catabolic process; no other BP exists in the seed or proposals. Same-role
      Ecoli FadA P21151 carries this BP with IDA/IMP/IBA and Pfr FadA P28790 with IEA; these query results
      establish convention, not biochemical evidence. No target GO-CAM index entry was found. The inferred
      participation does not imply a complete native oxidation route or identify its first-step dehydrogenase.
    supported_by: *id003
