  review:
    action: MODIFY
    summary: The short-chain-specific thiolase assignment needs generalization.
    reason: Current GO:0003985 specifies 2 acetyl-CoA/acetoacetyl-CoA, whereas the 2021 target assay detected
      no acetoacetyl-CoA thiolase activity and did detect cleavage of C10/C16 ketoacyl-CoAs. Generalize
      to parent GO:0003988, preserving real thiolase chemistry. Non-detection has unstated LOD and is
      not a universal impossibility or evidence of evolutionary loss. PTN000432378 is the supplied IBA
      source; the current PTHR43365 tree lacks the target leaf and does not resolve that node, so its
      exact ancestral scope is not invented.
    supported_by:
    - reference_id: file:genes/MYCTU/fadB/fadB-source-analysis/primary-scope.md
      supporting_text: no thiolase activity is detected with the substrate acetoacetyl-CoA.
    - &id001
