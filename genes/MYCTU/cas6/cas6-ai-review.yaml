      (28 nt) repeat tags.
    full_text_unavailable: true
  - reference_id: UniProtKB:P9WPJ1
    supporting_text: >-
      Processes pre-crRNA into individual crRNA units; accurate cleavage of pre-crRNA
      depends on a 3' stem-loop and the sequence of the bases in the stem.
    reference_section_type: DATABASE_ENTRY
suggested_questions:
- question: >-
    Is the divalent-cation requirement a property of the enzyme or of the substrate? Cas6
    family enzymes are classically metal independent, yet this one is stimulated by Ca2+ and
    Mn2+ and inhibited by EDTA, and accurate cleavage depends on a 3' hairpin whose folding
    those same cations would stabilise. Until a metal site is demonstrated on the protein, no
    metal-ion-binding annotation is justified.
- question: >-
    Should GO have a CRISPR RNA processing term as a child of GO:0006396 RNA processing,
    alongside the existing tRNA, rRNA, mRNA and snRNA processing children? At present
    crRNA-maturation enzymes land either on the generic parent or on GO:0043571 maintenance
    of CRISPR repeat elements, which sits in the DNA-repeat-maintenance branch and so says
    something different from what these enzymes do.
- question: >-
    What are the 5' and 3' end chemistries of the cleavage products? Establishing them would
    decide between the two mechanistic children of GO:0004521, GO:0016891 and GO:0016892, or
    show that neither applies because the 3' product carries a 2',3'-cyclic phosphate.
- question: >-
    Why is there no 3'-end trimming in this system? Elsewhere in type III-A the ruler
    mechanism of the effector complex sets a defined crRNA length, so either the H37Rv Csm
    complex lacks the trimming activity or the retained 3' hairpin blocks it.
- question: >-
    Does cas6 contribute to immunity on its own? The reported immunity phenotype is from a
    whole-locus deletion and is anti-plasmid, so the specific consequence of losing crRNA
    maturation for invader resistance in M. tuberculosis has not been measured.
suggested_experiments:
- description: >-
    Assay processing with chelated substrate refolded in monovalent salt and with
    cobalt-hexammine, which supports RNA folding but cannot act catalytically as a Lewis
    acid, to separate a metal requirement of the enzyme from one of the substrate hairpin.
- description: >-
    Map the 5' and 3' termini of the cleavage products by ligation-based sequencing or by
    testing susceptibility to T4 polynucleotide kinase and to 2',3'-cyclic phosphodiesterase,
    establishing the end chemistry the ontology children distinguish.
- description: >-
    Delete cas6 alone in M. tuberculosis or M. bovis BCG and measure resistance to
    spacer-matching plasmid transformation, separating the contribution of crRNA maturation
    from that of the rest of the locus.
- description: >-
    Determine a structure of Cas6 bound to an uncleaved repeat RNA to show how the 3'
    stem-loop is recognised and why the stem-base sequence matters, and to place the GMG
    motif at 295-297 relative to the substrate.
- description: >-
    Test whether Cas6 remains associated with the Csm effector complex by pulling down the
    complex from H37Rv lysate and assaying for Cas6, confirming that it acts catalytically
    rather than as a retained subunit as its type I relatives do.
