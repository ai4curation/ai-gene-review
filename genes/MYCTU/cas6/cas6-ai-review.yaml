      supporting_text: >-
        Cas6 cleavage of repeat RNA is ion dependent, and accurate cleavage depends on the
        presence of a 3' hairpin in the repeat RNA and the sequence of its stem base
        nucleotides.
      full_text_unavailable: true
    - reference_id: UniProtKB:P9WPJ1
      supporting_text: >-
        Processes pre-crRNA into individual crRNA units; accurate cleavage of pre-crRNA
        depends on a 3' stem-loop and the sequence of the bases in the stem.
      reference_section_type: DATABASE_ENTRY
