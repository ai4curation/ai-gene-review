    label: RNA binding
  qualifier: enables
  evidence_type: IDA
  original_reference_id: PMID:29979631
  review:
    summary: >-
      Cas6 binds its pre-crRNA substrate through a determinant separable from the catalytic
      centre, recognising the 3' stem-loop of the repeat rather than a linear consensus.
    action: NEW
    reason: >-
      Proposed because GOA holds only the single IEA row for this entry. The evidence is the
      reciprocal mutagenesis pair recorded by UniProt with ECO:0000269 from PubMed:29979631:
      the H99A catalytic mutant still binds pre-crRNA while processing it incorrectly,
      whereas the GMG295-297AMA mutant both misprocesses and no longer binds pre-crRNA. That
      is a direct binding assay distinguishing two surfaces of the protein, so IDA is the
      right code. Comparator check: casE, the E. coli type I-E orthologue, carries GO:0003723
      by IDA (PMID:25103409), so this is the conventional companion annotation for a
      Cas6-family enzyme and not an over-annotation. It is retained rather than suppressed as
      "implied by the nuclease activity" because the binding determinant is genuinely
      separable here and is the basis of the enzyme's hairpin-dependent specificity.
