id: P9WPJ1
gene_symbol: cas6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: >-
  Cas6 (Rv2824c) is the pre-crRNA processing endoribonuclease of the type III-A CRISPR-Cas
  locus of Mycobacterium tuberculosis H37Rv, lying at one end of the cas6-to-cas2 gene
  cluster. The CRISPR array is transcribed as a single long precursor in which
  invader-derived spacers alternate with repeats, and Cas6 converts that precursor into the
  individual guide RNAs the rest of the system uses, cleaving within each repeat to release
  one crRNA per spacer. Recognition is structural rather than purely sequence-based: the
  enzyme requires a stem-loop in the 3' portion of the repeat and is sensitive to the
  identity of the bases at the base of that stem, so an intact hairpin rather than a bare
  consensus defines the cleavage site. Substrate binding and catalysis are separable
  functions of the protein, since substituting the catalytic histidine at position 99
  leaves pre-crRNA binding intact while misdirecting cleavage, whereas substituting the
  glycine-methionine-glycine motif at 295-297 abolishes binding altogether. The products
  are atypical for a type III-A system. Elsewhere the Cas6 cut is followed by trimming of
  the crRNA 3' end to a ruler length set by the effector complex; here no such trimming
  occurs, and the mature species is a uniform molecule of about 71 nucleotides retaining an
  8-nucleotide 5' handle and a 28-nucleotide 3' repeat tag with its 10-nucleotide stem-loop
  still in place, so the guides resemble those of type I systems more than those of their
  own subtype. Cas6 is a standalone enzyme rather than a retained structural subunit: it
  hands the mature crRNA on to the Csm effector complex instead of remaining within it,
  which distinguishes it from the type I-E and type I-F members of the same protein family.
  Loss of cas6 alone blocks crRNA maturation, and loss of the whole locus reduces resistance
  to incoming plasmids carrying sequences matching the array.
