- id: UniProtKB:P9WPJ1
  title: UniProtKB entry for Mycobacterium tuberculosis H37Rv Cas6 (P9WPJ1, Rv2824c)
  publication_type: DATABASE
  findings:
  - statement: >-
      Processes pre-crRNA into individual crRNA units; accurate cleavage depends on a 3'
      stem-loop and on the sequence of the bases in the stem
      (ECO:0000269|PubMed:29979631).
    reference_section_type: DATABASE_ENTRY
  - statement: >-
      The mature crRNA is unusual for type III-A systems in not undergoing 3' processing
      after Cas6 cleavage; it is about 71 nucleotides with an 8 nt 5' handle and a 28 nt
      repeat carrying a 10 nt stem-loop at the 3' end.
    reference_section_type: DATABASE_ENTRY
  - statement: >-
      Steady-state kinetics were measured: KM 8.395 uM for repeat pre-crRNA in 0.125 mM
      CaCl2, kcat 12.156 min-1 (ECO:0000269|PubMed:29979631).
    reference_section_type: DATABASE_ENTRY
  - statement: >-
      Mutagenesis separates binding from catalysis: H99A gives incorrect processing of
      pre-crRNA but still binds pre-crRNA, whereas the GMG 295-297 to AMA substitution
      gives incorrect processing and no longer binds pre-crRNA
      (ECO:0000269|PubMed:29979631).
    reference_section_type: DATABASE_ENTRY
  - statement: >-
      Deletion of cas6 alone blocks maturation of pre-crRNA; deletion of the entire
      CRISPR-Cas locus (Rv2824c to Rv2816c) decreases resistance to plasmids encoding
      spacer elements about 6-fold (ECO:0000269|PubMed:29979631).
    reference_section_type: DATABASE_ENTRY
  - statement: >-
      Pre-crRNA processing requires a divalent metal cation, is stimulated by Ca(2+) and
      Mn(2+), and is inhibited by EDTA (ECO:0000269|PubMed:29979631).
    reference_section_type: DATABASE_ENTRY
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Reviewed Swiss-Prot entry. Because the cached PMID:29979631 record is abstract-only,
      the substrate-binding, kinetic and disruption data are taken from this entry's
      ECO:0000269 annotations, made by a curator with access to the full text; the
      annotations below defer to that curation rather than second-guessing it.
- id: PMID:29979631
  title: Mycobacterium tuberculosis type III-A CRISPR/Cas system crRNA and its maturation
    have atypical features.
  full_text_unavailable: true
  findings:
  - statement: >-
      The H37Rv type III-A system is active in invader defence and has atypical features.
    supporting_text: >-
      we show it is active in invader defense and has features atypical of type III-A
      systems
    reference_section_type: ABSTRACT
  - statement: >-
      Mature crRNAs are not trimmed at the 3' end after Cas6 cleavage, which occurs 8
      nucleotides from the 3' end of the repeat.
    supporting_text: >-
      appear not to be subject to 3'-end processing after Cas6 cleavage of repeat RNA 8 nt
      from its 3' end
    reference_section_type: ABSTRACT
  - statement: >-
      Cleavage is ion dependent and accurate cleavage requires a 3' hairpin in the repeat
      RNA and the particular sequence of its stem-base nucleotides.
    supporting_text: >-
      Cas6 cleavage of repeat RNA is ion dependent, and accurate cleavage depends on the
      presence of a 3' hairpin in the repeat RNA and the sequence of its stem base
      nucleotides.
    reference_section_type: ABSTRACT
  - statement: >-
      The guides produced carry both a 5' and a 3' repeat tag, resembling type I crRNAs
      rather than those of other type III-A systems.
    supporting_text: >-
      crRNAs generated resemble mature crRNA in type I systems, having both 5' (8 nt) and 3'
      (28 nt) repeat tags.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only (full_text_available: false), confirmed against the
      frontmatter. PubMed record matches the UniProt citation (FASEB J 2019;33(1):1496-1509,
      DOI 10.1096/fj.201800557RR). The immunity phenotype reported is resistance to
      transformation with spacer-matching plasmids, not phage restriction, which is why no
      defense-response-to-virus annotation is made.
existing_annotations:
- term:
    id: GO:0016788
    label: hydrolase activity, acting on ester bonds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010156
  review:
    summary: >-
      The essence is right, since Cas6 does hydrolyse an ester bond, but the term is far too
      general for an enzyme whose substrate, cleavage site, catalytic residue, kinetics and
      deletion phenotype are all established. The informative term at the same level of
      confidence is RNA endonuclease activity.
    action: MODIFY
    reason: >-
      GO:0016788 is defined as "Catalysis of the hydrolysis of any ester bond" and sits
      directly under GO:0016787 hydrolase activity; it does not even record that the
      substrate is a nucleic acid. The imprecision lies in the InterPro2GO mapping, not in
      the family call: the source entry IPR010156 is itself named "CRISPR-associated
      endoribonuclease Cas6" and is correct for this protein. GO:0004521 RNA endonuclease
      activity ("Catalysis of the cleavage of ester linkages within ribonucleic acid by
      creating internal breaks"; parents GO:0004519 endonuclease activity and GO:0004540 RNA
      nuclease activity) records substrate class, mode and chemistry, each of which is
      established here: the enzyme cleaves within the repeat of a pre-crRNA transcript,
      H99A misdirects cleavage, and steady-state kinetics have been measured. Comparator
      check confirms this is the family convention rather than an invention: Escherichia
      coli K-12 casE (Cas6e, the type I-E orthologue) carries GO:0004521 by IDA
      (PMID:18703739), and Pseudomonas aeruginosa PA14 cas6f carries GO:0004519 endonuclease
      activity by the same InterPro route, i.e. already one step more specific than this
      row. The two mechanistic children of GO:0004521 were considered and rejected:
      GO:0016891 (producing 5'-phosphomonoesters) and GO:0016892 (producing
      3'-phosphomonoesters, hydrolytic mechanism) each assert an end chemistry that has not
      been reported for this enzyme, and Cas6-family enzymes typically leave a 2',3'-cyclic
      phosphate, which matches neither cleanly.
    proposed_replacement_terms:
    - id: GO:0004521
      label: RNA endonuclease activity
    additional_reference_ids:
