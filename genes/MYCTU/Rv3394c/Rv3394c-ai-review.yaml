  - term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    evidence_type: IPI
    original_reference_id: PMID:20615954
    qualifier: enables
    review:
      summary: >-
        ImuB is the cassette's interaction hub: it binds ImuA', DnaE1, DnaE2 and
        the beta clamp, and the clamp interaction is functionally required.
      action: NEW
      reason: >-
        Two-hybrid interactions with four partners plus a separation-of-function
        clamp-binding allele establish an adaptor activity directly in this
        organism, and the loss of catalytic residues rules out reading the
        Y-family fold as polymerase activity. This is the molecular function the
        protein contributes to the pathway, in place of the catalysis its fold
        would otherwise imply.
      supported_by:
        - reference_id: PMID:20615954
          supporting_text: >-
            Yeast two-hybrid analyses indicate that ImuB interacts with both
            ImuA' and DnaE2, as well as with the beta-clamp.
        - reference_id: PMID:20615954
          supporting_text: >-
            Notably, disruption of this motif in the imuB AAAAGG allele
            eliminated cassette function, strongly implying that ImuB—through
            β—is required to mediate access of DnaE2 to the replication fork.
