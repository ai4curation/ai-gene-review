- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IPI
  original_reference_id: PMID:20615954
  qualifier: enables
  review:
    summary: 'ImuB is the cassette''s interaction hub: it binds ImuA'', DnaE1, DnaE2 and the beta clamp,
      and the clamp interaction is functionally required.'
    action: NEW
    reason: 'Retain this inherited NEW proposal: M. tuberculosis proteins interact with multiple partners
      in yeast two-hybrid, and genetics plus homolog experiments support coordinated recruitment rather
      than generic binding alone. PMID37530405 demonstrates purified M. smegmatis accessory assemblies
      and clamp-dependent foci; PMID39706264 tests the ImuB–ImuA′ interface in that organism. The adaptor
      assignment is a synthesis of target and homolog evidence, not a direct demonstration of the complete
      native M. tuberculosis assembly. No polymerase activity is inferred from the inactive fold.'
    supported_by:
    - reference_id: PMID:20615954
      supporting_text: Yeast two-hybrid analyses indicate that ImuB interacts with both ImuA' and DnaE2,
        as well as with the beta-clamp.
    - reference_id: PMID:20615954
      supporting_text: Notably, disruption of this motif in the imuB AAAAGG allele eliminated cassette
        function, strongly implying that ImuB—through β—is required to mediate access of DnaE2 to the
        replication fork.
    - reference_id: file:analysis/module_audits/bacterial_imuabc_damage_induced_mutagenesis/mycobacteria-consultation/source-scope.md
