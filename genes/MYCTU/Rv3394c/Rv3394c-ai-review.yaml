core_functions:
  - description: >-
      Catalytically dead UmuC-fold adaptor that holds the mutagenesis cassette
      together, linking ImuA' and the DnaE2 polymerase to the beta clamp so that
      DnaE2 can act at the replication fork on damaged templates.
    molecular_function:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    directly_involved_in:
      - id: GO:0042276
        label: error-prone translesion synthesis
    supported_by:
      - reference_id: PMID:20615954
        supporting_text: >-
          Notably, disruption of this motif in the imuB AAAAGG allele eliminated
          cassette function, strongly implying that ImuB—through β—is required to
          mediate access of DnaE2 to the replication fork.
      - reference_id: PMID:20615954
        supporting_text: >-
          Our evidence indicates a central role for ImuB in cassette function
          that is independent of polymerase activity.
    knowledge_gaps:
      - gap_statement: >-
          The order and interdependence of the ImuB interactions, and whether a
          stable ImuA'-ImuB-DnaE2 complex forms, are unknown.
        boundary: >-
          The pairwise interactions and the functional requirement for the
          clamp-binding motif are established; the two-hybrid data do not show
          stoichiometry or simultaneity.
        significance: >-
          Whether the cassette is a true complex or a chain of transient
          contacts determines how, and at which step, it could be inhibited.
        gap_kind:
          - BIOLOGY
        dark_aspect: RESIDUAL_SUBGAP
proposed_new_terms: []
suggested_questions:
  - question: >-
      Does ImuB form a stable ternary complex with ImuA' and DnaE2, and is it
      loaded onto the clamp before or after DnaE2 engagement?
suggested_experiments:
  - description: >-
      Reconstitute ImuA', ImuB, DnaE2 and the beta clamp and test complex
      formation and order of assembly by size exclusion and crosslinking, then
      correlate with induced mutagenesis for alleles that break each interface
      individually.
