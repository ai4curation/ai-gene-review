taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: >-
  Rv3394c is the ImuB protein of the mycobacterial damage-induced mutagenesis
  cassette. It retains the UmuC/Y-family polymerase fold but has lost the
  active-site carboxylates required for catalysis, which UniProt records as a
  caution on propagating the UmuC feature annotation. Instead of synthesizing
  DNA it acts as the interaction hub of the cassette, binding ImuA', DnaE1,
  DnaE2 and the beta clamp; a clamp-binding motif mutant loses cassette function
  as completely as a deletion. Deletion of Rv3394c abolishes damage-induced
  mutagenesis and damage tolerance, placing it in the same pathway as Rv3395c
  (ImuA') and dnaE2.
existing_annotations:
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: involved_in
    review:
      summary: >-
        A PAINT inference placed at a node of PTHR35369 and seeded by this very
        gene's experimental annotation; the claim is sound for ImuB but the term
        is the broad one the seed carried.
      action: MODIFY
      reason: >-
        The IBA inherits whatever term the IBD node carries, and here the IBD at
        PANTHER:PTN002176549 was seeded by UniProtKB:O50419 itself, i.e. by this
        gene's own MTBBASE annotation. Appearing in its own WITH/FROM is the
        expected marker that experimental grounding exists on the target, not
        circularity, so the row is kept rather than removed. What it should say
        is the specific process the seed experiment demonstrates: lesion
        tolerance with induced mutagenesis, not repair. The breadth of the node
        is adjudicated in the PTHR35369 family review, where the family also
        contains SulA cell-division inhibitors for which DNA repair does not
        hold.
      proposed_replacement_terms:
        - id: GO:0042276
          label: error-prone translesion synthesis
      propagation_review:
