  label: Mycobacterium tuberculosis H37Rv
description: Rv3394c (ImuB) is the noncatalytic Y-family polymerase-like adaptor of the mycobacterial
  damage-induced mutagenesis system. It lacks the conserved active-site carboxylates required for polymerase
  catalysis. M. tuberculosis protein-interaction assays identify contacts with ImuA′, DnaE1, DnaE2 and
  the beta clamp; deletion of imuB eliminates induced mutagenesis. Complementary M. smegmatis experiments
  demonstrate clamp-dependent recruitment and a stable ImuA′–ImuB accessory complex. These interactions
  organize the machinery that enables DnaE2-dependent lesion bypass.
