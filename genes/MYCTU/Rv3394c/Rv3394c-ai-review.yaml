- id: PMID:20615954
  title: Essential roles for imuA'- and imuB-encoded accessory factors in DnaE2-dependent mutagenesis
    in Mycobacterium tuberculosis.
  findings:
  - statement: M. tuberculosis imuB deletion eliminates induced mutagenesis; M. smegmatis experiments
      also establish the individual ImuB requirement for damage tolerance.
    supporting_text: Here, we confirm that Rv3395c (designated imuA ′) and Rv3394c ( imuB ) are individually
      essential for induced mutagenesis and damage tolerance.
  - statement: M. tuberculosis proteins show ImuB contacts with ImuA′, DnaE2 and the beta clamp in yeast;
      disrupting the homolog clamp motif compromises cassette function in M. smegmatis.
    supporting_text: Moreover, disruption of the ImuB-β clamp interaction significantly reduces induced
      mutagenesis and damage tolerance, phenocopying imuA ′, imuB , and dnaE2 gene deletion mutants.
  - statement: ImuB's central role in the cassette does not require polymerase activity.
    supporting_text: Our evidence indicates a central role for ImuB in cassette function that is independent
      of polymerase activity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract/discussion plus publisher Results/Methods read. H37Rv imuB and double-deletion
      mutagenesis and M. tuberculosis proteins in yeast two-hybrid are direct target evidence. Individual
      ImuA′, catalytic-site, clamp-motif and MMC-tolerance experiments use M. smegmatis. See source-scope.md.
