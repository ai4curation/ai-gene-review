core_functions:
- description: Noncatalytic polymerase-like adaptor organizing ImuA′ and DnaE2 access to the beta-clamp-associated
    lesion-bypass machinery, supported by M. tuberculosis interaction/genetic evidence and M. smegmatis
    recruitment and accessory-complex experiments.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  directly_involved_in:
  - id: GO:0042276
    label: error-prone translesion synthesis
  supported_by:
  - reference_id: PMID:20615954
    supporting_text: Notably, disruption of this motif in the imuB AAAAGG allele eliminated cassette function,
      strongly implying that ImuB—through β—is required to mediate access of DnaE2 to the replication
      fork.
  - reference_id: PMID:20615954
    supporting_text: Our evidence indicates a central role for ImuB in cassette function that is independent
      of polymerase activity.
  - reference_id: file:analysis/module_audits/bacterial_imuabc_damage_induced_mutagenesis/mycobacteria-consultation/source-scope.md
  knowledge_gaps:
  - gap_statement: How DnaE2 joins the accessory assembly, and the complete native M. tuberculosis mutasome
      stoichiometry and interaction timing, remain unresolved.
    boundary: M. smegmatis ImuA′–ImuB and clamp-associated complexes have been isolated; the ImuB RecA-NT
      interface is functionally tested in that organism. Thus stable accessory association is established,
      but complete target-species assembly dynamics are not.
    significance: Reconstitution with DnaE2 would test how the adaptor controls polymerase access and
      activity.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
