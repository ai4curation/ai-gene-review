suggested_questions:
- question: How does M. tuberculosis DnaE2 join the ImuA′–ImuB/clamp assembly, and which interactions
    coexist during lesion bypass?
suggested_experiments:
- description: Reconstitute M. tuberculosis accessory proteins with DnaE2 and the beta clamp to measure
    recruitment, stoichiometry and lesion-bypass activity; assess native interaction dynamics alongside
    the established M. smegmatis model.
