    summary: A PAINT inference placed at a node of PTHR35369 and seeded by this very gene's experimental
      annotation; the claim is sound for ImuB but the term is the broad one the seed carried.
    action: MODIFY
    reason: 'The IBA inherits whatever term the IBD node carries, and here the IBD at PANTHER:PTN002176549
      was seeded by UniProtKB:O50419 itself, i.e. by this gene''s own MTBBASE annotation. Appearing in
      its own WITH/FROM is the expected marker that experimental grounding exists on the target, not circularity,
      so the row is kept rather than removed. What it should say is the specific process the seed experiment
      demonstrates: lesion tolerance with induced mutagenesis, not repair. The breadth of the node is
      adjudicated in the PTHR35369 family review, where the family also contains SulA cell-division inhibitors
      for which DNA repair does not hold. Target-protein yeast two-hybrid and M. tuberculosis deletion
      evidence are complemented by clamp-mutant and damage-tolerance tests in M. smegmatis. Current GO
      places the specific TLS process outside DNA repair, whose text nevertheless includes historical
      bypass terminology.'
