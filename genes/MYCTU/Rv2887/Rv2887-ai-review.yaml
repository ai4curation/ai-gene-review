- id: PMID:26303802
  title: Mutation of Rv2887, a marR-like gene, confers Mycobacterium tuberculosis
    resistance to an imidazopyridine-based agent.
  findings:
  - statement: >-
      Independently derived M. tuberculosis mutants selected against the
      imidazopyridine MP-III-71 all carried loss-of-function mutations in Rv2887,
      and complementation restored susceptibility.
    supporting_text: >-
      Loss-of-function mutations in Rv2887 were common to all three
      MP-III-71-resistant mutants, and we confirmed the role of Rv2887 as a gene
      required for MP-III-71 susceptibility using complementation.
  - statement: >-
      RNA-seq comparing strains with and without functional Rv2887 showed that
      Rv2887 represses genes of benzoquinone and menaquinone biosynthesis,
      consistent with repressor function.
    supporting_text: >-
      We found that genes involved in benzoquinone and menaquinone biosynthesis
      were repressed by functional Rv2887.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only in the cache (full_text_available: false), so quotes here are
      from the abstract and the detailed RNA-seq target list could not be checked.
      Title and content match the UniProt FUNCTION and DISRUPTION PHENOTYPE lines
      citing this PMID.
- id: PMID:27432954
  title: N-methylation of a bactericidal compound as a resistance mechanism in Mycobacterium
    tuberculosis.
  findings:
  - statement: >-
      Mutations in rv2887 markedly increase rv0560c transcription; rv0560c was the
      most strongly induced gene (~400-fold), with rv0559c and rv0558 also up.
    supporting_text: >-
      The gene with the largest increase in expression—∼400-fold—was rv0560c ,
      annotated as a putative, nonessential benzoquinone methyltransferase.
  - statement: >-
      Purified Rv2887 retards a 70-bp fragment of the rv0560c promoter in EMSA but
      not an unrelated (mbtB) promoter fragment, and the R81Q substitution abolishes
      binding, establishing direct, specific operator binding.
    supporting_text: >-
      Introduction of the R81Q mutation into Rv2887 abolished its ability to bind
      560c-prom DNA
  - statement: >-
      The authors conclude Rv2887 is a repressor of rv0560c and that
      loss-of-function alleles derepress it.
    supporting_text: >-
      Based on these data, we predicted a model in which Rv2887 acts as a repressor
      of rv0560c
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text recovered from PMC. The paper is titled for the methyltransferase
      Rv0560c, but it contains the primary EMSA and transcript data for Rv2887 and
      is the source UniProt cites for the DNA-binding and disruption statements.
- id: PMID:28743871
  title: Structural analysis of the regulatory mechanism of MarR protein Rv2887 in
    M. tuberculosis.
  findings:
  - statement: >-
      DNase I footprinting defines a 27-bp Rv2887-protected sequence upstream of
      Rv0560c.
    supporting_text: >-
      identified a specific 27 bp DNA sequence, CGTCAGCTGAACGGCGGTCGTCGATCG, which
      is protected by Rv2887 protein
  - statement: >-
      Isothermal titration calorimetry shows salicylate, para-aminosalicylic acid
      and gemfibrozil bind Rv2887, two ligands per dimer.
    supporting_text: >-
      The molecular ratio in these ligand binding reactions was two ligands per
      Rv2887 dimer.
  - statement: >-
      Crystal structures place two salicylate or para-aminosalicylic acid molecules
      in pockets at the dimerization interface, each contacting both protomers.
    supporting_text: >-
      Two molecules of SA/PAS bind Rv2887 in two deep symmetry-related pockets at
      the dimerization interface, where each ligand interacts with residues from
      both protomers.
  - statement: >-
      Ligand binding rotates the winged-HTH domain towards the dimerization
      interface, and salicylate or para-aminosalicylic acid dissociates the
      preformed Rv2887-DNA complex in EMSA.
    supporting_text: >-
      Specifically, binding of SA or PAS causes the DNA binding (wHTH) domain to
      rotate up towards the dimerization interface by 15~20°
  - statement: >-
      Rv2887 is a homodimer with a triangular fold; helices alpha1, alpha5 and
      alpha6 form the dimerization domain and alpha3-alpha4 the HTH.
    supporting_text: >-
      Each subunit is composed of two functional domains: helices α1, α5, and α6
      form the dimerization domain, and helices α3 and α4 form a helix-turn-helix
      (HTH) DNA-binding domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text and figures available from PMC; structures deposited as PDB 5HSM,
      5HSO, 5X7Z and 5X80. This is the primary source for ligand binding, the
      operator sequence and the allosteric mechanism.
