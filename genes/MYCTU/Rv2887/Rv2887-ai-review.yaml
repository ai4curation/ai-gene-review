  - InterPro:IPR039422
  review:
    summary: >-
      The InterPro2GO mapping from the MarR-type HTH domain is correct: Rv2887
      binds the Rv0560c promoter sequence-specifically and represses its
      transcription. Experiments in M. tuberculosis support a more specific term,
      because Rv2887 is a repressor whose DNA binding is switched off by ligand.
    action: MODIFY
    reason: >-
      The term is correct but less specific than the evidence supports. Salicylate
      or para-aminosalicylic acid abolishes the Rv2887-DNA complex in EMSA, and the
      ligand-bound crystal structures show a wHTH conformation that cannot engage
      DNA. GO:0141096 ligand-modulated transcription repressor activity (is_a
      GO:0001217, is_a GO:0003700) describes this precisely.
    proposed_replacement_terms:
    - id: GO:0141096
      label: ligand-modulated transcription repressor activity
    supported_by:
    - reference_id: PMID:27432954
      supporting_text: >-
        Introduction of the R81Q mutation into Rv2887 abolished its ability to
        bind 560c-prom DNA
    - reference_id: PMID:28743871
      supporting_text: >-
        addition of SA or PAS to the Rv2887-DNA complex resulted in loss of the
        retarded band, indicating separation of the protein and DNA components
