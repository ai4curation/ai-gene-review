core_functions:
- description: >-
    Ligand-modulated MarR-family repressor. The Rv2887 homodimer occupies a 27-bp
    operator in the htm (Rv0560c) promoter and keeps that locus off; binding of
    salicylate or para-aminosalicylic acid at the dimerization interface rotates
    the winged-HTH domains apart from the operator spacing, dissociating the
    protein from DNA and derepressing the locus.
  molecular_function:
    id: GO:0141096
    label: ligand-modulated transcription repressor activity
  directly_involved_in:
  - id: GO:0045892
    label: negative regulation of DNA-templated transcription
  supported_by:
  - reference_id: PMID:27432954
    supporting_text: >-
      Based on these data, we predicted a model in which Rv2887 acts as a repressor
      of rv0560c
  - reference_id: PMID:28743871
    supporting_text: >-
      addition of SA or PAS to the Rv2887-DNA complex resulted in loss of the
      retarded band, indicating separation of the protein and DNA components
  - reference_id: PMID:28743871
    supporting_text: >-
      Specifically, binding of SA or PAS causes the DNA binding (wHTH) domain to
      rotate up towards the dimerization interface by 15~20°
- description: >-
    Sequence-specific binding to the htm (Rv0560c) operator, a 27-bp site upstream
    of the transcriptional start site; two dimers bind opposite faces of the duplex
    in the co-crystal, each covering about 15 bp.
  molecular_function:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  supported_by:
  - reference_id: PMID:28743871
    supporting_text: >-
      identified a specific 27 bp DNA sequence, CGTCAGCTGAACGGCGGTCGTCGATCG, which
      is protected by Rv2887 protein
  - reference_id: PMID:27432954
    supporting_text: >-
      Rv2887 did not bind to a 36-bp region corresponding to the promoter region of
      an IdeR-regulated gene, mbtB (mbtB-prom)
- description: >-
    Binding of salicylate and the structural analogue para-aminosalicylic acid in
    symmetry-related pockets at the dimer interface, two ligands per dimer, with
    Arg42 and Asp114 contributing; this is the input that switches the repressor
    off.
  molecular_function:
    id: GO:1901149
    label: salicylic acid binding
  supported_by:
  - reference_id: PMID:28743871
    supporting_text: >-
      Two molecules of SA/PAS bind Rv2887 in two deep symmetry-related pockets at
      the dimerization interface, where each ligand interacts with residues from
      both protomers.
  - reference_id: file:MYCTU/Rv2887/Rv2887-uniprot.txt
    record_section: ["FT:MUTAGEN"]
    supporting_text: >-
      /note="D->A: Attenuates the ability to bind salicylate."
suggested_questions:
- question: >-
    Which of the Rv2887-dependent transcripts are direct targets? Only the
    Rv0560c operator has been mapped by footprinting; whether Rv0558, Rv0559c and
    the menaquinone/benzoquinone biosynthesis genes carry their own Rv2887 sites or
    respond indirectly is unresolved.
  experts:
  - mycobacterial transcriptional regulation specialist
- question: >-
    Is there an endogenous physiological ligand for Rv2887? Salicylate,
    para-aminosalicylic acid and gemfibrozil are exogenous, and the measured
    affinities for salicylate and para-aminosalicylic acid are in the high
    micromolar to millimolar range.
  experts:
  - bacterial ligand-responsive regulator biochemist
- question: >-
    Does Rv2887 autoregulate? In E. coli, marR is self-regulated, but rv2887
    transcript levels were unchanged in the loss-of-function clones, which suggests
    the mycobacterial protein does not bind its own promoter.
  experts:
  - MarR-family structural biologist
suggested_experiments:
- description: >-
    ChIP-seq of epitope-tagged Rv2887 in M. tuberculosis, with and without
    salicylate, to enumerate direct operator sites genome-wide and separate them
    from the secondary transcriptional changes seen by RNA-seq.
- description: >-
    Footprinting and EMSA on the promoters of Rv0558, Rv0559c and the menaquinone
    biosynthesis genes with purified Rv2887, to test whether the 27-bp operator
    consensus recurs at those loci.
- description: >-
    Screen a metabolite library by thermal shift or isothermal titration
    calorimetry against purified Rv2887 to look for an endogenous ligand of higher
    affinity than salicylate, then test any hit for release of the protein from the
    Rv0560c operator.
