    action: MODIFY
    reason: >-
      Transcript profiling of an rv2887 mutant shows derepression of rv0560c and of
      the neighbouring rv0558/rv0559c genes, and an independent study reported
      repression of benzoquinone and menaquinone biosynthesis genes by functional
      Rv2887. Action kept consistent with the IBA row for the same term.
