- term:
    id: GO:0000976
    label: transcription cis-regulatory region binding
  evidence_type: IDA
  original_reference_id: PMID:28743871
  qualifier: enables
  review:
    summary: >-
      DNase I footprinting with purified Rv2887 defined a protected 27-bp sequence
      upstream of Rv0560c, and a co-crystal structure of two Rv2887 dimers bound to
      a 30-bp duplex from that region shows the recognition helices inserted into
      the major groove. EMSA in a second study showed the protein binds a 70-bp
      fragment spanning the Rv0560c promoter but not an unrelated promoter fragment,
      and the R81Q substitution abolishes binding.
    action: NEW
    reason: >-
      Operator binding is a distinct molecular function from the transcription
      factor activity row, is directly demonstrated in this species by footprinting,
      EMSA and crystallography, and is currently absent from GOA. The negative
      control (no binding to the mbtB promoter fragment) establishes specificity.
    supported_by:
    - reference_id: PMID:28743871
      supporting_text: >-
        identified a specific 27 bp DNA sequence, CGTCAGCTGAACGGCGGTCGTCGATCG,
        which is protected by Rv2887 protein
    - reference_id: PMID:27432954
      supporting_text: >-
        Rv2887 did not bind to a 36-bp region corresponding to the promoter region
        of an IdeR-regulated gene, mbtB (mbtB-prom)
- term:
    id: GO:1901149
    label: salicylic acid binding
  evidence_type: IDA
  original_reference_id: PMID:28743871
  qualifier: enables
  review:
    summary: >-
      Isothermal titration calorimetry showed Rv2887 binds salicylate, with two
      ligands per dimer, and crystal structures of the salicylate- and
      para-aminosalicylic acid-bound forms (PDB 5X7Z, 5X80) place each ligand in a
      pocket at the dimerization interface contacting both protomers. UniProt
      records Arg42 and Asp114 as salicylate-binding residues, and the R42A and
      D114A substitutions attenuate binding.
    action: NEW
    reason: >-
      Direct, structurally resolved ligand binding in this species, with mutagenesis
      of the binding site; the function is mechanistically central because ligand
      occupancy is what releases the repressor from DNA. Not covered by any existing
      annotation.
    supported_by:
    - reference_id: PMID:28743871
      supporting_text: >-
        Two molecules of SA/PAS bind Rv2887 in two deep symmetry-related pockets at
        the dimerization interface, where each ligand interacts with residues from
        both protomers.
    - reference_id: file:MYCTU/Rv2887/Rv2887-uniprot.txt
      record_section: ["FT:MUTAGEN"]
      supporting_text: >-
        /note="R->A: Attenuates the ability to bind salicylate."
