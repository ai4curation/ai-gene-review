id: P9WME9
gene_symbol: Rv2887
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: >-
  Rv2887 is a 139-residue MarR-family winged helix-turn-helix transcriptional
  repressor of Mycobacterium tuberculosis. It forms a triangular homodimer in
  which helices alpha1, alpha5 and alpha6 make the dimerization domain and the
  wHTH motif contacts DNA. Rv2887 binds a 27-bp operator sequence in the promoter
  of htm (Rv0560c), which encodes an S-adenosyl-L-methionine-dependent
  methyltransferase, and represses htm together with the neighbouring Rv0558 and
  Rv0559c genes; loss-of-function alleles derepress htm several hundred-fold.
  Salicylate, para-aminosalicylic acid and gemfibrozil are ligands of Rv2887.
  Two salicylate or para-aminosalicylic acid molecules bind per dimer in pockets
  at the dimerization interface lined by Arg42 and Asp114, and ligand binding
  rotates the wHTH domains into a conformation incompatible with DNA binding,
  releasing the repressor from the htm promoter. Rv2887 is thus a
  ligand-modulated repressor that couples salicylate-like phenolic compounds to
  induction of a methyltransferase locus.
existing_annotations:
