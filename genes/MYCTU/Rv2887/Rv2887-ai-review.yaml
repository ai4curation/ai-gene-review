- term:
    id: GO:0006950
    label: response to stress
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002109389
  - UniProtKB:O34777
  - UniProtKB:P27245
  review:
    summary: >-
      A second IBD at the same PTHR33164 node, seeded by E. coli MarR (P27245) and
      B. subtilis O34777, records that members of this clade change transcription
      in response to small-molecule and oxidative challenge. Rv2887 fits that
      pattern: salicylate and para-aminosalicylic acid bind it directly and release
      it from the htm promoter, so a chemical cue is transduced into a change in
      gene expression. The term is broad and peripheral to what Rv2887 does as a
      protein, but it is not wrong, and GO offers no term for the specific cue
      ("response to salicylate" exists only as plant-centric terms in the salicylic
      acid branch, whose ancestors assume defence signalling).
    action: KEEP_AS_NON_CORE
    reason: >-
      Defensible and as precise as the available ontology allows for this gene, but
      contextual rather than core. The core claims are the repressor activity and
      the operator binding. Not marked TOO_GENERAL because no other term in this
      review entails it: the negative-regulation and repressor-activity terms say
      nothing about a stimulus.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN002109389
        source_label: PTHR33164 ancestral node
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Two-donor IBD. A short donor list is not weak support here: both donors
          are well-characterized ligand-responsive MarR regulators, and the target
          has its own ligand-binding and DNA-release data.
    supported_by:
    - reference_id: PMID:28743871
      supporting_text: >-
        We show that Rv2887 binds ligands SA, PAS and gemfibrozil, and determine
        its precise DNA binding sequence in the promoter of Rv0560c.
