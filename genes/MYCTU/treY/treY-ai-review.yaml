taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: >-
  TreY (Rv1563c) is the maltooligosyl trehalose synthase of Mycobacterium
  tuberculosis, a cytosolic glycoside hydrolase family 13 (GH13) enzyme. It
  catalyses an intramolecular transglycosylation that converts the reducing-end
  alpha-1,4-linked glucose of a glycogen-like alpha-1,4-glucan into an
  alpha,alpha-1,1-linked terminal glucose, forming maltooligosyltrehalose. The
  partner hydrolase TreZ (Rv1562c), encoded by the adjacent gene, then releases
  free trehalose. The TreY-TreZ route is one of three trehalose-biosynthesis
  pathways in mycobacteria, alongside OtsA-OtsB (from glucose 6-phosphate and
  UDP-glucose) and TreS (from maltose).
