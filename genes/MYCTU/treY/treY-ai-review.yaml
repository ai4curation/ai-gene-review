  review:
    summary: True secondary process; the TreY-TreZ route consumes glycogen-like glucan termini.
    action: KEEP_AS_NON_CORE
    reason: >-
      With TreZ, TreY converts the reducing end of a glycogen-like
      alpha-1,4-glucan into trehalose, so the coupled route breaks down the
      glucan two glucose units at a time. That is real but secondary to the
      route's biosynthetic purpose; trehalose biosynthesis is the core process.
      PAINT seeded this node from the target's own IDA (PMID:10658666).
    supported_by:
    - reference_id: PMID:10658666
      supporting_text: >-
        from glycogen-like alpha(1-->4)-linked glucose polymers (the TreY-TreZ
        pathway)
