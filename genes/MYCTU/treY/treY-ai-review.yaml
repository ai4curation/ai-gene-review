suggested_questions:
- question: >-
    What fraction of M. tuberculosis trehalose comes from the TreY-TreZ route
    from glycogen during infection, given that OtsA-OtsB is the essential route?
suggested_experiments:
- description: >-
    Measure trehalose and glycogen pools in Rv1563c deletion and complemented
    strains, singly and combined with treS, under carbon starvation and in
    macrophages.
