  label: Mycobacterium tuberculosis H37Rv
description: DnaE1 is the principal replicative DNA polymerase of Mycobacterium tuberculosis. It extends
  DNA primers and uses an intrinsic PHP-domain exonuclease to remove mismatched nucleotides. This combination
  supports chromosome duplication and replication fidelity in the cytoplasm.
