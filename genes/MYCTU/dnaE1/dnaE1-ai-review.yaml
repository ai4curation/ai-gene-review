- id: PMID:25894501
  title: DNA replication fidelity in Mycobacterium tuberculosis is mediated by an ancestral prokaryotic
    proofreader.
  reference_review:
    review_notes: Purified H37Rv Rv1547 directly supports both activities. Large mutation-rate estimates
      in the paper include M. smegmatis experiments and are not assigned numerically to H37Rv. Later evidence
      for noncanonical DnaQ does not negate intrinsic PHP proofreading.
  findings:
  - statement: Purified M. tuberculosis DnaE1 catalyzes polymerization and intrinsic PHP-dependent 3-prime
      proofreading.
    supporting_text: Wild-type DnaE1MTB shows clear 3′-5′ exonuclease activity
  - statement: The recombinant enzyme is explicitly Rv1547; expression in M. smegmatis does not change
      its source identity.
    supporting_text: M. tuberculosis dnaE1 (Rv1547) was cloned into the pYUB28b vector
