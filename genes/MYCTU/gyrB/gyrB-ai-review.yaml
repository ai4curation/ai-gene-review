taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: GyrB is the nucleotide-binding subunit of Mycobacterium tuberculosis H37Rv DNA gyrase.
  Its N-terminal ATPase domain supplies energy for partner-dependent strand passage, while its TOPRIM
  region participates in the DNA-cleavage machinery. Two GyrB and two GyrA subunits form the cytoplasmic
  gyrase complex, which introduces negative DNA supercoils and decatenates DNA. The enzyme supplies
  DNA-topology capacities in a bacterium lacking the usual topoisomerase IV paralog.
