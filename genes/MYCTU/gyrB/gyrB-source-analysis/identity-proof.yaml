supported_by:
- reference_id: PMID:17038336
  supporting_text: The gyrA and gyrB genes were both amplified from the genomic DNA from M.tuberculosis
    H37Rv, and ligated to pET20b and pET32a, respectively.
- reference_id: PMID:17038336
  supporting_text: The resulting plasmids, pET20b-gyrA and pET32a-gyrB, were sequenced and the sequences
    of the gyrA and gyrB genes were identical respectively to the corresponding regions of the sequence
    with the GenBank accession number NC 000962.
- reference_id: PMID:41255390
  supporting_text: encoding each full-length gyrase subunit (UniProt accession numbers P9WG47 and
    P9WG45, respectively).
construct_boundaries:
- PMID17038336 uses histidine-tagged proteins; tag cleavage is not reported. GyrA mutants are compared
  with wild type, not substituted for the exemplar.
- PMID15047530 uses cosmid T776; GyrA C-terminal His6 and GyrB N-terminal His10. H37Rv is explicitly
  the MIC-test strain.
- PMID41255390 uses pET28a full-length constructs and His-affinity purification without reported
  tag removal; its whole-enzyme inhibition assays do not demonstrate decatenation.
- PMID31953321 full construct details remain inaccessible; no strain identity is inferred from that
  abstract.
