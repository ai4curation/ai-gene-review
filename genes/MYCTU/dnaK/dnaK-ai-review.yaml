id: P9WMJ9
gene_symbol: dnaK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: DnaK is an Hsp70 chaperone that couples ATP binding and hydrolysis to binding and release
  of nonnative protein clients. DnaJ cochaperones assist client handling and GrpE promotes nucleotide
  exchange, enabling repeated folding cycles. The mycobacterial protein also occurs at the bacterial surface,
  in capsule preparations and in extracellular vesicles; these locations do not establish macrophage adhesin
  activity.
