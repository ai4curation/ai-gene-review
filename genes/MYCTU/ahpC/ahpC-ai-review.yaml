    supporting_text: ahpC from either Mycobacterium tuberculosis or S. typhimurium fully complemented
      the defect.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Mtb AhpC tested by Salmonella complementation and transfected human cells. Directly
      supports protective capacity, but native H37Rv phenotypes come from PMID:12368447 rather than these
      heterologous hosts.
