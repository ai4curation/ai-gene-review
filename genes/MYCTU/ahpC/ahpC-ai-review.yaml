id: P9WQB7
gene_symbol: ahpC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: AhpC is a thiol-dependent peroxiredoxin that reduces hydrogen peroxide, organic hydroperoxides
  and peroxynitrite. Its oxidized catalytic cysteines can be regenerated through an AhpD/lipoyl-DlaT/Lpd
  relay or a thioredoxin C/thioredoxin-reductase system. These alternative donor chains are biochemically
  characterized, while their relative physiological contributions depend on conditions and other antioxidant
  systems. AhpC contributes to resistance to peroxynitrite and has redox-dependent oligomeric assemblies.
