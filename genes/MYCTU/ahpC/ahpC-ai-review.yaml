  review:
    summary: AhpC forms a catalytic mixed disulfide with the reductase AhpD.
    action: MODIFY
    reason: PMID:15178486 maps an activity-linked AhpC–AhpD contact rather than merely co-purification.
      Enzyme binding captures this specific partner class. Its coupled assay uses bovine dihydrolipoamide
      dehydrogenase and free lipoamide; that does not identify a native Lpd–DlaT interface. The source
      under review is PMID:15178486.
    supported_by:
    - reference_id: PMID:15178486
      supporting_text: A key step in the reduction of oxidized AhpC by reduced AhpD is formation of a
        disulfide cross-link between Cys61 of AhpC and Cys133 of AhpD.
    proposed_replacement_terms:
