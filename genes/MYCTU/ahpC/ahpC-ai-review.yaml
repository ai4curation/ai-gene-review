    supporting_text: 739 proteins have been identified by two or more distinct peptide sequences
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Native H37Rv membrane-fraction proteomics with 739 two-peptide identifications. Abstract
      available, but target-level tables and controls could not be recovered; no target-specific membrane
      exclusion or contamination claim is warranted.
- id: PMID:14871480
  title: Multiple thioredoxin-mediated routes to detoxify hydroperoxides in Mycobacterium tuberculosis.
  findings:
  - statement: Abstract directly establishes TrxR–TrxC–AhpC peroxide turnover and distinguishes Tpx donor
      breadth.
    supporting_text: NADPH-driven hydroperoxide reduction by AhpC that is mediated by thioredoxin reductase
      and thioredoxin C
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract directly establishes TrxR–TrxC–AhpC peroxide turnover and distinguishes Tpx
      donor breadth. Quantitative AhpC parameters are independently publication-linked in curated UniProt.
      Full publisher retrieval failed; native donor predominance is not established.
- id: PMID:15178486
  title: Intermolecular interactions in the AhpC/AhpD antioxidant defense system of Mycobacterium tuberculosis.
  findings:
  - statement: Target AhpC/AhpD mutants and reversible mixed disulfides resolve their direct exchange.
    supporting_text: A key step in the reduction of oxidized AhpC by reduced AhpD is formation of a disulfide
      cross-link between Cys61 of AhpC and Cys133 of AhpD.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Target AhpC/AhpD mutants and reversible mixed disulfides resolve their direct exchange.
      The reconstituted assay explicitly uses bovine DHLDH and free lipoamide, not an all-native Lpd/DlaT
      preparation.
- id: PMID:9660963
  title: Alkyl hydroperoxide reductase subunit C (AhpC) protects bacterial and human cells against reactive
    nitrogen intermediates.
  findings:
