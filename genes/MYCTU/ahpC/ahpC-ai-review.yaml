  review:
    summary: AhpC directly reduces hydroperoxides through a thiol-dependent catalytic cycle.
    action: MODIFY
    reason: The peroxidase claim is correct; GO:0051920 describes the supported peroxiredoxin chemistry
      more precisely. PMID:10766746 assays the purified target, while PMID:11799204 connects it to a native-protein
      reducing relay. The source under review is PMID:11799204.
    supported_by:
    - reference_id: PMID:10766746
      supporting_text: The peroxiredoxin AhpC from Mycobacterium tuberculosis has been expressed, purified,
        and characterized.
