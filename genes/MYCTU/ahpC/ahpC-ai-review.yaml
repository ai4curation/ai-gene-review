  review:
    summary: AhpC contributes to defense against reactive nitrogen intermediates.
    action: ACCEPT
    reason: The nitrosative-defense claim is supported by peroxide/peroxynitrite chemistry and the cited
      perturbation studies. Different assay hosts and growth stages must not be flattened into a universal
      virulence requirement; peroxynitrite reduction is distinct from direct nitric-oxide reduction. The
      source under review is PMID:12368447.
