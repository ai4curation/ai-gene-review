- id: PMID:10766746
  title: The AhpC and AhpD antioxidant defense system of Mycobacterium tuberculosis.
  findings:
  - statement: Purified Mtb AhpC and AhpD measured separately with Salmonella AhpF or DTT.
    supporting_text: The endogenous electron donor for catalytic turnover of the two proteins is not known
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Purified Mtb AhpC and AhpD measured separately with Salmonella AhpF or DTT. Native donor
      unknown in this early paper; later mixed-disulfide work revises its initial no-interaction interpretation.
      Abstract inspected; publisher full-text access failed.
- id: PMID:11001062
  title: Peroxynitrite reductase activity of bacterial peroxiredoxins.
  findings:
  - statement: Peroxynitrite-to-nitrite chemistry is demonstrated, including Mtb and H.
    supporting_text: Results are similar with peroxiredoxins from Mycobacterium tuberculosis and Helicobacter
      pylori.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Peroxynitrite-to-nitrite chemistry is demonstrated, including Mtb and H. pylori comparators;
      it is not nitric-oxide reduction. PMID abstract and normally recovered publisher page inspected,
      without treating the page as complete methods.
- id: PMID:11171096
  title: Characterization of the Mycobacterium tuberculosis H37Rv alkyl hydroperoxidase AhpC points to
    the importance of ionic interactions in oligomerization and activity.
  findings:
  - statement: Target H37Rv AhpC biophysical study.
    supporting_text: We show that AhpC is a decameric protein, composed of five identical dimers held
      together by ionic interactions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Target H37Rv AhpC biophysical study. Abstract reports decamer and ionic effects; it
      does not establish a native AhpF donor, which Mtb lacks. Later BCG redox-dependent dodecamer findings
      require condition-specific oligomer descriptions.
- id: PMID:11799204
  title: Metabolic enzymes of mycobacteria linked to antioxidant defense by a thioredoxin-like protein.
  findings:
  - statement: Direct identification of an Lpd–DlaT (then SucB)–AhpD–AhpC redox relay.
    supporting_text: The peroxiredoxin alkyl hydroperoxide reductase (AhpC) is linked to Lpd and SucB
      by an adaptor protein, AhpD.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct identification of an Lpd–DlaT (then SucB)–AhpD–AhpC redox relay. Available abstract
      supports the coupled mechanism; Science full text could not be recovered. Later native metabolic
      and physiological studies qualify old sole-lipoyl-protein and pathway-necessity statements.
- id: PMID:12084012
  title: Site-directed mutagenesis reveals a novel catalytic mechanism of Mycobacterium tuberculosis alkylhydroperoxidase
    C.
  findings:
  - statement: Target AhpC cysteine-mutant experiments, including recovery of some activity in a double
      mutant.
    supporting_text: Cys-61 plays a central role in activity and Cys-174 also appears to be crucial.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Target AhpC cysteine-mutant experiments, including recovery of some activity in a double
      mutant. Abstract inspected; donor specificity must not be reconstructed from the title or this mutational
      abstract alone.
- id: PMID:12368447
  title: 'Oxidative stress response genes in Mycobacterium tuberculosis: role of ahpC in resistance to
    peroxynitrite and stage-specific survival in macrophages.'
  findings:
  - statement: Native H37Rv and M.
    supporting_text: In contrast, inactivation of ahpC in M. tuberculosis did not cause increased sensitivity
      to donors of NO alone.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native H37Rv and M. smegmatis mutant phenotypes distinguish peroxynitrite from NO alone
      and resting from IFNgamma-activated macrophages. Abstract explicitly supports these assay bounds.
- id: PMID:14532352
  title: Comprehensive proteomic profiling of the membrane constituents of a Mycobacterium tuberculosis
    strain.
  findings:
