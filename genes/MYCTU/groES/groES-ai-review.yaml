id: P9WPE5
gene_symbol: groES
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: GroES (Cpn10) is the essential cochaperonin of Mycobacterium tuberculosis. Its heptameric
  lid binds the chaperonin and supports the ATP-driven protein-folding cage, with GroEL2 supplying the
  ATPase machinery. Metal ions bind the Cpn10 dome region and influence its conformation and oligomerization.
  GroES is heat inducible and has also been detected among extracellular plasminogen-binding proteins.
