  full_text_unavailable: true
- id: PMID:20966518
  title: Streptomycin induced protein expression analysis in Mycobacterium tuberculosis by two-dimensional
    gel electrophoresis & mass spectrometry.
  findings:
  - statement: A clinical isolate increases 10-kDa chaperonin abundance under subinhibitory streptomycin;
      induction is not evidence for a direct antibiotic-resistance enzyme.
    supporting_text: two 10 kDa chaperonin) that were upregulated in the presence of drug.
  full_text_unavailable: true
- id: PMID:27353550
  title: Biochemical evidence for relaxed substrate specificity of Nα-acetyltransferase (Rv3420c/rimI)
    of Mycobacterium tuberculosis.
  findings:
  - statement: RimI acetylates the GroES N terminus; this is a specific interaction/PTM context, not a
      standalone generic protein-binding function.
- id: PMID:8954912
  title: Evidence for GroES acting as a transcriptional regulator.
  findings:
  - statement: Heterologous Mtb Cpn10 expression changes E. coli protein/transcript accumulation; GroES-mutant
      heat experiments are in E. coli.
    supporting_text: Upon expression of Mycobacterium tuberculosis cpn10 in Escherichia coli
  full_text_unavailable: true
- id: PMID:11477217
  title: Metal ions modulate the plastic nature of Mycobacterium tuberculosis chaperonin-10.
  full_text_unavailable: true
  findings:
  - statement: Cations reversibly alter the Mtb Cpn10 dome-loop conformation.
    supporting_text: These changes are fully reversed in the presence of chelating agents such as EDTA
- id: PMID:12837792
  title: Mycobacterium tuberculosis chaperonin 10 heptamers self-associate through their biologically
    active loops.
  findings:
  - statement: The target Cpn10 structure and DLS reveal metal-dependent assembly; the discussed ATP-transport
      role is hypothetical.
    supporting_text: Tetradecameric cpn10(Mt) has also been observed in solution by dynamic light scattering.
- id: PMID:18227175
  title: A Mycobacterium tuberculosis mutant lacking the groEL homologue cpn60.1 is viable but fails to
    induce an inflammatory response in animal models of infection.
  full_text_unavailable: true
  findings:
  - statement: Genetic tests distinguish essential cpn60.2/cpn10 from dispensable cpn60.1.
    supporting_text: cpn60.2 and cpn10, but not cpn60.1, are essential for cell survival.
- id: PMID:22834700
  title: 'The unusual mycobacterial chaperonins: evidence for in vivo oligomerization and specialization
    of function.'
  full_text_unavailable: true
  findings:
  - statement: Mtb and M. smegmatis Cpn60.2 complement E. coli GroEL with cognate or E. coli cochaperonin;
      nucleotide/kosmotrope conditions promote oligomerization and ATPase activity.
    supporting_text: the Cpn60.2 proteins from both organisms can replace the essential groEL gene of
      Escherichia coli
- id: PMID:7867782
  title: 'GroES and the chaperonin-assisted protein folding cycle: GroES has no affinity for nucleotides.'
  full_text_unavailable: true
  findings:
  - statement: Direct nucleotide-binding tests on E. coli GroES are negative; this is a comparator rather
      than a direct assay of Bacillus or Mtb GroES.
    supporting_text: Using rigorous physical methods, isothermal calorimetry and equilibrium binding,
      no interaction between GroES and nucleotides could be detected.
