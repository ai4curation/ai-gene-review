id: P9WMN1
gene_symbol: hisG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: hisG (Rv2121c) encodes the long-form ATP phosphoribosyltransferase (ATP-PRT, EC 2.4.2.17)
  of Mycobacterium tuberculosis, which condenses ATP with 5-phospho-alpha-D-ribose 1-diphosphate (PRPP)
  to form N1-(5-phospho-beta-D-ribosyl)-ATP and diphosphate, the first and committed step of L-histidine
  biosynthesis. The 284-residue protein has two catalytic domains forming the active site and a C-terminal
  regulatory domain that binds L-histidine; histidine acts as an allosteric feedback inhibitor, and AMP
  binds in the active site as an inhibitor. The reaction requires Mg2+ and follows an ordered sequential
  mechanism with ATP binding first. The soluble cytoplasmic enzyme self-associates into dimers and hexamers,
  with the hexamer associated with histidine inhibition in crystal structures. Transposon mutagenesis
  indicates that hisG is required for growth in vitro, and the enzyme has been studied as an anti-tuberculosis
  drug target.
