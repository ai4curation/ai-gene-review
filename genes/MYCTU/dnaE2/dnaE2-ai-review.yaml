      label: DNA-directed DNA polymerase activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    review:
      summary: >-
        A PAINT inference for polymerase activity placed in the DnaE/PolC family
        and seeded by the E. coli replicative alpha subunit.
      action: ACCEPT
      reason: >-
        The IBD at PANTHER:PTN000793159 asserts DNA-directed DNA polymerase
        activity from UniProtKB:P10443, the E. coli DNA polymerase III alpha
        subunit. The node placement is the only question that matters here, and
        polymerase activity is the shared, defining chemistry of the whole
        PTHR32294 family: DnaE1, DnaE2 and PolC subfamilies alike. DnaE2 is a
        divergent paralog in process terms, but not in catalysis, and its
        catalytic residues are retained and functionally required.
      supported_by:
        - reference_id: file:interpro/panther/PTHR32294/PTHR32294-paint.tsv
          supporting_text: "PTHR32294\tPTN000793159\tGO:0003887\tF\tIBD\tfalse\tUniProtKB:P10443"
