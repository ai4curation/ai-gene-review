id: P9WNT5
gene_symbol: dnaE2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: >-
  DnaE2 (Rv3370c) is the damage-inducible, error-prone DNA polymerase of
  Mycobacterium tuberculosis and the catalytic component of the ImuA'-ImuB-DnaE2
  mutagenesis cassette. It is a second, non-essential copy of the type-C
  polymerase alpha subunit: it is LexA-regulated and induced by all forms of DNA
  damage, is dispensable for chromosome replication, and lacks both the
  C-terminal clamp-loader-binding region and the PHP-domain exonuclease residues
  of the replicative DnaE1. Substituting its catalytic residues reproduces the
  deletion phenotype, so DnaE2 itself performs the synthesis past lesions.
  Through this activity it drives survival after UV irradiation, virulence in
  mice, and the emergence of drug resistance in vivo.
