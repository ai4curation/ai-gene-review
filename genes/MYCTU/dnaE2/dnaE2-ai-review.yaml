gene_symbol: dnaE2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: DnaE2 (Rv3370c) is the damage-inducible, error-prone C-family DNA polymerase of Mycobacterium
  tuberculosis. Together with ImuA′ and the noncatalytic adaptor ImuB, it enables mutagenic synthesis
  past DNA lesions. It is dispensable for normal growth and is distinct from the major replicative polymerase
  DnaE1, while contributing to replication-associated damage tolerance. M. tuberculosis genetics establish
  effects on UV survival, induced mutation, infection and emergence of resistance; catalytic-site experiments
  in M. smegmatis support the conserved synthetic mechanism. Its PHP domain lacks key residues of the
  active DnaE1 proofreader.
