- id: PMID:20615954
  title: Essential roles for imuA'- and imuB-encoded accessory factors in DnaE2-dependent mutagenesis
    in Mycobacterium tuberculosis.
  findings:
  - statement: M. smegmatis DnaE2 active-site substitutions reproduce the deletion phenotype, supporting
      a conserved catalytic role alongside M. tuberculosis genetic and sequence evidence.
    supporting_text: Point mutations in the DnaE2 active site eliminated induced mutagenesis and damage
      tolerance, reproducing the dnaE2 deletion phenotype.
  - statement: DnaE2 lacks the clamp-loader-binding C-terminal region of the replicative alpha subunit.
    supporting_text: All major DNA polymerase IIIα structural/functional domains ( 23 , 24 ) are readily
      identified in DnaE2, except for the very C-terminal region which in E. coli has been implicated
      in the interaction of α with the clamp-loader subunit, τ ( 28 , 29 ).
  - statement: Key PHP-domain exonuclease residues retained in M. tuberculosis DnaE1 are absent in DnaE2;
      this limits propagation of proofreading activity without establishing an experimentally measured
      zero activity.
    supporting_text: The corresponding domain of Mtb DnaE1 retains all amino acids associated with exonuclease
      activity ( 34 – 36 ), whereas key residues are absent in DnaE2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract/discussion plus publisher Results/Methods read. H37Rv imuB and double-deletion
      mutagenesis and M. tuberculosis proteins in yeast two-hybrid are direct target evidence. Individual
      ImuA′, catalytic-site, clamp-motif and MMC-tolerance experiments use M. smegmatis. See source-scope.md.
- id: PMID:12705867
  title: DnaE2 polymerase contributes to in vivo survival and the emergence of drug resistance in Mycobacterium
    tuberculosis.
  findings:
  - statement: dnaE2 is upregulated by DNA-damaging agents and during mouse infection; its loss reduces
      UV survival and virulence, and DnaE2-dependent mutagenesis contributes to drug resistance in vivo.
    supporting_text: and can contribute directly to the emergence of drug resistance in vivo
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in the cache; it is the experimental reference behind UniProt's curated
      FUNCTION statement (ECO:0000269|PubMed:12705867), and the quoted claims are in the abstract itself.
- id: PMID:12029045
  title: Definition of the mycobacterial SOS box and use to identify LexA-regulated genes in Mycobacterium
    tuberculosis.
  findings:
  - statement: dnaE2 is one of the genes identified as LexA-regulated through the refined mycobacterial
      SOS box consensus.
    supporting_text: dnaE2, a component of DNA polymerase III
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only in the cache; it is the reference behind UniProt's curated INDUCTION statement
      (ECO:0000269|PubMed:12029045). Note that its description of dnaE2 as a component of DNA polymerase
