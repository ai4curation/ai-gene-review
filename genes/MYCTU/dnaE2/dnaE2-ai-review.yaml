  knowledge_gaps:
  - gap_statement: The lesion spectrum, fidelity and any residual PHP-domain nuclease activity of M. tuberculosis
      DnaE2 in a fully reconstituted mutasome remain unresolved.
    boundary: Polymerase chemistry and the mutagenic biological role are established by family/sequence
      and genetic evidence. M. smegmatis catalytic-mutant and recruitment studies support the conserved
      mechanism but do not measure the target enzyme kinetic properties.
    significance: A target-specific reconstitution could distinguish lesion preferences and identify selective
      inhibition mechanisms.
    gap_kind:
    - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
proposed_new_terms: []
suggested_questions:
- question: Which lesions does M. tuberculosis DnaE2 bypass in a reconstituted accessory complex, with
    what fidelity, and does its PHP domain retain measurable nuclease activity?
suggested_experiments:
- description: Reconstitute DnaE2 with ImuA', ImuB and the beta clamp on lesion-containing primer-templates,
    measure bypass efficiency and misinsertion spectra, and compare with DnaE1 to identify a selectivity
    window for inhibitors.
