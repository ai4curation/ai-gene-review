core_functions:
  - description: >-
      Damage-inducible, non-replicative type-C DNA polymerase that catalyses
      synthesis across DNA lesions once ImuA' and ImuB have given it access to
      the replication fork; the synthesis is error-prone, and the resulting
      mutations drive survival after damage and the emergence of drug resistance.
    molecular_function:
      id: GO:0003887
      label: DNA-directed DNA polymerase activity
    directly_involved_in:
      - id: GO:0042276
        label: error-prone translesion synthesis
    supported_by:
      - reference_id: PMID:20615954
        supporting_text: >-
          In contrast, replacement of DnaE2 catalytic residues reproduces the
          dnaE2 gene deletion phenotype, strongly implying a direct role for the
          α-subunit in mutagenic lesion bypass.
      - reference_id: file:MYCTU/dnaE2/dnaE2-uniprot.txt
        record_section: ["DR:HAMAP"]
        supporting_text: 'DR   HAMAP; MF_01902; DNApol_error_prone; 1.'
      - reference_id: PMID:12705867
        supporting_text: and can contribute directly to the emergence of drug resistance in vivo
    knowledge_gaps:
      - gap_statement: >-
          No DnaE2 protein has been purified and assayed, so its fidelity, the
          lesions it can bypass, and whether its PHP domain retains any
          nuclease activity are unknown.
        boundary: >-
          The genetic requirement, the dependence of that requirement on the
          catalytic residues, and the in vivo mutagenic consequence are
          established.
        significance: >-
          The cassette is proposed as a drug target for limiting resistance
          evolution, which requires knowing the enzyme's substrate range and
          whether it can be inhibited without affecting the essential DnaE1.
        gap_kind:
          - BIOLOGY
        dark_aspect: MF_DARK
proposed_new_terms: []
suggested_questions:
  - question: >-
      Can purified DnaE2 extend past defined lesions with ImuA', ImuB and the
      beta clamp, and is its low fidelity intrinsic or conferred by the
      accessory factors?
suggested_experiments:
  - description: >-
      Reconstitute DnaE2 with ImuA', ImuB and the beta clamp on lesion-containing
      primer-templates, measure bypass efficiency and misinsertion spectra, and
      compare with DnaE1 to identify a selectivity window for inhibitors.
