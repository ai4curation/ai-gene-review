    label: L-cysteine desulfhydrase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000034535
  - UniProtKB:P0ABK5
  review:
    summary: Cysteine desulfhydration is an inherited secondary CysK activity.
    action: KEEP_AS_NON_CORE
    reason: PAINT places this activity on CysK node PTN000034535, grounded in experimental E. coli CysK
      desulfhydrase evidence (PMID16000837). P9WP55 belongs to this clade and no target-specific loss
      was identified; absence of a target assay alone does not overturn the phylogenetic judgment. This
      does not establish a principal cysteine-degradation role in H37Rv.
    supported_by:
    - reference_id: PMID:16000837
