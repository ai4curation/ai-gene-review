id: P9WP55
gene_symbol: cysK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: CysK1 is a cytosolic PLP-dependent O-acetylserine sulfhydrylase of Mycobacterium tuberculosis
  H37Rv. It combines O-acetylserine and sulfide to produce L-cysteine. A CysE C-terminal peptide occupies
  its substrate-binding site and inhibits catalysis. This OAS-dependent enzyme is distinct from the OPS-
  and sulfur-carrier-preferring paralog CysM.
