taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: ArgF (Rv1656) is the cytoplasmic anabolic ornithine carbamoyltransferase of Mycobacterium
  tuberculosis. It transfers the carbamoyl group of carbamoyl phosphate to ornithine, forming citrulline
  and phosphate during arginine biosynthesis. The enzyme forms a homotrimer, and substrate-analogue structures
  delineate active-site closure. Loss of argF disrupts arginine production; interpretation of insertion
  mutants must also account for polarity on downstream argG.
