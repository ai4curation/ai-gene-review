  review:
    summary: protein folding is supported in the chaperonin system.
    action: ACCEPT
    reason: 'The protein directly performs part of the folding cycle: GroEL supplies the folding chamber
      and ATP-driven conformational cycle, while GroES provides its functional lid. Target curated HAMAP
      evidence supports this inherited function. PAINT lineage checks found no IRD/IKR loss; donor count
      is not used as a confidence metric. Mycobacterial Cpn60.2 can replace E. coli GroEL with cognate
      cochaperonin (PMID22834700); this is heterologous functional complementation, not direct visualization
      of a native cage.'
    supported_by:
    - reference_id: file:MYCTU/groEL2/groEL2-uniprot.txt
