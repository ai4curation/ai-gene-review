gene_symbol: groEL2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: GroEL2 (Cpn60.2) is the essential housekeeping chaperonin of Mycobacterium tuberculosis.
  It supports ATP-dependent protein folding with GroES, while purified lower oligomers can also suppress
  aggregation and partially refold substrates independently of ATP or GroES. Its assembly and ATPase activity
  depend strongly on solution conditions. Extracellular and surface-associated GroEL2 participates in
  macrophage adhesion, and a proteolytically cleaved form reaches host mitochondria and modulates apoptotic
  responses.
