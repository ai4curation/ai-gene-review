id: P9WG67
gene_symbol: trxA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: Rv3914, officially named trxA and commonly called thioredoxin C or TrxC in the biochemical
  literature, is a small dithiol-disulfide oxidoreductase. It accepts reducing equivalents from the NADPH-dependent
  thioredoxin reductase Rv3913 and transfers them to protein substrates including AhpC. Purified TrxC
  also supports reduction of glutathione disulfide and mycothiol disulfide in coupled assays. Its principal
  role is intracellular redox homeostasis; the MPT46 protein has also been identified in culture filtrate.
