  qualifier: located_in
  review:
    action: KEEP_AS_NON_CORE
    summary: MPT46/TrxC has been identified in mycobacterial culture filtrate.
    reason: PMID:7591163 independently identifies the culture-filtrate antigen MPT46 as active thioredoxin,
      and the curated P9WG67 record maps MPT46 to Rv3914. This supports a peripheral extracellular pool
      even though the exact PMID:17443846 table was not recovered. It does not establish a secretion mechanism
      or extracellular redox flux.
    supported_by:
    - reference_id: PMID:7591163
      supporting_text: We have previously described a Mycobacterium tuberculosis protein designated MPT46
        that was present in culture filtrates.
    - reference_id: PMID:7591163
      supporting_text: Here we report that the MPT46 protein is thioredoxin of M. tuberculosis.
