- term:
    id: GO:0015038
    label: glutathione disulfide oxidoreductase activity
  evidence_type: IDA
  original_reference_id: PMID:19737561
  qualifier: enables
  review:
    summary: TrxC can reduce glutathione disulfide in a coupled in vitro system.
    action: KEEP_AS_NON_CORE
    reason: Full PMID:19737561 identifies H37Rv Rv3914, demonstrates GSH formation by HPLC with TrxR/NADPH,
      and loses activity with TrxC Cys40Ser. This supports real secondary substrate activity despite the
      bacterium using mycothiol; it does not establish the contribution of extracellular host GSSG during
      infection. The source under review is PMID:19737561.
    supported_by:
    - reference_id: url:https://med-fom-avgaylab.sites.olt.ubc.ca/files/2018/04/TRxFebs.pdf
      supporting_text: In the presence of TrxC, TrxR, and NADPH, GSH was produced from both GSSG and GSNO
    - reference_id: url:https://med-fom-avgaylab.sites.olt.ubc.ca/files/2018/04/TRxFebs.pdf
      supporting_text: No NADPH oxidation was detected when either individual enzymes or Cys 40Ser TrxC
        were used
    - reference_id: url:https://med-fom-avgaylab.sites.olt.ubc.ca/files/2018/04/TRxFebs.pdf
