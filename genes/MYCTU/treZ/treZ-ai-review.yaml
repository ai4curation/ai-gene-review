- term:
    id: GO:0005992
    label: trehalose biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:10658666
  qualifier: involved_in
  review:
    summary: Core process, shown with mycobacterial extracts and recombinant enzymes.
    action: ACCEPT
    reason: >-
      De Smet et al. showed that mycobacteria make trehalose from glycogen-like
      alpha-1,4-glucans through the TreY-TreZ pathway, using recombinant enzymes
      from the genome ORFs. The cached record is abstract-only; the curator read
      the full text and the abstract agrees with the annotation.
    supported_by:
    - reference_id: PMID:10658666
      supporting_text: >-
        Functional assays using mycobacterial extracts and recombinant enzymes
        derived from these ORFs demonstrated that mycobacteria can produce
        trehalose from glucose 6-phosphate and UDP-glucose (the OtsA-OtsB
        pathway) from glycogen-like alpha(1-->4)-linked glucose polymers (the
        TreY-TreZ pathway) and from maltose (the TreS pathway).
- term:
    id: GO:0030980
    label: alpha-glucan catabolic process
  evidence_type: IDA
  original_reference_id: PMID:10658666
  qualifier: involved_in
  review:
    summary: True secondary process; TreZ shortens the alpha-glucan as it releases trehalose.
    action: KEEP_AS_NON_CORE
    reason: >-
      Each TreZ hydrolysis leaves an alpha-1,4-glucan two glucose units
      shorter, so the TreY-TreZ route consumes glycogen-like glucan. That is
      real but secondary to the route's biosynthetic purpose. The action
      matches the same term on TreY.
    supported_by:
    - reference_id: Reactome:R-MTU-868657
      supporting_text: >-
        From the glucanotrehalose, the enzyme TreZ cleaves one molecule of
        trehalose, leaving a linear glucan that is two sugars shorter than
        before.
