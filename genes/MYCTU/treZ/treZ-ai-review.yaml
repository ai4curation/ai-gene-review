taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: >-
  TreZ (Rv1562c) is the malto-oligosyltrehalose trehalohydrolase of
  Mycobacterium tuberculosis, a cytosolic glycoside hydrolase family 13 (GH13)
  enzyme with an N-terminal E-set domain. It hydrolyses the alpha-1,4
  glucosidic bond that joins the trehalose unit to the rest of
  maltooligosyltrehalose, which TreY (Rv1563c) forms, releasing free trehalose
  and an alpha-1,4-glucan two glucose units shorter. This completes the
  TreY-TreZ route from glycogen-like alpha-glucans, one of three mycobacterial
  trehalose-biosynthesis pathways. Disrupting treZ does not affect capsular
  alpha-glucan or glycogen production, or growth and persistence in mice.
