    id: GO:0006269
    label: DNA replication, synthesis of primer
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001627042
  - UniProtKB:P9WNV3
  review:
    summary: LigD has measured de novo primer-synthesis capability, with uncertain physiological deployment.
    action: KEEP_AS_NON_CORE
    reason: The current definition includes short nucleotide-polymer synthesis on a DNA template and explicitly
      admits DNA-damage contexts. Purified H37Rv LigD POL synthesizes unprimed oligoribonucleotides on
      ssDNA. Retain the experimental claim and its consistent IBA with a peripheral biochemical interpretation,
      without asserting that LigD is the normal chromosomal replication primase or that the activity is
      used in vivo. The target lies below PTN001627042 and is the legitimate experimental seed; donor
      count is not a negative argument.
    supported_by:
    - *id002
    - *id009
