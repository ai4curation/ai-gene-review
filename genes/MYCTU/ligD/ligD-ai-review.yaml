- term:
    id: GO:0000287
    label: magnesium ion binding
  evidence_type: IDA
  original_reference_id: PMID:15499016
  qualifier: enables
  review:
    summary: The curated magnesium-binding assignment cannot be independently resolved from the accessible
      primary text.
    action: UNDECIDED
    reason: The two original IDA assertions are retained unchanged as source claims. Accessible abstracts
      establish metal-dependent LigD chemistry but do not identify the metal as magnesium, and the curated
      UniProt cofactor statement concerns manganese. A magnesium-containing assay buffer and a CDC1551
      construct-synthesis statement do not establish magnesium binding by the H37Rv target. The relevant
      full-text metal evidence was not recovered; use UNDECIDED rather than infer the ion identity or
      reject the curator.
