- id: PMID:14985346
  title: Biochemical and genetic analysis of the four DNA ligases of mycobacteria.
  findings:
  - statement: LigD has ATP-specific adenylation and detectable nick joining; weak activity in this assay
      does not negate its ligase function.
    supporting_text: LigC and LigD, which have ATP-specific adenylyltransferase activity, display weak
      nick joining activity and generate high levels of the DNA-adenylate intermediate.
  - statement: The abstract explicitly reports defective NHEJ in M.tuberculosis ligD deletion cells; it
      is not a claim of essential growth.
    supporting_text: M. tuberculosis ligDDelta cells are defective in nonhomologous DNA end joining.
- id: PMID:15499016
  title: Mycobacterial Ku and ligase proteins constitute a two-component NHEJ repair machine.
  findings:
  - statement: The original full-length Mt-Lig characterization reports polymerase, terminal-transferase,
      primase and exonuclease activities.
    supporting_text: including gap-filling polymerase, terminal transferase, and primase, and is also
      a 3' to 5' exonuclease.
- id: PMID:16023671
  title: Domain structure of a NHEJ DNA repair ligase from Mycobacterium tuberculosis.
  findings:
  - statement: Purified POL makes unprimed RNA on ssDNA; this establishes biochemical capability without
      normal chromosomal-replication assignment.
    supporting_text: The polymerase domain demonstrated DNA-dependent RNA primase activity, catalysing
      the synthesis of unprimed oligoribonucleotides on single-stranded DNA templates.
  - statement: Both isolated POL and ligase domains bind DNA, with greater measured affinity for the ligase
      domain in this study.
    supporting_text: DNA-binding assays revealed that both the polymerase and ligase domains bind DNA
      in vitro, the latter with considerably higher affinity.
  - statement: Purified LigD POL supports template-dependent DNA extension.
    supporting_text: The polymerase domain can also extend DNA in a template-dependent manner.
  - statement: The older mycobacterial study explicitly reports polymerase stimulation, so the direction
      is not collapsed into a universal species rule.
    supporting_text: Mt-Ku stimulated the primer extension activity of the polymerase domain
- id: PMID:16476729
  title: Crystal structure and nonhomologous end-joining function of the ligase component of Mycobacterium
    DNA ligase D.
  findings: []
- id: PMID:17174332
  title: Structure and function of a mycobacterial NHEJ DNA repair polymerase.
  findings:
  - statement: Structures capture the target POL domain both alone and with nucleotides, grounding substrate
      recognition.
    supporting_text: crystal structures of the primase/polymerisation domain (PolDom) of Mycobacterium
      tuberculosis LigD, alone and complexed with nucleotides.
- id: PMID:17947582
  title: Structure of a NHEJ polymerase-mediated DNA synaptic complex.
  findings: []
- id: PMID:21255731
  title: Structure of a preternary complex involving a prokaryotic NHEJ DNA polymerase.
  findings: []
- id: PMID:24239356
  title: Molecular basis for DNA double-strand break annealing and primer extension by an NHEJ DNA polymerase.
  findings:
  - statement: The target polymerase study couples annealing of opposing three-prime overhangs to extension
      in trans.
    supporting_text: annealing the 3' overhanging strands from opposing breaks, forming a gapped intermediate
      that can be extended in trans.
- id: PMID:42953966
  title: The Mycobacterium tuberculosis Ku C-terminus orchestrates LigD activity through domain-specific
    interactions.
  findings:
  - statement: The recent Ku–LigD construct combination gives stimulation of ligation and attenuation
      of template-dependent polymerization; the LigD sequence is CDC1551 P9WNV2.
    supporting_text: Ku stimulates LigD ligase activity through contacts with both polymerase and ligase
      domains, while Ku attenuates template-dependent polymerase activity
  - statement: Synthetic accession-defined Ku is the H37Rv target; LigD is a CDC1551 comparator differing
      from H37Rv at residue344.
    supporting_text: 'Codon-optimized Ku (ID: P9WKD9) and LigD (ID: P9WNV2) sequences from M. tuberculosis
      were synthesized by Genewiz'
