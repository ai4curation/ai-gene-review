      deletion evidence converge on the repair role. Exact IBD PTN001627042 is ancestral to the target
      leaf; its target self-seed is expected. Polymerase-mediated synapsis and trans extension contribute
      to the mechanism. This does not assert that every conditional end-joining event absolutely requires
      every LigD domain.
    supported_by:
    - *id013
    - *id014
    - *id003
