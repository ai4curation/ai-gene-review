- term:
    id: GO:0030145
    label: manganese ion binding
  evidence_type: IDA
  original_reference_id: PMID:15499016
  qualifier: enables
  review:
    summary: Manganese is an experimentally assigned catalytic metal for LigD chemistry.
    action: ACCEPT
    reason: Retain the original target IDA assignment, supported by metal-dependent polymerase/ligation
      chemistry and structural metal coordination. The primary-linked UniProt cofactor synthesis explicitly
      describes manganese sites. Exact site occupancy and physiological metal preference should not be
      inferred from an assay-buffer concentration; the recent magnesium-buffer experiment uses the one-residue-different
