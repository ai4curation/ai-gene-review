id: P9WNV3
gene_symbol: ligD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: LigD is a multifunctional DNA double-strand-break repair enzyme of Mycobacterium tuberculosis
  H37Rv. Its polymerase, phosphoesterase and ATP-dependent ligase modules remodel and seal DNA ends in
  cooperation with Ku. The polymerase binds broken-end intermediates, supports end synapsis and extends
  DNA across a break using deoxyribonucleotides or ribonucleotides. Its RNA-synthesis activity can also
  initiate short primers on single-stranded DNA templates. The phosphoesterase and ligase modules provide
  complementary end-healing and strand-sealing activities.
