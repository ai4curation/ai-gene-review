- id: PMID:26221021
  title: Essential roles of methionine and S-adenosylmethionine in the autarkic lifestyle of Mycobacterium
    tuberculosis.
  findings:
  - statement: Deletion of Rv3341 abolishes methionine and SAM synthesis and causes rapid killing in vitro
      and clearance from mice.
    supporting_text: Here we show that deletion of the gene encoding homoserine transacetylase (metA)
      inactivates methionine and S-adenosylmethionine (SAM) biosynthesis in Mtb
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache (PMC4538671 not open access). Genetic evidence that the gene is the
      sole route of homoserine activation for methionine/SAM synthesis.
- id: PMID:31889085
  title: Structural analysis of mycobacterial homoserine transacetylases central to methionine biosynthesis
    reveals druggable active site.
  findings:
  - statement: Crystal structure of M. tuberculosis MetX (PDB 6PUX) shows the conserved alpha/beta-hydrolase
      fold with a deep active-site tunnel around the catalytic serine.
    supporting_text: The homoserine transacetylase MetX converts L-homoserine to O-acetyl-L-homoserine at
      the committed step of this pathway.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. Structural, not enzymological; the acetyl-CoA reaction is stated from the
      literature and the acetyl-CoA complex is modelled from a homologue, not measured.
- id: PMID:32976971
  title: MetA (Rv3341) from Mycobacterium tuberculosis H37Rv strain exhibits substrate dependent dual role
    of transferase and hydrolase activity.
  findings:
  - statement: Purified Rv3341 has homoserine acetyltransferase activity but no homoserine succinyltransferase
      or serine acetyltransferase activity, and shows hydrolase activity with p-nitrophenyl acetate.
    supporting_text: LC-MS confirmed that MetA possessed HAT activity, but no homoserine-succinyltransferase
      (HST) and serine-acetyltransferase (SAT) activities.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Direct acyl-donor specificity test on the M. tuberculosis enzyme; the
      hydrolase activity is on artificial substrates and is not a physiological function.
- id: PMID:34090964
  title: Key amino acid residues in homoserine-acetyltransferase from M. tuberculosis give insight into the
    evolution of MetX family of enzymes - HAT, SAT and HST.
  findings:
  - statement: Single substitutions in the substrate pocket of Rv3341 switch its specificity, showing that
      acyl-donor and acceptor choice in the MetX family is set by pocket residues rather than the triad.
    supporting_text: Homoserine-acetyltransferase from M. tuberculosis when mutated at positon 322 where Leu
      was converted to Arg, resulted in succinylation over acetylation of l-homoserine.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache. Engineered mutants, not the wild-type function; useful context for why
      family membership does not fix the acyl donor.
- id: PMID:36753622
  title: Structural and Functional Characterization of Mycobacterium tuberculosis Homoserine Transacetylase.
  findings:
  - statement: Rv3341 forms an acetylated enzyme intermediate and follows a ping-pong mechanism; acetyl-CoA
      substrate inhibition and CoA/O-acetylhomoserine product inhibition were proposed as feedback control.
    supporting_text: Crystallographic and mass spectral observation of the acetylated HTA intermediate and
      initial velocity studies were consistent with a ping-pong kinetic mechanism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache. Mechanistic and kinetic characterisation of the M. tuberculosis enzyme
      with acetyl-CoA.
