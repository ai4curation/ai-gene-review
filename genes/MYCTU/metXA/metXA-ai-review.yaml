suggested_questions:
- question: Is the substrate inhibition by acetyl-CoA and product inhibition by CoA and O-acetylhomoserine
    reported in vitro a physiologically relevant control of methionine flux in M. tuberculosis, and is the
    enzyme also subject to feedback by methionine or S-adenosylmethionine?
suggested_experiments:
- description: Quantify intracellular O-acetylhomoserine, acetyl-CoA and CoA in M. tuberculosis under methionine
    excess and limitation, and compare with Rv3341 inhibition constants, to test the proposed product-feedback
    model.
  experiment_type: metabolomics combined with enzyme kinetics
