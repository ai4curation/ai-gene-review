    summary: PAINT IBD at PTN000791315, seeded by characterised fungal and bacterial acetyl-CoA-dependent MetX
      enzymes; Rv3341 sits inside this acetyl-using clade and is itself biochemically an acetyltransferase.
    action: ACCEPT
    reason: The phylogenetic inference agrees with direct biochemistry on Rv3341 (LC-MS-confirmed homoserine
      acetyltransferase activity, no succinyltransferase activity; acetyl-enzyme intermediate observed). Unlike
      the Pseudomonas MetXS lineage, there is no evidence of a donor switch in mycobacteria; the NCBIfam
      MetX_acetyl_MTB model places the protein with acetyl-specific MetX.
