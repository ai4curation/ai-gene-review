  label: Mycobacterium tuberculosis H37Rv
description: metXA (Rv3341, also called metA or HTA) encodes the homoserine O-acetyltransferase (homoserine
  transacetylase, EC 2.3.1.31) of Mycobacterium tuberculosis, a cytoplasmic homodimeric MetX-family enzyme
  with an alpha/beta-hydrolase fold and a Ser157-Asp320-His350 catalytic triad. It transfers the acetyl group
  of acetyl-CoA to the gamma-hydroxyl of L-homoserine by a ping-pong mechanism through an acetyl-serine
  enzyme intermediate, forming O-acetyl-L-homoserine at the committed step of methionine and
  S-adenosylmethionine biosynthesis. The purified enzyme has no homoserine succinyltransferase or serine
  acetyltransferase activity and hydrolyses acetyl donors in the absence of homoserine. Deletion of the gene
  makes M. tuberculosis a methionine auxotroph that is rapidly killed on starvation and cleared from mice,
  because methionine and S-adenosylmethionine cannot be scavenged from the host in sufficient amounts.
