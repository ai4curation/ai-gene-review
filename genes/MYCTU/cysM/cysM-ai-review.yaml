      label: CysO-dependent cysteine synthase activity
- term:
    id: GO:0004124
    label: cysteine synthase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN008497439
  - UniProtKB:P16703
  review:
    summary: The OAS/free-sulfide functional assignment overstates the established substrate specificity.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'GO:0004124 specifies the complete OAS + free hydrogen sulfide reaction yielding free cysteine.
      The functional assignment overstates the evidence for H37Rv CysM: PMID18842002 establishes more
      than 500-fold OPS preference in first-half chemistry and over three orders of magnitude preference
      for CysO-COSH over bisulfide, while PMID18799456 reports no detected cysteine from OAS/Na2S. M.
      tuberculosis has a separately characterized OAS sulfhydrylase, CysK1 (PMID17567578). Applying the
      enzyme-specificity policy, mark the OAS/free-sulfide function as over-annotated rather than retaining
      an unqualified functional assignment. This is not a claim that a measured weak complete reaction
      crosses a numerical cutoff: OAS aminoacrylate formation is only the first half-reaction, and a positive
      complete GO:0004124 endpoint was not established. The GSH-prefixed Thr2Ala construct, unstated formal
      detection limit, and demonstrable OAS-dependent carrier route with CysO/Mec+ (PMID16104727) prevent
      a universal zero-turnover or proven evolutionary-loss conclusion. These limits argue against REMOVE
      and do not make the well-supported OPS/CysO core uncertain. The positive OAS-active E. coli/PAO1
      lineage evidence remains valid; no family-wide loss is inferred.'
    supported_by:
    - *id001
    - &id003
      reference_id: file:MYCTU/cysM/cysM-source-analysis/18799456-assay-scope.md
      supporting_text: unable to detect any cysteine as reaction product using OAS as substrate and sodium
        sulfide as sulfur donor
    - *id002
    - &id004
      reference_id: PMID:17567578
      supporting_text: 'Recombinant CysK1 is a pyridoxal phosphate (PLP)-dependent enzyme

        that catalyzes the conversion of O-acetylserine to cysteine.'
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008497439
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The node has sound OAS-active seed evidence, but this OPS/CysO-preferring descendant
          is over-annotated as retaining the complete OAS/free-sulfide function. Residual target turnover
          and a definitive loss event remain unproved; this is a target-specific functional-scope exception.
