  title: 'Cysteine synthase (CysM) of Mycobacterium tuberculosis is an O-phosphoserine sulfhydrylase:
    evidence for an alternative cysteine biosynthesis pathway in mycobacteria.'
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cache abstract-only; author-hosted full primary inspected. OAS/Na2S cysteine endpoint
      ND, whereas OPS/Na2S is active. GSH-prefixed Thr2Ala construct independently verified by 3DKI. Detection
      threshold not formalized. Exact result excerpt and limits are recorded in the local source analysis.
