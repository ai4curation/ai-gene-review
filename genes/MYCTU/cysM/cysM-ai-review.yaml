- id: PMID:17567578
  title: Structural insights into catalysis and inhibition of O-acetylserine sulfhydrylase from Mycobacterium
    tuberculosis. Crystal structures of the enzyme alpha-aminoacrylate intermediate and an enzyme-inhibitor
    complex.
  findings:
  - statement: The separate M. tuberculosis CysK1 paralog catalyzes OAS-dependent cysteine formation;
      this is comparator evidence, not an assay of CysM.
    supporting_text: 'Recombinant CysK1 is a pyridoxal phosphate (PLP)-dependent enzyme

      that catalyzes the conversion of O-acetylserine to cysteine.'
  reference_review:
    review_notes: Cached abstract explicitly identifies recombinant CysK1 activity. Used only to identify
      the separately characterized OAS enzyme, without transferring its activity to CysM.
proposed_new_terms:
- proposed_name: CysO-dependent cysteine synthase activity
  proposed_definition: Catalysis of sulfur transfer from the terminal thiocarboxylate of CysO to O-phospho-L-serine,
    yielding phosphate and a covalent CysO-cysteine adduct. Free cysteine release requires a subsequent
    hydrolase reaction.
  justification: EC 2.5.1.113 / RHEA:48740 describes carrier-dependent chemistry. Existing GO:0004124
    and GO:0033847 instead specify free hydrogen sulfide; neither represents this preferred reaction.
  supported_by:
  - *id001
  - *id002
core_functions:
- description: Transfers CysO-bound sulfur to an OPS-derived intermediate to form the CysO-cysteine adduct;
    Mec+ performs the subsequent release step.
