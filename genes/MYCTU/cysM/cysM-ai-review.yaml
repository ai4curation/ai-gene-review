id: P9WP53
gene_symbol: cysM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: CysM is a PLP-dependent cysteine-biosynthetic enzyme of Mycobacterium tuberculosis H37Rv
  that preferentially uses O-phosphoserine and thiocarboxylated CysO. Sulfur transfer produces a covalent
  CysO-cysteine adduct, from which Mec+ releases free cysteine. Free sulfide can substitute inefficiently
  in vitro. Slow O-acetylserine intermediate formation does not establish that the ordinary OAS/free-sulfide
  reaction is an important native route.
