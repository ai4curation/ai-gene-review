  review:
    summary: CysM transfers carrier-bound sulfur during cysteine synthesis.
    action: MODIFY
    reason: The general catalytic claim is sound but the principal reaction uses OPS and thiocarboxylated
      CysO, producing a covalent CysO-cysteine adduct. Neither the OAS/free-sulfide term nor the OPS/free-sulfide
      term describes this reaction.
