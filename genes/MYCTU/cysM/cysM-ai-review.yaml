  findings: []
- id: PMID:18842002
  title: O-phospho-L-serine and the thiocarboxylated sulfur carrier protein CysO-COSH are substrates for
    CysM, a cysteine synthase from Mycobacterium tuberculosis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary transient/single-turnover kinetics distinguish OPS/OAS first-half chemistry
      and CysO/free-sulfide reaction rates. Slow OAS aminoacrylate formation is not a complete free-cysteine
      endpoint.
- id: PMID:16104727
  title: Reconstitution of a new cysteine biosynthetic pathway in Mycobacterium tuberculosis.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary reconstitution shows CysO-adduct formation and Mec+-dependent cysteine
      release using OAS. This demonstrates an alternative carrier route; it does not establish OAS plus
      free-sulfide chemistry on CysM.
- id: PMID:19101553
  title: The C-terminal of CysM from Mycobacterium tuberculosis protects the aminoacrylate intermediate
    and is involved in sulfur donor selectivity.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract reports C-terminal deletion effects on aminoacrylate protection and CysO specificity.
      Mutant behavior is not attributed to wild-type P9WP53.
