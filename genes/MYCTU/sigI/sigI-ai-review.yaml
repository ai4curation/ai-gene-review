- term:
    id: GO:0009409
    label: response to cold
  evidence_type: IEP
  original_reference_id: PMID:10027986
  qualifier: involved_in
  review:
    summary: >-
      An MTBBASE curator recorded a transcript-level induction of sigI after
      mild cold shock from the Manganelli et al. molecular-beacon qRT-PCR
      survey of ten sigma factor genes. The cached record is abstract-only; the
      abstract reports that a sigma factor gene's mRNA increased after mild
      cold shock without naming it in the abstract text.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retained, because the curator read the full text and the repository rule
      is not to overrule an experimental annotation from an abstract-only
      cache. It is marked non-core rather than accepted as a core function for
      two reasons: an expression response is evidence that the gene responds to
      a condition, not that SigI performs work in cold adaptation; and a later
      quantitative survey of sigI expression found induction only in stationary
      phase and heat shock, with little variation under other stresses. No
      cold-sensitivity phenotype has been reported for a sigI mutant.
    supported_by:
    - reference_id: PMID:10027986
      supporting_text: >-
        In addition, we also identified a sigma factor gene whose mRNA
        increased after mild cold shock and a second that responded to
        conditions of low aeration.
    - reference_id: PMID:22434196
      supporting_text: >-
        However, little variation in sigI expression was observed in response
        to other stress conditions.
- term:
    id: GO:0016987
    label: sigma factor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001249270
  - UniProtKB:L0TCG5
  review:
    summary: >-
      PAINT node PTN001249270 in PTHR30173 carries an IBD for sigma factor
      activity seeded by M. tuberculosis SigJ (L0TCG5). SigJ sits in subfamily
      PTHR30173:SF36 and SigI in PTHR30173:SF43, so the node lies above both
      subfamilies and the assertion is the family-wide one: ECF sigma-70
      proteins act as the promoter specificity subunit of RNA polymerase. That
      is exactly what SigI was shown to do in vitro, independently of the
      propagation.
    action: ACCEPT
    reason: >-
      The node placement is sound for this target. SigI retains the complete
      sigma-70 region 2 and region 4_2 modules and the core-binding motif, it
      is classified in the same PANTHER family and in the ECF41 group together
      with the seed protein, and the inherited activity is confirmed directly
      in M. tuberculosis by reconstitution of a transcription-competent
      holoenzyme. Nothing subfamily-specific to SigJ (its regulon, its
      hydrogen-peroxide phenotype) is transferred by this node, and nothing
      needs to be.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001249270
        source_status: SUPPORTS_TRANSFER
        comment: >-
          Ancestral node of PTHR30173 bearing the GO:0016987 IBD; it sits above
          both PTHR30173:SF36 (the SigJ seed) and PTHR30173:SF43 (SigI), so the
          transferred claim is the family-wide sigma factor activity and not a
          subfamily-specific function.
    supported_by:
    - reference_id: file:MYCTU/sigI/sigI-uniprot.txt
      record_section: ["DR:PANTHER"]
      supporting_text: "DR   PANTHER; PTHR30173:SF43; ECF RNA POLYMERASE SIGMA FACTOR SIGI-RELATED; 1."
    - reference_id: PMID:22434196
      supporting_text: >-
        purified recombinant SigI was combined with the E. coli RNA core
        polymerase
