proposed_new_terms: []
suggested_questions:
- question: >-
    What signal releases or activates SigI? ECF41 members have no anti-sigma
    factor, and whether the NTF2-like C-terminal extension binds a small
    molecule, is cleaved, or changes conformation in response to a ligand is
    unknown for SigI.
  experts: []
- question: >-
    Is the candidate SigI promoter motif derived from the katG promoter a
    genuine consensus? Only one target promoter has been validated
    biochemically, so the regulon boundary and the -35/-10 preferences of SigI
    remain provisional.
  experts: []
- question: >-
    Why does CRISPRi repression of sigI cause a growth defect when the clean
    deletion mutant grows normally and is hypervirulent in mice?
  experts: []
knowledge_gaps:
- gap_statement: >-
    The signal that switches SigI from an inactive to an active state, and the
    mechanism by which the fused NTF2-like C-terminal extension transduces it,
    are undetermined: no ligand, partner, modification or proteolytic event
    controlling SigI activity has been identified.
  boundary: >-
    It is established that SigI assembles with core RNA polymerase into a
    holoenzyme that initiates transcription from the katG promoter in a
    motif-dependent manner, that sigI transcription rises in stationary phase
    and heat shock, and that ECF41 sigma factors, unlike most ECF sigma
    factors, have no cognate anti-sigma factor gene in their vicinity.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Without the activating signal, the physiological conditions under which
    SigI drives katG expression cannot be predicted, which is what determines
    when loss of SigI would confer isoniazid resistance in vivo.
  resolution: >-
    Identify a ligand or modification acting on the C-terminal extension, and
    test whether removing the extension constitutively activates SigI in M.
    tuberculosis.
  provenance:
  - reference_id: PMID:28934483
    supporting_text: >-
      ECF41 members lack an apparent anti-σ factor and the regulation of ECF41
      σ factor activity remains unclear.
suggested_experiments:
- description: >-
    Map the SigI regulon and its promoter consensus directly by ChIP-seq of
    tagged SigI together with transcription start site mapping (dRNA-seq) in
    wild type, ΔsigI and a sigI-overexpressing strain, under the conditions in
    which sigI is induced (stationary phase, heat shock).
- description: >-
    Test the regulatory role of the C-terminal extension in vivo: compare
    full-length SigI with a C-terminally truncated variant for ability to
    activate a katG-promoter reporter and to complement the katG-expression
    defect of ΔsigI, which would show whether the extension is autoinhibitory
    in M. tuberculosis as proposed for ECF41 generally.
- description: >-
    Identify the activating signal by screening the purified NTF2-like
    C-terminal domain for small-molecule binding (thermal shift or native mass
    spectrometry) against metabolites related to the carboxymuconolactone
    decarboxylase/oxidoreductase genes that typically neighbour ECF41 loci.
