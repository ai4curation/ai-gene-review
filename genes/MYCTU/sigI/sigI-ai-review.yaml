  review:
    summary: >-
      SigI contains the sigma-70 region 4_2 module with an annotated
      helix-turn-helix DNA-binding motif (residues 137-156), the element that
      in sigma factors contacts the -35 promoter element. Direct promoter
      binding is also implied functionally: deleting a short candidate SigI
