id: P9WGH3
gene_symbol: sigI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: >-
  SigI (Rv1189) is a 290-residue extracytoplasmic function (ECF) RNA polymerase
  sigma factor of Mycobacterium tuberculosis, one of two ECF41-group sigma
  factors in this organism (the other is SigJ). It carries the canonical
  sigma-70 region 2 and region 4_2 modules, with a helix-turn-helix motif at
  residues 137-156 that reads the -35 promoter element, followed by a fused
  NTF2-like (SnoaL-type) C-terminal extension that is characteristic of group
  ECF41; members of this group have no separate anti-sigma factor, and the
  C-terminal extension is thought to provide the regulatory function instead.
  SigI binds core RNA polymerase to form a holoenzyme that initiates
  transcription at a specific set of promoters. Its best-defined target is
  katG, the catalase-peroxidase gene: recombinant SigI reconstituted with core
  RNA polymerase transcribes katG but not a non-target template, deletion of a
  short motif in the katG promoter abolishes that activity, and lysates of a
  sigI deletion mutant show markedly reduced katG transcription. A microarray
  screen also placed an ATP synthase subunit gene and several heat-shock genes
  in the SigI regulon. sigI is expressed at a low constitutive level and rises
  in stationary phase and after heat shock; it is transcribed from a
  sigma-J-dependent promoter, making SigI the one validated member of the SigJ
  regulon. Because KatG activates the prodrug isoniazid, loss of SigI lowers
  katG expression and confers isoniazid resistance without any fitness cost in
  mice. The gene is not universally retained in mycobacteria: the sigI locus is
  deleted in M. bovis BCG Pasteur.
