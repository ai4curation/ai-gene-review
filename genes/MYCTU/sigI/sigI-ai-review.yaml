- id: PMID:10027986
  title: Differential expression of 10 sigma factor genes in Mycobacterium tuberculosis.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; this is the source of the MTBBASE IEP for response to
      cold. The cached record is abstract-only, and the abstract reports the
      mild cold-shock induction without naming the gene, so the specific
      attribution to sigI rests on the curator's reading of the full text. Kept
      as support for the retained non-core cold row, with that limitation
      stated in the review reason.
  findings:
  - statement: >-
      A molecular-beacon qRT-PCR survey of ten M. tuberculosis sigma factor
      genes identified one whose mRNA rose after mild cold shock.
    supporting_text: >-
      In addition, we also identified a sigma factor gene whose mRNA increased
      after mild cold shock and a second that responded to conditions of low
      aeration.
- id: PMID:22434196
  title: Isoniazid resistance without a loss of fitness in Mycobacterium tuberculosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text available via PMC. This is the only paper that
      assays SigI protein function directly, and it is the basis for every
      experimentally grounded claim in this review. Its organismal conclusions
      (isoniazid resistance, hypervirulence of the deletion mutant) are
      downstream consequences of losing a transcription factor and are
      deliberately not annotated as process participation.
  findings:
  - statement: >-
      Recombinant SigI combined with core RNA polymerase initiates
      transcription specifically from the katG promoter and not from a
      non-target template.
    supporting_text: >-
      Although the SigI-containing RNA polymerase holoenzyme was unable to
      direct transcription from the non-SigI-regulated gene Rv1186,
      SigI-directed transcription was detected from the katG promoter,
      providing direct evidence that SigI can direct transcription from the
      katG promoter located 379 bp upstream of the gene
  - statement: >-
      A short promoter motif is required for SigI-directed transcription,
      indicating sequence-specific promoter recognition.
    supporting_text: >-
      Removal of this short sequence nearly abolished the ability of SigI to
      direct transcription of katG (Fig. 3e), thus confirming SigI-mediated
      transcription of katG.
  - statement: >-
      Deletion of sigI reduces katG transcription in bacterial lysates.
    supporting_text: >-
      lysates from the ΔsigI mutant were associated with significantly
      decreased katG transcription, further demonstrating a direct SigI
      transcriptional effect in expression of katG
  - statement: >-
      Microarray comparison of the deletion mutant with wild type defined a
      small candidate SigI regulon.
    supporting_text: >-
      The SigI regulon identified included an ATP synthase (Rv1304), heat shock
      proteins (Rv0440, Rv0350, and Rv3417), and katG.
  - statement: >-
      sigI expression rises in stationary phase and on heat shock but changes
      little under other stresses.
    supporting_text: >-
      sigI transcript levels were increased during stationary phase (Fig. 1a)
      as well as during heat shock (Fig. 1b). However, little variation in sigI
      expression was observed in response to other stress conditions.
- id: PMID:18248429
  title: 'Cascade of extracytoplasmic function sigma factors in Mycobacterium tuberculosis:
    identification of a sigmaJ-dependent promoter upstream of sigI.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; abstract-only in the cache. Establishes how sigI is
      regulated (a SigJ-dependent promoter), which is background for this gene
      rather than a function of the SigI protein, so it is cited in the
      description and notes but not used to support an annotation.
  findings:
  - statement: >-
      A two-plasmid screen for SigJ-recognised promoters recovered the promoter
      of sigI, confirmed by in vitro transcription.
    supporting_text: >-
      The only positive clone revealed a promoter directing expression of the
      sigI gene encoding ECF sigma factor sigma(I).
- id: PMID:28934483
  title: The fused SnoaL_2 domain in the Mycobacterium tuberculosis sigma factor σJ
    modulates promoter recognition.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text available. Primarily a study of SigJ, but it
      states the ECF41 group membership of both M. tuberculosis sigma factors
      and characterises SigJ binding to the sigI promoter; used for the ECF41
      framing and the regulatory background, not to transfer SigJ-specific
      function to SigI.
  findings:
  - statement: M. tuberculosis has two ECF41 sigma factors, SigI and SigJ.
    supporting_text: tuberculosis has two ECF41 σ factors σI and σJ (11).
  - statement: >-
      SigJ binds the sigI promoter and controls expression of this sigma
      factor; sigI is the only validated SigJ target gene.
    supporting_text: >-
      σJ recognizes the promoter of another ECF41 σ factor, σI, thereby
      controlling the expression of this σ factor (19).
  - statement: >-
      How ECF41 sigma factor activity is controlled, in the absence of an
      anti-sigma factor, is unresolved.
    supporting_text: >-
      ECF41 members lack an apparent anti-σ factor and the regulation of ECF41
      σ factor activity remains unclear.
- id: PMID:22950025
  title: Extracytoplasmic function σ factors of the widely distributed group ECF41
    contain a fused regulatory domain.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text available. Defines the ECF41 group and shows
      that its members lack a cognate anti-sigma factor; used for the group
      description, with no M. tuberculosis SigI experiment of its own.
  findings:
  - statement: >-
      ECF41 sigma factors have no separate anti-sigma factor; the fused
      C-terminal extension appears to take over that regulatory role.
    supporting_text: >-
      Based on our data, ECF41-dependent signal transduction does not seem to
      involve a second protein that functions as an anti-σ factor.
- id: PMID:30990934
  title: The role of C-terminal extensions in controlling ECF σ factor activity in
    the widely conserved groups ECF41 and ECF42.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified; abstract-only in the cache. Supports the general ECF41
      regulatory architecture described in the gene description; no
      SigI-specific data, so it is not used to support any annotation.
  findings:
  - statement: >-
      In ECF41 and ECF42, fused C-terminal domains replace the regulatory
      function normally supplied by an anti-sigma factor.
    supporting_text: >-
      including ECF41 and ECF42, σ-factors contain fused C-terminal protein
      domains,
- id: PMID:32180013
  title: The C-terminal domain of M. tuberculosis ECF sigma factor I (SigI) interferes
    in SigI-RNAP interaction.
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      PubMed-verified; abstract-only in the cache. The paper is a docking and
      molecular-dynamics study with no wet-lab validation, so its mechanistic
      conclusion about the C-terminal extension flipping domain 4 is treated as
      a hypothesis and is not used to support any annotation. It is cited only
      for the uncontroversial statement that SigI belongs to the ECF41 family.
  findings:
  - statement: SigI is a member of the ECF41 family of sigma factors.
    supporting_text: Mtb-SigI belongs to the ECF41 family of sigma factor
- id: PMID:14761983
  title: Sigma factors and global gene regulation in Mycobacterium tuberculosis.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text available. A review; used only for the
      comparative-genomics observation about loss of the sigI locus, which is
      relevant to how far any function may be propagated within mycobacteria.
      Not used as support for an annotation.
  findings:
  - statement: >-
      The sigI locus is deleted in M. bovis BCG Pasteur, and M. avium and M.
      paratuberculosis lack a clear sigI ortholog.
    supporting_text: >-
      However, M. bovis BCG Pasteur lacks sigI as this locus is deleted, while
      in its genome, the sigH and sigM loci are duplicated ( 11 ).
- id: PMID:41392072
  title: Divergent transcriptional regulation of redox-homeostasis and permeability
    modulate rifampicin tolerance and sensitivity in Mycobacterium tuberculosis.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text available. A transcription-factor induction
      and CRISPRi screen in which sigI appears as a hit; the authors state that
      the mechanism is unresolved, so the drug-susceptibility and growth
      phenotypes are recorded as context and not annotated.
  findings:
  - statement: >-
      CRISPRi repression of SigI produces a growth defect even without drug
      exposure.
    supporting_text: >-
      We noted that CRISPRi-mediated repression of SigI resulted in a
      growth-defective phenotype (in the absence of rifampicin exposure)
  - statement: >-
      The mechanism by which SigI level modulates rifampicin susceptibility is
      unresolved.
    supporting_text: >-
      The current study was unable to identify the mechanisms of sigI-mediated
      rifampicin hypersusceptibility
