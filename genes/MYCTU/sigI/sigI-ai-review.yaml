core_functions:
- description: >-
    Promoter-specificity subunit of RNA polymerase: SigI binds core RNA
    polymerase to form a holoenzyme that recognises a specific promoter motif
    and initiates transcription there, thereby setting the expression level of
    its small regulon, of which katG is the experimentally validated member.
    Group ECF41 architecture means its activity is governed by the fused
    NTF2-like C-terminal extension rather than by a separate anti-sigma factor.
