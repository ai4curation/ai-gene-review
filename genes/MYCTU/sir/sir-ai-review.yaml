- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000793870
  - UniProtKB:P9WJ03
  review:
    summary: Refine general oxidoreductase activity to the sulfite-reductase enzyme class.
    action: MODIFY
    reason: 'The primary structural paper identifies SirA as a ferredoxin-dependent sulfite reductase
      and resolves its donor-class fingerprint; UniProt independently curates the ferredoxin reaction
      in CC:CATALYTIC ACTIVITY with PMID:15917234 evidence. This supports the enzyme class and refinement
      to the specific activity already present in this review. The identity of its native ferredoxin partner
      remains unresolved: methyl-viologen substrate kinetics do not identify that partner.'
    supported_by:
    - *id001
    - &id002
      reference_id: PMID:15917234
      supporting_text: 'suggests a binding site

        for the external electron donor ferredoxin close to the [Fe4-S4] cluster.'
    - reference_id: file:MYCTU/sir/sir-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=hydrogen sulfide + 6 oxidized [2Fe-2S]-[ferredoxin] + 3 H2O = sulfite
        + 6 reduced [2Fe-2S]-[ferredoxin] + 7 H(+);
    proposed_replacement_terms:
    - id: GO:0050311
      label: sulfite reductase (ferredoxin) activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000793870
        source_status: SUPPORTS_TRANSFER
        comment: The inherited oxidoreductase claim is supported. Target biochemistry establishes sulfite
          reduction; the more specific ferredoxin-class assignment additionally uses structural and family
          evidence, without claiming measured native donor pairing.
