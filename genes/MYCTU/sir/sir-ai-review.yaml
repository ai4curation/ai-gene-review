id: P9WJ03
gene_symbol: sir
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: SirA (Sir; Rv2391) is the monomeric siroheme/[4Fe-4S] sulfite reductase of Mycobacterium
  tuberculosis H37Rv. It catalyzes the six-electron reduction of sulfite to sulfide for sulfur assimilation
  and shows no detectable nitrite turnover in the reported assays. Ferredoxin-dependent classification
  is supported by enzyme architecture, whereas the published substrate kinetics use reduced methyl viologen
  and do not establish the native electron-transfer partner.
