knowledge_gaps:
- gap_statement: The native electron-donating ferredoxin partner of M. tuberculosis SirA has not been
    identified in the inspected structural and kinetic studies.
  boundary: Sulfite reduction and a ferredoxin-type enzyme architecture are established; the measured
    substrate kinetics used methyl viologen, and structural comparison proposes a donor-binding site.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  resolution: Compare candidate native ferredoxins in reconstituted electron-transfer and sulfite-turnover
    assays, with genetic tests of the productive partner.
  provenance:
  - reference_id: PMID:17644602
    supporting_text: M. tuberculosis SirA was assayed for sulfite and nitrite reductase activity under
      anaerobic conditions activity using methyl viologen (MV) as an electron donor
  - reference_id: PMID:15917234
    supporting_text: 'suggests a binding site

      for the external electron donor ferredoxin close to the [Fe4-S4] cluster.'
suggested_questions:
- question: Which native ferredoxin supplies electrons to SirA during sulfate assimilation in M. tuberculosis?
suggested_experiments:
- description: Measure SirA turnover and direct electron transfer with purified candidate M. tuberculosis
    ferredoxins and validate the productive partner in cells.
  experiment_type: native electron-donor reconstitution
