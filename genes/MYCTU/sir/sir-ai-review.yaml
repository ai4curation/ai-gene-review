id: P9WJ03
gene_symbol: sir
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: SirA (Sir; Rv2391) is the monomeric siroheme/[4Fe-4S] sulfite reductase of Mycobacterium
  tuberculosis H37Rv. This ferredoxin-type enzyme catalyzes the six-electron reduction of sulfite to sulfide
  for sulfur assimilation and shows no detectable nitrite turnover in the reported assays.
existing_annotations:
- term:
    id: GO:0000103
    label: sulfate assimilation
  evidence_type: IMP
  original_reference_id: PMID:17644602
  qualifier: involved_in
  review:
    summary: SirA supplies sulfide for assimilatory sulfur metabolism.
    action: ACCEPT
    reason: Purified H37Rv SirA reduces sulfite. The cited deletion/rescue experiments establish sulfate/sulfite
      dependence in M. smegmatis; they are comparative physiological support, not an H37Rv deletion experiment.
      The combined biochemical and conserved-pathway evidence supports the H37Rv claim.
    supported_by:
    - &id001
      reference_id: PMID:17644602
      supporting_text: M. tuberculosis SirA was assayed for sulfite and nitrite reductase activity under
        anaerobic conditions activity using methyl viologen (MV) as an electron donor
    - reference_id: PMID:17644602
      supporting_text: 'Deletion of sulfite reductase (sirA, originally misannotated nirA)

        reveals that it is essential for growth on sulfate or sulfite as the sole sulfur

        source'
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: Reactome:R-MTU-936703
  qualifier: located_in
  review:
    summary: The soluble assimilatory reductase is assigned to cytosol.
    action: ACCEPT
    reason: The Reactome pathway places the intracellular sulfur-reduction reaction in cytosol, consistent
      with the soluble monomeric enzyme architecture. This is curated pathway localization rather than
      direct microscopic localization.
    additional_reference_ids:
    - Reactome:R-MTU-936703
    - PMID:15917234
    supported_by:
