id: P9WHH9
gene_symbol: lpdC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: LpdC is an FAD-containing homodimeric dihydrolipoyl dehydrogenase that catalyses reversible
  electron transfer between NAD(H) and protein-bound lipoyl groups. It serves as E3 in pyruvate and branched-chain
  ketoacid dehydrogenase complexes and, in the reductive direction, supplies electrons to the DlaT–AhpD–AhpC
  antioxidant relay. Purified LpdC also reduces quinones. Proteomic ligand-binding and heterologous infection
  experiments support additional host-interaction capacities, distinct from its central metabolic and
  redox functions.
