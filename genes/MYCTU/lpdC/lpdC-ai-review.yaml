    supporting_text: catalyze lipoamide reduction/oxidation alone and in complex with other proteins that
      participate in pyruvate dehydrogenase and peroxidase activities
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Target Lpd structure and mutant activity in isolated and coupled PDH/peroxidase assays.
      Abstract supports functional separation; individual surface mechanisms are not asserted without
