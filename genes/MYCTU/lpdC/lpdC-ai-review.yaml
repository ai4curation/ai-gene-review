- id: PMID:11560483
  title: Mycobacterium tuberculosis lipoamide dehydrogenase is encoded by Rv0462 and not by the lpdA or
    lpdB genes.
  findings:
  - statement: Purified Rv0462 target, FAD homodimer and NADH/lipoamide/quinone kinetics; assay chemistry
      supports E3 and secondary quinone activity.
    supporting_text: The 49 kDa polypeptide forms a homodimer containing one tightly bound molecule of
      FAD/monomer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Purified Rv0462 target, FAD homodimer and NADH/lipoamide/quinone kinetics; assay chemistry
      supports E3 and secondary quinone activity. Full ACS text was inaccessible, so claims use explicit
      abstract and curated kinetics.
- id: PMID:11799204
  title: Metabolic enzymes of mycobacteria linked to antioxidant defense by a thioredoxin-like protein.
  findings:
  - statement: Direct identification of an Lpd–DlaT (then SucB)–AhpD–AhpC redox relay.
    supporting_text: The peroxiredoxin alkyl hydroperoxide reductase (AhpC) is linked to Lpd and SucB
      by an adaptor protein, AhpD.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct identification of an Lpd–DlaT (then SucB)–AhpD–AhpC redox relay. Available abstract
      supports the coupled mechanism; Science full text could not be recovered. Later native metabolic
      and physiological studies qualify old sole-lipoyl-protein and pathway-necessity statements.
- id: PMID:12590611
  title: Catalysis of diaphorase reactions by Mycobacterium tuberculosis lipoamide dehydrogenase occurs
    at the EH4 level.
  findings:
  - statement: Purified Mtb Lpd stopped-flow experiments distinguish lipoyl reduction through EH2 from
      quinone/oxygen reduction through EH4.
    supporting_text: EH(4) reduced 2,6-dimethyl-1,4-benzoquinone and molecular oxygen 90 and 40 times
      faster than EH(2), respectively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Purified Mtb Lpd stopped-flow experiments distinguish lipoyl reduction through EH2 from
      quinone/oxygen reduction through EH4. These are secondary biochemical capacities, not proof of respiratory
      membrane coupling.
- id: PMID:14532352
  title: Comprehensive proteomic profiling of the membrane constituents of a Mycobacterium tuberculosis
    strain.
  findings:
  - statement: Native H37Rv membrane-fraction proteomics with 739 two-peptide identifications.
    supporting_text: 739 proteins have been identified by two or more distinct peptide sequences
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Native H37Rv membrane-fraction proteomics with 739 two-peptide identifications. Abstract
      available, but target-level tables and controls could not be recovered; no target-specific membrane
      exclusion or contamination claim is warranted.
- id: PMID:16045627
  title: Mycobacterium tuberculosis appears to lack alpha-ketoglutarate dehydrogenase and encodes pyruvate
    dehydrogenase in widely separated genes.
  findings:
  - statement: Abstract and publisher full-PDF Results inspected.
    supporting_text: Finally, recombinant AceE, DlaT and Lpd, although encoded by genes that are widely
      separated on the chromosome, reconstituted PDH in vitro with Km values typical of bacterial PDH
      complexes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract and publisher full-PDF Results inspected. Native PDH purification, loss in
      dlaT mutant, recombinant reconstitution and negative KDH assays establish target E2/E3 roles. Normal
      PDF cache recovery failed, so supporting quotations use the cached abstract; full-text inspection
      is documented without fabricating a cache.
