taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: CysE is the cytosolic serine acetyltransferase of Mycobacterium tuberculosis H37Rv. It transfers
  an acetyl group from acetyl-CoA to L-serine, generating O-acetylserine for the CysK1-dependent cysteine
  biosynthetic route. Its oligomeric state and interaction with CysK influence activity; the mycobacterial
  regulatory complex can reduce serine acetyltransferase activity.
