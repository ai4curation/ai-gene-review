identity_basis: Full publisher methods explicitly identify H37Rv genomic DNA from Colorado State University,
  amplified Rv2335, sequencing and subcloning into pET29b; the expressed protein carries six histidines.
  No tag removal reported. The locus matches the frozen UniProt target.
functional_evidence: Purified enzyme serine/acetyl-CoA dependent CoA release measured with Ellman reagent;
  substrate-dependent kinetics. This is independent direct biochemical evidence, not a virulence phenotype.
limits: No independent assay-plasmid sequence reconstruction. PMID38311199 provides abstract-only direct
  complex and oligomer evidence; exact construct/stoichiometry not established here.
