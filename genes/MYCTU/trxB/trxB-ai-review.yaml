- term:
    id: GO:0019430
    label: removal of superoxide radicals
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR005982
  review:
    summary: A specific role in removal of superoxide radicals is not established by the available target
      evidence.
    action: UNDECIDED
    reason: The InterPro-derived claim may reflect a broader protective pathway, but direct TrxB2/TrxC
      assays measure thiol-disulfide and peroxide reactions, not superoxide removal. The absence of SOD
      chemistry alone would not exclude indirect participation; the relevant target-specific multistep
      superoxide contribution remains unresolved. Full PMID:27249779 Fig. 4 additionally finds no plumbagin-sensitivity
      change under partial TrxB2 depletion; that bounded negative phenotype neither establishes a direct
      superoxide-removal reaction nor excludes all possible redundant contributions.
    supported_by:
    - reference_id: file:MYCTU/trxB/trxB-uniprot.txt
      record_section:
      - CC:CATALYTIC ACTIVITY
      supporting_text: Reaction=[thioredoxin]-dithiol + NADP(+) = [thioredoxin]-disulfide + NADPH + H(+);
    - reference_id: PMID:14871480
      supporting_text: NADPH-driven hydroperoxide reduction by AhpC that is mediated by thioredoxin reductase
        and thioredoxin C
    - reference_id: PMID:27249779
      supporting_text: partial inhibition of TrxB2 did not affect Mtb’s susceptibility to growth inhibition
        or killing by plumbagin, a superoxide generator
