  - statement: The two exact H37Rv coding sequences were used for the reductase pair.
    supporting_text: 'trxR/pALACE Rv3913 within AﬂII/ClaI restriction sites This work

      trxC/pET-22b Rv3914 within NdeI/HindIII restriction sites This work'
