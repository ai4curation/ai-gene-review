  - statement: Target Trx/TR expressed in E.
    supporting_text: The reduction of H2O2 requires both Trx and TR and is more efficient under anaerobic
      than aerobic conditions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Target Trx/TR expressed in E. coli; NADPH-dependent peroxide and dinitrobenzene assays.
      Abstract specifies anaerobic versus aerobic and metal-chelation effects; not direct native infection
      evidence.
- id: PMID:14871480
