  title: Glutathione disulfide and S-nitrosoglutathione detoxification by Mycobacterium tuberculosis thioredoxin
    system
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Complete author-hosted PMID:19737561 PDF inspected, including exact Rv3913/Rv3914 constructs,
      Cys40Ser controls, NADPH assays and HPLC product identification. Native infection function remains
      untested. Canonical article identity: PMID:19737561. This URL is an alternate full-text manifestation
