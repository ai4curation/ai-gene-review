- id: PMID:16301794
  title: 'Conformational flexibility of Mycobacterium tuberculosis thioredoxin reductase: crystal structure
    and normal-mode analysis.'
  findings:
  - statement: Target reductase crystal structure, FAD/NADPH domains and normal-mode analysis; curated
      UniProt links cofactor and homodimer evidence.
    supporting_text: The relative rotation of the NADPH domain with respect to the FAD domain is necessary
      for the thioredoxin reduction cycle
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Target reductase crystal structure, FAD/NADPH domains and normal-mode analysis; curated
      UniProt links cofactor and homodimer evidence. Abstract available, not a direct assay of every thioredoxin
      client.
- id: PMID:19737561
  title: Glutathione disulfide and S-nitrosoglutathione detoxification by Mycobacterium tuberculosis thioredoxin
    system.
  findings:
  - statement: Full author PDF recovered normally and inspected.
    supporting_text: thioredoxin reductase B2 and thioredoxin C reduces the oxidized form of the intracellular
      mycothiol (MSSM)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full author PDF recovered normally and inspected. H37Rv constructs, active-site-mutant
      controls and HPLC products support TrxR/TrxC reduction of GSSG/GSNO/MSSM. Infection detoxification
      remains a proposed physiological extension, not an in vivo assay result.
