      breadth.
    supporting_text: NADPH-driven hydroperoxide reduction by AhpC that is mediated by thioredoxin reductase
      and thioredoxin C
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract directly establishes TrxR–TrxC–AhpC peroxide turnover and distinguishes Tpx
      donor breadth. Quantitative AhpC parameters are independently publication-linked in curated UniProt.
      Full publisher retrieval failed; native donor predominance is not established.
