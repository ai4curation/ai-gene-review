id: P9WHH1
gene_symbol: trxB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: Rv3913, officially named trxB and commonly called TrxB2 or TrxR, is a homodimeric FAD-dependent
  thioredoxin reductase. It uses NADPH to regenerate reduced thioredoxins, supporting protein reduction,
  redox homeostasis and thiol-stress resistance. The TrxB2–TrxC pair can supply electrons to AhpC and
  reduce several low-molecular-weight disulfides in vitro. These capacities do not make it an autonomous
  superoxide dismutase or establish that AhpC is its predominant physiological client.
