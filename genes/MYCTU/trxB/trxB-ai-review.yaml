      and DOI/PMCID verification is recorded in modules/bacterial_alkyl_hydroperoxide_reductase-source-analysis/reference-identities.yaml.txt.
      Retained URL citations identify full-text quotations absent from the abstract-only PMID cache. Article
      title: Glutathione disulfide and S-nitrosoglutathione detoxification by Mycobacterium tuberculosis
      thioredoxin system. The title field retains the immutable extractor metadata because the reference
      validator requires that literal cached value; it is not the bibliographic title. The adjacent canonical
      PMID entry carries the actual title.'
