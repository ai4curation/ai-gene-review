id: P9WPA1
gene_symbol: coaX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: >-
  coaX (Rv3600c) encodes a type III pantothenate kinase-family protein of Mycobacterium tuberculosis that
  is a pseudokinase rather than a pantothenate kinase. M. tuberculosis relies on the type I kinase CoaA
  as its essential pantothenate kinase: coaX can be deleted without growth defects in vitro, in macrophages
  or in mice, coaX does not complement an E. coli coaA(Ts) mutant, and purified CoaX shows no ATP hydrolysis
  with pantothenate. CoaX instead copurifies with the depupylase Dop and, as a trimer of head-to-head
  dimers, forms a complex with Dop and Pup. It accelerates Dop-catalysed depupylation of pupylated PanB,
  and pantothenate inhibits this effect, so CoaX couples pantothenate levels to proteasomal turnover of
  the pantothenate-pathway enzyme PanB. Residues needed for kinase/ATPase activity are lost in CoaX orthologs
  from proteasome-bearing actinobacteria.
existing_annotations:
- term:
    id: GO:0004594
    label: pantothenate kinase activity
  evidence_type: IDA
  original_reference_id: PMID:20576686
  qualifier: enables
  negated: true
  review:
    summary: The NOT pantothenate kinase annotation is correct; M. tuberculosis CoaX is a pseudokinase.
    action: ACCEPT
    reason: >-
      Gene inactivation showed CoaA, not CoaX, is the essential pantothenate kinase, and coaX failed to
      complement an E. coli coaA(Ts) mutant. A later study confirmed that purified CoaX does not hydrolyse
      ATP in the presence of pantothenate, whereas CoaA does, and described it as a pseudopantothenate
      kinase. The negated annotation therefore records a real divergence from the type III PanK family
      function.
    supported_by:
    - reference_id: PMID:20576686
      supporting_text: >-
        the coaA gene of M. tuberculosis was able to complement a temperature-sensitive coaA mutant of
        Escherichia coli at a non-permissive temperature while coaX could not
    - reference_id: PMID:39585979
      supporting_text: >-
        we did not detect hydrolysis of ATP by CoaX in the presence of pantothenate, while CoaA showed
        robust ATPase activity
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000101618
  review:
    summary: >-
      ATP binding is inferred from the type III PanK family rule but is not supported for this pseudokinase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The UniRule assignment transfers the nucleotide-binding feature of active type III kinases. M. tuberculosis
      CoaX lacks detectable ATPase activity, its thermostability was unaffected by ATPgammaS alone, and
      residues needed for ATPase activity are lost in CoaX from proteasome-bearing species, so the family-level
      ATP-binding claim is not established for this protein.
    supported_by:
    - reference_id: PMID:39585979
      supporting_text: Mtb CoaX thermostability was unaffected by increasing concentrations of ATPγS alone
    - reference_id: PMID:39585979
      supporting_text: >-
        Multiple-sequence alignment analysis found CoaX in proteasome-bearing species lack residues needed
        for ATPase activity
