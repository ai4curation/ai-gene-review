suggested_questions:
- question: >-
    Which CoaX residues sense pantothenate to release the Pup~PanB-CoaX-Dop complex, and is the pseudokinase
    role conserved in other proteasome-bearing actinobacteria?
suggested_experiments:
- description: >-
    Mutate the putative pantothenate-binding pocket of Mtb CoaX and measure Dop-dependent depupylation
    of Pup~PanB and PanB levels in vivo with and without pantothenate supplementation.
  experiment_type: structure-guided mutagenesis with in vitro and in vivo assays
