- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: HDA
  original_reference_id: PMID:14532352
  qualifier: located_in
  review:
    summary: Plasma membrane assignment from a membrane-fraction proteome; CoaX is a soluble cytoplasmic
      protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The membrane-fraction proteome identified many soluble and membrane-associated proteins, and its
      cached abstract gives no CoaX-specific evidence. CoaX has no transmembrane segment and functions
      with the soluble Dop/Pup-proteasome machinery, so the plasma membrane row most likely reflects carry-over
      of a soluble protein.
    supported_by:
    - reference_id: PMID:14532352
      supporting_text: we have profiled the membrane protein fraction of the M. tuberculosis H37Rv strain
    - reference_id: PMID:39585979
      supporting_text: >-
        we identified a depupylation regulator, a protein called CoaX, through its copurification with
        the depupylase Dop
- term:
    id: GO:0015937
    label: coenzyme A biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000101618
  - UniPathway:UPA00241
  review:
    summary: >-
      CoaX does not catalyse a step of CoA biosynthesis; CoaA is the pantothenate kinase in M. tuberculosis.
    action: REMOVE
    reason: >-
      The UniRule/UniPathway assignment places CoaX at step 1/5 of CoA biosynthesis by family membership,
      but the protein is catalytically inactive as a pantothenate kinase and its deletion has no growth
      phenotype, while CoaA alone is essential. CoaX regulates the abundance of the pantothenate-synthesis
      enzyme PanB through depupylation rather than performing a CoA biosynthetic step, so the participation
      claim is contradicted for this paralog.
    supported_by:
    - reference_id: PMID:20576686
      supporting_text: >-
        coaX could be inactivated in the wild-type cells, proving that CoaA is the essential pantothenate
        kinase in M. tuberculosis
    - reference_id: PMID:20576686
      supporting_text: The coaX deletion mutant showed no growth defects in vitro, in macrophages or in
        mice.
- term:
    id: GO:0043169
    label: cation binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  supporting_entities:
  - UniRule:UR000101618
  review:
    summary: >-
      Monovalent cation binding is inferred from the active type III PanK family and is not shown for
      this pseudokinase.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Active type III pantothenate kinases require NH4+ or K+, which the UniRule transfers to all members.
      M. tuberculosis CoaX is a pseudokinase lacking ATPase activity, so the catalytic cation requirement
      is not established for it.
    supported_by:
    - reference_id: PMID:39585979
      supporting_text: >-
        CoaX is a pseudopantothenate kinase that showed evidence of binding to pantothenate, an essential
        nutrient Mtb synthesizes, but not its phosphorylation.
- term:
    id: GO:0008047
    label: enzyme activator activity
  evidence_type: IDA
  original_reference_id: PMID:39585979
  qualifier: enables
  review:
    summary: CoaX directly activates Dop-catalysed depupylation of Pup~PanB.
    action: NEW
    reason: >-
      Purified CoaX forms a complex with Dop and Pup, and in vitro it
      specifically accelerated Dop-dependent depupylation of Pup~PanB, an
      effect reversed by pantothenate. The regulator binds the enzyme directly
      without covalently modifying it, matching the GO:0008047 definition.
      This is the only function demonstrated for this pseudokinase.
    supported_by:
    - reference_id: PMID:39585979
      supporting_text: In vitro, CoaX specifically accelerated depupylation of Pup~PanB, while addition of pantothenate inhibited this reaction.
