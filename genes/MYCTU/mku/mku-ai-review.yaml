- term:
    id: GO:0051351
    label: positive regulation of ligase activity
  evidence_type: IDA
  original_reference_id: PMID:12215643
  qualifier: involved_in
  review:
    summary: Ku recruits LigD and increases ligation activity.
    action: ACCEPT
    reason: Direct ligation stimulation is supported by the original bacterial Ku study and later interaction
      assays. The recent construct pairs P9WKD9 Ku with CDC1551 LigD P9WNV2, not H37Rv LigD P9WNV3. Ligase
      stimulation remains distinct from assay-dependent polymerase modulation; it is not a universal activation
      claim for every LigD domain.
    supported_by:
    - *id005
    - &id006
      reference_id: PMID:42953966
      supporting_text: Ku stimulates LigD ligase activity through contacts with both polymerase and ligase
        domains, while Ku attenuates template-dependent polymerase activity
