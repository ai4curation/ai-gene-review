    label: DNA helicase complex
  evidence_type: IDA
  original_reference_id: PMID:17376770
  qualifier: part_of
  review:
    summary: Ku participates in a functional UvrD1–Ku–DNA helicase complex.
    action: KEEP_AS_NON_CORE
    reason: The term denotes a complex possessing helicase activity and does not assign autonomous helicase
      catalysis to Ku. The primary abstract explicitly reports the stable ternary complex and Ku-dependent
      unwinding. This is a secondary partner context relative to Ku–LigD end joining. The native deletion/radiation
      phenotypes in that paper are M. smegmatis, not H37Rv; unavailable full construct details are not
      grounds to reject the curated interaction.
