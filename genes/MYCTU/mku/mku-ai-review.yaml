id: P9WKD9
gene_symbol: mku
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: Mku is the homodimeric DNA-end-binding factor of the Mycobacterium tuberculosis H37Rv nonhomologous
  end-joining system. It recognizes exposed double-stranded DNA termini, recruits LigD and stimulates
  ligation of broken ends. Mku also associates with UvrD1 in a DNA-unwinding complex; UvrD1 supplies the
  helicase activity. These interactions organize the processing and joining of DNA breaks.
