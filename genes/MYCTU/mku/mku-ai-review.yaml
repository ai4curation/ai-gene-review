- id: PMID:12215643
  title: Identification of a DNA nonhomologous end-joining complex in bacteria.
  findings:
  - statement: Ku recruits ligase to DNA ends and stimulates ligation; this is an active partner function
      rather than bare binding alone.
    supporting_text: bacterial Ku specifically recruits DNA ligase to DNA ends and stimulates DNA ligation.
- id: PMID:15499016
  title: Mycobacterial Ku and ligase proteins constitute a two-component NHEJ repair machine.
  findings:
  - statement: Mycobacterial Ku and LigD join incompatible DNA ends in vitro and reconstitute NHEJ in
      yeast; the latter is a heterologous assay.
    supporting_text: These enzyme activities allow the Mt-Ku and Mt-Lig proteins to join incompatible
      DSB ends in vitro, as well as to reconstitute NHEJ in vivo in yeast.
- id: PMID:17376770
  title: Mycobacterial UvrD1 is a Ku-dependent DNA helicase that plays a role in multiple DNA repair events,
    including double-strand break repair.
  findings:
  - statement: Ku is a partner in an active UvrD1 complex; UvrD1 is the catalytic helicase and native
      deletion phenotypes are in M.smegmatis.
    supporting_text: Ku stimulates UvrD1 to catalyze ATP-dependent unwinding of 3'-tailed DNAs. UvrD1,
      Ku, and DNA form a stable ternary complex in the absence of ATP.
- id: PMID:42953966
  title: The Mycobacterium tuberculosis Ku C-terminus orchestrates LigD activity through domain-specific
    interactions.
  findings:
  - statement: The accession-defined Ku mutant proteins retain homodimeric assembly in SEC-MALS controls.
    supporting_text: all Ku mutants had retained proper secondary structure folding and a homodimeric
      state using CD Spectroscopy and SEC-MALS
  - statement: The recent Ku–LigD construct combination gives stimulation of ligation and attenuation
      of template-dependent polymerization; the LigD sequence is CDC1551 P9WNV2.
    supporting_text: Ku stimulates LigD ligase activity through contacts with both polymerase and ligase
      domains, while Ku attenuates template-dependent polymerase activity
  - statement: Synthetic accession-defined Ku is the H37Rv target; LigD is a CDC1551 comparator differing
      from H37Rv at residue344.
    supporting_text: 'Codon-optimized Ku (ID: P9WKD9) and LigD (ID: P9WNV2) sequences from M. tuberculosis
      were synthesized by Genewiz'
