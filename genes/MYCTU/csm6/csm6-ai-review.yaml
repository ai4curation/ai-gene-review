id: P71635
gene_symbol: csm6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: >-
  Csm6 (Rv2818c) is the accessory ribonuclease of the type III-A CRISPR-Cas locus of
  Mycobacterium tuberculosis H37Rv, encoded between the cas6 processing endoribonuclease
  and cas2 in the cas6-to-cas2 cluster. It belongs to the CARF-HEPN family of
  second-messenger-activated nucleases and is not a subunit of the Csm effector complex
  that senses invading nucleic acid; it is a free homodimer in the cytoplasm, chemically rather
  than physically coupled to that complex. The two domains have separate jobs. The
  C-terminal HEPN domain carries the catalysis: dimerisation brings the two HEPN domains
  together and builds a single composite active site at their interface, which cleaves
  single-stranded RNA without regard to sequence. The N-terminal CRISPR-associated Rossmann
  fold binds the signal: cyclic oligoadenylate, synthesised from ATP by the Cas10 subunit of
  the Csm complex once that complex has engaged a transcript of the invading element,
  occupies a pocket formed at the interface of the two CARF domains and allosterically
  switches the nuclease on. The architecture makes the protein an amplifier with a safety
  catch. On its own it is held off, because a constitutively active non-specific
  ribonuclease would be lethal to its own cell; only when the signal reaches it does it
  begin degrading RNA indiscriminately, destroying invader transcripts along with host RNA
  to impose a transient growth-arrested state that denies the invader a productive host.
  The whole CRISPR-Cas locus in which it sits is functional, conferring resistance to
  incoming plasmids whose sequences match the spacer array.
