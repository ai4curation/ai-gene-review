- id: PMID:26763118
  title: Structural basis for the endoribonuclease activity of the type III-A
    CRISPR-associated protein Csm6.
  findings:
  - statement: >-
      Csm6 of Thermus thermophilus, one of the two orthologues from which this entry's
      function is inferred, is a single-strand-RNA-specific endoribonuclease.
    supporting_text: >-
      Here we report the crystal structure of Csm6 from Thermus thermophilus and show that
      the protein is a ssRNA-specific endoribonuclease.
    reference_section_type: ABSTRACT
  - statement: >-
      The catalytic centre is composite, assembled only on dimerisation of the two HEPN
      domains, which is the architecture UniProt transfers to this entry.
    supporting_text: >-
      HEPN domain dimerization leads to the formation of a composite ribonuclease active
      site.
    reference_section_type: ABSTRACT
  - statement: >-
      Substituting HEPN-domain residues abolishes catalysis whereas substituting CARF
      residues does not, establishing the CARF domain as regulatory rather than catalytic.
    supporting_text: >-
      Individual substitutions of the HEPN domain residues led to near-complete loss of
      ribonuclease activity, whereas mutations in the CARF domain had little effect
    reference_section_type: RESULTS
  - statement: >-
      The CARF dimer interface forms a conserved electropositive pocket predicted to be an
      allosteric ligand site.
    supporting_text: >-
      The dimer interface of the CARF domains features a conserved electropositive pocket
      that may function as a ligand-binding site for allosteric control of ribonuclease
      activity.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached from PMC. This is the characterisation of UniProtKB:Q53W17, one of
      the two source entries for the ECO:0000250 inferences on P71635; it is cited as the
      source of the transfer and not as a measurement on the M. tuberculosis protein.
- id: PMID:28663439
  title: A cyclic oligonucleotide signaling pathway in type III CRISPR-Cas systems.
  full_text_unavailable: true
  findings:
  - statement: >-
      Csm6 is a ribonuclease that is not part of the effector complex yet is required for
      full immunity.
    supporting_text: >-
      In addition, Csm6, a ribonuclease that is not part of the complex, is also required
      to provide full immunity.
    reference_section_type: ABSTRACT
  - statement: >-
      Cyclic oligoadenylates act as signalling molecules that bind Csm6 and switch on its
      nonspecific RNA degradation.
    supporting_text: >-
      Acting as signaling molecules, cyclic oligoadenylates bind Csm6 to activate its
      nonspecific RNA degradation.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
