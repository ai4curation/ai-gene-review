- id: PMID:28722012
  title: Type III CRISPR-Cas systems produce cyclic oligoadenylate second messengers.
  full_text_unavailable: true
  findings:
  - statement: >-
      A cyclic oligoadenylate made by Cas10 on target recognition allosterically activates
      Csm6 by binding its CARF domain.
    supporting_text: >-
      Upon target RNA binding by the interference complex, its Cas10 subunit converts ATP
      into a cyclic oligoadenylate product, which allosterically activates Csm6 by binding
      to its CRISPR-associated Rossmann fold (CARF) domain.
    reference_section_type: ABSTRACT
  - statement: >-
      CARF-domain mutations that block allosteric activation inhibit Csm6 activity in vivo.
    supporting_text: >-
      CARF domain mutations that abolish allosteric activation inhibit Csm6 activity in
      vivo, and mutations in the Cas10 Palm domain phenocopy loss of Csm6.
    reference_section_type: ABSTRACT
  - statement: >-
      Csm6 acts as a standalone RNase degrading invader transcripts rather than as a subunit
      of the interference complex.
    supporting_text: >-
      The CRISPR-associated protein Csm6 additionally contributes to interference by
      functioning as a standalone RNase that degrades invader RNA transcripts
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only. Establishes the CARF domain as the cOA receiver across
      the family, which is the basis of the DOMAIN inference UniProt makes for this entry
      with ECO:0000250|UniProtKB:Q53W17.
