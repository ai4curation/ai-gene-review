      site.
  - reference_id: UniProtKB:P71635
    supporting_text: >-
      SUBUNIT: Homodimer; the composite ssRNase active site is formed at the dimer
      interface.
    reference_section_type: DATABASE_ENTRY
- description: >-
    Second-messenger receptor function of the N-terminal CARF domain, which is what couples
    this standalone enzyme to an effector complex it is not part of. Cyclic oligoadenylate,
    synthesised from ATP by the Cas10 subunit of the Csm complex once that complex has
    engaged a cognate target transcript, binds a pocket formed at the interface of the two
    CARF domains of the dimer and allosterically activates the HEPN nuclease. The domain
    contributes no catalysis of its own, so its entire function is ligand recognition and
    signal transduction, and it is the reason the protein is not a constitutively lethal
    RNase. GO has no term for binding a cyclic oligoadenylate, so the proposed term is named
    here rather than forcing GO:0030551, whose definition covers only intramolecular cyclic
    mononucleotides. As with the nuclease, the assignment rests on similarity to the
    characterised orthologues rather than on measurement of this protein.
  proposed_molecular_function: cyclic oligoadenylate binding
