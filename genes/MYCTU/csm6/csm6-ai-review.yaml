core_functions:
- description: >-
    Single-strand-specific, sequence-non-specific endoribonuclease. The protein is a
    homodimer and the active site is composite, assembled at the interface of the two
    C-terminal HEPN domains; in the characterised orthologues it needs no metal cofactor and
    cleaves by transesterification, the ribose 2'-hydroxyl attacking the scissile phosphate
    to leave a free 5'-hydroxyl and a 2',3'-cyclic phosphate. The activity is held off in
    the resting protein and is the output arm of the cyclic oligoadenylate branch of type
    III immunity: once switched on it degrades RNA indiscriminately, invader transcripts and
    host RNA alike. All of this is inferred from the Thermus and Streptococcus orthologues;
    the M. tuberculosis protein has not been assayed.
  molecular_function:
    id: GO:0004521
    label: RNA endonuclease activity
  directly_involved_in:
