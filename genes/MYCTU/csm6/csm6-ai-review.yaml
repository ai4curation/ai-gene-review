proposed_new_terms:
- proposed_name: cyclic oligoadenylate binding
  proposed_definition: >-
    Binding to a cyclic oligoadenylate, a closed ring of three to six adenosine
    5'-monophosphate units joined by 3'-5' phosphodiester bonds, such as cyclic
    tetraadenylate or cyclic hexaadenylate. Cyclic oligoadenylates are second messengers
    synthesised from ATP by the Cas10 subunit of type III CRISPR-Cas effector complexes, and
    are bound by the CRISPR-associated Rossmann fold (CARF) domains of accessory effectors
    and of the ring nucleases that degrade them.
  justification: >-
    GO discriminates cyclic-nucleotide ligands at exactly this granularity and already has
    the two bacterial cyclic-dinucleotide cases, both as children of GO:0030551 cyclic
    nucleotide binding: GO:0035438 cyclic-di-GMP binding and GO:0180001 cyclic-di-AMP
    binding. There is no term for cyclic oligoadenylate, the ligand of every CARF-domain
    effector in type III CRISPR systems, so the series is simply missing its third member.
    The parent cannot be used in its place: GO:0030551 is defined as "Binding to a cyclic
    nucleotide, a nucleotide in which the phosphate group is in diester linkage to two
    positions on the sugar residue", which describes an intramolecular ring on a single
    ribose as in cAMP and cGMP. In a cyclic oligoadenylate each phosphate bridges two
    different riboses, so the molecule no more satisfies that definition than c-di-GMP does,
    which is precisely why GO:0035438 exists as a term rather than as an annotation at the
    parent. The function is the defining property of this gene product: the CARF domain
    performs no catalysis and exists solely to recognise this ligand and transmit the signal
    to the HEPN active site, and in the characterised orthologues the stimulation is
    specific for the cyclic and not the linear oligoadenylate. Note what is deliberately not
    proposed: the activated state itself needs no term, because the chemistry Csm6 performs
    once switched on is ordinary RNA endonuclease activity (GO:0004521) and allosteric
    activation is a property of the regulation rather than a distinct molecular function.
    The companion request is a cyclic oligoadenylate synthase activity term for the Cas10
    Palm domain that makes the ligand (see genes/STRTR/cas10 and genes/THET8/cas10), and a
    cyclic oligoadenylate ring nuclease activity term for the enzymes that destroy it.
  proposed_parent:
    id: GO:0030551
    label: cyclic nucleotide binding
  supported_by:
  - reference_id: PMID:28722012
    supporting_text: >-
      Upon target RNA binding by the interference complex, its Cas10 subunit converts ATP
      into a cyclic oligoadenylate product, which allosterically activates Csm6 by binding
      to its CRISPR-associated Rossmann fold (CARF) domain.
    full_text_unavailable: true
  - reference_id: PMID:28663439
    supporting_text: >-
      Acting as signaling molecules, cyclic oligoadenylates bind Csm6 to activate its
      nonspecific RNA degradation.
    full_text_unavailable: true
  - reference_id: PMID:26763118
    supporting_text: >-
      The dimer interface of the CARF domains features a conserved electropositive pocket
      that may function as a ligand-binding site for allosteric control of ribonuclease
      activity.
suggested_questions:
- question: >-
    Is M. tuberculosis Csm6 actually an active ribonuclease? Nothing has been measured on
    this protein, and the HEPN R-X4-6-H motif and the CARF ligand pocket should be checked
    for integrity in the H37Rv sequence before the inferred activity is treated as settled.
- question: >-
    Which cyclic oligoadenylate species, if any, activates it? The ring-size preference
    differs between characterised orthologues, and the M. tuberculosis Cas10 has not been
    shown to make any cOA at all, so both halves of the signalling pair are inferred in this
    organism.
- question: >-
    Does the H37Rv system use the cOA branch under any physiological condition? M.
    tuberculosis has few known phages and the measured immunity phenotype is anti-plasmid,
    so it is open whether an amplifying RNA-degrading response is deployed at all or whether
    the locus functions mainly in plasmid exclusion.
- question: >-
    What terminates the signal in this organism? If no ring nuclease is encoded nearby, an
    activated Csm6 would have no demonstrated off-switch, and the self-limiting character of
    the response seen in other species would be unexplained here.
suggested_experiments:
- description: >-
    Express and purify recombinant Rv2818c and assay single-stranded RNA cleavage with and
    without chemically defined cA3, cA4, cA5 and cA6, establishing both the activity and its
    ring-size preference and replacing the ECO:0000250 inference with a measurement.
- description: >-
    Reconstitute the H37Rv Csm effector complex with mature 71-nucleotide crRNA produced by
    Rv2824c Cas6, challenge it with a cognate target RNA, and test whether the reaction
    products activate Rv2818c, closing the Cas10-to-Csm6 circuit within this organism.
- description: >-
    Delete csm6 alone in M. tuberculosis or in M. bovis BCG and measure resistance to
    transformation with spacer-matching plasmids, separating the contribution of the
    accessory nuclease from that of the rest of the locus.
- description: >-
    Determine the structure of Rv2818c, alone and with a cyclic oligoadenylate bound, to
    confirm the CARF-HEPN dimer architecture inferred from the Thermus protein and to
    identify the ligand pocket residues.
- description: >-
    Profile the transcriptome after inducing a cognate target in a strain carrying the
    native locus, to test whether an indiscriminate RNA-degrading state is actually entered
    in this slow-growing organism and how it recovers.
