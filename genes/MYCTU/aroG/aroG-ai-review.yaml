- term:
    id: GO:0030145
    label: manganese ion binding
  evidence_type: IDA
  original_reference_id: PMID:16288916
  qualifier: enables
  review:
    summary: The enzyme is divalent-metal dependent and was crystallised with Mn2+ bound in the active
      site (ligands residues 87, 369, 411, 441).
    action: KEEP_AS_NON_CORE
    reason: Mn2+ binding is directly observed in the structure and Mn2+ supports activity, so the term
      is correct. It is a cofactor-binding property in service of the catalytic activity rather than a
      function in its own right, and the enzyme is equally active with Co2+ or Cd2+; the physiological
      metal is not established. Kept as non-core.
    supported_by:
    - reference_id: PMID:16288916
      supporting_text: The crystal structure of M.tuberculosis DAH7PS has been determined by single-wavelength
        anomalous diffraction and refined at 2.3A in complex with substrate phosphoenolpyruvate and Mn(2+).
    - reference_id: file:MYCTU/aroG/aroG-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Binds 1 divalent cation per subunit. The enzyme is active with manganese, cobalt
        or cadmium ions.
- term:
    id: GO:0051260
    label: protein homooligomerization
  evidence_type: IPI
  original_reference_id: PMID:15721768
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O53512
  review:
    summary: Gel filtration of recombinant mtDAHPS, reported as a pentamer in solution.
    action: KEEP_AS_NON_CORE
    reason: 'AroG does self-associate, so homo-oligomerisation is true, but the pentamer stoichiometry
      is superseded: crystal structures show a tight homodimer that assembles into homotetramers whose
      interfaces carry the allosteric Trp/Phe sites. The assembly of its own quaternary structure is peripheral
      to the enzyme''s role, so the row is kept as non-core.'
    supported_by:
    - reference_id: PMID:15721768
      supporting_text: Gel filtration chromatography results demonstrate that recombinant mtDAHPS is a
        pentamer in solution.
