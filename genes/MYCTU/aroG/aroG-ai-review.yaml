gene_symbol: aroG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: 'aroG (Rv2178c) encodes the sole 3-deoxy-D-arabino-heptulosonate 7-phosphate (DAH7P) synthase
  of Mycobacterium tuberculosis, a type II DAH7PS that catalyses the first committed step of the shikimate
  pathway: the metal-dependent aldol-like condensation of phosphoenolpyruvate with D-erythrose 4-phosphate
  to give DAH7P and phosphate, the first of seven steps to chorismate. The enzyme is a soluble cytosolic
  homodimer of (beta/alpha)8 TIM barrels that assembles into tetramers; its active site and PEP/Mn2+ binding
  mode match the unrelated-in-sequence type I enzymes, indicating common ancestry, and it is active with
  Mn2+, Co2+ or Cd2+. Because M. tuberculosis has only one DAH7PS, pathway flux is controlled by synergistic
  allostery: Phe, Tyr or Trp alone barely inhibit, but Trp with Phe (and further Tyr) bound at separate
  sites formed by type II-specific accessory elements strongly inhibit, also chorismate. AroG also forms
  a noncovalent complex with the intracellular AroQ-delta chorismate mutase MtCM (Rv0948c), four AroG
  subunits sandwiched between two MtCM dimers, which raises chorismate mutase efficiency more than 100-fold
  and makes it sensitive to Phe and Tyr, coupling the first step of the common pathway with the Phe/Tyr
  branch point.'
