suggested_questions:
- question: Which divalent metal occupies the AroG active site in M. tuberculosis cells, given that the
    purified enzyme is active with Mn2+, Co2+ or Cd2+?
- question: Does the AroG-MtCM complex form at physiological concentrations in M. tuberculosis, and does
    chorismate mutase activation by AroG change DAH7PS activity or its allosteric response?
- question: Should a GO process term for coupling of the DAHP synthase and chorismate mutase steps (feedback
    regulation of the Phe/Tyr branch) be modelled on AroG via enzyme activator activity with an MtCM has_input,
    rather than as a process annotation?
suggested_experiments:
- description: Metal-content analysis (ICP-MS) of AroG purified from M. tuberculosis or a native-like
    host, with activity reconstitution, to identify the physiological metal.
- description: In vivo crosslinking or co-purification of AroG with MtCM from M. tuberculosis, and an
    AroG allosteric-site mutant that keeps MtCM binding, to test the regulatory role of the complex on
    Phe/Tyr production.
