      supporting_text: The structure reveals a tightly associated dimer of (beta/alpha)(8) TIM barrels.
    - reference_id: PMID:20667835
      supporting_text: The MtuDAH7PS/Trp/Phe homotetramer binds four Trp and six Phe molecules.
