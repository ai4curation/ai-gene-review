  review:
    summary: HDA from proteomic profiling of the membrane protein fraction of M. tuberculosis H37Rv.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'Detection in a membrane fraction is not evidence of plasma membrane residence for an abundant
      soluble enzyme: AroG has no TM segment or signal peptide, is expressed and purified as a soluble
