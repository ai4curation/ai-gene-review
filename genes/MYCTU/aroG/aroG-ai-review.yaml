  findings:
  - statement: Recombinant mtDAHPS purified to homogeneity with DAHP synthase activity; gel filtration
      suggested a pentamer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read; cloning and purification of active enzyme. Its pentamer claim is superseded
      by later crystal structures.
- id: PMID:16288916
  title: The structure of 3-deoxy-d-arabino-heptulosonate 7-phosphate synthase from Mycobacterium tuberculosis
    reveals a common catalytic scaffold and ancestry for type I and type II enzymes.
  findings:
  - statement: Type II DAH7PS is metal-dependent, feedback-inhibited by Phe, Trp, Tyr and chorismate (Trp+Phe
      synergistic), and a TIM-barrel dimer sharing the type I active site.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read; M. tuberculosis enzyme kinetics, metal dependence, feedback inhibition
      and PEP/Mn2+ structure. UniProt cites it with ECO:0000269.
- id: PMID:19556970
  title: 'Structure and function of a complex between chorismate mutase and DAHP synthase: efficiency
    boost for the junior partner.'
  findings:
  - statement: AroG (MtDS) binds the AroQ-delta chorismate mutase MtCM and activates it more than 100-fold;
      the complex chorismate mutase activity is synergistically inhibited by Phe and Tyr.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract read; complex structure and >100-fold activation of MtCM by AroG.
- id: PMID:19851019
  title: 'A novel noncovalent complex of chorismate mutase and DAHP synthase from Mycobacterium tuberculosis:
    protein purification, crystallization and X-ray diffraction analysis.'
  findings:
  - statement: Expression, purification and crystallisation of MtCM and of the MtCM-MtDS complex.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract read; crystallisation communication for the MtCM-MtDS complex.
- id: Reactome:R-MTU-964912
  title: DHAP from Ery4P and PEP
  findings: []
- id: PMID:20667835
  title: Synergistic allostery, a sophisticated regulatory network for the control of aromatic amino acid
    biosynthesis in Mycobacterium tuberculosis.
  findings:
  - statement: Phe, Tyr or Trp alone do not inhibit, but Trp+Phe or Trp+Tyr combinations strongly inhibit
      and induce E4P cooperativity; Trp and Phe sites lie on type II-specific accessory elements of the
      tetramer.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Found by PubMed title search (UniProt lists it only as a PDB reference); abstract read.
- id: PMID:22154807
  title: 'Dynamic cross-talk among remote binding sites: the molecular basis for unusual synergistic allostery.'
  findings:
  - statement: Trp+Phe binding to separate sites causes no large conformational change; ITC and MD show
      coupled dynamics between the allosteric and active sites.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Found by PubMed search; abstract read.
- id: PMID:23274137
  title: 'Three sites and you are out: ternary synergistic allostery controls aromatic amino acid biosynthesis
    in Mycobacterium tuberculosis.'
  findings:
  - statement: A third, Tyr-selective allosteric site augments Trp+Phe synergistic inhibition.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Found by PubMed search; abstract read.
