- id: PMID:20615954
  title: Essential roles for imuA'- and imuB-encoded accessory factors in DnaE2-dependent mutagenesis
    in Mycobacterium tuberculosis.
  findings:
  - statement: M. tuberculosis imuB/double-deletion mutagenesis and individual M. smegmatis deletion experiments
      establish the accessory requirements, with assay-specific scope detailed in source-scope.md.
    supporting_text: Here, we confirm that Rv3395c (designated imuA ′) and Rv3394c ( imuB ) are individually
      essential for induced mutagenesis and damage tolerance.
  - statement: M. tuberculosis ImuA′ interacts with ImuB in yeast two-hybrid; tested C-terminal truncations
      disrupt interaction. No ImuA′ self-association was detected in that assay.
    supporting_text: We observed the direct interaction of ImuA′ with ImuB involving the C-terminal regions
      of both proteins; however, no evidence of ImuA′ self-association was detected that might indicate
      RecA-like filamentation ( 40 ).
  - statement: ImuA′ is a divergent actinobacterial RecA-like accessory factor; low similarity does not
      establish absence of evolutionary homology to other ImuA proteins.
    supporting_text: which encodes a protein of unknown function restricted primarily to actinomycetes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract/discussion plus publisher Results/Methods read. H37Rv imuB and double-deletion
      mutagenesis and M. tuberculosis proteins in yeast two-hybrid are direct target evidence. Individual
