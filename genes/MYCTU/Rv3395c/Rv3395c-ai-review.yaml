description: Rv3395c (ImuA′) is a RecA-like accessory protein of the mycobacterial ImuA′–ImuB–DnaE2 damage-induced
  mutagenesis system. It interacts with ImuB and supports error-prone lesion bypass. M. tuberculosis deletion
  genetics and protein-interaction assays, together with individual-gene and biochemical work in M. smegmatis,
  establish this accessory role. Its precise biochemical contribution beyond ImuB association remains
  unresolved. The predicted membrane anchor in the M. tuberculosis sequence has not been validated experimentally.
