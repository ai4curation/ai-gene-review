core_functions:
- description: RecA-like accessory partner of ImuB that contributes to the ImuA′–ImuB–DnaE2 error-prone
    lesion-bypass mechanism; the contribution is supported by target interaction/genetic evidence and
    ortholog experiments, while its precise biochemical action remains unresolved.
  directly_involved_in:
