gene_symbol: Rv3395c
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: >-
  Rv3395c, designated ImuA', is the accessory partner of ImuB in the
  mycobacterial damage-induced mutagenesis cassette. It is restricted largely to
  actinomycetes and is not a homolog of proteobacterial ImuA; it instead
  resembles RecA at the structural level while lacking RecA's C-terminal domain
  and nucleotide-binding motif. Deletion of Rv3395c abolishes damage-induced
  mutagenesis and damage tolerance as completely as deletion of imuB or dnaE2,
  and ImuA' binds ImuB directly through the C-terminal regions of both proteins.
  No catalytic or nucleic-acid-binding activity has been demonstrated for it.
existing_annotations:
  - term:
      id: GO:0016020
      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: >-
        The membrane location is a UniProt subcellular-location mapping that
        rests on a single predicted transmembrane helix, and it fits poorly with
        the protein's demonstrated role.
      action: MARK_AS_OVER_ANNOTATED
      reason: >-
        The row derives from the UniProt keyword-to-GO mapping of a
        SUBCELLULAR LOCATION line whose evidence is curator inference
        (ECO:0000305) over one sequence-analysis TRANSMEM prediction
        (ECO:0000255) at residues 63-83; there is no experimental localization.
        ImuA' acts as a direct ImuB partner in chromosomal damage tolerance, so
        a single-pass membrane anchor is unlikely to be its functional location,
        although a hydrophobic segment is genuinely present and the claim is not
        contradicted by any measurement. Left in place as a flagged
        over-annotation rather than removed.
      supported_by:
        - reference_id: file:MYCTU/Rv3395c/Rv3395c-uniprot.txt
          record_section: ["FT:TRANSMEM"]
          supporting_text: 'FT   TRANSMEM        63..83'
        - reference_id: file:MYCTU/Rv3395c/Rv3395c-uniprot.txt
          record_section: ["CC:SUBCELLULAR LOCATION"]
          supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Membrane {ECO:0000305}; Single-pass membrane'
  - term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IDA
    original_reference_id: PMID:20615954
    qualifier: involved_in
    review:
      summary: >-
        The cited experiments show that Rv3395c is required for damage-induced
        mutagenesis and damage tolerance, which is lesion bypass rather than
        repair.
      action: MODIFY
      reason: >-
        The deletion mutant loses induced mutagenesis and damage tolerance
        together, the signature of error-prone translesion synthesis: lesions are
        tolerated, not removed, and the cost is mutation. GO:0006281 sits on the
        repair branch and so misplaces the gene; GO:0042276 is the specific term
        the same data support and is the term GOA already uses for the partner
        polymerase DnaE2 from this reference.
      proposed_replacement_terms:
        - id: GO:0042276
          label: error-prone translesion synthesis
      supported_by:
        - reference_id: PMID:20615954
          supporting_text: >-
            Here, we confirm that Rv3395c (designated imuA ′) and Rv3394c ( imuB
            ) are individually essential for induced mutagenesis and damage
            tolerance.
        - reference_id: PMID:20615954
          supporting_text: >-
            We observed the direct interaction of ImuA′ with ImuB involving the
            C-terminal regions of both proteins; however, no evidence of ImuA′
            self-association was detected that might indicate RecA-like
            filamentation ( 40 ).
      source_defects:
