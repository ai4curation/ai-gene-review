  - reference_id: PMID:20615954
    supporting_text: We observed the direct interaction of ImuA′ with ImuB involving the C-terminal regions
      of both proteins; however, no evidence of ImuA′ self-association was detected that might indicate
      RecA-like filamentation ( 40 ).
  - reference_id: file:analysis/module_audits/bacterial_imuabc_damage_induced_mutagenesis/mycobacteria-consultation/source-scope.md
  knowledge_gaps:
  - gap_statement: The biochemical contribution of M. tuberculosis ImuA′ beyond ImuB association remains
      unresolved, including whether it binds DNA or nucleotides under functional conditions.
    boundary: M. tuberculosis protein-interaction evidence and M. smegmatis accessory-complex studies
      establish an interaction role. Myxococcus ImuA ATPase results do not establish the same activity
      in ImuA′.
    significance: A target-specific biochemical reconstitution is needed to distinguish scaffolding, allosteric
      regulation and possible substrate interactions.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
  - gap_statement: Whether the predicted membrane segment anchors native M. tuberculosis ImuA′ remains
      unresolved.
    boundary: Diffuse tagged M. smegmatis ImuA′ fluorescence provides homolog evidence, but no direct
      M. tuberculosis localization result was established in these sources.
    significance: Native localization would clarify how the accessory protein accesses the damage-response
      machinery.
    gap_kind:
    - BIOLOGY
    dark_aspect: CC_DARK
