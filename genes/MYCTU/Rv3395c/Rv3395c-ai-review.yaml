          resource: MTBBASE
          record: 'UniProtKB:P9WKZ9 involved_in GO:0006281 IDA PMID:20615954'
          slot: evidence_type
          requested_change: REPOINT
          asserted_value: IDA
          corrected_value: IMP
          confidence: PROBABLE
          explanation: >-
            The evidence in PMID:20615954 for Rv3395c is a gene-deletion mutant
