    summary: The membrane mapping is predictive; homolog imaging favors a soluble distribution but does
      not directly locate M. tuberculosis ImuA′.
    action: MARK_AS_OVER_ANNOTATED
    reason: The UniProt subcellular-location mapping rests on one predicted transmembrane segment and
      curator inference, without target-specific localization. PMID37530405 finds diffuse fluorescence
      for the M. smegmatis homolog, but its tagged construct does not rescue every damage-tolerance phenotype.
      This supports caution about a membrane assignment, not a definitive negative measurement in M. tuberculosis.
      Retain MARK_AS_OVER_ANNOTATED rather than assert an established cytoplasmic location.
