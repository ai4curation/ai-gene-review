core_functions:
  - description: >-
      Actinobacterial accessory component of the damage-induced mutagenesis
      cassette: binds ImuB through its C-terminus and is required, with ImuB and
      DnaE2, for error-prone synthesis past DNA lesions.
    directly_involved_in:
      - id: GO:0042276
        label: error-prone translesion synthesis
    supported_by:
      - reference_id: PMID:20615954
        supporting_text: >-
          Here, we confirm that Rv3395c (designated imuA ′) and Rv3394c ( imuB )
          are individually essential for induced mutagenesis and damage
          tolerance.
      - reference_id: PMID:20615954
        supporting_text: >-
          We observed the direct interaction of ImuA′ with ImuB involving the
          C-terminal regions of both proteins; however, no evidence of ImuA′
          self-association was detected that might indicate RecA-like
          filamentation ( 40 ).
    knowledge_gaps:
      - gap_statement: >-
          What ImuA' does biochemically is unknown: it has a RecA-like fold but
          lacks the RecA nucleotide-binding motif, and neither DNA binding nor
          any catalytic activity has been tested.
        boundary: >-
          Its requirement for induced mutagenesis and damage tolerance, and its
          direct C-terminal interaction with ImuB, are established.
        significance: >-
          Whether ImuA' delivers the cassette to single-stranded DNA, as its
          RecA-like fold suggests, determines how the mutasome finds its
          substrate and whether it can be targeted separately from DnaE2.
        gap_kind:
          - BIOLOGY
        dark_aspect: MF_DARK
      - gap_statement: >-
          Where ImuA' is in the cell is unresolved: the only localization claim
          is a predicted single-pass membrane anchor, which has never been tested
          against its role on the chromosome.
        boundary: >-
          A hydrophobic segment at residues 63-83 is predicted; no fractionation
          or imaging data exist.
        significance: >-
          A membrane-tethered ImuA' would imply a recruitment step that the
          current cytoplasmic mutasome model does not contain.
        gap_kind:
          - BIOLOGY
        dark_aspect: CC_DARK
proposed_new_terms: []
suggested_questions:
  - question: >-
      Does ImuA' bind single-stranded DNA through its RecA-like fold, and is it
      membrane-associated or cytoplasmic in M. tuberculosis?
suggested_experiments:
  - description: >-
      Fractionate or image a tagged ImuA' to test the predicted membrane anchor,
      and assay purified ImuA' for ssDNA binding and nucleotide hydrolysis
      alongside an ImuB-binding-deficient C-terminal allele scored for induced
      mutagenesis.
