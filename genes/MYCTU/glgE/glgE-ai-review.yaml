core_functions:
- description: >-
    Transfers a maltosyl unit from alpha-maltose 1-phosphate onto the
    non-reducing end of an alpha-1,4-glucan chain, extending it by two glucose
    residues and releasing phosphate; the committed polymerizing step that
    builds glycogen-like and capsular alpha-glucan from the TreS-Pep2 maltose
    1-phosphate pool.
  molecular_function:
