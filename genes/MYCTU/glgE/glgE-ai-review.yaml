proposed_new_terms:
- proposed_name: alpha-1,4-glucan:maltose-1-phosphate maltosyltransferase activity
  proposed_definition: >-
    Catalysis of the reaction: alpha-maltose 1-phosphate +
    [(1->4)-alpha-D-glucosyl](n) = [(1->4)-alpha-D-glucosyl](n+2) + phosphate.
  justification: >-
    GlgE has a curated EC 2.4.99.16 / RHEA:42692 reaction demonstrated on the M.
    tuberculosis enzyme, but GO has no term specific to the maltose
    1-phosphate-dependent transfer of a maltosyl unit onto alpha-1,4-glucan. The
    nearest existing term is hexosyltransferase activity (GO:0016758), which the
    ontology uses for segment/multi-residue glucan transfers as well (its
    descendants include GO:0003844 1,4-alpha-glucan branching enzyme activity and
    GO:0004134 4-alpha-glucanotransferase activity), so the proposed
    substrate-specific term is placed under GO:0016758 rather than left at the
    general parent GO:0016757.
  proposed_parent:
    id: GO:0016758
    label: hexosyltransferase activity
suggested_questions:
- question: >-
    Is the in vitro reverse (phosphorolytic) and disproportionation activity of
    GlgE physiologically relevant, or is the enzyme committed to chain
    extension in vivo?
suggested_experiments:
- description: >-
    Quantify maltose 1-phosphate, alpha-glucan chain length and branching in a
    conditional glgE knockdown of M. tuberculosis, with and without a treS or
    glgB lesion, to test GlgE's committed-step role and its coupling to GlgB
    branching.
