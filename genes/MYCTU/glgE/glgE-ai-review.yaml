    - reference_id: file:MYCTU/glgE/glgE-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: >-
        Belongs to the glycosyl hydrolase 13 family. GlgE
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: HDA
  original_reference_id: PMID:14532352
  qualifier: located_in
  review:
    summary: Detected in a membrane-fraction proteome; retained as non-core, not the site of the core activity.
    action: KEEP_AS_NON_CORE
    reason: >-
      The curator recorded GlgE by high-throughput mass spectrometry among the
      proteins of the H37Rv membrane fraction. GlgE is a soluble homodimer with
      no predicted transmembrane segment, so this is a peripheral association
      (plausibly with the membrane-bound glucan-synthesis machinery) rather than
      an integral-membrane location. The experimental detection is real and is
      kept, but as a non-core peripheral location: the catalytic activity acts
      on the cytosolic maltose 1-phosphate and alpha-glucan pools, which is why
      the membrane row is retained rather than treated as the site of function.
    supported_by:
    - reference_id: PMID:14532352
      supporting_text: >-
        we have profiled the membrane protein fraction of the M. tuberculosis
        H37Rv strain using an analytical platform that couples one-dimensional
        SDS gels to a microcapillary liquid chromatography-nanospray-tandem
        mass spectrometer
