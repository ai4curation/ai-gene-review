id: P9WQ17
gene_symbol: glgE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83332
  label: Mycobacterium tuberculosis H37Rv
description: >-
  GlgE (Rv1327c) is the maltosyltransferase of Mycobacterium tuberculosis, a
  cytosolic glycoside hydrolase family 13 (GH13) enzyme of the GlgE subfamily.
  It uses alpha-maltose 1-phosphate (M1P) as the activated sugar donor to
  elongate linear or branched alpha-1,4-glucan chains by two glucose units at a
  time, releasing inorganic phosphate (EC 2.4.99.16). The enzyme is an
  alpha-retaining homodimer that prefers maltooligosaccharide acceptors with a
  degree of polymerization of four or more. M1P is supplied upstream by the
  trehalose synthase TreS and the maltokinase Pep2/Mak, and GlgB then introduces
  the alpha-1,6 branches; together these four enzymes convert trehalose into
  cytosolic glycogen-like and capsular alpha-glucan. GlgE is essential: blocking
  it causes toxic accumulation of M1P that kills the bacterium, which makes it a
  validated drug target.
existing_annotations:
- term:
    id: GO:0004553
    label: hydrolase activity, hydrolyzing O-glycosyl compounds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR021828
  review:
    summary: Demonstrably wrong IEA mapping; GlgE is a maltosyltransferase, not a glycoside hydrolase.
    action: REMOVE
    reason: >-
      The GlgE-specific N/S domain signature (IPR021828) belongs to the GH13
      structural clan, which InterPro2GO maps generically to O-glycosyl
      hydrolase activity. GlgE does not hydrolyse O-glycosyl bonds: it transfers
      a maltosyl unit from alpha-maltose 1-phosphate to an alpha-1,4-glucan
      acceptor by an alpha-retaining mechanism, and the reverse reaction it can
      run in vitro is phosphorolytic (releasing M1P with inorganic phosphate),
      not hydrolytic. The curated catalytic activity is the transferase reaction
      EC 2.4.99.16, so the hydrolase term is a demonstrably wrong electronic
      mapping and is removed, consistent with the P. putida GlgE (Q88FM9) review.
      The underlying InterPro2GO mapping is flagged as a source defect.
    source_defects:
    - defect_type: WRONG_TERM
      resource: INTERPRO
      record: InterPro:IPR021828
      slot: interpro2go
      requested_change: DELETE_VALUE
      asserted_value: GO:0004553
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        InterPro maps IPR021828 (GlgE domain N/S) to GO:0004553 hydrolase
        activity, hydrolyzing O-glycosyl compounds, which GOA applies as an IEA
        to GlgE maltosyltransferases. GlgE is an alpha-1,4-glucan:maltose
        1-phosphate maltosyltransferase (EC 2.4.99.16), a glycosyltransferase,
        not a glycoside hydrolase; the signature should map to a transferase
        term (under GO:0016758), not to GO:0004553.
