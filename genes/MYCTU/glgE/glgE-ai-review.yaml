- term:
    id: GO:0005993
    label: trehalose catabolic process
  evidence_type: IMP
  original_reference_id: PMID:20305657
  qualifier: involved_in
  review:
    summary: GlgE acts on maltose 1-phosphate, not trehalose; the process it performs is alpha-glucan biosynthesis.
    action: MODIFY
    reason: >-
      The IMP rests on the glgE loss-of-function phenotype, where blocking GlgE
      causes toxic accumulation of maltose 1-phosphate (M1P). That phenotype
      places GlgE as the M1P-consuming step of the trehalose-to-alpha-glucan
      route, but GlgE does not act on trehalose: its substrate is M1P, three
      enzymatic steps downstream of trehalose, and the trehalose-cleaving step
      is performed by TreS. The process GlgE itself carries out is
      alpha-glucan biosynthesis, so the term is reframed to the activity GlgE
      performs rather than the upstream substrate the pathway consumes.
    proposed_replacement_terms:
    - id: GO:0030979
      label: alpha-glucan biosynthetic process
    supported_by:
    - reference_id: PMID:20305657
      supporting_text: >-
        GlgE inactivation causes rapid death of M. tuberculosis in vitro and in
        mice through a self-poisoning accumulation of maltose 1-phosphate.
