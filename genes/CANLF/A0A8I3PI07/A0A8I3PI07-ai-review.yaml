core_functions:
- description: >-
    CNNM4 exchanges intracellular Mg2+ for extracellular Na+ across the basolateral plasma
    membrane of polarized epithelia (intestine, ameloblasts), providing the exit step of
    transcellular magnesium absorption and supporting systemic and intracellular Mg2+
    balance. MgATP binding to the CBS pair organises the full-length protein into an
    asymmetric dimer-of-dimers. For the dog protein this is inferred from CNNM4-subfamily
    placement (PTHR12064:SF26, PAINT node PTN002635769) and 93% identity to human CNNM4.
  molecular_function:
    id: GO:0061768
    label: magnesium:sodium antiporter activity
  directly_involved_in:
  - id: GO:1903830
    label: magnesium ion transmembrane transport
  - id: GO:0035725
    label: sodium ion transmembrane transport
  - id: GO:0010960
    label: magnesium ion homeostasis
  locations:
