id: A0A8I3PI07
gene_symbol: CNNM4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9615
  label: Canis lupus familiaris
description: >-
  CNNM4 (cyclin and CBS domain divalent metal cation transport mediator 4) is a
  multi-pass plasma-membrane protein of the CNNM/ACDP family. The dog protein (796 aa)
  has a signal peptide, an N-terminal extracellular immunoglobulin-like domain, the
  four-helix CNNM transmembrane domain, a cytoplasmic pair of CBS domains that binds
  MgATP, and a C-terminal cyclic nucleotide-binding homology domain. In mammals CNNM4
  sits at the basolateral membrane of intestinal epithelial cells and enamel-forming
  ameloblasts, where it extrudes Mg2+ from the cell in exchange for extracellular Na+.
  This basolateral efflux is the exit step of transcellular magnesium absorption, so
  CNNM4 is needed for systemic magnesium balance and for enamel formation. MgATP binding
  to the CBS pair organises the full-length protein into a dimer-of-dimers assembly,
  and CNNM4 also associates with the TRPM7 channel and stimulates divalent-cation entry
  through it. In humans, biallelic loss-of-function variants cause Jalili syndrome
  (cone-rod dystrophy with amelogenesis imperfecta). No functional study of the dog
  protein itself has been reported; its function is inferred from its placement in the
  CNNM4 subfamily and 93% identity to human CNNM4.
