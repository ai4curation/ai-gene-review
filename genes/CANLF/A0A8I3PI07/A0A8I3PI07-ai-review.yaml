    label: basolateral plasma membrane
  supported_by:
  - reference_id: PMID:24339795
    supporting_text: In the absence of extracellular Na+, Mg2+ depletion did not induce Mg2+ extrusion (Phase 3), but restoration of Na+ instantaneously caused Mg2+ extrusion (Phase 4).
  - reference_id: PMID:42497866
    supporting_text: the outward-facing state, thereby promoting Mg2+/Na+ exchange.
  - reference_id: file:CANLF/A0A8I3PI07/A0A8I3PI07-bioinformatics/RESULTS.md
    supporting_text: 'Dog vs human CNNM4: identity 0.926 over 775 aligned columns (similarity 0.961).'
suggested_questions:
- question: >-
    GO:0061768 magnesium:sodium antiporter activity is written as Na+(in) + Mg2+(out) =
    Na+(out) + Mg2+(in), whereas CNNM4 extrudes Mg2+ and takes up Na+. Should the
    definition be direction-neutral, or is a separate export-direction term needed?
- question: >-
    Does the ~21-residue C-terminal insertion in the dog CNNM4 gene model correspond to an
    alternative exon present in other carnivores, and does it affect the CNBH domain?
- question: >-
    Should the TRPM7-stimulating (ion channel regulator) activity shown for human CNNM4 be
    propagated phylogenetically to CNNM4 orthologs?
