- id: PMID:24339795
  title: 'Basolateral Mg2+ extrusion via CNNM4 mediates transcellular Mg2+ transport
    across epithelia: a mouse model.'
  findings:
  - statement: Mouse CNNM4 localizes to the basolateral membrane of ameloblasts and intestinal epithelia and extrudes Mg2+ in a Na+-dependent manner; knockout mice have defective intestinal Mg2+ absorption and amelogenesis.
    supporting_text: Functional analyses at the molecular and organismal levels revealed a common role for CNNM4 in mediating transcellular Mg2+ transport by basolateral Mg2+ extrusion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; primary experimental source for CNNM4 Mg2+/Na+ exchange and basolateral localization (mouse and human CNNM4 constructs).
- id: PMID:42497866
  title: Dynamic dimer-of-dimers architecture defines Mg(2+) transport in human CNNM4.
  findings:
  - statement: Full-length human CNNM4 forms an MgATP-dependent asymmetric tetramer and its conformational cycle promotes Mg2+/Na+ exchange.
    supporting_text: Tetramerization is MgATP-dependent, with the intracellular modules remaining highly dynamic otherwise.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; human CNNM4 cryo-EM structures.
- id: PMID:34928937
  title: CNNM proteins selectively bind to the TRPM7 channel to stimulate divalent cation
    entry into cells.
  findings:
  - statement: CNNM4 coexpression stimulates TRPM7-dependent divalent cation uptake.
    supporting_text: Coexpression of TRPM7 with CNNM2 and CNNM4 produced the greatest stimulation of TRPM7-dependent Zn2+ uptake.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached; supports the TRPM7-regulatory role mentioned in the description. Not used to add a NEW annotation for the dog protein.
