- term:
    id: GO:0015081
    label: sodium ion transmembrane transporter activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: >-
      PAINT node PTN002635769 (Euteleostomi, seeded by mouse Cnnm4) propagates sodium
      transporter activity together with magnesium transporter activity. In CNNM4-expressing
      cells, Mg2+ extrusion requires extracellular Na+ and is accompanied by Na+ entry, and
      the human CNNM4 structure is described as promoting Mg2+/Na+ exchange.
    action: MODIFY
    reason: >-
      The sodium movement is real but is the counter-ion arm of a coupled Mg2+/Na+ exchange,
      not independent sodium transport. The more precise coupled term,
      GO:0061768 magnesium:sodium antiporter activity, captures both IBA MF rows from this
      node and matches the human CNNM4 review. The node is CNNM4-specific and the target is
      in the same subfamily (SF26), so transfer of the coupled activity is warranted.
    proposed_replacement_terms:
    - id: GO:0061768
      label: magnesium:sodium antiporter activity
    supported_by:
    - reference_id: GO_REF:0000033
    - reference_id: PMID:24339795
      supporting_text: In the absence of extracellular Na+, Mg2+ depletion did not induce Mg2+ extrusion (Phase 3), but restoration of Na+ instantaneously caused Mg2+ extrusion (Phase 4).
    - reference_id: PMID:42497866
      supporting_text: the outward-facing state, thereby promoting Mg2+/Na+ exchange.
