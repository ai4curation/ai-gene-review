id: A0A8I3PI07
gene_symbol: CNNM4
taxon:
  id: NCBITaxon:9615
  label: Canis lupus familiaris
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for dog CNNM4, an ACDP-family magnesium efflux
  transporter. This is one of ProTrek's better results in the benchmark: the top GO hit
  is magnesium ion homeostasis, an exact match to GOA and to this review's core biology,
  and rank 3 sharpens it to intracellular magnesium ion homeostasis. The free-text
  Function channel scores unusually high (21.7) and returns the C. elegans cnnm-1..5
  descriptions verbatim, correctly identifying the family and its Mg2+ role. The
  characteristic weakness is still visible: ranks 2, 4 and 5 substitute other divalent
  cations (manganese, cobalt) for magnesium, so the ranked list mixes the correct metal
  with wrong ones and gives no way to tell them apart from score alone. ProtNLM2 on the
  same protein returned only broad terms (transmembrane transporter activity, monoatomic
  ion transport, plasma membrane), all already in GOA.
  Assessment: 1 correct novel (COR), 1 correct not novel (CNN), 1 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/CANLF/A0A8I3PI07/A0A8I3PI07-uniprot.txt
  - genes/CANLF/A0A8I3PI07/A0A8I3PI07-goa.tsv
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0010960
      label: magnesium ion homeostasis
    predicted_term_type: GO_BP
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 16.39), an exact match to the GO_Central IBA annotation and to
        this review's core process. Correct and specific - it names magnesium rather than
        the generic cation transport that the IEA pipeline and ProtNLM2 both stopped at -
        but already annotated, so not novel.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0055071
      label: manganese ion homeostasis
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 2 (score 15.90), separated from the correct rank-1 call by only 0.5 score
        units. CNNM4 is characterised as a Mg2+ efflux transporter; manganese homeostasis is
        not a reported CNNM4 function and would not follow from the CBS-domain Mg-ATP
        sensing mechanism that regulates it. The prediction reflects the model's difficulty
        in discriminating which divalent cation a transporter handles, a distinction that
        matters for annotation and that the score ordering does not resolve.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0010961
      label: intracellular magnesium ion homeostasis
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Rank 3 (score 14.70), a strict descendant of the annotated magnesium ion homeostasis
        term and absent from GOA. CNNM4 extrudes Mg2+ across the basolateral membrane and so
        acts directly on the intracellular Mg2+ pool; the more specific term is correct and
        is a genuine refinement over the existing annotation. Scored COR as a correct novel
        call, on family/orthology inference rather than direct evidence in dog.
      supported_by:
        - reference_id: GO_REF:0000033
          supporting_text: Annotation inferences using phylogenetic trees
