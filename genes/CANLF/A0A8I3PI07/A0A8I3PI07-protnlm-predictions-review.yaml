id: A0A8I3PI07
gene_symbol: CNNM4
taxon:
  id: NCBITaxon:9615
  label: Canis lupus familiaris
status: COMPLETE
description: >-
  The CNNM4-family assignment supports membrane-associated ion transport. All three predictions are broader
  than existing localization or transport annotations.
source_documents:
  - genes/CANLF/A0A8I3PI07/A0A8I3PI07-uniprot.txt
  - genes/CANLF/A0A8I3PI07/A0A8I3PI07-goa.tsv
