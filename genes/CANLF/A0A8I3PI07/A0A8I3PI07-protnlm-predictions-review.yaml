    summary: CNNM4 mediates basolateral Mg2+ extrusion coupled to Na+ in mouse epithelia (PMID:24339795), and the
      dog target inherits this function through its CNNM4 subfamily placement (PTHR12064:SF26) and conserved transmembrane
      and CBS domain architecture. Monoatomic ion transport is not itself annotated, but the target already carries
      magnesium ion transport (GO:0015693), magnesium ion transmembrane transport and sodium ion transmembrane transport,
      which the gene review accepts; OLS4 confirms GO:0015693 is a descendant of GO:0006811 via metal ion and monoatomic
      cation transport. The prediction is correct but discards the established ion specificity, so it is less precise
