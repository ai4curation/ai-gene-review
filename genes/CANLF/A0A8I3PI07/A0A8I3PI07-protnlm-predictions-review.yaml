predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0005886
      label: plasma membrane
    predicted_term_type: GO_CC
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        The target is assigned to the CNNM4 subfamily and contains the CNNM transmembrane region and CBS
        domain. Mouse CNNM4 experiments show basolateral localization in transporting epithelia (PMID:24339795),
        supporting the conserved membrane localization inference for the canine protein. Plasma membrane
        is already annotated, and basolateral plasma membrane is an existing, more specific localization.
        The prediction is supported but less precise.
      supported_by:
        - reference_id: file:CANLF/A0A8I3PI07/A0A8I3PI07-uniprot.txt
        - reference_id: PMID:24339795
          supporting_text: >-
            CNNM4 localizes to the basolateral membrane
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0022857
      label: transmembrane transporter activity
    predicted_term_type: GO_MF
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        The CNNM4 subfamily and membrane-spanning architecture support ion transport rather than an arbitrary
        membrane role. Mouse CNNM4 expression and knockout experiments establish a role in magnesium extrusion
        and epithelial magnesium transport (PMID:24339795). The target already has curated IBA magnesium
        ion transmembrane transporter activity, which is more specific than the predicted generic transmembrane
        transporter activity. The broad prediction is supported without resolving the detailed transport
        mechanism.
      supported_by:
        - reference_id: file:CANLF/A0A8I3PI07/A0A8I3PI07-uniprot.txt
        - reference_id: PMID:24339795
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0006811
      label: monoatomic ion transport
    predicted_term_type: GO_BP
    review:
      assessment: LSP
      confidence_score: 2
      summary: >-
        CNNM4-dependent magnesium transport is supported by mouse epithelial experiments (PMID:24339795)
        and by the target CNNM4 subfamily and membrane architecture. The target has a curated IBA annotation
        for magnesium ion transport. Ion transport is a broader process that discards the established
        ion specificity. The prediction is therefore supported but less precise.
      supported_by:
        - reference_id: file:CANLF/A0A8I3PI07/A0A8I3PI07-uniprot.txt
        - reference_id: PMID:24339795
