    - &id002
      reference_id: PMID:24339795
      supporting_text: Functional analyses at the molecular and organismal levels revealed a common role for CNNM4
        in mediating transcellular Mg2+ transport by basolateral Mg2+ extrusion.
    - &id003
      reference_id: PMID:24339795
      supporting_text: In the absence of extracellular Na+, Mg2+ depletion did not induce Mg2+ extrusion (Phase
        3), but restoration of Na+ instantaneously caused Mg2+ extrusion (Phase 4).
    - reference_id: PMID:42497866
