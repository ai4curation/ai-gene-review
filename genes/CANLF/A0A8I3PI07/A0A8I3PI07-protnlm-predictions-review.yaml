  predicted_term:
    id: GO:0022857
    label: transmembrane transporter activity
  predicted_term_type: GO_MF
  review:
    assessment: LSP
    confidence_score: 2
    summary: 'The target belongs to the CNNM4 subfamily (PTHR12064:SF26) and carries the CNNM transmembrane and
      CBS domains. Mouse CNNM4 extrudes Mg2+ from cells in a Na+-dependent manner, mediating transcellular Mg2+
      transport (PMID:24339795), and structural work on human CNNM4 describes Mg2+/Na+ exchange (PMID:42497866);
      the dog protein is in the same subfamily, so the activity transfers by phylogenetic inference rather than
      direct observation. Generic transmembrane transporter activity is true but uninformative: the target already
      carries magnesium ion transmembrane transporter activity (GO:0015095, a descendant of GO:0022857 per OLS4)
      and sodium ion transmembrane transporter activity, and the gene review refines these to magnesium:sodium antiporter
      activity. The prediction is therefore less precise than existing supported annotations.'
    supported_by:
