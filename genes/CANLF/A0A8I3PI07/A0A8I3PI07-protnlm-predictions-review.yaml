description: ProtNLM2 emitted three GO predictions for dog CNNM4, all broad terms that are correct for a CNNM4-subfamily
  Mg2+/Na+ exchanger at the basolateral plasma membrane. Each is less specific than existing supported annotations
  (basolateral plasma membrane, magnesium ion transmembrane transporter activity, magnesium ion transport), so all
  three are LSP.
