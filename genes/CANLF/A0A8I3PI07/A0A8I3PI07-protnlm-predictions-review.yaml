    summary: The target is placed in the CNNM4 subfamily (PANTHER PTHR12064:SF26) and has a signal peptide, four
      predicted transmembrane helices within the CNNM transmembrane domain, and a cytoplasmic CBS domain, the architecture
      of a multi-pass plasma-membrane transporter. Mouse CNNM4 localizes to the basolateral membrane of intestinal
      epithelia and ameloblasts (PMID:24339795), and endogenous CNNM4 in Madin-Darby canine kidney cells is basolateral
      (PMID:25449265), which is direct evidence in the dog. Plasma membrane is already annotated to the target,
      and the more specific basolateral plasma membrane (GO:0016323, is_a descendant of GO:0005886 per OLS4) is
      an existing annotation that the gene review accepts. The prediction is correct but less specific than that
      supported annotation.
