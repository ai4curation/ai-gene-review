taxon:
  id: NCBITaxon:382
  label: Sinorhizobium meliloti
description: CheY2 is the principal motor-response regulator in Sinorhizobium meliloti chemotaxis. Phosphorylation
  by CheA activates its receiver domain and alters the motor-interacting surface. CheY2-P regulates the
  speed of the unidirectional flagellar motor rather than reversing its direction of rotation. Signal
  removal includes reverse phosphotransfer from CheY2-P to CheA and onward transfer to the CheY1 phosphate
  sink. CheT acts on CheY1-P rather than directly dephosphorylating CheY2-P.
