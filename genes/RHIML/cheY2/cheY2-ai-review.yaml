    id: GO:0006935
    label: chemotaxis
  evidence_type: IDA
  original_reference_id: PMID:9485379
  review:
    summary: The response regulator executes a signal-processing step in chemotaxis.
    action: NEW
    reason: PMID9485379 reconstructs transfer from CheY2-P through CheA to CheY1. CheY2 itself receives
      and retrotransfers phosphate, and its activated state controls flagellar speed (PMID15066432). Direction
      reversal from E. coli is not transferred. GO:0006935 describes chemically guided movement; it is
      not an ancestor/descendant of the existing phosphorelay BP. Same-role QuickGO comparison finds chemotaxis
      on E. coli CheY P0AE67 but not P. putida CheY Q88EW2, so there is no systematic exclusion; direct
      S. meliloti evidence supplies this claim. No target entry was found in the GO-CAM index.
    supported_by:
    - *id003
    - *id004
    - *id005
