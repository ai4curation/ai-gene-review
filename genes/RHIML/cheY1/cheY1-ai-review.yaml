  review:
    summary: Functional phosphorelay coupling is more informative than generic protein binding.
    action: MODIFY
    reason: The interaction studies place this receiver in the CheA phosphotransfer pathway. CheY1 binding
      to CheA is enhanced by CheS; the demonstrated sink role is its response-regulator activity, not
      direct CheY2-P phosphatase activity. Refine bare binding to GO:0000156; this does not dispute the
      physical interaction.
    supported_by:
    - *id001
    - &id002
      reference_id: PMID:22194454
      supporting_text: while a second response regulator, CheY1, serves as a sink for surplus phosphoryl
        groups from CheA-P.
    proposed_replacement_terms:
