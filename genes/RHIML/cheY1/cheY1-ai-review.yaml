id: Q52879
gene_symbol: cheY1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:382
  label: Sinorhizobium meliloti
description: CheY1 is a small cytoplasmic response regulator that serves as a phosphate sink in Sinorhizobium
  meliloti chemotaxis. It accepts phosphoryl groups from the histidine kinase CheA and hydrolyzes its
  phosphorylated state, draining phosphate transferred back to CheA by the motor regulator CheY2-P. CheS
  enhances CheY1 interaction with CheA, and CheT accelerates CheY1-P dephosphorylation. This sink helps
  terminate the signal controlling flagellar rotary speed; CheY1 is distinct from the principal motor-response
  regulator CheY2.
