      id: GO:0000156
      label: phosphorelay response regulator activity
- term: &id005
    id: GO:0006935
    label: chemotaxis
  evidence_type: IDA
  original_reference_id: PMID:9485379
  review:
    summary: The response regulator executes a signal-processing step in chemotaxis.
    action: NEW
    reason: PMID9485379 reconstructs transfer from CheY2-P through CheA to CheY1. CheY1 itself accepts
      and hydrolyzes the phosphoryl group, making the sink an active chemical step rather than a passive
      requirement or substrate of another process. GO:0006935 describes chemically guided movement; it
      is not an ancestor/descendant of the existing phosphorelay BP. Same-role QuickGO comparison finds
      chemotaxis on E. coli CheY P0AE67 but not P. putida CheY Q88EW2, so there is no systematic exclusion;
      direct S. meliloti evidence supplies this claim. No target entry was found in the GO-CAM index.
    supported_by:
    - *id001
    - *id002
    - *id003
