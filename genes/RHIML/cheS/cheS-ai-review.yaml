  evidence_type: IDA
  original_reference_id: PMID:22194454
  review:
    summary: CheS regulates the phosphate-sink signaling step of chemotaxis.
    action: NEW
    reason: CheS itself changes the functional CheA–CheY1 complex, increasing CheY1 binding and promoting
      CheY1-P decay; this is structural/regulatory participation supported by reconstitution, not a conclusion
      from deletion alone. The chemotaxis term is under taxis and chemical response, and no existing or
      proposed BP duplicates it. Same-role noncatalytic-complex comparators E. coli CheW P0A964 and P.
      putida CheW Q88EX0 both carry chemotaxis; their bridge mechanism is not transferred to CheS. The
      local GO-CAM index has no target entry.
