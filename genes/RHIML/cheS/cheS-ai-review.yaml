taxon:
  id: NCBITaxon:382
  label: Sinorhizobium meliloti
description: CheS is a 97-residue regulatory protein associated with the polar chemotaxis signaling complex
  of Sinorhizobium meliloti. It forms a complex with CheA that binds the phosphate-sink response regulator
  CheY1 more strongly and accelerates CheY1-P decay, promoting signal termination. Its recruitment to
  polar clusters depends on CheA. The physical basis of the change in CheY1 affinity remains unresolved;
  CheS has not been shown to catalyze phosphoprotein hydrolysis.
