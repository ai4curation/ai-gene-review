  title: Sinorhizobium meliloti CheA complexed with CheS exhibits enhanced binding to CheY1,
    resulting in accelerated CheY1 dephosphorylation.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary full text read at PMC3294773; cache is abstract-only. CheA-dependent
      localization, CheA binding and enhanced CheY1 affinity support regulator activity.
      Crosslinking did not establish CheS–CheY1 binding, with an isolated-protein refolding caveat.
      The study does not establish CheS as an enzyme. U13166.1 orf2 is the exact sequence of Q52878.
      Fig. 8 reports unchanged CheA autophosphorylation with CheS, excluding that assay as support
      for protein kinase regulator activity.
