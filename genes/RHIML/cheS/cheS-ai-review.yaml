  review:
    summary: CheS noncovalently regulates CheA–CheY1 coupling.
    action: MODIFY
    reason: >-
      CheS binds CheA and increases CheY1 affinity for the assembled complex (PMID22194454), establishing
      functional noncovalent regulation beyond bare binding. GO:0098772 is retained at the specificity
      supported by this result. GO:0019887 protein kinase regulator activity was considered, but the primary
      Fig. 8 autophosphorylation experiment finds no kinetic change with CheS; binding a kinase does not
      establish regulation of its kinase reaction. GO:0030234 enzyme regulator activity would require
      identifying a modulated catalytic activity: accelerated CheY1-P disappearance is observed, but its
      distinction among altered recruitment/phosphate flow and stimulated receiver hydrolysis is not resolved.
      Thus this descendant is not yet established by the affinity and decay assays. Neither direct CheS
      phosphatase chemistry nor direct two-partner adaptor binding is asserted.
    supported_by:
    - &id002
      reference_id: PMID:22194454
      supporting_text: In vitro binding, as well as coexpression and copurification studies, gave
        evidence of CheA/CheS complex formation.
    - &id001
      reference_id: PMID:22194454
      supporting_text: CheY1 binds ∼100-fold more strongly to CheA/CheS than to CheA.
    - &id003
      reference_id: file:RHIME/cheA/cheA-source-analysis/identity-summary.md
      supporting_text: Its CDS translations AAA86673.1 (CheY1, 121 aa), AAA86678.1 (CheY2, 129 aa),
        and AAA86672.1 (orf2, 97 aa) exactly match Q52879, Q52884, and Q52878, respectively.
    - reference_id: file:RHIML/cheS/cheS-notes.md
      supporting_text: No differences were observed between the kinetics of autophosphorylation of
        CheA in the absence and presence of CheS
