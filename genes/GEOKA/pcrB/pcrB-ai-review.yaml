  title: Functional assignment of an enzyme that catalyzes the synthesis of an archaea-type ether lipid
    in bacteria.
  findings:
  - statement: PcrB produces heptaprenylglyceryl phosphate in bacillales.
    supporting_text: produces heptaprenylglyceryl phosphate in bacillales.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract and target-specific curated experimental UniProt statements checked; full article
      was not available. Structural accession mapping independently verified. No downstream native-pathway
      claim is inferred.
- id: PMID:24684232
  title: A comprehensive analysis of the geranylgeranylglyceryl phosphate synthase enzyme family identifies
    novel members and reveals mechanisms of substrate specificity and quaternary structure organization.
  findings:
  - statement: Bacterial group II GGGPS enzymes are distinguished from group I HepGP synthases; target-specific
      experimental detail is in the reviewed record.
    supporting_text: the previously uncharacterized bacterial enzymes from group II have GGGPS activity
      like the archaeal enzymes and differ from the bacterial group I enzymes that are heptaprenylglyceryl
      phosphate synthases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full publisher text independently read on 2026-11-07; frozen local cache remains abstract-only.
      Figure2 assays comparative donor capacity in a B.subtilis delta-pcrB host, not native donor-species
      downstream pathways. Figure5 distinguishes fjGGGPS I90A from wild type; groupII Mg is modeled, not
      observed density.
- id: file:GEOKA/pcrB/pcrB-uniprot.txt
  title: Frozen reviewed UniProtKB Q5L3C1 record
  findings:
  - statement: Record establishes strain, locus, curated mechanistic family and target-specific structural
      linkage.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Experimental ECO0000269 statements distinguished from curated HAMAP inference. Gene
      labels, GO lines and ARBA text are not used as functional evidence.
- id: file:analysis/module_audits/bacterial_heptaprenylglyceryl_ether_lipid/comparative-members/identity-and-scope.md
  title: Comparative-member structural identity and reaction-scope audit
  findings:
  - statement: Official PDBe mappings separate the two bacterial PcrBs, bacterial C20 GGGPS, and archaeal
      structural comparator.
- id: file:analysis/module_audits/bacterial_heptaprenylglyceryl_ether_lipid/comparative-members/PMID24684232-fulltext-scope.md
  title: Primary full-text assay-host, mutant and structural scope check
  findings:
  - statement: Host-dependent donor tests and engineered mutant specificity must not be treated as native
      pathway completeness or wild-type C35 capability.
