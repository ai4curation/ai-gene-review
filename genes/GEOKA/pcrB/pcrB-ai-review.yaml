id: Q5L3C1
gene_symbol: pcrB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:235909
  label: Geobacillus kaustophilus HTA426
description: PcrB of Geobacillus kaustophilus HTA426 is a homodimeric heptaprenylglyceryl phosphate synthase.
  It forms an ether bond between the C35 heptaprenyl donor and the C3 hydroxyl of sn-glycerol-1-phosphate,
  producing heptaprenylglyceryl phosphate. Its TIM-barrel active site belongs to the group I GGGP/HepGP
  synthase family; geranylgeranyl diphosphate is a much weaker alternative donor. The downstream fate
  and physiological role of the lipid in this strain remain less defined than its enzymatic synthesis.
