knowledge_gaps:
- gap_statement: The downstream fate and physiological function of the PcrB ether-lipid product in Geobacillus
    kaustophilus HTA426 remain unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  boundary: The substrate-resolved ether-forming reaction is established; it does not establish subsequent
    acetylation, sugar loading, or participation in a complete native lipid-carrier bypass.
  resolution: Identify native lipid products and perturb downstream candidate genes, coupling lipidomics
    to rescue and envelope phenotypes.
  status: OPEN
suggested_questions:
- question: Which native enzymes act downstream of PcrB, and what physiological process depends on the
    resulting ether lipids?
