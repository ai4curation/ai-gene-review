references:
- id: file:GEOKA/pcrB/pcrB-hypotheses/kgap-pcrb-product-fate/openscientist.md
  title: OpenScientist reconstruction of the fate of the PcrB ether-lipid product from the HTA426 genome
  findings:
  - statement: >-
      The genome selects the lipoprotein N-acetylation route over the archaeal diether route, which
      fails at all three of its steps, and both downstream steps that have gene assignments anywhere
      have unambiguous single-copy orthologs here; but the dephosphorylation step has no assigned gene
      in any organism, and the genome encodes no source for the sn-glycerol-1-phosphate acceptor the
      enzyme is crystallised with.
    supporting_text: >-
      The genome **does** distinguish the two candidate routes. It **does not** identify the
      phosphatase, and it **does not** explain where the acceptor comes from.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Computed results only; the run's literature quotations were not independently re-verified.
      Verified locally against Q5L3C1: the record carries PDB 4NAE and 4NAF as cross-references, which
      confirms that the 2.0 Angstrom structure with sn-glycerol-1-phosphate bound is this protein and not
      a homolog, together with locus GK0274 and protein existence level 1. Not verified: the ortholog
      searches and their bit scores, the absence calls for the archaeal route and for AraM, the lipobox
      scan and proteome size, the operon survey across Bacillales, the 13-genome pcrB neighbourhood
      check, and the QuickGO annotation inventory for the downstream partners. The run corrects an
      expectation carried by the hypothesis this review sent, that the pcrB neighbourhood would be
      informative about product fate. No annotation action was changed; the GO:0046474 nuance it raises
      is recorded in the boundary because the run judges the term defensible.
