knowledge_gaps:
- gap_statement: The downstream fate and physiological function of the PcrB ether-lipid product in Geobacillus
    kaustophilus HTA426 remain unresolved.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  boundary: >-
    The substrate-resolved ether-forming reaction is established. Native downstream dephosphorylation,
    acetylation and use of the lipid in lipoprotein acetylation remain unresolved in this species. An
    OpenScientist run (kgap-pcrb-product-fate) shows the genome does select between the candidate
    routes, names the two downstream enzymes that have gene assignments anywhere, and leaves two holes
    it says the genome cannot fill. The selected route is dephosphorylation, then acetylation, then use
    as the acetyl donor for N-acetylation of lipoprotein alpha-amino termini. Both assigned steps have
    unambiguous single-copy orthologs in HTA426, GK3078 for the YvoF acetyltransferase and GK2189 for
    the lipoprotein N-acetyltransferase LhaT, formerly YpjA, each separated from its nearest competitor
    in the proteome by more than 200 bits, and the terminal step has a substrate pool, with the
    lipoprotein maturation machinery present as GK3081 for lgt and GK1145 for lspA and a lipobox scan
    finding 77 candidates, 2.2 per cent of the 3516-protein proteome. The competing archaeal reading, in
    which the product receives a second prenyl group and becomes a membrane diether lipid, fails at all
    three of its steps here: no digeranylgeranylglyceryl phosphate synthase, no CDP-archaeol synthase
    and no geranylgeranyl reductase, with best scores of 28.6, 30.9 and 53.4 bits against the 250 to 285
    bits of genuine orthologs in the same search. The processing genes also cluster as a conserved
    operon across Bacillales, so the pathway is retained as a unit rather than as chance orthologs. Two
    holes remain, and the run is explicit that they are not artefacts of its method. The
    dephosphorylation step has no assigned gene in any organism, the original work supposing only that
    some phosphatase acts non-specifically, so the genome offers candidates, led by GK3079 for PpaX, a
    HAD-family phosphatase that overlaps yvoF by 4 base pairs, but cannot choose among them. More
    sharply, the genome encodes no source for the sn-glycerol-1-phosphate acceptor: the only
    characterised bacterial glycerol-1-phosphate dehydrogenase, AraM, has no ortholog by three
    independent checks, and the corresponding KEGG orthology group is absent from all three Geobacillus
    genomes examined. That gap is sharpened rather than dissolved by the structure, because PDB 4NAE is
    this protein itself at 2.0 Angstrom with sn-glycerol-1-phosphate bound, and the local record carries
    both 4NAE and 4NAF as cross-references, so the enzyme demonstrably binds an acceptor whose supply
    route is not in the genome. In vivo flux through PcrB in this strain is therefore not established.
    The run also corrects an expectation the hypothesis carried: the gene neighbourhood of pcrB is
    uninformative about product fate, GK0274 sitting in a pcrB-pcrA-ligA arrangement that is invariant
    across 13 of 13 Bacillales genomes carrying pcrB and is a DNA replication and repair context, with
    no phosphatase, acetyltransferase or lipoprotein-processing gene adjacent; the informative
    clustering is one locus away, around yvoF. Nothing in this pathway has been measured in any
    Geobacillus, so the downstream assignment for this strain is orthology transfer from B. subtilis,
    and the 2025 paper assigning the terminal step reports that the immunological outcome is
    species-dependent among Bacillus, which makes the untested status of this genus a real gap rather
    than a formality. One annotation nuance is recorded without acting on it: the run judges GO:0046474
    chemically defensible for this product, since 3-heptaprenyl-sn-glycero-1-phosphate is a
    glycerophosphate derivative bearing an O-alkyl group, while noting that the term implies a
    membrane-phospholipid destination the product does not have, its destination being lipoprotein
    acetylation. It also notes that neither downstream partner carries any annotation from the 2025
    reassignment, so that pathway change has not propagated into GO anywhere.
  resolution: Identify native lipid products and perturb downstream candidate genes, coupling lipidomics
    to rescue and envelope phenotypes.
  status: NARROWING
  provenance:
  - reference_id: file:GEOKA/pcrB/pcrB-hypotheses/kgap-pcrb-product-fate/openscientist.md
    supporting_text: >-
      The genome therefore distinguishes the two candidate routes and selects the lipoprotein route.
  - reference_id: file:GEOKA/pcrB/pcrB-hypotheses/kgap-pcrb-product-fate/openscientist.md
    supporting_text: >-
      The substrate-supply gap is therefore real and sharpened, not dissolved.
suggested_questions:
- question: Which native enzymes act downstream of PcrB, and what physiological process depends on the
    resulting ether lipids?
