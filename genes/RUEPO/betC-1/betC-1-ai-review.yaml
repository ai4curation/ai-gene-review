core_functions:
- description: Hydrolyzes choline-O-sulfate to choline and inorganic sulfate, enabling the first
    catabolic step in DSS-3 COS utilization; native genetic and choline-sulfatase family evidence
    establish the assignment, rather than a purified target-enzyme assay.
