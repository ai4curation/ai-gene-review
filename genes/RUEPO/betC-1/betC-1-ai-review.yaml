proposed_new_terms:
- proposed_name: choline-O-sulfate catabolic process
  proposed_definition: The chemical reactions and pathways resulting in the breakdown of
    choline-O-sulfate (choline sulfate), including hydrolysis of its sulfate ester bond to choline
    and inorganic sulfate.
  justification: No exact GO process term was recovered for COS breakdown. Choline catabolic process
    would instead describe consumption of choline, which BetC produces. BetC performs the hydrolytic
    chemistry itself; the enzyme-family assignment and selective native phenotype support
    participation, not just necessity for an unspecified outcome. The proposed
    sulfur-compound-catabolism parent matches the substrate chemistry. Same-role comparators
    S.meliloti O69787 and P.putida Q88RQ2 carry the specific enzyme activity but lack a specific
    COS-breakdown BP; O69787 carries choline biosynthesis, whereas Q88RQ2 does not, so this is an
    ontology-gap proposal rather than an assumed curator omission. No redundant existing broad BP or
    positive NEW BP is added. No target GO-CAM entry was found.
  proposed_parent:
    id: GO:0044273
    label: sulfur compound catabolic process
  supported_by:
  - *id001
  - *id002
  - *id003
suggested_questions:
- question: Where does BetC-1 hydrolyze COS in DSS-3, and which transporter supplies substrate to
    that compartment?
- question: What physiological role, if any, does the second BetC-like protein SPO2214 play under
    conditions where SPO1083 is required?
suggested_experiments:
- description: Purify Q5LUH1 and measure COS-dependent choline and sulfate production, then
    determine subcellular localization of functional tagged BetC-1 in DSS-3.
