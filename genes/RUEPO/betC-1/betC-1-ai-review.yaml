  label: Ruegeria pomeroyi DSS-3
description: BetC-1 is the choline sulfatase encoded by SPO1083 in Ruegeria pomeroyi DSS-3. It
  hydrolyzes the sulfate ester of choline-O-sulfate to release choline and inorganic sulfate,
  providing the initial step for utilization of this compound as a nutrient. The gene lies in the
  BetI1-regulated betI1-betC operon. Disruption of betC-1 blocks growth on choline-O-sulfate while
  preserving growth on choline and glycine betaine. It is distinct from the separate BetC-like
  protein encoded by SPO2214.
