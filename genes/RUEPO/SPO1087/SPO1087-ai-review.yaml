  label: Ruegeria pomeroyi DSS-3
description: SPO1087 (BetT) is a predicted multipass membrane transporter of Ruegeria pomeroyi
  DSS-3, assigned to the BCCT transporter family in the literature. It is co-transcribed with the
  choline dehydrogenase gene betA under BetI2-dependent control. Insertional disruption reduces
  choline depletion from culture medium and growth on choline, but possible effects on downstream
  betA leave the transported substrate unresolved. A smaller growth defect on choline-O-sulfate does
  not establish direct transport of that compound. The complete 400-residue protein matches the
  experimentally targeted locus; ion coupling and substrate range remain unknown.
aliases:
