references:
- id: PMID:26058574
  title: Comparative genomics and mutagenesis analyses of choline metabolism in the marine
    Roseobacter clade.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and official supplement TableS1 read. Locus identity is established by
      twelve mapped mutant primers and exact official protein/UniProt sequence matches. BetC
      phenotype is selective for COS utilization. BetT has an 84% growth-coupled choline depletion
      reduction and 38% COS growth-rate reduction; COS concentration was not assayed. This is native
      genetics/physiology, not purified-enzyme catalysis or reconstituted uptake.
- id: PMID:40801533
  title: Novel regulatory mechanism of choline-O-sulfate and choline catabolism by two BetIs in
    Alphaproteobacteria.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text maps betC to SPO1083 and betT-betA to SPO1087-1088. Experiments resolve
      BetI-dependent transcriptional regulation. Figure1 calls BetT a choline/COS transporter, but
      regulation and a pathway diagram do not provide a new direct COS transport assay. The diagram
      label is therefore not used to assign COS cargo.
