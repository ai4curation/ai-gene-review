existing_annotations:
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IC
  original_reference_id: PMID:26058574
  review:
    summary: Multipass membrane architecture supports a plasma-membrane transporter location
      independently of cargo.
    action: NEW
    reason: Eleven predicted transmembrane helices and the BCCT/COG1292 transporter-family
      assignment support a bacterial plasma-membrane permease. This is an anatomical inference from
      the target architecture and family, not a localization experiment or proof of choline/COS
      transport. Unresolved cargo does not erase the independent membrane evidence. No periplasmic
      binding-protein or ATPase subunit is claimed, and no redundant generic membrane annotation is
      added.
