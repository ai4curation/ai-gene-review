suggested_questions:
- question: Does BetT itself transport intact COS, or does its COS-growth phenotype arise indirectly or
    through altered expression of co-transcribed betA?
- question: Which ion or electrochemical gradient drives BetT-dependent choline uptake in DSS-3?
suggested_experiments:
- description: Measure initial-rate labeled choline and intact COS uptake in a clean nonpolar betT deletion,
    a complemented strain and a heterologous or reconstituted system; monitor betA expression and test
    sodium/proton-gradient dependence separately.
