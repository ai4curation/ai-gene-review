taxon:
  id: NCBITaxon:246200
  label: Ruegeria pomeroyi DSS-3
description: BetT, encoded by SPO1087, is a multipass membrane protein involved in choline uptake for
  nutrient utilization by Ruegeria pomeroyi DSS-3. It is co-transcribed with the choline dehydrogenase
  gene betA under BetI2-dependent control. Disruption of betT greatly reduces choline depletion from culture
  medium and slows growth on choline. The mutant also grows more slowly on choline-O-sulfate, but this
  physiological effect does not establish that choline-O-sulfate is a directly transported substrate.
  The transported-ion coupling mechanism and complete cargo range remain unresolved.
aliases:
- betT
existing_annotations:
- term: &id003
    id: GO:0015220
    label: choline transmembrane transporter activity
  evidence_type: IMP
  original_reference_id: PMID:26058574
  review:
    summary: Native genetics supports a choline-transporter function for SPO1087.
    action: NEW
    reason: The explicitly mapped betT disruption reduces culture-medium choline depletion by 84% and reduces
      growth on choline. The complete target sequence matches the assayed-strain locus and has a multipass
      membrane architecture. The published interpretation is choline transport; evidence is IMP because
      the measurement follows depletion during mutant growth, not purified or reconstituted transport.
      The co-transcribed betA and insertion design leave potential downstream effects unresolved, so no
      intrinsic rate or ion specificity is inferred. Same-role E.coli BetT P0ABC9 carries GO:0015220,
      but its cargo/ion profile is not transferred. GO:0015220 already has a part_of path to choline transport,
      so a redundant NEW transport BP is not added. The 38% COS growth-rate reduction and 2025 figure label
      do not establish COS cargo, and retained COS growth does not justify a NOT annotation.
    supported_by:
    - &id001
      reference_id: PMID:26058574
      supporting_text: Consequentially, the rate of choline depletion was also severely reduced (84%)
        compared with that of the wild‐type
    - &id005
      reference_id: PMID:40801533
      supporting_text: betI1 was shown to be co-transcribed with betC (SPO1083), while betI2 was divergently
        transcribed from the co-transcribed betT-betA (SPO1087-1088) operon
    - &id006
      reference_id: file:RUEPO/betC-1/betC-1-source-analysis/identity-and-assay-scope.md
      supporting_text: The official AAV94383.1 and AAV94387.1 protein records translate those loci and
        exactly match the complete frozen UniProt sequences.
    - &id002
      reference_id: file:RUEPO/SPO1087/SPO1087-uniprot.txt
      supporting_text: TRANSMEM        6..25
    - reference_id: PMID:26058574
      supporting_text: All amines and ammonium, apart from COS, were quantified using a cation‐exchange
        ion chromatograph
- term: &id004
    id: GO:0005886
    label: plasma membrane
  evidence_type: IC
  original_reference_id: PMID:26058574
  review:
    summary: Choline uptake is assigned to the cytoplasmic membrane.
    action: NEW
    reason: The native uptake role together with eleven predicted transmembrane helices supports a bacterial
      plasma-membrane permease. This is an anatomical inference, not a localization experiment. No periplasmic
      binding-protein or ATPase subunit is claimed. The gene has no existing CC row, and no redundant
      generic membrane annotation is proposed. Same-role E.coli BetT P0ABC9 carries plasma membrane, but
      the target location is inferred from its own architecture and uptake role.
    supported_by:
    - *id001
    - *id002
    - reference_id: file:RUEPO/betC-1/betC-1-source-analysis/identity-and-assay-scope.md
      supporting_text: The protein has 11 predicted transmembrane helices in the frozen record.
references:
- id: PMID:26058574
  title: Comparative genomics and mutagenesis analyses of choline metabolism in the marine Roseobacter
    clade.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and official supplement TableS1 read. Locus identity is established by twelve
      mapped mutant primers and exact official protein/UniProt sequence matches. BetC phenotype is selective
      for COS utilization. BetT has an 84% growth-coupled choline depletion reduction and 38% COS growth-rate
      reduction; COS concentration was not assayed. This is native genetics/physiology, not purified-enzyme
      catalysis or reconstituted uptake.
- id: PMID:40801533
  title: Novel regulatory mechanism of choline-O-sulfate and choline catabolism by two BetIs in Alphaproteobacteria.
  findings: []
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text maps betC to SPO1083 and betT-betA to SPO1087-1088. Experiments resolve BetI-dependent
      transcriptional regulation. Figure1 calls BetT a choline/COS transporter, but regulation and a pathway
      diagram do not provide a new direct COS transport assay. The diagram label is therefore not used
      to assign COS cargo.
