suggested_questions:
- question: Does SPO1087 directly transport choline, COS or another BCCT-family substrate, and how
    much of the insertion-mutant phenotype results from altered downstream betA expression?
- question: Which ion or electrochemical gradient drives BetT-dependent choline uptake in DSS-3?
suggested_experiments:
- description: Measure initial-rate labeled choline and intact COS uptake in a clean nonpolar betT
    deletion, a complemented strain and a heterologous or reconstituted system; monitor betA
    expression and test sodium/proton-gradient dependence separately.
