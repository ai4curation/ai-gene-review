  review:
    summary: Native genetics supports a choline-transporter function for SPO1087.
    action: NEW
    reason: The explicitly mapped betT disruption reduces culture-medium choline depletion by 84% and
      reduces growth on choline. The complete target sequence matches the assayed-strain locus and has
      a multipass membrane architecture. The published interpretation is choline transport; evidence is
      IMP because the measurement follows depletion during mutant growth, not purified or reconstituted
      transport. The co-transcribed betA and insertion design leave potential downstream effects unresolved,
      so no intrinsic rate or ion specificity is inferred. Same-role E.coli BetT P0ABC9 carries GO:0015220,
      but its cargo/ion profile is not transferred. GO:0015220 already has a part_of path to choline transport,
      so a redundant NEW transport BP is not added. The 38% COS growth-rate reduction and 2025 figure
      label do not establish COS cargo, and retained COS growth does not justify a NOT annotation.
    supported_by:
    - reference_id: PMID:26058574
      supporting_text: Consequentially, the rate of choline depletion was also severely reduced (84%)
        compared with that of the wild‐type
    - reference_id: PMID:40801533
      supporting_text: betI1 was shown to be co-transcribed with betC (SPO1083), while betI2 was divergently
        transcribed from the co-transcribed betT-betA (SPO1087-1088) operon
    - reference_id: file:RUEPO/betC-1/betC-1-source-analysis/identity-and-assay-scope.md
      supporting_text: The official AAV94383.1 and AAV94387.1 protein records translate those loci and
        exactly match the complete frozen UniProt sequences.
    - reference_id: file:RUEPO/SPO1087/SPO1087-uniprot.txt
      supporting_text: TRANSMEM        6..25
    - reference_id: PMID:26058574
      supporting_text: All amines and ammonium, apart from COS, were quantified using a cation‐exchange
        ion chromatograph
