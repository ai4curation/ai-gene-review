  label: Neisseria meningitidis
description: 'AcrIIC2 is a Neisseria meningitidis anti-CRISPR protein that homodimerizes and binds the
  positively charged bridge helix of susceptible Cas9 proteins. Its electronegative interface prevents
  guide-RNA loading and thereby blocks assembly of an active Cas9 ribonucleoprotein. Activity depends
  on order of addition: preformed guide-loaded Cas9 resists inhibition in the tested Nme1Cas9 assays.
  Several Cas9 orthologues are susceptible with different efficiencies; inhibition is not universal across
  Cas9 systems.'
