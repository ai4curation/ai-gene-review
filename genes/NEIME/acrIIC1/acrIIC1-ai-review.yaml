id: A0A2D0TCG3
gene_symbol: acrIIC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:487
  label: Neisseria meningitidis
description: AcrIIC1 is an 86-residue protein encoded by a prophage resident in the
  Neisseria meningitidis genome that disables the host type II-C CRISPR-Cas9 system,
  and it does so by a route distinct from the common anti-CRISPR strategy of blocking
  target recognition. Rather than preventing Cas9 from finding DNA, AcrIIC1 binds the
  active-site interface of the HNH catalytic domain through ionic and hydrogen-bonding
  contacts and leaves guide loading and target DNA binding entirely intact. Because
  HNH activation is the prerequisite for activating the second nuclease domain, RuvC,
  occluding HNH abolishes cleavage of both DNA strands, and the result is a Cas9 molecule
  trapped on its target in a catalytically dead state, functionally equivalent to the
  dead-Cas9 variants made by active-site mutation. The occluded surface is the most
  conserved region of Cas9, which is why inhibition generalises robustly across Cas9
  orthologues from different species rather than being confined to the enzyme of the
  resident host. The protein interconverts between an active monomer and an inactive
  disulphide-linked dimer through a pair of conserved cysteines, making its inhibitory
  activity sensitive to the redox state of its surroundings.
existing_annotations:
- term:
    id: GO:0098672
    label: symbiont-mediated suppression of host CRISPR-cas system
  evidence_type: IDA
  original_reference_id: PMID:27984730
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: AcrIIC1 was identified as a member of one of three anti-CRISPR families
      that specifically inhibit the Neisseria meningitidis CRISPR-Cas9 system, and
      shown to bind NmeCas9 directly. GO:0098672 is the correct and maximally specific
      process term, and the accession is the sequence used in the structural work
      on this mechanism, since PDB 5VGB chain B spans residues 1 to 86 of this entry
      and its primary citation is the follow-up mechanism paper.
    action: ACCEPT
    reason: The term is right and the experimental grounding is on this sequence,
      so the annotation is accepted as the core process. One caveat is recorded rather
      than acted on. The GOA qualifier acts_upstream_of_or_within_positive_effect
      is not the best-supported choice, because AcrIIC1 does not act upstream of the
      suppression process; its binding to the Cas9 HNH domain is the executing step
      of that process, so involved_in is better supported. The positive_effect component
      also reads, to anyone skimming the GAF, as though AcrIIC1 up-regulated something,
      which inverts the sense. The same qualifier appears on the AcrIIA4 row in genes/LISMN/acrIIA4,
      also from CACAO, so this looks like a systematic choice in that annotation set
      rather than a one-off. Changing a qualifier is not a term change, so the action
      stays ACCEPT and the qualifier is flagged here for the assigning group rather
      than being rewritten.
    supported_by:
    - reference_id: PMID:27984730
      supporting_text: Here, we report the discovery of three distinct families of
        anti-CRISPRs that specifically inhibit the CRISPR-Cas9 system of Neisseria
        meningitidis.
    - reference_id: PMID:27984730
      supporting_text: We show that these proteins bind directly to N. meningitidis
        Cas9 (NmeCas9) and can be used as potent inhibitors of genome editing by this
        system in human cells.
- term:
    id: GO:0140721
    label: nuclease inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:28844692
  qualifier: enables
  review:
    summary: AcrIIC1 binds the HNH nuclease domain of Cas9 at its active-site interface
      and abolishes target-strand cleavage while leaving guide loading and target
      DNA binding intact. Domain-swap chimeras between an AcrIIC1-binding and a non-binding
      Cas9 orthologue localise the interaction to HNH, the 1.50 Angstrom crystal structure
      shows the contacts at the active site, and the functional outcome is a DNA-bound
      but catalytically inactive Cas9.
    action: NEW
    reason: GOA holds no molecular function for A0A2D0TCG3. GO:0140721 is defined
      as binding to and modulating the activity of a nuclease, which is literally
      and exactly what AcrIIC1 does, so it is asserted here. modules/anti_crispr_suppression.yaml
      previously asserted no identifier for this annoton on the grounds that no term
      captures occlusion of a single catalytic domain within a multidomain nuclease.
      That is true of the specificity but was not a reason to assert nothing, and the
      module now asserts GO:0140721 and records only the domain-level specificity as
      the residual gap. GO practice
      is to annotate the nearest correct existing term and request the specific one,
      and asserting nothing leaves a structurally well-characterised inhibitor with
      no molecular function at all, which is strictly less informative than a correct
      but general term. What GO:0140721 loses is recorded as an ontology knowledge
      gap. GO:0043021 ribonucleoprotein complex binding is deliberately not asserted
      here, unlike for AcrIIA4, AcrIIA2 and AcrF8, because AcrIIC1 binds the isolated
      HNH domain in solution and the crystal structure is of that free domain rather
      than of a guide-loaded complex, so guide dependence is not established and is
      in fact contraindicated.
    supported_by:
    - reference_id: PMID:28844692
      supporting_text: These results indicated that the HNH domain is the primary
        site of interaction for AcrIIC1.
    - reference_id: PMID:28844692
      supporting_text: AcrIIC1 binds to the active site interface of the HNH domain
        through several ionic and hydrogen-bonding interactions.
    - reference_id: PMID:28844692
      supporting_text: These results suggested that AcrIIC1 traps Cas9 in its DNA-bound
        state, while inhibiting DNA cleavage.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IC
  original_reference_id: PMID:27984730
  review:
    summary: AcrIIC1 is translated from a prophage integrated in the Neisseria meningitidis
      chromosome and acts on the host's own Cas9, a cytoplasmic enzyme. Inhibition
      of NmeCas9 is demonstrated in cells, so the protein must act in the cytoplasm;
      all four deposited structures were determined in vitro, so the location is inferred
      rather than measured.
    action: NEW
    reason: GO:0030430 host cell cytoplasm, used for the phage-taxon inhibitors AcrF8,
      gp30 and AcrF3, is not appropriate here. This UniProt entry is assigned to Neisseria
      meningitidis itself, not to a phage, because the gene lies in a resident prophage,
      so under that taxon assignment the cell whose cytoplasm the protein occupies
      is its own and not a separate host. GO:0005737 is the correct component term
      for that situation, and the same reasoning was applied to the prophage-encoded
      AcrIIA4 in genes/LISMN/acrIIA4. IC rather than IDA because localization was
      inferred, not measured.
    supported_by:
    - reference_id: PMID:27984730
      supporting_text: We show that these proteins bind directly to N. meningitidis
        Cas9 (NmeCas9) and can be used as potent inhibitors of genome editing by this
        system in human cells.
    - reference_id: PMID:27984730
      supporting_text: Here, we report the discovery of three distinct families of
        anti-CRISPRs that specifically inhibit the CRISPR-Cas9 system of Neisseria
        meningitidis.
