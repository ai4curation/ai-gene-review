knowledge_gaps:
- gap_statement: Whether the AcrIIC1 redox switch operates in the native Neisseria meningitidis cytoplasm
    is undetermined; the switch was characterised with reference to eukaryotic cellular environments and
    gene-editing applications.
  boundary: That a pair of conserved cysteines forms an inactive disulphide-linked dimer, and that the
    monomer is the active species, are established structurally and biochemically. What is unknown is
    whether the native intracellular redox potential ever moves across the switch point.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: If the switch is physiological, AcrIIC1 is a conditional inhibitor and the prophage can
    withhold counter-defence under some conditions, which would be a regulatory layer distinct from the
    transcriptional Aca switch that governs other acr loci. If it is an artefact of the oxidising extracellular
    or eukaryotic environments used to study it, the native protein is simply constitutively active and
    the cysteines are doing something else.
  resolution: Measure the AcrIIC1 monomer-to-dimer ratio in Neisseria meningitidis lysates prepared under
    strictly anaerobic and thiol-trapping conditions, across growth states, and test whether cysteine-free
    variants alter prophage retention in a cas9-competent host.
  provenance:
  - reference_id: PMID:36400778
    supporting_text: we report the discovery of a redox switch for NmeAcrIIC1, which regulates NmeAcrIIC1's
      monomer-dimer interconversion and inhibitory activity on Cas9.
suggested_questions:
- question: Does an AcrIIC1-trapped Cas9, which stays bound to its target but cannot cut, repress transcription
    at that locus in Neisseria, as the AcrF3-inhibited type I-F system was shown to do in Pseudomonas?
    If so, the inhibitor does not merely neutralise immunity but repurposes it.
  experts:
  - Lucas B. Harrington
  - Jennifer A. Doudna
  - Erik J. Sontheimer
- question: Is there a GO mechanism, perhaps an annotation extension on GO:0140721 naming the occluded
    domain, that could record single-domain occlusion and the survival of the target's other activities
    without creating a molecular-function class about protein architecture?
- question: Does the AcrIIC1 redox switch ever actually flip inside Neisseria meningitidis, or is the
    inactive disulphide dimer an artefact of the oxidising conditions in which the switch was characterised?
  experts:
  - Yanli Wang
suggested_experiments:
- hypothesis: An AcrIIC1-trapped Cas9 acts as a sequence-specific transcriptional repressor at its target
    locus in the native host.
  description: In Neisseria meningitidis, retarget NmeCas9 with a guide against a reporter promoter in
    strains with and without induced AcrIIC1, and in a cas9 deletion, then measure reporter transcript
    by RT-qPCR and Cas9 occupancy by ChIP. The prediction specific to this mechanism is repression with
    occupancy retained, in contrast to a DNA mimic such as AcrIIA4, which should abolish both. Running
    both inhibitors side by side makes the comparison a direct test of the mechanism assignment rather
    than of AcrIIC1 alone.
  experiment_type: paired ChIP and transcript quantification with two inhibitor classes
- hypothesis: The redox switch is physiological, so the native cytoplasmic pool of AcrIIC1 contains a
    measurable fraction of inactive disulphide dimer that shifts with growth conditions.
  description: Lyse Neisseria meningitidis under strictly anaerobic conditions with immediate thiol trapping
    by N-ethylmaleimide, then resolve AcrIIC1 monomer and dimer by non-reducing SDS-PAGE and immunoblot
    across aerobic, microaerobic and oxidative-stress growth. A constant, near-complete monomer fraction
    would argue the switch does not operate natively and that the cysteines are conserved for another
    reason.
  experiment_type: redox-state trapping and non-reducing immunoblot
- hypothesis: AcrIIC1 binding to HNH is sufficient for inhibition, so an isolated HNH-binding fragment
    would inhibit full-length Cas9 as well as the intact protein does.
  description: Map the minimal AcrIIC1 region that retains HNH affinity by isothermal titration calorimetry
    against the purified NmeCas9 HNH domain, then test each fragment for inhibition of full-length NmeCas9
    plasmid cleavage. Divergence between affinity for the isolated domain and inhibition of the intact
    enzyme would indicate a second contact outside HNH, which neither the chimera experiments nor the
    HNH-only crystal structure could have detected.
  experiment_type: fragment mapping with paired affinity and inhibition readouts
