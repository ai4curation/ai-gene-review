gene_symbol: acrIIC1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:487
  label: Neisseria meningitidis
description: AcrIIC1 is an 86-residue anti-CRISPR protein identified in a Neisseria meningitidis mobile-element
  context. It binds the active-site interface of the Cas9 HNH domain and inhibits DNA cleavage while preserving
  target-DNA binding. Inhibition extends to several tested Cas9 orthologues because the targeted HNH surface
  is conserved, but is not established for every Cas9. Disulfide-linked dimerization regulates activity
  in biochemical and gene-editing experiments; the physiological importance of this redox dependence in
  native Neisseria remains unresolved.
existing_annotations:
- term:
    id: GO:0098672
    label: symbiont-mediated suppression of host CRISPR-cas system
  evidence_type: IDA
  original_reference_id: PMID:27984730
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: AcrIIC1 was identified as a member of one of three anti-CRISPR families that specifically
      inhibit the Neisseria meningitidis CRISPR-Cas9 system, and shown to bind NmeCas9 directly. GO:0098672
      is the correct and maximally specific process term, and the accession is the sequence used in the
      structural work on this mechanism, since PDB 5VGB chain B spans residues 1 to 86 of this entry and
      its primary citation is the follow-up mechanism paper.
    action: ACCEPT
    reason: The characterized protein directly inhibits Cas9-mediated interference, supporting the existing
      process annotation. The biochemical mechanism is HNH-domain engagement, not a change to the annotation
      relationship.
    supported_by:
    - reference_id: PMID:27984730
      supporting_text: Here, we report the discovery of three distinct families of anti-CRISPRs that specifically
        inhibit the CRISPR-Cas9 system of Neisseria meningitidis.
    - reference_id: PMID:27984730
      supporting_text: We show that these proteins bind directly to N. meningitidis Cas9 (NmeCas9) and
        can be used as potent inhibitors of genome editing by this system in human cells.
- term:
    id: GO:0140721
    label: nuclease inhibitor activity
  evidence_type: IDA
  original_reference_id: PMID:28844692
  qualifier: enables
  review:
    summary: AcrIIC1 binds the HNH nuclease domain of Cas9 at its active-site interface and abolishes
      target-strand cleavage while leaving guide loading and target DNA binding intact. Domain-swap chimeras
      between an AcrIIC1-binding and a non-binding Cas9 orthologue localise the interaction to HNH, the
      1.50 Angstrom crystal structure shows the contacts at the active site, and the functional outcome
      is a DNA-bound but catalytically inactive Cas9.
    action: NEW
    reason: Direct HNH-domain binding and inhibition of DNA cleavage support nuclease inhibitor activity.
      This broad molecular function is appropriate even though it does not encode the retained DNA-binding
      activity of the target. Binding to the isolated HNH domain does not establish a requirement for
      preassembled Cas9-guide ribonucleoprotein.
    supported_by:
    - reference_id: PMID:28844692
      supporting_text: These results indicated that the HNH domain is the primary site of interaction
        for AcrIIC1.
    - reference_id: PMID:28844692
      supporting_text: AcrIIC1 binds to the active site interface of the HNH domain through several ionic
        and hydrogen-bonding interactions.
    - reference_id: PMID:28844692
      supporting_text: These results suggested that AcrIIC1 traps Cas9 in its DNA-bound state, while inhibiting
        DNA cleavage.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IC
  original_reference_id: PMID:27984730
  review:
    summary: AcrIIC1 is translated from a prophage integrated in the Neisseria meningitidis chromosome
      and acts on the host's own Cas9, a cytoplasmic enzyme. Inhibition of NmeCas9 is demonstrated in
      cells, so the protein must act in the cytoplasm; all four deposited structures were determined in
      vitro, so the location is inferred rather than measured.
    action: NEW
    reason: GO:0030430 host cell cytoplasm, used for the phage-taxon inhibitors AcrF8, gp30 and AcrF3,
      is not appropriate here. This UniProt entry is assigned to Neisseria meningitidis itself, not to
      a phage, because the gene lies in a resident prophage, so under that taxon assignment the cell whose
      cytoplasm the protein occupies is its own and not a separate host. GO:0005737 is the correct component
      term for that situation, and the same reasoning was applied to the prophage-encoded AcrIIA4 in genes/LISMN/acrIIA4.
      IC rather than IDA because localization was inferred, not measured.
    supported_by:
    - reference_id: PMID:27984730
      supporting_text: We show that these proteins bind directly to N. meningitidis Cas9 (NmeCas9) and
        can be used as potent inhibitors of genome editing by this system in human cells.
    - reference_id: PMID:27984730
      supporting_text: Here, we report the discovery of three distinct families of anti-CRISPRs that specifically
        inhibit the CRISPR-Cas9 system of Neisseria meningitidis.
