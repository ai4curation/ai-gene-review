knowledge_gaps:
- gap_statement: GO can state that AcrIIC1 inhibits a nuclease but cannot state that
    it occludes one catalytic domain of a multidomain nuclease while the enzyme's
    other activities, including DNA binding, survive. The diagnostic feature of the
    mechanism is exactly the part the ontology cannot hold.
  boundary: GO:0140721 nuclease inhibitor activity is asserted on this entry and is
    correct, and GO:0098672 fits the process exactly. What is lost is the distinction
    between this inhibitor and one that disables the whole enzyme, which is the distinction
    that predicts the trapped-DNA-bound-inactive phenotype.
  gap_kind:
  - ONTOLOGY
  status: OPEN
  significance: The residual activity is not a detail. A Cas9 trapped on target but
    unable to cut is a sequence-specific DNA-binding module, with consequences for
    host transcription that a fully inhibited Cas9 would not have, and the equivalent
    was observed in vivo for the type I-F system inhibited by the Cas3-sequestering
    AcrF3. Flattening both to nuclease inhibitor activity makes two mechanistically
    and phenotypically different outcomes indistinguishable.
  resolution: No new class is proposed here, because a term for occlusion of one catalytic
    domain within a multidomain enzyme would describe protein architecture rather
    than an activity, which is not what GO molecular-function terms are for. The better
    request is probably an annotation extension on GO:0140721 naming the occluded
    domain, together with a way to record that the target retains its other activities.
    That is a question for ontology editors about mechanism rather than a new class
    request, and is raised as such in suggested_questions.
  provenance:
  - reference_id: PMID:28844692
    supporting_text: The ability of AcrIIC1 to inhibit multiple Cas9 orthologs without
      preventing DNA binding suggested that it targets a conserved region of Cas9
      involved in DNA cleavage.
- gap_statement: Whether the AcrIIC1 redox switch operates in the native Neisseria
    meningitidis cytoplasm is undetermined; the switch was characterised with reference
    to eukaryotic cellular environments and gene-editing applications.
  boundary: That a pair of conserved cysteines forms an inactive disulphide-linked
    dimer, and that the monomer is the active species, are established structurally
    and biochemically. What is unknown is whether the native intracellular redox potential
    ever moves across the switch point.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: If the switch is physiological, AcrIIC1 is a conditional inhibitor
    and the prophage can withhold counter-defence under some conditions, which would
    be a regulatory layer distinct from the transcriptional Aca switch that governs
    other acr loci. If it is an artefact of the oxidising extracellular or eukaryotic
    environments used to study it, the native protein is simply constitutively active
    and the cysteines are doing something else.
  resolution: Measure the AcrIIC1 monomer-to-dimer ratio in Neisseria meningitidis
    lysates prepared under strictly anaerobic and thiol-trapping conditions, across
    growth states, and test whether cysteine-free variants alter prophage retention
    in a cas9-competent host.
  provenance:
  - reference_id: PMID:36400778
    supporting_text: we report the discovery of a redox switch for NmeAcrIIC1, which
      regulates NmeAcrIIC1's monomer-dimer interconversion and inhibitory activity
      on Cas9.
- gap_statement: The protein is unreviewed in UniProt and named only "Anti-CRISPR
    protein", taken from a PDB deposition rather than asserted by a curator, despite
    four deposited structures of this sequence and a mechanism published in Cell.
  boundary: The mechanism is not in doubt. What is missing is a curated record of
    it on the accession, including the FUNCTION line that would let the keyword-to-GO
    pipeline produce the process term rather than leaving GOA with a single CACAO
    row.
  gap_kind:
  - CURATION
  status: OPEN
  significance: This is one of the two accessions named explicitly in the curation
    gap recorded in modules/anti_crispr_suppression.yaml, which is why that module
    grounds the family in InterPro rather than in the member record. A reviewer who
    follows the accession reaches an entry that does not say what the protein does.
  resolution: Nominate A0A2D0TCG3 for Swiss-Prot review with a FUNCTION line citing
    PMID:27984730, PMID:28844692 and PMID:36400778, and the keywords that would map
    to GO:0098672.
  provenance:
  - reference_id: PMID:28844692
    supporting_text: These results indicated that the HNH domain is the primary site
      of interaction for AcrIIC1.
suggested_questions:
- question: Does an AcrIIC1-trapped Cas9, which stays bound to its target but cannot
    cut, repress transcription at that locus in Neisseria, as the AcrF3-inhibited
    type I-F system was shown to do in Pseudomonas? If so, the inhibitor does not
    merely neutralise immunity but repurposes it.
  experts:
  - Lucas B. Harrington
  - Jennifer A. Doudna
  - Erik J. Sontheimer
- question: Is there a GO mechanism, perhaps an annotation extension on GO:0140721
    naming the occluded domain, that could record single-domain occlusion and the
    survival of the target's other activities without creating a molecular-function
    class about protein architecture?
- question: Does the AcrIIC1 redox switch ever actually flip inside Neisseria meningitidis,
    or is the inactive disulphide dimer an artefact of the oxidising conditions in
    which the switch was characterised?
  experts:
  - Yanli Wang
suggested_experiments:
- hypothesis: An AcrIIC1-trapped Cas9 acts as a sequence-specific transcriptional
    repressor at its target locus in the native host.
  description: In Neisseria meningitidis, retarget NmeCas9 with a guide against a
    reporter promoter in strains with and without induced AcrIIC1, and in a cas9 deletion,
    then measure reporter transcript by RT-qPCR and Cas9 occupancy by ChIP. The prediction
    specific to this mechanism is repression with occupancy retained, in contrast
    to a DNA mimic such as AcrIIA4, which should abolish both. Running both inhibitors
    side by side makes the comparison a direct test of the mechanism assignment rather
    than of AcrIIC1 alone.
  experiment_type: paired ChIP and transcript quantification with two inhibitor classes
- hypothesis: The redox switch is physiological, so the native cytoplasmic pool of
    AcrIIC1 contains a measurable fraction of inactive disulphide dimer that shifts
    with growth conditions.
  description: Lyse Neisseria meningitidis under strictly anaerobic conditions with
    immediate thiol trapping by N-ethylmaleimide, then resolve AcrIIC1 monomer and
    dimer by non-reducing SDS-PAGE and immunoblot across aerobic, microaerobic and
    oxidative-stress growth. A constant, near-complete monomer fraction would argue
    the switch does not operate natively and that the cysteines are conserved for
    another reason.
  experiment_type: redox-state trapping and non-reducing immunoblot
- hypothesis: AcrIIC1 binding to HNH is sufficient for inhibition, so an isolated
    HNH-binding fragment would inhibit full-length Cas9 as well as the intact protein
    does.
  description: Map the minimal AcrIIC1 region that retains HNH affinity by isothermal
    titration calorimetry against the purified NmeCas9 HNH domain, then test each
    fragment for inhibition of full-length NmeCas9 plasmid cleavage. Divergence between
    affinity for the isolated domain and inhibition of the intact enzyme would indicate
    a second contact outside HNH, which neither the chimera experiments nor the HNH-only
    crystal structure could have detected.
  experiment_type: fragment mapping with paired affinity and inhibition readouts
