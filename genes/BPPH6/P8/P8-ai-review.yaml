suggested_questions:
- question: How does calcium ion chelation or interaction with the energized host cytoplasmic membrane trigger conformational
    disassembly of the P8 T=13 lattice during core penetration?
  experts: []
- question: Which specific hydrophobic loops or helices of P8 insert into the bacterial plasma membrane to drive endocytic-like
    invagination and uncoating of the polymerase core?
  experts: []
suggested_experiments:
- hypothesis: Specific surface-exposed alpha-helices of P8 undergo a conformational switch upon loss of bound Ca2+ and contact
    with negatively charged phosphatidylglycerol in the energized bacterial inner membrane, exposing amphipathic segments
    that destabilize the bilayer and release the P1/P2/P4/P7 core.
  description: Perform cryo-electron tomography and hydrogen-deuterium exchange mass spectrometry (HDX-MS) of purified phi6
    nucleocapsids incubated with energized Pseudomonas syringae inner membrane vesicles across a range of Ca2+ concentrations
    and membrane potentials to map P8 conformational transitions during core penetration.
  experiment_type: Cryo-electron tomography and HDX-MS membrane penetration assay
