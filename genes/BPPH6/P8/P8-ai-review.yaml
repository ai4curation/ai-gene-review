  label: Pseudomonas phage phi6
description: Major outer capsid protein P8 of the enveloped double-stranded RNA bacteriophage phi6 (Cystovirus phi6). P8 is
  a 149-residue protein encoded on the small (S) dsRNA genome segment that self-associates into 200 homotrimers (600 monomers)
  to form the interrupted T=13 icosahedral outer shell of the double-layered viral nucleocapsid around the inner T=2 polymerase
  core. During host entry, after the viral lipid envelope fuses with the Pseudomonas syringae outer membrane and the peptidoglycan
  layer is digested, the P8 shell interacts with the host cytoplasmic membrane and drives voltage-dependent, endocytic-like
  penetration of the viral polymerase core into the bacterial cytoplasm.
