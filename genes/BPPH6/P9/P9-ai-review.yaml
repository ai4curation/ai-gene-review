  review:
    summary: Newly synthesized P9 inserts into host bacterial membranes prior to P12-dependent assembly into viral envelope
      precursor vesicles.
    action: KEEP_AS_NON_CORE
    reason: During phi6 infection and plasmid expression in Pseudomonas syringae, P9 integrates into host membranes before
      P12-mediated formation of low-density viral envelope precursor particles. Host cell membrane localization represents
      an intracellular biogenesis intermediate rather than its mature destination in the virion membrane.
