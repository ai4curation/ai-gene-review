- id: PMID:26213264
  title: Bacteriophage membrane protein P9 as a fusion partner for the efficient expression of membrane proteins in Escherichia
    coli.
  findings:
  - statement: Phage phi6 major envelope protein P9 promotes synthesis and integration of fused transmembrane proteins into
      the Escherichia coli cell membrane.
    supporting_text: Here, we report a novel membrane protein expression system that uses the major envelope protein (P9)
      of phage φ6 as an N-terminal fusion partner. Phage membrane protein P9 facilitated the synthesis of target proteins
      and their integration into the Escherichia coli cell membrane.
- id: PMID:8021194
  title: Plasmid-directed assembly of the lipid-containing membrane of bacteriophage phi 6.
  findings:
  - statement: The phi6 viral envelope membrane is composed of phospholipids and proteins P3, P6, P9, P10, and P13, and co-expression
      of P9 with P12 is necessary and sufficient to assemble low-density lipid-P9 envelope precursor particles.
    supporting_text: The nucleocapsid of bacteriophage phi 6 is enveloped within a lipid-containing membrane. The membrane
      is composed of proteins P3, P6, P9, P10, and P13 and phospholipids. ... Simultaneous synthesis of proteins P9 and P12
      led to the formation of a low-density P9 particle having a buoyant density similar to that of precursor structures composed
      of phospholipid and proteins isolated from phi 6-infected cells. These results are consistent with results of previous
      genetic experiments suggesting that P9 and P12 are necessary and sufficient for the formation of the phi 6 envelope.
