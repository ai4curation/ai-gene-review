suggested_questions:
- question: How does the cytosolic or periplasmic domain of P9 specifically recognize the outer P8 shell of the assembled
    nucleocapsid to trigger envelopment during virion maturation?
  experts: []
- question: What is the physical mechanism by which morphogenetic protein P12 prevents proteolytic degradation of newly synthesized
    P9 in the host cell?
  experts: []
suggested_experiments:
- hypothesis: Specific charged residues in the N-terminal cytoplasmic domain of P9 (residues 1-52) form electrostatic contacts
    with the T=13 P8 outer capsid lattice to couple lipid vesicle recruitment with nucleocapsid envelopment.
  description: Perform site-directed mutagenesis of conserved charged residues in the N-terminal domain of P9 in a plasmid
    complementation system, and assay both P12-dependent lipid vesicle formation and envelopment of purified phi6 nucleocapsids
    by cryo-EM and buoyant density gradient centrifugation.
  experiment_type: Site-directed mutagenesis and in vitro nucleocapsid envelopment assay
