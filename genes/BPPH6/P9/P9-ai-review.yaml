  label: Pseudomonas phage phi6
description: Major envelope protein P9 of the enveloped double-stranded RNA bacteriophage phi6 (Cystovirus phi6). P9 is a
  90-residue single-pass integral membrane protein encoded on the small (S) dsRNA genome segment that serves as the most abundant
  structural protein of the lipid-containing viral envelope. During intracellular virion morphogenesis, P9 requires the nonstructural
  viral morphogenetic factor P12 for proteolytic stability and assembly into phospholipid-P9 membrane precursor vesicles that
  subsequently envelop the mature nucleocapsid.
