- id: PMID:1390911
  title: The lytic enzyme of the Pseudomonas phage phi 6. Purification and biochemical characterization.
  findings:
  - statement: Purified virion-associated P5 is a 24 kDa monomeric muralytic enzyme that cleaves the peptide bridge between
      meso-diaminopimelic acid and D-alanine in the host peptidoglycan cell wall.
    supporting_text: Analysis of cell wall digests indicates that P5 is not a glycosidase, but an endopeptidase splitting
      the peptide bridge formed by meso-diaminopimelic acid and D-alanine.
- id: PMID:41574337
  title: Assessment of the phi6 lysis system using genetic complementation and heterologous expression in Escherichia coli
    and Pseudomonas syringae.
  findings:
  - statement: Phi6 P5 (gp5) functions as an active peptidoglycan-degrading endolysin in Escherichia coli and Pseudomonas
      syringae when delivered to the periplasm via a holin.
    supporting_text: Conversely, pJLC149 and pJLC150, which pair the lambda holin with phi6 endolysin (pJLC150 contains an
      optimized ribosome binding site) produced spherical cells, similar to pJLC155, indicative of PG degradation with the
      outer membrane remaining intact. These observations indicate that the phi6 endolysin is active in E. coli when paired
      with lambda holin
