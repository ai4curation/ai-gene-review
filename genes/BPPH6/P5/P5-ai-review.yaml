suggested_questions:
- question: How does newly synthesized cytoplasmic P5 gain access to the periplasmic peptidoglycan layer during late-stage
    lysis in Pseudomonas syringae, and which phi6 membrane protein (P6, P10, or P13) provides the holin-like pathway?
- question: Should GO introduce a specific cellular component term for the interspace between the icosahedral nucleocapsid
    and the lipid envelope in enveloped bacteriophages such as cystoviruses, analogous to viral tegument?
suggested_experiments:
- description: Co-express P5 with individual phi6 membrane proteins (P6, P10, P9, P13) in Pseudomonas syringae and monitor
    periplasmic P5 release and peptidoglycan degradation by time-lapse phase-contrast microscopy.
