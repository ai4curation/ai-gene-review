- description: Hydrolyzes the meso-diaminopimelic acid to D-alanine peptide cross-bridge of host bacterial peptidoglycan,
    acting both as a virion-associated exolysin that breaches the periplasmic cell wall during viral entry and as an endolysin
    that lyses the host cell late in infection.
