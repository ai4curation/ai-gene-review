  label: Pseudomonas phage phi6
description: Dual-function peptidoglycan hydrolase P5 (gp5) of Pseudomonas phage phi6 located in the virion space between
  the nucleocapsid and the lipid envelope. P5 is a monomeric ~24 kDa muralytic endopeptidase/carboxypeptidase that cleaves
  the peptide cross-bridge between meso-diaminopimelic acid and D-alanine in the host Gram-negative cell wall, acting both
  as a virion-associated exolysin that locally digests the periplasmic peptidoglycan layer after outer membrane fusion during
  viral entry and as an endolysin late in infection to lyse the host bacterium and release progeny virions.
