suggested_questions:
- question: What is the atomic structure of the P3-P6 spike complex in the virion membrane, and how does pilus binding trigger
    P3 release or conformational rearrangement to expose the P6 fusion protein?
suggested_experiments:
- description: Perform cryo-electron tomography and subtomogram averaging of native phi6 virions bound to isolated Pseudomonas
    type IV pili to resolve the P3-pilus interface and P3-P6 anchor architecture.
