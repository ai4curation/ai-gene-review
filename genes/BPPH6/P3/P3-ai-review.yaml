taxon:
  id: NCBITaxon:2928686
  label: Pseudomonas phage phi6
description: Peripheral virion membrane spike protein P3 of Pseudomonas phage phi6 that protrudes from the viral lipid envelope,
  where it is anchored by the integral membrane fusion protein P6. P3 mediates initial host recognition and adsorption by
  attaching to the type IV pilus of the Pseudomonas host cell, enabling pilus retraction to bring the enveloped virion into
  contact with the host outer membrane for P6-mediated fusion.
