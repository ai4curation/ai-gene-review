suggested_questions:
- question: Does P10 oligomerize into discrete pores in the Pseudomonas syringae cytoplasmic membrane to collapse the proton-motive
    force and grant muralytic enzyme P5 access to the peptidoglycan layer?
  experts: []
- question: How is P10's lytic pore-forming activity suppressed when P10 is packaged inside the mature virion envelope membrane
    prior to release?
  experts: []
suggested_experiments:
- hypothesis: Accumulation of P10 above a critical threshold concentration in the host cytoplasmic membrane late in infection
    triggers cooperative homo-oligomerization into voltage-dissipating membrane lesions that allow P5 endolysin access to
    the periplasm.
  description: Inducibly express wild-type and transmembrane-domain point mutants of P10 in Pseudomonas syringae while monitoring
    membrane potential with tetraphenylphosphonium (TPP+) electrodes, cytoplasmic K+ efflux, and timing of P5-dependent cell
    lysis.
  experiment_type: Inducible holin expression and membrane depolarization assay
