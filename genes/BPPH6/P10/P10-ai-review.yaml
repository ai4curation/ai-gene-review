id: P11127
gene_symbol: P10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2928686
  label: Pseudomonas phage phi6
description: Envelope protein P10 of the enveloped double-stranded RNA bacteriophage phi6 (Cystovirus phi6). P10 is a 42-residue
  single-pass transmembrane protein encoded on the middle (M) dsRNA genome segment that resides in the lipid-containing viral
  envelope membrane. Upon initial infection, fusion of the viral envelope with the Pseudomonas syringae outer membrane transfers
  P10 and other viral membrane components into the host outer membrane. At the end of the infective cycle, P10 acts as the
  essential holin-like membrane lysis factor that promotes host cell cytolysis to release progeny virions.
