id: P11126
gene_symbol: P1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2928686
  label: Pseudomonas phage phi6
description: Major inner capsid protein P1 of Pseudomonas phage phi6 that forms the 120-subunit (60 asymmetric dimer) pseudo-T=2
  dodecahedral procapsid shell of the viral polymerase complex. P1 monomers adopt a flattened trapezoidal alpha-helical fold
  and undergo rigid-body conformational expansion during sequential single-stranded RNA genome packaging, providing specific
  RNA-binding sites on the procapsid exterior and housing the viral RNA-directed RNA polymerase P2, packaging NTPase P4, and
  assembly factor P7.
existing_annotations:
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0694
  review:
    summary: P1 forms positively charged RNA-binding cavities on the procapsid surface that specifically recognize viral plus-strand
      ssRNA segments during sequential packaging.
    action: ACCEPT
    reason: Structural and biochemical studies demonstrate that the P1 procapsid shell contains positively charged cavities
      that bind specific viral ssRNA packaging signals (such as the s-segment) to coordinate sequential genome packaging.
    supported_by:
    - reference_id: PMID:23891288
      supporting_text: From these models, we could identify a positively charged cavity that is open on the procapsid and
        likely to bind the s-segment but closed and therefore inaccessible in the expansion intermediates and mature capsid,
        observations consistent with the sequential packaging hypothesis.
