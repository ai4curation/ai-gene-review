references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:16765897
  title: Structure of the bacteriophage phi6 nucleocapsid suggests a mechanism for sequential RNA packaging.
  findings:
  - statement: Cryo-EM reconstruction of the phi6 nucleocapsid at 7.5 A resolution shows that 60 asymmetric P1 dimers form
      the inner T=1 (pseudo-T=2) shell and undergo rigid-body movements during procapsid expansion.
    supporting_text: Asymmetric P1 dimers organize as an inner T = 1 shell, and P8 trimers organize as an outer T = 13 laevo
      shell. The organization of the P1 molecules in the unexpanded and expanded polymerase complex suggests that the expansion
      is accomplished by rigid body movements of the P1 monomers.
- id: PMID:23891288
  title: Subunit folds and maturation pathway of a dsRNA virus capsid.
  findings:
  - statement: Crystal structure of P1 reveals a flattened trapezoidal alpha-helical fold, and fitting into cryo-EM reconstructions
      identifies a positively charged s-segment RNA-binding cavity on the unexpanded procapsid that closes upon maturation.
    supporting_text: From these models, we could identify a positively charged cavity that is open on the procapsid and likely
      to bind the s-segment but closed and therefore inaccessible in the expansion intermediates and mature capsid, observations
      consistent with the sequential packaging hypothesis.
