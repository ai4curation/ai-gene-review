suggested_questions:
- question: Which specific basic residues lining the positively charged procapsid cavity of P1 directly contact the pac sequences
    of the s, m, and l ssRNA segments?
suggested_experiments:
- description: Perform site-directed mutagenesis of basic residues in the P1 s-segment binding cavity identified by cryo-EM/crystal
    fitting followed by in vitro ssRNA binding and procapsid packaging assays.
