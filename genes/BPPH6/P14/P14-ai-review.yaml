  label: Pseudomonas phage phi6
description: Nonstructural protein P14 of the enveloped double-stranded RNA bacteriophage phi6 (Cystovirus phi6). P14 is a
  small 62-residue (6.9 kDa), low-abundance nonstructural protein encoded near the 5-prime end of the large (L) dsRNA genome
  segment. Although nonessential for plaque formation under standard laboratory conditions, genetic analysis of a gene 14
  nonsense mutant demonstrates that P14 is required for optimal phage development in the infected bacterial host cell.
