- id: PMID:10619851
  title: Replicase activity of purified recombinant protein P2 of double-stranded RNA bacteriophage phi6.
  findings:
  - statement: Purified recombinant P2 acts as a primer-independent RNA replicase that synthesizes full-length minus strands
      on positive-sense ssRNA templates to form dsRNA.
    supporting_text: In this report, recombinant protein P2 of double-stranded RNA bacteriophage phi6 was purified and demonstrated
      in an in vitro enzymatic assay to act as the replicase. The enzyme efficiently utilizes phage-specific, positive-sense
      RNA substrates to produce double-stranded RNA molecules, which are formed by newly synthesized, full-length minus-strands
      base paired with the plus-strand templates.
- id: PMID:11602748
  title: Comparison of polymerase subunits from double-stranded RNA bacteriophages.
  findings:
  - statement: Purified phi6 P2 functions as both replicase and transcriptase in vitro and preferentially initiates at phi6-specific
      3' plus-strand signals.
    supporting_text: We have previously demonstrated that purified P2 protein, the Pol subunit of the φ6 PC, can act as a
      replicase and transcriptase in vitro ( 11 , 13 ). Although it accepts RNA templates of both φ6 and heterologous origin,
      φ6 Pol shows a clear preference for templates containing φ6-specific plus-strand initiation signals at their 3′ ends.
- id: PMID:17237359
  title: Large-scale production of dsRNA and siRNA pools for RNA interference utilizing bacteriophage phi6 RNA-dependent RNA
    polymerase.
  findings:
  - statement: Phi6 P2 RdRP initiates de novo and processively synthesizes full-length dsRNA from ssRNA templates.
    supporting_text: ϕ6 RdRP performs de novo initiation and produces full-length dsRNAs from given template ssRNAs. The enzyme
      is highly processive, replicating ssRNA molecules of practically unlimited length ( Makeyev and Bamford 2000a , b ;
      Butcher et al. 2001 ).
- id: PMID:18614640
  title: Nontemplated terminal nucleotidyltransferase activity of double-stranded RNA bacteriophage phi6 RNA-dependent RNA
    polymerase.
  findings:
  - statement: P2 catalyzes nontemplated 3'-terminal nucleotide additions to ssRNA and dsRNA both as an isolated enzyme and
      within the viral nucleocapsid.
    supporting_text: In this study, we show that this enzyme also catalyzes nontemplated nucleotide additions to single-stranded
      and double-stranded nucleic acid molecules. This terminal nucleotidyltransferase activity not only is a property of
      the isolated enzyme but also is detected to take place within the viral nucleocapsid.
- id: PMID:18940872
  title: Structural explanation for the role of Mn2+ in the activity of phi6 RNA-dependent RNA polymerase.
  findings:
  - statement: Mutation of the Mn2+-coordinating residue E491Q in P2 reduces Mn2+ affinity, RNA binding, and elongation rate,
      demonstrating how Mn2+ coordination regulates polymerase dynamics.
    supporting_text: We have probed the role of Mn(2+) by biochemical, biophysical and structural analyses of the wild-type
      enzyme and of a mutant form with an altered Mn(2+)-binding site (E491 to Q). The E491Q mutant has much reduced affinity
      for Mn(2+), reduced RNA binding and a compromised elongation rate.
