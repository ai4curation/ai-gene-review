  label: Pseudomonas phage phi6
description: Primer-independent RNA-directed RNA polymerase (RdRP) of Pseudomonas phage phi6 that resides on the interior
  surface of the P1 procapsid shell near the three-fold axes and catalyzes both minus-strand synthesis (viral dsRNA genome
  replication) and semi-conservative plus-strand synthesis (RNA-templated transcription). P2 adopts a right-handed polymerase
  fold with an enclosed template/product tunnel, requires divalent Mg2+ and Mn2+ ions for de novo initiation and processive
  elongation, and also exhibits a secondary nontemplated 3'-terminal nucleotidyltransferase activity.
