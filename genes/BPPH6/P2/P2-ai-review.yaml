suggested_questions:
- question: How does the conformational expansion of the P1 procapsid shell upon packaging all three ssRNA segments trigger
    the switch of P2 from minus-strand replication to plus-strand transcription?
suggested_experiments:
- description: Determine high-resolution cryo-EM structures of P2 bound in situ within the P1 procapsid before and after dsRNA
    replication to visualize how P1/P7 contacts regulate template entry and C-terminal priming loop displacement.
