id: P11128
gene_symbol: P6
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2928686
  label: Pseudomonas phage phi6
description: Integral multi-pass virion membrane fusion protein P6 of Pseudomonas phage phi6 that resides in the viral lipid
  envelope, anchors the peripheral receptor-binding spike protein P3, and mediates fusion between the phage envelope and the
  host bacterium outer membrane during viral entry. Following type IV pilus retraction and contact with the host surface,
  P6 catalyzes outer membrane fusion to deliver the P5 muralytic enzyme and the P8-coated nucleocapsid into the host periplasm.
