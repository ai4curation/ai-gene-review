suggested_questions:
- question: Which hydrophobic or amphipathic helices of P6 insert into the lipopolysaccharide-rich outer membrane of Pseudomonas
    syringae to drive lipid mixing and outer membrane fusion?
suggested_experiments:
- description: Reconstitute purified P6 and P3-P6 complexes into fluorescently labeled proteoliposomes and assay lipid mixing
    with isolated Pseudomonas outer membrane vesicles upon P3 dissociation or divalent cation modulation.
