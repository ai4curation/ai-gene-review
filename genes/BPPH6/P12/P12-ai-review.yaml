  qualifier: involved_in
  review:
    summary: Plasmid-directed co-expression in Pseudomonas syringae demonstrates that P12 stabilizes major envelope protein P9 and is required to assemble lipid-P9 viral envelope precursor vesicles.
    action: NEW
    reason: P12 is a nonstructural morphogenetic assembly factor essential for bacteriophage phi6 envelope formation. Co-expression of P9 and P12 in the absence of phage infection is necessary and sufficient to protect P9 from degradation and produce low-density phospholipid-P9 precursor particles.
    supported_by:
    - reference_id: PMID:8021194
      supporting_text: 'In the absence of P12, P9 was found to be unstable. Simultaneous synthesis of proteins P9 and P12 led to the formation of a low-density P9 particle having a buoyant density similar to that of precursor structures composed of phospholipid and proteins isolated from phi 6-infected cells. These results are consistent with results of previous genetic experiments suggesting that P9 and P12 are necessary and sufficient for the formation of the phi 6 envelope.'
    - reference_id: file:BPPH6/P12/P12-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Assembly factor active in membrane morphogenesis.'
