  experts: []
- question: Does P12 directly extract phospholipids or remodel vesicles from the host bacterial inner membrane to generate the low-density P9-lipid particles?
  experts: []
suggested_experiments:
- hypothesis: The conserved C-terminal CXXC...CXXC motif of P12 forms a structural zinc finger essential for direct binding to P9 and protection of P9 from host membrane proteases.
  description: Purify wild-type P12 and C157A/C160A/C179A/C182A substitution mutants, measure metal stoichiometry by ICP-MS, and test their ability to co-immunoprecipitate P9 and support low-density P9-lipid vesicle formation in Pseudomonas syringae.
  experiment_type: Metal-binding analysis, co-immunoprecipitation, and membrane vesicle assembly assay
