  review:
    summary: P12 is a nonstructural viral morphogenetic protein synthesized in the infected bacterial host cell cytoplasm, where it mediates intracellular viral envelope assembly without being packaged into mature virions.
    action: NEW
    reason: Unlike envelope proteins P3, P6, P9, P10, and P13, P12 is absent from the mature virion membrane and acts intracellularly within the infected Pseudomonas syringae cytoplasm to stabilize P9 and assemble lipid-protein envelope precursor vesicles.
    supported_by:
    - reference_id: PMID:8021194
      supporting_text: 'cDNA copies of genes 9 and 12 were expressed on plasmids in Pseudomonas syringae pv. phaseolicola. Immunoblotting demonstrated the presence of protein P9 in strains carrying both gene 9 and gene 12 but not in strains with gene 9 alone. In the absence of P12, P9 was found to be unstable. Simultaneous synthesis of proteins P9 and P12 led to the formation of a low-density P9 particle having a buoyant density similar to that of precursor structures composed of phospholipid and proteins isolated from phi 6-infected cells.'
    - reference_id: file:BPPH6/P12/P12-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Assembly factor active in membrane morphogenesis.'
