description: Nonstructural morphogenetic protein P12 of the enveloped double-stranded RNA bacteriophage phi6 (Cystovirus phi6). Encoded on the small (S) dsRNA genome segment, P12 is a 195-residue (20.3 kDa) cytoplasmic assembly factor that is not incorporated into mature virions but is essential for intracellular viral membrane morphogenesis. P12 protects the major viral envelope protein P9 from proteolytic degradation and, together with P9, is necessary and sufficient to drive the formation of low-density phospholipid-P9 precursor vesicles that envelop the assembled nucleocapsid.
