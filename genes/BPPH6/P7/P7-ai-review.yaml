id: P11123
gene_symbol: P7
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2928686
  label: Pseudomonas phage phi6
description: Minor inner procapsid assembly and packaging cofactor protein P7 of Pseudomonas phage phi6 that localizes on
  the interior surface of the P1 procapsid shell near the three-fold axes of symmetry in proximity to the P2 RNA-directed
  RNA polymerase. P7 promotes efficient procapsid assembly, stabilizes P2 at the three-fold axes in unexpanded procapsids,
  is required for stable sequential packaging of the viral ssRNA genome segments, and contributes to the fidelity of plus-strand
  transcription.
