      supporting_text: Difference maps highlight the precise position of P7 and demonstrate that in P7-minus particles the
        P2 proteins are less localized with reduced densities at the three-fold axes. We propose that P7 performs the mechanical
        function of stabilizing P2 on the inner protein P1 shell which ensures that entering viral single-stranded RNA is
        replicated.
