  review:
    summary: P7 acts as an assembly factor required for efficient formation of the P1-P2-P4-P7 procapsid shell.
    action: NEW
    reason: Cryo-EM single-particle reconstructions and biochemical studies establish that P7 accelerates and stabilizes the
      assembly of the dodecahedral procapsid and holds P2 at the inner three-fold axes.
    supported_by:
