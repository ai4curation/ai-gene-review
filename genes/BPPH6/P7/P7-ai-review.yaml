suggested_questions:
- question: How does the disordered C-terminal tail of P7 interact with P1 and P2 inside the unexpanded procapsid to stabilize
    P2 before RNA packaging and regulate plus-strand transcription initiation?
suggested_experiments:
- description: Perform single-particle cryo-EM with focused classification at the three-fold axes of unexpanded and packaged
    phi6 procapsids containing C-terminally truncated P7 mutants to map the P7-P2-P1 interaction network.
