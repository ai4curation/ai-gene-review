references:
- id: PMID:23077625
  title: Protein P7 of the cystovirus φ6 is located at the three-fold axis of the unexpanded procapsid.
  findings:
  - statement: Cryo-EM single-particle difference mapping demonstrates that P7 localizes near the three-fold axis of symmetry
      on the inner P1 procapsid shell prior to RNA packaging and stabilizes the P2 RNA-directed RNA polymerase at the three-fold
      axes.
    supporting_text: A comparison of cryo-electron microscopy high-resolution single particle reconstructions of the φ6 complete
      unexpanded procapsid, the protein P2-minus procapsid (P2 is the RNA directed RNA-polymerase), and the P7-minus procapsid,
      show that prior to RNA packaging the P7 protein is located near the three-fold axis of symmetry. Difference maps highlight
      the precise position of P7 and demonstrate that in P7-minus particles the P2 proteins are less localized with reduced
      densities at the three-fold axes. We propose that P7 performs the mechanical function of stabilizing P2 on the inner
      protein P1 shell which ensures that entering viral single-stranded RNA is replicated.
- id: file:BPPH6/P7/P7-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P11123 (P7_BPPH6)
  findings:
  - statement: P7 is an internal procapsid assembly and packaging cofactor located near the three-fold symmetry axes on the
      inner procapsid surface that is required for efficient procapsid assembly and stable viral RNA packaging.
    supporting_text: 'FUNCTION: Assembly protein part of the packaging complex that packages the viral RNA segments, replicate
      them into a double-stranded form and transcribe them. Required for efficient procapsid assembly. Necessary for stable
      packaging. May stabilize the RNA-dependent RNA polymerase (RdRP) in its position at the three-fold axis on the inner
      side of empty-unexpanded procapsids. Could play a role in viral RNA recognition. Seems to be involved in the regulation
      of plus strand synthesis (transcription) as a fidelity factor.'
  - statement: P7 localizes inside the virion capsid on the inner procapsid surface near the three-fold axis of symmetry.
    supporting_text: 'SUBCELLULAR LOCATION: Virion {ECO:0000305}. Note=Found in the capsid (Probable). Prior to RNA packaging,
      localizes on the inner procapsid surface near the three-fold axis of symmetry.'
core_functions:
- description: Serves as an internal structural and assembly cofactor of the icosahedral procapsid near the three-fold symmetry
    axes, promoting efficient procapsid assembly, stabilizing the P2 polymerase, and enabling stable viral RNA genome packaging.
