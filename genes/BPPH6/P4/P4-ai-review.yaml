taxon:
  id: NCBITaxon:2928686
  label: Pseudomonas phage phi6
description: Hexameric nucleoside triphosphatase (NTPase) packaging motor P4 of Pseudomonas phage phi6 that assembles in 72
  copies (12 hexamers) at the five-fold symmetry vertices on the outer surface of the P1 procapsid. P4 hydrolyzes ribonucleoside,
  deoxyribonucleoside, and dideoxyribonucleoside triphosphates in a divalent cation- and ssRNA-stimulated manner to drive
  the sequential 5'-to-3' translocation of the three viral positive-sense ssRNA genome segments into the procapsid.
