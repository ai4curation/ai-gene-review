      portal vertices of the procapsid and virion capsid.
    record_section: ["CC:FUNCTION"]
    supporting_text: 'FUNCTION: Packaging motor with helicase and translocase activities. Part of the packaging complex that
      packages the viral RNA segments, replicate them into a double-stranded form and transcribe them. is one of the structural
      proteins of the polyhedral procapsid, which is responsible for genomic replication and transcription. Displays single-stranded
      RNA-stimulated NTPase activity.'
core_functions:
- description: Functions as a hexameric nucleoside triphosphatase (NTPase) molecular motor at the 12 five-fold vertices of
    the viral procapsid to drive 5'-to-3' translocation and packaging of viral plus-strand ssRNA genome segments.
