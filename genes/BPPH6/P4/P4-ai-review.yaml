suggested_questions:
- question: How is a single P4 hexamer among the 12 five-fold vertices selected as the active packaging portal during sequential
    ssRNA translocation, and does the same portal extrude nascent plus-strand transcripts during semi-conservative transcription?
suggested_experiments:
- description: Perform asymmetric cryo-EM reconstruction of phi6 procapsids stalled mid-translocation with a biotin-streptavidin-tagged
    ssRNA substrate to resolve the active P4 hexamer-P1 five-fold vertex interface at near-atomic resolution.
