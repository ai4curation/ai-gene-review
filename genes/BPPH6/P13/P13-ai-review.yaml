suggested_questions:
- question: What is the specific functional contribution of P13 to virion stability, host range, or envelope fusion, given
    that P9 and P12 suffice for basic vesicle formation and P3/P6 mediate attachment and fusion?
  experts: []
- question: How is P13 topologically oriented within the phi6 virion membrane, and does it interact directly with P9, P6,
    or P10?
  experts: []
suggested_experiments:
- hypothesis: P13 modulates the lipid packing or stability of the phi6 viral envelope under environmental stress or in alternative
    Pseudomonas host strains.
  description: Construct a gene 13 null mutant of bacteriophage phi6 by reverse genetics and compare virion thermal/detergent
    stability, envelope lipid composition by mass spectrometry, and plating efficiency across diverse Pseudomonas syringae
    pathovars relative to wild-type phi6.
  experiment_type: Reverse genetics knockout and virion envelope stability assay
