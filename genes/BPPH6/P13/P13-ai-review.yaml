  label: Pseudomonas phage phi6
description: Envelope protein P13 of the enveloped double-stranded RNA bacteriophage phi6 (Cystovirus phi6). Encoded on the
  middle (M) dsRNA genome segment alongside the other membrane-associated viral genes, P13 is a 72-residue (7.6 kDa) hydrophobic
  protein that resides in the lipid-containing viral envelope membrane together with proteins P3, P6, P9, and P10.
