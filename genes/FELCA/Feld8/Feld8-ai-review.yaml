- term:
    id: GO:0008289
    label: lipid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      BPI/LBP/PLUNC-superfamily proteins bind lipids; the UniProt SubName for this
      entry is literally "Lipid binding protein". Lipid binding is the core
      molecular function consistent with the family fold.
    action: ACCEPT
    reason: >-
      Family membership, not an assay on this protein: Fel d 8 carries the
      LBP/BPI/CETP lipid-binding domain (Pfam PF01273; InterPro lipid-binding
      serum glycoprotein N-terminal domain) and belongs to the BPI
      fold-containing family A (PANTHER), whose defining activity is lipid
      binding. No specific lipid ligand has been shown for Fel d 8 (recorded as a
      knowledge gap). The protein name "Lipid binding protein" is a label and is
      not relied on.
    supported_by:
    - reference_id: file:FELCA/Feld8/Feld8-uniprot.txt
      record_section: ["DR:Pfam"]
      supporting_text: 'DR   Pfam; PF01273; LBP_BPI_CETP; 1.'
