- term:
    id: GO:0043129
    label: surfactant homeostasis
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: >-
      PLUNC-family (BPI/LBP/PLUNC) proteins act as biological surfactants in
      oral/airway secretions and participate in surfactant/airway-surface-liquid
      homeostasis; phylogenetic inference of this process for Fel d 8 is consistent
      with its family.
    action: ACCEPT
    reason: >-
      Family membership: the IBA follows a PAINT node in the BPI fold-containing
      family A (PANTHER PTHR47015), and Fel d 8 was identified as a latherin-like
      protein homologous to horse Equ c 5 (latherin) from a salivary gland
      library (Smith et al. 2011, PMID:21576986). Nothing specific to Fel d 8
      argues against inheritance of the surfactant role of PLUNC/latherin-like
      proteins, so the IBA is accepted. The UniProt SIMILARITY line is ARBA-only
      and is not relied on.
    supported_by:
