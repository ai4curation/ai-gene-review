core_functions:
- description: >-
    Secreted lipid-binding protein of the BPI/LBP/PLUNC (latherin-like) family,
    inferred to act as a biological surfactant in oral/salivary (and airway)
    secretions, contributing to surfactant/airway-surface-liquid homeostasis. The
    specific lipid ligand and detailed mechanism for cat Fel d 8 are family-inferred,
    not directly demonstrated.
