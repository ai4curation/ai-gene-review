  label: Trypanosoma brucei brucei TREU927
description: >-
  Tb927.10.1990 (formerly Tb10.70.5840) encodes MVP2, one of three major vault protein
  (MVP) paralogs of Trypanosoma brucei, alongside MVP1 (Tb927.5.4460) and MVP3
  (Tb927.10.6310). It is a full-length, 863-residue MVP with the complete set of MVP
  repeat domains, the shoulder domain and the C-terminal region, but it is markedly
  divergent: it shares only about 58% sequence similarity with MVP1 and belongs to a
  separate kinetoplastid-specific clade conserved across trypanosomatids. Endogenously
  tagged MVP2 forms cytoplasmic particles like MVP1, co-purifies with MVP1 at similar
  intensity, and co-localises with MVP1 and MVP3 in the same particles, indicating that
  the trypanosome vault shell is a heteromultimer of the three paralogs. The vault
  particle also contains TEP1 and the trypanosome vault RNA and lies near splicing factors
  and RNA-binding proteins, but its physiological function is unknown.
