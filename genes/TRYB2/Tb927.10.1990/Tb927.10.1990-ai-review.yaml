core_functions:
- description: Structural subunit of the trypanosome vault shell. The divergent paralog MVP2
    co-assembles with MVP1 and MVP3 into cytoplasmic vault particles containing TEP1 and
    vault RNA. Its specific position in the shell and the function of the vault are unknown.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  in_complex:
    id: GO:1990904
    label: ribonucleoprotein complex
  supported_by:
  - reference_id: PMID:40945728
    supporting_text: the observed colocalization data strongly suggest that each vault shell
      is a multimeric assembly of all three vault paralogs
  - reference_id: PMID:40945728
    supporting_text: Monitoring fluorescence of the GFP variants showed co-localization of
      particles formed in all MVP combinations
  knowledge_gaps:
  - gap_statement: Whether MVP2 is an obligate shell component, where it sits in the shell,
      and whether it can form particles without MVP1 are unknown.
    boundary: MVP2 co-purifies and co-localises with MVP1 and MVP3, and AlphaFold3 predicts
      MVP2-containing heterotrimers and homotrimers; MVP2 has not been depleted or used as
      a purification bait, and no trypanosome vault structure exists.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: The MVP2 clade is conserved across trypanosomatids but missing from some
      Euglenozoa, so whether it has a specialised structural role bears on why kinetoplastids
      keep three divergent MVPs.
proposed_new_terms:
- proposed_name: vault complex
  proposed_definition: A barrel-shaped cytoplasmic ribonucleoprotein complex of about 13 MDa,
    formed by two half-vaults each made of multiple copies of one or more major vault protein
    paralogs, and containing minor vault components such as TEP1 and vault RNAs.
  justification: GO has no vault complex term; MVP2 can only be annotated to the generic
    ribonucleoprotein complex. Same proposal as in the MVP1 and human MVP reviews, worded to
    allow heteromultimeric shells.
  proposed_parent:
    id: GO:1990904
    label: ribonucleoprotein complex
  supported_by:
  - reference_id: PMID:40945728
    supporting_text: the observed colocalization data strongly suggest that each vault shell
      is a multimeric assembly of all three vault paralogs
suggested_questions:
- question: Does the divergent MVP2 occupy a specialised position in the trypanosome vault
    (for example the cap or waist), or is it interchangeable with MVP1 in the barrel?
- question: Why have trypanosomatids kept three divergent MVP paralogs when Dictyostelium's two
    paralogs remain highly similar?
suggested_experiments:
- description: Deplete MVP2 by auxin-inducible degron in cells expressing eYFP-MVP1 and
    mCherry-MVP3, and assess particle number, size and vtRNA association; complement with
    cryo-EM of purified vaults to locate MVP2.
  hypothesis: MVP2 is required for normal vault assembly and occupies defined positions in a
    heteromultimeric shell.
