  review:
    summary: PAINT IBA placing signal transduction at the eukaryote-wide MVP node, seeded by
      human MVP alone.
    action: MARK_AS_OVER_ANNOTATED
    reason: As for MVP1. Human MVP's signalling roles are modulatory and depend on
      phosphotyrosine/SH2 partners and vertebrate pathways; trypanosomatids lack tyrosine
      kinase and TKL group kinases, and no signalling role is known for any trypanosome MVP.
