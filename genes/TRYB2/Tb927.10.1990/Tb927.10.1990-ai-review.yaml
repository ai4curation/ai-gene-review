  review:
    summary: MVP2 is a structural subunit of the heteromultimeric trypanosome vault shell.
    action: NEW
    reason: MVP2 is highly enriched in every MVP1 affinity capture and in MVP1 TurboID, and
      dual-colour tagging shows MVP2 particles co-localising with MVP1 and with MVP3, which
      the authors interpret as all three paralogs forming a single shell. MVP2 retains the
      full set of shell-forming MVP repeats and the shoulder domain. The evidence for MVP2 is
      co-assembly rather than an MVP2-bait purification or a structure, but the conclusion is
      the same as for MVP1 and for human MVP, whose core activity is structural.
    supported_by:
