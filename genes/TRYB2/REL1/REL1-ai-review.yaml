taxon:
  id: NCBITaxon:185431
  label: Trypanosoma brucei brucei TREU927
description: >-
  REL1 (TbMP52, KREL1) is the mitochondrial RNA-editing ligase 1 of Trypanosoma brucei,
  an ATP-dependent RNA ligase of the RNA ligase 2 (Rnl2) family within the
  nucleotidyltransferase superfamily. Imported into the single mitochondrion via an
  N-terminal transit peptide, it is a core subunit of the ~1.6 MDa RNA editing complex
  (editosome) that inserts and deletes uridylates in maxicircle-encoded pre-mRNAs as
  directed by guide RNAs. REL1 forms a covalent enzyme-AMP intermediate on Lys87 and
  seals the nicked mRNA after endonucleolytic cleavage and U removal, acting in the
  deletion subcomplex together with the 3'-exouridylylase and the zinc-finger protein
  MP63, whereas its paralog REL2 serves the insertion subcomplex. Its 1.2 A crystal
  structure with ATP and Mg2+ reveals an editing-ligase-specific adenine pocket. REL1 is
  essential for editing and for viability of both bloodstream and procyclic forms and
  has no close human homolog.
