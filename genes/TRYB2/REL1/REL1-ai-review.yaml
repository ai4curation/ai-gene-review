- term:
    id: GO:0009451
    label: RNA modification
  evidence_type: IDA
  original_reference_id: PMID:11134327
  qualifier: acts_upstream_of_or_within
  review:
    summary: Based on association of TbMP52 with the complex that catalyzes in vitro deletion
      editing; GO merged "RNA editing" into RNA modification.
    action: MODIFY
    reason: The process is correct but very general. REL1 ligates mRNA during U-insertion/
      deletion editing of mitochondrial mRNAs, which is captured by mitochondrial mRNA
      modification (GO:0080156, a descendant of RNA modification). Repression of REL1 blocks
      editing in vivo and the REL1 subcomplex catalyzes deletion editing, so REL1 directly
      performs a step (ligation) of the process.
    proposed_replacement_terms:
    - id: GO:0080156
      label: mitochondrial mRNA modification
    supported_by:
    - reference_id: PMID:11134327
      supporting_text: These results suggest that TbMP52 and TbMP48 are components of the
        RNA editing complex.
    - reference_id: PMID:11251122
      supporting_text: Regulated repression of TbMP52 blocks editing, which shows that it
        is a functional component of the editing complex.
