suggested_questions:
- question: Is REL1 strictly specific to deletion-site ligation in vivo, or can it
    contribute to ligation at insertion sites, given that tagged REL1 and REL2 purify
    functionally distinct deletion and insertion subcomplexes?
- question: Does GO need a specific process term for guide RNA-directed uridine
    insertion/deletion mRNA editing, distinct from generic mitochondrial mRNA modification?
suggested_experiments:
- description: Replace endogenous REL1 with catalytic (K87A) and adenine-pocket mutants
    and measure editing at deletion versus insertion sites by high-throughput sequencing
    of edited transcripts.
  hypothesis: REL1 ligation is required specifically at deletion sites, and loss of its
    activity cannot be rescued by REL2.
