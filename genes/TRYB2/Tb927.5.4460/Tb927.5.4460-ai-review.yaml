taxon:
  id: NCBITaxon:185431
  label: Trypanosoma brucei brucei TREU927
description: >-
  Tb927.5.4460 encodes MVP1, one of three major vault protein (MVP) paralogs of
  Trypanosoma brucei (with MVP2, Tb927.10.1990, and MVP3, Tb927.10.6310). It is an
  838-residue protein with the full MVP domain architecture (nine N-terminal MVP
  repeats, a stomatin-like shoulder domain and the C-terminal cap-helix region), and of
  the three paralogs it is the one most similar to mammalian MVP. N-terminally
  eYFP-tagged endogenous MVP1 forms many small, uniform particles dispersed through the
  cytoplasm and absent from the nucleus, interpreted as individual vault particles.
  Affinity capture of MVP1 co-purifies MVP2, MVP3 and the vault protein TEP1, and
  pairwise dual-colour tagging shows that all three paralogs co-localise in the same
  particles, so the trypanosome vault shell is thought to be a heteromultimer of the
  three MVPs. The particle contains the single trypanosome vault RNA (vtRNA), which
  co-precipitates with MVP1 and is mostly cytoplasmic. Proximity labelling places
  splicing factors and RNA-binding proteins near the vault, and vtRNA has been linked
  to trans-spliced mRNA production, but the function of the vault itself is unknown:
  depletion of MVP1 does not affect growth of procyclic cells in culture. A tripartite
  set of divergent MVP paralogs is conserved across Kinetoplastida, and MVP1 orthologs
  are the most widely distributed in Euglenozoa.
