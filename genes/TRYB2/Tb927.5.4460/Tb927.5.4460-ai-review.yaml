  review:
    summary: PAINT IBA placing signal transduction at the eukaryote-wide MVP node, seeded by
      human MVP alone.
    action: MARK_AS_OVER_ANNOTATED
    reason: 'The only experimental grounding is human MVP, whose signalling links are modulatory
      and depend on phosphotyrosine/SH2 partners (SRC, PTPN11) and vertebrate pathways (EGF/ERK,
      IFN-gamma/STAT1, TRAF6). Placing this at the root eukaryotic node extends a vertebrate,
      tyrosine-phosphorylation-based role to lineages that lack the machinery: trypanosomatids
      have no tyrosine kinase or tyrosine kinase-like group kinases. No signalling role has been
      reported for any trypanosome MVP; the T. brucei vault interactome is dominated by splicing
      factors and RNA-binding proteins, and MVP1 depletion has no growth phenotype. The human review
      keeps this term as non-core for human MVP; for the trypanosome protein it is an over-propagation.
      No PAINT loss is recorded on this lineage.'
    supported_by:
