core_functions:
- description: Structural subunit of the trypanosome vault shell. MVP1 assembles with its
    paralogs MVP2 and MVP3 into abundant cytoplasmic vault particles that contain TEP1 and
    the vault RNA. What the vault does for the parasite is unknown.
  molecular_function:
    id: GO:0005198
    label: structural molecule activity
  locations:
  - id: GO:0005737
    label: cytoplasm
  in_complex:
    id: GO:1990904
    label: ribonucleoprotein complex
  supported_by:
  - reference_id: PMID:40945728
    supporting_text: the observed colocalization data strongly suggest that each vault shell
      is a multimeric assembly of all three vault paralogs
  - reference_id: PMID:40945728
    supporting_text: Whilst this provided robust evidence that vtRNA is part of the vault
      particle, consistent with mammalian systems
  knowledge_gaps:
  - gap_statement: The stoichiometry and arrangement of MVP1, MVP2 and MVP3 in the vault shell
      are unknown, as is whether any one paralog is needed for the others to assemble.
    boundary: Co-purification at similar intensities and dual-colour co-localisation show
      all three paralogs in the same particles, and AlphaFold3 predicts hetero- and
      homotrimers; no structure of a trypanosome vault exists and the effect of MVP1
      depletion on particle formation by MVP2 and MVP3 was not tested.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: Determines whether the conserved three-paralog repertoire of kinetoplastids
      reflects distinct structural roles (for example cap versus barrel positions) or
      redundancy.
  - gap_statement: The physiological function of the trypanosome vault is unknown; MVP1
      depletion has no growth phenotype in procyclic culture.
    boundary: The vault holds vtRNA and lies near splicing factors, and vtRNA knockdown impairs
      trans-spliced mRNA production in permeabilised cells, but no vault-dependent process
      has been shown in vivo.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: Without a phenotype, any process annotation for the vault proteins would
      rest on association rather than participation.
proposed_new_terms:
- proposed_name: vault complex
  proposed_definition: A barrel-shaped cytoplasmic ribonucleoprotein complex of about 13 MDa,
    formed by two half-vaults each made of multiple copies of one or more major vault protein
    paralogs, and containing minor vault components such as TEP1 and vault RNAs.
  justification: GO has no term for the vault; trypanosome MVP1 and MVP2, like human MVP, can
    only be annotated to the generic ribonucleoprotein complex. The definition allows the
    heteromultimeric shells of kinetoplastids and Dictyostelium.
  proposed_parent:
    id: GO:1990904
    label: ribonucleoprotein complex
  supported_by:
  - reference_id: PMID:40945728
    supporting_text: the observed colocalization data strongly suggest that each vault shell
      is a multimeric assembly of all three vault paralogs
suggested_questions:
- question: Does MVP1, the paralog closest to animal MVP and the one present in all Euglenozoa,
    form the barrel while MVP2 and MVP3 occupy specialised positions such as the caps?
- question: Is vtRNA sequestered inside the vault to regulate its availability for
    trans-splicing or mRNA decay, and do the splicing factors found with MVP1 enter the
    particle bound to RNA?
- question: Should the PAINT signal transduction IBD at PTN000366423, seeded only by human MVP
    and resting on phosphotyrosine/SH2 interactions, be moved to a vertebrate node?
suggested_experiments:
- description: Purify vaults from T. brucei expressing tagged MVP1 and determine their
    structure by cryo-EM, with quantitative mass spectrometry of paralog ratios.
  hypothesis: The three MVP paralogs occupy defined, non-equivalent positions in a single
    heteromultimeric shell.
- description: Deplete MVP1 by auxin degron in cells carrying fluorescently tagged MVP2 or
    MVP3 and follow particle formation, and measure vtRNA stability and trans-splicing
    efficiency under stress and in bloodstream forms.
  hypothesis: MVP1 is required for assembly of particles containing the other paralogs and for
    the cytoplasmic sequestration of vtRNA.
