proposed_new_terms:
- proposed_name: symbiont-mediated suppression of host type I interferon production
  proposed_definition: >-
    A process in which a symbiont stops, prevents or reduces the production of type I
    interferons by its host, for example by preventing transcriptional induction of
    interferon genes. This is distinct from suppression of the host type I
    interferon-mediated signaling pathway (GO:0039502), which concerns interference with
    signalling downstream of the type I interferon receptor. The host is defined as the
    larger of the organisms involved in a symbiotic interaction.
  justification: >-
    GO has symbiont-mediated terms for suppression of type I, II and III
    interferon-mediated signalling (GO:0039502, GO:0140884, GO:0140885, under GO:0140886)
    but no symbiont-mediated counterpart of GO:0032480 negative regulation of type I
    interferon production. Viral proteins that block interferon induction rather than
    interferon signalling are therefore annotated to the signalling terms, which misstate
    the step affected.
    Three existing branches might be thought to cover these cases, and none covers the
    output they share. The signalling branch concerns events downstream of the interferon
    receptor, which nothing in any of these three genes' literature addresses. The
    induction-side branch names the sensor or transducer antagonised (GO:0039540 RIG-I,
    GO:0039548 IRF3, and siblings under GO:0039536). Neither NSs protein antagonises any of
    them: IRF-3, NF-kappaB and AP-1 are all activated normally [PMID:15331713], the lesion
    lying downstream of every sensor and IRF, in the host transcription machinery itself,
    through sequestration of TFIIH p44 and XPB and degradation of p62 [PMID:14980221].
    Sendai virus V is the opposite case and is the reason this branch must be discussed
    rather than dismissed: it does antagonise sensors and carries those terms, yet they
    name what it attacks and not what results, which is the coexistence question set out
    below. The transcription branch holds the NSs lesion, and the two NSs cases carry terms
    from it that these reviews accept as core (GO:0039602 and GO:0039653 here, GO:0039523
    twice on Bunyamwera NSs), so an editor may reasonably ask whether the interferon
    outcome is simply its consequence. It is not, for two
    reasons. Mechanism and outcome are complementary rather than redundant, which is the
    ground on which this review already keeps GO:0039602 and GO:0039653 together: one names
    the polymerase II step, the other the general outcome, and neither entails the specific
    outcome at issue. And the interferon block is measured in its own right rather than
    inferred from the transcription phenotype, since deletion mutants accumulate
    interferon-beta mRNA while the parental virus does not [PMID:16501102] and NSs is
    characterised as not inhibiting the interferon-specific transcription factors but
    blocking interferon gene expression at a later step [PMID:15331713].
    What is missing is a mechanism-agnostic production term, naming the outcome rather than
    the sensor attacked. Three cases need it, and they span two different mechanisms.
    RVFV NSs (P21698) and Bunyamwera virus NSs (P16494) are the transcription-shutdown
    cases, both carrying GO:0039502 rows that this review and its companion correct.
    Sendai virus V (P69282) is the third and is mechanistically unlike them: it does not
    shut down host transcription, and it is sensor-directed, carrying GO:0039540
    suppression of host RIG-I activity and GO:0039548 suppression of host IRF3 activity,
    both annotated IDA and both accepted in that review. The IRF3 row has SeV-specific
    functional support, the V protein inhibiting IRF3 activation driven by a constitutively
    active RIG-I; the RIG-I row rests on SeV-specific interaction data, its mechanistic
    experiments having been performed with the Nipah, measles and PIV5 V proteins, so the
    sensor-directed character of this case is carried mainly by the IRF3 arm. Yet the
    measured output for it is interferon production: IFN-beta secretion is much greater in
    infection by the V-deficient virus than by wild type, with replication controlled, and
    no existing term states that output. Its case is also the cleanest
    demonstration of the gap, because nothing was mis-annotated: no curator put it on
    GO:0039502, so the gap appears as an absence rather than as an error to correct.
    Influenza A NS1 (P03496) carries GO:0039502 too but is not offered, since NS1's
    documented mechanism is RIG-I and TRIM25 antagonism and the production side of its
    phenotype was not assessed for this review.
    Two scope questions for the editors. First, granularity: the evidence in all three cases is
    interferon-beta specifically, and none of the papers assays interferon-alpha, so a
    symbiont-mediated counterpart of GO:0032688 negative regulation of interferon-beta
    production would match the data more exactly than the type I term proposed here. The
    type I scope is proposed because the existing symbiont-side signalling terms are
    organised by interferon class rather than by individual cytokine, and consistency with
    that organisation seems more useful than a minimal fit; if the editors prefer the
    narrower scope, GO:0032688 is the host-side term to mirror. Second, completeness: GO
    created the signalling set GO:0140884, GO:0140885 and GO:0140886 together, so the
    editors may prefer to create the type I, type II and type III production terms as a set
    under a class-neutral parent, rather than the type I term alone. This review has
    candidate genes only for type I.
    The question the editors should weigh is the converse of the one this request first
    anticipated. Sendai virus V shows that a gene can need the production term while
    already carrying the sensor-specific terms for the mechanism by which it achieves the
    outcome, which is the same outcome-versus-mechanism relation set out above for the
    transcription branch. If that is accepted, the term layers over the induction branch
    generally: any symbiont whose interferon output is separately measured could carry it
    alongside whichever sensor term describes its mechanism. That may be the right
    structure, mirroring how the transcription and production claims coexist here, but it
    is a deliberate decision about redundancy rather than a side effect, and it should be
    made explicitly. The criterion this review would apply is that the production term is
    warranted where the interferon output is measured in its own right, and not where it is
    merely inferred from a mechanism term the gene already carries. Two viral proteins that
    block interferon-beta induction downstream of IRF3 activation, KSHV vIRF1 and HSV-1
    ICP0, were considered as further cases and are not offered here - not because acting on
    IRF3 disqualifies them, which the Sendai case shows it does not, but because neither of
    those papers was read in full for this review.
  proposed_parent:
    id: GO:0052170
    label: symbiont-mediated suppression of host innate immune response
  supported_by:
  - reference_id: PMID:15331713
    supporting_text: NSs, unlike other viral IFN antagonists, does not inhibit IFN-specific
      transcription factors but blocks IFN gene expression at a subsequent step
  - reference_id: PMID:16501102
    supporting_text: accumulation of beta interferon mRNA occurred after infection by these
      NSs deletion mutants, but not after infection by MP-12
  - reference_id: PMID:22532687
    supporting_text: In mouse fibroblast-like cells, L929 cells, IFN-β secretion in SeV V −
      infection was much greater than that in SeV WT infection
suggested_questions:
- question: >-
    Should a symbiont-mediated interferon-production term coexist with the sensor-specific
    induction terms on the same gene product? The proposed term now has three cases, and
    Sendai virus V is both sensor-directed (GO:0039540, GO:0039548, accepted by direct
    assay in that review) and in need of a term for its production phenotype, which
    settles the earlier worry that all the cases were transcription-shutdown viruses. It
    raises the converse question: if the production term is warranted wherever interferon
    output is separately measured, it will layer over much of the induction branch. That is
    a scoping decision for the ontology editors, not something this review can settle, and
    it should be put to them with the request rather than discovered afterwards.
- question: >-
    NSs-directed degradation of TFIIH p62 proceeds when cullin 1, cullin 7 and Rbx1 are
    individually knocked down, yet requires FBXO3 and SKP1. What is the catalytic core of
    the ligase that NSs assembles, and is it a canonical SCF at all?
  experts:
  - Friedemann Weber
  - Markus Kainulainen
  - Andreas Pichlmair
- question: >-
    NSs uses the same OmegaXaV motif to bind p62/GTF2H1 and FBXW11. How is the choice
    between the TFIIH-directed and the PKR-directed complex made, and does it reduce simply
    to the nuclear versus cytoplasmic pool of NSs?
  experts:
  - James G. Omichinski
  - Tetsuro Ikegami
- question: >-
    Are the amyloid-like nuclear filaments an active sink that sequesters p44 and XPB, or a
    by-product of NSs overaccumulation? Mutations that abolish filaments (Phe261, Arg164)
    also abolish p62 degradation, which leaves the two possibilities entangled.
  experts:
  - Eliette Bonnefoy
  - Pierre-Yves Lozach
- question: >-
    Does NSs affect interferon-stimulated gene induction downstream of the type I
    interferon receptor at all, beyond the global polymerase II block? Answering this would
    settle whether any symbiont-mediated interferon-signalling term applies to NSs.
  experts:
  - Friedemann Weber
  - Michele Bouloy
suggested_experiments:
- hypothesis: >-
    NSs blocks type I interferon production but does not interfere with signalling
    downstream of the type I interferon receptor.
  description: >-
    In cells expressing NSs alone (not infected, to avoid other viral products), compare
    two readouts side by side: induction of the interferon-beta gene after poly(I:C)
    stimulation, and induction of a panel of interferon-stimulated genes after addition of
    exogenous recombinant interferon-beta. Use nascent-transcript measurement (4sU or
    TT-seq) rather than steady-state mRNA so that the global transcription block can be
    normalised out, and include a transcription-competent NSs mutant such as clone 13 NSs
    and a filament-deficient but p62-degradation-competent mutant as controls. STAT1
    phosphorylation and nuclear translocation should be scored in parallel. If
    interferon-receptor signalling is intact and only interferon-beta induction fails, the
    proposed production term is the correct annotation and the signalling terms should be
    retired for this protein.
  experiment_type: nascent transcriptomics with interferon stimulation and phospho-STAT1
    immunoblotting
- hypothesis: >-
    NSs is dispensable for RVFV genome replication itself, and the growth defect of
    delta-NSs viruses is entirely interferon-dependent.
  description: >-
    Measure viral genome, antigenome and mRNA synthesis directly, by strand-specific
    quantitative RT-PCR and by metabolic labelling of viral RNA, for MP-12 and for
    delta-NSs MP-12 in interferon-competent MRC-5 cells, in the same cells after
    knockout of IFNAR1 or of MAVS, and in Vero cells. A minireplicon assay with L and N
    supplied in trans, with and without NSs, gives the cleanest version: if NSs
    contributed to RNA synthesis, adding it should raise minireplicon output in an
    interferon-null background. This directly tests the annotation that this review
    removes.
  experiment_type: strand-specific RT-qPCR and L/N minireplicon assay in IFNAR1- and
    MAVS-knockout cells
- hypothesis: >-
    The nuclear filaments sequester TFIIH subunits and are not merely an aggregation
    by-product.
  description: >-
    Combine fluorescence recovery after photobleaching on GFP-tagged p44 and XPB in cells
    containing NSs filaments with quantitative imaging of the free versus
    filament-associated pools, and with a filament-disrupting but p62-binding NSs variant.
    Cross-linking mass spectrometry of purified filaments would establish which TFIIH
    subunits are physically incorporated and in what stoichiometry. The prediction is that
    free p44 and XPB are depleted in proportion to filament mass, and recover when
    filaments are dissolved.
  experiment_type: FRAP and cross-linking mass spectrometry of nuclear filaments
