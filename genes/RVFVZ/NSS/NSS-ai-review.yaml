    reference_section_type: ABSTRACT
- id: PMID:15331713
  title: NSs protein of Rift Valley fever virus blocks interferon production by inhibiting
    host gene transcription.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only; figure-level reading was done in PMC514997 for
      judgment and is reported in NSS-notes.md rather than quoted. Two CACAO rows cite this
      paper. The paper supports the general host-transcription term squarely, and supports
      interferon antagonism at the level of production rather than of interferon-mediated
      signalling, which is why the GO:0039502 row from it is modified rather than accepted.
  findings:
  - statement: NSs alone is sufficient to block interferon-beta gene expression
      transcriptionally
    supporting_text: we demonstrate that NSs is sufficient to block IFN-beta gene expression
      at the transcriptional level
    reference_section_type: ABSTRACT
  - statement: Anti-interferon activity requires nuclear NSs; mutants that stay cytoplasmic
      lose it
    supporting_text: In contrast, mutant forms of NSs that had lost their IFN-inhibiting
      activity remained in the cytoplasm, indicating that nuclear localization plays a role
    reference_section_type: ABSTRACT
  - statement: IRF-3, NF-kappaB and AP-1 are activated normally in the presence of NSs, so
      the block is not on interferon-specific transcription factors
    supporting_text: In the presence of NSs, IRF-3 was still activated and moved to the
      nucleus. Likewise, NF-kappaB and AP-1 were activated normally, as shown in
      electrophoretic mobility shift assays
    reference_section_type: ABSTRACT
  - statement: NSs inhibits a constitutive promoter, consistent with a general TFIIH-based
      transcription block
    supporting_text: NSs was found to inhibit transcriptional activity of a constitutive
      promoter, in agreement with recent findings showing that NSs targets the basal
      cellular transcription factor TFIIH
    reference_section_type: ABSTRACT
  - statement: The authors conclude the block is on interferon gene expression, not on
      interferon-specific signalling
    supporting_text: NSs, unlike other viral IFN antagonists, does not inhibit IFN-specific
      transcription factors but blocks IFN gene expression at a subsequent step
    reference_section_type: ABSTRACT
- id: PMID:16501102
  title: Rescue of infectious rift valley fever virus entirely from cDNA, analysis of virus
    lacking the NSs gene, and expression of a foreign gene.
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      The identifier and title are correct and the paper is highly relevant, so the problem
      is not the citation itself but one of the three CACAO annotations drawn from it:
      GO:0039689 negative stranded viral RNA replication is contradicted by the paper's own
      abstract, which reports that NSs-deletion mutants replicated efficiently in Vero and
      293 cells. MISCITED is recorded for that use; the GO:0039502 and GO:0039657 rows from
      the same paper are properly grounded in it. Cached record is abstract-only, and the
      abstract alone is sufficient to adjudicate. PMC1395455 exists but returned no full
      text through the PubMed Central interface.
  findings:
  - statement: Viruses lacking part or all of the NSs open reading frame are viable and
      replicate efficiently in interferon-incompetent cells
    supporting_text: Mutants of MP-12 partially or completely lacking the NSs open reading
      frame were viable. These NSs deletion mutants replicated efficiently in Vero and 293
      cells, but not in MRC-5 cells
    reference_section_type: ABSTRACT
  - statement: Interferon-beta mRNA accumulates after infection with NSs-deletion mutants
      but not with the parental virus
    supporting_text: accumulation of beta interferon mRNA occurred after infection by these
      NSs deletion mutants, but not after infection by MP-12
    reference_section_type: ABSTRACT
  - statement: NSs is required for shutoff of host protein synthesis
    supporting_text: The NSs deletion mutants formed larger plaques than MP-12 did in Vero
      E6 cells and failed to shut off host protein synthesis in Vero cells
    reference_section_type: ABSTRACT
  - statement: Expressing NSs from a plasmid blocked rescue of infectious virus, the
      opposite of a replication requirement
    supporting_text: whereas NSs protein expression abolished virus rescue
    reference_section_type: ABSTRACT
- id: PMID:24403578
  title: Virulence factor NSs of rift valley fever virus recruits the F-box protein FBXO3
    to degrade subunit p62 of general transcription factor TFIIH.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only, but the abstract and the IMPORTANCE paragraph state
      the FBXO3 interaction, the siRNA rescue of p62, the tenfold rise in interferon
      transcription and the nuclear-pool specificity, which is everything the three UniProt
      rows citing it need. Verified against UniProt reference 11, which records INTERACTION
      WITH HOST FBXO3 ISOFORMS 1 AND 2 from this paper.
  findings:
  - statement: FBXO3, a subunit of E3 ubiquitin ligases, is a host interactor of NSs
    supporting_text: we identified a subunit of E3 ubiquitin ligases, F-box protein FBXO3,
      as a host cell interactor of NSs
    reference_section_type: ABSTRACT
  - statement: Depleting FBXO3 rescues p62 and raises interferon transcription tenfold
    supporting_text: Small interfering RNA (siRNA)-mediated depletion of FBXO3 rescued p62
      protein levels in RVFV-infected cells and elevated IFN transcription by 1 order of
      magnitude
    reference_section_type: ABSTRACT
  - statement: SKP1 knockdown also protects p62, implicating an SCF-type ligase
    supporting_text: siRNA knockdown of Skp1 also protected p62 from degradation, suggesting
      involvement in NSs action
    reference_section_type: ABSTRACT
  - statement: Cullin 1, cullin 7 and Rbx1 knockdowns did not rescue p62, so the ligase
      composition is atypical
    supporting_text: However, knockdown of cullin 1, cullin 7, or Rbx1 could not rescue p62
      degradation by NSs
    reference_section_type: ABSTRACT
  - statement: NSs removes specifically the nuclear pool of full-length FBXO3, consistent
      with acting in the nucleus
    supporting_text: NSs exclusively removes the nuclear pool of full-length FBXO3, likely
      due to consumption during the degradation process
    reference_section_type: ABSTRACT
  - statement: NSs blocks transcriptional upregulation of type I interferons and destroys
      TFIIH p62 via the ubiquitin-proteasome pathway
    supporting_text: RVFV NSs blocks transcriptional upregulation of antiviral type I
      interferons (IFN) and destroys the general transcription factor TFIIH subunit p62 via
      the ubiquitin/proteasome pathway
    reference_section_type: ABSTRACT
- id: PMID:25918396
  title: A ΩXaV motif in the Rift Valley fever virus NSs protein is essential for degrading
    p62, forming nuclear filaments and virulence.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only. Verified against UniProt reference 16, which records
      STRUCTURE BY NMR OF 247-265, INTERACTION WITH HOST GTF2H1, DOMAIN, MUTAGENESIS OF
      PHE-261 and SUBCELLULAR LOCATION from this paper; the subcellular-location rows for
      both nucleus and cytoplasm that cite it are therefore well grounded even though the
      abstract alone does not mention the cytoplasm.
  findings:
  - statement: Nuclear filament formation depends on the NSs-TFIIH interaction and is
      central to virulence
    supporting_text: A key component of RVFV virulence is its ability to form nuclear
      filaments through interactions between the viral nonstructural protein NSs and the
      host general transcription factor TFIIH
    reference_section_type: ABSTRACT
  - statement: A OmegaXaV motif in NSs binds the p62 subunit of TFIIH, mimicking host NER
      and transcription factors
    supporting_text: we identify an interaction between a ΩXaV motif in NSs and the p62
      subunit of TFIIH
    reference_section_type: ABSTRACT
  - statement: The motif is required for both filament formation and p62 degradation in
      infected cells
    supporting_text: Functional studies in RVFV-infected cells show that the ΩXaV motif is
      required for both nuclear filament formation and degradation of p62
    reference_section_type: ABSTRACT
  - statement: The motif is absent from the NSs proteins of other bunyaviruses, matching
      the RVFV-specific filament phenotype
    supporting_text: the motif is absent in the NSs proteins of other Bunyaviridae-family
      viruses
    reference_section_type: ABSTRACT
- id: PMID:33087469
  title: The NSs Protein Encoded by the Virulent Strain of Rift Valley Fever Virus Targets
    the Expression of Abl2 and the Actin Cytoskeleton of the Host, Affecting Cell Mobility,
    Cell Shape, and Cell-Cell Adhesion.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text is cached. Supports both SigSci EXP rows, which are kept as non-core
      because the paper's own mechanism routes the cytoskeletal and junctional effects
      through loss of Abl2 induction, i.e. through the gene-expression block, rather than
