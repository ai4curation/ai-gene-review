      identified here as part of the antiviral response
    reference_section_type: ABSTRACT
  - statement: NSs expression reduces lamellipodia and cell spreading and dissolves
      adherens junctions in hepatocytes
    supporting_text: strong changes in cell morphology in nonmigrating hepatocytes, with
      reduction of lamellipodia, cell spreading, and dissolution of adherens junctions
    reference_section_type: ABSTRACT
  - statement: The comparison used NSs-expressing ZH548 and MP12 against the non-expressing
      ZH548 delta-NSs strain, plus ectopic NSs expression
    supporting_text: while conducting infections with the NSs-expressing virulent (ZH548)
      and attenuated (MP12) strains of RVFV and the non-NSs-expressing avirulent
      (ZH548ΔNSs) strain, as well as after the ectopic expression of NSs
    reference_section_type: ABSTRACT
- id: PMID:7108491
  title: Identification of a major non-structural protein in the nuclei of Rift Valley
