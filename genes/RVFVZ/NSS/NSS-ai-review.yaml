- term:
    id: GO:0039602
    label: symbiont-mediated suppression of host transcription initiation from RNA
      polymerase II promoter
  evidence_type: IDA
  original_reference_id: PMID:14980221
  qualifier: involved_in
  review:
    summary: >-
      CACAO row, and the best of the six. The paper demonstrates that RVFV infection
      collapses host RNA synthesis in step with falling TFIIH levels, and that NSs
      interacts with the p44 subunit of TFIIH, forms nuclear filaments that also contain
      XPB, competes with XPD for p44, and thereby prevents TFIIH assembly. TFIIH is a
      general RNA polymerase II transcription factor required for promoter opening and
      preinitiation-complex function, so disabling it suppresses transcription initiation
      from polymerase II promoters.
    action: ACCEPT
    reason: >-
      The CACAO term matches the assay and the mechanism, and is at the right granularity:
      the paper identifies the specific target (TFIIH) rather than merely reporting a
      transcriptional phenotype, which is what licenses the polymerase II initiation term
      over a vaguer one. Yeast two-hybrid, recombinant reconstitution and confocal
      microscopy are cited in the abstract, so the IDA code is defensible; the only
      caveat is that the host RNA synthesis measurement is made on infected cells rather
      than on NSs alone, with the attribution to NSs coming from the interaction and
      sequestration experiments. This is a core function of the protein.
    supported_by:
    - reference_id: PMID:14980221
      supporting_text: infection by RVFV leads to a rapid and drastic suppression of host
        cellular RNA synthesis that parallels a decrease of the TFIIH transcription factor
        cellular concentration
    - reference_id: PMID:14980221
      supporting_text: By competing with XPD, the natural partner of p44 within TFIIH, and
        sequestering p44 and XPB subunits, NSs prevents the assembly of TFIIH subunits
