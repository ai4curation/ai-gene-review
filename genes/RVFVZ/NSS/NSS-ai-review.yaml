    reason: >-
      Directly demonstrated, by immunofluorescence on both infected cells and cells
      expressing NSs alone, and in the compartment where the protein's TFIIH-directed
      activity takes place. This is a core location, not an incidental one: the cached full
      text is available for this reference and supports the claim.
    supported_by:
    - reference_id: PMID:10233964
