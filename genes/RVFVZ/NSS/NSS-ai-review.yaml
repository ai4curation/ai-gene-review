  review:
    summary: >-
      Keyword-derived molecular function from KW-1102 (Inhibition of host PKR by virus).
      NSs does antagonise PKR, but not by the mechanism this term describes: GO:0030291 is
      defined as binding to and reducing the activity of a protein serine/threonine
      kinase, whereas NSs binds PKR and recruits the F-box protein FBXW11 so that PKR is
      destroyed by the proteasome. The activity NSs has is substrate-recognition adaptor
      activity for a ubiquitin ligase.
