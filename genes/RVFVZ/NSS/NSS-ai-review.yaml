    supporting_text: A non-structural protein of mol. wt. 34 X 10(3) was demonstrated in
      the nuclei of Rift Valley fever virus-infected Vero cells
    reference_section_type: ABSTRACT
  - statement: The nuclear protein corresponds to the virus-induced antigen seen in
