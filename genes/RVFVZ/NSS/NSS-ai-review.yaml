    correctness: VERIFIED
    review_notes: >-
      Cached record is abstract-only; a 1982 short communication. It is the original
      demonstration of NSs in infected-cell nuclei and is cited by UniProt as reference 4
      for SUBCELLULAR LOCATION. Relevance is MEDIUM rather than HIGH because it predates
