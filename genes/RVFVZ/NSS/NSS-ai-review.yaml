        from forming filaments but does not affect its nuclear localization
    - reference_id: PMID:10233964
      supporting_text: we expressed NSs in mammalian cells via a recombinant Semliki Forest
        virus and demonstrated that the protein alone was able to form structures similar
        to those observed in RVF virus-infected cells
