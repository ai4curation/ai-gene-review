id: P21698
gene_symbol: NSS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:11589
  label: Rift valley fever virus (STRAIN ZH-548 M12)
description: >-
  NSs is the 265-residue nonstructural protein encoded by the genomic-sense open reading
  frame of the ambisense S segment of Rift Valley fever virus, and the virus's principal
  virulence factor. It is not part of the replication machinery: genome replication is
  carried out by the L polymerase and the N nucleoprotein, and viruses lacking the NSs
  open reading frame replicate normally in interferon-incompetent cells. Instead, NSs
  works as a substrate-recognition adaptor that redirects host SCF ubiquitin ligases onto
  host antiviral proteins. In the host nucleus, a C-terminal OmegaXaV motif docks NSs onto
  the p62/GTF2H1 subunit of the general transcription factor TFIIH and recruits the F-box
  protein FBXO3 together with SKP1, destroying p62 by the ubiquitin-proteasome pathway;
  NSs additionally competes with XPD for the p44 subunit and self-assembles into
  amyloid-like nuclear filaments that sequester p44 and XPB, so that TFIIH cannot be
  assembled. The resulting loss of TFIIH shuts down host RNA polymerase II transcription
  initiation globally, which is the mechanism by which NSs prevents induction of the
  interferon-beta gene while leaving the IRF-3, NF-kappaB and AP-1 transcription factors
  themselves fully activated. In the host cytoplasm, NSs binds the double-stranded
  RNA-activated protein kinase EIF2AK2/PKR and recruits FBXW11, degrading PKR and so
  preventing eIF2-alpha phosphorylation and preserving translation. Secondary consequences
  of the transcriptional block include failure of the antiviral upregulation of Abl2, with
  loss of lamellipodia, altered cell shape and motility, and dissolution of adherens
  junctions. NSs is the only RVFV protein that accumulates in the nucleus, which is
  unusual for a virus whose replication cycle is entirely cytoplasmic.
