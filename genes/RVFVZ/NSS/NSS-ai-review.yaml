    reason: >-
      The underlying biology (loss of host PKR activity, with consequent loss of
      eIF2-alpha phosphorylation) is right, but the molecular function is mis-assigned.
      UniProt's own curated FUNCTION statement describes degradation, not occupancy-based
      inhibition, and the same adaptor activity accounts for the parallel destruction of
      TFIIH p62 through FBXO3. GO:1990756 ubiquitin-like ligase-substrate adaptor activity
      is the activity actually enabled, and is a descendant of the GO:0030674 term that
      UniProt already annotates to this protein by IDA, so the two molecular-function rows
      converge on one claim. This is a lateral correction of the keyword mapping rather
      than a refinement, so the replacement is not a descendant of GO:0030291.
