- term:
    id: GO:0039502
    label: symbiont-mediated suppression of host type I interferon-mediated signaling
      pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-1114
  review:
    summary: >-
      Keyword-derived from KW-1114 (Inhibition of host interferon signaling pathway by
      virus). NSs is a genuine type I interferon antagonist, but it acts on interferon
      production, not on interferon-mediated signalling: GO:0039502 is defined as
      interference with type I interferon-mediated signalling in the host, i.e. the
      receptor to JAK/STAT to ISG axis.
    action: MODIFY
    reason: >-
      The branch is wrong for this protein, and the same is true of every row in this
      review on this axis, so they are treated consistently. There is, however, no
      symbiont-mediated counterpart of GO:0032480 negative regulation of type I interferon
      production: a QuickGO search returns only GO:0039502, GO:0140884, GO:0140885 and
      GO:0140886 as symbiont-mediated interferon terms, all of them signalling-pathway
      terms. The replacement is therefore a proposed new term rather than an existing one.
      This is a consortium-wide convention, not an error of this annotation: influenza A
      NS1 (P03496), the textbook interferon-induction antagonist, carries GO:0039502 only
      through this same KW-1114 mapping.
    proposed_replacement_terms:
    - id: NTR
      label: symbiont-mediated suppression of host type I interferon production
    supported_by:
    - reference_id: PMID:15331713
      supporting_text: NSs, unlike other viral IFN antagonists, does not inhibit
        IFN-specific transcription factors but blocks IFN gene expression at a subsequent
        step
- term:
    id: GO:0039502
    label: symbiont-mediated suppression of host type I interferon-mediated signaling
      pathway
  evidence_type: IMP
  original_reference_id: PMID:15331713
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. What the paper shows is that NSs expressed alone abolishes induction of the
      interferon-beta gene, measured as IFN-beta transcripts and as IFN-beta
      promoter-reporter activity, and that NSs mutants that remain cytoplasmic lose this
      activity. The IMP basis is sound: the comparison is wild-type NSs against the
      attenuated clone 13 NSs and against deletion/substitution mutants. None of the assays
      interrogates signalling downstream of the interferon receptor.
    action: MODIFY
    reason: >-
      The claim is true as interferon antagonism but sits in the wrong branch. The paper's
      own conclusion is explicitly that the block is not at the level of interferon-specific
      signalling or transcription factors: IRF-3 still dimerises and translocates, NF-kappaB
      and AP-1 are activated normally by electrophoretic mobility shift assay, and a
      constitutive promoter is inhibited too. In other words the datum is suppression of
      interferon production as a special case of a general host transcription block, which
      this review accepts separately on GO:0039653 from the same paper. The term is
      therefore the wrong granularity and the wrong branch rather than unsupported, and
      because GO has no symbiont-mediated interferon-production term the replacement is a
      proposed new term. The GONUTS record could not be checked: the wiki pages for this
      PMID return "This site is temporarily offline while we perform upgrades" and the
      Internet Archive holds no snapshot. The cached publication is abstract-only, so
      figure-level reading was done in PMC (PMC514997): IFN-beta promoter luciferase in 293
      cells (Figs. 1D, 3A, 3C), IFN-beta RT-PCR and Northern blot (Figs. 1A, 1B),
      cytoplasmic NSs mutants losing inhibition (Fig. 5A) and a CMV-driven reporter
      suppressed (Figs. 3B, 5B).
    proposed_replacement_terms:
    - id: NTR
      label: symbiont-mediated suppression of host type I interferon production
    supported_by:
    - reference_id: PMID:15331713
      supporting_text: we demonstrate that NSs is sufficient to block IFN-beta gene
        expression at the transcriptional level
    - reference_id: PMID:15331713
      supporting_text: In the presence of NSs, IRF-3 was still activated and moved to the
        nucleus
