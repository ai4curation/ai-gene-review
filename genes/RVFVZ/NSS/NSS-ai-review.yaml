      of TFIIH to form nuclear filamentous structures that also contain XPB subunit of
      TFIIH
    reference_section_type: ABSTRACT
  - statement: NSs competes with XPD for p44 and sequesters p44 and XPB, preventing TFIIH
      assembly
    supporting_text: By competing with XPD, the natural partner of p44 within TFIIH, and
