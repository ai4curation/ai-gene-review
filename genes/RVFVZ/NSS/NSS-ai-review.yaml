- term:
    id: GO:0039689
    label: negative stranded viral RNA replication
  evidence_type: IMP
  original_reference_id: PMID:16501102
  qualifier: involved_in
  review:
    summary: >-
      CACAO row, and the one row in this GOA set that the cited paper does not support. The
      term asserts that NSs takes part in replication of the negative-sense RNA genome. The
      paper's central finding is the opposite: mutants lacking part or all of the NSs open
      reading frame were viable and replicated efficiently in Vero and 293 cells, and
      expressing NSs from a protein-expression plasmid actually abolished rescue of
      infectious virus. The only replication defect reported is in MRC-5 cells and is
      interferon-dependent, i.e. a consequence of the immune evasion failing, not of a
      missing replication factor.
    action: REMOVE
    reason: >-
      Genome replication in a phlebovirus is performed by the L protein (the RNA-dependent
      RNA polymerase) and the N nucleoprotein, which encapsidates the template. NSs
      contributes none of the work of RNA synthesis: it neither catalyses a step nor
      supplies structure or cofactor activity that a step of replication depends on, and
      it is not a component of the ribonucleoprotein. What the paper establishes is a
      conditional requirement for NSs for virus growth in interferon-competent cells,
      which is necessity for an outcome rather than participation in the process, and even
      that necessity is absent in the cell lines where replication was measured. Removal
      here does not rest on second-guessing a curator's reading of a full text: the cached
      abstract itself states that the deletion mutants replicated efficiently, so the
      annotation is contradicted by its own cited source. The GONUTS page for this PMID
      could not be consulted (gowiki.tamu.edu returns "This site is temporarily offline
      while we perform upgrades" and the Internet Archive has no snapshot), so the
      student's recorded rationale is unavailable; the judgment rests on the paper and on
      the division of labour among the viral proteins. For the CACAO failure taxonomy this
      is a distinct shape from "phenotype read as process": a viral fitness or growth
      requirement read as participation in genome replication.
    supported_by:
    - reference_id: PMID:16501102
      supporting_text: Mutants of MP-12 partially or completely lacking the NSs open
        reading frame were viable. These NSs deletion mutants replicated efficiently in
        Vero and 293 cells, but not in MRC-5 cells
    - reference_id: PMID:16501102
      supporting_text: whereas NSs protein expression abolished virus rescue
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: GO_ID
      asserted_value: GO:0039689
      requested_change: DELETE_ROW
      confidence: CONFIRMED
      explanation: >-
        The GOA row UniProtKB:P21698 involved_in GO:0039689 negative stranded viral RNA
        replication (IMP, PMID:16501102, assigned by CACAO, 2014-04-02) asserts that the
        RVFV NSs protein participates in replication of the negative-sense viral genome.
        The cited reference reports the opposite: mutants of MP-12 lacking part or all of
        the NSs open reading frame were viable and replicated efficiently in Vero and 293
        cells, and expression of NSs from a protein-expression plasmid abolished rescue of
        infectious virus. The reduced growth of the deletion mutants in MRC-5 cells is
        interferon-dependent and reflects loss of immune evasion, not loss of a replication
        factor; genome replication is carried out by the L polymerase and the N
        nucleoprotein. The row should be deleted rather than re-pointed, since the paper
        supports no replication term for NSs. The responsible group is CACAO, which is not
        a value of this schema's resource enumeration, hence OTHER.
      supported_by:
      - reference_id: PMID:16501102
        supporting_text: Mutants of MP-12 partially or completely lacking the NSs open
          reading frame were viable. These NSs deletion mutants replicated efficiently in
          Vero and 293 cells, but not in MRC-5 cells
      - reference_id: PMID:16501102
        supporting_text: whereas NSs protein expression abolished virus rescue
- term:
    id: GO:0042025
    label: host cell nucleus
  evidence_type: EXP
  original_reference_id: PMID:10233964
  qualifier: located_in
  review:
    summary: >-
      Nuclear localisation of NSs, from the paper that mapped its determinants. NSs
      expressed alone from a recombinant Semliki Forest virus forms the same nuclear
      filaments seen in infected cells, and deleting the acidic C-terminal domain abolishes
      filaments without affecting nuclear import, so the two properties are separable and
