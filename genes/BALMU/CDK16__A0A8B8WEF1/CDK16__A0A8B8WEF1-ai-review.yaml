- term:
    id: GO:0031175
    label: neuron projection development
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000623744
  review:
    summary: This term comes from the CDK16-specific PAINT node, seeded by mouse
      Cdk16. In rodent neurons, PCTAIRE1 sits at neurites and growth cones, and
      knocking it down abolishes dendrite development. CDK5 phosphorylates
      PCTAIRE1 at Ser95, and the phospho-deficient S95 mutant reduces dendrite
      complexity. Overexpressing PCTAIRE-1 variants changes neurite outgrowth in
      Neuro-2A cells. CDK16 also acts downstream of MRTF/SRF in a Cdk5-Pctaire1
      kinase cascade that controls neurite outgrowth.
    action: KEEP_AS_NON_CORE
    reason: The PAINT curators chose to propagate this term to the CDK16 clade,
      and the whale protein is inside that clade with Ser95 conserved. The
      evidence is cell-based and places CDK16 as a signalling kinase in neurons,
      so the term is kept, but as a context-specific role rather than the core
      biochemical function. Ser95 conservation is confirmed by the alignment.
    supported_by:
    - reference_id: PMID:21335063
      supporting_text: Knockdown of Pctaire1 abolishes dendrite development, and more
        importantly, expression of Ser95 phosphorylation-deficient mutant of Pctaire1
        also reduces dendrite complexity
    - reference_id: PMID:20534669
      supporting_text: Pctaire1 (Cdk16) kinase, which cooperates with Cdk5 to initiate
        a kinase cascade that governs cytoskeletal rearrangements essential for neuron
        migration and neurite outgrowth
    - reference_id: file:BALMU/CDK16__A0A8B8WEF1/CDK16__A0A8B8WEF1-bioinformatics/RESULTS.md
      supporting_text: Ser95 (CDK5 site)
- term:
    id: GO:0051726
    label: regulation of cell cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0004693
  review:
    summary: This term is inferred logically from the cyclin-dependent kinase MF
      term (GO_REF:0000108), not from any CDK16 data. CDK16 is not a cell-cycle
      engine CDK. Its main partner, cyclin Y, is a membrane-associated cyclin that
      does not oscillate in the classical way. The cell-cycle links are confined
      to cancer cell lines. They are p27 Ser10 phosphorylation and mitotic defects
      after knockdown (Yanagi 2014), which were not seen in nontransformed cells,
      and PRC1 phosphorylation (Hernandez-Ortega 2019). Mice lacking CDK16 develop
      normally.
    action: MARK_AS_OVER_ANNOTATED
    reason: The inference rests on the MF label "cyclin-dependent" rather than on
      a cell-cycle role. The only cell-cycle data on CDK16 come from transformed
      cells, where knockdown effects were absent in nontransformed fibroblasts.
      Such data do not justify a general cell-cycle regulation term for the
      ortholog.
    supported_by:
    - reference_id: PMID:25205104
      supporting_text: PCTAIRE1 was not similarly involved in proliferation of nontransformed
        cells, including diploid human IMR-90 fibroblasts.
    - reference_id: PMID:22184064
      supporting_text: Mice lacking CDK16 developed normally, but male mice were infertile.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: file:BALMU/CDK16__A0A8B8WEF1/CDK16__A0A8B8WEF1-bioinformatics/RESULTS.md
  review:
    summary: Human CDK16 is recruited to the plasma membrane by its membrane-anchored
      partner cyclin Y. Forskolin (PKA activation) blocks this recruitment and
      kinase inhibition promotes it. Mouse CDK16 is also at the plasma membrane
      together with CCNYL1 in testis-derived cells. The whale protein conserves the
      cyclin-binding N-terminal extension and Ser153.
    action: NEW
    reason: This is a well-supported, functionally important location of the
      ortholog. It is missing from the whale GOA set because TreeGrafter does not
      propagate it. It is proposed by orthology within PANTHER SF174 (98% identity,
      no indels). The more specific term cytoplasmic side of plasma membrane
      (GO:0009898) has human IDA evidence but is not proposed here.
    supported_by:
    - reference_id: PMID:22184064
      supporting_text: a fraction of CDK16-GFP was recruited to the plasma membrane
    - reference_id: PMID:22184064
      supporting_text: Thus, CDK16 is a membrane-targeted CDK essential for spermatogenesis.
    - reference_id: file:BALMU/CDK16__A0A8B8WEF1/CDK16__A0A8B8WEF1-bioinformatics/RESULTS.md
      supporting_text: Ser153 (PKA site that blocks cyclin Y binding)
- term:
    id: GO:0000307
    label: cyclin-dependent protein kinase holoenzyme complex
  evidence_type: IEA
  original_reference_id: file:BALMU/CDK16__A0A8B8WEF1/CDK16__A0A8B8WEF1-bioinformatics/RESULTS.md
  review:
    summary: CDK16 is the catalytic subunit of a cyclin Y (or CCNYL1) holoenzyme,
      which 14-3-3 proteins further stabilise. The CDK16-CCNY-14-3-3 complex has
      been characterised structurally by cryo-EM. Native CDK16 from mouse testis
      co-purifies with cyclin Y.
    action: NEW
    reason: The complex is the active form of CDK16 in human and mouse and has
      direct biochemical and structural evidence. It is proposed for the whale
      ortholog on the basis of SF174 membership and conservation of the
      cyclin-binding N-terminal extension.
    supported_by:
    - reference_id: PMID:41857027
      supporting_text: CDK16 interacts with the cyclin box of CCNY, while 14-3-3 provides
        additional contacts, including with the activation segment of CDK16.
    - reference_id: PMID:22184064
      supporting_text: CDK16 isolated from murine testis was unphosphorylated, interacted
        with CCNY, and exhibited kinase activity.
