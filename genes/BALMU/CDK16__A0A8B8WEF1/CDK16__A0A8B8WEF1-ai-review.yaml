- term:
    id: GO:0006887
    label: exocytosis
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000623744
  review:
    summary: This TreeGrafter assignment comes from the CDK16-specific PAINT node
      PTN004656776, seeded by mouse Cdk16 (MGI:97516). The underlying experiment
      (Liu et al. 2006) shows that PCTAIRE1 phosphorylates NSF on Ser569, which
      limits NSF oligomerisation. Expressing kinase-dead PCTAIRE1 or an NSF S569A
      mutant in PC12 cells increased stimulated growth hormone release. So CDK16
      acts as a negative modulator of regulated exocytosis rather than as part of
      the fusion machinery.
    action: MODIFY
    reason: The PAINT node placement is sound, and the whale protein sits inside
      the CDK16 clade. But the evidence shows CDK16 modulating exocytosis by
      phosphorylating NSF, not carrying out membrane fusion itself. A regulation
      term describes this better. The direction of the effect (negative) rests on
      one PC12 study, so the replacement is the neutral parent, regulation of
      exocytosis.
    proposed_replacement_terms:
    - id: GO:0017157
      label: regulation of exocytosis
    supported_by:
    - reference_id: PMID:16461345
      supporting_text: expression of either Pctaire1-KD or NSF-S569A in PC12 cells
        significantly increases high K(+)-stimulated growth hormone release
    - reference_id: PMID:16461345
      supporting_text: Pctaire1 phosphorylation of NSF regulates the ability of NSF
        to oligomerize, implicating an unexpected role of this kinase in modulating
        exocytosis
- term:
    id: GO:0008021
    label: synaptic vesicle
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN000623744
  review:
    summary: Synaptic vesicle localisation from the CDK16 PAINT node, seeded by
      mouse Cdk16. The underlying evidence is that PCTAIRE1 co-associates with NSF
      and synaptic vesicle proteins in adult rat brain. In mature hippocampal
      neurons it also forms puncta that co-localise with a synaptic marker. Neither
      result shows CDK16 as a resident synaptic vesicle protein.
    action: MARK_AS_OVER_ANNOTATED
    reason: The evidence is co-association and co-localisation at synapses, not
      purification with synaptic vesicles. A resident "located in synaptic vesicle"
      claim goes beyond it. CDK16 is mostly a cytoplasmic, membrane-recruited
      kinase found in many cell types.
    supported_by:
    - reference_id: PMID:16461345
      supporting_text: Pctaire1 associates with NSF and synaptic vesicle-associated
        proteins in adult rat brain
    - reference_id: PMID:21335063
      supporting_text: Pctiare1 is expressed as puncta and co-localized with synaptic
        marker in dendrites
