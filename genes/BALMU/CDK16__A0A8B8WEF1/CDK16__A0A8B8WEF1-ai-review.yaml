id: A0A8B8WEF1
gene_symbol: CDK16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:9771
  label: Balaenoptera musculus
description: >-
  CDK16 (PCTAIRE-1, PCTK1) of the blue whale is a 496-residue atypical member of the
  cyclin-dependent kinase family (CMGC group, PCTAIRE subfamily). It has a
  disordered N-terminal extension carrying regulatory phosphorylation sites, a
  central Ser/Thr protein kinase domain, and a short C-terminal tail. It is
  colinear with human CDK16 isoform 1 and 98% identical to it, and it keeps the
  ATP-binding lysine, the HRD catalytic aspartate, the DFG motif and every
  regulatory serine studied in human and rodent CDK16. Nothing has been tested
  experimentally in whale. All of its function is inferred from mammalian
  orthologs in the same PANTHER subfamily (PTHR24056:SF174). In human and rodent
  CDK16, the kinase is activated by membrane-associated cyclin Y (CCNY) or cyclin
  Y-like 1 (CCNYL1) in a complex that needs phosphorylated cyclin Y bound to 14-3-3.
  Cyclin Y binding is blocked when PKA phosphorylates Ser153 in the N-terminal
  extension. The active complex is a proline-directed Ser/Thr kinase with an
  unusual preference for a basic residue at +4. Cyclin Y recruits CDK16 from the
  cytoplasm to the inner face of the plasma membrane. Proposed substrates include
  NSF, p27/CDKN1B, PRC1, AAK1 and WIPI2B. Through these, CDK16 has been linked to
  regulated exocytosis, neurite and dendrite development, AMPK-driven autophagy,
  mitotic progression in cancer cells and, in mice, male fertility and
  spermatogenesis.
