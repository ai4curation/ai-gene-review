- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN000623744
  review:
    summary: TreeGrafter location inherited from deep CDK nodes of PTHR24056, where
      most cell-cycle and transcriptional CDKs are nuclear. Experimental studies of
      mammalian CDK16 put it in the cytoplasm throughout the cell cycle and,
      with cyclin Y, at the plasma membrane. In the Mikolcevic yeast two-hybrid
      screen, the nuclear candidate partners did not co-localise with CDK16.
    action: MARK_AS_OVER_ANNOTATED
    reason: No CDK16-specific evidence for nuclear localisation was found, and the
      direct studies describe a cytoplasmic and membrane protein. The term reflects
      the ancestral CDK location carried down the tree, not CDK16 biology. It is
      kept as over-annotated rather than removed, because small nuclear pools
      cannot be excluded.
    supported_by:
    - reference_id: PMID:10511311
      supporting_text: Indirect immunofluorescence indicated that PCTAIRE-1 exhibits
        cytoplasmic distribution throughout the cell cycle.
    - reference_id: PMID:22184064
      supporting_text: When expressed as YFP-tagged proteins, none of these cyclins
        and cyclin-like proteins localized like CDK16-GFP, which, like the endogenous
        protein, was cytoplasmatic
