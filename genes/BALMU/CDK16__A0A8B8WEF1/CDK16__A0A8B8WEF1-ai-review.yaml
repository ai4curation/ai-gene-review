core_functions:
- description: Cyclin Y (CCNY/CCNYL1)- and 14-3-3-dependent, proline-directed
    Ser/Thr protein kinase. It is recruited to the inner face of the plasma
    membrane by its cyclin partner. Inferred for whale by orthology to
    experimentally characterised human and mouse CDK16 in PANTHER SF174.
  molecular_function:
    id: GO:0004693
    label: cyclin-dependent protein serine/threonine kinase activity
  in_complex:
    id: GO:0000307
    label: cyclin-dependent protein kinase holoenzyme complex
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0005886
    label: plasma membrane
  directly_involved_in:
  - id: GO:0017157
    label: regulation of exocytosis
  supported_by:
  - reference_id: PMID:22796189
    supporting_text: PCTAIRE-1 binds to a novel cyclin family member, cyclin Y, which
      increased PCTAIRE-1 activity towards PCTAIRE-tide >100-fold
  - reference_id: PMID:22184064
    supporting_text: we report that CDK16 is activated by membrane-associated cyclin
      Y (CCNY)
  - reference_id: PMID:41857027
    supporting_text: CDK16 activation also requires interactions of CCNY with the N-terminal
      extension of CDK16.
  - reference_id: PMID:16461345
    supporting_text: Pctaire1 phosphorylation of NSF regulates the ability of NSF to
      oligomerize, implicating an unexpected role of this kinase in modulating exocytosis
  - reference_id: file:BALMU/CDK16__A0A8B8WEF1/CDK16__A0A8B8WEF1-bioinformatics/RESULTS.md
    supporting_text: '487 identical positions: 98.19% identity over the full human
      sequence.'
suggested_questions:
- question: PAINT propagated synaptic vesicle, exocytosis and neuron projection
    development from mouse Cdk16 to the CDK16 node (PTN004656776). It did not
    propagate spermatogenesis, positive regulation of autophagy (human IDA,
    PMID:32098961) or the cyclin-dependent holoenzyme location. Were these
    omissions deliberate, for example because spermatogenesis is treated as an
    organismal phenotype and autophagy as a single-lab finding?
  experts:
  - PANTHER/PAINT curators
- question: Is "exocytosis" the right PAINT term for a kinase whose loss increases
    regulated secretion via NSF phosphorylation? Would "negative regulation of
    exocytosis" be more appropriate?
  experts:
  - PAINT curators
  - GO editors
suggested_experiments:
- description: Express whale CDK16 with whale CCNY in HEK293 cells, and measure
    PCTAIRE-tide phosphorylation with and without 14-3-3 binding-deficient CCNY
    mutants. Image membrane recruitment as well.
  experiment_type: in vitro kinase assay and live-cell imaging
  hypothesis: Whale CDK16 is a cyclin Y- and 14-3-3-dependent membrane-recruited
    kinase, like human CDK16, as its conserved sequence predicts.
