- id: PMID:22184064
  title: Cyclin-dependent kinase 16/PCTAIRE kinase 1 is activated by cyclin Y and
    is essential for spermatogenesis.
  findings:
  - statement: CDK16 is activated by membrane-associated cyclin Y. PKA
      phosphorylation of Ser153 blocks cyclin binding. Cdk16-null male mice are
      infertile.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached. Human cell and mouse knockout study. It is the
      key source for cyclin Y activation and membrane targeting.
- id: PMID:22796189
  title: Analysis of substrate specificity and cyclin Y binding of PCTAIRE-1 kinase.
  findings:
  - statement: PCTAIRE-1 is a proline-directed kinase with a +4 basic preference,
      and cyclin Y activates it more than 100-fold.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Recombinant human CDK16 kinetics. Direct MF evidence.
