- term:
    id: GO:0004693
    label: cyclin-dependent protein serine/threonine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - EC:2.7.11.22
  - PANTHER:PTN000623744
  review:
    summary: This is the core molecular function. In human and mouse CDK16, kinase
      activity depends on binding cyclin Y (or CCNYL1 in testis). Cyclin Y raises
      activity on the PCTAIRE-tide substrate more than 100-fold. Full activation
      also needs cyclin Y phosphorylation and 14-3-3 binding, and a 2026 cryo-EM
      study resolved the structure of the CDK16-CCNY-14-3-3 complex. CDK16 from
      mouse testis is bound to cyclin Y and is active. The whale protein is in the
      same PANTHER subfamily (SF174) and keeps the N-terminal extension needed for
      cyclin Y binding, including Ser153.
    action: ACCEPT
    reason: Supported by orthology. The whale sequence is colinear with human
      CDK16 and 98.19% identical, and every catalytic and cyclin-binding regulatory
      residue is conserved. Human and mouse CDK16 have direct evidence of
      cyclin-dependent activation. An early report (Graeser 2002) proposed that
      monomeric PCTAIRE-1 is active, but later reconstitution with cyclin Y and
      structural work outweigh it.
    supported_by:
    - reference_id: PMID:22184064
      supporting_text: we report that CDK16 is activated by membrane-associated cyclin
        Y (CCNY)
    - reference_id: PMID:22796189
      supporting_text: PCTAIRE-1 binds to a novel cyclin family member, cyclin Y,
        which increased PCTAIRE-1 activity towards PCTAIRE-tide >100-fold
    - reference_id: PMID:41857027
      supporting_text: 14-3-3 binding modulates the conformation of a key moiety of
        the CDK binding surface of CCNY, thereby enabling CDK16 activation
    - reference_id: file:BALMU/CDK16__A0A8B8WEF1/CDK16__A0A8B8WEF1-bioinformatics/RESULTS.md
      supporting_text: '487 identical positions: 98.19% identity over the full human
        sequence.'
