description: >-
  ProtNLM2 made no predictions (GO or subcellular location) for this blue whale
  protein and returned only the generic name "Protein kinase domain-containing protein".
  That name is correct but much less specific than the gene review, which identifies the
  product as an N-terminally shorter alternative-start isoform of CDK16 (PCTAIRE1), a
  PCTAIRE-group CMGC kinase that retains the complete kinase domain and catalytic residues
  and acts as a cyclin Y-activated cyclin-dependent protein serine/threonine kinase in the
  cytoplasm and at the cytoplasmic face of the plasma membrane. With no GO or location
  output there is nothing to score; the absence of predictions is recorded as assessed.
