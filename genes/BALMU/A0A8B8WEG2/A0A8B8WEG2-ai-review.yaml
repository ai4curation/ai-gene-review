- term:
    id: GO:0031175
    label: neuron projection development
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      PAINT seeded this term at the CDK16 node from mouse Cdk16. In hippocampal neurons,
      PCTAIRE1 is concentrated at growth cones; knockdown abolishes dendrite development,
      and a mutant that cannot be phosphorylated on Ser95 by CDK5 reduces dendrite
      complexity. Ser95 is conserved in this isoform (Ser20). The evidence is mainly
      perturbation, and the substrate through which CDK16 acts in this process is not known.
    action: KEEP_AS_NON_CORE
    reason: >-
      Supported by same-subfamily ortholog evidence, but a neuron-specific process to which
      the kinase contributes by an undefined mechanism; not the core function.
    supported_by:
    - reference_id: PMID:21335063
      supporting_text: Knockdown of Pctaire1 abolishes dendrite development
- term:
    id: GO:0051726
    label: regulation of cell cycle
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  review:
    summary: >-
      This row is inferred mechanically from GO:0004693 through an inter-ontology link,
      not from evidence on CDK16. The documented CDK16 functions are in post-mitotic and
      secretory cells (neurons, beta cells, sperm). Human CDK16 dissociates from CCNY in
      mitosis because of Ser153 phosphorylation. Human CDK16 does not currently receive a
      cell-cycle process IBA (the GO:1901987 IBA still listed in its UniProt record is
      absent from QuickGO). The cancer-cell substrate claims in the deep-research report
      have no references and were not verified.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      An ontology-link inference that assumes a canonical cell-cycle CDK role. The
      literature on this atypical PCTAIRE kinase does not establish that role.
    supported_by:
    - reference_id: PMID:22184064
      supporting_text: with respect to mitosis, we find that CDK16, in contrast to CDK14/PFTK, does not interact with CCNY due to phosphorylation of Ser153
