suggested_questions:
- question: >-
    Is the whale alternative-start isoform (A0A8B8WEG2, starting at the equivalent of human
    Met76) expressed as a protein, and does it differ from the full-length product in
    regulation, given that it lacks the Ser12 BRSK2 phosphorylation site?
- question: >-
    Should the TreeGrafter projection of the CDK16-node synaptic vesicle IBA keep the
    colocalizes_with qualifier of the source annotation?
suggested_experiments:
- description: >-
    Express the 421-residue whale isoform and full-length CDK16 with CCNY, and compare their
    kinase activity on PCTAIRE-tide or NSF, their CCNY binding and their recruitment to the
    plasma membrane.
