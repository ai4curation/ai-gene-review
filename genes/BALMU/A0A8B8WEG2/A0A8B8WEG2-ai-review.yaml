id: A0A8B8WEG2
gene_symbol: CDK16
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:9771
  label: Balaenoptera musculus
description: >-
  CDK16 (PCTAIRE1/PCTK1) is an X-linked atypical cyclin-dependent serine/threonine
  protein kinase of the PCTAIRE group (CDK16-18) in the CMGC kinase family. This
  421-residue blue whale product is an N-terminally shorter alternative-start isoform
  that corresponds to residues 76-496 of human CDK16 isoform 1. It keeps the complete
  kinase domain, the catalytic lysine and HRD aspartate, and every cyclin Y-binding
  element mapped in the human protein, but it lacks the N-terminal segment that carries
  the BRSK2 phosphorylation site Ser12. In mammals CDK16 is activated by the
  membrane-anchored cyclin Y (CCNY) and its relative CCNYL1. Cyclin binding requires a
  conserved part of the N-terminal extension as well as the kinase domain, and is blocked
  by phosphorylation of Ser153 (Ser78 in this isoform); 14-3-3 binding to phosphorylated
  cyclin Y also contributes to activation. Cyclin Y recruits the kinase from the cytoplasm
  to the cytoplasmic face of the plasma membrane. CDK16 prefers substrates with proline at
  +1 and a basic residue at +4. Its known substrates include NSF, whose phosphorylation
  limits NSF oligomerization and modulates regulated secretion, and the autophagy protein
  WIPI2B in neurons. CDK16 is most abundant in brain, testis and pancreatic islets. It
  contributes to dendrite development and neurotransmitter or hormone release, and male
  mice lacking it are infertile with defective sperm.
