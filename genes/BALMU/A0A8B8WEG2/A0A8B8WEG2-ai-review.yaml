- term:
    id: GO:0006887
    label: exocytosis
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      PAINT seeded exocytosis at the CDK16 node from the mouse Cdk16 IMP to PMID:16461345.
      That study shows that PCTAIRE1 phosphorylates NSF Ser569, which restrains NSF
      oligomerization. Kinase-dead PCTAIRE1 or NSF-S569A increased stimulated growth
      hormone release from PC12 cells. The kinase therefore modulates exocytosis through
      NSF; it is not part of the fusion machinery.
    action: MODIFY
    reason: >-
      The evidence describes a regulatory kinase acting on NSF, which fits regulation of
      exocytosis (GO:0017157) better than the process itself. The phylogenetic basis
      (same-subfamily mouse ortholog) is sound.
    proposed_replacement_terms:
    - id: GO:0017157
      label: regulation of exocytosis
    supported_by:
    - reference_id: PMID:16461345
      supporting_text: implicating an unexpected role of this kinase in modulating exocytosis
- term:
    id: GO:0008021
    label: synaptic vesicle
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      In the human and PAINT rows this term is colocalizes_with synaptic vesicle, based on
      rodent PCTAIRE1 associating with NSF and synaptic vesicle proteins in brain. The
      TreeGrafter row for this whale entry carries located_in instead. Rat PCTAIRE1 also
      appears as puncta that co-localize with a synaptic marker in mature dendrites.
      Association with synaptic vesicle proteins is plausible, but membership of the
      vesicle has not been shown.
    action: KEEP_AS_NON_CORE
    reason: >-
      A peripheral, neuron-specific association with synaptic vesicles, inherited from the
      same-subfamily mouse ortholog. The qualifier should be colocalizes_with, as at the
      PAINT node, not located_in.
    supported_by:
    - reference_id: PMID:16461345
      supporting_text: Pctaire1 associates with NSF and synaptic vesicle-associated proteins in adult
