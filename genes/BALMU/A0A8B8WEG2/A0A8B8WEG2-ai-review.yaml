- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      This TreeGrafter row comes from PTN000623744. In human CDK16 the matching
      nucleus IBA is seeded only by Arabidopsis CDKs, i.e. it reflects nuclear cell-cycle
      CDKs placed at a deep node. The direct evidence for mammalian CDK16 points to the
      cytoplasm: CDK16-GFP alone was found exclusively in the cytoplasm of 293A cells, and
      endogenous PCTAIRE1 is cytoplasmic in MIN6 beta cells. CCNY recruits it to the plasma
      membrane. The nuclear localization in the earlier version of this review came from
      an unreferenced deep-research statement.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Inherited from a deep CDK node and not supported by localization studies of CDK16
      orthologs, which show cytoplasmic and membrane-recruited protein.
    supported_by:
    - reference_id: PMID:22184064
      supporting_text: CDK16-GFP expressed alone in 293A cells was found exclusively in the cytoplasm
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: >-
      Mammalian CDK16 is cytoplasmic in transfected 293A cells and in MIN6 beta cells, and
      a fraction is recruited by myristoylated CCNY to the cytoplasmic face of the plasma
