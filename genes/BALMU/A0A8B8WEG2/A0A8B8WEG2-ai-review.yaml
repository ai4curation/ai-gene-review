- term:
    id: GO:0004693
    label: cyclin-dependent protein serine/threonine kinase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      A0A8B8WEG2 is in PANTHER subfamily PTHR24056:SF174 (CDK16) with human Q00536, mouse
      Q04735 and rat Q63686, and matches the CDD PCTAIRE1 kinase-domain model. Human and
      mouse CDK16 are activated by cyclin Y: CCNY binding increases activity more than
      100-fold, and the kinase-dead K194R mutant is not activated. The whale isoform lacks
      only the first 75 residues of human isoform 1. Human mapping showed that the first
      105 residues are dispensable for CCNY binding, and a recombinant CDK16 lacking its
      first 106 residues was active only with CCNY. All the mapped cyclin-binding elements
      (112-121, Ser119, Ser153, Gly158 and the C-terminal 461-473 segment) and the catalytic
      residues are conserved in this isoform
      (file:BALMU/A0A8B8WEG2/A0A8B8WEG2-bioinformatics/RESULTS.md).
    action: ACCEPT
    reason: >-
      The core activity of CDK16, carried over from orthologs in the same PANTHER subfamily
      with direct biochemical evidence. The cyclin-binding and catalytic determinants are
      present in this isoform.
    supported_by:
    - reference_id: file:BALMU/A0A8B8WEG2/A0A8B8WEG2-uniprot.txt
      supporting_text: DR   PANTHER; PTHR24056:SF174; CYCLIN-DEPENDENT KINASE 16; 1.
