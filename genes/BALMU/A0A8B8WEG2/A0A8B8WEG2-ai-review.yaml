core_functions:
- description: >-
    Cyclin Y-activated serine/threonine protein kinase. Together with CCNY (or CCNYL1) it
    forms a holoenzyme that phosphorylates substrates such as NSF and WIPI2B. It acts in the
    cytoplasm and at the cytoplasmic face of the plasma membrane, where cyclin Y recruits it.
