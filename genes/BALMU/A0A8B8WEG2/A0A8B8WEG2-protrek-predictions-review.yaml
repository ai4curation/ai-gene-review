    predicted_term:
      id: GO:0002945
      label: cyclin K-CDK13 complex
    predicted_term_type: GO_CC
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Top-ranked hit (score 18.65). CDK13 is a transcriptional CDK that phosphorylates the
        RNA polymerase II C-terminal domain in complex with cyclin K; CDK16 is a PCTAIRE
        kinase activated by cyclin Y at the plasma membrane and in the cytoplasm, with
        substrates PRC1, WIPI2B, Rb, p53 and p27Kip1. Naming a specific cyclin partner is the
        single most informative thing that can be said about a CDK, and the model asserts the
        wrong one with the benchmark's fourth-highest top-1 score.
      supported_by:
