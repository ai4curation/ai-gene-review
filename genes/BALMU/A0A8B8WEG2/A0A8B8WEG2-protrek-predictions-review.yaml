id: A0A8B8WEG2
gene_symbol: CDK16
taxon:
  id: NCBITaxon:27616
  label: Balaenoptera musculus
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for blue whale CDK16 (PCTAIRE1), an atypical
  cyclin-Y-activated CDK of post-mitotic cells. The model identifies the family
  confidently - all five top calls are cyclin/CDK terms, with scores from 18.65 to 16.59 -
  and reaches this review's exact core molecular function at rank 5. Its errors are
  within-family: ranks 1 and 2 assign the protein to the cyclin K-CDK13 and cyclin K-CDK12
  complexes, the transcriptional CDKs, when CDK16's partners are cyclin Y and cyclin Y-like
  1. With ~20 human CDKs sharing one kinase fold and differing mainly in their cyclin
  partner, that is the discrimination that matters, and the ranked list gets it wrong at
  the top and right at the bottom. ProtNLM2 made no GO prediction for this protein.
  Assessment: 0 correct novel (COR), 1 correct not novel (CNN), 0 less precise (LSP),
  0 uncertain (UNC), 2 incorrect (PLI).
