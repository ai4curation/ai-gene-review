  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0000308
      label: cytoplasmic cyclin-dependent protein kinase holoenzyme complex
    predicted_term_type: GO_CC
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        Rank 3 (score 17.40). Correct and appropriately specific: CDK16 does act as a
        cytoplasmic cyclin-CDK holoenzyme, which is precisely what distinguishes it from the
        nuclear transcriptional CDKs named at ranks 1 and 2. It is a strict descendant of the
        cytoplasm annotation already in GOA and matches this review's assigned location, so
        it is correct rather than novel. Notably the model produces the right general picture
        at rank 3 while asserting two incompatible specific complexes above it.
      supported_by:
        - reference_id: GO_REF:0000117
          supporting_text: Automatic annotation from ARBA rules
