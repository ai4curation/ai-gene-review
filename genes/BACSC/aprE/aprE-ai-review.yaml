core_functions:
- description: Secreted subtilisin-family serine endopeptidase. It hydrolyses internal
    peptide bonds of extracellular proteins and, redundantly with WprA and Vpr,
    removes the leader peptide from subtilin precursors in strain ATCC 6633.
