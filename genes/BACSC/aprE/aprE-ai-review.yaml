product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:703612
  label: Bacillus spizizenii ATCC 6633 = JCM 2499
description: aprE of Bacillus spizizenii ATCC 6633 (historically Bacillus subtilis
  ATCC 6633, the subtilin producer) encodes subtilisin, the major secreted alkaline
  serine endopeptidase of the peptidase S8 (subtilisin) family. The UniProt entry
  is a 228-residue internal fragment, translated from a PCR amplicon, that is about
  93% identical to the matching region of Bacillus subtilis 168 subtilisin E. It
  covers most of the I9 propeptide, which acts as an intramolecular chaperone and
  inhibitor in subtilisins, and the N-terminal part of the S8 catalytic domain,
  including the catalytic Asp and His of the Asp-His-Ser charge-relay triad. The
  N-terminal signal peptide and the C-terminal region with the catalytic Ser lie
  outside the fragment. Like subtilisin E, the full-length enzyme is secreted and
  degrades extracellular proteins. In strain ATCC 6633, AprE is one of several
  extracellular serine proteases, with WprA and Vpr, that can remove the leader
  peptide from subtilin precursors to activate the lantibiotic.
existing_annotations:
- term:
    id: GO:0004252
    label: serine-type endopeptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00027237
  - InterPro:IPR036852
  - PANTHER:PTN000743776
  review:
    summary: Serine-type endopeptidase activity is the core activity of subtilisin
      (AprE). The fragment matches the peptidase S8 and subtilisin signatures and
      carries the catalytic Asp and His. In ATCC 6633, AprE is an extracellular
      serine protease that processes subtilin precursors.
    action: ACCEPT
    reason: The annotation applies to the aprE gene product, not to the truncated
      sequence record. F1DKR8 is about 93% identical to B. subtilis subtilisin E
      (P04189) over its whole length (see notes), and the PAINT IBD for this activity
      in PTHR43806 (node PTN002459139) is seeded by subtilisin E. The catalytic Ser
      is absent only because the amplicon ends before it, which is why UniProt adds
      its CAUTION about feature propagation. Nothing suggests a non-catalytic
      paralog. The term is as specific as the evidence allows; no EC 3.4.21.62
      assignment exists for this fragment entry.
    supported_by:
    - reference_id: PMID:12705882
      supporting_text: Two extracellular B. subtilis proteases were able to activate
        subtilin precursors, the commercially available serine protease prototype
        subtilisin (AprE) and WprA.
    - reference_id: file:BACSC/aprE/aprE-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: PROSITE; PS00137; SUBTILASE_HIS; 1.
    - reference_id: file:BACSC/aprE/aprE-uniprot.txt
      record_section: ["DR:PRINTS"]
      supporting_text: PRINTS; PR00723; SUBTILISIN.
    - reference_id: file:interpro/panther/PTHR43806/PTHR43806-paint.tsv
      supporting_text: "PTHR43806\tPTN002459139\tGO:0004252\tF\tIBD\tfalse"
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0243
  review:
    summary: Subtilisin is a secreted protease, and in ATCC 6633 AprE is described
      as an extracellular protease.
    action: ACCEPT
    reason: The row derives from UniProt's "Secreted" line, which here rests only
      on an ARBA rule and is not independent support. The location holds on other
      grounds. AprE of the ATCC 6633 subtilin producer is one of its extracellular
      serine proteases, and the ortholog subtilisin E is secreted after cleavage of
      its Sec signal peptide. The fragment lacks the signal peptide only because of
      where the amplicon starts.
    supported_by:
    - reference_id: PMID:12705882
      supporting_text: Activation of subtilin precursors by Bacillus subtilis extracellular
        serine proteases subtilisin (AprE), WprA, and Vpr.
- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR000209
  - InterPro:IPR036852
  review:
    summary: Proteolysis is the process counterpart of the serine endopeptidase
      activity. AprE hydrolyses peptide bonds in extracellular proteins and in
      subtilin precursor leader peptides.
    action: ACCEPT
    reason: The InterPro2GO mapping from the S8/S53 peptidase domain is sound for
      a catalytic subtilisin. PAINT places the same process at node PTN002459139,
      seeded by subtilisin E. No more specific process term is supported for this
      strain's enzyme.
    supported_by:
    - reference_id: file:BACSC/aprE/aprE-uniprot.txt
      record_section: ["DR:InterPro"]
      supporting_text: InterPro; IPR000209; Peptidase_S8/S53_dom.
    - reference_id: file:interpro/panther/PTHR43806/PTHR43806-paint.tsv
      supporting_text: "PTHR43806\tPTN002459139\tGO:0006508\tP\tIBD\tfalse"
    - reference_id: PMID:12705882
      supporting_text: The maturation of the peptide antibiotic (lantibiotic) subtilin
        in Bacillus subtilis ATCC 6633 includes posttranslational modifications of
        the propeptide and proteolytic cleavage of the leader peptide.
- term:
    id: GO:0008236
    label: serine-type peptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000209
  review:
    summary: Correct but less specific than the evidence supports. Subtilisins are
      endopeptidases.
    action: MODIFY
    reason: Serine-type peptidase activity is the parent of serine-type endopeptidase
      activity (GO:0004252), which the gene already carries and which is accepted
      above. Subtilisin cleaves internal peptide bonds, so the endopeptidase term
      is the supported refinement.
    proposed_replacement_terms:
    - id: GO:0004252
      label: serine-type endopeptidase activity
    supported_by:
    - reference_id: file:BACSC/aprE/aprE-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: PROSITE; PS00136; SUBTILASE_ASP; 1.
    - reference_id: PMID:12705882
      supporting_text: Two extracellular B. subtilis proteases were able to activate
        subtilin precursors, the commercially available serine protease prototype
        subtilisin (AprE) and WprA.
