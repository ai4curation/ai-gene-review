- id: PMID:12705882
  title: Activation of subtilin precursors by Bacillus subtilis extracellular serine
    proteases subtilisin (AprE), WprA, and Vpr.
  findings:
  - statement: In B. subtilis ATCC 6633, AprE is one of three extracellular serine
      proteases (with WprA and Vpr) able to cleave the leader from subtilin precursors.
      An aprE wprA double mutant still produces active subtilin at a reduced rate.
    supporting_text: Surprisingly, the aprE wprA double mutant of the ATCC 6633 strain
      was still able to produce active subtilin, however, with a reduced production
      rate.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified abstract. This is the only located primary study
      that genetically manipulates aprE in strain ATCC 6633 itself. The abstract does
      not say whether the purified AprE used in vitro came from this strain or was
      the commercial enzyme.
