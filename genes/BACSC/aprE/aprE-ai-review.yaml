suggested_questions:
- question: Which of the extracellular proteases secreted by ATCC 6633 (AprE, the
    neutral metalloprotease NprE, Vpr, WprA and others) account for the gelatin-hydrolysing
    activity of its culture supernatant?
- question: Should UniProt replace or supplement this PCR-fragment entry with the
    full-length aprE translation from an ATCC 6633 genome assembly, so that the
    signal peptide and catalytic Ser are represented?
suggested_experiments:
- description: Compare gelatin and casein hydrolysis by culture supernatants of
    ATCC 6633 wild type and isogenic aprE, nprE and aprE nprE deletion mutants under
    the same medium and pH conditions, to apportion extracellular gelatinolytic
    activity to AprE.
