      6633 was used as a species-detection target and deposited as GenBank HQ871154.
    supporting_text: The results were registered with GenBank under accession numbers
      HQ877873 and HQ871154.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Sequence-provenance reference cited by UniProt. It has no functional
