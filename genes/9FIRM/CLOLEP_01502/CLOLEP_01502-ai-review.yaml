- id: file:9FIRM/CLOLEP_01502/CLOLEP_01502-notes.md
  title: Manual evidence notes for CLOLEP_01502
  findings:
  - statement: >-
      Records source identity, literature search, provider failure and limits of inference.
- id: PMID:37437886
  title: Kinetic and structural characterization of carboxyspermidine dehydrogenase of polyamine
    biosynthesis.
  findings:
  - statement: >-
      EDO61991.1 was directly tested alongside BfCASDH.
    supporting_text: accession numbers WP_005801052.1 and EDO61991.1.
  - statement: >-
      PUT and DAP turnover are measured secondary catalytic capacities, with similar ClCASDH efficiencies
      of approximately 74 and 71 M−1 s−1.
    supporting_text: These data suggest that both enzymes can use putrescine or DAP and thus produce
      carboxyspermidine or carboxynorspermidine.
  - statement: >-
      ClCASDH saccharopine assays were at the detection limit; the sole weak positive in the comparison
      belongs to BfCASDH.
    supporting_text: In all experiments except one, turnover was within error of the limit of
      detection of our assay
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text checked. Preserve the measured PUT/DAP activities, but the physiological inference from
      their availability did not compare agmatine. No native PUT preference is assigned against the later
      reconstruction. No PUT/DAP NEW is added solely to fill an MF slot: these measured reactions remain
      recorded as catalytic capacities, but their evolved secondary role is unresolved against the positive
      agmatine-route reconstruction. Similar numerical efficiencies in BfCASDH do not alone establish
      equivalent physiological roles; that comparison did not test agmatine. This is not a negative claim
      about PUT/DAP turnover, nor a numerical activity cutoff.
- id: PMID:40074085
  title: New routes for spermine biosynthesis.
  findings:
  - statement: >-
      The Clostridium pair reconstructs an agmatine/aminopropylagmatine route toward spermidine.
    supporting_text: We also confirmed that the twin pathways from C. leptum behave in exactly the
      same way as the D. desulfuricans pathways, with the CASDH/CASDC pathway synthesizing
      spermidine from agmatine and N1-aminopropylagmatine, and the APT synthesizing Spm from
      agmatine, N1-aminopropylagmatine, and spermidine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text and genuine Table S1 checked; EDO61991/EDO61992 are the exact same proteins as the 2023/2025
      structural studies. This establishes reconstructed pathway capacity and supports CAPADH/CAPADC assignment,
      not a native knockout phenotype or isolated-enzyme agmatine kinetic constants.
- id:
    file:modules/bacterial_carboxyspermidine_biosynthesis-source-analysis/PMID40074085-supplement.txt
  title: PMID40074085 supplementary Table S1
  findings:
  - statement: >-
      The table identifies Clostridium leptum CAPADH as EDO61991, 399 amino acids, and CAPADC as EDO61992,
      376 amino acids.
proposed_new_terms:
- proposed_name: carboxyaminopropylagmatine dehydrogenase activity
  proposed_definition: >-
    Catalysis of the NADPH-dependent reductive condensation of agmatine and L-aspartate 4-semialdehyde
    to form carboxyaminopropylagmatine.
  proposed_parent:
    id: GO:0016646
    label: oxidoreductase activity, acting on the CH-NH group of donors, NAD or NADP as acceptor
  justification: >-
    QuickGO searches on 2026-11-06 returned no carboxyaminopropylagmatine-specific GO term. GO:0102143
    describes PUT/DAP chemistry and does not substitute for the agmatine reaction. The proposed chemistry
    is supported by the identified heterologous pair; it is not a claim of measured native flux.
  supported_by: &id002
  - *id001
  - reference_id:
      file:modules/bacterial_carboxyspermidine_biosynthesis-source-analysis/PMID40074085-supplement.txt
    supporting_text: CAPADH [EDO61991]
core_functions:
- description: >-
    Carboxyaminopropylation of agmatine, the best-supported pathway assignment from the reconstructed
    CLOLEP_01502/CLOLEP_01503 pair; native substrate partition remains unresolved.
  proposed_molecular_function: carboxyaminopropylagmatine dehydrogenase activity
  supported_by: *id002
knowledge_gaps:
- gap_statement: >-
    The quantitative substrate preference and native contribution of the Clostridium CAPA pathway remain
    unresolved.
  boundary: >-
    The 2023 purified-enzyme study measured PUT/DAP turnover; the 2025 exact-pair reconstruction supports
    agmatine-dependent chemistry. Neither establishes a complete native-cell flux map or isolated agmatine
    kcat/Km.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Determines physiological substrate use and the correct pathway assignment.
  resolution: >-
    Measure purified EDO61991.1 kinetics with agmatine, putrescine and DAP and characterize the native
    deletion/complementation metabolome.
  provenance:
  - reference_id: PMID:40074085
