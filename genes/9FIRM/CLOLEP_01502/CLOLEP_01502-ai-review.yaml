id: A7VSG1
gene_symbol: CLOLEP_01502
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:428125
  label: '[Clostridium] leptum DSM 753'
description: >-
  NADPH-dependent carboxypolyamine dehydrogenase, best assigned as a carboxyaminopropylagmatine dehydrogenase
  (CAPADH) from heterologous reconstruction with the adjacent decarboxylase CLOLEP_01503. The pair converts
  agmatine through aminopropylagmatine toward spermidine. The same protein, EDO61991.1, was previously
  characterized as ClCASDH and directly turns over putrescine and DAP with similar measured efficiencies.
  Its native flux partition remains unmeasured. The inherited saccharopine dehydrogenase name is contradicted
  by the tested substrate panel.
existing_annotations:
- term:
    id: GO:0004754
    label: saccharopine dehydrogenase (NAD+, L-lysine-forming) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:1.5.1.7
  review:
    summary: >-
      The saccharopine EC mapping is contradicted by direct substrate testing of this protein.
    action: REMOVE
    reason: >-
      PMID:37437886 explicitly used EDO61991.1, the sequence cross-reference of A7VSG1. Saccharopine synthesis
      assays with lysine/alpha-ketoglutarate and NADH or NADPH were at the detection limit for ClCASDH;
      the one weak positive was BfCASDH, not this protein. The 2025 study identifies this same Clostridium
      protein as CAPADH in an agmatine-dependent reconstruction. This is a wrong legacy EC/name assignment,
      not simply a broad term.
    supported_by:
    - reference_id: PMID:37437886
      supporting_text: In all experiments except one, turnover was within error of the limit of
        detection of our assay
    - reference_id: PMID:37437886
      supporting_text: accession numbers WP_005801052.1 and EDO61991.1.
    - &id001
      reference_id: PMID:40074085
      supporting_text: We also confirmed that the twin pathways from C. leptum behave in exactly the
        same way as the D. desulfuricans pathways, with the CASDH/CASDC pathway synthesizing
        spermidine from agmatine and N1-aminopropylagmatine, and the APT synthesizing Spm from
        agmatine, N1-aminopropylagmatine, and spermidine.
references:
- id: GO_REF:0000003
  title: Gene Ontology annotation based on Enzyme Commission mapping
  findings: []
