description: PLP-dependent carboxypolyamine decarboxylase, best assigned as carboxyaminopropylagmatine
  decarboxylase (CAPADC) from heterologous reconstruction with CLOLEP_01502. The exact protein EDO61992.1
  has a 1.41-angstrom structure with a PLP Schiff base at Lys43 and a homodimeric assembly. The pair supports
  agmatine-to-aminopropylagmatine chemistry toward spermidine. Structural resemblance and the historical
  carboxyspermidine/carboxynorspermidine names do not establish its native substrate preference.
