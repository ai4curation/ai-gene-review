knowledge_gaps:
- gap_statement: The native substrate distribution and isolated-enzyme selectivity of CLOLEP_01503 are
    unresolved.
  boundary: >-
    The exact protein participates in a reconstructed CAPA route and binds PLP structurally; the
    structure study does not measure a comparative substrate kinetic panel. An OpenScientist run
    (kgap-clolep-substrate-assignment) settles the selectivity half of this gap in the negative, and
    does so firmly, while leaving the substrate assignment standing on evidence that has nothing to do
    with this protein. The structural literature names exactly one residue as a substrate-selection
    determinant anywhere in the carboxypolyamine decarboxylases, Leu314 of the Campylobacter jejuni
    enzyme, and CLOLEP_01503 carries the wild-type leucine at the equivalent position 307, as well as
    the wild-type residue at every one of the nine positions that contact the polyamine in the family's
    only ligand complex. Those positions are near-invariant family-wide: across 500 members of
    IPR005730 they average 96.0 percent identity to the C. jejuni reference against 42.7 percent at 118
    control positions from the same protein, two are wholly invariant and four more exceed 99 percent.
    The single position that does vary, the Glu236 equivalent at 79.4 percent, splits by phylum, serine
    in 64 of 65 Bacteroidota against glutamate in 341 of 371 Pseudomonadota and all 31
    Campylobacterota, which is lineage drift rather than a specificity rule, and it is broken outright
    by the Bacteroides thetaiotaomicron enzyme, which carries the serine yet is assigned
    carboxyspermidine by deletion and assay. So no sequence or static-structure rule can discriminate
    carboxyspermidine from carboxynorspermidine from carboxyaminopropylagmatine for this protein, which
    is the same wall the companion run on the Vibrio cholerae synthase VC_1624 hit, reached here across
    a whole family rather than a handful of homologs. Structures cannot supply the missing constraint
    either: an RCSB sequence search seeded with this entry's own sequence returns twelve entries at 25
    percent identity or better, four of them in class before a fourteen-point gap to ornithine and
    diaminopimelate decarboxylases, and a ligand-by-ligand audit finds no carboxypolyamine complex
    anywhere in the family. The one polyamine-bound entry, 3N29, holds the reaction product
    norspermidine in the very enzyme later shown by gene deletion to make spermidine in vivo, so that
    ligand is not native to the protein it sits in, and in the 1.41 Angstrom C. leptum structure 9EAF
    the polyamine channel is occupied by a His-tag octapeptide from the construct. What does support
    carboxyaminopropylagmatine is pathway context: the genome carries no diaminobutyrate
    aminotransferase or decarboxylase, which removes carboxynorspermidine for want of
    1,3-diaminopropane, and no ornithine decarboxylase, while the adjacent CLOLEP_01502 has measured
    kinetics with a 34-fold agmatine preference. That inference is pathway-level and leaves this
    protein unassayed: CLOLEP_01503 has never been tested with any substrate in any publication the run
    located, and the exclusion of carboxyspermidine is weaker still, hinging on one unassigned gene,
    CH238_05280, whose arginase-fold manganese site maps identically onto both candidate activities and
    whose sequence identity separates them by 2.1 points, less than the margin by which phylum alone
    shifts the score. The existing review actions are unaffected: nothing here supports the
    diaminopimelate decarboxylase or nor-spermidine process rows, and the run independently reaches the
    same two recommendations. Residue-level claims were checked against this entry's own UniProt
    record, which is 376 residues: Leu307, and the transferred contact set Lys43, Cys173, Glu174,
    Glu240, Asp276, Met280, Tyr335, Lys339 and Phe343, with the record's own BINDING 240 and 276 and
    the pyridoxal-phosphate Schiff-base MOD_RES at Lys43 agreeing. The family-scale identity statistics,
    the superposition distances, the RCSB hit list and the arginase-fold panel were not recomputed here.
