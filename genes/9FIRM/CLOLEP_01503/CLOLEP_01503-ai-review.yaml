- id: PMID:39887002
  title: Structure of Clostridium leptum carboxyspermidine decarboxylase and comparison to homologs prevalent
    within the human gut microbiome.
  findings:
  - statement: The crystal structure directly identifies the PLP Schiff base at Lys43.
    supporting_text: PLP forms a Schiff base with Lys43 in both chains
  - statement: The study reports EDO61992.1 and PDB 9EAF; its structural naming does not constitute a
      measured substrate-specific kinetic panel.
  - statement: The structural study explicitly used EDO61992.1; this links its CASDC name to the protein
      called CAPADC in the later supplementary table.
    supporting_text: The gene sequence for carboxyspermidine decarboxylase from C. leptum was obtained
      from the NCBI database under accession No. EDO61992.1.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text checked. The 1.41-angstrom structure and cofactor binding are direct target
      evidence; no substrate-specific kcat/Km or native mutant phenotype is reported. The Methods identify
      EDO61992.1 as CASDC, whereas PMID40074085 Table S1 names the same EDO61992 protein CAPADC. This
      naming discrepancy is explicit: the structure establishes the PLP-dependent fold and cofactor site,
      not substrate-specific kinetics; the later agmatine-route reconstruction governs the substrate-role
      interpretation.'
- id: PMID:40074085
  title: New routes for spermine biosynthesis.
  findings:
  - statement: The exact Clostridium pair supports the reconstructed CAPA route.
    supporting_text: We also confirmed that the twin pathways from C. leptum behave in exactly the same
      way as the D. desulfuricans pathways, with the CASDH/CASDC pathway synthesizing spermidine from
      agmatine and N1-aminopropylagmatine, and the APT synthesizing Spm from agmatine, N1-aminopropylagmatine,
      and spermidine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and Table S1 checked. The assay is heterologous pair reconstruction, not isolated
      CAPADC kinetics or demonstrated native flux. Table S1 calls C. leptum EDO61992 CAPADC, while PMID39887002
      calls that exact accession CASDC. Reconstructed agmatine-route activity and direct structural observations
      are interpreted separately; historical names alone do not establish substrate specificity.
