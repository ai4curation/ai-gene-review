- id: file:9FIRM/CLOLEP_01503/CLOLEP_01503-hypotheses/kgap-clolep-substrate-assignment/openscientist.md
  title: OpenScientist analysis of CLOLEP_01503 substrate assignment and selectivity determinants
  findings:
  - statement: >-
      Substrate cannot be read off determinants in this family. The one residue the structural
      literature names as a selection determinant is wild type in CLOLEP_01503, as are all nine
      polyamine-contact positions, and those positions are near-invariant across 500 members of
      IPR005730 including enzymes assigned to different carboxypolyamines; the single variable
      position tracks phylum rather than substrate and is broken by a serine-carrying enzyme assigned
      carboxyspermidine. No structure in the family holds a carboxypolyamine. The
      carboxyaminopropylagmatine assignment therefore rests on pathway context, chiefly the absent
      diaminopropane route and the measured 34-fold agmatine preference of the adjacent CLOLEP_01502,
      and not on this protein, which has never been assayed.
    supporting_text: >-
      A sequence or static-structure rule cannot discriminate carboxyspermidine from
      carboxynorspermidine from carboxyaminopropylagmatine for this protein.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      The 376-residue length, Leu307 and the transferred contact set Lys43, Cys173, Glu174, Glu240,
      Asp276, Met280, Tyr335, Lys339 and Phe343 were checked against the local CLOLEP_01503 UniProt
      record, whose own BINDING 240 and 276 and pyridoxal-phosphate MOD_RES at Lys43 agree. The
      family-scale identity statistics over 500 IPR005730 members, the 3N29-to-9EAF superposition
      distances, the RCSB hit list and the 114-protein arginase-fold panel were not recomputed here.
