    summary: Direct fluorescence microscopy showing that phiKZ gp54 assembles a spherical nucleus-like shell enclosing viral DNA in the host Pseudomonas aeruginosa cytoplasm.
    action: ACCEPT
    reason: Live-cell fluorescence microscopy of GFP- and mCherry-tagged gp54 in phiKZ-infected P. aeruginosa demonstrates assembly of a spherical proteinaceous shell in the host cytoplasm centered at midcell by the PhuZ spindle.
    supported_by:
    - reference_id: PMID:28813669
      supporting_text: To determine if this nucleus-like structure is conserved in P. aeruginosa phages ΦKZ and ΦPA3, we identified homologs of gp105 in these phages (gp54 in ΦKZ and gp53 in ΦPA3) and tagged them with the fluorescent proteins (FP) GFP or mCherry. When expressed from a plasmid in uninfected cells, these proteins formed small foci that were not specifically localized (Figure S1A), but upon infection, both proteins assembled a spherical structure surrounding phage DNA (Figure 1A, shell).
