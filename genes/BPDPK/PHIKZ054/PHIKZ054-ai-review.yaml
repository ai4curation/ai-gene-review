suggested_questions:
- question: Which phage-encoded factor nucleates the transition of PHIKZ054 (gp54) from small cytoplasmic foci into a closed spherical nuclear shell around the injected phiKZ genome immediately after infection?
  experts:
  - Joe Pogliano
  - Elizabeth Villa
  - Joseph Bondy-Denomy
suggested_experiments:
- description: Perform live-cell single-molecule fluorescence microscopy and affinity purification-mass spectrometry of GFP-gp54 during the first 10 minutes of phiKZ infection in Pseudomonas aeruginosa.
  hypothesis: A virion-injected early protein or specific DNA-bound complex associated with the early phage vesicle (EPI vesicle) nucleates gp54 tetramer sheet closure around the newly injected viral genome.
  experiment_type: Affinity purification-mass spectrometry and live-cell microscopy
