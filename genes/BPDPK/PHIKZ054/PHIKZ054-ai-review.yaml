  label: Pseudomonas phage phiKZ
description: Major phage nuclear shell protein chimallin (ChmA, PhuN, gp54) of giant Pseudomonas aeruginosa phage phiKZ that self-assembles into a micrometer-scale spherical proteinaceous barrier in the host cell cytoplasm surrounding replicating viral DNA. Positioned at midcell by the bipolar PhuZ (gp39) tubulin spindle, the gp54 nuclear shell selectively compartmentalizes viral DNA replication, recombination (including the RecA-like protein gp152), and transcription machinery inside while excluding host ribosomes and cytoplasmic proteins, and serves as the docking platform for gp120 procapsids during DNA packaging.
