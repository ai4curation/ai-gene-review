    label: viral release from host cell by cytolysis
  supported_by:
  - reference_id: PMID:17233731
    supporting_text: The gp144 endolysin gene from the Pseudomonas aeruginosa phage phiKZ was cloned and studies of gp144 expression into Escherichia coli showed host cell lysis. The gp144 protein was purified directly from the culture supernatant and from the bacterial cell pellet and showed in vitro antibacterial lytic activity against P. aeruginosa bacteria and degraded purified peptidoglycan of Gram-negative bacteria. MS analysis identified the gp144 peptidoglycan cleavage site and confirmed a lytic transglycosylase enzyme.
  - reference_id: PMID:18160394
    supporting_text: phi KZ gp144 is a 260-residue alpha-helical protein composed of a 70-residue N-terminal cell wall-binding domain and a C-terminal catalytic domain.
  - reference_id: PMID:19348786
    supporting_text: Surface plasmon resonance analysis confirmed this apparent high binding affinity revealing an equilibrium affinity constant of 2.95 x 10(7)M(-1) for the PBD(KZ)-peptidoglycan interaction.
  - reference_id: PMID:28461978
    supporting_text: Glu115 of gp144 performs the predicted role of a catalytic residue. However, replacement of this residue does not completely eliminate the activity of the mutant protein. Site-directed mutagenesis has revealed the participation of Tyr197 in the catalytic mechanism, as well as the presence of a second active site involving Glu178 and Tyr147.
references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:17233731
  title: Peptidoglycan lytic activity of the Pseudomonas aeruginosa phage phiKZ gp144 lytic transglycosylase.
  full_text_unavailable: true
  findings:
  - statement: Expression of phiKZ gp144 in E. coli causes host cell lysis, and mass spectrometry of peptidoglycan fragments generated by purified gp144 demonstrates that it is a lytic transglycosylase forming 1,6-anhydro-MurNAc.
    supporting_text: The gp144 endolysin gene from the Pseudomonas aeruginosa phage phiKZ was cloned and studies of gp144 expression into Escherichia coli showed host cell lysis. The gp144 protein was purified directly from the culture supernatant and from the bacterial cell pellet and showed in vitro antibacterial lytic activity against P. aeruginosa bacteria and degraded purified peptidoglycan of Gram-negative bacteria. MS analysis identified the gp144 peptidoglycan cleavage site and confirmed a lytic transglycosylase enzyme.
- id: PMID:17697255
  title: Muralytic activity and modular structure of the endolysins of Pseudomonas aeruginosa bacteriophages phiKZ and EL.
  full_text_unavailable: true
  findings:
  - statement: KZ144 (gp144) exhibits high muralytic specific activity (210,000 units/mg) across outer-membrane-permeabilized Gram-negative bacteria and utilizes Glu115 as a primary catalytic residue.
    supporting_text: Pseudomonas aeruginosa bacteriophage endolysins KZ144 (phage phiKZ) and EL188 (phage EL) are highly lytic peptidoglycan hydrolases (210 000 and 390 000 units mg(-1)), active on a broad range of outer membrane-permeabilized Gram-negative species. Site-directed mutagenesis indicates E115 (KZ144) and E155 (EL188) as their respective essential catalytic residues.
- id: PMID:18160394
  title: Structure of the bacteriophage phi KZ lytic transglycosylase gp144.
  full_text_unavailable: true
  findings:
  - statement: Crystal structures of unbound (PDB:3BKH) and chitotetraose-bound (PDB:3BKV) gp144 resolve an N-terminal 70-residue peptidoglycan-binding domain and a C-terminal GH23-like catalytic domain.
    supporting_text: phi KZ gp144 is a 260-residue alpha-helical protein composed of a 70-residue N-terminal cell wall-binding domain and a C-terminal catalytic domain.
- id: PMID:19348786
  title: The high-affinity peptidoglycan binding domain of Pseudomonas phage endolysin KZ144.
  full_text_unavailable: true
  findings:
  - statement: Surface plasmon resonance demonstrates that the N-terminal peptidoglycan-binding domain of KZ144 binds Pseudomonas aeruginosa peptidoglycan with an equilibrium affinity constant Ka of 2.95 x 10^7 M^-1.
    supporting_text: Surface plasmon resonance analysis confirmed this apparent high binding affinity revealing an equilibrium affinity constant of 2.95 x 10(7)M(-1) for the PBD(KZ)-peptidoglycan interaction.
- id: PMID:28461978
  title: Dual Active Site in the Endolytic Transglycosylase gp144 of Bacteriophage phiKZ.
  findings:
  - statement: Site-directed mutagenesis reveals that gp144 possesses a dual active site comprising the canonical Glu115/Tyr197 pair and a secondary Glu178/Tyr147 catalytic pair within the substrate-binding groove.
    supporting_text: Glu115 of gp144 performs the predicted role of a catalytic residue. However, replacement of this residue does not completely eliminate the activity of the mutant protein. Site-directed mutagenesis has revealed the participation of Tyr197 in the catalytic mechanism, as well as the presence of a second active site involving Glu178 and Tyr147.
- id: file:BPDPK/PHIKZ144/PHIKZ144-uniprot.txt
  title: UniProtKB record for Q8SD18 (ENDL_BPDPK)
  findings:
  - statement: UniProt record summarizing the modular architecture, lytic transglycosylase activity (EC 4.2.2.n1), and host cell lysis function of phiKZ gp144.
    supporting_text: 'FUNCTION: Endolysin with transglycosylase activity that degrades host peptidoglycans and participates in the sequential events which lead to the programmed host cell lysis releasing the mature viral particles (Probable).'
suggested_questions:
- question: Which phiKZ-encoded holin and spanin proteins control the timing of PHIKZ144 (gp144) delivery across the inner membrane and outer membrane disruption at the end of the giant phage lytic cycle?
  experts:
  - Rob Lavigne
  - Yves Briers
  - Ryland F. Young
suggested_experiments:
- description: Perform high-resolution LC-MS/MS muropeptide profiling of purified Pseudomonas aeruginosa peptidoglycan digested separately by E115A (secondary site active) and E178A (primary site active) gp144 variants.
  hypothesis: The primary Glu115/Tyr197 active site preferentially catalyzes processive exolytic cleavage from the non-reducing end of glycan strands whereas the secondary Glu178/Tyr147 site initiates endolytic internal strand scission.
  experiment_type: LC-MS/MS muropeptide product profiling
