    label: peptidoglycan lytic transglycosylase activity
  evidence_type: IDA
  original_reference_id: PMID:17233731
  qualifier: enables
  review:
    summary: Direct biochemical and mass spectrometric demonstration that gp144 cleaves bacterial peptidoglycan as a lytic transglycosylase forming 1,6-anhydro-MurNAc.
    action: ACCEPT
    reason: Mass spectrometry of purified peptidoglycan digestion products (PMID:17233731), crystal structures with bound chitotetraose (PMID:18160394), and dual-active-site mutagenesis (PMID:28461978) establish that gp144 functions as both an endolytic and exolytic peptidoglycan lytic transglycosylase.
    supported_by:
    - reference_id: PMID:17233731
      supporting_text: The gp144 protein was purified directly from the culture supernatant and from the bacterial cell pellet and showed in vitro antibacterial lytic activity against P. aeruginosa bacteria and degraded purified peptidoglycan of Gram-negative bacteria. MS analysis identified the gp144 peptidoglycan cleavage site and confirmed a lytic transglycosylase enzyme.
