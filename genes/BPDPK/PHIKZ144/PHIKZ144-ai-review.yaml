id: Q8SD18
gene_symbol: PHIKZ144
status: COMPLETE
taxon:
  id: NCBITaxon:2905945
  label: Pseudomonas phage phiKZ
description: Modular endolysin (KZ144, gp144, 260 amino acids) of giant Pseudomonas aeruginosa phage phiKZ composed of a high-affinity N-terminal peptidoglycan-binding domain (residues 9-69) and a C-terminal glycoside hydrolase family 23 (GH23) lytic transglycosylase domain (residues 70-260) harboring a dual active site (Glu115/Tyr197 and Glu178/Tyr147). Catalyzes non-hydrolytic cleavage of the beta-1,4-glycosidic bond between MurNAc and GlcNAc with concomitant 1,6-anhydro-MurNAc formation to degrade the host peptidoglycan sacculus and mediate host cell lysis for progeny virion release.
