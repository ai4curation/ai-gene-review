core_functions:
- description: Modular phage endolysin that binds A1gamma-chemotype Gram-negative peptidoglycan with high affinity via its N-terminal cell-wall-binding domain (residues 9-69) and catalyzes non-hydrolytic beta-1,4-glycosidic bond cleavage between MurNAc and GlcNAc via its C-terminal dual-active-site lytic transglycosylase domain (Glu115/Tyr197 and Glu178/Tyr147) to lyse the bacterial host cell and release progeny virions.
  molecular_function:
    id: GO:0008933
    label: peptidoglycan lytic transglycosylase activity
  directly_involved_in:
