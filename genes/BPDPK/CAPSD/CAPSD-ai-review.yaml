core_functions:
- description: Major structural subunit of the T=27 icosahedral viral capsid that undergoes N-terminal propeptide cleavage at Glu163 by the morphogenetic protease gp175 and self-assembles into 260 hexameric capsomers (1,560 copies per virion) to enclose the 280-kb viral dsDNA genome and internal inner body.
