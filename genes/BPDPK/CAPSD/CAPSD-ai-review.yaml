id: Q8SD42
gene_symbol: CAPSD
status: COMPLETE
taxon:
  id: NCBITaxon:2905945
  label: Pseudomonas phage phiKZ
description: Major capsid protein (gp120) of giant Pseudomonas aeruginosa phage phiKZ that is synthesized as a 747-amino-acid precursor, proteolytically matured via removal of its 163-residue N-terminal propeptide by the prohead protease gp175, and self-assembles into 260 hexameric capsomers (1,560 subunits) forming a T=27 icosahedral capsid shell (~145.5 nm in diameter) that encapsidates the 280-kb viral dsDNA genome and the internal cylindrical inner body.
