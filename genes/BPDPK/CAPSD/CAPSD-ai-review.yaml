- id: PMID:16081102
  title: A three-dimensional cryo-electron microscopy structure of the bacteriophage phiKZ head.
  full_text_unavailable: true
  findings:
  - statement: Three-dimensional cryo-EM reconstruction of the bacteriophage phiKZ head shows a 1455 A icosahedral shell composed of 65 kDa gp120 major capsid protein hexamers arranged with T=27 triangulation symmetry.
    supporting_text: The head has icosahedral symmetry measuring 1455 A in diameter along 5-fold axes and a unique portal vertex to which is attached an approximately 1800 A-long contractile tail. The 65 kDa major capsid protein, gp120, is organized into a surface lattice of hexamers, with T = 27 triangulation.
- id: PMID:22429790
  title: Extensive proteolysis of head and inner body proteins by a morphogenetic protease in the giant Pseudomonas aeruginosa phage φKZ.
  findings:
  - statement: During phiKZ prohead maturation, the 747-residue gp120 precursor is cleaved at up to seven S/A/G-X-E sites within its 163-residue N-terminal propeptide by the morphogenetic serine protease gp175, yielding the mature 584-residue (65 kDa) major capsid protein.
    supporting_text: The identification of 39 cleavage sites in 19 φKZ head proteins indicates cleavage of many prohead proteins forms a major morphogenetic step in φKZ head maturation.
- id: file:BPDPK/CAPSD/CAPSD-uniprot.txt
  title: UniProtKB record for Q8SD42 (CAPSD_BPDPK)
  findings:
  - statement: UniProt record documenting gp120 self-assembly into a T=27 icosahedral capsid of 1,560 subunits and proteolytic processing of its N-terminal 163-residue propeptide by gp175.
    supporting_text: 'FUNCTION: Capsid protein self-assembles to form an icosahedral capsid with a T=27 symmetry, about 120 nm in diameter, and consisting of 1560 capsid proteins. The capsid encapsulates the genomic DNA (PubMed:16081102).'
suggested_questions:
- question: Does the 163-residue N-terminal propeptide of gp120 act as an intramolecular chaperone or transient scaffolding domain that recruits the cylindrical inner body proteins prior to proteolysis by gp175?
  experts:
  - Julie A. Thomas
  - Lindsay W. Black
  - Michael G. Rossmann
suggested_experiments:
- description: Express and purify full-length uncleaved gp120 (residues 1-747) and propeptide-deleted gp120 (residues 164-747) in the presence and absence of major inner body proteins (gp89, gp90, gp93, gp95, gp97) and analyze assembly intermediates by cryo-EM.
  hypothesis: The 163-residue N-terminal propeptide of gp120 mediates co-assembly of the prohead shell around the cylindrical inner body core before gp175-catalyzed cleavage triggers prohead expansion into the mature T=27 lattice.
  experiment_type: In vitro prohead reconstitution and cryo-EM
