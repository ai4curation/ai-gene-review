id: Q8SDC3
gene_symbol: PHIKZ039
status: COMPLETE
taxon:
  id: NCBITaxon:2905945
  label: Pseudomonas phage phiKZ
description: Divergent tubulin/FtsZ-family cytoskeletal GTPase (PhuZ, TubZ, gp39) of giant Pseudomonas aeruginosa phage phiKZ that undergoes a polymerization-coupled interdomain rotation and C-terminal tail engagement to assemble three-stranded filaments in the host cell cytoplasm. Using GTPase-driven dynamic instability (requiring catalytic T7-loop residue Asp204), PHIKZ039 forms a bipolar spindle anchored at the bacterial cell poles that centers the gp54 (PHIKZ054)-enclosed phage nucleus at midcell during viral replication.
