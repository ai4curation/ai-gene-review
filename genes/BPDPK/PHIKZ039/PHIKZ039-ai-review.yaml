- id: PMID:23528827
  title: Structure of the tubulin/FtsZ-like protein TubZ from Pseudomonas bacteriophage ΦKZ.
  findings:
  - statement: Crystal structures of phiKZ TubZ (PhuZ/gp39) in monomeric (PDB:3ZBP) and protofilament (PDB:3ZBQ) states reveal an ~11-degree interdomain rotation upon polymerization that positions the catalytic T7 loop into the longitudinal subunit interface.
    supporting_text: In this study, we present crystal structures of the tubulin/FtsZ-like protein TubZ from Pseudomonas bacteriophage ΦKZ in both the monomeric and protofilament states, revealing that ΦKZ TubZ undergoes structural changes required to polymerise, forming a canonical tubulin/FtsZ-like protofilament.
- id: PMID:28813669
  title: The Phage Nucleus and Tubulin Spindle Are Conserved among Large Pseudomonas Phages.
  findings:
  - statement: PhiKZ PhuZ (gp39) assembles a bipolar spindle in the host Pseudomonas aeruginosa cytoplasm that undergoes GTPase-dependent dynamic instability (abolished in the D204A catalytic mutant) to center the gp54 phage nucleus at midcell.
    supporting_text: We show that the tubulin-like protein PhuZ encoded by each phage assembles a bipolar spindle that displays dynamic instability and positions the nucleus at midcell.
  - statement: Mutation of the catalytic T7-loop aspartate (D204A) in phiKZ PhuZ abolishes filament length fluctuations and blocks dynamic instability.
    supporting_text: In contrast, time-lapse microscopy and quantitation of filament length of GFP-PhuZΦKZ-D204A and GFP-PhuZΦ PA3-D187A showed that the mutant filaments remained the same length over the course of 2 minutes (Figure 3B and 3D; graphs) suggesting that dynamic instability requires GTPase activity as is the case with PhuZ201 and microtubules.
