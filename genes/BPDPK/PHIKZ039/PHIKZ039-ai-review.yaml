suggested_questions:
- question: How does the phage phiKZ anti-CRISPR/anti-defense protein or polar anchor factor tether the minus ends of PHIKZ039 filaments specifically to the Pseudomonas aeruginosa cell poles?
  experts:
  - Joe Pogliano
  - Jan Lowe
  - David A. Agard
suggested_experiments:
- description: Perform co-immunoprecipitation and proximity-dependent biotinylation (TurboID) of polarly localized PHIKZ039 in phiKZ-infected Pseudomonas aeruginosa combined with live-cell time-lapse microscopy of candidate phage deletion mutants.
  hypothesis: A specific early phage protein localizes to the bacterial cell poles and binds the minus-end surface of PHIKZ039 to nucleate and anchor the bipolar spindle.
  experiment_type: Proximity proteomics and live-cell fluorescence microscopy
