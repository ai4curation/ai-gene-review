    label: catalytic activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0081
  review:
    summary: Correct but overly broad enzyme annotation that should be refined to peptidoglycan lytic transglycosylase activity (GO:0008933).
    action: MODIFY
    reason: Deletion mapping and biochemical assays (PMID:18671939) together with its conserved SLT transglycosylase domain (Pfam:PF01464 / IPR008258) show that gp181 specifically catalyzes peptidoglycan cleavage, warranting refinement from root catalytic activity to GO:0008933 (peptidoglycan lytic transglycosylase activity).
    proposed_replacement_terms:
    - id: GO:0008933
      label: peptidoglycan lytic transglycosylase activity
    supported_by:
    - reference_id: PMID:18671939
      supporting_text: Gp181 (2237 amino acids) of Pseudomonas aeruginosa bacteriophage phiKZ (Myoviridae) is a structural virion protein, which bears a peptidoglycan hydrolase domain near its C-terminus. This protein is supposed to degrade the peptidoglycan locally during the infection process. Nine deletional mutants allowed delineation of the peptidoglycan hydrolase domain between amino acids 1880-2042 (gp181M8) and analysis of its biochemical properties.
- term:
    id: GO:0031640
    label: killing of cells of another organism
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
