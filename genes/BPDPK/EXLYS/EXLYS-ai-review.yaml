references:
- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:18671939
  title: The structural peptidoglycan hydrolase gp181 of bacteriophage phiKZ.
  full_text_unavailable: true
  findings:
  - statement: Deletion mapping of the 2,237-amino-acid structural virion protein gp181 delineates a C-terminal peptidoglycan hydrolase domain (residues 1880-2042) whose specific activity is enhanced threefold by the C-terminal distal tail (residues 2043-2237) to 12-fold that of hen egg-white lysozyme.
    supporting_text: Gp181 (2237 amino acids) of Pseudomonas aeruginosa bacteriophage phiKZ (Myoviridae) is a structural virion protein, which bears a peptidoglycan hydrolase domain near its C-terminus. This protein is supposed to degrade the peptidoglycan locally during the infection process. Nine deletional mutants allowed delineation of the peptidoglycan hydrolase domain between amino acids 1880-2042 (gp181M8) and analysis of its biochemical properties.
  - statement: The C-terminal distal segment (residues 2043-2237) boosts the catalytic efficiency of the gp181 peptidoglycan hydrolase domain threefold.
    supporting_text: The C-terminal distal end (amino acids 2043-2237) enhances the specific activity of gp181M8 threefold, resulting in a twelve times higher activity than commercial hen egg white lysozyme.
- id: file:BPDPK/EXLYS/EXLYS-uniprot.txt
  title: UniProtKB record for Q8SCY1 (EXLYS_BPDPK)
  findings:
  - statement: UniProt record describing gp181 as a virion-associated exolysin with an SLT transglycosylase domain that cleaves host peptidoglycan during phage entry.
    supporting_text: 'FUNCTION: Exolysin that catalyzes the cleavage of the host peptidoglycans during virus entry.'
suggested_questions:
- question: Does the C-terminal distal domain (residues 2043-2237) of gp181 function as a cell-wall peptidoglycan-binding module that anchors the catalytic transglycosylase domain (residues 1880-2042) to the sacculus, or does it form the tip of the baseplate cell-puncturing needle?
  experts:
  - Rob Lavigne
  - Konstantin A. Miroshnikov
  - Petr G. Leiman
suggested_experiments:
- description: Determine the cryo-EM structure of the phiKZ baseplate hub and cell-puncturing needle complex before and after sheath contraction and perform peptidoglycan-binding pull-down assays with the isolated gp181 C-terminal distal fragment (residues 2043-2237).
  hypothesis: The N-terminal ~1,800 residues of gp181 form a structural component of the baseplate central spike/tail tube while the C-terminal distal segment (residues 2043-2237) acts as a high-affinity peptidoglycan-binding module that positions the catalytic domain (1880-2042) during cell envelope penetration.
  experiment_type: Cryo-EM structural analysis and peptidoglycan-binding assay
