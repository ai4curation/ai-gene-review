  - UniProtKB-KW:KW-0081
  review:
    summary: Spurious automated keyword mapping from KW-0081 (Bacteriolytic enzyme); gp181 is a virion-associated entry exolysin rather than a cell-killing toxin or lysis endolysin.
    action: REMOVE
    reason: Although recombinant C-terminal gp181 fragments can hydrolyze chloroform-permeabilized peptidoglycan in vitro, in the native phage life cycle gp181 is a tail-associated exolysin that locally digests the cell wall during phage entry without killing the host cell.
    supported_by:
    - reference_id: PMID:18671939
      supporting_text: Gp181 (2237 amino acids) of Pseudomonas aeruginosa bacteriophage phiKZ (Myoviridae) is a structural virion protein, which bears a peptidoglycan hydrolase domain near its C-terminus. This protein is supposed to degrade the peptidoglycan locally during the infection process.
    - reference_id: file:BPDPK/EXLYS/EXLYS-uniprot.txt
      supporting_text: 'FUNCTION: Exolysin that catalyzes the cleavage of the host peptidoglycans during virus entry.'
