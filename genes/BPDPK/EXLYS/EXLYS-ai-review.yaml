core_functions:
- description: Virion-associated peptidoglycan hydrolase (exolysin) that catalyzes local cleavage of the host Pseudomonas aeruginosa peptidoglycan sacculus via its C-terminal lytic transglycosylase domain (residues 1880-2042) to enable tail penetration and viral genome entry during infection.
