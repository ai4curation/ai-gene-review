id: Q8SCY1
gene_symbol: EXLYS
status: COMPLETE
taxon:
  id: NCBITaxon:2905945
  label: Pseudomonas phage phiKZ
description: Virion-associated tail/baseplate peptidoglycan hydrolase (exolysin, gp181, 2,237 amino acids) of giant Pseudomonas aeruginosa phage phiKZ that contains a C-terminal lytic transglycosylase/lysozyme-like catalytic domain (residues 1880-2042) potentiated by a C-terminal distal extension (residues 2043-2237) and locally cleaves the host cell wall peptidoglycan sacculus to facilitate tail penetration and viral entry during infection.
