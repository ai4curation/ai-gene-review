description: Morphogenetic serine-type prohead endopeptidase (gp175, MEROPS family S80 prototype, catalytic triad His89-Ser168-Glu191) of giant Pseudomonas aeruginosa phage phiKZ that undergoes C-terminal self-cleavage autoactivation after Glu210 and drives viral procapsid and inner body maturation by cleaving at least 19 prohead proteins across 39 [S/A/G]-X-E recognition sites, including the N-terminal propeptide of major capsid protein gp120 and the major cylindrical inner body proteins (gp89, gp90, gp93, gp95, and gp97).
