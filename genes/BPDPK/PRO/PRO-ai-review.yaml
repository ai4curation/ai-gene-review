    supporting_text: 'FUNCTION: Serine protease that is responsible for cleaving many of the prohead proteins during a major morphogenetic step in viral capsid maturation (PubMed:22429790, PubMed:23740980). Cleaves the major capsid protein at 7 [A,G,S]-X-E recognition sites (PubMed:22429790, PubMed:35458430).'
suggested_questions:
- question: What structural mechanism prevents premature gp175 autoactivation and inner body proteolysis in the host cytoplasm before prohead shell assembly is complete?
  experts:
  - Julie A. Thomas
  - Lindsay W. Black
  - Steven C. Haase
suggested_experiments:
- description: Determine the X-ray crystal structures of the catalytically inactive full-length gp175 zymogen (S168A, residues 1-270) and the mature cleaved protease (residues 1-210) bound to a peptide substrate mimic (S-L-E).
  hypothesis: The 60-residue C-terminal propeptide (residues 211-270) folds back across the S1/S3 substrate-binding pocket in the monomer and is displaced upon oligomerization or incorporation into the inner body scaffold inside the assembling prohead.
  experiment_type: X-ray crystallography and enzyme kinetics
