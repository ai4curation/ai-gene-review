- id: PMID:22429790
  title: Extensive proteolysis of head and inner body proteins by a morphogenetic protease in the giant Pseudomonas aeruginosa phage φKZ.
  findings:
  - statement: Bioinformatic, mass spectrometric, and co-expression analyses identify gp175 as the phiKZ morphogenetic prohead protease responsible for 39 cleavage events at [S/A/G]-X-E motifs across 19 head and inner body proteins, including gp120 and gp175 itself.
    supporting_text: The identification of 39 cleavage sites in 19 φKZ head proteins indicates cleavage of many prohead proteins forms a major morphogenetic step in φKZ head maturation. The φKZ head protease, gp175, is newly identified here by a bioinformatics approach, as confirmed by a protein expression assay. Gp175 is distantly related to T4 gp21 and recognizes and cleaves head precursors at related but distinct S/A/G-X-E recognition sites.
- id: PMID:23740980
  title: Mutational analysis of the Pseudomonas aeruginosa myovirus KZ morphogenetic protease gp175.
  findings:
  - statement: Purified gp175 zymogen undergoes autonomous C-terminal self-cleavage at Glu210 to generate the active 210-residue protease that directly cleaves purified inner body proteins gp93 and gp89, whereas catalytic triad mutations H89A or S168A abolish both autoactivation and substrate cleavage.
    supporting_text: Here we show that the purified mature form of gp175 is active and cleaves purified IB structural proteins gp93 and gp89. Expression vector synthesis and purification of the zymogen/precursor yielded an active, mature-length protease, showing independent C-terminal gp175 self-cleavage autoactivation. Mutation of either the predicted catalytic serine or histidine inactivated mature gp175, supporting its classification as a serine protease and representing the first such direct biochemical demonstration with purified protease and substrate proteins for any phage protease.
