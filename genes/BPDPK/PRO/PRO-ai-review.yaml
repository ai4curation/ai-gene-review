    action: ACCEPT
    reason: Purified mature gp175 cleaves prohead substrates gp93 and gp89 at S/A/G-X-E motifs in vitro, and substitution of either His89 or Ser168 completely abolishes both self-cleavage autoactivation and trans-proteolytic activity (PMID:22429790, PMID:23740980).
