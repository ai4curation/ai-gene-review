suggested_questions:
- question: Does Q8RLU1 represent only an incomplete deposited coding sequence, or a genuine
    disrupted locus in the original B. cereus AI-2 isolate?
suggested_experiments:
- description: Resequence phnW in B. cereus ATCC 43881 / AI-2, establish the intact coding sequence,
    then assay the purified full-length enzyme for PLP-dependent 2-aminoethylphosphonate:pyruvate
    transamination.
