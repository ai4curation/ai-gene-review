id: Q8RLU1
gene_symbol: phnW
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1396
  label: Bacillus cereus
description: PhnW is the inferred pyridoxal-phosphate-dependent 2-aminoethylphosphonate:pyruvate
  transaminase of Bacillus cereus. It is assigned to the PhnW subfamily of class-V
  aminotransferases, which transfers the amino group of 2-aminoethylphosphonate to pyruvate,
  generating phosphonoacetaldehyde and L-alanine. This supplies the intermediate for subsequent
  phosphonatase-mediated carbon-phosphorus bond cleavage. The deposited Q8RLU1 sequence is a
  probable fragment with a sequence frameshift caution, so its activity as an intact recombinant
  enzyme has not been established.
