- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001822734
  review:
    summary: The DNA-repair transfer is unsupported for an experimentally established
      phosphonate-catabolic enzyme.
    action: REMOVE
    reason: This TreeGrafter inference from PTN001822734 accompanies phosphoglycolate phosphatase
      activity. PhnX belongs to the specialized phosphonatase branch of the HAD superfamily and is
      directly characterized as a carbon-phosphorus-bond hydrolase in phosphonate degradation.
      Shared HAD ancestry does not establish a DNA-repair role. Removal rejects this functional
      transfer, without claiming that a targeted DNA-repair loss-of-function assay was performed.
    supported_by:
    - reference_id: PMID:17070898
      supporting_text: Phosphonatase functions in the 2-aminoethylphosphonate (AEP) degradation
        pathway of bacteria
