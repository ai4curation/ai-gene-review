  review:
    summary: Cytosolic localization is plausible but not independently established by the sources
      reviewed.
    action: UNDECIDED
    reason: The TreeGrafter assertion names PTN001822734, but purification and crystal structures do
      not localize the protein in its native bacterium. UniProt has no independent
