- term:
    id: GO:0008967
    label: phosphoglycolate phosphatase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001822734
  review:
    summary: Phosphoglycolate phosphatase is an inappropriate specificity transfer onto PhnX.
    action: REMOVE
    reason: The exact protein is experimentally established as phosphonoacetaldehyde hydrolase, with
      cap-domain specialization for carbon-phosphorus bond cleavage (PMID:10956028; PMID:17070898).
      Its PhnX-specific subfamily assignment agrees with those experiments. A phosphoglycolate
      phosphate-ester substrate cannot be inferred from the shared HAD core or the broad PANTHER
      family name. No physiological phosphoglycolate phosphatase function was demonstrated for this
      protein; this is rejection of an over-propagated inference, not an assertion that all possible
      promiscuous activity has been experimentally excluded.
    supported_by:
