id: O31156
gene_symbol: phnX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1396
  label: Bacillus cereus
description: PhnX is a magnesium-dependent, homodimeric phosphonoacetaldehyde hydrolase of the HAD
  superfamily in Bacillus cereus. It cleaves the carbon-phosphorus bond of phosphonoacetaldehyde,
  releasing acetaldehyde and inorganic phosphate during 2-aminoethylphosphonate degradation. A
  specialized cap domain supports Schiff-base chemistry coupled to phosphoryl transfer in the
  catalytic core. The purified enzyme has been characterized biochemically and structurally; its
  subcellular localization has not been experimentally established.
