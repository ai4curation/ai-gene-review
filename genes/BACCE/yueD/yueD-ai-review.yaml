  label: Bacillus cereus
description: 'B. cereus YueD is a cytoplasmic classical short-chain dehydrogenase/reductase (SDR) that
  reduces benzil stereospecifically to (S)-benzoin with NADPH. It was identified by expression screening
  as the enzyme responsible for whole-cell benzil reduction in B. cereus. The purified enzyme also reduces
  1-phenyl-1,2-propanedione, 1,4-naphthoquinone, substituted benzils, methyl benzoylformate and p-nitrobenzaldehyde,
  so it is a broad-specificity aromatic carbonyl reductase. A GFP fusion localizes to the cytoplasm at
  the cell poles. It is about 28-30% identical to mammalian sepiapterin reductases, but no physiological
  substrate or pathway has been established.'
