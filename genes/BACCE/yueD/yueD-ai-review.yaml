  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Verified against PubMed. On human SPR, not on YueD, so cited as a
      mechanistic caveat rather than as support: it shows that an SPR-family
      enzyme can handle quinones including 1,4-naphthoquinone by NADPH-dependent
      redox cycling separable from sepiapterin reduction. Relevant because
      YueD's tight Km for 1,4-naphthoquinone invites a quinone-detoxification
      reading that this mechanism would invert.
- id: file:BACCE/yueD/yueD-hypotheses/native-substrate-pocket-alphafold/openscientist.md
  title: 'OpenScientist: native substrate and pocket hypothesis for B. cereus YueD
    (AlphaFold pocket analysis)'
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      AI-generated analysis, cited for its measured pocket geometry and for the
      affinity-versus-efficiency split it surfaced from the curated kinetics.
      It fetched AlphaFold model v6 (global pLDDT 96.8), located the SDR tetrad
      Asn86/Ser140/Tyr154/Lys158 at pLDDT 98.0-98.9, measured an enclosed
      pocket, compared candidate substrate sterics from PubChem 3D, and ran
      Foldseek against pdb100 and the AlphaFold databases. It self-corrected a
      mid-run misreading of UniProt's "in decreasing order" phrasing once it
      retrieved the actual Km and kcat values, which is why its final judgment
      differs from its own earlier iteration. Its conclusion that a quinone
      cannot be named as the core function is adopted here; its pocket metrics
      are geometric, from an apo model, with no docking.
core_functions:
- description: >-
    YueD is a cytoplasmic NADPH-dependent broad-specificity aromatic carbonyl
    reductase (benzil -> (S)-benzoin and related diketones, quinones,
    aldehydes); physiological substrate unknown. Its substrate pocket is
    enclosed and aromatic/hydrophobic, and favours flat compact aromatic
    carbonyls over bulky twisted diaryl diketones, which matches the reported
    affinity ordering.
  molecular_function: *id002
  locations:
  - id: GO:0005737
    label: cytoplasm
  supported_by:
  - *id003
  - *id004
  knowledge_gaps:
  - gap_statement: >-
      The natural carbonyl substrate of YueD is undetermined, and the two
      available lines of evidence point to different candidate classes.
    boundary: >-
      Every substrate assayed is synthetic. Affinity and catalytic efficiency
      disagree: 1,4-naphthoquinone is the tightest binder (Km 27.6 uM vs 768 uM
      for benzil), but the most efficient substrate is the synthetic aryl-alkyl
      diketone 1-phenyl-1,2-propanedione, about 15-fold better than
      1,4-naphthoquinone by kcat/Km. Structural neighbours are sepiapterin
      reductases and SDR ketoreductases, with no quinone reductase among them,
      so family context argues for pterin or keto-reductase chemistry rather
      than a dedicated quinone reductase. Methylglyoxal and sepiapterin have
      never been assayed on this enzyme.
    gap_kind:
    - BIOLOGY
    significance: >-
      A tight Km for a quinone is not sufficient to call quinone detoxification
      the physiological role, and the obvious bacterial quinone, menaquinone, is
      a large lipophilic isoprenoid that this small soluble pocket would not
      accommodate. Naming the substrate class is what would let the review move
      beyond a deliberately general carbonyl reductase term.
    resolution: >-
      Assay recombinant YueD on natural flat aromatic carbonyls (ortho-quinones,
      isatin, aromatic aldehydes) and on sepiapterin and methylglyoxal, and
      profile a yueD deletion under electrophile and oxidative stress.
    provenance:
    - reference_id: file:BACCE/yueD/yueD-hypotheses/native-substrate-pocket-alphafold/openscientist.md
      supporting_text: >-
        **Lowest Km → 1,4-naphthoquinone (27.6 µM), tightest binder**
  - gap_statement: >-
      Whether YueD reduces quinones in its substrate pocket or redox-cycles them
      at the cofactor site is not dissected.
    boundary: >-
      Defined Km and kcat values for 1,4-naphthoquinone imply genuine
      substrate-pocket turnover. However, in the homologous human sepiapterin
      reductase, quinone handling is NADPH-dependent redox cycling by a
      mechanism distinct from sepiapterin reduction, separable by an
      active-site mutation. The distinction has not been tested for YueD.
    gap_kind:
    - BIOLOGY
    significance: >-
      If quinone turnover is cofactor-site redox cycling, it generates reactive
      oxygen species rather than detoxifying the quinone, which inverts the
      biological interpretation and would make a quinone reductase annotation
      actively misleading.
    resolution: >-
      Steady-state versus single-turnover kinetics with 1,4-naphthoquinone plus
      an oxygen-consumption or ROS assay, and a substrate-site mutant to test
      whether quinone activity survives loss of carbonyl reduction.
    provenance:
    - reference_id: PMID:23640889
      supporting_text: >-
        These data indicate that SPR-mediated reduction of sepiapterin and
        redox cycling occur by distinct mechanisms.
suggested_questions:
- question: What is the physiological substrate of this SDR? Benzil is a synthetic diketone 
    (GO:0102306 was obsoleted for that reason), so the native carbonyl substrate(s) remain to be 
    found.
- question: Should RHEA:25968 ((S)-benzoin + NADP+ = benzil + NADPH) be re-pointed from the EC 
    1.1.1.- grouping class GO:0016616 to GO:0004090 carbonyl reductase (NADPH) activity as a 
    narrowMatch, matching the sister EC 1.1.1.320 reaction RHEA:31891?
suggested_experiments:
- description: Untargeted substrate screen (metabolite library or activity-based metabolomics of 
    deletion vs. wild-type extracts) to identify native carbonyl substrates of the benzil reductase 
    clade.
  experiment_type: biochemical substrate profiling
  hypothesis: The enzyme reduces an endogenous aromatic or quinone carbonyl compound; benzil is a 
    surrogate substrate.
