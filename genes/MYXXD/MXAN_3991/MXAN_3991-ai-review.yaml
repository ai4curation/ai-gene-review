- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IDA
  original_reference_id: PMID:38591662
  qualifier: enables
  review:
    summary: Directly measured ATP hydrolysis is missing from the seeded annotations.
    action: NEW
    reason: PMID38591662 directly measured ATP turnover by purified M. xanthus ImuA using phosphate-release
      assays, with enhancement by single- and double-stranded DNA. This supports ATP hydrolysis activity.
      DNA stimulation alone does not establish ATP-dependent modification of DNA, helicase activity, or
      a demonstrated ATP-driven mutasome disassembly mechanism. The proposal is a molecular activity and
      is neither an ancestor nor a descendant of the existing ATP-binding claim.
    supported_by: *id001
