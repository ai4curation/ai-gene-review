  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary-source scope and accessibility are documented in source-scope.md. The 2021 local
      cache remains abstract-only; external full text and Figure 1 were read. The 2024 local full text
      and downloaded supplement were inspected.
- id: PMID:38591662
  title: Myxococcus xanthus translesion DNA synthesis protein ImuA is an ATPase enhanced by DNA.
  findings:
  - statement: Purified M. xanthus ImuA binds DNA and hydrolyzes ATP, with DNA-enhanced turnover; its
      proposed role in mutasome assembly/disassembly is not directly reconstituted.
  - statement: The paper reports a 30.3-kDa ImuA monomer and an interaction interval spanning residues
      223–290, consistent with the verified Q1D5A2 sequence.
    supporting_text: An ImuA monomer is calculated to be 30.3 kDa.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text reread. Additional sequence checks reproduce 290 residues, 30,274-Da
      source-record mass, R71/T72 and the terminal 223–290 interval. Together with the prior promoter/CDS
      identity bridge these strongly support attribution to Q1D5A2; no complete synthetic-construct sequence
      match is claimed. ATPase coupling to mutasome assembly/disassembly remains hypothetical.
- id: file:analysis/module_audits/bacterial_imuabc_damage_induced_mutagenesis/myxococcus-consultation/RESULTS.md
  title: Primary-sequence identity bridge for Myxococcus xanthus ImuA
  findings:
  - statement: The primary imuA promoter sequence uniquely maps immediately upstream of MXAN_3991; its
      CDS translation equals the Q1D5A2 sequence.
- id: file:analysis/module_audits/bacterial_imuabc_damage_induced_mutagenesis/myxococcus-consultation/source-scope.md
  title: Myxococcus ImuA primary-source scope and evidence limits
  findings:
  - statement: The 2021 and 2024 assays support different condition-dependent aspects of ImuA, without
      establishing a complete biochemical lesion-bypass cycle.
- id: file:analysis/module_audits/bacterial_imuabc_damage_induced_mutagenesis/round1-gene-consultation/RESULTS.md
  title: 'PR6169 gene consultation: mapping scope and ImuA activities'
  findings:
  - statement: Separate measured ATP hydrolysis from the directly supported RecA1-inhibitor role and its
      biological lesion-bypass association.
  - statement: The 2024 protein matches Q1D5A2 length, rounded mass, R71/T72 positions and the endpoint
      of the 223–290 interaction interval, strengthening attribution without an exact complete-construct
      sequence match.
