- term:
    id: GO:0006281
    label: DNA repair
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR013765
  review:
    summary: Refine the broad repair assignment to the supported error-prone lesion-bypass process.
    action: MODIFY
    reason: 'Target-strain genetics and direct ImuB/RecA1 interactions in PMID34190612 support an accessory
      contribution to mutagenic lesion bypass, rather than establishing that ImuA itself catalyzes homologous
      recombination. Its physical regulatory activity supplies work in the process; it is not merely a
      necessary substrate. The imuA deletion reduced rather than abolished induced mutagenesis, so absolute
      indispensability is not asserted. GO0042276 specifies this mechanism. This is a branch correction:
      current GO does not place error-prone translesion synthesis under GO0006281, although the broad
      repair definition includes bypass.'
    proposed_replacement_terms:
    - id: GO:0042276
      label: error-prone translesion synthesis
