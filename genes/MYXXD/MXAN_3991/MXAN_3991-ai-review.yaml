  review:
    summary: Single-stranded DNA binding is supported by direct biochemical measurements.
    action: ACCEPT
    reason: PMID38591662 measured binding of purified M. xanthus ImuA to short single-stranded DNA by
      fluorescence polarization and found nucleotide-dependent changes in affinity. PMID34190612 had not
      detected DNA binding using a different long-DNA mobility-shift assay. The later positive assay supports
      the claim under measured conditions; the earlier negative result is not evidence of universal absence.
      The accession bridge is documented by the primary promoter/genome sequence analysis.
