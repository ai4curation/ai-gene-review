- id: PMID:34190612
  title: ImuA Facilitates SOS Mutagenesis by Inhibiting RecA-Mediated Activity in Myxococcus xanthus.
  findings:
  - statement: M. xanthus DK1622 ImuA physically associates with ImuB and RecA1 and inhibits RecA1 activity;
