  label: Myxococcus xanthus DK 1622
description: ImuA (MXAN_3991) is a RecA-like accessory protein of Myxococcus xanthus DK1622 involved in
  mutagenic DNA lesion bypass. It binds DNA and hydrolyzes ATP, with hydrolysis enhanced by DNA. It associates
  with ImuB and RecA1 and inhibits RecA1-mediated DNA binding and recombination. These activities support
  a role in balancing recombination and translesion synthesis, although coupling of its ATPase cycle to
  assembly or disassembly of the lesion-bypass machinery remains a mechanistic hypothesis.
