suggested_questions:
- question: Which ecdysteroids (ecdysone, 20-hydroxyecdysone, 2-deoxyecdysone and
    others) does eck phosphorylate in vivo in the oocyte, and does it also accept
    non-ecdysteroid or plant-derived substrates, as the expansion of its Lep1 clade
    with host-plant diversity might suggest?
- question: Given that BmEc22K (subfamily A, PTHR11012:SF54) and AgEcK2 (subfamily
    D) are the only characterised ecdysteroid 22-kinases, which EcKL subfamilies
    can safely inherit ecdysteroid 22-kinase activity by annotation transfer?
suggested_experiments:
- description: Knock out eck in B. mori with CRISPR/Cas9 and measure ovarian ecdysteroid
    22-phosphate levels, embryonic free ecdysteroid titres and embryonic development,
    to test whether the phosphate reservoir is needed in vivo.
- description: Express recombinant eck and profile its substrates on a panel of ecdysteroids
    and host-plant secondary metabolites, to separate hormone-conjugating from detoxifying
    activities within the Lep1 clade.
