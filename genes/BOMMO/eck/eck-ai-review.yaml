- description: >-
    ATP-dependent phosphorylation of free ecdysteroids at the C-22 hydroxyl,
    making inactive ecdysteroid 22-phosphates. In the oocyte this stores
    maternal ecdysteroid as a reservoir that ecdysteroid-phosphate phosphatase
    reactivates in the early embryo.
