id: Q0PCR8
gene_symbol: eck
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7091
  label: Bombyx mori
description: >-
  eck (BmEc22K, EcKinase) encodes the ecdysteroid 22-kinase of the silkworm
  Bombyx mori, a 386-residue cytosolic small-molecule kinase of the
  ecdysteroid kinase-like (EcKL) family with a CHK/aminoglycoside
  phosphotransferase-like fold and a conserved Brenner catalytic-loop motif.
  The enzyme was purified from ovary cytosol and its cDNA cloned and expressed,
  establishing that it transfers phosphate from ATP to the C-22 hydroxyl of
  free ecdysteroids to form physiologically inactive ecdysteroid
  22-phosphates. In the ovary, ecdysteroids made by follicle cells are taken up
  by the oocyte and phosphorylated there; eck mRNA is found in nurse cells and
  the oocyte, and the protein mainly in the outer region of the oocyte.
  Together with ecdysteroid-phosphate phosphatase, which reactivates the
  conjugates in the early embryo, eck forms a reversible phosphoconjugation
  cycle that stores maternal ecdysteroid as an inactive reservoir. The
  physiological role rests on biochemistry and expression; no loss-of-function
  study has been reported. Phylogenetically it lies in EcKL subfamily A
  (Lepidoptera clade Lep1); the only other characterised ecdysteroid
  22-kinase, from Anopheles, belongs to a different subfamily (D).
existing_annotations:
- term:
    id: GO:0106389
    label: ecdysteroid 22-kinase activity
  evidence_type: IDA
  original_reference_id: PMID:16899460
  qualifier: enables
  review:
    summary: >-
      Founding characterisation of ecdysteroid 22-kinase. The native enzyme was
      purified from B. mori ovary cytosol and characterised kinetically. Its
      cDNA was cloned from peptide sequence, and recombinant expression of the
      ORF confirmed that it encodes the active enzyme, which converts free
      ecdysteroids to ecdysteroid 22-phosphates.
    action: ACCEPT
    reason: >-
      This is direct biochemical evidence on this gene product, from purified
      native enzyme plus expression of the cloned ORF. The term definition
      (ecdysteroid + ATP = ecdysteroid 22-phosphate + ADP + H+) matches the
      reported reaction exactly, and the term was created for this enzyme
      (synonym EcKinase). The catalytic-loop Brenner motif is retained
      (HADYRTCN, 236-243), consistent with an active phosphotransferase. This
      is the core molecular function of the gene. Only the abstract was
      readable (the full text could not be retrieved), so substrate range and
      kinetic constants are not recorded here.
    supported_by:
    - reference_id: PMID:16899460
      supporting_text: The cloned cDNA was confirmed to encode the functional
        EcKinase using the transformant harboring the open reading frame of
        EcKinase.
    - reference_id: PMID:19456376
      supporting_text: ecdysteroid 22-kinase (EcKinase) has been shown to catalyze
        the conversion of free ecdysteroids to physiologically inactive ecdysteroid
        22-phosphates
    - reference_id: file:BOMMO/eck/eck-bioinformatics/RESULTS.md
      supporting_text: 'Brenner motif HxDhxxxN: HADYRTCN at 236-243 (H236, D238, N243)'
- term:
    id: GO:0045455
    label: ecdysteroid metabolic process
  evidence_type: IDA
  original_reference_id: PMID:16899460
  qualifier: involved_in
  review:
    summary: >-
      eck catalyses the reversible conjugation step of ovarian ecdysteroid
      metabolism, converting free ecdysteroids to ecdysteroid 22-phosphates.
      Ecdysteroid-phosphate phosphatase reverses this step.
    action: NEW
    reason: >-
      This passes the participation test, because eck is the catalyst of an
      ecdysteroid metabolic step, not its substrate or a necessary upstream
      factor. The general metabolic-process term is chosen on purpose.
      GO:0046344 ecdysteroid catabolic process would misrepresent the biology,
      because the 22-phosphates are a reversible storage form that is
      reactivated in the embryo, not a breakdown product. GO:0045456
      ecdysteroid biosynthetic process is also wrong, because eck does not make
      the steroid nucleus. No developmental or reproductive process term is
      proposed, because there are no loss-of-function data for eck. The current
      GOA set has no BP annotation, so this adds the process that the
      demonstrated activity directly carries out.
    supported_by:
    - reference_id: PMID:16899460
      supporting_text: the reciprocal conversion of free ecdysteroids and ecdysteroid
        22-phosphates by two enzymes, EcKinase and ecdysteroid-phosphate phosphatase,
        plays an important role in ecdysteroid economy of the ovary-egg system of
        B. mori
    - reference_id: PMID:19524123
      supporting_text: 'The phosphoconjugation pathway is a reversible process, comprising
        two enzyme systems: ecdysteroid 22-kinase (EcKinase) and ecdysteroid-phosphate
        phosphatase (EPPase).'
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IDA
  original_reference_id: PMID:16899460
  qualifier: located_in
  review:
    summary: >-
      Native EcKinase activity was purified from the cytosolic fraction of
      silkworm ovaries.
    action: NEW
    reason: >-
      The enzyme was isolated from the ovary cytosol fraction, and its identity
      was tied to this gene by peptide sequencing of the purified protein. The
      sequence has no signal peptide or transmembrane segment (no such features
      in UniProt), which fits a soluble cytosolic kinase. Immunohistochemistry
      shows the protein mainly in the outer region of the oocyte, which is
      consistent with this but does not give a finer compartment. Confidence is
      moderate, because the evidence is subcellular fractionation reported in an
      abstract.
    supported_by:
    - reference_id: PMID:16899460
      supporting_text: ecdysteroid 22-kinase (EcKinase) was purified from the cytosol
        of the silkworm Bombyx mori ovaries
    - reference_id: PMID:18828659
      supporting_text: EcKinase immunoreactivity localizes mainly in the external
        region of the oocyte, not in nurse cells or follicle cells
references:
- id: PMID:16899460
  title: Purification, kinetic characterization, and molecular cloning of a novel
    enzyme, ecdysteroid 22-kinase.
  findings:
  - statement: EcKinase was purified about 1,800-fold from B. mori ovary cytosol,
      cloned, and shown by expression of the ORF to encode the functional enzyme.
    supporting_text: The cloned cDNA was confirmed to encode the functional EcKinase
      using the transformant harboring the open reading frame of EcKinase.
  - statement: The protein has phosphotransferase sequence features (Brenner motif,
      putative ATP-binding sites).
    supporting_text: EcKinase has an amino acid sequence characteristic of phosphotransferases,
      in that it harbors Brenner's motif and putative ATP binding sites
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary characterisation, PubMed-verified (PMID 16899460, J Biol
      Chem 2006). It is the UniProt sequence reference for Q0PCR8 and the source of
      the GOA IDA. Only the abstract was available; the JBC/Elsevier full text
      returned 403.
- id: PMID:19456376
  title: The role of ecdysteroid 22-kinase in the accumulation of ecdysteroids in
    ovary of silkworm Bombyx mori.
  findings:
  - statement: Ecdysteroids made in follicle cells are phosphorylated by EcKinase
      in the oocyte; EcKinase mRNA comes from nurse cells and the oocyte.
    supporting_text: transferred into the oocyte where they are phosphorylated by
      EcKinase whose mRNA originates from nurse cells and the oocyte itself
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. From the same group; it gives expression and
      localisation of the eck product in the ovary.
- id: PMID:18828659
  title: Synthesis and phosphorylation of ecdysteroids during ovarian development
    in the silkworm, Bombyx mori.
  findings:
  - statement: EcKinase mRNA is in the oocyte and nurse cells; the protein is mainly
      in the outer region of the oocyte.
    supporting_text: EcKinase immunoreactivity localizes mainly in the external region
      of the oocyte, not in nurse cells or follicle cells
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Expression and immunolocalisation in ovary.
- id: PMID:19524123
  title: Phosphoconjugation and dephosphorylation reactions of steroid hormone in
    insects.
  findings:
  - statement: Review of the reversible EcKinase/EPPase phosphoconjugation system.
    supporting_text: The phosphoconjugation pathway is a reversible process, comprising
      two enzyme systems
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review by the discovering group; abstract only.
- id: PMID:38291829
  title: Phylogenomics of the Ecdysteroid Kinase-like (EcKL) Gene Family in Insects
    Highlights Roles in Both Steroid Hormone Metabolism and Detoxification.
  findings:
  - statement: BmEc22K belongs to EcKL subfamily A and AgEcK2 to subfamily D.
    supporting_text: The ecdysteroid 22-kinases BmEc22K and AgEcK2 belong to subfamilies
      A and D, respectively
  - statement: BmEc22K is the only Lep1-clade gene in B. mori, and Lep1 size tracks
      host-plant diversity across Lepidoptera, suggesting functional shifts within
      the clade.
    supporting_text: notably, the ecdysteroid 22-kinase BmEc22K belongs to the Lep1
      clade and is the only member of this clade in B.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. It gives the phylogenetic framework used to limit
      transfer of the 22-kinase function to relatives.
- id: PMID:39208453
  title: Genetic characterization of candidate ecdysteroid kinases in Drosophila
    melanogaster.
  findings:
  - statement: The Drosophila orthologs of BmEc22K (Wallflower, Pinkman) are not
      essential, and Wall does not behave as a 20E-inactivating kinase in misexpression
      tests.
    supporting_text: Wall and pkm null mutants are viable and fertile, suggesting
      that they are not essential for development or reproduction
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract cached. Relevant to transfer, because ecdysteroid 22-kinase
      activity is not confirmed in the fly subfamily-A orthologs.
- id: PMID:32540344
  title: Genomic and transcriptomic analyses in Drosophila suggest that the ecdysteroid
