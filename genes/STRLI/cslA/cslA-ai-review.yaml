  label: Streptomyces lividans TK24
description: CslA (SLIV_23475) is a membrane-integrated processive glycosyltransferase of Streptomyces
  lividans TK24. Its native amino-acid sequence is identical to the CslA of strain 1326 that, together
  with the copper-radical oxidase GlxA, synthesizes beta-1,4-glucan cellulose from UDP-glucose in a purified
  complex. The corresponding streptomycete machinery deposits a protective glycan at growing hyphal tips.
  The exact composition of the native glycan, its regulation in TK24 and the mechanism of c-di-GMP recognition
  remain unresolved.
