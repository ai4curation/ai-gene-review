core_functions:
- description: Catalytic glycosyltransferase subunit of a GlxA-dependent glycan synthase. UDP-glucose-dependent
    cellulose synthesis is directly established for the identical 1326 protein in a purified complex;
    exact native polymer composition and TK24 pathway output remain unestablished.
