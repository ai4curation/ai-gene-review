    action: MODIFY
    summary: Specify the experimentally demonstrated cellulose synthase activity.
    reason: Purified 1326 CslA–GlxA consumes UDP-glucose and produces cellulase-sensitive beta-1,4-glucan
      confirmed by mass-spectrometric comparison with cellulose. CslA supplies the glycosyltransferase
      active site; GlxA is its partner. Complete native sequence identity supports transfer of this biochemical
      activity to TK24, while preserving the fact that the assayed proteins were tagged and heterologously
      produced from 1326 genes. GO:0016760 is a checked descendant of hexosyltransferase. It does not
      assert that cellulose is the only native product or establish native TK24 flux.
    proposed_replacement_terms:
