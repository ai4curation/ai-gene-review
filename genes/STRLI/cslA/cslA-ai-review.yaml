knowledge_gaps:
- gap_statement: The native polymer composition and physiological regulation of this exact TK24 CslA protein
    have not been demonstrated; the source 1326 purified complex establishes cellulose-synthase chemistry
    but not exclusive native cellulose production.
  boundary: The native protein sequence is identical to the assayed 1326 CslA and the purified complex
    synthesizes cellulose from UDP-glucose.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  provenance:
  - reference_id: PMID:38557137
    supporting_text: it remains to be established whether this is also the glucan that is produced in
      vivo.
- gap_statement: The direct c-di-GMP-binding site in the CslA–GlxA complex is unresolved.
  boundary: c-di-GMP enhances the purified complex activity, but assigning direct ligand binding to CslA
    or GlxA remains hypothetical.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  provenance:
  - reference_id: PMID:38557137
    supporting_text: The detailed interactions between CslA and GlxA and the identification of the c-di-GMP
      binding site(s) need to be further investigated in the future.
suggested_questions:
- question: What is the linkage and monosaccharide composition of the CslA-dependent polymer made by native
    TK24 under defined growth conditions?
- question: Which subunit residues directly bind c-di-GMP, and how does this interaction activate the
    complex?
