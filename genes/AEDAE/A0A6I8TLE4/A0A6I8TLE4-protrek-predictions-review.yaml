id: A0A6I8TLE4
gene_symbol: A0A6I8TLE4
taxon:
  id: NCBITaxon:7159
  label: Aedes aegypti
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a predicted Aedes aegypti RasGAP (raskol
  ortholog, PTHR10194:SF60). The protein has no GOA annotations. ProTrek places it in Ras
  regulation confidently - four of the top five calls are about Ras or GTPase regulation,
  and the free-text Function channel returns the C. elegans gap-1 description ("acts as a
  negative regulator for the member of the Ras family let-60 ... by stimulating its
  intrinsic GTPase activity") at a score of 20.0 - and recovers this review's core
  biological process exactly at rank 5. The one substantive error is at rank 1, where it
  returns the *exchange factor* complex rather than the GTPase-activating one: GEF and GAP
  act on the same substrate in opposite directions, and the retrieval does not separate
  them. The core molecular function itself (GTPase activator activity, which ProtNLM2 did
  predict) never appears in the top 25.
  Assessment: 2 correct novel (COR), 1 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/AEDAE/A0A6I8TLE4/A0A6I8TLE4-uniprot.txt
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:1905742
      label: Ras guanyl-nucleotide exchange factor complex
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Top-ranked hit (score 15.43). A RasGAP accelerates GTP hydrolysis; a RasGEF catalyses
        GDP release and loading of GTP. They are opposite activities carried by unrelated
        catalytic folds, and this protein carries the RasGAP domain (IPR001936, PF00616) with
        the PROSITE PS00509 catalytic signature. Retrieval matches on shared topic - Ras
        nucleotide-state regulation - and does not preserve the sign of the regulation, the
        same directional blindness seen at other queries in this benchmark. It also asserts a
        complex where the domain evidence supports a single-chain enzyme.
      supported_by:
        - reference_id: file:AEDAE/A0A6I8TLE4/A0A6I8TLE4-uniprot.txt
          supporting_text: PANTHER; PTHR10194:SF60; RAS GTPASE-ACTIVATING PROTEIN RASKOL; 1.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0045873
      label: negative regulation of sevenless signaling pathway
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Rank 2 (score 15.36). The sevenless pathway is the Drosophila receptor tyrosine
        kinase-Ras cascade in R7 photoreceptor specification, and negative regulation of it
        is precisely what Drosophila Gap1 and raskol do; this protein is the Aedes raskol
        ortholog. The term is unusually insect-appropriate - a rare case in this benchmark of
        a call that is both taxon-correct and pathway-specific - and it is absent from GOA
        (which is empty). Scored COR with the caveat that sevenless itself is a Drosophila
        gene and a curator would need to confirm the Aedes pathway equivalent.
      supported_by:
        - reference_id: file:AEDAE/A0A6I8TLE4/A0A6I8TLE4-uniprot.txt
          supporting_text: PANTHER; PTHR10194:SF60; RAS GTPASE-ACTIVATING PROTEIN RASKOL; 1.
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0043087
      label: regulation of GTPase activity
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Rank 3 (score 15.36). Correct and novel with respect to GOA, though general: it does
        not say which GTPase or in which direction. The specific and correct version -
        negative regulation of Ras protein signal transduction, an exact match to this
        review's core process - is present at rank 5, so for this protein the useful answer
        is inside the top five but not at the top of it.
      supported_by:
        - reference_id: file:AEDAE/A0A6I8TLE4/A0A6I8TLE4-uniprot.txt
          supporting_text: PANTHER; PTHR10194:SF60; RAS GTPASE-ACTIVATING PROTEIN RASKOL; 1.
