id: A0A6I8TLE4
gene_symbol: A0A6I8TLE4
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7159
  label: Aedes aegypti
description: >-
  A0A6I8TLE4 is the 1442-residue AAEL019982-PE splice product of Aedes aegypti
  gene AAEL019982 (NCBI Gene 5579847), one of five UniProt products of this gene
  that differ only in their first ~130 residues. It is the mosquito ortholog of
  Drosophila raskol, sharing PANTHER subfamily PTHR10194:SF60 and 61% sequence
  identity with it, and belongs to the DAB2IP/RASAL2/SynGAP-like branch of the
  Ras GTPase-activating protein family. The protein has an N-terminal
  SynGAP-like PH domain, a C2 domain, a central RasGAP domain that retains the
  catalytic arginine finger (R483, in a TFRGNS finger loop identical to raskol
  and neurofibromin), a long disordered middle region, and a C-terminal
  DAB2IP-type (DAB2P_C) region. By homology it is expected to accelerate GTP
  hydrolysis by a Ras-subfamily small GTPase and so to damp Ras-type signalling;
  its substrate has not been identified. The Drosophila ortholog localises to the
  plasma membrane and apical cell cortex of epithelial cells, colocalises with
  E-cadherin at cell-cell contacts and is needed for border-cell adhesion and
  actin-protrusion control. The mosquito protein itself has not been studied
  experimentally.
