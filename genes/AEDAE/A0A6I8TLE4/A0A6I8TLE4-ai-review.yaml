suggested_questions:
  - question: >-
      Which small GTPase does the raskol branch act on? Human DAB2IP and RASAL2
      act on Ras and SynGAP on Ras and Rap, yeast BUD2 on the Rap-like Rsr1, and
      C. elegans gap-2 genetically on LET-60 Ras. If insect raskol is a Ras GAP,
      GO:0046580 negative regulation of Ras protein signal transduction would be
      justified for the branch; PAINT currently assigns only GO:1902531 at the
      family root.
  - question: >-
      Do the five AAEL019982 products, which differ only in their first ~130
      residues (partly within the broad PH-domain region), differ in membrane
      targeting or tissue expression?
  - question: >-
      Does the mosquito protein, like Drosophila raskol, colocalise with
      E-cadherin at adherens junctions?
suggested_experiments:
  - hypothesis: >-
      The RasGAP domain of A0A6I8TLE4 stimulates GTP hydrolysis by a mosquito
      Ras-subfamily GTPase, and the R483A arginine-finger mutation abolishes it.
    description: >-
      Purify the RasGAP domain (wild type and R483A) and measure single-turnover
      GTP hydrolysis by recombinant A. aegypti Ras, Rap1 and R-Ras homologs
      (phosphate-release or fluorescent-nucleotide assays).
    experiment_type: biochemical assay
  - hypothesis: >-
      A0A6I8TLE4 localises to the plasma membrane and cell contacts through its
      PH and C2 domains.
    description: >-
      Express tagged full-length protein and PH/C2 deletion variants in Aag2
      cells and score cortical versus cytosolic localisation and colocalisation
      with E-cadherin.
    experiment_type: cell biology / microscopy
