        in the subfamily; the substrate is a fungal Rap-like GTPase and is not
        transferred to the mosquito protein.
existing_annotations:
  - term:
      id: GO:0005096
      label: GTPase activator activity
    qualifier: enables
    evidence_type: ISS
    original_reference_id: file:AEDAE/A0A6I8TLE4/A0A6I8TLE4-bioinformatics/RESULTS-rereview.md
    review:
      summary: >-
        Proposed annotation (GOA holds no rows for this accession). The protein
        has a complete RasGAP domain (IPR001936, 391-735) with the conserved site
        and retains the catalytic arginine finger (R483, TFRGNS). GTPase
        activator activity is the IBD assertion PAINT placed at the PTHR10194
        root node PTN008939999, from which A0A6I8TLE4 descends, and within its
        own subfamily SF60 purified BUD2 stimulates GTP hydrolysis by its Ras-like
        target and gap-2 complements a fission yeast RasGAP mutant.
      action: NEW
      reason: >-
        Family-wide catalytic function with an intact catalytic interface in the
        target. Kept at the general GTPase activator level because the substrate
        GTPase is not known for this protein or for raskol, and SF60 members
        target different Ras-subfamily GTPases.
      supported_by:
        - reference_id: file:AEDAE/A0A6I8TLE4/A0A6I8TLE4-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            The catalytic arginine finger of the RasGAP domain is conserved in
            A0A6I8TLE4.
        - reference_id: PMID:8371782
          supporting_text: >-
            Bud2p purified from yeast stimulates GTP
            hydrolysis by Bud1p
        - reference_id: PMID:9619631
          supporting_text: C. elegans gap-2 encodes a novel Ras-GAP
  - term:
      id: GO:1902531
      label: regulation of intracellular signal transduction
    qualifier: involved_in
    evidence_type: ISS
    original_reference_id: file:AEDAE/A0A6I8TLE4/A0A6I8TLE4-bioinformatics/RESULTS-rereview.md
    review:
      summary: >-
        Proposed annotation replacing the earlier proposals of GO:0007265 Ras
        protein signal transduction and GO:0046580 negative regulation of Ras
        protein signal transduction. This is the process term PAINT placed at the
        PTHR10194 root node alongside GTPase activator activity, and the term
        raskol, gap-2 and BUD2 carry by IBA. A GAP acts on the GTPase of a
        signalling cassette rather than relaying the signal, so GO:0007265 was
        the wrong relation; and although one of the node's seeds, human DAB2IP
        (Q5VWQ8), has an experimental (IMP) annotation to GO:0046580, PAINT
        curators propagated only the general regulation term, which is treated
        here as a deliberate decision given the varied substrates within the
        family.
      action: NEW
      reason: >-
        Follows the PAINT node placement and the conserved catalytic domain.
        A more specific Ras-pathway term would need evidence on the substrate
        GTPase for this branch.
      supported_by:
        - reference_id: PMID:9619631
          supporting_text: >-
            GAP-2 appears to function as a negative regulator of LET-60 Ras
            during larval development
        - reference_id: file:AEDAE/A0A6I8TLE4/A0A6I8TLE4-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            Drosophila raskol is by far the closest relative and shares the
            PANTHER subfamily, so it is the dipteran ortholog.
  - term:
      id: GO:0005886
      label: plasma membrane
    qualifier: located_in
    evidence_type: ISS
    original_reference_id: PMID:30763317
    review:
      summary: >-
        Proposed annotation by transfer from the Drosophila ortholog raskol
        (same PANTHER subfamily SF60, 61% identity), which localises to the cell
        membrane and apical surface of epithelial cells and colocalises with
        DE-cadherin at cell contacts. The target has the same SynGAP-like PH and
        C2 membrane-binding modules. The earlier proposal of cytosol was withdrawn:
        no evidence placed the ortholog in the cytosol rather than at the
        membrane and cortex.
      action: NEW
      reason: >-
        Ortholog localisation, consistent with the conserved PH and C2 domains.
        Placed outside core function because it rests on a single ortholog
        study.
      supported_by:
        - reference_id: PMID:30763317
          supporting_text: >-
            In Drosophila stage 8 embryos, before BCs have delaminated, Raskol
            localized to the cell membrane of BCs and PCs and was enriched at the
            PC apical membrane
