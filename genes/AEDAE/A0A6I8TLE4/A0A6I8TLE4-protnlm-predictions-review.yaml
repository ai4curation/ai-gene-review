id: A0A6I8TLE4
gene_symbol: A0A6I8TLE4
taxon:
  id: NCBITaxon:7159
  label: Aedes aegypti
status: COMPLETE
description: >-
  A0A6I8TLE4 is an AAEL019982 splice product and the mosquito ortholog of
  Drosophila raskol (PANTHER PTHR10194:SF60), with a complete RasGAP domain that
  retains the catalytic arginine finger. The single ProtNLM2 GO prediction,
  GTPase activator activity, is supported by the PAINT IBD at the PTHR10194 root
  node and by biochemical GAP activity of an SF60 relative. GOA holds no
  annotation for this accession or for any of the other four AAEL019982
  products, so the prediction is novel.
