predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0005096
      label: GTPase activator activity
    predicted_term_type: GO_MF
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        The target has a complete RasGAP domain (IPR001936) with the RasGAP
        conserved site and keeps the catalytic arginine finger (R483 in a TFRGNS
        loop identical to raskol and matching neurofibromin). Mutational work on
        neurofibromin and p120GAP shows that the finger loop stabilises the
        GTP-hydrolysis transition state (PMID:12787671). PAINT placed GTPase
        activator activity as an IBD at the PTHR10194 root node PTN008939999,
        from which this protein descends, and within subfamily SF60 purified
        yeast Bud2p stimulates GTP hydrolysis by its Ras-like target
        (PMID:8371782). This is a phylogenetic and mechanistic inference; the
        mosquito protein has not been assayed, and the general term is
        appropriate because the substrate GTPase is unknown. The re-reviewed gene
        review proposes the same term as a NEW core function. QuickGO returns no
        annotation for A0A6I8TLE4 or the other AAEL019982 products, and the
        UniProt keyword-derived GO line is not in GOA, so the prediction is novel.
      supported_by:
        - reference_id: file:AEDAE/A0A6I8TLE4/A0A6I8TLE4-uniprot.txt
          supporting_text: >-
            DR   InterPro; IPR023152; RasGAP_CS. ... DR   InterPro; IPR001936;
            RasGAP_dom. ... DR   PANTHER; PTHR10194:SF60; RAS GTPASE-ACTIVATING PROTEIN RASKOL; 1.
        - reference_id: file:AEDAE/A0A6I8TLE4/A0A6I8TLE4-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            The catalytic arginine finger of the RasGAP domain is conserved in
            A0A6I8TLE4.
        - reference_id: PMID:12787671
          supporting_text: >-
            The finger loop is crucial for the stabilization of the transition state
        - reference_id: PMID:8371782
          supporting_text: >-
            Bud2p purified from yeast stimulates GTP
            hydrolysis by Bud1p
        - reference_id: file:interpro/panther/PTHR10194/PTHR10194-paint.tsv
          supporting_text: PTN008939999
