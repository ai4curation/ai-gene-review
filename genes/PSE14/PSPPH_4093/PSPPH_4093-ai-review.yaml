- id: PMID:18836083
  title: The role of host protein YajQ in the temporal control of transcription in
    bacteriophage Phi6.
  full_text_unavailable: true
  findings:
  - statement: >-
      Bacteriophage phi6 is a double-stranded RNA phage whose three genomic
      segments are transcribed by an RNA-dependent RNA polymerase packaged
      inside the core particle, so the transcribing entity is a viral protein.
    supporting_text: >-
      The RNA is located inside a core particle composed of multiple copies of a
      major structural protein, an RNA-dependent RNA polymerase, a hexameric
      NTPase, and an auxiliary protein.
    reference_section_type: ABSTRACT
  - statement: >-
      The host yajQ product activates transcription of genomic segment L early
      in infection, which the virion polymerase does not transcribe on its own
      in vitro.
    supporting_text: >-
      A host protein encoded by yajQ is responsible for the activation of L
      transcription.
    reference_section_type: ABSTRACT
  - statement: >-
      YajQ works on the particle rather than on the enzyme, binding the major
      core structural protein P1, and core conformation is the known control on
      polymerase activity.
    supporting_text: >-
      YajQ acts indirectly on the polymerase by binding to P1, the major
      structural protein of the core.
    reference_section_type: ABSTRACT
  - statement: >-
      The host protein is required for phi6 replication, and the phage escapes
      the requirement only through two mutations in its polymerase gene.
    supporting_text: >-
      Phi6 can mutate to independence of YajQ. This requires two mutations in
      the gene for the RNA-dependent RNA polymerase.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified as Qiao, Sun, Qiao and Mindich, PNAS 2008;105:15956-60,
      and it is the right paper for this gene: the PMC full text names the locus
      PSPPH_4093 as the yajQ ortholog, with wild-type strain LM2489 and knockout
      LM4470, so the CACAO attribution comes from the authors rather than from
      an ortholog inference. The cached copy is abstract-only, and the abstract
      alone supports every claim used here. One statement used in this review
      comes from the PMC full text and is not quoted anywhere as
      supporting_text: that purified P2 polymerase is not stimulated by added
      YajQ. The paper is also the definition xref of GO:0140181, created in
      2025.
- id: PMID:20164238
  title: Interaction of a host protein with core complexes of bacteriophage phi6 to
    control transcription.
  full_text_unavailable: true
  findings:
  - statement: >-
      The activation of segment L transcription is mediated by YajQ interacting
      with the phage capsid structure.
    supporting_text: >-
      Transcription of genomic segment L is activated by the interaction of host
      protein YajQ with the capsid structure.
    reference_section_type: ABSTRACT
  - statement: >-
      GFP-tagged YajQ is uniformly distributed through the uninfected cell,
      which is independent evidence for a cytosolic location.
    supporting_text: >-
      Green fluorescent protein (GFP) fusions with YajQ produce uniform
      fluorescence in uninfected cells and in cells infected with viruses not
      dependent on YajQ.
    reference_section_type: ABSTRACT
  - statement: >-
      On infection by YajQ-dependent phage the protein redistributes to puncta
      and remains associated with the infecting particles.
    supporting_text: >-
      It appears that the host protein binds to the infecting particles and
      remains with them during the entire infection period.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified as Qiao, Sun, Qiao and Mindich, J Virol 2010;84:4821-5,
      the same group's follow-up to PMID:18836083. Not cited by any GOA row for
      this gene, which is itself notable: it supplies the localisation evidence
      that the electronic cytosol row lacks and the in-cell particle-association
      evidence behind the proposed virion-binding row. Abstract-only in the
      cache; all quotes used are from the abstract.
- id: PMID:12381839
  title: Structural and nucleotide-binding properties of YajQ and YnaF, two Escherichia
    coli proteins of unknown function.
  full_text_unavailable: true
  findings:
  - statement: >-
      YajQ was identified biochemically as a bacterial nucleotide-binding
      protein and its ligand binding measured directly.
    supporting_text: >-
      We used dye pseudoaffinity chromatography, two-dimensional gel
      electrophoresis, and mass spectrometry to identify two novel Escherichia
      coli nucleotide-binding proteins, YnaF and YajQ.
    reference_section_type: ABSTRACT
  - statement: The YajQ family is bacterial and absent from eukaryotes.
    supporting_text: >-
      The protein YajQ, present in many bacterial genomes, is missing in
      eukaryotes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified as Saveanu et al., Protein Sci 2002;11:2551-60. It is
      about the Escherichia coli ortholog, not this protein, and is used only as
      the experimental grounding for the family-level nucleotide-binding claim
      that the UniRule/HAMAP row propagates.
- id: PMID:12943362
  title: Crystal structure of the YajQ protein from Haemophilus influenzae reveals
    a tandem of RNP-like domains.
  full_text_unavailable: true
  findings:
  - statement: >-
      The YajQ fold is a tandem pair of RNP-like domains, a motif common in
      nucleic-acid-binding proteins.
    supporting_text: >-
      This structural motif is a characteristic feature of many RNA-binding
      proteins.
    reference_section_type: ABSTRACT
  - statement: The family is present in most bacteria and absent from archaea and eukaryotes.
    supporting_text: >-
      The protein is present in most bacteria, but not in archaea or eukaryotes.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified as Teplyakov et al., J Struct Funct Genomics 2003;4:1-9.
      Structural-genomics work on the Haemophilus influenzae ortholog, used as
      background on the fold only. Its suggestion that the crystal tetramer
      might bind double-stranded nucleic acid is a structural speculation and is
      not used to support any annotation.
- id: PMID:25329577
  title: Novel cyclic di-GMP effectors of the YajQ protein family control bacterial
    virulence.
  findings:
  - statement: >-
      Ligand preference is not conserved across the YajQ family: only the
      Pseudomonas aeruginosa and Stenotrophomonas maltophilia members bound
      cyclic di-GMP, while the Escherichia coli, Clostridium and Bacillus cereus
      members preferred ATP or GTP.
    supporting_text: >-
      Interestingly, affinity for cyclic di-GMP binding was only seen in YajQ
      family proteins from P. aeruginosa (PA4395) and S. maltophilia (Smlt4090)
      (Table S1). YajQ family proteins from E. coli, Clostridium sp. and B.
      cereus by contrast exhibited a greater affinity for ATP and/or GTP than
      for any cyclic mono- or di-nucleotide.
    reference_section_type: RESULTS
  - statement: >-
      Pseudomonas and Stenotrophomonas YajQ proteins bind cyclic di-GMP and
      contribute to virulence, the Pseudomonas aeruginosa member being required
      for host-cell adhesion and lung colonisation.
    supporting_text: >-
      Genetic and functional analysis of YajQ family members from the human
      pathogens Pseudomonas aeruginosa and Stenotrophomonas maltophilia showed
      that they also specifically bound cyclic di-GMP and contributed to
      virulence in model systems.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified as An et al., PLoS Pathog 2014;10:e1004429; full text
      cached. Used for two opposite purposes: it is the strongest reason to
      think a Pseudomonas YajQ might be a cyclic-di-GMP receptor, and, because
      its own Table S1 shows the family splitting on ligand, the reason not to
      refine GO:0000166 to a cyclic-di-GMP term for an unmeasured ortholog.
