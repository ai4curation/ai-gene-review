core_functions:
- description: >-
    Binds nucleotides as a soluble cytoplasmic YajQ-family protein built from two
    tandem RNP-like domains. This is the conserved, cell-intrinsic property of
    the protein and the only molecular function supportable for this ortholog:
    the family's defining biochemistry is nucleotide binding, but the preferred
    ligand is not conserved, so no narrower binding term can be asserted for an
    ortholog whose ligand has not been measured. The phage-directed activity for
    which this protein is best known is deliberately excluded from the core
    functions, since binding the bacteriophage phi6 core protein P1 and
    activating viral segment-L transcription is the phage exploiting a host
    surface rather than a function YajQ evolved to perform.
  molecular_function:
    id: GO:0000166
    label: nucleotide binding
