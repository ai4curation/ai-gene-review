suggested_questions:
- question: >-
    Which nucleotide does PSPPH_4093 actually bind? Its closest characterised
    relative, Pseudomonas aeruginosa PA4395, is a cyclic-di-GMP receptor, but
    the same study found Escherichia coli, Clostridium and Bacillus cereus YajQ
    proteins preferring ATP or GTP, so the ligand cannot be inferred from
    family membership.
  experts:
  - J. Maxwell Dow
  - Shi-Qi An
- question: >-
    Does PSPPH_4093 have a LysR-family partner in Pseudomonas savastanoi, as
    XC_3703 does in Xanthomonas campestris, and is the phi6 core protein P1
    recognised by the same surface that such a partner would use?
  experts:
  - J. Maxwell Dow
  - Shi-Qi An
- question: >-
    What does a yajQ knockout cost the uninfected cell? Both phi6 papers
    characterise the knockout only as non-permissive for the phage, so the
    native cellular role of this protein in this organism is unaddressed.
  experts:
  - Leonard Mindich
  - Xueying Qiao
- question: >-
    Does YajQ binding change the phi6 core conformation directly, and does
    nucleotide occupancy of YajQ gate that activity? If a nucleotide ligand
    switches the P1 interaction, the host's second-messenger state would set
    the phage's early transcription programme.
  experts:
  - Leonard Mindich
  - Xueying Qiao
- question: >-
    The two mutations that make phi6 independent of YajQ fall in the
    polymerase gene rather than in P1. Do they reproduce the core
    conformation that YajQ induces, and would a P1 mutant be viable at all?
  experts:
  - Leonard Mindich
  - Xueying Qiao
suggested_experiments:
- hypothesis: >-
    PSPPH_4093 binds a nucleotide ligand, and whether that ligand is cyclic
    di-GMP or a linear nucleoside triphosphate cannot be predicted from the
    Pseudomonas aeruginosa ortholog.
  description: >-
    Purify recombinant Q48EH2 and measure binding affinity for cyclic di-GMP,
    cyclic di-AMP, cyclic AMP, GTP, ATP, GDP and ADP by isothermal titration
    calorimetry, running Pseudomonas aeruginosa PA4395 and Escherichia coli
    YajQ in parallel as the two known family behaviours. The result settles
    whether GO:0000166 can be refined to a specific nucleotide-binding term
    for this ortholog.
  experiment_type: Isothermal titration calorimetry ligand panel
- hypothesis: >-
    The YajQ surface that binds phi6 P1 is a surface the protein normally
    presents to a cellular partner, so phage dependence and the native
    cellular interaction map to the same residues.
  description: >-
    Map the P1 contact by hydrogen-deuterium exchange mass spectrometry or
    cross-linking mass spectrometry on YajQ-bound phi6 core particles, then
    make point mutants in the mapped surface and score them in parallel for
    phi6 plaque support in a yajQ knockout background and for co-purification
    with host proteins by pull-down proteomics. Separation of the two
    phenotypes would show the phage has found a distinct site; coincidence
    would show it is mimicking a cellular ligand.
  experiment_type: Interaction-site mapping with separation-of-function mutants
- hypothesis: >-
    Nucleotide occupancy of YajQ gates its activation of phi6 segment-L
    transcription.
  description: >-
    Reconstitute the published in vitro transcription assay with purified
    phi6 nucleocapsids and recombinant YajQ, and compare segment-L transcript
    output with YajQ pre-loaded with each ligand from the calorimetry panel,
    and with ligand-binding-site mutants. A ligand-dependent shift in L
    transcription would link host second-messenger state to phage early gene
    expression.
  experiment_type: In vitro nucleocapsid transcription with defined YajQ ligand states
- hypothesis: >-
    PSPPH_4093 has a cellular function independent of phage infection that the
    existing literature has not examined.
  description: >-
    Phenotype the yajQ knockout LM4470 and a clean deletion in strain 1448A
    without phage: growth across carbon sources and temperatures, biofilm
    formation, motility, adhesion, and virulence on the bean host, with RNA-seq
    of knockout versus wild type to find the regulon. The Xanthomonas and
    Pseudomonas aeruginosa work predicts a transcriptional and adhesion
    phenotype; a clean result would mean the protein is dispensable to the cell
    and known only as a phage cofactor.
  experiment_type: Comparative phenotyping and transcriptomics of a yajQ deletion
