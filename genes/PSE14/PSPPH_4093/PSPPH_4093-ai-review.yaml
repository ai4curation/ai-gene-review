id: Q48EH2
gene_symbol: PSPPH_4093
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:264730
  label: Pseudomonas savastanoi pv. phaseolicola 1448A
description: >-
  PSPPH_4093 encodes the YajQ-family protein of Pseudomonas savastanoi pv.
  phaseolicola 1448A, a 159-residue soluble cytoplasmic protein built from two
  tandem RNP-like domains, each a four-stranded antiparallel beta-sheet packed
  against two helices. YajQ proteins are found in most bacteria and in neither
  archaea nor eukaryotes, and their one firmly established biochemical property
  is nucleotide binding; the preferred ligand is not conserved across the family,
  with the Pseudomonas aeruginosa and Stenotrophomonas maltophilia members
  binding cyclic di-GMP while the Escherichia coli, Clostridium and Bacillus
  cereus members prefer ATP or GTP. Where a YajQ protein has been characterised
  in its own cell it behaves as a nucleotide-controlled accessory factor for
  transcription: the Xanthomonas campestris member binds cyclic di-GMP and
  modulates the promoter occupancy of a LysR-family regulator, and the
  Pseudomonas aeruginosa member is required for host-cell adhesion and lung
  colonisation. The ligand and the cellular partners of the Pseudomonas
  savastanoi protein itself have not been measured. What this protein is known
  for is a function it performs for a virus rather than for the cell: the dsRNA
  bacteriophage phi6 requires it, and YajQ binds the phage core through P1, the
  major structural protein, altering the core conformation so that the
  encapsidated viral RNA-dependent RNA polymerase P2 transcribes genomic segment
  L early in infection. YajQ does not transcribe anything itself and does not
  stimulate free P2; phi6 cannot replicate in a yajQ knockout, and escapes the
  requirement only by acquiring two mutations in the polymerase gene.
existing_annotations:
- term:
    id: GO:0000166
    label: nucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002411992
  - UniRule:UR000032397
  review:
    summary: >-
      Nucleotide binding is the one biochemical property established for the
      YajQ family, and this electronic row sits at the granularity the evidence
      for this protein supports. The UniProt entry asserts it as a curated
      UniRule/HAMAP statement (MF_00632) together with YajQ family membership,
      and the family-level grounding is direct: Escherichia coli YajQ was
      isolated as a nucleotide-binding protein by dye pseudoaffinity
      chromatography and its ligand binding then measured by NMR and isothermal
      titration calorimetry (PMID:12381839). The fold is consistent, two tandem
      RNP-like domains of the kind found in nucleic-acid-binding proteins
      (PMID:12943362).
    action: ACCEPT
    reason: >-
      Kept at the parent term deliberately rather than refined, which is the
      unusual call here. The obvious refinement would be a cyclic-di-GMP binding
      term, since the closest characterised relative of this protein is
      Pseudomonas aeruginosa PA4395, a cyclic-di-GMP receptor. But the single
      study that established that specificity also showed the family does not
      conserve it: affinity for cyclic di-GMP was seen only in the Pseudomonas
      aeruginosa and Stenotrophomonas maltophilia proteins, while the
      Escherichia coli, Clostridium and Bacillus cereus proteins preferred ATP
      or GTP (PMID:25329577). No ligand has been measured for Q48EH2. Refining
      the term would therefore propagate a property across exactly the split the
      source study documents, so GO:0000166 is as precise as the evidence for
      this protein allows and is accepted as a core function.
    supported_by:
    - reference_id: file:PSE14/PSPPH_4093/PSPPH_4093-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Nucleotide-binding protein.'
    - reference_id: file:PSE14/PSPPH_4093/PSPPH_4093-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: 'SIMILARITY: Belongs to the YajQ family.'
    - reference_id: file:PSE14/PSPPH_4093/PSPPH_4093-uniprot.txt
      record_section: ["DR:HAMAP"]
      supporting_text: HAMAP; MF_00632; YajQ; 1.
    - reference_id: PMID:12381839
      supporting_text: >-
        We used dye pseudoaffinity chromatography, two-dimensional gel
        electrophoresis, and mass spectrometry to identify two novel Escherichia
        coli nucleotide-binding proteins, YnaF and YajQ.
      reference_section_type: ABSTRACT
    - reference_id: PMID:12381839
      supporting_text: >-
        In the absence of significant similarities of YajQ to any solved
        structure, we determined its structural and ligand-binding properties by
        NMR and isothermal titration calorimetry.
      reference_section_type: ABSTRACT
    - reference_id: PMID:25329577
      supporting_text: >-
        Interestingly, affinity for cyclic di-GMP binding was only seen in YajQ
        family proteins from P. aeruginosa (PA4395) and S. maltophilia
        (Smlt4090) (Table S1). YajQ family proteins from E. coli, Clostridium
        sp. and B. cereus by contrast exhibited a greater affinity for ATP
        and/or GTP than for any cyclic mono- or di-nucleotide.
      reference_section_type: RESULTS
    additional_reference_ids:
    - PMID:12943362
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN002411992
  review:
    summary: >-
      A TreeGrafter electronic assignment that happens to have direct
      experimental backing for this very protein. GFP fusions to this YajQ give
      uniform fluorescence throughout uninfected cells, redistributing into
      puncta only when the cell is infected by a phi6-type phage that depends on
      YajQ (PMID:20164238). The UniProt record declares no transmembrane segment
      and no signal peptide, so there is nothing competing with a soluble
      cytoplasmic assignment.
    action: ACCEPT
    reason: >-
      The row was examined as a synthesis row rather than taken on trust: what
      PANTHER PTN002411992 rests on is the cytoplasmic localisation of
      characterised YajQ-family proteins, and for this gene product the GFP
      experiment in PMID:20164238 confirms it independently, in the right
      organism, for the uninfected cell. Cytosol rather than a membrane or
      periplasmic compartment is also what the sequence predicts. Accepted as
      the location where the protein acts, including where it meets the
      incoming phage core.
    supported_by:
    - reference_id: PMID:20164238
      supporting_text: >-
        Green fluorescent protein (GFP) fusions with YajQ produce uniform
        fluorescence in uninfected cells and in cells infected with viruses not
        dependent on YajQ.
      reference_section_type: ABSTRACT
    - reference_id: file:PSE14/PSPPH_4093/PSPPH_4093-notes.md
      supporting_text: >-
        The UniProt record for Q48EH2 declares no transmembrane segment and no
        signal peptide, its only sequence feature being the full-length chain
        PRO_0000261963, which is consistent with the cytosolic assignment.
- term:
    id: GO:0039696
    label: RNA-templated viral transcription
  evidence_type: IDA
  original_reference_id: PMID:18836083
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: >-
      CACAO row, IDA, PMID:18836083. What the cited paper shows for this gene:
      bacteriophage phi6 carries three dsRNA genomic segments inside a core
      particle that also contains an RNA-dependent RNA polymerase; that virion
      polymerase transcribes segments M and S in vitro, but segment L is highly
      transcribed early in infection, and the host protein encoded by yajQ is
      what activates L transcription. YajQ does not touch the enzyme directly:
      it binds P1, the major structural protein of the core, and the core
      conformation is what controls polymerase activity. The paper's own full
      text names the locus as PSPPH_4093, so the gene attribution is the
      authors' own and not an ortholog guess. Whether the term matches: only
      with the qualifier doing a great deal of work. GO:0039696 is defined as a
      transcription process that uses viral RNA as a template and sits under
      viral transcription and viral gene expression, so it names the activity of
      the polymerase, which here is phage protein P2. YajQ performs none of it.
    action: MODIFY
    reason: >-
      The claim is right and the term is the wrong side of the host/virus
      boundary, and there is now a term that fixes it. GO:0140181 host-mediated
      activation of viral RNA-templated transcription was created on 2025-06-12
      with PMID:18836083, this paper, as its definition xref, two months after
      this row was made on 2025-04-25, and it still has no annotations at all.
      The row and the term therefore come from the same source and were never
      joined up. GO:0140181 says precisely what the paper shows, in the
      interspecies branch where a host factor belongs, at the granularity that
      matches phi6 being a dsRNA phage, and it takes involved_in, as all 1425
      annotations to its parent GO:0043923 do. Two things are worth stating
      about what is not wrong here. The branch is not wrong: phi6 is a
      double-stranded RNA phage, so RNA-templated transcription really is the
      process being activated, and nothing about this gene belonging to a
      bacterium puts the row on the wrong side of the DNA/RNA distinction. And
      the qualifier is not the defect on this row.
      acts_upstream_of_or_within_positive_effect is a legal GO
      biological-process relation and it is the right relation for a product
      that influences a process it does not execute, so it happens to fit
      GO:0039696 as written. That fit should not be read as a considered
      judgement, though: across the CACAO corpus the hedge appears on every
      2025-2026 row for terms whose earlier CACAO rows used involved_in, so it
      is a campaign-wide default rather than a per-row call, and these rows are
      dated 2025-04-25. The point is only that the qualifier question on this
      row is moot, because a term naming the wrong actor does not get repaired
      by a relation. The defect is the choice of term, filed as WRONG_TERM
      against CACAO with GO:0140181 as the correction.
    proposed_replacement_terms:
    - id: GO:0140181
      label: host-mediated activation of viral RNA-templated transcription
    supported_by:
    - reference_id: PMID:18836083
      supporting_text: >-
        A host protein encoded by yajQ is responsible for the activation of L
        transcription.
      reference_section_type: ABSTRACT
    - reference_id: PMID:18836083
      supporting_text: >-
        The virion RNA polymerase in the core particle transcribes segments M
        and S in vitro.
      reference_section_type: ABSTRACT
    - reference_id: PMID:18836083
      supporting_text: >-
        YajQ acts indirectly on the polymerase by binding to P1, the major
        structural protein of the core.
      reference_section_type: ABSTRACT
    - reference_id: PMID:18836083
      supporting_text: >-
        Bacteriophage Phi6 contains three dsRNA genomic segments L, M, and S.
      reference_section_type: ABSTRACT
    - reference_id: PMID:20164238
      supporting_text: >-
        Transcription of genomic segment L is activated by the interaction of
        host protein YajQ with the capsid structure.
      reference_section_type: ABSTRACT
    - reference_id: file:PSE14/PSPPH_4093/PSPPH_4093-notes.md
      supporting_text: >-
        QuickGO reports that GO:0140181 host-mediated activation of viral
        RNA-templated transcription was created on 2025-06-12, carries
        PMID:18836083 as its definition xref, and had zero annotations when
        queried on 2026-11-01.
    - reference_id: file:PSE14/PSPPH_4093/PSPPH_4093-notes.md
      supporting_text: >-
        GO:0039696 RNA-templated viral transcription is defined as a
        transcription process that uses viral RNA as a template, and its
        ancestors are GO:0019083 viral transcription, GO:0019080 viral gene
        expression and GO:0016032 viral process, so the term names the activity
        of whatever polymerase does the transcribing.
    source_defects:
    - defect_type: WRONG_TERM
      resource: CACAO
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0039696
      corrected_value: GO:0140181
      corrected_label: host-mediated activation of viral RNA-templated transcription
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        This GAF row (assigned_by CACAO, 2025-04-25, IDA, PMID:18836083) places
        the bacterial host protein PSPPH_4093 (YajQ) on GO:0039696 RNA-templated
        viral transcription. That term denotes the transcription reaction itself
        and is enabled by the phi6 RNA-dependent RNA polymerase P2 inside the
        viral core; YajQ binds the core structural protein P1 and changes the
        core conformation, and the cited paper states explicitly that YajQ acts
        indirectly on the polymerase. The qualifier
        acts_upstream_of_or_within_positive_effect keeps the row from asserting
        that the host protein transcribes, but the term is still a viral-process
        term applied to a host factor. GO:0140181 host-mediated activation of
        viral RNA-templated transcription, created on 2025-06-12 with this same
        PMID as its definition xref and currently carrying no annotations, is
        the exact term for this claim and takes the ordinary involved_in
        qualifier. Requested change: repoint GO:0039696 to GO:0140181 and set
        the qualifier to involved_in. The reference, evidence code and gene
        product are all correct and should not change.
      supported_by:
      - reference_id: PMID:18836083
        supporting_text: >-
          YajQ acts indirectly on the polymerase by binding to P1, the major
          structural protein of the core.
        reference_section_type: ABSTRACT
      - reference_id: file:PSE14/PSPPH_4093/PSPPH_4093-notes.md
        supporting_text: >-
          QuickGO reports that GO:0140181 host-mediated activation of viral
          RNA-templated transcription was created on 2025-06-12, carries
          PMID:18836083 as its definition xref, and had zero annotations when
          queried on 2026-11-01.
    additional_reference_ids:
    - PMID:20164238
- term:
    id: GO:1903902
    label: positive regulation of viral life cycle
  evidence_type: IDA
  original_reference_id: PMID:18836083
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: >-
      CACAO row, IDA, PMID:18836083, same paper and same date as the row above.
      What the cited paper shows for this gene: yajQ knockouts do not support
      phi6 replication, and phi6 escapes the requirement only by acquiring two
      mutations in the RNA-dependent RNA polymerase gene, so the host protein is
      genuinely required for, and promotes, the phage life cycle. Whether the
      term matches: in substance yes, and this row is not in the same difficulty
      as the GO:0039696 row, because a positive-regulation term is something a
      host factor can legitimately carry. The problem is that it is
      uninformative about which part of the life cycle and by what route, when
      the paper pins both down to activation of segment-L transcription on the
      viral core.
    action: MODIFY
    reason: >-
      Correct but general, so MODIFY rather than KEEP_AS_NON_CORE. The
      replacement is GO:0140181 host-mediated activation of viral RNA-templated
      transcription, the same term the GO:0039696 row moves to, which merges two
      rows built from one experiment into the single statement that experiment
      supports. GO:0140181 is not a descendant of GO:1903902, since it sits in
      the interspecies branch under GO:0043923 rather than under regulation of
      viral life cycle, so this is a lateral correction rather than a
      refinement. Separately, this row does have a genuine qualifier defect, and
      unlike the GO:0039696 row it is the AcrIIA5 pattern:
      acts_upstream_of_or_within_positive_effect on a term that already means
      positive regulation stacks a second regulatory layer on a regulatory term,
      and YajQ is the entity doing the regulating, so involved_in is correct.
      Both defects are filed below. The claim itself is kept, not weakened: the
      knockout and the escape mutations are strong, and the only thing changing
      is which term and relation carry them.
    proposed_replacement_terms:
    - id: GO:0140181
      label: host-mediated activation of viral RNA-templated transcription
    supported_by:
