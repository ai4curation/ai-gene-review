- term:
    id: GO:0046790
    label: virion binding
  evidence_type: IDA
  original_reference_id: PMID:18836083
  qualifier: enables
  review:
    summary: >-
      Proposed addition. The molecular step YajQ itself performs is binding a
      structural component of the phage particle: it binds P1, the major
      structural protein of the phi6 core, which is how an indirect effect on
      the encapsidated polymerase is produced. GO:0046790 is defined as binding
      to a virion, either by binding to components of the capsid or the viral
      envelope, which is this interaction. The follow-up study makes the
      particle association visible in the cell: GFP-YajQ becomes punctate on
      infection by YajQ-dependent phage and the host protein stays with the
      infecting particles throughout infection.
    action: NEW
    reason: >-
      Added because the review's two process rows both rest on a binding event
      that no row records, and because this gene carries no molecular-function
      term beyond family-level nucleotide binding. The participation test is met
      on the right side: YajQ is the entity that does the binding, so this is
      its own activity rather than an effect attributed to it, which is exactly
      the distinction the GO:0039696 row failed. GO:0046790 is also the
      informative alternative to bare GO:0005515 protein binding, which this
      gene does not carry and should not acquire. Deliberately not proposed as a
      core function: binding a bacteriophage capsid protein is the phage
      exploiting a host surface, not a function YajQ evolved to perform, and the
      core-function block records only the conserved cellular property.
    supported_by:
    - reference_id: PMID:18836083
      supporting_text: >-
        YajQ acts indirectly on the polymerase by binding to P1, the major
        structural protein of the core.
      reference_section_type: ABSTRACT
    - reference_id: PMID:18836083
      supporting_text: >-
        The RNA is located inside a core particle composed of multiple copies of
        a major structural protein, an RNA-dependent RNA polymerase, a hexameric
        NTPase, and an auxiliary protein.
      reference_section_type: ABSTRACT
    - reference_id: PMID:20164238
      supporting_text: >-
        It appears that the host protein binds to the infecting particles and
        remains with them during the entire infection period.
      reference_section_type: ABSTRACT
    - reference_id: PMID:20164238
      supporting_text: >-
        Punctate fluorescence develops when cells are infected with
        YajQ-dependent viruses.
      reference_section_type: ABSTRACT
    additional_reference_ids:
    - PMID:20164238
