- gap_statement: Whether any of the beta subunit reaches the cell surface and acts in adhesion or heme binding is unresolved.
  boundary: 'Established: the ap51-1 sequence is identical to this protein over its whole length; adhesin studies report AP51
    on the surface of parasites grown in high iron and binding to host cells and to heme; an antibody study finds the beta
    subunit only in the hydrogenosome matrix, and a trafficking study finds it imported only into hydrogenosomes. Not established:
