knowledge_gaps:
- gap_statement: The nucleotide used by the enzyme that contains this beta subunit is unknown, and neither the ADP-dependent
    nor the GDP-dependent activity of the hydrogenosome is assigned to one of the three beta genes.
  boundary: 'Established: T. vaginalis hydrogenosomes have ADP-dependent and GDP-dependent succinate thiokinase activity and
    a ''large'' enzyme; pyruvate fermentation by isolated hydrogenosomes depends on ADP; three beta and three alpha genes
    exist; all three beta subunits have Gly at position 20 of the mature chain (Gly29 of this precursor), a residue found
    in no assayed enzyme of the family. Not established: whether one enzyme uses both nucleotides or different subunit pairs
    use different ones; kinetic constants for any defined alpha/beta pair; the subunit number of the native enzyme.'
  gap_kind:
