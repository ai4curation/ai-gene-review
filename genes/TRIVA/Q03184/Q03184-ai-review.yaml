  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: The molecular function and complex terms of this gene are held at ADP-forming and at the nucleotide-neutral
    complex only because the organelle assay cannot be assigned to a gene.
  resolution: Express each beta subunit with each alpha subunit, measure kinetics with ATP/ADP and GTP/GDP, and determine
