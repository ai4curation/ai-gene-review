core_functions:
- description: Beta subunit of the succinyl-CoA synthetase of the Trichomonas vaginalis hydrogenosome. With an alpha subunit
    it converts succinyl-CoA, ADP and phosphate to succinate, CoA and ATP in the hydrogenosome lumen, returning the succinate
    consumed by acetate:succinate CoA-transferase and conserving the energy of acetyl-CoA as ATP. The subunit carries the
    nucleotide site. The activity is established for the organelle enzyme and has not been assayed for the product of this
    gene; GDP-dependent activity of the same organelle is not assigned to a gene.
