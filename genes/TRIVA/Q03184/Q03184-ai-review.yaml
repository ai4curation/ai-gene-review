    summary: TreeGrafter IEA; the term comes from the PAINT placement at the family root. Succinyl-CoA synthetase is an alpha/beta
      enzyme, and T. vaginalis hydrogenosomes contain both subunits, each encoded by three genes.
    action: ACCEPT
    reason: The nucleotide-neutral complex term is as precise as the evidence allows for this gene. The organelle has both
      ADP-dependent and GDP-dependent activity, neither assigned to a beta gene, so neither child term (GO:0009361 ADP-forming,
      GO:0045244 GDP-forming) is supported by this row or by anything measured on this protein, and the row is not modified.
      This differs from the reviews of yeast LSC2, human SUCLA2 and E. coli SucC, where the gene also carries a nucleotide-specific
      complex term. The complex is inferred from the family and from the presence of both subunits in the hydrogenosome matrix;
      co-purification of this beta subunit with an alpha subunit was not found in the abstracts read. The native enzyme is
      described as 'large', unlike the dimeric enzymes of other eukaryotes, so the heterodimer statement of the UniProt rule may not give its true subunit number. GO:0042709 is classified under GO:0045239 tricarboxylic acid cycle heteromeric enzyme complex (ancestors checked in QuickGO); the term is accepted for the composition of the complex, not for that classification, which does not hold in the hydrogenosome. The review of the alpha subunit ALPHA-SCS1 accepts the child GO:0009361, the row that entry carries, on the ADP-dependent activity of the organelle; here the parent is kept because the row on this entry is the parent and no assay assigns a nucleotide to this beta subunit.
