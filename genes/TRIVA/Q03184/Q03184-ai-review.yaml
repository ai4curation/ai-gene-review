    summary: IEA combining InterPro IPR005809, the UniRule, UniPathway UPA00223 and a TreeGrafter graft; the PAINT origin
      of the term is the family root PTN000212531. The enzyme is in the hydrogenosome of an organism without mitochondria,
      and hydrogenosomes have no tricarboxylic acid cycle. There the enzyme works with acetate:succinate CoA-transferase in
      acetate formation.
    action: REMOVE
    reason: 'An electronic inference that the biology of the organism contradicts. GO:0006099 is the cycle that oxidises the
      acetyl group of acetyl-CoA. The hydrogenosome proteome paper, read in full, states that hydrogenosomes lack the cycle
      (the authors print ''trichloroacetic acid (TCA) cycle'', an evident slip for tricarboxylic), and the organelle makes
      ATP by substrate-level phosphorylation only. Isolated hydrogenosomes ferment pyruvate to acetate, malate, H2 and CO2;
      the acetate comes from a succinate-dependent CoA transferase, and succinyl-CoA synthetase returns the succinyl-CoA to
      succinate with formation of ATP. Node placement: the root placement of the term is sound for the mitochondrial and bacterial
      members, and the Trichomonas clade PTN008982090 is a branch that lost the pathway; the family review proposes pruning
      it there. It is not MODIFY: the claim itself does not hold, and GO has no term for the transferase and synthetase cycle.
      GO:0006104 succinyl-CoA metabolic process, accepted in this review, records what the enzyme does without asserting the
      cycle. All four sources are electronic and no experimental row is overruled. The statement that the cycle is absent
      is about the organelle and is background in the paper that makes it; the defects below therefore ask for a check.'
