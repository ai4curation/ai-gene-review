id: Q03184
gene_symbol: Q03184
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:5722
  label: Trichomonas vaginalis
description: Beta subunit of the succinyl-CoA synthetase (succinate--CoA ligase) of the hydrogenosome of Trichomonas vaginalis,
  an anaerobic parasitic protist that has no mitochondria. The protein is made in the cytosol with a nine-residue N-terminal
  presequence that is removed, and the mature protein is a soluble component of the hydrogenosome matrix. With an alpha subunit
  it forms an enzyme that converts succinyl-CoA, ADP and phosphate to succinate, CoA and ATP; the beta subunit carries the
  nucleotide-binding ATP-grasp domain. Hydrogenosomes have no tricarboxylic acid cycle and no oxidative phosphorylation. There
  the enzyme works with acetate:succinate CoA-transferase, which forms acetate and succinyl-CoA from acetyl-CoA and succinate
  during the fermentation of pyruvate; succinyl-CoA synthetase regenerates the succinate and conserves the energy as ATP by
  substrate-level phosphorylation. Hydrogenosomes of this organism have both ADP-dependent and GDP-dependent succinyl-CoA
  synthetase activity, and the native enzyme is larger than the dimeric enzymes of other eukaryotes; neither property has
  been assigned to a particular subunit gene. The beta subunit is encoded by three closely related genes, of which this is
  one (locus TVAG_259190 in the genome strain), and no activity has been measured for the product of a single gene. The same
  protein has been described as a surface adhesin, AP51; later localisation studies found it only in hydrogenosomes.
