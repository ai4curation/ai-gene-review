suggested_questions:
- question: The usage comment of GO:0005739 directs hydrogenosomal proteins to GO:0042566, yet PAINT (PTN000212530), TreeGrafter
    and HAMAP rule MF_03219 give mitochondrion to Trichomonas succinyl-CoA synthetase subunits. Can these pipelines
    apply a taxon restriction for Parabasalia?
- question: The definitions of GO:0042709, GO:0009361 and GO:0045244 (succinate-CoA ligase complexes) say that the complex functions in the TCA cycle. Hydrogenosomal enzymes do not. Should that clause be removed from the definitions, and should the is_a link from GO:0042709 (and so from its children GO:0009361 and GO:0045244) to GO:0045239 tricarboxylic acid cycle heteromeric enzyme complex be removed with it?
- question: Is there a place in GO for the cycle of acetate:succinate CoA-transferase and succinyl-CoA synthetase that forms
    acetate and ATP in hydrogenosomes and anaerobic mitochondria? No term for it, or for substrate-level phosphorylation,
    was found. The definition of GO:0019654 pyruvate fermentation to acetate describes the breakdown of acetate; is that definition
    as intended?
- question: The UniProt entry A2EBX0 (TVAG_259190) is the same gene as Q03184 with one residue different, and is named mitochondrial
    by HAMAP rule MF_03219. Should the rule exclude Parabasalia from its mitochondrial name, location and TCA cycle statements?
- question: The UniProt entry Q6LC42 (ap51-1) is a fragment identical to residues 5-407 of Q03184. Should the two entries
    be merged, and should the AP51 name be recorded on Q03184 as a synonym with a note that the adhesin role is disputed?
- question: A PAINT loss annotation for GO:0005739 and GO:0006099 at the Trichomonas clade PTN008982090 is proposed in the
    family review. Would it also stop the TreeGrafter rows on sequences grafted to leaves of that clade, such as Q03184?
suggested_experiments:
- hypothesis: The three beta subunits differ in nucleotide use, or the native enzyme uses both ADP and GDP with one type of
    beta subunit.
  description: Co-express each beta subunit (TVAG_259190, TVAG_144730, TVAG_183500) with each alpha subunit in E. coli without
    the presequences. Measure kcat and Km with ATP/ADP and GTP/GDP in both directions, and the subunit number by light scattering.
    Compare with the enzyme purified from hydrogenosomes.
- hypothesis: Gly at position 20 of the mature subunit (Gly29 of the precursor) permits use of both adenine and guanine nucleotides.
  description: Exchange Gly29 for Pro and for Gln in the recombinant enzyme and repeat the kinetics with both nucleotides.
    Solve a structure of the enzyme with ADP and with GDP.
- hypothesis: Succinyl-CoA synthetase is required for acetate-linked ATP formation in hydrogenosomes, and the three beta genes
    are redundant.
  description: Delete or deplete the beta genes singly and in combination. Measure acetate and ATP formation from pyruvate
    by isolated hydrogenosomes with succinate, ADP and phosphate, and growth of the cells; complement with single genes.
- hypothesis: No beta subunit reaches the cell surface.
  description: Tag each beta gene at its own locus. Test surface exposure by surface biotinylation, flow cytometry of unpermeabilised
    cells and immuno-electron microscopy, in low and high iron and after contact with vaginal epithelial cells.
