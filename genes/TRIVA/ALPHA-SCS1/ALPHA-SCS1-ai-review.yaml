  title: 'Acetate:succinate CoA-transferase in the hydrogenosomes of Trichomonas vaginalis: identification and characterization.'
  full_text_unavailable: true
  findings:
  - statement: The CoA transferase of T. vaginalis hydrogenosomes depends on succinate.
    supporting_text: It was shown that the CoA transferase activity is succinate-dependent.
