- term:
    id: GO:0006104
    label: succinyl-CoA metabolic process
  evidence_type: IC
  original_reference_id: PMID:7808480
  qualifier: involved_in
  review:
    summary: Proposed process term. The enzyme interconverts succinyl-CoA and succinate; in hydrogenosomes the succinyl-CoA
      is made by acetate:succinate CoA-transferase. The only process row on the entry is the tricarboxylic acid cycle, which
      is removed.
    action: NEW
    reason: 'The term names the metabolite and no pathway, which fits an enzyme whose pathway here is not the tricarboxylic
      acid cycle. Which entity does the work: the alpha subunit carries the histidine that is phosphorylated and binds CoA,
      so it performs part of the chemistry of the conversion of succinyl-CoA; it is not a substrate of the process. Comparator
      check, run in QuickGO by term id: the alpha subunits of yeast (LSC1, IDA) and rat (Suclg1, IDA) carry GO:0006104,
      and so does the T. vaginalis beta subunit Q03184 (TreeGrafter IEA); the same query returned the expected rows for
      GO:0006099 on the same proteins, so it can return positives. The term is neither an ancestor nor a descendant of a
      term kept on this gene. The child GO:1901289 succinyl-CoA catabolic process would name the direction in which the
      enzyme is thought to run in the organelle, but no flux through this enzyme has been measured, so the parent is proposed. Yeast LSC1 and human SUCLG1 carry that child as NAS rows from ComplexPortal (PMID:9874242, PMID:32627745), statements about the complex and not assays of direction; they are noted and not followed here.
      It is a curator inference (IC) from the identity of the protein as the alpha subunit of the hydrogenosomal enzyme
      and from the organelle biochemistry; no assay has been made of the product of this gene. No ATP-synthesis or acetate
      term is proposed: no succinyl-CoA synthetase alpha subunit in the comparator set carries one, and the acetate is released
      by the transferase.'
    supported_by:
