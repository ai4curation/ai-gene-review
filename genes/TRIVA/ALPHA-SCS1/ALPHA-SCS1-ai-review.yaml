    on organelle biochemistry and on pathway reasoning, and the reason for keeping three genes is unknown.
  resolution: Knock out the alpha genes singly and together; measure acetate, succinate and ATP formation by isolated hydrogenosomes
    and growth in iron-rich and iron-poor medium; complement with single genes.
