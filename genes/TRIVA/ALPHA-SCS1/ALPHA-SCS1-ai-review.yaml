suggested_questions:
- question: The usage comment of GO:0005739 directs hydrogenosomal proteins to GO:0042566, yet PAINT (PTN000122014), TreeGrafter
    and HAMAP rule MF_03222 give mitochondrion to Trichomonas succinyl-CoA synthetase subunits. Can these pipelines
    apply a taxon restriction for Parabasalia?
- question: A PAINT loss annotation for GO:0005739 and GO:0006099 at the Trichomonas clade PTN008961326 of PTHR11117 is proposed
    in the family review. Would it also stop the TreeGrafter rows on the reviewed entries, which GOA attributes to PTN008961326 (P53399, P53401) and to the leaf node PTN000874238 inside that clade (P53400)?
- question: The definition of GO:0009361 says that the complex is heterodimeric and functions in the TCA cycle. The hydrogenosomal
    enzyme does not work in that cycle and is described as a 'large' enzyme. Should those clauses be removed from the definition, and should GO:0009361 and its parent GO:0042709 remain subclasses of GO:0045239 tricarboxylic acid cycle heteromeric enzyme complex, given hydrogenosomal and other non-cycle members?
- question: Is there a place in GO for the cycle of acetate:succinate CoA-transferase and succinyl-CoA synthetase that forms
    acetate and ATP in hydrogenosomes and anaerobic mitochondria? No term for it, or for substrate-level phosphorylation,
    was found. The definition of GO:0019654 pyruvate fermentation to acetate describes the breakdown of acetate; is that definition
    as intended?
- question: The UniProt names of P53399, P53400 and P53401 end in 'mitochondrial' and their function text places the enzyme
    in the citric acid cycle, both from HAMAP rule MF_03222. Should the rule exclude Parabasalia from these statements?
- question: The UniProt entries P53399, P53400, P53401, O15568, O15569, Q65ZG5 and A2DUL5 all carry the cross-reference TrichDB:TVAG_047890.
    By sequence that locus is ALPHA-SCS2 (P53400 is identical to A0A8U0WP19, TVAG_047890), while P53399 differs at one residue
    from A0A8U0WPT0 (TVAG_318670) and P53401 is identical to A2DUL5 (TVAG_165340). Is the single cross-reference intended
    as a similarity mapping for entries from another strain, or should each entry point at its own locus?
- question: The UniProt entries O15568 (ap33-1), Q65ZG5 (ap33-2) and O15569 (ap33-3) are the same genes as P53399, P53400
    and P53401. Should they be merged, and should the AP33 name be recorded as a synonym with a note that the adhesin role
    is disputed?
suggested_experiments:
- hypothesis: The three alpha subunits are interchangeable, and nucleotide use is set by the beta subunit they pair with.
  description: Co-express each alpha subunit (ALPHA-SCS1, ALPHA-SCS2, ALPHA-SCS3) with each beta subunit in E. coli without
    the presequences. Measure kcat and Km with ATP/ADP and GTP/GDP in both directions, and the subunit number by light scattering
    or native mass spectrometry. Compare with the enzyme purified from hydrogenosomes.
- hypothesis: Each alpha subunit has a preferred beta partner in the cell.
  description: Tag each alpha gene at its own locus, purify the tagged protein from hydrogenosomes and identify the co-purifying
    beta subunits with paralog-specific peptides by mass spectrometry. Measure the abundance of the three alpha proteins in
    iron-rich and iron-poor cells in the same way.
- hypothesis: Succinyl-CoA synthetase is required for acetate-linked ATP formation in hydrogenosomes, and the three alpha
    genes are redundant.
  description: Delete the alpha genes singly and in combination. Measure acetate and ATP formation from pyruvate by isolated
    hydrogenosomes with succinate, ADP and phosphate, and growth of the cells in iron-rich and iron-poor medium; complement
    with single genes.
- hypothesis: No alpha subunit reaches the cell surface.
  description: Tag each alpha gene at its own locus. Test surface exposure by surface biotinylation, flow cytometry of unpermeabilised
    cells and immuno-electron microscopy, in low and high iron and after contact with vaginal epithelial cells, in more than
    one strain and with a control for lysis of hydrogenosomes.
