id: P53399
gene_symbol: ALPHA-SCS1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:5722
  label: Trichomonas vaginalis
description: One of three closely related alpha subunits of the succinyl-CoA synthetase (succinate--CoA ligase) of the hydrogenosome
  of Trichomonas vaginalis, an anaerobic parasitic protist that has no mitochondria. The protein is made in the cytosol with
  a nine-residue N-terminal presequence that is removed, and the mature protein is a soluble component of the hydrogenosome
  matrix. With a beta subunit it forms an enzyme that converts succinyl-CoA, ADP and phosphate to succinate, CoA and ATP; the
  alpha subunit binds CoA and phosphate and carries the histidine that is phosphorylated during the reaction (His262 of the
  precursor). Hydrogenosomes have no tricarboxylic acid cycle and no oxidative phosphorylation. There the enzyme works with
  acetate:succinate CoA-transferase, which forms acetate and succinyl-CoA from acetyl-CoA and succinate during the fermentation
  of pyruvate; succinyl-CoA synthetase regenerates the succinate and conserves the energy as ATP by substrate-level phosphorylation.
  Hydrogenosomes of this organism have both ADP-dependent and GDP-dependent succinyl-CoA synthetase activity, and the native
  enzyme is larger than the dimeric enzymes of other eukaryotes; neither property has been assigned to a particular pair of
  subunit genes, and no activity has been measured for the product of a single alpha gene. The two paralogs, ALPHA-SCS2 and
  ALPHA-SCS3, differ from this protein at 14 and 8 of 309 residues. The same three proteins have been described as a surface
  adhesin, AP33; later localisation studies found the alpha subunit only in hydrogenosomes.
