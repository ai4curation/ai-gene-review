  review:
    summary: EXP from Lahti et al. 1994 (abstract read). The alpha-SCS proteins were isolated from purified T. vaginalis hydrogenosomes
      with an antibody, partition into the soluble fraction of carbonate-treated hydrogenosomes, and lack the first nine
      residues encoded by the genes.
    action: ACCEPT
    reason: 'Core location. Three lines agree on the lumen: the protein is soluble on carbonate extraction of hydrogenosomes,
      which the authors read as a matrix location; it is made with a nine-residue presequence that is absent from the protein
      purified from the organelle; and a monoclonal antibody against the alpha subunit labels the hydrogenosome matrix by
      immunogold, with no label elsewhere. A trafficking study finds tagged alpha subunit imported only into hydrogenosomes.
      Caveats: the paper was read as an abstract only, and the abstract states the result directly. The antibody isolated
      ''alpha-SCS proteins'' as a group, so the fractionation is evidence for the three paralogs together; the curator attributed
      it to each of the three entries, and UniProt assigns the protein sequence of residues 10-25 to this entry. The later
      studies do not say which alpha gene was detected. The hydrogenosome is not one of the five root organelles of the
      organelle policy; the lumen is its deepest compartment term, so no further row is needed.'
