core_functions:
- description: Alpha subunit of the succinyl-CoA synthetase of the Trichomonas vaginalis hydrogenosome. With a beta subunit
    it converts succinyl-CoA, ADP and phosphate to succinate, CoA and ATP in the hydrogenosome lumen, returning the succinate
    consumed by acetate:succinate CoA-transferase and conserving the energy of acetyl-CoA as ATP. The subunit binds CoA and
    phosphate and carries the phosphohistidine intermediate. The activity is established for the organelle enzyme and has
    not been assayed for the product of this gene; GDP-dependent activity of the same organelle is not assigned to a gene.
