  - statement: The three AP33 genes are the alpha-SCS genes.
    supporting_text: A database search revealed that AP33 had significant identity to the succinyl-CoA synthetase alpha-subunit
      of several different organisms and virtually 100% identity to the reported T. vaginalis subunit.
  - statement: Recombinant AP33 proteins were reported to bind host cells.
    supporting_text: Unlike commercially purchased enzyme, the recombinant proteins retained adhesive properties equal to
      the natural T. vaginalis AP33.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:10669133
      - PMID:31077495
      review_notes: Binding of a recombinant protein to host cells in vitro may stand as an observation. The inference that
        the protein is a surface adhesin of the parasite is contested by two laboratories that found the alpha subunit only
        in hydrogenosomes. All three papers were read as abstracts only.
      supported_by:
      - reference_id: PMID:10669133
        supporting_text: There was no labeling on the cell surface or in any other cell compartment.
      - reference_id: PMID:31077495
        supporting_text: Neither α- nor β-SCS is biotinylated in the endoplasmic reticulum and delivered to the cell surface
          via the secretory pathway.
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Abstract only. The identification of AP33 with alpha-SCS is confirmed by the UniProt sequences (ap33-1,
      O15568, differs from P53399 at one residue). The adhesin role is contested by PMID:10669133 and PMID:31077495.
- id: PMID:9846736
  title: Characterization of Trichomonas vaginalis AP33 adhesin and cell surface interactive domains.
  full_text_unavailable: true
  findings:
  - statement: Two regions of AP33 were reported to bind host cell surfaces.
    supporting_text: 'two domains interactive with host cell surfaces were identified at distinct parts of AP33: one in the
      N-terminal half of the protein, and the other within 24 residues in the C-terminal third'
  reference_review:
    relevance: LOW
    correctness: DISPUTED
    review_notes: Abstract only. Binding assays with recombinant fragments; the surface location that the adhesin model needs
      is contested by PMID:10669133 and PMID:31077495.
- id: PMID:17608941
  title: Antisense RNA decreases AP33 gene expression and cytoadherence by T. vaginalis.
  findings:
  - statement: Antisense RNA lowered the transcripts of all three ap33 (alpha-SCS) genes.
    supporting_text: decreases the amounts of endogenous transcripts of all three ap33 genes
  - statement: Adherence of the antisense transfectants was about 30% lower.
    supporting_text: the level of adherence by AS trichomonads was measured and found to be ~30% lower than wt and S-transfected
      parasites
  - statement: Lower amounts of the protein did not change growth.
    supporting_text: decreased amounts of AP33 (α-SCS) did not affect overall trichomonal growth and multiplication
  reference_review:
    relevance: MEDIUM
    correctness: DISPUTED
    review_notes: Full text in the cache. The only genetic perturbation of the alpha-SCS genes found. It is not paralog-specific
      and is partial, and the paper reports no measurement of succinyl-CoA synthetase activity or of hydrogenosomal metabolism.
      The sense primer in the Methods encodes Met-Leu-Ala-Gly-Asp-Phe, the N-terminus of P53399 and ap33-1 and not of the
      paralogs (a reading of the primer; the paper does not name the gene copy). The interpretation of the adherence result
      as a surface adhesin role is contested by PMID:10669133 and PMID:31077495.
