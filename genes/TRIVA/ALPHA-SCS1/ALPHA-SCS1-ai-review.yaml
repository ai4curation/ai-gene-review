      PTN000122012. T. vaginalis hydrogenosomes have GDP-dependent as well as ADP-dependent succinate thiokinase activity.
      The activity is not assigned to any alpha or beta gene.
    action: KEEP_AS_NON_CORE
    reason: 'Kept, and not made a core function. Node placement: the root placement of this term is sound where a GDP-using
      enzyme exists, and the family review judges it plausible for the Trichomonas clade. For: the alpha subunit does not
      choose the nucleotide, the three alpha proteins are nearly identical, and the organelle has GDP-dependent activity by
      assay, so there is positive evidence in this organism, unlike in yeast. Against a stronger action: the assay is of
      hydrogenosomal fractions and is not assigned to a subunit pair; the abstract reports a ''large'' enzyme and does not
      say outright that one enzyme uses both nucleotides; the three beta subunits have Gly at the position that distinguishes
      ATP-specific from GTP-specific enzymes elsewhere, which predicts neither; only the abstract was read. It is non-core
      because pyruvate fermentation by isolated hydrogenosomes is shown with ADP, and no role is known for GTP formation
      there. The term is as specific as a molecular function term can be, so it is neither MODIFY nor TOO_GENERAL. Which
