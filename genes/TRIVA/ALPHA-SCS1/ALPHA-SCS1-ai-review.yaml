  review:
    summary: IEA combining the PANTHER node PTN008961326, the UniRule (HAMAP MF_03222) and UniPathway UPA00223; the PAINT origin
      of the term is the family root PTN000122012. The enzyme is in the hydrogenosome of an organism without mitochondria,
      and hydrogenosomes have no tricarboxylic acid cycle. There the enzyme works with acetate:succinate CoA-transferase in
      acetate formation.
    action: REMOVE
    reason: 'An electronic inference that the biology of the organism contradicts. GO:0006099 is the cycle that oxidises the
      acetyl group of acetyl-CoA. The hydrogenosome proteome paper, read in full, states that hydrogenosomes lack the cycle
      (the authors print ''trichloroacetic acid (TCA) cycle'', an evident slip for tricarboxylic), and the organelle makes
      ATP by substrate-level phosphorylation only. Isolated hydrogenosomes ferment pyruvate to acetate, malate, H2 and CO2;
      the acetate comes from a succinate-dependent CoA transferase, and succinyl-CoA synthetase returns the succinyl-CoA to
      succinate with formation of ATP. Node placement: the root placement of the term is sound for the mitochondrial and bacterial
      members, and the Trichomonas clade PTN008961326 is a branch without the pathway; the family review requests a loss (IRD) there. It is not MODIFY: the claim itself does not hold, GO has no term for the transferase and synthetase
      cycle, and nothing in the evidence of this row supports another process. GO:0006104 succinyl-CoA metabolic process is
      proposed as a new row in this review and records what the enzyme does without asserting the cycle. All three sources
      are electronic and no experimental row is overruled. The statement that the cycle is absent is about the organelle
      and is background in the paper that makes it; the defects below therefore ask for a check.'
