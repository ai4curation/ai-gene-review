- term:
    id: GO:0009361
    label: succinate-CoA ligase complex (ADP-forming)
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN008961326
  review:
    summary: TreeGrafter IEA from the PANTHER node PTN008961326; the term comes from the PAINT placement at the family root
      PTN000122012. Succinyl-CoA synthetase is an alpha/beta enzyme, and T. vaginalis hydrogenosomes contain both subunits,
      each encoded by three genes.
    action: ACCEPT
    reason: 'The alpha subunit acts only together with a beta subunit, and the ADP-forming complex goes with the ADP-forming
      activity accepted above. Node placement: the root placement holds for the Trichomonas clade, since the subunit architecture
      of the enzyme is conserved and both subunits are soluble proteins of the hydrogenosome matrix. Limits: the complex
      is inferred from the family and from the presence of both subunits in the same compartment; co-purification of this
      alpha subunit with a beta subunit was not found in the abstracts read, and which of the three beta subunits it pairs
      with is unknown. The native enzyme is described as ''large'', unlike the dimeric enzymes of other eukaryotes, so the
      heterodimer statement of the UniProt rule and of the GO definition may not give its true subunit number. The definition
      of the term also says that the complex functions in the TCA cycle, which is not so here; that is raised as a question and is not a reason to drop the term. The term is also is_a GO:0045239 tricarboxylic acid cycle heteromeric enzyme complex (ancestors checked in QuickGO), so accepting it carries that classification for an enzyme that does not work in the cycle here; this is an ontology question and is raised below. The review of the beta subunit Q03184 accepts the parent GO:0042709, the term
      that entry carries; the two rows are consistent.'
