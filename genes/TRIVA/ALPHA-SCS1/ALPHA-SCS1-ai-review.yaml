knowledge_gaps:
- gap_statement: No activity has been measured for the product of this gene, and it is unknown which of the three beta subunits
    it pairs with, which nucleotide the resulting enzyme uses, and how many subunits the native enzyme has.
  boundary: 'Established: T. vaginalis hydrogenosomes have ADP-dependent and GDP-dependent succinate thiokinase activity and
    a ''large'' enzyme; pyruvate fermentation by isolated hydrogenosomes depends on ADP; three alpha and three beta genes
    exist; the three alpha proteins keep the phosphohistidine residue; all three beta subunits have Gly at position 20 of
    the mature chain, a residue found in no assayed enzyme of the family. Not established: kinetic constants for any defined
    alpha/beta pair; whether one enzyme uses both nucleotides or different pairs use different ones; the subunit number
    of the native enzyme; any interaction between named subunits.'
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: The activity and complex terms of this gene rest on an organelle assay that cannot be assigned to a gene,
    and the GDP-forming activity is kept as non-core for the same reason.
  resolution: Express each alpha subunit with each beta subunit, measure kinetics with ATP/ADP and GTP/GDP, and determine
    the subunit number of the recombinant and native enzymes.
  provenance:
  - reference_id: PMID:1898409
    supporting_text: Succinate thiokinase activities, both ADP- and GDP-dependent, were shown to be hydrogenosomal in Tritrichomonas
      foetus and Trichomonas vaginalis.
  - reference_id: PMID:1898409
    supporting_text: the 'small' enzyme was found in T. foetus whereas T. vaginalis contained a 'large' enzyme
  - reference_id: PMID:7808480
    supporting_text: The alpha-SCS of T. vaginalis is encoded by a multigene family composed of 3 similar genes that do not
      appear allelic.
  - reference_id: file:yeast/LSC2/LSC2-bioinformatics/RESULTS.md
