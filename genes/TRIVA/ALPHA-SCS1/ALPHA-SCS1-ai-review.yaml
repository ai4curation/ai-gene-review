- gap_statement: Whether the three alpha subunits differ in function is unknown, and so is the contribution of this gene to
    ATP formation and growth.
  boundary: 'Established: the three proteins differ at 8 to 14 of 309 residues, four of them in the nine-residue presequence (positions 3, 4, 5 and 7) and one at position 12 of the precursor;
    in the hydrogenosome proteome the locus that corresponds to this gene (TVAG_318670) is more abundant and the ALPHA-SCS2
    locus (TVAG_047890) less abundant under iron deficiency; antisense RNA that lowers the transcripts of all three genes
    does not change growth. Not established: the phenotype of loss of this gene alone or of all three; the flux through
    the enzyme in the cell; whether the paralogs are redundant or pair with different beta subunits.'
  gap_kind:
