  review:
    summary: The two established redox reactions provide more informative functions than generic oxidoreductase
      activity.
    action: MODIFY
    reason: This broad activity is true, and both supported molecular functions are oxidoreductase descendants.
      Refine it to proline dehydrogenase and NAD+-dependent glutamate-semialdehyde dehydrogenase, both
      already present in this review. Neither a non-core classification nor removal is appropriate for
      this correct but broad molecular function.
    proposed_replacement_terms:
    - id: GO:0004657
      label: proline dehydrogenase activity
    - id: GO:0003842
      label: L-glutamate gamma-semialdehyde dehydrogenase (NAD+) activity
    supported_by:
