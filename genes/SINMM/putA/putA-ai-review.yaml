suggested_questions:
- question: Which native quinone species and membrane-association conditions support PutA turnover in
    this strain?
- question: What is the physiological oligomer distribution, and does oligomerization alter flux or channeling
    in vivo?
suggested_experiments:
- description: Measure native membrane association and proline-dependent quinone reduction, distinguishing
    purified-protein chemistry from whole-cell flux.
  experiment_type: biochemical localization and redox assays
