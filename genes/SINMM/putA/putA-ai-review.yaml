- term:
    id: GO:0006562
    label: L-proline catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR025703
  review:
    summary: PutA itself catalyzes both oxidative steps of proline breakdown to glutamate.
    action: ACCEPT
    reason: 'The enzyme performs the two catalytic steps, rather than merely being required for growth
      or supplying a substrate to another protein. Direct recombinant-enzyme turnover and the coupled
      reaction support proline catabolism. The accession is sequence-matched to the structure construct;
      this process assignment does not imply measured native growth on proline, a transport mechanism,
      or repression of a put regulon. '
    supported_by:
    - reference_id: PMID:27679491
      supporting_text: The time dependence of NADH production was monitored in an assay containing proline,
        an electron acceptor for the flavin (ubiquinone-1, CoQ 1 ), and NAD + .
- term:
    id: GO:0009898
    label: cytoplasmic side of plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN001709052
  - UniRule:UR000172770
  review:
    summary: The quinone-coupled enzyme is inferred to act at the cytoplasmic face of the bacterial plasma
      membrane.
    action: ACCEPT
    reason: 'The conserved peripheral-membrane PutA mechanism couples cytoplasmic proline oxidation to
      membrane quinones. The soluble catalytic architecture and quinone reaction support the active membrane
      face as a mechanistic inference, consistent with the existing source assertion. The crystal structure
      and soluble biochemical assays are not direct native localization measurements; constitutive membrane
      residence, transmembrane transport, and the E. coli RHH-dependent regulatory switch are not inferred. '
    supported_by:
    - reference_id: PMID:28712849
      supporting_text: Bifunctional PutAs must interact with the membrane to couple electron transfer
        from proline to quinone electron acceptors in the membrane, thus completing the proline:ubiquinone
        oxidoreductase catalytic cycle.
    - reference_id: PMID:27679491
      supporting_text: The time dependence of NADH production was monitored in an assay containing proline,
        an electron acceptor for the flavin (ubiquinone-1, CoQ 1 ), and NAD + .
