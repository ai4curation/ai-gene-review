id: F7X6I3
gene_symbol: putA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:707241
  label: Sinorhizobium meliloti SM11
description: PutA of Sinorhizobium meliloti SM11 is a 1233-residue type B bifunctional enzyme that oxidizes
  proline to glutamate. The FAD-dependent proline dehydrogenase module uses a quinone electron acceptor,
  and the glutamate-semialdehyde dehydrogenase module uses NAD+. A tunnel connects the catalytic sites
  and supports substrate channeling. The C-terminal ALDH-superfamily domain helps enclose this tunnel;
  its additional Rossmann fold does not bind NAD+. Purified recombinant SmPutA exhibits a concentration-dependent
  monomer-dimer equilibrium. It lacks the additional RHH regulatory domain of type C PutAs.
