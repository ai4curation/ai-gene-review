  review:
    summary: The FAD-containing PRODH module couples proline oxidation to quinone reduction.
    action: ACCEPT
    reason: GO:0004657 specifies L-proline + quinone to P5C + quinol; FAD is the internal redox cofactor,
      not the net terminal acceptor. The exact-sequence SmPutA experiment explicitly uses CoQ1 as electron
      acceptor, with separate PRODH assays excluding NAD+ and coupled assays including NAD+. This supports
      quinone-dependent chemistry directly; soluble CoQ1 does not identify the dominant native quinone
      species.
    supported_by:
