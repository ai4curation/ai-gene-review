      an electron acceptor for the flavin (ubiquinone-1, CoQ 1 ), and NAD + .
  - reference_id: PMID:28712849
    supporting_text: The PRODH module of PutA contains an FAD cofactor that couples the oxidation of proline
      (reductive half-reaction) to the reduction of ubiquinone in the membrane (oxidative half-reaction)
      [45].
  - reference_id: PMID:28712849
    supporting_text: Bifunctional PutAs must interact with the membrane to couple electron transfer from
      proline to quinone electron acceptors in the membrane, thus completing the proline:ubiquinone oxidoreductase
      catalytic cycle.
- description: NAD+-dependent oxidation of L-glutamate 5-semialdehyde to L-glutamate, following hydrolysis
    of the P5C intermediate preferentially channeled from the PRODH site. The NAD+-binding catalytic module
    is distinct from noncatalytic structural domains.
