  label: Bacillus phage phi29
description: Head-tail connector (portal) protein gp10 that self-assembles into a ring-shaped homododecamer at the unique five-fold vertex of the prolate procapsid and mature virion capsid. During morphogenesis, the gp10 portal complex nucleates prolate capsid assembly with gp7 and gp8, recruits the prohead packaging RNA (pRNA) ring via its basic N-terminal 14 amino acids, and operates as a one-way valve channel for ATP-driven viral dsDNA packaging before docking with the gp11 lower collar to form the genome ejection conduit.
