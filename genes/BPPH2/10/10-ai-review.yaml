  review:
    summary: gp10 directly binds the prohead packaging RNA (pRNA) via its N-terminal 14 amino acids to assemble the active DNA packaging motor.
    action: ACCEPT
    reason: Photoaffinity cross-linking and proteolytic cleavage in PMID:15886394 demonstrate that the N-terminal 14 residues of gp10 directly bind pRNA on the procapsid.
    supported_by:
    - reference_id: PMID:15886394
      supporting_text: Specific binding of pRNA to the connector in the procapsid was found by photoaffinity crosslinking. Removal of the N-terminal 14 amino acids of the gp10 protein by proteolytic cleavage resulted in undetectable binding of pRNA to either the connector or the procapsid, as investigated by agarose gel electrophoresis, SDS-PAGE, sucrose gradient sedimentation and N-terminal peptide sequencing.
