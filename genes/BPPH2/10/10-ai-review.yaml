- id: GO_REF:0000043
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot keyword mapping
  findings: []
- id: PMID:10801350
  title: Topology of the components of the DNA packaging machinery in the phage phi29 prohead.
  findings:
  - statement: Epitope mapping and immunoelectron microscopy show that the N-terminal, C-terminal, and RNA-binding domains of the dodecameric gp10 connector are exposed on the prohead, whereas the 12 wide-end appendages are buried inside the prohead.
    supporting_text: The charged amino-terminal, the carboxyl-terminal, and the RNA binding domain are accessible areas in the connector assembled into the prohead, while the domains corresponding to the 12 large appendages of the connector are buried inside the prohead.
- id: PMID:15886394
  title: Binding of pRNA to the N-terminal 14 amino acids of connector protein of bacteriophage phi29.
  findings:
  - statement: Photoaffinity cross-linking and proteolytic cleavage demonstrate that the N-terminal 14 amino acids of gp10 are essential for specific binding of prohead RNA (pRNA) to the connector and procapsid.
    supporting_text: Specific binding of pRNA to the connector in the procapsid was found by photoaffinity crosslinking. Removal of the N-terminal 14 amino acids of the gp10 protein by proteolytic cleavage resulted in undetectable binding of pRNA to either the connector or the procapsid, as investigated by agarose gel electrophoresis, SDS-PAGE, sucrose gradient sedimentation and N-terminal peptide sequencing.
- id: PMID:22225806
  title: Role of channel lysines and the "push through a one-way valve" mechanism of the viral DNA packaging motor.
  findings:
  - statement: The gp10 connector forms a 3.6-nm central channel with internal lysine rings and flexible loops that act as a one-way valve to prevent DNA reversal during packaging.
    supporting_text: The central hub of the bacteriophage φ29 DNA-packaging motor contains a 3.6-nm channel for dsDNA to enter during packaging and to exit during infection.
- id: file:BPPH2/10/10-uniprot.txt
  title: UniProtKB entry for 10 (P04332)
  findings:
  - statement: gp10 multimerizes into a ring-shaped homododecamer at the unique portal vertex of the capsid and functions in head assembly, pRNA binding, genome packaging, neck/tail attachment, and genome ejection.
    supporting_text: '-!- FUNCTION: Forms the portal vertex of the capsid (PubMed:10801350, PubMed:19744688, PubMed:21570409). This portal plays critical roles in head assembly, genome packaging, neck/tail attachment, and genome ejection (By similarity). The portal protein multimerizes as a single ring-shaped homododecamer arranged around a central channel (PubMed:11812138, PubMed:21570409).'
suggested_questions:
- question: How does completion of headful DNA packaging trigger the conformational transition in the narrow end of the gp10 dodecamer that releases the pRNA-gp16 motor ring and exposes the binding interface for the gp11 lower collar?
  experts:
  - Peixuan Guo
  - Shelley Grimes
  - José L. Carrascosa
suggested_experiments:
- description: Determine high-resolution cryo-EM structures of the gp10 portal vertex immediately before and after termination of unit-length DNA-gp3 packaging in the absence and presence of gp11.
  hypothesis: Interaction of the terminal protein gp3 or internal DNA pressure with the C-terminal crown domain of gp10 induces an allosteric shift at the narrow end of the connector that lowers affinity for the pRNA ring and promotes gp11 collar docking.
  experiment_type: Cryo-electron microscopy (cryo-EM)
