- term:
    id: GO:0070063
    label: RNA polymerase binding
  evidence_type: IPI
  original_reference_id: PMID:8799127
  qualifier: enables
  review:
    summary: >-
      Proposed row for the protein-protein contact that is the mechanism of both p4
      activities. p4 binds the C-terminal domain of the alpha subunit of Bacillus subtilis
      RNA polymerase; the contact was mapped with a reconstituted polymerase lacking the
      last 15 residues of alpha-CTD and with purified alpha subunit in isolation, and on
      the p4 side it maps to Arg120.
    action: NEW
    reason: >-
      Added as a specific, informative binding term rather than bare protein binding: it
      names the partner, and the partner identity is the whole point, since contacting the
      host polymerase from a fixed upstream site is how a 125-residue phage protein
      reprogrammes a bacterial transcription machine. The evidence is direct and
      reciprocal: p4 forms a complex with purified wild-type alpha subunit but not with
      the C-terminal deletion, and p4 R120Q loses the interaction with host RNAP
      altogether while retaining DNA binding. The term is not a parent or child of the
      activator and repressor terms; it records the interaction those activities run
      through. The contact with the nucleoid protein p6, which is equally real, is
      deliberately not proposed as a row, because the informative consequence of that
      interaction is already carried by the regulation rows.
