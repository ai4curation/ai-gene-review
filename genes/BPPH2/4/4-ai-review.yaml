suggested_questions:
- question: How does the ternary architecture of the p4-p6 hairpin nucleoprotein complex simultaneously occlude RNA polymerase from early promoters A2b and A2c while positioning the alpha-CTD of RNA polymerase for productive open-complex formation at late promoter A3?
suggested_experiments:
- description: Solve the cryo-EM structure of the complete Bacillus subtilis sigma-A RNA polymerase holoenzyme bound to the phi29 A2c-A2b-A3 intergenic promoter fragment in complex with p4 dimers and p6 oligomers.
