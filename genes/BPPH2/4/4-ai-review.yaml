id: P03682
gene_symbol: '4'
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2884424
  label: Bacillus phage phi29
description: >-
  Protein p4 (gp4) is the 125-residue early regulatory protein that operates the
  early-to-late transcriptional switch of Bacillus phage phi29. The phage encodes no
  polymerase and no sigma factor of its own: all of its genes are read by the host
  Bacillus subtilis sigma-A RNA polymerase, and p4 redirects that enzyme. Early genes lie
  at the two ends of the genome and the structural, morphogenesis and lysis genes lie in
  the middle, transcribed from a single late promoter, A3. p4 is a homodimer that binds
  three sites in the 219 bp region separating the early promoters A2b and A2c from A3,
  recognising each site as an inverted repeat of two 6 bp arms through an N-terminal
  beta-turn N-hook that enters the major groove and makes base-specific contacts, aided
  by a helix-turn-helix motif and by a pronounced bend that p4 both reads and deepens. At
  A3, whose own -35 element is too poor to be used, bound p4 stabilises RNA polymerase as
  a closed complex and switches the promoter on; at A2c it binds immediately upstream of
  the polymerase and shuts the promoter off by blocking promoter clearance rather than
  polymerase binding; at A2b it displaces the polymerase. All three effects run through a
  single protein-protein contact, between the basic C-terminal tail of p4 and the
  C-terminal domain of the polymerase alpha subunit, with Arg120 the critical residue, so
  one interaction surface activates at one promoter and represses at another depending on
  where p4 sits relative to the enzyme. p4 does not act alone: it binds cooperatively with
  the abundant nucleoid protein p6 across the whole A2c-to-A3 interval, defining the phase
  and the boundaries of the p6 filament through its C-terminus and building the
  nucleoprotein hairpin that enforces the switch. Because A3 is the only late promoter, p4
  is indirectly required for everything made late in infection, including virion assembly
  and host lysis, but its own activity is transcriptional regulation.
