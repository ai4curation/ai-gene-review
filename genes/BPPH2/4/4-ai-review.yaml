- term:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008771
  review:
    summary: >-
      InterPro2GO row from IPR008771 "Phi-29-like late genes activator", the family that
      is p4 itself. Checked live against the InterPro API: the entry maps to GO:0003899
      and GO:0016987 as well as GO:0006355, and its description still reads that the
      protein "may function as a sigma-like component of the host RNA polymerase". p4 has
      no catalytic activity of any kind.
    action: REMOVE
    reason: >-
      p4 is not a polymerase and has no nucleotidyltransferase chemistry: it is a
      125-residue DNA-binding regulator whose entire mechanism is to bind a target site
      and touch the C-terminal domain of the alpha subunit of the host enzyme, which does
      the transcribing. The transcription it controls is carried out by Bacillus subtilis
      sigma-A RNA polymerase, and UniProt's own curated FUNCTION says p4 stabilises the
      binding of that host polymerase rather than being one. Its crystal structure is a
      unique alpha/beta DNA-binding fold with no polymerase domain. The row is a
      family-level mapping of a superseded sigma-like-subunit reading and is removed
      rather than refined, because nothing on this branch is true of the protein; the
      defect is recorded against InterPro.
    supported_by:
    - reference_id: file:BPPH2/4/4-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Mediates, together with protein p6, the early to late transcriptional switch by stabilizing the binding of host RNA polymerase (RNAP) to the late A3 promoter.
    - reference_id: PMID:21614197
      supporting_text: >-
        Phage Ø29 gene expression is directed by the Bacillus subtilis σA-RNAP
    - reference_id: PMID:8799127
      supporting_text: >-
        Our results indicate that protein p4 represses PA2c by interacting with the C-terminal domain of the alpha subunit of RNA polymerase.
    - reference_id: PMID:16600871
      supporting_text: >-
        The crystal structure of p4 alone and in complex with a 41 bp DNA, including the A3 promoter binding site, helps us to understand how the phage cycle is controlled.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      record: InterPro:IPR008771
      slot: interpro2go
      requested_change: DELETE_VALUE
      asserted_value: GO:0003899
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        IPR008771 is the phi29-like late genes activator family, whose members are small
        DNA-binding transcription regulators of the host RNA polymerase, not polymerase
        subunits and not enzymes. The mapping to GO:0003899 (and to GO:0016987, see the
        sigma factor row) encodes the family description's surviving speculation that the
        protein "may function as a sigma-like component of the host RNA polymerase". The
