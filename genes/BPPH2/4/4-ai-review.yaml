    reason: Unlike genuine phage sigma factors that associate with core RNAP in place of host sigma subunits, phi29 p4 binds specific inverted repeats on viral DNA and recruits the intact Bacillus subtilis sigma-A RNAP holoenzyme via contacts with the RNAP alpha-subunit C-terminal domain (GO:0003700).
