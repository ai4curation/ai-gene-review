      supporting_text: >-
        Phage phi29 regulatory protein p4 activates transcription from the late A3 promoter and represses the main early promoters, named A2b and A2c.
    - reference_id: PMID:8617213
      supporting_text: >-
        Therefore, the contact between protein p4 and RNAP through the protein p4 domain containing Arg120 can activate or repress transcription, depending on the promoter.
