core_functions:
- description: >-
    Sequence-specific activation of the single phi29 late promoter A3. p4 homodimers bind
    an inverted-repeat target site centred some 50 to 100 bp upstream of the A3 start
    site, recognised base-specifically by N-terminal beta-turn N-hooks that enter the
    major groove, and bend the already curved site further. A3 has a poor -35 element and
    is not used by the host sigma-A RNA polymerase on its own; bound p4 contacts the
    C-terminal domain of the polymerase alpha subunit through its basic C-terminal tail,
    with Arg120 essential, and stabilises the enzyme at the promoter as a closed complex.
    This is the step that turns on the entire late programme, since A3 is the only late
    promoter. The nucleoid protein p6, with which p4 binds cooperatively across the whole
    A2c-to-A3 interval, reinforces p4's positioning rather than acting on A3 itself.
