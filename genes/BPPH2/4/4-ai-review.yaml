- term:
    id: GO:0003899
    label: DNA-directed RNA polymerase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR008771
  review:
    summary: Incorrect InterPro2GO mapping; p4 is a 125-amino-acid non-catalytic transcriptional regulator, not an RNA polymerase.
    action: REMOVE
    reason: Phi29 does not encode its own RNA polymerase and relies on the host Bacillus subtilis RNA polymerase throughout infection. Protein p4 is a sequence-specific transcription factor that binds the host RNAP alpha subunit and has no catalytic RNA polymerase activity.
    supported_by:
    - reference_id: file:BPPH2/4/4-uniprot.txt
      supporting_text: 'Mediates, together with protein p6, the early to late transcriptional switch by stabilizing the binding of host RNA polymerase (RNAP) to the late A3 promoter. Activates transcription from the late A3 promoter and represses the main early promoters A2b and A2c by modifying the topology of the sequences encompassing early promoters A2c and A2b and late promoter A3 in a hairpin.'
