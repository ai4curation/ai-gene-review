  label: Bacillus phage phi29
description: Homodimeric sequence-specific DNA-binding transcriptional regulator (gp4, p4) of Bacillus phage phi29 that mediates the early-to-late transcriptional switch. It binds inverted-repeat sequences in the intergenic promoter region, induces a strong DNA bend, and interacts with both the alpha-subunit C-terminal domain of host Bacillus subtilis sigma-A RNA polymerase and the viral nucleoprotein p6 to activate the late A3 promoter while repressing the early A2b and A2c promoters.
