      slot: interpro2go
      requested_change: DELETE_VALUE
      asserted_value: GO:0016987
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        The same wrong claim arrives independently from InterPro: IPR008771 maps to
        GO:0016987 as well as to GO:0003899, and the family description still states that
        the protein "may function as a sigma-like component of the host RNA polymerase".
        Removing only the UniProt keyword would leave the row standing. The resource is
